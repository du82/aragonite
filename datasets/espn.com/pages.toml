title = "Laughter Permitted with Julie Foudy Show - PodCenter - ESPN Radio"
description = "Laughter Permitted with Julie Foudy is a fun, thoughtful, candid conversation with trailblazers in women\u0019s sports and beyond about the joy and chaos of li"
full_description = ".arclist-item { padding: 5px 8px; border-bottom: solid 1px #C2C2C2; } .arclist-item.last { border-bottom: none; } .arclist-item .arclist-play { float: left; padding-top: 5px; } .arclist-item h2, .arclist-item p{ margin: 0 0 0 120px; } Laughter Permitted with Julie Foudy Laughter Permitted with Julie Foudy is a fun, thoughtful, candid conversation with trailblazers in women\u0019s sports and beyond about the joy and chaos of life. Archived Podcasts BONUS EPISODE: How Ally's investment in women's sports is changing the game: 12/10/24 In a special bonus episode of Laughter Permitted, Ally Financial Chief Marketing and Public Relations Officer Andrea Brimmer and 3-time WNBA champion and Las Vegas Aces star Alysha Clark join the podcast to talk about the boom in women's sports, the impact Ally's 50/50 Pledge has had on the sports landscape and how Ally is supporting female athletes through its Team Ally program. Andrea breaks down the numbers on how investing in women's sports has been good for Ally's business (spoiler alert: women's sports fans are loyal!) and Alysha expresses what it's like being backed by Ally. Andrea and Alysha also share their hopes for women's sports going forward. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 143: Dr. Colleen Hacker Returns Again: 12/11/24 In the Season 12 finale, mental skills and peak performance expert Dr. Colleen \u001CFlash\u001D Hacker returns to Laughter Permitted with her signature joyful style to talk about habit formation, the role consistency plays in making meaningful change and the importance of finding our \u001Cwhy\u0019s\u001D for an action. Dr. Hacker walks us through the three components of a habit loop and then shares the five cues that go into forming a new habit. She explains how the anticipation of a reward eventually becomes the reward itself and gives guidance for inevitable regression (spoiler alert: we get to try again!). A fascinating and fun-filled conversation chockfull of actionable items you can start today. Do you have a question, comment or deep thought for Julie and Lynn? Email them at laughterpermitted@gmaiil.com. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 142: Napheesa Collier: 12/4/24 WNBA Defensive Player of the Year and two-time Olympic gold medalist and Minnesota Lynx superstar Napheesa Collier joins Laughter Permitted to talk about the 2024 WNBA Finals, how her demeanor on and off the court are very similar and why she co-founded Unrivaled, a new 3-on-3 basketball league featuring top WNBA players. Napheesa shares the non-negotiables that went into creating Unrivaled, the backstory of how it all started and what she\u0019s most excited about when it comes to the league tipping off. Plus, find out why Sylvia Fowles garnered Napheesa\u0019s cheer. In the close, Julie and Lynn make a pitch to join Unrivaled as wild card entries. Do you have a question or comment for Julie and Lynn? Email them at laughterpermitted@gmaiil.com. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 141: Emma Hayes Returns: 11/27/24 U.S women\u0019s national team head coach Emma Hayes returns to Laughter Permitted to talk about winning gold at the 2024 Paris Olympics, what went into shaping the team\u0019s culture in a short period of time and how gratitude factors into her current role. Emma also shares an exercise she did with the USWNT to cultivate trust and explains why it was important for her to connect the current team with The 99ers ahead of the Olympics. Plus, find out how Emma feels about returning to Wembley Stadium with the USWNT and how she hopes her story can uplift others to pursue their dreams. In Questions Permitted, Julie gives a longtime member of the Dope Village advice on being a new mom and both Julie and Lynn share where they turn to when they need some inspiration. Have a question or comment Julie and Lynn? Email them at laughterpermitted@gmail.com. Check out: Episode 104: Emma Hayes Episode 135: Sam Coffey Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 140: Sam Mewis Returns: 11/20/24 In a special NWSL-themed episode of Laughter Permitted, World Cup champion and 3-time NWSL champion Sam Mewis returns to the podcast to discuss and give her pick for the 2024 NWSL Championship between the Orlando Pride and Washington Spirit. Plus, we find out her reaction to the news that she's going to be an aunt, what the journey has been like at the helm of The Women's Game and what it\u0019s like being part of a movement of athletes covering women\u0019s soccer and sports. Dope Village! Do you have a question, comment or deep thought for Julie and Lynn? Email them at laughterpermitted@gmail.com. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 139: Patty Gasso: 11/13/24 Legendary University of Oklahoma softball coach Patty Gasso joins Laughter Permitted to talk about winning four straight national championships (and eight total), how culture is crucial in her program and what she enjoys most about coaching. Coach Gasso also shares how she had to step out of her comfort zone to become the highest paid coach in college softball and the significance of her salary in elevating the sport of softball. In Most Pressing Questions, Lynn correctly theorizes that Coach Gasso loves reality TV and even correctly picks which show she likes. In Questions Permitted, Julie and Lynn talk over nuance when it comes to the \"cheese or ice cream\" debate of all debates. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 138: Scout Bassett and Alana Nichols : 11/6/24 Paralympic superstars Scout Bassett and Alana Nichols join Laughter Permitted to celebrate the 50th anniversary of the Women's Sports Foundation and talk about their experiences serving as president of the Women's Sports Foundation, how sports came into their lives and their leadership styles. Plus, Scout, Alana and Julie share what they'd like to see for the future of women's sports. In the close of the show, Julie shares Lynn's favorite Billie Jean King story. Do you have a question, comment or deep thought for Julie and Lynn? Email them at laughterpermitted@gmail.com Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 137: Ashleigh Johnson: 10/30/24 Two-time Olympic gold medalist and water polo superstar Ashleigh Johnson joins Laughter Permitted to talk about how she was introduced to the sport of water polo, how she remains the only Black woman to compete for the U.S. in water polo at the Olympic level and how she hopes to be an example of what\u0019s possible in the sport and beyond. She also shares her perspective of the U.S. women\u0019s water polo team finishing fourth at the 2024 Paris Games and how she\u0019s embracing saying, \u001CYes,\u001D to new opportunities post-Olympics (which includes Fashion Week in New York City, hanging with Taylor Swift at the VMAs and more!). Plus, Ashleigh, who is considered the best goalkeeper in the world, dives into how her main goal is to simply \u001Cget the ball,\u001D which propels her to limits even she can\u0019t imagine. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 136: Sam Coffey: 10/23/24 Olympic gold medalist and Portland Thorns star Sam Coffey joins Laughter Permitted to talk about the experience of winning a gold medal at the 2024 Paris Olympics, what it was like being led by USWNT head coach Emma Hayes and how the joy was real during her Olympic journey. Plus, Sam shares how she dealt with the disappointment of not making the World Cup roster in 2023 and what it was like when, a year later, she found out she\u0019d made the Olympic team. Sam also delves into how she is intentional about living in the present moment and why she plays with her jersey tucked in. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 135: Taryn Kloth and Kristen Nuss: 10/16/24 Olympic beach volleyball pair Taryn Kloth and Kristen Nuss join Laughter Permitted to talk about what it was like competing at the 2024 Paris Games (from a rain-soaked Opening Ceremonies to playing in front of LeBron James), how they joined forces at LSU and the unique way they solidified their playing partnership through creating a brand and business called \u001CTKN.\u001D Hear the story of how Julie was in the stands during an epic match that Taryn and Kristen played in a lightning storm under the Eiffel Tower (LeBron has a role in the saga). Plus, find out how Taryn and Kristen continue to work on their communication, and learn which one of them is more likely to make a complete stop at a stop sign. In Questions Permitted, Julie offers a listener advice on the college recruiting process. Have a question for comment for Julie and Lynn? Email them at laughterpermitted@gmail.com. Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 134: Sarah Adam: 10/9/24 Paralympic silver medalist Sarah Adam joins Laughter Permitted to talk about her experience of competing in wheelchair rugby at the 2024 Paris Paralympics, what it was like being the first woman on the U.S. wheelchair rugby team and how the sport came into her life. Sarah also shares how her identity as an athlete helped her cope with a multiple sclerosis diagnosis at the age of 25, how she embraced adaptive sports and how she views her role as a professor of occupational therapy. Plus, the Lynn Game has a unique tiebreak, and Sarah tells the hilarious story of her close call with smack talking. In the close, a listener suggests Julie try a new flavor of ice cream. Email Julie and Lynn at laughterpermitted@gmail.com. They welcome questions, deep thoughts and jokes. Producer\u0019s Note: The Lynn Game is now three questions. The stakes have been raised! Learn more about your ad choices. Visit podcastchoices.com/adchoices Episode 133: The Dopies!: 10/2/24 Laughter Permitted is back! Julie and Lynn share highlights of Season 11 and hand out some Dopie Awards. Do you have question you'd like to get answered during Questions Permitted or a general comment to share with the hosts? Email Julie and Lynn at laughterpermitted@gmail.com. They also take jokes. Learn more about your ad choices. Visit podcastchoices.com/adchoices 2024 Paris Olympics Episode 7: 99ers legends celebrate USWNT's Olympic gold medal!: 8/10/24 After Julie blasts a Zoom link on the 99ers text thread, Mia Hamm, Kristine Lilly, Cindy Parlow Cone, Brandi Chastain, Michelle Akers, Joy Fawcett, Sara Whalen Hess, Saskia Weber, Shannon MacMillan and Tish Venturni Hoch join Laughter Permitted to celebrate the USWNT winning gold at the Paris Olympics. Mia shares what it was like being at the game, Cindy calls in from a bus headed to the team\u0019s party and Akers wants to suit up for Emma Hayes. Plus, Brandi joins the Zoom party a little late and then Julie's off to the postgame party to meet up with Mia and Cindy and hopefully karaoke. Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 6: Brandi Chastain and Julie are pumped as the USWNT goes for gold: 8/6/24 Two-time Olympic gold medalist Brandi Chastain and Julie dive into breaking down the USWNT\u0019s 1-0 win over Germany, preview the gold medal game against Brazil and give their predictions for the final. Plus, Brandi has a nickname idea for the U.S.\u0019s front three and Lynn gives her hot takes. Questions Permitted and Olympics Buzz are all about the fun, including ping pong, trampoline, Brandi's backyard Olympics, chocolate muffins in the Olympic Village and how Brandi and Julie once fought crime together. Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 5: Briana Scurry and Julie say every tourney needs a tough game as USWNT moves onto the semis: 8/3/24 After the USWNT's hard-fought 1-0 win over Japan, two-time Olympic gold medalist Brianna Scurry and Julie talk about how a tough game is part of the process in a tournament like the Olympics, how winning has a way of making everyone forget about the difficult moments and Bri shares what she would say to the USWNT before its upcoming semifinal game. In Olympics Buzz, Julie tells the story of how she made it to Eiffel Tower Stadium to cheer on the U.S. beach volleyball team of Kristen Nuss and Taryn Kloth, and Lynn has stats on how the U.S. women are dominating at the Paris Games. Do you have an Olympics questions? Email it to Julie and Lynn at laughterpermitted@gmail.com. Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 4: Shannon Boxx and Julie like what they see as the USWNT heads to Olympics quarterfinals: 7/31/24 Three-time Olympic gold medalist Shannon Boxx and Julie discuss what they like about the USWNT's start at the Olympics and give a full breakdown of the quarterfinals. As debate wages over a nickname for the frontline of Mallory Swanson, Sophia Smith and Trinity Rodman, Lynn weighs in with what she considers to be the answer. Plus, the Canadian spying scandal continues to unfold. In Olympics Buzz, talk turns to the U.S. rugby team winning bronze, U.S. gymnastics taking gold and how U.S. basketball looks strong. Have an Olympics questions? Send it to Julie and Lynn at laughterpermitted@gmail.com Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 3: Abby Wambach, Glennon Doyle, Julie and Lynn are LFG with the USWNT's win over Germany: 7/28/24 In a Dope Village/ Pod Squad crossover episode, two-time Olympic gold medalist Abby Wambach and The Soccer expert Glennon Doyle join Laughter Permitted to discuss what they're loving about the USWNT's 4-1 win over Germany in the Olympics. Abby and Julie like the tactics and tenacity while Glennon praises the steadiness of new head coach Emma Hayes, who she'd follow out of a burning building. In Olympics Buzz, talk turns to Celine Dion, the U.S. beach volleyball team of Kristen Nuss and Taryn Kloth and how Simone Biles is everything. Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 2: Heather O'Reilly and Julie give the pluses and minuses of the USWNT's win over Zambia: 7/26/24 With the Paris Games officially underway, three-time Olympic gold medalist Heather O'Reilly - a.k.a. HAO! - joins Laughter Permitted to talk all things Olympics, including winning gold with Julie at the 2004 Athens Games. Heather and Julie have a lively discussion about Team Canada's use of a drone to spy on opponents - yikes! - and then they dive into analysis of the USWNT's 3-0 win over Zambia. Plus, find out what Heather is manifesting these Olympics. Producer's Note: This episode was recorded before news broke of Canada women's national soccer team head coach Bev Priestman being removed from the Canadian Olympic team. Learn more about your ad choices. Visit megaphone.fm/adchoices 2024 Paris Olympics Episode 1: Julie and Lynn preview top storylines of the 2024 Paris Summer Olympics: 7/24/24 With the 2024 Paris Summer Olympics"
