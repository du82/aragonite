description = "It's combine week, and Mel Kiper Jr. is projecting landing spots in Round 1 for the 2025 draft class's top prospects, including standout Travis Hunter."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ 2025 NFL mock draft: Mel Kiper's Round 1 pick predictionsWhere could Will Johnson, Travis Hunter, Azareye'h Thomas and Josh Simmons land in Round 1? ESPN IllustrationMel Kiper Jr.Feb 25, 2025, 06:15 AM ETCloseMel Kiper Jr. has served as an NFL draft analyst for ESPN since 1984. He is a regular contributor on "SportsCenter," ESPN studio shows and ESPN Radio. He is the co-host of the First Draft podcast, and he writes regularly for ESPN+.EmailOpen Extended ReactionsIt's combine week, which means we'll get a good look at some of the best players in the 2025 NFL draft class on the field in Indianapolis. Some prospects are already clear first-round talents, but others come in with something to prove. To get a sense of how the board stacks up ahead of the workouts, I'm projecting all 32 picks in Round 1.I have two quarterbacks in this updated mock draft, no change from my January set of predictions. But there are a few big risers at other positions, especially in the trenches. We're getting a better idea of the strengths of this class as we get closer to the draft (which begins April 24), but things will continue changing. The combine, in particular, will obviously boost some players' stocks. Pro days and more interviews follow after that. And with free agency ready to kick off in two weeks, positional needs will pivot. (I'm also not projecting any trades right now; it's still too early to gauge which teams could move up on draft day.)Here's my current thinking on how Round 1 could look based on what I'm hearing from execs, scouts and coaches in the league. And for more on the 32-pick predictions, check out the "SportsCenter Special" on the picks.See more from : Kiper's Big Board | Latest mock draftsJump to a team's first-round pick: ARI | ATL | BAL | BUF | CAR | CHI | CIN CLE | DAL | DEN | DET | GB | HOU | IND JAX | KC | LAC | LAR | LV | MIA | MIN NE | NO | NYG | NYJ | PHI | PIT | SF SEA | TB | TEN | WSH1. Tennessee Titan