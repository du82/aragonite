["https://espn.com/nba/story/_/id/44013653/joel-embiid-season-philadelphia-76ers-knee-injury"]
title = "Joel Embiid out for season: Impact for 76ers, future - ESPN"
description = "Joel Embiid will continue to look for a solution to his left knee injury. What does it mean for the Philadelphia 76ers' draft and free agency plans?"
full_description = '''Joel Embiid out for season: Impact for 76ers, futureplayStephen A. on Embiid: 'Should you consider retiring?' (1:36)Stephen A. Smith believes Joel Embiid's debilitations are strong enough for the center to possibly consider retiring from the NBA. (1:36)ESPN InsidersFeb 28, 2025, 05:51 PM ETEmailPrintOpen Extended ReactionsAfter the Philadelphia 76ers officially ruled out big man Joel Embiid for the season, ESPN's NBA insiders are breaking down how the 2023 MVP and Philly got here, plus what's next for all sides.Joel Embiid was in the midst of one of the most dominant scoring seasons in NBA history before Golden State Warriors forward Jonathan Kuminga accidentally fell onto his left leg on Jan. 30, 2024. Prior to that moment, Embiid had scored more points than minutes played in the 2023-24 season, something no player had accomplished since Wilt Chamberlain more than 60 years ago.Embiid had a procedure on that left knee a short time later, and it has remained a constant source of trouble for him for the past calendar year, up to when he and the Philadelphia 76ers decided Friday that his 2024-25 season was done.While Embiid came back near the end of the 2023-24 regular season and played in Philadelphia's six-game loss to the New York Knicks in the first round of the playoffs, he was clearly less than 100%. (It was exacerbated by him dealing with a bout of Bell's palsy during that series, too.)Editor's PicksEmbiid to miss remainder of season due to knee13hShams Charania and Ramona Shelburne76ers' woes continue as Gordon has wrist surgery2d76ers' George: Podcast on pause 'to focus on here'3dTim Bontemps2 RelatedYet, Embiid was still a force in that series, averaging 33.0 points, 10.8 rebounds and 5.7 assists per game. That performance was encouraging enough that Embiid was expected to put up a strong performance for Team USA in the Paris Olympics before being ready to go for training camp in the fall. But while Embiid did win a gold medal with Team USA, he struggled for large portions of the run while playing with a bulky brace on his left knee -- though he did have a strong performance in the fourth quarter of the team's legendary semifinal comeback against Nikola Jokic and Serbia.Embiid arrived for training camp unable to get started on time. What initially was expected to be a few-day ramp-up quickly morphed into a few weeks, with Embiid eventually making his season debut on Nov. 12 against the Knicks.By then, Philadelphia was 2-8. In fact, Embiid didn't play in a win until Dec. 8, when he returned after a seven-game absence to help the 76ers beat the Chicago Bulls. They then ripped off eight wins in 12 games -- including going 7-2 when Embiid played -- highlighted by a win in Boston on Christmas.After a win at the Brooklyn Nets on Jan. 4, the 76ers stood at 14-19 and were a game back of the Bulls for the final East play-in spot. Embiid then missed the next month with both a foot sprain and the ongoing knee issues. He finally returned a month later in a win over the Dallas Mavericks on Feb. 4.That was the final win Embiid played in. Philadelphia dropped his final five games of the season, including Saturday's two-point loss to the Nets that saw him spend the fourth quarter watching from the bench. The team remains mired in an eight-game losing skid, continuing a theme from throughout the season that saw Philadelphia consistently struggle with him on the court for the first time since his rookie year. -- Tim BontempsWhat to expect from the 76ers for the rest of this season?To this point, the 76ers have yet to say anything other than they're going to try to keep winning and attempt to make the postseason. But that was also before this news, as Embiid officially being shut down culminates a disastrous season for himself and the franchise.Breaking News from Shams CharaniaDownload the ESPN app and enable Shams Charania's news alerts to receive push notifications for the latest updates first. Opt in by tapping the alerts bell in the top right corner. For more information, click here. Friday's news will undoubtedly lead to questions about how much longer Paul George will keep playing this season. But, more than anything, this decision will now turn all attention to Philadelphia's top-6-protected first-round pick, the remnant of the 2020 deal that sent Al Horford to Oklahoma City for Danny Green.The 76ers currently sit in sixth in the lottery -- which gives them less than a 50% chance of keeping their pick. Will they lean into that path, and try to maximize their chances of keeping it, or instead keep trying to win? At this point, it's fair to wonder if it matters either way.But with star rookie Jared McCain already sidelined for the season with meniscus surgery, there isn't much for 76ers fans to latch on to right now. Instead, they'll spend their nights keeping tabs on the prospects from this year's draft class and wondering if after a season that has felt cursed in many ways, the 76ers will get some lucky bounces of the pingpong balls for June's draft. -- BontempsJoel Embiid played in just 19 of Philadelphia's 58 games so far this season. At 20-38, the Sixers are 12th in the East. Bill Streicher/Imagn ImagesWhat is Embiid's timetable to return to the court?Embiid has had two knee surgeries on his left meniscus, both on the lateral (outside) of it. The first was in 2017, the second in 2024. In both procedures, doctors hoped that clipping off the injured portion of the meniscus would create long-term healing. But when two separate surgeries on the same area did not create a lasting fix, doctors have to look at more novel approaches, and that's where we are now.Embiid experienced pain and swelling in his knee throughout this season. It was unpredictable, sources said, sometimes coming after a good workout or game. That indicates there might be something else amiss with the meniscus or his alignment. His options could be surgical -- another meniscus repair or a meniscus transplant, or even what's called an osteotomy, in which doctors break a bone to realign his body, according to medical experts consulted by ESPN who have not examined Embiid directly.Those are more radical options that could warrant a lengthy recovery time that could stretch into next season.Embiid has already received various injections into the knee to promote healing and recovery, but medical experts say there are other, less invasive procedures he could still try. -- Ramona ShelburneWhere do the 76ers stand in the lottery race?As noted, Philadelphia currently has the NBA's sixth-worst record at 20-38, but there's room to drop even further. The 76ers can't realistically catch any of the three bottom teams. At the low end, the Charlotte Hornets and Utah Jazz (both 14-44) are on pace for just 20 wins but are unlikely to reach that total given teams tend to fade more late in the regular season as players are shut down due to injury and young reserves get more minutes. The Washington Wizards, at 10-48, would have to catch fire to hit 20 wins.2025 NBA draft • New Top 100 rankings! Risers, fallers • 15 questions for 15 freshmen prospects • Two-round mock: Intel, scouting reports • How trade deadline set up 7 lottery teams • Execs weigh in on Cooper Flagg | His rise • Top international players to know | More The Sixers could realistically fall below the New Orleans Pelicans, who have won three in a row and are currently 4½ games back of the Sixers in the overall standings. So long as Zion Williamson is healthy and playing at an All-Star level -- he has averaged 26.3 PPG on 62% shooting since Jan. 25 and recorded his first career triple-double on Thursday -- the Pelicans are better than the current Philadelphia team.The Toronto Raptors, currently fifth in the lottery standings, are a wild card. The Raptors are 3-9 since a five-game winning streak in late January, and newly acquired Brandon Ingram still has no timetable for his return from a severe ankle sprain. The Sixers are 2½ games ahead of Toronto in the standings.Going behind just one team would have an enormous impact on Philly's chances of keeping its pick. The No. 5 seed in the lottery gets a top-six pick 64% of the time, compared to 46% for the No. 6 seed. And if the 76ers can finish behind both New Orleans and Toronto as the No. 4 seed, their chances of picking in the top six would increase all the way to 81%. -- PeltonHow does the injury impact Embiid's contract?Unlike the five-year, $146.6 million extension Embiid signed in 2017 that protected the 76ers in case he suffered a significant injury, there is no such provision in either his current contract or the extension set to begin in 2026-27.Embiid is owed $248.1 million over the next four seasons ($55.2M, $59.5M, $64.3M, $69.1M), all of which is guaranteed. The only way for the 76ers to get cap relief in future years would be if Embiid's knee issues are deemed to be career-ending.The determination on whether Embiid suffered a career-ending injury would be made by a physician selected by the NBA and the players' association. If that's the case, then starting on Feb. 22, 2026 (one year from the last game Embiid played), Philadelphia could apply to the NBA to have Embiid's salary for the years of his contract removed from its cap sheet. The Sixers would also have to waive Embiid.If the injury is not determined to be career-ending but is significant enough that Embiid would miss all of the 2025-26 season, then the 76ers could apply for a disabled player exception that would be worth the same as the non-taxpayer midlevel exception (since 50% of Embiid's salary is higher than that mark).What's the effect on any 76ers free agency plans?The 76ers committed $800 million last offseason to Embiid, George and Maxey and are likely locked into their trio for the foreseeable future. The three players are set to earn a combined $146 million in 2025-26, which is 77% of Philadelphia's projected payroll.How much flexibility the 76ers have to add in free agency will be determined by the lottery in May and the player options of Kelly Oubre Jr., Andre Drummond and Eric Gordon, who will miss the remainder of the season after wrist surgery. The first-round slot and salaries for those three players total $25 million.If Philadelphia retains its first-round pick and all three veterans opt in prior to June 29, it will be $2 million below the luxury tax before free agency begins. The 76ers would then be allowed to use most of their $14.1 million non-tax mid-level exception to re-sign free agent Guerschon Yabusele.Besides Yabusele, the big addition is likely to come with a healthy McCain and the potential lottery pick. McCain was averaging 15.3 points before he suffered a season-ending left knee injury in December. -- MarksJoel Embiid, Paul George and Tyrese Maxey only played a total of 15 games together this season. The 76ers were 7-8 in those games. Mitchell Leff/Getty ImagesWhat does this mean for the futures of George and Maxey?George was the top free agent available this past summer, and landing him was supposed to launch the 76ers back toward the top of the East. Instead, George's tenure with the 76ers has never gotten off the ground.The veteran swingman was coming off one of his best seasons with the LA Clippers but has seen his production drop across the board in Philly. His average of 16.1 points per game is his lowest since his second season in the league, and he's shooting just 42.9% overall. To say his production has fallen short of the four-year, $212 million deal he signed this summer is a massive understatement.Perhaps a full offseason to get his legs back under him will lead to a different outlook and performance next season, but this was a contract handed to a player who is turning 35 in May that was already expected to look rough in its final years. It was signed to deliver instant production. Instead, it was an instant failure.Maxey, meanwhile, has bounced back from a slow start to essentially replicate his All-Star season from a year ago, and he remains the bridge to whatever the future of this franchise is moving forward. The 24-year-old guard is already seen as a leader in the locker room, and that role is only going to increase in the years to come. The question becomes what the rest of the roster is going to look like around him, as he's the only player who seems certain to be a factor for the 76ers moving forward. -- BontempsFantasy implications to Embiid's being ruled outEmbiid has the highest usage percentage on the 76ers, with 34.6% of the possessions when he's on the court ending in either a shot, an assist or a turnover. He also leads the team with 8.4 RPG. This means that Embiid's absence will open up a plethora of possessions and offensive and rebounding stat opportunities for other 76ers to fill. Maxey is likely to make the biggest statistical leap without Embiid. In 16 games with Embiid this season, Maxey has averaged 23.8 PPG on 17.8 FGA, but in 34 games without Embiid those numbers leap to 28.8 PPG on 22.9 FGA. Maxey projects as a top-10 fantasy producer for the rest of the season.The other 76ers player most likely to increase his production moving forward is Yabusele. He averaged 9.5 PPG, 5.1 RPG and 1.2 3PG in 18 games with Embiid this season, but in Embiid's last extended injury absence from Jan. 6 through Feb. 2, Yabusele averaged 14.3 PPG, 6.9 RPG and 1.7 3PG.Available in 91.3% of ESPN fantasy leagues, Yabusele projects to a top-100 fantasy producer/nightly flex starter as the 76ers' starting center for the rest of the season.If Embiid is ready for the start of next season, he projects as a high-risk third-round pick in fantasy hoops leagues. When healthy, Embiid has top-three-overall fantasy hoops upside. But he has never played more than 68 games in any season in his career and has now missed 106 of a possible 164 games in the past two seasons. It will be risky to spend a high draft pick on him, but his upside will likely still get him picked in the top 30 of most fantasy hoops drafts. -- André Snellings (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Base'''
