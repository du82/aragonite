["https://espn.com/mens-college-basketball/insider/story/_/id/44041356/ranking-every-men-ncaa-tournament-champion-2000"]
title = "Ranking mens NCAA tournament champions since 2000 - ESPN"
description = "From Michigan State in 2000 to UConn's five title teams through 2024, let's stack this century's champions."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ How this century's NCAA tournament champions stack upWhere does the 2001 Duke Blue Devils team that featured Shane Battier and Jay Williams rank in our all-time list? AP Photo/Ed Reinke, FileMyron MedcalfFeb 28, 2025, 10:15 AM ETClose Covers college basketball Joined ESPN.com in 2011 Graduate of Minnesota State University, MankatoFollow on XEmailOpen Extended ReactionsOver the past 25 years, the men's NCAA tournament has been the most exciting event in sports. Yeah, we're biased. But once March arrives, college basketball takes center stage, and it rarely disappoints.That's why we've decided to take a shot at ranking all 24 champions of the past 25 years -- based on their entire seasons. (Remember, the 2020 NCAA tournament was canceled due to COVID-19.) Once we crown another champion in San Antonio on April 7, we'll find a spot for that team on this list, too.We tried to use a combination of real data and the eye test. One thing is certain though: You'll either love this or hate this.Here are the top 24 champions of the last quarter century, beginning with the 1999-2000 season.24. 2014 UConn HuskiesRecord: 32-8 How they won: def. Kentucky, 60-54 NCAA tournament margin of victory: 7.8 PPG KenPom net rating: +22.13 (15th in the nation) Non-tourney achievements: Finished third in the AAC regular season Best player: Shabazz Napier (AP All-America first team, NCAA tournament Most Outstanding Player)In the weeks leading up to their national championship run, the Huskies lost twice to Louisville -- the eventual American regular season and champion -- by a combined 43 points. The 7-seed Huskies did not look like contenders in Kevin Ollie's second season as head coach. But Napier averaged 21.1 PPG for six straight games and led a squad that made 39% of its 3-point attempts and forced turnovers on one-fifth of its opponents' possessions during that stretch, which included beating three top-3 seeds. These Huskies, coached by Kevin Ollie weren't legendary, but they were certainly fun to watch win it all. ESPN + Continue reading this article and more from top writers, for only $11.99/mo. Continue Reading Already an ESPN+ subscriber? Log in here. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://www.espn.com/espn/corrections"}]}]'); needConsent = 'false'; } catch (e) { console.log(e); } window.espn.footerLinks = footerLinks || {}; window.espn.needConsent = needConsent || false })(); Terms of UsePrivacy PolicyYour US State Privacy RightsCh