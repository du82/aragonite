title = "2025 NBA draft big board rankings: Top 100 prospects - ESPN"
description = "Duke's Cooper Flagg maintains his hold on No. 1, but there's change among the top 10 with some of college basketball's stars moving up."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ 2025 NBA draft big board rankings: Top 100 prospectsTre Johnson, the Longhorns' 18-year-old shooting guard, has made a huge leap in ESPN's Top 100 rankings ahead of the 2025 NBA draft. Nelson Chenault-Imagn ImagesJonathan GivonyMar 1, 2025, 07:00 AM ETCloseNBA draft analyst and writer Joined ESPN.com in July 2017 Founder and co-owner of DraftExpress.com, a private scouting and analytics service used by NBA, NCAA and international teamsFollow on XEmailOpen Extended ReactionsWhile there has been little movement among the top four of ESPN's Top 100 big board -- including Duke's Cooper Flagg securing the No. 1 spot throughout the 2024-25 men's college basketball season -- a new player has snuck in at No. 5.Texas freshman Tre Johnson has had an impressive February, averaging 26 points a game, and has elevated his standing significantly in this latest update. Counting on their star guard, the Longhorns are fighting to keep their NCAA tournament hopes alive and that continues with Saturday's game against Georgia (8 p.m. ET, ESPN2).This NBA draft class has lived up to expectations as one of the most talented in recent memory, even if elite prospects such as Rutgers duo Ace Bailey and Dylan Harper could miss out on the Big Dance. With Selection Sunday (March 16) just weeks away, ESPN draft analysts Jonathan Givony and Jeremy Woo update who is rising and falling among our Top 100 ranking ahead of the 2025 NBA draft.Check back between now and June on the players making the best cases to be NBA first-round picks.Notes: True shooting percentage (TS%) is a formula that blends field goal percentage with free throw shooting and 3-point shooting into one catchall ratio. PR = previous ranking in ESPN's Top 100.Last updated: March 1 NBA draft coverage: 15 freshmen, 15 questions | 2025 mock draft Peterson or Dybantsa? Debut of 2026 mock More draft news1. Cooper Flagg, SF/PF, DukeHeight: 6-9 | Age: 18.1 | TS%: 60.7% | PR: 1 ESPN + Contin