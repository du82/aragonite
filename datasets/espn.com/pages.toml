["https://espn.com/nba/insider/story/_/id/43947562/nba-intel-scouts-execs-report-cards-luka-butler-fox-deals"]
title = "NBA intel -- Scouts, execs' report cards on Luka, Butler, Fox deals - ESPN"
description = "Three weeks after trade season shook the league, NBA insiders are still buzzing about Doncic, Butler, Fox and more deals -- and what could be next for each star."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ NBA intel: Scouts, execs' report cards on Luka, Butler, Fox dealsLuka Doncic and the Lakers were the talk of the trade deadline. Three weeks later, nothing has changed. Which other superstar deals have scouts, execs and GMs still buzzing? Sean M. Haffey/Getty ImagesTim BontempsCloseTim BontempsESPN Senior WriterTim Bontemps is a senior NBA writer for ESPN.com who covers the league and what's impacting it on and off the court, including trade deadline intel, expansion and his MVP Straw Polls. You can find Tim alongside Brian Windhorst and Tim MacMahon on The Hoop Collective podcast.Follow on XBrian WindhorstCloseBrian WindhorstESPN Senior WriterESPN.com NBA writer since 2010 Covered Cleveland Cavs for seven years Author of two booksFollow on XFeb 28, 2025, 07:00 AM ETEmailOpen Extended ReactionsThree weeks ago, we witnessed arguably the most remarkable trade deadline in NBA history. The headliner was the shocking swap of Luka Doncic and Anthony Davis, but the deal that no one saw coming was far from the only league-altering transaction.Among them: The monthslong Jimmy Butler III-Miami Heat saga ended with a deal to the Golden State Warriors. De'Aaron Fox's trade request from the Sacramento Kings was granted, creating what Victor Wembanyama and the San Antonio Spurs hope will be their next championship duo. The Milwaukee Bucks traded former All-Star Khris Middleton and acquired Kyle Kuzma in a deal to bolster their playoff run. The NBA-leading Cleveland Cavaliers made a move on the margins, adding wing De'Andre Hunter to better match up with the defending champion Boston Celtics.In our weekly look around the NBA, we asked league scouts, execs and general managers to evaluate how all the new players have looked in their respective homes and what the future holds for all the various teams involved during the push to the postseason.Jump to a section: Why the Lakers 'annihilated the deadline' Butler add resembles former Fi