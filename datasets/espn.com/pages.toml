title = "Iowa State gives AD Jamie Pollard 5-year extension - ESPN"
description = "Jamie Pollard, the Iowa State athletic director since 2005, has received a five-year contract extension through 2030, the university announced Friday."
full_description = '''Iowa State gives AD Jamie Pollard 5-year extensionAssociated PressFeb 28, 2025, 03:53 PM ETEmailPrintOpen Extended ReactionsAMES, Iowa -- Jamie Pollard, the Iowa State athletic director since 2005, has received a five-year contract extension through 2030, the university announced Friday.The Cyclones have had unprecedented success in the major sports in 2024-25. The football team had its first 11-win season and the ninth-ranked men's basketball team has been in the top 10 all season and achieved its highest ranking since 1956-57 when it reached No. 3 in December.Terms of Pollard's contract will be announced later, the school said."I am humbled to have had the opportunity to lead our athletics program for the past 20 years," said Pollard, who thanked the administration for its support. "We have an amazing culture in our athletics program, led by our talented and dedicated coaches and staff. Although our industry is undergoing transformational change, I am confident our department will successfully embrace these challenges with the same energy and urgency that has proven to be successful in the past."Pollard, the nation's third-longest serving Power 4 athletic director, has overseen $340 million in new construction and facility renovations. Since 2011-12, and excluding the 2020-21 pandemic year, ISU is the only school in the nation to have average attendances over 50,000 in football, 12,000 in men's basketball and 9,000 in women's basketball. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href