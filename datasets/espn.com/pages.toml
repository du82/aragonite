["http://www.espn.com/olympics/swimming/story/_/id/44059907/usa-swimming-says-delaware-ad-chrissi-rawak-not-assume-role-ceo-president"]
title = "USA Swimming says Delaware AD Chrissi Rawak won't assume CEO role - ESPN"
description = '''USA Swimming's board of governors says Delaware athletic director Chrissi Rawak will not assume the role as CEO and president because of "unforeseen personal circumstances that we learned about late this week."'''
full_description = '''USA Swimming says Delaware AD Chrissi Rawak won't assume CEO roleAssociated PressFeb 28, 2025, 08:57 PM ETEmailPrintOpen Extended ReactionsCOLORADO SPRINGS, Colo. -- USA Swimming's board of governors said Friday night that Delaware athletic director Chrissi Rawak will not assume the role as CEO and president because of "unforeseen personal circumstances that we learned about late this week."USA Swimming made the move nine days after announcing Rawak's hiring. The governing body said Shana Ferguson remains interim CEO."While this outcome is not what we expected or hoped for, we maintain the utmost confidence in the strength of our organization, leadership team, staff, and strategic direction," USA Swimming said.Rawak was set to fill the spot previously held by Tim Hinchey, who left last year shortly after the Paris Games.Rawak was named Athletic Director of the Year in 2024 by a national group of ADs. She spearheaded a $38 million fundraising campaign for the construction of an athletic department facility.Before Delaware, Rawak was an executive in the Michigan athletic department. She also was on the Michigan swimming and diving team and served as an assistant coach for the program from 1992 to 1997. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/curre