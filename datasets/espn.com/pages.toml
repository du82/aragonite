title = "Kansas' Mayo shares racist, threatening posts made on social - ESPN"
description = "Social media posts directed at KU basketball player Zeke Mayo included threats of violence, wishes that he killed himself and racist comments, according to screengrabs he shared Saturday."
full_description = '''Kansas' Mayo shares racist, threatening posts made on socialESPNMar 1, 2025, 09:23 PM ETEmailPrintKansas men's basketball player Zeke Mayo said he was the target of hateful social media posts following the Jayhawks' 78-73 home loss to No. 10 Texas Tech on Saturday.Mayo scored just five points on 1-of-7 shooting in the game, one of several the senior guard has struggled in in recent weeks.Afterward, he took to social media to apologize for his performance, writing: "I 100% deserve all the criticism in the world. My performance was beyond pitiful today, and has been for a while now. I work my ass off everyday to be great, but I can't be perfect all the time. I'm sorry to our fans and my teammates, I will continue to get better."As part of the post, Mayo then attached four screengrabs that appeared to be sent to him via direct message on Instagram after the game. Among them were threats of violence, racist comments and wishes for him to die.Jayhawks senior guard Dajuan Harris Jr. expressed support for his teammate on social media, writing: "It ain't nothing to explain brotha I got yo back."Kansas athletic director Travis Goff did the same."These aren't Jayhawks. They're not ours," Goff wrote. "Driven by gambling and hate. They've never competed a day in their life."To Zeke and all our guys -- the Jayhawk family loves you and will always ride with you through thick and thin."The Jayhawks dropped to 19-10 overall and 10-8 in the Big 12 with the loss. It was their third home defeat of the season, their most since 2017-18, and it's the second straight campaign they've lost at least eight games in the conference.Mayo entered the matchup averaging 14.3 points. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wa