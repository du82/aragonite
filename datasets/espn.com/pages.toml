title = "Fantasy basketball picks and betting tips for Saturday - ESPN"
description = "Jim McCormick breaks down Saturday's games and offers his top fantasy streamers and favorite bets for the night."
full_description = '''Fantasy basketball picks and betting tips for SaturdayTyrese Maxey should have an opportunity to take over as the primary scorer for the 76ers with Joel Embiid out for the season. Photo by Al Bello/Getty ImagesJim McCormickMar 1, 2025, 12:00 PM ETCloseJim McCormick is a contributing writer for fantasy football and men's basketball at ESPN.Follow on XEmailPrintOpen Extended ReactionsMarch opens with six interesting NBA matchups. While we learned on Friday that Joel Embiid will miss the rest of the season due to a lingering knee injury, we do get to see Stephen Curry make his annual stop in South Philly tonight in a game that airs on ABC. The question is how many deep 3-pointers will Curry hit?The most encouraging offensive climate is found in Tennessee tonight, with the Memphis Grizzlies hosting the San Antonio Spurs in a contest with a total north of 240 points. Both teams are top eight in pace the past 10 games, with Memphis nearly leading the league during this sample, suggesting added possessions. Identifying a game that could include a good deal of additional opportunities helps when seeking DFS options and player props. We identify two streaming candidates from this game in the section below.Finding a compelling angle for a tilt between the Washington Wizards and the Charlotte Hornets, two teams with a combined 24 wins, begins with the Wizards' young backcourt. It's been difficult to find much value on the Hornets this season, but Washington has recently turned over the offense to rookie guards Keyshawn George and Bub Carrington. Don't be surprised if this duo delivers fun fantasy results this evening.Let's delve deeper into these matchups and uncover the most promising opportunities for this Saturday of hoops.What you need to know for Saturday's gamesKeldon Johnson, SF/PF (Rostered in 26.0% of ESPN leagues)The loss of Victor Wembenyama clearly changed the trajectory of the Spurs' season. It also changed Johnson's role; he's become a key scoring option in recent games after spending much of the season as a complementary piece. The big total in Saturday night's game and the fact Memphis is on the second leg of a back-to-back add to the upside. It's also worth looking at Santi Aldama from the Memphis frontcourt if he's still available in your league.Brandin Podziemski, SG/PG, Golden State Warriors (32.5%)Sign up for free fantasy baseballThe 2025 fantasy baseball season is here! Get the group together, or start a brand new tradition. Join or start a league for free >> While his value would leap if Butler is ruled out, Podziemski has proven productive in several different lineup looks lately. His ability to find production as a glue guy has been valuable. Without the need for tons of shots to deliver a good line, Podziemski has some of the better rebounding results for a guard in the league. The 76ers, meanwhile, are smaller in the backcourt and among the worst rebounding teams in the league.Malik Beasley, SG, Washington Wizards (37.7%)A true specialist, Beasley leads the entire league with 239 3-pointers, just ahead of Anthony Edwards and Stephen Curry. He's also a true specialist in that you can't expect much production outside of those columns. It helps that the Brooklyn Nets are an ideal opponent for Beasley given the floor-spacing that will likely surface in this matchup.Day'Ron Sharpe,C, Brooklyn Nets (5.4%)There is some risk present with Sharpe, and really any player on the Nets. The team just isn't running out consistent rotations and lineup looks, but Sharpe has thrived when given real work. Just look at the massive double-double he produced against the Thunder recently. If the minutes are there, the numbers should be too.McCormick bets for SaturdayTyrese Maxey over 34.5 combined points and assists (-110)With Joel Embiid out, Tyrese Maxey will see increased usage -- but also more defensive attention. However, the Warriors lack elite point-of-attack defenders, making it difficult for them to contain Maxey when he's on the move. Even with Philly positioned as sizable underdogs, Maxey has the ability to shift into a playmaking role whenever Golden State applies extra pressure. He has averaged 11.1 potential assists over his past 10 games while still putting up more than 26 points per game, giving him multiple avenues to impact the game offensively.Editor's PicksRisers and fallers: Ty Jerome, Bol Bol trending up1dSteve AlexanderEmbiid's season is done: What's next for him, the 76ers and their offseason plans?1dESPN InsidersFantasy basketball: Don't be surprised if ... we never see the old Joel Embiid again3dEric Karabell2 RelatedFred VanVleet over 7.5 combined rebounds and assists (-140)It's difficult to gauge Fred VanVleet's price given that this is his first game back after an extended injury absence. However, with the veteran guard expected to play a significant role in his return, I'm willing to take on the number, which seems fairly aligned with his usual production. There is some risk of a restricted workload, but that concern also appears to be factored into the line. Additionally, I'm eyeing Zach LaVine over 7.5 rebounds and assists at this same price, making for a compelling same-game parlay for those looking to add more action.Kyle Kuzma over 18.5 combined points and assists (-115)The Bucks have struggled on the road, but the focus here isn't on Milwaukee's road woes -- it's on Kyle Kuzma's ability to generate offense. Kuzma has surpassed this line in three of his past four games, showing an increased offensive role, particularly with Bobby Portis out due to suspension. His expanded workload gives him multiple opportunities to hit this mark against a Dallas team that has had its own defensive inconsistencies. Given his recent form and the necessity for added scoring, Kuzma has several clear paths to covering this line.Projections and Injury ReportsBasketball Power Index by ESPN Analytics. Injury aggregation by Rotowire.com. Odds by ESPN BETPlayers in