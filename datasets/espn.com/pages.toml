["http://www.espn.com/golf/story/_/id/44062470/lydia-ko-takes-third-round-lead-lpga-singapore"]
title = "Lydia Ko cards 68 to take third-round lead at LPGA Singapore - ESPN"
description = "Lydia Ko shot a 4-under 68 to move from one stroke behind to one stroke in front after three rounds of the HSBC Women's World Championship."
full_description = '''Lydia Ko cards 68 to take third-round lead at LPGA SingaporeAssociated PressMar 1, 2025, 01:57 AM ETEmailPrintOpen Extended ReactionsSINGAPORE -- Lydia Ko shot a 4-under 68 on Saturday to move from one stroke behind to one stroke in front after three rounds of the HSBC Women's World Championship.The 27-year-old South Korean-born New Zealander had a 54-hole total of 10-under 206 on the Tanjong course at Sentosa Golf Club.Charley Hull, who birdied two of her first four holes, was a stroke behind in second after a 68. Jeeno Thitikul had the best round of the day, a 66, to move into third place, three strokes behind Ko.A Lim Kim, who led after the first two rounds, moved in the wrong direction with a 73 and was tied for fourth place, four strokes off the lead. Defending champion Hannah Green had a 67 to move 16 places up the leaderboard and was five behind Ko.Ko had three bogeys with seven birdies, including four on her back nine."I made a few mistakes, but I was able to bounce back with a few good birdies as well," said Ko, the former world No 1. "It really doesn't matter what the context is, as long as you can put a good score, and under the circumstances, I felt like I playing really solid. So hopefully these past few days will give me good rhythm for tomorrow."Ko is chasing her 23rd LPGA title and looking to finally break through in Singapore in 11 appearances. Her best result at the tournament was a runner-up finish in 2015.Hull is seeking to win her third LPGA tournament."My mindset is going to be no different from literally the last three days," Hull said. "Just go out there, play golf, hole some putts and have fun."The Singapore tournament is the second of three events on the LPGA's first Asian swing of the year. The final event will be played next week at Hainan Island, China. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. 