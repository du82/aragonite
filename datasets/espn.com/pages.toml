["http://www.espn.com/olympics/skiing/story/_/id/44064782/emma-aicher-edges-lauren-macuga-1st-world-cup-downhill-victory"]
title = "Emma Aicher edges Lauren Macuga for 1st World Cup downhill victory - ESPN"
description = "German skier Emma Aicher won a World Cup downhill on Saturday for her first victory, one day after she earned the first podium result of her career."
full_description = '''Emma Aicher edges Lauren Macuga for 1st World Cup downhill victoryAssociated PressMar 1, 2025, 07:04 AM ETEmailPrintOpen Extended ReactionsKVITFJELL, Norway -- German skier Emma Aicher won a World Cup downhill Saturday for her first victory, one day after she earned the first podium result of her career.Following a flawless second part of her run on the Olympiabakken course, Aicher edged out Lauren Macuga by 0.03 seconds, denying the American what would have been her first downhill triumph.Aicher, who wore bib 16 and started after most top-ranked downhillers had raced, brought both hands to her mouth in apparent disbelief when she saw her time at the finish.The 21-year-old German prodigy, who competes in all four Alpine disciplines, was runner-up to winner Cornelia Huetter in Friday's downhill. The Austrian placed third Saturday, 0.19 behind.It was the first downhill victory for the German women's ski team since Viktoria Rebensburg won a home race in Garmisch-Partenkirchen in February 2020.Macuga's second place marked another highlight of her breakout season. It came less than two months after she won a World Cup super-G and three weeks after taking bronze in super-G at the world championships.Her previous best in downhill was fourth, at a race in Beaver Creek, Colorado, in December.Downhill world champion Breezy Johnson finished 0.62 off the lead in 10th, after she was third in Friday's race.Johnson was halted at the start for several minutes as course workers needed to repair the safety netting following a crash from the previous starter, Germany's Kira Weidle-Winkelmann.Lindsey Vonn was 0.95 off the pace in 16th in her ninth race since her comeback this season at the age of 40 with a new titanium knee after six years away from racing.Huetter, who won the downhill title last season, closed the gap on leader Federica Brignone in the discipline standings to 16 points with two races remaining.The Italian finished fourth Saturday, followed by teammates Sofia Goggia and Laura Pirovano in fifth and sixth, respectively. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://www.espn.com/espn/corrections"}]}]'); needConsent = 'false'; } catch (e) { console.log(e); } window.espn.footerLinks = footerLinks || {}; window.espn.needConsent = needConsent || false })(); Terms of UsePrivacy PolicyYour US State Privacy RightsChildren's Online Privacy PolicyInterest-Based AdsAbout Nielsen MeasurementDo Not Sell or Share My Personal InformationContact UsDisney Ad Sales SiteW