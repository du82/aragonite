title = "Fantasy basketball picks and betting tips for Friday - ESPN"
description = "Eric Moody breaks down Friday's games and offers his top fantasy streamers and favorite bets for the night."
full_description = "Fantasy basketball picks and betting tips for FridayNick Richards has seen increased opportunity as the lead big man for the Phoenix Suns. Photo by Wes Hale/Getty ImagesEric MoodyFeb 28, 2025, 02:00 PM ETCloseEric Moody is a writer for fantasy football, men's and women's basketball, and sports betting at ESPN. Eric joined ESPN in 2021 after working as a senior fantasy analyst at Pro Football Network. Prior to that, he spent much of his career as a manager at a Fortune 100 financial services company.Follow on XEmailPrintOpen Extended ReactionsFriday's NBA slate is massive, featuring 10 games, including two nationally televised matchups on ESPN. The game I'm most excited for is a potential Eastern Conference Finals preview, as the Cleveland Cavaliers travel to TD Garden to face the Boston Celtics.The Cavaliers enter on a league best eight game winning streak, while the Celtics just had their six-game streak snapped. Two prop bets from this matchup immediately caught my attention, which I broke down in a column with my colleague Andre Snellings. But beyond this game, there are plenty of other best bets and fantasy streamers to consider across the slate.Friday's fantasy stream teamSign up for free fantasy baseballThe 2025 fantasy baseball season is here! Get the group together, or start a brand new tradition. Join or start a league for free >> Bol Bol, PF/C, Phoenix Suns (available in 88.9% of ESPN leagues)The Suns have leaned heavily on Bol over the past nine games, and he has averaged 13.3 PPG, 5.7 RPG and 2.1 BPG in 23.5 MPG during that span. Bol has been even more productive in his four starts this season, averaging 17.8 PPG, 8.0 RPG, and 2.5 BPG. After scoring 34 fantasy points against the Pelicans on Thursday, he should be able to match or exceed that performance when they face off again on Friday, especially if he remains in the starting lineup.Nick Richards, C, Phoenix Suns (89.9%)Richards has started 18 games for the Suns this season, averaging 8.1 PPG, 9.6 RPG, and 1.0 BPG. This gives us a clear picture of what to expect from him as a streamer. However, Richards has an excellent matchup against a Pelicans team that ranks near the bottom of the league in defensive rating. He scored 34 fantasy points Thursday night and should be well positioned for another strong performance.Aaron Nesmith, SF, Indiana Pacers (97.4%)Nesmith has started the past six games for the Pacers and has been productive. He scored 19 or more fantasy points in five of those six games, including three with 29 or more points. Nesmith is a solid streamer, providing a reliable source of points and rebounds with a dash of assists and steals.Caris LeVert, SG/SF, Atlanta Hawks (56.6%)LeVert has been given a key role in the Hawks' rotation with the second unit since being acquired from the Cavaliers. He has scored 33 or more fantasy points in three of his past six games and contributes across multiple statistical categories. Even though the Thunder present a challenging defensive matchup, LeVert remains a great streamer.Moody's favorite bets for FridayCade Cunningham over 10.5 assists (-130)The Pistons and Nuggets rank fourth and fifth in pace respectively, which sets up a high-scoring matchup with one of the highest totals on the slate. Cunningham has cleared this line in six of his past 10 games and has averaged 15.8 potential assists per game over that stretch while playing 34.9 MPG. With a narrow spread suggesting a competitive game, Cunningham should have plenty of opportunities to produce.Ausar Thompson over 18.5 points, rebounds and assists (-115)Thompson's rise into a key two-way role in the Pistons' rotation has been fun to watch. He has been excellent during the past 10 games, clearing this line seven times. Although he went under in his past two matchups against the Clippers and Celtics, Thompson has averaged 8.3 field goal attempts, 9.1 rebound chances and 6.9 potential assists per game in 24.8 minutes. The key takeaway is that when Thompson gets minutes, he's productive. He has cleared this line in eight of 10 games this season when playing 25 or more minutes.Trae Young under 38.5 points and assists (-115)Young has gone under this line in just four of his past 10 games. He has averaged 18.1 field goal attempts and 20.8 potential assists in 36.3 minutes per game this season which are strong numbers, but his matchup Friday is tough. The Thunder lead the league in points allowed per 100 possessions and are one of the best at limiting opposing point guards. They also excel at defending pick-and-roll ball handlers, which doesn't bode well for Young.Andrew Nembhard under 18.5 points, rebounds and assists (-120)Nembhard has struggled lately, going under this line in eight of his past 10 games. He has averaged just 7.1 field goal attempts during that stretch, shooting 45% from the field and a poor 17% from beyond the arc in 28.2 minutes per game. He has also gone under this line in four straight games against the Heat, including one this season. Additionally, Miami's defense has done a great job limiting shooting guards and containing spot-up shooters. On top of that, the Heat have played at the second slowest pace in February. Miami will likely try to slow the game down, especially since the Pacers have played at the sixth-fastest pace during the month.Jakob Poeltl over 22.5 points, rebounds and assists (-125)Poeltl has cleared this line in six of his past 10 games and in 13 of his past 20, a trend that has continued all season. He has a favorable matchup against a Bulls team that has struggled to contain opposing centers for most of the season.Josh Giddey to record a triple double (+600)Giddey has been playing exceptionally well since the All-Star break, averaging 24.3 PPG, 12 RPG and 8.0 APG in 34.3 MPG during his past four games. Friday's game against the Raptors has a narrow spread and one of the higher totals on the slate. Toronto has allowed the sixth-most points and the eighth-most rebounds per game to point guards this season. In addition, the Raptors also rank near the bottom of the league in points allowed per 100 possessions. Giddey has been on the verge of a triple-double recently and he could put it all together Friday night.Projections and Injury ReportsBasketball Power Index by ESPN Analytics. Injury aggregation by Rotowire.com. Odds by ESPN BETPlayers in italics are available in a majority of ESPN LeaguesDenver Nuggets at Detroit Pistons 7 p.m. ETLine: Nuggets 1.5 (-115) | Pistons -1.5 (-105) Money line: Nuggets +EVEN | Pistons -120 Total: 238.5 (-110 O, -110 U) BPI Projection: Pistons by 0.7, straight up 52%, 239.9 total points.Injury Report: Nuggets: Vlatko Cancar, (GTD - Knee); Peyton Watson, (OUT - Knee); DaRon Holmes II, (OUT - Achilles) Pistons: Dennis Schroder, (GTD - Ankle); Simone Fontecchio, (GTD - Finger); Jaden Ivey, (OUT - Lower Leg)Nuggets projections:Nikola Jokic, C: 55.3 FPTS (27.5 pts, 10.6 reb, 9.1 ast, 1.9 3PM)Jamal Murray, PG: 43.0 FPTS (25.0 pts, 3.4 reb, 6.2 ast, 2.3 3PM)Michael Porter Jr., SF/PF: 28.7 FPTS (16.6 pts, 6.6 reb, 2.1 ast, 2.5 3PM)Christian Braun, SG/SF: 27.4 FPTS (13.9 pts, 5.2 reb, 2.7 ast)Russell Westbrook, PG: 25.7 FPTS (13.0 pts, 4.4 reb, 4.5 ast)Aaron Gordon, PF: 23.7 FPTS (12.8 pts, 4.6 reb, 3.3 ast)Julian Strawther, SF: 13.9 FPTS (8.2 pts, 1.8 reb, 1.4 ast)Pistons projections:Cade Cunningham, PG/SG: 47.9 FPTS (27.4 pts, 5.7 reb, 8.3 ast, 2.2 3PM)Jalen Duren, C: 28.3 FPTS (12.2 pts, 10.7 reb, 2.9 ast, 1.2 blk)Tobias Harris, SF/PF: 25.6 FPTS (14.3 pts, 5.3 reb, 1.9 ast)Malik Beasley, SG: 22.4 FPTS (12.4 pts, 2.3 reb, 1.8 ast, 3.2 3PM)Dennis Schroder, PG: 20.8 FPTS (10.3 pts, 1.4 reb, 3.9 ast)Ausar Thompson, SF/PF: 20.7 FPTS (10.0 pts, 5.0 reb, 2.6 ast)Tim Hardaway Jr., SG/SF: 16.6 FPTS (9.4 pts, 2.3 reb, 1.6 ast)Oklahoma City Thunder at Atlanta Hawks 7:30 p.m. ETLine: Thunder -11.5 (-105) | Hawks 11.5 (-115) Money line: Thunder -650 | Hawks +425 Total: 245.5 (-105 O, -115 U) BPI Projection: Thunder b