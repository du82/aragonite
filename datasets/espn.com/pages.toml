title = "Fantasy basketball picks and betting tips for Thursday - ESPN"
description = "Andre Snellings breaks down Thursday's games and offers his top fantasy streamers and favorite bets for the five-game slate."
full_description = '''Fantasy basketball picks and betting tips for ThursdayMoses Moody has picked up his production since joining the Warriors' starting lineup. Photo by Noah Graham/NBAE via Getty ImagesAndré SnellingsFeb 27, 2025, 01:05 PM ETCloseDr. André Snellings is a senior writer for men's and women's fantasy basketball and sports betting at ESPN. André has a Ph.D. in biomedical engineering from Michigan. He joined ESPN in 2017 after a 16-year career as a neural engineer, during which time he was also a writer and analyst for Rotowire.EmailPrintOpen Extended ReactionsESPN's fantasy basketball daily cheat sheet is your pregame destination before you set your lineups for the night's games. Here you'll read our best advice for the night, including a selection of players you can stream as well as game-by-game injury reports and player projections.What you need to know for Thursday's gamesWe've got five games on the Thursday night slate, headlined by a battle between former MVPs as Nikola Jokic and the Denver Nuggets hit the road to face Giannis Antetokounmpo and the Milwaukee Bucks. Jokic has been making his case to win another award this season, while Giannis has struggled to get on the court due to lingering health issues. Both teams will be looking for the win tonight as they make their late-season push for playoffs placement.Another interesting matchup has Luka Doncic in his new role on the Los Angeles Lakers facing the Minnesota Timberwolves squad he helped defeat in last year's Western Conference Finals. Luka is still working his way back after a two-month injury absence (calf), but in his last two games he has produced big numbers against the Nuggets and Dallas Mavericks. Meanwhile, the Timberwolves pulled off a comeback for the ages over the Oklahoma City Thunder in their last game but may be playing without star Anthony Edwards (questionable, calf) on Thursday.We'll dig further into these and other storylines for tonight's games so we can identify fantasy streamers and betting angles of interest.Thursday's fantasy stream teamIt's not too late to play for freeThere's still time to join or create a league in the No. 1 Fantasy basketball game. Your league starts fresh on the first scoring period following your draft.Create or join a fantasy basketball league on ESPN. Your championship run starts today!Sign up today! Jusuf Nurkic, Charlotte Hornets (rostered in 45.6% of ESPN leagues): Nurkic has been hyper-efficient during his brief tenure with the Hornets, averaging 10.7 PPG and 9.0 RPG in only 20.7 MPG in his last three outings. Nurkic is playing behind Mark Williams and didn't play at all against the Warriors in the second half of a back-to-back on Tuesday, so check his availability. If he plays, he's a double-double threat even in limited minutes.Brandin Podziemski, Golden State Warriors (33% rostered): Podziemski has become a main-stay in this article since moving into the starting lineup for the Warriors in the Jimmy Butler III regime, averaging 16.5 PPG, 6.5 RPG, 1.8 3PG and 1.8 SPG in 31.0 MPG in his four starts.Moses Moody, Warriors (6.8%): Moody joined Podziemski in the Warriors' starting lineup around Butler and has similarly picked up his game and fantasy hoops production. In his four most recent starts, Moody has averaged 14.8 PPG and 2.5 3PG in 28.3 MPG.Dre's favorite bets for ThursdayOdds by ESPN BETplay12:48Luka Doncic and the Lakers are playing 'WITH HOUSE MONEY!' - Rudy GayWarriors -4.5 (-120) at Orlando MagicEditor's PicksFantasy basketball: Don't be surprised if ... we never see the old Joel Embiid again3dEric KarabellFantasy basketball: Six rising rookies who can help win your league3dAndre Snellings1 RelatedThe Warriors have found magic (no pun intended) with their new starting lineup around Butler. In the four games they've played since moving Podziemski and Moody into the starting lineup, the Warriors are 4-0 with an average scoring margin of +20.3 PPG. They've won all four games by at least seven points, including road wins over the Houston Rockets and Sacramento Kings and a 24-point blowout over the recently competitive Mavericks. The Magic are 5-5 in their last 10 and 2-2 in their last four, with a negative scoring margin over both spans (-1.3 PPG last four, -.2 PPG last 10).Nikola Jokic to record a triple-double (-113)Jokic is averaging a triple-double on the season and has notched one in 26 of his 52 games. He has maintained that pace recently, averaging 27.2 PPG, 11.7 RPG and 11.4 APG with five triple-doubles in his last 10 games. But he has a higher-than-usual likelihood to post one on Thursday, against a Bucks team missing Bobby Portis. The Bucks will often be guarding Jokic with either the slower-footed Brook Lopez or the thinner Antetokounmpo. In his last five games against the Bucks, going back to 2021, Jokic has averaged a triple-double (28.0 PPG, 11.4 APG, 10.8 RPG) with four double-digit rebound efforts, four double-digit assist games and three outright triple-doubles in that span.Timberwolves +6.5 (-115) at LakersWhile the Lakers have two marquee wins in their last two games and have the best record in the NBA since January 15 at 15-4, they are still quietly working through the kinks of their new team dynamics around Doncic. Their win over the Mavericks was close until the end, but the Lakers failed to cover the spread for the third time in their last five games. The Timberwolves are in the midst of a brutal portion of their schedule. In recent weeks, they have faced the Thunder three times, had a road game against the Cleveland Cavaliers, faced the Rockets twice and the Bucks once. Still, they have won five of their last nine games, including two over the Thunder. Timberwolves head coach Chris Finch said on Wednesday that he expects Anthony Edwards (calf) to play Thursday, and if he does, the Timberwolves are playing well enough to cover this spread.Projections and Injury ReportsBasketball Power Index by ESPN Analytics. Injury aggregation by Rotowire.com. Odds by ESPN BETPlayers in italics are available in a majority of ESPN LeaguesGolden State Warriors at Orlando Magic 7 p.m. ETLine: Warriors -4.5 (-120) | Magic 4.5 (EVEN) Money line: Warriors -195 | Magic +165 Total: 210.5 (-110 O, -105 U) BPI Projection: Warriors by 0.1, straight up 50%, 210.6 total points.Injury Report: Warriors: Trayce Jackson-Davis, (GTD - Illness); Jonathan Kuminga, (OUT - Ankle) Magic: Cole Anthony, (GTD - Knee); Jalen Suggs, (OUT - Quadriceps); Moritz Wagner, (OUT - Knee)Warriors projections:Stephen Curry, PG: 41.0 FPTS (21.8 pts, 4.2 reb, 5.7 ast, 3.8 3PM)Jimmy Butler, SG/SF/PF: 33.6 FPTS (16.5 pts, 5.5 reb, 5.1 ast)Draymond Green, PF/C: 27.1 FPTS (10.1 pts, 5.3 reb, 5.0 ast)Brandin Podziemski, PG/SG: 26.1 FPTS (11.6 pts, 5.0 reb, 3.3 ast)Moses Moody, SG/SF: 19.8 FPTS (11.9 pts, 2.8 reb, 1.5 ast, 1.8 3PM)Buddy Hield, SG/SF: 19.1 FPTS (9.4 pts, 2.7 reb, 2.0 ast, 2.1 3PM)Kevon Looney, C: 15.9 FPTS (5.5 pts, 5.8 reb, 2.2 ast)Magic projections:Franz Wagner, SF/PF: 39.0 FPTS (22.8 pts, 5.0 reb, 4.7 ast, 1.9 3PM)Paolo Banchero, SF/PF: 35.6 FPTS (23.3 pts, 5.7 reb, 5.0 ast)Wendell Carter Jr., C: 20.2 FPTS (9.6 pts, 7.3 reb, 1.7 ast)Cole Anthony, PG: 19.5 FPTS (11.0 pts, 3.3 reb, 2.6 ast)Kentavious Caldwell-Pope, SG/SF: 16.3 FPTS (8.6 pts, 1.6 reb, 1.4 ast)Mac McClung, SG: 15.0 FPTS (8.3 pts, 3.1 reb, 2.5 ast)Goga Bitadze, C: 14.4 FPTS (5.2 pts, 4.8 reb, 2.2 ast, 1.2 blk)Denver Nuggets at Milwaukee Bucks 8 p.m. ET on TNTLine: Nuggets -3.5 (-115) | Bucks 3.5 (-105) Money line: Nuggets -175 | Bucks +150 Total: 240.5 (-110 O, -110 U) BPI Projection: Nuggets by 1.9, straight up 56%, 239.3 total points.Injury Report: Nuggets: Aaron Gordon, (GTD - Calf); Jamal Murray, (GTD - Knee); Vlatko Cancar, (OUT - Knee); Peyton Watson, (OUT - Knee); DaRon Holmes II, (OUT - Achilles) Bucks: Giannis Antetokounmpo, (GTD - Calf); Liam Robbins, (OUT - Groin); Pat Connaughton, (OUT - Calf); Bobby Portis, (OUT - Suspension)Nuggets projections:Nikola Jokic,