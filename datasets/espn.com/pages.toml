title = "Stephen Curry dons Iverson-themed jacket ahead of Warriors-76ers - ESPN"
description = "Iverson played a total of 12 seasons in the City of Brotherly Love, including an MVP-winning campaign in 2001."
full_description = '''Stephen Curry dons Iverson-themed jacket ahead of Warriors-76ersplayWindy: Warriors' trade for Jimmy Butler 'unlocked' Steph Curry (1:22)Brian Windhorst joins "Get Up" to break down how Steph Curry's recent stretch of dominant scoring performances is a product of the Jimmy Butler acquisition. (1:22)J.J. PostMar 1, 2025, 08:25 PM ETEmailPrintOpen Extended ReactionsStephen Curry and the Golden State Warriors are in the City of Brotherly Love Saturday night to take on the Philadelphia 76ers, and the star point guard is paying homage to a Philly legend.Editor's PicksButler misses loss to 76ers due to back spasms9mOhm YoungmisukCurry sported a custom Allen Iverson-themed jacket for his arrival to the Wells Fargo Center. The varsity-style piece features a large "A" as well as Iverson's nickname "The Answer" embossed under the left shoulder.Steph ARRIVES in Philly. 📸Paying homage to "The Answer" Allen Iverson 🙌 pic.twitter.com/6gkFmqkGlG— NBA (@NBA) March 2, 2025 Other details on the front of the blue-and-white jacket include a list of Iverson's accolades -- highlighted by his 2001 MVP award -- and the text "Only the Strong Survive." Iverson has a tattoo of the phrase on his arm.The 11-time All-Star played 12 total seasons in Philadelphia, including a brief but memorable second stint in 2009-10 for his final NBA games.The Warriors and 76ers will tip off from the Wells Fargo Center at 8:30 p.m. ET. Curry is currently averaging 24 points and 6 assists per game in the 2024-25 season. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","foo