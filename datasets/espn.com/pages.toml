["https://espn.com/nba/story/_/id/44072556/nba-hold-july-hearing-settle-raptors-knicks-dispute"]
title = "NBA to hold July hearing to settle Raptors-Knicks dispute - ESPN"
description = "The NBA will hold an arbitration hearing during the week of July 21 for commissioner Adam Silver to settle the long-running legal dispute between the Raptors and Knicks."
full_description = '''NBA to hold July hearing to settle Raptors-Knicks disputeBaxter HolmesMar 1, 2025, 07:57 PM ETCloseBaxter Holmes (@Baxter) is a senior writer for ESPN Digital and Print, focusing on the NBA. He has covered the Lakers, the Celtics and previously worked for The Boston Globe and Los Angeles Times.Follow on XEmailPrintOpen Extended ReactionsThe NBA will hold an arbitration hearing during the week of July 21 for commissioner Adam Silver to settle the long-running legal dispute between the Toronto Raptors and New York Knicks, according to a court filing Saturday in New York that was obtained by ESPN.That hearing will occur almost two years after the Knicks sued the Raptors in August 2023, alleging the theft of thousands of confidential files. And it will come a little more than a year after the New York judge overseeing the case ruled in June 2024 that Silver should resolve the dispute.From the start, the Raptors asked Silver to step in, but the Knicks, who sought more than $10 million in damages, expressed concerns about Silver's ability to remain impartial, arguing that he should stay on the sidelines partly because of his close relationship with Raptors governor Larry Tanenbaum, who also is chairman of the NBA board of governors."We continue to remain skeptical of this process as the NBA has consistently demonstrated that it has no desire to address this blatant theft of proprietary information, likely because the chairman of the NBA is the defendant," a Madison Square Garden Sports spokesperson said in a statement. "It's been 18 months since our original complaint was lodged and even after the court ordered the NBA to schedule a hearing, the NBA neglected to do so and only took action after the last filed joint status report in December."The Raptors and NBA didn't immediately respond to a request for comment.In the initial complaint, the Knicks alleged that the Raptors poached Ikechukwu Azotam, who worked for New York from 2020 to 2023, and ordered him to provide a trove of internal information after Toronto began recruiting him in summer 2023. The Knicks argued that this effort was geared toward giving the Raptors a competitive advantage.The Knicks alleged that Azotam -- who worked for the Knicks as an assistant video coordinator, then as a director of video/analytics/player development assistant -- sent the Raptors thousands of confidential files, including play frequency reports, a prep book for the 2022-23 season, video scouting files and opposition research.The Knicks also alleged in the August 2023 complaint that Azotam did so at the request of the Raptors, whom they said were trying to "organize, plan, and structure the new coaching and video operations staff."The Raptors, Azotam, Toronto head coach Darko Rajaković, player development coach Noah Lewis and 10 "unknown" employees were listed as defendants in the lawsuit.In an October 2023 court filing, the Raptors called the Knicks' allegations "baseless" and a "public relations stunt" while asking for Silver to step in. The Raptors also argued that the "alleged 'theft of data' involved little more than publicly available information compiled through public sources readily accessible to all NBA Members."The lawsuit marks a rare instance of one professional team suing another. The only other instance ESPN research could uncover involving two NBA teams was a legal battle between the Knicks and Nets in 1977 over the Nets' attempts to move from Long Island to New Jersey.The lawsuit between the Knicks and Raptors appears to be the first between two NBA teams that centers on basketball-related information. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://www.espn.com/espn/corrections"}]}]'); needConsent = 'false'; } catch (e) { console.log(e); } window.espn.footerLinks = footerLinks || {}; window.espn.needConsent = needConsent || false })(); Terms of UsePrivacy PolicyYour US State Privacy RightsChildren's Online Privacy PolicyInterest-Based AdsAbout Nielsen MeasurementDo Not Sell or Share My Personal InformationContact UsDisney Ad Sales SiteWork for ESPNCorrectionsESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries ('PENN'). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER.Copyright: © 2025 ESPN Enterprises, Inc. All rights reserved.'''
