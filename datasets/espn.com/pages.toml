["http://www.espn.com/fantasy/baseball/insider/story/_/id/44026415/fantasy-baseball-rookie-rankings-2025-kiley-mcdaniel-mlb-picks-prospects"]
title = "Fantasy baseball: Rookie picks, prospect rankings for 2025 - ESPN"
description = "Kiley McDaniel provides his rankings of rookie-eligible players for their potential fantasy contributions during the 2025 baseball season."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ 2025 fantasy baseball picks: MLB rookie, prospect rankingsDylan Crews is one of the prospects most likely to blossom into someone fantasy managers need to know in 2025. Mark Goldman/Icon SportswireKiley McDanielFeb 28, 2025, 07:21 AM ETCloseESPN MLB Insider Kiley McDaniel covers MLB prospects, the MLB Draft and more, including trades and free agency. Has worked for three MLB teams. Co-author of Author of 'Future Value' Follow on XEmailOpen Extended ReactionsHope springs eternal when it comes to baseball teams, both in the major leagues as well as with fantasy baseball squads. Some of the biggest importers of hope each season are those "shiny new toys" -- highly touted rookies who have yet to disappoint, bringing tons of promise and optimism to the table.The list you're about to read is strictly for fantasy purposes and is a spin on my real-world value top 100 list, which is heavily influenced by scouts, executives and my own scouting looks. I don't play fantasy anymore, but I do help some friends with their teams, and I get the big-picture adjustments from the baselines of my other lists: defense doesn't matter, position matters a little, speed doesn't really matter unless they steal bases, lean to position players over pitchers, etc. This list will generally be in the order of that list, only after accounting for those factors, projected playing time and how well I think they'll adjust to the big leagues in 2025 specifically.With that in mind, here's my ranked top 10 of the best fantasy bets for 2025 among prospects. Not every young player or note qualifies for my list (which coincides with ROY eligibility) -- Junior Caminero just missed -- but this includes the vast majority of intriguing young players in the league.Early in spring training for last year's list, I had already sniffed out Jackson Merrill's potential rise to Opening Day starter with ROY upside and flagged Paul Skenes similarly, with a question about his 2024 workload, putting them at the top of the "keep an eye on them, they have upside" group. I made the adjustment this year and put the best candidates for that group on the back end of this year's list, but there are still some guys in that section to closely monitor their playing time outlooks over the next month. ESPN + Continue reading this article and more from top writers, for only $11.99/mo. Continue Reading Already an ESPN+ subscriber? Log in here. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://ww