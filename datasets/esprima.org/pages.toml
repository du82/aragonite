["https://esprima.org/index.html"]
title = "Esprima"
full_description = "Esprima is a high performance, standard-compliant ECMAScript parser written in ECMAScript (also popularly known as JavaScript). Esprima can be used to perform lexical analysis (tokenization) or syntactic analysis (parsing) of a JavaScript program. Once the full syntax tree is obtained, various static code analysis can be applied to give an insight to the code: syntax visualization, code validation, editing autocomplete (with type inferencing) and many others. Regenerating the code from the syntax tree permits a few different types of code transformation, from a simple rewriting (with specific formatting) to a more complicated minification."
