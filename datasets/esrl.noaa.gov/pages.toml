full_description = "main { padding-bottom: 0; } .intro-button { color: white; background: rgba(119,119,119,0.5); border: 1px solid #fff; font-weight: 400; } Welcome to ESRL The NOAA Earth System Research Laboratories (ESRL) pursue a broad and comprehensive understanding of the many physical, chemical and biological processes that comprise the Earth system to better predict their behavior from minutes to millennia on local to global scales. Learn more Explore Our Laboratories CSL Chemical Sciences Laboratory Research to advance understanding of climate, air quality, and the stratospheric ozone layer. GML Global Monitoring Laboratory Taking the pulse of the planet with accurate, long-term, global observations and analyses to advance understanding of the Earth system. GSL Global Systems Laboratory Making forecasts better through applied research and directed development. PSL Physical Sciences Laboratory Weather, climate and hydrologic research to advance the prediction of water availability and extremes."
