["http://eszter.com/teachmethods"]
title = "Eszter Hargittai's Syllabus for Methods to Study Internet & Society"
full_description = "SYLLABUS FOR TEACHING METHODS BY ESZTER HARGITTAI CV Books Eszter's List Google Scholar Academic papers Syllabus for methods Want to contact me? If you would like to offer a course on Methods for Studying Internet Use please feel free to use the proposed syllabus and course content linked below. It is based on my two edited books Research Exposed: How Empirical Social Science Gets Done in the Digital Age and Digital Research Confidential: The Secrets of Studying Behavior Online. The syllabus suggests themes for various weeks with relevant readings plus gives ideas for assignments that can be applied throughout the semester. I have used this material with undergraduate students, Master's students, and PhD students. Most recently, in Spring '21, I taught it as an optional Master's seminar. In the evaluations, several students commented that it should be a required course in our MA in Internet & Society program as they found it so essential and helpful. Research methods syllabus Word docx file Research methods syllabus pdf file I have used this material with undergraduate students, Master's students, and PhD students. Most recently, in Spring '21, I taught it as an optional Master's seminar. In the evaluations, several students commented that it should be a required course in our MA in Internet & Society program as they found it so essential and helpful."
