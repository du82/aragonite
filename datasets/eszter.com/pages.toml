["http://www.eszter.com"]
title = "Eszter Hargittai - Eszter.com"
full_description = "ESZTER HARGITTAI Professor & Chair of Internet Use and Society Department of Communication and Media Research University of Zurich & Visiting Research Scholar Center for Information Technology Policy Princeton University CV Books Eszter's List Google Scholar Academic papers Syllabus for methods Want to contact me? Welcome! You can follow me on Bluesky, X (Twitter), LinkedIn, Mastodon and/or Facebook. I also invite you to sign up for my mailing list to get updates and recommendations from me about interesting content sent out a few times a year. New Book! My book Connected in Isolation: Digital Privilege in Unsettled Times is out now from MIT Press. You can order it at your favorite bookseller or ask your library to do so. Research You can see copies of my academic papers here, the platform lets you filter or group by topic and/or method. Google Scholar also has a helpful list. Brief background Eszter Hargittai is a Professor and holds the Chair in Internet Use & Society in the Department of Communication and Media Research at the University of Zurich where she heads the Web Use Project research group. See her CV for more details about current and past affiliations including teaching and service to institutions and fields of study. Hargittai's research focuses on the social and policy implications of digital media with a particular interest in how differences in people's Internet skills/digital literacy influence what they do online, and how these may translate into changes in life chances. Her work has received awards from the American Sociological Association, the International Communication Association, the National Communication Association, the Eastern Sociological Society, and the Telecommunications Policy Research Conference. In 2010, the International Communication Association (ICA) selected her to receive its Outstanding Young Scholar Award, in 2019, ICA elected her as a Fellow, an honor bestowed on at most 3% of its membership. In addition to her academic articles, she has published numerous opeds (e.g., Covid-related opeds), her work has also been featured in many popular media outlets including the New York Times, CNNfn, USA Today, the Chicago Tribune, the Washington Post, international outlets, and many others. Her work has been supported by the US National Science Foundation, the John D. and Catherine T. MacArthur Foundation, the Alfred P. Sloan Foundation, the Markle Foundation, the Dan David Foundation, the Russell Sage Foundation, Microsoft Research, Google, Facebook, Merck, and Nokia, among others. Hargittai is editor of four books, most recently, the Handbook of Digital Inequality (2021, Edward Elgar Publishing, UK). She has written about academic career advice at Inside Higher Ed: Ph.Do. For more background information, see this feature article in the Princeton Alumni Wekkly. Interested in more? Please see the menu items in the top-left column."
year_published = 2025
clearnet = "http://www.eszter.com"
