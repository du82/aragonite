["http://eszter.com/books"]
title = "Eszter Hargittai's Books"
full_description = "BOOKS BY ESZTER HARGITTAI CV Books Eszter's List Google Scholar Academic papers Syllabus for methods Want to contact me? Connected in Isolation: Digital Privilege in Unsettled Times Coming out in Fall 2022 (ready for pre-order!), the book analyzes survey data about people's digital media experiences during initial COVID-19 lockdowns in three countries (US, Switzerland, Italy). The book explores how people engaged on social media about Covid and where they got their information about the virus linking these behaviors to their Covid knowledge and misperceptions, and ultimately their behaviors for staying safe during the pandemic. Hargittai, E. (2022) Connected in Isolation: Digital Privilege in Unsettled Times. Cambridge, MA: The MIT Press. Handbook of Digital Inequality The largest collection of digital inequality papers in one place, this 400-page edited volume includes two dozen chapters, most of them empirical, with fresh perspectives on digital inequality scholarship. The Introduction is available here for free. The main themes are Infrastructures and Geographies; Digital Inequality throughout the Lifecourse; Health and Disability; Privacy and Trust. Hargittai, E. (Ed.) 2021. Handbook of Digital Inequality. Cheltenham, UK: Edward Elgar Publishing. Research Exposed: How Empirical Social Science Gets Done in the Digital Age Third in a series of edited volumes with a dozen chapters unveiling the behind-the-scenes realities of doing empirical social science in the 21st century.Hargittai, E. (Ed.) 2021. Research Exposed: How Empirical Social Science Gets Done in the Digital Age. New York, NY: Columbia University Press. Digital Research Confidential: The Secrets of Studying Behavior Online An edited book of chapters about the challeges of studying digital media and using digital media as method to study the social world. The authors explicitly address the types of problems that come up with such research, but also the opportunities they offer and how to tackle roadblocks to research. Hargittai, E. & Sandvig, C. (Eds) 2015. Digital Research Confidential: The Secrets of Studying Behavior Online. Cambridge, MA: The MIT Press. Research Confidential: Solutions to Problems Most Social Scientists Pretend They Never Have An edited volume representing several social science fields lifts the curtain on the realities of empirical social science on the ground. The authors are unusually honest about the problems they faced during their studies and how they tackled them. Hargittai, E. (Ed.) 2009. Research Confidential: Solutions to Problems Most Social Scientists Pretend They Never Have. Ann Arbor, MI: The University of Michigan Press."
year_published = 2025
