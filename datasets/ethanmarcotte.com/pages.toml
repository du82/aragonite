title = "Responsive Web Design — Ethan Marcotte"
description = "Read this page on ethanmarcotte.com"
full_description = "Responsive Web Design With a foreword by Jeremy Keith. Since its groundbreaking release, Responsive Web Design remains a fundamental resource for anyone working on the web. Learn how to think beyond the desktop, and craft designs that respond to your users’ needs. In the second edition, Ethan Marcotte expands on the design principles behind fluid grids, flexible images, and media queries. Through new examples and updated facts and figures, you’ll learn how to deliver a quality experience, no matter how large or small the display. Read online for free Praise for Responsive Web Design Day by day, the number of devices, platforms, and browsers that need to work with your site grows. Ethan’s straightforward approach to designing for this complexity represents a fundamental shift in how we’ll build websites for the decades to come. Jeffrey Veen, design partner at TrueVentures, and host of PresentableFM While the basic principles of responsive web design haven’t changed, this book is more important than ever. Over the past few years, organizations large and small have implemented this technique — and many more are just starting the process. Whether you’re familiar with this approach or are learning about it now, Ethan’s book is the indispensable guide to responsive design. Karen McGrane, Author of Going Responsive, and cofounder of Autogram Every so often, something comes along in our industry that defines a moment in time: Jeffrey Zeldman’s Designing with Web Standards, or Doug Bowman’s Wired.com redesign. This book is one of those moments. Insightful, witty and practical, Responsive Web Design points us in the direction of a new web. Mark Boulton, Design director, writer, and speaker Read online for free"
