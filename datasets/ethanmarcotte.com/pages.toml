["https://ethanmarcotte.com/wrote"]
title = "My journal. — Ethan Marcotte"
description = "I had a wonderful job, until I didn’t. This is about what happened — and what is still happening."
full_description = "Moving on from 18F. Posted on 18 February 2025 I had a wonderful job, until I didn’t. This is about what happened — and what is still happening. A challenge of blog questions. Posted on 26 January 2025 Jon and Naz kindly tagged me into a blogging challenge! Namely, to answer a set of questions about how I blog, and why. Ames & Amherst. Posted on 18 January 2025 No hate. No fear — well, a fair bit of fear. But I’m ready. Two books, no longer apart. Posted on 13 November 2024 I’ve put my first two books online for free. Reacquired. Posted on 21 July 2024 Last year, I wrote a book. Several months later, my publisher closed its doors. This is about what happens next. This site goes up to Eleventy. Posted on 15 July 2024 I just migrated this little website’s internals over to Eleventy. If I did my job right, you won’t notice the change. Slingshot. Posted on 23 April 2024 I just attended my first Labor Notes Conference. My head’s full, and my heart’s on fire. Blockin’ bots. Posted on 12 April 2024 Here’s how I’m blocking “artificial intelligence” bots, crawlers, and scrapers. Lowe. Posted on 11 March 2024 Spotted a copy of You Deserve a Tech Union at my local library. It made my decade. Generative. Posted on 29 February 2024 Nineteen thoughts about “generative artificial intelligence,” spanning a few centuries. Collective. Posted on 8 February 2024 A prominent investor got excited about collective bargaining. I did too! (But probably for different reasons.) Reviewed. Posted on 17 January 2024 My book was reviewed in Labor Notes. I’m still pinching myself. Broadly. Posted on 14 December 2023 I’m excited to share a change in You Deserve a Tech Union’s pricing. A new op-ed: on OpenAI and worker power. Posted on 11 December 2023 What happens when workers take collective action, and in an anti-worker industry? Boston meetup, redux: “You deserve a tech union!” Posted on 7 December 2023 Tech workers of Boston! Curious about unions? We’re having another meetup about it!"
year_published = 2025
