title = "Welcome to Ethan Marcotte’s website — Ethan Marcotte"
description = "I’m Ethan Marcotte. I’m a web designer, writer, and speaker. This is my website; I’m real glad you’re here."
full_description = "Hi, I’m Ethan. It’s real nice to meet you. A bit more about me: over the last two decades, my design practice has focused on designing and building beautiful, accessible web experiences, and on helping organizations create more effective design systems. I’ve been fortunate enough to work for clients like New York Magazine, the Sundance Film Festival, and Google. In 2010, I coined the term “responsive design,” and things haven’t been quite the same since. I also write and speak about digital design, technology, labor, and justice. (The most recent entry in my journal is “Moving on from 18F.”) My latest books You Deserve a Tech Union On the tech industry’s labor movement, and how you can be part of it. More about this book Responsive Design: Patterns & Principles Methods and principles to help your responsive layout reach more devices (and people) than ever before. Read online for free Responsive Web Design The book that launched a new way of designing for the web. Read online for free Selected conferences I’ve been fortunate to be a featured speaker at design conferences across the globe. Some selected talks follow below. New Adventures 2019 Clarity 2019 Adobe MAX 2016 Webstock 2016 Build 2012 Webstock 2012 An Event Apart 2010 Selected articles The OpenAI workers’ open letter, and what it means for tech labor WBUR, 2023 Why the Hollywood strikes matter to all of us WBUR, 2023 Drop caps & design systems Vox Media Product, 2019 Frameworks A List Apart, 2015 Fluid Images A List Apart, 2011 Responsive Web Design A List Apart, 2010 Fluid Grids A List Apart, 2009 Selected press, interviews, & mentions Labor Notes 2024 Shop Talk Show 2023 TEN7 Podcast 2021 Rosenfeld Media 2014 net Magazine 2014 Fast Company 2014 The Atlantic 2014 Northwestern University Knight Lab 2013 Garcia Media 2011 A roll of blogs I like Sara Hendren, Robin Rendle, Lisa Maria Marquis, Mandy Brown, Miriam Suzanne, Erin Kissane, Chris Coyier, Henry Desroches, Jeremy Keith, Greg Storey