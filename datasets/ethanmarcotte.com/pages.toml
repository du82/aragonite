title = "Responsive Design: Patterns and PrinciplesCover page"
full_description = "About this book As responsive design evolves, we have a critical need to think about design challenges beyond mobile, tablet, and desktop. When properly designed and planned, design patterns — small, reusable modules — help your responsive layout reach more devices (and people) than ever before. Ethan Marcotte shows you just how that’s done, and outlines principles for designing more flexible, device-independent layouts. Originally published in 2015. About the author Ethan Marcotte is a web designer, speaker, and author. He’s perhaps best known for creating responsive web design, which helped the industry discover a new way of designing for the ever-changing web. Over his career, Ethan’s clientele has included New York Magazine, the Sundance Film Festival, The Boston Globe, and People Magazine. Additionally, Ethan is a featured speaker at conferences across the globe, including Adobe MAX, SXSW Interactive, and Webstock. Ethan’s most recent book is You Deserve a Tech Union. Keep reading Next: Foreword"
