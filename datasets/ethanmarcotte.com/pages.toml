["https://ethanmarcotte.com/work"]
title = "Let’s work together. — Ethan Marcotte"
description = "Hi, I’m Ethan. I’m a web designer who helps companies make beautiful sites and services that work everywhere."
full_description = "Let’s work together. Hi, I’m Ethan. I’m a web designer who helps companies make beautiful sites and services that work everywhere, for everyone. My design practice focuses on responsive, device-agnostic interfaces; on building resilient, accessible products; and on creating digital design systems at scale. Over the last two decades I’ve worked with organizations large and small, helping teams untangle even the thorniest challenges of working on the modern web. Got an idea of something we could work on together? Let’s chat. A few names I’ve worked with: How we can work together I’m typically hired for an in-house presentation, a one day workshop, a week-long sprint or audit, or an ongoing consulting project. I tend to focus on these topics: Responsive design & cross-device UX I know I coined the term, but I still enjoy designing web sites and services that work everywhere, for clients big and small. If you need a visual designer or a front-end developer — or both! — let’s talk. Pattern libraries & design systems My work has gotten much more modular over the years; I’m guessing yours has too. Whether they’re creating their first design system or their tenth, I’ve helped clients build sustainable designs, processes, and workflows that work better for them. Workshops & training Is your digital team tackling its first big responsive redesign, or building its first design system? I can provide the training, guidance, and perspective to help your teams do their best work. Performance & accessibility Designing for the web means our sites should be usable anywhere, on any device, by everyone. If your pages are too slow, or if your product’s dealing with some accessibility challenges, drop me a line. Whether you need hands-on help with your next redesign, or a higher-level, strategic perspective for a big digital initiative, you’re in luck: I like thinking and working at both ends of the spectrum. Basically, I like working on interesting problems with good people. If that sounds like you, send me an email! I’m looking forward to meeting you."
year_published = 2025
