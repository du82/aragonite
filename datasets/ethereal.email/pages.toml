["https://ethereal.email/help"]
title = "Ethereal Email"
full_description = "Inbound email functionality was previously enabled by default for all Ethereal.email accounts. Unfortunately, this feature was exploited by cyber criminals due to the ease of creating anonymous accounts. Since it is not feasible to validate each account individually, and Ethereal.email’s primary objective is to provide test endpoints for outbound emails, we have decided to discontinue the inbound email service. To generate email accounts with inbound access with Nodemailer (v6.9.14 or newer), you have to have the ETHEREAL_API_KEY environment variable set. You can get this key from Postal System's account page here if you are a paid subscriber."
author = "Andris Reinman"
year_published = 2025
