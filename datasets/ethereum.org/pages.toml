["https://ethereum.org/en/run-a-node"]
title = "How to Run an Ethereum Node"
description = "An introduction on what, why, and how to run an Ethereum node."
full_description = '''Run a nodeTake full control.Run your own node.Become fully sovereign while helping secure the network. Become Ethereum.Learn moreWhat does it mean to "run a node"?Run software.Known as a 'client', this software downloads a copy of the Ethereum blockchain and verifies the validity of every block, then keeps it up-to-date with new blocks and transactions, and helps others download and update their own copies.With hardware.Ethereum is designed to run a node on average consumer-grade computers. You can use any personal computer, but most users opt to run their node on dedicated hardware to eliminate the performance impact on their machine and minimize node downtime.While online.Running an Ethereum node may sound complicated at first, but it's merely the act of continuously running client software on a computer while connected to the internet. While offline, your node will simply be inactive until it gets back online and catches up with the latest changes.Who should run a node?Everyone! Nodes are not just for validators. Anyone can run a node—you don't even need ETH.You don't need to ETH to run a node. In fact, it's every other node on Ethereum that holds validators accountable.You may not get the financial rewards that validators earn, but there are many other benefits of running a node for any Ethereum user to consider, including privacy, security, reduced reliance on third-party servers, censorship resistance and improved health and decentralization of the network.Having your own node means you don't need to trust information about the state of the network provided by a third party.Don't trust. Verify.Why run a node?Privacy & SecurityStop leaking your personal information to third party nodes.MoreCensorship ResistanceEnsure access when you need it, and don't be censored.MoreParticipateThe decentralization revolution starts with you.MoreDecentralizationResist strengthening centralized points of failure.MoreVoice your choiceDon't give up control in the event of a fork.MoreSovereigntyThink of running a node like the next step beyond getting your own Ethereum wallet.MoreGetting startedIn the earlier days of the network, users needed to have the ability to interface with the command-line in order to operate an Ethereum node.If this is your preference, and you've got the skills, feel free to check out our technical docs.Spin up an Ethereum nodeNow we have DAppNode, which is free and open-source software that gives users an app-like experience while managing their node.In just a few taps you can have your node up and running.DAppNode makes it easy for users to run full nodes, as well as and other networks, with no need to touch the command-line. This makes it easier for everyone to participate and create a more decentralized network.Choose your adventureYou'll need some hardware to get started. Although running node software is possible on a personal computer, having a dedicated machine can greatly enhance the performance of your node while minimizing its impact on your primary computer.When selecting hardware, consider that the chain is continually growing, and maintenance will inevitably be needed. Increasing specs can help delay the need for node maintenance.Buy fully loadedOrder a plug and play option from vendors for the simplest onboarding experience.No building needed.App-like setup with a GUI.No command-line required.Shop DAppNode(opens in a new tab)Shop Avado(opens in a new tab)Build your ownA cheaper and more customizable option for slightly more technical users.Source your own parts.Install DAppNode.Or, choose your own OS and clients.Start buildingBuild your ownStep 1 – HardwareMinimum specs4 - 8 GB RAMSee note on stakingSee note on Raspberry Pi2 TB SSDSSD necessary for required write speeds.RecommendedIntel NUC, 7th gen or higherx86 processorWired internet connectionNot required, but provides easier setup and most consistent connectionDisplay screen and keyboardUnless you're using DAppNode, or ssh/headless setupStep 2 – SoftwareOption 1 – DAppNodeWhen you're ready with your hardware, the DAppNode operating system can be downloaded using any computer and installed onto a fresh SSD via a USB drive.DAppNode Setup(opens in a new tab)Option 2 – Command lineFor maximum control, experienced users may prefer using the command line instead.See our developer docs for more information on getting started with client selection.Command line setupFind some helpersOnline platforms such as Discord or Reddit are home to a large number of community builders willing to help you with any questions you may encounter.Don't go at it alone. If you have a question it's likely someone here can help you find an answer.Join the DAppNode Discord(opens in a new tab)Find online communitiesFurther readingMastering Ethereum - Should I Run a Full Node(opens in a new tab) - Andreas AntonopoulosEthereum on ARM - Quick Start Guide(opens in a new tab)The Limits to Blockchain Scalability(opens in a new tab) - Vitalik ButerinStake your ETHThough not required, with a node up and running you're one step closer to staking your ETH to earn rewards and help contribute to a different component of Ethereum security.Stake ETHPlan on staking?To maximize the efficiency of your validator, a minimum of 16 GB RAM is recommended, but 32 GB is better, with a CPU benchmark score of 6667+ on .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}cpubenchmark.net.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);}. It is also recommended that stakers have access to unlimited high-speed internet bandwidth, though this is not an absolute requirement.EthStaker goes into more detail in this hour long special - How to shop for Ethereum validator hardware(opens in a new tab)A note on Raspberry Pi (ARM processor)Raspberry Pis are lightweight and affordable computers, but they have limitations that may impact the performance of your node. Though not currently recommended for staking, these can be an excellent and inexpensive option for running a node for personal use, with as little as 4 - 8 GB of RAM.Ethereum on ARM documentation(opens in a new tab) - Learn how to set up a node via the command line on a Raspberry PiRun a node with Raspberry Pi - Follow along here if tutorials are your preferenceTest your Ethereum knowledgeWas this page helpful?YesNo'''
