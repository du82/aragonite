["https://ethereum.org/en/staking"]
title = "Ethereum staking: How does it work?"
description = "An overview of Ethereum staking: the risks, rewards, requirements, and where to do it."
full_description = "What is staking?Staking is the act of depositing 32 ETH to activate software. As a validator you’ll be responsible for storing data, processing transactions, and adding new to the blockchain. This will keep Ethereum secure for everyone and earn you new ETH in the process.Why stake your ETH?Earn rewardsRewards are given for actions that help the network reach . You'll get rewards for running software that properly batches transactions into new blocks and checks the work of other validators because that's what keeps the chain running securely.Better securityThe network gets stronger against attacks as more ETH is staked, as it then requires more ETH to control a majority of the network. To become a threat, you would need to hold the majority of validators, which means you'd need to control the majority of ETH in the system–that's a lot!More sustainableStakers don't need to do energy-intensive proof-of-work computations to participate in securing the network meaning staking nodes can run on relatively modest hardware using very little energy.More on Ethereum's energy consumptionHow to stake your ETHIt all depends on how much you are willing to stake. You'll need 32 ETH to activate your own validator, but it is possible to stake less.Check out the options below and go for the one that is best for you, and for the network.Home stakingMost impactfulFull controlFull rewardsTrustlessHome staking on Ethereum is the gold standard for staking. It provides full participation rewards, improves the decentralization of the network, and never requires trusting anyone else with your funds.Those considering staking from home should have some amount of ETH and a dedicated computer connected to the internet ~24/7. Some technical know-how is helpful, but easy-to-use tools now exist to help simplify this process.Home stakers can pool their funds with others, or go solo with at least 32 ETH. Liquid staking token solutions can be used to maintain access to DeFi.More on home stakingStaking as a serviceYour 32 ETHYour validator keysEntrusted node operationIf you don't want or don't feel comfortable dealing with hardware but still want to stake your 32 ETH, staking-as-a-service options allow you to delegate the hard part while you earn native block rewards.These options usually walk you through creating a set of validator credentials, uploading your signing keys to them, and depositing your 32 ETH. This allows the service to validate on your behalf.This method of staking requires a certain level of trust in the provider. To limit counter-party risk, the keys to withdrawal your ETH are usually kept in your possession.More on staking as a servicePooled stakingStake any amountEarn rewardsKeep it simplePopularSeveral pooling solutions exist to assist users who do not have or feel comfortable staking 32 ETH.Many of these options include what is known as 'liquid staking' which involves an liquidity token that represents your staked ETH.Liquid staking makes staking and unstaking as simple as a token swap and enables the use of staked capital in DeFi. This option also allows users to hold custody of their assets in their own Ethereum .Pooled staking is not native to the Ethereum network. Third parties are building these solutions, and they carry their own risks.More on pooled stakingCentralized exchangesLeast impactfulHighest trust assumptionsMany centralized exchanges provide staking services if you are not yet comfortable holding ETH in your own wallet. They can be a fallback to allow you to earn some yield on your ETH holdings with minimal oversight or effort.The trade-off here is that centralized providers consolidate large pools of ETH to run large numbers of validators. This can be dangerous for the network and its users as it creates a large centralized target and point of failure, making the network more vulnerable to attack or bugs.If you don't feel comfortable holding your own , that's okay. These options are here for you. In the meantime, consider checking out our wallets page, where you can get started learning how to take true ownership over your funds. When you're ready, come back and level up your staking game by trying one of the self-custody pooled staking services offered.As you may have noticed, there are many ways to participate in Ethereum staking. These paths target a wide range of users and ultimately are each unique and vary in terms of risks, rewards, and trust assumptions. Some are more decentralized, battle-tested and/or risky than others. We provide some information on popular projects in the space, but always do your own research before sending ETH anywhere.Comparison of staking optionsThere is no one-size-fits-all solution for staking, and each is unique. Here we'll compare some of the risks, rewards and requirements of the different ways you can stake.Home stakingRewardsMaximum rewards - receive full rewards directly from the protocolRewards for proposing blocks, including unburnt transaction fees, and attesting regularly to the state of the networkOption to mint a liquid staking token against your home node to be used in DeFiRisksYour ETH is at stakeThere are penalties, which cost ETH, for going offlineSlashing (larger penalties and ejection from the network) for malicious behaviourMinting a liquid staking token will introduce smart contract risk, but this is entirely optionalRequirementsYou must deposit 32 ETHMaintain hardware that runs both an Ethereum and while connected to the internetThe Staking Launchpad(opens in a new tab) will walk you through the process and hardware requirementsMore on home stakingStaking as a serviceRewardsUsually involves full protocol rewards minus monthly fee for node operationsDashboards often available to easily track your validator clientRisksSame risks as solo staking plus counter-party risk of service providerUse of your signing keys is entrusted to someone else who could behave maliciouslyRequirementsDeposit 32 ETH and generate your keys with assistanceStore your keys securelyThe rest is taken care of, though specific services will varyMore on staking as a servicePooled stakingRewardsPooled stakers accrue rewards differently, depending on which method of pooled staking is chosenMany pooled staking services offer one or more that represents your staked ETH plus your share of the validator rewardsLiquidity tokens can be held in your own wallet, used in and sold if you decide to exitRisksRisks vary depending on the method usedIn general, risks consist of a combination of counter-party, and execution riskRequirementsLowest ETH requirements, some projects require as little as 0.01 ETHDeposit directly from your wallet to different pooled staking platforms or simply trade for one of the staking liquidity tokensMore on pooled stakingJoin the staker communityEthStaker is a community for everyone to discuss and learn about staking on Ethereum. Join tens of thousands of members from around the globe for advice, support, and to talk all things staking.Discord(opens in a new tab)Reddit(opens in a new tab)Website(opens in a new tab)FAQIs staking already live?MoreWhen can I withdraw my staked ETH?MoreWhat is a validator?MoreWhy do I need to have funds at stake?MoreCan I buy 'Eth2'?MoreFurther readingSerenity Design Rationale(opens in a new tab) - Vitalik ButerinEth2 News(opens in a new tab) - Ben EdgingtonFinalized no. 33, the Ethereum consensus-layer (Jan 2022)(opens in a new tab) - Danny RyanAttestant Posts(opens in a new tab)Beaconcha.in Community-Contributed Educational Materials(opens in a new tab)Ethereum Staking Launchpad FAQ(opens in a new tab)EthStaker knowledge base(opens in a new tab)Was this page helpful?YesNo"
