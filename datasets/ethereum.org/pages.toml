["https://ethereum.org/en/community/grants"]
title = "Ethereum Foundation & community grant programs"
description = "A listing of the grant programs throughout the Ethereum ecosystem."
full_description = "On this pageEthereum grantsThe programs listed below offer a variety of funding grants for projects working to promote the success and growth of the Ethereum ecosystem. Use this as a guide to find and apply for funds to help make your next Ethereum project a success.This list is curated by our community. If there's something missing or incorrect, please edit this page!Broad Ethereum ecosystemThese programs support the broad Ethereum ecosystem by offering grants to a wide scope of projects. These include solutions for scalability, community building, security, privacy, and more. These grants are not specific to any one Ethereum platform and are a good place to start if you're unsure.EF Ecosystem Support Program(opens in a new tab) - Funding open source projects that benefit Ethereum, with a particular focus on universal tools, infrastructure, research and public goodsMoloch DAO(opens in a new tab) - Privacy, layer 2 scaling, client security, and moreDAO Grants(opens in a new tab) - Google spreadsheet of organizations offering grantsAcademic Grants(opens in a new tab) - Grants to support Ethereum-related academic workBlockworks Grantfarm(opens in a new tab) - Blockworks has compiled a comprehensive directory of all grants, RFPs, and bug bounties.Project specificThese projects have created their own grants for projects aimed at developing and experimenting with their own technology.Aave Grants Program(opens in a new tab) – Aave(opens in a new tab) grants DAOBalancer(opens in a new tab) – Balancer(opens in a new tab) ecosystem fundChainlink Grants Program(opens in a new tab) - Chainlink(opens in a new tab) community grantsDecentraland Grants Program(opens in a new tab) – Decentraland(opens in a new tab) DAO MetaverseLido Ecosystem Grants Organisation (LEGO)(opens in a new tab) – Lido(opens in a new tab) finance ecosystemMetaMask Program(opens in a new tab) - MetaMask(opens in a new tab) employee-led grants DAOSKALE Network Grants Program(opens in a new tab) - SKALE Network(opens in a new tab) ecosystemSwarm Foundation Grants Program(opens in a new tab) - Swarm Foundation(opens in a new tab) ecosystemThe Graph(opens in a new tab) – The Graph(opens in a new tab) ecosystemUniswap Grants Program(opens in a new tab) – Uniswap(opens in a new tab) communityQuadratic fundingThe open source roots of Ethereum have led to the growth of an interesting new fundraising model: quadratic funding. This has the potential to improve the way we fund all types of public goods in the future. Quadratic funding makes sure that the projects that receive the most funding are those with the most unique demand. In other words, projects that stand to improve the lives of the most people. More on quadratic funding.Gitcoin(opens in a new tab)clr.fund(opens in a new tab)Work in EthereumNot ready to start your own project? There are hundreds of companies actively looking for passionate individuals to work in and contribute to the Ethereum ecosystem. Looking for more information? Check out Ethereum related jobsWas this article helpful?YesNo"
