["https://ethereum.org/en/contributing"]
title = "Contributing"
description = "Learn about the different ways you can contribute to ethereum.org"
full_description = '''On this pageContributing to ethereum.org 🦄Ethereum.org is an open-source run project with 12 000+ contributors that help translate, write, design and maintain the website.We are a welcoming community that will help you grow and educate in the Ethereum ecosystem while also meaningfully contribute and get relevant practical experience!Ways to contributeTranslationsJoin the translation program – Help us bring ethereum.org to new languagesDevelopmentWork on an open issue(opens in a new tab) – Work we've identified that needs doingDesignHelp design the website – Designers of all levels can contribute to improve the websiteContentCreate/edit content – Suggest new pages or make tweaks to what's here alreadyAdd community resources – Add a helpful article or resource to a relevant pageSuggest a design resource – Add, update, and delete helpful design resourcesAdd a glossary term – Help us continue to expand the Ethereum glossaryQuizzes – Add, update, and delete quiz question banks for a relevant pageFeature ideasRequest a feature(opens in a new tab) – Let us know about any ideas you have for a new feature or designProduct listingsAdd an exchange – Add an exchange to our exchange finderAdd a product – Add a dapp or wallet to a relevant pageAdd developer tools – Add a developer tool to a relevant pageAdd a layer 2 – Add a layer 2 to a relevant pageAdd a staking product or service – Add a project that helps facilitate solo staking, pooled staking, or staking as a serviceAdd a wallet – Add a wallet for the find wallets pageSuggest a project for our DeSci page – Add a project built on Ethereum that contributes to decentralized scienceAny questions? 🤔 Join our Discord server(opens in a new tab)Good first tasks to start contributingThese are few current tasks that you could help us solve and take responsibility for. For most you will need GitHub account as most changes to the website are made through GitHub.K(opens in a new tab)by konopkjainclude event tracking for "edit" button globally (opens in a new tab)feature ✨help wantedStatus: Stalegood first issuedev requiredC(opens in a new tab)by corwintinesCreate stories for Staking components(opens in a new tab)feature ✨help wantedStatus: Stalegood first issueC(opens in a new tab)by corwintinesCreate stories for Simulator components(opens in a new tab)feature ✨help wantedStatus: Stalegood first issueC(opens in a new tab)by corwintinesCreate stories for Header components(opens in a new tab)feature ✨help wantedStatus: Stalegood first issueC(opens in a new tab)by corwintinesCreate story for AssetDownload component(opens in a new tab)feature ✨help wantedStatus: Stalegood first issueT(opens in a new tab)by TatianavytoAdd event listing: European Blockchain Convention(opens in a new tab)help wantedlow priorityStatus: Stalegood first issueevent 📅W(opens in a new tab)by wackerowDocumentation request: interacting with smart contracts(opens in a new tab)feature ✨help wantedcontent 🖋️Status: Stalegood first issueA(opens in a new tab)by aslikayaRANDAO explanation in Node Architecture page(opens in a new tab)content 🖋️Status: Stalegood first issueS(opens in a new tab)by SatglowReview texts still referring to mining/miners etc.(opens in a new tab)bug 🐛help wantedcontent 🖋️Status: Stalegood first issueR(opens in a new tab)by ricardo-jtgSuggest a developer tool(opens in a new tab)help wantedStatus: Stalegood first issueproduct 🧰See all tasks(opens in a new tab)How to work on ethereum.orgIf you wish to contribute in the Translation Program, we ask you to create an account on Crowdin(opens in a new tab). For everything else – adding or editing content or visuals to the website, fixing bugs, working on open tasks – you will need a GitHub(opens in a new tab) account.All updates are made via the GitHub PR process. This means you create a local copy of the website, make your changes and request to merge your changes. If you've never done this before, follow the instructions at the bottom of our GitHub repository(opens in a new tab).You don't need permission to work on anything, but it's always best to let us know what you're planning to do. You can do this by:Commenting on an issue or PR in GitHub(opens in a new tab)Messaging on our Discord server(opens in a new tab)Before contributing, make sure you're familiar with:the evolving vision of ethereum.orgour design principlesour style guideour code of conductUnsure where to start?Take a quick quiz and find out how you can contribute on ethereum.org.Take a quiz(opens in a new tab)How decisions about the site are madeDecisions about individual PRs, design evolution and major upgrades are made by a team from across the Ethereum ecosystem. This team includes project managers, developers, designers, marketing and communications, and subject matter experts. Community input informs every decision: so please raise questions in issues, submit PRs, or contact the team:website@ethereum.org(opens in a new tab)@ethdotorg(opens in a new tab)Discord server(opens in a new tab)A note on plagiarismOnly use your original work or content that you have permission to use when contributing any content or artifact to ethereum.org. Many projects within the Ethereum ecosystem use open-source licensing that allows for the free sharing of information. However, if you cannot find this information, do not attempt to add it to ethereum.org. Any pull requests deemed as plagiarism will get rejected.New to open-source?We have low barrier to entry issues on our GitHub repository specifically designed for developers who are new to open-source labelled good first issue(opens in a new tab).Claim your Onchain Achievement Token (OAT)If your contribution gets merged into ethereum.org, you will have a chance to claim a special badge on Galxe(opens in a new tab). An Onchain Achievement Token (OAT) is a proof that you helped make the ecosystem a little more awesome.More on OATs(opens in a new tab)How to claimJoin our Discord server(opens in a new tab).Paste a link to your contribution in the #🥇 | proof-of-contribution channel.Wait for a member of our team to send you a link to your OAT.Claim your OAT!You should only use self-custody wallets to claim OATs. Do not use exchange accounts or other accounts you do not hold the private keys to, as these will not allow you to access and manage your OATs.Claim your GitPOAPGitPOAP will also automatically recognize your merged contribution and let you mint a separate unique contributors POAP on their platform itself!How to claimVisit GitPOAP(opens in a new tab).Connect with your wallet or even with your email through sign in option.Search for your GitHub username, ETH address, ENS names or any GitPOAP to check if you're eligible.If your GitHub account is eligible, then you would be able to mint a GitPOAP!ContributorsThanks to our 0 Ethereum community members who have contributed so far!Was this article helpful?YesNo'''
year_published = 2025
clearnet = "https://ethereum.org/en/contributing"
tags = ["000+", "achievement", "build", "claim", "community", "contribute", "contributing", "contributors", "corwintinescreate", "decisions"]
