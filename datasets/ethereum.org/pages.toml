title = "What is a DAO? | Decentralized Autonomous Organization"
description = "An overview of DAOs on Ethereum"
full_description = "What are DAOs?A DAO is a collectively-owned organization working towards a shared mission.DAOs allow us to work with like-minded folks around the globe without trusting a benevolent leader to manage the funds or operations. There is no CEO who can spend funds on a whim or CFO who can manipulate the books. Instead, blockchain-based rules baked into the code define how the organization works and how funds are spent.They have built-in treasuries that no one has the authority to access without the approval of the group. Decisions are governed by proposals and voting to ensure everyone in the organization has a voice, and everything happens transparently .Why do we need DAOs?Starting an organization with someone that involves funding and money requires a lot of trust in the people you're working with. But it’s hard to trust someone you’ve only ever interacted with on the internet. With DAOs you don’t need to trust anyone else in the group, just the DAO’s code, which is 100% transparent and verifiable by anyone.This opens up so many new opportunities for global collaboration and coordination.A comparisonDAOA traditional organizationUsually flat, and fully democratized.Usually hierarchical.Voting required by members for any changes to be implemented.Depending on structure, changes can be demanded from a sole party, or voting may be offered.Votes tallied, and outcome implemented automatically without trusted intermediary.If voting allowed, votes are tallied internally, and outcome of voting must be handled manually.Services offered are handled automatically in a decentralized manner (for example distribution of philanthropic funds).Requires human handling, or centrally controlled automation, prone to manipulation.All activity is transparent and fully public.Activity is typically private, and limited to the public.DAO examplesTo help this make more sense, here's a few examples of how you could use a DAO:A charity – you could accept donations from anyone in the world and vote on which causes to fund.Collective ownership – you could purchase physical or digital assets and members can vote on how to use them.Ventures and grants – you could create a venture fund that pools investment capital and votes on ventures to back. Repaid money could later be redistributed amongst DAO-members.How do DAOs work?The backbone of a DAO is its , which defines the rules of the organization and holds the group's treasury. Once the contract is live on Ethereum, no one can change the rules except by a vote. If anyone tries to do something that's not covered by the rules and logic in the code, it will fail. And because the treasury is defined by the smart contract too that means no one can spend the money without the group's approval either. This means that DAOs don't need a central authority. Instead, the group makes decisions collectively, and payments are automatically authorized when votes pass.This is possible because smart contracts are tamper-proof once they go live on Ethereum. You can't just edit the code (the DAOs rules) without people noticing because everything is public.Ethereum and DAOsEthereum is the perfect foundation for DAOs for a number of reasons:Ethereum’s own consensus is decentralized and established enough for organizations to trust the network.Smart contract code can’t be modified once live, even by its owners. This allows the DAO to run by the rules it was programmed with.Smart contracts can send/receive funds. Without this you'd need a trusted intermediary to manage group funds.The Ethereum community has proven to be more collaborative than competitive, allowing for best practices and support systems to emerge quickly.DAO governanceThere are many considerations when governing a DAO, such as how voting and proposals work.DelegationDelegation is like the DAO version of representative democracy. Token holders delegate votes to users who nominate themselves and commit to stewarding the protocol and staying informed.A 