["https://ethereum.org/en/history"]
title = "History and Forks of Ethereum"
description = "A history of the Ethereum blockchain including major milestones, releases, and forks."
full_description = '''On this pageThe history of EthereumA timeline of all the major milestones, forks, and updates to the Ethereum blockchain.What are forks?Changes to the rules of the Ethereum protocol which often include planned technical upgrades.MoreWhy do some upgrades have multiple names?Upgrades names follow a patternMoreSkip straight to information about some of the particularly important past upgrades: The Beacon Chain; The Merge; and EIP-1559Looking for future protocol upgrades? Learn about upcoming upgrades on the Ethereum roadmap.2025Prague-Electra ("Pectra", in progress)The Prague-Electra ("Pectra") upgrade includes several improvements to the Ethereum protocol aimed at enhancing the experience for all users, layer 2 networks, stakers and node operators.Staking gets an upgrade with compounding validator accounts, and improved control over staked funds using the execution withdrawal address. EIP-7251 increases the max effective balance for a single validator to 2048, improving capital efficiency for stakers. EIP-7002 allows an execution account to securely trigger validator actions, including exiting, or withdrawing portions of the funds, improving the experience for ETH stakers, while helping strengthen accountability for node operators.Other parts of the upgrade focus on improving the experience for regular users. EIP-7702 brings the ability for a regular non-smart-contract account () to execute code similar to a smart contract. This unlocks unbounded new functionality for traditional Ethereum accounts, such as transaction batching, gas sponsorship, alternative authentication, programmable spending controls, account recovery mechanisms and more.Pectra EIPsOfficial improvements included in this upgrade.MorePectra.wtf(opens in a new tab)How Pectra will enhance the staking experience(opens in a new tab)Read the Electra upgrade specifications(opens in a new tab)Prague-Electra ("Pectra") FAQ2024Cancun-Deneb ("Dencun")Block number: 19,426,587(opens in a new tab)Epoch number: 269,568(opens in a new tab)Slot number: 8,626,176(opens in a new tab)ETH price: $3,984.00ethereum.org on waybackmachine(opens in a new tab)Cancun summaryThe Cancun upgrade contains a set of improvements to Ethereum's execution aimed towards improving scalability, in tandem with the Deneb consensus upgrades.Notably this includes EIP-4844, known as Proto-Danksharding, which significantly decreases the cost of data storage for layer 2 rollups. This is achieved through the introduction of data "blobs" which enables rollups to post data to Mainnet for a short period of time. This results in significantly lower transaction fees for users of layer 2 rollups.Cancun EIPsOfficial improvements included in this upgrade.MoreLayer 2 rollupsProto-DankshardingDankshardingRead the Cancun upgrade specification(opens in a new tab)Deneb summaryThe Deneb upgrade contains a set of improvements to Ethereum's consensus aimed towards improving scalability. This upgrade comes in tandem with the Cancun execution upgrades to enable Proto-Danksharding (EIP-4844), along with other improvements to the Beacon Chain.Pre-generated signed "voluntary exit messages" no longer expire, thus giving more control to users staking their funds with a third-party node operator. With this signed exit message, stakers can delegate node operation while maintaining the ability to safely exit and withdraw their funds at any time, without needing to ask permission from anyone.EIP-7514 brings a tightening to the issuance of ETH by capping the "churn" rate that validators can join the network to eight (8) per epoch. Since ETH issuance is proportional to total ETH staked, limiting the number of validators joining caps the growth rate of newly issued ETH, while also reducing hardware requirements for node operators, helping decentralization.Deneb EIPsOfficial improvements included in this upgradeMoreRead the Deneb upgrade specifications(opens in a new tab)Cancun-Deneb ("Dencun") FAQ2023Shanghai-Capella ("Shapella")Block number: 17,034,870(opens in a new tab)Epoch number: 194,048(opens in a new tab)Slot number: 6,209,536(opens in a new tab)ETH price: $1,917.00ethereum.org on waybackmachine(opens in a new tab)Shanghai summaryThe Shanghai upgrade brought staking withdrawals to the execution layer. In tandem with the Capella upgrade, this enabled blocks to accept withdrawal operations, which allows stakers to withdraw their ETH from the Beacon Chain to the execution layer.Shanghai EIPsOfficial improvements included in this upgrade.MoreRead the Shanghai upgrade specification(opens in a new tab)Capella summaryThe Capella upgrade was the third major upgrade to the consensus layer (Beacon Chain) and enabled staking withdrawals. Capella occurred synchronously with the execution layer upgrade, Shanghai, and enabled staking withdrawal functionality.This consensus layer upgrade brought the ability for stakers who did not provide withdrawal credentials with their initial deposit to do so, thereby enabling withdrawals.The upgrade also provided automatic account sweeping functionality, which continuously processes validator accounts for any available rewards payments or full withdrawals.More on staking withdrawals.Read the Capella upgrade specifications(opens in a new tab)2022Paris (The Merge)Block number: 15,537,394(opens in a new tab)ETH price: $1,472.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Paris upgrade was triggered by the proof-of-work blockchain passing a of 58750000000000000000000. This happened at block 15537393 on 15th September 2022, triggering the Paris upgrade the next block. Paris was The Merge transition - its major feature was switching off the proof-of-work mining algorithm and associated consensus logic and switching on proof-of-stake instead. Paris itself was an upgrade to the execution clients (equivalent to Bellatrix on the consensus layer) that enabled them to take instruction from their connected consensus clients. This required a new set of internal API methods, collectively known as the Engine API(opens in a new tab), to be activated. This was arguably the most significant upgrade in Ethereum history since Homestead!Read the Paris upgrade specification(opens in a new tab)Paris EIPsOfficial improvements included in this upgrade.MoreBellatrixEpoch number: 144,896(opens in a new tab)ETH price: $1,558.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Bellatrix upgrade was the second scheduled upgrade for the Beacon Chain, preparing the chain for The Merge. It brings validator penalties to their full values for inactivity and slashable offenses. Bellatrix also includes an update to the fork choice rules to prepare the chain for The Merge and the transition from the last proof-of-work block to the first proof-of-stake block. This includes making consensus clients aware of the of 58750000000000000000000.Read the Bellatrix upgrade specification(opens in a new tab)Gray GlacierBlock number: 15,050,000(opens in a new tab)ETH price: $1,069.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Gray Glacier network upgrade pushed back the by three months. This is the only change introduced in this upgrade, and is similar in nature to the Arrow Glacier and Muir Glacier upgrades. Similar changes have been performed on the Byzantium, Constantinople and London network upgrades.EF Blog - Gray Glacier Upgrade Announcement(opens in a new tab)Gray Glacier EIPsOfficial improvements included in this upgrade.More2021Arrow GlacierBlock number: 13,773,000(opens in a new tab)ETH price: $4,111.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Arrow Glacier network upgrade pushed back the by several months. This is the only change introduced in this upgrade, and is similar in nature to the Muir Glacier upgrade. Similar changes have been performed on the Byzantium, Constantinople and London network upgrades.EF Blog - Arrow Glacier Upgrade Announcement(opens in a new tab)Ethereum Cat Herders - Ethereum Arrow Glacier Upgrade(opens in a new tab)Arrow Glacier EIPsOfficial improvements included in this upgrade.MoreAltairEpoch number: 74,240(opens in a new tab)ETH price: $4,024.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Altair upgrade was the first scheduled upgrade for the Beacon Chain. It added support for "sync committees"—enabling light clients, and increased validator inactivity and slashing penalties as development progressed towards The Merge.Read the Altair upgrade specification(opens in a new tab)Fun fact!Altair was the first major network upgrade that had an exact rollout time. Every upgrade prior had been based on a declared block number on the proof-of-work chain, where block times vary. The Beacon Chain does not require solving for proof-of-work, and instead works on a time-based epoch system consisting of 32 twelve-second "slots" of time where validators can propose blocks. This is why we knew exactly when we would hit epoch 74,240 and Altair became live!Block timeLondonBlock number: 12,965,000(opens in a new tab)ETH price: $2,621.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe London upgrade introduced EIP-1559(opens in a new tab), which reformed the transaction fee market, along with changes to how gas refunds are handled and the schedule.What was the London Upgrade / EIP-1559?Before the London Upgrade, Ethereum had fixed-sized blocks. In times of high network demand, these blocks operated at full capacity. As a result, users often had to wait for demand to reduce to get included in a block, which led to a poor user experience. The London Upgrade introduced variable-sized blocks to Ethereum.The way transaction fees on the Ethereum network were calculated changed with the London Upgrade of August 2021. Before the London upgrade, fees were calculated without separating base and priority fees, as follows:Let's say Alice had to pay Bob 1 ETH. In the transaction, the gas limit is 21,000 units, and the gas price is 200 gwei.The total fee would have been: Gas units (limit) * Gas price per unit i.e 21,000 * 200 = 4,200,000 gwei or 0.0042 ETHThe implementation of EIP-1559(opens in a new tab) in the London Upgrade made the transaction fee mechanism more complex, but made gas fees more predictable, resulting in a more efficient transaction fee market. Users can submit transactions with a maxFeePerGas corresponding to how much they are willing to pay for the transaction to be executed, knowing that they will not pay more than the market price for gas (baseFeePerGas), and get any extra, minus their tip, refunded.This video explains EIP-1559 and the benefits it brings: EIP-1559 Explained(opens in a new tab)Are you a dapp developer? Be sure to upgrade your libraries and tooling.(opens in a new tab)Read the Ethereum Foundation announcement(opens in a new tab)Read the Ethereum Cat Herder's explainer(opens in a new tab)London EIPsOfficial improvements included in this upgrade.MoreBerlinBlock number: 12,244,000(opens in a new tab)ETH price: $2,454.00ethereum.org on waybackmachine(opens in a new tab)SummaryThe Berlin upgrade optimized gas cost for certain EVM actions, and increases support for multiple transaction types.Read the Ethereum Foundation announcement(opens in a new tab)Read the Ethereum Cat Herder's explainer(opens in a new tab)Berlin EIPsOfficial improvements included in this upgrade.More2020Beacon Chain genesisSlot number: 1(opens in a new tab)ETH price: $586.23ethereum.org on waybackmachine(opens in a new tab)SummaryThe Beacon Chain needed 16384 deposits of 32 staked ETH to ship securely. This happened on November 27, meaning the Beacon Chain started producing blocks on December 1, 2020. This is an important first step in achieving the Ethereum vision.Read the Ethereum Foundation announcement(opens in a new tab)The Beacon ChainStaking deposit contract deployedBlock number: 11,052,984(opens in a new tab)ETH price: $379.04ethereum.org on waybackmachine(opens in a new tab)SummaryThe staking deposit contract introduced to the Ethereum ecosystem. Although a contract, it had a direct impact on the timeline for launching the Beacon Chain, an important Ethereum upgrade.Read the Ethereum Foundation announcement(opens in a new tab)StakingMuir GlacierBlock number: 9,200,000(opens in a new tab)ETH price: $127.18ethereum.org on waybackmachine(opens in a new tab)SummaryThe Muir Glacier fork introduced a delay to the . Increases in block difficulty of the proof-of-work consensus mechanism threatened to degrade the usability of Ethereum by increasing wait times for sending transactions and using dapps.Read the Ethereum Foundation announcement(opens in a new tab)Read the Ethereum Cat Herder's explainer(opens in a new tab)Muir Glacier EIPsOfficial improvements included in this fork.More2019IstanbulBlock number: 9,069,000(opens in a new tab)ETH price: $151.06ethereum.org on waybackmachine(opens in a new tab)SummaryThe Istanbul fork:Optimised the cost of certain actions in the EVM.Improved denial-of-service attack resilience.Made Layer 2 scaling solutions based on SNARKs and STARKs more performant.Enabled Ethereum and Zcash to interoperate.Allowed contracts to introduce more creative functions.Read the Ethereum Foundation announcement(opens in a new tab)Istanbul EIPsOfficial improvements included in this fork.MoreConstantinopleBlock number: 7,280,000(opens in a new tab)ETH price: $136.29ethereum.org on waybackmachine(opens in a new tab)SummaryThe Constantinople fork:Reduced block mining rewards from 3 to 2 ETH.Ensured the blockchain didn't freeze before proof-of-stake was implemented.Optimised the cost of certain actions in the EVM.Added the ability to interact with addresses that haven't been created yet.Read the Ethereum Foundation announcement(opens in a new tab)Constantinople EIPsOfficial improvements included in this fork.More2017ByzantiumBlock number: 4,370,000(opens in a new tab)ETH price: $334.23ethereum.org on waybackmachine(opens in a new tab)SummaryThe Byzantium fork:Reduced block mining rewards from 5 to 3 ETH.Delayed the by a year.Added ability to make non-state-changing calls to other contracts.Added certain cryptography methods to allow for layer 2 scaling.Read the Ethereum Foundation announcement(opens in a new tab)Byzantium EIPsOfficial improvements included in this fork.More2016Spurious DragonBlock number: 2,675,000(opens in a new tab)ETH price: $9.84ethereum.org on waybackmachine(opens in a new tab)SummaryThe Spurious Dragon fork was the second response to the denial of service (DoS) attacks on the network (September/October 2016) including:tuning opcode pricing to prevent future attacks on the network.enabling “debloat” of the blockchain state.adding replay attack protection.Read the Ethereum Foundation announcement(opens in a new tab)Spurious Dragon EIPsOfficial improvements included in this fork.MoreTangerine whistleBlock number: 2,463,000(opens in a new tab)ETH price: $12.50ethereum.org on waybackmachine(opens in a new tab)Summary'''
year_published = 2025
