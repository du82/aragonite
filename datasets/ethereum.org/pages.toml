["https://ethereum.org/en/enterprise"]
title = "Enterprise on Ethereum Mainnet"
description = "Guides, articles, and tools about enterprise applications on the public Ethereum blockchain"
full_description = "On this pageEthereum for enterpriseEthereum can help many kinds of businesses, including large companies:Increase trust and reduce the cost of coordination between business partiesImprove business network accountability and operational efficiencyBuild new business models and value creation opportunitiesCompetitively future-proof their organizationIn the early years, many enterprise blockchain applications were built on private permissioned Ethereum compatible blockchains or consortium chains. Today, thanks to technological advances which enable greater throughput, lower transaction cost, and privacy, most enterprise applications that use Ethereum technology are being built on the public Ethereum Mainnet or on Layer 2 chains.ResourcesFurther readingNon-technical resources for understanding how businesses can benefit from EthereumWhy Are Blockchains Useful For Business?(opens in a new tab) - Discusses the value of blockchains through the lens of predictabilityEnterprise Ethereum Alliance 2023 Business Readiness Report(opens in a new tab) - surveys the potential and capabilities of public Ethereum and the broader Ethereum ecosystem for businessesEthereum for Business by Paul Brody(opens in a new tab) - is a plain-English guide to the use cases that generate returns from asset management to payments to supply chainsOrganizationsSome collaborative efforts to make Ethereum enterprise friendly have been made by different organizationsEnterprise Ethereum Alliance(opens in a new tab) - The EEA helps organizations to adopt and use Ethereum technology in their daily business operations. Its goal is accelerating business Ethereum through professional and commercial support, advocacy and research, standards development and ecosystem trust services.Global Blockchain Business Council(opens in a new tab) - The GBBC is an industry association for the blockchain technology ecosystem. Through engaging policymakers and regulators, curating events and in-depth discussions, and driving research, GBBC is dedicated to further adoption of blockchain to create more secure, equitable, and functional societies.Enterprise developer resourcesProducts and services4EVERLAND(opens in a new tab) - provides APIs, RPC services and tools for hosting decentralized applications and enabling decentralized storage on EthereumAlchemy(opens in a new tab) - provides API services and tools for building and monitoring applications on EthereumBlast(opens in a new tab) - an API platform that provides RPC/WSS APIs for Ethereum Archive Mainnet and Testnets.Blockapps(opens in a new tab) - implementation of the Enterprise Ethereum protocol, tooling and APIs that form the STRATO platformChainstack(opens in a new tab) - mainnet and testnet Ethereum infrastructure hosted in public & isolated customer cloudsConsenSys(opens in a new tab) - provides a range of products and tools for building on Ethereum, as well as consulting and custom development servicesCrossmint(opens in a new tab) Enterprise-grade web3 development platform to deploy smart contracts, enable credit-card and cross chain payments, and use APIs to create, distribute, sell, store, and edit NFTs.Envision Blockchain(opens in a new tab) - provides enterprise focused consulting and development services specializing in Ethereum MainnetEY OpsChain(opens in a new tab) - provides a procurement workflow by issuing RFQ’s, contracts, purchase orders, and invoices across your network of trusted business partnersHyperledger Besu(opens in a new tab) - an enterprise focused open-source Ethereum client developed under the Apache 2.0 license and written in JavaInfura(opens in a new tab) - scalable API access to the Ethereum and IPFS networksKaleido(opens in a new tab) - an enterprise-focused development platform that offers simplified blockchain and digital asset applicationsNodeReal(opens in a new tab) - provides scalable blockchain infrastructure and API services provider for the Web3 ecosystemMoralis(opens in a new tab) - enterprise grade APIs and Nodes with a SOC2 type 2 certificationProvide(opens in a new tab) - enterprise zero-knowledge middlewareQuickNode(opens in a new tab) - provides reliable and fast nodes with high-level APIs like NFT API, Token API, etc., while delivering a unified product suite and enterprise-grade solutionsTenderly(opens in a new tab) - a Web3 development platform that provides debugging, observability, and infrastructure building blocks for developing, testing, monitoring, and operating smart contractsUnibright(opens in a new tab) - a team of blockchain specialists, architects, developers and consultants with 20+ years of experience in business processes and integrationZeeve(opens in a new tab) - provides a range of products and tools for building on Ethereum, also infrastructure and APIs for Enterprise Web3 applications.Tooling and librariesBaseline Project(opens in a new tab) - The Baseline Protocol is a set of tools and libraries that helps enterprises coordinate complex, multi-party business processes and workflows with privacy while keeping data in respective systems of record. The standard enables two or more state machines to achieve and maintain data consistency and workflow continuity by using a network as a common frame of reference.Chainlens(opens in a new tab) - SaaS and on-prem blockchain data and analytics platform from Web3 LabsErnst & Young's 'Nightfall'(opens in a new tab) - an application for transferring ERC20, ERC721 and ERC1155 applications under Zero Knowledge, using an Optimistic RollupScalability solutionsMost new blockchain applications are being built on Layer 2 chains. Layer 2 is a set of technologies or systems that run on top of Ethereum (Layer 1), inherit security properties from Layer 1, and provide greater transaction processing capacity (throughput), lower transaction fees (operating cost), and faster transaction confirmations than Layer 1. Layer 2 scaling solutions are secured by Layer 1, but they enable blockchain applications to handle many more users or actions or data than Layer 1 could accommodate. Many of them leverage recent advances in cryptography and zero-knowledge (ZK) proofs to maximize performance and security, and some offer an additional level of privacy.Enterprise applications live on Ethereum MainnetHere are some of the enterprise applications that have been built on top of the public Ethereum Mainnet and L2s by and for traditional, non-blockchain based companies.PaymentsBrave Browser(opens in a new tab) - pays users for their attention to advertisements and users can pay publishers to support them, via the Basic Attention TokenCity of Lugano, Switzerland(opens in a new tab) - payment of taxes and other municipal services EthereumAds(opens in a new tab) - lets web site operators sell advertising space and get paid via EthereumhCaptcha(opens in a new tab) - Bot prevention CAPTCHA system which pays web site operators for the work done by users to label data for machine learning. Now deployed by CloudflareOpera MiniPay(opens in a new tab) - makes mobile payments more accessible and secure for people in Africa with a non-custodial wallet and leverages phone numbers for easy transactionsRoxpay(opens in a new tab) - automates pay-per-use asset invoicing and paymentsSAP Digital Currency Hub(opens in a new tab) - cross border payments with stablecoins Toku(opens in a new tab) - payroll, token grant administration, tax compliance, local employment, benefits & distributed HR solutions Xerof(opens in a new tab) - facilitates fast and inexpensive international (cross-border) B2B paymentsFinanceABN AMRO(opens in a new tab) - with Tokeny, tokenized green bondsCrowdz(opens in a new tab) - invoice/receivables financing and factoring platformMata Capital(opens in a new tab) - real estate investment tokenization Obligate(opens in a new tab) - regulated and KYC'd onchain bonds and commercial paperSiemens(opens in a new tab) - bond issuanceSila(opens in a new tab) - banking and ACH payments infrastructure-as-a-service, using a stablecoinSociete Generale FORGE(opens in a new tab) - bond issuanceTaurus(opens in a new tab) - issues tokenized securitiesAsset tokenizationAgroToken(opens in a new tab) - tokenizing and trading agricultural commoditiesBitbond(opens in a new tab) - improves the issuance, settlement and custody of financial assets with tokenization Blocksquare(opens in a new tab) - tokenization infrastructure for real estateCentrifuge(opens in a new tab) - tokenized receivables financing, debt, and assetsClearmatics(opens in a new tab) - builds decentralised network platforms for the p2p exchange of tokenised valuedClimate(opens in a new tab) - decentralized climate information ecosystemFabrica(opens in a new tab) - a platform for digitizing real estate assets, enabling DeFi borrowing and property tradingFasset(opens in a new tab) - a platform for supporting sustainable infrastructureNori(opens in a new tab) - open source market infrastructure to allow for carbon removal projects to measure and monetize their activityPropy(opens in a new tab) - a platform to automate residential real estate transactions with smart contractsRealT(opens in a new tab) - investors around the globe can buy into the US real estate market through fully-compliant, fractional, tokenized ownershipRubey(opens in a new tab) - a platform that tokenizes high-end art to make it accessible to retail investorsSwarm(opens in a new tab) - a platform focused on the digitization and trading of real-world assets in a regulatory compliant mannerThallo(opens in a new tab) - a platform to integrate digital carbon credits into business transactionsTokenchampions(opens in a new tab) - tokenizes European football players' image rights Notarization of dataANSA(opens in a new tab) - Italian news agency fights fake news and enables readers to verify the origin of news stories by recording them on MainnetBreitling(opens in a new tab) - records provenance and repair history of watches on EthereumBRØK(opens in a new tab) - a cap tables platform for unlisted companies on the public, provided by The Norwegian GovernmentCertifaction(opens in a new tab) - legally valid eSignatures with by privacy-by-designEthSign(opens in a new tab) - records signed electronic documents on the Ethereum blockchainStacktical(opens in a new tab) - enables the software development, digital issuance and digital signature of Service Level Agreements (SLA) with native escrowing capabilitiesVerizon(opens in a new tab) - logs press releases on Ethereum to ensure corporate accountability and trustWolfTown(opens in a new tab) - by MEF and Sage Management automates Service Level Agreement reporting between telecom carriersSupply chainBirra Peroni(opens in a new tab) mints NFTs for each new batch of beer, enabling greater visibility and efficiency across its supply chainCargoX(opens in a new tab) - electronic bill of lading and document transfer provider for shippingCircularize(opens in a new tab) - an end-to-end traceability solution for raw materials made into productsEY OpsChain Contract Manager(opens in a new tab) - enables companies to engage in a procurement workflow by issuing RFQ’s, contracts, purchase orders, and invoices across a network of business partnersMinespider(opens in a new tab) - supply chain tracking and provenance, and CO2 emissions trackingMorpheus.network(opens in a new tab) - supply chain automation platformStaTwig(opens in a new tab) - supply chain operationsTradeTrust(opens in a new tab) - verifies electronic Bills of Lading (eBLs) for international shippingTransmute(opens in a new tab) - data exchange platform for global trade; supports Transactions with Decentralized Identity on EthereumInsuranceArbol(opens in a new tab) - parmetric insurance to cover weather related risksEtherisc(opens in a new tab) - decentralized insurance for a variety of risksNayms(opens in a new tab) - a digital space for the creation of insurance programs, the raising and trading of capital, the writing of risk, and the payment rails for premium and claim transactions, built with AONIdentity, credentials and certificationsBCdiploma(opens in a new tab) - digitizes and verifies diplomas, certificates, and micro-credentialsHyland Credentials(opens in a new tab) - digital diplomas and other education credentials, licenses, and certificatesPalau Digital Residency Program(opens in a new tab) - offers global citizens the ability to have a legal Palau government-issued IDSpherity(opens in a new tab) - offers digital identity management solutions to establish digital trust in ecosystems, focusing on decentralized identities and verifiable credentialsZug Digital ID(opens in a new tab) - is a blockchain-based identity system in Switzerland, offering residents digital access to government services and supporting functionalities like e-bike borrowing and municipal votingEntertainment, NFTs, and LoyaltyAdidas Virtual Gear(opens in a new tab) - a virtual gear NFT collectionThe British Museum's Sandbox(opens in a new tab) - an NFT collectionFruitlab(opens in a new tab) - a platform for gamers to earn from watching, sharing and playing online gamesNike Swoosh(opens in a new tab) - an NFT platformSothbebys Metaverse(opens in a new tab) - a digital art NFT marketplace by SothebysIf you would like to add to this list, please see instructions for contributing.Was this article helpful?YesNo"
year_published = 2025
clearnet = "https://ethereum.org/en/enterprise"
