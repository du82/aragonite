title = "What is a DAO? | Decentralized Autonomous Organization"
description = "An overview of DAOs on Ethereum"
full_description = "What are DAOs?A DAO is a collectively-owned organization working towards a shared mission.DAOs allow us to work with like-minded folks around the globe without trusting a benevolent leader to manage the funds or operations. There is no CEO who can spend funds on a whim or CFO who can manipulate the books. Instead, blockchain-based rules baked into the code define how the organization works and how funds are spent.They have built-in treasuries that no one has the authority to access without the approval of the group. Decisions are governed by proposals and voting to ensure everyone in the organization has a voice, and everything happens transparently .Why do we need DAOs?Starting an organization with someone that involves funding and money requires a lot of trust in the people you're working with. But it’s hard to trust someone you’ve only ever interacted with on the internet. With DAOs you don’t need to trust anyone else in the group, just the DAO’s code, which is 100% transparent and verifiable by anyone.This opens up so many new opportunities for global collaboration and coordination.A comparisonDAOA traditional organizationUsually flat, and fully democratized.Usually hierarchical.Voting required by members for any changes to be implemented.Depending on structure, changes can be demanded from a sole party, or voting may be offered.Votes tallied, and outcome implemented automatically without trusted intermediary.If voting allowed, votes are tallied internally, and outcome of voting must be handled manually.Services offered are handled automatically in a decentralized manner (for example distribution of philanthropic funds).Requires human handling, or centrally controlled automation, prone to manipulation.All activity is transparent and fully public.Activity is typically private, and limited to the public.DAO examplesTo help this make more sense, here's a few examples of how you could use a DAO:A charity – you could accept donations from anyone in the world and vote on which causes to fund.Collective ownership – you could purchase physical or digital assets and members can vote on how to use them.Ventures and grants – you could create a venture fund that pools investment capital and votes on ventures to back. Repaid money could later be redistributed amongst DAO-members.How do DAOs work?The backbone of a DAO is its , which defines the rules of the organization and holds the group's treasury. Once the contract is live on Ethereum, no one can change the rules except by a vote. If anyone tries to do something that's not covered by the rules and logic in the code, it will fail. And because the treasury is defined by the smart contract too that means no one can spend the money without the group's approval either. This means that DAOs don't need a central authority. Instead, the group makes decisions collectively, and payments are automatically authorized when votes pass.This is possible because smart contracts are tamper-proof once they go live on Ethereum. You can't just edit the code (the DAOs rules) without people noticing because everything is public.Ethereum and DAOsEthereum is the perfect foundation for DAOs for a number of reasons:Ethereum’s own consensus is decentralized and established enough for organizations to trust the network.Smart contract code can’t be modified once live, even by its owners. This allows the DAO to run by the rules it was programmed with.Smart contracts can send/receive funds. Without this you'd need a trusted intermediary to manage group funds.The Ethereum community has proven to be more collaborative than competitive, allowing for best practices and support systems to emerge quickly.DAO governanceThere are many considerations when governing a DAO, such as how voting and proposals work.DelegationDelegation is like the DAO version of representative democracy. Token holders delegate votes to users who nominate themselves and commit to stewarding the protocol and staying informed.A famous exampleENS(opens in a new tab) – ENS holders can delegate their votes to engaged community members to represent them.Automatic transaction governanceIn many DAOs, transactions will be automatically executed if a quorum of members votes affirmative.A famous exampleNouns(opens in a new tab) – In Nouns DAO, a transaction is automatically executed if a quorum of votes is met and a majority votes affirmative, as long as it is not vetoed by the founders.Multisig governanceWhile DAOs may have thousands of voting members, funds can live in a shared by 5-20 active community members who are trusted and usually doxxed (public identities known to the community). After a vote, the signers execute the will of the community.DAO lawsIn 1977, Wyoming invented the LLC, which protects entrepreneurs and limits their liability. More recently, they pioneered the DAO law that establishes legal status for DAOs. Currently Wyoming, Vermont, and the Virgin Islands have DAO laws in some form.A famous exampleCityDAO(opens in a new tab) – CityDAO used Wyoming's DAO law to buy 40 acres of land near Yellowstone National Park.DAO membershipThere are different models for DAO membership. Membership can determine how voting works and other key parts of the DAO.Token-based membershipUsually fully , depending on the token used. Mostly these governance tokens can be traded permissionlessly on a . Others must be earned through providing liquidity or some other ‘proof-of-work’. Either way, simply holding the token grants access to voting.Typically used to govern broad decentralized protocols and/or tokens themselves.A famous exampleMakerDAO(opens in a new tab) – MakerDAO's token MKR is widely available on decentralized exchanges and anyone can buy into having voting power on Maker protocol's future.Share-based membershipShare-based DAOs are more permissioned, but still quite open. Any prospective members can submit a proposal to join the DAO, usually offering a tribute of some value in the form of tokens or work. Shares represent direct voting power and ownership. Members can exit at any time with their proportionate share of the treasury.Typically used for more closer-knit, human-centric organizations like charities, worker collectives, and investment clubs. Can also govern protocols and tokens as well.A famous exampleMolochDAO(opens in a new tab) – MolochDAO is focused on funding Ethereum projects. They require a proposal for membership so the group can assess whether you have the necessary expertise and capital to make informed judgments about potential grantees. You can't just buy access to the DAO on the open market.Reputation-based membershipReputation represents proof of participation and grants voting power in the DAO. Unlike token or share-based membership, reputation-based DAOs don't transfer ownership to contributors. Reputation cannot be bought, transferred or delegated; DAO members must earn reputation through participation. Onchain voting is permissionless and prospective members can freely submit proposals to join the DAO and request to receive reputation and tokens as a reward in exchange for their contributions.Typically used for decentralized development and governance of protocols and , but also well suited to a diverse set of organizations like charities, worker collectives, investment clubs, etc.A famous exampleDXdao(opens in a new tab) – DXdao was a global sovereign collective building and governing decentralized protocols and applications since 2019. It leveraged reputation-based governance and to coordinate and manage funds, meaning no one could buy their way into influencing its future or governance. Join / start a DAOJoin a DAOEthereum community DAOsDAOHaus's list of DAOs(opens in a new tab)Tally.xyz list of DAOs(opens in a new tab)Start a DAOSummon a DAO with DAOHaus(opens in a new tab)Start a Governor DAO with Tally(opens in a new tab)Create an Aragon-powered DAO(opens in a new tab)Start a colony(opens in a new tab)Create a DAO with DAOstack's holographic consensus(opens in a new tab)Further readingDAO ArticlesWhat's a DAO?(opens in a new tab) – Aragon(opens in a new tab)House of DAOs(opens in a new tab) – Metagame(opens in a new tab)What is a DAO and what is it for?(opens in a new tab) – DAOhaus(opens in a new tab)How to Start a DAO-Powered Digital Community(opens in a new tab) – DAOhaus(opens in a new tab)What is a DAO?(opens in a new tab) – Coinmarketcap(opens in a new tab)What is Holographic Consensus?(opens in a new tab) - DAOstack(opens in a new tab)DAOs are not corporations: where decentralization in autonomous organizations matters by Vitalik(opens in a new tab)DAOs, DACs, DAs and More: An Incomplete Terminology Guide(opens in a new tab) - Ethereum Blog(opens in a new tab)VideosWhat is a DAO in crypto?(opens in a new tab)Can a DAO Build a City?(opens in a new tab) – TED(opens in a new tab)Test your Ethereum knowledgeWas this page helpful?YesNo"
