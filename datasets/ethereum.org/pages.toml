["https://ethereum.org/en/stablecoins"]
title = "Stablecoins explained: What are they for?"
description = "An introduction to Ethereum stablecoins: what they are, how to get them, and why they're important."
full_description = "StablecoinsDigital money for everyday useStablecoins are Ethereum tokens designed to stay at a fixed value, even when the price of ETH changes.Get stablecoinsHow they workWhy stablecoins?Stablecoins are cryptocurrencies without the volatility. They share a lot of the same powers as ETH but their value is steady, more like a traditional currency. So you have access to stable money that you can use on Ethereum. How stablecoins get their stabilityStablecoins are global, and can be sent over the internet. They're easy to receive or send once you have an .Demand for stablecoins is high, so you can earn interest for lending yours. Make sure you're aware of the risks before lending.Stablecoins are exchangeable for ETH and other Ethereum tokens. Lots of rely on stablecoins.Stablecoins are secured by . No one can forge transactions on your behalf.The infamous Bitcoin pizzaIn 2010, someone bought 2 pizzas for 10,000 bitcoin. At the time these were worth ~$41 USD. In today’s market that’s millions of dollars. There are many similar regretful transactions in Ethereum’s history. Stablecoins solve this problem, so you can enjoy your pizza and hold on to your ETH. Find a stablecoinThere are hundreds of stablecoins available. Here are some to help you get started. If you're new to Ethereum, we recommend doing some research first.Different stablecoin typesHow to get stablecoinsEditors' choicesThese are probably the best-known examples of stablecoins right now and the coins we've found useful when using dapps.DaiDai is probably the most famous decentralized stablecoin. Its value is roughly a dollar and it’s accepted widely across dapps.Swap ETH for Dai(opens in a new tab)Learn about Dai(opens in a new tab)USDCUSDC is probably the most famous fiat-backed stablecoin. Its value is roughly a dollar and it’s backed by Circle and Coinbase.Swap ETH for USDC(opens in a new tab)Learn about USDC(opens in a new tab)Top stablecoins by market capitalisationAlgorithmic stablecoins are experimental technology. You should be aware of the risks before using them.Market capitalisation is the total number of tokens that exist multiplied by the value per token. This list is dynamic and the projects listed here are not necessarily endorsed by the ethereum.org team.CurrencyMarket capitalizationCollateral type↗Tether$141,938,351,082FiatGo to Tether(opens in a new tab)USDC$56,047,668,113FiatGo to USDC(opens in a new tab)Dai$3,487,497,521CryptoGo to Dai(opens in a new tab)Frax$632,259,408AlgorithmicGo to Frax(opens in a new tab)usdx.money USDX$623,209,413CryptoGo to usdx.money USDX(opens in a new tab)PAX Gold$599,224,623Precious metalsGo to PAX Gold(opens in a new tab)TrueUSD$493,926,688FiatGo to TrueUSD(opens in a new tab)How to get stablecoinsSwapRecommendedYou can pick up most stablecoins on decentralized exchanges. So you can swap any tokens you might have for a stablecoin you want.MoreBuyA lot of exchanges and wallets let you buy stablecoins directly. Geographical restrictions will apply.MoreEarnYou can earn stablecoins by working on projects within the Ethereum ecosystem.MoreBorrowAdvancedYou can borrow some stablecoins by using crypto as collateral, which you have to pay back.MoreUse your stablecoinsCheck out Ethereum’s dapps – stablecoins are often more useful for everyday transactions.Explore dappsMore on decentralized finance (DeFi)Save with stablecoinsStablecoins often have an above-average interest rate because there’s a lot of demand for borrowing them. There are dapps that let you earn interest on your stablecoins in real time by depositing them into a lending pool. Just like in the banking world, you're supplying tokens for borrowers but you can withdraw your tokens and your interest at any time.Interest-earning dappsPut your stablecoin savings to good use and earn some interest. Like everything in crypto, the predicted Annual Percentage Yields (APY) can change day-to-day dependent on real-time supply/demand.Aave(opens in a new tab)Markets for lots of stablecoins, including Dai, USDC, TUSD, USDT, and more. Compound(opens in a new tab)Lend stablecoins and earn interest and $COMP, Compound's own token.Summer.fi(opens in a new tab)An app designed for saving Dai.How they work: types of stablecoinAlways do your own researchAlgorithmic stablecoins are experimental technology. You should be aware of the risks before using them.Fiat backedBasically an IOU (I owe you) for a traditional fiat currency (usually dollars). You use your fiat currency to purchase a stablecoin that you can later cash-in and redeem for your original currency.ProsSafe against crypto volatility.Changes in price are minimal.ConsCentralized – someone must issue the tokens.Requires auditing to ensure company has sufficient reserves.Example projectsUSDC(opens in a new tab)TrueUSD(opens in a new tab)Crypto backedPrecious metalsAlgorithmicLearn more about stablecoinsDashboard & EducationStablecoins.wtfStablecoins.wtf offers a dashboard with historical market data, statistics, and educational content for the most prominent stablecoins.Goto Stablecoins.wtf website(opens in a new tab)Test your Ethereum knowledgeWas this page helpful?YesNo"
