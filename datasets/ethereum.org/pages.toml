["https://ethereum.org/en/developers/docs/design-and-ux"]
title = "Design and UX in web3"
description = "Introduction to UX design and research in web3 space and Ethereum"
full_description = "Design and UX in web3K(opens in a new tab)Last edit: @konopkja(opens in a new tab), February 18, 2025See contributorsOn this pageAre you new to designing with Ethereum? This is the right place for you. The Ethereum community has written resources to introduce you to web3 design and research basics. You'll learn about core concepts that may differ from other app designs you're familiar with.Need a more basic understanding of web3 first? Check out Learn hub.Start with user researchEffective design goes beyond creating visually appealing user interfaces. It involves gaining a deep understanding of the user's needs, objectives, and driving factors. Therefore, we highly recommend that all designers adopt a design process, such as the double diamond process(opens in a new tab), to ensure that their work is deliberate and intentional.Web3 needs more UX Researchers and Designers(opens in a new tab) - An overview of current design maturityA simple guide to UX Research in web3(opens in a new tab) - Simple guide how to do researchHow to Approach UX Decisions in Web3(opens in a new tab) - A brief overview of quantitative and qualitative research and the differences between the two (video, 6 min)Being a ux researcher in web3(opens in a new tab) - A personal view on what it is like being a UX researcher in web3Research studies in web3This is a curated list of user research done in web3 that may help with design and product decisions or work as an inspiration to conduct own study.Area of focusNameCrypto onboardingThe Reown Pulse 2024: Crypto Consumer Sentiment & Usage(opens in a new tab)Crypto onboardingCRADL: UX in Cryptocurrency(opens in a new tab)Crypto onboardingCRADL: Onboarding to Cryptocurrency(opens in a new tab)Crypto onboardingBitcoin UX report(opens in a new tab)Crypto onboardingConSensys: The State of Web3 perception around the world 2023(opens in a new tab)Crypto onboardingNEAR: Accelerating the journey towards adoption(opens in a new tab)StakingOp