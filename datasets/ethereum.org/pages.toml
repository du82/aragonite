["https://ethereum.org/en/eth"]
title = "What is ether (ETH)?"
description = "What you need to know to understand ETH and its place in Ethereum."
full_description = "What is ether (ETH)?Currency for our digital futureEther coin (ETH) is digital, global money.It's the currency of Ethereum apps.Current ETH price (USD)Loading...(Last 24 hours)Get ETHETH is a cryptocurrency. It is scarce digital money that you can use on the internet – similar to Bitcoin. If you’re new to crypto, here's how ETH is different from traditional money. It's really yoursETH lets you be your own bank. You can control your own funds with your as proof of ownership – no third parties necessary.Secured by cryptographyInternet money may be new but it's secured by proven . This protects your wallet, your ETH, and your transactions.Peer-to-peer paymentsYou can send your ETH without any intermediary service like a bank. It's like handing cash over in-person, but you can do it securely with anyone, anywhere, anytime.No centralized control ETH is decentralized and global. There's no company or bank that can decide to print more ETH, or change the terms of use.Open to anyoneYou only need an internet connection and a wallet to accept ETH. You don't need access to a bank account to accept payments. Available in flexible amountsETH is divisible up to 18 decimal places so you don't have to buy 1 whole ETH. You can buy fractions at a time – as little as 0.000000000000000001 ETH if you want.Want to buy some Ethereum? It's common to mix up Ethereum and ETH. Ethereum is the and ETH is the primary asset of Ethereum. ETH is what you're probably looking to buy. More on Ethereum.What's unique about ETH?There are many cryptocurrencies and lots of other tokens on Ethereum, but there are some things that only ETH can do.ETH fuels and secures EthereumETH is the lifeblood of Ethereum. When you send ETH or use an Ethereum application, you'll pay a fee in ETH to use the Ethereum network. This fee is an incentive for a block producer to process and verify what you're trying to do.Validators are like the record-keepers of Ethereum—they check and prove that no one is cheating. They are randomly selected to propose a block of transactions. Validators who do this work are also rewarded with small amounts of newly-issued ETH.The work validators do, and the capital they , keeps Ethereum secure and free of centralized control. ETH powers Ethereum.When you stake your ETH, you help secure Ethereum and earn rewards. In this system, the threat of losing ETH deters attackers. More on stakingWhat is Ethereum?If you'd like to learn more about Ethereum, the technology behind ETH, check out our introduction.ETH underpins the Ethereum financial systemNot satisfied with payments, the Ethereum community is building a whole financial system that's and accessible to everyone.You can use ETH as collateral to generate entirely different cryptocurrency tokens on Ethereum. Plus you can borrow, lend and earn interest on ETH and other ETH-backed tokens.More on DeFiDeFi is the decentralized financial system built on Ethereum. This overview explains what you can do.Wrapped ether (WETH) is used to extend the functionality of ETH to work with other tokens and applications. Learn more about WETH.Uses for ETH grow every dayBecause Ethereum is programmable, developers can shape ETH in countless ways.Back in 2015, all you could do was send ETH from one Ethereum account to another. Here are just some of things you can do today. Stream ETH(opens in a new tab) – pay someone or receive funds in real time.Swap tokens – you can trade ETH with other tokens including Bitcoin.Earn interest(opens in a new tab) – on ETH and other Ethereum-based tokens.Get stablecoins – access the world of cryptocurrencies with a steady, less-volatile value.Where to get ETHYou can get ETH from an exchange or a wallet but different countries have different policies. Check to see the services that will let you buy ETH.Get ETHWhy does ETH have value?ETH's valuable in different ways to different people.For users of Ethereum, ETH is valuable because it lets you pay transaction fees.Others see it as a digital store of value because the creation of new ETH slows down over time.More recently, ETH has become valuable to users of financial apps on Ethereum. That's because you can use ETH as collateral for crypto loans, or as a payment system.Of course many also see it as an investment, similar to Bitcoin or other cryptocurrencies.Why ether is valuable(opens in a new tab)Anthony SassanoJanuary 2019↗ETH isn't the only crypto on EthereumAnyone can create new kinds of assets and trade them on Ethereum. These are known as 'tokens'. People have tokenised traditional currencies, their real estate, their art, and even themselves! Ethereum is home to thousands of tokens – some more useful and valuable than others. Developers are constantly building new tokens that unlock new possibilities and open new markets.More on tokens and their usesStablecoinsMore on the least volatile of Ethereum tokens.Decentralized finance (DeFi)The financial system for Ethereum tokens.Non-fungible tokens (NFTs)Tokens that represent ownership of items on Ethereum.Decentralized autonomous organisations (DAOs)Internet communities often governed by token holders.Popular types of tokenStablecoinsTokens that mirror the value of traditional currency like dollars. This solves the volatility problem with many cryptocurrencies.Governance tokensTokens that represent voting power in decentralized organizations.Sh*t coinsBecause making new tokens is easy, anyone can do it - even people with bad or misguided intentions. Always do your research before using them!Collectible tokensTokens that represent a collectible game item, piece of digital art, or other unique assets. Commonly known as non-fungible tokens (NFTs).Test your Ethereum knowledgeWas this page helpful?YesNo"
year_published = 2025
