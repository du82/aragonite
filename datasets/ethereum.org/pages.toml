full_description = "Frameworks and pre-made stacksWe recommend picking a framework, particularly if you're just getting started. Building a full-fledged dapp requires different pieces of technology. Frameworks include many of the needed features or provide easy plugin systems to pick the tools you desire.These frameworks come with a lot of out-of-the-box functionality, like:Features to spin up a local blockchain instance.Utilities to compile and test your smart contracts.Client development add-ons to build your user-facing application within the same project/repository.Configuration to connect to Ethereum networks and deploy contracts, whether to a locally running instance, or one of Ethereum's public networks.Decentralized app distribution - integrations with storage options like IPFS.972(opens in a new tab)WaffleThe most advanced testing lib for smart contracts. Use alone or with Scaffold-eth or Hardhat.TYPESCRIPTSOLIDITYOpen Waffle(opens in a new tab)305(opens in a new tab)Kurtosis Ethereum PackageA container-based toolkit for easily configuring and spinning up a multi-client Ethereum testnet for rapid local dApp development, prototyping, and testing.STARLARKPYTHONOpen Kurtosis Ethereum Package(opens in a new tab)7,537(opens in a new tab)HardhatHardhat is an Ethereum development environment for professionals.TYPESCRIPTSOLIDITYOpen Hardhat(opens in a new tab)2,682(opens in a new tab)BrownieA Python-based development and testing framework for smart contracts targeting the Ethereum Virtual Machine.PYTHONSOLIDITYOpen Brownie(opens in a new tab)259(opens in a new tab)EpirusA platform for developing, deploying and monitoring blockchain applications on the Java Virtual Machine.HTMLSHELLOpen Epirus(opens in a new tab)2,766(opens in a new tab)Create Eth AppCreate Ethereum-powered apps with one command. Comes with a wide offerring of UI frameworks and DeFi templates to choose from.JAVASCRIPTTYPESCRIPTOpen Create Eth App(opens in a new tab)1,543(opens in a new tab)Scaffold-ETH-2Ethers + Hardhat + React: everything you need to get started building decentralized applications powered by smart contracts.TYPESCRIPTJAVASCRIPTOpen Scaffold-ETH-2(opens in a new tab)1,975(opens in a new tab)Solidity templateA GitHub template for a pre-built setup for your Solidity smart contracts. Includes a Hardhat local network, Waffle for tests, Ethers for wallet implementation, and more.TYPESCRIPTSOLIDITYOpen Solidity template(opens in a new tab)8,644(opens in a new tab)FoundryA blazing fast, portable and modular toolkit for Ethereum application development written in Rust.RUSTSHELLOpen Foundry(opens in a new tab)"
