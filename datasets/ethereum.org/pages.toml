-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}CityDAO.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);} – CityDAO used Wyoming's DAO law to buy 40 acres of land near Yellowstone National Park.DAO membershipThere are different models for DAO membership. Membership can determine how voting works and other key parts of the DAO.Token-based membershipUsually fully , depending on the token used. Mostly these governance tokens can be traded permissionlessly on a . Others must be earned through providing liquidity or some other ‘proof-of-work’. Either way, simply holding the token grants access to voting.Typically used to govern broad decentralized protocols and/or tokens themselves.A famous example.css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}MakerDAO.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);} – MakerDAO's token MKR is widely available on decentralized exchanges and anyone can buy into having voting power on Maker protocol's future.Share-based membershipShare-based DAOs are more permissioned, but still quite open. Any prospective members can submit a proposal to join the DAO, usually offering a tribute of some value in the form of tokens or work. Shares represent direct voting power and ownership. Members can exit at any time with their proportionate share of the treasury.Typically used for more closer-knit, human-centric organizations like charities, worker collectives, and investment clubs. Can also govern protocols and tokens as well.A famous example.css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}MolochDAO.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);} – MolochDAO is focused on funding Ethereum projects. They require a proposal for membership so the group can assess whether you have the necessary expertise and capital to make informed judgments about potential grantees. You can't just buy access to the DAO on the open market.Reputation-based membershipReputation represents proof of participation and grants voting power in the DAO. Unlike token or share-based membership, reputation-based DAOs don't transfer ownership to contributors. Reputation cannot be bought, transferred or delegated; DAO members must earn reputation through participation. On-chain voting is permissionless and prospective members can freely submit proposals to join the DAO and request to receive reputation and tokens as a reward in exchange for their contributions.Typically used for decentralized development and governance of protocols and , but also well suited to a diverse set of organizations like charities, worker collectives, investment clubs, etc.A famous example.css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:und