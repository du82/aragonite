["https://ethereum.org/en/community/code-of-conduct"]
title = "Code of conduct"
description = "The basic standards that we strive for across ethereum.org spaces."
full_description = "On this pageCode of conductMissionTo develop and maintain the most comprehensive and accessible knowledge hub for Ethereum.ValuesThe ethereum.org community strives to be:educational, intended to help everyone to understand Ethereuminclusiveaccessiblecommunity-drivenfocused on Ethereum’s underlying technology and use-casesfocused on Ethereum concepts and design principlesWhat we are notThe Ethereum Foundation websiteA platform for promoting investments or profiteering of any kindA platform for elevating or endorsing individual projects or organizationsA DEX, CEX or any other form of financial platformA platform that gives financial or legal advice of any kindCode of conductPledgeOpen participation is core to the ethereum.org ethos. We are a website and community maintained by thousands of contributors, and this is only possible if we maintain a welcoming, participatory environment. To this end, contributors to this site pledge to maintain a harassment-free environment for all participants across all ethereum.org platforms and community spaces. The ethereum.org community welcomes and values anyone who wants to participate in a constructive and friendly way, regardless of age, disability, ethnicity, sex characteristics, gender identity, level of experience, area of expertise, education, socio-economic status, nationality, personal appearance, race, religion or any other dimension of diversity.ScopeThis Code of Conduct applies to all ethereum.org spaces (such as GitHub, Discord, Figma, Crowdin, Twitter and other online platforms), and it also applies when the community is represented in real-world public spaces such as at meetups, conferences and events.Our standardsExamples of behavior that contributes to creating a positive environment include:Using welcoming and inclusive languageBeing respectful of differing viewpoints and experiencesGracefully accepting and/or empathetically providing constructive criticismActing calmly and professionally when resolving conflicts or disagreementsShowing empathy and tolerance towards other community membersEncouraging and amplifying new voices in the communityExamples of unacceptable behavior by participants include:Physical violence, threatening physical violence or encouraging of physical violence of any kindUsing sexualized language or imagery or imposing unwelcome sexual attentionImpersonating another individual or otherwise dishonestly claiming affiliation with some individual or organizationTrolling, insulting/derogatory comments, and personal or political attacksHarassing other community members in public or private channelsPublishing others’ private information, such as a physical or electronic address, without explicit permissionSocial engineering, scamming or otherwise manipulating other community membersPromoting investments, tokens, projects or anything else for personal monetary or non-monetary gainSpamming servers with off-topic contentDisregarding requests or warnings from community moderatorsEngaging in other conduct which could reasonably be considered inappropriate in a professional settingReportingViolations of the code of conduct will normally be visible to the community as we try to do everything in open, public channels, allowing community members to self-police.However, if something happens that you feel needs attention, you can raise it with someone who has a moderation role (e.g. discord guide) so that they can help investigate and execute the appropriate response.When reporting, please include as much detail as possible, including specific examples and timestamps. This will help to ensure a fair outcome.EnforcementDepending on the severity, people who violate the code of conduct can receive warnings, temporary bans or permanent bans from ethereum.org communities.Was this article helpful?YesNo"
year_published = 2025
clearnet = "https://ethereum.org/en/community/code-of-conduct"
