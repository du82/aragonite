["https://ethereum.org/en/layer-2"]
title = "Intro to Ethereum Layer 2: benefits and uses"
description = "Learn about Ethereum layer 2 networks"
full_description = "Layer 2Ethereum networksUse Ethereum for a fraction of the cost.Explore networksLearn morePowered by EthereumEthereum is no longer just a single network. With hundreds of blockchains now built on top of it, Ethereum has become more cost-effective, faster, and accessible for everyday use.Embrace the future by joining one of the many networks powered by Ethereum!$0.20Average transaction cost on the Ethereum blockchain$0.004Average transaction cost on Ethereum backed networksThe network of networksEthereum's strength and security provides a platform for other networks to build upon. With a single account, everything is compatible and connects seamlessly.$0.01 feesYou can trade, send money globally, or use applications without worrying about high costs.Near instant transactionsWhether you are making a quick payment or engaging in decentralized finance (DeFi), all transactions take only a few seconds. Backed by EthereumEthereum’s time-proven and decentralized blockchain functions as the settlement layer for other newer networks.Ready to start?Have a look at all the different networks that are available to you.Explore networksZKSync EraZKsync Era is a general-purpose ZK Rollup with full EVM compatibility.Go(opens in a new tab)BaseBase is an Optimistic Rollup built with the OP Stack. It offers a low-cost and builder-friendly way for anyone, anywhere, to build onchain.Go(opens in a new tab)ScrollScroll is ZK Rollup that extends Ethereum’s capabilities through ZK tech and EVM compatibility.Go(opens in a new tab)Powered by EthereumWhy do we need multiple networks on Ethereum?Why are there all these networks and not just one Ethereum network?Learn moreFrequently asked questionsHow do I know that a network is part of Ethereum?MoreAre all these networks safe?MoreWhy can't Ethereum scale its own chain instead of relying on these networks?MoreWhy is there no 'official' Ethereum networks?MoreExplore different networksLearn how networks differ from each other and how far have gotten in their development.Explore networksInterested in more details?Curious about the technology and reasons for this scaling approach? Learn more about the thinking and different technological approaches.Learn more"
