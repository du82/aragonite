based on the features that suit you.Find walletThe magic behind decentralized financeWhat is it about Ethereum that allows decentralized finance applications to thrive?Open accessFinancial services running on Ethereum have no sign up requirements. If you have funds and an internet connection, you’re good to go.A new token economyThere’s a whole world of tokens that you can interact with across these financial products. People are building new tokens on top of Ethereum all the time.StablecoinsTeams have built – a less volatile cryptocurrency. These allow you to experiment and use crypto without the risk and uncertainty.Interconnected financial servicesFinancial products in the Ethereum space are all modular and compatible with one another. New configurations of these modules are hitting the market all the time, increasing what you can do with your crypto.More on decentralized financeThe magic behind dappsDapps might feel like regular apps. But behind the scenes they have some special qualities because they inherit all of Ethereum’s superpowers. Here's what makes dapps different from apps.What makes Ethereum great?No ownersOnce deployed to Ethereum, dapp code can’t be taken down. And anyone can use the dapp’s features. Even if the team behind the dapp disbanded you could still use it. Once on Ethereum, it stays there.Free from censorshipBuilt-in paymentsPlug and playOne anonymous loginBacked by cryptographyNo down timeHow dapps workDapps have their backend code (smart contracts) running on a decentralized network and not a centralized server. They use the Ethereum for data storage and smart contracts for their app logic.A smart contract is like a set of rules that live on-chain for all to see and run exactly according to those rules. Imagine a vending machine: if you supply it with enough funds and the right selection, you'll get the item you want. And like vending machines, smart contracts can hold funds much like your Ethereum account. This allows code to mediate agreements and transactions.Once dapps are deployed on the Ethereum network you can't change them. Dapps can be decentralized because they are controlled by the logic written into the contract, not an individual or a company.Intro to dappsSmart contractsLearn to build a dappOur community developer portal has docs, tools, and frameworks to help you start building a dapp.Start buildingWas this page helpful?YesNo"
