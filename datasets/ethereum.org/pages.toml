title = "How to buy Ethereum (ETH)"
description = "How to buy ETH based on where you live and advice on how to look after it."
full_description = '''Where to get ETHYou can earn ETH, receive it from your peers, or buy it from exchanges and apps.Current ETH price (USD)Loading...(Last 24 hours)Search by countryCentralized exchangesExchanges are businesses that let you buy crypto using traditional currencies. They have custody over any ETH you buy until you send it to a wallet you control.See a list of exchangesEarn ETHYou can earn ETH by working for DAOs or companies that pay in crypto, winning bounties, finding software bugs and more.Learn about DAOsReceive ETH from your peersOnce you have an Ethereum account, all you need to do is share your address to start sending and receiving ETH (and other tokens) peer-to-peer.More on walletsDecentralized exchanges (DEXs)If you want more control, buy ETH using . With a DEX you can trade digital assets without ever giving control of your funds to a centralized company.Try a DEXWalletsSome wallets let you buy crypto with a debit/credit card, bank transfer or even Apple Pay. Geographical restrictions apply.More on walletsStaking rewardsIf you already have some ETH, you can earn more by running a validator node. You get paid for doing this verification work in ETH.Learn more about stakingAll products listed on this page are not official endorsements, and are provided for informational purposes only. If you want to add a product or provide feedback on the policy raise an issue in GitHub. Raise issue(opens in a new tab)New to ETH? Here's an overview to get you started. What's ETH?What country do you live in?Exchanges have restrictions on where they can sell crypto. This is an indicative list of services thought to operate in each country. Inclusion here is not an endorsement - you should do your own research!.css-7pg0cj-a11yText{z-index:9999;border:0;clip:rect(1px, 1px, 1px, 1px);height:1px;width:1px;position:absolute;overflow:hidden;padding:0;white-space:nowrap;}.css-7pg0cj-a11yText{z-index:9999;border:0;clip:rect(1px, 1px, 1px, 1px);height:1px;width:1px;position:absolute;overflow:hidden;padding:0;white-space:nowrap;}.css-14oxtc6{-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;display:grid;-webkit-flex:1;-ms-flex:1;flex:1;-webkit-box-flex-wrap:wrap;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;-webkit-overflow-scrolling:touch;position:relative;overflow:hidden;box-sizing:border-box;}.css-1vlsb4t-placeholder{grid-area:1/1/2/3;box-sizing:border-box;}Type where you live....css-n9qnu9{visibility:visible;-webkit-flex:1 1 auto;-ms-flex:1 1 auto;flex:1 1 auto;display:inline-grid;grid-area:1/1/2/3;grid-template-columns:0 min-content;box-sizing:border-box;}.css-n9qnu9:after{content:attr(data-value) " ";visibility:hidden;white-space:pre;grid-area:1/2;font:inherit;min-width:2px;border:0;margin:0;outline:0;padding:0;}.css-1wy0on6{-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-align-self:stretch;-ms-flex-item-align:stretch;align-self:stretch;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;box-sizing:border-box;}Enter your country of residence to see a list of exchanges you may be able to useDecentralized exchanges (DEXs)What are DEXs?Decentralized exchanges are open marketplaces for ETH and other tokens. They connect buyers and sellers directly.Instead of using a trusted third party to safeguard funds in the transaction, they use code. The seller's ETH will only be transferred when payment is guaranteed. This type of code is known as a smart contract. More on smart contractsThis means there are fewer geographical restrictions than with centralized alternatives. If someone is selling what you want and accepting a payment method you can provide, you’re good to go.You will need a wallet to use a DEX.Get a walletNote: many dexes use wrapped ether (WETH) to function. Learn more about wrapped ether.Buy with other cryptoSwap your tokens for other people's ETH. And vice versa.Uniswap(opens in a new tab)↗Bancor(opens in a new tab)↗Kyber(opens in a new tab)↗These DEXs aren't for beginners as you'll need some ETH to use them. These are just examples, not endorsed products. Do your own research!Keeping your ETH safeCommunity posts on securityProtecting yourself and your funds(opens in a new tab)MyCrypto↗The keys to keeping your crypto safe(opens in a new tab)Coinbase↗Ethereum isn't controlled by any single organization - it is decentralized.This means you need to take the security of your funds seriously. With ETH, you’re not trusting a bank or company to look after your assets, you’re taking responsibility for yourself.Keep your ETH in your own walletOne of the main features of Ethereum is that you keep control of your own assets by managing your own account. This means you don't have to trust any third party with your assets, and you are protected from any custodian acting dishonestly, going bankrupt or getting hacked. However, it also means you take responsibility for your own security.Check out walletsYour ETH addressWhen you download a wallet it will create a public ETH address for you. Here's what one looks like:0x0125e2478d69eXaMpLe81766fef5c120d30fb53fExample: Do not copyThink of this like your email address, but instead of mail it can receive ETH. If you want to transfer ETH from an exchange to your wallet, use your address as the destination. Be sure to always double check before you send!Follow wallet instructionsIf you lose access to your account, you’ll lose access to your funds. Your wallet should give you instructions on protecting against this. Be sure to follow them carefully – in most cases, no one can help you if you lose access to your account.Use your ETHNow that you own some ETH, check out some Ethereum applications (dapps). There are dapps for finance, social media, gaming and lots of other categories.Check out dappsWas this page helpful?YesNo'''
