g:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);}How do NFTs work?NFTs, like any digital items on the Ethereum blockchain, are created through a special Ethereum based computer program called a "smart contract". These contracts follow certain rules, like the or standards, which determine what the contract can do.The NFT smart contract can do a few key things:Create NFTs: It can make new NFTs.Assign Ownership: It keeps track of who owns which NFTs by linking them to specific Ethereum addresses.Give Each NFT an ID: Each NFT has a number that makes it unique. Additionally, there's usually some information (metadata) attached to it, describing what the NFT represents.When someone "creates" or "mints" an NFT, they're basically telling the smart contract to give them ownership of a particular NFT. This information is securely and publicly stored in the blockchain.Furthermore, the creator of the contract can add extra rules. They might limit how many of a certain NFT can be made or decide that they should get a small royalty fee whenever the NFT changes hands.NFT securityEthereum's security comes from . The system is designed to economically disincentivize malicious actions, making Ethereum tamper-proof. This is what makes NFTs possible. Once the containing your NFT transaction becomes it would cost an attacker millions of ETH to change it. Anyone running Ethereum software would immediately be able to detect dishonest tampering with an NFT, and the bad actor would be economically penalized and ejected.Security issues relating to NFTs are most often related to phishing scams, smart contract vulnerabilities or user errors (such as inadvertently exposing private keys), making good wallet security critical for NFT owners.More on securityFurther reading.css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}A beginner's guide to NFTs.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);} – Linda Xie, January 2020.css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);