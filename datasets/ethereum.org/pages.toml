["https://ethereum.org/en/cookie-policy"]
title = "Cookie Policy"
description = "Ethereum is a global, decentralized platform for money and new kinds of applications. On Ethereum, you can write code that controls money, and build applications accessible anywhere in the world."
full_description = "On this pageCookie PolicyOur Websites may use cookies to distinguish you from other users of our Websites. This may help us to provide you with a good experience when you browse our Websites and may also allow us to improve our Websites. By continuing to browse the Websites, you are agreeing to our use of cookies as well as the terms of this policy (the “Cookie Policy”). A cookie is a small file of letters and numbers that we may store on your browser or the hard drive of your computer if you agree. Cookies contain information that is transferred to your computer's hard drive. We may use the following cookies:Strictly necessary cookies. These are cookies that are required for the operation of our websites. They include, for example, cookies that enable you to log into secure areas of our websites, use a shopping cart or make use of e-commerce payment processing services.Analytical/performance cookies. They allow us to recognise and count the number of visitors and to see how visitors move around our websites when they are using them. This may help us to improve the way our websites work, for example, by ensuring that users are finding what they are looking for easily.Functionality cookies. These cookies are used to recognise you when you return to our websites. They may enable us to personalise our content for you, greet you by name, or remember your preferences (for example, your choice of language or region).Targeting cookies. These cookies record your visit to our websites, the pages you have visited and the links you have followed.You can opt out of being tracked by Matomo Analytics and prevent the website from analysing the actions you take using the website. This will prevent us from learning from your actions and creating a better website experience for you and other users.Loading preferences...You can find more information about the individual cookies we may use and the purposes for which we may use them in the table below:CookieNamePurposeMatomo_pk_idUsed to distinguish users. Enables us to identify which pages are popular, estimate our audience size and usage pattern, and better understand how the website is used.Matomo_pk_sesUsed to store temporary session data. This a short-lived cookie, only lasting for a few minutes.You can block cookies by activating the setting on your browser that allows you to refuse the setting of all or some cookies. However, if you use your browser settings to block all cookies (including essential cookies), you may not be able to access all or parts of our sites.Except for essential cookies, all cookies will expire after two years.Was this article helpful?YesNo"
