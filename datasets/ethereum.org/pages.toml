["https://ethereum.org/en/gas"]
title = "Ethereum fees: what is gas and how to pay less?"
description = "Learn about gas on Ethereum: how they work and how to pay less in gas fees"
full_description = '''Gas feesNetwork feesNetwork fees on Ethereum are called gas.Gas is the fuel that powers Ethereum.What is gas?SummaryEvery transaction on Ethereum requires a small form of payment to processThese fees are known as ‘gas’ feeGas fees are not set, they change based on network congestionWhat are gas fees?Think of Ethereum as a large computer network where people can do tasks like sending messages or running programs. Just like in the real world, these tasks require energy to get done.In Ethereum, each computational action has a set "gas" price. Your gas fees are the total cost of the actions in your transaction. When you send a transaction or run a , you pay in gas fees to process it.How do I pay less gas?While higher fees on Ethereum are sometimes inevitable, there are strategies you can use to reduce the cost:Time your transactionsJust like travelling off-peak is less crowded and more affordable, Ethereum is generally cheaper to use when North America is asleep.Wait for gas to go downGas prices go up and down every twelve seconds based on how congested Ethereum is. When gas prices are high, waiting just a few minutes before making a transaction could see a significant drop in what you pay.Use layer 2Layer-2 chains are built atop Ethereum, offering lower fees and handling more transactions. They're a good choice to save on fees for transactions that don't need to happen on the main Ethereum network.Try layer 2What causes high gas fees?Whenever the amount of computation (gas) on Ethereum exceeds a certain threshold, gas fees begin to rise. The more the gas exceeds this threshold, the quicker gas fees increase.Higher fees could be caused by things like popular or NFTs, periodically increased trading on , or an overwhelming number of user activity at peak times.Developers on Ethereum should take care to optimise their smart contracts usage before deploying. If lots of people are using a poorly written smart contract, it will consume more gas and could inadvertently cause network congestion.Want to dive deeper? Check out the developer docs.Attack of the CryptokittiesIn November 2017, the popular CryptoKitties project was launched. Its rapid spike in popularity caused significant network congestion and extremely high gas fees. The challenges posed by CryptoKitties accelerated the urgency of finding solutions for scaling Ethereum.Why do we need gas?Gas is a critical element in keeping Ethereum secure and processing transactions. Gas helps in many ways:Gas keeps Ethereum by preventing malicious actors from overwhelming the network with fraudulent activities.Because computation costs gas, spamming Ethereum with expensive transactions, either accidentally and maliciously, is financially disincentivized.A hard-limit on the amount of computation that can be done at any one time prevents Ethereum from being overwhelmed, helping to ensure the network is always accessible.How is gas calculated?AdvancedThe total gas fee you pay is made up of a few parts:Base fee: a fee set by the network that has to be paid for a transactionPriority fee: an optional tip to incentivise node operators to include your transactionUnits of gas used*: remember we said gas represented computation? More complex actions, like interacting with a smart contract, use more gas than simple ones, such as sending a transaction.* See Figure 1 to see how much gas different types of transactions useThe formula for calculating a gas fee is units of gas used * (base fee + priority fee). Most wallets will calculate gas usage and display it in a more straight-forward way.Figure 1: Gas used by transaction typeTransaction typeUnits of gas usedSending ETH21,000Sending ERC-20 tokens65,000Transferring an NFT84,904Swapping on Uniswap184,523Frequently asked questionsWho gets paid the gas fee in my transaction?MoreDo I need to pay gas in ETH?MoreWhat is gwei?MoreUse layer 2common.Layer-2 chains are built atop Ethereum, offering lower fees and handling more transactions. They're a good choice to save on fees for transactions that don't need to happen on the main Ethereum network.Use layer 2Try some dappscommon.Dapps are applications built on Ethereum. Dapps are disrupting current business models and inventing new ones.Explore dappsWas this page helpful?YesNo'''
year_published = 2025
clearnet = "https://ethereum.org/en/gas"
