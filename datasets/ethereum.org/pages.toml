title = "Ethereum Bug Bounty Program"
description = "An overview of the Ethereum bug bounty program: how to get involved and reward information."
full_description = "Home/Bug bountyOpen for submissionsBug Bounty Program Earn up to 250,000 USD and a place on the leaderboard by finding protocol, client and language compiler bugs affecting the Ethereum network.Submit a bug(opens in a new tab)Read rules1G GA(opens in a new tab)In place number 1 with 52100 pointsGuido Vranken (See Github Profile)52100 points2H GA(opens in a new tab)In place number 2 with 45000 pointsMartin Holst Swende (See Github Profile)45000 points3P GA(opens in a new tab)In place number 3 with 42400 pointsprotolambda (See Github Profile)42400 points4S GA(opens in a new tab)In place number 4 with 35000 pointsSam Sun (See Github Profile)35000 points5In place number 5 with 31000 pointsnrv (@nervoir) 31000 pointsSee full leaderboardsClients featured in the bountiesIn ScopeOur bug bounty program spans end-to-end: from soundness of protocols (such as the blockchain consensus model, the wire and p2p protocols, proof of stake, etc.) and protocol/implementation compliance to network security and consensus integrity. Classical client security as well as security of cryptographic primitives are also part of the program. When in doubt, send an email to bounty@ethereum.org and ask us. You may also submit a disclosure/vulnerability directly to .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}bounty@ethereum.org.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);}, in which case we ask that you encrypt the message using our .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}PGP Key.css-idkz9h{border:0;clip:rect(0, 0, 0, 0);height:1px;width:1px;margin:-1px;padding:0px;overflow:hidden;white-space:nowrap;position:absolute;}(opens in a new tab).css-1bbj57d{width:var(--eth-sizes-6);height:var(--eth-sizes-6);display:inline-block;line-height:1em;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;color:currentColor;padding:var(--eth-space-1);vertical-align:middle;-webkit-margin-end:calc(var(--eth-space-1) * -1);margin-inline-end:calc(var(--eth-space-1) * -1);}Specification bugsThe Ethereum Specifications detail the design rationale for the Execution Layer and Consensus Layer.Consensus Layer Specifications(opens in a new tab)Execution Layer Specifications(opens in a new tab)It might be helpful to check out the following annotations:Ben Edgington's annotated spec(opens in a new tab)Vitalik Buterin's annotated spec(opens in a new tab)Types of bugsSafety/finality-breaking bugsDenial of service (DOS) vectorsInconsistencies in assumptions, like situations where honest validators can be slashedCalculation or parameter inconsistenciesSpecification documentsBeacon Chain(opens in a new tab)↗Fork choice(opens in a new tab)↗Solidity deposit contract(opens in a new tab)↗Peer-to-peer networking(opens in a new tab)↗Client bugsClients run the Ethereum Network, and they need to follow the logic set out in the specification and be secure against potential attacks. The bugs we want to find are related to the implementation of the protocol.Currently execution layer clients (Besu, Erigon, Geth, Nethermind and Reth) and consensus layer clients (Lighthouse, Lodestar, Nimbus, Teku and Prysm) are included in the Bug Bounty Program. More clients may be added as they complete audits and become production ready.Types of bugsSpec non-compliance issuesUnexpected crashes, RCE or denial of service (DOS) vulnerabilitiesAny issues causing irreparable consensus splits from the rest of the networkHelpful linksBesu(opens in a new tab)↗Erigon(opens in a new tab)↗Geth(opens in a new tab)↗Lighthouse(opens in a new tab)↗Lodestar(opens in a new tab)↗Nimbus(opens in a new tab)↗Nethermind(opens in a new tab)↗Prysm(opens in a new tab)↗Reth(opens in a new tab)↗Teku(opens in a new tab)↗Grandine(opens in a new tab)↗Language compiler bugsThe Solidity and Vyper compilers are in scope of the bug bounty program. Please include all details necessary to reproduce the vulnerability such as: Input program that triggers the bug, Compiler version affected, Target EVM version, Framework/IDE if applicable, EVM execution environment/client if applicable and Operating system, Please include steps to reproduce the bug you have found in as much detail as possible.Solidity and Vyper does not hold security guarantees regarding compilation of untrusted input – and we do not issue rewards for crashes of the compiler on maliciously generated data.Helpful linksSolidity(opens in a new tab)↗Vyper(opens in a new tab)↗Deposit Contract bugsThe specifications and source code of the Beacon Chain Deposit Contract is part of the bug bounty program.Helpful linksDeposit Contract Specifications(opens in a new tab)Deposit Contract Source Code(opens in a new tab)Dependency bugsCertain dependencies are crucial for the Ethereum Network to function, and some of these have been added to the bug bounty program. Currently, the list of dependencies included in the bug bounty program are C-KZG-4844 and Go-KZG-4844.Helpful linksC-KZG-4844(opens in a new tab)Go-KZG-4844(opens in a new tab)Out of scopeOnly the targets listed under in-scope are part of the Bug Bounty Program. This means that for example our infrastructure; such as webpages, dns, email etc, are not part of the bounty-scope. ERC20 contract bugs are typically not included in the bounty scope. However, we can help reach out to affected parties, such as authors or exchanges in such cases. ENS is maintained by the ENS foundation, and is not part of the bounty scope. Vulnerabilities requiring the user to have publicly exposed an API, such as JSON-RPC or the Beacon API, is out of scope of the bug bounty program.Submit a bugFor each valid bug you find you’ll earn rewards. The quantity of rewards awarded will vary depending on Severity. The severity is calculated according to the OWASP risk rating model based on Impact on the Ethereum Network and Likelihood. View OWASP method(opens in a new tab)The EF will also provide rewards based on:Quality of description: Higher rewards are paid for clear, well-written submissions.Quality of reproducibility: A Proof of Concept (POC) must be included to be eligible for rewards. Please include test code, scripts and detailed instructions. The easier it is for us to reproduce and verify the vulnerability, the higher the reward.Quality of fix, if included: Higher rewards are paid for submissions with clear description of how to fix the issue.Up to 2,000 USDLowUp to 2,000 USDUp to 1,000 pointsSeverityLow impact, medium likelihoodMedium impact, low likelihoodExampleAttacker can sometimes put a node in a state that causes it to drop one out of every one hundred attestations made by a validatorSubmit low risk bug(opens in a new tab)Up to 10,000 USDMediumUp to 10,000 USDUp to 5,000 pointsSeverityHigh impact, low likelihoodMedium impact, medium likelihoodLow impact, high likelihoodExampleAttacker can successfully conduct eclipse attacks on nodes with peer-ids with 4 leading zero bytesSubmit medium risk bug(opens in a new tab)Up to 50,000 USDHighUp to 50,000 USDUp to 10,000 pointsSeverityHigh impact, medium likelihoodMedium impact, high likelihoodExampleAttacker can successfully partition large parts of the network, and it is trivial for an attacker to trigger the vulnerabilitySubmit high risk bug(opens in a new tab)Up to 250,000 USDCriticalUp to 250,000 USDUp to 25,000 pointsSeverityHigh impact, high likelihoodExampleAttacker can successfully conduct remote code execution in a majority client, and it is trivial for an attacker to trigger the vulnerabilitySubmit critical risk bug(opens in a new tab)Bug hunting rulesThe bug bounty program is an experimental and discretionary rewards program for our active Ethereum community to encourage and reward those who are helping to improve the platform. It is not a competition. You should know that we can cancel the program at any time, and awards are at the sole discretion of Ethereum Foundation bug bounty panel. In addition, we are not able to issue awards to individuals who are on sanctions lists or who are in countries on sanctions lists (e.g. North Korea, Iran, etc). Local laws require us to ask for proof of your identity. You are responsible for all taxes. All awards are subject to applicable law. Finally, your testing must not violate any law or compromise any data that is not yours and must take place on local running testnets.Issues without a POC or that have already been submitted by another user or are already known to spec and client maintainers are not eligible for bounty rewards.Public disclosure of a vulnerability or reporting it to other parties without prior agreement makes it ineligible for a bounty.Employees and contractors of the Ethereum Foundation or client teams in scope of the bounty program may participate in the program only in the accrual of points and will not receive monetary rewards.Ethereum bounty program considers a number of variables in determining rewards. Determinations of eligibility, score and all terms related to an award are at the sole and final discretion of the Ethereum Foundation bug bounty panel.Execution Layer Bug Bounty leaderboardFind execution layer bugs to get added to this leaderboard1H GA(opens in a new tab)In place number 1 with 42500 pointsMartin Holst Swende (See Github Profile)42500 points2S GA(opens in a new tab)In place number 2 with 35000 pointsSam Sun (See Github Profile)35000 points3G GA(opens in a new tab)In place number 3 with 34250 pointsGuido Vranken (See Github Profile)34250 points4In place number 4 with 31000 pointsnrv (@nervoir) 31000 points5C GA(opens in a new tab)In place number 5 with 24500 pointsChainSecurity (See Github Profile)24500 points6J GA(opens in a new tab)In place number 6 with 20500 pointsJuno Im (See Github Profile)20500 points7U GA(opens in a new tab)In place number 7 with 20000 pointsYoonho Kim (team Hithereum) (See Github Profile)20000 points8J GA(opens in a new tab)In place number 8 with 20000 pointsJohn Youngseok Yang (Software Platform Lab) (See Github Profile)20000 points9P GA(opens in a new tab)In place number 9 with 170