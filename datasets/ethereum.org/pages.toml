["https://ethereum.org/en/eips"]
title = "Ethereum Improvement Proposals (EIPs)"
description = "The basic information you need to understand EIPs"
full_description = "On this pageIntroduction to Ethereum Improvement Proposals (EIPs)What are EIPs?Ethereum Improvement Proposals (EIPs)(opens in a new tab) are standards specifying potential new features or processes for Ethereum. EIPs contain technical specifications for the proposed changes and act as the “source of truth” for the community. Network upgrades and application standards for Ethereum are discussed and developed through the EIP process.Anyone within the Ethereum community has the ability to create an EIP. Guidelines for writing EIPs are included in EIP-1(opens in a new tab). An EIP should primarily provide a concise technical specification with a small amount of motivation. The EIP author is responsible for reaching consensus within the community and documenting alternative opinions. Given the high technical barrier for submitting a well-formed EIP, historically, most EIP authors are typically application or protocol developers.Why do EIPs matter?EIPs play a central role in how changes happen and are documented on Ethereum. They are the way for people to propose, debate, and adopt changes. There are different types of EIPs(opens in a new tab), including core EIPs for low-level protocol changes that affect consensus and require a network upgrade like EIP-1559(opens in a new tab), and ERCs for application standards like EIP-20(opens in a new tab) and EIP-721(opens in a new tab).Every network upgrade consists of a set of EIPs that need to be implemented by each Ethereum client on the network. This means that to stay in consensus with other clients on the Ethereum Mainnet, client developers need to make sure they have all implemented the required EIPs.Along with providing a technical specification for changes, EIPs are the unit around which governance happens in Ethereum: anyone is free to propose one, and then various stakeholders in the community will debate to determine if it should be adopted as a standard or included in a network upgrade. Because non-core EIPs don't have to be adopted by all applications (for example, it is possible to create a fungible token that doesn't implement EIP-20), but core EIPs must be widely adopted (because all nodes must upgrade to stay part of the same network), core EIPs require a broader consensus within the community than non-core EIPs.History of EIPsThe Ethereum Improvement Proposals (EIPs) GitHub repository(opens in a new tab) was created in October 2015. The EIP process is based on the Bitcoin Improvement Proposals (BIPs)(opens in a new tab) process, which itself is based on the Python Enhancement Proposals (PEPs)(opens in a new tab) process.EIP editors are tasked with process of reviewing EIPs for technical soundness, formatting issues, and correcting spelling, grammar, and code style. Martin Becze, Vitalik Buterin, Gavin Wood, and a few others were the original EIP editors from 2015 to late 2016.The current EIP editors areAlex Beregszaszi (@axic)Gavin John (@Pandapip1)Greg Colvin (@gcolvin)Matt Garnett (@lightclient)Sam Wilson (@SamWilsn)Emeritus EIP editors areCasey Detrio (@cdetrio)Hudson Jameson (@Souptacular)Martin Becze (@wanderer)Micah Zoltu (@MicahZoltu)Nick Johnson (@arachnid)Nick Savers (@nicksavers)Vitalik Buterin (@vbuterin)If you would like to become an EIP editor, please check EIP-5069(opens in a new tab).EIP editors decide when a proposal is ready to become an EIP, and help EIP authors move their proposals forward. Ethereum Cat Herders(opens in a new tab) help organize meetings between the EIP editors and the community (see EIPIP(opens in a new tab)).Full standardization process alongside with chart is described in EIP-1(opens in a new tab)Learn moreIf you’re interested to read more about EIPs, check out the EIPs website(opens in a new tab) and EIP-1(opens in a new tab). Here are some useful links:A list of every Ethereum Improvement Proposal(opens in a new tab)A description of all EIP types(opens in a new tab)A description of all EIP statuses(opens in a new tab)Community education projectsPEEPanEIP(opens in a new tab) — PEEPanEIP is an educational video series that discusses Ethereum Improvement Proposal (EIPs) and key features of upcoming upgrades.EIPs For Nerds(opens in a new tab) — EIPs For Nerds provides comprehensive, ELI5-style overviews of various Ethereum Improvement Proposals (EIPs), including core EIPs and application/infrastructure-layer EIPs (ERCs), to educate readers and shape consensus around proposed changes to the Ethereum protocol. EIPs.wtf(opens in a new tab) — EIPs.wtf provides extra information for Ethereum Improvement Proposals (EIPs), including their status, implementation details, related pull requests, and community feedback. EIP.Fun(opens in a new tab) — EIP.Fun provides the latest news on Ethereum Improvement Proposals (EIPs), updates on EIP meetings, and more.EIPs Insight(opens in a new tab) — EIPs Insight is a representation of state of Ethereum Improvement Proposals (EIPs) process & statistics as per information collected from different resources.ParticipateAnyone can create an EIP. Before submitting a proposal, one must read EIP-1(opens in a new tab) which outlines the EIP process and how to write an EIP, and solicit feedback on Ethereum Magicians(opens in a new tab), where proposals are first discussed with the community before a draft is submitted.ReferencesPage content provided in part from Ethereum Protocol Development Governance and Network Upgrade Coordination(opens in a new tab) by Hudson JamesonWas this article helpful?YesNo"
year_published = 2025
clearnet = "https://ethereum.org/en/eips"
