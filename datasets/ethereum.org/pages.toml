full_description = "On this pageOnline communitiesHundreds of thousands of Ethereum enthusiasts gather in these online forums to share news, talk about recent developments, debate technical issues, and imagine the future.Listing PolicyTo maintain the integrity and value of the listed communities, ethereum.org follows a strict policy for determining eligibility:Eligibility CriteriaRelevance: The community must be directly related to Ethereum and its ecosystem.Activity Level: The community should be active, with regular interactions, posts, or discussions. Dormant or inactive communities may be removed.Inclusivity: The community should foster a welcoming environment that respects diversity and encourages participation from people of all backgrounds.Non-commercial Focus: Listings are intended for community-driven spaces rather than commercial or promotional platforms.Content GuidelinesAppropriate Content: Communities must have their own moderation guidelines, avoiding spam, hate speech, harassment, or any content that promotes illegal activities.Language: While English is the primary language, communities in other languages are encouraged to submit as long as they maintain an inclusive and respectful atmosphere.Transparency: Clear information about the community’s purpose, rules, and moderators should be available to members.Other RecommendationsAccessibility: Community forums should be accessible for everyone to read without requiring a sign-up or registration.Discord Server Invites: It is recommended that only reliable Discord server invites be added to ethereum.org. Ideally, these invites should link to a community page on the website (e.g., .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--et