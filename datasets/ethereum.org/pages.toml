["https://ethereum.org/en/glossary"]
title = "Ethereum Glossary"
description = "An incomplete glossary of technical and non-technical terms related to Ethereum"
full_description = '''On this pageGlossary#51% attackA type of attack where a group gains control of the majority of nodes. This would allow them to defraud the blockchain by reversing transactions and double spending ether and other tokens.In Ethereum proof-of-stake this would be achieved by accumulating more than half of the total staked ether. This would allow an attacker to decide which new blocks are added to the blockchain. However, to revert the chain or double-spend an attacker would require at least 66% of the total staked ether.AAccountAn Ethereum account is a digital identity on the Ethereum blockchain, allowing users to send, receive Ether, and interact with smart contracts.Technical:Its an object containing an address, balance, nonce, and optional storage and code. An account can be a contract account or an externally owned account (EOA).AddressAn Ethereum address is a unique identifier used for receiving tokens, functions similar to a bank account number for cryptocurrencies. Its used to identify your Ethereum account.It is the rightmost 160 bits of a Keccak hash of an ECDSA public key.Application Binary Interface (ABI)A JSON file that defines the functions and variables included in a smart contract. The ABI allows bytecode to be mapped into human-readable formats.Anti-SybilAre ways to stop people from pretending to be many users at once on the internet, ensuring each user is a real, separate person. This helps keep online interactions fair and honest.Application Programming Interface (API)An Application Programming Interface (API) is a set of definitions for how to use a piece of software. An API sits between an application and a web server, and facilitates the transfer of data between them.APRAPR, or Annual Percentage Rate, reflects the yearly cost of borrowing money, including interest and fees, as a percentage.ASICApplication-specific integrated circuit. This usually refers to an integrated circuit, custom-built for cryptocurrency mining.assertIn Solidity, `assert(false)` compiles to `0xfe`, an invalid opcode, which uses up all remaining gas and reverts all changes. When an `assert()` statement fails, something very wrong and unexpected is happening, and you will need to fix your code. You should use `assert()` to avoid conditions that should never, ever occur. More on smart contract security.AttestationA claim made by an entity that something is true. In context of Ethereum, consensus validators must make a claim as to what they believe the state of the chain to be. At designated times, each validator is responsible for publishing different attestations that formally declare this validator's view of the chain, including the last finalized checkpoint and the current head of the chain. More on attestations.BBase feeEvery block has a reserve price known as the 'base fee'. It is the minimum gas fee a user must pay to include a transaction in the next block. More on gas and fees.Beacon chainThe Beacon Chain was the blockchain that introduced proof-of-stake and validators to Ethereum. It ran alongside the proof-of-work Ethereum Mainnet from December 2020 until the two chains were merged in September 2022 to form the Ethereum of today. More on beacon chain.Big-endianA positional number representation where the most significant digit is first in memory. The opposite of little-endian, where the least significant digit is first.BlockA block is where transactions or digital actions are stored. Once a block is full, it gets linked to the previous one, creating a chain of blocks or a "blockchain". More on blocks.A block is a bundled unit of information that includes an ordered list of transactions and consensus-related information. Blocks are proposed by proof-of-stake validators, at which point they are shared across the entire peer-to-peer network, where they can easily be independently verified by all other nodes. Consensus rules govern what contents of a block are considered valid, and any invalid blocks are disregarded by the network. The ordering of these blocks and the transactions therein create a deterministic chain of events with the end representing the current state of the network.Block explorerAn interface that allows a user to search for information from, and about, a blockchain. This includes retrieving individual transactions, activity associated with specific addresses and information about the network.Block headerThe block header is a collection of metadata about a block and a summary of the transactions included in the execution payload.Block propagationThe process of transmitting a confirmed block to all other nodes in the network.Block proposerThe specific validator chosen to create a block in a particular slot.Block rewardThe amount of ether rewarded to the proposer of a new valid block.Block statusThe states that a block can exist in. The possible states include:proposed: the block was proposed by a validatorscheduled: validators are currently submitting datamissed/skipped: the proposer did not propose a block within the eligible time frameorphaned: the block was reorg'd out by the fork choice algorithmBlock timeThe time interval between blocks being added to the blockchain.Block validationThe process of checking that a new block contains valid transactions and signatures, builds on the heaviest historical chain (meaning the one that has accumulated the most attestations in its history), and follows all other consensus rules. Valid blocks are added to the head of the chain and propagated to others on the network. Invalid blocks are disregarded.BlockchainA blockchain is a database of transactions, duplicated and shared on all computers in the network, ensuring data cannot be altered retroactively.A sequence of block , each linking to its predecessor all the way to the genesis block by referencing the hash of the previous block. The integrity of the blockchain is crypto-economically secured using a proof-of-stake-based consensus mechanism. What is a blockchain?BootnodeThe nodes which can be used to initiate the discovery process when running a node. Bootnodes 'introduce' new nodes to other existing nodes so that they can quickly gain peers, rather than having to search for an initial peer. The endpoints of these nodes are usually provided in Ethereum client source code, but users can provide their own list of bootnodes.BridgeA blockchain bridge is used to transfer assets from one blockchain network to another. For example you can use bridge to transfer ETH from the main Ethereum network to cheaper Layer 2 scaling solutions.BytecodeCode expressed in a compact, numeric form so that it can be executed efficiently by the EVM.Byzantium forkThe first of two hard forks for the Metropolis development stage. It included EIP-649 Metropolis Difficulty Bomb Delay and Block Reward Reduction, where the Ice Age was delayed by 1 year and the block reward was reduced from 5 to 3 ether.CCasper FFGCasper-FFG is a proof-of-stake consensus protocol used in conjunction with the LMD-GHOST fork choice algorithm to allow consensus clients to agree on the head of the Beacon Chain.CheckpointThe Beacon Chain has a tempo divided into slots (12 seconds) and epochs (32 slots). The first slot in each epoch is a checkpoint. When a supermajority of validators attests to the link between two checkpoints, they can be justified and then when another checkpoint is justified on top, they can be finalized.CompilingConverting code written in a high-level programming language (e.g., Solidity) into a lower-level language (e.g., EVM bytecode).More on compiling smart contractsCommitteeA group of at least 128 validators assigned to validate blocks in each slot. One of the validators in the committee is the aggregator, responsible for aggregating the signatures of all other validators in the committee that agree on an attestation. Not to be confused with sync committee.Computational infeasibilityA process is computationally infeasible if it would take an impracticably long time (e.g. billions of years) to do it for anyone who might conceivably have an interest in carrying it out.ConsensusWhen more than 2/3 of the computers in a network agree that they have the same set of records, making sure everyone is on the same page. This isn't about the rules they follow, but making sure they all have the same information.Consensus clientConsensus clients (such as Prysm, Teku, Nimbus, Lighthouse, Lodestar) run Ethereum's proof-of-stake consensus algorithm allowing the network to reach agreement about the head of the Beacon Chain. Consensus clients do not participate in validating/broadcasting transactions or executing state transitions. This is done by execution clients. Consensus clients do not attest to, or propose new blocks. This is done by the validator client which is an optional add-on to the consensus client.Consensus layerEthereum's consensus layer is the network of consensus clients.Consensus rulesThe block validation rules that full nodes follow to stay in consensus with other nodes. Not to be confused with consensus.Constantinople forkThe second part of the Metropolis stage, originally planned for mid-2018. Expected to include a switch to a hybrid proof-of-work/proof-of-stake consensus algorithm, among other changes.Contract accountAn account containing code that executes whenever it receives a transaction from another account (EOA] or contract).Contract creation transactionA special transaction that includes a contract's initiation code. The recipient is set to `null` and the contract is deployed to an address generated from the user address and `nonce`. that is used to register a contract and record it on the Ethereum blockchain.CryptographyIt is the practice of securing communication and data through the use of codes, so that only those for whom the information is intended can read and process it.It involves techniques for encryption (converting readable information into an unreadable format) and decryption (converting it back into a readable format), ensuring confidentiality.CryptoeconomicsThe study of mathematical and economic principles to design secure and trustworthy digital platforms. The goal is to ensure that all participants follow the rules and are rewarded for contributing to the network's security and operation.DĐĐ (D with stroke) is used in Old English, Middle English, Icelandic, and Faroese to stand for an uppercase letter “Eth”. It is used in words like ĐEV or Đapp (decentralized application), where the Đ is the Norse letter “eth”. The uppercase eth (Ð) is also used to symbolize the cryptocurrency Dogecoin. This is commonly seen in older Ethereum literature but is used less often today.DAGDAG stands for Directed Acyclic Graph. It is a data structure composed of nodes and links between them. Before The Merge, Ethereum used a DAG in its proof-of-work algorithm, Ethash, but is no longer used in proof-of-stake.DappA dApp is a decentralized application that runs on a blockchain network, offering services without a central controlling authority. More on decentralized applications.At a minimum dapp has a smart contract connected to a web interface. In addition, many dapps include decentralized storage and/or a message protocol and platform.Data availabilityAny node can independently verify transactions on a blockchain in order to maintain transparency and trust in the system.DecentralizationThe concept of moving the control and execution of processes away from a central entity.Decentralized autonomous organization (DAO)A DAO is a digital organization run by rules coded on a blockchain, where decisions are made by member votes, not a central authority. More on decentralized autonomous organizations (DAOs).Each member's voting power often tied to the number of tokens they hold. DAOs aim to democratize decision-making and operations, focusing on transparency and community governance.Decentralized exchange (DEX)A type of Ethereum app that lets you swap tokens with peers on the network. DEXes are not subject to geographical restrictions like centralized exchanges – anyone can participate.Deposit contractThe gateway to staking on Ethereum. The deposit contract is a smart contract on Ethereum that accepts deposits of ETH and manages validator balances. A validator cannot be activated without depositing ETH into this contract. The contract requires ETH and input data. This input data includes the validator public key and withdrawal public key, signed by the validator private key. This data is needed for a validator to be identified and approved by the proof-of-stake network.DeFiA broad category of Ethereum apps aiming to provide financial services backed by the blockchain, without any intermediaries. More on decentralized finance (DeFi)DifficultyA network-wide setting in proof-of-work networks that controls how much average computation is required to find a valid nonce. The difficulty is represented by the number of leading zeroes that are required in the resulting block hash for it to be considered valid. This concept is deprecated in Ethereum since the transition to proof-of-stake.Difficulty bombPlanned exponential increase in proof-of-work difficulty setting that was designed to motivate the transition to proof-of-stake, reducing the chances of a fork. The difficulty bomb was deprecated with the Merge.Digital signatureA short string of data a user produces for a document using a private key such that anyone with the corresponding public key, the signature, and the document can verify that (1) the document was "signed" by the owner of that particular private key, and (2) the document was not changed after it was signed.DiscoveryThe process by which an Ethereum node finds other nodes to connect to.Distributed hash table (DHT)A data structure containing `(key, value)` pairs used by Ethereum nodes to identify peers to connect to and determine which protocols to use to communicate.Double spendA deliberate blockchain fork, where a user with a sufficiently large amount of mining power/stake sends a transaction moving some currency offchain (e.g. exiting into fiat money or making an offchain purchase) then reorganizing the blockchain to remove that transaction. A successful double spend leaves the attacker with both their on and offchain assets.EElliptic Curve Digital Signature Algorithm (ECDSA)A cryptographic algorithm used by Ethereum to ensure that funds can only be spent by their owners. It's the preferred method for creating public and private keys. Relevant for account address generation and transaction verification.EncryptionEncryption is the conversion of electronic data into a form unreadable by anyone except the owner of the correct decryption key.EntropyIn the context of cryptography, lack of predictability or level of randomness. When generating secret information, such as private keys, algorithms usually rely on a source of high entropy to ensure the output is unpredictable.EpochA period of 32 slots, each slot being 12 seconds, totalling 6.'''
year_published = 2025
