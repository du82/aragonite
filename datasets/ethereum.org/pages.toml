["https://ethereum.org/en/contributing/translation-program"]
title = "Translation Program"
description = "Information about the ethereum.org Translation Program"
full_description = "On this pageTranslation ProgramThe Translation Program is a collaborative effort to translate ethereum.org into different languages in order to make the website more accessible to billions of non-English speakers around the world.Help us translateThe ethereum.org Translation Program is open and anyone can contribute!You will need to log in to your Crowdin account or sign up.Select the language you want to contribute to.Before starting, please check out the How to translate guide to learn how to use Crowdin, and the Translation Style Guide for tips and best practices.Machine translations will not be approved.All translations are reviewed before being added to the site, so there will be a short delay before your translations go live.Join the ethereum.org Discord(opens in a new tab) to collaborate on translations, ask questions, share feedback and ideas, or join a translation group.Start translating(opens in a new tab)About the Translation ProgramThe Ethereum community aims to be global and inclusive, yet much of its content only caters to English speakers, leaving out the world's 6 billion non-English speakers. For ethereum.org to act as the portal into Ethereum for the worldwide community, we believe providing non-English speakers with Ethereum content in their native languages is essential.The ethereum.org Translation Program aims to make Ethereum accessible to everyone by translating ethereum.org and other Ethereum content into as many languages as possible.Read more about the ethereum.org Translation Program mission and vision.Our progress so far6,900 + translators68 languages live on site2.89 million words translated in 2024AcknowledgementsEthereum.org is translated by thousands of community members and they are the key part of the Translation Program. We want to acknowledge our translators and support them on their career paths. Here are some of our translator acknowledgements:CertificateIf you have contributed to the Translation Program and at least 5,000 of your translated words have been approved, you are eligible for an ethereum.org translator certificate. More on certificatesOATsContributors to the Translation Program are eligible for different OATs (onchain achievement tokens) based on their number of translated words in 2024. OATs are NFTs that prove your contribution to the ethereum.org Translation Program. More on OATsTranslator acknowledgementsPublic acknowledgements of our top translators using leaderboards and a list of all contributors to the Translation Program.RewardsIn the past, we have retroactively rewarded our most active contributors with tickets to Ethereum conferences like Devcon(opens in a new tab) and Devconnect(opens in a new tab), as well as exclusive ethereum.org merch.We're constantly thinking of new and innovative ways to reward our contributors, so stay tuned!Guides and resourcesIf you are contributing to the Translation Program or thinking about getting involved, you should check out the translation guides below:Translation Style Guide – instructions and tips for ethereum.org translatorsTranslation FAQs – frequently asked questions and answers about the ethereum.org Translation ProgramCrowdin online editor guide(opens in a new tab) – an in-depth guide to using the Crowdin online editor and some of Crowdin's advanced featuresContent buckets – which pages are included in each content bucket of ethereum.orgFor other useful translation tools, translator communities and Translation Program blog posts, please visit the Resources page.Get in touchDo you have any questions? Or want to collaborate with our team and other translators? Please post in the #translations channel of our ethereum.org Discord server(opens in a new tab)You can also reach out to us at translations@ethereum.org(opens in a new tab)Starting your own translation programWe are dedicated to translating Ethereum content into as many languages as possible and making educational content available to everyone. In line with our focus on translations, we want to help other Ethereum projects organize, manage, and improve their own translation efforts.For this reason, we have created a Translation Program playbook that contains some tips and best practices we have picked up in the process of translating ethereum.org.Want to collaborate further or use some of our translation resources? Have any feedback on the playbook? We would love to hear from you at translations@ethereum.org(opens in a new tab).Was this article helpful?YesNo"
year_published = 2025
clearnet = "https://ethereum.org/en/contributing/translation-program"
