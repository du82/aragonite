title = "Online communities"
description = "A listing of the grant programs throughout the Ethereum ecosystem."
full_description = "On this pageOnline communitiesHundreds of thousands of Ethereum enthusiasts gather in these online forums to share news, talk about recent developments, debate technical issues, and imagine the future.Listing PolicyTo maintain the integrity and value of the listed communities, ethereum.org follows a strict policy for determining eligibility:Eligibility CriteriaRelevance: The community must be directly related to Ethereum and its ecosystem.Activity Level: The community should be active, with regular interactions, posts, or discussions. Dormant or inactive communities may be removed.Inclusivity: The community should foster a welcoming environment that respects diversity and encourages participation from people of all backgrounds.Non-commercial Focus: Listings are intended for community-driven spaces rather than commercial or promotional platforms.Content GuidelinesAppropriate Content: Communities must have their own moderation guidelines, avoiding spam, hate speech, harassment, or any content that promotes illegal activities.Language: While English is the primary language, communities in other languages are encouraged to submit as long as they maintain an inclusive and respectful atmosphere.Transparency: Clear information about the community’s purpose, rules, and moderators should be available to members.Other RecommendationsAccessibility: Community forums should be accessible for everyone to read without requiring a sign-up or registration.Discord Server Invites: It is recommended that only reliable Discord server invites be added to ethereum.org. Ideally, these invites should link to a community page on the website (e.g., ethglobal.com/discord(opens in a new tab)) or be from an official URL (e.g., discord.gg/ethstaker(opens in a new tab) or discord.com/invite/ethstaker(opens in a new tab)).If you believe a community should be added or removed based on these guidelines, please open an issue on our GitHub repository(opens in a new tab).Forumsr/ethereum(opens in a new tab) - all things Ethereumr/ethfinance(opens in a new tab) - the financial side of Ethereum, including DeFir/ethdev(opens in a new tab) - focused on Ethereum developmentr/ethtrader(opens in a new tab) - trends & market analysisr/ethstaker(opens in a new tab) - welcome to all interested in staking on EthereumFellowship of Ethereum Magicians(opens in a new tab) - community oriented around technical standards in EthereumEthereum Stackexchange(opens in a new tab) - discussion and help for Ethereum developersEthereum Research(opens in a new tab) - the most influential messageboard for cryptoeconomic researchChat roomsEthereum Cat Herders(opens in a new tab) - community oriented around offering project management support to Ethereum developmentEthereum Hackers(opens in a new tab) - Discord chat run by ETHGlobal: an online community for Ethereum hackers all over the worldCryptoDevs(opens in a new tab) - Ethereum development focused Discord communityEthStaker Discord(opens in a new tab) - community-run guidance, education, support, and resources for existing and potential stakersEthereum.org website team(opens in a new tab) - stop by and chat ethereum.org web development and design with the team and folks from the communityMatos Discord(opens in a new tab) - web3 creators community where builders, industrial figureheads, and Ethereum enthusiasts hang out. We're passionate about web3 development, design, and culture. Come build with us.Solidity Gitter(opens in a new tab) - chat for solidity development (Gitter)Solidity Matrix(opens in a new tab) - chat for solidity development (Matrix)Ethereum Stack Exchange(opens in a new tab) - question and answer forumPeera Community Forum(opens in a new tab) - decentralized question and answer forumYouTube and X formerly (Twitter)Ethereum Foundation(opens in a new tab) - Keep up to date with the latest from the Ethereum Foundation@ethereum(opens in a new tab) - Official account of the Ethereum Foundation@ethdotorg(opens in a new tab) - The portal to Ethereum, built for our growing global communityList of influential Ethereum twitter accounts(opens in a new tab)Decentralized Autonomous Organizations (DAOs)These groups leverage Ethereum technology to facilitate organization and collaboration. For instance, for controlling membership, voting on proposals, or managing pooled assets.Learn more about DAOsWas this article helpful?YesNo"
year_published = 2025
clearnet = "https://ethereum.org/en/community/online"
