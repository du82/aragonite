full_description = "Join the communityWelcome to the Ethereum community hubThe Ethereum community is home to hundreds of thousands of developers, technologists, designers, users, HODLers and enthusiasts.Why get involved?Find your tribeThere is a tribe for everyone. Find and connect with like minded individuals to discuss, ponder, and celebrate Ethereum together.Earn a livingEveryone has bills to pay. Ethereum allows you to find meaningful work, and get paid well to do it.Make a differenceGetting involved with Ethereum allows you to be an active stakeholder in a technology that is having a positive impact on millions of people.How can I get involved?There are many ways to get involved in the fast-growing Ethereum community; you can join one of the popular online communities, attend an event, join a meetup group, contribute to a project, or participate in one of the many online forums about Ethereum.Join an online communityFind your tribe and participate in community with other Ethereum enthusiasts.Ethereum eventsFind and participate in an Ethereum conference, hackathon, or meetup.Contribute to a projectCheck out how to get involved for a list of ways that you can contribute based on your skills and professional background.Search for grantsFunding grants are available to help you get a project off the ground.Creator? Builder? Get paid for your work.Are you building on Ethereum, or do you want to? Companies are hiring for thousands of technical and non-technical roles. Got an idea of your own? Try finding a grant to get your project off the ground.Find a jobExplore grantsContribute to ethereum.orgFor many people, ethereum.org is their first step into the ecosystem. It is kept up-to-date and accurate by thousands of open-source contributors. Want to help? Read our guide on contributing, or take up an issue on our GitHub.More on contributingView on GitHub(opens in a new tab)Ethereum supportNeed support? There is no official Ethereum support, but hundreds of helpful communities are available to help you prosper on Ethereum.Get supportTry Ethereum for yourselfGet some ETHETH is the native currency of Ethereum. You'll need some ETH in your wallet to use Ethereum applications.Get ETHTry some dappsDapps are applications built on Ethereum. Dapps are disrupting current business models and inventing new ones.Explore dappsWas this page helpful?YesNo"
