["https://ethereum.org/en/about"]
title = "About Us"
description = "About the team, community and mission of ethereum.org"
full_description = '''On this pageAbout ethereum.orgethereum.org is a public, open-source resource for the Ethereum community that anyone can contribute to. We have a small core team dedicated to maintaining and developing the site with contributions from thousands of community members across the globe.Nobody from ethereum.org will ever contact you. Do not respond.A note on namesIt's common for people to confuse names within the Ethereum landscape, which can lead to poor mental models about how Ethereum works. Here's a quick explainer to clear things up:EthereumEthereum is a public network, a blockchain, and an open-source protocol -- operated, governed, managed, and owned by a global community of tens of thousands of developers, node operators, ETH holders and users.More about EthereumMore on Ethereum governanceEther (ETH)Ether (also known by its ticker symbol, ETH) is the native currency transacted on Ethereum. ETH is needed to pay for usage of the Ethereum network (in the form of transaction fees). ETH is also used to secure the network with staking. When people talk about the price of Ethereum, they're referring to ETH the asset.More about ETHMore on staking ETHEthereum FoundationA non-profit organization, funded initially by the crowdsale of ETH, dedicated to the support of the Ethereum network and ecosystem.More about the Ethereum Foundationethereum.orgA public, open-source website and educational resource for the Ethereum community. ethereum.org is led by a small core team, funded by the Ethereum Foundation, with contributions from thousands of community members across the globe.This page covers more information about ethereum.org.Our missionethereum.org's mission is to be the best portal for Ethereum's growing communityWe strive to build an easy-to-understand educational resource for all topics relating to Ethereum, designed to help new users become familiar with Ethereum and its key concepts. We want to:explain Ethereum to anyone new to the technologyhelp new users get started with ETH and Ethereumhelp new developers to start buildingcover updates in the Ethereum worldshowcase resources created by the communitybring Ethereum education to as many languages as possibleTo achieve this mission, our team focuses on two primary goals on ethereum.org:1. Improve user experience for ethereum.org visitorsExtend, improve, and keep content up-to-dateImprove usability and accessibility via localization and web development best practicesIncrease user engagement via features like surveys, quizzes, and web3 integrationsKeep the website lightweight and performant2. Grow, strengthen, and empower our community of contributorsGrow total number of contributors to the websiteImprove contributor retention through engagement, acknowledgments, and rewardsEmpower community members to make increasingly significant contributionsFacilitate greater diversity of contributions: code, content, design, translation, moderationKeep the codebase modern, clean, and well-documentedCore principlesWe have some core principles that help guide us to accomplish our mission.1. ethereum.org is a portal to Ethereum 🌏We want our users to have their interest piqued and their questions answered. So our portal needs to combine information, "magic moments" and links to the brilliant community resources that exist out there. The purpose of our content is to be an “onboarding portal” and not a substitute for the extensive resources that already exist. We're keen to support and integrate with community built resources, giving them more visibility and making them more discoverable. Ethereum's community is at the heart of this: we need to not just serve the community, but work with them and incorporate their feedback. The website isn't just for the community we have now but for the community we hope to grow into. We must remember our community is global, containing people from many languages, regions, and cultures.2. ethereum.org is always evolving 🛠Ethereum and the community are always evolving, so ethereum.org will too. That's why the site has a simple design system & modular structure. We make iterative changes as we learn more about how people use the site and what the community wants from it. We're open source, with a community of contributors, so you can propose changes or help us out too. Learn about contributing3. ethereum.org is not a typical product website 🦄Ethereum is a big thing: it includes a community, a technology, a set of ideas and ideologies, and more. This means the website needs to handle many different user journeys, from “a developer who wants a specific tool” and “a newcomer who just bought some ETH and doesn’t know what a wallet is". "What is the best website for a blockchain platform?" remains an open question - we are pioneers. Building this requires experimentation.Product roadmapTo make our work more accessible and to foster more community collaboration, the ethereum.org core team publishes an overview of our shape up cycle(opens in a new tab) roadmap goals.View our 2025 Cycle 1 product roadmap(opens in a new tab)How's that sound? We always appreciate feedback on our roadmap - if there's something you think we should work on, please let us know! We welcome ideas and PRs from anyone in the community.Want to get involved? Learn more about contributing, hit us up on Twitter(opens in a new tab), or join the community discussions in our Discord server(opens in a new tab).Design principlesWe use a set of design principles to guide our content and design decisions on the site.Design systemWe built and released a design system(opens in a new tab) to ship features more quickly and let community members participate in the open design of ethereum.org.Want to get involved? Follow along in Figma(opens in a new tab), the GitHub issue(opens in a new tab) and join the conversation in our #design Discord channel(opens in a new tab).Style guideWe have a style guide to standardize certain aspects of writing content to make the contribution process smoother.Make sure you read our principles and our style guide if you'd like to contribute to the site.We welcome feedback on our design principles, design system and the style guide. Remember, ethereum.org is for the community, by the community.LicenseThe ethereum.org website is open source and built under an MIT License(opens in a new tab) unless otherwise specified. More on terms of use of ethereum.org.Open jobsAlthough this website is open-source and anyone can work on it, we do have a team dedicated to ethereum.org and other Ethereum Foundation web projects.We'll post any job openings here. If you don't see a role here for you, head over to our Discord server(opens in a new tab) and let us know how you'd like to work with us!Looking beyond the ethereum.org team? Check out other Ethereum related jobs.Was this article helpful?YesNo'''
year_published = 2025
clearnet = "https://ethereum.org/en/about"
