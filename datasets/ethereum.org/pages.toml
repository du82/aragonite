["https://ethereum.org/en/foundation"]
title = "Ethereum Foundation"
description = "Learn about the Ethereum Foundation (EF), a non-profit organization dedicated to supporting Ethereum and related technologies."
full_description = "On this pageAbout the Ethereum FoundationThe Ethereum Foundation(opens in a new tab) (EF) is a non-profit organization dedicated to supporting Ethereum and related technologies.The EF is not a company, or even a traditional non-profit. Their role is not to control or lead Ethereum, nor are they the only organization that funds critical development of Ethereum-related technologies. The EF is one part of a much larger ecosystem.Ethereum Foundation InitiativesEcosystem Support ProgramThe Ecosystem Support Program(opens in a new tab) exists to provide both financial and non-financial support to projects and entities within the greater Ethereum community, in order to accelerate the growth of the ecosystem. The Ecosystem Support Program is an expansion of the original Ethereum Grants Program which mainly focused on financial support.Learn more about the Ecosystem Support Program, past grant recipients, and the grant application process at esp.ethereum.foundation(opens in a new tab). You can also view the Ecosystem Support Program Blog(opens in a new tab) or follow @EF_ESP(opens in a new tab) for their latest news and announcements.DevconSince 2014, the Ethereum Foundation has organized Devcon, the annual conference for all Ethereum developers, researchers, thinkers, and makers.You can access video content of conference presentations for every year since its inception at archive.devcon.org(opens in a new tab).Learn more at devcon.org(opens in a new tab), check out the Devcon Blog(opens in a new tab), or follow @efdevcon(opens in a new tab) for the latest announcements.Fellowship ProgramThe Ethereum Foundation Fellowship Program(opens in a new tab) is an initiative to help address gaps in representation across cultures, nationalities, and economic classes. The Fellowship Program is about bridging these gaps by identifying and supporting unique and talented individuals helping to enable Ethereum’s relevance, and breaking down barriers to entry for those underrepresented people and communities who will become the future of Web3.Learn more at fellowship.ethereum.foundation(opens in a new tab).For more on the Foundation and their work, visit ethereum.foundation(opens in a new tab), or check out the Ethereum Foundation Blog(opens in a new tab) for the EF's latest news and announcements.Was this article helpful?YesNo"
