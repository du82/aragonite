title = "What are NFTs? | Benefits and use"
description = "An overview of NFTs on Ethereum"
full_description = '''What are NFTs?NFTs are tokens that are individually unique. Each NFT has different properties (non-fungible) and is provably scarce. This is different from tokens such as or other Ethereum based tokens like USDC where every token is identical and has the same properties ('fungible'). You don't care which specific dollar bill (or ETH) you have in your wallet, because they are all identical and worth the same. However, you do care which specific NFT you own, because they all have individual properties that distinguish them from others ('non-fungible').The uniqueness of each NFT enables tokenization of things like art, collectibles, or even real estate, where one specific unique NFT represents some specific unique real world or digital item. Ownership of an asset is publicly verifiable on Ethereum .The internet of assetsNFTs and Ethereum solve some of the problems that exist on the internet today. As everything becomes more digital, there's a need to replicate the properties of physical items like scarcity, uniqueness, and proof of ownership in a way that isn't controlled by a central organization. For example, with NFTs, you can own a music mp3 file across all Ethereum based apps and not be bound to one company's specific music app like Spotify or Apple Music. You can own a social media handle that you can sell or swap, but can't be arbitrarily taken away from you by a platform provider.Here's how an internet of NFTs compared to the internet most of us use today looks...A comparisonAn NFT internetThe internet todayYou own your assets! Only you can sell or swap them.You rent an asset from some organization and it can be taken away from you.NFTs are digitally unique, no two NFTs are the same.A copy often cannot be distinguished from the original.Ownership of an NFT is stored on the blockchain for anyone to verify publicly.The access to ownership records of digital items is controlled by institutions – you must take their word for it.NFTs are on Ethereum. This means they can easily be used in other smart contracts and apps on Ethereum!Companies with digital items usually require their own "walled garden" infrastructure.Content creators can sell their work anywhere and can access a global market.Creators rely on the infrastructure and distribution of the platforms they use. These are often subject to terms of use and geographical restrictions.NFT creators can retain ownership rights over their own work, and program royalties directly into the NFT contract.Platforms, such as music streaming services, retain the majority of profits from sales.What are NFTs used for?NFTs are used for many things, including:proving that you attended an eventcertify that you completed a courseownable items for gamesdigital arttokenizing real-world assetsproving your online identitygating access to contentticketingdecentralized internet domain namescollateral in Maybe you are an artist that wants to share their work using NFTs, without losing control and sacrificing your profits to intermediaries. You can create a new contract and specify the number of NFTs, their properties and a link to some specific artwork. As the artist, you can program into the smart contract the royalties you should be paid (e.g. transfer 5% of the sale price to the contract owner each time an NFT is transferred). You can also always prove that you created the NFTs because you own the that deployed the contract. Your buyers can easily prove that they own an authentic NFT from your collection because their wallet is associated with a token in your smart contract. They can use it across the Ethereum ecosystem, confident in its authenticity.Explore, buy or create your own NFT art/collectibles...Explore NFT artOr consider a ticket to a sporting event. Just as an organizer of an event can choose how many tickets to sell, the creator of an NFT can decide how many replicas exist. Sometimes these are exact replicas, such as 5000 General Admission tickets. Sometimes several are minted that are very similar, but each slightly different, such as a ticket with an assigned seat. These can be bought and sold peer-to-peer without paying ticket handlers and the buyer always with assurance of the ticket authenticity by checking the contract address.On ethereum.org, NFTs are used to demonstrate that people have meaningfully contributed to our Github repository (programmed the website, written or modified an article...), translated our content, or attended our community calls, and we've even got our own NFT domain name. If you contribute to ethereum.org, you can claim a NFT. Some crypto meetups have used POAPs as tickets. .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration:underline;text-decoration:underline;outline:2px solid transparent;outline-offset:2px;color:var(--eth-colors-primary-base);text-underline-offset:3px;}.css-1f04442:hover,.css-1f04442[data-hover]{-webkit-text-decoration:underline;text-decoration:underline;color:var(--eth-colors-primary-hover);}.css-1f04442:focus-visible,.css-1f04442[data-focus-visible]{box-shadow:var(--eth-shadows-none);outline:2px solid;outline-color:var(--eth-colors-primary-hover);outline-offset:2px;border-radius:var(--eth-radii-sm);}.css-1f04442[data-inline-link]:visited{color:var(--eth-colors-primary-visited);}More on contributing.This website also has an alternative domain name powered by NFTs, ethereum.eth. Our .org address is centrally managed by a domain name system (DNS) provider, whereas ethereum.eth is registered on Ethereum via the Ethereum Name Service (ENS). And it's owned and managed by us. .css-1f04442{transition-property:var(--eth-transition-property-common);transition-duration:var(--eth-transition-duration-fast);transition-timing-function:var(--eth-transition-easing-ease-out);cursor:pointer;-webkit-text-decoration