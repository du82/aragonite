["https://ethereum.org/en/learn"]
title = "Ethereum: A Comprehensive Learning Guide"
description = "Your educational guide to the world of Ethereum. Learn how Ethereum works and how to connect to it. This page includes technical and non-technical articles, guides, and resources."
full_description = "On this pageWhat is Ethereum?How do I use Ethereum?What is Ethereum used for?Strengthen the Ethereum networkLearn about the Ethereum protocolLearn about the Ethereum communityBooks and podcastsWhat is Ethereum?Cryptocurrencies, such as bitcoin, enable anyone to transfer money globally. Ethereum does too, but it can also run code that enables people to create apps and organizations. It’s both resilient and flexible: any computer program can run on Ethereum. Learn more and find out how to get started:What is Ethereum?If you are new, start here to learn why Ethereum matters.What is Ethereum?What is ETH?Ether (ETH) is the currency powering the Ethereum network and apps.What is ETH?What is Web3?Web3 is a model for the internet valuing ownership of your assets and identity.What is Web3?More on Ethereum basicsGuides: step-by-step instructions on using EthereumQuiz hub: test your knowledgeWhat are smart contracts?Ethereum in 30 minutes by Vitalik ButerinHow do I use Ethereum?Using Ethereum can mean lots of things to lots of people. Maybe you want to sign in to an app, prove your online identity, or transfer some ETH. The first thing you'll need is an account. The easiest way to create and access an account is using software called a wallet.What is a wallet?Digital wallets are like real wallets; they store what you need to prove your identity and get access to the places you value.What is a wallet?Find a walletBrowse wallets based on the features that matter to you.List of walletsEthereum networksSave money by using cheaper and faster Ethereum extensions.Choose networkThings to consider when using EthereumEach Ethereum transaction requires a fee in the form of ETH, even if you need to move different tokens built on Ethereum like the stablecoins USDC or DAI.Fees can be high depending on the number of people trying to use Ethereum, so we recommend using Layer 2s.More on using EthereumHow to create an Ethereum accountHow to use a walletLayer 2: reducing transaction feesLearn how to get ETHWhat is Ethereum used for?Ethereum has led to the creation of new products and services that can improve different areas of our lives. We're still in the early stages but there's a lot to be excited about.Decentralized finance (DeFi)Explore an alternative financial system that is built without banks and is open to anyone.What is DeFi?StablecoinsCryptocurrencies pegged to the value of a currency, commodity, or some other financial instrument.What are stablecoins?Non-fungible tokens (NFTs)Represent ownership of unique items, from art to title deeds to concert tickets.What are NFTs?Decentralized autonomous organizations (DAOs)Enable new ways to coordinate work without a boss.What are DAOs?Decentralized applications (dapps)Create digital economy of peer-to-peer services.Explore dappsEmerging use casesThere are also other prominent industries being created or improved with Ethereum:Decentralized identityDecentralized social networksDeSci - Decentralized sciencePlay-to-earn games (P2E)(opens in a new tab)Fundraising through Quadratic Funding(opens in a new tab)Supply chain management(opens in a new tab)Strengthen the Ethereum networkYou can help secure Ethereum and earn rewards at the same time by staking your ETH. There are different options for staking depending on your technical knowledge and how much ETH you have.Staking EthereumLearn how to start staking your ETH.Start stakingRun a nodePlay a critical role in the Ethereum network by running a node.Run a nodeLearn about the Ethereum protocolFor users most interested in the technical part of the Ethereum network.Energy consumptionHow much energy does Ethereum use?Is Ethereum green?Ethereum roadmapEthereum's roadmap makes it more scalable, secure, and sustainable.Explore the roadmapEthereum WhitepaperThe original Ethereum proposal written by Vitalik Buterin in 2014.Read whitepaperMore on the Ethereum protocolEthereum for developersEthereum's proof-of-stake based consensus mechanismEthereum's embedded computer (The EVM)Ethereum nodes and clientsLearn about the Ethereum communityThe success of Ethereum is thanks to its incredibly dedicated community. Thousands of inspiring and driven people help push Ethereum’s vision forward, while also providing security to the network through staking and governance. Come and join us!Community hubOur community includes people from all backgrounds.Explore moreHow can I get involved?You (yes, you!) are welcome to contribute to the Ethereum community.How can I get involved?Online communitiesOnline communities provide a great opportunity to ask more specific questions or get involved.Explore communitiesBooks and podcastsBooks about EthereumThe Cryptopians(opens in a new tab) February 22, 2022 - Laura ShinOut of the Ether(opens in a new tab) September 29, 2020 - Matthew LeisingThe Infinite Machine(opens in a new tab) July 14, 2020 - Camila RussoMastering Ethereum(opens in a new tab) December 23, 2018 – Andreas M. Antonopoulos, Gavin Wood Ph.D. Proof of Stake(opens in a new tab) September 13, 2022 - Vitalik Buterin, Nathan SchneiderPodcasts about EthereumGreen Pill(opens in a new tab) Explores the crypto-economic systems that create positive externalities for the worldZero Knowledge(opens in a new tab) Goes deep into the tech that will power the emerging decentralized web and the community building thisUnchained(opens in a new tab) Dives deep into the people building the decentralized internet, the details of this technology that could underpin our future, and some of the thorniest topics in crypto, such as regulation, security and privacyThe Daily Gwei(opens in a new tab) Ethereum news recaps, updates and analysisBankless(opens in a new tab) A guide to Crypto financeWas this page helpful?YesNo"
