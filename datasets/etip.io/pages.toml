["https://etip.io/get-pay-raise-concierge"]
title = "How to ask for, and get a pay raise as a Concierge - eTip.io"
description = "Navigating a pay raise as a concierge can be tricky, as with any job. In this guide, we'll take you through the key steps to securing your pay increase."
full_description = '''How to ask for, and get a pay raise as a Concierge Posted in Employees, Get a pay raise Written by Ariana 5 min read 𝕏 Share on X Share on Facebook Share on Linkedin As a concierge, you work very hard to ensure that all of their customers are able to get the most out of their experiences. This requires attention to detail, communication and a personal touch. When you are able to bring these skills together, it can create a truly unforgettable experience for your guests. As a result, the satisfied customer leaves a bigger tip. Concierges understand better than most what it is like to rely on tips to make a living. This extra money helps put food on the table and provide for families. However, getting tips as a concierge is tougher than ever. As the economy goes increasingly cashless, concierges are finding it is harder to receive tips as people often do not carry cash on them. Furthermore, people are increasingly likely to use internet websites as a quick and easy substitute for concierge services. Hourly concierge wage by percentile Firstly, are you underpaid? In the current economy, the labor market is very tight. This is making it increasingly easy for workers to ask for more from their employers and find another job when they are unsatisfied. Many concierges carry specialized knowledge and personal connections that can be hard to replace. This means that you have a lot of power when negotiating your compensation with your boss. According to PayScale, the hourly wage for an entry level concierge ranges from $10-17, while an experienced concierge can make between $11-23. Equipped with this information and understanding of your value to your company, you can successfully negotiate better pay. When it comes to making an argument, information is one of the best tools you can be equipped with. Be sure to know your situation and why it should change. States with the highest paid concierges. Making a case for your pay raise One important aspect of considering how much you should be paid is your experience and training. If you have gone through training and have shown how your new skills enhanced the customer’s experience, you will be much more valuable to your company. In addition, it is important to consider this in the context of your peers. How much experience do your coworkers have? Have you been a key part of any important situations in your time there? How much training do you have compared to others? After considering this, use the data above to evaluate where you think your pay should be. Should you be paid more? Are there other forms of compensation you deserve and are not getting, such as health and dental insurance? Be sure to create a thorough argument as to why you are worth more than you are being paid currently. When is best to ask for a pay raise? Before going into your bosses office, it is important to know exactly what you want to ask for and why you deserve it. It is best to be overly prepared for this meeting than to not have everything you can use to make your case. You should know the pay of most concierges locally, and why you deserve to make more. Be sure to explain how your experience and training enhance your value over that of a new-hire. You may want to consider writing down what you want to say and sharing it with close friends and family to get their advice. The best time to schedule this meeting is right around the time for performance reviews—if you know you’ve performed well recently. If your boss says he or she needs time to think about it, be sure to be respectful. However, if they seem to be dismissive, don’t be afraid to follow up fairly regularly and let them know how important this is to you. If you’ve recently received a raise, this process will probably be more difficult. However, if you are able to articulate why you should be making even more your boss should give it fair consideration. Just remember, there might not be a ‘perfect moment.’ It is best not to wait, and to be persistent about getting what you want. Every hour of work you wait could be more money in your wallet. How should you request your pay increase? During your meeting, it is best to be knowledgeable yet concise. This allows you to tell your boss exactly your case without dragging on and losing their attention or making it seem like you’re moaning. It is best to be as professional and confident as possible. Knowing what information helps you make your case, especially numbers you can reference, makes it more difficult for your argument to be dismissed. If your boss pushes back at first, it is important to remain professional and ask them to consider what you have said. If they ask how much you want, it is best to start with a bit more than you actually hope for. Your boss may make a counter offer that is higher than if you simply told them directly what you wanted. Who knows, he or she may even say yes and give you more than you wanted – it’s a win-win situation. What happens if you don’t get a pay raise? If you are unsuccessful at first, don’t beat yourself up. You still have time to make your case and prove your value to your boss. You should ask if you will not be receiving a pay hike now, when you can expect it. It would also be beneficial to ask them exactly what they expect from you that can be done to increase your pay. You may want to offer taking on more responsibility or undergo more training. In addition, you can follow these tips to make more money as a concierge. If you feel there is truly no way for you to advance at your current company, it may be time to consider looking elsewhere. With your skills and experience, you can look around and possibly find a new employer willing to pay you for the value you add to their business. You could also use a job offer to try and negotiate better pay at your current position. Perhaps this will show your boss that you are truly difficult to replace and deserve more compensation for all that you do for the company. Conclusion When deciding how much you should be paid, it is important to research what other people are making at your position with the same experience and training. This allows you to determine what you should be paid and if you deserve a raise. If you do, it is important to arm yourself with as much information as possible so that you can make your case to your boss as effectively as possible. When making your case, remain professional and confident. If you are unsuccessful at first, find out when you can expect more and what you can do to make it happen. If you are still unhappy, it may be time to look elsewhere. The most important things to keep in mind when asking for a pay raise are: Do your research about what you should be paid and how much you currently makeDetermine how much you think you should be making, and what benefits you may not be gettingGather the information you will use to make your case. Draft your argument and possible share with friends and family to get their insight on what to add or edit outSchedule a meeting with your boss, ideally around performance review timeThere may not be a ‘perfect moment’ and instead you should be confident and ask for what you are worthIf asked how much you want, ask for more than how much you actually desireIf at first you don’t succeed, be sure to ask when you expect moreAsk what you need to improve on and what training may be offered to help you meet those expectationsIf you are still unsatisfied, it may be time to consider looking for a job elsewhere Posts navigation ← Complete Guide: How to earn more tips as a conciergeHow to ask for, and get a pay raise as a Nail Technician → Join the eTip community! We'll send the latest content & special releases directly to your inbox. hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" }); Ready to join the community? Receive the latest & greatest content from eTip, sent directly to your preferred inbox! hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" });'''
