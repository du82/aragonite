title = "Cash Tips Are a Thing of the Past, So Why Aren’t Hotels Modernizing Faster? - eTip.io"
description = "What does your wallet look like these days? If it’s a physical billfold fully stocked with cash, you’d find yourself in the minority. If your “wallet” is more often just your smartphone, tucked into your purse or pocket with access to all your credit cards and digital payments, that would put you in the majority of people…"
full_description = '''Cash Tips Are a Thing of the Past, So Why Aren’t Hotels Modernizing Faster? Posted in How to tip, Merchants Written by Nicolas 2 min read 𝕏 Share on X Share on Facebook Share on Linkedin What does your wallet look like these days? If it’s a physical billfold fully stocked with cash, you’d find yourself in the minority. If your “wallet” is more often just your smartphone, tucked into your purse or pocket with access to all your credit cards and digital payments, that would put you in the majority of people today. All of this has dramatically affected the traditional tipping model. A new study from Travis Credit Union found that only 10% of people carry cash for tipping. Millennials are the least likely to carry cash, with only 40% of respondents reporting cash in their wallets, and Baby Boomers averaged the least dollar amount kept on their person. Digital payments have become the new norm. That puts cash tips, particularly for hospitality service workers, in an ever more precarious spot. If people across generations are growing less likely to carry cash, then they’ll have a harder time leaving the customary cash tips that hardworking hotel employees deserve and often need to get by. Several factors are driving cash’s fall from grace. Technology has been rapidly advancing over the last decade, designed to make life easier, including new forms of digital interaction, data exchange, and payment transactions. The pandemic, of course, also played a major role. Cash felt dirty and unhygienic on new levels as it passed physically from hand to hand. As COVID fades and vaccinations increase, it would appear that new digital resources are here to stay. As our society veers closer to going fully digital, it’s likely that people will view cashless spending as the cleaner, healthier option over bills and coins. It’s clear the times are changing, so why aren’t we seeing hotels moving faster to modernize how tips are given and received? Steps need to be taken to move away from the reliance on physical tips for hospitality staff and make it easier both for guests to tip and for employees to receive those tips. People are looking for the ease and convenience of a digital solution, as well as a solution that is more hygienic than money. eTip is here to help. Our app-less, cashless platform built on personalized QR codes allows managers to easily set up “digital tip jars” that make tipping a breeze for guests (no cash or opening of a wallet required) and keeps hotel workers gratified and motivated. Posts navigation ← Innovative Response to Hotel Industry’s Grim Labor ShortageWith Contactless Service on the Rise, How Should You Tip Hotel Workers? → Join the eTip community! We'll send the latest content & special releases directly to your inbox. hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" }); Ready to join the community? Receive the latest & greatest content from eTip, sent directly to your preferred inbox! hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" });'''
