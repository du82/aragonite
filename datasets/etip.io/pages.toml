title = "eTip is Now SOC 2 Compliant, & Why It's Important - eTip.io"
description = "We’re lucky enough to work with some incredible customers. One thing that makes them so incredible? Their profits don’t come from a mass-produced, impersonal product. The hotels, nail salons, restaurants, and non-profits we serve are all in the trust business. Their customers choose them based on trust in the quality of their services, the reputation…"
full_description = '''eTip is Now SOC 2 Compliant, & Why It’s Important Posted in News Written by Nabil 2 min read 𝕏 Share on X Share on Facebook Share on Linkedin We’re lucky enough to work with some incredible customers. One thing that makes them so incredible? Their profits don’t come from a mass-produced, impersonal product. The hotels, nail salons, restaurants, and non-profits we serve are all in the trust business. Their customers choose them based on trust in the quality of their services, the reputation they’ve painstakingly crafted, and the belief that these organizations will provide them with an exceptional experience. At eTip, we believe in empowering these businesses to achieve this trust through the most reliable, secure, and convenient digital tipping system possible. That’s why today, we’re thrilled to announce we’ve taken one step further in enabling that trust by officially achieving SOC 2 compliance What is SOC 2, & Why is it Important? SOC 2, or Service Organization Controls 2, is a framework governed by the American Institute of Certified Public Accountants (AICPA). With a SOC 2 audit, an independent service auditor will review an organization’s policies, procedures, and evidence to determine whether its controls are designed and operating effectively. Achieving SOC 2 compliance means that, as a company, we fulfill five trust principles: security, confidentiality, availability, privacy, and processing integrity. Passing the audit means we’ve successfully met the standards established for each of these five trust areas, demonstrating our overall commitment to protecting our customers’ data and security. Why We Pursued SOC 2 Now eTip has been growing at an exciting pace. That growth has been fueled by all sorts of new customers who require the trust of their customers to do well. Working with people’s money as a digital tipping company, we knew from the outset that we’d need to eventually take this step to ensure the highest levels of security and compliance possible. After reaching the size we have, we knew it was time to undergo this important process to protect data and mitigate potential security risks early and on an ongoing basis. What’s most exciting about eTip achieving SOC 2 compliance? It’s a beneficial benchmark – not just for our enterprise customers – but for businesses of all sizes. We aim to ensure the protection of all parties. What Other Ways Does eTip Keep Its Customers Secure? This successful passage of our SOC 2 audit is the most recent in a long-established framework for ensuring our customer’s privacy and data protection. Beyond SOC compliance, eTip is also fully PCI-DSS compliant, and it works hand in hand with our banking and compliance partners to remain current on the latest security regulations and recommendations. Finally, eTip plans to provide even greater peace of mind to our customers with the completion of a SOC 2 Type 2 audit (the next stage in the SOC audit sequence) just around the corner. Connect with A Trusted Partner for Your Digital Tipping Needs We are excited to continue ensuring the highest standards of trust and security for our customers. Thank you to all of our customers who continue to trust us to help them build trust! Are you looking to implement digital tipping at your business? Schedule your personalized demo to get started today. Posts navigation ← Game-changing technology at AAHOACON 2022Wishing The US’s Two Million Hotel Workers Happy National Hotel Employee Day → Join the eTip community! We'll send the latest content & special releases directly to your inbox. hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" }); Ready to join the community? Receive the latest & greatest content from eTip, sent directly to your preferred inbox! hbspt.forms.create({ portalId: "6775923", formId: "f33e92c4-1177-42a9-b1e1-5f70e7a5f127" });'''
