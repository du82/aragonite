["https://etip.io/faqs"]
title = "Questions About eTip Tipping App - eTip.io"
description = "Whether you're using eTip already, or would like to learn more before getting started - we've compiled frequently asked questions for you."
full_description = "Frequently Asked Questions For individuals How do I set up my eTip account? You can set up your eTip account by signing up here. How long is my QR code valid? Your QR code does not expire. How can I promote my virtual tip jar? As an individual, you can promote your virtual tip jar by sharing it on your social media sending a link to your profile via SMS displaying your QR code on live-stream performances printing your profile card Where do I enter my bank account information? Once you receive your first tip, you will receive an email on how to set up direct deposits to your bank account. How can I withdraw the money collected by my virtual tip jar? Tips will be deposited directly to your bank account. How can I find how much money I have in my account? You receive a SMS message every time someone tips you. You can also email us at contact@etip.io to know how much money you have in your account We're currently building an eTip mobile app, where you can view your balance in real-time. I do not have a bank account. Can I still use eTip’s Virtual Tip Jar? Yes! How quickly will I receive my money? We’re working to get the money to you immediately. As of now, we will send you direct deposits. Please note, it may take 1-5 business days for the funds to clear your account after we make the direct deposit. How can my customers tip or pay me? Your customers can tip you by simply: scanning the QR code with their phone’s camera tapping the banner on the screen tipping using their credit/debit card, Apple or Google Pay. How long does my account take to get approved? Due to high demand, account approval can take up to 36 hours. What personal information can my customers see? Customers can only see your: first name initial of your last name profile photo personal description you have provided How safe is my personal information on the platform? We take your security very seriously - We protect your information through state-of-the-art Secure Socket Layer (SSL) technology. Please see the Privacy Policy for more information. How can I change my picture or details on my virtual tip jar profile? Please email us at contact@etip.io and we will make changes to your virtual tip jar profile! Do my customers need an app to tip me? No, not at all! No app or download required to tip. Your customers can tip you by simply: scanning the QR code with their phone’s camera tapping the banner on the screen tipping using their credit/debit card, Apple or Google Pay. How do I know if someone has tipped me? You will receive a text message with the amount every time someone tips you. Do I need to report taxes on tips received through eTip? All tips are considered as reportable income. Please consult with your tax advisor for any tax-related advice. For IRS resources, click here. For form 4137 resources, click here. How can I contact the eTip team? You can contact us by visiting our contact page chatting with us on WhatsApp emailing contact@etip.io For businesses How does eTip work? eTip allows your staff to receive cashless tips from your guests. Guests can simply scan the QR code associated with your staff to tip, rate and review their service. How much will eTip cost my business? Please contact our sales team to provide you customized pricing for your business. How do I set up eTip for my business? Please contact our sales team to get you immediately set up with eTip. How long are my employees’ QR codes valid? Your employee QR codes are active until you deactivate them. How can I contact the eTip team? You can contact us by visiting our contact page chatting with us on WhatsApp emailing contact@etip.io reaching out directly to your account manager Do my customers need to download an app to tip? No, guests do not need to download any app to tip. They simply need to: open their phone’s camera to scan the QR code choose the tip amount tip, rate and review the service using their credit card What happens if an employee leaves my company? Please email us at contact@etip.io and we will deactivate their account right away. If it is a pooled QR code, then we will remove them from the pooled tips moving forward. Otherwise, the individual’s QR code is deactivated moving forward. Alternatively, deactivate the employees via the merchant dashboard.* How can I add a new employee on eTip? Yes, please email us at contact@etip.io with the new employee’s details (name, email, phone number & profile picture). Alternatively, create new employee profiles via the merchant dashboard.* Is there a place where I can see my employee tips, ratings & reviews? We provide a monthly report that contains tips, ratings and reviews collected by each employee. Alternatively, access all of your data via the merchant dashboard.* How will my employees know that they’ve received a tip? The employees will receive a text message every time they have received a tip. In a pooled tip system, the owner of the account will receive the text message for the tips. How often will my staff receive their tips? We’re on our way to instant tips! Will the tips go directly to the employee, or will they come to us? For individual tips, we send all the tips directly to your employees. For pooled tips, you have the option to either receive the tips yourself and distribute it, or have us equally distribute it to all your employees. Some of my employees do not have a bank account, can they still use eTip? Yes! Who handles the tax compliance? Do I need to do any work? All tips are considered as reportable income. Please consult with your tax advisor for any tax-related advice. For IRS resources, click here. My employees do not like to pay taxes on tips. How should I encourage use of eTip at my property? The world is becoming increasingly cashless, especially after the pandemic. This means that guests are carrying less and less cash to tip, leading to loss of tip income for hourly staff workers. Employees should know that we are not replacing cash tips, we are providing additional tipping opportunities as many customers do not carry cash. Benefits of reporting taxes: Increased reported income: Get better rates for loans, mortgages Mitigate tax risk: Upon IRS audit, one can be charged with significant penalties on underreporting/not reporting tips Where can I display the QR code? Your QR codes can be displayed wherever you like, including: on business cards on social media channels sent via SMS or email added to receipts or invoices displayed at front desks What happens if a guest accidentally gives a wrong tip amount? Do they contact you or us? We will work with them to ensure that their query is resolved. In such a situation, please encourage them to contact us directly at contact@etip.io, or call us."
