title = "mydlink Smart Home automation | D-Link"
description = "Experience your new smart home.  Use the free mydlink™ app to control smart home gadgets from your phone or tablet to work for you. Turn devices on and off, group, schedule, automate, and save security camera footage to the cloud. Use with Google Assistant, Alexa, and IFTTT for even smarter controls."
