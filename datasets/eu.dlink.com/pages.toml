margin-left: 10px; padding-top: 5px; padding-bottom: 15px; } .TextAndMedia-accordionItemHeader-6 { gap: 10px; cursor: pointer; display: flex; padding-top: 10px; padding-left: 10px; padding-right: 10px; } .with-icon .TextAndMedia-accordionItemHeader-6::before { display: none; } .TextAndMedia-accordionItemContent-7 { color: #707070; height: 0; display: block; overflow: hidden; box-sizing: border-box; margin-left: 60px; border-bottom: 1px solid #707070; } .TextAndMedia-accordionItemContent-7.open { height: auto; } .TextAndMedia-accordionItemContentInside-8 { padding-right: 10px; padding-bottom: 10px; } .sceneWrapper-0-2-16 { } .sceneWrapper-d0-0-2-17 { padding-top: 0; paddingight: 0; padding-left: 0; padding-bottom: 0; } 1987 D-Link (Datex) releases its first Ethernet Adapter for the PC, the DE-001. 1988 D-Link (Datex) releases the industry's first peer-to-peer LANSmart Network Operating System. 1989 D-Link (Datex) sets up its European subsidiary, firmly establishing its foothold in North American and European markets. The company successfully designs and mass produces its own Ethernet controller chips, reducing the cost of key electronic components. 1990 D-Link (Datex) introduces its first 10BASE-T Ethernet Hub, one of the earliest devices to adopt the now-standard twisted-pair network cable. 1992 Datex Systems, Inc. is renamed D-Link Corporation The company releases the DE-5000, its first enterprise-class chassis-based network switch, its first SNMP standard management software called D-View Network Management Program and is among the industry’s first to introduce a zero-configuration jumper-less network adapter, the DE-220CT. 1993 D-Link’s industry-first PCMCIA Ethernet Adapter for laptop PC wins a Quality and Innovative Product Award (Taiwan) 1994 Dataquest ranks D-Link the global leader in unmanaged Ethernet hubs in terms of port shipments. D-Link becomes Taiwan's first networking company with a Taiwan Stock Exchange IPO. Global reach increases with the opening of D-Link International Pte. Ltd. in Singapore to develop worldwide business beyond Europe, U.S.A., and Greater China. D-Link releases fault-tolerant high-bandwidth fiber-optics FDDI concentrator. 1995 D-Link releases its first dual-speed 10/100Mbps Fast Ethernet Adapter. D-Link releases its first Ethernet switches, the DES-604 and DES-608. 1996 D-Link releases its first managed Ethernet Switch, the DES-3205. Later that year would follow its first router, the DE-1150 and the world's first Fast Ethernet Switch with ISDN Remote Router in stackable box. 1998 D-Link is listed among Forbes's 300 companies. 2000 D-Link sets up R&D centre in India to focus on e-commerce, VoIP and future products. 2001 D-Link is among the first to release new standard IEEE 802.11a 5GHz Wireless LAN products. 2002 BusinessWeek Magazine lists D-Link among the Annual Global Top 100 Information Tech companies. D-Link and Texas Instruments enter into extensive collaboration for Wireless LAN products. 2003 D-Link's R&D and manufacturing arm spins off as an independent company named Alpha Networks Inc. 2004 D-Link is listed among Taiwan's Top 10 International Brands with a product brand value worth NTD 720 million. The company introduces its First Gigabit Gaming Router, the DGL-4300, is introduced and subsequently goes on to win more than 25 awards. D-Link is ranked #1 in SMB networking connectivity according to The Synergy Research Group. 2006 D-Link DI-524, DI-624, and DI-784 home routers receive IPv6 Ready certification from the IPv6 Forum. 2007 D-Link becomes the first company in the networking industry to introduce Green Ethernet technology in its Gigabit switches. D-Link global consolidated revenues hit USD 1 billion and is ranked as the 6th most valuable Taiwan Global Brand, with a brand value of USD 347 million. 2009 D-Link receives the Outstanding Innovation Award for Industrial Technology Advancement from the Ministry of Economic Affairs, R.O.C. D-Link's xStack DGS-3400 series, xStack DES-3528/52 series, DGS-3610 chassis series, and DES-7200 chassis series switches receive IPv6 Ready Certification from the IPv6 Forum. 2010 D-Link launches the first Boxee HD Media Player; the Boxee Box by D-Link. D-Link ranks #1 in Small to Large Enterprise WLAN Stand-Alone Access Points by units shipped. 2011 D-Link introduces revolutionary mydlink Cloud Services, launches first Cloud Router, Cloud Camera, and Cloud Storage. D-Link shrinks the size of powerline interrnet range extenders, introducing the DHP-310AV Mini Adapter. 2012 D-Link rolls out first 4G LTE with Cloud Solutions for service providers and consumers. D-Link announces Zero Configuration capability for all new Cloud Routers and Cloud Cameras; adds support for select current Cloud Routers. D-Link supports World IPv6 Launch with over thirty IPv6 Ready products, including world’s first IPv6 Ready PowerLine AP and router. 2012 D-Link enters 11AC market with first complete 11AC line-up of routers. D-Link introduces world’s first tower shaped 11AC routers (DIR-868L, DIR-860L, DIR-850L, DIR-820L). 2013 D-Link’s family of Cloud Solutions gains a new category, Cloud Access Points, with the release of the DAP-1160L Wireless N 150 Cloud Access Point. D-Link launches the world’s first 11AC portable router DIR-510L. 2013 D-Link launches its first LTE Cat 4 Router. 2014 D-Link introduces the concept of “Get Your Home Talking,” launching a series of Connected Home products, including Wi-Fi Camera, Wi-Fi Smart Plug, Wi-Fi Motion Sensor, all of which can be controlled by mydlink™ Home App to create a smart home life. 2015 D-Link announces world’s first 180° Wide Eye consumer Wi-Fi camera: DCS-960L and DCS-2630L The company also announces first orb-shaped and USB 3.0 wireless adaptor DWA-192 AC1900 Wi-Fi USB adapter. 2016 D-Link announces the EXO Router Series in an orange housing with a focus on the antenna design and power. 2017 D-Link Unveils First Apple HomeKit Enabled Camera at CES 2018 D-Link launches new Industrial Gigabit Switches for Smart City, Factory Automation and Industry 4.0 applications. 2018 D-Link introduces Covr - the next generation of Whole Home Wi-Fi. 2024D-Link Won the ‘Taiwan Excellence Award 2024’ and the ‘Good Design Award’ 2023 for the M30 AQUILA PRO AI AX3000 Smart Mesh Router. window.addEventListener('DOMContentLoaded', function() {ReactDOM.hydrate(React.createElement(Generic.TextAndMedia, {"isNarrowContainer":false,"isFullWidthContainer":false,"backgroundImageUrl":null,"backgroundVideoUrl":"","gridCssClasses":"grid__col grid__col--12 grid__col--md-6 grid__col--center","showMedia":true,"responsiveLayoutOverride":true,"isMediaFirst":true,"isVideo":false,"isHTML5Media":false,"isImage":true,"mediaAlign":"left","imageUrl":"/us/en/-/media/product-pages/m/30/m30cleanfront2.png","htmlFiveMedia":"","loopHTML5Media":false,"autoplayHTML5Media":false,"videoFitHeight":false,"restrictedHeight":false,"videoUrl":null,"videoTitle":null,"videoImageUrl":null,"imageEditable":"\u003cimg src=\u0022/us/en/-/media/product-pages/m/30/m30cleanfront2.png?h=820\u0026amp;w=1000\u0026amp;la=en-US\u0026amp;hash=329238459B8AB74E2D35AE10A0B484DC\u0022 class=\u0022image--ignore-attribute\u0022 style=\u0022\u0022 alt=\u0022\u0022 /\u003e","overlapseHeroModule":false,"imageOffsetX":null,"imageOffsetY":null,"snapMediaTo":"","backgroundHorizontalAlign":"center","backgroundVerticalAlign":"top","textAlign":"left","hasWrapperAlign":false,"isFullWidthText":false,"buttonLink":{"linkUrl":null,"linkText":null,"cssStyleClass":null,"cssBorderClass":null,"afterIcon":null,"beforeIcon":null,"trackCode":null},"accordion":{"fields":[]},"sectionClass":"section section--no-padding","sectionId":"Last","title":"2024","subTitle":"D-Link Won the ‘Taiwan Excellence Award 2024’ and the ‘Good Design Award’ 2023 for the M30 AQUILA PRO AI AX3000 Smart Mesh Router.","body":"","hasDataSource":false,"hasTitle":false,"hasSubTitle":false,"dataSourceShortId":null,"isExperienceEditor":false}), document.getElementById("