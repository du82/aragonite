title = "Privacy Policy  | D-Link"
full_description = '''.theme--havelock-blue ::selection { background-color: #00deff; } h1 { color: #5aa9db; } h2 { color: #5aa9db; } .bg--screen--white { background: rgba(255,255,255,.7); width: 100%; padding:20px; } .bg--screen--white&gt;div { background-color: #fff; max-width: inherit!important; margin: auto; } .txt--c { text-align: center!important; } .theme--havelock-blue .theme__txt { color: #5aa9db; } .l-mgn--t-30 { margin-top: 30px!important; } p{ line-height: 2.3; } @media (min-width: 1025px){ .bg--screen--white&gt;div { padding: 60px; margin: 20px; } Privacy Policy .PrivacyCont { color: #454545; font-size: .94rem; line-height: 2.3em; } .PrivacyCont p+h1, .PrivacyCont ul+h1, .PrivacyCont ol+h1, .PrivacyCont p+h2, .PrivacyCont ul+h2, .PrivacyCont ol+h2, .PrivacyCont p+h3, .PrivacyCont ul+h3, .PrivacyCont ol+h3, .PrivacyCont p+h4, .PrivacyCont ul+h4, .PrivacyCont ol+h4, .PrivacyCont p+h5, .PrivacyCont ul+h5, .PrivacyCont ol+h5, .PrivacyCont p+h6, .PrivacyCont ul+h6, .PrivacyCont ol+h6 { margin-top: 2em; } .PrivacyCont h1, .PrivacyCont h2, .PrivacyCont h3, .PrivacyCont h4, .PrivacyCont h5, .PrivacyCont h6 { margin-bottom: 0.45em; } .section_h2 { font-weight: 200; margin-top: 40px; font-family: &#x27;roboto light&#x27;, sans-serif, &quot;Verdana&quot;, &quot;Avenir&quot; !important; font-weight: bold; color: #5aa9db; } .section_h3 { font-size: 2rem !important; margin-top: 30px; font-family: &#x27;Roboto Medium&#x27;, sans-serif, &quot;Verdana&quot;, &quot;Avenir&quot; !important; font-weight: bold !important; } .section_h4 { font-size: 1.5rem !important; margin-top: 20px; font-family: &#x27;Roboto Medium&#x27;, sans-serif, &quot;Verdana&quot;, &quot;Avenir&quot; !important; font-weight: bold !important; text-transform: initial !important; letter-spacing: 0 !important; } .section_h5 { font-size: 1.3rem !important; margin-top: 20px; font-family: &#x27;Roboto Medium&#x27;, sans-serif, &quot;Verdana&quot;, &quot;Avenir&quot; !important; font-weight: bold !important; } .PrivacyCont p { font-size: 1.5rem; padding: 10px 0 !important; margin-bottom: 1em; line-height: 2em; } .PrivacyCont hr { width: 100%; background: #d1d1d1; display: block; margin: 15px 0; height: 1px; text-align: left; display: block; border: none; } .mar_ul_l { margin-top: 10px; margin-bottom: 10px; margin-left: 25px; line-height: 2; } .mar_ul_disc { list-style-type: disc; } .lineHeight_d { line-height: 1.7; } .li_italic { font-style: italic; } .li_normal { font-style: normal; } .font_bold { font-weight: bold; } .font_normal { font-weight: normal; font-size: .94rem; font-family: &#x27;Roboto&#x27;, sans-serif, &quot;Verdana&quot;, &quot;Avenir&quot; !important; } li{ margin: 0px !important; } D-Link Systems, Inc. and its family of companies (alternatively referred to herein as "D-Link", "we", “our” or "us") are committed to protecting the privacy of any user (alternatively referred to as "you", "user" or "customer") of certain D-Link site, app and services (collectively "Services") or certain D-Link products ("Products"). We recognize that the trust placed in us by you requires comprehensive and responsible privacy protections, and we are therefore committed to providing you with a positive, easy, and more secure online experience.We recognize the need to maintain the confidentiality of information that you reasonably expect to remain private. You expect, deserve and receive nothing less than our fullest commitment to this goal. We also have an obligation to assist law enforcement and other government agencies responsible for protecting the public welfare, whether it be an individual or the security interests of the entire nation. If and when we are asked to help, we do so strictly within the scope of law and under the most stringent conditions.This D-Link privacy policy (referred to herein as "Privacy Policy” or "Policy") addresses the privacy of customers domestically and overseas. Where applicable, D-Link will comply with laws that contain requirements that differ from this Policy. IN CERTAIN JURISDICTIONS, D-LINK SHALL ADOPT A SEPARATE PRIVACY POLICY TO REFLECT THE REQUIREMENTS OF APPLICABLE LOCAL LAWS.Our Privacy Policy Explained1. What information is collected or processed?Any information you submit due to the use, purchase, subscription, license request, registration of or for any of the Services or Products may be collected or processed within the scope of and in accordance with specific lawful requirements. In order to better define the type of such information, we have identified and grouped it into three categories: a) Personal information; b) General non-specific and demographic information; and c) Customer proprietary network informationPersonal InformationWe collect your personal information including information you give us, information collected as a result of your relationship with us and information we may obtain from other sources. Personal information, as defined by this Privacy Policy, is any information that can be used to identify you personally, such as name, address, telephone number, email address, and other information required to provide Services, deliver Products, provide customer support or secure your right of the above. We may process your personal information only to the extent that such is necessary to perform a contract or deliver Services, for the purposes of legitimate interests, or you have given consent to the processing for one or more specific purposes.General Non-Specific and Demographic InformationAny non-personal information either entered by you or recorded as part of the transaction process is considered to be general non-specific and demographic information. This is information that does not contain personal information, and may include experience with Products such as the type and quantities of Products purchased, your web browser and operating system types, the identity of the web page from which your browser entered our site, and any other demographic information such as title, educational and employment background, professional interests, which does not specifically identify any one individual. Such information is typically collected by the use of cookies, web logs, and web beacons.We may collect web usage information, such as the pages you visit on our sites, your Internet Protocol (IP) address, behavior (i.e. the pages you view, the links you click, the amount of time you spend on such pages, and whether you re-visit our sites or pages and other actions you take in connection with D-Link sites) and Product information. Such information may be tracked by recording the Uniform Resource Locator (URL), as well as your computer's IP address.Customer Proprietary Network InformationShould we provide Services to you in telecommunications form, we may collect and maintain certain customer proprietary network information ("CPNI"). Your CPNI may include the types of Services you receive, usage information, user IDs and passwords, billing and transaction information.Product Specific Information CollectedThe evolution of Products and Services will necessitate the collection of more information. Each Product or type of Services will require specific information to be collected in support of the Product features and in order to continue to provide you with the best experience possible. Each Product or type of Services may collect some or all of the following:Information provided by you during the setup or installation processSound and image recognition, including but not limited to voice, noise and faceEnvironmental data, including but not limited to temperature, ambient light, humidity, CO2 levels, precipitation, moisture, noise decibels and motion from the Product sensorsYour preferred settings for Products or Services, including but not limited to room and product temperature, scheduling, alerts and notificationsUtilities usage dataTechnical information from the ProductAudio and video signals and dataInformation provided by you during the setup or installation process: When you install a Product or type of Services, you may be asked your Product name and its location within the premises, to better help you identify the Product when accessing it through a remote device. Additionally, you will need to provide your SSID (Wi-Fi network name) and password so that the Product can connect to the Internet.Sound and Image: Certain Products may contain sensors and software that is capable of detecting voice commands, detecting different sounds, like glass breaking or smoke/fire alarms, as well as recognizing certain facial features. Such features may be used to allow your Products to interact with other products or provide a better user experience.Environmental data: Sensors may be built into Products that allow us to collect data such as temperature, ambient light, humidity, CO2 levels, precipitation, moisture, noise decibels and motion from the Products. By collecting this data, Products can take actions like turning on lights if motion is detected.Your preferred settings for Products or Services: By collecting this information, D-Link can better understand customer usage of features and improve the overall customer experience.Utilities usage data: In an effort to help you conserve energy, Products may collect information including duration of device usage, water consumption, utilization of power saving modes, and moisture levels so that we can provide you the relevant data to better help you conserve resources.Technical information from the Product: D-Link strives to improve upon your experience. By collecting technical information we are better able to troubleshoot problems. Some of the information we gather is model and serial number, software version, and technical information such as signal strength, sensor status, and remaining battery life.Audio and video signals and data: Some Products provide you with the ability to record or stream audio and video. Depending upon your personal configuration and settings, D-Link may capture the audio and video recordings from the Products in order to email clips or sections of this data in support of motion detection or other notification events. Furthermore, if you have enabled cloud recording, we will collect and store the audio and video data from your device for the applicable period supported by your Product.Privacy and data protection laws vary by jurisdiction and yours may impose certain responsibilities on your use of our Products and Services. You, not D-Link, are responsible for ensuring compliance with any applicable laws when you use our Products and Services. For example, some jurisdictions may require you to obtain prior consent before recording or sharing audio or video of a third party.2. What do we use the information for?In order to provide you with the best online experience possible, we collect both your personal and non-personal information to give us a better understanding of the demographic and geographic profile. The information we collect is reviewed closely to assist us in determining the most popular Products or Services of interest to you, update you on our new Services and benefits, to personalize Services for you and to better design D-Link Products and Services) to suit your needs.By tracking your IP address through our Services, we can better understand the types of products, services and information that are relevant to you, and may from time to time use this information to provide you with information or promotions that match your various geographical and demographic dynamics.From time to time, we may send surveys to you via email or online through our Services in order to solicit feedback on improvements we should make to our Products and Services. These surveys are completed on a voluntary basis and personal and general information are not required. Refusal to complete any survey or poll will not result in any penalization of the customer standings with our organization. Should you not wish to receive notification of subsequent surveys or polls, you can click the link supplied at the bottom of every promotional email we send you to request that you not receive such notifications in the future.We may also run contests or sweepstakes at different times. By entering the sweepstakes you agree to disclose your personal information for our use in future marketing campaigns. Your consent for our use of your information may be a condition of your participation and eligibility for any such contest or sweepstakes.In some cases we may combine web usage information related to your access to our Services with personal information. We use the combined information to provide customers with a better experience by providing customized features, Services, and advertising. Once combined, the resulting data is protected as personal information as described in this Policy.We may occasionally provide you with the ability to create personal profile areas and view protected content. Your personal and other information may be required for such purposes.Additional ways in which we may use your personal and other information include: exchanging information for purposes of accepting customer feedback and providing support, allowing you to forward information to another individual such as a friend or co-worker, and meeting contractual obligations. We will send your friend a one-time email inviting them to access our Services. D-Link stores this information which is only used for the sole purpose of sending this one-time email or tracking the success of our referral program. Your friend may contact us at the contact information listed below to request that we remove this information from our database.Should you contact us via the “Contact Us” page on our site, or via email, telephone or written correspondence, we may keep your comments on file for future use in our contact database.D-Link or our service providers may collect, process and store your personal information in locations outside your home country where our servers reside. Privacy and data protections and regulations in other countries, including the rights of the authorities to gain access of your personal information, may not be equivalent to those in your country. If you are using our Products or Services in the European Union or other regions with laws governing data collection and use that may differ from the laws where your data is collected, processed and stored, you agree to the transfer of personal information to the country where we operate or locate our servers.3. How do we share your Information?Your personal information will not be sold, traded, or rented to third-parties unless you grant us permission to do so and except as otherwise stated in this Policy.We may share your personal information within D-Link for purposes of data processing or storage according to the law. We may also provide personal information to trusted partners who are acting on behalf of or with D-Link under confidentiality agreements and in a'''
