mers' networks. You also agree to be careful with this D-Link information and to only disclose it within your company to employees with a "need to know" who are instructed and agree not to disclose the information and not to use the information for any purpose not permitted by this agreement. You will not alter, decompile, disassemble, reverse engineer, or modify any D-Link confidential and proprietary information that you receive. Unless otherwise stated, any information you provide at the D-Link website shall be deemed to be non-confidential and D-Link will have no obligation to protect such information from disclosure or use and may use such information in any way it chooses.Registration ObligationsYou may be assigned a D-Link account when you are registering to use the Services. You shall promptly activate your D-Link account from the date it is assigned or created, or D-Link may remove or disallow the account. Your D-Link account may be consolidated in the event you are using multiple D-Link apps or services, and we may migrate your information to the consolidated account. You may need to provide certain required personal information and proceed with related verifications, as may be required by the communication regulations and statutes of different countries. You agree that you are at least 18 years old and/or you are of legal age to enter a contract in your country. You agree to (i) provide true, accurate, up to date and complete information about yourself, (ii) complete additional verification of your personal information as may be required and, (iii) maintain and promptly update your registration data to keep it true, accurate, up to date and complete. D-Link has the right to contact you directly to provide assistance should you encounter problems using our products or Services. You acknowledge that accurate information is very important for us to resolve your problems and improve our Services. You shall bear all responsibility and liability that may arise from your failure to provide true, accurate, up to date and complete information, and to maintain and promptly update such information. If you provide any information that is, or we have reasonable grounds to believe is, untrue, inaccurate, misleading, outdated or incomplete, we may suspend or terminate your account or Services to you, or any portion thereof. Account, Password and Security If you use any part of the Services that requires a login email or password, you shall be responsible for maintaining the confidentiality of such email and password and for restricting access to your computer, and you agree that you are solely responsible for any liability or damages resulting from your failure to maintain that confidentiality, and for all activities that occur under your account or password. You agree to (i) immediately notify D-Link of any unauthorized use of your account or password or any other breach of security, and (ii) ensure that you exit from your account at the end of each session of Services. D-Link reserves the right to take any action, as deemed necessary or reasonable, to ensure the security of your account and the Services, including, without limitation, suspending or terminating your account, changing your password, or requesting additional information to authorize transactions on your account. D-Link will not be liable for any loss or damage arising from your failure to comply with this section. Products and ServicesWe are devoted to providing the best products and Services for customers. To allow us to provide them with high quality and dependability, the firmware of your devices may be upgraded automatically through the Internet without any advance notification. As part of this process, we will use all reasonable efforts to minimize disruptions to your use of and access to our Services to the greatest extent possible. YOU HEREBY CONSENT TO AUTOMATIC SOFTWARE UPDATES OF THE SERVICES AND OF THE PRODUCTS CONNECTED TO THE SERVICES. YOU FURTHER ACKNOWLEDGE THAT IF YOU DISABLE THE AUTOMATIC SOFTWARE UPGRADE FUNCTION, THE PERFORMANCE, SECURITY AND AVAILABILITY OF CERTAIN FEATURES OF PRODUCTS AND SERVICES MAY BE IMPACTED. To the greatest extent permitted by governing law, D-Link may, solely at its discretion and without notice, modify, add, or remove features, services and functionality of the products or Services. D-Link is under no obligation to provide any or all features, services and functionality for the products or Services and may, at its sole discretion, discontinue the provision of software updates to certain products or Services.Usage and Limitations (i) Lawful purposes only. You may use our Services and your device only for purposes and in ways that are lawful, proper and appropriate. (ii) Monitoring. We may monitor the use of our Services for violations of the Terms of Use. We may remove or block all communications if we suspect any violation, or if we think it necessary in order to protect our Services, or D-Link, its parent, affiliates, directors, officers, agents, and employees from harm. (iii) Providing information to the authorities and third parties. If we believe that you have used our services or your device for an unlawful purpose, we may forward the relevant communications and other information, including your identity, to the appropriate authorities for investigation and prosecution. You consent to our forwarding of any such communications and information to these authorities. In addition, we may disclose your name, telephone number, credit card information, and other personal information, any communications sent or received by you, and any other information that we may have about your account, including but not limited to, the type of service, length of service, MAC address, IP address, email address, and all other account information, as follows: 1. in response to law enforcement or other governmental agency requests; 2. as required by law, regulation, rule, subpoena, search warrant, or 