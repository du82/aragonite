description = "D-Link’s Industrial Switches have industrial-grade resilience to maintain your network uptime despite extreme hot and cold temperature variances. With Gigabit Ethernet, rapid failover, powerful security, and certifications for vibration, shock, and free-fall, these rugged switches protect your network."
