title = "Warranty Information | D-Link"
full_description = "Warranty Information The warranty period stated in this table supersedes and replaces the warranty period as stated in the user’s manual for the relevant products. Once the warranty terms have expired, D-Link will no longer offer Help Desk support on the product. During the warranty period D-Link will replace your product with a replacement of equivalent or better functionality. The replacement product is covered by the remaining warranty time, from the original product. The replacement may include the use of functionally equivalent of refurbished units. Replaced parts will become the property of D-Link. Warranty does not cover damage caused by physical abuse, accident, natural disaster, or use which is different from the D-Link's advice and instructions. Warranty is valid only if the original receipt is issued by an authorized reseller. Provided information must contain: place of purchase, date of purchase, and model number of product. D-Link reserves the right to refuse warranty service if this information has been removed, altered or is missing since the product was first purchased from a reseller. The information contained herein is subject to change without notice. Product Type Product Warranty Period WIRELESS ROUTERS, DSL MODEM ROUTERS, ADAPTERS, ACCESS POINTS & ANTENNAS/CABLES WHOLE HOME Wi-Fi SOLUTION EAGLE PRO AI SMART HOME- CAMERAS, SMART PLUG, ACCESSORIES DIGITAL HOME - POWERLINE (HOME PLUG) PERIPHERALS - USB UNMANAGED SWITCHES* SWITCH ACCESSORIES - MODULES, GBIC & MINI-GBIC TRANSCEIVERS,CABLE, REDUNDANT POWER SUPPLY VIDEO SURVEILLANCE CAMERAS, ENCLOSURES & ACCESSORIES MEDIA CONVERTERS NETWORK ADAPTERS - FAST ETHERNET, GIGABIT, FIBER ACCESSORIES - EXTERNAL POWER ADAPTERS, PoE ADAPTERS DLINKGO 2 YEARS D-Link M2M Mobile Products 3 YEARS INDUSTRIAL SWITCHES UNMANAGED SWITCHES** 5 YEARS NETWORK SECURITY – VPN ROUTERS, UNIFIED SERVICE ROUTERS ENTERPRISE WIRELESS SOLUTIONS*** xSTack MANAGED SWITCHES**** METRO ETHERNET SWITCHES SMB MANAGED SWITCHES SMART SWITCHES LL *Excluding: DES-105, DES-108, DGS-105, DGS-108, DGS-105GL, DGS-108GL, DMS-106XT that have 5 years **Excluding: DES-1005D, DES-1005P, DES-1008D, DES-1008PA, DES-1016D, DES-1024D, DSS-100E-9P, DSS-100E-18P, DGS-1005D, DGS-1005P, DGS-1008D, DGS-1008P, DGS-1008MP, DGS-1016D, DGS-1016S, DGS-1024D, DGS-1026MP, DPE-101GI, DPE-301GI, DPE-301GS, DPE-302GE ***Excluding: DAP-2020 ****Excluding: DXS-PWR300AC, DXS-PWR700AC Note: Limited Lifetime Warranty on all products in the table above available for products purchased after 1 July 2009 REGISTERING FOR LIMITED LIFETIME WARRANTY: In order to qualify for the Limited Lifetime Warranty, all eligible products must be registered with D-Link Europe within thirty (30) days of purchase. Otherwise the product warranty will be 5 years. Registration can be done through our Self Service Portal. For full warranty information please download Warranty Information and WEEE (PDF). For D-Link's End-Of-Life Policy click here."
