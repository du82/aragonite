  3D Printing Toys





















  
  






  zBrush 3D Modeling / Elegoo Mars 2 Printer / Toy Design





















  
  






  As a lifelong toy enthusiast, I have always been fascinated by the creative process of bringing characters to life.  As a kid, I would manipulate existing toys to make my own, custom creations. I dreamed of having my own figures of Mega Man or a Shy Guy from Super Mario, but would often have to create them from scratch using super glue and paint. This early interest in toy design eventually led me to explore the world of 3D printing, which offered even more opportunities to create unique, one-of-a-kind objects. I used platforms like Shapeways to experiment with different materials like metal or full color printing. I later invested a resin printer and fell in love with the hands-on process of creating things in the real world. Today, my passion for 3D printing and toy design continues to drive me, and I take great pride in creating unique character toys. Whether I am creating a commissioned piece or a personal project, my goal is always to push the boundaries of what is possible with 3D printing, and to create something truly special and memorable.





















  
  






  

  



    
    
    
