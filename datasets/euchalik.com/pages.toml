ker interactions within digital playgrounds. My work extended beyond design; I animated and illustrated all interactive game screens, ensuring that every aspect of the interface was engaging, functional, and visually appealing for young users. .fe-65b02b3f72040f25eeece621 { --grid-gutter: calc(var(--sqs-mobile-site-gutter, 6vw) - 11.0px); --cell-max-width: calc( ( var(--sqs-site-max-width, 1500px) - (11.0px * (8 - 1)) ) / 8 ); display: grid; position: relative; grid-area: 1/1/-1/-1; grid-template-rows: repeat(21,minmax(24px, auto)); grid-template-columns: minmax(var(--grid-gutter), 1fr) repeat(8, minmax(0, var(--cell-max-width))) minmax(var(--grid-gutter), 1fr); row-gap: 11.0px; column-gap: 11.0px; } @media (min-width: 768px) { .background-width--inset .fe-65b02b3f72040f25eeece621 { --inset-padding: calc(var(--sqs-site-gutter) * 2); } .fe-65b02b3f72040f25eeece621 { --grid-gutter: calc(var(--sqs-site-gutter, 4vw) - 11.0px); --cell-max-width: calc( ( var(--sqs-site-max-width, 1500px) - (11.0px * (24 - 1)) ) / 24 ); --inset-padding: 0vw; --row-height-scaling-factor: 0.0215; --container-width: min(var(--sqs-site-max-width, 1500px), calc(100vw - var(--sqs-site-gutter, 4vw) * 2 - var(--inset-padding) )); grid-template-rows: repeat(24,minmax(calc(var(--container-width) * var(--row-height-scaling-factor)), auto)); grid-template-columns: minmax(var(--grid-gutter), 1fr) repeat(24, minmax(0, var(--cell-max-width))) minmax(var(--grid-gutter), 1fr); } } .fe-block-6ccba356ed71aa275343 { grid-area: 1/2/7/10; z-index: 7; @media (max-width: 767px) { } } .fe-block-6ccba356ed71aa275343 .sqs-block { justify-content: center; } .fe-block-6ccba356ed71aa275343 .sqs-block-alignment-wrapper { align-items: center; } @media (min-width: 768px) { .fe-block-6ccba356ed71aa275343 { grid-area: 1/6/16/22; z-index: 7; } .fe-block-6ccba356ed71aa275343 .sqs-block { justify-content: center; } .fe-block-6ccba356ed71aa275343 .sqs-block-alignment-wrapper { align-items: center; } } .fe-block-47f2bdeea5e4c854