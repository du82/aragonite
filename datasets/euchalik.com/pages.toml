  Osmo World - Game Launcher





















  
  






  APP LAUNCHED 2017-2020UX UI DESIGNER / PLAY DESIGNER / ARTIST





















  
  






  As a UI/UX Designer and Play Designer, I had the unique opportunity to work on Osmo World, an interactive game hub and launcher that served as the starting point for the entire Osmo gaming experience. In my role, I was responsible for the visual UI and co-created hundreds of sticker interactions within digital playgrounds. My work extended beyond design; I animated and illustrated all interactive game screens, ensuring that every aspect of the interface was engaging, functional, and visually appealing for young users.





















  
  




  
  
  


  


  
  



    
  
                    

