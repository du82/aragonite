  Game DesignThe initial game concept was co-designed with Felix Hu, Ariel Zekelman, Frances Judd and Michael Horn as a game called "Strawbies." It was acquired by Osmo in 2016, redesigned, and commercially launched on iOS and Amazon Fire.





















  
  














































  

              
            
                                                                                            
                                                                
