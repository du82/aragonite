  A Character Design StudioShawnimals was a designer toy studio that specialized in character-branded toys. For over 5 years I was responsible for design, print, and marketing content. The projects ranged from illustration, to packaging and toy tags, to toy design, to company branding. I refined the iconic style of the 400+ characters while working on multiple product lines to expand the universe through mobile games, toy subscriptions, and online content.





















  
  




  
  
  


  


  
  



    
  
                            


  

  
    
                            

