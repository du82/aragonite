  Osmo Coding Starter Kit





















  
  






  KIT LAUNCHED 2020PRODUCT LEAD / PLAY DESIGNER / ARTIST





















  
  






  Coding is an abstract concept. With over 30 years of research supporting the use of tangibles, Osmo Coding blends hands-on play with games as the best way to introduce coding to young kids.





















  
  






  What I Did





















  
  






  As product lead, I led a team in relaunching the suite of Osmo Coding games (Coding Awbie, Coding Jam, and Coding Duo) into a new retail Starter Kit. I set and maintained product and design goals to improve game play; and directed animation, UX, and UI improvements.I created visual branding, digital ads for retail, and package design.





















  
  




  
  
  


  


  
  



    
  
                    

