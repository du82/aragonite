  Coding Adventure GameOsmo Coding Awbie is the first tangible coding game developed for Osmo. It teaches the basics of coding through a hands-on coding adventure with physical coding blocks. 





















  
  






  What I DidMy role started as Osmo’s first on-staff artist. I was responsible for designing UI, games assets, character animation, and marketing graphics. My role expanded into play design where I developed, play tested, and iterated on level design and game UX. I was later promoted to Product and Team Lead of engineers, artists, animators, and designers in updates for the Osmo Coding Starter Kit relaunch.





















  
  




  
  
  


  


  
  



    
  
                            


  

  
    
                            

