  Osmo Genius Starter Kit





















  
  






  KIT LAUNCHED 2020PRODUCT LEAD / PLAY DESIGNER / CONTENT DESIGNER


























  Genius Starter Kit is Osmo’s flagship game collection. It contains five digital games that use physical pieces to teach the basics of math, spelling, and spacial reasoning.It is designed for kids ages 5 to 10.My role as Product and Design Lead was to coordinated with three international teams in refreshing Osmo Words, Numbers, and Tangram. I worked with each team in unifying and boosting game content to have higher retention across the suite of games. I was responsible for leading the design of a shared monthly release initiative  that connected game and marketing efforts with parents and their kids.
























  
  
  


  


  
  



    
  
                    

