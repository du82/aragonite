  AwbieBouncy yet brave, Awbie is willing to make mistakes along the way, even if it means running into a tree or diving headfirst into a lake. Awbie will try anything to chow down on delicious strawbies! Awbie does not speak, but instead visually acts out emotions: growing uncontrollably excited when discovering a treasure trove of strawbies or showing off with a backflip when jumping into a tricky spot. Did we mention how much Awbie loves strawbies? A lot...





















  
  














































  

              
            
                                                                                            
                                                                
