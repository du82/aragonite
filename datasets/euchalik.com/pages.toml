  Package DesignThe goal of the Starter Kit was to combine Osmo’s three coding games into one new retail offering. A new box was required that would not only contain the pieces, but also best capture messaging about the product. Having been Osmo’s Brand Lead for their retail packaging system, I designed, illustrated, and tested multiple packaging iterations in multiple focus groups. Interviews are essential to understand product market fit and to get feedback on every aspect of the product. 





















  
  




  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                                          
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                    

