  Game DesignCoding Jam was co-designed with Felix Hu. It is played by assembling and connecting the Osmo Coding Blocks (creating patterns and sequences), and then running your code to create musical loops. The Osmo Reflector sees the code, and then tells your band member which musical objects to play and how many times. Kids can safely record and share their music with friends, family and the Jam community.I was involved with developing, play testing, and iterating the UX and game levels. It was my responsibility to write and create detailed game documentation used for internal and external usage.


























