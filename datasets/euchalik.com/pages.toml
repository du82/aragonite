  Players progress through different obstacles in each level and collect as many delicious strawbies and items as they can. The game is scaffolded to be instructional at the start, but quickly allow for more advanced coders to earn rewards by using more coding commands to line up multiple strawbies in one run of code.It was my responsibility to write and create detailed game documentation used for external usage.





















  
  






