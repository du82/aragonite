  Magnetic Coding BlocksThe kit includes physical blocks of code that magnetically snap together. By using the Osmo to see the blocks on the table, the code interacts and comes to life on your tablet.There are seven different Command Blocks, that control the game interactions. Three of the commands (Walk, Hand, and Jump) have turnable direction arrows.IconographyCollaborating with Osmo’s computer vision and industrial design team, I designed symbols and colors used for each block. The goal was to create a versatile system that could be used for multiple games but also easy to understand. I chose traffic symbols as one of the most common graphics kids see as a perfect influence for the iconography.This allowed the kit to work for the target age of 5 to 10, but still be enjoyable by kids as young as 3. 





















  
  




  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                                          
                                                                          
                                                                          
                                                                          
                                                                          
                                                                          
                                                                          
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                    

