  UI for a Young Audience





















  
  






  One of the primary challenges in designing Osmo World was creating an interface that resonated with children (Ages 4-10). The objective was to craft a kid-friendly game launcher that not only introduced the range of Osmo's products but also retained interest in an increasingly competitive digital landscape.This required a balance of simple navigation, engaging rewards, moments of delight, and unique interaction. This is what set Osmo World apart from basic game hubs, the UI was playful.





















  
  




  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                            


  

  

  

                
                                                                          
                                                                          
                                                                          
                                                                          
                                                            
  
  


  

  

  

  

        
  
  
  


  


  
  



    
  
                            


  

  

  

  

  
                                                                                                                    
                                            
                            
                                                            
                                                                                                    
