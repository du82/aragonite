  Musical Coding GameCoding Jam is a music game that uses the Osmo Coding Blocks to compose musical loops. Explore the creative side of coding with hands-on music-making! My role started as an art lead and designer to create a game full of animated worlds and characters while co-designing an experience that would be approachable to even the most novice of music-makers. As Product Lead I later led a team to improve onboarding and revamp the visual scenes of the game for the relaunch of the Starter Kit.
























  
  
  


  


  
  



    
  
                            


  

  
    
                            

