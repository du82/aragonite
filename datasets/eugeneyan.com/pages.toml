["https://eugeneyan.com/speaking/bukalapak-fireside"]
title = "Bukalapak - Fireside Chat with the Data Science team"
description = "We discussed about how to build and run data teams and engage better with business."
full_description = "I was recently invited to speak at a fireside chat with Bukalapak, an e-commerce unicorn in Indonesia. It was a fun discussion with the data science and engineering team where I shared my experience building and running data teams in South East Asia and answered questions from the audience. I got feedback that my responses helped with their thinking on running data teams and engaging with stakeholders. Maybe they’ll benefit you as well. I think this depends on the organization that Data is part of. One way to look at is whether Data is a cost center or a profit center. I believe that, in the case of Bukalapak, data is a profit center. In e-commerce companies, Data drives Gross Merchandise Value (GMV) though powering search, recommendations, marketing, customer acquisition, etc. If Data is part of a cost center, such as working on anti-money laundering because it’s a government regulation, or working on process automation, there’s only so much money that data can save. The maximum value that data can provide is 100% of the cost involved. And even then, it will never achieve 100% savings as it costs infra and people to run those (data and machine learning) systems. On the other hand, if data is part of a profit center, the maximum value it can provide is infinite. Take Google’s ad systems for example. Since Google started selling ads, ad revenue has kept growing and growing. In general, data teams in profit centers tend to have more respect and influence, because, well, they bring in the bacon. Data teams in cost centers tend to have a supporting role (and are also likelier to get outsourced). That said, there are exceptions. One exception is based on the amount of trust Data leaders have in the organization. I’ve seen Data leaders where, regardless of their function (i.e., profit or cost center), they have a lot of influence in the organization. They’re consulted by the executive team and senior leadership because they’ve earned the trust and demonstrated that data can add value. In those cases, Data plays a leading role."
author = "Eugene Yan"
year_published = 2021
year_updated = 2021
