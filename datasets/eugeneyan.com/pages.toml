title = "OMSCS CS6476 (Computer Vision) Review and Tips"
description = "OMSCS CS6476 Computer Vision - Performing computer vision tasks with ONLY numpy."
full_description = "You might also be interested in this OMSCS FAQ I wrote after graduation. Or view all OMSCS related writing here: omscs. I recently completed my first course for the Georgia Tech OMSCS—CS6476 Computer Vision—and wanted to share some thoughts I had on it. I recently built APIs for image classification and reverse image search using deep learning libraries. Through the process, I gained an understanding of how images work as a data structure, and how to apply machine learning on them to build useful data products. Nonetheless, there was a yearning to get a more in-depth understanding of the fundamentals of working with images. In addition, there are plenty of other useful applications for image and video, and the course seemed to provide a broad overview. Here’s an example of detecting circles to count the total value of coins in an image. The algorithm is built solely on Numpy while we used OpenCV libraries to draw circles. The lectures were relatively long and covered plenty of material. They contained a lot of mathematical proofs and derivations so it can feel a little dry at times. At times, the lectures felt packed with so much material that it can feel overwhelming. Thankfully, the professor did an excellent job in explaining the math and the concepts and intuition behind it. It also helped that he was humorous and that kept the lectures interesting. Assignments were generally broken down into two parts: (i) Development to implement CV algorithms, and (ii) running experiments to tune parameters and document them in a report. Development required you to apply what was learnt in the lectures to code low level CV algorithms from scratch (in Python). Most of the work was done in Numpy and involved working with matrices and writing efficient vectorized code. This is easier if you take time to get a solid understanding of the underlying math/linear algebra before translating it into efficient code. For the report, a lot of time was spent running experiments and tuning parameters to get the desired results. While the results require time to achieve, they aren’t meant to be industrial grade. CV is difficult and the class teaches you about the real life difficulties and flaws of fundamental CV algorithms—the more you encounter such challenges, the better an understanding of CV you get."
author = "Eugene Yan"
year_published = 2017
