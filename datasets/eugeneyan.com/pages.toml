["https://eugeneyan.com/writing/aireadingclub"]
title = "Building AI Reading Club: Features & Behind the Scenes"
description = "Exploring how an AI-powered reading experience could look like."
full_description = "How can AI make reading more enjoyable? What would an AI-powered reading experience look like? Inspired by a discussion between Andrej Karpathy and Patrick Collison, I built a simple prototype to explore some ideas. (Try it at AiReadingClub.com!) In this write-up, I’ll walk through key features, design considerations, and how it was built. Exactly, roughly what I tried and mostly failed. I want to highlight some text in the pdf, pull out the highlight, the preceding text of the chapter, maybe the generated summaries of the other chapters, put it all together, attach nearby images if any… there’s a whole design… At the heart of AI Reading Club is Dewey, our AI reading companion. Dewey is designed to help readers get more out of reading with a few simple features. Understanding your context. Dewey understands our current context via the text we select or the page we’re on. This explicit context is displayed during discussions to make clear what Dewey is focused on. Behind the scenes, Dewey can also retrieve and consider the rest of the book as implicit context to enrich its understanding and improve its responses, such as when using the “Recap” or “Look up in book” feature (see below). Answering simple queries. With the provided context, Dewey can help clarify the material, explain complex sections, or discuss various perspectives. This helps us better understand the book. The goal is to keep us in flow while reading, instead of having to reread other sections of the book or open a web browser for our queries. Creating quizzes/flashcards. Dewey can also test our knowledge of the selected text. This helps reinforce our learning and improve knowledge retention. Recapping the book so far. It can be challenging to resume a book we’ve stopped reading for a while. To help with this, Dewey can summarize the book up to the current page, refreshing our memory and highlighting major themes, characters, and concepts. Look up in book. If we need help with a term or character that was previously mentioned, Dewey can help with a summary so we don’t have to look it up ourselves."
