["https://eugeneyan.com/writing/what-i-learned-from-writing-online"]
title = "What I Learned from Writing Online - For Fellow Non-Writers"
description = "Write before you're ready, write for yourself, quantity over quality, and a few other lessons."
full_description = "I’m not a writer. I’m just someone writing to learn, share my ideas, and make new friends. In the process, I’ve written more than a hundred posts on this site. Writing has been fulfilling. When I try to write about something, gaps in my knowledge are exposed. Putting my thoughts on paper (or the screen) clarifies my thinking. And as I write, I get inspired with new ideas. An unexpected benefit of writing online is that it acts as a “bat signal” for my interests, helping me find like-minded friends. I’ve gained some lessons from writing over the past few years. Maybe they’ll be useful for you too. Who am I to write about any subject? What can I contribute, beyond the experts who are working on it full time? Actually, a lot. Expertise lies on a spectrum. I find that I learn best from people who are just two to three steps ahead of me. Thus, sometimes, the best person to teach and write about something isn’t the expert who’s been studying the subject for years, but someone who just grokked a concept or tool and can coherently write about it for laymen. Will you ever feel qualified enough to write about something? Maybe. Likely not. Your taste for good writing will almost always surpass your abilities. You can always find and appreciate writing that’s smarter, sharper, and easier to read than your own. Nonetheless, push through that feeling of never feeling good enough and just write anyway. Assume no one’s going to read your writing—what will you gain from it? With every piece you write, try to make sure there’s something in it for yourself. I write about topics I want to explore and learn about. For example, I wanted to learn more about data discovery platforms and feature stores. Thus, I dived into papers, tech blogs, and conference videos. Then, to solidify my understanding, I wrote about it. As I wrote, I found and patched gaps in my understanding. Even if no one reads my writing, I gain from the process of writing to learn and clarify my thoughts."
