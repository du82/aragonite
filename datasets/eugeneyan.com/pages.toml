["https://eugeneyan.com/writing/recsys2021"]
title = "RecSys 2021 - Papers and Talks to Chew on"
description = "Simple baselines, ideas, tech stacks, and packages to try."
full_description = "Negative Interactions for Improved Collaborative-Filtering: Don’t go Deeper, go Higher was motivated by the finding that modeling higher-order interactions helps with recommendation accuracy. They shared a simple extension of adding higher-order interactions to a linear model without a hidden layer (Embarrassingly Shallow AutoEncoders aka EASE^R). EASE^R learns pairwise relationships between each item i (input) and item j (output) of the autoencoder. To add higher-order interactions as input, two items are now considered as input (i and k) to predict item j in the output. (They also tried even higher-order interactions but didn’t see any improvements.) This simple extension on a simple model was competitive with several SOTA deep learning models on datasets such as MovieLens-20M, Netflix, and MSD. In addition, the paper showed that less active users benefited more from the higher-order model relative to EASE^R. They hypothesized that, because triplet-relations (i, k, j) are more prevalent among highly-active users, the pairwise relationships are freed up to better adapt to less-active users. Loved the simplicity of this idea and implementation. Reenvisioning the comparison between Neural Collaborative Filtering and Matrix Factorization revisits the comparison between matrix factorization (MF) and neural collaborative filtering (NCF) again. To recap, MF learns a latent representation of items and users and combines these representations to compute a preference score between each user and item (e.g., dot product). In comparison, NCF uses multilayer perceptrons (or other deep learning layers) to learn scores between each user and item. The current paper reproduces the results from a RecSys 2020 paper that compared MF and NCF, and extends it by including other accuracy metrics, as well as metrics for diversity and novelty. It showed that MF outperforms NCF in performance (nDCG and Hit Rate), including in the long tail, though NCF provides more diversity and novelty. The paper also includes a useful list of various recommendation baselines. Takeaway: Don’t throw your MF techniques out yet."
