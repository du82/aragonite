["https://eugeneyan.com/writing/how-to-write-david-x-sahil"]
title = "How to Write: Advice from David Perell and Sahil Lavingia"
description = "An expansion of my Twitter thread that went viral."
full_description = "Think about it—through writing, I broadcast ideas from my mind to yours. Across time. Across space. (Yes, the internet plays a big role, but let’s focus on writing.) The more effective your writing, the stronger your telepathic ability. Writing is essential for effective data science. Good writing means you get buy-in on ideas, your methodology and experiments can be replicated, and readers understand enough to give feedback. Poor writing gets you zilch (and snores). Business folk have enough trouble understanding data geeks as it is—don’t make it harder with your writing. Writing is an important way to learn. (The other important way is learning.) When writing, you have to organize ideas and prune the unnecessary. Along the way, you find gaps in your understanding, which leads you to more research and learning. Writing becomes more important as your career progresses. Everything is writing—emails, specs, documentation, articles. Code too. As you become more senior, you write more docs, less code. Seniors contribute by designing systems and communicating them to teams to implement. I recently sat in the excellent workshop by David Perell (The Writing Guy) and Sahil Lavingia (Founder and CEO of Gumroad). Here’s a summary of what I learnt and some of my thoughts mixed in. Write what excites you. If you’re not excited about what you write, it’s unlikely to excite your audience. Writing is difficult; thus, just start with something that excites you. Then, build a habit by writing more about what excites you. Write simply. Communicate strong ideas clearly. Sometimes, people use “clever” writing to hide weak ideas. Think of those convoluted investment prospectuses. And fraudulent company annual reports (read: WeWork). Keep your writing simple to let your ideas shine. Write before you’re an expert. People think they have to be an expert before writing—why else would others be interested in what you have to say? Answer: Because you have unique experiences that others want to learn about. Interviewed at multiple companies and got an offer? Teach us. Set up a productive dev environment or workflow? Demo it. Expertise is a ladder. Wherever you are on it, there’ll be people above (whom you view as experts) and people below (who view you as an expert). People below want to learn from you."
author = "Eugene Yan"
year_published = 2020
