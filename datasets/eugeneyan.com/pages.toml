["https://eugeneyan.com/writing/role-title-mismatch"]
title = "How to Prevent or Deal with a Data Science Role or Title Mismatch"
description = "Interview questions you should ask and how to evolve your job scope."
full_description = "Previously, we discussed the various roles in data science (data scientist, applied scientist, research scientist, machine learning engineer) and read about a data scientist who found himself mainly doing non-data science, SQL monkey work. Now, you might be thinking, how can we prevent ourselves from getting into a role that’s not what we expect? Or if we’re in such a situation, what can we do? The first line of defense is to read the job description carefully. Don’t just focus on the job title! In this (slightly dated) study, researchers found that job seekers mostly paid attention to the job title and company, neglecting other information such as job requirements. We should spend time examining the requirements and job scope too. Most of the time, hiring managers and recruiters make an effort to customize these to match the role. If we land an interview, we should ask the right questions. It’s as much about us assessing them as them assessing us. Here are some useful questions to suss out the role: If you’re fairly certain about the role (and maybe have an offer), contact future team members you’ve met—during the interview cycle—to learn more. Or look them up via LinkedIn. In addition to the questions above, ask about the culture and your future boss. Usually, peers don’t have as much of an incentive to “sell” you the role and tend to provide more objective information. We can also read reviews on sites such as Glassdoor. This can be useful for organizations with a single, centralized, data team. Nonetheless, note that in large organizations with multiple data teams, each team might be structured differently and have different cultures. Use your judgment and take these reviews with a pinch of salt. For example, you might be building machine learning models, putting them into production, and working on engineering and devops tasks. However, you have the title of data scientist while peers (in other organizations) have titles such as applied scientist or machine learning engineer."
