["https://eugeneyan.com/writing/datakind-sg-project-accelerator"]
title = "DataKind Singapore’s Latest Project Accelerator"
description = "Guest post of how DataKind SG worked with NGOs to frame their problems and suggests solutions"
full_description = "From providing clean water and sanitation to fighting human trafficking to improving the lives of the underserved, nonprofits in our region are collecting a lot of useful data that could help inform their work and better serve their communities. However, many don’t have the time or staff expertise to clean, analyze, and visualize the data to take advantage of this powerful resource. During DataKind Singapore’s third Project Accelerator, over 40 volunteer data scientists came together for a night of brainstorming and consulting to help four local organizations do just this. Representatives from Lien AID, Phandeeyar, Walk Strong, and Liberty Asia briefly talked about the challenges they face and how they hoped to use data to tackle them. Participants then broke up into different focus groups to frame the problems and suggest solutions to the most pressing issues. Lien AID is a nonprofit that aims to improves the lives of rural communities in Asia by making clean water and sanitation accessible and affordable to them. In developing countries, about 80% of illnesses are linked to poor water and sanitation, and one out of every five deaths under five is due to a water-related disease. Furthermore, the burden of collecting clean water—usually on women and children—reduces time spent in an income-generating job or attending school. To provide sustainable access to clean water, Lien AID partners with local governments and organizations to build water treatment plants that provide bottled and piped water. Problem Statement: To understand the consumption of clean drinking water in a community, Lien AID tracks households that buy bottled water by collecting data through phone calls to local operators. However, this data can be unreliable, making it difficult to get an accurate picture of bottled water consumption and its related benefits. In addition, Lien AID has collected significant data from its needs assessment surveys and other sources, but much of this is free text. They requested guidance on how to begin analyzing the data, especially unstructured free text data."
