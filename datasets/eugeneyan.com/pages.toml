full_description = "As someone who wants to get started in writing and technical blogging, I was thinking about a custom app but then got overwhelmed. Your app looks very well put together, and I was wondering what the architecture was and how easy it was to set up. Maybe a blog post about it would be good. On setting it up, my friend YuXuan wrote about his process here: Part 1, Part 2. I think you’ll find it useful. Have a question for me? Happy to answer concise questions via email on topics I know about. More details in How I Can Help. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
