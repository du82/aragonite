["https://eugeneyan.com/writing/im-going-back-to-school"]
title = "I'm going back to school"
description = "Got accepted into Georgia Tech's Computer Science Masters!"
full_description = "Update: I’ve graduated! You might also be interested in this OMSCS FAQ I wrote after graduation. Or view all OMSCS related writing here: omscs. Georgia Tech is one of the top schools for computer science (5th on Business Insider and TFE Times, 9th on US News). The price tag? Around USD$7,000. That’s less than 1/10 of the cost of a degree from comparable US colleges. Furthermore, graduates earn a full Masters degree that’s indistinguishable from those earned by residential students. Bottom line: I get to learn at a top CS school and apply it (at work) simultaneously, and not forgo real-world industry experience. At a great price. Please describe your background (academic and extracurricular) and experience, including research, teaching, industry, and other relevant information. Your space is limited to 2000 characters. (My interpretation: What has prepared you for this program?) Using data to create positive impact—this sums up my career so far. Though I have not formally studied computer science, I have developed coding and engineering skills through online learning and work experience in technical roles at IBM and Lazada (Southeast Asia’s leading e-commerce site). My self-learning and 3 years of technical experience have prepared me for OMS CS. I graduated top of my cohort with a degree in Psychology and Business from the Singapore Management University (SMU). At SMU, I gained skills in advanced statistics, research, and experimental design. For my thesis, through regression analysis, I found that competition improves performance of ego-oriented (success means being better than others) but not task-oriented (success means skill mastery) people. I was also a research assistant to two professors, and helped on experiments, analysis, and publications. After college, I joined the Ministry of Trade and Industry. Using economic and political data, I developed policies and concluded trade agreements. I also further honed my communication skills. With a yearning to work closer to data and build automated systems, I joined IBM (after much self-learning)."
