["https://eugeneyan.com/writing/experimentation-workflow-with-jupyter-papermill-mlflow"]
title = "Simpler Experimentation with Jupyter, Papermill, and MLflow"
description = "Automate your experimentation workflow to minimize effort and iterate faster."
full_description = "Your company (e.g., an e-commerce platform across several countries) is starting a new project on fraud detection. You begin by building a basic machine learning pipeline for a single country in a Jupyter notebook. The evaluation metrics for your basic, single-country pipeline looks good. Next, you want to apply the same pipeline to the other countries—since the data format is identical—and run multiple experiments (e.g., feature selection, parameter tuning). Ideally, each experiment’s output should be a self-contained Jupyter notebook for easy reference. You also want to store and access artifacts (e.g., visualizations, trained models) in a single location. If you’re like me, you might duplicate that basic pipeline (basic.ipynb) and rename it (e.g., basic_sg.ipynb, basic_vn.ipynb, etc). One notebook per country. However, as you experiment, you find some new features that improve results and want to replicate it across the countries. Thus, you copy-paste code across multiple notebooks. This violates the DRY principle and is pretty tedious. To log the results in a single location, you output evaluation metrics for each experiment in a CSV. Visualizations (e.g, ROC curves, precision-recall curves) and trained model binaries are also stored in a single directory. However, trying to match the visualizations (in the directory) to the experiment results (in the CSV) for reference is time-consuming. Ditto for the model binary. After some trial and error, I’ve settled on a workflow for simpler, faster experimentation. No more duplication of notebooks. All metrics, visualizations, and model binaries in a single UI. In this notebook we have a basic pipeline doing some analysis, visualizations, feature engineering, and machine learning. At a high level, it: The pipeline is simple—running it end-to-end takes 3.5 seconds. This allows for rapid, iterative experimentations. To scale our single notebook (running the S&P 500 pipeline) to multiple other stock indices, we enlist the help of papermill."
