["https://eugeneyan.com/writing/llm-bio"]
title = "LLM-powered Biographies"
description = "Asking LLMs to generate biographies to get a sense of how they memorize and regurgitate."
full_description = "Inspired by Linus’ tweet and out of curiosity, I asked some LLMs to write a biography of me. It seemed like a fun way to learn what these large language models (LLMs) are trained on and how they perform. Here are the results from gpt-4, claude-v1.2, cohere-xlarge, etc. While they’re not perfect, how each model improves over the previous is apparent. Also, it’s intriguing how some models memorize and regurgitate more than others. Overall, gpt3.5/4 performed the best—they got the gist right though erred on the details. The Blurry JPEG analogy may be helpful in gaining more intuition on why this happens. Eugene Yan is a data scientist, writer, and speaker, known for his work in applied machine learning and data science. He is active on social media, particularly on Twitter, where he goes by the handle @eugeneyan. Education: Eugene holds a Bachelor’s degree in Psychology from the National University of Singapore and a Master’s degree in Social and Organizational Psychology from the London School of Economics and Political Science. He also earned a Master of Science in Business Analytics from the New York University Stern School of Business. Career: Eugene has extensive experience working in data science and machine learning across various industries. Some notable roles include: Data Science Lead at Lazada (Alibaba Group) - Eugene led a team of data scientists to develop and implement machine learning models, focusing on search and recommendation systems for the e-commerce platform. Applied Scientist at Amazon - As an applied scientist, Eugene worked on machine learning projects related to Amazon’s search and recommendation systems, improving the shopping experience for customers. Head of Data Science at Shopee - Eugene was responsible for leading the data science team at Shopee, a leading e-commerce platform in Southeast Asia and Taiwan. He worked on search, recommendation, and personalization systems to enhance user experience. Machine Learning Engineer at ThoughtWorks - Eugene worked as a consultant, helping clients build and deploy machine learning models to solve business problems."
