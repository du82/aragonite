["https://eugeneyan.com/writing/recommender-systems-baseline-pytorch"]
title = "Building a Strong Baseline Recommender in PyTorch, on a Laptop"
description = "Building a baseline recsys based on data scraped off Amazon. Warning - Lots of charts! (Part 1 of 2)."
full_description = "Recommender systems (“recsys”) are a fairly old topic that started back in the 1990s. The key idea—we can use opinions and behaviours of users to suggest and personalize relevant and interesting content for them. Adding yet another post on the standard item-user collaborative filtering wouldn’t contribute much to the hundreds, if not thousands, of posts available. A web search on recommender systems surfaces articles on “collaborative filtering”, “content-based”, “user-item matrix”, etc. Since then, there has been much progress applying newer techniques for recsys. Unfortunately, easily readable articles or blogs on them are few and far between. The articles cover the end-to-end, from data acquisition and preparation, and (classic) matrix factorization. It also includes applying techniques from graphs and natural language processing. A result comparison of the different approaches on real-world data will also be discussed (I hope you love learning curves.) We can’t build a recsys without data (well, we can’t build most machine learning systems without data). Thankfully, Professor Julian McAuley, Associate Professor at UC San Diego has a great collection of data sets (e.g., product reviews, meta data, social networks). For this post, we’ll be using the Amazon dataset (May 1996 – July 2014), specifically, the electronics and books datasets. All of the datasets are in json format and require parsing into a format that’s easier to work with (e.g., tabular). Some of these datasets can be pretty large, with the largest having 142.8 million rows and requiring 20gb on disk. Here’s an example of how a json entry for a single product looks like (what we’re interested in is the related field). Needless to say, we’re not going to be able to load this fully into ram on a regular laptop with 16gb ram (which I used for this exercise). To parse the json to csv, I iterated through the json file row by row, converted the json into comma-delimited format, and wrote it out to CSV. (Note: This requires that we know the full keys of the json beforehand)."
