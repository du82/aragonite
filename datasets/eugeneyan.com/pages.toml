["https://eugeneyan.com/writing/paper-club"]
title = "How to Run a Weekly Paper Club (and Build a Learning Community)"
description = "Benefits of running a weekly paper club, how to start one, and how to read and facilitate papers."
full_description = "Over the past 18 months, the Latent Space Paper Club has had an unbroken streak of hosting paper club every single week. That’s at least 80 papers, and likely more, when we consider weeks where we cover related papers (e.g., LoRA + QLoRA). Together, we’ve pre-read and discuss a paper weekly, covering the fundamentals such as: This has equipped us with the foundation to understand how these techniques and models work, build systems and applications on top of them, and apply them at work and personal projects. But it’s not just about technical knowledge. We’ve also learned from practitioners sharing their insider know-how, built friendships at in-person meetups, and grown a community of learners and builders. We’d like you to benefit from this too. That’s why we wrote this guide: To help you start your own paper club and learn—together—with your peers. Also see the Swyx/Latent Space version that includes (i) advice on paper curation, (ii) video walkthrough of a 3-paper pre-reading + slide prep, (iii) recordings of the Llama 3.1 and Molmo paper club, and more. Same time, every week. Every Wednesday, we gather for an hour over lunch (12pm PST) to discuss a pre-selected paper. Sticking to the same time every week makes it easier to remember and attend. Also, a weekly cadence helps with building the habit. Pre-reading. Pre-reading the paper helps you get the most out of the session. I usually pre-read over the weekend, for about an hour. This helps me identify what I don’t understand so I know what to clarify during the session. I’m also better equipped to share insights and help others understand the material. From experience, skipping the pre-read reduces the value I get from the discussion by ~80% or more. Facilitating. Each week, a volunteer guides the group through the paper, covering the motivation, related literature, methodology, results, etc. This usually takes around 45 minutes, with pauses after each section for quick questions. In the last 15 minutes, we have free-form discussion and discuss the paper’s implications, connect it to other work, and/or consider how to apply the ideas to our work and the broader industry."
