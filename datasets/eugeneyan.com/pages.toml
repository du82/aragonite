["https://eugeneyan.com/writing/retrospective-2020"]
title = "2020 Retrospective: New Country, New Role, New Habit"
description = "Wrapping up 2020 with writing and site statistics, graphs, and a word cloud."
full_description = "2020 has been a year of challenges and growth. Amidst the pandemic, I moved halfway across the globe for a new role, and started writing more. Here’s the year in review. I joined Amazon in January and moved halfway across the world, from sunny Singapore to rainy Seattle. Here, I build recommender and machine learning systems to serve millions of readers worldwide. The goal is to help them read more, and get more out of reading. This mission is aligned with my values, and being able to contribute at such scale is exciting. Amazon’s a big company with established processes, infrastructure, and teams. I’m learning lots about how to scale myself via writing (better) documents, designing and shipping scalable systems, and building collaborative relationships to deliver results. Although Amazon is large, my team is lean, with one data scientist, two applied scientists, and four software engineers—this pushes us to be creative in designing lean systems to minimize development and operations cost. Part of this involves using managed services (e.g., SageMaker, managed Spark, Airflow) to scale ourselves and minimize ops. I also doubled down on my writing habit, increasing the frequency from monthly to weekly. After finishing my CS masters in 2019, I had some newfound free time. The pandemic, shelter-in-place, and work-from-home also contributed to this habit. What did I write about? I initially wrote whatever was on my mind, such as an easier way to write and using a Zettelkasten to take notes. This included summaries from my learning (e.g., serendipity metrics, NLP survey) and conferences (e.g., spark summit, recsys). I also started sharing my thinking on effective data science and machine learning, such as how to maintain ML in production, test ML code, and why I love scrum. This included what I thought would be an unpopular opinion on why data scientists should be more end-to-end (which turned out to be fairly popular). As readers got to know me, they also reached out with questions. Responding in writing on this site was a great way to answer those questions at scale. I answered questions about my productivity habits (with a guest post by Susan Shu!), why read papers, the importance of writing for tech roles, why have a portfolio, and the difference between data/ML roles."
