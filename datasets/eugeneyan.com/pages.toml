["https://eugeneyan.com/writing/commando-soldier-police-and-your-career"]
title = "Commando, Soldier, Police and Your Career Choices"
description = "Should I join a start-up? Which offer should I accept? A simple metaphor to guide your decisions."
full_description = "I’ve received this question a handful of times. While I don’t have a clear and direct answer, I’ve found the following metaphor to be helpful. Imagine an unexplored piece of land. Possibly rich in resources. Maybe even treasure. Or it could be barren. There could be unknown dangers lurking. Or hostile forces that arrived earlier. To assess the potential gains from the land, we need to establish an outpost. In come the commandos. Commandos are speedy, scrappy first-strikers. Need someone to set up a foothold in unknown/enemy territory? Call them in. They will set up camp and explore the area, reporting back on potential gains, dangers, and hostile forces. If the commandos report the land is rich, we send in soldiers next. Soldiers are second-wave troops who expand your territory. They build on the know-how gained and maps drawn by the commandos. The goal? To quickly swarm to capture as much land as possible. They also start to reap the gains from the land. After some time, there’s not much unoccupied land left. Hostile forces—hearing about your success—have moved in, trying to wrestle a piece of the pie. Your commandos and soldiers are now exploring new lands or combating enemies on the frontlines. You need police to maintain peace and order over your vast territory. Police establish rules, patrol the area, and keep things in order. They maintain stability and efficiency. If small groups try to invade, they can defend and repel on their own, or at least minimize territory lost. There are many new lands to explore, and many lands in various stages of being explored and/or exploited. Each requires a different mix of commandos, soldiers, and police. At the beginning, the potential gains are unknown and the risk is high. Commandos need to get from zero to one—build a working prototype and find product-market fit. Speed is critical. Imagine trying to introduce e-commerce in South-East Asia back in 2012. How would it work when there’s no widespread credit card usage, no reliable logistics, no proper home addresses? Should your tech be on-premise or in the cloud? What product categories should you focus on? Where to locate warehouses? Commandos tackle these questions."
