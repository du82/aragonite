["https://eugeneyan.com/writing/imposter-syndrome"]
title = "How to Live with Chronic Imposter Syndrome"
description = "More education, achievements, and awards don't shoo away imposter syndrome. Here's what might help."
full_description = "My earliest memory of imposter syndrome is from my first day at IBM. Of the 20 people in my cohort, 18 had technical degrees, of which 10 were PhDs. I was one of two hires with a non-technical background (my Bachelor’s was in Psychology). After IBM, I joined Lazada’s data science team. Similarly, I was surrounded by an army of PhDs and felt unqualified for my role. They must have been desperate, I thought. To soothe my imposter syndrome (among other reasons), I took a Master’s in Computer Science. I hypothesized that having a technical degree would help me feel less like a fake. I gained a lot from OMSCS, but it didn’t help with imposter syndrome at all. Even now, I feel like a charlatan without a PhD among the scientists, and a phony without proper engineering training among the engineers. Given my experience with chronic imposter syndrome, I’ve picked up some tricks to salve the feeling of being a fraud. Some require a shift in mindset, others require behavioral tweaks. Maybe you’ll find them helpful too. Sometimes, we feel like an imposter when we do things we’ve never done before. But if you think about it, everyone had to start from nothing. The new engineer didn’t have work experience as an engineer, the first-time founder didn’t have experience starting companies, and every surgeon had to conduct her first surgery. At that point in time, they had no track record and might have been seen as imposters. There are no certifications, classes, or portfolios for many things in life. No one qualified Orville and Wilbur Wright to invent the airplane, no one taught J.K. Rowling to write Harry Potter, and no one checks the portfolios before allowing new parents to have children. They just did it. I like how Tim Urban puts it (CMD+F “how to be a chef”): You don’t know shit. But no one else knows shit either. Everyone’s playing Grand Theft Life and trying to figure it out. The exaggerated esteem in which my lifework is held makes me very ill at ease. I feel compelled to think of myself as an involuntary swindler."
author = "Eugene Yan"
year_published = 2021
year_updated = 2021
