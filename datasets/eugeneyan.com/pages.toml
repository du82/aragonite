["https://eugeneyan.com/writing/open-llms"]
title = "Open-LLMs - A list of LLMs for Commercial Use"
description = "It started with a question that had no clear answer, and led to eight PRs from the community."
full_description = "I was looking for a list of open LLMs with commercial licenses and casually asked on a discord channel. (The goal was to finetune an LLM—that had a commercial license—to address legal and privacy concerns around using third-party LLMs.) After googling around for a bit, I realize there wasn’t a list compiled (yet). Thus, I decided to answer my own question and help others on this same path. You can find that list here. I’m surprised by the support from the community. In two days, we’ve seen eight PRs that added more open LLMs. This includes a through discussion on adding model details followed by a PR that added context length as a column. There was also a correction on an LLM that didn’t actually have commercial license. I’m grateful for the support so far and am looking forward to working with the community to add datasets, evals, and more. Yan, Ziyou. (May 2023). Open-LLMs - A list of LLMs for Commercial Use. eugeneyan.com. https://eugeneyan.com/writing/open-llms/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
