["https://eugeneyan.com/writing/practical-guide-to-maintaining-machine-learning"]
title = "A Practical Guide to Maintaining Machine Learning in Production"
description = "Can maintaining machine learning in production be easier? I go through some practical tips."
full_description = "In the previous post, we discussed six little-known challenges after deploying machine learning. As a recap, here are the six groups: This follow-up will share some practices I’ve found useful to maintaining machine learning in production. They are: With close to 20 suggestions, it can get overwhelming. Fret not, I’ll highlight the top three must-haves and good-to-haves at the end of this post. Validate your incoming data. “Data is the New Oil.” “Garbage in, Garbage Out.” These clichés emphasize that clean input data is essential to your system. Here’s how you can monitor your incoming data, starting with the most basic. These checks identify errors upfront and save hours spent unnecessarily fixing your pipeline or decontaminating your feature store. Check the incoming files (if you receive data via a CSV/TSV/JSON dump). Don’t assume the file format will be consistent—a manual job could be creating them. Here’s a recent article on how Uber monitors data quality via multi-dimensional time series and principal component analysis. Check for training-serving skew. It’s often caused by discrepancies between training data and input data during serving, leading to disparity in model performance during training and serving. Minimize training-serving skew by training on served features. If you’re logging data and features during serving, consider using them as training data. To clarify, use historical processed features (during serving) to train your model. This ensures your model learns on data it would receive and predict on during serving—no more training-serving skew. As an extra benefit, you can simplify and shrink your training pipeline. E.g., previous ETL jobs to stitch together clickstreams for training data are no longer needed. Just train on the served features. Prune redundant features periodically. After adding features and finding improved model performance, take the extra time to check if all the features are still important. Excluding these redundant features will simplify your model and reduce data pipeline computation cost, with minimal impact on model performance."
author = "Eugene Yan"
year_published = 2020
