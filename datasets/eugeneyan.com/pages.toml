["https://eugeneyan.com/writing/red-flags"]
title = "Red Flags to Look Out for When Joining a Data Team"
description = "What to consider for in terms of data, roadmap, role, manager, tooling, etc."
full_description = "Looking for new data science opportunities in this heated market? Before you accept that offer, here are some red flags to beware of. While these are from the perspective of data science, they would also apply to most tech roles. Data: No data, or data that’s poorly organized and/or inaccessible. This can happen if you’re joining a startup that doesn’t have a critical mass of customers yet or if it’s a B2B company that relies on partners for data (e.g., ML solution providers for healthcare, fintech). Almost as bad, they might have data, but it’s stored in various formats with different schemas, making it difficult to use. Without basic data infra in place, a data scientist would face an uphill battle trying to contribute value via analytics or machine learning. Most will likely be frustrated with the grind of data acquisition, organization, cataloging, and building pipelines. Roadmap: No/poor plan on how the team will deliver value to customers and the business. A few years ago, during an interview, I asked a director of data science about his roadmap for the next 12 months. He responded at length about how he was focusing on team growth, diversity, and upgrading the tech stack. (This wasn’t the answer I was looking for.) I then asked, more specifically, how the team would contribute to customers and the business. Unfortunately, he couldn’t answer anything coherent—that was a big red flag for me. While data science isn’t the only one guilty of this, it’s especially easy for us to make this mistake. Engineering and product can point to concrete features that improve the customer experience and contribute to the bottom line. But data science can spend too much time on research without tangible results. While this is acceptable if you’re in an innovation team, typically, most companies don’t have the luxury of funding such a team. And when lean times come, teams that don’t contribute to the business are likely first to be cut. Also, if you’re a practitioner, it’s not healthy for your career and resume to have too many years go by without delivering customer or business results."
author = "Eugene Yan"
year_published = 2022
clearnet = "https://eugeneyan.com/writing/red-flags"
