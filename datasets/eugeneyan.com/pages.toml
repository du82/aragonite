["https://eugeneyan.com/writing/georgia-tech-omscs-faq"]
title = "Georgia Tech's OMSCS FAQ (based on my experience)"
description = "Why OMSCS? How can I get accepted? How much time needed? Did it help your career? And more..."
full_description = "I’ve received many questions about Georgia Tech’s Online Master’s of Science in Computer Science (OMSCS), especially since I graduated last year. Most questions were similar. Thus, with Gab’s suggestion, I decided to write this FAQ for people considering Georgia Tech’s OMSCS. It’ll be updated as I receive more questions. If you’ve already been accepted and have/get second thoughts—don’t! Finish the program, it’s worth it. This question is sometimes tied to the topic of career: “Why did you do a Master’s in CS, given that you were already a data scientist (before you started)?” Today, many bootcamps tout themselves as the path to lucrative roles in software engineering and data science. As a result, career advancement has become the key reason for further education. While OMSCS did help with my career, it was not my reason for it. Back in 2017, most of my programming and data science skills came from self-learning and work experience. I lacked the fundamentals and required a structured program to pick them up. After considering several options (MOOCs, bootcamps), I decided that a Master’s in CS would best fill this gap and thus took the plunge. First, it’s value for money. In 2017, it was estimated to cost 7 - 8k USD. It’s hard to find a Master’s in CS of similar calibre even close to this price. (Something slightly different, but also value for money in CS education is Lambda School). The fees for my final term was USD$841. Given that I took 9 terms, this worked out to around 8k USD. To make it more affordable, I was able to get a 5k SGD scholarship from the Singapore government. Second, I could do it part-time. I was, and still am, hungry for learning and growth. The industry was progressing so fast and I didn’t want to miss any of it. In 2015 it was all about big data and Spark (time capsule of the first Spark MOOC). Then, data science. After that, machine learning. Next, deep learning and its various flavours (e.g., CNN, RNN, GAN). Now, it’s how to deploy and maintain and get business value from machine learning systems. OMSCS allowed me to straddle industry and academia."
