["https://eugeneyan.com/writing/imposter-syndrome-susan"]
title = "My Impostor Syndrome Stories (Guest Post by Susan Shu)"
description = "Even high achieving individuals experience impostor syndrome; here's how Susan learned to manage it."
full_description = "This week, my good friend Susan shares her experience with imposter syndrome, which includes failing three courses while doing her degree and self-doubt after her recent promotion. From these bouts of imposter syndrome, she draws lessons that we can all apply. Without further ado, here’s Susan. One thing I have loved throughout my career and academic journey, is working with driven and capable peers. On the other hand, there were times I felt that my abilities paled in comparison to theirs - had I been accepted into my graduate program by mistake? My worries turned out to be untrue - since then I’ve done many interesting things such as building machine learning solutions as a Principal data scientist, founding a video game studio that sold 10k+ copies in 6 months, and more. Impostor syndrome showed up intermittently through all of those experiences, and it never really goes away. This surprises people (“how can you feel like a fraud when you’ve achieved so much?”), which is why I will share 2 personal stories of impostor syndrome in this post. One of the most severe cases of impostor syndrome I have experienced was when I was working toward my master’s degree at the University of Toronto, one of the most competitive programs in Canada. (Note: in Canada, master’s degrees are often standalone programs.) I owe a lot of what I learned about identifying and managing impostor syndrome to this experience, which is why this is the first story. At the time, I had thoughts such as: “I had a pretty low grade (< 90%) and failed 3 courses in undergrad, while everyone here probably had 95%+… I must have been the bottom of the barrel in acceptance.” Despite acting composed and unbothered on the outside, these thoughts caused deep feelings of guilt and anxiety. I got into this program, which makes me the top x% (of students who are interested in grad school in economics). Even if I am the bottom of the barrel in this x%, it doesn’t change the fact that I am in the top of the “comparable” population."
