["https://eugeneyan.com/writing/getting-help"]
title = "What To Do If Dependency Teams Can’t Help"
description = "Seeking first to understand, earning trust, and preparing for away team work."
full_description = "Other than in small organizations, most teams have interdependencies with other teams. For example, a machine learning team may rely on upstream data teams to provide feature data during offline training and online serving. The same ML team may then depend on downstream infra teams to support serving their models at scale. What can we do if dependency teams won’t or can’t help? This is a common question during chats with peers and mentees. The typical response is to escalate. Alternatively, let’s write a lengthy JIRA ticket explaining why the request is urgent and important to meet the team’s goal. Besides these, here are some approaches I’ve found long-term success with. Why won’t or can’t they help?—do we know? Often, we don’t because we didn’t seek first to understand before trying to convince them. We can do this by trying to understand their constraints and priorities. Are they unable to help because of resource or technical bottlenecks? Or does our request conflict with their priority of migrating off a tech stack? Also, what does it mean for them to be successful? If we understand their constraints, we can help work around, or even remove, those constraints. If we understand their priorities, we can consciously collaborate to achieve them. Achieving mutual understanding hinges on earning trust. It’s easier to be frank about constraints and priorities if we trust each other. We won’t go into a detailed discussion on how to earn trust but a few simple ways include understanding their needs and acting in their interests, listening and adapting to their feedback, and being dependable and delivering when others need your help. “But I’m offering to write the code, why do they refuse my help?” Depending on the situation, your help can cost more effort than them doing it themselves. Imagine having a new developer help with implementing a feature in an existing system: An experienced mentor has to onboard them, provide context and documentation, and likely help with environment setup, debugging error messages, and code reviews. In the short term, this increases work instead of reducing it."
author = "Eugene Yan"
year_published = 2023
clearnet = "https://eugeneyan.com/writing/getting-help"
