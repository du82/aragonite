["https://eugeneyan.com/writing/evaluating-ideas-at-a-hackathon"]
title = "A Hackathon Where the Dinkiest Idea Won. Why?"
description = "What I Learnt about evaluating ideas from first-hand participation in a hackathon."
full_description = "In 2017, Lazada held its inaugural hackathon. I had the priceless opportunity to observe it up-close. How the teams planned, prototyped, and pitched; how the judges evaluated ideas; how an unexpected idea won. It was a lesson on shipping bottom-up innovation to the customer. Another fortuitous lesson I gained was how to evaluate ideas. This lesson shaped my view on how best to contribute as a data scientist. In most companies, getting buy-in and resources (from management) to execute your idea is a challenge; Lazada was no exception. Thus, when the hackathon offered the grand prize of prioritizing and implementing the winning idea, teams across the region jumped on it. From the 80+ ideas submitted, 12 teams were invited to the hackathon offsite at the Vietnam tech hub. The sophistication and potentially high impact of the ideas blew me away. One idea was real-time location-based recommendations to bridge online and offline. Another involved social listening for customer next best action, to reduce friction in the customer journey. Ambitious and useful for customers! Hardworking rockstars filled the teams. They were a mix of full-stack engineers, data engineers and scientists, with some designers and project managers sprinkled in. They worked hard; most teams started before the hackathon—I learnt this was par for the course. The hackathon venue probably had the highest tech talent per square feet (in Vietnam) at that time—they could have founded companies there and then. Ideas and teams were assessed on requirements, feasibility, execution plans, and potential impact. After all, the winning idea would get precious prioritisation and resources—some other project would be de-prioritized. The winning team was expected to really execute, and execute really well. For the final pitch, teams had seven minutes to present and three minutes for Q&A. It was nerve-wracking yet insightful. The panel of 10+ judges were battle-hardened executives who fought, lost, and won many battles—we got a rare glimpse into their thinking process."
