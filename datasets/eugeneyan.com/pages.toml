["https://eugeneyan.com/writing/mailbag-ds-requirements"]
title = "Mailbag: Qns on the Intersection of Data Science and Business"
description = "Does DS have business requirements? When does it make sense to split DS and DE??"
full_description = "Hey V, these are great questions that get into the intersection of data science and business! I’m happy that you’re thinking about them. Yes, there’s often a set of requirements. I work with business to determine the benefit they would like to see (e.g., automating a process 95% of the time, improving revenue, etc) and the deliverables (e.g., an product categorisation API, a recommender system). This is done early so we don’t invest effort in deliverables that don’t get used. This depends. Initially, customers might want something more understandable (e.g., regression, decision trees), though the level of comfort varies across people. As we earn their trust, we get more free rein, including using more black box approaches. I seldom do web scrapping. I find that the effort required to clean up that data is usually not worth it. If I’m scraping it, I would probably use a combination of Selenium and Python libraries (e.g., beautiful soup, spacy). This usually depends on the size of the overall data team. As teams get larger and more mature, there’s usually a tendency to specialise—that’s when the roles are separated. Nonetheless, some teams (such as in StitchFix) deliberately keep have the generalist data scientist role so they do end-to-end. It’s hard to say how good is “good enough”. It’s an unbounded problem, almost like asking how much fraud caught is good enough. What I usually try to do though is to time-box it—how much does the additional model performance from better features cost? And then I work from there. Alternatively, you could try to brute force it and perform operations between each feature (e.g., add, subtract, multiple, divide) though this might lead to overfitting. Feature statistics help too. Have a question for me? Happy to answer concise questions via email on topics I know about. More details in How I Can Help. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
