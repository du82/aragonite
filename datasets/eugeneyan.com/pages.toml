title = "SortMySkills is now live!"
description = "A card sorting game to discover youl passion by identifying skills you like and dislike."
full_description = "It is a card sorting game to help users discover their passion by sorting skills into what they like and dislike using. Users sort 50 general skills into a 5-scale rating, ranging from “Love using (energizes me)” to “Neutral (has little or no effect)” to “Hate using (depletes me)”. However, only five skills can be sorted into “Love using”, making you decide which skills you truly enjoy—and should focus on. After sorting all the cards, it should provide a clearer picture of the skills you enjoy or dislike. Hopefully, this provides insight as to why certain aspects of your current role energizes or drains you. This also provides guidance on the role you should be in—one which allows you to apply skills you love a majority of the time. SortMySkills is a collaboration between Ken and me. Back then, we were both in IBM and a few years into our careers. We observed that our peers were not getting satisfaction from their careers and wondered how we could help them find clarity on jobs they would love. I shared about how I experienced similar dissatisfaction while in my previous role at the Ministry of Trade and Industry (MTI). To figure out the next step of my career, I reached out to my career counsellor at SMU, Tracy, and she introduced me to a similar card game. After sorting the cards—which took less than ten minutes—it became clear to me that there was poor skill alignment in my current role. My role in MTI required me to take verbatim notes (maintain records), budget and make arrangements for frequent overseas trips, sometimes taking up more than 75% of my time. These happened to be skills that severely drained me. In contrast, the skills I enjoyed such as analysis, working quantitatively, and forecasting were seldom applied. Thus, I decided to make a career switch to work closer with data. Ken and I spent our free time and weekends conceptualising and designing the game. Ken was the coding wiz, making the game easy and beautiful to navigate through Ruby while I researched on the skills to cover, game mechanics and concepts, and website copy."
