full_description = "Hi, I'm Eugene Yan. I design, build, and operate machine learning systems that serve customers at scale. I also write and speak about ML, RecSys, LLMs, and engineering. I'm currently a Senior Applied Scientist at Amazon where I focus on helping customers read more. Here, I built systems including real-time retrieval, bandit-based ranking, and recsys in search (see RecSys 2022 keynote). More recently, I'm exploring how LLMs can help us serve customers better. Previously, I led machine learning at Lazada (acquired by Alibaba in 2016). Here, I built the product ranking system (conversion & revenue up 5-20%), smart push-notifications (CTR & add-to-cart up 10%), and automated product & review classification (cost down 90%). Hypergrowth's fun! As an early hire in a healthtech Series A, I led the team to ship an ML system for Southeast Asia's largest healthcare provider. At IBM, I built job forecasts & recommendations. Outside of work, I share the ghost knowledge of applying ML via curated papers, guides, and practitioner interviews, and host a monthly meetup on ML in industry. I also angel invest in early-stage data/ML, infra, and devtool startups. AIterate Labs • How I can help • README • • I read everything but receive too much to respond to all of it. Eugene possesses a rare blend of technical knowledge, business acumen, capacity to learn, and passion for doing the right thing for the customer/business. Throughout his time with Lazada he proactively sought feedback and improved himself, going from strength to strength in delivery, team development and individual mentoring. It would be a pleasure and honor to work with him again. Eugene gave a very inspirational keynote at the OLX Group Product and Tech 2019 conference in Amsterdam and absolutely nailed it! Given his hands-on experience as a data scientist, he was able to share the nitty gritty details with a technical audience. On the other hand, he was able to take a helicopter view explaining trends and developments. Thanks once again!"
