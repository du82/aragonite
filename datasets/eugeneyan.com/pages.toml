["https://eugeneyan.com/writing/psych-grad-to-data-science-lead"]
title = "My Journey from Psych Grad to Leading Data Science at Lazada"
description = "How hard work, many failures, and a bit of luck got me into the field and up the ladder."
full_description = "Many people are curious about how I got into the field of data science with a Psychology degree. They’re curious how I made the first step. Then, they find out I was leading the data science team at Lazada and they’re interested in how that happened. (Spoiler alert: A lot hard work and some luck.) In a world where almost every data science leader has a technical Ph.D. (or two), I’m unusual. An anomaly. I guess this is why people are curious about my story. There’s perhaps also a bit of “underdog” dust in it. Enough people (10+) have asked to write this down—it’s just more scalable. I’ve included some key anecdotes and also distilled some lessons at the end. As much as I try not to appear boastful, my intent is to share what I’ve learned and help others get into and be successful in this field. Having just graduated with my degree in Psychology and Organisation Behaviour, I was unsure of what to do next. I’m a Social Science graduate! I could do anything! Or I could do nothing. I eventually got a role as an Investment Analyst for the government. I expected to use data to make better investment decisions. Which countries to invest in, which industries to focus on. However, it was mostly negotiation and legal work on Free Trade Agreements. I got bored. Out of curiosity, I started taking online courses (Coursera and EdX are great!) Those early data courses very super interesting, and convinced me that I was made for something greater. Or at least different. I had to get a data-related job. Luckily, IBM had a program to hire and train a cohort of mid-career professionals for data-related roles. It seemed like a long shot, but I decide to send in my resume anyway. Surprisingly, I got invited for interviews. (I didn’t have the right education or experience; I wouldn’t have considered myself!) Some questions on statistics, SQL, R, most of which I picked up through online courses. It was a gift from above when they sent me an offer. The 33% pay cut was tough to swallow. But I was pretty bored (read: miserable) as an Investment Analyst after two years, so I accepted."
