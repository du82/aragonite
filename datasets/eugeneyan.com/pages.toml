["https://eugeneyan.com/how-i-can-help"]
title = "How I Can Help • Eugene Yan"
description = "Guidelines on what I cannot, and can, help with"
full_description = "I enjoy helping, especially on the topics of ML, RecSys, LLMs, and engineering. For a while, I responded to every email, and had an open calendar that anyone could schedule time on. However, that became unscalable. Thus, here are some guidelines on what I can—and cannot—help on. If you’re still unsure, shoot me a DM or email anyway. Content collaboration, even if it’s paid. If I’m made to write about something that I’m not naturally interested in, it’ll probably suck. >50% of calls with startups involve this: The answer is always “No”. How to get your first job in data/machine learning or how to get into big tech. There’s plenty of people sharing their experience online, which includes how they applied, prepared, interviewed, negotiated, etc. Referrals if I don’t know you personally. This approach will most likely not work and I rather not get your hopes up. Investing in or advising your startup/team on data and machine learning topics, especially if applied in industry. This is my wheelhouse and I’m happy to help. How to structure a data team, frame an ML problem and design a system to solve it, working with LLMs, etc. Some of my thinking here. Reference checks on companies or managers if you’re considering a new job. I hear about data/ML teams in industry and may also be able to help via back channels. Introductions. Happy to provide intros to people I know, after checking with them that it’s okay. Do include a paragraph about yourself that I can send to them. Speaking at conferences or podcasts. Grateful for opportunities to share about building ML, RecSys, and LLM systems, building & leading data teams, etc. If it falls into any of these buckets, send me an emailI read everything but receive too much to respond to all of it. or schedule some time. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
