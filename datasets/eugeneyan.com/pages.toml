["https://eugeneyan.com/writing/seven-habits-that-shaped-my-decade"]
title = "Seven Habits that Shaped My Last Decade"
description = "I wish I started sooner. All have improved my life and several have compounding effects."
full_description = "Occasionally, I get questions about my habits. Why did I start writing? How has meditating benefited me? How did I start investing? Finally, I decided to write about them in this post. We are what we repeatedly do. Excellence, then, is not an act, but a habit. - Aristotle (and Will Durant) As I reflect and write, I realize they had a big impact on my last decade, and I believe you can benefit from them too. In this post, I’ll share seven simple habits, how to pick them up, how much effort they require (hint: minimal), and my progress so far. I find it harder to count the number of successful people that don’t read relative to those that do. When I ask someone how they picked up a life skill (e.g., negotiation, difficult conversations), they often refer to a book. Likewise, when people ask me for advice, I usually refer to books that helped on that topic. Taking machine learning as an analogy, books are like pre-trained models. They contain a lifetime of learning by the authors, condensed into a couple hundred pages. Take the shortcut by using these pre-trained models and fine-tuning them based on your own exploration and experience. How to pick up this habit? Just read any book that interests you. Fiction, non-fiction, Dan Brown, Cal Newport, anything. Reading is easy. That said, here are two ideas that helped me read—and enjoy reading—more. First, read a few books at a time. I alternate between a heavy technical book (Effective Python), a lighter non-fiction (How Not To Be Wrong), and a lightest no-thinking-required (Bad Blood). This way, depending on how much energy I have remaining, I always have a book to chew on. Second, recognize there are tree books and branch books. Tree books lay out a framework. Cedric Chin cites Thinking, Fast and Slow as a behavioral psychology tree book and High Output Management as a management tree book. Branch books build on tree books and usually expound on a single idea with lots of examples. Branch books can be skimmed while tree books might take more time."
