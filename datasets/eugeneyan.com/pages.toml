["https://eugeneyan.com/writing/values-and-superpowers"]
title = "Planning Your Career: Values and Superpowers"
description = "What do you deeply care about? What do you excel at? Build a career out of that."
full_description = "A typical career spans decades. As Cedric Chin writes, the first 10 years of a career is often considered early game. If we assume that it takes around 10 years to get good at something, and a few more years to faff around and find that thing, then having the first 10-15 years of a career appear to be a bit of a wash makes a ton of sense. — Cedric Chin But how do we find that thing? One way is to reflect and deeply understand our values and superpowers which then guide our career choices. It is extraordinary to discover that comparatively few people reach this level of maturity. They seem never to have paused to consider what has value for them. They spend great effort and sometimes make great sacrifices for values that, fundamentally, meet no real needs of their own. Perhaps they have imbibed the values of their particular profession or job, of their community or their neighbors, of their parents or family. Not to arrive at a clear understanding of one’s own values is a tragic waste. You have missed the whole point of what life is for. — Eleanor Roosevelt Start by understanding what you care about most. This fill-in-the-blank might help: “I care about being/having ____”. As we reflect on past experiences, the values that matter most should naturally stand out—what events led to higher-than-average fulfillment? Identifying our own values requires deliberately silencing the values imposed on us by society, parents, and friends. As we’re exposed to their values, we’re also primed by those values and may unconsciously adopt them as our own. You may also be tempted to google “values” to find a list to pick from—don’t! Instead, try asking yourself the following: After listing our values, we can order them via pairwise comparison. First, pick any two values and rank them in order of importance. Then, pick another value, compare it to each of the ranked values, and insert the new value in the right order. Continue until all the values are ranked. Ideally, there should be a clear hierarchy instead of a cyclic relationship such as scissors > paper > stone > scissors > …"
author = "Eugene Yan"
year_published = 2021
