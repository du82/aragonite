["https://eugeneyan.com/writing/what-i-do-during-a-data-science-project-to-ensure-success"]
title = "What I Do During A Data Science Project To Deliver Success"
description = "It's not enough to have a good strategy and plan. Execution is just as important."
full_description = "”A vision and strategy aren’t enough. The long-term key to success is execution. Each day. Every day.” – Richard M. Kovacevich Having a solid project plan (and development workflow) is half the battle won. However, execution can be tricky–it’s easy to lose sight of the goal or be lured by the sirens of shiny tech and sexy research. Here are some common pitfalls: To keep myself on track and execute effectively, I tried a variety of practices and habits. Here, I’m sharing those that worked best with you. This is part two (during) of a three-part series on data science project practices. Also see part 1 (before) and part 3 (after). Before designing a solution, I usually start with a literature review. How have other people framed the problem? What data did they use? What worked (and didn’t work)? The intent is to quickly identify approaches that have worked and build on them. It doesn’t have to be exhaustive; a week of research is usually enough. For example, when I was researching about how to build a product classifier, I found the following papers helpful: I learnt how other teams had cracked the problem and the results they achieved. The Chimera paper showed that manual labelling and hand-crafted rules helped to bootstrap the data and system before machine learning was introduced. The hard-won lessons from the papers informed much of my system’s design. Working based on others’ research doesn’t mean we can’t, or won’t, do innovation of our own. It’s just the first step towards an MVP we can quickly test with customers. Once we know we’re on the right track, we can do further in-house research. Here’s my repository of applied-ml papers, articles, and videos. I’d be grateful if you add other relevant materials or simply leave a star 😊 After we’ve surveyed the landscape of how to frame the problem and possible solutions, we’ll want to iterate through them quickly. This means running quick, albeit scrappy, experiments to assess for feasibility and narrow the search space."
