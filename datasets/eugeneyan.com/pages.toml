["https://eugeneyan.com/writing/favorite-productivity-coffee-routines-habits"]
title = "Routines and Tools to Optimize My Day (Guest Post by Susan Shu)"
description = "For years I've refined my routines and found tools to manage my time. Here I share it with readers."
full_description = "We all have that friend who has a full-time job, completed a part-time postgrad degree, and built an income-generating side business. Also, she exercises, reads, and writes. I don’t know. But today we’ll find out from our first guest: Susan Shu. She’s that productive friend I mentioned and she’ll share her routines and tools to optimize her day. Compared to my approach, hers is similar yet very different—you’ll see what I mean. Here’s Susan… I often find myself wishing for more hours in a day, especially when it seems I’ve bitten off more than I can chew - social events, full time work, and hobbies add up. I’m sure I’m not alone, and that you’ve probably felt this way too. While I haven’t quite figured out how to get more than 24 hours a day (it’s not sci-fi world, after all), I’ve had to build up a set of routines and find efficient tools that help me squeeze out more time. I write weekly on my blog and manage my video game studio on weeknights and weekends, in addition to working full time. In the past, these routines and tools have helped me ship a video game to consoles and Steam and finish a master’s degree part-time, so I’d say it’s fairly robust. Here, I share details of the routines and tools, in hopes that any portion of it can help you, too. And don’t worry: it’s not as intense as you might be thinking. In fact, a large portion of my routine was built off of the simple fact that I love coffee. And the tools I use might be surprisingly simple, including actually making use of those (many) free notebooks and journals handed out at conferences. So, with that preface, let’s jump right in! I wake at 6:00 AM every day, and rarely sleep in. This was an acquired “skill” due to forcing myself to put my alarm outside of my bedroom; once I have risen to turn off the alarm, it is easier to begin the day already. Even if I do feel groggy, the anticipation of the next step of my routine, making coffee, prevents me from going back to bed."
