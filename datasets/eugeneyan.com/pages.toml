["https://eugeneyan.com/writing/mailbag-senior-ds"]
title = "Mailbag: I'm Now a Senior DS—How should I Approach this?"
description = "Becoming a senior after three years and dealing with imposter syndrome."
full_description = "I recently got a job offer as a Senior Data Scientist at __. I’ve been working only as a data scientist for about three years, so I’m feeling quite a bit of imposter syndrome with this “senior” title. I wasn’t expecting this. I saw on your linkedin, you made it to senior after only a few years as a DS. Curious, how did you handle/approach this? I know that level definitions will depend on the company, but any insight here would be super valuable! Thanks Eugene. No rush to reply. The expectation of “senior” differs from org to org. Nonetheless, one thing is constant—the team has higher expectations of you and needs you to be a role model for entry-level DS. This could involve advising in design discussions, incorporating industry best practices, raising the bar in code reviews, suggesting effective ML techniques, etc. It’s a good thing. In my experience, I approached it like how I would with any job title—I contributed in the best way that I could to serve customers. The title didn’t matter much; it usually came after I was already performing at that level. Let me know if it needs clarification. All the best! Thanks Eugene! That makes sense, especially the part on focusing on the best way to serve the customers. Plus, it’ll force me to elevate my skillset and continuously improve. Have a question for me? Happy to answer concise questions via email on topics I know about. More details in How I Can Help. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
