["https://eugeneyan.com/writing/roam-to-obsidian"]
title = "Goodbye Roam Research, Hello Obsidian"
description = "How to migrate and sync notes & images across devices"
full_description = "I was bored over the weekend and migrated my notes from Roam Research to Obsidian. It was easier than expected and took under an hour. Here are the steps I took. First, I selectively followed this guide to download my notes as a zip file (steps 1) and create an Obsidian vault. Then, I downloaded the images in my notes into /assets (step 11). A few notes were in folders because they had / in the title; I cleaned these up by hand. As part of format conversion (step 4), I incorrectly enabled “Roam Research tag fixer”. As a result, my #tag and #[[tag]] were converted to [[tag]]. Fortunately, my tags always came after tags: and were on the first line of each file. Thus, I wrote some basic regex to fix it. Next, I set up obsidian-git for syncing across devices. Installation on Mac and mobile was straightforward. The first sync took seconds and subsequent syncs were under a second. Syncing images was trickier as git doesn’t do well with large commits. For my 1k+ existing images (mostly screenshots of talks and papers), I iteratively committed those that were less than 1,024kb in size. Images greater than 1,024kb were shrunk—by converting image format from png to jpg—before committed. Syncing the images to GitHub took about 15 minutes. New images will be synced via obsidian-git. I’m loving Obsidian so far. It feels snappier than web-based Roam during startup and while using it. It’s also more customizable. I don’t foresee it hindering my Zettelkasten workflow. While I have a forever-free Roam graph (I was an early adopter) and there’s no push factor, I’m going to stick with Obsidian for a bit and see how it goes. Yan, Ziyou. (Jan 2023). Goodbye Roam Research, Hello Obsidian. eugeneyan.com. https://eugeneyan.com/writing/roam-to-obsidian/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
