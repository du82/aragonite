["https://eugeneyan.com/speaking/data-scientist-day-to-day"]
title = "CareerFair - Day-to-day as an Applied Scientist at Amazon"
description = "What's an average day like? What's great about the role? How's working in Amazon?"
full_description = "For a data scientist, what does an average (and non-average) day look like? What’s great (and not so great) about the role? How’s working in Amazon like? I recently had an interview with CareerFair where we discussed these questions and more. (They also have other interviews with professionals in marketing ops, customer success, and engineering.) Here’s the interview write-up. Hi, I’m Eugene Yan. I work at the intersection of consumer data & tech to build machine learning systems to help customers. I also write about how to be effective in data science, learning, and career. Currently, I’m an Applied Scientist at Amazon helping users read more, and get more out of reading. We build book recommendation systems and contribute to efforts in discovery (e.g., search). Previously, I led the data science team at Lazada (acquired by Alibaba in 2016) and worked on e-commerce ML systems (e.g., ranking, automation, fraud detection). First, a disclaimer: Even for people with the same title (i.e., applied scientist), the average day will look different. It will also vary with the project’s lifecycle, such as research, prototyping, development, and maintenance. My role mostly involves prototyping and development. I’m struggling with this question as most days don’t seem average. Nonetheless, here are some exceptional events that may come up: I really enjoy working with data. Through data (e.g., search logs, clickstreams, transactions), we understand our customers and how they interact with our platform and products. The data reveals interesting patterns in human behaviour. For example, consumption changes due to life-stages (e.g., becoming a parent) and socio-economic events (e.g., COVID-19, work from home). By understanding our customers better, we can serve them better. I also enjoy applying machine learning. While data helps us understand customers, there’s far too much for a person (or even a large team) to process. Machine learning (algorithms) can help with this. For example, machine learning helps (i) automatically classify products and audit product reviews (ii) identify fraudulent sellers and products, (iii) recommend products to customers given their historical preferences, etc. Data and machine learning helps to write software 2.0."
