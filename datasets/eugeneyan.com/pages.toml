["https://eugeneyan.com/writing/2022-in-review"]
title = "2022 in Review & 2023 Goals"
description = "Travelled, wrote, and learned a lot, L5 -> L6, gave a keynote at RecSyS, and started a meetup."
full_description = "2022 was a peaceful year for me. While it’s been an anxious 4th quarter for tech, especially if you were affected by layoffs, the overall year has been kind to my family and me. Now that Latte’s grown up (18 months old), my wife and I got to travel more. First, back to Singapore, then Vancouver, Hawaii, and New York. We also explored Washington (e.g., Mount Vernon, San Juan Islands) and hiked a lot over summer. And despite some of us catching Covid, my immediate and extended family continues to stay healthy. Write 26 posts: Partially completed (18/26). While it wasn’t a deliberate goal, I found myself focusing on topics that fit the Start Here page, especially technical subjects such as bandits, counterfactual evaluation, design patterns, Python, pipeline testing, text-to-image, etc. I learned a lot while writing them and got feedback that they were helpful. I’m also pleased with a few non-technical pieces such as data team red flags, onboarding effectively, writing weekly 15-5s, and simplicity vs. complexity. Work with an editor: Not started. I procrastinated as I wasn’t sure how to work with an editor on my writing, especially the more technical pieces. Learn something new: Completed. I had the opportunity to learn about and apply bandits, counterfactual evaluation, text-to-image, pipeline testing, etc. at work. Also, while in Hawaii, my wife and I learned to surf! 3 mentees reaching the next level: Partially completed (2/3). One mentee got promoted to a lead role with direct reports while another switched orgs to lead a new team. Learn Julia: Deprioritized to focus on machine learning techniques, engineering, and PyTorch. Will probably not pursue unless there’s increased industry adoption. Continue angel investing: Completed. I’ve been getting feedback on how my previous investments did and refined my investment thesis on founding team, TAM, market pull, etc. While I continued investing in 2022, it’s reduced relative to previous years. Promoted from L5 to L6 in Q1. I felt that I was performing at the L6 level since early 2021 and it was reassuring to be recognized for it. This comes with more responsibility and work and I welcome the opportunity to stretch. One of my goals in 2021 was to focus more on ML strategy and product; I think working on this helped with the promo, and becoming an L6 opens doors to do more of it. Excited to focus more on it."
