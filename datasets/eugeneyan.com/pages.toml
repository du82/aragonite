title = "2024 Year in Review"
description = "A peaceful year of steady progress on my craft and health."
full_description = "2024 was a peaceful year of steady progress. With regard to my craft, the prototypes of 2023 were scaled and put into production, and I rediscovered the joy of building in public. On the personal side, I continued the prior year’s focus on health, further improving my diet and exercise habits, leading to measurable results. ✅ Work: Shipped ML/LLM systems that serve customers at scale. 2024 was the year of productionizing the prototypes of 2023. I learned how to deploy these systems reliably, at scale, and cost-effectively, for both customer-facing UXes and internal pipelines. A major highlight was collaborating with several friends to write What We’ve Learned From a Year of Building with LLMs. This was also published on O’Reilly as a book and technical series (parts I, II, III). On public speaking, while it isn’t an explicit goal, I try to speak once a year for the sake of practice. In 2024, I was invited to speak at Netflix’s internal RecSys conference, deliver the closing keynote at the AI Engineer World’s Fair with my fellow authors, and judge the Weights & Biases LLM-Judge hackathon. Also, I got to present my paper on detecting factual inconsistencies at the Amazon Machine Learning Conference. ✅ Health: Further improved my diet and exercise habits. After avoiding jogging in the first half of 2024, I restarted in June. I also bought a body fat scale on Prime Day in July, and inspired by this tweet, I began intermittent fasting by skipping breakfast. Overall, I’m now exercising daily with a slight calorie deficit. 🟠 Travel: One of two planned trips completed. We traveled to Alaska to catch the Northern Lights (November 2024 - March 2026 is the the peak of the 11-year Solar Cycle). Next we have a snowboarding trip to Hakuba Valley in Febuary 2025. ❌ Snowboarding: Did not do a black run in 2024. In hindsight, this was a stretch given our limited time on the slopes (~5 times a year). We ended 2024 with a lesson to get more comfortable on the blue runs. With our upcoming Hakuba Valley trip and a few more sessions on Crystal, we’re hoping to get comfortable enough to attempt a black run in 2025."
