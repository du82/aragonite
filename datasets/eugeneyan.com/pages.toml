["https://eugeneyan.com/writing/omscs-cs6750-human-computer-interaction"]
title = "OMSCS CS6750 (Human Computer Interaction) Review and Tips"
description = "OMSCS CS6750 (Human Computer Interaction) - You are not your user! Or how to build great products."
full_description = "You might also be interested in this OMSCS FAQ I wrote after graduation. Or view all OMSCS related writing here: omscs. Over summer in 2019 I took another of Prof David Joyner’s classes: Human-Computer Interaction. (I did Education Technology during summer 2018). Like all of Prof David’s courses, it was extremely rewarding, organized yet unstructured, lots of writing, and felt like a mini-thesis / exercise in industrial design. In my day to day job, I build machine learning systems and APIs for both internal and external users. Sometimes, adoption isn’t as smooth or straightforward as I hoped, and I wanted to improve my abilities in product and interface design to lower the barriers for adoption. This includes better understanding of product and interface design methods, having a guiding framework to ask users the right questions, and processes to iterate and improve on design quickly. I’ve taken courses by Prof David before. Education Technology was a blast—very well run, a lot of writing practice, and I learnt a lot about how to scale and make education more accessible. (The result of this was publishing a MOOC on Effective Data Science). Thus, it was an easy choice to take another course by Prof David. In addition, I wanted further practice on my writing skills. At work and in my recent classes, most of the writing has been code. Thus, I wanted an opportunity (and the context) to push myself to write more content and material. Note: I took the course over summer—the course in the spring and winter semesters will likely vary. Like all of Prof David’s classes, HCI is extremely well organised—you can find the full outline here. Overall, there’s zero to minimal coding involved, and A LOT of writing. It comes across as more of a course on industrial design. The bulk of the work involves researching, needfinding, and redesigning two (distinct) interfaces. These interfaces need not be digital—I’ve seen examples of people redesigning shower taps and shove hobs."
