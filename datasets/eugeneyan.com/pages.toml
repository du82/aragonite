["https://eugeneyan.com/writing/how-to-update-github-profile-readme-automatically"]
title = "How to Update a GitHub Profile README Automatically"
description = "I wanted to add my recent writing to my GitHub Profile README but was too lazy to do manual updates."
full_description = "Today I learnt how to set up my GitHub profile README to automatically update with the latest writing from this site. It’s now set to run every day at midnight. It’s nothing too complex. Simon Willison shared how to do this with GitHub Actions and it seemed like a fun afternoon project (and it was). And I thought an hour or two of work would save hours of future manual updates. This site is set up with an Atom feed that RSS readers (e.g., Feedly) can aggregate with. Getting the latest writing with Python’s feedparser is simple. Based on how your dates are formatted, you might need to update the regular expression. My README has a section for “📝 Recent Writing” which I update with the results from fetch_writing(). This is done by searching for comment blocks for “writing” (e.g., <!-- writing starts -->) and replacing everything between them. We’ll want to set up GitHub Actions to run this workflow automatically. Currently, it runs with each push and at midnight daily. There’s also the ability for one-click build (which is pretty cool). Now that it’s set up, no more manual updating of the README with each new post. Here’s how it looks like now, without this current post. By the time you visit my GitHub profile, the “📝 Recent Writing” section will be updated to include this post, or (if you’re visiting it more than a month from now) be updated with a new set of recent posts. Yan, Ziyou. (Jul 2020). How to Update a GitHub Profile README Automatically. eugeneyan.com. https://eugeneyan.com/writing/how-to-update-github-profile-readme-automatically/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
