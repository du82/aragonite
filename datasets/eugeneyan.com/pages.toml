["https://eugeneyan.com/writing/what-i-learned-from-writing-online-susan-shu"]
title = "5 Lessons I Learned from Writing Online (Guest post by Susan Shu)"
description = "Susan shares 5 lessons she gained from writing online in public over the past year."
full_description = "When I first started my blog, writing how-to guides which I thought that less than 5 people would read, I could never have predicted how far it would come. Writing this blog has helped me make friends around the world, be invited to speak at numerous conferences, and more. Many of these conversations started with “I really enjoy reading your blog, Susan!” Behind the scenes, it is tough work. Even after a year of writing and posting weekly, I’m still learning. I still struggle with deciding on a topic to write about, wondering if I’m really someone that knows enough about the topic. I still look at my articles and see too many ways to improve them. Overall, I am happy and grateful about my writing trajectory so far, and here I will share the top 5 lessons I learned from writing in public with you. In the beginning, it took me weeks to write one single post, and I would spend yet another week or more on editing the posts again and again. Eventually I settled on a process to write faster, including learning to avoid using backspace during my first drafts. This technique helps to separate the idea generation phase from the idea destruction phase (editing), which prevents me from getting stuck. This habit of resisting the urge to edit and polish as I write, has done wonders for my writing speed - not only for my blog writing, but also for making slides, preparing conference talk material, and so on. Before I published my very first blog post, I hesitated for a long while. I wondered if it would be an embarrassing piece of writing, and doubted whether I should post it in the first place. In the end, the hope that “this blog post might be helpful to someone” won out. Overcoming that first hurdle was inexplicably difficult, but it felt like a weight off my shoulders once I had posted my first piece of writing. If you are interested in writing (and posting it), but are feeling shy, getting started is the best way to overcome that. It’s much easier to get started with a topic that interests you, not what you think “would be popular” or that “the most people would want to read”."
