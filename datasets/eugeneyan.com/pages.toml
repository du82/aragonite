["https://eugeneyan.com/speaking/amazon-science-feature"]
title = "Amazon Science - Eugene Yan and the Art of Writing about Science"
description = "Why the Amazon applied scientist takes the time to break down his work for readers."
full_description = "Eugene Yan’s career path has taken some unusual turns, but his motivation has always been the same: understanding people so he can help them. A policy analyst turned data scientist, Yan is now an applied scientist at Amazon using customer-behavior data to help recommend the best products. In the world of machine learning, however, he’s best known for the way he writes it all down. On his personal site, Yan covers a range of professional and technical topics like machine learning systems, data science methodology, dealing with imposter syndrome, and building data science teams. Eugene Yan started eugeneyan.com in 2020, focusing on general machine learning and career content. Initially it was for personal development, but then people started reading, and now writing posts takes up the majority of his leisure time. He started the site for personal development, but then people started reading, his network started expanding, and now writing posts takes up the majority of his leisure time. “It snowballed,” he said. “Writing helps me learn better. And when I share it online, it attracts like-minded readers and helps me make new friends. ” Born in Singapore, Yan studied psychology at Singapore Management University. “I was curious about people, how they perceive, and how they behave,” he said. His college research focused on how competition affects people differently, motivating some and intimidating others. After college, he joined the Singapore government as a policy analyst sifting through legal cases and trade agreements. But it wasn’t long before he began to miss crunching numbers and following the data on human behavior. “I envied my colleagues in commodities who used on numbers and worked with spreadsheets,” Yan said. He decided to try and make the switch to a data science position based on some familiarity with the subject from his undergraduate research days. He landed a position at IBM in 2013, and from there he moved to data science roles at Lazada, a Southeast Asian e-commerce site, and then UCARE.AI, a healthcare startup."
