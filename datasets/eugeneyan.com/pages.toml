["https://eugeneyan.com/writing/intent-vs-requirements"]
title = "Traversing High-Level Intent and Low-Level Requirements"
description = "How they differ and why they work better in different situations."
full_description = "Have you noticed how, when given a nebulous high-level intent, some people run with it and break it down into smaller problems, while others freeze and don’t know how to begin? On the other hand, when given a detailed 10-page product requirements doc, the former grumbles that it’s too specific while the latter checks the boxes off chirpily? Why does this happen? I try to answer by distinguishing between high-level intent and low-level requirements and discuss a few factors that influence when to use which. High-level intent excludes the details and focuses on the “why” and “what” while low-level requirements dive into the “how”. Put another way, intent zooms out on the big-picture forest while requirements zoom into the detail trees. Consider programming languages. Low-level languages such as assembly provide little abstraction from computer instructions; we work with machine language and primitives. In contrast, high-level languages like python provide a lot of abstraction and let us write instructions that generate machine instructions. Low-level languages are closer to the machine; high-level languages are closer to the user. Similarly, low-level requirements are closer to technical details while high-level intent is closer to business goals. Low-level requirements define how the product should work. Functional aspects include the customer experience, input/output, and user interface mocks. Non-functional aspects include expectations on latency (80ms@p99), scalability (8,000 queries per second), and security (AAA certified). Some examples I found online are Ohio State University’s sample requirements doc and the Federal Demonstration Partnership’s (FDP) requirements for an expanded clearinghouse. The latter includes low-level requirements such as: High-level intent communicates the expected outcome (what) and rationale (why). Specifying only the outcome is sometimes not enough; it must be paired with the rationale for context. For example, the outcome of introducing new products on an e-commerce platform requires different approaches for different rationales. If the reason is to increase novelty from the customer’s perspective, we consider metrics such as diversity and serendipity. If the reason is to increase seller health from the marketplace’s perspective, we might consider metrics such as count of sellers with at least x sales in the past week and proportion of sellers making up y% of sales."
author = "Eugene Yan"
year_published = 2022
