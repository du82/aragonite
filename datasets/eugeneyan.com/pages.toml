full_description = "I was recently invited by DataScience SG to join a panel discussing the various roles in data (e.g., data scientist, machine learning engineer, data engineer, data analyst, etc.) They were looking for someone who had experience hiring across the different roles and I was happy to share my experience. Considering that it was a Thursday night, it was a great turnout where >200 people showed up at Google’s Auditorium to attend and ask great questions. Ever wondered what the different data roles like AI researcher, data scientist, big data engineer, machine learning engineer, and data analyst entail? What are skills needed to join their ranks? What role is suitable for you? Let us kick off 2019 with a panel of great data people to answer your burning questions about the data industry and what it takes to have a successful data career. Most panellists were motivated by being able to create an impact through work while tedious documentation was someone de-motivating (lol). Even after moocs, bootcamps, and formal education programs, continuous self-learning is essential in order to improve and keep up with the rapid industry advancements. The internet is abundant with resources for self-learning such as moocs, youtube videos, and great articles (Some suggested resources here). Yan, Ziyou. (Jan 2019). DataScience SG Meetup - Panel On the Different Roles in Data. eugeneyan.com. https://eugeneyan.com/speaking/different-roles-in-data-talk/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
