["https://eugeneyan.com/writing/informal-mentors-chip-huyen"]
title = "Chip Huyen on Her Career, Writing, and Machine Learning"
description = "Setbacks she faced, overcoming them, and how writing changed her life."
full_description = "Recently, I had a chat with Chip Huyen, a computer scientist and writer. She’s someone I greatly admire. I had read about her life and career and was curious how she did it. Little did I know that her story is more inspirational than I had thought. She went from learning English on her own, to attending Stanford, and then joining NVIDIA and now, SnorkelAI (with plenty of setbacks in between). We also chatted about her love for writing and how it changed her life, as well as her thoughts on machine learning in production. Hi, I’m Chip Huyen, a writer and computer scientist. I develop tools and best practices for bringing ML research into production. While in high school, I became obsessed with Stanford. People thought I was crazy—I grew up in a small village and didn’t learn English as a child. Even though everyone told me to apply to easier colleges, I had eyes on only Stanford. So when I got rejected, I didn’t know what to do next. A speaker I met at a conference in Malaysia offered me a job. I took the job and went to visit Brunei for 3 days. There, a lady offered to drive me back to Malaysia and I thought: “Wow, crossing borders is that easy.” So I decided to keep on crossing borders to see how far I could go. That’s how the 3-year trip started. While traveling in those three years, I wrote a lot. I hosted a newspaper column and published two books. As a result, my English and writing got better. The second time I applied, I was a different candidate. Character development, I suppose. Also, all that writing practice helped me write better admission essays. I didn’t have a lot of success. Many of the roles I applied for didn’t work out. I was bad at selling myself. I guess this is part of the Asian culture where we don’t like to market ourselves. While attending the career fair in my first year, I received feedback that I still remember till today: “Wow, your resume is really sparse”. I got rejected for most the summer internships I applied for and spent time conducting research on campus instead. (Author’s note: She was a research assistant in the Astronautics Department)."
