["https://eugeneyan.com/writing/when-giving-your-100-gets-you-less-than-85"]
title = "The 85% Rule: When Giving It Your 100% Gets You Less than 85%"
description = "I thought giving it my all led to maximum outcomes; then I learnt about the 85% rule."
full_description = "Yesterday, I learnt about “The 85% Rule” from Hugh Jackman. He shared about it during his podcast with Tim Ferriss. Here’s how he explained it: ”A sprint coach was studying Carl Lewis, for a year, and couldn’t understand why Carl was always last or second last at the 40-meter mark, but then go on to win the 100-meter sprint. Eventually, he realised that Carl Lewis did nothing at the 50-meter mark; his breathing and form was exactly the same. Other runners would try to push harder, clenching their fists, scrunching their faces. But Carl Lewis stayed exactly the same—and go on to breeze past the others” Hugh observed that all great athletes have relaxation. He hypothesized that most Type-A athletes would run faster if they ran at 85% capacity—instead of 100%—because it’s more about relaxation, form, and optimising the muscles. Tim agreed that in most activities, being overly tense works against giving your best performance. Hugh shared that he had that problem, of pushing himself too hard, and found the 85% rule to work well for him. Giving your 100% usually leads to maximum performance and results. But overdoing it can backfire, leading to injury, over-exhaustion, and burnout. Be kinder and patient with yourself. Instead of working out every day, have off-days so your muscles can recover. Instead of consuming only “productive content”, enjoy the occasional light fiction or movie. Instead of compressing downtime (to get more done), schedule breaks, meditate, and have the occasional walk. Instead of checking everything off your to-do list, it’s okay to let them flow over. This 85% rule will take some getting used to but let’s give it a shot. It could lead to better outcomes in the long run. At the very least, it’ll help with enjoying life more. Yan, Ziyou. (Jul 2020). The 85% Rule: When Giving It Your 100% Gets You Less than 85%. eugeneyan.com. https://eugeneyan.com/writing/when-giving-your-100-gets-you-less-than-85/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
