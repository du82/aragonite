full_description = "Exception speakers would share about the challenges, failures, solutions, and outcome from their professional and personal projects. Especially insightful were the failures and their thought process on how to overcome them. Having just completed a small personal project on recommender systems over the holidays, I decided to share at the first meetup of the year for DataScience SG. The audience was very active and engaging, and it made the couple hours spent working on slides worth it. The feedback received on the project was useful, and it was great practice for public speaking. The talk covers my efforts over the past few weeks exploring the baselines for recommender systems and mixing in novel approaches from graph and NLP. It discusses the end-to-end, from data acquisition (of Amazon data) and preparation, implementation of various recommenders, optimization, and result comparisons (metrics, runtime, etc.). Interested in learning more? Links to the slides and associated articles below. (Warning: The slides have plenty of metrics, tables, and graphs and could be headache inducing 😵) Yan, Ziyou. (Jan 2020). DataScience SG Meetup - RecSys, Beyond the Baseline. eugeneyan.com. https://eugeneyan.com/speaking/recommender-systems-beyond-the-baseline-talk/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
