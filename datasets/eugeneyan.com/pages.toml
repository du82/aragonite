["https://eugeneyan.com/writing/2021-year-in-review"]
title = "2021 Year in Review"
description = "Met most of my goals, adopted a puppy, and built ApplyingML.com."
full_description = "2021 has been kind to me. After moving to Seattle (from Singapore) at the start of 2020, I’ve enjoyed my work at Amazon where I help customers discover books and read more, and learned a ton in the process. My wife and I had the chance to visit a few US states as well as enjoy Seattle’s beautiful nature. My immediate and extended family has stayed healthy. This peaceful backdrop allowed me to make progress on my goals, as well as take on unplanned “projects”. Write 48 posts, including six informal mentor and six teardown pieces. Excluding this post, I’ve written 34 posts this year—thus, the overall goal was a miss. That said, part of the goal was six teardowns and six informal mentor interviews—this was a success. I wrote seven tear downs, mostly on recommendations systems. These took more effort than regular posts given the research and organization required, but I also learned a lot writing them. I also started a new project and got nearly two dozen informal mentor interviews and made just as many new friends. Give 4 talks. I gave 10 talks/podcasts this year and met the goal. Along the way, I learned that I didn’t enjoy giving talks where I was mostly repeating myself. I spent too much time preparing slides that were largely summaries of what I had previously written about. Will probably scale this down in 2022. Receive 100 “this is awesome/helpful” feedback. I hit 100 sometime in June or July and stopped counting. 3 - 6 mentees achieving the next level. A handful of mentees and folks that reached out for advice grew in 2021, either by getting promoted and getting bigger scope, or transitioning into their next role/dream company. Thus, I consider this a success. 1 - 3 start-ups invested in/advising. Several founders reached out for advice and feedback, and offered the opportunity to angel invest. (They learned about me via my writing or VC introductions.) I invested in two that I’m excited about and want to see succeed—one in the ML production/marketplace space and one in the cloud infra space. They’ve made tremendous progress in the past couple months and I’m looking forward to more. I also made a handful of angel investments via AngelList as an LP."
