["https://eugeneyan.com/writing/product-categorization-api-part-2-data-preparation"]
title = "Product Classification API Part 2: Data Preparation"
description = "Cleaning up text and messing with ascii (urgh!)"
full_description = 'This post is part 2 of the series on building a product classification API. The API is available for demo here. Part 1 available here; Part 3 available here. (Github repositiory) In part 1, we focused on data acquisition and formatting the categories. Here, we’ll focus on preparing the product titles (and short description, if you want) before training our model. We’ll have products within our data that are categorized incorrectly. How do we exclude these mis-categorized products from our training set? Here’s one approach: If two products have the same title but different category, we assume that at least one of the products is mis-categorized (and the data is dirty). Extending on the above, as we take steps to prepare our data, we’ll be measuring data “purity” at each step. In this instance, purity is defined as: This measures the proportion of products that have the same title and same category in our data. The higher the purity, the cleaner we can assume our data to be. At the end of the data preparation, we’ll be able to identify which products are “impure”. Given that we’re unable to distinguish between correctly and incorrectly categorized products, we’ll exclude them from the training of the model. The titles need a bit of cleaning and preparation before we can train our model on them. In the next steps, we’ll go through some sample data cleaning and preparation procedures. It’s not uncommon to find non-ascii characters in data, sometimes due to sellers trying to add a touch of class to their product (e.g., Crème brûlée), or due to errors in scraping the data (e.g., &quot, &amp, &nbsp). Thus, before doing any further processing, we’ll ensure titles are properly encoded so that Crème brûlée -> Creme brulee, åöûëî -> aouei, and " & -> “ & ‘. Lowercasing titles is a fairly standard step in text processing. We’ll lowercase all title characters before proceeding. One common way to tokenize text is via nltk.tokenize. I tried it and found it to be significantly slower than using regular regex. In addition, writing our own regex tokeniser gives us flexibility in excluding certain characters that are being used as a split character.'
author = "Eugene Yan"
year_published = 2016
