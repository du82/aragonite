["https://eugeneyan.com/writing/how-to-keep-learning"]
title = "How to Keep Learning about Machine Learning"
description = "Beyond getting that starting role, how does one continue growing in the field?"
full_description = "An edited version of this essay was published in The Batch, a newsletter by DeepLearning.AI. Here’s the original version—which do you prefer? Machine learning progresses fast. Word2vec (2013) replaced the use of one-hot encoding with word embeddings. Transformers and self-attention (2017) parallelized a previously sequential training process and was adopted across most NLP tasks and even computer vision and recommendation systems. Spark (2014) eclipsed Hadoop as the big data tool of choice, while TensorFlow (2015) and PyTorch (2016) succeeded Theano and Torch. How do we keep up with the deluge of new papers and tools? Here’s what worked for me as I continue to learn about machine learning (or really, anything in general). Try something different in each new project. If you typically use pandas for data processing, try Spark or Dask. If you usually rely on decision trees for machine learning, experiment with deep learning. While your exploration may not pay off immediately in the current project, it paves the way towards solving previously unapproachable problems (e.g., big data that can’t fit in memory, machine learning on unstructured data). Regardless of whether it works, share what you learned with your team so they also benefit from your exploration. A 10-minute demo or short blog post will do. Just be sure to balance the explore-exploit trade-off and time-box yourself, so the project doesn’t get derailed. Do a personal project that stretches you. It’s a practical way to gain hands-on experience outside of work. It could be learning a new programming language, trying a new framework, or building an app. Pick a project that aligns with your interests. This makes it more fun and thus more likely to finish. Also, good projects are scary—if you’re not worried about failing, it’s probably not challenging enough to provide much learning. Personally, I’m motivated to finish projects where I can help others, learn something new, and have fun along the way."
author = "Eugene Yan"
year_published = 2022
