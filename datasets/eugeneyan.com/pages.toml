["https://eugeneyan.com/writing/one-way-to-help-a-data-science-team-succeed"]
title = "One way to help a data science team innovate successfully"
description = "If things are not failing, you're not innovating enough. - Elon Musk"
full_description = "The Lazada Data Science team has paper lunches together every Friday. Usually, we discuss about new papers we read, new ideas and implementations we tried, etc. This past Friday, we invited some special guests from Aviva to discuss about our journeys in cultivating a data-driven culture and building data science into the organization. Some can transition successfully from traditional actuarial statistics to customer-based data science—but most fail Aviva is very strong in what most would consider traditional aspects of data science involving risk, actuarial statistics, etc (it’s over 300 years old, and is the second oldest institution in England after the Bank of England—of course it’s good!). However, as it tries to build new capabilities around understanding the customer better and customer analytics, Aviva found that not many of its data scientists could transition successfully. Being always on the lookout for features that distinguish a top performer from the rest, this piqued my interest. What was it that those people who transitioned successfully had/did, I asked. Ah-ha! While the personality characteristic of being open to change helped these data scientists transition, there was also the right environment and culture in place, I opined. In data science—and more generally, technology—innovation is essential in order to create greater impact and add greater value. Data science has a science component to it—and science involves experimentation and R&D. Thus, data science teams must be given leeway to experiment and fail, or no groundbreaking innovations can occur. Yan, Ziyou. (Feb 2017). One way to help a data science team innovate successfully. eugeneyan.com. https://eugeneyan.com/writing/one-way-to-help-a-data-science-team-succeed/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
