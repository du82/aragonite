["https://eugeneyan.com/writing/anti"]
title = "A Spark of the Anti-AI Butlerian Jihad (on Bluesky)"
description = "How the sharing of 1M Bluesky posts uncovered the strong anti-AI sentiment on Bluesky."
full_description = "Recently, a dataset of 1M Bluesky posts unexpectedly sparked backlash from the Bluesky community. This incident uncovered strong anti-AI sentiment among Bluesky accounts, leaving the AI community feeling unwelcome on Bluesky. This write-up reflects on what happened, hypotheses on why it happened, and how the data/AI community responded. Bluesky, 26th November 2024: A developer shared about the one-million-bluesky-posts they had collected from Bluesky’s public firehose API. It contained post text, metadata, and information about media attachments like alt text, and was hosted on Hugging Face. However, many Bluesky accounts reacted with aggression. There were profanity-laced comments. There were accusations of theft, privacy violations, and unethical behavior. There were calls for legal repercussions. And there were death threats. Within 12 hours of sharing the dataset, the developer took it down. They followed up with a post on Bluesky acknowledging that the dataset collection lacked sufficient transparency and consent, and apologized. IMHO, the intentions were positive and the transparency was commendable. Such datasets enable research on social media patterns, content moderation, and training language models. The dataset description also explicitly prohibited problematic uses like building bots, generating fake content, or extracting user’s personal information. (To be frank, any well-intentioned data/ML/AI practitioner could have compiled a similar dataset.) Regardless, the dataset’s release gave us a glimpse of a potential Anti-AI Butlerian Jihad on Bluesky. Because of the developer’s affiliation with Hugging Face, many of their researchers and developers found themselves added to Anti-AI blocklists. On Bluesky, users can create lists to curate feeds or mass-mute/block accounts. It’s likely many accounts discussing ML/AI topics were added to such lists and blocked; I know I was. In a somewhat cheeky response, new datasets emerged within 24 hours. One developer posted (on Bluesky) about releasing two-million-bluesky-posts; as a result, they had their account suspended and then reactivated by Bluesky’s moderation team. Others shared 20-million-bluesky-posts, and bluesky-1M-metaposts that discussed the original dataset. Overall, this demonstrated the ease of collecting bulk data from Bluesky’s API."
