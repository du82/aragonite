["https://eugeneyan.com/writing/you-dont-need-another-mooc"]
title = "You Don't Really Need Another MOOC"
description = "Stop procrastinating, go off the happy path, learn just-in-time, and get your hands dirty."
full_description = "Don’t get me wrong, I love MOOCs. They’re great for trying to learn a new programming language (e.g., Python, Scala) or framework (e.g., Spark, TensorFlow) or subject (e.g., statistics, machine learning). The structured learning environment, excellent teaching, and exercises (and solutions) guide us through the best way to learn new concepts. But most of the time, we don’t really need it. If we already know machine learning, taking that shiny new MOOC won’t help with applying it more effectively. Doing another Python tutorial won’t help with writing better code. Most MOOCs follow the Pareto Principle and teach students the 20% they need to achieve 80% results. Thus, past the first or second course, our learning tapers off. (Also see Susan’s view on diminishing returns.) Sometimes, new MOOCs become a reason to procrastinate, or worse, a self-handicap. You know this is happening when you hear yourself, or something else, having these thoughts: Watching lecture videos isn’t learning—it’s passive consumption. We sometimes equate taking an MOOC, or reading a technical book cover to cover, with learning the material. But how often do we struggle when we try to apply the technical knowledge or skills at work? Children don’t learn to ride bicycles via how-to videos. Similarly, we can’t learn how to program or apply technical knowledge just solely watching videos. Most good MOOCs or tutorials will provide hands-on practice. However, that hands-on practice will lie on the happy path. We can copy-paste the code and it’ll work. This makes sense as there’s a lot of material to cover and we don’t want to spend time debugging, doing prep work, or solving problems via trial and error. Students will lose patience, causing completion rates to drop. Being on the happy path makes it easier to complete MOOC after MOOC. However, when we try to apply what we’ve learned—either at work or on a personal project—it becomes much harder. This is because we’re now off the happy path. And this is a good thing!"
