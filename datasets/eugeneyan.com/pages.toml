["https://eugeneyan.com/writing/influencing-without-authority"]
title = "Influencing without Authority for Data Scientists"
description = "Show them the data, the Socratic method, earning trust, and more."
full_description = "As data scientists, we work with other teams such as infra, engineering, and product to ship our machine learning systems. These teams have their own—sometimes competing—priorities, and everyone has limited resources and time. Our request is important, but so is everyone else’s. Without authority, how can we influence so our request gets prioritized? Or consider another scenario: You’re the new joiner on a team. You spot a critical flaw in the design, or have an idea which you’re convinced is the better approach. How do you share your insight or suggestion with senior members, and influence the needed change? Here’s some advice I found helpful on influencing without authority. Though the context and examples mostly related to data science, it applies to tech roles in general. We’ll start with simple practices you can adopt immediately, before going into principles and mindsets that may take more time and effort. I shouldn’t even need to say this, right? You’re a data scientist, data is your superpower. Use data to demonstrate why your idea or suggestion is valuable. Nothing makes a point like numbers showing customer or business benefit in terms of dollars, reduced return rate, NPS, etc. Bring your analyses and A/B test results. And data doesn’t just mean quantitative data. Anecdotes, research findings, and qualitative data count too. For example, you might be considering various ways to serve ML models (e.g., AWS EC2, SageMaker, Kubeflow, self-managed fleet). Share your findings on the pros and cons of each option before making a recommendation—this is data too, and the deep dive helps build confidence in your proposal. “The thing I have noticed is that when the anecdotes and the data disagree, the anecdotes are usually right. There is something wrong with the way that you are measuring it,” —Jeff Bezos Sometimes, we believe that the strength of our ideas, arguments, or communication makes people change their minds. Wrong. People make up their own minds."
author = "Eugene Yan"
year_published = 2021
