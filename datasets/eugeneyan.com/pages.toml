title = "2021 Roadmap: Sharing, Helping, and Living More"
description = "A public roadmap to track and share my progress; nothing mission or work-related."
full_description = "I don’t usually make new year resolutions, and have done fine without them. Nonetheless, since I’m writing and sharing more now, I figured I would share these publicly—this also counts towards my writing goals 😝. In 2020, my sole resolution was to write weekly and it was a blast. For 2021, I will continue this habit, giving myself a two-week pause for reflection in summer and winter. I would also like to write on more specific themes, with six informalmentor and teardown pieces each. Also, I haven’t been speaking as much as I would like and will get back to sharing at conferences, talks, or podcasts, with a goal of at least four. Other than the number of pieces or talks, my key success metric is “this has been helpful” feedback. This could be in the form of emails, comments, tweets, etc. My target is 100 of such feedback, distinct by person (i.e., feedback from 100 different people). In 2020, I started mentoring a few folks remotely, and am proud that three have successfully entered/progressed in the field of data science—I feel a tremendous sense of satisfaction. In 2021, I hope to continue this trend and mentor 3-6 people to reach the next level in the field. In addition, teams/organizations have reached out for advice on ML systems and building data teams. It’s been a joy to discuss and advise, as well as see the fruits of their efforts. In 2021, I hope to help more, either by angel investing or formally advising 1-3 start-ups. During the December break, I tried meditating in 60-minute slots again (I’ve previously done 20-minute slots). This time, it helped me understand my lizard brain and more about myself. I believe the lack of a schedule gave me the space and time to meditate properly. I aim to continue meditating 60 minutes daily. I also realized that I’ve not been living enough, and resolve to live more and not just focus on my mission/work. In 2021, I aim to pick up snowboarding, learn a new programming language (TypeScript), eat out more (≥ twice a month), read 6 fiction / pseudo-fiction books, and visit ≥ 3 US states. My biggest obstacle to these will be myself, where I’m like to prioritize these aims lower relative to the sharing/helping goals."
