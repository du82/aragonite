["https://eugeneyan.com/writing/how-i-reflect-and-plan"]
title = "How I’m Reflecting on 2020 and Planning for 2021"
description = "Time to clear the cache, evaluate existing processes, and start new threads."
full_description = "As I start to wind down, reflect on 2020, and plan for 2021, I thought maybe my process will be helpful for you too. So here’s how I’m doing it. (This will also be my last piece for 2020.) My personal and work to-do list has grown; using it as a place to “park” ideas and projects is probably a bad idea. Which items are no longer relevant? Which are worth pursuing? Now’s the time to prune the list so I can focus on what’s most important. The same applies to the dozens of saved—but unread—articles on Instapaper. Do we really need to read all of them? I’ll give myself a time-box, probably 30 minutes, to archive them in the relevant folders. Also, the recurring obligations and meetings (this probably applies more to work). Are we still needed in them? If not, opt-out so we have more uninterrupted time for deep work. The sole habit I tried to build in 2020 was writing more. The intent was to learn via writing, share my knowledge, and answer questions I frequently get. Along the way, I provided a way to get email updates (i.e., email list) and shared my writing on Twitter and LinkedIn. Some questions I have: At the start of 2020, I joined Amazon as an Applied Scientist. It’s a great opportunity to build and ship machine learning systems to millions of customers worldwide. Lots of learning and growth. My team’s mission (helping users read more) also aligns with my values. Some questions to think about: To plan for 2021, I adopt the Working Backwards approach. What do I want to be at the end of 2021? How would I have grown? What will I have achieved? How will life be different? One thing’s for sure—I want to build on my writing habit and continue thinking and learning in public to help others. Yan, Ziyou. (Dec 2020). How I’m Reflecting on 2020 and Planning for 2021. eugeneyan.com. https://eugeneyan.com/writing/how-i-reflect-and-plan/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
