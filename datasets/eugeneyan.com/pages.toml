["https://eugeneyan.com/writing/how-to-accomplish-more-with-less"]
title = "How to Accomplish More with Less - Useful Tools & Routines"
description = "My tools for organization and creation, autopilot routines, and Maker's schedule"
full_description = "We all have that friend who has a full-time job, completed a part-time postgrad degree, and built an income-generating side business. Also, she exercises, reads, and writes. I don’t know. But I had to find out when I started the Georgia Tech Masters in CS while working full-time. Four years later, I’m happy to share a system that worked well for me. It helped me to graduate, and now, it’s helping me to write weekly. While this is humble compared to those superhumans, I do get questions about it from time to time. So here’s a write-up about the tools and routines that make up my system. Perhaps it’ll be useful for you. I’m also curious about your productivity systems and would love to hear about them. Tools help us accomplish more by automating the details and extending our abilities. My tools mainly fall into two buckets: A scheduler is essential for planning and tracking my time. Without it, I spend too much time thinking what to do next, and sometimes the week passes with nothing accomplished. My weekly schedule is organized around the ideas of two great thinkers. First, Cal Newport and his ideas of autopilot scheduling and time-blocking. Recurring tasks are put on autopilot so I don’t have to think about them. This includes my weekly writing process (outlining, drafting, rewriting) and chores. Assigning tasks to blocks of time helps reduce procrastination and overestimation of how much I can achieve in a week. Tasks are organized around Steven Covey’s First Things First. First Things First also talks about prioritizing tasks via the Eisenhower Decision Matrix; frankly speaking, I don’t use that matrix much. Instead, I find it useful to organize tasks around my roles, such as being an individual contributor, leader, student, friend, husband, and son. Thinking about these roles ensure I allocate time to each of them. “It is not enough to be busy… The question is: What are we busy about?” – Henry David Thoreau I use WeekPlan to schedule my tasks around these roles. (Previously it was pen and paper; more below). Here’s how a typical week looks. Different roles have different colours: light blue - technical tasks (at work), green - leadership tasks (at work), dark-blue - self-study, yellow - social, pink - family, self - red."
