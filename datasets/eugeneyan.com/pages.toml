["https://eugeneyan.com/writing/data-science-roles"]
title = "Applied / Research Scientist, ML Engineer: What’s the Difference?"
description = "A personal take on their deliverables and skills, and what it means for the industry and your team."
full_description = 'In 2012, the data scientist was named the sexiest job of the 21st century. Now in 2020, this catch-all role is more often split into multiple roles such as data scientist, applied scientist, research scientist, and machine learning engineer. Data Scientist (n.): Person who is better at statistics than any software engineer and better at software engineering than any statistician. I used to get questions like “What does a data scientist do?” Now, I get questions such as “What does a data/applied/research scientist do? What is a machine learning engineer? How are they different from each other?” Here’s my attempt to explain the goals, skills, and deliverables of each role. If you’re trying to enter or transition within the field of data science, I hope this will help you get the right role—one that matches your interests and skills. We’ll also take a look at how data science has specialized and rebranded itself in the past decade, and what those changes mean for teams and practitioners. Disclaimer: This is my personal take based on chats I’ve had with folks in various organizations and roles. It does not represent the views of my employer. Also, not all companies adopt these titles, so don’t take it too seriously if you feel like you have a title mismatch. In addition, role distinctions might blur depending on project phases. Recently, I was amused to learn that the data scientist title has gained a bad rap, with some claiming that they’re "just glorified analysts". I think this view is misguided and unfair. The data scientists that I know work on increasingly sophisticated A/B testing and inference techniques that are high-impact. Nonetheless, it’s interesting to learn how it came about. In August 2017, the Reddit community noticed that data scientists at Facebook were mostly doing data analyst work. A commenter shared that the generic data science role (in Facebook) was a “product analytics data scientist”, focused on data extraction, analysis, and statistics. (Another commenter also shared how Nielsen’s Measurement Science team became the Data Science team overnight.) To distinguish between product/analysis-focused and research-focused data scientists, Facebook created a Core Data Science group focused on research.'
