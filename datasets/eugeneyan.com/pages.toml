["https://eugeneyan.com/writing/how-to-apply-crockers-law-for-feedback-and-growth"]
title = "How to Apply Crocker's Law for Feedback and Growth"
description = "Crocker's Law, cognitive dissonance, and how to receive (uncomfortable) feedback better."
full_description = "Well, Crocker’s a Wikipedia editor who asked people to not apologise for editing his pages. He just cared about making his pages better and wanted them to do the same. If he was offended, it was his fault. What a guy! (Takes a lot of self-esteem I bet). If we follow Crocker’s law, we don’t let ourselves be affected by feedback—instead, we use it to fuel our improvement. Here’s what Tobi had to say about it: “Feedback is a gift. It clearly is. It’s not meant to hurt. It’s meant to move things forward, to demystify something for you. … Just give me the raw feedback without all the shit sandwich around it.” Once opinions are formed, they persist. In 1975, Stanford researchers conducted an experiment where participants were presented with a pair of suicide notes—a real note by someone who committed suicide and a fake note by a random person. Participants were asked to identify the real notes. Some participants had a talent for this—they identified the real note more than 95% of the time. Others had a success rate of 40%, worse than a coin flip. But this was a ruse. The scores were made up (though half of the notes were indeed real). Participants who were deceived that they were 95% right were not more perceptive than those who were 40% right. After revealing the truth, participants were asked to estimate how many they actually got right. Here’s the punchline: Participants who mistakenly thought they did well (95% correct)—due to the deception—continued to estimate a high score; participants who thought they did badly (40% correct) continued to estimate a low score. Even when presented with disconfirming evidence, once those participants formed an (incorrect) opinion (of themselves), those opinions persisted. That’s belief perseverance–it explains why it’s so difficult to change our views. But what if we agree with the feedback, and choose not to accept it? Well, it gets uncomfortable on the inside–here’s why. Clashing opinions can lead to cognitive dissonance. Cognition means thinking and reasoning; dissonance means tension or clash from contradictory elements."
author = "Eugene Yan"
year_published = 2020
