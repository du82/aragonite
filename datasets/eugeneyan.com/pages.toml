["https://eugeneyan.com/writing/how-to-give-a-kick-ass-data-science-talk"]
title = "How to Give a Kick-Ass Data Science Talk"
description = "Why you should give a talk and some tips from five years of speaking and hosting meet-ups."
full_description = "At some point in your data science career, you’ll be asked to give a talk at work or a meet-up. How do you give a good data science talk, especially if it’s your first? Well, let me first convince you to give a data science talk. Then, we’ll go through how to give a kick-ass one. Because you have something you’re dying to share. It could be about your recent work or personal project, and the associated challenges, learnings, and results. Or it could be about an awesome framework or workflow you discovered that you want others to benefit from. Intrinsically, people enjoy sharing and helping others learn. Because someone asked and you agreed (without thinking). Or perhaps you couldn’t say no, doesn’t matter. But now you’re having second thoughts because it’s scary speaking to an unknown audience. Embrace it—that discomfort is pointing you in the direction of growth. Because it’s a great way to market yourself. Giving a talk helps to showcase your work and raise your public profile. If the talk is recorded, you can share it publicly in a scalable way. I got a role in an e-commerce rocket ship by sharing about my attempt at a Kaggle competition. Because it’s a great way to hire. When Facebook and Twitter set up their APAC headquarters in Singapore, they reached out to a local meet-up group to host talks—it was a key hiring channel for them. Give a talk about the impactful projects your team is working on. You’re bound to find people who are interested to attend. Some might even linger after the talk to ask further questions. They are the people who are really interested about your work—hire them. Now that you’re convinced to give a data science talk (am I too optimistic?), how do you make it a great one? Here are some guidelines that work well, based on my speaking experience and hosting close to 100 data science meet-ups. Don’t be the person who gives talks about the flavour of the month. How do you know what’s the flavour of the month? If there’re 10 articles about a topic on Medium (I’m looking at you coronavirus), that’s the flavour of the month."
