["https://eugeneyan.com/writing/onboarding"]
title = "What I Wish I Knew About Onboarding Effectively"
description = "Mindset, 100-day plan, and balancing learning and taking action to earn trust."
full_description = "Onboarding to a new role can be scary. You want to start things on the right foot and so much rides on your first few months. Though I don’t have it all worked out, here are some guidelines that served me well. This post is intended for tech folks in mid to senior roles. We’ll start with discussing mindset before planning for the first 100 days. Own your onboarding. How successful your onboarding is lies with you. While your manager may have an initial onboarding plan, you own it and should feel empowered to update it as necessary. Treat the onboarding like any other project you’re tasked to lead. Taking ownership means clarifying expectations early and often. Define your 100-day plan and seek feedback within week one. Revisit it occasionally to check if expectations have changed, especially if you’re in a fast-moving team. Revisiting expectations is important if you’re an external joiner and don’t understand the culture yet. If an onboarding plan has been prepared but is lacking in details or is too challenging, speak up! Request for clarification or help, and don’t hesitate to make changes—no one wants to see you fail. Taking ownership also means you’re responsible for making relationships work. Don’t expect your manager and peers to proactively reach out to introduce themselves or offer support. Everyone’s likely busy themselves. It’s a bonus if they do but you should assume the onus is on you to take the first step. Most people are happy to have a 30-min intro chat or lend a helping hand if you’d just ask. Have a Beginner’s mind. As the new joiner, you get to play the “I’m new here” card. I would take advantage of it and ask as many questions as needed. It’s cliché but it bears repeating that there are no stupid questions. Your fresh perspective is valuable and your questions may nudge the team into better ways of doing things. For folks with experience in a similar domain or tech stack, don’t just stick to what you know. We often assume that achieving success in the new role means doing what we did in the previous role, only more of it and better—most of the time, this assumption is wrong. Sometimes that’s true, such as when we’re hired into a younger org to spin up the same function we led in our previous org. But even then, it’s unlikely we can copy-paste everything and expect it to work. We’ll need to adjust to the unique circumstances of the team and org. We might need to stop doing what worked and pick up new capabilities."
