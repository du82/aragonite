["https://eugeneyan.com/writing/netlify-back-to-github-pages"]
title = "Why I switched from Netlify back to GitHub Pages"
description = "DNS server snafus led to email & security issues. Also, limited free build minutes monthly."
full_description = "A week ago, I was looking for something to tinker with over the weekend. I ended up switching my site hosting from GitHub Pages to Netlify. The comparison was compelling. I was appealed by the 1-click rollbacks, ability to use more Jekyll plug-ins, and A/B testing my site (fun!). When I switched my DNS servers to Netlify, it was pretty painless: Update the DNS name servers, provision the cert, and we’re good to go. However, I didn’t realize that my MX records weren’t automatically migrated as well. (When I previously moved to Cloudflare, this was taken care of). As a result, emails to my domain bounced for a few days before I noticed. Thankfully, people reached out via other channels to inform me of it. I had to create an account with NS1 and provide them with credit card details. (Update: Was charged $2 within a day; will enquire why). Then, I had to set up a “Zone” to attach the MX records. However, when I tried setting up the zone for my domain, it was not allowed as the domain already exists. Probably from the Netlify integration. I spent some time trying to figure this out. I also asked some Netlify folks. Turns out that while they use Netlify to host their site, they use other DNS providers (instead of NS1). By now, I’ve switched my DNS provider back to Cloudflare, and added the Cloudflare Origin cert to my Netlify app. (I really wanted to continue using Netlify.) However, I soon got complaints that people couldn’t access my site due to the error: “Peer’s Certificate issuer is not recognized.”. I faced the same issue too. I’m not sure where the issue lies (cert or host) but I had lost patience by now. While the GitHub Pages vs Netlify comparison indicates that both are free, with Netlify being superior at 3 builds a minute, it leaves out one major gotcha: On the free tier, Netlify only provides 300 minutes of build time monthly. AFAIK, GitHub Pages has no limitations. For someone who frequently adds and tweaks content, and mucks around with the CSS and whatnot, 300 minutes didn’t last long."
