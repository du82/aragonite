["https://eugeneyan.com/writing/ai-coach"]
title = "Building an AI Coach to Help Tame My Monkey Mind"
description = "Building an AI coach with speech-to-text, text-to-speech, an LLM, and a virtual number."
full_description = "I suffer from monkey mind, chronic imposter syndrome, and the hedonic treadmill. A few friends have confided that they have the same issue too. Perhaps you can relate as well. To improve my mental well-being, I meditate, write morning pages, and keep a gratitude journal. However, as helpful as these techniques are, they primarily rely on introspection. What was missing was an external perspective—someone who could ask follow-up questions, challenge my assumptions, and help untangle my thoughts and emotions. Enter ChatGPT. Over the past year, I’ve been using it as my therapist and coach. It’s been surprisingly helpful and meets all the needs above, plus it’s available 24/7. And I don’t have to worry about being judged (hopefully our AI overlords will be benevolent!) So far, every “session” has been insightful and I almost always leave with a lighter heart. Then, I saw this tweet from Swyx. I was initially skeptical of voice as a modality—Siri and her ilk never quite worked for me. Nonetheless, I was inspired enough to give it a shot. Thus, I built my own AI coach that I could talk to during walks. Over the past month, I’ve been stress testing it by testing it with my stress. As I walk to work, I share my anxieties, use it as a sounding board for ideas, and clarify new concepts I come across in papers and podcasts. My AI coach helps me prep for difficult scenarios, such as giving tough feedback, so the actual conversation goes better. It also acts as a mirror by clarifying and reflecting my emotions back at me, and provides an external perspective. Voice is now my preferred way to interact with my AI coach. I’m surprised how natural the conversations have been. Claude 3 feels warm and empathetic. Vapi (the voice API platform I’m using and am unaffiliated with) ensures my AI coach knows to pause for my interruptions, as well as not to interrupt when I’m thinking silently. I’ve benefited so much that I would love for you to try it. Thanks to some free credits from Vapi, here's a number for Tara, a basic AI coach: +1 (206) 558 8782."
