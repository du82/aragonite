["https://eugeneyan.com/writing/data-science-teams"]
title = "Growing and Running Your Data Science Team"
description = "What I learned about hiring and training, and fostering innovation, discipline, and camaraderie."
full_description = 'An effective data science team is like the goose that lays the golden eggs. Sometimes, we focus too much on the eggs (i.e., results)—how can we get more, faster? As a result, the goose (i.e., team) can get neglected. Stage 3 manager:A manager who is all-business & primarily views people as "resources". May care about people. May even care a lot.But cares much more about short term results & targets. So when the two are in conflict, she will unabashedly prioritize short term results. Here, we’ll focus on the goose. I’ll share what I learned about growing (hiring, training) and running (innovation, discipline, camaraderie) data science teams. This is based on my experience at Lazada (as an early DS who eventually led the team) and uCare (where we shipped an ML system for Southeast Asia’s largest hospital chain). I measured myself on team productivity, growth, and well-being. Here’s what made the biggest impact. Hiring is the most important thing everyone on the team can do to contribute to our success. We should always try to raise the bar by finding people who will improve the talent pool. Here’s how I identify such people: This doesn’t mean that we only hire people who have better qualifications or are more senior. Recent grads and juniors contribute infectious energy, a fresh pair of eyes, new ideas, and knowledge of the latest research and technology. Mentoring them is also rewarding for everyone on the team. We don’t need new hires to be better than everyone on the team now, but we should believe that they will surpass us in future. If each of us hires people who are smaller than we are, we shall become a company of dwarfs. But if each of us hires people who are bigger than we are, we shall become a company of giants. — David Ogilvy I had the chance to interview hundreds of candidates and work with those who made it through the process, including people I was against hiring (I wasn’t the final decision maker sometimes). This gave me a rare opportunity to observe a wide spectrum of candidates and follow their journey through several projects. There were three traits most great hires had.'
