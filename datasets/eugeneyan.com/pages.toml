["https://eugeneyan.com/writing/what-i-did-not-learn-about-writing-in-school"]
title = "What I Did Not Learn About Writing In School"
description = "Surprising lessons I picked up from the best books, essays, and videos on writing non-fiction."
full_description = "At the start of the year, I decided to write more consistently and figured I might as well get better at it. Thus, I compiled a writing curriculum and studied some of the best books, essays, and videos on writing non-fiction. I was surprised how much I didn’t learn about writing (at school). No, I’m not talking about grammar, punctuation, or essay structure. I’m talking about how to write for a wider audience, at a regular pace. Here, I’ll share some of the uncommon and best advice I’ve come across. You won’t just be hearing from me—I’ve included many quotes from great thinkers, writers, and authors who have mastered the craft of writing. Whether you’re just starting to write or an old hand, I hope this will be helpful to you. In school, my writing was assessed by picking a topic (out of twelve) and pounding out an essay in 90 minutes. No research, little time for organizing thoughts, starting with a blank sheet of paper. Thus, I thought that to write, we just… wrote. It starts when we read good books and articles, have great conversations, and experience the world. It continues when we note down what is useful for our work and writing, and make connections between them. And when we are ready to write, most of the legwork has already been done; we can focus on weaving it into a coherent, succinct essay. But don’t just take my word for it. Here’s Roy Peter Clark, author of “Writing Tools”, on preparation: “Good writers prepare for the next writing project, even if it is not yet on the radar screen. … As soon as I declare my interest in an important topic, a number of things happen. I notice more things about my topic. Item by item, anecdote by anecdote, statistic by statistic, your boxes of curiosity fill up without much effort, creating a literary life cycle: planting, cultivation, and harvesting.” And here’s Nick Maggiulli (Of Dollars and Data), sharing about his writing process, during a recent chat with David Perell: “I consume information, think, and write. I would say I spend about 80% of my time consuming and thinking, and only 20% of my time writing.”"
