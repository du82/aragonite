["https://eugeneyan.com/writing/mailbag-resume-for-experienced-ds"]
title = "Mailbag: How to Get Experienced DS Resume Noticed by Recruiters?"
description = "How to increase the chances of getting called up by recruiters?"
full_description = "Hello! I’ve been working as a data scientist for close to 2 years now and would like to start applying for jobs again soon. Just wanted to ask for your opinion on what more I should include in my resume in addition to all the basic information (education, work experience etc) to increase the chances of getting called up by recruiters. There are quite a bit of resources on how to pass interviews and how to prepare your resume for people new to this field but I’ve not found much for existing data scientists. I’ve come up with some points below: Do you have any opinions on this? If it helps, I’m based in Singapore. Looking forward to your reply. Thanks! This is a great question. I find that—at least in Singapore—getting your resume picked up by recruiters is somewhat of a game. Understanding what they look for is key. In my experience, most recruiters (in Singapore) tend to be keyword scanners and experience calculators (though there are a few good ones that are excellent at spotting talent outside of the resume). Thus, regular recruiters just compare your keywords and experience against the job description/requirements to see if it matches up—that’s how they determine candidate quality. Does the candidate meet 8 out of 10 requirements, or just 5/10? They don’t want to forward hiring managers too many 5/10s. Thus, they’ll play it safe and only reach out and forward resumes if it crosses a certain threshold (e.g., 8-9/10). The suggestions you have (e.g., Kaggle, side projects, volunteering) are great, though it depends on the recruiter and hiring manager’s inclination. Look at the industry/companies/teams you want to join—do they tend to be filled with Kaggle competitors? Or do they work on a lot of side projects? Personally, as a hiring manager, I’m biased towards personal projects as they demonstrate curiosity, learning ability, and grit; other hiring managers might emphasize other aspects. Write it in such a way that it meets most of the standard job requirements for roles you’re targeting."
author = "Eugene Yan"
year_published = 2021
