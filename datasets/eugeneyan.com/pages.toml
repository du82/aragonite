["https://eugeneyan.com/speaking/recsys2022-keynote"]
title = "RecSys 2022 Keynote - Is the Juice Worth the Squeeze?"
description = "Invited keynote at the Workshop for Online Recommender Systems and User Modeling (ORSUM)"
full_description = "I was invited to give a keynote at the RecSys 2022 Workshop for Online Recommender Systems and User Modeling (ORSUM). I figured I’d take the opportunity to share a balanced perspective on real-time recommender systems: When are batch recommenders more effective, and when do online recommenders shine? I also shared three examples at Amazon Books to highlight the strengths of online recsys and some lessons we learned. Abstract: Online recommender systems are increasingly prevalent given their ability to adapt to the customer’s needs in real time. Nonetheless, they come with additional costs (computation, operational) and complexity (infra). In this keynote, we explore when it makes sense to use an online recommender and when a batch recommender is good enough. Then, to better understand the differentiating strengths of online recommenders, we share three systems at Amazon Books that play to these strengths, high-level results, and lessons from making them work in the field. I got many questions during the Q&A and after the conference. Questions came in via the RecSys slack too. People seemed to like the talk based on the nice messages I received. Thanks to my team at Amazon Books for helping with approvals and prep: Sean, Rupak, Saurav, Matt S, Hugo, Pablo, Matt D, Florian, Artem, Lucie, Juwon, Anant, and more. Yan, Ziyou. (Sep 2022). RecSys 2022 Keynote - Is the Juice Worth the Squeeze?. eugeneyan.com. https://eugeneyan.com/speaking/recsys2022-keynote/. Eugene Yan designs, builds, and operates machine learning systems that serve customers at scale. He's currently a Senior Applied Scientist at Amazon. Previously, he led machine learning at Lazada (acquired by Alibaba) and a Healthtech Series A. He writes & speaks about machine learning, recommenders, LLMs, and engineering at eugeneyan.com and ApplyingML.com."
