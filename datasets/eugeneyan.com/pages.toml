full_description = "ML systems, production & scaling, execution & collaboration, building for users, conference etiquette. Look at and label your data, build and evaluate your LLM-evaluator, and optimize it against your labels. FastAPI, FastHTML, Next.js, SvelteKit, and thoughts on how coding assistants influence builders' choices. What to interview for, how to structure the phone screen, interview loop, and debrief, and a few tips. Special double-feature closing keynote from the 6 authors of the hit O'Reilly article on Applied LLMs. Structured input/output, prefilling, n-shots prompting, chain-of-thought, reducing hallucinations, etc. Overcoming the bottleneck of human annotations in instruction-tuning, preference-tuning, and pretraining. What's the big deal, intuition on query-key-value vectors, multiple heads, multiple layers, and more. 9 patterns including HITL, hard mining, reframing, cascade, data flywheel, business rules layer, and more. My favourite project, how I write weekly and how you can start, and content I would like to see more of. Mike and I take a philosophical detour on Talk Python and discuss life lessons from machine learning. Emphasis on bias, more sequential models & bandits, robust offline evaluation, and recsys in the wild. I couldn't find any guides on serving HTML with FastAPI, thus I wrote this to plug the hole on the internet. Ever revisit a project & replicate the results the first time round? Me neither. Thus I adopted these habits. After this article, we'll have a workflow of tests and checks that run automatically with each git push. Haste makes waste. Diving into a data science problem may not be the fastest route to getting it done. Building a baseline recsys based on data scraped off Amazon. Warning - Lots of charts! (Part 1 of 2). How we built an ML system to predict hospitalization costs at admission; sharing at DATAx Conference. OMSCS CS6601 (Artificial Intelligence) - First, start with the simplest solution, and then add intelligence. OMSCS CS7642 (Reinforcement Learning) - Landing rockets (fun!) via deep Q-Learning (and its variants)."
