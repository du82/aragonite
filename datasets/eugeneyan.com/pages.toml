["https://eugeneyan.com/writing/reading-note-taking-writing"]
title = "Writing is Learning: How I Learned an Easier Way to Write"
description = "Writing begins before actually writing; it's a cycle of reading -> note-taking -> writing."
full_description = "I viewed writing as solely about sharing original content with useful teachings. Technical posts demanded personal projects, requiring significant time and effort. Life lessons expected months, if not years, of experience with anecdotes and insights. “Writing is not what follows research, learning, or studying. It is the medium of all this work” - How to Take Smart Notes (Sönke Ahrens) Chancing upon this quote made me realise writing is not just for sharing. It is also for learning and thinking. (Furthermore, not all writing needs to be original; more on this later.) Writing lets you see your thoughts on paper (or the screen). You can organise, edit, rearrange for better flow, and trim the fat. This lets you clarify your thinking, extends memory, and exposes gaps in knowledge. Thus, writing helps you learn and think better. This post is addressed to myself from three years before, with the intent of making writing more enjoyable. My view of writing has changed. Instead of just writing, it is now reading (consume) -> note-taking (collect) -> writing (create). The key difference is having note-taking connect my reading and writing habits. Read consistently. Don’t wait for a quiet chunk of time at night or on weekends to dive into a book. Those 10 - 15 minutes while you’re having breakfast, queuing, or commuting add up to hours each week. Nonetheless, there are some books (e.g., heavy technical, self-improvement) that do require significant thinking and reflection. It is difficult to sneak these books into 10-minute pockets. You might also be too drained to read them after work. Read three books at a time. My three books would be a heavy technical or self-improvement book, a lighter biography or non-fiction narrative, and a lightest fiction (e.g., sci-fi, fantasy). Heavy books require significant cognitive energy and uninterrupted time to process—save them for weekends, or weeknights when you’re not as exhausted. Can’t read a heavy book? Go for one of your lighter options instead. These fit well into 10-minute pockets, ensuring you’re always reading, every day."
