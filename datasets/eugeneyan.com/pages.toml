["https://eugeneyan.com/speaking/writing-for-a-tech-career"]
title = "DataTalksClub - The Importance Of Writing In A Tech Career"
description = "Why did I start writing? What's my writing process? What's the writing culture at Amazon like?"
full_description = "I recently had the pleasure to be on the DataTalk.Club podcast, where Alexey and I chatted about the importance of writing in a tech career. We discussed about why I started writing, what keeps me motivated to write week-after-week, my writing process, how to start writing, the writing culture and process at Amazon, and more. Alexey Grigorev: Hello everyone. Thanks for coming to our event today. This event is brought to you by datatalks.club, which is a community of people who like to talk about data. Today we’ll talk about technical writing and blogging. We have a special guest today, Eugene Yan. Eugene works at the intersection of machine learning and product. He likes building pragmatic machine learning systems. And he also writes and speaks about effective data science, machine learning in production, and career growth. If you follow Eugene, you’ll know that he writes a lot every week on his personal site. Naturally, it was very difficult for me to think of anyone else who is more suited for this podcast episode. So thank you, Eugene. Welcome. Alexey Grigorev: Before we go into our main topic of writing, let’s start with your background. Could you tell us a bit about your journey so far, about your career, about how you started. Eugene Yan: It’s a bit of an unusual journey. I graduated with a Psychology degree about 10 years ago. I spent a few years working on investment policy and decided that I didn’t really like it. I was doing a lot of contracts and agreements and I wanted to work more with data. So, I took about 20 - 30 MOOCs and interviewed at a few places and very luckily got accepted at IBM. While I was at IBM I did a Kaggle competition on product classification. My team and I managed to get into the top 3% and we happened to share about our attempt at a meet-up. It happened that an e-commerce startup was facing a similar problem about how to categorize products correctly and they had someone in the audience. So they invited me in for lunch and asked how I would solve the problem for them in different languages in Vietnam and Indonesia and English. And they next day they offered me a job. I was excited to experience how start-up was like. I was pretty early in my career then and joined as their third data scientist."
