["https://eugeneyan.com/writing/serendipity-and-accuracy-in-recommender-systems"]
title = "Serendipity: Accuracy’s Unpopular Best Friend in Recommenders"
description = "What I learned about measuring diversity, novelty, surprise, and serendipity from 10+ papers."
full_description = "Imagine you started using Spotify to listen to your favourite artiste. If Spotify only recommended music from that artiste, would it be accurate? Yes. Would you like those recommendations? Probably at the start, but you would get bored quickly. What you want is for a recommender system to (pleasantly) surprise you. That is the concept of serendipity. Nonetheless, if you’re keen to learn about an alternative approach to evaluating recommender systems (based on what I gleaned from 10+ papers), read on. In the earlier example, the music recommender was very accurate—it only recommended music from artistes you liked and previously listened to. A model solely focused on accuracy would do very well in offline evaluation (of the latest week of data). But in the real world, it would suck. It would recommend very similar music daily. Users would get bored soon. People intrinsically enjoy variety and discovering things such as new artistes, genres, communities, etc. Helping users discover new products keeps them interested. Keeping customer utility high is important. But besides customer utility, you also need to care about assortment health and seller health. From an e-commerce perspective, poor assortment health means a small percentage of products, categories, or sellers (5%) get a disproportionately large portion of sales and revenue (95%). If those top sellers decide to move to a competitor platform, it’s gonna hurt. The same would happen if a top-selling product stops being available (e.g., out of stock, banned, cease production). Introducing serendipity (and the associated metrics of diversity and novelty) help recommend more products from the long-tail of assortment. This distributes sales more evenly, reducing dependency and risk on the minority of products and sellers. As a plus, you get to expose long-tail and cold-start products to customers. This helps gather training data which you can use to improve your recommender. It’s a virtuous cycle. Unfortunately, there’s no industry agreed-upon standard to measure serendipity. Unlike relevance metrics such as non-discounted cumulative gain (NDCG), mean average precision (MAP), recall, precision, etc."
author = "Eugene Yan"
year_published = 2020
year_updated = 2020
