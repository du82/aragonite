["https://eugeneyan.com/writing/omscs-cs6440-intro-to-health-informatics"]
title = "OMSCS CS6440 (Intro to Health Informatics) Review and Tips"
description = "OMSCS CS6440 (Intro to Health Informatics) - A primer on key tech and standards in healthtech."
full_description = "You might also be interested in this OMSCS FAQ I wrote after graduation. Or view all OMSCS related writing here: omscs. In general, I’m keenly interested in HealthTech (and EdTech). One key reason I decided to enroll in OMSCS was due to the electives on health tech. The syllabus for IHI looks like a primer on the key technologies and standards in health technology, such as FHIR, EHRs, PHRs, etc. In addition, the weekly live lectures were a draw as they involved guest lecturers who were actively building health tech applications, both in startups and established enterprises. However, the ratings on OMSCentral were poor. The average rating was 3 / 5, one of the poorest among all the classes I’ve taken. Average difficulty was 2 / 5, with the average workload of about 6.5 hrs a week. With regard to the average workload, the bulk of it depends on your group project, which has team size of 4 - 6 people. With a good team, the workload should be light with everyone pulling their own weight—else, be prepared to spend significant time on it. There were a lot of lecture videos to watch. However, I found the videos to be a less effective mode of information transmission. I have pretty low expectations for videos, but these were very dry and consisted mainly of the lecturer at his desk, (most likely) reading from a teleprompter. The transcripts were made available and I mostly referred to these when revising for the exams. Reading provides higher bandwidth and lower entropy that video watching. Nonetheless, this was compensated by Dr. John Duke, MD having live lectures twice a week and inviting guest speakers to share about their work in the healthcare industry. This included speakers from Cerner, Emory, Goggle, as well as other startups that are helping to improve healthcare. Having a guest lecture every week is no mean feat and the team really put in a lot of effort into preparing this. For the overall workload, there were three sections, namely: (i) individual assignments (30 points), (ii) team project (35 points), and (iii) participation (35 points)."
