Instagram:"""
full_description = "Evangelos SciFiWorkshopWelcome to my workshop. Here you can see which stories of An End of Our Own Making (AEOOM) are under construction, and you can contribute to the future of AEOOM. Contact me to tell me what you would like to read next: Email: AristotleEvangelos@gmail.comTwitter: @EvangelosSciFiInstagram: @Evangelos.SciFiDiscord: Email me for an invite to my discord server. Discussions, snippets of works in progress, additional AI art, and more.If you've read the published stories, you will know what and whom most of these are about.The world of An End of Our Own MakingThe main groups in the AEOOM world, those struggling against extinction in the thousand years or so after the War, are the Leavers, the Cyborgs, the Immortalists, and the rest who have built a precarious life for themselves on Earth.The Leavers are descendants of those who left Earth for the solar system around the time of the War, and organised themselves into an interplanetary corporate system.The Cyborgs are a small, secretive group who attempted to extend life for the privileged few through the use of electronics and bioengineering.The Immortalists are a cult-like group of biochemists who extend life through biological processes.The rest are the farmers who have rebuilt local-scale societies on the ruins of the old world before the War, and are surviving as best they can.PublishedThe Cyborgs, 200 years after the WarTime Travellers of Ganymede, 470 years after the WarThe Leavers, 500 years after the WarThe Rise of Laez, 580 years after the WarThe Hermits of Miyah, 600 years after the WarThe Last Ion Ship, 700 years after the WarThe Returners, 900 years after the WarThe Immortalists, 1000 years after the WarThe Cybernetic Philosopher Queen, 1200 years after the WarPlanned or currently under construction:The Accidental Trigger, 20 years before the WarPatterson’s Squad, 190 years after the War (Prequel to The Cyborgs)The Clones, 300 years after the War (Follow-up to The Cyborgs)Feng’s First Command, 470 years after the War (Follow-up to The Leavers)Katia’s Outpost, 505 years after the War (Follow-up to The Cyborgs)The Lords of the Underground, 800 years after the War (Prequel to The Immortalists)The Cybernetic Philosopher Queen, 1200 years after the War (Follow-up to The Cyborgs)"
