["https://events.ccc.de/en/2024/12/13/38c3-self-organized-sessions"]
title = "38C3: Self-organized Sessions - CCC Event Blog"
description = """
TL;DR

We categorize workshops, group meetings, short presentations, etc. as Self-organized Sessions.
You can create self-organized sessions stubs now, but public room booking will only be possible from 17 December.
An overview of all self-organized sessions can be found in the Hub.
To register a self-organized session, use the Backoffice of the Hub."""
full_description = "38C3: Self-organized Sessions 16 December 2024 EN DE TL;DR We categorize workshops, group meetings, short presentations, etc. as Self-organized Sessions. You can create self-organized sessions stubs now, but public room booking will only be possible from 17 December. An overview of all self-organized sessions can be found in the Hub. To register a self-organized session, use the Backoffice of the Hub. The magic word is self-organization You want to arrange a meeting of a group or a discussion about a specific topic? Give a workshop? Host a competition or a game? Organize something outside the building? Want to give a short talk or show a movie? Start a follow-up discussion to one of the big talks? Or plan something else that needs a place at Congress? Instead of listing all these things individually or creating categories for them, we introduced the term self-organized session a few years ago. Self-organized sessions are, as the name suggests, organized by all of you. To create a session, click the plus sign in the top right-hand corner of the Hub homepage and then go to “Self-organized Session”. You will be redirected to the Backoffice. If you don’t yet have an account in the Hub, you should create one beforehand. When the session will take place, how long it will last, what you will do there and where it takes place is up to you. For example, you can meet at a bar or in an assembly (please check with those assemblies beforehand!). If you need a room for more people, you can also book rooms for this purpose from 17 December. When you save the session, a check is made to see whether the selected room is still available at the selected time, otherwise an error message is displayed. Once you have supplied all these details and saved the session, it will appear in the Overview where other participants can find it. If you have selected one of the specified rooms, it will also appear in the schedule (Fahrplan) later. The following rooms are available for self-organized sessions: Saal E with theatre-style seating (chairs in rows), approx. 250 seats, Saal D with banquet seating (large, round tables, e.g. for workshops), approx. 120 seats, and Saal 6 with theatre-style seating, approx. 60 seats. These rooms are bookable via the hub, equipped with projector/display and PA, but sessions are neither streamed nor recorded by the VOC. Further self-organized rooms can be found on the overview page in the hub. If you have any questions regarding Self-organized Sessions / Workshops, free to contact the “Off Stages & Space Session Orchestration (OSSSO)” Helpdesk via 38c3-ossso@cccv.de or in person at Congress, by visting our desk next to the Infodesk. Please note that this system runs on a first come, first served basis. The Hub enforces that there can only be one session in a given time slot per room. Some slots might already be reserved by “Orga” team meetings or other sessions (e.g. CCC Regiotreffen) before the public booking phase. Header image from Yves Sorge, CC BY-SA 2.0 Chaos Communication Congress hub self-organized sessions"
year_published = 2024
year_updated = 2024
