["https://events.ccc.de/category/24c3"]
title = "24C3: Volldampf voraus! (2007) - CCC Event Blog"
full_description = "24C3 Sputnik Data available 20 January 2008 EN The Sputnik/OpenBeacon project has been successful in making the complete collected RFID tracking data available on the web. You can get the data file in singularized or raw form. There is also a PDF showing all reader locations to give a spatial reference for the data. There are also some graphs with an general analysis available by Peter Meerwald. If you want to analyze the data and or have other things to contribute, contact the OpenBeacon team … Chaos Communication Camp – the lectures 14 January 2008 EN In case you still haven’t found what you were looking for: we have now also assembled a video podcast containing all existing recordings of Camp 2007 lectures. As some recordings have been lost due to power failures and others are in still in queue for repair. Whatever will be added in the future will automatically show up in the feed. 24C3: Lost and Found 5 January 2008 EN Are you missing anything? Did you find anything? Please have a look at: http://events.ccc.de/congress/2007/Information_Desk DEMO Today 19:30h 29 December 2007 EN Please join the demo against surveillance and data retention during the 24C3. It takes place today next to the rocket “fairy dust” in front of the bcc at 19:30 (7:30 pm). Bitte kommt zur Demo gegen Überwachung und Vorratsdatenspeicherung während des 24C3. Sie findet heute um 19:30 bei der Rakete “fairy dust” vor dem bcc statt. Hacker Jeopardy in German only? Wrong! 29 December 2007 EN If this had been your question to the answer, you would have earned about -500 points for it. In fact, this year’s Hacker Jeopardy is a dual language event, but due to shortcomings in our scheduling system there is no way to reflect that kind of information. So, join us even if you don’t understand German, and be surprised by one of the funniest (or maybe the funniest) event at the Congress ever. See you tomorrow at 23:00 in Saal 1 – and bring your DECT phone! Call into 24C3 27 December 2007 EN It is possible to call somebody at the congress by dialing: +49 461 5056623 XXXX All extensions can be found in the 24C3 phone book. The lecture halls are available at the numbers 8001, 8002 and 8003."
