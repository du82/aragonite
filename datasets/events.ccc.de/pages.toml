["https://events.ccc.de/category/22c3/page/2"]
title = "22C3: Private Investigations (2005) - CCC Event Blog"
full_description = "22C3 Recordings: The Final Samples 7 February 2006 EN Okay. Good news on the horizon. All videos are collected, a naming scheme is defined and we have sorted out our formats. The encoding machines are ready to run. And will be started any moment. To give you the chance for some final checking, we have put up some samples for the various formats for you to test. So if you are technically inclined you might want to check them out in terms of quality and compatibility. The sample is always the same two minute clip. MPEG-4 H.264 320×240 iPod Video compatible (MPEG-4 H.264 Baseline Profile Video, MPEG-4 AAC Audio, MP4 Container, 0,23 MBit/s) MPEG-4 … Read more … When will the recordings be available? 5 February 2006 EN “…it’ll probably be only days away.” More info from the people working on them here. 22C3 Speaker Interviews 1 February 2006 EN After pointing you to a German summary in our podcast let’s also point you to four podcast interviews done with 22C3 speakers. Each podcast begins with a short German introduction but the interviews are held in English. CRE010: Régine Débatty (lecture, speaker info) CRE011: Joi Ito (lecture, speaker info) CRE012: Eric Blossom (lecture, speaker info) CRE013: Jacob Appelbaum (lecture one and two, speaker info) We should have done more of this stuff! And we certainly will in the future. Rückschau auf den 22c3 im Chaosradio Express 31. Januar 2006 DE Dear English-speaking readers of this blog: The remainder of this post is in German. Sorry for that, but the podcast featured is in German as well. Aus unerfindlichen Gründen haben wir den Podcast Chaosradio Express hier noch nie erwähnt. Vor dem 22c3 gab es einige Sendungen, die sich mit dem Congress und seinen Vorbereitungen beschäftigt haben. Letzte Woche gab es dann den Chaosradio Express 014 (mp3, website), der auf den vergangenen 22. Chaos Communication Congress zurückblickt. Im Gespräch lassen Tim Pritlove und Jens Ohlig ausgewählte Vorträge und Präsentationen des Congress Revue … Weiterlesen …"
