["https://events.ccc.de/congress/2024/hub/wiki/Feedback"]
title = """
38C3 -
  Feedback"""
full_description = '''your feedback here [optional: your nick here] c3nav does not work with older (non ancient) browsers: Search input field does not show up. did not work via FDroid for me, only Play Store/Browser FDroid is very slow with updating to the newest version. To circumvent that you have to add the c3nav repository manually: https://f-droid.c3nav.de/fdroid/repo/ External Lounge The external lounge did not have a hacker atmosphere. The lounge did not have enough seating. The Tschunks were of questionable quality. The lemons were not mashed and the amount of rum used was not consistent at all. In the PoC-Team we even had Tschunks without any noticeable rum flavor. Around 1-2am the crushed ice went out and cubed ice was used. At least the situation that you could not order larger amounts of Tschunks for Teams improved over the evening. Thanks for fixing that @PL <3 We had the same experience. Same here: I mostly drank beer because the Tschunk was not good. Going outside to get to the lounge/walking through radisson really killed my vibes. Actually I feel like even ignoring walking outside the vibes in the lounge were unpleasant with the feeling of it looking like a normal bar/having normal bar staff there (?). I like it when my friends serve me my tschunk. Overall I avoided the lounge thoughout the event due to all of this even though normally that's were I spend a lot of time. There is a way to the Club without going outside. The path was visible in c3nav. There should have been (more visible?) signs then, since most people only knew about the path through the hotel, which was often not available, possibly due to fog in the cch entrance hall and fear of another hotel smoke alarm incident. Another opinion: I felt it very good that there was more space which was not a "loud party" :-), and that the "loud party" was in a dedicated, externalised space. Also, the word "Lounge" does not really fit for this in my opinion, I think it should be called "Disco". "Lounge" is more something cozy, quiet. The official Name was Chaos Computer Music Club. The dance floor was too small to fit that many people, which makes it hard to actually dance Having the club outside the actual venue was nice! Having the entrance change so often was super annoying. I lived at the hotel, and at some point had to leave the venue and go to the main entrance. People also got mad saying the lounge was the other way, when I just wanted to get to my hotel room I did not like having to pass by the surveillance cameras of the hotel to be able to get to the lounge. Generally, the lounge was too small and had a hotel bar atmosphere. I went there a few times but left after a few minutes because there was not enough space, neither to dance nor to sit nor to leave your stuff. It would be cool if another solution/location could be found next time. For me, the lounge is an important part of Congress and should not be that disappointing. Design/Accessibility We should make the different levels each a distinct color. also the signs of the rooms and halls should be in a unique color for that level. the house is sooooooooo confusing. agree in general, but please also use a letter / symbol / pattern / etc. and don't rely on colour only, for accessibility The writing on the ticket is not a font/characters but an svg. This is not screen reader friendly. A light theme for web sites and a respective section in the official style guide would be really appreciated. Dating should not be a wiki, people have a hard time using it, blocking the whole page for long times... Thanks for the report, we are tracking this further with this gitlab issue I fatfingered and deleted a DM before opening it and the notif bubble is still there xc Thanks for reporting I opened an issue within the hub repo for this bug. Another one for the deletion without confirmation GitLab #776. It's very hard to read the tweets on the info beamer (at least on a smaller screen, e.g. a laptop) because the text is pretty small and cut off very often when the display changes, which doesn't make much sense to me The light artists have once again outdone themselves with the installation in the lobby Would love to see the angel badge having space to write the nickname on both sides Angel badge was not very good to read from further away Maybe do landscape badges for more writing space A pronoun field on the badge would encourage people to tell their pronouns I fully understand that the way to the lounge was partly outdoors to keep the fog out of the Hotel, but the routing from day 3 on where you could no longer enter the Hotel lobby directly, but had to use multiple ramps to get to the hotel lobby again, was really annoying for wheelchair users who stayed in the hotel There should be an angel at the lounge "Accessibility" Meetup point, instead of having to call someone for wheelchair access. At the last day, DECT was already down but the lounge had still open. there should not even be a need to get help from anyone for accessing the lounge with a wheelchair. I’m honestly disappointed that CCC did not follow accessibility standards here. The light in the toilets was too dark. some of them had one stall with normal lighting, which led to waiting lines for that one stall. Also, it's even very bad that the people who didn't mind the darkness, because their worse hygiene will lead to dangers for the ones who have to mind these things. Too many of the big spaces were not suitable for people with sensory sensitivity, especially noise: Hall H, whole Hall X, Y and main entrance area, and often Hall 3 all had music going on (main entrance area starting in the evening). So I and also others from my assembly were pushed away from staying at the assembly (in Hall 3; we actually deliberately asked for a place without insonation ("Beschallung"), maybe the assembly team was not aware that "Hackers Beauty Palace" insonates Hall 3). For accessibility (having enough space were sensitive people feel comfortable enough and still can meet and interact, e.g. not having to retreat to a dedicated quiet area which is not inclusion since it is not general space), I propose to have a few dedicated spaces, and only one of them a big hall, which are insonated. I think Hall H is "natural" for this since it anyway has a louder atmosphere. Other spaces, take smaller rooms for that if necessary (Hall 4). There were no wheelchair accessible tables in the food area Some services were not accessible for non-German speakers. This includes some signs at the fashion operations centre It's nice, that most signs were in english, but since there are still a lot of people not fluent in that language, they should have also been in german. It would be nice if some assemblies had bright white lightning, similar to an office or the CERT-Rooms. The dark, colorful "atmospheric" lighting makes be feel tired after a few hours. I would have liked the nap area to be in a quiet place, not next to very loud music. Also it would bei great to have a little walkway in the middle without sleeping people. But great that there was auch an offer at all! I'd love to see a dedicated "newbies/beginners space", with a focus on introductory workshops or connecting with mentors. My experience for the first 2 days of my first congress was overwhelming, and I couldn't get into any of the intro workshops I wanted to because I always found out too late how to sign up. I'd have liked to ask a congress veteran for help getting more out of the event. The ground and first floor was very over crowded during the day with next to no place to sit in the venue in general. I would prefer to have a bit less space for talks and instead use a hall for assemblies and open hangout spaces with enough seating to chill at for a while without constant foot traffic. The space use was not very efficient at times with places being very empty and some completely overcrowded. Hub 🏅 What about enabling badge creation also for individuals and/or self-organised projects? Could imagine some cool games, challenges, scavenger hunts, micro-ctfs, and so on! 🧐 🏃‍➡️ 🎯 - Ben Thanks for the feedback it will be tracked within the ticket GitLab #682 🌎⛓️‍💥 The "globe" button in the lower right corner here in the hub seems to be broken!? Redirects me to a 404 when switching to english. - Ben Thanks for reporting, I opened a gitlab issue for it. Searching for usernames, searching for things in user's profile pages. User profile pages also can't be tagged. Can't create projects as an individual. All this makes it quite hard to network beyond assemblies / existing projects. - clonejo Thanks for that feedback we have an issue for the search GitLab #142 and opened a new one for the tags GItLab #775 Striking-through text in the markdown view does not work and is only shown as <del> (at least on the devices I tested). Examples can be found in Hardware seeks Creature and Merch seeks Hacker tables on the Dating page. ~cz0 Thanks for reporting, this should be possible now (reference: https://git.cccv.de/hub/hub/-/merge_requests/1192) In the Badge section automatic links to 38c3.c3nav.de would be super helpful - Carla Thanks for that idea, we are tracking this further with this gitlab issue Sent messages only show oneself as the sender, rather than the recipient Thanks for reporting, we have opened an issue in GitLab #772 Some sort of DM notification would be great Thanks for the feedback, we have issues for it in G|itLab #141 and GitLab #13 I was missing a Table of Content (TOC) feature, would have helped with the Dating page and other longer pages. Additionally, being able to sort the date column would have been nice, since the order was all over the place Thanks for the suggestion, I added a gitlab issue for it to the hub project the bulletin board was pretty useless since it’s not possible to search through it. Thanks for the feedback, it will be tracked in the GitLab #101 issue. there should be an iCal feed for favourited talks/sessions that I could import to my calendar, similar to the “my shifts” iCal in Engelsystem You can copy the link of the iCal download button in your profile edit page here in the hub - it will contain all your favorit events (this was added during 38c3 and was not available before) Does the hub search cover https://events.ccc.de/congress/2024/infos/network.html etc? If not, this should be changed. These two spaces should not simply co-exist. Due to the parallel existence of the hub and the wiki infos were quite hard to find this year (without using an external search engine). A way to navigate between a talk in the fahrplan/pretalx to the corresponding one in the hub schedule would be nice. Assemblies Many assemblies remained among themselves and were not very inviting/outgoing to others. A big hurdle for shy nerds. i talked with Marc from the assembly team about this, and he told me to provide feedback in written form. As we arrived on day 0, we generally were told "space is a premium, everyone only did get half of what they asked for". That in itself is not really a problem, we are totally fine with more assemblies, and we understand the "more assemblies" need space. What i do not really get is, that we registered the assembly in advance and provided great detail about what we want to do and how much space we need. We did not get any feedback that space might be tight. We said, we want to build a small lounge. Nobody told us, that there will not be space for that, nor that there already is an "official" lounge planned nearby. Because we did not hear back from the assembly team, we had to assume, that we will get everything we asked for. Therefore, we loaded so much stuff and drove it almost 700 km, just to realize that it has to stay in the cars, because there is just no space for it. A simple one week advance, that we only get half the space and that the lounge is not going to happen would have saved us so much unnecessary work and effort. So maybe, the assembly team can respond to the requirements in the regstration of the assemblies with at least a two liner email on what will not be possible. – MikO, Maschinendeck e.V. Due to the lack of space our small 5 people assembly was effectively taken over by other larger assemblies that did not have enough seating for themselves. If assemblies get approved they should be informed about the space they will ultimately have. I'd rather get not approved than assume you have a spot that then ends up not being there. The only real solution for the space issue is to MAKE CONGRESS LEIPZIG AGAIN! +1! The CCH is just too small Sustainability Please bring back the Sustainability Track at 39C3 with more climate and sustainability related talks and topics. From my point of view, this can't be seen as an optional feature any more, also because it is a big threat to human rights and democracy as well. Waiting till the next Bits and Bäume in maybe 2026 is far too long. And also, if we just seem to give up on this because other things may seem to be more important right now, it can and probably will be seen as a signal of weakness, so that the political right may be successful with their agenda; but I think we should rather signalize strength instead, like we won't back down, not even one inch, and we also won't sacrifice important topics that might not look that urgent to some people right now (as it does most of the time anyway regarding certain topics) From both sides, I think we should not give up on it, and not only because we cannot afford to do so. The Sustainability Track at 37C3 really was GREAT and giving hope, and I am really missing it, and therefore looking forward to seeing this going on and develop in the future, also because it can bring great people together (and they don't like fascits either, so we probably can reach even more when working together) i would disagree here. I think the sustainability at 37c3 was not really great, some talks were rather weak which is why it was moved to the community stages. I think it fits better there. So let's reach to the stars together, spreading hope and love, and hopefully also peace in the end... Thank you. Please provide some water taps for bottle refillment. Big bottles do not fit in the sinks on the toilets. there was no attempt to recycle paper or plastic (except for the CCH trash cans that were already there) unfortunately that does not really scale on big events like this one. Most of the times people toss their stuff in the wrong containers (due to different regulations in different German states, for example) leading to messed up trash that can't be put into recycling containers anyway. Thus, Congress usually sticks to "Gemischte Gewerbeabfälle". I think collecting paper would actually be worth. Whereas the "Gelber Sack? Restmüll? Biomüll?" is often not so clear, paper is, and that is a category where recycling actually has a higher impact. the first step towards more sustainability would be to not use the buzz word'''
year_published = 2025
