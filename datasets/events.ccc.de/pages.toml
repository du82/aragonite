["https://events.ccc.de/camp/2011"]
title = "Main Page - Camp 2011 Public Wiki"
full_description = '''From Camp 2011 Public Wiki Jump to: navigation, search The Chaos Communication Camp is an international, five-day open-air event for hackers and associated life-forms. It provides a relaxed atmosphere for free exchange of technical, social, and political ideas. The Camp has everything you need: power, internet, food and fun. Bring your tent and participate! Chaos Communication Camp 2011 Project Flow Control August 10th thru August 14th 2011 Finowfurt near Berlin, Germany, Europe, Earth, Milky Way, Universe News Media 16 August 2011 - aldert If you have any memories, pictures, movies, or other material you'd like to share, we like to invite you to link to them on this wiki. Read more... View the Camp from a plane 10 August 2011 - cpunkt Local pilot offers flights over the Camp Read more... Binary Voice on air 10 August 2011 - gmc <As of the 10th at 00:00 hours Binary Voice is broadcasting from the camp grounds 24/7 with news updates, content made by the crowd gathered for the hacker gathering in Finowfurt. The camp radio station can be found on Janeway 42 and 51, is on FM 92.6 at the campgrounds and streams to DECT 1926. Read more... Full and Weekend Tickets sold out! 7 August 2011 - aldert We’re sorry, but we will not sell tickets that include camping at the door. We will still sell day tickets and night tickets, so please come, if you don’t want to stay at the Camp, but have a place in Berlin, Eberswalde, Finowfurt, or somewhere else. Read more... More Ticket Options 2 August 2011 - Pylon Day and Night tickets available Read more... Campguide released 2 August 2011 - Pylon We created a nice Campguide for your orientation Read more... Your tickets are downloadable now 2 August 2011 - cpunkt Your tickets have been generated now. PDFs are available for download from online ticket sales system. Read more... Raise your binary voice... 1 August 2011 - gmc ...or be forever silent. On the ccc camp radio that is! Starting the 10th at midnight sharp, event radio station Binary Voice will start broadcasting on 92.6MHz FM and on the internet via the Xenim streaming network. And you are invited to be part of this! Read more... Trockendock - a space for all things audio 1 August 2011 - simon From the folks who brought you the Congress Lounge since 2007 comes a beautiful glade between two shelters - Trockendock. Read on to find out what we've got and how you can contribute. Read more... A place for workshops and to present your hardware project 1 August 2011 - Julia Lüning If you want to hold an event outside the official lecture program - be it a discussion round or hands-on workshop - you can use the Mojave shelter any time you want. It is also a good place to put your 3D-printer, knitting machine or Nutrimatic Drinks Dispenser as there is enough power, shelter form the elements and lots of people will come by to see what you are working on. Read more... View older news … refresh Current status of the Project Flow Control LECTURES 2 tracks, ∞ VILLAGES > 123 PROJECTS > 95 WORKSHOPS > 89 TEAMS > 12 Pages: 2,569, Articles: 367, Files: 462, Edits: 14,173, Users: 1,747, Active users: 1,082, Percentage of Awesomeness: 100% , view more Retrieved from "https://events.ccc.de/camp/2011/wiki/Main_Page"'''
