["https://events.ccc.de/2024/12/22/38c3-poc-isdn-version"]
title = "38C3: ISDN Version - CCC Event Blog"
description = """
TL;DR

Registrierung geöffnet - registriere deine Nummer im Guru
Vergiss dein Telefon (DECT, GSM, SIP) nicht
Denk an Akkus, Ladekabel und CCC SIM-Karte
Die Einwahl von außen lautet: +49 40 5730830 xxxx"""
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. alles läuft. Dann haben wir ab 26.12. jedes DECT-Telefon von Hand angemeldet. Am 29.12. waren wir fertig und am 30.12. haben wir bis ins neue Jahr abgebaut. In den vergangenen Jahren haben wir unsere IP-DECT Anlage mit Features vollgepackt und alles so weit optimiert, dass wir uns sogar eigene Kisten für unsere Hardware gelasert haben. Wir haben 3D gedruckte Logos für unsere DECT RFPs, im PoC Zwerg läuft ein Webserver und wie der funktioniert, ist im internen Wiki ordnungsgemäß dokumentiert. Mit Screenshot. Laaaaangweilig! Wir reisen mit dem PKW an, irgendjemand schiebt einen Computer ins Rack, wir verteilen ein paar RFPs verbinden sie mit dem Netzwerk und sind fertig. Verkabeln? Machen wir nicht mehr. Haben wir an die Internetmanufaktur outgesourced. Anmelden? Machen wir nicht mehr. Haben wir an die Nutzer:innen outgesourced. Die ganze Vintage Technology macht die Chaosvermittlung. Im letzten Jahr haben wir am Tag eins beim Hack Zuck mitgespielt, als Team. Weil wir Zeit hatten. Das konnte so nicht weitergehen. Uns allen war klar, es ist fünf vor totaler Verwahrlosung. Die Ordnung nimmt überhand und bevor jemand™ auf die Idee kommt Kunst zu machen, hat jemand anderes™ einen sehr großen Schrank aus Metall gefunden, der größer und schwerer war, als unsere alte, wegrationalisierte Telefonanlage. Der Metallschrank hört auf den Namen EWSD, was Elektronisches Wählsystem Digital bedeutet. Und alle so: Yeah! Back to ISDN ISDN wurde abgeschaltet. Wir schalten es wieder an! Und analoge Telefonie auch. EWSD ist eine digitale (ISDN-)Vermittlungsstelle von Siemens für öffentliche Telefonnetze, die zwischen 1980 und heute betrieben wurde. Wir haben sie auf ein Minimum reduziert, werden sie auf dem Congress aufbauen und mit dem PoC-Netz verbinden. Besucher:innen haben die Möglichkeit, sich per ISDN oder Analog an die EWSD anzuschließen. Für ISDN gilt: Falls du ein NTBA hast, bring es bitte mit. Falls du kein NTBA hast, kannst du dir bei uns eins leihen. Für die komplette Retro Erfahrung kannst du dich per Modem oder per ISDN ins Internet einwählen. Natürlich auch mit Kanalbündelung. Man surft dann so schnell wie lange nicht mehr! Für einen EWSD-Anschluss ist keine Registrierung einer Extension im Guru notwendig, es gibt feste Extensions dafür, die vor Ort vergeben werden. Mehr Informationen. Für EWSD Informationen behalte @c3isdn im Auge. Nebenstellen registrieren Wie in jedem Jahr kannst du deine Nebenstelle(n) im GURU3 registrieren. Wir haben DECT, SIP, GSM, Callgroups, Applications, Announcements und Special Extensions im Angebot. Bitte achte darauf, dass du deine Nebenstelle im richtigen Event registrierst. Für Analog oder ISDN Nebenstellen benötigst du keine Registrierung (siehe oben). Die Registrierung ist seit dem 25.11.2024 geöffnet. Die reservierten Nebenstellen sind bis 13.12. reserviert. Nicht eingelöste Reservierungen fallen dann zurück in den Pool. DECT & EPDDI Es ist unser Kernprodukt. Stabil seit 1993. Auf dem Congress immer mit bester Netzabdeckung1. In der Tiefgarage, auf dem Klo oder der Tanzfläche. Wenn du mit deinem DECT Telefon nicht erreichbar bist, dann liegt es nicht an Eventphone. Du möchtest wissen, ob dein Gerät mit unserem System funktioniert? Schau in die DECT Phone Compatibility List. Es wird auch EPDDI (EVENTPHONE Decentralized DECT Infrastructure) geben, das bedeutet: Das EVENTPHONE-Netz vom Kongress – überall wo du es willst. Im Hotel, zu Hause, im Hackerspace oder in der Bahn. Du entscheidest. Wenn du RFP & Router hast, dann findest du hier die Doku zum Integrieren. GSM Auf dem 38C3 wird es auch wieder Mobilfunk geben. Es wird 2G, 4G und 5G Abdeckung angeboten. Bringt eure CCC SIM Karten und Mobilfunktelefone mit. Neue SIM Karten vom Camp sind auch noch vorhanden. Für Informationen zu den Mobilfunknetzen behalte @c3gsm im Auge. Und sonst so? Ab 26.12.2024 gibt es aktuelle Informationen zum Status unserer Dienste auf unserem Dashboard. Anleitung zum DECT registrieren SIP Konfigurationshinweise Besondere Nebenstellen Unser Wiki mit nützlichen Informationen Die Einwahl von außen lautet: +49 40 5730830 xxxx Mit DECT, GSM, Premium SIP, Analog und ISDN Anschluss könnt ihr von der Veranstaltung Telefongespräche in die ganze Welt führen. Vielen Dank an Sipgate dafür. Wir freuen uns auf dich in Hamburg. Vergiss deine Telefone nicht. Egal, ob Analog, ISDN, DECT oder Mobilfunk. Denke an Akkus, Ladegeräte, Anschlusskabel und SIM-Karte. Danke. Eventphone. auch in ausgewählten Hotels und Bereichen der HafenCity ↩︎ Chaos Communication Congress DECT GSM SIP EVENTPHONE POC"
year_published = 2024
year_updated = 2024
