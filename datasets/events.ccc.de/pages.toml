title = "Tag des offenen Hackspace - CCC Event Blog"
full_description = "Tag des offenen Hackspace 2025 28. Februar 2025 DE TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25 Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor … Weiterlesen … Einladung zum Tag des offenen Hackspace 23. Februar 2024 DE TL;DR Tag des offenen Hackspace am 2. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 2. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor allem … Weiterlesen … Öffnet eure Türen zum Tag des offenen Hackspace 23. Februar 2024 DE TL;DR Tag des offenen Hackspaces findet am 2. März statt, mach mit! Hackspaces können wundervolle Orte sein. Um für die Öffentlichkeit sichtbarer zu sein, rufen wir Hackspaces dazu auf, an diesem Tag ihre Türen zu öffnen und sich von ihrer besten Seite zu präsentieren. Oder auch sich authentisch zu präsentieren, oder sich auch einfach nur zu präsentieren. Was könnt ihr zeigen? Idee Ihr könnt euren Gästen zeigen, weshalb ihr euch zu eurem Space zugehörig fühlt und was euch daran wichtig ist. Dabei könnt ihr die Idee hinter eurem Space vorstellen, auf die Existenz anderer Spaces hinweisen, die … Weiterlesen …"
