["https://events.ccc.de/category/friends"]
title = "friends - CCC Event Blog"
full_description = "Tag des offenen Hackspace 2025 28. Februar 2025 DE TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25 Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor … Weiterlesen … Einladung zu den Nights of open Knowledge 26. Oktober 2024 DE EN Ihr seid herzlich eingeladen, zur NooK 2024 ins wunderschöne Lübeck zu kommen! Die Nights of open Knowledge werden am 8. und 9. November 2024 im Audimax der Uni Lübeck stattfinden und bieten, wie jedes Jahr, eine große Bandbreite an unterschiedlichen Themen von den ganz technischen bis zu den gar nicht technischen. Die NooK 2024 ist die zwölfte Veranstaltung ihrer Art in Lübeck. An zwei Abenden wird es über 30 Vorträge, Kurzvorträge, Stände und self-organized Sessions geben. Dazu natürlich Snacks, Mate, Unterhaltung und wie immer ein großes Ausmalbild! Natürlich gibt es wieder die Möglichkeit, … Weiterlesen … chaos.jetzt Geekend #jetzt7 – Late NIColaus 18. Oktober 2024 DE Wir freuen uns, euch jetzt zur achten Ausgabe des chaos.jetzt-Geekends einzuladen! Von Freitag, dem 13. bis Sonntag, dem 15. Dezember (eine Woche nach dem NIColaus) machen wir das temporärhaus in Neu-Ulm temporär zu unserem neuen kreativen Zuhause. Falls ihr noch nicht von uns gehört habt, wir veranstalten regelmäßig Geekends für junge Menschen aus dem Chaosumfeld. Und das jedes Mal dezentral organisiert in einem anderen Hackspace. Freut euch auf ein Wochenende, das ganz im Zeichen selbstorganisierter Sessions, innovativer Workshops und mitreißender Vorträge steht. Auch der Austausch … Weiterlesen …"
