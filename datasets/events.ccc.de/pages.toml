["https://events.ccc.de"]
title = "CCC Event Blog"
full_description = "Tag des offenen Hackspace 2025 28. Februar 2025 DE TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25 Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor … Weiterlesen … Easterhegg 2025: Call for Participation 16. Januar 2025 DE EN tl;dr Easterhegg 2025: CfP ist draußen Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an. Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der … Weiterlesen … 38C3: Last (and Lost) Things 12. Januar 2025 DE EN Der 38C3 ist vorbei. Leider. Wir hoffen, ihr hattet eine gute Heimreise und seid gut wieder in der Realität angekommen. Viel zu kurz waren die vier Tage gelebter Utopie. So viel mehr hätte man noch erleben können, so viel mehr Dinge entdecken, so viel mehr Leute treffen, so viel mehr Vorträge sehen … An der Dauer können wir leider nicht viel ändern. An vielem anderem schon! Daher möchten wir euch mit diesem Blogpost zu Feedback aufrufen. Lasst uns wissen was euch gefallen hat, aber auch, was euch nicht gefallen hat. Wir freuen uns sowohl über Lob als auch über konstruktive … Weiterlesen …"
