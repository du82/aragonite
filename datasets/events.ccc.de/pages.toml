["https://events.ccc.de/2024/12/18/38c3-lightning-talks"]
title = "38C3: Lightning Talks - CCC Event Blog"
description = """
TL;DR

Es gibt zwei Sessions mit Lightning Talks
Anmeldung unter https://cfp.cccv.de/38c3-lightningtalks/cfp
Weitere Infos unter https://events.ccc.de/congress/2024/infos/lightning-talks.html"""
full_description = "38C3: Lightning Talks 18. Dezember 2024 DE EN TL;DR Es gibt zwei Sessions mit Lightning Talks Anmeldung unter https://cfp.cccv.de/38c3-lightningtalks/cfp Weitere Infos unter https://events.ccc.de/congress/2024/infos/lightning-talks.html Lightning Talks? Du denkst, die Erfahrung, Deine Ideen vor einem riesigen Publikum auf einem C3 zu teilen, ist etwas, das Du nie erleben würdest? Arbeitest du an einem coolen Projekt und willst es bekannt machen? War Dein Vortrag einer von Hunderten, die abgelehnt wurden? Hast du dir einen tollen Hack ausgedacht, den du einfach teilen musst? Dann melde Deinen Lightning Talk jetzt an! Die 38C3-Lightning-Talks bestehen aus zwei rasanten Sessions und sind perfekt geeignet für die Vorstellung von Soft- oder Hardwareprojekten, Exploits, kreativen Streichen oder merkwürdigen Ideen vor einem weltweiten Publikum. Es muss auch keine bahnbrechende Idee oder ein einzigartiges Projekt sein – auch für die Präsentation von Assemblies, Workshops oder selbstorganisierten Sessions sind die Lightning Talks das ideale Format. Deine fünf Minuten des Ruhms! Anmeldung Die Anmeldung eines Lighting Talks ist theoretisch bis zum 28. Dezember für den 29. Dezember möglich. Allerdings haben wir nur eine begrenzte Anzahl Timeslots, die nach dem Prinzip „Wer zuerst kommt, mahlt zuerst“ vergeben werden. Also: nicht zögern, anmelden unter https://cfp.cccv.de/38c3-lightningtalks/cfp Weitere Informationen Auf https://events.ccc.de/congress/2024/infos/lightning-talks.html sind alle Infos nochmal zusammengefasst. Aktuelle Infos gibt es auch auf Mastodon unter https://chaos.social/@C3_LightningTLK Chaos Communication Congress Lightning Talks"
