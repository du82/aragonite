title = "25C3: Nothing to hide (2008) - CCC Event Blog"
full_description = "Das 14. Türchen der #35C3 Memory Lane: Vom Mythos der biometrischen Hochsicherheit 14. Dezember 2018 DE Das vierzehnte Türchen. Der Chaos Communication Congress widmet sich mit Vorliebe den Chancen und Risiken des Hackens biometrischer Systeme. Schon vor zehn Jahren ging es um Gesichtsbilder und Fingerabdrücke in Pässen und Ausweisen. Diese ganze Reihe an Biometrie-Vorträgen hat ihren eigenen Charme und außerdem einen wiederkehrenden Protagonisten, gefürchtet bei Herstellern, beliebt beim Publikum: starbug. Weiterlesen … Streaming & Recording the Conference 3 January 2009 EN Time (2008-12-29) & Number of Streamers More than 3500 hackers enjoyed this year’s hacker jeopardy through our network of streaming servers. During the course of 25C3 our friends at FeM ran an array of 6 wmv streaming servers supplemented by 3 ogg theora relays provided by the … Read more … We need your feedback 31 December 2008 EN As usual, we ask you to give your opinion on the lectures held at 25C3. Just go to the “Fahrplan”, click on the lectures you attended (or watched on video), click the feedback button, and tell us your impression. It is interesting and possibly helpful for the speakers to know your (anonymous) thoughts about their talks, and it is very important for the organizers to know what you liked and what you didn’t, when planning the next event. So, please, take your time to evaluate this year’s program. Moreover, general feedback on all aspects of the event is welcome. Feel free to contribute to the … Read more … Day 4 Schedule Updates 30 December 2008 EN Sadly, we’re on the last day of the 25C3. The good news is that your printed schedule is accurate with one very notable exception. All we have for you today is the addition of two really great talks in Saal 2: 14:00: Vertex Hacking: Reverse Engineering von 3D-Dateiformaten: “Es geht um die Methoden beim Umgang mit unbekannten Dateiformaten, speziell im Bereich der 3D-Modelle. Vorgestellt werden sollen die Werkzeuge, die Vorgehensweise, ein paar mögliche Fallstricke, interessante Implementierungsdetails und schlussendlich auch das Ergebnis in Form der Bibliothek libg3d.” 15:15: Mining social … Read more …"
