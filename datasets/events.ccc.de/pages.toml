["https://events.ccc.de/tag/dect"]
title = "DECT - CCC Event Blog"
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. … Weiterlesen … Ruf doch mal wieder an! 17. November 2021 DE EN TL;DR Registrierung offen, ab 15.12.2021 ist die komplette Telefonie Infrastruktur live. Liebes Chaos, gemeinsam mussten wir in den letzten Monaten viel ertragen. Zeit für ausschließlich gute Nachrichten von eurem Lieblings-OC. ;-) Die Registrierung für Nebenstellen auf dem rC3 2021 NOWHERE ist offen und ihr könnt euch Nummern registrieren. Es wird auch wieder ein verteiltes DECT Netz (#EPDDI) geben. Auch RFPs (Antennen) für Standorte wie Chaos Studios, Hackerspaces & Chaostreffs verleihen wir erneut in diesem Jahr. Unser Plan ist ab 15.12.2021 die komplette Telefonie Infrastruktur live zu … Weiterlesen … Kostenlose Ferngespräche zu Ostern 1. März 2021 DE EN Nun ist es genau ein Jahr her, dass uns die Pandemie in die Party gegrätscht ist. Das Digital Verteilte Online-Chaos (DiVOC) Jährt sich zum ersten Mal unter dem Motto Reboot to Respawn (R2R) und ermöglicht es uns einen Ort im Netz zu haben, um uns zu treffen und uns auszutauschen. Gerahmt wird das Ganze von Karfreitag bis Ostermontag (02.04. – 05.04.2021) mit einem Programm aus Vorträgen, Kunst und Musik. :-) Damit ihr wie gewohnt ungestört und unüberwacht kommunizieren könnt wird es auch wieder eine Telefoninfrastruktur geben, die technisch der des rC3 entsprechen wird. Die Registrierung … Weiterlesen …"
