title = "25C3: Karsten Nohl"
full_description = "25C3 - 1.4.2.3 25th Chaos Communication Congress Nothing to hide Events Chip Reverse Engineering Analyzing RFID Security Karsten Nohl Karsten is a hardware hacker and cryptographer. His academic research deals with privacy protection, while his hacking projects focus on cracking cryptographic hardware. This year, Karsten talked a lot about smart-card security and embedded cryptography at USENIX Security, BlackHat, CanSecWest, Toorcon, the HOPE conference, and other venues. <<< >>> Karsten is a hardware hacker and cryptographer. His academic research deals with privacy protection, while his hacking projects focus on cracking cryptographic hardware. This year, Karsten talked a lot about smart-card security and embedded cryptography at USENIX Security, BlackHat, CanSecWest, Toorcon, the HOPE conference, and other venues."
