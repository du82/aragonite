["https://events.ccc.de/2024/12/26/38c3-sicher-sein-und-fuehlen"]
title = "Weiterhin sicher fühlen und sein auf dem 38C3 - CCC Event Blog"
description = "Unser Chaos Communication Congress ist eine große, internationale Veranstaltung mit sehr vielen Teilnehmerinnen, darunter Tausende von freiwilligen Helferinnen. Daraus ergibt sich viel Potential, soziale Überforderung, gesundheitliche Notfälle oder bedrohliche Situationen zu erleben. Wir alle kennen das Gefühl, nach Orientierung und Anschluss zu suchen in der riesigen, überwältigenden Congress-Welt mit Tausenden großen und kleinen Projekten, mit Konzerten, Diskussionen, Vorträgen, voller Kunst und Kultur. Wir verstehen, dass es eine Herausforderung sein kann, diese Freiräume zu genießen, unter dem Eindruck all dieser Menschen, die auf den ersten Blick genauso verdreht, queer und kreativ sind wie man selbst. Es ist klar, dass man sich nur dann so richtig ins Congressgeschehen fallen lassen kann, wenn man auch das Gefühl hat, dass die Konflikte, die bei so viel Durch-, Mit- und Nebeneinander irgendwann auftauchen, angemessen adressiert werden. Das gilt selbstverständlich nicht nur für den CCC selbst, sondern auch für die Community auf der Veranstaltung, die unsere Werte lebt und atmet. Wir wollen eine Atmosphäre schaffen, die geprägt ist von Toleranz, Respekt, Neugier, Spaß, Gesprächsbereitschaft, Freundlichkeit und einem respektvollen Miteinander"
full_description = "Weiterhin sicher fühlen und sein auf dem 38C3 26. Dezember 2024 DE EN Unser Chaos Communication Congress ist eine große, internationale Veranstaltung mit sehr vielen Teilnehmerinnen, darunter Tausende von freiwilligen Helferinnen. Daraus ergibt sich viel Potential, soziale Überforderung, gesundheitliche Notfälle oder bedrohliche Situationen zu erleben. Wir alle kennen das Gefühl, nach Orientierung und Anschluss zu suchen in der riesigen, überwältigenden Congress-Welt mit Tausenden großen und kleinen Projekten, mit Konzerten, Diskussionen, Vorträgen, voller Kunst und Kultur. Wir verstehen, dass es eine Herausforderung sein kann, diese Freiräume zu genießen, unter dem Eindruck all dieser Menschen, die auf den ersten Blick genauso verdreht, queer und kreativ sind wie man selbst. Es ist klar, dass man sich nur dann so richtig ins Congressgeschehen fallen lassen kann, wenn man auch das Gefühl hat, dass die Konflikte, die bei so viel Durch-, Mit- und Nebeneinander irgendwann auftauchen, angemessen adressiert werden. Das gilt selbstverständlich nicht nur für den CCC selbst, sondern auch für die Community auf der Veranstaltung, die unsere Werte lebt und atmet. Wir wollen eine Atmosphäre schaffen, die geprägt ist von Toleranz, Respekt, Neugier, Spaß, Gesprächsbereitschaft, Freundlichkeit und einem respektvollen Miteinander Seit vielen Jahren arbeiten zahlreiche Teams daran, den Congress für alle sicher zu machen: Angefangen bei unserem Logistics Operations Center (LOC), das Bedrohungen durch herummarodierende Gabelstapler einfängt, über das CERT, das sich um euch bei kleineren und großen medizinischen Notfällen kümmert, c3gelb (Hygieneschutz), das im Zusammenspiel mit der Engel-Küche und dem Bottle Operation Center den Ausbruch der einst berüchtigten Congress-Seuche verhindert, bis hin zum Awareness-Team, das versucht, unser Selbstverständnis im Umgang miteinander den Teilnehmerinnen als Handreichung und den weniger reflektierten Stärkeren als Denkanstöße und rote Linien zu vermitteln. Diese Arbeit reicht auch von der CrewCrew (Security), die bei Konflikten und allen Belangen rund um eure Sicherheit hilft und versucht, wie ihr auch, für alle eine gute (diskriminierungsarme) Atmosphäre zu schaffen und gleichzeitig Augen und Ohren offen hält, über die Schiedsstelle, die bei komplexen zwischenmenschlichen Konflikten Wege für ein sicheres Miteinander von Wesen in unserer Community erarbeitet, die Teams Accessibility und c3auti, die nach Kräften dabei unterstützen, selbstbestimmte Teilhabe am Congress zu ermöglichen, bis hin zu den Chaospatinnen, die Erstbesucherinnen mit deren riesigen Staune-Augen abholen und für jedes und jede auf dem Congress Anschlussmöglichkeiten finden. Ohne all diese Menschen, die – wie ihr – selbstverständlich den vollen Eintrittspreis bezahlen, wäre der Congress heute nicht mehr denkbar. Wir rufen euch alle auch in diesem Jahr wieder auf, unsere Prinzipien zu verinnerlichen und euch im Vorfeld mit unseren Hilfsangeboten auseinanderzusetzen. Image by Thorsten Schröder CC BY-SA 2.0"
