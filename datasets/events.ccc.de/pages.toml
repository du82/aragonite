["https://events.ccc.de/category/gpn"]
title = "GPN - CCC Event Blog"
full_description = "22. Gulaschprogrammiernacht 31. März 2024 DE EN Common Code <> Different Roots Der Entropia e.V. lädt euch herzlich zur 22. Gulaschprogrammiernacht mit dem Motto „Common Code <> Different Roots“ ein! Save the date: 30.5.–2.6.2024 in Karlsruhe (HfG und ZKM, Lorenzstr. 15, 76135 Karlsruhe) TL:DR: Die GPN ist eine offene, spendenfinanzierte Communityveranstaltung, bei der du zum Beispiel gemeinsam hacken, Gulasch essen oder Vorträge schauen kannst. Melde dich bitte trotzdem an. Die GPN funktioniert, weil du als teilnehmendes Wesen dazu beiträgst. Sei es indem du bei diversen Aufgaben hilfst („trollst“) (demnächst verfügbar) oder … Weiterlesen … 21. Gulaschprogrammiernacht 18. April 2023 DE EN ch(ea|i)p alternatives Es ist nun wieder soweit: Wir laden euch herzlich zur 21. Gulaschprogrammiernacht ein! Save the date: 08.06.2023 – 11.06.2023 in HfG und ZKM, Lorenzstr. 15, 76135 Karlsruhe, Baden, Baden-Württemberg, Europa, Erde, Sonne, α-Quadrant, Milchstrasse, Laniakea Anmeldung: https://join.gulas.ch Einreichungen: https://cfp.gulas.ch (Deadline: 07.05.2023 23:59) Auf der Gulaschprogrammiernacht gibt es wieder alles, was das Hacker- bzw. Haecksen-Herz begehrt: Vorträge, Workshops, Demoshow, Blinkedingsies, Musik, ein großes Hackcenter, Karlsruhes Jahresvorräte an Mate und Tschunk, … Weiterlesen … 20. Gulaschprogrammiernacht 3. März 2022 DE EN factory reset … done: hello, world Mit Spannung habt ihr es erwartet, ein paar panische Nachfragen haben uns schon erreicht. Jetzt ist es endlich so weit: Wir laden euch dieses Jahr — eine Woche früher als sonst — herzlich zur 20. Gulaschprogrammiernacht ein! Save the date: 19.05. – 22.05.2022 in HfG und ZKM, Lorenzstr. 15, 76135 Karlsruhe, Baden, Baden-Württemberg, Europa, Erde, Sonne, α-Quadrant, Milchstrasse, Laniakea Diese GPN findet unter neuen und besonderen Bedingungen statt. Wie die Regelungen im Bezug auf die COVID19-Pandemie sind, können wir voraussichtlich im April 2022 … Weiterlesen …"
