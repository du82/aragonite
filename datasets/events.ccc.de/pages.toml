["https://events.ccc.de/congress/2006"]
title = "Overview - 23C3 Public Wiki"
full_description = 'Overview From 23C3 Public Wiki Jump to: navigation, search This is the staticized version of the wiki. Some pages and all dynamic functions wont work, however, most information should be still accessible. With many thanks to all those spambots that forced us to shut down the wiki itself. The 23rd Chaos Communication Congress (23C3) is a four-day conference on technology, society and utopia. The Congress offers lectures and workshops on a multitude of topics including (but not limited to) information technology, IT-security, internet, cryptography and generally a critical-creative attitude towards technology and the discussion about the effects of technological advances on society. The Chaos Communication Congress is the annual congress of the Chaos Computer Club e.V. (CCC). The Congress has established itself as the "European Hacker Party" bringing in people from all over Europe and even further away. The congress not only addresses the techno geek but also those who are interested in appliances and aftermathes. A part of the lectures will be held in English, the rest in German. The language used for each lecture is clearly marked in the conference program. Here you find a simple overview of the areas, activities and some projects at 23C3. You also might want to check our Categories list. Contents 1 Conference 2 Hackcenter 3 Art & Beauty 4 Phone Operation Center if (window.showTocToggle) { var tocShowText = "show"; var tocHideText = "hide"; showTocToggle(); } Conference The conference consist of lectures, discussions and workshops in four tracks. The conference is structured in five main topic categories: Hacking, Science, Community, Society and Culture. The Congress Schedule offers a list of all planned lectures and the speakers, as well as day-by-day timetable. Hackcenter The Hackcenter is a big area at the Congress where you can be present with your own hardware. We provide the infrastructure for networking and to connect to the Internet. Also the regional groups of the Chaos Computer Club will present themself in the Hackcenter. Get to know CCC members that live in the same city or region as you. Perhaps you want meet them again at home or even join them. We want to stress the point that the Hackcenter is more of an experimental laboratory bot is not the place for LAN parties. Art & Beauty "You can create art and beauty with a computer". This is the motto of Art & Beauty, a special area in the heart of the Congress. Art & Beauty attracts the artistic and creative scene. Art & Beauty is workshop, installation and happening at the same time - at a single place. Phone Operation Center The Phone Operation Center will be present at the congress this year again with a mobile DECT system and phone infrastucture. The entire building and parts of the Alexanderplatz will be covered with DECT. You can bring your own DECT phone and register it at the congress. So you will be able to call other congress participants for free. To secure your personal extension in advance please register and then enter your extensions in the phonebook. It will be possible to receive calls from outside via a fixed number + extension, too. Retrieved from "https://events.ccc.de/congress/2006/Overview"'
