["https://events.ccc.de/tag/chaos-communication-congress"]
title = "Chaos Communication Congress - CCC Event Blog"
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. … Weiterlesen … 38C3: Lightning Talks 18. Dezember 2024 DE EN TL;DR Es gibt zwei Sessions mit Lightning Talks Anmeldung unter https://cfp.cccv.de/38c3-lightningtalks/cfp Weitere Infos unter https://events.ccc.de/congress/2024/infos/lightning-talks.html Lightning Talks? Du denkst, die Erfahrung, Deine Ideen vor einem riesigen Publikum auf einem C3 zu teilen, ist etwas, das Du nie erleben würdest? Arbeitest du an einem coolen Projekt und willst es bekannt machen? War Dein Vortrag einer von Hunderten, die abgelehnt wurden? Hast du dir einen tollen Hack ausgedacht, den du einfach teilen musst? Dann melde Deinen Lightning Talk jetzt an! Die … Weiterlesen … 38C3: Self-organized Sessions 16. Dezember 2024 DE EN TL;DR Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen. Self-organized Sessions können bereits jetzt angelegt werden, aber die Räume dafür sind erst ab dem 17. Dezember buchbar. Eine Übersicht aller Self-organized Sessions findet ihr im Hub. Für die Anmeldung einer Self-organized Session verwendet ihr das Backoffice des Hub. Selbstorganisation ist das magische Wort Ihr wollt ein Treffen einer Gruppe oder zu einem bestimmten Thema organisieren? Einen Workshop veranstalten? Einen Wettbewerb oder ein Spiel veranstalten? Habt etwas außerhalb des Gebäudes … Weiterlesen … 38C3 Hub / Wiki / Assemblies 6. Dezember 2024 DE EN Wir haben das 38C3 Public Wiki eröffnet - das wir inzwischen allgemein „Hub“ nennen. Der Hub ist als zentraler Ort gedacht, um sich über die Angebote des Kongresses zu informieren: Er fasst die Veranstaltungen der Hauptbühnen (Fahrplan), Community Bühnen, Assemblies sowie selbstorganisierte Sessions in einer Übersicht zusammen, die dann auch von den mobilen Apps genutzt wird. Ihr könnt die angemeldeten und akzeptierten Assemblies in der Assembly-Liste einsehen. Bitte beachtet, dass das Assembly-Team noch nicht alle Anmeldungen bearbeitet hat und sich die Liste in den nächsten Tagen noch weiter … Weiterlesen …"
