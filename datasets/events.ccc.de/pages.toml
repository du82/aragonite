["https://events.ccc.de/category/datenspuren"]
title = "Datenspuren - CCC Event Blog"
full_description = '''Datenspuren 2024: Was nun? Was tun! – Wir suchen noch Einreichungen! 26. Juli 2024 DE tl;dr Wir suchen noch Einreichungen zu den Datenspuren 2024. Am 20.–22. September 2024 in Dresden. Was tun? Hier! Call for Sessions Wir suchen noch Einreichungen! Solltest du also einen Vortrag oder Workshop halten wollen, dann freuen wir uns über deine Einreichung! Thematisch passt alles zwischen Technik und Gesellschaft, also neben klassischen Tech-Talks auch insbesondere: Überwachung, Datenschutz, offene Daten dezentrale und kritische Infrastrukturen Nachhaltigkeit, Kreislaufwirtschaft Gerechtigkeit, Abbau von Barrieren Junghackertrack – Löten, Programmieren, Spaß am Gerät Dein Vortrag … Weiterlesen … Datenspuren 2024: Was nun? Was tun! 14. März 2024 DE tl;dr: 20 Jahre Datenspuren. Am 20.–22. September 2024 in Dresden. Was tun? Hier! ++++ Datenleck bei ACME Inc.: 42 023 Mrd. sensible Datensätze gestohlen¹ und veröffentlicht ++++ Innenminister fordert flächendeckende Sicherheitsmaßnahmen² für Blåhaje ++++ Künstliche Intelligenz überzeugt³ die Bevölkerung mit … ++++ Der Nachrichtenticker überschlägt sich wieder einmal mit Hiobsbotschaften. Die Galaxie scheint in den letzten 20 Jahren, in denen sich das Raumhabitat C3D2 in der Umlaufbahn um den Planeten Erde befindet, immer weiter aus den Fugen geraten zu sein. Aus dessen Raum kurz über … Weiterlesen … Datenspuren 2024: 20 Jahre Datenspuren 10. Januar 2024 DE Liebes Chaos, die Datenspuren feiern ihren 20. Geburtstag und laden euch zu drei Tagen Chaos in Dresden ein. Es wird wie immer eine bunte Mischung an Vorträgen und Workshops rund um Technik und Gesellschaft geben. Save the Date! Wann: 20.09. - 22.09.2024 Wo: Zentralwerk, Heidestraße 2, 01127 Dresden Wie viel: Eintritt frei. Bleibt auf dem Laufenden: Webseite: https://datenspuren.de/ Mastodon: https://c3d2.social/@datenspuren Chaos Computer Club Dresden: https://c3d2.de Diskordische Grüße, euer Chaos Computer Club Dresden Datenspuren 2021: Log Down Light 3. September 2021 DE tl;dr: 18.–19. September 2021 Datenspuren in Dresden 07:39:01 CRON[797003]: (root) CMD ( [ -x /usr/lib/php/sessionclean ] && \ if [ ! -d /run/systemd/system ]; then /usr/lib/php/sessionclean; fi) Aus den Rechenzentren dieser Welt ertönt ein dröhnendes Rauschen. 07:49:11 asterisk[1427]: #033[1;33mNOTICE#033[0m[1734]: #033[1;37mchan_sip.c#033 [0m:#033[1;37m15981#033[0m #033[1;37msip_reg_timeout#033[0m: -- Registration for '6888@voip.eventphone.de' timed out, trying again (Attempt #684751) In dunklen Kammern rauschen Logdateien auf die Festplatten, um dann meistbietend versteigert … Weiterlesen …'''
