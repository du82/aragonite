["https://events.ccc.de/en"]
title = "CCC Event Blog"
full_description = "Tag des offenen Hackspace 2025 28. Februar 2025 DE TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25 Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor … Weiterlesen … Easterhegg 2025: Call for Participation 16 January 2025 EN DE tl;dr Easterhegg 2025: CfP is here Easterhegg 2025 will take place from 18 April to 21 April 2025 in Hamburg. Once again, there will be four days of workshops, talks and other events. This time, everything revolves around the motto “Unhandled Eggception” – and we are looking forward to your creative, technical and extraordinary interpretations of it. The Call for Participation is therefore open and will accept your submissions until (and including) 1 March 2025. Easterhegg is a friendly community event where we can get to know each other and brainstorm new ideas together. It is the perfect … Read more … 38C3: Last (and Lost) Things 12 January 2025 EN DE 38C3 is over. Sadly. We hope that your journey home went well and that you had a good return to reality. Those four days of living a utopia were far too short. There was so much more that one could have experienced, so many more things to discover, so many more people to meet, so many more talks to see … To our own regret, the length of the event can’t really be changed. But many other things can be! That is why we want to ask for your feedback. Let us know what you liked, but also what you didn’t like. We appreciate both praise and constructive suggestions for improvement! But you need to be … Read more …"
