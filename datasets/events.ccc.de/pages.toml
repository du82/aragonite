["http://events.ccc.de/camp/2007/Chaos_Communication_Camp_2007"]
title = "Chaos Communication Camp 2007 - Chaos Communication Camp 2007"
full_description = '''Chaos Communication Camp 2007 From Chaos Communication Camp 2007 Jump to: navigation, search The Chaos Communication Camp is an international, five-day open-air event for hackers and associated life-forms. The Camp 2007 featured two conference tracks with interesting lectures, workshops and other stuff. It took place from August 8th to 12th 2007 in Finowfurt near Berlin. The Camp had everything you need: power, internet, food and fun. The official Chaos Communication Camp 2007 Movie Documentation is now released. Head over to chaosradio.ccc.de for the 53min movie (mirror at archive.org). There also exists a short cut of 7min runtime, to be found here. This system is a wiki and contains both official and participant-contributed content. Important announcements are published via our events weblog, too, please subscribe to the RSS-Feed. We encourage you to come up with good ideas, interesting projects and general feedback at any time. This time it's going to be even more fun for everyone, for sure! Please give feedback for the talks you attended (via the Fahrplan) and general feedback. Camp General Information Fahrplan - lectures at the camp Alternative: Fahrplan Overview - experimental - editable Fahrplan inside of this wiki Things to bring - checklist and suggestions FAQ - put your questions here and get them answered Propaganda - desktop pictures, banners, etc. Projects - Projects at the Camp Villages - Villages at the Camp Workshops - Workshops at the Camp Donations - Support the Camp Tickets - Pricing Location - Location Contact - how to reach us Press - Guidelines for the Press Games - Sports in CCC Communication CCC Event Weblog -- the official way to inform you Weblogs -- weblogs and podcasts covering the camp Press Review -- what others say about the camp Photos -- pictures taken at the camp. Add yours! Camp Facilities POC -- Phone Operation Center NOC-Helpdesk -- Proxy to the Network Operation Center Network File-Server Camp from above -- our camp airplane! Food -- what and where to eat & drink at the camp Streams -- Audio/Video streams CERT -- Chaos Emergency Response Team Ministry of Information -- Information, lost & found, and more Volunteers -- about being a Chaos Angel Kindergarten -- self-organized children's area Sputnik -- on-site RFID visitor tracking General Information Travel / Getting there - by bus, train, plane or car Travel / Getting home - arrange for lifts Shopping -- looking for the next ATM, Pharmacy, Hardware store? Maps -- maps and coordinates http://etherrape.lochraster.org -- Live weather from our weather station at the camp. Located here [1] We already have Camp_Sehnsucht! One of our Echo Base / London Chapter members put together a CCC 2007 video Watch the CCC 2007 Camp Closing Event - The End Who are You? - Find friends from Camp. Retrieved from "http://events.ccc.de/camp/2007/Chaos_Communication_Camp_2007"'''
