["https://events.ccc.de/2024/12/19/38c3-call-for-heralds"]
title = "38C3: Call for Heralds - CCC Event Blog"
description = """
TL;DR Auch in diesem Jahr werden die Heralde durch das Programm des 38C3 führen. Im Gegensatz zum letzten Jahr hat sich einiges geändert.
Möchtest du dich im Herald-Team einbringen? Dann melde dich bis zum 24.12. bei info@heralde.org mit folgenden Informationen:
in welcher Herald-Kategorie siehst du dich (erfahrene*r Herald / Mentor*in, Herald-Mentee oder Community-Herald) Link zu einer Aufzeichnung deiner Moderation (falls vorhanden) Sprachkenntnisse (de/en/fr) bevorzugte Themen/Tracks (z.B. Security, Hardware, Politics & Society, Art & Beauty) Verfügbarkeit (Tag x, vormittags, nachmittags, abends, nachts) Die Heralde führen durch das Bühnenprogramm des 38C3. Sie stellen Vortragende vor, achten auf die Zeit und moderieren die Fragerunden."""
full_description = "38C3: Call for Heralds 19. Dezember 2024 DE EN TL;DR Auch in diesem Jahr werden die Heralde durch das Programm des 38C3 führen. Im Gegensatz zum letzten Jahr hat sich einiges geändert. Möchtest du dich im Herald-Team einbringen? Dann melde dich bis zum 24.12. bei info@heralde.org mit folgenden Informationen: in welcher Herald-Kategorie siehst du dich (erfahrene*r Herald / Mentor*in, Herald-Mentee oder Community-Herald) Link zu einer Aufzeichnung deiner Moderation (falls vorhanden) Sprachkenntnisse (de/en/fr) bevorzugte Themen/Tracks (z.B. Security, Hardware, Politics & Society, Art & Beauty) Verfügbarkeit (Tag x, vormittags, nachmittags, abends, nachts) Die Heralde führen durch das Bühnenprogramm des 38C3. Sie stellen Vortragende vor, achten auf die Zeit und moderieren die Fragerunden. Um Herald zu werden, ist das Einführungsmeeting an Tag 0 Pflicht. Uhrzeit und Raum werden wir noch bekanntgeben. Es gibt drei Herald-Typen: erfahrene Heralde / Mentor*innen Wenn du bereits Moderationserfahrungen auf größeren Bühnen (Publikum > 500 Personen) gesammelt hast, dann bist du hier genau richtig. Herald-Mentees Du hast schon erste Moderationserfahrung auf kleineren Bühnen gesammelt und möchtest nun auf die ganz große Bühne? Dann sind die Mentee-Schichten genau das richtige für dich. In einer Mentee-Schicht läufst du mit einer erfahrenen Person des Herald-Teams im Main-Track mit. Wenn dein*e Mentor*in und du das Gefühl haben,dass du bereit bist, einen ersten Vortrag im Main-Track zu moderieren, bekommst du die Möglichkeit. Wenn alle Stricke reißen, ist dein*e Mentor*in da, um zu übernehmen. Community-Heralde Die Community-Bühnen haben ihr ganz eigenes großartiges Programm, das genauso viel Aufmerksamkeit und gute Heralde verdent wie der Main-Track. Wenn dir also die kleine Bühne mehr liegt oder du das Programm selber mitgestaltet hast, bist du hier genau richtig. Die Community-Bühnen sind auch eine Möglichkeit, um zu schauen, ob im nächsten Jahr vielleicht die große Bühne das Richtige für dich ist. Willst du dich in einer dieser Rollen im Herald-Team einbringen? Dann melde dich bis zum 24.12. bei info@heralde.org mit folgenden Informationen: in welcher Herald-Kategorie siehst du dich (erfahrene*r Herald/Mentor*in, Herald-Mentee oder Community-Herald) Link zu einer Aufzeichnung deiner Moderation (falls vorhanden) Sprachkenntnisse (de/en/fr) bevorzugte Themen/Tracks (z.B. Security, Hardware, Politics & Society, Art & Beauty) Verfügbarkeit (Tag x, vormittags, nachmittags, abends, nachts)"
