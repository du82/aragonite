["https://events.ccc.de/en/2006/04/20/its-feedback-time"]
title = "It’s Feedback Time - CCC Event Blog"
description = """
We are coming along well. The recordings are on the server now and we are creating .torrent files now. Once ready, we will publish them so that you can use BitTorrent to download them. Once we feel that the first run is over, we will open direct HTTP access to the files. If we would do this from the beginning, I am sure the server wouldn’t survive it.
So now that we are able to give you what you want, there is something we want from you:
PLEASE PROVIDE FEEDBACK ON THE LECTURES!
USE THE FEEDBACK FORMS!
Each event has it’s own unique feedback URL, easily accessible on each event’s web page in our 22C3 Fahrplan."""
full_description = "It’s Feedback Time 20 April 2006 EN We are coming along well. The recordings are on the server now and we are creating .torrent files now. Once ready, we will publish them so that you can use BitTorrent to download them. Once we feel that the first run is over, we will open direct HTTP access to the files. If we would do this from the beginning, I am sure the server wouldn’t survive it. So now that we are able to give you what you want, there is something we want from you: PLEASE PROVIDE FEEDBACK ON THE LECTURES! USE THE FEEDBACK FORMS! Each event has it’s own unique feedback URL, easily accessible on each event’s web page in our 22C3 Fahrplan. So it shouldn’t be too hard to locate the proper resource. For instance, if you just seen the recently posted video of our 22C3 Opening Event, why not go ahead and give us feedback on this on the corresponding feedback page? Oh, that easy? Yes. That easy. Apart from the rating, please also leave an opinion on the lecture as well. This doesn’t have to be much, just speak your mind and let us know what you think. This whole feedback business is very helpful for us in determining what was okay and what went wrong. So please take your time and tell us what you think. Thank you."
year_published = 2006
