["https://events.ccc.de/category/34c3"]
title = "34C3: tuwat (2017) - CCC Event Blog"
full_description = "#tuwat, make congress accessible for all creatures 9. Januar 2018 DE EN Du hast Post-Congress-Entzugserscheinungen? Du möchtest eigentlich Talks schauen, das endet aber damit, dass du auf media.ccc.de scrollst und von nichts richtig überzeugt bist? #tuwat, schau Talks und sei gleichzeitig ein aktiver Part vom Congress! Hilf uns mit dem Untertiteln für die Aufzeichnungen! Du findest uns auf c3subtitles.de und im IRC-Channel #subtitles auf hackint.org. Was gibt es zu tun? Die fertigen Untertitel entstehen in zwei Phasen: Zunächst wird ein Transkript erstellt, das dann zum Video synchronisiert wird. Für das Transkript musst du automatisch generierte Untertitel … Weiterlesen … Kommt vorbei – der 34C3 baut ab 2. Januar 2018 DE EN Der 34C3 ist noch nicht ganz vorbei! Wie jedes Jahr findet nach der Veranstaltung der Abbau statt, bei dem es für jeden der noch vor Ort ist eine weitere Gelegenheit gibt, beim Congress mitzuhelfen. Wenn ihr also noch Lust auf gemeinsame Arbeit habt dann kommt vorbei. Dieses Mal läuft der Abbau bis zum 5.1. und wir können täglich ab etwa 11 Uhr helfende Hände gebrauchen. Am 4.1. ab 9 Uhr brauchen wir besonders viel Hilfe – insbesondere Leute die physisch fit sind – um große Mengen an Flightcases und anderem Material zu verladen. Aktuelle Informationen gibt es auf Twitter unter @c3logistic oder … Rück-Bauwat! 29. Dezember 2017 DE EN Hallo am Kongress teilnehmende Lebensformen, morgen geht der 34c3 leider zu Ende und es steht der Abbau an. Dazu brauchen wir eure Hilfe. Wir bitten alle Assemblies, mit dem Ende des Closing-Event um 18:15 am 30.12. ihre Assembly zurückzubauen. Nachdem ihr eure Assembly zurückgebaut habt, stapelt bitte eure Tische und Stühle sortenrein und stickerfrei. Bitte entfernt dabei die Stühle und Tische nicht von eurer/em Assembly/Planquadrant, sondern stapelt sie an Ort und Stelle. Mit dem Abbau der Assemblies ist es aber nicht getan, für den weiteren Abbau freuen wir uns über jede helfende Hand. Wir … Weiterlesen …"
