["https://events.ccc.de/category/rc3"]
title = "rC3 (2020) - CCC Event Blog"
full_description = "rC3 Call for Subtitlers 6. Januar 2021 DE EN C3Subtitles?! Hat dich im Lockdown die Langeweile und die Sehnsucht nach Chaos Events gepackt? Sitzt du daheim und schaust sehnsüchtig die Talks vom rC3 und vergangenen Chaos Veranstaltungen? Bring ein bisschen Congress zu dir nach Hause, wie beim rC3, und bringe dich ein, die Qualität und Barrierefreiheit der CCC-Aufzeichnungen zu verbessern! Du kannst jederzeit von Zuhause aus an Untertiteln für die Recordings arbeiten. So lange oder kurz du möchtest! Wie geht das? Die Transkripte sind software-autogeneriert und werden von Dir in einem Etherpad verbessert. Aufgrund von Akzenten der Speaker … Weiterlesen … #rC3: Es war einmal kein Congress … 31. Dezember 2020 DE EN Guten Abend, und willkommen zum Closing-Event. 4 Tage Veranstaltung haben wir jetzt hinter uns, nicht immer ist alles ganz gut gelaufen, aber hey, es war für uns alle das erste Mal und es war eine großartige Veranstaltung. Diese remote Chaos Experience war genau das: eine Chaos Experience, eine großartige. Ich hab es mehrfach geschafft, in die Lobby zu laufen, um an einen bestimmten Ort zu gehen, und wie auf jeder realen Congress-Veranstaltung mich 2 Stunden später an einem völlig anderen Ort, mit völlig fremden Leuten wiederzufinden, um etwas zu entdecken, von dem ich gar nicht wusste, dass … Weiterlesen … #rC3: Farewell 31. Dezember 2020 DE EN Irgendwann am Morgen von Tag 4, die Uhr des Kern-Orga-Jitsis zeigte Stunde 48, saßen wir zur Übergabe zusammen. Wir überlegten, sinnierten, nerdeten und fragten, was wir zum Abschluss schreiben könnten. Wir einigten uns auf ein bekanntes populärkulturelles Zitat, das die 2D-Welt-Entwickler dieses Events zur Beschreibung ihres internen Kanals nutzten: “In the beginning the Universe was created. This has made a lot of people very angry and has been widely regarded as a bad move.” — Douglas Adams, The Restaurant at the End of the Universe Am Ende dieser Veranstaltung, nach 96 Stunden remote … Weiterlesen …"
