["https://events.ccc.de/category/36c3"]
title = "36C3: Resource Exhaustion (2019) - CCC Event Blog"
full_description = "Call for Subtitles 3. Januar 2020 DE EN Hat dich die Post-Congress-Depression gepackt? Sitzt du daheim und schaust sehnsüchtig die Talks von zwischen den Jahren? Bring ein bisschen Congress zu dir nach Hause und bringe dich ein, die Qualität und Barrierefreiheit der CCC-Recordings zu verbessern! Du kannst jederzeit von Zuhause aus an Untertiteln für die Recordings arbeiten. So lange oder kurz du möchtest! Wie geht das? Die Transkripte sind software-autogeneriert und werden von Dir in einem Etherpad verbessert. Aufgrund von Akzenten der Speaker und Fachvokabular ist das dringend notwendig. Danach folgt wieder ein automatisierter … Weiterlesen … Resources exhausted: Abbau 29. Dezember 2019 DE EN TLDR: Moin, morgen 18:15 ist Schluss, baut ab, macht keinen Scheiß. Hallo am Kongress teilnehmende Lebensformen, morgen geht der 36c3 leider zu Ende und es steht der Abbau an. Dazu brauchen wir eure Hilfe. Wir bitten alle Assemblies, pünktlich mit dem Ende des Closing-Event um 18:15 am 30.12. mit dem Abbau ihrer Assembly zu beginnen. Bitte transportiert euren Kram über die Tore Halle 2 – Gate 2.5, Halle 2 – Gate 2.6 and Halle 3 – Gate 3.6 ab. Dort findet ihr Engel mit Hubwägen und Paletten, die euch helfen euer Zeug von eurer Assembly zu bewegen. Die Einfahrt auf das Gelände erfolgt über Tor … Weiterlesen … Recreate Minds and Bodies and Keep Enjoying! #36C3 #ABFahrplan 27 December 2019 EN Resources are limited and we are exhausted. Here is no blog post, but the ABFahrplan. Go, listen, chill, admire, dance. Let’s recreate minds and bodies and still keep enjoying. Don’t miss out on our Chaos Ballett on Day 2 27 December 2019 EN Moving their bodies as and to code: We’re proud to host Chaos Ballett performing a story by Sina Kamala Kaufmann, featuring Margarida Isabel de Abreu Neto, Lena Fritsch et.al. Music by: Thomas Liebkose & Fabian Rack feat. Kabel Trace. One of the acts where hiding them in the distance on the larger stages would be a shame, our content curation team “Art & Culture” recommends watching the Ballett! Read more …"
year_published = 2020
clearnet = "https://events.ccc.de/category/36c3"
