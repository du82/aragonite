["https://events.ccc.de/en/2024/12/22/38c3-poc-isdn-version"]
title = "38C3: ISDN Version - CCC Event Blog"
description = """
TL;DR

Registration is open - register your extension in Guru
Don’t forget to bring your phone (DECT, GSM, SIP)
Remember to bring Batteries, Chargers und CCC SIM-Card
Our public dialin number: +49 40 5730830 xxxx"""
full_description = "38C3: ISDN Version 22 December 2024 EN DE TL;DR Registration is open - register your extension in Guru Don’t forget to bring your phone (DECT, GSM, SIP) Remember to bring Batteries, Chargers und CCC SIM-Card Our public dialin number: +49 40 5730830 xxxx 2024. The brave new world has completely transformed telephony. IP telephony has replaced conventional telephone technology, including ISDN and all its components. Until 2017, we drove a truck to the Chaos Communication Congress on December 21. We spent days hauling, packing, pulling cables, patching cables, configuring, maintaining main distribution plans and fixing errors so that everything was up and running by 26.12. at the latest. Then we registered every DECT phone by hand from 26.12. onwards. We were finished on 29.12. and on 30.12. we dismantled until the new year. Over the past few years, we have packed our IP DECT system with features and optimized everything to such an extent that we have even laser-cut our own boxes for our hardware. We have 3D printed logos for our DECT RFPs, a web server runs in the PoC dwarf and how it works is properly documented in the internal wiki. With screenshot. Translated with DeepL.com (free version) Boring! We arrive by car, someone pushes a computer into the rack, we distribute a few RFPs, connect them to the network and we’re done. Cabling? We don’t do that anymore. We’ve outsourced that to the internet manufacturer. Logging in? We no longer do that. We’ve outsourced it to the users. All the vintage technology is done by Chaosvermittlung. Last year, we took part in Hack Zuck on day one as a team. Because we had time. It couldn’t go on like this. We all realized it was five before total neglect. Tidiness was getting out of hand and before anyone™ had the idea of making art, someone else™ found a very large metal cupboard that was bigger and heavier than our old, rationalized telephone system. The metal cabinet goes by the name of EWSD, which means Electronic Dialing System Digital. And all like this: Yeah! Back to ISDN ISDN has been switched off. We’re switching it back on! And analog telephony too. EWSD is a digital (ISDN) exchange from Siemens for public telephone networks that was in operation between 1980 and today. We have reduced it to a minimum, will set it up at the Congress and connect it to the PoC network. Visitors have the option of connecting to the EWSD via ISDN or analog. For ISDN: If you have an NTBA, please bring it with you. If you don’t have an NTBA, you can borrow one from us. For the complete retro experience, you can dial into the Internet via modem or ISDN. Of course with channel bundling. You’ll be surfing faster than you have for a long time! It is not necessary to register an extension in the Guru for an EWSD connection, there are fixed extensions for this which are assigned locally. More Information. For EWSD information, keep an eye on @c3isdn. Regisgter an extension As every year, you can register your extension(s) in GURU3. We offer DECT, SIP, GSM, Callgroups, Applications, Announcements and Special Extensions. Please make sure that you register your extension in the correct event. You do not need to register for analog or ISDN extensions (see above). Registration has been open since 25.11.2024. The reserved extensions are reserved until 13.12. Reservations that are not redeemed then fall back into the pool. DECT & EPDDI It is our core product. Stable since 1993, always with the best network coverage1 at the congress. In the underground car park, on the toilet or on the dance floor. If you can’t be reached on your DECT phone, it’s not because of Eventphone. Want to know if your device works with our system? Take a look at the DECT Phone Compatibility List. There will also be EPDDI (EVENTPHONE Decentralized DECT Infrastructure), which means: The EVENTPHONE network from the congress - wherever you want it. In the hotel, at home, in the hackerspace or on the train. You decide. If you have RFP & Router, you can find the documentation for integration here. GSM There will also be mobile communications again at 38C3. There will be 2G, 4G and also 5G coverage. Bring your cell phones and CCC SIM cards. New SIM cards from the camp are also still available. For information on mobile networks, keep an eye on @c3gsm. And what else? From 26.12.2024, we will provide up-to-date information on the status of our services on our Dashboard. Instructions to register a DECT SIP configuration instructions Special extensions Our Wiki with useful information Our public dialin number: +49 40 5730830 xxxx With DECT, GSM, Premium SIP, analog and ISDN connections, you can make phone calls from the event to anywhere in the world. Many thanks to Sipgate for this. We look forward to seeing you in Hamburg. Don’t forget your phones. Whether analog, ISDN, DECT or mobile. Don’t forget batteries, chargers, connection cables and SIM cards. Danke. Eventphone. also in selected hotels and areas of HafenCity ↩︎ Chaos Communication Congress DECT GSM SIP EVENTPHONE POC"
year_published = 2024
year_updated = 2024
