["https://events.ccc.de/category/28c3"]
title = "28C3: Behind enemy lines (2011) - CCC Event Blog"
full_description = "#35C3 Memory Lane: Das erste Türchen 1. Dezember 2018 DE Das erste Türchen. 2011 war das letzte Jahr, in dem der Chaos Communication Congress im Berliner bcc gastierte. Passend zum damaligen Motto „Behind enemy lines“ kommentierte der Schriftsteller und Journalist Cory Doctorow in seinem Vortrag „The coming war on general computation“ vor vollem Haus die Copyright Wars. Weiterlesen … Recordings of 28C3 talks available 31 December 2011 EN The 28th Chaos Communication Congress ended yesterday and most of the talks are already available for download. http://events.ccc.de/congress/2011/wiki/Documentation Credit goes to the FEM, who did a really tremendous job streaming the talks during the conference and who still continue their hard work by publishing the Official Releases of the last talks. Did you really love certain events? Weren’t so excited about others? Let us know! You can leave feedback via the Fahrplan. Find the events you’d like to leave your thoughts on and click on the green “Give Feedback” link in the lower right … Read more … Crypto talk at 28C3: Sovereign Keys – A proposal for fixing attacks on CAs and DNSSEC, Day 3, 23:00, Saal 3 29 December 2011 EN After many attacks on X.509 and the internet PKI infrastructure, it became clear, that the current state does not meet the requirements for the upcoming challenges for secure internet communication in the future. CAs have been completely compromised, and weak cryptography used by PKIs has been broken in practice to issue rouge certificates. So there is a need for an alternative how to establish a binding between your public key and your identity. The EFF will present their proposal to improve the security of SSL/TLS connections this evening at the congress. See the talk, Day 3, 23:00, Saal 3. … “Neue Leichtigkeit” 29 December 2011 EN Tonight the young Swiss music group “Europa” is bringing “new airiness” to the 28C3 in the form of a Gala. The main goal is to put in question the practice of the entertainment industry and alienate its conventions by overdriving them. It’s going to be an experiment you can become part of as spectators. Please watch the following teaser. [The teaser has been removed since the server hosting it was a temporary one located at 28c3. Check the vimeo link below or download the recording of the actual talk] Video: http://vimeo.com/34302758 Link 28C3 Fahrplan: …"
year_published = 2018
