["https://events.ccc.de/2025/01/12/38c3-last-things"]
title = "38C3: Last (and Lost) Things - CCC Event Blog"
description = """
Der 38C3 ist vorbei. Leider. Wir hoffen, ihr hattet eine gute Heimreise und seid gut wieder in der Realität angekommen.
Viel zu kurz waren die vier Tage gelebter Utopie. So viel mehr hätte man noch erleben können, so viel mehr Dinge entdecken, so viel mehr Leute treffen, so viel mehr Vorträge sehen … An der Dauer können wir leider nicht viel ändern. An vielem anderem schon! Daher möchten wir euch mit diesem Blogpost zu Feedback aufrufen. Lasst uns wissen was euch gefallen hat, aber auch, was euch nicht gefallen hat. Wir freuen uns sowohl über Lob als auch über konstruktive Verbesserungsvorschläge!"""
full_description = "38C3: Last (and Lost) Things 12. Januar 2025 DE EN Der 38C3 ist vorbei. Leider. Wir hoffen, ihr hattet eine gute Heimreise und seid gut wieder in der Realität angekommen. Viel zu kurz waren die vier Tage gelebter Utopie. So viel mehr hätte man noch erleben können, so viel mehr Dinge entdecken, so viel mehr Leute treffen, so viel mehr Vorträge sehen … An der Dauer können wir leider nicht viel ändern. An vielem anderem schon! Daher möchten wir euch mit diesem Blogpost zu Feedback aufrufen. Lasst uns wissen was euch gefallen hat, aber auch, was euch nicht gefallen hat. Wir freuen uns sowohl über Lob als auch über konstruktive Verbesserungsvorschläge! Aber beeilt euch: Der Hub wird am 20. Januar archiviert (die genaue Uhrzeit steht noch nicht fest). Danach wird er nur noch lesend zur Verfügung stehen und es kann kein Feedback mehr eingereicht werden. Vier Tage reichen aber auch, um ganz schön viele Dinge zu verlieren. Aber keine Sorge: Das großartige Team der Garderobe kümmert sich nach der Veranstaltung um Fundsachen. Falls ihr während der Veranstaltung im CCH etwas verloren habt, wendet euch gerne an 38c3@c3lf.de. Beschreibt den verlorenen Gegenstand dabei bitte so genau wie möglich, das erleichtert das Suchen. Falls ihr euch nun fragt, wann und wo das nächste Chaosevent stattfindet: Schaut doch mal in unseren Kalender. Future Instructions Vom Kongress in die Realität zurückzukehren, hat sich immer schon auch wie eine Reise in die Vergangenheit angefühlt. Doch diesmal scheint die Zeitlinie fragmentierter als je zuvor. Daher ist jetzt die Zeit zu Handeln: Verbreitet Wissen Wir haben euch Anleitungen gegeben, damit ihr auf kommende schwere Zeiten vorbereitet seid. Nun ist eure Aufgabe, das Wissen zu teilen, Ressourcen zu schaffen sowie Resilienz und technische Selbstbestimmung zu lehren: Werdet Mentor*innen für Schüler*innen, für Journalist*innen oder auch für Menschen, die von Stalking bedroht werden! Vermehrt eure Community Wir wissen, dass nicht alle die Kraft haben, um Repair-Cafes zu gründen oder Install-Partys, Vorträge und Paneldiskussionen zu organisieren. Aber alle Kreaturen des Universums willkommen heißen, die bei euch Unterstützung und Gemeinschaft suchen ist, was wir alle leisten sollten. Jetzt ist wirklich nicht die Zeit, sich im Keller zu vergraben, um stolz auf die Überlegenheit der auserwählten Betriebssysteme, Programmiersprachen, Werkzeuge oder sonstiges zu sein. Bildet Banden Wo Chaos auf Ordnung trifft, gewinnt meist das Chaos, weil es besser organisiert ist. Wenn ihr also auch besorgt über das Erstarken von autoritären Strömungen seid, organisiert euch. Es gibt so viel zu tun, das einen Unterschied macht. Nehmt euch diese Zeit! Dunkle Jahre liegen vor uns und Utopien passieren nicht einfach. Daher, solang’ wir es noch können: Tut euch zusammen und macht was! Bild CC BY-SA Leah Oswald"
year_published = 2025
year_updated = 2025
