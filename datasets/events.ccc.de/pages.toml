["https://events.ccc.de/category/24c3/page/2"]
title = "24C3: Volldampf voraus! (2007) - CCC Event Blog"
full_description = "Fahrplan upcoming 3 November 2007 EN Today was the last content meeting prior to the congress. All submissions are now decided and a lot already have been confirmed. We also prepared an initial schedule using our high-tech “paper on ground floor” method and will be tweaking it over the next days. Expect a preliminary schedule sometime soonish. Press accreditation opens today 23 October 2007 EN For journalistic coverage of 24th Chaos Communication Congress, members of the press – print media, photo, radio, TV, film and news agencies – should request accreditation. If you’d like to be included on the press list, please send your details including publication, site or station name and address, your editor’s name and details, and your circulation to 24c3-press at cccv.de. If you’re a freelancer, please provide a list and details of the publications/media you write for. Since the law may treat bloggers as members of the press, we will do the same. Web media entities of all kinds can get … Read more … Reminder: Submit your talks for 24C3 now! 9 October 2007 EN The call for participation for the 24th Chaos Communication Congress will end in 3 days. This means you have to submit your lecture proposal for the upcoming 24C3 before October 12th, 2007 (Midnight UTC). 24C3 is a low-cost and volunteer-driven event and we have a tiny budget if you compare it to commercial conferences. In many cases, however, we can offer reimbursement for travel expenses. While we cannot sponsor you a free vacation in Berlin, as an accepted speaker you get free entry to the event and we’ll probably be able work out expenses for overseas travel. For further information and … Read more … 24C3 planning in progress (the predecessor) 10 September 2007 EN We didn’t want to keep this from you. A photo of the 24C3 kickoff meeting in the Mauerpark end of August. So idyllic. So much planning already going on, despite the fact that our CCCamp-tested tents were still hung over doors and tables at home for drying and despite the fact that some of us still got glazed looks of reminiscence whenever the Camp came up in the discussion on what to improve and how. Perhaps by now you can guess that we are all eager and looking forward to the 24C3 already… Also, I want to use this posting to repeat, once again: This year’s Congress will have Steampunk woven … Read more …"
year_published = 2007
clearnet = "https://events.ccc.de/category/24c3/page/2"
