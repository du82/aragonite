["https://events.ccc.de/en/2006/04/18/here-we-go"]
title = "Here we go - CCC Event Blog"
description = """
I uploaded the first official 22C3 video recording: it’s the recording of the opening speech and keynote. Unfortunately, the video quality itself is not good as this is one of the recordings that had to be recovered from the failed realtime recordings. Most other videos will be much better. Here it is:
22C3-390-en-private_investigations.mp4 (MPEG-4, 1.2 MBit/s)
A few notes on the format: this is a standard MPEG-4 encoded (audio and video) file in a standard MP4 container file. The native resolution is 720×576 pixels but as this is derived from video, it is a non-square pixel format. The file has the proper bit set (the so-called PAR or SAR bit) to reflect this property."""
full_description = "Here we go 18 April 2006 EN I uploaded the first official 22C3 video recording: it’s the recording of the opening speech and keynote. Unfortunately, the video quality itself is not good as this is one of the recordings that had to be recovered from the failed realtime recordings. Most other videos will be much better. Here it is: 22C3-390-en-private_investigations.mp4 (MPEG-4, 1.2 MBit/s) A few notes on the format: this is a standard MPEG-4 encoded (audio and video) file in a standard MP4 container file. The native resolution is 720×576 pixels but as this is derived from video, it is a non-square pixel format. The file has the proper bit set (the so-called PAR or SAR bit) to reflect this property. Your video player should honor this bit and scale the video on playback, effectively extending the displayed area to 785×576 pixels. We would be happy if you could download the file and post success or failure of playback as a comment to this post so that we know we are safe (or not). We will post the rest of the videos once we are sure everything is fine. Sorry again for all the delay. We will spend another post on what we had to go through to make these works available."
