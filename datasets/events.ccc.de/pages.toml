["https://events.ccc.de/category/mrmcds"]
title = "MRMCDs - CCC Event Blog"
full_description = "MRMCD24: Call for Participation 2. Juli 2024 DE EN TL;DR: Die See ruft! Einreichungen nehmen wir hier entgegen: talks.mrmcd.net/2024/cfp Wir suchen Besatzung aller IT-Bereiche und würden uns freuen, wenn ihr uns bei der Erforschung der digitalen Weltmeere helfen könntet. Unser Augenmerk liegt – unter anderem – auf Netzwerk-Navigation und Kryptographie, der Entwicklung freier Software über und unter der Oberfläche und der Nutzung autonomer nautischer Drohnen. Die Werft der MRMCD verfügt über eines der größten Zentren für die Bergung versunkener Kosten sowie eine Schlosserei, um Datenlecks und Sicherheitslücken zu stopfen. Somit ist sie die … Weiterlesen … MRMCD 2023: Ticketverkauf gestartet 19. Juli 2023 DE EN Liebe Freund*innen des Faktenchecks, garantiert keine Fake-News: Der Ticket- und Merchandise-Verkauf für die diesjährigen MRMCD unter dem Motto „Wem gehört die Realität?“ wurde unter https://presale.mrmcd.net/mrmcd/2023/ gestartet. Es stehen insgesamt fünf Ticketarten zur Verfügung, mit denen wir hoffentlich jeder finanziellen Realität gerecht werden. Wir empfehlen euch, beim Vorverkauf Fakten zu schaffen, da es an der Abendkasse nicht unbedingt realistisch ist, noch ein Ticket zu ergattern. Außerdem wird es wieder ökologisch zertifizierte Fairtrade-Textilien geben, die von einer sozialen … Weiterlesen … MRMCD-CfP: Wem gehört die Wirklichkeit? 23. Juni 2023 DE EN Unsere Realität unterliegt einem radikalen Wandel. Das globale Klima ändert sich und das betrifft nicht nur das Wetter. Die Erzeugnisse maschinellen Lernens erreichen eine Qualität, die es den meisten Menschen unmöglich macht, diese als wahr oder fake einzuordnen. Es werden die „Fakten“ generiert, die gewünscht werden und mit passenden Belegen in Wort, Bild und Ton unterfüttert. Phantasie und Wirklichkeit verschwimmen und werden von den Akteuren mit der größten Reichweite kontrolliert. Dieser Zustand führt uns unweigerlich zu der Frage: Wem gehört die Wirklichkeit? Wir sind auf der Suche nach … Weiterlesen …"
