["http://events.ccc.de/congress/2005"]
title = "22C3: Home Page"
full_description = '22nd Chaos Communication CongressDecember 27th to 30th, 2005Berliner Congress Center, Berlin, Germany The 22nd Chaos Communication Congress (22C3) is a four-day conference on technology, society and utopia. The Congress offers lectures and workshops on a multitude of topics including (but not limited to) information technology, IT-security, internet, cryptography and generally a critical-creative attitude towards technology and the discussion about the effects of technological advances on society. The Chaos Communication Congress is the annual congress of the Chaos Computer Club e.V. (CCC). The Congress has established itself as the "European Hacker Conference" bringing in people from all over Europe and even further away. The congress not only addresses the techno geek but also those who are interested in appliances and aftermathes. A part of the lectures will be held in English, the rest in German. The language used for each lecture is clearly marked in the conference program. If you experience network security problems that are clearly originating at the 22. Chaos Communication Congress network (IP range: 81.163.0.0 - 81.163.255.254), please contact us at the number below. We will immediately try to resolve the problem by technical measures on our site. This number is ONLY for the purpose of reporting serious network security problems, all other requests will NOT be answered at this number. For general contact information (press, general Information etc.) use our general contact information.'
year_published = 2005
