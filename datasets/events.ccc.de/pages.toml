["http://events.ccc.de/congress/2007"]
title = "Welcome! - 24C3 Public Wiki"
full_description = '''Welcome! From 24C3 Public Wiki (Redirected from Main Page) Jump to: navigation, search The 24th Chaos Communication Congress (24C3) is the annual four-day conference organized by the Chaos Computer Club (CCC). It takes place at the bcc Berliner Congress Center in Berlin, Germany. The Congress offers lectures and workshops on a multitude of topics and attracts a diverse audience of thousands of hackers, scientists, artists, and utopians from all around the world. The 24C3s slogan is Volldampf voraus! – the German equivalent of “full steam ahead” – a particular request for talks and projects featuring forward looking hands-on topics. 24th Chaos Communication Congress December 27th to 30th, 2007 bcc Berliner Congress Center, Berlin, Germany Here you find a overview of the areas, activities and some projects at 24C3. As this website is part of a wiki you can contribute information, too. Login or register an account and go ahead. Refer to this help page for information about using a MediaWiki. Information General Contact - how to contact the organizers Tickets - pricing Fahrplan - schedule of the official conference program Press - information for the press Travel - where to go and how to get there Accommodation - where to stay Supporters - thank you! Participate Propaganda - spread the word Volunteers - you can be one of them! Projects - do your project at the 24C3 Call for Participation - submission deadline is gone Conference Fahrplan - schedule of the official conference programm Workshops - self scheduled hands-on events - just do it! Lightning Talks Documentation - streams, DVBT broadcasts, audio/video downloads Facilities Information Desk NOC Help Desk Network Phone Operation Center Speaker's room Press Office CERT - Chaos Emergency Response Team Locations Art & Beauty - cafeteria and lounge Maschinenraum - club and lounge Hackcenter - space for hackers c-base - 24C3 at the space station Documentation Conference Recordings Congress Radio Weblogs Press Review Photo Documentation Get in touch Please consult this Wiki first as your question might already have an answer. Contact email adresses You can contact the organizers via the following email adresses: 24C3-orga (at) cccv.de for organisational issues 24C3-content (at) cccv.de for conference program and other content/cfp-related stuff 24C3-press (at) cccv.de for press and pr issues Contact 24C3 Abuse Handling If you experience network security problems that are clearly originating at the 24. Chaos Communication Congress network (IP range: 81.163.0.0 - 81.163.255.254, AS 249), please contact us at the number below. We will immediately try to resolve the problem by technical measures on our site. This number is ONLY for the purpose of reporting serious network security problems, all other requests will NOT be answered at this number. +49 175 423 70 23 For general contact information (press, general Information etc.) use our general contact information! Mailinglist congress (at) lists.ccc.de ist the mailinglist for general discussion about the Congress. To subscribe, send mail to congress-subscribe (at) lists.ccc.de. Retrieved from "http://events.ccc.de/congress/2007/Welcome%21"'''
