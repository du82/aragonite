title = "About CCC Event Blog - CCC Event Blog"
description = """
This is the CCC Event Blog. It is maintained by members and friends of the Chaos Computer Club.
The blog is dedicated to information about the conferences and events of the CCC and friends. Being our most important event, the annual Chaos Communication Congress is usually the main focus, but we also provide announcements and background information for other CCC events – regional or international. We welcome contributions like the introduction of groups and crews as well as announcements of interesting activities during an upcoming congress or camp or announcements, CfPs, … for other chaos events. This is not limited to CCC or Erfa/Chaostreff events."""
full_description = "About CCC Event Blog EN FR DE This is the CCC Event Blog. It is maintained by members and friends of the Chaos Computer Club. The blog is dedicated to information about the conferences and events of the CCC and friends. Being our most important event, the annual Chaos Communication Congress is usually the main focus, but we also provide announcements and background information for other CCC events – regional or international. We welcome contributions like the introduction of groups and crews as well as announcements of interesting activities during an upcoming congress or camp or announcements, CfPs, … for other chaos events. This is not limited to CCC or Erfa/Chaostreff events. Approach us to get your post published here! For the Congress and Camp, this blog is usually accompanied by a wiki for each individual event that serves as your primary point of collaboration both with us and participants and visitors of the conferences. Contact In case of questions or remarks regarding this blog you can reach us at blog@events.ccc.de. Feel free to contact us if you want to have your own event published here. Have a look at Contributing for guidelines and a template for your post."
