title = "37C3: Unlocked (2023) - CCC Event Blog"
full_description = "Rückschau auf den Azubitag des 37C3 11. März 2024 DE TL;DR Azubitag auf dem 37C3 war toll! Wir machen das wieder. Wir freuen uns im August über Teamverstärkung. Top Azubitag! An Tag 3 des 37C3 fand der erste Azubitag auf dem Chaos Communication Congress statt. Es kamen 140 Azubis aus ganz Deutschland zusammen, um den Congress zu besuchen und den CCC kennen zu lernen. Mit der Eröffnungsveranstaltung gab es eine kurze Einführung in den CCC, Hacking und wie eins auf dem Congress überlebt. Außerdem konnten wir mithilfe verschiedener zivilgesellschaftlich engagierter Organisationen ein Goodiebag mit Tassen, Druckerzeugnissen und Weiterem … Weiterlesen … 37C3: lost+found 14. Januar 2024 DE EN Der 37. Chaos Communication Congress ist vorbei und verräumt. Vermisst du noch etwas? Falls du etwas auf dem 37C3 verloren hast, schreib uns bitte eine E-Mail an 37c3@c3lf.de, falls möglich gerne mit einem Foto und einer Beschreibung. Unser freundliches Garderobenteam kümmert sich um die Fundsachen und nimmt sich deiner Anfrage gerne an. Foto CC BY-SA Martin Müller 37C3: Art & Beauty-Ausstellung ANIMAL()CITY: Unleashed! 27. Dezember 2023 DE EN ANIMAL()CITY: Unleashed! präsentiert in der Ausstellungsfläche im Eingangsbereich des CCH sieben Positionen der beteiligten internationalen Künstler*Innen als physische Exponate, die mit ihren virtuellen Gegenstücken in der Augmented Reality korrespondieren. Die Auswahlarbeit des Art & Beauty-Content-Teams ist schwieriger als in den übrigen Tracks des Konferenzprogramms. Denn Künstler*innen artikulieren sich in ihren Arbeiten, Werken und Positionen – und nicht in Konferenz-Talks und Präsentationen. Zwar gelingt es uns manchmal in Form der berühmt-berüchtigten Performance Lectures … Weiterlesen … 37C3 Congress Everywhere 26. Dezember 2023 DE EN Für alle, die den Congress nicht besuchen, gibt es natürlich wieder die Möglichkeit, sich im Hackerspace zu treffen, gemeinsam Vorträge zu streamen, hacken, Party usw. In diesen Tagen ist der Congress überall, wo er gelebt wird. Dabei gibt es auch die Möglichkeit, sich gegenseitig zu besuchen. Folgende Spaces haben sich dafür gemeldet: Ort Tag 1 Tag 2 Tag 3 Tag 4 Link zum Space Basel ab 13:00 ab 13:00 ab 13:00 ab 13:00 ccc-basel.ch Bielefeld ab 16:00 ab 16:00 ab 16:00 ab 16:00 space.bi Essen – ab 10:00 ab 10:00 – chaospott.de Erfurt tba tba tba tba bytespeicher.org Heilbronn … Weiterlesen …"
