["https://events.ccc.de/2019/08/07/kuchenengel-oder-villagekuche-macht-euer-frikadellendiplom"]
title = "Küchenengel oder Villageküche? Macht euer Frikadellendiplom! - CCC Event Blog"
description = """
Was brauche ich für ein Frikadellendiplom?*
Als erstes brauchst du eine Hygienebelehrung nach„§43 Infektionsschutzgesetz vom Gesundheitsamt (in einigen Städten dürfen auch einige bestimmte Ärzte diese Belehrung vornehmen). Für dich zuständig ist das Gesundheitsamt an deinem Erstwohnsitz oder an deinem Arbeitsplatz (Erfa-Kreis). Einige sehen das lockerer, andere nicht. Bei manchen muss man einen Termin ausmachen, bei anderen kann man einfach vorbei kommen. Manche zeigen dann einfach ein Video, bei anderen ist es ein Vortrag. Suche zum Beispiel nach „deineSTADT Hygiene Belehrung“.

Auf dem Camp (und den Kongressen) gibt es den zweiten Teil, offiziell „Arbeitgeberteil“, den der CCC als Verein veranstalten darf. Infos dazu unter @c3gelb #frikadellendiplom und auf c3gelb.de.

Du hast schon eine Belehrung nach §43 IfSG oder ein altes Gesundheitszeugnis, in Berlin die „rote Karte“ oder in Schleswig-Holstein den „GELBen Zettel“? Komm zur Auffrischung (=Arbeitgeberteil) vorbei!
*„Frikadellendiplom“ ist nur unser Chaosbegriff für diese Bescheinigung. In dieser normalen Welt da draußen mag man den Begriff nicht immer auf Anhieb verstehen.
Jetzt in ausführlich:"""
full_description = "Küchenengel oder Villageküche? Macht euer Frikadellendiplom! 7. August 2019 DE Was brauche ich für ein Frikadellendiplom?* Als erstes brauchst du eine Hygienebelehrung nach„§43 Infektionsschutzgesetz vom Gesundheitsamt (in einigen Städten dürfen auch einige bestimmte Ärzte diese Belehrung vornehmen). Für dich zuständig ist das Gesundheitsamt an deinem Erstwohnsitz oder an deinem Arbeitsplatz (Erfa-Kreis). Einige sehen das lockerer, andere nicht. Bei manchen muss man einen Termin ausmachen, bei anderen kann man einfach vorbei kommen. Manche zeigen dann einfach ein Video, bei anderen ist es ein Vortrag. Suche zum Beispiel nach „deineSTADT Hygiene Belehrung“. Auf dem Camp (und den Kongressen) gibt es den zweiten Teil, offiziell „Arbeitgeberteil“, den der CCC als Verein veranstalten darf. Infos dazu unter @c3gelb #frikadellendiplom und auf c3gelb.de. Du hast schon eine Belehrung nach §43 IfSG oder ein altes Gesundheitszeugnis, in Berlin die „rote Karte“ oder in Schleswig-Holstein den „GELBen Zettel“? Komm zur Auffrischung (=Arbeitgeberteil) vorbei! *„Frikadellendiplom“ ist nur unser Chaosbegriff für diese Bescheinigung. In dieser normalen Welt da draußen mag man den Begriff nicht immer auf Anhieb verstehen. Jetzt in ausführlich: Für Küchen, in denen in großem Stil Lebensmittel für Gruppen zubereitet werden, soll jede*r das Wissen bekommen, verarbeitet und gespeichert haben, um keine Viren und Bugs ins Essen zu schmuggeln. Der Erhalt dieses Wissens soll auf einem analogen Medium bescheinigt werden (Blockchain dauert noch *hust*). Unter Gruppenküchen fällt nicht nur die Engelküche, sondern auch größere Villageküchen, Verkaufsstände und die Abwaschstationen. Dieses Jahr gibt es einige Geschirrspüler, und auch dort werden ja Dinge fürs Essen in die Hand genommen. Daher bitten wir auch Engel, die uns an den „Spülen as a Service“-Gastro-Geschirrspülern unterstützen wollen, sich eine Hygienebelehrung vom Gesundheitsamt zu besorgen. Brauche ich einen solchen Schein nur für das Camp und die Kongresse, oder bringt der mir sonst auch was? Wenn ihr im Erfa oder im Job jetzt oder später mit Lebensmitteln zu tun habt, könnt ihr den Schein auch dort brauchen. Nicht für die eigene Pizza im Ofen, sondern wenn ihr Essen für mehrere Menschen zubereitet oder verkauft. Im Rahmen einer solchen Schulung klärt dich das Gesundheitsamt über Arbeitnehmerrechte und -pflichten, sowie Infektionen und Krankheiten rund um Lebensmittel auf. Der „Arbeitgeber“ (hier der Club) sorgt dafür, dass du über hygienisch einwandfreies Arbeiten in der Küche unterwiesen wurdest. Wie läuft das ab? In zwei Teilen: Wenn ihr den Schein haben oder diesen auffrischen wollt, könnt ihr das beim CCCamp2019 machen, aber ihr müsst dafür vorher bei eurem örtlichen Gesundheitsamt gewesen sein Die Belehrung zum Umgang mit Lebensmitteln muss beim Gesundheitsamt oder bei einem dazu berufenen Arzt erfolgen, das dürfen wir nicht vor Ort machen. Die Kosten liegen bei ca 20-40 €. Für Vereine ist es mitunter kostenfrei. Dort wird ein Film gezeigt oder ein Vortrag gehalten und anschließend eine Bescheinigung oder ein Bescheinigungsheft („Unterschriftenheft“) ausgestellt. Fragt nach diesem Heft – es erleichtert euch und uns später das Eintragen. Wer sich die Kosten der Belehrung nicht leisten kann, möge sich bei uns melden, wir finden eine Lösung. Leider ist dies nur einer von zwei notwendigen Teilen. Gültig wird es erst, wenn innerhalb von 3 Monaten danach eine Erstunterweisung durch den „Arbeitgeber“ (hier der Erfa oder der CCC) erfolgt. Wir bieten nach Bedarf mindestens eine Unterweisung während des CCCamp2019 an. Konkrete Infos findet ihr auf c3gelb.de und auf Twitter bei @c3gelb unter #Frikadellendiplom. Auffrischung Die Kombination beider Bescheinigungen ist zwei Jahre lang „aktiv“ und wird danach „passiv“. Egal wie alt – mit jeder Auffrischung beginnen die zwei „aktiven“ Jahre von vorn. FAQ Ich habe schon eine Belehrung nach §43 IfSchG vom Gesundheitsamt, reicht das? Ja, wenn die zum Zeitpunkt der Arbeitgeber-Erstunterweisung neuer ist als 3 Monate, also nach dem (TerminBeginnXC3 minus 3 Monate). Ich habe nicht nur eine Belehrung nach Infektionsschutzgesetz, sondern auch nach Lebensmittelhygieneverordnung (LMHV), was soll ich machen? Komm einfach mit vorbei, wenn genug Leute für eine Belehrung nach LMHV dabei sind, machen wir die im Anschluss. Kann ich den „Arbeitgeberteil“ vorher online machen? Der externe Anbieter Metro bietet eine Online-Schulung an. Bitte beachte: das bezieht sich nur auf den sogenannten „Arbeitgeberteil“, den wir sonst während des Camps machen würden. Die Erstbelehrung muss trotzdem beim Gesundheitsamt erfolgen. Weitere Informationen gesetze-im-internet.de/ifsg/__43.html infektionsschutzgesetz.de rki.de/DE/Content/Infekt/IfSG/ifsg_node.html CCCamp19 Chaos Communication Camp"
