["https://events.ccc.de/2018/12/04/das-vierte-turchen-der-35c3-memory-lane-mysteriose-quanten"]
title = "Das vierte Türchen der #35C3 Memory Lane: Mysteriöse Quanten - CCC Event Blog"
description = """
Das vierte Türchen.
„Die Quanten sind doch eine hoffnungslose Schweinerei!“, soll Niels Bohr einst an Albert Einstein geschrieben haben. Schweinerei hin oder her, die Quantenphysik ist auf jeden Fall ein faszinierendes Themenfeld, weil sie unser Wissen darüber, wie die Welt funktioniert, grundlegend in Frage stellt. Quantencomputer und Quantenkryptographie sind auf dem Chaos Communication Congress immer wieder gern gesehene Anlässe für eine glorreiche Gehirnverdrehung. Wer sich jemals damit auseinandersetzen wollte oder musste, wird wissen, wie wunderbar erleichternd es ist, wenn ein fähiger Erklärbär dabei hilft.
Einen gut verständlichen Einstieg ins Thema gab Stephanie Wehner auf dem 22C3. In Quantum Entanglement lässt sie Alice und Bob auf unterschiedliche Planeten fliegen, über Quanten miteinander kommunizieren und macht so Grundprinzipien der Quantenmechanik verständlich."""
full_description = "Das vierte Türchen der #35C3 Memory Lane: Mysteriöse Quanten 4. Dezember 2018 DE Das vierte Türchen. „Die Quanten sind doch eine hoffnungslose Schweinerei!“, soll Niels Bohr einst an Albert Einstein geschrieben haben. Schweinerei hin oder her, die Quantenphysik ist auf jeden Fall ein faszinierendes Themenfeld, weil sie unser Wissen darüber, wie die Welt funktioniert, grundlegend in Frage stellt. Quantencomputer und Quantenkryptographie sind auf dem Chaos Communication Congress immer wieder gern gesehene Anlässe für eine glorreiche Gehirnverdrehung. Wer sich jemals damit auseinandersetzen wollte oder musste, wird wissen, wie wunderbar erleichternd es ist, wenn ein fähiger Erklärbär dabei hilft. Einen gut verständlichen Einstieg ins Thema gab Stephanie Wehner auf dem 22C3. In Quantum Entanglement lässt sie Alice und Bob auf unterschiedliche Planeten fliegen, über Quanten miteinander kommunizieren und macht so Grundprinzipien der Quantenmechanik verständlich. Stephanie Wehner beim #22C3. Vorträge wie dieser sind eine tolle Wissensgrundlage für Congress-Neulinge und alle, die ihren Horizont erweitern möchten. Deshalb wird es auf dem 35C3 erstmals einen Foundations-Track geben, der ausschließlich aus Einsteigervorträgen besteht. Wir sind sehr gespannt! Ihr wollt das Wissen rund um die mysteriösen Quanten vertiefen? Dann hat media.ccc.de genau das Richtige! 35c3-kalender CCC Chaos Communication Congress Congress deutsch Event Events Lectures recording Speakers Talks Veranstaltung"
year_published = 2018
year_updated = 2018
