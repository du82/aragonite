["https://events.ccc.de/category/27c3"]
title = "27C3: We come in peace (2010) - CCC Event Blog"
full_description = "We Came in Peace: Event Recordings Available! 2 January 2011 EN It’s only been a few days since the close of the 27c3, but much of the conference is ready to download. Credit goes in no small part to the FEM, who did a really tremendous job during the conference and continue their hard work getting Official Releases of the talks ready to go. If you enjoyed the streams and the recordings of the talks, consider [supporting their efforts][5] to purchase updated equipment to improve the image quality and transmission path for future events. Did you really love certain events? Weren’t so excited about others? Let us know! You can leave feedback via the … Read more … Crypto Talk at 27C3: New Key Recovery Attacks on RC4/WEP, Day 4, 17:15, Saal 2 30 December 2010 EN The RC4 Stream Cipher could be the most common stream cipher used on the Internet. RC4 is the only Stream Cipher which is standardized for the SSL/TLS protocol, it is also used for WEP and WPA protected wireless networks. Initially, RC4 was designed to be a closed source commercial product, with the core algorithm kept secret. In 1994, the source code for RC4 was posted on the internet and the algorithm could be analyzed. The first attack on RC4 was published by Fluhrer, Mantin, and Shamir in 2001. The attack is very effective, but can only be used against certain keys starting with a special … Read more … Hackcenter project: Django 29 December 2010 EN Django is a high-level Python Web Framework that encourages Rapid Development and clean, pragmatic design. It is known for it’s extensive documentation. Django is Open Source Software (BSD license). As a Full Stack Framework it gives you the option to define your data models as Python classes and access them via a powerful ORM. The automatic admin interface makes it easy to … Read more … Hackcenter project: i3 29 December 2010 EN i3 is a tiling window manager, that means it configures your windows to use the whole available screen space. It was written from scratch with focus on clear and well-documented code. Additionally, a lot of documentation like the User’s Guide or a Hacking Howto is available. i3 is fast, easy to use and configure, features full unicode and decent multi-monitor support. Two of the core developers are traditionally attending the Chaos Communication Congress and are in the hackcenter (the 4-person table in the middle of the hackcenter, watch out for the i3 poster), ready to answer your questions, … Read more …"
