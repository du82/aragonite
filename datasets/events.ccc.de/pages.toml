["https://events.ccc.de/2024/12/13/38c3-self-organized-sessions"]
title = "38C3: Self-organized Sessions - CCC Event Blog"
description = """
TL;DR

Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen.
Self-organized Sessions können bereits jetzt angelegt werden, aber die Räume dafür sind erst ab dem 17. Dezember buchbar.
Eine Übersicht aller Self-organized Sessions findet ihr im Hub.
Für die Anmeldung einer Self-organized Session verwendet ihr das Backoffice des Hub."""
full_description = "38C3: Self-organized Sessions 16. Dezember 2024 DE EN TL;DR Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen. Self-organized Sessions können bereits jetzt angelegt werden, aber die Räume dafür sind erst ab dem 17. Dezember buchbar. Eine Übersicht aller Self-organized Sessions findet ihr im Hub. Für die Anmeldung einer Self-organized Session verwendet ihr das Backoffice des Hub. Selbstorganisation ist das magische Wort Ihr wollt ein Treffen einer Gruppe oder zu einem bestimmten Thema organisieren? Einen Workshop veranstalten? Einen Wettbewerb oder ein Spiel veranstalten? Habt etwas außerhalb des Gebäudes organisiert? Möchtet einen Kurzvortrag halten oder einen Film vorführen? Eine Folgediskussion zu einem der großen Talks starten? Oder irgendetwas anderes organisieren, das einen Platz auf dem Congress braucht? Anstatt all diese Dinge einzeln aufzuzählen oder Kategorien dafür anzulegen, haben wir vor einigen Jahren den Begriff der Self-organized Session eingeführt. Self-organized Sessions werden, wie der Name schon sagt, von euch selbst organisiert. Um eine Session anzulegen, klickt auf das Plus rechts oben auf der Startseite des Hub und dann auf „Self-organized Session“. Ihr werdet ins Hub Backoffice (aka Maschinenraum) weitergeleitet. Falls ihr noch keinen Account im Hub habt, solltet ihr vorher einen anlegen. Wann die Session stattfindet, wie lange sie geht, was ihr dort tut und wo sie stattfindet, ist dabei euch überlassen. Ihr könnt euch zum Beispiel an einer Bar oder in einem Assembly (bitte vorher mit dem entsprechenden Assembly abklären!) treffen. Falls ihr einen Raum für etwas mehr Menschen braucht, könnt ihr ab 17. Dezember auch einen der unten aufgeführten Räume dafür buchen. Beim Speichern der Session wird geprüft, ob der gewählte Raum zum gewählten Zeitpunkt noch verfügbar ist und andernfalls eine Fehlermeldung angezeigt. Nachdem ihr diese Informationen ausgefüllt und die Session gespeichert habt, erscheint sie in der Übersicht, sodass andere Teilnehmende sie finden können. Sofern ihr einen der vorgegebenen Räume ausgewählt habt, taucht sie später auch im Fahrplan auf. Folgende Räume stehen für Self-organized Sessions zur Verfügung: Saal E in Reihenbestuhlung mit ca. 250 Sitzplätzen, Saal D in Bankettbestuhlung (große, runde Tische z.B. für Workshops) mit voraussichtlich um die 120 Sitzplätzen und Saal 6 in Reihenbestuhlung mit 60 Sitzplätzen. Diese Räume sind ab dem oben genannten Zeitpunkt über den Hub buchbar. Sie sind jeweils mit einem Projektor/Bildschirm und Lautsprecheranlage ausgestattet, die Sessions werden aber nicht durch das VOC übertragen/aufgezeichnet. Solltest du noch Fragen rund um Self-organized Sessions / Workshops haben, kontaktiere am besten unseren „Off Stages & Space Session Orchestration (OSSSO)“-Helpdesk z.B. via 38c3-ossso@cccv.de oder während des Congress auch direkt neben dem Infodesk. Weitere selbstorganisierte Räume findet ihr auf der Übersichtsseite im Hub. Beachtet bitte, dass das ganze nach dem „first come first served“-Prinzip abläuft. Einzelne Slots werden ggf. bereits vor der öffentlichen Buchungsphase durch Treffen von Orga Teams oder z.B. dem CCC-Regiotreffen belegt sein. Bild von Yves Sorge, CC BY-SA 2.0 Chaos Communication Congress hub self-organized sessions"
year_published = 2024
year_updated = 2024
clearnet = "https://events.ccc.de/2024/12/13/38c3-self-organized-sessions"
