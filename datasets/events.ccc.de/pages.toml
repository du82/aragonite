["https://events.ccc.de/2024/12/03/38c3-a11y-diff"]
title = "Barrierefreiheit – Neues auf dem 38C3 - CCC Event Blog"
description = """
Wie barrierefrei ist der Congress dieses Jahr? Wir haben beim letzten Mal viel gelernt. Es gibt einige Verbesserungen.
Was ist neu oder anders dieses Jahr? Ein Problem mit Barrierefreiheit im Congress Center wurde gelöst: Alle Hörschleifen sollten funktionieren. Beim Helpdesk Neben dem Infodesk kannst du Fragen zu Barrierefreiheit stellen. Am Helpdesk gibt es auch Hidden Disability Badges. Es wird Braille-Schilder geben. Rollstuhl fahren auf dem 37C3 war nervig. Hier eine Liste mit gelösten und noch bestehenden Problemen. Der QuietQube liegt nun eine Tür weiter links. Navigations-Links wird es bald geben. Der Ruheraum ist wieder versteckt. Du kannst auf dem Event nach dem Ort fragen."""
full_description = "Barrierefreiheit – Neues auf dem 38C3 3. Dezember 2024 DE EN Wie barrierefrei ist der Congress dieses Jahr? Wir haben beim letzten Mal viel gelernt. Es gibt einige Verbesserungen. Was ist neu oder anders dieses Jahr? Ein Problem mit Barrierefreiheit im Congress Center wurde gelöst: Alle Hörschleifen sollten funktionieren. Beim Helpdesk Neben dem Infodesk kannst du Fragen zu Barrierefreiheit stellen. Am Helpdesk gibt es auch Hidden Disability Badges. Es wird Braille-Schilder geben. Rollstuhl fahren auf dem 37C3 war nervig. Hier eine Liste mit gelösten und noch bestehenden Problemen. Der QuietQube liegt nun eine Tür weiter links. Navigations-Links wird es bald geben. Der Ruheraum ist wieder versteckt. Du kannst auf dem Event nach dem Ort fragen. Diesmal gibt es sicher einen Meltdown-Raum. Orientierung für Blinde Sich auf dem 37C3 zurecht finden war sehr schwer. Es wird dieses Mal viel besser: Taktile Wege werden verändert, wo sie nicht funktioniert hatten. Dafür nutzen wir auch ein mobiles Leitsystem. Hier wird es noch mehr Details geben. Es gibt bessere Schilder. Auch taktile Schilder in Braille. Infos werden verlässlicher sein. Alle können mithelfen: haltet taktile Wege frei. Räumt Sachen weg, die drauf stehen. Was ist wie gewohnt? Du möchtest eine Assistenz mitnehmen: Zeige deinen Behindertenausweis, Behindertenpass oder ähnliches am Eingang. Hast du keinen solchen Ausweis, melde dich bei 38c3-tickets@cccv.de. Brauchst du mehrere Begleitungen, melde dich da auch bei 38c3-tickets@cccv.de. Die Säle haben Behindertenplätze. Kontakt und Fragen: Vor dem Event Via E-Mail: 38c3-accessibility@cccv.de Im Matrix-Chat: #accessibility:events.ccc.de Auf dem Event 📞 A11Y über das Eventphone-DECT/SIP-Telefonnetz anrufen. Der Infodesk wird schneller auf Mails antworten: mailto:38c3-infodesk@cccv.de Weiterführende Links help.ccc.de Die 38C3-Infoseite über Barrierefreiheit Aktualisierungen Weil Infos hinzu kommen und Verbesserungen entstehen, wird dieser Artikel verändert. 04/12 Warnung wegen Veränderungen am Blindenleitsystem 10/12: Info zu Aktualisierungen hinzugefügt Kontakt-Addressen aktualisiert Verbesserungen bei Blinden-Navigation beschrieben, Warnung entfernt Chaos Communication Congress accessibility Barrierefreiheit"
