["https://events.ccc.de/category/31c3"]
title = "31C3: A New Dawn (2014) - CCC Event Blog"
full_description = "Missing 6. Januar 2015 DE Bitte weitersagen. Liebe Kunstliebhaber, ein Künstler hat in der Anti-Terror-Lounge beim 31C3 eines seiner Bilder stehenlassen, was dann leider fälschlicherweise beim Abbau an zwei Helfer verschenkt wurde. Er hätte das aber sehr gern zurück. Wir bitten die kunstbeflissenen Helfer, sich bei uns zu melden unter epass(at)ccc.de (Paßnummer optional). Angaben zum Kunstwerk: 76 cm x 96 cm, Lack & Acryl (siehe Abbildung) Der Künstler dankt im Voraus! The YouTube and stream dump problem 3 January 2015 EN In the past the CCC has decided to not run its own YouTube account as we didn’t want to advertise this service. Despite the growing success and continual improvements to media.ccc.de as a streaming platform, people still want to watch CCC talks on YouTube. Unfortunately, many YouTube accounts have shown up which claim to be official CCC accounts. We ignored this for a long time as it was a nice service for the viewer and hey – it’s CC-BY content. However there are some problems with these accounts which we will address later. To understand the problem we need to discuss another topic, stream … Read more … Einmal Agent sein! 28. Dezember 2014 DE EN Für das echte 007 Feeling müsst ihr nicht auf die verzweifelten Stellenanzeigen des BND reagieren. An Tag 3 habt ihr bei der “Schwarzbeutelherausforderung” (20:30, Halle A) die Chance, im Rahmen unserer “Know Your Enemy” Initiative gefahrlos in dieses sympathische Berufsbild hineinzuschnuppern. Als Team von bis zu drei Personen bekommt ihr eine schwarze Tasche mit aller notwendigen Ausrüstung. Eure Mission, solltet ihr sie akzeptieren: Öffnet die Tür zum Zimmer der Zielperson ohne den Alarm auszulösen. Erreicht den Rechner, eher der Bildschirmschoner anspringt. Stehlt den gpg secret key, … Weiterlesen … Busparkplätze unter dem CCH 27. Dezember 2014 DE EN Wichtiger Hinweis für alle, die aktuell auf den Busparkplätzen unter dem CCH parken oder erwägen dies noch zu tun: Nach den Erfahrungen aus dem letzten Jahr besteht die nicht unerhebliche Gefahr, dass dort abgeschleppt wird, wenn irgendein Bus diese in Anspruch nehmen will. Letztes Jahr passierte dies zu dem Zeitpunkt, wo die Hacker-Tours-Busse hier aufgeschlagen sind. Da dies sehr ärgerlich ist und auch nicht unerheblich teuer, wird empfohlen, die dort abgestellten Fahrzeuge zeitnah zu entfernen."
year_published = 2015
clearnet = "https://events.ccc.de/category/31c3"
