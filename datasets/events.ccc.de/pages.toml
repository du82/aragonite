["https://events.ccc.de/about"]
title = "Über das CCC-Eventblog - CCC Event Blog"
description = """
Dies ist das CCC-Eventblog. Es wird von Mitgliedern und Freunden des Chaos Computer Club gepflegt.
Das Blog widmet sich Informationen zu Konferenzen und Veranstaltungen aus dem Umfeld des CCC. Als unsere wichtigste Veranstaltung steht in der Regel der jährliche Chaos Communication Congress im Mittelpunkt, wir bieten aber auch Ankündigungen und Hintergrundinformationen zu anderen CCC-Veranstaltungen – regional oder international. Wir freuen uns über Beiträge wie die Vorstellung von Gruppen und Crews sowie Ankündigungen interessanter Aktivitäten während eines bevorstehenden Kongresses oder Camps oder Ankündigungen, CfPs, … für andere Chaos-Events. Dies ist nicht auf den CCC oder Erfa/Chaostreff-Veranstaltungen beschränkt. Kontaktiert uns gerne, um euren eigenen Beitrag zu veröffentlichen!"""
full_description = "Über das CCC-Eventblog DE FR EN Dies ist das CCC-Eventblog. Es wird von Mitgliedern und Freunden des Chaos Computer Club gepflegt. Das Blog widmet sich Informationen zu Konferenzen und Veranstaltungen aus dem Umfeld des CCC. Als unsere wichtigste Veranstaltung steht in der Regel der jährliche Chaos Communication Congress im Mittelpunkt, wir bieten aber auch Ankündigungen und Hintergrundinformationen zu anderen CCC-Veranstaltungen – regional oder international. Wir freuen uns über Beiträge wie die Vorstellung von Gruppen und Crews sowie Ankündigungen interessanter Aktivitäten während eines bevorstehenden Kongresses oder Camps oder Ankündigungen, CfPs, … für andere Chaos-Events. Dies ist nicht auf den CCC oder Erfa/Chaostreff-Veranstaltungen beschränkt. Kontaktiert uns gerne, um euren eigenen Beitrag zu veröffentlichen! Für den Congress und das Camp gibt es zusätzlich zum Blog in der Regel ein Wiki für die jeweilige Veranstaltung, das als Einstiegspunkt und primäre Informationsquelle für die Zusammenarbeit sowohl mit uns als auch mit den Teilnehmer*innen und Besucher*innen der Konferenzen dient. Kontakt Bei Fragen oder Anmerkungen zu diesem Blog erreicht ihr uns unter blog@events.ccc.de. Kontaktiert uns gerne, falls ihr eure eigene Veranstaltung hier veröffentlichen möchten. Richtlinien und eine Vorlage für euren Beitrag findet ihr unter Mitwirken."
