["https://events.ccc.de/2017/11/26/a-galactic-congress-welcomes-all-lifeforms"]
title = "A galactic Congress welcomes all lifeforms - CCC Event Blog"
description = """
Wer einmal beim Congress war, weiß: Es gibt eine Welt da draußen und eine drinnen. Wir versuchen, auch mit wachsender Größe der Veranstaltung und immer mehr teilnehmenden Kindern und Jugendlichen eine Atmosphäre zu schaffen, die geprägt ist von Toleranz, Neugier, Spaß, Gesprächsbereitschaft, Freundlichkeit und einem besonderen Miteinander. Der Congress ist schon immer mehr Mitmach- als Konsumenten-Veranstaltung. Ein Event von Freiwilligen für Freiwillige, der nur so funktioniert, weil die allermeisten Teilnehmenden genau das auch wollen. Be excellent to each other! ist für uns deshalb nicht nur ein Spruch, sondern wesentlicher Kerngedanke des Events.
Seit 34 Jahren versuchen wir, den Congress in diesem Sinne zu organisieren und dabei aus Fehlern zu lernen."""
full_description = "A galactic Congress welcomes all lifeforms 26. November 2017 DE EN Wer einmal beim Congress war, weiß: Es gibt eine Welt da draußen und eine drinnen. Wir versuchen, auch mit wachsender Größe der Veranstaltung und immer mehr teilnehmenden Kindern und Jugendlichen eine Atmosphäre zu schaffen, die geprägt ist von Toleranz, Neugier, Spaß, Gesprächsbereitschaft, Freundlichkeit und einem besonderen Miteinander. Der Congress ist schon immer mehr Mitmach- als Konsumenten-Veranstaltung. Ein Event von Freiwilligen für Freiwillige, der nur so funktioniert, weil die allermeisten Teilnehmenden genau das auch wollen. Be excellent to each other! ist für uns deshalb nicht nur ein Spruch, sondern wesentlicher Kerngedanke des Events. Seit 34 Jahren versuchen wir, den Congress in diesem Sinne zu organisieren und dabei aus Fehlern zu lernen. Es sind neue Initiativen und Teams – wie immer von Freiwilligen – entstanden und jedes Jahr viele Details umgestaltet worden. Wir sind weiterhin offen für Vorschläge zur Verbesserung. Kontaktiere gern das Orga-Team, wenn Du dazu Ideen hast. Der Chaos Computer Club ist nach seiner Satzung und nach dem Willen der Mitglieder eine galaktische Gemeinschaft für alle Lebensformen. Wir wollen keine Diskriminierung, keine Intoleranz und damit auch keine Rassisten oder Sexisten. Wer sich diesen Prinzipien nicht verpflichtet fühlt, hat bei uns nichts zu suchen. Dies kann jeder auch schriftlich nachlesen. Wir bauen unseren kommerzfreien, offenen, und ja!, altruistischen Denkraum zum Mitmachen und zum Forschen an den Abgründen der Technik nicht dafür, um ihn mit rassistischen oder gewaltgeneigten Hohlbirnen zu teilen. Trotzdem können bei einer so großen Veranstaltung nicht alle Probleme vermieden werden. Dafür stehen drei Teams rund um die Uhr zur Verfügung, jederzeit erreichbar per Telefon und natürlich persönlich vor Ort. Insbesondere für Erkrankungen und persönliche Krisen haben wir dafür seit Jahren auch ein großes Team professioneller Helfer. Auch für den Umgang mit Teilnehmenden, die sich an unsere Grundgedanken und ein kooperatives und freundliches Miteinander nicht halten, stehen Teams bereit. Genau wie bei der Mitarbeit bei Aufbau, Begleitung und Abbau des Congress setzen wir aber zugleich auf all die Freiwilligen, um Sicherheit, Gewaltlosigkeit und eine rundum entspannte Atmosphäre zu schaffen. Die Teams und deren Aufgaben wollen wir in den kommenden Wochen hier im Blog genauer vorstellen: Das Awareness-Team ist Anlaufpunkt, um Erfahrungen und Erlebnisse zu verarbeiten, Konflikte zu lösen und eine sichere und angenehme Umgebung für unterrepräsentierte Gruppen zu schaffen. Das Team Safety & Security widmet sich der Prävention von Konflikten und der Verhinderung von Eskalationen. Das Team kümmert sich um Menschen, die sich daneben benehmen und um andere Gefahren. In den meisten Fällen genügt ein nachdrücklicher Hinweis auf unsere Prinzipien. Falls nicht, kommt das Hausrecht zur Anwendung. Das CERT (Chaos Emergency Response Team) besteht aus ausgebildeten Ärzten, Krankenhelfern, Feuerwehrleuten und Kriseninterventions-Spezialisten. Sie kümmern sich um alle Notfälle und Probleme, die eine professionelle Betreuung erfordern. Erkrankungen und Verletzungen aller Art sind beim CERT genauso gut aufgehoben wie die Durchsetzung von Brandschutz- und Fluchtweg-Regeln. Pictures: miguel, CC BY-NC 2.0 CERT Chaos Communication Congress deutsch"
year_published = 2017
year_updated = 2017
clearnet = "https://events.ccc.de/2017/11/26/a-galactic-congress-welcomes-all-lifeforms"
