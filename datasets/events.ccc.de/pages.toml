["https://events.ccc.de/tag/cfp"]
title = "cfp - CCC Event Blog"
full_description = "Easterhegg 2025: Call for Participation 16. Januar 2025 DE EN tl;dr Easterhegg 2025: CfP ist draußen Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an. Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der … Weiterlesen … 38C3 Chaos Computer Music Club 18. November 2024 DE EN Für den 38C3 Chaos Computer Music Club und den Chill Floor suchen wir nach musikalischen Performances von Musik-Nerds für Musik-Nerds. Selbstgebaute Instrumente, kreativ eingesetzte Technologien, um Musik zu schaffen, DJs, die zeitgenössische Musik spielen und weit weg vom Mainstream nach den Perlen der Genres tief tauchen oder Bands mit konstruktiver politischer Message. Das sind nur einige Beispiele für Auftritte, die wir gerne unserem Publikum präsentieren möchten. Von A wie Ambient bis Z wie Zydeco. Wir bitten zu beachten, dass der 38C3 keine Musikveranstaltung ist und wir keine … Weiterlesen … 38C3-Community-Bühnen – Call for Participation 27. Oktober 2024 DE EN Für die drei großen Bühnen beim 38C3 ist der Call for Participation gerade vorbei. Es wurden viele großartige Vorträge eingereicht und das Content-Team macht sich bereits an die Sichtung der Einreichungen. Wie jedes Jahr stand wieder die Frage im Raum, wie wir die anderen beiden großen Bühnen bespielen. Wir haben eine Lösung gefunden: Habitate kuratieren gemeinsam ein Programm. In kürzester Zeit fand sich ein Team Freiwilliger, das sich Tracks überlegt hat, in denen es eigene Akzente und Schwerpunkte setzen wird. Das Community-Content-Team freut sich auf Eure Einreichungen – den gesamten Call … Weiterlesen …"
