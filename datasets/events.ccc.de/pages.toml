["https://events.ccc.de/congress/2024/infos/quietqube-and-c3auti.html"]
title = "QuietQube and c3auti - 38th Chaos Communication Congress Infos"
full_description = "QuietQube and c3auti This page offers detailed explanations of things organized by the c3auti crew for all creatures that need some mutual support or just some peace and quiet. German below – Deutsch siehe unten QuietQube All creatures that enjoy quiet socializing are welcome here. We have tables and seating meant for interacting quietly, and places for co-existing without interacting. You can also find support and communication aids at our Helpdesk. To help all be excellent to each other, we ask you to respect the our Code of Conduct: Code of Conduct Quiet Place is a place for all creatures, but made by autistic people and with their needs in mind. So please remember: This is always okay: Feel free to stim! (while being mindful of others in need of quiet) Feel free to be be nonverbal and even overwhelmed. Feel free to ask for help … when there is an issue because of your disability. when you need somebody to speak for you. when you need somebody to speak up for you. Feel free to set boundaries. Feel free to participate in conversations, feel free to encourage others to do the same, and feel free to ask that someone is given a turn. Feel free to stay here if you like, no matter whether you are autistic or not. Feel free to engage in mutually enthusiastic infodumping. This is what we ask of you: Do seek consent before hugging and touching others or seeking their closeness. Do be mindful of others when discussing heavy topics and speaking loudly. Do allow others time to process what was said. Do remember: things said here may not be meant to be as harsh as they seem and will often be intended or taken quite literally. Do respect boundaries. Do consider a misunderstanding before assuming malice in case of conflict. These are our boundaries: Do not think your diagnosis is an excuse for toxic behavior. Do not aggressively talk over others (This can mean “mansplaining”, but also infodumping without mutual enthusiasm) Do not question others’ need for assistance. Do not force support onto others. Do not assume everyone is willing or able to chat with you. This is expanding upon the general principles of our event and community. Silent Room Unlike QuietQube, which is also meant for socializing, Silent Room will be a place just for resting. For operational reasons, the location of this room will only be given to people that need to know it. You can unlock the Location in your c3nav at QuietQube Helpdesk, Infodesk or Awareness. The QuietQube Helpdesk or 📞 2884 can also help you memorize a route. In acute cases, you may ask 📞 1199, QuietQube Helpdesk and CERT or Awareness-Runners to get you there. Meltdown Room There is a safe room for meltdowns. It can be blacked-out. If you need the meltdown room or if you feel you are going into meltdown, please call 📞 1199 – c3auti emergency – via Eventphone. You can get a card instructing another person to call that number for you at QuietQube Helpdesk. You may also ask an auti angel, CERT or awareness runner for help. Contact us via Mail support@c3auti.de on the event: for general questions, call 📞 2884 in acute cases, call 📞 1199 Mastodon: @c3auti@chaos.social Become part of the Community in the auti matrix channel QuietQube und c3auti Hier eine ausführlicher Erklärung der Angebote von dem c3auti Team an alle Kreaturen, die autistische Selbsthilfe oder einfach etwas Ruhe brauchen. English above der QuietQube Alle Wesen, die in einer ruhigen Umgebung sozial sein wollen, sind hier willkommen. Es gibt Tische zum ruhigen interagieren und Orte fürs schweigende Co-Existieren. Support und Kommunikationshilfen bietet der Helpdesk. Damit wir exzellent miteinander umgehen können, gibt es ein paar Spielregeln. Spielregeln Der Quiet Place ist ein Ort für alle, aber gemacht mit autistischen Menschen und deren Bedürfnissen im Sinn. Also bitte denk dran: Du darfst; das ist immer okay: Du darfst stimmen (unter Rücksichtnahme auf Wesen mit anderem Ruhebedürfnis). Du darfst überfordert und nonverbal sein. Du darfst um Hilfe bitten. wenn du behinderungsbedingt Probleme hast. wenn du jemanden brauchst, der deine Stimme spielt. wenn du jemanden brauchst, der sich für dich einsetzt. Du darfst Grenzen setzen. Du darfst hier mitreden, andere ermutigen sich einzubringen oder bitten jemanden zu Wort kommen zu lassen. Du darfst hier sein, wenn es dir hier gefällt, auch wenn du nicht autistisch bist. Du darfst bei gegenseitiger Freude daran Info-Dumpen. Du solltest; das sind unsere Erwartungen an dich: Du solltest andere um Erlaubnis bitten, bevor du sie umarmst, berührst oder ihre Nähe suchst. Du solltest auf andere Rücksicht nehmen, in deiner Lautstärke und bei den Themen, über die du sprichst. Du solltest anderen Zeit zum Verarbeiten und zum Verstehen lassen. Du solltest damit rechnen, dass Sachen hier wörtlicher verstanden oder gemeint werden, als üblich; und manchmal schroff wirken, ohne so gemeint zu sein. Du solltest respektieren, wenn dir Grenzen aufgezeigt werden. Du solltest versuchen, bei Konflikten zunächst von Missverständnissen und nicht von bösen Absichten auszugehen. Und bitte versuch dies nicht: Du darfst hier nicht erwarten, dass Diagnosen eine Entschuldigung für toxisches Verhalten sind. Du brauchst hier nicht auf andere einreden (dazu gehört „mansplaining“, aber auch Infodumping ohne gegenseitige Freude daran). Du darfst hier nicht anderen die Hilfsbedürfigkeit absprechen. Du brauchst hier nicht anderen „Support“ aufdrängen. Du darfst hier nicht davon ausgehen, dass alle Wesen mit dir reden wollen oder können. Dies ist eine Erweiterung der allgemeinen Grundsätze. Ruheraum Im Gegensatz zum QuietQube, der ein sozialer Ort ist, bietet der Ruheraum deutlich mehr Ruhe. Daher ist der genaue Ort auch nicht in öffentlichen Karten eingetragen. Wenn du den Ruheraum brauchen könntest, frag am Infodesk, am Helpdesk im QuietQube oder bei Awareness nach. Da kannst du den Raum in c3nav freischalten. Möchtest du den Weg üben, frage am Helpdesk nach oder rufe 📞 2884 an. Brauchst du den Raum akut, kannst du 📞 1199, den Helpdesk und eine CERT- oder Awarenessstreife bitten. Meltdown Room Es gibt einen Raum, in dem du einen Meltdown geschützt haben kannst. Der Raum kann abgedunkelt werden. Wenn du den Raum brauchst oder einen Meltdown kommen siehst, bitte rufe 📞 1199 – c3auti emergency – über Eventphone an. Du kannst auch Auti-Engel und CERT- oder Awareness-Streifen akut um Hilfe bitten. Am Helpdesk im QuietQube gibt es auch eine Kommunikationskarte, mit der du andere darum bitten kannst, c3auti anzurufen. Kontakt per Mail support@c3auti.de auf dem Event: bei allgemeinen Fragen, ruft 📞 2884 an. Nutzt 📞 1199 in akuten Fallen. Mastodon: @c3auti@chaos.social Werde Teil der Community: tritt dem Auti Matrix-Raum bei."
