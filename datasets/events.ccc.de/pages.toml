["https://events.ccc.de/en/2024/12/19/38c3-call-for-heralds"]
title = "38C3: Call for Heralds - CCC Event Blog"
description = """
TL;DR Once again this year, the Heralds will guide through the 38C3 programme. There will be a few changes though.
Would you like to be a part of the Heralds team? Send an email to info@heralde.org by 24 December with the following information:
Herald category (experienced Herald / mentor, Herald mentee, or community Herald) link to a recording of your moderation (if available) language skills (de/en/fr) favourite topics/tracks (e.g., Security, Hardware, Politics & Society, Art & Beauty) availability (day x, morning, afternoon, evening, night) The Heralds guide through the 38C3 stage programme. They introduce speakers, monitor the time, and moderate the Q&A sessions."""
full_description = "38C3: Call for Heralds 19 December 2024 EN DE TL;DR Once again this year, the Heralds will guide through the 38C3 programme. There will be a few changes though. Would you like to be a part of the Heralds team? Send an email to info@heralde.org by 24 December with the following information: Herald category (experienced Herald / mentor, Herald mentee, or community Herald) link to a recording of your moderation (if available) language skills (de/en/fr) favourite topics/tracks (e.g., Security, Hardware, Politics & Society, Art & Beauty) availability (day x, morning, afternoon, evening, night) The Heralds guide through the 38C3 stage programme. They introduce speakers, monitor the time, and moderate the Q&A sessions. You must attend the introductory meeting on day 0 to become a Herald. Location and time will be announced soon. There are three types of Heralds: experienced Heralds / mentors This is the right place for you if you already have experience moderating on larger stages (audience > 500 people). Herald mentees Have you gained first moderation experience on smaller stages and want to take it to the big stage? Then the mentee shifts are just right for you. In a mentee shift, you will be on the main track with an experienced member of the Herald team. If you and your mentor feel that you are ready to present your first talk in the main track, you will be given the opportunity. If everything falls apart, your mentor will be there to take over. community Heralds The community stages have their very own great programme which deserves just as much attention and good heralds as the main track. If you like the small stage more or you actually helped create the programme, this is the right place. The community stages are also an opportunity to see if the big stage might be right for you next year. Would you like to join the Herald team in one of these roles? Send an email to info@heralde.org by 24 December with the following information: Herald category (experienced Herald / mentor, Herald mentee, or community Herald) link to a recording of your moderation (if available) language skills (de/en/fr) favourite topics/tracks (e.g., Security, Hardware, Politics & Society, Art & Beauty) availability (day x, morning, afternoon, evening, night)"
