title = "Der Chaos Communication Congress - CCC Event Blog"
description = """
Der Chaos Computer Club veranstaltet jährlich zwischen Weihnachten und Neujahr den Chaos Communication Congress. Ursprünglich in Hamburg beheimatet, traf man sich über viele Jahre in Berlin, dann wieder in Hamburg und zuletzt in Leipzig.
Im Laufe der Jahre hat sich der Congress zu einer europaweit renommierten Veranstaltung mit über 17000 Besuchern pro Jahr entwickelt, an dem auch immer mehr internationale Gäste teilnehmen.
2023 - Unlocked 2019 - Resource Exhaustion 2018 - Refreshing Memories 2017 - tuwat 2016 - Works For Me 2015 - Gated Communities 2014 - A New Dawn 2013 - 30C3 2012 - Not my department 2011 - Behind enemy lines 2010 - We come in peace 2009 - Here be dragons 2008 - Nothing to hide 2007 - Volldampf voraus!"""
