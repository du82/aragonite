["https://events.ccc.de/category/38c3"]
title = "38C3: Illegal Instructions (2024) - CCC Event Blog"
full_description = "38C3: Last (and Lost) Things 12. Januar 2025 DE EN Der 38C3 ist vorbei. Leider. Wir hoffen, ihr hattet eine gute Heimreise und seid gut wieder in der Realität angekommen. Viel zu kurz waren die vier Tage gelebter Utopie. So viel mehr hätte man noch erleben können, so viel mehr Dinge entdecken, so viel mehr Leute treffen, so viel mehr Vorträge sehen … An der Dauer können wir leider nicht viel ändern. An vielem anderem schon! Daher möchten wir euch mit diesem Blogpost zu Feedback aufrufen. Lasst uns wissen was euch gefallen hat, aber auch, was euch nicht gefallen hat. Wir freuen uns sowohl über Lob als auch über konstruktive … Weiterlesen … Weiterhin sicher fühlen und sein auf dem 38C3 26. Dezember 2024 DE EN Unser Chaos Communication Congress ist eine große, internationale Veranstaltung mit sehr vielen Teilnehmerinnen, darunter Tausende von freiwilligen Helferinnen. Daraus ergibt sich viel Potential, soziale Überforderung, gesundheitliche Notfälle oder bedrohliche Situationen zu erleben. Wir alle kennen das Gefühl, nach Orientierung und Anschluss zu suchen in der riesigen, überwältigenden Congress-Welt mit Tausenden großen und kleinen Projekten, mit Konzerten, Diskussionen, Vorträgen, voller Kunst und Kultur. Wir verstehen, dass es eine Herausforderung sein kann, diese Freiräume zu genießen, unter … Weiterlesen … 38C3: Congress Everywhere 24. Dezember 2024 DE EN Auch in diesem Jahr bieten wieder Hackspaces und andere Orte die Möglichkeit, gemeinsam Vorträge zu streamen, hacken, Party zu machen usw. Der Congress ist überall, wo er gelebt wird. Dabei gibt es auch die Möglichkeit, sich gegenseitig zu besuchen. Diese Congress-Everywhere-Orte sind uns bekannt: Ort Tag 1 Tag 2 Tag 3 Tag 4 Link zum Space Basel ab 13:00 ab 13:00 ab 13:00 ab 13:00 ccc-basel.ch Bielefeld ab 14:00 ab 14:00 ab 14:00 ab 14:00 space.bi Bochum – ab 18:00 – – das-labor.org Erfurt ab Mittag ab Mittag ab Mittag ab Mittag bytespeicher.org Erlangen ab 18:00 ab 18:00 ab … Weiterlesen …"
