["https://events.ccc.de/2025/02/28/tag-des-offenen-hackspace-2025"]
title = "Tag des offenen Hackspace 2025 - CCC Event Blog"
description = """
TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25
Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor allem könnt ihr erfahren, was hinter der Idee von Hackspaces und Hacken im Allgemeinen steckt."""
full_description = "Tag des offenen Hackspace 2025 28. Februar 2025 DE TL;DR: Tag des offenen Hackspace am 29. März – besuche einen Hackspace in deiner Nähe! Hackspaces sind Gemeinschaftsräume, die dem Spaß, der Kunst, dem Politischen und vor allem dem sozialen Austausch gewidmet sind. Um das mit den eigenen Sinnen zu erfahren, besuch doch am Samstag, dem 29. März einen Hackspace in deiner Nähe! Hier findest du eine Liste mit Spaces, die an diesem Tag teilnehmen und ihre Türen öffnen: https://md.ccc-mannheim.de/s/tdoh-spaces25 Was gibt es? Neben den Räumlichkeiten selbst könnt ihr die Menschen kennenlernen und die Themen, mit denen sie sich befassen, und vor allem könnt ihr erfahren, was hinter der Idee von Hackspaces und Hacken im Allgemeinen steckt. Je nach Space gibt es Führungen durch die Räume, Vorträge, Workshops, Kaltgetränke, aber in jedem Fall Soziales und Austausch. Weshalb machen wir das? Vor allem machen wir das aus Überzeugung. Wir haben uns unsere Räume geschaffen, in denen wir uns gemeinsam spielerisch, künstlerisch und politisch austoben können. Wir sind überzeugt, dass es sehr wertvoll ist, diese Räume und Möglichkeiten zu haben. Das wollen wir auch anderen zeigen. Ganz eigennützig freuen wir uns natürlich, wenn dadurch Personen auf uns aufmerksam werden, die sich bei uns wohlfühlen und durch die Veranstaltung den sozialen und inhaltlichen Anschluss zu uns finden können. Menschen außerhalb unserer ‚Bubble‘ möchten wir einen Einblick und Verständnis über uns vermitteln – Horizonte zu erweitern, kann selten verkehrt sein. Für wen ist das gedacht? Dieser Tag richtet sich an an alle Neugierigen und an alle, die in Technik mehr sehen als nur ein apolitisches Mittel zum Zweck und die sich mit Gleichgesinnten umgeben wollen. Sehr wichtig ist uns, dass ihr euch nicht von Gender- oder anderen Stereotypen vom Kommen abhalten lasst. Wir müssen zwar eingestehen, dass wir einen Gender- und ‚Herkunfts‘-Bias in unserer Demographie aufweisen, wie er in den meisten IT-Umfeldern zu erwarten ist. Aber die meisten Spaces sind explizit queer-freundlich und sehr viele haben eigene aktive FLINTA*-Gruppen. Wichtig ist uns auch, dass wir ganz besonders an diesem Tag keine IT- oder Technik-Affinität bei unserem Besuch erwarten. Also: Kommt, wenn ihr neugierig seid! All Creatures welcome: Wir sind sehr bemüht, offen für alle zu sein, weshalb wir keine Personengruppen per se abweisen. Bitte beachte, dass wir aber keinerlei ausgrenzendes Verhalten wie Rassismus, Sexismus, Queer-feindlichkeit usw. sowie faschistische Ideologien tolerieren. Lies dazu auch die Unvereinbarkeitserklärung des CCC sowie gegebenenfalls die Regeln des lokalen Spaces, den du besuchen möchtest. Wenn du damit ein Problem haben solltest, bitten wir dich, nicht zu kommen. Wo? Die teilnehmenden CCC-nahen Spaces sind in dieser Liste zu finden. Vorbereitung … ist an sich nicht nötig, es schadet aber sicher nicht, vorher einmal durch die öffentlich auffindbaren Informationen zu stöbern, zu gucken, ob es da Anhaltspunkte für Gespräche oder weitere Nachfragen gibt und vielleicht sogar Möglichkeiten, sich einzubringen. Vielleicht ist es aber auch einfach spannender, sich nicht zu spoilern. Du kannst nicht an dem Tag? Schade, aber kein Drama – die meisten Hackspaces haben einen regelmäßig stattfindenden offenen Abend, an dem aber etwas weniger los sein wird. Alternativ kannst du gern nachfragen, ob auch Besuche abseits dieser Termine möglich sind. Image: Basti n00b0ss. License: CC-BY-NC 2.0. tag-des-offenen-hackspace"
year_published = 2025
year_updated = 2025
clearnet = "https://events.ccc.de/2025/02/28/tag-des-offenen-hackspace-2025"
