["https://events.ccc.de/category/rc3-2021"]
title = "rC3: NOWHERE (2021) - CCC Event Blog"
full_description = "rC3 merch update 26. Januar 2022 DE EN Wir befinden uns weiterhin in sehr herausfordernden Zeiten. Wir hoffen, dass ihr alle diese gut übersteht. Mit stark minimierter Besetzung läuft derweil die Produktion vom diesjährigen rC3 Merch an, wie ihr hier sehen könnt: youtu.be/VXCo-6Dl4YA. Durch die aktuelle Situation wird der Merch voraussichtlich erst im Februar verschickt werden können. Für alle weiteren, interessierten Menschen an der diesjährigen rC3 Merch Kollektion - der Shop bleibt bis Ende Januar geöffnet - merch.rc3.world. Passt auf euch auf und bleibt gesund! [rC3 2021 - NOWHERE] Time to Say Goodbye 30. Dezember 2021 DE EN Die remote Chaos Experience 2021 NOW/HERE neigt sich dem Ende zu. Von Opening bis Closing vergingen 96 Stunden. Und wir legen noch ein bisschen was drauf. Der Weltuntergang ist verschoben auf 2022. Unser BSI – die besonders schöne Infrastruktur – bleibt bis 1. Januar um 11:00 Uhr auf Best-Effort-Basis bestehen. Mit den World-Chats, Jitsi & BBBs habt Ihr die Möglichkeit, mit Euren Lieblings-Nerds Silvester zu feiern. Unser Dank gilt allen, die über Monate daran gearbeitet haben, dieses Event möglich zu machen. Und allen, die das Jetzt und Hier bevölkern und feinen Fug gemeinsam tun. Bleibt … Weiterlesen … [rC3 2021 - NOWHERE] Eure Workshops und Arbeitsgruppen: How to SoS 28. Dezember 2021 DE EN Hallo zusammen! Ein wichtiger Teil der Präsenzkongresse sind die unzähligen Self-organized Sessions (SoS). Auch die machen wir auf der rC3 für Euch möglich. Es ist einfacher als gedacht: Ihr geht in den Maschinenraum; im Reiter “Selforganized” klickt Ihr auf den Button “Create SoS”. Dort tragt Ihr die Details zu Eurer Self-organized Session ein. Im Textfeld kann Markdown verwendet werden. Denkt an den Haken bei “öffentlich”, damit Euer Event im Fahrplan angezeigt wird und über die Suche auch gefunden werden kann. Nach dem Speichern findet Ihr Eure … Weiterlesen … [rC3 2021 - NOWHERE] Rahmenprogramm 27. Dezember 2021 DE EN Guten Abend, Ihr habt sicherlich schon darauf gewartet: hier sind die Infos zum Programm der Channels. Das Wichtigste zuerst: Das Opening der #rc3 beginnt um 11:00 Uhr, ausgestrahlt wird es bei ChaosWest-TV, FeM und xHain. Bei den gleichen Adressen werdet Ihr auch am letzten Tag um 18:15 Uhr fündig, wenn Ihr Euch für den Infrastructure Review interessiert. Direkt darauf, um 19:00 Uhr wird bei ChaosWest-TV und FeM das Veranstaltungs-Closing folgen. Dieses Mal neu wird das Format der c3newsshow sein, die Ihr bei about:future, FeM und xHain sehen könnt. Mehrmals am Tag werden hier interessante … Weiterlesen …"
