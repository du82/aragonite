title = "POC - CCC Event Blog"
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. … Weiterlesen … 36C3 Phone registration is open 1. Dezember 2019 DE EN Wir freuen uns, euch mitzuteilen, dass trotz Resource Exhaustion die Registrierung der Telefon-Nebenstellen für den 36. Chaos Communication Congress geöffnet ist. Entgegen sonderlicher Meldungen in diesen sozialen Medien auch ohne Voucher :-). Ihr könnt eure DECT, SIP oder GSM Nebenstelle im Generic User Registration Utility (GURU) registrieren. Die Anmeldung eurer Geräte vor Ort könnt ihr wie im letzten Jahr selbst vornehmen. Vergesst eure Geräte und Ladegeräte nicht, denn auch in diesem Jahr möchten wir die 6488 Nebenstellen vom Vorjahr knacken. Damit ihr motiviert werdet, eure … Weiterlesen … Ring! Ring! #35C3 21. Dezember 2018 DE EN In diesem Jahr möchten wir zeigen, dass es möglich ist, zuverlässige, sichere Kommunikationsinfrastruktur mit höchster Qualität und Premium Service bereitzustellen. Für Euch! DECT, SIP oder GSM Nebenstellen könnt ihr im neuen GURU3 reservieren. Die alten Accounts und Daten aus dem GURU2 haben wir migriert. Es ist jetzt per Knopfdruck möglich, eine zufällige freie Nebenstelle zu wählen oder sich alle noch freien Nummern anzeigen zu lassen. Im letzten Jahr schrieben wir noch: „Es ist technisch leider nicht möglich den Prozess [die Telefon Registrierung] zu beschleunigen oder zu … Weiterlesen … Don’t forget your (DECT) phone 12. Dezember 2016 DE EN “Works for us” is not enough. “Works for you” is our aspiration. Das diesjährige Motto: “Works for me” ist uns nicht genug. Unser Anspruch ist: Es soll dich glücklich machen. Wir werden … Weiterlesen …"
