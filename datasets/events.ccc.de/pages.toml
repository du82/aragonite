["https://events.ccc.de/camp/2007"]
title = "Chaos Communication Camp 2007 - Welcome"
full_description = "Welcome! The Chaos Communication Camp is an international, five-day open-air event for hackers and associated life-forms. The Camp features two conference tracks with interesting lectures, a workshop-track and over 30 villages providing workshops and gettogethers covering a specific topic. Chaos Communication Camp 2007 The International Hacker Open Air Gathering 8|9|10|11|12th August 2007 Finowfurt near Berlin, Germany (Old Europe) You can participate! Bring your tent and join our villages. The Camp has everything you need: power, internet, food and fun. The 100.000 square meter areal features enough space to camp, cozy places to hang out and a nice pool and lake to swim and do nautic experiments. More... Get in touch The wiki Most of this website is part of a wiki - which means that everybody can contribute information and more. Head over to the wiki, or login or register an account. camp-announce@lists.ccc.de Official announcements by the Camp crew giving details on the Camp. To subscribe, send mail to camp-announce-subscribe@lists.ccc.de. This list is read-only. camp@lists.ccc.de General discussion about the Camp. To subscribe, send mail to camp-subscribe@lists.ccc.de. Every subscriber may post. Guru The Phone Operation Center provides full DECT-Telephone-Coverage at the camp. Users can bring their own DECT/GAP phone, and call other users, listen to the lectures, and more. Head over to the Registration Utility to register your own number!"
