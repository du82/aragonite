title = "self-organized-sessions - CCC Event Blog"
full_description = "38C3: Self-organized Sessions 16. Dezember 2024 DE EN TL;DR Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen. Self-organized Sessions können bereits jetzt angelegt werden, aber die Räume dafür sind erst ab dem 17. Dezember buchbar. Eine Übersicht aller Self-organized Sessions findet ihr im Hub. Für die Anmeldung einer Self-organized Session verwendet ihr das Backoffice des Hub. Selbstorganisation ist das magische Wort Ihr wollt ein Treffen einer Gruppe oder zu einem bestimmten Thema organisieren? Einen Workshop veranstalten? Einen Wettbewerb oder ein Spiel veranstalten? Habt etwas außerhalb des Gebäudes … Weiterlesen … 37C3: Self-organized Sessions 21. Dezember 2023 DE EN TL;DR Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen. Ab sofort könnt ihr Self-organized Sessions anlegen und Räume dafür buchen. Eine Übersicht aller Self-organized Sessions findet ihr im Hub. Die Anmeldung einer Self-organized Session passiert im Backoffice des Hub. Selbstorganisation ist das magische Wort Ihr wollt ein Treffen einer Gruppe oder zu einem bestimmten Thema organisieren? Einen Workshop veranstalten? Einen Wettbewerb oder ein Spiel veranstalten? Habt etwas außerhalb des Gebäudes organisiert? Möchtet einen Kurzvortrag halten … Weiterlesen … Self-Organized-Sessions open to get filled by you! 12 December 2019 EN Self-Organized-Sessions are your chance to present a topic that is dear to you in a way that works best for you: It may be a workshop or a lecture, it may be a discussion, but it could also be a contest or a game. You can choose any duration between as short as 30 minutes and up to 3 hours. Choose any topic you care about – your favorite programming language, a hobby you’ve started hacking, or a discussion group to find friends with similar interests – expand the topics and the program of 36C3! Please head on to the Wiki and enter your session to contribute your bit to a diverse and versatile … Read more …"
