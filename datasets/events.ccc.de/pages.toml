["https://events.ccc.de/congress/2024/hub/en/wiki/venue"]
title = """
38C3 -
  CCH"""
full_description = '''Venue The 38th Chaos Communication Congress takes place in the Congress Center Hamburg, Germany. More Information about how to get there on the Travel page. Next to the entrance and three new areas we already knew from last year: Saal X, Saal Y and Saal Z! And on top of that, this new layout also removes so many intermediate stairs (compare it the old layout if you are curious). But let's not get ahead of ourselves... Venue layouts are available at 38c3.c3nav.de Starting from the top: Main lecture halls (Level 2-4) Saal 1 is the main lecture hall in the center of the venue with about 3000 seats, Saal GLITCH with about 1200 seats and Saal ZIGZAG with about 900 seats. These halls host the main conference program curated by the CCC Content Teams, an will be recorded and published to media.ccc.de by our Video Operation Center (c3voc). Community stages The stages at Saal Y (Level 2) and Halle H (ground floor) are no longer self-organized, but curated by a newly founded Community Content Team: Stage YELL Stage HUFF Self-organized stages / Workshop rooms (Level 2 + 1) In CCH West next to Saal GLITCH, SoS Saal E with theatre-style seating (chairs in rows), approx. 250 seats; SoS Saal D with banquet seating (large, round tables, e.g. for workshops), approx. 120 seats; and in Level 1 (Garderobenfoyer 1), in the center of the venue SoS Saal 6 with theatre-style seating, approx. 60 seats are freely bookable lecture halls which are scheduled via the events feature of the Hub. The public Self-organized Sessions (SoS) room booking started on Tuesday, December 17th at 18:30 CET – but Sessions can take place anywhere, simply describe the meeting place in the description (e.g. "the western bar at Halle H"). We will announce more details in an upcoming blog post. Saal 5 is operated by multiple assemblies located in Garderobenfoyer 1 (B&B and YouthOC). Assemblies (Level 2) CCH East: Saal X Saal X 07 (Sendezentrum/DLF) Assemblies (Level 1) CCH West Saal A: YouthOC (Jugend hackt, chaos.jetzt, Chaos macht Schule and Verstehbahnhof) Saal A - Makespace Saal A - Bastel/Hackspace Saal A - Tischinsel Saal A - Podeste Solder stations 1 & 2 Saal B+C: c3Kidspace Kidspace - Workshopraum Kidspace - Hackcenter Kidspace - Affenfelsen Kidspace - Basteltische Kidspace - Elektrotisch Kidspace - Spielparadies CCH Mitte / Garderobenfoyer 1: TBD CCH East: Infodesk, POC, Saal Y Saal Y 06 (Stonewall.IO) operated by Haecksen Assemblies (Level 0) Level 0 (ground floor) hosts the entrance area, many assembly spaces (Saal 3, Saal 4, Halle H, Foyer 3+H) and of course, there will be a Lounge as well – but this time in a new location! Saal 3 TBD Saal 4 TBD Foyer 3+H TBD Halle H TBD <!-- this lists will fill automatically once assemblies/orbits are placed – this typically happens around December 19th-24th -->'''
