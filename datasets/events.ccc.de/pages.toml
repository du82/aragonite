["https://events.ccc.de/category/22c3"]
title = "22C3: Private Investigations (2005) - CCC Event Blog"
full_description = "Das vierte Türchen der #35C3 Memory Lane: Mysteriöse Quanten 4. Dezember 2018 DE Das vierte Türchen. „Die Quanten sind doch eine hoffnungslose Schweinerei!“, soll Niels Bohr einst an Albert Einstein geschrieben haben. Schweinerei hin oder her, die Quantenphysik ist auf jeden Fall ein faszinierendes Themenfeld, weil sie unser Wissen darüber, wie die Welt funktioniert, grundlegend in Frage stellt. Quantencomputer und Quantenkryptographie sind auf dem Chaos Communication Congress immer wieder … Weiterlesen … 22C3 audio and video podcasts available 27 June 2006 EN Oh yes, it took a while. But we finally managed to finalize the 22C3 audio and video recordings and to provide them via a podcast feed as well. We now provide audio recordings in MP3, MPEG-4 Audio and Ogg Vorbis format and videos in MPEG-4 AVC (H.264) 320×240 format in addition to our originally posted full resolution MPEG-4 versions. The new videos run on the iPod and are around 25% the size of the big files. To make the material easily accessible, you can subscribe to the main podcasts feeds for either audio or video or just download the files directly from these web pages: 22C3 Video … Read more … About the event ID 21 April 2006 EN As you might have noticed, each lecture recording has an ID (three or four digits long) that is embedded in the file name and the introductory slide in the video itself. You also find this event ID on the 22C3 Fahrplan being used in URLs and such. The more important information is that this ID will be unique over ALL Chaos Communication Congresses since 1998 (not everything is online properly but it will). So there is not only no clash with IDs used at 21C3, there won’t be one with 23C3 as well. And this goes for all events that have been planned with our Pentabarf conference planning … Read more … Gentlemen, fire up your clients (2nd Update) 21 April 2006 EN All recorded 22C3 videos are online now (via BitTorrent and HTTP). Get the individual torrent files or get all torrent files in one tar.gz archive: 22C3-videos-complete-20050506.tar.gz (here are the checksums). We still plan to provide complete torrent sets and extra torrent sets optimized for DVD-sized download chunks so that it is easier to archive that stuff. We are a bit distracted by other stuff currently, but we will bring you an update soon. Audio-only versions will follow soon as will the iPod-versions. If you want to mirror the content, please use BitTorrent to get the files and … Read more …"
