["https://events.ccc.de/2025/01/16/easterhegg-2025-call-for-participation"]
title = "Easterhegg 2025: Call for Participation - CCC Event Blog"
description = """
tl;dr Easterhegg 2025: CfP ist draußen
Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an.
Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der wir einander kennenlernen können und gemeinsam neue Ideen aushecken. Es ist damit die perfekte Gelegenheit, um dein Thema in familiärer Atmosphäre einem interessierten und bunten Publikum vorzustellen oder gemeinsam neue Projekte zu planen."""
full_description = "Easterhegg 2025: Call for Participation 16. Januar 2025 DE EN tl;dr Easterhegg 2025: CfP ist draußen Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an. Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der wir einander kennenlernen können und gemeinsam neue Ideen aushecken. Es ist damit die perfekte Gelegenheit, um dein Thema in familiärer Atmosphäre einem interessierten und bunten Publikum vorzustellen oder gemeinsam neue Projekte zu planen. Wir freuen uns über deine Einreichung in Form eines Vortrags, Workshops oder Kunstprojekts. Diese sollte einen aussagekräftigen Titel und eine informative Kurzbeschreibung beinhalten. Sollte dein Workshop nur mit einer begrenzten Teilnehmer*innen-Zahl funktionieren oder du bestimmtes Equipment benötigen, gib uns das bitte bei der Einreichung bekannt: https://cfp.eh22.easterhegg.eu/eh22/cfp Zusätzlich wird es Räume geben für selbstorganisierte Veranstaltungen (Self-Organized Sessions), die zu einem späteren Zeitpunkt im Wiki angemeldet werden können. Weitere Informationen zur Veranstaltung werden auf unserer Website in Kürze erscheinen. Außerdem könnt ihr Fragen an orga@eh22.easterhegg.eu richten. EH22 CfP Hamburg"
