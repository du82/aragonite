["https://events.ccc.de/category/26c3"]
title = "26C3: Here be dragons (2009) - CCC Event Blog"
full_description = "Last chance to get your pre-ordered (and paid) Congress wear 14 February 2013 EN During 29C3 pre-order season we saw over a thousand people buying shirts and hoodies online. But not everyone picked up their stuff during Congress, that’s why we have around hundred pieces of cloth that belongs to one of you. But we would love to see you proudly walking around in our Congress cloth and not have them rot away in our backyard. So please, check your inbox for preorder-receipts you have not redeemed yet and come and get your stuff. There will be an hand-out event on Saturday, February, 23th in CCCB around 4pm in Berlin [1]. If you cannot make it there, please send an email to … Read more … 26c3 Backstage 31 December 2009 EN 26c3 is over. Go see what you missed – it’s all there. During the last hours I went to see what the people behind the stages thought of this year’s congress. A group that is hardly noticed by the general public is the kitchen crew: they prepare food for some 350 ‘Angels’, approx. 10% of all participants. ‘Angels’ are the helpers of the CCC events. They still have to pay for their ticket like everyone else and trade their work for food and a conference t-shirt. When asked what their goal was the kitchen crew said: we make the angels happy! And they believe that they succeeded by about 80%. … Read more … Last Minute 26c3 Schedule Change 30 December 2009 EN Christian Eichelmann from the Wolpertinger project will be speaking in Saal 3 starting at 11:30. It is a distributed portscanner, which actually doesn’t do anything else than scan (tcp-)ports. But it is fast. Really fast. So fast you can scan Class-B networks before you have to retire. And it is available from here. The output lands in a database (SQLite) you can do with that what you want. It runs on linux and is open source. The IBM AS/400 Talk in Saal 3 has been cancelled. There are no other reported schedule changes, but be sure to check back here on events.ccc.de, follow @26c3 and … Read more …"
year_published = 2013
