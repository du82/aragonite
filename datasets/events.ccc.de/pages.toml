["https://events.ccc.de/category/23c3"]
title = "23C3: Who can you trust? (2006) - CCC Event Blog"
full_description = "23C3 Documentation Video 13 December 2007 EN The 23C3 Documentation Video has been released. It is in our Chaos TV podcast. Check it out to get a feeling on how 24C3 is going to be. 23C3 audio and video recordings available 27 March 2007 EN We finally made it. Again, way too much time passed to finish off the complete set of recordings due to a technical problem on day one which forced us to re-capture and re-edit a quarter of the recordings. It always good to have backups. But now we can provide you with the complete set of recordings in both audio-only and the complete video version. All videos are sized 640×480 pixels and are superbly encoded featuring very low bitrates and an unusually good video quality at the same time. All files can be played back on the iPod. Thanks to the 23C3 video crew of FEM Ilmenau and CCC Ulm for … Read more … Looking for cool quotes, help wanted 21 February 2007 EN We are currently producing a video documentary of the recent 23C3 event. We have tons of nice footage and interesting interviews, but we want more. So we are looking for cool quotes by speakers in the lectures being held at 23C3 and we want you to spot them for us as it is an enormous task for a few people but probably feasible for a huge crowd doing it in parallel. So take a look at our preliminary video recordings (they are almost complete, just some talks of the first day are missing as they have to be re-captured from tape). We are looking for insightful statements that reflect our … Read more … 23C3 Lecture Videos forthcoming 4 January 2007 EN While some 23C3 lecture recordings have already been leaked to the net, the official high-quality recordings are still in preparation (but making good progress). We do not encourage redistribution of the leaked videos as they lack proper license information, titles and correct meta-data. Please note that all material is released under CC-NC- The to-be-released files come in MPEG-4 H.264 640×480 format and will be pretty small. The files are iPod-compatible and will hopefully be released as a podcast soon after."
