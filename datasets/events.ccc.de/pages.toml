["https://events.ccc.de/congress/2024/infos/assemblies.html"]
title = "Assemblies - 38th Chaos Communication Congress Infos"
full_description = "Assemblies Informationen auf Deutsch Tl;dr: Where is my assembly? Find it on c3nav from 26 December; arrival & setup from 25 December; questions on site: call DECT ASSM (2776) or email 38c3-assemblies@cccv.de. Where is our assembly? You will find the location of your assembly via c3nav from 26 December at the latest. Placing will take some time, please be patient – even if some of the other assemblies might already get updated in c3nav before yours. Arrival & setting up Information for your personal travel is available on the Getting there page. We also welcome your help with general Congress build-up: see the Call for Angels for details. You may begin setting up your assembly starting 25 December (unless you have been explicitly instructed otherwise). On 25 December, we will be available for your arrival from 2 p.m. (14:00). On 26 December, we will be available for your arrival from 12 p.m. (12:00). On 27 December, we expect that it will still be possible to arrive with deliveries for your assembly, but since Congress will already be running at that time, it might take longer to unload your equipment. We will open multiple entrances for your deliveries. Which entrance you should use depends on the location of your assembly. You can refer to the following list for an overview, but above all please follow the instructions you receive from our angels that will welcome you at the branch-off from Tiergartenstraße onto the CCH grounds; their instructions take priority. The angels will also be able to help you if you cannot yet find your assembly on the c3nav map. Large deliveries (Trucks), please come to Gate H. Assemblies in Hall 3, please drive your car to Gate F. Assemblies in Hall 4, please drive your car to Gate C. Assemblies in Hall H and the “Foyer 3+H” (between Halls 3 and H), please drive your car to Gate D. Assemblies on the first and second floor (Foyer 1, Halls X and Y), please drive your car to Gate A. You will reach all gates from the west via Tiergartenstraße. The official street address is Tiergartenstraße 2, 20355 Hamburg, but this may cause your navigation system to route you in from the wrong direction, so please ensure that your planned route matches the arrival map below. You can also download the map of the delivery entrances as a PDF. Please make sure to check c3nav beforehand to know where exactly your assembly will be. The angels will also have pallet trucks and pallets ready for you to transport anything bulky. Please be prepared to unload as quickly and efficiently as possible. 38C3 has more than 400 registered assemblies; we can only do this if everyone acts calmly and with consideration for their fellow Congress participants. In the interest of keeping the unloading process as smooth as possible, and preventing long wait for other assemblies, you will need to remove your car immediately after you have stored your equipment at your assembly’s location. You may want to designate a driver for this, or proceed with your actual build-up only after you have moved your car to a more permanent parking spot. In addition to the structured unloading procedure at the loading gates, you may also park at the CCH underground carpark and transport (non-bulky) things to your assembly location on your own. However, we have no control over the parking fees charged by CCH, and cannot support your unloading with angels or pallet carts there. Delivering things If you need to deliver or set up things for your assembly before 25 December, please discuss this with the Assembly Team in advance. For packages and parcels (both before and during Congress), please have a look at the FAQ section on getting things to Congress. How do I contact the assembly team? The best way to reach us on site is via DECT (call: “ASSM”, i.e. 2776), alternatively via 38c3-assemblies@cccv.de or via Matrix / RocketChat. Assemblies (Deutsch) Tl;dr: Wo ist meine Assembly? Auf c3nav ab 26.12.; Anreise & Aufbau ab dem 25.12.; andere Fragen vor Ort: via DECT ASSM (2776) anrufen, bis 25.12. gern auch: 38c3-assemblies@cccv.de. Wo ist unsere Assembly? Den Ort deiner Assembly findest du über c3nav spätestens ab dem 26.12.. Das Placing wird einige Zeit in Anspruch nehmen, bitte geduldet euch – auch wenn vielleicht andere Assemblies schon vorher in c3nav zu finden sind. Anreise & Aufbau Informationen für eure persönliche Anreise findet ihr unter Anreise. Wir freuen uns auch über Unterstützung beim allgemeinen Congress-Aufbau: alles weitere dazu findet ihr im Call for Angels. Ihr könnt mit dem Aufbau eurer Assembly ab 25. Dezember beginnen (außer ihr habt explizit andere Instruktionen erhalten). Am 26. Dezember werden wir ab 10 Uhr für eure Ankunft bereitstehen. Am 27. Dezember könnt ihr voraussichtlich zu den selben Zeiten anreisen. Da der Congress dann bereits begonnen hat, kann es dann aber etwas länger dauern, bis ihr eure Sachen ausladen könnt. Alle Details zu Anreise und Anlieferung findet ihr nachfolgend: Die Anlieferung all eurer Dinge und Aufbauten erfolgt parallel über mehrere Anlieferungstore des CCH. Welches Tor das Richtige für euch ist, hängt ab vom zugeteilten Standort eurer Assembly sowie von der Größe eures Fahrzeugs. Grundsätzlich gilt folgende Aufteilung, bitte folgt aber insbesondere den Anweisungen der Einweisungsengel, die euch am Übergang von der Tiergartenstraße zum CCH-Gelände in Empfang nehmen. Die Engel können euch auch weiterhelfen, wenn ihr eure Assembly noch nicht auf der c3nav-Karte findet. Alles, was größer als ein PKW ist, fährt bitte zu Tor H. (Egal, wo eure Assembly ist.) Assemblies in Saal 3 fahren mit ihren PKW bitte zu Tor F. Assemblies in Halle H und im „Foyer 3+H“ (zwischen Saal 3 und Halle H) fahren mit ihren PKW bitte zu Tor D. Assemblies im ersten und zweiten Obergeschoss (Foyer 1, Saal X und Saal Y) fahren mit ihren PKW bitte zu Tor A. Ihr erreicht alle Anlieferungstore über die Tiergartenstraße aus westlicher Richtung. Die Straßenadresse lautet Tiergartenstraße 2, 20355 Hamburg, damit wird euch euer Navigationssystem aber möglicherweise aus der falschen Richtung anfahren lassen. Kontrolliert daher bitte, ob eure geplante Route mit der Anfahrtskarte unten übereinstimmt. Ihr könnt euch auch die Anlieferungs-Karte als PDF ansehen. An eurem jeweiligen Tor werdet ihr von Engeln in Empfang genommen, die euch zu eurem Assembly-Bereich begleiten werden. Schaut bitte vorher auf c3nav nach, wo genau eure Assembly untergebracht ist. Die Engel halten außerdem Hubwagen mit Paletten bereit, auf denen ihr sperrige Gegenstände zu eurer Assembly transportieren könnt. Bitte bereit euch darauf vor, so schnell und effizient wie möglich auszuladen. Beim 38C3 gibt es über 300 Assembly-Anmeldungen; wir können das nur stemmen, indem wir alle ruhig und rücksichtsvoll miteinander umgehen. Um das Ausladen so reibungslos wie möglich zu gestalten, und um lange Wartezeiten für die anderen Assemblies zu vermeiden, werdet ihr euer Auto direkt wieder entfernen müssen, sobald ihr euer Equipment an eurem Assembly-Standort abgestellt habt. Es empfiehlt sich, dafür vorab ein*en Fahrer* zu bestimmen, oder den tatsächlichen Aufbau später zu beginnen, nachdem ihr euer Auto zu dessen endgültigen Parkplatz gebracht habt. Neben den strukturierten Ausladebereichen an den Liefertoren besteht außerdem die Möglichkeit, in der CCH-Tiefgarage zu parken und eure (nicht allzu sperrigen) Dinge eigenständig zu eurem Assemblystandort zu transportieren. Dort können wir euch allerdings nicht mit Engeln und Hubwagen unterstützen und es werden ggf. Parkgebühren durch das CCH erhoben. Dinge anliefern Falls ihr vor dem 25.12. Dinge für eure Assembly anliefern oder aufbauen müsst, so sprecht das vorher mit dem Assembly-Team ab. Für Päckchen und Pakete (vor und während des Congress) informieren wir euch in den FAQ zum Thema Getting things to Congress. Wie kontaktiere ich das Assembly-Team? Ihr erreicht uns vor Ort am besten per DECT (unter „ASSM“, also 2776), alternativ über 38c3-assemblies@cccv.de oder via Matrix / RocketChat."
year_published = 2025
clearnet = "https://events.ccc.de/congress/2024/infos/assemblies.html"
