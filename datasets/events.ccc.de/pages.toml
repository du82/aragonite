full_description = "25C3 - 1.4.2.3 25th Chaos Communication Congress Nothing to hide Speakers Markus Dahms Schedule Day Day 4 (2008-12-30) Room Saal 2 Start time 14:00 Duration 01:00 Info ID 2942 Event type lecture Track Hacking Language used for presentation de Feedback Did you attend this event? Give Feedback Vertex Hacking Reverse Engineering von 3D-Dateiformaten Es geht um die Methoden beim Umgang mit unbekannten Dateiformaten, speziell im Bereich der 3D-Modelle. Vorgestellt werden sollen die Werkzeuge, die Vorgehensweise, ein paar mögliche Fallstricke, interessante Implementierungsdetails und schlussendlich auch das Ergebnis in Form der Bibliothek libg3d. Inhalte sollen vor allem sein: Umgang mit strukturierten Binärformaten Datenformate im 3D-Bereich Spektrum der verschiedenen Formate/möglichen Lösungen to be continued... Attached files (application/pdf - 200.1 KB) Links Homepage libg3d/G3DViewer <<< >>>"
