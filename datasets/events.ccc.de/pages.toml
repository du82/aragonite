title = "hub - CCC Event Blog"
full_description = "38C3: Self-organized Sessions 16. Dezember 2024 DE EN TL;DR Workshops, Gruppentreffen, Kurzvorträge, … fassen wir als Self-organized Sessions zusammen. Self-organized Sessions können bereits jetzt angelegt werden, aber die Räume dafür sind erst ab dem 17. Dezember buchbar. Eine Übersicht aller Self-organized Sessions findet ihr im Hub. Für die Anmeldung einer Self-organized Session verwendet ihr das Backoffice des Hub. Selbstorganisation ist das magische Wort Ihr wollt ein Treffen einer Gruppe oder zu einem bestimmten Thema organisieren? Einen Workshop veranstalten? Einen Wettbewerb oder ein Spiel veranstalten? Habt etwas außerhalb des Gebäudes … Weiterlesen … 38C3 Hub / Wiki / Assemblies 6. Dezember 2024 DE EN Wir haben das 38C3 Public Wiki eröffnet - das wir inzwischen allgemein „Hub“ nennen. Der Hub ist als zentraler Ort gedacht, um sich über die Angebote des Kongresses zu informieren: Er fasst die Veranstaltungen der Hauptbühnen (Fahrplan), Community Bühnen, Assemblies sowie selbstorganisierte Sessions in einer Übersicht zusammen, die dann auch von den mobilen Apps genutzt wird. Ihr könnt die angemeldeten und akzeptierten Assemblies in der Assembly-Liste einsehen. Bitte beachtet, dass das Assembly-Team noch nicht alle Anmeldungen bearbeitet hat und sich die Liste in den nächsten Tagen noch weiter … Weiterlesen …"
