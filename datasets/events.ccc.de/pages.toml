["https://events.ccc.de/category/29c3"]
title = "29C3: Not my department (2012) - CCC Event Blog"
full_description = "The Congress is over. Long live the Congress! 11 January 2013 EN => Thank you, you all just rocked! The 29C3 in the new location in Hamburg was great and you all made that possible! We are glad we made the move and really happy that it worked out well. However, congress is not over yet and there are still things to be done for 29C3. You can support us by: Adding feedback for talks that you watched Providing general feedback regarding congress Adding your Congress pictures and videos Linking your blogpostings or press articles Joining the effort to provide subtitles for ALL the lecture videos You are anticipating the next Congress as impatiently … Read more … Still spaces left for your Lightning Talk! 28 December 2012 EN There’s still a few open slots in the Lightning Talks happening on Days 2, 3 and 4. We’re especially looking for [Pecha Kucha][2] talks in the first half of Day 3. There’s also plenty of space open for 5 minute talks on Day 4. If there’s space, you can submit your Lightning Talk as late as Noon on the day you want to present. There’s even a chance to do a remote lightning talk on Day 4. Check the wiki for more details! Day 1: Pictures from the 29c3’s opening day 28 December 2012 EN Thanks to Sascha Ludwig for some awesome photos from Day 1 of the 29c3. Read more … Online maps of the 29c3! 27 December 2012 EN We now have interactive online maps of the 29c3 available at maps.congress.ccc.de. Feedback is always welcome on the #maps.events.ccc channel on hackint. Day 0: Pictures from the 29c3 Setup 27 December 2012 EN As we head into Day 1, the 29c3 Setup is nearly complete. As you can see from this small sample of sights from the 29c3, we’re making very creative use of our much, much larger space without losing the feeling that makes the congress so special. As FEM banner above suggests, talks will be streamed from the 29c3. Read more … Pre-ordered clothing will stay reserved throughout the 29c3 27 December 2012 EN To eliminate any potential confusion from the last post about clothing: Pre-Ordered clothing will remain reserved until the end of the 29c3. Even if certain items are sold out to the general public, you can pick up your pre-orders at any time during the 29c3."
