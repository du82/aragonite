["https://events.ccc.de/category/camp-2023"]
title = "Chaos Communication Camp 2023 - CCC Event Blog"
full_description = "Camp 2023 – lost+found, BGP leftovers 14. September 2023 DE EN Das Camp 2023 ist vorbei, die meisten Paletten sind sortiert und zurück in unseren Lagern. Aber eines ist noch übrig: eure Sachen. Hast du während des Camps etwas verloren? Hast du es versäumt, ein Paket beim BGP abzuholen? Ist dein Paket zu spät angekommen? Keine Sorge, hier erfährst du, wie du deine Sachen zurückbekommst: Lost + Found Falls du etwas verloren hast, schreib uns bitte eine E-Mail an camp23@c3lf.de. Unser freundliches Garderobenteam kümmert sich um die Fundsachen und nimmt sich deiner Anfrage gerne an. BGP Wenn du die Abholung einer Sendung vergessen hast oder dein Paket … Weiterlesen … Camp 2023 – Feedback 26. August 2023 DE EN Während einige Menschen aktuell noch die Reste vom Camp auf Paletten packen und in LKW laden, kämpfen andere mit dem Post-Camp-Syndrom. Wir hoffen, dass ihr alle eine gute Zeit mit wunderbaren Wesen hattet und dass die guten Erinnerungen an spannende Tage und verrückte Nächte überwiegen. Nach dem Camp ist vor dem nächsten Camp - deshalb brauchen wir euer Feedback. Was war richtig gut? Was ging gar nicht? Wo seht ihr Raum für Optimierung? Hat euch etwas gefehlt, was ihr von anderen Events kennt? Insbesondere sind wir an Feedback zu den Infoseiten, zum Matrix Eventchat und dem Hub interessiert, … Weiterlesen … Ende. Aus. Finito. 19. August 2023 DE EN Alles hat ein Ende .. .. leider auch das Camp. Am Samstag wird es das Closing mit snoopy und leona um 20 Uhr geben. Es wird am Sonntag die große Abreisewelle geben. Um euch die Abreise so angenehm als möglich zu gestalten haben wir einen Abbauplan erarbytet. Hilfe beim Abbau Wir benötigen dringend Hilfe beim Abbau. Bitte überlegt ob ihr nicht noch ein paar Tage bleiben könnt. Je mehr Hilfe wir bekommen, desto schneller und schöner kommen alle hier vom Platz. Bitte meldet euch beim Himmel. Strom und Infrastruktur Alle Sanitäranlagen, bis auf die am Anlagen am Kidsspace und alle Trockentoiletten … Weiterlesen …"
year_published = 2023
