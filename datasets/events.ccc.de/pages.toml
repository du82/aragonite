["https://events.ccc.de/en/2006/12/26/getting-faster-to-the-congress"]
title = "Getting faster to the congress - CCC Event Blog"
description = """
We are, as usual, expecting a really big run for entry tickets on the morning of the 27th – you had to wait about an hour last year. However, the ticket counter will open already on 26th in the evening. It is scheduled to open at 20:00, probably earlier. So if you are already in Berlin, please buy your ticket on the 26th in the evening. It will be a lot easier and faster for you and us – and will save you a lot of time standing in some cold ugly weather condition.
Everything else right now seems to work out quite smooth, no bigger fuckups, internet connectivity is already running."""
full_description = "Getting faster to the congress 25 December 2006 EN We are, as usual, expecting a really big run for entry tickets on the morning of the 27th – you had to wait about an hour last year. However, the ticket counter will open already on 26th in the evening. It is scheduled to open at 20:00, probably earlier. So if you are already in Berlin, please buy your ticket on the 26th in the evening. It will be a lot easier and faster for you and us – and will save you a lot of time standing in some cold ugly weather condition. Everything else right now seems to work out quite smooth, no bigger fuckups, internet connectivity is already running. Oh, and just in case you have some old CPUs or Ram collecting dust somewhere in your room: Bring them to the Congress, we are collecting them for some kind of a benefit project."
