["https://events.ccc.de/2017/12/22/the-chaos-emergency-response-team-cert"]
title = "The Chaos Emergency Response Team: CERT - CCC Event Blog"
description = """
Wer jemals beim Congress ein kleines oder größeres Zipperlein hatte oder den Lötkolben wieder ganz verkehrt gehalten hat, der wird es schon kennengelernt haben: Das Chaos Emergency Response Team (CERT) sorgt für diejenigen Hacker, die eine professionelle Betreuung bei Unfällen, Notfällen, Vorfällen oder Krankheitsfällen brauchen. Es sind die Rettungsnerds, die als freiwillige Helfer beim 34c3 dabei sind, um die Veranstaltung sicherer, angenehmer und sogar etwas keimfreier zu gestalten.
Es ist nun zwanzig Jahre her, dass die vage Idee entstand, für Notfälle ein eigenes Team zu gründen. Niemand weiß heute mehr, wie ein Congress ohne die Ersthelfer funktionieren konnte – auch weil das Team neben der praktischen Hilfe während der Congress-Tage bereits im Vorfeld mit Expertise aushilft."""
full_description = "The Chaos Emergency Response Team: CERT 22. Dezember 2017 DE EN Wer jemals beim Congress ein kleines oder größeres Zipperlein hatte oder den Lötkolben wieder ganz verkehrt gehalten hat, der wird es schon kennengelernt haben: Das Chaos Emergency Response Team (CERT) sorgt für diejenigen Hacker, die eine professionelle Betreuung bei Unfällen, Notfällen, Vorfällen oder Krankheitsfällen brauchen. Es sind die Rettungsnerds, die als freiwillige Helfer beim 34c3 dabei sind, um die Veranstaltung sicherer, angenehmer und sogar etwas keimfreier zu gestalten. Es ist nun zwanzig Jahre her, dass die vage Idee entstand, für Notfälle ein eigenes Team zu gründen. Niemand weiß heute mehr, wie ein Congress ohne die Ersthelfer funktionieren konnte – auch weil das Team neben der praktischen Hilfe während der Congress-Tage bereits im Vorfeld mit Expertise aushilft. Irgendeiner muss ja zum Beispiel mit der Feuerwehr vor Ort kommunizieren, den Plan für Fluchtwege durchsehen, Mullbinden stapeln und Warnwesten auftragen. Allerdings gibt es erst seit dem 19c3 das heute bekannte CERT, das sich in wohlorganisierter Form dem Brandschutz, der Krisenintervention und dem Sanitätsdienst widmet. Etwa einhundert Sanitäter, Krankenpfleger, Feuerwehrfrauen und Ärzte sind um ein langjähriges Kern-Team herum eingebunden. Und das sind längst nicht alle Professionen, die sich mittlerweile eingefunden haben: Das CERT integriert auch Psychologen, Notfallseelsorger und Mediatoren, um für möglichst jeden Vorfall gut gewappnet zu sein. Für persönliche Krisen oder Interventionen stehen dadurch erfahrene Profis rund um die Uhr bereit. Durch das Wachstum des CERT kamen in den letzten Jahren zudem Heilpraktiker, Zahn- und Kinderärzte, Chemiker, Bergungsfachleute und sogar Rettungsschwimmer („fürs Bällebad“) dazu; sogar einen Profi-Höhenretter gibt es! Na gut, im Team ist auch ein Radiologe, allerdings (glücklicherweise) ohne Röntgengerät. Und es wird jeden beruhigen, dass auch ein professioneller Bootsführer nun an Bord ist, schließlich befindet sich ein veritabler See vor dem Leipziger Messegelände! Auch für handfeste und lebensbedrohliche Notfälle ist das CERT gut aufgestellt. Die Abteilung, liebevoll „human maintenance“ genannt, steht der Leistungsfähigkeit eines Rettungswagens in nichts nach. Auch dem Anspruch „leave no nerd behind“ konnte das CERT bisher immer nachkommen. CERT-Engel sind stolz darauf, dass sie Nerds den Besuch des Congress ermöglichen, die wegen gesundheitlicher Probleme immer wieder auf Unterstützung angewiesen sind und sonst nicht teilnehmen könnten. Jedes Jahr finden sich mehr Interessierte beim CERT ein, sowohl auf der Seite der Helfer als auch bei den zu Helfenden. Denn mit der wachsenden Teilnehmerzahl und Fläche der Veranstaltungsräume wächst auch die Arbeit. Der Congress hat bisher noch einen leichten Männerüberhang, weswegen die bekanntermaßen zum Jammern neigende Spezies rituell ihren Congress-Schnupfen, Rasierwunden oder Fußpilz mitbringt und dann beim CERT in der Patientenversorgung beklagt. Aber es gab noch keinen Congress, wo nicht auch diese Zipperlein verarztet werden konnten. Um einen Einblick in die typischen Tätigkeiten des letzten Jahres zu geben: Auf dem 33c3 stellten sich 367 Patienten im CERT vor und hatten rein statistisch meistens kleine Schnittwunden oder Kopfschmerzen oder beides. Ausreißer haben dann schon mal Erinnerungswert, wie etwa die Kopfplatzwunde durch einen Legostein. Im CERT wurden auch schon mal Engel eingeliefert, die mit Erschöpfungszuständen nach mehreren Engelschichten zu kämpfen hatten. Also bitte beachtet Eure eigene Leistungsfähigkeit und achtet auf regelmäßigen Schlaf und Ruhepausen. Das CERT ist ab Tag 0 rund um die Uhr erreichbar unter der DECT-Nummer 112 oder vor Ort in der Glashalle, Ebene -1. Außerdem weiß jeder unserer „Engel“ mit Funkgerät oder DECT-Telefon, wie das CERT zu erreichen ist. Es gibt auch einen Twitter-Account, der jedoch nicht für Notfälle genutzt werden soll. Seid nett zu ihnen, wer weiß, wann Ihr sie mal dringend braucht! CCC CERT Congress Events"
year_published = 2017
year_updated = 2017
clearnet = "https://events.ccc.de/2017/12/22/the-chaos-emergency-response-team-cert"
