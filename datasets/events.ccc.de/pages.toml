["https://events.ccc.de/2017/12/24/the-34c3-awareness-team"]
title = "The 34C3 Awareness Team - CCC Event Blog"
description = """
Auf dem 34c3 werden über 15.000 Menschen sein – die nicht alle dieselben Bedürfnisse und Standpunkte haben.
Rücksichtnahme und das Respektieren individueller Grenzen sollten selbstverständlich sein. Doch bei einer solchen Menge von Menschen kann es leider zu Grenzüberschreitungen kommen – gewollt oder ungewollt.
Daher wird es – wie bereits in der Vergangenheit – auch in diesem Jahr auf dem Congress ein Awarenessteam geben, in Ergänzung und enger Zusammenarbeit mit der CCC Security und dem medizinischen und feuertechnischen Notfallteam CERT.
Safety & Security: DECT 110 CERT: DECT 112 Awarenessteam: DECT 113 Ihr habt kein DECT-Telefon? Engel helfen immer gern. Ihr findet sie in eurer Nähe oder am Infopoint, den Bars, oder den Eingängen."""
full_description = "The 34C3 Awareness Team 24. Dezember 2017 DE EN Auf dem 34c3 werden über 15.000 Menschen sein – die nicht alle dieselben Bedürfnisse und Standpunkte haben. Rücksichtnahme und das Respektieren individueller Grenzen sollten selbstverständlich sein. Doch bei einer solchen Menge von Menschen kann es leider zu Grenzüberschreitungen kommen – gewollt oder ungewollt. Daher wird es – wie bereits in der Vergangenheit – auch in diesem Jahr auf dem Congress ein Awarenessteam geben, in Ergänzung und enger Zusammenarbeit mit der CCC Security und dem medizinischen und feuertechnischen Notfallteam CERT. Safety & Security: DECT 110 CERT: DECT 112 Awarenessteam: DECT 113 Ihr habt kein DECT-Telefon? Engel helfen immer gern. Ihr findet sie in eurer Nähe oder am Infopoint, den Bars, oder den Eingängen. e-Mail (c3-awareness@lists.ccc.de) Twitter (DM an @c3awareness – DMs sind offen) von eurem Mobiltelefon aus über die Nummer +49 4644-38299-113 Das Awarenessteam (DECT 113) bietet bei Konflikten Hilfestellung und bei Bedarf einen Rückzugsraum im CCL. Beispiele für Konflikte, bei denen wir Hilfe anbieten können, sind Einschüchterungen, sexuelle Belästigung, Stalking oder Diskriminierungen aller Art (z. B. gegen Menschen mit Behinderung, Rassismus, Sexismus, Homo- oder Transfeindlichkeit etc.). Wir sind natürlich auch in weniger dramatisch scheinenden Fällen für euch da. Kommt gerne auf uns zu, wenn ihr Unterstützung möchtet. All denjenigen, die mit dem Begriff „Awareness“ nichts anfangen können oder die nur eine vage Vorstellung davon haben, möchten wir unsere Arbeit kurz vorstellen: „To be aware“ ist Englisch für „aufmerksam / bewusst sein“. Awarenessarbeit bedeutet dafür zu sensibilisieren, auf sich selbst und andere zu achten. Dies gilt besonders gegenüber Menschen, die in ihrem Erscheinen oder Handeln von den vorherrschenden sozialen Normen abweichen. Damit soll die Aufmerksamkeit geschaffen werden, mit der ‘be excellent to each other’ in der Realität umgesetzt werden kann. :) Awareness bedeutet, die individuellen Grenzen anderer anzuerkennen. Menschen machen in ihrem Leben ganz unterschiedliche (unter Umständen traumatische) Erfahrungen und sind in ihrem Erleben einzigartig. Daher sind ihre Grenzen auch unabhängig davon zu achten, ob wir sie verstehen oder nachvollziehen können. Wir moralisieren bei unserer Arbeit nicht: Wir treten dem übergriffigen Verhalten entgegen, nicht der Person. Es geht explizit nicht um Schuld oder darum, jemanden als „Täter“ abzuurteilen. Hingegen wollen wir das Verständnis füreinander und den gegenseitigen Respekt fördern, wo sich jemand in seinen Grenzen verletzt fühlt. Das versuchen wir auch dann, wenn das unbeabsichtigt geschieht, um für das zukünftige Verhalten zu sensibilisieren. Last but not least: Wir fragen euch in der Regel zuerst, was passiert ist und ob ihr bereits eine konkrete Idee habt, was ihr tun möchtet und wie wir euch dabei eventuell unterstützen können. Falls ihr noch keine Idee habt, helfen wir euch gerne dabei, eine zu entwickeln. Wir sind während des Congress rund um die Uhr für euch da. Also wendet euch bei Problemen gerne an uns. Auch dann, wenn ihr einfach gerade nur jemanden zum Reden braucht, einen Rückzugsort oder jemanden, der euch dabei hilft, geeignete Unterstützung zu finden. awareness CCC Congress"
year_published = 2017
year_updated = 2017
clearnet = "https://events.ccc.de/2017/12/24/the-34c3-awareness-team"
