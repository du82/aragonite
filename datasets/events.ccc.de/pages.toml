["https://events.ccc.de/tag/gsm"]
title = "GSM - CCC Event Blog"
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. … Weiterlesen … C3GSM wants you to test yesterday’s future, today! 22 December 2019 EN tl;dr: we will operate our own cellular network at 36C3. Bring your mobile phone(s) and C3SIM card(s). Check the Wiki for latest status and device support. Like previous years at 36C3 the C3GSM team will run a local cellular network for mobile phones, alongside the POC’s DECT system and the NOC’s IPv4 and IPv6 systems. As core network for our cellular network we use the open source projects osmocom (for 2G/3G) and NextEPC (for 4G). There will only be a very limited number of SIM cards available to buy. However, cards from previous CCC events can be used, so please don’t forget to bring them. … Read more … 36C3 Phone registration is open 1. Dezember 2019 DE EN Wir freuen uns, euch mitzuteilen, dass trotz Resource Exhaustion die Registrierung der Telefon-Nebenstellen für den 36. Chaos Communication Congress geöffnet ist. Entgegen sonderlicher Meldungen in diesen sozialen Medien auch ohne Voucher :-). Ihr könnt eure DECT, SIP oder GSM Nebenstelle im Generic User Registration Utility (GURU) registrieren. Die Anmeldung eurer Geräte vor Ort könnt ihr wie im letzten Jahr selbst vornehmen. Vergesst eure Geräte und Ladegeräte nicht, denn auch in diesem Jahr möchten wir die 6488 Nebenstellen vom Vorjahr knacken. Damit ihr motiviert werdet, eure … Weiterlesen …"
year_published = 2024
