["https://events.ccc.de/category/35c3"]
title = "35C3: Refreshing Memories (2018) - CCC Event Blog"
full_description = "Refreshing Abbau 29. Dezember 2018 DE EN TLDR: Moin, morgen 18:15 ist Schluss, baut ab, macht keinen Scheiß. Hallo am Kongress teilnehmende Lebensformen, morgen geht der 35c3 leider zu Ende und es steht der Abbau an. Dazu brauchen wir eure Hilfe. Wir bitten alle Assemblies, pünktlich mit dem Ende des Closing-Event um 18:15 am 30.12. mit dem Abbau ihrer Assembly zu beginnen. Bitte transportiert euren Kram über die Tore 2.5, 2.6, 3.8, 3.9 und 3.10 ab. Bitte baut erst ab, transportiert dann euren Kram vor das Tor und holt danach euer Fahrzeug dort hin. Nachdem ihr eure Assembly zurückgebaut habt, stapelt bitte Stühle sortenrein auf … Weiterlesen … Play, dance and chill with Fairy Dust! 27 December 2018 EN After standing in the cold for quite a long time, the Fairy Dust waits for you and your video-art-vision in the heat of Discodrama. This is one of our four spots with art, culture, music and beauty at 35C3. Just like assemblies show their geeky stuff, these places show artsy stuff: Champions in their respective fields have stepped out of their bubble into ours, to give us light’n’beauty. Now they are curious about your reaction to their passion. Let’s all explore the entire universe – not only these four spaces: Shutter Island: CCL -1 (c3nav) Music from morning till morning; ambient chillout … Read more … Assembly Anreise 25. Dezember 2018 DE EN Hallo liebe Assemblies, bitte beachtet dass ihr — wenn ihr auf das Gelände fahren wollt — unbedingt ab dem 27.12 ein Bändchen braucht, sonst lässt euch die Pforte nicht auf das Gelände. Desweiteren brauchen wir von euch die Kennzeichen von den Fahrzeugen mit denen ihr auf das Gelände fahren wollt. Bitte schickt euer Kennzeichen in einer Mail an 35c3@c3loc.de oder ruft uns unter 0341 39294864 an, die Pforte lässt nur angemeldete Fahrzeuge passieren. Die Einfahrt auf das Gelände erfolgt über Tor Süd 1, ihr könnt dann direkt zu den Hallen fahren. Wo euer Assembly ist erfahrt ihr auf c3nav. Zum … Weiterlesen …"
