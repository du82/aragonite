["https://events.ccc.de/category/camp-2019"]
title = "Chaos Communication Camp 2019 - CCC Event Blog"
full_description = 'Collect your #cccamp19 Angel Shirt at #36C3 24 December 2019 EN DE Congress or Camp would not be possible without the support of heaven and the angels. If you worked enough voluntary angel shifts at #cccamp19, you earned a special edition angel shirt. Unfortunately, some of you never received your well-deserved shirt: Maybe you never came by our tent; maybe we ran out of your specific size; you name it! This is why we placed a follow-up order, ready for collection at #36C3 \o/ Please drop by the C3 Angel Fashion Operation Center at #36C3 to collect your #cccamp19 angel shirt, if you have not yet received one! In case you did not quite complete the necessary … Read more … Ende. Aus. Finito. 24. August 2019 DE EN Alles hat ein Ende .. .. leider auch das Camp. Die Umfrage hat ergeben, dass knapp die Hälfte von euch schon am Sonntag abreisen will, ein weiterer großer Teil am Montag. Um euch die Abreise so angenehm als möglich zu gestalten haben wir einen Abbauplan erarbytet. Fahrzeug schnell beladen Ab 10 Uhr könnt Ihr Gepäck auf den Ziegeleiparkplatz (hier) bringen und dort in Euer Auto laden. Ein Engel Vor Ort wir euch mit einem passenden Passierschein versorgen. Fahrzeug auf dem Gelände beladen Ab 15 Uhr könnt Ihr mit Eurem Fahrzeug auf das Gelände fahren um es zu beladen. Packt soweit zusammen dass … Weiterlesen … Auf die Bühne, fertig, los! 23. August 2019 DE English summary: There’ll be two live bands in the family village, Saturday (Day 4) at 2pm and 4pm, have fun! Dieses Jahr gibt es im Family Village auch eine Bühne – Ihr habt Euch vielleicht schon darüber gewundert? Es wird dort zwei Kinderbands geben, Mitsingen erwünscht! Samstag, Tag 4, 14 Uhr: Suli Puschban Sie ist ein Phänomen. Ein Unikat in der Musiklandschaft, das sich jeder Einordnung widersetzt: Liedermacherin, Kinderliedermacherin, Kabarettistin. Charmant, witzig, tiefgründig. “Kinderlieder sind kein Kinderspiel!”, sagt Suli Puschban und schreibt über das Kind-sein in Berlin, wo sie … Weiterlesen …'
