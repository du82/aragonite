["https://events.ccc.de/en/2024/12/18/38c3-lightning-talks"]
title = "38C3: Lightning Talks - CCC Event Blog"
description = """
TL;DR There will be two Lightning Talk sessions See https://cfp.cccv.de/38c3-lightningtalks/cfp for submission Further information at https://events.ccc.de/congress/2024/infos/lightning-talks.html Lightning Talks? Did you assume that the thrill of sharing your ideas in front of a huge audience at a C3 was something you’d never experience? Do you work on a cool project and want to get the word out? Was your talk one of the hundreds that got rejected? Did you come up with an awesome hack that you need to share? Go ahead and enter your Lightning Talk now!
The 38C3 Lightning Talks consist of two fast-paced sessions that are perfect for pitching new software or hardware projects, exploits, creative pranks or strange ideas you need to get out to a global audience."""
full_description = "38C3: Lightning Talks 18 December 2024 EN DE TL;DR There will be two Lightning Talk sessions See https://cfp.cccv.de/38c3-lightningtalks/cfp for submission Further information at https://events.ccc.de/congress/2024/infos/lightning-talks.html Lightning Talks? Did you assume that the thrill of sharing your ideas in front of a huge audience at a C3 was something you’d never experience? Do you work on a cool project and want to get the word out? Was your talk one of the hundreds that got rejected? Did you come up with an awesome hack that you need to share? Go ahead and enter your Lightning Talk now! The 38C3 Lightning Talks consist of two fast-paced sessions that are perfect for pitching new software or hardware projects, exploits, creative pranks or strange ideas you need to get out to a global audience. Even if you don’t have an awesome idea or project to share, a lightning talk is perfect for pitching your assembly, your workshop or even a longer talk you’ll give as a self-organized session. Your five minutes of fame! Register a Lightning Talk In theory, registration is open until the the day before the last session (28 Dec for the 29 Dec session). However, we only have a limited number of time slots and we assign these on a “first come, first served” basis. So don’t hesitate – submit your Lightning Talk at https://cfp.cccv.de/38c3-lightningtalks/cfp Further information All details can be found at https://events.ccc.de/congress/2024/infos/lightning-talks.html – news and announcements are posted to Mastodon at https://chaos.social/@C3_LightningTLK Chaos Communication Congress Lightning Talks"
