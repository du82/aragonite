["https://events.ccc.de/category/camp-2007"]
title = "Chaos Communication Camp 2007 - CCC Event Blog"
full_description = "Chaos Communication Camp 2007 – The movie 14 January 2008 EN The official camp documentation movie documentation is now released at chaosradio.ccc.de. Enjoy! Update: As the server is pretty busy you might want to use BitTorrent with this torrent file to get the movie quicker. David Chaum at the Camp 11 August 2007 EN We are excited to announce that Dr. David Chaum, cryptographer and founder of DigiCash, accepted our invitation to come to the Camp. He will describe his ideas for enabling voters to verify their votes, using simple cryptographic techniques to ensure election integrity. David Chaum developed the system, Scantegrity, in open source and will introduce it in a talk on Saturday at 6.30 pm in Shelter Foo. Fun at the museum 10 August 2007 EN Just a reminder: Today is the last chance to take a flight with the antonow bi-plane above the camp – they start 14:00 and continue as long as there are new customers. See the wiki page for further information. The museum will do a guided tour within the museum today. Meet at 19:00 at the statue next to the snack bar – the tour will be held in German, but we are currently trying to get a translator. Please give feedback on the talks you attended 9 August 2007 EN We have now enabled the feedback system and kindly ask you to provide feedback on those talks that you attended. How? It’s really simple: Locate the event in our online schedule (“Fahrplan”) at http://events.ccc.de/camp/2007/Fahrplan/ and then on the detail page for each event there is a “Give Feedback” link. Simply follow that link and fill out the form, then submit the form. This information is hugely important and helpful both for the speaker in order to improve his or her style of presentation and to the organisers for future events! Hacker Ethics Hotline 7 August 2007 EN We don’t want the term hacker to have such a negative connotation, right? Since the first hacks are already announced ask yourself before pressing ENTER: What happens if I 0wn that box now? Is it ethically justifiable to do this or that? And finally, one of the most important questions of hacking ethics is: How much stress will happen if things go wrong? And with power comes responsibility. So, think about the most efficient way to handle an interesting piece of information. The Hacker Ethics Hotline offers fast and anonymous counseling on this and related topics. Simply dial 1042 on the DECT … Read more …"
year_published = 2008
clearnet = "https://events.ccc.de/category/camp-2007"
tags = ["adventure", "attended", "aufs", "august", "blog", "building", "camp", "camp:", "chaos", "chaum"]
