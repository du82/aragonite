["https://events.ccc.de/2024/12/22/38c3-assembly-last-minute-infos"]
title = "38C3: Last Minute Assembly Infos - CCC Event Blog"
description = """
Es wird kuschelig! Weit über 400 Assemblies mit unzähligen tollen Projekten und Ideen haben sich angemeldet, die Wünsche nach Sitzplätzen haben einen neuen Rekord erreicht. Leider ist das CCH im letzten Jahr nicht größer geworden und die Anfragen übersteigen die verfügbaren Plätze um das 1,4-fache. Bitte habt Verständnis, dass wir zugunsten der bunten Vielfalt des Kongresses euren individuellen Platzwünschen nicht im vollen Umfang nachkommen können.
Unsere Bitte: rückt zusammen, baut Gemeinschaftsplätze in euren Assemblies, sprecht euch mit euren Nachbarassemblies ab, erkundet den Congress und: be excellent to each other.
Eure Assemblies findet ihr auf der Karte. Wenn eure Assembly Teil eines Habitats ist, findet ihr auf der Karte aktuell nur einen Marker innerhalb der Habitatsfläche."""
full_description = "38C3: Last Minute Assembly Infos 22. Dezember 2024 DE EN Es wird kuschelig! Weit über 400 Assemblies mit unzähligen tollen Projekten und Ideen haben sich angemeldet, die Wünsche nach Sitzplätzen haben einen neuen Rekord erreicht. Leider ist das CCH im letzten Jahr nicht größer geworden und die Anfragen übersteigen die verfügbaren Plätze um das 1,4-fache. Bitte habt Verständnis, dass wir zugunsten der bunten Vielfalt des Kongresses euren individuellen Platzwünschen nicht im vollen Umfang nachkommen können. Unsere Bitte: rückt zusammen, baut Gemeinschaftsplätze in euren Assemblies, sprecht euch mit euren Nachbarassemblies ab, erkundet den Congress und: be excellent to each other. Eure Assemblies findet ihr auf der Karte. Wenn eure Assembly Teil eines Habitats ist, findet ihr auf der Karte aktuell nur einen Marker innerhalb der Habitatsfläche. Sprecht mit eurer Habitatsorga die genaue Platzzuordnung ab, das Assemblies Team (DECT: ASSM / 2776) korrigiert den Karteneintrag dann gerne mit euch und euren Habitatsverantwortlichen. Bitte lest die Infoseite zu Assemblies. Euer mitgebrachtes Projekt ist spannender als der Tisch der dort gerade steht und ihr möchtet Mobiliar wieder los werden? Dann bringt es bitte zur Möbelfundgrube in Halle H (hinteres Ende, Logistikbereich). Haltet in jedem Fall die Fluchtwege frei! Nach Absprache mit dem Assemblies-Team (DECT: ASSM / 2776) könnt ihr auch Möbel aus der Fundgrube entnehmen, sofern die Accessibility (Zugänglichkeit) eures Bereichs weiterhin gewährleistet ist. Bitte achtet dabei darauf, nur den selben Typ Tisch Eures Bereichs mitzunehmen - eckige Tische mit den Maßen 160x80cm dürfen nur in Halle H und Saal 4 platziert werden. Das Möbelhaus ist erreichbar bis 26.12. Mitternacht: DECT: IKEA / 4532 38c3@c3moebelhaus.de Damit wirklich alle eine exzellente Zeit haben können, beachtet bitte folgendes: Lasst die Wege in und um eure Assembly frei, damit sie auch mit Rollstuhl nutzbar sind. Achtet auf mögliche Stolperfallen: Vermeidet sie oder markiert Unebenheiten und leicht zu Übersehendes. Haltet das Blindenleitsystem frei (erhabene Markierungen auf dem Boden). Da die Aufzüge letztes Jahr stark ausgelastet waren und das für Mobilitätseingeschränkte zu sehr langen Wartezeiten führten, bitten wir euch, die Nutzung der Aufzüge auf ein Minimum zu reduzieren und stattdessen bevorzugt Treppen zu nutzen, sofern ihr das könnt. Wir freuen uns auf euch und eure vielen spannenden Projekte und Ideen die ihr mitbringt, bis gleich! Headerbild CC BY-SA 2.0 Karol Roller"
