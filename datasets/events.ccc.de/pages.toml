["https://events.ccc.de/en/2024/12/22/38c3-assembly-last-minute-infos"]
title = "38C3: Last Minute Assembly Infos - CCC Event Blog"
description = """
It’s getting cozy! Well over 400 assemblies with countless great projects and ideas have registered, and the requests for seats have reached a new record. Unfortunately, the CCH did not become any bigger last year and the requests exceed the available seats by 1.4 times. To make the colorful diversity of the congress possible, please understand that we cannot fully meet your individual seating requests.
Our appeal: move closer together, build shared places in your assemblies, coordinate with your neighboring assemblies, explore the congress and: be excellent to each other.
You can find your assemblies on the map. If your assembly is part of a habitat, you will currently only find a marker within the habitat area on the map."""
full_description = "38C3: Last Minute Assembly Infos 22 December 2024 EN DE It’s getting cozy! Well over 400 assemblies with countless great projects and ideas have registered, and the requests for seats have reached a new record. Unfortunately, the CCH did not become any bigger last year and the requests exceed the available seats by 1.4 times. To make the colorful diversity of the congress possible, please understand that we cannot fully meet your individual seating requests. Our appeal: move closer together, build shared places in your assemblies, coordinate with your neighboring assemblies, explore the congress and: be excellent to each other. You can find your assemblies on the map. If your assembly is part of a habitat, you will currently only find a marker within the habitat area on the map. Discuss the exact location with your habitat orga, the assemblies team (DECT: ASSM / 2776) will be happy to correct the map entry with you and your habitat representatives. Please read the assembly info page. The project you brought along is more exciting than the table that is currently sitting there and you want to get rid of furniture? Then please bring it to the furniture drop-off point in Hall H (rear end, logistics area). Keep the escape routes clear in any case! After prior consultation with the Assemblies Team (DECT: ASSM / 2776), you can also take furniture from the furniture drop-off, provided that the accessibility of your area is still guaranteed. Please make sure that you only take the same type of table as your area - square tables measuring 160x80cm may only be placed in Hall H and Hall 4. The Möbelhaus (Furniture Team) is open until 26.12. midnight: DECT: IKEA / 4532 38c3@c3moebelhaus.de To ensure that everyone has an excellent time, please note the following: Keep the paths in and around your assembly clear so that they can also be used with a wheelchair. Watch out for potential tripping hazards: Avoid them or mark unevenness and objects that are easy to overlook. Keep the guidance system for the blind clear (raised markings on the floor). As the elevators were very busy last year and this led to very long waiting times for people with limited mobility, we ask you to reduce the use of the elevators to a minimum and prefer to use the stairs instead, if you can. We look forward to meeting you and all your exciting projects and ideas, see you soon! Image CC BY-SA 2.0 Karol Roller"
