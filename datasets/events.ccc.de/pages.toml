title = "Photo Documentation - 23C3 Public Wiki"
full_description = '''Photo Documentation From 23C3 Public Wiki Jump to: navigation, search Here is the place for links to galleries of pictures you have taken on 23C3 and published online. Please mark, under which terms or Creative Commons license your pictures may be used. The Creative Commons attribution (CC-by) is preferred. Moreover, there'll be a tag called 23C3 at flickr and of course there also is a 23C3 Flickr Group at http://flickr.com/groups/23c3/. The group's photofeeds are RSS 2.0 and Atom Please make sure that the people you took a picture of want to see their faces online before you upload them somewhere. Privacy, you know! You can feel free to submit your pictures in the public wiki. We ask you to add a unique string like "myname_1stday_" (no slashes) at the beginning of the file name while uploading. Then collect the pics on a page below "Photo Documentation", like "Photo_Documentation/yourname". Wintix' 23C3 Photos. CC by-nc Maiks 23c3 Photos, CC Attribution 2.5, v4, 061230 15h56 Thomas Gutzmers 23c3 Photos, CC Attribution 2.5, v1, 061229 17h55 Photo Series on Club Mate Photo Documentation/OpenBSD Animations of the event Photoserie Chaostreff Zuerich zh.chaostreff.ch Behrang Fouladi 23c3 Photos Photo Documentation/Rollanothernumber Kewagi's photos on Flickr jchome's photos arne's photos (mostly from Hardware Hacking) BugBlue's photos (from 24.12.2006-30.12.2006) License: CC-by-nc-nd on request released at other licenses! Photos - PoCSascha from eventphone Photos 21C3 Photo Documentation 22C3 Photo Documentation Retrieved from "https://events.ccc.de/congress/2006/Photo_Documentation" Category: Photography'''
