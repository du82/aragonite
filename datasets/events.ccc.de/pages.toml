["https://events.ccc.de/category/camp-2011"]
title = "Chaos Communication Camp 2011 - CCC Event Blog"
full_description = "Flow Controllers bring the camp to you! 10 August 2011 EN Just as we had Mission Angels at the 27c3, a brand new team of people to connect you to the camp has emerged from the fairy dust. The Flow Controllers are here to help bring the camp to you! In Kourou and Baikonur, Flow Controllers are monitoring IRC and Twitter, ready to take your questions: Kourou (Streams are here): #kourou (irc.freenode.net) #kourou on Twitter Baikonur (Streams are here): #baikonur (irc.freenode.net) #baikonur on Twitter The Flow Controllers would also like more suggestions on how they can better bring the camp to you! Leave a comment on the post, and let your friends know … Read more … Yes, you can still get a Camp ticket! 5 August 2011 EN Camp is not sold out! There will be day tickets available for 45 € and evening tickets for 20 €. However, no tents or campers are allowed with day or evening tickets. If you already bought a ticket, don’t forget to print it out! You can login to the presale ticket site to print your tickets. More information is on the camp wiki under “Tickets“. Campguide released 2 August 2011 EN For your orientation and answering the most frequent questions, we created a nice Campguide. Included in the Campguide is a map with all the facilities and the larger villages. In the center are the two lecture shelters “Kourou” and “Baikonur” and the “Hackcenter” north of it. In front of the Hackcenter shelter is the “motodrone” located, the area where you can fly your quadcopters or similar objects. Behind the Hackcenter next to the small forest you can find the “Trockendock”, an area with music, lights and bars. South and east of the lecture shelters is the main camping area with a lot of … Read more … Camp Tickets Downloadable Now 2 August 2011 EN Finally we’re done with generating all ticket PDFs! :) If you’ve ordered a Camp ticket in the online sales system and also payed it, you can download your ticket from https://presale.events.ccc.de now. For those of you, who registered an email address we’ll additionally send the PDFs by mail. Please print out your tickets and bring them to the Camp! You need them in order to get your wrist bands."
