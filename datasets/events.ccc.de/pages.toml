["https://events.ccc.de/tag/hamburg"]
title = "hamburg - CCC Event Blog"
full_description = "Easterhegg 2025: Call for Participation 16. Januar 2025 DE EN tl;dr Easterhegg 2025: CfP ist draußen Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an. Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der … Weiterlesen … Easterhegg 2020 – Save the date & Presale 20. Januar 2020 DE Moin! Unter dem Motto: “back to root” möchte der CCC Hamburg hiermit herzlich vom 10. bis 13.04.2020 zum Easterhegg einladen. Im Jahr 2020 jährt sich die Veranstaltung zum 20. Mal. Nach Basel, Paderborn, Stuttgart, Braunschweig, Salzburg, Mühlheim, Würzburg und Wien kommt das Ostertreffen zurück nach Hause. Es wird das verflixte 7. Mal und wir hoffen es wird besonders. Im Fokus sollen Workshops stehen, weniger Frontalvorträge, mehr Platz zum Forschen, Entdecken, Löten und Austauschen. Der Veranstaltungsort ist die zum Kulturzentrum gewandelte, ehemalige Maschinenfabrik Kampnagel. Hier wurden … Weiterlesen … Hey! What about the tickets for 29C3? 28 August 2012 EN As we had a lot of people asking, here some answers: Q: How much will the tickets cost? A: Our priority is to keep the price for the tickets as low as in the years before. So we currently assume that it will be around 80 Euros — as it was last year. Q: What if I can not afford that? A: There will be a friend’s request address as we had it before. More details coming with the start of the presale. Q: But what is this friend’s request? A: At 28C3 we handled it like this. Have a look. Q: Ah, there will be a presale for tickets? A: Yes, there will be a presale to buy a ticket in advance. Q: So I … Read more …"
