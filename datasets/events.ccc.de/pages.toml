["https://events.ccc.de/congress/2024/infos/lightning-talks.html"]
title = "Lightning Talks - 38th Chaos Communication Congress Infos"
full_description = "Lightning Talks Did you think that the thrill of sharing your ideas in front of a huge audience at a C3 was something you’d never experience? Do you work on a cool project and want to get the word out? Was your talk one of the hundreds that got rejected? Did you come up with an awesome hack that you need to share? Go ahead and enter your Lightning Talk now! The 38C3 Lightning Talks consist of two fast-paced sessions which are perfect for pitching new software or hardware projects, exploits, creative pranks or strange ideas you need to get out to a global audience. Even if you don’t have an awesome idea or project to share, a Lightning Talk is perfect for pitching your Assembly, your workshop or even a longer talk you’ll give as a self-organized session. Your five minutes of fame! Check out the 37C3 Lightning Talks to get an impression. Register a Lightning Talk Registration is theoretically open until the the day before the last session (28 Dec). However, we only have a limited number of time slots and assign these on a first-come-first-serve basis. So don’t hesitate – submit your Lightning Talk at 38C3 Lightning Talks CfP Further information & contact Follow us on Mastodon. We do not monitor mentions or direct messages. If you have any questions please reach out to us via email at 38c3-lightningtalks@cccv.de"
year_published = 2025
