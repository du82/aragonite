["https://events.ccc.de/category/32c3"]
title = "32C3: Gated Communities (2015) - CCC Event Blog"
full_description = "Das 15. Türchen der #35C3 Memory Lane: Herbe Verluste 15. Dezember 2018 DE Das fünfzehnte Türchen. Der Chaos Communication Congress ist auch ein Ort, auf dem gefeiert wird: Gute Geschichten, hervorragende Hacks oder faszinierende Fortschritte der Technik. Im Jahr 2005 erdeten Rop Gonggrijp und Frank Rieger die allgemeine gute Laune mit ihrem Vortrag „We lost the war“. Schonungslos ehrlich stellten sie die Gesamtsituation auf den Prüfstand: Welche Erfolge können wir bei aller Arbeit und … Weiterlesen … Das achte Türchen der #35C3 Memory Lane: Tief durchatmen! 8. Dezember 2018 DE Das achte Türchen. Kreativität wird auf dem Chaos Communication Congress in vielen Formen, auch manchmal leicht abseitigen, gefeiert. Im Jahr 2015 wurde bekannt, dass ein deutscher Autobauer sich von dieser Kreativität ein Scheibchen abgeschnitten und mit technischen Kniffen im großen Stil Abgasgrenzwerte überschritten hatte. Über diesen Abgasbetrug berichteten erstmals auf dem 32C3 Daniel Lange und Felix Domke. Doch … Weiterlesen … Call for Subtitles 10. Januar 2016 DE EN Wie Ihr vielleicht wisst, haben die Subtitles Angels alle Vorträge des 32c3, die in Saal 1 & 2 stattfanden, in Echtzeit untertitelt. Dies erlaubte Besuchern, die schlecht oder gar nicht hören können, trotzdem den Talks zu folgen. Zudem unterstützte dies auch Hacker, die nicht muttersprachlich Deutsch oder Englisch sprechen. Foto: CC BY-NC 2.0 by spanier via flickr Während nun die letzten Aufzeichnungen des … Weiterlesen … Servicenummern auf dem 32C3 28. Dezember 2015 DE EN Dafür, dass der ganze Ablauf beim 32. Chaos Communication Congress funktioniert, sorgen mehr als tausend Freiwillige, unsere Engel. Sie kümmern sich um Auf- und Abbau, Getränkeversorgung, Video- und Tonaufnahmen, Internetzugang, Beleuchtung, Kunstinstallationen, und vieles, vieles mehr. Auch für Notfälle gibt es Engel. Solltet ihr während der Veranstaltung Hilfe benötigen, wählt bitte eine der folgenden Congress-internen Nummern (d.h. Congress-DECT oder Congress-GSM, im Text unterstrichen dargestellt): Allgemeine Notfälle: intern 110 Meldet euch unter dieser Nummer… – bei (ernstzunehmender) … Weiterlesen …"
