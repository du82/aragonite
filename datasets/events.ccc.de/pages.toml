["https://events.ccc.de/category/23c3/page/2"]
title = "23C3: Who can you trust? (2006) - CCC Event Blog"
full_description = "Bring your DECT. 22 December 2006 EN [basic info] The POC will provide the telephone system (Alcatel OmniPCX 4400) combined with an asterisk system for VoIP which is fully integrated into the PBX System. Additionally the POC will also provide cable bound phones which will be connected via the structured cabling system of the BCC. Everybody can bring his own DECT/GAP compatible phone, which will be registered into the system. [payoff] “a cellphone is so much more useful – why bring a DECT phone, too?” you should bring a DECT phone for the following four reasons: you can talk to other DECT phone users locally at the congress for … Read more … Prepare for Impact 22 December 2006 EN Today was the “kickoff” day at the bcc, our very first day getting everything set up for the congress in the building. As every year, it was mostly a delivery day. Shirts, the proceedings and a lot of other stuff we need for the organization arrived – all the stuff we need quite early in our congress setup. Most of the hardware used for the congress network is already in the building, huge stacks full of switches and routers were delivered today. Quite a lot of … Read more … Lightning Talks 18 December 2006 EN Lightning Talks give you up to ten short talks each day – between 4pm and 5pm. Each talk is limited to five minutes. Usually the topic is some cool program or project – but it can also be a good rant. So this year’s motto is “The good *and* the bad”. You can still add your own praise or rant by adding it to the page within the wiki. Enter the title, language (DE/EN), your name, contact address, and a short description. But whatever the topic – dive right in, and make it count! One “word” of introduction should suffice, and then give us as many info as you can within four minutes; when your … Read more … Searching for volunteers: Heralds at 23C3 13 December 2006 EN The congress fahrplan is nearing completion, and we’re starting to plan the details. One important part of this is finding Heralds: volunteers who for a couple of hours are willing to be the main spokesperson in a conference room, who announce the individual sessions, and help out when something goes wrong. Photo by smallcaps. This year we would like to have a Herald for every single talk, not just the big ones in Saal 1. That’s quite an ambitious goal (our Herald schedule is comprised of 44 shifts), … Read more …"
