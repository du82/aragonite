title = "SIGINT - CCC Event Blog"
full_description = "Vorschau auf die SIGINT 2013 9. Juni 2013 DE Der Chaos Computer Club (CCC) veranstaltet im Sommer, vom Freitag, den 5. Juli, bis zum Sonntag, den 7. Juli 2013, die Hackerkonferenz SIGINT im Mediapark in Köln. Die SIGINT richtet sich an Hacker, Netzbewohner und Aktivisten, steht aber auch allen anderen interessierten Menschen offen. Die SIGINT1 schließt an die großen jährlichen Veranstaltungen des Chaos Communication Congress im Winter an und erhöht die Taktfrequenz, mit der Inhalte aus dem Themenkreis des digitalen Zeitalters behandelt und in die Öffentlichkeit getragen werden. Ein Auszug aus den über 60 im Fahrplan2 veröffentlichten … Weiterlesen … SIGINT 2013: Call for Participation 21 February 2013 EN July 5th-7th, KOMED im Mediapark, Cologne, Germany **sigint.ccc.de/cfp ** SIGINT is an annual hacker conference organized by the Chaos Computer Club. It features talks covering both technical and social aspects of our digital society. VOLUNTEERS For SIGINT to be as great as always, we need your help. First and foremost, we need eager volunteers to help on-site with the intricate details of organizing a conference for hundreds of people. Please register as a volunteer as soon as we have the registration online. ARTS AND PROJECTS Asides from helping us having everything run smoothly, we’d … Read more … SIGINT 2012: Ende des Vorverkauf 26. April 2012 DE Die erste Version des SIGINT12 Fahrplans ist veröffentlicht und unter https://program.sigint.ccc.de/en/sigint12/public/schedule zur Verfügung gestellt. Sie beinhaltet fast alle Vorträge, die auf der Veranstaltung stattfinden. Der Fahrplan gibt schon einen guten Überblick, aber wir müssen eventuell ein paar Vorträge verschieben. Da wir zwei Wochen Bearbeitungszeit für die Überweisung des Eintritts einplanen, schließt der Presale dieses Wochenende (spätestens am 29.4.). Falls ihr noch ein Ticket wollt, klickt es euch noch dieses Wochenende. Sicher wird es auch vor Ort einen … SIGINT 2012: Start des Vorverkauf 10. April 2012 DE Der Vorverkauf für Tickets und T-Shirts zur diesjährigen SIGINT beginnt am 11. April, 22:00 Uhr MESZ (UTC+2). Die Preise bleiben gegenüber den letzten Jahren unverändert: Dauerticket: 60€ Tageskarte: 30€ Dauerticket Schüler: 40€ Business Ticket: 250€ Ihr könnt auch direkt T-Shirts für 15€ und Hoodies für 30€ gleich mit vorbestellen. Das Presale-System findet ihr unter: https://presale.sigint.ccc.de/ Eine kleine, zufällige Auswahl der Vorträge findet ihr auf http://sigint.ccc.de/ Für Fragen, …"
