title = "EH22 - CCC Event Blog"
full_description = "Easterhegg 2025: Call for Participation 16. Januar 2025 DE EN tl;dr Easterhegg 2025: CfP ist draußen Das Easterhegg 2025 findet in der Zeit vom 18. April 2025 bis zum 21. April 2025 in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage mit Workshops, Vorträgen und weiteren Veranstaltungen geben. Diesmal dreht sich alles um das Motto „Unhandled Eggception” – und wir freuen uns auf eure kreativen, technischen und außergewöhnlichen Interpretationen davon. Der Call for Participation sei somit eröffnet und nimmt eure tollen Einreichungen bis einschließlich 01.03.2025 an. Kurz zum Event: Das Easterhegg ist eine familiäre Community-Veranstaltung, auf der … Weiterlesen …"
