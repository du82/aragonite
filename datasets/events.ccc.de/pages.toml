["https://events.ccc.de/category/divoc"]
title = "DiVOC - CCC Event Blog"
full_description = "DiVOC: Call for Angels 29. März 2022 DE EN Call for Angels Liebe Lebewesen, bald ist es so weit: Die divoc 2022 steht vor der Tür. Und wir brauchen Engel. Genauer gesagt brauchen wir Heralds, Signal Angels, Übersetzerengel, Welcome Engel, aber auch Stream Watcher und Chat Room Beobachter. Bitte meldet euch unter divoc@neanderfunk.de damit wir möglichst bald wissen, wen wir wo einteilen können. Danke. DiVOC: Call for Worlds 19. März 2022 DE EN Lasst uns Brücken zwischen unseren normalen Blasen bauen, Orte um sich auszutauschen, neuen Wesen zu begegnen oder um altbekannte Hasen wiederzusehen. Platz ist dafür reichlich vorhanden und wir hoffen, dass die Welt für dieses Divoc mindestens so bunt wird wie letztes Jahr. Damit das bunte Chaos ein wenig Kohärenz haben kann, gibt es jetzt schon einen Styleguide unter bb3-style.betalars.de Einen Logogenerator gibt es selbstverständlich auch: bb3.tils.pw Wenn ihr mit eurer Welt an unserer Lobby andocken wollt, schickt uns eine Mail mit dem Namen eures Assemblies und einem öffentlich … Weiterlesen … DiVOC Bridging Bubbles – Call for Expertise 14. März 2022 DE EN tl:dr: Der CfP wird verlängert bis 20.3.2022 Wir greifen Putins Ukraine-Krieg an einem Thementag auf (Samstag, 16.04.) Gesucht: qualifizierte Beiträge zu Geflüchtetenhilfe, OS-Intelligence, Fakt-Checking, offene Informationsflüsse, Schutz vor Cyberangriffen, Hackerethik, Versöhnung Beiträge zu anderen ernsten und niedlichen Themen weiter gern gesehen! Der Angriffskrieg Putins gegen die Ukraine bestürzt uns. Niemals hätten wir gewollt, dass unser Thema, Bridging Bubbles, so aktuell werden würde. Denn - so unmöglich es in der aktuellen Lage scheint - wir werden Brücken bauen müssen zwischen … Weiterlesen … DiVOC Bridging Bubbles – Call for Participation 18. Februar 2022 DE EN tl;dr Vorträge, Kunstprojekte und Musik für den Stream der DiVOC bb3. Deadline für die Einreichung: 13.3.2022, Veranstaltung vom 15.–18.4.2022. Die Blasen und Echokammern, in denen wir uns alle bewegen, scheinen in der Pandemie noch enger und undurchlässiger geworden zu sein. Was sind das für Blasen, wer erzeugt sie, wie tauchen wir wieder daraus auf? Wir freuen uns über Vorträge rund um Technik, Wissenschaft und Politik und Gesellschaft. Besonders wünschen wir uns Themen, die sich mit der aktuellen gesellschaftlichen Auseinandersetzung beschäftigen, mit Fragen der Partizipation und … Weiterlesen …"
