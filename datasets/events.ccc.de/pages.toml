["https://events.ccc.de/category/30c3"]
title = "30C3: ohne Motto (2013) - CCC Event Blog"
full_description = "Das 22. Türchen der #35C3 Memory Lane: Den tiefen Staat sichtbar machen 22. Dezember 2018 DE Das zweiundzwanzigste Türchen. Es ist ein Konzept politischer Analyse, aber auch zentraler Aspekt von Verschwörungstheorien: der „tiefe Staat“, der ein gewisses Eigenleben führt. Einen gleichnamigen Vortrag hielt Andreas Lehner im Jahr 0 nach Snowden, also auf dem 30C3 und zu der Zeit, als sich vermeintliche Paranoia gegenüber Staaten und Geheimdiensten als schlichte Wahrheit entpuppte. In seinem Vortrag … Weiterlesen … Das 21. Türchen der #35C3 Memory Lane: Mein Bügelbrett war’s 21. Dezember 2018 DE Das einundzwanzigste Türchen. Eine echte Bank im Programm des Chaos Communication Congress sind die Security Nightmares, präsentiert von Ron und Frank, die sich in eingespielter Manier und mit wachsendem Zynismus die Bälle zuwerfen. Exemplarisch sei heute die Ausgabe vom 30C3 herausgegriffen, die ihrerseits die Nummer 14 der ausgesprochen traditionsreichen Vortragsreihe ist. Das Jahr des 30C3 war auch das Jahr … Weiterlesen … Wartungsarbeiten: events.ccc.de 19. September 2014 DE EN Einige werden mitbekommen haben, dass events.ccc.de während des 30C3 lange Zeit nicht erreichbar war. Ursprung des Problems waren tatsächlich verschiedene Umstände: Zum einen haben wir im letzten Jahr deutlich mehr Funktionen im Wiki abgebildet, zum anderen haben wir ein dringendes Update des Servers zu lang vor uns her geschoben. Besser gesagt existierte der Server schon Monate vor dem Congress, der Umzug scheiterte letztlich an einem Mangel an Zeit. Der Umzug wurde in einer Nacht- und Nebel-Aktion auf dem Congress nachgezogen, weshalb das Wiki am letzten Tag überhaupt wieder erreichbar war. … Weiterlesen … 30C3 recordings: all formats released 14 January 2014 EN Congress is over now and as always, there has been much more to see than what could be seen in four short days. If you missed some of the talks however, we can help out: Almost all talks have now been released on http://media.ccc.de/browse/congress/2013/ in various formats. If you prefer a plain directory listing, please go to http://cdn.media.ccc.de/congress/2013/. It has been reported that this URL also works quite fine with various media players e.g. XBMC. Each talk is available as MPEG-4 AVC/H264 and WebM/VP8 in 720×576 resolution (anamorphic 16:19). For the talks in hall 1 we additionally … Read more …"
