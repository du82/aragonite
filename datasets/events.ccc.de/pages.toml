["https://events.ccc.de/tag/eventphone"]
title = "Eventphone - CCC Event Blog"
full_description = "38C3: ISDN Version 22. Dezember 2024 DE EN TL;DR Registrierung geöffnet - registriere deine Nummer im Guru Vergiss dein Telefon (DECT, GSM, SIP) nicht Denk an Akkus, Ladekabel und CCC SIM-Karte Die Einwahl von außen lautet: +49 40 5730830 xxxx 2024. Die schöne neue Welt hat die Telefonie komplett gewandelt. IP-Telefonie hat die herkömmliche Telefontechnik samt ISDN und allen Komponenten ersetzt. Bis 2017 sind wir mit einem LKW am 21.12. zum Chaos Communication Congress gefahren. Haben tagelang geschleppt, gepackt, Kabel gezogen, Kabel gepatcht, konfiguriert, Hauptverteilerpläne gepflegt und Fehler behoben, damit spätestens am 26.12. … Weiterlesen … 36C3 Phone registration is open 1. Dezember 2019 DE EN Wir freuen uns, euch mitzuteilen, dass trotz Resource Exhaustion die Registrierung der Telefon-Nebenstellen für den 36. Chaos Communication Congress geöffnet ist. Entgegen sonderlicher Meldungen in diesen sozialen Medien auch ohne Voucher :-). Ihr könnt eure DECT, SIP oder GSM Nebenstelle im Generic User Registration Utility (GURU) registrieren. Die Anmeldung eurer Geräte vor Ort könnt ihr wie im letzten Jahr selbst vornehmen. Vergesst eure Geräte und Ladegeräte nicht, denn auch in diesem Jahr möchten wir die 6488 Nebenstellen vom Vorjahr knacken. Damit ihr motiviert werdet, eure … Weiterlesen … Don’t forget your (DECT) phone 12. Dezember 2016 DE EN “Works for us” is not enough. “Works for you” is our aspiration. Das diesjährige Motto: “Works for me” ist uns nicht genug. Unser Anspruch ist: Es soll dich glücklich machen. Wir werden … Weiterlesen … Digital Enhanced Cordless Telecommunications 19. Dezember 2015 DE EN Klingelingeling Klingelingeling! Auch auf dem 32C3 werden wir Euch wieder eine vom Phone Operation Center (POC) betriebene Telefon-Infrastruktur zur Verfügung stellen, also vergesst nicht, Euer DECT-Telefon einzupacken (und das passende Ladegerät, ggfs. Headset). Wie gewohnt werden neben zahlreichen Funktionen und easter eggs die Audiostreams der Vorträge sowie die Simultanübersetzungen via Telefon zur Verfügung stehen. …"
