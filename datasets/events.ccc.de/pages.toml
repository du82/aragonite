["https://events.ccc.de/en/2025/01/16/easterhegg-2025-call-for-participation"]
title = "Easterhegg 2025: Call for Participation - CCC Event Blog"
description = """
tl;dr Easterhegg 2025: CfP is here
Easterhegg 2025 will take place from 18 April to 21 April 2025 in Hamburg. Once again, there will be four days of workshops, talks and other events. This time, everything revolves around the motto “Unhandled Eggception” – and we are looking forward to your creative, technical and extraordinary interpretations of it. The Call for Participation is therefore open and will accept your submissions until (and including) 1 March 2025.
Easterhegg is a friendly community event where we can get to know each other and brainstorm new ideas together. It is the perfect opportunity to present your topic to an interested and colorful audience in an informal atmosphere or to plan entirely new projects together."""
full_description = "Easterhegg 2025: Call for Participation 16 January 2025 EN DE tl;dr Easterhegg 2025: CfP is here Easterhegg 2025 will take place from 18 April to 21 April 2025 in Hamburg. Once again, there will be four days of workshops, talks and other events. This time, everything revolves around the motto “Unhandled Eggception” – and we are looking forward to your creative, technical and extraordinary interpretations of it. The Call for Participation is therefore open and will accept your submissions until (and including) 1 March 2025. Easterhegg is a friendly community event where we can get to know each other and brainstorm new ideas together. It is the perfect opportunity to present your topic to an interested and colorful audience in an informal atmosphere or to plan entirely new projects together. We are looking forward to receiving your submissions for lectures, workshops or art projects. The submission should include a meaningful title and an informative short description. If your workshop only works with a limited number of participants or if you need specific equipment, please let us know: https://cfp.eh22.easterhegg.eu/eh22/cfp Additionally, there will be rooms available for self-organized sessions, which you will be able to submit via the wiki at a later time. Further information about the event will be published on our website shortly and if you have more questions, feel free to ask them at orga@eh22.easterhegg.eu. EH22 CfP Hamburg"
