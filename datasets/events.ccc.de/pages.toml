["http://events.ccc.de/congress/2006/Feedback"]
title = "Feedback - 23C3 Public Wiki"
full_description = '''Feedback From 23C3 Public Wiki Jump to: navigation, search Did you like the 23C3? Do you want to tell us something? Do you have any recommendations for improvements for 24C3? This is the place to write them down. If possible sort your notes under a heading or start a new one. Please sign your notes. (There is also a feedback telephonenumber, provided by the POC and administered by the CongressRadio, which can be called at 01801 585 585 8379 (outside of Germany please use 0049 1801 585 585 8379 instead. It is a sipgate-telephonenumber and can of course be called from sipgate at: 585 8379. If you are using web.de Freephone or freenet iPhone or Iptel please call: 01801 585 585 8379. If you are using FreeWorldDialup or callUK or Gossiptel or Gradwell please call: **777 585 8379. If you are using Sipphone please call: 1777 585 8379 and if you are using Telio please call: 000777 585 8379. The CongressRadio editors will look after your messages and produce a CongressRadio PhoneCast with your feedback. Thanks.) Contents 1 General Notes 1.1 Wristbands 1.2 Sponsoring 2 Athmosphere 2.1 Art & Beauty 2.2 Hackcenter 2.3 Nightcinema 3 Conference 3.1 General behaviour of the audience 3.2 Questions during/after talk 3.3 TV B Gone 3.4 Language of talks 3.5 Talks... 3.6 Workshops 3.7 Topics 3.8 Streams/DVB-T 4 Power 5 Network 6 Telephony 7 Catering 8 Fnords 9 Cameras if (window.showTocToggle) { var tocShowText = "show"; var tocHideText = "hide"; showTocToggle(); } [edit]General Notes The 23C3 T-Shirts and Sweatshirts were sold out before I could get one. Cato 00:53, 2 January 2007 (CET) And they were too big for me, even S. It would be nice if there could be a few XS or girlie sizes next year.--Beate 01:07, 2 January 2007 (CET) I actually had some trouble reaching the Hacker Ethics hotline... but this may be a timing issue as everybody was asleep by that time. But I tried a few times during the day and nobody picked up the phone, too. What about some kind of time schedule for the hotline? yorn I could not reach the hotline too, so i did what my heart told me :) --weed Was there an external abuse hotline this year? I could not find anything about it in the public wiki... --volty 10:35, 4 January 2007 (CET) One kind of a stickers was available for free as I checked in (26.12). Inddeed there were other/dedicated notebook stickers available. I wait for the Proccedings as PDF File When will they publisht.(AVIGO) Many of the lectures I attended were overcrowded. Every seat had been taken, people were standing at the walls and there were still people trying to get into the room. I think the bcc was filled to the limit this time, if even more people attend next time this could cause serious frustration. --Kurt 22:07, 3 January 2007 (CET) It sure felt like a f*cking lot of people. Do we have some official visitor's numbers? Is the bcc the largest congress center (or whatever kind of public building) in the city? -- g3nie 23:53, 3 January 2007 (CET) 4200 visitors was mentioned. -- Ra 15:03, 4 January 2007 (CET) My girlfriend didnt attend to the 23c3 because it wasnt worth 80€ to her - 50€ would have been ok. Maybe the entry fee could be reduced next time for women (would this also increase the number of female participants?). I´m not sure wether this is the right way - your opinions? -- Ra 15:03, 4 January 2007 (CET) Interesting point. Let's face it, we DO have a problem with diversity / equality: if it remains as it is today, we will continue to have a VERY unbalanced gender mix, but if we try to create a better balance by encouraging the underrepresented gender by a lower entrance fee, we will favor a specific gender. It is a deadlock, meaning a compromize is needed. As I am sure that there are a lot of women out there who are "in theory interested" but for whom 80 EUR are simply too much to "give it a try" and buy a pig in a poke (katze im sack). Obviously this also applies to some men, but as women are underrepresented, I think lower entrance fee for them is justifiable for the purpose of fostering diversity. Some of them will only come once, but at least those who were still undecisive but who do like it, will come again and spread the word. In the end, the CCC will benefit from it. --volty 14:20, 7 January 2007 (CET) I have to agree that 80 euros were very hefty, especially when almost anybody else I asked got in for 35 euros, either with ALG2 or with a false pupils ID. For doing nothing, or creating fake ID's the people get in for less than the half of what I paid.(Or even less since I paid even more to also start a new membership.) That's just lame and also the most propable reason why I'm not coming next year. Chip273 10:55, 5 January 2007 (CET) The air was really dry. Altough drinking 3-4 bottles (~6Liters) of water a day I still had sore lips. Maybe set the air conditioning not so dry next time. Chip273 10:58, 5 January 2007 (CET) [edit]Wristbands I did not like this years Badges so much. They scratched and rubbed the skin. Except for it they aren't suitable as Souvenier and memory so well. The Badges of last year were better I found. wonderer See Wristbands. I'd love to see that changed next year. I approve this. And I would really love some nice stickers for my notebook as well. --Swoon 20:04, 2 January 2007 (CET) I approve of getting rid of the wristbands too, however if they absolutely have to be used, please use devices designed for this purpose, such as those used at the last Camp or at WTH. They were nowhere near as irritating as the scratchy things used here. --RiscTaker 19:12, 3 January 2007 (CET) +1 The wirstband was terrible. It itched. Pleace have some decent badges next year. --Vm73 15:17, 4 January 2007 (CET) Can't confirm that. The wirstband feels quite smooth, i haven't washed my left hand since the end of 23c3 :-) Couldn't sleep with that damned wristband, had to cut it away, was too annoying for my nightly silence. Chip273 06:10, 6 January 2007 (CET) I didn't have any problems with the wristband, because I let it a bit loose, so I could take it of before going to bed. Maybe this wasn't intended to be like this, but hey, maybe it was my own reallife hack ;) But I'd really like some free handout stuff when buying the 'ticket'. Last year we got an indymedia paper and also a Datenschleuder. -- Andi 19:12, 3 January 2007 (CET) i liked the wristband, typical festival-quality and better than the whatthehack-plastic! but yes, the keychains from the years before were cooler, since they still have a practical use and are a nice souvenier. [edit]Sponsoring Get yourself a sponsoring and cut down the entrance fee. I don't know what happened with google, but I guess you just demanded too much, else I guess they would have paid it. Get a Seperate Sponsoring for each "saal" i.ex. .. So you do not get too dependand on one of them. Every 10 people LAN party gets sponsors, so why not this 4000 people congress ? There was already a lot of sponsoring. But have you seen what you get at a "decent" lanparty? Shirts half filled with spam from companies you don't want to know, big billboards with spam and a couple of banners on the website. Do you want that? BugBlue 15:25, 7 January 2007 (CET) [edit]Athmosphere [edit]Art & Beauty I would appreciate if sometimes someone would clean up the hackertables in Art & Beauty-Lounge. Mostly they looked like a garbage dump, and it got worse the 4 days (see http://de.wikipedia.org/wiki/Broken-windows-Theorie). Besides the Congress was great!--Beate 15:32, 31 December 2006 (CET) Also Art & Beauty: There where too few couches without any electricity for notebooks. I think this was intended by creating the wooden tables, but they wheren't very comfortable to sit a few hours.--Beate 21:28, 1 January 2007 (CET) The lounge was a MAJOR improvement to the last years. It had much more space and so it was easy to find a place where you could camp for some time. True is that they were not the comfortablest thing you could imagine, but it is much more important that you can find a place to sit down. They should definitly make a comeback next (this:) year. cekayy The lounge was great, although I often encountered it to be full, so maybe some more space would be great, or some more relaxable spaces in the ring areas. Webmind 16:47, 3 January 2007 (CET) [edit] Hackcenter It was - for my taste - a bit too dark in the hackcenter. I mean, darkness is great and everything, but not 24/7. That's just bad for our eyes and general feeling... Also, cleaning up between each day would be very cool, but not so easy to realize I guess. Oh, and there were some probably danish people who seemed to be there only for drinking and smoking weed. I don't know how to prevent this in the future, but why did these people even got reserved space in the hackcenter?! SECuRE 18:14, 1 January 2007 (CET) I agree, especially since it was right in front of the phenoelit lounge, which looked like a better place for this ... I also found it a bit dark, but the ambient light was really nice this year- maybe turn down the lights later in the evening? --J4n 19:24, 3 January 2007 (CET) Some sort of compression is needed for the hackcenter (like two person per chair?), so more places are available there. --Zwansch 10:43, 2 January 2007 (CET) The dark colored light @hc was absolutely perfect, really good ambient conditions. We loved it - Thank you. No stress with tables so far, but i would prefer more chairs (i found mine up in C4). --weed The hack center was too dark. Being there too long hurt my eyes. To much weed smoke hanging around. --vm73 Way too much light in the hackcenter and not enough ashtrays · Next year an alcoholic bar in the hackcenter would be a good idea · Preventing the danish vikings is impossible! Why do you think they had a reserved table? · Besides.. I thought the danish people were very friendly and forthcoming · TEAMBIFI :) [edit] Nightcinema I haven't seen any advertising on the night cinema. Was there any? [edit]Conference Anything from time schedule to presentation language. Feedback to each talk can be given by clicking at the green link at its page in the Fahrplan. [edit]General behaviour of the audience Seems like people liked getting into rooms during lectures, this is just disturbing for the listeners. Would be nice if you could be there when the lecture starts in future if you're interested in the talks or if you'd stay outside if you're not. Thanks. SECuRE 18:16, 1 January 2007 (CET) /me thinks the same. --Beate 21:24, 1 January 2007 (CET) /me, too. These bunches of people always attending late and (of course) wanting to take a seat on the opposite site of the room were annoying! --Leralle 21:42, 1 January 2007 (CET) Get used to it. Bureaucracy for regulating who can enter and who not is even more disturbing. --Zwansch 10:03, 2 January 2007 (CET) Well, it was just a wish to all listeners. Not the request for a "bureaucratic" regulation, I know that this would not work out. SECuRE 20:20, 2 January 2007 (CET) I have to admit that I also am one of those who entered the lectures when they were already in progress; there were just so many interesting things happening, that I wished I could everywhere at once, as that is not possible, though, I had to enter or leave some ongoing lectures. Of course, I tried to be quiet and such; te only patch for that kind of problem I can think of right now would be finding a building with more space. More ideas? --g3nie 23:53, 3 January 2007 (CET) /me, too. And I think that one of the reasons for people constantly popping in and out was that we there were no TVs in front of the lecture halls that showed what was going on inside. In fact, there were WAAAAAY too few TVs for people to gather in front of and follow lectures! Last year, there were a couple of areas with 5 TVs, one for each lecture hall and one with CTV, plus IIRC at least one TV in front of each lecture hall. Please provide more TVs next year. --volty 10:32, 4 January 2007 (CET) The Fahrplan this year was much better than last year. There was enough time to move to the next venue. Please keep it that way next time. The "Inside VMware" was in Saal 2 which was heavily overcrowded. And Saal 1 was almost empty during that time. Please place interesting speaches in Saal 1. --Vm73 14:57, 4 January 2007 (CET) Mate bottles falling down once a minute during the lectures was really disturbing. Seems like ppl can't hold still their legs even for a minute. Never heard something like this at other conferences/events. -- Matsch 12:48, 13 January 2007 (CET) [edit]Questions during/after talk I found it quite irritating that questioners in the smaller rooms didnt stand up when asking their questions. That wasnt so much of a problem in Saal 1 with the fixed location of the mics. But in all other rooms the mics were passed around. More than once the speaker wasnt able to adress the questioner directly because he didnt know the location of the questioner. Not that much of a problem but (IMHO) quite irritating.--Andyz 13:13, 3 January 2007 (CET) I'll hope that next year every speaker tells the audience that they have to stand up if they have a question and get to the static microphones, as we had 2 of them in every lecture room. The real problem is: The most guys who have a question are to lazy to go to a microphone. And the audioangels have the choice to pass the mic around or the question will not be recorded. And i think most of them will choose number 1, not the best, but the right decision. (Bad english. If somebody want's to correct this: have fun. ;) ) --Helmut 17:28, 3 January 2007 (CET) Your English is not bad, mate. There were multiple problems. a) lecture halls were sometimes too overcrowded so audio angels could not even reach the people who had question - a maximum attendee limitation should be enforced next year to prevent overcrowded rooms; b) heralds should note in their announcements that it is a matter of respect to raise hand and wait for microphone before asking a question; c) in the smaller halls the audio angels could have been more attentive as to who has a question and then hand them the microphones - maybe stand in front and look at the audience to detect if someone has a question in time; d) audio angels should not take the microphones away again immediately because there may be a followup question; e) the audio angels can forceask the questioner to stand up. --volty 10:49, 4 January 2007 (CET) I had an "official order" to give the microphone not away. Everybody who has a question had to stand up and get to the static mic. So just cancel a to e. ;) --Helmut 22:40, 4 January 2007 (CET) I know, Helmut, and I disagree with that "order" :) For Saal 1, yes, it was possible, but for the others it was simply not appropriate. This is certainly something we need to discuss for next year. In a completely overcrowded room, people also cannot get to the mikes and ask their questions there :) IMHO it should be made as convenient as po'''
