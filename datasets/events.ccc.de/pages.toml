["https://events.ccc.de/category/33c3"]
title = "33C3: Works For Me (2016) - CCC Event Blog"
full_description = "Das zehnte Türchen der #35C3 Memory Lane: Portable Power! 10. Dezember 2018 DE Das zehnte Türchen. Wem die elliptischen Kurven von gestern nicht kompliziert genug waren: Hier haben wir die nächste Eskalationsstufe in der nach oben offenen Nerd-Skala. Es geht um Game Boys von Nintendo. Das allgegenwärtige Spielgerät der 1990er-Jahre, das 1991 schon als „Elektronik-Droge“ betitelt wurde, erfreut sich auch heute noch einer treuen Anhängerschar, nicht zuletzt wegen des schmissigen Slogans: „Now … Weiterlesen … Das achte Türchen der #35C3 Memory Lane: Tief durchatmen! 8. Dezember 2018 DE Das achte Türchen. Kreativität wird auf dem Chaos Communication Congress in vielen Formen, auch manchmal leicht abseitigen, gefeiert. Im Jahr 2015 wurde bekannt, dass ein deutscher Autobauer sich von dieser Kreativität ein Scheibchen abgeschnitten und mit technischen Kniffen im großen Stil Abgasgrenzwerte überschritten hatte. Über diesen Abgasbetrug berichteten erstmals auf dem 32C3 Daniel Lange und Felix Domke. Doch … Weiterlesen … 33C3: works for all 25. Dezember 2017 DE Der Dokumentarfilmer Mark Zorko hat beim 33C3 eine kleine Kurz-Doku aufgenommen. Sie trägt den Titel “works for all” und wird nun pünktlich zu Tag 0 des 34C3 veröffentlicht, um unser aller Vorfreude ins unermessliche zu steigern. Viel Spaß :-) Hier gibt es den 1GB-Download von media.ccc.de und hier auch eine Youtube-Version in geminderter Qualität. Film über den geheimen Drohnenkrieg: National Bird 20. Mai 2017 DE Diese Woche läuft in Deutschland der Dokumentarfilm National Bird über den Drohnenkrieg und Whistleblower an. Auf dem 33C3 gab es in Anwesenheit der Regisseurin Sonia Kennebeck und Cian Westmoreland schon eine Sondervorstellung. Wer die verpasst hat, kann den Film nun im Kino sehen. Filmplakat National Bird. Kennebeck richtet ihre Kamera auf die Menschen, die nicht mehr schweigen wollen über den geheimen Drohnenkrieg der Vereinigten Staaten, auch wenn sie als Bild-Analysten oder als … Weiterlesen …"
year_published = 2018
