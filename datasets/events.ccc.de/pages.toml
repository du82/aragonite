["https://events.ccc.de/fr/about"]
title = "À propos du blog CCC Event - CCC Event Blog"
description = """
Vous êtes sur le blog des événements CCC. Ce blog est maintenu par les membres et les amis du Chaos Computer Club.
Ce blog a pour vocation de transmettre des informations à propos des conférences et événements du CCC. Le Chaos Communication Congress étant notre événement le plus important, il est le plus représenté ici, mais ce blog couvre aussi l’information sur d’autres événements du CCC - régionaux tout comme internationaux. Nous accueillons les contributions telles que les présentation des groupes et équipes, ainsi que les annonces d’activités pendant un évenement à venir, les annonces informatives, les appels à contributions, etc."""
full_description = "À propos du blog CCC Event FR EN DE Vous êtes sur le blog des événements CCC. Ce blog est maintenu par les membres et les amis du Chaos Computer Club. Ce blog a pour vocation de transmettre des informations à propos des conférences et événements du CCC. Le Chaos Communication Congress étant notre événement le plus important, il est le plus représenté ici, mais ce blog couvre aussi l’information sur d’autres événements du CCC - régionaux tout comme internationaux. Nous accueillons les contributions telles que les présentation des groupes et équipes, ainsi que les annonces d’activités pendant un évenement à venir, les annonces informatives, les appels à contributions, etc. pour tous les événements du Chaos. Ceci n’est pas limité aux seuls événements du CCC e.V. ou des Erfa/Chaostreff. Contactez-nous pour faire publier vos posts ! Pour le congrès et les camps, ce blog est généralement accompagné d’un wiki spécifique à chaque édition de l’événement. Ce wiki est le lieu de collaboration premier pour nous et pour les participants et visiteurs. Contact Pour toutes vos questions ou remarques sur ce blog, vous pouvez nous joindre à blog@events.ccc.de. N’hésitez pas à nous contacter pour la communication de votre événement. Vous pouvez consulter la page Contributing pour plus d’informations sur le formattage de votre post."
