["https://events.vtools.ieee.org/api/doc"]
title = "Events API : vTools Events | vTools IEEE"
description = """
IEEE vTools Events is used for managing IEEE conferences and meetings. 
Events are showcased in IEEE Collabratec™ and can be promoted on websites and eNotices."""
full_description = '''The Events API is a set of RESTful web services to allow programmatic interaction with the Events application. It is being developed based on the standard defined by {json:api}, but not strictly nor fully at this point. The Events API is namespaced by version, to allow evolution while maintaining backwards compatibility. The current version is v5. Response HTTP status codes are still being worked out, and should be considered somewhat volatile. However, to enable client certainty and development, the following assumptions should be true: Recommended format for all date/time parameters is ISO 8601, in UTC time zone (i.e. "2017-11-04T17:43:44,3456Z"). By default, Events API calls default to a limit of 500 results. Clients can apply a different limit with the 'limit' parameter. An API call that returns a collection may implement the 'span' parameter to restrict results to only those records that fall within the date/time-span defined in the parameter value. For API calls that return collections, the 'delta' parameter can be used to restrict results to only those records that have been created or updated since the date/time specified in the parameter value. Sorting can be specified for API calls that return collections by specifying the attribute(s) to sort by, comma (',') separated. Descending sort can be indicated by prefixing the attribute with the minus ('-') character.'''
author = "IEEE.vTools"
year_published = 2025
clearnet = "https://events.vtools.ieee.org/api/doc"
