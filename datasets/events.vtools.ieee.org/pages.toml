["https://events.vtools.ieee.org/contact"]
title = "Contact Staff : vTools Events | vTools IEEE"
description = """
IEEE vTools Events is used for managing IEEE conferences and meetings. 
Events are showcased in IEEE Collabratec™ and can be promoted on websites and eNotices."""
full_description = "You can send us a message up to 1000 characters long. Please note that our normal business hours are Monday - Friday, 8:30 AM - 5:00 PM Eastern Standard Time excluding holidays. Please provide your name, e-mail address, IEEE member number (optional), organizational unit (optional), and the message. If you are reporting an error message, please include the error that you are getting along with screen shots if possible. To indicate organizational unit, you can type, search or browse to find one; click in the Organizational Unit field for more info."
author = "IEEE.vTools"
