["https://events.vtools.ieee.org/m/463289"]
title = "Microchip Frequency and Time Systems for Telecom and Power Industries : vTools Events | vTools IEEE"
description = """
IEEE vTools Events is used for managing IEEE conferences and meetings. 
Events are showcased in IEEE Collabratec™ and can be promoted on websites and eNotices."""
full_description = "The IEEE Alabama Section eagerly anticipates an illuminating joint presentation by David Chandler and Bryan Owings on Microchip Frequency and Time Systems for Telecom and Power Industries. Time and Frequency are critical commodities for the telecommunications and power industries. From the spectral purity of a signal to synchronization across a network, the clocks and distribution systems provided by Microchip ensure seamless data and voice signals across the globe. In the power industry, the green energy revolution has led to new precision timing demands on the grid as renewable power sources contribute noncontinuous sources of power generation. In this presentation we will discuss both industries’ demands on time and frequency, and the innovative solutions provided by Microchip to meet the requirements. Technical Reference article: IEEE Spectrum Organization monthly magazine November 2024: Squeezing an Optical Atomic Clock into a Briefcase This article should spur us on to read our monthly technical publication each month and broaden our knowledge. PLEASE register for this event to help have a list of participants to mark present and email PDH forms. Continue requesting PDHs to ensure you receive your PDH. IEEE wishes to thank John Fischer Coop, UAB student and works for SCS as intern, for assisting roy brown to enter this eNotice program. IEEE and SCS are proud sponsors of the USA college COOP program!!!! EAGA educating America to be great again! David Chandler is located in the Microchip Mount Holley Springs, PA facility. He (Dave) manages the Microchip Atomic Clock product line, including the Hydrogen Maser manufactured in the Microchip Tuscaloosa, AL facility, Bryan Owings Design Engineer for the Hydrogen Maser. David Chandler received a BS in Applied Engineering Physics from Cornell University, and an MEng inElectrical Engineering from Pennsylvania State University Capital Campus. After serving in the US Army,David joined McCoy Electronics in 1996, which through various acquisitions is now part of MicrochipTechnology. During his tenure he has worked as an engineer and product line manager for variousfrequency controls products. He is currently a senior product line manager for atomic system clocks,including cesium standards and hydrogen masers, in the Frequency and Time Systems business unit."
