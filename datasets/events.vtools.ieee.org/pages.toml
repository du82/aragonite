Events are showcased in IEEE Collabratec™ and can be promoted on websites and eNotices."""
full_description = "The Madison Chapter of IAS and PES is back in the air! Please join us as Dr. Dheeraj Bobba electrifies our flight. Abstract: Aircraft electrification represents a prominent advancement in the aviation industry which is aiming to improve energy efficiency and minimize carbon footprint. Electric motors have a crucial role in the electric propulsion system to enable such transformation. This discussion will focus on exploring current trends, design considerations, performance needs and modeling methods of electric motors used in aircraft electrification. Dheeraj Bobba obtained his PhD in Electrical Engineering from UW Madison in 2021. He obtained his Masters’ degree from UNC Charlotte, and his Bachelors’ from Jawaharlal Nehru Technological University in India. He is currently Principal EM Engineer for Powersys, Inc. His duties there include guiding strategic engineering goals for Powersys within North America and EU regions as well as leading academic partnerships relations in North America. Before pursuing his advanced degrees, he worked for Infosys Technologies Limited. He has been an Invited Speaker at multiple conferences, and has received awards for “best paper”. Pizza will be served before the 6:00 pm talk. Please register using the link in this email, so that we know how much pizza to buy."
