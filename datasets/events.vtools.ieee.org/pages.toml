full_description = "Caroline will share her career story and compare and contrast the differences between working on an in-house cybersecurity team, at a cybersecurity product company, and at a cybersecurity services company. She will also provide her perspective on the current industry situation and job market. Caroline will share her career story and compare and contrast the differences between working on an in-house cybersecurity team, at a cybersecurity product company, and at a cybersecurity services company. She will also provide her perspective on the current industry situation and job market. Caroline Wong is the Director of Cybersecurity at Teradata, with two decades of experience in GRC, product security, and cybersecurity leadership. A recognized expert, she is the bestselling author of Security Metrics: A Beginner’s Guide, inducted into the Cybersecurity Canon Hall of Fame. She has held leadership roles at eBay, Zynga, Symantec, and Cobalt, driving security innovation and risk management strategies. Caroline is also a LinkedIn Learning instructor, educating professionals on cybersecurity best practices and resilience in an evolving threat landscape."
