["https://events.vtools.ieee.org/m/466177"]
title = "Curso “Introducción A LINUX” : vTools Events | vTools IEEE"
description = """
IEEE vTools Events is used for managing IEEE conferences and meetings. 
Events are showcased in IEEE Collabratec™ and can be promoted on websites and eNotices."""
full_description = 'El curso "Introducción a LINUX" está diseñado para proporcionar a los participantes los conocimientos básicos sobre el sistema operativo Linux, su estructura y su funcionamiento. A lo largo de tres semanas, se abordarán conceptos esenciales como la instalación, la gestión de archivos y directorios, los permisos de usuario, el uso de la terminal y comandos fundamentales. En la introducción del curso, los participantes conocerán la historia y evolución de Linux, sus principales distribuciones y las ventajas de su uso en comparación con otros sistemas operativos. También se dará una visión general de la interfaz de línea de comandos (CLI) y su importancia en la administración del sistema. Este curso está dirigido a principiantes interesados en aprender a utilizar Linux de manera efectiva, ya sea para desarrollo, administración de sistemas o simplemente para mejorar sus habilidades en entornos de código abierto. Los días y horarios específicos del curso aún están por definirse.'
