full_description = "Everest Base Camp Trek from Salleri Everest Base Camp Highlights of Everest Base Camp Trek From Salleri Travel Style: Active Physical Rating: Strenuous Service Level: Basic Group Size: 1+ Max. Altitude: 5545 m Meals: Breakfast/lunch/Dinner Everest Base Camp Trek from Salleri is an extended version of the basic Everest Base Camp Trek. In this trek, instead of tourists flying straight to Lukla from Kathmandu, they need to take a drive from Kathmandu to Salleri, and from there itself, Salleri to Lukla trek, Salleri to Namche trek, up to the Everest Base Camp starts. The path joins the classic Everest Base Camp Trek route at Phakding. Apart from the regular attractions that the trekkers experience at the Everest Base Camp Trek, here they come across numerous others villages, numerous locations and people, which makes the journey further wonderful. Details Of Everest Base Camp Trek From Salleri Jeep from Kathmandu to SalleriThe journey starts when the tourists go on a drive from Kathmandu to Salleri. The distance between Salleri to Kathmandu is around 266 km, which makes a drive of roughly 8 hours. The trekkers can rest on the way, as it is an overnight drive.Normally, the drive route from Kathmandu to Salleri is a scenic one, which so many green hills and rivers flowing at their bottom. It amazing to see how the sun shines throughout the day on these hills, and sets between them at dusk. The tourists are sure to get mesmerized with such views.Everest Base Camp TrekBy walking on a trek starting from Salleri, the trekker comes across various settlements that they couldn’t have accessed otherwise. Few of such villages include Surkhe, Bhupsa Danda, Nunthala, and Ringmo. On the way, the trekkers would also come across numerous other localities.Each of these places is sure to excite them as they’re nestled in the hills. They’re all very beautiful and offer amazing sceneries to the tourists.After the route joins Phakding, the rest of the journey is almost the same. However, while returning from Kala Patthar, the path leads trekkers to the villages of Pangboche and Kyanjinma.It is a slight diversion from the classic route, but only up to Namche Bazaar. This is where everything goes back, as the tourists need to head to Lukla, to catch their flight back to Kathmandu.Throughout the trek, the tourists get to spend significant amounts of time acclimatizing, in various settlements. During these moments, they could either go for day trips to neighboring villages or simply get to know about the locals and their lifestyle.So, if you can make it through the few extra days of trekking, and if you want to try something different than the regular Everest Base Camp trekking route, this is the trek for you. We may also try the next trekking route through Gokyo and Cho-la pass route. Going on a trek on this route is like killing two birds with one arrow. A totally different trek, but with the essence of Everest Base Camp, what more would a trekker want! Everest Base Camp Trek From Salleri Itinerary The following is the itinerary for Everest Base Camp Trek From Salleri. Depending on the comfort and interest of the trekker, modifications could be made to the package, i.e. destination could be added or removed, without compromising with the quality of the journey.Day 1 – Arrival in Kathmandu (1400 m)Day 2 – Kathmandu (1400 m) to Salleri (1800 m)Day 3 – Salleri to Ringmo (2570 m)Day 4 – Ringmo to Nunthala (2190 m)Day 5 – Nunthala to Bupsa Danda (2250 m)Day 6 – Bupsa Danda to Surkhe (2295 m)Day 7 – Surkhe to Phakding (2610 m)Day 8 – Phakding to Namche Bazaar (3440 m)Day 9 – Rest Day at Namche BazaarDay 10 – Namche Bazaar to Tengboche (3867 m)Day 11 – Tengboche to Dingboche (4410 m)Day 12 – Dingboche to Lobuche (4940 m)Day 13 – Lobuche to Gorakshep (5164 m) to Everest Base Camp (5364 m) to GorakshepDay 14 – Gorakshep to Kala Patthar (5545 m) to Pheriche/Pangboche (3900 m)Day 15 – Pheriche/Pangboche to Namche (3245 m)Day 16 – Namche to Lukla (2860 m)Day 17 – Lukla to KathmanduDay 18 – Departure Inclusion √ Airport pick up and drop by private vehicles√ Hotel stay in Kathmandu (2 nights)√ Kathmandu- Salleri by Jeep√ Lukla-Kathmandu Airfare√ Government license holder and the experienced Himalayas guide√ Porter to carry your baggage (1 porter= 2 hikers )√ Kathmandu-Lulka-Kathmandu guide Airfare√ Full board meals during trekking period as mentioned in the itinerary√ Basic tea house and lodge accommodation during trekking√ All government and local taxes√ TIMS (Trekker’s Information Management System) and Permit for Restricted Area√ Basic First Aid Kit√ All company service charges and necessary paperwork√ Rescue arrangement Exclusion × Lunch and Dinner in Kathmandu× Travel insurance for trekking× Nepal entry visa and excess baggage charge× Tips for Guide and porter (20% of your total spent is normally expect as a tip by a guide and porter )× Wifi, shower, camera and mobile charging cost× Basic drinks (mineral water, Beer, cane juice, and Hot water )× Personal shopping× Things not mentioned in Cost includes a section Complimentary √ Company T-shirt√ Trekking map√ Certificate of success√ Typical Farewell Dinner with Live Cultural Show Frequently Asked Question about Everest Base Camp Trek From Salleri Why Join Trek With Us? We are local experts. We have a well-designed package and our field staff is very professional. We have a 100% success rate Even you are a solo hiker. We have designed local food which prevents you from high altitude sickness. Once give us a chance then we will never let you down. We assure you that you can fully trust us and you get the things what you have paid for. How to book or confirm a trip?It is very easy to book the trip with us. At first, we need your Passport photocopy to book everything here for you. And once we got 20% of the total cost in advance through bank or Money transfer then we will confirm your trip with us. A flight detail is optional but you have to provide before 1 week of arrival to pick up.What kind of food we get during trek?You can get all kind of food. You have different choices but personally, I would like to say to eat that local food or our designated food because it prevents you from high altitude sickness.Do we get high altitudes sickness? And what happens if we got altitude sickest?It is hard to say that you will have altitude sickness or not because everyone’s body reacts to the altitude differently. In general, most of the trekkers have suffered from normal altitude problem during trek but if anyone highly suppers from altitude problem we manage Helicopter rescue. So be sure before starts trek that your insurance cover Helicopter rescue as well. Otherwise, you have to pay extra for a Helicopter rescue.How Difficult Everest Base Camp Trek From Salleri is?Mainly you have to be fit physically and mentally for this trek. I have mentioned below about physical conditions. Normally you have to walk 4-6 hrs per day so you have to prepare your body and mind that you can walk 4-6 hrs per days. Besides this, you have to care what kind of guide and which company you are following because your guide is a doctor in Mountain and company is a hospital.What are the physical conditions? Do we need to be supper fit for Everest Base Camp Trek From Salleri?In my experience, I would like to say you need to have an average level of fitness, but no means need to be an athlete. It is a completely different world being that high up and everyone’s body reacts to the altitude differently. Good training before you go.How about flight? The flight in and out of Lukla is scary?Yes! The Lukla airport is one of the dangerous airports in the world. The runway is tiny and built on a slope with a mountain at one end and a huge drop into a valley at the other..,Do we get phone Signal?Yes! You can buy a SIM card (Ncell) in Kathmandu before starts trek but the 3G only really works the first and last couples of days of the trek. But you know you could buy wi-fi cards at tea houses which cost 3-6$ for 200mb and the signal is medium.What are very critical and important trekking equipment list for Everest Base Camp trek From Salleri? Well, below are the suggested trekking equipment list for Everest Base Camp trek From Salleri:Daypack (25–35 liters), Pack cover, Sleeping bag comfortable too – 20 °c (depending upon the season, weather forecast and personal preference) and it is possible to rent it from Kathmandu which cost 2$ per day.Waterproof (optional) hiking boots, Camp shoes (down booties or running shoes) LED headlamp with extra battery, trekking poles. Camelback water bladder or sipper (water bottle).Chocolates, Energy bar, Dry fruits, ORS. Down jacket cover comfortable too -15 • c which you can hire or buy in Kathmandu and cost will be cheap for you to compare your country and another normal jacket. T-shirt, goggles (UV protected) and 5 pair thermal pants and cap for sun cover, Waterproof gloves, woolen gloves, and socks. Sunscreen, moisturizer, lip balm and sanitizer handy. What is the best time for Everest Base Camp trek From Sallri? Normally we operate this, Everest Base Camp Trek From Sallari, trek all around a year but Sept-Nov and Feb-May is a best suggested time for Everest base camp trek."
