ous airports in the world. The runway is tiny and built on a slope with a mountain at one end and a huge drop into a valley at the other.., Do we get phone Signal? Yes! You can buy a SIM card (Ncell) in Kathmandu before starts trek but the 3G only really works the first and last couples of days of the trek. But you know you could buy wi-fi cards at tea houses which cost 3-6$ for 200mb and the signal is medium. What is the best time for Ama Dablam Expedition? Normally we operate this, Ama Dablam Expediton, trip in Sept-Nov."
