 during trek? You can get all kind of food. You have different choices but personally, I would like to say to eat that local food or our designated food because it prevents you from high altitude sickness. Do we get high altitudes sickness? And what happens if we got altitude sickest? It is hard to say that you will have altitude sickness or not because everyone’s body reacts to the altitude differently. In general, most of the trekkers have suffered from normal altitude problem during trek but if anyone highly suppers from altitude problem we manage Helicopter rescue. So be sure before starts trek that your insurance cover Helicopter rescue as well. Otherwise, you have to pay extra for a Helicopter rescue. How Difficult Everest Base Camp Trek From Tibet is? Mainly you have to be fit physically and mentally for this trek. I have mentioned below about physical conditions. Normally you have to walk 4-6 hrs per day so you have to prepare your body and mind that you can walk 4-6 hrs per days. Besides this, you have to care what kind of guide and which company you are following because your guide is a doctor in Mountain and company is a hospital. What are the physical conditions? Do we need to be supper fit for Everest Base Camp Trek From Tibet? In my experience, I would like to say you need to have an average level of fitness, but no means need to be an athlete. It is a completely different world being that high up and everyone’s body reacts to the altitude differently. Good training before you go."
