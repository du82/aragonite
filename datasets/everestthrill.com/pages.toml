ies available in the hills. The history and culture of these places will definitely interest you. And also don’t forget the amazing views of mountains like Mt. Everest, Mt. Nuptse, Mt Ama Dablam, Mt. Cho Oyu, Mt. Pumori and so on that are going to welcome at you every settlement and pit-stop. All these factors make this high passes Trek a must visit trek, and a must have experience. Everest Three Pass Trek Itinerary The following is the itinerary for Everest Three High Passes Trek. Apart from the major settlements in the Gokyo region, it covers the Gokyo Lake Complex, and a climb on Gokyo Ri. Depending on the comfort and interest of the trekker, modifications could be made to the package, i.e. destination could be added or removed, without compromising with the quality of the journey.Day 1 – Arrival in Kathmandu (1400 m)Day 2 – Kathmandu (1400 m) to Lukla (2860 m) to Phakding (2610 m)Day 3 – Phakding to Namche Bazaar (3440 m)Day 4 – Rest Day at Namche BazaarDay 5 – Namche Bazaar to Tengboche (3867 m)Day 6 – Tengboche to Dingboche (4410 m)Day 7 – Rest Day at DingbocheDay 8 – Dingboche to Chhukung (4750 m)Day 9 – Chhukung to Kongma La Pass (5535 m) to Lobuche (4940 m)Day 10 – Lobuche to Gorakshep (5164 m) to Everest Base Camp (5364 m) to GorakshepDay 11 – Gorak Shep to Kala Patthar (5545 m) to LobucheDay 12 – Lobuche to Dzongla (4084 m)Day 13 – Dzongla to Cho La Pass (5368 m) to Gokyo (4800 m)Day 14 – Rest Day in GokyoDay 15 – Gokyo to Renjo La Pass (5360 m) to Marlung (4210 m)Day 16 – Marlung to Namche BazaarDay 17 – Namche Bazaar to LuklaDay 18 – Lukla to KathmanduDay 19 – Departure From Kathmandu Inclusion √ Airport pick up and drop by private vehicles√ Hotel stay in Kathmandu (2 nights)√ Kathmandu-Lukla-Kathmandu Airfare√ Government license holder and the experienced Himalayas guide√ Porter to carry your baggage (1 porter= 2 hikers )√ Kathmandu-Lulka-Kathmandu guide Airfare√ Full board meals during trekking period as mentioned in the itinerary√ Basis tea house and