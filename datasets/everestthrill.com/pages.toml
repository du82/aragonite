s and scenic landscapes that are sure to excite you. You’ll never feel like returning to the base by leaving these amazing locations. Also, please check the Classical Everest Base Camp Trek package being provided by us.Many people visit Sagarmatha National Park with a hope to reach the Everest Base Camp. Their objective is to have the up-close view of Mt. Everest and reach as nearest to the peak as possible. But in this madness, they totally forget about other amazing places that Khumbu region has to offer. One such place is Valley in the Gokyo, with all its beautiful settlements, lakes, peaks and so on.Few trekkers are smart enough to realize this, and so they quickly extend their trek to cover the valley in their trekking journey. They believe in making the most out of their journeys. So, the next time you’re out here, try and research about Gokyo Valley Trek. Visiting this place is a worthwhile thing to do! Gokyo Valley Trek Itinerary The following is the itinerary for Gokyo Valley Trek. Apart from the major settlements in the Gokyo region, it covers the Gokyo Lake Complex, and a climb on Gokyo Ri. Depending on the comfort and interest of the trekker, modifications could be made to the package, i.e. destination could be added or removed, without compromising with the quality of the journey.Day 1 – Arrival In KathmanduDay 2 – Kathmandu (1400 m) to Lukla (2860 m) to Phakding (2610 m)Day 3 – Phakding to Namche Bazaar (3440 m)Day 4 – Rest Day at Namche BazaarDay 5 – Namche Bazaar to Dole TrekDay 6 – Trek From Dole to MachhermoDay 7 – Trek From Machhermo to Gokyo LakeDay 8 – Explore Around Gokyo (4800 m)Day 9 – Gokyo to to Dole Trek (4120 m)Day 10 – Dole to Namche Bazaar TrekDay 11 – Namche Bazaar to LuklaTrekDay 12 – Flight From Lukla to KathmanduDay 13 – Departure From Kathmandu Inclusion √ Airport pick up and drop by private vehicles√ Hotel stay in Kathmandu (2 nights)√ Kathmandu-Lukla-Kathmandu Airfare√ Government license holder and the experienced Himalayas guide