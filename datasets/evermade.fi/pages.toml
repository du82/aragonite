["https://evermade.fi/fi/artikkeli/mafy-case-study"]
title = "Case Mafy - hakukoneoptimoinnilla räjähtävä nousu vierailuihin - Evermade"
description = "Mafyn kauppiksen valmennussivujen ja Ads-kampanjoiden optimointi johti huimaan kasvuun sivuston liikenteessä ja verkkokaupan tuottavuudessa."
full_description = "Case study: hakukone­optimoinnilla räjähtävä nousu vierailuihinMafylle tehtiin kauppakorkeakoulun sanastoon liittyvä hakusanatutkimus syksyllä 2021. Kartoituksen tulosten pohjalta optimoimme kauppakorkeakoulun valmennustuotteiden sivuja sekä Google Ads -kampanjoita. Nyt kuuden kuukauden jälkeen kurkistimme työn tuloksia ja voimme todeta, että optimointityön ROI on ollut huikea.Sonja Holopainen, 17.05.2022 Mafy tarjoaa sähköisiä oppimateriaaleja ja valmennuskursseja lääketieteisiin, kauppatieteisiin sekä teknisille aloille pyrkiville. Lisäksi se tarjoaa oppimateriaaleja lukiolaisille ylioppilaskokeisiin valmistautumiseen sekä opettajille kurssikäyttöön.Hakusanatutkimus loi pohjan strategiatyölleHakusanatutkimuksessa kartoitetaan, mitä hakusanoja kohderyhmät käyttävät ja millaista sisältöä he niillä etsivät. Mafyn kauppatieteellisen valmennuskurssin kohderyhmää ovat lukiolaiset ja lukiosta valmistuneet, alan vaihtajat sekä kauppiksen pääsykokeiden uusijat.Hakusanatutkimuksen jälkeen huomasimme tarpeen laajemmalle strategiatyölle ja sisältöjen optimoinnille. Uudistimme kauppiksen valmennuskurssiin liittyvät laskeutumissivut kokonaan aina sivujen rakenteesta ja url-hierarkioista itse tekstisisältöihin. Optimoimme sisällöt tietyille hakusanoille, jotta ne vastaisivat paremmin kohderyhmien haun tarpeeseen ja loimme kauppatieteiden valmennuskurssin sivulle eri hakusanoja tavoittelevia alasivuja. Alasivut ohjaavat käyttäjää tutustumaan tarkemmin valmennuskursseihin ja itseopiskelumateriaaleihin sekä navigoimaan Mafyn verkkokauppaan. Tällä varmistamme, että käyttäjä löytää taatusti hakemansa sisällön ja vastauksia kysymyksiinsä valmennuskursseihin ja itseopiskelumateriaaleihin liittyen.Sivujen optimoinnin jälkeen muokkasimme myös Google Adsin puolella kauppatieteiden kampanjaa jakamalla mainosryhmät ostopolun eri vaheisiin. Liikenne ohjattiin laskeutumissivuille, jotka vastaavat näitä käyttäjäpolun vaiheita. Kauppatieteen sivuilla tapahtui huimaa kasvuaMafyn sivustolle on kauppakorkeakoulusta kiinnostuneille luotu nyt useampi sivu: yleinen kauppiksen valmennusten esittely sekä alasivut, joilla avataan tarkemmin itseopiskelumateriaaleja ja valmennuskursseja.Katsotaan, miltä hakukonenäkyvyys ja liikenne näyttävät kauppatiedesivulla tämän vuoden helmikuun enimmäisestä päivästä huhtikuun loppuun verrattuna edellisvuoden samaan ajanjaksoon, kun muutoksia ei oltu vielä tehty sivuille (1.2.2021 – 30.4.2021 vs. 1.2.2022 – 30.4.2022). Vertailussa on mukana myös kauppatieteet-sivun alasivut.Klikit+59.8% Näyttökerrat+423.3%Myös tärkeän kauppatieteet-hakutermin sisältävien avainsanojen keskimääräinen sijoitus nousi ensimmäisellä hakutulossivulla ylöspäin kolmen sijoituksen verran. Klikit hakukoneesta tällä hakutermillä kasvoivat 290 % ja CTR 245 %.Toinen Mafylle tärkeä hakusana on kauppatieteet valmennuskurssi, jonka sijoitus nousi hakutulosten ykkössivulla kaksi pykälää ylöspäin. Tämän hakusanan klikit nousivat 93 %. Työmme on kuitenkin vasta aluillaan, ja voimme odottaa sijoitusten nousevan jatkossa vielä enemmän.Hakukoneoptimointi on tukenut mainonnan laatuaMainonnan osalta voimme todeta, että kampanjarakenteen muuttaminen ja oikeiden hakusanojen käyttö on johtanut suurempaan liikenteeseen sekä parempaan brändi- ja tuotetietoisuuteen. Konversioiden määrä on kasvanut ja hakusanakartoituksen tulokset ovat tukeneet myös muiden tuotteiden myyntiä. Parempi bränditietoisuus on kasvattanut liikennettä myös muista lähteistä: osa orgaanisesta liikenteestä koostuu kävijöistä, jotka ovat ensin nähneet mainoksen hakukoneessa ja tehneet myöhemmin brändätyn haun.Menestys kauppiksen kohdalla onkin johtanut jatkuvaan yhteistyöhön optimoinnin sekä mainonnan osalta, jossa tarkoituksenamme on parantaa kaikkien aineiden orgaanista näkyvyyttä. Pienistä puroista kasvaa suuri joki, ja tämä on nähtävissä jo nyt: orgaaninen liikenne Mafyn verkkosivuilla on kasvanu huimasti sen jälkeen, kun olemme aloittaneet sivuston systemaattisen kehittämisen yhdessä.Kasvu orgaanisessa näkyvyydessä helmikuun alusta huhtikuun loppuun verrattaessa vuosia 2021 ja 2022:Klikit+110.5% Katselukerrat+52.8 %Brändätyt (yrityksen nimen sisältävät) hakusanat performoivat yleensä aina brändäämättömiä paremmin. Mafyn kohdalla merkittävää onkin se, että suurta kasvua on tapahtunut sisältötyön ansiosta myös brändäämättömien hakusanojen kohdalla. Alla brändättyjen ja brändäämättömien hakusanojen vertailu (ajanjakso on sama, kuin yllä olevissa vertailuissa):Brändäämättömät hakusanat:Klikit+111.9%Katselukerrat+61.3%CTR+30.8% Brändätyt hakusanat:Klikit+164.7%Katselukerrat+112.1%CTR+25.1% Verkkokaupan tuottavuus lähti huimaan nousuunKatsotaan vielä Mafyn verkkokaupan tuottavuutta orgaanisen liikenteen kautta vuoden 2021 joulukuun ensimmäisestä päivästä vuoden 2022 helmikuun loppuun, ja verrataan tätä edellisvuoden samaan ajanjaksoon (1.12.2020 vs 28.2.2021 vs. 1.12.2021 – 28.2.2022). Kuten luvuista nopeasti huomaa, verkkokauppa on saavuttanut huimaa menestystä.Verkkokaupan tuotto+188%Konversiot +57%Transaktiot+260%Mafylle tekemämme työ on loistava esimerkki siitä, kuinka hakukoneoptimointi ja hakukonemarkkinointi tukevat toisiaan ja kuinka optimoinnilla voidaan saada aikaan merkittävää kasvua. Yhdistämällä optimointi ja mainonta saadaan luotua tehokas ja yhteinen strategia, jolla mainonta tukee orgaanista näkyvyyttä ja orgaaninen mainontaa.Kiinnostuitko sinäkin kasvumarkkinoinnista? Tutustu hakukoneoptimoinnin ja digimainonnan palveluihimme tai ota meihin yhteyttä!"
