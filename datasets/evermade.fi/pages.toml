["https://evermade.fi/privacy-policy"]
title = "Privacy Policy - How we process and use the data we collect - Evermade"
description = "We are committed to protecting your privacy. This Privacy Policy explains how we process and use the data collected from users on our website."
full_description = "Evermade’s privacy policyWe are committed to protecting your privacy.This privacy policy explains how we process your data if you visit our website, are our client, potential client, business partner, recruitment candidate and/or an individual who wants to hear Evermade’s news. We are committed to protecting your individual rights and keeping your personal data safe as described in this privacy policy.1. Data controllerEvermade Oy (“Evermade”, “we”, “us”)Lönnrotinkatu 18 C2, 00120 Helsinki, Finlandtel. +358 (0)20 7301 8881.1. ContactsIf you have any questions about this privacy policy or about data protection at Evermade in general, please email us at info@evermade.fi and we’ll get back to you.2. What is this privacy policy for?We collect various types of personal data about our clients, potential clients, recruitment candidates, business partners, and individuals who want to hear more about Evermade.We process individuals’ personal data for a number of reasons. The data is collected so that we can, for example:deliver and develop our products and servicesimprove the targeting of our marketing operationensure better user experiencerespond to requests for new businessprocess open applications sent to us via our websitecontact you and send information that we think may be of interest to you by post, email, or other means. In addition, we also use analytics and cookies on our site to learn more about how the site is used and how we can continuously improve it.Our pages may also include other third-party components, such as lead trackers.3. What data do we collect and why? Clients, partners and other contactsAre you an existing Evermade client (meaning you have a business contract and relationship with us) or have you contacted us regarding for example new business opportunities or possibilities for collaboration? To be able to stay in touch with you, we collect and process the following data:Your name and contact information (first and last name, email address, phone number, street address, postal code, post office and country)Information on your organization and your position in it (company name, your role, your job title)Your request and communication with us, the necessary information, i.e. billing information, services ordered, project information given by youInformation about your computer and your visits to this website, including your IP address, geographical location, browser type, referral source, search history, YouTube history, data from partner sites, length of visit and pages viewed.This data is used for managing the business relationships between you and Evermade, for communicating with you, for processing requests sent to us, providing services and pursuing the legitimate interests of Evermade related to such requests and services. The data is also used for analyzing, planning, improving and testing Evermade’s services and operations.Recruitment candidatesIf you apply for a job at Evermade, we’ll collect the following information about you. The data is obtained during the different phases of the recruitment process.Your name and contact information (first and last name, email address, phone number, street address, postal code, post office and country)Cover letter, CV, portfolio and other information that you personally have decided to send usProfessional skills and interestLinks to your social media profiles (if you’ve wished to send us these)Data relevant for processing the application as obtained during interviews, discussions and other communications between you and EvermadeInformation about your computer and your visits to this website, including your IP address, geographical location, browser type, referral source, search history, YouTube history, data from partner sites, length of visit and pages viewed.This data is used solely for the purposes of processing your application and communicating with you during our recruitment process. The data is not shared with anyone else, unless it is expressly required by applicable laws or requested by public authorities.4. CookiesWe use cookies on our website to optimize and improve your online experience. Cookies are strings of information, small text files, that may be stored on your device to recognise and track visitors of Evermade’s website. If you don’t want to use cookies, you can always disable cookies by changing your web browser settings. We do not use the information collected based on cookies to identify any specific persons.One of the primary purposes of browser cookies is to provide a convenience feature that will save you time and improve your experience.When you access our website, we ask for your consent to allow us to store the cookies on your device.4.1. Log FilesWe may collect demographic information using log files that are not associated with your name or other personally identifying information.Also, some information about your computer hardware and software is automatically collected. This information can include your IP address, device and browser type, domain names, access times and referring website addresses.This information is used to provide general statistics regarding the use of our website and to help us maintain high service quality. For these purposes, we may link this automatically collected data to your personal information such as name, email address, address, and phone number.5. Tranferring informationWe will never sell your personal information to any third party. We may, from time to time, contact you on behalf of external business partners about a particular offering that may be of interest to you. In those cases, we do not transfer your unique personal information to the third party.5.1. Transferring information outside the EU/EEAData on candidates is stored by Applied Training Systems, Inc., a U.S. based service provider as necessary for processing the application. Data on our clients, potential clients and other contacts is also processed by service providers located outside of the EEA. We have entered into appropriate contracts with such service providers to ensure the lawful processing of such data. Such contracts include the standard contractual clauses based on the decision of the European Commission of 5 February 2010 on standard contractual clauses for the transfer of personal data to processors established in third countries.5.2. Service ProvidersWe employ other companies to provide services to visitors on our website. In some cases we may need to share your information with them to provide you with a complete user experience. In such cases, we enter into appropriate agreements with the providers in order to ensure all the data is processed confidentially and explicitly require the third party to acknowledge and adhere to our privacy and customer data handling policies. Meaning the contents of this Privacy Policy.5.3. Social Media FeaturesOur website includes social media features, such as the Facebook like –button and widgets, such as the share this –button or interactive mini-programs that run on our site. This Privacy Policy does not apply to these features. Your interactions with these features are governed by the privacy policy and other policies of the companies providing them.5.4. External websitesOur website contains links to other websites. Please note that we do not control, nor are responsible for the content or practices used on these other websites. This Privacy Policy does not apply to these other websites, which are subject to any privacy and other policies they have.6. How long do we keep your data?We will keep your data as long as they are needed for the purposes for which your data was collected and processed or required by laws and regulations.If you visit our website, we may process your data for a maximum of 2 years and then we securely delete the information.If you or your company are a client of Evermade, we may process your data as long as the client relationship is in force and store the data only as long as is necessary for the respective purpose. The necessity of the data is regularly reviewed and the data will be erased when it is no longer needed.You can also request that we delete your information from the servers at any given time. That’s not all – read more about your rights below in 7. What are your rights?6.1. Corporate EventsIf we (or our assets) are acquired by another company, whether by merger, acquisition, bankruptcy or otherwise, that company would receive all information gathered by Evermade on the website until that point.7. What are your rights?If and when you accept to provide us with your personal information, it does not mean that we own you. With respect to the information provided, you have the right to ask us at any time to:confirm if we process any personal data related to you and to deliver an electronic copy of such datacorrect any inaccurate personal data related to you (errors, outdated information, or omissions in personal information that we have collected)restrict or stop our processing of any personal data related to youerase any personal data related to youopt you out of being contacted by Evermade or third partiesTo use your rights, please contact your Evermade contact person if you have one, or by emailing us hello@evermade.fi. We will promptly change, correct, or delete your information and notify you of the action we have taken.8. How do we secure your data?Keeping your personal data secure and safe is critical for us. We use appropriate organisational, technical and administrative security measures to protect any data we hold from misuse, loss, disclosure, unauthorised access, alteration, transfer or other unlawful forms of processing.9. What if I want to file a complaint?If you think your rights have not ben respected, you can always contact us.You can also lodge a complaint with the local data protection authority, Tietosuojavaltuutettu (Data Protection Ombudsman).10. Changes to this Privacy PolicyWe may update this Privacy Policy from time to time as we are constantly improving and developing our operations, services and our website. Changes may also be based on changes in legislation. The updated policy will be made available on our website, so we ask you to review this policy from time to time to stay updated on any changes.Back home"
