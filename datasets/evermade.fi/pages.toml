["https://evermade.fi/story/evermade-expands-to-turku"]
title = "Evermade expands to Turku - Evermade"
description = "We've opened an office in Turku! The office located in Yliopistonkatu is the new working hub for our employees living in the Turku area."
full_description = "Evermade expands to TurkuGreat news – we have opened an office in Turku!Roosa Säävälä, September 5, 2022“We’ve grown at a steady pace and in the past year, we’ve hired several employees from outside the Helsinki region. Since we already have five employees living in the Turku region, we started thinking about whether it would make sense to open an office there. The new office also helps us to serve customers located in the Turku area better,” says our head of operations Sunny Chandi.Traditionally, companies in the IT sector have been heavily concentrated in Helsinki, Tampere, and Oulu – but we believe that Turku as a university city has a lot of potential.The pandemic has increased mobility and pushed people to new cities. Many predicted that physical offices would lose their importance, but we’ve seen a different trend emerging. Although remote work has grown in popularity, many of our employees have expressed their desire to work in an office environment with good tools and the support of the work community. Many also feel that the distinction between work and free time becomes much clearer when work is done from the office. We heard the wishes of our people, and the decision to open a new office was made.Our new office is located in the center of Turku on Yliopistonkatu 31.We currently employ 50 people. We are planning to hire more professionals in development, digital design and web analytics to work in the Turku office this fall. If you are interested in working for us, follow our careers page! The growing confidence in WordPress: Why enterprises are choosing it as their primary CMSthe 2024 WordPress Enterprise Survey highlights a significant shift: more enterprises rely on WordPress as their standalone solution. Evermade welcomes Riikka Pakarinen as the new CEOWe are excited to announce that Riikka Pakarinen has been appointed as the new CEO of Evermade, effective January 1st. What it’s like to work as a deaf designer in a digital agencyI’m a Deaf designer and I’ve been working in Evermade since 2015. There are things we can all do to make work life easier for the Deaf."
