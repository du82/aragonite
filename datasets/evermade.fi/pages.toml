["https://evermade.fi/fi/tyot/slush-pwa"]
title = "Slush PWA - PWA maailman suurimmalle startup-tapahtumalle - Evermade"
description = "Vuoden 2018 Slushia varten loimme progressiivisen web-sovelluksen parantamaan tapahtumakokemusta."
full_description = "Slush 2018 PWAVuoden 2018 Slushia varten loimme progressiivisen web-sovelluksen parantamaan tapahtumakokemusta. PWA:t ovat web-pohjaisia sovelluksia, jotka tarjoavat kustannustehokkaan ja joustavan vaihtoehdon natiivisovelluksille. Teknologia kehittyy jatkuvasti ja saavuttaa lisää suosiota.Maailman suurin startup-tapahtumaKuinka maailman suurimmasta ja vaikuttavimmasta startup-tapahtumasta tehdään vuosi vuodelta entistä parempi? Tätä me pohdimme Slush-tiimin kanssa aina, kun istahdamme alas suunnittelemaan seuraavaa tapahtumaa.Slush-ystävämme ovat onneksi innoissaan uusista konsepteista ja teknologioista. Vuonna 2018 päätimmekin esitellä heille aivan uudenlaisen idean: progressiivisen web-sovelluksen, joka tarjoaisi Slush-kävijälle entistä räätälöidymmän tapahtumakokemuksen. Meille progressiivinen web-sovellus tarjoaisi näppärät kehitysmahdollisuudet, käyttäjälle taas natiivitasoisen käyttötuntuman. Slush-tiimi piti ideasta, ja niinpä lähdimme rakentamaan PWA:ta.KonseptiSlush PWA on selainpohjainen sovellus, joka tarjoaa meille ketterät kehitysmahdollisuudet ja käyttäjälle saumattoman käyttökokemuksen. 20 000 Slush-kävijää pystyivät sovelluksen avulla räätälöimään oman aikataulunsa, lisäämään kirjanmerkkeihinsä esimerkiksi suosikkipuhujiaan ja -ravintoloitaan sekä nauttimaan Slush-kokemuksesta täysin siemauksin.Ratkaisumme teki tapahtumakokemuksesta aiempaa sujuvamman, yksilöidymmän ja interaktiivisemman. Se antoi meille tilaisuuksia reagoida muutoksiin nopeasti ja Slush-tiimille mahdollisuuden tavoittaa kävijät oikea-aikaisilla ilmoituksilla ja viesteillä.TeknologiaPWA:ta ei tarvitse natiivisovellusten tapaan ladata sovelluskaupasta. Sen sijaan käyttäjä voi vierailla verkko-osoitteessa ja vain lisätä sovelluksen aloitusnäytölleen. Service worker-API:n ansiosta käyttöliittymä tuntuu hyvin samanlaiselta, kuin natiivisovelluksissa. Slush PWA on helppokäyttöinen, toimii kaikilla laitteilla ja on myös hyvin helposti päivitettävissä.Slush-sovellus käyttää backendinaan WordPress-sisällönhallintajärjestelmää, mikä tekee sisällön luomisesta ja päivittämisestä vaivatonta. Sisältö toimitetaan WordPress Rest -rajapinnan kautta React- ja Redux -käyttöiseen sovellukseen. Älykäs välimuistitus tekee sovelluksesta offline-ystävällisen, aivan kuten natiiviapplikaatiotkin. Slush-sovellus integroitiin myös Slushin omaan alustaan Googlen Firebasen avulla, jossa solmitut tapaamiset pystyttiin tuomaan käyttäjän omaan My Slushiin.DesignHalusimme sovelluksen näyttävän ja tuntuvan Slushilta sekä toimivan kuin käyttäjän mielen jatke. Slushin tunnettu ulkonäkö säilytettiin, mutta se mukautettiin verkkosovellukseen sopivaksi. Puhujien, tilaisuuksien ja lounaiden lisääminen käyttäjän omaan agendaan tehtiin helpoksi kaikissa näkymissä.Tumma teema tekee sovelluksesta mukavan käyttäjän silmille ja vähentää akun kulutusta. Käyttöliittymän tarkat yksityiskohdat muistuttavat lasereita, jotka läpäisevät Messukeskuksen sumuisen ilman. Ne johdattelevat käyttäjän jokaisen interaktion läpi. Näkymät vaihtuvat toisiin pehmeästi, mikä tekee sovelluksesta laadukkaan tuntuisen ja miellyttävän käyttää.TuloksetSlush-sovellusta käytettiin runsaasti sekä ennen tapahtumaa, sen aikana, että sen jälkeen. Se keräsi lähes 30 000 yksittäistä kävijää, vaikka itse tapahtumaan mahtui vain 20 000 ihmistä. Sovellus sai yli miljoona sivukatselua, ja keskimääräinen istunnon kesto oli 11 minuuttia. Bounce rate oli vain 21,3 %. Tapahtumia, puhujia ja ravintoloita lisättiin My Slushiin yli 78 000 kertaa.Tärkeimmät luvut 1.12. – 5.12.201829 000+ yksittäistä kävijää137 000+ istuntoa1 000 000+ sivukatselua21% bounce rate11 min keskimääräinen istunnon kesto78 000+ tapahtumaa Next caseMafy"
year_published = 2025
year_updated = 2024
