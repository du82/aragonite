["https://evermade.fi/fi/tyot/angry-birds"]
title = "Angry Birds - Evermade"
description = "Angrybirds.com herättää linnut eloon animaatioilla ja antaa faneille mahdollisuuden olla vuorovaikutuksessa brändin kanssa uusilla tavoilla."
full_description = "Angry BirdsOlemme olleet Angry Birdsin digikumppani yli 8 vuoden ajan. Vuonna 2016 rakensimme Angry Birdsille verkkosivuston vastaamaan paremmin villiä, leikkisää ja hauskaa Angry Birds -brändiä. Verkkosivusto voitti useita palkintoja ympäri maailmaa.Vuonna 2022 oli aika luoda jotain uutta. Päämotivaatiomme oli esitellä Angry Birds -brändi entistäkin paremmin, herättää linnut eloon animaatioilla ja tarjota faneille uusia mahdollisuuksia olla vuorovaikutuksessa brändin kanssa.Vieraile sivustollaAngry Birds on enemmän, kuin pelejäProjekti alkoi konseptoinnilla ja työpajoilla yhdessä Rovion tiimin kanssa, joissa kartoitettiin tarpeita uudelle verkkosivustolle. Tutkimme Angry Birds -pelejä ja fanikulttuuria ymmärtääksemme paremmin kohdeyleisöä. Loimme myös kyselyn faneille, jotta saisimme tietää heidän toiveitaan verkkosivuston suhteen . Ymmärsimme nopeasti, että Angrybirds.com on faneille paljon enemmän, kuin pelit – jokainen kokee Angry Birdsin omalla tavallaan.Halusimme luoda sivuston, joka on niin mukaansatempaava ja viihdyttävä, että selaamisen ja tutkimisen aikana ajantaju katoaa.Tehty faneilleUuden verkkosivuston piti juhlia brändiä ja viihdyttää käyttäjiä uusilla tavoilla. Angrybirds.com ei ole informatiivinen verkkosivusto – se on luotu täysin faneja varten, jotta he voivat tutkia Angry Birds -maailmaa.Vanha verkkosivusto oli staattinen ja keskittyi vain peleihin. Tällä kertaa halusimme luoda jotain uutta ja raikasta, jotta voisimme olla paremmin yhteydessä ja vuorovaikutuksessa fanien kanssa. Uusi sivusto tuo esiin Rovion luoman Angryverse-konseptin – Angry Birdsin eri maailmat ja Redin seikkailut niissä. Käyttäjät voivat tutkia eri maailmoja, pelejä ja niihin liittyvää sisältöä ja myös ladata sivustolle fanitaidetta.Birdsona CreatorInteraktiivisuus on suuri osa verkkosivustoa. Uuden Birdsona-työkalun avulla fanit voivat sekoittaa ja yhdistellä linnun eri osia ja lisätä asusteita luodakseen oman, ainutlaatuisen lintunsa. Vaikka sivustolla on paljon sisältöä ja viihdyttäviä aktiviteetteja, on tuttu elementti aina läsnä: Red. Redbot on luotu ohjaamaan käyttäjää ja kommentoimaan käyttäjän toimia koko kokemuksen ajan.Tekninen toteutusVerkkosivusto on toteutettu WordPressillä, ja se käyttää Gutenberg-editoria. Everberg mahdollistaa nopean ja helpon sivujen luomisen ja visuaalisesti upeiden tulosten saavuttamisen, jotka ovat aina linjassa Angry Birds -brändin kanssa. Rovion tiimillä on vapaus luoda ja räätälöidä sisältöä vaarantamatta brändin johdonmukaisuutta.Birdsona Creator rakennettiin React-sovelluksena yhdessä Rovion graafisen suunnittelun tiimin kanssa. Framer Motionia käytettiin luomaan realistista, joustavaa liikettä lintuihin ja niiden asusteiisiin. Next caseEduco"
year_published = 2025
year_updated = 2024
