full_description = "RamirentTeimme Ramirentin uuden konseptin näkyväksi ja hioimme asiakkaiden digitaalisia ostopolkuja varmistaaksemme sujuvan asiakaskokemuksen. SAKSAK:n brändi-identiteetin uudistuksen keskiössä ovat järjestön ydinarvot: ihmisarvo työssä, yhdenvertaisuus ja oikeudenmukaisuus. MessukeskusMessukeskuksen sivustouudistuksessa toteutettiin konsernin pääsivusto Messukeskus.com, Expomark.fi, Svv.fi sekä eri messubrändien sivustot. TeknologiateollisuusKevään ja syksyn 2024 aikana uudistimme sekä Teknologiateollisuus.fi pääsivuston, että useimpien toimialayhdistysten sivustot. FinferriesLoimme Finferriesille WooCommercea hyödyntävän varausjärjestelmän, joka on helpottanut merkittävästi asiakkaiden ja kapteenien arkea. KatanaUusi verkkosivusto tarjoaa Katanan markkinointitiimille mahdollisuuden toteuttaa joustavia sisältömarkkinointistrategioita helposti. Columbia RoadLoimme Columbia Roadille modernin verkkosivuston, joka mahdollistaa itsenäisen ja vaivattoman sivujen rakentamisen. PalaRakensimme Palalle alustan, jossa käyttäjät voivat löytää palveluntarjoajia ja jossa pienyrittäjät voivat kasvattaa asiakaskuntaansa. Suomen ApteekkariliittoApteekkariliitto kehittää apteekkialaa terveydenhuollon lähtökohdista. Lue Apteekkariliitto.fi sekä Apteekkari.fi-lehden uudistuksesta. HAMKToteutimme Hämeen ammattikorkeakoululle modernin WordPress-sivuston, joka palvelee sekä nykyisten, että tulevien opiskelijoiden tarpeita. YTKYTK Työttömyyskassa ja YTK Työelämä etsivät yhteistyökumppania kehittämään verkkopalveluitaan, jotta ne vastaisivat paremmin muuttuneita tarpeita. CuckooCuckoo on hyvinvointisovellus, joka palkitsee käyttäjäänsä taukojen pitämisestä. Lue, kuinka uudistimme Cuckoon verkkopalvelun. Angry Birds Comics LibraryHalusimme, että leikkisyys näkyy kaikkialla sivustolla, myös sarjakuvien lataamisessa. Tästä ajatuksesta syntyi Angry Birds Comics Library. John Nurmisen SäätiöJohn Nurmisen Säätiö on merkittävä yhteiskunnallinen vaikuttaja, joka työskentelee meriluonnon suojelemiseksi, Itämeren tilan parantamiseksi ja merikulttuurin vaalimiseksi."
