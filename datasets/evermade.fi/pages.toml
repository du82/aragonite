["https://evermade.fi/fi/tyot/helsingin-kaupunki"]
title = "Helsinki - Tavoitteena maailman paras digitaalinen kaupunki - Evermade"
description = "Kehitämme, selkeytämme ja parannamme Helsingin kaupungin kulttuuri- ja vapaa-ajan digitaalisten palveluiden tarjontaa."
full_description = "Helsingin kaupunkiHelsingin kaupunki valitsi meidät digitaaliseksi kumppanikseen pitkäaikaiseen strategiseen yhteistyöhön kesällä 2018. Tavoitteenamme on kehittää ja selkeyttää kaupungin digitaalisia kulttuurin ja vapaa-ajan palveluita. Mullistamme tapoja, joilla Helsingin kaupunki lähestyy asukkaitaan tekemällä palveluista helposti saavutettavia ja houkuttelevia.Kaupungin digitaaliset haasteetHelsingin kulttuurin ja vapaa-ajan toimiala tukee ihmisten henkistä ja fyysistä hyvinvointia, aktiivista osallistumista kaupungin toimintaan ja yleistä tietämystä Helsingistä. Se jakautuu neljään kokonaisuuteen: kulttuuriin, urheiluun, nuorisoon ja kirjastoon. Näihin kuuluvat kaupungin kulttuuripalvelut, urheilumahdollisuudet sekä nuorisotyö. Toiminnassa korostetaan vapautta valita ja löytää toimintaa, joka kiinnostaa eniten.130 sivustoa on liikaaVuonna 2018 Helsingin kaupungilla oli yli 130 epäjohdonmukaista sivustoa sen palveluille ja toiminnoille. Kaupungin eri osastot olivat itsenäisesti luoneet sivustoja, joissa ei oltu huomioitu käyttäjien tarpeita. Sekä helsinkiläisille että kaupungille työskenteleville oli haastavaa löytää tarvitsemaansa tietoa. Kulttuurin ja vapaa-ajan osastolla ei ollut selkeää digitaalista strategiaa, ja resursseja tuhlattiin epäjohdonmukaisten järjestelmien ylläpitoon.Useita hajanaisia svustoja oli vaikea ylläpitää ja päivittää. Sivustojen arkkitehtuuri toimi kankeasti eikä kohderyhmiä oltu määritelty selkeästi. Tavoitteemme oli ymmärtää kaupungin digitaaliset palvelut kokonaisuutena, luoda pitkän aikavälin strateginen suunnitelma ja antaa kaikki huomio palveluiden käyttäjille.Käyttäjäpolun ymmärtäminenSaavuttaaksemme täydellisen uudistuksen oli meidän paneuduttava huolellisesti Helsinkiläisten tarpeisiin ja odotuksiin. Projektin tarkoituksena ei ole vain kulttuuriin ja vapaa-ajan vanhojen palvelusivustojen yhdistäminen, vaan käyttäjien palvelupolun kokonaisvaltainen ymmärtäminen. Näin kaupunki voi palvella helsinkiläisiä verkkoympäristössä mutkattomasti myös tulevaisuudessa.Pureuduimme haasteen ytimeen palvelumuotoilun keinoin: määrittelimme käyttäjäsegmenttejä ja selvitimme käyttäjien ainutlaatuisia ominaisuuksia ymmärtääksemme, millaiset palvelut tukisivat parhaiten juuri heidän tarpeitaan. Tarkastelemme kulttuurin ja vapaa-ajan aktiviteetteja yhtenä kokonaisuutena välttääksemme tiedon ja sisällön hajaantumisen liian monen sivuston alle.Yli 4000 helsinkiläistä osallistui uusien digitaalisten palveluiden suunnitteluprosessiin vastaamalla käyttäjäkyselyihin sekä osallistumalla järjestämiimme haastatteluihin. Myös kulttuurin ja vapaa-ajan eritasoiset ammattilaiset vaikuttivat suuresti suunnitteluprosessiin.Palvelupolun selkeyttäminenOlemme rakentaneet kokonaisvaltaisen etenemissuunnitelman kulttuurin ja vapaa-ajan toimialalle tiiviissä yhteistyössä kaupungin kanssa. Määrittelimme vision kaupungin digitaalisista palveluista ja siitä, mitä niiden avulla halutaan saavuttaa. Suunnitelman tarkoituksena on luoda saumaton palvelupolku ja laadukkain mahdollinen käyttäjäkokemus. Tavoitteena on tarjota ihmisille kattava kuva Helsingin kaupungin palvelutarjonnasta ja intuitiivinen tapa löytää tietoa.Yksittäiset palvelusivustot syntyivät käyttäjälähtöisesti: tutkimme, millaisia digitaalisia palveluita ihmiset haluavat taiteen, kulttuurin, urheilun ja ulkoilun ympärille. Annoimme myös erityisaseman brändeille, jotka ovat Helsingille erityisen merkityksellisiä. Esimerkiksi kansainvälisestikin tunnettua Oodia voidaan pitää Suomen lippulaivana – se on Helsingin ylpeys, jonne odotetaan 2,5 miljoonaa kävijää vuodessa. Siksi Oodille oli tärkeää luoda oma identiteettinsä myös verkkoon.Useita tavoitteita on saavutettu, mutta matka jatkuu, jotta Helsingistä syntyisi maailman paras digitaalinen kulttuurin ja vapaa-aja kaupunki. Palvelu kerrallaan jatkamme helsinkiläisten sekä Helsingissä vierailevien elämän helpottamista tuomalla palvelut paremmin kaikkien saataville. Next caseDefi"
