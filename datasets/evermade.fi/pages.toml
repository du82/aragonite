["https://evermade.fi/case/liikenneturva"]
title = "Liikenneturva - Evermade"
description = "Liikenneturva was looking for a reliable, proactive, and skilled partner for the maintenance and ongoing development of their website."
full_description = "Liikenneturva.fi: strengthening web security and efficiency in ongoing developmentFinnish Road Safety Council’s (Liikenneturva) mission is to promote road traffic safety by influencing people’s driving behavior and traffic culture. Liikenneturva was looking for a reliable, proactive, and skilled partner for the maintenance and further development of its website. After the previous redesign, several additional areas for improvement were identified, and Liikenneturva was seeking a supplier to focus on these. The WordPress-based website, launched in 2021, had accumulated some technical debt, including in the area of search engine optimization. We were pleased to partner with Liikenneturva and took over the maintenance of the Liikenneturva.fi website.“We chose Evermade as our new partner due to a well-executed audit. The reporting was clear, and the audit allowed us to request quotes from multiple service providers. In the end, though, Evermade was an easy choice. The customer service we received was excellent from the very beginning, and we felt that we could trust their services in the future as well.”Anni MuukkonenCommunications Designer & Digital Communications, LiikenneturvaTechnical audit and website handoverBefore taking over the maintenance of a website created by another partner, we always conduct a comprehensive audit. The goal of this audit is to ensure we have a full understanding of the web service to provide the best possible ongoing support. By knowing the structure of the site and becoming familiar with the development environment, we can offer cost-effective long-term solutions and respond to the client’s needs more quickly and efficiently. The audit and any resulting recommendations also ensure the service is compatible with our maintenance infrastructure.The Liikenneturva.fi audit covered:Theme implementation and code qualityTechnical solutions and integrationsPlugins, their versions and compatibilityAvailable updates and security statusContent structureUser experience in site managementThe outcome of the audit was a comprehensive report detailing the current technical state of the site and requirements for transferring the service to our maintenance team. This audit serves as a crucial first step in the partnership, as the findings directly influence the actions required during migration and after the handover.The handover process involves setting up the project on Evermade’s servers and automation infrastructure, addressing any necessary changes based on the audit, testing the site, and carrying out the final publishing procedures. We ensure that security and updates meet our standards, patch any security vulnerabilities, and simplify technical solutions where needed.Strong security with updates and best practicesImproving security is an ongoing process. We actively monitor WordPress-related security news, vulnerabilities, and updates. We also regularly train our developers on security best practices.For WordPress sites, security is especially critical when it comes to installing updates for WordPress Core and plugins, as well as avoiding unnecessary plugins. We only implement plugins that have passed a rigorous reliability evaluation.We perform updates and testing automatically on Liikenneturva’s website and many other client sites using our AutoCare tool. Additionally, we use a specialized tool to check for vulnerabilities in all installed plugins. If any vulnerabilities are found despite the work done by AutoCare, our maintenance team is immediately alerted and takes the necessary actions to resolve the issue.Liikenneturva’s website also uses Cloudflare, which acts as a caching layer between the site’s visitors and the server. Cloudflare filters out malicious traffic, protects against cyberattacks and spam bots, and significantly improves the site’s performance.An active partner for website maintenance and future growthWe believe that websites must continuously meet the evolving needs of their target audiences — both today and in the future. This is why websites should be continuously developed one small step at a time. Liikenneturva’s goal was to find a long-term partner who would methodically work through their development backlog and collaborate on further action steps.In addition to our Care team, Liikenneturva has gained a dedicated project team that continues to develop the website based on the needs of both the client and its users. The transfer of the website to our maintenance services has opened the door to all our specialists and services, making it easy to implement development ideas. With the Care team and project team managing the website as a whole, the client is never alone with their ideas.We also offer clients the option to reserve our experts on a retainer basis, committing to a set number of work hours each month. This is an easy way to continue developing and optimizing the website, track progress, and predict costs. Interested in Evermade Care?Our Care team keeps your web services secure and operational at all times. Get in touch with us — let’s discuss your needs!Contact usRead more about Care Next caseService Union United"
year_published = 2025
year_updated = 2024
