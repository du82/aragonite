["https://evermade.fi/fi/tyot/soaked-by-slush"]
title = "SOAKED by Slush - Case - Evermade"
description = "Loimme brändin, joka rohkealla äänellään syventää kasvuyrittäjyys- ja teknologiakentillä käytävää keskustelua ja tarjoaa käytännön apua tulevaisuuden yrittäjille."
full_description = "SOAKED by SlushPintaa syvemmältäLoimme yhdessä Slushin kanssa brändin, joka rohkealla äänellään syventää kasvuyrittäjyys- ja teknologiakentillä käytävää keskustelua ja tarjoaa käytännön apua tulevaisuuden yrittäjille..l-footer{display:none !important}Vahva oma ilmeSlush on tunnettu visuaalisesta ilmeestään, joka nostaa sen omaan luokkaansa maailman startup-tapahtumien joukossa ja yllättää tapahtuman kävijät vuodesta toiseen. Luonnollisesti myös tavoitteet Slushin oman median designille olivat korkealla.Tavoitteena oli luoda alusta, joka ei tunnu pelkältä Slush-tapahtuman blogilta tai maksetulta medialta. Soakedille lähdettiin luomaan alusta asti aivan omaa ilmettä. Lopulta sen keskeiseksi kilpailuvaltiksi muodostuikin erottuva, viimeistelty ja ajankohtainen design.Erottuvaa visuaalisuuttaErottuva, viimeistelty ja ajankohtainen design onnistui erinomaisesti ja on ehdottomasti Soaked by Slushin keskeisimpiä kilpailutekijöitä. Soakedia lukiessa ei voi unohtaa, millä sivustolla on.Soakedin ulkoasu viestii myös loistavasti Slushin arvoja: se on painokas mutta raikas, nokkela ja hauska sekä maskuliiniseen tech-kentän kontekstissa viehättävän unisex ja kaunis. Se flirttailee sopivasti 2000-luvun alun internet-kulttuurille, mutta on samalla tarpeeksi yksinkertainen, jotta muutkin kuin diginatiivit osaavat navigoida sivulla.Evermade ymmärsi mahtavasti toiveemme nuoresta, raikkaasta asenteesta, jota halusimme Soaked by Slushin viestivän, ja käänsi abstraktitkin toiveet kekseliäiksi ratkaisuiksi. Työskentely oli innostavaa, ja sivu on toiminut loistavasti. Tiimi rakensi kunnianhimoisesti myös pienet yksityiskohdat, kuten lukemisen progression barin, jotka viimeistelevät Soaked-tunnelman. Sivusta saa pienikin toimitustiimi rajallisessa ajassa paljon irti.Pauliina SuominenPäätoimittaja, Soaked by SlushSOAKED MAAILMALLASoakedin lukijoiden joukossa on Euroopan startup-skenen kirkkaimpia mielipidevaikuttajia kuten johtavia sijoittajia, suurien startupien johtoa, eturivin poliitikkoja ja bisnesjohtajia sekä teknologia- ja taloustoimittajia esimerkiksi Wiredista, Siftedistä, Forbesista ja Business Insiderista. Soaked oli vuoden 2019 Slush Helsingissänäkyvästi esillä mm. badgejen nauhoissa.Kuvat vasemmalta oikealle: Tomi Tahti, Samuli Pentti ja Tomi TahtiJoustavat työkalutKeskeisiä arvoja ja tekemisen tapoja Soakedille ovat myös uusiutuminen ja yllätyksellisyys. Tätä tukemaan sivustolle rakennettiin ratkaisuja, jotka mahdollistavat yllättävän uusiutumisen ilman suuria päivitysprojekteja myös designissa: brändivärejä on helppo vaihtaa ja logon fontti vaihtuu automaattisesti. Etusivu ja artikkelit on rakennettu joustavasti sisältöblokeilla, joilla pelaamalla myös tekstitoimittaja saa helposti sivulle uutta ilmettä.Soaked by Slush julkaistiin 1.11.2019 ja se on kerännyt yli 60 000 sivukatselua.Houkutteleva design ja toimiva verkkopalvelu ovat yleisöpalautteen mukaan olleet monelle ensimmäinen syy tutkia Soakedin sisältöjä sekä suositella niitä muille. Ensimmäisinä kuukausina Soaked on päässyt kirkkaasti tavoitteisiinsa sekä lukijamäärissä että kiinnostuneissa yhteistyöehdotuksissa.Yhteistyöpyyntöjä uuden, kiinnostavan brändin kanssa tulee niin paljon, että vain murto-osa voidaan toteuttaa. Useampi talous- ja teknologiamedia on tiedustellut mahdollisuutta yhteisiin juttu- ja markkinointiprojekteihin, suuryritykset ja startupit tarjoavat vieraskirjoituksia, ja sijoittajat sekä julkiset instituutiot pitchaavat aiheita. Esimerkiksi Tech.eu -media ja johtava eurooppalainen sijoitusyhtiö Atomico ovat myös oma-aloitteisesti jakaneet Soakedin sisältöjä podcastissa ja uutiskirjeessä valtaville yleisöilleen. Next casePorsche"
