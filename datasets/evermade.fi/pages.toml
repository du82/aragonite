["https://evermade.fi/case/columbia-road"]
title = "Columbia Road - Evermade"
description = "We created a modern, future-ready website for Columbia Road, empowering their team to build beautiful pages independently."
full_description = 'Columbia Road’s new HubSpot CMS websiteOur partnership with Columbia Road has deep roots. Six years ago, we built their first HubSpot CMS website. Now, it was time for a fresh start — reinventing their online presence with a modern, future-ready approach.Visit websiteSeamless collaboration between design & developmentWhen working with exceptional designs, our priority is ensuring they shine in production. Technical limitations, missed deadlines, and inflated budgets often turn great designs into mediocre websites. For Columbia Road’s new site, we set an ambitious goal to achieve a pixel-perfect result. The outcome is a carefully crafted website where design comes first."Evermade adjusted to our needs and schedule and meticulously implemented the new design. Whenever something needed a bit of investigation, they always found a solution, and usually really fast.”Patricia ÅkermanHead of Marketing, Columbia RoadThe new editing experienceEvery template and building block is built for ease and clarity. We wanted to ensure that anyone at Columbia Road can create a page, and change content on the newly developed website. We were able to strike a good balance between flexibility and strict design guidelines. Everything on the website has a purpose and blocks come with helpful instructions and a good number of options to choose from. We were pleased to see that Columbia Road’s team could easily create tens of new pages independently.Built to last & backed by expertisePeople at Columbia Road wanted to create a website built to last. While design plays a key role in longevity, seamless implementation and an intuitive editing experience are just as important.The new Columbia Road website evolves continuously, with new pages added every week. Our HubSpot team provides ongoing support and expert guidance."The people at Evermade were considerate of the budget and helped us to prioritise things to ensure a smooth project."Patricia ÅkermanHead of Marketing, Columbia RoadNeed help with your website?Contact usRead about HubSpot Next caseAngry Birds'
