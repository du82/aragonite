description = "Olemme sitoutuneet suojelemaan henkilökohtaisia oikeuksiasi ja pitämään henkilötietosi turvassa tässä tietosuojakäytännössä kuvatulla tavalla."
full_description = "Evermaden rekisteri- ja tietosuojaselosteOlemme sitoutuneet suojelemaan yksityisyyttäsi.Tämä tietosuojakäytäntö selittää, kuinka käsittelemme tietojasi, jos vierailet verkkosivustollamme tai olet asiakkaamme, potentiaalinen asiakkaamme, liikekumppanimme, työnhakija ja/tai henkilö, joka haluaa kuulla Evermaden uutisia. Olemme sitoutuneet suojelemaan henkilökohtaisia oikeuksiasi ja pitämään henkilötietosi turvassa tässä tietosuojakäytännössä kuvatulla tavalla.1. RekisterinpitäjäEvermade Oy (”Evermade”, ”me”)Lönnrotinkatu 18 C2, 00120 Helsinki, Finlandpuh. +358 (0)20 7301 8881.1 YhteystiedotJos sinulla on kysyttävää tästä tietosuojakäytännöstä tai yleisesti Evermaden tietosuojasta, lähetä meille sähköpostia osoitteeseen info@evermade.fi, niin olemme sinuun yhteydessä.2. Mihin tämä tietosuojakäytäntö on tarkoitettu?Keräämme erilaisia henkilötietoja asiakkaistamme, potentiaalisista asiakkaistamme, työnhakijoistamme, liikekumppaneistamme ja henkilöistä, jotka haluavat kuulla lisää Evermadesta.Käsittelemme yksilöiden henkilötietoja useista syistä. Tietoja kerätään, jotta voimme mm.toimittaa ja kehittää tuotteitamme ja palveluitammeparantaa markkinointitoimenpiteidemme kohdentamistavarmistaa paremman käyttökokemuksenvastata uusiin liiketoimintapyyntöihinkäsittelemään meille verkkosivujemme kautta lähetettyjä avoimia hakemuksiaottaa sinuun yhteyttä ja lähettää sellaisia tietoja postitse, sähköpostitse tai muulla tavoin, joiden uskomme kiinnostavan sinua. Lisäksi käytämme sivustollamme analytiikkaa ja evästeitä saadaksemme lisätietoja siitä, miten sivustoamme käytetään ja kuinka voimme jatkuvasti parantaa sitä.Sivuillamme voi olla myös muita kolmannen osapuolen komponentteja, kuten työkaluja liidien seurantaan.3. Mitä dataa keräämme ja miksi? Asiakkaat, yhteistyökumppanit ja muut yhteystiedotOletko Evermaden asiakas (eli sinulla on liikesopimus ja suhde meihin) tai oletko ottanut meihin yhteyttä koskien esimerkiksi uusia liiketoimintamahdollisuuksia tai yhteistyömahdollisuuksia? Pystyäksemme pitämään sinuun yhteyttä, keräämme ja käsittelemme seuraavia tietoja:Nimesi ja yhteystietosi (etu- ja sukunimi, sähköpostiosoite, puhelinnumero, katuosoite, postinumero, postinumero ja maa)Tietoja organisaatiostasi ja asemastasi siinä (yrityksesi nimi, roolisi, tehtävänimikkeesi)Pyyntösi meille ja yhteydenpito kanssamme, tarvittavat tiedot, kuten laskutustiedot, tilatut palvelut, antamasi tiedot projektistaTietoja tietokoneestasi ja vierailustasi tällä verkkosivustolla, mukaan lukien IP-osoitteesi, maantieteellinen sijaintisi, selaintyyppisi, liikenteen lähteesi, hakuhistoriasi, YouTube-historiasi, tiedot kumppanisivustoilta, vierailusi pituus sekä katsomasi sivut.Näitä tietoja käytetään sinun ja Evermaden välisten liikesuhteiden hallintaan, kanssasi kommunikointiin, meille lähetettyjen pyyntöjen käsittelyyn, palveluiden tarjoamiseen ja Evermaden tällaisiin pyyntöihin ja palveluihin liittyvien oikeutettujen etujen toteuttamiseen. Tietoja käytetään myös Evermaden palveluiden ja toimintojen analysointiin, suunnitteluun, parantamiseen ja testaamiseen.TyönhakijatJos haet työtä Evermadelta, keräämme sinusta seuraavat tiedot. Tietoja hankitaan rekrytointiprosessin eri vaiheissa.Nimesi ja yhteystietosi (etu- ja sukunimi, sähköpostiosoite, puhelinnumero, katuosoite, postinumero, postinumero ja maa)Saatekirje, CV, portfolio ja muut tiedot, jotka olet henkilökohtaisesti päättänyt lähettää meilleAmmattitaitosi ja kiinnostuksesi työpaikkaa kohtaanLinkit sosiaalisen median profiileihisi (jos olet halunnut lähettää nämä meille)Hakemuksesi käsittelyn kannalta merkitykselliset tiedot, jotka on saatu haastatteluissa, keskusteluissa ja muussa sinun ja Evermaden välisessä viestinnässäTietoja tietokoneestasi ja vierailustasi tällä verkkosivustolla, mukaan lukien IP-osoitteesi, maantieteellinen sijaintisi, selaintyyppisi, liikenteen lähteesi, hakuhistoriasi, YouTube-historiasi, tiedot kumppanisivustoilta, vierailusi pituus sekä katsomasi sivut.Näitä tietoja käytetään yksinomaan hakemuksesi käsittelyyn ja kommunikointiin kanssasi rekrytointiprosessimme aikana. Tietoja ei jaeta kenenkään muun kanssa, ellei sovellettava laki sitä nimenomaisesti edellytä tai viranomainen sitä vaadi.4. EvästeetKäytämme verkkosivustollamme evästeitä optimoidaksemme ja parantaaksemme kokemustasi verkkosivustollamme. Evästeet ovat pieniä tekstitiedostoja, jotka voidaan tallentaa laitteellesi tunnistamaan ja seuraamaan verkkosivustollamme vierailevia kävijöitä. Jos et halua käyttää evästeitä, voit aina poistaa ne käytöstä muuttamalla selaimesi asetuksia. Emme käytä evästeiden perusteella kerättyjä tietoja tiettyjen henkilöiden tunnistamiseen.Yksi selaimen evästeiden päätarkoituksista on tarjota parempaa käyttömukavuutta, joka säästää aikaasi ja parantaa käyttökokemustasi.Kun käytät verkkosivustoamme, pyydämme suostumustasi evästeiden tallentamiseen laitteellesi.4.1. LokitiedostotSaatamme kerätä demografisia tietoja käyttämällä lokitiedostoja, jotka eivät liity nimeesi tai muihin henkilötietoihin.Myös joitakin tietoja tietokoneesi laitteistosta ja ohjelmistosta kerätään automaattisesti. Nämä tiedot voivat sisältää IP-osoitteesi, laitteesi ja selaimesi tyypin, verkkotunnuksen nimet, käyttöajat ja viittaavien verkkosivustojen osoitteet.Näitä tietoja käytetään yleisten tilastojen tuottamiseen verkkosivustomme käytöstä. Tiedot auttavat meitä myös ylläpitämään korkeaa palvelun laatua. Näitä tarkoituksia varten voimme linkittää nämä automaattisesti kerätyt tiedot henkilötietoihisi, kuten nimeesi, sähköpostiosoitteeseesi, osoitteeseesi ja puhelinnumeroosi.5. Tietojen siirtoEmme koskaan myy henkilötietojasi kolmannelle osapuolelle. Saatamme ajoittain ottaa sinuun yhteyttä ulkopuolisten liikekumppaneiden puolesta koskien sinua mahdollisesti kiinnostavia tarjouksia. Näissä tapauksissa emme luovuta ainutlaatuisia henkilötietojasi kolmannelle osapuolelle.5.1. Tietojen siirto EU:n/ETA:n ulkopuolelle Applied Training Systems, Inc., yhdysvaltalainen palveluntarjoaja, tallentaa hakijoiden tiedot tarpeen mukaan hakemuksen käsittelyä varten. Tietoja asiakkaistamme, mahdollisista asiakkaistamme ja muista kontakteistamme käsittelevät myös ETA:n ulkopuolella sijaitsevat palveluntarjoajat. Olemme tehneet asianmukaisia sopimuksia tällaisten palveluntarjoajien kanssa varmistaaksemme tällaisten tietojen laillisen käsittelyn. Tällaisia sopimuksia ovat mallisopimuslausekkeet, jotka perustuvat Euroopan komission 5. helmikuuta 2010 tekemään päätökseen vakiosopimuslausekkeista henkilötietojen siirtämiseksi kolmansiin maihin sijoittautuneille käsittelijöille.5.2. PalveluntarjoajatKäytämme muita yrityksiä tarjoamaan palveluita verkkosivustomme vierailijoille. Joissakin tapauksissa saatamme joutua jakamaan tietosi heidän kanssaan tarjotaksemme sinulle täydellisen käyttökokemuksen. Tällaisissa tapauksissa teemme palveluntarjoajien kanssa asianmukaiset sopimukset varmistaaksemme, että kaikki tiedot käsitellään luottamuksellisesti, ja vaadimme nimenomaisesti, että kolmas osapuoli tunnustaa ja noudattaa tietosuoja- ja asiakastietojen käsittelykäytäntöjämme. Tarkoittaa tämän tietosuojakäytännön sisältöä.5.3. Sosiaalinen media Sivustomme sisältää sosiaalisen median ominaisuuksia, kuten Facebookin tykkää-painikkeen ja widgetejä, kuten Jaa-painike tai sivuillamme toimivia interaktiivisia miniohjelmia. Tämä tietosuojakäytäntö ei koske näitä ominaisuuksia. Vuorovaikutustasi näiden ominaisuuksien kanssa säätelee niitä tarjoavien yritysten tietosuoja- ja muut käytännöt.5.4. Ulkopuoliset verkkosivustotSivustomme sisältää linkkejä muille sivustoille. Huomaa, että emme hallitse emmekä ole vastuussa näiden muiden verkkosivustojen sisällöstä tai käytännöistä. Tämä tietosuojakäytäntö ei koske näitä muita verkkosivustoja, jotka ovat omien tietosuoja- ja muiden käytäntöjensä alaisia.6. Kuinka pitkään säilytämme tietojasi?Säilytämme tietojasi niin kauan, kuin niitä tarvitaan tarkoituksiin, joita varten tietojasi on kerätty ja käsitelty, tai niin kauan sitä edellyttävät lait ja määräykset vaativat.Jos vierailet verkkosivuillamme, voimme käsitellä tietojasi enintään 2 vuoden ajan, minkä jälkeen poistamme tiedot turvallisesti.Jos sinä tai yrityksesi on Evermaden asiakas, voimme käsitellä tietojasi niin kauan kuin asiakassuhde on voimassa. Voimme säilyttää tietoja vain niin kauan, kuin se on tarpeen kulloiseenkin tarkoitukseen. Tietojen tarpeellisuus tarkistetaan säännöllisesti ja tiedot poistetaan, kun niitä ei enää tarvita.Voit myös milloin tahansa pyytää, että poistamme tietosi palvelimilta. Eikä siinä vielä kaikki – lue lisää oikeuksistasi alla kohdasta 7. Mitkä ovat oikeutesi?6.1. YritystapahtumatJos toinen yritys hankkii meidät (tai omaisuutemme) joko yhdistymisen, hankinnan, konkurssin tai muun taphtuman seurauksena, kyseinen yritys saa kaikki Evermaden verkkosivustolta tähän tapahtumaan asti keräämät tiedot.7. Mitkä ovat oikeutesi?Jos ja kun suostut antamaan meille henkilötietosi, ei tämä tarkoita, että omistamme sinut. Annettujen tietojen osalta sinulla on oikeus pyytää meiltä milloin tahansa:vahvistusta siitä, käsittelemmekö sinuun liittyviä henkilötietoja, ja sähköisen kopion toimitusta näistä tiedoistakaikkien sinuun liittyvien epätarkkojen henkilötietojen korjaamisen (virheet, vanhentuneet tiedot tai puutteet keräämissämme henkilötiedoissa)sinuun liittyvien henkilötietojen käsittelyn rajoittamista tai poistamistakaikkien sinuun liittyvien henkilötietojen poistamisenEvermaden tai kolmansien osapuolien yhdeydenottojen kieltämisenOikeuksien käyttämiseksi ota yhteyttä yhteyshenkilöösi Evermadella, jos sinulla on sellainen, tai lähetä meille sähköpostia osoitteeseen hello@evermade.fi. Muutamme, korjaamme tai poistamme tietosi viipymättä ja ilmoitamme sinulle toteuttamistamme toimenpiteistä.8. Kuinka suojaamme tietosi?Henkilötietojesi pitäminen turvassa on meille erittäin tärkeää. Käytämme asianmukaisia organisatorisia, teknisiä ja hallinnollisia turvatoimenpiteitä suojellaksemme kaikkia hallussamme olevia tietoja väärinkäytöltä, katoamiselta, paljastamiselta, luvattomalta käytöltä, muuttamiselta, siirrolta ja muulta laittomalta käsittelyltä.9. Entä jos haluan tehdä valituksen? Jos uskot, ettei oikeuksiasi ole kunnioitettu, voit aina ottaa meihin yhteyttä.Voit myös tehdä valituksen paikalliselle tietosuojaviranomaiselle, Tietosuojavaltuutetulle.10. Muutokset tähän tietosuojakäytäntöönSaatamme päivittää tätä tietosuojakäytäntöä ajoittain, kun parannamme ja kehitämme toimintaamme, palveluitamme ja verkkosivustoamme. Muutokset voivat perustua myös muutoksiin lainsäädännössä. Päivitetty käytäntö julkaistaan verkkosivuillamme, joten pyydämme sinua tarkistamaan tämän käytännön ajoittain pysyäksesi ajan tasalla mahdollisista muutoksista.Takaisin etusivulle"
