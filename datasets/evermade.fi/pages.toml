["https://evermade.fi/fi/tyot/memoria"]
title = "Memoria - Evermade"
description = "Memoria on Suomen ensimmäinen maanlaajuisesti toimiva, luotettava ja laadukas hautauspalveluiden verkkopalvelu. Lue lisää."
full_description = "Memoria-hautauspalveluMemoria on Suomen ensimmäinen maanlaajuisesti verkossa toimiva hautauspalvelu ja perheyritysten verkosto, jonka kuluttajat tunnistavat luotettavana ja laadukkaana palveluntarjoajana. Rakensimme Memorialle ammattitaitoa ja empatiaa huokuvan palvelun, joka tukee läheisensä menettänyttä vaikeiden päätösten hetkellä.Tutustu palveluunLähtökohtaMemoria kaipasi kumppania uuden hautauspalvelun suunnitteluun, kehitykseen ja digitaaliseen markkinointiin. Verkkopalvelun ytimessä tuli olla helppokäyttöisyys, ymmärrettävyys, luotettavuus ja nykyaikaisuus. Vaikka kaikki palvelut digitalisoituvat, mielletään hautauspalvelut yhä vankan perinteiseksi. Tämän me halusimme muuttaa.Olemassa olevat digitaaliset hautauspalvelut ovat kylmiä, kankeita ja usein myös sekavia käyttää. Memorian uuden digitaalisen palvelun tuli yhdistää perinteisten hautauspalveluiden vahva asiantuntijuus ja osaaminen digitaalisen maailman tarjoamaan helppouteen ja joustavuuteen. Tällä hetkellä Memorian tyypillisin asiakas ei ole diginatiivi, mutta seuraava sukupolvi olettaa ja odottaa digitaalista palvelua. Memoria ottaakin ison askeleen kilpailijoidensa edelle rakentamalla palvelua tuleville sukupolville.Hautauksen järjestely hoidetaan edelleen lähes aina ihmisten kesken, mutta Memorian uusi palvelu antaa mahdollisuuden hoitaa järjestelyt itsenäisesti verkossa. Palvelun piiriin astuva käyttäjä käy läpi suuria tunteita, ja palvelun täytyi ottaa nämä tunteet huomioon tuntumalla mahdollisimman inhimilliseltä, turvalliselta ja selkeäkäyttöiseltä. Memoria haluaa erottua kilpailijoistaan selkeästi olemalla lämminhenkinen, keskusteleva ja moderni. Sivuston tekstisisältöjä edistetään yhä ja palvelua kehitetään jatkuvasti saadun palautteen sekä analytiikan pohjalta.StrategiaTavoitteenamme oli suunnitella selkeä, moderni ja helppokäyttöinen palvelu, joka tuntuisi surun hetkellä inhimilliseltä, luotettavalta ja turvalliselta. Käyttöliittymä suunniteltiin yleisilmeeltään rauhallisen vaaleaksi. Tummat teemavälilehdet rytmittävät sisältöjä niin, että käyttäjälle on selvää, milloin teema tai aihe vaihtuu. Palvelun laskeutumissivu esittelee koko hautausprosessin tiiviissä, selkeässä muodossa ja nostaa esille digitaalisen palvelun hyödyt. Lisäksi laskeutumissivu tekee Memorian tutuksi yhtiönä ja varmistaen, että asiakkaalle on selvää, kenen kanssa hän on tekemisissä.Palvelu helpottaa merkittävästi hautajaisten suunnittelua. Kaikki tarvittava tieto on paitsi selkeässä muodossa, myös aina saatavilla. Pitkien kyselylomakkeiden sijaan käyttäjä käy läpi asiat keskustelun muodossa. Keskustelunomaisesti esitetyssä palvelussa asiointi tuntuu inhimilliseltä ja henkilökohtaiselta ja pidemmätkin kokonaisuudet jäsentyvät helposti hahmotettaviksi palasiksi.Palvelu avustaa käyttäjää tekemään oikeat valinnat hautajaisten järjestelyjä varten ja välittää lopuksi myyntitoimeksiannon lähimmälle hautaustoimistolle. Memorian keskeinen vahvuus on se, että asiakkaan paikkakunnalla on oikeita ihmisiä, jotka alkavat hoitaa hautausta paikallisesti. Palvelu tarjoaa tiedot tilauksesta Memorian laskutusta varten ja antaa hautaustoimistoyrittäjälle mahdollisuuden muokata tilausta, jotta lasku voidaan muodostaa oikein. Hautaustoimistoyrittäjä voi lisäksi valita haluamansa tuotteet ja palvelut Memorian verkkopalveluun ja hinnoitella ne.Luova ratkaisuVerkkopalvelun suunnittelu alkoi työpajalla, jonka tavoitteena oli ymmärtää hautausprosessia ja sen vaiheita sekä tunnistaa, millaisia erityislaatuisia piirteitä prosessissa on eri osakkaiden välillä. Kartoitimme, millaisia toiveita, tarpeita ja ideoita Memorian osakkailla oli uudelle palvelulle ja rakensimme ylätason hahmotelman hautausprosessin eri vaiheista. Hahmotelmaa lähdettiin tarkentamaan yhdessä Memorian kanssa käymällä käyttäjäpolkua yksityiskohtaisesti läpi. Selvitimme, mitä kaikkea hautausprosessiin kuuluu, millaisia valintoja käyttäjän tulee palvelussa tehdä ja kuinka käyttäjän tekemät valinnat vaikuttavat seuraaviin vaiheisiin.Kun käyttäjäpolku oli hahmoteltu, aloitimme rautalankojen suunnittelun. Koska hautausprosessi ei ole aivan yksinkertainen ja käyttäjän tekemät valinnat vaikuttavat aina seuraavin vaiheisiin, päädyimme rakentamaan rautalangoista myös klikkailtavan prototyyppin. Näin asiakas pääsi testaamaan käyttäjäpolun loogisuutta ja saattoi jo aikaisessa vaiheessa huomata mahdolliset virheet tai puutteet. Prototyyppiin tuli lopulta lähes 400 erillistä näkymää. Prototyyppi osoittautui todella hyödylliseksi testauksen ja kehityksen kannalta: turhalta kehitykseltä vältyttiin ja kehittäjät pystyivät käyttämään prototyyppiä käyttäjäpolun ohjenuorana.Kun rautalangat oli lyöty lukkoon, aloitimme visuaalisen suunnittelun. Memorian brändi oli hiljattain uudistetu mainostoimisto Ahooyn toimesta. Visuaalisen suunnittelun pohjana toimi Memorian graafinen ohjeisto, josta poimimme typografian, värit ja ikonit.Hautauspalvelut ovat monelle suhteellisen vieraita, ja siksi palvelussa olennaisen tärkeää on asiakkaan neuvonta. Valitut UI ja UX-menettelyt mahdollistavat sen, että Memoria voi opastaa asiakasta hautausprosessin edetessä ja kertoa, mitä asiakkaan tulee tehdä hautauksen suorittamiseksi. Sovellus antaa Memorialle välineen tuoda neuvonta luontevaksi osaksi digitaalisia kanavia. Palvelun sisältöjä voidaan kehittää tarkkarajaisesti analyytikan avulla, sillä opimme koko ajan enemmän siitä, kuinka käyttäjät palvelussa toimivat. Palvelua on helppo parantaa jatkuvasti lisäämällä tiettyihin kohtiin tarkempaa neuvontaa ja ohjeistusta.ToteutusPalvelun sisällönhallinta rakennettiin WordPress -julkaisujärjestelmän päälle, jonka toiminnallisuudet mahdollistavat esimerkiksi sähköpostien lähettämisen ja PDF-tiedostojen luomisen sivustolla. Koska WordPress on avoimen lähdekoodin järjestelmä, voimme pyörittää Memorian sivustoa omilla palvelimillamme. Tämä on tärkeää, sillä palvelun kautta kulkee runsaasti arkaluontoisia tietoja, joita emme halua luovuttaa suljetuille järjestelmille. WordPressilla on myös erinomainen rajapinta Memorian sovelluksen kanssa kommunikointiin ja se mahdollistaa pitkälle viedyn datan mallintamisen. WordPressin ansiosta Memorian palvelun ylläpitäjillä on nyt tehokkaat ja helppokäyttöiset työkalut hallita palvelussa olevaa sisältöä, kuten hautaustoimistojen tietoja.Verkkopalvelun käyttöliittymä toteutettiin React -kirjastolla. React oli looginen valinta, sillä se on integroitavissa vahvasti WordPress-sisällönhallintajärjestelmään ja mahdollistaa hyvin interaktiivisten käyttöliittymien rakentamisen. Kun sovelluksen front-end ja back-end on rakennettu eri alustoille, back-endin tapahtumat (esimerkiksi PDF-tiedostojen luominen) vaikuttavat vain back-endiin – näin itse sovellus pysyy hyvin nopeana. Animaatioiden luonnissa käytettiin Framer Motion -kirjastoa, joka oli suuressa roolissa luomassa palveluun inhimillistä tunnelmaa.TuloksetMemoria-palvelu on saanut erinomaista palautetta ja nappasi myös kunniamaininnan Grand One 2023-kilpailussa. Alla olevat luvut on mitattu vuonna 2022 sovelluksen julkaisuajankohdasta (huhtikuu) vuoden loppuun.2000+Klikkausta sivustolta sovellukseen1600+Käyttäjää 150+TarjouspyyntöäEvermade on ollut joustava, mutta suoraselkäinen kumppani uniikissa projektissamme. He ovat sekä kuunnelleet että aloittaneet aktiivisesti keskusteluja, joiden pohjalta on osattu tehdä oikeat ratkaisut.Eero HonkanenMemoriaTämän ainutlaatuisen projektin parissa työskentely on ollut hyvin mielenkiintoista. Memorian tiimillä oli vahva visio siitä, miltä palvelun tulisi näyttää ja tuntua. He ovat alansa todellisia suunnannäyttäjiä ja meille on ollut todella opettavaista toimia heidän digitaalisena kumppaninaan.Antti SartjärviKehittäjä, Evermade Next caseGranlund"
year_published = 2025
year_updated = 2025
