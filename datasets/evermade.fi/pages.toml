["https://evermade.fi/fi/tyot/ek"]
title = "Elinkeinoelämän keskusliitto EK - Tutustu sivustoon - Evermade"
description = "EK on Suomen elinkeinoelämän ääni, joka kiteyttää ja tuo esille suomalaisen yritysmaailman näkemykset, tukien maan uudistumista ja kasvua."
full_description = "html{background:#05283d}Elinkeinoelämän keskusliitto EKElinkeinoelämän keskusliittoElinkeinoelämän keskusliitto on Suomen elinkeinoelämän ääni. Se tuo esiin ja kiteyttää suomalaisen yritysmaailman näkemykset, tukien maan uudistumista ja kasvua.Elinkeinoelämän keskusliitto pyrkii jäsentensä eli suomalaisten yritysten toimesta vaikuttamaan suomalaiseen yhteiskuntaan. Se levittää tietoa ja käy keskusteluja. Se perustelee, suostuttelee ja välillä sanoo kovastikin. Sillä on agenda: sen varmistaminen, että jäsenyritysten näkemykset otetaan päätöksenteossa mahdollisimman hyvin huomioon.Ek.fi-sivusto kokoaa yhteen liiton linjaukset, strategian ja viestit.Vieraile sivustolla1LähtökohdatEk.fi oli monelta osin vanhanaikainen ja kankea. Sivuston sisältöä ei ollut selkeästi jäsennelty, tärkeimmät viestit hukkuivat muuhun sisältöön ja sisältöjen esitystavat olivat vanhanaikaisia. Sisällön suuri määrä aiheutti haasteita käyttäjille, sillä oikean asian löytäminen oli työn takana. Käytettävyys oli heikentynyt myös ylläpidon osalta, sillä sisällönsyöttö oli turhan monimutkaista ja aikaavievää.Asiat esitettiin staattisessa tekstimuodossa, mikä ei ollut kovin houkutteleva saati nopein tapa saada asia ymmärretyksi. EK viestii pinnalla olevista ilmiöistä. Näiden nostaminen esiin oli tärkeää, jotta sivusto olisi käyttäjälle joka hetkessä ajankohtainen.2StrategiaEK:n sivusto on Euroopan paras vaikuttajasivusto, joka tavoittaa niin päättäjät, median ja jäsenyritykset heille aidosti merkityksellisten sisältöjen kautta. Sivusto tarjoaa talousdataa, joka on helposti kulutettavissa. Verkkosivustolla on käytössä helppokäyttöiset työkalut, joiden avulla EK voi esittää uusimpia tutkimustuloksia ja kohderyhmiä kiinnostavaa dataa.EK haluaa olla näkyvämpi yhteiskunnallinen vaikuttaja. Uudella brändi-identiteellä korostetaan modernia vaikuttajaviestintää. Verkkosivun avulla uusi brändi jalkautetaan suuremmalle massalle.3ToteutusUuden EK.fi-verkkosivuston toteutus aloitettiin tutustumalla perinpohjaisesti vanhaan sivustoon. Sivustolta identifioitiin dataan ja workshop-työskentelyyn pohjautuen sekä suositut ja toimivat sisällöt, että toimimattomat osuudet.Tuloksiin pohjautuen rakennettiin sivuston rautalankamallit ja sivukartta. Asiakas oli vahvasti mukana rautalankojen suunnittelussa, joten näkemys kohderyhmien tarpeiden priorisoinnista tuli hyvin huomioitua tässäkin suunnittelun vaiheessa. Uudella brändi-ilmeellä sivuston ulkoasussa korostettiin asiantuntijuutta, mutta myös lähestyttävyyttä ja leikkisyyttä.Rautalankojen avulla toteutettiin käyttäjätutkimus, jossa eri kohderyhmistä valitut käyttäjät testasivat omia tarpeitaan vastaavia käyttäjäpolkuja klikkailtavan prototyypin avulla.Verkkosivuston sisällönhallintajärjestelmäksi valittiin WordPress sen erinomaisten sisällönhallintaominaisuuksien että helpon räätälöitävyyden vuoksi. Sivusto ei koostu perinteisistä kankeista sivupohjista vaan sen pohjana on moderni blokkiajattelu. Jokainen sivu rakennetaan yksittäistä blokeista, jotka voivat sisältää monipuolisesti erilaista teksti-, kuva- ja videosisältöä. Blokit mahdollistavat sisällöntuottajille työkalut tehdä monipuolista ja näyttävää sisältöä vaivattomasti kuitenkaan brändi-ilmettä rikkomatta.”EK:n verkkosivu-uudistuksen lähtökohtana oli tuoda sivusto nykyaikaan. Tavoite oli luoda helppokäyttöinen, selkeä verkkosivusto, joka palvelee niin päättäjiä, mediaa kuin jäsenyrityksiä. Keskiössä oli tuottamamme mittavan datan visualisointi ja tuominen helposti luettavaan muotoon. Samalla sivustolle tuotiin EK:n uusi visuaalinen identiteetti. Workshoppien ja keskinäisen sparrailun kautta löysimme yhdessä haasteellisiinkin toiminnallisuuksiin ratkaisut. Maalina oli Euroopan paras vaikuttajasivusto ja olemme sitä mieltä, että yhdessä Evermaden kanssa pääsimme maaliin.”– Teemu Lindfors, Communications Officer#e9hubn9da4lf25_ts {animation:e9hubn9da4lf25_ts__ts 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf25_ts__ts{0% {transform:translate(671.878532px,525.619995px) scale(1,0)} 8.333333% {transform:translate(671.878532px,525.619995px) scale(1,1)} 84.166667% {transform:translate(671.878532px,525.619995px) scale(1,1)} 100% {transform:translate(671.878532px,525.619995px) scale(1,0)}}#e9hubn9da4lf25 {animation:e9hubn9da4lf25_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf25_c_o{0% {opacity:0} 8.333333% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}#e9hubn9da4lf38_ts {animation:e9hubn9da4lf38_ts__ts 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf38_ts__ts{0% {transform:translate(715.785980px,644.267517px) scale(1,0)} 8.333333% {transform:translate(715.785980px,644.267517px) scale(1,0)} 16.666667% {transform:translate(715.785980px,644.267517px) scale(1,1)} 84.166667% {transform:translate(715.785980px,644.267517px) scale(1,1)} 100% {transform:translate(715.785980px,644.267517px) scale(1,0)}}#e9hubn9da4lf38 {animation:e9hubn9da4lf38_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf38_c_o{0% {opacity:0} 8.333333% {opacity:0} 16.666667% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}#e9hubn9da4lf51_ts {animation:e9hubn9da4lf51_ts__ts 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf51_ts__ts{0% {transform:translate(715.785980px,848.394012px) scale(1,0)} 16.666667% {transform:translate(715.785980px,848.394012px) scale(1,0)} 25% {transform:translate(715.785980px,848.394012px) scale(1,1)} 84.166667% {transform:translate(715.785980px,848.394012px) scale(1,1)} 100% {transform:translate(715.785980px,848.394012px) scale(1,0)}}#e9hubn9da4lf51 {animation:e9hubn9da4lf51_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf51_c_o{0% {opacity:0} 16.666667% {opacity:0} 25% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}#e9hubn9da4lf64 {animation:e9hubn9da4lf64_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf64_c_o{0% {opacity:0} 8.333333% {opacity:0} 13.333333% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}#e9hubn9da4lf67 {animation:e9hubn9da4lf67_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf67_c_o{0% {opacity:0} 8.333333% {opacity:0} 16.666667% {opacity:0} 22.500000% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}#e9hubn9da4lf70 {animation:e9hubn9da4lf70_c_o 12000ms linear infinite normal forwards}@keyframes e9hubn9da4lf70_c_o{0% {opacity:0} 25% {opacity:0} 30.833333% {opacity:1} 91.666667% {opacity:1} 100% {opacity:0}}5DatavisualisointiElinkeinoelämän Keskusliiton yksi mielenkiintoisimmista sisällöistä on laaja määrä talousdataa eri vuosikymmeniltä.Datan esittämiseksi kävijöille luotiin erillinen konsepti Talouden tilannekuvasta, jonka kautta Suomen talouden tärkeimmät mittarit näkee helposti yhdeltä sivulta. Tarkempaa talousdataa varten eri data jaoteltiin omiin aihealueisinsa Tietoa Suomen taloudesta otsikon alle.Dataa visualisoidessa hyödynnetään vahvaa typografian käyttöä ja uutta väripalettia. Dynaamiset graafit viestivät datan tuloksista todella selkeästi ja luotettavasti EK:n identiteetillä.6TuloksetTulokset puhuvat puolestaan: sivuston käytettävyys vaikuttaa parantuneen monella eri mittarilla mitattuna. Kävijät viipyvät sivustolla aiempaa pidempään, lataavat vierailun aikana enemmän sivuja ja viipyvät myös yhdellä sivulla pidempään. Myös välittömien sivustolta poistumisten osuus on laskenut. Koska suunnittelussa ja toteutuksessa korostettiin pinnalla olevien ilmiöiden nostamista esiin, on EK.fi nyt käyttäjälle joka hetkessä ajankohtainen ja saa vierailijansa uppoutumaan syvemmälle EK:n sisältöön.Kun verrataan ajanjaksoa 6.10. (sivuston julkaisupäivä) – 10.12.2020 edellisvuoden samaan ajanjaksoon, kasvoi vierailijoiden määrä 6,10 %. Sivujen määrä vierailua kohden kasvoi 4,64 %. Asiantuntija-artikkelit keräsivät yli 16 tuhatta sivukatselua, mikä on +189 % edellisvuotta enemmän. Asiantuntija-artikkelit ovat uudella verkkosivustolla helpommin löydettävissä ja sivuston käytettävyys on parempi, mikä tekee käyttäjistä aiempaa sitoutuneempia. Vierailujen keskimääräinen kesto pidentyi yli 44 %, mikä viittaa myöskin sivuston aiempaa parempaan käytettävyyteen. Poistumisaste 6.11.-10.12.2020 laski lähes 9 % edellisvuoden samaan ajanjaksoon verrattuna.Avainlukuja+6,10 %Enemmän vierailijoita sivustolla+4,64 %Sivuja per vierailu+189 %Asiantuntija-artikkelien sivukatselut+44 %Vierailujen kesto-9 %PoistumisasteTiimiBrändi ja identiteettiMilttonTiina KiesiläinenOlli SirénInka MyllysiltaPauli KervinenJesper VuoriPia AlfthanLogon viimeistely:Antero NuutinenSivuston suunnittelu ja toteutusEvermadeRiikka PakarinenTuomas VellingSauli PuukangasKirsi MaijalaTimo SundvikVilma JärvinenJoonas SavolainenAsiakasElinkeinoelämän keskusliitto EKTeemu LindforsRiina KasurinenMari Haavisto"
