["https://evermade.fi/case/slush"]
title = "Slush - Evermade"
description = "We've been blessed with the opportunity to work with Slush since the 2013 event. Learn how we have made their digital presence a better each year."
full_description = "Six years of unique event experiencesWe’ve been blessed with the opportunity to work with Slush since the 2013 event – and even share an office with their inspirational team for almost 2 years. The most interesting challenge has always been the fact that Slush has grown rapidly and the site needs to reflect that. Every year it’s not just a bigger event, but multiple big events. The amount of people updating and further developing the content increased drastically. From Asia to Europe, different languages and content has to be dynamic and easily updatable and manageable. And of course, it also needs to look sexy as hell.An important communication channelSlush.org is under huge pressure to live up to the event’s unmatched atmosphere. It’s also the event’s most important communication channel and ticket sales platform. The website does a fantastic job in channeling the impact and information of the world’s leading startup event to people around the world.Freedom for the content creatorsEverblox makes it possible for the Slush team to express their creativity and big ideas with great freedom and flexibility. Adding, updating and changing content is simple, and the good looks are guaranteed by the underlying block structure.Most people think a digital project either has world-class visuals or is dynamic and easy-to-manage. We want to break that ideology by showing you can have the best of both worlds. Slush.org is a site that really showcases this. Mikael ToivioCo-founder at Evermade We require world-class ambition and passion from the people we work with. Evermade has been our partner for a couple of years now and we don’t see that changing any time soon.Miki KuusiCo-founder, Slush & WoltContact us Next casePorsche"
