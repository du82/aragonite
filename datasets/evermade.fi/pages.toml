["https://evermade.fi/case/rinta-joupin-autoliike"]
title = "Rinta-Joupin Autoliike - Evermade"
description = "We renewed the site of Rinta-Joupin Autoliike, an over-70-year-old business and one of Finland's most successful car dealerships."
full_description = "Rinta-Joupin AutoliikeRinta-Joupin Autoliike is a family-owned business with over 70 years of history and is one of Finland’s most successful car dealerships. Today, the company operates 28 locations across Finland. In addition to buying and selling used and new cars, recreational vehicles and motorcycles, their services include authorized brand maintenance and high-quality general repairs for all makes and models.Visit site“Evermade has expertise and interest in the automotive industry. Our collaboration has worked well, and additional resources for the website project have been provided by Evermade when needed. This is not a single project, but an ongoing partnership, and this has been well understood by Evermade. Evermade demonstrates agility in execution and strong expertise in WordPress as well as in creating integrations. We can have open discussions, and account management and project leadership are handled smoothly.”Susa NiemeläChief Digital Officer, Rinta-Joupin AutoliikeThe starting pointRinta-Joupin Autoliike was looking for a new partner to support their digital sales and had already been developing their sales channels prior to our collaboration. When Rinta-Joupin Autoliike approached us, we evaluated their website and created a proof-of-concept car search engine utilizing React technology. The search engine leveraged Rinta-Joupin Autoliike’s existing car search logic.The structure of Rinta-Joupin Autoliike’s website was already well-developed. Although there wasn’t an immediate project need, there was room for improvement: the website based on headless technology was slow, difficult to maintain and hard to develop further. The pilot model of the car search engine we built demonstrated that car searches could also be extremely fast. We began a deeper exploration of the website and created an architectural blueprint.Multiple integrations to different systemsThe Rinta-Joupin Autoliike website features integrations in two directions. Sales representatives maintain the CRM/ERP system, which contains information about every vehicle and is used when a customer purchases a vehicle or contacts the dealership via the website. We built an integration that transfers data from this system to WordPress, where it is displayed to the user via the website. Meanwhile, the car search engine built with React relies on an external search engine as its backend, with vehicle data fed into it from WordPress.We completely renewed Rinta-Joupin Autoliike’s website. The most critical aspect of the design phase was focused on the user interface design of the business-critical car search engine. The search engine is now significantly more user-friendly: filters are conveniently located on the left, and the vehicles matching the search criteria are displayed on the right.Vehicle search at the core of the renewalThe greatest value we’ve delivered lies in integrating the client’s business-critical CRM system with WordPress and creating a new user interface that allows anyone to browse and search for suitable vehicles effortlessly. The vehicle search is by far the most important and business-critical feature of the website, forming the core of Rinta-Joupin Autoliike’s operations.Rinta-Joupin Autoliike now benefits from the excellent capabilities of an integrated search engine combined with a fast car search built in React. At the same time, content management remains straightforward thanks to the WordPress content management system.Other integrationsWe also integrated a recruitment system into the website, allowing job openings to be displayed seamlessly. Additionally, we implemented an integration through which form submissions from the site (like service requests) are sent to the CRM/ERP system for staff to process. These forms can also transmit images, which is somewhat uncommon for ERP form integrations.Visitors can reserve a vehicle directly from its dedicated page, transitioning to the ERP system to make a reservation payment. Furthermore, a financing calculator was integrated into the individual vehicle pages. This feature retrieves financing details from the system dynamically whenever the user adjusts the calculator’s values. The calculator was built using React to ensure a smooth and responsive experience.Performance and reliabilityThe Rinta-Joupin Autoliike website utilizes Cloudflare CDN to ensure excellent performance and protection against cyberattacks. Additionally, we extensively leverage our own tool Everwatch to monitor all integrations. Everwatch continuously tracks the functionality of integrations and sends real-time alerts to our account and Care teams in case of any issues. This enables us to respond swiftly, particularly to business-critical problems, ensuring uninterrupted operations and reliability. Next caseJohn Nurminen Foundation"
year_published = 2025
year_updated = 2024
