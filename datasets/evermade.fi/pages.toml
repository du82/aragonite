["https://evermade.fi/fi/tyot/m-room"]
title = "My M Room - Uudenlainen parturikokemus - Evermade"
description = "My M Room syntyi kunnianhimoisesta tavoitteesta tehdä parturivierailuista kätevämpiä, kuin koskaan aiemmin."
full_description = "Uudenlainen parturikokemusYhteinen matkamme M Roomin kanssa alkoi vuonna 2018. My M Room syntyi kunnianhimoisesta tavoitteesta tehdä parturivierailuista kätevämpiä, kuin koskaan aiemmin. Natiivisovelluksen rakentamisen sijaan päätimme hyödyntää uutta Progressive Web App -teknologiaa ja sen tarjoamia mahdollisuuksia. My M Room -palvelu soft-launchattiin Suomessa tammikuussa 2019, ja saamamme palaute on ollut positiivista.Tavoitteena asiakastyytyväisyyden kasvattaminenM Room esitteli suomalaisessa parturiskenessä ensimmäisenä tilauspohjaisen mallin, jossa asiakas vain kävelee sisään liikkeeseen. Liiketoimintamalli osoittautui onnistuneeksi, mutta kasvava asiakaskunta edellytti uusia parannuksia asiakasvirran hallitsemiseksi. Asiakkailla oli oltava työkalut odotusajan näkemiseen kaikissa läheisissä parturiliikkeissä ja heidän oli voitava jonottaa kotoa, toimistolta tai vaikka kuntosalilta. Ratkaisumme oli progressiivinen verkkosovellus, joka mullistaa asiakkaiden odotuskokemuksen, lisää parturikäyntien sujuvuutta sekä kasvattaa asiakastyytyväisyyttä. Käyttäjätutkimuksen avulla saimme selville, että M Roomin asiakkaat ovat aktiivisia ihmisiä ja haluavat käyttää aikansa järkevästi. Työskentely, liikunta, ostosten tekeminen ja rentoutuminen ovat heille päivittäisiä rutiineja. Työskentelimme tiiviistii yhdessä asiakkaiden kanssa testataksemme ideaa ja prototyyppiä. Suora palaute loppukäyttäjiltä osoittautui ratkaisevaksi tekijäksi konseptin, suunnittelun ja teknologian vahvistamisessa.KonseptiMy M Room on progressiivinen verkkosovellus, joka mahdollistaa nopean kehityksen ja muutosten tekemisen nopeasti kehittyvälle asiakaskunnalle. Se antaa käyttäjälleen mahdollisuuden järjestää parturiliikkeet oman sijainnin mukaan ja vertailla jonojen pituutta eri parturiliikkeissä. Asiakkaat voivat etsiä vapaita aikoja lähimmistä toimipisteistä ja seurata reaaliajassa jonon kehitystä. Sovellus ilmoittaa käyttäjälle, milloin saapua liikkeeseen saadakseen paikka parturituolista vain 1-15 minuutissa. Näin vältetään turha odottelu. Asiakas säästää aikaa ja parturiliikkeen henkilökunta välttyy liialta ruuhkalta. Jonotusajan arvioimista laskeva algoritmi on parantunut päivittäin lanseerauksesta lähtien, sillä se käyttää reaaliaikaista dataa. Tekninen toteutusMy M Room on yksisivuinen, progressiivinen verkkosovellus (SPA, PWA), joka on rakennettu käyttämällä React JavaScript -kirjastoa sekä Reduxia tilanhallintaan. Progressiivisen verkkosovelluksen avulla voimme tarjota natiivimaisen kokemuksen verkkoselaimen kautta. Voimme päivittää sovellusta helposti ilman, että meidän tarvitsee lähettää uusia versioita sovelluskauppoihin ja odottaa niiden hyväksyntää. PWA oli vielä vuonna 2018 kehittyvä teknologia, ja etenkin Apple iOS -laitteiden kanssa jouduimme löytämään useita luovia ratkaisuja puutteiden täydentämiseksi. Vuonna 2023 Apple vihdoin salli PWA:t myös iOS-laitteille. Androidissa sovellus tuki uusinta PWA-teknologiaa alusta alkaen, myös push-ilmoituksia ja pitkäaikaista offline-välimuistia. Käytimme Reactia luodaksemme sovellukselle mahdollisimman vankan pohjan. Kiinnitimme myös paljon huomiota siihen, että käyttöliittymä tuntuisi inuititiiviselta ja sujuvalta käyttämällä inspiraationa useita natiivisovelluksia.React PWA on vuorovaikutuksessa M Roomin mukautetun backend API:n kanssa. Sovellus vaatii siis online-yhteyden toimiakseen, mutta kaikki sisältö on offline-välimuistissa. API määritettiin ja rakennettiin osana tätä projektia niin, että se vastaisi parhaiten sovelluksen tarpeita.Vuosien varrella sovellusta on uudellenkirjoitettu osittain TypeScriptin päälle.SuunnitteluTavoitteenamme oli tehdä parturikäynneistä sujuvampia, kuin koskaan, ja siksi sovelluksen tuli olla intuitiivinen, helppokäyttöinen ja kevyt. Vaikka PWA on edelleen kehittyvä teknologia, emme halunneet ottaa oikoreittejä, vaan tarjota natiivisovelluksen kaltaisen kokemuksen.Halusimme luoda modernin ja virtaviivaisen sovelluksen, joka antaisi käyttäjälle useita tapoja löytää sopiva parturiaika. Sujuvat interaktiot ohjaavat käyttäjää kohdennetun käyttöliittymän kautta eteenpäin. M Roomin visuaalinen tyyli toteutuu yhdenmukaisena käyttöliittymänä, joka ilmentää brändin visuaalisuutta. TuloksetAika on rahaa sekä M Roomille että sen asiakkaille, ja siksi halusimme luoda konseptin, joka mullistaisi asiakkaiden odotuskokemuksen ja auttaisi M Roomia levittämään liikennettä tasaisemmin parturiliikkeiden välillä. Palvelu lanseerattiin tammikuussa 2019. Jo kahden kuukauden kuluttua luvut näyttivät erittäin lupaavilta. Palaute on ollut erittäin positiivista sekä iOS- että Android-käyttäjiltä.Sivukatseluita on päivässä keskimäärin 10000 ja jonotustapahtumia 500. Kiireisinä aikoina sovellus on tasoittanut asiakasvirtaa parturiliikkeissä, mikä on nopeuttanut palvelua ja vähentänyt henkilökunnan paineita. Päivittäisiä jonottajia~500Bounce rate35%Keskimääräinen aika sivulla02:45 min Next caseSlush"
