["https://evermade.fi/fi/tyot/porsche"]
title = "Porsche - Nopeutta, luksusta & eleganssia - Evermade"
description = "Uudistimme Porsche Suomen verkkosivut. Sivusto on nyt informatiivisempi, käyttäjäystävällisempi sekä helpommin päivitettävissä."
full_description = "PorscheSiirry sivustolleHaasteVanha Porsche.fi oli tullut tiensä päähän. Tekniset valinnat rajoittivat sivuston järkevää kehittämistä ja estivät kustannustahokasta sisällönhallintaa. Sivusto ei vastannut Porschen brändimielikuvaa, inspiroinut tai sitouttanut käyttäjiä eikä siten vastannut markkinoinnin asettamiin tavoitteisiin. Myös sivuston käyttökokemus ontui, eikä asiakaspolkuja oltu suunniteltu loogisiksi.Parempia asiakaskokemuksia ja tehokkaampaa ylläpitoaHalusimme Suomen Porsche-sivuston ja koko maan Porsche-centereiden sulautuvan yhdeksi kokonaisuudeksi. Tavoitteena oli luoda kaikilta osin parempi verkkopalvelu pitäen visuaaliset elementit linjassa kansainvälisen Porsche.com-sivuston kanssa. Tahdoimme sivuston edistävän liiketoimintaa ja tukevan sekä loppukäyttäjien että sisällöntuottajien tarpeita. Asiakkaan tulee löytää hakemansa tieto nopeasti ja sivuston on autettava oikean auton valinnassa parhaalla mahdollisella tavalla. Lisäksi Porschen sisällönammattilaisten tulee pystyä päivittämään sisältöä ja luomaan kampanjoita nopeasti.Nopeutta ja luksustaPorsche edustaa tyylikästä urheiluautoa. Myös sivuston tulee toimia nopeasti ja välittää liikkeen tunnetta, mikä saavutettiin animaatioilla ja automaattisesti toistuvilla videoilla. Porsche on myös todellinen luksusbrändi, mitä ilmaistaan suurilla, tyylikkäillä kuvilla ja kokonaisuudessaan visuaalisesti hienostuneella sivustolla.Vanhasta porsche.fi:stä puuttui Porschen automalliston kunnollinen esittely. Halusimme tuoda tämän uudelle sivustolle selkeällä ja intuitiivisella tavalla. Nyt porsche.fi palvelee paremmin käyttäjää, joka haluaa tutustua mallistoon, ottaa yhteyttä Porsche-jälleenmyyjiin ja varata huoltopalvelun tai testiajon.Sujuvaa sisällöntuotantoaPorsche.fi:n sisällönhallintajärjestelmänä toimii WordPress. Sivusto käyttää modulaarista, avointa lähdekoodia hyödyntävää Everblox-teknologiaa, minkä ansiosta ylläpito pystyy päivittämään sivuston sisältöä nopeasti ja vaivattomasti.Porschen tiimi voi nyt luoda myös ainutlaatuisia ja näyttäviä kampanja- ja esittelysivuja erikseen jokaiselle automallille. Työn helpottamiseksi autojen tiedot noudetaan automaattisesti, mutta sivujen ulkonäköä voi räätälöidä erilaisilla kuvilla ja videoilla. Sisällön luominen ei rajoitu sivupohjiin, vaan erilaisia elementtejä voidaan lisätä, muokata ja poistaa vapaasti säilyttäen kuitenkin yhtenäinen visuaalinen ulkoasu läpi sivuston.TuloksetUusi Porsche.fi julkaistiin 9.12.2019. Tulokset ovat olleet positiivisia, ja sivuston kehitys ja optimointityö jatkuvat. Uudistuksen yhteydessä Porsche julkaisi myös rekrytointikampanjan, joka on osaltaan vaikuttanut tuloksiin.20%Nousuvierailuissa15 %Nousu orgaanisessaliikenteessä50%Nousumobiilivierailuissa Next caseHelsingin kaupunki"
