["https://evermade.fi/fi/tyot/kekkila"]
title = "Kekkilä - Tavoitteellisempaa digitaalista liiketoimintaa - Evermade"
description = "Aloitimme yhteistyön kansainvälisen Kekkilä-BVB:n kanssa tavoitteenamme luoda selkeyttä eri sivustojen välille Kekkilän yritysfuusion pohjalta."
full_description = "Kohti tavoitteellisempaa digitaalista liiketoimintaaAloitimme yhteistyön kansainvälisen Kekkilä-BVB:n kanssa keväällä 2019 tavoitteenamme luoda selkeyttä eri sivustojen välille Kekkilän yritysfuusion pohjalta. Kokonaisvaltaisen uudistuksen tavoitteena oli selkeämpi käyttökokemus ja kustannustehokkaampi kehitys. Pyrimme löytämään ratkaisun suureen sivumäärään, joka tulee tulevaisuudessa kasvamaan entisestään.Hajanaisesta kokonaisuudesta yhtenäiseen palveluunEnsimmäisessä vaiheessa lähdimme liikkeelle uuden organisaation omasta sivusta kekkilä-bvb.comista ja teimme strategiatyötä selvittääksemme eri sivustojen tarkoituksen ja käyttäjäryhmät, jotta uusittava domainrakenne tukisi hakukonenäkyvyyttä parhaalla mahdollisella tavalla. Kekkilän aiemmat sivustot olivat visuaalisesti näyttäviä, mutta käyttäjäkokemus ja tavoitteellisuus oli jäänyt visuaalisuuden jalkoihin. Käyttäjistä kerättyä dataa ei hyödynnetty riittävän hyvin, eikä sivustolle tulevia käyttäjiä onnistuttu ohjaamaan eteenpäin.Projektin alkuvaiheessa suurimpana haasteena oli eri sivustojen yhteensopivuus Kekkilän uudenorganisaatiorakenteen ja brändistrategian kanssa. Seitsemästä hajanaisesta sivustosta osa oli toteutettu B2B- ja osa B2C-fokuksella. Eri sivustot pyörivät eri versioilla samasta koodipohjasta, josta löytyi auditoinnin perusteella teknisiä haasteita. Halusimme muodostaa yhtenäisen, jatkuvasti kehittyvän kokonaisuuden. Koodipohjan tuli olla yhtenäinen ja sivustojen kehitys tapahtua niin, että yhden sivuston parannukset hyödyttäisivät myös muita sivustoja. Liiketoimintayksiköistä lähdimme ensin kehittämään Retail & Landscaping -sivustoja.Projekti alkoi perusteellisella käyttäjätutkimuksella, jonka tavoitteena oli käyttäjäryhmien sekä niiden tarpeiden identifiointi ja palvelupolkujen mallinnus. Vertaamalla nykyisiä sivustoja tavoitteellisiin palvelupolkuihin voitiin helposti havaita kehittämistarpeita ja uusia palveluideoita. Käyttäjälähtöistä kehitystä dataa hyödyntämälläJokaisella Kekkilän sivustolla on omat tavoitteensa, jotka voivat vaihdella sivujen katselukerroista tuotteiden myyntiin, yhteydenottoihin tai jonkin tietyn tiedon löytämiseen. Tavoitteiden saavuttamista varten oli olennaista asettaa jokaiselle sivustolle luotettava mittaus ja seurata käyttäjäpolkuja jatkuvasti.Määrittelimme sivustojen tavoitteet, kävijäryhmät sekä kanavat ja työstimme toiminnan seuraamiseksi raporttipohjan Google Data Studiolla. Sen kautta ylläpitäjät voivat seurata tavoitteiden täyttymistä ja käyttäjien toimintaa reaaliaikaisesti. Sivuston toiminnallisuuksien jatkuva testaaminen auttaa kehittämään Kekkilän sivustoa käyttäjien toiveiden mukaisesti.Aiemmin Kekkilän sivustot palvelivat useita eri asiakasryhmiä eri sivustoilla, ja siksi sivustot kilpailivat keskenään hakukonenäkyvyydestä. Perusteellisen domain-strategian ansiosta pienemmätkin domainit palvelevat nyt eri käyttäjäryhmiä kattavan ylätason navigaation avulla. Olemme panostaneet myös sivuston orgaanisen liikenteen optimointiin, jonka avulla olemme voineet varmistaa Kekkilälle paremman hakukonenäkyvyyden sekä vastata potentiaalisten asiakkaiden hakutoiveisiin.Multisite-sivusto tehokkaalla verkkokaupallaToisessa vaiheessa uudistimme jälleenmyynnin ja maisemoinnin domainit yhdeksi multisite-sivustoksi käyttäen WordPress-sisällönhallintajärjestelmää ja omaa Everblox-ratkaisuamme. Multisite varmistaa, että käyttäjät voivat kirjautua kaikille sivustoille yhdestä paikasta. Sivustojen kieliversiot toteutettiin Polylang Pro -lisäosalla ja sivuston lomakkeet Salesforcella.Kehitimme Kekkilälle myös käyttöliittymäkirjaston, jonka tarkoituksena on vähentää jatkokehityksen kuluja: Kekkilä-BVB voi hyödyntää kehitettyjä elementtejä kaikilla sivuistoillaan, sillä niiden koodipohja on yhtenäinen. Kehitimme Kekkilälle myös uuden verkkokaupan WooCommercen päälle.Uudistimme myös Kekkilä Garden & Hasselfors Garden -jälleenmyyntisivustot yhdeksi multisiteksi, jotta sisällönhallinta helpottuisi ja tehostuisi. Design on yhdenmukainen sivusta riippumatta, mikä tekee jatkokehityksestä kustannustehokkaampaa. Sujuvampaa sisällönhallintaaHalusimme antaa Kekkilän markkinoinnille parhaat mahdolliset välineet sisällöntuotantoon. Sivuston ylläpidon ja päivityksen tuli olla mahdollisimman nopeaa ja vaivatonta. Tämä saavutettiin Everblox-työkalulla, joka räätälöitiin Kekkilän visuaaliseen brändiin sopivaksi. Sisällöntuottajat voivat nyt luoda kokonaan uusia sivuja tai muokata olemassa olevien sivujen rakennetta helposti. Tämä tekee sivuston jatkokehityksestä huomattavasti kustannustehokkaampaa, kuin aiemmin.Multisite-kokonaisuus tekee useiden sivujen hallinnasta helppoa, sillä yhdelle sivulle kehitettyä moduulia voi käyttää myös kaikilla muilla sivuilla. Käyttöliittymäkirjasto puolestaan varmistaa, että Kekkilän ammattilaiset voivat rakentaa uusia sivustoja hyödyntämällä aiemmin luotuja rautalankamalleja. Tämä nopeuttaa merkittävästi sivustojen kehittämistä ja suunnitteluvaihetta.Projekti pähkinänkuoressaKäyttäjäryhmien tarpeiden identifiointi ja palvelupolkujen mallinnusDomain-strategia, jonka ansiosta pienemmätkin domainit palvelevat nyt eri käyttäjäryhmiäOrgaanisen liikenteen optimointi ja hakukonenäkyvyyden parantaminen Yksi multisite jälleenmyynnin ja maisemoinnin sivustoille Tehokas WooCommerce-verkkokauppa Käyttöliittymäkirjasto, jolla voi rakentaa uusia sivustoja hyödyntäen aiemmin luotuja rautalankamalleja Next caseM Room"
