["https://evermade.fi/fi/tyot/mafy"]
title = "Mafy - Sähköisen oppimisen edelläkävijä - Evermade"
description = "Uudistettu mafy.fi on edustava ja tyylikäs sivusto, joka tukee myyntiä, nostaa yrityksen profiilia ja palvelee kohderyhmiään tehokkaasti."
full_description = 'Mafy – sähköisen oppimisen edelläkävijäMafy tarjoaa sähköisiä oppimateriaaleja ja valmennuskursseja lääketieteisiin, kauppatieteisiin sekä teknisille aloille pyrkiville sekä oppimateriaaleja lukiolaisille ylioppilaskokeisiin valmistautumiseen ja opettajille kurssikäyttöön.Uudistettu mafy.fi on edustava ja tyylikäs sivusto, joka tukee myyntiä, nostaa yrityksen profiilia ja palvelee kohderyhmiään tehokkaasti. Myös hakusanatutkimuksen pohjalta tehty kauppatiedesivujen ja mainoskampanjoiden optimointityö tuotti loistavia tuloksia: hakukonenäkyvyys kasvoi huimasti ja verkkokaupan tuotto lähti nousuun.Vieraile sivustollaHaasteena monimutkainen rakenneAiempi mafy.fi palveli kohderyhmiään rakenteestaan huolimatta, ei sen ansiosta. Sivustolla oli paljon hyvää sisältöä, mutta siltä puuttui selkeä hierarkia ja sisältöjen silmäily vei turhan paljon käyttäjän aikaa. Viestit vaativat kiteyttämistä, erityisesti mobiilinäkymiä varten. Pitkien mobiilisivujen asettelu rikkoutui paikoitellen, minkä vuoksi lukeminen oli työlästä ja itse viesti hukkui tekstimassaan. Aiempi sivusto ei toiminut parhaalla mahdollisella tavalla myöskään sisällöntuottajien näkökulmasta, sillä tietoa oli syötettävä moneen eri paikkaan.Aiemmassa ratkaisussa Mafyn sivusto ja verkkokauppa olivat kaksi erillistä järjestelmää, ja yksi tavoitteistamme olikin sivuston ja verkkokaupan yhdistäminen samalle alustalle. Vaikka Mafyn tuotteet itsessään olivat kohderyhmille houkuttelevia, ei sivuston vanha ulkoasu tukenut tätä mielikuvaa parhaalla tavalla. Sivusto ei myöskään johdatellut käyttäjiä ostamaan Mafyn materiaaleja ja palveluita: verkkokauppaan oli vaikea navigoida etusivun kautta, tuotetyyppien eroja oli vaikea ymmärtää ja oikean tuotteen löytäminen oli hankalaa.Tavoitteena moderni ulkoasu ja ostamisen helppousYhteistyömme alussa kenties tärkeimmäksi teemaksi nousi sivuston selkeys. Mafyn haluttiin viestivän vakautta ja luotettavuutta, sillä se tuottaa valtavasti laadukkaita oppimateriaaleja. Samalla mielikuvaa haluttiin tasapainottaa modernilla ulkoasulla ja nuorekkuudella, koostuuhan sen kohderyhmä ensisijaisesti nuorista opiskelijoista.Uudistuksen painopisteinä olivat selkeämpi rakenne ja tarkemmin määritellyt ostopolut, raikas ja moderni ulkoasu, sivustolle saumattomasti sulautettu verkkokauppa sekä käyttäjäystävällisempi mobiilikäyttöliittymä. Myös Mafyn markkinointimateriaalit päivitettiin uuden visuaalisen ilmeen mukaiseksi.Mafyn verkkokauppa toteutettiin WooCommercella kiinteäksi osaksi sivustoa ja valmennustuotteet syötetään nyt WooCommercen tuotteina. Käyttäjän ostopolku toimii sujuvasti ilman kirjautumista. Sivustolle otettiin käyttöön myös markkinoinnin automaatio Active Campaignin avulla."Evermade laittoi kanssamme uusiksi yrityksen ilmeen, verkkosivut ja verkkokaupan. Projekti oli pitkä ja ymmärrettävästi tuli yllättäviä tilanteita puolin ja toisin. Evermade hoiti käänteet hyvin, oli kärsivällinen, ratkaisukeskeinen sekä piti huolen, että kaikki asiakkaan tarpeet tuli toteutettua. Avointa ja rehellistä yhteistyötä, jossa ei näkynyt hassuja lisälaskuja. Projektin johtaminen oli erinomaista ja asiakkaana sai keskittyä ideointiin kun Evermade osasi vaatia ja pitää huolta aikatauluista myös asiakkaan puolesta."Markku PajarinenMafyn myynti ja markkinointiRaikkaampi visuaalisuus ja vahvempi brändiUusi Mafy-sivusto on aiempaa huomattavasti selkeämpi ja ulkoasultaan raikkaampi, mikä parantaa sivustolla asiointia käyttäjän näkökulmasta. Uudistettu visuaalisuus tukee myös Mafyn brändiä ja laatumielikuvaa. Visuaalisen ilmeen lähtökohtana olivat kilpailuedut: pohdimme, miksi joku valitsee Mafyn kilpailijoiden sijaan ja mihin Mafyn menestys pohjautuu. Sivuston ilmeen tuli heijastella Mafyn erityislaatuisuutta, arvoja ja kilpailuetuja sekä vahvistaa brändiä entisestään.Uusi rakenne tekee sivuista huomattavasti helpommin silmäiltävämpiä. Eri tuotetyyppien eroja selkeytettiin merkittävästi: nyt sivustolla tuodaan paremmin esiin itseopiskelun, etäkurssien ja lähikurssien eroja. Etäkurssien suosiota haluttiin kasvattaa entisestään ja itseopiskelijoille myydä lisäpalveluita.Panostimme myös Mafyn hakukonenäkyvyyteen ja sosiaalisen median presenssiin. Hakusanatutkimuksen pohjalta valitsimme hakutermit, joilla halusimme näkyä sekä orgaanisilla, että maksetuilla hakukonetuloksilla. Teemme Mafyn kanssa jatkuvaa yhteistyötä vahvistaaksemme heidän digipresenssiään oikeille kohderyhmille. Selkeä navigaatio ja intuitiivinen ostoprosessiAiemmalla sivulla navigaatio oli laaja ja sai sivuston tuntumaan monimutkaisemmalta, kuin se todellisuudessa oli. Navigaatiossa oli monta päätasoa, sivuston kohderyhmät hämärtyivät ja käyttäjän oli vaikea päästä ostoprosessin alkuun. Vasemman yläkulman navigaatiota parannettiin selkeillä päätasoilla kohderyhmien mukaisesti: Opettajille ja Opiskelijoille.Aiemmin ostoprosessi oli piilotettu useamman klikin taakse. Sivustolla on nyt selkeä ”lmoittaudu”-CTA ja verkkokauppa. Sivuston rakenne tukee ostamista kokonaisuudessaan. Mobiilinäkymissä päätasot tuodaan korostetusti esiin ja muut sivut esitettiin pienemmällä prioriteetilla. Ilmoittautuminen ja ostoskori ovat nyt yhden klikin takana.Sisältöjen kirkastaminen kohderyhmälähtöisestiYliopistoon pyrkivät tuntevat Mafyn erityisesti valmennuskursseistaan. Toisaalta opettajat tuntevat palvelun Mafynetistä ja yo-kokeiden mallivastauksista. Opiskelijoille haluttiin myydä kursseja tehokkaammin, kun taas opettajille haluttiin kertoa kattavammin Mafystä ja sen tarjoamista opetusmateriaaleista. Uudella sivustolla tuotiin siis esiin kaksi viestinnän kärkeä. Mafy halusi myös profiloitua vahvemmin oppimateriaalien kustantajana, ja sivustolla onkin nyt enemmän opettajia varten laadittua sisältöä.Identifioimme Mafylle neljä pääkohderyhmää. Korkeakouluun hakijat etsivät tietoa pääsykokeista ja haluavat tutustua lääketieteellisen, teknisten alojen sekä kauppatieteiden valmennuksiin. Aktivoivana sisältönä sivustolla ovat esimerkiksi yo-kertausmateriaalit, valmennustuotteet ja pääsykokeisiin valmistautuminen. Lukiolaiset ja abit puolestaan käyttävät Mafya kursseillaan sekä valmistautuessaan yo-kirjoituksiin. Heille suunnataan kertausmateriaaleja, valmennustuotteita, materiaaleja kirjoituksiin valmistautumiseen ja muuta lukiolaiselle hyödyllistä sisältöä.Opettajat päätyvät sivustolle yleensä etsimään tietoa, ja heille suunnattua sisältöä ovat esimerkiksi yo-kirjoitusten mallivastaukset, käyttöoikeuksien tilaus ja ohjeet, kurssimateriaalit ja opettajan uutiskirje. Lukion opinto-ohjaajat puolestaan tukevat opiskelijoita ja suosittelevat valmennuksia. Heille tarjotaan opiskeluvinkkejä, muuta opinto-ohjaajalle hyödyllistä sisältöä ja jatkossa myös webinaareja.Ylläpidon helpottaminenAiemmalla sivustolla tietoa oli syötettävä useaan eri paikkaan. Koska verkkokauppa tuotiin kiinteäksi osaksi sivustoa, on kurssien tietoa mahdollista tuoda laskeutumissivuille kootusti. Tämä helpottaa merkittävästi ylläpitäjien työtä.Aiemmalta sivustola puuttui myös paikka artikkelimuotoiselle sisällölle. Mafy tuottaa paljon laadukasta ja kävijälle hyödyllistä sisältöä, kuten yo-kokeiden mallivastauksia, lukuvinkkejä ja pääsykoevinkkejä. Tieto nostetaan nyt aihepiirin mukaan automaattisesti relevanteille laskeutumissivuille.Loistavia tuloksia hakukoneoptimoinnillaTeimme kauppakorkeakoulun sanastoon liittyvän hakusanatutkimuksen syksyllä 2021. Tulosten pohjalta optimoimme kauppiksen sivuja sekä Google Ads-kampanjoita. Kuuden kuukauden jälkeen totesimme, että optimointityön ROI on ollut huikea. Näin hakukonenäkyvyys kauppatiedesivulla on muuttui 1.2.2021 – 30.4.2021 vs. 1.2.2022 – 30.4.2022: Klikit+59.8% Näyttökerrat+423.3%Lisäksi Mafyn verkkokaupan tuottavuus orgaanisen liikenteen kautta kasvoi huimasti joulukuun 2021 alusta helmikuun 2022 loppuun verrattuna edellisvuoden samaan ajanjaksoon:Verkkokaupan tuotto+188%Konversiot+57%Transaktiot+260%Myös Yo-kertausmateriaalien sivu uudistettiin hiljattain siten, että jokainen aine lisättiin sivulle erikseen. Ainekohtaiset sivut ovat nousseet nopeasti Googlen hakutulosten kärkeen.Lue lisää blogistamme Next caseDiakonissalaitos'
