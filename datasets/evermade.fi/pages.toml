full_description = "Digital minds, human hearts.We are developers, designers and analysts. We are open, curious and hungry. We are queer, straight, and explorers. We are cyclists, gamers, and bakers. And we are so much more.CareersOur valuesHonestyWe assume honesty and we bet on transparency. We speak out even if it’s tough – because that can only help us grow. Great trust means freedom, and with freedom comes responsibility. Taking responsibility and being open and honest are the guiding principles for all of us and enable us to do our best.CuriosityThe business of the web is constantly moving. To be continuously relevant, we have to be curious about our craft as individuals. We test, we explore, and we always strive towards the next iteration. We believe that the fear of trying kills more dreams than failure ever will.MasteryWe are obsessed about our craft. We study our clients carefully to understand their business and to serve them better. We master the technical ins and outs in order to give our clients the best tools to dream big with their brand. We are resilient problem-solvers that never hide from challenge or responsibility.HeartfeltWe believe that inclusion facilitates innovation and diversity improves creativity. We always strive to notice, help and support each other — even when it requires some tough love. We share both the wins and the losses with our team. We always have our clients’ best interests in mind and we want to repay their trust in us. We want to delight them even when it doesn’t benefit us in the short term.Riikka PakarinenCEO+358 50 539 9760riikka.pakarinen@evermade.fiJenni SoudunsaariAccount Director+358 50 40 89360jenni.soudunsaari@evermade.fiKirsi MaijalaHead of People and Culture+358 50 5895781kirsi.maijala@evermade.fiEmilia TuuralaProject Manageremilia.tuurala@evermade.fiMarkus HaaparantaSenior Project Managermarkus.haaparanta@evermade.fiLaura PuskaService Managerlaura.puska@evermade.fiJuha WalleniusAccount Directorjuha.wallenius@eve