["https://evermade.fi/case/pohjola-rakennus"]
title = "Pohjola Rakennus - Helping people find their dream home - Evermade"
description = "Pohjola Rakennus wanted to stand out from its competitors. We achieved this by creating a visually stunning, user-friendly website."
full_description = "Find your dream homeIn collaboration with the creative agency Sherpa, we renewed the brand and website of pohjolarakennus.fi. Pohjola Rakennus has over 30 years of experience in creating comfort zones for its customers, employees and partners. It designs and builds more than 2,000 homes each year, combining a good location with a functional floor plan and quality materials.Launch siteThe challengePohjola Rakennus’ old brand visuals didn’t reflect the company’s current market position as a leader in the construction industry or present homes in an attractive way. The site wasn’t user-friendly or intuitive enough: it was hard to navigate and the apartment search function caused trouble for users, since it was slow and didn’t offer enough search criteria.The search feature is the most important part of the Pohjola Rakennus website. Creating a better, quicker and a more informative search function was crucial to make sure users could find their dream home as effectively as possible.On the new site, Pohjola Rakennus wanted to drop the dull, conventional way of showcasing homes. The business wanted to stand out from competitors and create a memorable experience for visitors. Our objective was to achieve this target by creating a user-friendly website that was true to the visually stunning new brand.A new brand identityThe project started with a thorough renewal of Pohjola Rakennus’ visual brand identity. The company wanted to have the best possible visual and technical end-result and offer a top user experience to the people interested in their homes.The brand work and new visuals for the website were done by Sherpa, a Helsinki-based creative agency. Because the main focus was to convert users to customers, we developed user paths based on user profiles together with Sherpa’s team. The Pohjola Rakennus case is a great example of seamless cooperation between a brand agency and a digital agency: all parties involved are very satisfied with the collaboration and the outcome of the project.Evermade did a very good technical implementation of the website as a part of Sherpa’s brand renewal for Pohjola Rakennus. They also gave us valuable insight on usability that helped everything run smoothly from the very moment the new site was launched. I can warmly recommend Evermade even for tight schedule projects, since their project management skills are first-rate.Jukka NiittymaaSales Director at SherpaTechnical implementationWe were responsible for the technical implementation of the project. The site is made with Everblox, our way of building easily manageable sites that allows content creators to have full control over a site’s content and create visually stunning pages. A dynamic filtering option and search features help users find exactly what they are looking for.An important part of the Pohjola Rakennus site is a PDX+ integration. PDX is a customer relationship management platform that helps real estate businesses manage information on housing projects and vendible apartments. We extended Pohjola’s existing PDX integration by adding detailed apartment information and connected the data of buildings, apartments to the cities and neighborhoods together. The PDX data integrates seamlessly into WordPress, from where we display it in a fast and robust way with a React application. Various filters and search functionalities help Pohjola Rakennus’ customers find their dream home.The outcomeThe site was launched in September, and feedback has been extremely positive. We are happy with the outcome, as it functions just as planned. The base for the site is now technically solid and user-friendly, making Pohjola Rakennus stand out among competitors.We are now providing Pohjola Rakennus with continuous site optimization, analytics work and search engine marketing. In the upcoming months, the site will be improved even more: we are planning to add more functions like maps showing information about the apartments’ neighborhoods. Choosing the right apartment will be even easier when schools, public transport options, grocery stores, and pharmacies are presented clearly on a map.Evermade has by far been among the best technical partners I’ve worked with. They knew how to work with our design and were able to do the technical work very smoothly. Because of their expertise and vision, I did not feel unsure about our partnership at all.Emma InkinenProject Manager at Sherpa Next caseThe Qt Company"
year_published = 2025
year_updated = 2024
