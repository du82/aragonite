["https://evernote.com/privacy/policy"]
title = "Privacy Policy | Evernote"
description = "Our note taking app helps you capture and prioritize ideas, projects and to-do lists, so nothing falls through the cracks. Start your free trial today!"
full_description = "Privacy PolicyEffective Date: March 20, 2024If this Policy is translated into any language other than English, in the event of a conflict, the English language version shall govern to the fullest extent permitted by applicable laws.Return to Privacy CenterIntroductionWe’re Bending Spoons S.p.A. (“we” or “us”), the parent company of Evernote Corporation (“Evernote”). With this privacy policy, we explain what information we collect, use, and disclose about you when you access or use Evernote websites and applications, which we refer to collectively as the Evernote Service (defined in the Glossary), contact the customer service team, engage with us on social media, or otherwise interact with us.We provide this privacy policy in accordance with Regulation (EU) 2016/679 – General Data Protection Regulation (“GDPR”), the Italian Legislative Decree 196/2003 (as amended), and other applicable local laws, as amended or replaced (collectively, “applicable privacy laws”). Please note, if you are an Individual Account user, you are both the Account Holder and End User of an Evernote Service account. If you use Evernote Teams, the Account Holder is the Customer who has contracted with Evernote as defined in the Evernote Teams Agreement and the End Users are the individuals whose user accounts are linked to that Evernote Teams account. You can find these and other defined terms used in this policy in the Glossary. If you are an End User of an Evernote Teams account, please note that the Account Holder of your Evernote Teams account (such as your employer or organization) may have established its own rules regarding End Users’ access, use, disclosure, or retention of data stored in that account. Also note that while an Administrator of an Evernote Teams account has access to the End User accounts linked to that Evernote Teams account, an Administrator cannot access any other accounts that are not linked to the Evernote Teams account. You can find more information on how your individual Evernote Service account works with your Evernote Teams account by visiting https://help.evernote.com/hc/articles/209005287. Although significant changes are rare, this policy may be amended as new features, technology, or legal requirements arise, so please check back from time to time. We’ll notify you if we make a significant change and, where required, seek your consent.Who is the data controller and data protection officer?Bending Spoons S.p.A. is the data controller. We’re an Italian tech company based in Via Nino Bonnet 10, Milan, MI 20154. Our VAT number is 08931860962.For any requests about how we use your personal data, you can email us at privacy@evernote.com or contact our Data Protection Officer at dpo@bendingspoons.com.What data do we collect? You can input, upload, or store in the Evernote Service any text, images, and other data that you choose—we refer to that information as “Content”. We also collect the following types of personal data:Basic subscriber information. To open your account and process payments, we collect personal data like your email address and, depending on how you purchase a subscription to a Paid Service, your billing address and other payment information. We also may link your subscriber information with data we collect from our partners and other third parties to help understand your needs and provide you with a better experience. For example, if you create or log in to an Evernote account using your Google Apps credentials via single sign-on, we will have access to certain information such as your name and email address as authorized in your Google Apps profile settings. Usage data. We collect and log Internet or other electronic network information on how you and others access and use Evernote, for example, the act of creating a note or sharing a note. Usage data may be collected through cookies and similar technologies. For more information, including how to opt-out, visit our Cookie Notice. Location information. We collect the IP address you use to connect to the Evernote Service and — if you choose to share it — your location information from a mobile device. Device information. We collect information about the number and type of devices you use to connect to the Evernote Service, as well as information about the operating systems on those devices (e.g., iOS, Android, Windows) and the version of Evernote. For example, when you install, modify, or use an Evernote application we may collect personal data in order for the services to function properly, such as your device’s unique hardware identifiers (IMEI, SIM number, or other identifier). When you install, modify, or use an Evernote application, you may see permission requests or alerts regarding the device capabilities the application could potentially use.In addition, we collect the following types of personal data when you use the Evernote Service:Type of InformationPurposeYour username, email address, and contact preferencesTo create and support your Evernote Service account. To communicate with you. To enable other users to collaborate with you through Collaboration Features (such as shared notes and notebooks). In accordance with your communication preferences, to send you information about Evernote features, products, and services that can enhance your use of the Evernote Service. To verify your email address to help prevent spam, fraud, and abuse.Your name, image, and other personal information, if you choose to share itTo display in your user profile, which may be visible to those with whom you share Content.The geographic area from which your computing devices interact with the Evernote Service, your preferred language, and, if you select the option to share it, your mobile device location informationTo localize your interaction with the Evernote Service by, for example, displaying web pages or user interfaces in your preferred language, showing you website content or pricing information appropriate to your location, and improving features like search by allowing you to filter results by location.To help you monitor use of your account, we make recent IP address history available to you through your account settings.To assist us in complying with legal restrictions that may limit the permissible use of the Evernote Service.To enhance your Content with location information.To help you discover relevant content.Your device informationTo show you (on your account’s Access History page) which of your devices you have authorized to access your Evernote Service account and when you last accessed the Evernote Service from each device.To inform our product development and marketing efforts, including our advertising efforts as described on our Cookie Information page.To allow you to redeem a promotional offer.To provide account support.Together with purchase information, to help us comply with export laws.Your telephone number, if you choose to share itTo help prevent spam, fraud, and abuse.To enable other users to communicate with you through Collaboration Features.To show in your user profile, if you choose.In accordance with your communication preferences, to send you information about Evernote features, products, and services that can enhance your use of the Evernote Service.Your calendar information, only if you select the option to share itTo enhance your notes with calendar information.To show you relevant Content to which you have access and to help you create and remind you of Content.Actions you perform when using the Evernote Service (e.g., creating a note or sharing a note)To administer the Evernote Service and to improve the features and usability of the Evernote Service.To suggest Evernote features, products, and services that can enhance your use of the Evernote Service.To provide account support.Whether your account was created or referred through a reseller or other partner who helps distribute or promote Evernote accountsTo determine the amount of revenue share payments to make to partners with whom we might have such arrangements and to provide aggregated and/or anonymized revenue share reports. These partners could include resellers or distribution partners.Your payment information, if you purchase a subscriptionTo process your payment.Your photosTo enable you to use photo-related features such as adding a photo to a note via camera capture or on-device photos.Your contactsTo auto-complete email addresses when you share Content.To display photos of your Evernote contacts (from their Evernote profiles) when they are viewing shared items.To save scanned business cards.A record of the source website from which you save ContentIf you use the Web Clipper browser extension or “Save to Evernote” button, to record in the note created by Web Clipper the source of the material you’ve chosen to clip (e.g., the URL) for your future reference. This source-recording functionality will not be affected by your browser’s do-not-track settings.Please Note: If you have installed Web Clipper, when you visit certain websites, Web Clipper may notify you of available integrations with the Evernote Service or about products, services, or features that we think will help you get more out of the Evernote Service. Web Clipper does not track or create a record of your browsing activity.Additional information we collect in connection with Evernote Teams accounts:Type of InformationPurposeEmail address of Account Holder and End UsersTo create and support the Evernote Teams account.To communicate with the Account Holder and End Users of the Evernote Teams account in accordance with communication preferences.To enable Account Holder and End Users of an Evernote Teams account to use Collaboration Features.To verify Account Holder’s and End Users’ email addresses to help prevent spam, fraud, and abuse.Billing information (e.g., postal address, email address, and telephone number)To communicate with the Billing Contact on the account and provide account support.Employment-related personal information (e.g., your business title) – if you choose to share itTo display in your Evernote Teams account user profile, if you choose.If you visit an Evernote website, we may also collect:Type of InformationPurposeYour name, company, email address, phone number, and other information you choose to shareTo communicate with you, including to answer press or partnership inquiries.Information from cookies and similar technologiesPlease see our Cookie NoticeInformation we deriveWe may derive information or associate categories with you based on the information we or our providers collect. For example, we may make a determination about your location based on your IP address. How do we use your data?We have specific rules for how and when we use the personal data we collect. We are committed to protecting the privacy of your personal data. We use the personal data we collect to: Perform and personalize the Services. We use your personal data to provide you the Evernote Service, including to process transactions with you. We use a number of technologies to help you get the most out of the Evernote Service. Our systems automatically analyze your data to power Evernote features and to continually improve the Evernote Service for you in a way that does not require anyone to look at your Content. This may include, for example:- Making sure you find what you’re looking for when you search your account.- Showing you information most relevant to how you are or could be using the Evernote Service at a specific time or location.- Suggesting actions for you to take based on information you’ve stored.- Suggesting Evernote Service features or products to you that we think will help you get the most out of the Evernote Service.- For Evernote Teams users, recommending people for you to collaborate with.These activities are based on the contract we have with you (Article 6.1.b GDPR).Maintain and improve the Services. To provide troubleshooting and customer support, the Customer Support team may need to access your personal data, such as your account email address and information about the Evernote application you are using, subject to the protections described below. We may also use your personal data to improve the Evernote Service such as debugging to identify and repair errors that impair existing intended functionality, conducting research for technological development and demonstration, and analyzing information to maintain or enhance the quality or safety of the Services. We will not use your Input or Output from an AI Feature (as defined in the Supplemental Terms) to train our artificial intelligence models or tools unless you direct us to do so.The activities performed for customer support are based on the contract we have with you (Article 6.1.b GDPR). When you give customer support permission to access your Content, these activities are based on your consent (Article 6.1.a GDPR). The activities performed for troubleshooting, debugging, and service improvement are based on our legitimate interest to ensure the quality and the proper functioning of the services and improve the products (Article 6.1.f GDPR).Protect against security threats, abuse, and illegal activity. As part of our efforts to protect your account and the functionality of the Evernote Service, our systems may analyze the emails you send to and from your Evernote account and the notes you share to detect spam, malware, or other potential security concerns. If we determine that such material constitutes a Terms of Service or User Guidelines violation, we may block delivery of or unshare the problematic material, much like a spam filter works for your email inbox.These activities are based on our legitimate interest to ensure the quality and the safety of the services (Article 6.1.f GDPR).Learn more about steps you can take to protect your account, such as using strong passwords, two-step verification, and encryption.Communicate with you. We use your personal data to communicate with you in order to send important Service messages such as administrative messages, technical notices, or security alerts. If we learn of a security system breach, we may attempt to notify you and provide information on protective steps, if available, through the email address, phone number, or other contact information that you have provided to us or by posting a notice on the Evernote website and/or via other communication platforms. Depending on where you live, you may have a right to receive such notices in writing.This activity is based on the contract we have with you (Article 6.1.b GDPR).Comply with laws. We also use information to satisfy applicable laws or regulations, and disclose information in response to legal process or enforceable government requests, including to law enforcement. For more information, please visit the section “How do we respond to legal requests for my information?” of this Privacy Policy.When this activity is required"
