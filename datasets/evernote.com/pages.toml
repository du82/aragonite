full_description = "Why choose Evernote?With Evernote, you have everything you need to keep life organized. Use it for note taking, project planning, and to find what you need, when you need it.Get Evernote freeAlready have an account? Log in nowEvery day and in every way, Evernote is there for my work and my life. It's my most used app, both at my desk and in my pocket.Colin Whalen, Evernote Certified ExpertYour second brainCapture everything that is, was, or could be important, and access it on all your devices.Flexible organizationEvernote doesn’t force you to organize a certain way. Create a system of notebooks or don’t organize at all. Any note is a quick search away.Available everywhereHave an iPhone and a Windows computer? Android and Mac? Unlike most note-taking apps, Evernote works on them all.Web ClipperSome note-taking apps strictly limit what you can save online. Evernote’s Web Clipper lets you save and annotate web pages, images, and PDFs.Character recognitionFind notes by searching for keywords, even if the words appear in photos, whiteboard scans, business cards, handwriting, or documents.Web applicationMany note-taking apps lack a fully functional web application. Evernote Web offers a complete lineup of features from any major browser.App integrationsEvernote works with the apps you rely on, including Google Drive, Slack, Outlook, and Gmail.Feel the calm of being more organizedGet Evernote freeHit every deadlineLink notes containing important action items to your calendar events, and Evernote will surface the info you need—right when you need it.Discover note takingCapture more than wordsGet ideas down fast and combine them with images, sketches, documents, and audio recordings to turn passing thoughts into plans for action.Find out moreFind it fastKeep all your project materials in one place—including checklists, emails, and PDFs. Smart search puts it all at your fingertips.Check out advanced searchMore than a notebookMeetingsMake meeting prep a breeze by linking notes to your calendar events.To-dosGive your memory a break by adding reminders to your tasks.ProjectsCustomize your Home to show everything you need for your next big project.Professional goalsQuickly create the perfect plan to help you get organized—and get ahead.SchoolStay on top of your assignments and never miss a due date.WritingExpress your ideas and find them quickly with search and keyword tags.VacationsLet yourself relax. Keep the info you need for your getaway all in one spot.PetsWalking schedule—check. Vet’s number—check. The mess on the rug—uhh...Get Evernote free"
