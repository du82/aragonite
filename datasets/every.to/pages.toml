["https://every.to/context-window/what-actually-matters-and-what-doesn-t-for-deepseek"]
title = "What Actually Matters (And What Doesn’t) For DeepSeek"
description = "Allow us to explain why your 401k is down"
full_description = "Vinay Korrapati 29 days ago Terrific analysis, thank you. The DS ‘event’ has hastened the AI value pool accretion tilt towards the application layer. While their 6M training cost is suspect, their reasoning and architectural approach, which you have so beautifully highlighted, will hopefully lower the cost of intelligence for vertical-specific use cases. ♡ 0 · Reply Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. Alex Duffy is the consulting lead and a staff writer who writes about AI tools and technology in Context Window. Edmar Ferreira is an entrepreneur in residence at Every and the founder of EverWrite, an AI SEO company and content marketing leader in Latin America. News of DeepSeek’s R1 model, released last week, has sent shockwaves through the tech world. Like many of you, we at Every have been captivated by the Chinese startup’s inexpensive, high-performing model, and the innovations that were necessary to achieve it. As for the implications? There’s a lot to reckon with, and we’re still only just figuring out what this new model can do. Investors mostly felt R1’s arrival on the scene wasn’t positive news for AI’s U.S.-based incumbents, and shares of Nvidia and other chip makers were hit particularly hard. Builders, meanwhile—including some of us here at Every—are pretty excited. Because there’s so much to unpack, we’ve pulled together three of our writers to each tackle one aspect of the news that struck them, and where they see things going. Alex Duffy breaks down the innovations that led to R1 achieving a 90 percent cost reduction in performance compared with OpenAI’s o1 model. Entrepreneur in residence Edmar Ferreira discusses the immediate implications for people looking to build AI-based applications. Finally, Evan Armstrong talks about the markets’ (over-re)reactions. Most large language models (LLMs) rely on reinforcement learning (RL) to refine how “helpful and harmless” they sound. Notoriously, OpenAI has used cheap labor in Kenya to label and filter toxic outputs, fine-tuning its models to produce more acceptable language."
