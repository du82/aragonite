["https://every.to/chain-of-thought/how-hard-should-i-push-myself-83986449-8ffb-40de-9e61-214dd387b6b8"]
title = "How Hard Should I Push Myself?"
description = "What the science of stress tells us about peak performance"
full_description = "George Levin over 1 year ago Stress is similar to caffeine. When used judiciously, it can enhance your productivity. However, when abused, it can take a severe toll on you. ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Hey! Dan here. Today, a new book was published by my favorite neurobiologist, Robert Sapolsky. It's called Determined, and it's about why science says we have no free will, and how we might best live once we accept that. I have a review of it coming for you on Friday, and to whet your appetite, I’m sharing an article I wrote about one of his previous books, Why Zebras Don’t Get Ulcers. It’s one of the most popular articles I’ve ever written—I hope you enjoy it. It’s a question I ask myself a lot, and I bet you do, too. On the one hand I really want to push myself. I’m ambitious, and I want to leave it all out on the field. Some of my peak work moments have come when I’ve pushed myself to a place where I didn’t think I could go. We all have more ability to adapt to stress and pressure than we think we do.﻿ On the other hand, I want to be kind to myself. I question how much the drive to push myself is to make up for something that I feel is missing or inadequate—and whether pushing myself will fill the hole. I sometimes wonder whether letting myself off the hook is just laziness masquerading as self-care. It’s hard to tell. But I also wonder whether pushing myself might, in fact, kill me. Constant pressure creates chronic stress, and there are many scientific studies that show that chronic stress is harmful. It makes you more susceptible to heart disease, it makes it harder to recover from illnesses, and it can affect your sleep and even your working memory. Then there’s a wealth of literature (and conversations on Twitter/X) that says that stress is actually good for you. In order to understand the question I posed at the top—how much we should be pushing ourselves—we have to better understand stress. We need to understand what the stress of pushing ourselves does to our bodies, how much we can take of it, and how we can, hopefully, learn to cope with it better."
