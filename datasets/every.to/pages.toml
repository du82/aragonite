["https://every.to/napkin-math/why-is-jensen-huang-120-billion-richer-than-you"]
title = "Why Is Jensen Huang $120 Billion Richer Than You?"
description = "Hint: Nvidia’s success is based on much more than chips"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. Quick heads up: Today is the last day of the early bird discount for my course, How to Write With AI. The four-week cohort-based class runs from February 13 through March 6 and includes: Over 90 students—including founders, aspiring writers, engineers, and professors—have already taken the course. Check out the website for more information and to enroll. Act quickly: There's a $300 early bird discount, and if you register by January 25, you’ll jump ahead of the nearly 10,000-person waitlist for our new AI email tool Cora: First: Huang’s story is the rousing, full-chested, only-possible-in-America narrative that we all love. His Taiwanese parents sent him to live with his aunt and uncle in the United States as a child. In the hopes of getting him into a good college, they shipped him to a boarding school in Kentucky. His parents didn’t understand that this wasn’t a fancy college prep school but a reform school for troubled children. Still, Huang made it through alongside roommates with knife scars and tattoos. Then, through a combination of his work ethic, technical prowess, long-term thinking, and a generous cash infusion from Sequoia Capital, he spent 30 years building a company whose silicon chips are almost single-handedly powering the AI revolution. Nvidia is now worth $3.45 trillion, and Jensen alone is worth $120 billion. This is amazing, laudable, and inspiring. It has all the story beats of a good opening segment on 60 Minutes. Yes, Jensen is an immigrant. Yes, he is incredibly hard-working and charming. Yes, he created a technology that no one had the guts to dream of despite it being unclear how it would be used in the future. Yes, he built a unique culture of hard work and focus that stands out from the lackadaisical nature of many big companies. However, Nvidia stumbled upon most of the use cases—including AI training runs and crypto mining—that it’s powering with its technology. It did not invent the transformer, nor did it buy Bitcoin in 2013. Huang saw that his company's chips, originally intended for gaming, could be used for so much more, and then bet the farm on that direction, with no idea of the destination. It was a combination of ambition, patience, and a whole lot of self-made luck."
