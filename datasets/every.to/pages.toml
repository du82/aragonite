full_description = "AIQUIS GOMES 2 months ago Hey, guys. I'm a paid subscriber but I'm blocked by the paywall in this text. Can you help? ♡ 0 · Reply The company first teased Sora in February, but until now it was only available to a small group of testers. But now, subscribers in select countries can prompt the model, called Sora Turbo, with text, images, and videos in order to generate clips up to 20 seconds in length at 1080p resolution. Sora isn’t just a video generator, but a full video-editing platform, complete with creative tools. In order to make Sora something special, the company knows it’ll need to compete not only with other AI tools but with legacy video-editing platforms, too. We did a vibe check with the Every Studio team about their first impressions of Sora and surveyed the tech landscape. Here’s what they think, and what’s new. What’s new with the Sora Turbo model—beyond being faster and more cost-effective than its predecessor, Sora—are the features that OpenAI has built on top of the video editing interface: And then there’s the social feed: a creative gallery where users can share videos, tweak prompts from featured videos, and co-create with other producers. OpenAI delayed the release of this model for nearly a year in order to ensure it’s not prone to spreading harmful content, such as disinformation. In that regard, there are some limitations: All videos are watermarked, and you cannot use it to generate sexually explicit deepfakes. “We want to prevent illegal activity of Sora, but we also want to balance that with creative expression,” Sora product lead Rohan Sahai said during the livestream event. “We know that...will be an ongoing challenge, we might not get it perfect on day one.” We write, and then we build. If you’re a fan of Every's writing, you’ll probably like the products we’ve made to make thinkers more efficient: Spiral to automate repeat writing tasks, Lex to help you write better, and Sparkle to clean up your desktop—for good. With our last discount of the year, we're offering the whole package of writing and software for 33% off."
