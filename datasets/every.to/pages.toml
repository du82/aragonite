["https://every.to/p/how-to-know-it-s-time-to-pivot-your-startup"]
title = "How to Know It’s Time to Pivot Your Startup"
description = "A process-oriented approach that helped Hoop find its fit"
full_description = "Stella Garber is the co-founder and CEO of Hoop. Previously, she led marketing at Trello, building the team as its initial marketing hire to Atlassian's acquisition and beyond. Stella Garber knows when it’s time to pivot—she’s done it. Recognizing that her company’s decision-making software was stuck with sluggish growth, she and her team made the difficult decision to halt its development and turn their attention to an AI-based task management app called Hoop. In this essay, the third in her series on business frameworks, Stella reflects on this decision and how she and her team figured out what’s next, and offers guidance to founders who sense they’re at a crossroads with their companies.—Kate Lee We had spent the nine months prior building an app that helped teams of people make better decisions faster at work. Employees could pose questions to one another and independently chime in to reach a decision without biasing each other with responses. The problem was that, while many individuals liked our app, they struggled to get their coworkers on board. As a result, we weren’t growing at the rate we needed, and as the CEO, I was worried that my own team was starting to lose morale. In the spirit of practicing what we preached—making better decisions faster—we had to be honest with ourselves: It was time to pivot. Fast forward a year. Our new product is called Hoop, an AI-first task manager. Many of the people we surveyed when we were building our initial product were overwhelmed by everything going on at work, between endless meetings and active Slack workspaces. They worried about missing important tasks and didn’t have consistent ways of staying on top of them. Hoop solves this by automatically capturing tasks across meetings, Slack, and email. You connect Hoop to your tools—your work email, calendar, and Slack—and tasks automatically populate in a to-do list where you can manage everything in one spot. No more missing tasks, writing things down frantically during meetings, or marking messages as “Unread” in Slack for later."
