["https://every.to/napkin-math/vibes-based-search"]
title = "Vibes-based Search"
description = "The next big disruption in software is here, and it understands what you’re looking for better than you do"
full_description = "Claire Bouvier 6 months ago Love this! Just shared it on LInkedin - Human Centric AI is where it's at! Thank you!!! ♡ 0 · Reply Jennie Pakula 6 months ago Great post ... but you nearly lost me in the first paragraph, stating that we have 'the total sum of human knowledge in our hands'. ♡ 0 · Reply Sacha Horowitz 3 months ago There is a special vibe to Evan's articles. I wonder about the writing with AI course. ♡ 0 · Reply Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. The next big disruption in software is here, and it understands what you’re looking for better than you do But “best hiking trails AND iceland AND reddit” is simply not how humans think. As I’ve discussed previously, much of our intellectual labor happens in the subconscious, in the elements of taste that make up how we process thought. We think in vague terms, like, “Flights to Iceland are cheap, I’ve heard the hiking there is pretty good.” Put simply: There is a vibe to how we think that is lost when we transform our questions into something Google search can understand. The good news is that LLMs are the first technology that is explicitly trained on those subconscious elements of thought. Rather than rely on boolean searching—the borderline hieroglyphic set of logic rules you can use to make Google search more precise—you can fine-tune an LLM to think the way you do. That way, instead of mustering up the perfect search terms, you only have to wave in the direction of what you are looking for. You can type, “I’ve heard Iceland hiking is good, anything under five miles that's kinda epic?” and get a list of solid options instead of getting stuck in SEO hell. I call it “vibes-based search.” And it represents a profound evolution in the way we find and interact with information online. By making a large language model the principal technology in a search engine, vibes-based search evolves the process beyond carefully chosen keywords and star maps to something more direct and actionable. But because it understands how we think, it can also help us find what we want without knowing exactly what it is that we are looking for. Put another way, it represents an evolution beyond information and answers, to understanding."
