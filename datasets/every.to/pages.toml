["https://every.to/chain-of-thought/what-i-do-when-i-can-t-sleep"]
title = "What I Do When I Can’t Sleep"
description = "AI, insomnia, and the articulation of taste"
full_description = '''Dom.Francks 3 months ago Just found my way back to this piece, and it's beautiful. Just what I needed. I've been experiencing this a ton recently: "I knew this was happening because I started to be unable to explain to people what I do for a living. Usually, I feel energized and excited to talk about it. But recently, it’s felt like the answer chokes on the way out. Something grey and lifeless emerges that I don’t recognize." Thanks for naming it, Dan ♡ 1 · Reply Jon Ryder over 1 year ago This was fascinating. Wish I'd started an Ineffable List 25 years ago. Just told my daughter (aged 12) that perhaps one of the most important pieces of advice I'll ever give her is to start her own list immediately. I've just Whatsapp'd her this blog... ♡ 0 · Reply @rukidden about 1 year ago I really enjoyed reading your article about developing taste by naming what you like. It resonated with me a great deal, because I have a similar passion for text to image AI generation. Similarly, what you’ve described in this article is what I love about text to image AI generation. It’s not just about getting a professional quality image, but also about creating the image that you have in your imagination with words. There is a great deal of satisfaction that you experience when you describe an image with such deftness and clarity that the AI program creates exactly what you had imagined. For example, I often use a text to image AI tool called Bing Image Generator to generate some imagined images based on my descriptions. I am amazed by how realistic and detailed the images are, and how they matched my vision. Similar to your practice of articulating what you like I think text to image AI generation is a great way to practice and improve your writing skills, as well as to express your creativity and imagination. It also helps you to find your voice and style, just like you said in your article. I would love to hear additional articles about your notebook of things that you like but cannot express. Thank you for sharing your insights and inspiring me to articulate what I like. I look forward to reading more of your articles in the future. ♡ 0 · Reply'''
