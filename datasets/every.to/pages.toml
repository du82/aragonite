["https://every.to/superorganizers/andrew-huberman-s-morning-routine-backed-by-neuroscience"]
title = "Andrew Huberman’s Morning Routine, Backed by Neuroscience"
description = "A Summary of How the Podcast Host Starts His Day"
full_description = '''@tauno.ernits about 3 years ago Please continue publishing podcast summaries. "Lifespan with Dr. David Sinclair" would be cool. Thanks! ♡ 0 · Reply Avishek Banerjee about 3 years ago The most valueable thing for me here is to know about a new podcast. And the summary gives me enough information to decide whether I should spend time with it. These will be pretty helpful to me and I'd mostly use them as tools for podcast self review! ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Today’s newsletter is brought to you by Clay, a beautiful and private digital rolodex intentionally designed to help you be more thoughtful with the people who matter to you. Thousands of executives, professionals, students, and creators use Clay to be prepared for meetings, search their network, and remember the important things about the people they care about. Start the new year thoughtfully by building more rewarding relationships with your peers, friends, and family. It’s extremely hard to know what’s underneath our own behaviors, and as a result we turn to pet explanations, and lots of trial and error to figure out what kinds of tools and routines work best for us. It’s very rare to find a person who has found a routine that works for them and can tell you exactly why. Dr. Andrew Huberman is that rare person. He’s a neurobiologist and ophthalmologist at Stanford University, and he also is the creator of the Huberman Lab podcast—a show dedicated to helping us understand how our brain and body control our perceptions, and behaviors. Needless to say, I am a huge Andrew Huberman fanboy. And while I haven’t convinced him to come on to Superorganizers himself (yet), he’s talked a lot on his podcast and others about the protocols he follows to do his best work. That’s what this article is about. We’ve broken down everything we can find about his current morning routine, and we’ve also collected and condensed the science behind it. He says it sets him up for what he calls a “delicious” focused work block in the morning and—having tried most of his suggestions myself—I agree.'''
