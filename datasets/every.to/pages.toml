["https://every.to/podcast/vercel-s-guillermo-rauch-on-what-comes-after-coding"]
title = "🎧 Vercel’s Guillermo Rauch on What Comes After Coding"
description = "As AI writes code, developers must become better product thinkers"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. TL;DR: Today we’re releasing a new episode of our podcast AI & I. I go in depth with Guillermo Rauch, the cofounder and CEO of Vercel, a cloud platform for hosting and deploying web applications. We get into how AI creates new levels of abstraction in coding, his take on the allocation economy, and why specialized agents are the future. Watch on X or YouTube, or listen on Spotify or Apple Podcasts. Here’s a link to the episode transcript. OpenAI’s website is hosted on his company’s platform, Perplexity’s real-time chat feature is powered by his open-source tool, and if you’re building a new website or coding real-time features—like live notifications or instant messages—there’s a good chance you’ll use his code too. Guillermo has been coding since he was 10 years old. He’s now the cofounder and CEO of Vercel, a platform that helps developers build fast, personalized web experiences. He’s also the creator of open-source tools like Next.js and Socket.IO. “I don't think I would identify… as a coder, even though that’s what I obsessed about for years,” he says, sitting opposite me wearing a black sweater, groomed moustache, and wry grin. A successful software business is about a lot more than just code, he says; it’s about having the drive to build a practical, useful product. “Coding is a specific skill, and when things are specific skills, machines tend to take them over time,” he says, “so what I try to separate is, what are the meta skills… not as easily replicated by machines that you should still nurture?” Meta skills, Guillermo believes, “tend to be more around very high-level conceptual thinking.” Busywork is the killer of productivity. That’s why we recommend Tana, an AI-native workspace that organizes your information for you—even if you’re just using your voice. Talk out loud while cleaning your apartment, and finish the hour with meeting notes prepped and your apartment spick-and-span. Capture, organize, and utilize more ideas so you can get the most out of your day."
