["https://every.to/chain-of-thought/when-ai-gets-more-capable-what-will-humans-do"]
title = "When AI Gets More Capable, What Will Humans Do?"
description = "We used to be sculptors. We're all about to be gardeners."
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. This essay is brought to you by Notion, your all-in-one workspace solution. Startups can now enjoy 6 months of Notion Plus with unlimited AI, a value of up to $6,000—for free! Thousands of startups around the world trust Notion for everything from engineering specs to new hire onboarding. Access the limitless power of AI right inside Notion to build and scale your company. When applying, select Every in the drop-down partner list and enter code EveryXNotion at the end of the form. Predicting the future can feel like a fool’s errand. But so is writing it off. As humans peering into the abyss, we tend to assume progress in some ways and stasis in others. In this essay by Dan Shipper, which we’re republishing to cap off a week of prompt engineer (and new Every columnist) Michael Taylor’s tactical AI pieces, he warns against capability blindness: the often false assumption that technology won’t drastically improve over time. He also confronts the problem of what role humans will play when AI creativity improves, a question that led Every to launch our new tool, Spiral, which you can try out. We’ll resume regular publishing on Monday, July 8, after the July 4 holiday in the U.S.—Kate Lee Humans tend to believe that the world is static—that things will be the same tomorrow as they are today, and as they were yesterday. We leave no stone unturned in our hunt for opportunity, but we often don’t think to pause before we write something off as useless—and we don’t flip over old stones to see if anything’s changed. For example, the Claude model Claude 3 Opus is a fantastic writer. With the right prompt, it can write for short bursts in a voice that genuinely sounds 70-80 percent like me, you, or any other writer. Claude mostly wrote this tweet, for example, though I edited it. I supplied Claude with examples of previous podcast transcripts and tweets, as well as some guidelines about how to adapt one into the other. Claude did the rest, and it did a fantastic job. It did so well, in fact, that we built a tool specifically to make this kind of work easier, Spiral."
