["https://every.to/superorganizers/the-fall-of-roam"]
title = "The Fall of Roam"
description = "I don’t use Roam anymore. Why?"
full_description = '''Bryan about 3 years ago I loved this writeup, Dan! Not to point you at another shiny toy, but I believe Obsidian picks up where Roam falls off — and, more importantly, using it with Nick Milo’s “Linking Your Thinking” note *making* strategy. This approach has been a game changer for me (for now?)! ♡ 2 · Reply Lynn E. O'Connor about 3 years ago ; I ve been trying to figure out why I've been moving away from Roam --I loved the case of writing through the day, but somehow it didn't work, "that back linking thing, I don't get it" --I wasn't going back to old notes, and I couldn't easily find things. Bingo you said it. THANK YOU Im now trying Milo's obsidiean method but so far it may have a similar problem. I use building a second brain and everything makes sense there --so why do I keep trying other, less comprehensive systems where I can't easy find anything? ♡ 0 · Reply Adam Lasnik about 3 years ago I'm sorry for your disillusionment and appreciate your open and honest commentary on this. I was also tempted by Roam, but I'm confident and grateful I dodged a bullet given the alarming number of red flags I saw at the time. I've ended up mostly-happily using Notion. Is it perfect? Nope. But it's improving, it has very broad usage across many demographics, the company is apparently profitable, and -- of particular note -- I felt more comfortable with the community and company behind Notion. More specifically, with Notion, people are excited about and in some cases loyal to *a piece of software and the broader community that uses it* vs. worshipping an individual and a way of life. And that's a far more healthy foundation upon which to grow both a tool & and community! ♡ 0 · Reply John Luckman about 3 years ago I think the digital note taking experience and knowledge work in general still has a lot of simplification to go. Roam power users are leading the charge for sure, but to make it your own it takes a lot of sustained effort, new habits and almost an obsession to the platform to make it all work. It's a high bar but if you do it can work wonders for coming up with insights. Personally, I've replaced Roam with Obsidian as it gives you bi-directional linking and hierarchical file structures. As for the feeling of infinitesimal time spent on backlick creation and lack of on reviews. I've found Andy Matuschak's ideas on Evergreen notes and incremental writing are great concepts to build blocks of knowledge as you synthesise and then plug together to form bigger, deeper concepts. Worth looking into! ♡ 0 · Reply'''
