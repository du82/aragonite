full_description = "@arushikhosla 16 days ago Excellent piece, she wrote about an analysis of her own demise. The closing sentence hit the mark -- most of my smartest friends all got started in what I now think of as a research factory. Sitting in the data and wading through it all manually WAS laborious but critical. Yeah, that's a comfort for the longevity of the careers of those of us in it, but kind of depressing for any new grads. Don't have particularly valuable advice for them atm. ♡ 0 · Reply Brad Z. 12 days ago maybe I'm a naive optimist but AI’s impact on knowledge work always seems stuck in an old paradigm—one where AI is just a force for wage compression/worker displacement...that’s a scarcity mindset. to me, what’s actually happening is the rise of human-automatronic jobs (*in silico vibes), roles that weren’t even conceivable until now. i wish we were less into who gets replaced and more into what gets created. Idk. the human-AI interface isn’t a zero-sum fight over tasks, rather than(maybe) a new economic terrain where human capital is digitized, expanded, and integrated into some crazy-ass cybernetic workflows. LFG! Also, let me say it: work isn’t disappearing; it’s evolving into something post-scarcity, where intelligence is abundant. Perhaps it isn't even about protecting wages more than it’s about unlocking whole new strata of economic agency through synthetic labor markets.. human-aligned automation, etc. For transparency, how come we're not minting jobs instead of always 'losing' them. Thanks for letting me riff. Please write more about this topic. Accelerate. ♡ 0 · Reply"
