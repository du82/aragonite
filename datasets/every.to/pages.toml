["https://every.to/no-small-plans/a-founder-s-guide-to-expanding-your-comfort-zone"]
title = "When You Plateau, So Does Your Company"
description = "A founder's guide to expanding your comfort zone"
full_description = "I'm a founder, writer, and executive coach based in NYC. To find out more about coaching or sign up for my biweekly newsletter, visit: nosmallplans.io Bring your documents to life! Sentient transforms your company’s internal documentation into a chatbot, helping your company achieve internal alignment on important policy and strategy documents. I didn’t fully understand how detrimental avoidance could be as a founder until after I’d exited my first startup and began working at a fund that acquired and operated SaaS companies. There, I was involved with 4-5 acquisitions of businesses with $1-10 million in annual revenue, and I noticed an interesting pattern; nearly all of the companies we acquired had been run by product-focused founders who had avoided sales and marketing. Each of them had gotten quite far by being first to market and offering a quality product; yet over time, they had all hit a plateau. They spent years trying to grow the business through yet-another-feature launch. When they did invest in sales or marketing, it was usually a half-effort led by a junior employee and constrained by the founder’s discomfort around growth. This was fine for the first years of the company—but then revenue stalled, the founders burnt out, and they decided to sell their businesses. After seeing this pattern, I realized I had been guilty of the same behavior in my previous startup. This is one of the beautiful and painful parts of building a company—at some point, your comfort zone becomes the bottleneck in your business. Either you grow as a founder (and a person), or the company plateaus. Whether you're just starting out or are running a billion-dollar business, success depends on your ability to tolerate discomfort. In this post, we'll break down what a comfort zone is through the lens of acceptance and commitment therapy (ACT) and discuss several ways to intentionally expand it so you're less likely to cause your life and projects to underperform. Sentient is the easiest way to turn your company's internal documents into a chatbot using the world's most powerful chatbot technology - OpenAI's ChatGPT."
