["https://every.to/napkin-math/the-case-against-sam-altman"]
title = "The Case Against Sam Altman"
description = "The board is bad at their job, but they may not be crazy"
full_description = '''Georgia Patrick over 1 year ago Thank you for giving this topic a try. The noise around this headline is intense and curious people want to get a more direct storyline. What comes through is the truth that too much money and too much fame too fast does not mean you can break laws, cheat, steal, and live in your own bubble. Eventually and always the innocent among onlookers says "The king has no clothes." And then we all see what was in front of us the whole time. ♡ 1 · Reply Oshyan Greene over 1 year ago Really appreciate the level-headed approach here. Far too much of the dialog around this whole situation is polarized, in one "camp" or the other. It can be true both that the board handled this badly *and* that there was good cause to do what they did. How things end up should be determined by the validity of the concerns the board had, not by their poor initial handling of his dismissal. But that's generally not the world we live in, appearances are often nearly everything, and Altman currently has the best optics unfortunately. I say unfortunately not because I dislike him, but because I think the wild imbalance here in public perception is likely to cloud a fair assessment of the situation. The stakes are high here, even if we set aside potential existential AGI concerns, just as far as the real world impact of OpenAI to date, and its likely future effect on the worldwide economy, etc, etc. They need to get this right, not just *look* right in the moment. ♡ 0 · Reply'''
