full_description = '''Jeanie Britz about 4 years ago A great read. I struggle with the balance, but becoming more mature. ♡ 0 · Reply @davidbarr2 almost 3 years ago I would have liked a bolded statement that answers the question in the title. Probably the first sentence under "What do we do about it". ♡ 0 · Reply @emilysinsight over 1 year ago It isn't stress, it's how YOU experience it. Some people enjoy jumping off bridges. Some people enjoy doing their hobby for a living 24/7/365. ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. It’s a question I ask myself a lot, and I bet you do too. On the one hand I really want to push myself. I’m ambitious, I want to leave it all out on the field—some of my peak work moments have come from times when I’ve pushed myself to a place where I didn’t think I could go. We all have more ability to adapt to stress and pressure than we think we do.﻿ On the other hand, I want to be kind to myself. I wonder how much the drive to push myself is really just a drive to make up for something that I feel is missing or inadequate—and whether pushing myself will actually fill the hole. I also sometimes wonder whether letting myself off the hook is just laziness masquerading as self-care. It’s hard to tell. But importantly, I wonder whether pushing myself might, in fact, kill me. Constant pressure creates chronic stress, and there’s all sorts of scientific studies that show that chronic stress is really bad for you. It makes you more susceptible to heart disease, it makes it harder to recover from illnesses, it can affect your sleep, and it can even affect your working memory. There’s also all sorts of literature (and conversations on Twitter) that says that stress is actually good for you. I think that in order to understand the question we posed at the top—how much we should be pushing ourselves—we have to better understand stress. We need to understand what the stress of pushing ourselves does to our bodies, how much we can take of it, and how we can, hopefully, learn to cope with it better.'''
