["https://every.to/means-of-creation/a-theory-of-justice-for-web3-867533a9-9198-4132-9883-0d7c89cc1e0a"]
title = "A Theory of Justice for Web3"
description = "Web3 Is Our Chance to Make a Better Internet"
full_description = '''Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. This piece originally appeared as part of the Harvard Business Review's Big Idea Series "Welcome to Web3" under the title Web3 Is Our Chance to Make a Better Internet. We're excited to get to share it with Means of Creation readers! One of the most powerful narratives surrounding web3—a decentralized, blockchain-based internet ecosystem owned and operated by its users—is that it is a movement toward a better, fairer internet. Specifically, web3 proponents envision an internet in which users can wrest back power from a small number of extractive, centralized institutions, and in which everyone with an internet connection can participate on a level playing field. But web2, the current era of the internet defined by companies built on proprietary data (such as Facebook and Google), started with a similar promise of empowering individual creators and removing intermediaries—a promise left unfulfilled. Now, standing at the precipice of a new era, we should ask ourselves: Is web3 actually democratizing opportunity? And if not, how can we better design platforms and governance systems to promote fairness? The social and political philosopher John Rawls’s thought experiment known as the “veil of ignorance,” proposed in his influential 1971 work A Theory of Justice, provides a useful framework for these questions. When creating the foundations for an ideal society, Rawls contends, we should imagine that we do not know where we ourselves would fall within it—that is, we should adopt a veil of ignorance. A just society is one “that if you knew everything about it, you’d be willing to enter it in a random place.” Rawls adds: Rawls’s thought experiment is particularly relevant now because we are standing at precisely the kind of inflection point that the veil of ignorance imagines. Web3 presents the opportunity to build an entirely new internet—indeed, entire new economies—from scratch. The question then becomes: What kind of internet should we be creating?'''
