title = "Snapchat's Probably Screwed"
description = "Apple's ATT Fallout Continues"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This article is brought to you by Write of Passage, an online course taught by David Perell designed to help you become a better writer and start building a reputation online. Programming Note: Apologies this is coming out so late! Had a very sick puppy today, and as much as I love being on time when I post, I love my dog more. She is fine now—thanks for your patience! In times of crisis, founders are expected to rise to the occasion, to become wartime leaders, to lead their employees to glory and riches. Evan Spiegel’s response? Announcing a stock split that will allow him to sell shares without reducing his super-voting powers. If you had predicted this outcome a few years ago, you would’ve been a laughingstock. Analyst reports on the company were full of hope, pushing the narrative of augmented reality (AR) and international growth. Investor presentations were filled with bold promises of a future where Snap was an advertising leader. They were so bullish that (only a year ago!) they promised to deliver 50%+ of yearly revenue growth. Instead, in Q2 they only delivered 13%. All of this points to a company that doesn’t understand what is happening to its own business. Good writing is an unfair competitive advantage. Writers get more visibility online, and that visibility translates into their own personal monopolies. This newsletter itself is a testament to the power of writing online. I started from nowhere special and my writing has completely transformed my career. If you are looking to improve your writing skills and start building your reputation online, then look no further than Write of Passage. It’s a course created by David Perell that will help you uncover your strengths, clearly communicate your value, and start gaining more visibility. Join thousands of other students like Packy McCormick and Ana Lorena Fabrega by accessing a free lesson from the course by clicking the link below."
