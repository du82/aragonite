["https://every.to/p/the-art-of-the-ai-pivot"]
title = "The Art of the AI Pivot"
description = "How one startup turned failure into 3 million users in three months"
full_description = "Executive coach working with founders and outlier achievers to navigate change and ship work that matters. Previously: 3x startup founder, Facebook and Etsy PM, and NCAA champion gymnast. More at jasonshen.com Pivots are tough. But as I argued two weeks ago, pivots are how the majority of Silicon Valley’s innovation bears fruit. So it’s heartening to read a story like Gamma’s—a company that was on the brink of failure before catching the AI wave at just the right moment. Jason Shen got up close with its founder, Grant Lee, whose steerage of Gamma from struggling startup to 3 million users in three months is a masterclass in how to execute a pivot. Read this piece to learn how to turn your startup's biggest weakness into its greatest strength. As go the pivots, so goes the Valley.—Evan Armstrong As I grappled with these frustrations, a friend of a friend invited me to the private beta of a startup that wanted to rethink work presentations. Founded in 2020, it was called Gamma, and it promised a way out of my slide deck hell. Instead of being limited by the 16:9 frame of a standard slide, the product gave me the flexibility to express a point with as little—or as much—content as I wanted. It was much easier to use than Google Slides. One of Gamma’s cofounders, Grant Lee, had been stuck in a presentation-heavy role as a startup operator and consultant and shared my frustrations. The small Silicon Valley-based team, members of which had previously worked together at A/B testing platform Optimizely, had raised $7 million in funding over two years to develop a “doc-and-deck hybrid,” as Lee told me. Gamma launched its public beta in summer of 2022, reaching the number-one spot on the Product Hunt leaderboard and with tens of thousands of new users. But it had one big problem: Very few users were having a great first-time experience, and many did not return a second time. In product parlance, low activation was leading to poor retention—most people still found it too hard to create a presentation. And the startup’s clock was ticking because its financial runway was running out."
