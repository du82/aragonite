["https://every.to/podcast/inside-the-pod-chatgpt-can-turn-anyone-into-a-video-game-developer"]
title = "Inside the Pod: ChatGPT Can Turn Anyone Into A Video Game Developer"
description = "Yes, even if you don’t know how to code"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. As we conclude Every’s quarterly Think Week, our regularly scheduled stop-and-think period where we halt our writing and republish some of our standout pieces from the past, we wanted to end on a practical note. After each episode of our AI & I podcast, Every contributing writer Rhea Purohit walks our readers step-by-step through the process that host Dan Shipper and his guest go through on the show, recreating it so listeners can follow along. We’ll be back with new stories next week, including coverage of OpenAI’s DevDay on October 1. Until then, I leave you with Rhea’s write-up of Dan and Logan Kilpatrick’s fascinating attempt to build a video game using only ChatGPT. ICYMI: We created eight custom wallpapers based on Every’s art for iPhone or Android. Download them for free.—Kate Lee However, I do understand being daunted by a skill that feels totally foreign. It’s how I feel about software. I don’t know how to code and wouldn’t even know where to begin. Dan Shipper and Logan Kilpatrick believe that building software is a superpower. In this conversation, they talk about how ChatGPT has enabled everyone to be a builder. They also walk the talk by making a video game called Allocator with ChatGPT in less than an hour—all without writing a single line of code. Logan was OpenAI’s first developer relations and advocacy hire, working to support the community of people building with ChatGPT, DALL-E, and the OpenAI API. (Since we recorded this episode, he announced his departure from the company and decision to join Google.) A few months ago, OpenAI released GPT Builder, a tool that enables people to make custom GPTs tailored for pretty much anything they want. It’s what made Dan and Logan’s video game experiment possible. Logan says GPT Builder lowers the hurdles to innovation, especially for people like me who don’t know how to code."
