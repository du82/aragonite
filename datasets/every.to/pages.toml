["https://every.to/napkin-math/a-note-on-power"]
title = "Dying Whales and Dying Billionaires"
description = "A note about power"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This article is brought to you by Brilliant, the app that boosts your analytical skills with bite-size lessons in math, logic, CS, and more. Author’s Note: In newsletter writing you are supposed to get to the point, set a strong hook, and make sure there are immediately obvious takeaways. I wondered what would happen if I deliberately violated each of those rules—this post is the result of that experiment. Thank you for being patient with this column's ceaseless experiments with form and function. A blue whale is a big son of a gun. Over the course of its 90-year life span, it hauls its 300,000-pound body across 450,000 miles of ocean. To help visualize this, that would be like driving coast-to-coast across America 180 times. Each swish of its ginormous tail is powered by the 12,000 pounds of krill that is its daily brunch. Their feces is also impressive. After digesting four Volkswagen Beetles worth of seafood each day, the blue whale will ascend to near the surface and, if I may be so crass, let loose. Marine biologists have given these explosive events the delightfully euphemistic nickname of a “whale pump.” This event is surprisingly vital for the health of the ecosystem by providing nutrients for plankton growth. Plankton in turn feed many other species of fish and, eventually, turn into long-term storage of carbon that sits on the seafloor for decades. Essentially what I’m saying is that if we gave enough blue whales enough black coffee, we would no longer need solar panels. That point is totally irrelevant, but it is one I am compelled to make nevertheless. Perhaps the most important part of the blue whale’s life cycle occurs when it dies. Assuming it dies of natural causes over deep water, it begins a process known as a whale fall. As the corpse slowly, slowly, slowly descends to the ocean floor, a swarm of ocean scavengers begin to feast. They include, but are not limited to, the following: sleeper sharks, hagfish, giant isopods, lobsters, crabs, octopus, polychaetes (what is this? I have no idea), shrimp, prawns, sea cucumbers, and squat lobsters (not to be confused with its cousin, the incline bench press squid)."
