["https://every.to/napkin-math/falling-out-of-love-with-michael-lewis"]
title = "Falling Out of Love With Michael Lewis"
description = "The complicated demands of business writing"
full_description = '''Craig Gordon over 1 year ago totally agree with your analysis of book..although haven't read it and was on my list to read after reading yours and few other reviews especially LA times one I have decided to read Number Go Up by bloomberg reporter Zele Faux....might be good recommendation to your readers. Thanks for the honest take ♡ 2 · Reply Ben Springwater over 1 year ago @cg "I agree with your book review even though I didn't read the book." Um... ♡ 0 · Reply Anne Amoury over 1 year ago I was about to buy this book yesterday at the airport. But after thumbing through the pages filled with italicized convo’s or journal entries or whatever they were, I returned it to the shelf. Seemed awfully lazy for a book that should be packed with insight and analysis. Talk about a lost opportunity to enlighten readers about the impossibly complicated, bizarre crypto universe. As a fellow sometimes-fan of Michael Lewis, I share your disappointment. Huge missed opportunity to shed light on what happened with FTX. Robert Caro he ain’t. This is my favorite of your essays so far. Keep up the great work. ♡ 1 · Reply @dhaval2thewall over 1 year ago That was a great insight and analysis not only about Going Infinite but also on comparison with Elon Musk’s biography. ♡ 1 · Reply Chester Cressman over 1 year ago What I liked was your revealing the fact that being entertaining is more profitable than being truthful, and the bias that has on writing. As someone that, at least intellectually, values truth far above entertainment, how do I filter out the stuff that has a loose association with the truth, and find more of the truth? ♡ 1 · Reply Evan Armstrong over 1 year ago @Chester Cressman the answer is obvious—you should be a napkin math reader ;) this is a frustrating answer but if you find a writer who isn't particularly entertaining but has been doing it for a long-time that is a good filter. ♡ 0 · Reply @alexpoterack over 1 year ago Did you read the same book as me? I read that book and I felt like it painted SBF as a huge asshole. Like, he's talking about a company that very notably and publicly went bankrupt, so when he talks about how "no one at [FTX] knew their title, job description, or who they reported to," he's not describing how good SBF is at managing, he describing how much of a trainwreck he was. When he repeatedly describes SBF as being callous, uncaring, and blowing people off, I don't think he's saying, "This guy was just too focused to spend time on that stuff," I think he's saying this guy is an asshole. The quote from the book that sticks in my mind the most is SBF saying, "There's a functional religion around the CFO. I'll ask [investors], 'Why do I need one?' Some people cannot articulate a single thing the CFO is supposed to do. They'll say 'keep track of the money,' or 'make projections.' I'm like, What the fuck do you think I do all day? You think I don't know how much money we have?" He didn't know how much money they have! That's not a, "oh, look at this cool rebel who's smarter than all the people who think they know better" quote, that's a, "Look at this hubristic asshole who thought he knew better, then it all blew up in his face," quote. ♡ 1 · Reply'''
