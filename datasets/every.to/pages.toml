["https://every.to/chain-of-thought/i-spent-a-week-with-gemini-pro-1-5-it-s-fantastic"]
title = "I Spent a Week With Gemini Pro 1.5—It’s Fantastic"
description = "When it comes to context windows, size matters"
full_description = '''@doogiesjunkdrawer about 1 year ago Great article... stimulating. The phrase “context is everything” comes to mind. While that’s an oversimplification, the more complete the context, usually the better the answer, decision or outcome. But that depends heavily on the quality and precision of the question. E.g. the hologram in “I Robot”. AI can’t fix a poor prompt. That relies on us. We need to know why and what value we are pursuing (and even its use) when we ask a question and seek its answer. To use AI/GPT effectively, we need to level up our ability to ask good questions. BTW- that’s applies to today, right now. In general, we need a renewed effort on improving critical thinking and reasoning skills focused around the why of our what's if we expect to get effective how's for the given Job-To-Be-Done (JTBD). Don't get me started about "Prompt Engineering"... so far that sounds like the job we should be doing right now. Crappy inputs, crappy outputs. Thanks again for the thought provoking article. ♡ 1 · Reply Colleen Cole about 1 year ago I just signed up for Gemini 1.5 yesterday and my first run at it was initially disappointing. I fed it a transcript of a podcast episode and asked it to sum up the frameworks discussed during the episode. Strangely it kept telling me it didn’t know the people on the podcast and couldn’t respond as them. I rejigged my prompt and basically got the same answer. The third time, I got a high school level answer. Finally, I fed it an AI answer from another tool, and at that point, it apologized and then listed the steps it would take to do a better job in the future. Methinks I need to sort out my prompts with it a bit. That said, I moved on asking it to use some of the frameworks I outlined to brainstorm about a launch, and at that point, it started to shine. I’m looking forward to see how it develops as a tool. ♡ 0 · Reply @julianbeggs about 1 year ago Of course you get better pattern recognition from a larger sample of patterns. We'll all be uploading our second brains into Google before long. ♡ 0 · Reply'''
