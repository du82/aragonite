["https://every.to/podcast/an-inside-look-at-building-an-email-client-in-three-months"]
title = "🎧 An Inside Look at Building an Email Client in Three Months"
description = "With one engineer—and AI"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. TL;DR: Today we’re releasing a new episode of our podcast AI & I. Dan Shipper goes in depth with Kieran Klaassen, the general manager of Cora—our latest product incubation that lets you manage your inbox with AI—and Brandon Gell, Every’s head of Studio and consulting. We get into the inside story of how a one-person engineering team built and launched Cora in three months. Watch on X or YouTube, or listen on Spotify or Apple Podcasts. On a summer evening last year, Every entrepreneur in residence Kieran Klaassen hotfooted it home from his coworking space. To passersby, Kieran may have looked a little…weird. For one, he appeared to be talking to himself. He walked in short, fast bursts, stopping to think for a moment, before resuming the janky monologue. Those within earshot would’ve heard snatches of “email,” “dread,” “Cora,” “delightful,” and “magic.” Oh, and there was a giant grin on his face the whole time. Before leaving the office, Kieran had a call with Every Studio head Brandon Gell about a new project—reimagining email in the age of generative AI—and his mind was buzzing. After putting his daughters to bed that night, he sat down at his desk, pulled up a transcript of the voice memo he’d just recorded, and started coding. When Brandon and Dan Shipper woke up the next morning, they had a message from Kieran: the MVP of Cora—a whole new way to do email—was ready. That was the beginning of the exciting, exhausting, emotional journey of building a product we’re proud of at Every, and Dan invited Kieran and Brandon on the show to talk about it. They go behind the scenes on how they went from idea to execution on Cora—meandering, occasionally chaotic, and unvarnished (we have the voice memos to prove it). Here's a link to the episode transcript. Cora, Every’s latest product incubation, is a way to manage your email with AI. It frees you from your inbox by turning all your emails into a sleek, scannable story—a “brief”—twice a day. A month after launch, there are almost 8,000 people on the waitlist. If you want to try Cora, sign up. The team is onboarding new people every day and prioritizing Every paid subscribers. If you want to jump the waitlist, make sure you subscribe if you haven’t already:"
