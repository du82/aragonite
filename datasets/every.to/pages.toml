title = "For Sale: A Promise to Remove Invisible Gas"
description = "A primer on the carbon dioxide removal market in 2023"
full_description = "This essay is brought to you by The Information, the biggest dedicated newsroom in tech and business journalism. The Information offers access to exclusive insights from the industry's top journalists. For a limited time, subscribe and save 25% on your first year. Editor’s Note: Climate change is one of the world’s most pressing issues, and it’s becoming fertile ground for technology innovation and investment. Today’s post, from Jamie Wong, is a starter guide for anyone new to the byzantine world of carbon dioxide removal (CDR). Many tech companies (Stripe, Alphabet, and Microsoft, and more) are funding CDR efforts, VC firms are backing CDR providers, and mission-driven founders are developing software tools to support the process. Jamie has spent the last several months mapping the space, and this primer is the result of his efforts. It’s an excellent resource for anyone in tech looking to go deeper on the subject. In a select few corn fields after a harvest, the unwanted stalks, leaves, and cobs are fed into a storage container on the back of a long-haul truck. These agricultural wastes won’t be hitting the road in their loose, fluffy state though. The storage container doesn’t start empty. It contains a complex chemical machine fine-tuned to efficiently convert the corn detritus into three chemical compounds: biochar, bio-oil, and syngas. The biochar, a solid, is scattered back onto the farm fields to improve field fertility. The syngas is, in part, used as fuel to keep the high temperature reaction going. The bio-oil is destined to be injected deep underground. Bizarrely, people will pay for it to be put there, not to save for later use, but with the promise that it will stay there forever. This whole operation happens under the purview of Charm Industrial, a leading participant in a growing market of players with a shared goal: suck carbon dioxide directly out of the air and store it away for good. This is carbon dioxide removal, or CDR for short."
