["https://every.to/p/the-hole-in-the-sky-that-we-actually-fixed"]
title = "The Hole in the Sky That We Actually Fixed"
description = "How the ozone layer became an unlikely climate success story—and what we can learn from it"
full_description = "This essay is brought to you by Reflect, an ultra-fast notes app with an AI assistant built in directly. Simplify your note-taking with Reflect's advanced features, like custom prompts, voice transcription , and the ability to chat with your notes effortlessly. Elevate your productivity and organization with Reflect. One of my gripes with the technology industry is how billionaires think of themselves as John Galt from Ayn Rand’s Atlas Shrugged. They lionize independence and get grumpy about any form of regulation. This view is, of course, misguided. While technology is the best lever we have to improve human existence, we still need a hand to push down on that lever. Government intervention, properly applied, is how frontier technologies get used. That’s why this brilliant piece by former Figma engineer Jamie Wong struck me so deeply. He explores how we fixed the ozone layer, not with privately built technology alone, but with global partnerships devoted to helping the planet. While we may all enjoy the riches that come from the success of big tech companies, the whole point of this industry is to make people’s lives better. This piece (which is part one of a two-part article) is a reminder about how frontier tech can do that.—Evan Armstrong In a demonstration at the 1930 meeting of the American Chemical Society, a chemical engineer named Thomas Midgley, Jr. took a deep breath, inhaled a novel compound deep into his lungs, and held it briefly before exhaling and blowing out a candle. It was theatric proof of two key properties of a new product—the stuff was safe to breathe in and wasn’t flammable. A few years earlier, Midgley had been tasked by the Frigidaire, then part of General Motors, to address a problem holding back widespread adoption of home refrigerators. Electric refrigerators, which had been available for household use since 1915, were becoming financially attainable for many American homeowners, but a key component was giving many homeowners pause: refrigerants, the substances pumped from the inside of the refrigerator to the outside and back in an infinite loop."
