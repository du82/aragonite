["https://every.to/learning-curve/you-re-probably-using-ai-wrong"]
title = "You’re Probably Using AI Wrong"
description = "The case for maximizing meaning, not efficiency"
full_description = "@maia0x0x 5 months ago This is exactly how I’ve been using AI to be more “efficient” in my writing! It’s an idea partner that always has a couple of chips to throw you when you’re stuck or just need a few suggestions to dip your toes into. I can then take those chips and go bananas - in a good way. AI does the drudgery when a wall has been hit, and then I’m free to wordsmith, embellish, and edit to my liking. The time I’ve saved on the hemming and hawing is astounding. I’ve been struggling to explain my methods for befriending AI to my more skeptical, AI-averse friends and colleagues. This article articulates it beautifully! You can’t expect (nor should you want) to have AI spit out your words for you. But if you prompt it nicely, it can prompt you back nicely, and then you’re on your way to a collaborative creation between you and your tireless AI writing buddy. ♡ 3 · Reply Rhea Purohit 5 months ago @maia0x0x Exactly! I think you might enjoy this piece by Dan which talks about using AI to reduce the drudgery in creative work -- https://every.to/chain-of-thought/chatgpt-and-the-future-of-the-human-mind ♡ 0 · Reply Kate Lee 5 months ago @maia0x0x Hi, this is Kate Lee, the EIC of Every. We'd like to include your feedback in our Sunday newsletter. Would you either respond here or email me at [email protected] with your job function/industry? Thank you! ♡ 1 · Reply @jana.perry 5 months ago Rhea! I have found my tribe - this is exactly the way I research, hunt & gather, copy & paste, and synthesize insights into a proposal! How fascinating - thank you so much for outlining your process so beautifully. I have been tasked with identifying potential specific AI use case scenarios and value ranking them for our company. This helps me immensely to change the lens from efficiency/assistant to process examination and exploring other vantages for optimizing this technology. Kudos to you ~ this is so valuable to me! I appreciate your work greatly...keep it coming! ♡ 2 · Reply"
