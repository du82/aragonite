["https://every.to/means-of-creation/legitimacy-lost"]
title = "Legitimacy Lost"
description = "How Creator Platforms Are Eroding Their Most Important Resource"
full_description = "Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. When historians write the story of the rise of the Creator Economy, there are two moments, ten years apart, that are guaranteed to appear. The first, in Spring 2007, is when YouTube started sharing advertising revenue with creators—a decision that arguably laid the foundation for the “Creator Economy” as we know it today. The second, in Spring 2017, is when the cracks in that foundation became impossible to ignore, and questions about the legitimacy of the platform economy started to emerge. Spring 2017 marks what is now popularly known among creators as “Adpocalypse.” YouTube faced a mass exodus of advertisers due to concerns about their ads being featured next to objectionable content. The platform overhauled its advertising policy, and thousands of creators saw their views and earnings plummet as a result—some by as much as 99%. “Literally almost everyone across the board has seen their views cut in half,” one creator told New York magazine at the time. “So we’re trying to fight the Not Advertiser-Friendly system as well as fighting the new algorithm, and it’s, like, how are people supposed to live off this anymore, you know?” For many YouTube creators, Adpocalypse was a wake-up call. It was the first time they realized that their revenue—in some cases, their entire livelihood—came with strings attached. It was the first time that creators questioned the legitimacy of the bargain that they’d made with the platform. But it wouldn’t be the last. The first Adpocalypse in 2017 was followed by Adpocalypses two, three, and four in 2018 and 2019. And YouTube isn’t the only platform to have faced tension with its creators. In 2016, Facebook faced pushback after it made changes to Instagram’s algorithmic feed that impacted creators’ engagement on the platform. When OnlyFans announced changes to its content policy in summer 2021, the backlash from creators was so immediate, the platform was forced to suspend the changes almost immediately."
