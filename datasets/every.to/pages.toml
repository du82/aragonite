["https://every.to/p/economist-tyler-cowen-thinks-chatgpt-will-change-your-job"]
title = "Economist Tyler Cowen Thinks ChatGPT Will Change Your Job"
description = "Diving deep into the future of the economy and jobs"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Deel has simplified a whole planet’s worth of information. It’s time you got your hands on our international compliance handbook, where you’ll learn about: I’m a writer, and I think writing is hard. The first time I (glorified wordsmith) saw a bunch of algorithms (AI) output writing (aka do a hard thing), I took a beat. A mixture of surprise, fear, and curiosity washed over me. This was the end of 2022 when OpenAI released ChatGPT. Tyler Cowen felt some variation of this decades ago, when he saw a bunch of algorithms (AI, again) directing chess pieces across a board. Cowen is not a professional chess player. He’s an economist who just happens to be a chess enthusiast. But when news broke that AI had mastered chess, a game often hailed as the pinnacle of human intelligence, Cowen sensed that something important had occurred. He concluded that the next technological leap would be in AI. Armed with a deep knowledge of economics, he explored his insights further. In 2013, when the rest of the world was Instagramming their lunch, Cowen published Average Is Over, a book about how AI would change the future of work. In it, he argued that the economy will shift to reward those who can enhance the capabilities of technology. Cowen had his AI moment a decade ago. Today, his incredible foresight is more than words and theories—it’s our reality. During the day, Cowen teaches economics at George Mason University. He moonlights as a prolific writer, co-writing leading economics blog Marginal Revolution, where he has published daily for over 20 years. He is also the author of 17 books, the latest of which is an AI-fueled interactive experience that analyzes the lives of influential economists and crowns one of them as the greatest of all time. Dan interviewed Tyler Cowen to understand how Cowen uses AI in his own life and work—and what that might mean for the future of jobs and the economy. These are edited excerpts of the interview. Let’s dive in."
