full_description = "@miguelmarcos about 2 years ago I’m not pompous so I will easily admit machine learning-based organization is great. It can be tackled really well with enough horsepower. However, I don’t find it exciting and I’m not unhappy with my current system. I believe what’s missing is intelligent linking between notes in such a way where novel relationships appear. Relationships that make sense, that are not patently absurd or nonsensical, the result of combinatorial . I will be truly impressed when machine learning tools produce Aha! moments. ♡ 0 · Reply Dan Shipper about 2 years ago @miguelmarcos agreed I definitely think intelligent linking and synthesis is hugely important. tbh I've had this feeling already—for example, having GPT-3 summarize transcripts of therapy sessions or journal entries and pull out patterns has been eye-opening. but there's a lot more work to be done ♡ 0 · Reply Tintin about 2 years ago Great idea to use AI to help you with notes. This appeals to me since I've not stuck with any tool over the years — notepad++, evernote, roam, obsidian, logseq, none of them. However, note (no pun) that when you truly understand something when you write it with your own words, not the AI's. ♡ 0 · Reply Dan Shipper about 2 years ago @Tintin thanks!! yes that's definitely true. I don't think of it as a replacement for understanding—but it can be a good prompt to remember something you already understood ♡ 0 · Reply @shikatachi-reads about 2 years ago I fed one page of my RoadResearch notes to ChatGPT and was able to draw some pretty cool insights from it. ♡ 0 · Reply Alex Jin about 2 years ago Co-pilot for notes sounds like mem.ai (I’ve been an early user of it since 2020). Still not quite frictionless but it’s getting there pretty quick. Highly recommend checking it out for anyone who’s interested. ♡ 0 · Reply @teddyconrick about 2 years ago @jin.alex123 @jin.alex123 Agree with your comparison to Mem.ai. Combined with the embedding + vector search features in their recently upgraded Mem X offering, using OpenAI embeddings and the Pinecone.io vector embedding databases, this is really starting to come together. ♡ 0 · Reply"
