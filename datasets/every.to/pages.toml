["https://every.to/also-true-for-humans/7-22"]
title = "Why AIs Need to Stop and Think Before They Answer"
description = "How chain of thought works to get better responses"
full_description = "Michael Taylor is a freelance prompt engineer. He explores how to manage AI tools like humans in his monthly column, Also True for Humans. When humans make requests of their AI assistants, what matters isn’t merely what they ask but often how. That’s the central premise behind chain of thought prompting, a method for getting the most out of ChatGPT or another chatbot. In the latest installment of Also True for Humans, Michael Taylor’s column on working with AI tools like you would work with humans, he dives into how and why this method works, why we’re not all that different from our machine counterparts—and what the number of piano tuners in New York City has to do with any of this.—Kate Lee When I was writing this article, I worked with my editor to plan the outline and make sure I had a compelling pitch. So why do most people expect ChatGPT to “write a blog post on X” without taking the time to think? AI does a better job when it’s prompted to make a plan first—just like humans do. Most AI applications have one or more research and planning steps, a technique called chain of thought (CoT). It’s an order of operations for the model to reason through a problem before answering. When you’re getting mediocre results from AI, it’s often because you haven’t allowed the AI to plan sufficiently. Applying the chain of thought technique can result in an immediate boost in performance. Let’s look into the science behind chain of thought prompting and how to get AIs to think through their answers before responding. It’s one of the easiest ways you can improve your prompts to get more sophisticated results."
