full_description = '''@travailler.avec.emulation 10 months ago This is a good read! Though I think it's valuable to understand the AI hardware dilemma, I liked the word at the last. "There is a viable path! But it requires something wholly new and different. Startups doing the same-old end up with the same-old result—failure." My learnings: https://glasp.co/kei/p/02507121a113a15070fa ♡ 1 · Reply Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This eight-week mindfulness course is designed specifically for busy, high-achieving individuals looking to unlock the "hidden discipline" that can transform their lives. Through live sessions, daily practice, and expert guidance, you'll gain the tools to: Every subscribers can enroll for just $799—a 20 percent savings—by using code “EVERY” at checkout. Over the past few weeks, new AI-powered hardware has been released to less-than-kind receptions—the Humane Pin was lampooned and the Rabbit R1 was skewered. While some people enjoyed the devices, it is safe to say these were not the launches the companies had hoped for. At the same time, other startups have raised millions in venture capital to build new consumer hardware devices. Investors I know are actively looking to deploy money into the category, and Sam Altman and Jony Ive are in talks to raise up to a billion dollars for a consumer hardware device. This disparity raises so many questions: Why are these new devices being received so poorly? What do founders and investors believe they’ll get by betting their careers on this difficult and clearly uphill battle? Will their bets actually work? To figure out the answers, I’ve been in the weeds with founders, talking product roadmaps, capital strategies, and levels of excitement. Here’s what I learned. Many see AI as a technological paradigm shift akin to jumping from personal computers to mobile computing—and there is a chance that a new Apple could be built. With Palo Alto’s favorite fruit-centric company currently enjoying a $2.68 trillion market capitalization, people are feeling like Louis Armstrong did when he touched a trumpet for the first time (quite jazzed).'''
