["https://every.to/chain-of-thought/can-a-startup-kill-chatgpt"]
title = "Can a Startup Kill ChatGPT?"
description = "Google is dangerous—a founder cracked on Zyn and Diet Coke more so"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. A year after OpenAI’s release of ChatGPT-4, Google and Anthropic have caught up in the quality of their chatbot products. They’ve both released public or private beta models (Gemini 1.5 Pro and Claude 3 Opus, respectively) that sport larger context windows than GPT-4. They also match GPT-4 by benchmark and surpass it in vibes, in certain cases. OpenAI is still clearly the winner by popularity, though. I’d be surprised if Google or Anthropic truly threatens it for mainstream adoption in the near future. And I’m curious to see what OpenAI does next. I’d be willing to bet that the company has a compelling response up its sleeves. Today, though, I want to talk about startups. How vulnerable is ChatGPT to disruption? Let’s say OpenAI maintains its dominant position against incumbents—will it be able to maintain it against disruption? Both Google’s Gemini mishap and the sometimes-backwards trajectory of ChatGPT response quality over the last few months suggest to me that large chatbot players are vulnerable to disruption—unless they modify their product strategy. Let me explain why. The word “disruption” is used colloquially to mean any instance where a startup beats an incumbent, but in its original formulation, it meant something specific. Disruption, as theorized by Clayton Christensen in the early 1990s, is a process by which a startup offers a lower-cost product that performs worse along standard dimensions of performance for a small subset of customers outside of the mainstream. The product gets adoption, though, because it performs better on a new dimension of performance that is important to its niche customer set. Over time, the disruptor improves on standard performance metrics so that it can move up-market to higher-value customers, while maintaining its other advantages. The startup is able to displace a larger, well-managed incumbent because the latter sees that the startup’s original product is lower cost and lower margin, and generally performs worse. So it looks like a bad business. Therefore, the incumbent fails to react until it’s too late."
