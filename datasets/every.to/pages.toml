full_description = "@dspinks5 over 1 year ago You put into words so much that I’ve been thinking about as a 15 year entrepreneur who recently became a father. The struggle between being a great builder and being a great father is very real. Another layer that I think about is the example I set for me kids. This is new for me. Instead of thinking of greatness in terms of how society or industry views it, I’m starting to think of it as how my kids will view it. When my kids see what I’ve built in my life, will they be proud? Will they consider it to be great? Will they be disappointed? Of course, I can’t know how they’ll feel. But it’s nice to view greatness from a new perspective. ♡ 1 · Reply Phil Hampton over 1 year ago Great essay that defines the inner struggle well. I came at this from a slightly different angle. Your dad decided to make a sacrifice, whilst mine never strived for greatness, but both men achieved it in their own way - https://lifeofagency.substack.com/p/the-problem-with-legacy ♡ 0 · Reply"
