["https://every.to/chain-of-thought/can-gpt-3-explain-my-past-and-tell-me-my-future"]
title = "Can GPT-3 Explain My Past and Tell My Future?"
description = "I loaded journal entries from the past 10 years into GPT-3—and started asking it questions"
full_description = '''@david810 about 2 years ago Love this! We're thinking about a lot of the same things, Dan. I use a headless keyboard "Go Note Go" to take notes -- as I drift off to sleep, at my desk at work, while I'm driving (via audio), camping, even sometimes while showering! Been in the sleep-typing game for over 8 years now (wow!) Recently I added an AI assistant to Go Note Go. So far it only gets access to the current session of notes, not my full history of notes like you did. But this limitation was apparent right from the start! So, like you, I also have been experimenting with GPT-Index. It's not part of Go Note Go yet, but definitely a possibility. For the curious, more on Go Note Go here: https://davidbieber.com/snippets/2023-01-16-go-note-go-features/ ♡ 1 · Reply @cvadnais about 2 years ago Thanks for this. I have an idea in mind to create a GPT-3 policy advisor for my organizaiton. It would be given written guidance such as standard operating procedures and company policy as background, then be made available to answer specific questions from line level producers and managers. Until now we've relied on a person to serve as a policy expert -- a human who studies the guidance and offers advice on how it applies in a given situation. I think GPT-3 could be used to make some level of counsel available anywhere, anytime. ♡ 0 · Reply Dan Shipper about 2 years ago @cvadnais I think this is a great idea!! Very possible today with the current technology. Keep us posted if you build it! ♡ 1 · Reply Alex Adamov about 2 years ago I like your experiments with GPT 😄 I think this active type of journaling can be useful and quicker to use than traditional journaling. For more large scale searching of documents with LLM including GPT3, check out Deepset and their Haystack library. Ps: I noticed you use “Please” in GPT prompts. I did that too but over time it can cost a few tokens but is not needed 😃 ♡ 0 · Reply Dan Shipper about 2 years ago @kiers77 no, what leads you to think that? I don't think this is even close to a replacement for therapy ♡ 0 · Reply'''
