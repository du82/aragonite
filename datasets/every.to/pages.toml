["https://every.to/chain-of-thought/how-to-figure-out-what-people-want"]
title = "How to Figure Out What People Want"
description = "Think in sequences, not essences"
full_description = '''Georgia Patrick 4 months ago AttaBoy, Dan. Write like you mean it and from your experience. I love this because it is you, the founder, talking to me, the founder, and we know obsession with client delight over our own ego is important. No screen shots. No prompt scripts. An article from your head and heart. Hooray. ♡ 2 · Reply @benjamin.koensgen 4 months ago I've always found the juxtaposition of Steve Jobs's "It's not the customer's job to know what they want" and the startup advice "Make something people want" both compelling and slightly perplexing. You clarify and provides what i have been seeking. Thank you ! ♡ 0 · Reply JS 4 months ago Dan, I was following your train of thought until you transitioned into "Learn to be the right kind of person". The example of restaurant proves the point, however, doesn't solve the problem of software products (which Every and you are likely focused on). Software products don't have as much of semantic feel (like restaurants decoration and zaatar etc). Could you please expand a little on the ending and tie it back to software products? Thanks. ♡ 0 · Reply @chawlagaurav10 4 months ago @smith.jason.work I feel all products that work in a competitive environment are a culmination of thousands of small details that the maker of the product chose to prioritize, creating a product that feels like it is greater than the sum of its parts. It may not be true for products that don't have to compete, but for products like Skype vs teams, in the software realm, or the users choose based on these layering of details, of how convenient, well thought out something is. As Walt Disney used to say, it is the details that singularly might not matter to a customer, but thousands of details do leave a subconscious mark, that is hard to replicate, and is something users respond to and appreciate nonetheless. ♡ 0 · Reply'''
