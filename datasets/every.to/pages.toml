title = "Inside the Pod: Use ChatGPT to Super-charge Your Productivity"
description = "Expand the horizons of how much you can do with AI"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Thank you to everyone who is watching my podcast, How Do You Use ChatGPT? If you want to see a collection of all of the prompts and responses in one place, Every contributor Rhea Purohit is breaking them down for you to replicate. Let us know in the comments if you find these useful. —Dan Shipper After listening to Andreessen Horowitz’s Steph Smith talk about building businesses on the internet, for instance, I was inspired to create an online class about switching careers and taking the plunge into freelance writing. I promised myself I would put together an outline over the next week. But when Monday rolled around, I found myself steeped in brand-new work, caught in the next week’s cycle of obligations, and the idea for the course completely slipped away into the ether. Sometimes, the ghosts of forgotten ideas come back to haunt me, and when they do, I cut myself some slack, assuring myself that I couldn’t do justice to all these things at the same time. I can only do so much. This strategy, and coping mechanism, worked very well for me until Dan recorded an episode with Anne-Laure Le Cunff. Le Cunff is the founder of Ness Labs, a newsletter and learning community of over 80,000 curious people aspiring to achieve ambitious goals while nourishing their mental well-being. She’s a Ph.D. candidate in psychology and neuroscience at King's College London. She is also writing a book, Liminal Minds, that explores the intersection between curiosity and ambition. The reason she’s able to do so much, she says, is ChatGPT. In the episode, Le Cunff talks about how ChatGPT saves her time on administrative tasks for running her company. It makes her writing process more efficient, helping her create better outlines and fine-tune finished drafts. It also breaks down dense research papers so that she can incorporate them into her Ph.D. studies."
