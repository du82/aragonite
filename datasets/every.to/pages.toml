["https://every.to/means-of-creation/the-web3-renaissance-a-golden-age-for-content"]
title = "The Web3 Renaissance: A Golden Age for Content"
full_description = "Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. You've probably noticed there's a ton of stuff to invest in these days. NFTs, artwork, wine, sneakers, video games. The only problem? Nobody's doing the hard work to value this stuff! Sure, investing in a dinosaur skeleton is cool. But how do you know if it's a good deal? Follow Stefan and Wyatt as they demystify these new markets. Each week they find interesting investment ideas and analyze the heck out of them, bringing you in-depth research and analysis. You name it, they cover it. This isn't just about info, it's about results. They were among the first to track these new markets, and their recommendations are already crushing the benchmarks. In January 1996, Bill Gates published what would go on to become one of the classic essays of the early internet. In it, he describes the very characteristics of the internet that would lay the foundation for the Creator Economy. “One of the exciting things about the internet is that anyone with a PC and a modem can publish whatever content they create,” he writes. While Gates’s essay is remembered for its prescience about the direction the internet would take, what’s less well-remembered is that he also sounded a warning: “For the internet to thrive, content providers must be paid for their work,” he writes. “The long-term prospects are good, but I expect a lot of disappointment in the short-term.” Gates’s analysis was ahead of its time. While it’s true that the internet has made it possible for virtually anyone to publish content online, it’s also true that, a quarter of century after “Content is King” was published, earning meaningful income as a content creator has proven elusive. The lived experiences of creators tell the story: 90% of streaming royalties on Spotify go to the top 1.4% of musicians. The top 1% of all streamers earn more than half of all revenue on Twitch. 1% of podcasters claim the majority of podcast ad revenue. “To me, we’re not in a period of expansion,” one musician told The New York Times, speaking about earnings from streams on Spotify. “From an individual perspective of musicians, it has just been a downward trend of the rewards for our labor.” This isn’t inevitable, and it’s not unique to fledgling artists—it affects 99% of all creators, including famous names with millions of fans. When even they struggle to make a basic living online, something is artificially holding them back."
