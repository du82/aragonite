["https://every.to/napkin-math/the-vatican-has-some-thoughts-on-ai"]
title = "The Vatican Has Some Thoughts on AI"
description = "In a new statement, the Catholic Church expounds on the nature of human versus machine intelligence, and its views on the utility of AI"
full_description = 'Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. In a new statement, the Catholic Church expounds on the nature of human versus machine intelligence, and its views on the utility of AI Quick heads up: There are only four more days to register for my course, How to Write With AI. The four-week cohort-based class runs from February 13 through March 6 and includes: Over 90 students—including founders, aspiring writers, engineers, and professors—have already taken the course. Check out the website for more information and to enroll. Act quickly—registration will close on Sunday night: AI is scary because it forces us to re-examine the big questions: What is intelligence, what is consciousness, or even, what does it mean to be human? It is thus unsurprising that the pope, something of a specialist on such existential questions, is weighing in. The Vatican released a document last week called "ANTIQUA ET NOVA: Note on the Relationship Between Artificial Intelligence and Human Intelligence", in which they do their best to help resolve some of this dread. It may surprise you, but this isn’t the Catholic Church’s first foray into wrestling with the implications of AI. The Vatican has been working on this since at least 2016, when it hosted a panel at South by Southwest, and the pope has met with Meta chief Mark Zuckerberg and a variety of other tech luminaries over the last several years. The depth of their effort—across 13,217 words and 215 footnotes—shows. Most of the work on the relation of the soul to AI has been laughably thin. This note is different. They lay out a theory grounded in Christian theology and classic philosophy that I found moving and, more importantly, helpful. There are some shortcomings, but overall, this document is profound. My goal today is not to argue for a particular faith tradition or theological view. However, I find that studying a faith that is very different from my own personal truth is useful as I consider the impact AI is having, and will have, on my own life and career.'
