["https://every.to/chain-of-thought/we-tried-openai-s-new-deep-research-here-s-what-we-found"]
title = "We Tried OpenAI’s New Deep Research—Here’s What We Found"
description = "Vibe check: It’s awesome."
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Alex Duffy is the consulting lead and a staff writer who writes about AI tools and technology in Context Window. If you give it a question—like, “Can you compile a wardrobe for me based on these pictures?” or “Can you write a history of Every’s business from its founding until now?” or “Look through recently filed 10ks, do you see any uncaught financial discrepancies?”—it will happily go off and compile a full-blown research report that can run upwards of 16,000 words. Crucially, it’s not like previous versions of ChatGPT that are equipped with web browsing that simply summarizes the results of a single web search. Instead, deep research runs fully autonomously and works through many steps before returning an answer. Deep research is an information bloodhound, let loose on your question until it synthesizes an answer. It can take anywhere from one to 30 minutes depending on the complexity of the question. And you can watch it do research in real time, following its thought process as it trawls through sources—from one to more than 22 in our tests—thinks through its findings, and knits everything together into a single comprehensive report. It works much like Google’s product of the same name released a couple months ago, but unlike Google’s version, we think deep research is pretty awesome. It is a chauffeured stretch limo for the information superhighway. It is a double-decker tour bus— but you’re the only passenger and the city you’re touring is the sum total of human knowledge. It is C-3PO but less neurotic. It is Samwell Tarly but not as bumbling. It is Hermione if she never gets tired. In other words, it is a bazooka for the curious mind. So how does this bazooka work? And where might it be useful? Getting started with deep research is straightforward: You select “Deep research” inside the ChatGPT interface, type your question, and watch it go."
