["https://every.to/no-small-plans/no-margin-no-mission"]
title = "No Margin, No Mission"
description = "The ethical imperative to make a profit"
full_description = "Beth Adele Long over 1 year ago Fantastic post -- thank you for framing the ethical parameters so clearly but not stopping there. The practical recommendations at the end are relevant to projects I have going and were tremendously helpful. ♡ 0 · Reply I'm a founder, writer, and executive coach based in NYC. To find out more about coaching or sign up for my biweekly newsletter, visit: nosmallplans.io This essay is brought to you by Retool at Scale - Join our exclusive live stream; 9:00am - 10:00am PST, November 16, 2023, featuring Pinterest. Discover how they transformed their internal processes, standardizing tools for 1000s of employees. When I was in my late twenties, I fantasized about joining a monastery. Learning more about the monks changed how I think about business. I had just left my first startup, and I was exhausted. Even though we’d had a small exit, I only had a year of runway to figure out what to do next. Monastic life seemed like a hack for solving the money problem. I imagined spending days meditating, reading the classics, and engaging in communal life—without the pressures of capitalism and rent in New York City. At the time, a friend of mine was doing a nine-month retreat at Blue Cliff Monastery, a Buddhist center in upstate New York in the tradition of Thích Nhất Hạnh. I visited him for a few days and ended up chatting with one of the older monks about money. He told me that the monastery was going through financial difficulties. Thích Nhất Hạnh had suffered a stroke in 2014. Up to that point, Hạnh had done yearly teaching tours in the U.S. that brought in donations and new members. Thích Nhất Hạnh also had a calligraphy practice, and his art was sold online and at the monastery to people who came for short stays. These had been significant drivers of revenue, and after Thích Nhất Hạnh's stroke—well, the numbers didn't quite work the same. A small group of monks and nuns was attempting to solve the problem, and had brought in consultants to help with fundraising and create a roadmap for financial sustainability that relied less on Thích Nhất Hạnh (he finally passed away in 2022)."
