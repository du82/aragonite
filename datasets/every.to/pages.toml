["https://every.to/podcast/how-nat-eliason-made-200-000-in-a-week-teaching-ai"]
title = "How Nat Eliason Made $200,000 in a Week Teaching AI"
description = "He’s been turning trends into wins for years—now he’s doing it with an AI course"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. TL;DR: Today we’re releasing a new episode of our podcast AI & I. I go in depth with Nat Eliason, author, podcaster, and prolific internet creator. We get into how AI changes the way Nat thinks about his career, the progress of AI coding agents, and the writing tool of his dreams. Watch on X or YouTube, or listen on Spotify or Apple Podcasts. Here’s a link to the episode transcript. In the last five years, he ran an SEO agency, got into crypto, made $600,000 from a course on the note-taking tool Roam Research, flipped real estate in Austin for a 6x return, and published a book with Random House. He’s now writing a book of science fiction and running a viral course about building apps with AI. I’ve known Nat for a long time, and I think he knows where the puck is headed better than anyone. He’ll see a new tool or trend, master it, build a business around it, and move on. Nat’s pulled it off with crypto, Roam, real estate—and now AI. His app-building course has over 800 students and racked up $200,000 in pre-sales in one week. Nat was one of the first guests I had on the podcast and I was delighted to have him on again. We spent an hour talking about how coding with AI is creating new behaviors in programming, Nat’s best practices for using the coding tool Cursor, and his take on the future of writing with AI. Nat discovered Roam when Every’s first employee Adam Keesling tweeted about it. Blown away by the tool, Nat tweeted about it—and when he saw people were interested in the app, he asked if anyone wanted him to do a course on how to use Roam. He got $10,000 in pre-sales and made $600,000 in revenue over the next year, in part because of a partnership Nat had with Roam. “I thought I was never going to do a course again,” says Nat as he tells the story of his viral AI course. When coding agents became popular in the fall of 2024, Nat used them to build apps for himself—an AI book editor, and a tool to automate show notes and timestamps for his podcast. Then, history repeated itself. He tweeted about the apps he’d built with AI, saw people’s interest in the topic, and asked if there was demand for him to do a course. I think it’s wild that he closed $200,000 in pre-sales that week."
