full_description = '''@sarah.c over 1 year ago I have a bit of a problem with the idea that it's his genius that lets him get away with being an asshole. If poor people break the rules and discard social norms the way rich guys like Musk do, we end up unemployed/homeless/imprisoned. It's the wealth and power that allows people to behave in this way, for good or ill, not any kind of special genius. ♡ 3 · Reply @alex_3418 over 1 year ago At one end of the spectrum, he has made Incredible achievements, I couldn’t do it. At the other end, well at least he is not Charles Manson. That’s a pretty low bar, and why aren’t we digging into that? That’s what’s offering him a lot of leeway to be a childlike maniac. Lebron James has a duty to be a responsible athlete so that kids look up to him and want to be better. Why are we not talking about the utter lack of responsible leadership in tech? ♡ 2 · Reply @rberger over 1 year ago @alex_3418 The fact that Musk went all fascist when he could have been one of the greatest examples of what humans could be, as a responsible technologist, is his greatest failing. Unfortunately, I think the Charles Manson comparison is apt. Musk is insane. The only real difference its that he has an insane amount of power. ♡ 1 · Reply George Meza over 1 year ago I'm not an "Elon fan" and I do try to use critical thinking. So saying that "There isn’t that much of a difference between the two" Charles Manson, a serial Killer, an Elon Musk, is not only the laziest of analogies, but it demonstrates the kind of ad-hominem argumentation that eliminates the credibility of anybody making the assertion... Nuance is dead even among long-form writers. Sad state of affairs we find ourselves in. ♡ 1 · Reply @majid over 1 year ago @JCX That whole setup was lame. Why do writers try so hard to give us emotional tugs and to put smiles on our face. And please, why do we glorify financial success?! ♡ 0 · Reply @rberger over 1 year ago I am concerned that Musk is the most dangerous person in the world right now. He has too much power and is too unstable. He has shown that he is a literal fascist and could easily be full Nazi. He needs to be punched. ♡ 0 · Reply'''
