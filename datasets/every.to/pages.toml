["https://every.to/chain-of-thought/chatgpt-and-the-future-of-the-human-mind-242f919d-be5f-46cc-addb-c4b3f83265ec"]
title = "ChatGPT and the Future of the Human Mind"
description = "AI is a lever that becomes a lens"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Technology changes how we see the world—and ourselves. If we want to save our conception of human creativity and intellect, we need to get clear on what LLMs can do and what humans are uniquely capable of. That’s what I’m attempting to do with this piece from the archives. If you’re interested, you can also watch it as a newly created video essay on YouTube, Spotify, or Apple Podcasts. —Dan Shipper I felt ecstatic that computers could finally talk back to me. But I also felt a heavy sense of dread. I’m a writer—what would happen to me? We’ve all had this experience with AI over the last year and a half. It is an emotional rollercoaster. It feels like it threatens our conception of ourselves. We’ve long defined the difference between humans and animals by our ability to think. Aristotle wrote: “The life of the intellect is the best and pleasantest for man, for the intellect more than anything else is man; therefore, a life guided by intellect is the best for man.” Two thousand years later, the playwright and short story author Anton Chekhov agreed in his novella, Ward No. 6: “Intellect draws a sharp line between the animals and man, [and] suggests the divinity of the latter.” The primacy of thinking and the intellect as the feature by which we define ourselves has become even more salient as we’ve moved from an economy driven by industrial labor into one driven by knowledge. Indeed, if you’re reading this, you probably put a lot of stock into what you know. After all, that’s what knowledge work is all about. If we define ourselves and our value this way, it’s no wonder LLMs seem scary. I think LLMs will change knowledge work. In doing so, they’ll change how we think of ourselves, and which characteristics we deem uniquely human. But these days I’m not particularly scared. In fact, I’m mostly filled with excitement."
