title = "Revenue: It’s Simple, Until It Isn’t"
description = "Finally, a clear explanation of bookings, billings and revenue"
full_description = "Nicole Husain about 4 years ago This was a great intro to revenue, thank you! Would love to see the next one in the series be about COGS, especially in SAAS or software, there seems to be a lot of variations on a theme on what costs companies include when it comes to producing & delivering a product ♡ 2 · Reply @paul_7380 about 4 years ago I’m unclear about the distinction you were drawing about cash on hand vs revenue (e.g. paying $200 upfront vs $20 per month). Was this simply pointing to how you have to record it in your books? Like, you can spend that $200 ASAP, but you must log it as 12 monthly payments? ♡ 1 · Reply Rodrigo Fernandes about 4 years ago In the last two lines, shouldn't we have $50,000/12 instead of $52,000/12 ? ♡ 1 · Reply Gerold Blazek almost 4 years ago Need definitions . Saas , subscriptions , professional services . When they overlap and when they don’t ♡ 1 · Reply @seansoderborg almost 4 years ago Unfortunately the writing in this post is slipshod, long winded, and ultimately full of connections that don’t make sense and other nonsense trying to use a hacky college-level Professional Writing 101 voice to disguise lack of real knowledge, not to mention lack of talent. For example, “Very little financial writing exists for non-finance leaders.” What is he talking about? And Wrapping It Up section is a joke. After droning on for at least 1000+ words without ever making any points of his own, the writer makes a rushed analogy about fortune telling and then adds a plug for the newsletter for good measure? I, for one, felt that my time had been wasted, that the article was trying to trick me into thinking it had a lot more going for it than it really did, and worse, I was bored. This “article” would have worked better as a handful of bullet points. Sorry to be a downer, but this writer isn’t cutting it for me. ♡ 1 · Reply"
