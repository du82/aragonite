["https://every.to/napkin-math/can-anyone-compete-with-meta-s-new-ai-model"]
title = "Can Anyone Compete With Meta’s New AI Model?"
description = "Zuckerberg’s open-source gambit could burst the AI hype—or save it"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This isn’t a hypothetical scenario or founder’s nightmare. It is the cold, capitalist reality for AI model providers today and one with a long history in tech. The Internet Explorer web browser killed Marc Andreesen’s Netscape browser in 1998. Microsoft took Slack out behind the woodshed with Teams in 2019 and has far surpassed the former’s growth since then. And now, Mark Zuckerberg might do the same to OpenAI. This week, Meta released the Llama 3.1 series of large language models. According to various benchmarks in areas such as math and reasoning, these models are sometimes superior and always competitive with offerings from OpenAI, Google, and Anthropic. To make it worse (at least, for OpenAI employee’s stock options), the model is open-source, making an important part of the AI tech stack free to use for enterprises. Llama 3.1 is the most important AI model—open-source or otherwise—of the last year. I can think of no other category of technology, in the history of humanity, that has received AI’s level of funding, only to be potentially undercut by an entirely free offering."
