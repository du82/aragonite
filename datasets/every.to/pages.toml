full_description = '''Georgia Patrick over 1 year ago Dan & Kate, At last, a grown woman professional in the Every wheelhouse! This is refreshing and great to see. Every has a quality of writing that draws me in as a reader and writer. I'll look for ways to support Kate in her new job, and new company as I see what she does with writers, readers, and the direction of Every. Technology can mean many things. A pen and paper is technology. So is a toaster. I started my career as a technical writer, so I understand where there are boundaries or overlaps with "not technology" writing. ♡ 2 · Reply Katie Felten 2 months ago Dan and Kate, this post truly resonated with me. Dan, I admire how you consistently articulate ideas in such a clear and inspiring way—your ability to frame thoughts and elevate the mission of Every is something I deeply align with. Your description of Kate’s unique combination of editorial and technology skills, incredible taste, and fun-to-work-with energy is exactly how I hope people would describe me one day. Kate, your words about inspiring others to build new things, see the world in new ways, and feel less alone deeply moved me. The emphasis on quality, rigor, and creating meaningful work that galvanizes others to act feels so forward-focused and aspirational. It reflects values that I hold close in my own work. Thank you both for leading with such clarity and intention—it’s inspiring to see Every continue to grow as a space for ambitious builders and curious thinkers. ♡ 1 · Reply Dan Shipper 2 months ago @kfelten glad it resonated! appreciate you going back through these old posts to see what we're about :) ♡ 0 · Reply'''
