full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Thank you to everyone who is watching or listening to my podcast, AI & I. If you want to see a collection of all of the prompts and responses in one place, Every contributor Rhea Purohit is breaking them down for you to replicate. Let us know what else you’d like to see in these guides. If you’d like to revisit my conversation with Claire Vo, watch on X or YouTube, or listen on Spotify or Apple Podcasts.—Dan Shipper Vo is a parent who has a full-time job as the chief product officer at the software company LaunchDarkly, and she’s now running a six-figure business on the side. She built hers over Thanksgiving weekend last year while her two sons watched Aladdin—with a little help from AI. Vo is the founder of ChatPRD, an on-demand AI copilot for product managers. The app, which has been used by more than 20,000 product managers, helps them and their teams write better product documents faster. The name itself is a play on “PRDs,” or product requirement documents, that are overviews of what new products should do, how they should look, and what features they need to have. In this episode of AI & I, Dan Shipper interviewed Vo about how ChatPRD works, and how AI made it possible for her to build a thriving business. This is a great time to revisit their discussion from June because ChatPRD recently turned one year old. I’ll pull out the key themes from their discussion (with screenshots from Vo’s computer), including: This is a must-watch for anyone who wants to build a six-figure side hustle, or who works in product development. You’re probably creating more than ever before—writing essays, recording podcasts, promoting your work on social media. We want to make it easier for you to move fast. Use Spiral, our tool to automate 80 percent of the repeat work that comes after creating—social media posts, YouTube descriptions, newsletter blurbs, and more."
