["https://every.to/podcast/chatgpt-can-turn-anyone-into-a-video-game-developer"]
title = "Inside the Pod: ChatGPT Can Turn Anyone Into a Video Game Developer"
description = "Yes, even if you don’t know how to code"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Slides are a thing of the past. Gamma introduces a new way of presenting ideas—faster, more flexible, and powered by AI. With Gamma, you can create stunning content effortlessly, optimized for any device and platform, without wasting time on design or formatting. How Do You Use ChatGPT? is taking a week off—we’ll be back next week with a new episode. In the meantime, we’re publishing the next piece in our series based on the podcast, in which we share actionable, tactical ways that some of the smartest people in technology are using ChatGPT and other AI tools. Every contributor Rhea Purohit breaks down the conversations from the podcast and pulls out the prompts and responses—complete with screenshots—for you to replicate. Read on to learn exactly how Dan Shipper and Logan Kilpatrick, who was OpenAI’s first developer relations advocate (he left the company since we recorded the episode), make a video game with ChatGPT in less than an hour. —Kate Lee However, I do understand being daunted by a skill that feels totally foreign. It’s how I feel about software. I don’t know how to code and wouldn’t even know where to begin. Dan Shipper and Logan Kilpatrick believe that building software is a superpower. In this conversation, they talk about how ChatGPT has enabled everyone to be a builder. They also walk the talk by making a video game called Allocator with ChatGPT in less than an hour—all without writing a single line of code. Say goodbye to basic slide presentations. Gamma uses cutting-edge AI to revolutionize how we share ideas. It's not just a tool; it's a creative assistant, enabling you to create visually captivating content quickly and seamlessly. Whether you're presenting to a small team or a large audience, Gamma ensures your ideas shine across all devices and platforms. Experience the difference for free!"
