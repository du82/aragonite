["https://every.to/p/how-ai-can-supercharge-your-favorite-productivity-frameworks"]
title = "How AI Can Supercharge Your Favorite Productivity Frameworks"
description = "Four tried-and-true methods—reconsidered"
full_description = "Stella Garber is the co-founder and CEO of Hoop. Previously, she led marketing at Trello, building the team as its initial marketing hire to Atlassian's acquisition and beyond. AI is rewriting all of our standard productivity techniques. I’ve already written that it will spell the end of organizing, but what about applying it to other classic standbys, like the Eisenhower matrix and the Pomodoro technique? Read this guide from Stella Garber—former head of marketing at Trello—if you want to learn how to maximize your favorite productivity hack with AI. —Dan Shipper NOTE: I’m speaking on a creator panel at New York Tech week this Wednesday afternoon, along with a16z’s Steph Smith, Gumroad’s Sahil Lavingia, and Numlock’s Walt Hickey. If you’re interested in attending, register here: Answering all of these “urgent” questions required coordinating with multiple people and cross-referencing documents spread across different tools. Most frustrating of all, it yanked me out of whatever I had set as my goal for the day. I found myself being pulled into impromptu meetings and having to set aside quiet time in the evenings to do focused work. There wasn’t enough time in the workday to actually do my work. The modern workplace has become significantly more distracting and interruptive in recent years. If you sit in front of a computer each day, you likely endure an endless barrage of pings and dings from Slack, your email, and constant calendar invitations. Organizational researcher Rob Cross, who wrote the book Beyond Collaboration Overload, found that collaborative demands on time—such as brainstorming meetings, draft reviews, and momentary gut-checks—have increased more than 50 percent in the past two decades as barriers to collaboration have decreased (and even more so since the pandemic). Artificial intelligence could ameliorate some of these problems. It could simplify the collaborative burden we put on others and help us get through our own to-do lists. That is, if only we actually knew how to use it."
