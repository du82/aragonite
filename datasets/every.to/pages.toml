["https://every.to/chain-of-thought/llms-turn-every-question-into-an-answer"]
title = "LLMs Turn Every Question Into an Answer"
description = "Part two: Language models as text expanders"
full_description = '''Aric Pearson 9 months ago Great post Dan, thanks for sharing some of your writing processes! ♡ 0 · Reply @ederochefort 6 months ago Hi Dan, greatly enjoyed reading Part One "Compressors" and this Part Two "Expansion" and was looking forward to Part Three "Translation" + four & five, but couldn't find them anywhere. Did you get around to write them & am I looking in the wrong places? Many thanks in advance ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. This essay is brought to you by Reflect, an ultra-fast notes app with an AI assistant built in directly. Simplify your note-taking with Reflect's advanced features, like custom prompts, voice transcription, and the ability to chat with your notes effortlessly. Elevate your productivity and organization with Reflect. This is the second in a five-part series I’m writing about redefining human creativity in the age of AI. Read my first piece about language models as text compressors, and my prequel about how LLMs work. That's more or less what computers were able to do with text on their own for a long time. Barring a disk failure, text was always conserved, often moved around, sometimes crudely transformed. But they almost never created it. Other than doing a spell check, if you were seeing text on a computer, it was probably because some human, somewhere, had typed it. Now, you and I can type a few sentences into ChatGPT and watch it expand, character by character, line by line, into something new—composed out of thin air, just for you. Language models take your text and stretch it into a different shape, like glass heated and blown through a tube. What had previously been an inert collection of bits—a line of characters extending across a screen—is now something different, something potentially alive. When you feed a piece of text to a language model, the text is like an acorn turning into a tree. The acorn itself contains instructions for the tree it will become, and the language model becomes rich dirt, water, and warm summer sun.'''
