["https://every.to/chain-of-thought/ai-can-do-my-email-now"]
title = "I Let An AI Do My Email"
description = "A review of Superhuman AI"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. This essay is brought to you by Tool Finder, the one-stop online resource to find the best productivity tools out there. Stay ahead of the curve with our selection of the hottest productivity tools each month. “Omg. Can I call u now? I'm soooooooo proud of you and happy for u. Xoxoxoxoxox.”—my mom when I sent her the TechCrunch story covering the sale of my first startup. “Congrats!”—my investors replying to my long, detailed Every updates even when I’m sharing bad news. (Love y’all, seriously.) “Where’d you get this email?”—an author I admire after I guessed their email and sent a glowing missive about how they had impacted and inspired me. These are funny, but I actually think the one-line email is one of the greatest productivity hacks ever conceived. I first observed this in my dad who sends rapid-fire emails just by filling out the subject line, and I see this sort of behavior in productive emailers of all stripes. It is an art to respond to a long email with a single sentence. A one-line email says something about its sender: I am not like this. I have many fucks to give, I guess. I once tried to read Mark Manson’s artful work on this topic, but it was perhaps too subtle for me. When I send an email I don’t want to come off as rude or arrogant, so I overwrite. I use lots of exclamation points and smiley faces so that no one can get mad at me. I consider carefully everything I say, and I make sure to cover every corner case when I reply. I’ve tried a lot of different things to improve upon this. I’ve tried one-touch email strategies (ineffective for reasons outlined above.) I’ve tried endlessly haranguing myself over and over again in my mind (satisfying, but ineffective.) I’ve even tried using the power of social pressure by having my VA, Taylor, act as my email babysitter (more effective, but also embarrassing for a grown adult.)"
