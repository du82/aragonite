["https://every.to/masterful-storytelling/becoming-a-better-storyteller"]
title = "Becoming a Better Storyteller"
description = "Actionable ideas from an event with Adam Davidson"
full_description = "Joh Olson about 3 years ago I love this: “I always like to point out that I don't think that this is an inherent skill,” Adam says. “The difference between great storytellers and not great storytellers is just that they told a lot of stories badly, and then told them more, and then told them a little less badly.” Basically, just get started and keep going... learn as you go. ♡ 1 · Reply Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. Adam Davidson recently stopped by the Every Discord to give a talk for subscribers about how to become a better storyteller. This article is a summary of his most actionable ideas. Adam Davidson wants to help you become a better storyteller. He believes it’s a non-negotiable skill in the 21st century economy: “Back in the ‘60s, Don Draper could be a storyteller, while the rest of us just had to do our stupid job,” he says. “Now, in my view, we all need to be storytellers.” Sounds great, in theory. Until you remember that telling a good story is really, really hard. We all know that feeling (at least I know I do): gearing up for the big interview, the big pitch, the big product launch, channeling our inner Don Draper, ready to wow our audience with our storytelling prowess… only to fall flatter than a new comedian bombing their first set. You know who else knows that feeling? Adam himself. He’s told stories at the highest level in pretty much every medium you can think of: print, as a writer for The New Yorker and author of the book The Passion Economy; audio, as a journalist for This American Life and one of the co-founders of the popular Planet Money podcast; and even film, as a consultant on projects like The Big Short. And as he points out, even he and the greats that he’s worked with in all of those fields⁠—Ira Glass, Alex Blumberg, Adam McKay⁠—don’t nail it on the first attempt. “If you're in a story meeting, you're going to hear some of the dumbest worst story pitches of your life,” he says. “I’m working on a project with a big director right now, and if you could see our texts, you’d see⁠—it’s just not there yet.”"
