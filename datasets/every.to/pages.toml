full_description = "@rob.silas about 1 year ago An awesome post as usual, Evan. I am a founder and solopreneur, am starting to create GPTs to use in my consulting work, and thinking about the best ways to provide guidance for clients on how to use them. Your insights are spot on and I'll definitely try out Founders Friend. Thanks again! ♡ 2 · Reply Evan Armstrong about 1 year ago @rob.silas Thanks Rob! appreciate it. LMK how Founder's Friend works for ya ♡ 0 · Reply @rukidden about 1 year ago Evan, thank you for writing such an informative and engaging article on AI. I’m a 63-year-old Medical Lab Scientist who doesn’t work in the tech field, but I’m fascinated by the potential and impact of AI on our lives. Your article hooked me because you used relevant resources and examples to show how AI can be applied to both personal and professional situations. One of the things that I liked about your article is that you discussed conversational AI, which is something that I often use. I prefer Inflections PI AI, because it has a natural and smooth dialogue flow. However, I also use other AI services for different purposes, such as Claude AI for summarizing books, Google or Bard AI for image searches, and Microsoft Copilot for basically everything else. I think Chat GPT is the pioneer of generative AI, but the benefit I can get from Copilot has not fallen far enough behind Chat GPT to make the monthly fee worth it. I enjoyed your informal and conversational style, which made your article easy to read and understand. I like reading Ethan Mollick’s articles as well, but he appears to focus more on the organizational and social aspects of innovation (especially how it can be used in education), while you focus more on the personal and psychological aspects. I think both perspectives are important and complementary, and I would love to see you collaborate or compare your views with him or other authors on AI and innovation. I think your article is a great introduction to AI and its applications for people from different backgrounds and interests. You have a clear and friendly tone, and you provide useful and relevant information and examples. I appreciate your work and I look forward to reading more of your insights and experiences on AI and how it can be incorporated into our daily lives. Keep on plugging. You’re on a very beneficial road. Next article might be amazing rather than just very good. 😊 ♡ 1 · Reply"
