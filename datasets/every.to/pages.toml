["https://every.to/napkin-math/the-right-kind-of-asshole"]
title = "The Right Kind of Asshole"
description = "A founder’s personality can differentiate them—or destroy them"
full_description = "Oshyan Greene 10 months ago Is it inevitable that humans create systems where success is correlated with being an asshole? (god I hope not) Or is the lack of finding/developing alternative ways of creating value, progress, and innovation partly a result of aspects of asshole-driven systems that self-perpetuate? Do we simply lack the imagination and faith to pursue alternatives to the point that they might succeed? I have only questions, no answers, but it bothers me that we accept so many ills for the theoretical (sometimes even actual!) benefits of capitalism. ♡ 2 · Reply Evan Armstrong 10 months ago @Oshyan its an interesting point! i don't know if i have an answer. ♡ 1 · Reply Vikash Rugoobur 10 months ago Evan, your words create a stark mix of feelings in me. Thank you. You highlight fair evidence, but there is something missing from this formula. Getting people to join you in building that bold idea, and staying for the journey, is an often missing consideration amongst valley folk. Its not a sexy thing to talk about - you cannot brag about it at a board meeting or boast about it with your LPs. It is inward, viscous, nuanced and requires superhuman endurance. Having a bold idea, having clear opinions, refusing to accept less than exceptional etc, does not mean you NEED to be an asshole. Its just easier to do and it is rewarded in the short term. I wonder what would happen if we had more women running companies... ♡ 2 · Reply"
