full_description = '''@every.eb6c40 about 1 year ago The price tag is another barrier to entry. With the Meta Quest being on par with a gaming system, people will be ok with the lower quality. It get's better with each release. I appreciate seeing where the future is headed, but at the cost of a used car, most people aren't going to think twice about getting an AVP. ♡ 1 · Reply Evan Armstrong about 1 year ago @every.eb6c40 I don't think so—the sales numbers are so abysmal in its the Quest's current format that I think they have no choice but to go upmarket. ♡ 0 · Reply @every.eb6c40 about 1 year ago @ItsUrBoyEvan It makes sense for them to go up market. I can't imagine Apple ever selling anything that isn't "premium" and I also can't imagine them selling anything at a loss (or break even) for the sake of market share. That just ins't their MO. I think the product looks great and it's definitely the best you can get right now. The specs will eventually trickle down to other product price points as the pieces get cheaper and volume of sells increase. This is a great example of what the future holds for this product category, though. I'm really looking forward to the next few years as I think AR and VR will be a game changer. ♡ 0 · Reply @nicky_5977 about 1 year ago Loved reading your write up. Thank you. This part was pretty moving for me. "Can you imagine what this means at scale? All of humanity can truly feel the suffering, the hope, the joy of our own past experiences, and live in the stories of others. Empathy can be a product, a gadget that people can purchase and carry with them. I think it can create a more peaceful, better world. I’m sold." Thank you ♡ 0 · Reply @seth.ulinski about 1 year ago Great insights. Initial distribution and price point make sense. A bit of a head-scratcher with limited content via partnerships and developer programs. However, being mindful about a product this revolutionary makes sense if we consider the ripple effects of AI (e.g. deep fakes, fraud) and social media (e.g. mental health, false news). Being a trailblazer is great as long as society doesn't get torched in the process. ♡ 0 · Reply'''
