["https://every.to/chain-of-thought/gpt-4-a-copilot-for-the-mind"]
title = "GPT-4: A Copilot for the Mind"
description = "Never forget what you read again"
full_description = '''Mattes almost 2 years ago Hi Dan—very good points. I think personal LLMs will have huge value for people and can change the industry again. You'll find my thoughts about this here: https://medium.com/@mattesmattes/chatgpt-4-may-be-the-best-thing-that-could-happen-to-apple-3432fb33ba12 ♡ 0 · Reply Chris Harvey almost 2 years ago Dan, great article! I'm excited for the future. One critique and one comment: 1) When you say the context window of [[ChatGPT-4]] is "8x larger" than Chatgpt-3.5, i think you need to quantify what you're saying. Graham Lipman (@glipsman on Twitter) nailed it: —About 25,000 words, or 100+ pages of a novel (see https://twitter.com/glipsman/status/1635697739349790720?s=20) 2) I've been told it was useless to capture personal ideas, notes, articles, books and other relevant time-bounded items because we have no good way to harvest them. It's like pulling all this fish from the sea but having no way to find what you've caught to cook up, at least not at scale. Now we have a machine than can not only find what you're caught, but help you preserve and find the best fish to eat. Very excited that my efforts to preserve my ideas may end up not being wasted. —Chris ♡ 0 · Reply Diego Escosteguy almost 2 years ago Great article. One minor error: it’s Jorge Luis Borges, and not Jose. A copilot might help - all of us! - with this kind of mistake. ♡ 0 · Reply @michaelelling63 almost 2 years ago What if they make you less smart because "you don’t need to worry so much about remembering what you read." One's intellect and ability to imagine is a function of how one associates and synthesizes retained knowledge. Jeff Hawkins does a good job mapping how the brain develops and works relationally. Judea Pearl writes about how we imagine and innovate. Sure you can ride an ebike, but you won't exercise your muscles and become a better cyclist and be more fit. There are innumerable examples where people have lost basic mental and motor skills as they rely on new technology. That said, a process that helps you expand or maintain the existing associations and mental mappings will be quite useful. I would certainly be interested in mining the last 9 years of extensive digital note taking and linking within my 44 evernote notebooks. ♡ 0 · Reply'''
