["https://every.to/napkin-math/devote-yourself-to-the-cause-of-your-life"]
title = "Devote Yourself to the Cause of Your Life"
description = "Your to-do list can wait"
full_description = "@jcmanthorpe over 1 year ago So loved this post... you spoke to me as I'm in the middle of reinventing myself and finding purpose in my life,. I'm doing this by looking at my mulitple gifs, skills, expertise and passions I've gathered in my life, to make a difference authentically, only I can do. ♡ 1 · Reply Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This essay is brought to you by Uptrends.ai, it's like Google Trends and Wall Street merged into one powerful tool. Get 50% off for your first 3 months by entering the code EVERY50 when you sign-up and jumpstart your financial journey. My career in tech consisted of creating slides for the pre-meeting, tweaking said slides for the actual meeting, and conducting the obligatory post-meeting debrief *gags*. Some of my finance-oriented roles had me do more spreadsheet work, but the workflow was the same. At times, I would be on the strategy team or would be doing work for VC funds, but the job was basically identical. Perform analysis, convince people it was right, move on to the next thing—all without ever having a stake in the idea. Being a glorified intellectual butler was a great way to make money. I despised every minute of it. I abhorred making slides. I loathed spreadsheets. I detested the political dance of managing the founder's ego. In short, I hated everything I was doing all day. But I was addicted to what doing those things gave me. I liked the power and the prestige and the money. Oh god, the money. It bought me things I had never had—weekend trips to Machu Picchu, $120 joggers from Lululemon, Barry’s Bootcamp classes three times a week. It was intoxicating living. Then Covid hit, and all of a sudden, I went through what a therapist would politely describe as a “brain go breaky breaky busted” experience. I realized I was miserable. Confined at home, thinking about how stupid my day-to-day tasks were, drove me (literally) mad. My anxiety spiked through the roof, and existential dread became a close friend. I had to get off the treadmill."
