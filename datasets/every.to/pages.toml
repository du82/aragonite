["https://every.to/napkin-math/a-million-dollar-software-idea"]
title = "Here's a Million-dollar Software Idea"
description = "Welcoming the dawn of a new era in computing"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. I have an idea for a new type of software company. It is radically different from anything that exists today, and if you read this article closely, you might be able to make millions of dollars. The pitch goes like this: Software is the greatest business man has ever invented. It is God’s gift to capitalists. The margins? High. The technical difficulty? Surprisingly low. If you follow the strategy proven by hundreds of startups, you can scale a software business to tens of millions of dollars of revenue in less than five years. It’s simple, cash-efficient, and has been the bedrock of tech’s might for decades. The three together create a virtuous cycle: The user inputs new data or takes some action with the data on the front end, which gets sent to the back end, starting it all over again. The multi-trillion-dollar world of software applications is all based on those three things. The technology is so simple that the majority of value over the last two decades has come not from sci-fi innovations in technology, but from innovations in how we distribute it. But I think that is about to change with a new model of design I call ambient software. If I’m correct, the right founder could completely undercut existing SaaS giants. And that’s where the millions of sweet, sweet dollar bills come in. I categorize enterprise software into two general periods: BS and ASS (Before Salesforce and After Salesforce’s Success). During the BS era—from the 1960s through 2000—software was installed on premises by professional services teams and sold via license. In 2000, the ASS period began. Salesforce proved that you could deliver software over the internet and create new business models with it. You didn’t have to install the software onto someone’s servers and charge service fees. You could just charge a monthly subscription fee and update the software remotely, generating superior long-term economics. The ASS period, which continues to this day, has birthed many tech winners, especially those that have a good product and a novel distribution strategy—like Slack (which had product-led growth) and Snowflake (which implemented usage-based pricing). Software didn’t need technical innovation to win as much as it did unique distribution."
