["https://every.to/working-overtime/what-happens-when-ai-joins-the-org-chart"]
title = "What Happens When AI Joins the Org Chart?"
description = "From assistants to execs, AI is claiming a place in our workplaces"
full_description = "Paul Carney about 2 months ago Asking humans to incorporate them into our teams will require us to build trust and loyalty with them. While those are typically qualities we assign to human relationships, we have to develop a new set of these to describe and support the human-AI collaboration. It is basically an AI Emotional Intelligence (AIQ). The superusers of AI that I meet have built these types of structures. The casual users have not - and it holds them back. Great article!! ♡ 0 · Reply Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. On the first weekend of the new year, OpenAI CEO Sam Altman published a post on his personal blog. The post, titled “Reflections,” is a sweeping look back at the journey of OpenAI and the potential of artificial intelligence. But the internet (and I) quickly zeroed in on one passage in particular: It seems the OpenAI team is determined to make AI coworkers happen. And if OpenAI is working on it, we’d better pay attention. OpenAI isn’t the only org anthropomorphizing AI tools as “workers,” either: From Silicon Valley giants such Google, Microsoft, and IBM to startups like Glean and Lindy, tech companies are racing to develop the “AI coworkers” that will populate our virtual workspaces. In July 2024, the software company Lattice made headlines when it declared on its blog that it would be the first organization to give AI workers official employee records. According to Lattice CEO Sarah Franklin, these AI “employees” would be onboarded, trained, given goals, and managed just like human employees. Public backlash to the Lattice announcement was swift and fierce. Even other AI execs joined the pile-on: “Treating AI agents as employees disrespects the humanity of your real employees,” one chief of staff at an AI sales platform told The Guardian. “Worse, it implies that you view humans simply as ‘resources’ to be optimized and measured against machines.”"
