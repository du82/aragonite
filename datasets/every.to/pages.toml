["https://every.to/chain-of-thought/five-new-thinking-styles-for-working-with-thinking-machines-9091eb3c-b96d-4a17-af1e-fb0a3f544bfd"]
title = "5 New Thinking Styles for Working With Thinking Machines"
description = "AI is turning science into engineering—with unprecedented changes for how we see the world"
full_description = '''@ynot 3 days ago A very interesting perspective. But I wonder, given our thirst for endless improvement & optimization, when the "new thinking" doesn't provide the desired results, the we will tempt to aid it with "old thinking". ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. It’s the last day of Every’s think week—our quarterly time to dream up new ideas and products that can help us improve how we do our work and, more importantly, your experience as a member of our community. In lieu of publishing new stories, we’ve been re-upping pieces by Dan Shipper (who’s been on hiatus from writing his regular Chain of Thought column to work on a longer piece) that cover basic, powerful questions about AI. Last up is his piece about how humans should think in a world with thinking machines. We'll be back with a new piece on Monday.—Kate Lee A world with thinking machines requires new thinking styles. Our default thinking style in the West is scientific and rationalist. When was the last time you heard someone talking about a hypothesis or theory in a meeting? When was the last time, when sitting down to solve a problem, you reminded yourself to think from first principles? When was the last time you tried an experiment in your work or personal life? Even the frameworks we use to understand business are scientific: It’s unlikely that Harvard Business School professor Michael Porter would have looked for or found five “forces” governing business without physics as inspiration; Clay Christensen’s jobs-to-be-done framework is close to an atomic theory of startup ideas. We romanticize science and rationalism because it's been so successful. Since the Enlightenment, when Galileo, Newton, Descartes, and Copernicus began to think in this way, we have used rationalism to generate modernity. It's where we get rockets and vaccines from, and how we get computers and smartphones.'''
