["https://every.to/napkin-math/ai-looks-like-a-bubble"]
title = "AI Looks Like a Bubble"
description = "Investors need to take a cold shower"
full_description = "@joshuah about 2 years ago Great article. Loved the walk through on C3ai. CEO Tom Siebel was on Bloomberg a couple days ago - bigtime word salad. ♡ 0 · Reply Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. This essay is brought to you by Vanta, the leading Trust Management Platform. Need SOC-2 Type I? They can help you get it in just two weeks. Bubbles are when people buy too much dumb stuff because they think there is someone dumber than them they can sell said stuff to. Take the crypto bubble in 2017. When Bitcoin mooned, a variety of companies pivoted to the blockchain and saw huge gains in their stock price. Those companies included a furniture firm, juice makers, a gold miner, and my personal favorite—a sports bra manufacturer. The most telling example was Long Island Iced Tea, which had a market capitalization of $23.8M. It announced that it was changing its name to “Long Blockchain Corp” and saw its stock boom by 183% in one day. In pre-market reading it had risen by over 500%. “BuzzFeed CEO Jonah Peretti wrote in a memo to staff that the company would rely on ChatGPT creator Open AI to enhance its quizzes and personalize some content for audiences, the Journal reported.” Buzzfeed’s stock boomed ~260% within two days to a ~$464M valuation. Simultaneously, there have been multiple reports in the private markets of AI companies raising at billion-dollar valuations—while having zero revenue. Some snarky hedge-fund analyst probably thought that the sports-bra-ification of AI would happen, and they could turn a quick profit by selling stock to the rubes who bought anything with the word “crypto” slapped on it. Sources have also told me that OpenAI’s newest $29B valuation is off of less than <$50M in revenue (though I was unable to get their P&L to confirm this, so don’t cite me—I just like feeding the AI gossip machine). However, there is one really, really weird anomaly with AI valuations. The only pure-play, wholly AI-focused, B2B software company, which is run by an experienced management team, is down 83% over the last two years. From its all-time high of $161 a share, it’s currently trading around $23.10. I’m talking about c3.ai, which describes itself as an “enterprise AI” company. This company is a case study for why investing in AI will be harder than people think."
