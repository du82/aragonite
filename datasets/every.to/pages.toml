["https://every.to/chain-of-thought/ai-assisted-decision-making"]
title = "AI-assisted Decision-making"
description = "How to use ChatGPT to master the best of what other people have figured out"
full_description = "Georgia Patrick over 1 year ago Dan.... it would be much better if it was real. Start with a big decision you are struggling with, there at Every. Then show how ChatGPT gets you to a better decision. I don't know The Big Short and what does that have to do with what you are trying to do with your life? You started out great and then this felt like 30,000 feet off topic. ♡ 4 · Reply Dan Shipper over 1 year ago @[email protected] thanks Georgia, i think you're right! great intro, body could've been better. i'll try again with something more personal in a few weeks. i have a lot of examples to pull from :) appreciate you! ♡ 2 · Reply @amitgupta147 over 1 year ago Very enlightening. Please talk about how you think consciousness pans out with ChatGPT dataset scenarios. A double click for chatGPT deciphering an unknown Alec, let's say like me, what are the chances that I will get a good enough response for any of my dilemmas? Is this example over-extending or over-simplifying the use case given that it's Sir. Munger and Blurry. ♡ 0 · Reply @manansharmain68 over 1 year ago An insightful read, you might be onto something. I've recently discovered Farnam Street, and have started to dive into the concept of mental models (which I had been unaware of, sadly so until now). While I'm preparing for an examination, that's due next year (and yes, it's a life and death examination for me (maybe not literally, but it's the most important of my life)), I'm trying to learn much more about mental models, and how I can use them in everyday life to take better decisions, in the little time that I'm left with. My preparation for that exam takes away about 12 hours of my time, so I try to learn stuff which can help me keep my mind sharp, so that I can unwind, and take a breath away from studying exam-centered information. The use of Generative AI for observing how Mental Models might apply in real-life situations, is a fascinating idea. There was a phase, when I was using ChatGPT for analysing different news articles from multiple perspectives, but then I stopped doing so at some point due to: a. Paucity of time, with too much to study, that it looked like, there would be diminishing returns if I spent too much on a particular topic. b. Since the examination that I'm preparing for requires me to develop critical thinking, I was apprehensive that using Generative AI to link the information consumed to other disciplines, or for analysis would hinder me from developing critical thinking skills. Maybe, I'm wrong in choosing self-relying too much, and maybe I can use it occasionally to make better decisions, without having to take the longer and more arduous route of learning things the hard way...I guess I'll chose a synthetic approach from now on. Thanks, it was an enjoyable read. ♡ 0 · Reply"
