title = "Reverse-engineer Your Creativity With AI"
description = "Know when to copy—and when to go against the grain"
full_description = "Michael Taylor is a freelance prompt engineer. He explores how to manage AI tools like humans in his monthly column, Also True for Humans. Taste—the ability to know and articulate what you like and why—is going to be at a premium in the allocation economy. Conveniently, it turns out that AI is incredible at helping humans understand our taste. I’ve been using it for a long time to help me define and refine the kind of writing I like, and it’s had a major impact on my own skill level. In this piece (the second in our series about memetic analysis), prompt engineer Michael Taylor uses “inductive coding” as a unique and even more powerful way to use AI to understand your taste—and make more great creative work. I’m proud to publish it.—Dan Shipper This isn’t a mistake. Sameness is a powerful thing. Customers learn to look out for visual cues, which signal whether they’re in the right place or not. There isn’t a global conspiracy to make all coffee shops look alike. It’s just that the internet has connected our world in a way that social media algorithms propel winning combinations to the whole world, flattening our culture, as Kyle Chayka writes in his book Filterworld. Ignore convention at your peril. Tapping into design cues, if implemented correctly, can remove some of the risk and uncertainty that comes with starting a new business. The key is to know when to be similar and when to be different. That matters because, according to the U.S. Bureau of Labor Statistics, 90 percent of startups fail, a data point that has remained consistent since the 1990s. But entrepreneurs who have started a successful business in the past are three times more likely to succeed the second time around. Experiencing success seems to lead to more success. As we established in part one of this series, artificial intelligence can help entrepreneurs compensate for a lack of experience by helping summarize and analyze the lessons from others’ success. It can find the sameness so you can exploit it."
