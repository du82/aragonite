title = "How to Become an Expert at Anything With AI"
description = "Using ChatGPT and Claude for memetic analysis"
full_description = "Michael Taylor is a freelance prompt engineer. He explores how to manage AI tools like humans in his monthly column, Also True for Humans. This week we’re bringing you some of our best writing on practical applications of AI by Michael Taylor, whose new column, Also True for Humans, examines how we manage AI tools like we would human coworkers. (He’s also the co-author of a new book, Prompt Engineering for Generative AI.) Up today is this tactical piece about how AI is helping us redefine expertise.—Kate Lee Beginners come at problems from a very different place. They have to. Without the benefit of experience, they can’t rely on intuition, and must make decisions slowly and deliberately in order to arrive at the correct one. The Dreyfus model for skill development says that the first step to go from novice to expert is to identify and apply many recipes or templates for accomplishing a task. Eventually, through research and analysis, they can build intuition about what recipe will help solve a problem, and how to improvise or combine recipes to create their own. They can develop expertise. But that takes time—or at least it used to before AI. ChatGPT’s ability to help you summarize and analyze is like a superpower to beginners, who haven’t had time to build expertise in an area. I’ll help you learn how to use this superpower, from figuring out what people care about when you’re pitching them to finding best-selling titles for your article or book."
