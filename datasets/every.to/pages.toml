["https://every.to/podcast/how-to-make-a-movie-with-chatgpt-midjourney-and-runway"]
title = "Inside the Pod: How to Make a Movie with ChatGPT, Midjourney, and Runway"
description = "Dave Clark used AI tools to break into Hollywood"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Thank you to everyone who is watching or listening to my podcast, How Do You Use ChatGPT? If you want to see a collection of all of the prompts and responses in one place, Every contributor Rhea Purohit is breaking them down for you to replicate. Let us know in the comments if you find these guides useful. —Dan Shipper But AI is dramatically altering the cost of filmmaking. And AI tools have become a flywheel, broadening our ability to bring our own ideas to life. Film and commercial director Dave Clark broke into Hollywood earlier this year with the sci-fi short film Borrowing Time, which he made on his own on his laptop, with AI tools like Midjourney, the text-to-video model Runway, and the generative voice platform ElevenLabs. Clark talks about how he managed this in a recent episode of How Do You Use ChatGPT?, where he makes a movie live on the show with Dan Shipper. He goes as far as to say that he couldn’t have made the three-minute-long feature without AI—it would have been expensive, and Hollywood would never have funded it. But after his short went viral on X, major production houses approached him with offers to make it a full-length movie. Clark had his proof of concept. In this interview, Dan and Dave delve into the realm of AI tools that generate images and videos, exploring how budding filmmakers can leverage them to come up with ideas, test these concepts, and perhaps even gain enough traction to secure funding. I’m not aspiring to break into Hollywood—but I came away from this episode amazed at what AI is capable of, and inspired to use it to put my words into action. Read on to see how Dan and Dave use AI tools to make a short film featuring Nicolas Cage using a haunted roulette ball to resurrect his dead movie career. They use a custom GPT that Clark has trained on his own creative style. The GPT—called BlasianGPT to represent Clark’s Black and Asian heritage—is a text-to-image generator."
