["https://every.to/chain-of-thought/the-most-important-wwdc-announcement-that-you-missed"]
title = "The Most Important WWDC Announcement That You Missed"
description = "Apple has a shot at solving the mental health crisis"
full_description = "Oshyan Greene over 1 year ago Oh they absolutely could! But almost certainly won't, given their history on this kind of thing. (IMO) 😕 ♡ 0 · Reply @yodkndakj over 1 year ago @Oshyan exactly. this article was too overwhelmingly not critical enough ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Want to reach AI early-adopters? Every is the premier place for 80,000+ founders, operators, and investors to read about business, AI, and personal development. We're currently accepting sponsors for Q3! If you're interested in reaching our audience, learn more: Let’s say you’re the biggest and most successful company in the world. You need to keep growing at an incredible rate—and you’d also like to have a positive impact on mankind. What kind of opportunities do you go after? Well, for one you probably build a face computer. But you might also try to solve the mental health crisis in America. And I think that’s what Apple’s attempting. In 2022, 19% of adults—about 50 million Americans—experienced a mental illness like anxiety or depression. Anxiety and depression alone cost the economy an estimated $1 trillion every year. That is a huge problem and a huge economic opportunity. On a human level, mental health issues are also a real bitch to deal with. I’m a relatively well-off individual with a fake job and an open mind. It still took me many years—literally years of work—to get an accurate diagnosis and to get into the right treatment. And I was really trying my hardest! I was reading books, using apps, trying therapists, testing meds, and spending more money than I care to count. If therapy wasn’t a totally private HIPAA-regulated institution I’m pretty sure my clinicians would be building statues to commemorate my largesse. (If any of my former doctors want to do this hmu.) I think Apple is going after mental health in a big way. What they announced this week at the WWDC—a mood tracker, a mental health trend report, and psychological assessments you can take from your phone—is both a masterful business move and has a real shot at eventually solving the mental health crisis in America."
