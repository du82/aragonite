["https://every.to/p/introducing-cross-functional-and-friendly"]
title = "Introducing: Cross-Functional and Friendly"
description = "A podcast exploring cross-functional collaboration"
full_description = "Stella Garber is the co-founder and CEO of Hoop. Previously, she led marketing at Trello, building the team as its initial marketing hire to Atlassian's acquisition and beyond. Dan here. I 'm excited to announce that we're introducing a new podcast at Every: Cross-Functional and Friendly—a show where three seasoned startup veterans from sales, marketing, and product backgrounds discuss how to work together across functions to solve problems as your startup scales. It's an issue that's close to my heart as Every gets larger, and I think Cross-Functional and Friendly can be an essential guidebook for leaders looking to manage that process well. New episodes come out every Tuesday. If you're curious to learn more, read on for a description straight from your hosts: Kristen Habacht, Nikita Miller, and Stella Garber. One of the hardest parts to get right in any company is cross-functional collaboration. Marketing, sales, product… sometimes it feels like every team is speaking a different language. Leads, MQLs, OKRs—there’s no shortage of acronyms to learn, either. When different parts of a company don’t work well together, it can mean chaos and destruction (especially within a startup!). On the other hand, when these different teams do sync up, things move quickly and lasting friendships are formed. (Trust us, we know 🙂.) Essentially, what it all comes down to is the relationship between cross-functional leaders and their teams. This is where we come in. Kristen, Nikita, and I (Stella) led sales, product, and marketing , respectively, at Trello before it was acquired by Atlassian. Over the years, we’ve built a shared vocabulary that helped our teams work toward one cohesive goal. Cross-Functional and Friendly is a podcast where we talk about everything we’ve learned over years of working together across different parts of a growing company. The goal is to help you have more meaningful interactions with your cross-functional peers. (It also happens to be a great excuse for us to spend more time together again!)"
