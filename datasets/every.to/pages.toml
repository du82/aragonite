full_description = '''These challenges provide a 30-minute bite-sized lesson straight to your inbox every day. It’s free, fun, and effective. Starting July 1, 2024, you’ll gain practical knowledge and hands-on experience. Don't miss this opportunity to enhance your skills and stay ahead in the tech world. Sign up now! Hello, and happy Sunday! ICYMI, we released a new tool called Spiral, an AI prompt builder that automates repetitive creative work—think writing headlines and summaries, social media posts, client proposals, and the like. More than 2,000 users have already signed up, and Dan Shipper will explain how we built it in an upcoming piece. More details on how to use it and how you can access it are just below the jump. Let us know how you’re using it in the comments. On to everything we published this week (hint: Evan Armstrong broke some news), along with our take on the latest tech and business news.—Kate Lee "Introducing Spiral" by Dan Shipper: We hate to break it to you, but a lot of your job is repetitive drudgery. It's the stuff you have to do to get your real work seen: turning an analysis into a slide, a podcast into a description, or a presentation into a client email. But what if you could automate 80 percent of that work? Meet Spiral, a powerful prompt builder we made that helps creators repurpose their content for different channels and attention spans in their unique style and voice. 🔏 Available now for paid Every subscribers, along with our AI writing app, Lex. "Be Sincere—Not Serious" by Michael Ashcroft/Expanding Awareness: Life is better when you don't take it too seriously. Approaching challenges with a sense of play and levity can help you navigate them more effectively than getting tense and worked up. Read this if you want to learn how to find more joy in your work and relationships by being sincere rather than serious. 🎧 "She Built an AI Product Manager Bringing in Six Figures—As A Side Hustle" by Dan Shipper/’AI & I’: While working a demanding job as a chief product officer, Claire Vo built ChatPRD, an AI assistant that helps startups craft product strategies. It's now pulling in six figures in revenue. In this episode of AI & I, Claire shares how she used AI to build ChatPRD in record time, her predictions for the future of product management, and the creative ways she's using AI tools in her work and personal life. 🔏 Paid subscribers have access to the episode transcript.'''
