["https://every.to/chain-of-thought/gpt-5-is-coming-reading-between-the-lines-at-microsoft-build"]
title = "GPT-5 Is Coming: Reading Between the Lines at Microsoft Build"
description = "News and notes from the AI-everything developer conference"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Ready to embrace a new era of task delegation? HubSpot’s highly anticipated AI Task Delegation Playbook is your key to supercharging your productivity and saving precious time. Learn how to integrate AI technology into your processes, allowing you to optimize resource allocation and maximize output with precision and ease. Learning to interpret my parents as a child comes in handy for me as an adult at tech conferences where the good stuff, the really juicy stuff, is all in the subtext. After spending two days at Microsoft’s developer conference, Build, watching CEO Satya Nadella, CTO Kevin Scott, and surprise guest Sam Altman speak, the most important thing that wasn’t said but was strongly hinted at was this: How did I hear them say this without saying it? Every major presentation at Build, executives talked extensively about scaling laws. Scaling laws created the AI wave. About five years ago, OpenAI realized that if you increase the amount of compute and data that you run through a model, you can predictably increase its level of intelligence. The company has harnessed this core insight to take it from the first GPT model all the way through to its GPT-4o announcement last week. The big question for OpenAI—and everyone else—is how long these laws will hold. Will we hit an asymptote or a point of diminishing returns? In order to create the next model, will we need a galactic Death Star-level of compute that humanity can’t yet assemble? Will we run out of usable data? If so, when? This question is even more critical because competitors are starting to catch up. Google and Anthropic have both released GPT-4 class models in the last few months, fueling suspicion that scaling laws are starting to taper off. Maybe, theories say, OpenAI hasn’t released a new frontier model because it can’t. Unlock the potential of AI to automate your workflow. HubSpot’s AI Task Delegation Playbook offers step-by-step guidance to enhance productivity. Learn to delegate tasks efficiently, freeing up time for what truly matters. Optimize your resource allocation effortlessly and see tangible results. Start your journey towards a smarter, more efficient future today."
