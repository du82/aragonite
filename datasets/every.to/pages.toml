["https://every.to/chain-of-thought/why-generalists-own-the-future"]
title = "Why Generalists Own the Future"
description = "In the age of AI, it’s better to know a little about a lot than a lot about a little"
full_description = '''Veith Schörgenhummer 6 months ago "A jack of all trades is a master of none, but oftentimes is better than a master of one." The second part is often forgotten or unknown. The book "The Neo-Generalist" revises the _of none_ part: _None_ doesnt mean zero, it means not 100% depth. Imho a jack of all trades (@85+% in several disciplines) will always manage better in complex situations. Its just a pity that most education systems still produce workforce for the 19th century factory. Long term versatility will beat depth, because most fundamental problems man produces come from a lacking holistic approach and adaptability. I totally agree with your conclusion. ♡ 1 · Reply @richoheg 6 months ago Totally agree. I also think that having a specialist area (one you've dived deep into in the past) helps you know what questions to ask about the new thing you want to learn about. To be able to do both might be where the super power is at. ♡ 1 · Reply Kate Lee 6 months ago @richoheg Hi, this is Kate Lee, Every's EIC. We'd like to include your feedback in an upcoming edition of our Sunday newsletter. Would you let me know your job function? Feel free to respond here or email me at [email protected]. Thank you! ♡ 0 · Reply Aly G 6 months ago **"It's the one who knows which questions to ask in the first place."** I've found that the questions we ask often come from our domain experience and curiosity. As Kitto implied, there's "a respect for the wholeness or the oneness of life, and a consequent dislike of specialization." What's true for economies is also true for nature. When environmental changes occur, generalists survive while highly specialized species struggle to adapt. And why should they adapt? They've developed features, diets, and hunting methods specifically designed to thrive in stable, unchanging environments—tools honed over a great length of time in non-hostile conditions. But when change happens—a change that levels the playing field—it becomes about who can utilize it to thrive and who cannot. By tapping into our understanding of areas we're familiar with and drawing from diverse experiences, we're able to explore more effectively and solve problems outside our usual domains—things that were once not possible. AI is a force multiplier. Applied correctly, it yields significant results. But it's also a threat. Because it creates a division between those who can use it and those who cannot. Consider leveraging AI at the very beginning of your problem-solving process. Even if you don't know the answers to questions outside your fields of expertise, AI can multiply our efforts and help us ask the right questions. Turning you specialist domain expertise into general domain competence. ♡ 0 · Reply'''
