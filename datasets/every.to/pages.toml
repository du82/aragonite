["https://every.to/working-overtime/i-hired-chatgpt-as-my-career-coach"]
title = "I Hired ChatGPT as My Career Coach"
description = "AI changed how I think about work—and myself"
full_description = "Cale Reid 4 months ago Would encourage you to check out Kin (https://mykin.ai/) - it's designed explicitly for this purpose and can do some things like send reminders that native ChatGPT cannot. ♡ 0 · Reply Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. When Katie Parrott lost her job, she turned to an unlikely source for career guidance: ChatGPT. In this piece, Katie details her experiment using AI as a career coach, exploring its strengths and limitations in providing originality, accountability, structure, empathy, and clarity. Her journey reveals both the potential and pitfalls of AI in personal development, underscoring that while AI can be a powerful tool for self-reflection, the real work of career growth remains deeply human.—Kate Lee A few weeks ago, my therapist floated the idea that I should hire a career coach. It would have been a great idea—if I hadn’t just lost my job. I’m certainly the type who could benefit from a career coach. My relationship with work has always been fraught, and I am at a particularly murky spot in my career. In the past 10 years, I’ve worn a lot of hats: I’ve worked at companies, agencies, and as a freelancer. I’ve worked in software, healthcare, and venture capital. I’ve been an individual contributor and a people manager. And yet, I feel no closer to knowing “what I want to do with my life” than I did when I graduated from college. So yes, I wanted help. But while I’m lucky enough to have “runway,” as startups say, that doesn’t mean I have $100–$150 per hour to spend on a career coach. I figured if I couldn’t retain the services of a human career coach, why not try AI? I consider myself an AI skeptic, but even I am often astonished by what large language models can do. I’ve read Dan Shipper’s essays in Chain of Thought; I’ve seen how you can use AI for deeper thinking. If ChatGPT really is a copilot for the mind, as I’ve been promised, shouldn’t it be able to help me navigate the big, messy question of what I am doing with my life?"
