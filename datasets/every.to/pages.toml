["https://every.to/p/don-t-be-scared-to-take-on-a-monopoly"]
title = "Don’t Be Scared to Take on a Monopoly"
description = "Fenced-off markets can offer the most opportunity"
full_description = "Nir Zicherman is the cofounder and CEO of Oboe. Previously, he cofounded of Anchor and was the vice president of audiobooks at Spotify. With the Destiny Tech100 (DXYZ), you'll be able to invest in top private companies like OpenAI and SpaceX from the convenience of your brokerage account. I first met Nir Zicherman nearly seven years ago when he was the cofounder and CTO of Anchor, which enabled anyone to record and publish a podcast. The startup, which numbered fewer than 10 people, was entering a market that was dominated by incumbents and had seen little innovation. In 2019, when Anchor was acquired by Spotify, Nir went from disruptive outsider to working within the belly of the beast—where he again challenged the incumbent audio players, Apple and Audible. So he’s the perfect person to write about why startups should take on monopolies. We’re delighted to have the opportunity to co-publish his latest piece. —Kate Lee In the early stages of a company’s lifecycle, when its leaders reach forks in the road of strategy, they often consider their options in the context of competition. Do they want to do what competitors are doing or something different? Do they want to be a big fish in a small pond or a small fish in a big pond? Should they attempt what others have tried and failed at, or should they take the innovative approach? Off to the side, there is another path, overgrown with weeds and shrubbery, never taken. We rarely notice it as a viable strategic option. That’s because it’s blocked off with a colossal sign that reads: Private Property. No Trespassing. Behind this sign are industries dominated by monopolies or oligopolies. Ask founders where they believe the most opportunity lies, and virtually none will tell you that it’s behind the No Trespassing sign. Yet in my experience, those fenced-off markets are often exactly where there’s the most to gain. In 2015, when I founded podcast hosting company Anchor with Mike Mignano, nearly all podcast hosting was controlled by entrenched incumbents, all of which charged creators for hosting, distribution, and analytics, and which had done little to innovate since entering the market over a decade before. Within a few years, we’d overtaken all of them, not only in terms of market share, but also in terms of contribution to growth of the overall podcast market."
