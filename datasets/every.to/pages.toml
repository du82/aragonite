["https://every.to/learning-curve/get-a-reality-check-on-ai"]
title = "AI Isn't Your God—But It Might Be Your Intern"
description = "Make the most of AI by lowering your expectations"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. We've been told that AI will either save or destroy humanity…yet here we are watching LLMs hallucinate, image generators struggle to draw realistic human hands, and AI coding agents get stuck in loops without supervision. This gap—the one between the promise of AI and the present reality—isn’t about AI progress slowing down. It’s a product of how we’re fundamentally misunderstanding the technology. We’ve cast AI in the role of a God-like entity, when we should be thinking of it more like an intern: an intern who is linguistically capable, sometimes makes decisions in ways we don’t quite understand, and perhaps most importantly—if we put in the time to work with them—has the potential to surprise us. When Ingenuity, NASA’s autonomous helicopter that operated on Mars from 2021 to 2024, took its last flight, the team behind it recorded a video to bid the craft farewell, with one of them describing it as “a plucky little helicopter that just defied everybody's expectations.” According to the first line on its Wikipedia page, the helicopter even had a nickname, Ginny. Humans have a somewhat irrational tendency to anthropomorphize technology—even the most scientifically oriented of us. AI has lent itself to being portrayed in science fiction as an overlord, benevolent at times and terrifying at others. It has the reputation of being an intangible, all-knowing, mysterious “thing”—a reputation that broadly fits many people’s perception of God, or other similar higher power they have faith in. I think we’ve come to believe this heightened narrative around AI because: These blind spots in our thinking breed irrationally high expectations of AI—and an inevitable feeling of being underwhelmed by it. Understanding them more deeply brings us closer to the truth, so we can set realistic expectations of AI and develop more productive ways of working with the technology."
