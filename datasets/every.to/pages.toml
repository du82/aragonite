["https://every.to/podcast/inside-the-pod-momentum-is-the-key-to-productivity"]
title = "Inside the Pod: Momentum Is the Key to Productivity"
description = "Learn how this programming GPT can boost yours"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Thank you to everyone who is watching or listening to my podcast, AI & I. If you want to see a collection of all of the prompts and responses in one place, Every contributor Rhea Purohit is breaking them down for you to replicate. Let us know what else you’d like to see in these guides.—Dan Shipper And then you end up replying to the email, drafting three more that you’ve been putting off, and getting a headstart on prep for that meeting you have tomorrow. Not before long you’re staring at your screen bleary-eyed, wondering how you got sucked into working until midnight. To be clear, working late into the wee hours of the morning is not advisable. But that doesn’t take away from the fact that momentum is a powerful thing. If you can get the proverbial ball rolling, the odds are you can keep it rolling. Momentum is the driving force behind Grimoire, the top-ranked custom GPT for programming created by Nick Dobos. Once you log onto Grimoire, you are presented with a selection of projects you can get started on right away, like a tool to create a link-in-bio website. And once you start working on a project in Grimoire, Dobos keeps the momentum going in two ways: one, by getting the GPT to provide a step-by-step outline of what is needed to complete your project; and two, programming it to recognize “hotkeys” or specific letters on the keyboard that, when pressed, trigger the GPT to execute a pre-programmed function. Dobos has designed Grimoire to propel users forward. If that weren’t enough, Grimoire boasts a whimsical fantasy theme. The coding assistant is peppered with references to magical creatures, transforming the experience into something akin to attending a class at Hogwarts. In this episode of AI & I, Dan Shipper interviewed Dobos to talk to him about Grimoire, his insights from building one of the most popular programming custom GPTs, and how AI is catalyzing the rise of a new paradigm in coding."
