["https://every.to/legal"]
title = "Terms & Privacy - Every"
description = "A daily newsletter on what comes next in tech. 75K+ readers."
full_description = '''The team at Every asked me if I could also write a "plain English" summary of those terms to help everyone understand them. This actually sounded kind of fun to me, as it's not something I'm typically asked to do, and I used to want to be a "real" writer once upon a time. So you'll see my summaries of each of these policies below, but I'll make a disclaimer here (a very lawyerly thing to do by the way): you should actually read the full versions of both of these policies (also below). Hopefully my summaries make the policies a bit easier to digest, but whenever someone asks you to agree to a bunch of legal-sounding terms, I think you should actually at least try to read them, because it's the legalese that's binding, not the cute summaries. Although I will tell you that what you're agreeing to here with Every is probably not that big a deal compared to some of the comparatively insane things you likely agree to without batting an eye whenever you download an app, set up automatic payments, or buy a new smart device. What I'm saying is, you're probably signing away rights to your first-born child and immortal soul (mostly kidding!) a few times a week—shouldn't you at least pay attention to the terms of those deals? (Do you realize how much time lawyers spend writing these things?!) And then maybe you can prioritize companies and services that aren't reserving the right to exploit your data like a cash-filled piñata. Without further ado and commentary from me (especially since Dan and Nathan are paying me by the hour), here are my "plain English" summaries of Every's Terms of Service and Privacy Policy: Much of the Terms of Service is like the Ten Commandments: You're being told "thou shalt" and "thou shalt not" do a bunch of stuff. Thou shalt not misuse Every (like scraping the content of our articles). Thou shalt keep your account secure. Thou shalt pay Every any amounts of money you agree to pay us. You get the idea. Then, honestly, the rest of the Terms of Service is really meant to protect Every. Sorry, but that's really what these kinds of website policies do: They create rules for website users, they create consequences if the users break those rules, and then they say, whatever happens, the business running the website has certain legal protections and rights that it can fall back on. So what are those rights and protections? Some highlights: Every is not making any warranties (fancy legal promises) to you. You're releasing Every from certain claims you might have, and agreeing that Every won't be liable to you in certain circumstances. You're indemnifying Every (basically agreeing to pay costs) if you breach the Terms of Service or misuse Every and Every ends up getting sued or gets hit with other costs. And if you decide to sue Every (please don't!), you're agreeing to individual arbitration instead of a jury trial or a class action. Fun stuff, right?'''
