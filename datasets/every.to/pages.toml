full_description = "Colm Byrne about 1 year ago This is a product manager the skills that product managers excel in – like crafting a vision, evaluating talent, and understanding when to delve into the details – become increasingly valuable. ♡ 6 · Reply @raokrishna1 about 1 year ago Interesting analysis Dan. I do agree that even people in junior positions will have to develop manager skills fairly soon on their career path. But I see this as an enhancement of the Knowledge Economy. Effective managers have a good understanding of the work even if they aren't the ones doing the execution. Like you mentioned, vision and taste are key things a manager brings to the table. And these abilities are the result of knowledge acquired through consumption and experience. Further, I feel you can read a summary of a book or a report using AI, yes. But it is the unrelated anecdotes, the random footnotes, that often spark connections and insight that moves your skills and abilities forward. AI helps us do focused and directed work much better. But intuition and inspiration can often strike when you read something unrelated but make a connection to what you're working on. I think Steven Johnson has expanded on this in his book, 'Where Good Ideas Come From.' So far (some) knowledge workers could get by without being decent managers. But the advent of AI will mean that those who have knowledge+manager skills are likely to thrive compared to those who just have knowledge. ♡ 3 · Reply Craig Gordon about 1 year ago th problem with this is where o we get the breakthrough thinking and new ideas ? Many many years ago I read the The Structure or Scientific revolutions by Thomas Kuhn. Highly recommend it which says major scientific breakthroughs come outside of exist structures as the threaten them but slowly capture the stars quo as best. How dies this happen with AI and innovative breakthrough not in the establishment. Does AI and managers slow this process or help? Big questions a why the development of AI can't be put in just the hans of Computer science people and tech startups and companies. You referenced at the beginning of the article our reality concept of time really has just changed. ... manager or AI aggregator that summarizes will never get this to you unit we figure out how AI processes and delivers unique material true stuff. And we don't have that yet One more thought ....anone watch Jimmy Johnson halftime speech in how to get the Cowboys back in the game? There is a leader not a manager emotionally involved and wanting other to do the same. How's that figure in to the allocation economy which by it's name seems to be lacking of leadership ♡ 1 · Reply"
