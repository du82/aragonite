full_description = '''@jamesheaton14 over 1 year ago It is always those with money who are the first to tell you that money does not bring you happiness. My friend, if I had enough money to pay bills and a job that was anything less than meaningless, I assure you I would be happier. As it is, I am one of many stuck in a horrendous daily grind which I can assure you will only lead to greater and greater self-destruction, and possibly even fatality. ♡ 2 · Reply Brad Z. over 1 year ago I'm 54 and married with 2 children- 9 & 11. This piece by Evan does not just ring true, it's still very relevant. ♡ 1 · Reply @speakerkev over 1 year ago Excellent article! My life completely changed in 2013 when I discovered Headspace and started a daily mindfulness practice. There is a richness the the present moment that can’t be found in the illusions or fantasies of the future. Great article, thank you! ♡ 1 · Reply Evan Armstrong over 1 year ago @speakerkev Do you still stick with it—I had a 90 day streak but haven't picked it up since ♡ 0 · Reply Jason Morrison over 1 year ago Maybe it was the brisk cold air this morning, or the latte I made before reading this, or the timing of this piece relative to where I am on my own personal journey, but regardless of why, this just hit different. Thank you for the thoughtful piece and the honest conclusion. It’s exactly what I needed to read this morning. ♡ 1 · Reply Evan Armstrong over 1 year ago @jpmorrison1 What a beautifully written reply! Appreciate it Jason—glad it landed for you. ♡ 0 · Reply @every_3074 over 1 year ago The article was gripping for me. I hope you and we all get more of the moments that matter ♡ 0 · Reply @samanthabedford over 1 year ago Lovely article and so much relates to being present. I have found that embedding mindfulness into my life has been transformational. Bad things will always happen but we don't need to make them feel worse if we can learn to train our minds. Be well. ♡ 0 · Reply Brad Z. over 1 year ago Brilliant -- "Art comes from self-delusion. If you don’t believe, then how can you convince others?" ♡ 0 · Reply'''
