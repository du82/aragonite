["https://every.to/on-every/welcome-to-q2-2024"]
title = "Welcome to Q2 2024"
description = "Also: Our best writing on AI"
full_description = "We turn your vision into captivating, high-performing animated videos that not only tell the story of your product but do so in a uniquely engaging way. As creatives and strategists, we are here to help amplify your message, so you can focus on what you do best: growing your business. Writers mostly react. Something happens in the world, and we scramble to tell you what it is and why it matters. But the best writers—the ones we admire—don’t go after the hottest story. Instead, they give themselves space. They let the buzz of the world die down and stop chasing trends. They think new thoughts. They ask new questions. And then they set out boldly to pursue them. That’s what we did this week—our first Think Week as a company. Instead of publishing new pieces, we gave ourselves the space to ask: What are the most important questions in the world right now? What truly matters? Not just for today—but for the next 10 years? What makes us genuinely curious and excited? We promise to pursue these questions for you this quarter. We’ll also keep reacting—to new AI models, tech IPOs, and whatever’s happening in memecoins. But we’ve set these questions as our North Star so we can focus on what’s important for you, and for ourselves. We’ll cover them in Dan’s column Chain of Thought, Evan’s (now twice-weekly!) column Napkin Math, guest pieces from tech practitioners, our podcast, a reimagined Sunday Digest, and more. In the meantime, read on for some of our best pieces about AI from the past year and a half.—Dan Shipper “What I Do When I Can’t Sleep” by Dan Shipper/Chain of Thought: It’s tempting to think about ChatGPT as just a productivity tool for writing faster emails, or something equally corporate and trite. Dan has discovered a deeper, more meaningful usage—self-discovery. Using LLMs allows you to analyze and scale your taste. Read this to learn how you can do the same. “The Knowledge Economy Is Over. Welcome to the Allocation Economy” by Dan Shipper/Chain of Thought: To get promoted in yesteryear, you had to get really good at applying and creating knowledge. Now that AI systems can do that for you, it shifts the focus of a career from accumulation to allocation—a totally different skill set. Read this to learn how this change will happen and what you can do to be prepared."
