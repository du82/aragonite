["https://every.to/chain-of-thought/openai-s-o1-model-explained"]
title = "OpenAI’s o1 Model, Explained"
description = "Chain of thought opens a new paradigm in AI progress"
full_description = "@jtowers349 6 months ago Appreciated the timeliness and the 1500 / 1700 /1900 thought experiment ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. It’s been taught to use chain of thought reasoning to answer each question it’s given rather than just blurting out a response. Chain of thought, of course, has been around for a long time. It’s the practice of asking a language model to solve problems by thinking out loud. You’re probably better at doing long division if you write out the steps one by one than you are at doing it in your head. Language models are the same way: Chain of thought creates a tunnel of reason that keeps the AI on track. Chain of thought used to be just a prompting technique that would improve outputs in the original GPT models. o1 is different because it’s been trained via reinforcement learning to always use chain of thought in its responses without any extra prompting required. Now, when you ask ChatGPT with o1 enabled a question, up pops an expandable thinking indicator that lets you see its thought process: Well, I’m glad I named this column Chain of Thought because it turns out Chain of Thought is probably the next big paradigm in AI progress. (Better to be lucky and partial to polysemy than good, as the saying goes.) As I mentioned in my article on Strawberry, the key ingredients for AI progress so far has been: more data and more compute during training. The interesting update from Strawberry is that OpenAI has found a way to add a new dimension on which to improve performance: compute during inference. The company has found that when Strawberry takes longer to respond to a prompt—in other words, when it’s given more time to think—it generally responds more accurately. This wasn’t necessarily the case with previous models. The longer GPT-4 was left to run in an autonomous loop, the more likely it was to go off the rails or get stuck in a meaningless rabbit hole. Because o1 has been trained to perform better on chain of thought reasoning, it seems to be able to better stay on track."
