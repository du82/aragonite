["https://every.to/superorganizers/the-ceo-with-an-empty-calendar-837826"]
title = "The CEO with an Empty Calendar"
description = "How the founder of Doist manages a team of 80 without meetings"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. His calendar is almost completely empty. There are meetings, yes, but they’re drifting like planets in outer space. They dot the darkened landscape but with unimaginably vast distances between them. “This is a pretty busy week of meetings actually because our CTO is on paternity leave. I’m doing a lot of his final reviews of engineering hires. So this is actually more meetings than usual.” I’m incredulous. I’m curious. Frankly, I am almost offended. He’s the CEO of an 80 person company and this — THIS — is his daily calendar? He’s got fewer meetings than Robinson Crusoe. Amir Salihefendić is the founder of Doist. They make the popular todo app Todoist and the workplace communication platform Twist. He started Doist as a side project in 2007 and today he manages a fully remote team of 80 working across his two products. I’m glad I talked to Amir for this interview, because he spoke directly to something I struggle with every day. As Nathan and I build out the Everything bundle, we’ve had to figure out how to balance creating an organization with doing our best creative work. Sometimes it feels like that’s impossible. Creative work means being all alone in your room. Creating organizations means being in every room, all at once. It’s hard. But after talking to Amir I realized that in the age of remote work, it’s actually possible. You can be alone in your room, and also in every room at the same time as long as you set things up properly. It takes some sacrifices, but if creative work is important to you it’s doable. In this interview we look at how Amir uses Todoist to keep himself organized, how his company uses remote work and asynchronous communication to get more creative work done, and — yes — how he’s set things up so that he can manage a growing team of 80 with almost no meetings. I’m the CEO of Doist. We’re the makers of the popular todo app Todoist and the workplace communication platform Twist. Doist is completely bootstrapped — I started it as a side project in 2007. I never thought it would become a company, but we’re up to about 80 employees now. We are a fully remote team and have been since the beginning."
