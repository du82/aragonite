full_description = "Cody DeBos 4 months ago I really appreciate this perspective! It's one that I strongly agree with. Hearing people shouting about AI taking over everything is quite frustrating and your comparison of AI to strength and the Industrial Revolution is one I intend to carry forward. ♡ 1 · Reply Scott Taylor 4 months ago Nice piece Dan, and thanks for highlighting the pg essay — somehow I missed it. I pretty much agree with everything you've said, and your framing resonates. My main concern is striking the right balance: how do I keep LLMs as a sharpening tool for my writing, rather than letting them take over the heavy lifting? I want AI to challenge and refine my skills, not to become a crutch that does the actual writing for me. I also want to maintain my 'voice', and I want it to grow and evolve over time. Again, something that will most certainly go out the window if I let the AI take over. ♡ 1 · Reply Dan Shipper 4 months ago @s_8463 thanks scott glad it resonates! I don’t have a specific answer but I suspect pride of craft has something to do with it. Great creative work is about relentlessly imbuing your taste into every aspect of your work…by definition that requires your engagement and voice (even if the AI is doing some of it at your direction) ♡ 0 · Reply"
