["https://every.to/napkin-math/microsoft-s-boring-but-profitable-future"]
title = "Microsoft’s Boring but Profitable Future"
description = "The PC giant is making Windows exciting again"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. In the 1990s, Microsoft became a personal computer giant by using someone else's technology to make its Windows operating system and forming a partnership with cutting-edge chipmaker Intel to power its computers. In the 2020s, Microsoft is getting even bigger by using the transformers invented by Google and forming a partnership with OpenAI for its large language models. While OpenAI had the Scarlett Johansson Her voice (oops!) and Google had a man in a bathrobe running around the stage at their events, Microsoft’s presentation (which Dan attended) was fairly drab, consisting of software executives droning through PowerPoint slides. But don’t let this flatness fool you. Microsoft has the scale and power to make AI a reality for the 1.4 billion personal computers running Windows (whether their customers want it or not)."
