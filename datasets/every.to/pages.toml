["https://every.to/p/f9294f13-40a8-456f-af4c-8d780b20bab8"]
title = "The Business (and Social Good) of Destroying Old Air Conditioners"
description = "How one entrepreneur went from San Francisco to Indonesia to help cool the planet"
full_description = "Sometimes life takes you to unexpected places, and you don’t know that next job, that next trip, that next move until it stares you in the face. That’s the story of Louis Potok, a data scientist who built a company that aims to prevent more emissions than Russia produces annually, simply by properly disposing of air conditioner fluid. It’s also the story of Jamie Wong, an early Figma engineer who was Potok’s angel investor, and the author of this piece, the second and final part in a series. (Read part one.) Potok followed a how-to book’s first suggestion of addressing the global refrigerant crisis fully down the rabbit hole, which took him around the world to Southeast Asia. This piece is a refreshing look at two people who followed an “unsexy problem” no matter where it led them.—Kate Lee The book, Drawdown, was a guide to the 100 most pressing climate solutions of our time. Potok stopped on the first entry and knew he had found what he was going to do next. Potok was never a prime candidate to devote his life to repairing the environment. He was born in Manhattan, and as a child, spent far more time with books and computers than communing with nature. After finishing an economics degree at the University of Chicago, he joined a nonprofit Harvard University spinout called ideas42, where he was tasked with applying behavioral economics to problems in international development. The job took him to Ghana and Malaysia and the Philippines, chatting with locals to try and ferret out problems with microfinance interventions, like small loans to market vendors. In the course of this work, he began to peruse the literature on its efficacy. He discovered the charity evaluator GiveWell, which became his gateway into the world of effective altruism, a kind of philosophical commitment to ameliorating the world’s problems in ways that will help the greatest number of people in the greatest possible way. Soon he was browsing through online rationalist forums such as LessWrong and looking for career advice on the website 80,000 Hours. His dominant reaction: “I like these people.”"
