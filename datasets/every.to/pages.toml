title = "Inside the Pod: From Idea to Startup in Minutes With AI"
description = "Meet Audos, the ChatGPT-powered incubator for founders"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. This essay is brought to you by Notion, your all-in-one workspace solution. Startups can now enjoy 6 months of Notion Plus with unlimited AI, a value of up to $6,000—for free! Thousands of startups around the world trust Notion for everything from engineering specs to new hire onboarding. Access the limitless power of AI right inside Notion to build and scale your company. When applying, select Every in the drop-down partner list and enter code EveryXNotion at the end of the form. Thank you to everyone who is watching or listening to my podcast, AI & I. If you want to see a collection of all of the prompts and responses in one place, Every contributor Rhea Purohit is breaking them down for you to replicate. Let us know what else you’d like to see in these guides. —Dan Shipper I stared at a blinking cursor, drank a cup of coffee, obsessively played the same song on repeat—but the inspiration would not come. Nicholas Thorne is building a solution to this problem: Audos, an AI chatbot that can take you from startup idea to pitch deck, functional website, custom GPT, and interviews with users in just a few minutes. Thorne is a general partner at incubator Prehype, which has launched successful venture-backed startups like Barkbox and Ro Health. At Prehype, Thorne works closely with entrepreneurs who are starting new companies—and now he’s using AI to scale the process. In this episode of AI & I, Dan Shipper interviewed Thorne about how he built, and now runs, Audos using ChatGPT. Thorne gives an inside look at how Audos uses AI for: I think this conversation will be useful for anyone who has ever toyed with the idea of starting a business, and is interested in how to do it with AI. This piece goes into the details of how Thorne used ChatGPT to build and operate Audos, complete with screenshots. Startups receive 6 months free of Notion Plus with unlimited AI, valued at up to $6,000! Notion is the go-to workspace for thousands of startups worldwide, helping them manage everything from engineering specs to new hire onboarding to fundraising. With Notion Plus, access the limitless power of AI to streamline and scale your operations seamlessly. Simplify your processes and enhance productivity with one powerful tool."
