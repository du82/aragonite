["https://every.to/learning-curve/the-psychology-of-viral-technologies"]
title = "The Psychology of Viral Technologies"
description = "For more AI adoption, more intelligence isn’t the answer"
full_description = "@foolsphilo 4 months ago The technical breakthrough itself does not quickly become popular, but rather the psychological factors triggered by the product that results from the application of technical innovation ♡ 2 · Reply Tyler Corderman 4 months ago Wonderful, thank you for this provoking and thoughtful piece. ♡ 1 · Reply Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. ChatGPT's success caught even its creators off guard. The technology itself wasn't new—it was just packaged differently. In her latest piece for Learning Curve, Rhea Purohit explores how psychological factors, rather than technical capabilities, often drive the adoption of revolutionary technologies. Drawing parallels between ChatGPT's meteoric rise and the original Macintosh's role in popularizing personal computing, she reveals how understanding human psychology might be the key to unlocking AI's true potential.—Kate Lee In purely technical terms, ChatGPT wasn’t a giant leap forward in the state of the art. In fact, it wasn’t new at all. OpenAI’s GPT models had been around since 2018, the original ChatGPT was a fine-tuned version of GPT 3.5, and most of the technology inside it had been available as an API long before its release. Even so, ChatGPT became one of the fastest growing apps on the internet, with an estimated 100 million monthly active users two months after its launch. Jan Leike, who at the time led OpenAI’s alignment team, which worked on making AI systems behave as per user intent, said in an interview after the chatbot’s release, “I would love to understand better what’s driving all of this—what’s driving the virality…It’s not a fundamentally more capable model than what we had previously.” Later in the conversation, Leike answered his own question: “[W]e made it more aligned with what humans want to do with it.” He continued, “It talks to you in dialogue, it’s easily accessible in a chat interface, it tries to be helpful. That’s amazing progress, and I think that’s what people are realizing.”"
