["https://every.to/podcast/how-to-use-chatgpt-to-set-ambitious-goals"]
title = "How to Use ChatGPT to Set Ambitious Goals"
description = "I followed Dr. Gena Gorlin’s prompts and had a breakthrough"
full_description = "Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. I’ve been writing about how ChatGPT has changed how I see myself for about a year and a half. I think it’s the most important, broadly distributed tool for making psychological progress since the journal was invented. Dr. Gena Gorlin agrees. She’s a clinical psychologist who co-teaches a course with me on how to use ChatGPT for psychological growth. Recently she was a guest on my podcast, where we discussed how she uses ChatGPT for goal setting. This is the first piece in a new series in which we share actionable, tactical ways that some of the smartest people in technology are using ChatGPT and other AI tools. Every contributor Rhea Purohit will be breaking down the conversations from my podcast and pulling out the prompts and responses—complete with screenshots. Read on to learn exactly how Gena uses ChatGPT, with specific prompts you can use to set and achieve ambitious goals. —Dan Shipper Even the prospect of sitting to write about my goals is mildly terrifying. I feel self-important and silly. Besides, the few nuggets of valuable insight I have about myself, I’ve stumbled upon in conversations—warm, free-flowing dialogues with people I trust. Exchanges like these prompt candid, honest self-reflection I’ve never found on a blank Google Doc. Instead of staring at a blinking cursor every December, when everyone around me seems to be deep in self-assessment, I just wait for one of these conversations to come along—maybe at a holiday party, a friend’s home, or a family gathering. The process is unstructured, disorganized, and entirely unpredictable. But it works. This year, February rolled around and I was still waiting to have that conversation. But inspired by Dan Shipper’s interview with Dr. Gena Gorlin, I grabbed my laptop, filled up an oversized mug with coffee, and took matters into my own hands."
