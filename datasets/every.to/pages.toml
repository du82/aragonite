title = "The Problem With AI That's Too Human"
description = "Why we need to break out of skeuomorphic patterns of thinking about AI"
full_description = "Georgia Patrick 30 days ago Great insights and human understanding, Rhea. I look forward to your essay on What AI Can Do That Humans Never Could. Never is such a big word and mental challenge for humans who have a spirit that says they Can Do more than they imagine. That will be a great article, when you write it. ♡ 1 · Reply Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. It’s the late 1800s and a brand new horse-drawn carriage just hit America’s dirt roads. Horses are still the most popular mode of transport, so this isn’t out of the ordinary—but the carriage is causing quite the stir. The horse is a bit…strange. It doesn’t whinny, neigh, stomp—or even move—its hooves. This contraption was one of America’s earliest experiments with a car. Its creator, a blacksmith from New York, wanted people to feel comfortable in his strange mechanical contraption—so he stuffed all the nuts, bolts, and gears that make a car work into an artificial horse-shaped frame. The driver could even steer it with reins attached to the “horse’s mouth.” A sketch of the design was published in an upstart magazine, The Horseless Age, and came not long after Thomas Edison was quoted as saying that “the horse is doomed” as a means of transport. We know the rest—Edison was right, and modern car designs have evolved a long way from their equine-imitating ancestor. But the urge to couch early motor vehicles in forms that were familiar to people at the time is an example of a design principle known as skeuomorphism. And it persists to this day in cars: Tesla designs its vehicles with showy front grilles—typically needed to prevent engines from overheating—even though electric cars don't need them. It’s also a big part of how we interact with AI systems. The way we think, talk, and use AI today is modeled on our understanding of humans. That’s natural, and even useful, in the initial stages of adopting a new technology—but you could say we’re living in the “horseless carriage” era of AI. What comes next, the enduring applications of AI, will look different. Let’s call them “AI-native.” These capabilities can only emerge when we stop trying to replicate human intelligence, and start exploring what makes AI unique."
