title = "AI Can Help You Make Big Life Decisions"
description = "Navigating one-way-door decisions with a little prompting"
full_description = "Devon Meadows 7 months ago Loved this. In my notes app Reflect (similar to roam) I have some saved prompts that I keep up to date. One I call the higher self prompt. It's a detailed and updated prompt about how I think, what motivates me, what i strive to be. When i take a long walk and process my thoughts, it gets converted to text in reflect. Then I run my higher self transcription on it popping out a backlinked transcription but also hot takes from my higher self. Reading your post gives me ideas for how I could improve my higher self. I've also been considering posting my higher self on github or something. Somewhere that allows me to get versioning but also public discourse around the frameworks we use to help us self direct. This is the future. I hope to see you all double down on helping people help themselves by giving AI a little blueprint of the self. One thing I don't get is privacy and security in doing these things. Which AI should I feel more comfortable giving basically all my inner thoughts to? Claude, GPT? Is the new meta one somehow more secure? It's open source. That's good. So is that better? Just some ideas for someone like me who's deeply interested in this topic. Great stuff as always Devon ♡ 3 · Reply"
