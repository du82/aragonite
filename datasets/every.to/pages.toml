["https://every.to/napkin-math/the-religion-of-ramp"]
title = "The Religion of Ramp"
description = "How the fintech became one of the fastest-growing startups—ever"
full_description = "Georgia Patrick 3 months ago Your best article, ever, Evan. Well researched and writing that kept me engaged. It's a refreshing story of a company that does well by following those four commandments that guide their business philosophy. The final line resonates with every business and all I want to work with: Maybe you can get there by simply being good at what you do, and not being a jerk about it. ♡ 4 · Reply Today's profile of Ramp marks the launch of our new story format, Extendable Articles: It has a built-in chatbot that lets you interrogate not just the story itself, but all the source material behind it—interviews, videos, articles, and other research—that Evan Armstrong used to inform his perspective, and form your own. Read more about why we built the format from Dan Shipper, and let us know what you think of the idea (and the story!) and how it's working for you. (Extendable Articles are currently only available online, so click over to our website to try it out.)—Kate Lee It is hard to make $7.6 billion divine, but Eric Glyman is working on it. Ramp, the finance software company he co-founded in 2019, has raised $1.9 billion in total financing, a ridiculously large sum. To earn this war chest, Ramp became one of the fastest growing startups ever, hitting $100 million in annualized revenue in less than three years. The company did not accomplish this by spiking the water cooler with Adderall or inventing some sci-fi technology. Instead, Glyman did something different: He started a religion around saving. Ramp offers a suite of financial software—distributing credit cards to employees, paying bills, and managing expense approvals—for companies, all focused on helping them spend less time and money by automating a lot of the work that is usually done manually. For example, rather than users having to submit expense reports via email at the end of each month, Ramp lets them text the receipt as soon as the purchase occurs. The product suite is full of little automations like this—useful, quick actions that add up to saving customers money."
