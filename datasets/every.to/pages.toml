title = "Everything You Need to Know About OpenAI's New Model, o3"
description = "Plus: Join the waitlist for our new email assistant, Cora"
full_description = '''Hello, and happy Sunday! It’s yet another week in which a new best AI model, OpenAI's o3. was released—scroll down to read about it in Alex Duffy's analysis of the company's 12 days of Shipmas. We think everyone is ready for a vacation, and in that spirit, this is our last newsletter of 2024. We can’t wait to bring you more ideas and products in 2025. In the meantime, we're offering one last discount of the year. Subscribe to Every for 33 percent off the price of an annual subscription and get unlimited access to our daily newsletter and software products like Sparkle, Spiral, and Lex, as well as special deals for classes like How to Write With AI with Evan Armstrong and other offerings.—Kate Lee If you prefer to listen to rather than read our stories, we’re now live on ElevenLabs’s ElevenReader app. Download the app and subscribe to our feed to listen to audio versions of our essays voiced by AI. Here’s a preview of Rhea Purohit’s piece about how AI changes the horizon of human effort. “How to Be More Agentic” by Cate Hall: We love highlighting people whose accomplishments motivate us to do more—Cate Hall is one of those role models. She’s daylighted as a Supreme Court advocate, was at one point the top female poker player in the world, and has founded a perfume brand…all within her thirties. How does she do it? By treating agency as a muscle you can build, not a character trait you are born with. Read this to learn how to master your own fate. "Introducing Cora: Manage Your Inbox With AI" by Dan Shipper: Cora is our latest Studio incubation: an AI-powered email assistant to simplify your chaotic inbox into twice-daily briefs. We reduce your email down to the human conversations that matter the most and automate the 90 percent that don’t need your attention. Read this if you’re ready to free yourself from inbox overwhelm. 🔏 Join the waitlist to try it yourself—Every paid subscribers get priority access. “The Future of Work Is About Doing Better—Not Less” by Rhea Purohit/Learning Curve: What do instant cake mixes and AI tools have in common? Simplifying the (creative) work makes your input feel less meaningful. When pre-made cake mixes first hit shelves in the 1950s, housewives felt like reducing their baking efforts to “just adding water” was cheating—the same feeling that keeps creatives away from using AI tools today. Read this if you’ve been feeling guilty about letting AI do your work and are looking for ways to add meaning to your AI-assisted creativity.'''
