["https://every.to/chain-of-thought/admitting-what-is-obvious"]
title = "Admitting What Is Obvious"
description = "I’m a writer—what are you?"
full_description = '''George Levin over 1 year ago Man, this is well-written and very inspiring. It's exactly what many people, including myself, need. Thank you for sharing. As a founder, I place so many unnecessary labels on myself. Letting go of each one feels like I might not meet someone's expectations. Strangely, these expectations only exist in my mind, holding me back from being true to myself. Even the label "founder" seems to dictate how I should behave. It's a freeing thought to let go of this baggage and labels and just do what feels right without overthinking how an activity might be labeled. ♡ 2 · Reply Dan Shipper over 1 year ago @george_7539 thank you for reading! glad it was inspring to you :) appreciate you sharing your story. labels are interesting...i think sometimes they can be super helpful, but sometimes they function as boxes that keep us hemmed in. glad you're exploring letting go and seeing what happens! ♡ 1 · Reply Avishek Banerjee over 1 year ago I am a software engineer and uber love being just that! Took almost 5 years to accept that. Also took me down the taxing path of being a Manager and the scenic route of being a Product Manager, both of which I did reasonably well. But the joy of seeing the code come to life is simply unmatched by anything else! ♡ 2 · Reply Dan Shipper over 1 year ago @avishek_703 very glad you decided to go down the software engineer path with us ❤️ ♡ 1 · Reply @sgray over 1 year ago Dan - we are twins. Two failed books by the agr of 21. On the second one the literary agent said “look, you’re 21, you wrote two whole books, you’re obviously a capable chap so go and find something you’re good at.” I come from an entrepreneurial family and figured businesses are mostly story telling anyway so off I went. 28 years later I’ve founded many, invested in many, had a few good wins, but there is still an itch I haven’t scratched. My Bly bag is heaving with unwritten films and plays and novels. Of course I’m too busy to do anything about it, I always make sure of that, but maybe soon a little window of time will present itself and I will gaze out of it wandering what’s next and recall this article and leap through. Thanks for writing it. ♡ 1 · Reply'''
