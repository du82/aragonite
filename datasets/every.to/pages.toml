full_description = '@mhamilton_6859 11 months ago Reminds me of this famous if not over-used quote from EO Wilson: "We are drowning in information, while starving for wisdom. The world henceforth will be run by synthesizers, people able to put together the right information at the right time, think critically about it, and make important choices wisely." Summarization is a rote task in the age of AI, but when will the human ability to synthesize information to make decisions be replaced? The manager is a synthesizer, and the ultimate synthesizers are the ones who can leverage AI to generate information & summaries and use it effectively, but I wonder when AI will become the manager, too. ♡ 1 · Reply @lisalgolfpro 11 months ago Great article, on point. Allocation economy, something to work towards. ♡ 0 · Reply'
