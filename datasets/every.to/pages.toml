["https://every.to/chain-of-thought/gpt-4o-and-openai-s-race-to-win-consumers"]
title = "GPT-4o and OpenAI’s Race to Win Consumers"
description = "Decoding what the AI leader’s latest release means for the future"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. Still, some of the new features are sneakily exciting. More importantly, they tell us a lot about OpenAI’s product strategy and roadmap: knock the socks off the average consumer, for free. I (Dan) am going to explain what it all means from a strategic, technical, and consumer perspective. Then Evan will wrap it up with what it means for the enterprise. GPT-4o is not a huge leap forward in terms of intelligence—it seems to be slightly above the level of GPT-4 Turbo for capabilities like knowledge, reasoning, and comprehension—but it’s the most user-friendly model the company has ever released, and it’s available to everyone at no charge. OpenAI is already the dominant destination chatbot, and these features are aimed at maintaining its position. It’s running the classic Silicon Valley playbook: (1) Release great technology, (2) raise lots of money to make that technology as cheap as possible, and (3) get as much distribution as you can, as quickly as you can. In the long run, OpenAI wants to make sure that ChatGPT continues to be synonymous with this generation of AI products, while it keeps pushing the limits of what the technology can do. With this strategy, OpenAI doesn’t necessarily need to push the technical frontier with every release. GPT-4 is already intelligent enough for most everyday consumer use cases—but it used to cost $20 a month. For most AI users, who were previously using the free ChatGPT 3.5, the move to GPT-4o will be a big upgrade. ChatGPT currently has more than 100 million monthly active users. If we assume only 5 percent of those are paid, more than 95 million people just upgraded to the best model they’ve ever used. It’s a leap in intelligence comparable to the one that most AI enthusiasts experienced a year ago with GPT-4. That’s going to make a world of difference..."
