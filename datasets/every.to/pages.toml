["https://every.to/chain-of-thought/will-you-read-writing-from-an-ai"]
title = "AI Writing Will Feel Real—Eventually"
description = "Humans have always found new technology impersonal, but that feeling doesn't last"
full_description = '''Daniel Nest 10 months ago Great post, Dan. I've been having similar thoughts about this, especially the fact that "Human-made" writing may actually increase in value as AI-generated content proliferates further. I welcome the idea of having two "separate tracks" - one for AI-based entertainment (whether it's writing, movies, music, and more) that we acknowledge as such, and another one for when we're seeking a human connection. ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Every company knows they need to integrate AI. But most internal initiatives get stuck at some phase of the process. Whether it’s research, implementation, or training, it can be hard to get new technology over the finish line if no one is directly responsible. I’ve been consulting with a few select mid-to-large-sized companies to help them maximize AI’s ROI and bring their projects over the finish line. These feelings won’t last. They will likely be replaced with a rich sense of connection and meaning—feelings that will be as intimate and enveloping as those we have in interactions with our phones, our novels, and our films. It won’t be an exact substitute for human connection but will satisfy some of our needs. To understand how and why I think this will happen, we have to review some history—and some psychology. New technology always seems impersonal. It always feels like a poor replacement for whatever came before it. With time, certain technologies manage to escape this nascent state and become part of the fabric of daily life, and therefore imbued with rich layers of meaning and depth. Mostly, this is generational. A simple example: My parents generally prefer a phone call to a text. They feel that chatting with their thumbs is impersonal. On the other hand, texting creates a real sense of connection for people of my generation. I love the passive presence that a constant stream of back-and-forth texts evokes.'''
