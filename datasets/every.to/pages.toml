["https://every.to/chain-of-thought/we-tried-openai-s-new-agent-here-s-what-we-found"]
title = "We Tried OpenAI’s New Agent—Here’s What We Found"
description = "Operator (Could you help me do this task?)"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Alex Duffy is the consulting lead and a staff writer who writes about AI tools and technology in Context Window. How to Write With AI is a course taught by Every lead writer Evan Armstrong. You’ll learn how to use AI tools like ChatGPT, Claude, Spiral, and Lex to transform blank pages into powerful content that resonates across the internet. The four-week cohort-based class runs from Feb. 13 through Mar. 6 and includes: The class has already been taken by over 90 students, including founders, aspiring writers, engineers, and university professors. Check out the course website for more information and to enroll: Today, OpenAI announced Operator, a new research preview of ChatGPT that acts as an agent for your repetitive tasks. It can autonomously perform actions for you like shopping for airline tickets, making restaurant reservations, buying flowers and more. Operator has access to its own browser, and you can watch it navigate the web in real time—and it allows you to step in to take control whenever you want. Unlike previous web-browsing experiences inside of ChatGPT, Operator is designed to handle tasks end-to-end rather than requiring your input in between. OpenAI gave Every early access to Operator this week and we’ve been putting it through its paces. Here’s what we found. Operator’s home screen—which lives on operator.chatgpt.com instead of inside of ChatGPT—looks a lot like vanilla ChatGPT with one key difference. ChatGPT usually greets you with the message, “What can I help you with?” Instead, Operator greets users with, “What can I help you do?” The difference is slight, but revealing: It’s very much concerned with getting work done—and it’s not as much of a general-purpose tool as ChatGPT proper is (at least for now). You can ask Operator to do whatever you want but, below the fold, Operator shows suggested tasks that it can perform for you on some of OpenAI’s partner sites. For example, it suggests finding four tickets to a Kendrick Lamar concert, or researching dinner recipes that take less than 30 minutes and involve chicken."
