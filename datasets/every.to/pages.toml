full_description = '''Craig Gordon over 1 year ago great piece Dan ...am using it in my Understanding AI classes and interesting to see how it stacks up against Gemini from Google when we hear more about it. One item I keep mentioning in class which I never here anyone talk about is how Open AI has maxed out potential return for investors like Microsoft at certain levels (I think 100 billion for MSFT) so that it isn't ruled by making money for investors if it reaches valuation goals such as APPLE or GOOGLE. I think that is a huge change in what it might become and say in class but no one seems to talk about it. Any thoughts? Keep up the great work; will be contacting your new editor early next year to see if we can set up a farm team of journalist for your company. best, Craig ♡ 0 · Reply Andrew Meister over 1 year ago So far the best I’ve read so far about the event. Kudos Dan. Lots if strategizing to do for devs that use OpenAI’s suite for their own product. The so called “wrappers are dead” companies. I don’t think it’s as simple as “wrappers are dead”, especially if they are adding a store. Interesting anecdote. Microsoft Azure team pinged us unsolicited with the pitch “you should be on Azure store because…”. We did a call it’s interesting. Maybe apps have three channels. Normal old way B2B SaaS, the OpenAI store, and the Azure store. As a thought experiment, how many apps are in the Salesforce App Store? Best, Drew ♡ 0 · Reply @rlfinn1 over 1 year ago Thanks for the update Dan. I really appreciate your articles. You've made a very complicated, technical and foreboding topic feel approachable for a simple, non-technical and easily intimidated average person. I don't think I'd have gone anywhere near Chat GPT without having stumbled across your writing in another newsletter. It's now a tool I use regularly to help with 'life admin' and work... ♡ 0 · Reply @lizheinberg over 1 year ago Have a personal connection to anyone at OpenAI? I'm a professional namer (one half of a micro-agency that specializes in naming and brand architecture) and I'd LOVE to get my hands on their naming system. It's so confusing now, and it's only going to get worse as they develop more products. Plus I can't tell you the number of people I've heard say "Chat GTP"... And (unrelated to the naming) - does any of what was announced change your plans for the upcoming Chatbot course? I'm signed up, but I find myself wondering if the syllabus was just rendered semi-obsolete. Still super interested in learning, but I'm hoping maybe there will be adjustments or supplementary lessons? ♡ 0 · Reply'''
