full_description = "Our Team Dan Shipper Cofounder and CEO Dan Shipper is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. Kate Lee Editor in chief Kate Lee is the editor in chief of Every and general manager of the newsletter. Previously she was the publisher of Stripe Press and the head of content at Medium. Brandon Gell Head of Studio and consulting Brandon Gell runs the product studio and consultancy at Every. Prior to joining Every, he founded and sold Clyde, an insurance tech company based in New York. Michael Reilly Managing editor Michael Reilly is a career tech and science journalist and newsroom leader. Previously he was at New Scientist, Protocol, The Markup, and MIT Technology Review. Evan Armstrong Lead writer Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. Lucas Crespo Creative lead Lucas Crespo is the creative lead of Every. He was previously an art director at the advertising agencies BBDO and VML. Alex Duffy Сonsulting lead Alex Duffy is the consulting lead and a staff writer who writes about AI tools and technology in Context Window. Andrey Galko and Tails, engineering co-leads Andrey Galko is the engineering lead at Every. He focuses on building mobile and web experiences that feel good to use. (Tails is just a professional good dog.) Rhea Purohit Contributing writer Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. Katie Parrott Contributing editor Katie Parrott is a writer and content strategist interested in the intersection of technology and labor. She examines how work is changing in her monthly column, Working Overtime. Scott Nover Contributing editor Scott Nover is a freelance journalist living in the Washington, D.C. area. He is a contributing writer for Slate and the author