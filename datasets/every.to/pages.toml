["https://every.to/p/the-ultimate-guide-to-prompt-engineering-c40e6a01-d02d-4768-957d-d4e547786413"]
title = "The Ultimate Guide to Prompt Engineering"
description = "Prompting AI tools is a new form of management science"
full_description = "Michael Taylor is a freelance prompt engineer. He explores how to manage AI tools like humans in his monthly column, Also True for Humans. You've read about how AI can help you articulate your taste, its transformation of the knowledge economy, its potential for creating billion-dollar companies, and practical applications to help you increase your productivity. It's time to get down to brass tacks with a tactical guide to get the most out of ChatGPT—starting with how to prompt, or ask, it. Good prompting is the difference between AI that feels like magic and AI that feels mundane. Michael Taylor, who's writing a book about prompt engineering, explains exactly how to question ChatGPT to get the answers you want. We'll resume regular publishing on Monday with a new installment of Gareth Edwards's column, The Crazy Ones.—Kate Lee As OpenAI released smarter, more sophisticated models like GPT-3.5 and GPT-4, many of these old tricks became unnecessary. As someone who freelances as a prompt engineer and created a popular course on the topic (we just passed 50,000 students!), many people ask me if prompt engineering will even be needed in the future when GPT-5 or GPT-6 comes out. Sam Altman, the founder of OpenAI, certainly doesn’t think so. “I don’t think we’ll still be doing prompt engineering in five years,” he said in October 2022. OpenAI’s stated goal is to build AGI, or artificial general intelligence: a computer that performs at a human level across every task. When it reaches that point, we can ask the computer to do whatever we want in natural language, and it’ll be sophisticated enough to anticipate our needs. Yet I don’t believe prompt engineering will disappear. It’s an important skill. Look around at your coworkers (or if you’re working from home, take a look at your Slack or Teams messages). Everybody you work with is, by definition, already at AGI—but they still need to be prompted. You’re communicating a prompt every time you brief your designer, explain how to do something in Excel to an intern, or give a presentation to your manager. Every manager is a prompt engineer, using their communication and data analysis skills to align the team toward a common set of goals. Even your employment contract is a prompt: a standardized template of language designed to align your behavior with the commercial goals of the organization."
