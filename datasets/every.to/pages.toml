["https://every.to/learning-curve/why-there-s-no-right-way-to-use-ai"]
title = "Why There’s No ‘Right’ Way to Use AI"
description = "Software has always had clear rules. AI forces you to write your own."
full_description = "Georgia Patrick about 1 month ago Whew!!! So glad you explained it that way. I never wanted to know everything EXCEL could do and I am in the 95% who don't care, because we are writers, not psychometricians. ♡ 0 · Reply Rhea Purohit focuses on research-driven storytelling in tech. She writes about the psychology and history of adopting new technologies in her column, Learning Curve. If you prefer to listen to rather than read our essays, we’re live on ElevenLabs’s ElevenReader app. Download the app and subscribe to our feed to listen to audio versions voiced by AI. I’ve been a writer here for over a year—and I thought everyone on the team was “good” at AI…while I wasn’t. What do I mean by “good”? It goes beyond technical knowledge of LLMs, like chain of thought or few-shot learning. Instead, they used AI with a natural fluency; an intuitive sense of its uses and limitations. I kept up with the zeitgeist and tried out new models, but I still fumbled to find that quiet competence. Until the fog finally lifted when I spent a Saturday in November getting familiar with Excel functions. I realized that you can learn the “right” way to use conventional softwares like Excel, but generative AI is inherently different—it’s less about searching for the “right” way, and more about defining what that means for you. I live in Spain, and perhaps the only boring thing about that is dealing with bureaucratic immigration processes. In November, one of these regulations required me to calculate the exact number of days I’d spent outside the country in the last four years. Tedious stuff, indeed. As I thumbed through my passport for entry stamps and scoured my email for flight tickets, I logged the information in an Excel sheet. I used simple functions to calculate the number of days in each trip I’d taken and add them up at the end. I wouldn’t call myself an expert in Excel, but I got comfortable with the basics of the software quickly. It was easy. I figured out which formula I needed, typed it in, and if I made a mistake, Excel would helpfully throw up an error in that cell—I saw #NULL! or #NAME! and knew I’d gotten something wrong. (I was dealing with a relatively simple task, and there are certainly far more complicated functions within Excel that I haven’t begun to learn about.)"
