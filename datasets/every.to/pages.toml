["https://every.to/working-overtime/the-once-and-future-history-of-knowledge-work"]
title = "The Once and Future History of Knowledge Work"
description = "Technology brought knowledge work into this world. Can AI take it out?"
full_description = "Katie Parrott is a writer and content strategist. She examines how technology is changing work in her monthly column, Working Overtime. Artificial intelligence is changing the value of knowledge work—something that Katie Parrott, as a knowledge worker herself, has been grappling with. So it’s a fitting topic of exploration for the debut piece of her column, Working Overtime, in which she’ll examine the historical impact of technology through the lens of workers and the systems they participate in. (Longtime Every readers may recognize her byline from when she served as our managing editor.) Knowledge work is a term, Katie writes, that’s long made her somewhat uncomfortable because of its elitist connotations. But the rise of AI offers an opportunity to reevaluate both the lingo and the role that so-called knowledge workers play in society and the economy.—Kate Lee In 1999, management consultant Peter Drucker made a prediction that was either prophecy or hubris: Knowledge workers, he wrote in California Management Review, would be “the most valuable asset of a 21st-century institution.” A quarter of the way through the century, however, the future of knowledge work has never been more uncertain—thanks in no small part to generative AI. The term “knowledge work” has always made me uneasy. Coining the term in 1959, Drucker defined it as “high-level” professionals who use their theoretical and analytical expertise, often gained through formal education, to create products and services. I couldn’t begin to tell you how to wire a house or repair a car. Those jobs require immense skill and vast knowledge, yet they are rarely classified as “knowledge work.” This corporate lingo carries more than a tinge of classism, social hierarchy, and condescension—as if real work happens only in front of a computer screen, pushing pixels around and complaining about the hardship of having one’s camera on during Zoom calls. That said, as a marketer, I very much fit Drucker’s definition of a knowledge worker, regardless of how that makes me feel. And as someone who would like to pay her bills for the next 50-plus years, I have a vested interest in understanding how AI will affect knowledge work—and thus, my career."
