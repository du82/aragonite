["https://every.to/napkin-math/how-to-make-millions-on-discord"]
title = "How to Make Millions on Discord"
description = "A new distribution channel has opened"
full_description = "Evan Armstrong is the lead writer at Every. He explores profit and power in technology in his column, Napkin Math. I would like to give you $20 million. Well, not directly. Instead, I’d like to tell you about an opportunity that could get you that money relatively easily. It isn’t quite growing on trees, but it’s pretty close. When I’m evaluating a tech company, one of my most important filters is distribution—the way a company grows. Does the founder have a novel, repeatable way to acquire customers? Is there a channel, like Facebook ads, that is unusually cheap and the market hasn’t yet utilized? This distribution advantage can present itself along the following variables: You can justify building a product if just one of these questions has a strongly positive answer. The idea I’m proposing is so good it ticks all four boxes. I’m talking about a $20 million opportunity called Discord Activities. For the unfamiliar, Discord is a communications app where people chat via text, voice, or video on private servers. It had 183 million users in 2022 and is home to communities far beyond its original domain of gaming. Crypto, AI, and pop-culture fandoms of every shape and size congregate on its purple-green servers. To supplement the service, over the last year Discord has been adding activities for users to engage in during voice chats. There are mini-golf games like Putt Party. Eight days ago, Discord began enabling outside developers to build activities. Developers can monetize these activities by upselling customers, and early adopters are already selling cosmetic purchases, like hats for your avatar. The apps can be played on text channels, voice chats, or in individual servers—virality is built in. There are currently only 19 apps available for selection on the accounts we tested. By comparison, the iPhone launched with 500 apps, and the Vision Pro has over 1,000. The apps are relatively fun and easy, similar to the simple, hyper-casual games in the App Store that you play for a day or two."
