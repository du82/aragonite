["https://every.to/p/test-82065cb6-6ce6-41da-98af-9e69de27b09d"]
title = "A Depression Toolkit"
description = "How I finally broke through the fog"
full_description = '''Tintin over 1 year ago It takes courage to write about our issues, so well done. As for medidation, I recommend Sam Harris' book and the Waking Up app. ♡ 0 · Reply @matyiii 7 months ago What an incredible article. Thanks so much for taking the time to put this together and show us a window to your struggles. ♡ 0 · Reply Editor's note: We received a lot of positive feedback for Brie Wolfson's post "How I Got My Brain Back," so we wanted to follow up with another writer's personal account of fighting depression. Engineer Jamie Wong took an analytical approach to his dark night of the soul. He tried many solutions, from supplements to social media fasting to the teachings of Shinzen Young. His thought process, originally penned on his personal blog in 2017, is insightful for anyone struggling with similar questions. I recognize that those options are not available to everyone, and I’m fortunate to have the socioeconomic freedom to pursue all of them. I hope this post can help a few people feel like they’re not alone in their struggle. (And thank you to the two posts that did that for me: John Green's "Talk about mental illness and creativity," and Hyperbole and a Half’s “Depression part 2.") And because it will become blindingly apparent through this post, yes, indeed, I have gone full Valley: I’m an engineer in San Francisco working at a startup, attending meditation retreats, seeing mental health professionals, and went to Burning Man last year. The year started out on good footing, with motivation for work, exercise, living in a house of good friends, and finally having the chance to live with my girlfriend, Bonnie, again instead of mostly co-existing through walls of Facebook messenger chats and video calls across three timezones. The first change in my mental health seemed innocuous enough. Standing outside the doorway of one of my housemate’s rooms, I commented that I’d noticed I didn’t have the same visceral reaction to spending time with friends as I used to. He said that sounded pretty weird, and maybe I should seek out therapy. I brushed off the notion, seeing it as a pretty minor problem, and went about my life. Soon, I started to notice the same thing would happen when I would go on hikes. Any visceral sense of serenity was eerily missing.'''
