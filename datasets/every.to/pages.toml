["https://every.to/p/to-beat-the-market-you-have-to-outsmart-yourself"]
title = "To Beat the Market, You Have to Outsmart Yourself"
description = "How one venture capitalist hacked his psychology to generate returns"
full_description = 'Your business is ready to expand. Global hiring is an enticing solution, but it can come with a lot of questions. Deel’s here to answer. When it comes to business, we often focus on studying markets, companies, and economic trends. But venture capitalist Chris Paik argues that the most overlooked—and perhaps most crucial—area of study is ourselves. In his latest piece, Chris explores the "inner game" of investing, revealing how self-awareness and introspection can lead to better decision-making and higher returns. It’s something we’ve been thinking a lot about at Every—Dan Shipper has also explored the complex interplay of emotions and intellect.—Kate Lee In the world of investing, there are two areas of study. The first is outward-facing—the study of what makes good investment opportunities, businesses, fundamentals, and frameworks. This is where most people spend all of their time, and with good reason. It can seem like the most expansive, information-rich canvas to explore, and many great investors have distilled and published their thinking for future generations to consume. Similar to hard science fields like physics, if you’re studious enough to examine business history, you may be able to stand on the shoulders of great minds who came before you. The “scientific” aspect of investing is alluring, even enticing—the prospect of a grand formula that can distinguish between good and bad investments might seem like the holy grail for a capitalist. However, at least in venture capital, it is a goal that continues to elude the smartest and hungriest minds in the field. Even if we get the science right, it’s only part of the formula of good investing. The second world of study is inward-facing—the study of one’s own judgment, intuition, incentives, and our natural tendency to want to outsmart ourselves: We can fabricate rationales that we know we will accept because we know ourselves. To study ourselves, we must constantly attempt to populate an ever-evolving 2x2 matrix with information:'
