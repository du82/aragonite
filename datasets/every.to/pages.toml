["https://every.to/chain-of-thought/how-to-make-ai-write-like-your-favorite-author"]
title = "How to Make AI Write Like Your Favorite Author"
description = "A step-by-step guide from prompting to fine-tuning"
full_description = "Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. This essay is brought to you by Scrintal, a visual-first knowledge management tool that lets you organize and connect all your thoughts in one place. It’s the prose version of licking cardboard. There is a taste to it, but it is the absence of any real flavor that is most striking. So, reasonably, AI-assisted writing gets a bad rap. People say it reads like SEO content farm marketing swill. It’s not for serious writers. This criticism is correct, in the sense that inputting a basic prompt to a popular model like ChatGPT or Bing will output wholly middle-of-the-road responses. But this criticism is a little like saying that the output of keyboards is typically bland. Yes, it’s true, when you first learned to write on a keyboard you couldn’t write anything particularly good. With a little practice, though, you can get a keyboard to write anything you want. The same is true for AI. I’ve written before about how I use AI as part of my writing process—it can help me get ideas out of my head, find the narrative of a piece, or help me when I get stuck. But today I want to focus on one of the most useful things you can do with AI -assisted writing: This article will go through the whole process: from finding prompts that work to fine-tuning. By the end, you’ll have a richer understanding of how to push generative AI models in new directions, and how to add more depth and flavor to your own writing. I know the title of this article claims to teach you how to use AI to write like your favorite author. But this is not going to be about learning to push one button in order to output a deep fake Tolstoy novel. That’s not technically possible and probably not desirable. Instead, this article will teach you to use AI to write like a richer, deeper version of yourself. It can be used to help you understand what you love about a particular writer. And it can also be used to help push your brain into the territory of their language, so that you can incorporate some of their style into your own."
