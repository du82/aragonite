["https://every.to/superorganizers/the-ceo-of-no-1725658"]
title = "The CEO of No"
description = "How entrepreneur Andrew Wilkinson turns emails into opportunities"
full_description = "Pedro Martins Dusso about 2 years ago This is one of the best CEO life lessons I have ever read. I keep coming back at it in the last weeks, and today I decided to scroll down to the comments. To my surprise, there was none - but I immediately grasped why. It's so much to learn here that you always finish like it was the first time you read it. Thank you very much for this one. ♡ 0 · Reply Dan is the CEO and cofounder of Every. Every week he explores the frontiers of AI in his column, Chain of Thought, and on his podcast, AI & I. For Paul Simon there might be fifty ways to leave your lover, but, for Andrew Wilkinson, there are 50 ways to say no to meetings he doesn’t want to take. I know, because I’ve seen his templates. He calls them “Let Downs” and he has one for every occasion: Andrew is a partner at Tiny where he starts, buys, and invests in internet businesses. Over the last few years he’s built it into a thriving collection of companies — over 30 with about 600 employees collectively. What Andrew has built is fascinating because he’s turned himself into a people router. He takes people who arrive in his inbox, and gets to decide where in the Tiny machine to put them. If he does that job well the machine will grow — like magic. But here’s the conflict: even though his job is all about people, he doesn’t like to be on phone with them too often. He only likes to do 2-3 meetings a day — which is surprisingly few for a guy with 600 employees. But this habit of saying no spreads beyond his inbox. He’s really set up his whole life by saying no. He’s said no to venture capital, he’s said no to living in Silicon Valley, and at his company he’s used delegation to say no to anything that will require him to do work that he doesn’t want to do. In short, he’s said no to anything that doesn’t fit into his vision of success — and it’s working pretty well. For the last few years, I’ve been a partner in Tiny. We buy mostly bootstrapped and profitable internet businesses from their founders. We’re committed to holding them for the long term, maintaining their culture, and growing them sustainably."
