t nothing else matters man in the future is worth more than you update your priors i'm earning to give i'm tweeting about giving i'm better than you look at my receipts on my twitter and my blog I inspire giving what is racism? i dont have any priors Bayes will save us all From anonymous contributor JM (reproduced with their permission) Buy mosquito nets Or forestall bad AGI Please take my billions NO DONT WRITE IT DOWN That’s an info hazard Oh, my wife left me EA leadership! Push the red alarm button! It just explained jokes! Gave effectively All my fiat to the cause Please spare some change, sir?'''
