title = "Ewen Cheslack-Postava - Blog"
description = "Ewen Cheslack-Postava - Blog"
full_description = "Some Options for Note-taking Apps Where You Own Your Data December 1, 2023 note-taking apps I looked around for some options for taking notes today, personal wiki style. For notes specifically, Evernote was, for a long time, the goto service/app. I think it’s probably fallen out of favor, and also seems like it may have just stagnated as a product. Keeping a product focused is good, but not if it’s also kept overly simplistic. I’ve used Notion for work and like the experience and flexibility, but for limited personal use I don’t necessarily want to deal with the limitations of the free tier or cough up money if I need certain features or need to exceed the free tier limits (e.g. 5MB file upload limit). To their credit, Notion does have export, and in markdown for the pages so at least it’s feasible to move with relative ease. But it’s also online-only, which is not ideal. They also have a fairly unique product in that it’s not just notes, not just a wiki. The database functionality, in particular, is interesting. You can also use database entries as tickets, which I find less useful as it’s fairly primitive (at some point it’s trying to and be do too many things). Additionally, the database functionality could be more flexible, e.g. if backed by a real database being able to embed views using simple SQL queries would be nice for technical users. I looked at Joplin, Appflowy, AFFiNE, and Obsidian. I’m probably going to use Joplin for now, but started out testing real usage in Appflowy and it shows promise as well. Here’s are some notes on each of these options: Read More… Deep Reading - Maryanne Wolf on The Ezra Klein Show December 1, 2023 links podcast deep reading focus attention comprehension In the past couple of years, I’ve increasingly noticed just how much I’ve lost the ability to do focused, in-depth reading of long form work. Or more accurately, how weak those mental muscles have become. I tend to skim, switch between different articles or tasks, and get easily distracted. So it was a nice coincidence that on an off-week The Ezra Klein Show podcast re-ran an episode from a year ago with Maryanne Wolf on Deep Reading just a couple of weeks after I finished reading The Shallows: What the Internet Is Doing to Our Brains by Nicholas Carr, one of the books referenced in the podcast. The episode is quick to consume, but ironically, given the time available cannot go into great depth. Carr’s book is also relatively quick (basically the shortest length I think books are permitted by publishers to be these days at ~200 pages) and provides more depth and nuance. It also has an excellent reference section for further reading. Given this is very much “the medium is the message,” I have McLuhan’s Understanding Media: The Extensions of Man added to my list but have been disappointed to discover that my county library system only has a single copy of the book that coined the oft-used phrase.1 I haven’t read them yet, but I suspect Wolf’s books Proust and the Squid: The Story and Science of the Reading Brain and Reader, Come Home: The Reading Brain In a Digital World would also be worthwhile reads. Read More… TIL: Commonplace books November 26, 2023 TIL TIL: Commonplace books are the original notebooks. The origin of the name is interesting, if confusing – “common” refers to a “literary topos”, i.e. a topic or theme. The note taking process was eventually formally taught to students, at least as early as the 17th century. I feel like at some point maybe there was some brief discussion of note taking in my own education, likely in an English class, but nothing very formal. Read More… Offices, Betting on Serendipity, and Water Coolers November 25, 2023 work culture return to office We’re not really “post-COVID”, but it’s been more than a year since people loosened up and largely went back to normal life. I had thought by now most discussion of return to office would be resolved by now, but the discussion seems to just keep going. One positive outcome of COVID was that it made people question that status quo. Personally, long commutes have always been a dealbreaker for me – longest I’ve had was ~30 minutes max each way and I am lucky to be privileged enough to not need to compromise on that. Even for folks with longer commutes, I think employees realizing they could frequently do the same work only being in the office for e.g., half the week is a huge improvement. But there’s one very common argument against fully remote that I see frequently: overhearing discussions at the “water cooler”. These chance encounters allow catching an issue, giving context or an explanation, or proposing a solution that would not have happend otherwise. To me, this argument seems to indicate more of a failure of other structured or unstructured communication that can happen regardless of whether local or remote. Read More… Tools and Pipeline for Composing and Testing HTML Emails September 16, 2013 email web development programming tools Recently I’ve been adding some features to StraightUp that require email. And of course we want those emails to look attractive, so we need to send multi-part text + HTML messages. This doesn’t sound so bad until you look at the sorry state of HTML support in email clients — expect to code like it’s 1999. It actually isn’t that bad if you keep your emails simple, and there are quite a few posts out there covering the nitty-gritty of writing HTML emails (and a lot more that are useless, superficial overviews). But when I went to start implementing this, I found none of them actually explain how to implement and test your emails. They are just standard lists of what you can’t do. Even the very nice boilerplate templates, such as HTML Email Boilerplate and Emailology, don’t explain how you should implement a pipeline on top of their tools and recommendations. If you’re sending one-off marketing emails, it might be fine to manually edit and test each email, writing all your styling inline. If you’re doing anything more complex, generating dynamic emails, or repeatedly creating lots of emails, you don’t actually want to write your email templates with a bunch of inline styles. This is one of the reasons services like MailChimp are handy. They do a bunch of this for you automatically and give you good starting templates. But if their service doesn’t fit your needs, what do you do? Read More… Newer Older"
