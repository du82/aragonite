["https://ewencp.org/blog/offices-betting-on-serendipity-and-water-coolers"]
title = "Offices, Betting on Serendipity, and Water Coolers"
full_description = "Offices, Betting on Serendipity, and Water Coolers November 25, 2023 work culture return to office We’re not really “post-COVID”, but it’s been more than a year since people loosened up and largely went back to normal life. I had thought by now most discussion of return to office would be resolved by now, but the discussion seems to just keep going. One positive outcome of COVID was that it made people question that status quo. Personally, long commutes have always been a dealbreaker for me – longest I’ve had was ~30 minutes max each way and I am lucky to be privileged enough to not need to compromise on that. Even for folks with longer commutes, I think employees realizing they could frequently do the same work only being in the office for e.g., half the week is a huge improvement. But there’s one very common argument against fully remote that I see frequently: overhearing discussions at the “water cooler”. These chance encounters allow catching an issue, giving context or an explanation, or proposing a solution that would not have happend otherwise. To me, this argument seems to indicate more of a failure of other structured or unstructured communication that can happen regardless of whether local or remote. Betting on Serendipity The basic argument is this: as a manager or senior IC, I manage or work on multiple projects in parallel and interact with a lot of people; having folks in the office means I can sometimes overhear something and intervene to help – maybe someone’s stuck on problem they don’t know how to solve, trying to make a choice on design, or maybe just don’t have the right context to make a decision. Being able to overhear discussions provides an opportunity to intervene. In an extreme case, it you might catch either a problem or an good product idea that requires pulling in a broad set of teams (product, engineering, sales, etc) that the engineer raising the issue may not have been able to or wasn’t able to effectively up-level through the normal management tree. But everything I listed is already part of the manager’s or senior IC’s job, regardless of whether a team is entirely local or distributed. The argument assumes luck will strike. What if at that critical moment you were in a meeting, or eating lunch, or in the bathroom? The entire argument is based on the probability that you happen to overhear something critical. Unless you just sit at your desk all day, no headphones, no meetings, no other obligations… Doesn’t sound like a great plan for success1. I would think about it differently: how do you surface these issues or ideas without relying on serendipity? 1:1s and skip-levels are a baseline, standups can help (although I’ve yet to find a team where there’s true concensus on frequency, format, and limits), and clearly agendad, scoped, one-off meetings are great if you’re lucky enough to have a good meeting culture and people who know how to run a meeting. More importantly, a lot can be raised asynchrounously, via email/chat/issue tracker. I’m sure there are more scenarios, but for the ones I listed in easiest to hardest: Stuck on a problem (needs concrete technical solution) This should be the easiest because the engineer should just bubble it up directly – meetings, Slack, whatever. If this becomes an issue, it’s very direct coaching and in the interim maybe more frequent check-ins. Design decisions (tradeoffs, maybe add options they haven’t thought of) Have a process in place for writing up and reviewing designs as standard practice. It can optionally result in a meeting if synchrounous discussion would be useful. The most difficult thing here is knowing where to draw the line between what should be written up and what should just be executed on. This approach is also better as it forces thinking a bit about how to clearly frame the issue, enables input more broadly, and grows junior team members’ review skill. The water cooler version can really only serve to make the problem visible since you’re not going to properly design something while chatting for 5 minutes. Cross-team or company-wide considerations (working with uncertain product reqs, how to communicate features to customers, GTM movement including sales and marketing, supporting the support/customer success team, etc). This is the hardest because ideally there’s a level of insulation in a sufficiently large organization – a manager or team lead should help filter out the irrelevant and inform about the relevant. In a large enough organization even the first-line manager may not know to bubble it up. In this case I think it’s important to build a culture of product thinking (and by “product”, I mean end to end). Even just being aware what could be interpreted as product experience, supported functionality, public APIs that can’t easily be changed allows everyone to keep an eye out for potential need for broader discussion. (And ideally everything, even seemingly innocuous code changes, have at least 2 pairs of eyes on them.) Allowing chance encounters in the hallway to be a key to success means you abdicate control over situations you can actually control; and probably blinds you to those opportunities. So what are the office and water cooler good for? There are drawbacks to going full remote – a good reason a lot of companies are allowing flex schedules of 2-4 days in office per week. But I think the drawbacks are mostly indirectly related to productivity or effectiveness. There is value in forming face-to-face social relationships with coworkers – forming a sense of comraderie, team cohesiveness, and just generally having empathy for coworkers. Going fully remote requires making a conscious effort to allocate time and space for that. Usually this means some form of unstructured or semi-structured time with at least your team, but ideally enabling interaction between people who wouldn’t do so regularly. These also can be adapted to work remotely, but I admit they work better in person. On the non-water cooler front, there are some things that are legitimately harder to do remotely that have a more direct effect. Personally, the biggest ones I notice are whiteboarding and interviews. I’ve tried a few different solutions for whiteboarding, but for day-to-day work the only real workable solution I’ve found are vector drawing tools with shared storage (i.e. as a service), simultaneous editing, and that make it trivial to share and especially embed in wikis or issue trackers (e.g. Excalidraw). For interviews for software developers I mostly focus on the design rounds – coding interviews are a very limited sanity check that, in my opinion if required, should just be covered before doing anything in person even if someone can come onsite. Design interviews boil down to whiteboarding so have the same issues as already described. The main difference is that the candidate may not know the tool, which can be an issue. Ideally, accomodating them if they have their own setup (e.g. maybe they have a tablet and pen). Realistically, for small to medium sized companies, you’re likely to have to deal with remote interviews at some point anyway, so doesn’t really change the work-from-home calculus. Is it even really a choice? To me, the biggest problem with the (usual) employers’ perspective on this issue is that teams are frequently already distributed anyway. Even if your immediate team isn’t, usually some sister team somewhere at or near the leaves of the org chart are. So it feels a bit moot to even fight it. You’re going to have to address these challenges regardless. It seems better to generate goodwill by embracing it and trying to find solutions to the friction that remote work imposes that work with your company structure and company culture. I’m only maybe one third to half way into my career, but the first thing I learned is that all the Silicon Valley thought leadership pontificating is just self-help 101. And I mean that literally. A lot of it reads like a self-help book and frequently mirrors the exact same structure and basic tenets found in pretty much all of them. There’s a lot of luck involved in any success; even if you have great idea and (more importantly) execution, you still need to have luck with timing. ↩︎"
