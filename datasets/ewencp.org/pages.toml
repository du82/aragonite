["https://ewencp.org/blog/deep-reading-maryanne-wolf-on-the-ezra-klein-show"]
title = "Deep Reading - Maryanne Wolf on The Ezra Klein Show"
full_description = "Deep Reading - Maryanne Wolf on The Ezra Klein Show December 1, 2023 links podcast deep reading focus attention comprehension In the past couple of years, I’ve increasingly noticed just how much I’ve lost the ability to do focused, in-depth reading of long form work. Or more accurately, how weak those mental muscles have become. I tend to skim, switch between different articles or tasks, and get easily distracted. So it was a nice coincidence that on an off-week The Ezra Klein Show podcast re-ran an episode from a year ago with Maryanne Wolf on Deep Reading just a couple of weeks after I finished reading The Shallows: What the Internet Is Doing to Our Brains by Nicholas Carr, one of the books referenced in the podcast. The episode is quick to consume, but ironically, given the time available cannot go into great depth. Carr’s book is also relatively quick (basically the shortest length I think books are permitted by publishers to be these days at ~200 pages) and provides more depth and nuance. It also has an excellent reference section for further reading. Given this is very much “the medium is the message,” I have McLuhan’s Understanding Media: The Extensions of Man added to my list but have been disappointed to discover that my county library system only has a single copy of the book that coined the oft-used phrase.1 I haven’t read them yet, but I suspect Wolf’s books Proust and the Squid: The Story and Science of the Reading Brain and Reader, Come Home: The Reading Brain In a Digital World would also be worthwhile reads. Although they have their limitations, I’ve been trying to read more physical books and allocate time to do so with singular focus. And when really reading academic papers or technical writeups – not just getting surface-level understanding – I print them out and step away from the computer. The podcast’s discussion about allocating time for deep reading and what time of day that is (e.g. before bed) also struck a cord for me because I’ll naturally tend to fall asleep while reading before bed. Fine for plenty of “junk” books, whether fiction or non-fiction, but not great for deeper topics. My biggest gripe with this approach at the moment is that I got used to being able to annotate or highlight passages digitally. (The podcast briefly mentions how even reading on an ebook reader differs, worse if it’s just an ebook reader app on a regular tablet). So far I’ve just gone old-school with PostIt tags that I can revisit to grab quotes and write up some notes. I have more thoughts on the topic, but the podcast is worth a listen and might make you rethink what medium you use when you want to understand something deeply – going down the hypertext-driven Wikipedia rabbit hole, even with very long articles and good references may still only result in mile-wide-inch-deep understanding, poor retention, and no real associations or novel connections to other work. And also rethink how you engage with it, focus on it, and remain attentive – reading directly on the web or in apps, the ability to hop around on a whim, notifications from just about anything else popping up incessantly, etc. is a recipe for distraction. If you’re interested and can’t find a copy easily, OpenLibrary has it, but it’s a scan and only readable via their web interface. ↩︎"
