["https://ewencp.org/blog/naming-and-organizational-hot-messes-open-collective-openai-et-al"]
title = "Naming and Organizational Hot Messes: Open Collective, OpenAI, et al"
full_description = "Naming and Organizational Hot Messes: Open Collective, OpenAI, et al March 9, 2024 If you need dot files to graphically explain the relationships of various entities in your business scheme with careful labeling to distinguish the different legal entities, you might want to start by working on naming them clearly. The “there are two hard problems” jokes have been overdone, so I’m not going to repeat them . The most prominent example of this recently was OpenAI. The funny version that I can’t seem to find anymore slapped a “MONEY” label on the appropriate arrows. But the important bit is that the entire relationship and expectations between the board, non-profit, holding company, 2 different LLCs, Microsoft, employees and investors was probably not even well defined, but also just confusing as hell because the naming is too close. Whether there are any real merits to the case, Elon Musk is now following up on it, and OpenAI is responding. To me, a notable thing is that quoted emails don’t mention anything about the various entities names, no mention of 501(c)(anything), holding companies, etc. This is almost certainly just griping, but it’s certainly not as clear as OpenAI tries to claim. But also last week Open Collective, Inc. (OCI) has run into similar issues. There are various entities named Open(.*)Collective(.*) and detangling and understanding it all and their relationships is a mess. LWN has a good article1 explaining the details. This one gets even more confusing because there’s a 501(c)(6) which is not something you encounter frequently – basically instead of being charitable in some way, it’s goal is to support for-profit businesses but via a tax-exempt non-profit organization. In short, Open Collective Foundation, a 501(c)(3) providing hosting services (as far as I can tell) is in the process of being dissolved](https://docs.opencollective.foundation/?ref=blog.opencollective.com). What does that mean for OCI, OSC, OCEurope, and potentially more organizations? Only someone dedicated enough to write an LWN article is going to figure it out because it’s too confusing and too small an issue for most people to care about. Ultimately those details don’t matter that much. Everyone is confused because everything is named so similarly. I’m surprised companies even allow this in the first place since they presumably have a trademark they would need to defend. Yes, there’s something to be said for leveraging a brand name, but much less so if you’re not already extremely prominent. Everything here, both before and after this dissolution, would have been clearer if each entity found a distinct name that reflected their specific contributions. If I mainly have to distinguish based on whether you append “LLC”/“C corp” or “501(c)(some number)” to otherwise effectively identical names, I have to assume it’s all driven by the LLC/C-corp and ultimately everything I care about flows to them. In practice, the Open Collective case was a bit more meta as well since one of the founders had his hands in all the pies. But apparently couldn’t save OSF specifically. Another example I think is worth looking at is the Linux Foundation. Fund some kernel developers to work on the kernel full time? Cool. 900 open source projects? (Isn’t this about Linux, the kernel, which aside from loadable modules pretty monolithic?). More importantly, they have “Featured Projects” some of which themselves are foundations supporting dozens of substantial projects (e.g. CNCF, which supports kubernetes, is incubating (?!) gRPC (a 7.5 year old 2016 project; honestly more recent than I had thought given protobufs have public for 16 years, internally available for 23 years). My conclusion: naming is important and given failure rates, it’s probably better to come up with distinct, unique names rather than try to play up shared naming because even if the for-profit is successful, probably at least one associated entity will fail. LWN makes valuable contributions so I only link to the paywalled version. If you can’t afford it but are interested, email me and I will gladly provide a free link. The fact that they’ve offered that for years, well before any major news publishers provided “gift” links, should give you an idea of what type of news org they are. ↩︎"
