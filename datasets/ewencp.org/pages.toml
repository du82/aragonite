["https://ewencp.org/blog/cancelling-xfinity-service-was-surprisingly-easy-until"]
title = "Cancelling Xfinity service was surprisingly easy, until..."
full_description = "Cancelling Xfinity service was surprisingly easy, until... February 28, 2024 xfinity customer service customer service nightmare To get the process off to a smooth start, just lie and say you’re moving to a foreign country… Unfortunately, returning equipment turned into a bit of a nightmare. For somewhat stupid but unimportant reasons, I’ve been maintaining an Xfinity (Comcast) subscription even though I moved more than 18mo ago to a new house and have much better service and no caps/overage limits via AT&T fiber. I was pleasantly surprised how easy the initial process of cancelling service was. It’s still more trouble than it should be, partly because they want you to talk to a representative but they actively discourage your ability to just call in and talk directly. There’s the online chat, which these days is probably an LLM for at least some number of questions, regular static documentation, social media, or if you click through to the right places you can schedule a callback. I scheduled a callback which actually came within the scheduled window. Cancelling turned out to be pretty easy because I just lied and said I was moving to Germany. This did lead to some curiosity from the agent requiring me to make up more backstory, but at least it wasn’t an attempt to upsell. Unfortunately you also have to return equipment. Turns out if you’ve been a customer for long enough but haven’t used the cable box/DVR that they force upon you (or did at the time of subscription when Xfinity was the only real option for that house), they don’t know how to process it. To be fair, it should have been relatively simple – they have a store right in San Mateo and it could have been walk in, spend 3 min watching them process the return, typing an inexplicable amount to do so when it’s all started by a barcode scan, and you’re done. Compared to last time I did this more than a decade ago when it required traveling somewhere in the east bay and waiting in a giant line for an hour this was pretty good. But older equipment, newer systems – they couldn’t get any of the 4 barcodes on the thing to find anything in their system. Eventually they input it manually, gave me a receipt, and I thought I was done. After about 2 weeks, turns out they didn’t think it was returned and the texts and phone calls started up again. I thought it had been resolved so after about a week of the receipt sitting on my counter, I had recycled it. Eventually they send a bill, which was small enough that I just paid it because it was easier than having to talk to them again. But even though I can see they cashed the check, they keep texting and calling. I gave a bit of a grace period in case it just took some time to work through their system. So now I try resolving with another call, this time they claim they’ve cleared it manually. Texts and calls continue. Eventually I find a direct number and just start jamming 0 until I get something useful since obviously no options in their automated system are appropriate for this situation. (If you do this, they try to route you back to the start of the system at least once; just keep jamming 0.) After explaining and escalating up another level, this person is able to (supposedly) mark it as returned. And they gave me a credit, which I guess was supposed to cover the bill that I shouldn’t have had to pay. But I don’t think I can actually get that money out, only apply it to Xfinity services… which is useless since this whole rigamarole was because of cancelling service and I hope to never deal with them again… I’m still effectively out $100 but to be fair I’m as much to blame there for trying to just take the easy way out. Anyway, for a generally shitty company, this could have been a pretty smooth process, so I guess kudos to Xfinity for making it suck a lot less than it used to. But if you end up needing to do this, make absolutely sure you hold onto that receipt for at least a couple of months."
