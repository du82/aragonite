["https://ewencp.org/blog/founding-engineers"]
title = "Founding Engineers"
full_description = "Founding Engineers May 6, 2024 job titles human resources I got yet another recruiter spam email today about a job with the title “Founding Engineer”. Not unusual in the Bay Area, but today’s came from OpenAI, which as of the whole Sam Altman fiasco was at least 770 people and now could easily be close to or over 1000 employees. What do these companies think the point of specifying “founding engineer” rather than just “engineer” or “software engineer” if they dilute it of all meaning? Other modifiers at least convey very rough info. Senior/Staff/Principal or Software Engineer x where x is a number provide leveling information and likely a quick estimate of experience. Others might indicate specialization, such as Developer Tools Engineer, DevOps Engineer, or Infrastructure Engineer. But as it is now being used, Founding Engineer doesn’t denote any of: order and time of joining - e.g. there at incorporation, or first 10 engineers, or any engineers joining in 1st year tenure - founding engineer could be tacked on as the org grows as an indicator of tenure and therefore institutional knowledge impact - largely the same as order/time because early engineers probably make fundamental decisions with large impact and likely help steer product direction quite a bit, but could be slightly different if, e.g., an engineer was hired to lead a whole new product Presumably OpenAI isn’t still handing out the title to everyone, so it seems likely to just be correlated with experience. But is any experienced software engineer you actually want to hire going to make a job decision based on the added weight of a fancier title? If anything, when I see this it’s a strong ding against a company because it indicates a culture I don’t want to work in. Level titles are useful externally and make sense to introduce at some point. But I dislike introducing such distinctions too early, especially meaningless ones like “Founding Engineer”, because it introduces the negative effects of classism of ICs or implicit seniority based on title, and anything it might indicate people can usually figure out easily other ways."
