["https://ewencp.org/blog/some-options-for-note-taking-apps-where-you-own-your-data"]
title = "Some Options for Note-taking Apps Where You Own Your Data"
full_description = "Some Options for Note-taking Apps Where You Own Your Data December 1, 2023 note-taking apps I looked around for some options for taking notes today, personal wiki style. For notes specifically, Evernote was, for a long time, the goto service/app. I think it’s probably fallen out of favor, and also seems like it may have just stagnated as a product. Keeping a product focused is good, but not if it’s also kept overly simplistic. I’ve used Notion for work and like the experience and flexibility, but for limited personal use I don’t necessarily want to deal with the limitations of the free tier or cough up money if I need certain features or need to exceed the free tier limits (e.g. 5MB file upload limit). To their credit, Notion does have export, and in markdown for the pages so at least it’s feasible to move with relative ease. But it’s also online-only, which is not ideal. They also have a fairly unique product in that it’s not just notes, not just a wiki. The database functionality, in particular, is interesting. You can also use database entries as tickets, which I find less useful as it’s fairly primitive (at some point it’s trying to and be do too many things). Additionally, the database functionality could be more flexible, e.g. if backed by a real database being able to embed views using simple SQL queries would be nice for technical users. I looked at Joplin, Appflowy, AFFiNE, and Obsidian. I’m probably going to use Joplin for now, but started out testing real usage in Appflowy and it shows promise as well. Here’s are some notes on each of these options: Joplin In their words: Free your notes Joplin is an open source note-taking app. Capture your thoughts and securely access them from any device. This is top of my list because it seems to hit my main use case: notes and personal wiki, data sync to a variety of storage options (Joplin Cloud, Nextcloud, S3, WebDAV, Dropbox, OneDrive), ownership of data, privacy, and a path forward via open source code if the project ends up defunct. I also appreciate a project that makes their guiding principles clear – in this case they are aligned with my needs. The dumb-file-storage model of syncing (rather than a service handling edit changes live) also means offline-mode just works and is in fact the default. The drawback is that you need to handle conflicts manually. Importantly, at least at first glance it doesn’t try to auto-merge even if changes were made in separate, isolated parts of the document, i.e. the type of merge git can handle automatically. It does seem to keep a version history though, so it seems feasible to add this support if it really isn’t there yet. One key difference that I’m not sure I like (and I imagine is probably a significant engineering effort to change) is that notes in a notebook are a flat namespace. Notebooks can have a hierarchy, but notebooks don’t seem to have a main page or content associated with them. So unlike Notion where you have pretty arbitrary hierarchy , Joplin seems to rely much more on a small amount of hierarchy at the notebook level and then assumes tagging and/or search. But tags and search are only useful if you remember exactly what you’re looking for. Sometimes having a page with real content and sub-pages with further details is useful. Other than that, the main Notion feature I find interesting and useful that is missing is the database support. As mentioned, I don’t necessarily care about adapting database entries for customized UI experiences like issue tracking, kanban boards, etc. 99% of the time what I’d want is just a customized view of a DB embedded in a page. I haven’t dug into it much yet, but Joplin does have a plugin system so it might be possible to build this myself without a huge effort. Handling syncing and conflicts would likely be the most difficult part. Finally, while there is a cloud sync product, this seems to have been started and mostly created by an individual, Laurent Cozic. He seems to rely on a sponsor/patronage model, which can be sustainable but raises bus factor questions – no other contributor comes close to number of commits or lines changed and 3 of the top 10 contributors are bots. Appflowy In their words: A secure workspace for your wikis and projects and on GitHub: The Open Source Alternative To Notion AppFlowy is an almost feature-for-feature clone of Notion, including making databases a core value add. It currently comes with some technical baggage that they are slowly digging themselves out of. It looks like it was originally designed for local-only storage and with apps as the primary interface (and importantly not web). The UI is built on Flutter, which as far as I can tell makes it hard to run a web-based version.1 Unlike Notion, early versions don’t seem to focus at all on live collaboration, which isn’t really feasible with local-only storage. That’s fine for my use case though. There is progress on a cloud version, which you can self-host, so that the database and some services are not local. Unfortunately, even carefully following their docs and digging around a bit in code, I couldn’t even get it to run. It also would have required a pretty beefy machine for a relatively simple application and would probably cost more to run than just paying for Notion. I chalk this up to an architecture designed to scale, but for my usage it shouldn’t really need more than a database, the app, and a web server. The company backing it will have it as a SaaS though, so maybe with architectural improvements the cost would be more reasonable, and maybe lower than Notion. In my testing, one other issue I found is that the editor seems fairly buggy/quirky/incomplete. The biggest issue with the editor I ran into was after embedding a few large images into a page. With the images being displayed, the editor seemed to jump around randomly or to the top of the page when I just tried to enter some text. I had to work around it by putting each image in a collapsible block. Looks promising, but clearly a lot of spit and polish needed. AFFiNE In their words: Write, Draw and Plan All at Once One hyper-fused platform for wildly creative minds. A privacy-focussed, local-first, open-source, and ready-to-use alternative for Notion & Miro. Another option that’s largely a feature-for-feature copy of Notion and Miro. Seems more mature than AppFlowy but also tries to do even more. I didn’t look much further once I saw just how kitchen-sink it was. There’s just too much going on and while they claim a clean, intuitive interface, at some point it’s not possible with so many features. Obsidian In their words: Sharpen your thinking. Obsidian is the private and flexible writing app that adapts to the way you think. Obsidian seems pretty popular, free for personal use, and you retain control over your data, but unfortunately is not open source. By default it stores data locally only. Syncing is only provided by Obsidian the company under a subscription model. Actually, that’s not exactly true since Obsidian supports plugins and there seem to be some providing alternative sync mechanisms. Ultimately, this one doesn’t fit my needs because syncing is too important for me – I’ll sometimes move between computers, and for short notes devices, without leaving the house. If that was the only limitation I could probably make it work. But combined that with it being closed source, meaning if the company goes belly up or is sold and alters course I can’t at least maintain a version for myself, including fixing bugs I might encounter, it’s too many tradeoffs. Et al. I’m sure there are a ton more, but these were the options I found that seemed to at least come close to fitting my needs. I wrote up some notes in Appflowy but am probably going to move those few notes over to Joplin and try that for awhile since it has a better story around sync and even with its limitations just generally seems more stable and mature. One upside to this is that the “native” desktop apps are not yet-another-Electron app eating up gobs of memory. ↩︎"
