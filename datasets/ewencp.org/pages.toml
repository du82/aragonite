["https://ewencp.org/blog/products-relying-on-personal-git-repos"]
title = "Products Relying on Personal Git Repos"
full_description = "Products Relying on Personal Git Repos January 14, 2025 security git curl-to-sh docker You know how some security conscious people call out “curl pipe to sh”? Referencing random repos, without pinned hashes for reference is the same. An example of the “curl pipe to sh”: curl -fsSL https://deno.la I just came across another example today in the USB/IP docs for Docker. If it was pinned to a specific hash, assuming it had been reviewed there at least wouldn’t be a security issue, although if I was Docker I would probably reference a copy for reliability – the repo could easily be deleted. But this is worse since it just references the default branch. That’s bad a) for reliability of docs generally, and specifically across versions; and b) since it could be modified to point to any commit. In this case it’s particularly bad because it’s building software on the host system, a Rust project in this case. Rust projects can have build.rs scripts that do basically anything…"
