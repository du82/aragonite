["https://ewencp.org/papers/4d-compression-and-relighting-with-high-resolution-light-transport-matrices"]
title = "4D Compression and Relighting with High-Resolution Light Transport Matrices"
full_description = "4D Compression and Relighting with High-Resolution Light Transport Matrices Proceedings of ACM Symposium on Interactive 3D Graphics, 2007 Ewen Cheslack-Postava, Nolan Goodnight, Ren Ng, Ravi Ramamoorthi, Greg Humphreys paper, video This paper presents a method for efficient compression and relighting with high-resolution, precomputed light transport matrices. We accomplish this using a 4D wavelet transform, transforming the columns of the transport matrix, in addition to the 2D row transform used in previous work. We show that a standard 4D wavelet transform can actually inflate portions of the matrix, because high frequency lights lead to high frequency images that cannot easily be compressed. Therefore, we present an adaptive 4D wavelet transform that terminates at a level that avoids inflation and maximizes sparsity in the matrix data. Finally, we present an algorithm for fast relighting from adaptively compressed transport matrices. Combined with a GPU-based precomputation pipeline, this results in an image and geometry relighting system that performs significantly better than 2D compression techniques, on average 2x-3x better in terms of storage cost and rendering speed for equal quality matrices. Sorry, video doesn't seem to work for your browser. Try downloading the original video."
