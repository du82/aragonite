["https://ewencp.org/blog/product-failingsaws-ebs-backups"]
title = "Product Failings: AWS EBS Backups"
full_description = 'Product Failings: AWS EBS Backups April 26, 2024 TIL AWS backups frugal TIL AWS will suck up your money with EBS backups because they can’t build a competent lifecycle management system to handle backups. I expect money-sucking, but this feels more like they didn’t even do the product basics in order to milk users for revenue. Snapshots are orphaned under a bunch of conditions, without notification unless you read the docs very carefully, and as far as I can tell, there’s no good reason the orphaned snapshots couldn’t be tracked and reported with minimal effort. Instead, I noticed the issue by accident and, while not difficult in my case, had to identify orphaned snapshots and clean them up manually. I recently looked at the backups of EBS volumes I have in my AWS account that I use for 2 small instances, one for personal websites and one Mastodon instance. I was mostly looking to move off of RDS for the Mastodon instance due to the cost – just host Postgres directly rather than use pricey Aurora where minimal serverless option is about half my total monthly bill. It’s not much, but $50/mo is nothing to shake a stick at. I’d be better off buying lotto tickets than throwing it away on garbage AWS charges… But of course backups always have to be a consideration. Thankfully, the Mastodon database I need isn’t that sensitive to potential loss, so I can just self-host locally and backup EBS, which I already do anyway. Everything else is already stored externally. I can backup a full snapshot less frequently to S3 or somewhere outside AWS to have the data more secure. I had thought I had a simple setup by configuring (and maybe doing a couple of additional reconfigurations for cost as I figured out the best balance) by using automated snapshot lifecycles. For both my personal websites and Mastodon instance, this seemed a fine solution. I could configure the window of loss, but both applications have no real durability requirements. For the websites, content is stored elsewhere and only my blog posts really change at this point and only require an easy build/refresh. For Mastodon, worst case I lose track of some posts and have to catch up on fetching from other servers. Who couldn’t stand to miss a few social media posts? But it turns out there are quite a few caveats for snapshots, especially when reconfiguring the policy. I’ve had a small pile of old snapshots that have been around for up to 2 years. These were all labeled as Created for policy: with one of the two policies (personal server and Mastodon). Looking at the policies, there were way more than should be saved by the policy. This is nothing crazy cost-wise, these were 20-50GB snapshots, so <1TB in aggregate max. But why were these even still around? I adjusted the policy, snapshots were tagged in a way that’s identifiable for the policy, and should be possible to clean up. None were manually generated, though if they were presumably they could have also been tagged as such. This stinks of revenue over good product[^2]. If you look at the automated snapshot lifecycles guide, there are no less than 8 cases of you must manually delete – AWS EBS Documentation (as of Apr 25 2024). A couple of these are reasonable safeguards, likely reasonable technical tradeoffs. But many could be automated away, but Amazon has chosen not to do so. Or at least has chosen not to without explanation for why they could cause issues. As an example: If you remove the target tags from a resource that is targeted by a policy, Amazon Data Lifecycle Manager no longer manages existing snapshots in the standard tier and archive tier; you must manually delete them if they are no longer needed. – AWS EBS Documentation If basic tagging is handled properly, tracking resources from previous generations of the policy (which maintains the same ID) shouldn’t be an issue. Should there maybe be a confirmation that, when changing target tags, you want to consider some existing backups out of scope and up for deletion? A safety mechanism to avoid accidental deletion? Sure. (Note that Amazon already also has a "Recycle Bin" functionality.) Should we just orphan resources and rely on a ton of manual labor, including careful verification that should already be done by lifecycle manager, to clean it up? No. None of this is intuitive or obvious without reading a pretty detailed doc – not long, but lots of rules and details. It’s just bad product design, which I guess I’ve come to expect from AWS – they care about volume (products, customers, sales) over quality. I only have experience with AWS and have not looked into GCP or Azure, but I suspect they’re in a similar boat because infrastructure is at a race to the bare bottom. It’s a commodity, and unfortunately that means that without paying a bit of a premium somewhere, the state of affairs will probably remain a shitty user experience.'
