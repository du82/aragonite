["https://exainfra.net/cookie-policy"]
title = "EXA Infrastructure Cookie Policy"
full_description = '''In order to make our website work properly, and to service our visitors with the most relevant products and services to our site visitors, we place small data files called cookies on your device. This policy provides you with information about cookies and how to control them for this website. What is a cookie? A cookie is a small amount of data, often containing a unique identifier, that is sent to the browser of your computer, tablet or mobile phone (here referred to as a "device") by a website and stored on your device's hard drive. Each website can send its own cookies to your browser if your browser settings allow it, and your browser allows the originating website to access cookies it has already sent to you to record online traffic flows and develop records of user activity. Users can set their device to accept all cookies, send them a notification when a cookie is issued, or never to receive cookies. In the latter case, the user will not be able to set some customized features and therefore will not be able to take full advantage of all the features of the website. Each browser is different, so check the "Help" menu of your browser to learn how to change the cookie settings. Cookies help us enhance your experience when using the website, for example they help us to ensure that you are served content in your own language. They also help us understand how people use our site, such as which pages are most popular, so that we can better serve our site users and members. Types of cookies First party cookies First party cookies are set by the website you are visiting and can only be read by that site. Later in this policy we will provide a comprehensive list of all first party cookies set by EXA Infrastructure. Third-party cookies Third-party cookies are set by a company other than the owner of the website you are visiting for purposes such as collecting information on user behaviour, demographics, or personalized marketing. When using our website, you may encounter embedded content, such as Vimeo or YouTube videos, or you may be directed to other websites for such activities as event and webinar registrations, surveys, or for job applications. These websites and embedded content may use their own cookies. We do not have control over the placement of cookies by other websites, even if you are directed to them from our website. Session cookies Session cookies are only temporarily stored during a browsing session and are deleted by the user's device when the browser is closed. Persistent cookies This type of cookie is saved on the computer for a fixed period and is not deleted when the browser is closed. Persistent cookies are used when it is necessary to know who you are for more than one browsing session. For example, we use this type of cookie to store your settings, so that they are stored for the next visit. How does EXA Infrastructure use cookies? The cookies set by the EXA Infrastructure websites (first party cookies) are used for a variety of reasons which we’ve categorised as essential and analytics. The information provided by cookies can help us analyse the profile of our visitors and offer you a better use of the site. For example, if you are contacting us through the online contact form, we can see how you went through the site and what pages you visited before making the contact. We use two categories of cookies as follows: Essential cookies: ensure the website works properly for our visitors plus safeguards the security of the site and by extension our visitors Analytics cookies: non-personalised, used for analysis, helping us to understand how visitors use the site and thereby how we can improve it We use Google Tag Manager, a script (tool) that facilitates the installation of non-essential analytics Cookies (see below) and marketing cookies. It is not a cookie, it is essential to the proper functioning our site, and it does not have an expiration date. Below you can see the list of cookies set by the EXA Infrastructure websites (first party cookies), the function for which each one is used, along with the time period that each cookie will remain active for. Choose Your Cookies. We use cookies on this site to optimise functionality and give you the best possible experience. Your consent applies to the following domains: www.exainfra.net/ Cookie declaration last updated on 02/07/21 Essential (5) These cookies ensure the website works properly and are essential for enabling user movement around our website; providing access to regional and language specific content, in addition to maintaining the security of our site to best protect our visitors. These cookies do not gather information about you that could be used for marketing purposes and they do not remember where you have been on the internet. This category contains cookies that cannot be disabled. Name Provider Purpose Expiry Type __RequestVerificationToken EXA Infrastructure Helps prevent Cross-Site Request Forgery (CSRF) attacks. Session HTTP Cookie _gac Google Contains campaign related information for the user. If you have linked your Google Analytics and Google Ads accounts, Google Ads website conversion tags will read this cookie unless you opt-out 3 months HTTP Cookie AI_buffer Microsoft Used in context with the "AI_sentBuffer" in order to limit the number of data-server-updates (Azure). This synergy also allows the website to detect any duplicate data-server-updates. Session HTML Local Storage AI_sentBuffer Microsoft Used in context with the "AI_buffer" in order to limit the number of data-server-updates (Azure). This synergy also allows the website to detect any duplicate data-server-updates. Session HTML Local Storage CookieConsent Civicuk Stores the user's cookie consent state for the current domain 1 year HTTP Cookie Analytics (5) These are anonymous, non-personalised cookies which collect information about how visitors use our websites. They collect anonymised information in aggregate, to give us a high-level overview of the behavioural trends and preferences users exhibit on our websites. Analysis of this data enables us to create better quality content for our users, to enhance user experience, and to develop improved user-interfaces. Name Provider Purpose Expiry Type _ga_# Google Tag Manager Used by Google Analytics to collect data on the number of times a user has visited the website as well as dates for the first and most recent visit. 2 years HTTP Cookie _gali Google Used by Google Analytics to determine which link a user has clicked on Session HTTP Cookie _gat Google Used by Google Analytics to throttle request rate 1 day HTTP Cookie _gid Google Registers a unique ID that is used to generate statistical data on how the visitor uses the website. 1 day HTTP Cookie How to check and delete cookies? Many of the cookies used on our website can be enabled or disabled by disabling the cookies through your browser. To disable cookies through your browser, follow the instructions usually located within the “Help,” “Tools” or “Edit” menus in your browser. Please note that disabling a cookie or category of cookies does not delete the cookie from your browser unless manually completed through your browser function. Alternatively, you can visit the site https://www.aboutcookies.org/ which contains all the information on how to do this on a wide variety of browsers. You can also find numerous details on how to delete cookies from your computer and other general information about cookies. For information on how to do this on the browser of your mobile phone or tablet, refer to the manual of the device in question. Remember that cookie restriction may affect the functionality of the EXA Infrastructure website. Collection of your data from our analytics cookies can be deleted. If cookies are deleted, the information collected prior to the preference change may still be used, however, we will stop using the disabled cookie to collect any further information from your user experience. For full information on how we process personal data please read EXA Infrastructure's Privacy Policy.'''
