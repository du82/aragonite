full_description = "Press Releases Please see below for news from EXA Infrastructure. We also welcome questions and requests for comment from the media. Press Releases Telehouse enables EXA Infrastructure to expand London services 24 February 2025 Global data centre service provider Telehouse International Corporation of Europe has announced that EXA Infrastructure, the critical digital infrastructure platform provider, has expanded its London metro offering by installing two fully diverse, high fibre count cables in Telehouse South – Telehouse’s newest data centre located in London Docklands. Learn More EXA Infrastructure Partners with IOEMA to Strengthen Northern Europe’s Connectivity 18 February 2025 EXA Infrastructure, the critical digital infrastructure platform provider, has been chosen by IOEMA as the landing partner for its new submarine cable in Leiston, UK. From the cable landing station EXA will also provide critical backhaul connectivity to major data centers, including London Telehouse and Equinix. Learn More Digital Realty and EXA Infrastructure Partner to Advance Crete as a Major Connectivity Hub 03 February 2025 Digital Realty (NYSE: DLR), the leading global provider of cloud- and carrier-neutral data center, colocation, and interconnection solutions, today announced the activation of a point of presence (PoP) in collaboration with EXA Infrastructure (EXA) to bring enhanced connectivity solutions to Crete. The partnership will leverage EXA’s expansive network capabilities to strengthen Crete’s role as a critical carrier-neutral interconnection point for the Mediterranean region. Learn More Teraswitch upgrades global network with 400GE connectivity from EXA Infrastructure 30 January 2025 Strategic upgrade enhances bandwidth, reduces costs, and positions Teraswitch to scale rapidly in a competitive market Learn More EXA Infrastructure Enters into Agreement to Acquire Aqua Comms 17 January 2025 EXA Infrastructure has announced today that it has signed binding agreements to acquire Aqua Comms – a specialist operator of Transatlantic and intra-European subsea infrastructure. Learn More Strategic agreement between SOCAR Fiber and EXA Infrastructure is now signed 09 January 2025 This new agreement will support SOCAR Fiber's expansion targets and strengthen the regional communication infrastructure with the fiber network provided by EXA Infrastructure over its global access networks. Learn More EXA Infrastructure launches EXA Financial Network, the largest Infrastructure platform for Financial Exchanges across North America and Europe. 14 November 2024 The largest owned infrastructure platform of its kind will connect 25 exchanges across 11 countries, representing over 60% of global market capitalization. Learn More EXA Infrastructure Expands Nordic Reach with Extension to Finland 16 October 2024 EXA Infrastructure footprint will connect Helsinki to Stockholm, enhancing the company’s coverage in the Nordics and extending its direct presence to 37 countries across Europe and North America. Learn More Media Contact Babel PR +44 (0)20 7434 5550 exa@babelpr.com Media Contact EXA Infrastructure - Cristina Crucini cristina.crucini@exainfra.net Archive 2021 (3) September (1) October (1) November (1) 2022 (22) January (2) March (4) April (3) May (5) September (1) October (3) November (1) December (3) 2023 (25) February (1) March (4) May (4) June (2) July (2) August (1) September (2) October (3) November (4) December (2) 2024 (17) January (2) February (3) March (1) April (1) May (3) July (1) September (1) October (4) November (1) 2025 (6) January (3) February (3) Connect with us Previous12345678...Next"
