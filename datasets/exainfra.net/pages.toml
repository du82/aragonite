title = "EXA in the press - news coverage - EXA Infrastructure"
description = "What the media writes about EXA Infrastructure"
full_description = "News Coverage News Coverage Telehouse enables EXA Infrastructure to expand London services 25 February 2025 Telehouse International Corporation has announced that EXA Infrastructure, the critical digital infrastructure platform provider, has expanded its London metro offering by installing two fully diverse, high fibre count cables in Telehouse South. Learn More EXA Infrastructure picked for UK submarine cable landing 18 February 2025 IOEMA is a 1,600 km repeated high-capacity submarine fibre optic network linking the UK, Netherlands, Germany, Denmark, and Norway. Learn More EXA lands IOEMA 18 February 2025 EXA Infrastructure has been chosen by Ioema as the landing partner for its new subsea cable in Leiston, UK. From the cable landing station EXA will also provide critical backhaul connectivity to major data centers, including London Telehouse and Equinix. Learn More Exa Infrastructure and Digital Realty launch new PoP in Crete 03 February 2025 According to the company, the move will enhance connectivity solutions across the Island and act as a key carrier-neutral interconnection hub for the Mediterranean region. Learn More Teraswitch upgrades global net with EXA 400GE connectivity 03 February 2025 Transatlantic connectivity provider upgrades enterprise network with 400GE connectivity, positioning the company for global network expansion through diverse, high-capacity connectivity across Europe and the Atlantic Learn More Digital Realty and EXA Infrastructure partner to advance Crete as a major connectivity hub 03 February 2025 Digital Realty has announced the activation of a point of presence (PoP) in collaboration with EXA Infrastructure (EXA) to bring enhanced connectivity solutions to Crete. Learn More EXA, Digital Realty collaborate to bridge Mediterranean connectivity gap 03 February 2025 The parties aim to establish Crete and Greece as a major connectivity hub, transforming the Mediterranean's digital landscape and positioning the region as a crucial gateway for global data traffic. Learn More Teraswitch taps EXA Infrastructure for 400GE upgrade 31 January 2025 EXA Infrastructure has partnered with Teraswitch to provide 400GE connectivity and position it for global network expansion. Teraswitch recently deployed its global network, featuring 100GE waves to connect cities across the US and Europe. Learn More Connect with us Media Contact Babel PR +44 (0)20 7434 5550 exa@babelpr.com Media Contact Cristina Crucini, EXA Infrastructure cristina.crucini@exainfra.net Previous12345678...27Next"
