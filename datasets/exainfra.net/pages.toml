full_description = 'Last reviewed & updated: October 30, 2021 STANDARD TERMS AND CONDITIONS Markups to these Standard Terms and Conditions shall have no force or effect. 1. Provision of the Service(s). EXA Infrastructure will provide Client, as each is identified on the Service Order, with the use of the EXA services as are described in the Service Order (collectively, the "Service"), which Service Order has been issued and agreed upon pursuant to these standard terms and conditions ("Standard Terms"). EXA Infrastructure and Client may be referred to in these Standard Terms individually as a “Party” and/or collectively as the “Parties”. Prior to the Start of Service Date (defined below), EXA Infrastructure reserves the right to reject this Service Order in its commercially reasonable discretion. EXA Infrastructure’s provision of the Services is subject to the continuing availability of capacity and facilities and any end- of-life discontinuance. 2. Service Term and Commitments. Subject to Section 8 below, the Service shall be provided for the term specified in the Service Order (“Initial Service Term”). Unless one of the Parties provides written notice of termination to the other Party on or before ninety (90) days prior to the expiration of the Service Term of this Service Order, the term of this Service Order shall automatically continue in full force on an annual basis (each an “Renewal Service Term”), until a Party provides written notice of termination of this Service Order in accordance with this Section or Section 8 below. The “Service Term” shall be defined as the Initial Service Term and Renewal Service Term, collectively. 3. Service Activation. After EXA Infrastructure has determined that a delivered Service conforms to the relevant Service specifications, EXA Infrastructure will notify Client (in writing or electronically) that the Service is activated and is available for use (“Start of Service Letter”). EXA Infrastructure may incrementally deliver individual Services or locations specified in this Service Order, when ready, which may result in different Start of Service Dates for each incrementally delivered Service or location. Client shall have two (2) business days to notify EXA Infrastructure that it is rejecting the Service as a result of its failure to meet the applicable Service specifications. The “Start of Service Date” shall be the earlier of (i) the date that Client begins using the Service for any purpose other than testing or (ii) the date of the Start of Service Letter. The Client’s failure to test or delay in testing the Service or failure to utilize or delay in utilizing the Service on or after the Start of Service Letter date shall not prevent EXA Infrastructure from billing the Client for the Service. If the Start of Service Date is delayed as a result of (i) Client’s failure to meet its responsibilities under these Standard Terms, applicable Service Schedule, the Comment section of this Service Order or other relevant contract document, (ii) Client’s failure to have ready the necessary interconnection facilities and equipment for EXA Infrastructure to deliver a Service or for Client to test and turnup a delivered Service, (iii) any other action or inaction of Client which prevents EXA Infrastructure from installing or delivering Service, EXA Infrastructure, may, in its sole discretion deem the Start of Service Date to occur the date that EXA Infrastructure is ready to complete delivery of the related Service. 4. Billing; Taxes; Charges. EXA Infrastructure charges Client for each Service commencing on the Start of Service Date. EXA may invoice Client for a non-recurring rate (“NRR”) charge for Services prior to the Start of Service Date. EXA Infrastructure shall invoice Client via electronic delivery, and Client shall pay in advance on a monthly basis for all Services, the charges at the monthly recurring rate (“MRRs”) set out in this Service Order, any unpaid NRR charge, and all applicable excis