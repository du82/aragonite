ed by EXA Infrastructure because of any non-payment or other breach of these Standard Terms by Client, no Service Outage (defined below) shall be deemed to have occurred during the suspension. By Client. Client may cancel or terminate the affected Service(s) for Cause that are materially breached, without any liability at any time upon: (1) any material breach by EXA Infrastructure of any provision of these Standard Terms, the Comments section of this Service Order, or any other applicable contract document which breach is not cured within thirty (30) days after receiving written notice from Client; (2) any insolvency, bankruptcy, assignment for the benefit of creditors, appointment of a trustee or receiver or similar event with respect to EXA Infrastructure; or (3) any governmental prohibition or required alteration of the Service provided under these Standard Terms necessitating such termination. If Client terminates for any other reason, it must provide 30 days written notice, subject to paying early termination charges in subsection 8.C. If (1) Client cancels or terminates this Service Order under these Standard Terms or any Service prior to the end of the Service Term without Cause (as defined above in subsection 8.B) or for convenience; or (2) EXA Infrastructure terminates these Standard Terms and/or this Service Order(s)/Service(s) prior to the end of the Service Term pursuant to subsections 8.A(1), (2) or (3), then in addition to any other rights or remedies available to EXA Infrastructure under these Standard Terms, at law, or in equity, Client shall pay EXA Infrastructure an early termination charge (as liquidated damages and not as a penalty) equal to: (1) all unpaid, waived, discounted and/or amortized NRR charges, if specified in this Service Order(s); plus (2) all MRR charges specified in the terminated Service Order(s) for the all remaining months of the unexpired balance of the Service Term(s); plus (3) to the extent greater than the amount in (2) above, the aggregate fees, charges, expenses, and taxes payable by EXA Infrastructure (including, but not limited to, liquidated damages, and disconnection, early cancellation or termination charges payable to third parties) in connection with the cancelled or terminated Service(s). Upon expiration or termination, neither Party shall owe the other any further duties, obligations, or consideration; provided, however, that expiration or termination of these Standard Terms shall not affect the rights or obligations of either Party that have arisen before the date of expiration or termination, nor shall Client or EXA Infrastructure be relieved of any liabilities arising prior to such termination. EXA Infrastructure will process any request for disconnection or early termination by Client within thirty (30) days or less, subject to Client’s payment of early termination liability. Client must pay for Services until such disconnection actually occurs if any delay in disconnection is due to the actions of a third-party provider. 9. Service Performance; Maintenance. Services will be activated, provided and provisioned in accordance with the delivery, availability, reporting, response time, restoration and maintenance objectives of the applicable Service Schedule(s). In the event of a failure to perform in accordance with objectives of the applicable Service Schedule(s) or interruption in the Service (“Service Outage”), Client shall be entitled to a credit and/or cancellation right pursuant to the applicable service level agreements and Service Schedule(s). Credit and cancellation allowances shall be measured only after EXA Infrastructure’s receipt of written notice of a Service Outage from Client, and will be provided only if Client provides written notice with respect to obtaining such credit and/or cancellation right within thirty (30) days of the Service Outage occurring. Under no circumstance shall a Service Outage be deemed a breach under these Standard Terms, any Service Schedule or this Service Order. Service availability, and Service Outages, are subject to the following exclusions: a Service Outage will be deemed to have occurred only if the Service becomes unusable to Client as a result of the inability of EXA Infrastructure’s facilities, equipment or personnel to provide the Service, and only when the Service Outage is not the result of: (1) fault or negligence of Client or its contractors, agents, representatives, or users; (2) the failure of interconnecting facilities or other equipment not part of EXA Infrastructure’s Service or facilities or not within EXA Infrastructure’s reasonable control; (3) any planned interruption, emergency maintenance or routine maintenance; or (4) other circumstances beyond the reasonable control of EXA Infrastructure. EXA Infrastructure shall use commercially reasonable efforts to perform routine maintenance at mutually agreeable times. 10. Force Majeure. Neither Party will be in default or otherwise liable for any Service Outage, del'
