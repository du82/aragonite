["https://examcookie.dk/elevinformation"]
title = "FAQ for ExamCookie - Læs de mest hyppige spørgsmål her"
description = "Vi har samlet de mest hyppige spørgsmål vedr. ExamCookie. Læs og få svar her på siden."
full_description = 'Ved login i ExamCookie tillader du "Vilkår og betingelser" Obs. Du kan kun logge ind på dagen for din prøve Du kan se dine data online ved at logge ind med dit MitID,, UNI-Login eller Lokalt login klik på "Elevdata" eller brug dette link. For at bruge ExamCookie skal du downloade programmet inden din prøve starter. Det kan du gøre her. Når programmet er startet, skal du logge ind med dit MitID, UNI-Login, Lokalt login eller det manuel-login du har fået udleveret. Efter prøven afslutter programmet sig selv, og du skal ikke foretage dig mere. Programmet sletter sig selv automatisk medmindre du har gemt det i en skrivebeskyttet mappe eller ikke har haft internetadgang da din prøve var slut. ExamCookie afslutter sig selv når din prøve er færdig. Programmet kan kun monitorere og afsende data i den tid der er afsat til din prøve. Derfor kan du ikke monitoreres efter prøven er afsluttet. Den indsamlede data fungerer som dokumentation for at din prøve er afholdt uden brug af ikke-tilladte hjælpemidler. ExamCookie beskytter derfor dig som elev i ikke at blive mistænkt for snyd. Derudover kan du også genskabe en eventuelt mistet opgave på prøvedagen, skulle din computer crashe eller har du ved en fejl afleveret en forkert fil. Kontakt i dette tilfælde en prøveansvarlig, som viser hvordan din opgave kan genskabes. Din computer skal anvende Windows eller Mac som styresystem. For Windows computere er kravet at de har installeret .Net Framework 4.5. Det er standard i de fleste Windows versioner, herunder Windows 7, Windows 8, Windows 10 og Windows 11. For Mac er kravet at dit styresystem er opdateret til OS version 11 "Big Sur" eller nyere. Er dit operativsystem ældre, skal du kontakte skolens IT-medarbejder som kan hjælpe dig med at opdatere din computer. Vores software er godkendt af Apple, men da du ikke downloader ExamCookie i App Store, skal din gatekeeper have tilladt “Mac App Store og kendte udviklere”. Dette har langt de fleste computere allerede aktiveret, men har din ikke dette, skal du ændre dette ved at åbne: Systemindstillinger > Sikkerhed & anonymitet. Der vil du nederst kunne vælge “Tillad apps hentet fra kendte udviklere“.'
year_published = 2025
clearnet = "https://examcookie.dk/elevinformation"
