["https://examcookie.dk/institutionsinformation"]
title = "Institutionsinformation - ExamCookie"
description = "Få mere information om ExamCookie og hvordan programmet kan hjælpe din uddannelsesinstitution med at imødegå eksamenssnyd."
full_description = "Vil du have mere information om ExamCookie eller ønsker du en uforpligtende gennemgang af programmet er du altid velkommen til at kontakte os ExamCookie anvendes i dag af over 100.000+ elever på 200+ uddannelsesinstitutioner. Blandt vores kunder er der institutioner fra alle uddannelsestyper og i alle størrelser. Følgende institutionstyper anvender i dag ExamCookie på deres institution: STX, HHX, HTX, HF, VUC, EUX, Professionshøjskoler, Efterskoler, Privatskoler- samt kommunale Grundskoler med 8, 9 og 10 klassetrin. Følgende er et mindre udsnit af de institutioner der anvender ExamCookie. ExamCookie er et simpelt program der monitorerer elevers computeraktivitet under prøver for at sikre at prøven foregår efter gældende regler. Programmet sikrer at elever ikke kan anvende ikke-tilladte hjælpemidler under en prøve. ExamCookie registrerer al aktivitet på computeren, dvs. aktive URL-adresser, processorer, clipboard, samt skærmbilleder ved større skærmændringer. Skolens eksamensansvarlige har derfor fuldt overblik over den aktivitet der foregår på elevernes computere under prøven. Efter prøven indikerer ExamCookie hvilke elever der har anvendt ikke-tilladte hjælpemidler som Chatbots, kommunikation med omverdenen, oversættelsesprogrammer, fildeling eller andet. Derved er der en klar dokumentation til at afklare om eleven har snydt. På samme vis sikrer dette også de elever der mistænkes for snyd, da ExamCookie kan dokumentere og afkræfte denne mistanke. Med ExamCookie får uddannelsesinstitutioner et elektronisk værktøj til at forebygge, opdage samt dokumentere eksamenssnyd. STUK under Undervisningsministeriet, udarbejdede i 2019 en bred og detaljeret undersøgelse om snyd ved prøver på grundskoler og gymnasiale uddannelser. Af de adspurgte elever svarer 13,1% af grundskoleeleverne og 10,5% af gymnasieeleverne, at de begik et regelbrud til de skriftlige og mundtlige prøver. Rapporten konkluderer modsat at det kun er henholdsvist 0,02 og 0,13% af eleverne der bortvises ved prøverne."
year_published = 2025
clearnet = "https://examcookie.dk/institutionsinformation"
tags = ["examcookie?", "footer", "hvad", "hvor", "information", "institutioner", "kontakt", "problem", "referencer", "snyd?"]
language = "en"
