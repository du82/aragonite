title = "Optimal Protein Intake Guide & Calculator - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Table of ContentsReferencesTable of Contents1Protein Intake Calculator2How much protein do you need per day?2.1💡 Tip: Calculating your caloric needs3Optimal daily protein intake for healthy, sedentary adults4Optimal daily protein intake for athletes5Optimal daily protein intake for muscle gain6Optimal daily protein intake for fat loss7Optimal daily protein intake for older adults8Optimal daily protein intake for pregnant women9Optimal daily protein intake for lactating women10Optimal daily protein intake for infants and children10.1Optimal daily protein intake for infants10.2Optimal daily protein intake for toddlers10.3Optimal daily protein intake for children11Optimal daily protein intake for vegans11.1Protein quality11.2The supposed inferiority of plant-based proteins11.3Acute MPS studies11.4Older adults11.5Longer-term studies11.6Strategies to improve the anabolic properties of plant-based protein sources12How much protein per meal?13How much protein after exercise?Protein Intake CalculatorUnit of weight:Pound (lb)Kilogram (kg)Are you pregnant/lactating?Are you pregnant/lactating?NoI am pregnant/lactating Weight (in kg): You are currently:Weight ConditionI am at a healthy weightI am overweight/obese What is your goal?GoalMaintenanceMuscle gainFat lossYour optimal protein intake:at least —grams/day.How much protein do you need per day? As with most things in nutrition, the answer can be rather complex. Your ideal intake of calories and protein depends on your health, body composition, main goal, and the type, intensity, duration, and frequency of your physical activity. And even taking all this into account, you’ll end up with a starting number, which you’ll need to adjust through self-experimentation. Nonetheless, as a basic starting point, generally healthy people (i.e., those without a condition that may necessitate limiting protein intake) should aim for a protein intake of at least 1.2 grams per kilogram of body weight per day (g/kg/d), regardless of their body composition and physical activity levels. Women who are pregnant or lactating should aim for a protein intake of at least 1.7 g/kg/d. Daily protein requirements should be based on body weight, not caloric intake, and are expressed in grams, either per kilogram of body weight (g/kg) or per pound of body weight (g/lb). Ranges in the table below reflect known individual variances. Optimal daily protein intake for adults based on body composition goal (g/kg)Healthy body weightOverweight/obeseMaintenance≥1.2≥1.2Muscle gain1.6–2.21.2–1.6*Fat loss1.6–2.41.2–2.4* * The upper end of the range should be consumed to maximize increases in muscle mass, based on limited evidence Optimal daily protein intake for healthy, sedentary adults For adults, the US Recommended Dietary Allowance (RDA) for protein is 0.8 g/kg/d.[2] However, a more appropriate statistical analysis of the data used to establish the RDA suggests this number should be higher: 1.0 g/kg/d.[3] Note that, contrary to popular belief, the RDA doesn’t represent an ideal intake. Instead, it represents the minimum intake needed to prevent malnutrition. Unfortunately, the RDA for protein was determined from nitrogen balance studies, which require that people eat experimental diets for weeks before measurements are taken. This provides ample time for the body to adapt to low protein intakes by down-regulating processes that are not necessary for survival but are necessary for optimal health, such as protein turnover and immune function.[4] An alternative method for determining protein requirements, called the Indicator Amino Acid Oxidation (IAAO) technique, overcomes many of the shortcomings of nitrogen balance studies.[5] Notably, it allows for the assessment of protein requirements within 24 hours, thereby not leaving the body enough time to adapt. Studies using the IAAO method have suggested that about 1.2 g/kg/d is a more appropriate RDA for healthy young men,[6] older men,[7] and older women.[8][9] Further evidence that the current RDA for protein is not sufficient comes from a randomized controlled trial that confined healthy, sedentary adults to a metabolic ward for 8 weeks.[10] The participants were assigned to one of three hypercaloric diets, all of which provided 40% more calories than needed to maintain body weight, but which differed in protein content: 0.7, 1.8, or 3.0 g/kg/d. Despite the fact that a hypercaloric diet has been shown to increase lean body mass,[11] lean body mass actually slightly decreased in the low-protein diet group, while lean body mass increased in the two higher-protein diet groups. Therefore, we recommended that healthy, sedentary adults without any particular body composition goals aim for a daily protein intake of at least 1.2 g/kg/d to support overall health. Of note, only a few studies have looked at very high-protein diets (≥2.8 g/kg/d). While these studies demonstrated that very high-protein diets are safe in healthy individuals,[12][13][14][15] further studies with longer intervention durations are needed. Optimal daily protein intake for athletes The American College of Sports Medicine, the Academy of Nutrition and Dietetics, and the Dietitians of Canada recommend 1.2–2.0 g/kg/d to optimize recovery from training and to promote the growth and maintenance of lean mass when caloric intake is sufficient.[16] This recommendation is similar to that of the International Society of Sports Nutrition (ISSN), which is 1.4–2.0 g/kg.[17] However, accumulating evidence suggests that athletes should aim for the higher end of the above ranges. In fact, in certain contexts, it might even be best to go beyond these ranges. It is important for athletes, especially those who compete in sports involving weight divisions, to optimize their ratio of strength, power, or endurance to body weight in order to gain a performance advantage.[18] In the case of strength and power athletes, this generally entails maximizing the amount of muscle mass on their frame, as a larger muscle has greater force-generating capacity.[19][20] In the case of endurance athletes, this typically means reducing fat mass without sacrificing muscle mass in the process.[21] A 2018 meta-analysis reported that a protein intake averaging 1.6 g/kg/d maximized resistance-exercise-induced gains in lean body mass;[22] importantly, the upper end of the 95% confidence interval was 2.2 g/kg/d, which suggests that some individuals may benefit from consuming more than 1.6 g/kg/d. In addition, athletes may benefit from protein intakes as high as 2.4–2.7 g/kg/d during periods of caloric restriction.[23][24] Other evidence from IAAO studies also suggests that protein intakes on the higher end of, or beyond, current recommendations may be advantageous. On training days, active women required 1.4–1.7 g/kg/d.[25][26] In comparison, male endurance athletes required 2.1–2.7 g/kg/d the day after a training session;[27] male amateur bodybuilders required 1.7–2.2 g/kg/d two days after a training session;[28] and resistance-trained men required 1.6–2.4 g/kg/d on a training day.[29] Based on the available evidence, whether an athlete is pursuing weight gain to maximize the accretion of muscle mass, or they’re after high-quality weight loss (i.e., the loss of fat mass while preserving or even increasing muscle mass), a protein intake of at least 1.6 g/kg/d appears to be best,[18] with the potential for further benefit up to approximately 2.7 g/kg/d,[23] depending on the athlete’s body composition goal and the phase of training. Optimal daily protein intake for muscle gain Resistance exercise is, of course, required for muscle gain; you can’t just feed your muscles what they need to grow, you also need to give them a reason to grow.[30] According to the most recent evidence, individuals interested in muscle gain should aim for a protein intake of 1.6–2.2 g/kg/d.[22][31][32]. Don't expect too much, though. The additional muscle gains from consuming more protein are relatively small: A 2018 meta-analysis of randomized controlled trials that were 13 weeks long, on average, reported that higher protein intakes enhanced muscle gain by about 0.3 kg.[22] A 2020 meta-analysis of randomized controlled trials that were 20 weeks long, on average, reported that higher protein intakes enhanced muscle gain by about 0.48 kg.[31] 2022 meta-analysis of randomized controlled trials, most of which were 8–12 weeks long, reported that higher protein intakes enhanced muscle gain by about 0.6 kg.[32] While it’s true that higher protein intakes enhance resistance exercise-induced muscle gain, more is not necessarily better. Some evidence suggests a threshold value of around 1.6 g/kg/d, on average; that is, increasing protein intake beyond this point does not promote further muscle gain in most people (see below table).[32][22] Optimal daily protein intake for muscle gain Adapted from Morton, RW et al., 2018, Br Jour Sports Med A common question is whether the protein intake recommendation of 1.6–2.2 g/kg/d also applies to people with obesity who are interested in muscle gain, as calculated protein intake will be relatively high and make up a larger proportion of daily energy intake in this population. The short answer is that there currently isn’t any direct evidence to indicate that the optimal daily protein intake for muscle gain differs in people with obesity. There’s also good mechanistic reason to think that the optimal daily protein intake for muscle gain does not differ between lean individuals and those with obesity.[36] Nonetheless, for practical purposes such as being able to consume a more flexible diet, it may be best to aim for the lower end of the recommended range (i.e., 1.6 g/kg/d). Lastly, it should not go unmentioned that while consuming more protein than 1.6–2.2 g/kg/d may not enhance muscle gain in people consuming an energy-sufficient or hypercaloric diet, it may help to minimize fat gain. Studies investigating changes in body composition in response to overfeeding suggest that protein intakes of 2.4 to 4.4 g/kg/d may help minimize body fat gain.[37] Optimal daily protein intake for fat loss While it’s possible to lose fat on a eucaloric diet (a diet in which calorie intake equals calories expended) by shifting the dietary macronutrient ratio in favor of more protein,[35] in order to maximize fat loss, a hypocaloric diet (a diet in which fewer calories are consumed than expended) must be consumed. The downside to hypocaloric diets is that, although they promote fat loss, they can also lead to a significant loss of lean body mass (15% or more of total weight loss),[38] especially in the absence of resistance exercise. Furthermore, the more severe the caloric deficit, the greater the loss of lean body mass tends to be,[39] and the leaner the individual, the more susceptible they are to the loss of lean body mass.[24] For these reasons, it is recommended that athletes wishing to lose fat and preserve lean body mass use a conservative approach and lose weight gradually at a rate of about 0.5%–1.0% per week.[39] During caloric restriction, rates of muscle protein synthesis (MPS) are lower in both the fasted and fed states, resulting in a net negative protein balance.[40] Consuming a high-protein diet helps preserve lean mass during caloric restriction by stimulating MPS and promoting a positive or neutral net protein balance. In one study, resistance-trained men consumed a hypocaloric diet which provided 40% less energy than their bodies needed, with either 2.3 or 1.0 g/kg/d of protein. Compared to the low-protein group, the high-protein group had less lean body mass loss (−0.3 vs. −1.6 kg) and similar fat loss (−1.4 kg).[41] In other studies that had resistance-trained participants or athletes consume hypocaloric diets, a protein intake of 1.6–2.0 g/kg/d was found to preserve or even increase lean body mass.[42][43] Overall, the current evidence indicates that athletes and lean individuals should aim for a protein intake of 1.6–2.4 g/kg/d to maximize fat loss and minimize lean body mass loss, skewing toward the higher end of this range. Intakes above 2.4 g/kg/d don’t appear to have an additional lean-body-mass-sparing effect, however.[24] Individuals with overweight or obesity often have the goal of losing fat, given that weight loss is associated with an improvement in health outcomes, and high-protein diets are extremely effective for accomplishing this goal for a variety of reasons. For one, high-protein diets help to prevent declines in resting energy expenditure (REE) during weight loss, namely through an increased thermic effect of food and attenuated loss of lean body mass.[44] They also promote greater satiety (“fullness”) and less hunger when compared to lower-protein diets.[45][46] Two studies demonstrated that the consumption of a high-protein diet (1.6 g/kg/d) during caloric restriction resulted in a superior ratio of fat mass loss to lean body mass loss compared to a low-protein diet (0.8 g/kg/d).[47][48] Furthermore, meta-analyses have concluded that in people with overweight or obesity, higher-protein diets are superior for weight loss, fat loss, lean body mass maintenance, and improving cardiometabolic risk factors (i.e., triglycerides, blood pressure).[49][50][51] In adults with overweight or obesity, a diet containing 1.07–1.6 g/kg/d (1.25 g/kg/d, on average) of protein led to greater fat loss and lean mass preservation than an energy-matched low-protein diet containing 0.55–0.88 g/kg/day.[52] Adapted from Wycherley, TP et al., 2012, Am J Clin Nutr Thus, for adults with overweight/obesity who are eating a hypocaloric diet and wishing to lose fat, a protein intake between 1.2–1.6 g/kg/d (0.55–0.73 g/lb) seems to be optimal, at least based on the overall body of evidence, and a continued protein intake within this range will also support long-term weight-loss maintenance.[44] There is a lack of research examining protein intakes above this range in people with overweight or obesity, which limits confidence in the idea that higher protein intakes would be even more beneficial in this population. However, there is one study that found that a protein intake of 2.4 g/kg/d markedly improved body composition during a severe caloric deficit, compared to a protein intake of 1.2 g/kg/d.[53] It therefore seems reasonable to suggest that a protein intake of 2.4 g/kg/d may help individuals with overweight or obesity to optimize body composition during caloric restriction. Thus, individuals who are interested in losing fat while also maximizing muscle gain in the context of a hypocaloric diet may want to aim for a daily protein intake between 1.6–2.4 g/kg/day. It should be noted that there may be practical constraints to achieving this intake in individuals with a higher body weight: someone weighing 100 kg would need to consume up to 240 grams of protein per day! Optimal daily protein intake for older adults Sarcopenia is a progressive and g"
