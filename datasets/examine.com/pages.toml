full_description = "Nobody’s 100% unbiased, because we’re all human and come at things with our own experiences and knowledge. But at Examine, we try our darndest to get close to the “no bias” asymptote. The first step is contractual. Examine contractually mandates that all staff avoid any and all connections to supplement, food, or health companies. Here’s just one portion of the legalese directly from our researcher contract, condensed down for readability: We take this very seriously, and have no researchers with any investments, partnerships, contracts, or any other relationship with health-related companies that might bias their research for us. Examine staff are also prohibited from receiving gifts or even free samples from health-related companies. Note that Examine doesn’t hire freelance writers like other big health websites do. Most of our staff are full-time researchers working exclusively for Examine. We pay everyone fairly and create a low stress working environment to encourage researchers to stay for many, many years. By having a close-knit, long-tenured team, we avoid having to worry about temporary writers who may have hidden biases which otherwise take months to emerge. Ever since childhood, I’ve been that slightly annoying guy who won’t let inaccurate statements go. But at Examine, I feel comfortable knowing that I’m surrounded with many other “Well, actually” people! We point out each other’s inaccuracies whenever they pop up, without hesitation. Here are just a couple real-life examples from our internal conversations on Slack: Person 1: Posts an article on drug composition (racemic mixtures) they thought was cool and interesting. Person 2: “Well, actually ... is the article you posted accurate or misleading? This meta-analysis says that 20 mg of nexium outperformed 40 mg of prilosec for symptom relief.” Person 2: “I've read some compelling explanations for why that meta-regression might have inadequate data points and could change with further research.”"
