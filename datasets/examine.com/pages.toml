full_description = "A continuing education credit (CEC), continuing education unit (CEU), or a continuing professional education unit (CPEU) is a measure used in continuing education programs to assist professionals in maintaining their license in their profession. Examine+ members can earn CPEUs and CEUs at no extra charge through self-study activities that have been approved by various organizations related to health and nutrition. If you’re a U.S. health professional (MD, RN, PT, or other), and also want to earn credit hours with Examine+, click here to let us know what organizations you belong to or contact us. A certificate of completion will automatically be generated for you to download once you complete each quiz successfully (i.e., with a grade of 70% or more). It is up to you to submit your certificate to the corresponding organization. (You need to already belong to the organization.) No. You can work on the quiz in multiple sessions. Just ensure your email is correct when starting your quiz so that you may resume the activity at a later time. In order to earn credit hours, you must belong to one of the organizations above or be part of an organization that accepts credits earned through one of the organizations above. An example of an organization that allows credits by other organizations is The Board for Certification of Nutrition Specialists (BCNS). The BCNS allows courses that are approved by the Academy of Nutrition and Dietetics and contain at least 50% nutrition content for CEUs. For each activity, the number of CEUs can vary and are listed accordingly in a table for the respective organizations. You may complete any number of activities to satisfy your certification requirements."
