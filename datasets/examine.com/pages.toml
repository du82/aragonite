["https://examine.com/plus/academic-libraries"]
title = "Access for Academic Libraries - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Health disinformation is everywhere. Especially in the world of supplements and nutrition — it’s incredibly difficult to find consistently unbiased information based on scientific evidence. Examine provides readers with the latest research by summarizing studies from multiple disciplines in an easy-to-read format written by experts and supported by relevant citations. The Examine team covers nutrition, health sciences, integrative medicine, physiology, and much more. Since 2011, our team of over 30 researchers has been tracking, categorizing, and analyzing tens of thousands of nutrition and supplement studies in order to help our readers be healthier. We have no industry ties, accept no advertising or sponsorship, and we never use AI to create our information. All content on Examine is specifically written to be clear and easy to understand. We translate scientific and academic writing into everyday language that makes it accessible to patrons. All content on Examine is specifically written to be clear and easy to understand. We translate scientific and academic writing into everyday language that makes it accessible to patrons. We have over 30 researchers on the team — MDs, RDs, PharmDs, and more — and strict contractual obligations to ensure zero conflicts of interest. Our readers can trust us because 100% of our revenue comes from subscription revenue. We have no ads, sponsorships, consulting, services, physical products, and we do not recommend or partner with specific brands. To collect studies, the research team uses several hundred PubMed search strings, each focusing on a specific intervention, health condition, or measurable health outcome. The team also pays close attention to trending topics, so our readers are always up to date on the latest news in health and nutrition. We have a few systematic review specialists on the team who create these search strings, and we also contract with a librarian who has a master’s in nutrition to help us fine-tune and update the search strings over time to ensure we don’t miss any new information."
