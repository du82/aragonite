["https://examine.com/about/our-story"]
title = "Our Story - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = 'The best way to understand why Examine exists is to understand why we started. The following is from our co-founder Sol Orwell: It started in 2008. I was living in Argentina, and my buddy came to visit. We were at the border with Chile, and when our guide pointed to Mount Aconcagua and said it was the tallest mountain in South America, I boldly claimed that I could climb it. I got laughed at. Not a mean laugh — they meant no harm. It was more a laugh of "that is not possible." And honestly, I was in no shape to take on the challenge. The reality hit me soon enough: we took a ski lift up a mountain, and after about ten seconds of running around in the knee-high snow, I was gasping for breath, absolutely gassed. And thus began my arduous journey from the man on the left to the man on the right (a weight loss of over 60 pounds): I co-founded Examine back in 2011 because I was sick and tired of all the BS that supplement companies and health ‘gurus’ spread. They weren’t really interested in factual accuracy; nope, they were far more interested in their claims of a magic cure (and of course, in selling said cure to you). But you and I know this: there is no magic cure. Supplements are exactly that: a supplement to what we are already doing. As an engineer, I wanted to bring the engineering mindset to health and nutrition: let’s analyze the entirety of evidence, not just a study or two, and then summarize it. I met Kamal (my co-founder) because we both suffer from Ehlers-Danlos Syndrome (EDS). EDS usually manifests itself as hyperlaxity (someone who is very flexible). But in extreme cases, it can cause highly weakened joints. I’ve had six major surgeries — for my jaw, shoulders, both ACLs, etc. It’s something I’ve learned to live with. I actually need further surgeries, but they are not impacting my day-to-day, so I’ve declined to go under. So to me, fitness is not just about getting muscular and “huge”. Every pound of weight gain equals an extra four pounds of pressure on your knees, so my losing 50+ pounds meant 200 pounds less pressure on my knees. Per step. Target 10,000 steps and you can see that is a lot of pressure.'
