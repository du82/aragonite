full_description = "Bio Molly’s wide-ranging interests in science and communication stem from growing up in a family of writers, teachers, and athletes, which led to participation in team sports, music, and dance and an interest in math and science. She earned her PhD in biomedical engineering with a secondary concentration in biophysics from Duke University while also auditing classes in the dance department and spent several years in research before immersing herself in a variety of science-related communication, publishing, and outreach initiatives. Working as a STEM editor for academic authors and publishers allowed her to merge her various skill sets and contribute to improving research communication. She enjoys the gratifying process of making highly technical information accessible and readable for a broader audience. Outside of work, she stubbornly insists on her pursuit of a quiet renaissance life in a time of loud specialization. Education & training BS in Mechanical Engineering, University of Michigan MS in Mechanical Engineering, Rochester Institution of Technology PhD Biomedical Engineering, Duke University Credentials Graduate certificate in Structural Biology & Biophysics, Duke University Location Toronto, CanadaRecent work14 days agoSkin, Hair & Nails - Added one new entryminorResearch written byMichael Hull & Adel MoussaEdited byPierre-Alexandre Sicart & Molly GregasReviewed byKamal Patel & Wyatt Brown21 days agoAllergies & Immunity - Added three new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas22 days agoLibido & Sexual Function - Added one new entryminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas27 days agoBone Health - Added two new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly