full_description = "Bio Having worked as a personal trainer, online coach, and fitness writer for a decade, Antonis is especially interested in the art and science of optimizing body composition, maximizing physical performance, and maintaining good health. When he is not working on the Examine Research Feed, Supplement Guides, page updates, or memes, — or chasing after his toddler — Antonis enjoys hitting the weights, taking nature walks in his sunny home country of Cyprus, and playing video games. Education & training BA Business Studies, University of West England MSc Human Resources Management, University of Surrey Credentials ISSA Certified Fitness Trainer Location CyprusRecent work21 days agoAllergies & Immunity - Added three new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas22 days agoLibido & Sexual Function - Added one new entryminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas27 days agoBone Health - Added two new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas2025-01-28 18:52:35Liver Health - Added two new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas2024-12-19 00:27:24Stress & Anxiety - Added three new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray, Michael Hull & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly GregasLoad More 21 days agoAllergies & Immunity - Added three new entriesminorResearch written byWyatt Brown, Adel Moussa, Mike Murray & Antonis DamianouEdited byMolly GregasReviewed byWyatt Brown & Molly Gregas 22 days agoLibido & Sexual Function - Added one new entryminorResearch writt