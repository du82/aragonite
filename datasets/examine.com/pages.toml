["https://examine.com/how-to-use"]
title = "How to use Examine - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Examine is organized unlike any health information site you’ve seen, so read these basics before digging in! In scientific research, anything that’s tested in a trial is called an intervention. Fish oil, creatine, and low-carb diets are examples of interventions. Trials look at specific, measurable outcomes (such as LDL-C, skin elasticity, or self-rated anxiety) to see if an intervention “works”. Examine covers 400+ health interventions and 700+ health outcomes. But people care about their health conditions and goals, not just specific outcomes. So we also have around 400 health conditions and goals pages. The last (and broadest) part of the hierarchy is the health categories. On the upper left of any intervention or condition/goal page, you’ll see which of 25 health categories the page belongs to. The category pages are the backbone of Examine 2.0 — they collect all the related FAQs and study information in one place. This is a lot to take in! So here’s a simple way to think about it: If you have a health condition or a health goal, you’re interested in what interventions might improve the outcomes related to this condition or goal. And since there are so many conditions and goals out there, we grouped them under 25 broad health categories to make the website easier to use. You can add the Examine icon to your app home screen for easy access. Examine 2.0 works great on mobile! Follow this easy guide to add Examine to your home screen. Use the search bar and ExamineAI! The search bar is integrated across the site and digs through every page we’ve published. If you still can’t find what you’re looking for, just ask ExamineAI, our large language model trained exclusively on Examine’s extensive archives. It’s integrated in the search results that appear when you type, located at the bottom. Learn how to use ExamineAI. Most pages on Examine are split into two main parts: FAQs (the questions our readers want us to answer) and the Examine Database (the randomized trial data we systematically collect)."
