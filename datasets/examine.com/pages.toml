title = "Scientific research and dealing with sensationalism - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "In early 2017, the Internet was abuzz with headlines that boldly stated that a recent study showed that ‘Nutella causes cancer.’ Immediately after that were contrarian headlines stating “Don’t worry, Nutella does not cause cancer.” What the actual study had done was investigate three compounds. One of them was Glycidyl Ester (GE), which palm oil has more of relative to other oils. Furthermore, the study had looked at animals, not humans. On top of that, it was looking at GE found in refined palm oil. And lastly, it had looked at the consumption of GE in very high rates (rare for adults). This is not a thought exercise - this actually happened. The media made some incredible logic leaps to get to Nutella cause cancer.’ This is why we always read the study. It’s popular for gurus to read a quick PubMed abstract and decide they know what a study shows. But in our previous example, the abstract did not mention that no human data was used! It was only reading the entire 159 page paper that we saw this: We do not outsource any of our analyses. And this is why we have a full team of different backgrounds to ensure that we get the full picture when we analyze any study. Furthermore, this is why we constantly figure ourselves as Switzerland. It is not our job to debunk any specific claims. We do not target any specific writers or organizations. This is also why we do not call ourselves media - we are not pushing news onto our readers. Our job is to simply look at the full body of research based on what our readers are asking us and give them a full assessment. Randomized clinical trials (RCTs) may be the “gold standard” of study design, but many are riddled with methodological issues (like small sample sizes, or wacky statistical methods) and bias, which can exist because of funding sources or the authors themselves (for example, studies funded by soda manufacturers are more likely to show neutral results for sugary or diet drinks). The scientific method relies on collecting many observations and establishing your hypothesis or hypotheses. So, citing just one study, without fully exploring existing literature on the topic will invariably get you into trouble."
year_published = 2025
clearnet = "https://examine.com/about/dealing-with-sensationalism"
