title = "Low Testosterone: Symptoms, causes, treatments, and your questions answered."
description = "Testosterone is the best-known androgen (i.e., male sex hormone). It is secreted by the testicles and is responsible for the development and maintenance of secondary male characteristics (e.g., increased body and facial hair, enlarged larynx, deep voice, muscularity). Low testosterone (i.e., hypogonadism) results from the failure of the testicles (i.e., the gonads) to produce normal levels of testosterone due to a problem within the hypothalamic-pituitary-testicular (HPT) axis.[1]"
full_description = "OverviewsummarysignsdiagnosesupplementdietcausesExamine DatabaseResearch FeedFrequently asked questionsUpdate HistoryReferencesWhat is low testosterone?Testosterone is the best-known androgen (i.e., male sex hormone). It is secreted by the testicles and is responsible for the development and maintenance of secondary male characteristics (e.g., increased body and facial hair, enlarged larynx, deep voice, muscularity). Low testosterone (i.e., hypogonadism) results from the failure of the testicles (i.e., the gonads) to produce normal levels of testosterone due to a problem within the hypothalamic-pituitary-testicular (HPT) axis.[1]What are the main signs and symptoms of low testosterone? Low sex drive Erectile dysfunction (i.e., the inability to get or keep an erection) Low sperm count Reduced muscle mass and strength and increased fat mass Low bone density (i.e., osteoporosis) Loss of body hair Gynaecomastia (i.e., enlargement of breast tissue) Sleep disturbances Reduced energy, depressed mood, and trouble concentrating How is low testosterone diagnosed?Testosterone levels are assessed using a blood test. The cutoff for low testosterone differs between organizations, but most define it as a total testosterone level of <231–275 ng/dL.[2] Testosterone levels should be assessed early in the morning (between 7–11 a.m.) when peak levels occur, and in a fasted state. Two separate low testosterone measurements (preferably four weeks apart) along with clinical signs and symptoms of low testosterone are needed to be diagnosed with low testosterone.What are the different metrics used to assess testosterone levels?What are some of the main medical treatments for low testosterone?Testosterone replacement therapy (TRT) is the primary treatment option for low testosterone and can be given as an oral pill, buccal tablet (which dissolves in the mouth), injection, nasal gel, topical gel, transdermal patch (worn on the skin), or implant.[1] TRT appears to be safe,[3] although there is limited data on long-term safety. Each form of administration can cause unique adverse effects, but in general, TRT may cause erythrocytosis (as indicated by a hematocrit level > 54%), dyslipidemia, acne, oily skin, reduced sperm production, and/or growth of metastatic prostate cancer.[1][4] Additionally, TRT is contraindicated for certain populations (e.g., people with a recent history of heart attack or stroke, heart failure, or prostate cancer).[1]Have any supplements been studied for low testosterone?A long list of supplements are marketed as testosterone boosters, but there is scant evidence to suggest that any of them affect testosterone levels.[5][6] Some of the more popular options include saw-palmetto, ashwagandha, tribulus-terrestris, fenugreek, d-aspartic-acid, maca, horny-goat-weed, and boron. Supplementing with certain nutrients such as vitamin D, zinc, and magnesium can slightly increase testosterone levels if dietary intake and serum levels are inadequate.[7]Can testosterone boosters bring my testosterone back to normal?Can creatine increase your testosterone levels?Does ashwagandha increase testosterone?How could diet affect low testosterone?In many men low testosterone is caused by reversible conditions, such as excess body fat and chronic disease (e.g., type-2-diabetes, metabolic-syndrome). Consequently, a hypocaloric diet is very effective for increasing testosterone levels in this population,[8] whereas a hypocaloric diet seems to reduce testosterone levels in lean men.[9][10] In addition, it’s worth paying attention to dietary fat levels, because limited evidence suggests that low-fat diets (≤25% of energy intake) decrease testosterone levels compared to higher-fat diets (about 40% of energy intake).[11]Are there any other treatments for low testosterone?Exercise — whether it’s aerobic exercise, high-intensity interval training, or resistance training — increases testosterone levels,[12] especially when it’s included as part of a lifestyle intervention to reduce body weight.[13] Exercise may also improve the effectiveness of TRT.[14] Bariatric surgery is another effective method for increasing testosterone levels in men with obesity.[15]Will exercise increase my testosterone levels?How does resistance training affect testosterone levels?What causes low testosterone?The cause of low testosterone is classified as either primary or secondary and further categorized as functional or organic. Primary hypogonadism originates from a problem in the testicles, while secondary hypogonadism indicates a problem in the hypothalamus or the pituitary gland, which are the parts of the brain that signal the testicles to produce testosterone.[1] Functional hypogonadism is caused by factors that suppress testosterone levels (e.g., medications, obesity, type 2 diabetes, aging, excessive exercise, malnutrition) but are potentially reversible, while organic hypogonadism is caused by a congenital, structural, or destructive condition (e.g., Klinefelter syndrome, Kallmann syndrome, hemochromatosis, inflammatory disease, injury to the testicles, traumatic brain injury, chemotherapy or radiation) that results in largely irreversible hypothalamic, pituitary, or testicular dysfunction.[1]Will gaining fat decrease my testosterone levels?How does aging affect testosterone levels?Which drugs decrease testosterone levels?Does ejaculation affect testosterone levels?Examine Database: Low TestosteroneMore FiltersExpand AllCollapse AllInterventionHealth OutcomeGradeEvidenceEffectTongkat Ali20 Outcomes5 StudiesTribulus Terrestris7 Outcomes4 StudiesAlcohol1 Outcome2 StudiesAshwagandha6 Outcomes2 StudiesDHEA11 Outcomes2 StudiesKetogenic Diet2 Outcomes2 StudiesBoron2 Outcomes1 StudyCaffeine3 Outcomes1 StudyCannabis2 Outcomes1 StudyChrysin1 Outcome1 StudyCoenzyme Q105 Outcomes1 StudyColeus forskohlii5 Outcomes1 StudyGarcinia2 Outcomes1 StudyLicorice4 Outcomes1 StudyMaca5 Outcomes1 StudyNicotine3 Outcomes1 StudySaw Palmetto2 Outcomes1 StudyVitamin D1 Outcome1 StudyZinc4 Outcomes1 StudyTongkat Ali20 OutcomesTribulus Terrestris7 OutcomesAlcohol1 OutcomeAshwagandha6 OutcomesDHEA11 OutcomesKetogenic Diet2 OutcomesBoron2 OutcomesCaffeine3 OutcomesCannabis2 OutcomesChrysin1 OutcomeCoenzyme Q105 OutcomesColeus forskohlii5 OutcomesGarcinia2 OutcomesLicorice4 OutcomesMaca5 OutcomesNicotine3 OutcomesSaw Palmetto2 OutcomesVitamin D1 OutcomeZinc4 OutcomesResearch FeedRead all studies Exogenous testosterone and/or vitamin D for improving physical function in hypogonadal older menMay 31, 2024/Healthy Aging & Longevity•Men’s Health•Low Testosterone+2 moreIn this randomized controlled trial, daily application of transdermal testosterone gel increased appendicular lean mass and gait speed in older men with low testosterone, whereas monthly vitamin D supplementation did not have an effect on these outcomes.ShareLinkEmailAdd noteCould testosterone therapy actually increase the risk of bone fractures in men?March 14, 2024/Joints & Bones•Men’s Health•Low Testosterone+1 moreUnripe black raspberry extract for late-onset hypogonadismSeptember 25, 2023/Herbal Supplements•Healthy Aging & Longevity•Men’s Health+2 moreLongjack extract for increasing testosteroneNovember 7, 2022/#Dietitians•Men’s Health•Herbal Supplements+2 moreAshwaganda, sexual health, and testosteroneNovember 7, 2022/#ConflictOfInterest•Herbal Supplements•Men’s Health+4 moreFrequently asked questionsWhat is low testosterone?Testosterone is the best-known androgen (i.e., male sex hormone). It is secreted by the testicles and is responsible for the development and maintenance of secondary male characteristics (e.g., increased body and facial hair, enlarged larynx, deep voice, muscularity). Low testosterone (i.e., hypogonadism) results from the failure of the testicles (i.e., the gonads) to produce normal levels of testosterone due to a problem within the hypothalamic-pituitary-testicular (HPT) axis.[1]What are the main signs and symptoms of low testosterone? Low sex drive Erectile dysfunction (i.e., the inability to get or keep an erection) Low sperm count Reduced muscle mass and strength and increased fat mass Low bone density (i.e., osteoporosis) Loss of body hair Gynaecomastia (i.e., enlargement of breast tissue) Sleep disturbances Reduced energy, depressed mood, and trouble concentrating How is low testosterone diagnosed?Testosterone levels are assessed using a blood test. The cutoff for low testosterone differs between organizations, but most define it as a total testosterone level of <231–275 ng/dL.[2] Testosterone levels should be assessed early in the morning (between 7–11 a.m.) when peak levels occur, and in a fasted state. Two separate low testosterone measurements (preferably four weeks apart) along with clinical signs and symptoms of low testosterone are needed to be diagnosed with low testosterone.What are the different metrics used to assess testosterone levels?Total testosterone refers to the sum of the concentrations of protein-bound and unbound testosterone in the circulation and can be broken down into three categories:[28] Tightly bound testosterone: About two-thirds of testosterone in the blood is bound to sex hormone binding globulin. It is not readily available for use by the body. Loosely bound testosterone: About one-third of testosterone in the blood is weakly bound to albumin. Once the bond is broken, the testosterone circulates as free testosterone in the body. Free testosterone: A small percentage of testosterone in the blood floats around freely. The body can readily use it, and the enzyme 5-alpha-reductase can convert it to DHT. The term bioavailable testosterone refers to the sum of loosely bound and free testosterone. Assessing testosterone levels Click here to read the full answer to What are the different metrics used to assess testosterone levels?What are some of the main medical treatments for low testosterone?Testosterone replacement therapy (TRT) is the primary treatment option for low testosterone and can be given as an oral pill, buccal tablet (which dissolves in the mouth), injection, nasal gel, topical gel, transdermal patch (worn on the skin), or implant.[1] TRT appears to be safe,[3] although there is limited data on long-term safety. Each form of administration can cause unique adverse effects, but in general, TRT may cause erythrocytosis (as indicated by a hematocrit level > 54%), dyslipidemia, acne, oily skin, reduced sperm production, and/or growth of metastatic prostate cancer.[1][4] Additionally, TRT is contraindicated for certain populations (e.g., people with a recent history of heart attack or stroke, heart failure, or prostate cancer).[1]Have any supplements been studied for low testosterone?A long list of supplements are marketed as testosterone boosters, but there is scant evidence to suggest that any of them affect testosterone levels.[5][6] Some of the more popular options include saw-palmetto, ashwagandha, tribulus-terrestris, fenugreek, d-aspartic-acid, maca, horny-goat-weed, and boron. Supplementing with certain nutrients such as vitamin D, zinc, and magnesium can slightly increase testosterone levels if dietary intake and serum levels are inadequate.[7]Can testosterone boosters bring my testosterone back to normal?DHEA, vitamin D, magnesium, and zinc have been seen to raise low testosterone levels. Few other supplements seem to help at all. A few trials support the use of coleus-forskohlii, but its numerous potential adverse effects make it a risky proposition, especially for older people. You might also have heard of d-aspartic-acid, but its promising initial trials were followed by several others that found that it didn’t increase testosterone. Some other supplements, such as ginger and Eurycoma longifolia, might support testosterone levels only in infertile men (or in men with testicular damage). Many other herbs, such as horny-goat-weed, have not even been studied in humans yet. Finally, keep in mind that a supplement can benefit libido (as do maca and, according to a small number of studies, tribulus-terrestris), mood, or energy levels, yet not affect testosterone. Click here to read the full answer to Can testosterone boosters bring my testosterone back to normal?Can creatine increase your testosterone levels?Quick answer:The evidence is mixed, but the preponderance of the evidence suggests that it’s unlikely that creatine will increase your testosterone levels.The evidence is mixed, but the preponderance of the evidence suggests that it’s unlikely that creatine will increase your testosterone levels. Three randomized controlled trials conducted in healthy young men reported that supplementing with creatine for 1–3 weeks produced small increases in the levels of testosterone or dihydrotestosterone (DHT; a highly active androgen converted from testosterone).[29][30][31] One of the 3 trials looked at the effect of creatine loading (25 grams/day for 1 week) followed by a maintenance phase (5 grams/day for 2 weeks) on testosterone and DHT in 20 young, healthy rugby players. Although no effect on testosterone was found, creatine increased the levels of DHT by 12 nanograms of DHT per deciliter of blood (ng/dL).[29] The other 2 trials found that supplementation with creatine for 1 week in healthy, active young men increased the concentrations of testosterone by 57 ng/dL and 150 ng/dL.[30][31] Conversely, 10 other trials (involving a total of 218 participants) looking at the effect of supplemental creatine at daily doses of 3–25 grams on testosterone levels for up to 12 weeks have found no statistically significant effect.[32][33][34][29][35][36][37][38][39][40] The participants in the majority of these trials were healthy, active young men. With regard to the form of creatine used, 9 trials administered creatine monohydrate, whereas 1 trial administered creatine malate. It’s worth noting that no trials have looked at the effect of creatine on testosterone in men with abnormally low testosterone levels. Taken together, the available evidence suggests that supplementing with creatine is unlikely to increase testosterone levels, at least in young healthy men whose testosterone levels are within the normal range. Click here to read the full answer to Can creatine increase your testosterone levels?Does ashwagandha increase testosterone?Quick answer:There is a bit of evidence that shows Ashwagandha increases testosterone, but it is not convincing.What is Ashwagandha? Ashwagandha is a traditional Indian medicine (Ayurveda) that is known to be associated with male virility and vitality; a common supplement to recommend to men that are feeling past their prime and a traditional medicine with a surprisingly large amount of evidence overall. It does seem to have some anti-stress effects due to having the properties of an adaptogen. Among the adaptogens and traditional medicine, however, ashwagandha is one of the few associated with masculinity. Since anything that can be named a te"
