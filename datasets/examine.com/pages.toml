["https://examine.com/outcomes/ldl-c"]
title = "Low-density lipoprotein (LDL): How diet, lifestyle, and supplements may provide benefits."
description = """
Low-density lipoproteins (LDL) are proteins that carry hydrophobic molecules through extracellular fluid. More precisely, they carry cholesterol from the liver to other parts of the body, via the bloodstream.
The greater the number of LDL particles (LDL-P) in the blood, the more likely some will pass into artery walls, become oxidized, and kickstart plaque formation,[1] leading to atherosclerosis. Therefore, to predict cardiovascular disease (CVD), LDL-P matters more than LDL cholesterol (LDL-C),[2][3] which is simply a measure of the amount of the cholesterol carried by LDL particles.
If two people have the same LDL-C but one has cholesterol-rich LDL (large, “fluffy” particles) and the other cholesterol-poor LDL (smaller, denser particles), the second will have a greater LDL-P (more LDL particles total) and be at greater risk of heart disease.

To predict heart disease, LDL-P (the number of LDL particles) matters more than LDL-C (the amount of cholesterol those particles carry). There is one molecule of apolipoprotein B (apoB) in each LDL particle, so apoB is a good estimate of LDL-P."""
full_description = "OverviewsummaryExamine DatabaseResearch FeedUpdate HistoryReferencesSummaryLow-density lipoproteins (LDL) are proteins that carry hydrophobic molecules through extracellular fluid. More precisely, they carry cholesterol from the liver to other parts of the body, via the bloodstream. The greater the number of LDL particles (LDL-P) in the blood, the more likely some will pass into artery walls, become oxidized, and kickstart plaque formation,[1] leading to atherosclerosis. Therefore, to predict cardiovascular disease (CVD), LDL-P matters more than LDL cholesterol (LDL-C),[2][3] which is simply a measure of the amount of the cholesterol carried by LDL particles. If two people have the same LDL-C but one has cholesterol-rich LDL (large, “fluffy” particles) and the other cholesterol-poor LDL (smaller, denser particles), the second will have a greater LDL-P (more LDL particles total) and be at greater risk of heart disease. To predict heart disease, LDL-P (the number of LDL particles) matters more than LDL-C (the amount of cholesterol those particles carry). There is one molecule of apolipoprotein B (apoB) in each LDL particle, so apoB is a good estimate of LDL-P. Examine Database: Low-density lipoprotein (LDL)More FiltersInterventionGradeEvidenceEffectBerberineB35 StudiesParticipants: 2824.cls-1{fill:#22c55e}.cls-2{fill:#d7cde0}Small ImprovementFish OilB32 StudiesParticipants: 3674.cls-1{fill:#6C757D}Mixed effectCurcuminC29 StudiesParticipants: 3915.cls-1{fill:#22c55e}.cls-2{fill:#d7cde0}Small ImprovementSaffron23 StudiesParticipants: 1674Spirulina23 StudiesParticipants: 1076Panax Ginseng (Korean Ginseng)15 StudiesParticipants: 657Resveratrol15 StudiesParticipants: 791Chromium15 StudiesParticipants: 8420Garlic15 StudiesParticipants: 4515Cocoa Extract15 StudiesParticipants: 739Coenzyme Q1014 StudiesParticipants: 5717Policosanol13 StudiesParticipants: 1367Zinc13 StudiesParticipants: 908Beta-glucans13 StudiesParticipants: 512Mediterranean Diet12 StudiesP