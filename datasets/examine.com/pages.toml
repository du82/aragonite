["https://examine.com/guides/how-to-read-a-study"]
title = "How to read a scientific study - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Table of ContentsWhy learn to read a scientific study?Types of studiesUnderstanding the abstract and introductionMethods: the most important part of the studyReading the resultsClarifying the conclusionConflicts of interestDigging down to the truthWhy you need a teamBasic checklistTable of Contents1Why learn to read a scientific study?2Types of studies3Understanding the abstract and introduction4Methods: the most important part of the study4.1Design and endpoints4.2Interpreting the statistics5Reading the results6Clarifying the conclusion7Conflicts of interest8Digging down to the truth9Why you need a team10Basic checklistWhy learn to read a scientific study? Marketing claims backed by “scientific evidence” pervade the health and fitness industry. Supplement manufacturers sell compounds like green coffee extract (on which there is barely any human research) as if their effects were as well-established as those of creatine (on which there are hundreds of human trials). Sometimes, following the paper trail of a marketing claim does lead to a real, published study — but not all studies are created equal. To avoid wasting money on ineffective products, you need to be able to assess different aspects of a study, such as its credibility, its applicability, and the clinical relevance of the effects reported. Figure 1: Green coffee extract: a cautionary tale To understand a study, as well as how it relates to previous research on the topic, you need to read more than just the abstract. Context is critically important when discussing new research, which is why abstracts are often misleading.Types of studies Want to read this guide later? Download the full PDF. There exist numerous types of studies. This guide was designed to help you better understand all of them, with a special emphasis on experimental research. Figure 2: Overview of study types Randomized, double-blind, placebo-controlled trials are commonly seen as the gold standard of biomedical research. In such trials, the participants are randomly assigned to either an intervention group (which will receive the intervention) or a control group (which will receive a placebo), and neither they nor the researchers running the experiment know which participants belong to which group.Understanding the abstract and introduction A paper is divided into sections. Those sections vary between papers, but they usually include an abstract, an introduction, a section on methods (which provides demographic information, presents the design of the study, and sometimes expounds on the chosen endpoints), and a conclusion (which is often split between “results” and “discussion”). The abstract is a brief summary that covers the main points of a study. Since there’s a lot of information to pack into a few paragraphs, an abstract can be unintentionally misleading. Because it does not provide context, an abstract does not often make clear the limitations of an experiment or how applicable the results are to the real world. Before citing a study as evidence in a discussion, make sure to read the whole paper, because it might turn out to be weak evidence. The introduction sets the stage. It should clearly identify the research question the authors hope to answer with their study. Here, the authors usually summarize previous related research and explain why they decided to investigate further. For example, the non-caloric sweetener stevia showed promise as a way to help improve blood sugar control, particularly in diabetics. So researchers set out to conduct larger, more rigorous trials to determine if stevia could be an effective treatment for diabetes. Introductions are often a great place to find additional reading material since the authors will frequently reference previous, relevant, published studies. One study is just one piece of the puzzle Reading several studies on a given topic will provide you with more information — more data — even if you don’t know how to run a meta-analysis. For instance, if you read only one study that looked at the effect of creatine on testosterone and it found an increase, then 100% of your data says that creatine increases testosterone; but if you read ten studies that looked at the effect of creatine on testosterone and only one found an increase, then 90% of your data says that creatine does not increase testosterone. (This is a simplified example, in which we used “vote counting”: we compared the number of studies that found an effect to the number of studies that found no effect. Meta-analyses, however, are a lot more complicated than that: they must take into account various criteria, such as the design of the study, the number of participants, and the biases that affect the results, rather than reduce each study to a positive or negative result.) Unsurprisingly, it is common for supplement companies to cherry-pick studies. If a company wants to sell you creatine as a testosterone booster, they’ll mention the one study that found an increase in testosterone, not the nine that found no increase. Likewise, it is usually easy for warring camps to throw studies at each other to “prove” their point. If you seek one study that shows that a low-fat diet is better than a low-carb diet to promote weight loss, you’ll find one. If you seek one study that shows the contrary, you’ll find one too. It is therefore important, if you seek the truth (and not just some ammunition for a Twitter brawl) to look at the whole body of evidence, and to consider fairly the studies that don’t agree with your original opinion (if you have one, but most of us do). On that note, keep in mind that companies are not alone in cherry-picking studies. Researchers sometimes do it too. If you know that a field is contentious yet a paper only mentions studies that support the authors’ conclusions, you may want to make your own search for other papers on the topic (always a good idea at any rate).Methods: the most important part of the study A paper’s “Methods” (or “Materials and Methods”) section provides information on the study’s design and participants. Ideally, it should be so clear and detailed that other researchers can repeat the study without needing to contact the authors. You will need to examine this section to determine the study’s strengths and limitations, which both affect how the study’s results should be interpreted. Demographics The “Methods” section usually starts by providing information on the participants, such as age, sex, lifestyle, health status, and method of recruitment. This information will help you decide how relevant the study is to you, your loved ones, or your clients. Figure 3: Example study protocol to compare two diets The demographic information can be lengthy, you might be tempted to skip it, yet it affects both the reliability of the study and its applicability. Reliability. The larger the sample size of a study (i.e., the more participants it has), the more reliable its results. Note that a study often starts with more participants than it ends with; diet studies, notably, commonly see a fair number of dropouts. Applicability. In health and fitness, applicability means that a compound or intervention (i.e., exercise, diet, supplement) that is useful for one person may be a waste of money — or worse, a danger — for another. For example, while creatine is widely recognized as safe and effective, there are “nonresponders” for whom this supplement fails to improve exercise performance. Your mileage may vary, as the creatine example shows, yet a study’s demographic information can help you assess this study’s applicability. If a trial only recruited men, for instance, women reading the study should keep in mind that its results may be less applicable to them. Likewise, an intervention tested in college students may yield different results when performed on people from a retirement facility. Figure 4: Some trials are sex-specific Furthermore, different recruiting methods will attract different demographics, and so can influence the applicability of a trial. In most scenarios, trialists will use some form of “convenience sampling”. For instance, studies run by universities will often recruit among their students. However, some trialists will use “random sampling” to make their trial’s results more applicable to the general population. Such trials are generally called “augmented randomized controlled trials”. Confounders Finally, the demographic information will usually mention if people were excluded from the study, and if so, for what reason. Most often, the reason is the existence of a confounder — a variable that would confound (i.e., influence) the results. For example, if you study the effect of a resistance training program on muscle mass, you don’t want some of the participants to take muscle-building supplements while others don’t. Either you’ll want all of them to take the same supplements or, more likely, you’ll want none of them to take any. Likewise, if you study the effect of a muscle-building supplement on muscle mass, you don’t want some of the participants to exercise while others do not. You’ll either want all of them to follow the same workout program or, less likely, you’ll want none of them to exercise. It is of course possible for studies to have more than two groups. You could have, for instance, a study on the effect of a resistance training program with the following four groups: Resistance training program + no supplement Resistance training program + creatine No resistance training + no supplement No resistance training + creatine But if your study has four groups instead of two, for each group to keep the same sample size you need twice as many participants — which makes your study more difficult and expensive to run. When you come right down to it, any differences between the participants are variable and thus potential confounders. That’s why trials in mice use specimens that are genetically very close to one another. That’s also why trials in humans seldom attempt to test an intervention on a diverse sample of people. A trial restricted to older women, for instance, has in effect eliminated age and sex as confounders. As we saw above, with a great enough sample size, we can have more groups. We can even create more groups after the study has run its course, by performing a subgroup analysis. For instance, if you run an observational study on the effect of red meat on thousands of people, you can later separate the data for “male” from the data for “female” and run a separate analysis on each subset of data. However, subgroup analyses of these sorts are considered exploratory rather than confirmatory and could potentially lead to false positives. (When, for instance, a blood test erroneously detects a disease, it is called a false positive.) Design and endpoints The “Methods” section will also describe how the study was run. Design variants include single-blind trials, in which only the participants don’t know if they’re receiving a placebo; observational studies, in which researchers only observe a demographic and take measurements; and many more. (See figure 2 above for more examples.) More specifically, this is where you will learn about the length of the study, the dosages used, the workout regimen, the testing methods, and so on. Ideally, as we said, this information should be so clear and detailed that other researchers can repeat the study without needing to contact the authors. Finally, the “Methods” section can also make clear the endpoints the researchers will be looking at. For instance, a study on the effects of a resistance training program could use muscle mass as its primary endpoint (its main criterion to judge the outcome of the study) and fat mass, strength performance, and testosterone levels as secondary endpoints. One trick of studies that want to find an effect (sometimes so that they can serve as marketing material for a product, but often simply because studies that show an effect are more likely to get published) is to collect many endpoints, then to make the paper about the endpoints that showed an effect, either by downplaying the other endpoints or by not mentioning them at all. To prevent such “data dredging/fishing” (a method whose devious efficacy was demonstrated through the hilarious chocolate hoax), many scientists push for the preregistration of studies. Sniffing out the tricks used by the less scrupulous authors is, alas, part of the skills you’ll need to develop to assess published studies. Interpreting the statistics The “Methods” section usually concludes with a hearty statistics discussion. Determining whether an appropriate statistical analysis was used for a given trial is an entire field of study, so we suggest you don’t sweat the details; try to focus on the big picture. First, let’s clear up two common misunderstandings. You may have read that an effect was significant, only to later discover that it was very small. Similarly, you may have read that no effect was found, yet when you read the paper you found that the intervention group had lost more weight than the placebo group. What gives? The problem is simple: those quirky scientists don’t speak like normal people do. For scientists, significant doesn’t mean important — it means statistically significant. An effect is significant if the data collected over the course of the trial would be unlikely if there really was no effect. Therefore, an effect can be significant yet very small — 0.2 kg (0.5 lb) of weight loss over a year, for instance. More to the point, an effect can be significant yet not clinically relevant (meaning that it has no discernible effect on your health). Relatedly, for scientists, no effect usually means no statistically significant effect. That’s why you may review the measurements collected over the course of a trial and notice an increase or a decrease yet read in the conclusion that no changes (or no effects) were found. There were changes, but they weren’t significant. In other words, there were changes, but so small that they may be due to random fluctuations (they may also be due to an actual effect; we can’t know for sure). We saw earlier, in the “Demographics” section, that the larger the sample size of a study, the more reliable its results. Relatedly, the larger the sample size of a study, the greater its ability to find if small effects are significant. A small change is less likely to be due to random fluctuations when found in a study with a thousand people, let’s say, than in a study with ten people. This explains why a meta-analysis may find significant changes by pooling the data of several studies which, independently, found no significant changes. P-values 101 Most often, an effect is said to be significant if the statistical analysis (run by the researchers post-study) delivers a p-value that isn’t higher than a certain threshold (set by the researchers pre-study). We’ll call this thresho"
