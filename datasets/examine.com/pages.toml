["https://examine.com/categories/ear-nose-throat"]
title = "Ear, Nose & Throat: Common conditions and treatments"
description = "The ear, nose, and throat are all interconnected parts of the body and control the functions of balance, smelling, speech, swallowing, and hearing. The ears are connected to the throat through a passageway called the Eustachian tubes, which balance air pressure and drain fluid internally from the ear. The nose is directly connected to the throat (referred to as the pharynx) to help with breathing. Conditions such as allergic rhinitis, tinnitus, vertigo, and throat infections can affect ear, nose, and throat health."
full_description = 'OverviewsummarydietsupplementsAll ConditionsExamine DatabaseResearch FeedFrequently asked questionsReferencesWhat is the relationship between the ear, nose, and throat?The ear, nose, and throat are all interconnected parts of the body and control the functions of balance, smelling, speech, swallowing, and hearing. The ears are connected to the throat through a passageway called the Eustachian tubes, which balance air pressure and drain fluid internally from the ear. The nose is directly connected to the throat (referred to as the pharynx) to help with breathing. Conditions such as allergic rhinitis, tinnitus, vertigo, and throat infections can affect ear, nose, and throat health.What type of healthcare provider should someone see for concerns related to the ear, nose, and throat?Should earwax be removed?How could diet affect the ear, nose, and throat?Anecdotally, some people have reported improvements in various conditions involving the ear, nose, and throat after dietary changes. Although there is some evidence to suggest there is an association between dietary interventions and a reduced risk of hearing problems[1] and allergic rhinitis,[2] further research is needed to determine specific dietary recommendations.Which supplements are of interest for the ear, nose, and throat?Notable supplements that may help with allergic rhinitis include probiotics,[3] pelargonium sidoides, and spirulina. vitamin c,[4] zinc,[5] and probiotics[6] may be helpful for treating or preventing upper respiratory infections. melatonin may provide benefits in the context of tinnitus.Supplement GuideClick here to read the Allergies & Immunity Supplement GuideAll Conditions and GoalsAllergic Rhinitis (Seasonal Allergies / Hay Fever)Otitis MediaSinusitisSore ThroatTinnitusExamine Database: Ear, Nose & ThroatAllergic Rhinitis (Seasonal Allergies / Hay Fever)Research FeedRead all studies The effect of various probiotics on seasonal allergiesFebruary 25, 2025/Ear, Nose & Throat•Allergic Rhinitis (Seasonal Allergies / Hay Fever)•ProbioticsIn this network meta-analysis of randomized controlled trials, some probiotic supplements were beneficial for allergic rhinitis (seasonal allergies).ShareLinkEmailAdd noteQuercetin may not help with gastrointestinal reflux diseaseFebruary 14, 2025/Ear, Nose & Throat•Gastroesophageal Reflux Disease (GERD)•QuercetinCan any nutrients protect against hearing loss?January 21, 2025/Ear, Nose & Throat•Vitamin C•Vitamin E+2 moreThe effect of probiotics on allergic rhinitis symptoms in childrenJanuary 9, 2025/Ear, Nose & Throat•Allergic Rhinitis (Seasonal Allergies / Hay Fever)•ProbioticsSwallow training in older adults with difficulty swallowingDecember 9, 2024/Healthy Aging & Longevity•Ear, Nose & ThroatVitamin D deficiency and chronic rhinitisNovember 22, 2024/Lungs & Breathing•Ear, Nose & Throat•Allergic Rhinitis (Seasonal Allergies / Hay Fever)+1 moreDo probiotics reduce allergic rhinitis symptoms among children?November 22, 2024/Pregnancy & Children•Ear, Nose & Throat•Allergic Rhinitis (Seasonal Allergies / Hay Fever)+1 moreAshwagandha and turmeric for allergic rhinitisNovember 19, 2024/#ConflictOfInterest•Ear, Nose & Throat•Allergic Rhinitis (Seasonal Allergies / Hay Fever)+2 moreKegan Liyan relieves sore throat symptomsNovember 8, 2024/Herbal Supplements•Ear, Nose & Throat•Sore Throat+1 moreSurgery to improve malnutrition in people with idiopathic achalasiaOctober 29, 2024/Autoimmune Disease•Ear, Nose & Throat•MalnutritionThe effect of modified Baduanjin in adults with nasopharyngeal cancerOctober 16, 2024/Ear, Nose & Throat•Muscle Gain & Exercise•Cancer+2 moreDietary therapies for eosinophilic esophagitisOctober 3, 2024/#Dietitians•Ear, Nose & ThroatCaffeine intake and hearing lossSeptember 27, 2024/Ear, Nose & Throat•CaffeineCan smell training and vitamin A improve COVID-19-related smell dysfunction?September 26, 2024/Ear, Nose & Throat•Immunity & Infectious Disease•COVID-19+1 moreA supplement with honey, herbs, and zinc may benefit tonsillitisAugust 21, 2024/#ConflictOfInterest•Ear, Nose & Throat•Tonsillitis+3 moreFrequently asked questionsWhat is the relationship between the ear, nose, and throat?The ear, nose, and throat are all interconnected parts of the body and control the functions of balance, smelling, speech, swallowing, and hearing. The ears are connected to the throat through a passageway called the Eustachian tubes, which balance air pressure and drain fluid internally from the ear. The nose is directly connected to the throat (referred to as the pharynx) to help with breathing. Conditions such as allergic rhinitis, tinnitus, vertigo, and throat infections can affect ear, nose, and throat health.What type of healthcare provider should someone see for concerns related to the ear, nose, and throat?Otolaryngologists, commonly known as ear, nose, and throat (ENT) doctors, specialize in the care of special conditions related to the ear, nose, and throat. This type of physician specializes in medical and surgical care related to the ear, nose, throat, head, and neck. Some ENT doctors may also obtain further specialization in related areas such as facial reconstruction, sleep medicine, or laryngology (throat and voice disorders). Click here to read the full answer to What type of healthcare provider should someone see for concerns related to the ear, nose, and throat?Should earwax be removed?Earwax, also known as cerumen, is a naturally occurring substance that protects and cleans the outer ear canal. It usually does not have to be removed, as it is excreted from the ear with the help of regular jaw movement. The accumulation of earwax is completely normal and does not indicate poor hygiene or ear health. However, excessive earwax accumulation can cause problems, such as earwax impaction. In this case, wax builds up in the ear canal and hardens, sometimes completely blocking the ear canal. Causes of earwax impaction include anatomical differences (a narrow or curved ear canal), ear diseases, differences in earwax texture, or overproduction of earwax. People with earwax impaction may experience hearing loss, a feeling of "fullness” in the ear, dizziness, itchiness, or ear pain. Using cotton swabs to clean the ear canal is not advised, as it may push wax deeper into the ear canal rather than remove it. If a person is experiencing symptoms of earwax impaction, it is best to seek treatment from a healthcare provider.[7] [8] Click here to read the full answer to Should earwax be removed?How could diet affect the ear, nose, and throat?Anecdotally, some people have reported improvements in various conditions involving the ear, nose, and throat after dietary changes. Although there is some evidence to suggest there is an association between dietary interventions and a reduced risk of hearing problems[1] and allergic rhinitis,[2] further research is needed to determine specific dietary recommendations.Which supplements are of interest for the ear, nose, and throat?Notable supplements that may help with allergic rhinitis include probiotics,[3] pelargonium sidoides, and spirulina. vitamin c,[4] zinc,[5] and probiotics[6] may be helpful for treating or preventing upper respiratory infections. melatonin may provide benefits in the context of tinnitus.References'
