["https://examine.com/conditions/intestinal-candidiasis"]
title = "Intestinal Candidiasis: Symptoms, causes, treatments, and your questions answered."
description = "Candidiasis is a fungal infection caused by Candida, a genus of yeast that lives on the skin and inside of the mouth, throat, vagina, and GI tract. Intestinal candidiasis refers specifically to an abnormally high level of Candida detected in samples from feces, rectal swabs, or (rarely) the intestinal mucosa (the lining of the stomach or intestinal tract)."
full_description = "OverviewsummarysignsdiagnosesupplementdietcausesFrequently asked questionsReferencesWhat is intestinal candidiasis?Candidiasis is a fungal infection caused by Candida, a genus of yeast that lives on the skin and inside of the mouth, throat, vagina, and GI tract. Intestinal candidiasis refers specifically to an abnormally high level of Candida detected in samples from feces, rectal swabs, or (rarely) the intestinal mucosa (the lining of the stomach or intestinal tract).What role do yeasts play in the gut?Why aren’t intestinal yeasts a problem for healthy people?What are the other forms of candidiasis?Does Candida play a role in GI diseases?What are the main signs and symptoms of intestinal candidiasis?IC does not appear to have perceptible symptoms.[1] Controversial publications from the 1970s and ’80s claimed that intestinal Candida overgrowth lead to a long list of ailments, including fatigue, GI discomfort, recurring yeast infections, arthritis, acne, migraine headache, and heart issues, although most of these claims have been debunked.[1] IC may lead to diarrhea associated with antibiotics and irritable bowel syndrome with diarrhea (IBS-D), but more research is needed.What are the complications of IC?How is intestinal candidiasis diagnosed?Intestinal yeast colonization is estimated from rectal swabs, fecal samples, mucosal samples, or duodenal samples (from the area connecting the stomach and small intestine). Clinical scoring systems, such as the Candida score and Candida index, estimate the risk of developing systemic fungal infections in critically ill patients, and include the extent of Candida colonization at multiple body sites in conjunction with other factors (e.g., length of hospital stay, prior use of antibiotics, prior surgery, and illness severity). An average fecal sample is expected to contain less than 10^4 colony-forming units (CFU) per milliliter (mL), but there is no consensus on the correct threshold for IC diagnosis.[1][2] Studies generally classify a concentration of 10^3 to 10^5 CFU/mL as IC.How is IC different from SIFO and SIBO?How is IC different from Candidiasis Hypersensitivity Syndrome?What are some of the main medical treatments for intestinal candidiasis?IC doesn’t require treatment in otherwise healthy people. In premature babies and critically ill patients, reducing or limiting intestinal Candida colonization lowers the risk of developing a systemic fungal infection. This is commonly done with antifungal drugs.Have any supplements been studied for intestinal candidiasis?Although probiotics aren’t likely to prevent invasive fungal infections, it appears that they can reduce the risk of Candida colonization in premature babies and critically ill children.[3][4] Vitamin D supplementation may be effective for reducing the prevalence of Candida colonization as well as systemic Candida infection (as measured by blood and urine levels of Candida). Some studies have also investigated medium-chain triglycerides (MCT) with and without vitamin D. These results are promising, but preliminary.[5][6] Certain compounds extracted from oregano, pine, cinnamon, and coffee suppress Candida growth in cell culture models and denture stomatitis (mild oral inflammation due to thrush), but these haven't been studied in the human GI tract.[7][8][9]How could diet affect intestinal candidiasis?Contrary to popular belief, refined carbohydrate intake doesn’t increase the risk of developing IC, and most yeast found in stool is likely derived from food and saliva.[10][11] Unlike the microbiome, the mycobiome (i.e., the fungal microbiome, which includes Candida) is more closely associated with recent dietary patterns than with long-term habits. Although high-carb diets may produce short-term increases in Candida, they don’t seem to increase risk of IC, and low-carb diets (as well as low-yeast diets) don’t meaningfully affect the risk or severity of IC, either.[10][12][13]Are there any other treatments for intestinal candidiasis?There is little-to-no research on other treatments for IC.What causes intestinal candidiasis?Most cases of IC (and subsequent invasive infection) are seen in preterm infants and critically ill or immunocompromised individuals. Additionally, certain medications, such as antibiotics and steroids, permeable intestines, invasive surgical procedures, hospitalization, and the use of broad-spectrum antibiotics make premature infants more prone to IC and invasive infections.[3] People with diabetes may also be more prone to IC, but these findings are complicated by this population’s comparatively high use of antifungals, antibiotics, and steroids (to control inflammation). Intestinal Candida counts can also be elevated as a result of swallowing oral Candida, and oral candidiasis (overgrowth of yeast in the mouth and throat) can occur in people who wear dentures or take the aforementioned medications.[13][14][15]Who is at risk of developing IC?Frequently asked questionsWhat is intestinal candidiasis?Candidiasis is a fungal infection caused by Candida, a genus of yeast that lives on the skin and inside of the mouth, throat, vagina, and GI tract. Intestinal candidiasis refers specifically to an abnormally high level of Candida detected in samples from feces, rectal swabs, or (rarely) the intestinal mucosa (the lining of the stomach or intestinal tract).What role do yeasts play in the gut?Fungi make up a very small portion of the gut microbiome, with a population estimated at around 1 billion out of the 10 trillion microbes residing there.[13] Most fungi in the gut are forms of yeast, such as Candida, Saccharomyces, and Malassezia. The genus Candida includes many species, but the most common is C. albicans. Depending on the sampling site and preparation, yeasts are detected in the feces of 4–97% of healthy people.[1][16] The fungal microbiome, or mycobiome, of the human gut is poorly understood. It is much lower in abundance, diversity, and stability than the bacterial microbiome but more unique to each individual.[16] Some evidence suggests that most fungi aren’t inhabitants of the gut at all, but rather ingested with food and saliva (from the oral mycobiome).[13] To further complicate matters, fungi are dimorphic, meaning they can exist in different forms, and can change to a hyphal form, which is less adapted to the human gastrointestinal (GI) tract and potentially more pathogenic (likely to cause disease). Because gene expression differs between the fungal and hyphal forms of the same species, accurate identification and quantification (measuring the number) is challenging.[16] The role of the mycobiome in human health and disease is largely unknown. Some yeast species, such as C. albicans, exist as pathobionts, which are potential pathogens that remain harmless or even beneficial under normal conditions. Others, such as Saccharomyces boulardii, have known probiotic effects.[17] Though intestinal colonization is normal and harmless in healthy individuals, certain species of yeast can cause disease in immunocompromised individuals, premature newborns, and cases of surgery or inflammatory bowel disease (IBD) that damage the physical barrier of the intestinal wall.[18][19][20] In these cases, microbes that reside in the gut can easily overcome the cellular or physical defenses of the immune system, escaping the intestines and entering the circulatory system. Yeast may also play a role in the development of antibiotic-associated diarrhea and certain respiratory and skin allergies, but more research is needed to establish causality.[1] Click here to read the full answer to What role do yeasts play in the gut?Why aren’t intestinal yeasts a problem for healthy people?Many microbes in the intestines are potentially pathogenic, which means they could cause disease in certain circumstances. Their potential for causing disease is controlled by immune cells, the physical barrier of the intestinal walls, and other resident microbes of the GI tract.[1][23] In healthy people, the innate immune system controls Candida colonization by initiating the production of antimicrobial peptides (amino acid chains), and neutrophils (cells of the innate immune system) prevent Candida from escaping the GI tract and causing infection. Other microbes may communicate with the innate immune system to induce an antimicrobial response or produce metabolites, which suppress Candida growth.[23] There is also some evidence that the GI tract in mammals induces specific characteristics in Candida that make it less likely to cause disease. In other words, it trades its virulence (or ability to cause disease) for better chances of survival in the human gut.[23] Click here to read the full answer to Why aren’t intestinal yeasts a problem for healthy people?What are the other forms of candidiasis?Candidiasis can occur in the mouth and throat (often referred to as thrush), esophagus, or vagina (commonly called a yeast infection). Invasive candidiasis is an infection of other parts of the body, including the brain, blood, and heart. Candidemia, or a blood infection, is the most common form of invasive candidiasis. Candiduria, or Candida in the urine, is also a sign of invasive infection. Click here to read the full answer to What are the other forms of candidiasis?Does Candida play a role in GI diseases?Though it’s unclear whether Candida plays a causal role, researchers have found low or altered fungal diversity in patients with inflammatory bowel disease (IBD),[26] and emerging evidence indicates that Candida species tend to predominate in the mycobiomes of patients with IBD.[27] Some species of Candida can colonize and delay the healing of gastric and intestinal ulcers. One small observational study found that certain species were detectable in inflamed regions of the intestines in Crohn’s disease but absent from the non-inflamed areas.[18] One nonrandomized, uncontrolled study reported that two weeks of antifungal treatment in patients with ulcerative colitis and significant fungal colonization reduced disease activity and mucosal inflammation.[28] Without diagnostic criteria or the quantification of Candida colonization in these studies, however, it’s impossible to determine whether these cases would be characterized as IC or some form of fungal imbalance. Patients with IBD often use certain medications that increase the risk for fungal disease, which could also explain these findings.[19] Candida abundance is also associated with visceral hypersensitivity (a heightened sense of pain in response to normal gut functions) in a subgroup of IBS that responds well to antifungal treatment.[29] Exploratory studies have noted that higher Candida abundance is associated with more severe bloating.[30] Though Candida species are present in people with and without IBS, other emerging evidence suggests that C. albicans in people with IBS is genetically distinct from the same species in healthy people. The correlations between Candida and certain bacteria also differ between people with IBS-D and healthy controls.[31] There is still no conclusive link between IBS and Candida, though. Despite some unique variations in IBS versus healthy controls, the mycobiome isn’t a useful biomarker for IBS due to high levels of individual variability and lack of any causal relationships. Click here to read the full answer to Does Candida play a role in GI diseases?What are the main signs and symptoms of intestinal candidiasis?IC does not appear to have perceptible symptoms.[1] Controversial publications from the 1970s and ’80s claimed that intestinal Candida overgrowth lead to a long list of ailments, including fatigue, GI discomfort, recurring yeast infections, arthritis, acne, migraine headache, and heart issues, although most of these claims have been debunked.[1] IC may lead to diarrhea associated with antibiotics and irritable bowel syndrome with diarrhea (IBS-D), but more research is needed.What are the complications of IC?IC may lead to invasive candidiasis in susceptible individuals, such as critically ill or immunosuppressed patients and premature babies. This occurs when fungi — most commonly the Candida species — escape the intestinal tract and infect other areas, such as the blood, brain, or heart. This leads to a fever that doesn’t go away after treatment with antibiotics, and can eventually progress to sepsis (a life-threatening immune system response) and death if untreated. The mortality rate of candidemia (a Candida infection in the bloodstream) is estimated to be over 25% in premature infants and roughly 58% in adults who don’t receive timely treatment.[21] Click here to read the full answer to What are the complications of IC?How is intestinal candidiasis diagnosed?Intestinal yeast colonization is estimated from rectal swabs, fecal samples, mucosal samples, or duodenal samples (from the area connecting the stomach and small intestine). Clinical scoring systems, such as the Candida score and Candida index, estimate the risk of developing systemic fungal infections in critically ill patients, and include the extent of Candida colonization at multiple body sites in conjunction with other factors (e.g., length of hospital stay, prior use of antibiotics, prior surgery, and illness severity). An average fecal sample is expected to contain less than 10^4 colony-forming units (CFU) per milliliter (mL), but there is no consensus on the correct threshold for IC diagnosis.[1][2] Studies generally classify a concentration of 10^3 to 10^5 CFU/mL as IC.How is IC different from SIFO and SIBO?Small Intestinal Fungal Overgrowth (SIFO) is characterized by high numbers of fungi in the small intestine, while Small Intestinal Bacterial Overgrowth (SIBO) is caused by elevated numbers of bacteria. Much more is known about bacterial overgrowth, but it’s still poorly understood. It is thought that microbial overgrowth could play a role in unexplained GI symptoms such as gas, bloating, and abdominal pain. Recent studies have used more accurate sampling and quantification methods to detect Candida and other forms of fungi in the small intestine. Though sampling this way can accurately detect intestinal overgrowth of bacteria and fungi, these studies found that the rates of unexplained GI symptoms were similar in participants regardless of their fungal colonization. In a study that sampled the gastric (stomach) mucosa of people with dyspepsia (indigestion) or ulcer complaints, Candida was present in approximately 27% of the participants (with no control samples for comparison). A follow-up study compared participants with and without SIFO, and found no differences in the severity of the participants’ GI symptoms. In that study, 25% of the participants with unexplained digestive complaints also had SIFO. Though prescription antacid medications and altered gut motility (organized muscular contractions) may increase the risk of developing SIBO, they aren’t associated with "
