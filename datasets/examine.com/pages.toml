["https://examine.com/categories/cancer"]
title = "Cancer: Common conditions and treatments"
description = "Cancer is a collection of diseases characterized by uncontrolled cell replication and growth.[1] Solid cancers form a harmful tumor from a specific type of tissue, while hematological (blood) cancers form from lymphatic and blood tissues.[2] As cancers grow, they become more malignant, and the most advanced cancers spread to other areas of the body in a process called metastasis. Some types of cancer can be treated with a high margin of success, while other cancers usually lead to death.[3]"
full_description = "OverviewsummarydietsupplementsAll ConditionsExamine DatabaseResearch FeedFrequently asked questionsReferencesWhat is cancer?Cancer is a collection of diseases characterized by uncontrolled cell replication and growth.[1] Solid cancers form a harmful tumor from a specific type of tissue, while hematological (blood) cancers form from lymphatic and blood tissues.[2] As cancers grow, they become more malignant, and the most advanced cancers spread to other areas of the body in a process called metastasis. Some types of cancer can be treated with a high margin of success, while other cancers usually lead to death.[3]Why is cancer research important?Who is most at risk for cancer?Which physician specialties are involved in treating cancer?How could diet affect cancer?Epidemiological studies suggest that dietary patterns are a large contributor to the global cancer burden and are a key area to focus on for preventing cancer.[4] A number of diet intervention studies confirm the role of diet in cancer risk by looking at markers of cancer risk,[5] but few interventions have actually tested the effect of diet on preventing cancer.[6][7] The majority of dietary interventions focus on either preventing cancer recurrence, slowing progression, or managing the symptoms of cancer and cancer treatments.[8][9][10] Generally speaking, weight management through diet and antioxidant-rich diets are focal points in nutrition for cancer research.Does red meat cause cancer?Is processed meat bad for me?Which supplements are the most studied for cancer?Some examples of well-studied herbal supplements in the context of cancer are traditional Eastern herbal medicines, garlic, caffeine, guarana, spearmint and peppermint. A decades-old body of research also points to the use of cannabis and CBD for managing symptoms of cancer treatment. Vitamins and nutrients that have been thoroughly studied include vitamin D, vitamin E, vitamin C, vitamin A and beta-carotene, selenium, zinc, and combinations of these vitamins. Supplements that may improve gut health symptoms caused by cancer treatment include glutamine, probiotics, ginger, short-chain fatty acids, proteolytic enzymes, kefir, honey, and propolis, among many others.Do B vitamins increase the risk of getting cancer?Can creatine cause cancer?All Conditions and GoalsBasal Cell CarcinomaBladder CancerBone CancerBrain CancerBrain TumorBreast CancerCachexiaCancer-Related FatigueCancer-Related PainCervical CancerChemotherapy Side-EffectsColorectal CancerEndometrial CancerEsophageal CancerGastrointestinal CancerGeneral Cancer Care and PreventionHand-Foot SyndromeHead and Neck CancerKidney CancerLiver CancerLung CancerMouth CancerMyeloid MalignanciesOvarian CancerPancreatic CancerPenile CancerProstate CancerRadiation Therapy Side-EffectsSkin CancerStomach CancerTesticular CancerThyroid CancerUrethral Gland CancerExamine Database: CancerProstate CancerBreast CancerColorectal CancerResearch FeedRead all studies The association between nutrition status and long COVID in people with cancerFebruary 26, 2025/#Dietitians•Cancer•Immunity & Infectious Disease+1 moreIn this cross-sectional study that included 834 participants with cancer from 4 hospitals in China, the odds of developing long COVID were greater in the participants who were at an increased risk of malnutrition.ShareLinkEmailAdd noteHigher olive oil consumption is linked to a lower mortality riskFebruary 21, 2025/#Dietitians•Cancer•Diets & Foods+4 moreYoga for fatigue and quality of life and sleep in cancerFebruary 18, 2025/Sleep•Cancer•Energy & Fatigue+2 moreVitamin D sufficiency is associated with better outcomes for people with breast cancerFebruary 11, 2025/Women’s Health•Cancer•Breast Cancer+1 moreThe role of dietary and supplemental vitamin C in cancer riskFebruary 10, 2025/#Dietitians•Vitamins & Minerals•Cancer+2 moreDietary nitrites, but not nitrates, may be linked to a higher gastric cancer riskFebruary 10, 2025/#Dietitians•Diets & Foods•Gut Health+3 moreEating more cruciferous vegetables may be linked to a lower risk of cancerFebruary 10, 2025/#Dietitians•Cancer•Diets & Foods+5 moreCan a Mediterranean diet reduce the risk of head and neck cancer?February 7, 2025/#Dietitians•Cancer•Head and Neck Cancer+1 moreNo link between dietary advanced glycation end-products and cancer riskFebruary 7, 2025/#Dietitians•Diets & Foods•Cancer+2 moreCan CBD improve anxiety in women with breast cancer?February 3, 2025/Cancer•Mental Health•Editor's Picks+2 moreCan drinking coffee or tea affect the risk of glioma?January 31, 2025/Cancer•Coffee•Tea (Camellia sinensis)Guarana may reduce cancer-related fatigueJanuary 27, 2025/#Dietitians•Cancer•Herbal Supplements+3 moreLowering the omega-6-to-omega-3 ratio to improve prostate cancerJanuary 24, 2025/#Dietitians•Cancer•Men’s Health+3 moreBread intake and cancer riskJanuary 23, 2025/#Dietitians•Diets & Foods•CancerPrevalence of supplement use during chemotherapy treatment for ovarian cancerJanuary 22, 2025/#Dietitians•Cancer•Women’s Health+4 moreFrequently asked questionsWhat is cancer?Cancer is a collection of diseases characterized by uncontrolled cell replication and growth.[1] Solid cancers form a harmful tumor from a specific type of tissue, while hematological (blood) cancers form from lymphatic and blood tissues.[2] As cancers grow, they become more malignant, and the most advanced cancers spread to other areas of the body in a process called metastasis. Some types of cancer can be treated with a high margin of success, while other cancers usually lead to death.[3]Why is cancer research important?Despite affecting 1 in 6 people and ranking high on causes of mortality globally, 33–50% of deaths from cancer are from outcomes caused by modifiable behaviors. Some chronic infections are risk factors for cancer, which is a particularly important issue for prevention efforts.[11] Click here to read the full answer to Why is cancer research important?Who is most at risk for cancer?Cancer risk increases due to controllable and uncontrollable factors. Often, a specific risk factor increases risk for a specific type of cancer. Behavioral risk factors include tobacco use, excess alcohol consumption, poor quality dietary patterns, obesity (with caveats), lack of physical activity, and excessive UV radiation. Other modifiable risk factors include viral infection (i.e. HPV) and environmental exposures like aflatoxin and air pollution).[11] Some risk factors for cancer cannot be changed. Few genetic mutations cause cancer, but many genetic mutations interact with other exposures to increase or decrease cancer risk. This is called the “two-hit hypothesis”.[12] Click here to read the full answer to Who is most at risk for cancer?Which physician specialties are involved in treating cancer?Hematologists are physicians who specialize in blood based cancers. Oncologists deal with solid tumor cancers. Radiologists specialize in radiation treatment. Surgeons specialize in surgical treatments. Medical oncologists specialize in chemotherapy, hormone therapy, biologics therapy, and immunotherapies. Click here to read the full answer to Which physician specialties are involved in treating cancer?How could diet affect cancer?Epidemiological studies suggest that dietary patterns are a large contributor to the global cancer burden and are a key area to focus on for preventing cancer.[4] A number of diet intervention studies confirm the role of diet in cancer risk by looking at markers of cancer risk,[5] but few interventions have actually tested the effect of diet on preventing cancer.[6][7] The majority of dietary interventions focus on either preventing cancer recurrence, slowing progression, or managing the symptoms of cancer and cancer treatments.[8][9][10] Generally speaking, weight management through diet and antioxidant-rich diets are focal points in nutrition for cancer research.Does red meat cause cancer?Quick answer:You may have read the headlines that red meat causes cancer. We investigated the actual science. On a population wide basis, red meat is definitely associated with cancer. The association has been shown numerous times, but is fairly weak in relevance. The most well-controlled study noted an 0.2-fold increase. Please note association; this has not yet been shown through interventions nor is the cause known. If we are to answer 'does red meat cause cancer', the answer is 'we do not know' Epidemiology Recently, a study published controlled for other dietary confounders as well as activity and the basics (smoking, alcohol, social class) and found a Hazard Ratio of 1.16 (+16% risk) for red meat and cancer.[35] Past studies of the same manner find Hazard ratios around 1.2 as well,[36] although this latter study was criticized for its controls.[37] It should be noted that the 20% increased risk was derived from comparing the top quintile (20%) against the bottom quintile of meat consumption, and means a 0.2-fold increase. A select few studies look at risk of cancer in general, whereas others look at specific forms of cancer. This is due to red meat intake being weakly but confidently associated with various forms of cancer.[38] A netherlands cohort found an association with a hazard ratio of 2.66 for unprocessed red meat and 3.47 in regards to esophageal squamous cell carcinoma risk in men.[39] No association was found with gastric cancers or esophageal adenocarcinoma, nor esophageal squamous cell carcinoma risk in women. Colorectal cancer risk is associated with inactivity and low plant consumption[40] Some studies that measure fiber intake do not find a strong association with distal colorectal cancer risk and red meat.[41] Interestingly, chicken skin and eggs have been found to confer more risk than lean meats (in a population of Hawaiins), although the strongest correlation was found with total caloric intake.[42] The Relative Risk ratios tended to not exceed 2.0 overall however. Difference between processed and unprocessed? Many studies define 'processed' red meats as those that have had added nitrates, due to the correlation between nitrates in meats and nitrosamine formation in the body. These meats tend to refer to sausages and hot dogs, bacon and other pink meat such as ham, cold cuts, and croquettes. Compounding and Contributing factors Risk of colorectal cancer from red meat rises to an 8.8-fold risk when the subject also smokes, and may be due to carcinogens found in the meats as measured by a preference for well-done meat (higher source of the carcinogens Heterocyclic Amines and Polyaromatic Hydrocarbons).[43] In persons with overactive NAT1/NAT2 enzymes, there is an increased risk of colorectal cancer from meats.[44][45] This may be due to rapid bioactivation of Heterocyclic Amines, which are known colonic carcinogens. One study noted that this phenotype did not associated with an increased cancer risk (OR=1.43) until HCA intake was measured (OR=6.50); those without the phenotype had a lesser increase in risk (OR=2.32).[46] Other P450 enzymes may also contribute to a lesser extent.[47] In studies that measure HCAs, they correlate similarly if not better with cancer than red meat does itself.[48][49][50] As NAT1/NAT2 enzymes metabolize caffeine only after CYP1A, a caffeine tolerance test can be used to assess personal susceptibility to HCA-induced carcinogenesis risk via CYP1A.[51] This has been used in some studies[43] and, informally, might be a good indicator of risk if taken with some skepticism (with more caffeine tolerance correlating with more risk). Compounding factors tend to be unhealthy habits like smoking and alcohol; things that are either pro-oxidant in nature or interact with liver enzymes Standard correlations Many studies note that people who consume more red meat also tend to consume more energy overall and have a higher BMI, eat less fruits and vegetables, and have higher rates of smoking and alcohol consumption with a slightly lower education level.[39][35] Socioeconomic class has also been related to red meat and mortality (lower socioeconomic classes eat more red meat) but this does not seem to fully explain the link either.[52] Exercise is also a factor to be considered, specifically cardiorespiratory fitness, as an indicator of diet.[53] If not otherwise controlled for, these common confounders can influence the results of survey research. Causation or Causes? As there have been no interventions, it cannot be concluded that red meat causes cancer or mortality. It is associated, but causation has not yet been established. If it were to cause cancer or increased mortality, suspect areas could be as follows. Meat mutagens Various compounds produced in meats during cooking and processing have possible pro-carcinogenic effects when consumed by humans. T The content of HCAs and PAHs are more indicative of preparation method than of meat selected, and tend to be associated with preparation methods of red meats rather than chicken or fish (barbecuing, flame grilling). Nitrosamines tend to be associated with pink meats such as ham or bacon, although their levels are even higher in fermented fish products. Prevention Techniques? In all studies that controlled for vegetable intake, a greater risk was seen in people not consuming vegetables. On a whole, vegetable intake seems to confer a protective effect.[35][39] In addition, one research group noted that although red meat causes increases in a variety of cancers[38] that fruits and veggies seemed to confer protective effects against just as wide a variety, and were more protective in cohorts that were more at risk.[54] Fruits appeared to be more protective than vegetables in this study. Click here to read the full answer to Does red meat cause cancer?Is processed meat bad for me?Quick answer:Processed meat products are associated with cancer and mortality in survey research, but to a small degree. They are likely unhealthy, technically speaking, but the increase in mortality/cancer is overblown. Processed meat, in the following sections, tends to refer to pink and cured meat products that use the preservative sodium nitrate. This extends to hams, hot dogs, bacon products, and various pre-packaged deli meats. Although there are similarities between red meat products and processed meats, the minor differences include cooking possibly making carcinogens and processed meat having a higher nitrate content Survey Research In the following sections, hazard ratios (HRs) and confidence intervals (CIs) are used. A hazard ratio is a simple way of demonstrating the increased risk (usually by comparing one group against another defined group, such as high meat intake against no meat intake) and while 1.00 means no significant difference, 2.00 is a doubling and 4.00 a quadrupling while 0.50 and 0.25 are a half and quarter; negative values cannot occur, and a hazard ratio of 2-4 as a minimum to show a magnitudal difference is usually desirable (hazard ratios be"
