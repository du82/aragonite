description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Our mission is to bring you the most evidence-based, impartial source of nutrition information available. We practice this by ensuring we have a diverse team of researchers who fully read all relevant scientific papers completely and have no conflicts of interest. Our goal is to offer neither magical solutions nor pills to help you with your health. Instead, we offer a nuanced and context-appropriate analysis of all available evidence regarding any nutrition or supplement topic, which gives you the necessary information to make the best for you. We are ardently against any form of sensationalism or emotional manipulation in order to garner more traffic or sales. Finally, we are very clear that any and all medical issues should be brought to the attention of your attending physician; we are not an alternative to professional medical advice. We accept no advertising or content from outside sources on Examine. As such, all content found on our site is created by staff members of Examine. Furthermore, all staff at Examine are free from any conflicts of interest. Each member declares that they do not benefit directly or indirectly from any external source that may bias our analysis. The researchers have full independence to research and analyze scientific papers. Non-researcher employees do not weigh in on any of our published conclusions. All revisions of our supplement pages are available to the public so that they may see see how we update our pieces with the latest research. All the information published on Examine goes through multiple levels of editing to ensure that the information presented is accurate, evidence-based, and unbiased. Almost any article on Examine will have undergone more than 10 hours of focused writing/editing/reviewing before being published. Most articles take dozens of hours, from conception to publication. Our supplement pages are regularly updated and thus are the summation of hundreds of hours of work. We’ve added this as a tongue-in-cheek note — because we accept no external money nor external content, we have no need for an advertising policy. Therefore, we have nothing to clarify or declare in regards to advertising."
