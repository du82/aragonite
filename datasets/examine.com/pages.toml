["https://examine.com/user/kamalpatel"]
title = "About Kamal Patel - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Kamal Patel is the co-founder of Examine.com, the Internet’s largest database of nutrition and supplement research. Kamal’s been a nutrition researcher for nearly twenty years, and an author on widely-cited nutrition and clinical research papers, including: Fructose, high-fructose corn syrup, sucrose, and nonalcoholic fatty liver disease or indexes of liver health: a systematic review and meta-analysis. American Journal of Clinical Nutrition, 2014 Self-measured blood pressure monitoring in the management of hypertension: a systematic review and meta-analysis. Annals of Internal Medicine, 2013 Kamal holds two master’s degrees from the Johns Hopkins University, in business and in public health, and is on hiatus from a PhD in Nutrition during which he investigated links between diet and chronic pain. From 2008 through 2010, Kamal was a part of the team contracted by the Institute of Medicine to systematically review vitamin D and calcium evidence for the revised Dietary Reference Intakes. He was also a primary reviewer for the largest clinical trial registry in the world, the Clinicaltrials.gov housed by the National Institutes of Health, checking to make sure registered clinical trials were methodologically sound. In addition, he was a peer reviewer for several academic journals. Kamal also has a personal interest in mindfulness meditation, having helped with research at the Benson-Henry Institute for Mind Body Medicine at Massachusetts General Hospital. Two questions weigh heavily on Kamal’s mind. First, given the thousands of important studies published each year, how can the average person keep up, while still focusing on what’s most important for themselves? Second, how do all the various aspects of diet and health fit together, given the complexity of nutrition science all the way from the micro level (nutritional biochemistry) to the macro level (nutritional epidemiology)? Answering those questions is both Kamal’s favorite hobby and his job as co-founder and director of Examine.com. He’s published peer-reviewed studies on a variety of topics, from vitamin D and cardiovascular risk to fructose and liver health. But no single study is enough to explain major facets of health. Thus, Kamal’s views on research (and life) can be summarized by Maimonides's timeless saying: “Teach thy tongue to say ‘I do not know,’ and thou shalt progress.” All too often, experts overestimate their own knowledge and certainty. Kamal steers the Examine.com team towards a big picture perspective, interpreting evidence with caution and objectivity."
