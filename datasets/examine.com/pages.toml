title = "Autoimmune Disease: Common conditions and treatments"
description = """
Our immune system keeps us healthy by fighting off invading pathogens while simultaneously sparing our own cells and tissues. In healthy people, the immune system is able to distinguish between the self and nonself, a concept called self-tolerance. When the body is functioning properly, the immune system maintains self-tolerance while working in the background to protect the body from infections. 
In people with autoimmune disease, self-tolerance does not function correctly, causing the body to turn the powerful weapons of the immune system against self molecules, causing inflammation and injury. Autoimmune disease can be systemic, affecting multiple parts of the body, such as in diseases like systemic lupus erythematosus (SLE). They can also be organ-specific, such as in type 1 diabetes, where the immune system targets and destroys the insulin-producing cells of the pancreas."""
full_description = "OverviewsummarydietsupplementsAll ConditionsExamine DatabaseResearch FeedFrequently asked questionsReferencesWhat is autoimmune disease?Our immune system keeps us healthy by fighting off invading pathogens while simultaneously sparing our own cells and tissues. In healthy people, the immune system is able to distinguish between the self and nonself, a concept called self-tolerance. When the body is functioning properly, the immune system maintains self-tolerance while working in the background to protect the body from infections. In people with autoimmune disease, self-tolerance does not function correctly, causing the body to turn the powerful weapons of the immune system against self molecules, causing inflammation and injury. Autoimmune disease can be systemic, affecting multiple parts of the body, such as in diseases like systemic lupus erythematosus (SLE). They can also be organ-specific, such as in type 1 diabetes, where the immune system targets and destroys the insulin-producing cells of the pancreas.What is a flare?Is it true that even healthy people can have autoantibodies?How could diet affect autoimmune disease?Preclinical studies show that dietary interventions, such as elimination diets and calorie restriction in various forms (e.g., chronic caloric restriction, time-restricted feeding (TRF), and intermittent fasting, etc.) can potentially have beneficial effects on the immune system. However, more human trials are still needed to provide a better understanding of when, and in whom, these interventions are effective. It is also important to keep in mind that the efficacy and safety of diet interventions will likely vary from person to person, with some potentially being harmful for certain people. Metabolic status in the body is intimately connected to immune function. For example, undernourished people tend to be more susceptible to infections, while the nutrient excess associated with the Western diet may be associated with increased risk of autoimmunity.[1] This suggests that in the future, appropriate diet interventions could potentially help to reduce disease activity in people with active disease, or even lessen disease risk in those who are susceptible.Which supplements are of most interest for autoimmune disease?Many supplements, particularly those with antioxidant or anti-inflammatory activity, have been investigated for their ability to reduce the severity or incidence of autoimmune disease. To date, some of the more promising evidence is for vitamin D and fish oil, which were linked to reduced incidence of autoimmunity in a large randomized controlled trial.[2] Further research is needed to better understand the way that supplements may affect the incidence or severity of autoimmunity in different people.Supplement GuideClick here to read the Allergies & Immunity Supplement GuideAll Conditions and GoalsAplastic AnemiaAutoimmune DiseaseCeliac DiseaseCrohn's DiseaseDermatitisGraves’ DiseaseHashimoto's diseaseLupus NephritisMultiple Sclerosis (MS)MyositisSclerodermaSystemic Lupus ErythematosusExamine Database: Autoimmune DiseaseMultiple Sclerosis (MS)Celiac DiseaseDermatitisSystemic Lupus ErythematosusResearch FeedRead all studies The role of vitamin D and zinc in the risk of alopecia areataNewMarch 5, 2025/#Dietitians•Vitamins & Minerals•Autoimmune Disease+5 moreIn this meta-analysis of 34 observational studies, vitamin D deficiency was associated with a higher risk of alopecia areata, and participants with alopecia areata had lower blood levels of vitamin D and zinc.ShareLinkEmailAdd noteWhich nutrients can affect the risk of Graves’ disease?NewMarch 5, 2025/Autoimmune Disease•CopperHigher dietary acid load may be associated with greater severity of autoimmune skin diseaseFebruary 28, 2025/#Dietitians•Diets & Foods•Autoimmune Disease+3 moreCan CoQ10 improve symptoms of multiple sclerosis?February 25, 2025/Pain•Autoimmune Disease•Multiple Sclerosis (MS)+1 moreDoes a Mediterranean diet improve multiple sclerosis?February 21, 2025/Autoimmune Disease•Multiple Sclerosis (MS)•Mediterranean DietIs coffee or caffeine consumption associated with improvements in multiple sclerosis?January 31, 2025/Autoimmune Disease•Multiple Sclerosis (MS)•CoffeeWhich supplements can improve Hashimoto’s thyroiditis?January 30, 2025/Autoimmune Disease•Selenium•Vitamin D+1 moreSupplemental vitamin D for inflammatory bowel diseaseJanuary 22, 2025/Autoimmune Disease•Gut Health•Inflammatory Bowel Disease (IBD)+1 moreDoes adding myo-inositol to supplemental selenium improve subclinical hypothyroidism?January 17, 2025/Energy & Fatigue•Autoimmune Disease•Hypothyroidism+2 moreA Mediterranean diet may reduce BMI in people with multiple sclerosisJanuary 16, 2025/#Dietitians•Autoimmune Disease•Fat Loss+3 moreCurcumin for systemic lupus erythematosusDecember 27, 2024/Autoimmune Disease•Systemic Lupus Erythematosus•CurcuminA synbiotic supplement for systematic lupus erythematosusDecember 24, 2024/Autoimmune Disease•Systemic Lupus Erythematosus•SynbioticsAre higher doses of aspirin more effective in acute Kawasaki disease?December 6, 2024/Pregnancy & Children•Autoimmune DiseaseMineral intake and all-cause mortality in people with atherosclerotic cardiovascular diseaseNovember 27, 2024/#Dietitians•Vitamins & Minerals•Autoimmune Disease+5 moreMelatonin levels in people with multiple sclerosisNovember 21, 2024/Pain•Autoimmune Disease•Multiple Sclerosis (MS)+1 moreFrequently asked questionsWhat is autoimmune disease?Our immune system keeps us healthy by fighting off invading pathogens while simultaneously sparing our own cells and tissues. In healthy people, the immune system is able to distinguish between the self and nonself, a concept called self-tolerance. When the body is functioning properly, the immune system maintains self-tolerance while working in the background to protect the body from infections. In people with autoimmune disease, self-tolerance does not function correctly, causing the body to turn the powerful weapons of the immune system against self molecules, causing inflammation and injury. Autoimmune disease can be systemic, affecting multiple parts of the body, such as in diseases like systemic lupus erythematosus (SLE). They can also be organ-specific, such as in type 1 diabetes, where the immune system targets and destroys the insulin-producing cells of the pancreas.What is a flare?Symptoms of many autoimmune diseases tend to increase during the active phases of the disease, and lessen or even go away during periods of remission. The term ‘flare’ refers to periods of active disease, during which symptoms can return or new symptoms develop. Flares sometimes seem to come out of nowhere, but are also often triggered by environmental factors such as injury, stress, or infection. Anti-inflammatory and/or immunosuppressive drugs are used to treat flares and bring about remission. Click here to read the full answer to What is a flare?Is it true that even healthy people can have autoantibodies?Yes. Healthy people have autoreactive B cells and T cells that lead to the production of natural autoantibodies (NAA) that bind to self-antigens, but with only low to moderate affinities. In contrast to the harmful type of autoantibodies that cause the immune system to target self-tissues, NAA are beneficial and play a role in regulating[3] the immune system. Although NAA were first discovered[4] back in 1963, their exact role in the body still isn’t clear. They are thought to play a role in the first line of defense to infections and may be protective[5] in people with autoimmune disease.[6] Click here to read the full answer to Is it true that even healthy people can have autoantibodies?How could diet affect autoimmune disease?Preclinical studies show that dietary interventions, such as elimination diets and calorie restriction in various forms (e.g., chronic caloric restriction, time-restricted feeding (TRF), and intermittent fasting, etc.) can potentially have beneficial effects on the immune system. However, more human trials are still needed to provide a better understanding of when, and in whom, these interventions are effective. It is also important to keep in mind that the efficacy and safety of diet interventions will likely vary from person to person, with some potentially being harmful for certain people. Metabolic status in the body is intimately connected to immune function. For example, undernourished people tend to be more susceptible to infections, while the nutrient excess associated with the Western diet may be associated with increased risk of autoimmunity.[1] This suggests that in the future, appropriate diet interventions could potentially help to reduce disease activity in people with active disease, or even lessen disease risk in those who are susceptible.Which supplements are of most interest for autoimmune disease?Many supplements, particularly those with antioxidant or anti-inflammatory activity, have been investigated for their ability to reduce the severity or incidence of autoimmune disease. To date, some of the more promising evidence is for vitamin D and fish oil, which were linked to reduced incidence of autoimmunity in a large randomized controlled trial.[2] Further research is needed to better understand the way that supplements may affect the incidence or severity of autoimmunity in different people.References"
