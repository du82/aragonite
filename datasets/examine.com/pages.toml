["https://examine.com/about"]
title = "About us - Examine"
description = "Examine simplifies nutrition and supplementation — through meticulous analysis of the latest scientific research — to help answer your questions on how to be healthier."
full_description = "Table of Contents1Mission Statement2What is Examine?3How is Examine funded?4How & why did Examine start?5Our Team6Why can you trust Examine?Mission StatementExamine analyzes and summarizes the latest scientific research to help you be healthier.What Is Examine?Examine is the largest database of nutrition and supplement research on the internet. We have more than 30 researchers on our team, with half working full time for Examine.Founded in early 2011, Examine’s mission is to analyze the full body of evidence to help you be healthier. As an educational organization, we are not affiliated with any supplement or food company, and our research team is contractually obligated to have no conflicts of interest.All of our evidence summaries are fully referenced, on topics ranging from popular supplements like fish oil and vitamin D to the more controversial nutrition topics like soy or saturated fat.We also take an evidence-based approach to common questions our readers ask, such as the optimum amount of daily protein, and the evidence (or lack thereof) for common nutrition myths and fads such as detoxes.At Examine, we’re not here to tell you what to do. Instead, we simply tell you what the evidence says. And in cases where the research is mixed, we make that clear, too.How is Examine funded?Examine is an entirely independent organization, and does not accept any money from outside sources.For the vast majority of nutrition websites, revenue is directly proportional to pageviews or products sold — whether they be supplement bottles or diet plans. Thus, rather than an evenhanded and thorough interpretation of the evidence, for many websites, sensationalism sells (read more on sensationalism).Rather, 100% of our revenue is generated from additional research syntheses that we sell to both health professionals and laypeople: Examine+. All of the information on the website is freely accessible; these additional informational products are meant for those looking for added depth and step-by-step instructions.We do not allow:DonorsSponsorsConsulting clientsAdvertisementsAffiliationsWe have a very strict no-gift policy for our staff members. Even books that are sent our way are simply deposited into recycling.How and why did Examine start?Examine is our answer to a fundamental problem: given that nutrition science is incredibly complex and constantly evolving, how can you separate the wheat from the chaff? If a website cites a study, how do you know it’s not cherry-picked or, on the flipside, methodologically flawed?For more, see Our Story.In other words, who can you trust to be completely objective?We decided to address this problem by building a systematic and objective database, free from advertising or industry partnerships. We never start with an objective, like low-carb or high-carb, pro-supplement or anti-supplement. Rather, we simply report on all the evidence that’s been published.EditorsThe editors of Examine perform the primary job of collating scientific research into a cohesive picture.Kamal PatelDirectorMPH, MBAKamal is cofounder and director of Examine. He holds two master's degrees from Johns Hopkins University, in business and in public health, and is on hiatus from a PhD in nutrition for which he investigated links between diet and chronic pain. He's published peer-reviewed articles on vitamin D and calcium, as well as on a variety of clinical research topics, and was recognized by Men's Health UK in 2020 as one of the most influential men in health and fitness. He's also been involved in research on fructose and liver health, on nutrition in low-income areas, and on mindfulness meditation.Read moreGregory LopezMA in molecular biophysics, PharmDGregory Lopez is editor in chief for Examine. He obtained his master’s degree in molecular biophysics from the Johns Hopkins University and his Doctor of Pharmacy degree from the University of Maryland, Baltimore. In his spare time, Greg pursues interests in meditation, psychology, philosophy, and swing dancing.Read moreResearchersResearchers are tasked with poring over primary research and helping collate it.Bill WillisPhD in biomedical scienceAn avid member of the fitness industry for many years, Bill is a postdoctoral fellow at the Ohio State University, where he’s researching the role of metabolic stress in the control of protein synthesis and inflammation.Read moreDaryl NaultBA in psychology, MS in clinical nutrition, MS in integrative medical researchDaryl resides with her partner and her cat in the Pacific Northwest, where she enjoys hiking, camping, and kayaking. Her indoor time consists mostly of analyzing data, learning new skills, teaching research literacy, and doing her own research — which focuses on how the general public uses web-based information to make health decisions.Read moreNick MilazzoMSc in medical science, MPHAfter studying chemistry and biochemistry at Middlebury College as an undergraduate, Nick earned a master’s degree in medical science and public health from the University of Vermont. He is fascinated by the art and science of human improvement, especially as seen through the lenses of medicine, nutrition, fitness, and mindfulness. His Examine duties include analyzing research data and leading the team of researchers working on the Study Summaries. In his spare time, Nick practices Brazilian Jiu-Jitsu and plays chess and the guitar.Read moreMarina ShkayevaPharmDMarina obtained her Doctor of Pharmacy degree from the University of Pittsburgh School of Pharmacy and completed a drug-information residency with a focus on natural medicine research. Afterward, she spent a number of years working in community pharmacy and writing for Natural Medicines. Marina is passionate about preventive care, evidence-based nutrition, and gerontology (the study of aging). In her spare time, she dances ’Froca and samba, cycles, practices yoga, and tries to increase her consumption of fatty fish.Read moreRachel HathcockBSN, RNAfter receiving her BSN, Rachel became a registered nurse and certified research associate. She worked in a variety of clinical settings (with a special focus on emergency medicine), while also managing phase IV research projects and manuscript publications. Outside of work, you might find her trail running, reading a book, or singing a Disney song.Read moreAntonis DamianouMScHaving worked as a personal trainer, online coach, and fitness writer for a decade, Antonis is especially interested in the art and science of optimizing body composition, maximizing physical performance, and maintaining good health. When he is not geeking out over the latest nutrition and supplementation research, Antonis enjoys hitting the weights, taking nature walks in his sunny home country of Cyprus, and playing video games.Read moreMike MurrayRDN, CSCSMike is a registered dietitian and certified strength and conditioning specialist with a Bachelor of Science in nutrition from La Salle University. After years of being led astray by popular bro-scientists in the fitness industry, Mike became engrossed in scientific research to optimize his progress as a bodybuilder and help others achieve their health and body-composition goals. Outside of work, you can find him lifting weights in his basement or cleaning plate after plate at an all-you-can-eat sushi buffet.Read moreMorgan PfiffnerMS in NutritionAn interest in understanding the relationship between diet and disease led Morgan to obtain a bachelor’s degree in chemistry and a master’s degree in nutrition. He is propelled by a passion for the science of health and often struggles to balance a desire for definitive answers with his natural skepticism. He lives in the Pacific Northwest, where his hobbies include traversing forests and making music.Read moreMeredith YetterFrom managing a supplement store in the late 1990s to blogging about health and fitness in the late 2000s, Meredith has been a bit of a nutrition autodidact for over twenty years. She subscribes to way too many health-related newsletters and Facebook groups. A lover of PubMed rabbit holes, Meredith is in the process of investigating some of her family members’ undiagnosed chronic conditions. When she isn’t lifting weights in her basement, Meredith is parenting two sons, caring for a flock of chickens, and taking long walks with her dog. Her husband’s career has given her family the opportunity to live in the most beautiful parts of the United States.Read moreWyatt BrownSearching for ways to improve his health and frequently confused by the conflicting messages from publications and popular authors, Wyatt dove head first into the scientific research and became fascinated by its logic and methods. Contributing to his most respected website has only intensified his interest and motivated him to pursue an education in nutrition. His other interests are too many to count and go through cycles, but music and the natural world are common themes.Read moreLouie NeriBSN with Research Distinction, RNLouie received his BSN with a Distinction in Research from UT Health San Antonio. As an Undergraduate Research Scholar at the Audie Murphy VA Hospital and the Barshop Institute, he published research on nutritional interventions to prevent cognitive decline and manage chronic stroke. Throughout his life, Louie struggled with chronic illnesses that doctors could neither explain nor cure. His desire to improve his own health led to his passion for learning the intricacies of medicine and nutrition science. When he isn’t nerding out on all things nutrition, you can find him figuring out the best ways to make coffee or diving deep into the world of philosophy.Read moreLucas RoldosMSc, PhD(c) in human nutritionLucas is coordinating a clinical trial involving phytochemicals, gut microbiota, and skin health for his PhD in nutrition at McGill University, where he also coordinates a soccer league and works as a teaching assistant. He believes that education and behavioral change benefit both the self (by improving mindfulness, exercise, nutrition, and sleep) and other people (by promoting responsible social and environmental behaviors). If he’s not discussing a new study or woodworking, he’s probably walking his pup, playing sports, trying to repurpose trash, or yelling at children for littering.Read moreThomas M.B. ReichhartMSc in biochemistry, PhD in biomolecular technologyFrom mastering the art of muscles to decoding the biochemical secrets of proteins, Thomas pivoted from a passion for natural bodybuilding to earning a BSc and MSc in biochemistry from Goethe University Frankfurt, followed by a PhD in biomolecular technology from the University of Natural Resources and Life Sciences in Vienna. Outside of work, Thomas can be found lifting weights at the gym, cooking up a storm in the kitchen, or sharing a cup of specialty coffee with friends.Read moreAdel MoussaMSc in physics, M.Ed.Adel discovered his passion for the science of sports and nutrition when he was a student at the University of Münster, where he later worked as a professor. A self-declared natural-born educator, Adel jumped at the chance to “graduate” from running his blog, SuppVersity, to contributing to Examine. He started as a reviewer for the Examine Research Digest (ERD, later NERD, later Study Deep Dives) and is now working on the website and Supplement Guides. When he’s not data-hunting on PubMed or Google Scholar, Adel spends his time “applying his research” at the gym and in the kitchen and cultivating friendships with people who are into health and fitness and with people who are not.Read moreShyam JayaramanMDShyam completed his residency training in general surgery at Vanderbilt University (Nashville, TN) and Anne Arundel Medical Center (Annapolis, MD). He’s currently in practice in Maryland as a general surgeon with a focus on complex abdominal-wall reconstruction. He often nerds out on peer-reviewed research on nutrition, exercise, sleep, and their interplay in physical and cognitive performance and aging. The rest of his spare time is spent on personal health and fitness, cooking, reading fiction, and playing pool or Texas hold’em.Stephan GuyenetBS in biochemistry, PhD in neuroscienceStephan earned a BS in biochemistry at the University of Virginia, then completed a PhD and postdoctoral fellowship in neuroscience at the University of Washington. After doing neuroscience and obesity research for twelve years, he now focuses more directly on improving public health via science communication. He’s particularly interested in the role of the brain in eating behavior and body fatness, and in using emerging evidence to understand, prevent, and treat obesity. He’s the founder and director of Red Pen Reviews, a nonprofit organization that publishes structured expert reviews of popular nutrition books. In his free time, he enjoys being outdoors, growing food, and woodworking.Natalka RoshakAB in philosophy and mathematicsNatalka is a Canadian author, translator, and all-around nerd with a lifelong interest in research. Among other things, she has: studied philosophy and math at Harvard; programmed, administered, and fixed databases; authored over 100 technical articles; blogged for a Fortune 500; and written award-winning fiction.Read moreZia PoonjaBSc in physiology, MDZia completed his undergraduate and medical studies at the University of Saskatchewan and his residency in internal medicine at the University of Alberta. In 2015, after a two-year oncology fellowship, he became a medical oncologist at the University of British Columbia, where he’s now involved in research, clinical trials, and medical education. He founded Healthspan in 2021 to share the latest insights on preventive medicine. He loves powerlifting, discussing health optimization, and being the father of two wonderful children.Brady HolmerBS in exercise science, MSc in Human PerformanceBrady earned his bachelor’s degree (with honors) from Northern Kentucky University and is currently a PhD candidate at the University of Florida, where he’s researching the effects of exercise and sleep deprivation on cardiovascular health. His other research interests include low-carb/keto diets, intermittent fasting, and how lifestyle can be used to optimize performance, health, and longevity. He’s a former Division I collegiate runner and is still an “endurance junkie” who loves to rack up miles on a run or bicycle. Brady spends his free time working on his podcast (Science & Chill) or hanging out with his wife and dog at breweries, where he often plays Scrabble. He also loves reading, but the “unread” section of his bookshelf grows faster than the “read” section. His comfort foods are a spoonful of peanut butter, chili (no beans!), ribeye steak, and dark chocolate (especially when dipped in peanut butter).Thomas SolomonPhDThomas has an undergraduate degree in biochemistry and a PhD in exercise science. He is passionate about human health and performance, data"
