["https://exch.cx/faq"]
title = "eXch / Automatic cryptocurrency exchange"
description = "Instant cryptocurrency exchange - trade LTC, BTC, LN, DASH, XMR, ETH, USDT, DAI, USDC and other cryptocurrencies without registration"
full_description = '''We operate with two pools of addresses for BTC deposits and transfers - mixed and aggregated. In a mixed pool all received and sent transactions are mixed together and there is no way to discover how many people are behind certain addresses and traceability is extremely difficult, which is very good for privacy but bad for risk scoring. In the aggregated pool all transactions we receive from users are collected on a known single address which is also used to send payments, what will clearly show you have interacted with our exchange and it's good for interacting with other major exchanges to avoid any risks of frozen funds. If you have selected the slow (or "free") fee mode during the order creation, we have sent Bitcoin to you and used the lowest possible mining fee so you don't have to pay it. The confirmation of a such transaction might vary from 12 hours to around a week, depending on the current mempool workload on the Bitcoin network. You can speed it up by using your wallet's CPFP functionality. Since the unconfirmed transaction we have sent to you is spendable, you can spend it with a higher fee to incentivize confirmation of both transactions, which is the most simple way to get it included into the blockchain. We recommend using the quick fee mode if you need your transaction confirmed fast, but we will charge you the blockchain mining fee. Due to the fact we are using a single wallet for all incoming and outgoing Monero payments and its protocol limitations of UTXOs being spendable strictly after 10 confirmations, multiple orders involving Monero within our system may cause delay to your order, since we are only able to process one order once a UTXO from a previous order is fully confirmed. Bitcoin Lightning (also BTCLN or LN) network is a very dynamic system in its early development stage still but evolving rapidly. Sometimes the payout of your invoice may fail due to a variety of reasons and some of them are known: Our communications framework consists mainly of desktop applications and Telegram doesn't support end-to-end encryption ("Secret Chats") in their desktop app since the initial release, thus we consider transmission of payment and other private data via Telegram insecure, including using bots and standard chats, since neither of them support end-to-end encryption. We do not use mobile devices due to risks associated with a wide exposure of manufacture supply chains to hardware backdoors. More details can be found here https://github.com/marcovelon/tdesktop/blob/NoSecretChats/README.md and in the following discussion https://github.com/marcovelon/tdesktop/issues/2'''
