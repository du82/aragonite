["https://expressjs.com/en/resources/contributing.html"]
title = "Contributing to Express"
description = "Find out how to contribute to Express.js, including guidelines for reporting issues, submitting pull requests, becoming a collaborator, and understanding security policies."
full_description = "Contributing to Express Looking to contribute to Expressjs.com? Click here. Express and the other projects in the expressjs organization on GitHub are projects of the OpenJs Foundation. These projects are governed under the general policies and guidelines of the Node.js Foundation along with the additional guidelines below. Technical committee Community contributing guide Collaborator’s guide Security policies and procedures Technical committee The Express technical committee consists of active project members, and guides development and maintenance of the Express project. For more information, see Express Community - Technical committee. Community contributing guide The goal of this document is to create a contribution process that: Encourages new contributions. Encourages contributors to remain involved. Avoids unnecessary processes and bureaucracy whenever possible. Creates a transparent decision making process that makes it clear how contributors can be involved in decision making. Vocabulary A Contributor is any individual creating or commenting on an issue or pull request. A Committer is a subset of contributors who have been given write access to the repository. A Project Captain is the lead maintainer of a repository. A TC (Technical Committee) is a group of committers representing the required technical expertise to resolve rare disputes. A Triager is a subset of contributors who have been given triage access to the repository. Logging Issues Log an issue for any question or problem you might have. When in doubt, log an issue, and any additional policies about what to include will be provided in the responses. The only exception is security disclosures which should be sent privately. Committers may direct you to another repository, ask for additional clarifications, and add appropriate metadata before the issue is addressed. Please be courteous and respectful. Every participant is expected to follow the project’s Code of Conduct. Contributions Any change to resources in this repository must be through pull requests. This applies to all changes to documentation, code, binary files, etc. Even long term committers and TC members must use pull requests. No pull request can be merged without being reviewed. For non-trivial contributions, pull requests should sit for at least 36 hours to ensure that contributors in other timezones have time to review. Consideration should also be given to weekends and other holiday periods to ensure active committers all have reasonable time to become involved in the discussion and review process if they wish. The default for each contribution is that it is accepted once no committer has an objection. During a review, committers may also request that a specific contributor who is most versed in a particular area gives a “LGTM” before the PR can be merged. There is no additional “sign off” process for contributions to land. Once all issues brought by committers are addressed it can be landed by any committer. In the case of an objection being raised in a pull request by another committer, all involved committers should seek to arrive at a consensus by way of addressing concerns being expressed by discussion, compromise on the proposed change, or withdrawal of the proposed change. If a contribution is controversial and committers cannot agree about how to get it to land or if it should land then it should be escalated to the TC. TC members should regularly discuss pending contributions in order to find a resolution. It is expected that only a small minority of issues be brought to the TC for resolution and that discussion and compromise among committers be the default resolution mechanism. Becoming a Triager Anyone can become a triager! Read more about the process of being a triager in the triage process document. Currently, any existing organization member can nominate a new triager. If you are interested in becoming a triager, our best advice is to actively participate in the community by helping triaging issues and pull requests. As well we recommend to engage in other community activities like attending the TC meetings, and participating in the Slack discussions. You can also reach out to any of the organization members if you have questions or need guidance. Becoming a Committer All contributors who land a non-trivial contribution should be on-boarded in a timely manner, and added as a committer, and be given write access to the repository. Committers are expected to follow this policy and continue to send pull requests, go through proper review, and have other committers merge their pull requests. TC Process The TC uses a “consensus seeking” process for issues that are escalated to the TC. The group tries to find a resolution that has no open objections among TC members. If a consensus cannot be reached that has no objections then a majority wins vote is called. It is also expected that the majority of decisions made by the TC are via a consensus seeking process and that voting is only used as a last-resort. Resolution may involve returning the issue to project captains with suggestions on how to move forward towards a consensus. It is not expected that a meeting of the TC will resolve all issues on its agenda during that meeting and may prefer to continue the discussion happening among the project captains. Members can be added to the TC at any time. Any TC member can nominate another committer to the TC and the TC uses its standard consensus seeking process to evaluate whether or not to add this new member. The TC will consist of a minimum of 3 active members and a maximum of 10. If the TC should drop below 5 members the active TC members should nominate someone new. If a TC member is stepping down, they are encouraged (but not required) to nominate someone to take their place. TC members will be added as admin’s on the Github orgs, npm orgs, and other resources as necessary to be effective in the role. To remain “active” a TC member should have participation within the last 12 months and miss no more than six consecutive TC meetings. Our goal is to increase participation, not punish people for any lack of participation, this guideline should be only be used as such (replace an inactive member with a new active one, for example). Members who do not meet this are expected to step down. If A TC member does not step down, an issue can be opened in the discussions repo to move them to inactive status. TC members who step down or are removed due to inactivity will be moved into inactive status. Inactive status members can become active members by self nomination if the TC is not already larger than the maximum of 10. They will also be given preference if, while at max size, an active member steps down. Project Captains The Express TC can designate captains for individual projects/repos in the organizations. These captains are responsible for being the primary day-to-day maintainers of the repo on a technical and community front. Repo captains are empowered with repo ownership and package publication rights. When there are conflicts, especially on topics that effect the Express project at large, captains are responsible to raise it up to the TC and drive those conflicts to resolution. Captains are also responsible for making sure community members follow the community guidelines, maintaining the repo and the published package, as well as in providing user support. Like TC members, Repo captains are a subset of committers. To become a captain for a project the candidate is expected to participate in that project for at least 6 months as a committer prior to the request. They should have helped with code contributions as well as triaging issues. They are also required to have 2FA enabled on both their GitHub and npm accounts. Any TC member or an existing captain on the same repo can nominate another committer to the captain role. To do so, they should submit a PR to this document, updating the Active Project Captains section (while maintaining the sort order) with the project name, the nominee’s GitHub handle, and their npm username (if different). Repos can have as many captains as make sense for the scope of work. A TC member or an existing repo captain on the same project can nominate a new captain. Repo captains from other projects should not nominate captains for a different project. The PR will require at least 2 approvals from TC members and 2 weeks hold time to allow for comment and/or dissent. When the PR is merged, a TC member will add them to the proper GitHub/npm groups. Active Projects and Captains expressjs/badgeboard: @wesleytodd expressjs/basic-auth-connect: @ulisesGascon expressjs/body-parser: @wesleytodd, @jonchurch, @ulisesGascon expressjs/compression: @ulisesGascon expressjs/connect-multiparty: @ulisesGascon expressjs/cookie-parser: @wesleytodd, @UlisesGascon expressjs/cookie-session: @ulisesGascon expressjs/cors: @jonchurch, @ulisesGascon expressjs/discussions: @wesleytodd expressjs/errorhandler: @ulisesGascon expressjs/express-paginate: @ulisesGascon expressjs/express: @wesleytodd, @ulisesGascon expressjs/expressjs.com: @crandmck, @jonchurch, @bjohansebas expressjs/flash: @ulisesGascon expressjs/generator: @wesleytodd expressjs/method-override: @ulisesGascon expressjs/morgan: @jonchurch, @ulisesGascon expressjs/multer: @LinusU, @ulisesGascon expressjs/response-time: @UlisesGascon expressjs/serve-favicon: @ulisesGascon expressjs/serve-index: @ulisesGascon expressjs/serve-static: @ulisesGascon expressjs/session: @ulisesGascon expressjs/statusboard: @wesleytodd expressjs/timeout: @ulisesGascon expressjs/vhost: @ulisesGascon jshttp/accepts: @blakeembrey jshttp/basic-auth: @blakeembrey jshttp/compressible: @blakeembrey jshttp/content-disposition: @blakeembrey jshttp/content-type: @blakeembrey jshttp/cookie: @blakeembrey jshttp/etag: @blakeembrey jshttp/forwarded: @blakeembrey jshttp/fresh: @blakeembrey jshttp/http-assert: @wesleytodd, @jonchurch, @ulisesGascon jshttp/http-errors: @wesleytodd, @jonchurch, @ulisesGascon jshttp/media-typer: @blakeembrey jshttp/methods: @blakeembrey jshttp/mime-db: @blakeembrey, @UlisesGascon jshttp/mime-types: @blakeembrey, @UlisesGascon jshttp/negotiator: @blakeembrey jshttp/on-finished: @wesleytodd, @ulisesGascon jshttp/on-headers: @blakeembrey jshttp/proxy-addr: @wesleytodd, @ulisesGascon jshttp/range-parser: @blakeembrey jshttp/statuses: @blakeembrey jshttp/type-is: @blakeembrey jshttp/vary: @blakeembrey pillarjs/cookies: @blakeembrey pillarjs/csrf: @ulisesGascon pillarjs/encodeurl: @blakeembrey pillarjs/finalhandler: @wesleytodd, @ulisesGascon pillarjs/hbs: @ulisesGascon pillarjs/multiparty: @blakeembrey pillarjs/parseurl: @blakeembrey pillarjs/path-to-regexp: @blakeembrey pillarjs/request: @wesleytodd pillarjs/resolve-path: @blakeembrey pillarjs/router: @wesleytodd, @ulisesGascon pillarjs/send: @blakeembrey pillarjs/understanding-csrf: @ulisesGascon Current Initiative Captains Triage team ref: @UlisesGascon Developer’s Certificate of Origin 1.1 By making a contribution to this project, I certify that: (a) The contribution was created in whole or in part by me and I have the right to submit it under the open source license indicated in the file; or (b) The contribution is based upon previous work that, to the best of my knowledge, is covered under an appropriate open source license and I have the right under that license to submit that work with modifications, whether created in whole or in part by me, under the same open source license (unless I am permitted to submit under a different license), as indicated in the file; or (c) The contribution was provided directly to me by some other person who certified (a), (b) or (c) and I have not modified it. (d) I understand and agree that this project and the contribution are public and that a record of the contribution (including all personal information I submit with it, including my sign-off) is maintained indefinitely and may be redistributed consistent with this project or the open source license(s) involved. Collaborator’s guide Website Issues Open issues for the expressjs.com website in https://github.com/expressjs/expressjs.com. PRs and Code contributions Tests must pass. Follow the JavaScript Standard Style and npm run lint. If you fix a bug, add a test. Branches Use the master branch for bug fixes or minor work that is intended for the current release stream. Use the correspondingly named branch, e.g. 5.0, for anything intended for a future release of Express. Steps for contributing Create an issue for the bug you want to fix or the feature that you want to add. Create your own fork on GitHub, then checkout your fork. Write your code in your local copy. It’s good practice to create a branch for each new issue you work on, although not compulsory. To run the test suite, first install the dependencies by running npm install, then run npm test. Ensure your code is linted by running npm run lint – fix any issue you see listed. If the tests pass, you can commit your changes to your fork and then create a pull request from there. Make sure to reference your issue from the pull request comments by including the issue number e.g. #123. Issues which are questions We will typically close any vague issues or questions that are specific to some app you are writing. Please double check the docs and other references before being trigger happy with posting a question issue. Things that will help get your question issue looked at: Full and runnable JS code. Clear description of the problem or unexpected behavior. Clear description of the expected result. Steps you have taken to debug it yourself. If you post a question and do not outline the above items or make it easy for us to understand and reproduce your issue, it will be closed. Security Policies and Procedures This document outlines security procedures and general policies for the Express project. Reporting a Bug Disclosure Policy Comments on this Policy Reporting a Bug The Express team and community take all security bugs in Express seriously. Thank you for improving the security of Express. We appreciate your efforts and responsible disclosure and will make every effort to acknowledge your contributions. Report security bugs by emailing [email protected]. To ensure the timely response to your report, please ensure that the entirety of the report is contained within the email body and not solely behind a web link or an attachment. The lead maintainer will acknowledge your email within 48 hours, and will send a more detailed response within 48 hours indicating the next steps in handling your report. After the initial reply to your report, the security team will endeavor to keep you informed of the progress towards a fix and full announcement, and may ask for additional information or guidance. Report security bugs in third-party modules to the person or team maintaining the module. Pre-release Versions Alpha and Beta releases are u"
