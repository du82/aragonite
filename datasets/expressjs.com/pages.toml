title = "Express - Node.js web application framework"
description = "Express is a fast, unopinionated, minimalist web framework for Node.js, providing a robust set of features for web and mobile applications."
full_description = "Express Home Getting started Installing Hello world Express generator Basic routing Static files More examples FAQ Guide Routing Writing middleware Using middleware Overriding the Express API Using template engines Error handling Debugging Express behind proxies Moving to Express 4 Moving to Express 5 Database integration API reference 5.x 4.x 3.x (deprecated) 2.x (deprecated) Advanced topics Building template engines Security updates Security best practices Performance best practices Health checks & shutdown Resources Community Glossary Middleware Utility modules Contributing to Express Release Change Log Support Blog Latest post All posts Write a Post English Français Deutsch Español Italiano 日本語 Русский 中文 (简体) 繁體中文 한국어 Português Slovenčina Українська Oʻzbekcha Türkçe ภาษาไทย Indonesia English Français Deutsch Español Italiano 日本語 Русский 中文 (简体) 繁體中文 한국어 Português Slovenčina Українська Oʻzbekcha Türkçe ภาษาไทย Indonesia Express4.21.2 Fast, unopinionated, minimalist web framework for Node.js $ npm install express --save const express = require('express') const app = express() const port = 3000 app.get('/', (req, res) => { res.send('Hello World!') }) app.listen(port, () => { console.log(`Example app listening on port ${port}`) }) Web Applications Express is a minimal and flexible Node.js web application framework that provides a robust set of features for web and mobile applications. APIs With a myriad of HTTP utility methods and middleware at your disposal, creating a robust API is quick and easy. Performance Express provides a thin layer of fundamental web application features, without obscuring Node.js features that you know and love. Middleware Express is a lightweight and flexible routing framework with minimal core features meant to be augmented through the use of Express middleware modules."
