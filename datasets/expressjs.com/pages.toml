full_description = "Version Support Only the latest version of any given major release line is supported. Versions that are EOL (end-of-life) may receive updates for critical security vulnerabilities, but the Express team offers no guarantee and does not plan to address or release fixes for any issues found. Major Version Minimum Node.js Version Support Start Date Support End Date v5.x 18 September 2024 ongoing v4.x 0.10.0 April 2014 ongoing v3.x 0.8.0 October 2012 July 2015 v2.x 0.4.1 March 2011 July 2012 v1.x 0.2.0 December 2010 March 2011 v0.14.x 0.1.98 December 2010 December 2010 Commercial Support Options If you are unable to update to a supported version of Express, please contact one of our partners to receive security updates: HeroDevs Never-Ending Support"
