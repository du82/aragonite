["https://expressjs.com/en/resources/community.html"]
title = "Express community"
description = "Connect with the Express.js community, learn about the technical committee, find resources, explore community-contributed modules, and get involved in discussions."
full_description = "Community Technical committee The Express technical committee meets online every two weeks (as needed) to discuss development and maintenance of Express, and other issues relevant to the Express project. Each meeting is typically announced in an expressjs/discussions issue with a link to join or view the meeting, which is open to all observers. The meetings are recorded; for a list of the recordings, see the Express.js YouTube channel. Members of the Express technical committee are: Active: @blakeembrey - Blake Embrey @crandmck - Rand McKinney @LinusU - Linus Unnebäck @ulisesgascon - Ulises Gascón @sheplu - Jean Burellier @wesleytodd - Wes Todd @jonchurch - Jon Church @ctcpip - Chris de Almeida Inactive: @dougwilson - Douglas Wilson @hacksparrow - Hage Yaapa @jonathanong - jongleberry @niftylettuce - niftylettuce @troygoode - Troy Goode Express is made of many modules Our vibrant community has created a large variety of extensions, middleware modules and higher-level frameworks. Additionally, the Express community maintains modules in these two GitHub orgs: jshttp modules providing useful utility functions; see Utility modules. pillarjs: low-level modules that Express uses internally. To keep up with what is going on in the whole community, check out the ExpressJS StatusBoard. Issues If you’ve come across what you think is a bug, or just want to make a feature request open a ticket in the issue queue. Examples View dozens of Express application examples in the repository covering everything from API design and authentication to template engine integration. Github Discussions The GitHub Discussions section is an excellent space to engage in conversations about the development and maintenance of Express, as well as to share ideas and discuss topics related to its usage. Branding of Express.js Express.js Logo Express is a project of the OpenJS Foundation. Please review the trademark policy for information about permissible use of Express.js logos and marks. Logotype Logomark"
year_published = 2025
