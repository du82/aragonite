description = "Express is a fast, unopinionated, minimalist web framework for Node.js, providing a robust set of features for web and mobile applications."
full_description = "Express 홈 시작하기 설치 Hello world Express 생성기 기본 라우팅 정적 파일 More examples 자주 묻는 질문(FAQ) Gu안내서ide 라우팅 미들웨어 작성 미들웨어 사용 Overriding the Express API 템플리트 엔진 사용 오류 처리 디버깅 프록시 환경에서 Express 사용 Express 4로의 이전 Express 5로의 이전 데이터베이스 통합 API 참조 5.x 4.x 3.x(더 이상 사용되지 않음) 2.x(더 이상 사용되지 않음) 고급 주제 템플리트 엔진 보안 업데이트 보안 우수 사례 성능 우수 사례 Health checks & shutdown 자원 커뮤니티 용어집 미들웨어 Utility modules Contributing to Express Release Change Log Support Blog Latest post All posts Write a Post English Français Deutsch Español Italiano 日本語 Русский 中文 (简体) 繁體中文 한국어 Português Slovenčina Українська Oʻzbekcha Türkçe ภาษาไทย Indonesia English Français Deutsch Español Italiano 日本語 Русский 中文 (简体) 繁體中文 한국어 Português Slovenčina Українська Oʻzbekcha Türkçe ภาษาไทย Indonesia Express4.21.2 Node.js를 위한 빠르고 개방적인 간결한 웹 프레임워크 $ npm install express --save 웹 애플리케이션 Express는 웹 및 모바일 애플리케이션을 위한 일련의 강력한 기능을 제공하는 간결하고 유연한 Node.js 웹 애플리케이션 프레임워크입니다. API 자유롭게 활용할 수 있는 수많은 HTTP 유틸리티 메소드 및 미들웨어를 통해 쉽고 빠르게 강력한 API를 작성할 수 있습니다. 성능 Express는 기본적인 웹 애플리케이션 기능으로 구성된 얇은 계층을 제공하여, 여러분이 알고 있고 선호하는 Node.js 기능을 모호하게 만들지 않습니다."
