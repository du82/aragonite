title = "Health Checks and Graceful Shutdown"
description = "Learn how to implement health checks and graceful shutdown in Express apps to enhance reliability, manage deployments, and integrate with load balancers like Kubernetes."
full_description = "Health Checks and Graceful Shutdown Graceful shutdown When you deploy a new version of your application, you must replace the previous version. The process manager you’re using will first send a SIGTERM signal to the application to notify it that it will be killed. Once the application gets this signal, it should stop accepting new requests, finish all the ongoing requests, clean up the resources it used, including database connections and file locks then exit. Example const server = app.listen(port) process.on('SIGTERM', () => { debug('SIGTERM signal received: closing HTTP server') server.close(() => { debug('HTTP server closed') }) }) Health checks A load balancer uses health checks to determine if an application instance is healthy and can accept requests. For example, Kubernetes has two health checks: liveness, that determines when to restart a container. readiness, that determines when a container is ready to start accepting traffic. When a pod is not ready, it is removed from the service load balancers."
