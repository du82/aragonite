title = "Extism - make all software programmable. Extend from within. | Extism - make all software programmable. Extend from within."
description = "Extism is the open source, universal plug-in system. Extend all the software everywhere! Powered by WebAssembly."
full_description = "Easy to UseLeveraging the power and portability of WebAssembly, Extism is an off-the-shelf plug-in system just a library import away. Ship in days, not weeks or months.Secure by DefaultDon't worry about what some plug-in code might do to your program. Extism is built with security as a core principle, and fully sandboxes the execution of all plug-in code.Available EverywhereOur flexible architecture uniquely allows Extism to run almost anywhere, with idiomatic Host SDKs for Python, Node, Ruby, Rust, Go, PHP, C/C++, OCaml, & more."
year_published = 2025
