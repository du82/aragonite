title = "Run a Plug-in | Extism - make all software programmable. Extend from within."
description = "The following is a minimal guide to running an Extism plug-in in your language"
full_description = '''QuickstartRun a Plug-inOn this pageQuickstartThe following is a minimal guide to running an Extism plug-in in your language and platform of choice. This document should get you from 0 to "Hello, World!" as quickly as possible.Choose A Language​In Extism parlance, your normal (non-wasm) application is known as the "host". We offer a variety of libraries, which we call "Host SDKs", to help you embed Extism plug-ins into your application.First choose the language of your application:JavaScriptGoRustRubyPythonC#F#JavaElixirCPHPOCamlZigHaskellC++DInstall the Dependency​The module is hosted on npm. Put the @extism/extism dependency in your package.json:npm install @extism/extism --saveSupported RuntimesThis library is also compatible with Browsers, Deno, and Bun but this guide will assume we're running in node.js.Import the library and load a plug-in​We suggest you copy paste the following code here into a node.js shell:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.repl.jsconst createPlugin = require("@extism/extism")const plugin = await createPlugin( 'https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm', { useWasi: true });Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.repl.jslet out = await plugin.call("count_vowels", "Hello, World!");console.log(out.text())// => '{"count":3,"total":3,"vowels":"aeiouAEIOU"}'Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this javascript library can do, see the js-sdk README and reference docs.If you're interested in learning how to write a plug-in, see the plugin quickstart.Install the Dependency​Install via go get:go get github.com/extism/go-sdkImport the library and load a plug-in​Let's now load a plug-in in Go.Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.Copy paste this into a main function in main.go:main.gopackage mainimport ( "context" "fmt" "github.com/extism/go-sdk" "os")func main() { manifest := extism.Manifest{ Wasm: []extism.Wasm{ extism.WasmUrl{ Url: "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm", }, }, } ctx := context.Background() config := extism.PluginConfig{} plugin, err := extism.NewPlugin(ctx, manifest, config, []extism.HostFunction{}) if err != nil { fmt.Printf("Failed to initialize plugin: %v\n", err) os.Exit(1) }}Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Copy-paste this code to the end of your main func:main.gofunc main() { // ... data := []byte("Hello, World!") exit, out, err := plugin.Call("count_vowels", data) if err != nil { fmt.Println(err) os.Exit(int(exit)) } response := string(out) fmt.Println(response)}Run the program:$ go run main.go# => {"count":3,"total":3,"vowels":"aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this go library can do, see the go-sdk README and reference docs.If you're interested in learning how to write a plug-in, see the plugin quickstart.Install the Dependency​To use the extism crate, you can add it to your Cargo file:[dependencies]extism = "1.0.0"Import the library and load a plug-in​Let's now load a plug-in in Rust.Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.Copy paste this into a main function in main.rs. This will load an Extism plug-in from the web:main.rsuse extism::*;fn main() { let url = Wasm::url( "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm" ); let manifest = Manifest::new([url]); let mut plugin = Plugin::new(&manifest, [], true).unwrap();}Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Copy-paste this code to the end of your main function:main.rsfn main() { // ... let res = plugin.call::<&str, &str>("count_vowels", "Hello, world!").unwrap(); println!("{}", res);}Run the program:$ cargo run# => {"count":3,"total":3,"vowels":"aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this rust library can do, see the rust-sdk README and reference docs.If you're interested in learning how to write a plug-in, see the plugin quickstart.Install the Dependency​For this library, you first need to install the Extism Runtime. You can download the shared object directly from a release or use the Extism CLI to install it:sudo extism lib install#=> Fetching https://github.com/extism/extism/releases/download/v1.0.0/libextism-aarch64-apple-darwin-v1.0.0.tar.gz#=> Copying libextism.dylib to /usr/local/lib/libextism.dylib#=> Copying extism.h to /usr/local/include/extism.hThe ruby gem is hosted on RubyGems. Put the extism gem in your Gemfile:gem 'extism', '~> 1.0'Or install with gem install if you are not using bundler:gem install extismImport the library and load a plug-in​Let's now load a plug-in from ruby. We suggest you copy paste the following code here into an irb or pry shell:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.irb.rbrequire 'extism'url = "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm"manifest = Extism::Manifest.from_url(url)plugin = Extism::Plugin.new(manifest)Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.irb.rbplugin.call("count_vowels", "Hello, World!")# => {"count": 3, "total": 3, "vowels": "aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this ruby library can do, see the ruby-sdk README and reference docs.If you're interested in learning how to write a plug-in, see the plugin quickstart.Install the Dependency​Install this package from PyPI:# using pip$ pip install extism# using poetry$ poetry add extism=^1.0.0Import the library and load a plug-in​Let's now load a plug-in from python. We suggest you copy paste the following code here into a python interpreter:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.python.pyimport extismurl = "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm"manifest = {"wasm": [{"url": url}]}plugin = extism.Plugin(manifest)Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.python.pywasm_vowel_count = plugin.call( "count_vowels", "hello world")print(wasm_vowel_count)# => {"count": 3, "total": 3, "vowels": "aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this python library can do, see the python-sdk README and reference docs.If you're interested in writing how to write a plug-in, see the plugin quickstart.Install the Dependency​This library depends on the native Extism runtime, we provide native runtime packages for all supported operating systems. You can install with:dotnet add package Extism.runtime.allThen, add the Extism.Sdk NuGet package to your project:dotnet add package Extism.SdkImport the library and load a plug-in​Let's now load a plug-in from C#. We suggest you copy paste the following code here into a main Progam.csfile:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.Program.csusing System;using Extism.Sdk;var manifest = new Manifest(new UrlWasmSource("https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm"));using var plugin = new Plugin(manifest, new HostFunction[] { }, withWasi: true);Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Add these next lines to your Program.cs file:Program.csvar output = plugin.Call("count_vowels", "Hello, World!");Console.WriteLine(output);Run using dotnet:dotnet run# => {"count":3,"total":3,"vowels":"aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this dotnet library can do, see the dotnet-sdk README and reference docs.If you're interested in writing how to write a plug-in, see the plugin quickstart.Install the Dependency​This library depends on the native Extism runtime, we provide native runtime packages for all supported operating systems. You can install with:dotnet add package Extism.runtime.allThen, add the Extism.Sdk NuGet package to your project:dotnet add package Extism.SdkImport the library and load a plug-in​Let's now load a plug-in from F#. We suggest you copy paste the following code here into a main Progam.fsfile:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.Program.fsopen Systemopen Extism.Sdkopen Extism.Sdk.Nativelet uri = Uri("https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm")let manifest = Manifest(new UrlWasmSource(uri))let plugin = new Plugin(manifest, Array.Empty<HostFunction>(), withWasi = true)Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Add these next lines to your Program.fs file:Program.fslet output = plugin.Call("count_vowels", "Hello, World!")System.Console.WriteLine(output)Run using dotnet:dotnet run# => {"count":3,"total":3,"vowels":"aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this dotnet library can do, see the dotnet-sdk README and reference docs.If you're interested in writing how to write a plug-in, see the plugin quickstart.Install the Dependency​For this library, you first need to install the Extism Runtime. You can download the shared object directly from a release or use the Extism CLI to install it:sudo extism lib install#=> Fetching https://github.com/extism/extism/releases/download/v1.0.0/libextism-aarch64-apple-darwin-v1.0.0.tar.gz#=> Copying libextism.dylib to /usr/local/lib/libextism.dylib#=> Copying extism.h to /usr/local/include/extism.hOnce this is done, you can install the jar.Maven​To use the Extism java-sdk with maven you need to add the following dependency to your pom.xml file:<dependency> <groupId>org.extism.sdk</groupId> <artifactId>extism</artifactId> <version>1.0.0</version></dependency>Gradle​To use the Extism java-sdk with maven you need to add the following dependency to your build.gradle file:implementation 'org.extism.sdk:extism:1.0.0'Import the library and load a plug-in​Let's now load a plug-in from Java. We suggest you copy paste the following code here into a main function in a Main.javafile:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.Main.javaimport org.extism.sdk.manifest.Manifest;import org.extism.sdk.wasm.UrlWasmSource;import org.extism.sdk.Plugin;public static void main(String[] args) { var url = "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm"; var manifest = new Manifest(List.of(UrlWasmSource.fromUrl(url))); var plugin = new Plugin(manifest, false, null);}Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Add these next lines to your main function:Main.javapublic static void main(String[] args) { // ... var output = plugin.call("count_vowels", "Hello, World!"); System.out.println(output);}Running this should yield the vowel report:mvn compile exec:java -Dexec.mainClass="com.dylibso.myapp.Main"# => {"count":3,"total":3,"vowels":"aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this java library can do, see the java-sdk README and reference docs.If you're interested in writing how to write a plug-in, see the plugin quickstart.Install the Dependency​You can find this package on hex.pm def deps do [ {:extism, "1.0.0"} ]endNote: You do not need to install the Extism Runtime shared object, but you will need a rust toolchain installed to build this package. See Install Rust to install for your platform.Import the library and load a plug-in​Let's now load a plug-in from Elixir. We suggest you copy paste the following code here into a main function in an Elixir repl using iex -S mix:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.repl.exurl = "https://github.com/extism/plugins/releases/latest/download/count_vowels.wasm"manifest = %{wasm: [%{url: url}]}{:ok, plugin} = Extism.Plugin.new(manifest, false)Call an export function​Let's call the "count_vowels" export function on the plugin. This counts the number of vowels in the string we pass in and returns a JSON encoded result.Paste in these lines next and it should print out the vowel report:repl.ex{:ok, output} = Extism.Plugin.call(plugin, "count_vowels", "Hello, World!")# => {"count": 3, "total": 3, "vowels": "aeiouAEIOU"}Documentation​Congrats! You just ran your first Extism plug-in. To learn more about what this Elixir library can do, see the elixir-sdk README and reference docs.If you're interested in writing how to write a plug-in, see the plugin quickstart.Install the Dependency​For this library, you need to install the Extism Runtime. You can download the shared object directly from a release or use the Extism CLI to install it:sudo extism lib install#=> Fetching https://github.com/extism/extism/releases/download/v1.0.0/libextism-aarch64-apple-darwin-v1.0.0.tar.gz#=> Copying libextism.dylib to /usr/local/lib/libextism.dylib#=> Copying extism.h to /usr/local/include/extism.hImport the library and load a plug-in​Let's now load a plug-in from C. We suggest you copy paste the following code here into a main function in a main.c file:Count Vowels Plugincount_vowels.wasm is an example plugin that counts vowels. It was written in Rust, but can be written in any of the supported PDK languages.main.c#'''
