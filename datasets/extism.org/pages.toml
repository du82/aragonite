title = "Plug-in Development Kits (PDKs) | Extism - make all software programmable. Extend from within."
description = "Using an official Plug-in Development Kit (PDK) makes it simple to write code which can be compiled to WebAssembly and run within an Extism Host environment."
full_description = "ConceptsPlug-in Development Kits (PDKs)On this pagePlug-in Development Kits (PDKs)Using an official Plug-in Development Kit (PDK) makes it simple to write code which can be compiled to WebAssembly and run within an Extism Host environment. Extism plug-ins are capable of interacting with their Host environment in many ways. While these are mostly optional, there are some functions that the PDK calls which are required in order for a plug-in to do anything useful: namely managing and accessing shared memory.Usage​Much like Host SDKs, PDKs are published to each of the package managers for the respective officially supported languages:Each language PDK has it's own idiomatic APIs, and documentation can be found within (or linked from) each PDK page. Additionally, each plug-in you write must be compiled to WebAssembly (resulting in a .wasm binary artifact) before it can be run in an Extism Host. Instructions on how to compile plug-ins in each officially supported language are included on the PDK documentation pages as well. If you are looking to embed Extism into your program/application, please refer to the Host SDK section of the documentation, where you will find information about using an SDK in your language of choice.Need help?​If you've encountered a bug or think something is missing, please open an issue on the Extism GitHub repository.There is an active community on Discord where the project maintainers and users can help you. Come hang out!"
year_published = 2025
