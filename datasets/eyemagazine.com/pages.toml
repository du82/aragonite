full_description = "Critique Critique (established 1999) is the regular Eye column by Rick Poynor. Ambiguity blues Rick Poynor A graphically illustrated art project reflects our uneasy relationship with the truth. Critique by Rick Poynor Art of darkness Rick Poynor Indie magazine Hellebore channels folk horror and the occult with an alchemical sense of graphic style. Critique by Rick Poynor Overloading the page Rick Poynor A big survey of Dutch photobooks raises issues about visual editing and layout. Critique by Rick Poynor This is a column Rick Poynor Design that tells the story of its own making harks back to conceptual art of the 1960s. By Rick Poynor Unfinished business Rick Poynor Scott King’s rallying call for creative freedom takes a satirical swipe at cultural gatekeepers. By Rick Poynor Experiments in destabilisation Rick Poynor A CalArts book celebrates decades of purposeful graphic weirdness. Critique by Rick Poynor Los Angeles’ lost palace of treasures Rick Poynor Using photographic evidence, designer Mark Nelson has reconstructed one of the great twentieth-century art collections. Photo Critique by Rick Poynor Heroes of wealth and power Rick Poynor An essay published in Mack’s new ‘Discourse’ series accuses three prominent photographers of creating propaganda for global capitalism. Photo Critique by Rick Poynor Godard becomes ‘Godard’ Rick Poynor In 1961, the new wave director posed for a German fashion photographer. The publicity pictures that followed are as self-reflexive as his films. Photo Critique by Rick Poynor Palaces of petroleum Rick Poynor The adventurous design of a 1960 book promoting Australia’s fossil fuel industry offers a poignant glimpse of an optimistic, unquestioning age.Photo Critique by Rick Poynor 1 2 3 > Last >"
