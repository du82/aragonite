full_description = "Opinion Learning to read and write images Editorial, Max Bruinsma Merging more and more with a 'metadisciplinary' visual culture, the role of graphic design is changing… Sensory montage Screen, Jessica Helfand Technology's mission to merge reality and fiction reflects the divided self of its operators - behind… The end of the line Agenda, Jamie Hobson By favouring drawing over communication in the selection of students, graphic design education is missing the point Features Reputations: Milton Glaser Steven Heller ‘I am nervous about ideologies, whether it’s the ideology of business or the ideology of Bolshevism. I get nervous in the presence of absolute certainty’ Between histories Orsat Franković The graphic design legacy of the young republic of Croatia can be traced through its turbulent past and rich traditions. By Orsat Francović Stop worrying and learn to love the Web Designers overcome their initial contempt for a low-resolution medium to bring clarity to the World Wide Web Culture in a cold climate Will Novosedlik In the ‘post-intellectual’ era, four Canadians use their talents in the service of creative discourse and the act of reading The aesthetics of transience Max Bruinsma With computers as the means for limitless manipulations of signs, designers now exalt subjectivity and impermanence Compare and contrast Emily King With a CD-ROM based on its legendary lettering archive, Central Saint Martins has created a new tool and resource Other spaces Rick Poynor Paul Elliman tells his students that “everything you know is wrong”, embracing error to find ideas where others see junk Manipulation for the masses Brett Wickens Version 4 of Adobe Photoshop, the champion of photo processing software, comes with new tools for Web designers Eros Steven Heller In 1962 Ralph Ginsburg and Herb Lubalin defied puritantical America with the four issues of their erotic magazine Eros Willem Sandberg: Warm printing Mafalda Spencer The Dutch pioneer’s catalog