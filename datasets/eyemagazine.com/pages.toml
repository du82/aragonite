title = "Eye Magazine | Blog | Showbiz kids"
full_description = "Tuesday, 8:21am 7 October 2008 Showbiz kids john l. walters Graphic design Reviews Visual culture There are no originals in ‘Andy Warhol: Other Voices, Other Rooms’ If Andy Warhol had lived to see the proliferation of cheap, flat screens that makes an exhibition like ‘Andy Warhol: Other Voices, Other Rooms’ possible … well he would have been a very happy 80-year-old. The big central area, full of monitors showing Warhol’s television shows from the 1980s, is reminiscent of the artist’s proposal for the ‘Andymat’, a restaurant full of solitary booths where you could watch TV and eat fast food. There are screens everywhere, including big ones showing grainy movies such as Empire State and Bike Boy. Even the famous Polaroids look like neat little screens, but of course they are facsimiles – Peter Pan pictures that will not fade or discolour any more – showing subjects such as Joseph Beuys, Grace Jones, Debbie Harry and O. J. Simpson in their startled, flashlit youth. The touring show (previously at the Stedelijk and the Moderna Museet in Stockholm) is on view simultaneously at the Wexner Center for the Arts in Ohio and at the Hayward Gallery at London’s Southbank Centre where it launched last night with a celebrity-packed* private view. They can do two at once because, as designer Rose Epple (of the show’s brilliant ‘Scenographers’, Chezweitz & Roseapple) reminded me, ‘everything is a facsimile … nothing is an original.’** Which makes it more like graphic design than anything, and all the better for it. On a text panel, the curator makes the usual grand claims for Warhol: ‘His vision encompassed all of life’s major themes: sex, death, money, power, success and failure … Warhol used everyday objects and surface appearances to ask philosophical questions about life and death …’ I’m not convinced, though I think Warhol, had he not turned himself into a millionaire artist, might have become a great graphic designer. (On the strength of his album covers, maybe he was.) As it is, his work ranges from car crashes to electric chairs; from Liza Minnelli to Curiosity Killed The Cat. It’s entertainment, and all art is entertainment.*** The last panel in the penultimate room, which shows Warhol’s life in 42 pictures, is a photograph of Warhol, shortly before his death, with Miles Davis. Now there’s an artist. * Well … Nick Rhodes from Duran Duran and Hanif Kureishi. And Richard Hollis, who told me that Warhol once took his Polaroid portrait. ** With the exception of the ‘Time capsule’. *** H. R. Gaines said: ‘All art is entertainment . . . but not all entertainment is art.’ Eye is the world’s most beautiful and collectable graphic design journal, published quarterly for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '14483'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
