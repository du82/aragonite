urrent and upcoming events that have piqued our interest: exhibitions, conferences, talks and workshops … 13 February 2024 Books received #56 (magazines) Eye editors Magazines with book-like qualities: Notebook, Somesuch Stories, Print Control and Backstage Stories An overview of four striking indie mags: Notebook, Somesuch Stories, Print Control and Backstage Stories … 6 February 2024 Kitty kitty bang bang Janet South An new exhibition in London examines the irresistible power of kawaii, or ‘cuteness’ You enter ‘Cute’ at Somerset House through a gallery of AI kitten images created by Graphic… 22 January 2024 Parisienne walkways Gabriela Matuszyk A new trilogy from the Mainstone Press is a whimsical journey through shopfronts, fairgrounds and the literary scene of 1920s Paris. By Gabriela Matuszyk The Mainstone Press may be known to those interested in British artist, designers and illustrators from… < 1 2 3 4 5 > Last >"
