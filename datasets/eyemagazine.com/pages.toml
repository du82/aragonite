full_description = "Blog: Design history 14 February 2025 Relationships on show Jane Connory, Fanny Suhendra and Claire Fisher collaborate to flip the script on graphic design exhibitions and visually narrate the history of relationship agencies in Australia. An installation in the National Gallery of Australia used design ephemera to explore 75 years of Relationships Australia … 15 January 2025 Pure design play Two of Ken Garland’s games for Galt Toys are back in circulation. By Andrew Howard Ken Garland started working for Galt Toys in 1961, and later conceived and designed toys and games for them. 22 May 2024 BIG in Milan The first Biennale Internazionale Grafica takes place from 23-26 May 2024 The Biennale Internazionale Grafica (BIG) opens this week, with four days of exhibitions, talks, etc. across Milan. 31 December 2023 Women in the room The fifth edition of the AIAP Women in Design Awards (AWDA) brought together exemplary work from around the world. The fifth edition of the AIAP Women in Design Awards (AWDA) brought together exemplary work from around the world. 9 October 2023 FEED’s big vision A conference in Warsaw devoted to Eastern European design launched a conversation about stories yet untold. By Gabriela Matuszyk A September 2023 conference in Warsaw launched the first Festival Eastern European Design (FEED). 4 July 2023 Graphic design live #13 magCulture in New York; Hipgnosis documentary (UK and online); contemporary Iranian posters in Zurich; and Mexican blackletter online. Listed below are some current and upcoming events that have caught the attention of our editorial team this month. … 15 May 2023 Type for survival How type design is helping to save Indigenous Canadian languages from extinction. Will Novosedlik reports English-speaking designers take it for granted that every typeface will be available in their language … 4 April 2023 Variable grunge The typewriter typeface formerly known as ‘Trixie’ gets a makeover and a new name: Neither Confirm Nor Deny (NCND). By Paul Barnes Trixie was perfect for the age of grunge. It became a visual shorthand for typewriters, with the quality of authenticity … 13 February 2023 Graphic design live #10 Sara De Bondt in London; Haettenschweiler in Zurich; Shaping Protest in Ulm; Polish poster and type design in California; and Extinction Rebellion in London. Here is a selection of current and upcoming events – page to stay up to date… 6 February 2023 Covid visualisations: 2023 update Paul Kahn reflects upon the way Covid-19 data visualisations and reporting have changed over the past three years In 2021, when ‘The pandemic that launched a thousand visualisations’ was published in Eye 101, there were hundreds of visualisations per week 1 2 3 > Last >"
