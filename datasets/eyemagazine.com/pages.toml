["https://www.eyemagazine.com/feature/article/reputations-michael-bierut"]
title = "Eye Magazine | Feature | Reputations: Michael Bierut"
full_description = "Spring 1997 Reputations: Michael Bierut Steven Heller Michael Bierut Pentagram ‘The biggest challenge that faces a designer isn’t the quest for novelty, but coming to grips with the fact that much of what we do has little content’ Michael Bierut was born in Cleveland, Ohio in 1957. He studied graphic design at the University of Cincinnati’s College of Design, Architecture, Art and Planning, graduating in 1980. Prior to joining Pentagram in 1990 as a partner in the firm’s New York office, he worked for ten years at Vignelli Associates, ultimately as vice-president of graphic design. His clients at Pentagram have included Alfred A. Knopf, Disney Development Company, The Rock and Roll Hall of Fame and Museum, Princeton University and Interiors Magazine. His work is represented in the permanent collections of the Museum of Modern Art and the Metropolitan Museum of Art in New York, and the Musée des Arts Decoratifs, Montreal. He was president of the New York Chapter of the American Institute of Graphic Arts (AIGA) from 1988 to 1990 and is a member of the AIGA’s national board. He has been director of the American Centre for Design and was elected to the Alliance Graphique Internationale in 1989. In 1991, he chaired the AIGA National Conference in Chicago with his fellow Pentagram partner Paula Scher. Recent activities include the identity and environmental graphics for a new children’s museum in St Paul, Minnesota, and coordinating all promotional material for the Brooklyn Academy of Music. He is the graphic design consultant to Mohawk Paper Mills and edits its annual critical journal Rethinking Design. He is a Senior Critic in Graphic Design at the Yale School of Art and co-editor, with Steven Heller, of Looking Closer and Looking Closer 2, anthologies of writing on graphic design. Steven Heller: When did you decide to become a graphic designer? Michael Bierut: I grew up in Ohio, in a milieu that had nothing resembling graphic design. Because I drew well, I was the guy who always designed the logo for the clubhouse or painted the band’s name on the drum. I didn’t know it had a name until I found a book by [former CBS art director] S. Neil Fujita in the school library. It was part of a series called something like Your Future in …Cosmetology, or Garbage Disposal, or Plumbing, and there was one called Your Future in Commercial Art/Graphic Design. Up to that moment I thought this stuff got done by Robert Rauschenberg or Franz Kline or Frank Stella banging it out on a Saturday; they’d put aside the paintings with the slashes and the stripes, and do a Three Dog Night cover. When I found out it had a name – I was fifteen years old – I went to the Parma Regional Library in Ohio and looked up graphic design in the card catalogue. They had one book: Graphic Design Manual by Armin Hofmann. SH: What was your reaction to it? MB: All these pictures of dots and squares hypnotised me. After repeatedly taking this book out of the library I went to a department store in downtown Cleveland and asked if they had it, expecting to get a frown and a puzzled look. Instead the saleswoman said, “Oh, yeah, we just got that in for Christmas.” She led me to this pile of books, but it was a book called Graphic Design by Milton Glaser, with Bob Dylan on the front. So there were two books – one by Glaser and one by Armin Hofmann – that seemed diametrically opposed. SH: You were at the crossroads of Modernism and eclecticism, in which direction did you go? MB: I went to the University of Cincinnati, a school where most of the instructors were either born in Switzerland and had studied with Hofmann or had studied at Yale. It was a very Yale-Swiss kind of education – rather than the Glaser tradition. SH: Is that how you wanted to practice? MB: I was really good at it, but I was always very promiscuous and would do freelance jobs where I would just rip off anyone that struck my fancy. SH: When you left school, did you see a particular place for yourself to fit in? MB: I wanted to work for someone really, really good. It was either Milton Glaser, Chermayeff & Geismar, or Massimo Vignelli. I got Massimo on a good day. SH: You worked at Vignelli Associates for ten years. What did you learn? MB: Probably the most interesting thing I learned is that a lot of the things about design that tend to get designers really interested aren’t that important. SH: Do you mean the decorative aspects of design? MB: More or less. See, Massimo would arrive at things from an ideological point of view. For instance, he has always had this thing about there being only five good typefaces: Garamond 3, Futura, Century, Helvetica and Bodoni. I agreed with this, not so much as a moral issue, but for the practical reason that ordinary people like my mom could only distinguish between five typefaces, and that the time that designers would spend splitting hairs between Garamond and Bembo and Sabon was a waste. Likewise all the attention designers give to clever layouts and putting the page numbers in a cool place, when ordinary people just want to read the words and look at the pictures. Massimo taught me to focus on the big ideas, and I thought that big ideas were what connected with the greatest number of people. SH: Was this method a revelation for you, or was it accommodation to the will of your employer? MB: It was a revelation. Maybe unconsciously the whole thing was like the Stockholm syndrome, where hostages identify with their captors. But I honestly don’t think it was. SH: Do you think Massimo Vignelli saw good design as a moral imperative? MB: Massimo’s point of view is that cluttered or self-conscious design bespeaks some sort of moral failing. But I never felt that. I always believed that if you have the time to show you were awake while you were designing, then, why not? SH: Why do you think Vignelli has become the spokesman for and the target of reaction in terms of the old guard versus the new? MB: To Massimo’s credit, he has always felt it incumbent on him to engage with this stuff. I mean, you have Massimo on the one hand, who takes a lot of the heat from the younger generation, but then you have armies of designers of his generation whose way of dealing with it is just to grumble and pull the shades down. Massimo is always in the front row, saying, “How can you do this crap?” To me, if more designers actually stated their position and got dialogues going, it would be more interesting. It’s dreary when there’s just a single, stupid conversation about “You can’t read that, it’s ugly” versus “How can you keep doing that boring stuff?” It goes nowhere. SH: At the end of your tenure at Vignelli’s, what was going on in design that interested you? MB: When I first came to New York in 1980 there was this thrilling ascendancy of avant-garde design as represented by the Basel School. Dan Friedman was working at Pentagram and Anspatch Grossman Portugal. April Greiman was just beginning. There were firms like Doublespace and Carbone Smolan doing things that I thought were cool-looking. But by the middle of the decade, I was surprised to see that the avant-garde stuff had been absorbed by the mainstream. What you had were many firms, fuelled by the real estate and retail and financial businesses, who were pouring out nice-looking brochures that had gradations and spaced-out type – all the stuff that had looked astonishing in Wet magazine seven years before – to sell mortgages for Manhattan banks. SH: You absorbed Vignelli’s ideas, but you also discovered your own path. At what point did you begin to have a more singular vision? MB: Well, it began to happen slowly. But first, Paula Scher, with whom I had become friendly, was a real pipeline to the outside world for me. Paula is a perfect example of the anti-Vignelli approach in the purest way. I remember Massimo and I going to a presentation where she spoke. I just loved her work. It was exactly what made me go into graphic design in the first place. We came out, and I said, “Man, Paula is great.” And Massimo said, “All that novelty stuff and those Victorian typefaces, that’s not the way to do it.” And I said, “Massimo, if you design 200 album covers a year, you have to be eclectic. You can’t just do all the classical ones in Garamond and all the rock ones in Futura.” And Massimo, of course, said, “That would be fantastic!” Paula’s kind of virtuosity really spoke to me deep down inside. SH: I have an image of you with your veins popping out, panting to jump right out of your skin and do some of this eclectic stuff as well. MB: I could do some virtuoso stuff sometimes, but there were a lot of things I couldn’t do. I couldn’t just effortlessly do a Modernist-looking thing at nine o’clock, a historicist-looking thing at ten o’clock, and something else at midday. It suggests, I suppose, a kind of ideological bankruptcy to be able to slip in and out of all those clothes. But it’s certainly something that I had been toying around with for almost all my life. I remember seeing things I loved, like what Katherine McCoy was doing at Cranbrook, and I’d try to do some of that. I just was bad at it. SH: Did you accept all these approaches equally, or were you beginning to establish hierarchies? MB: I think good graphic design can look lots and lots of different ways. In 1988, there was good Charles Spencer Anderson and there was bad imitation Charles Spencer Anderson. There was good Cranbrook and there was not-so-good Cranbrook. Just like now there is good Tomato and there is bad Tomato. The good stuff always seems to come out of someone’s conviction and proceed directly from their passion. SH: Was there any ideological or philosophical reason why the method of design promoted at Cranbrook, which later became a style of layering, was objectionable to you? MB: I would say there are two issues. First, as a pluralist, I’m always suspicious of ideologies or movements in design. I understand formal approaches to design that grow from someone’s personal point of view, but when that point of view becomes dogmatic, the work loses its richness for me. I think this was true at Cranbrook, where after a certain point there seemed to be a sense of manifest destiny, that all design history was leading up to this glorious moment where every message, regardless of its content, could now be collaged with a quote from a French structuralist, a diagram of an electrical circuit, and a Photoshopped image of the back of someone’s head, and that the very nature of communication would thus be transformed. In its own way the result was as regimented as anything Emil Ruder could have dreamed up. And then, of course, when the word goes out to the people who can’t afford the tuition in Bloomfield Hills but can afford an issue of Emigre, that’s when the deluge of imitative sludge really cranks up. Secondly, I really think the biggest challenge that faces a designer isn’t the quest for stylistic novelty, but coming to grips with the fact that so much of the work we do has very little content, very little that would actually engage normal people on a human level. So we amuse ourselves by styling what we’ve been handed, and the world at large continues to go to hell. SH: So ten years have gone by. You are approached by Pentagram to become a partner. What goes through your mind at that moment? MB: Over the years, I’d been approached by other people of Massimo’s generation who thought I would just want to trade Massimo for someone else for fun. That never interested me. The other thing that didn’t interest me was going out on my own. I always thought if I could just run into a partner that I liked a lot, that would do it for me. I never thought that those partners already existed, and that they were Woody Pirtle and Alan Fletcher, David Hillman and Kit Hinrichs. SH: You were also out there movin’ and shakin’ in the design world. You were president of the AIGA/New York, a habitué of design conferences and mixers. MB: I love graphic design. I’ve been a glutton for this sort of stuff. So being the guy who always showed up for every single event, eventually you get to run the slide projector at the AIGA. I volunteered for some AIGA committees, then eventually got on the board, then eventually was one of those few people who were smart enough to be able to be the president and dumb enough to serve. SH: What was your goal as AIGA/New York president? MB: To make the AIGA like the “big tent” that the Republicans always talk about. I was the guy who said “Yes” to anything. I was AIGA president [from 1988-90] when the Walker Art Center’s “Graphic Design in America” exhibition was at the IBM Gallery here in New York and there was a lot of contention about who was included and who wasn’t. That was why I set up a programme to have professional designers – a few of whom were critical of the exhibit – act as museum guides. SH: Did you take a critical position? MB: First, I loved it because it was rooms filled with graphic design. But beyond that, it seemed inconsistent. I could never figure out which part of graphic design history it was supposed to be. It wasn’t so much that there was no Milton Glaser in it, because I think it’s a perfectly valid view to take of one kind of graphic design history – to show the rise and permutations of Modernism, for example. But if it was about Modernism, why wasn’t Rudy de Harak in the show? So I think the problem was that it was derived from a Rolodex that wasn’t quite as full as it should have been. It wasn’t based on a broad enough knowledge of the subject to do the right kind of thing. It either should have been narrower or broader. SH: In your position as a design glutton, would you presume to be the curator of such a show? If you were picking a thread, and the mandate was to create something that had some controversy, something that addressed either the issues or problems of graphic design, what would it be? MB: What has always fascinated me is watching how style is used and abused. I think you could do real case histories. The funniest little part of the “Mixing Messages” show on at the Museum of Modern Art in New York at the moment is where Ellen Lupton shows the typeface Neuland next to all those African-American book cover things. This typeface designed by a German, Rudolf Koch, in the 1930s, all of a sudden becomes the signifier for “there’s African-American Literature in here.” SH: It is easy, these days, to appropriate and steal. MB: Now we have relative freedom, it means that people who have conviction and people who just have enough time on their hands to click the mouse a few more times can achieve very similar results. It used to be that mediocre work looked bland and boring. Now it looks complicated and boring. But I think you still have the same challenge, to sort out what is really interesting and what is really original, and what is not. Also, the style cycle turns much more quickly. Cycles that took years now take months, and t"
