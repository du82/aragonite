full_description = "Blog: Reviews 1 February 2025 Sparking fear Joy and Fear offers a snapshot of modernity … [it] functions as a manual and audit on how the world works now … Joy and Fear offers a snapshot of modernity … [it] functions as a manual and audit on how the world works now … 19 November 2024 Books received #59 (catalogues) Three catalogues: 100 Beste Plakate 2022, 28th International Poster Biennale in Warsaw and Paula Scher: Type is Image This ‘books received’ focuses on a trio of graphic design catalogues. 11 November 2024 A feast for the eye ‘Looks Delicious!’ explores the mouth-watering art of shokuhin sanpuru – Japanese replica food Japan House London’s ‘Looks Delicious!’ is an incredible journey through a feast of Japanese food replica artistry and expertise. 25 September 2024 Books received #58 Four titles: Znak. from Ukraine; Darren Leader's Logo Rewind; Present Tense: Wahine Toi Aotearoa from New Zealand; and Unidentified Paper Object No.3 The history and visual language of trademarks; an activist approach to underrepresented voices; and the work of Marion Bataille. 26 July 2024 They showed backbone Spinorama is an exhibition of book spines in East London. Simon Esterson takes a sideways look Spinorama is an exhibition of book spines in East London. Simon Esterson takes a sideways look 5 July 2024 Seven artefacts in search of a museum If Japan had its own design museum, what would it include? Janet South reports from ‘Design Discoveries’ ‘Design Discoveries: Towards a Design Museum Japan’ is a free exhibition currently showing at Japan House London … 25 June 2024 Single track to a wide territory Interaction and communication were the order of the day at the second ATypI conference to be held in the Southern hemisphere. John D. Berry reports This year’s ATypI conference in Brisbane, Australia was the smallest ATypI in several decades, writes John Berry 14 December 2023 Science visualisation masterclass Building Science Graphics both recognises and responds to the growing need for scientists and designers to work together, writes Anne Odling-Smee. Building Science Graphics both recognises and responds to the growing need for scientists and designers to work together 19 October 2023 Picturebook people Illustrator Michael Kirkham pays tribute to the Provensens Authors, illustrators and designers Alice and Martin Provensen were a wife-and-husband team who made children’s picturebooks… 21 August 2023 Books received #54 Beer mats design; ‘how-to’ create interactive digital spaces; and Japanese-German cultural exchange project. In the latest embodiment of our ‘books received’ series, Eye looks at three different titles on graphic design and visual culture. 1 2 3 > Last >"
