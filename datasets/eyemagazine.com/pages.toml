full_description = "Rick Poynor Recent articles by Rick Poynor Gentleman’s relish [EXTRACT] Issue 107, Winter 2025 Review Gert Dumbar was always a social animal. He possessed an impish sense of humour, a twinkle in his eye, bags of charm, and he knew how to use them … Ambiguity blues Issue 107, Winter 2025 Opinion A graphically illustrated art project reflects our uneasy relationship with the truth. Critique by Rick Poynor Art of darkness Issue 106, Summer 2024 Opinion Indie magazine Hellebore channels folk horror and the occult with an alchemical sense of graphic style. Critique by Rick Poynor Images do the talking Issue 106, Summer 2024 Review Seeing ↔ Making: Room for Thought is an inventive and challenging new project from the always interesting publisher Inventory Press Banquet for a dude Issue 105, Autumn 2023 Review The late Milton Glaser occupies a unique position at the pinnacle of Anglo-American graphic design. While… Going off brand Issue 105, Autumn 2023 Review Jason Grant and Oliver Vodeb’s uncompromising handbook of theory and action ends slyly with a… Overloading the page Issue 105, Autumn 2023 Opinion A big survey of Dutch photobooks raises issues about visual editing and layout. Critique by Rick Poynor The creative anarchist Issue 105, Autumn 2023 Feature Printer, poet, designer and publisher Dennis Gould interweaves the personal with the political in his clamorous, intuitive letterpress work. By Rick Poynor. [EXTRACT] This is a column Issue 104, Spring 2023 Opinion Design that tells the story of its own making harks back to conceptual art of the 1960s. By Rick Poynor Waiting at the intersection Issue 103, Summer 2022 Review Designers are often fascinated by a visual practice in which the maker enjoys an enviable autonomy usually unavailable to themselves. Unfinished business Issue 103, Summer 2022 Opinion Scott King’s rallying call for creative freedom takes a satirical swipe at cultural gatekeepers. By Rick Poynor Experiments in destabilisation Issue 102, Autumn 2021 Opinion A CalArts book celebrates decades of purposeful graphic weirdness. Critique by Rick Poynor Los Angeles’ lost palace of treasures Issue 101, Summer 2021 Opinion Using photographic evidence, designer Mark Nelson has reconstructed one of the great twentieth-century art collections. Photo Critique by Rick Poynor Heroes of wealth and power Opinion An essay published in Mack’s new ‘Discourse’ series accuses three prominent photographers of creating propaganda for global capitalism. Photo Critique by Rick Poynor Godard becomes ‘Godard’ Opinion In 1961, the new wave director posed for a German fashion photographer. The publicity pictures that followed are as self-reflexive as his films. Photo Critique by Rick Poynor Palaces of petroleum Opinion The adventurous design of a 1960 book promoting Australia’s fossil fuel industry offers a poignant glimpse of an optimistic, unquestioning age.Photo Critique by Rick Poynor The haunted shore Opinion Images of spectral sea-bathers haunt the light-filled pages of Nigel Grierson’s self-published photobook. Photo Critique by Rick Poynor Netherworld of crime Opinion A new book expands upon an impressionistic photo-essay about crime by Gordon Parks, including images not published at the time. By Rick Poynor Eye’s early years Issue 100, Summer 2020 Feature Founding editor Rick Poynor recalls the aims and ideas behind the launch of an independent design magazine Recolouring the past Opinion At a time when image falsification is a source of concern, the digital colourisation of documentary photographs is a retreat from the truth. Photo Critique by Rick Poynor Instant object of desire Opinion A Polaroid photo’s aura of ephemeral uniqueness lies in its small white frame and supercharged surface. Photo Critique by Rick Poynor Whiteness made strange Opinion A brave, if flawed book of artists’ photographs addresses racism through the lens of white privilege. Photo Critique by Rick Poynor Scalpel sharp Opinion A UK retrospective examines the explosive photomontages of feminist artist Linder, from the shock of her punk collages to pictures that juxtapose provocation with flowers and dance Among the spirits Opinion Nadav Kander’s poetic and mysterious portraits of celebrities steal the limelight in his new book The Meeting. Photo Critique by Rick Poynor Four-wheeled dreams Opinion A new book of photographs of cars fails to acknowledge the bigger picture. Photo Critique by Rick Poynor Traces of longing Issue 99, Autumn 2019 Opinion For Belgian collagist Katrien De Blauwer, making work is both an obsession and an act of therapy. By Rick Poynor Defiance and revelation Opinion A new book of Peter Kennard’s work adds context and background detail to his angry, radical photomontages. Photo Critique by Rick Poynor Banquet of images Opinion For its 50th anniversary, the Arles festival stages a generous array of contemporary and historical exhibitions. Photo Critique by Rick Poynor. Nature in captivity Opinion Luigi Ghirri’s rigorously composed pictures of plants outside people’s homes exercise a banal fascination. Photo Critique by Rick Poynor A confederacy of lunches Opinion A text-only book argues that ‘social’ photography is more about self-documentation than aesthetics. By Rick Poynor Posters for the people Issue 98, Spring 2019 Opinion Photographs by the Polish designer Wojciech Zamecznik investigate the use of posters as public communication By Rick Poynor Two cheers for publishing Issue 98, Spring 2019 Feature A two-volume book packed with graphic design history is a visual blockbuster, but does little for scholarship. By Rick Poynor Catalogue of things Opinion A close relative’s colour slides show a densely layered record of everyday life. Photo Critique by Rick Poynor From out of the blue Opinion Volume one of Anna Atkins’ beautiful study of British algae, issued in 1843, was the first ever publication to be printed using photography. Photo Critique by Rick Poynor Awkward objects Opinion The tradition of the painted still life has been reinvented by contemporary photographers with pictures that pose a puzzle and slow the viewer down. Photo Critique by Rick Poynor Streets without people Opinion Emigre’s Rudy VanderLans explores the clotted terrain of Tokyo’s Shibuya and Shinjuku districts with the eye of a graphic designer Hole in the head Opinion An artful book of deliberately torn, anonymous photographs from the Cold War era leaves many questions unanswered. Photo Critique by Rick Poynor Hardcore history Issue 97, Autumn 2018 Review More than 40 years after punk happened, the phenomenon is still being fêted as a… Cinematic view Issue 97, Autumn 2018 Opinion A recent edition of Aperture examines the enduring affinity between two art forms. Photo Critique by Rick Poynor Twisting the alien Opinion Set to minimalist techno, Arthur Jafa’s APEX is a cycle of images that illuminate the condition of black people within white-dominated culture. Photo Critique by Rick Poynor Scenes from an imperfect world Opinion Even Don McCullin expressed doubts about his photographs of war and suffering. What is their message today? Photo Critique by Rick Poynor Emotion pictures Opinion Alex Prager’s ravishing tableaux mix glamour and unease. Photo Critique by Rick Poynor No fixed style Issue 96, Spring 2018 Review Among British independent record companies, Mute Records, founded in 1978 by ‘accident’, has never enjoyed… Mining the ruins Issue 96, Spring 2018 Opinion When petrol replaced coal, the island of Hashima lost its purpose and slowly decayed. Rick Poynor examines a new photobook haunted by the past Enigmas of abstraction Opinion Photography records with startling accuracy. Why use it to create non-representational images? Photo Critique by Rick Poynor Different kinds of marginal Opinion Diane Arbus’s unsparing images retain their power to discomfit. Photo Critique by Rick Poynor Colour field Opinion By choosing colour over black-and-white, Joel Meyerowitz pioneered a new type of American street photography. Photo Critique by Rick Poynor Fabricated reality Opinion Andreas Gursky’s photographs, manipulated like digital paintings, have spectacular impact. But they can display a lofty detachment from their subjects. Photo Critique by Rick Poynor Witness of the moment Opinion A book of informal interviews with Henri Cartier-Bresson is testament to a great photographer’s intuitive eye. Photo Critique by Rick Poynor Exposing the menace Issue 95, Winter 2017 Feature David King’s posters integrated type and image with power and uncompromising political commitment. By Rick Poynor Relentless riches Issue 95, Winter 2017 Opinion A busy blockbuster traces the stunning history of Japanese photobooks. Photo Critique by Rick Poynor Mississippi dreaming Opinion Alec Soth’s photographic journey along the Mississippi merges the documentary with the poetic. Photo Critique by Rick Poynor Graphic language of the wall Opinion Brassaï’s photographs of graffiti with handwritten typographic treatments made striking, almost punkish paperback covers for Le Livre de Poche Bauhäuslers at rest and play Issue 94, Summer 2017 Review When we think of the photographic experiments of the 1920s, what immediately comes to mind… Beyond context Issue 94, Summer 2017 Opinion Mysterious equipment, unknown officials and arcane activities combine in a photobook that is testament to the art of selection and editing. Photo Critique By Rick Poynor The joy and sadness of dust Opinion A familiar domestic nuisance provides the theme for this ambiguous and labyrinthine exhibition. Photo Critique by Rick Poynor Inner space man Opinion Mike Halliwell’s montages illustrate J. G. Ballard’s The Atrocity Exhibition with a flair that evokes the late author’s own experiments with cut and paste. Photo Critique by Rick Poynor Age of the female gaze Opinion Girl on Girl – a new survey of 40 contemporary photographers – raises questions about the nature of representation without necessarily answering them. Photo Critique by Rick Poynor Double satori Opinion For photographer Sergio Larrain (1931-2012), making pictures was a form of spiritual quest. Photo Critique by Rick Poynor Modernist cottage industry Issue 93, Winter 2016 Feature For more than a decade, Ruth Artmonsky has been publishing modest, readable books about design and illustration from her London flat Reputations: Fuel Issue 93, Winter 2016 Feature ‘We love collecting vernacular … it’s functional, not following a preconceived idea of what is correct. This can give it an unexpected quality … in “real” design all those elements are lost. Everything is too considered.’ By Rick Poynor Traces of a drifter Issue 93, Winter 2016 Opinion Camera in hand, Harry Pearce dives into the urban underbelly in search of the unfathomable. Photo Critique by Rick Poynor Elton John's new vision Opinion ‘The Radical Eye’, the superstar’s opulently framed collection of modernist photography, is a revelation. Photo Critique by Rick Poynor Feminist scrutiny Opinion Photographs challenge norms of female sexuality, beauty and domesticity. The first in a new series of monthly Photo Critiques by Rick Poynor Take my concept Issue 92, Summer 2016 Feature Boris Bućan’s early posters display an audacity that challenges divisions between graphic design and fine art Browsing, or reading? Issue 92, Summer 2016 Opinion A new shop demonstrates the global resurgence of indie magazines. Critique by Rick Poynor From trade to poetry Issue 91, Spring 2016 Opinion Barcelona’s new Museu del Disseny shows how design can claim a space for itself. Critique by Rick Poynor Depth and ambiguity Opinion Another Way of Telling, by John Berger and Jean Mohr, extends the possibilities of the photographic narrative. Photo Critique by Rick Poynor Cold War culture-jammer Opinion Hispanic photomonteur Josep Renau aimed Technicolor jets of scorn at the mirage of US consumerist culture. By Rick Poynor Online rhetoric Issue 90, Summer 2015 Opinion Though intended to make its contents ‘democratic’, art website The Space is a perplexing jumble. Critique by Rick Poynor Words and pictures talking Opinion Canongate has reissued John Berger and Jean Mohr’s A Fortunate Man, about Gloucestershire doctor John Sassall. How does it compare with the 1967 original? Photo Critique by Rick Poynor Trust me, I’m a photographer Issue 89, Winter 2014 Review I’m familiar with Joan Fontcuberta’s work, so I should have known better. The Spanish photographer… Pay close attention Issue 89, Winter 2014 Feature Adam Michaels and Prem Krishnamurthy of Project Projects bring deep cultural engagement to every aspect of their practice, both in their client work and in their personal ventures Against the flow Issue 89, Winter 2014 Opinion As editorial design becomes more predictable, Swedish feminist quarterly Bang kicks against visual norms. Critique by Rick Poynor Energy and emotion Opinion Aperture’s new series of photography books may prove to be an essential educational resource for serious smartphone snappers Readymade format Issue 88, Summer 2014 Opinion An illustrated ‘gift book’ dictionary by Heretic brings Marcel Duchamp’s ideas to a wider audience. Critique by Rick Poynor The retoucher’s accidental art Issue 88, Summer 2014 Feature The reworked press photos now being discarded are unique objects and compellingly strange images. Raynal Pellicer has a collection Photographer as page maker Opinion David Campany’s examination of Walker Evans’ freewheeling magazine work – for Fortune, Architectural Forum, Life, and others – is a revelation. Photo Critique by Rick Poynor Space for stories Issue 87, Spring 2014 Opinion Visual Editions’ box of literary maps challenges authors to think differently about the structures that link words and images. Critique by Rick Poynor Occupation hazardous Opinion For ‘place hackers’, subversive and daredevil urban explorers, photography validates a search for the sublime. Photo Critique by Rick Poynor Incisive vision Issue 86, Autumn 2013 Opinion Eduardo Paolozzi’s gifts as a collagist have been neglected by the worlds of both art and design. Critique by Rick Poynor Empathy and doubt in Arles Opinion From the cool alienation of colour to the directness of black and white – Rick Poynor reflects on the 2013 Rencontres d’Arles photography festival. Critique by Rick Poynor Screen prints Issue 85, Spring 2013 Feature Recently discovered posters for the RCA Film Society provide fresh perspective on the intimate relationship between graphics and cinema in the 1950s and 60s. Identity crisis Issue 85, Spring 2013 Opinion Rebranding ITV was meant to generate a warm glow – not the heated reaction it received from viewers. Critique by Rick Poynor Cold-blooded runaways Opinion A third edition of Redheaded Peckerwood, Christian Patterson’s ravishing photobook, gives this enduring American horror story another twist. Critique by Rick Poynor An outlandish everyman Issue 84, Autumn 2012 Opinion These short films"
