title = "Eye Magazine | Blog | Timeless: Massimo Vignelli"
full_description = "Friday, 3:25pm 20 February 2015 Timeless: Massimo Vignelli Design history Graphic design Information design Posters Typography Visual culture Fellow designers celebrate the life and work of Massimo Vignelli at an exhibition in San Sebastián A new exhibition at the Okendo Cultural Centre in San Sebastián, Spain, celebrates the life and work of Massimo Vignelli. ‘Timeless: Massimo Vignelli’ was initiated by Alain Villastrigo and Ernesto Arnáez of Basque graphic design studio Husmee, in association with former Vignelli Associates Beatriz Cifuentes and Yoshiki Waterhouse. The exhibition includes original material from Cifuentes’s and Waterhouse’s personal archives – including brand guidelines, original drafts and supporting materials, catalogues, magazines, invitations and stationery – as well as furniture designed for and lent by Knoll, Heller and Poltrona Frau. This material is displayed alongside tribute posters designed by more than 30 selected designers and design studios, including Alberto Corazón, Atlas, Javier Mariscal, Mucho and Toko (among many other Basque, Spanish and international participants). Installation photograph at ‘Timeless: Massimo Vignelli’. Top: Alain Villastrigo and Ernesto Arnáez (of Husmee Studio Graphique!) in front of the entrance display. Work from the Vignelli Associates’ archive. Husmee’s Villastrigo says that the impetus behind the exhibition and the forthcoming issue of Husmee magazine looks to ‘Massimo Vignelli, his work and his legacy in the world of design’. ‘Massimo Vignelli is a reference for our work in the Husmee studio. It has been almost one year since he passed away and we decided to pay tribute to him’, says Villastrigo. ‘San Sebastián is the European Capital of Culture 2016 and it is also our city. We want our city to know this great master of design.’ Tribute poster by Husmee. Tribute poster by Mash Creative. Tribute poster by Javier Mariscal. Beatriz Cifuentes and Yoshiki Waterhouse (Waterhouse Cifuentes Design), who were associates of Massimo Vignelli for many years until his death, will be speaking at the Hotel Astoria in San Sebastián 17 April 2015. ‘Timeless: Massimo Vignelli’ continues until 18 April 2015 at Cultural Centre Okendo K. E., Avenida de Navarra 7, San Sebastián, Basque Autonomous Community, Spain. See ‘Reputations: Massimo Vignelli’ in Eye 83. Portrait of Massimo Vignelli by Maria Spann. Installation photographs from ‘Timeless: Massimo Vignelli’ which continues until 18 April 2015 at C. C. Okendo, San Sebastián, Spain. Massimo Vignelli, 1931-2014. Eye is the world’s most beautiful and collectable graphic design journal, published quarterly for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. Links Vignelli Associates Husmee SuperWarmRed Designs ‘Reputations: Massimo VIgnelli’ in Eye 83 var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '18891'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
