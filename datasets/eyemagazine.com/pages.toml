er the war ended, tells an emotive story of frenzied nationalism. By Daoud Sarhandi In mid-1995, however, I went to Bosnia with a burning sense of outrage … we tracked down and photographed around 700 posters, magazine covers and postcards. 12 April 2022 Bob Gill (1931-2021) Bob Gill, graphic design US designer Bob Gill was a founding father of British graphic design. Patrick Baglee pays tribute Bob Gill, who has died aged 90, was a vocal advocate of the importance of original graphic solutions, determined not by the prevailing graphic style, but by the nature and context of the problem … 8 November 2021 Silent sound musicdesign Chris Bigg’s ‘sketchbook’, Analogue Process 1987 – 2019, is a hymn of praise to ink on paper Chris Bigg has enjoyed a close relationship with many musicians and music labels over his substantial career … 1 2 3 > Last >"
