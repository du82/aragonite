["https://www.eyemagazine.com/magazine/issue-106"]
title = "Eye Magazine | Magazine |"
full_description = "Opinion Editorial Eye 106 John L. Walters It is in the nature of an Eye type special issue to be full of the shapes of letterforms and images of letters. Art of darkness Rick Poynor Indie magazine Hellebore channels folk horror and the occult with an alchemical sense of graphic style. Critique by Rick Poynor Type history’s golden age Paul Shaw Digital technology and online resources have prompted a flowering in type history, says Paul Shaw Features Reputations: Sharp Type, Chantra Malee and Lucas Sharp John L. Walters, Simon Esterson, Eye editors Lucas Sharp: ‘The only thing keeping me excited about being in this industry, and doing this work, is the stuff I have yet to draw.’ Chantra Malee: ‘We could have sold the entire foundry but ... what are we supposed to do for the rest of our lives?’ [EXTRACT] Anita Klinz: The first Italian art director Luca Pitoni Over two crucial decades at Mondadori, designer Anita Klinz transformed the look of Italian book publishing. Luca Pitoni tells her story Eye type review. Take six fonts Mark Thomson, Indra Kupferschmid, Silvia Sfligiotti, Dan Reynolds A snapshot of contemporary type design, with half a dozen reviews by Mark Thomson, Indra Kupferschmid, Silvia Sfligiotti and Dan Reynolds Archiving the archive Eye editors, John L. Walters When the Type Archive left its London premises, its vast collection was disbanded and its working Monotype hot-metal plant moved to the National Collections Centre. Two long-serving volunteers talk to Eye about the challenges they faced and how the history of the Archive is now being preserved. Photographs by Philip Sayer [EXTRACT] Harmony and counterpoint Ferdinand P. Ulrich The ideas and assumptions behind ‘global’ or ‘multi-script type’ raise complex and nuanced issues that have taxed both type designers and graphic designers for years. Current technology and the demands of communication and ‘branding’ have thrown up debates about the creation of readable documents, signs, packages and websites in which two or more different scripts are obliged to coexist. In this article, designers from different corners of the globe discuss some of the concerns and contradictions that inform the making and setting of multiple scripts with Ferdinand P. Ulrich [EXTRACT] Phil Baines remembered Andy Altmann, Catherine Dixon, Robin Klassnik, Judy Willcocks, Alessia Mazzarella, Kevin Carmody, John L. Walters Friends and colleagues pay tribute to the influential British typographic designer, writer and teacher (and cycling enthusiast), who died in January [EXTRACT] Reviews Small Prints System Process Form Why Graphic Culture Matters Inscript Experimental Type Festival 2023 Twen [1959-1971] North: Extracts from Visual Identities Digital Design: A History Seeing ↔ Making: Room for Thought Stefan Themerson Amos Paul Kennedy, Jr.: Citizen Printer Mid-Century Type Herbert Bayer’s World Geo-Graphic Atlas and Information Design at Midcentury The Defenders: Heroes of the Global Fight for Human Rights The Graphic Design Bible"
