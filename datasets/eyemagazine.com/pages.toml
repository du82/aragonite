title = "Eye Magazine | Blog |"
full_description = "Tuesday, 3:00pm 4 March 2025 Graphic design live #19 Anette Lenz at L’Onde Théâtre; With a Bird and Typography Conference in the Netherlands; Splash!; and Outlaws in London; Women’s Rights Posters in Milwaukee Here is a selection of current and upcoming events worth noting … to stay up to date with exhibitions, conferences, talks and workshops, read the Eye Events page, updated weekly. Currently on A x Z: Anette Lenz To 5 April 2025 Anette Lenz’s designs the visual identity of L’Onde Théâtre each season. The ‘A x Z’ exhibition promises ‘an immersive, dynamic and poetic experience’. See ‘Anette Lenz: Poetic rhetoric in the public realm’, Jan Middendorp’s profile of Lenz in Eye 101. Admission is free. L’Onde Théâtre, 8 bis, avenue Louis Breguet, 78140 Vélizy-Villacoublay, France The A x Z exhibition is an immersion in the striking graphic signature of Anette Lenz, open until 5 April 2025. With a Bird To 27 April 2025 ‘With a Bird’ explores birds as transgressors, inspiring humans in both scientific and spiritual understandings of life. This exhibition showcases projects, objects, and investigations where artists explore our relationships with birds. These works delve into how we seek to understand, emulate, and connect with birds while examining how they transcend categories such as human and non-human, science and folklore, life and death, reality and dreams, and the realms of land, water, and sky. ‘With a bird’, supports resident city birds such as sparrows, black crows, blackbirds, magpies and tits with supplementary foods and invites humans to dream, imagine, speculate, observe, converse, listen, read, feed, reminisce and reflect. Admission is free / Open every Friday, Saturday and Sunday between 12:00-5:00pm Onomatopee, Lucas Gasselstraat 2a, 5613 LB Eindhoven With a Bird features works by Daniel Godínez Nivón, Ignace Cami, Bryony Dunne, Ai Ozaki, Sergio Rojas Chaves, Monika Czyżyk, Manjot Kaur and Sara Sejin Chang (Sara van der Heide) until 27 April 2025. Coming soon Fontstand International Typography Conference 14-15 March 2025 Fontstand’s fifth annual typography conference returns to The Hague, with speakers including Hansje van Halem (see Eye 98), Tobias Frere-Jones (see Eye 54), Huda Smitshuijzen AbiFarès (Khatt Foundation), Mitch Paone (see Eye 104), Riccardo Olocco (CAST), Joyce Ketterer (Darden Studio) and Gert Dumbar in a two-day programme of presentations and discussions. Buy tickets here. The event is organised by Fontstand (see article in Eye 97) in partnership with TypeMedia / KABK and Huis van het Boek. Nieuwe Kerk, Spui 175, 2511 BM Den Haag, Netherlands The fifth annual typography conference will feature a packed two-day program of presentations and discussions from 14-15 March 2025. Splash! A Century of Swimming and Style 28 March – 17 August 2025 A major exhibition celebrating our enduring love of the water over the past 100 years. Explore the full spectrum of the design of swimming – from sports performance and fashion, to architecture. Admission ranges from £7 - £15. The museum opens daily from 10:00 to 17:00. The Design Museum, 224-238 Kensington High St, London W8 6AG Discover over 200 objects, collectively exploring swimming’s evolution in its social, cultural, technological and environmental contexts from 28 March at The Design Museum. Final week Women’s Rights are Human Rights: International Posters on Gender-Based Inequality, Violence and Discrimination Until 8 March 2025 An exhibition featuring a powerful collection of international women’s rights and advocacy posters that highlight the ongoing struggle for gender equality. Created by artists and designers of all genders, the posters on display appeal to the collective responsibility to protect human rights, challenge gender stereotypes, and advance women’s rights. With widely varying stylistic and media approaches, these posters balance uniquely different artistic perspectives with a universal message. Also showcased are impactful poster designs by MIAD students, who have embraced the theme of women’s rights and gender equality with their distinctive interpretations and innovative creative approaches, offering fresh perspectives that complement the global dialogue. Curated by Elizabeth Resnick, Professor Emerita, Massachusetts College of Art and Design. Brooks Stevens Gallery, 273 E. Erie St., Milwaukee, W​I Credits left to right: Parisa Tashakori, Women’s Rights, 2017; Tina Lam Collier (‘turnonred’), This Body is Not a Political Battleground, 2012; ; Shepard Fairey, Defend the Rights of Women and Girls, 2011. Outlaws: Fashion Renegades of 80s London Until 9 March 2025 This exhibition focuses on 1985, the year designer and performance artist Leigh Bowery opened the legendary nightclub Taboo. Displaying original garments and accessories from Leigh and more than 30 designers, including custom-made pieces from private collections, photography, film and artworks, the exhibition focuses on this outrageous, alternative arena in which the anarchic energy of the night spilled over into the experimental creativity of the day. (Just over a mile away, an overlapping exhibition – Leigh Bowery – has just opened at Tate Modern, running until 31 August 2025.) Tickets £12.65 (Concessions may apply), Tuesdays – Saturdays, 11.00 – 18.00 (last entry 17.15) Read ‘Dress to express’, Janet South’s review of the show on the Eye Blog. Fashion and Textile Museum, 83 Bermondsey Street, London SE1 3XF Outlaws: Fashion Renegades of 80s London is open until 9 March 2025. Photo: Leigh Bowery. © Derek Ridgers, c/o Unravel Productions. To feature your event on Eye events page, please email us with details. Eye is the world’s most beautiful and collectable graphic design journal, published for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '523694'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
