["https://www.eyemagazine.com/blog/post/shifts-and-glyphs-in-istanbul"]
title = "Eye Magazine | Blog |"
full_description = "Wednesday, 5:00pm 26 February 2025 Shifts and glyphs in Istanbul Critical Shifts Barın Han, Boyacı Ahmet Street No:4, Binbirdirek District, Çemberlitaş/Istanbul, Türkiye, 3 October – 30 November 2024 At ‘Critical Shifts’, a group exhibition in Istanbul, Türkiye, Gülizar Çepoğlu unfolds the materiality of writing ‘Critical Shifts’, curated by Margarita Osepyan, Maria Korolkova and Kate Umnova, is a group show that took place in October through November 2024 in Istanbul’s Barın Han, writes Gulizar Cepoglu. The show explored shifts as both generative processes and forces – creative acts with the potential for renewal and transformation. Each work introduced a critical shift in perception, revealing different layers of human reality. Together, they invited the audience to see transformation as a catalyst for curiosity and meaning. The venue is an independent art space that was once a bookbinding hub and the atelier of calligrapher Emin Barın, who played a pivotal role in adapting the rich cursive elegance of Ottoman calligraphy to the Turkish Latin alphabet. Right. Galata Tower, constructed in 508 AD and rebuilt by the Genoese in 1348, stands sentinel over Perşembe Pazarı, a historic trade hub along the Golden Horn. Photo: Ayşe Erler. Top. 3D-printed, metre-long sculptural glyph, produced at the ISO ETP, Istanbul Chamber of Industry Industrial Design and Prototyping Center. Photo: Fethi Izan. The choice of Istanbul reflected the exhibition’s thematic concerns. As a historic and cultural crossroads between Europe, Minor Asia, the Middle East, and North Africa, the city embodies the interplay of migration, transformation and systemic change. Bringing together diverse artistic voices in this venue emphasised the curatorial vision. The venue of ‘Critical Shifts’ is an independent art space that was once the atelier of calligrapher Emin Barın (1913-1987), who, from 1943 until his passing, played a pivotal role in adapting the continuous, rhythmic, and proportional pattern systems of Ottoman calligraphy to the modern Turkish alphabet. Alongside his calligraphic practice, Barın played a key role in reviving bookbinding and taught at the Istanbul State Academy of Fine Arts. Today, Barın Han continues his legacy. Allah’ın İsmi (8 Tekrar) [The Name of Allah (8 repetitions)], 1976. This geometric calligraphic composition features the name of Allah repeated eight times, a common motif in Islamic calligraphy. The radial symmetry reflects nature of ‘serbest’ (free) compositions, where form and meaning merge. Image from the archive of Emir Barın. The 1928 alphabet reform revolutionised Turkish literacy, replacing the Arabic script with a Latin-based alphabet to better suit the phonetics of the Turkish language. Yet, this shift severed ties to traditional Islamic calligraphy, stripping it of its metaphysical dimension and the sacred geometry of its patterns. Decades later, Emin Barın sought to reconcile this rupture, integrating the rhythmic, continuous curves of Islamic Ottoman calligraphy into a modern typographic language. Beyond mere hybridisation, his work navigated the ideological, linguistic, and metaphysical tensions of this transformation—bridging the material and immaterial, not as opposites, but as interwoven forces within a secular Turkey. Installation image from ‘Critical Shifts’, Istanbul, Türkiye, 2024. Burçak Bingöl’s ceramic works are closely interlinked with Barın’s legacy. Her intricate processes reinterpret traditional techniques through contemporary processes, echoing Barın’s adaptation of Ottoman calligraphy to contemporary typography. Photo: Zeynep Fırat. The ‘Critical Shifts’ exhibition featured 21 multidisciplinary visual artists, and many works in the exhibition explored the interplay between material and immaterial, visible and invisible forces. Displayed alongside Barın’s calligraphic prints and carved wooden calligraphy, my typographic sculptures and prints further this dialogue – challenging the conventional separation of text and image in writing systems. Expanding on this inquiry, I explore the materiality of writing by reimagining language beyond its flat, linear constraints. Three-dimensional letterforms blur the boundaries between text, image, architecture and sculpture. By transforming abstract thoughts into tangible, sensory experiences, I aimed to reconnect audiences with the materiality of language. Life is Like a Tooth: Homage to Boris Vian by Gülizar Çepoğlu, 2024. Boris Vian’s 1950s poem La Vie C’est Comme Une Dent is reinterpreted through a series of letterpress prints transformed into 3D forms and sculptures. The work was constructed using 3D-printed letterforms and traditional letterpress furniture at Camberwell College of Arts. Photographs by John Whapham at Camberwell College of Arts, UAL, March 2024. This exploration delves into the layered visual and symbolic meanings of earlier writing systems, reclaiming their historical depth – from hieroglyphs to contemporary innovations – while engaging with the influence of digital technologies. My reinterpretations challenge the reduction of letterforms to linear symbols solely representing sound, expanding their interpretive possibilities through spatial, symbolic, and tactile experiences. Through these sculptural forms, I explored how the interplay of text, image and material could embody meaning – inviting audiences to engage with language on multiple levels, from the literal to the hieroglyphic and symbolic. Traditionally, letterpress technology produces reversed material artefacts – tools of reproduction visible only to the printer. Reimagining these forms as right-way-reading 3D objects transforms them into autonomous, tactile glyphs. This approach show the way that phonetic alphabets reduce writing systems to abstract, linear representations, offering a new paradigm where text, image and materiality intertwine to create immersive visual languages. Still image from the slowed-down The Shining Will Come Down Crashing by Dimitri Venkov, 2018. Venkov’s film slows motion to a near-halt, disrupting conventional perceptions of time and movement. This deceleration forces viewers to notice what usually escapes attention, bringing the mind into a meditative state in which the slowing of movement creates space for deeper, more critical reflection. Installation photo: Zeynep Fırat. Venkov’s film adopts a parallel methodology, using deceleration to transform a volleyball game into painterly movements – kinetic hieroglyphs conveyed through rhythm and pacing. By slowing motion down to 1/40th of real-time, his work invites audiences to reflect on the deeply embedded narratives within bodily gestures, transforming motion into a visual language that challenges conventional ways of reading narrative and meaning. How meaning is constructed and experienced is central to Dimitri Venkov’s work. Both Venkov’s and my works interrogate inherited systems – whether through slowing cinematic motion or reshaping letterpress typography – urging audiences to rethink how technologies and media shape perception and expression. Boris Vian poster on the letterpress bed, 2024, Gülizar Çepoğlu. The image shows the forme locked in place on the press bed ready for printing. Printed by hand at Atelier de la Cerisaie in Paris under the direction of Michael Caine, the edition consists of twenty numbered and signed copies on handmade Japanese papers. By questioning what writing can become, I aim to reconnect language with the body, reintroducing depth, texture, and physicality into the way we create and understand meaning. These creative disruptions propose critical shifts that reshape foundational concepts of perception and expression.La Vie C’est Comme Une dent 3D and letterpress sculpture posters reflecting on how both the alphabet and our 32 teeth shape expression. Personal dental artefacts, including a wisdom tooth and a dental mould, connect the text to lived experience, turning writing / reading into something felt as well as seen through the poetry of Boris Vian, whose words inspired this idea. Photos: Zeynep Fırat. In ‘Critical Shifts’, curators Margarita Osepyan, Maria Korolkova, and Kate Umnova brought together diverse artistic voices; by amplifying interplay between art, science, and technology, it celebrated creativity as a transformative force inspiring us to embrace the complexities of contemporary life as catalysts for curiosity and meaning. Gülizar Çepoğlu, designer, design lecturer, London and Istanbul. La Vie Cest Comme un Ziggourat. Inspired by Battleship Potemkin’s Odessa Steps sequence, it sets Boris Vian’s poem as a stepped structure. Suspended high, it initially appears as a cityscape. Produced at the ISO ETP, Istanbul Chamber of Industry Industrial Design and Prototyping Center. Photo: Fethi Izan. Eye is the world’s most beautiful and collectable graphic design journal, published for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. Links Barın Han gallery Critical Shifts Emin Barin ’s archive at the Mimar Sinan University var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '553255'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
