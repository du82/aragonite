full_description = "Critique Critique (established 1999) is the regular Eye column by Rick Poynor. Banquet of images Rick Poynor For its 50th anniversary, the Arles festival stages a generous array of contemporary and historical exhibitions. Photo Critique by Rick Poynor. Nature in captivity Rick Poynor Luigi Ghirri’s rigorously composed pictures of plants outside people’s homes exercise a banal fascination. Photo Critique by Rick Poynor A confederacy of lunches Rick Poynor A text-only book argues that ‘social’ photography is more about self-documentation than aesthetics. By Rick Poynor Posters for the people Rick Poynor Photographs by the Polish designer Wojciech Zamecznik investigate the use of posters as public communication By Rick Poynor Catalogue of things Rick Poynor A close relative’s colour slides show a densely layered record of everyday life. Photo Critique by Rick Poynor From out of the blue Rick Poynor Volume one of Anna Atkins’ beautiful study of British algae, issued in 1843, was the first ever publication to be printed using photography. Photo Critique by Rick Poynor Awkward objects Rick Poynor The tradition of the painted still life has been reinvented by contemporary photographers with pictures that pose a puzzle and slow the viewer down. Photo Critique by Rick Poynor Streets without people Rick Poynor Emigre’s Rudy VanderLans explores the clotted terrain of Tokyo’s Shibuya and Shinjuku districts with the eye of a graphic designer Hole in the head Rick Poynor An artful book of deliberately torn, anonymous photographs from the Cold War era leaves many questions unanswered. Photo Critique by Rick Poynor Cinematic view Rick Poynor A recent edition of Aperture examines the enduring affinity between two art forms. Photo Critique by Rick Poynor < 1 2 3 4 5 > Last >"
