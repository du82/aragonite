title = "Eye Magazine | Page | Newsletter"
full_description = "Newsletter Sign up to the editor’s newsletter To receive the editor’s monthly newsletter, please fill in this form (on MailChimp). We won’t give your email address to anyone else – this is just for the Eye newsletter. (Your details will be processed by Eye Magazine in full accordance with all relevant UK & EU data protection legislation.) The latest newsletter ⬇️ 28 February 2025 Eye 107 out and about Dear friends Eye 107 had its very own launch party at Reference Point earlier this month, where we welcomed many contributors and friends for drinks and some short talks about the issue. J. P. Hartnett read an extract from his Eye 107 article ‘Baked in’ (about the environmental and ethical implications of Artificial Intelligence) and Simon Esterson and John Walters discussed the processes and choices behind making the issue. You can read short extracts from the latest issue online, and the full text of J. P. Hartnett’s article ‘Baked in’, but the best way to experience Eye is by getting hold of a printed edition. … Field’s Jann Choy holding Eye 107, which features her AI avatar on the cover, juxtaposed with the ‘Children crossing’ sign designed by Jock Kinneir and Margaret Calvert. Margaret Calvert with a copy of Eye 107 at our Reference Point party. To read more click here … 14 February 2025 Last chance to see Dafi Kühne’s posters in London Dafi Kühne poster show – last day! Dear friends ‘Dafi Kühne: The real thing’ is a London show of Dafi Kühne’s extraordinary posters in a special exhibition at St Bride Foundation, 12 Bride Lane, EC4 8EQ (off Fleet Street). The show is free to all and the posters are for sale, but please note that it ends today, Friday 14 February, at 6pm … 5 February 2025 Dafi Kühne posters and Eye 107 Eye magazine’s Type Tuesday, ‘Dafi Kühne. In person. In print’, has now sold out but there’s still a chance to see (and buy) some of Dafi Kühne’s extraordinary posters in London next week. Dafi Kühne, St Bride Foundation and Eye magazine have collaborated on a not-to-be-missed exhibition for three days only. ‘Dafi Kühne: The real thing’, will display Dafi’s posters in a special show at St Bride Foundation, 12 Bride Lane from 12-14 February. The exhibition is free to all and posters will be on sale. 28 January 2025 Type Tuesday ticket reminder! (NOW SOLD OUT) 16 January 2025 Come to Type Tuesday with Dafi Kühne Dear friends We are happy to start our new year with an exciting announcement. Eye magazine’s first Type Tuesday of 2025 will feature Swiss poster designer, letterpress printer and graphic design educator Dafi Kühne. Dafi will be talking about his work and will be showing (and selling) some of his full size posters. Type Tuesday: Dafu Kühne. In person. In print will be on 11 February at St Bride Foundation. Book now, you won’t want to miss this! Above. Dafi Kühne at his studio in Näfels. Photo by Peter Hauser. Eye is internationally available, via subscription and from good bookshops and magazine specialists. (See the list of stockists on our site.) You can also buy single issues online. Best wishes from the Eye team of me, John, Simon, Holly, Amy and Sam Janet South PS. Tickets for ‘Dafi Kühne. In person. In print’, are selling fast – book yours today! 9 December 2024 Eye 107 coming soon … Dear friends We are about to go to press with Eye 107, an exciting issue with a wide range of must-read articles. There’s hip-hop / R&B graphics from Amaya Segura, a Reputations interview with UK road sign legend Margaret Calvert, six new type reviews and a feature about US lettering maestro Michael Doret. 25 November 2024 Book for Type Tuesday tomorrow! 21 November 2024 Books that rock! Book your ticket Please don’t neglect to book for Books that rock!, our last Type Tuesday of 2024 on 26 November at St Bride Foundation. Jim K. Davies and Jamie Ellul will talk about their book Logo Rhythm and Lucinda Rogers will discuss New York Winter 1988 (sketches from her first time in that city) and her recent reportage illustrations covering the US elections for The Guardian. Book your tickets now! Tickets are £14.00, £12 (concessions) and £9 (students). Advance booking is recommended as all tickets are £16 on the door. 14 November 2024 Come to Type Tuesday on 26 November We are excited to announce that our last Type Tuesday of 2024 will be Books that rock! on 26 November at St Bride Foundation. We are looking forward to talks from our speakers Jim K Davies and Jamie Ellul about their book Logo Rhythm and from Lucinda Rogers who will talk about New York Winter 1988 (sketches from her first time in that city) and her recent reportage illustrations covering the US elections for The Guardian. Book your tickets now! 23 October 2024 Out and about with the Eye team Dear friends The Eye team has been busy with Eye 107 while squeezing in various events around the globe, including a exhibition in Xi’an, China (more news later), a Pulp tenth anniversary event (last night) and ‘Magazine Street’, the International Magazine Centre’s one-day conference about mag publishing in Edinburgh last month, which featured art director Simon Esterson and art editor Holly Catford … Spread from ‘Ten projects by Jim Sutherland’, Eye 101. Portrait by Philip Sayer. 23 September 2024 Eye 107 in progress … Dear friendsWe’re busy at our Haggerston studio finalising the contents of Eye 107 …Maquette for road signs designed by Jock Kinneir and Margaret Calvert, now archived at St Bride Printing Library. Subscribe to Eye now to make sure you get a copy of Eye 107 delivered to your home or studio in a sturdy box. If you are already a subscriber please make sure your subscription is up to date (log in with your details here) and that we have your latest postal address. You’d be surprised how many people forget to tell us when they move their home or studio … 29 August 2024 Come to Type Tuesday: My (favourite) font Dear friends Tickets are selling fast for Type Tuesday: My (favourite) font, our next event, which will take place on 10 September at St Bride Foundation, London. Eye has asked eight designers to choose their favourite font and give a short talk explaining their choice. Tickets: £9 (students), £12 (friends of St Bride and concessions), £14 (full price) available here. Save money by buying tickets in advance – door sales will be £16 including concessions. All ticket income supports the St Bride Foundation.Speakers (from L-R top) Catherine Dixon, Erik Spiekermann, Greg Bunbury and Holly Catford; (from L-R bottom) Kuchar Swara, Melanie Mues, Sallie Morris and Violetta Boxill. 13 August 2024 Come to Type Tuesday on 10 September Dear friends We are excited to announce that Type Tuesday: My (favourite) font, our next event, will take place on 10 September at St Bride Foundation, London. Eye has asked a selection of designers to choose their favourite font and give a short talk explaining their choice. Tickets: £9 (students), £12 (friends of St Bride and concessions), £14 (full price) available here.Above: speakers (L-R) Erik Spiekermann, Catherine Dixon, Kuchar Swara, Melanie Mues and Greg Bunbury. Plus more to be announced soon … 29 July 2024 Eye 106 out and about We’ve had some great reactions to Eye 106 from subscribers, newsstands and social media, including our most popular Instagram post to date, with more than 1000 ‘likes’ for our three covers. You can buy a copy now from the Eye shop, or subscribe to Eye and get this issue – and the next three – delivered to your door. Screenshot from the weekly roundup at Casa Magazines in New York City. 12 July 2024 This is the type special issue Dear friendsOur latest issue, Eye 106 comes out today. It’s a type special with three different covers. In case you don’t already subscribe, it’s now available to buy from the Eye shop. 16 June 2024 June newsletter: Eye 106 on press soon Eye 106 is about to go to press. This type special features a stimulating mix of typography, type design, foundries, informed opinion, design history, reviews and a Reputations interview with Sharp Type (below). Some of you saw John and Simon preview a few examples of the contents at Type Tuesday on 4 June. Don’t forget to renew your subscription (if you need to) so you don’t miss Eye 106. 30 May 2024 May newsletter Please don’t forget to book for our next Type Tuesday on June 4 at St Bride in London, which features Hamish Muir and Paul McNeil. Hamish and Paul will be talking about their latest book System Process Form … 26 April 2024 April newsletter 14 March 2024 Spring newsletter Dear friends Thank you to everyone who came to ‘We love books’, our first Type Tuesday of 2024 on 5 March at St Bride Library. We had a packed house at St Bride Hall to hear Luca Pitoni and Astrid Stavro talk about their love for book design. Astrid Stavro at the St Bride lectern for the March Type Tuesday, ‘We love books’, showing some of Derek Birdsall’s book cover designs for Penguin. Anita Klinz in her studio at Mondadori with (left to right) designers Ferruccio Bocca and Bruno Binosi, and press office head Guido Lopez. The next issue of Eye, no. 106 vol. 27, features a Reputations interview with Chantra Malee and Lucas Sharp, the dynamic couple behind Sharp Type. There are type reviews from Indra Kupferschmid, Silvia Sfligiotti, Dan Reynolds and Mark Thomson, a feature about global type by Ferdinand Ulrich and we look back at London’s Type Archive, which finally closed its doors in 2023. There will be reviews by Paul Kahn, Gabriela Matuszyk, Mark Sinclair, Gerry Leonidas, Isobel Duarte and others, plus Rick Poynor’s Critique. And if Luca Pitoni’s Type Tuesday talk about Anita Klinz piqued your interest, you can read more about her life and work in Eye 106. 20 February 2024 We love books ‘We love books’, the first Type Tuesday of 2024, will be on 5 March at St Bride Library. We’ll be joined in person by two Italian-born designers – Luca Pitoni and Astrid Stavro – talking about the late Anita Klinz (below) … 24 January 2024 Eye 105 is out (and about) now Dear friendsHappy New Year to all our newsletter subscribers – especially those of you who also subscribe to the magazine. The latest issue – Eye no. 105 vol. 27 – is now available at local newsagents and independent bookstores in the UK and Europe and has been making its way around the rest of the world, as we can see from the many social media posts from happy readers (see below). 14 December 2023 Eye 105 on the street The latest Eye – no. 105 vol. 27 – is now available at local newsagents and independent bookstores in the UK and Europe and is currently going out to North America and the rest of the world. If you are not already reading Eye regularly, please consider buying a subscription. You can also buy single copies of the latest issue and / or classic back issues from the Eye shop. AI-generated fish picture from ‘Artificial Idiot’, a feature by Marian Bantjes in Eye 105. 25 November 2023 Roll up, roll up … book for Type Tuesday Dear friends Please don’t forget to book your tickets to Type Tuesday: All the fonts of the fair on November 28 with Joby Carter. As usual, it will be held at St Bride Printing Library in London and ticket sales (from £8.50 to £13) support the St Bride Foundation. Click here to buy yours. … 17 November 2023 Eye 105 published! The latest Eye – issue 105 – has now been printed and will be mailed to subscribers next week. If you haven’t yet renewed or started your subscription, please click here. 8 November 2023 All the fonts of the fair! We are excited to announce that Joby Carter, signwriter, fairground artist and owner of Carters Steam Fair, will be the speaker at our next Type Tuesday on 28 November … 20 October 2023 Book your tickets for Type Tuesday! There's still time to book for our special Type Tuesday to hear all about Rick Poynor’s new book Why Graphic Culture Matters … 11 October 2023 October Newsletter There are lots of exciting events coming up this Autumn. Not only our special Type Tuesday but a new issue of Eye (105) … 13 September 2023 September Newsletter Thank you to everyone who came to our last Type Tuesday on 5 September for an anecdote-packed chat with Hipgnosis co-founder Aubrey ‘Po’ Powell and a comprehensively illustrated talk about the Album Cover Album series by Christopher Wilson … 22 August 2023 Book for Type Tuesday: Sound and vision This is to let you know about our next Type Tuesday, from 7 to 9:30pm on 5 September at St Bride Library, with Christopher Wilson and Aubrey ‘Po’ Powell. If you can get to London that evening, please book your tickets via Billetto and support the St Bride Foundation. 5 June 2023 June Newsletter We are looking forward to seeing many of you at tomorrow’s Type Tuesday, ‘Cover to cover’. Tickets are selling really well, so if you would like to come (and you are within striking distance of St Bride Library) we seriously recommend you book your tickets now before they sell out … 31 May 2023 Book for Type Tuesday: Cover to cover Please come to our next Type Tuesday, from 7 to 9:30pm on 6 June at St Bride Library. 'Cover to Cover' will be all about books and we have some terrific speakers for you … 3 May 2023 Early May newsletter Eye 104 has been printed, with a Peter Knapp interview, motion graphics, Matrix, Telegraf (Ukraine) and Christopher Wilson on the Album Cover Albums … 11 April 2023 Eye April Newsletter Eye 104 is about to go to press (subscribe here), with articles about motion graphics, music design, Ukrainian magazine Telegraf, John Randle’s Matrix and much more. 18 February 2023 Eye February newsletter Great news – Sara De Bondt will be our speaker for the first Type Tuesday of 2023.In a talk entitled ‘On and off the grid’, she will speak about her experiences in designing, editing, writing, publishing and distributing books today. The whole evening will be devoted to publishing and research as part of design practice, a subject close to our own hearts. 13 December 2022 Eye December newsletter Our warmest thanks go out to all of you who attended Type Tuesday last week at St Bride Library in London, and an especially big thank-you to our three speakers: Jim Sutherland, Jahnavi Innis and Richard Ardagh, each of whom delivered fascinating presentations under the theme ‘Stories worth telling’. 25 November 2022 Stories worth telling The next Type Tuesday, our last of the year, has the title ‘Stories worth telling’ and it’s going to be terrific … 23 August 2022 How green is graphic design? Our next Type Tuesday, ‘How green is graphic design?’ features Pureprint’s Richard Owers, Fedrigoni’s Annette Clayton and Eye art director Simon Esterson. 5 August 2022 Eye early August newsletter We have been very heartened by the positive responses to our current issue and to our most recent Type Tuesday … 22 June 2022 Book now for Book night! Type Tuesday, 28 June 2022 We will have piles of the freshly printed Eye 103 to buy at the Eye stall at St Bride next Tuesday. Plus selected bargain back issues … 7 June 2022 Eye’s J"
