olt: Games, set and dispatch Interview by John L. Walters The title page credit for Munich ’72: The Visual Output of Otl Aicher’s Dept XI reads ‘Researched, written, edited, designed and published by Mark Holt.’ Interview by John L. Walters Jacqueline Casey. Science and design Elizabeth Resnick Jacqueline Casey was instrumental in developing what became known as the MIT Style. By Elizabeth Resnick A niche of a niche Andrew Robertson CentreCentre is the imprint founded by British designer Patrick Fry My friend David King Richard Hollis The book David King: Designer, Activist, Visual Historian is a comprehensive account of the work of a unique figure in graphic design history. Here Richard Hollis, witness to King’s development as designer, artist, collector and pioneering author-designer of dazzling books of social and political history, recalls his friend and fellow designer. By Richard Hollis Reviews David King: Designer, Activist, Visual Historian How Many Female Type Designers Do You Know? Art Deco by the Sea Catalogue: Art Deco by the Sea London Street Signs, A Visual History of London's Street Nameplates Electronic: From Kraftwerk to The Chemical Brothers3D Ethics in Design and Communication: Critical Perspectives Rusty Brown Munich ’72: The Visual Output of Otl Aicher’s Dept. XI Charles Booth’s London Poverty Maps Barnett Freedman: Designs for Modern Britain A *New* Program for Graphic Design My Town MacDonald Gill: Charting a Life"
