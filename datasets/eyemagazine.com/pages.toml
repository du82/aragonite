full_description = "5 December 2024 Dress to express! Janet South ‘Outlaws’ explores the influence of Australian performance artist Leigh Bowery, and his legendary London nightclub Taboo What was so different about this a tiny club in a corner of Leicester Square, which barely lasted a year? 19 November 2024 Books received #59 (catalogues) Eye editors Three catalogues: 100 Beste Plakate 2022, 28th International Poster Biennale in Warsaw and Paula Scher: Type is Image This ‘books received’ focuses on a trio of graphic design catalogues. 11 November 2024 A feast for the eye Janet South ‘Looks Delicious!’ explores the mouth-watering art of shokuhin sanpuru – Japanese replica food Japan House London’s ‘Looks Delicious!’ is an incredible journey through a feast of Japanese food replica artistry and expertise. 31 October 2024 Graphic design live #17 Peter Kennard in London; ISType conference in Istanbul; Stencil work with Eric Kindel; Lauren Halsey at Serpentine; and International Assembly Conference in Glasgow. The team at Eye have curated a selection of current and upcoming events worth noting in your calendars. To stay up to date with exhibitions, conferences, talks and workshops, read the Eye Events page, updated weekly. 25 September 2024 Books received #58 Eye editors Four titles: Znak. from Ukraine; Darren Leader's Logo Rewind; Present Tense: Wahine Toi Aotearoa from New Zealand; and Unidentified Paper Object No.3 The history and visual language of trademarks; an activist approach to underrepresented voices; and the work of Marion Bataille. 11 September 2024 All the fun of the Conclave Eye editors A heady mix of design talent is due to swamp the St Bride Foundation stage on Saturday 28 September in ‘Outside the Lines’ ‘Outside the Lines’, the St Bride Foundation Design Conclave 2024, takes place on Saturday 28 September. 15 August 2024 Lettering in the landscape Mark Noad Mark Noad, Chair of the Lettering Arts Trust, considers the training and design behind hand-carved lettering and looks forward to two exhibitions of the carver’s art in the UK Two questions are regularly levelled at letter-carvers: ‘what typeface is it?’ and ‘don’t you have… 6 August 2024 The Griffin singularity John Warwicker, Alex McDowell Designers John Warwicker and Alex McDowell pay tribute to the extraordinary photographer Brian Griffin (1948-2024) Brian Griffin was a singularity; an odd fish from the Black Country, out of water and on his bike … 26 July 2024 They showed backbone Simon Esterson Spinorama is an exhibition of book spines in East London. Simon Esterson takes a sideways look Spinorama is an exhibition of book spines in East London. Simon Esterson takes a sideways look 5 July 2024 Seven artefacts in search of a museum Janet South If Japan had its own design museum, what would it include? Janet South reports from ‘Design Discoveries’ ‘Design Discoveries: Towards a Design Museum Japan’ is a free exhibition currently showing at Japan House London … < 1 2 3 4 > Last >"
