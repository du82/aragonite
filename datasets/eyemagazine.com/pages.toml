full_description = "Blog: Design education 11 September 2024 All the fun of the Conclave A heady mix of design talent is due to swamp the St Bride Foundation stage on Saturday 28 September in ‘Outside the Lines’ ‘Outside the Lines’, the St Bride Foundation Design Conclave 2024, takes place on Saturday 28 September. 15 August 2024 Lettering in the landscape Mark Noad, Chair of the Lettering Arts Trust, considers the training and design behind hand-carved lettering and looks forward to two exhibitions of the carver’s art in the UK Two questions are regularly levelled at letter-carvers: ‘what typeface is it?’ and ‘don’t you have… 22 May 2024 BIG in Milan The first Biennale Internazionale Grafica takes place from 23-26 May 2024 The Biennale Internazionale Grafica (BIG) opens this week, with four days of exhibitions, talks, etc. across Milan. 9 May 2024 Birmingham Design Festival 2024 Get ready for BDF 2024 (6-8 June) as the annual event focuses on ‘Process’ in graphic, digital and product design plus illustration We are looking forward to Birmingham Design Festival next month, which Eye is supporting as a media sponsor. 31 December 2023 Women in the room The fifth edition of the AIAP Women in Design Awards (AWDA) brought together exemplary work from around the world. The fifth edition of the AIAP Women in Design Awards (AWDA) brought together exemplary work from around the world. 24 November 2023 Dotting the ‘i’ ‘Phil Baines shows us how to revel in the joy of graphic design.’ Quentin Newark reviews ‘Extol’ Quentin Newark reviews ‘Extol: Phil Baines Celebrating Letters’ at CSM’s Lethaby Gallery 16 June 2023 Best in class The ISTD’s Student Assessment Scheme crosses borders through typographic excellence. Barrie Tullett, who was on the jury, reports The International Society of Typographic Designers (ISTD) began in 1928 … 18 April 2023 Books received #53 Big Type; the nature of data; match boxes from Singapore; and posters by Niklaus Troxler In our latest edition of books received, we look at titles featuring typographically driven graphic design… 7 September 2022 Graphic design live #5 Air-India’s Maharaja in New York; Otl Aicher in Zurich; AGI Open in Trieste; BBC’s ‘Kingdom of Cardboard’ in London Here are details of four of the many international events taking place during September 2022 … 2 August 2022 Sparks of inspiration A new software package enables designers to render computer algorithms in print – embracing creative randomness and chance HP Spark is a new printing process with software that gives designers the ability to bring creative coding into their print work … 1 2 3 > Last >"
