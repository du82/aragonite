["https://www.eyemagazine.com/blog/post/books-received-24"]
title = "Eye Magazine | Blog | Books received #24"
full_description = "Wednesday, 7:00am 7 December 2016 Books received #24 Book design Graphic design Photography Typography Visual culture Eggers in the sky, Callahan’s streets, Tim Burton, rubber-stamped Chilean horror and a Brit in Japan Here are a few photobooks that have recently caught our attention … each reviewed in no more than 140 characters. Matías Celedón’s The Subsidiary haunts readers with a horror story made using rubber stamps. Celedón designed each rubber stamp and individually stamped each page. He used an antique Trodat stamp set he bought at a Santiago bookstore. Top: Spread from Understanding the Sky by Dave Eggers. The Subsidiary (2016) is Chilean author Matías Celedón’s first novel to be translated into English (translation by Australian writer Samuel Rutter). Dave Eggers’ Understanding the Sky weaves together photographs and dialogue to tell a heart-warming story about a man who wants to fly. Understanding the Sky, 2016, by Dave Eggers. The book includes over 150 photographs, all taken by the author. Written in Japanese, Andrew Pothecary’s Alphabet Secrets Revealed by a British Designer is a Brit’s eye view of English characters. Author Andrew Pothecary’s spread about the letter ‘V’. Pothecary argues that there are certain connections, meanings and associations linked to each letter. Cover of Tokyo-based graphic designer Andrew Pothecary’s Alphabet Secrets Revealed by a British Designer (2016). Ian Nathan’s Tim Burton: The Iconic Filmmaker and his Work chronicles the fantasy film director’s career with vibrant still captures. Spread showing a still image from Burton’s Frankenweenie (2012). The images within the book are from the archives of The Kobal Collection. Spread showing a Edward Scissorhands (1990) poster and a headshot of the movie lead Johnny Depp. Cover of Tim Burton: The Iconic Filmmaker and his Work, 2016. The book was designed by Sue Pressley and Paul Turner, Stonecastle Graphics Ltd. Harry Callahan: The Street features the American photographer’s less well known street photography, in black-and-white and in colour. Wells Street, Chicago (left), Old Town, Chicago (right) (1949). Aside from straightfoward street photography, Callahan is known for his experimental work, such as Atlanta (1985), a dye transfer print. Harry Callahan: The Street (2016) was edited by Grant Arnold and published by Black Dog Publishing in partnership with the Vancouver Art Gallery. On the cover is Callahan’s Providence (detail, 1967). Photographs of books in ‘Books received #24’ by Mariam Dembele. Eye is the world’s most beautiful and collectable graphic design journal, published quarterly for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. Links Melville House McSweeney’s Black Dog Publishing Quarto Knows: Aurum Press Ltd var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '19631'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
