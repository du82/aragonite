title = "Eye Magazine | Feature | Jump cuts: Mitch Paone"
full_description = "Spring 2023 Jump cuts: Mitch Paone John L. Walters Mitch Paone DIA Studio Klim (2019) Design and animation: DIA Studio. Campaign development: ALT Group. Roblox ‘Brand anthem’ (2022) Design and animation: DIA Studio. Concept and script: Special Group. Roblox ‘Brand anthem’ (2022) Roblox ‘Brand anthem’ (2022) DIA’s film launched a brand refresh and campaign devised by Special Group, Roblox’s current advertising agency. The video emphasises the mutability of this online gaming platform aimed at school-age children on which ‘people come together virtually to share experiences’. Klim (2019) DIA made a series of analogue typographic films in collaboration with Alt Group to promote the release of the Söhne typeface family, launched by Kris Sowersby’s Klim foundry (see Eye 79) in 2019. Mitch Paone says: ‘Kris said, “you guys can do whatever you want, but you can’t do anything you’ve done before”. That forced us to re-evaluate. We’re proficient in thinking about how software generates stuff, but taking the same mentality into an analogue approach required work and experimentation.’ DIA had project carte blanche: ‘There was this “foggy memory” idea, and that translated into the process we developed, scanning and printing stuff with overhead projectors. Finally we set up a camera for a tabletop shot and figured out the solution of chemicals and inks and then just did one take after another.’ On his website, Sowersby has written of his love of white type out of black: ‘It looks powerful and ethereal. Instead of light being absorbed by black letterforms, letterforms are reflected by light.’ Klim (2019) John L. Walters, editor of Eye, London First published in Eye no. 104 vol. 26, 2023 Eye is the world’s most beautiful and collectable graphic design journal, published for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues."
