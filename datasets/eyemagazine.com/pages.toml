description = "This is a regularly updated list of graphic design / visual culture events that may be of interest to Eye readers."
full_description = "Events March 2025 / April 2025 / May 2025 / June 2025 / online + ongoing / current DON’T MISS to 8 March 2025 Women’s Rights are Human Rights: International Posters on Gender-Based Inequality, Violence and Discrimination An exhibition featuring a powerful collection of international women’s rights and advocacy posters that highlight the ongoing struggle for gender equality. Created by artists and designers of all genders, the posters on display appeal to the collective responsibility to protect human rights, challenge gender stereotypes, and advance women’s rights. With widely varying stylistic and media approaches, these posters balance uniquely different artistic perspectives with a universal message. Also showcased are impactful poster designs by MIAD students, who have embraced the theme of women’s rights and gender equality with their distinctive interpretations and innovative creative approaches, offering fresh perspectives that complement the global dialogue. Curated by Elizabeth Resnick, Professor Emerita, Massachusetts College of Art and Design. Location: Brooks Stevens Gallery, 273 E. Erie St., Milwaukee, W​I Credits for image at top, left to right: Tina Lam Collier (‘turnonred’), This Body is Not a Political Battleground, 2012; Parisa Tashakori, Women’s Rights, 2017; Shepard Fairey, Defend the Rights of Women and Girls, 2011. to 8 March 2025 A Meaningful Order This London exhibition is by OK-RM, the practice of Oliver Knight and Rory McGrath (see ‘They work with words’ in Eye 75), curated by James Langdon. Alongside the show, the practice will host a series of ‘Meetings’ with collaborators and friends of the studio, held over consecutive Thursday evenings and aimed at encouraging critical discourse. The exhibition is accompanied by A Meaningful Order (above), a 328-page book published by InOtherWords. The title comes from Victor Papanek’s 1985 description of design as ‘a conscious and intuitive effort to impose meaningful order’. Maximillian William, 47 Mortimer St., London W1W 8HJ UK 6 March – 5 April 2025 William S. Burroughs This solo exhibition of rarely seen works from William S. Burroughs features paintings and drawings created from a variety of materials, from spray paint, ink and acrylic to markers and gunshots. October Gallery, 24 Old Gloucester St, London WC1N 3AL Photo: William S. Burroughs The Old Assassin, 1989. © Estate of William S. Burroughs. to 9 March 2025 Amos Paul Kennedy, Jr.: Citizen Printer Curated by designer and author Kelly Walters, Letterform Archive’s exhibition includes a wide variety of printed artifacts such as broadsides, maps, church fans, handbills and oversized posters produced throughout Kennedy’s career. Through the use of bold language, graphic typography, and colorful layers, Amos Paul Kennedy, Jr.’s prints embody an intensity that catches the eye and provokes the mind. He is extremely outspoken about the impact of white supremacy and racism. See Hans Dieter Reichert’s review of the book Citizen Printer in Eye 107. 11-6pm, admission free, tickets. Letterform Archive, 2325 Third St. Floor 4R, San Francisco, CA 94107, US 28 February — 30 June 2025 IDENTITA – The Story of Czech Graphic Design A new exhibition devoted to the legacy of Czech graphic design at Notting Hill’s Vitrínka and Bouda galleries. The exhibition showcases an extensive collection of Czech graphic design from the early twentieth century to the present day, highlighting significant achievements as well as the evolution of graphic design and its effects on society. Curated by Filip Blažek and Linda Kudrnovská, in collaboration with commissioner David Korecký. The exhibition is part of a comprehensive multi-genre project Identita - The Story of Czech Graphic Design (projektidentita.cz) which also includes a TV series, a feature film and a book. This London show is accompanied by events throughout the spring and summer. Venue: Czech Centre’s Vitrínka and Bouda galleries, 30 Kensington Palace Gardens, W8 4QY. Open Tuesday to Friday, 10am – 5pm or by appointment. Above: Prague Metro orientation system designed by Jiří Rathouský. [top] CURRENTLY ON to 9 March 2025 Outlaws: Fashion Renegades of 80s London This exhibition focuses on 1985, the year designer and performance artist Leigh Bowery opened the legendary nightclub Taboo. Displaying original garments and accessories from Leigh and more than 30 designers, including custom-made pieces from private collections, photography, film and artworks, the exhibition focuses on this outrageous, alternative arena in which the anarchic energy of the night spilled over into the experimental creativity of the day. Tickets £12.65 (Concessions may apply), Tuesdays – Saturdays, 11.00 – 18.00 (last entry 17.15)Fashion and Textile Museum, 83 Bermondsey Street, London SE1 3XF Read ‘Dress to express’, Janet South’s review of the show on the Eye Blog. Above: Leigh Bowery. Photo © Derek Ridgers, c/o Unravel Productions. to 16 March 2025 100 BEST POSTERS 23: Germany Austria Switzerland For the 19th time the MAK presents the winning projects in the 100 BEST POSTERS 23: Germany Austria Switzerland design competition, one of the leading platforms for contemporary poster design. With their remarkable wealth of typographic approaches and their broad stylistic range, this year’s winning projects function as an exemplary optical review that sets the standard for both European and international graphic design. Admission: € 16.50, reduced € 13.50; every Tuesday 6–9 pm: admission € 8 Stubenring 5, 1010 Wien, AT to 16 March 2025 to 22 March 2025 Faiseurs de troubles (Troublemakers) For the tenth anniversary of Bel Ordinaire, Romuald Cailleteau and Adrien Mérour are taking on the role of exhibition curators and scenographers for the first time. Eight artists are participating in this unique artistic experience, based on a reversal of practices. The starting point of this collaboration is the scenography imagined by the two technicians and the ambitious and deconstructed scenography offers you a total and immersive experience: gloomy walls, undulating footbridge, accumulation of objects or hallucinatory bunker. Exhibition open from Wednesday to Saturday from 3:00pm to 7:00pm, except 25 December and 01 January Le Bel Ordinaire, Les Abattoirs, Allée Montesquieu, 64140 Billère, France to 29 March 2025 Chapter One Enjoy gallery presents four projects: ‘Rutu, Rongo and Rita’ by Maungarongo (Ron) Te Kawa; ‘Iterations / Alterations’ by Catherine Griffiths (above); ‘Low Tide’ by Manuha'apai Vaeatangitau (Manu Vaea); and an offsite exhibition at the Wellington Botanical Gardens at the end of March, Tipurepure Au Vaine, curated by Tehani Ngapare Rau-Te-Tara Buchanan. Enjoy, 211 Left Bank, Te Aro, Te Whanganui-a-Tara Wellington, Aotearoa New Zealand Open Wed-Fri 11-6pm; Sat 11-4pm to 1 April 2025 Script Lettering Stylebook with Ken Barber Script letters come in all forms and flavours, giving them an unparalleled versatility that’s indispensable to lettering artists. Yet, the dizzying array of script styles can be confusing, and their curvy shapes can make them challenging to draw. This comprehensive 8-week course distills the broad spectrum of script into an accessible stylebook of essential varieties that novices and experienced letterers can use to craft well-made attention-getting cursive lettering with confidence and flair. 8 online sessions / 6:00–9:30pm EST Fee: $535 Type@Cooper, 30 Cooper Square, New York, NY 10003 to 5 April 2025 A x Z: Anette Lenz Anette Lenz’s designs the visual identity of L’Onde Théâtre each season. The ‘A x Z’ exhibition promises ‘an immersive, dynamic and poetic experience’. See ‘Anette Lenz: Poetic rhetoric in the public realm’, Jan Middendorp’s profile of Lenz in Eye 101. Admission is free. L’Onde Théâtre, 8 bis, avenue Louis Breguet, 78140 Vélizy-Villacoublay, France to 13 April 2025 Munich 1972: Sports Posters of the XXth Olympic Games This exhibition highlights the program created for the 1972 Munich Olympics at its best, one for each event, each capturing both a moment in time and making a bid for permanence. Together, they demonstrate a magically calibrated balance of consistency and surprise, control and power, precision and exuberance: no less than the athletes they celebrate. Curated by graphic designer Michael Bierut (see Eye 24 and Eye 100), who graduated from the University of Cincinnati and worked for ten years with Massimo Vignelli (see Eye 83 and the Eye blog) before joining the New York office of the design consultancy Pentagram in 1990. Admission: Adults $12, students $8, seniors $8, children under 18 free Poster House, Entry Foyer, 119 W. 23rd Street, New York, NY 10011 to 13 April 2025 Leaving the Smoke Behind: Enjoying an Awayday The majority of the posters in this exhibition date from the Golden Age of London Passenger Transport Board posters, when many artists were commissioned to produce designs, primarily for London Underground (see the Eye blog and Eye 16) and its various connecting networks of tram and bus lines. In this post-World War I era, the overarching concept behind the poster campaigns was to encourage off-peak travel across the wider network through eye-catching, attractive designs, thus driving up revenues for under-utilised lines. Admission: Adults $12, students $8, seniors $8, children under 18 free Poster House, Lower Level Hallways, 119 W. 23rd Street, New York, NY 10011 to 15 April 2025 Advanced Type Design: Open Studio with Petr van Blokland The modern practice of type design requires a lot more than drawing nice consistent outlines or the development of creating new ideas. Understanding the technology and acquiring the experience how to finish lengthy projects within a given amount of time, are an integral part of the design/production process as well. This course addresses all the necessary aspects that are type designers need to shape their practice. Even in projects where the designers work in a team with a well defined separation between disciplines, it still is extremely valuable to be able to communicate beyond these boundaries. 10 online sessions / 5:30–8:00pm EST Fee: $975 Type@Cooper, 30 Cooper Square, New York, NY 10003 to 21 April 2025 Brasil! Brasil! The Birth of Modernism This exhibition celebrates this 60-year period between 1910 and the 1970s through the stories of ten influential artists, showing work by artists who have historically received less exposure in this country, including Anita Malfatti, who spearheaded the movement and Tarsila do Amaral, now internationally celebrated as a leading female figure of Brazilian Modernism. The exhibition also includes self-taught artists Alfredo Volpi and Djanira da Motta e Silva, an artist of Indigenous descent, Afro-Brazilian artist Rubem Valentim and performance artist Flávio de Carvalho. Venue: Royal Academy, Burlington House, Piccadilly, London, W1J 0BD Tues–Sun: 10am–6pm; Fri: 10am–9pm. Tickets: £23.50–£25.50. Above. Geraldo de Barros, Arrangement of Three Similar Shapes within a Circle, 1953. to 20 April 2025 Lives Less Ordinary This exhibition explores the overlooked richness and diversity of working-class life and creative expression from the 1950s to now. ‘Lives Less Ordinary’ will bring together ceramics, film, painting, photography and sculpture from wide-ranging public collections, archives and contemporary artists across the UK to explore a nuanced and authentic reflection of working-class experience, within an architectural setting that both manifests and ‘interrogates’ wealth and privilege. Free entry, no booking required.Tue & Thu-Sat: 11am – 6pm; Wed: 11am – 9pm; Sun: 11am – 4.30pm; Mon: closed.Venue: Two Temple Place, 2 Temple Place, London WC2R 3BD Image: Rene Matić, Import & Export, Peckham, 2022. extended to 26 May2025 The World of Tim Burton Delve into the fantastical world of Tim Burton in this major exhibition exploring his remarkable creations and key collaborations with designers. Tim Burton is the creative force behind some of the most celebrated films of the last four decades, internationally recognised as a master of the comically grotesque and the endearingly misfit. This major exhibition will invite visitors into his world through an exploration of the design of his unique aesthetic. While most well-known for his cinematic work, this show will display the full extent of his production as an illustrator, painter, photographer and author, as well as exploring key collaborations with designers. As a multi-disciplinary artist, his creations extend beyond the limits of mediums and formats. Open from October just in time for Halloween, this will be the final stop in a decade-long global tour for this exhibition, and it will be its only ever showing in the UK. See ‘Books received #24’ for Ian Nathan’s book about the fantasy film director’s career and work. Admission: Adult tickets from £19.69, Children from £9.85, Concession / Student from £14.77.Under-sixes go free. Exhibition open Monday to Thursday 10:00 – 17:00, Friday to Sunday 10:00 – 18:00 The Design Museum, 224–238 Kensington High Street, London W8 6AG to 21 April 2025 Citra Sasmita: Into Eternal Land The Indonesian artist transforms The Curve in her first solo UK exhibition. Via painting, installation, embroidery and scent, take a sensory journey exploring ancestral memory, ritual and migration. Sasmita’s practice engages with the Indonesian Kamasan painting technique. Dating from the fifteenth century, and traditionally practiced exclusively by men, Kamasan was used to narrate Hindu epics. Reclaiming this masculine practice, Sasmita dismantles misconceptions of Balinese culture and confronts its violent colonial past. Admission is free. Barbican Centre, Silk Street, London EC2Y 8DS to 26 April 2025 From the Roster From the Roster is an expansive and evolving exhibition, which features significant works from many of the artists Hamiltons has had the privilege of exhibiting over its long history. Artists such as Richard Avedon, Irving Penn, Helmut Newton and Sir Don McCullin are presented alongside rare and unique works by Horst P. Horst (see Eye 89), Steven Meisel, Sante D’Orazio, Peter Beard, Daidō Moriyama, Andy Warhol (See ‘Showbiz kids’ on the Eye blog) and many more. Ever in the pursuit of quality the gallery is pleased to showcase new works by represented artists Murray Fredericks, Roger Ballen and Philippe Garner. Hamiltons Gallery, 13 Carlos Place, London W1K 2EU to 27 April 2025 Macau 2049 Zhang Yimou and MGM join forces to present a groundbreaking show through the integration of art and cutting-edge technology that transcends boundaries and time. Admission: Prices range from MOP 888 – MOP 288 MGM Theater, MGM COTAI to 27 April 2025 Digital Witness: Algorithmic Spaces for Typography and Language The commercialisation and distribution of personal computers and software beginning in the 1970s, paved the way for the significant advancements in machine learning and artificial "
