title = "Eye Magazine | Blog |"
full_description = "Friday, 3:00pm 7 February 2025 Graphic design live #18 Tim Burton, Czech Graphic Design and Looks Delicious! in London; American Photography at Rijksmuseum; Muovo 2025 in Prague; Sports Posters in New York City. Currently on The World of Tim Burton To 21 April 2025 Delve into the fantastical world of Tim Burton in this major exhibition exploring his remarkable creations and key collaborations with designers. Tim Burton is the creative force behind some of the most celebrated films of the last four decades, internationally recognised as a master of the comically grotesque and the endearingly misfit. This major exhibition will invite visitors into his world through an exploration of the design of his unique aesthetic. While most well-known for his cinematic work, this show will display the full extent of his production as an illustrator, painter, photographer and author, as well as exploring key collaborations with designers. As a multi-disciplinary artist, his creations extend beyond the limits of mediums and formats. See ‘Books received #24’ for Ian Nathan’s book about the fantasy film director’s career and work. Admission: Adult tickets from £19.69, Children from £9.85, Concession / Student from £14.77. Under-sixes go free. Exhibition open Monday to Thursday 10:00 – 17:00, Friday to Sunday 10:00 – 18:00 The Design Museum, 224–238 Kensington High Street, London W8 6AG This is the final stop in a decade-long global tour for The World of Tim Burton open until 21 April 2025. Just opened American Photography 7 February – 9 June 2025 The Rijksmuseum presents the first comprehensive survey of American photography in Europe. With more than 200 works spanning three centuries, American Photography will be an exploration of the rich and multifaceted history of photography in the United States, showing how the medium has permeated every aspect of our lives: in art, news, advertising and everyday life. Admission: Adults: €22,50, Free for 18 and under / Open daily 9:00am to 5:00pm Rijksmuseum, Museumstraat 1, 1071 XX Amsterdam, Netherlands The Rijksmuseum is staging the Netherlands’ first major survey exhibition of American photography from 7 February – 9 June 2025. Coming soon IDENTITA – The Story of Czech Graphic Design 28 February – 30 June 2025 A new exhibition devoted to the legacy of Czech graphic design at Notting Hill’s Window and Bouda galleries. The exhibition showcases an extensive collection of Czech graphic design from the early twentieth century to the present day, highlighting significant achievements as well as the evolution of graphic design and its effects on society. Curated by Filip Blažek and Linda Kudrnovská, in collaboration with commissioner David Korecký. The exhibition is part of a comprehensive multi-genre project Identita – The Story of Czech Graphic Design (projektidentita.cz) which also includes a TV series, a feature film and a book. This London show is accompanied by events throughout the spring and summer. Venue: Czech Centre’s Vitrínka and Bouda galleries, 30 Kensington Palace Gardens, W8 4QY. Open Tuesday to Friday, 10am – 5pm or by appointment. Prague Metro orientation system designed by Jiří Rathouský, part of the IDENTITA exhibition. Mouvo 2025 13-14 March 2025 Join Prague’s annual digital art conference, where graphic design, film, animation and technology intersect. From inconspicuously inspiring to thought-provoking lectures, immerse yourself in a two-day event full of riveting talks led by world-class speakers including Dixon Baxi (see Eye 70), Kiel Danger Mutschelknaus (see ‘Space type generator’ in Eye 100) and Gergely Wootsch, among others. Admission: General CZK 3,500, Student CZK 1,900 CAMP – Centrum architektury a městského plánování, Vyšehradská 2075, 128 00 Nové Město, Czechia Mouvo 2025 will take place from 13-14 March 2025 with speakers such as Dixon Baxi, Kiel Danger Mutschelknaus and Gergely Wootsch. Final weeks Looks Delicious! Exploring Japan’s food replica culture Until 16 February 2025 Take a mouth-watering journey through the uniquely Japanese phenomenon of shokuhin sanpuru – the unexpectedly realistic food replicas displayed in front of restaurants across Japan. Offering a rare opportunity outside Japan to see these skilfully created models up close, this vibrant exhibition explores the history, materials, processes and future potential of the craft. Admission is free, booking is recommended. Japan House, 101-111 Kensington High Street, London W8 5SA Read ‘A feast for the eye’, Janet South’s review of ‘Looks Delicious!’ on the Eye blog. Free exhibition on the Japanese phenomenon of shokuhin sanpuru until 16 February 2025. Just Frame It: How Nike Turned Sports Stars into Superheroes Until 23 February 2025 Chronicling the many professional sports promoted by Nike, from basketball and football to tennis and golf, as well as the myriad athletes who worked with the brand, this exhibition showcases how one company paved the way for modern sports advertising. Admission: Adults $12, students $8, seniors $8, children under 18 free Poster House, Main Gallery, 119 W. 23rd Street, New York, NY 10011 This exhibition showcases how one company paved the way for modern sports advertising, showing until 23 February 2025. To feature your event on Eye events page, please email us with details. Eye is the world’s most beautiful and collectable graphic design journal, published for professional designers, students and anyone interested in critical, informed writing about graphic design and visual culture. It is available from all good design bookshops and online at the Eye shop, where you can buy subscriptions and single issues. var disqus_shortname = 'eye-magazine', disqus_developer = 0, disqus_identifier = '559509'; (function() { var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true; dsq.src = '//eye-magazine.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })();"
