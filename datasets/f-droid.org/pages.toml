description = "This Week in F-DroidTWIF curated on Thursday, 27 Feb 2025, Week 9F-Droid coreTermux:GUI, A plugin for Termux to use the Android GUI from terminal application..."
full_description = "Saving screens Posted on Feb 27, 2025 by paulali This Week in F-Droid TWIF curated on Thursday, 27 Feb 2025, Week 9 F-Droid core Termux:GUI, A plugin for Termux to use the Android GUI from terminal applications, is finally live. Well technically it was live several times in the past but it was not set properly. How so? Termux has a bunch of add-ons that enhance its functionality, but in order to interoperate with the main Termux app, they need to be specially setup to be signed with the same key (F-Droid key in this case). We have a dozen or so apps that need this configuration, set in the main build server, and managed there along with the signing setup since the early days of F-Droid. As the F-Droid software components got updated, changed, improved over the years, this keyaliases (as they are called) setting was not yet tackled. This month the last bits fallen into place, so we are moving forward to configure it in the main metadata repository so they are more easily added and removed as needed in the future. Community News If you live in France, maybe you can call your locally elected representative and ask them how are they going to vote on the new proposed surveillance law? Yes, there’s one every 8 months or so in some country, not sure how they think they can add backdoors to encryption and siphon data from your device at will yet still respect GDPR, but they keep trying to push these. You can read about the law here and contact your favorite député ici. FOSSGIS 2025 conference is the leading conference for free and open source software for geoinformation systems in the D-A-CH space, as well as for the topics of Open Data and OpenStreetMap. It will take place in Münster between 26 and 29 March. FOSSGIS 2025 Schedule was updated to 1.69.1-FOSSGIS-Edition, so make sure you have it installed and ready. maid was updated to 2.0.1 with a complete rewrite of the entire codebase. It wasn’t a smooth process as reproducible builds are tricker and we had to skip some versions in between, but now it is live. OnionShare was updated to 0.2.0-beta, but should be skipped as it is crashing. An updated version is built right now. PipePipe was updated to 4.2.0 after a two months pause, many issues have been fixed and features being added like AV1 high quality format support and Sponsorblock integration. RiMusic was updated to 0.6.71 which might be its last version to come to F-Droid. In an odd turn, the developer lost control of their Discord instance, warned people not to donate if asked there, saw their app being cloned on some centralized app store and made the app source code unavailable for the foreseeable future as a reaction. If the developer changes their mind, we will promptly update it as soon as possible. SimpleX Chat was updated to 6.2.5 and, if you have 13 minutes to spare, the developers wrote about how they want to handle “large groups and privacy-preserving content moderation” in the future. Threema Libre is built reproducible in F-Droid, signed by the developer. But this means that both teams need to be extra careful and fix issues that might arise from this process. This week the app was updated to 5.8.1l after a 3 months hiatus, thanks to the collaboration between F-Droid contributors and the app developers. Also now it features emoji reactions. 😜 We’ve bemoaned previously about the lack of updates for VLC but that’s well in the past as the app was just updated to 3.6.3. What’s new? It comes with the new Remote Access feature, a parental control and a lot of fixes. Also in the news, to celebrate its 20 year anniversary, “VLC Lunar Time Capsule” will send your video to the actual moon, if this TWIF gets to you on time. And the most interesting bit came out of CES 2025 back in January, where VLC announced that they will integrate offline on-device generative AI for automatic subtitle generation capable of speaking several dozen languages, based on the Whisper models (same used in the Whisper, Voice recognition app). XScreenSaver was updated to 6.09 as we missed two versions, and while we don’t get Jamie Zawinski’s, of Netscape and early Mozilla fame, stamp of “official”, we want this fun app to be available and on your screen, be it as a live wallpaper or an actual screensaver. @shuvashish76 ask us to stop press: As we learn that @cketti, the beloved developer, has quit their job working on Thunderbird for Android and K-9 Mail at Mozilla. You can read more in the “Goodbye K-9 Mail” post. Newly Added Apps 13 more apps were newly added Adresilo: Search for places Bazarnote: A simple offline shopping list app Breakout 71: Break colourful bricks, catch bouncing coins and select powerful upgrades Cascada: Casual logic game with marbles for two players J-K Bike - Mechanical Disaster Prevention: App that helps build positive bike maintenance behaviours MultiLocale: Add additional languages to your device’s locale settings Perceived Stress Scale: Are you stressed? Take the test to find out how stressed you are Pill Time: Keep track of meds that can be taken as needed (not at a specific time) ReTerminal: Terminal Emulator Rucoy calculator: An unofficial calculator for all things Rucoy Online related Smither: Lightweight Mastodon client To Do: A simple to-do app that follows Material Design 3 WhatsApp Cleaner: Clean Redundant Media and Files from Storage Updated Apps 203 more apps were updated (expand for the full list) addy.io was updated to v5.6.0 Amber was updated to 3.2.2 AndBible: Bible Study was updated to 5.0.847 Anemo was updated to 2.7.0 AniHyou - AniList client was updated to 1.3.5 APM was updated to 3.2.5 ArcaneChat was updated to 1.54.1 Arcticons was updated to 12.3.0 Arcticons Black was updated to 12.3.0 Arcticons Day & Night was updated to 12.3.0 Arcticons Material You was updated to 12.3.0 Asteroid’s Revenge was updated to 0.12.1 aTalk was updated to 4.2.1 BeeCount Knitting Counter was updated to 2.7.3 Bible Notify was updated to 4.10.0 blichess was updated 