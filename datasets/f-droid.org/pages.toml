full_description = "New F-Droid releases on IPFS Posted on Nov 23, 2023 by paulali TWIF generated on Thursday, 23 Nov 2023, Week 47 F-Droid core Android Apps now on IPFS New app releases on F-Droid are now being pushed to IPFS too, providing an additional mirroring channel that can be managed more flexibly. If this goes smoothly, we intend to upload all releases on F-Droid to IPFS. In the next F-Droid and Basic alpha versions the IPFS settings get overhauled, thanks to @uniqx Community News Tor on Mobile Devices Developer Guide Guardian Project is working on a guide on how to integrate Tor into a mobile application, touching the broader goal of promoting online privacy and freedom. You can follow the progress here. @Licaon_Kter’s comments: Organic Maps: Hike, Bike, Drive Offline was updated to 2023.11.17-17-FDroid which, besides the usual maps updates, fixes and features, also brings “experimental ‘Details on KAYAK’ affiliate link to hotels”. Missed in last weeks TWIF, FreePaint got a new signature key from its developer because “something happened to the old key”. We encourage developers to take great care of their keys but I guess this information it’s just not yet very evenly distributed. What does this mean for you? If this is the first time you install the app, just enjoy it, everything is fine. But if you had it installed before version 1.1.0 (4) please uninstall it and reinstall it. (!14020) KeePassDX was updated to 4.0.5 after a long hiatus. The issue delaying its update is that the upstream code repo has a historic mistake that can’t be easily fixed (read in more detail here). Security measures set up in the F-Droid build server were blocking this mistake and the team had to provision code to handle such known exceptions. Removed Apps 4 apps were removed While Androidacy Module Manager’s license is LGPL-3.0, users are forced to agree to an extra EULA too just to be able to actually start the app. This makes the situation confusing for the users who expect a FOSS app, not restrictions. (#3129) ForkHub for GitHub is no longer maintained and it can’t even login. LibGen Mobile and SimpleWeatherForecast depend on servers or services that are no longer accessible. Newly Added Apps 3 apps were newly added fWallet - A beautiful cross-platform wallet application for your PkPass files. Prayer Book for Catholic prayers. Simple Counter - Keep track of things with a Material You interface. Updated Apps 153 more apps were updated 8Vim Keyboard was updated from 0.16.2 to 0.16.3 AndBible: Bible Study was updated from 5.0.755 to 5.0.762 ANOTHERpass was updated from 1.8.1 to 1.8.2 aTalk was updated from 3.2.1 to 3.2.2 Audile was updated from 1.1.3 to 1.1.4 Audio Share was updated from 0.0.11 to 0.0.12 Auxio was updated from 3.2.0 to 3.2.1 BetterUntis was updated from 4.0.3 to 4.1.0-beta01 Binary Eye was updated from 1.61.0 to 1.61.1 Blitzortung Lightning Monitor was updated from 2.2.1 to 2.2.2 Blood pressure monitor was updated from 1.5.6 to 1.5.7 boQwI’ was updated from 2022.08.12a to 2023.11.20b Boxcars was updated from 1.1.1 to 1.1.4 Buses was updated from 1.05 to 1.06 BusTO was updated from 2.1.0 to 2.1.1 Cache Cleaner was updated from 1.8.6 to 1.9.2 Casio G-Shock Smart Sync was updated from 11.0 to 11.4 Chaldea was updated from 2.5.0 to 2.5.1 Cheogram was updated from 2.12.8-3+free to 2.13.0-1+free Classical Music Scanner was updated from 1.7.1 to 1.7.2 Classical Music Tagger was updated from 1.9.2 to 1.9.3 Clock You was updated from 6.2 to 6.4 Connect You was updated from 7.1 to 8.1 Conversations was updated from 2.12.12+free to 2.13.0+free Copy SMS Code - OTP Helper was updated from 1.7.0 to 1.7.1 Crossword was updated from 1.23 to 1.24 Cryptographic ID was updated from 0.4.3 to 0.4.4 Daily Diary was updated from 1.3.1 to 1.4.1 DAVx⁵ was updated from 4.3.10-ose to 4.3.10-ose Deku SMS was updated from 0.25.0 to 0.26.0 DialogMusicPlayer was updated from v2.1.1 to v2.1.2 Disroot app was updated from 2.0.6 to 2.0.8 Drinkable was upd