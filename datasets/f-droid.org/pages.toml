full_description = "Rewrite it in FOSS Posted on Feb 20, 2025 by Licaon_Kter This Week in F-Droid TWIF curated on Thursday, 20 Feb 2025, Week 8 F-Droid core F-Droid Client 1.22.0 has been live for a couple of weeks now, the gist of the changes can be read here. Did you give it a good shake on your Android distro? No? As it’s not yet “suggested” only users that manually update or opt-in into Betas got it already, so feel free to do that and ping us if we need to fix any last minute thing. Community News Are you around Valencia, Spain on Feb 28? Would you like to mess with Linux, ad blocking, free apps, federated networks? There’s a workshop for you at Las Naves, more details here. And if you stay a bit longer you can start to code your own game in Godot in the next hours. (/PS: When ready, feel free to add it to F-Droid and join the other dozen Godot games) ArcaneChat and Delta Chat were updated to 1.54.0. If you want to dig deeper under their skin to see what makes them tick, you can read about the RIIR (rewrite it in Rust) adventure in the new “From C- to JSON-based APIs of the Rust “core” library” post. Emacs was updated to 30.0.93, with dependencies required to render SVG and other raster and vector image formats, initiate TLS connections, shape Indic and Arabic text, and load tree-sitter grammar libraries. The description has also been revised hopefully to create less confusion. Removed Apps 2 apps were removed Freenet mobile: Access Freenet from the palm of your hand Icicle for Freenet: Connect to your Freenet node Newly Added Apps 9 apps were newly added < polycule >: A geeky and efficient [matrix] client for power users CLT 2025 Schedule: Conference schedule for the Chemnitzer Linux-Tage (CLT) MarketMonk: Track stocks in style! MBCompass: Simple and efficient compass Mempal: A Bitcoin mempool monitoring and notification app for Android Nov Open Reader: Simple application to read content of Novopen insulin pens using NFC NowiPass: A password manager where you are the only one who has access to your passwords QED: Unofficial frontend for the web services of the QED e.V. traced it: Quick notes with time & amounts Downgraded Apps 1 app was downgraded LibreSudoku was downgraded from 2.0.1 to 1.5.0, pending some upstream changes. Updated Apps 90 more apps were updated (expand for the full list) 8-Bit Wonders was updated to 0.8.6a AndBible: Bible Study was updated to 5.0.846 ANOTHERpass was updated to 2.1.1 APatch was updated to 11039 Apollo was updated to 1.6.1 aTalk was updated to 4.2.0 baresip was updated to 63.3.0 baresip+ was updated to 50.3.0 Better Schedule (Bakaláři) was updated to 2.0-rc5 Bunny Media Editor was updated to 5.0 CaptureSposed was updated to 1.0.6 Clash Meta For Android was updated to 2.11.6.Meta Custom Uploader was updated to 1.4.1 DigiPaws - Digital Wellbeing and App Blocker was updated to 1.9-alpha-lite Drawpile was updated to 2.2.2-beta.5 droidVNC-NG was updated to 2.9.3 Easy Diary was updated to 1.4.327.202502140 Ente Photos - Open source, end-to-end encrypted al was updated to 0.9.97 Everyday Tasks was updated to 1.7.4 FakeTraveler was updated to 1.9.2 FitBook was updated to 1.0.103 Flexify was updated to 2.0.5 Foto Timer was updated to 1.3.0 Grit was updated to 1.6.0 i2pd was updated to 2.56.0 ICSx⁵ was updated to 2.2.7 Immich was updated to 1.126.1 Infomaniak kDrive was updated to 5.3.3 Infomaniak Mail was updated to 1.8.1 Jami was updated to 20250207-03 Katawa Shoujo: Re-Engineered was updated to 2.0.1 Kazumi was updated to 1.5.6 Key Mapper: Unleash your keys! was updated to 2.8.0 KitchenOwl was updated to 0.6.10 Ladefuchs was updated to 3.1.10 Mancala was updated to 1.1 mLauncher - Minimal and Clutter Free launcher was updated to 1.7.1 monocles chat was updated to 2.0.5+free Nextcloud was updated to 3.31.0 RC2 Nextcloud Dev was updated to 20250213 Nextcloud Tables was updated to 2.0.5 NFCMessageBoard was updated to 4.0 Notesnook - Private notes app was updated to 3.0.31 Oinkoin was updated to 1.