full_description = "Message in a tunnel Posted on Dec 19, 2024 by Licaon_Kter This Week in F-Droid TWIF curated on Thursday, 19 Dec 2024, Week 51 Community News DEfO ECH Apps, Experimental fork of F-Droid to use TLS ECH with Cloudflare as the default host, was updated to 0.3 after two and a half years. If the buzzwords in the summary tickle your network needs, you can give it a spin, but remember that it’s based on the older client code so it might miss some of the new niceties. Testing helps us to hopefully integrate these features in the main client sooner. ArcaneChat was updated to 1.50.3 and Delta Chat to 1.50.2. Did everyone test the new state-of-the-art Peer-to-Peer networking support introduced in 1.48? No? At least do read about it. Element - Secure Messenger was updated to 1.6.24, but for various reasons only arm64 and x86_64 for now. The next cycles will bring the versions for the older armv7 architecture and the (probably gone by now) x86 architecture. eSpeak, Text-to-speech engine for Android based on the eSpeak engine, was updated to 1.52.0 after a two year pause too. We complained that only RHVoice was updated 3 months ago, as its language support is limited, but looks like eSpeak is back, for arm64 and newer devices too, covering with its robotic voice more languages of the world. Did you want to know more about the transition from K-9 to the Thunderbird app? Now you can, from the latest Heise interview with Philipp Kewisch. Three questions and answers: Technical change – from K-9 to the Thunderbird app is written in German, but Fennec and Mull will offer to translate it for you. What about the apps? Well, K-9 Mail and Thunderbird Beta for Testers were updated to 9.0b3 and Thunderbird: Free Your Inbox was updated to 8.2. SimpleX Chat was updated to 6.2.1, but given its build complexity and time needs only the armv7 version was built in the last cycle. Support for arm64 will come out soon. While you wait, peruse their latest posts, Preset servers operated by Flux, business chats and more and Oppose digital IDs. @shuvashish76 brings us the gossip: another.im, Yet Another Conversations fork but..., was just included yet it’s not a new app but the old Conversations Classic which finally fixed its issues that contributed to its removal in October. Welcome back! DNSNet, Lightweight ad and content blocker, is a fork of DNS66, which appears to have its development stopped. The new app aims to continue the goals of the original with modern Android development practices. Mullvad VPN: privacy is a universal right was updated to 2024.9 following their latest biennial security audit. A total of six vulnerabilities were discovered during the test by X41, and you can read about those and their fixes, here. Removed Apps 1 app was removed Alexandria: Download and convert EBooks Newly Added Apps 3 more apps were newly added Faraday: Secure messenger for Matrix based on Element oj_helper: An app for looking up OJ information OpenBible: OpenBible provides the Bible as a simple Android App Updated Apps 156 more apps were updated (expand for the full list) 8-Bit Wonders was updated to 0.8.5 AF Weather Widget was updated to 2.8 Amber was updated to 3.0.2 APM was updated to 3.1.0 Arx Libertatis was updated to 1.3.5 aShell was updated to v0.11 Aves Libre was updated to 1.11.20 AVNC was updated to 2.7.0 BabbyPaint was updated to 0.0.6 Bible Notify was updated to 4.9.1 Bibleside was updated to 0.2.0-alpha Breezy Weather was updated to 5.3.1_freenet Capy Reader was updated to 2024.12.1083 Cartes IGN was updated to 3.1.29 Casio G-Shock Smart Sync was updated to 21.1 Catima — Loyalty Card Wallet was updated to 2.34.1 Chaka Book Reader was updated to 1.24.9a.11 Chance was updated to 1.4.0 Chip Defense was updated to 1.50 ChordReader 2 was updated to 2.4.0 Cirrus was updated to 3.6 Citrine was updated to 0.5.8 Ciyue was updated to 0.14.0 Clauncher was updated to v5.1.1 Clock was updated to 2.11 ColorBlendr was updated to v1.10.1 Cuppa - Tea Timer was updated to 2.8.4 Currencies: Exchange Rate Calculator was updated to 1.22.5 DataBackup was updated to 2.0.5 DeepL was updated to 8.7 DigiAgriApp was updated to 0.3.0 DuckDuckGo Privacy Browser was updated to 5.221.0 Element X - Secure Chat & Call was updated to 0.7.5 Enhanced Music Controller Lite was updated to 1.34 Ente Auth was updated to 4.1.6 Ente Photos - Open source, end-to-end encrypted al was updated to 0.9.71 EP Mobile was updated to 2.34.1 Fcitx5 (Chewing Plugin) was updated to 0.1.0-0-g78c03d12 Fennec F-Droid was updated to 133.0.3 FFShare was updated to 1.3.3 Finamp was updated to 0.6.25 Fitness Calendar was updated to 2024.12.1 floccus bookmark sync was updated to 5.4.1 Forkgram was updated to 11.5.3.0 Forkyz was updated to 59 Gallery was updated to 3.1.0 Geto was updated to 1.16.5 Godot Editor 3 was updated to 3.6.0.stable Godot Editor 4 was updated to 4.3.0.stable Grit was updated to 1.3.5 gttrpg was updated to 1.2.1 Headwind MDM Agent was updated to 6.13 Human Benchmark was updated to 1.0.7 Husky was updated to 1.6.1 Immich was updated to 1.122.2 Inner Breeze was updated to 1.3.8 Invoice Ninja was updated to 5.0.172 Jami was updated to 20241211-01 Jellyfin for Android TV was updated to 0.18.2 Joplin was updated to 3.2.3 Journal was updated to 9.2 Just (Video) Player was updated to 0.178 Key Mapper was updated to 2.7.1 kitshn (for Tandoor) was updated to 1.0.0-alpha.13 Klick’r - Smart AutoClicker was updated to 3.1.1 Kotatsu was updated to 7.7.1 LabNex for GitLab was updated to 2.0.0 Lissen: Audiobookshelf client was updated to 1.1.19 Logger was updated to 2.6.1 Lyrion was updated to 0.8.4 Material Notes was updated to 1.9.1 Meditation was updated to 1.5.0 MedTimer was updated to 1.12.3 Mill was updated to 5.8.1 Money Manager Ex was updated to 2024.12.10 MOROway App was updated to 10.1.2 MRT Buddy was updated to 0.0.22 Mull was updated to 133.0.3 Mumla was updated to 3.6.14 MuPDF mini was updated to 1.25.2a MuPDF viewer was updated to 1.25.2a