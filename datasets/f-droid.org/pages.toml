full_description = "Materialization of modern design Posted on Feb 13, 2025 by linsui This Week in F-Droid TWIF curated on Thursday, 13 Feb 2025, Week 7 F-Droid core We’ve teased the new Material Design 3 UI client design update, and the feedback is as expected, from “I hate it”, through “I don’t care”, to “I like it”. This is work in progress but we’ve polished it internally for the last year, so it’s pretty close to being done. Yes, pure black theme is staying, but the bottom bar will be dark gray. No, we can’t keep the old design in parallel too. Yes, Basic is built from the same source so everything will apply as well. No, it does not cover all views just yet, some are custom and need more work to be updated. Yes, we don’t expect any performance hit, but this might depend on your device and its Android version. Building on this base, in the future, we can imagine adding Material You support too, for Android 12 and later devices, so you can make your own device wide pastel theme and love/hate it in private. If you can lend a hand to fix any urgent issues that you see, feel free to contact us. Community News Box Smasher, Shoot balls to smash boxes into the void!, has made the transition from a centralized store to F-Droid. Welcome! DigiAgriApp was updated to 0.3.2, previous two versions were missing some libs so if you had issues, update and retest. mLauncher - Minimal and Clutter Free launcher, Fork of Olauncher, +minimalization, +customizability is back and updated to version 1.7.0. Users rejoice! In more game news, Naija Ludo +, A Modern Twist on the Classic Board Game, is live too. It brings the classic board game of Ludo into the digital present. SherpaTTS made a splash last week on launch as users crowded to install it and use it. Update 1.3 is available now, fixing crashes and adding the most wanted feature: multiple languages. Video Diary, Record your life in one short video a day, brings the new concept of a short video journal for the future, in FOSS form, and privately. @shuvashish76 manages some apps: App Manager - Android package manager was updated to 4.0.0 with a long list of changes. And if you feel the need to dig deeper, you can read the 80 pages long app manual, it might take you about 3 hours to do that. Removed Apps 1 apps were removed LfDI BW: All news and communication channels of the LfDI BW in one place Newly Added Apps 8 more apps were newly added CleanSlate: Protect your data anywhere anytime CuteMusic: A simple, lightweight and offline music player app (Description and app pics will come in the next version) Kazumi: An anime collection APP based on custom rules Logline - MovieApp: An Android Open Source Movie App OSS-Dict: Offline Dictionaries Password Generator: Free, ad-free, open-source simple password generator for Android Scale Practice: Scales and Arpeggios Working Time Account: Record working hours, generate and send reports (PDF, CSV and ICS) Updated Apps 174 more apps were updated (expand for the full list) 8-Bit Wonders was updated to 0.8.6 Activity Manager was updated to 5.4.13 Alembicons was updated to 2025.02.00 Alovoa was updated to 2.0.0 Amber was updated to 3.2.1 AndBible: Bible Study was updated to 5.0.841 ANOTHERpass was updated to 2.1.0 ArcaneChat was updated to 1.52.2 Aves Libre was updated to 1.12.3 BendyStraw was updated to 1.3.0 blichess was updated to 8.0.0+ble1.1.1 Blood pressure monitor was updated to 1.8.5 Bluetooth Remote was updated to 1.6.0 BoltOn was updated to 10 Book’s Story was updated to 1.6.0 Boxcars was updated to 1.4.8 Breezy Weather was updated to 5.4.2_freenet Brume Wallet was updated to 0.7.537 Capy Reader was updated to 2025.02.1103 Cavity was updated to 1.8.0 Chance was updated to 1.6.1 Ciyue was updated to 1.3.0 Clauncher was updated to v5.2.4 Clock You was updated to 9.1 Conversations was updated to 2.17.10+free CTU Menza was updated to 1.4.2 Custom Uploader was updated to 1.4.0 DankChat was updated to 3.10.1 DAVx⁵ was updated to 4.4.7-ose DNSNet was up