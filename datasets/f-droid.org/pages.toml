["https://f-droid.org/en/packages/ac.mdiq.podcini.X"]
title = "Podcini.X - Podcast instrument | F-Droid - Free and Open Source Android App Repository"
description = "Podcini, an open source podcast instrument, attuned to Puccini, adorned with pasticcini and aromatized with porcini, invites your harmonious heartbeats.Do I hear your heartbeats?  Great!Common functionalities of a podcast player are well-supported:Search, discover and subscribe to podcasts, by keywords, simple RSS URLs, or OPML files.Download, stream or queue episodes, and enjoy them the way you like with adjustable playback speeds.Save effort, battery power and mobile data usage with powerful automation controls for downloading episodes.If the feed contains no media (plain RSS feed), Text-to-Speech engine is used to play the text.Listening progress can be instantly synced through a NextCloud server or across devices in the same Wi-Fi network without a server.So what's special with this podcast app among the many?Well, aside from doing the above well, the following make it stand out:It's open sourced, free to use and free of ads, free as in beer and free as in speech!It takes advantage of modern frameworks to be efficient and conserve energy.In addition to subscriptions, it allows you to create your own synthetic podcasts to compile your interested episodes from various podcasts to better focus on your interests.While the list of episodes (filtered and sorted by you) in each podcast serves a natural playlist for you, it also empowers you with multiple queues each associable with any podcasts to group similar contents for better listening.On any podcast/episode, you can assign 5 levels of rating allowing you to make better decisions on where to put your attention.You have 12 levels of play states (like to play soon, add in queue, or play again) to better plan and record your listening experiences.You can also keep your personal notes with your opinions/comments on each podcast/episode.It has sophisticated sorting and filtering options for you to better select contents.Sure, you can play any episodes in your car's speakers.And, it's not all about audio, video is well handled.You can cast the audio/video to Chromecast speakers/screens.Some other podcast players can also do all of the above?Join the Podcini community!Podcini is under active development by volunteers.You can contribute too, with code, comments or improvements.See source code on github.com/XilinJia/Podcini.X"
full_description = '''Podcini.X - Podcast instrument Modern, feature-rich, without access to Youtube New in version 8.8.2 # 8.8.2* straightened the filter settings in feed auto-download and auto-enqueue* to avoid getting filtered out, added more potential candidates in auto-download and auto-enqueue algorithms* fixed statistics screen counting not reset and not reflecting "include Marked As Played"* amended FeedDetails screen. * control buttons are moved to the topbar * tap on cover image to toggle between list and info * reduced height of header* amended EpisodeInfo screen * most control buttons are move Podcini, an open source podcast instrument, attuned to Puccini, adorned with pasticcini and aromatized with porcini, invites your harmonious heartbeats.Do I hear your heartbeats? Great!Common functionalities of a podcast player are well-supported:Search, discover and subscribe to podcasts, by keywords, simple RSS URLs, or OPML files.Download, stream or queue episodes, and enjoy them the way you like with adjustable playback speeds.Save effort, battery power and mobile data usage with powerful automation controls for downloading episodes.If the feed contains no media (plain RSS feed), Text-to-Speech engine is used to play the text.Listening progress can be instantly synced through a NextCloud server or across devices in the same Wi-Fi network without a server.So what's special with this podcast app among the many?Well, aside from doing the above well, the following make it stand out:It's open sourced, free to use and free of ads, free as in beer and free as in speech!It takes advantage of modern frameworks to be efficient and conserve energy.In addition to subscriptions, it allows you to create your own synthetic podcasts to compile your interested episodes from various podcasts to better focus on your interests.While the list of episodes (filtered and sorted by you) in each podcast serves a natural playlist for you, it also empowers you with multiple queues each associable with any podcasts to group similar contents for better listening.On any podcast/episode, you can assign 5 levels of rating allowing you to make better decisions on where to put your attention.You have 12 levels of play states (like to play soon, add in queue, or play again) to better plan and record your listening experiences.You can also keep your personal notes with your opinions/comments on each podcast/episode.It has sophisticated sorting and filtering options for you to better select contents.Sure, you can play any episodes in your car's speakers.And, it's not all about audio, video is well handled.You can cast the audio/video to Chromecast speakers/screens.Some other podcast players can also do all of the above?Join the Podcini community!Podcini is under active development by volunteers.You can contribute too, with code, comments or improvements.See source code on github.com/XilinJia/Podcini.X Author: Xilin Jia License: GNU General Public License v3.0 only Issue Tracker Source Code Changelog Build Metadata Versions Although APK downloads are available below to give you the choice, you should be aware that by installing that way you will not receive update notifications and it's a less secure way to download. We recommend that you install the F-Droid client and use that. Download F-Droid Version 8.8.2 (125) suggested Added on Feb 26, 2025 arm64-v8a armeabi-v7a x86 x86_64 This version requires Android 7.0 or newer. It is built by F-Droid and guaranteed to correspond to this source tarball. Permissions ac.mdiq.podcini.X.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION view network connections Allows the app to view information about network connections such as which networks exist and are connected. view Wi-Fi connections Allows the app to view information about Wi-Fi networking, such as whether Wi-Fi is enabled and name of connected Wi-Fi devices. pair with Bluetooth devices Allows the app to view the configuration of the Bluetooth on the phone, and to make and accept connections with paired devices. run foreground service Allows the app to make use of foreground services. run foreground service with the type "mediaPlayback" Allows the app to make use of foreground services with the type "mediaPlayback" have full network access Allows the app to create network sockets and use custom network protocols. The browser and other applications provide means to send data to the internet, so this permission is not required to send data to the internet. show notifications Allows the app to show notifications read the contents of your shared storage Allows the app to read the contents of your shared storage. run at startup Allows the app to have itself started as soon as the system has finished booting. This can make it take longer to start the phone and allow the app to slow down the overall phone by always running. ask to ignore battery optimizations Allows an app to ask for permission to ignore battery optimizations for that app. control vibration Allows the app to control the vibrator. prevent phone from sleeping Allows the app to prevent the phone from going to sleep. modify or delete the contents of your shared storage Allows the app to write the contents of your shared storage. Download APK 63 MiB PGP Signature | Build Log Version 8.7.0 (122) - Added on Feb 23, 2025 arm64-v8a armeabi-v7a x86 x86_64 This version requires Android 7.0 or newer. It is built by F-Droid and guaranteed to correspond to this source tarball. Permissions ac.mdiq.podcini.X.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION view network connections Allows the app to view information about network connections such as which networks exist and are connected. view Wi-Fi connections Allows the app to view information about Wi-Fi networking, such as whether Wi-Fi is enabled and name of connected Wi-Fi devices. pair with Bluetooth devices Allows the app to view the configuration of the Bluetooth on the phone, and to make and accept connections with paired devices. run for