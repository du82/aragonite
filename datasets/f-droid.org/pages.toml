description = "Yet another Olauncher Fork where apps are invisible by default, you only need to type which apps you want to open. It should reduce your screen time from opening apps you didn't plan on opening.    Would recommend using a grey or black wallpaper (for immersion?, idk just recommending)  FEATURES  * No ads  * FOSS forever  * Clean, fast and lightweight  HOW TO USE  * Swipe up to see all the apps and quick search  * Swipe down for notification drawer  * Long press home apps to change them  * Important: Long press on empty space to open settings  Once you open the settings, you'll see all the available options.  So basically, swipe and long press anywhere and you'll be fine."
full_description = "Clauncher Yet Another Olauncher Fork, But With All Apps Hidden Yet another Olauncher Fork where apps are invisible by default, you only need to type which apps you want to open. It should reduce your screen time from opening apps you didn't plan on opening. Would recommend using a grey or black wallpaper (for immersion?, idk just recommending) FEATURES * No ads * FOSS forever * Clean, fast and lightweight HOW TO USE * Swipe up to see all the apps and quick search * Swipe down for notification drawer * Long press home apps to change them * Important: Long press on empty space to open settings Once you open the settings, you'll see all the available options. So basically, swipe and long press anywhere and you'll be fine. Author: MLM Games License: GNU General Public License v3.0 only Website Issue Tracker Source Code Changelog Build Metadata Donate ragebreaker.itch.io/ Versions Although APK downloads are available below to give you the choice, you should be aware that by installing that way you will not receive update notifications and it's a less secure way to download. We recommend that you install the F-Droid client and use that. Download F-Droid Version v5.2.4 (360) suggested Added on Feb 09, 2025 This version requires Android 7.0 or newer. It is built by F-Droid and guaranteed to correspond to this source tarball. Permissions view network connections Allows the app to view information about network connections such as which networks exist and are connected. expand/collapse status bar Allows the app to expand or collapse the status bar. run foreground service Allows the app to make use of foreground services. android.permission.PACKAGE_USAGE_STATS query all packages Allows an app to see all installed packages. run at startup Allows the app to have itself started as soon as the system has finished booting. This can make it take longer to start the phone and allow the app to slow down the overall phone by always running. request delete packages A