title = "One nineteen suggested to all | F-Droid - Free and Open Source Android App Repository"
description = "TWIF generated on Thursday, 22 Feb 2024, Week 8F-Droid coreF-Droid and F-Droid Basic were updated to 1.19.1 to fix some theming issues, add more translations..."
full_description = "One nineteen suggested to all Posted on Feb 22, 2024 by linsui TWIF generated on Thursday, 22 Feb 2024, Week 8 F-Droid core F-Droid and F-Droid Basic were updated to 1.19.1 to fix some theming issues, add more translations and polish something supersecret you’ll get to find about soon. In more important news, version 1.19.0 is now marked as suggested so the update is finally sent to all the F-Droid users out there, not just our loyal fan base that have “enabled Beta”. 🎉 Another change that 1.19.0 brought was related to the default repositories. Historically, given the Guardian Project’s involvement in F-Droid, we’ve shipped their repo in-app but not enabled by default. As time passed, Guardian’s needs to host apps have not aligned with F-Droid’s FOSS policies so it was finally decided to remove their repo from the default install, meaning that new installs will not have it. If you already do, it will stay put as you wish. Our very own @eighthave has penned a post from the future to explain in detail what’s going on and also talk about the future of the most wanted apps from that repo, Orbot and Tor Browser. Community News @linsui extracts some news: While Orbot might not be easily installed by default from now on, TorServices (alpha) was just updated to 0.2.1. It does not have all the bells and whistles of Orbot, but it offers the barebones in a light app. You can enable “Use Tor” in Conversations, SOCKS in Netguard or your own favourite app proxy settings, and you are ready to go. ZipXtract FD was updated to 4.3.2 but this version is now lacking “RAR extraction, Multipart RAR extraction, 7z compression”, since these were based on proprietary code. @Licaon_Kter is waving flags: Jami was updated to 20240215-01, but did you notice that “the new conversation UI is now available for everyone on Android”? Yes, devs are hard at work to make it better for the eye and faster. Organic Maps: Hike, Bike, Drive Offline was mentioned as downgraded in TWIF24 week 4 per the developers wishes. This week it was brought back up to date to version 2024.02.06-11-FDroid hence make sure you update and download the updated maps as well, so your next trips are better guided. The F-Droid website has yet to detail why the app is flagged with an anti-feature (the client does explain), but it’s there because: “Map download service (cdn*.organicmaps.app) is free and open source, but not user changeable. Hotel widget includes a link to kayak.com not contained in original map data”. More about Anti-Features here. Stitch, your handy tool for picture stitching on the go, is back after being gone for 8 months. (#2894) Newly Added Apps 4 apps were newly added Cb_app: Client for using CommonBooking websites - View sites that are driven by CommonsBooking and manage your bookings DailyAL - Full featured MyAnimeList client made with flutter Fossify Music Player - Open-source and Ad-free Music Player with customizable widget & sleep timer Logseq - A privacy-first, open-source platform for knowledge management and collaboration Intermezzo from Licaon_Kter As usual the next section is this huge dry wall of text listing the other updated apps. Many of you have complained that it’s a boring section, and we agree. The sections above are full of exciting (and hopefully new) information, but truth be told we can’t really follow up all the 100-200 app updates that get pushed weekly. We might use one of those apps so we follow its development, we might fix a build and thus get a spicy detail from the commit messages, but otherwise, it all might be on autoupdate and working surely, yet quietly. Each update can hold some beautiful or amazing feat that only you know about, because you care, so if it’s game-changing, or just scratches an itch, please drop by our special forum thread and let everyone else know about it. 🎁 Updated Apps 118 more apps were updated AVNC was updated from 2.3.0 to 2.3.1 Activity Launcher was updated from 1.15.2 to 2.0.0 Activity Manager was updated from 5.4.8 to 5.4.9 AgoraDesk: buy BTC anonymously was updated from 1.1.18 to 1.1.20 Al-Azan - Prayer Times was updated from 1.17.5 to 1.17.6 Amaze was updated from 3.8.4 to 3.10 Amethyst was updated from 0.83.12 to 0.84.3 BLE Radar was updated from 0.22.7-beta to 0.22.8-beta Ball2Box was updated from 4.0.3 to 4.1.0 Bangle.js Gadgetbridge was updated from 0.78.0-banglejs to 0.79.0-banglejs BetterCounter was updated from 4.1.0 to 4.3.0 Bhagavad Gita was updated from 3.2 to 3.3 Blazed Cloud - Encrypted Storage was updated from 1.3.4 to 1.3.5 Briar was updated from 1.5.8 to 1.5.9 Carrion was updated from 1.14 to 1.16 Casio G-Shock Smart Sync was updated from 12.0 to 12.1 Clipious was updated from 1.18.0 to 1.19.0 Coin Collection was updated from 3.5.1 to 3.6.0 Conversations was updated from 2.13.1+free to 2.13.3+free Cuscon was updated from 4.0.1.0 to 4.0.1.4 DAVx⁵ was updated from 4.3.12.1-ose to 4.3.13-ose DankChat was updated from 3.9.10 to 3.9.12 Dart Checker was updated from 0.7.4 to 0.7.5 Deku SMS was updated from 0.39.0 to 0.40.0 DroidRec was updated from 3.6 to 3.7 DuckDuckGo Privacy Browser was updated from 5.185.2 to 5.188.0 Earth View for Muzei was updated from 2.1 to 2.2 Editor was updated from 1.92 to 1.93 Endless Sky was updated from 0.10.5-41 to 0.10.6-42 FairEmail was updated from 1.2158 to 1.2159 FlashDim - Dim your flashlight was updated from 2.3.1 to 2.3.2 Flipper Mobile App was updated from 1.6.7 to 1.6.8 Forkgram was updated from 10.6.1.0 to 10.6.4.0 Gadgetbridge was updated from 0.78.0 to 0.79.0 Gallery for PhotoPrism was updated from 1.23.0 to 1.24.1 Geto was updated from 1.13 to 1.14 Hammer [ALPHA] was updated from 1.6.0 to 1.7.0 Harmony Music was updated from 1.8.0 to 1.9.0 Hydra was updated from 3.7.1-open to 3.7.2-open IITC-CE Mobile was updated from 0.37.1 to 0.37.2 IVPN - Secure VPN for Privacy was updated from 2.10.6 to 2.10.7 Infomaniak kDrive was updated from 4.4.4 to 4.4.5 Intent Intercept was updated from 4.0.5 to 4.0.