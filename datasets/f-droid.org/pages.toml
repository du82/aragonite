["https://f-droid.org/en/docs"]
title = "Docs | F-Droid - Free and Open Source Android App Repository"
description = "F-Droid is an installable catalogue of FOSS (Free and Open Source Software) applications for the Android platform. The client makes it easy to browse, install, and keep track of updates on your device."
full_description = "Docs F-Droid is both a repository of verified free software Android apps as well as a whole “app store kit”, providing all the tools needed to setup and run an app store. It is a community-run free software project developed by a wide range of contributors. It also includes complete build and release tools for managing the process of turning app source code into published builds. The F-Droid server tools provide various scripts and tools that are used to maintain the main F-Droid application repository. You can use these same tools to create your own additional or alternative repository for publishing, or to assist in creating, testing and submitting metadata to the main repository. Getting Started FAQ - General Frequently Asked Questions about F-Droid FAQ - Client Frequently Asked Questions about how to use the F-Droid app in Android. Get F-Droid How to get started using F-Droid. Anti-Features What they are, what they mean, and what apps have them. Tutorials Step-by-step tutorials on features in F-Droid More Information Code of Conduct How to behave when communicating within F-Droid. How to Help Different ways anyone can contribute to the F-Droid project. Running on old Android versions A list of F-Droid releases for no longer supported Android versions. Known Repositories A list that tries to keep track of known F-Droid compatible repositories. Release Channels and Signing Keys These are the various channels that F-Droid software are released on, with info to verify them based on signing keys. Security Model A brief explanation of how F-Droid delivers software to users securely. Repomaker A user-friendly tool for managing custom repos Translation and Localization How all the parts of F-Droid are localized. Tips & Tricks A collection of useful tips and tricks that make life around F-Droid easier. All our APIs Public API endpoints for data about f-droid.org, repos, mirrors, Android, Gradle, and more Wiki For everything else that people want to document. Take-Down Requests Our policy about requesting the removal of apps or content from f-droid.org. Verifying downloaded F-Droid.apk Verifying downloaded F-Droid.apk. Developers FAQ - App Developers Frequently Asked Questions about F-Droid FAQ - Repository Frequently Asked Questions about the official F-Droid Repository Build Metadata Reference All about the build “recipes” Get it on F-Droid Badges How to use the badges Submitting to F-Droid: Quick Start Guide Add an app to f-droid.org Update Processing How updates get detected and added. Inclusion Policy & Inclusion How-To Guidelines for how to request the inclusion of a new app. Importing Applications Using fdroid import to build a new project. Building Applications Using fdroid build to build an app. All About Descriptions, Graphics, and Screenshots Showing off your app in F-Droid. Publishing Nightly Builds Make an automated repo of nightly builds of your app. Installing the Server and Repo Tools How to install fdroidserver, the tools for running repos and build servers. Setup an F-Droid App Repo How to setup your own repository of apps that users can easily add to their F-Droid client to get your apps directly from the source. Build Server Setup How to setup the complete f-droid.org build setup on your own machine. Signing Process How to setup cryptographic signatures with F-Droid tools Reproducible Builds How to use the F-Droid tools to make reproducible builds easy. Building a Signing Server For higher security, isolate the signing keys from the rest. Verification Server Setting up a server to verify app builds are correct. Whitelabel Builds custom builds of F-Droid Privileged Extension How to use F-Droid Privileged Extension as a user and ROM developer Deploying the Website How fdroid-website.git becomes f-droid.org Maintaining the Forum Useful information for administrators of F-Droid’s forum Running a Mirror Instructions for setting up a repository mirror MIA Process MIA (missing in action) maintainer removal process"
year_published = 2025
clearnet = "https://f-droid.org/en/docs"
