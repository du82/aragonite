["https://f-droid.org/en/donate"]
title = "Donations | F-Droid - Free and Open Source Android App Repository"
description = "F-Droid is an installable catalogue of FOSS (Free and Open Source Software) applications for the Android platform. The client makes it easy to browse, install, and keep track of updates on your device."
full_description = "Donations F-Droid is powered by your donations! If you want to contribute financially, we recommend using a free (as in free software) donation platform like Liberapay or Open Collective. Liberapay has lower fees but Open Collective allows more flexibility and transparency on how the funds are used. Both platforms allow for recurrent donations which are highly desirable for making F-Droid sustainable. Your donations will be used for: Paying for server resources Pay for merchandise (stickers) Pay contributors for administration and development work Travel sponsorship for contributors for conferences or meetups What payment methods can I use? Right now, we only support the payment methods that our fiscal hosts offer. The fiscal host determines which payment methods are available. Credit Card PayPal Bank Transfer Direct Debit ✓ SEPA F-Droid-Euro ✓ ✓ EUR SEPA F-Droid ✓ ✓ USD ACH ✓ Visit the info pages of our fiscal hosts to get more details on their fees: Liberapay Open Collective Europe ASBL Open Source Collective 501(c)(6) GitHub Sponsors IBAN Direct Bank Transfer If you would like to donate via a direct IBAN bank transfer, then donate via F-Droid (€) on Open Collective: Cryptocurrency All cryptocurrency donations to F-Droid, including Bitcoin and many others, are on hold for the time being, this page will be updated if there any related changes. Swag Or buy a 👕 T-shirt 👕 from (F-Droid will receive 3€ per shirt sold.) Previous Setup Donations for F-Droid were previously handled by F-Droid Limited, a UK “private company” registered in England (no. 08420676). It has been out of use since 2021."
