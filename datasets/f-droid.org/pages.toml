full_description = "Hearing your device speak Posted on Feb 06, 2025 by paulali This Week in F-Droid TWIF curated on Thursday, 06 Feb 2025, Week 6 Community News From a prolific FOSS dev @woheller69 we now have another app, SherpaTTS, Text-to-Speech engine based on Next-gen Kaldi. We’ve complained before about the FOSS voice situation, that while RHVoice got some updates, it’s still limited to 8 natural voices, and the new eSpeak is great, supports many voices, but the robotic synthesized sounds are harder to tune and use. Out of the LLM gold rush we hope to extract some value for the end users too, and applying their magic here appears to give some really nice results. How good? SeeHear for yourself on the test page. After install and the download of your language of choice, don’t forget to go to Android Settings, System, Languages, Text-to-speech and select SherpaTTS as the preferred engine. Now your apps will use it to give you directions, like Organic Maps mentioned below and OsmAnd~, read text out-loud or even your notifications (via Voice Notify). On related apps, from the same developer even, do also try Whisper (Voice recognition speech to text: you don’t type, you just talk and magically the text appears on screen) and Seamless (After talking, the text is translated to another language). Organic Maps: Hike, Bike, Drive Offline, was updated to 2025.01.26-9-FDroid. In the past we had our share of long philosophical discussions with the OM app team, say about newly added ‘features’, and about the nature of Ads but it all ended well enough from our point of view. The latest version improves upon all these, map features aside, as it fixes two of the pain points that had the app flagged with anti-features more than one year ago. The added Kayak hotel links are now a setting users need to enable if they want and the CDN servers that serve your maps finally run FOSS software. Tubular, A free lightweight YouTube front-end, is newly added. It’s a fork of NewPipe which brings support for SponsorBlock and ReturnYouTubeDislike features and more. Newly Added Apps 8 more apps were newly added Dumpsys Packages Copycat: Provides a detailed summary of all installed packages Eidetic: A simple Android app that helps you improve your working memory Encrypt-Decrypt-AndroidAPK: Encrypt / Decrypt APK , with AES 256 GCM/DES Open Alert Viewer: Fetch and display server alerts ShockAlarm: Material 3 app for controlling OpenShock shockers sms2call: Make a call when receiving a defined SMS SoundRemote: Listen to audio from your PC and control it from your phone TheXTech: 2D-platformer game engine Updated Apps 142 more apps were updated (expand for the full list) Activity Manager was updated to 5.4.12 addy.io was updated to v5.5.0 Alembicons was updated to 2025.01.02 Amarok was updated to 0.9.3 Amber was updated to 3.2.0 AnLinux was updated to 6.65 Stable ArcaneChat was updated to 1.52.1 Arcticons was updated to 12.2.0 Arcticons Black was updated to 12.2.0 Arcticons Day & Night was updated to 12.2.0 Arcticons Material You was updated to 12.2.0 Arx Libertatis was updated to 1.3.5.3 baresip was updated to 63.2.5 baresip+ was updated to 50.2.4 Bitcoin Wallet was updated to 10.24 Bitcoin Wallet [testnet3] was updated to 10.24 Bura was updated to 1.7.0 Canta was updated to 2.4.0 Celestia was updated to 1.7.11 Cifras o letras was updated to 1.3.1 Ciyue was updated to 1.2.0 Clauncher was updated to v5.2.2 Clipious was updated to 1.22.7 CodeCatcher was updated to 1.0.131 DanXi was updated to 1.4.7 Delta Chat was updated to 1.52.1 Delta Icon Pack was updated to 2.0.0 Dollphone Icon Pack was updated to 1.1.4-hotfix2 Drinkable was updated to 1.56.0 DuckDuckGo Privacy Browser was updated to 5.224.0 Emotic was updated to 0.1.7 Endless Sky was updated to 0.10.11-47 EnforceDoze was updated to 1.7.0 Ente Auth was updated to 4.3.2 ETH & UZH canteens Zürich was updated to 1.9.2 Every Door was updated to 5.4.0 FairEmail was updated to 1.2262 Fintunes was updated to 2