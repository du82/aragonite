title = "Changelog — Fabric  documentation"
full_description = '''Changelog¶ Note Looking for the Fabric 1.x changelog? See Changelog (1.x). Warning Keep in mind that Fabric is largely a wrapper around Paramiko and Invoke - Fabric’s capabilities can often improve simply by upgrading your copies of those libraries! Click their names in this paragraph to visit their changelogs and see what you might get if you upgrade your dependencies. 3.2.2 2023-08-30 [Bug]: fabric.runners.Remote failed to properly deregister its SIGWINCH signal handler on shutdown; in rare situations this could cause tracebacks when the Python process receives SIGWINCH while no remote session is active. This has been fixed. [Bug] #2204: The signal handling functionality added in Fabric 2.6 caused unrecoverable tracebacks when invoked from inside a thread (such as the use of fabric.group.ThreadingGroup) under certain interpreter versions. This has been fixed by simply refusing to register signal handlers when not in the main thread. Thanks to Francesco Giordano and others for the reports. 3.2.1 2023-08-06 [Bug]: Neglected to actually add deprecated to our runtime dependency specification (it was still in our development dependencies). This has been fixed. 3.2.0 2023-08-06 [Feature]: Enhanced fabric.testing in ways large and small: Backwards-compatibly merged the functionality of MockSFTP into MockRemote (may be opted-into by instantiating the latter with enable_sftp=True) so you can mock out both SSH and SFTP functionality in the same test, which was previously impossible. It also means you can use this in a Pytest autouse fixture to prevent any tests from accidentally hitting the network! A new pytest fixture, remote_with_sftp, has been added which leverages the previous bullet point (an all-in-one fixture suitable for, eg, preventing any incidental ssh/sftp attempts during test execution). A pile of documentation and test enhancements (yes, testing our testing helpers is a thing). [Support]: Added a new runtime dependency on the Deprecated library. [Support]: Language update: applied s/sanity/safety/g to the codebase (with the few actual API members using the term now marked deprecated & new ones added in the meantime, mostly in fabric.testing). 3.1.0 2023-05-25 [Feature]: Add a new CLI flag to fab, fab --list-agent-keys, which will attempt to connect to your local SSH agent and print a key list, similarly to ssh-add -l. This is mostly useful for expectations-checking Fabric and Paramiko’s agent functionality, or for situations where you might not have ssh-add handy. Warning This feature requires Paramiko 3.2 or above. [Feature]: Implement opt-in support for Paramiko 3.2’s AuthStrategy machinery, as follows: Added a new module and class, fabric.auth.OpenSSHAuthStrategy, which leverages aforementioned new Paramiko functionality to marry loaded SSH config files with Fabric-level and runtime-level parameters, arriving at what should be OpenSSH-client-compatible authentication behavior. See its API docs for details. Added new configuration settings: authentication.strategy_class, which defaults to None, but can be set to OpenSSHAuthStrategy to opt-in to the new behavior. authentication.identities, which defaults to the empty list, and can be a list of private key paths for use by the new strategy class. Warning This feature is EXPERIMENTAL, incomplete, and subject to change! (For example, it lacks passphrase support, and doesn’t implement 100% of all auth sources yet, focusing mostly on private keys and interactive-password.) [Bug] #2263: Explicitly add our dependency on decorator to setup.py instead of using Invoke’s old, now removed, vendored copy of same. This allows Fabric to happily use Invoke 2.1 and above. Thanks to Luke Robison, Nick Humrich, and others, for the reports. 3.0.1 2023-04-29 [Bug] #2241: A typo prevented Fabric’s command runner from properly calling its superclass stop() method, which in tandem with a related Invoke bug meant messy or long shutdowns in many scenarios. Thanks to Orlando Rodríguez for report and initial patch. 3.0.0 2023-01-20 [Feature]: Change the default configuration value for inline_ssh_env from False to True, to better align with the practicalities of common SSH server configurations. Warning This change is backwards incompatible if you were using environment-variable-setting kwargs or config settings, such as Connection.run(command, env={'SOME': 'ENV VARS'}), and were not already explicitly specifying the value of inline_ssh_env. [Bug] #1981: (fixed in #2195) Automatically close any open SFTP session during fabric.connection.Connection.close; this avoids issues encountered upon re-opening a previously-closed connection object. Thanks to Alexander Bodnya for the report and David JM Emmett for the patch. [Support]: Drop support for Python <3.6, including Python 2. Warning This is a backwards incompatible change if you are not yet on Python 3.6 or above; however, pip shouldn’t offer you this version of Fabric as long as your pip version understands python_requires metadata. 2.7.1 2022-07-14 [Bug] #1924: (also #2007) Overhaul behavior and testing re: merging together different sources for the key_filename parameter in Connection.connect_kwargs. This fixes a number of type-related errors (string objects have no extend attribute, cannot add lists to strings, etc). Thanks to Joey Dumont, Joseph Conti, and Jared Punzel for the reports; and to Kyle Meyer for submitting an early version of the patch. 2.7.0 2022-03-25 [Feature]: Forward local terminal resizes to the remote end, when applicable. (For the technical: this means we now turn SIGWINCH into SSH window-change messages.) [Feature]: Add shell, a belated port of the v1 open_shell() feature. This wasn’t needed initially, as the modern implementation of run is as good or better for full interaction than open_shell() was, provided you’re happy supplying a specific shell to execute. shell serves the corner case where you aren’t happy doing that, eg when you’re speaking to network appliances or other targets which are not typical Unix server environments. Like open_shell(), this new method is primarily for interactive use, and has a slightly less useful return value. See its API docs for more details. [Bug] #2142: Update Connection temporarily so that it doesn’t incidentally apply replace_env=True to local shell commands, only remote ones. On Windows under Python 3.7+, this was causing local commands to fail due to lack of some environment variables. Future updates will cleanly separate the config tree for remote vs local methods. Thanks to Bartosz Lachowicz for the report and David JM Emmett for the patch. [Support]: Overhaul administrative metadata and migrate to Circle-CI from Travis-CI. 2.6.0 2021-01-18 [Feature] #1999: Add sudo support to Group. Thanks to Bonnie Hardin for the report and to Winston Nolan for an early patchset. [Feature] #1810: Add put/get support to Group. [Feature] #1868: Ported a feature from v1: interpolating the local path argument in Transfer.get with connection and remote filepath attributes. For example, cxn.get(remote="/var/log/foo.log", local="{host}/") is now feasible for storing a file in per-host-named directories or files, and in fact Group.get does this by default. [Feature]: When the local path argument to Transfer.get contains nonexistent directories, they are now created instead of raising an error. Warning This change introduces a new runtime dependency: pathlib2. [Bug]: Fix a handful of issues in the handling and mocking of SFTP local paths and os.path members within fabric.testing; this should remove some occasional “useless Mocks” as well as hewing closer to the real behavior of things like os.path.abspath re: path normalization. 2.5.0 2019-08-06 [Feature] #1989: Reinstate command timeouts, by supporting the implementation of that feature in Invoke (pyinvoke/invoke#539). Thanks to Israel Fruchter for report and early patchset. [Feature]: Allow specifying connection timeouts (already available via Connection constructor argument and configuration option) on the command-line, via -t/--connect-timeout. [Feature] #1985: Add support for explicitly closing remote subprocess’ stdin when local stdin sees an EOF, by implementing a new command-runner method recently added to Invoke; this prevents remote programs that ‘follow’ stdin from blocking forever. [Bug]: Anonymous/’remainder’ subprocess execution (eg fab -H host -- command, as opposed to the use of Connection.run inside tasks) was explicitly specifying in_stream=False (i.e. “disconnect from stdin”) under the hood; this was leftover from early development and prevented use of interactive (or other stdin-reading) programs via this avenue. It has been removed; cat 'text' | fab -H somehost -- reads-from-stdin (or similar use cases) should work again. [Support]: Removed unnecessary Cryptography version pin from packaging metadata; this was an artifact from early development. At this point in time, only Paramiko’s own direct dependency specification should matter. This is unlikely to affect anybody’s install, since Paramiko has required newer Cryptography versions for a number of years now. [Support]: Update minimum Invoke version requirement to >=1.3. 2.4.0 2018-09-13 [Feature] #1709: Add Group.close to allow closing an entire group’s worth of connections at once. Patch via Johannes Löthberg. [Feature] #1780: Add context manager behavior to Group, to match the same feature in Connection. Feature request by István Sárándi. [Feature] #1849: Add Connection.from_v1 (and Config.from_v1) for easy creation of modern Connection/Config objects from the currently configured Fabric 1.x environment. Should make upgrading piecemeal much easier for many use cases. 2.3.2 2018-09-13 [Bug] #1852: Grant internal Connection objects created during ProxyJump based gateways/proxies a copy of the outer Connection’s configuration object. This was not previously done, which among other things meant one could not fully disable SSH config file loading (as the internal Connection objects would revert to the default behavior). Thanks to Chris Adams for the report. [Bug]: Some debug logging was reusing Invoke’s logger object, generating log messages “named” after invoke instead of fabric. This has been fixed by using Fabric’s own logger everywhere instead. [Bug] #1850: Skip over ProxyJump configuration directives in SSH config data when they would cause self-referential RecursionError (e.g. due to wildcard-using Host stanzas which include the jump server itself). Reported by Chris Adams. [Bug]: Fix a bug preventing tab completion (using the Invoke-level --complete flag) from completing task names correctly (behavior was to act as if there were never any tasks present, even if there was a valid fabfile nearby). 2.2.3 2018-09-13 [Bug] #1852: Grant internal Connection objects created during ProxyJump based gateways/proxies a copy of the outer Connection’s configuration object. This was not previously done, which among other things meant one could not fully disable SSH config file loading (as the internal Connection objects would revert to the default behavior). Thanks to Chris Adams for the report. [Bug]: Some debug logging was reusing Invoke’s logger object, generating log messages “named” after invoke instead of fabric. This has been fixed by using Fabric’s own logger everywhere instead. [Bug] #1850: Skip over ProxyJump configuration directives in SSH config data when they would cause self-referential RecursionError (e.g. due to wildcard-using Host stanzas which include the jump server itself). Reported by Chris Adams. [Bug]: Fix a bug preventing tab completion (using the Invoke-level --complete flag) from completing task names correctly (behavior was to act as if there were never any tasks present, even if there was a valid fabfile nearby). 2.1.6 2018-09-13 [Bug] #1852: Grant internal Connection objects created during ProxyJump based gateways/proxies a copy of the outer Connection’s configuration object. This was not previously done, which among other things meant one could not fully disable SSH config file loading (as the internal Connection objects would revert to the default behavior). Thanks to Chris Adams for the report. [Bug]: Some debug logging was reusing Invoke’s logger object, generating log messages “named” after invoke instead of fabric. This has been fixed by using Fabric’s own logger everywhere instead. [Bug] #1850: Skip over ProxyJump configuration directives in SSH config data when they would cause self-referential RecursionError (e.g. due to wildcard-using Host stanzas which include the jump server itself). Reported by Chris Adams. [Bug]: Fix a bug preventing tab completion (using the Invoke-level --complete flag) from completing task names correctly (behavior was to act as if there were never any tasks present, even if there was a valid fabfile nearby). 2.0.5 2018-09-13 [Bug] #1852: Grant internal Connection objects created during ProxyJump based gateways/proxies a copy of the outer Connection’s configuration object. This was not previously done, which among other things meant one could not fully disable SSH config file loading (as the internal Connection objects would revert to the default behavior). Thanks to Chris Adams for the report. [Bug]: Some debug logging was reusing Invoke’s logger object, generating log messages “named” after invoke instead of fabric. This has been fixed by using Fabric’s own logger everywhere instead. [Bug] #1850: Skip over ProxyJump configuration directives in SSH config data when they would cause self-referential RecursionError (e.g. due to wildcard-using Host stanzas which include the jump server itself). Reported by Chris Adams. [Bug]: Fix a bug preventing tab completion (using the Invoke-level --complete flag) from completing task names correctly (behavior was to act as if there were never any tasks present, even if there was a valid fabfile nearby). 2.3.1 2018-08-08 [Bug]: Update the new functionality added for #1826 so it uses export; without this, nontrivial shell invocations like command1 && command2 end up only applying the env vars to the first command. 2.3.0 2018-08-08 [Feature] #1831: Grant Group (and subclasses) the ability to take arbitrary keyword arguments and pass them onto the internal Connection constructors. This allows code such as: mygroup = Group('host1', 'host2', 'host3', user='admin') which was previously impossible without manually stuffing premade Connection objects into Group.from_connections. [Feature] #1826: Add a new Boolean configuration and Connection parameter, inline_ssh_env, which (when set to True) changes how Fabric submits shell environment variables to remote servers; this feature helps work around commonly restrictive AcceptEnv settings on SSH servers. Thanks to Massimiliano Torromeo and Max Arnold for the reports. [Support] #1653: Clarify Transfer API docs surrounding remote file paths, such as the lack of tilde expansion (a buggy and ultimately unnecessary v1 feature). Thanks to @pint1'''
