["https://fabfile.org/upgrading.html"]
title = "Upgrading from 1.x — Fabric  documentation"
full_description = 'Upgrading from 1.x¶ Modern Fabric (2+) represents a near-total reimplementation & reorganization of the software. It’s been broken in two, cleaned up, made more explicit, and so forth. In some cases, upgrading requires only basic search & replace; in others, more work is needed. If you read this document carefully, it should guide you in the right direction until you’re fully upgraded. If any functionality you’re using in Fabric 1 isn’t listed here, please file a ticket on Github and we’ll update it ASAP. Warning As of the 2.0 release line, Fabric 2 is not at 100% feature parity with 1.x! Some features have been explicitly dropped, but others simply have not been ported over yet, either due to time constraints or because said features need to be re-examined in a modern context. Please review the information below, including the Upgrade specifics section which contains a very detailed list, before filing bug reports! Also see the roadmap for additional notes about release versioning. Why upgrade?¶ We’d like to call out, in no particular order, some specific improvements in modern Fabric that might make upgrading worth your time. Note These are all listed in the rest of the doc too, so if you’re already sold, just skip there. Thread-safe - no more requirement on multiprocessing for concurrency; API reorganized around fabric.connection.Connection objects instead of global module state; Command-line parser overhauled to allow for regular GNU/POSIX style flags and options on a per-task basis (no more fab mytask:weird=custom,arg=format); Task organization is more explicit and flexible / has less ‘magic’; Tasks can declare other tasks to always be run before or after themselves; Configuration massively expanded to allow for multiple config files & formats, env vars, per-user/project/module configs, and much more; SSH config file loading enabled by default & has been fleshed out re: system/user/runtime file selection; Shell command execution API consistent across local and remote method calls - no more differentiation between local and run (besides where the command runs, of course!); Shell commands significantly more flexible re: interactive behavior, simultaneous capture & display (now applies to local subprocesses, not just remote), encoding control, and auto-responding; Use of Paramiko’s APIs for the SSH layer much more transparent - e.g. fabric.connection.Connection allows control over the kwargs given to SSHClient.connect; Gateway/jump-host functionality offers a ProxyJump style ‘native’ (no proxy-command subprocesses) option, which can be nested infinitely; ‘Sidegrading’ to Invoke¶ We linked to a note about this above, but to be explicit: modern Fabric is really a few separate libraries, and anything not strictly SSH or network related has been split out into the Invoke project. This means that if you’re in the group of users leveraging Fabric solely for its task execution or local, and never used run, put or similar - you don’t need to use Fabric itself anymore and can simply ‘sidegrade’ to Invoke instead. You’ll still want to read over this document to get a sense of how things have changed, but be aware that you can get away with pip install invoke and won’t need Fabric, Paramiko, cryptography dependencies, or anything else. Using modern Fabric from within Invoke¶ We intend to enhance modern Fabric until it encompasses the bulk of Fabric 1’s use cases, such that you can use fab and fabfiles on their own without caring too much about how it’s built on top of Invoke. However, prior to that point – and very useful on its own for intermediate-to-advanced users – is the fact that modern Fabric is designed with library or direct API use in mind. It’s entirely possible, and in some cases preferable, to use Invoke for your CLI needs and Fabric as a pure API within your Invoke tasks. In other words, you can eschew fab/fabfiles entirely unless you find yourself strongly needing the conveniences it wraps around ad-hoc sessions, such as --hosts and the like. Running both Fabric versions simultaneously¶ To help with gradual upgrades, modern Fabric may be installed under the name fabric2 (in addition to being made available “normally” as versions 2.0+ of fabric) and can live alongside installations of version 1.x. Thus, if you have a large codebase and don’t want to make the jump to modern versions in one leap, it’s possible to have both Fabric 1 (fabric, as you presumably had it installed previously) and modern Fabric (as fabric2) resident in your Python environment simultaneously. Note We strongly recommend that you eventually migrate all code using Fabric 1, to versions 2 or above, so that you can move back to installing and importing under the fabric name. fabric2 as a distinct package and module is intended to be a stopgap, and there will not be any fabric3 or above (not least because some of those names are already taken!) For details on how to obtain the fabric2 version of the package, see Installing modern Fabric as fabric2. Creating Connection and/or Config objects from v1 settings¶ A common tactic when upgrading piecemeal is to generate modern Fabric objects whose contents match the current Fabric 1 environment. Whereas Fabric 1 stores all configuration (including the “current host”) in a single place – the env object – modern Fabric breaks things up into multiple (albeit composed) objects: Connection for per-connection parameters, and Config for general settings and defaults. In most cases, you’ll only need to generate a Connection object using the alternate class constructor Connection.from_v1, which should be fed your appropriate local fabric.api.env object; see its API docs for details. A contrived example: from fabric.api import env, run from fabric2 import Connection env.host_string = "admin@myserver" run("whoami") # v1 cxn = Connection.from_v1(env) cxn.run("whoami") # v2+ By default, this constructor calls another API member – Config.from_v1 – internally on your behalf. Users who need tighter control over modern-style config options may opt to call that classmethod explicitly and hand their modified result into Connection.from_v1, which will cause the latter to skip any implicit config creation. Mapping of v1 env vars to modern API members¶ The env vars and how they map to Connection arguments or Config values (when fed into the .from_v1 constructors described above) are listed below. v1 env var v2+ usage (prefixed with the class it ends up in) always_use_pty Config: run.pty. command_timeout Config: timeouts.command; timeouts are now their own config subtree, whereas in v1 it was possible for the ambiguous timeout setting – see below – to work for either connect OR command timeouts. forward_agent Config: connect_kwargs.forward_agent. gateway Config: gateway. host_string Connection: host kwarg (which can handle host-string like values, including user/port). key Not supported: Fabric 1 performed extra processing on this (trying a bunch of key classes to instantiate) before handing it into Paramiko; modern Fabric prefers to just let you handle Paramiko-level parameters directly. If you’re filling your Fabric 1 key data from a file, we recommend switching to key_filename instead, which is supported. If you’re loading key data from some other source as a string, you should know what type of key your data is and manually instantiate it instead, then supply it to the connect_kwargs parameter. For example: from io import StringIO from fabric.state import env from fabric2 import Connection from paramiko import RSAKey from somewhere import load_my_key_string pkey = RSAKey.from_private_key(StringIO(load_my_key_string())) cxn = Connection.from_v1(env, connect_kwargs={"pkey": pkey}) key_filename Config: connect_kwargs.key_filename. no_agent Config: connect_kwargs.allow_agent (inverted). password Config: connect_kwargs.password, as well as sudo.password if and only if the env’s sudo_password (see below) is unset. (This mimics how v1 uses this particular setting - in earlier versions there was no sudo_password at all.) port Connection: port kwarg. Is casted to an integer due to Fabric 1’s default being a string value (which is not valid in v2). Note Since v1’s port is used both for a default and to store the current connection state, v2 uses it to fill in the Connection only, and not the Config, on assumption that it will typically be the current connection state. ssh_config_path Config: ssh_config_path. sudo_password Config: sudo.password. sudo_prompt Config: sudo.prompt. timeout Config: timeouts.connection, for connection timeouts, or timeouts.command for command timeouts (see above). use_ssh_config Config: load_ssh_configs. user Connection: user kwarg. warn_only Config: run.warn Upgrade specifics¶ This is (intended to be) an exhaustive list of all Fabric 1.x functionality, as well as new-to-Invoke-or-Fabric-2 functionality not present in 1.x; it specifies whether upgrading is necessary, how to upgrade if so, and tracks features which haven’t been implemented in modern versions yet. Most sections are broken down in table form, as follows: Fabric 1 feature or behavior Status, see below for breakdown Migration notes, removal rationale, etc Below are the typical values for the ‘status’ column, though some of them are a bit loose - make sure to read the notes column in all cases! Also note that things are not ironclad - eg any ‘removed’ item has some chance of returning if enough users request it or use cases are made that workarounds are insufficient. Ported: available already, possibly renamed or moved (frequently, moved into the Invoke codebase.) Pending: would fit, but has not yet been ported, good candidate for a patch. These entries link to the appropriate Github ticket - please do not make new ones! Removed: explicitly not ported (no longer fits with vision, had too poor a maintenance-to-value ratio, etc) and unlikely to be reinstated. Here’s a quick local table of contents for navigation purposes: General / conceptual API organization Task functions & decorators CLI arguments, options and behavior Shell command execution (local/run/sudo) General run sudo local open_shell Utilities Networking Authentication File transfer Configuration contrib fabric.env reference General / conceptual¶ The CLI task-oriented workflow remains a primary design goal, but the library use case is no longer a second-class citizen; instead, the library functionality has been designed first, with the CLI/task features built on top of it. Additionally, within the CLI use case, version 1 placed too much emphasis on ‘lazy’ interactive prompts for authentication secrets or even connection parameters, driven in part by a lack of strong configuration mechanisms. Over time it became clear this wasn’t worth the tradeoffs of having confusing noninteractive behavior and difficult debugging/testing procedures. Modern Fabric takes an arguably cleaner approach (based on functionality added to v1 over time) where users are encouraged to leverage the configuration system and/or serve the user prompts for runtime secrets at the start of the process; if the system determines it’s missing information partway through, it raises exceptions instead of prompting. Invoke’s design includes explicit user-facing testing functionality; if you didn’t find a way to write tests for your Fabric-using code before, it should be much easier now. We recommend trying to write tests early on; they will help clarify the upgrade process for you & also make the process safer! API organization¶ High level code flow and API member concerns. Import everything via fabric.api Removed All useful imports are now available at the top level, e.g. from fabric import Connection. Configure connection parameters globally (via env.host_string, env.host, env.port, env.user) and call global methods which implicitly reference them (run/sudo/etc) Removed The primary API is now properly OOP: instantiate fabric.connection.Connection objects and call their methods. These objects encapsulate all connection state (user, host, gateway, etc) and have their own SSH client instances. See also Connection.from_v1 Emphasis on serialized “host strings” as method of setting user, host, port, etc Ported/Removed fabric.connection.Connection can accept a shorthand “host string”-like argument, but the primary API is now explicit user, host, port, etc keyword arguments. Additionally, many arguments/settings/etc that expected a host string in v1 will now expect a fabric.connection.Connection instance instead. Use of “roles” as global named lists of host strings Ported This need is now served by fabric.group.Group objects (which wrap some number of fabric.connection.Connection instances with “do a thing to all members” methods.) Users can create & organize these any way they want. See the line items for --roles (CLI arguments, options and behavior), env.roles (fabric.env reference) and @roles (Task functions & decorators) for the status of those specifics. Task functions & decorators¶ Note Nearly all task-related functionality is implemented in Invoke; for more details see its execution and namespaces documentation. By default, tasks are loaded from a fabfile.py which is sought up towards filesystem root from the user’s current working directory Ported This behavior is basically identical today, with minor modifications and enhancements (such as tighter control over the load process, and API hooks for implementing custom loader logic - see Loading collections.) “Classic” style implicit task functions lacking a @task decorator Removed These were on the way out even in v1, and arbitrary task/namespace creation is more explicitly documented now, via Invoke’s Task and Collection. “New” style @task-decorated, module-level task functions Ported Largely the same, though now with superpowers - @task can still be used without any parentheses, but where v1 only had a single task_class argument, the new version (largely based on Invoke’s) has a number of namespace and parser hints, as well as execution related options (such as those formerly served by @hosts and friends). Arbitrary task function arguments (i.e. def mytask(any, thing, at, all)) Ported This gets its own line item because: tasks must now take a Context (vanilla Invoke) or fabric.connection.Connection (Fabric) object as their first positional argument. The rest of the function signature is, as before, totally up to the user & will get automatically turned into CLI flags. This sacrifices a small bit of the “quick DSL” of v1 in exchange for a cleaner, easier to understand/debug, and more user-overrideable API structure. As a side effect, it lessens the distinction between “module of functions” and “class of methods”; users can more easily start with the former and migrate to the latter when their needs grow/change. Implicit task tree generation via import-crawling Ported/Removed Namespace construction is now more explicit; for example, imported modules in your fabfile.p'
