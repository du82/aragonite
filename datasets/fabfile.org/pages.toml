full_description = "Changelog (1.x)¶ Note This is the changelog for the legacy 1.x version of Fabric. For the current (2.0+) changelog, please see the main changelog. 1.15.0 2022-04-07 [Support]: Update packaging metadata so wheel archives include the LICENSE file. [Support]: Merge the longstanding fabric3 fork back into our v1 branch so users who’d rather port Fabric 1.x code to Python 3 before upgrading to Fabric 2.x, are able to do so in a “blessed” manner. This change includes making sure that the delta between the fork and our v1 branch still functions correctly & passes tests on both interpreters. It also includes a basic CircleCI configuration to test on 3.6, 3.7 and 3.8, not that we expect to be hosting many future commits on this side… Major major thanks to Mathias Ertl for his work on the fork, all the contributors on his side of the house during that time, and to Zachary Vance for getting the reconciliation process rolling. The changes folded in as part of this work (mostly taken from Mathias’ changelog) are as follows: Installation now requires Paramiko 1.17.0 or later. Fix UnicodeDecodeError when receiving remote data. Clean up imports in main code base and test suite. Add Python 2/3/3.5 classifiers in setup.py. Replace fabric.utils.RingBuffer with collections.deque from stdlib. Under Python 3, Fabric implements its own version of contextlib.nested based on contextlib.ExitStack, since it’s no longer available in Python3. Please note that it was removed with good reason, we do not encourage you use it. 1.14.1 2018-11-27 [Bug] #983: Move a getpass import inside a Windows-oriented try/except ImportError so password prompting is less likely to explode on certain systems. Thanks to @dongweiming for the patch. [Bug] #1227: Remove a bash/zsh-ism from upload_template when backing up the target file, preventing issues on simpler remote shells. Patch courtesy of Paul Chakravarti. [Bug] #1242: (via #1243) rsync_project: only supply the -p <number> option to generated rsync commands when the port number differs from the default; this allows removing --rsh entirely most of the time, and thus enables things like using rsync’s daemon mode on the remote end. Reported & patched by Arnaud Rocher. [Bug] #1341: (via #1586) Attempt to rm -f the temporary file used by put’s sudo mode, when exceptions are encountered; previously, the internal sudo mv call could potentially fail and leave the file around. Thanks to Andrei Sura for the report and Uku Loskit for the fix. [Support]: Update packaging metadata so wheel archives include the LICENSE file. 1.14.0 2017-08-25 [Feature] #1475: Honor env.timeout when opening new remote sessions (as opposed to the initial overall connection, which already honored timeout settings.) Thanks to @EugeniuZ for the report & @jrmsgit for the first draft of the patch. Note This feature only works with Paramiko 1.14.3 and above; if your Paramiko version is older, no timeout can be set, and the previous behavior will occur instead. [Support] #1539: Add documentation for env.output_prefix. Thanks @jphalip. [Support] #1416: Add explicit “Python 2 only” note to setup.py trove classifiers to help signal that fact to various info-gathering tools. Patch courtesy of Gavin Bisesi. [Support]: Backport #1462 to 1.12.x (was previously only backported to 1.13.x.) [Support] #1590: Replace a reference to fab in a test subprocess, to use the python -m <package> style instead; this allows python setup.py test to run the test suite without having Fabric already installed. Thanks to @BenSturmfels for catch & patch. [Support] #1065: Fix incorrect SSH config reference in the docs for env.keepalive; it corresponds to ServerAliveInterval, not ClientAliveInterval. Credit: Harry Percival. 1.13.2 2017-04-24 [Bug] #1514: Compatibility with Python 2.5 was broken by using the format() method of a string (only in 1.11+). Report by @pedrudehuere. [Bug] #1526: Disable use of PTY and shell for a background command execution within contrib.sed, preventing a small class of issues on some platforms/environments. Thanks to @doflink for the report and Pierce Lopez for the final patch. [Bug] #1574: upload_project failed for folder in current directory specified without any path separator. Thanks @aidanmelen for the report and Pierce Lopez for the patch. [Bug] #1294: fix text escaping for contains and append which would fail if the text contained e.g. >. Thanks to @ecksun for report & Pierce Lopez for the patch. [Bug] #1427: (via #1428) Locate .pyc files when searching for fabfiles to load; previously we only used the presence of .py files to determine whether loading should be attempted. Credit: Ray Chen. [Bug] #1555: Multiple simultaneous get and/or put with use_sudo=True and for the same remote host and path could fail unnecessarily. Thanks @arnimarj for the report and Pierce Lopez for the patch. [Bug] #1542: (via #1543) Catch Paramiko-level gateway connection errors (ChannelError) when raising NetworkError; this prevents an issue where gateway related issues were being treated as authentication errors. Thanks to Charlie Stanley for catch & patch. [Support] #1539: Add documentation for env.output_prefix. Thanks @jphalip. [Support] #1416: Add explicit “Python 2 only” note to setup.py trove classifiers to help signal that fact to various info-gathering tools. Patch courtesy of Gavin Bisesi. [Support]: Backport #1462 to 1.12.x (was previously only backported to 1.13.x.) [Support] #1590: Replace a reference to fab in a test subprocess, to use the python -m <package> style instead; this allows python setup.py test to run the test suite without having Fabric already installed. Thanks to @BenSturmfels for catch & patch. [Support] #1065: Fix incorrect SSH config reference in the docs for env.keepalive; it corresponds to ServerAliveInterval, not ClientAliveInterval. Credit: Harry Percival. 1.12.2 2017-04-24 [Bug] #1462: Make a PyCrypto-specific import and method call optional to avoid ImportError problems under Paramiko 2.x. Thanks to Alex Gaynor for catch & patch! [Bug] #1514: Compatibility with Python 2.5 was broken by using the format() method of a string (only in 1.11+). Report by @pedrudehuere. [Bug] #1526: Disable use of PTY and shell for a background command execution within contrib.sed, preventing a small class of issues on some platforms/environments. Thanks to @doflink for the report and Pierce Lopez for the final patch. [Bug] #1574: upload_project failed for folder in current directory specified without any path separator. Thanks @aidanmelen for the report and Pierce Lopez for the patch. [Bug] #1294: fix text escaping for contains and append which would fail if the text contained e.g. >. Thanks to @ecksun for report & Pierce Lopez for the patch. [Bug] #1427: (via #1428) Locate .pyc files when searching for fabfiles to load; previously we only used the presence of .py files to determine whether loading should be attempted. Credit: Ray Chen. [Bug] #1555: Multiple simultaneous get and/or put with use_sudo=True and for the same remote host and path could fail unnecessarily. Thanks @arnimarj for the report and Pierce Lopez for the patch. [Bug] #1542: (via #1543) Catch Paramiko-level gateway connection errors (ChannelError) when raising NetworkError; this prevents an issue where gateway related issues were being treated as authentication errors. Thanks to Charlie Stanley for catch & patch. [Support] #1539: Add documentation for env.output_prefix. Thanks @jphalip. [Support] #1416: Add explicit “Python 2 only” note to setup.py trove classifiers to help signal that fact to various info-gathering tools. Patch courtesy of Gavin Bisesi. [Support]: Backport #1462 to 1.12.x (was previously only backported to 1.13.x.) [Support] #1590: Replace a reference to fab in a test subprocess, to use the python -m <package> style instead; this allows python setup.py test to run the test suite without having Fabric already installed. Thanks to @BenSturmfels for catch & patch. [Support] #1065: Fix incorrect SSH config reference in the docs for env.keepalive; it corresponds to ServerAliveInterval, not ClientAliveInterval. Credit: Harry Percival. 1.13.1 2016-12-09 [Bug] #1462: Make a PyCrypto-specific import and method call optional to avoid ImportError problems under Paramiko 2.x. Thanks to Alex Gaynor for catch & patch! 1.13.0 2016-12-09 [Feature] #1495: Update the internals of fabric.contrib.files so its members work with SSH servers running on Windows. Thanks to Hamdi Sahloul for the patch. [Support] #1379: (also #1464) Clean up a lot of unused imports and similar cruft (many found via flake8 --select E4). Thanks to Mathias Ertl for the original patches. [Support] #1483: (also re: #1386, #1374, #1300) Add an FAQ about quote problems in remote csh causing issues with Fabric’s shell-wrapping and quote-escaping. Thanks to Michael Radziej for the update. [Support] #1461: Update setup requirements to allow Paramiko 2.x, now that it’s stable and been out in the wild for some time. Paramiko 1.x still works like it always did; the only change to Paramiko 2 was the backend moving from PyCrypto to Cryptography. Warning If you are upgrading an existing environment, the install dependencies have changed; please see Paramiko’s installation docs for details: http://www.paramiko.org/installing.html 1.12.1 2016-12-05 [Bug] #1458: Detect known_hosts-related instances of paramiko.SSHException and prevent them from being handled like authentication errors (which is the default behavior). This fixes issues with incorrect password prompts or prompt-related exceptions when using reject_unknown_hosts and encountering missing or bad known_hosts entries. Thanks to Lukáš Doktor for catch & patch. [Bug] #1470: When using fabric.operations.get with glob expressions, a lack of matches for the glob would result in an empty file named after the glob expression (in addition to raising an error). This has been fixed so the empty file is no longer generated. Thanks to Georgy Kibardin for the catch & initial patch. [Support] #1379: (also #1464) Clean up a lot of unused imports and similar cruft (many found via flake8 --select E4). Thanks to Mathias Ertl for the original patches. [Support] #1483: (also re: #1386, #1374, #1300) Add an FAQ about quote problems in remote csh causing issues with Fabric’s shell-wrapping and quote-escaping. Thanks to Michael Radziej for the update. 1.11.3 2016-12-05 [Bug] #1458: Detect known_hosts-related instances of paramiko.SSHException and prevent them from being handled like authentication errors (which is the default behavior). This fixes issues with incorrect password prompts or prompt-related exceptions when using reject_unknown_hosts and encountering missing or bad known_hosts entries. Thanks to Lukáš Doktor for catch & patch. [Bug] #1470: When using fabric.operations.get with glob expressions, a lack of matches for the glob would result in an empty file named after the glob expression (in addition to raising an error). This has been fixed so the empty file is no longer generated. Thanks to Georgy Kibardin for the catch & initial patch. [Support] #1379: (also #1464) Clean up a lot of unused imports and similar cruft (many found via flake8 --select E4). Thanks to Mathias Ertl for the original patches. [Support] #1483: (also re: #1386, #1374, #1300) Add an FAQ about quote problems in remote csh causing issues with Fabric’s shell-wrapping and quote-escaping. Thanks to Michael Radziej for the update. 1.10.5 2016-12-05 [Bug] #1458: Detect known_hosts-related instances of paramiko.SSHException and prevent them from being handled like authentication errors (which is the default behavior). This fixes issues with incorrect password prompts or prompt-related exceptions when using reject_unknown_hosts and encountering missing or bad known_hosts entries. Thanks to Lukáš Doktor for catch & patch. [Bug] #1470: When using fabric.operations.get with glob expressions, a lack of matches for the glob would result in an empty file named after the glob expression (in addition to raising an error). This has been fixed so the empty file is no longer generated. Thanks to Georgy Kibardin for the catch & initial patch. [Support] #1379: (also #1464) Clean up a lot of unused imports and similar cruft (many found via flake8 --select E4). Thanks to Mathias Ertl for the original patches. [Support] #1483: (also re: #1386, #1374, #1300) Add an FAQ about quote problems in remote csh causing issues with Fabric’s shell-wrapping and quote-escaping. Thanks to Michael Radziej for the update. 1.12.0 2016-07-25 [Feature] #1491: Implement sudo-specific password caching. This can be used to work around issues where over-eager submission of env.password at login time causes authentication problems (e.g. during two-factor auth). 1.11.2 2016-07-25 [Bug] #1447: Fix a relative import in fabric.network to be correctly/consistently absolute instead. Thanks to @bildzeitung for catch & patch. 1.10.4 2016-07-25 [Bug] #1447: Fix a relative import in fabric.network to be correctly/consistently absolute instead. Thanks to @bildzeitung for catch & patch. 1.11.1 2016-04-09 [Bug]: Bumped version to 1.11.1 due to apparently accidentally uploading a false 1.11.0 to PyPI sometime in the past (PyPI is secure & prevents reusing deleted filenames.) We have no memory of this, but databases don’t lie! 1.11.0 2016-04-09 [Feature] #1200: Introduced exceptions output level, so users don’t have to deal with the debug output just to see tracebacks. [Feature] #1388: Expose Jinja’s keep_trailing_newline parameter in fabric.contrib.files.upload_template so users can force template renders to preserve trailing newlines. Thanks to Chen Lei for the patch. [Feature] #1326: Make fabric.contrib.project.rsync_project aware of env.gateway, using a ProxyCommand under the hood. Credit: David Rasch. [Feature] #1271: Allow users whose fabfiles use fabric.colors to disable colorization at runtime by specifying FABRIC_DISABLE_COLORS=1 (or any other non-empty value). Credit: Eric Berg. [Feature] #1261: Expose Paramiko’s Kerberos functionality as Fabric config vars & command-line options. Thanks to Ramanan Sivaranjan for catch & patch, and to Johannes Löthberg & Michael Bennett for additional testing. [Feature] #932: Add a temp_dir kwarg to fabric.contrib.files.upload_template which is passed into its inner fabric.operations.put call. Thanks to @nburlett for the patch. [Feature] #1161: Add use_sudo kwarg to fabric.operations.reboot. Credit: Bryce Verdier. [Feature] #800: Add capture_buffer_size kwarg to fabric.operations.run/fabric.operations.sudo so users can limit memory usage in situations where subprocesses generate very large amounts of stdout/err. Thanks to Jordan Starcher for the report & Omri Bahumi for an early version of the patchset. [Feature] #1203: (via #1240) Add a case_sensitive kwarg to fabric.contrib.files.contains (which toggles use of egrep -i). Report by @xoul, patch by Curtis Mattoon. [Bug] #1389: Gently overhaul SSH port derivation so it’s"
