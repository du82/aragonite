full_description = 'Symfony 4: Performance out of the Box December 11, 2017What about Symfony 4 performance? We worked on specific performance improvements for Symfony 4, but several non-performance related core changes help with performance as well. Symfony Flex Private Repositories November 23, 2017Private recipes repositories support added to the Symfony Flex server. Symfony 4: Directory Structure Updates July 3, 2017After a long discussion in the community, the directory structure was slightly changed. Symfony 4: A quick Demo May 2, 2017Eager to test Symfony 4. At least, the current preview version? Let’s do it now. Symfony 4: Contributing Recipes April 18, 2017The Symfony Recipes are opinionated, but anyone can contribute. Symfony 4: Automate your Workflow April 13, 2017Time to introduce Symfony Flex, Symfony 4 secret weapon. Learn more about what it can do for you. Symfony 4: Directory Structure April 10, 2017Symfony 4 has a slightly reworked directory structure. Incremental adjustments to support new features and best practices. Symfony 4: Best Practices April 7, 2017Any major version of a project is an opportunity to revisit its best practices. Modernizing them. Adapting them to the project’s new features. Symfony 4 is no exception. Symfony 4: Monolith vs Micro April 5, 2017Monolith projects versus micro-applications; Symfony 4 supports both. Symfony 4: Compose your Applications April 3, 2017Symfony 4 is going to be much more than just a cleaned-up version of Symfony 3. The Symfony Trademark March 14, 2017Symfony is a trademark and I’m trying to protect the brand with a trademark policy. Why? Announcing 24 Days of Blackfire December 1, 2015It’s advent calendar time! Discover my new 24 days series about PHP performance optimization. "Create your Own Framework" Series Update July 5, 2015Three years ago, I published a series of articles about how to create a framework on top of the Symfony components. An updated version is now available. Blackfire, a new Profiler for PHP Developers April 15, 2015The one where I talk about my latest project: Blackfire.io'
