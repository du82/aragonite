["https://fabien.potencier.org/php-5-3-0-on-mac-os-10-6-snow-leopard.html"]
title = "PHP 5.3.0 on Mac OS 10.6 (Snow Leopard) | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = 'Recently, I started to use PHP 5.3.0 extensively, thanks to the move of Symfony 2 to PHP 5.3. To do my work, I need to have several different versions of PHP at hand, with different configurations, and so I always compile my own PHP and Apache binaries on my Mac. But as Snow Leopard comes bundled with PHP 5.3.0, I started some PHP 5.3.0 experiments with the bundle version and everything went well for a couple of days.Now that I use PHP 5.3.0 more and more, I decided it was time to compile my own version. As it turns out, compiling PHP 5.3.0 on Snow Leopard is a bit involving. As I loose some time before finding the right solution, here is what I did step by step (I have just followed the tips referenced in the ticket opened for the issue on php.net, so all credits go to them).First, I ran the configure script with my usual options and added --with-iconv-dir=/usr at the end:$ ./configure ... --with-iconv-dir=/usr .notice{--title-color:#fff;--title-background-color:#6be;--content-color:#444;--content-background-color:#e7f2fa}.notice.info{--title-background-color:#fb7;--content-background-color:#fec}.notice.tip{--title-background-color:#5a5;--content-background-color:#efe}.notice.warning{--title-background-color:#c33;--content-background-color:#fee}@media(prefers-color-scheme:dark){.notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}.notice.info{--title-background-color:#a50;--content-background-color:#420}.notice.tip{--title-background-color:#363;--content-background-color:#121}.notice.warning{--title-background-color:#800;--content-background-color:#400}}body.dark .notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}body.dark .notice.info{--title-background-color:#a50;--content-background-color:#420}body.dark .notice.tip{--title-background-color:#363;--content-background-color:#121}body.dark .notice.warning{--title-background-color:#800;--content-background-color:#400}.notice{padding:18px;line-height:24px;margin-bottom:24px;border-radius:4px;color:var(--content-color);background:var(--content-background-color)}.notice p:last-child{margin-bottom:0}.notice-title{margin:-18px -18px 12px;padding:4px 18px;border-radius:4px 4px 0 0;font-weight:700;color:var(--title-color);background:var(--title-background-color)}.icon-notice{display:inline-flex;align-self:center;margin-right:8px}.icon-notice img,.icon-notice svg{height:1em;width:1em;fill:currentColor}.icon-notice img,.icon-notice.baseline svg{top:.125em;position:relative} NoteIf you have upgraded your Mac to Snow Leopard, you should know that everything must now be compiled for 64 bits. It means that you might need to recompile extra libraries needed by PHP like libjpeg or libpng, or even re-install a 64 bits version of MySQL.I then patched the iconv.c file the same way Apple did for their own version:--- php-5.3.0/ext/iconv/iconv.c 2009-03-16 22:31:04.000000000 -0700 +++ php/ext/iconv/iconv.c 2009-07-15 14:40:09.000000000 -0700 @@ -51,9 +51,6 @@ #include <gnu/libc-version.h> #endif -#ifdef HAVE_LIBICONV -#undef iconv -#endif #include "ext/standard/php_smart_str.h" #include "ext/standard/base64.h" @@ -182,9 +179,6 @@ } /* }}} */ -#ifdef HAVE_LIBICONV -#define iconv libiconv -#endif /* {{{ typedef enum php_iconv_enc_scheme_t */ typedef enum _php_iconv_enc_scheme_t { To apply the patch, save the above text in a file (patch) and from the root source of PHP, type the following command:$ patch -p1 < patch Then, add -lresolv to the EXTRA_LIBS variable:$ export EXTRA_LIBS=-lresolv Eventually, run the usual make commands$ make $ make install'
