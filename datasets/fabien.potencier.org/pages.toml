["https://fabien.potencier.org/create-your-own-framework-on-top-of-the-symfony2-components-part-8.html"]
title = "Create your own framework... on top of the Symfony2 Components (part 8) | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = '''.notice{--title-color:#fff;--title-background-color:#6be;--content-color:#444;--content-background-color:#e7f2fa}.notice.info{--title-background-color:#fb7;--content-background-color:#fec}.notice.tip{--title-background-color:#5a5;--content-background-color:#efe}.notice.warning{--title-background-color:#c33;--content-background-color:#fee}@media(prefers-color-scheme:dark){.notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}.notice.info{--title-background-color:#a50;--content-background-color:#420}.notice.tip{--title-background-color:#363;--content-background-color:#121}.notice.warning{--title-background-color:#800;--content-background-color:#400}}body.dark .notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}body.dark .notice.info{--title-background-color:#a50;--content-background-color:#420}body.dark .notice.tip{--title-background-color:#363;--content-background-color:#121}body.dark .notice.warning{--title-background-color:#800;--content-background-color:#400}.notice{padding:18px;line-height:24px;margin-bottom:24px;border-radius:4px;color:var(--content-color);background:var(--content-background-color)}.notice p:last-child{margin-bottom:0}.notice-title{margin:-18px -18px 12px;padding:4px 18px;border-radius:4px 4px 0 0;font-weight:700;color:var(--title-color);background:var(--title-background-color)}.icon-notice{display:inline-flex;align-self:center;margin-right:8px}.icon-notice img,.icon-notice svg{height:1em;width:1em;fill:currentColor}.icon-notice img,.icon-notice.baseline svg{top:.125em;position:relative} NoteThis article is part of a series of articles that explains how to create a framework with the Symfony Components. It is OBSOLETE but an up-to-date version can be found in the Symfony documentation.Some watchful readers pointed out some subtle but nonetheless important bugs in the framework we have built yesterday. When creating a framework, you must be sure that it behaves as advertised. If not, all the applications based on it will exhibit the same bugs. The good news is that whenever you fix a bug, you are fixing a bunch of applications too.Today’s mission is to write unit tests for the framework we have created by using PHPUnit. Create a PHPUnit configuration file in example.com/phpunit.xml.dist:<?xml version="1.0" encoding="UTF-8"?> <phpunit backupGlobals="false" backupStaticAttributes="false" colors="true" convertErrorsToExceptions="true" convertNoticesToExceptions="true" convertWarningsToExceptions="true" processIsolation="false" stopOnFailure="false" syntaxCheck="false" bootstrap="vendor/.composer/autoload.php" > <testsuites> <testsuite name="Test Suite"> <directory>./tests</directory> </testsuite> </testsuites> </phpunit> This configuration defines sensible defaults for most PHPUnit settings; more interesting, the autoloader is used to bootstrap the tests, and tests will be stored under the example.com/tests/ directory.Now, let’s write a test for “not found” resources. To avoid the creation of all dependencies when writing tests and to really just unit-test what we want, we are going to use test doubles. Test doubles are easier to create when we rely on interfaces instead of concrete classes. Fortunately, Symfony2 provides such interfaces for core objects like the URL matcher and the controller resolver. Modify the framework to make use of them:<?php // example.com/src/Simplex/Framework.php namespace Simplex; // ... use Symfony\Component\Routing\Matcher\UrlMatcherInterface; use Symfony\Component\HttpKernel\Controller\ControllerResolverInterface; class Framework { protected $matcher; protected $resolver; public function __construct(UrlMatcherInterface $matcher, ControllerResolverInterface $resolver) { $this->matcher = $matcher; $this->resolver = $resolver; } // ... } We are now ready to write our first test:<?php // example.com/tests/Simplex/Tests/FrameworkTest.php namespace Simplex\Tests; use Simplex\Framework; use Symfony\Component\HttpFoundation\Request; use Symfony\Component\Routing\Exception\ResourceNotFoundException; class FrameworkTest extends \PHPUnit_Framework_TestCase { public function testNotFoundHandling() { $framework = $this->getFrameworkForException(new ResourceNotFoundException()); $response = $framework->handle(new Request()); $this->assertEquals(404, $response->getStatusCode()); } protected function getFrameworkForException($exception) { $matcher = $this->getMock('Symfony\Component\Routing\Matcher\UrlMatcherInterface'); $matcher ->expects($this->once()) ->method('match') ->will($this->throwException($exception)) ; $resolver = $this->getMock('Symfony\Component\HttpKernel\Controller\ControllerResolverInterface'); return new Framework($matcher, $resolver); } } This test simulates a request that does not match any route. As such, the match() method returns a ResourceNotFoundException exception and we are testing that our framework converts this exception to a 404 response.Executing this test is as simple as running phpunit from the example.com directory:$ phpunit NoteI do not explain how the code works in details as this is not the goal of this series, but if you don’t understand what the hell is going on, I highly recommend you to read PHPUnit documentation on test doubles.After the test ran, you should see a green bar. If not, you have a bug either in the test or in the framework code!Adding a unit test for any exception thrown in a controller is just as easy:public function testErrorHandling() { $framework = $this->getFrameworkForException(new \RuntimeException()); $response = $framework->handle(new Request()); $this->assertEquals(500, $response->getStatusCode()); } Last, but not the least, let’s write a test for when we actually have a proper Response:use Symfony\Component\HttpFoundation\Response; use Symfony\Component\HttpKernel\Controller\ControllerResolver; public function testControllerResponse() { $matcher = $this->getMock('Symfony\Component\Routing\Matcher\UrlMatcherInterface'); $matcher ->expects($this->once()) ->method('match') ->will($this->returnValue(array( '_route' => 'foo', 'name' => 'Fabien', '_controller' => function ($name) { return new Response('Hello '.$name); } ))) ; $resolver = new ControllerResolver(); $framework = new Framework($matcher, $resolver); $response = $framework->handle(new Request()); $this->assertEquals(200, $response->getStatusCode()); $this->assertContains('Hello Fabien', $response->getContent()); } In this test, we simulate a route that matches and returns a simple controller. We check that the response status is 200 and that its content is the one we have set in the controller.To check that we have covered all possible use cases, run the PHPUnit test coverage feature (you need to enable XDebug first):$ phpunit --coverage-html=cov/ Open example.com/cov/src_Simplex_Framework.php.html in a browser and check that all the lines for the Framework class are green (it means that they have been visited when the tests were executed).Thanks to the simple object-oriented code that we have written so far, we have been able to write unit-tests to cover all possible use cases of our framework; test doubles ensured that we were actually testing our code and not Symfony2 code.Now that we are confident (again) about the code we have written, we can safely think about the next batch of features we want to add to our framework.'''
