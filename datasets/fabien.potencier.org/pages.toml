["https://fabien.potencier.org/2009-conferences-wrap-up.html"]
title = "2009 Conferences Wrap-up | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = "This year, I traveled in 7 countries for PHP conferences, giving a total of 12 talks. It has been a very exiting year of conferences for me. I met old and new friends, I learned a bunch of new things (not always related to PHP) and I had of course very interesting conversations about PHP 5.3, symfony, Twig, the Zend Framework, and various other topics.In March, I went to the PHP Quebec conference. Three years ago, this was my first PHP conference, and as such it’s always a very special event for me. This was also the first conference where I gave a talk about Symfony 2.In May, I had the pleasure to go to the PHP Day in Italy. This was probably one of the most convivial conference of the year. Italian people are very friendly, and the food is always amazing.In June, it was the first Symfony Live conference. I was one of the organizer, and also a speaker of course. This was a great success and I had a wonderful time talking with so many symfony users.In September, I went to Japan for their 10th PHP conference. This was my first time in Japan, and I’m eager to come back someday. This was also the first time I worked with a professional translator.In October, thanks to Zend, I went to the Zend PHP Conference in San Jose. Needless to say that this was an amazing experience. I have also kind of officially “launched” Twig at this conference, and created Pirum during a night thanks to the jetlag. This is also where I decided that Symfony 2 would only support PHP 5.3. At the end of October, I also went to the PHP Barcelona conference for the first time.In November, after the Forum PHP conference in Paris, where I talked about PHP 5.3, my new friend, I went to the IPC conference in Karlsruhe. Two great conferences, where I always meet a lot of friends.Thanks to all conference organizers for giving me these great opportunities.All my slides are available in the talk section of this website, and also on Slideshare.Here is a list of the most interesting/up-to-date talks I gave this year:Dependency Injection with PHP and PHP 5.3Symfony Components: What’s in for you?Jouons avec PHP 5.3Symfony 2.0 on PHP 5.3Using Zend Framework and Symfony TogetherTwig, the flexible, fast, and secure template language for PHP2009 is coming to an end, and 2010 is already almost here. I’m going to be doing a fair bit of traveling early next year as I will speak at least at these conferences:Dependency Injection in PHP 5.2 and 5.3: PHPBenelux conference (January 30, 2010 - Antwerp, Belgium)Playing with the symfony components: Symfony Live Conference (February 16, 2010 - Paris, France)Symfony 2 revealed: Symfony Live Conference (February 17, 2010 - Paris, France)PHP 5.3 in practice: PHP UK Conference (26 February, 2010, London, England)Symfony Components: What’s in for you?: ConFoo (March 10, 2010, Montreal, Canada)Dependency Injection in PHP 5.2 and 5.3: ConFoo (March 10, 2010, Montreal, Canada)See you next year at one of the PHP conference!"
