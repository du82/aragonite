["https://fabien.potencier.org/parsing-xml-documents-with-css-selectors.html"]
title = "Parsing XML documents with CSS selectors | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = '''HTML and XML documents are the bread and butter of web developers. On a day to day basis, you probably create a lot of HTML documents. And odds are you also need to parse some from time to time: because you consume a web service and want to extract some information, or because you want to gather data from scraped web pages, or just because you want to write functional tests for a website. Retrieving the document is quite easy, but how do you navigate through it to extract the information you need?PHP already comes with a lot of useful tools for parsing XML documents: SimpleXML, DOM, and XMLReader, just to name a few. But as soon as you need to extract information deeply embedded in the document structure, things are not as easy as they should be. Of course, XPath is your best friend when you need to select elements, but the learning curve is really steep. Even expressions that should be easy can be complex. As an example, here is the XPath expression to retrieve all h1 tags that have a foo class:h1[contains(concat(' ', normalize-space(@class), ' '), ' foo ')] The XPath expression is complex because a tag can have several classes:<h1 class="foo">Foo</h1> <h1 class="foo bar">Foo</h1> <h1 class="foobar bar">Foo</h1> The expression should match the first two h1 tags, but not the third one.Of course, everybody knows that doing the same with a CSS selector is a piece of cake:h1.foo For Symfony 2 functional tests, I wanted a way to leverage the power and expressiveness of CSS selectors with the tools we already have in PHP. The first idea that came to my mind was to convert a CSS selector to its XPath equivalent. But is it possible? The answer is a surrounding ‘YES’.As John Resig wrote in a blog post some time ago about the same topic: “The biggest thing to realize is that CSS Selectors are, typically, very short - but woefully underpowered, when compared to XPath.”Writing a tokenizer, a parser, and a compiler able to convert CSS selectors to XPath is no trivial task. So, instead of reinventing the wheel, I looked for some existing libraries. I didn’t look too much before stumbling upon lxml, a Python library. The lxml.cssselect module of lxml does exactly this. So, I took the time to translate the Python code to PHP, added some unit tests, and voilà, the Symfony 2 CSS Selector component was born..notice{--title-color:#fff;--title-background-color:#6be;--content-color:#444;--content-background-color:#e7f2fa}.notice.info{--title-background-color:#fb7;--content-background-color:#fec}.notice.tip{--title-background-color:#5a5;--content-background-color:#efe}.notice.warning{--title-background-color:#c33;--content-background-color:#fee}@media(prefers-color-scheme:dark){.notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}.notice.info{--title-background-color:#a50;--content-background-color:#420}.notice.tip{--title-background-color:#363;--content-background-color:#121}.notice.warning{--title-background-color:#800;--content-background-color:#400}}body.dark .notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}body.dark .notice.info{--title-background-color:#a50;--content-background-color:#420}body.dark .notice.tip{--title-background-color:#363;--content-background-color:#121}body.dark .notice.warning{--title-background-color:#800;--content-background-color:#400}.notice{padding:18px;line-height:24px;margin-bottom:24px;border-radius:4px;color:var(--content-color);background:var(--content-background-color)}.notice p:last-child{margin-bottom:0}.notice-title{margin:-18px -18px 12px;padding:4px 18px;border-radius:4px 4px 0 0;font-weight:700;color:var(--title-color);background:var(--title-background-color)}.icon-notice{display:inline-flex;align-self:center;margin-right:8px}.icon-notice img,.icon-notice svg{height:1em;width:1em;fill:currentColor}.icon-notice img,.icon-notice.baseline svg{top:.125em;position:relative} Notesymfony 1 has a sfDomCssSelector class, but it does not convert the CSS selector to XPath. It does the job nicely but it is limited to very simple CSS selectors and it cannot easily be used with standard XML tools.The Symfony 2 CSS Selector component does only one thing, and it tries to do it well: converting CSS selectors to XPath expressions. Using it is dead simple:use Symfony\Components\CssSelector\Parser; $xpath = Parser::cssToXpath('h1.foo'); The $xpath variable should now contain h1[contains(concat(' ', normalize-space(@class), ' '), ' foo ')].Let’s take an example to see how you can use it. Let’s say you want to retrieve all post titles and URLs for this blog (the information is available at https://fabien.potencier.org/articles).use Symfony\Components\CssSelector\Parser; $document = new \DOMDocument(); $document->loadHTMLFile('https://fabien.potencier.org/articles'); $xpath = new \DOMXPath($document); foreach ($xpath->query(Parser::cssToXpath('div.item > h4 > a')) as $node) { printf("%s (%s)\n", $node->nodeValue, $node->getAttribute('href')); } The code is straightforward and instead of using an XPath expression, we let the Parser class convert the CSS Selector to XPath for us:$xpath->query(Parser::cssToXpath('div.item > h4 > a')) Be warned that if you work with XML documents, you need to register the namespaces you use. Let’s use SimpleXMLElement, which only understand well-formed XML documents:$document = new \SimpleXMLElement('https://fabien.potencier.org/articles', 0, true); $document->registerXPathNamespace('xhtml', 'http://www.w3.org/1999/xhtml'); foreach ($document->xpath(Parser::cssToXpath('xhtml|div.item > xhtml|h4 > xhtml|a')) as $node) { printf("%s (%s)\n", $node, $node['href']); } As you can notice, CSS selectors support namespaces (xhtml|div).This new CSS Selector component will be used in Symfony 2 for functional tests (but as you will see in the coming weeks, in a very different way than what we had in symfony 1).The code is unit-tested and has a good code coverage, so feel free to use it (code is on Github: http://github.com/fabpot/symfony under the Symfony\Components\CssSelector namespace) and send me some feedback.Stay tuned!'''
