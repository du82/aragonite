["https://fabien.potencier.org/a-symfony-tip-clear-the-cache-without-the-command-line.html"]
title = "A symfony tip: Clear the cache without the command line | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = "If you follow the symfony mailing-lists or the symfony forums, you already know the magic answer for all your symfony problems:Please, try to clear the cache!It means you have to call the clear-cache task from the command line (or cache:clear in symfony 1.1):$ symfony clear-cache …or use the cc shortcut:$ symfony cc But what if you don’t have access to the command line on your server? What if you only have a FTP account?The answer is amazingly quite simple.All cache files are stored in a single cache/ directory located in the project root directory.So, to clear the cache, you can just remove all the files and directories under cache/. And symfony is smart enough to re-create the directory structure it needs if it does not exist."
