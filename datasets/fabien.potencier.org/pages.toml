["https://fabien.potencier.org/a-symfony-tip-rename-a-symfony-application.html"]
title = "A symfony tip: Rename a symfony Application | Articles - Fabien Potencier"
description = "The blog of Fabien Potencier about web technology and the symfony framework"
full_description = "Renaming a symfony application is quite simple.Here are the steps to follow to rename a fo symfony application to frontend:The first obvious step is to rename the apps/fo/ directory to apps/frontend/.The second step is rename the functional test directory test/functional/fo/ to test/functional/frontend/.You can optionally rename the front controllers from web/fo_*.php to web/frontend_*.php.Finally, you have to update the front controllers. By default, you have two file to update: fo_dev.php and fo.php (or index.php if this is the main application).Change the APP constant from fo to frontend:[?php define('SF_ROOT_DIR', realpath(dirname(__FILE__).'/..')); define('SF_APP', 'frontend'); // <<-- I've changed fo to frontend here define('SF_ENVIRONMENT', 'dev'); define('SF_DEBUG', true); require_once(SF_ROOT_DIR.DIRECTORY_SEPARATOR.'apps'.DIRECTORY_SEPARATOR.SF_APP.DIRECTORY_SEPARATOR.'config'.DIRECTORY_SEPARATOR.'config.php'); sfContext::getInstance()->getController()->dispatch(); You’re done. The old fo app name is now frontend..notice{--title-color:#fff;--title-background-color:#6be;--content-color:#444;--content-background-color:#e7f2fa}.notice.info{--title-background-color:#fb7;--content-background-color:#fec}.notice.tip{--title-background-color:#5a5;--content-background-color:#efe}.notice.warning{--title-background-color:#c33;--content-background-color:#fee}@media(prefers-color-scheme:dark){.notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}.notice.info{--title-background-color:#a50;--content-background-color:#420}.notice.tip{--title-background-color:#363;--content-background-color:#121}.notice.warning{--title-background-color:#800;--content-background-color:#400}}body.dark .notice{--title-color:#fff;--title-background-color:#069;--content-color:#ddd;--content-background-color:#023}body.dark .notice.info{--title-background-color:#a50;--content-background-color:#420}body.dark .notice.tip{--