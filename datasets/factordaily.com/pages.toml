["https://factordaily.com/telltale-stripes"]
title = "Telltale Stripes - Factor Daily"
description = "A tiger skin seized in Nepal is traced back to a specific tiger in India using advanced software and a vast database of tiger images. This story highlights the effectiveness of modern technology in combating wildlife crime and protecting endangered species"
full_description = 'Monica is an independent journalist based in Bangalore. She writes on technology, gender, and development. She is the recipient of the 2020 Stop Slavery Media Award by Thomson Reuters Foundation. Chapter 1 How tiger skin in Nepal was traced to Uttar Pradesh On the last day of March 2017, Shikha Bisht walked from her home on the idyllic campus of the Wildlife Institute of India (WII) in Dehradun to her office. The five-minute walk in the early summer felt pleasant amidst the pyramid-like buildings that complement the Mussoorie hills in the background far away.She entered her office at 9 am and opened her official email. An email from her boss caught her eye immediately. The subject line read “Tiger skin seized in Dhanghari (Kailali) Nepal”.Two days earlier, Nepal police had arrested a smuggling gang and found a tiger skin on them. The police arrested them in Dhangadhi, a sub-metropolitan city in Nepal. Dhangadhi was an ideal conduit for the tiger skin trade. It shares a border with Uttar Pradesh and is less than 100 km from several tiger reserves in both India (Dudhwa and Pilibhit) and Nepal (Bardiya and Shuklaphanta).The Nepali authorities got in touch with India’s National Tiger Conservation Authority, or NTCA, a statutory body overseeing tiger conservation in India. The NTCA’s first order of business was identifying where the tiger came from. They sent a photo of the tiger skin to Yadvendradev Vikramsinh Jhala. <img loading="lazy" loading="lazy" decoding="async" width="1698" height="1118" src="https://factordaily.com/wp-content/uploads/2024/09/Yadvendradev-1.webp" alt="Yadvendradev Vikramsinh Jhala, one of India’s foremost experts on large carnivores. " class="wp-image-6215" srcset="https://factordaily.com/wp-content/uploads/2024/09/Yadvendradev-1.webp 1698w, https://factordaily.com/wp-content/uploads/2024/09/Yadvendradev-1-768x506.webp 768w, https://factordaily.com/wp-content/uploads/2024/09/Yadvendradev-1-1536x1011.webp 1536w, https://factordaily.com/wp-content/uploads/2024/09/Yadvendradev-1-1230x810.webp 1230w" sizes="(max-width: 1698px) 100vw, 1698px" />Yadvendradev Vikramsinh Jhala, one of India’s foremost experts on large carnivores. Jhala is one of India’s foremost expert on large carnivores, and the man chosen to head the newly incubated Tiger Cell. The Cell was established in August 2016 and is jointly run by NTCA and WII.Jhala forwarded the tiger skin photo to Bisht, a senior biologist at the Tiger Cell.She sprung into action immediately.The easiest way to distinguish tigers is by their stripe patterns. Just like human fingerprints, stripe patterns are unique to each tiger. Bisht’s task was to check if any tiger in her image library matched with the dead tiger.But, the library had over 40,000 photos. Her team – with three members – would have taken over a month to match them with that of the dead tiger.Instead, Bisht’s team uses ExtractCompare, a software program to find a match. The program was developed by Conservation Research Ltd, a UK based software firm. K Ullas Karanth, director of the Wildlife Conservation Society – India Program, was instrumental in developing this program. The Tiger Trail Hover over map shows number of tigers and area occupied by tigers in 2006, 2010, 2014. ExtractCompare extracts the stripe pattern of the dead tiger from the photo of the skin. The most useful information is in the stripes of a tiger’s flank, followed by its hind legs. “The picture of the tiger skin we received was a good quality one, showing the flank clearly,” recalls Bisht.The software then compares it to patterns in the tiger photos in the library. Since the skin was found in Nepal, Bisht looked for a match from the Northern belt. This area comprised of the Shivalik range and the Gangetic floodplains.It took two days for ExtractCompare to go through all the photos and throw up probable matches. After two days, a technical assistant called Bisht to check a potential match.Bisht inspected the two images closely. She said nothing. She checked all other probable matches first, before coming back to the first one.It’s a match, she announced.The photo that matched the dead tiger was captured at Kishanpur Wildlife Sanctuary in Uttar Pradesh. It was taken in December 2013, as part of the 2014 tiger census. Tigers are territorial so it’s highly likely that the dead animal was from Kishanpur or around. “We didn’t have any other photos of this tiger from this or another location,” Bisht says.From the photo, Bisht deduced that it was a healthy adult male and over four years old when it was photographed. Bisht guessed that the killing was meant for sale.“The skin was very neat and had one clean bullet hole. So, my guess is that they (the arrested) wanted to sell the skin,” she explains.Tigers killed in UP are often smuggled to China via Nepal. “Skin found in Nepal often turns out to be of tigers from Northern India (UP and Bihar). This has been established as a trade route,” explains Bisht.On April 5, the Tiger Cell informed NTCA about the identity of the tiger.The Tiger Cell has been identifying tigers in poaching cases since 2012. Bisht has received 31 skin images, of which she could work with 27 of them. “The other four images were of very poor quality,” she explains. In seven cases, the skins of dead tigers matched with the images in her library. <img loading="lazy" loading="lazy" decoding="async" width="1704" height="1120" src="https://factordaily.com/wp-content/uploads/2024/09/Tiger-cell-1.webp" alt="The Tiger Cell was established at Wildlife Institute of India(WII) campus in August 2016 and is jointly run by NTCA and WII." class="wp-image-6216" srcset="https://factordaily.com/wp-content/uploads/2024/09/Tiger-cell-1.webp 1704w, https://factordaily.com/wp-content/uploads/2024/09/Tiger-cell-1-768x505.webp 768w, https://factordaily.com/wp-content/uploads/2024/09/Tiger-cell-1-1536x1010.webp 1536w, https://factordaily.com/wp-content/uploads/2024/09/Tiger-cell-1-1230x808.webp 1230w" sizes="(max-width: 1704px) 100vw, 1704px" />The Tiger Cell was established at Wildlife Institute of India(WII) campus in August 2016 and is jointly run by NTCA and WII. Some results have been revealing.In a case in 2013, she established using ExtractCompare, that the skin caught in Nepal was of an adult female tiger from Pench in Madhya Pradesh.“This was very surprising. We weren’t aware of any trade routes that traverse from central India all the way to Nepal. This was new information,” Bisht says.Tracing a poached tiger to a specific geographical location or region helps understand hotspots of wildlife crime and trade routes, which is crucial to fight the crime, she explains.Today, the Tiger Cell has over 40,000 photos of tigers captured in camera trap surveys. Each identified individual tiger is assigned a unique tiger identiﬁcation (UTID). Through this, the Cell has identified over 1,686 tiger individuals. This is over 70% of India’s total estimated 2,226 tigers.This gives Bisht’s team a 70% probability to figure out the identity of a poached tiger and where it comes from. For the ongoing tiger census, the Tiger Cell is expecting photos from over 20,000 camera locations across the country. Chapter 2 India misses tiger extinction in Sariska In December 2004, a team from WII found that tigers at the Sariska Tiger Reserve in Rajasthan had gone extinct. The state forest department insisted there were 18 tigers. But the field data showed no signs. India was facing its biggest wildlife crisis since Project Tiger was launched in 1973.The scientists panicked, but they were also puzzled. There were no warning signs. Sariska authorities reported around 25 tigers during censuses between 1995 and 2003. The census in 2004 reported 16 to 18 tigers.Jhala was a member of the WII team. Along with his colleague Professor Qamar Qureshi, they dug out old registers. Forest guards, who patrol the reserve, enter every tiger sighting in the register on a daily basis.They plotted the number of tiger sightings and the effort the guards put in patrolling. A picture of the evolving crisis began to emerge. Sightings had declined in Sariska since 1998. And in the last one year, there hadn’t been a single sighting. The authorities either ignored these signals or simply cooked up the census numbers. The discovery was shocking. Despite rooms full of data being available, the extinction was missed. This happened due to lack of data analysis.After the Sariska debacle, the union government set up a Tiger Task Force to review management of tiger reserves. Its tasks included providing a scientific basis to the tiger census.The task force chose a system proposed by Jhala and Qureshi, by borrowing from what was published by different scientists on methods of population abundance estimation. This was an improvement over the existing pugmark technique. It recorded ecological signs of tigers, co-predators, and prey. It used camera traps and with the support of geographical information systems (GIS). And it enabled population estimation across vast landscapes.The task force mandated NTCA and WII to conduct a tiger census across India every four years. Since then, tiger censuses have been held in 2006, 2010 and 2014, and the latest round is ongoing. Map showing India’s Tiger Reserves Source: Project Tiger <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="868" height="688" src="https://factordaily.com/wp-content/uploads/2024/09/Indias-tiger-reserve.svg" alt="Map showing India’s Tiger Reserves" class="wp-image-6218"/>Source: Project Tiger Even with a new census in place, Jhala and Qureshi hadn’t gotten over the Sariska shock. “Sariska was a jolt. What good is the data if not analysed and used to correct or improve the situation,” says Jhala.Forest authorities needed to see the trends – decline or increase in sightings and crime – clearly and regularly, they realised.In the same year, while supervising a student’s work in Nepal, Jhala and Qureshi met Rajan Amin. Of Indian origin, he was a senior wildlife biologist at the Zoological Society of London (ZSL). While working on rhinos in Kenya, Amin developed a system for patrolling rhinos. It recorded GPS coordinates and date and time of the crime.“He had this wonderful system of patrolling – law enforcement aspects – in place. We already had the ecological aspects. So, it struck us that if we could amalgamate an ecological system, with a patrol system and geotagging, then it would be perfect,” recalls Jhala.This was the beginning of M-STrIPES — the Monitoring System for Tigers Intensive Protection and Ecological Status (M-STrIPES). Jhala and Qureshi, who is a specialist in remote sensing and GIS, set about developing it. The NTCA agreed to fund it.The initial concept was developed in collaboration with ZSL. The monitoring system combined data on tiger presence with wildlife crime. And all this was tagged with GPS data. Development began in 2010 with the initial versions were written in Delphi, the programming fraework. In the beginning, forest guards used GPS devices on patrols to record tiger sightings, deaths, wildlife crime and ecological observations.Over the years, M-STrIPES has undergone several refinements. The system was shifted to the .NET platform two years ago. Besides the desktop and server applications, WII has developed three android apps in-house. Instead of GPS devices, forest guards are using the M-STrIPES app on their phones to record data. Chapter 3 How M-STrIPES works M-STrIPES has simplified and standardised data collection methods across India.The Ecological app allows a beat guard to record direct and indirect signs of species: sightings as well as signs like paw marks, kill, and scat for tiger, leopard, sloth bear, wild dog, chital, and sambar, etc.With the Patrol app, forest guards can record crimes. For instance, snares to trap animals, trees cut illegally, or trespassers.GPS coordinates of each sign and crime are recorded and M-STrIPES has built-in safeguards to prevent fudging. The data entered in M-STrIPES app can’t be edited by anybody at any stage, without losing its geotag.The Tiger Cell is about to launch an M-STrIPES app to record human-animal conflicts. Officials can document attacks on humans and livestock, crop raiding, or property damage. The app can record details such as GPS location, time of conflict, photos of the damage, and size and estimation of loss. This can be used to assess compensation to be paid, if any.They have also added ‘SOS’ and ‘Live tracking’ tabs to the patrol app. These connect the patrol staff with the central office. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1704" height="1124" src="https://factordaily.com/wp-content/uploads/2024/09/the-tiger-cell.webp" alt="The Tiger Cell is about to launch an M-STrIPES app to record human-animal conflicts" class="wp-image-6219" srcset="https://factordaily.com/wp-content/uploads/2024/09/the-tiger-cell.webp 1704w, https://factordaily.com/wp-content/uploads/2024/09/the-tiger-cell-768x507.webp 768w, https://factordaily.com/wp-content/uploads/2024/09/the-tiger-cell-1536x1013.webp 1536w, https://factordaily.com/wp-content/uploads/2024/09/the-tiger-cell-1230x811.webp 1230w" sizes="auto, (max-width: 1704px) 100vw, 1704px" />The Tiger Cell is about to launch an M-STrIPES app to record human-animal conflicts A forest guard on patrol can press the SOS tab in case of a crime, forest fire or another emergency. It would send an SMS to four higher officials. On receiving the alert, they can rush armed backup, help to extinguish a fire etc.The app records the GPS coordinates of the areas a guard patrols. With live tracking, officers at higher levels can assign personnel to beats based on requirements on the ground.But these features do have a shortcoming. “This is possible only where mobile network is available — a huge constraint in forests,” says Ninad Mungi, senior research biologist at Tiger Cell.“One possibility is to make it work on walkie-talkies that every patrol guard carries,” he adds.M-STrIPES data can also be used to resolve wildlife crime cases. Data with geotagging intact would be admissible as evidence in the court. But it’s still early days on this front since this year’s tiger census is the first time M-STrIPES is witnessing a large scale use.Digitising the data has made analytics easier.Using ecological data, M-STrIPES generates densities of each species on a spatial scale. A colour-coded map tells you population trends from season to season. Areas marked red show population decline while areas marked in yellow indicate a stable population. The areas where populations have increased are shown in green. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1704" height="1120" src="https://factordaily.com/wp-content/uploads/2024/09/scientist-working-at-tiger-cell-1.webp" alt="Scientists working at Tiger Cell, Dehradun." class="wp-image-6220" srcset="https://fact'
