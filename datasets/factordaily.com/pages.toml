["https://factordaily.com/silk-indias-oldest-general-interest-mailing-list-has-been-its-geek-central-for-18-years"]
title = "Silk, India’s oldest general-interest mailing list, has been its Geek Central for 18 years - Factor Daily"
description = "Silk, India's oldest mailing list, was founded in 1998 by tech-savvy teenagers. Despite the rise of social media, Silk continues to attract passionate individuals seeking in-depth conversations and a sense of community."
full_description = 'Shrabonti Bagchi, Culture Editor at FactorDaily (Feb 2016 - Sep 2017), has been a writer and editor with several mainstream publications such as The Telegraph, DNA, and The Times of India. Over a career spanning over 15 years, she has written about culture, society, entrepreneurship, sustainability, food, and design. She is based in Bengaluru. This story starts with Udhay Shankar N, who walked into my office on Church Street one day in 2012 and said we were going out to lunch. “We are?” I asked. “Yes.” he said. “You are going to join Silk.”I wasn’t unfamiliar with Silk-List at that point. In fact, I was already a member of another email list that had metastasised out of Silk — a hush-hush, secretive spawn whose name was a play on the word ‘silk’ (I can’t tell you what it’s called because I’ll get thrown out). Silk was the older, more relaxed list — its archives were public, its discussions less fiery. And its members were mostly unknown to me, except a few like Shankar who were also members of the hush-hush group. That’s why I hesitated. Yet another mailing list? I could barely keep up with the ones I was already on, not to speak of Facebook and Twitter that were consuming way too much of my time.I didn’t know then that Silk was the original mailing list; one of the oldest and longest-running general interest mailing lists in the country. It wasn’t until much later — after I had been inducted (there’s no gory secret ritual; you send an email to Shankar and he adds you), participated in a few conversations and then settled into my primary role of benevolent lurker, apart from attending a few ‘Silk-Meets’ — that I became interested in the history of this list, which has been running since 1998. And it’s still going strong with its hand-picked bunch of 250 members, spitting out at least a dozen replies a day on various threads, clogging your inbox and occasionally forcing you to get off Twitter and be sucked into a vortex of rapid Wikipedia-scanning.Silk has been running practically from the time the internet came to India. It counts among its members many of India’s unsung internet architects — people who were not just pioneers and evangelists of Indian internet culture, but who also contributed to some of the ways in which the internet in India evolved. Silk is Geek Central, and its members are some of the geekiest people in the country. <img loading="lazy" loading="lazy" decoding="async" width="1606" height="1060" src="https://factordaily.com/wp-content/uploads/2016/08/Venky-Tv-and-uday.webp" alt="Venky TV and Udhay Shankar at a Silk Meet circa 2007. Image: Ramakrishna Reddy Y." class="wp-image-6251" srcset="https://factordaily.com/wp-content/uploads/2016/08/Venky-Tv-and-uday.webp 1606w, https://factordaily.com/wp-content/uploads/2016/08/Venky-Tv-and-uday-768x507.webp 768w, https://factordaily.com/wp-content/uploads/2016/08/Venky-Tv-and-uday-1536x1014.webp 1536w, https://factordaily.com/wp-content/uploads/2016/08/Venky-Tv-and-uday-1230x812.webp 1230w" sizes="(max-width: 1606px) 100vw, 1606px" />Venky TV and Udhay Shankar at a Silk Meet circa 2007. Image: Ramakrishna Reddy Y. Let’s take Shankar, a self-avowed ‘collector of interesting people’, for instance. He started tinkering around with computers while at college studying maths and science in the late 80s, and got his hands dirty on some of the earliest software and computing companies in the country as marketing and biz-dev guy (among these was a little known Kolkata-based company called Millennium Cyberworks, and it was possibly India’s first full-service website-development consultancy. In 1996, it was ahead of its time, as there weren’t that many websites to develop. It folded within a couple of years — well before the Millennium Bug, or Y2K). Subsequently, Shankar worked with some of the biggest tech companies of the day, including Yahoo! and Intel, and he currently heads the accelerator program at Axilor Ventures, an early-stage startup fund founded by former Infosys biggies Kris Gopalakrishnan and S Shibulal.After Millennium didn’t work out, Shankar, along with friends Ram Sundaram (now a fin-tech specialist, currently setting up TerraPay, a global mobile payments network) and Bharath Chari (who became an emerging markets expert and founded Titanium OU, a venture in Eastern Europe) got together and started an internet consultancy company called Arachnis.Back in the 90s, India’s first technology forum — possibly our first online social network, in a sense — was run out of yet another internet pioneer’s backyard. In those pre-internet Dark Ages, bulletin board systems (BBS) were among the limited ways to be “online”, and the late Atul Chitnis — tech legend and flag-bearer of the Open Source movement in India, a larger-than-life personality who lost out to an aggressive form of cancer at the age of 51 three years ago — had set up a server in his house. Chitnis used to host a popular BBS called CiX (shorthand for Cyberinfo Exchange and pronounced ‘six’) and although it only ran for a short period of time between December 1989 and March 1999, its influence was far-reaching.It brought together, for the first time, young Indians with a passion for computing and the early internet, and got them talking furiously on its discussion boards. There was a free, open sharing of knowledge and enthusiasm, and it was exciting as hell. Today, we take that kind of instant, global communication for granted, but for us non-digital natives, our first hesitant steps online were a source of immense wonder.“In the late 80s and early 90s, there was really no ‘internet’ in India. Geeky types like us who were in their late teens and early 20s back then, used to get information on this thing called the ‘world wide web’ from magazines like Byte. I think I first came across mentions of the word ‘internet’ in issues of Byte borrowed from a friend, whose dad, incidentally a cop in Kerala, was an unusually geeky cop and had subscribed to the magazine,” recalls Ram Sundaram. He adds that while there did exist a few servers run by government bodies like ERNET (Education and Research Network), going online was difficult and expensive except for top-ranking officials and academicians. “Then PC Quest came along, and most of the writers on the magazine were teenage geeks who used to hang out on Atul’s BBS,” recalls Sundaram. “It brought together, for the first time, young Indians with a passion for computing and the early internet, and got them talking furiously on its discussion boards. There was a free, open sharing of knowledge and enthusiasm, and it was exciting as hell. Today, we take that kind of instant, global communication for granted, but for us non-digital natives, our first hesitant steps online were a source of immense wonder.” Among these school-going tech-obsessed teens were Kiran Jonnalagadda, founder of HasGeek, a tech community for coders and technologists and the organiser of some of the country’s leading tech conferences; Rishab Aiyer Ghosh, a well-known Open Source software advocate and founder of Topsy Labs, a social search and analytics company that was acquired by Apple Inc in December 2013; Vipul Ved Prakash, co-founder of Topsy and anti-spam expert who became widely known in the early noughties for creating Vipul’s Razor, a popular open-source anti-spam system (he was on a list of Top 100 young innovators in the world by MIT Technology Review in 2013 for this work). All of them were some of Silk’s earliest members.Recalls Bharat Chari over email: “It was the time of connecting via a modem to a remote server and downloading packets of messages to be read offline, and replying at leisure. The response rate wasn’t as frantic as it has now become. Internet access, for me at least, was via a shared shell connection to VSNL, which was way more affordable than the ‘graphical’ Internet access. Some of our more intrepid friends gained considerable notoriety by creating a tunnel software that allowed people to convert a shell account into the coveted graphical account.”It was, and continues to remain, an interesting time, says Chari: “Most of us didn’t have any formal technical background, there wasn’t a Google to lean on, and the learning process was literally keystroke by keystroke.” When the search engines first made an entry, most members of the group were astounded by the amount of information that was available. “I do remember a session that we took in a, now forgotten, forum, where there was substantial cheering when we displayed an animated GIF (from the movie Speed, if I’m not mistaken).,” Chari writes. He says he was more than amused recently to find animated GIFs making their way back into the mainstream courtesy sites such as giphy.com.Eventually, however, there was a bit of a falling out at BBS. Chitnis — opinionated, strong-headed and often territorial (even his best friends would agree) — started laying down rules about what could be discussed on the forum. By some accounts, he wanted to keep the conversations limited to technology and was not in favour of having political or literary or any non-tech conversations.By 1997, VSNL had started offering dial-up connections in India, and naturally, Shankar, Sundaram and Chari were already online. They decided to start a mailing list where there would be only two rules: no personal attacks on people, and no spam. Shankar sent out an email to around 20 people he knew — most of them BBSers — and asked them to join the group. “Silk-list is a place to have knowledgeable, civil and most of all, _fun_ conversations about technology, philosophy, culture and whatever else we want to talk about. We have only two rules: no ad hominem, and no spam,” said the email.Since then, another rule has come to define Silk: referred to as ‘Rule Zero’, it’s a simple statement — Assume Goodwill. And most members will tell you that this is the rule that makes the list a safe, creative and open space to discuss anything under the sun. Its name — SilkList — was, obviously, a play on the word ‘Arachnis’. A spider spinning its web using silken threads of conversation. How to create a successful mailing list and make it work for you “Some of the oldest members — their kids are on Silk now,” Shankar tells me between swigs of beer at Watson’s Pub in JP Nagar, a stone’s throw away from his current workplace, Axilor. Over the past few years, this once-residential and old-world neighbourhood of Bengaluru, populated by retired, middle-class Kannadigas whose children were usually in the ‘States’, has transformed almost beyond recognition. Nearby Bannerghatta Road is now a tech hub, and the twin neighbourhoods of Jayanagar and JP Nagar have seen startups mushroom all over the place, and along with them, all the paraphernalia of startup life — cafes, pubs, all-you-can-eat dining, co-working spaces and Uber/Ola density of ‘within 2 minutes’.Back then, the world was much bigger in some ways. One of the most exciting things about the internet and email was the ability to get in touch with potentially anyone, anywhere — including famous geeks whom Indian geeks adored from afar; people like Neal Stephenson, Douglas Hofstadter, Douglas Adams and John Perry Barlow. “I would email random people I found interesting. There was this feeling of ‘Wow! I can connect with all these people!’ says Shankar, who claims the first email he EVER sent was to Barlow, former Grateful Dead lyricist and Fellow Emeritus at Harvard University’s Berkman Center for Internet and Society . “Often, I would actually get a response. There was a novelty value in getting email from India. I mailed Stephenson, Barlow, even invited them to be part of the list. Stephenson declined, saying ‘I can either write books or email’.”One of the fellow geeks Shankar emailed who actually accepted and has been a part of the list for years now is science fiction author, Creative Commons copyright activist and well-known blogger Cory Doctorow, co-editor of Boing Boing.Before Twitter and Facebook, this was undoubtedly one of the best things to have happened to tech-minded Indians living in India, who were simply itching to connect with the explosion of ideas happening outside. This was their social network.HasGeek founder Kiran Jonnalagadda recalls the excitement of talking to “real people” continents away (as opposed to reading journalists via news media). “It was thrilling to us that the people who came to the list were actual humans. It made a huge difference to how comfortable you felt dealing with the world; it gave you a lot of confidence. One of the people I remember interacting with on Silk was this American guy called Bruce Metcalf — an exceptionally smart guy. He was a veteran of mailing lists and I learnt a lot from him, just watching the way he would articulate his responses. I learnt much later that by profession he was a railroad engineer. A railway man but a philosopher on the side. That was one of the joys of discovering people from really divergent backgrounds on mailing lists and blogs. In that sense, Facebook is a much reduced version, an echo chamber,” says Jonnalagadda. Nearby Bannerghatta Road is now a tech hub, and the twin neighbourhoods of Jayanagar and JP Nagar have seen startups mushroom all over the place, and along with them, all the paraphernalia of startup life — cafes, pubs, all-you-can-eat dining, co-working spaces and Uber/Ola density of ‘within 2 minutes’. <img loading="lazy" loading="lazy" decoding="async" width="1794" height="1060" src="https://factordaily.com/wp-content/uploads/2016/08/Architect.webp" alt="Architect Naresh Narasimhan" class="wp-image-6253" srcset="https://factordaily.com/wp-content/uploads/2016/08/Architect.webp 1794w, https://factordaily.com/wp-content/uploads/2016/08/Architect-768x454.webp 768w, https://factordaily.com/wp-content/uploads/2016/08/Architect-1536x908.webp 1536w, https://factordaily.com/wp-content/uploads/2016/08/Architect-1230x727.webp 1230w" sizes="(max-width: 1794px) 100vw, 1794px" />Architect Naresh Narasimhan, one of the most active members of the group who has hosted several meets at his office in Richmond Town and NUMA (previously Cobalt) on Church Street, at a recent Silk Meet. Image: Ramakrishna Reddy Many of the members of SilkList have played significant roles in shaping the internet. Shankar himself was the first person in India to organise a Linux User Group Meet, and Sundaram and Chari have also been influential voices in their respective fields. Danese Cooper is an Open Source evangelist who worked with companies like Sun Microsystems and Apple to get them to work with the Open Source community, and subsequently, the CTO of the Wikimedia Foundation; Venky Hariharan was the head of Public Policy at Red Hat and later, Head of Public Policy for Google; Suresh Ramasubramanian, anti-spam activist and currently spam analyst at Apple who has been a regular media spokesman on these issues; Ashish Gulhati, co-founder of Sense/NET, a popu'
