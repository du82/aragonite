worked as an editorial designer at Amar Chitra Katha before starting a small design studio called By Two Design with Hazel Karkaria. He has taught graphic design subjects at Srishti School of Art, Design and Technology, DJ Academy of Design, NID and CEPT, Ahmedabad. He is currently working on his graphic novel, Little by Little, which captures his life growing up in different parts of Bihar. At FactorDaily, he helps to visualise the narratives for web and print format."
