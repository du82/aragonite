["https://factordaily.com/they-killed-dabholkar-but-they-couldnt-kill-his-ideas"]
title = "They killed Dabholkar, but they couldn't kill his ideas - Factor Daily"
description = "Dr. Narendra Dabholkar dedicated his life to promoting rationalism and fighting superstition in India. His relentless efforts spearheaded a movement encouraging scientific thinking and social reform, leaving an enduring legacy."
full_description = 'Shamsheer Yousaf is a journalist based in Bengaluru. He has previously worked as a reporter at Mint, Deccan Herald, and The New Indian Express. His work has also been featured in Fountain Ink and Hindustan Times. He is a recipient of the Red Ink Award from the Mumbai Press Club. Fighting superstition and irrationality with science, one death threat at a time Half an hour into Prashant Potdar’s exposition of godmen and miracles, a commotion breaks out among the audience seated at the back. Someone shouts loudly: “Chamatkaari Baba Ki Jai! (Praise to the miraculous Baba)”. The entire audience, numbering in hundreds and neatly segregated by age and gender, turns towards the source of the disturbance.A godman clad in saffron robes and a green headband, brandishing a trishul, is angrily making his way through the audience with his followers, who are raising slogans praising him. <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/WhatsApp-Image-2024-12-02-at-13.52.44_c87b3bcd-1.webp" alt="" class="wp-image-6981"/>Rationalist Prashant Potdar of ANIS addresses a rapt audience at an anti-superstition show at Chichondi Patil village, Ahmednagar It’s an early September night in the village of Chichondi Patil, about 20 km east of the garrison town of Ahmednagar in central Maharashtra. The Maharashtra Andhashraddha Nirmoolan Samithi, known around the state by its Marathi abbreviation ANIS (it is also referred to as MANS), is holding a show titled “The world of superstition, the deception of miracles.” Before the “baba” gatecrashed the show, Potdar was demonstrating tricks used by godmen to cheat people.“How can you say that there are no miracles,” the religious leader thunders at Potdar.Potdar, ANIS’s state secretary, wearing a Nehru coat over kurta and jeans, attempts to pacify the baba. “Calm down, Maharaj. Calm down.” Potdar (addressing the audience): “These godmen who perform miracles are just cheats”.Baba: “Cheats? How dare you call me a cheat?”Potdar: “Those who exploit people in the name of faith are cheats.”Baba: “Do I come across as a cheat to you?”Potdar: “Ok then. If you have any divine powers, show it to us.” A verbal duel ensues. The Baba springs forward, grabs a coconut and smashes it on the ground. The coconut splits open, and a red ribbon emerges from the inside. He then takes a trishul from his assistant, and drives it through his tongue to pierce it.His supporters shout again “Chamatkaari Baba Ki Jai!”.The duel started off seriously, but a couple of minutes into it, the tone turns farcical. The baba’s followers, pleased with landing on the stage, are beaming, while the baba himself looks distracted. Potdar’s barbs are addressed more at the audience than at him. When the baba is inserting the trishul into his tongue, the children in the front row ask pointedly that if the piercing is real, where’s the blood?The confrontation is made up, part of a skit that ANIS has performed in hundreds of villages across Maharashtra. An act that has taken them years to polish, and which they now perform once every 15 days. The miracles performed on stage are chosen from the repertoire of various godmen that ANIS has discredited over the years Bhagwan Randive, Potdar’s 55-year-old colleague who plays the role of Chamatkaari Baba, has been working specifically on exposing fraud charlatans — like the one he plays on stage. Investigating cases related to fraud godmen, challenging them in public or working with the police to conduct sting operations to expose them has formed a major part of his work at ANIS for the last 20 years. The miracles performed on stage are chosen from the repertoire of various godmen that ANIS has discredited over the years — such as the one that involves lighting a lamp filled with water (after making an audience member drink the water to certify that it is indeed water and not oil). Another trick involves releasing a chain held between two interlocking chains, which two men from the audience are unable to untangle.“There are the tricks that have been often used to fool people. We choose tricks that many people bought into and that made some fraud babas very famous,” says Potdar.As the show goes on, Potdar begins to reveal the truth behind the various miracles.The water lamp trick: A piece of calcium carbide is hidden in the lamp, which produces acetylene gas when water drops fall on it. The acetylene burns when it comes in contact with air.The piercing of the tongue with the trishul: Instead of one, there are, in fact, two trishuls, one of which has a U-shaped bend that goes around the tongue to make it look like a piercing has taken place.The bed of nails: Simple physics. All the nails are equidistant and of the same height. If a body lies on it, the force exerted by the nails is spread across the entire area of the bed of nails.Potdar is an accomplished performer, who understands that his message would not sink in unless he keeps his audience entertained. In particular, his rapport with children shines through as he gets them to scream, sigh, laugh, and sit in rapt attention during the entire three-hour show. Instead of one, there are, in fact, two trishuls, one of which has a U-shaped bend that goes around the tongue to make it look like a piercing has taken place. “The performance that you see today has taken me 15 years to perfect. When I first started learning this in 1995-96 by watching Doctor (Dr Dabholkar) perform, I fumbled a lot. For the water lamp trick, I would drop the calcium carbide tablet that I needed to hide,” says Potdar. Similarly, in a trick that involved pouring water from an empty vessel, the water level would be too high or too low, ruining the performance. “ Now, I can perform in front of an audience with no preparation,” he says. The origin of these village shows where the science behind miracles is explained goes back to the 70’s and 80’s when a large number of ‘action groups’ mushroomed in Maharashtra. One of the pioneering groups was the B Premanand group, which organised science fairs across different parts of Maharashtra. Premanand’s group pulled large numbers for shows in which the scientific principles behind ‘miracles’ were explained to people.Narendra Dabholkar, a qualified MBBS doctor who flitted between various action groups and stopped his medical practice, decided to take up the same programme across the state. In 1989, Dabholkar founded ANIS and began work earnestly. Headquartered in Satara, ANIS campaigned against superstitions, confronting dubious godmen and self-proclaimed holy men who promised ‘miracle cures’ for ailments. He writes about the early days: We exposed the secret behind bhanamati (black magic) like the sudden movement of things from one place to another, burning or ripping of clothes, spots of bibya (marking nut) appearing all over the body, and so on… We conducted psychoanalysis of a woman feeling possessed by a goddess or why a man feels possessed by a ghost… The curiosity of the masses helped us reach their hearts. Excerpts from ‘Writings Against Silence’; Edited by K Satchidanandan Public education was not the only means of eradicating black magic. ANIS campaigned for several years for an anti-superstition law to be enacted in Maharashtra. But pockets of resistance to Dabholkar’s work remained, particularly among those who had the most to lose. A godman, Narendra Maharaj, instigated his men in a public speech to cut off Dabholkar’s hands and legs; a godwoman’s disciples physically assaulted and registered criminal cases against him; and MLAs of the Shiv Sena and BJP demanded a ban on Dabholkar’s organisation and demanded his expulsion from Maharashtra.The danger was real — on August 20, 2013, Dabholkar was shot down by two unidentified gunmen in Pune while on a morning walk. He was shot in the head and chest, and died before reaching the hospital.Potdar was in Bengaluru attending a training session when he heard about Dabholkar’s death. “I was shocked. I could not believe it,” Potdar recalls. “Doctor’s death affected me more than a death in my own family.” The danger was real — on August 20, 2013, Dabholkar was shot down by two unidentified gunmen in Pune while on a morning walk. He got back to Satara that night, but missed the last rituals. After ‘Doctor’s’ death, there were many challenges for the organisation. “We felt broken,” says Potdar. Many feared that the organisation would not survive the death of its leader. “But we all knew that we had to complete what we started.” <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/WhatsApp-Image-2024-12-02-at-13.53.42_1ef21e13-1.webp" alt="" class="wp-image-6989"/>Prashant Potdar (left) and Bhagwan Randive (right) standing in front of a portrait of Dr Narendra Dabholkar On September 1, a state level meeting was held in Satara in which over 3,000 activists took part. At the meeting, a resolution was passed to take forward Dabholkar’s work. In the three years since Dabholkar’s death, Potdar says that their membership and branches have actually grown substantially. Today, there are nearly 340 branches of ANIS and 4,000 members across Maharashtra. “We have a presence in every single taluk across the state,” says Potdar.Dabholkar’s death also accelerated the passage of the anti-superstition Bill. Four days after his death, the Bill was promulgated via an ordinance, and before the end of the year, it was passed by the state Assembly.The new Act criminalised 12 classes of superstitious practices — ranging from claiming to perform miracles, psychic surgery, and encouraging human sacrifices. While activists have their reservations about the efficacy of the Act, it has had an impact on the ground. Earlier only Section 420 or cheating was applicable, which was often too mild for the crime. “The Act has made our lives easier as these are laws specific to the kind of cases we come across. It has also made it much easier to get co-operation from the police on these cases. Now, a person can be imprisoned for upto seven years, and they have to pay a fine between Rs 5,000 and Rs 50,000,” Potdar informs us.Since the Act was passed three years ago, 270 cases have been filed under the Maharashtra Anti Superstition Act. Of these, there have been three convictions so far, with judgements putting black magic practitioners behind bars for upto three years.Once a complaint arrives at the ANIS office, the team studies the case extensively. “We verify how much of the complaint is actually true, and only once we are convinced do we get in touch with the police,” says Potdar. ANIS sends an agent, usually from another village, to check on the suspect.Once the case has been verified to be genuine, they begin working with the police. “Why should we take the law in our hands?” asks Potdar. “Police hai naa.”In most cases, the ANIS team directly contacts the local Superintendent of Police (SP), although there are chances that local police may be hand-in-glove with the culprits. “We have seen that happen,” says Potdar. But that’s a chance they have to take if they want to catch the culprits, and usually, the police and ANIS’s activists together plan a sting operation.In some instances, one of the activists, usually Randive, contacts the suspect, and lays a trap to catch him or her in the middle of the action. ANIS ensures that the sting operation is recorded on video. <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/WhatsApp-Image-2024-12-02-at-13.54.23_2574b9ac-1.webp" alt="" class="wp-image-6993"/>Prashant Potdar explains the provisions of the Maharashtra Anti-superstition and Black Magic Act at an anti-superstition show in Chichondi Patil village Take, for instance, the Guru Aai case. Subhas Jagannath Yadav, an ex-serviceman, was fleeced by a guru earlier this year in Karad, a lush town in the sugar bowl of Maharashtra. Yadav had been struggling over the last few years: at the local sugar factory where he worked, a driver he had hired to run the employer’s tractor made off with some money. This incident hurt Yadav’s finances, but more damagingly, his reputation took a steep dive.Yadav’s uncle suggested that he get in touch with Guru Aai (‘Aai’ means mother in Marathi), a 40-year-old transgender individual who lived in a slum in a nearby village called Wahaaganv. Guru Aai, whose real name is Aatish Patil, had built up a substantial following in and around Karad.To get rid of the so-called “karni” (black magic) on his house, the guru asked Yadav to procure the following items — a black blouse, camphor, a pack of incense sticks, a saree, two coconuts, a Gandhi topi, and cloth pieces for a shirt and a pant.Guru Aai took the black blouse in her hand and placed the coconut and camphor in it. Yadav’s family was in attendance. She handed the black blouse and its contents to Yadav and told the family that a ‘Bhovati’ (spirit) roams around in his house. Aai then took back the material from Yadav’s hands, and kept it aside. Suddenly, a great flame encircled the coconut and camphor. “See, there is karni in your house,” she shouted at them. “There’s a lot of danger to your family. To fix this, you need to spend a lot of money.”She put some water and basil leaves over the burning coconut and told Yadav that pumpkins and goats would be needed to remove the karni, and it would cost Rs 20,000.Next day, Yadav took an additional loan of Rs 20,000 on the jewellery that he had already pledged and handed it to the guru. Over the course of the next two days, she maked additional demands — another Rs 4,000, a nine-yard sari, a pair of trousers and a shirt, five blouse pieces and so on.Finally, fed up with her demands, Yadav called her and told her he wasn’t going to spend a paisa more. That afternoon, Guru Aai turned up at his house and began to shout dramatically, flailing and thrashing her arms and legs as if in an epileptic fit. “If you don’t give me the money, my deva will not leave you. Your karni will come back to harm you,” she screamed. “Blood will flow from your nose, your family and your children’s lives will be ruined.” <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/WhatsApp-Image-2024-12-02-at-13.55.00_2cd53a5b-1.webp" alt="" class="wp-image-6994"/>Women being “possessed” by demons and spirits is a common superstition across India, especially in the rural areas. Picture used for representational purposes only. Yadav was terrified. After all, Aai had set fire to a coconut at will.Finally, Yadav contacted Maruti Thorat, a local member of ANIS he had met a few days ago. Through Thorat, the case reached ANIS’s headquarters at Satara, and the table of Prashant Potdar. Potdar immediately recognised the trick. “This trick had tur'
