title = "India’s new-age anti-trafficking tools: Big data, AR comics, mobile games - Factor Daily"
description = "A girl wakes up in a tiny dark cell. Where am I? What is this place? Why can’t I remember how I came here? She knocks on the door. “Is anybody there?” She paces up and down the room. An older woman enters. Everybody calls her Masi; she runs a brothel. A young girl, Meena, […]"
full_description = 'Monica is an independent journalist based in Bangalore. She writes on technology, gender, and development. She is the recipient of the 2020 Stop Slavery Media Award by Thomson Reuters Foundation. A girl wakes up in a tiny dark cell.Where am I?What is this place?Why can’t I remember how I came here?She knocks on the door. “Is anybody there?”She paces up and down the room.An older woman enters. Everybody calls her Masi; she runs a brothel.A young girl, Meena, follows her into the room.Masi: So you are awake. Meena, what is the name of this one?Girl: What is my name? I… I can’t remember my name!Masi: It happens, dear. Strong potions can make you forget everything. And what would you even do by remembering your name?Meena: Her name is….Masi: Leave it. Your name is Ruby. I’ll call you Ruby Darling.Masi: Like it, Meena?Meena: Sounds like a heroine, Masi.Girl: I want to go home.Masi: Of course, but have some food first. Meena, bring her some of last night’s leftovers.The girl has two options.Obey, and she gets food.Resist, and she starves.What do you think she should do?Yes. It’s you who decides.MISSING: Game for a Cause is a role-playing game about a trafficked girl, Champa, that puts the player in her shoes. “This makes you, the player, the protagonist,” says Leena Kejriwal, a Kolkata-based photographer and installation artist who conceived the game.“You are responsible for her future and (her) experiences,” she says. “You also experience her helplessness and frustration first hand.” <img loading="lazy" loading="lazy" decoding="async" width="672" height="792" src="https://factordaily.com/wp-content/uploads/2024/12/Missing-game-for-a-cause-1.webp" alt="" class="wp-image-6497"/> <img loading="lazy" loading="lazy" decoding="async" width="672" height="792" src="https://factordaily.com/wp-content/uploads/2024/12/game-for-a-cause-2.webp" alt="" class="wp-image-6498"/> ‘MISSING: Game for a Cause’ is a role-playing game about a trafficked girl, Champa, that puts the player in her shoes. Kejriwal first encountered trafficking in 2000 when she documented the lives of young girls and women in Kolkata. “The plight of these girls became the core of my subject matter as an artist,” she says.While working with several NGOs in red-light areas, she was most distressed about the growing demand for paid sex, which pushed more girls into the sex trade. “The public, who is the demand-maker and the biggest stakeholder in the issue, was getting off scot-free. They were absent in all the conversations,” she says.Kejriwal wanted to engage them.In 2014, she launched a public art campaign, MISSING, funded through crowdsourcing, for girls who disappear into the world of forced sex work. She also made a five-minute film on Jaya Ghosh, a trafficking survivor who got out of sex work. Ghosh now works with an NGO for sex workers’ children in Bow Bazaar, a major red-light district in central Kolkata.Kejriwal wanted to do more to raise awareness and began exploring digital media. “We realised that digital media is a very powerful platform to sensitise the public today on the seriousness of trafficking,” she says.In the early days after the crowdfunding, Kejriwal was discussing video games with a friend. It suddenly dawned on her that a game would be a powerful way to engage the public. “In a film, you watch a story play out, while a game is immersive and engages you directly,” she says.Over the last few years, a new category of digital games for the purpose of social change has emerged. These are known in the gaming industry as G4C, or Games for Change. Kejriwal began working on one.The storyline was formed from interviews with victims and survivors. Satyajit Chakraborty, the founder of Flying Robot, an indie game development studio, travelled with Kejriwal to various red-light areas in West Bengal. Then, he designed and developed the point-and-click-style game.“It’s meant for the public, it is meant for every demand-maker, be it a man, boy, woman or girl, who either passively or actively creates demand,” says Kejriwal.Missing was launched on September 20, 2016 and is available for iOS, Android and PC users. It’s available in English and 12 Indian languages.“The vernacular versions of the game enabled us to reach deep rural pockets and create change,” says Kejriwal. In urban areas, the game is being used to engage school students on the issue of sex trafficking.Missing has registered more than half a million downloads and is played in more than 70 countries, including the Philippines, South Korea, Thailand and Brazil — countries severely affected by trafficking. “In an evaluation, we found that the persons who played the game reported a higher level of engagement than through a traditional format,” says Kejriwal.Proceeds from sales of the game go towards creating training programs and recovery centres for rescued girls.One crucial goal of Kejriwal’s project is to understand the choices by players, and their reactions to the game. Kejriwal collects data on this and shares it with policymakers.These have also been of interest to researchers. Like Marcus Toftedahl, a lecturer at the School of Informatics of the University of Skovde in Sweden.He first came across the game when he met Kejriwal and Chakraborty at a game developer conference organised by Nasscom in Hyderabad in 2016. MISSING won the ‘Indie Game of the Year’ title at the conference.Toftedahl was intrigued. “It is a very unfair game. It contains a lot of frustrating sections, making me, as a player, feel hopeless, lost and disgusted,” he says. “This is one of the strengths of the game as I see it.”But this can also be a risk, he adds. “It can (and it has) scared away players expecting an ‘ordinary’ game.”This can be seen in the spectrum of reviews that the game has garnered on app stores. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="996" height="786" src="https://factordaily.com/wp-content/uploads/2019/04/image-99.webp" alt="" class="wp-image-6541" srcset="https://factordaily.com/wp-content/uploads/2019/04/image-99.webp 996w, https://factordaily.com/wp-content/uploads/2019/04/image-99-768x606.webp 768w" sizes="auto, (max-width: 996px) 100vw, 996px" /> <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1054" height="768" src="https://factordaily.com/wp-content/uploads/2019/04/image-100.webp" alt="" class="wp-image-6542" srcset="https://factordaily.com/wp-content/uploads/2019/04/image-100.webp 1054w, https://factordaily.com/wp-content/uploads/2019/04/image-100-768x560.webp 768w" sizes="auto, (max-width: 1054px) 100vw, 1054px" /> User review for ‘Missing’ on Google Playstore Toftedahl, who researches on game development, published a paper on Missing in the International Journal of Serious Games in December 2018. He analysed the reviews to see if the game spread awareness on trafficking. He found most reviews and ratings were positive — 4- or 5-star ratings. “They often praise the story and the theme.”Even in cases where the game got a 1-star rating, he found that the game succeeded in its objective. “Players giving the game a 1-star rating would often comment on the theme as well, but from a negative point of view,” he says.This, according to him, was a positive response in relation to the theme. “Players gave the game a 1-star rating because they thought the game was disgusting or horrible, and it is! It is about trafficking, and that is disgusting and horrible.”In his paper, he concludes that Missing is a serious game “embracing a theme with complex properties, important to highlight on a global scale”.“Even though a game is not the sole solution, it can be a part of the solution,” says Toftedahl.Kejriwal is encouraged by the response. Besides the Nasscom award, MISSING also won the Sandvik Diversity award, 2017, for impact and innovation to create social change.Kejriwal now feels the need for the game to dive deeper into Champa’s life. Work on a second game, MISSING: The Complete Saga, has begun.The new version is a 3D role-playing adventure, with longer and more immersive gameplay. This tells you not just about the escape of a trafficking survivor but her whole life. It starts from Champa’s childhood to her life as a survivor and the situation she faces after her return home. It also features day/night cycles, and each day you will be assigned new tasks. Kejriwal says the new game is designed to allow players more freedom and agency than in similar real-life solutions.The project has raised $50,795 on Kickstarter from 455 backers.Kejriwal says that the new game would emphasise the factors that land Champa in the clutches of traffickers. “Why wait for a girl to be trafficked to save her?” Tech against trafficking Of the estimated 4.5 million victims of sex trafficking globally, 3 million live in India. Perpetrators are increasingly using digital tools for trafficking.On the other hand, technology has huge potential to fight against trafficking. While technology is not a silver bullet, the anti-trafficking community in India is using it to prevent and intervene in trafficking as well as identify and prosecute traffickers.Some technologies have been in use for years — call records to track the location of a trafficker, investigation of online ads selling sex services, and using video conferencing for survivors to appear in courts.Tech tools have also empowered digital activism. One vigilant train passenger’s tweets got 25 minors rescued from a suspected human trafficking racket. Online petitions are another way of doing this. Under the human trafficking topic, Change.org shows 185 petitions. Anti-trafficking NGOs are using social media extensively to create awareness and raise funds. I am traveling in Avadh express(19040). in s5. in my coach their are 25 girls all are juvenile some of them are crying and all feeling unsecure.@RailMinIndia @PiyushGoyal @PMOIndia @PiyushGoyalOffc @narendramodi @manojsinhabjp @yogi— Adarsh Shrivastava (@AdarshS74227065) July 5, 2018 Several organisations run social media campaigns that make consumers think about the supply chain. Prominent among them are the US Department of Labor’s Sweat and Toil resource base, Rethink Supply Chains of Partnership for Freedom, a public-private partnership to tackle human trafficking, and Good Guide.Tech Against Trafficking is a coalition of global technology companies, civil society organizations, and the United Nations to use technology towards eradicateing human trafficking. Its founding members were BT Group, Microsoft, and Nokia, and members now include Amazon, Salesforce.org and AT&T.With over 800 million smartphone users expected in India by 2022, there is greater potential to prevent trafficking cases or rescue victims with timely information and quick action. Realising this, India’s Central Bureau of Investigation has started a 24×7 helpline (011-24368638) for citizens to report human trafficking, especially of children and women.Crucially, a new wave of technology incorporating big data analytics and machine learning is showing potential to clamp down on trafficking further. Traffickers use digital tools in every aspect of the crime to avoid attention. But this is bound to leave traces. Big data analytics can help pull data from Google search trends, social media accounts, chat sessions, the deep web, and elsewhere to pinpoint traffickers.If only it were that simple. India lacks data on human trafficking, creating an environment for crime to thrive. So the first step is to digitise and assimilate data on trafficking.There are various agencies collecting data on trafficking in India — the police, the National Crime Records Bureau, Anti Human Trafficking Units (AHTUs), child helplines, courts, hospitals, nonprofits, academia, and the ministries of social welfare, education, and women and child.All this data, however, is collected in different formats and stored in silos. Agencies don’t share data with each other. And no agency collates it in one place.Standardised formats are the first step. In a report on trafficking published in November 2013 by a group comprising Dasra, The Hummingbird Trust, Omidyar Network, and Kamonohashi Project, the authors recommend the use of a standardised format for recording and reporting data on sex trafficking that can be centralised at the local, district and national level.“Analysing this information will lead to a better understanding of factors that lead to trafficking, connections to arms, drugs, labour trafficking, recruitment methods, demographics of victims such as nationality, ethnicity, gender, and age, victim characteristics such as prior education, employment, health, and income, trafficking routes and trafficker profiles,” the report mentions. Main forms of exploitation and profiles of detected victims Sexual Explotation Begging and other forms Forced Labour <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1070" height="590" src="https://factordaily.com/wp-content/uploads/2024/12/main-form-of-explaination-and-profiles-of-detected-victims.svg" alt="" class="wp-image-6502"/>Source: UNODC Elaboration of National Data, 2016 Tracking assets, building capabilities One way to understand who the most vulnerable targets for trafficking are is to look for individuals with the least assets. Assets, in this context, can be a safe space, schooling, political awareness, or savings and loans. That’s the approach Apne Aap Women Worldwide, an anti-trafficking NGO, has adopted.“A teenage girl from a rural, poor and low caste family is most vulnerable to trafficking,” says Ruchira Gupta, founder of Apne Aap. “To prevent her from being trafficked, we try to build her capabilities.”Apne Aap creates an asset card for each girl it covers — indicators that help assess the vulnerability of an individual. An Apne Aap worker asks a girl questions related to her access to social assets and documents her answers. Based on this, an asset card is issued, indicating how vulnerable she is to trafficking.Recently, Apne Aap started using an Android application — Last Girl Ten Assets — to enter the answers and store records in a database. The database gives a comparison of the assets of the girls, making it easy to understand who requires attention and what assets are needed immediately.“The app has standardised the format of data collection,” says Tinku Khanna, member of Apne Aap. “It helps me analyse the data and understand quickly that she doesn’t have a BPL card or a birth certificate. It helps me understand the gap easily.”Apne Aap is using the app in a village in Bihar’s Araria district, which is identified as a backward district by NITI Aayog.Khanna expects the app would help create a database with vulnerability indicators for a large number of people. “It can also be customised based on what assets are useful for persons in an area,” she says.A superwoman fights gender violence in ARRam Devineni, an Indian-American artist and film'
