title = "The dark hand of tech that stokes sex traficking in India - Factor Daily"
description = "A gripping narrative of Farzana, a sex trafficking survivor, who was lured by false promises of love and opportunity-- her journey unveils the disturbing nexus between technology and exploitation, shedding light on the hidden horrors of modern-day slavery."
full_description = 'Monica is an independent journalist based in Bangalore. She writes on technology, gender, and development. She is the recipient of the 2020 Stop Slavery Media Award by Thomson Reuters Foundation. “Tech-enabled trafficking is far more common than most people believe,” says Rishi Kant, a member of the Shakti Vahini, a non-governmental organisation (NGO, or nonprofit) that was involved in Farzana’s case. “When a girl is trafficked, people ask what happened after she was trafficked. How many times has the system tried to find out how exactly the trafficking was carried out? This is partly why, to some, the number of tech-enabled cases doesn’t seem as huge as it actually is.” Farzana* finally got through to her mother after three months. It was August 2017, and she was calling from a tiny room on GB Road in Delhi — one of India’s largest red-light districts. A regular client let her use his phone. Farzana didn’t want to tell her mother the truth of her situation. Instead, she told her that she was in Mumbai. That she was doing well. *The real names of Farzana and the other victims of sex trafficking have not been used in this story to protect their identities. A few months before, in a tiny village in West Bengal’s South 24 Parganas district, Farzana was preparing for her matriculation exam. She was the fourth of five children. With her father out of a job, the family survived on the earnings of her elder brother who drove an auto rickshaw. Life was hard but Farzana, unlike her siblings, had gotten a chance to study.In April 2017, Farzana received a call on her phone from an unknown number. A soft-spoken boy spoke. He told her his name was Sabir Ahmad Gazi and that he got her number from his brother. Farzana hung up. Sabir called Farzana again the next day. And the day after. And the day after that. Until she became less reluctant to speak with him. She started having long conversations with Sabir. They spoke about life and dreams; they spoke about love.Soon, Sabir proposed marriage to Farzana. He promised her a good life and offered to take her to a big city — Delhi. They planned to elope. It didn’t matter to Farzana that she had not met Sabir in person or that they knew each other only over the phone. She was 16 and in love.On May 17, 2017, within a month of that first call, Farzana left her house to be with Sabir. From Diamond Harbour, they took a train to Sealdah in Kolkata and then another train to Delhi. What happened next was not how Farzana had imagined it.Sabir took Farzana to Loni in Ghaziabad – part of the National Capital Region around Delhi – and introduced her to Muniya, who, he said, was his sister. He also introduced her to Muniya’s sons, Vinit and Sonu. Sabir asked Muniya to teach ‘the work’ to Farzana. “What type of work?” Farzana asked. Sabir responded with a slap. He spent the night there and disappeared in the morning.Muniya, with two other women, Manju and Riya, started Farzana’s ‘training’. They forced her to speak in Hindi, a language unfamiliar to her. They often fed her just once a day. They made her swallow a tablet every day; she doesn’t know what it was for. Sonu would mercilessly beat her. Vinit raped her several times.After a month, Manju and Riya took Farzana to GB Road in Delhi and handed her over to Bhanu, the head of Kotha number 56. At the brothel, Farzana would begin work at 10 am. She would have her first meal of the day only after the shift ended at 4 pm. The meal depended on feedback from the day’s customers. If someone complained, Bhanu would starve her. On good days, she ate roti, dal and sabzi. The evening shift was from 8 pm to 4.30 am. Dinner was served after. Over the two shifts, between 20 and 25 men would be forced on Farzana. *The real names of Farzana and the other victims of sex trafficking have not been used in this story to protect their identities. TRAPPED THROUGH FACEBOOK <img loading="lazy" loading="lazy" decoding="async" width="2224" height="940" src="https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1.webp" alt="" class="wp-image-5844" srcset="https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1.webp 2224w, https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1-768x325.webp 768w, https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1-1536x649.webp 1536w, https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1-2048x866.webp 2048w, https://factordaily.com/wp-content/uploads/2019/02/trapped-through-facebook-1-1230x520.webp 1230w" sizes="(max-width: 2224px) 100vw, 2224px" /> <img loading="lazy" loading="lazy" decoding="async" width="1440" height="1228" src="https://factordaily.com/wp-content/uploads/2024/04/Section-02-infographic.webp" alt="" class="wp-image-5846" srcset="https://factordaily.com/wp-content/uploads/2024/04/Section-02-infographic.webp 1440w, https://factordaily.com/wp-content/uploads/2024/04/Section-02-infographic-768x655.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/Section-02-infographic-1230x1049.webp 1230w" sizes="(max-width: 1440px) 100vw, 1440px" /> <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="714" height="2550" src="https://factordaily.com/wp-content/uploads/2024/04/mobile-illustration-2-1.webp" alt="" class="wp-image-5847" srcset="https://factordaily.com/wp-content/uploads/2024/04/mobile-illustration-2-1.webp 714w, https://factordaily.com/wp-content/uploads/2024/04/mobile-illustration-2-1-430x1536.webp 430w" sizes="auto, (max-width: 714px) 100vw, 714px" /> The treachery of everyday tech Sabir had lured Farzana into a sex trafficking network simply by calling her by phone, without ever meeting her in person. In Jharkhand, a trafficker trapped another 16-year-old girl using WhatsApp.The daughter of a daily wage labourer in the coal mines of Jharkhand’s Ramgarh district, Neetu received a WhatsApp message one day in 2016. Like Farzana, she didn’t know the boy who messaged her but he soon managed to get her interested. They began chatting regularly and soon the boy proposed marriage. When she said her parents wouldn’t agree, he asked her to come to Delhi. Unbeknownst to her, he had already fixed a deal to sell her into sex work for Rs 1.5 lakh.This entire trafficking act was pulled off solely through WhatsApp, says Baidyanath Kumar, an anti-trafficking activist and a member of Jharkhand’s Child Welfare Committee (CWC), a statutory body. “I was shocked at how efficiently the trafficker used social media to traffick a girl out of her house just by typing on his phone and without even having to step out himself.”Neetu’s parents approached the police. The anti-trafficking squad of Jharkhand police got involved and, with the help of Delhi police, rescued Neetu. In the same operation, five other girls were also rescued — two from Jharkhand and three from Bihar.All the six girls were trafficked after establishing contact through WhatsApp. The growing menace of tech Neetu’s and Farzana’s cases show how networked technologies – mobile phones, the internet, social media, the darknet, and even cryptocurrencies – have exacerbated the grave problem of sex trafficking in India. The trust-building phase of the recruitment process is increasingly being done online, often by young boys.What distinguishes such technology-enabled trafficking is the lack of a need for in-person contact. By this definition, over half of the trafficking cases in the country would qualify as tech-enabled, says Siddhartha Sarkar, a working group member in the social justice and empowerment division of NITI Aayog, the government’s policy think-tank. “If you’re talking about a trafficker exploiting technology at any stage of his business, then almost all trafficking cases will fall in that category.”Mahesh Bhagwat, commissioner, Rachakonda Police, in Telangana, says he has witnessed quite a few tech-enabled trafficking cases in recent years. “Just do a Google search about Rachakonda sex trafficking cases and you will find several in the last two-three years that have a social media angle or have used a website,” says Bhagwat, whom the US Department of State honoured in its Trafficking in Persons Report in 2017 for his “remarkable commitment to the fight against human trafficking for the last 13 years”.Even so, Bhagwat adds, “I wouldn’t say the percentage is huge. But it’s increasing for sure.”Several others also committed to the fight insist the magnitude of the problem is huge. But it’s easy to see why Bhagwat thinks otherwise.“Tech-enabled trafficking is far more common than most people believe,” says Rishi Kant, a member of the Shakti Vahini, a non-governmental organisation (NGO, or nonprofit) that was involved in Farzana’s case. “When a girl is trafficked, people ask what happened after she was trafficked. How many times has the system tried to find out how exactly the trafficking was carried out? This is partly why, to some, the number of tech-enabled cases doesn’t seem as huge as it actually is.” <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-1.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-2.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-3.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-4.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-5.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphic-tab-1.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphic-tab-2.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphic-tab-3.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphic-tab-4.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/info-tab-5.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphics-mobile-1.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphics-mobile-2.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphics-mobile-3.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/graphics-mobile-4.svg" alt=""> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2019/02/Section-3-infographic.svg" alt=""> Groping in data darkness To understand how big a problem tech-enabled trafficking has become, FactorDaily got in touch with at least a dozen police officers and over 20 NGOs fighting trafficking in Andhra Pradesh, Assam, Delhi, Jharkhand, Karnataka, Meghalaya, Uttar Pradesh, and West Bengal. The accounts of Farzana, Neetu and other victims have been reconstructed from extensive interviews with the police, NGOs and others involved in their cases.Everybody said tech-enabled sex trafficking cases were increasing, and cited several cases reported from across India. However, we only have anecdotes. No organisation has data or conducted empirical research on tech-enabled trafficking. (Even for overall human and sex trafficking cases, the latest available data is for 2016.) Police and caseworkers don’t always identify these as trafficking through digital tools. Nobody is categorising these cases as a specific phenomenon — a new modus operandi of trafficking based on virtual connections.“Unfortunately, there has been very little research done on the prevalence of trafficking enabled through social media,” says Phil Bennett, a board member at Destiny Foundation, a Kolkata-based NGO combating sex trafficking. “It would be wrong to extrapolate from a small dataset without careful research. However, we can say that the problem is growing in India and it is becoming more urgent to tackle the issue.”There, however, exists one reference work in this area.Between 2010 and 2013, Sarkar, then a researcher attached with universities in Thailand, Hungary and the United Kingdom, conducted face-to-face interviews with 97 women victims, 64 traffickers, and 85 clients across India, Nepal, Thailand, Hungary and the UK to understand the role of technology in sex trafficking. The surveys included nearly 100 participants from India, mostly from Assam, Bihar and West Bengal, the state with the highest number of human trafficking cases in India.Sarkar’s field survey, published in 2015, showed that traffickers widely used sophisticated software to safeguard their anonymity, online storage and hosting services, and advanced encryption techniques to evade the police.In the absence of current research on tech-facilitated trafficking, interventions and policies can only be shaped by speculation or extrapolation from a few publicised cases. “To fight trafficking, we absolutely need to understand how exactly trafficking is being done; what modes and tools traffickers are using. Figuring out how traffickers established first contact with the survivor would help greatly in investigations and in making solid ground for the prosecution.” by RISHI KANTMember, Shakti Vahini To bridge some of this knowledge gap, Sarkar, along with researchers from several other countries, is working on a book on technology-facilitated trafficking in seven countries. “This book will provide a lot of India-specific perspective, all based on primary data from hundreds of interviews,” he says. Marriage, money and a better life Despite the data uncertainty, anti-trafficking agencies are developing a decent understanding of the tools and platforms exploited by traffickers.In most cases, traffickers source the phone numbers of girls from stores selling mobile phone call and data recharge packs in villages, says Tathagata Basu, superintendent of police, Sundarban police district, a source region for many trafficking cases, in West Bengal. “When a girl recharges her phone, he notes down her number. He passes it on to the trafficker, who initiates contact by calling the girl or texting her.”Though a lot of luring is done in the form of marriage proposals, traffickers are finding traps beyond this. They peddle the idea of well-paying jobs in big cities. Auditions for modelling and reality TV shows are also being increasingly used as a front, says an activist who has worked on several cases of tech-enabled trafficking. She decli'
