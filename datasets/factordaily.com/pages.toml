["https://factordaily.com/removing-child-sexual-abuse-material-from-the-internet"]
title = "Removing Child Sexual Abuse Material from the Internet - Factor Daily"
description = "In 2019, the NCMEC got 16.9 million suspected CSAM reports, of which nearly 1.98 million were from India—the single-largest out of 241 countries. The Indian subcontinent ranks high when it comes to CSAM consumption."
full_description = 'Monica is an independent journalist based in Bangalore. She writes on technology, gender, and development. She is the recipient of the 2020 Stop Slavery Media Award by Thomson Reuters Foundation. It is a mid August morning in 2019. Chris is in his office in Cambridge, 90 km north of London, when he receives a report from a young woman in India.In the report, the woman writes that a video of hers was leaked onto the internet without her consent. She also shares a URL. When Chris clicks on it, a sexually explicit video of two teenagers – a boy and a girl – pops up.“And that she was a minor at the time in which the video was produced. She was unsure of how the video was leaked online or who did it, but, obviously, had concerns that it was circulating,” says Chris. <img loading="lazy" loading="lazy" decoding="async" width="966" height="836" src="https://factordaily.com/wp-content/uploads/2023/08/sitting-1.webp" alt="" class="wp-image-3447" srcset="https://factordaily.com/wp-content/uploads/2023/08/sitting-1.webp 966w, https://factordaily.com/wp-content/uploads/2023/08/sitting-1-768x665.webp 768w" sizes="(max-width: 966px) 100vw, 966px" /> Chris and his team of 13 analysts deal with such imagery everyday. He is a Hotline Manager at the Internet Watch Foundation, which aims to eliminate child sexual abuse material (CSAM) online. The hotline accepts reports of CSAM, verifies them, and acts to have them taken off the internet. <img loading="lazy" loading="lazy" decoding="async" width="2432" height="1824" src="https://factordaily.com/wp-content/uploads/2023/08/Background_2-1.webp" alt="" class="wp-image-3366" srcset="https://factordaily.com/wp-content/uploads/2023/08/Background_2-1.webp 2432w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-768x576.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-1536x1152.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-2048x1536.webp 2048w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-1230x923.webp 1230w" sizes="(max-width: 2432px) 100vw, 2432px" /> <img loading="lazy" loading="lazy" decoding="async" src="https://factordaily.com/wp-content/uploads/2023/10/map-mumbai.webp" alt="" class="wp-image-5725"/> The IWF Hotline in India is run in partnership with Aarambh, a Mumbai based NGO. When the hotline began operations in September 2016, it was the first of its kind in India. It remained the only one available to Indians to report CSAM till the government launched a national cybercrime reporting portal in January.IWF is an independent, self-regulatory organisation. It was set up in 1996 by the internet industry to provide an internet Hotline for the public and IT professionals to report potentially criminal online content within their remit and to be the ‘notice and takedown’ body for this content. It works in partnership with the internet industry, police, governments, the education sector, charities across the world.IWF is funded by the EU and member companies from the online industry, including internet service providers (ISPs), mobile operators, content providers, hosting providers, filtering companies, search providers, trade associations and the financial sector. “In 2019, IWF analysts removed 132,700 webpages showing the sexual abuse of children” <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="596" height="486" src="https://factordaily.com/wp-content/uploads/2023/08/01-1-2.webp" alt="Eye on Internet" class="wp-image-3359"/> Before taking action, Chris and his team need to verify two things.First, They check if the video is sexually explicit.“So, well, there was no doubt about the content of the video,” says Chris.Next, they have to verify that it is CSAM. That the girl or/and boy featured in the video are children. This is an important prerequisite — only then can Chris act to get the video removed. Solely going by the video, his team is unable to reliably determine their ages.“If you’re dealing with a three year old or a five year old, verification is not required; it’s obvious,” explains Chris. “But when you’re dealing with late teens, age verification is a crucial part of the jigsaw to enable us to get content removed without being challenged.”By August 2019, when the woman reports the video, she is 25. But, her report mentions that the video was filmed when she was below 18. Any imagery featuring a child is CSAM. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="522" height="462" src="https://factordaily.com/wp-content/uploads/2023/08/02-1.webp" alt="" class="wp-image-3361"/> <img loading="lazy" loading="lazy" decoding="async" width="2432" height="1824" src="https://factordaily.com/wp-content/uploads/2023/08/Background_2-1.webp" alt="" class="wp-image-3366" srcset="https://factordaily.com/wp-content/uploads/2023/08/Background_2-1.webp 2432w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-768x576.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-1536x1152.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-2048x1536.webp 2048w, https://factordaily.com/wp-content/uploads/2023/08/Background_2-1-1230x923.webp 1230w" sizes="(max-width: 2432px) 100vw, 2432px" /> Child sexual abuse (CSA) is criminal offense in most countries. However, the definition of CSA varies in different countries and so does the age of consent to sexual behaviour. In India, an adult’s sexual contact of any kind with a child —a person below the age of 18— is considered CSA. But, it also includes sexual depiction of a child in an electronic form and filming, publishing and even watching such imagery. CSA is illegal in India under various laws. Filming adult sexual activity or distributingit come under various laws in different countries, including the IPC and the IT Act in the Indian law. But, most countries and websites have zero tolerance for CSAM, making its takedown easier, at least, in theory. The work of IWF and Chris’ deals specifically with content that involves children so, Chris’s team, on the same day, contacted the woman, asking for additional information to help verify her age. “Without age verification, we wouldn’t have been able to confirm that this content involved minors. Other agencies that we’d pass the report for content removal would have struggled with age assessment.”– Chris <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="622" height="968" src="https://factordaily.com/wp-content/uploads/2023/08/03-1.webp" alt="" class="wp-image-3363"/> For Naina, this isn’t the first time that this video has found its way on to the internet. Or the first time she is seeking to have it removed.She first learnt that a video of hers was circulating on pornographic websites from an acquaintance in mid-2019.She registered a complaint at the police station, closest to her home in Rajasthan. But, the video remained online, compelling her to file a First Information Report (FIR).FactorDaily has reviewed a copy of the FIR dated June 30, 2019. In it, she writes: “an acquaintance informed me that someone has posted an MMS on porn websites on the internet in my name and in several other names. When I checked it, I found a personal video of mine, which seems to have been filmed when I was still in school; when I was still a minor.”She states that the video was manipulated and edited and then uploaded on the internet. “This was done without my knowledge and without my consent… The said video is uploaded on the internet by some (unknown) person; I don’t know about it. And even today this video is being shared by several people.”She notes her worries about circulation of the video: <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="758" height="1212" src="https://factordaily.com/wp-content/uploads/2023/08/naina-1.webp" alt="" class="wp-image-3365"/> “If the video remains live on the internet, my whole life will be ruined and my family’s reputation will be tarnished. And my entire family would be affected by this. This will also ruin my personal life.”– Naina In the FIR, she seeks that the video be removed from the internet immediately. She also attaches a list of websites on which this video was available. She also urges the authorities to prosecute those who have uploaded the video.In the entire process, she asks that her name not be disclosed, “to protect my and my family’s reputation”.The FIR failed in achieving what Naina sought since the video saw a second outbreak in August 2019 when it turned up on additional websites. Naina and Vicky**, the boy who featured in the video, emailed, with a copy of the FIR, asking the websites to remove the video. But, it didn’t work. This is when Naina reported it on the IWF Hotline. Still, the video remained online.Then, Vicky called Aarambh India, IWF’s portal partner in Mumbai. Siddharth Pillai, who manages the online safety work at Aarambh, took over the case. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1418" height="422" src="https://factordaily.com/wp-content/uploads/2023/08/1-1-1.webp" alt="" class="wp-image-3360" srcset="https://factordaily.com/wp-content/uploads/2023/08/1-1-1.webp 1418w, https://factordaily.com/wp-content/uploads/2023/08/1-1-1-768x229.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/1-1-1-1230x366.webp 1230w" sizes="auto, (max-width: 1418px) 100vw, 1418px" /> Siddharth Meanwhile, Siddharth also received an email from Naina complaining that her request to IWF was not processed. Siddharth flagged the video to IWF. He also checked with IWF on the status of Naina’s report. On August 19, Chris got back, mentioning the issue with age verification.The day after Chris asked for an age verification document, he receives a copy of the FIR from Naina. But, his team can’t verify its authenticity since they can’t read it. It is in Hindi.“We consulted with the victim if they would mind if we forwarded the document for verification to our Indian portal partners (Aarambh). The victim agreed to this,” says Chris.Now, Naina and Vicky inform Siddharth about the existence of the FIR. “This was the first time I came to know that they had earlier filed an FIR and that it was in Hindi. This is what they had emailed to individual websites with takedown requests and probably this is why no website acted on it.”The next day, Siddharth sends an English translation of the FIR to Chris. It ascertains that Naina was born in 1994 (She was 25 when she reported the video). The FIR shows that the police had filed her complaint under Section 67 B of the IT (Amendment) Act 2008, which deals with publishing or transmitting material depicting children in sexually explicit acts in electronic form. This implies that the victims—Naina and Vicky— were children when the video was shot. So, the video is CSAM. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="456" height="548" src="https://factordaily.com/wp-content/uploads/2023/08/fir-1.webp" alt="" class="wp-image-3368" style="object-fit:cover"/> <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="720" height="606" src="https://factordaily.com/wp-content/uploads/2023/08/04-1.webp" alt="URL image" class="wp-image-3353"/> Now, Chris springs into action— he has to have the video removed from the internet.For that, he first needs to find every URL where the video is present. The report from Naina contains one URL. But, what if it’s available on other websites, he thinks.The analysts, who investigated the reported URL, found that the video was accompanied with some tags or keywords. The keywords are baits for the viewer.They often carry descriptions of the video, names (usually pseudonyms) of the people featured in the video, or the city they are in, in an offer of proximity or titillation. Similarly, most adult websites offer the viewer a thumbnail— a photo — of the video’s content. Chris is aware that the same video posted on different websites often uses the same keywords and thumbnail.The search begins.Several analysts in his team, proactively, search for it. “Analysts,” insists Chris. “Plural.” <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1920" height="572" src="https://factordaily.com/wp-content/uploads/2023/08/2-7-1.webp" alt="" class="wp-image-3362" srcset="https://factordaily.com/wp-content/uploads/2023/08/2-7-1.webp 1920w, https://factordaily.com/wp-content/uploads/2023/08/2-7-1-768x229.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/2-7-1-1536x458.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/2-7-1-1230x366.webp 1230w" sizes="auto, (max-width: 1920px) 100vw, 1920px" /> Chris Meanwhile, in Mumbai, Siddharth has taken up searching for the video, independently. Most websites, when they receive complaints from victims that a content is CSAM and/ or is uploaded without the consent of people featured in it, take it off.This is what Siddharth is targeting, in a process parallel to what Chris is doing. With an English translation of the FIR, this might work, he thinks.He is using the same technique of keyword search and reverse image search using the thumbnail. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1920" height="572" src="https://factordaily.com/wp-content/uploads/2023/08/3-1-1.webp" alt="URL image" class="wp-image-3352" srcset="https://factordaily.com/wp-content/uploads/2023/08/3-1-1.webp 1920w, https://factordaily.com/wp-content/uploads/2023/08/3-1-1-768x229.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/3-1-1-1536x458.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/3-1-1-1230x366.webp 1230w" sizes="auto, (max-width: 1920px) 100vw, 1920px" /> Siddharth Chris is right. A lot of websites are using the same thumbnail for this video. His team’s search around keywords locates additional instances of the video. “We traced the content to a number of different locations and certainly on at least 10 separate websites, and the content was actually hosted in four different countries— UK, US, Hungary and the Netherlands.”– Chris “The websites that we found the content on were what most people would classify as legal adult websites,” Chris says. “It’s possible for people to upload content of a minor on even legitimate legal websites, where the website potentially doesn’t know the age of the individuals. And therefore someone has abused the ability to be able to upload content onto a site. In this particular instance, these were relatively mainstream adult websites that the content was posted on.” And, this is why verifying the age of the victims was so crucial to him.Some of these websites are using only the photo (the thumbnail) while others used both the photo and the original video. He often sees manipulation of the original video circulating on several websites. “But in this particular in'
