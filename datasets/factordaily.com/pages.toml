title = "Indian Teens Vent, Stan and Socialise on Discord - Factor Daily"
description = "Headquartered in San Francisco and founded in 2015, Discord is a platform that allows users to build and engage with like-minded members through chat, voice and video channels."
full_description = 'Shadma Shaikh is a technology journalist and cofounder at FactorDaily with a journalism career spanning a decade of covering business, technology and startups with newsrooms like The Economic Times and Deccan Chronicle in the past. Known for her work around internet platforms and digital culture, Shadma is now reimagining storytelling and building new journalistic narratives at FactorDaily. Sixteen-year-old Ashmita (name changed) has had a very difficult year. Buffeted by social anxiety and fear of failure but unable to make her family understand her problems, she had to cry herself to sleep every other night. The COVID19 lockdowns and restrictions ended physical meetings with her peers. A ligament injury in her ankle left her almost bedridden and unable to play badminton, a sport that used to be an outlet for her. Being stuck indoors for months did not help.“You see everywhere people your age are accomplishing so much, and I’m sitting here having a hard time coping with school and life in general,” says Ashmita sobbing in a voice note, the only form of communication she prefers. “There are so many times I didn’t wanna stay alive.”Last month when her smartphone dinged with a notification about an online session with qualified psychotherapist Shanaya Boyce on a Discord server, Ashmita joined with close to a hundred others. In the public group chat, teens like her shed inhibitions and spoke about dealing with loneliness, insecurity, confusion, and suicidal tendencies, while Boyce answered these questions over a voice channel accessible to all listeners.“More than anything else, it helped me tremendously to know I am not alone,” says Ashmita. The session also made her realise that her problems were real and that she needed psychotherapy to deal with them.Ashmita has Discord to thank for helping her find the resources that became her lifeline when she needed them the most. A chat platform that allows communities of teens with similar interests to hang out virtually, Discord started out as a place for gamers to chat but has gone mainstream with teens and the young since April-May 2020.Ashmita says that even though she hasn’t been able to find the courage to open up to a therapist about her problems, she is finding strength in confiding in her sister, something she had a hard time doing earlier. “Earlier, I didn’t even know if my problems were valid,” she says. Knowing that she’s not alone and hearing about people navigating through their own mental health battles and their healing journeys on Discord has helped her in the past few months. <img loading="lazy" loading="lazy" decoding="async" width="1324" height="1000" src="https://factordaily.com/wp-content/uploads/2023/08/laddy_sitting_img.webp" alt="" class="wp-image-1793" srcset="https://factordaily.com/wp-content/uploads/2023/08/laddy_sitting_img.webp 1324w, https://factordaily.com/wp-content/uploads/2023/08/laddy_sitting_img-768x580.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/laddy_sitting_img-1230x929.webp 1230w" sizes="(max-width: 1324px) 100vw, 1324px" /> <img loading="lazy" loading="lazy" decoding="async" width="1112" height="654" src="https://factordaily.com/wp-content/uploads/2023/08/youtube_img.webp" alt="" class="wp-image-1800" srcset="https://factordaily.com/wp-content/uploads/2023/08/youtube_img.webp 1112w, https://factordaily.com/wp-content/uploads/2023/08/youtube_img-768x452.webp 768w" sizes="(max-width: 1112px) 100vw, 1112px" /> Headquartered in San Francisco and founded in 2015, Discord is a platform that allows users to build and engage with like-minded members through chat, voice and video channels. Discord’s Indian members soared after mid-2020 when the first COVID19 lockdown forced students to spend more time online. Some were introduced to it by their gamer friends. Also, artists such as Tanmay Bhat started pushing their audience to their Discord servers around the same time.At the beginning of 2021, Mumbai-based singer and musician Avanti Nagral released her new single Sun toh Lo, a song that highlights Indian society’s dismissive attitude towards the mental health troubles of teenagers. The song hit a nerve. Young people flooded the comment section of her YouTube video with their experiences of loneliness and depression.Soon Nagral started seeing these conversations moving to her Discord server. Discord’s community-building tool has attracted internet artists and creators globally to set up Discord servers as a hangout for their followers. A professional musician who has been a performing artist since she was four, Nagral, 24, has a dual degree from Harvard University and the Berklee School of Music, Boston. She spent the first seven years of her life in the US before her parents moved to Mumbai a little over a decade ago. She has also garnered a large following on YouTube and Instagram in the last few years, making music, education, and mental health content. Nagral has also produced many music albums.Taking these conversations around mental health challenges as a cue, Nagral’s team sprang into action. It started holding events and sessions to make these conversations more meaningful and effective. The session with Boyce that Ashmita joined was hosted on Nagral’s server. Boyce has a master’s degree in clinical psychology and is a practising trauma-informed and queer affirmative therapist. In another freewheeling chat held on Nagral’s Discord server with therapist Prachi Bhatia, a common question troubling most of these young folks seemed to be—How do I convince my parents that I need therapy? <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1264" height="1620" src="https://factordaily.com/wp-content/uploads/2023/08/chat.webp" alt="" class="wp-image-1786" srcset="https://factordaily.com/wp-content/uploads/2023/08/chat.webp 1264w, https://factordaily.com/wp-content/uploads/2023/08/chat-768x984.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/chat-1198x1536.webp 1198w, https://factordaily.com/wp-content/uploads/2023/08/chat-1230x1576.webp 1230w" sizes="auto, (max-width: 1264px) 100vw, 1264px" /> “There’s a huge gap when it comes to having safe spaces for young folks to talk about things openly,” says Nagral, whose content around music and college education has found an audience among teenagers. Whether the questions are around mental health, sexuality, dealing with everyday life, career prospects or just general loneliness, Nagral, whose Harvard degree is in psychology, says that she found her audience having these discussions on her Discord server. Her server has also been a place for discussions on studying abroad, exploring new music artists and holding debates on socially relevant topics. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="328" height="322" src="https://factordaily.com/wp-content/uploads/2023/08/Group-7.webp" alt="" class="wp-image-1936"/> “The fact that people were finding a safe space on the internet–something they can’t find at home–made me realise the power of the community we were building,” says Nagral. Amaan (name changed), also a member of the Nagral’s server on Discord, opened up about struggling with anxiety and depression. People in the server, including Nagral herself, connected him with a list of therapists who could help him out. A first-year business administration student from West Bengal, Amaan joined Discord in July 2020 when a cousin introduced him to the platform to hang out virtually. As a participant of some other music servers on Discord apart from Nagral’s, Amaan says that the community on these servers is very warm and accepting of different people. “From day one, it felt like a room where people understood each other,” says Amaan, adding that the anonymity aspect of the platform definitely helps.Amaan, who joined Discord at a very low point in his life, is thankful to the people on Discord who helped him on his healing journey. “After speaking to countless counsellors and therapists, I gathered the courage to speak to my parents about my struggles with depression,” he said, adding that he’s doing much better overall. # What is Discord and why do teens love it <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="2334" height="1180" src="https://factordaily.com/wp-content/uploads/2023/08/board.webp" alt="" class="wp-image-1785" srcset="https://factordaily.com/wp-content/uploads/2023/08/board.webp 2334w, https://factordaily.com/wp-content/uploads/2023/08/board-768x388.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/board-1536x777.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/board-2048x1035.webp 2048w, https://factordaily.com/wp-content/uploads/2023/08/board-1230x622.webp 1230w" sizes="auto, (max-width: 2334px) 100vw, 2334px" /> <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="854" height="476" src="https://factordaily.com/wp-content/uploads/2023/08/map.webp" alt="" class="wp-image-1795" srcset="https://factordaily.com/wp-content/uploads/2023/08/map.webp 854w, https://factordaily.com/wp-content/uploads/2023/08/map-768x428.webp 768w" sizes="auto, (max-width: 854px) 100vw, 854px" /> It’s highly unlikely you’ve heard of Discord unless you are a hardcore gamer, an urban teenager (or the parent of one) or a super fan of a YouTuber or artist who redirects their audience to their Discord server.A quick poll across three popular Indian servers on Discord gave out the demographics of the users there. While most users in these servers are from Mumbai, Delhi, Bengaluru, Chennai, Pune and Kolkata, there are users from other lower-tier cities such as Lucknow, Indore, Bhopal, Ujjain, Jodhpur, Hathras, Guntur, Patna, Sonipat, Kochi, Ludhiana, Bhubaneswar, Palakkad, Ranchi, Salem, Kolhapur and Aurangabad, among others. Most users spend around two to four hours on the platform and are 14-20 years old. The AvanTribe, Nagral’s server on Discord, which has over 10,000 active members, is a portal to a much larger corner of the Internet that is inhabited mostly by urban and semi-urban Indian teens spending hours every day on the platform—helping a user with the atomic mass of carbon during a parallel online exam, sharing their poetry or a song they wrote after a recent heartbreak, asking for help in a difficult trigonometry problem, discussing career choices in the humanities, exploring scholarship opportunities to study in Harvard, participating in debates, asking questions to queer therapists or venting about their frustrations regarding gender dysphoria, sexuality and individuality. Have Indian teens then found a platform for their social and emotional needs?“Unfortunately, a lot of people don’t take a teenager’s struggles seriously,” says Nagral. Especially during the past year and a half, teenagers whose adult-free socialising was limited to schools and colleges have had a hard time finding an outlet for their emotional needs. Seeking therapy for mental health distress has largely been a western concept for most Indians. But the lasting effect of the pandemic has increased awareness and demand for therapy in the past one and a half years.Many Discord servers inhabited by Indian teens have a channel in which they can vent their feelings—a forum filled with users talking their hearts out over hundreds of messages.Spending a few minutes on some of these servers makes it apparent that these teens, who know each other only by their pseudonyms, find this space to be a judgement-free zone and talk about everything, including toxic relationships, gender dysphoria and suicidal thoughts and are almost always met with kindness and empathy in return.For teenagers, spending time with their friends is very important. But while they can still socialise online, it’s not the same for many of them, says Divija Bhasin, a counselling psychologist with a master’s in clinical psychology.“Many teenagers might feel stuck with their family, especially in cases where they feel that their parents don’t give them space,” says Bhasin. For many teenagers, going out of the house is a way to escape from dysfunctional or toxic families. The pandemic has shut this escape hatch. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="2328" height="2320" src="https://factordaily.com/wp-content/uploads/2023/08/chat_group.webp" alt="" class="wp-image-1826" srcset="https://factordaily.com/wp-content/uploads/2023/08/chat_group.webp 2328w, https://factordaily.com/wp-content/uploads/2023/08/chat_group-768x765.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/chat_group-1536x1531.webp 1536w, https://factordaily.com/wp-content/uploads/2023/08/chat_group-2048x2041.webp 2048w, https://factordaily.com/wp-content/uploads/2023/08/chat_group-1230x1226.webp 1230w" sizes="auto, (max-width: 2328px) 100vw, 2328px" /> <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1405" height="2444" src="https://factordaily.com/wp-content/uploads/2023/08/tablet-chat.webp" alt="" class="wp-image-2170" srcset="https://factordaily.com/wp-content/uploads/2023/08/tablet-chat.webp 1405w, https://factordaily.com/wp-content/uploads/2023/08/tablet-chat-768x1336.webp 768w, https://factordaily.com/wp-content/uploads/2023/08/tablet-chat-883x1536.webp 883w, https://factordaily.com/wp-content/uploads/2023/08/tablet-chat-1177x2048.webp 1177w, https://factordaily.com/wp-content/uploads/2023/08/tablet-chat-1230x2140.webp 1230w" sizes="auto, (max-width: 1405px) 100vw, 1405px" /> For many of these users, though, peer support isn’t why they came to Discord in the first place. While some took to Discord to connect with their gaming friends, others followed their favourite content creators, who were encouraging their followers to sign up on Discord.Tenth grader Shreyas Adsul from Presidency School Bangalore set up a Discord server when the school moved online last year. Setting up a Discord server is like starting a community page on a social media platform. The server creator gets to set the rules on the server, whether a public or private server and set up admins to moderate the discussions on the server.“Most students in my school are active on Discord. We had several groups projects and assignments with short deadlines, and Discord seemed to be the best way to collaborate with large groups because of features like voice channels and streaming,” says Adsul. He adds that he’s also found a bunch of supportive friends in the Discord communities.Apart from self-expression and socialising, teens also use the platform for networking and working up a good resume for their future.Last year, Sriya Mahapatra, an eighth grader from Ranchi, was gearing up for what looked like a terrible year in school, with the lockdown spelling the end of all co-curricular activities. Instead, in the past year and a half, she’s published her own fiction novel, started a podcast and is working with a non-profit organisation—al'
