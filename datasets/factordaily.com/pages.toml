["https://factordaily.com/as-csam-surges-a-new-drive-to-prosecute-offenders"]
title = "As CSAM Surges, A New Drive to Prosecute Offenders - Factor Daily"
description = "What does it take to take down an illegal video clip containing child sexual abuse material from the internet? This is the story of Naina and Vicky and their quest to take down their video clip from the internet."
full_description = "Publishing or Transmission of images of children in sexually explicit act or conduct. Creating, collecting, seeking, browsing, downloading, advertising, promoting, exchanging or distributing CSAM. Cultivating, enticing or inducing children into an online relationship Facilitating the abuse of children online Recording electronically any sexually explicit act with children First conviction: Up to 5 years imprisonment and up to Rs 10 lakh fine. Subsequent conviction: Up to 7 years imprisonment, and up to Rs 10 lakh fine. under IPC section 292, POCSO sections 14,15, IT sections 67,67(A), 67(B), said Dr Balsing Rajput, superintendent of police (cybercrime), Maharashtra, who was heading Operation Blackface until April 2020.Rajput said the NCRB shares the MCMEC data with the state police, which passes it on to district and nodal police departments, which make the arrests. The staggering increase in arrests made under POCSO sections 14 and15 indicates that the underlying problem is much bigger, says Rajput. Such arrests were not possible earlier because Indian police never had access to the platform data.Rajput said that about 90 per cent of the CSAM in India was shared through Facebook and Instagram and in the 140 cases filed in Maharashtra, almost all the content was filmed in India. In November 2019, the Delhi Police, based on tips from NCMEC, arrested six men, including a shopkeeper, an engineering student, a daily wage worker, an automobile firm employee, and even a senior citizen, for sharing CSAM on social media. The Gujarat Police has received 1,066 reports from the Cyber Tipline as of August 2020. FIRS have been filed in 11 cases, while in another 82 cases, applications have been filed for retrieval of evidence. Shamsheer Yousaf is a journalist based in Bengaluru. He has previously worked as a reporter at Mint, Deccan Herald, and The New Indian Express. His work has also been featured in Fountain Ink and Hindustan Times. He is a recipient of the Red Ink Award from the Mumbai Press Club."
