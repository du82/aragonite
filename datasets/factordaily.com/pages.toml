["https://factordaily.com/perpetrators-platforms-processesthe-common-enemies-of-the-indian-online-harassed"]
title = "Perpetrators, platforms, processes:The common enemies of the Indian online harassed - Factor Daily"
description = "Silence is defeat: This story explores a woman's fight to reclaim her dignity in the digital age."
full_description = 'Shamsheer Yousaf is a journalist based in Bengaluru. He has previously worked as a reporter at Mint, Deccan Herald, and The New Indian Express. His work has also been featured in Fountain Ink and Hindustan Times. He is a recipient of the Red Ink Award from the Mumbai Press Club. As online harassment explodes in India, the world’s second largest market of internet users, local police and judiciary struggle with the new-age crime — even if it ends in a suicide Linkan Subudhi was on cloud nine on the morning of May 29, before her political career nosedived.It was the day after the state level conference of the Biju Janata Dal’s (BJD) youth wing at Bhubaneswar. As a general secretary of the youth wing, she had worked hard to launch a campaign to enroll 20 lakh members. Chief Minister Naveen Patnaik inaugurated the drive, and her work was well appreciated.So when Saroj Behera, a reporter from Zee Kalinga called her up around 10 am, Subudhi was quite cheerful.“Linkan Ma’am, I have seen a picture of you on a website.”Subudhi replied with a laugh, thinking he was indulging in some good-natured ribbing.“Okay, there was a party meeting yesterday. You might have seen that picture.”“No, it’s something else. It’s to do with escort services.”“What is this website,” she asked.Behera told her that it was in the personal section of a classifieds website Locanto. He hung up and landed at Subudhi’s house. On a laptop, he showed her the post.The post was featured in the category “Women Looking for Men – Balianta.” Balianta is a suburb on the east of Bhubaneswar, separated from the city centre by the Daya river.The post title summarises a few intimate massage services provided by a 22-year-old “Sex Girl Reema.” Below it is a picture of Subudhi.The setting is a balcony of an apartment with potted plants around her. She’s sitting in profile, wearing a pink cardigan, with her face turned to the camera. Her hands rest on her lap, and she has a faint smile. An innocuous picture, one that could have been used as a profile photo.Below the photo is a message.“Hi myself Reema,” the post begins and states that she is 22 years of age (Subudhi is 33 years old). She’s staying “independently alone in her house,” and she’s available for all types of service.It’s followed by a sexually explicit list of massage services. A mobile number with an appeal to call ‘Reema’ follows. The last line restates her age — 22 years. <img loading="lazy" loading="lazy" decoding="async" width="1608" height="1062" src="https://factordaily.com/wp-content/uploads/2024/06/Subudhi-1-1.webp" alt="" class="wp-image-5971" srcset="https://factordaily.com/wp-content/uploads/2024/06/Subudhi-1-1.webp 1608w, https://factordaily.com/wp-content/uploads/2024/06/Subudhi-1-1-768x507.webp 768w, https://factordaily.com/wp-content/uploads/2024/06/Subudhi-1-1-1536x1014.webp 1536w, https://factordaily.com/wp-content/uploads/2024/06/Subudhi-1-1-1230x812.webp 1230w" sizes="(max-width: 1608px) 100vw, 1608px" />An ad offering sex and massage services under Linkan Subudhi’s name appeared online this summer. Subudhi is General Secretary, Biju Janata Dal (Youth Wing). Photo: Sriram Vittalamurthy Behera told FactorDaily that a friend who frequented online classifieds website like OLX and Quikr came across this post while searching for deals in Bhubaneswar. He recognized Subudhi and forwarded the post to Behera.At the time she saw the post, Subudhi says, she was unaware that she had any detractors. But she suspected that her quick rise in the party had left a few disgruntled.In 2013, Subudhi rose to fame as she nearly died while trying to prevent a child marriage in Noida. She received a call from a girl she taught while volunteering at a slum. The girl asked her to rescue her from a wedding.When she reached the slum, the girl’s mother and a man (who was to marry the minor) attacked Subudhi with sticks and knives. She was hospitalized and received more than 30 stitches on her head. Even today, she suffers headaches from the injuries.The police rescued the girl, and Subudhi moved back to her home state Odisha where she’d become a household name.The reception on her return was rapturous. “She’s our Malala,” says Namrata Chadha, a child rights activist and Subudhi’s mentor, referring to the Pakistani Nobel laureate who was also attacked for her campaign for girls’ education.Chief minister Patnaik was an early champion of Subudhi. He presented to her the Biju Patnaik bravery award, the first in several years.His party, the ruling BJD, gave her a ticket in the Bhubaneswar Municipal Corporation elections. She was in contention for the mayor’s post but lost the election. Then, the party appointed her as a general secretary of the youth wing. They were grooming her for the assembly elections in 2019.“In a very short period, I am at a level which would take most people a decade,” she says.It was likely that someone from the party was responsible for the post on Locanto.There was one glaring clue: the phone number mentioned in the post. When Behera checked the number on Truecaller – a phone app that lets you reverse look-up numbers to names – it revealed a name. Surya.Neither Subudhi nor Behera knew who this person was.Subudhi called Chadha, and they visited Satyabrata Bhoi, the Deputy Commissioner of Police (DCP) Bhubaneswar. She showed him the post. Chadha recalls that the DCP’s approach was “really very good”.Subudhi and Chadha felt that the DCP was aware of similar such cases and within 3-4 minutes, he had a lead. He showed the Facebook profile of a man to Subudhi and said he might be the culprit.Subudhi lodged an FIR and addressed an email with screenshots to the DCP. He told her that the inspector-in-charge of her local police station would contact her.Later in the evening, around 4 pm, Subudhi met Inspector Deepak Kumar Mishra. Together they drafted an email to Locanto’s support email ID informing them of the offending post. “This has defamed her personality and social dignity. This is related to the life and dignity of women(sic)…”.A three-point action plan followed. First, to remove the post including the photograph. Second, to provide details of identifiable information such as IP and MAC addresses of the advertiser. And third, to share details such as date and time of posting, the location of the advertiser, and any information to aid the investigation. The email was sent at 6 pm.By then, Behera had telecast the story on Zee Kalinga, and the story shot to the top of the Odia news cycle. News channels began putting it on scrolling tickers. Subudhi began to receive several calls.Subudhi told them that about the post. “I told them that I needed to fight because there were many similar cases… So many innocent people were being harassed. They don’t even know that they are in a trap. So I want to fight for that,” she says.Subudhi met her advocate, who advised her to let the police continue their investigation. As the day wore on, Subudhi hadn’t spoken to her family. News had reached her village near Puri, and people began calling up her family. “That there is some sex website where Subudhi’s picture is put up. They were scared,” she says.“They called me, but I was in the middle of fighting, finishing the formalities, driving to various offices, documenting all the pictures, and writing emails,” she recalls.As she got back from the advocate’s house at night, she felt broken. “I pulled over, raised the windows of my car, and began crying like hell,” she says.“I remember thinking I may win this fight. But people, who remembered the Subudhi who fought against child marriage and stood in an election; they will now think of her as someone who was on a porn website.” Subudhi’s story is not unique, but an example of a growing new wave of online harassment. The assaulter seeks to punish or take revenge for personal or professional reasons.They use Facebook, Twitter, or a slew of lesser-known sites such as Locanto and Gigololist to harass. They scrape photographs from Facebook, Twitter, or WhatsApp. They post defamatory content by morphing the photo, or they pose as the victim soliciting sex online. In some cases, the harassers also put up phone numbers.Online complaint boards such as consumercomplaints.in are replete with such stories.One victim writes that someone posted pictures of her on Locanto as a 30-year-old widow from Chennai, unable to control her “sexual feelings.” The post also lists her phone number. She complains that several people have called her for “call girl facilities.”Another victim from Bangalore writes about receiving messages from “multiple perverts soliciting sex.” The ad listed her email ID.A woman from Tamil Nadu lodged a police complaint after someone posted her phone number. She asks Locanto to take down the ad and verify phone numbers before posting ads. She says the ad was spoiling her reputation and giving her mental stress.In some cases, the women targeted by these ads are relatives of business rivals. An Odia businessman found a prostitution ad using his wife’s name and Facebook profile photo. The post also listed his mother’s phone number. The ad promised a “safe and high quality service” at their home and a concession to college students.FactorDaily reached out to a few victims. A Chennai businessman recounted an incident involving his cousin and her husband. In early 2015, the husband began receiving phone calls inquiring about charges for his wife. The frequency increased over the next few days.On investigation, they came across a post on Locanto. It was titled “I love to sk big ck” with the husband’s phone number. Despite writing to Locanto, the advertisement remained online for a few months. Meanwhile, the calls increased in frequency. “My cousin is a mother to two college-going children. This was extremely distressing to her,” says the businessman, asking not to be identified. “This also caused a rift in the marriage.”The family suspected a business rival since the phone number was used for business. They suspected a Mumbai-based rival. The Chennai businessman and the husband confronted the rival and warned him to take the post down. Though he denied any involvement, the post was taken down in a few days. The husband stopped receiving calls. But, the Chennai couple did not approach the police. “We did not want the publicity and intrusion that a police investigation would entail,” says the businessman. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="2176" height="1212" src="https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1.webp" alt="" class="wp-image-5972" srcset="https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1.webp 2176w, https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1-768x428.webp 768w, https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1-1536x856.webp 1536w, https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1-2048x1141.webp 2048w, https://factordaily.com/wp-content/uploads/2024/06/linkan5-hr-1-1-1230x685.webp 1230w" sizes="auto, (max-width: 2176px) 100vw, 2176px" />Subudhi took it upon herself to fight and find the person who had posted her image online. What she found shocked her.Photo: Sriram Vittalamurthy Debarati Halder, a law researcher from Ahmedabad, has counselled cybercrime victims for a decade. She says that for most victims, the priority is to take down the content. “Pursuing and prosecuting perpetrators is only a second priority,” she says.Like the Chennai businessman, most victims don’t take the legal route. Primarily, they need to convince the website to remove the content. And for sites based outside India, this is often the only practical route.Take the case of Subudhi, whose picture appeared on a website based in Germany. Locanto does not have any servers in India nor does it have any offices here. So, she wrote an email to Locanto to take down the post. Two days later, it was off the website. Locanto did not respond to an email for comment.Dr. A Nagarathna, who heads the Advanced Centre for Research, Development and Training in Cyber Laws and Forensics at the National Law School India University Bangalore, says many victims attempt this tactic first.Often, victims get police officers or employ lawyers to write to these sites. But there’s no legal weight or force to these requests.“The effectiveness of these methods is completely dependent on how benevolent the website is feeling. At the end of the day, it depends on whether the recipient will respect this request,” says Nagarathna. A few websites have laid out community standards, and users can flag content that breaks them. Facebook, for instance, prohibits bullying, harassment, and credible threats of violence. But Indian law enforcement officials find these standards opaque. A police officer from Tamil Nadu, who works on cybercrime cases, says they are a law unto themselves. “It’s really hard to understand what makes it into their standards, and what doesn’t,” the officer says.Nagarathna says that these standards vary from society to society. “What is decent and moral according to one society may not be the same as another society. Differences in the laws between the service provider’s country and India also play a role,” she says.FactorDaily reached out to Facebook to understand how they handle complaints.Once Facebook receives a complaint, the Community Operations team reviews that content. “Our global team reviews these reports rapidly and will remove the content if there is a violation,” a spokesperson from Facebook says.They claim reports are reviewed 24 hours, seven days a week, and a vast majority of them are reviewed within 24 hours. Facebook says they have real people looking at reported content in more than 40 languages across the world. This includes more than ten in India. “These include native language speakers because we know that it often takes a native speaker to understand the true meaning of words and the context by which they are shared,” the spokesperson says.But language issues still persist. The Tamil Nadu police officer cited several instances when offensive content in Tamil was not taken down soon enough.Facebook has also begun using automation to enforce some of these standards. “After someone reviews and removes a photo or video for nudity or pornography, this system may remove the same photo or video if it surfaces in other places,” the spokesperson adds. Facebook has also introduced new features to prevent people from misusing profile photos.Big Tech companies such as Google, Facebook, and Twitter have realised that they need to tackle these issues head-on.In May this year, after a slew of live streams and videos showed people hurting themselves and others on Facebook, the company has announced that it will be adding 3,000 people to their community operations team. This is in addition to the 4,500 that reviews reports every week.In a post, Facebook CEO Mark Zuckerberg'
author = "Shamsheer Yousaf"
