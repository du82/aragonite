title = "Jayadevan P K, Author at Factor Daily"
full_description = "Journalism serves an important function in today's world. There is clutter and disinformation all around us. My goal is to write stories honestly and help our readers cut through the clutter. Tell it like it is without fear or favour and ask the hard questions that need to be asked. I've always believed in being out there in the trenches, meeting people and writing stories myself. I believe in making clear disclosures when needed. I'm passionate about the business of technology, startups and the intersection of technology and society. I don't own stock in any companies that I write about. My writings for FactorDaily have complete editorial independence, and neither existing and potential investors, nor existing and potential advertisers or partners, have any influence on what I write. Every time I write about companies where Accel or any of our investors have invested, I will make relevant disclosures. At FactorDaily, every time we write about the companies or people who have any direct connection with our investors, we will provide a direct link to the ethics statement and code of conduct."
