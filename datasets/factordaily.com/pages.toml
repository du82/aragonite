description = "With the new story project, Startups and Society, we will investigate and chronicle stories about how entrepreneurship influences society around us. Entrepreneurial journeys are like space missions. They combine bold vision and fearlessness with the drudgery of operations. Add to that the millions of tiny pieces of execution that must work in tandem and exactly as prescribed for a spaceship to land successfully. External and internal factors define a space mission and are sometimes too unpredictable to plan. Remember, though, that the world’s third largest startup ecosystem is littered with failures for every success story. Companies founded by ambitious entrepreneurs that showed early promise impressed angel investors or venture capitalists enough to raise seed or growth capital but got nowhere and disappeared. Entrepreneurial journeys are lonely and ruthlessly demanding. If the startup is bootstrapped, these journeys get even more desolate, and the valleys of death get endlessly long. With this multi-year story project, FactorDaily will bring evidence-based storytelling and explain what it truly means to be a startup founder, employee and the society around them."
