description = "Many legends abound about the monsoon in India — but none so delightful as that around the Jacobin pied cuckoo. A slender black and white cuckoo, the bird is easily identifiable with its long tail and distinctive crest. Even in flight, one can easily spot the bird by the white patches on its wings and […]"
full_description = 'Shamsheer Yousaf is a journalist based in Bengaluru. He has previously worked as a reporter at Mint, Deccan Herald, and The New Indian Express. His work has also been featured in Fountain Ink and Hindustan Times. He is a recipient of the Red Ink Award from the Mumbai Press Club. Many legends abound about the monsoon in India — but none so delightful as that around the Jacobin pied cuckoo. A slender black and white cuckoo, the bird is easily identifiable with its long tail and distinctive crest. Even in flight, one can easily spot the bird by the white patches on its wings and tail edges.More importantly, it has an unmistakable call. Shrill, sharp, and metallic. “Peew Piu Piu…Peew Piu Piu…Peew Piu Piu”. But for many, the cries of the bird, locally known as Chataka, is music to their ears — for it is believed to herald the beginning of the monsoon in India.The bird appears in central and north India by the end of May or early June. The rains can’t be far behind.Indian literature is abound with references to the Chataka and monsoon.So why do the rain clouds follow the Chataka’s cries?The legends have an explanation. The bird cannot quench its thirst from water on the ground in lakes and rivers, as it cannot bend its neck down. The reason being, a hole in its neck forces it to keep its beak upturned at all times to cover it. The beaks of the bird can swallow water only if it falls from the skies.So, for several months, the Chataka lives without water. But once it gets thirsty, it calls out to the clouds for rain. “Peew Piu Piu…Peew Piu Piu…Peew Piu Piu.” The bird is expecting rain any time soon . <img loading="lazy" loading="lazy" decoding="async" width="466" height="504" src="https://factordaily.com/wp-content/uploads/2019/03/piedcuckoo-1920x1029-1.webp" alt="" class="wp-image-5986"/>The classical Sanskrit poet Kalidasa, in his epic poem Meghaduta, recounts the prayer of a pining husband to a passing cloud to take a message to his wife in the Himalayas, The Chataka accompanies him on the journey. <img loading="lazy" loading="lazy" decoding="async" width="754" height="168" src="https://factordaily.com/wp-content/uploads/2024/07/piedcuckoo-text-1920x1029-1.webp" alt="" class="wp-image-5988"/>(O cloud), The wind will be Favorable,Slow and Soft for thee and waft thee ahead.Close on thy left, the chataka or the rain-larkWill sing sweetly Many legends abound about the monsoon in India — but none so delightful as that around the Jacobin pied cuckoo. A slender black and white cuckoo, the bird is easily identifiable with its long tail and distinctive crest. Even in flight, one can easily spot the bird by the white patches on its wings and tail edges. <img loading="lazy" loading="lazy" decoding="async" width="466" height="504" src="https://factordaily.com/wp-content/uploads/2019/03/piedcuckoo-1920x1029-1.webp" alt="" class="wp-image-5986"/>The classical Sanskrit poet Kalidasa, in his epic poem Meghaduta, recounts the prayer of a pining husband to a passing cloud to take a message to his wife in the Himalayas, The Chataka accompanies him on the journey. <img loading="lazy" loading="lazy" decoding="async" width="754" height="168" src="https://factordaily.com/wp-content/uploads/2024/07/piedcuckoo-text-1920x1029-1.webp" alt="" class="wp-image-5988"/>(O cloud), The wind will be Favorable,Slow and Soft for thee and waft thee ahead.Close on thy left, the chataka or the rain-larkWill sing sweetly More importantly, it has an unmistakable call. Shrill, sharp, and metallic. “Peew Piu Piu…Peew Piu Piu…Peew Piu Piu”. But for many, the cries of the bird, locally known as Chataka, is music to their ears — for it is believed to herald the beginning of the monsoon in India.The bird appears in central and north India by the end of May or early June. The rains can’t be far behind.Indian literature is abound with references to the Chataka and monsoon.So why do the rain clouds follow the Chataka’s cries?The legends have an explanation. The bird cannot quench its thirst from water on the ground in lakes and rivers, as it cannot bend its neck down. The reason being, a hole in its neck forces it to keep its beak upturned at all times to cover it. The beaks of the bird can swallow water only if it falls from the skies.So, for several months, the Chataka lives without water. But once it gets thirsty, it calls out to the clouds for rain. “Peew Piu Piu…Peew Piu Piu…Peew Piu Piu.” The bird is expecting rain any time soon . In the Mahabharata, the expectations of a devotee are compared to the eager expectation of rain of the Chataka: Counting Birds in the Sky Is there any truth to the chataka legend? Does the pied cuckoo herald the arrival of the monsoon?A few attempts have been made in the early part of the 20th century to answer this question. In 1928, a paper in the Journal of the Bombay Natural History Society tried but reached no conclusion owing to lack of data.“It is obvious that we need a great deal more information about this bird in India, both to its distribution and its status. It is so common, so easily recognised by its handsome plumage and so conspicuous with its loud calls that much of the required information must be already in the possession of the members of the Society.”For many birders, the pied cuckoo legend has always been intriguing.Suhel Quader, who works at the Nature Conservation Foundation in Bengaluru, has been attempting to study this for almost a decade. Growing up in Hyderabad, he had heard the legend quite often. “I was a young birder, and my mentor would say ‘there’s the pied cuckoo calling’,” he recounts.“And then he would say, ‘I bet within seven days it is going to rain’,” he adds. “I don’t remember now whether those predictions came true, but I thought it would be nice to see if the data actually backs the folklore.”This is where Bird Count India (BCI), co-founded by Quader, comes in. With more than half a million bird lists – 693,256 as of 18 March 2019 – comprising nearly eight million bird sightings, BCI runs India’s largest online wildlife database.The database, running on the global bird sighting platform eBird, has been crowdsourced from a 10,000 strong bird watching community across India — making it one of the most successful cases of citizen science in the country.The idea of BCI goes back to 2007, when Quader was at the National Centre for Biological Sciences (NCBS) in Bangalore. He worked with birdwatchers on a project on migrant birds called MigrantWatch.“We thought let’s try something simple. Just ask people when they first see migrant birds coming in the winter. And the last day they sight birds when they leave in the spring,” says Quader. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="2180" height="1124" src="https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1.webp" alt="" class="wp-image-5946" srcset="https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1.webp 2180w, https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1-768x396.webp 768w, https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1-1536x792.webp 1536w, https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1-2048x1056.webp 2048w, https://factordaily.com/wp-content/uploads/2024/05/birda-img-2-1-1230x634.webp 1230w" sizes="auto, (max-width: 2180px) 100vw, 2180px" /> Volunteers during a bird survey Image: Bird Count India Volunteer Coding, Sighting 1.0 The project ran for about five to six years. While there have been a few ‘crowdsourced’ projects, like the Asian Waterbird census that began in 1987, this was the first one in India that started off using relatively new internet tools.MigrantWatch reached out to people through various birdwatching forums. Initially, the platform was pretty low-tech, but improved quickly. “It went from ‘Okay, email me your sightings’ to a very simple webform in two or three weeks,” says Quader.Birdwatchers who worked in the IT industry were some of the most enthusiastic volunteers. Many from Bengaluru contributed while an engineer from Nagpur built the system that MigrantWatch ran on. “He said that was his contribution and did it for us for free,” says Quader.One of the birds documented by MigrantWatch was the Jacobin pied cuckoo, and this was the first attempt at verifying the folklore. The team looked at how the sightings of the pied cuckoos correlated with the advent of the monsoon. But they suffered from limited data – just 363 sightings were made between 2007 and 2011.This was not enough. Monsoons differ in the time of arrival and strength year to year. And the data they had was not enough to establish the correlation. They would have to wait. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1704" height="1208" src="https://factordaily.com/wp-content/uploads/2024/05/birds-img-3-1.webp" alt="" class="wp-image-5947" srcset="https://factordaily.com/wp-content/uploads/2024/05/birds-img-3-1.webp 1704w, https://factordaily.com/wp-content/uploads/2024/05/birds-img-3-1-768x544.webp 768w, https://factordaily.com/wp-content/uploads/2024/05/birds-img-3-1-1536x1089.webp 1536w, https://factordaily.com/wp-content/uploads/2024/05/birds-img-3-1-1230x872.webp 1230w" sizes="auto, (max-width: 1704px) 100vw, 1704px" />The eBird dashboard By 2013, Quader and his colleagues realised that they needed to think a little bigger as far as MigrantWatch was concerned.First, they needed to look at all birds in the country instead of only migrant birds.Second, they needed to look for a new platform – preferably one which they didn’t have to develop and maintain. A couple of candidates were evaluated, but the most promising was eBird. Developed by the Cornell Lab of Ornithology and the National Audubon Society, eBird gathers in one place all the observations from many birdwatchers, which encapsulates the changes in bird distribution and population in a meaningful way. A year earlier, eBird, which until then was available only in North America, had been opened up to all regions.The team that ran MigrantWatch also wanted the new project to be independent of any single organisation. That was when Bird Count India (BCI) was set up.BCI functions unlike other such projects in that it exists only as a website, run by a couple of passionate birdwatchers. For one, BCI is not a registered organisation. There is one paid position (currently vacant) at the office of the Nature Conservation Foundation in Bengaluru to work on BCI. Quader co-ordinates the project, while simultaneously working on projects on citizen science and public engagement at NCF. India’s contribution to the ebird database is growing at an accelerating pace January 2014 Jan 2014 100,000 November 2015 Nov 2015 2 million January 2017 Jan 2017 5 million May 2018 May 2018 10 million No. of observations Checklists uploaded by Indian birdwatchers since January 2019 77,000 Total Checklists Uploaded ~1200 Avg. Checlists Per Day ~50 Avg. Checklists per hour ~1 Nearly 1 checklist per minute Source: eBIRD A large, orderly gaggle of Birders At the launch, BCI wrote to institutions and organisations, including Facebook groups, Google groups, and Yahoo! Groups, inviting them to be part of the platform, says Quader. “The response was wonderful!”BCI took off in January 2014, and since then its growth has exceeded expectations. Quader says that there has been a massive leap between 2013 and today on what we know about India’s birds in terms of seasonality and abundance.One reason why eBird has taken off is that it makes the core task of birdwatching – the creation of a list of birds sighted – easy. Traditionally, a birdwatcher would jot down the names of the bird she sees in a notebook.What happens to these lists? Sometimes, these checklists are passed on to other birders. In rare circumstances, they make it to bird atlases. But often, these observations just remain in the corner of a cupboard, or in some attic, until they are dusted off again decades later.This is where BCI’s adoption of the eBird platform has made a difference. With eBird, it’s convenient to use the app as a digital notebook. “I confess that for me and my friends who do this (keeping a list) religiously, that’s a part of the attraction,” says Quader. “It is just a very, very convenient tool.”For the first time, bird enthusiasts, conservationists, and researchers in India have access to real time information on not just the distribution of bird species, but also their abundance. Anyone, including enthusiasts, can look at this massive data, and use it for birding. For instance, birdwatchers use eBird to figure out good bird-watching spots. Open the eBird website, and the top locations for sightings in a state or around a city, along with the birds typically seen at that time of the year, can be easily discerned. “Birdwatchers tend to be a bit obsessive. The more obsessive ones among us will look up these birds in our field guides and see what they look like, or download the bird calls from a website to identify them by sound,” says Quader.Work on eBird by BCI began only in the middle of 2013, but in little over five years, through campaigns, bird events, and activities, it has already made India the fourth largest country on the eBird platform. It is just behind Australia with around 800,000 checklists while Canada with around 3.8 million checklists, and the US with nearly 24 million checklists are far ahead. City bird maps But the chataka legend? In 2017, with the widespread adoption of eBird, the BCI decided to have another go at the pied cuckoo legend. Quader’s colleague M D Madhusudan, an ecologist and eBirder, was working on this.“Madhu said that analysis and statistics is all fine, but it’s very dry,” says Quader. “He said let’s try and produce something that anybody can look up and say ‘Wow. I can see the pattern over here’.”So, instead of a formal analysis, they wanted to try something different.Madhusudan set out to work on this. He used data on rainfall between 1981 and 2017 from the Climate Hazards Group InfraRed Precipitation with Station dataset for the monsoon visualisation. He also used publicly available datasets from the Shuttle Radar Topography Mission for topography. For the visualisation, he made use of Google Earth Engine and R, a programming language for statistical modelling.Most importantly, he used the eBird database for data on pied cuckoo sightings. He looked at 8,000 records of the pied cuckoo between 2011 to 2016.All of this was combined to produce this animation. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="580" height="328" src="https://factordaily.com/wp-content/uploads/2024/05/PiedCuckooGIF-1.gif" alt="" class="wp-image-5949"/>Animation by MD Madhusudan for Bird Count India As the animation shows, between 1 April and 31 July, the progress of monsoon and the sightings for pied cuckoo go hand in hand. Before the monsoon, pied cuckoo sightings are restricted to South Indi'
