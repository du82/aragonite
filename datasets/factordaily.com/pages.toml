full_description = '''Pankaj Mishra is a journalist and co-founder of FactorDaily, with a career spanning over two decades and multiple newsrooms, from The Economic Times and Mint to TechCrunch and Times of India. Pankaj sees, hears, and feels stories and then shares them in a way that creates a connection, whether with one person or a wider audience. For Pankaj, one attentive listener is not just a tick mark on the scale of readership but a meaningful connection. "Even one is an audience," he often says, a philosophy that has become the cornerstone of FactorDaily's approach to journalism. Pankaj takes storytelling into physical spaces, creating intimate environments where stories aren't just told; they're experienced. Whether it's a community meetup or a one-on-one session on a train journey, he finds fulfilment in these personal exchanges. His work isn't confined to the written word; it comes alive in sound, audio, and digital spaces, each format offering a different facet of the story.'''
