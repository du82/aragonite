["https://factordaily.com/code-of-conduct"]
title = "Code of Conduct - Factor Daily"
description = "Code of Conduct Last Updated:15th November 2020 FactorDaily is a digitally-native company that aims to redefine storytelling about technology and its intersection with culture and society in India. Online publishing is a fast-paced world where the rules of the game change almost every single day. When it comes to editorial ethics, however, the age-old tenets […]"
full_description = "FactorDaily is a digitally-native company that aims to redefine storytelling about technology and its intersection with culture and society in India. Online publishing is a fast-paced world where the rules of the game change almost every single day.When it comes to editorial ethics, however, the age-old tenets of journalism still hold true. This is especially relevant on the internet where anyone can be a publisher, and the line between who is a journalist and who is not is blurring.In the interest of complete transparency, we are publishing the FactorDaily Code of Ethics or the tenets of our Patra Dharma (Sanskrit for ‘the rules that define our work’) and which will guide our work lives at all times. This document borrows from and is based, in parts, on the Mint Code of Journalistic Conduct and builds on widely-accepted ideas and standards on ethics of other Indian and global newsrooms.This Code is intended to serve as a guideline to our journalists and doesn’t include answers to every single ethical dilemma that may arise. In most cases, if something doesn’t feel right, it probably isn’t, and calls for a discussion with a supervising editor. If you are still unsure, escalate the discussion up to the Editor-in-Chief and/or Chairperson of SourceCode Media Private Ltd, the company that owns FactorDaily.For purposes of wider clarity, we define journalists as anyone in the newsroom who is involved in creating content for FactorDaily — reporters, editors, photographers, videographers, graphic artists, designers, multimedia producers, audience engagement editors etc. We seek to extend this definition to the freelancers and part-time professionals we work with, too, and will flag exceptions. As we grow as a company, we will periodically review and update this Code. All changes will be disclosed as and when that happens. FactorDaily will maintain complete editorial integrity at all times irrespective of topics, companies, brands, or people we cover. Our agenda is simple: we tell stories rooted in facts and nothing more.We will label opinion as such, usually with a disclaimer.Our lead investor is Accel Partners, which also invests in other media and technology companies that we write about regularly. Accel or our other investors will have no influence over our coverage.We maintain a strict separation between advertising and editorial. Our editors, writers, reporters and contributors do not take direction from our advertisers and/or our ad sales and marketing teams about what to write on or the tone, timing or placement of coverage across all platforms where FactorDaily publishes.Periodically, our top editors will regularly interact with executives tasked with business objectives. Such meetings may be strategic in nature, review quarterly targets, cover other business objectives, etc. but will never influence editorial decisions.Branded content or native advertising is commonplace in digital journalism and FactorDaily intends to pursue such opportunities. Our journalists will never be involved in creating such content and we will make sure to label clearly such content so that readers know that it is sponsored content. They may be labelled as sponsored feature, advertorial, advertisement, marketing feature or the like. We will not allow advertising to disguise itself as newsroom-originated, editorial content.From time to time, our editorial staff may get advance access to products, services, websites, features and apps before they are publicly available for the purposes of evaluation for potential coverage. Advance access, and access in general, is not a guarantee of coverage or the tone of coverage. Moreover, the timing of any coverage we do is not influenced by any company we cover. Periodically, however, we may negotiate the timing with a company on a case-by-case basis if it makes sense editorially."
year_published = 2025
