description = "Mental health has slowly made its entry into the vocabulary of urban India but it’s far from the acceptance required to help nearly 14% of the Indian population with mental health issues cope. In this mental health journalism project we look for the questions we should be asking on how we – with our individual biological and psychological make-up –interact with an ever changing society and its culture, discrimination, innovation and evolving semantics. How prepared is our health system to cope with the issue? Are the new rising tech solutions the way forward or are they band-aids on a gaping deficit of mental health experts? The first of the series will explore India’s relationship with screens and what impact these relatively new but needed additions are making to our emotional health and how we can make them work for us."
