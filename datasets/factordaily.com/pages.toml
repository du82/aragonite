["https://factordaily.com/category/internet-culture"]
title = "Internet Culture Archives - Factor Daily"
description = "Globally, humans spend roughly seven hours on screens every day. The blurring lines and frequent transitions between the online and offline world translates to how human beings now perceive, think and act in the real world heavily inspired by their own digital world. The content we consume, the conversations we have with strangers or acquaintances online and the amount of time we spend on these screens largely translates to our thoughts, the effects it has on our mental and physical being, and very often our actions in real life. In a large way online culture has evolved and become a part of our actual real world culture. Through this project, we aim to tell stories that are a part of internet culture and largely affect human society. Internet culture much like actual culture finds diverse and fascinating patterns as we navigate through it. For example, in a country like India where digital literacy is skyrocketing with more than half a billion internet users consuming and creating internet content in multiple regional languages, internet culture is varying, constantly evolving and finding unique trends emerging from different parts of the country. At FactorDaily, through our stories and conversations, we will focus on these pockets of the internet that are interesting, unique and connect the online and offline society."
