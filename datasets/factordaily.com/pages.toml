["https://factordaily.com/meet-indiasgeekiest-couplekiran-jonnalagadda-and-zainab-bawa"]
title = "Meet India’s geekiest couple:Kiran Jonnalagadda and Zainab Bawa - Factor Daily"
description = "Founded by Kiran Jonnalagadda and Zainab Bawa, HasGeek is more than just a tech community. Their story, a blend of technology, activism, and community building has revolutionized the tech ecosystem in India with integrity, innovation, and inclusivity."
full_description = 'Shrabonti Bagchi, Culture Editor at FactorDaily (Feb 2016 - Sep 2017), has been a writer and editor with several mainstream publications such as The Telegraph, DNA, and The Times of India. Over a career spanning over 15 years, she has written about culture, society, entrepreneurship, sustainability, food, and design. She is based in Bengaluru. It’s the company’s sixth anniversary party, and HasGeek House is thrumming with activity, though it’s nowhere near as busy as it’s going to get in a couple of hours. People walk in and out of the small independent house in Bengaluru’s Domlur area that serves as headquarters for HasGeek.On the top floor of the narrow house, in a room carved out of what used to be a terrace, Amelia Andersdotter, a 29-year-old Swedish politician, internet privacy activist and one-time member of the EU parliament, is giving a talk on the Swedish Pirate Party and its tumultuous history. The room is full of geeky men (yes, those stereotypes are unfortunately real, even though one of HasGeek’s co-founders is a woman), and the air is thick with questions about privacy, internet security and the differences between European and Indian privacy laws. The room is full of geeky men, and the air is thick with questions about privacy, internet security and the differences between European and Indian privacy laws. On the ground floor of the house, two-and-a-half-year-old Amal Zaiki, dressed in a frilly pink frock, sits at a worktable and meticulously finishes a bowl of noodles while her mother, Zainab, talks to guests and coordinates food delivery for the party, which is getting larger by the minute. By the time Andersdotter has finished her talk and trooped down along with the audience, the ground floor of the house is full of people — at least a hundred have crammed into the small rooms and more have spilled over onto the stairs, kitchen and garden area. These are all geeks of one colour or the other — startup founders, developers at startups and established tech companies, freelance coders, design students, UI-UX designers, data and security experts, a tech journalist or two… <img loading="lazy" loading="lazy" decoding="async" width="2172" height="1008" src="https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1.webp" alt="" class="wp-image-5907" srcset="https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1.webp 2172w, https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1-768x356.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1-1536x713.webp 1536w, https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1-2048x950.webp 2048w, https://factordaily.com/wp-content/uploads/2024/04/hasgeek_event_1-1-1230x571.webp 1230w" sizes="(max-width: 2172px) 100vw, 2172px" />The audience at MLR Convention hall, Jayanagar, Bengaluru during a HasGeek conference OF CONFERENCES AND CONVERSATIONS But what is HasGeek? Chances are, unless you belong to the communities mentioned above, you’ve not heard of it or its founders, Kiran Jonnalagadda and Zainab Bawa, or have only a sketchy idea of what HasGeek does — like I did till I first met the duo a few months ago.I found out that the bootstrapped company, started in 2010, organises some of the best technology conferences in India, built around themes such as developer operations (Rootconf), front-end engineering and design (Meta Refresh), data and analytics (Fifth Elephant, named after the invisible elephant in Terry Pratchett’s Discworld novels), Javascript (JSFoo), and Android (DroidconIN, part of a worldwide series of conferences focused on the Android ecosystem).There will be two new ones in 2017: one on digital payments (50P Conference) and the other on scientific nutrition and “body hacking” (Kilter Con). There are also many smaller events, usually non-ticketed — hackathons, language-specific seminars, workshops, talks and social-impact events — that are organised or facilitated by the company. There’s an Open House every Friday, with a fridge full of beer and snacks on the table. Techies and other friends of HasGeek can walk in, grab a beer, and hang out with a variety of people with different passions — technology, writing, entrepreneurship; even feminism and social change. Zainab Bawa and Kiran Jonnalagadda at JSFoo, 2016. Zainab Bawa and Kiran Jonnalagadda at JSFoo, 2016. Image: HasGeek <img loading="lazy" loading="lazy" decoding="async" width="1794" height="1184" src="https://factordaily.com/wp-content/uploads/2024/04/Kiran_Zainab_1-1-1.webp" alt="" class="wp-image-5909" srcset="https://factordaily.com/wp-content/uploads/2024/04/Kiran_Zainab_1-1-1.webp 1794w, https://factordaily.com/wp-content/uploads/2024/04/Kiran_Zainab_1-1-1-768x507.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/Kiran_Zainab_1-1-1-1536x1014.webp 1536w, https://factordaily.com/wp-content/uploads/2024/04/Kiran_Zainab_1-1-1-1230x812.webp 1230w" sizes="(max-width: 1794px) 100vw, 1794px" />Image: HasGeek Apart from this, HasGeek also runs a jobs board called HasJob which sees hundreds of companies (mostly startups) and applicants from the tech community across India posting requirements every month.All this is run by Zainab and Kiran with a team of 17 people and an army of volunteers.Running six major, multi-day, curated tech conferences — for which speakers are handpicked by an editorial board, taken through their paces, and rehearsed for at least three days; the entire process overseen by Zainab — is hardly a cakewalk.But, Kiran and Zainab’s achievement and influence are far larger: they help synergise a scattered tech ecosystem without being involved in the business of tech themselves; they bring geeks and tech aficionados together and give them a non-competitive space to talk about things that excite them — the latest programming language or the newest app development platform — and they do this with rigour, efficiency and integrity. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="2176" height="1282" src="https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab-.webp" alt="" class="wp-image-5910" srcset="https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab-.webp 2176w, https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab--768x452.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab--1536x905.webp 1536w, https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab--2048x1207.webp 2048w, https://factordaily.com/wp-content/uploads/2024/04/HasGeek_Hackathon-tab--1230x725.webp 1230w" sizes="auto, (max-width: 2176px) 100vw, 2176px" />Image: HasGeek A midnight Hackathon They have no stake in the entire ecosystem apart from starting conversations, bringing technology solutions to the table, and bringing people who can create great technological change in India together. They earn a living from this, but they have no ambition to discover the next great startup or become a unicorn or get funding for themselves or for other entrepreneurs.“I find engineers at ease in their conferences, and that’s not a trivial thing. There are some conferences where techies are not comfortable. There’s too much marketing talk, the technical quotient is not up there,” says Amod Malviya, co-founder, Udaan, and former CTO of Flipkart, who has attended and spoken at many HasGeek events.“In these conferences, you are judged by the power of your idea, which is different from a networking conference. Even when I was in Flipkart, I didn’t wear the CTO hat; I was just another engineer in a community of engineers. There are many small things they do that make people feel at home, and this shows up in the kind of comfort people have exchanging points of view and ideas,” adds Malviya. HasGeek is gearing up to make its first acquisition — quite an achievement for a small, bootstrapped company within six years of its founding. The company being acquired, Belong, is a neighbourhood communities startup. The year 2017 is slated to be a big one for HasGeek. It’s gearing up to make its first acquisition — quite an achievement for a small, bootstrapped company within six years of its founding. The company being acquired, Belong, is a neighbourhood communities startup founded by Aravind RS and Gaurav Srivastava. HasGeek was looking to build something similar to Belong to facilitate conversations at HasJobs and for speaker-audience interaction. Aravind, who had been a speaker at one of its conferences, was known to Kiran and Zainab. “Acquiring the technology will save us about a year of work,” says Kiran.They are adding a new event to the roster later this month: 50p, a conference on digital payments, which is bound to be super-relevant in the wake of demonetization and increasing government insistence on going cashless.The two also have a very geeky approach to fitness, and have been adherents of the keto diet for over a year now. Not used to doing things by half measures, and big fans of the quantified self, the couple is now organising an event in April around improving one’s body through better nutrition, fitness and habits, called KilterCon. The keto diet will feature in a big way, one assumes. A speaker at the Fifth Elephant, 2016 edition. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1794" height="914" src="https://factordaily.com/wp-content/uploads/2024/04/fifthelephant-stage-1.webp" alt="" class="wp-image-5911" srcset="https://factordaily.com/wp-content/uploads/2024/04/fifthelephant-stage-1.webp 1794w, https://factordaily.com/wp-content/uploads/2024/04/fifthelephant-stage-1-768x391.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/fifthelephant-stage-1-1536x783.webp 1536w, https://factordaily.com/wp-content/uploads/2024/04/fifthelephant-stage-1-1230x627.webp 1230w" sizes="auto, (max-width: 1794px) 100vw, 1794px" /> A participant at the DroidConIn, in 2016. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1798" height="1008" src="https://factordaily.com/wp-content/uploads/2024/04/participant_DroidConIn_2016-1.webp" alt="" class="wp-image-5912" srcset="https://factordaily.com/wp-content/uploads/2024/04/participant_DroidConIn_2016-1.webp 1798w, https://factordaily.com/wp-content/uploads/2024/04/participant_DroidConIn_2016-1-768x431.webp 768w, https://factordaily.com/wp-content/uploads/2024/04/participant_DroidConIn_2016-1-1536x861.webp 1536w, https://factordaily.com/wp-content/uploads/2024/04/participant_DroidConIn_2016-1-1230x690.webp 1230w" sizes="auto, (max-width: 1798px) 100vw, 1798px" />Images: HasGeek All this wouldn’t have happened if two remarkable people from two completely different worlds — one a self-taught coder, a Telugu boy from Bengaluru who dropped out of school; and the other a serious academic from a Muslim business family in Mumbai working on a PhD in the politics of land ownership — hadn’t met in the early 2000s.Those who have known Kiran for a long time marvel at the change in his personality. Known as ‘Jace’ to most people — a contraction of his full name, Kiran Chandra Jonnalagadda, or JC Kiran in school — he was a shy, intensely nerdy kid who loved computers and coding more than being around humans in real life, says Gourav Jaswal, who has known Kiran for 20 years and gave him his first real job as a writer at CHIP magazine. “Do people call him ‘Kiran’ now?” Jaswal sounds mildly surprised. “Back then, everyone used to call him Jace, including his dad. Only his mother and I called him Kiran.” Jaswal is the founder of the Goa-based startup incubator Prototyze.While he was still at school, Kiran hung out with people twice his age on early internet forums such as the bulletin board service (BBS) called CiX. This was perhaps India’s first BBS, started by Open Source evangelist the late Atul Chitnis, who was one of the mainstays of India’s first Free and Open Source conference, FOSS.in (formerly Linux Bangalore). [Read about CiX and how it spawned one of India’s earliest and longest-living mailing lists, SilkList [click here.]Most people who met ‘Jace’ were surprised to find he was actually a young boy. By then he had already developed an abiding love for open source software, and admits that he had a deep disdain for things like marketing and structured companies. “For me, software was the purest thing — and it was ruined by marketing. Windows was an inferior product that had done well because of marketing, and Linux was a superior product that nobody used because it wasn’t marketed,” he says.He has gradually changed his stance on this. “But, at that time, I was in the middle of my rebel’s education, and marketing was a bad word.”Rebel’s education is accurate. In 1998, he dropped out of his pre-university class (or PU; the equivalent of Class 11-12) and made his way to Mumbai. He had written an email to Jaswal, who was the editor of CHIP, saying he wanted to work at the magazine — it was one of the few havens at that time where a geeky kid could hang out with people who spoke the same language — and was with the magazine for over a year, writing and creating technology for it. “CHIP magazine struck a chord with nerdy kids. I used to get 40-100 emails a day, the vast majority from young people, many studying in engineering colleges, who wanted to meet us, talk to us,” recalls Jaswal. “Kiran wrote to me saying, ‘can I come work with you?’ He was the poster child for a computer geek. He might have been below the legal age to work.”Kiran was 17 years old. Nevertheless, he got the job, mainly because Jaswal felt he had “a formidable mind”: “He would write very precisely and with great authority on matters of technology.” A lot of people I respect say he (Kiran) is one of the best technologists they have known — Gourav Jaswal, former editor of CHIP A few months later, his mother called Jaswal and said Kiran hadn’t finished his PU degree and still had a paper to clear and could he please make sure that he came back and took it? Kiran cleared his PU after five attempts and never earned another formal degree in his life, although he was a technology consultant for two educational institutions in later years — the Institute of Bioinformatics in Bengaluru, where he designed the database, wrote most of the code, and built a technology team for the Human Protein Reference Database, and at the Institute of Genetic Medicine at Johns Hopkins University in the US, where he continued the work he had done at the former. Although Zainab doesn’t seem to wear a religious identity on her sleeve, many of her writings over the years reflect her deep introspection over this identity Meanwhile, Zainab was studying in Mumbai, majoring in sociology and anthropology, and simultaneously working as a researcher and activist on issues of urbanism and governance. She worked with Praja Foundation, a non-profit working in the area of accountable governance, in Mumbai on de'
