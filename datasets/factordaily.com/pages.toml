["https://factordaily.com/behind-the-glamour-of-youtube-are-wrung-out-stars"]
title = "Behind the glamour of YouTube are wrung out stars - Factor Daily"
description = "Unveiling the journey through YouTube stardom, this narrative exposes the challenges creators face in maintaining a relentless pace of content creation, combating online harassment, and striving to find equilibrium amid the unpredictable sway of algorithms. It illuminates the unseen hardships lurking behind the digital screen."
full_description = 'Shadma Shaikh is a technology journalist and cofounder at FactorDaily with a journalism career spanning a decade of covering business, technology and startups with newsrooms like The Economic Times and Deccan Chronicle in the past. Known for her work around internet platforms and digital culture, Shadma is now reimagining storytelling and building new journalistic narratives at FactorDaily. Under the funny wrapper, the video tells the story of the pressure YouTubers have to deal with to keep up with the demand for regular content and to stay relevant. “It’s a part of my job to hear people tell me to go kill myself,” says Lilly Singh aka Superwoman, the Canadian-born YouTube star, in one of her videos. With nearly 14.5 million subscribers to her channel, Singh, known to connect with her audience with honesty, was ranked among the top 10 of highest paid YouTubers in 2017.In one of her more popular videos titled The truth about YouTubers in 2017, Singh does a hilarious impression of the struggles of a YouTube star. At the beginning of this video Lilly’s character, a YouTube content creator is frustrated and at her wit’s end to discover the theme for her new weekly video. She explains how YouTube algorithms, which determine the views a creator gets and how much they get paid, keeps changing all the time and is “one big secret”. <img loading="lazy" loading="lazy" decoding="async" width="1744" height="1008" src="https://factordaily.com/wp-content/uploads/2018/11/Lilly-singh-snapshot-1.webp" alt="" class="wp-image-5922" srcset="https://factordaily.com/wp-content/uploads/2018/11/Lilly-singh-snapshot-1.webp 1744w, https://factordaily.com/wp-content/uploads/2018/11/Lilly-singh-snapshot-1-768x444.webp 768w, https://factordaily.com/wp-content/uploads/2018/11/Lilly-singh-snapshot-1-1536x888.webp 1536w, https://factordaily.com/wp-content/uploads/2018/11/Lilly-singh-snapshot-1-1230x711.webp 1230w" sizes="(max-width: 1744px) 100vw, 1744px" />Snapshot of Lilly Singh’s video announcing a break from YouTube It was not surprising then that Singh, who has been on the platform since October 2010, announced last fortnight her decision to take a break from making YouTube videos. In a detailed video posted on her channel ||Superwoman||, Singh tells her followers: “I am mentally, physically, emotionally and spiritually exhausted.” She goes on to add that she feels she could be happier and mentally healthier than her current state.Singh also iterates another fact that hits home in case of many content creators. She talks about the creative fatigue that feels like a constant burden. “The thing about YouTube is, in all its glory, it kind of is a machine and it makes its creators believe that we need to pump out content consistently, even at the cost of our life and mental health and happiness, because if you don’t, then you become irrelevant.” She ends her note with a promise to be back soon.Earlier, this May, lifestyle content creator Alisha Marie, who counts a sizeable 7.5 million followers on her YouTube channel, also felt a creative burnout. In an emotional video, Marie announced to her followers that she’s known she needed this break for a while now but it terrified her. “I used to be so naive,” says Marie, tearing up. “I would see YouTubers stop uploading and I’d be like, ‘Oh shoot, they’re off their game. Let me hustle more.’”Other popular YouTube stars in the West, including, The Dolan Twins and Logan Paul also announced such breaks earlier. Race to the bottom Singh’s and Marie’s videos say a lot about how the decision to take a break from YouTube channels that have made them stars might not have been the easiest for them.But it was only a matter of time, say experts.“We live in times when the culture of hustling and working 18 hours a day is romanticised,” says Pavitra Jayaraman, head of content at WhiteSwan Foundation, an organisation that offers knowledge services in areas of mental health.The foundation that has been working in the area of mental health challenges at the workplace has seen many cases of burnout. And it’s not just limited to internet or movie stars, says Jayaraman.“The concept of downtime does not exist,” she says, pointing to an area of concern for people who have a lot hinging on their virtual presence.Back home, internet stars or famous personalities have also talked about challenges with creating entertaining content on a regular basis.Amit Bhawani, the founder of channel PhoneRadar that has 730,162 subscribers on YouTube (top-ranked individual creators such as Bhuvan Bam’s BB Ki Vines have over 11.2 million subscribers), says that one of the challenges is that you need to don many hats: the creator, accountant, promoter, salesman. And, not to forget: compliance and copyright. <img loading="lazy" loading="lazy" decoding="async" width="1666" height="1004" src="https://factordaily.com/wp-content/uploads/2018/11/Amit-Bhavani.webp" alt="" class="wp-image-5926" srcset="https://factordaily.com/wp-content/uploads/2018/11/Amit-Bhavani.webp 1666w, https://factordaily.com/wp-content/uploads/2018/11/Amit-Bhavani-768x463.webp 768w, https://factordaily.com/wp-content/uploads/2018/11/Amit-Bhavani-1536x926.webp 1536w, https://factordaily.com/wp-content/uploads/2018/11/Amit-Bhavani-1230x741.webp 1230w" sizes="(max-width: 1666px) 100vw, 1666px" />Amit Bhawani, founder of PhoneRadar PhoneRadar’s content that is primarily famous for its gadget reviews falls under a cut-throat competition business. Bhawani says that if he falls sick and can’t post a video for three-four days, it’s not just viewers who notice. YouTube’s algorithms also push the content down in rankings if there’s the slightest drop in consistency.“You cannot afford to fall sick in this business,” says Bhawani. YouTube analytics will tell you how you lost 16% growth on a Sunday when you didn’t post content on your channel. Toll taken by trolls Still, Bhawani is lucky that his content is relatively safe from trolling, unlike political content. Political satirist Akash Banerjee who nearly has quarter a million subscribers on YouTube is like a magnet to criticism and crass comments.Banerjee, formerly a TV newscaster, says he has developed a thick skin. “I take abuse as a compliment. If you are abusing me and asking me to move to Bangladesh instead of giving an argument, clearly you don’t have a comeback and you haven’t been able to call me out.”He, however, adds that he would be lying if he said he is not affected by the feedback he receives – be it in terms of trolling, calling him out or commentary on his content.It’s taken a while to get here, says Banerjee who hosts DeshBhakt on YouTube, admitting he’s not always had this “superman avatar”.While trolling is an altogether different battle, where tools provided by platforms such as Twitter and YouTube come handy, Banerjee says that a YouTube creator has a host of other challenges. There’s a huge set of expectations from followers. E.g.: “Why don’t you make a video on so and so topic?” In reality, no one has the bandwidth to cater to these demands. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1656" height="1008" src="https://factordaily.com/wp-content/uploads/2018/11/kash-Banerjee.webp" alt="" class="wp-image-5927" srcset="https://factordaily.com/wp-content/uploads/2018/11/kash-Banerjee.webp 1656w, https://factordaily.com/wp-content/uploads/2018/11/kash-Banerjee-768x467.webp 768w, https://factordaily.com/wp-content/uploads/2018/11/kash-Banerjee-1536x935.webp 1536w, https://factordaily.com/wp-content/uploads/2018/11/kash-Banerjee-1230x749.webp 1230w" sizes="auto, (max-width: 1656px) 100vw, 1656px" />Akash Banerjee, Political satirist and YouTuber Then, there is the production slickness to be paid attention to. Creating a professional YouTube video is more challenging than creating a video on your phone or on Instagram. As Lilly Singh explains in one of her videos that from deciding a unique, relatable and funny theme to shooting for a 10-minute video over three hours, sometimes all by herself, can be backbreaking.But that’s still nothing compared to what happens after the video is uploaded. “A YouTuber does nothing but monitor how (his or her) video is doing. The analytics on YouTube videos is crazy in its detail: it will tell you how your video is doing at an hour compared to last hour, compared to your last 10 videos, average view time, how many clicks happened on video after three hours, after five hours, average time spent, whether average view time it is going up or down, who is watching, where are they watching from…” by AKASH BANERJEEPolitical Satirist And YouTuber “You don’t need a doctor to tell you that this extremely unhealthy,” he says. He explains a typical day: if your video does well, you are happy. If it didn’t, you start overthinking it: why did it not do well, did I upload at the wrong time, did I not tag it well, was the thumbnail not catchy enough, did I collaborate with the right people…? All this feeds into the question of monetization. Social Irreverence Writer and film producer Nikhil Taneja, who in the past was the head of content and development for Y-Films and writer for Yash Raj Films, says his team was among the earliest to start putting content on YouTube in India.Taneja says that Indian content creators on YouTube introduced a new genre. Taneja is referring to the social commentary on issues like patriarchy, sexism, superstitions, religion, and class stereotypes that opened up for discussion due to the influx of content coming from digital media houses such as ScoopWhoop, TVF, and Buzzfeed among others. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1678" height="1008" src="https://factordaily.com/wp-content/uploads/2018/11/Nikil-taneja.webp" alt="" class="wp-image-5925" style="width:840px;height:auto" srcset="https://factordaily.com/wp-content/uploads/2018/11/Nikil-taneja.webp 1678w, https://factordaily.com/wp-content/uploads/2018/11/Nikil-taneja-768x461.webp 768w, https://factordaily.com/wp-content/uploads/2018/11/Nikil-taneja-1536x923.webp 1536w, https://factordaily.com/wp-content/uploads/2018/11/Nikil-taneja-1230x739.webp 1230w" sizes="auto, (max-width: 1678px) 100vw, 1678px" />Nikhil Taneja, Co-founder of Yuvaa, a Mumbai-based content company In the beginning, when YouTube creators starting putting their takes on social issues or events, there was something about this content that stuck chord with the audience: the risk that movies did not want to take, a certain kind of irreverence, slick quality, and championing for social causes. But in the last two years, it has become a rat race, Taneja says. Marketers and brands have realised that this is the next big thing and everyone wants to do it.It comes with immense pressure, says Taneja. Once you go from your first thousand to million followers, you hardly ever stop, think and reflect on yourself. It leaves you with no time for yourself, he says. Soon you are getting exhausted, your schedules are all over the place, you are doing crash dieting, you don’t have a routine… For bigger internet stars, goal posts are defined by brands or competitors. It’s a maddening race of who’s new video went viral, who got a new Amazon special, who got a new partnership.Taneja says the new generation of creators with Instagram and YouTube channels are young and underprepared to handle the pressures that come with being an internet star. A champion of mental health awareness, Taneja quit his thriving career in February this year at YRF films and took a sabbatical for a couple of months to focus on self-care.“I used to have major anxiety attacks over the minutest things like my Uber not coming on time,” he says. He says it is easier for him to talk about it today than, say, six months ago. He wouldn’t have the courage to talk about his problems earlier because he believed “men don’t do that”.Taneja says he had to unlearn a lot to find mental peace. It is easier for him today to recognise YOLO (you only live once) and FOMO (fear of missing out), and how they can put you through the wringer. Balance is key It’s not that bleak for all YouTubers though. Archana Doshi, the founder of YouTube channel Archana’s Kitchen with a modest 67,190 subscribers, says her experience has been positive. Doshi, a software engineer until 2001 pivoted to become a yoga teacher, before founding Archana’s Kitchen in 2007.The feedback she received from her viewers complimented her style of cooking videos with a personal touch. “Like your mother is sitting with you in the kitchen and instructing you,” says Doshi, talking about her video formats. While she says likes the pressure that comes as a part of her job, it has also helped her stand up to bullies and internet trolls. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1070" height="1288" src="https://factordaily.com/wp-content/uploads/2018/11/Archana-Doshi.webp" alt="" class="wp-image-5924" srcset="https://factordaily.com/wp-content/uploads/2018/11/Archana-Doshi.webp 1070w, https://factordaily.com/wp-content/uploads/2018/11/Archana-Doshi-768x924.webp 768w" sizes="auto, (max-width: 1070px) 100vw, 1070px" />Archana Doshi founder of the channel Archana’s Kitchen Doshi recalls an incident last July when she was accused of plagiarism by a group on Facebook of stealing their “patented pressure cooking technique”. Negative comments on her page deeply affected Doshi. “When someone is trolling you like that, you can’t think straight,” she says, now laughing that someone could claim patenting a pressure cooking technique that’s been used for years.But she’s more equipped to deal with it today. You get calmer with age, says the 41-year-old. Her only concern? The shortening attention span of internet users. Doshi says that her style of videos that come with a personal touch now have to compete against the short catchy videos that do rounds on Instagram.It’s not just YouTube stars that are vulnerable to mental health issues. Teens and young adults who attach their self-worth to their YouTube channels and Instagram profiles are an equal danger.Manoj Sharma, a psychologist at National Institute of Mental Health and Neurosciences (NIMHANS), in Bangalore says that there’s been an alarming uptick in the number of cases reported at SHUT (Service for Healthy Use of Technology) Clinic in NIMHANS where he helps people deal with technology-based addictions. “When we started in 2014, we got 3 to 4 cases per week. Nowadays, we get 8 to 10 cases per week,” he says.There’s a growing demand among younger people to build cool virtual personalities, which many times creates conflict in their minds because they are trying to be something that they are not. Sharma says that among his patients who are addicted to social media a major issue is that they attach a lot of recognition, approval, self-esteem and validation to their online profile and personas. YouTube algorithms There a'
