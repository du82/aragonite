title = "How the fight against child porn took two ordinary men to the internet’s darkest corners - Factor Daily"
description = "In December 22, just before the long Christmas weekend last year, a 25-year-old man from Wandoor, one of several small towns strewn across Malappuram in north Kerala, was arrested by the state police. Kodakkadan Sharaf Ali was in possession of child pornography, a crime that could lead to five years of imprisonment. People have been […]"
full_description = 'Shamsheer Yousaf is a journalist based in Bengaluru. He has previously worked as a reporter at Mint, Deccan Herald, and The New Indian Express. His work has also been featured in Fountain Ink and Hindustan Times. He is a recipient of the Red Ink Award from the Mumbai Press Club. In December 22, just before the long Christmas weekend last year, a 25-year-old man from Wandoor, one of several small towns strewn across Malappuram in north Kerala, was arrested by the state police. Kodakkadan Sharaf Ali was in possession of child pornography, a crime that could lead to five years of imprisonment.People have been arrested for child pornography before, but Ali’s arrest was significant and unusual. He was charged with sharing these images and videos on a private group on the messaging app Telegram.Telegram, a non-profit privacy-focussed app founded in 2013, has seen significant traction for those engaged in nefarious activities. ISIS is using it for propaganda, bookies are using it in IPL, and manipulators are using it to fix markets. And, child abusers to share child pornography.Telegram has become the go-to app for those who want to remain anonymous. Unlike WhatsApp, Telegram accounts can be used without revealing one’s phone number. And everything is encrypted.The Kerala Police were able to ascertain Ali’s identity despite Telegram’s reputation for security. Investigators across the world have been grappling with Telegram. In December 2015, FBI Director James Comey testified that they were unable to decrypt messages used in an attempted terrorist attack in Texas. French investigators could not penetrate ISIS Telegram groups during the Paris attacks of November 2016.Telegram protects users by splitting its decryption keys across different countries. So, court orders from multiple jurisdictions are needed to decrypt messages. On its website, Telegram proudly claims: “To this day, we have disclosed 0 bytes of user data to third parties, including governments.”How was the identity of the Kerala group’s administrator revealed?This is where Jaljith Thottoli and Binu Phalgunan come in, two ordinary citizens zealous about fighting child pornography. Neither are programmers or hackers, but through a deep understanding of Telegram’s strengths and weaknesses and a heavy dollop of social engineering, they laid the perfect trap. In the process, they shed light on the unseemly world of child pornography lurking on Telegram. (In the context of information technology, social engineering involves manipulating people into divulging information.)*** Thottoli, 38, is a freelance medical transcriptionist from Thiruvananthapuram. But social activism is where his heart is. Whether dismantling claims of faith healers, poking fun at religious fundamentalism, talking about sexual abuse, or documenting LGBT romance, Thottoli has been quite opinionated on social issues. <img loading="lazy" loading="lazy" decoding="async" width="1608" height="1608" src="https://factordaily.com/wp-content/uploads/2024/12/image-90.webp" alt="" class="wp-image-6515" srcset="https://factordaily.com/wp-content/uploads/2024/12/image-90.webp 1608w, https://factordaily.com/wp-content/uploads/2024/12/image-90-768x768.webp 768w, https://factordaily.com/wp-content/uploads/2024/12/image-90-1536x1536.webp 1536w, https://factordaily.com/wp-content/uploads/2024/12/image-90-1230x1230.webp 1230w, https://factordaily.com/wp-content/uploads/2024/12/image-90-24x24.webp 24w, https://factordaily.com/wp-content/uploads/2024/12/image-90-48x48.webp 48w, https://factordaily.com/wp-content/uploads/2024/12/image-90-96x96.webp 96w, https://factordaily.com/wp-content/uploads/2024/12/image-90-150x150.webp 150w, https://factordaily.com/wp-content/uploads/2024/12/image-90-300x300.webp 300w" sizes="(max-width: 1608px) 100vw, 1608px" />Jaljith Thottoli, 38, is a freelance medical transcriptionist from Thiruvananthapuram. But social activism is where his heart is. Phalgunan, a 34 year old journalist, is a chief sub-editor with OneIndia Malayalam in Kozhikode, the northern Kerala port town. Over the years, he has written a lot on science, international affairs, and development issues.Thottoli had busted a child pornography ring earlier. In 2015, “somebody messaged anonymously that we had not seen real sexual frustration,” says he. The person also sent him and friends links to two paedophile groups operating on Facebook: Kochu Sundarikal (Little Beauties) and Home Little Angels.Thottoli’s group immediately complained to the cyber cell in Thiruvananthapuram. But, three months later, the cops informed them the admin was in Saudi Arabia – outside their jurisdiction. They shut the page down but couldn’t do anything more.In September, the page resurfaced again. Thottoli filed a case.Around the time, he came in touch with Phalgunan, who was reporting on the case. Over time, the two became friends and spoke about their disgust for child pornography.“Child porn is something that makes me really angry. It was something that we would discuss all the time,” says Phalgunan.Meanwhile, the police waited till the admin of Kochu Sundarikal and Home Little Angels visited Kerala in December 2015. Nine others, too, were arrested in the case.***Thottoli was an early adopter of Telegram in 2014. Despite his familiarity with the platform, the medical transcriptionist was surprised when on November 22, 2017 a friend messaged him about a porn group on Telegram. He told him that there was a channel called Naadan Thundu meant for local porn.“I didn’t know there were porn running on Telegram until I saw this message. I didn’t even know that desi porn was available,” says Thottoli.But Thottoli’s friend had pointed him to it to draw attention to an announcement by the admin of the channel: MLPM with the @awesomekerala username.On November 9, MLPM posted a message to the group. (This and all other chat excerpts in this story have been translated to English from Malayalam.) <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/Group-1000001915.webp" alt="" class="wp-image-7180"/> <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/Group-1000001918.webp" alt="" class="wp-image-7183"/> <img loading="lazy" loading="lazy" decoding="async" src="https://dev.matsio.com/matsio/factordaily.com/wp-content/uploads/2024/12/Group-1000001919.svg" alt="" class="wp-image-7185"/> MLPM was planning to start a new group for paedophiles under the same name — Poombatta (Butterflies). Thottoli immediately decided he was going to do something about it.Once Thottoli received the tip-off about the Poombatta group, he turned to Phalgunan.Like Thottoli, the journalist was surprised about these groups despite being a longtime user of Telegram.A plan began to form. The duo decided that Phalgunan should first try and get into that group. He joined Naadan Thundu. But getting into the child porn group would be harder than anticipated.To understand the difficulty, it’s necessary to understand how groups and channels work on Telegram.A channel is a tool for the creator to broadcast messages to large audiences. The traffic is one-way: a subscriber to a channel cannot post anything on it. Naadan Thundu was a channel run by MLPM. Channels are public, anyone can join by searching for them.Telegram groups, on the other hand, allow two-way communication between members. Like WhatsApp groups. But Telegram groups are more sophisticated, allowing very fine-grained controls. Admins can make a group public, so all someone needs to join is search for it. <img loading="lazy" loading="lazy" decoding="async" width="1598" height="1598" src="https://factordaily.com/wp-content/uploads/2024/12/image-92.webp" alt="" class="wp-image-6518" srcset="https://factordaily.com/wp-content/uploads/2024/12/image-92.webp 1598w, https://factordaily.com/wp-content/uploads/2024/12/image-92-768x768.webp 768w, https://factordaily.com/wp-content/uploads/2024/12/image-92-1536x1536.webp 1536w, https://factordaily.com/wp-content/uploads/2024/12/image-92-1230x1230.webp 1230w, https://factordaily.com/wp-content/uploads/2024/12/image-92-24x24.webp 24w, https://factordaily.com/wp-content/uploads/2024/12/image-92-48x48.webp 48w, https://factordaily.com/wp-content/uploads/2024/12/image-92-96x96.webp 96w, https://factordaily.com/wp-content/uploads/2024/12/image-92-150x150.webp 150w, https://factordaily.com/wp-content/uploads/2024/12/image-92-300x300.webp 300w" sizes="(max-width: 1598px) 100vw, 1598px" />Phalgunan, a 34 year old journalist, is a chief sub-editor with OneIndia Malayalam in Kozhikode. For private groups, an admin has two options. He can add members manually on a case-by-case basis. Or he can create invite links: anyone with the link can join the group.For Poombatta, MLPM used the invite link route. Phalgunan had to figure out a way to get the invite link.*** Using his secondary phone number, Phalgunan set up a new Telegram account. He joined Naadan Thundu. “My first aim was to chat with him (MLPM) to enter the Poombatta group,” he says.The chief sub-editor decided to try an indirect approach.On Naadan Thundu, MLPM announced that he was starting groups for gay sex and wife swapping. Phalgunan would first establish his credentials as someone interested in these groups. Then, he would ask for the link to the child pornography group.On November 21, Phalgunan messaged MLPM privately on Telegram. He gave a fake name, and told him he was interested in the gay sex group. He received a canned response from MLPM detailing who can join and a set of questions on user preferences.After answering them, Phalgunan asks him: “What happened to Poombatta and couple sex?“ An hour later, he adds that he’s “interested in pedo(sic) and wife swapping 😜”.Later in the night, MLPM bites the bait. “Have you shared your wife,” he asks. Phalgunan replies that he hasn’t done that yet.And then complains: “You have not added me to any group yet”.Close to midnight, MLPM again asks: “You are interested in wife swap REALY?(sic)”.Next morning (November 22), Phalgunan replies in the affirmative.Finally, MLPM relents. He sends Phalgunan the link to the Poombatta group. Phalgunan immediately forwards the link to Thottoli.Both Thottoli and Phalgunan joined Poombatta.***What went on in the Poombatta group?“You can’t bear to see anything on it,” says Phalgunan. “It’s hard to look at it… because…you can’t even call it porn. It’s that much….” His voice drops.“It’s a lot of photos of underaged and undressed kids,” says Thottoli. He estimates the group featured around 3,000 pictures and 500-600 videos in six days. The increase in content corresponded to an increase in the number of members.On November 22, when both Phalgunan and Thottoli joined the group, there were 26 members. By the next day, the number increased to 240. By the third day, the number increased to 360. The numbers stabilized after that.The group was obsessed with Indian content. Thottoli says that a large number of the explicit photos were of Indian girls. “I have seen a lot of Malayali girls in that group. If you say, girls, I am not talking about 15 year old girls. I’m talking about children who are less than 10 (years),” he says. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1058" height="1882" src="https://factordaily.com/wp-content/uploads/2024/12/image-96.webp" alt="" class="wp-image-6516" srcset="https://factordaily.com/wp-content/uploads/2024/12/image-96.webp 1058w, https://factordaily.com/wp-content/uploads/2024/12/image-96-768x1366.webp 768w, https://factordaily.com/wp-content/uploads/2024/12/image-96-863x1536.webp 863w" sizes="auto, (max-width: 1058px) 100vw, 1058px" />A conversation in the Poombatta group. <img loading="lazy" loading="lazy" loading="lazy" decoding="async" width="1046" height="1860" src="https://factordaily.com/wp-content/uploads/2024/12/image-97.webp" alt="" class="wp-image-6517" srcset="https://factordaily.com/wp-content/uploads/2024/12/image-97.webp 1046w, https://factordaily.com/wp-content/uploads/2024/12/image-97-768x1366.webp 768w, https://factordaily.com/wp-content/uploads/2024/12/image-97-864x1536.webp 864w" sizes="auto, (max-width: 1046px) 100vw, 1046px" />A screenshot of the group created by MLPM for gay sex. Phalgunan says that there’s a photo of a girl with her legs spread as she’s reading a Malayalam magazine. “There are people who are grooming kids in that fashion,” he adds. Grooming is the process of befriending a child, with the intention of sexually abusing the child.“I am very sure that those kids were groomed. They didn’t have any problem posing like that,” says Thottoli. “ It gives me an impression it might be their father, cousin, uncle…somebody they knew very closely.”Of the videos, Thottoli estimates that close to 90% were from outside India. Most videos were in Spanish: probably from Latin American countries, he says. The legal age of consent is as low as 13 in many Latin American countries and it is 18 in IndiaBut there were Indian videos too. “There was one Indian rape video. A four-year-old kid was raped by two men, and she was crying ‘Amma, Amma’, he says. “You can make out that it is from a southern state.”A large part of the discussion also devolves into abuse by the members. “They would discuss things like how to groom a child and what to do with the child,” says Thottoli. “It was gross.”One user asks if anyone has “done it” with their own children. The same user later claimed that he abused his own daughter.Taking screenshots and screen recordings of these activities took its toll on Phalgunan and Thottoli. Phalgunan says that he couldn’t sleep at night. “It was creating this physical discomfort in me… some days it was really difficult.”“Truth be told… In the end we couldn’t even look at it,” says Thottoli. “Going through that group was a very tough thing… a really tough thing I could not eat for the first three days. At one point, I vomited.”Both Phalgunan and Thottoli are married. The journalist has a seven-year-old daughter, the transcriptionist doesn’t have children.*** The day Thottoli got the link to the group, he filed a complaint with the cyber crime police station at Thiruvananthapuram. He told them about Poombatta and the activity that he saw on the group. They asked him to take all the screenshots necessary and file a written complaint.He went to the police station with printouts of screenshots and gave a written complaint. The same day (November 22), he wrote an email to the IGP (Crime) with the link to the group and attached screenshots and screen recordings. The Protection of Children from Sexual Offences Act (POCSO Act) 2012 addresses sexual abuse and sexual exploitation of children in the physical world. Section 67B of the IT-Act deals with child porn in the digital world.But, deep down, Thottoli knew the culprit was nowhe'
