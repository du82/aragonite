["https://fair.org/author/gregory-shupak"]
title = "Gregory Shupak — FAIR"
description = "Gregory Shupak teaches media studies at the University of Guelph-Humber in Toronto. His book, The Wrong Story: Palestine, Israel and the Media, is published by OR Books."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 20, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Ethnic-Cleansing-Al-Jazeera-Featured-440x264.png" alt="Media Afraid to Call Ethnic Cleansing by Its Name" />Gregory ShupakMedia Afraid to Call Ethnic Cleansing by Its NameOf the articles surveyed on Trump’s plan to ethnically cleanse Gaza, 87% chose not to call it ethnic cleansing. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 24, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/Israel-Protesters-Featured-440x264.jpg" alt="Media Credit Trump for Gaza Truce—Sidelining Palestinian Resistance and Solidarity" />Gregory ShupakMedia Credit Trump for Gaza Truce—Sidelining Palestinian Resistance and SolidarityAn accounting of the ceasefire is incomplete if it excludes how anti-Zionist and anti-imperialist forces in the Middle East thwarted US/Israeli designs. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />December 19, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/12/Syria-WaPo-440x264.png" alt="Syria Is Free, Say Media—But That Shouldn&#8217;t Mean Free of US Occupation" />Gregory ShupakSyria Is Free, Say Media—But That Shouldn’t Mean Free of US OccupationSince the overthrow of the Syrian government, corporate media analysts consistently opted not to call on the US and Israel to end their occupations of and violence toward Syria. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />October 25, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/10/Israel-Missiles-WSJ-440x264.png" alt="Media Hawks Make Case for War Against Iran" />Gregory ShupakMedia Hawks Make Case for War Against IranThe media hawks are flying high, pushing out bellicose rhetoric on the op-ed pages that seems calculated to whip the public into a war-ready frenzy.'
