["https://fair.org/author/elsie-carson-holt"]
title = "Elsie Carson-Holt — FAIR"
description = "Elsie Carson-Holt is a FAIR intern. She graduated from Wheaton College Massachusetts in 2024 with a double major in English and political science, and a minor in journalism. Her work has also appeared in publications such The Boston Globe, LGBTQ Nation and the Indypendent."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />November 15, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/11/Amsterdam-Football-Riot-440x264.png" alt="Media Coverage of Amsterdam Soccer Riot Erases Zionist Hatred and Violence" />Elsie Carson-HoltMedia Coverage of Amsterdam Soccer Riot Erases Zionist Hatred and ViolenceRather than acknowledging that there was ethnic animosity on both sides, some articles about the melee elevated the violence to the level of a “pogrom.” <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />October 16, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/10/60-Minutes-Harris-440x264.png" alt="60 Minutes Pushed Harris Right on Econ, Border, While Ignoring Other Vital Issues" />Elsie Carson-Holt60 Minutes Pushed Harris Right on Econ, Border, While Ignoring Other Vital IssuesBill Whitaker’s questions frequently started from right-wing talking points and assumptions, particularly over immigration and economic policy. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />October 4, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/10/CBS-Coates-Dokoupil-440x264.png" alt="Exposing Bias Against Palestinians, Ta-Nehisi Coates Is Predictably Accused of Bias by CBS" />Elsie Carson-HoltExposing Bias Against Palestinians, Ta-Nehisi Coates Is Predictably Accused of Bias by CBSHost Tony Dokoupil began the interview with an aggressive monologue that effectively dismissed Coates’ and his worldview, painting him as a radical not worth listening to. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />August 22, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/08/Bernie-Sanders-DNC-440x264.png" alt="Sanders&#8217; Convention Speech Attacked by NYT for Advocating Popular Policies" />Elsie Carson-HoltSanders’ Convention Speech Attacked by NYT for Advocating Popular PoliciesThe specific policies the New York Times scolds Bernie Sanders for promoting don’t seem to be particularly unpopular, with moderates or anyone else.'
