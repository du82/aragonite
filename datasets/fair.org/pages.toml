title = "What’s Wrong With the News? — FAIR"
description = "Independent, aggressive and critical media are essential to an informed democracy. But mainstream media are increasingly cozy with the economic and political powers they should be watchdogging. Mergers in the news industry have accelerated, further limiting the spectrum of viewpoints that have access to mass media. With U.S. media outlets overwhelmingly owned by for-profit conglomerates..."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />What’s Wrong With the News?Independent, aggressive and critical media are essential to an informed democracy. But mainstream media are increasingly cozy with the economic and political powers they should be watchdogging. Mergers in the news industry have accelerated, further limiting the spectrum of viewpoints that have access to mass media. With U.S. media outlets overwhelmingly owned by for-profit conglomerates and supported by corporate advertisers, independent journalism is compromised.Ultimately, FAIR believes that structural reform is needed to break up the dominant media conglomerates, establish independent public broadcasting, and promote strong, non-profit alternative sources of information.Check out these links for more of FAIR’s analysis of the media business:Corporate OwnershipAdvertiser InfluenceOfficial AgendasTelecommunications PolicyThe PR IndustryPressure GroupsThe Narrow Range of DebateCensorshipSensationalismSee also FAIR’s Media Literacy Guide: How to Detect Bias in News Media. FAIR’s work is sustained by our generous contributors, who allow us to remain independent. Donate today to be a part of this important mission.'
