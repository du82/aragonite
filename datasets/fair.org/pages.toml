["https://fair.org/author/julie"]
title = "Julie Hollar — FAIR"
description = "Julie Hollar is FAIR’s senior analyst and managing editor. Julie has a Ph.D. in Political Science from the Graduate Center of the City University of New York."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 27, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Donkey-Axios-440x264.jpg" alt="Corporate Media Offer Excuses for &#8216;Powerless&#8217; Democrats" />Julie HollarCorporate Media Offer Excuses for ‘Powerless’ DemocratsIn the face of an authoritarian administrative coup, corporate media give cover to elected representatives whose duty is to uphold the Constitution. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 4, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Musk-Trump-RS-440x264.jpg" alt="As Constitutional Crises Mount, US Press Sleepwalks Into Autocracy" />Julie HollarAs Constitutional Crises Mount, US Press Sleepwalks Into AutocracyThe New York Times and Washington Post largely downplayed the Trump administration’s earth-shattering break from democratic norms. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 29, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/Trump-Impoundment-WaPo-Featured-440x264.png" alt="ACTION ALERT: When Trump Tried to Freeze Federal Funds, WaPo Saw Not Illegality But &#8216;Determination&#8217;" />Julie HollarACTION ALERT: When Trump Tried to Freeze Federal Funds, WaPo Saw Not Illegality But ‘Determination’When Trump usurped Congress’s power of the purse, the Beltway paper declared this “highlights” the administration’s “determination.” <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 22, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/Bezos-Guardian-Featured-440x264.png" alt="As Trump II Begins, Bezos Swaps Scrutiny for &#8216;Storytelling&#8217;" />Julie HollarAs Trump II Begins, Bezos Swaps Scrutiny for ‘Storytelling’The new direction sounds like the Foxification of the Washington Post, a move away from any attempt to hold the powerful to account and toward inexpensive clickbait punditry.'
