["https://fair.org/about-fair/fair-privacy-policy"]
title = "Privacy Policy — FAIR"
description = "Email List Privacy Policy When you subscribe to FAIR’s email list, you will receive a confirmation message from fair@fair.org. You must reply in order to activate your subscription. We will not add you to our list without your confirmation. We will use your email address only to send you FAIR updates, alerts, event announcements and..."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />Privacy PolicyEmail List Privacy Policy When you subscribe to FAIR’s email list, you will receive a confirmation message from fair@fair.org. You must reply in order to activate your subscription. We will not add you to our list without your confirmation. We will use your email address only to send you FAIR updates, alerts, event announcements and occasional fundraising. We will never sell or share your email address with anyone. Unsubscribe at any time via the “unsubscribe” link that will appear at the end of every message you receive from FAIR.FAIR’s Privacy Policy for Subscribers and Website Visitors FAIR is committed to your online privacy. FAIR servers may record the Internet Protocol (IP) address of the computer you are using; the browser software and operating system you use; the date and time you access our site; and the Internet address of the website from which you linked directly to our site.We use this information to measure the number of visitors to the site, to diagnose and correct system errors, and to improve the site and enhance your experience. We delete this information after one month. We do not connect this information to your name or identity. If you have subscribed to FAIR’s email list, are using the same browser and computer, and haven’t cleared cookies from your browser, you won’t be interrupted nearly as often by our “sign up” popup boxes.Transactions and Online Giving All online financial transactions are handled through a service equipped with security measures to ensure the safest transactions possible. These measures will work to protect the loss, misuse and alteration of any data under FAIR’s control.FAIR Store Purchases: When purchasing products or subscriptions to Extra! from the FAIR online store, any financial information you send to us will be saved with our banking records for verification of deposits and handling of refunds only.Online giving: Details of these online donation transactions, including personal information or giving history, will not be shared with any individual or outside organization.Extra! Privacy Policy FAIR well understands how hard it is for public interest groups, with limited resources, to get their message out. Occasionally, we share our list of subscribers to Extra!—our print newsletter—with groups or publications we feel might be of interest to you. If you prefer that your name and address remain confidential, just let us know. To stop getting direct mail altogether go to: https://www.dmachoice.org/register.phpWe always offer you every possible opportunity to opt out of providing personal information. In cases where personal information is needed, e.g. web-based financial transactions, we will always keep this information confidential. FAIR’s work is sustained by our generous contributors, who allow us to remain independent. Donate today to be a part of this important mission.'
