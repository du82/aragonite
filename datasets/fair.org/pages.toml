["https://fair.org/about-fair/staff-biographies"]
title = "Staff, Associates & Board of Directors — FAIR"
description = "FAIR staff are available for speaking engagements on a variety of key media issues. To contact by email: use first initial (no space) last name@fair.org Staff Janine Jackson/Program Director & CounterSpin Producer/Host Janine Jackson is FAIR's program director and and producer/host of FAIR's syndicated weekly radio show CounterSpin. She contributes frequently to FAIR's newsletter Extra!..."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />Staff, Associates & Board of DirectorsFAIR staff are available for speaking engagements on a variety of key media issues. To contact by email: use first initial (no space) last name@fair.org<img decoding="async" class="wp-image-9034144 aligncenter" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2023/06/PXL_20230626_1547115012.jpg" alt="FAIR staff photo" width="661" height="372" />StaffJanine Jackson/Program Director & CounterSpin Producer/Host<img decoding="async" class=" wp-image-9034147 alignright" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2023/06/PXL_20230626_155600953.jpg" alt="" width="138" height="184" />Janine Jackson is FAIR’s program director and and producer/host of FAIR’s syndicated weekly radio show CounterSpin. She contributes frequently to FAIR’s newsletter Extra! and co-edited The FAIR Reader: An Extra! Review of Press and Politics in the ’90s (Westview Press). She has appeared on ABC‘s Nightline and CNN Headline News, among other outlets, and has testified to the Senate Communications Subcommittee on budget reauthorization for the Corporation for Public Broadcasting. Her articles have appeared in various publications, including In These Times and the UAW’s Solidarity, and in books including Civil Rights Since 1787 (New York University Press) and Stop the Next War Now: Effective Responses to Violence and Terrorism (New World Library). Jackson is a graduate of Sarah Lawrence College and has an M.A. in sociology from the New School for Social Research. Jim Naureckas/Editor and Social Media Director<img decoding="async" class=" wp-image-9034148 alignright" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2023/06/PXL_20230626_155659063.jpg" alt="" width="140" height="187" />Jim Naureckas is the editor of FAIR.org, the website of Fairness & Accuracy In Reporting. Since 1990, he has edited Extra!, FAIR’s print publication, now a monthly newsletter. He is the co-author of Way Things Aren’t: Rush Limbaugh’s Reign of Error, and co-editor of The FAIR Reader: An Extra! Review of Press and Politics in the ’90s. Naureckas was born in Libertyville, Illinois, in 1964, and graduated from Stanford University in 1985 with a bachelor’s degree in political science. He has worked as an investigative reporter for the newspaper In These Times, where he covered the Iran/Contra scandal, and was managing editor of the Washington Report on the Hemisphere, a newsletter on Latin America. Since 1997 he has been married to Janine Jackson, FAIR’s program director. You can follow him on Twitter at @JNaureckas Julie Hollar/Senior Analyst<img decoding="async" class=" wp-image-9034149 alignright" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2023/06/PXL_20230626_155503461.jpg" alt="" width="134" height="179" />Julie Hollar was senior analyst for FAIR’s Election Focus 2020 project and Extra!’s managing editor from 2008 to 2014. Julie has a Ph.D. in Political Science from the Graduate Center of the City University of New York. You can follow Julie on Twitter at @HollarJulie. Olivia Riggio/Administrative and Fundraising Director<img decoding="async" class="wp-image-9034146 alignright" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2023/06/PXL_20230626_155400917-1.jpg" alt="" width="132" height="176" />Olivia Riggio became FAIR’s administrative and fundraising director in March 2021. She holds a bachelor’s degree in journalism from Ithaca College and is a former FAIR intern. She is published in outlets including The Indypendent in New York City and KCET in California, along with serving as a guest host for The Indypendent‘s news hour on WBAI 99.5FM in New York. You can follow her on Twitter at @oliviariggio97. AssociatesDeborah Thomas/Publisher Emeritus<img decoding="async" class=" wp-image-5574131 alignright" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2015/07/dthomas3.jpg" alt="" width="146" height="176" />Deborah Thomas was publisher of FAIR for 25 years. The publisher and designer of Grand Street literary journal for ten years, she was art director of Dance Magazine, and worked on a variety of progressive magazines, including Seven Days and The Nation. Book design work has included titles for Simon & Schuster, New Directions, Verso, Overlook Press, Nation Books, Franklin Square Press and Roof Books. She has received the Silver and Gold Folio Awards for Direct Mail, and the Computer Press Awards for Best Newsletter.Jeff Cohen/Founder Emeritus<img decoding="async" class="alignright wp-image-5587713 " src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2017/04/Jeff-Cohen-e1647971704369.jpeg" alt="" width="153" height="192" />Jeff Cohen founded FAIR in 1986 and served as the group’s director for 14 years. He then joined FAIR’s board through 2002. He was founding director of the Park Center for Independent Media at Ithaca College, where he was an associate professor of journalism. He has authored or coauthored five books, including “Cable News Confidential: My Misadventures in Corporate Media.” The book focuses on his years as a TV commentator at CNN, Fox News and MSNBC, and as senior producer of MSNBC’s Phil Donahue primetime show (which was terminated for political reasons three weeks before the Iraq invasion). With Norman Solomon, he coauthored three books: “Adventures in Medialand,” ”Through the Media Looking Glass” and “Wizards of Media Oz.” He also coauthored “The Way Things Aren’t: Rush Limbaugh’s Reign of Error” (with Steve Rendall and Jim Naureckas). His columns have been published online at such websites as CommonDreams, HuffPost and Truthout—and in dozens of dailies, including USA Today, Washington Post, LA Times, Boston Globe, Atlanta Constitution and Miami Herald. He has been a coproducer of such documentary films as “The Corporate Coup d’Etat,” “The Brainwashing of My Dad” and “All Governments Lie: Truth, Deception and the Spirit of I.F. Stone.” In 2011, he cofounded the online activist group RootsAction.org.Alex Noyes/CounterSpin EngineerTyler Wann/CounterSpin TranscriberJoel Kupferman/Legal CounselSharon Adams/Legal Counsel for Intellectual PropertyBoard Of DirectorsWilliam Hoynes/President William Hoynes is professor of sociology at Vassar College and author of several books on media. Karl Grossman/Secretary Karl Grossman is professor of journalism at State University of New York, Old Westbury, an author and documentary film producer.Hollie Ainbinder Hollie Ainbinder is a consultant and former FAIR Development Director.Robin Andersen Robin Anderson teaches Communication and Media Studies at Fordham University and is the Director of the Peace and Justice Studies Program.Robert W. McChesney Robert McChesney is professor at the University of Illinois at Urbana-Champaign and the author or editor of sixteen books. He is the President and co-founder of Free Press, a national media reform organization. FAIR’s work is sustained by our generous contributors, who allow us to remain independent. Donate today to be a part of this important mission.'
