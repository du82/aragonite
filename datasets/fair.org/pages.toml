full_description = '''Posts<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/03/Free-Palestine-Demo-150x150.png" class="" alt="Demonstration in London in support of a free Palestine (Creative Commons photo: Kyle Taylor)" decoding="async" />March 4, 2025Trump’s Protest Threat Reflects Belief That Free Speech Belongs to SomeJim NaureckasTrump has come out with a diktat threatening sanctions against any educational institution that tolerates forbidden demonstrations.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Bezos-Politico-Featured-150x150.png" class="" alt="Politico depiction of Jeff Bezos giving a thumbs up." decoding="async" />February 28, 2025To Cozy Up to Trump, Bezos Banishes Dissent From WaPoPete TuckerAs shocking as Bezos’ groveling is, it’s just the latest in a string of extraordinary favors he’s done for Trump and Elon Musk.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Portia-Allen-Kyle-Featured-150x150.jpg" class="" alt="" decoding="async" />February 28, 2025‘Millionaires, Corporations? They’re Not Going to H&R Block’: CounterSpin interview with Portia Allen-Kyle on tax unfairnessJanine Jackson“It’s these tax-lobbying corporations that have fought so hard to keep taxes complicated and confusing for the rest of us.”<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/EarthRights-Greenpeace-Featured-150x150.png" class="" alt="Water Defender holds up a feather to confront police at Standing Rock." decoding="async" />February 28, 2025Kirk Herbertson on Big Oil’s Lawsuit Against EnvironmentalismCounterSpinFossil fuel corporations’ lawsuits against those who challenge their destruction take aim at our ability to speak out about anything.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Donkey-Axios-150x150.jpg" class="" alt="Fingers pointed at the Democratic donkey: Axios illustration" decoding="async" />February 27, 2025Corporate Media Offer Excuses for ‘Powerless’ DemocratsJulie HollarIn the face of an authoritarian administrative coup, corporate media give cover to elected representatives whose duty is to uphold the Constitution.> More <img style='background-color: #FFFFF;' src="//eadn-wc04-3257648.nxedge.io/wp-content/uploads/2020/11/ExtraLogo-small.png" alt="Extra! the newsletter of FAIR">FAIR’s 4-page, ad-free, newsletter publishes ten times a year bringing you the media analysis and activism that you won’t find anywhere else. Choose a print subscription, a digital PDF edition, or both together.Read all about it! <img style='background-color: ##4E64A0;' src="//eadn-wc04-3257648.nxedge.io/wp-content/uploads/2020/11/CounterSpinLogoHome-small.png" alt="CounterSpin is FAIR's weekly radio show, available on more than 150 noncommercial radio stations and online">CounterSpin, the weekly radio show of FAIR, provides a critical exposé of the corporate news. Produced and hosted by Janine Jackson it is heard on more than 135 noncommercial stations. The current show, back archives and transcripts are available online.Hear all about it!Issues in the NewsElection 2024CoronavirusBlack Lives MatterJoin Our Email Network#mc_embed_signup{background:#fff; clear:left; font:13px Helvetica,Arial,sans-serif; }News analysis and media criticism delivered to your inbox Click here to Subscribe<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2022/06/literacy-guide.png">FAIR posts on Mastodon window.addEventListener("load", () => { mastodonFeedLoad( "https://mastodon.world/api/v1/accounts/109382017017290503/statuses?limit=3", "include-mastodon-feed-67c8675ae865f", { linkTarget: "_self", showPreviewCards: true, excludeConversationStarters: false, content: { hideStatusMeta: false, hideDateTime: false }, images: { preserveImageAspectRatio: false, size: "preview", link: "status", }, text: { boosted: "boosted 🚀", noStatuses: "No statuses availablae", viewOnInstance: "view on instance", showContent: "Show content", permalinkPre: "on", permalinkPost: "", edited: "(edited)", }, localization: { date: { locale: "en-US", options: {}, } } } ); }); Loading Mastodon feed...EZ Home Top #1This is Dynamik Widget Area. You can add content to this area by going to Appearance > Widgets in your WordPress Dashboard and adding new widgets to this area.FAIR Studies <img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Ethnic-Cleansing-Al-Jazeera-Featured-150x150.png" class="" alt="" decoding="async" />February 20, 2025Media Afraid to Call Ethnic Cleansing by Its NameGregory ShupakOf the articles surveyed on Trump’s plan to ethnically cleanse Gaza, 87% chose not to call it ethnic cleansing.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/WaPo-Election-Factcheck-Featured-150x150.png" class="" alt="" decoding="async" />February 13, 2025Deny, Defend, Disinform: Corporate media coverage of healthcare in the 2024 presidential electionsJohn Canham-ClyneCorporate media had a hard time finding “big” plans for healthcare because they chose to look for them only in the two major parties’ platforms.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/Israel-Protesters-Featured-150x150.jpg" class="" alt="Washington Post depiction of protesters in Israel (photo: Heidi Levine/Washington Post)" decoding="async" />January 24, 2025Media Credit Trump for Gaza Truce—Sidelining Palestinian Resistance and SolidarityGregory ShupakAn accounting of the ceasefire is incomplete if it excludes how anti-Zionist and anti-imperialist forces in the Middle East thwarted US/Israeli designs.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/10/60-Minutes-Harris-150x150.png" class="" alt="" decoding="async" />October 16, 202460 Minutes Pushed Harris Right on Econ, Border, While Ignoring Other Vital IssuesElsie Carson-HoltBill Whitaker’s questions frequently started from right-wing talking points and assumptions, particularly over immigration and economic policy.<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/10/NYT-Screams-Online-150x150.png" class="" alt="New York Times: ‘Screams Without Words’: How Hamas Weaponized Sexual Violence on Oct. 7" decoding="async" />October 7, 2024Double Standards and Distortion: How the NYT Misreports Sexual Violence in Israel/PalestineOwen SchachtFrom the beginning, there were serious problems with the claims of mass rape by Hamas. Yet the New York Times devoted significant coverage to promoting that narrative.> MoreFrom the Archive <img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/04/Joseph-Sobran-Horizontal-Crop-150x150.jpg" class="" alt="" decoding="async" />November 1, 1995ACTION ALERT: The Philadelphia Inquirer’s New Spectrum: From Centrism to AntisemitismJim Naureckas<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2002/05/Network-Logos-150x150.jpg" class="" alt="ABC, NBC and CBS logos" decoding="async" />May 1, 2002Power SourcesIna HowardJune 20, 2013NYT Pays Tribute to Hastings by Attacking Him After DeathJim Naureckas<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2014/12/Trujillo-150x150.jpg" class="" alt="Ferguson October, Michael Brown" decoding="async" />December 1, 2014Forgetting FergusonJosmar Trujillo<img width="150" height="150" src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2005/08/Screen-Shot-2024-08-08-at-2.45.52-PM-150x150.png" class="" alt="" decoding="async" />August 1, 2005Where Have All the Bodies Gone?Pat Arnow<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/content-filler.png" class="dynamik-content-filler-img" alt=""