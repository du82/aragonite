title = "Pete Tucker — FAIR"
description = "FAIR is the national progressive media watchdog group, challenging corporate media bias, spin and misinformation."
full_description = '''<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 28, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Bezos-Politico-Featured-440x264.png" alt="To Cozy Up to Trump, Bezos Banishes Dissent From WaPo" />Pete TuckerTo Cozy Up to Trump, Bezos Banishes Dissent From WaPoAs shocking as Bezos’ groveling is, it’s just the latest in a string of extraordinary favors he’s done for Trump and Elon Musk. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 19, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/No-One-Elected-Elon-Musk-Featured-440x264.png" alt="The World’s Richest People Look Out for Each Other:&nbsp;Jeff Bezos&#039;s WaPo won&#039;t run ad critical of Elon Musk" />Pete TuckerThe World’s Richest People Look Out for Each Other: Jeff Bezos's WaPo won't run ad critical of Elon MuskThe Washington Post won’t say why it cancelled a six-figure ad buy calling for Elon Musk to be fired. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 14, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/WaPo-DOGE-Featured-440x264.png" alt="WaPo Provides Cover for Musk&#8217;s Government Takeover" />Pete TuckerWaPo Provides Cover for Musk’s Government TakeoverIt wasn’t just Jeff Bezos’s company that threw Elon Musk a lifeline, but also his newspaper. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 23, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/NYT-Musk-Salute-Featured-440x264.png" alt="Musk&#8217;s Nazi Salute Becomes &#8216;Awkward Gesture&#8217; in &#8216;Exuberant Speech&#8217;" />Pete TuckerMusk’s Nazi Salute Becomes ‘Awkward Gesture’ in ‘Exuberant Speech’There’s something about the start of a Trump presidency that makes grown men do strange things, like heiling Hitler.'''
