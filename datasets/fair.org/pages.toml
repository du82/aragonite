description = "CounterSpin is FAIR’s weekly radio show, hosted by Janine Jackson. It’s heard on more than 150 noncommercial stations across the United States and Canada."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 28, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/EarthRights-Greenpeace-Featured-440x264.png" alt="Kirk Herbertson on Big Oil&#8217;s Lawsuit Against Environmentalism" />CounterSpinKirk Herbertson on Big Oil’s Lawsuit Against EnvironmentalismFossil fuel corporations’ lawsuits against those who challenge their destruction take aim at our ability to speak out about anything. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 21, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/CNN-Gaza-Riviera-Featured-440x264.png" alt="Gregory Shupak on Palestine Ethnic Cleansing, Portia Allen-Kyle on Tax Unfairness" />CounterSpinGregory Shupak on Palestine Ethnic Cleansing, Portia Allen-Kyle on Tax UnfairnessCorporate media can’t bring themselves to call Trump’s illegal, inhumane plan what it is: ethnic cleansing. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 14, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/MLK-NYT-Featured-440x264.jpg" alt="Luke Charles Harris on Critical Race Theory (2021)" />CounterSpinLuke Charles Harris on Critical Race Theory (2021)Corporate news media presented a campaign openly defined as uninterested in truth or humanity as a totally valid, “grassroots” perspective. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 7, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Trans-Rights-Human-Rights-Featured-440x264.jpg" alt="Ezra Young on Trans Rights Law, Anne Sosin on RFK Jr. and Rural Health" />CounterSpinEzra Young on Trans Rights Law, Anne Sosin on RFK Jr. and Rural HealthThe Trump campaign against transgender people lands in an elite media climate in which trans lives have long been deemed “subject to debate.”'
