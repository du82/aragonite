["https://fair.org/author/john-canham-clyne"]
title = "John Canham-Clyne — FAIR"
description = "John Canham-Clyne is an independent investigative reporter based in New Haven, Connecticut. He recently returned to journalism after 26 years as a corporate researcher for the labor movement. He publishes the investigative newsletter Healing and Stealing. LinkedIn: here."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 13, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/WaPo-Election-Factcheck-Featured-440x264.png" alt="Deny, Defend, Disinform:&nbsp;Corporate media coverage of healthcare in the 2024 presidential elections" />John Canham-ClyneDeny, Defend, Disinform: Corporate media coverage of healthcare in the 2024 presidential electionsCorporate media had a hard time finding “big” plans for healthcare because they chose to look for them only in the two major parties’ platforms. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 24, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/01/AI-Insurance-Denial-440x264.jpg" alt="Skip the Last Two Paragraphs—and Other Time-Saving Tips for Healthcare News Consumers" />John Canham-ClyneSkip the Last Two Paragraphs—and Other Time-Saving Tips for Healthcare News ConsumersMedia coverage of private health insurance fails primarily because of an unwillingness to bluntly dismiss meaningless policy solutions. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 16, 2024John Canham-ClyneWhat Is ‘Private Equity,’ Anyway? “Private equity” describes a specific for-profit corporate structure. Private equity firms form discreet “funds,” recruiting rich individuals and institutions to buy in. Funds typically focus on particular industrial sectors or types of investments. Investors’ money is locked up for a period of time, with significant penalties for early withdrawal. Private equity firms make their […] <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 16, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/01/Private-Equity-Collage-440x264.png" alt="Private Equity &#8216;Takeover&#8217; Is Not Driving Healthcare Crisis" />John Canham-ClynePrivate Equity ‘Takeover’ Is Not Driving Healthcare CrisisMedia focus on one form of for-profit ownership will do nothing to restrain extreme US healthcare costs or expand access to healthcare.'
