["https://fair.org/author/jim"]
title = "Jim Naureckas — FAIR"
description = "Jim Naureckas is the editor of FAIR.org, and has edited FAIR's print publication Extra! since 1990. He is the co-author of The Way Things Aren’t: Rush Limbaugh’s Reign of Error, and co-editor of The FAIR Reader. He was an investigative reporter for In These Times and managing editor of the Washington Report on the Hemisphere. Born in Libertyville, Illinois, he has a poli sci degree from Stanford. Since 1997 he has been married to Janine Jackson, FAIR’s program director."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />March 4, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/03/Free-Palestine-Demo-440x264.png" alt="Trump&#8217;s Protest Threat Reflects Belief That Free Speech Belongs to Some" />Jim NaureckasTrump’s Protest Threat Reflects Belief That Free Speech Belongs to SomeTrump has come out with a diktat threatening sanctions against any educational institution that tolerates forbidden demonstrations. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />February 1, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/02/Trump-McDonalds-Featured-440x264.png" alt="With Zero Evidence, NPR Suggests Trump May &#8216;Work for Working Class&#8217; in Second Term" />Jim NaureckasWith Zero Evidence, NPR Suggests Trump May ‘Work for Working Class’ in Second TermNPR’s evidence that Trump is a “populist”—or at least has a populist lurking inside him—is remarkably thin. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />January 15, 2025<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2025/01/RIP-Washington-Post-Featured-440x264.png" alt="ACTIVISM UPDATE: Responses Show WaPo Is Hearing From Its Critics " />Jim NaureckasACTIVISM UPDATE: Responses Show WaPo Is Hearing From Its Critics Washington Post editors may not be backing down, but they are hearing you. <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />December 27, 2024<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2024/12/Most-Read-Featured-440x264.png" alt="Most-Read FAIR Posts of 2024" />Jim NaureckasMost-Read FAIR Posts of 2024Here’s the ten posts from 2024 that got the most views on FAIR.org.'
