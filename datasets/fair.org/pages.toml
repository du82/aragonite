full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />April 1, 2007<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/uploads/2007/04/Leija-440x264.jpg" alt="From Self-Censorship to Official Censorship" />Pat ArnowFrom Self-Censorship to Official Censorship This photo of mortally wounded Sgt. Hector Leija, taken by Robert Nickelsberg, was pulled from the New York Times website after being called “offensive” and contrary to new censorship regulations by a U.S. military official. A letter in February to the New York Times (2/3/07) from the commander of the Multinational Corps in Iraq […] <img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />August 1, 2005Pat ArnowWhere Have All the Bodies Gone?In a week in June when 15 GIs were killed in Iraq (6/13-19/05), the war pictures in the New York Times (6/19/05, 6/20/05) featured dazed Iraqis after a suicide bombing, a Marine patrolling, the twisted remains of a vehicle, wounded children, a civilian casualty in a morgue. No photographs featured American casualties—a typical absence in […]'
