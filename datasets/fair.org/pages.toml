["https://fair.org/about-fair"]
title = "About/Mission Statement — FAIR"
description = "FAIR, the national media watch group, has been offering well-documented criticism of media bias and censorship since 1986. We work to invigorate the First Amendment by advocating for greater diversity in the press and by scrutinizing media practices that marginalize public interest, minority and dissenting viewpoints. As an anti-censorship organization, we expose neglected news stories..."
full_description = '<img src="https://eadn-wc04-3257648.nxedge.io/wp-content/themes/dynamik-gen/images/post-formats/default.png" class="post-format-image" alt="post" />About/Mission StatementFAIR, the national media watch group, has been offering well-documented criticism of media bias and censorship since 1986. We work to invigorate the First Amendment by advocating for greater diversity in the press and by scrutinizing media practices that marginalize public interest, minority and dissenting viewpoints. As an anti-censorship organization, we expose neglected news stories and defend working journalists when they are muzzled. As a progressive group, FAIR believes that structural reform is ultimately needed to break up the dominant media conglomerates, establish independent public broadcasting and promote strong non-profit sources of information.Uniquely, FAIR works with both activists and journalists. We maintain a regular dialogue with reporters at news outlets across the country, providing constructive critiques when called for and applauding exceptional, hard-hitting journalism. We also encourage the public to contact media with their concerns, to become media activists rather than passive consumers of news.FAIR publishes Extra!, the newsletter of media criticism, and produces the weekly radio program CounterSpin, the show that brings you the news behind the headlines. In addition, FAIR’s thriving email list distributes articles and Action Alerts to our international network of over 20,000 activists. Sign up today!For an in-depth explanation of FAIR’s critique of the mainstream media, you should start with our overview, What’s Wrong with the News? You might also check out the article What’s FAIR?, by FAIR founder Jeff Cohen. See what journalists, activists and scholars have to say about FAIR.Fairness & Accuracy In Reporting, Inc. (FAIR) is a registered 501(c)(3) non-profit organization. FAIR’s federal tax-exempt I.D. number is 13-3392362. Donations to FAIR are tax-deductible. FAIR’s work is sustained by our generous contributors, who allow us to remain independent. Donate today to be a part of this important mission.'
author = ""
year_published = 2023
year_updated = 2023
