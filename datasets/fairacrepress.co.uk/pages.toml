["https://fairacrepress.co.uk/about"]
title = "About | Fair Acre Press"
description = "Fair Acre Press is an independent publishing house, committed to publishing high quality books and pamphlets that are good to hold, touch, look at and read; books that will call out to you – over a…"
full_description = "AboutFair Acre Pressis an independent publishing house, committed to publishing high quality books and pamphlets that are good to hold, touch, look at and read; books that will call out to you – over and over again. Publication is by invitation only. Scroll down to read about our editor Nadia KingsleyContact Nadia: on [email protected] – for press enquiries, review copies, author interviews etcIn 2021:To come is a book by Selima Hill and Tim Nicholson, and pamphlets by Selima Hill We have published:A Spell in the Woods by Stella Wulf – a poetry and art pamphletWoods River Road by John Sewell – a poetry collection endorsed by John BurnsideFan-peckled by Jean Atkin and Katy Alston – a poetry and art pamphlet on 12 old Shropshire words endorsed by Katherine Swift and Nancy CampbellRescue from the Dark by Paul Francis – a poetry collection based on news and photos from the guardian newspaper and endorsed by Emma Purshouse and Tom SastryGreat Master/small boy by Liz Lefroy – a poetry pamphlet about searching for Beethoven in Bonn and Vienna with her son and endorsed by John Suchet and Andrew McMillanChanging Places by Carl Tomlinson – a poetry pamphlet about loss of family and farming heritage, endorsed by Helen Mort, Di Slaney and Charles Foster Run Workshops:Vegetation Verse by Steph Morris – a 2 saturday morning course in May Hosted Zoom events:with Jean Atkin, Katy Alston, Steve Griffiths, John Sewell, Carl Tomlinson, Helen Mort, Alan Buckley, Charles Foster, Paul Francis, Emma Purshouse, John Mills, Stella Wulf. These can be seen on the Fair Acre Press youtube channelIn 2020:We have published:These Are The Hands NHS Poetry Anthology co-edited by Dr Katie Amiel and Deborah Alma, reviewed in the guardian, The Nursing Times, The Psychologist, Oxford Poetry Library, Atrium, Write out Loud and others and endorsed by Stephen Fry, Adam Kay, Simon Armitage and others ‘This is the writing wing of the NHS. This is where the open heart surgery is. What a beautiful operation. Read on’ ~ Lemn SissayBurke and Hare by Tom Wentworth – a play with 4 and 5 star reviews in the national newspapersEnsured that I Once Knew A Poem Who Wore A Hat by Emma Purshouse and Catharine Pascall Moore remains in print; having won the International Rubery Award for Poetry ‘Emma’s poems are full of life and laughs, bubbling with music and wisdom and silliness and jokes and cute animals. She’s a great performer of her work and the book is crammed with tips to help the reader become a performer too’ ~ A.F.HarroldUpdrafts by Steve Griffiths a poetry pamphlet endorsed by Jean Atkin and Nicholas MurrayPlease don’t trample us; we are trying to grow! by Steph Morris – a poetry pamphlet endorsed by Daljit Nagra, Jacqueline Saphra, Tamar Yoseloff and David ConstantineNo Guiding Star by John Mills – a poetry pamphlet about Parkinson’s disease and about life , endorsed by Helen Mort, Clare Shaw and James Sheard Started The Word Bin PODCAST – with over 100 recorded episodes – this can be found on itunes and most podcast apps with people from around the world saying what word they would like to bin and why Run Umbrella – An Arts Council England-supported project involving Paul Kielty, Derwen College, Qube gallery and animation.In 2019:We have published:Aeschylus’ PERSIANS by Kaite O’Reilly, winner of the Ted Hughes Award for new works in Poetry Persians is a beautifully poetic version of Aeschylus’ tragic play. Kaite O’Reilly’s masterly retelling of this 2,500 year old story focuses on how war destroys people’s identity and her use of language is contemporary but never loses any of the historical context ~ The Poetry SocietyWindy Old Fossils by Tom Wentworth Tom’s a generous writer. In Windy Old Fossils he gives the actors lines they can ring every drop of comedy and tragedy from ~ Elizabeth FreestoneFrom Rowan Ridge by Chris Kinsey I thoroughly recommend From Rowan Ridge, a celebration of a poet’s endless curiosity, yet a book with an inescapable bittersweet quality ~ Robert MinhinnickMy Darling Derry by Sally Festing Unafraid of emotion, she confronts reality squarely, marvelling equally at its beauty and its pain ~ Helena NelsonIn 2018We have published:#MeToo – rallying against sexual assault and harassment, a women’s poetry anthology. Edited by Deborah Alma. Foreword by Jess Phillips MPWinner of the Saboteur Awards DIVERSIFLY – new poetry and art on Britain’s Urban Birds. Edited by Nadia Kingsley. Foreword by Brett WestwoodLonglisted in the Saboteur awards 2018 in the BEST ANTHOLOGY categoryThe Goldsmith’s Apprentice by Keith Chandler – wonderfully endorsed by Prof. David Morley and Jonathan Edwards“The Goldsmith’s Apprentice is a triumph; an absorbing and impactful collection of heartfelt poems…”The last of the light is not the last of the light by David Calcutt“This is a collection full of grace, at once deeply authentic and heart-felt.”Matt Hazard: Return of the Naive – a Paul “kieltyascharged” Kielty book of cartoons“Matt Hazard comes from way out on the left field, and bounces off the walls on his way in, and I laughed out loud frequently!”Nadia Kingsley:is one of 4 visual artists, and project managing, an Arts Council England-funded project “Painting by Pixels” that culminates in an exhibition at Qube gallery, Oswestry, Shropshire in August 2018is one of many poets and artists collaborating and showing work at VAN gallery, Shrewsbury in March/April 2018will appear in 2 events at Saboteur Awards festival day on May 19th – on #MeToo and DIVERSIFLY booksis giving a talk to the Bridgnorth Naturalists on April 10thwill support the #MeToo launch in International Women’s Day week, and at festivals and events through 2018In 2017we published:Beyond Spring – Wanderings though Nature – a gorgeous nature writing book, by author and broadcaster Matthew OatesBeyond Spring is one of five books shortlisted in the BBC Countryfile magazine awards for BEST COUNTRY BOOK OF THE YEARIt is on THE GUARDIAN’s “Best Nature Books of 2017” listwe also:ran a successful Kickstarter campaign – to raise funds for the printing of Matthew’s bookran an Arts Council England-funded project on DIVERSIFLY/ Urban Birds In 2016we published three books:a children’s poetry book – I once knew a poem who wore a Hat – by Emma Purshouse and Catharine Pascall Moore that won the Rubery Award for Poetrya novel – Sitting Ducks – by Lisa Blower – that is shortlisted for the Arnold Bennet Literary Fellowship Awarda wildlife photography book – Wilderland: wildlife and wonder from the Shropshire Borders – by Andrew Fusek Peters – which attracted excellent reviews including a five star review from Amateur Photographer magazine.plus found, published, and launched our 2 Poetry Pamphlet competition winners, Shauna Robertson and Jill Munro – at Wenlock Poetry Festival – alongside judge, Costa-winner Jonathan Edwards We are interested in:Science, the Natural World generally, Shropshire in particular Poetry, prose, photography, art, craft, cartoons, challenging ourselves with new genres and projects Finding new audiences and giving those audiences something new Collaborations – between Sciences and Arts, and between the different genres within the Arts Making podcasts As previously stated – publication is by invitation only. This means there is no submissions process other than when we are running specific projects. We are proud to be a member of the Independent Publishers GuildYou can read Nadia’s answers in their Meet the Members section here Zest Press is an Imprint of Fair Acre Press.Zest Press supports authors in bringing their quality writing and projects to print.This is a small venture which is increasingly being sidelined by time constraints because of Fair Acre Press’ endeavours and activities, but if you are interested in paying for Nadia’s expertise in getting your book into print; without marketing or post-publication support please do email Nadia at [email protected] and she will see if she can help. About Nadia Kingsley PODCAST:I am the creator and producer of The Word Bin podcastPOETRY:I have had poetry published in magazines and anthologies, plus have three poetry pamphlets in print, and have been placed in poetry competitions.I wrote a poem a month about a specified herb for medical herbalist Jayne Palmer’s herbal blog since January 2015 for two years – and which culminated in A Year in Herbs: a collaborative pamphlet with Jayne’s edited blogs, Nadia’s improved poems with12 friends and family’s artworksI have read poetry at Stratford Literary Festival, Wenlock Poetry Festival (including the ‘Ones to Watch’ event curated by Jacob Sam-La Rose), Ted Hughes Festival, around the West Midlands, Knighton’s Poetry Marathon in aid of refugees, as guest poet at a fundraiser for Cuan Wildlife Rescue Centre, at Shropshire Wildlife Trust’s Merefest, at Birmingham Literature Festival.I co-wrote poems, and performed in e-x-p-a-n-d-i-n-g: The History of the Universe in 45 minutes (see below). We also performed parts of this on stage with the Greenwich Observatory’s Public Astronomer Dr Marek Kukula, at Stratford Literary Festival 2016In 2017 I was guest poet at the Cuan Wildlife Rescue Centre fundraiser, Wenlock Pottery, Shropshire in June alongside Keith Chandler and Chris Kinsey. I read at Bridgnorth Writer’s group day of poetry and music, alongside David Calcutt and Keith Chandler.On September 9th 2017 I will read at a Refugee fundraising event at Knighton, Shropshire.In 2017 I wrote poems for specific events – including Charles Darwin related poems for Merefest, and Cuan Wildlife Rescue Centre poems based on their workers’ ‘adventures’ and a guided visit.In 2017 two of my herb poems were published in The Physic Garden, edited by Adam HorovitzPROJECT MANAGER:I project managed Shropshire Butterflies – a poetic and artistic guide to the butterflies of Shropshire – including involving 67 contributors: ecologists, nature writers, poets, artists; organising several group performances, an art exhibition, and a poetry and butterfly walk at Dudmaston Hall.I project managed, co-wrote, and performed e-x-p-a-n-d-i-n-g: the history of the Universe in 45 minutes at festivals such as Birmingham Literature Festival, Stratford Literary Festival, Birmingham Art & Science Festival, Wenlock Poetry Festival.I project managed, presented podcasts and wrote for the Maligned Species project.I am programme directing ten hours of nature and poetry in the Speaking of Nature tent at MEREFEST, Ellesmere, Shropshire on September 16th 2017I project managed a podcast and poetry & art book project DIVERSIFLY/Urban Birds project – supported with public funding through Arts Council EnglandI project managed and made art and co-ran workshops with Paul Kielty in a digital art project Painting By Pixels – supported with public funding through Arts Council EnglandI project managed Umbrella – an animation project – with lead artist Paul Kielty – supported with public funding through Arts Council EnglandSHORT STORIES:I have written a short story for Literary Salmon’s debut short story collection The Casual Electrocution of Strangers which can be dowloaded for free here.I have short stories that have been placed and have won competitions. Two were recorded by short story radio: Shopping List; After the Tone – you can listen to these on this page. (see right hand side)In 2016, I, and others wrote a short story a month, on a given prompt. The project was called ‘Prompted Tales’ and was run by Alex Townley – My stories are hereART:I have had ceramics, sculpture, photography and a textile installation exhibited in London, Brighton, Birmingham, the Cotswolds and Wolverhampton.BA (Hons) ceramics, 2:1 from University of WolverhamptonSCIENCE:A’levels in Maths, Chemistry & BiologyMBBS from King’s College London, MRCGPI work as a GPOTHER:I have been invited on panels at Writing West Midlands Writer’s Toolkit 2015 – blogging, and working with small pressesI was asked to write a guest blog on the website of the 2010/11 ‘Ted Hughes Award for New Works in Poetry’ winner Kaite O’ReillyI was asked to write a guest blog on the Independent Publisher’s Guild (ipg) websiteI was ‘In Conversation’ with novelist James Hannah (author of The A to Z of You and Me) at Shrewsbury Festival of Literature 2016I curated the ‘Who Needs Nature?’ event at Birmingham Literature Festival 2017 – bringing together, in a ONE OFF event – Matthew Oates, Mary Colwell and Brett WestwoodI was interviewed by Public Access America podcast in July 2020 about The Word Bin podcast. You can hear it on soundcloud hereEDITOR OF FAIR ACRE PRESS:I set up Fair Acre Press in 2011 – to publish the Shropshire Butterflies book. I had always felt the need to create a book, but hadn’t realised until I was choosing and placing the poems, and art; commissioning poets,ecologists and nature writers; making connections with specialists and organisations – that I would feel such satisfaction. I was struck by the bug… Here are a few photos of my exhibited visual art work:"
