title = "Competitions | Fair Acre Press"
description = "There are no current Competitions or Projects open at Fair Acre Press – but if you want to be sure to be alerted to them when they do occur – please do subscribe the the weekly (at most…"
full_description = "CompetitionsThere are no current Competitions or Projects open at Fair Acre Press – but if you want to be sure to be alerted to them when they do occur – please do subscribe the the weekly (at most) e-newsletter, at the bottom of the pageThe winners of The 2015/16 Fair Acre Press Poetry Pamphlet Competition 2015/16 :Jill Munro – The Quilted MultiverseShauna Robertson – Blueprints for a MinefieldClick Here for the Judges ReportBuy £1 print quality PDF Recommended 2016 – with a poem and biog from each of the shortlisted poets hereThank you everyone for your interest, and for your submissions. Huge congratulations to those shortlisted and a Wheeeee ! goes out to the winners Nadia xANNOUNCEMENT of SHORTLIST for FAIR ACRE PRESS PAMPHLET COMPETITION 2015/16There were a total of 130 entries – and these entries came from all over: including Australia, France, Germany, Jamaica, New Zealand, Singapore, the UK and USA.We thank EVERYONE who entered the competition.If you aren’t on the list we do hope you take away some comfort that your submission has encouraged Fair Acre Press in its endeavours to publish beautiful books you want to hold, read and read again, and that your entry fee is an essential lifeline in publishing poetry, but most importantly – that the honing of your poems ready for the submission has strengthened your poems, and poetry-writing. Thank you all, so very much. Nadia xBut with no more prolonging, here is…THE SHORTLIST :Category A – open to all, including those who have previously had a pamphlet or collection published:Michael Farry – with – Under SurveillanceMeirion Jordan – with – CircularPeter Knaggs – with – Ecoute L’IndifferenceTheophilus Kwek – with – Invisible CitiesJill Munro – with – The Quilted MultiverseMark Rutter – with – HornetCategory B – open only to poets who have previously not had a published pamphlet or collection at the time of the closing date for entriesMatt Barnard – with – The BendsRobbie Burton – with – FromJessica Mookherjee – with – MilkMarie Naughton – with – UnderlayShauna Robertson – with – Blueprints for a Minefield The Fair Acre Press International Poetry Pamphlet competition will be open again, though no date planned currently. Below is archive information onlyA HUGE congratulations to all the above. Commiserations to others – but stay strong, focussed and enjoying poetry ! This is one person’s shortlist, and as Jonathan says in his Judge’s Report – another poet could easily have compiled a completely different shortlist.Please – all – keep 22nd to 24th April in your diaries, and particularly Saturday 23rd April 2016 – when the two winners will be invited to read alongside Jonathan Edwards at the Wenlock Poetry Festival 2016, Much Wenlock, Shropshire, UK.Come and hear them, meet our editor Nadia Kingsley, and enjoy a lot of great poetry in a gorgeous little town !DEADLINE : November 30th 2015ENTRY FEE: £12SUBMISSIONS: currently closedCATEGORIES: Both categories are open only to those aged 18 or over.1. Open to all 2. Open to those who have not previously had a pamphlet or collection published (this includes self-publishing as well, and includes any publications published up to and including 30th November 2015)PRIZES: There will be two winners – one from each category. Each will receive the same prizes of:Publication of the submitted pamphlet by Fair Acre Press, with editorial input from Nadia KingsleyA Launch Reading at Wenlock Poetry Festival 2016 alongside Jonathan Edwards(all costs involved in travel and accommodation will be at your own expense)30 complimentary copies of your winning pamphletA ten percent royalty on sales40% discount on further copies of your pamphlet you would like to buy, as well as 40% discount on any Fair Acre Press publicationsYour pamphlet will have an ISBN. It will be submitted to The Poetry Book Society pamphlet choice submission; and to the Michael Marks Poetry Pamphlet Award; and offered to The Poetry Library, as well as sent to the British Library, and other UK libraries (if requested by them)Fair Acre Press will send 5 copies out to review – (you are welcome to suggest where to) – and is very happy to send out more, if you foot the bill ! (cost price of pamphlet and p&p)How to enterRead the rules and how to enterAbout our judge, Jonathan EdwardsEntries open on November 1 and close on November 30. Enter the competitionMore about the competitionTERMS AND CONDITIONS AND RULES: Including details of what to enter and how to enter and rules before entering this competition. Submissions that do not fulfill the requirements will not be judged, and the entry fee may be forfeited. See the competition rules. ONLINE ENTRY: It is essential that your file name should start with ONE or TWO and then its title – so Jonathan Edwards knows which category you have entered – thanks x (when you save the file, before uploading it onto the submissions form – its title should be e.g. ONE My Holiday Poems, if you are entering category one)I’m afraid postal entries cannot be accepted but I do hope you know someone with a computer who can help you if necessary.RESULTS: will be announced on the Fair Acre Press website on 4th March 2016THE PROFITS: from this prize will be ploughed back into Fair Acre Press to support future publishing of poetry. Fair Acre Press really does appreciate your financial support, as well as your interest in this competition.Nadia Kingsley – founder, owner and editor of Fair Acre Press says:I am so delighted to have this year’s Costa Poetry Prize winner – Jonathan Edwards – as the sole judge for this – our inaugural poetry pamphlet competition. This means that he will read all the submissions, and the winners will be his choice alone.It feels kind of odd to hand over control to somebody else – but I KNOW I will love his choices – because his own poetry is so fantastic. I have read, re-read and then re-re-read My Family and Other Superheroes and I have seen Jonathan read at 2014 Wenlock Poetry Festival – both are joyous experiences!Fair Acre Press is able to embark on this competition adventure thanks to the support of the Arts Council England: in that they have made the technology behind its smooth running achievable for Fair Acre Press.The submissions page will be visible on November 1st 2015, and invisible after 30th November 2015Thank you Arts Council England. You really are A.C.E. !"
