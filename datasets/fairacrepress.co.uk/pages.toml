full_description = '''ShopWelcome to the Fair Acre Press shop!We are very very proud of every one of our books – and are delighted that many of them have attracted the eye of award judges and reviewers too, and have been endorsed by people we deeply respect2022 sees us publishing twelve pamphlets by SELIMA HILLA Yorkshire based photography & poetry book in hardback and paperback by Bob Hamilton & Emma Storr – OFFCUMDENSCHARLES FOSTER, author of Being a Beast, Being a Human, The Screaming Sky – his first novel – A little brown seaA poetry pamphlet endorsed by Selma James – HOUSE WORK by Khadija RoufMartin Figura’s pamphlet on Social Care ~ Sixteen Sonnets for Careand on VALENTINE’S DAY 2023 we launch love poems by Mario Petrucci~ Moonbird : love poems Recent highlights below. But be aware – every one of our books is worth its weight in gold!POETRY:These Are The Hands – NHS poetry anthology including poems by Lemn Sissay, Wendy Cope, Michael Rosen, Sabrina Mahfouz – all profits to NHS Charities TogetherKeith Chandler’s The Goldsmith’s Apprentice ~ WINNER of the International Rubery Award for Poetry 2018Ted Hughes Award for new work in Poetry – winning PERSIANS by Kaite O’ReillyDIVERSIFLY: poetry and art on Britain’s Urban Birds ~ shortlisted for the International Rubery Award for Poetry & longlisted for the Saboteur Awards Best anthology#MeToo – a women’s anthology ~ WINNER of the Saboteur Awards Best Anthology; featured on BBC Radio 4’s Front Row; invited to hold events at a host of festivals and London Book Fair. Raising money for Women’s Aid and awareness and support for anyone who has endured sexual harassment or assaultEmma Purshouse’s children’s illustrated collection I Once Knew a Poem who Wore a Hat ~ WINNER of the International Rubery Award for Poetry 2016NATURE: Matthew Oates’ Beyond Spring – Wanderings through Nature ~ featured in the guardian’s list of Best Nature Books of 2017; shortlisted for BBC Countryfile magazines’s Best Country Book of the Year & sh