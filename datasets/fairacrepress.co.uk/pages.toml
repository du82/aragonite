full_description = "Poetry on Stinging Nettles ebooks now on saleBy Nadia on February 26, 2016 in Maligned SpeciesGo to the Fair Acre Bookshop to find out more, and to buy the Poetry on Stinging Nettles ebook Available in either PDF format or ePub £2.99, with monies donated to Plantlife Also available in the Maligned Species series are Poetry ebooks on – Spiders, Grey Squirrels and Frogs. Continue Reading 2 Poetry on Frogs ebook and PDF now on saleBy Nadia on February 19, 2016 in Maligned SpeciesGo to the Fair Acre Bookshop to find out more, and to buy the Poetry on Frogs ebook Available in either PDF format or ePub £2.99, with monies donated toFroglife Also available in the Maligned Species series are Poetry ebooks on – Spiders, Grey Squirrels and Stinging Nettles Continue Reading 2 Spiders and Grey Squirrels ebooks, or as PDFs, now on saleBy Nadia on February 12, 2016 in Maligned SpeciesThe Poetry on Spiders and Poetry on Grey Squirrels ebooks are now available at £2.99 each. ALSO on Saturday 13th February – there is a poetry on grey squirrels event at Shropshire Wildlife Trust, Shrewsbury – details here Continue Reading 5 Podcast on Nadia KingsleyBy Nadia on January 22, 2016 in Maligned SpeciesWelcome ! Here is a podcast with poet Nadia Kingsley. How would you write about –the Common Mouse Ear plant, the Andromeda Galaxy, or wildlife within a project about Olympic athletes? Nadia tells us how she approaches a subject, and also treats us to some fact-based poems from Shropshire Butterflies, Lawn Lore, e-x-p-a-n-d-i-n-g: The history […] Continue Reading 0 Poems welcomed/ last podcast (for now)By Nadia on January 20, 2016 in Maligned Species You may well have already written a poem – if so, hooray ! If you haven’t – you have until the end of January ! Maligned Species is an Arts Council England funded project – hoping to encourage YOU to write poetry with a more scientific slant than you are, perhaps, used to… […] Continue Reading 0 the podcast team – Tom Wentworth, producerBy Nadia on January 20, 2016 in Maligned SpeciesI’d forgotten that Tom Wentworth almost did a degree in drama. But luckily for the Maligned Species project he decided on a radio degree, at the University of Glamorgan, and achieved a first. He has been script editor in BBC’s Casualty. He has produced the Radio 4 Afternoon Drama It takes Two to Lie. He has […] Continue Reading 0"
