full_description = "Privacy PolicyThis privacy policy sets out how Fair Acre Press uses and protects any information that you give us when you use this website.Fair Acre Press is committed to ensuring that your privacy is protected. Should we ask you to provide certain information by which you can be identified when using this website, then you can be assured that it will only be used in accordance with this privacy statement.Fair Acre Press may change this policy from time to time by updating this page. You should check this page from time to time to ensure that you are happy with any changes. This policy is effective from June 1 2015What we collectWe may collect the following information:name and job titlecontact information including email addressdemographic information such as postcode, preferences and interestsother information relevant to customer surveys and/or offersWhat we do with the information we gatherWe require this information to understand your needs and provide you with a better service, and in particular for the following reasons:Internal record keepingWe may use the information to improve our products and services.We may periodically send promotional emails about new products, special offers or other information which we think you may find interesting using the email address which you have provided.From time to time, we may also use your information to contact you for market research purposes. We may contact you by email, phone, fax or mail. We may use the information to customise the website according to your interests.SecurityWe are committed to ensuring that your information is secure. In order to prevent unauthorised access or disclosure, we have put in place suitable physical, electronic and managerial procedures to safeguard and secure the information we collect online.How we use cookiesSee our Cookies PolicyLinks to other websitesOur website may contain links to other websites of interest. We are not responsible for the content or privacy of these websites.Controlling your personal informationWe will not pass on your personal information to third parties unless are required by law to do so."
