title = "Diversifly | Fair Acre Press"
description = "Fair Acre Press"
full_description = "Review of DIVERSIFLYBy Nadia on October 21, 2018 in DiversiflyThere is a great new review out about DIVERSIFLY – by Sue Mackrell: The wonderful art and poetry book on the Urban Birds of Britain that was longlisted for the Saboteur anthology award (which was won by Fair Acre Press’ #MeToo poetry anthology!) and shortlisted for the International Rubery Award for Poetry (which was won […] Continue Reading 0 Comments about the DIVERSIFLY projectBy Nadia on May 10, 2018 in DiversiflyI have just submitted the DIVERSIFLY evaluation report to the Arts Council England. I had collected screenshots of tweets and facebook posts as well as some comments that came through on email – and so I thought I would share some of them with you. DIVERSIFLY the book was recently on the longlist for the […] Continue Reading 0 Vote?! for DIVERSIFLY & #MeToo – Saboteur Award nominations openBy Nadia on March 9, 2018 in #MeToo, Diversifly, Not quite PepysIf you like DIVERSIFLY and/or #METOO poetry anthology you may want to consider voting for them.. It seems to me they would both fit in the Best Anthology Category A collection of works by more than one author, not restricted by genre, theme or form. This could be a combination of fiction and […] Continue Reading 2 DIVERSIFLY podcast #7: Gillian ClarkeBy Nadia on March 2, 2018 in DiversiflyWelcome to the last-but-not-least of 7 podcasts from the DIVERSIFLY project. As Gillian Clarke brought her first collection out in the Nineteen Seventies I decided to throw the tricky question of what is poetry at her feet. This, and all her answers reflect her generous generous core and great passion for the Natural World, and […] Continue Reading 0 DIVERSIFLY podcast #6: Richard OsmondBy Nadia on February 23, 2018 in DiversiflyWelcome to the sixth of 7 podcasts from the DIVERSIFLY project. Richard Osmond has been foraging for mushrooms since childhood, but it was only when he became dependent on it for his livelihood did his skills really develop. In conversation with Nadia Kingsley he talks about the influence of meieaval literature and other influences; and […] Continue Reading 0"
