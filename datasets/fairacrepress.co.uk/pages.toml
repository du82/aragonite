["https://fairacrepress.co.uk/shop/wilderland-wildlife-and-wonder-from-the-shropshire-borders"]
title = "Wilderland: Wildlife and Wonder from the Shropshire Borders | Fair Acre Press"
description = "WILDERLAND Wildlife and Wonder from the Shropshire Borders By Andrew Fusek Peters Photography 297mm x 210mm landscape hardback 160 pp, full colour photographs throughout Publication date: 22nd Apri…"
full_description = '''Wilderland: Wildlife and Wonder from the Shropshire BordersWILDERLAND Wildlife and Wonder from the Shropshire Borders By Andrew Fusek PetersPhotography 297mm x 210mm landscape hardback 160 pp, full colour photographs throughout Publication date: 22nd April 2016 ISBN 9781911048039SOLD OUT Category: Books Tags: Amateur Photographer, BBC Wildlife Magazine, Ben Osbourne, Five star review, Landscape Photography, Mairi Eyres, on-landscape, Outdoor Photography, Piers Moore Ede, The Countryman, The Fayre, The Independent, Tim Keates, Times Literary Supplement, Wilderland, Wildlife Photography Description Reviews (0) DescriptionWILDERLAND, explores the extraordinary wildlife & stunning landscapes of Shropshire & the borders throughout the four seasons. With sumptuous full photographs, evocative nature writing, lyrical poetry as well as technical information on how the photos were taken, Wilderland brings a hidden county to life.It’s a lovely book and, above all things, inspiring. ★★★★★ Amateur PhotographerIt should have pride of place on any countryside-lover’s shelf The CountrymanHe has captured wonderful images of wildlife on his doorstep BBC Wildlife MagazineABOUT ANDREW FUSEK PETERS• Shortlisted for British Wildlife Photographer of the Year in 2014 & 2015; and Amateur Photographer of the Year 2015. • His photos have been used as book & calendar covers, and published in The Times, The Guardian, Amateur Photographer, What Digital Camera, Black & White Photography. • Andrew has written & edited over 100 books (poetry, plays, novels), and has been translated into 17 languages • His nature writing memoir ‘Dip’ was highly praised:The writing is so lyrical, there are moments when words and water fuse together The Independent More photos from WILDERLAND are permanently featured on the BBC Wildlife magazine websiteWILDERLAND REVIEWSPoet, photographer and Countryman contributor Andrew Fusek Peters shares a year of wildlife and landscape adventures in the Shropshire Borders. Stunning photos of insects, birds and mammals share centre stage with images of this beautiful county’s most striking places, interspersed with evocative nature writing and lyrical poetry, in a handsome large-format book that should have pride of place on any countryside-lover’s shelf. The Countryman Review (August 2016)There has been a boom in photographers and writers taking flight from urban life to reconnect with Britain’s natural spaces. Bookshelves creak with nature writing by the likes of Robert Macfarlane and Helen Macdonald, and in the pages of this very magazine wildlife and landscape photography is in abundance. The charm and glamour of stepping onto and recording a land teeming with primitive history, and witnessing its inhabitants untethered by social concerns and problems, appeals to all of us. In this collection of wildlife imagery and writing, Andrew Fusek Peters explores the Shropshire borders. It’s a project that seems not to be about an insider looking in and hoping to grab a few award-winning images, but a person using his camera to step into the world and, with some luck, bring something back that can be cherished and preserved on the most personal level. It’s a lovely book and, above all things, inspiring. ★★★★★ Amateur Photographer Review (2nd June 2016)His images have a lyrical quality, he presents them with a passion that’s both inspiring and engaging Ben Osborne, Wildlife Photographer of the Year 2007 This is the best kind of book – lyrical, entertaining and beautiful. Andrew’s photos take my breath away. When he writes about his wild encounters, his love of nature is so infectious it makes me want to smile and get outside. Mairi Eyres, Young Landscape Photographer of the Year 2015 Among the current crop of British nature writers, he deserves a prominent place. Piers Moore Ede, Times Literary SupplementHere is an article by Andrew Fusek Peters, commissioned by on-landscape ReviewsThere are no reviews yet. Be the first to review “Wilderland: Wildlife and Wonder from the Shropshire Borders” Click here to cancel reply.Your rating *Rate…PerfectGoodAverageNot that badVery poor Your review *Name *Email * Δdocument.getElementById("ak_js_1").setAttribute("value",(new Date()).getTime())This site uses Akismet to reduce spam. Learn how your comment data is processed.Related products David Calcutt – The last of the light is not the last of the light £10.99 Add to basket Woods River Road by John Sewell £10.99 Add to basket #MeToo: A women’s poetry anthology £10.00 Add to basket A little brown sea HARDBACK by Charles Foster £18.99 Add to basketSupported byThe Maligned Species Project is kindly supported by the Arts Council England and supports the following ecology organisations:BuglifeFroglifePlantlifeShropshire Wildlife TrustBasketBlog categories#MeToo (10)Diversifly (43)Inspired in Caersws (13)Maligned Species (50)Not quite Pepys (440)Painting by Pixels (15)The Word Bin (2)Uncategorized (5) Notice: JavaScript is required for this content. No Fields Found. var formDisplay=1;var nfForms=nfForms||[];var form=[];form.id='1';form.settings={"ninjaForms":"Ninja Forms","changeEmailErrorMsg":"Please enter a valid email address!","changeDateErrorMsg":"Please enter a valid date!","confirmFieldErrorMsg":"These fields must match!","fieldNumberNumMinError":"Number Min Error","fieldNumberNumMaxError":"Number Max Error","fieldNumberIncrementBy":"Please increment by ","fieldTextareaRTEInsertLink":"Insert Link","fieldTextareaRTEInsertMedia":"Insert Media","fieldTextareaRTESelectAFile":"Select a file","formErrorsCorrectErrors":"Please correct errors before submitting this form.","formHoneypot":"If you are a human seeing this field, please leave it empty.","validateRequiredField":"This is a required field.","honeypotHoneypotError":"Honeypot Error","fileUploadOldCodeFileUploadInProgress":"File Upload in Progress.","fileUploadOldCodeFileUpload":"FILE UPLOAD","currencySymbol":"$","fieldsMarkedRequired":"Fields marked w