full_description = "New Selima Hill pamphletBy Nadia on February 25, 2024 in Not quite Pepys, UncategorizedComing soon – publication date 28th March 2024 – but I will post out to you as soon as Selima has given the hard copy her blessing. I do hope you are all keeping well. I am (happily) back working full time, and have very little spare time for publishing at the moment. But who […] Continue Reading 0 London Grip Review of Khadija Rouf’s “House Work”By Nadia on July 30, 2023 in Not quite PepysHere is a review in London Grip, by the wonderful Pat Edwards in which she writes: Sensuous, honest writing about sexual encounters, childbirth and early motherhood… a totally honest way of confronting ‘house work’. Other reviews: I love this raging, angry, funny, and often beautiful and tender book. Many of us will recognise ourselves amongst […] Continue Reading 0 Nathalie Ab-Ezzi poetry book out!By Nadia on May 21, 2023 in Not quite PepysIn this remarkable debut the poet, whose own family were displaced from Lebanon, has achieved a work of empathy with women from other cultures and now living in the East End. It brings to life longed-for homelands and sings of loss as well as adjustment to Britain. It filled me with a desire to see […] Continue Reading 0 MARIO PETRUCCI INVITES YOU TO HIS OFFICIAL ZOOM LAUNCH: 27 March 7pmBy Nadia on March 13, 2023 in Not quite PepysMARIO PETRUCCI INVITES YOU TO HIS OFFICIAL LAUNCH: Please join me on Zoom for the official launch of Moonbird : love poems. ZOOM Mar 27, 2023 7:00 pm London – with Oxford Stanza “Inspired by Pablo Neruda and E. E. Cummings as much as by Rumi, Moonbird : love poems provides a courtship display of rare distinction, combining a compelling uniqueness of voice with insistent […] Continue Reading 0 PBS Review of Selima Hill’s pamphletBy Nadia on January 22, 2023 in Not quite PepysThis is a chilling reminder of climate catastrophe. Hill’s poems weigh heavy upon us, an urgent warning we can no longer ignore. Poetry Book Society review, Winter 2022 Selima Hill is one of our greatest living poets. She has always found new ways to speak the unspeakable. Each of these tiny poems somehow contains a […] Continue Reading 0"
