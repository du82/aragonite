full_description = "A new review of #MeToo poetry anthologyBy Nadia on March 17, 2021 in #MeToo, Not quite PepysSue Mackrell has written a new review of Deborah Alma’s poetry anthology on #MeToo – 3 years on from its publication This is the one book that Fair Acre Press has published that I wish had now dated and become irrelevant It IS a hard read – but men and women alike have found it […] Continue Reading 0 Free PDF of acclaimed #MeToo poetry anthologyBy Nadia on February 18, 2019 in #MeTooFREE PDF of complete book from 8th March 2019 Deborah Alma – editor of the #MeToo poetry anthology, poet, emergency poet, and poetry pharmacist and I, Nadia Kingsley – director and editor of Fair Acre Press are so happy to be able to share this award-winning and essential poetry anthology to anyone, anywhere, for free […] Continue Reading 0 #MeToo poetry anthology UPDATEBy Nadia on November 12, 2018 in #MeToo, Not quite PepysIt is the one year anniversary of the conception of the #MeToo poetry anthology. If you have read and liked the book – we would very much appreciate an amazon review – to increase the book’s visibility – to reach a wider audience plus every penny made on book sales we are donating to the […] Continue Reading 0 #MeToo wins!!By Nadia on May 25, 2018 in #MeTooI am very proud to announce that our #MeToo poetry anthology won THE BEST ANTHOLOGY 2018 award at London’s Saboteur Awards !! It is such an important book – plus everyone has donated their time for it with all monies going to Women’s Aid The loud cheers were extraordinary on the night… It was […] Continue Reading 0 Review of #MeToo poetry event at April’s Birmingham Literature FestivalBy Nadia on May 10, 2018 in #MeTooReview of #MeToo poetry event at Birmingham Literature Festival – and below the full review of the festival 🙂 Next is #MeToo: A Movement in Poetry. Fair Acre Press has published an anthology of poetry featuring the work of 80 female poets in response to the #MeToo movement – which highlights the prevalence of […] Continue Reading 0"
