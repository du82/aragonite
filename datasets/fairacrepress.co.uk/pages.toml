full_description = '''Baby Peter by Maisie Hill and Selima Hill£14.99978-1-911048-77-066pp Black and white inners 29 sequence sections and 29 photographsPublication date: 25th April 2024 Baby Peter by Maisie Hill and Selima Hill quantity Add to basket Category: Pamphlets Description Reviews (0) Description‘Selima Hill is an inimitable talent. The mind is fragile and unreliable in her poetry, but is also tenacious and surprising, capable of the most extraordinary responses, always fighting back with language as its survival kit. Life in general might be said to be her subject, the complications, contradictions and consequences of simply existing. Nevertheless, Hill’s writing is eminently readable and approachable, even fun at times, the voice of a person and a poet who will not be quieted and will not conform to expectations, especially poetic ones.’ Simon ArmitageMaisie Hill has been taking photographs non-stop since being a teenager. She creates personal work and professional commissions. Selima Hill is her mother.Selima Hill is a writer who enjoys working with artists and taking her dog for walks and she would like to thank her fellow dog walkers for keeping her on her toes. ReviewsThere are no reviews yet. Be the first to review “Baby Peter by Maisie Hill and Selima Hill” Click here to cancel reply.Your rating *Rate…PerfectGoodAverageNot that badVery poor Your review *Name *Email * Δdocument.getElementById("ak_js_1").setAttribute("value",(new Date()).getTime())This site uses Akismet to reduce spam. Learn how your comment data is processed.Related products The Chauffeur by Selima Hill £7.50 Add to basket A Spell in The Woods – Stella Wulf £7.50 Add to basket Lawn Lore £4.50 Add to basket The Fly by Selima Hill £7.50 Add to basketSupported byThe Maligned Species Project is kindly supported by the Arts Council England and supports the following ecology organisations:BuglifeFroglifePlantlifeShropshire Wildlife TrustBasketBlog categories#MeToo (10)Diversifly (43)Inspi