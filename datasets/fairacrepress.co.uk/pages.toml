title = "Project Podcasts | Fair Acre Press"
description = "Here are seven podcasts: made as part of the Diversifly project 1 with Brett Westwood as he takes us on an urban bird walk in central Stourbridge, West Midlands, UK – at the start of November…"
full_description = "Project PodcastsHere are seven podcasts: made as part of the Diversifly project1 with Brett Westwood as he takes us on an urban bird walk in central Stourbridge, West Midlands, UK – at the start of November 20176 from some of the UK’s best nature poets – Alison Brackenbury, Gillian Clarke, Chris Kinsey, David Morley, Richard Osmond, and Katrina Porteous. Gillian Clarke’s will be released on 2nd March…Brett Westwood Alison Brackenbury Gillian Clarke Chris Kinsey David Morley Richard Osmond Katrina Porteous Here are thirteen podcasts: made as part the Maligned Species project– four from ecologists/ naturalists – Brett Westwood, Matthew Oates, John Handley, Nigel Brown– nine from poets – Jonathan Edwards, Liz Lefroy, Keith Chandler, John Siddique, Emma Purshouse, David Calcutt, Tom Wentworth, Nadia Kingsley and Andrew Fusek Peters – we hope you enjoy them. Brett Westwood tells us why we find spiders in the bath, as well as many fascinating facts about these eight-legged creatures.Download the Podcast[soundcloud url=”https://api.soundcloud.com/tracks/227888090″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Matthew Oates tells us in what way Stinging Nettles and Man are similar, as well as many fascinating facts about how their stings actually work, and what benefits from their presence.[soundcloud url=”https://api.soundcloud.com/tracks/229563662″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast John Handley tells us some facts about the grey squirrel: how they manage to run both up and down trees, about their homes, how long they have been in the UK, and the ‘greys versus reds’ story.[soundcloud url=”https://api.soundcloud.com/tracks/231662448″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast Nigel Brown tells us what frogs eat, what eats them, their ability to thrive in both air and water, and much more.[soundcloud url=”https://api.soundcloud.com/tracks/227664659″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast Jonathan Edwards reads and discusses some of his poems, and how he writes about – a seal, a hippopotamus, his grandfather, Houdini, the Covent Garden Theatre in 1775, his father.[soundcloud url=”https://api.soundcloud.com/tracks/238245939″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast Liz Lefroy reads and discusses some of her poems, and how she writes about -Michelangelo’s David, her son’s school concert, a busker in London,parts of an elephant skeleton[soundcloud url=”https://api.soundcloud.com/tracks/237525111″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /]Download the Podcast Keith Chandler reads and dicusses some of his poems, and how he writes about – a fisherman, glassworkers, a tragic news item, a grayling butterfly, a goldsmith’s apprentice, a chemo nurse[soundcloud url=”https://api.soundcloud.com/tracks/240670750″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /]Download the Podcast John Siddique reads and discusses some of his poems, and how he writes about – Derek Jarman’s garden, the four seasons in Haiku, or a moment on a bench by the river Thames?[soundcloud url=”https://api.soundcloud.com/tracks/234972824″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /]Download the Podcast Emma Purshouse reads and discusses some of her poems, and how she writes about – a butterfly called the Essex Skipper, the fact that astrophysicists can only account for about 4% of the Universe, the eradication of smallpox[soundcloud url=”https://api.soundcloud.com/tracks/234360533″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast David Calcutt reads and discusses some of his poems, and how he writes about – the nature of a trout as sensed by a fisherman, a magpie if you saw it killing a chick, two dead badgers at the side of a road.[soundcloud url=”https://api.soundcloud.com/tracks/232911838″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast Tom Wentworth reads and discusses some of his poems, his scripts and how he writes about – a butterfly called the Gatekeeper, the White letter hairstreak, the moon.[soundcloud url=”https://api.soundcloud.com/tracks/236617353″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /]Download the Podcast Nadia Kingsley reads and discusses some of her poems, and how she writes about – the Common Mouse Ear plant, the Andromeda Galaxy, wildlife within a project about Olympic athletes.[soundcloud url=”https://api.soundcloud.com/tracks/241785329″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /] Download the Podcast Andrew Fusek Peters reads and discusses some of his poems, and how he writes about – a blackbird, a hare, a poem about knitting that at its heart is about the environment, and reveals how for him his poetry-writing comes from the same inner place as his landscape and wildlife photography.[soundcloud url=”https://api.soundcloud.com/tracks/241941011″ params=”auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=true” width=”100%” height=”450″ iframe=”true” /]Download the Podcast"
