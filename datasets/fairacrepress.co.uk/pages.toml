full_description = "Exhibition in Oswestry – Painting by PixelsBy Nadia on July 27, 2018 in Painting by Pixels Continue Reading 2 Painting by Pixels EXHIBITION!By Nadia on July 16, 2018 in Painting by Pixels Do please come along to the Painting by Pixels exhibition at Qube gallery, Oswestry which can be visited throughout August 2018. Details of the exhibition, and Qube’s opening times are here Local news coverage about the exhibition is here You will see a large number of digital paintings, photography, and also an iPad slideshow […] Continue Reading 0 Isaac – about the artistBy Nadia on July 16, 2018 in Painting by Pixels Isaac has an Animation degree from the University of Wolverhampton. He is a photographer, artist, and triathlete. His digital artwork is published in DIVERSIFLY: poetry and art on Britain’s Urban Birds. He has digital artwork in the Painting by Pixels art exhibition at Qube gallery, Oswestry – which is supported through public funding by Arts Council […] Continue Reading 0 Paul Kielty – about the artistBy Nadia on July 16, 2018 in Painting by PixelsPaul Kielty has an Animation degree from the University of Wolverhampton. He is an artist, cartoonist, musician, M.C., Stand-up, and practises the art of Origami. His artwork has been shown in Wolverhampton and Birmingham. His digital artwork is published in DIVERSIFLY – poetry and art on Britain’s Urban Birds – which was shortlisted for the […] Continue Reading 0 Nadia Kingsley – about the artistBy Nadia on July 16, 2018 in Painting by PixelsNadia Kingsley has a Ceramics degree from the University of Wolverhampton. She is an artist, potter, poet, writer, publisher, and project manager. Her ceramics has been exhibited in Wolverhampton, Birmingham, London, Hatfield House, Hastings and Cambridge. Her brick sculpture is on permanent display outside the School of Art and Design, University of Wolverhampton; and Ibstock […] Continue Reading 0 Giancarlo Facchinetti – about the artistBy Nadia on July 10, 2018 in Painting by PixelsGiancarlo Facchinetti has a Fine Art degree from the University of Wolverhampton. He is a sculptor, a musician, and sound artist. He has worked alongside poets Emma Purshouse and Nadia Kingsley, and astrophysicist Professor Trevor Ponman to create and perform in E-X-P-A-N-D-I-N-G: The history of the Universe in 45 minutes, within a mobile planetarium dome […] Continue Reading 0"
