full_description = "Family Link Family Link Overview Device Compatibility FAQ Sign in Sign in Check your device compatibility For kids and teens Family Link supervision can run on Android devices with version 7.0 (Nougat) and higher. Devices running Android versions 5.0 and 6.0 (Lollipop and Marshmallow) may also be able to have Family Link settings applied to them. See our Help Center for more details. For parents Parents can run Family Link on Android devices running versions 5.0 (Lollipop) and higher, and iPhones running iOS 11 and higher. Settings System Date & time Scheduled power on & off Accessibility Software Update General Management About phone Find what Android version you're running 1. Open the Settings app on your Android device. 2. Scroll to the bottom. 3. Tap About phone or About tablet to see your version number. Family Link runs on Chromebook too Stay in the loop when your child signs into a Chromebook with their own account. Family Link supervision can run on Chromebooks with Chrome OS version 71 or higher. Learn more Get the app now Download Family Link to your device so you can stay in the loop as your child or teen explores online. Get app Don't have a smartphone? You can set up supervision online. Learn more"
