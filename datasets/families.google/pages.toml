eos about the topics and characters they love. Make Videos that spark hands-on creativity & play In the Make tab, kids can get inspired to create, discover, and practice their skills with recommended videos from YouTube Kids about everything from simple drawing activities to silly science projects. 0 1 2 3 For parents that want more flexibility beyond Kids Space recommended content, they can add more apps, games, and books from the Google Play store through the parents’ menu."
