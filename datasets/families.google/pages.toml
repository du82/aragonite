["https://families.google/familylink/faq"]
title = "Frequently Asked Questions and Answers - Google Family Link"
description = "Explore Family Link tools designed to help parents set screen time limits, filter content, and better understand how their families spend time online."
full_description = "Family Link Family Link Overview Device Compatibility FAQ Sign in Sign in FAQ We’ve collected answers to some of the most frequently asked questions about Family Link. If you’re already using the app and have a question of your own, you can check out our Help Center for more information. How it works Expand all Collapse all How does Family Link work? Family Link from Google helps parents stay in the loop and keep their child or teen safer online as they explore across Android and ChromeOS devices. First, a child/teen will need a compatible device (see which devices work with Family Link). Then, sign the child/teen into the device. If the child/teen is already supervised by Family Link, the sign-in will help them set up parental controls. Parents can also add Family Link from Android Settings if the teen is not already supervised by Family Link. Parents can also create a Google Account for their child under 13 (or the applicable age in your country). Once complete, children can sign-in to their device with their new account. Once the accounts are linked, parents can use Family Link to help them do things like keep an eye on screen time and guide their child to age-appropriate content. Does Family Link block all inappropriate content for my children? Family Link does not block inappropriate content, but the settings within provide you with filtering options. Certain Google apps like Search, Chrome, and YouTube have filtering options that you can find in Family Link. Please note that these filters are not perfect, so explicit, graphic, or other content you may not want your child to see makes it through sometimes. We recommend reviewing app settings, and the settings and tools Family Link offers, to decide what is right for your family. Can parents use Family Link on Android? Yes. Parents can run Family Link on Android devices running Lollipop (5.0) and higher. Can parents use Family Link on iOS? Yes. Parents can run Family Link on iPhones running iOS 11 and higher. Can parents use Family Link on a web browser? Parents can manage pretty much all of their child's account settings and features on a web browser. No app download needed. Can children or teens be supervised by Family Link on Android devices? For best results, we recommend that children or teens being supervised with Family Link are using Android devices running version 7.0 (Nougat) or higher. Devices running Android versions 5.0 and 6.0 (Lollipop and Marshmallow) may also be able to have Family Link settings applied to them. To find out more, see our Help Center. Can children or teens be supervised by Family Link on a Chromebook (ChromeOS)? Yes, children and teens can be supervised when they sign into their Google Account on Chromebooks. Parents can do things like manage their child’s Chromebook and account settings, and set website restrictions. Learn more here. Can children or teens be supervised by Family Link on iOS devices and web browsers? Children or teens signed into iOS, web browsers, or other unsupervised devices can only be partially supervised. Children and teens can sign into their Google Account on iOS devices and web browsers with their parent’s consent. Parents can continue to manage some of their child's account settings on YouTube and Google Search, and those settings will apply when the child is signed in and using Google apps and services on an iOS device or on the web. Other features in the Family Link app, like managing the apps your children can use, filtering what they see on Chrome, and setting screen time limits, will not apply to the child’s activities on their iOS device or on the web. Learn more about child/teen sign in on iOS devices and web browsers. How long does it take to set up a child’s device and Google account? You should plan to budget about 15 minutes to set up your child’s Google Account and Android device. Accounts Expand all Collapse all Is there a minimum age for a child to have a Google Account managed with Family Link? No. It’s up to you to decide when your child is ready for their first Android or ChromeOS device. Will my child see ads while signed into their Google account? Google's services are ad-supported and your child may see ads when using our products. However, they will not see personalized ads and you will be provided with tools to identify when the child is seeing ads in apps. Can I use Family Link to supervise my teenager? Yes, Family Link can be used to supervise teenagers (children over the age of 13 or applicable age of consent in your country). Unlike children under the age of consent, teenagers have the ability to stop supervision at any time. If they do, you will be notified and their Android device will be temporarily locked for 24 hours unless you unlock it. As a parent, you can also choose to remove supervision for teenagers at any time without any impact on their device’s usability. Can I use my account I got through school or work to manage my family? No. Accounts provided through work or school cannot be used to manage a family group or manage supervision via Family Link. You can use a personal Google Account, such as your Gmail account with Family Link. Can children have multiple Google Accounts added to their supervised devices? Not in general. Children are only allowed to add a Google Workspace for Education Account besides their personal supervised Google Account. This restriction helps us maintain important product behaviors. For example, if another account was present on the device, children could switch to that account to download apps from Play without parent approval. What happens when my child turns 13 (or the applicable age in your country)? When your child turns 13 (or the applicable age in your country), they have the option to graduate to an unsupervised Google Account. Before a child turns 13, parents will get an email letting them know their child will be eligible to take charge of their account on their birthday, so you can no longer manage their account. On the day they turn 13, children can choose whether they want to manage their own Google Account or continue to have their parent manage it for them. As a parent, you can also choose to remove supervision at any time when the child is over the age of 13. All set? Get the app. Download Family Link to your device so you can stay in the loop as your child explores. Get app Don't have a smartphone? You can set up supervision online. Learn more"
year_published = 2025
clearnet = "https://families.google/familylink/faq"
