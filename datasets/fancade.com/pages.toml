full_description = "A Universe of Instant Games Fancade is a mobile app where you can play thousands of games—or create your own using our visual drag-and-drop system. Start with the epic Quest mode to unlock over 100 mini-games across diverse worlds. Jump into Battle to challenge other players, or explore the Arcade, where fresh games are added daily. With a vast collection spanning nearly every genre, Fancade has something for everyone—it’s a must-have for gamers and creators alike. “Massive collection”Apple “Spanning almost all genres”Pocket Gamer “Deserves heaps of praise”Android Central Best Innovative Google Play Best Of 2020 “Incredibly powerful”Google “Going to be a real hit”TouchArcade “A treasure trove”TapSmart Try a Fancade game now… Game Engine At the heart of Fancade lies our in-house game engine, purpose-built for instant gaming. Designed to be both powerful and efficient, it offers everything you need to create and publish games in the Fancade app—whether you’re crafting simple mini-games or fully-fledged experiences. Our unique Visual Scripting System is perfect for casual games and rapid prototyping, allowing creators to build games quickly without needing to code. Whether you’re a seasoned developer or new to game design, the intuitive drag-and-drop system is easy to learn and incredibly versatile. Plus, with built-in support for kits and remixing, you can expand your creations or tweak existing games with ease. Read more in the Fancade Wiki Publishing With Fancade, games can be published directly on the Fancade platform, making them instantly accessible to our community. We also take our games beyond the Fancade platform by publishing them as standalone titles on popular mobile platforms like Google Play and the Apple App Store. This allows our creations to reach a broader audience while maintaining the quality and fun that define Fancade games. Additionally, through our exclusive partnership with Poki, one of the largest instant game portals in the world, we also bring our games to the web, making them easily accessible to a global audience of players. Note: Standalone publishing is currently only available for internal titles. Most Popular Games Drive Mad Drive silly cars at high speeds in dangerous terrain drivemad.com Mekorama Puzzling Mechanical Dioramas mekorama.com Odd Bot Out Meet a small robot with a big personality oddbotout.com About the Company Fancade was released in 2018, developed by industry veteran Martin Magni. Founded in Linköping, Sweden, with an office at East Sweden Game, we are a self-funded studio with organic growth and profitability. With a history of creative games, we’ve created classic titles like Blocksworld, Odd Bot Out, Mekorama, and Fancade. In 2024, industry veteran Tomas Ahlström joined as CEO to lead our next phase of growth. Our vision is to become the leading brand in mobile and instant gaming, delivering accessible, high-quality experiences to players around the world. Did you know? 🌍 Fancade offer the biggest collection of quality instant games in the world. 📱The mobile app has been downloaded over 30,000,000 times. 🚕 The most popular Fancade game – Drive Mad – has been played over 300,000,000 times. 🤖 Founder Martin Magni transitioned from AI research to game development, driven by a desire to make a positive impact on humanity through creativity and play. 📈 The Fancade office is in Linköping, home to one of Sweden’s fastest-growing game development communities. 🏓 The development team play ping-pong every Wednesday. Let’s Stay In Touch Already started playing Fancade? Here’s more stuff for you. Join the Fancade community in game jams, playtesting, and just hanging out in our Discord chat Watch video tutorials and learn more about scripting and building from the Fancade Wiki Fancade is available for phones and tablets with iOS 10.0 or Android 5.0 or later. Get it for free from Apple’s App Store and Google’s Play Store. Or play on the web here or at Poki. Stay up-to-date through Twitter and Facebook. Looking for the press kit? Get in touch with us here: contact@fancade.com. We read all emails, but unfortunately we can’t respond to everyone. Please join our Discord for sumitting ideas or bugs."
