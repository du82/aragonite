["https://www.fao.org/biodiversity/en"]
title = "Home | Biodiversity | Food and Agriculture Organization of the United Nations"
description = """
Biodiversity is the foundation of sustainable agricultural production and food security. 

Agrifood sectors – crop and livestock production, fisheries, aquaculture and forestry – manage significant parts of the land, freshwater and oceans. They depend on biodiversity and the ecosystem services it provides. But they also affect biodiversity in both positive and negative ways, impacting on livelihoods, food security and nutrition."""
full_description = "News FAO welcomes UN Biodiversity COP16.2, highlights agrifood systems as key to achieving global biodiversity goals Colombia, the CBD Secretariat, and FAO join efforts to spotlight the importance of including agrifood systems in National Biodiversity Strategies and Action Plans News The biodiversity connection Sustainable farming practices increase biodiversity in fields, benefiting the environment and livelihoods in Uganda News UN Biodiversity Conference COP16 talks resume in Rome: What’s at stake? News High-Level Event | Meeting People’s Needs through Sustainable Use of Biodiversity within Agrifood Systems FAO Headquarters, Rome, 24 February 2025 and UN Web TV News Pulses: Bringing diversity to agrifood systems Join World Pulses Day celebrations on 10 February 2025 $(document).ready(function () { var prop = { pagination: { el: '.swiper-pagination', }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperHero = new Swiper('#swiperHero-1', prop); }); Biodiversity is the foundation of sustainable agricultural production and food security. Agrifood sectors – crop and livestock production, fisheries, aquaculture and forestry – manage significant parts of the land, freshwater and oceans. They depend on biodiversity and the ecosystem services it provides. But they also affect biodiversity in both positive and negative ways, impacting on livelihoods, food security and nutrition. FAO’s projects, programmes and knowledge products help countries use, conserve and restore biodiversity in agrifood systems. This work is a key priority for FAO in its efforts to achieve its vision of a sustainable and food secure world for all. FAO Climate Change & Biodiversity #Biodiversity [email protected] Key facts and figures 3 out of 4 crops, representing 35 percent of global food production, depend, at least in part, on animal pollination Soils are a major reservoir of biodiversity. There are more living organisms in a teaspoon of healthy soil than there are people on Earth! About 50 000 wild species globally are fished, gathered, logged or harvested for food, energy, medicine, materials or other purposes Coral reefs provide vital habitat for 25 percent of the world’s known marine species Livestock diversity includes a pool of around 38 species of domesticated birds and mammals, with more than 8 200 breeds currently used for food and agriculture $(document).ready(function () { var prop = { slidesPerView: 1.2, spaceBetween: 30, breakpoints: { 720: { slidesPerView: 2.5, spaceBetween: 30, }, }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true, loopAdditionalSlides: 4 } prop = Object.assign(prop, autoplayProp); var swiperCardHalf = new Swiper('#swiperCardHalf-1', prop); }); Publications Action Plan for the implementation 2024–2027 01/05/2024 The Action Plan reflects experiences gained from the implementation of the 2021–2023 Action Plan. FAO Strategy on Mainstreaming Biodiversity across Agricultural Sectors 01/02/2020 The FAO strategy on mainstreaming biodiversity was approved at the FAO Conference in 2019. Publications Framework for Action on Biodiversity for Food and Agriculture 01/05/2022 The Framework for Action on Biodiversity for Food and Agriculture was endorsed by the FAO Council in 2021. FAO at COP16"
