 or p... 24/ 2 2025 25/2 2025 FAO global roadmap inception workshop Indonesia (Indonesia), Hybrid Event, 24/02/2025 - 25/02/2025 How agrifood systems transformation through accelerated climate actions will help achieving food security and nutrition, today and tomorrow. 3/ 2 2025 11/2 2025 FAO’s Global Forest Resources Assessment 2025 (Indonesia), 03/02/2025 - 11/02/2025 Indonesia has actively contributed to FRA through previous Remote Sensing Workshops. The assessment of 2020, for instance, used a participatory global remote sensing survey to derive independent estimates of forest area changes and enhance technical capacity, especially in developing countries. Publications The Indonesian Seas Large Marine Ecosystem: strategic action programme 19/12/2024 The Strategic Action Programme (SAP) highlights fisheries and marine regional and national action plans, developed by Indonesia and Timor-Leste fisheries... The Indonesian Seas Large Marine Ecosystem Transboundary Diagnostic Analysis 03/09/2024 The Indonesian Seas Large Marine Ecosystem is a region shared by Indonesia (98 percent) and north coast of Timor-Leste (2 percent). Characterized by... Strategic roadmap of surveillance for fisheries resources 27/07/2024 This strategic plan (roadmap) of surveillance was developed to assist policymakers with initiatives to improve monitoring, control and surveillance... $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-1', prop); }); View More FAO Member Nation since 1948 FAOSTAT Country Profile Join the conversation Tweets by FAOIndonesia Follow @FAOIndonesia Related links FAO's 4 Betters FAO Strategic Framework 2022-31 FAO Regional Office for Asia Pacific UN in Indonesia ContactFAO Representation in IndonesiaMenara Thamr