["https://www.fao.org/newsroom/detail/g20--food-security-is-vital-for-peace--stability-and-human-dignity--fao-says/en"]
title = "G20: Food security is vital for peace, stability and human dignity, FAO says"
description = "Director-General addresses meetings of G20 Foreign Ministers in South Africa and reaffirms FAO’s commitment to Global Alliance Against Hunger and Poverty"
full_description = "Director-General addresses meetings of G20 Foreign Ministers in South Africa and reaffirms FAO’s commitment to Global Alliance Against Hunger and Poverty Conflict, policy failures, and extreme climate events threaten our ability to ensure stable agrifood systems and risk deepening global inequalities. Johannesburg – Food security is about peace, stability, and human dignity, the Director-General of the Food and Agriculture Organization of the United Nations (FAO), QU Dongyu, told G20 Foreign Ministers gathered in Johannesburg to discuss the global geopolitical situation. According to the latest UN figures, 733 million people worldwide face chronic hunger, 2.3 billion are food insecure, and 2.8 billion lack access to healthy diets. Conflict remains one of the greatest threats to food security, from the Sahel and Haiti to Ukraine and Gaza. At the same time, the continued neglect of agrifood systems in regions vulnerable to instability accelerates economic collapse and adds to conflict. In Chad, the Democratic Republic of Congo, Mali, Niger, Nigeria, and Sudan, for example, the degradation of agrifood systems – intensified by policy failures - has increased tensions between farmers and pastoralists competing for limited resources. Beyond conflict and policy failures, the intensity and frequency of extreme climate events add to the challenges. Rising temperatures and extreme weather disrupt food production, increase risks for farmers, affect disease patterns, and accelerate migration, all of which undermine efforts to end hunger by 2030. “These challenges threaten our ability to ensure stable agrifood systems and risk deepening global inequalities,” Qu told the meeting on Thursday. The Director-General said addressing such inequalities is critical since many weaknesses in our agrifood systems arise from unequal access to innovation, technology, natural resources, and healthy diets. In this context of risks and uncertainties, international trade plays a critical role in global food security by ensuring food moves efficiently from surplus to deficit regions."
year_published = 2002
year_updated = 2008
