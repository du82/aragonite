description = "This is the Homepage for the FAO Regional Office for Europe and Central Asia website"
full_description = '''News FAO, Republic of Moldova join forces to better train and support farmers News FAO and Azerbaijan partner for better health outcomes through strengthened food consumption data News FAO assists in developing an aquaculture and fisheries workplace safety code for Central Asia and the Caucasus News Building bridges: Tourism and rural enterprises collaborate for growth News Embracing One Health for Sustainable Development in Bosnia and Herzegovina $(document).ready(function () { var prop = { pagination: { el: '.swiper-pagination', }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperHero = new Swiper('#swiperHero-1', prop); }); FAO Regional Office for Europe and Central AsiaIn their pursuit to ensure an equitable and sustainable future, governments can rely on FAO expertise in food and agriculture. Responding to the needs of Europe and Central Asia, the Organization is offering support in many specific areas. Find out more Highlights News Kyrgyzstan joins the Green Agriculture Initiative as a Pilot Country News FAO and the European Union provide grants of up to USD150 000 to support aggregation models in berry and vegetable production Regional Priority Programmes The three Regional Priority Programmes provide an integrated, programmatic approach to addressing the region’s priority issues, and guide the implementation of country programmes. Most of FAO’s work in the region contributes to one or more of these priority programmes, with food and nutrition security as a cross-cutting area of work. Regional Priority Programme Empowering smallholders, family farms and youth through inclusive rural transformation, digitalization and innovation Regional Priority Programme Transforming food systems and facilitating market access and integration Regional Priority Programme Managing natural resources sustainably and preserving biodiversity in a changing climate Recent and upcoming events 3/ 3 2025 World Wildlife Day 2025 in Russia Hybrid Event, 03/03/2025 World Wildlife Day is celebrated annually on March 3. To highlight the importance of the unique roles and contributions of wildlife to people and the planet, FAO Liaison Office with the Russian Federation together with its partners organizes a press conference at TASS News Agency and a conference at the UN House in Moscow on the 3 March 2025. 2/ 4 2025 3/4 2025 FAO at the 2025 UNECE Regional Forum on Sustainable Development Hybrid Event, 02/04/2025 - 03/04/2025 The UN Economic Commission for Europe (UNECE) Regional Forum on Sustainable Development is an annual, inclusive intergovernmental forum to support follow-up and review of progress on the 2030 Agenda for Sustainable Development and the Sustainable Development Goals (SDGs) at the regional level. It will be organized from 2-3 April 2025 under the theme: “Advancing sustainable, inclusive, science- ... Featured publications Food recovery and distribution 2025 This report provides guiding principles and recommendations for policymakers to use in analysing and reviewing their legal and policy frameworks in order to facilitate food recovery and redistribution as integral elements of broader strategies to prevent and reduce food loss and waste. Its main objective is to support the implementation of policies, as well as legal and regulatory actions, that can reduce food loss and waste along food supply chains. National gender profile of agriculture and rural livelihoods: Georgia 2025 The first Country Gender Assessment for Georgia was initiated in 2018, providing an overview of gender dynamics in agriculture and rural development. This comprehensive assessment reviews the progress made since 2018, highlighting critical gaps, new and persistent challenges and progress achieved. In depth Our work Regional Technical Platform on Green Agriculture FAO responds to the Ukraine crisis Regional Knowledge Platform on One Country One Priority Product (OCOP) in Europe and Central Asia Green Agriculture newsletter Making school meals tasty $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-1', prop); }); Global Call for Submissions: Food security and nutrition in protracted crises Benchmark for world food commodity prices down in January FAO’s 80th anniversary The quest for healthy diets Multimedia Shades of Green. Advancing agrifood systems in Europe and Central Asia Sowing the future: Agritourism and sustainable food systems in Albania Restoring agriculture in Ukraine: FAO and WFP's mine action initiative Podcast | Harvesting progress and equality: Voices of Türkiye's rural women Transforming rural communities in Uzbekistan with climate-smart agriculture Podcast | A Woman Scientist Dangerous Work to Rehabilitate Land in Ukraine $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-2', prop); }); Join the conversation @FAO Key Documents Contact20 Kalman Imre utcaH-1054 BudapestHungaryTel: +36 1 4612000Fax: +36 1 3517029E-mail: [email protected]'''
