["http://www.fao.org/partnerships/en"]
title = "Partnerships | Food and Agriculture Organization of the United Nations"
full_description = "The Food and Agriculture Organization of the United Nations (FAO) is convinced that hunger and malnutrition can be eradicated in our lifetime. To meet the Zero Hunger Challenge, political commitment and major alliances with key stakeholders are crucial. Partnerships are at the heart of FAO’s mission to help build consensus for a world without hunger. The effectiveness and credibility of the Organization as a policy-making forum and unique multilingual centre of excellence, knowledge and technical expertise depends to a considerable degree on its ability to work and develop strategic partnerships. Only through effective collaboration with governments, civil society, private sector, academia, research centres and cooperatives, and making use of each other’s knowledge and comparative advantages, can food insecurity be defeated. As a specialized agency of the United Nations, FAO offers its partners a unique opportunity to work at the forefront of efforts to achieve Zero Hunger. Any organization interested in working together to end hunger and all forms of malnutrition is invited to join us."
