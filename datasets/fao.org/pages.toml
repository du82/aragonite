["https://www.fao.org/transparency/en"]
title = "Transparency Portal | Food and Agriculture Organization of the United Nations"
description = "Advancing transparency and accountability are key to FAO’s mission to eradicate hunger and ensure global food security. By making our voluntary contributions data more available and accessible, we aim to provide a comprehensive picture of how and where resources are used, and the results we’ve achieved with the support of our Members and partners."
full_description = "Transparency and accountability are key to ensuring efficiency and maximizing impact of FAO’s efforts to eradicate hunger and ensure global food security. By making our voluntary contributions data more available and accessible, we aim to provide a comprehensive picture of how and where resources are used, and the results we’ve achieved with the support of our Members and partners. Use the information in this portal to discover how FAO is working to create more efficient, inclusive, resilient and sustainable agrifood systems which leave no one behind. Explore dynamic information on FAO’s work around the world. View and analyze project data by location, recipient, resource partner, OECD sector, SDG, and the Four Betters of FAO’s Strategic Framework. Voluntary contributions provided by Members and other resource partners help to support FAO’s work to create a world without hunger and poverty. View funding overviews by year and explore where the money goes. The Technical Cooperation Programme (TCP) allows FAO to draw from its own regular programme resources and respond to countries’ most pressing needs for technical assistance. Evaluations in FAO help us deliver results for achieving a world without hunger and poverty by fostering evidence-based decision-making. The Office of the Inspector General provides independent oversight of FAO’s programmes and operations, through internal audit and investigations. AIDmonitor gathers information from the OECD DAC and offers a platform to analyze Official Development Assistance (ODA) flows and climate-related development finance with a focus on agrifood systems. It helps users determine priorities for assistance and formulate resource mobilization strategies. As a partner agency for the Global Environment Facility (GEF), FAO supports countries worldwide in addressing the complex challenges at the nexus between the environment, agriculture, forestry, marine and freshwater resources. As part of FAO’s commitment to transparency in the implementation of its programmes, contributing to improved accountability, coordination and effectiveness of our work towards the 2030 Agenda, FAO joined IATI, the International Aid Transparency Initiative, originally launched in 2008 at the High Level Forum on Aid Effectiveness in Accra. IATI was designed with the aim to publicly disclose information on development expenditures and meet the needs of all stakeholders for information on where, when, by whom, how and on what development funds are spent."
year_published = 2025
