full_description = '''News Sustainable School Feeding Network Joins the Global Alliance Against Hunger and Poverty Under the executive secretariat of FAO, the Sustainable School Feeding Network (RAES) is a Brazilian government initiative currently comprising 17 countries. Its participation in the Global Alliance aims to strengthen school feeding in the region News FAO highlights the cooperative model as a key driver in the fight against hunger and poverty The Organization emphasized its crucial role in transforming agrifood systems during the launch of the Regional Agenda for the International Year of Cooperatives 2025 News FAO Food Price index declined in January 2025 mostly due to lower sugar, vegetable oil and meat prices News FAO highlights pulses as seeds of hope for the transformation of agrifood systems Hosted by the Government of Peru, the World Pulses Day commemoration aims to promote the cultivation of these edible seeds, which accounted for 96 million tons worldwide in 2022 News FAO Calls for Integrating Food Security into Amazon Conservation The first Donors’ Roundtable, held at the ACTO headquarters in Brasilia, aims to align and mobilize investments and strengthen international cooperation in the region News CELAC moves forward with the consolidation of the Food Security, Nutrition and Hunger Eradication Plan The CELAC Ministers of Agriculture reviewed the Plan's results and progress one year after it was updated News New UN Report: 74 percent of Latin American and Caribbean countries are highly exposed to extreme weather events, affecting food security Climate variability and extreme weather events (such as droughts, floods, and storms) are reducing agricultural productivity, disrupting food supply chains, increasing prices, impacting food environments, and threatening progress in reducing hunger and malnutrition in the region $(document).ready(function () { var prop = { pagination: { el: '.swiper-pagination', }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperHero = new Swiper('#swiperHero-1', prop); }); Highlights 4 Betters Learn about the FAO Strategic Framework 2022-2031 Live Regional overview of food security and nutrition in latin america and the caribbean 2024 Stories Stepping boldly into Guyana’s aquaculture space 31/01/2025 Weaving new futures 10/12/2024 Story Bringing the right to food closer to communities in Latin America and the Caribbean 23/10/2024 Seleni Grajales 16/10/2024 Lauriel Williams 16/10/2024 $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-1', prop); }); Events 18/ 3 2025 Series: Promoting the blue economy for sustainable fisheries and aquaculture in Latin America and the Caribbean Virtual Event, 18/03/2025 About the webinarThis webinar, organized by the Food and Agriculture Organization of the United Nations (FAO) and the World Bank, highlights the critical role of the blue economy in driving sustainable development across the region. The event will delve into innovative strategies for protecting ocean resources, fostering resilient coastal communities, and ensuring ... 18/ 3 2025 19/3 2025 Strengthening rural livelihoods and environmental conservation through social protection 18/03/2025 - 19/03/2025 The Global Alliance Against Hunger and Poverty launched by the Brazilian G20 presidency in November 2024, aims to support and accelerate efforts to eradicate hunger and poverty (SDGs 1 and 2), reduce inequalities (SDG 10), reinvigorate global partnerships for sustainable development (SDG 17), and achieve other interlinked goals of the 2030 Agenda to promote inclusive and sustainable transitions. 10/ 2 2025 World Pulses Day 2025 Hybrid Event, 10/02/2025 Pulses bring diversity to our agrifood systems in multiple ways: on the farm, in our diets and through value-added products. They boost biodiversity on farms by enriching cropping systems with more species. With more than 100 types of pulses available, farmers have many options for crop rotations and/or intercropping. Consumers can enjoy pulses as part of healthy diets. Featured video Key Documents Publications How to use antibiotics effectively and responsibly in poultry production - for the sake of human and animal health 2024 The use of antibiotics and thus the threat of antimicrobial resistance (AMR) can be reduced by adopting the right husbandry practices. This publication provides practical tips to the livestock producer aiming at improving animal health and hence the reduced use of antibiotics FAO's four priorities in Latin America and the Caribbean Better production Better nutrition Better environment Better life In depth 38 FAO Regional Conference for Latin America and Caribbean 18 to 21 March, 2024, Georgetown, Guyana Spain - FAO Program for Latin America and the Caribbean Ibero-American and Caribbean Cooperation for #FoodFirst and Sustainable Development Brazil-FAO International Cooperation Program Alliance for the promotion of sustainable development and food security in the region Mesoamérica Hunger-Free AMEXCID-FAO Promoting public policies and innovative solutions for food security and sustainable rural development. We are all connected how our health is linked to that of animals, plants and the environment. FAO Campus Courses of self-study, semi face-to-face and virtual with tutor. African Swine Fever Recommendations to prevent spread. Central American Dry Corridor Stories and facts about this "land of opportunities" in El Salvador, Guatemala and Honduras. Parliamentary front against hunger More than 400 legislators work with FAO, the Spanish Cooperation and AMEXCID 1000 Digital Villages in Latin America and the Caribbean Initiative Rural tourism experiences and digitization in Latin America and the Caribbean. $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-2', prop); }); Global Globally Important Agricultural Heritage Systems (GIAHS) Discover the systems in Latin America globally recognized as agricultural heritage. One Country One Priority Product Global action on green development. World Food Day Water is life, water is food. October 16, 2023. Leave no one behind. Gender Equality Empowering women in food and agriculture. Global School Feeding Platform Technical resources for experts and practitioners. Data on food and agriculture Free access to data from more than 245 countries. $(document).ready(function () { var prop = { slidesPerView: "auto", spaceBetween: 30, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperAutoCards = new Swiper('#swiperAutoCards-3', prop); }); Multimedia Official video Regional Overview 2024 04/02/2025 FAO's 80th anniversary - 365 days of action 01/01/2025 iframe div.visualAudible__header { display: none !important; } FAO Brief - 9 December 2024 04/12/2024 In this episode: FAO calls for urgent agricultural aid to the Democratic Republic of the Congo amid the severe food insecurity in the country; a new FAO report offers guidance on integrating nutrition goals into international food trade policies; and, in Riyad, Saudi Arabia, FAO joins global call... Related Links FAO Flickr Gallery Join the conversation@FAOcaribbean Press contact Communications unit Santiago, Chile.Phone: (+56) 229 232 100 Go to Top .panorama-portada { transition: opacity 0.5s