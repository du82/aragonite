title = "FAO at COP16.2"
description = "The FAO COP16 website offers event updates, daily schedules, news, and insights on FAO’s work in integrating biodiversity into agriculture. Explore multimedia content and key initiatives aligned with the Kunming Montreal Global Biodiversity Framework."
full_description = '''FAO at COP16.2 The 2024 United Nations Biodiversity Conference, including the sixteenth meeting of the Conference of the Parties (COP16) to the Convention on Biological Diversity (CBD), was held in Cali, Colombia from 21 October to 1 November 2024, under the theme “Peace with Nature”. Countries were able to adopt several key and monumental decisions, however a number of draft decisions were not considered by the final plenary and are therefore pending adoption. The COP16.2 meeting will resume from 25 to 27 February 2025, at FAO Headquarters, in Rome, Italy. Key discussions will focus on mobilizing resources for biodiversity, finalizing methods to monitor progress of the Kunming-Montreal Global Biodiversity Framework (KMGBF), and strengthening cooperation with international organizations. For FAO, COP16.2 is a crucial moment for dialogue, knowledge sharing, and decision-making on the key role that agrifood systems hold as solutions to addressing biodiversity loss. At COP16, in Cali, FAO launched the Agri-NBSAPs Support Initiative, together with the Government of Colombia and the CBD Secretariat. This initiative aims to provide targeted support to governments across agrifood sectors, to integrate agrifood solutions into national targets and national biodiversity strategies and action plans (NBSAPs) and to achieve the KMGBF. ​ Guided by its Strategy on Mainstreaming Biodiversity across Agricultural Sectors, FAO works to reduce the negative impacts of agriculture on biodiversity, promote sustainable agricultural practices, contribute to the conservation, restoration and sustainable use of biodiversity and ensure fair and equitable sharing of the benefits through the utilization of genetic resources. Daily schedule of events Rome, Italy | FAO Headquarters | 24-27 February 2025 February 24 - Side event to COP16.2 Meeting people’s needs through sustainable use of biodiversity within agrifood systemsTime: 24 February 2025, 17:30-19:00 (CET)Venue: FAO Headquarters, Plenary HallOrganizers: FAO, CBD Secretariat, Government of ColombiaLivestream: UN Web TVBuilding on the momentum from the Ministerial Luncheon and the launch of the Agri-NBSAPs Support Initiative at COP16, FAO will organize this event, together with the CBD Secretariat and the Government of Colombia, to increase support for the Initiative. The event will feature high-level speakers, discussions on mainstreaming biodiversity across agricultural sectors, and the presentation of the Agri-NBSAPs Support Initiative. Following the event, a cocktail reception will be hosted, serving as the official reception for the resumed session of COP16 and the inauguration of the exhibition space in the atrium. More information February 24-28 - Digital Exhibit Digital Exhibit: "Biodiversity for Food Security"Time: 24-28 February 2025Venue: FAO AtriumOrganizer: FAOExplore how biodiversity powers our food systems! This immersive digital exhibit showcases the vital role of biodiversity in ensuring food security, resilience, and sustainability. Opening on 24 February at 19:00 (CET). Cali, Colombia | 21 October - 1 November 2024 October 19 - Biodiversity capacity-building and development forum The Biodiversity Capacity-Building and Development Forum 2024Time: 11:00 to 12:30 (GMT-5)Venue: CG1 Malpelo - Plaza 1 - Centro de Eventos Valle del Pacifico, Cali, ColombiaOrganizers: SCBD | ColombiaProvider Perspectives: Experiences and Lessons Learned in Supporting Capacity Development for the Implementation of NBSAPs (FAO participation).The first Biodiversity Capacity-Building and Development Forum (19 Oct 2024) focused on strengthening NBSAP implementation under the Kunming-Montreal Framework. Organized by the CBD Secretariat, Colombia (COP16 Presidency), and the NBSAP Accelerator Partnership, it featured panel discussions and World Café sessions on capacity-building strategies, coordination, and monitoring. The event concluded with a plenary session, where participants shared key takeaways and recommendations. Details October 21 - Ecosystem restoration, pollinators, and biosafety Exchange of experiences in ecosystem restoration with local communities at a global levelTime: 9:00 to 11:00 (GMT-5)Venue: Green ZoneOrganizers: National ParksA global discussion on ecosystem restoration, highlighting local community experiences and collaborative efforts. DetailsPollinators in Latin America: Implementing the International Pollinator Initiative from the RegionTime: 13:20 (GMT-5)Venue: Pacifico - Indigenous Peoples and Local Communities meeting room. Plaza One - Capacity: 130 peopleOrganizers: FAO | CBD | APimondiaThe CBD and FAO have been leading efforts on the conservation and sustainable use of pollinators, with a 2018–2030 Plan of Action adopted under CBD Decision 14/6. The plan aims to align pollination activities with FAO regional and country offices for greater synergies. Its full implementation depends on available resources. The FAO Regional Office for Latin America and the Caribbean will showcase its efforts in advancing the plan. DetailsDeveloping Indicators for Targets 4 and 5: Human Wildlife-Conflict and Sustainable Use and Trade of Wild SpeciesTime: 13:20 (GMT-5)Venue: Farallones - Youth meeting room. Plaza One. Capacity: 90 peopleOrganizers: CPW | IUCN SSC HWCCSG | CIFOR | UNEP-WCMC | UNIVERSITY OF OXFORD | FAO | Nigeria | IndiaSeveral KMGBF targets address sustainable wildlife management, but comprehensive progress indicators remain lacking. The IUCN SSC Working Group has drafted an indicator for human-wildlife conflict (Target 4), while the TRADE Hub and partners developed a proposal for a binary indicator on sustainable trade (Target 5). These efforts are supported by the Collaborative Partnership on Sustainable Wildlife Management (CPW). This side event will present draft indicators, gather Party feedback, and foster dialogue on their national applicability. DetailsMainstreaming Biosafety in Legislation and PolicyTime: 18:00 (GMT-5)Venue: Atrato - Contact Group 5 meeting room, CEVP Ground floor.Organizers: CBDMainstreaming biosafety into policies and legislation enhances compliance with the CBD and Cartagena Protocol. With Target 17 of the Kunming-Montreal Global Biodiversity Framework, biosafety is more relevant than ever. This event will present the Biosafety Technical Series and showcase practical experiences in policy development. Recent initiatives supporting Parties in strengthening biosafety legislation will also be shared. DetailsTowards socio-environmental protection: biodiversity conservation and sustainable livelihoods in rural areas - Lessons and Opportunities from LACTime: 13:30 p.m. to 15:00 p.m.Venue: Blue ZoneOrganizers: IDBDetailsOceans in PeaceTime: 16:00 p.m. to 18:15 p.m. (GMT-5)Venue: Green ZoneOrganizers: InvemarThis session DetailsPacific StandsTime: N/AVenue: Green Zone, Plaza San FranciscoOrganizers: Biocultural Pacific Project Coordination with CVCThis session Details October 22 - NBSAPs, genetic resources, and Indigenous leadership NBSAP DayTime: Venue: Kunming-Montreal Global Biodiversity Framework Pavilion Organizers: International Public Procurement ForumTime: 8:00 a.m. (GMT-5)Venue: Green ZoneOrganizers: ANCPC | MinAmbiente | GIZ | FAO | OEAThe ITPGRFA, a tool to advance the implementation of the objectives of the CBD and a commitment towards a more sustainable and equitable use of genetic resourcesTime: 9:45-12:15 (GMT-5)Venue: Cali Chamber of Commerce - Multiple Room 1, Green ZoneOrganizers: AGROSAVIA | Alliance of Bioversity International and CIATSide event/Forum. This forum aims to foster a deeper understanding of the FAO International Treaty on Plant Genetic Resources for Food and Agriculture (ITPGRFA) at global and national levels, and to highlight the critical benefits from Colombia’s ratification of the International Treaty.A global knowledge service for biodiversity (GKSSB) – supporting Parties’ needs for monitoring implementation of the KM-GBFTime: 11:40 a.m. (GMT-5)Venue: Atrato - Contact Group 5 meeting room, CEVP Ground floor. Capacity: 212 peopleOrganizers: FAO | UNEP-WCMC | CBD | EC | JRCEC | Comisión Nacional para el Conocimiento y Uso de la Biodiversidad (Mexico’s government) | BMUV | Ramsar convention on wetlandsDetailsIndigenous Youth as guardians and restorers of Biological DiversityTime: 11:40 a.m. (GMT-5)Venue: Pacifico - Indigenous Peoples and Local Communities meeting room, Plaza One. Capacity: 130 peopleOrganizers: PAHO | WB | FAO LAC | CBD | Arramat | ILC | FILAC | Youth Climate Justice Fund | UNFPA | FIAYDetailsIndigenous Peoples’ Contributions to the Kunming Montreal Global Biodiversity Framework: The Costa Rican National Plan on Indigenous Peoples’ Biocentric Restoration and the ongoing work in the South Andean regionTime: 13:20 p.m. (GMT-5)Venue: Cocuy - Marie Khan Women's Caucus meeting room, Plaza On. Capacity: 90 peopleOrganizers: GCR | FAO | IIFB | Mesa Indigena | INBRADetailsForging Integrated Ecosystem-based Solutions: Sustainable Soil Management in Black Soil Regions for RIO convention synergiesTime: 18:00 p.m. (GMT-5)Venue: Pacifico - Indigenous Peoples and Local Communities meeting room, Plaza One. Capacity: 130 peopleOrganizers: Brazil | CBD | FAO | Alliance Bioversity and Ciat/CGIARDetailsCelebrating Colombia’s Ratification of the International Treaty on Plant Genetic Resources for Food and AgricultureTime: 19:30-22:00 p.m. (GMT-5)Venue: FutureSeeds, CIAT Campus – Palmira, Valle del CaucaOrganizers: AGROSAVIA | Alliance of Bioversity International and CIAT | FAO-ITPGRFACocktail and Exhibit. This event celebrates Colombia's recent ratification of the FAO International Treaty on Plant Genetic Resources for Food and Agriculture. It is co-hosted by the Colombian Ministry of Agriculture and Rural Development, the Alliance of Bioversity International and CIAT, and the International Treaty Secretariat at the CIAT 'FutureSeeds' genebank. October 23 - Biodiversity action, Education Day, and sustainable management Red Parks CommitteeTime: 8:00 a.m. to 12:00 p.m.Venue: Blue ZoneOrganizers: N/APutumayo We Are AmazoniaTime: 10:00 a.m. (GMT-5)Venue: Green ZoneOrganizers: Government of PutumayoCollaborative Action for Sustainable Wildlife Management - Highlights from Joint Initiatives of Collaborative Partnership on Sustainable Wildlife ManagementTime:11:40 a.m. (GMT-5)Venue: Cocora - Subnational and Local Authorities meeting room, Plaza One. Capacity: 86 peopleOrganizers: CPWDetailsEducation DayTime: N/AVenue: N/AOrganizers: UNESCO | IUCN | WWFEducation Day will deliver on the May 2024 request from the Convention on Biological Diversity’s Subsidiary Body on Implementation to set out the framework of a Global Plan of Action for Education on Biodiversity, encompassing formal, non-formal, and informal education. DetailsReviving the CBD Initiative on Biodiversity for Food and Nutrition: a catalyst for the Kunming-Montreal Global Biodiversity FrameworkTime: 15:00 (GMT-5)Venue: Nuquí - Academia & Research meeting room, Plaza One. Capacity: 86 peopleOrganizers: Brazil | CBD | FAO | Alliance Bioversity and Ciat/CGIARDetailsAfrica and the Pacific align regional biodiversity strategies and action plans with the Kunming-Montreal Global Biodiversity FrameworkTime: 15:00 (GMT-5)Venue: Cocuy - Marie Khan Women's Caucus meeting room, Plaza One. Capacity: 86 peopleOrganizers: SADC | SPREP | FAO | AU | EACDetailsLand use and land tenure for biodiversity: Towards a headline indicator for T22 of CBD’s Global Biodiversity FrameworkTime: 15:00 (GMT-5)Venue: Cocora - Subnational and Local Authorities meeting room, Plaza One. Capacity: 86 peopleOrganizers: FAO | ILC | FPP | WRIDetailsAfrica and the Pacific align regional biodiversity strategies and action plans with the Kunming-Montreal global biodiversity frameworkTime: 15:00 (GMT-5)Venue: Farallones - Youth meeting room (Plaza One) / Online.Organizers: FAO | AU | EAC | SADC| SPREPDetailsYouth leadership and agroecology catalyzing biodiversity conservation in agri-food systemsTime: 16:30 (GMT-5)Venue: Cocuy - Marie Khan Women's Caucus meeting room, Plaza One. Capacity: 90 peopleOrganizers: WFF | GYBN | FAODetailsAmazon Forest Update: a Regional Challenge until COP30Time: 17:30-19:00 (GMT-5)Venue: EU PavilionOrganizers: FAO | Amazon Cooperation Treaty Organization – ACTO | MADS | MAATEDetailsGlobal Mountain Governance: Importance for building synergies between biodiversity conservation and climate change adaptationTime: 6:00 p.m. to 7:30 p.m.Venue: Blue zoneOrganizers: N/AMountains AllianceTime: N/AVenue: Colombian Pavilion - Blue ZoneOrganizers: Italian AgencyBiodiversity CongressTime: AfternoonVenue: Blue ZoneOrganizers: Parliamentary ForumBIBO EventTime: N/AVenue: Green zoneOrganizers: Sustainable Landscapes Project - HeCoInternational Public Procurement ForumTime: 3:00 p.m. (GMT-5)Venue: Green ZoneOrganizers: ANCPC | MinAmbiente | GIZ | FAO | OEAForest Seminar. Contributions in the GCF seminar - Vision AmazoniaTime: N/AVenue: Green zoneOrganizers: N/A October 24 - Biodiversity, health, sustainable food systems Biodiversity and HealthTime: 8:00 a.m. to 18:00 p.m.Venue: Green zoneOrganizers: FAO | WHO | UNEP | SCBDThe aim of the Biodiversity and Health Day at COP 16 is to raise awareness about the interlinkages between biodiversity and health, in line with the view that the health of the environment and the health of all species are interconnected and interdependent, and that a whole-of-government and whole-of-society approach is required to mainstream that view into national policies and strategies. Details11picosTime: 10:10 (GMT-5)Venue: Sumapaz - JUSCANZ meeting room. Plaza One. Capacity: 112 peopleOrganizers: FAO | ABC | Comisión Nacional para el Conocimiento y Uso de la Biodiversidad (Mexico’s government) | IIFB | JP | somos naturalezaDetailsLeveraging Nature Positive Agriculture to Achieve Sustainable Food Systems and meet multiple GBF TargetsTime: 11:40 (GMT-5)Venue: Sumapaz - JUSCANZ meeting room. PlOrganizers: World Banana Forum/FAO | Alliance of Bioversity-CIAT | Belgium | WWF | BAIF | Fundación Alpina DetailsPerspectives on Fisheries Place in the Kunming-Montreal Global Biodiversity Framework Time: 13:20 (GMT-5) Venue: Sumapaz - JUSCANZ meeting room. Plaza One. Capacity: 112 people Organizers: FAO | CBD | IUCN-CEM-FEG | Japan | Indonesia | DFO DetailsImplementing the Global Biodiversity Framework: How UN-Oceans can support States in meeting their obligations under the GBF with a focus on the ocean-biodiversity-climate nexusTime: 16:30 (GMT-5), 24 OctoberVenue: Sanquianga - GRULAC meeting room. Plaza One. Capacity: 136 peopleOrganizers: FAO | UN-Oceans | CTED | DESA | UNDOALOS | CBD | UN ESCAP | IOC | IAEA | ILO | IMO | ISA | ODA | UN-OHRLLS | OHCHR | UNHCR | CITES | CMS | UNFCCC Secretariat | UNESCO | UNCTAD | UNDP | UNEP | UNIDO | UNITAR | UNOPS | UNU | WB | WMO | UNWTODetailsSustaining Aquatic Biodiversity Through Resilient Food Systems: Integrating Conservation and Human Well-Be'''
