["https://www.fao.org/neareast/en"]
title = "Home | FAO Regional Office for Near East and North Africa"
description = "Homepage for the FAO Regional Office for Near East and North Africa"
full_description = '''News Pioneering food safety: Building resilient agrifood systems for tomorrow FAO launches Regional Food Safety Research Network and Innovation Hub to transform agrifood systems in the Near East and North Africa News PM directs to form an investigative committee regarding the rumors of buffalo and cows being infected with foot-and-mouth disease (NINA) News FAO hosts a workshop on sustainable agrifood Systems in the Near East and North Africa region Representatives from the region share best practices to strengthen agrifood Systems through the FAO's One Country One Priority Product Initiative News The Near East Network on Wildlands Forest Fire wraps up a workshop on integrated fire management for post-fire restoration practices in Morocco News FAO and Islamic Development Bank Strengthen Partnership to Transform Agrifood Systems New momentum for climate-resilient agriculture and food security under renewed collaboration News Revitalizing Lebanon’s chickpea sector $(document).ready(function () { var prop = { pagination: { el: '.swiper-pagination', }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperHero = new Swiper('#swiperHero-1', prop); }); Highlights World Food Day in the Near East and North Africa region World Food Day: AbdulHakim Elwaer, FAO Assistant Director- General & NENA Regional Representative Regional Priorities Priority 1: Rural transformation and inclusive value chains Priority 2: Food security and healthy diets for all Priority 3: Greening agriculture, water scarcity, and climate action Priority 4: Building resilience to multiple shocks Action Areas Red Palm Weevil Eradication Programme The Red Palm Weevil (RPW) Eradication Programme facilitates the coordination of regional efforts to ensure an integrated and sustainable approach to controlling the RPW and reducing its devastating effects on date palm production, the food and income security of rural communities, and the ecology of affected areas. Youth empowerment Young men and women have a key role to play in fostering sustainability, equity and resilience of agrifood systems in the Near East and North Africa (NENA) region. FAO works with youth across the region to improve their access to high quality education and training, decent employment, rural institutions and critical assets and services, in agrifood value chains. Sustainable and Inclusive Agrifood Value Chains Sustainable and inclusive agrifood value chains development is a market-oriented and systems-based approach for assessing, understanding and improving the performance of agrifood value chains, to ensure their economic, social, and environmental and climate sustainability. The UN Decade of Family Farming The UN Decade of Family Farming 2019-2028 (UNDFF) aims to shed new light on what it means to be a family farmer in a rapidly changing world and highlights more than ever before the important role family farmers play in eradicating hunger and shaping the future of our agri-food systems. Addressing climate change in agrifood systems FAO’s climate change activities aim to strengthen capacities of member countries to build resilient agrifood systems, and to plan, implement and report on climate change adaptation and mitigation actions in the agriculture sectors. Rural advisory services for inclusive transformation in the Near East and North Africa Rural advisory services (RAS) have a central role in equipping farmers with the knowledge and skills to cope with challenges and empower them to make informed decisions, link to markets and act collectively to improve their livelihoods and claim their agency in inclusive rural transformation. The Regional Initiative on Water Scarcity for the Near East and North Africa In order to help NENA countries address the food and water security challenges, the FAO’s Regional Office in the Near East and North Africa and its partners established the Water Scarcity Initiative. Gender equality and women’s empowerment for inclusive food systems transformation The Regional Office has a stand-alone programme of work on gender equality and women’s empowerment that addresses gender as a cross-cutting theme in all its regional priorities and initiatives. One Country One Priority Product: Global Action on Green Development of Special Agricultural Products The Global Action on Green Development of Special Agricultural Products (SAPs): One Country One Priority Product (OCOP) was launched by the FAO Director General in 2021. The initiative will aim to support countries in transforming their agrifood systems to be more sustainable, efficient, resilient and inclusive. Social inclusion In NENA countries, poverty is predominantly rural. With small scale producers – including fishers and pastoralists – and landless rural workers facing growing marginalization, rural communities are left increasingly vulnerable to economic, political and environmental shocks. This and the high prevalence of gender disparities, youth unemployment, child labour and other forms of exclusion constitute a significant barrier to more equitable agrifood systems in the region. $(document).ready(function () { var prop = { slidesPerView: 1.2, spaceBetween: 30, breakpoints: { 720: { slidesPerView: 2.5, spaceBetween: 30, }, }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true, loopAdditionalSlides: 4 } prop = Object.assign(prop, autoplayProp); var swiperCardHalf = new Swiper('#swiperCardHalf-1', prop); }); Stories Championing gender-responsive practices: Regional capacity-strengthening for FAORNE 15/12/2024 "Innovating for Inclusion: Empowering People with Disabilities in Agrifood Systems” 22/10/2024 Towards a Sustainable Future: Empowering rural women in Saudi Arabia through sustainable rural agriculture 17/10/2024 Blogs FAO Assistant Director- General A path to end hunger and malnutrition in the Arab States: Can innovative and strategic financing accelerate transformation of Agrifood systems? by Abdulhakim Elwaer, FAO Assistant Director-General and Regional Representative for the Near East and North Africa - 18/12/2024 In 2023, the Arab States faced a significant escalation in hunger and malnutrition. A staggering 14 percent of the population, equivalent to 66.1 million people, suffered from hunger. .sf-icon-comment { fill: #cdd4d9; } FAO Assistant Director- General UNCCD COP16: FAO’s role in building resilient agrifood systems and restoring NENA’s landscapes by Abdulhakim Elwaer, FAO Assistant Director-General and Regional Representative for the Near East and North Africa - 02/12/2024 As global attention converges on Riyadh, Saudi Arabia, for the 16th session of the Conference of the Parties to the United Nations Convention to Combat Desertification (UNCCD COP16), the urgency to combat land degradation and desertification takes centre stage. .sf-icon-comment { fill: #cdd4d9; } Greening agriculture, water scarcity and climate action NENA’s restoration revolution: Investing in people and planet by Fidaa Haddad, Senior Programme Officer, FAO Regional Office for Near East and North Africa - 05/12/2024 The Near East and North Africa (NENA) region faces a sobering reality: about 86 percent of its total land area suffers from degradation and desertification (FAO, 2021), threatening the livelihoods of 410 million people. As climate change continues to intensify, reducing rainfall and straining water resources, the impacts on agriculture, biodiversity, and socio-economic stability grow more dire. .sf-icon-comment { fill: #cdd4d9; } FAO Assistant Director- General Investing in the planet and its people: Synergizing initiatives for accelerated climate action at the 29th Conference of the Parties by Abdulhakim Elwaer, FAO Assistant Director-General and Regional Representative for the Near East and North Africa - 19/11/2024 As the world looks ahead to the 29th session of the UN Climate Change Conference (COP29) in Baku, Azerbaijan, from 11 to 22 November 2024, the call for transformative solutions in agrifood systems is stronger than ever. In this pivotal moment for climate action, two major initiatives are set to play crucial roles: the FAST Partnership (Food and Agriculture for Sustainable Transformation) .sf-icon-comment { fill: #cdd4d9; } Opinions The Right to Food in the Maghreb and Middle East: A Critical Moment for Action by Juan Echanove - 11/11/2024 The right to food is a fundamental human right that ensures every person has access to adequate, safe, and nutritious food that meets their dietary needs for an active and healthy life. It is not just about having enough food to survive but about having food that is appropriate, available, and accessible to everyone, without discrimination. .sf-icon-comment { fill: #cdd4d9; } Technical Expertise Strengthening urban-rural food systems through local production and food waste reduction by Ahmad Mukhtar, FAO Senior Economist and Fidaa Haddad, Senior Programme Officer - 30/10/2024 Urbanization in the Near East and North Africa (NENA) region is rapidly accelerating, bringing with it both opportunities and immense challenges. With projections showing that by 2050, 73 percent of the population will live in cities, surpassing 450 million people, food systems in the region are under extreme pressure to meet growing urban demands. .sf-icon-comment { fill: #cdd4d9; } Greening agriculture, water scarcity and climate action Leading the way: Gulf countries' efforts in mangrove restoration by Fidaa Haddad, Senior Programme Officer, FAO Regional Office for Near East and North Africa - 26/07/2024 On the International Day for the Conservation of the Mangrove Ecosystem, we delve into the vital importance of mangroves. These unique coastal ecosystems provide critical habitats for a myriad of marine and terrestrial wildlife. .sf-icon-comment { fill: #cdd4d9; } Greening agriculture, water scarcity and climate action Combating sand and dust storms in MENA: the role of tree plantation by Fidaa Haddad, Senior Programme Officer, FAO Regional Office for Near East and North Africa - 12/07/2024 As we celebrate the International Day of Combating Sand and Dust Storms 2024, it is crucial to delve deeper into the complexities of this issue. Sand and dust storms (SDS) are natural phenomena driven by a combination of environmental and human-induced factors. .sf-icon-comment { fill: #cdd4d9; } Opinions Leveraging Water for Peace: FAO’s Experience in Yemen by Hussein Gadain - 03/04/2024 To leverage ‘Water for Peace,’ we urgently need to fully understand the water governance systems, how resources are extracted, used, shared and replenished. Our experience in Yemen has shown glaring gaps between policy and the ultimate use of the precious commodity. Another gap is limited funding to replicate best water management practices which have been piloted and proven effective. .sf-icon-comment { fill: #cdd4d9; } FAO Assistant Director- General Innovating today for a greener tomorrow: FAO's initiatives in the Near East and North Africa region by Abdulhakim Elwaer, FAO Assistant Director-General and Regional Representative for the Near East and North Africa - 21/03/2024 As we approach the International Day of Forests on 21st March, it's crucial to recognize the significance of forests, especially in dryland regions like the Near East and North Africa (NENA). With the region's population soaring, demands on land and water are escalating, making initiatives for greening agriculture, water scarcity, and climate action critical priorities for FAO. .sf-icon-comment { fill: #cdd4d9; } Director-General Accelerating the transformation of agrifood systems in the NENA region by QU Dongyu, Director-General, Food and Agriculture Organization of the United Nations - 27/02/2024 The MENA region faces severe water scarcity and climate shocks. As a result, we must prioritize the adaptation to climate change, as well as mitigating greenhouse gas emissions. .sf-icon-comment { fill: #cdd4d9; } Technical Expertise Success Story on collaboration by Nouf Alayyadhi - 13/11/2023 As a follow-up to a successful workshop held in 2021, RNE-HR Team took initiative once again to organize an event in June of this year, in collaboration with various HR counterparts and the FAO Office of Emergencies and Resilience, this time to highlight the critical role of Human Resources in emergency and crisis contexts. .sf-icon-comment { fill: #cdd4d9; } Opinions COP28 in Dubai: Seizing the Opportunity to Achieve Global Food Security and Sustainable, Healthy Nutrition by Mohamed Alaidaroos Alhashimi - 30/09/2023 As we prepare to host the United Nations Climate Change Conference (COP28) in Dubai, it is crucial to underscore the significance of this global platform for advancing the sustainable development agenda in the Arab region and worldwide. .sf-icon-comment { fill: #cdd4d9; } Technical Expertise Urgent need for a Regional Strategy for Sustainable Management of Transboundary Plant Pests and Diseases (TPPDs) in the Near East and North Africa by Thaer Yaseen - 07/09/2023 The Near East and North Africa (NENA) region is challenged by the continuous threat of transboundary plant pests and diseases, the introduction and spread of which is facilitated by increased trade activities, .sf-icon-comment { fill: #cdd4d9; } Partnerships & Cooperations The Strategic Partnerships and Resource Mobilization Unit (SPRM) by Kayan Jaff - 14/08/2023 The Strategic Partnerships and Resource Mobilization Unit (SPRM) is designed to promote a more systematic use of partnerships in the Near East and North Africa Region (NENA), and to provide practical guidance to FAO units and partners to facilitate the selection, prioritization, development and management of new or renewed partnerships. .sf-icon-comment { fill: #cdd4d9; } Technical Expertise Advancing Water Action