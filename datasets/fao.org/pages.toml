["https://fao.org/contact-us/scam-alert/en"]
title = "Scam Alert | FAO | Food and Agriculture Organization of the United Nations"
full_description = 'The Food and Agriculture Organization of the United Nations (FAO) is aware of various correspondences, being circulated via e-mails, from Internet Web sites, and via regular mail or fax, falsely stating that they are issued by or associated with FAO and/or its officials. These scams, which may seek to extract money and/or in many cases personal details from the recipients of such correspondence, are fraudulent. FAO assumes no responsibility for any consequences, including but not limited to, financial loss and identity theft or other, that may derive from such scams. These correspondence and documents, e-mail addresses and Web sites are crafted so that they are made to look like they originate from FAO. For example, they may contain official-looking FAO stationery, including FAO’s logo, emblem or name, or some variation thereof, and e-mail or Web site addresses, including either one or both of the words “Food and Agriculture” or "FAO" or some similar name, or the name of a real FAO entity or fictitious one. Unauthorized use of the FAO logo, emblem, name, or other names or indicia in these schemes is illegal. The relevant authorities will be informed of any such activities, of which FAO becomes aware, for appropriate action to be taken. Caution should be exercised in relation to any suspicious communication, as financial loss and identity theft could result from the sending of money or personal information to those issuing such fraudulent correspondence.'
year_published = 2025
