full_description = '''FAO in Mozambique The Food and Agriculture Organization (FAO) has worked in Mozambique since 1979. The Organization’s activities are aligned with its mandate and Strategic Framework, the UN Sustainable Development Cooperation Framework (UNSDCF), as well as with national strategies, such as the Government five-year plan (2020-2024) and the Strategic Plan for the Development of the Agrarian Sector and its National Investment Plan for the Agrarian Sector (PEDSA II/ PNISA II). FAO supports the Government to address challenges in the agriculture, livestock, forestry, fisheries, and aquaculture sectors, promoting best practices, boosting nutrition and food security as well as improving livelihoods, leaving no one behind. News Loading... function sendRequest(queryParameters) { var url = "/mozambique/home/en/GetContent/"; var urlArr = url.split("/"); var urlLang = urlArr[urlArr.length - 3]; var urlWithoutLang = url.replace("/" + urlLang + "/", "/"); var urlWithLang = urlWithoutLang +"1/" + urlLang + "/"; console.log("###", queryParameters); url = urlWithLang; return new Promise((resolve, reject) => { $.ajax({ url: url, type: 'GET', data: queryParameters, cache: false, success: function (result) { resolve(result); }, error: function(xhr, status, error) { console.error(error); reject(error); } }); }); } $(function () { //prendi i parametri in querystring e inseriscili in una variabile queryParameters var queryParameters = {}; var urlParams = new URLSearchParams(window.location.search); for (const [key, value] of urlParams) { queryParameters[key] = value; } //invia la richiesta sendRequest(queryParameters) .then((result) => { $("#search-result-container-b46a8f2b-5b86-495b-bdf7-e6c2546e16ee").html(result); }) .catch((error) => { console.error(error); }); }); View More Publications FAO e-Learning Academy Achievements for 2024 17/02/2025 FAO elearning Academy courses make a strong contribution to the UN SDG Agenda 2030 and are fully aligned with FAO’s Strate