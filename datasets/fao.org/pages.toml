["https://fao.org/contact-us/data-protection-and-privacy/en"]
title = "Data protection and privacy | FAO | Food and Agriculture Organization of the United Nations"
description = "Data protection and privacy"
full_description = "FAO is committed to treat your personal data fairly, with integrity, responsibility, security, and transparency. FAO collects and processes personal data in accordance with its internal rules and procedures on the protection of data, to the exclusion of any single national system of law. This Data Protection and Privacy Notice describes what personal information we may collect and process, the reason for processing, how we use, process and ensure protection of all data provided. It also sets out the options for you to request access, correction, deletion and to object to your data being processed by FAO. a. web-users visiting FAO websites (within the “fao.org” domain name, or any other domain officially owned by FAO) and other online services including FAO social media pagesb. participants registering for, and attending, FAO events including virtual eventsc. personnel and guests entering FAO premises (HQ and decentralized offices)d. subscribers to FAO newsletterse. users accessing FAO Knowledge Repositoryf. users accessing FAO databases, systems, blogs, forum and other similar toolsg. competitors responding to FAO’s contests. In addition to being governed by the FAO Terms and Conditions, individual platforms or tools on FAO’s website may have additional dedicated terms of use. In case of conflict, the present Data Protection and Policy Notice shall apply. For processing activities using FAO apps, please refer to the FAO Privacy Policy for the use of FAO Apps. If you visit FAO’s website, you may notice links that may direct you to websites and online platforms managed by third parties. The processing of personal data on the third parties’ platforms, including the social media platforms that host FAO’s social media pages, are governed by their own privacy policies. As reflected in the Terms and Conditions on FAO’s website, except for authorized investigations and to maintain required correspondence files, no other attempts are made to identify individual users or their usage habits. Raw data logs are used to determine the number of users and, occasionally, which general domains are accessing the FAO website. When you visit the FAO website, FAO uses third parties’ platforms that collect anonymous information about users’ browsing behaviour when users visit the website, through the use of cookies. By using the FAO website, users agree that FAO can place cookies on users’ computer, mobile phone or handheld devices."
year_published = 2025
