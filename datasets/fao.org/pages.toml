["https://www.fao.org/newsroom/story/a-more-secure-future-from-a-single-document/en"]
title = "A more secure future from a single document"
description = "Certifying land tenure rights transforms farmers’ lives in Madagascar"
full_description = "Razanamanana Philippine, a Madagascan bean farmer, says the land certificate has given her peace of mind about the investments she makes in her field. ©World Bank/Fireflies A single document is making a world of difference off the coast of southeast Africa. On the fertile island of Madagascar, more than 85 percent of the population relies on agriculture for their livelihoods. Yet one of the main obstacles farmers have faced for decades is obtaining legal rights over their land. When certified by the authorities, these land property rights are crucial for securing legal protection against rival claims. They are also critical for giving them the confidence to invest in these lands and access loans from financial institutions, which may require land as collateral. Madagascar relied on an outdated land tenure system made of fragile and fading pieces of paper stacked on high shelves in dusty offices. Securing a legal land title was a cumbersome, lengthy and costly procedure that left millions of farmers unable to prove that the land they worked was theirs. This system often resulted in recurrent land conflicts, a lack of investments in agricultural land and low economic productivity. In 2016, the Investment Centre of the Food and Agriculture Organization of the United Nations (FAO) provided technical assistance to the World Bank in the Madagascar Agriculture Rural Growth and Land Management project, known in brief as CASEF. Having identified land ownership reform as offering significant benefits to smallholder farmers, the USD 105 million project included a component to assist Madagascar in creating a modern land register using digital technology and formalizing ownership for a large number of farmers. Madagascar’s overarching aim is to issue eight million certificates by 2030. Before the project was implemented, Madagascar relied on an outdated land tenure system made of fragile and fading pieces of paper, now replaced by new maps generated by municipal land offices. ©World Bank / Rijasolo"
