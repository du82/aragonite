description = "Photo Contest"
full_description = "Are you a professional or amateur photographer or simply passionate about camelids? Join the International Year of Camelids (IYC) Photo Contest and help spread the word about the importance of these heroes of deserts and highlands! An international professional jury composed of photographers, photo editors, and camelid experts will select an overall winner. The four runners-up will go to a public vote on social media. Step 1: Choose up to five of your own photos and prepare captions.Step 2: Fill in and submit a registration form for each photo by 28 February 2025.Step 3: Stay tuned to find out who the winners are!Bonus step: Share your photos on social media with the hashtags #YearOfCamelids and #IYC2024. The jury will be comprised of an independent group of individuals with different areas of expertise in photography, science and scientific communication. The jury will select the top five photos and overall winner. The other four runners up will be posted on Facebook and a popular vote will select the second prize."
