title = "Statistics | FAO | Food and Agriculture Organization of the United Nations"
description = """
Sound and timely statistics are key to inform decisions, policies and investments that tackle issues related to food and agriculture, from hunger and malnutrition to rural poverty, from food systems productivity to the sustainable use of natural resources or to climate change.

FAO is dedicated to collecting, analysing, interpreting and disseminating food and agriculture statistics that are relevant for decision-making."""
full_description = "Guidelines for countries collecting data in line with the United Nations Statistical Commission-endorsed guidelines on food data collection in HCES FAOSTAT provides free access to food and agriculture statistics (including crop, livestock, and forestry sub-sectors) for over 245 countries and territories and covers all FAO regional groupings from 1961 to the most recent year available. FAO’s Sustainable Development Goals (SDG) Data Portal provides access to the 21 SDG indicators under FAO custodianship as well as key information to support countries in tracking progress towards SDGs. The Agricultural Market Information System (AMIS) is an inter-agency platform to enhance food market transparency and policy response for food security. It provides market information on four grains particularly important in international food markets: wheat, maize, rice and soybeans. The Food and Agriculture Microdata (FAM) Catalogue provides access to micro datasets collected through farm and household surveys which contain information related to agriculture, food security and nutrition. Sound and timely statistics are key to inform decisions, policies and investments that tackle issues related to food and agriculture, from hunger and malnutrition to rural poverty, from food systems productivity to the sustainable use of natural resources or to climate change. FAO is dedicated to collecting, analysing, interpreting and disseminating food and agriculture statistics that are relevant for decision-making. It is for this reason that developing and implementing methodologies and standards to assist countries in generating sound data and information is at the core of FAO’s statistical work. FAO also supports member countries in the collection, dissemination and uptake of data to formulate policies and plans or to better orient investments. FAO’s statistical system operates under the oversight of the Chief Statistician and consists of a statistics division, statistics units embedded in technical departments and a Data Lab for Statistical Innovation."
