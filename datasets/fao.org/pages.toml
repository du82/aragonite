full_description = '''FAO in Lebanon Lebanon joined the Food and Agriculture Organization of the United Nations (FAO) in 1945 as a founding member of the Organization. In February 1977, FAO and Lebanon signed an agreement to establish a country office in Beirut. Find out more FAO Priorities in LebanonLebanon Country Programming Framework (CPF) for the period 2023-2026 is FAO’s planning and programming strategic document to respond to the challenges faced by the agrifood system of Lebanon. The CPF aligns with the strategies outlined in Lebanon's key policy documents and sector-specific plans, namely the National Agriculture Strategy (NAS) 2020-2025, the National Water Strategy 2020-2035, the Lebanon National Forestry Programme (2015 – 2025) and the Lebanon Crisis Response Plan (LCRP) 2022-2023. The CPF is also aligned with the United Nations Sustainable Development Cooperation Framework (UNSDCF) 2022-2025 as well as the FAO Strategic Framework for 2022-2031. News News FAO and the Ministry of Agriculture Launch a Project in Anjar with Funding from the Government of the Republic of Korea News Actioning the Canada-funded "Enhancing Food and Nutrition Security in Lebanon" Project News FOOD INSECURITY DEEPENS IN LEBANON FOLLOWING CONFLICT, NEW REPORT SHOWS Ministry of Agriculture, FAO, WFP Joint News Release News Launch of the Rapid Needs Assessment on the impact of conflict on agriculture in Lebanon News Rapid geospatial analysis News FAO Lebanon's dedicated page for the response to the humanitarian crisis in Lebanon $(document).ready(function () { var prop = { pagination: { el: '.swiper-pagination', }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, } var autoplayProp = { autoplay: true, loop: true } prop = Object.assign(prop, autoplayProp); var swiperHero = new Swiper('#swiperHero-1', prop); }); Publications Cropland with negative vegetation cover changes during the conflict in Lebanon as of October 2024 2025 Forest categories with negati