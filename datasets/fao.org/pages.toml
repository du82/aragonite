["https://www.fao.org/newsroom/detail/fao-welcomes-un-biodiversity-cop16.2--highlights-agrifood-systems-as-key-to-achieving-global-biodiversity-goals/en"]
title = "FAO welcomes UN Biodiversity COP16.2, highlights agrifood systems as key to achieving global biodiversity goals"
description = "Colombia, the CBD Secretariat, and FAO join efforts to spotlight the importance of including agrifood systems in National Biodiversity Strategies and Action ..."
full_description = 'Colombia, the CBD Secretariat, and FAO join efforts to spotlight the importance of including agrifood systems in National Biodiversity Strategies and Action Plans FAO Director-General QU Dongyu delivers his address at COP16.2 side event “Meeting people’s needs through sustainable use of biodiversity within agrifood systems”. Rome – As more than 150 countries convene in Rome for the resumed session of the 16th United Nations Biodiversity Conference (COP16.2), the Food and Agriculture Organization of the United Nations (FAO) is calling for bold action to transform agrifood systems and support global biodiversity goals. Hosting a high-level meeting at its headquarters on the eve of the conference, FAO emphasized that agrifood systems must work in harmony with biodiversity to ensure a sustainable future for both people and the planet. The event built on the momentum generated last October at COP16 in Cali, Colombia, where FAO, the Government of Colombia, and the Convention on Biological Diversity (CBD) Secretariat launched the Agri-NBSAPs Support Initiative. The Initiative aims to assist governments in integrating agrifood systems into National Biodiversity Strategies and Action Plans (NBSAPs) and their implementation. "The initiative provides us with a collective mechanism to help governments build capacity, identify and implement strategic levers across agrifood sectors to achieve their national biodiversity targets," explained FAO Director-General QU Dongyu while opening the event. Qu was joined by Colombian officials María Susana Muhamad González, Minister of Environment and Sustainable Development and President of COP16, and Martha Carvajalino, Minister of Agriculture and Rural Development, as well as Astrid Schomaker, Executive Secretary of the CBD, and ministers from several countries, who reaffirmed their commitment to implementing the Kunming-Montreal Global Biodiversity Framework (KMGBF), keeping agrifood systems front and center. COP16 President Muhamad recognized FAO’s crucial role in bringing food security and agriculture into the core of the Global Biodiversity framework and welcomed the partnership with Colombia and the CBD in the Agri-NBSAPs Support Initiative, highlighting that it is a very important joint effort that she hopes to see materialized.'
year_published = 2025
year_updated = 2025
