title = "No small matter"
description = "From bees to earthworms to coral reefs and rainforests, #biodiversity helps keep our agrifood systems healthy, productive and resilient. But biodiversity for food and agriculture is declining. It's time to take action. &url=https://www.fao.org/interactive/biodiversity/en/&"
full_description = "The species, genetic resources and ecosystems in and around our food production systems have important roles to play. From bees and earthworms to coral reefs and rainforests, biodiversity helps to keep our agrifood systems healthy, productive and resilient. These are just some of the vital functions various species and ecosystems perform in and around our production systems: The use of biodiversity-friendly practices in agriculture is reported to be increasing. And many countries have put in place legal frameworks targeting the conservation of biodiversity in food and agriculture. Together we can promote and support biodiversity and ensure the future productivity of our agrifood systems. FAO’s Framework for Action on Biodiversity for Food and Agriculture presents over 50 actions that policymakers and governments can take to make a difference, from biodiversity monitoring to conservation. Download the framework and see how we can make a difference."
