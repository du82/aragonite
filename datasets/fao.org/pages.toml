title = "Home | Food and Agriculture Organization of the United Nations"
description = "FAO Home page"
full_description = "Colombia, the CBD Secretariat, and FAO stress the importance of agrifood systems in National Biodiversity Strategies and Action Plans Director-General addresses meetings of G20 Foreign Ministers in South Africa and reaffirms FAO’s commitment to Global Alliance Against Hunger and Poverty Discover how aquatic food systems play a vital role in nourishing and sustaining a growing global population. Are you a professional or amateur photographer or simply passionate about camelids? Help us spread the word about the importance of these heroes of deserts and highlands! Discover how FAO is supporting countries in their National Biodiversity Strategies and Action Plans for the agrifood sectors. Director-General addresses meetings of G20 Foreign Ministers in South Africa and reaffirms FAO’s commitment to Global Alliance Against Hunger and Poverty In Zimbabwe, small-scale farmers are reintroducing and cultivating local millet varieties, such as drought-tolerant pearl millet, to increase their resilience to a changing climate. Watch the video and learn how Analyce Chidembo, a Zimbabwean farmer, prepares Sadza, a traditional, nutritious, and tasty meal made with pearl millet cultivated during the dry season. Imagine a world where aquatic food systems provide sustainable and healthy food and nutrition while conserving biodiversity and safeguarding the environment. In this episode, a joint FAO-UNOOSA report highlights how geospatial technology can help strengthen global food security; FAO warns that extreme weather events continue to threaten food security in Latin America and the Caribbean; and the FAO Food Price Index declined in January. Sources: FAO, IFAD, UNICEF, WFP and WHO. 2024. The State of Food Security and Nutrition in the World 2024 - Financing to end hunger, food insecurity and malnutrition in all its forms. Rome, FAO. https://doi.org/10.4060/cd1254en; FAO. 2024. FAOSTAT: Suite of Food Security Indicators. [Accessed on 24 July 2024]. https://www.fao.org/faostat/en/#data/FS; UN Geospatial. 2020. Map geodata. New York, USA, UN. Licence: CC-BY-4.0"
