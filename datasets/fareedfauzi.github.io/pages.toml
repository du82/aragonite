description = "During a Windows Forensics engagement, I occasionally find myself forgetting essential tasks or unintentionally skipping analyzing importants artifacts. Ther..."
full_description = 'Cheatsheet: Windows Forensics Analysis DFIR Cheatsheet Dec 22, 2023 During a Windows Forensics engagement, I occasionally find myself forgetting essential tasks or unintentionally skipping analyzing importants artifacts. Therefore, this checklist (along with cheatsheet) could help myself (or readers) and ensure that I adhere to a systematic workflow when conducting Windows Forensics. Typical Forensic investigation flow If you ask me the details on the acquisition and analysis part, here it is: Evidence acquisition ⇛ Disk, memory Live response, scanner and live forensics ⇛ Autoruns, process hacker, THOR or Loki, Inquisitor Memory forensics ⇛ MemProcFS, volatility Disk Image mounting ⇛ Mounting and Triage important artifact Persistence analysis ⇛ Autoruns location, registry, WMI, Scheduled Tasks Malware analysis ⇛ Static and Dynamic analysis Checking system information ⇛ Registry Root cause analysis ⇛ Logs, web, malware, file folder activity, exploit, email, executed file Lateral movement investigation ⇛ event log, executed file, registry, file system Timeline analysis ⇛ MFT, Logfile, UsnJ parsing File access artifacts ⇛ File sharing, MountPoints, USB Recovering deleted data ⇛ Recyclebin, MFT, VSS, File carving, Keyword search (Autopsy) Malware reverse engineering Writing report Tools Acquire artifact’s Tools Tools Description FTK Imager Disk Imaging Magnet RAM Capturer Generate memory dump KAPE Triage only selected important artifacts instead of the whole disk image Inquisitor / FastIR Live analysis triage Mandiant Redline Collect live and file’s data and produce analysis External Hard disk To store the artifact acquisition Velociraptor’s agent and server Remote forensics framework EDD Check disk encryption Forensic analysis tools Tools Description Arsenal Image Mounter Mounting image Autopsy / FTK Imager Disk forensics KAPE Triage artifact and parse artifact Eric Zimmerman tools Artifact parser and viewer Regripper Registry parser Volatility Workbench / MemProcFS / MemProcFS-Analyzer Memory analysis tools Event log explorer Event log viewer Reg_hunter Hunt for malicious registry in live forensics Other open/close source tools - OS / Linux Distros Windows SIFT Linux Tsurugi Linux REMnux Acquire artifacts Check disk encryption using EDD Perform disk imaging using FTK Imager Perform memory dump activity using Magnet RAM Capturer for example. Save all files in the external harddisk Optional: Perform live analysis collection scanner such as Inquisitor Scan the compromised using scanner such as THOR Perform Registry scanner such as RegHunter Perform memory scanner such as hollows_hunter or moneta Perform persistent scanner such as PersistenceSniper or Trawler KAPE cheatsheet Basic command # Target .\kape.exe --tsource [DRIVE LETTER] --tdest [DESTINATION INCLUDE FOLDER NAME] --module [MODULE NAME] --gui # Module .\kape.exe --msource [DRIVE LETTER] --mdest [DESTINATION INCLUDE FOLDER NAME] --module [MODULE NAME] --gui Target KAPE target extraction .\kape.exe --tsource E: --tdest D:\KAPE_cases\ --target KapeTriage,MessagingClients,RemoteAdmin,ServerTriage,WebBrowsers,WebServers,WSL,MemoryFiles --gui Module: Live Response Memory dump .\kape.exe --msource C:\ --mdest D:\KAPE_cases\%m --module MagnetForensics_RAMCapture --gui Live response command and scanner .\kape.exe --msource E:\ --mdest D:\KAPE_cases\%m --module PowerShell_Get-InjectedThread,PowerShell_Get-NetworkConnection,PowerShell_Netscan,PowerShell_Signed,SIDR_WindowsIndexSearchParser,WIFIPassView,MagnetForensics_EDD,Nirsoft_BluetoothView,Nirsoft_LastActivityView,Nirsoft_OpenedFilesView,NirSoft_USBDeview,NirSoft_VideoCacheView,NirSoft_WebBrowserPassView,Nirsoft_WhatInStartup,Nirsoft_WifiHistoryView,Nirsoft_WirelessKeyView,SysInternals_Autoruns,SysInternals_Handle,SysInternals_PsFile,SysInternals_PsInfo,SysInternals_PsList,SysInternals_PsLoggedOn,SysInternals_PsService,SysInternals_PsTree,SysInternals_Tcpvcon,Powrshell_LiveResponse_SystemInfo,PowerShell_Arp_Cache_Extraction,PowerShell_Bitlocker_Key_Extraction,PowerShell_Bitlocker_Status,PowerShell_Defender_Exclusions,PowerShell_DLL_List,PowerShell_Dns_Cache,PowerShell_Local_Group_List,PowerShell_LocalAdmin,PowerShell_NamedPipes,PowerShell_NetUserAdministrators,PowerShell_Network_Configuration,PowerShell_Network_Connections_Status,PowerShell_Network_Share,PowerShell_Process_Cmdline,PowerShell_ProcessList_CimInstance,PowerShell_ProcessList_WMI,PowerShell_Services_List,PowerShell_SMBMapping,PowerShell_SMBOpenFile,PowerShell_SMBSession,PowerShell_Startup_Commands,PowerShell_User_List,PowerShell_WMIRepositoryAuditing,Windows_ARPCache,Windows_DNSCache,Windows_GpResult,Windows_IPConfig,Windows_MsInfo,Windows_nbtstat_NetBIOSCache,Windows_nbtstat_NetBIOSSessions,Windows_Net_Accounts,Windows_Net_File,Windows_Net_LocalGroup,Windows_Net_Session,Windows_Net_Share,Windows_Net_Start,Windows_Net_Use,Windows_Net_User,Windows_netsh_portproxy,Windows_NetStat,Windows_qwinsta_RDPSessions,Windows_RoutingTable,Windows_schtasks,Windows_SystemInfo,Reghunter,hasherezade_HollowsHunter --gui .\kape.exe --msource E:\ --mdest D:\KAPE_cases\%m --module Thor-Lite_Upgrade,Thor-Lite_Scan --gui .\kape.exe --msource E:\ --mdest D:\KAPE_cases\%m --module Loki_LiveResponse --gui .\kape.exe --msource E:\ --mdest D:\KAPE_cases\%m --module hasherezade_HollowsHunter --gui .\kape.exe --msource E:\ --mdest D:\KAPE_cases\%m --module MagnetForensics_RAMCapture --gui Module: Parsing and scanning All in one artifact parsing Warning: Super slow! .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module Loki_Scan,DensityScout,BackstageParser,BitsParser,CCMRUAFinder_RecentlyUsedApps,Chainsaw,DeepblueCLI,DHParser,EvtxHussar,hasherezade_HollowsHunter,INDXRipper,LevelDBDumper,OneDriveExplorer,PowerShell_Get-ChainsawSigmaRules,TeamsParser,ThumbCacheViewer,WMI-Parser,Zircolite_Scan,Zircolite_Update,LogParser_ApacheAccessLogs,LogParser_DetailedNetworkShareAccess,LogParser_LogonLogoffEvents,LogParser_RDPUsageEvents,LogParser_SMBServerAnonymousLogons,Nirsoft_AlternateStreamView,NirSoft_BrowsingHistoryView,NirSoft_FullEventLogView_AllEventLogs,NirSoft_FullEventLogView_Application,NirSoft_FullEventLogView_PowerShell-Operational,NirSoft_FullEventLogView_PrintService-Operational,NirSoft_FullEventLogView_ScheduledTasks,NirSoft_FullEventLogView_Security,NirSoft_FullEventLogView_System,NirSoft_TurnedOnTimesView,NirSoft_WebBrowserDownloads,Nirsoft_WinLogonView,SysInternals_SigCheck,TZWorks_CAFAE_Registry_System,Events-Ripper,Hayabusa,LogParser,MFTECmd,NTFSLogTracker,RECmd_AllBatchFiles,Reghunter,RegRipper,AmcacheParser,AppCompatCacheParser,EvtxECmd,EvtxECmd_RDP,iisGeoLocate,JLECmd,LECmd,PECmd,RBCmd,RecentFileCacheParser,SBECmd,SQLECmd,SQLECmd_Hunt,SrumECmd,SumECmd,WxTCmd,Sync_EvtxECmd,Sync_KAPE,Sync_RECmd,Sync_SQLECmd,Windows_ManageBDE_BitLockerKeys,Windows_ManageBDE_BitLockerStatus --gui Event log / log scanning and parsing .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module !!ToolSync,PowerShell_Get-ChainsawSigmaRule,Chainsaw,DeepblueCLI,EvtxHussar,Zircolite_Update,Zircolite_Scan,Events-Ripper,hayabusa_EventStatistics,hayabusa_OfflineEventLogs,hayabusa_OfflineLogonSummary,hayabusa_UpdateRules,EvtxECmd,EvtxECmd_RDP,LogParser,iisGeoLocate Program Execution .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module CCMRUAFinder_RecentlyUsedApps,AmcacheParser,AppCompatCacheParser,PECmd,RecentFileCacheParser --gui File folder activity .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module BackstageParser,OneDriveExplorer,ThumbCacheViewer,JLECmd,LECmd,RBCmd,SBECmd,WxTCmd --gui NTFS and FileSystem parsing .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module !!ToolSync,INDXRipper,MFTECmd,NTFSLogTracker,RegRipper,RECmd_AllBatchFiles --gui System activity .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module SRUMDump,WMI-Parser,RECmd_AllBatchFiles,SrumECmd,SumECmd --gui Mounted image scanner .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module Loki_Scan --gui .\kape.exe --msource E:\ --mdest D:\KAPE_cases\ --module DensityScout --gui Analysis Findings First, create a spreadsheet that will be the main documentation of your findings especially for Timeline. Include few relavant aspects in the spreadsheet such as: Artifact type Findings Location of artifact Created Accessed Modified Notes / Payload Live Forensics Check all the results of the script collection (Inquisitor / Kansa / FastIR) Memory analysis Tool used: Volatility, MemProcFS, MemProcFS-Analyzer Check network connection (netstat, netscan) Check process list (pslist, pstree, psscan, cmdline) Check injected process, dll injection (malfind, dlllist) Dump malicious process (dumpfiles –pid PID) Volatilit3 command: python3 vol.py -f <memdump> <plugin name> MemProcFS command: memprocfs.exe -device D:\mem.raw -forensic 1 MemProcFS-Analyzer: .\MemProcFS-Analyzer.ps1 Disk analysis Mount image Perform KAPE execution on the mounted drive using “KAPE triage” module to extract important artifacts. Run malware scanner on the mounted drive (Loki scanner, THOR scanner, AV scanner, Densityscout) Perform data recovery on the mounted drive using Photorec Check any shadow copy, view it in Shadow Explorer Autopsy Attach disk in Autopsy Run ingest module “Recent activity” and “Keyword search” Check Data artifacts in Autopsy, record all interesting findings Check file and folder (Access time, and created time) View Timeline Analysis in Autopsy Search any interesting keywords Windows event logs analysis Located at C:\Windows\System32\winevt\Logs Perform event log scanner Manually view in Event Log Explorer Interesting log sources Log sources Context Security.evtx Security-related events System.evtx Tracks system component events Application.evtx Logs application-specific events Microsoft-Windows-Sysmon/Operational.evtx Enhanced process, network, and file monitoring Microsoft-Windows-PowerShell/4Operational.evtx Records PowerShell activity Microsoft-Windows-Windows Defender/Operational.evtx Logs Windows Defender events