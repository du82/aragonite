llection Disk image Memory dump Investigation and analysis ...Read more DFIR Cheatsheet Mar 29, 2024 Cheatsheet: Windows Forensics Analysis During a Windows Forensics engagement, I occasionally find myself forgetting essential tasks or unintentionally skipping analyzing importants artifacts. Therefore, this checklist (along with cheatsheet) could help myself (or readers) and ensure that I adhere to a systematic workflow when conducting Windows Forensics. Typical Forensic investigat...Read more DFIR Cheatsheet Dec 22, 2023 Yet another Malicious Android Apps targeting Malaysian In this post, we will be discussing a disturbing new trend in malicious Android apps that have been targeting users in Malaysia. These apps, which have been disguised as legitimate services such as Cleaning service, have been found to contain SMS stealer and banking credential phishing capabilities, putting the sensitive information of their vic...Read more APK Malware Dec 23, 2022 Building Offensive Malicious Documents Generally, the attacker will use the below techniques in leveraging Microsoft Office features and vulnerabilities: Exploits Macros Remote template injection and many more… In this post, we will learn various techniques on how to make malicious documents that can execute our malicious code. Of course, to make it simple we will just run ...Read more Malicious-Document Malware Nov 20, 2022 20 post articles, 3 pages. 1 2 3 /*(function () { })();*/"
