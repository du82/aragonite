full_description = '''Cheatsheet: Linux Forensics Analysis DFIR Cheatsheet Mar 29, 2024 Linux Forensic in a nutshell: Validate compromised Interviewing client/user/administrator (what, why, how, when, where, who?) Live response commands / Run triage scripts Collect evidence Live response triage script collection Disk image Memory dump Investigation and analysis Live response analysis Disk analysis Timeline analysis Log analysis Memory analysis Reporting Validate compromised To validate compromise, we often will collect as much information as we can from the client. Then we proceed with the investigation to validate the compromised. I will often run a few commands or execute a triage script to collect live response command results using a single script. Validation sometimes easy: Defaced web pages IDS/EDR/AV/SIEM captures Ransomware file encrypted Interviewing client/user/administrator Understanding the incident with questions like this: What happened? What seemed unusual? When did you notice it? Which host involved What’s the purpose of the system Who has access to them? How are these systems set up? What have you done to fix it? Live response and triage script Linux-CatScale For more information about what the script collects, please refer to https://labs.withsecure.com/tools/cat-scale-linux-incident-response-collection. git clone https://github.com/WithSecureLabs/LinuxCatScale.git cd LinuxCatScale ./Cat-Scale.sh ./Extract-Cat-Scale.sh After running the script and extract the collected evidence, we can proceed investigate the triage data in text editor such as VS Code. Figure below shows the result of command lastlog collect by Linux-CatScale. UAC Another Live Response collection script to perform live response. user@training:~/uac$ git clone https://github.com/tclahr/uac.git user@training:~/uac$ sudo ./uac -p full /tmp [sudo] password for user: -------------------------------------------------------------------------------- __ __ _______ _______ |: | | |: _ |: ____| | |_| | | | | |____ |_______|__| |__|_______| Unix-like Artifacts Collector 2.8.0 -------------------------------------------------------------------------------- Operating System : linux System Architecture : x86_64 Hostname : training Mount Point : / Running as : root Temp Directory : /tmp/uac-data.tmp -------------------------------------------------------------------------------- Artifacts collection started... [001/301] 2024-04-02 01:22:10 +0000 live_response/process/ps.yaml [002/301] 2024-04-02 01:22:11 +0000 live_response/process/lsof.yaml [003/301] 2024-04-02 01:22:11 +0000 live_response/process/top.yaml Fennec fennec is an artifact collection tool written in Rust to be used during incident response on *nix based systems. Basically, the tool used osquery to perform the triage collection as we can see in this conf file https://github.com/AbdulRhmanAlfaifi/Fennec/blob/master/deps/linux/fennec.yaml. user@training:~$ wget https://github.com/AbdulRhmanAlfaifi/Fennec/releases/download/v0.4.1/fennec_linux_x86_64 user@training:~$ sudo ./fennec_linux_x86_64 -o training.zip --output-format csv ______ | ___| | |_ ___ _ __ _ __ ___ ___ | _/ _ \ '_ \| '_ \ / _ \/ __| | || __/ | | | | | | __/ (__ \_| \___|_| |_|_| |_|\___|\___| v0.4.1 2024-04-02 00:56:28 [fennec:418] INFO Started Fennec 0.4.1 2024-04-02 00:56:28 [fennec:491] INFO Successfuly wrote '16117820' bytes to osquery file './osqueryd' 2024-04-02 00:56:28 [fennec:347] INFO Start writing the results for the artifact 'authorized_keys' to 'authorized_keys.csv' 2024-04-02 00:56:28 [fennec:358] INFO Executing the osquery SQL query 'select * from authorized_keys' for the artifact 'authorized_keys' Please refer https://github.com/AbdulRhmanAlfaifi/Fennec for more information. Other tools in the list https://github.com/cado-security/varc https://github.com/Velocidex/velociraptor https://github.com/google/grr Live response commands These commands can be used to review anomalous behavior and verify compromise in real-time action. Some of the commands, such as cat /var/www/html/webshell.php, can also be used to perform post-compromise disk analysis, where we only need to supply the full path of the mounted compromised disk, for example, cat /media/compromised_disk/var/www/html/webshell.php. General information The first thing we are going to do is collect important information regarding the server that we will analyze. # Display current date and time. Verify the timezone. date # Timezone information cat /etc/timezone # System information uname -a # Network information ifconfig cat /etc/network/interfaces # Display distro version cat /etc/*-release # Date of installation of the OS. Check the date ls -ld /var/log/installer # Display hostname hostname cat /etc/hostname Logon activities Then, we proceed to review the logon activities of the compromised host. # Check users who are currently logged in w # Last login information for all users. It reads the /var/log/lastlog file lastlog cat /var/log/lastlog # List of last logged in users and their login times last -f /var/log/wtmp # Failed login attempts last -f /var/log/btmp # Searching for login activities in auth.log with specific keyword grep -v cron /var/log/auth.log* | grep -v sudo | grep -i user grep -v cron /var/log/auth.log* | grep -v sudo | grep -i Accepted grep -v cron /var/log/auth.log* | grep -v sudo | grep -i failed grep -v cron /var/log/auth.log* | grep -v sudo | grep i "login:session" # CentOS, Red Hat Enterprise Linux (RHEL) of auth.log cat /var/log/secure Review processes Review all running processes and its command could identify malicious process # Interactive process viewer htop # Currently running processes and its command ps -aux # List all open files associated with a specific process lsof -p <PID> # Directories that contains information about a specific process ls /proc/<PID> cat /proc/<PID> # Show process in tree view pstree -a File/Directory in /proc/PID Description cmdline Command-line arguments passed to the process cwd Symbolic link to the current working directory of the process exe Symbolic link to the executable file of the process fd Directory containing symbolic links to open file descriptors used by the process status Various status information about the process mem Represents the process’s memory space cpuinfo CPU-related information for the process maps Memory maps of the process limits Resource limits imposed on the process io I/O statistics for the process stat Various statistics about the process sched Scheduling information for the process syscall Information about system calls made by the process oom_score OOM (Out-Of-Memory) score of the process Recover deleted process’s binary This method attempts to recover the binary executable from the process’s memory by extracting a portion of the memory associated with the process. cd /proc/1234/ # maps contains memory maps of the process, showing the memory regions used by the process head -1 maps # Extract memory content (1000 bytes) at specified ADDRESS to tmp directory dd if=mem bs=1 skip=ADDRESS count=1000 of=/tmp/recovered_proc_file Review network Investigate any malicious connection and unexpected IP address # List all TCP and UDP connections on your system along with their respective listening and non-listening sockets netstat -antup # kernel routing table netstat -rn route # Check static DNS lookups cat /etc/hosts Review activities Investigate the executed command by the attacker and user could give nice context about the incident # Check command history history # Check all files with "history" in their name in the user's home directory cat /home/$USER/.*_history # Check the command history (specific to bash shell) cat /home/$USER/.bash_history # Check the command history for the root user (specific to bash shell) cat /root/.bash_history # Check the MySQL command history for the root user cat /root/.mysql_history # Check the FTP command history cat /home/$USER/.ftp_history # Check the SFTP command history cat /home/$USER/.sftp_history # Check the VIM editor history cat /home/$USER/.viminfo # Check the history of commands entered in the 'less' pager cat /home/$USER/.lesshst # Check the Git configuration cat /home/$USER/.gitconfig # List recent Git activity logs ls /home/$USER/.git/logs # List Mozilla Firefox profiles, check history and downloads ls /home/$USER/.mozilla/firefox # List Google Chrome profiles, check history and downloads ls /home/$USER/.config/google-chrome # Search for relevant commands in the authentication logs excluding cron jobs grep -v cron /var/log/auth.log* | grep -i -e "command=" -e "su:" -e "groupadd" -e "useradd" -e "passwd" Hunting unusual files # Search for files modified within the last 5 days and Check them for further inspection, change 5 if needed find / -type f -mtime -5 | less # Search for files modified within the last 5 days with "php" in their name and Check them for further inspection find / -type f -mtime -5 | grep "php" # Find files modified in the last 10 days in specified directories and Check them find /lib /usr/bin /usr/sbin -type f -newermt "$(date -d '10 days ago' +'%Y-%m-%d')" # Find files modified within the last day and print their paths find / -type f -mtime -1 -print # Search for files larger than 10,000 kilobytes and print their paths find / -size +10000k -print # List files in /usr/bin directory with their inode numbers and sort them numerically ls -lai /usr/bin | sort -n # List files in /bin directory recursively, sorted by modification time ls -laR --sort=time /bin # Find files owned by root with the setuid or setgid permissions and print their paths find / -user root -perm -04000 -print # List all devices in the /dev directory ls /dev Installed programs # Examine commands used for package installations from the APT history log for tracking software changes cat /var/log/apt/history.log | grep "Commandline" # Retrieve package names and their statuses from the dpkg status file for software inventory analysis cat /var/lib/dpkg/status | grep -E "Package:|Status:" # Review entries from the dpkg log file indicating installed packages for change analysis cat /var/log/dpkg.log | grep installed # Identify executables in the /sbin directory and determine their package ownership using dpkg for attribution find /sbin/ -exec dpkg -S {} \; | grep "no path found" # List executables in standard system directories for anomaly detection ls /usr/sbin /usr/bin /bin /sbin # List files in the APT package cache directory for investigating downloaded packages ls /var/cache/apt/archives # Find based on date find / -type f \( -newermt "2020-12-01" -and ! -newermt "2020-12-02" \) File investigation # Collect detailed metadata about the file for forensic analysis stat <filename> # Identify the file type and format to understand its nature file <filename> # Extract human-readable strings from the file for potential clues or analysis strings <filename> # Generate an MD5 checksum of the file to verify integrity and check against known malware signatures md5sum <filename> # submit to VT Persistent mechanisms Persistent mechanism is a methods used by attackers to maintain access to a compromised system across reboots or to ensure their malicious activities persist over time. Below is the potential list of the places attacker might add or modify to deploy their persistent access. Source: https://pberba.github.io/assets/posts/common/20220201-linux-persistence.png Review account Review user account information and activity on the system to iidentify potentially active user accounts, detect anomalies in user account configurations, find files belonging to non-existent users, extract password hashes for analysis, examine group information for privilege analysis, review sudo configurations for potential privilege escalation, investigate SSH authentication keys and known hosts for unauthorized access, and analyze recently used files for user activity. # Identify potentially active user accounts cat /etc/passwd | grep bash cat /etc/passwd | grep sh cat /etc/passwd | grep dash # Sort user accounts by their UID to detect anomalies sort -nk3 -t: /etc/passwd # Find files belonging to non-existent users (indicators of unauthorized access) find / -nouser -print # Extract password hashes for forensic analysis cat /etc/shadow # Examine group information for user privilege analysis cat /etc/group # Review sudo configuration for potential privilege escalation cat /etc/sudoers # Check for additional sudo configurations for backdoors cat /etc/sudoers.d/* # Investigate SSH authentication keys for potential unauthorized access cat /home/$USER/.ssh/authorized_keys # Analyze SSH known hosts for suspicious connections cat /home/$USER/.ssh/known_hosts # Review recently used files for user activity cat /home/$USER/.recently-used.xbel Webshell Identifying potential webshell installations or modifications # Search for PHP files in the /var/www/html directory and print their modification timestamps find /var/www/html -type f -name "*.php" -printf "%T@ %f\n" | sort -n | awk '{print strftime("%Y-%m-%d %H:%M:%S", $1), $2}' # Monitor Apache configuration files tail -f /etc/apache2/*/* # Monitor Nginx configuration files tail -f /etc/nginx/*/* Cron tasks Identify any scheduled tasks or suspicious activities that may have been configured to execute at specific times # View the configuration of the cron service managed by systemd cat /lib/systemd/system/cron.service # View the cron tasks scheduled for a specific user crontab –u <user> -l # View the system-wide crontab file containing system cron tasks cat /etc/crontab # Check all files in /etc/cron tail -f /etc/cron.*/* # List all user-specific cron files in the cron spool directory ls /var/spool/cron/crontabs/* # View the contents of the atjobs file, which contains at jobs scheduled by the at command cat /var/spool/cron/atjobs Services and systemd Examine systemd configurations and unit files on the system to identify any modifications or suspicious configurations that may have been made to services or startup processes. # List enabled services and Check their associated start commands for service in $(systemctl list-unit-files --type=service | grep enabled | awk '{print $1}'); do echo "Service: $service"; systemctl cat $service | grep ExecStart= | sed 's/^/Command: /'; echo "--------------------------------------------------"; done # List custom systemd unit files in /etc/systemd/system/ ls /etc/systemd/system/ # List systemd unit files in /lib/systemd/system/ ls /lib/systemd/system/ # List systemd system generators ls /lib/systemd/system-generators/* # View contents of init.d scripts more -f /etc/init.d/* # List systemd user units in /lib/systemd/user/ ls /lib/systemd/user/* # List custom systemd user units in /etc/systemd/user/ ls /etc/systemd/user/* # List user systemd generators in /etc/systemd/user-generators/ ls /etc/systemd/user-generators/* # List user systemd generators in /usr/local/lib/systemd/user-generators/ ls /usr/local/lib/systemd/user-generat'''
