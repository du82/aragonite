ecause it reduces by around 99% the number of droplets that are ejected during speech Apr 20, 2020 Jeremy Howard Masks for all? The science says yes. health Most scientific evidence points in the same direction: keep your droplets to yourself - wear a mask Apr 13, 2020 Professor Trisha Greenhalgh OBE and Jeremy Howard 6 Important Videos about Tech, Ethics, Policy, and Government ai-in-society At the CADE Tech Policy Workshop, members of local government, activists, researchers, and those in industry shared prespectives on how to understand the uses, risks, and opporutnities around government use of technology. Mar 31, 2020 Rachel Thomas Saving The Mask health An initiative from STEM teachers in Hong Kong to make reusable masks, for the community, by the community Mar 20, 2020 Sarada Lee Covid-19, your community, and you - a data science perspective health We are data scientists—that is, our job is to understand how to analyze and interpret data. When we analyze the data around covid-19, we are very concerned. The most… Mar 9, 2020 Jeremy Howard and Rachel Thomas Disinformation: what it is, why it’s pervasive, and proposed regulations ai-in-society At the CADE Tech Policy Workshop, experts Renee DiResta and Guillaume Chaslot spoke on disinformation, including the dyanmics that cause it to go viral and attempts towards addressing it. Feb 26, 2020 Rachel Thomas Tech Ethics Crisis: The Big Picture, and How We Got Here ai-in-society At the CADE Tech Policy Workshop, Y-Vonne Hutchinson spoke about the role of tech in facilitating mass atrocity, and Catherine Bracy spoke on the need for empathy and collective action. Feb 9, 2020 Rachel Thomas 4 Principles for Responsible Government Use of Technology ai-in-society As governments consider new uses of technology, in public places, this raises issues around surveillance of vulnerable populations, unintended consequences, and potential misuse. There are several principles to keep in mind in how these decisions can be made in a 