een 2 years in the making. Jul 21, 2022 Jeremy Howard Masks for COVID: Updating the evidence health Notes taken whilst preparing a paper on mask efficacy from Nov to Jan 2022. My previous paper on this was written in April 2020 and published in the Proceedings of the National Academy of Science Jul 4, 2022 Jeremy Howard Qualitative humanities research is crucial to AI ai-in-society Following the thread of any seemingly quantitative issue in AI ethics (such as determining if software to rate loan applicants is racially biased or evaluating YouTube’s recommendation system) quickly leads to a host of qualitative questions. Unfortunately, there is often a large divide between computer scientists and social scientists, with over-simplified assumptions and fundamental misunderstandings of one another. Jun 1, 2022 Louisa Bartolo and Rachel Thomas AI Harms are Societal, Not Just Individual ai-in-society In the west, our ideas of harm are largely anchored to an individual being harmed by a particular action at a discrete moment in time. Yet the harms caused by algorithmic systems are often collective and communal. May 17, 2022 Rachel Thomas and Louisa Bartolo There’s no such thing as not a math person advice education Many cultural factors, misconceptions, stereotypes, and obstacles turn people off to math. Mar 15, 2022 Rachel Thomas 7 Great Lightning Talks Related to Data Science Ethics ai-in-society Lightning talks by Australian experts on a range of topics related to data science ethics, including machine learning in medicine, explainability, Indigenous-led AI, and the role of policy Mar 14, 2022 Rachel Thomas Doing Data Science for Social Good, Responsibly ai-in-society While data for social good projects can be useful, there are also pitfalls to avoid. Nov 23, 2021 Rachel Thomas Avoiding Data Disasters technical ai-in-society Things can go disastrously wrong on data science and machine learning projects when we undervalue data work, use data in contexts that it wasn’t gathered for, or ignore the crucial role that humans play in the data science pipeline. Nov 4, 2021 Rachel Thomas SARS-CoV-2 Spike Protein Impairment of Endothelial Function Does Not Impact Vaccine Safety health All approved SARS-CoV-2 vaccines provide far more benefits than risks. The very rare risk of VITT from the AZ and JJ vaccines is not due to the spike proteins, but is most likely due to details of their formulation. Oct 27, 2021 Jeremy Howard and Uri Manor Statistical problems found when studying Long Covid in kids health technical Statistical tests need to be paired with proper data and study design to yield valid results. A recent review paper on Long Covid in children provides a useful example of how researchers can get this wrong. We use causal diagrams to decompose the problem and illustrate where errors were made. Oct 17, 2021 Jeremy Howard Medicine is Political health From covid-19 to HIV research to the long history of wrongly assuming women’s illnesses are psychosomatic, we have seen again and again that medicine, like all science, is political. Oct 12, 2021 Rachel Thomas Inaccuracies, irresponsible coverage, and conflicts of interest in The New Yorker health Letter to the editor of the New Yorker on the irresponsible description of a suicide, undisclosed financial conflicts of interest, and omission of relevant medical research and historical context in their recent long covid article Sep 25, 2021 Rachel Thomas Australia can, and must, get R under 1.0 health By using better masks, monitoring and improving indoor air quality, and rolling out rapid tests, we could quickly halt the current outbreaks in the Australian states of New South Wales (NSW) and Victoria. If we fail to do so, and open up before 80% of all Australians are vaccinated, we may have tens of thousands of deaths, and hundreds of thousands of children with chronic illness which could last for years. Sep 3, 2021 Jeremy Howard Getting Specific about AI Risks (an AI Taxonomy) ai-in-society