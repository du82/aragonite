een 2 years in the making. Jul 21, 2022 Jeremy Howard Masks for COVID: Updating the evidence health Notes taken whilst preparing a paper on mask efficacy from Nov to Jan 2022. My previous paper on this was written in April 2020 and published in the Proceedings of the National Academy of Science Jul 4, 2022 Jeremy Howard Qualitative humanities research is crucial to AI ai-in-society Following the thread of any seemingly quantitative issue in AI ethics (such as determining if software to rate loan applicants is racially biased or evaluating YouTube’s recommendation system) quickly leads to a host of qualitative questions. Unfortunately, there is often a large divide between computer scientists and social scientists, with over-simplified assumptions and fundamental misunderstandings of one another. Jun 1, 2022 Louisa Bartolo and Rachel Thomas AI Harms are Societal, Not Just Individual ai-in-society In the west, our ideas of harm are largely anchored to an individual being harmed by a particular action at a discrete moment in time. Yet the harms caused by algorithmic systems are often collective and communal. May 17, 2022 Rachel Thomas and Louisa Bartolo There’s no such thing as not a math person advice education Many cultural factors, misconceptions, stereotypes, and obstacles turn people off to math. Mar 15, 2022 Rachel Thomas 7 Great Lightning Talks Related to Data Science Ethics ai-in-society Lightning talks by Australian experts on a range of topics related to data science ethics, including machine learning in medicine, explainability, Indigenous-led AI, and the role of policy Mar 14, 2022 Rachel Thomas Doing Data Science for Social Good, Responsibly ai-in-society While data for social good projects can be useful, there are also pitfalls to avoid. Nov 23, 2021 Rachel Thomas Avoiding Data Disasters technical ai-in-society Things can go disastrously wrong on data science and machine learning projects when we undervalue data work, use data in contexts that it wasn’t g