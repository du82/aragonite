title = "FastAPI in Containers - Docker - FastAPI"
description = "FastAPI framework, high performance, easy to learn, fast to code, ready for production"
full_description = '''FastAPI in Containers - Docker¶ When deploying FastAPI applications a common approach is to build a Linux container image. It's normally done using Docker. You can then deploy that container image in one of a few possible ways. Using Linux containers has several advantages including security, replicability, simplicity, and others. Tip In a hurry and already know this stuff? Jump to the Dockerfile below 👇. Dockerfile Preview 👀 FROM python:3.9 WORKDIR /code COPY ./requirements.txt /code/requirements.txt RUN pip install --no-cache-dir --upgrade -r /code/requirements.txt COPY ./app /code/app CMD ["fastapi", "run", "app/main.py", "--port", "80"] # If running behind a proxy like Nginx or Traefik add --proxy-headers # CMD ["fastapi", "run", "app/main.py", "--port", "80", "--proxy-headers"] What is a Container¶ Containers (mainly Linux containers) are a very lightweight way to package applications including all their dependencies and necessary files while keeping them isolated from other containers (other applications or components) in the same system. Linux containers run using the same Linux kernel of the host (machine, virtual machine, cloud server, etc). This just means that they are very lightweight (compared to full virtual machines emulating an entire operating system). This way, containers consume little resources, an amount comparable to running the processes directly (a virtual machine would consume much more). Containers also have their own isolated running processes (commonly just one process), file system, and network, simplifying deployment, security, development, etc. What is a Container Image¶ A container is run from a container image. A container image is a static version of all the files, environment variables, and the default command/program that should be present in a container. Static here means that the container image is not running, it's not being executed, it's only the packaged files and metadata. In contrast to a "container image" that is the stored static contents, a "container" normally refers to the running instance, the thing that is being executed. When the container is started and running (started from a container image) it could create or change files, environment variables, etc. Those changes will exist only in that container, but would not persist in the underlying container image (would not be saved to disk). A container image is comparable to the program file and contents, e.g. python and some file main.py. And the container itself (in contrast to the container image) is the actual running instance of the image, comparable to a process. In fact, a container is running only when it has a process running (and normally it's only a single process). The container stops when there's no process running in it. Container Images¶ Docker has been one of the main tools to create and manage container images and containers. And there's a public Docker Hub with pre-made official container images for many tools, environments, databases, and applications. For example, there's an official Python Image. And there are many other images for different things like databases, for example for: PostgreSQL MySQL MongoDB Redis, etc. By using a pre-made container image it's very easy to combine and use different tools. For example, to try out a new database. In most cases, you can use the official images, and just configure them with environment variables. That way, in many cases you can learn about containers and Docker and reuse that knowledge with many different tools and components. So, you would run multiple containers with different things, like a database, a Python application, a web server with a React frontend application, and connect them together via their internal network. All the container management systems (like Docker or Kubernetes) have these networking features integrated into them. Containers and Processes¶ A container image normally includes in its metadata the default program or command that should be run when the container is started and the parameters to be passed to that program. Very similar to what would be if it was in the command line. When a container is started, it will run that command/program (although you can override it and make it run a different command/program). A container is running as long as the main process (command or program) is running. A container normally has a single process, but it's also possible to start subprocesses from the main process, and that way you will have multiple processes in the same container. But it's not possible to have a running container without at least one running process. If the main process stops, the container stops. Build a Docker Image for FastAPI¶ Okay, let's build something now! 🚀 I'll show you how to build a Docker image for FastAPI from scratch, based on the official Python image. This is what you would want to do in most cases, for example: Using Kubernetes or similar tools When running on a Raspberry Pi Using a cloud service that would run a container image for you, etc. Package Requirements¶ You would normally have the package requirements for your application in some file. It would depend mainly on the tool you use to install those requirements. The most common way to do it is to have a file requirements.txt with the package names and their versions, one per line. You would of course use the same ideas you read in About FastAPI versions to set the ranges of versions. For example, your requirements.txt could look like: fastapi[standard]>=0.113.0,<0.114.0 pydantic>=2.7.0,<3.0.0 And you would normally install those package dependencies with pip, for example: $ pip install -r requirements.txt ---> 100% Successfully installed fastapi pydantic Info There are other formats and tools to define and install package dependencies. Create the FastAPI Code¶ Create an app directory and enter it. Create an empty file __init__.py. Create a main.py file with: from typing import Union from fastapi import FastAPI app = FastAPI() @app.get("/") def read_root(): return {"Hello": "World"} @app.get("/items/{item_id}") def read_item(item_id: int, q: Union[str, None] = None): return {"item_id": item_id, "q": q} Dockerfile¶ Now in the same project directory create a file Dockerfile with: # (1)! FROM python:3.9 # (2)! WORKDIR /code # (3)! COPY ./requirements.txt /code/requirements.txt # (4)! RUN pip install --no-cache-dir --upgrade -r /code/requirements.txt # (5)! COPY ./app /code/app # (6)! CMD ["fastapi", "run", "app/main.py", "--port", "80"] Start from the official Python base image. Set the current working directory to /code. This is where we'll put the requirements.txt file and the app directory. Copy the file with the requirements to the /code directory. Copy only the file with the requirements first, not the rest of the code. As this file doesn't change often, Docker will detect it and use the cache for this step, enabling the cache for the next step too. Install the package dependencies in the requirements file. The --no-cache-dir option tells pip to not save the downloaded packages locally, as that is only if pip was going to be run again to install the same packages, but that's not the case when working with containers. Note The --no-cache-dir is only related to pip, it has nothing to do with Docker or containers. The --upgrade option tells pip to upgrade the packages if they are already installed. Because the previous step copying the file could be detected by the Docker cache, this step will also use the Docker cache when available. Using the cache in this step will save you a lot of time when building the image again and again during development, instead of downloading and installing all the dependencies every time. Copy the ./app directory inside the /code directory. As this has all the code which is what changes most frequently the Docker cache won't be used for this or any following steps easily. So, it's important to put this near the end of the Dockerfile, to optimize the container image build times. Set the command to use fastapi run, which uses Uvicorn underneath. CMD takes a list of strings, each of these strings is what you would type in the command line separated by spaces. This command will be run from the current working directory, the same /code directory you set above with WORKDIR /code. Tip Review what each line does by clicking each number bubble in the code. 👆 Warning Make sure to always use the exec form of the CMD instruction, as explained below. Use CMD - Exec Form¶ The CMD Docker instruction can be written using two forms: ✅ Exec form: # ✅ Do this CMD ["fastapi", "run", "app/main.py", "--port", "80"] ⛔️ Shell form: # ⛔️ Don't do this CMD fastapi run app/main.py --port 80 Make sure to always use the exec form to ensure that FastAPI can shutdown gracefully and lifespan events are triggered. You can read more about it in the Docker docs for shell and exec form. This can be quite noticeable when using docker compose. See this Docker Compose FAQ section for more technical details: Why do my services take 10 seconds to recreate or stop?. Directory Structure¶ You should now have a directory structure like: . ├── app │ ├── __init__.py │ └── main.py ├── Dockerfile └── requirements.txt Behind a TLS Termination Proxy¶ If you are running your container behind a TLS Termination Proxy (load balancer) like Nginx or Traefik, add the option --proxy-headers, this will tell Uvicorn (through the FastAPI CLI) to trust the headers sent by that proxy telling it that the application is running behind HTTPS, etc. CMD ["fastapi", "run", "app/main.py", "--proxy-headers", "--port", "80"] Docker Cache¶ There's an important trick in this Dockerfile, we first copy the file with the dependencies alone, not the rest of the code. Let me tell you why is that. COPY ./requirements.txt /code/requirements.txt Docker and other tools build these container images incrementally, adding one layer on top of the other, starting from the top of the Dockerfile and adding any files created by each of the instructions of the Dockerfile. Docker and similar tools also use an internal cache when building the image, if a file hasn't changed since the last time building the container image, then it will reuse the same layer created the last time, instead of copying the file again and creating a new layer from scratch. Just avoiding the copy of files doesn't necessarily improve things too much, but because it used the cache for that step, it can use the cache for the next step. For example, it could use the cache for the instruction that installs dependencies with: RUN pip install --no-cache-dir --upgrade -r /code/requirements.txt The file with the package requirements won't change frequently. So, by copying only that file, Docker will be able to use the cache for that step. And then, Docker will be able to use the cache for the next step that downloads and install those dependencies. And here's where we save a lot of time. ✨ ...and avoid boredom waiting. 😪😆 Downloading and installing the package dependencies could take minutes, but using the cache would take seconds at most. And as you would be building the container image again and again during development to check that your code changes are working, there's a lot of accumulated time this would save. Then, near the end of the Dockerfile, we copy all the code. As this is what changes most frequently, we put it near the end, because almost always, anything after this step will not be able to use the cache. COPY ./app /code/app Build the Docker Image¶ Now that all the files are in place, let's build the container image. Go to the project directory (in where your Dockerfile is, containing your app directory). Build your FastAPI image: $ docker build -t myimage . ---> 100% Tip Notice the . at the end, it's equivalent to ./, it tells Docker the directory to use to build the container image. In this case, it's the same current directory (.). Start the Docker Container¶ Run a container based on your image: $ docker run -d --name mycontainer -p 80:80 myimage Check it¶ You should be able to check it in your Docker container's URL, for example: http://192.168.99.100/items/5?q=somequery or http://127.0.0.1/items/5?q=somequery (or equivalent, using your Docker host). You will see something like: {"item_id": 5, "q": "somequery"} Interactive API docs¶ Now you can go to http://192.168.99.100/docs or http://127.0.0.1/docs (or equivalent, using your Docker host). You will see the automatic interactive API documentation (provided by Swagger UI): Alternative API docs¶ And you can also go to http://192.168.99.100/redoc or http://127.0.0.1/redoc (or equivalent, using your Docker host). You will see the alternative automatic documentation (provided by ReDoc): Build a Docker Image with a Single-File FastAPI¶ If your FastAPI is a single file, for example, main.py without an ./app directory, your file structure could look like this: . ├── Dockerfile ├── main.py └── requirements.txt Then you would just have to change the corresponding paths to copy the file inside the Dockerfile: FROM python:3.9 WORKDIR /code COPY ./requirements.txt /code/requirements.txt RUN pip install --no-cache-dir --upgrade -r /code/requirements.txt # (1)! COPY ./main.py /code/ # (2)! CMD ["fastapi", "run", "main.py", "--port", "80"] Copy the main.py file to the /code directory directly (without any ./app directory). Use fastapi run to serve your application in the single file main.py. When you pass the file to fastapi run it will detect automatically that it is a single file and not part of a package and will know how to import it and serve your FastAPI app. 😎 Deployment Concepts¶ Let's talk again about some of the same Deployment Concepts in terms of containers. Containers are mainly a tool to simplify the process of building and deploying an application, but they don't enforce a particular approach to handle these deployment concepts, and there are several possible strategies. The good news is that with each different strategy there's a way to cover all of the deployment concepts. 🎉 Let's review these deployment concepts in terms of containers: HTTPS Running on startup Restarts Replication (the number of processes running) Memory Previous steps before starting HTTPS¶ If we focus just on the container image for a FastAPI application (and later the running container), HTTPS normally would be handled externally by another tool. It could be another container, for example with Traefik, handling HTTPS and automatic acquisition of certificates. Tip Traefik has integrations with Docker, Kubernetes, and others, so it's very easy to set up and configure HTTPS for your containers with it. Alternatively, HTTPS could be handled by a cloud provider as one of their services (while still running the application in a container). Running on Startup and Restarts¶ There is normally another tool in charge of starting and running your container. It could be Docker directly, Docker Compose, Kubernet'''
