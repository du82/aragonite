full_description = '''External Links and Articles¶ FastAPI has a great community constantly growing. There are many posts, articles, tools, and projects, related to FastAPI. Here's an incomplete list of some of them. Tip If you have an article, project, tool, or anything related to FastAPI that is not yet listed here, create a Pull Request adding it. Articles¶ English¶ How to profile a FastAPI asynchronous request by Balthazar Rouberol. Deploy a Serverless FastAPI App with Neon Postgres and AWS App Runner at any scale by Stephen Siegert - Neon. Building a Machine Learning Microservice with FastAPI by Kurtis Pykes - NVIDIA. Booking Appointments with Twilio, Notion, and FastAPI by Ravgeet Dhillon - Twilio. Write a Python data layer with Azure Cosmos DB and FastAPI by Abhinav Tripathi - Microsoft Blogs. 10 Tips for adding SQLAlchemy to FastAPI by Donny Peeters. Tips on migrating from Flask to FastAPI and vice-versa by Jessica Temporal. Explore How to Effectively Use JWT With FastAPI by Ankit Anchlia. Instrument FastAPI with OpenTelemetry tracing and visualize traces in Grafana Tempo. by Nicoló Lino. ML serving and monitoring with FastAPI and Evidently by Mikhail Rozhkov, Elena Samuylova. FastAPI Tutorial in Visual Studio Code by Visual Studio Code Team. FastAPI application monitoring made easy by Apitally. Building a RESTful API with FastAPI: Secure Signup and Login Functionality Included by John Philip. Building a CRUD API with FastAPI and Supabase by Keshav Malik. Build an SMS Spam Classifier Serverless Database with FaunaDB and FastAPI by Adejumo Ridwan Suleiman. FastAPI lambda container: serverless simplified by Raf Rasenberg. Authorization on FastAPI with Casbin by Teresa N. Fontanella De Santis. How to monitor FastAPI application performance using Python agent by New Relic. Building the Poll App From Django Tutorial With FastAPI And React by Jean-Baptiste Rocher. Seamless FastAPI Configuration with ConfZ by Silvan Melchior. 5 Advanced Features of FastAPI You Should Try by Kaustubh Gupta. Deploying ML Models as API Using FastAPI and Heroku by Kaustubh Gupta. Using GitHub Actions to Deploy a FastAPI Project to Heroku by Somraj Saha. How to Create A Fake Certificate Authority And Generate TLS Certs for FastAPI by @pystar. Building a realtime ticket booking solution with Kafka, FastAPI, and Ably by Ben Gamble. Building simple E-Commerce with NuxtJS and FastAPI by Shahriyar(Shako) Rzayev. Serve a machine learning model using Sklearn, FastAPI and Docker by Rodrigo Arenas. Building an API with FastAPI and Supabase and Deploying on Deta by Yashasvi Singh. Deploy FastAPI on Ubuntu and Serve using Caddy 2 Web Server by Navule Pavan Kumar Rao. Python Facebook messenger webhook with FastAPI on Glitch by Patrick Ladon. Deploy a dockerized FastAPI application to AWS by Valon Januzaj. FastAPI for Flask Users by Amit Chaudhary. How to monitor your FastAPI service by Louis Guitton. Creating a CRUD App with FastAPI (Part one) by Precious Ndubueze. Build And Host Fast Data Science Applications Using FastAPI by Farhad Malik. Deploy FastAPI on Azure App Service by Navule Pavan Kumar Rao. Machine learning model serving in Python using FastAPI and streamlit by Davide Fiocco. Introducing Dispatch by Netflix. Using FastAPI with Django by Stavros Korokithakis. Build a Secure Twilio Webhook with Python and FastAPI by Twilio. Build a web API from scratch with FastAPI - the workshop by Sebastián Ramírez (tiangolo). FastAPI + Zeit.co = 🚀 by Paul Sec. Build simple API service with Python FastAPI — Part 1 by cuongld2. Microservice in Python using FastAPI by Paurakh Sharma Humagain. Real-time Notifications with Python and Postgres by Guillermo Cruz. Create and Deploy FastAPI app to Heroku without using Docker by Navule Pavan Kumar Rao. Another Boilerplate to FastAPI: Azure Pipeline CI + Pytest by Arthur Henrique. Deploy Machine Learning Models with Keras, FastAPI, Redis and Docker by Shane Soh. Towards Data Science: Deploying Iris Classifications with FastAPI and Docker by Mandy Gu. TestDriven.io: Developing and Testing an Asynchronous API with FastAPI and Pytest by Michael Herman. How To Deploy Tensorflow 2.0 Models As An API Service With FastAPI & Docker by Bernard Brenyah. Why I'm Leaving Flask by Dylan Anthony. Using Docker Compose to deploy a lightweight Python REST API with a job queue by Mike Moritz. A FastAPI and Swagger UI visual cheatsheet by @euri10. Uber: Ludwig v0.2 Adds New Features and Other Improvements to its Deep Learning Toolbox [including a FastAPI server] by Uber Engineering. How to Deploy a Machine Learning Model by Maarten Grootendorst. JWT Authentication with FastAPI and AWS Cognito by Johannes Gontrum. Top 5 Asynchronous Web Frameworks for Python by Ankush Thakur. Deploying a scikit-learn model with ONNX and FastAPI by Nico Axtmann. FastAPI authentication revisited: Enabling API key authentication by Nils de Bruin. FastAPI and Scikit-Learn: Easily Deploy Models by Nick Cortale. Introduction to the fastapi python framework by Errieta Kostala. FastAPI — How to add basic and cookie authentication by Nils de Bruin. FastAPI — Google as an external authentication provider by Nils de Bruin. FastAPI/Starlette debug vs prod by William Hayes. Developing FastAPI Application using K8s & AWS by Mukul Mantosh. Fastapi, Docker(Docker compose) and Postgres by KrishNa. Deployment using Docker, Lambda, Aurora, CDK & GH Actions by Devon Ray. Mastering Soft Delete: Advanced SQLAlchemy Techniques by Shubhendra Kushwaha. Role based row filtering: Advanced SQLAlchemy Techniques by Shubhendra Kushwaha. German¶ Domain-driven Design mit Python und FastAPI by Marcel Sander (actidoo). Inbetriebnahme eines scikit-learn-Modells mit ONNX und FastAPI by Nico Axtmann. REST-API Programmieren mittels Python und dem FastAPI Modul by Felix Schürmeyer. Japanese¶ [FastAPI] Python製のASGI Web フレームワーク FastAPIに入門する by @bee2. PythonのWeb frameworkのパフォーマンス比較 (Django, Flask, responder, FastAPI, japronto) by @bee2. 【第4回】FastAPIチュートリアル: toDo