["https://fasttrack.debian.net"]
title = "Debian Fast Track"
description = """
Debian Fast Track is a repository that allows making “backports” of packagesavailable to users of the stable distribution, if those packages cannot be maintained in testing and backported in the usual way."""
full_description = 'Introduction Debian Fast Track is a repository that allows making “backports” of packages available to users of the stable distribution, if those packages cannot be maintained in testing and backported in the usual way. Read More For Users Note: You will need bookworm-backports enabled, see backports website for instructions. Import fasttrack archive keyring: # apt install fasttrack-archive-keyring Add following lines to /etc/apt/sources.list on your bookworm system. deb https://fasttrack.debian.net/debian-fasttrack/ bookworm-fasttrack main contrib deb https://fasttrack.debian.net/debian-fasttrack/ bookworm-backports-staging main contrib If you cannot use https in your sources.list, add following. deb http://fasttrack.debian.net/debian-fasttrack/ bookworm-fasttrack main contrib deb http://fasttrack.debian.net/debian-fasttrack/ bookworm-backports-staging main contrib Note: For instructions for bullseye system, see this. Mirror We have a mirror, available via https, thanks to Jakob Haufe aka sur5r. To use, replace fasttrack.debian.net/debian-fasttrack with debian-fasttrack.sur5r.net/debian in above section. You can also tell apt to choose a mirror automatically by using, For https, mirror+https://fasttrack.debian.net/debian-fasttrack/mirrors.txt For http, mirror+http://fasttrack-mirror.fsci.in/debian-fasttrack/mirrors.txt Note: The old mirror mirror.linux.pizza which was generously hosted for 3 years by folks at Linux.Pizza was shut down in May 2023. Querying Packages For querying packages available in fasttrack repos, you can follow these steps: Install devscripts package sudo apt install devscripts Create/edit file ~/.devscripts to include following lines "RMADISON_URL_MAP_FASTTRACK=https://fasttrack.debian.net/api/madison" Use rmadison with -u fasttrack to query fasttrack packages. For example, rmadison -u fasttrack gitlab For maintainers We are setting up this service, please check FastTrack page on Debian Wiki for uploading packages to the Debian Fast Track repository. Open an issue on salsa to get support. Contribute Follow/Get involved via: Matrix #debian-fasttrack:poddery.com or IRC #debian-fasttrack on OFTC network. FAQ Q: Which packages should I upload to fasttrack ? A: If a package cannot be part of a stable release because we cannot provide security updates for the entire stable lifecycle then that package cannot be in testing or backports. Those packages get security updates along with new upstream versions and such software can be in FastTrack. Q: Does the package need to be in unstable or experimental to be in fasttrack? A: the package has to be in unstable, we allow packages from experimental as exceptions. We also allow packages in fast track temporarily when packages need to clear backports-new Q: Who should I contact if I need to remove a package? A: We use salsa issues mentioned above Q: What are the criteria for being able to upload? Is there a keyring for developers who can upload to fasttrack? A: For now, its fast track team members who can upload. We can give other DDs upload access on request. Use the issue tracker Q: Where should users report bugs? Bug reports in BTS. A: We prefer that too. It is up to each maintainer how they want it.'
author = "Debian Fasttrack Team"
year_published = 2025
clearnet = "https://fasttrack.debian.net"
