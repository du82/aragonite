title = "Debian Fast Track"
description = """
Debian Fast Track is a repository that allows making “backports” of packagesavailable to users of the stable distribution, if those packages cannot be maintained in testing and backported in the usual way."""
full_description = "Instructions for bullseye system Note: You will need bullseye-backports enabled, see backports website for instructions. Import fasttrack archive keyring: # apt -t bullseye-backports install fasttrack-archive-keyring Add following lines to /etc/apt/sources.list on your bullseye system. deb https://fasttrack.debian.net/debian/ bullseye-fasttrack main contrib deb https://fasttrack.debian.net/debian/ bullseye-backports main contrib If you cannot use https in your sources.list, add following. deb http://fasttrack.debian.net/debian/ bullseye-fasttrack main contrib deb http://fasttrack.debian.net/debian/ bullseye-backports main contrib Mirror We have a mirror, available via http and https, thanks to folks at Linux.Pizza. To use, replace https://fasttrack.debian.net/debian/ with https://mirror.linux.pizza/debian-fasttrack/ in above section."
author = "Debian Fasttrack Team"
year_published = 2025
clearnet = "https://fasttrack.debian.net/bullseye.html"
