description = "Introduction In previous blog posts in this series (Part 1 and Part 2), I looked at using CMake to configure a build for a cross compilation to target hardware such as the STM32F4 Series. In this blog post I will look at how to configure project source code, identify subsystems and use CMake to manage the build for each subsystem. In our training courses, we have identified two shared subsystems: the bare metal code used to initialise the C/C++ run time system [...]"
full_description = '← CMake Part 2 – Release and Debug builds C++20 modules with GCC11 → CMake Part 3 – Source File Organisation Posted on August 5, 2021 by Martin Bond Contents ToggleIntroductionManaging Source FilesSource File WildcardsConfiguring File DependenciesUsing SubsystemsBare Metal Runtime Object LibraryRTOS Shared LibraryCMake OptionsDynamic Link LibrarySummaryPostscript – A Simple Build ScriptLinux Build Script (bash)Windows Build Script Introduction In previous blog posts in this series (Part 1 and Part 2), I looked at using CMake to configure a build for a cross compilation to target hardware such as the STM32F4 Series. In this blog post I will look at how to configure project source code, identify subsystems and use CMake to manage the build for each subsystem. In our training courses, we have identified two shared subsystems: the bare metal code used to initialise the C/C++ run time system and a middleware layer consisting of a real-time operating system (RTOS). Before we look at configuring subsystems, we’ll briefly discuss managing a project with multiple source and header files. Managing Source Files Any non-trivial project will use separate source files to encapsulate different functional areas of the system. So far, our example project has just used a single main.cpp source file, although the supporting GitHub projects use multiple source files to build a usable ELF image. From the previous blog, you may remember that, for our build, we use a separate toolchain file (toolchain-STM32F407.cmake) and a project configuration file (CMakeLists.txt). The following is a simplified project configuration file where we have omitted the compiler and linker options as we are now concentrating on source code management: cmake_minimum_required(VERSION 3.16) project(target-cortexm LANGUAGES C CXX) set(CMAKE_C_STANDARD 99) set(CMAKE_CXX_STANDARD 17) add_executable(Application src/main.cpp ) set_target_properties(Application PROPERTIES SUFFIX .elf ) You can find the complete configuration files in the GitHub project accompanying this blog. We can extend our list of source files for the target executable. Let’s say we have two separate modules for our project: hardware devices (devices.cpp and devices.h) logic controller (controller.cpp and controller.h). We just add these source files to the add_executable() definition: add_executable(Application src/main.cpp src/gpio.cpp src/controller.cpp ) Remember that CMake will scan the source files looking for dependencies to build a dependency tree for the source files and included header files. We don’t specify the header files as part of the source dependencies. Although we never list the header files as part of the configuration (as discussed in previous blogs), we need to specify the directories to search for header files by adding entries to the target_include_directories() directive. For example: target_include_directories(Application PRIVATE src include ) Directory locations are relative to the project root but we can use the CMAKE_SOURCE_DIR variable to reinforce this: add_executable(Application ${CMAKE_SOURCE_DIR}/src/main.cpp ${CMAKE_SOURCE_DIR}/src/gpio.cpp ${CMAKE_SOURCE_DIR}/src/controller.cpp ) target_include_directories(Application PRIVATE ${CMAKE_SOURCE_DIR}/src ${CMAKE_SOURCE_DIR}/include ) When using subdirectories to organise source code the generated build commands print out each directory name as it is being processed. You can suppress this directory tracking using the –no-print-directory option on the build command line. cmake --build build --no-print-directory Source File Wildcards Teams following agile development models based on Evolutionary Prototyping where the source file structure can change regularly may prefer to use wildcard patterns to specify multiple source files to simplify project administration. Teams following a more formal methodology usually prefer to specify every source file to avoid accidentally including unwanted sources and to maintain accurate list modules dependencies. Software risk analysis usually requires a definitive list of the source files used to build a given project. As part of the build file generation CMake can optionally generate a list of compilation commands by setting the CMAKE_EXPORT_COMPILE_COMMANDS variable: set(CMAKE_EXPORT_COMPILE_COMMANDS ON) The well-documented proviso in CMake is that wildcards are evaluated when the build files are generated and not when the build takes place. To get proper wildcard support, the CMake build command must be run whenever there is a change to the source file structure. Many sites using wildcards simply regenerate the build files whenever a build takes place – it doesn’t take that much time compared to the build. The downside is that old artefacts may be left in the output build folder and used in the build (e.g. linking in an object file that is no longer built from a source file). These sort of build problems may not be discovered until a later date when rebuilding the whole project from scratch. Note that using the –target clean option on the CMake command will only delete artefacts defined by the current build configuration and not older unreferenced artefacts. The simple solution to this problem is to delete the entire output folder and regenerate everything. General advice is to avoid wildcards in a build configuration as the potential problems are more serious than the extra administrative load. However, we decided our training projects benefited from using wildcards so that we didn’t have to get everyone to edit the build system as we went through the programming exercises. Our supporting build script always regenerates the build files. Configuring File Dependencies While we’re looking at source files and wildcards it’s worth pointing out that CMake does not have built in rules for all possible source files for a project. Our embedded linker commands are dependent upon a number of hardware configuration files stored in an ldscripts subdirectory which we need to add as a dependency for the linker stage. We do this using LINK_DEPENDS option to the set_target_properties() function which is used to configure target specific properties. The related set_property() command is used to set other CMake properties. There are a plethora of properties available in CMake and being aware of these, and when to use them is a good example of just how complex and confusing it is to define a CMake build configuration. We can add our two linker configuration scripts as linker dependencies using the following: set(LINKER_SCRIPTS ${CMAKE_SOURCE_DIR}/ldscripts/mem.ld ${CMAKE_SOURCE_DIR}/ldscripts/sections.ld ) set_target_properties(Application PROPERTIES SUFFIX .elf LINK_DEPENDS "${LINKER_SCRIPTS}" ) The LINK_DEPENDS option requires a single parameter which is a semi-colon separated list of absolute pathnames to the files; relative filenames do not work so we need to use the CMAKE_SOURCE_DIR to prefix the relative paths to the files. It isn’t well documented but when expanding a variable containing a list inside a quoted string the list values will be separated by semi-colons. Hence the need to create a list of linker configuration scripts and expand that list in a quoted string after the LINK_DEPENDS keyword. The LINK_DEPENDS option is used to ensure the linker is run to rebuild the image if any linker configuration files change. There is a related CMAKE_CONFIGURE_DEPENDS option to set_property() that can be used to force the build files to be regenerated if one or more files (not known to CMake) have changed. The CMAKE_CONFIGURE_DEPENDS usage is similar to that of LINK_DEPENDS requiring a semi-colon separated list but this time containing filenames relative to a given directory: set(FILES config.yml) set__property(DIRECTORY ${CMAKE_SOURCE_DIR} APPEND PROPERTY CMAKE_CONFIGURE_DEPENDS "${FILES}" ) Using Subsystems Now we have looked at managing source files we can look at subsystems. In our embedded training projects we have identified two subsystems: the bare metal runtime an optional real-time operating system (RTOS) Each subsystem has its own CMakeLists.txt configuration file and is defined in a subdirectory of our project as shown in the following screen image: Embedded Project Structure In the main CMakeLists.txt project file we use add-subdirectory() to add a subsystem to the main build. The first subsystem to consider is the bare metal runtime and startup code which has an added complexity in it use of weak linkage. Bare Metal Runtime Object Library We created a subdirectory (system) for the Arm CMSIS files, the STMicroelectronics files for the STM32F407xx chipset, and files to support the newlib C/C++ Standard Library. Each subsystem is a separate project with its own project definition file (system/CMakeLists.txt). In a subsystem we list each dependent source file avoiding wildcards as we want to select exactly which files to use in our build: cmake_minimum_required(VERSION 3.16) project(target-system LANGUAGES C CXX) add_library(system OBJECT src/newlib/_syscalls.c src/newlib/_startup.c src/newlib/_sbrk.c src/newlib/assert.c src/newlib/__dso_handle.c src/newlib/_exit.c src/newlib/_write.c src/cortexm/exception_handlers.c src/cortexm/_reset_hardware.c src/cortexm/_initialize_hardware.c src/diag/Trace.c src/diag/trace_impl.c src/cmsis/vectors_stm32f4xx.c src/cmsis/system_stm32f4xx.c ) As with the main project file, we start with the minimum required CMake version and a unique name for our subsystem project (target-system). All our current supporting files are written in C, but we still define this as a C and C++ project in case we decide to add C++ files at a later date. It is worth noting that the default project languages for CMake are C and C++ so this line is redundant, but we think it’s worth including anyway. We define the library itself (called system) with the add_library() function. The first argument is the library name and must be unique within the project (different from all other libraries and executable targets created by the project). CMake supports conditional configuration so two libraries with the same name can be defined, so long as only one is included in the generated build. The first argument to add_library defines the library type. There are several CMake library types which include: SHARED – dynamically linked libraries (.so or .dll files) not supported by the GNU Arm Embedded Toolchain STATIC – statically linked libraries (.a or .lib files) OBJECT – not a single library file but a collection of separate object files (.o or .obj files) The GNU Arm Linker supports weak linkage but if we use a static library with the -ffunction-sections linker option then all weakly linked functions in the library will linked into the target image file in preference to any strongly linked versions in our code. To ensure the weak linkage mechanism works correctly we have to create an OBJECT library for our target. The remaining add_library arguments supply a list of source files which CMake will use to generate the build dependencies. In the previous example we have used paths relative to the project directory but the PROJECT_SOURCE_DIR variable can be used to make it clear these are relative to the directory containing the CMakeLists.txt file (… represents omitted entries): add_library(system OBJECT ${PROJECT_SOURCE_DIR}/src/newlib/_syscalls.c ${PROJECT_SOURCE_DIR}/src/newlib/_startup.c ... ${PROJECT_SOURCE_DIR}/src/cmsis/vectors_stm32f4xx.c ${PROJECT_SOURCE_DIR}/src/cmsis/system_stm32f4xx.c ) For an OBJECT library, the output object files are created in a build directory named after the library (system.dir). In our case, for a debug build, this is the location build/debug/system/CMakeFiles/system.dir/ (this output directory store object files as a mirror of the directory structure of the source files). Apart from the object files, our subsystem includes several headers files which we need to add to the compiler’s include locations. There are two types of include locations: INTERFACE includes are part of the interface to the subsystem PRIVATE includes are only needed to compile the subsystem We use target_include_directories() to identify the include file folders: target_include_directories(system INTERFACE ${PROJECT_SOURCE_DIR}/include/cmsis ) target_include_directories(system PRIVATE ${PROJECT_SOURCE_DIR}/include ${PROJECT_SOURCE_DIR}/include/cmsis ${PROJECT_SOURCE_DIR}/include/cortexm ${PROJECT_SOURCE_DIR}/include/diag ) That’s all we need for our bare metal subsystem. The subsystem compilation will inherit the compiler options and defines from the main project configuration. If we had specific options or defines for the subsystem, we would specify these with target_compile_options and target_compile_definitions . Do not set project-wide compiler (or linker) options and definitions from within a subsystem: you’ll only create trouble for yourself. We now update the main project’s CMakeLists.txt file to add the subsystem configuration and add a dependency to the build target (Application): add_subdirectory(system) target_link_libraries(Application PRIVATE system) The add_subdirectory is used to add the subsystem configuration to the project build. We have made the subsystem project name the same as the directory name, but this isn’t necessary. A subsystem project could create multiple libraries (or even target executables), so we need to tell CMake to generate appropriate linker options to add the required library to our Application target with target_link_library. The target_link_library needs to know if the library is only required to build our target executable or is part of this project’s interface. In our case, which is the most common, the library is only required to build the target, so we specify the PRIVATE link library argument. The other options are PUBLIC (the library file or files are made available to enclosing projects) and INTERFACE (the include locations are made available to enclosing projects). This approach allows CMake to support complex subsystem hierarchies. In the top-level project configuration file (CMakeLists.txt), the use of PUBLIC/PRIVATE/INTERFACE is normally moot as other project will not depend on this one. Many CMake examples specify PUBLIC libraries in the top-level configuration file, which can, and has, lead to confusion as to which is the correct approach. If in doubt, make libraries PRIVATE as this is usually the right approach; you’ll soon find out when this is wrong when a compilation or link fails. One final twist to our training project configuration is that we originally intended to use a common CMake build file for training courses for embedded targets (cross compilation) and hosted courses where we do not add the -DCMAKE_TOOLCHAIN_FILE=toolchain-STM32F407.cmake option to the cmake command line. We did this by testing for the presence of the subsystem directory (which is not included with our hosted training courses): if (IS_DIRECTORY ${CMAKE_S'
