["https://fearlessflight.com/cleared-for-takeoff-classes-in-phoenix"]
title = "Cleared for Takeoff Classes in Phoenix | FearlessFlight®"
description = "Due to the current pandemic, all in-person classes have been suspended until further notice! Put your self on the notification list for the classes here in Phoenix you want to learn more about. We will also keep you updated on when we will resume classes again.  Fear of Flying Classes with Capt Ron If you are"
full_description = 'var et_animation_data = [{"class":"et_pb_image_90027","style":"slideLeft","repeat":"once","duration":"500ms","delay":"0ms","intensity":"10%","starting_opacity":"0%","speed_curve":"ease-in-out"}]; Due to the current pandemic, all in-person classes have been suspended until further notice! Put your self on the notification list for the classes here in Phoenix you want to learn more about. We will also keep you updated on when we will resume classes again. Fear of Flying Classes with Capt Ron If you are searching online for airports or airlines that offer fear of flying classes, chances are you’ve found out that no such courses exist, either in person or online. However…. IF you live in or can travel to the Phoenix, you are in luck! Whether it is getting to the airport, going through security, waiting at the gate, takeoff, turbulence or sweating it out at 36,000 feet — our classes are designed to help you to recognize, regulate and replace your triggers and mental dialogue that keeps you stuck in a vicious anxiety loop. Flying doesn’t have be painful. Once you have experienced one of our classes, you will not only know that the pain in your brain is not about the plane, but you will have gained the confidence that air travel-and the planes-are completely safe. Much more importantly to you however, you will also have cultivated the confidence and skills that you can manage yourself and your anxiety in ways you never thought possible! Cleared for Takeoff 101 in Phoenix Afraid to fly? You are not alone! Learn about the Proven FearlessFlight® Method! Location: Phoenix Sky Harbor Airport Cost: FREE Sign up for the next class Cleared For Takeoff 201 Change the Way You Think about Flying! Build Your Personal FearlessFlight® Plan NOW! Location: Phoenix, AZ Cost: Check Pricing Next Class: Many thousands of fearful flyers like you have attended the Cleared for Takeoff Classes over the last 31+ years. This class offers a roadmap for you and introduces you to the tried and true FearlessFlight® Method. The first part takes place in a classroom inside Terminal 4.The second part of the class takes place on a Southwest Airlines airplane parked at a gate, where students will also receive a tour in and around the aircraft. You need a proven system so that you can finally build YOUR Personal FearlessFlight® Plan! In this class, we have broken down exactly what you need to learn about and apply, if you are serious about overcoming your fear of flying, into a simple Step-by-Step Process. After completion of this class, you will be ready for the final (optional) step, which is apply what you learned in the Cleared for Takeoff 301 – The Flight Class! Facebook LIVE Classes Like our Facebook page to get notifications when Capt. Ron does live talks on Facebook to answer the most asked questions about flying. Follow on Facebook Gordon’s Story After sixteen years of living in fear, Gordon thought he tried everything – until he came to class! Gordon hadn’t flown in over 16 years. It wasn’t onlyhis anxiety about flying. He had developed a generalized anxiety following a surgery over 20 years before. But meeting the woman who would become his fiancée and a surprise trip she had planned for the two of them that sense of urgency to overcome his fear. For years he had tried DVD’s, counseling, hypnosis, talk therapy, relaxation therapy, visualization, “tapping,” EMDR and EFT. Nothing had worked. He couldn’t even go to the airport! No matter what he tried, nothing helped. After repeated attempts to get over his fear, Gordon grew more desperate. He was in danger of losing the woman of his dreams – at least that’s the story he told himself. He worried his engagement was in jeopardy because he picked a partner who loved to travel. She had a dream vacation planned for England and Ireland starting with a transatlantic flight to London. Gordon’s anxiety was sky rocketing out of control. Three weeks before his London vacation, Gordon called me. He came to class and began using the FearlessFlightTM Kit (FFK). He thought he had tried everything, but what he really needed was to let go and teach his mind to relax. He practiced with the FearlessFlightTM Harmonizer (one of the components included in the FFK). He noticed changes in his behavior. He began to feel more relaxed. He wasn’t obsessing about the trip to London as much. And when those obsessive thoughts would come up, he had a process which he could use that turned the anxiety around. It wasn’t like the anxiety had disappeared. He could now manage it. And with each practice, he felt his skills getting stronger and more like they were a normal part of his routine. Just 21 days later, he was boarding a transatlantic flight About a week before the flight to London, he noticed his anxiety stating to climb again. He was a little queasy and his heart would race. So, he doubled down on the FearlessFlightTM Harmonizer. Gordon was sick-and-tired of being sick-and-tired of his anxiety about flying.There was no way he was going to give up this trip to London! Or the woman of his dreams. Besides, he could actually feel it working when he practiced. His thinking was changing – or at least the way he reacted to his thoughts of being confined with no way out. The fight was on! He was winning. Because the flight had such significance, Gordon decided to take a practice flight. Time was critical and he couldn’t wait for our next Cleared for Takeoff 201, The Advanced Class. Because of prior commitments I was unable to accompany him. After assuring him that I could see a newly acquired confidence in him, and providing his son with some coaching hints about supporting Gordon in my absence, the practice flight was on. Gordon used the FearlessFlightTM Harmonizer in the boarding area before the flight. He continued listening through the boarding process except for the time he took to meet the pilots (a very important strategy that we discuss in class). He took his seat, got settled in and resumed using the Harmonizer. As the flight attendants began their final preparations, they announced, “Please turn off all portable electronic devices” (a requirement that no longer exists). Gordon felt a small spike of anxiety. “Will I be able to handle the takeoff without the Harmonizer?” he wondered. As the pilots turned onto the runway, instead of his mind’s eye autopilot switching on and starting a flood of anxious thoughts in his consciousness, something strange happened to Gordon. He was now able to visualize the display from the FearlessFlight Harmonizer and immediately place his mind in a relaxed state—something that was impossible just weeks before. Gordon could now focus his attention on what HE wanted to think about. This was the first time he could remember having this kind of freedom and confidence—an entirely different experience in an airplane. Ten flights in 19 days! Gordon went on to complete his romantic getaway with his fiancée. He flew 10 flights in 19 days. He found challenges on every flight, but he met every challenge with growing confidence following the regimen he learned at the Cleared for Takeoff 101 Class. In fact, his biggest challenge resulted in a bonus flight on this extraordinary adventure. The final leg of his trip was supposed to be his flight home from Charlotte, NC, to Phoenix, AZ. Shortly after leveling off after the climb out, he heard a muffled popping noise. Shortly thereafter, the captain came on the loudspeaker and announced that one of the engines was “under performing” and that they were returning to Charlotte. They landed uneventfully with the fire trucks and emergency equipment standing by. Gordon confessed that while this was not on his bucket list, it wasn’t the confirming catastrophe from which he might resolve to never fly again. Just the opposite. Gordon said that had he not come to class and learned about new coping tools and strategies including the FearlessFlightTM Kit, he would have NEVER gotten back on an airplane to complete his planned travel. Instead of being a victim to catastrophic thinking, Gordon recalled his first response was his mind saying, “Just breathe.” With that, he could control what was in his power and leave the flying to the flight crew. Gordon has since made several more flights including another international trip. He looks forward to flying—enjoying the confidence that he can use the resources he gained through his experiences with FearlessFlightTM.'
