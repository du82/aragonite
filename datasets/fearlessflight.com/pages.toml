ce flight anxiety. That’s where the FearlessFlight® Kit rules! It starts the dialogue for you! It’s been used successfully by thousands of people just like you! Buy Now Get Your FearlessFlight® Kit Today! Will it help me? Short answer – YES! If you experience unwanted and debilitating anxiety and panic attacks that are produced when thinking about or flying on an airplane—whether that’s due to thoughts of mechanical or human error or images of being trapped or confined without the option of leaving when you want –> The FearlessFlight® Kit will help you! Buy Now DID YOU KNOW? Fear of Flying is an Anxiety Disorder! It’s colorless, odorless, tasteless and leaves no visible scars–save for those on your heart from missing important life events. It ruins your Peace of Mind! The nature of fear of flying is to manipulate your survival instinct into hijacking your mind and holding your ability to think and act rationally hostage. It does this by commandeering the attention-getting facility of your mind and keeping it locked onto some otherwise harmless thought while convincing you that whatever it has seized upon is… 1 It ruins your Peace of Mind! 2 You are helpless to resist So, while the ultimate solution is to restore your mind’s ability to focus your thoughts where YOU choose, the immediate goal is to break the obsessive-compulsive lock your mind has on your attention and move it to something less anxiety-producing."
