title = "Federal Reserve Board - Advisory Councils"
description = "The Federal Reserve Board of Governors in Washington DC."
full_description = '''Home About the Fed Advisory Councils <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> Community Advisory CouncilCommunity Depository Institutions Advisory CouncilFederal Advisory CouncilInsurance Policy Advisory CommitteeModel Validation Council The Federal Reserve System uses advisory and working committees in carrying out its varied responsibilities. Five of these committees advise the Federal Reserve Board: the Community Advisory Council, the Community Depository Institutions Advisory Council, the Federal Advisory Council, the Insurance Policy Advisory Committee, and the Model Validation Council. The Federal Advisory Council and the Insurance Policy Advisory Committee were established by law. The Community Advisory Council, the Community Depository Institutions Advisory Council, and the Model Validation Council were created by the Federal Reserve Board. Each Federal Reserve Bank also uses advisory committees. These committees advise the Bank on matters of importance in the Bank's District, such as agriculture and small business. Back to Top Last Update: January 25, 2019'''
