["https://federalreserve.gov/aboutthefed/fed-financial-statements.htm"]
title = "Federal Reserve Board - Fed Financial Statements"
description = "The Federal Reserve Board of Governors in Washington DC."
full_description = '''Home About the Fed Fed Financial Statements <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> Federal Reserve System Audited Annual Financial StatementsFederal Reserve Banks Combined Quarterly Financial Reports (Unaudited) The Board of Governors and the Federal Reserve Banks annually prepare and release audited financial statements reflecting balances (as of December 31) and income and expenses for the year then ended. The Federal Reserve Bank financial statements also include the accounts and results of operations of two limited liability companies (LLCs) that have been consolidated with the Federal Reserve Bank of New York and one LLC that has been consolidated with the Federal Reserve Bank of Boston. The Board also prepares unaudited quarterly financial reports that present summary financial information on the combined financial position and results of operations of the Reserve Banks. The combined information includes the accounts and results of operations of each of the 12 Reserve Banks and any operating LLCs. All financial information included in the quarterly financial report is unaudited. Back to Top Last Update: March 26, 2024'''
