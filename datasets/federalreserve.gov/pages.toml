full_description = '''Home About the Fed Share Accessible Keys for Video [Space Bar] toggles play/pause; [Right/Left Arrows] seeks the video forwards and back (5 sec ); [Up/Down Arrows] increase/decrease volume; [M] toggles mute on/off; [F] toggles fullscreen on/off (Except IE 11); The [Tab] key may be used in combination with the [Enter/Return] key to navigate and activate control buttons, such as caption on/off. videojs('frb-video5168249260001').ready(function() { var myPlayer = this; myPlayer.on('loadstart',function(){ // Display video date and transcript link. var videoInfo = ""; var transcriptLinkLabel; if (myPlayer.mediainfo.custom_fields["actualdatetext"]) { videoInfo += "<span class='col-xs-6'>" + myPlayer.mediainfo.custom_fields["actualdatetext"] + "</span>"; } if (myPlayer.mediainfo.custom_fields["transcriptlinkurl"]) { if (myPlayer.mediainfo.custom_fields["transcripttext"]) { transcriptLinkLabel = myPlayer.mediainfo.custom_fields["transcripttext"]; } else { transcriptLinkLabel = "Transcript (PDF)"; } videoInfo += "<span class='col-xs-6 text-right'><a href='" + myPlayer.mediainfo.custom_fields["transcriptlinkurl"] + "'>" + transcriptLinkLabel + "</a></span>"; } $("#videoDetails5168249260001").html(videoInfo); }) }); The Federal Reserve System is the central bank of the United States. It performs five general functions to promote the effective operation of the U.S. economy and, more generally, the public interest. The Federal Reserve conducts the nation’s monetary policy to promote maximum employment, stable prices, and moderate long-term interest rates in the U.S. economy; promotes the stability of the financial system and seeks to minimize and contain systemic risks through active monitoring and engagement in the U.S. and abroad; promotes the safety and soundness of individual financial institutions and monitors their impact on the financial system as a whole; fosters payment and settlement system safety and efficiency through services to the banking industry and the U.S. government that facilitate U.S.-dollar transactions and payments; and promotes consumer protection and community development through consumer-focused supervision and examination, research and analysis of emerging consumer issues and trends, community economic development activities, and the administration of consumer laws and regulations. #board-members > div { min-height: 250px; } Board Members Jerome H. Powell Chair Philip N. Jefferson Vice Chair Michael S. Barr Michelle W. Bowman Lisa D. Cook Adriana D. Kugler Christopher J. Waller Board Members Board Meetings Board Votes Official Staff Advisory Councils Board Organization Charts Fed Financial Reports Strategic Plan Government Performance and Results Act (GPRA) Reading Rooms Ethics and Values Holidays Observed - K.8 FOMC Calendar Statistical Release Calendar Beige Book Calendar Board Meetings Calendar Fed 101 What is the purpose of the Federal Reserve System? Economic Education Federal Reserve History Oral History Interviews Federal Reserve Act The Fed Explained FAQs Meet the Fed Currency Federal Reserve Education Overview: Federal Reserve System Boards of Directors Bank Presidents by District Contact Us Contact Ombuds The Board Buildings Federal Reserve Banks 01-Boston 02-New York 03-Philadelphia 04-Cleveland 05-Richmond 06-Atlanta 07-Chicago 08-St. Louis 09-Minneapolis 10-Kansas City 11-Dallas 12-San Francisco Board The Federal Reserve officially identifies Districts by number and Reserve Bank city. In the 12th District, the Seattle Branch serves Alaska, and the San Francisco Bank serves Hawaii. The System serves commonwealths and territories as follows: the New York Bank serves the Commonwealth of Puerto Rico and the U.S. Virgin Islands; the San Francisco Bank serves American Samoa, Guam, and the Commonwealth of the Northern Mariana Islands. The Board of Governors revised the branch boundaries of the System in February 1996. Last Update: March 1, 2025 Back to Top'''
