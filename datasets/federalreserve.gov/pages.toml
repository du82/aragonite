["https://federalreserve.gov/aboutthefed/educational-tools/default.htm"]
title = "Federal Reserve Board - Economic Education"
description = "The Federal Reserve Board of Governors in Washington DC."
full_description = '''Home About the Fed Economic Education Email <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> The Federal Reserve Explained The Federal Reserve System performs five functions to promote the effective operation of the U.S. economy and, more generally, to serve the public interest. View Page Events and Programs Conversation with the Chair: A Teacher Town Hall Meeting Federal Reserve Board Chair Jerome H. Powell will host a town hall with educators and students on September 28, 2023 at 4:00 p.m. ET. During the event, Chair Powell will respond to questions asked by participants who will join the event virtually from across the country. View Page National College Fed Challenge College Fed Challenge is a team competition for undergraduate students. Teams analyze economic and financial conditions and formulate a monetary policy recommendation, modeling the Federal Open Market Committee. View Page National High School Fed Challenge The High School Fed Challenge is an academic competition where teams of students act as future economists. View Page Economic Education Month October is National Economic Education Month. It’s designed to help all students understand how everyday economic decisions and policies affect their lives, their families, and their world. View Page Federal Reserve Education Outreach To promote personal financial responsibility, expose young people to exciting careers in economics and finance, and educate students on the role of the Federal Reserve System in the global economy. View Page Educational Tools Chairman Bernanke's College Lecture Series Chairman Ben S. Bernanke's four-part lecture series about the Federal Reserve and the financial crisis. The lectures were offered as part of an undergraduate course at the George Washington University School of Business. View Page The Federal Reserve and the Financial Crisis: Interactive Timeline The timeline uses video clips to present an historical progression, beginning with the Great Depression and an analysis of the Fed's response, and culminating with the recent financial crisis. View Feature The Federal Reserve and the Financial Crisis: Discussion Questions Questions to assist instructors in guiding class discussion following the viewing of video clips. View Page Learn More about Federal Reserve System Educational Resources Accessible Keys for Video [Space Bar] toggles play/pause; [Right/Left Arrows] seeks the video forwards and back (5 sec ); [Up/Down Arrows] increase/decrease volume; [M] toggles mute on/off; [F] toggles fullscreen on/off (Except IE 11); The [Tab] key may be used in combination with the [Enter/Return] key to navigate and activate control buttons, such as caption on/off. var seek; window.addEventListener('DOMContentLoaded', function() { var myPlayer; videojs('frb-video20677').ready(function() { myPlayer = this; myPlayer.on('loadstart',function(){ var videoInfo = ""; var transcriptLinkLabel; if (myPlayer.mediainfo.custom_fields["actualdatetext"]) { videoInfo += "<span class='col-xs-6'>" + myPlayer.mediainfo.custom_fields["actualdatetext"] + "</span>"; } if (myPlayer.mediainfo.custom_fields["transcriptlinkurl"]) { if (myPlayer.mediainfo.custom_fields["transcripttext"]) { transcriptLinkLabel = myPlayer.mediainfo.custom_fields["transcripttext"]; } else { transcriptLinkLabel = "Transcript (PDF)"; } videoInfo += "<span class='col-xs-6 text-right'><a href='" + myPlayer.mediainfo.custom_fields["transcriptlinkurl"] + "'>" + transcriptLinkLabel + "</a></span>"; } $("#videoDetails20677").html(videoInfo); }) }); seek = function (time) { // Advance to cue point, start playing if not playing. myPlayer.currentTime(time); if (myPlayer.paused()) { myPlayer.play(); } }}); Educational Resources Meet the Fed Frequently Asked Questions Federal Reserve Educ