title = "Federal Reserve Board - Community Advisory Council"
description = "The Federal Reserve Board of Governors in Washington DC."
full_description = '''Home About the Fed Advisory Councils Advisory Councils <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> Community Advisory Council The Community Advisory Council (CAC) was formed by the Federal Reserve Board in 2015 to offer diverse perspectives on the economic circumstances and financial services needs of consumers and communities, with a particular focus on the concerns of low- and moderate-income populations. The CAC complements two of the Board's other advisory councils--the Federal Advisory Council and the Community Depository Institutions Advisory Council--whose members represent depository institutions. The CAC meets semiannually with members of the Board of Governors in Washington, D.C. Records representing views expressed by the council at meetings are posted when available. Thank you for your interest in the CAC. The application window is currently closed. Members Christie McCravy, Chair Executive Director, Louisville Metro Affordable Housing Trust Fund Louisville, Ky. Carlos J. Contreras III, Vice Chair President & CEO, Goodwill Industries of San Antonio San Antonio, Texas Ivye Allen President (retired), Foundation for the Mid South Jackson, Miss. Roberto Gallardo Vice President for Engagement & Associate Professor, Agricultural Economics, Purdue University West Lafayette, Ind. Fearn Gupton Rural Development Manager, South Carolina Department of Commerce Columbia, S.C. Melanie Hogan Executive Director, Linking Employment, Abilities and Potential Cleveland, Ohio Michelle Ka'uhane Senior Vice President & Chief Impact Officer, Hawaii Community Foundation Honolulu, Hawaii Renata B. Kowalczyk CEO, Wilmington Alliance Wilmington, Del. Megan Langley Executive Director, Strengthen North Dakota Souris, N.D. Chan U Lee President and CEO, Devine & Gong, Inc. Oakland, Calif. Ceyl Prinster President and Chief Executive Officer, Colorado Enterprise Fund Denver, Colo. Jose Quinonez CEO, Mission Asset Fund San Francisco, Calif. Eric Robertson Executive Director, The Formanek Foundation Memphis, Tenn. Bruce Schultz Vice President, Community Development Banking Strategy, Gateway First Bank Tulsa, Okla. Justin Slattery Executive Director, Belknap Economic Development Council Laconia, N.H. Records of the meetings of the Community Advisory Council 2024 October 10 PDF May 30 PDF 2023 October 19 PDF May 18 PDF 2022 October 20 PDF May 19 PDF 2021 October 21 PDF May 13 PDF 2020 October 1 PDF May 14 PDF April 13 PDF 2019 November 1 PDF May 24 PDF 2018 October 5 PDF May 4 PDF 2017 November 3 PDF May 26 PDF 2016 October 21 PDF May 13 PDF 2015 November 20 PDF Privacy Act Statement Back to Top Last Update: November 08, 2024'''
