full_description = '''Home About the Fed Board Members <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> Jerome H. Powell, ChairPhilip N. Jefferson, Vice ChairMichael S. BarrMichelle W. BowmanLisa D. CookAdriana D. KuglerChristopher J. WallerBoard of Governors Members, 1914-Present The seven members of the Board of Governors of the Federal Reserve System are nominated by the President and confirmed by the Senate. A full term is fourteen years. One term begins every two years, on February 1 of even-numbered years. A member who serves a full term may not be reappointed. A member who completes an unexpired portion of a term may be reappointed. All terms end on their statutory date regardless of the date on which the member is sworn into office. The Chair and the Vice Chair of the Board, as well as the Vice Chair for Supervision, are nominated by the President from among the members and are confirmed by the Senate. They serve a term of four years. A member's term on the Board is not affected by his or her status as Chair or Vice Chair Board Member Assignments - Board Committees Committee on Board Affairs Vice Chair Jefferson, Chair and Oversight Governor for the Office of the COO Governor Barr, Member Governor Kugler, Member Committee on Consumer and Community Affairs Governor Bowman, Chair and Oversight Governor for DCCA Governor Barr, Member Governor Cook, Member Committee on Economic and Monetary Affairs Vice Chair Jefferson, Chair and Oversight Governor for R&S, MA, and IF Governor Waller, Member Committee on Financial Stability Governor Cook, Chair and Oversight Governor for FS Governor Barr, Member Governor Kugler, Member Committee on Federal Reserve Bank Affairs Governor Waller, Chair and Oversight Governor for RBOPS Governor Cook, Member Governor Kugler, Member Committee on Supervision and Regulation Governor Bowman, Member Vice Chair Jefferson, Member Subcommittee on Smaller Regional and Community Banking Governor Bowman, Chair Governor Cook, Member Governor Kugler, Member Committee on Payments, Clearing, and Settlement Governor Waller, Chair Governor Barr, Member Governor Bowman, Member Back to Top Last Update: March 01, 2025'''
