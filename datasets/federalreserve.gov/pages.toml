title = "Federal Reserve Board - Currency"
description = "The Federal Reserve Board of Governors in Washington DC."
full_description = '''Home About the Fed Currency <div class="js-disabled text-center"> <span class='icon icon-alert icon--jsAlert'></span> <span><strong>Please enable JavaScript if it is disabled in your browser or access the information through the links provided below.</strong> </span> </div> The Federal Reserve Board's Role As the issuing authority for all Federal Reserve notes, the Board of Governors of the Federal Reserve System has a wide range of responsibilities related to paper money, from ensuring an adequate supply to protecting and maintaining confidence in our currency. Together with our partners at the Treasury Department, its Bureau of Engraving and Printing, and the United States Secret Service, we continuously monitor the counterfeiting threats for each denomination and make redesign decisions based on these threats. U.S. Currency Website uscurrency.gov provides education tools allowing users to explore all the designs and denominations of Federal Reserve notes. The site features new resources including a training module for cash handlers, a quick reference guide for authenticating currency at the point of sale, and animated educational videos. To learn more about U.S. currency online, visit: Facebook Twitter YouTube Flickr Related Content Press Release Data Currency and Coin FAQs Back to Top Last Update: February 08, 2017'''
