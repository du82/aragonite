["https://federicotrotta.com/%f0%9d%90%82%f0%9d%90%a8%f0%9d%90%a6%f0%9d%90%9e-%f0%9d%90%a5%f0%9d%90%9a-%f0%9d%90%83%f0%9d%90%a8%f0%9d%90%9c%f0%9d%90%ae%f0%9d%90%a6%f0%9d%90%9e%f0%9d%90%a7%f0%9d%90%ad%f0%9d%90%9a%f0%9d%90%b3"]
title = "Come la Documentazione Tecnica Ti Aiuta Nella Vendita del Software - Federico Trotta"
description = "La documentazione tecnica serve anche ai sales. Federico Trotta spiega come la documentazione tecnica aiuti i sales a vendere di più."
full_description = '''Come la Documentazione Tecnica Ti Aiuta Nella Vendita del Software22/01/2024By FedericoIn documentation , documentazione0 Comments Prendiamo in considerazione una scena tipica: il software è abbastanza stabile ed il tuo prodotto è pronto per la vendita.Parti con le vendite ed iniziano ad arrivare i primi clienti, ma…hanno difficoltà ad usare il tuo prodotto!Risultato: aprono ticket al supporto, contattano il customer care, o scrivono al sales di riferimento per capire come utilizzarlo al meglio.Questo genera una serie di richieste interne, impiegando persone di diversi reparti – tra cui gli sviluppatori – che potrebbero essere evitate documentando.Nel frattempo, però, le vendite non crescono, nonostante il tuo prodotto sia al top del mercato, ed inizi a chiederti il perché. Fai un po’ di indagini e…viene fuori che i sales non sono in grado di utilizzare il prodotto!Vieni a sapere che le DEMO sono spesso un disastro, specialmente quando i clienti fanno qualche domanda specifica sull’utilizzo del prodotto.Ma soprattutto, si vede l’impaccio di chi si sta impegnando con tutte le sue possibilità, ma proprio non riesce a far percepire il reale funzionamento del prodotto al cliente perché non lo sa utilizzare in maniera chiara. Tutto questo potrebbe essere risolto in modo molto semplice: documentando.Ora…la verità è che non puoi dare la colpa ai sales!Hai scelto di top di mercato, alcuni con già un bacino di clienti. Sanno vendere: lo sai e te lo hanno dimostrato.Il punto è solo uno: hanno bisogno di un piccolo aiuto.Perché i tuoi sales hanno bisogno della documentazione tecnicaLa documentazione tecnica non è solo per i clienti o per gli sviluppatori: è anche per i sales.Avere una documentazione tecnica indirizzata all’utilizzo del prodotto e, magari, nello specifico per creare una DEMO di successo, aiuta enormemente i sales, permettendo loro di portare a casa molti più contratti di quanti tu possa immaginare.Le documentazione tecnica che può essere progettata per i sales comprende:Standardizzazione delle DEMO, per essere sicuri che tutti seguano lo stesso iter avendo a disposizione la documentazione, senza scordarsi nulla e senza sorprese.Documentazione delle feature e del funzionamento base del prodotto, così non dovranno più andare a memoria.Possibilità di autonomia totale, senza bisogno di richiedere la presenza in chiamata di qualche tecnico.Aggiornamento continuo della documentazione da un’unica “fonte della verità”, senza far girare vari PDF in azienda che, poi, non sono aggiornati all’ultima versione del software (e questo vale specialmente in ambienti a frequenti rilasci).Come sviluppare la documentazione tecnica per aiutare i tuoi sales a vendere di piùLa prima cosa da fare, che potrà anche risultare ovvia, è quella di affidarsi ad uno specialista della documentazione: altrimenti, il rischio è quello di perdere tempo e soldi.Le cose principale da tenere in mente quando si sviluppa la documentazione per i sales sono:Sviluppare la documentazione in un ambiente che sia raggiungibile ed utilizzabile da persone che possono non avere competenze informatiche. Pubblicare la documentazione su una pagina statica (come, per esempio, GitHub pages) può essere una soluzione ottimale. In questo modo, è sempre raggiungibile ed è aggiornata all’ultima revisione (no PDF!!).Pensare ad un percorso per guidare i sales in una DEMO standard. Non importa che illustrino il funzionamento di tutto il prodotto in chiamata: devono saper mostrare le features principali e saperle descrivere.Preparare una presentazione per la parte finale, indirizzata alla vendita (e il tuo reparto marketing qui può sicuramente aiutare il technical writer!).Ciao, io sono Federico e sono un Technical Writer freelance:<img fetchpriority="high" decoding="async" width="408" height="408" src="https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited.png" alt="Federico Trotta" class="wp-image-1109 lazyload" style="aspect-ratio:4/3;object-fit:cover" srcset="https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited.png 408w, https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited-300x300.png 300w, https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited-150x150.png 150w" sizes="(max-width: 408px) 100vw, 408px">Vuoi collaborare con me? Contattami!Vuoi saperne di più su come lavoro? Puoi partire dai miei case studies e dal mio portfolio. Tags:documentationFederico Trottasoftware Federico TrottaTechnical Writer: I document digital products and write articles about AI & Python programming. (p) Prev Post3 Reasons Why You Shouldn't Entrust Your Technical Documentation to an Agency (n) Next PostHow Technical Documentation Helps Sales Selling More Leave a reply Annulla risposta Salva il mio nome, email e sito web in questo browser per la prossima volta che commento. Copyright © 2023. All rights reserved.Designed & Developed by Frenify'''
