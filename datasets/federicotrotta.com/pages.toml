["https://federicotrotta.com/3-ragioni-per-cui-non-dovresti-affidare-la-documentazione-tecnica-ad-una-agenzia"]
title = "3 Ragioni Per Cui Non Dovresti Affidare la Documentazione Tecnica ad una Agenzia - Federico Trotta"
description = "Spesso, per fare la documentazione tecnica ci si affida alle agenzie, con risultati scadenti. Federico Trotta ti spiega perché hai bisogno di uno specialista."
full_description = '''3 Ragioni Per Cui Non Dovresti Affidare la Documentazione Tecnica ad una Agenzia18/01/2024By FedericoIn documentation , documentazione0 Comments E’ arrivato il momento. Hai finalmente preso la decisione: ti serve un Technical Writer. Di lavoro ne avrà da fare: il prodotto è abbastanza maturo, hai problemi di clienti che ti aprono un sacco di ticket di supporto perché non sanno usare il prodotto, sovraccaricando di lavoro gli ingegneri del supporto, e vorresti anche valutare di documentare il codice del tuo prodotto. Sia mai che qualcuno se ne vada a breve dall’azienda e chi lo sostituirà dovrà spendere un sacco si tempo a farsi formare dai colleghi, che già non hanno tempo.Il budget c’è, ma c’è un problema: non sai a chi rivolgerti.Poi ti ricordi di quella tua conoscenza che “scrive cose” e lavora in una nota agenzia. Decidi, quindi, di chiamare l’agenzia.Fissati il lavoro ed il prezzo, si parte.Però, aspetta, col passare dei giorni inizi a vedere dei problemi:La figura che deve svolgere il lavoro non è autonoma, anche se è senior.Non è stato implementato un processo per inserire la figura, seppur esterna, in un quadro lavorativo che le permetta di muoversi sul prodotto, facendo le giuste domande a chi lo conosce.La persona designata non ha un perimetro chiaro del suo lavoro, per cui viene subissata di richieste, non sapendo come gestirle.Nonostante l’inserimento di questa figura, continua ad esserci un elevato numero di ticket aperti al supporto dai clienti perché non sanno come usare il tuo prodotto.E la lista potrebbe continuare.E sai qual è il punto? Semplice: non stai lavorando con uno specialista della documentazione tecnica legata al software.Ecco, quindi, 3 motivi per cui non dovresti affidare la documentazione ad un’agenzia:Se ti affidi ad un’agenzia di marketing, le figure inserite in organico sanno lavorare, beh…nel marketing! Per quanto la scrittura di blog post sia similare ad un articolo tecnico per alcuni aspetti, per altri aspetti “saper scrivere cose” non basta.Esistono alcune agenzie che fanno documentazione tecnica ma, in generale, sono orientate a settori diversi dall’IT. Il caso tipico è quello di chi sviluppa manuali d’uso per il settore metalmeccanico. Ecco, anche se in quel caso chi lavora in agenzia ha esperienza e capacità tecnica, si tratta di un lavoro completamente diverso da quello del Technical Writer nell’IT.Come succede in tutti i settori, il turnover del personale è, in generale, molto alto. Partendo da zero, avrai bisogno di portare avanti un progetto documentale per diversi mesi: questo potrebbe significare che la figura di riferimento, dopo qualche settimana, cambierà lavoro e te ne sarà affidata un’altra, col rischio di dover ricominciare tutto da capo.Quello di cui hai bisogno, partendo da zero, è un professionista che:Sia indipendente nel testare il prodotto, avendo conoscenze e competenze tecniche specifiche, legate al mondo IT.Si appoggi meno possibile agli sviluppatori ed agli altri reparti, lavorando in autonomia, coinvolgendoli solo quando sia strettamente necessario.Progetti la documentazione, facendo un piano a lungo termine.Comprenda e stabilisca chi sono gli utenti tipo del tuo prodotto, per creare la documentazione ad hoc per loro.Sia in grado si scegliere tra un ventaglio di software per scrivere la documentazione quale sia quello che più si adatti al tuo caso.Raccolga feedback degli utenti e modifichi la documentazione sulla base di questi.In sostanza, ti serve un professionista del settore: non una persona qualunque “che sa scrivere bene”.Hai bisogno di implementare un progetto di documentazione tecnica ma non sai come partire? Continua a leggere!Ciao, sono Federico e sono un Technical Writer freelance:<img fetchpriority="high" decoding="async" width="612" height="612" src="https://federicotrotta.com/wp-content/uploads/2023/03/foto_Federico.png" alt="Federico Trotta" class="wp-image-203 lazyload" srcset="https://federicotrotta.com/wp-content/uploads/2023/03/foto_Federico.png 612w, https://federicotrotta.com/wp-content/uploads/2023/03/foto_Federico-300x300.png 300w, https://federicotrotta.com/wp-content/uploads/2023/03/foto_Federico-150x150.png 150w, https://federicotrotta.com/wp-content/uploads/2023/03/foto_Federico-12x12.png 12w" sizes="(max-width: 612px) 100vw, 612px">Vuoi collaborare con me? Contattami!Vuoi saperne di più su come lavoro? Puoi partire dai miei case studies e dal mio portfolio. Tags:documentationFederico Trottasoftware Federico TrottaTechnical Writer: I document digital products and write articles about AI & Python programming. (p) Prev PostRelease Notes: Come Implementarle in un Ambiente a Rilasci Frequenti (n) Next Post3 Reasons Why You Shouldn't Entrust Your Technical Documentation to an Agency Leave a reply Annulla risposta Salva il mio nome, email e sito web in questo browser per la prossima volta che commento. Copyright © 2023. All rights reserved.Designed & Developed by Frenify'''
