["https://federicotrotta.com/how-to-easily-remove-a-password-from-a-pdf-file"]
title = "How To Easily Remove a Password From a PDF file - Federico Trotta"
description = "Are you trying to remove a password from a PDF by find it impossible to do it? Federico Trotta shows you a free library to do so in few minutes."
full_description = 'How To Easily Remove a Password From a PDF file24/04/2024By FedericoIn programmazione0 Comments Imagine a scenario (which happened to me): your employer gives you the documentation relating to your financial situation and, at a certain point, you have to give it to your financial advisor.Problem: the document is in PDF and is password-protected (which is good), but you can give it to your financial advisor only by loading it on a platform. How do you tell your financial advisor the password?These are the scenarios I imagined to solve the problem:You can load the file on the platform and tell the financial advisor the password via email or phone.You can name the file as password_****** so that they can understand what the password is.You can print the file, scan it, and create a new PDF (problem: in my case, these were 30 pages!!).Now, as a Cyber Security enthusiast, I didn’t want to share the password with anyone, even if it was a unique one, for obvious reasons. Also, I didn’t want to waste time and paper to print 30 pages just to create another PDF.So, the only (right) solution was to find something to remove the password from the file, so that it could be opened by my financial advisor.In this article, I show you how you can remove a password from a PDF in a couple of minutes, and for free.How to remove a password from a PDF fileBefore arriving at the solution I’m showing you, I’ve navigated a lot on the Internet.Let me tell you one thing: you can find a lot of online services that can remove a password from a PDF file, but, in my case, I didn’t want to use one of them for a simple reason: the file was about my financial situation, so I didn’t want to leave somehow a track or a record of my financial situation on a third party database (which is not my financial advisor’s one).So, in this scenario, I found qpdf which is a library that can convert a PDF file into an equivalent one. It has only one disadvantage: it can be used only via a terminal.But don’t worry, is very easy to use it.Let’s see.Qpdf can be installed and used on any OS, but here we’ll see the procedure to do so on Ubuntu.If you are a Windows user, don’t worry: you can install WSL)So, in a Linux environment, install qpdf by typing:$ sudo apt-get install qpdfNow, at this point, we have to be careful if we don’t want to make mistakes. If you are using Ubuntu on Windows (via WSL) you have to move your PDF file to the environment where Ubuntu actually works. You should see something like the following:<img decoding="async" class="lazyload" src="https://miro.medium.com/v2/resize:fit:267/1*fNb5EXzdAgJ5GPqSk9-tsg.png" alt="The linux subsystem (WSL) by Federico Trotta. This is useful to remove a password from a PDF"/>The Linux environment on Windows created by WSL. Image by Federico Trotta.So, as you can see, I have Ubuntu 18.04 under the Linux environment. This folder has been created by WSL when you install it.So, at this point suppose that:Your file is called my_file and it is located on the following path: C:/Home/Linux/Ubuntu-18.04/my_file.pdfmy_file is protected with the following password: my_fileExampleQpdf will create a copy of the file named my_file_free located in C:/Home/Linux/Ubuntu-18.04/my_file_free.pdfNow, via terminal, you just need to type the following:$ qpdf --decrypt --password=my_fileExample C:/Home/Linux/Ubuntu-18.04/my_file.pdf C:/Home/Linux/Ubuntu-18.04/my_file_free.pdfAnd the job is done. So the scheme is:$ qpdf --decrypt --password=<YOUR PASSWORD> file.PDF new_file.PDFConclusionsI hope this article helps you remove a password from a PDF.Let me tell you that protecting your files with passwords is very important to protect your data, but in special cases, this procedure may cause you a lot of headaches.Hi, my name is Federico and I am a freelance Technical Writer:<img fetchpriority="high" decoding="async" width="408" height="408" src="https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited.png" alt="Federico Trotta" class="wp-image-1109 lazyload" srcset="https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited.png 408w, https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited-300x300.png 300w, https://federicotrotta.com/wp-content/uploads/2024/01/foto_Federico-edited-150x150.png 150w" sizes="(max-width: 408px) 100vw, 408px" />Do you want to start a documentation project, collaborating with me? Contact me!Do you want to know more about my work? You can start with my case studies and my portfolio. Tags:Federico TrottasoftwareFederico TrottaTechnical Writer: I document digital products and write articles about AI & Python programming. (p) Prev PostHow To Create a Repository in GitHub(n) Next PostPandas reset_index(): How To Reset Indexes in Pandas Leave a reply Annulla risposta Salva il mio nome, email e sito web in questo browser per la prossima volta che commento. Copyright © 2023. All rights reserved.Designed & Developed by Frenify'
