title = "Data Structures in Python: la Guida Completa - Federico Trotta"
description = "Ci sono diverse data structures in Python, e questa guida completa scritta da Federico Trotta ti aiuterà a far luce sulle più utilizzate, rendendoti un master."
full_description = '''Data Structures in Python: la Guida Completa24/11/2023By FedericoIn programmazione0 Comments Se hai iniziato a programmare, che tu voglia diventare un ingegnere del software o un data scientist, devi assolutamente padroneggiare le data structures in Python.Ci sono diverse tipologie di data structures in Python (altrimenti dette “strutture dati” in italiano) che ci consentono di archiviare dati. In questo articolo approfondiremo quelli più utilizzati. Quindi, se stai iniziando la tua carriera e hai bisogno di imparare le strutture dei dati, allora questo articolo fa sicuramente per te.Data structures in Python: le liste<img fetchpriority="high" decoding="async" width="640" height="427" src="https://federicotrotta.com/wp-content/uploads/2023/11/checklist-2470549_640.jpg" alt="Data structures in Python dal blog di Federico Trotta: una lista" class="wp-image-861 lazyload" srcset="https://federicotrotta.com/wp-content/uploads/2023/11/checklist-2470549_640.jpg 640w, https://federicotrotta.com/wp-content/uploads/2023/11/checklist-2470549_640-300x200.jpg 300w" sizes="(max-width: 640px) 100vw, 640px">Foto di Gerd Altmann da PixabayEsempi su come si definiscano e come si creino le liste in PythonTra le data structures in Python, una lista è una raccolta di elementi ordinati che possono essere di qualsiasi tipo: stringhe, interi, float, ecc…Per creare una lista, gli elementi devono essere inseriti tra parentesi quadre e devono essere separati da una virgola. Ad esempio, ecco come possiamo creare una lista di numeri interi:# Create list of integers my_integers = [1, 2, 3, 4, 5, 6]Ma le liste possono anche avere tipologie di dati “misti” memorizzati al loro interno. Ad esempio, creiamo una lista con sia numeri interi che stringhe:# Create a mixed list mixed_list = [1, 3, "dad", 101, "apple"]Per creare una lista, possiamo anche usare la funzione integrata Python list(). Ecco come possiamo usarlo:# Create list and print it my_list = list((1, 2, 3, 4, 5)) print(my_list) >>> [1, 2, 3, 4, 5]Questa funzione integrata direttamente in Python è molto utile in alcuni casi particolari. Ad esempio, supponiamo di voler creare un elenco di numeri nell’intervallo (1–10). Ecco come possiamo farlo:# Create a list in a range my_list = list(range(1, 10)) print(my_list) >>> [1, 2, 3, 4, 5, 6, 7, 8, 9] NOTA: Ricorda che la funzione `range()` include il primo valore, ed esclude l'ultimo.Manipolazione delle listeGrazie al fatto che le liste sono mutabili, abbiamo tantissime possibilità per manipolarle.Ad esempio, supponiamo di avere un elenco di nomi, ma di aver commesso un errore e di volerne modificare uno. Ecco come possiamo farlo:# List of names names = ["James", "Richard", "Simon", "Elizabeth", "Tricia"] # Change the wrong name names[0] = "Alexander" # Print list print(names) >>> ['Alexander', 'Richard', 'Simon', 'Elizabeth', 'Tricia'] Quindi, nell’esempio sopra, abbiamo cambiato il primo nome dell’elenco da James ad Alexander.NOTA: Nel caso non lo sapessi, nota che in Python al primo elemento si accede sempre con "0", indipendentemente dalla tipologia di dato che stiamo manipolando. Quindi, nell'esempio precedente, "names[0]" rappresenta il primo elemento della lista "names".Ora, supponiamo di aver dimenticato un nome. Possiamo aggiungerlo alla nostra lista in questo modo:# List of names names = ["James", "Richard", "Simon", "Elizabeth", "Tricia"] # Append another name names.append("Alexander") # Print list print(names) >>> ['James', 'Richard', 'Simon', 'Elizabeth', 'Tricia', 'Alexander']Se dobbiamo concatenare due liste abbiamo due possibilità: il metodo di concatenazione oppure possiamo usare extend(). Vediamoli:# Create list1 list1 = [1, 2, 3] # Create list2 list2 = [4, 5, 6] # Concatenate lists concatenated_list = list1 + list2 # Print concatenated list print(concatenated_list) >>> [1, 2, 3, 4, 5, 6]Quindi, questo metodo crea una lista come la somma di altre liste.Vediamo il metodo extend():# Create list1 list1 = [1, 2, 3] # Create list2 list2 = [4, 5, 6] # Extend list1 with list2 list1.extend(list2) # Print new list1 print(list1) >>> [1, 2, 3, 4, 5, 6]Come possiamo vedere, i risultati sono gli stessi, ma la sintassi è diversa. Questo metodo estende list1 con list2.Se, invece, vogliamo rimuovere elementi abbiamo due possibilità: possiamo utilizzare il metodo remove() oppure del. Vediamoli:# Create list my_list = [1, 2, 3, 'four', 5.0] # Remove one element and print my_list.remove('four') print(my_list) >>> [1, 2, 3, 5.0]Vediamo l’altra modalità:# Create list my_list = [1, 2, 3, 'four', 5.0] # Delete one element and print del my_list[3] print(my_list) >>> [1, 2, 3, 5.0]Quindi, otteniamo gli stessi risultati con entrambi i metodi, ma remove() ci dà la possibilità di scrivere esplicitamente l’elemento da rimuovere, mentre del necessita di accedere alla posizione dell’elemento della lista.NOTA: Se hai acquisito dimestichezza con l'accesso alle posizioni, in quanto sopra esempio my_list[3] = 'four'. Perché, ricorda: in Python iniziamo a contare le posizioni a partire dallo 0.List comprehension (o comprensione di lista)Sono molti i casi in cui è necessario creare delle liste partendo da liste già esistenti, generalmente applicando dei filtri ai dati esistenti.Per fare ciò abbiamo due possibilità:Usiamo cicli e istruzioni.Usiamo la list comprehension.In pratica, sono entrambi lo stesso modo di scrivere la stessa cosa, ma la list comprehension è più concisa ed elegante.Ma prima di discutere questi metodi, potresti aver bisogno di una panoramica approfondita di cicli e istruzioni. Ecco un paio di articoli che ho scritto in passato che potrebbero aiutarti:Loops and statements in Python: A deep understanding (with examples)Python Loops: A Complete Guide On How To Iterate in PythonOra vediamo un paio di esempi che utilizzano direttamente cicli e istruzioni.Supponiamo di avere una lista della spesa. Vogliamo che il nostro programma stampi che amiamo un frutto e che non ci piacciono gli altri della nostra lista. Ecco come possiamo farlo:# Create shopping list shopping_list = ["banana", "apple", "orange", "lemon"] # Print the one I like for fruit in shopping_list: if fruit == "lemon": print(f"I love {fruit}") else: print(f"I don't like {fruit}") >>> I don't like banana I don't like apple I don't like orange I love lemonUn altro esempio potrebbe essere il seguente. Supponiamo di avere una lista di numeri e di voler stampare solo quelli pari. Ecco come possiamo farlo:# Create list numbers = [1,2,3,4,5,6,7,8] # Create empty list even_list = [] # Print even numbers for even in numbers: if even %2 == 0: even_list.append(even) else: pass print(even_list) >>> [2, 4, 6, 8]NOTA: Se non hai familiarità con la sintassi %2 == 0, te la spiego. Questa significa che stiamo dividendo un numero per 2 e ci aspettiamo un resto di 0. In altre parole, stiamo chiedendo al nostro programma di intercettare i numeri pari.Quindi, nell’esempio sopra, abbiamo creato una lista di numeri. Per farlo, abbiamo creato una lista vuota che viene utilizzata dopo il ciclo per aggiungere tutti i numeri pari. In questo modo, abbiamo creato una lista di numeri pari da un elenco di numeri “generici”.Ora… questo modo di creare nuove liste con cicli e istruzioni è un po’ “pesante”.In altre parole: richiede molto codice. Possiamo ottenere gli stessi risultati in modo più conciso utilizzando la comprensione delle liste.Ad esempio, per creare una lista con numeri pari possiamo usare la comprensione delle liste in questo modo:# Create list numbers = [1,2,3,4,5,6,7,8] # Create list of even numbers even_numbers = [even for even in numbers if even %2 == 0] # Print even list print(even_numbers) >>> [2, 4, 6, 8]Quindi, la comprensione delle liste crea direttamente una nuova lista e le condizioni sono definite al suo interno.Come possiamo vedere, otteniamo lo stesso risultato di prima, ma in una sola riga di codice: niente male!Ora creiamo una lista con commenti sul frutto che amo (e sul frutto che non amo) con la list comprehension:# Create shipping list shopping_list = ["banana", "apple", "orange", "lemon"] # Create commented list and print it commented_list = [f"I love {fruit}" if fruit == "banana" else f"I don't like {fruit}" for fruit in shopping_list] print(commented_list) >>> ['I love banana', "I don't like apple", "I don't like orange", "I don't like lemon"]Quindi, abbiamo ottenuto lo stesso risultato di prima, ma con solo una riga di codice. L’unica differenza è che qui abbiamo stampato una lista (perché la comprensione delle liste ne crea una!), mentre prima stampavamo solo i risultati.Liste di listeC’è anche la possibilità di creare liste di liste, ovvero liste annidate in un’unica lista. Questa possibilità è utile quando vogliamo rappresentare i dati elencati come una lista univoca.Ad esempio, consideriamo di voler creare una lista di studenti e i loro voti. Potremmo creare qualcosa del genere:# Create lis with students and their grades students = [ ["John", [85, 92, 78, 90]], ["Emily", [77, 80, 85, 88]], ["Michael", [90, 92, 88, 94]], ["Sophia", [85, 90, 92, 87]] ]Questa è una notazione utile se, ad esempio, vogliamo calcolare la media dei voti di ogni studente. Possiamo farlo in questo modo:# Iterate over the list for student in students: name = student[0] # Access names grades = student[1] # Access grades average_grade = sum(grades) / len(grades) # Calculate mean grades print(f"{name}'s average grade is {average_grade:.2f}") >>> John's average grade is 86.25 Emily's average grade is 82.50 Michael's average grade is 91.00 Sophia's average grade is 88.50Con le data structures di tipo lista in Python abbiamo finito.Se vuoi approfondire ulteriormente le liste, di consiglio di leggere questo mio articolo.Data structures in Python: le tuple<img decoding="async" width="640" height="427" src="https://federicotrotta.com/wp-content/uploads/2023/11/steel-ring-3582966_640.jpg" alt="Data structures in Python dal blog di Federico Trotta: un anello di acciaio a simboleggiare una tupla" class="wp-image-917 lazyload" srcset="https://federicotrotta.com/wp-content/uploads/2023/11/steel-ring-3582966_640.jpg 640w, https://federicotrotta.com/wp-content/uploads/2023/11/steel-ring-3582966_640-300x200.jpg 300w" sizes="(max-width: 640px) 100vw, 640px">Foto di Elisa da PixabayLe tuple sono un altro tipo di data structures in Python. Queste sono definite tra parentesi tonde e, come le liste, possono contenere qualsiasi tipo di dati separato da una virgola.Quindi, ad esempio, possiamo definire una tupla in questo modo:# Define a tuple and print it my_tuple = (1, 3.0, "John") print(my_tuple) >>> (1, 3.0, 'John')La differenza tra una tupla e una lista è che una tupla è immutabile. Ciò significa che gli elementi di una tupla non possono essere modificati.Quindi, ad esempio, se proviamo ad aggiungere un valore a una tupla otteniamo un errore:# Create a tuple with names names = ("James", "Jhon", "Elizabeth") # Try to append a name names.append("Liza") >>> AttributeError: 'tuple' object has no attribute 'append'Quindi, poiché non possiamo modificare le tuple, queste sono utili quando vogliamo che i nostri dati siano immutabili; ad esempio, nelle situazioni in cui non vogliamo commettere errori.Un esempio pratico può essere il carrello di un e-commerce. Potremmo volere che questo tipo di dati siano immutabili in modo da non commettere errori durante la manipolazione.Immagina che qualcuno abbia acquistato una maglietta, un paio di scarpe e un orologio dal nostro e-commerce. Possiamo riportare questi dati con quantità e prezzo in un’unica tupla:# Create a chart as a tuple cart = ( ("Shirt", 2, 19.99), ("Shoes", 1, 59.99), ("Watch", 1, 99.99) )Per essere precisi, questa è una tupla di tuple.Poiché le tuple sono immutabili, sono più efficienti in termini di prestazioni, nel senso che risparmiano del nostro computer. Ma quando si tratta di manipolazione, possiamo usare esattamente lo stesso codice che abbiamo visto per le liste, quindi non lo riscriveremo.Infine, analogamente alle liste, possiamo creare una tupla con la funzione incorporata tuple() in questo modo:# Create a tuple in a range my_tuple = tuple(range(1, 10)) print(my_tuple) >>> (1, 2, 3, 4, 5, 6, 7, 8, 9)Data Structures in Python: i dizionari<img decoding="async" width="1024" height="682" src="https://federicotrotta.com/wp-content/uploads/2023/11/book-3294950_1280-1024x682.jpg" alt="Data structures in Python dal blog di Federico Trotta: un dizionario" class="wp-image-920 lazyload" srcset="https://federicotrotta.com/wp-content/uploads/2023/11/book-3294950_1280-1024x682.jpg 1024w, https://federicotrotta.com/wp-content/uploads/2023/11/book-3294950_1280-300x200.jpg 300w, https://federicotrotta.com/wp-content/uploads/2023/11/book-3294950_1280-768x512.jpg 768w, https://federicotrotta.com/wp-content/uploads/2023/11/book-3294950_1280.jpg 1280w" sizes="(max-width: 1024px) 100vw, 1024px">Foto di astize da PixabayUn dizionario è un’altra tipologia di data structures in Python. Esso èmodo per archiviare dati accoppiati come key (chiave) e value (valore). Ecco come possiamo crearne uno:# Create a dictionary my_dictionary = {'key_1':'value_1', 'key_2':'value_2'}Quindi, un dizionario si crea con le parentesi graffe. In esso memorizziamo un paio di chiavi e di valori, separati da due punti. Le coppie key-value vengono quindi separate da una virgola.Ora vediamo come possiamo manipolare i dizionari.Manipolazione dei dizionariSia le chiavi che i valori di un dizionario possono essere di qualsiasi tipo: stringhe (strings), numeri interi (integers) o numeri decimali (flots). Quindi, ad esempio, possiamo creare un dizionario in questo modo:# Create a dictionary of numbers and print it numbers = {1:'one', 2:'two', 3:'three'} print(numbers) >>> {1: 'one', 2: 'two', 3: 'three'}Ma possiamo farlo anche così:# Create a dictionary of numbers and print it numbers = {'one':1, 'two':2.0, 3:'three'} print(numbers) >>> {'one': 1, 'two': 2.0, 3: 'three'}La scelta del tipo per la key ed il value dipende dal problema che dobbiamo risolvere. Ad ogni modo, considerando il dizionario che abbiamo visto prima, possiamo accedere sia ai values che alle keys in ​​questo modo:# Access values and keys keys = list(numbers.keys()) values = tuple(numbers.values()) # Print values and keys print(f"The keys are: {keys}") print(f"The values are: {values}") >>> The keys are: ['one', 'two', 3] The values are: (1, 2.0, 'three')Quindi, se il nostro dizionario si chiama numbers, accediamo alla sue keys con numbers.keys(). E con numbers.values() accediamo ai suoi values.Tieni presente che abbiamo creato una lista con le keys e una tupla con i values utilizzando la notazione che abbiamo visto prima.Naturalmente possiamo anche iterari i dizionari. Ad esempio, supponiamo di voler stampare i valori che sono maggiori di una certa soglia:# Create a shopping list with fruits and prices shopping_list = {'banana':2, 'apple':1, 'orange':1.5} # Iterate over the values for values in shopping_list.values(): # Values greater than threshold'''
