title = "Fediring.net"
full_description = "This webring is for the personal sites of any member of the fediverse (also known as fedizens). Head towards the bottom of the page to see a table of members or continue on to read the rules and how to join :) We accept pretty much any site as long as the owner has an account on fedi. However, we do draw the line at… As it is impossible to list everything that would not be acceptable, we do reserve the right to deny requests. If you want to know whether your site is suitable for inclusion, send a plaintext email to the ticket tracker (address below) and we’ll take a look at it! One of our requirements for joining is that you must have an HTTPS (TLS encryption is required) site on a clearnet domain. Paths are acceptable, e.g. sometilde.service/~username, but this webring is dedicated to clearnet, HTTPS sites. See our other *rings below for more platforms/protocols, such as Gemini. We also tend not to accept fediverse accounts that were recently created or those that have very little activity. This is both an anti-spam measure and a quality assurance measure, as we want to fill the ring with a vibrant and active community of fediverse users. First, add the fediring links to your site’s homepage, replacing YOURDOMAIN with your site’s domain. If you would like, you can also link to fediring.net/random; it directs visitors to a random site in the ring. This one is optional though. If your site is on a path rather than the root domain, you’ll need to URL-encode any special characters. For example, if Sam’s site is sometilde.com/~sam, she will need the following links on her page. After that, simply send a plaintext email to ~jbauer/fediring@todo.sr.ht (yes, that’s an email address) containing the following: This will create a new ticket in our public issue tracker and notify maintainers so they can review it and get it added! Please note that sites listed on the fediring without the links above are subject to removal. Removing these links from your site breaks the ring and ruins the experience for everyone; if ring administrators traverse the ring and notice that the links have been removed, they’ll remove your site from the ring."
year_published = 2025
