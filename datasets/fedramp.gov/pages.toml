description = "The following Cloud Service Providers (CSPs) have been selected to work with the Joint Authorization Board (JAB) for a Provisional Authority to Operate (P-AT..."
full_description = "Blog CSPs Prioritized to Work with the JAB July 25 | 2023 The following Cloud Service Providers (CSPs) have been selected to work with the Joint Authorization Board (JAB) for a Provisional Authority to Operate (P-ATO) from our latest round of FedRAMP Connect: 3rd Eye Technologies, Inc. - Mystic Message Archival Google Cloud - Google Cloud VMware Engine KBR Vaault - KBR Vaault for Public Safety Quzara LLC - Quzara Cybertorch Red Hat - Red Hat Openshift Service Telos - XACTA SAAS These CSPs were selected in accordance with our JAB Prioritization Criteria and FedRAMP Connect Guidance document and will work with the JAB on their security package reviews. We’re proud to see the scope and scale of innovation and the infrastructure modernization that these CSPs will represent for JAB Authorizations. Congratulations! If you are a CSP interested in working with the JAB, please review the JAB Prioritization Criteria and FedRAMP Connect Guidance in its entirety, and reach out to info@fedramp.gov with questions or to set up a coaching call. If you are an agency customer that would like to see a CSP prioritized to work with the JAB, please share the above information with your service provider and reach out to info@fedramp.gov expressing your interest. Back to Blogs Recent Posts Focusing on Delivery Exploring new ways to scale FedRAMP FedRAMP, Looking Back on 2024, Ahead to 2025 FedRAMP Help Center FedRAMP Agile Delivery Pilot Update"
