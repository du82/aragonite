full_description = "Blog CSPs Prioritized to Work with the JAB and Next FedRAMP Connect Due Date June 1 | 2022 The following Cloud Service Providers (CSPs) have been selected to work with the Joint Authorization Board (JAB) for a Provisional Authority to Operate (P-ATO) from our latest round of FedRAMP Connect: Collabware - Collabspace Deloitte - Deloitte Digital Contact Center (D2C2) M.C. Dean - Infralink Merlin - Constellation GovCloud PowerTrain - USAL Federal Learning Enclave These CSPs were selected in accordance with our JAB Prioritization Guidance and Criteria document and will work with the JAB on their security package reviews. We’re proud to see the scope and scale of innovation and infrastructure modernization that this next group of vendors represent for JAB Authorizations. Congratulations! The next due date for FedRAMP Connect Business Cases will be June 10, 2022 at 5:00 p.m. ET. If you are a CSP interested in working with the JAB, please review the JAB Prioritization Guidance and Criteria document in its entirety and reach out to info@fedramp.gov with questions or to set up a coaching call. If you are an agency customer that would like to see a CSP prioritized to work with the JAB, please share the above information with your service provider and reach out to info@fedramp.gov expressing your interest. Back to Blogs Recent Posts Focusing on Delivery Exploring new ways to scale FedRAMP FedRAMP, Looking Back on 2024, Ahead to 2025 FedRAMP Help Center FedRAMP Agile Delivery Pilot Update"
