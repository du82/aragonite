title = "How to Become FedRAMP Authorized | FedRAMP.gov"
description = "authorization process; federal agencies; cloud service providers; Joint Authorization Board; JAB; continuous monitoring; partnership establishment; readiness assessment; FedRAMP Connect; security deliverables; full security assessment; JAB authorization process; agency authorization process"
full_description = "Securing Cloud Services For the Federal Government The Federal Risk and Authorization Management Program (FedRAMP®) provides a standardized approach to security authorizations for Cloud Service Offerings. Learn Program Basics Meet The Process Information for Our Partners Cloud Service Providers Provide your Cloud Service Offering to the federal government Start Process Federal Agencies Adopt innovative cloud services to meet your agency’s mission needs Learn How Assessors Act as a third party to perform initial and periodic security assessments Review Steps FedRAMP Authorization Process Readiness Assessment Pre-Authorization Full Security Assessment Agency Authorization Process The first step of the process is for a Cloud Service Provider (CSP) to find a federal agency to partner with. Once an agency is identified and has agreed to partnership the CSP and agency begin working together towards an authorization starting with a full security assessment and finishing with an authorization process. Once the authorization process is complete, a CSP must engage in continuous monitoring to ensure that the risk accepted at the time of authorization remains acceptable. An agency ATO signifies the agency partner reviewed the security package and deemed the risk acceptable for their use. Upon completion of the agency ATO, the package is then reviewed by FedRAMP and when deemed acceptable for government-wide reuse it is granted FedRAMP Authorization on the marketplace. FedRAMP at a Glance Ready 28 In Process 53 Authorized 211"
