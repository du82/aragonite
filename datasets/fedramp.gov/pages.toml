["https://fedramp.gov/2022-06-28-update-poam-template"]
title = "Update to the Plan of Actions and Milestones Template | FedRAMP.gov"
description = "FedRAMP updated the Plan of Actions and Milestones (POA&M) template to include two new columns. The additional columns were added at the behest of agency..."
full_description = "Blog Update to the Plan of Actions and Milestones Template June 28 | 2022 FedRAMP updated the Plan of Actions and Milestones (POA&M) template to include two new columns. The additional columns were added at the behest of agency partners to help them track Cybersecurity and Infrastructure Security Agency (CISA) Binding Operational Directive (BOD) 22-01 findings, and the associated Common Vulnerabilities and Exposures (CVEs). What’s New? Column ‘AC’: Titled as the ‘Binding Operational Directive 22-01 Due Date’ should be used to track the due date of any BOD 22-01 vulnerability as the due date appears in the CISA Known Exploited Vulnerabilities Catalog. If the POA&M line item is not associated with any BOD 22-01 vulnerability, this cell should be left blank. Column ‘AD’: Titled as ‘CVE’ - should now be used to track the CVE’s associated with the vulnerabilities listed on that POA&M line item (if applicable). If there are no CVE’s associated with that vulnerability, it should be left blank. These columns can be found at the end of the current template headers in Row Five. For more guidance around the purpose and requirements of the POA&M, please review the FedRAMP Plan of Actions and Milestones Completion Guide. Back to Blogs Recent Posts Focusing on Delivery Exploring new ways to scale FedRAMP FedRAMP, Looking Back on 2024, Ahead to 2025 FedRAMP Help Center FedRAMP Agile Delivery Pilot Update"
