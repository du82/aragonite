["https://fedramp.gov/2021-02-16-new-fedrampgov"]
title = "The New FedRAMP.gov | FedRAMP.gov"
description = "FedRAMP is excited to announce the launch of our revamped website. Thanks to feedback from our partners and stakeholders, the website has an improved user ex..."
full_description = '''Blog The New FedRAMP.gov February 16 | 2021 FedRAMP is excited to announce the launch of our revamped website. Thanks to feedback from our partners and stakeholders, the website has an improved user experience that makes FedRAMP information and resources more accessible. The website provides more in-depth information about FedRAMP’s authorization process, enabling agencies, Cloud Service Providers (CSPs), and Third-Party Assessment Organizations (3PAOs) to easily access pertinent information related to their role in the FedRAMP Authorization process. “In the design and delivery of this new site, we wanted to meet our customers where they were within their FedRAMP journey. It's a true reflection of our commitment to improving our stakeholders' experience." -Betsy Steele, FedRAMP Manager for Training and Outreach Some of the key features of the website include: Authorization Process | An interactive graphic on the homepage and new pages that enable specific stakeholders to understand the different steps involved in the process based on either the Agency Authorization or the JAB Authorization paths Program Basics | A new page that explains the mission, history, goals, and legal framework of FedRAMP Documents and Templates | Our documents and templates are now searchable by audience, file type, and publication date FAQs | Try out a newly added search functionality to enable stakeholders to easily search for answers to common questions Site notifications | An alert system notifies users when a blog has been posted or when a document or template has been updated or added Enhanced Marketplace | Refinements to design, structure and functionality to boost accessibility and performance We hope that the updated website will provide you with a better customer experience and ease of finding information that will help all stakeholders in the authorization process. If you have questions, please reach out to info@fedramp.gov. Back to Blogs Recent Posts Focusing on Delivery Exploring new ways to scale FedRAMP FedRAMP, Looking Back on 2024, Ahead to 2025 FedRAMP Help Center FedRAMP Agile Delivery Pilot Update'''
