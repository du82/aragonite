["https://feedbin.me/help/verifying-feed-requests"]
title = "Verifying Feed Requests"
description = "You can verify Feedbin’s HTTP requests using reverse DNS."
full_description = 'Miscellaneous Verifying Feed Requests You can verify Feedbin’s HTTP requests using reverse DNS. For example you might see a request like this in your logs: 206.189.164.12 "Feedbin feed-id:1234 - 21 subscribers" Run a reverse DNS lookup on the IP address from your logs: host 206.189.164.12 12.164.189.206.in-addr.arpa domain name pointer 12-164-189-206.bot.feedbin.com. Verify that the domain name is from *.bot.feedbin.com. Run a forward DNS lookup on the domain name to verify that it’s the same IP address from your logs: host 12-164-189-206.bot.feedbin.com 12-164-189-206.bot.feedbin.com has address 206.189.164.12'
