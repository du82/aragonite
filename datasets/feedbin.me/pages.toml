title = "Feedbin Notifier for iPhone, iPad and Apple Watch"
description = "There are already many great full-featured apps that work with Feedbin. Feedbin Notifier aims to be different."
full_description = "Feedbin Notifier for iPhone, iPad and Apple Watch November 8, 2015 by Ben Ubois There are already many great full-featured apps that work with Feedbin. Feedbin Notifier aims to be different. Feedbin Notifier is a notifications based reader. The idea is to select the handful of feeds or keywords you care about most. Then when Feedbin matches an article, it will send a push notification to your iPhone, iPad or Apple Watch, keeping you informed throughout the day. This way, Notification Center becomes the primary interface for catching up on the stories that are important to you. You’ll see articles along side your email and other notifications allowing tell at a glance if there’s anything you want to read right away. Feedbin is a free universal app for iPhone, iPad and the Apple Watch. On the Apple Watch you can read full articles right away or for a better reading experience use Handoff to continue reading on your iPhone or iPad. Hope you enjoy it! Would love to hear your feedback."
