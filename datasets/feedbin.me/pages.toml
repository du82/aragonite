["https://feedbin.me/blog/2013/03/14/migrating-from-google-reader"]
title = "Migrating from Google Reader"
description = "Google Reader is shutting down on July 1st 2013."
full_description = "Migrating from Google Reader March 14, 2013 by Ben Ubois Google Reader is shutting down on July 1st 2013. This wasn’t a huge surprise, but I spent a lot of time using it over the years and am sad to see it go. If you’re looking for a way to migrate from Google Reader to Feedbin, here is what you need to do. You can no longer export your subscription data from Google Reader directly. Instead, Google has a separate data export service called Google Takeout. On Takeout, you can export your Google Reader data. This will give you a zip file, which you should unzip. To import into Feedbin. Login and go to the Import/Export page. Click choose file and navigate to where you extracted the Google Takeout zip. Select the file called subscriptions.xml and import. As soon as you get the message that the import has started you can start using Feedbin, however it may take a few minutes for all of your feeds to show up."
year_published = 2013
