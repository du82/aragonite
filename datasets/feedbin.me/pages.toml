["https://feedbin.me/blog/page2"]
title = "Feedbin Blog"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Mastodon & Microposts January 5, 2023 by Ben Ubois Feedbin has some new features for your Mastodon reading pleasure. Mastodon supports RSS. However, RSS auto-discovery has been broken on the latest Mastodon release for some time. To remedy this situation, Feedbin will do some extra work to help determine where the RSS feed is. With this in place, all you have to do to subscribe is enter the URL for a user like mastodon.social/@example. Next is the format. Mastodon gets the same great treatment as all short and title-less posts in Feedbin, just like Twitter and Micro.blog. The great thing about this is that there’s nothing actually Mastodon-specific here. Any RSS feed can be styled this way. If a Mastodon post includes a link to a YouTube video or other media, Feedbin will expand the embed right the in the content area. Posts with links will also show the full extracted content and a nice card preview where available. To round out the support, Feedbin now has the ability to post directly to your Mastodon account, with a new built-in sharing service. It will even pre-fill the post with the title and URL of the currently selected article. You can enable this in the Share & Save section of settings. CarPlay for Airshow August 16, 2022 by Ben Ubois Airshow version 1.2 is out now. The biggest new feature is CarPlay. You can browse your queue and access playback controls. There’s a number of other improvements and fixes too: Improved progress sync Broader podcast feed compatibility Various layout fixes Airshow: A Lightweight App for People Who Like Podcasts July 26, 2022 by Ben Ubois Introducing Airshow. It’s a podcast player for iPhone & iPad. It syncs with the Feedbin account you already have. Download it now from the App Store. The idea for the first version is simple: a podcast app that has only the features required to actually listen to and enjoy the shows you love. There are many great podcast apps out there, so why make another one? Two reasons: To add value to your Feedbin subscription. To see if there is an opportunity to make something simpler and nicer than the existing options. There are two ways I think about podcasts. Entertainment or informational. The design philosophy behind Airshow is to treat podcasts as entertainment where the words, and the space between words are part of the medium. So for now it omits some features you might be used to like speed control or sound effects. It also takes a lightweight approach to organizing your podcasts. Playlists, folders, etc… provide a lot of flexibility, but they also make it to easy to oversubscribe and bury shows that you subscribe to aspirationally. Instead there’s one place to go to listen: your queue. The idea here is to spend less time managing and just subscribe to shows you actually want to listen to. New episodes for shows you subscribe to get automatically added to your queue. For podcasts where you only want to listen to the occasional episode, there’s bookmarks. From here you can browse episodes and manually choose what to download. There are three ways to use Airshow: Sync with your existing Feedbin account at no additional cost Completely free without sync A new Airshow only sync plan priced at $19.99/year This goal for now is to get the basics right and to have a simple, lovable and complete product. Please give it a try if that sounds like something you might enjoy."
