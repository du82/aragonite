["https://feedbin.me/blog/page7"]
title = "Feedbin Blog"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Mavericks Push Notifications October 24, 2013 by Ben Ubois OS X Mavericks was released on Tuesday and it has a cool feature that allows websites to send push notifications to your Mac. Feedbin can now take advantage of this by offering push notifications for new articles. To set it up you will need to be using Safari 7 on Mavericks. Then visit the Feeds page under Settings and there will be an option to enable push notifications. Click that and choose to allow Feedbin to send push notification in the resulting pop-up. Next you will need to select which feeds you want to enable push for in the Feed Settings list. It’s a per-feed setting because enabling this for all feeds would be overwhelming. Clicking on a notification will open up the original article and mark the article as read in Feedbin. Saved Searches October 14, 2013 by Ben Ubois Any search can now be saved for quick access later. To create a saved search, start by searching for something, hit save and give your search a title. There’s a saved searches API, if you want to do something with the data other than view it in Feedbin. Search Beta October 10, 2013 by Ben Ubois I’m very happy to announce the availability of search for Feedbin. I’m calling it a beta because there are still improvements to be made and bugs that have not been found, so I’d appreciate your feedback. Search supports some great advanced options like AND, OR and NOT. Have a lot of starred items? Try adding is:starred to your query to just search starred items. is:read/unread are also supported. To search a specific feed, you can add AND feed_id:XX. Results are is sorted by relavance by default, but you can optionally sort by date with sort:asc/desc. Under the hood Feedbin is using elasticsearch to power all of this. Due to the new field, subscribe has been moved and can be accessed by clicking on the dropdown next to search. Pair With Me September 26, 2013 by Ben Ubois I read Frank Chimero’s “The Inferno of Independence” yesterday. It’s a great article, and while I generally have poor reading comprehension, something resonated with me which is that “independence is lonely.” I’ve been thinking that one thing I miss when working on Feedbin is the opportunity to work with others. Open sourcing Feedbin has helped make the work a bit more social, but I’m still left wanting more. So I have an experiment I’d like to try. Do you have an idea for a feature or a bug you would like to fix, but aren’t sure how to approach it or you would like to work on it with someone else? If so, why don’t we work on it together? To set something up, just send me an email with what you’d like to work on and when you’re available. The only thing I would ask is that you already have Feedbin running locally and have Screenhero and Skype installed."
year_published = 2013
clearnet = "https://feedbin.me/blog/page7"
