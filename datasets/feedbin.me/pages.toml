["https://feedbin.me/blog/page5"]
title = "Feedbin Blog"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Feed Toolbar September 20, 2016 by Ben Ubois Feed Toolbar The feed toolbar makes it easy to perform common feed actions including: Renaming Tagging Unsubscribing The feed toolbar can be accessed by clicking on the feed title above the article. This way when you’re browsing unread articles you don’t have to go hunting for a specific feed in the sidebar when you want to make a change. Finally, the feed toolbar creates a way to rename feeds on a mobile device. Subscribe to Email Newsletters in Feedbin February 3, 2016 by Ben Ubois You can now receive email newsletters in Feedbin. Newsletter Subscriptions To use this feature, go to the settings page and find your secret Feedbin email address. Use this email address whenever you sign up for an email newsletter. Anything sent to it will show up as a feed in Feedbin, grouped by sender. Reading email in an email app feels like work to me. However, there’s a certain class of email that I want to enjoy reading, and Feedbin is where I go when I want to read for pleasure. For example, many great websites offer subscription content, usually with an email newsletter component. Not only do I enjoy the premium content from these sites, but I believe this a great way forward for people to support writers. Personally I have paid subscriptions to four of these including: MacStories Above Avalon Stratechery Six Colors This feature is also great for mailing lists and product announcement emails and since it’s just a regular feed, it will sync with your favorite native app as well. Feedbin Notifier vs. Notify by Facebook November 11, 2015 by Ben Ubois Today, Notify by Facebook was released. Conceptually, this is a similar app to Feedbin Notifier, which was released two days ago. The timing is coincidental but still interesting. Left: Feedbin Notifier. Right: Notify by Facebook. A similar coincidence happened when Feedbin launched, which is that two days later Google announced they were shutting down Reader. Weird timing. In my mind, Feedbin Notifier offers many advantages over Notify. The biggest reason to choose Feedbin Notifier is that it works with any source that offers an RSS feed, while Facebook has a limited number of built in sources. Feature Feedbin Notifier Notify by Facebook Sources Anything with an RSS feed 72 Apple Watch App Yes No Read offline Yes No Spotlight Integration Yes No Sync Yes No Privacy Yes LOL Price $3/mo Free This comparison is obviously biased. However, it is worth pointing out that Notify costs nothing, while Notifier only works with a paid Feedbin subscription. I think that having a large free competitor like this validates the idea. It also creates a market for a premium, more fully-featured version, which is what Feedbin Notifier is. Competing with Free is nothing new, it’s what Feedbin has been doing since day one."
year_published = 2020
year_updated = 2020
