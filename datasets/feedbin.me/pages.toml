["https://feedbin.me/home"]
title = "Feedbin"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Reading is something that demands your full attention. Use the immersive full screen mode to bring the content you care about front and center. The light theme is vibrant and crisp while the dark theme can be great when there’s less ambient light in the room. Feedbin can extract the full content of an article for feeds that only offer partial-content. This way you can keep reading without leaving. Listen to podcasts in Feedbin. Feedbin remembers your place so you can pick up where you left off. Use Airshow for a native listening experience. Actions help you manage incoming articles. Using actions, you can automatically star, mark as read or send a push notification on the articles you want. Feedbin supports a powerful and expressive search syntax to find exactly what you're looking for. Save frequent searches to always have the results a click away. Configurable sharing and read-it-later services let you decide what services you want to use. With built-in support for all of the most popular services out there. Articles are updated whenever the original changes so you don't miss any important changes. You can even see the differences to know what changed. Follow your favorite creators, with channels and playlists. There’s no algorithm or confusion about what you have already watched, just the videos from your favorite creators in chronological order. Get newsletters out of your inbox and into Feedbin. Every pro account gets a unique email address to subscribe to and follow newsletters. @feedbin Many thanaks for your invaluable service. I've been a member since you started and you have been a reliable friend who allows me to keep my ebook news stream running without a hitch. Wish you the best in the year to come. @Changelog #240 => 2 week @feedbin free trial => 💸Feedbin Customer💸#RSSResurgence #SupportOpenSource Linking my e-mail newsletters to RSS via @feedbin has been great for discovering interesting content. Recommended! Just discovered @feedbin. Awesome, on BS web RSS reader. The UI is clean, simple and straightforward. Great work guys!"
