["https://feedbin.me/help/debugging-feeds"]
title = "Debugging Feeds"
description = "Feeds are unique snowflakes that change over time; today’s issue may be gone tomorrow. If you experience an issue, please follow these guidelines to capture ..."
full_description = 'Miscellaneous Debugging Feeds Feeds are unique snowflakes that change over time; today’s issue may be gone tomorrow. If you experience an issue, please follow these guidelines to capture a copy of the feed. Download a copy of the feed: curl -sv "$FEED_URL" 2> headers.txt | xmllint --format - > feed.xml If the feed contains an syntax error, don’t try to pretty-print it: curl -sv "$FEED_URL" 2> headers.txt > feed.xml This will save a copy of the feed and the request’s headers Create a Gist. If you have the gist command line tool installed: gist feed.xml headers.txt Include a link to the gist when you email support@feedbin.com'
