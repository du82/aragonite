["https://feedbin.me/blog/page10"]
title = "Feedbin Blog"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Migrating from Google Reader March 14, 2013 by Ben Ubois Google Reader is shutting down on July 1st 2013. This wasn’t a huge surprise, but I spent a lot of time using it over the years and am sad to see it go. If you’re looking for a way to migrate from Google Reader to Feedbin, here is what you need to do. You can no longer export your subscription data from Google Reader directly. Instead, Google has a separate data export service called Google Takeout. On Takeout, you can export your Google Reader data. This will give you a zip file, which you should unzip. To import into Feedbin. Login and go to the Import/Export page. Click choose file and navigate to where you extracted the Google Takeout zip. Select the file called subscriptions.xml and import. As soon as you get the message that the import has started you can start using Feedbin, however it may take a few minutes for all of your feeds to show up. Rediscover RSS March 12, 2013 by Ben Ubois RSS changed how I read online. RSS enabled me to keep up with content from hundreds of websites, and quickly became my number one pastime. This passion for RSS led me to create Feedbin. Feedbin is the kind of RSS client I want to use. It’s fast, familiar and can be used for hours on end. I believe RSS is still the best way to discover content on the Internet and now Feedbin is the best way to use it."
