["https://feedbin.me/blog/2013/09/26/pair-with-me"]
title = "Pair With Me"
description = "I read Frank Chimero’s “The Inferno of Independence” yesterday. It’s a great article, and while I generally have poor reading comprehension, something resona..."
full_description = "Pair With Me September 26, 2013 by Ben Ubois I read Frank Chimero’s “The Inferno of Independence” yesterday. It’s a great article, and while I generally have poor reading comprehension, something resonated with me which is that “independence is lonely.” I’ve been thinking that one thing I miss when working on Feedbin is the opportunity to work with others. Open sourcing Feedbin has helped make the work a bit more social, but I’m still left wanting more. So I have an experiment I’d like to try. Do you have an idea for a feature or a bug you would like to fix, but aren’t sure how to approach it or you would like to work on it with someone else? If so, why don’t we work on it together? To set something up, just send me an email with what you’d like to work on and when you’re available. The only thing I would ask is that you already have Feedbin running locally and have Screenhero and Skype installed."
year_published = 2013
