["https://feedbin.me/about"]
title = "Feedbin"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Feedbin is the best way to enjoy content on the Web. By combining RSS, and newsletters, you can get all the good parts of the Web in one convenient location. The primary goal of Feedbin is to provide a great reading experience. There are no ads, no distractions and no bullshit. Just the content you care about. Our customers are also our users. This lets us focus on making the best product possible and gives customers peace-of-mind that their data is not being mined, analyzed and sold. I’m passionate about product development, software and the open web. I created Feedbin so that I could read my feeds all day at work. I am a designer with a penchant for simple solutions. I have a fondness for small teams, independent software development, and the indie web."
