title = "Newsletter News: Full Formatting and Sender Management"
full_description = "Newsletter News: Full Formatting and Sender Management February 6, 2020 by Ben Ubois You can now view newsletters with the original formatting. Previously, Feedbin was only able to offer the newsletter content with all styles removed to prevent conflicts between Feedbin’s styles and the newsletter’s styles. Next up, there are some new management options available in Settings. When you unsubscribe from a newsletter, future deliveries are blocked to guarantee you don’t see emails that are no longer wanted. However, this creates an issue: what if you want to resubscribe? To help with this, Feedbin maintains a record of all previous newsletter senders. Deactivated senders are newsletters that you are no longer subscribed to. If you’re trying to resubscribe to a newsletter, you can reactivate that sender."
