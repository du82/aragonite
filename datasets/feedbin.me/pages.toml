["https://feedbin.me/blog/2018/01/15/share-to-micro-dot-blog"]
title = "Share to Micro.blog"
full_description = "Share to Micro.blog January 15, 2018 by Ben Ubois Feedbin supports posting to Micro.blog directly. If you’re not familiar with Micro.blog, here’s how its creator, Manton Reece, describes it: A network of independent microblogs. Short posts like tweets but on your own web site that you control. Micro.blog is a safe community for microblogs. A timeline to follow friends and discover new posts. Hosting built on open standards. The experience of using Micro.blog is like the early days of Twitter, in all the best ways. Micro.blog is good for blogging, because it acts as sort of gateway-drug into that habit. Say you start off just using it for Twitter-like microposts, but then you realize you have more you want to say. Micro.blog detects the length of your post and prompts you to add a title, turning that post into a full-fledged blog post. The closest service that I can think of is App.net. However, Micro.blog is different in important ways. Manton has a unique perspective and vision. It is not VC backed, so there’s no pressure to maximize returns. Instead, it can focus on being the best possible product. It has fewer employees. In order for Micro.blog to succeed it doesn’t need to support a whole company, it just needs to support Manton. You can activate it on Feedbin’s Share & Save settings page. You’ll need an app token from your Micro.blog account page."
