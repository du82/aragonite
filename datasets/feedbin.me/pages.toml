["https://feedbin.me/blog/2017/10/13/add-to-homescreen-fixed-and-improved"]
title = "Add to Home Screen Fixed and Improved"
full_description = 'Add to Home Screen Fixed and Improved October 13, 2017 by Ben Ubois Feedbin once-again supports the Add to Home Screen option on iOS. The experience of using Feedbin in Mobile Safari has been improved too. You can now swipe horizontally to navigate between the panels. Feedbin used to support Add to Home Screen, but an update was made to home screen web apps that prevented you from navigating between pages. This meant the feature really only worked for single-page sites, because any attempt to login would kick you out to Safari. This all changed when I came across a simple work-around. If you hijack a link click with JavaScript and then use window.location to direct the the page to the original location then you don’t get kicked to Safari. For example: <a href="/login" onclick="window.location=this.href; return false;" > Login </a>'
