["https://feedbin.me/blog/2023/03/30/twitter-access-revoked"]
title = "Twitter Access Revoked"
description = "Feedbin’s Twitter access was revoked because “this App has violated Twitter Rules and policies.” Which is the same message many Twitter clients received in J..."
full_description = "Twitter Access Revoked March 30, 2023 by Ben Ubois Feedbin’s Twitter access was revoked because “this App has violated Twitter Rules and policies.” Which is the same message many Twitter clients received in January when Twitter first started turning off API access. Twitter does not want any kind of third-party client accessing its data. While it looked like there might be a path forward at one time, it’s now clear that there is not. This means the end of Twitter support in Feedbin. Feedbin will no longer be able to fetch any new content from Twitter, but anything that you have already subscribed to will stay put. I could tell you about the benefits of using open alternatives like RSS or Mastodon instead, but if you’re reading this, you already know."
year_published = 2023
