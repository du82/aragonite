title = "Feedbin Notifier 1.1"
full_description = "Feedbin Notifier 1.1 October 20, 2017 by Ben Ubois There’s a big update to Feedbin Notifier for iOS and Apple Watch available now. Both the iOS app and the watch app now feature images in the notifications. This leverages the images found by Feedbin’s image finder so you’ll see the best image for a post when available. The Apple Watch app has been re-written to make it work without your iPhone present. It will work over LTE or WiFi. Full release notes: iPhone & iPad NEW: App Icon NEW: Notifications now include images (when available) NEW: Password AutoFill IMPROVED: Better performance loading articles FIXED: Various iOS 11 compatibility issues Apple Watch NEW: App Icon NEW: Notifications now include images (when available) NEW: Works over WiFi and LTE, no phone required NEW: Syncs in the background so your content is always up-to-date IMPROVED: Much better performance loading articles from notifications FIXED: Haptic feedback once-again plays when notifications are received FIXED: Marking as read from a notification"
