["https://feedbin.me/blog/page9"]
title = "Feedbin Blog"
description = "A fast, simple RSS feed reader that delivers a great reading experience."
full_description = "Tag Drawers April 19, 2013 by Ben Ubois Tag Drawers are rolling out today. Tag Drawers show you what feeds belong to a tag. Whether you like to keep the drawer closed or open, Feedbin will remember your preference. To complement Tag Drawers there is a new setting to hide any feed that belongs to a tag from the main feeds list. This is useful if you don’t want tagged feeds showing up in two places. Starred Entry Feed April 10, 2013 by Ben Ubois There is now an optional RSS feed of your starred items available. To enable it, visit your settings page and check the “Enable starred entry feed” option. After saving your settings a link to your starred RSS feed will be displayed. The URL will look something like https://feedbin.com/starred/Lx3E5w94M3mOKFtcttHK8w.xml the part at the end is a unique random value assigned to your feed. The URL to your starred feed is not easily guessable, but anyone with your URL can view your feed. I use this feed to automatically add starred entries to Pinboard. You can do this too using IFTTT. To set this up you’ll want to create a new “Feed” recipe. Under “Choose a Trigger” select “New feed item”. Under “Feed URL” Enter your starred entries URL. Select Pinboard as your action channel. In the “Complete Action Fields” form I use these settings URL: {{EntryUrl}} Description {{EntryTitle}} Now any new entries you star will show up in Pinboard. IFTTT offers many other actions you can perform on an RSS feed so I encourage you to check it out. Downtime Today April 6, 2013 by Ben Ubois This morning I performed a database upgrade. The reason for the upgrade was to have more RAM available to the database indexes. One important performance metric for databases is the percentage of the index that can be kept in memory. This number should be as close to 100% as possible and over the last week, Feedbin’s had dropped to 94%. Time for an upgrade. The database upgrade went smoothly, taking only about 6 minutes. However immediately after bringing the site back up, there were many connection timeout errors in the logs. The frustrating part was that the timeouts seemed random. There was still plenty of traffic getting through, but for many people, including me, the site was completely inaccessible. One thing that stood out to me was how long database queries were taking after the upgrade, for some reason the new database was slower than the old one. I’m still trying to figure out why this is, but I’m thinking that the database takes time to figure out what it needs to keep in its cache. I believe that connections were timing out due to how long the database was taking to respond. I’m sorry about any inconvenience this may have caused and will take extra precautions next time something as critical as the database is being upgraded."
