["https://feedbin.me/blog/2013/12/18/view-changes-in-updated-articles"]
title = "View Changes in Updated Articles"
full_description = "View Changes in Updated Articles December 18, 2013 by Ben Ubois Feedbin has been updating articles if they change after they were originally published for a little while. When this was added, Feedbin would also save the original article. This feature provides a way to see the differences between the article when it was first picked up by Feedbin and the latest version. I had been thinking about this feature for a while but lacked a way to show differences in HTML markup effectively. There are many libraries for showing the differences in two pieces of text, but most of them don’t take HTML into account. The answer came the other day when I saw this tweet about Discourse’s updated post history interface which included a nice HTML inline diff option. So Feedbin uses the code from Discourse which I packaged into a Gem."
