["https://www.feedblitz.com/products/multi-user"]
title = "Multi-User - FeedBlitz"
description = "Growing your team while protecting your privacy. Whether you’re adding to your team or hiring virtual assistants, allow others to work on your email marketing with our multi-user feature. You choose which users to add to your account and assign each user specific roles and scopes, creating boundaries on what they can and cannot access.…"
full_description = "Growing your team while protecting your privacy. Whether you’re adding to your team or hiring virtual assistants, allow others to work on your email marketing with our multi-user feature. You choose which users to add to your account and assign each user specific roles and scopes, creating boundaries on what they can and cannot access. Start Your Free Trial Privacy first, always. Each user you add to your FeedBlitz account must create their own login information, keeping your personal login details separate. This allows you to grant access to certain areas of your account while keeping your financial and payment information on lockdown. Improving your effectiveness, expanding your email marketing. Whether you’re a blogger, business owner, online entrepreneur, or corporate manager, nearly all levels of your email marketing can benefit from multi-user. As you delegate tasks to others, the opportunity to increase your efficiency and productivity exists as well. When your team is on point, the door to expand your the potential of your email marketing strategy grows as well. Role and scope-based security. After adding a user to your account, you’ll assign one or more roles to the user. Within each role, you have the ability to assign specific tasks and responsibilities by narrowing the role’s scope of capabilities. Account Manager With this role, you delegate management of your own profile to another team member, or virtual assistant. Extend the scope to access financial information, including payment method, receipts, advertising options, and affiliate revenue reports, or keep the scope narrow to basic profile content only. Site Manager This role has the ability to edit, create, and control anything site-related, including access to mailing lists, subscribers, feeds, and funnels. Site Managers can also edit any templates and subscription forms the site contains. You can restrict a Site Manager’s scope to a few specific sites / lists / feeds, or allow access to them all. Creating a Site Manager is a great way to hand off daily work to a virtual assistant (VA) while protecting your own privacy and financial data - no more shared logins! Campaign Manager Campaign Managers have access to manage mailing lists, mailings, and campaigns only, keeping subscriber information, and your account details, private. This role can create and edit email templates, subscription forms, and email campaigns. The Campaign Manager role is an excellent option if working with a freelance designer or VA, and you’re concerned about privacy compliance (GDPR / CCPA) or confidentiality. User Manager For larger organizations, delegate user management to someone else. This role is a great fit for project managers, large enterprises, or those working with a larger team of individuals, and can also be restricted by scope to the relevant organizational units. Track activity with audit trails. Enjoy total transparency by tracking the activity of every user logged into your FeedBlitz account through audit trails. All activity, including login, sites accessed, templates edited and emails sent, are noted in the trail, giving clear records for each individual user. FeedBlitz’s multi-user feature opens the door for you to: Save time by delegating various tasks of your email marketing. Expand your email marketing team by adding unlimited users to your account. Protect your privacy and login information with individual, unique logins for each user. Assign specific roles to each user, restricting access to your full FeedBlitz account. Control users access with scope-based restrictions for sites, mailing lists or account details. Review comprehensive audit trails for up to a year for every user in your account. Save time by delegating various tasks of your email marketing. Expand your email marketing team by adding unlimited users to your account. Protect your privacy and login information with individual, unique logins for each user. Assign specific roles to each user, restricting access to your full FeedBlitz account. Control users access with scope-based restrictions for sites, mailing lists or account details. Review comprehensive audit trails for up to a year for every user in your account. Expand your empire -- along with your email marketing -- without compromising your privacy. Start Your Free Trial"
