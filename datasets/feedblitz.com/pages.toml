ged. If the notification does not include all of the above listed requirements, it may not be valid. If You believe the Content at issue in any DMCA notice does not infringe or You have authorization from the copyright owner, You may file a counter-notice with FeedBlitz’s Copyright Agent pursuant to 17 U.S.C. § 512(g)(3) that includes: (i) A physical or electronic signature of a person authorized to act on behalf of the owner of an exclusive right that is allegedly infringed. (ii) Identification of the material that has been removed or to which access has been disabled and the location at which the material appeared before it was removed or access to it was disabled. (iii) A statement under penalty of perjury that You had a good faith belief that the material was removed or disabled as a result of mistake or misidentification of the material to be removed or disabled; and (iv) Your name, address, and telephone number, and a statement that You consent to the jurisdiction of Federal District Court in the Di"
