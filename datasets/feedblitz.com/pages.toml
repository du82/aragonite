 make a DMCA copyright claim. That's the summary, but the legal part is below. This is the contract you agree to by using FeedBlitz. So this is the part that actually matters: TERMS OF SERVICE - FULL TEXT FeedBlitz LLC (“FeedBlitz”) provides email marketing or RSS feed services (the “Service”) to users who publish content and create and send email newsletters (“Content”) using FeedBlitz’s proprietary software (the “Software”). The Service is accessible to you at feedblitz.com and any associated subdomains (the “Website”). Any party using the Service, the Software and/or the Website including any employees, independent contractors or representatives, will be referred to as the “Publisher” or “You” for the purpose of these terms of service (“TOS”). By using any or all of the Service, Software and/or the Website or by signing up for an account on the Website or at any partner site (the “Account”), the Publisher accepts and agrees to be bound by the TOS. Any Account that requires payment is considered a Premium Account. FeedBlitz reserves the right to modify the TOS at any time without notice. By continuing to use the Service, Software or Website, the Publisher agrees to be bound to such modifications. If You do not agree to the TOS, You may not use the Website, Software or the Service. ACCOUNT DETAILS: Access. Access to certain areas of the Website or Service may be restricted. FeedBlitz reserves the right to restrict areas of the Website at its sole discretion. Some restricted areas of the Website may be made available to you as a registered user. When you are registered, you are required to create an Account. You may not use as a username the name of another person or entity that is not lawfully available for use, a name or trademark that is subject to any rights or another person or entity or is offensive, vulgar or obscene. Warranties and Representations. The Publisher warrants and represents that You are at least eighteen (18) years of age and are competent to enter into contractual agreements on behalf of Yourself or the entity that You represent and that You have the full right, title and authority to enter into these TOS and grant the rights granted herein and perform the obligations herein. You further warrant and represent that entering into the TOS will not conflict with any other agreement You are subject to. The Publisher further warrants and represents that You have supplied true and correct contact information, including name, company name, mailing address and billing information, including a valid payment source, where applicable. By using the Service, Software and/or the Website, You warrant and represent that You will not use the Website, Software and/or the Service in any way that violates any laws or regulations. The Publisher is responsible for determining whether the Service, Software and/or the Website is appropriate for the Content. Term and Termination. The TOS applies when use the You sign up for an Account (either through a free trial, detailed below, or a paid subscription for a Premium Account) and/or use the Software, Service or any part of the Website, and continues so long as maintain an Account and/or You use the Service, Software and/or the Website. FeedBlitz, in its sole discretion, may terminate the Account (or any part thereof) or Your use of the Service, Software and/or Website and remove and discard any Content, for any reason or for no reason, at any time. FeedBlitz may also, in its sole discretion, for any reason or no reason, and at any time, discontinue or suspend the Publisher’s access to the Service, Software and/or Website, or any part thereof, with or without notice. FeedBlitz is not required to provide any notice to the Publisher of termination or suspension of Your Content or access to the Service, Software, Account, and/or Website. In exercising its rights under this provision, FeedBlitz may, in its sole discretion, deactivate, delete or limit your access to the Account and any corresponding information and files. FeedBlitz shall not be liable to the Publisher or any third-party for termination or suspension of an Account or Service. Ownership of Account. The party whose name appears in the Account details will be the owner of the Account. Should a dispute arise as to the ownership of an Account, absent a Court Order directing otherwise, FeedBlitz will look solely to the details provided in the Account. FeedBlitz will not arbitrate any disputes about Account ownership. Should multiple parties claim ownership over an Account, and the Account details contain any ambiguity, the parties must independently negotiate a resolution. Should a dispute over ownership of an Account arise, FeedBlitz reserves the right to suspend or terminate that Account pending resolution of such dispute. Confidentiality. You are responsible for the confidentiality of your username and password. If, at any time, You learn that your personal information has been compromised, You must immediately notify FeedBlitz. FeedBlitz is not responsible for any losses You incur due to a lost, stolen, or hacked password however, You may be liable to FeedBlitz or other third parties for any losses incurred due to such unauthorized use. FeedBlitz does not have access to your password and can only trigger a password reset. Modifications. FeedBlitz reserves the right, at any time, to modify or discontinue, temporarily or permanently, the Service, Software and/or Website (or any part thereof) with or without notice. You agree that FeedBlitz shall not be liable to You or to any third party for any modification, suspension or discontinuance of the Service, Software and/or Website. Payment. Payment for the Service takes place automatically on a monthly or annual basis. Payment occurs on the date closest to the date you originally signed up for the Service. FeedBlitz will automatically charge the payment source on file in the Account (“Payment Source”) according to the pricing schedule found 