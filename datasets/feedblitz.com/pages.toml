["https://www.feedblitz.com/faq"]
title = "FAQ - FeedBlitz"
description = "Frequently Asked Questions The following questions are intended for potential FeedBlitz clients (list owners, publishers, business owners, etc.). If you are a current client or subscriber with questions on specific features, please visit our support page for assistance. General Questions Do I need a website to have a mailing list? Expand While a website isn’t…"
full_description = '''Frequently Asked Questions The following questions are intended for potential FeedBlitz clients (list owners, publishers, business owners, etc.). If you are a current client or subscriber with questions on specific features, please visit our support page for assistance. General Questions Do I need a website to have a mailing list? Expand While a website isn't necessary to create and maintain a mailing list (although it's going to help you immensely!), we do need proof of a page on the internet that is uniquely you. This can be a page of your website, a profile page on another website, even a social media profile link. If you don't have an official website to host your subscription forms or you would like to start gathering email addresses before your site is complete, you can use the URL of a customized FeedBlitz subscription form. Is FeedBlitz only for automated RSS mailings? Expand No. While that's what we're most commonly known for, the FeedBlitz suite of offerings has expanded immensely over the years offering individual newsletter campaigns, automated RSS mailings, and a highly customizable and adaptable automation system for funnels (also referred to as drip campaigns and autoresponders). Do you have funnel / automation / autoresponder / drip campaigns? Expand Yes, of course! We offer a full suite of automated emails (we call them funnels) with many features including tagging, subscription forms, metrics and more, included in every FeedBlitz account. You can create unlimited funnels starting with your free trial. How much does it cost to send an email? Expand We like to keep things simple, and that includes our pricing. This is why we base our pricing tiers on active, unique email subscribers only. There are no limits on your mailings, mailing lists, funnels, tags or any of the FeedBlitz features. You can send as many emails as you'd like, without fear of penalty or capping, even if your list has hundreds of thousands of active subscribers! Learn more about our pricing tiers here. How do you ensure delivery of my emails? Expand Deliverability is our #1 priority. Every day, many measures are taken to preserve our reputation with global ISPs as well as our deliverability scores. These precautions include: required double opt-in for all email subscribers close monitoring of all subscriber imports delivery metrics to top global ISPs checked every 60 seconds all outbound mailings passed through content filters complaint and unsubscribe metrics monitored 24/7 All of the above along with third-party monitors helps to ensure not only delivery of your emails, but FeedBlitz's industry-leading deliverability rates as well. How do you feel about ads and affiliate links? Expand We welcome them all! You can quickly monetize your mailings through our unique, one-click ad network and earn revenue with every open. And as long as you are in line with the terms of your affiliate agreements, you're welcome to send as many affiliate emails as you choose. Do you have subscription forms? Expand Yes. You can create unlimited subscription forms for the mailing list(s) and funnel(s) in your account. Our subscription forms are highly cusotmizable, come in a variety of formats (sidebar, popup and footer), and can gather any information you wish. Our forms are sleek in design and smart as well. Your forms will either not appear (for popups) or collapse (for sidebar forms) if a current subscriber is visiting your site. This frees up valuable screen space and places the focus back on your content. Can I tag my subscribers? Expand Yes. Enjoy unlimited tagging for your subscribers. Add tags during the subscription process, or action-based criteria such as a funnel series completed, purchase made, link clicked, etc. Can I have multiple users for one account? Expand Yes. With FeedBlitz's multi-user feature you can add multiple users to your account, while still protecting your privacy by restricting each user's capabilities and roles. Learn more about our multi-user feature here. Deliverability Questions Do you handle bounced emails? How? Expand Yes, we take care of all bounced emails, so you don't have to worry about them. This keeps bad addresses off your list (and you won't be paying for them) and also helps ensure deliverability across our servers. Bounced emails happen from time to time, and when they do, FeedBlitz monitors each one. When an email address returns as temporarily undeliverable, this is called a soft bounce, and we log this in our tracking. Our servers will continue trying to reach that mailbox for either three consecutive mailings or for two weeks - whichever period is longer. If an email address still returns as undeliverable after a period of three mailings or two weeks (whichever is longer), the address then turns into a hard bounce and is automatically removed from your mailing list. *Please note, if an address does not exist or is permanently undeliverable, it will return as an immediate hard bounce and be removed from your list. Click here to learn more about soft and hard bounces. What are your mail settings? Expand All email is sent from FeedBlitz@mail.feedblitz.com. We authenticate using SPF and DKIM. Information on updating your domain's SPF records can be found here. Clients are also able to edit what email address shows as the sending email for each of their newsletters. This address will also be the email which receives any replies to mailings. Do you limit how many emails I can send? Expand Absolutely not. You can send as many emails to as many lists, as many times a day as you'd like, without fear of overages or penalties. Our pricing is determined by unique, active email subscribers only, not the frequency of your mailings. In other words, email away! Can you handle large mailing lists? Expand Of course! With a consistent 99.75% deliverability rate, we're proud to handle mailing lists of all sizes, ranging from single digit to 7+ figure lists. Not only do we welcome high volume lists, but high-frequency senders as well. Click here to learn more about our industry-leading deliverability rate. Mailings and Subscriber Questions Can I customize my email template? Expand Yes, absolutely! We want you to customize your template (and all pieces of your email marketing) to match your branding as close as possible. Upload images, icons, match colors, and more with a few quick clicks or by dragging and dropping items around. Fully customize your email templates to match your site or remove everything to resemble a personal email from you, the choice is all yours. Should you have any questions, our support team is on hand along with plenty of tutorials to help guide you. I want to send a short snippet of content then direct readers to my website. Can I do that? Expand Yes. Driving subscribers back to your site can be great to increase engagement and on site-advertising as well. Easily truncate automated emails in the settings of your mailing list or determine the amount of content sent while editing the email template. Either way, you choose how much content to send to your subscribers and the path they will take next when reading. Can I schedule what time my emails are sent out? Expand Yes. For automated campaigns, you will select the day and time window for your mailings, or choose Express and mailings send within 30-45 minutes of a post being picked up by our servers. Manual campaigns, on the other hand, can be sent immediately once compiled or scheduled for a specific day and time. Does FeedBlitz support foreign languages and non-Latin character sets? Expand Yes! FeedBlitz emails in many languages including Japanese, Chinese, Hebrew, Cyrillic, European and many more languages that require accented characters. In addition, the main subscriber-facing pages have also been translated by the FeedBlitz community into French, Spanish, Portuguese, Dutch. These translations are triggered by the language settings of the subscriber's browser and include the footer of mailings. If you would like to control the language of the footer, you may use our white label service which gives full control over the CAN-SPAM compliant footer. To get technical: FeedBlitz supports Unicode (UTF-8) natively, for both HTML and TEXT format emails. It also automatically converts ISO-8859 and Windows-1252 encoded feeds to UTF-8. The only current restriction is that the FeedBlitz user interface is in English. Are images and links preserved in FeedBlitz emails? Expand FeedBlitz's automated mailings will preserve the links and images included in the RSS feed. Mailings powered by a truncated RSS feed, however, will only show content up to the truncation point. Unlike a webpage, RSS and email do not support javascript or iframes. This type of content will not convey in automated emails. If a post contains a video, FeedBlitz will automatically grab a thumbnail of the video to insert in place of the embedded video, rather than leaving a blank space. How many mailing lists can I have in one account? Expand Unlimited - create as many mailing lists (including funnels) as you'd like! It's one of the perks of being a FeedBlitz client: No limits. And if you have one subscriber who opts-in to multiple lists and funnels, you're only charged for that subscriber one time. That's the unique part of active, unique email subscribers. Can I choose which subscribers receive certain emails? Expand Yes! We have a few different ways you can segment your subscribers, depending on what fits your unique goals the best. While you can create a unique segment expression of your own, you can also quickly segment your subscribers by tagging, working with groups, and engagement levels as well. Why is double opt-in required for all subscribers? Expand We choose to require double opt-in for all subscribers. Doing so helps us: Protect the health and vitality of your mailing list. Guard our industry-leading deliverability rate. Comply with CASL, Canada's Anti-Spam Law which requires expressed consent (achieved through double opt-in only). Prepare for the EU's upcoming GDPR implementation. Ensure the highest quality service for all clients. And more. We firmly believe requiring double opt-in for all subscribers one of the best email practices, and stand firm on this choice as it is a non-negotiable part of our TOS. How much information can I ask from subscribers? Expand Short answer: As much information as you would like and your subscribers are willing to give. Working with custom fields, you're able to ask for any information you need from your subscribers. basic email address name + email name + email + zip code name + email + gender + hobby name + email + title + website address When creating your subscription forms, additional text fields automatically create a custom field to use when tagging, segmenting and targeting your subscribers. Can subscribers sign up for more than one list or funnel? Expand Yes, they can. With different subscription forms, or by one form offering multiple list options, a subscriber can sign up for more than one mailing list in your account. Regardless of how many mailing lists or funnels they subscribe to, you will only be charged once for the subscriber in your account. (Remember, only active, unique email subscribers determine your pricing tier.) Does subscribe by text message (SMS) cost extra? Expand We're proud to offer subscribe by text message (SMS) - a $20 value - for free with every FeedBlitz account. Use for multiple mailing lists, with multiple codes, multiple times and you're all set. Can I import subscribers from another newsletter service? Expand Yes. As long as your subscribers have all double opted-in to your list, you are welcome to import them into your FeedBlitz account. To help in this process, we support direct, silent import from AWeber, Constant Contact, FeedBurner and MailChimp through specialized migration tools within FeedBlitz. *Please note, all files are scanned extensively upon import. Email addresses indicated as single opt-in will not complete the import. Do you monitor imports for spammy and bad addresses? Expand Yes, and we monitor imports extremely close. Through a variety of filters (and other techniques we keep top secret), all imports are scanned to detect possible spam and bad email addresses. We do this to protect our the deliverability and sending reputation of both our servers and your mailing lists. Any potentially abusive import that triggers one of our filters will immediately alert our team. When this happens, we revoke the client's import privileges while our security team further examines the triggered list. If everything is in the clear, import rights are reinstated after 24 hours. However, if multiple abuse reports occur, a client's importing privileges will then be revoked. RSS to Email Questions What Is RSS to email? Expand RSS to email is a way to automatically produce a mailing to your subscribers from your web site. Sometimes this capability is called "blog subscriptions" as a way to differentiate it from traditional email marketing or manually produced newsletters. Using the right RSS to email service can be a way to significantly reduce or eliminate much of the time and labor associated with keeping your email subscribers up to date, by automating every aspect of email newsletter production from your blog or other RSS feed. FeedBlitz's RSS to email service is the most capable and the most feature rich available. Is RSS to email a viable alternative to email newsletters? Expand Yes. Remember, your site visitors most likely signed up for your mailings after reading your web site's blog. By definition, then, what you're creating is more than good enough! Among the many features that FeedBlitz's RSS to email capability has is multiple schedule options. We can deliver within seconds of a blog post going live, which is ideal for emergency services and news organizations, or we can set up daily, weekly or monthly alternatives instead. Your subscribers won't be overwhelmed even if you post multiple times a day. FeedBlitz's RSS to email service can also reformat your feed, so you can create a weekly digest even if your feed is full post. Our templates allow you to customize the call to action, add social sharing and much more. Can I personalize an RSS-powered email? Expand Yes, in FeedBlitz, you can personalize your RSS to email updates and blog subscriptions using custom fields for each subscriber. How can I fine-tune a FeedBlitz RSS to email campaign? Expand FeedBlitz's RSS to email service is incredibly feature rich. Here are some ways you can fine time an automated RSS-powered email marketing campaign: Tag filters, to include or exclude specific posts. Intelligent post truncation (keeping formatting, links and images). Custom calls to action. Reformatting your blog posts without coding: Automatically reformat your posts for maximum impact. Create heroes, thumbnails and more. Create recaps and tables of '''
