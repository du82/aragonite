title = "Referral Program with Our Partnership Program - FeedBlitz"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Referrals are indeed the best form of compliments. Referrals that come with the potential to earn money are even better. Outstanding deliverability and enhanced email automation are why clients like you turn to FeedBlitz. If you recommend our services to your network, clients, colleagues, and friends, and those individuals follow through by joining the FeedBlitz family, we want to compensate you. It’s as simple as that. Start Referring Today Why join the FeedBlitz referral program? If you go to a dentist or hairstylist you enjoy, it’s common to want to share the expertise you’ve found with others looking for the same services. Your email marketing provider should be no different. We believe that referring your network to FeedBlitz is the strongest vote of confidence you can offer in us as service providers. Our team strives to nurture your network’s ongoing use of FeedBlitz with the same care and attention that you have grown to know and love to make each referral through our referral program a success. A recurring revenue share for these referrals is our way of saying thank you. The best approach is in recognizing, rewarding and strengthening your relationship with your network, and that is the ultimate goal of the FeedBlitz referral program. Asking yourself: “What about my other partnerships?” Not only do we run a referral program of our own, but our service is fully supportive of your affiliate programs. As long as within agreed-upon terms of your affiliate contracts, you are welcome to use FeedBlitz to email affiliate information as often as you’d like. Maximize your earning potential. There are no limits to your revenue potential. Once an referral program member, you’ll earn a revenue share every month while the referral’s account is in good standing. The more referrals you bring us, the more you can earn over time. The larger the client you bring in, the larger the earning potential. Not only because of FeedBlitz’s tiered pricing structure but because the commission is greater with larger clients as well. Billed Amount Tier 1 Referral Commission Tier 2 Super Referral Commission < $5.00 10% 5% $5.00 – $19.99 20% 5% $20.00-$99.99 30% 10% > $100.00 40% 10% For example, if in one billing cycle you had three referrals which signed up, and the billed amounts to each client were $4, $24 and $120 your commission would be $.40 (10% of $4) plus $7.20 (30% of $24) plus $48 (40% of $120) for a total commission of $55.60 that month. Should a client you referred become a referral program member themselves, you receive a commission on sales referred to us by that client. These are super referral (tier 2) earnings for you. If this client becomes a referral program member and they then bring FeedBlitz a customer with a monthly bill of $25, your client earns $7.50 in tier 1 referral commissions (30% of $25), and you earn $2.50 (super referral commission: 10% of $25). This is in addition to your referral commission that you earn from your client on a tier 1 referral basis. Learn About Your Earning Potential Getting started with the FeedBlitz referral program. It only takes a few easy steps to start referring. All FeedBlitz clients have a personalized referral link and access to banners and more to encourage greater referrals. The most successful FeedBlitz referral program members have used a mixed approach of passive promotions, such as on-site and paid advertising, banners, and so on, with active marketing to your network, such as video promotions, webcasts, and email messaging. When a new publisher signs up for FeedBlitz thanks to your referral, you’ll be credited with a share of their future service fee revenues as long as their account is in good standing. It truly is that easy to start referring and earning. Start Earning with your Referral Link Terms and Conditions Expand These terms and conditions apply to the partnership program only. They are in addition to FeedBlitz’s standard T&C’s here. Eligibility Expand Eligibility is at FeedBlitz’s sole discretion. FeedBlitz may review your eligibility and continued participation (or not) at any time. Exclusivity Expand You can be a member of any other vendor’s referral or affiliate program – your participation does not restrict your ability to earn revenues from other programs. However, you may NOT use FeedBlitz referral or affiliate partnership links in content (online, email, broadcast, video, audio, print etc.) promoting other email marketing services, regardless of whether you are in their referral or affiliate programs or not. If you are not sure about whether a given program, product or service is competitive with FeedBlitz, please don’t hesitate to ask us via technical support. In each user interaction involving FeedBlitz partner programs, there must not be any competitive programs, products or services available to the user in that interaction. Activity Expand In joining the program, you agree to these terms, and you commit to working towards the program goals. In return, FeedBlitz will where possible support you in your efforts. FeedBlitz will, however, review your continued participation in the program if no new referrals have been made in a six month period, or if your referral lifetimes as paying FeedBlitz clients seem to be unusually small or show persistent patterns of anomalous behavior. Abuse and misuse Expand FeedBlitz only works with ethical and responsible partners. We will not tolerate partners spamming, abusing or misleading prospects into joining FeedBlitz. Unethical (FeedBlitz’s view is the only one that counts for this), illegal and any other practice FeedBlitz deems to be improper will result in the immediate termination of your account without refund, and the forfeit of your account balance and any future scheduled payments to you. Our decision on such matters is final. Your use of the program and its links indicates your acceptance of these terms. Misuse includes, but is not limited to, using the referral or affiliate program to effectively discount fees that you pay to FeedBlitz. You may not use the referral or affiliate program on your own account. If you spam, cheat, lie or otherwise try to game the program or the people you refer, it’s over, and no payouts will be made. Payment Expand As long as your FeedBlitz account is active, in good standing, and you are part of the partner program, your partnership account will be credited with the appropriate revenue share when FeedBlitz gets paid."
