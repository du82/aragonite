full_description = "HomeContributorsChristina LekatiChristina LekatiSocial Engineering Trainer & ConsultantCombines psychology and social engineering expertise to understand human behavior, motivation, decision making, manipulation, and deceit in the context of cybersecurityWorks as a consultant and trainer for Cyber Risk GmbH, conducting needs and vulnerability assessments, developing social engineering and insider threat training programs, and providing open-source intelligence analysis for human and corporate targetsShares her knowledge and insights on social engineering techniques and psychological elements of human hacking by speaking at various cybersecurity events around the world, while also contributing to the international OSINT community as an active Executive Board Member at the OSINT Curious projectPublished ArticlesSocial EngineeringHow artificial intelligence impacts the present and future of social engineering attacksChristina LekatiSocial EngineeringAvoiding Analysis Paralysis Christina LekatiSocial EngineeringFrequent social engineering vishing attack scenariosChristina LekatiSocial EngineeringSocial engineering kill–chain: Predicting, minimizing & disrupting attack verticalsChristina LekatiSocial EngineeringHigh value targets: Where should you focus your intelligence collection & analysis efforts?Christina LekatiOther ContributorsGuillaume AllielFounder, CEO PhinasoftDaniel MiesslerHost of Unsupervised LearningChris PickardCyber Security Customer Success Manager at FeedlyMars GrovesCybersecurity Analyst, WriterView All Contributors"
