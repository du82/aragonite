title = "New Feedly Ask AI:  Faster summaries, data extraction, and deliverables | Feedly"
full_description = "Market IntelligenceNew Feedly Ask AI: Faster summaries, data extraction, and deliverablesGrounded in your trusted sources for reliable resultsJay Feyerabendon Oct 17, 202415-Second summaryBuilding market intelligence reports is time-consuming: hours spent reading, extracting insights, and formatting. Generic AI tools often fall short with cookie-cutter, outdated, or unverified results.Today, we're bringing the power of LLMs to Feedly Market Intelligence, making research faster, more accurate, and seamless within our platform. We call this new capability Ask AI.With Feedly Ask AI, you can:Summarize instantly: Built-in article summarization for immediate insights or easy sharing.Customize data extraction and formatting: Automatically extract key data from different articles and format it into tables, graphs, or bullet points.Ask specific questions: Use our LLM to ask detailed research questions and uncover impact or patterns.Accelerate deliverable creation: Use the prompt library optimized for market intelligence to speed up report creation.Increase accuracy: Article selection and inline citations make answers verifiable.Ask AI enables us to create ready-to-use insights and datasets within Feedly, saving us hours of work every week.Tino Klaehne, Director Strategic Innovation & Intelligence, Lufthansa Innovation HubStart Free TrialSummarize instantlyRead less, analyze more. Feedly’s Ask AI lets you quickly generate article summaries tailored to your needs. Whether you want individual summaries or a synthesis of multiple articles, Feedly's AI helps you grasp key points efficiently.Summarize articlesCustom data extraction and formattingAutomatically extract all relevant data from across a set of articles, and format them for export. Whether exporting to a spreadsheet, building out a table, timeline, or visualizations, you can customize the output for your team’s needs.Extract funding data and format in a tableAsk specific questions about the articlesAfter finding the relevant articles, you can partner with Feedly’s Market Intelligence-optimized LLM to ask specific questions of the articles and dive deeper into the content. Simply create a custom prompt to uncover hidden patterns, understand the potential impact, or provide sentiment analysis. No need to copy/paste into other LLMs, and no question is too niche or specific.Analyze competitors’ strategic focusAccelerate deliverable creationSpeed up deliverable creation with our Prompt Library, built specifically for and tested by our community of Market Intelligence customers. Simply select an action, customize the prompt with a few context details, and generate emails, tables, or reports tailored to your research goals.Customize the prompts from library for your company Inline citations make answers verifiableWith separate Gen. AI tools, the sources can be of low quality, and the tools can “hallucinate” answers. Ask AI provides more accurate results: you select the articles from sources you trust, and in-line citations make the answers verifiable.Inline citations linking back to the source article Read less, analyze more with Feedly Ask AIFaster summaries, data extraction, and deliverables grounded in your trusted sources.Start Free TrialYou might also be interested inFundamentalsDeep-dive: Optimizing prompts for Ask AIMachine LearningFeedly Ask AI: Insights from the development processMarket IntelligenceMonitor high-impact stories on topics of interest with ‘Top Stories’"
