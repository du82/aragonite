["https://feedly.com/cve/CVE-2024-13373"]
title = "CVE-2024-13373 - Exploits & Severity - Feedly"
description = "The Exertio Framework plugin for WordPress is vulnerable to privilege escalation via account takeover in all versions up to, and including, 1.3.1. This is due to the plugin not properly validating a user's identity prior to updating their password through the fl_forgot_pass_new() function. This makes it possible for unauthenticated attackers to change arbitrary user's passwords, including administrators, and leverage that to gain access to their account.  CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
full_description = "A critical vulnerability in the Exertio Framework plugin for WordPress allows unauthenticated attackers to perform password changes for any user account, including administrator accounts. The vulnerability stems from insufficient user identity validation in the fl_forgot_pass_new() function, enabling account takeover without requiring authentication. Attackers can potentially: - Change passwords for any user account without authentication - Gain unauthorized access to administrator accounts - Completely compromise website security - Potentially execute administrative actions or steal sensitive information - Bypass existing access controls and authentication mechanisms There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. Immediate recommended actions: - Update Exertio Framework plugin to the latest version - Temporarily disable the plugin if immediate update is not possible - Audit all user accounts for unexpected password changes - Implement additional authentication mechanisms - Monitor for suspicious login activities - Consider using web application firewall (WAF) rules to detect exploitation attempts"
year_published = 2025
year_updated = 2025
clearnet = "https://feedly.com/cve/CVE-2024-13373"
