description = "Track the latest security advisories and their associated vulnerabilities, exploits, patches, CVSS and EPSS scores, threat actors, and MITRE ATT&CK TTP information"
full_description = "A critical Use-After-Free vulnerability in the Windows Ancillary Function Driver for WinSock is being actively exploited in the wild by threat actors including the Lazarus Group, requiring only local access with low privileges and no user interaction for exploitation. Local attackers who successfully exploit this vulnerability can elevate their privileges to SYSTEM level, enabling complete system compromise with high impact on confidentiality, integrity, and availability. Given its confirmed exploitation and inclusion in CISA's Known Exploited Vulnerabilities catalog, immediate patching is essential across all affected Windows versions from Server 2008 through 2025. A local privilege escalation vulnerability in Windows Storage services allows authenticated attackers with low-level access to delete targeted system files through improper link resolution before file access. The vulnerability is actively being exploited in the wild and has been added to CISA's Known Exploited Vulnerabilities catalog, enabling attackers to cause high-impact system disruption and service outages through unauthorized file deletion, though no data exposure is possible. While successful exploitation requires low-level system access, the active exploitation status and potential for severe system disruption make this a critical issue requiring immediate attention. A remote code execution vulnerability in Microsoft HPC Pack enables attackers with adjacent network access to exploit missing authentication controls via specially crafted HTTPS requests to head nodes, requiring only low privileges. Once exploited, attackers can execute arbitrary code across connected cluster nodes without user interaction, potentially compromising entire HPC infrastructures through lateral movement and breaching security boundaries between clusters. The high severity stems from the vulnerability's complete impact on confidentiality, integrity, and availability of computational resources, particularly concerning given HPC environments' critical nature and the potential for widespread infrastructure compromise."
