["https://feedly.com/cve/CVE-2024-12544"]
title = "CVE-2024-12544 - Exploits & Severity - Feedly"
description = "The SurveyJS: Drag & Drop WordPress Form Builder to create, style and embed multiple forms of any complexity plugin for WordPress is vulnerable to arbitrary file deletion due to a missing capability check on the callback function of the SurveyJS_DeleteFile class in all versions up to, and including, 1.12.17. This makes it possible for authenticated attackers, with Subscriber-level access and above, to delete arbitrary files on the server, which can easily lead to remote code execution when the right file is deleted (such as wp-config.php). This function is still vulnerable to Cross-Site Request Forgery as of 1.12.20.  CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
full_description = "Vulnerability in the SurveyJS: Drag & Drop WordPress Form Builder plugin affecting versions up to and including 1.12.17. The issue stems from a missing capability check in the SurveyJS_DeleteFile class callback function, which allows authenticated attackers with Subscriber-level access or higher to delete arbitrary files on the server. An attacker can potentially delete critical WordPress files, including wp-config.php, which could lead to remote code execution. The vulnerability has a high severity CVSS score of 8.8, indicating significant risks to system integrity, availability, and confidentiality. The attack can be performed over a network with low complexity and requires only low-privilege authenticated access. There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. A patch is available in version 1.12.20, which addresses the file deletion vulnerability. Organizations should immediately update the SurveyJS WordPress Form Builder plugin to the latest version. 1. Update the SurveyJS: Drag & Drop WordPress Form Builder plugin to version 1.12.20 or later 2. Implement strict access controls and limit user permissions 3. Monitor file system changes and WordPress plugin activities 4. Conduct regular security audits of installed WordPress plugins 5. Consider using web application firewalls (WAF) to provide additional protection"
