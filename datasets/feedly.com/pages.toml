full_description = "Threat IntelligenceHow Netskope leverages Feedly to accelerate threat intelligence Netskope makes intelligence actionable by pulling threat indicators from Feedly streams into their platform. Annie Bacheron Jun 22, 2023Netskope is a global leader in cybersecurity. They are redefining cloud, data, and network security to help organizations reduce risk, accelerate performance, and secure users and data. They consistently innovate to merge new technologies with their platforms and publish advice on using AI and machine learning to enhance threat detection and intelligence.Netskope’s internal security team uses Feedly for Threat Intelligence to automate the collection and sharing of threat intelligence. They wrote an unsolicited case study about Feedly for Threat Intelligence as a resource for other teams interested in exploring threat intelligence automation. In the case study, Netskope reviews the value of the tool broadly, provides threat intelligence recommendations for security teams, and discusses how they built a plug-in to ingest IoCs found in their AI Feeds in Feedly and add them to objects serving as blocklists in their Netskope tenant.“Intelligence is only useful if it is actionable.”In this case study, you’ll learn how they make intelligence actionable, including:How to set attainable goals for intelligence gathering.How to choose what to monitor among the vastness of the threat landscape.How Feedly AI works for security analysts, in the words of the Netskope security team.How Feedly has helped Netskope perform threat intelligence and which features they use.How Netskope automates IoC ingestion.A demo of pulling threat indicators from a Feedly stream into their platform.Read the full case study to learn how they built the plug-in and freed up analyst time so they could be proactive in other areas, such as engaging in threat hunts.READ FULL CASE STUDYYou might also be interested inThreat IntelligenceHow Airbus CyberSecurity gets actionable