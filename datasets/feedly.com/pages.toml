["https://feedly.com/ti-essentials/posts/frequent-social-engineering-vishing-attack-scenarios"]
title = "Frequent social engineering vishing attack scenarios | TI Essentials | Feedly"
description = "Social engineering vishing scams have been on the rise during the past couple of years making it crucial to employ strong and strategic defense mechanisms."
full_description = '''Social EngineeringFrequent social engineering vishing attack scenariosChristina Lekation Feb 07, 2023"Good day, this is Brian Scott. How can I help you?""Hi, this is Tom Smith from the project management department. I am in urgent need of some help" the voice sounded partially serious but with a clear undertone of distress."Certainly, sir, what is the matter?" answered the IT support employee.Tom: "I am overseas, sitting with our new big & important client, and we are about to finalize our meeting and discuss some last project scope items. Anne, the head of the engineering department, has emailed me some important details that I need to include, but I seem to be logged out from my email account. Did you guys run any updates?"Brian: "No, sir, you should be able to access your emails. Please try to log in."Tom: "Well, you are funny. I do not remember my password, and I am supposed to fly back to HQ tomorrow morning. I only need my password, and I'll be set."That was the start. What the IT Support employee answers next may shape the future of Brian's organization, its business partners, and its clients.Tom seems to be sitting on a hot seat, having very limited time and handling an important client for the company.For Brian, it is simply Tuesday afternoon. He is not too enthusiastic the week has started, and on top, he does not want to deal with an angry manager from another department.In reality, Brian's next decision is a "choose your own adventure" one. How could this story have continued?Scenario 1:Tom: "That sounds awful, Tom. Let me call you back on the number I have in my database and run our verification procedure. You and I both know it is policy not to disclose credentials to any incoming callers."However, the way this story continued was the following, Scenario 2:Brian: "Hmm. can you please provide your employee ID?"Tom: "Yes, it's GA129947."Brian: "Thank you. Your birth date?"Tom: "15.02.1986"Brian: "Great. Please note the password somewhere securely and make sure to delete it after you have logged in."Tom: "Absolutely…"This is a true dialogue. Brian had just fallen victim to a vishing attack and had disclosed highly confidential information through the phone. Tom's impersonator (the social engineer) was able to ask for additional support to log in and eventually access the email account and collect the following data:Tom's email credentialsContractsClient DetailsID documentsSensitive information on other employees and company plansOther credentials that would allow access to the internal network of the company…and more.Vishing Attacks – What do they consist of?Vishing (also called a phone call scam) is a type of social engineering attack whose medium is primarily the phone (the term originates from the words voice + phishing = vishing). Threat actors use vishing attacks when they want to elicit information from a target or to drive them to take a specific action (including the illicit transaction of funds) that ultimately benefits the threat actor. A vishing call always includes deception and manipulation techniques.Caller ID SpoofingAlthough not all, many vishing attacks rely on "caller ID spoofing." ID spoofing allows those malicious calls to appear as if they come from a legitimate or localized source and hide the caller's true identity. As a result, the receivers of vishing attacks tend to start those phone calls by thinking they recognize the caller and automatically associate a certain level of familiarity and trust with them. They are also more prone to pick up the phone and respond openly and acceptably. Still, should the victim not pick up the phone, many scammers leave pre-recorded voicemails that either prime the victims to answer a future call, call back (to a scammer's number) or offer specific directions.Preliminary researchThe time, effort, and resources a cybercriminal will invest in obtaining information on their target varies. In the past few years, we have seen an increase in pretexts in which the callers seem to have excellent knowledge of their targets, their environment, and the person they are impersonating (as in the case of "Tom" described above). In our training classes, participants often wonder how the callers obtain their phone numbers or how they seem to know so much about themselves and the internal workings of their companies. Phone numbers (as well as emails, names, and other data) are often purchased on the Dark Web, resulting from a data breach that happened to another company. Attackers may find additional information relating to their target and their environment through open-source intelligence: the collection and analysis of publicly available resources. (For more details on the planning and preparation of an attack, click here.)End GoalsTypically, attackers want to accomplish one of the following during a vishing attack:to elicit sensitive information (including credentials, internal processes, personal information, etc.)to drive an illicit financial transactionto lure their victims into clicking on a malicious link or download attachments sent via email or text message.Vishing is used to either facilitate an attack or to execute it fully.PretextTo sway the target in the direction they want, the attacker needs to have a pretext that sounds convincing enough to grant them a reason to make one or more of the above requests. Below are some pretexts that seem to be the most popular among threat actors. These are the pretexts that cyber criminals share with one another and keep repeating for years, often leading to successful compromises. By being aware of those popular social engineering scenarios, we are hopefully better able to recognize them when they happen in our environment and defend against them.Frequent Vishing Pretexts (Scenarios)Vishing Attack IllustrationTech SupportImpersonating someone from tech/IT support has been one of the most popular vishing pretexts for years. It became a particularly popular vishing pretext during the Coronavirus pandemic. This scheme involves a malicious social engineer initiating calls to one or more employees within a target organization and claiming to be calling from the internal (or a partner) IT department. They may claim that they are trying to troubleshoot certain issues with the company's email or their virtual private networking (VPN) technology, that they are running certain updates to the internal platform(s), or that they just rolled out some updates. They will claim they need to see if the updates work for that employee's account because they run into problems. This pretext provides social engineers with many opportunities for further requests. It helps them justify asking their targets for:Personal informationUser credentialsEmployee ID numbersInformation on platforms/software/technology used internallyOr, quite frequently, they will direct their targets via email to a malicious webpage that appears to be part of the organization's corporate email or another internal portal and ask them to input their credentials, supposedly to log into the organization’s platform and see if the aforementioned update or problem has been resolved. Once the target inputs their credentials to that fraudulent website, the attackers harvest them.During the pandemic, attackers decided to focus with this approach on new hires. Sometimes, the threat actors even posed as new hires themselves, who had recently started working for the company's IT department. They supported their pretext by creating fraudulent LinkedIn profiles claiming to work for the company and asking their targets to connect with them on LinkedIn before the call. At the same time, they also sent out connection requests to multiple other employees of their target company. Sometimes, they would initiate a short conversation on LinkedIn and a few days later call their victims with the troubleshooting request. That approach cultivated in their victims a certain level of trust and familiarity before the vishing attempt took place.The Twitter HackIn July 2020, Twitter suffered a social engineering attack. According to Twitter's statement: "The social engineering that occurred on July 15, 2020, targeted a small number of employees through a phone spear phishing attack" (in other words, a targeted vishing attack). They add: "A successful attack required the attackers to obtain access to both our internal network as well as specific employee credentials that granted them access to our internal support tools. Not all of the employees that were initially targeted had permission to use account management tools, but the attackers used their credentials to access our internal systems and gain information about our processes. This knowledge then enabled them to target additional employees."The Twitter hack had started the previous day when the attackers began contacting multiple Twitter employees, claiming to be calling from Twitter's Help Desk in the IT Department. The caller claimed they were dealing with a problem another employee reported about the company's VPN. Under that ruse, the attackers would attempt to direct their targets to a fraudulent website that looked identical to Twitter's VPN website and was hosted by a similarly named domain. However, once an employee entered their credentials, the attackers would harvest them and enter the information into the Twitter website. These log-ins would generate MFA notifications requesting the employees to authenticate themselves, which many of them did, leading attackers to a successful account takeover."I have a problem with my account"This pretext is similar to the one described above, except in this case the threat actors assume a different role. An attacker might call the IT support, the help desk, or any other employee within their target organization that belongs to the support/help personnel and pry for sensitive or personal information. The attackers will pretend to either be an employee from within the company or a customer, claiming they have a problem accessing their account. Due to their training and overall job requirement of being helpful, these targets are prone to overlook any feelings of suspicion or red flags and do their best to help the caller out with their problem.The scammer might voluntarily offer information that will sound like "inside knowledge" or details on the customer they are impersonating to establish trust and reliability with their victims. It is worth noting that the information they offer is often publicly available online through open-source intelligence (OSINT).They will try to elicit information such as:Personal informationUser credentialsEmployee ID numbersInformation on platforms/software/technology used internallyIn fewer cases, the cybercriminal may ask their victim to:Initiate a password reset mechanism sent to an email address the attacker ownsUpdate credentials through the phoneCancel an accountTake other actions"Congratulations on your working anniversary! You won…" / Contest winnerWho doesn't like getting a gift from their employer? Particularly an expensive one.In recent social engineering vishing schemes, attackers have been scouting LinkedIn and social media profiles, looking for employee anniversaries within a target company, birthdays, or other important dates. They research via OSINT and log this information. Once an anniversary comes around, they reach out to the respective employee claiming to be calling from the internal HR (or another) department and announce that the company has decided to gift them a voucher or gift as an expression of appreciation for themselves and their loyalty, and good work.To claim their gift, they ask their victims to click on a (malicious) link sent to them via a phishing email.Alternatively, they might try to elicit personal information. A conversation under this pretext may look like this:Attacker: "Hi Caren, this is Lynn from HR. Congratulations on your 5th anniversary in our company! Company_Name has decided to reward your good work, loyalty, and commitment by giving you a spa voucher."Caren: "Yay! That's definitely a surprise. Thank you so much! How do I get to receive it?"Attacker: "You don't have to do much, but first I have to make sure that I have the right address. You must be Caren Smitz with the employee ID number GA118810, correct?" (intentional mistakes are a classic social engineering technique)Caren: "Well, actually, it is Caren Smith, with an 'H'. My employee ID number is GA128872."Attacker: "Oh! So sorry for this mistake. There must be a mix-up in my database. Can you confirm your other details with me, please?"Caren: "Of course!"With this pretext and methodology, the attacker might go on requesting additional personal information. They may eventually send out a malicious link to the caller as well.The Unpaid InvoiceIn this pretext, the caller impersonates an employee from the financing department of a partner company. They claim that an invoice of high importance has not been paid. From that point on, they may continue the call in different ways: They may request an instant transaction while providing the details on the phone or email a fraudulent invoice that directs the payment to one of the threat actor's bank accounts. They choose to apply pressure by keeping the target on the phone until the transaction is complete or calling back multiple times within that day to remind them to process it. They also make sure to entice fear and point out that the matter is urgent, usually by threatening that if the invoice does not get processed within the same (or the next) day, it will affect the continuation of business operations or an ongoing project.A real-life example of such an attack is described in our previous article: "Social-Engineering Kill-Chain: Predicting, Minimizing and Disrupting Attack Verticals," which can be found here."This is your boss calling"A spear vishing call could not be missing from this list.In this scenario, an attacker calls their target, pretending to be their manager, an executive, or someone higher in the hierarchy. The conversation might take different forms, but there are usually 2-3 of the following elements involved in it:The caller makes their level of authority very clearThey create time pressure; they highlight that the matter is urgentThey instill fear; they make clear that there will be negative consequences in the case of non-complianceWhat makes identifying these fraudulent calls particularly difficult is that the attackers often portray a high level of knowledge of the company's internal dynamics and current circumstances and also demonstrate that they know their target personally. In some instances, the attackers were so good at impersonating a company's authoritative figure that they even mimicked their usual idioms and way of talking. In recent years, we have also witnessed the use of voice deepfakes during these vishing calls.We Have Some Work To Do.With this (increasing) level of difficult'''
author = "Christina Lekati"
year_published = 2023
year_updated = 2023
