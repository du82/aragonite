full_description = "A high-severity type confusion vulnerability in Microsoft Edge (Chromium-based) enables remote code execution when a user clicks a malicious link, allowing attackers to execute arbitrary code within the renderer process. The vulnerability has high impact potential across confidentiality, integrity, and availability, with successful exploitation granting attacker code execution at the current user's privilege level. While user interaction is required for exploitation, the low attack complexity and network-based attack vector make this a significant risk for organizations using Edge as their primary browser. A type confusion vulnerability in Microsoft Edge's renderer process can be exploited when users click malicious links, enabling remote code execution with no special privileges required. Successful exploitation allows attackers to achieve complete browser compromise, view and modify sensitive information, and execute arbitrary code within the browser context, all while requiring minimal attack complexity. The widespread enterprise deployment of Edge combined with the low-complexity network attack vector makes this vulnerability particularly concerning for organizations, despite requiring user interaction. Server-Side Request Forgery (SSRF) in Microsoft Dynamics 365 Sales allows an authorized attacker to elevate privileges over a network. A Server-Side Request Forgery (SSRF) vulnerability in Microsoft Dynamics 365 Sales enables an authenticated attacker with low privileges to execute privilege escalation attacks over the network, requiring user interaction. The vulnerability has a high impact on both confidentiality and integrity, potentially allowing attackers to gain elevated access to sensitive information and modify system data with the ability to affect connected systems. While Microsoft has already fully mitigated this issue requiring no action from users, the severity of potential privilege escalation and data exposure underscores the significance of this security update."
