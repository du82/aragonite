["https://feedly.com/customers/posts/db-schenker-case-study"]
title = "How DB Schenker used Feedly to create an “innovation hub” to detect new business opportunities | Feedly"
description = "This leading logistics provider scans the horizon to identify trends and opportunities in real time."
full_description = "Market IntelligenceHow DB Schenker used Feedly to create an “innovation hub” to detect new business opportunitiesThis leading logistics provider scans the horizon to identify trends and opportunities in real timeAnnie Bacheron Jun 02, 2022ImpactDisseminate 18+ newsletters with over 2,000 internal newsletter subscriptionsSurface the latest trends, emerging technologies and competitorsStay on top of customers’ latest logistics investments through targeted intelligenceA small innovation team with a huge impact across the companyDB Schenker’s innovation team used Feedly to create an innovation, trend, and opportunity hub, which they use to analyze and distribute content out to the wider departments that need to gather intelligence, monitor trends, and spot emerging technologies as they evolve. Read about how they did it in this case study.THE CUSTOMERDB Schenker, global leading logistics providerJacek Pucher is a Global Innovation Manager for DB Schenker, one of the world’s leading logistics providers of land, air, and ocean freight. Jacek helps his company stay up-to-date on the latest developments in logistics – whether that’s by keeping an eye on the competition, identifying new business opportunities, or tracking innovations in the market.THE CHALLENGEFinding an efficient system to scan the horizon for emerging trends and business opportunitiesBack in the beginning of 2020, the Global Innovation team didn’t have any tools to help them sift through the flood of information that’s published online every day.Monitoring trends and opportunities manually was impossible and impractical. DB Schenker is a global company, and they need to be up-to-date on competitor strategies, events, trends, and what their customers are up to in different markets around the world.But if they wanted to continue to be successful in a competitive market, they needed to find a way to scan the horizon efficiently. “Companies operate in an uncertain world,” Jacek explains. “To be able to tackle these uncertainties, you need to be constantly monitoring what is happening around you.”THE SOLUTIONUsing Feedly AI to build a hub to monitor innovations, trends, competitors, and opportunitiesWhen Jacek first began pitching Feedly to internal stakeholders, his team was quickly overwhelmed with requests for their own newsletters with real-time information.“Almost right away, we had many colleagues who were interested and asked us to create Automated Newsletters for them,” Jacek recalls. “It started scaling quickly, and very soon it got to the point where our Feedly-dedicated team of two wouldn’t be able to do the monitoring for the whole company.”So instead, Jacek created an internal scaling model that uses Feedly AI to feed DB Schenker’s innovation, trend, competitor, and opportunity hub and triage intelligence out to the wider company.Here’s how he did it:1. Set up Feedly AI to surface the right informationFeedly AI uses a collection of machine learning models to continuously read millions of articles to analyze and tag key concepts in real time. It’s like having an extremely eager research assistant – with a million times the computing power.Jacek set up AI Feeds, AI-powered searches across the web, to track logistics innovations for new developments. He also used Feedly AI’s pre-trained Tech & Scientific Innovation Model to get immediate updates on emerging trends and new technologies.Jacek also set up AI Feeds for the sales teams for DB Schenker’s different business units to help them identify business opportunities. The AI Feeds focused on topics like the supply chain industry, supply chain last mile deliveries, land transport, ocean freight, and warehousing. “It was so simple,” he says.Jacek created this “Logistics Innovation” AI Feed to track innovation in the areas his company cares about the most.2. Curated newsletters disseminate valuable market intelligence information across the companyOnce Jacek had Feedly AI set up to surface relevant information, he created Automated Newsletters. The innovation team curates articles by saving them to a Board in Feedly, and then the newsletters are regularly sent to a predefined list of emails.When Jacek and the innovation team save articles to specific Feedly Boards, weekly newsletters are sent to subscribers throughout the company. Boards can also kick off a series of other workflows, like pushing content to an innovation portal.Then, he pitched the tool’s market intelligence applications to teams across the company to help other teams set up their own newsletters, based on their intelligence needs.The innovation team’s first internal customer had a very specific goal in mind: they wanted to use Feedly to stay on top of their customers’ latest investments. “If our customers build a warehouse or a production facility, they are going to need logistics services soon,” Jacek explains. “If we know about that earlier, our sales team can approach our customers to offer our services.”From there, interest grew quickly, and multiple teams approached Jacek to set up their own Automated Newsletters. Pretty soon, Jacek had used Feedly AI to set up 18 different newsletters for teams across the company.3. The innovation team creates a scalable framework for surfacing trendsNow, when a team approaches Jacek to help them gather market intelligence, the process is simple:Jacek asks the department what keywords and concepts they would like to track.Then, he creates the AI Feeds for them and asks for feedback.Together, they refine their AI Feeds to improve the signal-to-noise ratio, so they only receive what’s most relevant to them.Finally, he trains a team “Feedly editor,” who becomes the owner of the department’s market intelligence – and Jacek is free to go help the next team who wants to gather market intelligence.Jacek says, “I assist them in the first few weeks, and I help them publish the first newsletter. After that I hand over the reins and that person becomes responsible for intelligence gathering for their team. They can do their own thing.”“If our customers build a warehouse or a production facility, they are going to need logistics services soon. If we know about that earlier, our sales team can approach our customers to offer our services.”Jacek Pucher, Global Innovation Manager for DB SchenkerTHE RESULTSA small innovation team with a huge impact across the companyDB Schenker now has an innovation, trend, and opportunity hub, which they use to analyze and distribute content to the wider departments that need to gather intelligence, monitor trends, and spot emerging technologies as they evolve.Over 2,000 active newsletter subscriptionsSo far, the 18 newsletters have over 2,000 subscriptions, with many employees signing up to more than one. Every new employee gets the option to sign up for Automated Newsletters during their onboarding as well. “I get lots of positive feedback,” Jacek says. “People really value these newsletters and the insights they provide.”The “innovation hub” that the team built with Feedly has been so successful that Jacek gathered internal feedback and wrote an internal success story about the initiative.Jacek gathered feedback from employees across the company and wrote this internal article (shared here with permission from DB Schenker) to illustrate the success of their innovation hub with Feedly.A collaborative network to break down information silosSetting up Feedly as a hub for market intelligence has created an unexpected benefit for the Global Innovation Team, as well: Jacek now has a network of people across the company who can collaborate and lean on each other as resources. He credits the success of this “innovation hub” to the broader team of “Feedly editors” who scan, analyze, and distribute newsletters through Feedly every week for the sales teams within each business unit.Jacek reflects on what the Global Innovation team has been able to achieve since starting to use Feedly: “Strategic foresight and scenario building are the innovation tools of the future. And you cannot build scenarios if you don’t know what is happening and what has happened. That’s the big opportunity that Feedly creates for us.”“Strategic foresight and scenario building are the innovation tools of the future. And you cannot build scenarios if you don’t know what is happening and what has happened. That’s the big opportunity that Feedly creates for us.”Jacek Pucher, Global Innovation Manager for DB SchenkerStart building your own innovation hubTry Feedly for Market Intelligence to track emerging trends, monitor competitors, identify business opportunities, and share insights with your organization.TRY FEEDLY FOR MARKET INTELLIGENCE"
