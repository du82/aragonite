["https://feedly.com/ti-essentials/posts/defining-osint-and-its-role-in-cyber-threat-intelligence"]
title = "Defining OSINT and Its Role in Cyber Threat Intelligence | TI Essentials | Feedly"
description = "Open Source Intelligence refers to all data publicly available for exploitation. It is widely used in threat intelligence to detect and counter cyber attacks."
full_description = "Threat IntelligenceDefining OSINT and Its Role in Cyber Threat IntelligenceNihad Hassanon Mar 08, 2022The following is a guest post from author and Senior Open Source Analyst, Nihad Hassan. For more content from Nihad, find him on Twitter or follow his blog on Feedly.The amount of digital data created every day worldwide is increasing at an explosive rate. According to Statista, the amount of data produced and replicated in 2025 is projected to reach 180 zettabytes. Much of this data is generated from the increased number of IoT devices and people interactions across social media platforms. Exploiting this data became a primary target for businesses and government agencies, but it also attracted threat actors such as cyber attackers to benefit from it.This article will introduce the concept of gathering information from public sources, focusing primarily on internet-based resources. This introductory article will become the basis for another series of articles that cover the art of exploiting public online resources to protect enterprises' attack surfaces from the ever-growing number of cyber-attacks.Skip ahead:Defining OSINTPrimary OSINT sourcesWho Needs OSINT?Social Media Intelligence (SOCMINT)The Legal Aspects of OSINT GatheringPopular OSINT techniques and toolsSummaryDefining OSINTOpen Source Intelligence (OSINT) refers to all data publicly available for exploitation without legal restriction. This data is not limited to what we can find when using search engines, such as Google, as most resources are buried in the deep web, and a small part is hidden within darknet networks, such as TOR and I2P.OSINT is now widely used in threat intelligence to detect and counter advanced cyber-attacks before turning into an immediate risk. For example, by leveraging OSINT sources, organizations can detect internal and external security vulnerabilities in their IT environment and work to fix them quickly before they get exploited by malicious actors.OSINT sources can come from offline or online sources, although the proliferation of internet technology has made most sources now located in the digital sphere.Primary OSINT sourcesOSINT can be found in the following channels:The Internet: This includes everything published online freely or requires a user registration to access. Examples include Discussion forums, blogs, social media platforms, websites and blogs, news groups, Whois history of domain names, internet archives, reverse image search, and wikis, to name only a few.Traditional Media Channels: TV, radio broadcasts, books, newspapers, and paper magazines.Grey Literature: This includes all information published using non-traditional publishing routes, such as academic publications, desertions, articles, scientific papers, research proposals, whitepapers, annual reports, government documents, speeches, and business profiles databases. Most of these resources require users to register and pay a subscription fee to access stored resources. A comprehensive list of all documents types that are considered to belong to grey literature can be found in Document Types in Grey Literature.Metadata Information: Digital media files, such as images, audio, and video files posted online, contain additional information within them. Metadata can contain valuable information such as capturing device type (for photos), date/time when the image/video was created or modified, geolocation data, and information about the application/operating system used to create the file, among other things.Geospatial information: Such as online maps and commercial imagery satellites photos.Who Needs OSINT?Different user groups leverage OSINT for various purposes.Ethical HackersEthical hackers use the same attack techniques and tools utilized by black hat hackers to discover security vulnerabilities and weaknesses in target systems. The aim is to find security flaws before real attackers exploit them for malicious purposes. OSINT can be used in this domain for:Finding sensitive information leaked or discussed on the darknet, such as account credentials and sensitive business files.Discover open services, ports, unpatched operating systems, and any outdated internet-facing application.Gather different technical information about target company IT infrastructures, such as types of security solutions installed (Firewalls, IDS/IPS, DLP, and anti-malware), server/endpoint devices OS version, and networking devices types.Measure the online exposure of a specific entity, whether an individual or an organization and work to remove any sensitive information that threat actors can exploit.EnterprisesPrimarily, private organizations leverage OSINT for the following reasons:To foster their competitive advantages by acquiring intelligence about their competitors, customers, and new markets.Monitor emergent situations and act promptly to save company employees and its assets.OSINT helps investigate security incidents and is leveraged by security teams, for example, when investigating a security breach.A primary reason enterprises use OSINT is utilizing it for cyber threat intelligence (CTI). The internet is a rich source of threat data, and OSINT provides unparalleled space to discover threatening information from publicly available sources. This helps Security Operation Center (SOC) teams get actionable information to prevent, detect, and respond to various cyberattacks. OSINT is an essential element to strengthen any organization’s proactive cybersecurity posture.An example of using OSINT for cyber threat intelligence (CTI), is when a company searches the internet for its email addresses. The search finding could be used to get information about potential threats targeting this company. For example, in (Figure 1), hundreds of leaked email addresses along with their passwords were found in a text file uploaded to a free file sharing service. This gives a clue that a security breach occurred against the target company, and there is a high probability that threat actors are preparing additional attacks against it.A leaked file show hundreds of leaked email/passwords found on a free file-sharing websiteGovernment AgenciesGovernment agencies include law enforcement and intelligence agencies. Law enforcement uses OSINT to solve crimes, track organized criminal networks across the borders, fight against human trafficking, illegal trade of goods, and protect citizens from all types of online threats.Government agencies leverage OSINT more innovatively. For instance, they use it to predicate future trends (social, economic, politics) among the public locally and across the globe and prepare intelligence reports accordingly to policymakers to aid in their decision-making process.Intelligence agencies use OSINT to track terrorists and organized criminal groups, such as drugs and arms dealers, and to protect critical public infrastructure (electricity grid, water supplies, nuclear plants, internet infrastructure) from advanced cyberattacks (e.g., APT, ransomware and DDoS).Threat ActorsThis group includes cybercriminals, terrorist organizations, and even countries controlled by oppressive regimes aiming to use internet resources to conduct evil acts. Threat actors use OSINT tools and techniques to gather reconnaissance about potential targets before launching their attacks. Target Ransomware attacks, APT, and spear phishing are examples of cyber attacks that require collecting intelligence about the target before executing a more invasive act.Social Media Intelligence (SOCMINT)The number of social media users is growing at an explosive rate and is projected to reach 4.41 billion in 2025, according to Statista. SOCMINT is a sub-branch of OSINT; it monitors all data posted on various social media platforms, such as Facebook, Twitter, and YouTube.From an intelligence perspective, the data available on social media platforms can be divided into two types:The original content created by the user itself, such as Facebook posts, images, and videos, Twitter tweets, and videos uploaded to YouTube.The other type is the content metadata. This includes all information associated with each post or file (image, audio, or video) uploaded by the user. An example of metadata related to a Facebook post is the date/time of the post and the geolocation data of the post - if enabled by the user (the user's current location when sending this post).Remember that not all content available on social media websites is accessible to the general public. For example, if a user posts something to Facebook and makes the post open for “Friends” only, then all other people who are not friends with the post writer will not see the post.Social media investigation has become a key element in any OSINT gathering task, because of the rich information available on these platforms. For example, we can get a great deal of information about any internet user worldwide by just checking their social interactions on Facebook and Twitter.SOCMINT has become increasingly utilized by governments to advertise their policies and to affect public hearts and minds through targeting them with customized content on social media platforms that promote their policy.On the other hand, terrorist organizations leverage social media sites to spread their propaganda, recruit new fighters, and acquire intelligence about future targets. The low cost and the easy accessibility of social media sites have provided a golden opportunity for terrorists to use them to facilitate their aggressive actions.The Legal Aspects of OSINT GatheringOSINT is about data collected from publicly available sources; however, during our search, we may come across data that is considered private but available online for some reason. For example, Pastebin websites contain leaked information, such as stolen source code, breached accounts credentials, and leaked sensitive files. Such leaked contents are considered publicly available; however, they were there because cybercriminals exposed them. The moral dilemma is whether we believe such information is a part of our OSINT research?Another aspect is the difference between OSINT and SOCMINT. People expect privacy when sharing private information, such as personal photos, videos, and posts when posting to social media sites. However, the general rule of thumb is that anything online is not private and can be read in one way or another. The problem arises from whether collecting data from social media sites is considered legally obtained?For example, OSINT gatherers commonly use sock-puppets accounts (fake social media accounts) when searching social media sites; however, the service agreement of most social media sites prevents creating accounts with fake information. This makes the fake accounts made on social media sites by OSINT investigators violate the platform agreement.Popular OSINT techniques and toolsOSINT has evolved, and there are hundreds of online services, tools, and websites that can aid OSINT gatherers when searching the internet. The following list few common tools and sites to help you get started in your OSINT gathering task.OSINT.link: This is a directory of OSINT tools and services; it contains hundreds of OSINT sources, tools and online services, organized into groups according to their functions.Wayback Machine: Display previous versions of websites.Google Scholar: Search scholarly research and other scientific papers.Maltego: A popular tool for visualizing information gathering tasks and displaying associated links in a node-based graph.FOCA: Find metadata data and hidden information in the digital files it scans.Domain Tools - Whois History: Search for historical Whois records of domain names.Feedly for Threat Intelligence: Use AI to find relevant data regarding specific attackers, threats or vulnerabilitiesSummaryTo survive in today's complex IT threat landscape, organizations need to have reliable and actionable intelligence to respond promptly and efficiently. OSINT allows security teams to gather intelligence from the internet to identify potential threats, detect data leakage, and plan their cyber defenses accordingly.This article introduces the concept of OSINT in general and shows its importance in fighting against cyberattacks that continue to increase daily. In the next series of articles, I will cover other usages of OSINT and demonstrate using practical examples on how leveraging OSINT to conduct advanced searches that can help organizations avoid the most devastating cyberattacks.Special thanks to Nihad Hassan for this contribution to Ahead. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com"
author = "Nihad Hassan"
year_published = 2022
