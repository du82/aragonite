title = "Avoiding Analysis Paralysis  | TI Essentials | Feedly"
description = "Understand the inherent nature of uncertainty in intelligence work."
full_description = "Social EngineeringAvoiding Analysis Paralysis Understand the inherent nature of uncertainty in intelligence workChristina Lekation Jan 11, 2024Intelligence analysis requires cultivating certain mind skills and strengthening or managing some mental tendencies. Curiosity, exercising critical thinking, and constantly asking questions to verify/debunk your hypothesis are some of the positive traits found in the everyday activities of the intelligence analyst. We pride ourselves on having an inquisitive mind (we need it, too) and asking a lot of questions. We work on generating plausible hypotheses and inferences based on verified data we have collected. We spend time reflecting on our assumptions to ensure our biases don’t interfere with them. These are all traits and talents that are sought-after and appreciated in the different fields that require intelligence analysis work.But in the shadow of good critical thinking and the inquisitive mind lurks an ever-present enemy: analysis paralysis. Most thinkers have encountered this enemy, and many have accepted living with it. Analysis paralysis is the tipping point that gets you from being inquisitive to being lost in an ocean of plausible scenarios. It takes your mind from a state of relative clarity and confidence to a foggy, rainy field in which you stand in the middle while different pathways lie ahead. You have studied your findings. Your collection is reliable. But your mind is flooding with alternate plausible hypotheses and interpretations, and you cannot choose which direction to take. Perhaps there needs to be more information collection and more evidence? Maybe we are missing something. “What if” is a phrase that follows a number of thoughts once the analyst looks at the data.It is by no accident that intelligence analysis sometimes feels like a mental balancing act. On the one side of the balancing stick, we try to avoid overconfidence or our own confirmation bias. But on the other hand, lies excess doubt and analysis paralysis. You find your balance when you hold this stick from the middle. And then you walk with it, by maintaining a proper intelligence collection and analysis process and by keeping your mental process in check.But once our balance starts weighing heavier on the side of analysis paralysis, and we start feeling unable to take the next step and move further, what do we do? What do we do when doubt and uncertainty start flooding our minds?Accept that there is inherent uncertainty in intelligence analysisMany analysts find themselves in a position where they overthink their assessments and key assumptions. This can be constructive and useful, but up to a point.There is often an inherent factor of uncertainty in intelligence products. The assessments and assumptions are based on the analyst’s (and their team’s) expertise and the information they have collected and verified at that specific point in time. The intelligence analysis outcome may change as time progresses or if the available information changes. We should also account for the fact that although there will be some verified information, there might also be intelligence that will never be found or that is inaccessible. These blind spots are an inherent part of intelligence work. Our job is to reduce uncertainty as much as possible, but we cannot eliminate it completely.This is also why we are allowed to, or even obliged to, use estimative language when necessary in intelligence analysis products. If there are gaps or uncertainties in the analysis, they should be explicitly accounted for. An assumption can be marked as “Low Confidence” if the analyst feels they are lacking information. But, as D. R. Mandel, in an excellent paper published by NATO, points out:No amount of management excellence, however, can deliver decision-quality information about a competent adversary without injecting a significant amount of uncertainty. D. R. MandelWhen do you have too little, too much, or enough data?There are three main case scenarios when it comes to assessing how much data you have and how to move ahead.Having too little: There is simply not enough data available to help you make a decision. The gaps and uncertainties are considerable, and there is nothing more you can do to enrich your collection. It happens. As mentioned in the section above, there is only one thing you can do: explicitly account for this lack of information and mark this intelligence requirement as “Low confidence” on the basis of limited information availability.Having too much: On the other spectrum, you might find yourself in a situation where you have so much data at your fingertips that you keep asking more questions. Having access to large volumes of data relating to your intelligence requirements might mean that you are also able to find the answers to those questions. So you keep asking more and verifying more. You expand your research further. But after a point, this analysis turns into a never-ending loop. More hypotheses are being generated, and you find yourself in the all too familiar “rabbit holes,” having lost touch with the original requirement. This is when the importance of another mind skill becomes apparent: knowing when to say “enough”. Then, go back and look into your actual intelligence requirements and see if you do have “enough” to answer those.It is essential to identify up-front the minimum threshold of data you need for your decisions and/or the satisfactory threshold. Spending time to go beyond that might not be necessary. At the same time, timing is a crucial factor, and reaching a confident enough intelligence conclusion in a timely manner might be more important than spending more time on collection and analysis, which delays the delivery of the intelligence report (often without significant differences in the outcome).Having Enough: There are those bright moments in time when you have collected enough data, and it also feels like enough. Beautiful. There is not much to say about that, but it probably means that you have settled in your head about how much is enough, and you got it.Stop. And then go back to your research questionsAnother way of dealing with analysis paralysis involves stopping, stepping away, and returning to your ground zero. What does that mean?It is time to stop if your brain has gotten too foggy from analyzing information. Take a step back from the big picture of your analysis, and then go on a walk, take a nap, or do whatever takes your mind away from it. Then, go back to it, but do not return to continuing your analysis from where you left it. Rather, revisit your research questions. Consider whether they are specific enough. Do you have verified information that has led you to some particular answers? If not, you may need to take one of your research questions and break it down into a set of smaller yet more manageable sub-questions. While working on those, consider making smaller yet actionable decisions along the pathway of answering them. It is the good old process of breaking down a task into smaller, more manageable tasks. Instead of working on the puzzle as a whole, focus on one little piece at a time. In the end, all those parts will come together and help you see the big picture of your puzzle too. This process helps foster clarity and confidence in your findings and assessments.Remember, intelligence analysis is a process of answering questions (and their sub-questions).Being able to take a step back and revisit your research questions will always be subject to the time you have available for concluding an intelligence analysis product - there is, after all, a deadline. That’s why stepping back may look different for every project. For some, it may mean stepping away from the analysis for a day. For others, it may mean stepping away for a quick 10-minute walk around the block, until you return to it and do a quick check. Time and deadlines will always be central to the end result. But, like always, you have to do our best with what you have available.Get a sanity checkWhen possible, share your collection and analysis with someone whose expertise you trust. See if your thought process makes sense to that person. If they see what you see or discover that there are collection gaps. Have a second pair of eyes going through your reporting or assumptions.Important: Before sharing anything, in cases where classified information is involved, ensure that the second pair of eyes you involve has the appropriate level of clearance and the necessary approvals to engage with your project.Remember the 15 axioms of intelligence analystsThe Fifteen Axioms of Intelligence Analysts by Frank Watanabe is one of my long-time favorite articles. That’s because it gives a very straightforward reality check. I do not think that he chose the sequence of his axioms randomly. The very first one is: “Believe in your own professional judgment”. Only after that does he mention two more axioms in which the element of being wrong appears.The second axiom is “Be aggressive, and do not fear being wrong,” while the third one is “It is better to be mistaken than to be wrong”. He continues with twelve more statements on what intelligence analysis entails. They include the value of properly disseminating intelligence, avoiding personal biases, and making mistakes. They are all integral parts of intelligence work.But, the message of those first two axioms remains one of the most essential ones to remember when you are encountering doubt and second-guessing your judgment: you are probably the only one who has taken extensive amounts of time combing through your data and monitoring a particular intelligence issue. That means that you have been exposed more than anyone else to your case's facts and have gone through the process of analyzing and understanding what they mean more than anyone else. As long as you have followed a reliable collection and analysis process you should not start cluttering your mind with “what ifs”. Believe in yourself, believe in your professional judgment, and move on.In conclusionIntelligence analysis is not easy, and we will constantly have to deal with uncertainties. Analysts may hit a mental wall or get overwhelmed with doubt and overthinking while trying to minimize those uncertainties or disseminate their analysis. It would help if you did not let the fear of being wrong paralyze you or hold you back from making a decision. If you have followed a solid collection and analysis process, placed the appropriate level of attention, and given your best professional self to the task, spending additional time on analysis might start becoming counter-productive. Therefore, after a certain point, it is time to trust that you will deliver an intelligence product built based on your best professional judgment and the insights you had at that point in time. Procrastinating and over-analyzing your intelligence will most likely not help your results, and it will most certainly not help your customer. Time is also of the essence. Give a final look at your research questions. Give your findings the last review, and look at the process you followed. And then deliver.ReferencesMandel, D. R. (2020). Assessment and Communication of Uncertainty in Intelligence to Support Decision Making: Final Report of Research Task Group SAS-114 (last accessed on 03 Jun 2022 from: https://www.sto.nato.int/publications/STO Technical Reports/STO-TR-SAS-114/$$TR-SAS-114-ALL.pdf)Watanabe, F. (1997). Fifteen Axioms for Intelligence Analysts: Central Intelligence Agency Washington Dc Center For The Study Of Intelligence (last accessed on 03 Jun 2022 from: https://www.cia.gov/static/d0626fb44a97e2d8734ef69c66a8fb7e/Fifteen-Axioms-for-Analysts.pdf)You might also be interested inSocial EngineeringFrequent social engineering vishing attack scenariosSocial EngineeringSocial engineering kill–chain: Predicting, minimizing & disrupting attack verticalsSocial EngineeringHigh value targets: Where should you focus your intelligence collection & analysis efforts?"
