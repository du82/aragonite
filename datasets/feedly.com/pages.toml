["https://feedly.com/cve/CVE-2025-1638"]
title = "CVE-2025-1638 - Exploits & Severity - Feedly"
description = "The Alloggio Membership plugin for WordPress is vulnerable to Authentication Bypass in all versions up to, and including, 1.0.2. This is due to the plugin not properly validating a user's identity through the alloggio_membership_init_rest_api_facebook_login and alloggio_membership_init_rest_api_google_login functions. This makes it possible for unauthenticated attackers to log in as any user, including administrators, without knowing a password.  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
full_description = "Authentication bypass vulnerability in the Alloggio Membership plugin for WordPress affecting all versions up to and including 1.0.2. The vulnerability stems from improper user identity validation in Facebook and Google login functions, which allows unauthenticated attackers to log in as any user, including administrators, without knowing their password. An attacker can completely compromise any WordPress site using the Alloggio Membership plugin by: - Logging in as any user, including site administrators - Gaining full access to the WordPress site - Potentially executing administrative actions - Accessing sensitive user data - Modifying site content or installing malicious plugins There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. Plugin developers should release a patch for versions prior to 1.0.2. Site administrators should: - Immediately update to the latest version of the plugin - If no patch is available, consider removing or disabling the plugin Immediate recommended actions: - Update Alloggio Membership plugin to the latest version - Temporarily disable Facebook and Google login features - Monitor site for any unauthorized access - Review and reset all user passwords - Check for any potential unauthorized changes to the site - Consider implementing additional authentication controls"
