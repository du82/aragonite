title = "Case study: Automating threat intelligence with Feedly | Feedly"
description = "Discover how gematik’s CTI team transformed threat intel workflows, automating OSINT tasks and enhancing daily briefings with Feedly."
full_description = '''Threat Intelligencegematik reimagines OSINT: Drastically reducing manual work with Feedly Threat IntelligenceThe German digital healthcare agency's CTI team drastically reduced time for manual tasks, and transformed their daily briefings in the process.Annie Bacheron Jan 16, 2025Before, we had to find, read, and type everything manually. Now, we are just two clicks away from adding an article to our daily meeting wiki page.”Daniel Schmidt, Cyber Security Analyst, gematikKey resultsIngestion time for threat intel reports dropped from 5-10 minutes to 2 secondsAchieved 70% time savings in gathering global threat intelligenceIncreased coverage with collaboration with a single pane of glassThe short versionThe challenge: The gematik Cyber Defense Center relied on a manual process for threat monitoring and intelligence gathering after frustrations with gaps in a paid intel feed.The process: By implementing Feedly Threat Intelligence, the team automated nearly every step of their intelligence collection and dissemination.The impact: The time to summarize, translate, and ingest a threat intel report dropped from 5-10 minutes to just 2 seconds, and the team spent 70% less time gathering global threat intelligence, freeing them to focus on strategic initiatives instead of manual OSINT tasks.The customergematik is the German government agency responsible for digitizing healthcare products to make them more accessible to everyone across the country. The Cyber Defense Center focuses on monitoring threats, preventing attacks, and ensuring the security of products built by gematik’s standards. The team also acts like a Computer Emergency Response Team for companies that host tools built to gematik’s specifications.The challengeTedious, manual processes and risk of critical gaps in coverageInitially, the Cyber Defense Center relied on a paid intelligence newsletter to receive daily updates on relevant threat actors and emerging trends in the cybersecurity landscape. However, the lack of transparency around the data sources raised concerns about the reliability and potential intelligence gaps.Frustrated by the lack of comprehensive coverage, the team decided to abandon the feed and rely solely on manual collection and analysis of open-source intelligence (OSINT).“We had a portfolio of websites that we trusted. We would go through them, piece by piece, each website, and just look through them. It was incredibly time-intensive.”Daniel Schmidt, Cyber Security Analyst, gematikOn high-activity days, it could take up to an hour to sift through articles, translate them into German, summarize key findings, and upload everything to the team’s internal wiki page in preparation for the daily threat briefing. The time-consuming process of manually gathering and curating OSINT meant that strategic projects were constantly delayed. Daniel remembers, “Every day, I’d lose at least an hour just going through articles.” It became clear they needed a more efficient solution.“Every minute I spent on daily monitoring was a minute I wasn’t coding or advancing strategic initiatives, pushing my project further behind”Daniel Schmidt, Cyber Security Analyst, gematikThe team began searching for a tool with a customizable API that could integrate seamlessly into their existing workflows. The head of the Cyber Defense Center had prior experience with Feedly, so they tried it and were immediately impressed with the Threat Landscape Dashboard.The Threat Landscape Dashboard, where analysts get a bird's-eye view of trending stories, vulnerabilities, malware, and TTPs to monitor. The intelligence process nowWith Feedly Threat Intelligence, "now our workflow is super simple"Before using Feedly Threat Intelligence, the workflow to prepare the daily 11:30am briefing was painfully tedious. Team members had to read each article, summarize it, translate it into German, and transfer it manually to the team’s internal wiki page. Daniel estimates that “Even if you're fast, it took 5-10 minutes per article.”Now, the workflow is drastically streamlined — the team estimates a 70% time savings. “You find an article, add it to the daily Board, and at 11:30am, every article on the Board is automatically loaded into the wiki page for the briefing. It's just two clicks: find the article, add it to the board, and that’s it. By 11:30am, it’s ready to present to the team.”Team Boards are virtual storage spaces to save articles found across Feedly. Saving articles to Boards can also trigger powerful automations via integrations or the API, like the ones the gematik team has built.“The workflow we developed with the Feedly Boards and custom scripts (for world trending articles) not only saved about 70% of our time but also made the selection and collection of articles more enjoyable and user-friendly.”Daniel Schmidt, Cyber Security Analyst, gematikThe gematik Cyber Defense Center's workflow for gathering threat intelligence, preparing for the daily threat briefing, and sharing curated intelligence across with relevant audiences.Two automated threat intel reports: daily and weeklyEvery day after the daily threat briefing, an automated intel digest is sent out at 1pm to all security department members, including those who couldn't attend the meeting. Additionally, the team distributes a weekly threat intelligence report to management and other departments, providing high-level cybersecurity updates for those outside the core security department but still invested in staying informed.Using the API to automate the entire workflowWhen they first signed up for Feedly, the team moved articles through their workflow manually. But using the Feedly API, the team was able to quickly build automations so that the only manual part of the process is curating articles for the daily board.Here’s a breakdown of the full workflow:Queries from AI Feeds in Feedly collect relevant articles on the threat landscape.Save them to a “daily” Board in Feedly.Articles are automatically transferred to an internal wiki page for daily briefing.An intel digest gets sent out at 1pm every day to every single colleague in the security department, even those who aren’t present at the daily meeting (using Automated Newsletters).Everything from the team’s “daily” board gets automatically copied into the “weekly” board, which automatically sends as a newsletter to management and other non-security colleagues each week.Following the daily briefing, articles are automatically archived.An example of one of gematik's daily threat intel briefing newsletters, sent automatically at 1:00pm each day using the Automated Newsletters in Feedly.The workflow is so simple that anyone on the team can manage it. “It’s a relief knowing that if someone is out or unavailable, anyone can step in,” Daniel said. In fact, when Daniel was away for a week, Willy Mroczowski, a new team member with little previous experience using Feedly, successfully ran the daily briefings without any issues. Because of the established workflow with Feedly, Willy says stepping in for Daniel “didn’t even cut into my time significantly. If I had to manually gather and analyze intelligence, I can easily say that we would have had a much less pleasant incident response process.”The impact70% time savings, increased coverage, and ability to prioritize strategic projectsSince implementing Feedly Threat Intelligence in their workflow, the gematik Cyber Defense Center has dramatically improved the efficiency and effectiveness of intelligence gathering. The team used to require 5-10 minutes to add an article to their daily wiki — now it takes two seconds.Overall, they've achieved a 70% time savings in their workflow for monitoring the global threat landscape.These efficiencies freed the team to focus on higher-impact projects and initiatives while ensuring comprehensive threat coverage for the broader organization.Automate your OSINT processCollect relevant intel, extract actionable insights, and automate dissemination with Feedly Threat Intelligence.Start Free TrialYou might also be interested inThreat IntelligenceMars conducts threat hunts at scale using Feedly Threat IntelligenceThreat IntelligenceVulnerability Dashboard: Real-time CVE intelligence tailored to your stack and risk criteriaThreat IntelligenceGISA saved 20 hours each day by automating vulnerability monitoring with Feedly Threat Intelligence'''
