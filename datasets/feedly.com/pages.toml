["https://feedly.com/ti-essentials/posts/deep-dive-on-feedly-s-pir-blueprint-and-how-to-operationalize-it"]
title = "Deep dive on Feedly’s PIR blueprint and how to operationalize it  | TI Essentials | Feedly"
description = "A closer look at each section of the Feedly PIR Blueprint and how to use this free resource."
full_description = "PIRsDeep dive on Feedly’s PIR blueprint and how to operationalize it A closer look at each section of the Feedly PIR Blueprint and how to use this free resource Josh Darby MacLellanon Dec 12, 2023In our first blog in this series, I introduced Priority Intelligence Requirements (PIRs) and how to collect them from your stakeholders. In this blog, I aim to give all the information you need to get the most out of Feedly’s free PIR Blueprint. Feedly’s PIR Blueprint is a resource designed to make documenting and addressing your Priority Intelligence Requirements easier.We will cover the following:Who the PIR Blueprint is forA deep dive into each section of the PIR BlueprintHow to operationalize the resource effectivelyWhere Feedly can help with the processFree Downloadable ResourcesFree PIR BlueprintDownload the PIR Blueprint as an Excel file that you can modify to fit your organization.Free DownloadFree Stakeholder Interview Scheduling Email templateDownload the example email as a word doc.Free DownloadWho is the PIR Blueprint for?Although the PIR Blueprint is primarily designed for Threat Intelligence teams who document PIRs and use Feedly to collect open-source intelligence, it’s a free blueprint available to everyone!The Blueprint can also be used by teams focused on intelligence related to geopolitics, physical security, travel security, protective intelligence, etc., from all industries in the public, private, charitable/humanitarian, and other sectors.The Blueprint is best suited for teams early in their PIR setting process. Ideally, you have identified your intelligence stakeholders and conducted stakeholder interviews.* Once you have the raw interview data, you can use the PIR Blueprint to formally document your PIRs. If you are at the start of the PIR process, you can still use the PIR Blueprint for inspiration and guidance on how to document PIRs.💡 If you have not yet done stakeholder interviews, we have a free guide and have free coaching for Feedly clients from Threat Intelligence professionals with experience going through the PIR process - just contact your Feedly Customer Success Manager.What the Feedly PIR Blueprint containsAs you can see from the screenshot, the Blueprint is a spreadsheet with sections for Requirements, Priority, Sharing actionable insights, and Feedly AI. We’ll explain each part in turn.RequirementsThis section contains six Intelligence Requirement (IR) categories (e.g., General Threat Landscape) and 24 example PIRs, 2-6 under each IR category.The example PIRs are phrased as questions (a best practice) as providing intelligence to answer these questions will ensure you deliver to your stakeholders the intelligence they most need.These are intended as examples to delete and populate with the questions you create using content from your stakeholder interviews.PriorityIn the Priority column, you can enter the priority of the question your stakeholders need answered. This can be assessed in collaboration with your stakeholders and based on the severity or potential impact of the topic.We used a simple “low, medium, high” priority ranking in the Blueprint, but you can get more granular with a 1-10 scale.The priority will guide which PIRs take precedence over others, the volume of the collection, and the sharing method (e.g., urgent via an instant Slack message versus non-urgent via a weekly Feedly Newsletter).Sharing actionable insightsThis is where you’ll record your stakeholders’ preferences on how they want intelligence shared with them. Working with your stakeholders’ communication preferences will help cement a positive relationship.You can also track which security tools, communication tools, or Feedly features to use when sharing intelligence on each PIR.We’ve listed example sharing/Feedly export options, which you can keep or delete as needed. If you are a Feedly client and want more information on export options specific to Feedly, just ask your Customer Success Manager.Feedly AIWe give a list of example AI Models to use when creating AI Feeds inside the Feedly platform to collect intelligence for each PIR. This demonstrates configuring your AI Feed query to filter for highly relevant results.You can delete this section as you populate the rest of your spreadsheet with your PIRs. We recommend configuring your AI Feeds and selecting AI Model inside the Feedly platform, as you’ll see the full scope of models there.How to operationalize the BlueprintTo operationalize the PIR Blueprint, we recommend these steps:1. Download the PIR Blueprint template.2. Remove irrelevant content from the template.3. Optional: Add additional columns with data points you find relevant. E.g., if you’re documenting PIRs from multiple stakeholders, you could add a column that identifies which PIR belongs to which team.4. Add your PIRs from your stakeholder interviews under suitable Intelligence Requirement categories.5. Document your stakeholder intelligence-sharing preferences.6. Translate the PIRs into AI Feeds in your platform. The next article in our PIR blog series will provide insights to help with this step.7. If you need help enhancing your PIR AI Feeds, collaborate with your Feedly Customer Success Manager, who can provide support and guidance based on best practices.Concluding remarksCollecting, documenting, and configuring PIRs in Feedly is tremendously valuable for streamlining your intelligence collection based directly on your stakeholders’ needs (among other benefits!). If you hit a roadblock along the way, don’t hesitate to contact Feedly for support.You might also be interested inPIRsHow to conduct stakeholder interviews to set Priority Intelligence Requirements (PIRs)PIRsHow to use Priority Intelligence Requirements (PIRs) with FeedlyPIRsTranslate your PIRs into AI Feeds"
author = "Josh DarMacLellan"
year_published = 2023
year_updated = 2023
