["https://feedly.com/ti-essentials/posts/how-to-objectively-compare-sources-for-threat-intelligence-reports"]
title = "How to Objectively Compare Sources for Threat Intelligence Reports | TI Essentials | Feedly"
description = "Each of your reports should be labeled indicating how much you trust the information that you are providing. Here's a method for rating those sources."
full_description = 'Best PracticesHow to Objectively Compare Sources for Threat Intelligence ReportsValentina Costa-Gazconon Mar 11, 2022The following is a guest post from author and Threat Operations Manager Valentina Costa-Gazcon. For more content from Valentina, check out her book, "Practical Threat Intelligence and Data-Driven Threat Hunting".If you work as a cyber threat intelligence analyst you probably already know how important it is to have access to high quality information for your analysis. If you are following proper procedure, each of your reports should be labeled indicating how much you trust the information that you are providing. This is what we usually call the “confidence level”.Most commonly, the confidence level is divided in three categories: high, medium and low. At the beginning of my journey in the threat intelligence realm, we had too much information to process and analyze to even think about approaching confidence level grading outside of leaving the choice to the analyst. We trusted that our analysts were going to be able to use their good judgment to classify the information as highly accurate and reliable, somewhat accurate and reliable or not trustworthy at all. Not a lot of time went by before we realized that this approach was leading to having every report classified with a confidence level “medium”.“Now what?,” we thought. We were dangerously approaching the mediocrity line and we were out looking for excellence. This was something that we couldn’t not tolerate.Finally the team came together to an agreement and we designed a process to rate our sources. This formula was going to help us provide a more accurate measurement for the confidence level, without impeding the analyst to apply their own criteria and overrule it if necessary. This last point is very important: every analyst should be capable of increasing or decreasing the confidence level based on their own knowledge and past experience. Ideally, they should convey in their report the justification for that overruling, but you should make sure that they know that you value their judgment and you expect them to do so if they see it fit.So, what were the things we agreed to take into account when analyzing our sources? We pivot our grading of the sources around five axes: type of source, region visibility, analyst reputation, technical analysis and availability of IOCs (Indicators of Compromise). Based on the established grades we would give the source a final punctuation. Cyber threat intelligence reports are usually crafted using more than one source. We would follow the same steps to grade each of the sources that we were referencing. Finally, we would sum up our grading and divide it among the number of sources we were working with. The resulting number would fall under a predefined threshold that would serve as a confidence level reference.Sounds pretty straightforward, right? In reality, it’s a little bit trickier than what you might think. Let’s deep dive into the different axes to understand why.Type of SourceMake a list with the different types of sources that you would deem acceptable to use. For example:vendor reportsnewspapersresearcher publicationsgovernment indictmentcourt ruling, etc.Grade each type of source giving it a value from 0 to 1 according to the type of sources that you prefer to use. Use this value as a multiplier for the overall source value that you will calculate with the other axes.Regional VisibilityFrom all the axes, this one was the trickiest one, since you need to be quite familiar with the vendor’s reports before being able to leverage it. We would use this value only when analyzing vendor reports. It is well known that different cybersecurity vendors have more or less insight into the different regions of the world based on their infrastructure or commercial interest.Design a matrix that will allow you to classify vendors depending on their visibility over the different regions. Define how you are going to grade a report from a vendor depending on which region of the world they are reporting. Let me clarify, a vendor might have good visibility around Middle Eastern threat actors, but from time to time they do report about Asian threat actors. You do not need to disregard those less frequent reports, you can use them as a valid source either way, but you should take into account that apparent lack of visibility on the region when analyzing how confident you are in their reporting.Analyst ReputationSome analysts and researchers work independently. They craft reports about malware samples or campaigns that are made available to the community through github repos, their personal blogs, twitter threads, etc. Make a list with the researchers whose work you like. If the report you are analyzing belongs to any of them, add a point to overall grading. This grade should only add, not subtract.Technical Analysis and Availability of IOCsThese two are pretty straight forward. Does the report have a detailed technical analysis of the campaign/malware sample that you can double check? Does the report have IOCs that you can look up to contrast the provided information? If so, increase the value of your overall grade for the source being analyzed.Putting it all togetherNow, let’s imagine we are working with two sources about the same Chinese APT. Source 1 is a technology magazine in the United States and the journalist that wrote the report is well known in your industry. The article is richly populated with code samples and a good list of IOCs. Source 2 is a deep dive into the APT from a very well-known vendor, with good visibility in Asia (Vendor 3), but the article is light on IOCs.Source 1: Total confidence score 1.8Technology magazine - 0.6Well-known journalist - 1Technical analysis - 1IOCs - 1Source 2: Total confidence score 0.8Vendor with visibility in Asia - 0.8To get the total score of your sources, just add all your total values and divide among the total number of sources you are working with. For the sake of this example, the total score for these two sources would be 1.3. You should prepare a table with the ranges stating your thresholds, similar to the one that follows. Across this article, I’ve used numbers from 0 to 1, but you can use any other ranges you feel comfortable with.And that is it! If you follow this guideline, you should be able to better granulate your confidence level for your cyber threat intelligence reports. Reaching this level of detail in your process will take effort and time, but it will increase your own trust on the information that you are delivering to your stakeholders. Having data to backup and justify the confidence in your assessments will not only serve to increase the quality of them, but also the assuredness of your delivery.Special thanks to Valentina Costa-Gazcon for this contribution to Ahead. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com'
author = "Valentina Costa-Gazcon"
year_published = 2022
year_updated = 2022
