description = "Track the latest security advisories and their associated vulnerabilities, exploits, patches, CVSS and EPSS scores, threat actors, and MITRE ATT&CK TTP information"
full_description = "Authentication bypass by spoofing in Azure AI Face Service allows an authorized attacker to elevate privileges over a network. A critical authentication bypass vulnerability in Azure AI Face Service enables authorized users to conduct network-based spoofing attacks, allowing privilege escalation with minimal attack complexity and no user interaction required. The flaw could lead to unauthorized access across cloud resources, potentially compromising sensitive data and disrupting services across connected systems. This vulnerability has been fully mitigated by Microsoft in their cloud infrastructure, requiring no action from service users. A critical remote code execution vulnerability in the Windows Reliable Multicast Transport Driver allows unauthenticated attackers to execute arbitrary code by sending specially crafted packets to PGM receivers without user interaction. The flaw specifically affects systems with programs actively listening on Pragmatic General Multicast (PGM) ports and can lead to complete system compromise with high impact on confidentiality, integrity, and availability. Given the vulnerability requires no privileges and has low attack complexity, systems utilizing multicast protocols are at significant risk of unauthorized access and data compromise if left unpatched. A critical remote code execution vulnerability in Windows' OLE component allows attackers to execute arbitrary code through specially crafted emails, requiring no user interaction when messages are previewed in Microsoft Outlook. The flaw enables complete system compromise with high impacts on confidentiality, integrity, and availability, particularly dangerous in enterprise environments where Outlook's preview functionality can facilitate rapid lateral movement across networked systems. The existence of public proof-of-concept code combined with the vulnerability's network-based attack vector and ability to bypass user interaction requirements makes immediate remediation critical for all affected Windows systems."
