["https://feedly.com/customers/posts/automating-threat-hunting"]
title = "Automated Threat Hunting Solution with SOAR and Feedly AI | Feedly"
description = "Details on how one DevOps team built a SOAR connector to automatically and reliably feed OSINT IoCs into their SOAR platform."
full_description = '''Threat IntelligenceHow Secure Cyber Defense automates threat hunting with Feedly AI This DevOps team built a SOAR connector to ingest IoCs from Feedly AI. Then they created an automated threat hunting process with no human intervention needed.Annie Bacheron Jun 28, 2023THE CUSTOMERSecure Cyber Defense, Ohio, USASecure Cyber Defense is a managed security service provider (MSSP) located in Ohio, USA. They provide expert cybersecurity consulting and managed threat detection and response services to manufacturing companies, financial institutions, local governments, government contractors, K-12 schools, and universities. They believe in combining the best technology with top cybersecurity expertise to protect their clients, so their DevOps team is constantly innovating and trying new ways to support their SOC teammates.THE SUMMARYThe impact of the team's Feedly + SOAR automation Secure Cyber Defense now gets critical IoCs to analysts four days faster than manual processes.Doing the 24/7 coverage that their Feedly + SOAR system now handles would take at least six full-time employees.Zero human intervention is required in this automated threat hunting system until the analyst sees a threat.Reduced analyst’s incident research time from hours to minutes.You’d have to hire six full-time employees working full time to have the same 24/7 coverage of threat research that our automated process with Feedly currently handles."Edward Crispen, Lead DevOps EngineerWho we talked toShawn Waldman, CEO & FounderMyles Lister, Junior DevOps EngineerJoe Tinney, Director of Cyber OperationsEdward Crispen, Lead DevOps EngineerHow Secure Cyber Defense ingests Feedly AI into their SOAR platform to automate cyber threat huntingSecurity, orchestration, automation, and response (SOAR) technology unifies and integrates cybersecurity services and tools to automate cyberattack prevention and response.The DevOps team built a SOAR connector to ingest IoCs that Feedly AI parses out.Every hour, the SOAR connector pulls IoCs from these streams using the Feedly API. Context includes the article link, and, if available, malware, threat actor, CVE, product, and TTP information.Every day at midnight, the cyber threat hunting platform performs conditional checks and if an IoC triggers an alert, the platform sends relevant IoCs to analysts.Every weekday at 8 am, analysts show up to work with all the context they need to do an investigation based on those IoC hits, without spending hours on research and information collection.“We’re so impressed by the speed at which information can come to us now. Instead of us having to come to the information, Feedly AI puts in all the hard work of extracting IoCs. Yes, Feedly replaced a bunch of time. But that’s almost secondary once you see the volume that it can handle, that’s been tremendous.”Joe Tinney, Director of Cyber OperationsCreate your own automation and see what’s possible with the Feedly API. Start a free trial of Feedly for Threat Intelligence, or keep reading to learn how Secure Cyber Defense is automating the threat hunting process.START FREE TRIALTHE CHALLENGEManually collecting and analyzing threat intelligence consumes lots of analyst capacityThe security team at Secure Cyber Defense used to source intelligence about potential threats manually, collecting articles from CISA and other OSINT sources. Shawn Waldman, CEO, would collect alerts from his professional network, and alerts from information sharing and analysis centers (ISACS).Edward Crispen, Lead DevOps Engineer, says, “we were pulling solely from external sources manually, one by one, and parsing out the indicators that we could find manually. We ended up pulling out a bunch of indicators that we didn't necessarily want in there.”Even IoCs they found manually lacked useful contextEven though the security professionals spent hours gathering intelligence, the indicators of compromise (IoCs) often lacked context. Joe Tinney, Director of Cyber Operations, remembers, “Before, we would get alerts like ‘this IP address is bad.’ Well, that's cool. Whenever you see that IP address on your network, you know it's bad. You don't know why it's bad or how it's bad. What behavior should I be concerned about? Is it web traffic? Is it bad because it's a malicious email server?”This meant the responsibility fell on analysts to collect additional context before they could take action on an incident, which could take days. Edward adds, “Analysts would search in various platforms manually. There's a lot of information and it takes a really long time to search for them. And searching for them one by one is very daunting. It takes a long time. Once they see it, they have to find out the context around it. And then they have to correlate the IoC back to the article that they were looking from.”“Before, we would get alerts like ‘this IP address is bad.’ Well, that's cool. Whenever you see that IP address on your network, you know it's bad. You don't know why it's bad, or how it's bad. What behavior should I be concerned about? Is it web traffic? Is it bad because it's a malicious email server?”Joe Tinney, Director of Cyber OperationsBeyond spending time searching for context on an IoC, analysts had to spend more time packaging the information necessary to trigger a playbook into the security orchestration, automation and response (SOAR) platform.SOAR technology unifies and integrates cybersecurity services and tools to automate cyberattack prevention and response. Commonly used SOAR platforms include Cortex XSOAR, Fortinet's FortiSOAR, and Splunk SOAR.Secure Cyber Defense has numerous tools that the analysts in their security operations center (SOC) use to analyze and triage cyber threats and attacks. But without SOAR, analysts would have to jump from tool to tool and follow different processes. Their SOAR platform automates processes using playbooks, which are collections of workflows triggered by certain rules or incidents.The team wanted to automate the process of identifying threats, but they were missing a key puzzle pieceThe team knew there had to be a way to further automate the collection of IoCs and ingest them into the SOAR platform. Being able to provide rich context around threats faster would better equip analysts to investigate threats and keep the company’s customers secure.Threats appear at any time, but human threat hunters are only scouring the web for cyber threat intelligence during work hours. Shawn says, “I'm not awake 24/7, 365. So there would be information that I would miss or threats that I would not work on.”The Secure Cyber Defense team needed a way to get incident information to analysts faster. Edward adds, “The sooner we know about a threat, the faster we can answer it and deal with it. You don't want attackers to have a long time. It doesn't take them very long to do things in an environment. So the sooner you can get to a threat, the better.”Shawn had sketched out an outline of his automation vision years earlier and brought it to the DevOps team multiple times, but they kept telling him it wasn’t possible because they were missing the first step in the process of proactive threat hunting — something that would collect and analyze OSINT to identify IoCs. They would have had to hand-code a solution to source IoCs, and they decided that would be too great a time investment.“The sooner we know about a threat, the faster we can answer it and deal with it. You don't want attackers to have a long time.”Edward Crispen, Lead DevOps EngineerTHE PROCESSBuilding the infrastructure to automate cyber threat hunting: Ingest IoCs from Feedly to the SOAR platformWhen the team found Feedly, Shawn’s vision of automation became a possibility — it was the missing puzzle piece that analyzed OSINT to kick off the rest of the threat hunting process.A sketch of the Secure Cyber Defense team's process for threat hunting automation.SOAR platforms provide pre-built connectors, which integrate tools to bring in data or activate playbooks. DevOps teams can also build connectors from scratch to integrate tools like Feedly, which is what Myles Lister, Junior DevOps Engineer, was tasked with.Using the Feedly API, Myles built a connector to integrate Feedly with the SOAR platform. Initially, the team just planned to use Feedly to pull in OSINT. But once Myles started testing endpoints, “I was blown away. I discovered Feedly’s AI mechanism and how well it pulled IoCs out,” he explains.The ability of Feedly AI to get targeted information about potential cybersecurity threats and attacks related to a customer’s environment meant that they could bring in targeted OSINT based on customer needs. Feedly AI uses 1000+ pre-trained AI models to collect and synthesize OSINT. Myles discovered that “the AI automatically parses and pulls those IoCs out without us actually having to comb through the content.” Plus, Feedly AI includes the article link, and, if available, information about the malware, threat actor, CVE, product, and TTP.Feedly AI models parse out IoCs and relevant context. Let’s walk through the team's current workflow, from the moment an article about an emerging threat comes into Feedly to the moment when it appears to a security analyst, ready to be worked on.First, the SOAR platform ingests IoCs from FeedlyThe team first created three main AI Feeds within Feedly, which continually scour the open web for relevant information and use AI models to collect intelligence based on specific requirements. The three AI Feeds were:Industries: Articles that mention IoCs impacting specific industriesClients: Articles that mention threats that impact their current customersGeneral IoCs: All IoCs flagged by Feedly AI in the Cybersecurity BundleAn AI Feed in Feedly built to track IoCs related to specific industries. Myles configured the connector to pull content from Feedly each hour. Feedly AI recognizes and aggregates IoCs, so IoCs referenced in these articles are passed as STIX to the SOAR platform.An example of a STIX export. IoCs referenced in articles can be exported as STIX, and include the article link, and if available, the malware, threat actor, CVE, product, and TTP information. In the SOAR platform, Myles organized the workflow to separate out IoCs from the original article. “Underneath each article in a separate data set is the IoC so they're all grouped together in one place. That makes it easier to parse out and correlate to each other once it was in SOAR.”Second, campaigns are created using IoCs ingested into the SOAR platformOnce IoCs have been ingested from Feedly into the SOAR platform, individual campaigns are created, which include the name of the article, the contents, and the threat intelligence information, including the IoCs from Feedly.An example of what a campaign looks like inside Secure Cyber Defense's SOAR platform. Every night at midnight, their threat hunting platforms run conditional checks. “The SOAR platform searches our threat hunting platforms, and if it picks up anything off one of those IoCs, it’ll alert the analyst when they come in.”When an analyst comes in at eight o’clock the next morning, they’ll find an alert with the IoC found in a customer’s environment, along with information about what was affected, and any other relevant context. In minutes, they’re able to do an investigation based on the hits they’ve gotten first thing in the morning, without needing to spend hours just to find that context.Feedly delivers relevant IoCs and consistently avoids false positives, which means the team can trust it to deliver the right content and context“The way our DevOps team has built this, it takes no human intervention — it really is an automated platform,” says Shawn.Why can Secure Cyber Defense trust Feedly to kick off this threat hunting process? It comes down to the ability of Feedly’s pre-trained AI models to accurately identify IoCs.Joe explains, “There's a lot of naive ways to scrape articles for IoCs. But you end up getting a lot of false positives – like if someone sends out kudos to the threat researcher and the article has a link, and all of a sudden that link is now marked as an IoC.”Feedly AI, on the other hand, rarely identifies false positives, which allows the team to trust this system to run automatically. Joe adds, “We've had some false positives come through, but they're really rare.”Now, Joe is confident that “We’re able to trust it enough that the system threat hunts automatically for us overnight. The analysts come into this list of potential activity. This activity is not yet known to be bad or blocked, in many cases, by all the other tools that we're using. This is usually fresh stuff that Feedly has picked up from the open web.”“The way our DevOps team has built this, it takes no human intervention — it really is an automated platform”Shawn Waldman, CEO & FounderTHE IMPACTSecurity analysts used to spend hours researching an incident. Now they spend minutes.Analysts say that compared to a year ago, threat hunting is like night and day. They used to spend hours looking into an incident. Now, they spend mere minutes. Instead of manually searching for information about incidents one by one, Edward says, “The whole process — from seeing something, to finding the context, to packaging it up into an incident in our SOAR platform— it’s already done by the time they get in to work, and they're looking at it. So they don't even have to look at this point.”Joe adds, “That's been a huge value, just to put incidents in front of the analyst's eyes, without them having to go do a bunch of legwork to read this article and then decide whether or not to hunt for it.”The company’s analysts used to have scheduled manual threat hunting time set aside to search for context and compile incident data. Now, Edward explains, “Analysts don’t even have to schedule threat hunting time now because it’s already done by this system.”The team has built a system that compiles the context from Feedly and bakes it into SOAR. This means that instead of spending hours doing burdensome administrative tasks, analysts are able to start real work when they show up in the morning. The Feedly + SOAR automation frees them up to do work that can’t be automated, like investigative tasks that require more thinking power and coordination with people who manage different parts of the IT systems.Analysts get a heads up about incidents four days earlier than beforeShawn immediately thinks back to the 3CX incident, which happened only a few months before this automated system was implemented. “If we would have had this platform in play when 3CX went out, we would have saved four days. That’s a four-day heads up,” he estimates.One potential benefit of having the workflow so streamlined and automated is that when information about an incident first gets published, the threat hunter might not even know their activities have been detected. Fast detection means Secure Cyber D'''
