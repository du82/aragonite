["https://feedly.com/changelog"]
title = "Changelog | Feedly"
description = "Feedly Changelog - A blog about updates, improvements, and latest changes to Feedly"
full_description = "ChangelogUpdates and improvements to FeedlyRSS•Follow us on Twitter•Explore our docsFeb 19, 2025Latest updates and improvements Improvements and fixesFeb 05, 2025Smarter insights, faster decisions - Security update releases, Chinese multilingual AI, Auto-translationsThis sprint brings powerful new tools to help you track security threats, analyze global intelligence, and streamline your workflows. We’ve added Security Update Releases to the Vulnerability Dashboard, expanded multilingual AI coverage to Chinese, and introduced automatic translations for a more seamless research experience.Security Update Releases are now available in the Vulnerability DashboardThreat IntelligenceWe’ve added a new ‘Security Update Releases’ filter to the Vulnerability Dashboard, allowing you to quickly discover and assess CVEs from specific Microsoft Patch Tuesday releases. This helps streamline the monthly process of reviewing and prioritizing Microsoft security updates. Available for Feedly Threat Intelligence Advanced 2024.Chinese Multilingual AI - We now cover Chinese sources with our AI Models Market IntelligenceThreat IntelligenceIn addition to French, German, Italian and Spanish, you can now search for stories originally written in Chinese, with a single English search query, using one of our 30,000+ AI Models (companies, business events, threat actors, cyber attacks, etc). What’s really exciting about it is that Feedly AI deduplicates stories across languages, and automatically translate all articles to English, regardless of their original language.In short, Feedly’s multilingual AI expands your research to a global scale, all with a single click. Note that Multilingual is accessible only in the All Web tab in your search query builder.Available in Feedly Threat Intelligence Advanced 2024 and Market Intelligence Advanced 2024 offerings.Auto-translation to English from Chinese, French, German, Italian, SpanishMarket IntelligenceThreat IntelligenceAll surfaced articles are automatically translated into English. You can find articles that were originally written in Chinese, French, German, Italian or Spanish, translated to English by default. If your personal preference is to consume these articles in their original language, feel free to choose your right translation settings here: https://feedly.com/i/account/translation.Available in Feedly Threat Intelligence Advanced 2024 and Market Intelligence Advanced 2024 offerings.Improvements and fixesJan 22, 2025New in Feedly: Multilingual AI, PDF Insights, and Smarter CVE TimelinesWe're excited to introduce powerful updates to help you streamline your intelligence gathering! From breaking language barriers with Multilingual AI, to effortlessly extracting insights from PDF reports, and quickly spotting the latest CVE events with improved timeline sorting—these new features make it easier than ever to stay ahead. Plus, we've rolled out key improvements and fixes to enhance your experience across the platform.Let’s dive into what’s new!Collect and translate global insights across languages—all in one placeThreat IntelligenceWe’ve introduced new Multilingual capabilities to the Feedly Threat Intelligence Advanced 2024 offering. This means you can search for stories across dozens of languages with a single search query, using one of our 30,000+ AI Models (Threat Actors, Cyber Attacks, TTPs, Companies, etc) across languages. What’s really exciting about it is that Feedly AI deduplicates stories across languages, and automatically translate all articles to English, regardless of their original language.To summarize, Feedly’s multilingual AI expands your research to a global scale, all with a single click.Note that Multilingual is accessible only in the 'All Web' tab in your search query builder.Automatically extract key insights from PDF documentsThreat IntelligenceMarket IntelligenceNews ReaderNow you can process and analyze PDF reports in Feedly to uncover valuable insights and data points. Easily extract key metadata from publicly accessible PDFs, access visual content like graphs and tables, and ask questions about specific PDF content using AI Actions. You can also compare patterns and trends across multiple reports to uncover deeper insights.CVE timeline sorting to help users find the latest events quickerThreat IntelligenceThis change means no more scrolling to the bottom of long timelines to see what’s new! Timelines now default to showing newest events first plus, we’ve also added a toggle to switch between newest/oldest first sorting.Improvements and fixesJan 08, 2025Collect global insights, simplify search, and identify invalid emailsFirst updates of 2025! The updates introduce multilingual capabilities to expand your research across languages, a more intuitive search experience with enhanced filters, tools to flag invalid email addresses in newsletters, and new AI Models to deepen your insights into industries, companies, and threats.Collect and translate global insights across languages—all in one placeMarket IntelligenceWe have introduced new Multilingual capabilities to the Feedly Market Intelligence Advanced 2024 offering. This means you can search for stories across dozens of languages with a single search query, using one of our 30,000+ AI Models (companies, trends, technologies, strategic moves, etc) across languages. What’s really exciting about it is that Feedly AI deduplicates stories across languages, and automatically translate all articles to English, regardless of their original language. To summarize, Feedly’s multilingual AI expands your research to a global scale, all with a single click.Note that Multilingual is accessible only in the All Web tab in your search query builder.Streamline your queries with easy-to-use search filtersMarket IntelligenceThreat IntelligenceNews ReaderWe are excited to introduce a new and simpler experience for selecting your sources in your search queries in Feedly! Here are the changes we have made:In Custom mode, the source types are displayed with a new look, description and source examples. In both Custom and All Web modes, you can choose to only search through top notch sources by checking the Top sources only box.Identify invalid emails instantly in Automated NewslettersMarket IntelligenceThreat IntelligenceInvalid email addresses are now individually flagged when adding recipients in bulk. Each batch of emails provide specific feedback on the ones that are invalid, allowing you to quickly make corrections without disrupting the rest of the batch.Improvements and fixesNov 20, 2024New: Emerging Trends Dashboard, Use Cases and Consumer Metrics tabsWe’re excited to unveil new features to help you lead the charge: the Emerging Trends Dashboard, plus Use Cases and Consumer Metrics tabs, make it faster than ever to uncover trends, insights, and opportunities.Check out the updates below to see what’s new!Find the next big thing with Emerging Trends DashboardMarket IntelligenceDiscovering emerging trends takes days of manual work, and it is hard to separate fads from true trends. MI teams also need to turn trend research into actionable insights for their organizations.The new Feedly Emerging Trends Dashboard lets MI teams quickly discover, measure, analyze, and share key trends in their market surfaced from millions of sources, without days of work.Click here to learn moreDiscover technology use cases in your industryMarket IntelligenceIt can be hard to know what are the most promising business applications of emerging technologies on an industry or niche market. You can now find out about these business opportunities by visiting the new Use Cases tab in all of your AI Feeds.Uncover consumer metrics for your reportsMarket IntelligenceFinding reliable metrics about new consumer behaviors or demand trends on your market can be tedious. Now you can easily access these stats about your industry and research topics by clicking on the Consumer Metrics tab in your AI Feeds.Improvements and fixesNov 06, 2024Latest improvements and fixesWe’re excited to share our latest improvements and fixes designed to enhance your Feedly experience! Here’s a rundown of what’s new and improved.Improvements and fixesOct 23, 2024Automated Newsletters update & new Company Activity tabNow you can customize automated newsletters even further with the new text customization tools. We have also added a Company Activity tab in the AI Feeds for Market Intelligence accounts, making it easier to compare the activity of companies across different industries.Customize Text in Automated NewslettersThreat IntelligenceMarket IntelligenceWe are excited to announce Feedly's new text customization tools in Automated Newsletters! Now you can customize font styles, text sizing, color-code, align, highlight text, add headers, quotes, bullet points and much more! Create professional, eye-catching newsletters that truly represent your brand and communication needs.Compare competitor activityMarket IntelligenceNow you can compare the activity of top companies in your industries or topics of interest with the new Company Activity tab in the AI Feeds of Feedly for Market Intelligence accounts. You can also browse the top or latest strategic moves to not miss out on anything critical.Improvements and fixesSep 25, 2024Collect real-time CVE intelligence tailored to your stack and risk criteria with the Vulnerability DashboardVulnerability DashboardThreat IntelligenceThe new Vulnerability Dashboard delivers real-time intel from thousands of trusted OSINT sources on all the CVEs impacting your tech stack. It gives you the context to effectively analyze vulnerabilities and quickly prioritize remediations.Try it out by contacting your dedicated threat intel advisor or sales representative.Improvements and fixesSep 11, 2024Extract IoCs from external links and sign up to Feedly Threat Intelligence on mobileFeedly has introduced new features and improvements aimed at enhancing threat intelligence workflows. These updates include automated IoC extraction, mobile sign-ups, and several performance fixes and enhancements.Recap:IoC Extraction: Feedly AI now extracts IoCs from external links in GitHub, TrendMicro, and CERT-FR files, offering easier access to threat data.Mobile Sign-Ups: Users can now sign up for Feedly Threat Intelligence directly from mobile devices for seamless onboarding.Improvements: Enhanced AI models, easier meeting bookings, better article metadata, and various bug fixes like improved Dropbox backups and Feedly Blog search results.Extract IoCs from external links to GitHub, TrendMicro, or CERT-FR filesThreat IntelligenceThe number of IoCs in the file is presented as an AI Insight at the top of the article and can be manually extracted directly from Feedly via the export button or the Feedly API.Sign up to Feedly Threat Intelligence on mobileThreat IntelligenceUsers who browse on mobile and show interest to Feedly Threat Intelligence can now create their account on mobile to be ready to start their trial right away on desktop.Improvements and fixesAug 28, 2024New PDF export on Automated NewslettersShare your newsletters with PDF exportMarket IntelligenceThreat IntelligenceWe’re excited to announce a new feature that allows you to easily share your sent newsletters using PDF export. With this update, you can easily create, share, archive and distribute a PDF version of any issue you've sent.To use this feature:Option 1: Click on the three dots located at the right of your sent issue and select Export PDF.Option 2: Open your sent issue and click the Export PDF button at the top right of the page.Improvements and fixesAug 14, 2024Automated Newsletters update & new AI ModelNew update to support your Automated Newsletter creation process. Threat Intelligence and Market Intelligence customers can now seamlessly integrate AI Feeds directly into newsletters. We have also introduced a new AI Model for our Feedly Market Intelligence customers that will help monitor organizational initiatives, making it easier to track competitors' acceleration programs. Additionally, we’ve enhanced AI Models for industry-specific intelligence, UI improvements, and bug fixes.Incorporate AI Feeds into Automated NewslettersMarket Intelligence Threat IntelligenceWe're beyond excited to introduce an improvement to your newsletter creation process. Feedly Threat Intelligence and Market Intelligence customers can now directly incorporate AI Feeds into newsletters without the need to create separate folders, streamlining the newsletter production workflow. Head over to your template editor and give the new AI Feed integration a try!Track organizational initiatives with our new AI ModelMarket IntelligenceThreat IntelligenceIs keeping up with your competitors’ organizational initiatives hard? You can now easily find and monitor the initiatives or programs set forth by a company indicating your competitors’ direction, future moves, or values from acceleration programs to donation initiatives. Learn more about what’s included on this page: https://feedly.com/ai/models/strategic-initiative.Improvements and fixesJul 31, 2024Two-factor authentication available on your accountsThis week's update includes the ability to enable two-factor authentication on your accounts, as well as various bug fixes and enhancements to existing features. Learn more below!Two-Factor AuthenticationThreat IntelligenceMarket IntelligenceTwo-factor authentication is now available for Feedly Threat and Market Intelligence accounts. Once enabled, users must enter their Feedly email and password and a TOTP (Time-based one-time password) authenticator to access their accounts. The feature is currently only available for Feedly login types and can be accessed from the “Logins” page in settings. We’ll roll out two-factor authentication to free, Pro, and Pro+ accounts shortly.Here’s a handy guide to help you set up two-factor authentication.Improvements and fixesJul 17, 2024Double opt-in processes for Automated Newsletter emails & Anomali ThreatStream integrationThis release includes a new double opt in process to ensure GDPR compliance in Feedly Automated Newsletters and various bug fixes and enhancements across our integrations and features. Read on to learn more about these updates.Anomali ThreatStream integrationThreat IntelligenceThe Feedly integration with Anomali ThreatStream provides a simple way to ingest articles and threat intelligence reports discovered in Feedly. The integration ingests full article content and insights discovered by Feedly AI, such as IoCs and the relationships between threat actors, malware, TTPs, and CVEs.Double opt-in processes for Automated Newsletter emailsMarket IntelligenceThreat IntelligenceNews ReaderFeedly now offers double opt-in processes for newsletter emails. Customers who send newsletters to recipients in the European Union need to make sure they are complying with GDPR policies by obtaining proper con"
