["https://feedly.com/cve/CVE-2025-1564"]
title = "CVE-2025-1564 - Exploits & Severity - Feedly"
description = "The SetSail Membership plugin for WordPress is vulnerable to  in all versions up to, and including, 1.0.3. This is due to the plugin not properly verifying a users identity through the social login. This makes it possible for unauthenticated attackers to log in as any user, including administrators and take over access to their account.  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
full_description = "A critical vulnerability in the SetSail Membership plugin for WordPress affects all versions up to and including 1.0.3. The vulnerability stems from improper user identity verification during social login, which allows unauthenticated attackers to log in as any user, including administrators, and potentially take over their accounts. An attacker can completely bypass authentication and gain unauthorized access to WordPress sites using the SetSail Membership plugin. This could lead to: - Full administrative account takeover - Potential data theft - Unauthorized site modifications - Complete compromise of site security There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. Plugin developers should update to a version beyond 1.0.3 that implements proper authentication verification mechanisms. Immediate recommended actions: - Update SetSail Membership plugin to the latest version - If no patch is available, immediately disable the plugin - Review all user accounts for potential unauthorized access - Implement additional authentication controls - Monitor site for any suspicious login activities CVE-2025-1564 | Select-Themes SetSail Membership Plugin up to 1.0.3 on WordPress Social Login authentication bypass"
