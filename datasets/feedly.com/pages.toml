["https://feedly.com/ti-essentials/posts/everyday-risk-rating"]
title = "Everyday Risk Rating | TI Essentials | Feedly"
description = "Security people are sensitive to risks in the world. I’m not arguing what is too much, but that the calculations should be based on some sort of analysis."
full_description = "Best PracticesEveryday Risk RatingDaniel Miessleron Mar 22, 2022The following is a guest post from the Head of Vulnerability Management at a popular fintech company and host of Unsupervised Learning, Daniel Miessler. For more content from Daniel, find him at Unsupervised Learning or follow him on Feedly.One of my favorite pieces of trivia about the security industry is that the word security itself comes from the Latin se (without) and cura (worry). In other words, security is all about creating a state where people can go about their lives or their businesses “without worry”.This is hard to do right now. We live in a moment where we feel surrounded by dangers, and when some of those dangers are more real than others, and the ability to know the difference is essential to maintaining a peaceful state.Security people, perhaps especially threat researchers, are especially sensitive to risks in the world. We see problems in everything, and we’re prone to over-index on the amount of real-word danger they pose. How safe is it to let your kids walk to school? Couldn’t a Russian special forces group kidnap them? What if a band of elite assassins came to harm you while you slept at night?These are risks that some (too many) security people have thought about, and perhaps still do. This is why some people have guns distributed throughout their house, and all sorts of elaborate security procedures in place. I’m not arguing what is too much or what is enough here; that’s up to the person. The point is that the calculations should be explicit based on some sort of analysis.Luckily the security world also offers some tools to help us, in the form of risk rating and threat modeling methodologies. There are many variations of these, but I don’t believe most are well-suited to dealing with everyday problems.What I use and recommend is the following Everyday Threat Modeling methodology.Out of 1-100, determine how much value or pleasure you get from the item/feature. That’s your Value.Make a list of negative/attack scenarios that might make you not want to use it.Determine how bad it would be if each one of those happened, from 1-1000. That’s your Impact.Determine the chances of that realistically happening over the next, say, 10 years, as a percent chance. That’s your Likelihood.Multiply the Impact by the Likelihood for each scenario. That’s your Risk.Add up all your Risk scores. That’s your Total Risk.Subtract your Total Risk from your Value. If that number is positive, you are good to go. If that number is negative, it might be too risky to use based on your risk tolerance and the value of the feature.The arithmetic works fairly well here, but you can adjust it as needed. The most important thing is that you’re placing the things you’re concerned about into a system where it’s captured and made tangible.This is the part that’s missing from fear-based judgements, which can to irrational behavior choices.ExamplesThe best way to look at this is with examples.Protecting your house from intrudersUsing a passcode vs. fingerprint vs. facial recognition to unlock your phoneLetting your kids walk from one place to another in publicWriting a public blog and becoming a known personThrowing away bills without shredding themIn all these cases you have bad things that COULD happen.Assassins could sneak into your house and try to kill you while you sleep. It’s a thing that’s technically possible on Earth in 2022.But how likely is it?A disgruntled foreign spy could decide to kidnap kids for ransom, and just randomly choose your neighborhood to target. But how likely is it?Someone could see an opinion they don’t like on your new blog, and show up at your house with the intention to do harm. But how likely is it?This is why the methodology is so essential. To reduce your worry (se-cura), you need to capture all of the situations that you lose sleep thinking about, and for each of those, capture the precise scenarios you’re worried about.Then, using as much data as possible, assign probabilities to those scenarios.Then—and this is super important—weigh the benefit you get from it.What is the benefit of living in a house in a suburb instead of in an underground bunker in Idaho?How nice is it to use your fingerprint to open your phone?How much benefit do your kids get from autonomy walking around your neighborhood?How much life meaning do you get from expressing yourself on your website?How much time do you save by not being anal about shredding?In short, you have to do two things with this methodology:Understand how much real value you get from a particular behaviorLook at all the potential risks from it, using as much data as possible, and determine whether the probabilities of those risks make the dangers worse than the benefitBe Cautious of Inputs That Bias Your Risk RatingThis is a horrific collage of images from fatal car crashes.Are cars safe?What does safe even mean when collages like this are possible?The answer has to come from understanding the two factors above: 1) how useful cars are to you, and 2) the data around fatal car crashes.> There were 36,096 fatalities in motor vehicle traffic crashes in 2019.36,000 fatalities per year. Is that a lot? A little? The odds of dying from a car crash is about 1 in 107, which isn’t low, but cars are super useful and we accept the associated risks.The bigger point is not that we’ve accepted the risk. It’s that we could—if we tried—make ourselves afraid to drive by over-exposing ourselves to evidence of fatal wrecks.So, using that knowledge—should you let your kid walk to school or not? Should you start a public blog?When you are confronted with such questions, and you find yourself having an emotional reaction to the risks, take the time to use the methodology above.Make the list of things that could go wrong, and think about their chances. Sometimes this will convince you not to do something when you thought it was ok, but in many more cases you’re likely to realize the benefit outweighs the chances and/or impact of the downside.Over time you’ll be able to do this in your head, giving you a superpower that few people have.Special thanks to Daniel Miessler for this contribution to TI Essentials. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com"
