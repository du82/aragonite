title = "How artificial intelligence impacts the present and future of social engineering attacks | TI Essentials | Feedly"
full_description = '''Social EngineeringHow artificial intelligence impacts the present and future of social engineering attacksThreat actors have already started to use artificial intelligence to enhance their attack capabilities. What is the current state of this threat, and what should we anticipate in the future?Christina Lekation Apr 30, 2024Now is the right time to reflect on one of Stephen Hawking's remarks:“Success in creating AI would be the biggest event in human history. Unfortunately, it might also be the last unless we learn how to avoid the risks.”There is currently no bigger disruptor in most areas of technology than artificial intelligence (AI). Businesses worldwide seem to be in a rush to adopt and integrate AI technology with the goal of improving their operations and, ultimately, their revenue. Malicious actors are doing the same.The risks associated with the adaptation of AI within cyberattack kill chains received worldwide attention the minute ChatGPT (a form of generative AI) was launched. Shortly after, script kiddies, (white & black hat) hackers, researchers, and cyber threat actors started challenging the dark side of this software. Cybercrime forums and the dark web started flooding with screenshots of ChatGPT writing malware, phishing along with tailored and improved spear phishing emails (en-masse), and Python scripts with cryptographic functions that could be used in ransomware attacks. Security researchers (including myself) started thinking about the impact of this new tool on cyberattack operations.But it did not stop there. For the past year, we have also been observing a rapid acceleration in the development and quality improvements of generative AI capabilities on deepfakes. Although not quite perfect yet, the jumps in quality improvements, the accessibility of these tools, and their looming misuse are something we need to monitor and prepare for.The impact of Generative AI on social engineering attacksGovernment agencies and security companies alike have been warning about the near-term impact of AI and its implications on the global cyber threat landscape.In a very interesting report (published in January 2024), the UK's National Cyber Security Centre, fusing all-source intelligence, assessed the impact of AI on cyberattacks within the next two years.Some of their key findings focusing on social engineering attacks, state that:In future attacks, we will observe an “evolution and enhancement of existing tactics, techniques, and procedures (TTPs).”AI will provide a “capability uplift in reconnaissance and social engineering, almost certainly making both more effective, efficient and harder to detect.”It will also lower the barrier to entry for various types of threat actors and allow them to “carry out effective access and information gathering operations.”Based on my work, involvement, and experience in social engineering, I agree with those findings and predictions.We anticipate that in the near future, AI will significantly enhance three social engineering attack vectors:1. Phishing & spear phishing emailsBefore the emergence of generative AI, and with the help of security awareness training, people were able to spot many phishing emails based on certain red flags, such as grammatical errors and misspellings. These mistakes were often enough to raise the recipient's suspicions that an email could be malicious or fraudulent. However, with new generative AI tools like ChatGPT's language capabilities, this line of defense, based on user observation, is now easily defeated.Today, we are increasingly observing more phishing emails using almost flawless language and consequently being more challenging to detect as illegitimate.In addition, we are seeing significant improvements in spear phishing attempts. Those spear phishing attempts are not only tailored to the targeted individual but sometimes expand into an ongoing, well-crafted email chain communication when the target engages in a conversation.With these improvements in text, it has become much harder to differentiate a scam message (in emails, social media platforms, and more) from a legitimate one. We will dive more deeply into this (including an example) later in the article.2. Vishing calls & voice cloningVoice cloning has become a completely accessible technology nowadays. By providing a sample of only a couple of seconds of someone's voice, online tools based on generative AI can create long audio voice clones that are either recorded or (almost) real-time generated.Imagine an employee receiving a malicious voice message that appears to come from the CEO or their manager with a request. Not everybody will question the legitimacy of the voice message if the number is spoofed and the voice in the audio seems to be from their higher-up.As this technology advances, I expect vishing scam centers to exploit it, especially once real-time voice cloning becomes possible. In the past, employees could recognize a couple of red flags in the caller's speech and get suspicious if someone who claimed, for example, to call from a British company with a British name had a heavy foreign accent. With voice cloning technology, this inconsistency is eliminated.Companies in the hospitality industry and specific job positions that revolve around helping customers (e.g., helpdesks, customer service, hotel receptionists, etc.) will also have to become more aware of this threat as they tend to get heavily targeted. Employees who have received extensive training on how to be warm, accommodating, and helpful to customers will also have to be trained to follow proper customer/employee identification protocols—no matter who the caller appears to be —and stick with them.Voice cloning is one of the AI-enhanced technologies that will severely blur the lines between reality and deception in phone-based conversations.3. Video-deepfakes & impersonationsThis attack vector is potentially the most complex and, if misused, dangerous by-product of generative AI technology. Thankfully, it is also the least developed.About ten days after the incident, OpenAI launched Sora, a text-to-video AI model that can create somewhat realistic, short videos from a written prompt. This has raised many justified concerns about the malicious use of this capability for disinformation campaigns and influence operations. It also raises concerns about future developments in social engineering attacks similar to the one mentioned earlier.Video deepfakes are not perfect yet. Sora's videos, for example, still display glitches and inconsistencies that a careful eye can detect. However, they are still capable of convincing everyday individuals, especially those who are not very tech-savvy or do not pay attention to detail.Having witnessed the developmental jumps of generative AI, we can safely assume that video deepfakes will only keep improving. Real-time deepfake video generation is an evolution that will come to life as an expected next step. Business leaders and security professionals will have to prepare to adjust their internal processes and policies accordingly.How do threat actors leverage Artificial Intelligence right now?Let's look at the here and now. A few weeks ago, Microsoft released a threat intelligence report as the result of a collaboration with OpenAI.This report shared some insights on how particular state-affiliated threat actors (tracked by Microsoft) have sought to use large language models (LLMs) to amplify their ongoing cyberattack operations.Some of the findings, summarized, included the following:🔹 𝐒𝐚𝐥𝐦𝐨𝐧 𝐓𝐲𝐩𝐡𝐨𝐨𝐧 is a group associated with China known for targeting defense contractors and U.S. government agencies. It was observed using LLMs to "source information on potentially sensitive topics, high-profile individuals, regional geopolitics, U.S. influence, and internal affairs" in an effort to broaden its intelligence-gathering capabilities.🔹 𝐄𝐦𝐞𝐫𝐚𝐥𝐝 𝐒𝐥𝐞𝐞𝐭 is a threat actor group from North Korea known for spear phishing campaigns and impersonating universities and non-profits to gather intelligence from foreign policy specialists. This group has employed LLMs to identify and research potential targets. According to the report, they also use LLMs for "content generation likely to be used in spear phishing campaigns," as well as to comprehend publicly disclosed vulnerabilities, resolve technical problems, and navigate different web technologies.🔹 𝐂𝐫𝐢𝐦𝐬𝐨𝐧 𝐒𝐚𝐧𝐝𝐬𝐭𝐨𝐫𝐦 is an Iranian organization that specializes in distributing .NET malware to targets in defense, maritime shipping, healthcare, and various other sectors. They reportedly utilize LLMs to seek advice on social engineering tactics, troubleshooting errors, .NET development, and ways to avoid detection on a compromised machine.🔹 𝐂𝐡𝐚𝐫𝐜𝐨𝐚𝐥 𝐓𝐲𝐩𝐡𝐨𝐨𝐧 is a threat actor group connected to the Chinese government, targeting individuals opposing Chinese policies in various countries. According to Microsoft, they utilize LLMs to "gain insights into research to understand specific technologies, platforms, and vulnerabilities" indicative of early reconnaissance stages.Overall, we see that threat actors seem to commonly utilize generative AI, including LLMs, to gain insights (gather intelligence) on social engineering tactics, geopolitical affairs, technologies, and vulnerabilities and to perform reconnaissance on their targets. Their targeting focus is on the businesses, their technology or specific people working in organizations of interest, but also on geopolitical affairs. Unsurprisingly, they use LLMs to gain insights and advice on social engineering attack methodologies. But the most anticipated scenario of all, is that they seek to use LLMs for (spear) phishing content generation and for targeted attacks.Let's see how some of these capabilities that threat actors seek to exploit work in practice, today:Generative AI for intelligence gathering & OSINTLLMs like chatbots, including ChatGPT, Bard, or FraudGPT, seem to be the preferred choice of generative AI for cyber threat actors seeking to perform reconnaissance on a target. I have spent many hours researching them, trying jailbreaks, and trying to figure out if and how they can contribute to target reconnaissance.My findings and thoughts are mixed.LLMs can provide some good general information when it comes to understanding specific industries, the way they operate, the locations of some offices, etc. They even provide good enough descriptions of the layers of security that could be provided in facilities that need to be heavily secure.An example:The output of LLMs when conducting target reconnaissance can be good enough, but the main question is: Is it accurate? All the information LLMs provide comes with a significant risk: you cannot verify it since LLMs like ChatGPT (used in the example above) do not provide the sources its answers are based on, whether you ask specific questions or not. Good reconnaissance and open-source intelligence practices require verification and multiple resources before concluding an answer. LLMs provide responses. They may or may not be true.However, these responses are still helpful as they can act as leads for further, proper research.The image analysis capabilities (available in ChatGPT 4.0) are pretty interesting, too:Although the answer contains a mix of correct and false information, the output and the overall capability it provides are still impressive, particularly because the accuracy of the output is likely to improve over time.Still, there are many limitations to using LLMs as a stand-alone reconnaissance tool. The above are only two examples of the many I have encountered in my work.In a nutshell, LLMs:May provide confident, plausible answers that occasionally include false informationDo not typically site sources, making it hard to evaluate the data presentedMay provide responses based on outdated informationAre trained on “poisoned data,” too, including disinformation campaigns and other false or biased dataPrognosis/assessment:I would use LLMs with caution and always seek to cross-verify their output. The use of AI for OSINT remains a big chapter. However, there is one thing that the OSINT community tends to agree on: tools like ChatGPT and other LLMs can assist OSINT collection, but they are NOT reliable OSINT sources, nor are they OSINT tools for reliable intelligence gathering.Generative AI for enhanced (Spear) phishing email creationLLMs provide pretty good advice to novice social engineers who seek to increase their levels of success in phishing emails. Prompting a chatbot like ChatGPT to advise on increasing the click-through success rate is one of the ways. The advice ChatGPT provides, when asked, is very similar to the usual red flags and emotional triggers that we have been observing in actual phishing campaigns for years:Triggers like time pressure, an urgent update, or a lucrative offer have been typical elements in phishing emails for years. Script kiddies or other malicious actors can now quickly and effectively consult any LLM like ChatGPT under a ruse (or FraudGPT without any ruse) and get quick advice and inspiration on improving their phishing campaigns. They can also get a well-crafted phishing email text.Case Example: Operation SpoofedScholarsIn 2021, Proofpoint's Threat Research Team, including Joshua Miller and Crista Giering, reported on a social engineering campaign that was based on ongoing email communication.In this campaign, an Iranian-state-aligned actor (named TA453) assumed the identity of British scholars with the University of London's School of Oriental and African Studies (SOAS) and targeted specific individuals of interest. Their goal was to approach and engage those targets via email with a twofold purpose: to elicit sensitive information and to harvest their credentials.Proofpoint researchers observed extensive connection attempts between the TA453 and their targets, often including lengthy email conversations before moving on to the attack's final exploitation stage. According to the report, once the connection was established, the TA453 delivered an email with a "registration link" that led to a legitimate website that the actor had previously compromised. The webpage was set to capture and harvest a variety of credentials.In an observed communication, TA453 tried to entice their target by inviting them to an online conference and asking them for a phone conversation. The target, however, requested a written proposal with details. TA453 provided this proposal. After a few email exchanges and once the target's interest in the conference was established, TA453 emailed a (fake) conference invitation mentioning the malicious "registration link." You can see it below:While the exploitation methodology in this campaign is intriguing, there are some relatively apparent flaws. The emails include awkward phrasing and grammatical errors, which would be unusual for a native English-speaking individual of B'''
