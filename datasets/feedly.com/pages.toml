["https://feedly.com/ti-essentials/posts/high-value-targets-focus-intelligence-collection"]
title = "High value targets: Where should you focus your intelligence collection & analysis efforts? | TI Essentials | Feedly"
description = "High Value Targets (HVTs) are people with elevated privileges in an organization. This article helps analysts identify and manage risks surrounding HVTs."
full_description = '''Social EngineeringHigh value targets: Where should you focus your intelligence collection & analysis efforts?Christina Lekation Apr 19, 2022People tend to get shocked and fascinated every time they read a news story about a celebrity getting attacked or robbed due to the information they posted online. Kim Kardashian's robbery case back in late 2016 made international news as the world got to witness one more time how dangerous our online activity can be for physical security. The seemingly innocent information that Kim was posting on her social media accounts led a group of robbers to track her down, break into her hotel room, bound and gag her, and eventually rob her. At the time, Kim was posting online her travel plans, hotel, and expensive jewellery collection in real-time. After her robbers got arrested, they revealed that their entire targeting and attack plan was based on Kim Kardashian's online activity, which they were monitoring for almost two years, until they concluded that her hotel stay in Paris was the right moment to attack.While Kim Kardashian's story became viral, and while most of the security industry knows too well the risks associated with our online activities, we don't seem to have learned much from it. Many other, chillingly similar stories keep emerging as our world becomes more digital. But in those other cases, especially those involving company executives and key personnel, media attention is avoided at all costs, as it would be very harmful for the reputation of the organization they represent. Most frequently, the targets of similar attacks are not celebrities like Kim Kardashian but rather board members, CxOs, executives, and other individuals with elevated privileges or high levels of clearance in an organization. Industrial espionage operatives, competitors, cybercriminals, and many other threat actors monitor their targets and look for the right opportunity to strike.As an industry, we have come to understand that online information is regularly being harvested and exploited by various threat actors. We have also learned that digital threats can and often do develop into digital and physical attacks.Adversaries take a pretty pragmatic cost-benefit approach in strategizing their approach. They have realized that conducting a personal attack on a high-value target is much easier than looking for weaknesses in the enterprise security of the organization they are targeting. It is often a low-risk, low-cost, and high reward approach. Us defenders, on the other hand, face a different set of challenges. We have limited resources and many security areas to account for and protect. The most frequent questions in regards to safeguarding high-value targets are:"Who should we consider as a high-value target?""What should we do to protect them adequately?""Is this a priority?"Questions like the above are the reason for this article. I will start with the last question only because I feel the need to point out that if your high-value targets are not one of your priorities, they will gladly be your adversary's. But, I also need to remark that one of the main reasons security and threat intelligence teams de-prioritize high value targets is that they often get overwhelmed about scoping and budgeting a security plan for them. I cannot blame them. Let's take it from the start.Who is a High-Value Target (HVT)?The answer to this question can be specific but also open to interpretation. Ask yourself: which of your organization's staff members can provide access to critically important information/systems and, if compromised, could become a single point of failure? Who are the ones that pose a high-impact risk if an attack against them is successful? HVTs are usually individuals in the C-Suite, board members, senior executive management personnel, executive assistants, teams, or people with elevated privileges regarding information and organizational assets (including technological assets). Other times, they are teams of people working on sensitive or high-stake projects. Individuals may also turn into an HVT over a relatively short, specific period of time if, during that time, they get to engage in a critical project for the organization.For HVTs, one-size-fits-all cyber security training is not enough as a protective measure. Since their threat model tends to be very different from the one of other employees, they need a more tailored, relevant security training program. They also need to be protected through proactive measures for their security and the organization's cyber security posture. It is best to identify and manage vulnerabilities and risks before your adversaries and create a security program before they strike. Protecting HVTs is critical for their personal safety and ensuring the organization's smooth business continuity, good (cyber) security posture, and shareholder value.Protective Intelligence for High-Value TargetsProtective intelligence is a proactive rather than a reactive security measure. It involves the investigative and analytical process used to identify, assess and manage threats directed to specific targets. In this case, human targets. Protective intelligence aims to identify and manage threats against an individual, minimize the attack surface, and eliminate the advantage of tactical surprise by a hostile party. Protective intelligence is an excellent component in a security plan, as it tends to be an invisible process that is hard for a threat actor to identify. At the same time, it does not alert any hostile parties.There tend to be two main components involved in protective intelligence: a threat assessment and a vulnerability assessment. For this article, we will focus on vulnerability assessments for HVTs and the use of open-source intelligence (OSINT) to aid the intelligence collection and analysis of this vulnerability assessment. We start from OSINT because our adversaries use it as a primary means of information collection and exploitation against their targets. Threat actors will research publicly available information to identify patterns or information that can aid an attack plan or weaknesses that they can readily exploit. They will look for the private addresses of their targets and then also seek to identify whether security measures are in place to protect those premises. They will research their target's friends and family to see whether they can collect information that could aid a tailored social engineering attack or whether they leak additional information that could be of use. They will research their target's public appearances at conferences or other events because they know that an individual's security is weaker when they travel. There could be opportunities to steal the device(s) they carry or initiate a social engineering approach.OSINT helps security teams discover information that could put an HVT at risk and build a vulnerability profile they can work on. OSINT feeds protective intelligence and helps educate strategic decision-making to create a proper security plan for that individual. Is there additional or more specialized training required? Is there a need for enhanced security measures? Does the HVT need a security detail during his upcoming travel? The protective intelligence report helps educate all of those decisions and more.Using OSINT to Conduct High-Value Target Protective IntelligenceAs intriguing as projects like these can be, they require an effective workflow and a well-defined scope. Conducting OSINT on people can extend both broad and deep. It can put the analyst into endless hours of combing through information about that individual and multiple rabbit holes. Where should you, the analyst, allocate your time and focus on? For human High-Value Targets (HVTs), the main research requirements usually revolve around four main categories:Recognizability:Recognizability refers to the amount of information a threat actor can collect about the HVT. First of all, can an adversary identify a specific individual behind a mission-critical role? Suppose there is enough information online to positively connect an individual to a critical organizational position or task. In that case, the next step is to look into the publicly available data on that person.Adversaries that target individuals tend to look for (& exploit):Personally identifiable informationPrivate address(es)Residential security & neighbourhood securityPredictable routines & daily habitsFamily members & the information they post onlineTravel patterns, travel plans, and the security they employ while on travel (or absence thereof)Lifestyle; e.g., do they engage in social events, and are they open to social interactions?Accessibility:Accessibility refers to the ease with which a stranger can approach the HVT during their public or private encounters or even at the address(es) they live in or frequent. It also refers to their level of response and engagement with a potentially unknown individual, the presence or absence of a security detail, etc.Adversaries assessing the accessibility of an HVT will look for:Whether a security detail accompanies themThe vehicle(s) they are using for their daily commute & their parking location(s)The vehicle(s) they are likely to use during travelTheir demeanour & approachability during public appearancesTheir overall online activity and level of engagementTheir leisure time & hobbies (locations, environment, conduct)Pets: do they walk their dog?Close contacts: can they be used in a social engineering pretext?Vulnerability:Vulnerability refers to the target's level of exposure, predictability, and profiling accuracy, among other things. This factor also depends on the level of security awareness and good security habits the HVT practices. This category is tricky because it is also directly connected to adversarial capabilities or determination. For example, based on the threat actor's previous activity, are they likely to approach or harass friends & family members of their target? Do you identify weaknesses that can be exploited at a tactical level? The HVT's level of vulnerability will depend, to some degree, on the level of skillset, time, and resources that the threat actor is willing to dedicate to attacking. This area is inter-related with the following category: the threat assessment.Threat Assessment:An extremely valuable area of intelligence is in knowing who your adversaries are and how they operate. Do you have insights into their modus operandi, and can you decipher what information or intelligence they base their attack kill-chain on? If you do, then your threat intelligence is your main compass. Thinking like the adversary and trying to locate the pieces of information they base their attacks on will help you understand the level of vulnerability of your HVT.Open-source intelligence is not the only method used to find the information mentioned above, and the lists above are not exhaustive. Surveillance from the land and other methods may also be used in conjunction with OSINT, depending on the threat actor and their goals.How Do I Use The Protective Intelligence Report?Ensuring the security of an HVT requires more than having adequate technical infrastructure or a close protection operative. That individual's public and private actions can directly impact their personal and organizational security. A protective intelligence report identifies weaknesses and informs the organization's security strategy. It provides critical intelligence on whether a new, separate security program is needed for that individual or whether it is sufficient to simply enhance an already existing program. It evaluates the relevance of existing security measures.State-of-the-art security programs, by definition, keep evolving and keep adapting based on current threats. Realistically, protective intelligence often needs to be ongoing, and it needs to cover not only the work-life of the HVT but also their private, family, and leisure time. Threat actors target those areas. As defenders, we must ensure that we can proactively identify and eliminate or manage security weaknesses and risks before our adversaries strike to exploit them.'''
