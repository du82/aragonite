["https://feedly.com/ti-essentials/posts/how-to-use-priority-intelligence-requirements"]
title = "How to use Cybersecurity Priority Intelligence Requirements  | TI Essentials | Feedly"
description = "Priority intelligence requirements (PIRs) help cyber threat intelligence teams align their work with the organization's needs. Downloadable PIR worksheet"
full_description = "PIRsHow to use Priority Intelligence Requirements (PIRs) with FeedlyBest practices for optimizing your threat intelligence collectionJosh Darby MacLellanon Oct 16, 2023Priority intelligence requirements (PIRs) have caught on in private sector threat intelligence spheres as a best practice for intelligence teams, but what exactly are PIRs and why are they widely used? This blog post answers these fundamental questions and how to operationalize your PIRs inside Feedly using our PIR Blueprint.What are PIRs?To understand PIRs, it’s useful to begin with Intelligence Requirements (IRs).IRs are a set of topics that stakeholders need information and intelligence on to inform their decision-making.PIRs are a more specific subset of IRs that are critical to an organization’s mission and assigned a priority level based on input from stakeholders.PIRs are often documented in the form of questions, for example, “Which tactics, techniques, and procedures (TTPs) are being used during ransomware attacks targeting the healthcare sector?” Or, “How are Russian state-sponsored actors leveraging wiper malware and with what impact?”Why do Threat Intelligence teams use PIRs?PIRs are a best practice used by threat intelligence teams because they focus a team’s resources and collection on what stakeholders need. Often, multiple teams within an organization will require information and intelligence to navigate risks and make well-informed decisions. PIRs take the guesswork out of the Planning and Direction step of the intelligence cycle as you go straight to the stakeholders to find out precisely what they need.The Intelligence Cycle: The Intelligence Cycle is a common model used to show the steps involved in collecting and sharing information. It starts with the Planning and Direction step, where teams define the information that needs to be collected or produced to meet the needs of the organization. Here’s where PIRs can be useful as they provide a methodology that removes the guesswork in determining what information will benefit the stakeholders. By working with the stakeholders to define the PIRs, you’ll ensure that the team is focused on the right things.Introducing the Feedly PIR Blueprint (free resource)Establishing a PIR framework can be confusing without understanding the end goal. We’ve created the PIR Blueprint to help our customers operationalize PIRs using Feedly, with sample PIRs and intelligence-sharing options, to demonstrate how you can document PIRs. While the PIRs in the blueprint are built on direct experience while working as CTI analysts, they are only examples. Your PIRs will vary based on your company and stakeholders’ needs.The Feedly PIR Blueprint. Download and use to document your PIRs. High-level: Three steps to use the Feedly PIR Blueprint:Download a copyAdd your own PIRs to the blank templateCreate AI Feeds to collect and enrich insights on your PIRs inside the Feedly platformThe process to develop and document PIRsThe process of developing PIRs extends beyond the Feedly PIR Blueprint and involves you following a process similar to this one:Identify your stakeholders: Map out your intelligence stakeholders (those who need intelligence to inform their decision-making), who could be teams or specific leaders in Information Security (e.g., Vulnerability Management team), or non-security business lines (e.g., Technology).Interview stakeholders: Interview your stakeholders to find out what type of intelligence they need to inform their decision-making, the cadence they want to receive it, how they want that intelligence shared with them, etc.Synthesize into questions: Write the intelligence requirements in the form of questions that address specific information needs. These questions will typically cover one of the 5 Ws and H (who, what, where, why, when, or how), and should be specifically focused on an entity, activity, threat, trend, etc. Please see the Feedly PIR Blueprint for examples.Assign priority level: The intelligence team and the stakeholders should assess the priority level for each IR. This can be based on who the intelligence is for, how many stakeholders need that type of intelligence, and/or the potential impact of the threat the PIR covers (e.g., a PIR about ransomware could be more heavily weighted than one about deepfake technology).Document sharing format: Document how your stakeholders would like to receive the intelligence and in what format. For example, in Feedly, this could be newsletters, Slack/Microsoft Teams notifications, via API, etc.Translate PIR questions into Feedly AI FeedsNow that you’ve developed and documented your PIRs, the next step is to turn them into AI Feeds that will continuously scour the web and collect the relevant intelligence. Feedly AI Feeds are advanced queries that use AI Models and basic Boolean Operators to capture highly relevant articles and reports. The following illustration demonstrates how you to translate your PIR questions into AI Feeds.Three step process for turning PIRs into Feedly AI Feeds.If you want assistance with translating your PIRs into AI Feeds, you can book a PIRs workshop with your Feedly Customer Success Manager.There are other ways to collect information within Feedly for Threat Intelligence to satisfy your PIRs, including the Threat Intelligence Dashboard, CVE Insights Cards, TTP Dashboard, and Threat Actor Insights Cards. I’ll save those for another blog.Concluding RemarksPIRs are a win-win for your intelligence team and your stakeholders. The process of formulating PIRs builds better relationships with the business, and understanding what stakeholders really need helps drive efficiencies in your intelligence gathering, analysis, and sharing activities.Looking for a more advanced PIR resource?If you’re looking for a PIR documentation resource that is more advanced and granular than the Feedly PIR Blueprint, we recommend the Intel 471 General Intelligence Requirements Handbook (CU-GIRH) and Intelligence Planning Workbook. These free and publicly available documents provide a detailed process for PIR setting, template, and GIR Masterlist that are highly valuable resources for teams diving into intelligence requirements.You might also be interested inPIRsDeep dive on Feedly’s PIR blueprint and how to operationalize it PIRsHow to conduct stakeholder interviews to set Priority Intelligence Requirements (PIRs)PIRsTranslate your PIRs into AI Feeds"
author = "Josh DarMacLellan"
