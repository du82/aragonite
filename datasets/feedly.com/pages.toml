["https://feedly.com/ti-essentials/posts/monitoring-geopolitical-risk-strategies-and-resources-for-the-private-sector-intelligence"]
title = "Monitoring geopolitical risk: strategies and resources for intelligence analysts | TI Essentials | Feedly"
full_description = "Best PracticesMonitoring geopolitical risk: strategies and resources for intelligence analystsA a four-step approach for monitoring geopolitical risk tailored to the needs of threat intelligence practitioners.Josh Darby MacLellanon May 30, 2024In today's ever-turbulent landscape, we cannot ignore the threat of geopolitics spilling over to impact business operations. Monitoring geopolitical risk often falls upon resource-tight intelligence teams, who must analyze complex political, economic, and social indicators. But how can you take on this gargantuan task?This article outlines a four-step approach for monitoring geopolitical risk tailored to the needs of threat intelligence practitioners. I’ve developed this approach based on my geopolitical risk experience working in the Canadian finance and tech sectors, as well as academic studies in International Relations, security, and conflict.1. Identify and prioritize geopolitical risks2. Gather resources for monitoring3. Set up a monitoring process4. Report key developments and changes in risk levelBut first, let’s clarify geopolitical riskIn the context of threat intelligence, geopolitical risk refers to the potential for international political events to impact your business’ economic and operational environment.These risks include regulatory changes, political instability, armed conflict, sanctions, trade disputes, and shifts in political alliances.1) Identify and prioritize geopolitical risksUnderstand your organization's needs:Before turning attention to the external geopolitical landscape, it's important that you (the intelligence practitioner) invest time researching the organization you are protecting. Learning the business will enable you to assess what to monitor and what is relevant.This involves researching and talking to stakeholders about the business line's global footprint, supply chains, key markets, and regulatory environments. Here’s a guide on running stakeholder interviews to collect Intelligence Requirements.Prioritize a list of geopolitical risks:Your challenge is not only to identify geopolitical risks but also to rank them based on analysis of their potential downstream impact on your organization.This ranking will guide your team on how many resources to allocate to tracking each situation, recognizing that multiple crises often occur simultaneously.2) Gather resources for monitoringTo effectively monitor geopolitical risk, you’re going to need a wealth of resources. These are some of the different sources you can use to gather intelligence.Open-source intelligence (OSINT): A wealth of information can be gathered from publicly available sources. Reputable international news outlets, government reports, and statements from political leaders are crucial for real-time updates. I’ve found that sources offering comprehensive global coverage, such as Reuters and BBC World News, help me stay updated on developing conflicts. Tools that aggregate these sources into a single pane of glass have been a big time-saver.Social media and crowdsourced data: Platforms like Twitter/X, Telegram, and Discord can be valuable for real-time information and public sentiment analysis. However, the challenge lies in verifying the reliability of these sources, as they are not held to editorial or journalistic standards. Not to mention the plethora of threat actors abusing social media to spread disinformation — never trust, always verify.Non-government organization (NGO) reports: NGO reports on crime trends, conflict zones, human rights abuses, and similar topics can provide valuable information for tracking geopolitical events. NGOs publishing good quality reports include Amnesty International, Human Rights Watch, and Transparency International. I have a great deal of respect for the work NGOs do, especially considering the risk to their staff from challenging authoritarian regimes. I’ve found the reports where datasets and statistics are available to be highly useful. However, not all NGOs are created equally, and understanding how/who funds an NGO will help evaluate its reliability.Government and international organization reports: Publications from the United Nations, World Bank, and specific country departments of foreign affairs or commerce can provide authoritative information on geopolitical developments and policies. The resources governments and international organizations (IOs) have to collect data are hard to rival, but something to keep in mind is that every government has its foreign policy agenda, and this could influence reporting or the funding of IO reporting. I still consider UN agency reports highly reliable, but I spend a little time considering the political context behind them—what doesn’t get reported on is always interesting to consider.Academic and think tank publications: Institutions such as the Council on Foreign Relations (CFR), Chatham House, International Crisis Group, and the Carnegie Endowment for International Peace publish research and analysis on international affairs. The quality of the research from these sources goes far deeper than the news media, but be aware that some think tanks provide resources that are designed for academic or policy audiences, and therefore too in-depth for time-limited private sector intel teams.Subscription-based intelligence services: For in-depth analysis, services like Stratfor, Control Risks, S&P Global (IHS Markit), Sibylline, and some cyber threat intelligence providers provide expert geopolitical analysis, forecasts, and risk assessments. Although some of these providers can be quite expensive, intel vendor resources offer a deeper insight into the implications of current events, and access to regional specialists is a huge force multiplier.3) Set up a monitoring processEstablishing a monitoring process:Define the scope of what needs to be monitored, focusing on regions, countries, markets, or specific geopolitical issues that are most relevant to the business.Draft a process to ensure you collect information on the topics within scope, and then process, review, and analyze that information for potential impact. This process should be timely, repeatable, and realistic given your intelligence team's capacity and stakeholder needs.Continuous monitoring and analysis:Continuous monitoring is key to staying informed on geopolitical developments, which can evolve rapidly. A best practice for intelligence teams is to set up at least a daily review of intelligence sources with alerts configured to notify your team of significant developments.It's worth exploring source aggregation tools with automatic alerting functionality and analytical software for data aggregation, visualization, and trend analysis to enhance your monitoring capabilities.4) Report key developments and changes in risk levelCommunication and reporting:Effective communication is critical. Your intelligence team must ensure that relevant insights and risk assessments are efficiently communicated to decision-makers within your organization.This could involve strategic intelligence briefings, which should be clear, concise, and tailored to an executive audience, with actionable recommendations. Or, it could be sending a quick email to your HR team with bullet point updates on a developing conflict that impacts employee travel.Situational versus actionable intelligence:Beyond reporting in a timely fashion, it's essential to be selective with the type of intelligence you share with your stakeholders. Consistently reporting updates on geopolitical crises that have minimal relevance or impact on your organization will likely cost you credibility.Instead of routinely producing situational intelligence reports, providing actionable intelligence or an update to your organization’s risk level when necessary could deliver more value. Always seek to answer the “so what?” question — X country makes a move on Y country; so what is the relevance of this for our organization?Conclusion: monitor geopolitical risk to inform business decisionsIn a world where geopolitical risks can swiftly translate into operational instability for businesses, the role of an intelligence analyst is indispensable.By leveraging a wide array of resources, developing an agile and proactive approach to monitoring, and employing rigorous analytical methods, you can help your organization mitigate the fallout from geopolitical crises.Ultimately, the goal is to enable the business to make informed decisions that safeguard your operations against the unpredictable tides of international relationships.You might also be interested inPIRsTranslate your PIRs into AI FeedsPIRsDeep dive on Feedly’s PIR blueprint and how to operationalize it Threat IntelligenceTTP Dashboard: Discover trending threat actor behavior"
