title = "Introduction to MITRE ATT&CK - Featuring Version 16 (2024) | TI Essentials | Feedly"
full_description = "MITRE ATT&CKIntroduction to MITRE ATT&CK - Featuring Version 16 (2024)Josh Darby MacLellanon Dec 05, 202415 sec-summaryCTI teams face constant pressure to monitor and detect emerging threat actor Tactics, Techniques, and Procedures (TTPs) across open-source intelligence. Feedly automates OSINT collection using AI to map threat actor TTPs to the MITRE ATT&CK framework. Feedly is constantly updating its TTP AI Models and recently aligned with MITRE ATT&CK version 16.With Feedly Threat Intelligence, you can:Filter open source content to reports and articles that mention a TTP using an AI Model that maps all MITRE ATT&CK TTPs.Generate MITRE ATT&CK Navigator layers instantly from threat intelligence reports.Visualize trending TTPs and threat actor usage through the TTP Dashboard with flexible time ranges and export options.Feedly simplifies TTP intelligence collection, monitoring, and visualization, helping threat hunters identify security control gaps and build proactive defenses.Start Free TrialCurious to see this in action, check out this video:Have you ever wondered how to create a prioritized list of threat actors? Or identify what malicious tactics and techniques are most relevant? Or what security controls should be improved first? The MITRE ATT&CK Framework can help. Version 16 has just been released and this blog will help you understand what the Framework is and what’s new.What’s new in MITRE ATT&CK Version 16?ATT&CK continues to evolve, cataloging adversary behavior, and support defenders by highlighting new, emerging, and familiar TTPs:Restructured Cloud Matrix: Cloud-related techniques and sub-techniques has been refined to more distinction and detail. Key changes include:Broadening the Identity Provider platform to cover multiple services, including Azure AD.Adding an Office Suite platform to clarify overlaps between Google Workspace and Microsoft 365.Refining the overall structure for clearer distinctions in cloud functionality.Expanded Adversary Tactics and Techniques: Version 16 introduces 19 new sub-techniques and enhancements to existing ones, reflecting cutting-edge threat trends.Broader Coverage and Practicality: These updates ensure the framework stays actionable and relevant, reflecting both strategic and technological shifts in adversary behaviors.Learn more about the new attack techniques19 new techniques as AI Models in Feedly.What is MITRE?MITRE is a US-based not-for-profit organization that supports the US federal government in advancing national security by providing a range of technical, cyber, and engineering services to the government. In 2013, MITRE launched a research project to track cyber threat actors’ behavior, developing a framework named Adversarial Tactics, Techniques, and Common Knowledge, or in short form: ATT&CK.What is the MITRE ATT&CK Framework?MITRE ATT&CK contain a taxonomy of threat actor behavior during an attack lifecycle, broken down into tactics that each contain a subset of more specific techniques and sub-techniques (covering the TT in TTPs). The Framework is split into three separate matrices, Enterprise (attacks against enterprise IT networks and cloud), Mobile (attacks targeting mobile devices), and industrial control systems (attacks targeting ICS).The Framework contains a wealth of knowledge based on real-world observations. To give you an indication of scope, the October 2024 iteration of ATT&CK for Enterprise contains 14 tactics, 203 techniques, 453 sub-techniques, 159 groups, 710 pieces of software, 34 campaigns, 44 mitigations, and 37 data sources.Screenshot of the MITRE ATT&CK Framework for Enterprise with some but not all techniques.Each technique can be explored to reveal sub-techniques and there is an entire MITRE knowledge base that feeds the matrices. This database contains a colossal amount of information on threat actor groups, malware, campaigns, descriptions of techniques and sub-techniques, mitigations, detection strategies, references for external resources, an ID system for tracking, and more.MITRE’s definitions of tactics, techniques, and procedures.Here are the 14 tactics contained in the Enterprise matrix:MITRE ATT&CK's 14 Enterprise Tactics.How can you use MITRE ATT&CK?How you use MITRE ATT&CK largely depends on which team you sit on and your workflows. Security teams who often rely on ATT&CK include blue teams, investigators, incident responders, cyber threat intelligence analysts, red teams, penetration testers, purple teams, and tooling assessors/engineers, each with their own use cases. Let's explore some of these use cases.Use Case #1: Research threats and attack lifecyclesMITRE ATT&CK is a phenomenal research tool. At a glance, it clarifies the stages of an attack lifecycle by splitting adversary behavior into tactics. The ability to zoom in on sub-techniques and uncover a treasure trove of descriptions and examples makes understanding cyberattacks accessible to anyone.This benefits everyone, from the novice seeking to learn about TTPs, to battle-hardened veterans who want to refresh their attack scenario knowledge (memorizing 435 sub-techniques would require a super-human memory).If your email gateway has quarantined multiple malicious emails containing unfamiliar malware, check the relevant MITRE ATT&CK matrix and if the malware is there, you’ll discover which techniques it is associated with it, with reference to real-world examples. This can help you determine what the threat actor is likely trying to achieve.With a click of a button, you can visualize that data by exporting it to MITRE ATT&CK Navigator, an interactive version of MITRE ATT&CK we highly recommend you explore (it’s also free).Quick hack:Use Case #2: Threat actor tracking and controls assessmentMITRE ATT&CK can be used to map the most common tactics and techniques used by your top priority threat actors. You can scan ATT&CK's “Groups” section for a list of common threat actors relevant to your organization or sector. You can then export that information into the MITRE ATT&CK Navigator.In Navigator, you can import multiple tabs, each containing a group, and overlay them, exposing the most common techniques your top priority threat actors are using (Navigator has scoring and color code features). This enables you to zero in on the most dangerous techniques facing your organization, helping you assess your detection coverage against the most prevalent threats. Armed with this knowledge, you now have data to reinforce the business case for acquiring new security controls or tools to enhance your defenses.Use Case #3: Mapping and responding to a novel attackBeing targeted by an attacker you have never dealt with before? MITRE lets you build a custom layer of an ATT&CK matrix in Navigator based on the malicious activity you’ve observed in your network. Here’s an example of how that can look:You detect suspicious activity on the network. Indicator of compromise (IoC) alarms are triggered, malware and C2 beaconing are detected.You investigate historical activity and discover evidence of initial access. Your organization received phishing emails, employees downloaded malware, and there are IoCs of lateral movement across the network.You create a custom layer in MITRE Navigator for clearer visualization of this activity.This flags the risk of data exfiltration as a potential next step for the attacker.You check and implement detection methods and mitigations by combining information from MITRE and your internal controls.These examples just scratch the surface of what’s possible with ATT&CK. If you want to learn more, check out MITRE’s Getting Started page.How does Feedly integrate with MITRE ATT&CK?In case you’re wondering why we at Feedly are writing about MITRE ATT&CK, it’s because we recognize the importance of ATT&CK, and have been working with our customers to develop integrations in Feedly.We’ve used machine learning models to map content in articles to the MITRE ATT&CK tactics, techniques, and sub-techniques to spread the common language they’ve created.You can specifically search for MITRE TTPs in Feedly and, with a single click of a button, any article you find containing TTPs can be opened in ATT&CK Navigator (or downloaded as a JSON file).Try Feedly Threat IntelligenceStreamline your analysis and seamlessly integrate open-source intelligence with MITRE ATT&CK Navigator using Feedly AI.Start Free TrialYou might also be interested inThreat IntelligenceTTP Dashboard: Discover trending threat actor behaviorThreat IntelligenceTrack adversary behavior in real-time with Threat Actor Insights Cards FundamentalsPrompt engineering: Generate Threat hunt hypothesis"
