title = "CVE-2025-1671 - Exploits & Severity - Feedly"
description = "The Academist Membership plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 1.1.6. This is due to the academist_membership_check_facebook_user() function not properly verifying a user's identity prior to authenticating them. This makes it possible for unauthenticated attackers to log in as any user, including site administrators.  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
full_description = "Privilege Escalation vulnerability in the Academist Membership plugin for WordPress affecting all versions up to and including 1.1.6. The vulnerability stems from the academist_membership_check_facebook_user() function's inadequate user identity verification mechanism. Unauthenticated attackers can exploit this vulnerability to log in as any user on the WordPress site, including administrators. This allows complete unauthorized access, potentially leading to: - Full site compromise - Data theft - Unauthorized content modification - Potential use of the site for malicious purposes There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. Plugin developers should release an update to properly implement user identity verification in the academist_membership_check_facebook_user() function. Users should immediately update to a patched version once available. Immediate recommended actions: - Disable the Academist Membership plugin if possible - Remove Facebook authentication until a patch is available - Monitor site for any unauthorized access or suspicious activities - Audit user accounts and access logs - Consider forcing password resets for all users"
