["https://feedly.com/ti-essentials/posts/how-to-use-mitre-attck-for-threat-intelligence"]
title = "How to Use MITRE ATT&CK for Threat Intelligence | TI Essentials | Feedly"
description = "Using ATT&CK for CTI provides a way of analyzing adversarial capabilities and how threat actors accomplish their goals in the cyber domain."
full_description = '''MITRE ATT&CKHow to Use MITRE ATT&CK for Threat IntelligenceMars Groveson Apr 12, 2022The MITRE Adversarial Tactics, Techniques, and Common Knowledge (ATT&CK™) framework is a knowledge base for threat modeling, categorizing, and detailing cyber adversary behavior throughout various phases of the adversary lifecycle, reflecting past and current real-world observations in the cyber domain––a comprehensive, structured matrix for threat intelligence. It serves as both the adversary emulation playbook and a method for discovering analytic coverage and defense gaps inside a target network. It is public and accessible to anyone, allowing the community to contribute to it and utilize it.Using ATT&CK™ for threat intelligence and cyber threat intelligence (CTI) provides an organized way of analyzing adversarial capabilities, motivations, and goals, including how threat actors accomplish their goals in the cyber domain. It is pragmatic for detecting adversary behavior and understanding security risk against it, planning security improvements, and verifying defenses are working effectively. More importantly, it uses a common language, making it simple for anyone to communicate their adversary findings between various departments and organizations.Anatomy of the ATT&CK™ MatrixThe MITRE ATT&CK™ framework, also commonly known as the ATT&CK™ Matrix, documents numerous Tactics, Techniques, and Procedures (TTPs) that advanced persistent threats (APTs) or APT groups may use against various networks and systems, updating on an ad hoc basis. Tactics are the tactical goal and phase an adversary first chooses before using techniques and procedures of choice to engage in malicious activity.The ATT&CK™ Matrix comprises three core components: Tactics, Techniques (Sub-Techniques included), and Procedures.1) What is a tactic?A tactic represents the "what" and "why" of a technique or sub-technique. It is the tactical goal of what the adversary will accomplish and why. It can include different phases such as reconnaissance, resource development, initial access, execution, persistence, privilege escalation, defense evasion, credential access, and more. For example, an adversary may want to achieve initial access or privilege escalation.2) What is a technique?A technique is "how" an adversary achieves a tactical goal and may also represent what an adversary gains by performing an action. For example, an adversary can gain initial access (tactic) to their target device or network using different techniques like spear-phishing or a drive-by compromise.3) What is a sub-technique?A sub-technique provides more granular descriptions of techniques or adversarial behavior used to achieve a goal. They describe behavior at a lower level than a technique. For example, an adversary may dump credentials by accessing the Local Security Authority (LSA) Secrets.4) What is a procedure?A procedure is a particular instance of how the adversary uses techniques or sub-techniques in the real world. For example, a procedure could be an adversary using PowerShell to inject into lsass.exe to dump credentials by scraping LSASS memory on a victim. It is more specific.Procedures, Mitigations, and DetectionsProcedures as well as recommendations for mitigations and detections can be found when you click on a sub-technique found under a technique that is expanded. References are at the bottom of the page as well which is very helpful for research.For this example, I selected the tactic "Lateral Movement" and clicked on the technique "Remote Desk Protocol." As a result, I found a wealth of information such as procedure examples that included APT groups, mitigations, detections, and references at the bottom of the page as seen here.ATT&CK™ MatricesThe MITRE ATT&CK™ framework currently has three matrices:Enterprise (most popular)MobileICS (abbreviation of Industrial Control Systems)In this article, I focus on the latest ATT&CK™ Enterprise Matrix comprised of 14 Tactics, 188 Techniques, 379 Sub-Techniques (procedure examples, if present, are usually in this category), 129 Groups, and 637 Pieces of Software. The latest version of ATT&CK™ is Attack v10.See screenshot below of what the ATT&CK™ Enterprise Matrix looks like.Upon viewing the ATT&CK™ Enterprise Matrix, you can see the list of Tactics and Techniques. The 14 Tactics from left-to-right horizontally are the following: Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration, and Impact. Each tactic has a set of techniques that are displayed vertically.By using ATT&CK™ and looking at the TTPs that threat actors or adversaries use, we can apply ATT&CK™-mapped intelligence and visualize the threat actors' behaviors, learning quickly about them––we gain a clearer picture of what is happening.ATTACK matrices can be viewable on the MITRE ATTACK Navigator here: https://mitre-attack.github.io/attack-navigator/Threat Intelligence vs. Cyber Threat Intelligence (CTI)When using ATT&CK™ for threat intelligence, it's a good idea and very helpful to have an understanding of what it entails. It's also important to note that in order to gain the most value from producing actionable threat intelligence, the first and most crucial step of the threat intelligence lifecycle must be done––asking the right question. It's critical to plan, identify your use cases, and define your objectives to have direction and focus before doing anything such as using ATT&CK™ for threat intel.Threat intelligence involves the analysis of threat actors' capabilities, motivations, and goals. It provides context and analysis, preparing organizations to be proactive instead of reactive for future cyberattacks. Those who master the art and science of analyzing threat actors' intentions, capabilities (e.g., capability to exploit Windows 10 or Android API), quality threat data i.e. IOCs, and opportunities they can take advantage of, will have more leverage to secure and defend against threat actors.“Threat intelligence is evidence-based knowledge, including context, mechanisms, indicators, implications and action-oriented advice about an existing or emerging menace or hazard to assets. This intelligence can be used to inform decisions regarding the subject’s response to that menace or hazard.”GartnerCyber threat intelligence (CTI), on the other hand, involves the analysis of "how" adversaries use the cyber domain to accomplish their goals. It can help connect the dots between indicators of compromise (IOCs) and TTPs that threat actors use. ATT&CK™ assists with filling any gaps and providing more context on IOCs and TTPs, which helps analysts decide what to prioritize and ignore (especially when they are overwhelmed with data overload from their threat data feeds). Threat hunters can also further understand the various adversary techniques used in cyberspace while proactively hunting for threats, gauging their environment's visibility against targeted attacks better by using ATT&CK™.There are four types of threat intelligence.Strategic threat intelligenceProvides a non-technical overview of an organization's threat landscape such as vulnerabilities, risks, preventive actions, threat actors' tactics and goals, and the severity of potential attacks. It is mainly for informing executives or executive-level security professionals and decision-makers at an organization (e.g., CISO, CTO, Board of Directors). It is less technical and is presented through reports or briefings.Tactical threat intelligenceGives a rundown of TTPs, tools, and infrastructure threat actors are using, including more detailed information such as attack vectors, insights like exploitable vulnerabilities in security systems, and focuses on malware analysis and enrichment, etc. It is used by defensive mechanisms and staff (e.g., security architects, sysadmins, SIEM), helping to build a defense strategy to mitigate attacks.Technical threat intelligenceFocuses on analyzing specific indicators of compromise (IOCs) or specific malware. A threat intelligence analyst may scan for IOCs and share them. Timing for sharing technical intelligence such as a threat intelligence platform (TIP) is critical because IOCs like malicious IP addresses and fraudulent URLs change or become obsolete within a few days. It is used by threat intelligence analysts, SOC staff, Incident Response (IR) teams.Operational threat intelligenceProvides details of a specific incoming attack or knowledge about an attack, including factors like nature, motive, timing, and how an attack is carried out. It is used by defenders, and it can be used by social engineers who pry information from threat actors in hacker chatrooms or online discussions through infiltration. The latter is more difficult to obtain.Pyramid of Pain: IOCs and TTPsDavid J. Bianco, an incident responder, created a diagram that he calls the Pyramid of Pain that illustrates the relationship between types of indicators such as IOCs that you may use to detect an adversary's activities, including how much pain it will cause them when you are able to deny those indicators to them.There are six levels from bottom-to-top and they increase with difficulty as you climb up the pyramid. The levels are the following: hash values, IP addresses, domain names, network/host artifacts, tools, and TTPs.Several years ago, threat hunting mainly consisted of searching for simple threat data such as indicators of compromise (IOCs) which included malicious IP addresses, domains, file hashes, signatures, malware, libraries, strings. The problem is, they are simple and easy to change frequently, making them less reliable information. However, that does not make them useless as they can be a great starting place for investigations.TTPs on the other hand deliver the most valuable information, and that is because when you detect and respond quickly to TTPs, you are operating directly on adversary behaviors. This forces the threat actor(s) to learn new behaviors, which is very time-consuming for them and not fun.Hence, at the apex of the pyramid where TTPs are, you will notice it is labeled as “tough” because this level causes the most pain for threat actor(s) when you operate on this level for two reasons: it forces the threat actor(s) to give up or reinvent themselves from scratch.MITRE ATTACK™ & Threat Intelligence Use CaseLet's explore how MITRE ATT&CK™ can be used for certain use cases.For this particular use case, we will use a USA-based company that we will call FinLife Industries Inc., which belongs to the finance and life insurance industry.FinLife Industries Inc. has a serious problem––it just discovered that a new APT group has been specifically targeting finance and life insurance companies, and have recently gone rampant and are all over the news. FinLife Industries Inc. is worried about this APT group targeting them next, deciding to use MITRE ATT&CK™ to gain a better understanding of how they can defend their company and mitigate an attack if they are targeted.The problem is, they aren't exactly sure where to start with the ATT&CK™ framework. They have looked at over 300+ techniques that tell them everything about what threat actors can do in their environment, and they believe they have made the necessary proactive measures to defend against most of those techniques, but they still don't know how they can effectively use ATT&CK™.That changed when they added threat intelligence into the picture after discovering from their research that there are 35 threat actors known to target similar companies in the finance and life insurance industries. Now, they know what questions to ask, which will help them plan and have direction. Questions such as: How can they defend themselves against these 35 threat actors? What techniques do they use?Soon after, they discovered that those 35 threat actors are known to use 111 specific techniques in their attacks. Now, they can prioritize those techniques based on widespread use and ease of execution, and begin testing them with their defensive and offensive teams.FinLife Industries Inc. begins the process of narrowing things down and filtering unnecessary data because they are overwhelmed with so much threat data, so they start investigating the geographical areas those 35 threat actors are known to target. After fine-tuning their research, they found that only 13 of them are targeting companies like theirs in the USA. Their next course of action is to start looking into the TTPs those 13 threat actors use. After doing this, they discovered that they use 57 specific techniques. Now they can be given the highest prioritization and understanding of how they may be working against them.FinLifeIndustries Inc. can finally start using threat intelligence and MITRE ATT&CK™ with focus, and begin testing those TTPs with their Red Team and penetration testers. After testing them, they learned what worked and what didn't work in their environment. They were also able to return to the MITRE ATT&CK™ website and pull recommendations for detections and mitigations, which can be something simple like multi-factor authentication. When focusing on the most important threats to their environment, FinLifeIndustries Inc. was able to figure out what works and what doesn't work, bringing awareness to their security teams and leadership.SummaryThe MITRE ATT&CK™ framework is incredibly effective when used with threat intelligence. Understanding how it works and knowing what questions to answer provides the direction and focus necessary for finding viable defense solutions. Although there is so much that can be covered with the MITRE ATT&CK™ framework, its fundamentals are relatively easy to understand and it is simple and accessible for anyone to use. Using MITRE ATT&CK™ with robust threat intelligence is very powerful and can keep you proactive against adversary behaviors and threat actors.'''
author = "Mars Groves"
year_published = 2022
year_updated = 2022
