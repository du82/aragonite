["https://feedly.com/ti-essentials/posts/components-to-include-in-your-threat-intel-brief"]
title = "5 Critical Components to Include in Your Next Threat Intel Brief | TI Essentials | Feedly"
description = "Threat intelligence briefs help your team understand security trends and reduce exposure of your business. Here, we'll discuss five components of a good brief."
full_description = '''Best Practices5 Critical Components to Include in Your Next Threat Intel BriefThomas Rocciaon Mar 24, 2022The following is a guest post from Microsoft Security Researcher, Thomas Roccia. For more content from Thomas, find him on Twitter or follow his blog on Feedly.Threat Intelligence briefing is an important part of your threat model. Regular briefs help your team to understand security trends and reduce the exposure of your business. They allow your team to be better prepared for future attacks and help them appreciate the tactics, techniques, and procedures used by attackers to adjust the defenses you have in place. A weekly or monthly threat intelligence briefing can be highly informative and useful for the security team as well as for senior management.But to be actionable and insightful, these threat intelligence briefs must be succinct yet comprehensive, a balance that can be difficult to achieve without an understanding of best practices. Here, we'll discuss five components of a good threat intelligence brief, including a template example.1 - What's the hottest topic of the week / month?At the top of your brief, include a "must read" section, which should include strategic information specific to your industry, or news big enough to warrant quick action. This section should contain an abstract of each event, link to external resources or context, and list direct countermeasures to any threats mentioned, if available.Some factors to consider when deciding which stories to include in this section:Some threats affect more organizations because they exploit a vulnerable component that is quite common in most organizations. Be sure to include these far-reaching threats.A threat actor can also be very active in a specific industry, which could impact your own organization. The more relevant a threat actor is, the more information you should include on their activities.Recent data breaches from products or services your organization uses are important to note prominently.All of these examples are red flags that should be at the top of your threat briefing. It is crucial for an organization to be able to understand whether any part of its infrastructure is currently vulnerable, under attack or at risk. If it is specific to your environment, it should be part of your briefing and be helpful to the security team in making the right decision to increase security at that time.2 - What other news is there that could impact the organization?Cyber-attacks, data breaches, zero days and more happen daily. This is why a "Trending News" section is helpful, to cut through the business and inform your team of any major events they should be aware of.Many researchers publish Threat Intelligence Reports that document the tools and operating methods used by a specific actor. Even if it doesn't have a direct impact on your organization immediately, it can be important to keep it on your radar, educate yourself on these tactics, understand trends and also improve your internal knowledge base. This section should highlight other security news that does not have a direct impact on your organization but poses a security risk.3 - What new malware or hacking tools are currently in use in the wild?The number of malware and hacking tools used by threat actors is exponential. With the release of many open-source code and their accessibility, threat actors are taking advantage of these tools to breach companies. To stay up to date of new releases and newly discovered malware it is important to keep a track of those report. This will help the security team to be proactive and study those components to verify the internal coverage as well as discussing the matter with third party.A "Malware Analysis" section can provide a snapshot of specific malware that are most threatening to your organization. Consider including the name of each relevant malware, its capabilities, TTP, and an external link to any available in-depth analysis.4 - What new vulnerability has been discovered recently?Vulnerabilities, Code Exploitation, and Zero Day are sold underground and actively used by threat actors. This is why a "Vulnerabilities" section should contain the recently discovered vulnerabilities to verify the exposure and be proactively used to improve your patch management and stay up to date.This section should include the most critical vulnerabilities currently exploited in the wild. Be sure to include the CVE number, affected product(s), CVSS, if the exploit is available publicly, if a patch is available, and any relevant external links.If you're using Feedly for Cybersecurity for OSINT, you can simply screenshot the CVE dashboard of relevant vulnerabilities to see all of these CVE details at a glance (example below).5 - Practical tipsConclude your brief with practical tips for the readers. This should be something that readers can learn for their daily work, or even a new tool that has been released and that can facilitate their work. Fill this section with any helpful articles or tips you come across during your daily research and analysis, but feel free to leave it blank if you don't have anything to add that week.Daily, weekly, monthly? How often should you publish threat intelligence briefs?This threat intelligence briefing model is a proposition that needs to be adjusted for each organization. In fact, this model must be adapted for each version and customized to your own need.The number of security reports today is very overwhelming, and it is sometimes difficult for an organization to sort out the most useful information. To be able to find the most relevant information, a threat summary can be a useful tool for your organization. While it might take time to work on it, it will save you time in the future.Ultimately, the frequency of your threat intelligence briefs should flex with the needs of your team. As you learn to develop your brief process and template, gathering this information will become easier and you may find it helpful to send intelligence briefs more often.Some tips for creating your briefs fasterKeep your formatting simple. The example in this article has been designed for the sake of teaching, but a word document with bullet points will also suffice just fine.Highlight the most important information to draw the eye to critical insights.If you want to determine the efficacy of your briefs, consider adding a note at the bottom that requests confirmation of receipt from the reader. This will help you gauge how many are reaching the end - and if that number is low, you may want to simply your format or make your briefs more succinct.If you're using Feedly, add articles you want to include to a Board, so they are handy when you are ready to draft your brief.Once you've decided which vulnerabilities to cover, consider screen shotting the CVE dashboard instead of listing out the details.Consider adding an interesting tip or a fun fact at the end, to enlighten your threat briefing and find the engagement of your readers.Special thanks to Thomas Roccia for this contribution to Ahead. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com'''
author = "Thomas Roccia"
year_published = 2022
year_updated = 2022
