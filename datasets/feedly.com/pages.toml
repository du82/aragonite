["https://feedly.com/ti-essentials/posts/how-to-use-threat-intelligence-to-form-a-stronger-purple-team"]
title = "How to Use Threat Intelligence to Form a Stronger Purple Team | TI Essentials | Feedly"
description = "If you’re doing purple team exercises, threat intelligence is one way to help set up real-world scenarios for your team. This way, you can build real TTPs."
full_description = "Best PracticesHow to Use Threat Intelligence to Form a Stronger Purple TeamBryson Borton Mar 11, 2022The following is a guest post from Scythe CEO, Bryson Bort. For more content from Bryson, follow him on Twitter here or follow Scythe on Feedly.Companies focus too much on validating technology while ignoring that people and processes also need to be validated for cybersecurity. Security professionals don’t always explain risk correctly to business leadership who then think that the sky is always falling. A ransomware attack happening in one industry or in one type of software may not impact your business. With purple teaming, you use threat intelligence to emulate adverary behaviors so you have the context of an attack, then fix issues as you go so that you don’t need to go through a lengthy report of low-priority problems that need to be fixed.What is ‘purple teaming’?Purple teaming is a collaborative, milestone driven approach where you bring people and processes into your security assessments. Red and blue teams work together, leading to immediate and measurable improvements.Usually, we think about purple teaming in terms of tabletop exercises. You bring everyone together in a room with realistic hypothetical scenarios to prepare them and rehearse processes.Today, more companies are trying to operationalize purple teaming. They’re using purple teams for more than training. They’re using them to bring the human element back into the security process so that the tools work better.Too often, companies focus on the technology side of security and forget the importance of the human element. Attacks are complex. Attackers think about things like how a user’s ability to access a resource changes based on where they are or what privileges they have. They think about the entire attack chain, how it affects what they do, what happens next, and how it might happen.Purple teaming creates a diversity of thought within a team that brings that human element back into security.Where threat intelligence fits into purple teamingIf you’re trying to get started with purple team exercises, threat intelligence is one way to help set up real-world scenarios for your team. This way, you can build the tactics, techniques, and procedures (TTPs) that threat actors are using.A common mistake companies make is turning MITRE ATT&CK into a bingo card. Instead, think of it like the periodic table of elements. Each element represents a TTP. However, a chemical equation is a combination of elements in a certain order which is like a real attack: each step builds to the next whereas a checklist treats them in isolation. For example, if I escalated privileges, how would that change the ability to steal credentials in the next step?When you get to this point, you will actually stop tomorrow's attacks. Between different threat actors campaigns, even new ones, common intersections in TTPs tend to exist. Threat actors only innovate the minimum necessary from one campaign to another. Building your defenses by building TTPs that emulate adversary behaviors may not prevent a new campaign, but you will be able to continuously evaluate your security team capabilities and processes. Over time, this builds a stronger defensive posture.With threat intelligence, you get contextual business risk your organization faces.Cyber Threat Intelligence ResearchCyber threat intelligence (CTI) gives you information about risks to different business functions based on things like systems or geography. Large enterprises use complex CTI, including dark web activity, but companies of all sizes have access to some form of it.However, you also need to recognize that CTI is more than “just” data. It starts with data, but you need to enrich the data with context. This means asking the following questions:Is my technology stack vulnerable to these new TTPs?Are threat actors actively targeting my industry?Is my supply chain at risk?This is where bringing the human element back into the process adds value. You need the ability to define the data that impacts your organization. Once you review it, then you can use it to inform your purple team testing and validation processes.Threat ModelingCTI also gives your purple team a way to engage in meaningful threat modeling. With threat modeling, you develop the actionable model of a potential attack that could impact your business, not a general one.You start with a framework for breaking down the threat components. In this case, MITRE ATT&CK is one of the most popular ones to use. It describes threat categories and specific techniques that can be ordered as part of a threat attack logic.Think of MITRE ATT&CK like the periodic table. It gives you the basic elements that make up the attack, then you can build more complex attacks like you would with a chemical equation.If you’re just getting started with threat modeling, MITRE ATT&CK is easy to search based on industry and threat groups so that you can correlate to known campaigns.Using Threat Intelligence with Purple TeamingWhen you’re using CTI and threat modeling as part of purple teaming, you’re really doing adversary emulation. Red teaming, in general, is:Exploitation-focused“Crown-jewels or bust” mentalityHard to tell if it emulates “real-world” adversary behaviorThis finds weaknesses, but it doesn’t give you the business context that can help you strengthen your incident response processes.Using adversary emulation based on threat intelligence creates a flexible and repeatable approach so that:Red teams can emulate real-world TTPsBlue teams can validate controls and vendorsExecutives can validate investments in products and peoplePurple teaming formalizes the red and blue team joint goal of securing the organization. Using threat intelligence mapped to MITRE ATT&CK creates:A common language for everyone involvedA “Meta-Layer” for behavior that decouples technique from commandVisualizations that work well for reports over timeWith the right CTI feed, you can aggregate the information that’s unique to your business. This might be:Third-party business partnersVulnerabilitiesChanges in adversary tacticsYou can match this information to the ATT&CK MITRE framework and build out purple team exercises that help your security team take a proactive approach to threat hunting and defending.Context MattersUsing CTI is the only way that you can really understand whether a new TTP or ransomware variant impacts your company. Not every adversary will be targeting you. Not every adversary will be targeting a technology you use.Threat intelligence gives you the business context that can help you focus your activities. Purple teaming gives you the ability to test your people, processes, and technologies so that you can use threat intelligence effectively.Special thanks to Bryson Bort for this contribution to Ahead. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com"
