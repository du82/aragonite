["https://feedly.com/customers/posts/greynoise-threat-intelligence"]
title = "Case Study: GreyNoise Doubles Detection Output with Feedly | Feedly"
description = "Discover how GreyNoise used Feedly Threat Intelligence to automate OSINT workflows, double detection output, and save hours of manual effort daily."
full_description = '''Threat IntelligenceHow GreyNoise doubled detection output in a year with Feedly Threat IntelligenceHow this threat intelligence provider eliminated duplicative manual monitoring to cut out the noise, improve CVE research, and free up the capacity of a full FTE.Annie Bacheron Jan 14, 2025Results with Feedly Threat IntelligenceDoubled the amount of detections–verifiable malicious activity–in a yearFreed up the capacity of one FTE, enabling more high-impact researchFlagged or detected CVEs for exploitation faster than CISA 65% of the timeStart Free TrialTHE CUSTOMERGreyNoise provides "real-time intelligence with receipts"GreyNoise delivers real-time internet threat intelligence, enabling businesses to understand and respond to malicious activity. Through a global network of thousands of sensors, they identify and provide context for malicious IPs and traffic, helping organizations prioritize and act on threats effectively.The Security Research and Detection Engineering team focuses on creating reliable detections. The team defines a detection as verified malicious activity on the internet, and in order to be tagged as “malicious activity,” it requires proofs-of-concept (POC), exploits, or other verifiable evidence. The team is responsible for researching, locating, or developing these POCs to create detections.THE CHALLENGEManually monitoring the internet for “what’s happening” was duplicative, siloed, and inefficientBefore adopting Feedly Threat Intelligence, the Security Research and Detection Team relied on manual RSS feeds, as well as social media monitoring and a variety of other sources. Everyone had their own methods, and it frequently caused duplicative efforts. Their Slack channel often overflowed with redundant messages, making it hard to track shared intelligence. Additionally, social media became increasingly unreliable as a source of actionable information.The team nicknamed the task of monitoring the internet for relevant threats "Prairie Dog duty." Some team members loved the role, while others despised it.“We have a rotation on my team called Prairie Dog. Each day someone was the Prairie Dog, and their job for the day was to monitor news, socials, Slack, etc. instead of focusing on research”Glenn Thorpe, Senior Director of Security Research and Engineering, GreyNoiseThey needed a better way to cut through the noise and focus the firehose of information into a highly relevant stream.The team was already using a Feedly Pro+ for RSS capabilities, but decided to upgrade to the Threat Intelligence package to take full advantage of the product developed specifically for cyber threat intelligence professionals.THE SOLUTIONHyper-relevant AI Feeds, enrichment of articles, primary source for CVE dataFirst, the team meticulously customized their Feedly setup to monitor only relevant, remotely exploitable vulnerabilities. They created AI Feeds that track remotely exploitable vulnerabilities requiring low or no interaction.Another AI Feed filters for vulnerabilities with known proofs-of-concept, enabling the team to quickly identify and address high-priority threats.This AI Feed uses AI models that track critical vulnerabilities that are remotely exploitable with known POCs.By tailoring Feedly to their specific needs, the team drastically reduced time spent searching for actionable intelligence. “Before, I had to alter my day to stay on top of happenings. Now, I trust our Feedly setup to bring the right information to me via automation or high-fidelity AI Feeds,” says Glenn. “I can check in briefly, mark as read, and move on with my day.”“We consider Feedly TI our primary source for initial CVE research.”Glenn Thorpe, Senior Director of Security Research and Engineering, GreyNoiseThe Research and Detection team also uses Feedly’s Vulnerability Dashboard as a final check to ensure no critical vulnerabilities are overlooked.Analysts can personalize the dashboard to their tech stack and risk criteria, and then use it to collect real-time vulnerability intelligence from thousands of OSINT sources in one place. Feedly has become GreyNoise’s primary source for CVE research, using CVE Insights Cards as a centralized hub of enriched vulnerability data. The cards consolidate key details like proofs-of-concept availability and active exploitation. The level of contextual intelligence has been a game-changer, allowing the team to develop detections for emerging threats much faster than with manual research.CVE Insights Cards include a comprehensive view of the vulnerability and its context. THE IMPACT2x detection output in a year, zero FTE time wasted, faster than CISAIn 2023, the team made 290 detections. In 2024, after adopting Feedly Threat Intelligence, they nearly doubled their output, achieving 573 detections. They attribute this increase to a variety of strategic decisions made over the year, including their adoption of Feedly for CVE research.“It’s clear Feedly has been a big reason why we've been able to nearly double our detection output in 2024.”Glenn Thorpe, Senior Director of Security Research and Engineering, GreyNoiseHaving access to CVE Insights Cards reduced time spent tracking proofs-of-concept. Previously, a team member could easily lose a whole day if they didn’t catch a POC right when it came out. Now, the cards streamline this process, enabling faster action on high-priority vulnerabilities.With improved CVE research processes, the GreyNoise team flags or detects CVEs for exploitation before CISA 65% of the time, on average. As they continue to refine their workflows and take advantage of new features in Feedly Threat Intelligence, the team aims to increase that percentage by another 10%.Before Feedly, Glenn and his manager spent a collective four hours each day monitoring the internet — without taking action on findings. Now, they focus that time on actionable tasks, significantly increasing productivity.The team’s efficient setup eliminates the need for a full-time employee dedicated to monitoring the internet every day, allowing them to use researchers' talents more effectively. Automation ensures critical intelligence reaches them without constant manual oversight.When we started, we always needed someone to be on the lookout. Now, monitoring the internet is no longer a priority task. If something important arises, automation or Feedly brings it to us. There’s no longer a ridiculous pressure to keep up”Glenn Thorpe, Senior Director of Security Research and Engineering, GreyNoiseAccelerate CVE Research with Feedly Threat IntelligenceDiscover vulnerabilities, automate analysis, and act faster.Start Free TrialYou might also be interested inThreat Intelligencegematik reimagines OSINT: Drastically reducing manual work with Feedly Threat IntelligenceThreat IntelligenceMars conducts threat hunts at scale using Feedly Threat IntelligenceThreat IntelligenceHow Airbus CyberSecurity gets actionable cyber threat intelligence to customers in minutes'''
