["https://feedly.com/new-features/posts/top-stories-market-intelligence"]
title = "Monitor high-impact stories on topics of interest with ‘Top Stories’ | Feedly"
full_description = "Market IntelligenceMonitor high-impact stories on topics of interest with ‘Top Stories’Identify high impact stories as they breakEdwin Kon Sep 12, 202415-Second summaryDoes part of your work rely on identifying high-impact stories early?We have trained Feedly AI to continuously read and cluster articles from across the web and flag higher-impact stories that gather more coverage. We call these Top Stories.We are releasing three new features to help you identify top stories as they break. With Feedly Top Stories, you can:Filter the most impactful articles in your feeds with the new Top Stories Tab (It reduces noise by up to 87%).Detect and filter top stories across the web on your key topics—whether it's technology, cultural trends, or industry insights—with the new Top Stories AI Model.Research and document developing stories faster with Ask AI.TRY TOP STORIESHere is a tour of how Top Stories work!Filter articles in your feeds with the Top Stories TabThe Top Stories Tab filters articles within the sources you follow, showcasing only those with significant media coverage.💡 A story qualifies as a 'Top Story' when five or more sources have covered it.Top Stories Tab, discoverable in your AI Feeds, Boards, or Folders.In the example above, the Top Stories Tab filters the top 81 articles per week in a folder that collects more than 300 articles per week.Detect and filter top stories across the web with the Top Stories AI ModelYou can combine the ‘Top Stories’ AI Model with other Feedly AI Models to track the biggest headlines within topics of interest. For example, pair it with an industry or technology AI Model to quickly uncover the most impactful stories in those fields.Track the top stories related to AI In the finance industry.Using the Top Stories AI Model in your AI Feeds reduces the number of articles, focusing on key news. In the example above, it helped reduce the number of articles from 184 to 62 per week.Research and document developing stories faster with Ask AI and the Top Story Insights CardWith Ask AI, you can quickly get answers to specific questions about developing stories or summarize multiple articles into a concise report or executive summary—without needing to read each one in full.Ask AI PromptBased on this curated list of top stories of Al in the finance industry, write a synopsis ofthese articles. Highlight the 5 biggest takeaways within them.Ask AI ResponseAsk AI prompt ran on Top Stories Tab.Feedly AI creates a Top Story Insights Card for each top story it identifies. The insights card links to all the articles covering the story. It is a great place to use Ask AI to ask questions about a story or generate concise reports. In this case, we are asking for an executive summary.Ask AI prompt ran on Top Story Insights Card.Curious to learn more about Ask AI? Visit our Guide to Ask AI for Market Intelligence.How do ‘Top Stories’ work?Behind the scenes, Feedly AI continuously reads and clusters articles from across the web. Stories with coverage from 5+ sources are flagged as Top Stories.Behind the scenes of Top Stories.Outsmart the competition and stay ahead of industry shiftsCollect, analyze, and share actionable industry intelligence in real-time with a little help from AI. See for yourself with a free trial.Start Free TrialYou might also be interested inMarket IntelligenceOutsmart the competition & extract actionable insightsFundamentalsDeep-dive: Optimizing prompts for Ask AIMarket IntelligenceShare market insights easily with Automated Newsletters"
