["https://feedly.com/customers/posts/mars-threat-hunting"]
title = "Mars case study: Conducting threat hunts with Feedly | Feedly"
description = "The Mars Cyber Defense Threat Team prioritizes, plans, and conducts threat hunts at scale. Learn how they do it."
full_description = '''Threat IntelligenceMars conducts threat hunts at scale using Feedly Threat IntelligenceA guide to how Mars prioritizes, plans, and conducts threat hunts Annie Bacheron May 15, 2024THE CUSTOMERMarsMars is a family-owned business with more than $35 billion in global sales. They produce some of the world’s best-loved brands, including M&M’s®, SNICKERS®, TWIX®, MILKY WAY®, DOVE®, PEDIGREE®, ROYAL CANIN®, WHISKAS®, EXTRA®, ORBIT®, 5™, SKITTLES®, and BEN’S ORIGINAL®. The Cyber Defense Threat team carries out cyber threat detection and mitigation to protect Mars’ information assets.The short versionThe challenge: To reach their objectives of intelligently hunting and resolving threats before they cause damage, the Mars threat hunting team needs actionable cyber threat intelligence (CTI) personalized to their organization and strategic intelligence requirements. Much of this CTI comes from open source, which can be noisy and overwhelming if not filtered to their specific needs.The process: The threat-hunting team personalized their CTI in Feedly Threat Intelligence based on their priority intelligence requirements (PIRs). They continuously monitor open-source intelligence through Feedly, which then becomes a key source for hunt hypothesis generation for the rest of the threat-hunting process.The impact: The threat hunting team has been able to proactively hunt for threats to Mars. Plus, daily monitoring and analysis was cut in half.Keep reading to learn more about the Mars Cyber Defense Threat team’s methods for threat hunting. Or start a trial to explore Feedly as the source of your team’s actionable cyber threat intelligence.LEARN MORETHE CHALLENGEBe proactive and stay one step ahead of threatsThreat hunting is the process of identifying threats in an organization’s infrastructure. The Mars Cyber Defense Threat team’s mission is to “be proactive and stay one step ahead of the threat.”Cory Collins, Cyber Threat Senior Lead, lives and breathes this mission in his everyday work. He says, “We know our threats. We know the environment. And we know our adversaries.”Some teams, especially those at smaller or newer organizations, tend to get stuck in reactive cycles of responding to incidents and putting out fires. This leaves them limited time for proactive work like threat hunting.For the team at Mars, threat hunting helps them stay proactive. They aim to intelligently hunt and optimize the hunting process so they can detect threats at scale. Their goal is to reach resolutions faster.Key to success in threat hunting: defining objectives and methodologies specific to the organizationWhen the Cyber Defense Threat team was still developing their methodology, Cory remembers, “We aimed to become more sophisticated in our cybersecurity practices." When the team shifted to customize threat intelligence based on the organization's specific vision and objectives, “That's when threat hunting started to develop and mature at Mars. We started to find more impact and value from it.”At the same time, the Mars Cyber Defense Threat team was struggling with a large commercial threat intelligence platform (TIP). The TIP brought in a high volume of CTI, but it was difficult to determine which CTI was actionable to their organization.You don't need all the CTI in the world if it's actionable specifically to your company. Prioritize your CTI — think about your strategic Intel requirements.”Cory Collins, Cyber Threat Senior Lead, MarsTHE PROCESSActionable CTI personalized to the organizationOnce Mars had their strategic intel requirements and priority intel requirements (PIRs) defined, it was easier to understand exactly what kind of tool it needed to fulfill their needs.These are the Mars threat team’s six main types of threat hunts, in order of urgency, and how relevant CTI supports each type of hunt:Leadership requests: Requests from leadership are rare, but always take top priority for the threat hunting team.Active incidents: If there's an incident taking place, the threat hunting team uses Feedly to compile open-source intelligence including articles, TTPs, and IoCs, to aid the threat hunting procedures involved in that incident.Priority CTI for a major hunt: If the team finds CTI that indicates a high potential for impact, such as threat actor activities or zero-day vulnerabilities, they’ll see the news hit in Feedly, and then confirm whether it affects their or any third-party vendors’ technical stacks. First, they compile the data, including TTPs and other evidence from Feedly. Then, they perform hunt procedures on their infrastructure to make sure they’re not compromised, or that the vulnerability or control gap is being fixed inside of the Mars environment.Recurring hunts: The team conducts threat hunts in the environment for a threat actor, malware family, or a TTP. If they identify a control gap or discover they don’t currently have detection logic in place, the threat-hunting team must continually hunt for that gap until the log mechanism has been put in place for automation.CTI: Actor / TTP / Vulnerability hunt: This category of hunt involves identifying which TTPs or threat actors need to be hunted inside of the Mars environment because there isn’t existing detection logic. The threat hunting team uses new CTI that matches their threat profile and deserves attention, but doesn't have as high threat likelihood or impact as Priority CTI.Known blind spots: Based on a formula they’ve built, the threat-hunting team identifies environments that have logging capabilities, but that haven’t been threat-hunted in a long time. The team looks for tangible systemic gaps, control gaps, or evidence of compromise that hasn’t been identified before. “We just have to get in there and look for it,” says Cory.The threat-hunting team aims to spend the majority of their time focusing on known blind spots and Actor / TTP / Vulnerability threat hunts. Cory remarks “By getting in those known blind spots, our goal is to find those control gaps or security posture enhancement opportunities to prevent the incident response team from ever having an incident.”The source of information for threat hunts: Feedly Threat IntelligenceHow does Feedly fit into the Mars threat hunting process? Cory explains: “Feedly is an essential piece of tooling that ensures we can gather all the intel for a hunt so the hunt can be more successful.” Since using Feedly Threat Intelligence, it’s been easier for the Mars team to consume open-source intelligence.“Feedly is one of those tools where you can just get in there, set it up, and start consuming the information quickly.”Cory Collins, Cyber Threat Senior Lead, MarsWhen it comes to CTI, the Mars team is looking for actionable intelligence that allows them to intelligently hunt. Cory explains, “Feedly is key in aiding hunt hypothesis generation and is the source for the following hunts:Priority CTI that involves a major vulnerability we identify in Feedly through continuous monitoring.Actor / TTP / Vulnerability CTI that matches our threat profile found through continuous monitoring in Feedly.”Within a week of bringing Feedly into their workflow, the threat-hunting team was consuming valuable CTI from open sources in a single pane of glass.For Mars, these are the use cases in which Feedly is a key source of intelligence:Monitoring for new usage of TTPs of concern: They use the TTP Dashboard in Feedly to monitor threat actors of interest (based on internal intelligence analysis) and the TTPs they use. If they notice a TTP is suddenly used (after not being used for a while), they do a risk assessment against the TTPs and determine whether they have the proper detection and prevention controls in place for it.Monitoring for threat actors who are taking advantage of configuration gaps. Mars created AI Feeds related to specific threat actor behavior so they can hunt for existence of these control gaps and exploitation against them in their infrastructure.Monitoring for security incidents related to 3rd party vendors. The team also uses AI Feeds to be the first to find out about incidents or issues in their supply chain.Collecting OSINT and IoCs related to active incidents: In active incident response scenarios, the team create customs rules within Feedly to aggregate all OSINT and IoCs related to the incident to carry out a major hunt and ensure nothing is missed.The TTP dashboard allows analysts to discover trending threat actor behavior and extract key data for threat hunts. When intelligence requirements change, it’s easy for the Mars team to quickly customize their filters. Cory appreciates that “We can tune our alerting rules ourselves as well if we identify a source that is no longer providing actionable intelligence or deliverables.”He concludes, “Feedly has allowed us to stay one step ahead of the threat. It's allowed us to get the data that we need to do our job.”Examples of hunt hypotheses created using intel gathered from FeedlyThese are examples of hunt hypotheses that the threat hunting team has developed using intel gathered from Feedly Threat Intelligence. Cory says "Feedly had the right intel to execute the hunts properly."Long-lasting TCP or HTTP connection for C2 or SOCKS tunnelUnusually long URLs, where C2 traffic can be embedded within the GET parameterRegistration of a malicious app that has risky permissions assigned allowing for reading files, emails, users, etc. This can lead to exfiltration, reconnaissance, persistence, privilege escalation.The chaining of multiple RDP connections over the course of time to "jump around" in the network. Could as well be a single host which is used to connect to many endpoints. Optionally compare against Bloodhound results to find logical lateral movement/privilege escalation paths.Hunt for endpoints trying to connect to firewall or switch management ports. If these are specific ports, you can filter the sources for connections to these ports.Registration of malicious Power Automate flow to exfiltrate data via:Setting all created documents to public and forwarding the share link.Enabling e-mail forwarding.THE IMPACTHaving personalized CTI cuts monitoring time in halfWhen the amount of CTI is seemingly infinite, doing the strategic work up front can have an outsized impact on what you’re able to achieve. Know your organization’s strategic intelligence requirements, then define PIRs, and then set up your open-source intelligence based on those parameters.By customizing their CTI to their specific requirements using Feedly, the Mars Cyber Defense Threat team has been able to cut daily monitoring and analysis time in half. “Analysis time has been cut by more than 50%.”Conduct proactive threat hunts with customizable open-source intelligenceTry Feedly for Threat Intelligence to consume customized CTI relevant to your organization.START FREE TRIALYou might also be interested inThreat IntelligenceHow Secure Cyber Defense automates threat hunting with Feedly AI Threat IntelligenceGISA saved 20 hours each day by automating vulnerability monitoring with Feedly Threat IntelligenceThreat IntelligenceSopra Steria automated threat intelligence with Feedly AI — and customer support tickets “were significantly reduced”'''
