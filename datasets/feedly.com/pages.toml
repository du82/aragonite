["https://feedly.com/ti-essentials/posts/creating-a-threat-model-turning-theory-into-practice"]
title = "Creating a threat model: Turning theory into practice | TI Essentials | Feedly"
full_description = '''Threat HuntingCreating a threat model: Turning theory into practicePractical steps to building a threat model including tools and workflowsDenise Clarison Aug 29, 2024In my first blog on this topic, Essential Guide to Developing an Effective Cyber Threat Model, I talked about why you should create a threat model and some general steps you should follow. If you haven’t read that post, I highly recommend you start there.In this post, I continue the threat modeling discussion but turn to more practical examples, including using tools and processes to help you turn theory into practice.Step 1 - MappingThe prior blog discussed some ideas for mapping your organization's assets and critical systems. The goal was to help you understand which assets are the most important to protect and, therefore, better prioritize your intelligence requirements and activities.Several tools can help you map your organization’s systems to create a threat model. Some open-source tools I like to use are VisualParadigm, which provides templates dedicated to threat modeling, and draw.io, which is also used for drawing processes, network mapping, etc.A practical approach to making this process more efficient without overwhelming your map would be to look through your CMDB, identify your “high-risk” systems based on your company’s criteria, and start by adding those on the map only.Step 2 - Identifying threatsThe second step focused on understanding the threats to those assets. As you can imagine, one of the common difficulties in creating a threat model is filtering through all the noise to focus on the risks related to your organization and assets.In this example, I used Feedly to identify the threats targeting my set of assets, like so:1. Add the systems identified as “high risk” from your system ledger or CMDB to a Custom List.We start by creating a custom list of the critical assets we want to track. This list will be useful as we can reuse the Custom List for different intelligence feeds related to different threat topics, such as CVEs, threat actors, malware, TTPs, etc.2. Create an AI Feed to look for Threat Actors and New Threat Actors targeting your “high-risk systems” in your industry using the Feedly AI Models.AI Feeds are customized queries that use Feedly AI Models to search through millions of open-source articles, read them, classify, summarize, and extract key entities and objects. A best practice is to create AI Feeds aligned with your intelligence requirements. In this example, we are looking for threat actors targeting our High-Risk Systems (the custom list created in the previous step) and our industry. Check out our blog 'How to use Priority Intelligence Requirements (PIRs)' to learn more.3. Save the AI Feed and run an AI Action to extract threat actors and their TTPs from the results.The AI Feed will produce results for threat actors operating in your selected industry and targeting your selected systems. You can scan the articles to identify those you think are most relevant to your intelligence requirements or use an AI Action to synthesize the data across multiple articles and transform them into a report. In this case, we requested information about adversaries known to target the finance industry, financial systems, and extract the related TTPs.4. Gain more knowledge of the threat actors known for targeting your industry and systems.In step 3, Feedly AI found some threat actors known for targeting systems in the finance industry (Note: You can personalize to your own industry). For example, we now know that APT28 targets Microsoft Outlook with an espionage campaign. This information helps us conduct further research into the threat actor’s TTPs, previous attacks, and associated IoCs. A great place to centrally find this information for each threat actor would be the TTP Dashboard in Feedly and the Threat Actors Insights Cards.In the TTP Dashboard, you can search for your threat actor of interest to identify their TTPs, trending behavior, attack volume, and changes over time. You can also investigate the TTPs each threat actor uses in the MITRE ATT&CK Navigator to visualize and analyze their technique. This allows for a comprehensive understanding of the threat actor's methods, helping you to better anticipate and defend against potential attacks.Meanwhile, you can use the Threat Actor Insight Card to gain more information on the threat actor’s profile. Here, you can learn the threat actor’s aliases, targeted industries and geographical regions, malware used, TTPs, and exploited vulnerabilities.Step 3 - Assess your security posture & gapsBy this point, you have:Identified high-risk systems and their location in your network.Built AI Feeds on threat actors known for attacking those systems within your industry.Gathered TTPs and related IoCs used by threat actors.Continue enriching the map with the information gathered to visualize and assess your current security posture. A visual depiction of your security standing helps analyze real-world threats, understand potential vulnerabilities, and plan effective mitigation strategies.Now, it’s time to map out your organization's mitigation solutions against the identified TTPs. This allows you to visualize what defense mechanisms are in place to protect your high-critical systems from specific Threat Actors and their preferred TTPs. By mapping out the existing mitigations, you can identify the gaps in your security posture.This step involves pragmatic tasks such as reviewing the company’s documentation, runbooks and consulting with colleagues from various teams within the technology department.By the end of this step, you will have a comprehensive understanding of your organization, its systems, the threat actors likely to target it, their attack methods, and the mitigations already in place. This knowledge is crucial for identifying any gaps in your current security defenses.Now that your security posture is clear and visualized, it is time to identify and analyze its security gaps.The question that needs answering is: “What are the TTPs used by threat actors that could effectively impact my system’s Confidentiality, Integrity, and Availability (CIA), against which the company is not prepared to defend?”.Some models are ready to help you answer this question. Here, we will explore using the STRIDE model and the MITRE ATT&CK Framework to identify your security gaps.STRIDEMicrosoft developed the STRIDE model to help categorize security threats and identify gaps in an organization's security posture for each high-risk system. To assess threats and an organization’s security posture, STRIDE looks at the possibility of spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privileges.Spoofing: The absence of multi-factor authentication (MFA), paired with weak password policies, leaves the system susceptible to unauthorized access, impersonation, and spoofing attempts.Tampering: The system lacks robust data validation and encryption for data in transit, which exposes it to unauthorized access and compromises its integrity.Repudiation: The absence of comprehensive audit trails allows malicious users to manipulate the system and alter data without leaving a trace, making it difficult to hold them accountable for their actions.Information Disclosure: Unencrypted sensitive data or poor access controls allow a malicious user to access, subtract, and leak the data.Denial of Service (DoS): Insufficient DDoS protection measures might make data and services unavailable to users for an extended period.Elevation of Privilege: Poor role-based access controls result in malicious actors easily obtaining privileged access.MITRE ATT&CKThis framework is a knowledge base of adversary tactics and techniques based on real-world observations. Cybersecurity professionals use it to develop threat models and methodologies to detect and respond to cybersecurity threats. The framework allows us to better understand the TTPs used by the threat actors identified thus far.For each threat actor, the MITRE ATT&CK Framework looks at:Tactics: High-level objectives or goals of an adversary during an attack (e.g., Initial Access, Execution, Persistence).Techniques: Specific methods adversaries use to achieve their objectives (e.g., phishing, PowerShell, credential dumping).Procedures: Detailed descriptions of how adversaries implement techniques in specific scenarios.Once we have the TTPs for our known threat actors, we can use the MITRE ATT&CK Framework to identify the most effective mitigations against those TTPs and reduce the security gaps identified previously with our STRIDE model application.With 500+ TTPs, it can be difficult to map threat actors against their TTPs of choice. This is where the TTP Dashboard and the MITRE ATT&CK Navigator, discussed in step 3, come in handy.Check out our 'Introduction to MITRE ATT&CK' article for further assistance.Step 4 - Bridge the gapsNow that we know where the gaps are, let’s bridge them. Bridging security gaps requires technical solutions and addressing other human factors, such as obtaining managerial approval and funding.Implementing some technical solutions might require new cybersecurity software solutions and/or a fully-fledged project. Before presenting a case to your managerial line and decision-makers, you will need to identify and document the specific mitigation strategies and assess their viability. The MITRE ATT&CK framework offers a good outline for assessing threats and mitigation strategies; however, mapping mitigations against TTPs within the MITRE ATT&CK site can be tedious. Fortunately, using Feedly’s AI Actions helps to streamline this task.How?Once I have added all the feed results on the threat actors attacking my high-risk systems into one of my Team Boards, I run the following simple AI Action against feeds:“Identify the top techniques by the threat actors in this selection of articles. Provide the results in a table format:Column 1 - TechniqueColumn 2 - MITRE IDColumn 3 - Suggested Mitigation”The result is as follows:Now, this is just an example based on a sample dataset. In reality, you might have a more diverse threat landscape and suggested mitigations. Clearly map the mitigations identified into your mapped threat model.At this point, your Threat Model might look like something like this:Threat Modelling Templates from VisualParadigm. This model is a simplified threat model, with attack techniques written in red and mitigations written in green, both following the MITRE ATT&CK codes. (https://online.visual-paradigm.com/)Before you develop an implementation plan for your mitigations, you will need to assess and prioritize the most critical mitigation items. Not all mitigations can be implemented, mostly due to a lack of resources.Once you have identified your priority mitigation items, it is time to develop an implementation plan.Some items might be "quick wins," but mitigation will most likely require funding, tools, and managerial approval.A clear plan detailing resource requirements, risk/s being addressed, and return on investment (ROI) is critical for receiving approval.Step 5 - Continuous monitoringLet’s skip through the part where you have received approval to fund your mitigation implementation plans. Your cybersecurity, project, and engineering team worked together to implement the solutions, and the gaps identified have been bridged. What now? Are we safe?Of course not! The threat landscape is continuously evolving, and so should your threat model.Cybersecurity threats are discovered daily, and continuous monitoring and updating of your threat model can help you stay on top of your security posture and its shortcomings, reduce gaps, and keep your business safe.ConclusionIn this blog, we have meticulously outlined the essential steps for developing an effective threat model within your environment. I tried to simplify this process by providing a practical approach honed through my experience in threat intelligence. To recap, the development process involves five clear steps:MappingIdentifying threatsAssessing your security posture and identifying gapsApplying mitigationsContinuous improvementIf you found this helpful and would like to know more about threat modeling or using Feedly to help you meet your threat intelligence requirements, get in touch!You might also be interested inThreat HuntingEssential guide to developing an effective cyber threat modelPIRsHow to use Priority Intelligence Requirements (PIRs) with FeedlyMITRE ATT&CKIntroduction to MITRE ATT&CK - Featuring Version 16 (2024)'''
author = "Denise Claris"
year_published = 2024
year_updated = 2024
clearnet = "https://feedly.com/ti-essentials/posts/creating-a-threat-model-turning-theory-into-practice"
