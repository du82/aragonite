title = "CVE-2024-12824 - Exploits & Severity - Feedly"
description = "The Nokri – Job Board WordPress Theme theme for WordPress is vulnerable to privilege escalation via account takeover in all versions up to, and including, 1.6.2. This is due to the plugin not properly checking for an empty token value prior updating their details like password. This makes it possible for unauthenticated attackers to change arbitrary user's password, including administrators, and leverage that to gain access to their account.  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
full_description = "A critical vulnerability in the Nokri – Job Board WordPress Theme allows unauthenticated attackers to perform an account takeover by exploiting improper token validation during password updates. The vulnerability affects all WordPress theme versions up to and including 1.6.2. Attackers can remotely and without any user interaction change passwords for any user account, including administrator accounts. This enables complete account takeover, potentially leading to: - Full unauthorized access to WordPress site - Complete system compromise - Potential data theft or site manipulation - Unauthorized administrative control There is no evidence that a public proof-of-concept exists. There is no evidence of proof of exploitation at the moment. Patch is required. Users should immediately update the Nokri – Job Board WordPress Theme to a version beyond 1.6.2 when available. Immediate recommended actions: - Update WordPress theme to the latest version - Temporarily disable the theme if update is not immediately available - Monitor for any unauthorized account changes - Review and reset all administrative account passwords - Implement additional access controls - Enable two-factor authentication if possible"
