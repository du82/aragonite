["https://feedly.com/ti-essentials/posts/making-proactive-threat-intelligence-sustainable-in-a-post-covid-world"]
title = "Making Proactive Threat Intelligence Sustainable in a Post-COVID World | TI Essentials | Feedly"
description = "COVID-19 put cybercrime into overdrive. Now more than ever, a reactive cybersecurity strategy is inadequate and organisations need a proactive approach."
full_description = "Best PracticesMaking Proactive Threat Intelligence Sustainable in a Post-COVID WorldEnrico Frumentoon Mar 11, 2022The following is a guest post from Senior Domain Specialist in Cybersecurity at Cefriel, Dr. Enrico Frumento. For more content from Enrico, see his published research here or follow his blog on Feedly.A new wave of disruptive technological and economic changes was accelerated by the recent COVID-19 pandemic. COVID-19 has had several long-lasting direct and indirect consequences on economic ecosystems, markets and cybercrime Tactics, Technologies, and Procedures (TTPs). One significant and durable effect of COVID-19 is accelerating and forcing the digital transformation of almost any commercial sector, including those previously more conservative (e.g., building and construction).The increased number of remote workers, their delocalization and the organisation’s defence perimeter transformation are just three of the most evident consequences. Another important consequence is the change of the supply-chains dynamics because of the disruption of the supply forecasts and provisioning chains after the COVID-19 lockdowns and the changes in working habits.As a result, changes in commercial, traveling and supplying habits shortened the supply-chains, made them more resilient, and less dependent on external disruptions (e.g., lockdowns). These two effects (smart work and resilient/shorter supply-chains) impair SME&MEs by accelerating their digital transformation and fostering cybercrime in weakly secured and vulnerable areas. This is a profitable chance for cybercrime. Therefore, COVID-19 put cybercrime into overdrive, because of the multiplication of targets: vulnerable workers outside the organisation’s protected areas, working on and exchanging digital assets more frequently.As a result, SME&MEs are under economic pressure, forced to adopt a rapid digital transformation agenda operating in a weak economic context and, more than before, highly targeted by cyber criminals. For example, the IBM Cost of Data Breach report found an average time to contain (the time it takes for an organisation to resolve a situation once it has been detected and ultimately restore service) on average over 200 days.Therefore, SME&MEs need to consider efficient and sustainable defence strategies for their assets, businesses and suppliers.One of the early consequences of these trends is that it became clear how a reactive strategy is inadequate and organisations need to switch to a proactive approach to cybersecurity. This switch became urgent amidst the global pandemic and its ripple effects.What is ‘sustainable’ cybersecurity?Green computing, green IT, or ICT sustainability, is the study and implementation of technologies for the creation of environmentally sustainable IT/OT or information technology systems.However, where does cybersecurity fit in this mix? Should it be considered part of ‘green IT’? How?Sustainability in cybersecurity refers to broader concepts of processes, governance, technologies, human resources, and economics. There is no such thing as complete security; instead, effective cybersecurity means keeping estimated cyber risks under control through sustainable mitigations.Information and Communication Technology (ICT) companies are frequently the first adopters of new technologies and thus must ensure they implement ideal security safeguards into their business practises and services.Small-to-medium sized organisations especially must often consider the always challenging balance between affordable cyber risks, mitigations, operational capability, and costs. Nonetheless, the post-COVID-19 years changed the decisional landscape. Cyber risks for Micro, Small and Medium Enterprises (SME&MEs) are increasing in almost all businesses.Moving from reactive to proactive security risk management with FeedlyAll organisations, but especially the SME&MEs, need to shift from reactive to proactive security risk management, eliminate as much as possible the security ceremonies present in a company and have trustworthy and precise cyber risk estimations. KPMG in 2019 defined these steps:Step 1: Defining the BaselineStep 2: Intelligent HuntingStep 3: Protect the ServersStep 4: Find Out Attackers PlansStep 5: Sifting Through ReportsStep 6: Automating Alert ResponseStep 5, sifting through reports, is where Feedly for Threat Intelligence has come in handy at Cefriel. As reported in the KMPG report, “There is actionable threat data available through various commercial and government threat reports. Unfortunately, there are an excess of 5,800 reports generated per month in 195 unique formats.”One of the best solutions I found is having a one-stop shop like Feedly, which allows me to leverage the AI to filter through the noise and offers APIs to integrate findings into the other steps mentioned above. Feedly can import the reports, digest them, weed out redundant or irrelevant information and pass along threat data and trends to other threat intelligence and hunting systems.Implementing security practises across your organisation with security awareness trainingBeyond proactive threat hunting, the intent is always the same regarding cybersecurity: reduce the human-related risks. Human-related cyber risks include the risk of doing the wrong action (e.g., clicking on an unrecognized phishing email) or the risk of slowly reacting to a threat (e.g., IT security incident team that does not react promptly to a threat), or even the risk of not having the capabilities to respond to or foresee threats.Two other interesting applications of Feedly, in Cefriel’s experience, are for our Social Driven Vulnerability Assessments and Full Spectrum Vulnerability Assessment. Since risk cannot be eliminated, it must therefore be understood and anticipated. Anticipating the risk considers that the worst may happen and questions one’s certainties, beliefs, prejudices, ideologies, etc. Perceiving a risk means anticipating the potential disaster in the making. Feedly collects attacks, trends and latest vulnerabilities or “tricks” to create more realistic simulations of attacks entangled with the latest cybersecurity TTPs, collect some trending information about the target company, and OSINT evidence.About CefrielCefriel is a centre for digital innovation that creates and rethinks products, services and processes, participates in national and international research, and develops digital skills and culture. It has a multidisciplinary team of over 130 people with a mix of technical, business and design skills.Special thanks to Dr. Enrico Frumento for this contribution to Ahead by Feedly. To learn more about our expert contributor program, or to submit a post, contact ahead@feedly.com"
