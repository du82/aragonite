["https://feedly.com/ti-essentials/posts/how-to-collect-prority-intelligence-requirements-pirs-with-stakeholder-interviews"]
title = "How to conduct stakeholder interviews to set Priority Intelligence Requirements (PIRs) | TI Essentials | Feedly"
description = "Overview and tips on conducting stakeholder interviews and establishing priority intelligence requirements for cyber threat intelligence."
full_description = '''PIRsHow to conduct stakeholder interviews to set Priority Intelligence Requirements (PIRs)Overview and tips on conducting stakeholder interviewsJosh Darby MacLellanon Nov 02, 2023Priority Intelligence Requirements (PIRs) are designed to identify the most significant threats to an organization and align them with stakeholders’ needs for intelligence. The process of setting PIRs typically involves interviewing stakeholders from across the organization, including IT, security, legal, and business units, to gain their insights. This enables the organization to make informed decisions about how to allocate resources, implement security controls, and respond to threats.The benefits of stakeholder interviews include:Enabling the intel team to focus on gathering and analyzing the information that is most critical to the organization.Helping to ensure the organization is well-prepared to detect and respond to cyber threats, and can minimize the impact of incidents on its operations and reputation.Introducing a diversity of perspectives that can help the intel team better understand the threats, risks, and information needs of the business.Overview of the stakeholder interview process1. Identify the stakeholders: Identify the stakeholders who have a vested interest in the intelligence team's work. This can include internal teams and external stakeholders such as customers, vendors, and regulators. (Examples of internal stakeholders are included towards the end of this guide.)2. Prepare interview questions: Create a set of open-ended questions that will help you gather insights from the stakeholders about what they need from the intel team. (Example questions are provided towards the end of this guide.)3. Schedule the interviews: Reach out to the stakeholders, ensure they understand the purpose of the interviews, and schedule the interviews (at least 30 minutes per interview). We have an email template you can use to schedule interviews.4. Conduct the interviews: During the interview, ask the prepared questions and listen carefully to the stakeholders' responses. Take detailed notes and ask follow-up questions as necessary to get a better understanding of their perspectives.5. Analyze the data: After the interviews are complete, analyze the data to identify common themes, concerns, and priorities. Use this information to develop a list of priority intelligence requirements (PIRs) which can be in the form of questions in a spreadsheet. (See the Feedly PIRs Blueprint for a free resource filled with examples.)6. Share the results: Once you have identified the PIRs, share them with the stakeholders and ask for feedback. This will help to ensure that everyone is aligned on the intel team's priorities.7. Start collecting the intelligence: Using all tools, sources, platforms, vendors, and skill sets in your arsenal, start collecting the intelligence your stakeholders need, using the PIRs for guidance. Deliver the intelligence in an agreed-upon format and cadence.8. Update the PIRs: PIRs should be reviewed and updated periodically (1-4 times a year) to ensure they remain relevant and aligned with the intelligence team's goals.PIR BlueprintDownload the PIR Blueprint as an Excel file that you can modify to fit your organization.Click to DownloadStakeholder Interview Scheduling Email templateDownload the example email as a word doc.Click to DownloadTips on approaching the stakeholder interviewsPrepare efficiently: Understand the stakeholder's background and the company's objectives. Tailor your questions based on the technical knowledge of the team. For non-cyber teams, simplify terms; for technical teams, delve deeper.Build rapport: Start by introducing yourself and clarifying the interview's intent. Foster a professional yet approachable environment, emphasizing its collaborative nature.Encourage open responses: Use open-ended questions for genuine insights. Avoid leading questions. If they veer off the cyber track, consider its relevance for broader intelligence purposes.Practice active listening: Engage in their responses, taking notes and asking clarifying questions. Show genuine interest.Stay on topic: Keep the conversation on PIRs, guiding it back if it strays. If a new topic is relevant but not cyber-focused, consider its significance.Remain respectful: Value their time and knowledge. Avoid interrupting or belittling their views. Prioritize relationship-building.Recap and validate: Conclude by summarizing key points, ensuring mutual understanding of the discussed topics.Follow through: Post-interview, express gratitude via email and share any pertinent information, outlining the next PIR steps. This nurtures ongoing stakeholder involvement.Logistics of the interviewThe optimal stakeholder interview length for setting PIRs often ranges from 30-60 minutes, influenced by the organization's threat landscape and the stakeholder's insights depth. Ensure stakeholders don't feel hurried, and if needed, plan follow-up sessions.While interviews can be face-to-face or virtual, recording and transcribing them is ideal. If recording isn't preferred, consider having a second interviewer to note down responses while you lead the questioning.Download this email template to help set up stakeholder interviews.Examples of internal teams that could be interviewed include:Examples of internal teams that could be interviewed include:We don’t want to imply you must try to interview every team on this list (and it’s not an exhaustive list). Instead, we recommend prioritizing a core 2-4 teams and work your way to more stakeholders as you have capacity.Leadership and Strategy:Executive teamCSO’s officeCISO’s officeTechnical and IT Security:Vulnerability Management teamThreat Hunting teamIncident Response teamNetwork Operations teamApplication Development teamBusiness and Operations:Business Operations teamSupply Chain teamLegal, Compliance, and Risk:Legal teamCompliance teamData Privacy teamRisk Management teamCorporate Security and Fraud:Physical Security teamFraud teamHuman Resources teamInnovation and Development:Research and Development teamExample Interview QuestionsIt’s recommended you select and adapt 8-10 of the provided interview questions based on your stakeholder's relevance and your organization's culture. For non-technical teams, choose or rephrase questions for clarity, possibly defining niche cyber terms. You will gain more valuable information by ensuring your audience understands the questions asked.I. Cyber ThreatsWhat are your primary concerns related to cyber threats that could affect your team's operations?What types of cyber threats are you most worried about regarding your team's work?What are the most critical cyber threats your team should be aware of and informed about?What key indicators do you think your team needs to detect or mitigate potential cyber threats?What trends in the cyber threat or technological landscape affect your team?What are the most significant cyber threats that have impacted your team in the past, and how were these threats addressed?II. Intelligence Requirements/NeedsWhat information does your team need to effectively manage cyber threats and maintain security posture?What type of threat intelligence would be most helpful in informing your decision-making processes?What types of threat intelligence would be most valuable for your team to receive to improve its security posture?How can your team better leverage threat intelligence to stay up-to-date on the latest cyber threats?III. Asset ProtectionWhat are the most critical assets that your team needs to have protected?What are the most critical business processes or operations that your team needs to protect from cyber threats?How do you prioritize the importance of your team's different assets and operations?IV. Training, Strategy, and AwarenessWhat types of training or education would be most helpful to your team in understanding and managing cyber threats?How do you stay informed about new cyber threats and trends in the cyber threat landscape?What gaps or areas of improvement do you see in your team's current cybersecurity capabilities?How can your team better align cyber threat intelligence efforts with the overall goals and objectives of the organization?VI. Intelligence Products, Formats, and Communication PreferencesWhat types of intelligence products or reports and in what format and length would be most helpful to you in managing cyber threats?How would you ideally like to receive intelligence? E.g. via email, Slack/Teams, notifications, etc.How can the intelligence team better communicate cyber threat intelligence findings to teams within the organization?What is your ideal cadence for receiving routine/scheduled intelligence products? What is your appetite for receiving ad-hoc intelligence reports?Template Email to Schedule Stakeholder Interview:Subject: Invitation for Intelligence Stakeholder Interview: Priority Intelligence Requirements SettingDear [Stakeholder's Name],I hope this email finds you well. As part of our ongoing efforts to align our intelligence gathering with the strategic needs of the organization, our Intelligence Team is conducting a series of stakeholder interviews. The goal of these interviews is to understand and prioritize our intelligence collection in a way that best serves our internal teams’ informational needs.Your insights as a [specific role or department, e.g., "Head of Marketing" or "Supply Chain Manager"] are invaluable to this process. We would greatly appreciate the opportunity to speak with you and gather your insights on what types of intelligence you would find valuable.Proposed Details of the Interview:Date: [Proposed Date] Time: [Proposed Time] Duration: Approximately [XX] minutes Location: [Location or Video Conference Link] Agenda: Discuss your intelligence needs, challenges/risks/threats you face, topics you want more information on, ideal cadence and format of intelligence, and other areas where our team can provide more support.If the proposed date or time is not suitable for you, please let us know your availability over the next [e.g., "two weeks"], and we will do our best to accommodate.Your participation will play a pivotal role in ensuring that our intelligence efforts are targeted, relevant, and add value. We sincerely hope you can make the time to meet with us.Thank you in advance for your consideration and cooperation. We look forward to our discussion.Best regards,[Your Name] [Your Position] [Intelligence Team Name] [Contact Information]You might also be interested inPIRsHow to use Priority Intelligence Requirements (PIRs) with FeedlyPIRsTranslate your PIRs into AI FeedsPIRsDeep dive on Feedly’s PIR blueprint and how to operationalize it'''
