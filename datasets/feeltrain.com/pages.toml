["https://feeltrain.com/blog/hello-feel-train"]
title = "hello-feel-train"
full_description = '''Jul 8, 2015 From the desk of Darius Kazemi Hello Feel Train Dear Reader, I am incredibly proud to announce that Courtney Stanton and I are starting a creative technology cooperative called Feel Train. We build tech that creates dynamic and nuanced interactions between humans and computers. We eschew meme generation and instead confront people with their own humanity by putting them face to face with the inhuman. And as of today we're available for hire. So. We're a creative technology cooperative. I'll talk more about "creative technology" in a future essay, but right now I want to dive into the "cooperative" part. Feel Train is a worker-owned, cooperatively managed company. A hard limit on scale I've spent about a decade as a working professional. I've been at at half a dozen companies of various sizes, ranging from a three-person bootstrapped business to a multinational technology company with 5000 employees. I've been lucky: every company I've worked for has been a pretty good place to work overall. I've experienced a bunch of different workplace cultures and organizational structures but I've never felt comfortable with any of them, which is why we're doing something a little bit different with this new business. There are plenty of models out there for technical cooperatives, and we wanted to make sure we picked the right one for Feel Train. (For 101-level information on how a tech co-op might work, the Tech Co-op Network hosts an excellent free guide full of case studies.) One thing that Courtney and I knew from the start in our very bones: Feel Train will never consist of more than 8 people. This is a hard cap on the number of employees. With this limit in place, we no longer have to pick solutions that scale, because we literally cannot scale. We could have a different benefits or vacation package for every worker. That would be a logistical nightmare at most companies, but we'll never have to keep track of more than 8 packages. Emotionally speaking, this does wonders for me. I've had plenty of entrepreneur friends over the years. Sometimes I would hear them swear up and down, "I love our company at this size. We're going to grow slowly and carefully." Then (ideally) success hits and it becomes very difficult to say no to the prospect of doing more, and doing so by growing faster than they'd ever planned. All of a sudden, the company is bigger than they ever told themselves it would be. The work isn't fun like it used to be. I'm not a better person than my friends. If (ideally) Feel Train is successful, then I know I would say yes to growing it beyond our intentions. With this limit in place, I'll never have to tempt myself. Worker ownership I believe that labor is the source of value, which means that in order to run a just company, ownership must belong to the workers and solely to the workers. The question becomes: who owns how much? In production-based industries (factories, agriculture, etc) there are cooperative models where it's a simple matter of converting hourly labor to percent ownership. If Ayesha clocks twice as many hours as Bert, then Ayesha owns twice as much of the company as Bert. But measuring labor is tricky in a creative industry. Why it's so tricky is a huge topic outside the scope of this article, but Courtney and I have given this a lot of thought and the best answer we have is: don't measure labor. No time tracking. This means that, when it comes to ownership, we simply give it away. Ownership means equal say in every strategic decision the company makes: one worker, one vote. This solution absolutely does not scale. I couldn't imagine direct democracy working smoothly in an organization of even 20 people let alone 100 or 1,000. But it'll work for 8 people. This also means that investment does not translate to ownership. Courtney and I are investing a pretty big chunk of our savings to get Feel Train started, but this doesn't give us any special rights. The next person to join Feel Train, whoever that is, will own one third of the company. My share of the company will dilute from one half to one third, as will Courtney's. Fortunately, we don't have to worry about too much dilution. I can guarantee you that if you join Feel Train you will never own less than one eighth of the company as long as you work here. This is all just the beginning... It's a good feeling to help start a company I can feel proud of deep, deep down in my Marxist bones. And these two core principles of worker ownership and non-scalability are just the foundation. Courtney has a ton of thoughts on the management of creative workers, and she'll talk about those in the future. If you're eager to hear more about all this, sign up for our monthly mailing list!'''
year_published = 2015
clearnet = "https://feeltrain.com/blog/hello-feel-train"
