["https://www.feinternational.com/blog/verma-farms-case-study-founder-aj-agrawal-talks-e-commerce-growth-and-life-changing-exit"]
title = "Verma Farms Case Study: Founder AJ Agrawal Talks E-commerce Growth and Life Changing Exit | FE International"
description = "The team at FE International works extremely hard to exceed expectations at every turn. Over the past decade, our team has adapted and fine-tuned the marketing and acquisition process to create a proven and efficient model that gets results for buyers and sellers alike. In this video, entrepreneur AJ Agrawal shares his experience selling his e-commerce business, Verma Farms, with award-winning global M&A Advisor FE International."
full_description = "AJ Agrawal has been starting businesses ever since he can remember. From creating and selling energy drinks to his classmates in third grade to founding a successful marketing agency, his entrepreneurial spirit runs deep. Most recently, he built and sold Verma Farms for an impressive high 7-figure sum. Verma Farms is a luxury CBD health and wellness company that Agrawal built and scaled over the course of two years. By the time Agrawal decided to make his exit, Verma Farms had become a highly profitable e-commerce business in the health and wellness space. In this video, he shares why he decided to divest and details the acquisition process and his experience working with FE International. Agrawal officially entered the e-commerce and marketing space when he was 18. His first notable win was a marketing agency, Verma Media. During his seven years at Verma Media, he worked with Fortune 500 businesses and honed his marketing skills. Eventually, he decided to pursue his lifelong dream of developing his own products. “It’s something I’ve always wanted to do, but I’ve been scared to do it,” he reveals. But he took a leap of faith and dove in headfirst, founding Verma Farms. Agrawal’s first personal experience with CBD was as a sleep remedy. In college, he ran collegiate cross-country, which meant every part of his life was structured. “We had a nutritionist, a coach, a stretching coach, a weightlifting coach,” Agrawal says. Every part of his life was structured, and the routine ensured overall wellbeing. Graduation meant losing those systems of wellness, though. It was a difficult adjustment, and Agrawal struggled to maintain good sleep. Going down a journey of catching elusive sleep, he tried CBD as a remedy. CBD did so much for him that he wanted to make its benefits more accessible and widespread. “I wanted to bring this to more and more people,” Agrawal explains. And that was the inspiration for Verma Farms. Before diving into a new market and starting a business, Agrawal looks at a specific set of metrics. The biggest one is product margin. “CBD has a 90% product margin, which is exciting because you can introduce new marketing channels if you have a high product margin. You can invest into things like branding and the website,” he says."
year_published = 2023
