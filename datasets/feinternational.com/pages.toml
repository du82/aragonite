full_description = "Affiliate marketing is an online business model and advertising method where a third-party publisher (the affiliate) partners with a company and gets paid by generating traffic to said companies’ services or products. This model can become a profitable stream of revenue for someone who takes part in it. As a result, it’s a growing space, and that’s a trend that’s projected to persist. Statista reports that US affiliate marketing spending is due to reach $8.2 billion by 2022, up from the $5.4 billion recorded in 2017. As an affiliate, you’ll receive a commission for every sale made through your recommendation. Each referral that converts means money in the pocket for you as the affiliate marketer. According to ROI Collective, “Affiliates are usually paid per an action (CPA) or per lead (CPL) per their agreement with the company.” However, some affiliate programs will also reward the publisher for leads such as website clicks, downloads of an app or free-trial signups. For example, an advertiser could set up a collaboration with an affiliate who owns a blog. The blog owners will then review specific products and provide trackable referral links that take consumers to particular promotions and products. Commission rates vary based on the company and what they offer. On the lower end of the scale, you’ll see 5% of the sale, and others will offer as much as 50%. Other affiliate programs will provide a flat rate over a percentage. Thus, affiliate marketing is an excellent way to monetize views and engagement from existing followers on your website, blog, YouTube channel, app, podcast or other social media platforms. According to Shopify, affiliate programs are usually free to join, so there are no high startup costs. “Done well, this performance-based opportunity can go from side hustle to profitable online business idea by netting you a healthy income.” For affiliates, taking part in an associate marketing program allows them to become involved in e–commerce without establishing or maintaining their own store. It also provides the opportunity to monetize a website, blog or social media and earn a commission."
