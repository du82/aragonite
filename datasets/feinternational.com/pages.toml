title = "Investment Banking | FE International"
description = "Investment banking built for the middle market including M&A, private capital placement, and valuation services."
full_description = "Investment banking built for the middle market including M&A, private capital placement, and valuation services. FE Capital Markets LLC, an SEC-registered broker-dealer and FINRA member, provides full service investment banking to middle market technology transactions and investments. We are an independent firm and specialize in select technology sectors. We assist clients in acquiring public and private target businesses. We are not simply a ‘finder’; we advise clients on sourcing, strategy, and execution of their target acquisitions. We provide M&A sell-side advisory services to lower-middle-market technology businesses throughout the world. We help clients sell or divest their business or individual assets strategically and efficiently. Our team is positioned internationally to raise equity and debt capital from our network of hundreds of private equity firms, venture capital funds, family offices, commercial banks, direct lenders, high-net-worth individuals, and mezzanine funds. We help our clients secure capital and build a plan to increase shareholder value. Our professionals advise boards of directors, special committees, suitors, and targets in public merger and acquisition transactions. We help clients navigate the complexities of these transactions, from early stage strategy and tactics, to structuring, negotiation, and execution. We work with our clients’ legal counsel to advise on every element of these complex deals. Our professionals can provide an independent assessment of a company’s valuation to boards of directors, special committees, or other fiduciaries to help them make informed decisions with an understanding of the financials and fairness of a potential transaction. Our professionals can provide an independent assessment of a company’s valuation to boards of directors, special committees, or other fiduciaries to help them make informed decisions with an understanding of the financials and fairness of a potential transaction. The information on this Site is for informational purposes only, and is not an offering of or a solicitation to purchase securities or otherwise make an investment. Securities may only be offered or sold pursuant to registration of securities or an exemption therefrom using offering documents and sales of securities will be limited strictly to those persons who are qualified as defined in Regulation D promulgated under the United States Securities Act of 1933.‍The purchase of the privately placed securities of a non-public company (“Securities”) is, in general, a highly speculative investment and should be undertaken only by persons who are financially able to bear the loss of their entire investment and who have no need for liquidity of their investment in the Issuer of such Securities (“Issuer”). Such investments involve various risks relating to the nature of the financing and potentially the state and federal legalities surrounding the Issuer, the nature and stage of development of the Issuer's business, and the business sector in which it operates."
