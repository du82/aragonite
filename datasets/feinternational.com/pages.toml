["https://www.feinternational.com/blog/upright-labs-case-study-selling-an-enterprise-saas-business"]
title = "Upright Labs Case Study: Selling an Enterprise SaaS Business | FE International"
description = "It is becoming increasingly easier to sell clothes online. During the course of the pandemic, thrifting became a new habit, and it’s sticking. According to the online thrift store, thredUP, “We are in the early stages of a radical transformation in retail,” as the secondhand market is projected to double in the next five years, reaching $77 billion."
full_description = "It is becoming increasingly easier to sell clothes online. During the course of the pandemic, thrifting became a new habit, and it’s sticking. According to the online thrift store, thredUP, “We are in the early stages of a radical transformation in retail,” as the secondhand market is projected to double in the next five years, reaching $77 billion. “I think the projections are underestimated by a factor of 2-4x in terms of what the market will be worth in two to three years,” says CEO and co-founder of Upright Labs, David Engle. “We have an inside look into secondhand retailers and how much value they’re pushing through. You can look at it in five or ten years, and Upright Labs will be a massive player, and people will know the company. We’re seeing our customers grow their gross merchandise value (GMV) month over month, year over year,” he says. Together with his co-founder Jackson Geller he built Upright Labs, a SaaS company offering leading multichannel inventory management software within the secondhand retail market, powering Goodwill, Salvation Army, Habitat for Humanity and more. Its premier multichannel listing and inventory management software, Upright Lister, allows for product tracking at stores, inventory management, real-time shipping and reporting built out in a streamlined manner to reduce touchpoints and time. Upright Labs has north of 70 enterprise clients and helps these retailers make $150 million a year in e-commerce sales. Their software is in over 3,000 secondhand retail stores across the US, and clients are growing their business between 40 and 60 percent with Upright’s help. And Upright isn’t just good at making their clients successful; the company itself made seven figures in ARR in 2021 from their software alone. Their customers include secondhand retailers like Goodwill, Salvation Army salvation and Habitat for Humanity. A market that, despite global supply chain issues, is thriving. “Since we deal with secondhand, we’re seeing the opposite of the supply chain crunch: our customers are selling more and more than ever because their customers need an item and they’re willing to buy used.”"
