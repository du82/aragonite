["https://www.feinternational.com/blog/buying-an-internet-business-legal"]
title = "Buying an Internet Business - Advanced Legal | FE International"
description = "Getting the legal side of a business purchase right can mean the difference between peace of mind or potentially a lot of worry post sale, especially if things run into difficulty.We’ve written before about the basics of the asset purchase agreement (APA) but here we dig in to some of the more advanced thinking on hiring the right counsel and agreeing the best contract for the deal. To help ease your fears over contracts, we have put together this article with the help of Cliff Ennico. Cliff has been practicing law for 25 years in New York and Connecticut and specializes in small business acquisitions. He also has significant first-hand experience in advising on online business M&A."
full_description = "Getting the legal side of a business purchase right can mean the difference between peace of mind or potentially a lot of worry post sale, especially if things run into difficulty. We’ve written before about the basics of the asset purchase agreement (APA) but here we dig in to some of the more advanced thinking on hiring the right counsel and agreeing the best contract for the deal. To help ease your fears over contracts, we have put together this article with the help of Cliff Ennico. Cliff has been practicing law for 25 years in New York and Connecticut and specializes in small business acquisitions. He also has significant first-hand experience in advising on online business M&A. Hiring good counsel for a business transaction is essential and no more so than in the internet space where the intricacies of acquiring digital assets often requires web experience and creative thinking. When hiring an attorney, be sure to carefully vet their knowledge of online. Have they ever worked in the space? What precedent transactions? It’s important they understand the components of the internet business you’re looking to purchase and the considerations (for example intellectual property rights, contract assignability, domains). It’s important to note that the contract writing and agreement phase typically comes towards the end of the deal process and by then a significant amount of time and effort has been invested on both sides. Too much hassle in contract review and negotiation can be fatal to a deal and over the years we have seen a number of deals derailed by unreasonable attorney demands. Drafting the best possible APA for a transaction comes down to two broad themes, 1) ascertaining all the assets to be included and 2) seeking the right assurances from the seller. One of the primary goals of the buyer is to ensure they receive all the assets required to run the business in the same fashion as the seller, from day one. Therefore, mapping out all the elements of the business (assets, accounts, contracts, etc.) and scheduling them into the APA is key."
