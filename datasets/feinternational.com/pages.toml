["https://feinternational.com/blog/success-with-atlassian-app-development-7-tips-for-first-time-developers"]
title = "Success with Atlassian App Development: 7 Tips for First Time Developers | FE International"
description = "The use of marketplace apps is on the rise. We’re seeing this trend in the e-commerce space with increased demand for Shopify apps and in the tech space with interest in B2B SaaS products on the Atlassian Marketplace soaring. In fact, on Shopify, the vast majority of merchants (87%) rely on Shopify apps to run their businesses and 84% of apps on the Shopify marketplace have earned revenue for their owners. Meanwhile, Atlassian, experienced remarkable growth in 2020 with its stock increasing almost 100% and use of its app marketplace is growing at a fast pace. For app developers, this presents a promising opportunity to build software for the Shopify App Store and Atlassian Marketplace."
full_description = "The use of marketplace apps is on the rise. We’re seeing this trend in the e-commerce space with increased demand for Shopify apps and in the tech space with interest in B2B SaaS products on the Atlassian Marketplace soaring. In fact, on Shopify, the vast majority of merchants (87%) rely on Shopify apps to run their businesses and 84% of apps on the Shopify marketplace have earned revenue for their owners. Meanwhile, Atlassian, experienced remarkable growth in 2020 with its stock increasing almost 100% and use of its app marketplace is growing at a fast pace. For app developers, this presents a promising opportunity to build software for the Shopify App Store and Atlassian Marketplace. We spoke with Volker Schulze, CEO of Accxia, about Doublecheck for Jira, an app that “doublechecks” that the user wants to send their comment to a customer. This helps prevent internal messages from being sent to the wrong party. Volker’s team at Accxia has developed numerous apps for the Atlassian Marketplace to address customers’ needs that haven’t been met by the original software. The Atlassian Marketplace is a platform housing apps that serve as add-ons for Atlassian products. These apps enhance the functionality of Atlassian software such as Jira or Confluence and they improve the user experience. There are many perks to building and hosting an app on the Atlassian Marketplace. Atlassian has a large customer base, meaning there is a substantial sized audience ready to use the app you develop. Volker noted that Atlassian software is used by 80% of the Fortune 500. As a developer, you do not have to pay Atlassian to post your app on the marketplace and customers will be able to easily leverage your app from their product instance using the Universal Plugin Manager. Since Schulze has extensive experience with Atlassian app development, we asked him to share his advice for first-time developers. These tips apply regardless of which marketplace or app store you are building an app for but are based on his experience."
