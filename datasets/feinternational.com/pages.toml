["https://feinternational.com/blog/from-creative-director-to-successful-ecommerce-entrepreneur"]
title = "From Creative Director to Successful Entrepreneur: How This Founder Built and Sold an 8 Figure E-commerce Business. | FE International"
description = "With over 12 years of experience working in an array of creative roles for well-known TV shows and fashion brands, Miguel Gauthier naturally progressed into becoming an entrepreneur."
full_description = "With over 12 years of experience working in an array of creative roles for well-known TV shows and fashion brands, Miguel Gauthier naturally progressed into becoming an entrepreneur. Whilst working at a creative marketing agency he realized that he enjoyed brand building. From inception to launch it gave Miguel the fundamental skillset to become a successful entrepreneur. Gauthier recently exited his E-commerce business, Foxy Bae, a uniquely West Coast-based national beauty brand that has built an impressive omnichannel sales engine across its direct-to-consumer site, wholesale accounts, and Amazon. He shares how he built the business and why he decided to sell using FE International (FE). In 2017 Miguel Gauthier reviewed the hair space and spotted a common theme “I saw that every single brand out there wanted to be serious, they wanted to be upscale…there was no one saying let’s have fun”. Foxy Bae was created with a focus on a younger demographic, who wanted a company that reflected their sense of fun but also provided a salon-quality experience. Launching in October 2016 proved to be the perfect timing for Foxy Bae. A successful Holiday season created such a demand that their initial launch product sold out. Not relying on one core product, Gauthier and the team started 2017 focusing on future product development. Since then revenue grew at a rate of 87%+ while strategically cultivating a devout follower base through a vast network of over 750 influencer and affiliate partners. Foxy Bae had grown a considerable customer base, whilst adding middle and senior management into the company. The brand stood out from competitors with its strong branding, and successful marketing strategy propelling repeat sales. “They came in and did a thorough QV, an assessment, they fully reviewed our business and understood what needed to be adjusted and knew what it was worth. They were an incredible team at allowing us to accomplish our goals of a 100% successful exit”."
