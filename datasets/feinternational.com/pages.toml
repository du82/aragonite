full_description = "Fundraising is a full-time job. That’s why we partner with Funden to support the first steps in achieving your funding goals. Together, we’ll help build your strategy, perfect your pitch deck, and start making introductions to our network of over 1,000 VCs. Focus on your growth while we do the prep, research, outreach, and intros so you can keep doing what you do best. Smart money wins. We'll identify, target, and engage VCs that are strategic partners for the next phase of your startup. VCs see hundreds of deals per day. Let Funden put your outreach on auto-pilot to ensure you're winning the numbers game. Partner with our finance team to get your company valuation, projections, and financial models in order. Funden was critical to our round. Extremely worth it. They are also able to adapt as your round grows and changes. Highly, highly, recommend. We got our first meeting booked with a top gaming VC within a few days. Steve and his team were able to provide us with a great stream of introductions without compromising on quality. Funden has provided me with a steady stream of investor meetings. I’m able to focus on running Loop as opposed to spending most of my day reaching out cold to potential VCs."
