full_description = "An award-winning strategic advisor-completing transactions for technology founders, owners, and investors around the globe. Founded in 2010, FE International is an award-winning strategic advisor for technology businesses. FE’s team has completed over 1,500 transactions with a combined value of over $50 billion.‍With its headquarters in New York and locations in London, Miami, San Francisco, Warsaw, and Mumbai, FE International was named one of The Americas’ Fastest Growing Companies from 2020 to 2024 by the Financial Times and is also a four-time Inc. 5000 company. Over the years, these values have been instrumental in how we've grown, safeguarded, and strengthened FE International. They have been core to our clients' success. Aspire for exceptional performance and superior results for our clients, shareholders and communities. Hold ourselves accountable to the highest ethical standards, insisting on transparency and vigilance from our people. Lead with a service mindset, working to earn our clients’ trust and exceed their expectations by understanding their goals. Prioritize collaboration and believe in the strength of the collective, creating a culture that fosters teamwork and belonging. Empowering tech founders to transform ideas into impactful realities is at the heart of our mission. We believe in the potential of every innovation to change the world, and we're here to help turn those dreams into enduring success."
