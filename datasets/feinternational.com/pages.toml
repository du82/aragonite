["https://feinternational.com/blog/exiting-a-growing-saas-lessons-from-myshopmanager"]
title = "Exiting a Growing SaaS: Lessons from MyShopManager | FE International"
description = "Dave and Jon Dickson are the father and son duo behind MyShopManager, a highly successful SaaS tool that provides a marketing and sales solution for auto shops. As they scaled MyShopManager, their focus was on making sure the business would be attractive and sellable down the line, and in so doing, they were able to build a business with low churn and high MRR growth. Their approach paid off when they decided to exit for what they refer to as “a life-changing amount of money.”"
full_description = "Dave and Jon Dickson are the father and son duo behind MyShopManager, a highly successful SaaS tool that provides a marketing and sales solution for auto shops. As they scaled MyShopManager, their focus was on making sure the business would be attractive and sellable down the line, and in so doing, they were able to build a business with low churn and high MRR growth. Their approach paid off when they decided to exit for what they refer to as “a life-changing amount of money.” Both Dave and Jon are successful entrepreneurs with decades of experience between them when it comes to establishing, scaling, and exiting companies. Dave is knowledgeable within the automotive space, spending most of his career in the auto industry in some form. At one point, he owned an auto repair franchise with 21 locations, but his true passion was always helping other business owners grow their shops. “I took an auto repair shop, just one of them, as an owner-operator to see what it was like. The year before I got there, it did $250K in sales. The first year I was there, it did $1M, and it was easy. It was: say, please and thank you, and do what you say you’re going to do. That rapidly grew from one shop to 21 shops in less than five years. I created a franchise system and grew it,” Dave explains. Word of his success got around to other auto shop owners, who would ask him to share how he did it. Dave started consulting, running his whole operation analog – just one customer at a time. “When I got into Dave’s business, the first thing I saw that was just obvious to me was that they were doing everything by hand,” Jon says. With a background in coding, Jon was able to streamline Dave’s processes. Then he started helping their auto shop clients streamline their processes, too. “Part of Dave’s process was to ask shop owners to send customer and sales data over manually via email. The first breakthrough was when I got sick of asking the shop owners to email Excel sheets to us and said, let me just hop on your computer, let me just remote into your shop’s computer and take a look at this database behind your point-of-sale system,” Jon explains. “It turned out that they were mostly SQL databases that I was already familiar with, so I wrote a quick little program over a week or two that would just hook to their database and send me their customer data instantly.”"
year_published = 2021
