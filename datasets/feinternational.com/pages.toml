["https://feinternational.com/blog/how-one-affiliate-marketer-bootstrapped-his-way-to-success"]
title = "How One Affiliate Marketer Bootstrapped His Way to Success | FE International"
description = "Alec Rose grew up in Cork—Ireland’s second largest city. But since 2015, he’s been living in the UK where he found himself in the corporate world offering financial advice. Building websites as a side project during this period, Alec was able to pursue his online businesses full-time at the end of 2020–effectively establishing him as an accomplished affiliate marketer."
full_description = "Alec Rose grew up in Cork—Ireland’s second largest city. But since 2015, he’s been living in the UK where he found himself in the corporate world offering financial advice. Building websites as a side project during this period, Alec was able to pursue his online businesses full-time at the end of 2020–effectively establishing him as an accomplished affiliate marketer. Alec dove head-first into the world of affiliate marketing in 2017. After doing some extensive reading and research, he discovered that the RV industry would be a good, not-so-competitive niche for him to center his first website around and make his debut as an affiliate marketer. However, when Alec was creating his first website, he found himself bootstrapping; meaning, he didn’t have funds saved to help him grow and scale his RV website business. “I didn’t have enough money to pay writers at that time to outsource stuff,” Alec explains. So if you are thinking of bootstrapping, Alec recommends having an interest in the area you’re pursuing. “It becomes very difficult to write about random things, like RV showers—which I had no interest in,” he describes. Although he was able to gain a little bit of traction while doing his own writing, he couldn’t build at the scale possible with professional writers, and he wasn’t getting enough money doing his own writing to begin hiring them. If you’re going to choose a niche or industry that you don’t have a strong personal interest in, it may be more challenging to scale your business. Still, having some money saved up to outsource duties like writing gives you a better chance at creating something effective and successful. Ultimately, Alec’s RV website business was a failure. Eventually, however, he decided to create another website—one he had more of a genuine interest in—known as Today Testing. He would go on to sell this website for 6 figures in 2021 through FE International. For more information and guidance about selling an online business, check out our post on preparing your affiliate business for sale."
year_published = 2023
