["https://feinternational.com/blog/buying-an-internet-business-advanced-due-diligence"]
title = "Buying an Internet Business: Advanced Due Diligence | FE International"
description = "With an offer accepted on an internet business, attention in the buying process will move to the task of due diligence (DD). We’ve written before about how best to structure due diligence and in this article we will dig deeper into each area, giving buyers a much stronger sense on what to look for and how to go about finding it."
full_description = "With an offer accepted on an internet business, attention in the buying process will move to the task of due diligence (DD). We’ve written before about how best to structure due diligence and in this article we will dig deeper into each area, giving buyers a much stronger sense on what to look for and how to go about finding it. It is worth reiterating that some parts of the process may be considered more important by some investors than others. Equally, some will matter more for some business models versus others. Regardless of this, all aspects should at least be probed to some extent. Analyzing the traffic profile of the business is one of the first things buyers should do. The three key elements to look for are traffic 1) trends 2) concentration and 3) quality. Firstly, buyers should use Google Analytics (or whichever analytics tool has been used) to observe the trends in the overall traffic and for each channel, on a daily, monthly and annual basis. This should serve as ‘stage one’ of the traffic analysis before delving deeper on issues of interest. Naturally the desired trend is for slow and steady growth across all sources, but it is perfectly acceptable to see some sources grow and diminish in importance over time. It is important to observe spikes in the data set and carefully explore the reasons for these, asking direct questions of the seller if need be. These are all important considerations to understand. Buyers should use the following screens in GA to probe the trends data: Penalties are an important consideration too. Whilst not necessarily a deal killer, they are vital to explore for damage they may have caused and what the owner has done to rectify the solution. Google Webmaster Tools is the definitive tool for identifying a penalty but buyers should also be able to spot significant downward (or upward) changes using 3rd party tools such as FEI’s Website Penalty Indicator. With a better sense on the overall traffic trends it’s time to turn focus to traffic composition. A diverse set of traffic sources is the desirable situation but not all websites have this and it is by no means a negative trait, depending on the fundamentals underpinning each traffic source."
year_published = 2024
year_updated = 2024
