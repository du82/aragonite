["https://feinternational.com/blog/interview-selling-a-successful-saas-business"]
title = "Interview: Selling a Successful SaaS Business | FE International"
description = "Invalid addresses are a significant problem for e-commerce merchants, as they lead to a potential increase in redelivery charges, customer support costs and negative customer reviews. When he discovered this pain point, entrepreneur Wilson Lee decided to launch a solution: RoboTurk."
full_description = "Invalid addresses are a significant problem for e-commerce merchants, as they lead to a potential increase in redelivery charges, customer support costs and negative customer reviews. When he discovered this pain point, entrepreneur Wilson Lee decided to launch a solution: RoboTurk. RoboTurk is a simple and effective solution to crush address problems by preventing customers from entering invalid addresses or undeliverable addresses. “While working on one of my previous ventures, I noticed that customers often input invalid shipping addresses during the checkout process, and this created massive headaches for merchants. I thought it was a very silly problem so I built a product that fixes these invalid shipping addresses,” Lee says. He describes himself as a scrappy hacker slash product and business person. Someone who has always loved building things. “As a kid, it was Legos, as a teenager, it was Armies and Ancient Empires and as a professional, it was financial models,” Lee says. As with many entrepreneurs, Lee’s knack for business became evident early in his life. “I have been selling things ever since I was a kid in middle school. I was selling hardware products at flea markets and in high school, I was selling Yu-Gi-Oh cards and scrap metals.” Lee got his start in quantitative finance during the financial crisis in 2008, and in 2014 he went into the startup scene. “I really enjoyed building things. It’s an amazing feeling when people use a product that you put into the world and it’s an even better feeling when they pay you for it.” Initially, Lee built RoboTurk with one goal in mind: to pay for his rent in San Francisco. “I realized that RoboTurk was going to be successful when it surpassed my initial goal within the first year. I didn’t jump full-time into RoboTurk until 2019, two years after I started the project,” he says. Lee first started thinking about selling his business in 2018 while he was juggling a full-time job and a side project – it became increasingly challenging to balance the two."
year_published = 2023
