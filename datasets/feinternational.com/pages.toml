["https://www.feinternational.com/blog/uncovering-opportunities-in-the-saas-space-in-2022"]
title = "Uncovering Opportunities in the SaaS Space in 2022 | FE International"
description = "2021 was a year where the world adjusted to the new normal of the COVID-19 pandemic. There are still several places on lockdown, and much of the world faces restrictions, forcing both businesses and consumers to adjust accordingly."
full_description = "2021 was a year where the world adjusted to the new normal of the COVID-19 pandemic. There are still several places on lockdown, and much of the world faces restrictions, forcing both businesses and consumers to adjust accordingly. Business owners have always had to be conscious of both macro- and micro-economic factors when planning. With inflationary pressures and increased national debt across most developed nations, many will be making more conservative decisions in 2022 as they expect to bear some of that burden from the government, such as through higher taxes. In mid-2021, we noted that the US could raise federal tax rates for wealthy investors to as much as 43.4%. While an increase is still likely to happen, offsetting measures such as an increase in the SALT cap for US taxpayers in high-income-tax states like California and New York should help ease some of the burden. Despite the pandemic, for many in the SaaS industry, business has continued to boom. Acquirers have benefitted from historically low-interest rates and many sellers have opted to exit while the market is strong with growing multiples. Other founders and business owners have opted to grow their business more and deal with an increasing demand for remote/hybrid work, higher salary expectations and more optionality for consumers of SaaS products. This means there should still be a strong supply of excellent acquisition opportunities in 2022 and beyond as the businesses that have survived are stronger than ever. There has never been a better time in history to exit a SaaS business than today. While we do not have a crystal ball into the future, we expect 2022 to be another strong year, particularly before interest and tax rates are finally increased. At the lower end of the market, individuals are still leaving their jobs to buy businesses and, at the higher end, institutional investors and private equity firms have more capital available than ever before. In this post, we will explore trends in SaaS, how the micro-and mid-cap SaaS acquisition landscape has changed in the past 6-12 months and what we expect to see soon."
year_published = 2023
