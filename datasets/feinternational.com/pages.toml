["https://feinternational.com/blog/case-study-david-sertillange-on-seo-scaling-and-exiting-a-content-business"]
title = "Case Study: David Sertillange on SEO, Scaling and Exiting a Content Business | FE International"
description = "In 2016, entrepreneur David Sertillange founded a content site offering in-depth golf equipment reviews and high-quality content to golfing enthusiasts. With Google search rankings skyrocketing through Sertillange’s SEO best practices, the business eventually reached the turning point of success. Here he shares how he built the business, his best SEO tips and why he ultimately decided to exit."
full_description = "In 2016, entrepreneur David Sertillange founded a content site offering in-depth golf equipment reviews and high-quality content to golfing enthusiasts. With Google search rankings skyrocketing through Sertillange’s SEO best practices, the business eventually reached the turning point of success. Here he shares how he built the business, his best SEO tips and why he ultimately decided to exit. The entrepreneurial lifestyle rewards the ability to spot a business opportunity with high monetization potential and match it to your experience and skillset. Sertillange, originally from France, came from a background in business school and started a job as a technical support engineer at Silicon Valley company, Optimizely. With a passion for technology, he began working on numerous side projects. His first venture was a French website on finance and investing. Sertillange then moved on to drop shipping and e-commerce small ventures. By the time he got into English-based content websites, he was experienced in managing all the necessities of building a website as an entrepreneur. Many niches follow trends and come and go, containing only fool’s gold, but Sertillange struck real gold. In 2016, he dove into the golf niche and pushed his site to the first page of Google through dedication and alignment with SEO best practices. “I created the site because I enjoyed the technology part of the business more than the love for golf. I’m not originally a golfer, and I’ve only played it twice in my life,” Sertillange reveals. Still, with an eye for spotting monetization potential and his market research skills, Sertillange held the key to success. He saw the potential profits within the niche and understood how to get them. “I was doing all the keyword research and trying to understand the topics people were talking about in this industry. I wasn’t trying to play with techniques that may temporarily increase the rankings, but in the long run, lead to potential growth.”"
