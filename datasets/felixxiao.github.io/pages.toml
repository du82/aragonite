["https://felixxiao.github.io/2017/12/regularized-plackett-luce-ranking-model"]
title = "The Regularized Plackett-Luce Ranking Model - Undersampled - Felix Xiao"
description = '[\newcommand{\R}{\mathbb{R}} \newcommand{\Prb}{\mathbb{P}} \newcommand{\Expect}{\mathrm{E}} \newcommand{\Var}{\mathrm{Var}} \newcommand{\Cov}{\mathrm{Cov}} \newcommand{\indep}{\rotatebox[origin=c]{90}{$\models$}} \newcommand{\argmin}[1]{\underset{#1}{\mathrm{arg min}}\;} \newcommand{\argmax}[1]{\underset{#1}{\mathrm{arg max}}\;} \newcommand{\norm}[1]{\left\lVert#1\right\rVert} \newcommand{\diff}{\mathrm{d}} \DeclareMathOperator{\Tr}{Tr} \let\emptyset\varnothing]'
full_description = 'The Regularized Plackett-Luce Ranking Model Dec 30, 2017 MM algorithm ranking models regularization \[\newcommand{\R}{\mathbb{R}} \newcommand{\Prb}{\mathbb{P}} \newcommand{\Expect}{\mathrm{E}} \newcommand{\Var}{\mathrm{Var}} \newcommand{\Cov}{\mathrm{Cov}} \newcommand{\indep}{\rotatebox[origin=c]{90}{$\models$}} \newcommand{\argmin}[1]{\underset{#1}{\mathrm{arg min}}\;} \newcommand{\argmax}[1]{\underset{#1}{\mathrm{arg max}}\;} \newcommand{\norm}[1]{\left\lVert#1\right\rVert} \newcommand{\diff}{\mathrm{d}} \DeclareMathOperator{\Tr}{Tr} \let\emptyset\varnothing\] Suppose you are betting money in a horse race, and you make or lose money depending on whether you can correctly predict which horse will win first, second, or third place. Suppose further you have access to rankings from past races, e.g.: Race Horse Rank Kentucky Derby Oceancake 3 Kentucky Derby Jellyfish 1 Kentucky Derby Bureaucracy 2 Belmont Stakes Jellyfish 3 Belmont Stakes Trotty McTrotface 1 … and so on. How do you use this data to predict the results of the upcoming race? The Plackett-Luce model (or generalized Bradley-Terry model) is the most widely studied probabilistic model for rank data, favored for its mathematical simplicity and intuitive theory. The model is derived from Luce’s choice axiom, which requires that the probability of selecting one item over another is independent of all other alternatives: \[\frac{P(i | A)}{P(j | A)} = \frac{P(i | B)}{P(j | B)}\] for any sets $A$ and $B$ of available choices containing $i$ and $j$. The PL model is consistent with this axiom and states that every item in the universe of choices is associated with a nonnegative strength number $w_i$. The probability of choosing item $i$ among alteratives $A \in i$ is \[P(i | A) = \frac{w_i}{\sum_{j \in A} w_j}\] The extension to rank data can be conceptualized thus. The model generates the item ranked number one by the above distribution. For the second place item, we choose among the alternatives excluding the already-chosen item in first place. The remaining items are drawn in the same manner by excluding from the set of choices items already ranked higher. The joint probability of a ranking $i_1 \succ i_2 \succ … \succ i_m$ is \[\Prb(i_1 \succ i_2 \succ ... \succ i_m | A) = \frac{w_{i_1}}{w_{i_1} + w_{i_2} + ... + w_{i_m}} \frac{w_{i_2}}{w_{i_2} + ... + w_{i_m}} \cdots \frac{w_{i_{m-1}}}{w_{i_{m-1}} + w_{i_m}}\] Hence a single ranking of $m$ items consists of $m-1$ comparisons. Let our data $\mathcal{D} = \{(i_l, A_l)\}_{l=1}^n$ be a collection of $n$ comparisons, where the $i_l$ indicates the winner of the $l$th comparison and $A_l$ represents the set of alternatives which contains $i_l$. The log-likelihood of this data with nonnegative strengths $w$ is \[\log \mathcal{L}(w) = \sum_{l=1}^n \left( \log w_{i_l} - \log \sum_{j \in A_l} w_j \right)\] There is no closed-form expression for the strengths that maximize the likelihood. The log-likelihood function is concave after a reparametrization with $w_i = \exp(\theta_i)$. There are two types of iterative algorithms for finding its global maximizer: The well-established Minorization-Maximization algorithm presented in Hunter 2004. It operates by using a local approximation function to the log-likelihood that has an analytic maximizer and alternates between constructing an approximation function at the current point and maximizing it to get the next point. A more recent spectral algorithm based on the stationary distribution of a Markov chain illustrated in Maystre and Grossglauser 2015 Both of these two varieties of algorithms work only when the comparison data meets a particular regularity condition – Assumption 1 of Hunter 2004: In every possible partition of the [set of choices] into two nonempty subsets, some [item] in the second set beats some [item] in the ﬁrst set at least once. For example, if there is a strict subset of the choices that are never compared with any choices outside of themselves, then Plackett-Luce cannot infer strength parameters for the whole set. Or, if there are any items that win every single comparison or lose every comparison, then this assumption is also violated. We will refer to Assumption 1 as the strongly connected components assumption, since it is equivalent to the directed graph of comparisons being strongly connected (see Maystre 2015 for details). This turns out to be inconvenient for many real-world data sets. The 2002 NASCAR data set that Hunter 2004 uses, for instance, violates the assumption – the set of drivers had to be cut down to make inference work. Guiver and Snelson 2009 proposed a Bayesian version of Plackett-Luce that handles this issue. Using a Gamma-distributed prior on the choice strengths that pulls their values to be closer to one another, their method no longer requires the regularity condition. In this blog post, I will present a frequentist version of a regularized Plackett-Luce model that extends the MM algorithm of Hunter. The extended algorithm, which to my knowledge does not yet exist in the literature, maximizes the PL log-likelihood plus a tunable penalty term that encourages the optimal choice strengths to be close to one another. The penalized log-likelihood is \[\mathcal{l}_\alpha (w) = \sum_{l=1}^n \left( \log w_{i_l} - \log \sum_{j \in A_l} w_j \right) +\alpha \sum_{k=1}^m \log w_k\] for $\alpha \geq 0$ and $ \sum_{k=1}^m w_k = 1 $. Without the equality constraint on the $w_k$, the problem becomes unbounded – the objective can always be increased by multiplying the current $w$ by a scalar greater than 1. To see why the $\sum_{k=1}^m \log w_k$ term encourages the strengths to be closer together, see the below plot of the level sets of $\log w_1 + \log w_2$ for $m = 2$. The line segment represents the feasible set of $w$ given by the equality and nonnegative constraints. The level sets that intersect the line segment closer to its mid point have higher function values. It is interesting to note that this penalized log-likelihood formulation is equivalent to Bayesian inference of the Plackett-Luce model with a symmetric Dirichlet prior on the choice strengths. The sum of $\log$ functional form of the regularization term is ideal in this case because it both preserves the concavity of the (re-parametrized) objective function and lends itself to optimization by the same MM algorithm as in the unpenalized case. There are two ways to extend the MM algorithm: using the method of Lagrange multipliers in the maximization step and adding a normalizing term to the objective to make it bounded. Solving the Lagrangian with a Newton subroutine Following the technique in Hunter 2004, we obtain the following minorization of the penalized likelihood: \[Q(w | w^{(k)}) = \sum_{l=1}^n \left( \log w_{i_l} - \frac{\sum_{j \in A_l} w_j}{\sum_{j \in A_l} w_j^{(k)}} \right) + \alpha \sum_{k=1}^m \log w_k\] It is easy to see that $Q(w | w^{(k)})$, plus a constant not depending on $w$, satisfies the required properties. $ Q(w^{(k)} | w^{(k)}) + C = \mathcal{l}_\alpha (w^{(k)}) $ $ Q(w | w^{(k)}) + C \leq \mathcal{l}_\alpha (w) $ Taking partial derivatives of the Lagrangian of $Q(w | w^{(k)})$ with respect to $w_k$ gets us the update equation \[w_j^{(k+1)} = \frac{c_j + \alpha}{d_j^{(k)} + \lambda}\] where $\lambda$ is the Lagrange multiplier associated with the sum-to-one constraint, $c_j$ is the number of comparisons item $j$ won in and \[d_j^{(k)} = \sum_{l : j \in A_l} \frac{1}{\sum_{i \in A_l} w_i^{(k)}}\] To find the value of the Lagrange multiplier, apply the sum-to-one constraint and use Newton’s method to find a root of \[g(\lambda) = - 1 + \sum_{j=1}^m \frac{c_j + \alpha}{d_j^{(k)} + \lambda}\] with $\lambda$ initialized to 0. In the interval $(- \min_j d_j, \infty)$, $g$ is continuous and strictly monotonically decreasing. Since its limit at $- \min_j d_j$ and $\infty$ are $+ \infty$ and -1 respectively, the intermediate value theorem implies there is a unique $\lambda$ in this interval satisfying $g(\lambda) = 0$. Newton’s method works well in this case because the first derivative of $g$ is continuous and never zero in this interval. Adding a normalizing term Rather than finding the Lagrange multiplier at each iteration, we can modify the objective function by adding a normalizing term that makes it bounded and removes the need for the equality constraint. \[\mathcal{l}_\alpha (w) = \sum_{l=1}^n \left( \log w_{i_l} - \log \sum_{j \in A_l} w_j \right) +\alpha \sum_{k=1}^m \left( \log w_k - \log \sum_{j=1}^m w_j \right)\] The optimal solution of this unconstrained problem, after dividing by its sum, equals the optimal solution of the above constrained problem. This also shows that this penalized likelihood is equivalent to giving each item a win against every other item in a comparison weighted by $\alpha$. We apply the same minorization technique as before. The update equations for the strengths are: \[w_i^{(k+1)} = \frac{c_i + \alpha}{d_j^{(k)} + \alpha / \bar{w}}\] Where $\bar{w}$ is the mean of the $w$. Empirically, this method converges faster than the Lagrange multiplier method and we will adopt it going forward. Computing a regularization path using warm-starts Each value of $\alpha$ will give us a different set of optimal $w$ and inferred ranking of the items. To select our final $\alpha$, it is useful to see how the weights evolve as the penalty term changes. To make the task of inferring the strengths for a range of penalty coefficients easier, we employed a warm-start approach that uses the optimal $w$ computed for one $\alpha$ as the initialization point of the MM algorithm to solve for a slightly different $\alpha$. Given an $\alpha$ sequence $0 = \alpha_0 < \alpha_1 < … < \alpha_T$ and set of comparisons ${(i_l, A_l)}_1^n$: function PL_regularization_path: w[T+1] = [1, ..., 1] For t = T, T-1, ..., 0: find w[t] iteratively using MM update equations initialized at w[t+1] with penalty a[t] For t = 0, ..., T: w[t] = w[t] / sum(w[t]) Return w Results We apply our PL regularization path algorithm to the 2002 NASCAR dataset used in Hunter 2004, Guiver and Snelson 2009 for penalty parameters ranging from $\alpha = 0.1$ to $\alpha = 5$ (the case of $\alpha = 0$ is unbounded because the data violates the strongly connected assumption). This shows the inferred strength of each of the 87 contestants for varying $\alpha$. Plotting the strengths on a log-scale shows rank-crossing on the lower-ranked contestants. These are the ranks implied by the strengths. The ranks are much less stable in the bottom half of the contestants. The top 26 do not change rank in the entire path, while the middle and lower ranked drivers switch ranks very frequently. Previous Nov 18, 2017 « Natural Selection pt. 3 Jan 24, 2018 Next The Brownian Bridge Joint Max Position Distribution »'
