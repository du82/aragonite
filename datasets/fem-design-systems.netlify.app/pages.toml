["https://fem-design-systems.netlify.app/css-specificity"]
title = "Introduction to Design Systems"
description = "This course will teach you how to design, build, and document your design system."
full_description = 'CSS specificityThere are three buckets of CSS specificity: Type selectors and pseudo-elements Class selectors, attribute selectors, and pseudo-classes ID selectors /* Type selectors and pseudo-elements */ h1 { ...; } h1::before { ...; } /* Class selectors, attribute selectors, and pseudo-classes */ .cat { ...; } input[type="radio"] { ...; } h1:hover { ...; } /* ID selectors */ #cat { ...; } Universal selectors, such as *, combinators, such as > and +, and negation of pseudo-classes, such as :not() have no effect on CSS specificity (however the styles inside of the not() pseudo-class do). Inline styling, styles added directly to the HTML element, will always override any styles declared in an external stylesheet and this is generally bad practice. Lastly, !important statements override all styling.Previous sectionNext section'
