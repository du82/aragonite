["https://fem-design-systems.netlify.app/tips-for-creating-micro-interactions"]
title = "Introduction to Design Systems"
description = "This course will teach you how to design, build, and document your design system."
full_description = "Tips for creating micro-interactionsBefore you build your first micro-interaction, here are a few tips Accessibility Users won’t care about the coolest micro-interaction in the world if it’s not accessible. If the interaction indicates state change, ensure that the proper HTML elements and attributes are used; otherwise, add the appropriate WAI-ARIA counterparts. Intentionality Animations draw the user’s attention, but not all information has the same level of importance. First understand which component on the page has the most pertinent or time sensitive information or priority, and then decide what to animate. Relatability Our goal is to create animations which feel natural and fluid, not robotic and linear. Try to mimic the physics of the real world when designing and developing micro-interactions. Performance Never make your users wait for an animation to complete if their page or data is ready.Previous sectionNext section"
