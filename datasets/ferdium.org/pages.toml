full_description = "Homebrew (macOS)brew tap ferdium/ferdium # to install the latest stable release: brew install ferdium # or for beta pre-releases: brew install ferdium-beta # or for nightly pre-releases: brew install ferdium-nightly Scoop (Windows)scoop bucket add versions # to install the latest nightly pre-releases: scoop install ferdium-nightly Chocolatey (Windows)# to install the latest stable release: choco install ferdium # or for beta pre-releases: choco install ferdium --pre Winget (Windows)# to install the latest stable release: winget install ferdium # or for beta pre-releases: winget install ferdium-beta # or for nightly pre-releases: winget install ferdium-nightly Snap (Ubuntu linux and derivatives)# to install the latest stable release: snap install ferdium # or for beta pre-releases: snap install ferdium --beta # or for nightly pre-releases: snap install ferdium --edge # connect additional interfaces: snap connect ferdium:camera snap connect ferdium:audio-record"
year_published = 2025
