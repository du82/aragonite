["https://ferdium.org/faq"]
title = ""
full_description = '''Even though Ferdium code is signed through the appropriate certificates, some warnings may still appear.On MacOS:Any app that has been downloaded from internet will give you a warning asking you to confirm its opening. You can read on that popup that the app has been checked for malware by Apple which did not find any. This means that the software has been submitted to Apple as part of the build process to be notarized. You can thus safely ignore this warning and open the app.On Windows:You might see the Windows SmartScreen appear, telling you that "Windows protected your PC" by preventing an unrecognised app from starting. You have the option to click on "More Info" which will display the app name as well as the publisher name. Verify that the app is indeed "Ferdium" and that Publisher corresponds to "Ambroise Grau" (more details below). You can then safely click on "Run anyway" and use the app. If you inadvertently clicked on "Don't run", you won't be presented with SmartScreen another time. You can however right-click on the executable to go into the file's properties and tick the "Unblock" box at the bottom of the window, which will allow its execution by double-click once again. Since Ferdium is not recognised as a legal entity, it is not possible to obtain certificates under the organisation's name. For this reason, the certificates to sign releases for both MacOS and Windows have been taken under the personal name of one of the project maintainers, namely "Ambroise Grau". This is the name that should appear when verifying the certificate or the publisher name of the software. All the assets are named under the following convention: `Ferdium-<target_os>[-<os_option>]-<version_with_channel>[-<target_arch>].<extension>`. More precisely for the different OS, you should choose the file appropriately as follows:For MacOS:You first need to know if you are using a computer running one of the intel chip or one of the more recent arm chip (developed only by Apple and called M1 or M2). If you do not know it, check the value in `Menu->About this Mac`. If you have an arm chip you need to look for the assets that contain `arm64` in their name. There are then two choices: the first one is to download the appropriate file named `Ferdium-mac-bundle-6.x.x*.zip` which will unzip to give you the application directly; whilst the second choice is to get the file `Ferdium-mac-6.x.x*.dmg` which will mount and allow you to drag the application into your `Applications` folder. Both options are valid (though using the dmg is recommended) as long as you make sure to take the asset corresponding to your processor.For Windows:There are 2 types of assets that can be downloaded to get Ferdium on Windows:The automatic installer (recommended): assets named `Ferdium-win-AutoSetup-6.x.x*.exe`. These executables will install Ferdium and all its configuration into the AppData\Local folder without prompt. The portable version: corresponds to the asset named `Ferdium-win-Portable-6.x.x*.exe`. This is a standalone application that will create the configuration folder in the folder where the executable lies instead of storing it into AppData. For both of these, there are assets corresponding to the specific architectures (names ending with `-ia32.exe` for 32bits, `-x64.exe` for 64bits, or `-arm64.exe` for arm) which only contain the given architecture. If you are unsure which one is best for you, you can download the universal version (the asset name which does not include architecture tag between the version and `.exe`). This executable includes everything to run on all architectures, which means it will be heavier, but will always work as expected. If you are running the installer, it will install only for the correct architecture, and you will be able to delete the installer file afterwards.For Linux:The `Ferdium-6.x.x-*.AppImage` is a binary that can be executed immediately and that does not necessitate any installation. Alongside this, there are multiple package files for different types of Linux distributions, such as `.freebsd`, `.rpm` and `.deb` (the latter having multiple available architecture). All of these configure their local configuration into the home folder.For any developer that wants to build from source, the code is also directly available for each release the app can be built simply by running the appropriate scripts found in the `script` folder (assuming that the environment has been set up correctly).'''
year_published = 2025
clearnet = "https://ferdium.org/faq"
tags = ['"ambroise', '"ferdium"?', "account", "accountless", "alongside", "amongst", "anymore", "appropriate", "asset", "assets"]
