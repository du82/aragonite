["https://ferdium.org/contact"]
title = "Ferdium | Contact and support"
description = "Introducing a great productivity tool to keep all messaging, productivity, and online services in one place"
full_description = "Contact and supportHaving issues with Ferdium? We can help you out!Ferdium, like any open source project, is maintained by a bunch of volunteers. If you are having some issues with the software, you can always try to contact the team. The easiest way to do this, is by joining our Discord server.If you have found a bug in the Ferdium application itself, or have an idea for a possible improvement, open an issue on the GitHub bug tracker. When doing so, be sure to follow the guidelines in the description of the new issue when creating it. In case of any questions, come and chat in Discord and we'll gladly help you.If you wish to participate in the Ferdium project, you are always welcome to join. We can use help in the areas of application development, website design and development, or even just people willing to test Ferdium and report issues they've found. You are free to create a pull request on GitHub and we will evaluate it."
