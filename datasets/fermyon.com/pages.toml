title = "Announcing Advent of Spin 2024"
description = "Announcing Advent of Spin 2024 - A fun coding challenge to learn Spin and Serverless WebAssembly"
full_description = "Back Blog community December 02, 2024 Announcing Advent of Spin 2024 Thorsten Hans advent of spin coding challenge It’s a holiday cheer 🎄! We can’t believe it’s already the end of this year and the holidays are right around the corner for 2024. With the holiday season approaching, we’re excited to announce this year’s Advent of Spin 2024 at Fermyon 🎅🏽! If you’re a newcomer to Fermyon or Wasm or serverless applications, Advent of Spin is a great way to get yourself acclimated to Spin and our other open-source tools. We will be releasing four coding challenges that will help you learn more about what you can create and deploy with WebAssembly and Spin. We’ve introduced many new updates this year, especially with Spin 3.0, Selective Deployments, OpenTelemetry (OTel), and more. With all of these new advancements, we’re eager to see participants dive deeper into these new features with our coding challenges! How To Play? Head over to the Fermyon Advent of Spin repo on GitHub and follow the instructions to get started. Make sure to read all of the guidelines for each challenge and submit your solution to this Typeform page for each challenge. Note: The window for each challenge closes end of day on Sunday. Participants will have one week to complete each challenge, and each challenge will be released on Mondays at 5pm CET. Starting December 9th, we’ll solve each previous week’s challenge live on YouTube during Fermyon Live. Prizes Of course we’ll have some amazing prizes again 🎁. Everyone who successfully completes a challenge can opt-in to win a Fermyon Spin Swag package ✨. As always, we’ll also have awards for a few special categories. Past Challenges Not sure where to start or need more practice? We have past challenges and a Summer of Spin event that happened this year that you can access. The validation endpoints still work! Advent of Spin GitHub repo Advent of Spin 2023 Live Code Tuesday Stream Summer of Spin GitHub repo Summer of Spin video solutions Nobody Must Code Alone! Tackling new features and concepts shouldn’t be done alone. We encourage you to work on these challenges with our community here at Fermyon! Come hang out, ask questions, and collaborate with other developers in the Fermyon Discord server. It’s a great way to hear about other projects and to gain inspiration for what you can create and deploy with Spin. We’ll also be posting on X/Twitter and LinkedIn, dropping some helpful resources and videos. Our coding challenges are also an exciting way to solve problems and learn new technologies, and we look forward to seeing what you can create on your own! If you have a project you’re passionate about, let the community know on Discord. We’re so excited to see your submissions for this year’s Advent of Spin 2024 and what you end up building with Spin."
