full_description = "All Announcements Community Product Updates How-to Guides WebAssembly Introduction to WebAssembly on the Cloud WebAssembly may have started as a browser technology, but it has moved outward. One hugely promising space for WebAssembly is in the cloud. Its security, speed, size, and flexibility make it a great basis for building cloud services. Wasm.Builders: The Site for Learning WebAssembly Introducing a new community for sharing WebAssembly news and information Is WebAssembly Susceptible to Log4Shell-style Attacks? The recent Log4j attack provides an opportunity to talk about that characteristic and see why WebAssembly is resistant to this kind of attack. Scripting Languages and Compiled Languages in WebAssembly The promise of WebAssembly is that it can be a common runtime for all sorts of languages. But there are differences between how we traditionally write in scripting languages (JavaScript, Python, Ruby) versus compiled languages (C/C++, Go, Rust). In this post, we survey the WebAssembly landscape to see what is happening along these fronts. Containers vs. WebAssembly: What's the Difference? It is common to hear WebAssembly compared to Docker Containers (or OCI Containers). What's the difference? We look at the key differences between Wasm and Docker Containers. Rethinking Microservices Microservices are serving us well in many ways. But in some ways, we can do better. Will microservices v2 be powered by WebAssembly? How to Think About WebAssembly (Amid the Hype) What is WebAssembly? Is it the JavaScript killer or a performance tool for the browser? Is it a replacement for Docker? Or a clone of Java? Or is it a better eBPF? Lots of ideas are swirling. So let's get to the heart of the matter. Why LibreOffice in WebAssembly is a Big Deal LibreOffice in WebAssembly (LOWA) is a promising project. But more exciting is what this new project demonstrates about the WebAssembly ecosystem. Introducing Bartholomew Fermyon is proud to introduce our new lightweight WebAssembly (Wasm) content management system (CMS) that we call Bartholomew. With support for handlebars templates, custom scripted functions, and markdown, it's a svelte way to run a CMS. Hello World We're Fermyon, and we are building the third wave of compute with WebAssembly. Previous Page Next page 1 … 14 15 🔥 Recommended Posts Introducing SpinKube and Fermyon Platform for Kubernetes Enabling first-class support for running Wasm apps in Kubernetes means more efficient, and dramatically less costly compute... The Next Generation of Serverless is Happening The term “serverless” is used ambiguously, so let’s start off with a specific definition. Serverless apps are applications that are... Stay in the loop! Get updates sent to your email inbox or RSS."
