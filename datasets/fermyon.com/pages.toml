full_description = "Home Legal Cookie Policy Cookie Policy Last Updated: September 7, 2022 This Cookie Policy (“ Cookie Policy“) describes how Fermyon Technologies, Inc. and its subsidiaries and affiliates (” Fermyon Technologies“, “ us”, “ we“, or “ our”) use cookies and similar technologies in connection with the websites and platforms we operate that link to this Cookie Policy (collectively, the “ Website“) to provide, improve, promote, and protect the Website and as otherwise described below. Where personal information is collected by Fermyon Technologies, such collection is covered by our Privacy Policy, available here. We may update this Cookie Policy from time to time in order to reflect, for example, changes to the cookies we use or for other operational, legal, or regulatory reasons. Please re-visit this Cookie Policy regularly to stay informed about our use of cookies and related technologies. What is a cookie? A cookie is a small piece of text sent to your browser when you visit the Website. It serves a variety of functions, like enabling us to remember certain information you provide to us as you navigate between pages on the Website. Each cookie expires after a certain period of time depending on what we use it for. Cookies are useful because they help us make your experience on the Site more enjoyable. They allow us to recognize your device (e.g., your laptop or mobile device) so that we can tailor your experience. Why do we use cookies? We use first-party and third-party cookies for several reasons, such as letting you navigate between pages efficiently, remembering your preferences, letting us analyze how well our Website is performing, improving your experience, and helping us advertise our business. Some cookies are required for technical reasons in order for our Website to operate. Other cookies enable us and the advertising partners we work with to track and target the interests of visitors to our Website and across other sites and services. For example, we use cookies to tailor content and information that we may send or display to you and otherwise personalize your experience while interacting with our Website and to otherwise improve the functionality of the services we provide. Third parties also serve cookies through our Website for advertising, analytics, and other purposes. This is described in more detail below. What cookies do we use? Essential These cookies are strictly necessary to provide you with the Website and to use some of its features, such as access to secure areas. Because these cookies are strictly necessary to deliver the Website, you cannot refuse them without impacting how our Website functions. You may be able to block or delete essential cookies by changing your browser settings. For example, we may use first-party essential cookies to facilitate logging into your account on the Website. Performance and Analytics, Personalization, and Security These cookies help us analyze how the Website is being accessed and used, enable us to track performance, and secure the Website. For example, we use cookies to get insights regarding users and Website performance, such as page speed or to help us customize our Website for you in order to enhance your experience. Examples of performance and analytics, personalization, and security cookies we may use include the following services: Cookies Google Analytics/Google Tag Manager YouTube You can learn more about Google Analytics cookies by clicking here and about how Google protects your data by clicking here. To opt-out of Google Analytics, you can download and install the Google Analytics Opt-out Browser Add-on, available here. Targeting or Advertising Cookies These cookies are used to make advertising messages more relevant to you and your interests. We sometimes use cookies delivered by third parties to track the performance of our advertisements. For example, these cookies remember which browsers have visited our Website. This process helps us