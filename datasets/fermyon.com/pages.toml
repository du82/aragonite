full_description = "Home Legal Privacy Policy Privacy Policy Last Updated: September 7, 2022 This Privacy Policy (“ Privacy Policy“) describes how Fermyon Technologies, Inc. and its subsidiaries and affiliates (” Fermyon“, “ us”, “ we“, or “ our”) may collect, use, and share your personal information in connection with www.fermyon.com and any other websites and platforms we own and operate that link to this Privacy Policy (collectively, the “ Website“) Fermyon’s cloud-based WebAssembly service made available through Fermyon’s proprietary platform (the “ Platform”), and our related services, events, social media pages, and email and other electronic communications (collectively, and together with the Website and the Platform, the “ Offerings“), and the choices you have with respect to your personal information. This Privacy Policy does not apply to personal information that we may store or maintain on behalf of the users of our Platform, where applicable. Fermyon reserves the right, at any time, to modify this Privacy Policy. If we modify how we collect, use, or share personal information, we will post the updated Privacy Policy on this page. In some cases, such as where required by law, we may notify you about an update by sending you an email, posting a notice about the update on the Offerings, or other means. In all cases, your continued use of the Offerings following posting or other notification of changes constitutes your acknowledgement of such changes. Please review this Privacy Policy periodically to keep up to date on our most current policies and practices. This Privacy Policy covers the following topics: COLLECTION OF PERSONAL INFORMATION USE OF PERSONAL INFORMATION SHARING OF PERSONAL INFORMATION SECURITY OF PERSONAL INFORMATION TRANSFER OF PERSONAL INFORMATION YOUR CHOICES NOTICE TO CALIFORNIA RESIDENTS (SHINE THE LIGHT LAW) NOTICE TO NEVADA RESIDENTS NOTICE TO EUROPEAN USERS OTHER SITES AND SERVICES CHILDREN’S PRIVACY CONTACTING US COLLECTION OF PERSONAL INFORMATION Personal Information Collected. Personal information that we may collect about you includes: Contact details , such as your first and last name, email and mailing addresses, social media handle(s), and phone number. Account information , such as your log-in details, information that you store in your account, and other details about your use of the Offerings. Professional information , such as the name of the company you work for and its location, company description and job title, and company email and phone. Order history , such as information about products, solutions, and services you use or have used. Payment information , such as your debit or credit card details, financial account information, billing address, and order information. Communications , such as information associated with your requests or inquiries, including for support, assistance, or order information; interaction data that we exchange or observe through your use of our Offerings, community forums, social media; and any questions, feedback, or otherwise that you provide when you contact us. Contributions , such as your pull requests, issues opened, comments, and other commentary or content that you provide. Online activity information , such as the website you visited before browsing to our Website or Platform, pages or screens you viewed, how long you spent on a page or screen, navigation paths between pages or screens, information about your activity on a page or screen, access times, and duration of access. Device information and other online identifiers , such as your computer or mobile device operating system type and version number, wireless carrier, manufacturer and model, browser type, screen resolution, IP address, unique identifiers, and general location information such as city, state, or geographic area. Preferences , such as any preferences you set in your account and any preferences for receiving communications about our Offerings, activities, events, and publications. Survey responses , such as the information you provide in response to our surveys and questionnaires. Other information that we may collect which is not specifically listed here, which we will use as described in this Privacy Policy or as otherwise disclosed at the time of collection. Unless we specifically request it, we ask that you not provide us with any sensitive personal information (e.g., information related to racial or ethnic origin, political opinions, religion or other beliefs, health, biometrics or genetic characteristics, criminal background or trade union membership) on or through the Offerings, or otherwise to us. Sources of Personal Information. We obtain personal information from a variety of sources, including the following sources: Personal Information You Provide. Fermyon collects personal information when you voluntarily submit it to us, such as when you fill out a form on the Website, register for an account, or communicate with us. Personal Information Automatically Collected. Fermyon, our service providers, and our advertising partners may automatically log information about you, your computer, or mobile device, and your activity over time on our Offerings and other sites and online services, such as the online activity information and device information listed above. Like many online services, we use cookies and similar technologies to facilitate some of the automatic data collection described above, such as: Cookies , which are text files that websites store on a visitor’s device to uniquely identify the visitor’s browser or to store information or settings in the browser for the purpose of helping you navigate between pages efficiently, remembering your preferences, enabling functionality, helping us understand user activity and patterns, and facilitating online advertising. Flash cookies , or locally-stored objects, which are used on websites for purposes similar to cookies but allow storage of a larger amount of data. Web beacons , also known as pixel tags or clear GIFs, which are typically used to demonstrate that a webpage or email was accessed or opened, or that certain content was viewed or clicked, typically to compile statistics about usage of websites and the success of marketing campaigns. For more information, please visit our Cookie Policy. Personal Information Obtained from Third Parties. Fermyon may receive personal information from third parties, such as our service providers, advertising partners, social media platforms, event sponsors, publicly available sources, or data providers. We may merge or combine such personal information with the personal information we collect from you directly or automatically. Referrals. Users of the Offerings may have the opportunity to refer colleagues or other contacts to us and share their contact information. Please do not provide us with someone’s contact information unless you have their permission to do so. USE OF PERSONAL INFORMATION Fermyon’s primary purpose in collecting personal information is to provide the Offerings that you request. We also use personal information for the purposes set forth below and as otherwise described in this Privacy Policy or at the time of collection. To Provide the Offerings. We may use personal information to provide our Offerings. For example, we use personal information to: process your requests for selecting and purchasing products and services; establish, manage, monitor, and maintain your account on the Website or the Platform; improve and personalize your experience on or with the Offerings; verify your identity or determine your eligibility for offers and promotions; communicate with you, including responding to any of your requests, feedback, or questions; provide maintenance and support; and send you materials, updates, information, special offers, and promotional material from us, other users, and our business partners. Research and Development. We use personal information for research and development purposes, including to study and improve the Offerings and our business, understand and analyze the usage trends and preferences of our users, and develop new features, functionality, products, and services. As part of these activities, we may create aggregated, de-identified, or other anonymous data from personal information we collect. We make personal information into anonymous data by removing information that makes the data personally identifiable to you. We may use this anonymous data and share it with third parties for our lawful business purposes. Direct Marketing. We may send you Fermyon-related or other direct marketing communications as permitted by law. You may opt-out of our marketing communications as described in the “YOUR CHOICES” section below. Interest-Based Advertising. We work with third-party advertising companies and social media companies to help us advertise our business and to display ads for our products and services. These companies may use cookies and similar technologies to collect information about you (including the online activity information and device information described above in the section called “Personal Information Automatically Collected”) over time across our Offerings and other websites and services or your interaction with our emails, and use that information to serve ads that they think will interest you. In addition, some of these companies may use hashed customer lists that we share with them to deliver ads to you and to similar users on their platforms. You can learn more about your choices for limiting interest-based advertising in the “YOUR CHOICES” section below. To Comply with Laws and Regulations. We will use personal information as we believe necessary or appropriate to comply with applicable laws, lawful requests, and legal process, such as to respond to subpoenas or requests from government authorities. For Compliance, Fraud Prevention, and Safety. We may use personal information and disclose it to law enforcement, government authorities, and private parties as we believe necessary or appropriate to: (a) maintain the safety, security, and integrity of the Offerings and our products and services, business, databases, and other technology assets; (b) protect our, your, or others’ rights, privacy, safety or property (including by making and defending legal claims); (c) audit our internal processes for compliance with legal and contractual requirements and internal policies; (d) enforce the terms and conditions that govern the Offerings; and (e) prevent, identify, investigate, and deter fraudulent, harmful, unauthorized, unethical or illegal activity, including cyberattacks and identity theft. With Your Consent. In some cases, we may specifically ask you for your consent to collect, use, or share your personal information, such as when required by law. SHARING OF PERSONAL INFORMATION In addition to the specific situations discussed elsewhere in this Privacy Policy or at the point of collection, Fermyon may share your personal information with the following entities or persons: Related Companies. We may share your personal information with our affiliates, subsidiaries, and other related companies. Professional Advisors. We may share personal information with persons, companies, or professional firms providing Fermyon with advice and consulting in accounting, administrative, legal, tax, financial, debt collection, and other matters. Law Enforcement. Under certain circumstances, we may be required to disclose personal information to law enforcement, government authorities, and other parties if required to do so by law or in response to valid requests by public authorities (e.g., a court or a government agency). Compliance. We may disclose personal information in the good faith belief that such action is necessary to comply with a legal obligation or for the purposes described above in the section titled “Compliance, Fraud Prevention, and Safety.” Service Providers. We may share your personal information with third parties who perform services on our behalf that are necessary for the orderly operation of our business. For example, we work with service providers that help us perform website hosting, maintenance services, database management, analytics, fraud protection, marketing, customer relationship management, finances, developer relations management, and other purposes. Advertising Partners. We may also share personal information with third parties who we partner with for advertising campaigns or that collect information about your activity on the Offerings for the purposes described in the “Interest-Based Advertising” section above. Business Transaction Participants. We may disclose personal information to third parties in connection with any business transaction (or potential transaction) involving a merger, acquisition, sale of shares or assets, financing, acquisition, consolidation, reorganization, divestiture, or dissolution of all or a portion of our business (including in connection with a bankruptcy or similar proceedings). SECURITY OF PERSONAL INFORMATION No method of transmission over the Internet, or method of electronic storage, is fully secure. While we use reasonable efforts to protect your personal information from the risks presented by unauthorized access or acquisition, we cannot guarantee the security of your personal information. TRANSFER OF PERSONAL INFORMATION Fermyon is based in the United States, and we have service providers in the United States and potentially other countries. Your personal information may be collected, used, and stored in these countries or other locations outside of your home country. Privacy laws in the locations where we handle your personal information may not be as protective as the privacy laws in your home country. By providing your personal information, where applicable law permits, you specifically and expressly consent to such transfer and processing and the collection, use, and disclosure set forth herein. Users located in Europe can view more information about cross-border transfers in the section below titled “Notice to European Users.” YOUR CHOICES You can make the following choices regarding your personal information: Review and Request Changes to Your Personal Information. We rely on you to update and correct the personal information contained in your account. Note that we may keep historical information in our backup files as permitted by law. If the Website or Platform does not permit you to update or correct certain personal information, please submit a request to us using the contact information listed at the end of this Privacy Policy. Promotional Emails. You may opt-out of marketing-related emails by clicking the “unsubscribe” link at the bottom of the email or by contacting us as described below. You may still receive service-related communications, such as those about your account, to fulfill orders for offers you have requested, or deliver notifications directly t"
