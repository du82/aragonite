["https://fermyon.com/blog/announcing-spin-hub"]
title = "More Ways to Deploy via the Spin Hub"
description = "Check out some changes we’ve made to the Spin Hub (formerly known as Spin Up Hub) and some new templates & samples that have been added by our community members."
full_description = "Back Blog community August 29, 2024 More Ways to Deploy via the Spin Hub Jasmine Mae Alindayu spin up hub templates samples spinkube cloud community Announcing Spin Hub! As some of you already know, Fermyon has developer.fermyon.com/hub where you can get creative and see what kind of applications you can create with Spin. Formerly known as Spin Up Hub, we’ve decided to rebrand the name to Spin Hub. We’re also proud to show you some UI improvements we’ve made on the Spin Hub webpage. Thanks to one of our engineering interns, Vamshi, the Spin Hub webpage has a new feature that allows you to deploy templates or samples to Kubernetes using SpinKube for Bring Your Own Infra or Fermyon Cloud 🚀 for a fully managed, serverless experience. UI Improvements - Deploying Without The Hassle When you land on the Spin Hub page, you’ll be able to see some noticeable differences right away: For the top three highlighted templates/samples, we added visualizations to help guide you through the application topology, making it that much easier for you to start dreaming up your next project with Spin. Once you click on any of the top three highlighted templates/samples, you’ll be directed to a page. Can you tell what’s new…? If you’re a frequent visitor of the Spin Hub, then you might be familiar with our “Deploy to Cloud” button we used to have. Now you have the option to deploy a Spin application to Kubernetes using SpinKube or to the Fermyon Cloud. We are so excited for you to try out this new feature and learn more about the new open source project we’ve been working on, SpinKube. These UI implementations are not the only new changes to the Spin Hub. You can personalize your experience to seamlessly integrate with your color theme of choice now that Spin Hub supports light/dark mode: Here is what the light version looks like: Check Out These New Templates/Samples/Plugin! Check out these three new additions to the Spin Hub! Spin Jekyll — Created by engineering intern, Vamshi Reddy Interested in learning Jekyll for static websites and blogs using Spin? Check out this template using Ruby! Rust Code Bot — Created by engineering intern, Rohit Dandamudi This is a fun sample where you can learn Rust and the Code Llama LLM using Fermyon’s serverless AI. Spin OTel Plugin — One of the main projects that engineering intern, Andrew Steurer, worked on this summer Lastly, we’re excited for you to check out this plugin with Spin to export metrics and trace data. The plugin contains dashboards for viewing OTel data."
