title = "Serverless Apps on the Edge"
description = "Running code on the edge has become a recent trend. Can serverless join the edge revolution?"
full_description = "Browse Chapters Serverless Apps on the Edge Much ado has been made about edge computing, but just like the term “serverless,” the term “edge” has more than one definition. This chapter focuses on serverless apps on the edge. And to start, we’re going to need a few more clarifying definitions. There are at least three definitions of “Edge” circulating. For the most part, these definitions specify exactly how far away from the data center the edge computing is located. While these are frequently each called “edge”, we can add a qualifier to denote distance. This gives us: Near edge Far edge IoT edge After defining those, the guide will delve into use cases for near-, far-, and IoT-edge. Browse Chapters"
