description = "The Fermyon Blog has the latest information about Fermyon and our projects."
full_description = "All Announcements Community Product Updates How-to Guides WebAssembly Shrink Your TinyGo WebAssembly Modules by 60% Cutting down on the size of a Wasm binary has advantages for performance and transfer speed. This post covers some tricks for reducing the size of Go code projects when compiled to WebAssembly with TinyGo Accessing external APIs from Spin applications Come learn how you can leverage experimental Spin features to enable outbound HTTP support Scheduling WebAssembly-backed services with Spin and Nomad Come learn how to run WebAssembly-backed services with Nomad and Spin Come learn how we use Bartholomew @ WasmDay EU 2022 This May 16th, our founders will be presenting speaking a WasmDay EU in Valencia, Spain about how we implmented a WebAssembly CMS Matt Butcher @ DockerCon May 10, 2022 This May 10th, Matt Butcher will be virtually presenting Containers and WebAssembly at DockerCon 2022. Running .NET in WebAssembly C# and other .NET languages can now be compiled to Wasm. In this post, we show how to run cloud-side .NET in a WebAssembly runtime. Wasm, WASI, Wagi: What are they? Any new technology comes with a litany of new terminology. WebAssembly is no different. In this post, we take a look at how Wasm (short for WebAssembly), WASI (the WebAssembly System Interface) and Wagi (WebAssembly Gateway Interface) work together. The Fermyon Spin framework makes use of all three of these. WebAssembly Languages With WebAssembly gaining momentum, a new breed of WebAssembly-specific languages have arrived on the scene. In this post we cover a few of these, including Grain and AssemblyScript Writing a WebAssembly Service in TinyGo for Wagi and Spin Of the growing list of WebAssembly capable programming languages, Go is one of our favorites. In this post, we build a real (but tiny) service with TinyGo. What is Bindle Bindle is the silverware drawer for Wasm objects. It provides an efficient and flexible packaging system for component-based applications that have variable dependencies. 5 Fun Wasm Projects (that you might not have known about) In this post, we're going to explore some of our favorite WebAssembly projects that you may not have heard of before Come join the Fermyon Discord community! Come join a thriving community of passionate WebAssembly engineers and thought leaders where you can learn about current and upcoming Fermyon projects The Scale to Zero Problem Rather than run an application all the time, what if we could only start it when it was needed, and thus avoid the cloud cost of running unused services? This was the idea behind scale-to-zero. WebAssembly has an answer. Why the Bytecode Alliance is important to the Wasm ecosystem For any ecosystem to grow, it's important for standards to be implemented that establish trust with users within the community. This is the motivation behind the Bytecode Alliance, a non-profit standards setting organization devoted to building secure-by-default software. Introducing Spin Spin is our new, open source WebAssembly framework - for building, distributing, and running WebAssembly apps. A Reckoning for Serverless Serverless did not quite live up to its promise. But why? Partly, it was never well-defined. Also, the vision overreached the technology available at the time. But things are different now. Has serverless failed or is it about to hit a renaissance? Running Python in WebAssembly Python can now be compiled to Wasm. In this post, we show how to run cloud-side Python in a WebAssembly runtime. Previous Page Next page 1 … 13 14 15 🔥 Recommended Posts Introducing SpinKube and Fermyon Platform for Kubernetes Enabling first-class support for running Wasm apps in Kubernetes means more efficient, and dramatically less costly compute... The Next Generation of Serverless is Happening The term “serverless” is used ambiguously, so let’s start off with a specific definition. Serverless apps are applications that are... Stay in the loop! Get updates sent to your email inbox or RSS."
