full_description = "All Announcements Community Product Updates How-to Guides WebAssembly Stream Data from Linode Object Storage using the AWS S3 SDK Learn how to stream data from Linode Object Storage using the AWS S3 SDK in a Spin application. This tutorial walks through setup, implementation, and deployment of a Spin app written in TypeScript that streams and transforms files. Chrome for Developers: Thorsten Hans talks with Thomas Steiner Our Senior Cloud Advocate, Thorsten Hans, joined Thomas Steiner on episode at Chrome for Developers - exploring the world of WebAssembly serverless functions and microservices. Spin Joins CNCF Sandbox: Strengthening Adoption and Benefits for Organizations and Developers Spin has been accepted in the CNCF Sandbox. This milestone brings many benefits to the Spin ecosystem. Software Bill of Materials (SBOM) for your Spin Apps Learn how to create SBOMs for Spin apps, meet regulatory requirements, and secure your software supply chain with open-source tools like Trivy Advent of Spin 2024 Wrap-up Wrapping up Advent of Spin 2024 - Looking back at the fun coding challenges to help you learn Spin and Serverless WebAssembly What Isn't A PaaS The promise of PaaS is that developers can build an app, and then deploy it without having to do any additional infrastructure configuration. But a few recent tools claim to be PaaS, yet force developers to do infrastructure engineering. These tools are not actually PaaSes. The 2024 Highlights One year closes, and another one opens. Here are some of our highlights from 2024 -- and a hint about what's coming in 2025. Scaling Spin Apps With KEDA Learn how to scale Spin apps on Kubernetes with SpinKube and KEDA. Explore event-driven autoscaling using AWS SQS queues to optimize resource usage and enhance application efficiency. Using SpinKube on Kairos A guide showing how to install the SpinKube bundle on Kairos You Are Already Using Wasm In Production I am often surprised when I hear folks ask, “When will WebAssembly be ready for production?” There seems to be some lurking suspicion that something is holding WebAssembly back. Announcing Advent of Spin 2024 Announcing Advent of Spin 2024 - A fun coding challenge to learn Spin and Serverless WebAssembly Observing Spin Apps with OpenTelemetry and the .NET Aspire Dashboard Learn how to observe your Spin apps using the otel plugin for Spin and the .NET Aspire Dashboard. Spin gh - Generate GitHub Actions for your Spin Apps in seconds Get started using the Spin CLI gh plugin to easily generate GitHub Actions for your Spin Apps Spin Selective Deployments: A Leap Forward for Distributed Applications Compose a single codebase (even in multiple languages). Edit it in one project. Compile it with one build command. Introducing Spin 3.0 The latest major release of Spin is here - with new features like Component Dependencies, Selective Deployments, Otel Integration, and Spin Factors. WebAssembly Jobs and CronJobs in Kubernetes with SpinKube & the Spin Command Trigger Learn how to run WebAssembly apps as Kubernetes Jobs and CronJobs using Spin Command Trigger and SpinKube Lightweight Kubernetes and Wasm is a Perfect Combo Squeeze more out of your lower-powered hardware with lightweight Kubernetes distros and SpinKube Previous Page Next page 1 2 … 15 🔥 Recommended Posts Introducing SpinKube and Fermyon Platform for Kubernetes Enabling first-class support for running Wasm apps in Kubernetes means more efficient, and dramatically less costly compute... The Next Generation of Serverless is Happening The term “serverless” is used ambiguously, so let’s start off with a specific definition. Serverless apps are applications that are... Stay in the loop! Get updates sent to your email inbox or RSS."
