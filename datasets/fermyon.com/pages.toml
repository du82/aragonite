["https://fermyon.com/blog/2024-highlights"]
title = "The 2024 Highlights"
description = "One year closes, and another one opens. Here are some of our highlights from 2024 -- and a hint about what's coming in 2025."
full_description = "Back Blog industry December 26, 2024 The 2024 Highlights Matt Butcher spin fermyon hub community Happy New Year, Fermyon Friends! If 2024 was any indication, then 2025 will be another fantastic year. Here are some of last year’s highlights. Spin passed 250,000 downloads, while the SpinKube operator was downloaded over 80,000 times (even though we just introduced it in March). Unsurprisingly, our two most popular blog posts were the one announcing Spin 3 and the one announcing SpinKube. In March, Fermyon joined ZEISS and Microsoft on the KubeCon keynote stage to talk about how Wasm serverless functions can scale instantly and cut operational cost. Top 3 Languages Used in Fermyon Cloud Rust JavaScript/TypeScript Python 8 Awesome Community Posts We are open source developers to the core, and that means that we delight in collaborations. Here are some of the community collaborations we did this year. Use Spin and Open Telemetry (OTEL) Use Spin with AWS Kensis Build and deploy HTMX apps with Spin Run SpinKube on Kairos Power your GitOps workflow with Spin and Flux Run Spin apps on Rancher Desktop Integrate Spin with Azure services, with Azure Cache, and with AKS And early this year, running Spin apps on OpenShift Top 3 Spin Hub examples Create a simple checklist app with Key Value storage and a static fileserver Build an AI-assisted news reader with RSS and Fermyon Serverless AI Get started with Spin and the Zola framework Noisiest KubeCon booth (MQTT demo winner) At KubeCon, we built a fun noise detecting app that ran on tiny computers at multiple booths inside the Salt Lake City expo hall. So who had the noisiest booth? Ampere! Located beneath a big speaker, the Ampere booth picked up the most noise in the conference hall. SourceAverage Volume Akamai272.8675282714055 Ampere468.65720761559385 Fermyon317.80028819981857 Microsoft235.34998301053346 So long, 2024. Hello, 2025! This year we introduced SpinKube, released a major update to Spin, and got to experience some truly remarkable moments as we saw what you all are building atop serverless WebAssembly. We are looking forward to the New Year. We’ve certainly got a lot in the works, and are looking forward to sharing some big news at KubeCon London!"
