orage Bandwidth (egress) Region deployments Need higher limits? Need more support? Contact our team to discuss tailor-made requirements for your needs. Community Discord Documentation Email support Contact our team to discuss advanced support needs. Contact Sales Share Your Thoughts We would love to hear your feedback on the subscription tiers. Drop us a note. Our team can help define the perfect plan for your teams’ needs. Contact Sales Pricing FAQs What is Fermyon? Fermyon is leading the next wave of cloud computing with the first cloud native WebAssembly FaaS that lets developers build better serverless apps faster. Fermyon is focused on empowering cloud developers to quickly realize the things they are thinking about creating and focus on the code that brings value instead of the obligatory foundation code. Fermyon was founded by the Deis Labs team at Microsoft Azure and is backed by Insight Partners and Amplify Partners. What is Spin? Spin is the developer tool for building WebAssembly microservices and web applications. This easy-to-use and intuitive framework provides a way for developers to quickly compose serverless applications. Learn more at https://www.fermyon.com/spin What is Fermyon Cloud? Fermyon Cloud ensure that developers can deploy applications and instantly have a secure, publicly available deployment. After you create, build, and test your Spin developed applications locally, you can deploy it to Fermyon Cloud to see these applications live. Fermyon Cloud's dashboard enables you to see the apps you are running, examine logs, and monitor apps over time. Learn more at https://www.fermyon.com/cloud Is there a time limit for the Starter tier? No, the Starter tier is not time-bound. Is there a limit to the number of applications I can use? Yes. Starter tier allows up to 5 applications. How many applications can I run in Fermyon Cloud Growth tier? Up to 100. Where can I find the documentation on how to get started? Visit the Quickstart guide here. For