title = "Meet the Fermyon Team"
description = "The developer tool that simplifies composing and running apps with Wasm."
full_description = '''Our Team Meet the members of team Fermyon. We’re a distributed organization, working remotely to build the next wave of cloud computing. About Contact Press Team Values Become an Insider Our Team Meet the members of team Fermyon. We’re a distributed organization, working remotely to build the next wave of cloud computing. Adam Reese Adam Reynolds Alex Crichton Brian Hardock Caleb Schoepp Danielle Lancashire Diane Sampson Ivan Towlson Joel Dice Karthik Ganeshram Kate Goldenring Lann Martin MacKenzie Olson Matt Butcher Matt Fisher Michelle Dhanani Mikkel Mørk Hegnhøj Radu Matei Ronan Flynn-Curran Ryan Levick Thorsten Hans Till Schneidereit Tim Enwall Vaughn Dice Chat Adam Reese is a founder of Fermyon. He contributes to WebAssembly projects such as Bindle, Wagi, and Hippo. Before Fermyon he was on the DeisLabs research and development team at Microsoft Azure, where he was a core maintainer for projects like Helm and Brigade. Close Adam is the Head of Human Performance at Fermyon. He is a high-performance coach, trainer, facilitator, and conflict mediator. He is the creator of several courses on leadership, accountability, decision making, and productivity. He contributes to Fermyon in team coaching, training design & delivery, hiring best practices, and management training. Adam is also supporting the development of a healthy culture at Fermyon and ensuring that employees feel empowered to uphold the culture they have created. Adam’s history is filled with personal development adventures and teaching experiences. He was on the faculty of NLP Comprehensive and The Academy of Coaching and NLP. He holds a professional coach certification from the International Coach Federation. He has been coaching for over two decades and teaching for nearly 30 years. Adam enjoys playing soccer competitively, mountain biking, hiking, and skiing. He lives in Boulder, CO. Close Alex is a software engineer at Fermyon who works on Wasmtime and the implementation of the WebAssembly component model when he’s not otherwise building Legos or playing FFXIV. Close Brian Hardock is a founder of Fermyon. He is currently focused on Spin and Bindle, as well as other WebAssembly projects. Before Fermyon he was on the DeisLabs research and development team at Microsoft Azure, where he was a core maintainer for Helm and other projects. Brian lives in Pennsylvania. Close Caleb Schoepp is a software engineer at Fermyon. Before working at Fermyon he interned at Microsoft three times on different teams and at the startups UnifyID and Resemble AI. Caleb has experience building on public clouds, mobile apps, full stack web applications, and machine learning integrations among other things. Outside of work he enjoys playing guitar, spending time with family, and learning to play hockey. Caleb lives in Edmonton, Alberta. Close Danielle Lancashire is principal software engineer at Fermyon. She is super passionate about bringing clarity to distributed systems and infrastructure. She works on a variety of OSS projects - most notably the Kubelet. In the past she’s worked on Nomad at HashiCorp, Kubernetes + vSphere at VMware, and the build platform at CircleCI. Outside of development she currently serves on the Kubernetes Code of Conduct committee, loves to ride bikes, and film photography. Close Diane’s background includes being a financial research account manager, bookkeeper, tax preparer, health enthusiast, and mom. She has managed relationships with major financial services companies, been an office manager for a health club/fitness facility, consulted to an accounting/tax preparation firm, and raised three sons. In addition to her work at Fermyon, she volunteers as a tax preparer for the low income and elderly. She enjoys exercise, yoga, and spending time with her family. Close Ivan Towlson is a founder of Fermyon. His projects include VS Code Kubernetes Tools, yo wasm, Hippo and Wagi. Close Joel Dice is a software engineer at Fermyon, currently focused on Spin. He has a background in distributed systems, compilers, language runtimes, and real-time communications. He’s the primary developer of Avian, an embeddable Java virtual machine. Outside of work, he tutors high school math students on a weekly basis and frequents the playgrounds of Denver, Colorado with his wife and two sons. Close Karthik Ganeshram is a software engineer at Fermyon. He is originally from India and currently lives in Seattle. When away from the computer, he enjoys going on bicycle rides, playing football(soccer) and cooking. Close Kate Goldenring is a software engineer at Fermyon. Kate is drawn to building the best of what’s to come. When not thinking about the next wave of cloud computing with WebAssembly, she engages in discussions around computing on the edge, currently serving as co-chair of the CNCF IoT Edge Working Group. Before Fermyon, Kate worked at Microsoft, focusing on initiatives around running Kubernetes on the edge and maintaining Akri. She is an outdoor-enthusiast, constantly finding new ways to adventure with nature in the Pacific Northwest. Close Lann Martin is a software engineer at Fermyon. He is currently working on Spin and previously worked on Chrome OS. Lann lives in Pittsburgh, Pennsylvania. Close MacKenzie is a senior product manager at Fermyon. She has considerable product management experience at Microsoft working on Cloud Native products such as Azure Service Fabric, Azure Container Instances and Azure Virtual Nodes. With her Informatics background, MacKenzie brings a blend of data-driven decision making and customer empathy into her work with product. She is interested in building products to strengthen the technical and operational relationship between developers and operators agnostic of scale and environment. You can find MacKenzie out hiking in the rugged mountain trails in her home state of Washington. Close Matt Butcher is co-founder and CEO of Fermyon, the serverless WebAssembly in the cloud company. He is one of the original creators of Helm, Brigade, CNAB, OAM, Glide, and Krustlet. He has written or co-written many books, including Learning Helm and Go in Practice. He is a co-creator of the Illustrated Children’s Guide to Kubernetes series. These days, he works mostly on WebAssembly projects such as Spin, Fermyon Cloud and Bartholomew. He holds a Ph.D. in Philosophy. He lives in Colorado, where he drinks lots of coffee. Close Matt Fisher is a founder of Fermyon. He contributes to several open source projects, most notably Hippo and krustlet. Before Fermyon, he was on the DeisLabs research and development team at Microsoft, maintaining projects like Helm, Draft, Duffle, and Deis Workflow. Outside of work, he enjoys camping, playing board games, calligraphy, and playing guitar. He lives in British Columbia, Canada. Close Michelle Dhanani is a founder of Fermyon. Currently, amongst many other things, Michelle contributes to Spin. While at Microsoft, Michelle was a core maintainer of Open Service Mesh and Service Mesh Interface. She has also been a core maintainer for projects like Helm and Draft. In addition to coding, Michelle has given many keynote talks at KubeCon, and also served on the CNCF Governing Board. Michelle lives in Atlanta, GA. Close Mikkel Mørk Hegnhøj is leading the product and developer relationship team at Fermyon. He has a long background in product management, customer success, and developer engagement at Microsoft, working on products such as Service Fabric, Azure Kubernetes Services, Azure Container Instances, and the open-source project Virtual Kubelet. He’s passionate about developer and operator experiences, with a mission to make the path from idea to reality frictionless and quick. Mikkel lives in a tiny and beautiful village in Denmark. Close Radu Matei is a founder and CTO of Fermyon. He is passionate about WebAssembly, distributed systems, and artificial intelligence, and in the past he worked at Microsoft Azure in the DeisLabs research and development team, where he was a core maintainer for multiple server-side WebAssembly and distributed systems projects like Krustlet, Draft, Brigade, or the Cloud Native Application Bundle project (building the distribution and security specifications). He is an avid learner, loves classical music, and enjoys a good bicycle ride and bubble tea. Close Ronan Flynn-Curran is a founding member of Fermyon. A designer and developer, Ronan works on branding, design and software projects. Before Fermyon, he worked as part of the Deis Labs team at Microsoft, contributing to projects like Helm, Brigade, Open Service Mesh, Porter, Krustlet and Hippo. Originally from Ireland, he now lives in California. Close Ryan is a principal software engineer at Fermyon. He’s originally from the United States but lives in Berlin, Germany with his partner, Lisa. Besides working on Spin, Fermyon Cloud and other Fermyon software, Ryan is a member of the Rust programming language Project as a member of the leadership council and Rust Foundation Board. In his free time, he enjoys singing, cooking (or is it just eating…), and traveling. Close Thorsten is a Cloud Advocate at Fermyon. He leverages his background as a software engineer and consultant to empower developers in navigating and embracing emerging technologies. With a passion for bridging technical concepts and practical application, Thorsten drives innovation while fostering work-life balance through activities like running, biking, and spending time with his family. Thorsten lives in Germany. Close Till Schneidereit is a Software Engineer at Fermyon, in addition to TSC & co-founder of the Bytecode Alliance. TC39 and Mozilla alum. Close Currently Executive Chairman at Fermyon. Previous operating executive of a 50-person/$5M revenue company (Solista, CEO. acquired by Gartner), a 200-person/$20M revenue company (Tendril now Uplight, CEO/COO/CIO, currently valued at $1.2B), a 30-person venture-backed smart home company (Revolv, CEO, acquired by Google), and a 45-person personal robotics company (Misty Robotics, CEO, acquired by Furhat Robotics). Head of Strategy at Nest Labs, a unit of Google / Alphabet. Career started at Apple (almost 10 years). Angel investor in 11 startup companies. Mentor to award-winning startups including Snap-a-Bug (Techstars ’10), SimpleEnergy (Techstars ’11), LinkCycle (MIT Cleantech ’11), Mobiplug/Revolv (Techstars ’12) and Ludela (Techstars ’19). Winner of Boulder County Esprit Award Entrepreneur of the Year (2012). Career Goal: To build great businesses through passion, focused and disciplined business management, people leadership and the installment of “Top 10 Percentile High Performance Culture” philosophies. Tim holds a BS in EECS and lives in Boulder, CO. Close Vaughn Dice is a founding member of Fermyon. Currently, he is contributing to the WebAssembly projects of Bindle and Wagi and learning how to run and manage workloads on Nomad. Before Fermyon, he worked as part of the Deis Labs team at Microsoft, acting as a core maintainer on Brigade and Porter, as well as contributing to projects like Helm, CNAB and others. Close very mysterious ► // temporarily disable a submit button untiil filled var formElement = document.getElementById("form"); var buttonElement = document.getElementById("button"); formElement.addEventListener("botpoison-challenge-start", function () { buttonElement.setAttribute("disabled", "disabled"); }); formElement.addEventListener("botpoison-challenge-success", function () { buttonElement.removeAttribute("disabled"); }); formElement.addEventListener("botpoison-challenge-error", function () { buttonElement.removeAttribute("disabled"); }); var randomize = document.querySelector('.rtc-wrapper .is-ancestor'); for (var i = randomize.children.length; i >= 0; i--) { randomize.appendChild(randomize.children[Math.random() * i | 0]); } var bradybunch = document.getElementById('bradybunch'); bradybunch.innerHTML = bradybunch.innerHTML +="<figure class=\"tile is-2 huh\"><a class=\"add\" href=\"https://webrtc-710y28h9.fermyon.app/teameasteregg\" target=\"_blank\" aria-haspopup=\"true\"><p>➕</p></a></figure>"; const autoChat = document.getElementById("chatWrapper"); function fermybotChat1() { autoChat.innerHTML = autoChat.innerHTML +="<section>hey folks</section>"; } setTimeout(fermybotChat1, 4700); function fermybotChat2() { autoChat.innerHTML = autoChat.innerHTML +="<section>🫶</section>"; } setTimeout(fermybotChat2, 8200); function fermybotChat3() { autoChat.innerHTML = autoChat.innerHTML +="<section>you're muted</section>"; } setTimeout(fermybotChat3, 8400); const chatParent = document.querySelector("#rtcWindow"); var chatButtons = document.querySelectorAll(".tile a.modal-button"); var chatClose = document.querySelector(".touch-toggle"); chatButtons.forEach(function(chatButton) { chatButton.addEventListener('click', function () { chatParent.classList.add("chat-active"); }); }); chatClose.addEventListener('click', function () { chatParent.classList.remove("chat-active"); }); Quickstart Your Serverless Apps with Spin Get Started'''
