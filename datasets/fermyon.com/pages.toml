["https://fermyon.com/blog/summer-of-spin-2024"]
title = "Summer of Spin 2024"
description = "Fermyon's Summer of Spin is a Spin-off on the Advent of Spin, consisting of fun coding challenges!"
full_description = "Back Blog community July 23, 2024 Summer of Spin 2024 Jasmine Mae Alindayu summer code calendar challenge spin cloud awards prizes Announcing Summer of Spin 2024! Dive into a fun opportunity to learn about Spin and our other projects! 🏊🏻‍♀️ Hello! I hope all of you are soaking the sun and enjoying summer so far~ I’m Jasmine Alindayu, a Product Manager intern here at Fermyon. The engineering intern cohort and I are so excited to announce what we have in store for you! We’ve been cooking up some cool coding challenges and the engineer interns have put in lots of work for this special summer event. Fermyon is taking a Spin on the Advent of Spin event we typically host in the winter season by launching four coding challenges which we’re calling Summer of Spin 2024! These challenges are similar to past challenges; they are meant to be a fun opportunity to learn more about what kind of Spin applications you can write and deploy. If you’d like to look at past challenges, check out the Advent of Spin 2022 and Advent of Spin 2023. After submitting your results for each challenge, you’ll receive some fun Fermyon stickers to rep on your water bottle during these hot summer months! For more information (and extra hype), here’s the promo video for Summer of Spin 2024: For this season’s challenges, we have exercises ranging from creating static sites to key value store, LLMs, etc. Once you have these new Spin applications, you’ll be in great shape to try running them at scale with some of the newest open source projects we’ve been working on like SpinKube. After each challenge week, we’ll also release recorded walkthroughs that go over the solution of each challenge. While we were inspired by the Advent of Code series, our challenges are not designed to test your algorithms, data structures or mathematical acumen. Instead, we focused on building fun challenges that will stoke your creativity. How do I play? We will be releasing the first challenge on July 29th on the Fermyon Summer of Spin GitHub repo, which is where you can follow the instructions to get started. Make sure to read the submission guidelines for each challenge and submit your solution to this TypeForm page for each challenge! After each challenge week, there will be a walkthrough video that will be released that goes over the solution of that challenge. Note: The window for submission for each challenge closes end of day on Sunday. For example, the first challenge starts on Monday, July 29th and the submission window will end on Sunday, August 4th. Once you complete each challenge and you’ve validated your solution through Hurl (more information will be posted on how to validate once challenges are released!), you can submit your GitHub URL of your work to a TypeForm and receive a Fermyon swag sticker and a shoutout! Past Challenges Want some practice before diving into Summer of Spin? Check out our past challenges and Advent of Spin events! The validation endpoints still work. Let us know what you think. Advent of Spin GitHub Repo Advent of Spin 2023 Live Code Tuesday Stream Nobody Must Code Alone! We’re all around in the Fermyon Discord server. Come hang out, ask questions, and help others out as we work through the season’s challenges. This is a great opportunity to meet others in the community, as well as the engineers behind the Spin project and Fermyon Cloud. Yes, the main goal of Summer of Spin is to get you solving problems and learning the technology. But we also hope that you’ll find inspiration in these projects to build something on your own. If that inspiration happens to strike, let us know on the Discord. We love hearing about the amazing things you build!"
