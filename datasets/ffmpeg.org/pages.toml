["http://www.ffmpeg.org/community.html"]
title = "Community"
full_description = 'Decisions are taken by the ensemble of active members, through voting and are aided by two committees. Contributors are considered "active contributors" if they have authored more than 20 patches in the last 36 months in the main FFmpeg repository, or if they have been voted in by the GA. Additional members are added to the General Assembly through a vote after proposal by a member of the General Assembly. They are part of the GA for two years, after which they need a confirmation by the GA. A script to generate the current members of the general assembly (minus members voted in) can be found in ‘tools/general_assembly.pl‘. The Technical Committee (TC) is here to arbitrate and make decisions when technical conflicts occur in the project. They will consider the merits of all the positions, judge them and make a decision. Decisions made by the TC can be re-opened after 1 year or by a majority vote of the General Assembly, requested by one of the member of the GA. The TC is elected by the General Assembly for a duration of 1 year, and is composed of 5 members. Members can be re-elected if they wish. A majority vote in the General Assembly can trigger a new election of the TC. The members of the TC can be elected from outside of the GA. Candidates for election can either be suggested or self-nominated. The Technical Committee (TC) is here to arbitrate and make decisions when technical conflicts occur in the project. The TC main role is to resolve technical conflicts. It is therefore not a technical steering committee, but it is understood that some decisions might impact the future of the project. If the TC thinks it needs the input from the larger community, the TC can call for a RFC. Else, it can decide by itself. The TC can also reject a seizure for a few reasons such as: the matter was not discussed enough previously; it lacks expertise to reach a beneficial decision on the matter; or the matter is too trivial. In the RFC mode, one person from the TC posts on the mailing list the technical question and will request input from the community.'
year_published = 2025
clearnet = "http://www.ffmpeg.org/community.html"
