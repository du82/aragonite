["https://ffmpeg.org/mailman/listinfo/ffmpeg-devel"]
title = "ffmpeg-devel Info Page"
full_description = "ffmpeg-devel -- FFmpeg development discussions and patches About ffmpeg-devel English (USA) This list is about FFmpeg development discussions and patch submissions; but not for bug-reports. Please read the Code-of-conduct before posting, and refer to the developer documentation for info about submitting patches. Subscribing is not required to participate but is recommended. You can read all list messages in the ffmpeg-devel Archives. Using ffmpeg-devel You must subscribe to the mailing list before posting a message. Once you subscribe you can post a message to the mailing list by emailing your message to ffmpeg-devel@ffmpeg.org. For more information on using the list see the FFmpeg Mailing List FAQ. You can subscribe to the list, or change your existing subscription, in the sections below. Subscribing to ffmpeg-devel Subscribe to ffmpeg-devel by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. This is a hidden list, which means that the list of members is available only to the list administrator. Your email address: Your name (optional): You may enter a privacy password below. This provides only mild security, but should prevent others from messing with your subscription. Do not use a valuable password as it will occasionally be emailed back to you in cleartext. If you choose not to enter a password, one will be automatically generated for you, and it will be sent to you once you've confirmed your subscription. You can always request a mail-back of your password when you edit your personal options. Pick a password: Reenter password to confirm: Which language do you prefer to display your messages? English (USA) ffmpeg-devel Subscribers (The subscribers list is only available to the list administrator.) Enter your admin address and password to visit the subscribers list: Admin address: Password: To unsubscribe from ffmpeg-devel, get a password reminder, or change your subscription options enter your subscription email address: If you leave the field blank, you will be prompted for your email address"
