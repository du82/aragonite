full_description = "For example, when converting 50x50 yuv420p to 100x100 rgba, setting this flag will scale the chroma plane from 25x25 to 100x100 (4:4:4), and then convert the 100x100 yuv444p image to rgba in the final output step. Without this flag, the chroma plane is instead scaled to 50x100 (4:2:2), with a single chroma sample being re-used for both of the horizontally adjacent RGBA output pixels. For example, when converting a 100x100 rgba source to 50x50 yuv444p, setting this flag will generate a 100x100 (4:4:4) chroma plane, which is then downscaled to the required 50x50. Without this flag, the chroma plane is instead generated at 50x100 (dropping every other pixel), before then being downscaled to the required 50x50 resolution. This will prevent the use of platform-specific optimizations that may lead to slight difference in rounding, in favor of always maintaining exact bit output compatibility with the reference C code. Referenced by child_class_iterate(), opt_default(), scale2ref_child_class_iterate(), and show_help_default(). Referenced by add_legacy_sws_pass(), alloc_set_opts(), check_chrConvertRange(), check_hscale(), check_input_planar_rgb_to_a(), check_input_planar_rgb_to_uv(), check_input_planar_rgb_to_y(), check_lumConvertRange(), check_output_yuv2gbrp(), check_yuv2nv12cX(), check_yuv2yuv1(), check_yuv2yuvX(), context_init_threaded(), draw_qrcode(), init_legacy_subpass(), LLVMFuzzerTestOneInput(), main(), output_single_frame(), preinit(), scale_legacy(), and sws_getCachedContext(). Referenced by add_legacy_sws_pass(), free_legacy_swscale(), init_legacy_subpass(), main(), sws_getCachedContext(), and uninit(). Helper function to run all sws_test_* against a frame, as well as testing the basic frame properties for sanity. It will instead merely initialize internal state that would be required to perform the operation, as well as returning the correct error code for unsupported frame combinations. This function can be used directly on an allocated context, without setting up any frame properties or calling sws_init_context(). Such usage is fully dynamic and does not require reallocation if the frame properties change."
