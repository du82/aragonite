["https://ffmpeg.org/fate.html"]
title = "FFmpeg Automated Testing Environment"
full_description = "FATE is an extended regression suite on the client-side and a means for results aggregation and presentation on the server-side. The first part of this document explains how you can use FATE from your FFmpeg source directory to test your ffmpeg binary. The second part describes how you can run FATE to submit the results to FFmpeg’s FATE server. This is especially recommended for all people contributing source code to FFmpeg, as it can be seen if some test on some platform broke with their recent contribution. This usually happens on the platforms the developers could not test on. The second part of this document describes how you can run FATE to submit your results to FFmpeg’s FATE server. If you want to submit your results be sure to check that your combination of CPU, OS and compiler is not already listed on the above mentioned website. If you want to run FATE on your machine you need to have the samples in place. You can get the samples via the build target fate-rsync. Use this command from the top-level source directory: The above commands set the samples location by passing a makefile variable via command line. It is also possible to set the samples location at source configuration time by invoking configure with --samples=<path to the samples directory>. Afterwards you can invoke the makefile targets without setting the SAMPLES makefile variable. This is illustrated by the following commands: Yet another way to tell FATE about the location of the sample directory is by making sure the environment variable FATE_SAMPLES contains the path to your samples directory. This can be achieved by e.g. putting that variable in your shell profile or by setting it in your interactive session. Do not put a ’~’ character in the samples path to indicate a home directory. Because of shell nuances, this will cause FATE to fail. Beware that some assertions are disabled by default, so mind setting --assert-level=<level> at configuration time, e.g. when seeking the highest possible test coverage:"
