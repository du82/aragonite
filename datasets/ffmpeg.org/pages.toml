["https://ffmpeg.org/ffmpeg-devices.html"]
title = "FFmpeg Devices Documentation"
full_description = 'The libavdevice library provides the same interface as libavformat. Namely, an input device is considered like a demuxer, and an output device like a muxer, and the interface and generic device options are the same provided by libavformat (see the ffmpeg-formats manual). In addition each input or output device may support so-called private options, which are specific for that component. Options may be set by specifying -option value in the FFmpeg tools, or by setting the value explicitly in the device AVFormatContext options or using the libavutil/opt.h API for programmatic use. Input devices are configured elements in FFmpeg which enable accessing the data coming from a multimedia device attached to your system. When you configure your FFmpeg build, all the supported input devices are enabled by default. You can list all available ones using the configure option "–list-indevs". You can disable all the input devices using the configure option "–disable-indevs", and selectively enable an input device using the option "–enable-indev=INDEV", or you can disable a particular input device using the option "–disable-indev=INDEV". This device allows capturing from an ALSA device. The name of the device to capture has to be an ALSA card identifier. The three arguments (in order: CARD,DEV,SUBDEV) specify card number or identifier, device number and subdevice number (-1 means any). To see the list of cards currently recognized by your system check the files /proc/asound/cards and /proc/asound/devices. This input devices uses the Android Camera2 NDK API which is available on devices with API level 24+. The availability of android_camera is autodetected during configuration. This device allows capturing from all cameras on an Android device, which are integrated into the Camera2 NDK API. The available cameras are enumerated internally and can be selected with the camera_index parameter. The input file string is discarded. Set the video size given as a string such as 640x480 or hd720. Falls back to the first available configuration reported by Android if requested video size is not available or by default.'
