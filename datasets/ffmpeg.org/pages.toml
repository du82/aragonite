["https://ffmpeg.org/archive.html"]
title = "Archive"
full_description = "Again it is time for a contest to select a new banner for the coming autumn season. It is your chance to display your art to the world and make this site a little bit more artistic for the coming months. We have made a new major release (2.0) It contains all features and bugfixes of the git master branch from 10th July. A partial list of new stuff is below: We recommend users, distributors and system integrators to upgrade unless they use current git master. FFmpeg developers want to support more voice and speech codecs. We are looking for samples of EVRC-WB , EVRC-B and SMV codecs. Some cell phones may record the audio in qcp, mp4 or 3g2 formats. Please upload these codec samples to us (ftp, trac, etc) so we may take a look. Or you can email them to projects@mplayerhq.hu , thanks! We happily announce that FFmpeg will be represented at LinuxTag in Berlin, Germany. The event will take place from 22nd to 25th of May. We will have a shared booth with XBMC. So just come over and visit our booth to have a chat with us. And please bring along your media samples if you possess any that do not work correctly with FFmpeg! We have made a new major release (1.2) It contains all features and bugfixes of the git master branch from 7th march. A partial list of new stuff is below: We recommend users, distributors and system integrators to upgrade unless they use current git master. Spring is approaching on the northern hemisphere. So it is time to announce another episode of our seasonal art contest. We happily announce that FFmpeg will be represented at `Chemnitzer Linux-Tage' in Chemnitz, Germany. The event will take place on 16th and 17th of March. We hereby invite you to visit us at our booth located in the Linux-Live area! There we will demonstrate usage of FFmpeg, answer your questions and listen to your problems and wishes. We have made a new major release (1.1) It contains all features and bugfixes of the git master branch. A partial list of new stuff is below: We recommend users, distributors and system integrators to upgrade unless they use current git master."
