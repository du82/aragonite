["https://ffmpeg.org/consulting.html"]
title = "FFmpeg-related consulting and employment opportunities"
full_description = "If you're running a business that uses FFmpeg or would like to use FFmpeg, you will sometimes want to have an expert, i.e. one of the original developers, work with you to figure out an issue, fix a bug or add some new feature. This page is a list of those FFmpeg developers that are available for employment or consulting. The FFmpeg project highly recommends these people to be hired by your business. All developers on this list maintain some code in FFmpeg, which serves as a testimony for their competence. By hiring one of these developers, your business can also (indirectly) support the development of FFmpeg. If you do not know whom to hire in particular or if none of the listed areas of expertise fits your requirements, you can send an email to the ffmpeg-devel mailing list, where it will reach a wider audience. Baptiste Coudurier is located in Los Angeles, California and is available for contracting work. He has worked on FFmpeg since 2005 and has been a maintainer since 2006. He has special expertise in broadcast codecs (ProRes, DNxHD, IMX/D-10, AVC-Intra), formats (MXF, GXF, MOV) and usages (Avid, FCP, Interlacing, Time Code, Metadata). You can contact him by email at baptiste.coudurier@gmail.com. Carl Eugen is located in Austria and is available for contracting work. He has worked on FFmpeg since 2007 and has been a maintainer since 2007. He has experience with software license issues, and currently maintains the FFmpeg bug tracker. You can contact him by email at ce at hoyos dot ws. Michael is located in Vienna, Austria and is available for contracting work. He is an expert in all areas of video coding, security, bugfixing as well as x86 assembly. You can contact him by email at michael.ffwork@niedermayer.cc. Thilo is located in Berlin, Germany and is available for contract work. He has worked on FFmpeg since 2009 and has been a maintainer since 2010. He has special expertise with decoders, metadata, input devices and filters. You can contact him by email at thilo.borgmann@mail.de."
