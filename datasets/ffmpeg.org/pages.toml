["https://ffmpeg.org/ffmpeg-scaler.html"]
title = "FFmpeg Scaler Documentation"
full_description = "The FFmpeg rescaler provides a high-level interface to the libswscale library image conversion utilities. In particular it allows one to perform image rescaling and pixel format conversion. Options may be set by specifying -option value in the FFmpeg tools, with a few API-only exceptions noted below. For programmatic use, they can be set explicitly in the SwsContext options or through the libavutil/opt.h API. Set the scaler flags. This is also used to set the scaling algorithm. Only a single algorithm should be selected. Default value is ‘bicubic’. Select Lanczos rescaling algorithm. The default width (alpha) is 3 and can be changed by setting param0. If value is set to 1, indicates source is full range. Default value is 0, which indicates source is limited range. If value is set to 1, enable full range for destination. Default value is 0, which enables limited range. Set scaling algorithm parameters. The specified values are specific of some scaling algorithms and ignored by others. The specified values are floating point number values. Set the alpha blending to use when the input has alpha but the output does not. Default value is ‘none’. For details about the authorship, see the Git history of the project (https://git.ffmpeg.org/ffmpeg), e.g. by typing the command git log in the FFmpeg source directory, or browsing the online repository at https://git.ffmpeg.org/ffmpeg."
