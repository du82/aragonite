["http://www.ffmpeg.org/faq.html"]
title = "FFmpeg FAQ"
full_description = "Because no one has taken on that task yet. FFmpeg development is driven by the tasks that are important to the individual developers. If there is a feature that is important to you, the best way to get it implemented is to undertake the task yourself or sponsor a developer. No. Windows DLLs are not portable, bloated and often slow. Moreover FFmpeg strives to support all codecs natively. A DLL loader is not conducive to that goal. Even if ffmpeg can read the container format, it may not support all its codecs. Please consult the supported codec list in the ffmpeg documentation. Windows does not support standard formats like MPEG very well, unless you install some additional codecs. Note, ASF files often have .wmv or .wma extensions in Windows. It should also be mentioned that Microsoft claims a patent on the ASF format, and may sue or threaten users who create ASF files with non-Microsoft software. It is strongly advised to avoid ASF where possible. This is a bug in gcc. Do not report it to us. Instead, please report it to the gcc developers. Note that we will not add workarounds for gcc bugs. Also note that (some of) the gcc developers believe this is not a bug or not a bug they should fix: https://gcc.gnu.org/bugzilla/show_bug.cgi?id=11203. Then again, some of them do not know the difference between an undecidable problem and an NP-hard problem... Distributions usually split libraries in several packages. The main package contains the files necessary to run programs using the library. The development package contains the files necessary to build programs using the library. Sometimes, docs and/or data are in a separate package too. To build FFmpeg, you need to install the development package. It is usually called libfoo-dev or libfoo-devel. You can remove it after the build is finished, but be sure to keep the main package. Somewhere along with your libraries, there is a .pc file (or several) in a pkgconfig directory. You need to set environment variables to point pkg-config to these files."
