["https://ffmpeg.org/mailman/listinfo/ffmpeg-mentors"]
title = "FFmpeg-mentors Info Page"
full_description = "FFmpeg-mentors -- Google Sumer of code, Outreachy, ... Mentors About FFmpeg-mentors English (USA) To see the collection of prior postings to the list, visit the FFmpeg-mentors Archives. (The current archive is only available to the list members.) Using FFmpeg-mentors To post a message to all the list members, send email to ffmpeg-mentors@ffmpeg.org. You can subscribe to the list, or change your existing subscription, in the sections below. Subscribing to FFmpeg-mentors Subscribe to FFmpeg-mentors by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. Once confirmation is received, your request will be held for approval by the list moderator. You will be notified of the moderator's decision by email. This is also a private list, which means that the list of members is not available to non-members. Your email address: Your name (optional): You may enter a privacy password below. This provides only mild security, but should prevent others from messing with your subscription. Do not use a valuable password as it will occasionally be emailed back to you in cleartext. If you choose not to enter a password, one will be automatically generated for you, and it will be sent to you once you've confirmed your subscription. You can always request a mail-back of your password when you edit your personal options. Pick a password: Reenter password to confirm: Which language do you prefer to display your messages? English (USA) FFmpeg-mentors Subscribers (The subscribers list is only available to the list members.) Enter your address and password to visit the subscribers list: Address: Password: To unsubscribe from FFmpeg-mentors, get a password reminder, or change your subscription options enter your subscription email address: If you leave the field blank, you will be prompted for your email address To see the collection of prior postings to the list, visit the FFmpeg-mentors Archives. (The current archive is only available to the list members.)"
