["http://www.ffmpeg.org/ffmpeg-utils.html"]
title = "FFmpeg Utilities Documentation"
full_description = 'FFmpeg adopts the following quoting and escaping mechanism, unless explicitly specified. The following rules are applied: Note that you may need to add a second level of escaping when using the command line or a script, which depends on the syntax of the adopted shell language. The function av_get_token defined in libavutil/avstring.h can be used to parse a token quoted or escaped according to the rules defined above. The tool tools/ffescape in the FFmpeg source tree can be used to automatically quote or escape a string in a script. Time is local time unless Z is appended, in which case it is interpreted as UTC. If the year-month-day part is not specified it takes the current year-month-day. HH expresses the number of hours, MM the number of minutes for a maximum of 2 digits, and SS the number of seconds for a maximum of 2 digits. The m at the end expresses decimal value for SS. S expresses the number of seconds, with the optional decimal part m. The optional literal suffixes ‘s’, ‘ms’ or ‘us’ indicate to interpret the value as seconds, milliseconds or microseconds, respectively. Specify the size of the sourced video, it may be a string of the form widthxheight, or the name of a size abbreviation. Specify the frame rate of a video, expressed as the number of frames generated per second. It has to be a string in the format frame_rate_num/frame_rate_den, an integer number, a float number or a valid video frame rate abbreviation. Note that a ratio with infinite (1/0) or negative value is considered valid, so you should check on the returned value if you want to exclude those values. It can be the name of a color as defined below (case insensitive match) or a [0x|#]RRGGBB[AA] sequence, possibly followed by @ and a string representing the alpha component. The alpha component may be a string composed by "0x" followed by an hexadecimal number or a decimal number between 0.0 and 1.0, which represents the opacity value (‘0x00’ or ‘0.0’ means completely transparent, ‘0xff’ or ‘1.0’ completely opaque). If the alpha component is not specified then ‘0xff’ is assumed.'
