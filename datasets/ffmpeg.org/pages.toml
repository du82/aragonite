title = "Old releases"
full_description = "6.0.1 was released on 2023-11-10. It is the latest stable FFmpeg release from the 6.0 release branch, which was cut from master on 2023-02-19. 5.0.3 was released on 2023-04-02. It is the latest stable FFmpeg release from the 5.0 release branch, which was cut from master on 2022-01-04. 4.1.11 was released on 2023-06-07. It is the latest stable FFmpeg release from the 4.1 release branch, which was cut from master on 2018-11-02. 4.0.6 was released on 2020-07-03. It is the latest stable FFmpeg release from the 4.0 release branch, which was cut from master on 2018-04-16. 3.3.9 was released on 2018-11-18. It is the latest stable FFmpeg release from the 3.3 release branch, which was cut from master on 2017-04-02. 3.2.19 was released on 2022-10-28. It is the latest stable FFmpeg release from the 3.2 release branch, which was cut from master on 2016-10-26. 3.1.11 was released on 2017-09-25. It is the latest stable FFmpeg release from the 3.1 release branch, which was cut from master on 2016-06-26. 3.0.12 was released on 2018-10-28. It is the latest stable FFmpeg release from the 3.0 release branch, which was cut from master on 2016-02-14. 2.7.7 was released on 2016-04-30. It is the latest stable FFmpeg release from the 2.7.7 release branch, which was cut from master on 2015-06-09. Amongst lots of other changes, it includes all changes from ffmpeg-mt, libav master of 2015-06-10, libav 11 as of 2015-06-11. 2.6.9 was released on 2016-05-03. It is the latest stable FFmpeg release from the 2.6 release branch, which was cut from master on 2015-03-06. Amongst lots of other changes, it includes all changes from ffmpeg-mt, libav master of 2015-03-06, libav 11 as of 2015-03-06. 2.5.11 was released on 2016-02-02. It is the latest stable FFmpeg release from the 2.5 release branch, which was cut from master on 2014-12-15. Amongst lots of other changes, it includes all changes from ffmpeg-mt, libav master of 2014-12-03, libav 11 as of 2014-12-03. 2.4.14 was released on 2017-12-31. It is the latest stable FFmpeg release from the 2.4 release branch, which was cut from master on 2014-09-14. Amongst lots of other changes, it includes all changes from ffmpeg-mt, libav master of 2014-09-14, libav 11.4 as of 2015-08-25."
