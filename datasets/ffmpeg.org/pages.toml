["https://ffmpeg.org/mailman/listinfo/ffmpeg-cvslog"]
title = "ffmpeg-cvslog Info Page"
full_description = "ffmpeg-cvslog -- FFmpeg git commit log and discussion About ffmpeg-cvslog English (USA) To see the collection of prior postings to the list, visit the ffmpeg-cvslog Archives. Using ffmpeg-cvslog To post a message to all the list members, send email to ffmpeg-cvslog@ffmpeg.org. You can subscribe to the list, or change your existing subscription, in the sections below. Subscribing to ffmpeg-cvslog Subscribe to ffmpeg-cvslog by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. This is a hidden list, which means that the list of members is available only to the list administrator. Your email address: Your name (optional): You may enter a privacy password below. This provides only mild security, but should prevent others from messing with your subscription. Do not use a valuable password as it will occasionally be emailed back to you in cleartext. If you choose not to enter a password, one will be automatically generated for you, and it will be sent to you once you've confirmed your subscription. You can always request a mail-back of your password when you edit your personal options. Pick a password: Reenter password to confirm: Which language do you prefer to display your messages? English (USA) ffmpeg-cvslog Subscribers (The subscribers list is only available to the list administrator.) Enter your admin address and password to visit the subscribers list: Admin address: Password: To unsubscribe from ffmpeg-cvslog, get a password reminder, or change your subscription options enter your subscription email address: If you leave the field blank, you will be prompted for your email address Subscribe to ffmpeg-cvslog by filling out the following form. You will be sent email requesting confirmation, to prevent others from gratuitously subscribing you. This is a hidden list, which means that the list of members is available only to the list administrator."
