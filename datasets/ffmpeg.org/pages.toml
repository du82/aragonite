full_description = 'Libavdevice is a complementary library to libavformat. It provides various "special" platform-specific muxers and demuxers, e.g. for grabbing devices, audio capture and playback etc. As a consequence, the (de)muxers in libavdevice are of the AVFMT_NOFILE type (they use their own I/O functions). The filename passed to avformat_open_input() often does not refer to an actually existing file, but has some special device-specific meaning - e.g. for xcbgrab it is the display name. To use libavdevice, simply call avdevice_register_all() to register all compiled muxers and demuxers. They all use standard libavformat API. Message is sent to the device every time the application changes the size of the window device renders to. Message should also be sent right after window is created. Application requests pause/unpause playback. Mostly usable with devices that have internal buffer. By default devices are not paused. Set volume level. It may be device-dependent if volume is changed per stream or system wide. Per stream volume change is expected when possible. Change mute state. It may be device-dependent if mute status is changed per stream or system wide. Per stream mute status change is expected when possible. Force the device to send AV_DEV_TO_APP_VOLUME_LEVEL_CHANGED or AV_DEV_TO_APP_MUTE_STATE_CHANGED command respectively. Device requests to create a window buffer. Exact meaning is device- and application-dependent. Message is sent before rendering first frame and all one-shot initializations should be done here. Application is allowed to ignore preferred window buffer size. data: AVDeviceRect: preferred size of the window buffer. NULL: no preferred size of the window buffer. Device requests to prepare a window buffer for rendering. Exact meaning is device- and application-dependent. Message is sent before rendering of each frame. Device requests to display a window buffer. Message is sent when new frame is ready to be displayed. Usually buffers need to be swapped in handler of this message.'
