["http://ffmpeg.org/doxygen/trunk/group__libavf.html"]
title = "FFmpeg: libavformat"
description = """
Modules |
Files"""
full_description = "Libavformat (lavf) is a library for dealing with various media container formats. Its main two purposes are demuxing - i.e. splitting a media file into component streams, and the reverse process of muxing - writing supplied data in a specified container format. It also has an I/O module which supports a number of protocols for accessing the data (e.g. file, tcp, http and others). Unless you are absolutely sure you won't use libavformat's network capabilities, you should also call avformat_network_init(). A supported input format is described by an AVInputFormat struct, conversely an output format is described by AVOutputFormat. You can iterate over all input/output formats using the av_demuxer_iterate / av_muxer_iterate() functions. The protocols layer is not part of the public API, so you can only get the names of supported protocols with the avio_enum_protocols() function. Main lavf structure used for both muxing and demuxing is AVFormatContext, which exports all information about the file being read or written. As with most Libavformat structures, its size is not part of public ABI, so it cannot be allocated on stack or directly with av_malloc(). To create an AVFormatContext, use avformat_alloc_context() (some functions, like avformat_open_input() might do that for you). It is possible to configure lavf muxers and demuxers using the AVOptions mechanism. Generic (format-independent) libavformat options are provided by AVFormatContext, they can be examined from a user program by calling av_opt_next() / av_opt_find() on an allocated AVFormatContext (or its AVClass from avformat_get_class()). Private (format-specific) options are provided by AVFormatContext.priv_data if and only if AVInputFormat.priv_class / AVOutputFormat.priv_class of the corresponding format struct is non-NULL. Further options may be provided by the I/O context, if its AVClass is non-NULL, and the protocols layer. See the discussion on nesting in AVOptions documentation to learn how to access those."
year_published = 2025
clearnet = "http://ffmpeg.org/doxygen/trunk/group__libavf.html"
