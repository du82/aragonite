["https://ffmpeg.org/mailing-list-faq.html"]
title = "FFmpeg Mailing List FAQ"
full_description = 'A mailing list is not much different than emailing someone, but the main difference is that your message is received by everyone who subscribes to the list. It is somewhat like a forum but in email form. Or visit the ffmpeg-user mailing list info page, scroll to bottom of page, enter your email address in the box, and click the Unsubscribe or edit options button. Please avoid asking a mailing list admin to unsubscribe you unless you are absolutely unable to do so by yourself. See Who do I contact if I have a problem with the mailing list? Note that it is possible to temporarily halt message delivery (vacation mode). See How do I disable mail delivery without unsubscribing? Some messages are automatically held in the moderation queue and must be manually approved by a mailing list admin: The queue is not checked on a regular basis. You can ask on the #ffmpeg-devel IRC channel on Libera Chat for someone to approve your message. You should have received an email with the subject Your message to <mailing list name> awaits moderator approval. A link is in the message that will allow you to delete your message unless a mailing list admin already approved or rejected it. Note that the archives are split by month. Discussions that span several months will be split into separate months in the archives. Click the email link at the top of the message just under the subject title. The link will provide the proper headers to keep the message within the thread. The message size limit is 1000 kilobytes. Please provide links to larger files instead of attaching them. Google Drive and Dropbox are acceptable if you need a file host, and 0x0.st is good for files under 256 MiB. Use the List-Id. For example, the ffmpeg-user mailing list is ffmpeg-user.ffmpeg.org. You can view the List-Id in the raw message or headers. Sometimes you may want to temporarily stop receiving all mailing list messages. This "vacation mode" is simple to do: Alternatively, from your subscribed address, send a message to ffmpeg-user-request@ffmpeg.org with the subject set delivery off. To re-enable mail delivery send a message to ffmpeg-user-request@ffmpeg.org with the subject set delivery on.'
year_published = 2025
