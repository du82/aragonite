["https://ffmpeg.org/bugreports.html"]
title = "Bug Reports"
full_description = "When gdb encounters its problem, run the following commands and copy/paste the output into your bug report: You should provide all information so that anyone can reproduce the bug. Please do not report your problem on the developer mailing list: Only send bug reports there if you also intend to provide a fix. The developers may ask you to provide a sample media file illustrating your problem. In this case, please follow these steps: Movie files which have been compressed (rar,7z,gzip,...) will be deleted without being examined unless they are raw RGB/YUV/PCM. Furthermore movie files uploaded to services like rapidshare or any other similar service will be ignored. We are not willing to spend our time fighting with this ridiculous, bloated and spam-filled crap."
