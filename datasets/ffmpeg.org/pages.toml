["https://ffmpeg.org/contact.html"]
title = "Contact Us"
full_description = "Please follow the netiquette when posting on FFmpeg mailing lists, especially avoid top-posting and thread hijacking (that is, replying to a thread and changing the subject line to something completely unrelated that was not being discussed within the original thread) and please read the Code of conduct. Configuring your mail client to break lines after 70 or so characters is a plus. If you attach files, avoid compressing small files, uncompressed is preferred. Also please try to avoid posting mails with overly long signatures or nonsense corporate disclaimers that claim the content of your mails is confidential. Attached patches should not have application/octet-stream as mime-type, but text/plain or even better text/x-diff or text/x-patch. If you send us a patch, please make it some form of unified diff. We prefer patches made using git format-patch from the root of your FFmpeg checkout or sent with git send-email as shown in Using git to develop FFmpeg. For additional information and guidelines refer to the FFmpeg Developer Documentation. To read up on past discussions, read the mailing list archives. It is highly likely that you will find an answer to your questions there, so make sure to browse the archives before posting questions. FFmpeg has two official channels on the Libera IRC network. Both channels are open and unmoderated. Maintainers have operator status, contributors with patches in FFmpeg have voice in the channels. Web.Libera.Chat is a web client for these channels. Please read and follow the Code of conduct. Our IRC channels are publically logged and archives since 2023-10-11 are here: #ffmpeg and #ffmpeg-devel Our IRC channels are publically logged and old archives of both channels can be viewed at ffmpeg-devel-irc. FFmpeg offers no official forum. However, we collect links to FFmpeg-related forums found in the world wide web. If you would like to see your forum added here, please send an email to the ffmpeg-devel mailing list. Also if you don't receive a reply on the forums, try our official mailing list or IRC channels. And most importantly, if you see questions from others on the forums or mailing list that you know the answer to, please help and reply. The forums are largely community supported and few official developers read them regularly."
year_published = 2025
clearnet = "https://ffmpeg.org/contact.html"
