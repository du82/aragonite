["https://ffmpeg.org/git-howto.html"]
title = "Using Git to develop FFmpeg"
full_description = "This document aims in giving some quick references on a set of useful Git commands. You should always use the extensive and detailed documentation provided directly by Git: What follows now is a basic introduction to Git and some FFmpeg-specific guidelines to ease the contribution to the project. You can get Git from http://git-scm.com/ Most distribution and operating system provide a package for it. This will put the FFmpeg sources into the directory <target> and let you push back your changes to the remote repository. This will put the source of the FFmpeg website into the directory <target> and let you push back your changes to the remote repository. If you don’t have write-access to the ffmpeg-web repository, you can create patches after making a read-only ffmpeg-web clone: Make sure that you do not have Windows line endings in your checkouts, otherwise you may experience spurious compilation failures. One way to achieve this is to run pulls in the latest changes from the tracked branch. The tracked branch can be remote. By default the master branch tracks the branch master in the remote origin. fetches the changes from the main repository and replays your local commits over it. This is required to keep all your local changes at the top of FFmpeg’s master tree. The master tree will reject pushes with merge commits. Git needs to get notified of all changes you make to your working directory that makes files appear or disappear. Line moves across files are automatically tracked. You may also use the graphical tools like gitview or gitk or the web interface available at http://source.ffmpeg.org/. detects all the changes you made and lists what actions will be taken in case of a commit (additions, modifications, deletions, etc.). to double check your changes before committing them to avoid trouble later on. All experienced developers do this on each and every commit, no matter how small. Every one of them has been saved from looking like a fool by this many times. It’s very easy for stray debug output or cosmetic modifications to slip in, please avoid problems through this extra level of scrutiny."
