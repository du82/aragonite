full_description = 'The filter might add additional inputs during initialization depending on the options supplied to it. The filter might add additional outputs during initialization depending on the options supplied to it. The filter supports multithreading by splitting frames into multiple parts and processing them concurrently. Some filters support a generic "enable" expression option that can be used to enable or disable a filter in the timeline. Filters supporting this option have this flag set. When the enable expression is false, the default no-op filter_frame() function is called in place of the filter_frame() callback defined on each input pad, thus the frame is passed unchanged to the next filters. Same as AVFILTER_FLAG_SUPPORT_TIMELINE_GENERIC, except that the filter will have its filter_frame() callback(s) called as usual even when the enable expression is false. The filter will disable filtering within the filter_frame() callback(s) itself, for example executing code depending on the AVFilterContext->is_disabled value. Handy mask to test whether the filter supports or no the timeline feature (internally or generically). Stop once a filter understood the command (for target=all for example), fast filters are favored automatically. A function pointer passed to the AVFilterGraph::execute callback to be executed multiple times, possibly in parallel. Referenced by create_sink(), fg_create(), insert_trim(), lavfi_read_header(), main(), and show_filters(). Referenced by avfilter_graph_parse(), avfilter_graph_parse_ptr(), avfilter_insert_filter(), configure_filtergraph(), configure_input_audio_filter(), configure_input_video_filter(), configure_output_audio_filter(), configure_output_video_filter(), create_sink(), init_filter_graph(), insert_filter(), insert_trim(), lavfi_read_header(), link_inputs(), and link_outputs(). Referenced by avfilter_graph_segment_create_filters(), configure_audio_filters(), configure_input_audio_filter(), configure_input_video_filter(), configure_output_audio_filter(), configure_output_video_filter(), configure_video_filters(), create_sink(), filter_parse(), init_filter(), init_filter_graph(), init_filters(), insert_filter(), insert_trim(), lavfi_read_header(), main(), and query_formats().'
