["https://ffmpeg.org/ffmpeg-bitstream-filters.html"]
title = "FFmpeg Bitstream Filters Documentation"
full_description = "A bitstream filter operates on the encoded stream data, and performs bitstream level modifications without performing decoding. When you configure your FFmpeg build, all the supported bitstream filters are enabled by default. You can list all available ones using the configure option --list-bsfs. You can disable all the bitstream filters using the configure option --disable-bsfs, and selectively enable any bitstream filter using the option --enable-bsf=BSF, or you can disable a particular bitstream filter using the option --disable-bsf=BSF. The option -bsfs of the ff* tools will display the list of all the supported bitstream filters included in your build. The ff* tools have a -bsf option applied per stream, taking a comma-separated list of filters, whose parameters follow the filter name after a ’=’. This filter creates an MPEG-4 AudioSpecificConfig from an MPEG-2/4 ADTS header and removes the ADTS header. This filter is required for example when copying an AAC stream from a raw ADTS AAC or an MPEG-TS container to MP4A-LATM, to an FLV file, or to MOV/MP4 files and related formats such as 3GP or M4A. Please note that it is auto-inserted for MP4A-LATM and MOV/MP4 and related formats. Set the color range in the stream (see AV1 section 6.4.2; note that this cannot be set for streams using BT.709 primaries, sRGB transfer characteristic and identity (RGB) matrix coefficients). Set the chroma sample location in the stream (see AV1 section 6.4.2). This can only be set for 4:2:0 streams. Set the tick rate (time_scale / num_units_in_display_tick) in the timing info in the sequence header. Set the number of ticks in each picture, to indicate that the stream has a fixed framerate. Ignored if tick_rate is not also set. If enabled, strip all Dolby Vision metadata (configuration record + RPU data blocks) from the stream. Extended metadata compression. Devices are not required to support this. Note that this level currently behaves the same as ‘limited’ in libavcodec. Add extradata to the beginning of the filtered packets except when said packets already exactly begin with the extradata that is intended to be added."
year_published = 2025
clearnet = "https://ffmpeg.org/ffmpeg-bitstream-filters.html"
