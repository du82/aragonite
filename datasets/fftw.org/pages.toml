["https://fftw.org/fftw-wisdom.1.html"]
title = "FFTW-WISDOM(1) manual page"
full_description = 'fftw-wisdom is a utility to generate FFTW wisdom files, which contain saved information about how to optimally compute (Fourier) transforms of various sizes. FFTW is a free library to compute discrete Fourier transforms in one or more dimensions, for arbitrary sizes, and of both real and complex data, among other related operations. More information on FFTW can be found at the FFTW home page: http://www.fftw.org Programs using FFTW can be written to load wisdom from an arbitrary file, string, or other source. Moreover, it is likely that many FFTW-using programs will load the system wisdom file, which is stored in /etc/fftw/wisdom by default. fftw-wisdom can be used to create or add to such wisdom files. In its most typical usage, the wisdom file can be created to pre-plan a canonical set of sizes (see below) via: The fftw-wisdom program normally writes the wisdom directly to standard output, but this can be changed via the -o option, as in the example above. If the system wisdom file /etc/fftw/wisdom already exists, then fftw-wisdom reads this existing wisdom (unless the -n option is specified) and outputs both the old wisdom and any newly created wisdom. In this way, it can be used to add new transform sizes to the existing system wisdom (or other wisdom file, with the -w option). <type> is either ’c’ (complex), ’r’ (real, r2c/c2r), or ’k’ (r2r, per-dimension kinds, specified in the geometry, below). <direction> is either ’f’ (forward) or ’b’ (backward). The <direction> should be omitted for ’k’ transforms, where it is specified via the geometry instead. <geometry> is the size and dimensionality of the transform, where different dimensions are separated by ’x’ (e.g. ’16x32’ for a two-dimensional 16 by 32 transform). In the case of ’k’ transforms, the size of each dimension is followed by a "type" string, which can be one of f/b/h/e00/e01/e10/e11/o00/o01/o10/o11 for R2HC/HC2R/DHT/REDFT00/.../RODFT11, respectively, as defined in the FFTW manual.'
