["https://fftw.org/download.html"]
title = "FFTW Download Page"
description = "Download FFTW source code, view platform-specific notes sent in by users, or jump to mirror sites."
full_description = '''Subscribe to the fftw-announce mailing list on Google Groups to receive an email when FFTW is updated in the future. Alternatively, you can use the web feed or mailing list on freecode.com. FFTW is distributed under the GNU GPL; see the License and Copyright section of the FFTW manual for more information. FFTW 2.1.5 is the stable release of FFTW2, last updated in 1999. FFTW 2.1.5 is obsolete, but because its API is incompatible with that of version 3.x, we continue to distribute it for those users who require backwards compatibility. In order to perform runtime self-optimization, FFTW needs a high-precision timer to measure the cost of different code choices, and we now use the hardware cycle counter available in most modern CPUs. We support the cycle counter for x86 (Pentium and later), IA-64 (Itanium), x86-64, PowerPC, Alpha, PA-RISC, MIPS, s390, and other processors under a variety of compilers. If you are interested in using a cycle counter in your own code, you can download FFTW's cycle-counter header by itself: To use it, #include "cycle.h", call the ticks t = getticks() function before and after the code you want to time, and call the elapsed(t1,t2) function to get the elapsed time as a double-precision number. (The elapsed time is in arbitrary units, not seconds or anything like that...it's intended for performance comparisons on a given machine only.) (In order to use some of the OS-dependent timer routines like Solaris' gethrtime, you need to paste the autoconf snippet from the top of cycle.h into your configure.ac file and #include "config.h" before cycle.h, or define the relevant macros manually if you are not using autoconf.) These are files and notes to help you install FFTW on particular platforms. (Note that the installation notes below were sent in by users, and have not been tested by us.) If you had to modify the Makefile or anything else in the standard FFTW distribution to get it to run on your machine, let us know so that we can make your modifications available to others.'''
