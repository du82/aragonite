["http://www.fftw.org/faq/section2.html"]
title = "FFTW FAQ - Section 2"
full_description = '''We have successfully used gcc 3.2.x on x86 and PPC, a recent Compaq C compiler for Alpha, version 6 of IBM's xlc compiler for AIX, Intel's icc versions 5-7, and Sun WorkShop cc version 6. FFTW is likely to push compilers to their limits, however, and several compiler bugs have been exposed by FFTW. A partial list follows. gcc 2.95.x for Solaris/SPARC produces incorrect code for the test program (workaround: recompile the libbench2 directory with -O2). NetBSD/macppc 1.6 comes with a gcc version that also miscompiles the test program. (Please report a workaround if you know one.) gcc 3.2.3 for ARM reportedly crashes during compilation. This bug is reportedly fixed in later versions of gcc. Versions 8.0 and 8.1 of Intel's icc falsely claim to be gcc, so you should specify CC="icc -no-gcc"; this is automatic in FFTW 3.1. icc-8.0.066 reportely produces incorrect code for FFTW 2.1.5, but is fixed in version 8.1. icc-7.1 compiler build 20030402Z appears to produce incorrect dependencies, causing the compilation to fail. icc-7.1 build 20030307Z appears to work fine. (Use icc -V to check which build you have.) As of 2003/04/18, build 20030402Z appears not to be available any longer on Intel's website, whereas the older build 20030307Z is available. ranlib of GNU binutils 2.9.1 on Irix has been observed to corrupt the FFTW libraries, causing a link failure when FFTW is compiled. Since ranlib is completely superfluous on Irix, we suggest deleting it from your system and replacing it with a symbolic link to /bin/echo. gcc 3.4.[0123] for x86 produces incorrect SSE2 code for FFTW when -O2 (the best choice for FFTW) is used, causing FFTW to crash (make check crashes). This bug is fixed in gcc 3.4.4. On x86_64 (amd64/em64t), gcc 3.4.4 reportedly still has a similar problem, but this is fixed as of gcc 3.4.6. gcc-3.2 for x86 produces incorrect SIMD code if -O3 is used. The same compiler produces incorrect SIMD code if no optimization is used, too. When using gcc-3.2, it is a good idea not to change the default CFLAGS selected by the configure script.'''
