["https://fi.wordpress.org/2024/04/03/regina"]
title = "WordPress 6.5 “Regina” – WordPress.org Suomi"
description = "Tässä WordPress 6.5 “Regina”, joka on saanut inspiraationsa tunnetun jazzviulisti Regina Carterin dynaamisesta monipuolisuudesta. Hän on palkittu taiteilija ja jazz-opettaja, joka tunnetaan genrera…"
full_description = "3.4.2024 By Teemu Suoranta WordPress 6.5 “Regina” Tässä WordPress 6.5 “Regina”, joka on saanut inspiraationsa tunnetun jazzviulisti Regina Carterin dynaamisesta monipuolisuudesta. Hän on palkittu taiteilija ja jazz-opettaja, joka tunnetaan genrerajojen ylittämisestä. Reginan tekniset perusteet klassisessa musiikissa ja syvä ymmärrys jazzista ovat hankkineet hänelle maineen kulkea rohkeasti yli sen, mitä on pidetty mahdollisena viululle. Anna Reginan genrerajoja taivuttavan äänen hämmästyttävien ja hienovaraisten käänteiden yllättää sinut, kun tutustut kaikkeen mitä 6.5 tarjoaa. Tämä viimeisin WordPress-versio antaa enemmän voimaa yksityiskohtiin. Se tarjoaa uusia ja parannettuja tapoja hienosäätää ja parantaa sivuston rakentamiskokemusta, antaen sinulle mahdollisuuden ottaa ohjat tavoilla, jotka tekevät siitä omanlaisesi. Löydät uusia tapoja hallita sivustosi typografiaa, kattavamman versiohistorian saatavilla useammassa paikassa ja joukon sivustoeditorin päivityksiä yhdessä vaikuttavien suorituskykyparannusten kanssa, jotka auttavat sinua saamaan asiat tehtyä sujuvammin ja nopeammin. ”Regina” merkitsee myös joitakin läpimurtoja kehittäjätyökaluissa, jotka alkavat muuttaa tapaasi käyttää ja laajentaa lohkoja kiehtovien kokemusten luomiseksi. Interaktiivisuusrajapinta (Interaction API) avaa maailman luoviin julkisen puolen käyttöliittymiin, kun taas Lohkosidosten rajapinta (Block Bindings API) tekee dynaamisten yhteyksien luomisen lohkojen ja datan välillä saumattomaksi. Nämä, muiden kehittäjäkeskeisten parannusten ja päivitysten joukossa, ovat valmiita auttamaan sinua kehittämään tapaasi rakentaa WordPressillä. Lataa WordPress 6.5 ”Regina” Mitä uutta 6.5:ssä Lisää ja hallitse fontteja sivustollasi Uusi fonttikirjasto antaa sinun hallita olennaista osaa sivustosi suunnittelusta – typografiaa – ilman koodaamista tai ylimääräisiä vaiheita. Asenna, poista ja aktivoi vaivattomasti paikallisia ja Google Fonts -palvelun fontteja sivustollasi mille tahansa lohkoteemalle. Mahdollisuus tarjota mukautettuja fonttikokoelmia antaa sivuston luojille ja julkaisijoille enemmän vaihtoehtoja sisällön tyylin suhteen. Saa enemmän irti versiohistoriasta – mukaan lukien sivupohjat ja sivupohjan osat Saat entistä kattavamman kuvan siitä, mitä on tehty ja mihin voit palata. Saa tietoja, kuten aikaleimat, pikayhteenvedot ja sivutettu luettelo kaikista versioista. Katso versioita Tyylikirjasta nähdäksesi, kuinka muutokset vaikuttavat jokaiseen lohkoon. Versiohistoria on nyt saatavilla myös sivupohjille ja sivupohjan osille. Kokeile paranneltuja tausta- ja varjotyökaluja Hallitse koon, toiston ja keskipisteen säätimiä taustakuvissa Ryhmä-lohkoissa, jotta voit luoda hienovaraisia tai räikeitä visuaalisia asetteluita. Aseta kuvasuhteita Kansi-lohkon kuvien kanssa ja lisää helposti peittovärejä, jotka hakevat automaattisesti värin valitsemastasi kuvasta. Lisää varjo useammille lohkotyypeille ja luo asetteluja visuaalisella syvyydellä tai lisää hieman persoonallisuutta ulkoasuusi. Löydä uudet datanäkymät Jokainen sivustosi osa sisältää kirjaston tietoa ja dataa – nyt voit löytää tarvitsemasi nopeasti ja järjestää sen haluamallasi tavalla. Datanäkymät sivuille, sivupohjille, sivupohjien osille ja lohkomalleille antavat sinun nähdä tiedot taulukko- tai ruudukkonäkymässä, vaihtoehdolla näyttää tai piilottaa kenttiä ja tehdä massamuutoksia. Sulavampi raahaaminen Tunne ero, kun siirrät asioita ympäriinsä hyödyllisillä visuaalisilla vihjeillä, kuten Listanäkymässä siirtyvillä kohteilla tai kitkattomalla raahauksella mihin tahansa työtilassasi – alusta loppuun. Parannetut linkkityökalut Luo ja hallinnoi linkkejä helpommin intuitiivisemman linkinrakennuskokemuksen avulla, kuten virtaviivaistetun käyttöliittymän ja pikakuvakkeen linkkien kopioimiseen. Mitä uutta kehittäjille 6.5:ssä Tuo vuorovaikutuksia lohkoihin Interaction API tarjoaa kehittäjille standardoidun menetelmän vuorovaikutteisten julkisen puolen käyttöliittymien rakentamiseen lohkoilla. Se yksinkertaistaa prosessia, vähentäen riippuvuuksia ulkoisista työkaluista, samalla ylläpitäen optimaalista suorituskykyä. Käytä sitä luodaksesi mieleenpainuvia käyttäjäkokemuksia, kuten hakutulosten välitöntä noutamista tai vierailijoiden mahdollisuutta vuorovaikuttaa sisällön kanssa reaaliajassa. Yhdistä lohkot mukautettuihin kenttiin tai muuhun dynaamiseen sisältöön Yhdistä ytimen lohkoattribuutit mukautettuihin kenttiin ja käytä mukautettujen kenttien arvoja luomatta mukautettuja lohkoja. Block Bindings API:n avulla kehittäjät voivat laajentaa tätä kykyä edelleen yhdistämällä lohkot mihin tahansa dynaamiseen sisältöön – jopa mukautettujen kenttien ulkopuolelle. Jos dataa on tallennettu muualle, osoita lohkot helposti uuteen lähteeseen vain muutamalla koodirivillä. Lisää ulkoasutyökaluja klassisiin teemoihin Anna suunnittelijoille ja sivuston rakentajille, jotka käyttävät klassisia teemoja, pääsy päivitettyyn suunnittelukokemukseen. Ota käyttöön tuki välistys-, reunus-, typografia- ja väriasetuksille, vaikka et käyttäisikään theme.json-tiedostoa. Kun tuki on otettu käyttöön, uusia työkaluja lisätään automaattisesti sitä mukaa kun ne tulevat saataville. Tutustu parannuksiin lisäosakokemuksessa Nyt on helpompi tapa hallita lisäosariippuvuuksia. Lisäosien tekijät voivat tarjota uuden Requires Plugins -otsakkeen pilkulla erotetulla vaadittujen lisäosien tunnusten listalla, esittäen käyttäjille linkit asentaa ja aktivoida nuo lisäosat ensin. Suorituskyvyn päivitykset Tämä julkaisu sisältää 110+ suorituskyvyn päivitystä, mikä johtaa entistä nopeampaan sisältö- ja sivustoeditorin kokemukseen. Latautuminen on yli kaksi kertaa nopeampaa kuin 6.4:ssä, ja syötteen käsittelyn nopeus jopa viisi kertaa nopeampi kuin edellisessä julkaisussa. Käännettyjen (ei-englanninkielisten) sivustojen latausaika parani jopa 25% tässä julkaisussa suorituskykyisten käännösten ansiosta. Pari mainittavaa parannusta sisältävät AVIF-kuvatuen ja parannuksia lohkovariaatioiden rekisteröinnissä palautusfunktioilla. Yhä saavutettavampi Tämä julkaisu sisältää yli 65 saavutettavuusparannusta, tehden siitä saavutettavamman kuin koskaan. Se sisältää tärkeän korjauksen, joka poistaa esteet hallintavalikkojen alivalikoille ruudunlukuohjelmien käyttäjille ja muille, jotka navigoivat näppäimistöllä. Tämä julkaisu lisää myös korjauksia hallinnan kohdistustilojen värikontrastiin, elementtien sijaintiin ja kursorin kohdistukseen, muiden parannusten joukossa, jotka auttavat parantamaan WordPress-kokemusta kaikille. Lue lisää WordPress 6.5:stä Tutustu uuteen WordPress 6.5 -sivuun ja opi lisää tämän julkaisun lukuisista parannuksista ja ominaisuuksista – mukaan lukien lyhyet demot joistakin tärkeimmistä ominaisuuksista. Tutki Learn WordPress -sivustoa nopeille opetusvideoille, verkkotyöpajoille ja muille ilmaisille resursseille WordPress-tietämyksesi ja -taitojesi parantamiseen. Tutustu WordPress 6.5 -kenttäoppaaseen saadaksesi yksityiskohtaista teknistä tietoa ja kehittäjämuistiinpanoja auttaaksesi sinua rakentamaan WordPressillä ja hyödyntämään tämän julkaisun mahdollisimman hyvin. Muista tilata Kehittäjäblogi kehittäjäpäivityksille, ominaisuustutoriaaleille ja muulle hyödylliselle WordPress-sisällölle kehittäjänäkökulmasta. Lisätietoja asennuksesta, tiedostomuutoksista, korjauksista ja muista päivityksistä, lue 6.5-julkaisutiedotteet. 6.5 julkaisutiimi Jokaisella julkaisulla on monia liikkuvia osia, omat voittonsa ja haasteensa. Omistautunut joukko innokkaita avustajia auttaa pitämään asiat raiteillaan ja sujuvina. 6.5 on mahdollistettu monimuotoisella avustajien ryhmällä, aina valmiina puolustamaan ideoita, poistamaan esteitä ja ratkaisemaan ongelmia. Release Lead: Matt Mullenweg Release Coordinators: Akshaya Rane, Héctor Prieto, Mary Baum Core Tech Leads: David Baumwald, Pascal Birchler Editor Tech Leads: David Smith, Riad Benguella Core Triage Leads: Ahmed Kabir Chaion, Jb Audras, Rajin Sharwar Editor Triage Leads: Anne McCarthy, Fabian Kägy Design Leads: Benjamin Zekavica, Rich Tabor Marketing and Communication Leads: Dan Soschin, Lauren Stein Documentation Leads: Estela Rueda, Leonardus Nugraha, Steven Lin Performance Leads: Joe McGill, Mukesh Panchal Test Leads: Olga Gleckler, Patrick Lumumba, Vipul Ghori Default Themes Leads: Carolina Nymark Kiitos avustajille WordPress uskoo julkaisemisen demokratisointiin ja vapauksiin, jotka tulevat avoimen lähdekoodin mukana. Tätä ideaa tukee maailmanlaajuinen ja monimuotoinen yhteisö ihmisiä, jotka tekevät yhteistyötä vahvistaakseen ohjelmistoa. WordPress 6.5 heijastaa noin 700 avustajan lukemattomia ponnisteluja vähintään 57 maassa. Tämä julkaisu toivotti myös tervetulleeksi yli 150 ensikertalaista avustajaa! Heidän yhteistyönsä toimitti yli 2 500 parannusta ja korjausta, varmistaen vakaan julkaisun kaikille – osoitus WordPressin avoimen lähdekoodin yhteisön voimasta ja kyvystä. _ck_ · Aaron Jorbin · Aaron Robertshaw · Abdullah Mamun · Abha Thakor · Abhishek Deshpande · abletec · acosmin · Adam Pickering · Adam Silverstein · Adam Zieliński · Adarsh Akshat · admcfajn · adrianduffell · Ahmed Chaion · Ahmed Saeed · Ajith R N · Akash Muchandikar · Aki Hamano · Akira Tachibana · akmelias · Akramul Hasan · Akshaya Rane · Alain Schlesser · Alan Fuller · Alex · Alex Concha · Alex King · Alex Kirk · Alex Lende · Alex Mills · Alex Stine · Alexandre Buffet · AlexKole · Amber Hinds · Amy Hendrix (sabreuse) · Amy Kamala · Anand Upadhyay · Anders Norén · Andrea Fercia · Andrei Draganescu · Andrei Lupu · Andrew Hayward · Andrew Hutchings · Andrew Nacin · Andrew Norcross · Andrew Ozz · Andrew Serong · andrewleap · Andrii Balashov · André Maneiro · Andy Fragen · Andy Peatling · Aneesh Devasthale · Ankit K Gupta · Ankit Panchal · Anne McCarthy · Anthony Burchell · Antoine · Anton · Anton Lukin · Anton Timmermans · Antonella · Antonio D. · Antonis Lilis · arena94 · Ari Stathopoulos · Arslan Kalwar · Artemio Morales · Arthur Chu · Arun Chaitanya Jami · Arun Sharma · Arunas Liuiza · Asad Polash · Ashi