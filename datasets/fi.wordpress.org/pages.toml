title = "WordPress 6.6 “Dorsey” – WordPress.org Suomi"
description = "Tervetuloa WordPress 6.6 “Dorseyn” pariin, joka on nimetty legendaarisen yhdysvaltalaisen big band orkesterijohtajan, Tommy Dorseyn mukaan. Pehmeä-äänisestä pasuunastaan ja sävellyksistään tunnettu…"
full_description = "17.7.2024 By Toni Viemerö WordPress 6.6 “Dorsey” Tervetuloa WordPress 6.6 “Dorseyn” pariin, joka on nimetty legendaarisen yhdysvaltalaisen big band orkesterijohtajan, Tommy Dorseyn mukaan. Pehmeä-äänisestä pasuunastaan ja sävellyksistään tunnettu Dorseyn musiikki lumosi kuulijat sen emotionaalisella syvyydellä ja eloisalla energialla. Anna sydämesi keinua, laulaa ja tanssia Dorseyn big band -soundin syvien vaskisointujen tahdissa, kun tutustut WordPress 6.6:n uusiin ominaisuuksiin ja parannuksiin. Hei, 6.6! WordPress 6.6 lunastaa lupauksen paremmasta webistä tuomalla tyyliä, hienostuneisuutta ja joukon luovia mahdollisuuksia sivustonrakennuskokemukseesi. Tämä versio auttaa sinua tekemään enemmän vaivattomasti, tarjoten parannettuja työkaluja käden ulottuville ja antaen ennennäkemättömän voiman kulissien takana. Löydät lisää tapoja luoda kauniita ja yhtenäisiä suunnitteluelementtejä koko sivustollesi, uuden asettelun nopeille sivun esikatseluille sivustoeditorissa ja automaattiset palautukset epäonnistuneille lisäosien automaattisille päivityksille — monien muiden kohokohtien joukossa. Uusien ominaisuuksien lisäksi “Dorsey” jatkaa suorituskyvyn ja saavutettavuuden parannusten tarjoamista, joita voit odottaa jokaiselta WordPress-julkaisulta. Tutustu WordPress 6.6:n tarjoamiin mahdollisuuksiin ja valmistaudu sen ominaisuuksien avulla viemään sivustosi uusiin sfääreihin. Lataa WordPress 6.6 “Dorsey” Mitä uutta 6.6:ssa Lisää suunnitteluvaihtoehtoja lohkoteemoihin Luo väri- tai fonttijoukkoja moninkertaistaaksesi suunnitteluyhdistelmät yhden teeman sisällä. Nämä joukot tarjoavat enemmän hallittuja suunnittelumahdollisuuksia, sallien visuaalisen monipuolisuuden sivuston laajempien tyyliohjeiden puitteissa. Yksinkertaista työnkulkuasi uudella sivujen asettelulla sivustoeditorissa Näet kaikki sivusi ja esikatselun valitusta sivusta uudella vierekkäisellä asettelulla sivustoeditorissa. Mielenrauhaa lisäosien automaattiseen päivitykseen Nauti lisäosien automaattisten päivitysten mukavuudesta turvallisten palautusten avulla, jos jokin menee pieleen. Tämä tarjoaa sivustollesi uuden tason turvallisuutta, parannettua toiminnallisuutta heti sen tullessa saataville ja tämän toteuttaminen ei vaadi sinulta juuri lainkaan aikaa tai kaistanleveyttä. Mukauta sisältöä synkronoiduissa lohkomalleissa Tee sisältömuutoksia jokaisessa synkronoidun lohkomallin esiintymässä säilyttäen samalla yhtenäisen tyylin näiden välillä. Aseta nämä yliajot otsikko-, kappale-, painike- ja kuvalohkoille, kun ne on sijoitettu synkronoituun lohkomalliin. Suorituskyky WordPress 6.6 sisältää tärkeitä päivityksiä, kuten päällekkäisten WP_Theme_JSON-kutsujen poistamisen, suurten automaattisesti ladattujen asetusten siivoamisen ja tarpeettomien riippuvuuksien karsimisen taaksepäinyhteensopivuuteen vanhoille selaimille. Muita kohokohtia ovat artikkeliupotusten viivästetty lataus (lazy loading), uusi data-wp-on-async-direktiivi ja sivupohjat, jotka latautuvat keskimäärin 35% nopeammin editorissa. Saavutettavuus Tämä julkaisu sisältää 58 saavutettavuuskorjausta ja -parannusta. Nämä keskittyvät WordPress-kokemuksen perusteisiin, erityisesti uuteen datanäkymien komponenttiin, joka tukee uutta sivuston muokkauskokemusta ja alueille, kuten lohkojen lisääjä, jotka tarjoavat tärkeän vuorovaikutukseen lohkojen ja lohkomallien kanssa. Ja paljon muuta Käy ominaisuusesittelyssä saadaksesi kattavan yleiskatsauksen kaikista uusista ominaisuuksista ja parannuksista WordPress 6.6:ssa. Katso mitä uutta Lue lisää WordPress 6.6:sta Tutki Learn WordPress -sivustoa nopeille opetusvideoille, verkkotyöpajoille ja muille ilmaisille resursseille WordPress-tietämyksesi ja -taitojesi parantamiseen. WordPress 6.6 -kenttäopas sisältää yksityiskohtaista teknistä tietoa ja kehittäjämuistiinpanot auttavat sinua rakentamaan WordPressillä ja hyödyntämään tämän julkaisun mahdollisimman hyvin. Muista tilata Kehittäjäblogi kehittäjäpäivityksille, ominaisuustutoriaaleille ja muulle hyödylliselle WordPress-sisällölle kehittäjänäkökulmasta. Lisätietoja asennuksesta, tiedostomuutoksista, korjauksista ja muista päivityksistä, lue 6.6-julkaisutiedotteet. 6.6 julkaisutiimi Jokainen julkaisu tulee omistautuneelta joukolta innokkaita avustajia, jotka auttavat pitämään asiat raiteillaan ja sujuvina. Tiimi, joka johti 6.6 julkaisun, on monimuotoinen avustajien ryhmä, aina valmiina puolustamaan ideoita, poistamaan esteitä ja ratkaisemaan ongelmia. Release Lead: Matt Mullenweg Release Coordinator: Meher Bala Core Tech Lead: Jb Audras Editor Tech Leads: Ella van Durpe, Vicente Canales Core Triage Leads: Olga Gleckler, Nazmul Hasan Robin Editor Triage Leads: Fabian Kägy, Damon Cook Documentation Leads: JuanMa Garrido, Jenny Dupuy, Josep Morán Marketing & Communications Lead: Mary Baum Test Lead: Anne McCarthy Design Lead: Rich Tabor Performance Lead: Adam Silverstein Kiitos avustajille WordPress uskoo julkaisemisen demokratisointiin ja vapauksiin, jotka tulevat avoimen lähdekoodin mukana. Tätä ideaa tukee maailmanlaajuinen ja monimuotoinen yhteisö ihmisiä, jotka tekevät yhteistyötä vahvistaakseen ohjelmistoa. WordPress 6.6 heijastaa yli 630 avustajan lukemattomia ponnisteluja vähintään 51 maassa. Tämä julkaisu toivotti myös tervetulleeksi yli 150 ensikertalaista avustajaa! Heidän yhteistyönsä toimitti yli 1 900 parannusta ja korjausta, varmistaen vakaan julkaisun kaikille – osoitus WordPressin avoimen lähdekoodin yhteisön voimasta ja kyvystä. 1naveengiri · Aaron Jorbin · Aaron Robertshaw · aatanasov · abditsori · Abdulrahman Alani · Abha Thakor · abhi3315 · Abhijit Rakas · abitofmind · Adam Harley (Kawauso) · Adam Silverstein · Adam Zieliński · adamhorne · Adel Tahri · adrianduffell · aduth · Aezaz Shekh · Ahmed Kabir Chaion · ajfleming · Ajit Bohra · Ajith R N · Akash Dhawade · Aki Hamano · Akira Tachibana · akmelias · Akshat Kakkad · Alan Fuller · Albert Juhé Lluveras · alesflex · Alex Cicovic · Alex Concha · Alex Kozack · Alex Lende · Alex Stine · Alexandre Buffet · 