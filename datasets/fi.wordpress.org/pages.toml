title = "Chat – WordPress.org Suomi"
description = "WordPress Finland -slack-yhteisö on kasvanut tasaisesti ja jäseniä on jo yli 1 000 Suomen jokaisesta kolkasta. Keskustelu on hyvin aktiivista päivittäin. Yhteisö tarjoaa erinomaisen paikan uusien ihmisten kohtaamiseen, apua kaikenlaisiin WordPressiin liittyviin ongelmiin sekä tietoa tulevista tapahtumista eri puolilla Suomea. Mikä on Slack? Slack tarjoaa aiheittain järjestettyjä keskustelualueita sekä yksityisiä ryhmiä ja mahdollisuuden lähettää yksityisviestejä. […]"
full_description = "Chat WordPress Finland -slack-yhteisö on kasvanut tasaisesti ja jäseniä on jo yli 1 000 Suomen jokaisesta kolkasta. Keskustelu on hyvin aktiivista päivittäin. Yhteisö tarjoaa erinomaisen paikan uusien ihmisten kohtaamiseen, apua kaikenlaisiin WordPressiin liittyviin ongelmiin sekä tietoa tulevista tapahtumista eri puolilla Suomea. Mikä on Slack? Slack tarjoaa aiheittain järjestettyjä keskustelualueita sekä yksityisiä ryhmiä ja mahdollisuuden lähettää yksityisviestejä. Se on vähän kuin IRC, mutta päivitetty tälle vuosituhannelle. Slack toimii niin selaimessa kuin erillisenä sovelluksena, ja on saatavilla usealle alustalle, myös mobiiliin. https://slack.com/apps. Jos et ole ennen käyttänyt Slackia, voit katsoa läpi nämä videot ja lukea perusasioista. Liity WordPress Finland Slack-yhteisöön Jos haluat osallistua keskusteluihin kansainvälisellä tasolla, WordPressillä on oma Slack-yhteisönsä, jonka liittymisohjeet löydät täältä: https://make.wordpress.org/chat/ Kanavat Keskustelut #wordpress-finland / #in-english Keskustelut ovat pääasiassa suomeksi, mutta englanninkieliset jäsenet ovat enemmän kuin tervetulleita! Kaksi pääkanavaa ovat #wordpress-finland ja #in-english. Devaajat #devaajat Olet sitten aloittelija tai kokenut devaaja, opit väkisinkin jotain vain seuraamalla keskustelua #devaajat-kanavalla. Tämä kanava on täynnä devaajia jakamassa koodia ja ratkaisemassa ongelmia. Rekry #rekry Työpaikkailmoitukset löytyvät #rekry-kanavalta. Kanavalta löytyy RSS-integraatio, joka listaa WordPress-ammatteja kaikkialta Suomesta. Yritykset kirjoittavat usein myös suoraan viestejä kanavalle, jolloin sinulla on mahdollisuus olla suoraan yhteydessä henkilöön, joka voi auttaa sinua rekrytointiprosessissa. Meetup-ryhmät #meetups Jos haluat yhteyden ihmisiin, jotka tapasit meetupissa, voi hyvin olla että löydät heidät yleiseltä #meetups-kanavalta. Sieltä on myös hyvä aloittaa jos harkitset oman miitin järjestämistä. Kaikki suomalaisten meetupien järjestäjät löytyvät sieltä, joten voit kysyä heiltä neuvoa ja saada vinkkejä joiden avulla pääset alkuun. Jokaisella miitillä on myös oma kanavansa jossa jutellaan tulevista tapaamisista ja sovitaan epävirallisista kokoontumisista, joista ei välttämättä ole ilmoitettu Meetup.comissa: #meetups-helsinki – Helsinki#meetups-jyvaskyla – Jyväskylä#meetups-oulu – Oulu#meetups-tampere – Tampere#meetups-turku – Turku Polyglots #kielitaiturit #kielitaiturit-kanavalta löydät suomenkielisen WordPress-version kääntäjiä ja vastuuhenkilöitä sekä lisäosa- ja teemakehittäjiä. Mikäli sinulla on teknisiä kysymyksiä teemojen tai lisäosien kääntämisestä tai yksinkertaisesti haluat auttaa suomenkielisissä käännöksissä yleisesti, tämä kanava on oikea paikka. Vieraile WordPress Slack #polyglots kanavalla, mikäli haluat osallistua muiden kielten kääntämiseen."
