["https://fi.wordpress.org/about"]
title = "Tietoja – WordPress.org Suomi"
description = "our mission: democratize publishing the freedom to build. the freedom to change. the freedom to share. our story WordPress started in 2003 when Mike Little and Matt Mullenweg created a fork of b2/cafelog. The need for an elegant, well-architected personal publishing system was clear even then. Today, WordPress is built on PHP and MySQL, and licensed […]"
full_description = "tehtävämme: demokratisoida julkaiseminen vapaus rakentaa. vapaus muuttaa. vapaus jakaa. tarinamme WordPress started in 2003 when Mike Little and Matt Mullenweg created a fork of b2/cafelog. The need for an elegant, well-architected personal publishing system was clear even then. Today, WordPress is built on PHP and MySQL, and licensed under the GPLv2. It is also the platform of choice for over 43% of all sites across the web. Avoimen lähdekoodin WordPress-projekti on kehittynyt progressiivisesti ajan myötä – sitä ovat tukeneet ammattitaitoiset, innostuneet kehittäjät, suunnittelijat, tutkijat, bloggaajat ja muut. WordPress tarjoaa kenelle tahansa mahdollisuuden luoda ja jakaa kotitekoisista henkilökohtaisista anekdooteista maailmaa muuttaviin liikkeisiin. Ihmiset, joilla on rajoitettu tekninen kokemus, voivat käyttää sitä ”suoraan pakkauksesta”, ja tekniikasta taitavammat ihmiset voivat muokata sitä merkittävillä tavoilla. tehtävämme WordPress on suunniteltu kaikille. Uskomme, että loistavien ohjelmistojen tulisi toimia minimaalisella asennuksella, korostaa saavutettavuutta, suorituskykyä, turvallisuutta ja helppokäyttöisyyttä. WordPressin perusohjelmisto on yksinkertainen ja ennustettava, ja se tarjoaa tehokkaita ominaisuuksia kasvuun ja menestykseen. WordPress on avointa lähdekoodia. Ajatusta julkaisemisen demokratisoimisesta ja avoimen lähdekoodin mukanaan tuomista vapauksista tukee suuri joukko ihmisiä, jotka tekevät yhteistyötä ja osallistuvat tähän projektiin. WordPress on vastaanottava ja inklusiivinen. Avustajiemme intohimo edistää WordPressin menestystä, mikä puolestaan ​​auttaa sinua saavuttamaan tavoitteesi. WordPress-avustajat työskentelevät ympäri maailmaa ja he ovat omistaneet lukemattomia tunteja rakentaakseen työkalun, joka tarjoaa äänensä kaikille. neljä vapautta WordPress on lisensoitu General Public Licencellä (GPLv2 tai uudempi), joka tarjoaa neljä perusvapautta: 0 Vapaus käyttää ohjelmaa mihin tahansa tarkoitukseen. 1 Vapaus tutkia ohjelman toimintaa ja muuttaa sitä niin, että se tekee mitä haluat. 2 Vapaus jakaa uudelleen. 3 Vapaus jakaa kopioita muokatuista versioistasi muille. teknologia Opi WordPressistä, missä se on ollut ja mihin se on menossa. VaatimuksetOminaisuudetSecurityRoadmapHistory yksityiskohdat Sukella taustaietoihin kuten GPL-lisenssiin sekä muihin käytäntöihin. DomainsLisenssiSaavutettavuusTietosuojaselosteTilastot ihmiset Opi yhteisöstä, miten tulemme toimeen ja osoita ylpeyttämme. FilosofiaEtiquetteLogotWordPress-ihmiset"
