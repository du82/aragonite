["https://fiddlemath.net/quotes"]
title = "Quotes - Tend the Fire"
description = "Matt Elder's blog"
full_description = "Brain candy is the most dangerous thing there is for a thriving mind. - 12thCandidate. Zen and the Art of Hacking I think nobody should be certain of anything. If you’re certain, you’re certainly wrong, because nothing deserves certainty, and so one ought always to hold all one’s beliefs with a certain element of doubt and one ought to be able to act vigorously in spite of this doubt. - Bertrand Russell The fact that an opinion has been widely held is no evidence that it is not utterly absurd; indeed, in view of the silliness of the majority of mankind, a widespread belief is more often likely to be foolish than sensible. - Bertrand Russell. Marriage and Morals. It’s a magical world, Hobbes ol’ buddy - Let’s go exploring! - Bill Watterson: Calvin. Calvin and Hobbes A car, a blue convertible, sleek and desirable, came sweeping west out of Beverly Hills along the, as I understand it, gracious curves of Sunset Boulevard. Anybody seeing such a car would have wanted it. If people had turned out not to want it very much, the makers would have redesigned it and redesigned it until they did. The world is now full of things like this, which is, of course, why everybody is in such a permanent state of want. - Douglas Adams. The Salmon of Doubt Abstractions are fine, but I think people also have to breathe air and eat bread. - Herman Hesse. The Glass Bead Game (translated) If you’re not prepared to be wrong, you’ll never come up with anything original. - Ken Robinson. TED 2006. As lawyers love to forget, our system for defending rights such as fair use is astonishingly bad. […] It costs too much, it delivers too slowly, and what it delivers often has little connection to the justice underlying the claim. The legal system may be tolerable for the very rich. For everyone else, it is an embarrassment to a tradition that prides itself on the rule of law. - Lawrence Lessig, Free Culture, p 187 The acceptance of a creed, any creed, entitles the acceptor to membership in the sort of artificial extended family we call a congregation. It is a way to fight loneliness. - Kurt Vonnegut: Palm Sunday."
