full_description = "Tonight when I biked home, I was caught uprepared in rain. For a mile or two, I biked with my head bent and shoulders slumped, trying reflexively to minimize the cross-section of me exposed to the rain, thinking to myself how much the rain sucked. Then, as I passed under a bridge, I sat up straight, squared my shoulders, and faced driectly ahead. On the other side of that bridge, I didn’t care that I was getting wet – because who cares, I’m bigger, better, and meaner than the rain getting me wet. I rather enjoyed the rest of my ride home. ← Previous Post Next Post →"
