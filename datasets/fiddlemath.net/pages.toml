full_description = "From Wikipedia: “Record linkage” is the term used by statisticians, epidemiologists, and historians, among others, to describe the process of joining records from one data source with another that describe the same entity. Commercial mail and database applications refer to it as “merge/purge processing” or “list washing”. Computer scientists often refer to it as “data matching” or as the “object identity problem”. […] This profusion of terminology has led to few cross-references between these research communities. ← Previous Post Next Post →"
