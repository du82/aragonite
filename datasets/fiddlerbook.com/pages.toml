title = "Fiddler Web Debugger - Fiddler Book Errata"
full_description = "You can do so either by clicking Help > Send Feedback from inside Fiddler, or email me directly: [email protected]. Please include the Book Version number from the copyright page, and tell me whether you're reading the paperback or the ebook/PDF. Error #1 Fixed in v2.0.1Typo-The property bHasResponse was spelled incorrectly (bHasReponse) in the table of contents and on page 230. The description of the Web Sessions List's Save submenu incorrectly listed the All Sessions... command. This command is only available on the Main Menu's File > Save submenu. The description of the AutoResponder's header Action incorrectly suggested that the header would be set on the matching Web Session's Response. It is actually added to the Request. Set a Request header to a specified value. For instance, use *header:Cache-Control=no-cache to indicate that a server or proxy should not return a cached response. Leave the value blank to delete the named header. On Page 184, the SendDataStruct structure definition is missing the specification of the character set used to marshal the structure. This could cause the string to be interpreted incorrectly as ANSI instead of Unicode."
