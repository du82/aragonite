title = "dkg's mozilla work"
full_description = "This page is for my blackmodern skin for mozilla 1.6. It was built by negating all the colors in the very good Gray Modern theme by Johannes Schellen, which is itself an adaptation of the Modern theme that ships with mozilla 1.6. i'm also providing a .deb file that i made for debian's sarge distribution that installs the Mozilla calendar component for the version of mozilla that's currently in sarge (1.6-5). The file should have the following md5 sum: This is my first attempt ever at making a .deb, and i made it from the binary xpi package that can be found here. i'm sure i screwed up something in the packaging process, since it's the first time, but it actually appears to work for me. Please give me feedback if you try it. i've listed myself as the maintainer in the deb, though i fully expect that the upcoming mozilla-calendar package currently in sid (1.7-something) will supercede this one and will probably be better packaged."
