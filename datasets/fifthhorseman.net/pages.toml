["https://fifthhorseman.net/11Sept2001-letter.html"]
title = "Open Letter to All Americans about 11 Sept, 2001"
full_description = 'Since the tragedy of September 11, 2001, I share the profound grief of citizens around the world for the victims of these heinous attacks. I also fear that the same grief in this country will be twisted into a threefold call for a vengeful war abroad, for an erosion of human rights, and for vicious intolerance and violence within our borders. We cannot let this happen. There is no justification (and can be none) for the crimes committed by those who hijacked the planes and who planned and coordinated the attacks. But by the same token, there can be no justification for responding with further innocent bloodshed. We are in the unusual position of having nearly unanimous support and sympathy from the international community for bringing the perpetrators of this crime to justice. What better opportunity to reassert our faith in the international community and to demonstrate our solidarity with the world in this time of global fear? And what better way to begin down the path of healing than by demanding a peaceful justice through international law, not a vengeance by the sword? Let us work together towards a resolution that treats the other humans in this world as the sisters and brothers they are, not as vipers or demons to be destroyed. It must take powerful hatred and fear for human beings to destroy as many lives as were lost on Tuesday in New York and DC. Unfortunately, hatred and fear have a powerful ripple effect. We must not sacrifice ourselves to these unworthy responses. Already, lawmakers and the surveillance establishment are attempting to further erode the rights of our citizens. These attempts are just as much an attack on what America stands for as are the strikes on New York and DC. The lives of many Americans have been shattered by abuses of powers such as those Ashcroft and others are looking to expand. In only one example, the victims of the McCarthy era would not have been so many had the domestic intelligence establishment been held to a more reasonable standard. And as the surveillance powers expand, so will the damage inflicted on the American public both in our livelihoods and in our thought. If we are to defend "the American way of life," we must begin with defending our most basic rights: the freedoms of expression and religion, and the rights to due process and against unreasonable search and seizure.'
year_published = 2025
clearnet = "https://fifthhorseman.net/11Sept2001-letter.html"
