title = "La Figlia del Presidente - La Pizzeria di Maria Cacialli"
description = "L'archiviazione tecnica o l'accesso sono strettamente necessari al fine legittimo di consentire l'uso di un servizio specifico esplicitamente richiesto dall'abbonato o dall'utente, o al solo scopo di effettuare la trasmissione di una comunicazione su una rete di comunicazione elettronica."
full_description = "Situata a Via del Grande Archivio 24, nei pressi del Centro Storico di Napoli è stata fondata da Maria Cacialli, figlia di Ernesto, lo storico Pizzaiolo che consegnò un pezzo di Napoli a Bill Clinton durante il G7 del 1994 La pizzeria nasce da un progetto di Felice Messina e Maria Cacialli, figlia di Ernesto, pizzaiolo del Centro Storico divenuto famoso per aver simpaticamente “trascinato” nel 1994 l’allora Presidente degli Stati Uniti Bill Clinton nella sua pizzeria per offrirgli un “pezzo di Napoli”. Impossibile passare per il centro storico di Napoli senza aver assaggiato “La Regina”, ovvero la Pizze Fritte per eccellenza. Il nostro è un menù semplice, così come gli ingredienti che compongono le nostre pizze. Ricco di tradizione e tanta umiltà e passione per il lavoro che svolgiamo ogni giorno. Cresciuti con le mani in pasta, i miei figli oggi rappresentano la terza generazione. Entrambi alla guida della nostra pizzeria, possiamo chiamarli “I Nipoti del Presidente” La nostra è una pizza semplice, composta da ingredienti di qualità, ma sapete perché è più saporita? Perché l’ammore che ci mettiamo noi, non lo mette nessuno. Ad ogni domanda la sua risposta, qualora non ci fosse la domanda che vorresti porci, scrivici su Facebook Messanger. Ci troviamo a Via del Grande Archivio 24 a due passi dalla metropolitana “DUOMO” e San Gregorio Armeno. A differenza di quanto si possa pensare in settimana non aspetterai per nulla, mentre durante il fine settimana o giorni festivi, potresti attendere un po’ di tempo. Ma nun c’è pensà, goditi un frittino durante l’attesa che ne vale la pena. Puoi trovare spazio per la tua auto a Corso Umberto, strada adiacente a Via del Grande Archivio 24 dove siamo situati. Siamo aperti il Lunedì solo a pranzo e dal martedì al sabato a pranzo e cena. La domenica siamo aperti a pranzo solo a Novembre e Dicembre. Occasionalmente potremmo variare i nostri giorni ed orari di apertura, per cui fai riferimento al nostro profilo google, facebook ed instagram per sapere se siamo aperti quando passerai a trovarci."
year_published = 2021
year_updated = 2024
clearnet = "https://figliadelpresidente.com"
