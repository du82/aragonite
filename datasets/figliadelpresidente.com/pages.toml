full_description = "/*! elementor - v3.22.0 - 26-06-2024 */ .elementor-widget-text-editor.elementor-drop-cap-view-stacked .elementor-drop-cap{background-color:#69727d;color:#fff}.elementor-widget-text-editor.elementor-drop-cap-view-framed .elementor-drop-cap{color:#69727d;border:3px solid;background-color:transparent}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap{margin-top:8px}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap-letter{width:1em;height:1em}.elementor-widget-text-editor .elementor-drop-cap{float:left;text-align:center;line-height:1;font-size:50px}.elementor-widget-text-editor .elementor-drop-cap-letter{display:inline-block} Chi siamo L’indirizzo del nostro sito web è: www.figliadelpresidente.com Quali dati personali raccogliamo e perché li raccogliamo Commenti Quando i visitatori lasciano commenti sul sito, raccogliamo i dati mostrati nel modulo dei commenti, oltre all’indirizzo IP del visitatore e la stringa dell’agente utente del browser per aiutare a rilevare lo spam. Una stringa anonimizzata creata dal tuo indirizzo email (chiamata anche hash) può essere fornita al servizio Gravatar per vedere se lo stai utilizzando. La politica sulla privacy del servizio Gravatar è disponibile qui: https://automattic.com/privacy/. Dopo l’approvazione del tuo commento, la tua immagine del profilo è visibile al pubblico nel contesto del tuo commento. Media Se carichi immagini sul sito web, dovresti evitare di caricare immagini con dati di posizione incorporati (EXIF GPS) inclusi. I visitatori del sito web possono scaricare ed estrarre qualsiasi dato di posizione dalle immagini sul sito web. Moduli di contatto Cookie Se lasci un commento sul nostro sito puoi scegliere di salvare il tuo nome, indirizzo email e sito web nei cookie. Questo è per tua comodità in modo che tu non debba inserire nuovamente i tuoi dati quando lasci un altro commento. Questi cookie dureranno per un anno. Se visiti la nostra pagina di login, imposteremo un cookie temporaneo per determinare se il tuo browser accetta i cookie. Questo cookie non contiene dati personali e viene eliminato quando chiudi il browser. Quando accedi, imposteremo anche diversi cookie per salvare le tue informazioni di accesso e le tue scelte di visualizzazione dello schermo. I cookie di accesso durano due giorni, mentre i cookie per le opzioni dello schermo durano un anno. Se selezioni “Ricordami”, il tuo accesso persisterà per due settimane. Se esci dal tuo account, i cookie di accesso verranno rimossi. Se modifichi o pubblichi un articolo, un cookie aggiuntivo verrà salvato nel tuo browser. Questo cookie non include dati personali e indica semplicemente l’ID del post dell’articolo che hai appena modificato. Scade dopo 1 giorno. Contenuti incorporati da altri siti web Gli articoli su questo sito possono includere contenuti incorporati (ad esempio video, immagini, articoli, ecc.). I contenuti incorporati da altri siti web si comportano esattamente allo stesso modo come se il visitatore avesse visitato l’altro sito web. Questi siti web possono raccogliere dati su di te, utilizzare cookie, incorporare ulteriori tracciamenti di terze parti e monitorare la tua interazione con quel contenuto incorporato, inclusa la tracciatura della tua interazione con il contenuto incorporato se hai un account e sei connesso a quel sito web. Analisi Con chi condividiamo i tuoi dati Se richiedi un reset della password, il tuo indirizzo IP sarà incluso nell’email di reset. Per quanto tempo conserviamo i tuoi dati Se lasci un commento, il commento e i suoi metadati vengono conservati indefinitamente. Questo è per poter riconoscere e approvare automaticamente eventuali commenti di follow-up anziché tenerli in una coda di moderazione. Per gli utenti che si registrano sul nostro sito web (se presenti), memorizziamo anche le informazioni personali che forniscono nel loro profilo utente. Tutti gli utenti possono vedere, modificare o cancellare le loro informazioni personali in qualsiasi momento (eccetto non possono cambiare il loro nome utente). Gli amministratori del sito web possono anche vedere e modificare queste informazioni. Quali diritti hai sui tuoi dati Se hai un account su questo sito o hai lasciato commenti, puoi richiedere di ricevere un file esportato dei dati personali che abbiamo su di te, inclusi tutti i dati che ci hai fornito. Puoi anche richiedere che cancelliamo tutti i dati personali che abbiamo su di te. Questo non include i dati che siamo obbligati a conservare per scopi amministrativi, legali o di sicurezza. Dove inviamo i tuoi dati I commenti dei visitatori possono essere controllati attraverso un servizio di rilevamento automatico dello spam."
