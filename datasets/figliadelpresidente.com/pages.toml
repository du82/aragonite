full_description = "/*! elementor - v3.22.0 - 26-06-2024 */ .elementor-widget-text-editor.elementor-drop-cap-view-stacked .elementor-drop-cap{background-color:#69727d;color:#fff}.elementor-widget-text-editor.elementor-drop-cap-view-framed .elementor-drop-cap{color:#69727d;border:3px solid;background-color:transparent}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap{margin-top:8px}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap-letter{width:1em;height:1em}.elementor-widget-text-editor .elementor-drop-cap{float:left;text-align:center;line-height:1;font-size:50px}.elementor-widget-text-editor .elementor-drop-cap-letter{display:inline-block} Questa politica sui cookie è stata aggiornata l’ultima volta il 2 Luglio 2024 e si applica ai cittadini e ai residenti permanenti legali dello Spazio Economico Europeo e della Svizzera.1. IntroduzioneIl nostro sito web, https://figliadelpresidente.com (di seguito: “il sito web”) utilizza i cookie e altre tecnologie correlate (per comodità tutte le tecnologie sono definite “cookie”). I cookie vengono anche inseriti da terze parti che abbiamo ingaggiato. Nel documento sottostante ti informiamo sull’uso dei cookie sul nostro sito web.2. Cosa sono i cookie?I cookie sono dei semplici file spediti assieme alle pagine di questo sito e salvati dal tuo browser sul disco rigido del tuo computer o altri dispositivi. Le informazioni raccolte in essi possono venire rispediti ai nostri server oppure ai server di terze parti durante la prossima visita.3. Cosa sono gli script?Uno script è un pezzo di codice usato per far funzionare correttamente ed interattivamente il nostro sito. Questo codice viene eseguito sui nostri server o sul tuo dispositivo.4. Cos'è un web beacon?Un web beacon (o pixel tag) è un piccolo, invisibile pezzo di testo o immagine su un sito che viene usato per monitorare il traffico di un sito web. Per fare questo, diversi dati su di te vengono conservati utilizzando dei web beacon.5. Cookie5.1 Cookie tecnici o funzionaliAlcuni cookie assicurano il corretto funzionamento del sito e che le tue preferenze rimangano valide. Piazzando cookie funzionali, rendiamo più facile per te visitare il nostro sito web. In questo modo non devi inserire ripetutamente le stesse informazioni quando visiti il nostro sito web, per esempio, l’oggetto rimane nel tuo carrello finché non hai pagato. Possiamo piazzare questi cookie senza il tuo consenso.5.2 Cookie statisticiUtilizziamo i cookie statistici per ottimizzare l’esperienza del sito web per i nostri utenti. Con questi cookie statistici otteniamo approfondimenti sull’uso del nostro sito web. Chiediamo il tuo permesso per piazzare cookie statistici.5.3 Cookie pubblicitariSu questo sito web utilizziamo i cookie pubblicitari, che ci permettono di ottenere informazioni sui risultati della campagna. Questo avviene sulla base di un profilo che creiamo in base al tuo comportamento su https://figliadelpresidente.com. Con questi cookie tu, in qualità di visitatore del sito web, sei collegato a un ID univoco, ma questi cookie non profilano il tuo comportamento e i tuoi interessi per pubblicare annunci pubblicitari personalizzati.5.4 Cookie di marketing/tracciamentoI cookie di marketing/tracciamento sono cookie o qualsiasi altra forma di memorizzazione locale, utilizzati per creare profili utente per visualizzare pubblicità o per tracciare l’utente su questo sito web o su diversi siti web per scopi di marketing simili.Visto che questi cookie sono segnalati come cookie traccianti, ti chiediamo il permesso di piazzarli.5.5 Social mediaSul nostro sito web abbiamo inserito contenuti di TikTok, Instagram, Facebook e WhatsApp per promuovere pagine web (ad es. “mi piace”, “pin”) o condividerle (ad es. “tweet”) su social network come TikTok, Instagram, Facebook e WhatsApp. Questo contenuto è incorporato con codice derivato da TikTok, Instagram, Facebook e WhatsApp e inserisce cookie. Questo contenuto potrebbe memorizzare ed elaborare alcune informazioni per la pubblicità personalizzata.Leggi l’informativa sulla privacy di questi social network (che possono cambiare regolarmente) per sapere cosa fanno con i tuoi dati (personali) che processano usando questi cookie. I dati ottenuti vengono anonimizzati quanto possibile. TikTok, Instagram, Facebook e WhatsApp si trovano negli Stati Uniti.6. Cookie inseriti Elementor Statistiche (anonimo) Consent to service elementor Utilizzo Usiamo Elementor per creazione di contenuti. Leggi tutto Condivisione dei dati Questi dati non sono condivisi con terze parti. Statistiche (anonimo) Nome elementor Scadenza persistente Funzione Salvare le azioni compiute dall’utente sul sito web WordPress Funzionale Consent to service wordpress Utilizzo Usiamo WordPress per sviluppo del sito web. Leggi tutto Condivisione dei dati Questi dati non sono condivisi con terze parti. Funzionale Nome WP_PREFERENCES_USER_* Scadenza persistente Funzione Salvare le preferenze utente Nome wpEmojiSettingsSupports Scadenza sessione Funzione Salvare i dettagli del browser Nome wordpress_test_cookie Scadenza sessione Funzione Controlla se i cookie possono essere piazzati Nome wp-settings-* Scadenza persistente Funzione Salvare le preferenze utente Nome wp-settings-time-* Scadenza 1 anno Funzione Salvare le preferenze utente Nome wordpress_logged_in_* Scadenza persistente Funzione Mantieni l'accesso degli utenti Google Analytics Statistiche Consent to service google-analytics Utilizzo Usiamo Google Analytics per statistiche del sito web. Leggi tutto Condivisione dei dati Per ulteriori informazioni, si prega di leggere Google Analytics Dichiarazione sulla Privacy. Statistiche Nome _ga Scadenza 2 anni Funzione Conta e traccia le visualizzazioni delle pagine Nome _gid Scadenza 1 giorno Funzione Conta e traccia le visualizzazioni delle pagine Nome _ga_* Scadenza 1 anno Funzione Conta e traccia le visualizzazioni delle pagine Google Fonts Pubblicità Consent to se