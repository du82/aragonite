er ulteriori informazioni su queste opzioni, consultare le istruzioni nella sezione Guida del tuo browser.Tieni presente che il nostro sito web potrebbe non funzionare correttamente se tutti i cookie sono disabilitati. Se cancelli i cookie nel vostro browser, essi verranno nuovamente inseriti dopo il consenso fornito quando visiterete nuovamente il nostro sito web.9. I tuoi diritti in relazione ai dati personaliHai i seguenti diritti relativi ai tuoi dati personali: Hai il diritto di sapere quando i tuoi dati personali sono necessari, cosa succede ad essi, quanto a lungo verranno mantenuti. Diritto di accesso: hai il diritto ad accedere ai tuoi dati personali dei quali siamo a conoscenza. Diritto di rettifica: hai il diritto di completare, correggere, cancellare o bloccare i tuoi dati personali quando lo desideri. Se ci darai il consenso per elaborare i tuoi dati, hai il diritto di revocare questo consenso e di eliminare i tuoi dati personali. Diritto di trasferire i tuoi dati: hai il diritto di richiedere tutti i tuoi dati dal controllore e trasferirli tutti quanti ad un altro controllore. Diritto di opposizione: hai il diritto di opporti al trattamento dei tuoi dati. Noi rispetteremo questa scelta, a meno che non ci siano delle basi valide per trattarli. Per esercitare questi diritti, non esitate a contattarci. Si prega di fare riferimento ai dettagli di contatto in fondo a questa Cookie Policy. Se hai un reclamo su come gestiamo i tuoi dati, vorremmo sentirti, ma hai anche il diritto di presentare un reclamo all’autorità di vigilanza (l’Autorità per la Protezione dei Dati).10. Dettagli di contattoPer domande e/o commenti riguardo la Cookie Policy e questa dichiarazione, per favore contattaci usando i seguenti dati di contatto:FOODPIZZA SRLS NAPOLI (NA) VIA GIULIO CESARE CAPACCIO 24 CAP 80142 Italia Sito web: https://figliadelpresidente.com Email: info@figliadelpresidente.com Questa politica sui cookie è stata sincronizzata con cookiedatabase.org il 20 Ottobre 202