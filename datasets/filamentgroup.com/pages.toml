full_description = '''Who we are Filament Group is small by design, and focused on working closely with client strategy, design and development teams to deliver exceptional user experience and usability. We adapt engagements to the client need — whether it be a UI concept prototype to establish the strategic vision for a new product; UI audit and usability review of existing platforms; or full-scale detailed UI system design and documentation. We're knowledgeable about front-end coding, accessibility and responsive principles, as well as branding standards and business goals, and strive to represent all these interests in the design. Todd Parker @toddmparker Todd Parker, Partner, brings over twenty-five years of experience creating highly functional, accessible and intuitive interfaces for all devices, from mobile devices to desktop, kiosks and TVs. Todd is the former project lead for the jQuery Mobile team and served on the jQuery board. Todd is co-author of the Peachpit book “Designing With Progressive Enhancement”, contributor to the O'Reilly “jQuery Cookbook” and frequent presenter on the topics of mobile design, vector graphics, progressive enhancement, accessibility, and responsive web design. Patty Toland @pattytoland Patty Toland, Partner, has more than thirty years consulting experience with corporate and institutional clients with a focus on communicating complex messages across a range of media; her expertise lies in developing robust communication strategies, information architecture, content strategy and system design. She is a coauthor of "Designing with Progressive Enhancement" with her Filament Group colleagues, and has spoke on design topics at Smashing Conf, Frontend Conference, Generate, and Beyond Tellerand. Prior to founding Filament Group, Patty worked at ZEFER Corp., US Peace Corps, Kohn Cruikshank Inc. and Harvard Business School.'''
