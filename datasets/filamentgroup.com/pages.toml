full_description = "Our (archived) open-source code We're no longer maintaining the 100+ projects we've published, but will keep them online as archived Github repositories. Responsive images & media Grunticon A grunt-based tool to make it easy to use SVG graphics with fallbacks for older browsers. Demo Code Article Issues Grumpicon Grunticon in the browser, for those not comfortable with command line. Project site Code Article Issues Picturefill A responsive image polyfill for picture, srcset, sizes, and more Project site Code Article Issues Mobile-first responsive techniques Ajax-Include Lazy-load portions of HTML to improve perceived performance (works with media queries too). Demo Code Article Issues Append-Around Responsively move markup in the DOM based on media queries. Demo Code Issues loadCSS A function for loading CSS asynchronously. Code Issues loadJS A function for loading JS asynchronously. Code Issues Scoped Media Query An element query workaround. A Sass mixin for scoping CSS styles to apply only within given selector/media query pairs. Code Article Issues Shoestring A lightweight, simple DOM utility made to run on a tight budget. Code Issues Feature tests & polyfills A Font Garde A variety of test cases and tools for safe font-icon usage. Demo Code Article Issues Fixed-fixed CSS position:fixed qualifier. Demo Code Article Issues Fixed-sticky A position:sticky polyfill that works with Fixed-Fixed. Demo Code Issues Overthrow A tiny, no-frills, framework-independent, targeted overflow: auto polyfill for use in responsive design. Demo Code Issues Script Media Query An @media (script) polyfill experiment Code Article Issues WOFF2 Feature Test A simple feature test for the WOFF2 font format. Code Article Issues Tools & Grunt tasks Component Just our typical auto-enhance-able UI component skeleton. Code Issues Cookie Get, set, or forget cookies! Code Issues Critical CSS A Node/PhantomJS utility for extracting critical CSS from your templates, for optimizing