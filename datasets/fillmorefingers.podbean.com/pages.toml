["https://fillmorefingers.podbean.com/e/qf-ep-106-tula-we-hardly-knew-ye"]
title = "QF: ep. #106 ”Tula, We Hardly Knew Ye” | QF: A Podcast About Howard Stern"
description = '''
During the Channel 9 years there was one appearance of Caroline Cossey aka "Tula the Transsexual" who showed up with her mother in tow and they were both horrified by their treatment at the hands of Stern, who relished the opportunity to dress up in drag any chance he could get.  
He conflated this show with a later appearance of Tula on the radio show in '92, where Wigtardo was hot for trans to the point where he wanted people out of the studio and the rest is banned audio history that you'll likely never hear again.  We managed to find that audio and combined a breakdown of both.
All thanks to Sam for helping with this one, which was rough indeed.'''
