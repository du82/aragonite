full_description = '''A podcast dedicated to discussion on all matters Howard Stern. Visit our Facebook group and join up for the odd time he's actually on the air live and we do a listening thread! Also the home of Radio Karate! visit our new YT page here: https://www.youtube.com/channel/UC-gQQs-c59bHb3QQM8zAgUA/ For the latest Jim Fixx/Fillmore page, join our Facebook group and PM me here: https://www.facebook.com/groups/1081190012234000/ Hi guys! Welcome back to the first in a multi-part NPD arc dealing with Wiggy's spouses past and present. Special thanks to Bob Dee our resident Narcissistic Personality Disorder specialist! If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: Finally Sam and I get to put this summit to rest! Enjoy, folks--sorry for the delay but we're back on track again! If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: Hey, folks--this is not a new format, so don't worry--it's something Sam and I thought would be a good idea for when there's some kind of a lull, just to explain the long layoff and answer some listeners questions. Our third episode of Radio Karate! focuses on stuff we enjoy that no self-respecting person should, however we're brave enough to admit it! Thanks as always to Cary, Derek, and Wayne (and Shawn who sadly could not make this one but hopefully he'll be on the next one!), my partners-in-shame. If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: Due to popular demand, we have finally gotten around to taking a stab at breaking down the infamous "Summit" video of 2013 in which a deluded, irrelevant pelican berates his staff for an hour and brags about how many listeners they have yet complains how little coverage they get and how many problems they have attracting A-list guests.'''
