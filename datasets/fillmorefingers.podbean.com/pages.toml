["https://fillmorefingers.podbean.com/e/qf-ep-121-the-qf-tribute-to-gilbert-gottfried"]
title = "QF: ep. #121 ”The QF Tribute to Gilbert Gottfried” | QF: A Podcast About Howard Stern"
description = '''
Hello, folks, zero promo, intro, outro, or fanfare in the video because sadly we're paying tribute to maybe the biggest legend in Stern Show history, Mr. Gilbert Gottfried, who passed away recently due to complications from recurrent ventricular tachycardia and myotonic dystrophy, both of which he kept from the public. Gilbert left behind an amazing wife Dara and two wonderful kids--Lily & Max--and we can't offer enough condolences to them. It was a sin for Gilbert to be banned from the show without any proper explanation as to why, and when you consider the amount of amazing radio he gave them over the decades, then it becomes downright evil. We loved him and we know you all did to, so we picked what we think are some of his best clips from the Stern show as well as from his own brilliant podcast. 
