full_description = '''A podcast dedicated to discussion on all matters Howard Stern. Visit our Facebook group and join up for the odd time he's actually on the air live and we do a listening thread! Also the home of Radio Karate! visit our new YT page here: https://www.youtube.com/channel/UC-gQQs-c59bHb3QQM8zAgUA/ For the latest Jim Fixx/Fillmore page, join our Facebook group and PM me here: https://www.facebook.com/groups/1081190012234000/ During the Channel 9 years there was one appearance of Caroline Cossey aka "Tula the Transsexual" who showed up with her mother in tow and they were both horrified by their treatment at the hands of Stern, who relished the opportunity to dress up in drag any chance he could get. He conflated this show with a later appearance of Tula on the radio show in '92, where Wigtardo was hot for trans to the point where he wanted people out of the studio and the rest is banned audio history that you'll likely never hear again. We managed to find that audio and combined a breakdown of both. Kind of a rush job special edition for the purposes of being slightly more timely, this week you're getting two episodes due to the unfortunate passing of Mr. Bob Saget at the age of 65. Raven and I and Bob and I were set to record whole different episodes for different reasons but we pushed them back and wanted to get this out ASAP to illustrate exactly the progression of exactly how much worse Howard's NPD has become. Anybody out there in the business with a heart and brain needs to get this forwarded to Jimmy Kimmel to show him how stupid he is to put himself in tow with this callous asshole. Hey folks, it's long-overdue but the boys and I got together and finally banged another episode out, this time we deal with the latest turds from the MCU as well as the very watchable Dune PLUS a discussion on parental disasters in moviegoing! Greetings everybody! Welcome to the second episode of the new year, and with it, our continuation in the breakdown series that Raven and I have turned into such a juggernaut of weapons-grade.... well you know the rest. At any rate, we're happy to be back in full force. This covers Sept. 8th and 9th.'''
