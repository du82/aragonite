full_description = "A podcast dedicated to discussion on all matters Howard Stern. Visit our Facebook group and join up for the odd time he's actually on the air live and we do a listening thread! Also the home of Radio Karate! visit our new YT page here: https://www.youtube.com/channel/UC-gQQs-c59bHb3QQM8zAgUA/ For the latest Jim Fixx/Fillmore page, join our Facebook group and PM me here: https://www.facebook.com/groups/1081190012234000/ Yeah, guys, it's true. Possibly one of the top five worst interviews Wiggy has ever done and guess what? Perfect for mockery. Raven joins us for 90 percent of the duration and we laughed our arses off. We hope you all will too. I hate to stress this but if you can donate even the lowest tier of our patreon subscription which is a dollar a month, it will help hugely going forward with the show--most of the money is going towards tech and software, with some of the money going to our pockets because we put a lot of effort into each show. Patreon has a new promotion where you can get 15% off a year's subscription (any tier) and that's a great deal. If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: https://www.patreon.com/jimfixx Hey, gang--I enlisted the help of many a QFer in putting this together and it was worth it in the end. I apologize for the moments where I sound like crap, as I was not always able to record with my main setup, so bear with us. This particular topic is a popular one for most Stern fans and we decided we'd give YOU the chance to state your case for the moments in which you felt the Stern show complete lost the plot forevermore. We hope you enjoy it, and if you enjoy the show, please subscribe and donate through our patreon link! https://www.patreon.com/jimfixx If you dig our podcast and want to donate, or you dig the clips on my other channel and want to make a request, hit me up on Patreon here: https://www.patreon.com/jimfixx We are on a host of other podcast apps as well, including Spotify, Player FM, Tune In, PodcastAddicts, Pocket Casts, and Google Podcasts."
