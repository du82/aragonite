full_description = '''A podcast dedicated to discussion on all matters Howard Stern. Visit our Facebook group and join up for the odd time he's actually on the air live and we do a listening thread! Also the home of Radio Karate! visit our new YT page here: https://www.youtube.com/channel/UC-gQQs-c59bHb3QQM8zAgUA/ For the latest Jim Fixx/Fillmore page, join our Facebook group and PM me here: https://www.facebook.com/groups/1081190012234000/ Howdy, folks! This is part 1 of at least a 3 part series on the KC/pelican "mad tear" years that will be a Patreon feature that James and I have put together, and it promises to be a wild ride. If you want to listen to the full episode, along with 100% of the previous 40+ Patreon only episodes, please subscribe at the "Black Klugge" level or higher! Huge thanks to Sam who made it so much fun. Also kudos to Cormano over at Reddit as well as Muldred Stern for the great notes. We speak your names! It's been a long time in the making but we're finally wrapping up this magnum opus, BUT in the interest of not destroying your ear canals in one shot, we've splintered this 5.5 hour episode into two parts, with pt. 2 appearing on YT this Thursday night (no live chat for then, sorry). You can only take so much Robin. Thanks to everybody who loved this series hopefully as much as we loved putting it together--next up we'll be handling the Hurricane Sandy Saga and it promises to be a doozy. **As of March 1st of this year, only 2 of our 4 Sunday episodes will be made available for free on YT and various apps; going forward if you would like to listen to all Sunday episodes, you'll need to become a Patreon subscriber at the "Whiskey Sobbing Computer Board" tier--that will be established on March 1st--and for a mere $2.50 a month, you'll be able to access not only those episodes but 50% of all Patreon episodes going forward. If you want the whole shebang, just subscribe at the $5.00 "Black Klugge" level (or more if you're super generous and kind!) and you'll also be able to access all the previous Patreon episodes released so far (32 episodes ranging from 1h-2.5h in length each). For those of you who want to subscribe but are technologically inept, you can send money to our Paypal account and we will send you those episodes as mp3s (or mp4s when applicable), but most people have found the Patreon app fairly easy to use thus far.**'''
