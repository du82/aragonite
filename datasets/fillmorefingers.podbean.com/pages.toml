full_description = '''A podcast dedicated to discussion on all matters Howard Stern. Visit our Facebook group and join up for the odd time he's actually on the air live and we do a listening thread! Also the home of Radio Karate! visit our new YT page here: https://www.youtube.com/channel/UC-gQQs-c59bHb3QQM8zAgUA/ For the latest Jim Fixx/Fillmore page, join our Facebook group and PM me here: https://www.facebook.com/groups/1081190012234000/ *Sorry for the late update, I'm in transit on vacation folks, and the last time I tried to pre-schedule a later release on Podbean it wouldn't take. On Patreon it works perfectly but here, not so much.* For once, Raven and I manage to cover a breakdown (this time from mid-June before Wigtardo took a powder for the summer) that YT did not edit the shit out of. NPD Wiggo is clearly getting worse and you can tell this time that Beth is really over his nonsense. If you want our every Sunday and every weekly bonus episode (including the first 33 that are unavailable at the lower tiers), make your way over to Patreon via the following link and sub via the "Black Klugge" level: Howdy folks, and welcome to our latest installment of this opus--thanks to Sam and Ben who both helped to make this possible. In part 7, we discuss his move to Hartford, his hair issues, and also his grooming of a young Fred Norris. For the extra Sundays you've been missing in addition to weekly extra content on Patreon, follow this link and join up via the Black Klugge tier (or higher!). Sam and Bobby Chicago come along for the ride on this pluggy trip to Beth Oblivion and her wonky first FHM cover. For those of you digging the Sunday shows and want the other 2/3 every month plus another couple of episodes besides, subscribe to us on Patreon at the "Whiskey Sobbing Computer Board" tier, or just say "Black Klugge and get full access to everything we've done up to date on Patreon! In this episode, Cary and I finally put old wrongs to right and made the definitive 