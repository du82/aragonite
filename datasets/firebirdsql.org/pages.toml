["https://firebirdsql.org/en/mailing-lists"]
title = "Firebird: Mailing Lists"
description = "Firebird SQL: The true open-source relational database"
full_description = '''We don't moderate the lists prescriptively but we do operate on a rule of "three strikes and you're out". No whining, no flaming, monopolisation or excessive requoting. It is considered polite to sign your messages and to use your own first name, not a nickname. Users posting with offensive nicknames or email addresses are likely to be bumped off and banned. Please move specialised or off-topic threads into suggested other lists when requested by a moderator. Advertisements of any kind will result in immediate banning. ASK SMART QUESTIONS! Please read this article before subscribing to any list! The people who help you in the lists are volunteers. Please don't waste their time by not providing enough information. As a minimum, provide: The old firebird-Architect and firebird-docs lists are now merged with firebird-devel (currently on Google Groups). The old firebird-tools list is now merged with firebird-general. Archive available at the list's web-site. Archives of the old Yahoo! group may be available on Firebird Yahoo Groups Archive.'''
