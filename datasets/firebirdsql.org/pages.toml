["https://firebirdsql.org/en/how-to-become-a-sponsor"]
title = "Firebird: How to Become a Sponsor"
description = "Firebird SQL: The true open-source relational database"
full_description = "For sponsors and donors looking to make a substantial impact on the future of Firebird that goes beyond our subscription programs, we offer a banding scheme to help you choose a sponsorship level that best suits your contribution goals. These sponsorship levels are structured to recognize and reward varying degrees of support: All of the tiers listed above come with all the benefits of the Firebird Partner program, plus additional perks such as priority access to events, content, and opportunities, reflecting the chosen sponsorship tier. These benefits ensure that your contribution is recognized and rewarded according to your level of support. Moreover, as a sponsor or donor, you are entitled — and encouraged — to advertise your involvement in Firebird's development by displaying a sponsor, donor, or member logo on your company or personal website. This helps showcase your commitment to supporting open-source innovation while enhancing your organization's visibility within the global Firebird community. You may download the appropriate logo from this page. Sponsors and donors appear on the listing of sponsors. You will be asked for a small company logo and a short paragraph of text about your company and, if you wish, about your involvement with Firebird. Sponsorships, donations, and other contributions are nominally accepted in US dollars, euros, or Czech crowns, providing flexibility for international supporters. For Platinum and Gold sponsors, it is customary to arrange invoicing at regular intervals throughout the year, with contributions made in installments to suit your business cycle. To learn more about Platinum and Gold sponsorship arrangements or to obtain details about our bank accounts for international fund transfers, please don’t hesitate to contact us. Your support will not only drive the ongoing development of Firebird but also enhance your organization’s visibility within the global Firebird community."
