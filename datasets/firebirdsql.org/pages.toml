["https://firebirdsql.org/en/community"]
title = "Firebird: Community"
description = "Firebird SQL: The true open-source relational database"
full_description = "The Firebird community is a thriving network of passionate individuals and organizations dedicated to advancing the Firebird database project. Many of our most active members are also proud supporters of the Firebird Foundation, which drives the project’s ongoing success. The Firebird Foundation offers unique ways to support the future of Firebird while enjoying exclusive benefits: Firebird Associate and Firebird Partner. Both programs allow you to be part of a dedicated community that actively contributes to Firebird’s ongoing development, but each offers a different level of engagement. You definitely shouldn’t miss EmberWings, the quarterly magazine published by the Firebird Foundation, offering in-depth insights into the Firebird database and its community. Each issue is packed with expert articles, interviews, tips, and the latest updates on Firebird's development. Available in PDF format, EmberWings is a must-read for developers, database administrators, and supporters who want to stay informed and maximize their use of Firebird. In addition to membership opportunities, we provide free community support through various channels, ensuring you can always find help when needed. Explore and connect with us through our social media streams and other platforms: Whether you’re a long-time user or new to Firebird, there’s a place for you in our community. Join us today, and help shape the future of Firebird!"
