["https://firebirdsql.org/en/donate"]
title = "Firebird: Support Firebird"
description = "Firebird SQL: The true open-source relational database"
full_description = "The Firebird Foundation offers multiple ways to support the future of Firebird while enjoying exclusive benefits. All allow you to be part of a dedicated community that actively contributes to Firebird’s ongoing development, but each offers a different level of engagement. Stable funding is crucial for ensuring the ongoing development and success of Firebird as a leading open-source relational database. Your financial contributions directly support the evolution of Firebird, from maintaining its core infrastructure to driving new innovations. While all donations are valuable, regular donations provide the foundation for sustained growth, allowing us to plan and execute long-term development goals more effectively. We recognize and reward this stable support with exclusive benefits that increase based on your level of contribution. To make it easier for individuals and small businesses to support Firebird, we offer convenient subscription programs, available on a monthly or annual basis and payable by credit card. These programs are tailored to meet different levels of involvement and impact: Firebird Associate: Our entry-level program designed for individuals who wish to contribute regularly and stay connected to Firebird's progress. As an Associate, you’ll enjoy early access to EmberWings Magazine, special offers from our partners, certification exam discounts, access to closed webinars, discounted conference fees, and occasional special gifts. Firebird Partner: The advanced level of support, ideal for organizations or individuals seeking deeper engagement with the Firebird community. In addition to all the benefits of the Associate level, Partners gain access to exclusive technical content, the opportunity to participate in Firebird release planning, and more significant perks, including enhanced special offers and exclusive invitations. For sponsors who choose to contribute beyond the Partner level, we offer a completely extraordinary level of cooperation. These larger donations are typically sent directly to our bank accounts and come with all the benefits of the Firebird Partner program, plus additional perks such as priority access, as well as tailored recognition for your contribution. This sponsorship arrangement is based on mutual agreement, allowing us to customize benefits to meet the specific needs and goals of our high-level sponsors"
