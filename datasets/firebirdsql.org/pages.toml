full_description = "EmberWings is a quarterly PDF magazine that was originally launched by IBPhoenix in March 2024. After the release of three issues, publication was transferred to the Firebird Foundation, where it now serves as the official publication for the Firebird Project. EmberWings is available for free, but with a 12-month delay for the general public. Regular Firebird Foundation donors get exclusive early access to every new edition upon release​. In addition to technical articles, guides, and tips, it features interviews with noteworthy individuals, updates on Firebird’s development, community news, reviews of interesting products, and a touch of thematic humor. All of this presented in a streamlined format with an aesthetically pleasing print-friendly layout. It's currently available to Firebird supporters, and will be available to the general public in December 2025."
