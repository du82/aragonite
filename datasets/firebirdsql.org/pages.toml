["https://firebirdsql.org/en/testimonials"]
title = "Firebird: Testimonials"
description = "Firebird SQL: The true open-source relational database"
full_description = "Opinion : ¿Hoy Qué Hay?.info is a local events startup growing fast in Latin-America. Information about concerts, parties, theater etc. Technologies used are Firebird SQL, C#, ASP.NET MVC. Reasons for choosing Firebird are: open-source, cross-platform, high performance and easy administration. Opinion : I have been using Interbase since late 90s and Firebird since it was open sourced. SQL standards compliant, very fast, even on small servers, super reliable. A mission critical Firebird DB I built survived a server with a cracked motherboard that caused 200 blue screen/auto hard reboots over a period of four days. IT team finally found the problem changed out the motherboard and the Firebird DB hummed along just fine (no corruption). Largest DB I built: 12 GB, one third of a billion records (every elevation of 1KM intersections of the surface of planet Earth). Small early 2000 technology server produced 200 look ups per second. Very impressive on that tiny hardware. Most number of users on one Firebird app I built: 600 with about 250 concurrent connections. (Military application) Opinion : Arkadia manage more than 12 000 000 real estate properties around the world with for exemple around 200 millions pictures in just one table! off course all of this inside the firebird database engine. With this big amount of pictures in the database, we faced few problems but thanks to the Firebird support we was fastly able to correct them (ie: create a pool of parametized query for exemple and not only a pool of connection). Opinion : Usamos Firebird desde la versión 1.5. Tenemos varias instalaciones con bases de datos de entre 2Mb y 31Gb. Desarrollamos software para empresas de transporte de carga industrial y paquetería en Chile con mucho éxito. Firebird es una base de datos robusta y que ha dado excelentes resultados. Esperamos pronto esté liberada la versión 3. Opinion : We have been using Firebird since version 1.5 ( because of SavePoints at the beggining ), at that time no one else but Oracle supported it as far as we know. Since then we ported our initial App from Interbase 6.5 to Firebird and never use any other DBMS. So far we have more than 700 customers in Venezuela. We produced an ERP for Pharmacies and Drugstores. Our DBs sizes are between 1 GB and 20 GB. Firebird run FAST, STABLE and the PSQL is strong. Thanks you all."
year_published = 2025
