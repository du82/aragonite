["https://firebirdsql.org/en/news"]
title = "Firebird: News & Events"
description = "Firebird SQL: The true open-source relational database"
full_description = '''Firebird Project is happy to announce general availability of Firebird 5.0.2 — the latest point release in the Firebird 5.0 series. Helen Borrie, a key figure in the Firebird relational database project and a longtime contributor at IBPhoenix, passed away on January 2, 2025. Her contributions were essential to Firebird’s creation and its development over the past 25 years. We’re happy to announce that the December issue of EmberWings is now available for download! This special edition marks the magazine’s debut under the Firebird Foundation, bringing you a refreshed focus on both Firebird administrators and application developers alike. On November 22, 2024, eight professionals successfully passed the Firebird Basic DBA exam in Sao Paulo, Brazil. This marks an important milestone for Firebird certification. See details inside. This December, we invite you to join us in a special countdown that celebrates the holiday season and brings the Firebird community together. Each day, we’ll be unveiling exciting content, surprises, and fun activities to warm up your winter and keep you engaged with everything that makes Firebird special. But this isn’t just any countdown... We have received numerous emails related to the "3 top challenges with Firebird" campaign. These include questions, problems, and suggestions from users. In this video, Vlad Khorsun, a core developer of Firebird, and Alexey Kovyazin, the former President of the Firebird Foundation and current Firebird Foundation Programs Coordinator, address the first set of these user inquiries. Prague, 17th Oct 2024 – After more than two decades of operation from Australia, the Firebird Foundation is excited to announce a major transformation. A new organization of the same name has been established, now operating from the Czech Republic, within the European Union. This shift marks a significant step in strengthening the Foundation's ties to Project Firebird, one of the leading open-source relational database systems.'''
