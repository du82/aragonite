["https://firebirdsql.org/en/articles-of-association"]
title = "Firebird: Articles of Association"
description = "Firebird SQL: The true open-source relational database"
full_description = '''Firebird Foundation, z. s. within the meaning of Section 218 of Act No. 89/2012 Coll., the Civil Code (hereinafter referred to as the "CC") The name of the Association is Firebird Foundation, z. s. ("Association"). The Association is an association within the meaning of § 214 et seq. of the CC. The internal organization of the Association and the rights and obligations of the Members and the elected bodies of the Association shall be governed by these articles of Association ("Articles"), which, among other things, stored at the Presidium in its entirety at the registered office of the Association. Any legal entity or natural person over 18 years of age, without distinction of sex, religion, political and social classification, nationality, race and citizenship, who accepts and supports the objectives and rules of the Association, may become a member of the Association ("Member"). A legal entity that is a Member must designate a natural person to act for it towards the Association and to exercise the rights associated with membership. Membership of the Association shall be voluntary. No one can be forced to participate in the Association. Membership is attached to the person of the Member, is not transferable to another person and does not pass to the Member's successor in title. The decision on the admission of a new Member shall be taken by the Presidium on the basis of an electronically submitted membership application form. This form contains at least: A form for prospective members of the Association shall be prepared by the Presidium and published on the Association's website. Membership in the Association shall commence on the date of receipt of the Presidium's decision to admit a Member to the Association. Honorary Members shall have the same rights and obligations as Privileged Members but shall not be required to pay the Dues. The Presidium may grant honorary membership particularly where such Member has made an exceptional contribution to furthering the purpose of the Association.'''
year_published = 2025
