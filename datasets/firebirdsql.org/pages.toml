["https://firebirdsql.org/en/firebird-foundation-retrospective"]
title = "Firebird: Firebird Foundation: a Retrospective"
description = "Firebird SQL: The true open-source relational database"
full_description = '''As we all know, the Firebird Foundation was incorporated in 2002 to provide a way to raise funds to support the developers of the open source Firebird relational database management system that forked from InterBase 6 at the end of July, 2000. The lead-up to the formation of the FF involved a lot of effort from a number of people. For historical reasons, it is important that they do not go without acknowledgment. The events around the beginning of December, 1999, indicated strongly at the time that the software house of Borland, then known as "Inprise", intended to wash its hands of the trusty RDBMS that we all knew as InterBase. At that point, the current version was 5.6, with IB 6 anxiously awaited. Its product managers and support people had walked out of an untenable situation while IB 6 was in a late beta. Those of us who were users of the IB Objects Delphi components of Jason Wharton were horrified and powerless. We all hung out in Jason's product support list. At his behest, we formed into a loosely-organised group with a mail list and a web page on his server. We referred to ourselves as "the InterBase Developers' Initiative", or IBDI. Our broad aim was to find some way to save InterBase from the trash-heap. As the IBDI took off, we were joined by others who were keen to help. At first, we were looking for contacts to investors who might fund a buyout. Jason himself was looking in the direction of having Inprise release the IB source code into the open source arena. He spent many hours (and dollars) in discussion and negotiation with Inprise management, to no avail, initially. However, just after New Year 2000, the then CEO of Inprise, Dale Fuller, announced that IB 6 would be released to open source. The events leading up to the eventual release of the code seven months later can be reviewed in the historical account of the Firebird Project. Firebird was forked from the read-only Inprise code tree at Sourceforge by Mark O'Donohue on July 31. Negotiations between Inprise and a team (subsequently the support company IBPhoenix) that proposed to take up the InterBase business fell through and it bounced back to the user community to find some way to ensure the future of the Firebird fork. A steering committee formed and spent the succeeding months exploring possibilities, including the establishment of a non-profit organisation to drop an anchor for the Firebird Project and raise funds to support the voluntary developers. That is the route we took and here we still are.'''
year_published = 2025
clearnet = "https://firebirdsql.org/en/firebird-foundation-retrospective"
