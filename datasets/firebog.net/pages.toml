full_description = '''The Big Blocklist Collection The Internet is full of unsavoury content: advertisers wanting to sell you stuff you don't need, trackers extracting and selling your data as if it were oil, and malicious content vying to hijack your favourite device. This collection hopes to help you minimise these issues, and to maintain a more enjoyable online presence, using the wonderful, free and open source utility known as Pi-hole. On arrival, like a growing number of websites, Forbes asked readers to turn off ad blockers in order to view the article. After doing so, visitors were immediately served with pop-under malware, primed to infect their computers, and likely silently steal passwords, personal data and banking information. Or, as is popular worldwide with these malware "exploit kits," lock up their hard drives in exchange for Bitcoin ransom. 'Forbes Site, After Begging You To Turn Off Adblocker, Serves Up A Steaming Pile Of Malware 'Ads'' - Techdirt, 2016 Before starting, here are some reading points: Lists in green and bulleted with a tick are least likely to interfere with browsing Lists that have a strike through them are not recommended for use (E.G: Many false postives, deprecated, biased) A tool to help keep your blocklists in sync is found here If you wish to automate the update of your blocklist sources, URL-only and CSV versions are found here Using lists hosted at v.firebog.net allows me to view very basic ongoing aggregated statistics via CloudFlare These lists are painstakingly worked on by their respective maintainers. Please contact them first if you find false positives Avoid using mirrored consolidated lists, if possible; it deprives the original list maintainer of visits (meaning they may be less inclined to keep it up to date!) Toggle list maintainer sources Suspicious Lists PolishFiltersTeam KADhosts:https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt Fademind's Spammers:https://raw.githubusercontent.c