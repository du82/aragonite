full_description = "about://WaLLy3K 👋 G'day, cobber! I'm an Australian that's gone by the alias of WaLLy3K since 1998. My online roots are in gaming, being a former Counter-Strike Admin & GameOp. I've also contributed to Pi-hole as a core developer. I like to play co-op PC games in my spare time and dabble in personal projects involving bash, HTML/CSS and PHP. My other interests involve IT security and privacy, photography, animals, electronic repair, as well as being able to help people using the knowledge I've learned. You can find me on Mastodon Discord Steam GitHub Reddit Twitter Notable Projects Pi-hole Big Blocklist Collection Pi-hole Block Page"
