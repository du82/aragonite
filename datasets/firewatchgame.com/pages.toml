["http://www.firewatchgame.com/jp"]
title = "Campo Santo - Firewatch"
description = """
Firewatchはアメリカ・ワイオミング州の自然保護区が舞台の1人称視点ミステリーアドベンチャー。すべてのコミュニケーションはこの大自然で唯一、手のひらの中のトランシーバーだけ…
\t\t\t\t\t
\t\t\t\t\t\t1989年。
\t\t\t\t\t\t
\t\t\t\t\t\tあなたは面倒な生活から逃げ出すように森林火災監視員となった男『ヘンリー』です。山の上の監視塔から火事の元となる煙を見張るのが主な仕事です。暑く乾燥した今年の夏は、特に注意が必要です。
\t\t\t\t\t\t
\t\t\t\t\t\tこの荒野の安全を守る仕事は谷の向こうにある別の監視塔の上司『デリラ』からの指示に従います。彼女はこの広大な自然の中で唯一の自分以外の存在であり、通信方法は小さなトランシーバーだけ…
\t\t\t\t\t\t
\t\t\t\t\t\t大自然の探索とトランシーバー越しの”対話の選択”でストーリーは変化し、展開してきます。自分自身に向き合いながらデリラとの信頼関係を構築し、問題を解決していけるでしょうか？"""
full_description = "Firewatchはアメリカ・ワイオミング州の自然保護区が舞台の1人称視点ミステリーアドベンチャー。すべてのコミュニケーションはこの大自然で唯一、手のひらの中のトランシーバーだけ… 1989年。 あなたは面倒な生活から逃げ出すように森林火災監視員となった男『ヘンリー』です。山の上の監視塔から火事の元となる煙を見張るのが主な仕事です。暑く乾燥した今年の夏は、特に注意が必要です。 この荒野の安全を守る仕事は谷の向こうにある別の監視塔の上司『デリラ』からの指示に従います。彼女はこの広大な自然の中で唯一の自分以外の存在であり、通信方法は小さなトランシーバーだけ… 大自然の探索とトランシーバー越しの”対話の選択”でストーリーは変化し、展開してきます。自分自身に向き合いながらデリラとの信頼関係を構築し、問題を解決していけるでしょうか？"
year_published = 2025
clearnet = "http://www.firewatchgame.com/jp"
