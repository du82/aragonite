["http://firewatchgame.com/about"]
title = "Campo Santo - Firewatch - About & FAQ"
description = "Firewatch is a first-person single-player mystery set in the Wyoming wilderness, where your only emotional lifeline is the person on the other end of a handheld radio."
full_description = "Firewatch is a single-player first-person video game where you, as a man named Henry, explore the Wyoming wilderness after taking a summer job as a fire lookout. What is supposed to be a peaceful respite from your complicated life takes a turn when you start to question some of the things that are happening to you. Your only human connection is over a handheld radio, which you’ll use to speak with your supervisor Delilah about the things both of you are experiencing. Firewatch is incredibly story driven! To tell you more would be to deprive you of the joy of discovery. You’re going to forge a living, breathing relationship and uncover a tense, unexpected mystery. I’m not here to learn about Firewatch. I’ve got a problem with my copy of the game! Or my in-game photos! If you're playing the Windows, Mac, or Linux version of the game, check out the Firewatch Steam forums because we might have already solved the problem. P.S. Video game development is very hard. We’ll try to solve your issue quickly and to the best of our abilities. Windows, Mac, and Linux via Steam, as well as Nintendo Switch via the Nintendo Store, PlayStation 4 via PlayStation Store, and Xbox One via the Microsoft Store. It's $19.99. Not currently! We don't have plans to bring it to store shelves (or online store shelves), but we'll announce it if that changes. We have no plans to release the game in VR right now, but we've collaborated with a few friends to bring elements of Firewatch into virtual reality. For free! If you have an HTC Vive, visit the Firewatch tower that our artist Jane Ng created for Valve's Destinations. Firewatch has localized subtitles on Windows, Nintendo Switch, PlayStation 4, Xbox One, Mac, and Linux in Russian, French, German, Spanish, and Simplified Chinese. Firewatch has localized subtitles in Japanese on Windows, Nintendo Switch, PlayStation 4, Mac, and Linuxx. Yes. We love that people stream and share their experiences in the game, and we extend the priviledge of streaming and monetizing our games on Twitch, YouTube, Steam, and elsewhere to our customers."
year_published = 2025
clearnet = "http://firewatchgame.com/about"
tags = ["blog", "campo", "development", "firewatch", "panic", "quarterly", "reviewnewsletter", "santo"]
language = "en"
internal-references = ["none"]
