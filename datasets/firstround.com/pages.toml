description = "Todd Jackson is a partner at First Round, a venture capital firm that works with founders exclusively at the earliest stages of company building, often when all they have is an “imagine if.”"
full_description = "ANGEL TRACKLooking to back more builders yourself?Sharpen your angel investing skills and your deal flow. Todd JacksonPartner“Over the years, I’ve been lucky to work on some of the biggest tech products in the world: Gmail’s user interface, Facebook’s Newsfeed, Twitter’s timeline and Dropbox’s bottom-up revenue engine — all products that are deeply technical under the hood but simple and powerful to the user. Figuring out how to translate complex technology into elegant 'power tools' is a passion of mine and a critical skill for founders to cultivate.”15Years as a product leader1Company founded (backed by First Round, acquired by Twitter in 2014)75+Founders supported through Product-Market Fit MethodI’ve spent the better part of my career unpacking the art and science behind product-market fit — from founding my own company (backed by First Round) in 2013 to working with companies that have reached the highest levels of PMF. Now, as a Partner at First Round, I spend my days helping early founders tackle this most critical, but also most complicated, aspect of company building.Todd Jackson is a Partner based on the West Coast. Prior to joining First Round, he served as the VP of Product & Design at Dropbox from 2015 until the company’s IPO in 2018.Before Dropbox, Todd was the Director of Product Management for the Content & Discovery teams at Twitter. Todd joined the social media platform via acquisition of his startup, Cover, in 2014. Todd served as co-founder and CEO of the Android startup, which was seed funded by First Round in 2013. From conception to acquisition, Todd was at the helm as Cover found product-market fit and gained over two million users in the first couple months, with zero money spent on paid acquisition.Prior to founding a company, Todd served as the Product Manager for Newsfeed, Photos and Groups at Facebook. He started his career at Google as an Associate Product Manager who went on to lead product for Gmail as it went from