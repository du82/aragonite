["https://firstround.com/team/investing/liz-wessel"]
title = "Liz Wessel"
description = "Liz Wessel is a partner at First Round, a venture capital firm that works with founders exclusively at the earliest stages of company building, often when all they have is an “imagine if.”"
full_description = '''ANGEL TRACKLooking to back more builders yourself?Sharpen your angel investing skills and your deal flow. Liz WesselPartner"As a founder, I lived and breathed my company for over seven years. I now work with founders who bring that same level of intensity — the individuals who will run through walls to overcome challenges, and who understand the problem they’re solving in a way that 99.9% of the population doesn’t."7Years as a founder40+Companies backed as an angel investor (including Ramp, ScaleAI, and Ro)110+ Startups supported as Visiting Partner at Y CombinatorI will work harder than any other investor on your cap table. That's a guarantee. Whether it's painstakingly reviewing every sales call recording together to fine-tune your customer pitch, interviewing candidates for your earliest go-to-market hires, doing fundraising pitch practices on weekends for your Series A, or anything else — I'll be there for every moment, big or small.Liz Wessel joined First Round in 2023 as a Partner in the San Francisco office. She has a soft spot for companies reimagining old-school industries or that exist as a result of new or breakthrough technologies.Liz spent most of her career as the co-founder and CEO of WayUp, an early-career recruitment platform used by over seven million candidates and thousands of companies. She launched WayUp in 2014 and ran it for seven years, during which time she raised over $40 million in venture and led the company through acquisition in 2021.After WayUp and prior to joining First Round, Liz was a Visiting Group Partner at Y Combinator for several batches, where she worked with over 110 early-stage startups and coached founders on enterprise sales, B2B marketing, storytelling, and fundraising through back-to-back office hours sessions.As an angel investor since 2016, Liz has backed over 40 startups at the earliest of stages, including Ramp, ScaleAI, Ro, Artera (fka WELL Health), FreeWill, and Snackpass.Liz graduated from the University of Pennsylvania with a Bachelor's in Political Science, Mathematics and Japanese.SOME OF THE COMPANIES LIZ'S INVESTED IN:ReductoImagine if LLMs could read documents the way humans do.GumloopImagine if anyone could automate their work without needing to be an AI expert or an engineer.David AIImagine if audio were as central to human-to-AI interaction as it is to human-to-human interaction.M7 HealthImagine if health systems could attract and retain nurses by fostering flexible and predictable work environments.&AIImagine if AI transformed how attorneys worked.OnyxImagine if employees could find company information faster.SpurImagine if companies could QA any website using natural language.HEAR MORE FROM LIZ:Review ArticleHere’s What to Expect When Pitching Your Seed-Stage Startup at a VC Partner MeetingThere's not much advice out there on navigating VC partner meeting pitches. First Round Partner (and former founder) Liz Wessel shares her detailed playbook here.NewsMeet First Round’s Newest Partner: Liz Wessel, a Founder, Experienced Angel & Former YC Visiting PartnerWhy we’re excited to add this former founder, GTM powerhouse, and investor in Ramp, Ro and ScaleAI, to our team.ProfileBusiness Insider: Y Combinator Alum Liz Wessel Joins First Round Capital As the Firm's Newest PartnerFounder-turned-investor Liz Wessel worked with more than 100 startups during her time at YC. Now, she's First Round Capital's newest partner.Back to Team'''
