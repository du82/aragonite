["https://firstround.com/who-we-back"]
title = "Who We Back | First Round"
description = "First Round is a venture capital firm that works with founders exclusively at the earliest stages of company building, often when all they have is an “imagine if.” A taste of what we look for in founders."
full_description = "Is it ever too early to approach First Round about investing?No, it’s never too early to reach out. We don’t see divisions between angel, pre-seed and seed — we’re interested across the board and find that founders’ needs are the same early on. So, even if you don’t think you’re ready, we’d still like to get to know you. Maybe we can even help in the meantime. (Check out PMF Method if you’re not quite ready to raise but are hoping to get on the path to extreme product-market fit early.) What if I'm still employed elsewhere?Absolutely reach out. We regularly meet with future founders who are in exactly this position, months away from making the official leap. Whether you're actively planning your transition or just starting to explore an idea, we're happy to meet. We can serve as a sounding board while you explore different markets and think through timing. We can also introduce you to potential design partners, early hires — and maybe even your future co-founder. And check out PMF Method if you’re not quite ready to raise yet but are hoping to get on the path to extreme product-market fit early. What if I’ve already raised from angels or a pre-seed fund — is it too late?Of course not. While we’re usually the first money in, we’ve worked with a number of teams that raised a small friends and family round before coming to us. That said, if you’ve already raised more than several million dollars, we’re probably not a fit. Do I need customers and revenue?Nope. Many of our 500+ companies came to us when they were a couple of people with an idea. We're far more interested in the depth of your understanding of the problem you’re solving and your unique spikes as a builder than any particular metrics. Some of our best investments were in founders who took the time to develop profound insights before chasing their first customer. I’m raising my Series B or Series C — should I contact you?Nope. We’re named First Round for a reason. If you’re raising your third or fourth round, consider a later-stage firm that might be a better fit. And then when you exit that company, contact us for your next one ;)"
