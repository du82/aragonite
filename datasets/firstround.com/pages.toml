description = "Hayley Barna is a partner at First Round, a venture capital firm that works with founders exclusively at the earliest stages of company building, often when all they have is an “imagine if.”"
full_description = '''ANGEL TRACKLooking to back more builders yourself?Sharpen your angel investing skills and your deal flow. Hayley BarnaPartner“When taking Birchbox from a school project to nine-figures in revenue, First Round acted as a tailwind for me. Being a seed-stage investor is the best way to use my 0 to 1 founder experience to help other companies — and, naturally, First Round was the place I wanted to be. First Round was an early believer in New York’s tech ecosystem and I’m thrilled to lead our New York office."$180MRevenue scaled to as founder of Birchbox$1.4BIn follow-on capital raised by backed companies15+Years in NYC tech ecosystemFounders are on twin journeys: one path is focused on cold, hard execution and the second path is filled with the more emotional aspects of company-building. I’m equally comfortable engaging on both planes — combining data-driven precision with heartfelt support.Hayley Barna joined First Round as a partner in 2016 to lead the New York office. She particularly enjoys working with founders tackling problems with real-world impact across healthcare, climate, supply chain and commerce that have been either overlooked or assumed to be unsolvable.A former founder, angel investor and operator, Hayley co-founded Birchbox in 2010, a First Round-backed subscription ecommerce company widely credited for the rise of the subscription industry. There, she grew what started as a school project into a 200-person business with hundreds of millions of dollars in revenue.Prior to Birchbox, Hayley spent time at Bain & Company, Christie’s and Amazon, where she cut her teeth on everything from strategy work to product management. She is a founding member of All Raise, an organization committed to accelerating the success of female founders and funders. She has been recognized as Fast Company’s Most Creative People in Business and Fortune’s 40 Under 40 and is a Trustee for the Society for Science, a non-profit dedicated to promoting scientific research, education and literacy. Hayley received her bachelor’s degree from Harvard and MBA from Harvard Business School.SOME OF THE COMPANIES HAYLEY'S INVESTED IN:AlmaImagine if anyone could access high-quality, affordable mental health care.acquiredMirrorImagine if a mirror could give you a smarter, harder workout from the comfort of your home.StudsImagine if getting your ears pierced was a shopping experience to remember.SiteRxImagine if clinical trials were accessible to every doctor and patient.Thirty MadisonImagine if everyone could access personalized, virtual care for chronic conditions — from hair loss to migraines.ArborImagine if we could lower the cost of home energy for people and the planet.Back to Team'''
