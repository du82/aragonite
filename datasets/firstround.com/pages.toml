["https://firstround.com/angel-track"]
title = "Angel Track | First Round"
description = "Angel Track provides unparalleled access to First Round’s investing expertise and a community of exceptional angels for the best early-stage deal flow in tech."
full_description = "Who should apply?Anyone looking to improve as an angel investor can apply. You might have started a company or been a senior operator at a fast growing startup. You should be excited about backing the next wave of entrepreneurs and have already started making angel investments. Do I need to be an accredited investor?No. While investing in startups requires that you be accredited, you don't need to be an accredited investor to take part in this program. Do I need to have made angel investments already?We're seeking the most promising founders and operators at both early and late-stage tech companies looking to back the next wave of entrepreneurs. Most people who join the cohort have made between 5-15 investments — but we primarily look for people who are at an inflection point in their investing journey and are eager to support founders with more than just a check. At this point, Angel Track is not designed for folks who are looking to make their first or second angel investment. Can I apply regardless of my location?While the core program usually happens over Zoom, we bring Angel Track cohort members together in-person in San Francisco and New York to build relationships over dinners and other small group interactions. We find that building relationships is more effective in person so we give preference to applicants in San Francisco and New York while still welcoming a handful of members throughout the US. What if I can't make all the sessions?Angel Track alumni say that the best parts of the program are the knowledge they gain and the relationships they build by joining the community. We strongly encourage everyone to attend all sessions. We ask finalists if they are aware of any conflicts before the program kicks off. If you need to skip more than one session, we ask that you do not join. Do I receive any investment capital as part of being in the program?This program is focused entirely on education and community. We do not provide capital to participants."
