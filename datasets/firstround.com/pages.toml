["https://firstround.com/pmf"]
title = "PMF Method | First Round"
description = "PMF Method from First Round is a free, intensive experience designed to help exceptional B2B founders increase their odds of finding extreme product-market fit."
full_description = "Who should apply? Any early founder working on a new B2B SaaS company is welcome to apply. Maybe you've been working on an early idea for the past year. Or perhaps you’re still dreaming at your day job, a few months away from taking the leap to found your company. We're also open to founders from all around the world — as long as you've raised less than $2M and can make it to Sonoma for the experience, you're in the running. How much does it cost?It’s completely free. If you’re accepted, the only “cost” is your time (well, and getting yourself to the retreat). What’s more is, this isn't an accelerator. We give you $0 and take 0% of your company. Are all the sessions in person?The first set of sessions are all in person at a retreat in Sonoma. You’ll cover airfare/transportation (or can join a carpool). Once you’re there, we’ll cover all housing, food, and activity costs. The follow up sessions are a mix of in person and over Zoom. What if I can't make it for the entire time?If you can’t make it to all four days, please let us know and we’ll keep you in mind for a future round of PMF Method and prioritize founders who can make it to all the sessions this time around. What happens after I apply? Our team will screen applications and interview founders who seem like they could be a good fit for PMF Method. You’ll be notified if you’ve been selected to participate in the Spring 2025 session by March 12th. If you applied after February 7th, we'll start reviewing waitlist applications for our Fall cohort in August 2025. I have a friend this would be perfect for, can I nominate them?Yes, please do! Referrals are the best. You can nominate a founder or have them fill out the application directly, When is the next retreat?We plan to run PMF Method repeatedly. Be sure to follow First Round on X and LinkedIn where we’ll announce new sessions in the future."
