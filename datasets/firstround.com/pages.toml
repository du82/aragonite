["https://firstround.com/team/investing/bill-trenchard"]
title = "Bill Trenchard"
description = "Bill Trenchard is a partner at First Round, a venture capital firm that works with founders exclusively at the earliest stages of company building, often when all they have is an “imagine if.”"
full_description = "ANGEL TRACKLooking to back more builders yourself?Sharpen your angel investing skills and your deal flow. Bill TrenchardPartner“I started my first two businesses as an undergrad: I led one to $100M in sales and the other was acquired by Microsoft. Now, I look for pre-product-market fit founders who think ‘inside out’ instead of ‘outside in’ — eager to break down incredibly complex problems to the smallest unit and build unconventional solutions to them.”2Companies founded (both acquired)$100M Revenue scaled to as founder of LiveOps90+ Companies invested inThe best founders go unreasonably deep. They don’t just study a problem — they break it down to its atomic unit and live inside it. They obsess over the mechanics that others overlook, uncovering hidden leverage in the smallest details. Those are the founders I love working with — the ones who geek out on the nuances, and see what no one else sees until it’s obvious in hindsight.Bill Trenchard started his first two businesses as an undergrad. He led LiveOps, a cloud contact center, to $100 million in sales and hundreds of employees. Jump Networks, a web calendar and personal organizer, was acquired by Microsoft.Bill has helped dozens of companies launch, manage through hyper growth and win. As an angel investor and Partner at Founder Collective, Bill made investments in category killing companies including Uber, IronPort (acquired by Cisco), Adroll, PowerSet (acquired by Microsoft), Lending Club, HomeRun (acquired by Rearden Commerce), Tapulous (acquired by Disney), Slide (acquired by Google), and Chegg. At First Round since 2012, he’s backed companies such as Looker (acquired by Google), Verkada, Flexport, EvolutionIQ (acquired by CCC Intelligent Solutions) and Together AI.When he’s not engaged with founders, he’s feeding his obsession with metabolic health. Bill has a Bachelor of Arts in science and technology studies from Cornell University.SOME OF THE COMPANIES BILL'S INVESTED IN:acquiredLookerImagine if everyone within a company could easily understand the data that drives the business.VerkadaImagine if buildings protected the people inside using consumer technology.FlexportImagine if we could simplify global trade by connecting everyone in the supply chain.acquiredEvolutionIQImagine if improving disability insurance claims processing with AI helped more people return to work.SuperhumanImagine if we could speed through our inboxes twice as fast.Together AIImagine if anyone could build or fine-tune their own generative AI models.PromiseImagine if government and utilities could easily provide payment assistance and relief to eligible households.HEAR MORE FROM BILL:Review ArticleThe Fundraising Wisdom That Helped Our Founders Raise Billions in Follow-On CapitalFirst Round's Pitch Assist program helps founders raise follow-on capital. Here's a preview of some of the important fundraising lessons we share.Review Article70% of Time Could Be Used Better - How the Best CEOs Get the Most Out of Every DayFirst Round Partner Bill Trenchard on how the best CEOs in tech get the most out of their time.ProfileBusiness Insider: Inside the Boot Camp that Teaches Startup Founders How to Raise Millions of DollarsHow First Round's Pitch Assist teaches startup founders how to perfect their VC pitch.PodcastBill Trenchard on Manager Meetings with Capital AllocatorsBill Trenchard on the the evolution of First Round.Back to Team"
