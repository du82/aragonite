["https://www.firstround.com/levels"]
title = "Levels of PMF | First Round"
description = "PMF Method from First Round is a free, intensive experience designed to help exceptional B2B founders increase their odds of finding extreme product-market fit. Read about the four levels of PMF in this preview of PMF Method content."
full_description = "ANGEL TRACKLooking to back more builders yourself?Sharpen your angel investing skills and your deal flow. SESSION 01Levels of PMFProduct-Market Fit isn’t a black box — a new framework to help B2B founders find it, fasterSESSION 01Levels of PMFIntroLevels of PMFLevel 1NascentLevel 2DevelopingLevel 3StrongLevel 4ExtremeMost people describe finding product-market fit as an art, not a science. But when it comes to sales-led B2B startups, we’ve reverse engineered a method to increase the odds of unlocking it.We’ve worked with some of the world’s most iconic enterprise founders and distilled what they did in their first six months into a series of tactical sessions for taking a straighter path to PMF. Today, we’re open sourcing the first session, which shares how we’ve broken PMF down to an incredibly granular level in order to help more builders get there faster.Even though finding product-market fit is the single most important objective any company must achieve, it’s still a black box for founders — seemingly requiring some mysterious combination of luck, market timing, and sheer grit.While much has been written on the topic, no one has broken down the inputs, leading indicators and tactical steps that could increase the odds of finding PMF. In our view, one of the key reasons this topic hasn’t been successfully “framework-ified” is that most folks still talk about the concept in generalities.Fish are jumping into the boat. Leads are falling on the floor. You’re chasing — not pushing — a boulder. The product is being pulled out of your hands. You’ll know it when you see it. You can feel when it’s not happening. These descriptions lack the specificity that we see in other areas of company building.Another issue? Most resources target a wide range of builders — which results in watered-down advice that’s more hand-wavy than tactical. Founders are left with approaches that are neither replicable nor practical, ranging from unhelpful “We kind of just started going viral” founding stories to one-size-fits-all frameworks that don’t address the nuances of their specific business.While the hunt for PMF can be more of a dice game with poor odds for, say, consumer apps, our experience has taught us that for sales-led B2B companies, you can reduce the role of luck.Here’s how we’ve developed that conviction: As a firm of former founders and startup builders, we’re coming up on our 20th year of investing in pre-product-market fit startups. Along with Square, Notion, Looker, and Verkada, we’ve backed hundreds of companies when they were just a couple of founders and an idea.Drawing on our own data and observations from more than 500 investments, we’ve spent the last several years breaking down the decade-long project of building a category-defining B2B company into more concrete steps — in hopes that we could create this resource that we feel is missing from the ecosystem.To put it even more plainly: Despite all the talk about product-market fit, it didn’t seem like anyone was meaningfully putting the pieces together to help B2B founders increase their odds of finding it. We wanted to change that.In addition to distilling lessons from decades of our own experience, we’ve layered on hundreds of hours of research and interviewed dozens of founders who’ve gotten further on this journey than most, from both within and outside of our community. (If you’re a regular reader of The Review, you may have noticed that we’ve started publishing some of these stories in our series Paths to PMF — focusing on the down-in-the-weeds details of how companies from Vanta to Vercel took off.)As the culmination of that work, today we’re proud to unveil Product-Market Fit Method, an intensive 14-week experience designed to help exceptional pre-seed founders build epic B2B SaaS companies. From proven tactics to detailed benchmarks that help founders gauge progress, we’ve mined the secrets that are buried in the best B2B builders’ experiences to create a new methodology that helps startups take a straighter path to PMF.The program (which kicks off on May 29 and can be applied for here) consists of eight tactical sessions. We’ll cover everything from validating your product insight and market, to approaching positioning, design partners, and product iteration, to learning the ropes of what we call “dollar-driven discovery” and founder-led sales.While this is currently a highly-curated program with a limited number of spots, our tradition here at First Round has been to open-source everything we can to share what we’ve learned with the broader startup ecosystem — whether it’s a decade of advice on The Review or years spent building communities like Angel Track. In keeping with that spirit, we’ve decided to publish the content of the first session in full, as a preview.No commitment to applying. No email paywall (although of course, we’d highly recommend subscribing to The Review newsletter). No charge. And no equity required for the program either — our aim is to increase the odds that more founders find product-market fit, whether they’re backed by First Round or not.The deck may seem stacked, but we're on a mission to rebalance the odds in the early founder's favor. We’re firm believers that you don’t have to go at it alone — and you don’t have to make it all up as you go either.We’ve taken a systematic approach to defining what product-market fit is and identifying truly tactical steps for how to go about finding it. But to be very clear, the first session that we’re open-sourcing here is all about exploring the former, breaking down the elements of PMF so it’s easier to unlock. The rest of the sessions in PMF Method tackle the latter in much greater detail — with expert-led workshops, practical exercises and templates, actual customer introductions, and unique access to our network of established founders and angel investors.With that, let’s dive in.Levels of PMFIntroducing Extreme Product-Market FitLet’s start with the obvious question: What is product-market fit? Here’s our specific definition of what founders are aiming for — and why it’s a bit different from what you may have seen before:Extreme product-market fit is a state of widespread demand for a product that satisfies a critical need and — crucially — can be delivered repeatably and efficiently to each customer.As we’ve noted, the way most people have talked about product-market fit feels insufficient. More specifically, there are certain nuances that we feel haven't yet been adequately addressed:Product-market fit progresses in levels.It’s not a binary state where you have it and you’re golden, or you don’t and you’re not on the path. But it’s also not a vague spectrum or fuzzy sliding scale, where you can’t be sure where you’re at.There are a few dimensions of PMF that are in tension with each other, requiring deliberate tradeoffs at each level.There isn’t just one element to emphasize above all else. And importantly, there are different times in a company’s lifespan where founders need to intentionally prioritize one over another.There isn’t nearly enough emphasis on repeatability.As you move your way up through the different levels of product-market fit, what you’re really unlocking is repeatability — across demand generation, product development, customer satisfaction and unit economics. A startup hasn’t reached the upper levels of product-market fit until it has developed a fine-grained understanding of who the right customer is, how to land them, and how to deliver a product that (in most cases) isn’t bespoke for each customer yet consistently solves a significant need. In a nutshell, you don’t have to work as hard to find what we’re calling your “marginal customer” (more on that in the section below).Repeatability is the holy grail on the hunt for product-market fit. Without any patterns, it’s nearly impossible to generate early momentum and plot a course forward.That’s why when we picture product-market fit, we see three distinct building blocks:Four LevelsNascent, Developing, Strong, Extreme Product-Market FitThree DimensionsSatisfaction, Demand, EfficiencyLeversChange your persona, your problem, your promise, or your product (our version of the 4Ps) to make the work of finding, winning, serving and retaining your marginal customer easier.To be clear, pieces of this approach may exist here or there in different frameworks — after all, all great ideas are built on what's come before. But our hope is that we're bringing things together and diving deeper into the details in a way that's unique and valuable — plus we’ll take the added step of sharing how a company, Looker, made its way to product-market fit, sharing its actual data across the years. Let’s dig into each one.The 4 Levels of Product-Market FitWe’ve identified four concrete levels of PMF, with what we’re calling extreme product-market fit as the ultimate goal — what’s required to build a generational company.Rather than a blanket “you’ll know it when you have it,” we’ve found that for enterprise companies there's a clear progression that companies go through that is fairly predictable. Many founders have walked this path, and based on what we’ve seen from the hundreds of early-stage startups we’ve backed, this journey to extreme product-market fit usually takes anywhere from two to six years.Our contention is that product market fit is not binary — and it's not something that you get to overnight, despite what all of those “we just went viral” founding stories may have you believe.Once in a while, a company shoots up the ladder quickly, but that tends to be the exception. Some companies move up the progression over a longer period of time, while others skip ahead at different moments, leapfrogging from nascent to strong, for example. In our experience, there are a couple of specific timing patterns here that companies fall into, whether it’s making their way through Levels 1-3 quickly but stalling out and never quite hitting Level 4, or reaching Level 1 in record time but then getting trapped at Level 2.We’ll also note that the journey to PMF is a two-way ladder, meaning levels aren’t permanently unlocked — it is possible to regress. To use another metaphor, think of it more as a dynamic equilibrium. Just like in chemistry, your actions, your competitors’ actions, customer expectations, technology shifts and other factors are all at a tentative equilibrium state. If one of those elements changes — maybe your competitor makes a huge leap forward — and you don’t adjust, you may not be at the same level of PMF anymore. (For another take on this topic, we recommend three-time founder Bob Moore’s framework here.)We’ll get deep into the details of what progressing through each level feels like further down, but staying at our current altitude, there’s one high-level question you can ask here if you’re unsure where your company stacks up: How hard is it to find and serve your next “marginal” customer? As you move up, it becomes easier and easier, and increasingly more repeatable.At Levels 3 and 4, for example, demand swells. Contrast that with Levels 1 and 2, where the search for the marginal customer feels more like a battle on several fronts — finding the right person, convincing them that your solution is what they need, converting them, and turning them into satisfied customers.The 3 Dimensions of Product-Market FitWe like to break that definition down even further into what we call the three dimensions of product-market fit:Satisfaction:How happy are customers with the product? Are you able to effectively retain customers? How much do people need the product? It may seem like splitting hairs, but we’ll note that we’ve intentionally used “need” and not “love” here — there are many companies that have extreme PMF without customer love. (Salesforce is an example of a product that’s perhaps not beloved, but certainly satisfies a critical customer need.)Demand:Do you have the proverbial “lines out the door”? How quickly and how much can you sell your product for?Efficiency:Can the product grow repeatably and scale effectively? In our view, this is the critical piece that many definitions of PMF gloss over — even though it’s one of the most important things that a company must achieve. Here’s how we like to break it down: efficiency in finding the customer (CAC), selling and closing the customer (sales conversion, magic number, CAC payback), in activating and supporting the customer (length of integration cycle, NRR), in producing the product (COGS, gross margin), and across the company as a whole (burn multiple).Some may bristle at that last one. Most other definitions of product-market fit overtly focus on satisfaction and demand, implying that efficiency takes care of itself in the long run. But our belief is that while your business won’t be efficient from day one — and may in fact be intentionally inefficient while you work to figure things out at Level 1 — there is tremendous value in building with an eye towards efficiency throughout your entire journey as a founder.As a thought exercise, say you open up a stand on the side of the road where anyone who lines up and gives you $1 gets $100 in return. By classic definitions, product-market fit would be off the charts. You'd have lines out the door. Customers would be very satisfied. But it would be a mirage. And a particularly dangerous one at that, given the risk that you’ll lull yourself into the false belief that you’ve unlocked PMF.When you’re starting a marathon, it’s helpful to know what the final mile needs to look like — even if you don’t alter your approach to mile 1. If you keep efficiency in the back of your mind even at the earlier stages, you’ll be able to stay intentional in the tradeoffs you’re making as you build.One final note here: These dimensions are actually highly intertwined — and require distinct tradeoffs in different scenarios. For example, you can take on several initiatives to increase efficiency — spending less time doing unscalable things, automating and operationalizing more aspects of your business — but in many instances, that harms the customer experience, reducing satisfaction. (Of course, there are times where there’s more harmony than discord — for example, shipping a critical product feature might improve all three at once.)The First Round 4Ps: Levers to Get Unstuck on Your Path to Product-Market FitAs for how you can get unstuck and catapult your company to the next level, you can experiment with pulling these four levers at various points along your journey (our spin on the classic 4Ps framework):The persona:Who would benefit most from your insight? Do you have a person in a specific type of role or function who faces a set of challenges in mind? In this context, the persona can be the buyer (CTO or CRO), the company type (e.g. Fortune 10,000 financial services) or both. As you look to make adjustments here, consider whether it’s too nar"
