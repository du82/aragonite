["https://firstsession.com/faq"]
title = "First Session - FAQ"
description = "Who's listed on First Session? What happens when I book? Am I covered under OHIP or insurance? How much does therapy cost? What is sliding scale?"
full_description = "We've put together a thorough guide to help you find the right therapist, determine what the different designations mean, and what you should be looking for when assessing fit. Find the guide here. The therapists listed on First Session charge between $80-250 per therapy session. Each therapist's price, or range of prices is listed on their profile page. Many employer/group benefits and extended insurance plans do cover these professionals. Your coverage will generally depend on the designation or license of each professional (ex. Registered Social Worker, Registered Clinical Counsellor). Please check each therapist's profile page, under Insurance Coverage, to see what designations/coverage they fall under. If you're unsure about coverage, you should ask your benefits provider whether they cover that specific designation of therapist. We also wrote this guide to help. No. Anyone can book with a therapist directly. However, you do typically need a doctor's referral to see a psychiatrist (who can diagnose and prescribe medication). When you use the online booking tool, you are reserving a spot directly in the calendar of your therapist. After you make your booking, your therapist will reach out directly providing any additional information you need to start therapy. When you contact a therapist via First Session, your form submission is submitted directly to the therapist. You can read more about First Session's commitment to confidentially in our Privacy Policy. If your therapist is full and has a waitlist, you cannot book with them directly, but you can contact them to inquire about their waitlist. Therapist waitlist times can vary from several weeks to a few months. Currently provincial health care plans do not cover the services of the private practice therapists listed on First Session. Check out this extensive guide which covers this more in depth. First Session is growing across Canada, with the bulk of our therapists located in Ontario, British Columbia, and Alberta. However, we have many therapists that can work with clients who live in all of Canada's provinces and territories. If you select the province where you live on the find a therapist page, you'll be shown the therapists who are able to work with you in your province of residence."
