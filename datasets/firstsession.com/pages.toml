["https://firstsession.com/resources/types-of-therapists-psychologist-licensing-education-canada"]
title = "Psychologist licensing and education in Canada"
description = "Licensing and education for psychologists in Canada"
full_description = "Psychologists are trained in the science of behaviours and the mind. They may focus on research and academic study, or practice with patients in the field providing counselling therapy. They can diagnose mental disorders but they cannot prescribe medication.To become a psychologist, you will need an undergraduate degree and to complete a Master’s or PHD psychology program from an accredited academic institution in Canada or the U.S. Psychologists must also accumulate a certain number of hours to complete their certification. Psychologist licensing and education in Alberta‍Alberta psychologists can practice with a master’s or PhD and complete 1,600 hours of a post-master’s supervised practice to be eligible to register with the College of Alberta Psychologists.‍Psychologist licensing and education in British ColumbiaPsychologists in British Columbia must complete an accredited doctoral program (PhD) to be eligible to register with the College of Psychologists of British Columbia. Eligibility for registration includes 600 hours of practice and a 1,600 hour pre-doctoral internship.A “psychological associate” requires a master’s degree.‍Psychologist licensing and education in ManitobaThe Psychological Association of Manitoba registers and oversees both Psychological Associations and Psychologists. Psychological Associates have a master’s degree and four years of supervised experience under a Registered Psychologist. Psychologists will have a PhD level education and two years of supervised practice under another Registered Psychologist.‍Psychologist licensing and education in New BrunswickThey will hold a PhD level education, and achieve at least a 70% grade on the Examination for Professional Practice in Psychology (EPPP) to register with the College of Psychologists of New Brunswick. ‍Psychologist licensing and education in Newfoundland & LabradorPsychologists in Newfoundland must hold a master’s degree with two years of supervised work, or a PhD with one year of supervised work to be eligible to register with the Newfoundland and Labrador Psychology Board. ‍Psychologist licensing and education in Northwest TerritoriesPsychologists in the Northwest Territories require a master’s or PhD level education, and 1,600 hours of practical work experience to register with the Registrar, Professional Licensing with the Department of Health and Social Services. ‍Psychologist licensing and education in Nova ScotiaPsychologists in Nova Scotia must have a master’s degree with four years of supervised work experience, or a PhD with two years of supervised work experience. They must also pass the relevant exam to be registered with the Nova Scotia Board of Examiners in Psychology. ‍Psychologist licensing and education in NunavutTo become a psychologist in Nunavut, they must have a master’s or PhD level education, and complete 1,600 hours of practical experience. They will register with the Registrar, Professional Licensing Nunavut Health and Social Services (tel: 867-982-7668).‍Psychologist licensing and education in OntarioOntario psychologists must hold a PhD from an accredited institution and be registered with The College of Psychologists of Ontario. Eligibility for registration includes four years of a pre-doctoral practica (a residency) and one year of post-doctoral supervised practice. A “psychological associate” requires a master’s degree.‍Psychologist licensing and education in Prince Edward IslandTo become a psychologist in Prince Edward Island, they must have a PhD degree, and complete 600 hours of doctoral practice as well as 1,700 hours of a doctoral internship, plus meet at least a score of 500 (70%) on the Examination for Professional Practice in Psychology (EPPP). Then they can register with the Prince Edward Island Psychologists Registration Board.‍Psychologist licensing and education in QuebecPsychologists in Quebec must hold a doctorate level education (PhD) in psychology, complete 2,300 hours of supervised practice and 45 hours of ethics training, plus have demonstrated expertise of the French language. Psychologists are overseen by and registered with the Ordre des psychologues du Quebec. The Ordre also oversees psychotherapists in Quebec.‍Psychologist licensing and education in SaskatchewanPsychologists in Saskatchewan require, at-minimum, a master’s degree in psychology. More often, they will hold a PhD. They are overseen by the Saskatchewan College of Psychologists, and can work in a variety of areas, such as in schools, clinics or hospitals, or directly with clients offering counselling therapy. ‍Psychologist licensing and education in the YukonThe Yukon is the only jurisdiction in Canada that does not have a regulatory framework for psychologists. Refer to the Canadian Psychological Association."
