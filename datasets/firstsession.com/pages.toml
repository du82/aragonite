full_description = "By visiting or using the First Session Health Inc. (“First Session”) website at www.firstsession.com, applications, or other online resources provided by First Session (collectively, the “Website”), each web user, counsellor, social worker, psychotherapist, psychologist, client, patient or other member of the public (each a “User”) acknowledges that they may be providing personal information and/or personal health information to First Session. First Session is committed to protecting the privacy and personal information of each User. To accommodate any concerns with how personal information is protected, First Session has created this Privacy Policy which details how First Session collects, uses and discloses personal information obtained by First Session when Users are visiting the Website, utilizing the services provided via the Website, as well as information received from email and other downloadable material. This Privacy Policy applies to all personal information and personal health information (defined below) collected by First Session through the operation of the Website. The Privacy Policy does not apply to third-party online resources to which the Website may link, where First Session does not control the content or the privacy practices of such resources. This Privacy Policy also does not apply to information communicated between any patient and social workers, psychotherapists, psychologists (each, a “Mental Healthcare Professional”) that is offline or otherwise not through the Website. This Privacy Policy does not cover any information involving more than one individual where the identity of the individuals is not known and cannot be inferred from the information (“Aggregated Data”). First Session retains the right to use Aggregated Data in any way that it determines appropriate. Personal Information is defined in the Personal Information Protection and Electronic Documents Act (“PIPEDA”) as information about an identifiable individual, but does not include the name, title or business address or telephone number of an employee of an organization. In other words, it does not include the information that one expects to find on a business card or information that is available in public records. Personal Information includes, but is not limited to, a User’s name, mailing address, telephone number, e-mail address, facsimile number, age, gender, marital status, health status, financial status, credit card information, credit history, interests, browsing preferences, web logs, internet protocol addresses, network and server particulars, and/or other information relevant to the Website, promotional and marketing activities."
