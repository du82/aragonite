["https://firstsession.com/for-practitioners"]
title = "First Session Directory - For Therapists - Get Listed"
description = "First Session offers mental health professionals an innovative way to market themselves and connect with clients using professional videos and sleek design."
full_description = '''First session was created with the client in mind. We are obsessed with making the search for a therapist easier for clients, but that also means making it easier for you, too.‍Since we launched in May 2019, we've connected over 1,000 clients with therapists like yourself, and are growing at a rapid rate. We work with licensed private practice psychotherapists, psychologists, as well as group practices.‍Are you outside of Ontario or BC? Not to worry. First Session will be expanding across Canada in no time, and we'd love to hear from you. "My experience with First Session has been incredible. I wasn't sure where to get referrals and First Session made this easy for me. My client's also found it eased their anxieties because they were able to look exactly what they wanted and they had a sense of who I was even prior to our initial consultation. My practice is also thriving since I started over a year ago and I wouldn't be where I am without First Session." "Working with the First Session team gave me the support and confidence I needed to talk about the work I love doing, and connect with clients in a professional and meaningful way. First session has made a profound impact on my life, both personally and professionally." "First Session accelerated the growth of my private practice. I was told it would take 2 years to build a practice to full time, but First Session helped me build it in 8 months. Clients coming through First Session are motivated for growth. Often it's like we start at session 3 during an initial meeting because they have already developed a bit more of a comfort level with me from my 3-minute video." First Session provides prospective clients with the opportunity to choose the right therapist for them. Since we do not refer clients (clients choose you), results vary from practitioner to practitioner. That said, on average we aim to produce 3 to 5 new client bookings per month, per practitioner. No. To maintain an ideal client experience, it’s necessary for our partners to offer at least one direct booking option for new clients (unless your practice is full and you have a waitlist).'''
