ion. Find the right therapist at firstsession.com.BY: Rosa ParkRelationshipsThe 5 Stages of Divorce Grief | How to Understand Your FeelingsIf you are going through a separation or divorce, it can be a very challenging time. It’s important to remember that it’s normal to go through a process of mourning after a relationship has ended. You don’t have to “bounce back” immediately. BY: Nicole LaoutarisTherapyCounsellor vs Therapist | How To Know What's Right For YouLike physical health, mental health can vary person-to-person and ebb and flow depending on our own unique circumstances – family mental health history, body and brain chemistry, life experiences, traumatic events, and more. Also like physical health, sometimes we can manage our wellbeing on our own, and sometimes we can’t; that’s when it can be beneficial to seek the help of a professional.BY: Nicole LaoutarisTherapyCounselling for Depression: Can it Actually Help? [And How]It’s normal to experience sadness, or to retreat into some solitude when going through something particularly upsetting or difficult. It’s actually healthy to allow ourselves to feel negative emotions, instead of burying or ignoring them. BY: Nicole LaoutarisTherapyHow to Tell If Therapy is WorkingIf you’re working with a therapist regularly now, you’ve likely already spent some time finding a therapist or counsellor who is a good fit for you and you’ve invested time, energy, and money into your work together.BY: Nicole LaoutarisTherapyWhat Does a Successful Relationship with Your Therapist Look Like? Making the decision to reach out to a therapist can be nerve wracking. When you start to the process of finding a therapist, it’s likely you’ll come across several different kinds of professionals, each one with their own therapy speciality, such as anxiety therapy, and method (known as a therapy modality), such as Cognitive Behavioural Therapy (CBT). You might start to worry you’ll choose the wrong “kind” of therapist or counsellor. BY: Nicole LaoutarisTherapyTen Lessons I Learned in TherapyFirst Session’s founder reflects on a decade of working on his mental healthBY: Rob PintwalaTherapyHow to Practice Self-Love this Valentine’s DayThe season of love is upon us! More accurately, that one day of the year laser focused on romantic love—Valentine’s Day.BY: Nicole LaoutarisTherapyWhy do New Year's Resolutions fail? Goal-setting and mental healthDo you ring in every new year with a laundry list of life-changing resolutions? Then, by mid-January you’re already feeling behind, you’re disappointed, or you’ve simply forgotten about them?BY: Nicole LaoutarisTherapyChristmas: The Loneliest Time of the YearSara Jones, First Session staff member, shares about anxiety, depression, fear, and loneliness during the Christmas holiday season.BY: Sara JonesTherapyIranian-Canadian Therapist on Women’s Rights, Cultural Values and Empowerment In light of the women’s protests in Iran after the death of 22-year-old Mahsa Amini, we reached out to one of our therapists who grew up in Iran. BY: Rosa ParkBurnoutWhat is ‘Quiet-Quitting’ and Why Should You Care?You may have noticed some colleagues around you or, yourself, ‘quiet-quitting’ - just doing your duties, the bare minimum to coast through, a lack of engagement in work or reduced engagement in work.BY: Rosa ParkCommunicationJournaling for Mental HealthAre you someone who kept a diary as a teen? Maybe as an adult, you live by your to-do lists. There are reasons we turn to writing down ideas and tasks — it gets thought clutter out of our heads and allows us to see it in a more organized way. The same applies to keeping a journal for therapy or for overall better mental health.BY: Nicole LaoutarisTherapy“Holding onto that sh*t is exhausting!”—vulnerability, masculinity and men's therapyIt’s hard for everyone to ask for help. But, the idea of asking for help creates intense vulnerability for the man who has been attempting to do his best impression of “classic masculinity.”BY: