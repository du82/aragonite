["https://fishshell.com/docs/3.7/relnotes.html"]
title = "Release notes — fish-shell 3.7.1 documentation"
full_description = '''Release notes¶ fish 3.7.1 (released March 19, 2024)¶ This release of fish fixes the following problems identified in fish 3.7.0: Deleting the last history entry via history delete works again (#10190). Wildcards (*) will no longer sometimes generate paths that did not exist (#10205). This release also contains some improvements: A crash when trying to run an ELF program with a missing interpreter has been fixed. This crashed in the process after fork, so did not affect the fish process that tried to start the program (#10199). funced will now always source the file after it has written it, even if the contents did not change. This prevents issues if the file was otherwise modified (#10318). The warning for when a builtin returns a negative exit code was improved, now mentioning the original status (#10187). Added completions for cobra-cli (#10293) dmidecode (#10368) mycli (#10309) ollama (#10327) pstree (#10317) Some improvements to documentation and completions. fish 3.7.0 (released January 1, 2024)¶ This release of fish includes a number of improvements over fish 3.6.4, detailed below. Although work continues on the porting of fish internals to the Rust programming language, that work is not included in this release. fish 3.7.0 and any future releases in the 3.7 series remain C++ programs. Notable improvements and fixes¶ Improvements to the history pager, including: The history pager will now also attempt subsequence matches (#9476), so you can find a command line like git log 3.6.1..Integration_3.7.0 by searching for gitInt. Opening the history pager will now fill the search field with a search string if you’re already in a search (#10005). This makes it nicer to search something with ↑ and then later decide to switch to the full pager. Closing the history pager with enter will now copy the search text to the commandline if there was no match, so you can continue editing the command you tried to find right away (#9934). Performance improvements for command completions and globbing, where supported by the operating system, especially on slow filesystems such as NFS (#9891, #9931, #10032, #10052). fish can now be configured to wait a specified amount of time for a multi-key sequence to be completed, instead of waiting indefinitely. For example, this makes binding kj to switching modes in vi mode possible. The timeout can be set via the new fish_sequence_key_delay_ms variable (#7401), and may be set by default in future versions. Deprecations and removed features¶ LS_COLORS is no longer set automatically by the ls function (#10080). Users that set .dircolors should manually import it using other means. Typically this would be set -gx LS_COLORS (dircolors -c .dircolors | string split ' ')[3] Scripting improvements¶ Running exit with a negative number no longer crashes fish (#9659). fish --command will now return a non-zero status if parsing failed (#9888). The jobs builtin will now escape the commands it prints (#9808). string repeat no longer overflows if the count is a multiple of the chunk size (#9900). The builtin builtin will now properly error out with invalid arguments instead of doing nothing and returning true (#9942). command time in a pipeline is allowed again, as is command and and command or (#9985). exec will now also apply variable overrides, so FOO=bar exec will now set $FOO correctly (#9995). umask will now handle empty symbolic modes correctly, like umask u=,g=rwx,o= (#10177). Improved error messages for errors occurring in command substitutions (#10054). Interactive improvements¶ read no longer enables bracketed paste so it doesn’t stay enabled in combined commandlines like mysql -p(read --silent) (#8285). Vi mode now uses fish_cursor_external to set the cursor shape for external commands (#4656). Opening the history search in vi mode switches to insert mode correctly (#10141). Vi mode cursor shaping is now enabled in iTerm2 (#9698). Working directory reporting is enabled for iTerm2 (#9955). Completing commands as root includes commands not owned by root, fixing a regression introduced in fish 3.2.0 (#9699). Selection uses fish_color_selection for the foreground and background colors, as intended, rather than just the background (#9717). The completion pager will no longer sometimes skip the last entry when moving through a long list (#9833). The interactive history delete interface now allows specifying index ranges like “1..5” (#9736), and history delete --exact now properly saves the history (#10066). Command completion will now call the stock manpath on macOS, instead of a potential Homebrew version. This prevents awkward error messages (#9817). A new bind function history-pager-delete, bound to Shift + Delete by default, will delete the currently-selected history pager item from history (#9454). fish_key_reader will now use printable characters as-is, so pressing “ö” no longer leads to it telling you to bind \u00F6 (#9986). open can be used to launch terminal programs again, as an xdg-open bug has been fixed and a workaround has been removed (#10045). The repaint-mode binding will now only move the cursor if there is repainting to be done. This fixes Alt combination bindings in vi mode (#7910). A new clear-screen bind function is used for Ctrl + l by default. This clears the screen and repaints the existing prompt at first, so it eliminates visible flicker unless the terminal is very slow (#10044). The alias convenience function has better support for commands with unusual characters, like + (#8720). A longstanding issue where items in the pager would sometimes display without proper formatting has been fixed (#9617). The Alt + l binding, which lists the directory of the token under the cursor, correctly expands tilde (~) to the home directory (#9954). Various fish utilities that use an external pager will now try a selection of common pagers if the PAGER environment variable is not set, or write the output to the screen without a pager if there is not one available (#10074). Command-specific tab completions may now offer results whose first character is a period. For example, it is now possible to tab-complete git add for files with leading periods. The default file completions hide these files, unless the token itself has a leading period (#3707). Improved prompts¶ The default theme now only uses named colors, so it will track the terminal’s palette (#9913). The Dracula theme has now been synced with upstream (#9807); use fish_config to re-apply it to pick up the changes. fish_vcs_prompt now also supports fossil (#9497). Prompts which display the working directory using the prompt_pwd function correctly display directories beginning with dashes (#10169). Completions¶ Added completions for: age and age-keygen (#9813) airmon-ng (#10116) ar (#9720) blender (#9905) bws (#10165) calendar (#10138) checkinstall (#10106) crc (#10034) doctl gimp (#9904) gojq (#9740) horcrux (#9922) ibmcloud (#10004) iwctl (#6884) java_home (#9998) krita (#9903) oc (#10034) qjs (#9723) qjsc (#9731) rename (#10136) rpm-ostool (#9669) smerge (#10135) userdel (#10056) watchexec (#10027) wpctl (#10043) xxd (#10137) zabbix (#9647) The zfs completions no longer print errors about setting a read-only variable (#9705). The kitty completions have been removed in favor of keeping them upstream (#9750). git completions now support aliases that reference other aliases (#9992). The gw and gradlew completions are loaded properly (#10127). Improvements to many other completions. Improvements to the manual page completion generator (#9787, #9814, #9961). Other improvements¶ Improvements and corrections to the documentation. The Web-based configuration now uses a more readable style when printed, such as for a keybinding reference (#9828). Updates to the German translations (#9824). The colors of the Nord theme better match their official style (#10168). For distributors¶ The licensing information for some of the derived code distributed with fish was incomplete. Though the license information was present in the source distribution, it was not present in the documentation. This has been corrected (#10162). The CMake configure step will now also look for libterminfo as an alternative name for libtinfo, as used in NetBSD curses (#9794). fish 3.6.4 (released December 5, 2023)¶ This release contains a complete fix for the test suite failure in fish 3.6.2 and 3.6.3. fish 3.6.3 (released December 4, 2023)¶ This release contains a fix for a test suite failure in fish 3.6.2. fish 3.6.2 (released December 4, 2023)¶ This release of fish contains a security fix for CVE-2023-49284, a minor security problem identified in fish 3.6.1 and previous versions (thought to affect all released versions of fish). fish uses certain Unicode non-characters internally for marking wildcards and expansions. It incorrectly allowed these markers to be read on command substitution output, rather than transforming them into a safe internal representation. For example, echo \UFDD2HOME has the same output as echo $HOME. While this may cause unexpected behavior with direct input, this may become a minor security problem if the output is being fed from an external program into a command substitution where this output may not be expected. fish 3.6.1 (released March 25, 2023)¶ This release of fish contains a number of fixes for problems identified in fish 3.6.1, as well as some enhancements. Notable improvements and fixes¶ abbr --erase now also erases the universal variables used by the old abbr function. That means::abbr --erase (abbr --list) can now be used to clean out all old abbreviations (#9468). abbr --add --universal now warns about --universal being non-functional, to make it easier to detect old-style abbr calls (#9475). Deprecations and removed features¶ The Web-based configuration for abbreviations has been removed, as it was not functional with the changes abbreviations introduced in 3.6.0 (#9460). Scripting improvements¶ abbr --list no longer escapes the abbr name, which is necessary to be able to pass it to abbr --erase (#9470). read will now print an error if told to set a read-only variable, instead of silently doing nothing (#9346). set_color -v no longer crashes fish (#9640). Interactive improvements¶ Using fish_vi_key_bindings in combination with fish’s --no-config mode works without locking up the shell (#9443). The history pager now uses more screen space, usually half the screen (#9458) Variables that were set while the locale was C (the default ASCII-only locale) will now properly be encoded if the locale is switched (#2613, #9473). Escape during history search restores the original command line again (fixing a regression in 3.6.0). Using --help on builtins now respects the $MANPAGER variable, in preference to $PAGER (#9488). Control-G closes the history pager, like other shells (#9484). The documentation for the :, [ and . builtin commands can now be looked up with man (#9552). fish no longer crashes when searching history for non-ASCII codepoints case-insensitively (#9628). The Alt-S binding will now also use please if available (#9635). Themes that don’t specify every color option can be installed correctly in the Web-based configuration (#9590). Compatibility with Midnight Commander’s prompt integration has been improved (#9540). A spurious error, noted when using fish in Google Drive directories under WSL 2, has been silenced (#9550). Using read in fish_greeting or similar functions will not trigger an infinite loop (#9564). Compatibility when upgrading from old versions of fish (before 3.4.0) has been improved (#9569). Improved prompts¶ The git prompt will compute the stash count to be used independently of the informative status (#9572). Completions¶ Added completions for: apkanalyzer (#9558) neovim (#9543) otool pre-commit (#9521) proxychains (#9486) scrypt (#9583) stow (#9571) trash and helper utilities trash-empty, trash-list, trash-put, trash-restore (#9560) ssh-copy-id (#9675) Improvements to many completions, including the speed of completing directories in WSL 2 (#9574). Completions using __fish_complete_suffix are now offered in the correct order, fixing a regression in 3.6.0 (#8924). git completions for git-foo-style commands was restored, fixing a regression in 3.6.0 (#9457). File completion now offers ../ and ./ again, fixing a regression in 3.6.0 (#9477). The behaviour of completions using __fish_complete_path matches standard path completions (#9285). Other improvements¶ Improvements and corrections to the documentation. For distributors¶ fish 3.6.1 builds correctly on Cygwin (#9502). fish 3.6.0 (released January 7, 2023)¶ Notable improvements and fixes¶ By default, Control-R now opens the command history in the pager (#602). This is fully searchable and syntax-highlighted, as an alternative to the incremental search seen in other shells. The new special input function history-pager has been added for custom bindings. Abbrevations are more flexible (#9313, #5003, #2287): They may optionally replace tokens anywhere on the command line, instead of only commands Matching tokens may be described using a regular expression instead of a literal word The replacement text may be produced by a fish function, instead of a literal word They may position the cursor anywhere in the expansion, instead of at the end For example: function multicd echo cd (string repeat -n (math (string length -- $argv[1]) - 1) ../) end abbr --add dotdot --regex '^\.\.+$' --function multicd This expands .. to cd ../, ... to cd ../../ and .... to cd ../../../ and so on. Or: function last_history_item; echo $history[1]; end abbr -a !! --position anywhere --function last_history_item which expands !! to the last history item, anywhere on the command line, mimicking other shells’ history expansion. See the documentation for more. path gained a new mtime subcommand to print the modification time stamp for files. For example, this can be used to handle cache file ages (#9057): > touch foo > sleep 10 > path mtime --relative foo 10 string gained a new shorten subcommand to shorten strings to a given visible width (#9156): > string shorten --max 10 "Hello this is a long string" Hello thi… test (aka [) gained -ot (older than) and -nt (newer than) operators to compare file modification times, and -ef to compare whether the arguments are the same file (#3589). fish will now mark the extent of many errors with a squiggly line, instead of just a caret (^) at the beginning (#9130). For example: checks/set.fish (line 471): for: a,b: invalid variable name. See `help identifiers` for a,b in y 1 z 3 ^~^ A new function, fish_delta, shows changes that have been made in fish’s configuration from the defaults (#9255). set --erase can now be used with multiple scopes at once, like set -efglU foo (#7711, #9280). status gained a new subcommand, current-commandline, which retrieves the entirety of the currently-executing command line when called from a function during execution. This '''
year_published = 2025
clearnet = "https://fishshell.com/docs/3.7/relnotes.html"
