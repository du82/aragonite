["https://fishshell.com/blog/new-in-40"]
title = "What's new in fish 4.0"
description = "A smart and user-friendly command line shell"
full_description = 'This release represents 2731 commits by over 200 people. It has 1185 files changed, 111221 insertions(+), 89168 deletions(-)1. As you might know, fish was entirely rewritten in rust. But, while that’s a lot of work, it should also be invisible to you, the user - if we’ve done our job right. We’ve written about the port before, the rest of this post will tell you what awaits you if you’re interested in using fish 4. For the full list of changes you can see the Release Notes, this is the highlights, curated and explained. Fish’s bind now has a key notation. That means you no longer have to write bind \e\[1\;5C or bind \e\x7F, which directly reflects the escape sequences the terminal sends, you can just write bind ctrl-right or bind alt-backspace. This requires fish to understand what \e\[1\;5C is and to map it to an understanding of keys. And this understanding of keys now goes deeper: Fish tries to get the terminal to encode keys better so that it can differentiate them better. To explain, the usual protocol terminals use to send keys to applications have a lot of limitations: control+I (or control+shift+i) sends the exact same sequence as control+i, which sends the exact same sequence as the Tab key. A lot of keys cannot be disambiguated this way! So fish now enables a variety of terminal features, including xterm’s “modifyOtherKey” and the kitty keyboard protocol2, that tell the terminal that fish understands when it sends better sequences. If this works, you can bind ctrl-i, bind ctrl-I and bind tab separately! If it doesn’t work, you can still use bind ctrl-i, but it will also be triggered when you press tab. It does this automatically and without requiring configuration. We have tested a lot of terminals and found that almost all terminals we could get our hands on either understood these sequences and acted on them or harmlessly ignored them. In some rare cases we encountered terminal bugs that we worked around by disabling these protocols. For instance we found issues in the integrated terminal in JetBrains IDEs or Wezterm3 and iTerm that we hope will be fixed soon. In other cases we have sent patches, for example we improved Zellij’s support for the kitty keyboard protocol.'
year_published = 2025
year_updated = 2025
