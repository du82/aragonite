["https://fishshell.com/docs/3.2/relnotes.html"]
title = "Release notes — fish-shell 3.2.2 documentation"
full_description = '''This documents an old version of fish. See the latest release. Release notes¶ fish 3.2.2 (released April 7, 2021)¶ This release of fish fixes a number of additional issues identified in the fish 3.2 series: The command-not-found handler used suggestions from pacman on Arch Linux, but this caused major slowdowns on some systems and has been disabled (#7841). fish will no longer hang on exit if another process is in the foreground on macOS (#7901). Certain programs (such as lazygit) could create situations where fish would not receive keystrokes correctly, but it is now more robust in these situations (#7853). Arguments longer than 1024 characters no longer trigger excessive CPU usage on macOS (#7837). fish builds correctly on macOS when using new versions of Xcode (#7838). Completions for aura (#7865) and tshark (#7858) should no longer produce errors. Background jobs no longer interfere with syntax highlighting (a regression introduced in fish 3.2.1, #7842). If you are upgrading from version 3.1.2 or before, please also review the release notes for 3.2.1 and 3.2.0 (included below). fish 3.2.1 (released March 18, 2021)¶ This release of fish fixes the following problems identified in fish 3.2.0: Commands in key bindings are run with fish's internal terminal modes, instead of the terminal modes typically used for commands. This fixes a bug introduced in 3.2.0, where text would unexpectedly appear on the terminal, especially when pasting (#7770). Prompts which use the internal __fish_print_pipestatus function will display correctly rather than carrying certain modifiers (such as bold) further than intended (#7771). Redirections to internal file descriptors is allowed again, reversing the changes in 3.2.0. This fixes a problem with Midnight Commander (#7769). Universal variables should be fully reliable regardless of operating system again (#7774). fish_git_prompt no longer causes screen flickering in certain terminals (#7775). fish_add_path manipulates the fish_user_paths variable correctly when moving multiple paths (#7776). Pasting with a multi-line command no longer causes a __fish_tokenizer_state error (#7782). psub inside event handlers cleans up temporary files properly (#7792). Event handlers declared with --on-job-exit $fish_pid no longer run constantly (#7721), although these functions should use --on-event fish_exit instead. Changing terminal modes inside config.fish works (#7783). set_color --print-colors no longer prints all colors in bold (#7805) Completing commands starting with a - no longer prints an error (#7809). Running fish_command_not_found directly no longer produces an error on macOS or other OSes which do not have a handler available (#7777). The new type builtin now has the (deprecated) --quiet long form of -q (#7766). It also includes some small enhancements: help and fish_config work correctly when fish is running in a Chrome OS Crostini Linux VM (#7789). The history file can be made a symbolic link without it being overwritten (#7754), matching a similar improvement for the universal variable file in 3.2.0. An unhelpful error ("access: No error"), seen on Cygwin, is no longer produced (#7785). Improvements to the rsync completions (#7763), some completion descriptions (#7788), and completions that use IP address (#7787). Improvements to the appearance of fish_config (#7811). If you are upgrading from version 3.1.2 or before, please also review the release notes for 3.2.0 (included below). fish 3.2.0 (released March 1, 2021)¶ Notable improvements and fixes¶ Undo and redo support for the command-line editor and pager search (#1367). By default, undo is bound to Control+Z, and redo to Alt+/. Builtins can now output before all data is read. For example, string replace no longer has to read all of stdin before it can begin to output. This makes it usable also for pipes where the previous command hasn't finished yet, like: # Show all dmesg lines related to "usb" dmesg -w | string match '*usb*' Prompts will now be truncated instead of replaced with "> " if they are wider than the terminal (#904). For example: ~/dev/build/fish-shell-git/src/fish-shell/build (makepkg)> will turn into: …h-shell/build (makepkg)> It is still possible to react to the COLUMNS variable inside the prompt to implement smarter behavior. fish completes ambiguous completions after pressing Tab even when they have a common prefix, without the user having to press Tab again (#6924). fish is less aggressive about resetting terminal modes, such as flow control, after every command. Although flow control remains off by default, enterprising users can now enable it with stty (#2315, #7704). A new "fish_add_path" helper function to add paths to $PATH without producing duplicates, to be used interactively or in config.fish (#6960, #7028). For example: fish_add_path /opt/mycoolthing/bin will add /opt/mycoolthing/bin to the beginning of $fish_user_path without creating duplicates, so it can be called safely from config.fish or interactively, and the path will just be there, once. Better errors with "test" (#6030): > test 1 = 2 and echo true or false test: Expected a combining operator like '-a' at index 4 1 = 2 and echo true or echo false ^ This includes numbering the index from 1 instead of 0, like fish lists. A new theme for the documentation and Web-based configuration (#6500, #7371, #7523), matching the design on fishshell.com. fish --no-execute will no longer complain about unknown commands or non-matching wildcards, as these could be defined differently at runtime (especially for functions). This makes it usable as a static syntax checker (#977). string match --regex now integrates named PCRE2 capture groups as fish variables, allowing variables to be set directly from string match (#7459). To support this functionality, string is now a reserved word and can no longer be wrapped in a function. Globs and other expansions are limited to 512,288 results (#7226). Because operating systems limit the number of arguments to commands, larger values are unlikely to work anyway, and this helps to avoid hangs. A new "fish for bash users" documentation page gives a quick overview of the scripting differences between bash and fish (#2382), and the completion tutorial has also been moved out into its own document (#6709). Syntax changes and new commands¶ Range limits in index range expansions like $x[$start..$end] may be omitted: $start and $end default to 1 and -1 (the last item) respectively (#6574): echo $var[1..] echo $var[..-1] echo $var[..] All print the full list $var. When globbing, a segment which is exactly ** may now match zero directories. For example **/foo may match foo in the current directory (#7222). Scripting improvements¶ The type, _ (gettext), . (source) and : (no-op) functions are now implemented builtins for performance purposes (#7342, #7036, #6854). set and backgrounded jobs no longer overwrite $pipestatus (#6820), improving its use in command substitutions (#6998). Computed ("electric") variables such as status are now only global in scope, so set -Uq status returns false (#7032). The output for set --show has been shortened, only mentioning the scopes in which a variable exists (#6944). In addition, it now shows if a variable is a path variable. A new variable, fish_kill_signal, is set to the signal that terminated the last foreground job, or 0 if the job exited normally (#6824, #6822). A new subcommand, string pad, allows extending strings to a given width (#7340, #7102). string sub has a new --end option to specify the end index of a substring (#6765, #5974). string split has a new --fields option to specify fields to output, similar to cut -f (#6770). string trim now also trims vertical tabs by default (#6795). string replace no longer prints an error if a capturing group wasn't matched, instead treating it as empty (#7343). string subcommands now quit early when used with --quiet (#7495). string repeat now handles multiple arguments, repeating each one (#5988). printf no longer prints an error if not given an argument (not even a format string). The true and false builtins ignore any arguments, like other shells (#7030). fish_indent now removes unnecessary quotes in simple cases (#6722) and gained a --check option to just check if a file is indented correctly (#7251). fish_indent indents continuation lines that follow a line ending in a backslash, |, && or ||. pushd only adds a directory to the stack if changing to it was successful (#6947). A new fish_job_summary function is called whenever a background job stops or ends, or any job terminates from a signal (#6959, #2727, #4319). The default behaviour can now be customized by redefining it. status gained new dirname and basename convenience subcommands to get just the directory to the running script or the name of it, to simplify common tasks such as running (dirname (status filename)) (#7076, #1818). Broken pipelines are now handled more smoothly; in particular, bad redirection mid-pipeline results in the job continuing to run but with the broken file descriptor replaced with a closed file descriptor. This allows better error recovery and is more in line with other shells' behaviour (#7038). jobs --quiet PID no longer prints "no suitable job" if the job for PID does not exist (eg because it has finished) (#6809, #6812). jobs now shows continued child processes correctly (#6818) disown should no longer create zombie processes when job control is off, such as in config.fish (#7183). command, jobs and type builtins support --query as the long form of -q, matching other builtins. The long form --quiet is deprecated (#7276). argparse no longer requires a short flag letter for long-only options (#7585) and only prints a backtrace with invalid options to argparse itself (#6703). argparse now passes the validation variables (e.g. $_flag_value) as local-exported variables, avoiding the need for --no-scope-shadowing in validation functions. complete takes the first argument as the name of the command if the --command/-c option is not used, so complete git is treated like complete --command git, and it can show the loaded completions for specific commands with complete COMMANDNAME (#7321). set_color -b (without an argument) no longer prints an error message, matching other invalid invocations of this command (#7154). exec no longer produces a syntax error when the command cannot be found (#6098). set --erase and abbr --erase can now erase multiple things in one go, matching functions --erase (#7377). abbr --erase no longer prints errors when used with no arguments or on an unset abbreviation (#7376, #7732). test -t, for testing whether file descriptors are connected to a terminal, works for file descriptors 0, 1, and 2 (#4766). It can still return incorrect results in other cases (#1228). Trying to execute scripts with Windows line endings (CRLF) produces a sensible error (#2783). Trying to execute commands with arguments that exceed the operating system limit now produces a specific error (#6800). An alias that delegates to a command with the same name no longer triggers an error about recursive completion (#7389). math now has a --base option to output the result in hexadecimal or octal (#7496) and produces more specific error messages (#7508). math learned bitwise functions bitand, bitor and bitxor, used like math "bitand(0xFE, 5)" (#7281). math learned tau for those who don't like typing "2 * pi". Failed redirections will now set $status (#7540). fish sets exit status in a more consistent manner after errors, including invalid expansions like $foo[. Using read --silent while fish is in private mode was adding these potentially-sensitive entries to the history; this has been fixed (#7230). read can now read interactively from other files, and can be used to read from the terminal via read </dev/tty (if the operating system provides /dev/tty) (#7358). A new fish_status_to_signal function for transforming exit statuses to signal names has been added (#7597, #7595). The fallback realpath builtin supports the -s/--no-symlinks option, like GNU realpath (#7574). functions and type now explain when a function was defined via source instead of just saying Defined in -. Significant performance improvements when globbing, appending to variables or in math. echo no longer interprets options at the beginning of an argument (eg echo "-n foo") (#7614). fish now finds user configuration even if the HOME environment variable is not set (#7620). fish no longer crashes when started from a Windows-style working directory (eg F:\path) (#7636). fish -c now reads the remaining arguments into $argv (#2314). The pwd command supports the long options --logical and --physical, matching other implementations (#6787). fish --profile now only starts profiling after fish is ready to execute commands (all configuration is completed). There is a new --profile-startup option that only profiles the startup and configuration process (#7648). Builtins return a maximum exit status of 255, rather than potentially overflowing. In particular, this affects exit, return, functions --query, and set --query (#7698, #7702). It is no longer an error to run builtin with closed stdin. For example count <&- now prints 0, instead of failing. Blocks, functions, and builtins no longer permit redirecting to file descriptors other than 0 (standard input), 1 (standard output) and 2 (standard error). For example, echo hello >&5 is now an error. This prevents corruption of internal state (#3303). Interactive improvements¶ fish will now always attempt to become process group leader in interactive mode (#7060). This helps avoid hangs in certain circumstances, and allows tmux's current directory introspection to work (#5699). The interactive reader now allows ending a line in a logical operators (&& and ||) instead of complaining about a missing command. (This was already syntactically valid, but interactive sessions didn't know about it yet). The prompt is reprinted after a background job exits (#1018). fish no longer inserts a space after a completion ending in ., , or - is accepted, improving completions for tools that provide dynamic completions (#6928). If a filename is invalid when first pressing Tab, but becomes valid, it will be completed properly on the next attempt (#6863). help string match/replace/<subcommand> will show the help for string subcommands (#6786). fish_key_reader sets the exit status to 0 when used with --help or --version (#6964). fish_key_reader and fish_indent send output from --version to standard output, matching other fish binaries (#6964). A new variable $status_generation is incremented only when the previous command produces an exit status (#6815). This can be used, for example, to check whether a failure status is a holdover due to a background job, or actually produced by the last run command. fish_greeting is now a function that reads a variable of the same name, and defaults to setting it '''
year_published = 2025
clearnet = "https://fishshell.com/docs/3.2/relnotes.html"
