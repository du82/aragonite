["https://fishshell.com/docs/3.6/relnotes.html"]
title = "Release notes — fish-shell 3.6.4 documentation"
full_description = '''Release notes¶ fish 3.6.4 (released December 5, 2023)¶ This release contains a complete fix for the test suite failure in fish 3.6.2 and 3.6.3. fish 3.6.3 (released December 4, 2023)¶ This release contains a fix for a test suite failure in fish 3.6.2. fish 3.6.2 (released December 4, 2023)¶ This release of fish contains a security fix for CVE-2023-49284, a minor security problem identified in fish 3.6.1 and previous versions (thought to affect all released versions of fish). fish uses certain Unicode non-characters internally for marking wildcards and expansions. It incorrectly allowed these markers to be read on command substitution output, rather than transforming them into a safe internal representation. For example, echo \UFDD2HOME has the same output as echo $HOME. While this may cause unexpected behavior with direct input, this may become a minor security problem if the output is being fed from an external program into a command substitution where this output may not be expected. fish 3.6.1 (released March 25, 2023)¶ This release of fish contains a number of fixes for problems identified in fish 3.6.1, as well as some enhancements. Notable improvements and fixes¶ abbr --erase now also erases the universal variables used by the old abbr function. That means::abbr --erase (abbr --list) can now be used to clean out all old abbreviations (#9468). abbr --add --universal now warns about --universal being non-functional, to make it easier to detect old-style abbr calls (#9475). Deprecations and removed features¶ The Web-based configuration for abbreviations has been removed, as it was not functional with the changes abbreviations introduced in 3.6.0 (#9460). Scripting improvements¶ abbr --list no longer escapes the abbr name, which is necessary to be able to pass it to abbr --erase (#9470). read will now print an error if told to set a read-only variable, instead of silently doing nothing (#9346). set_color -v no longer crashes fish (#9640). Interactive improvements¶ Using fish_vi_key_bindings in combination with fish’s --no-config mode works without locking up the shell (#9443). The history pager now uses more screen space, usually half the screen (#9458) Variables that were set while the locale was C (the default ASCII-only locale) will now properly be encoded if the locale is switched (#2613, #9473). Escape during history search restores the original command line again (fixing a regression in 3.6.0). Using --help on builtins now respects the $MANPAGER variable, in preference to $PAGER (#9488). Control-G closes the history pager, like other shells (#9484). The documentation for the :, [ and . builtin commands can now be looked up with man (#9552). fish no longer crashes when searching history for non-ASCII codepoints case-insensitively (#9628). The Alt-S binding will now also use please if available (#9635). Themes that don’t specify every color option can be installed correctly in the Web-based configuration (#9590). Compatibility with Midnight Commander’s prompt integration has been improved (#9540). A spurious error, noted when using fish in Google Drive directories under WSL 2, has been silenced (#9550). Using read in fish_greeting or similar functions will not trigger an infinite loop (#9564). Compatibility when upgrading from old versions of fish (before 3.4.0) has been improved (#9569). Improved prompts¶ The git prompt will compute the stash count to be used independently of the informative status (#9572). Completions¶ Added completions for: - apkanalyzer (#9558) - neovim (#9543) - otool - pre-commit (#9521) - proxychains (#9486) - scrypt (#9583) - stow (#9571) - trash and helper utilities trash-empty, trash-list, trash-put, trash-restore (#9560) - ssh-copy-id (#9675) Improvements to many completions, including the speed of completing directories in WSL 2 (#9574). Completions using __fish_complete_suffix are now offered in the correct order, fixing a regression in 3.6.0 (#8924). git completions for git-foo-style commands was restored, fixing a regression in 3.6.0 (#9457). File completion now offers ../ and ./ again, fixing a regression in 3.6.0 (#9477). The behaviour of completions using __fish_complete_path matches standard path completions (#9285). Other improvements¶ Improvements and corrections to the documentation. For distributors¶ fish 3.6.1 builds correctly on Cygwin (#9502). fish 3.6.0 (released January 7, 2023)¶ Notable improvements and fixes¶ By default, Control-R now opens the command history in the pager (#602). This is fully searchable and syntax-highlighted, as an alternative to the incremental search seen in other shells. The new special input function history-pager has been added for custom bindings. Abbrevations are more flexible (#9313, #5003, #2287): They may optionally replace tokens anywhere on the command line, instead of only commands Matching tokens may be described using a regular expression instead of a literal word The replacement text may be produced by a fish function, instead of a literal word They may position the cursor anywhere in the expansion, instead of at the end For example: function multicd echo cd (string repeat -n (math (string length -- $argv[1]) - 1) ../) end abbr --add dotdot --regex '^\.\.+$' --function multicd This expands .. to cd ../, ... to cd ../../ and .... to cd ../../../ and so on. Or: function last_history_item; echo $history[1]; end abbr -a !! --position anywhere --function last_history_item which expands !! to the last history item, anywhere on the command line, mimicking other shells’ history expansion. See the documentation for more. path gained a new mtime subcommand to print the modification time stamp for files. For example, this can be used to handle cache file ages (#9057): > touch foo > sleep 10 > path mtime --relative foo 10 string gained a new shorten subcommand to shorten strings to a given visible width (#9156): > string shorten --max 10 "Hello this is a long string" Hello thi… test (aka [) gained -ot (older than) and -nt (newer than) operators to compare file modification times, and -ef to compare whether the arguments are the same file (#3589). fish will now mark the extent of many errors with a squiggly line, instead of just a caret (^) at the beginning (#9130). For example: checks/set.fish (line 471): for: a,b: invalid variable name. See `help identifiers` for a,b in y 1 z 3 ^~^ A new function, fish_delta, shows changes that have been made in fish’s configuration from the defaults (#9255). set --erase can now be used with multiple scopes at once, like set -efglU foo (#7711, #9280). status gained a new subcommand, current-commandline, which retrieves the entirety of the currently-executing command line when called from a function during execution. This allows easier job introspection (#8905, #9296). Deprecations and removed features¶ The \x and \X escape syntax is now equivalent. \xAB previously behaved the same as \XAB, except that it would error if the value “AB” was larger than “7f” (127 in decimal, the highest ASCII value) (#9247, #9245, #1352). The fish_git_prompt will now only turn on features if the appropriate variable has been set to a true value (of “1”, “yes” or “true”) instead of just checking if it is defined. This allows specifically turning features off without having to erase variables, such as via universal variables. If you have defined a variable to a different value and expect it to count as true, you need to change it (#9274). For example, set -g __fish_git_prompt_show_informative_status 0 previously would have enabled informative status (because any value would have done so), but now it turns it off. Abbreviations are no longer stored in universal variables. Existing universal abbreviations are still imported, but new abbreviations should be added to config.fish. The short option -r for abbreviations has changed from rename to regex, for consistency with string. Scripting improvements¶ argparse can now be used without option specifications, to allow using --min-args, --max-args or for commands that take no options (but might in future) (#9006): function my_copy argparse --min-args 2 -- $argv or return cp $argv end set --show now shows when a variable was inherited from fish’s parent process, which should help with debugging (#9029): > set --show XDG_DATA_DIRS $XDG_DATA_DIRS: set in global scope, exported, a path variable with 4 elements $XDG_DATA_DIRS[1]: |/home/alfa/.local/share/flatpak/exports/share| $XDG_DATA_DIRS[2]: |/var/lib/flatpak/exports/share| $XDG_DATA_DIRS[3]: |/usr/local/share| $XDG_DATA_DIRS[4]: |/usr/share| $XDG_DATA_DIRS: originally inherited as |/home/alfa/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share/:/usr/share/| The read limit is now restored to the default when fish_read_limit is unset (#9129). math produces an error for division-by-zero, as well as augmenting some errors with their extent (#9190). This changes behavior in some limited cases, such as: math min 1 / 0, 5 which would previously print “5” (because in floating point division “1 / 0” yields infinite, and 5 is smaller than infinite) but will now return an error. fish_clipboard_copy and fish_clipboard_paste can now be used in pipes (#9271): git rev-list 3.5.1 | fish_clipboard_copy fish_clipboard_paste | string join + | math status fish-path returns a fully-normalised path, particularly noticeable on NetBSD (#9085). Interactive improvements¶ If the terminal definition for TERM can’t be found, fish now tries using the “xterm-256color” and “xterm” definitions before “ansi” and “dumb”. As the majority of terminal emulators in common use are now more or less xterm-compatible (often even explicitly claiming the xterm-256color entry), this should often result in a fully or almost fully usable terminal (#9026). A new variable, fish_cursor_selection_mode, can be used to configure whether the command line selection includes the character under the cursor (inclusive) or not (exclusive). The new default is exclusive; use set fish_cursor_selection_mode inclusive to get the previous behavior back (#7762). fish’s completion pager now fills half the terminal on first tab press instead of only 4 rows, which should make results visible more often and save key presses, without constantly snapping fish to the top of the terminal (#9105, #2698). The complete-and-search binding, used with Shift-Tab by default, selects the first item in the results immediately (#9080). bind output is now syntax-highlighted when used interacively. Alt-H (the default __fish_man_page binding) does a better job of showing the manual page of the command under cursor (#9020). If fish_color_valid_path contains an actual color instead of just modifiers, those will be used for valid paths even if the underlying color isn’t “normal” (#9159). The key combination for the QUIT terminal sequence, often Control-Backslash (\x1c), can now be sused as a binding (#9234). fish’s vi mode uses normal xterm-style sequences to signal cursor change, instead of using the iTerm’s proprietary escape sequences. This allows for a blinking cursor and makes it work in complicated scenarios with nested terminals. (#3741, #9172) When running fish on a remote system (such as inside SSH or a container), Control-X now copies to the local client system’s clipboard if the terminal supports OSC 52. commandline gained two new options, --selection-start and --selection-end, to set the start/end of the current selection (#9197, #9215). fish’s builtins now handle keyboard interrupts (Control-C) correctly (#9266). Completions¶ Added completions for: ark asciinema (#9257) clojure (#9272) csh direnv (#9268) dive (#9082) dolphin dua (#9277) efivar (#9318) eg es (#9388) firefox-developer-edition and firefox (#9090) fortune (#9177) kb kind (#9110) konsole ksh loadkeys (#9312) okular op (#9300) ouch (#9405) pix readelf (#8746, #9386) qshell rc sad (#9145) tcsh toot tox (#9078) wish xed xonsh (#9389) xplayer xreader xviewer yash (#9391) zig (#9083) Improvements to many completions, including making cd completion much faster (#9220). Completion of tilde (~) works properly even when the file name contains an escaped character (#9073). fish no longer loads completions if the command is used via a relative path and is not in PATH (#9133). fish no longer completes inside of comments (#9320). Improved terminal support¶ Opening help on WSL now uses PowerShell to open the browser if available, removing some awkward UNC path errors (#9119). Other improvements¶ The Web-based configuration tool now works on systems with IPv6 disabled (#3857). Aliases can ignore arguments by ending them with # (#9199). string is now faster when reading large strings from stdin (#9139). string repeat uses less memory and is faster. (#9124) Builtins are much faster when writing to a pipe or file. (#9229). Performance improvements to highlighting (#9180) should make using fish more pleasant on slow systems. On 32-bit systems, globs like * will no longer fail to return some files, as large file support has been enabled. Fixed bugs¶ The history search text for a token search is now highlighted correctly if the line contains multiple instances of that text (#9066). process-exit and job-exit events are now generated for all background jobs, including those launched from event handlers (#9096). A crash when completing a token that contained both a potential glob and a quoted variable expansion was fixed (#9137). prompt_pwd no longer accidentally overwrites a global or universal $fish_prompt_pwd_full_dirs when called with the -d or --full-length-dirs option (#9123). A bug which caused fish to freeze or exit after running a command which does not preserve the foreground process group was fixed (#9181). The “Disco” sample prompt no longer prints an error in some working directories (#9164). If you saved this prompt, you should run fish_config prompt save disco again. fish launches external commands via the given path again, rather than always using an absolute path. This behaviour was inadvertently changed in 3.5.0 and is visible, for example, when launching a bash script which checks $0 (#9143). printf no longer tries to interpret the first argument as an option (#9132). Interactive read in scripts will now have the correct keybindings again (#9227). A possible stack overflow when recursively evaluating substitutions has been fixed (#9302). A crash with relative $CDPATH has been fixed (#9407). printf now properly fills extra %d specifiers with 0 even on macOS and BSD (#9321). fish_key_reader now correctly exits when receiving a SIGHUP (like after closing the terminal) (#9309). fish_config theme save now works as documented instead of erroring out (#9088, #9273). fish no longer triggers prompts to install command line tools when first run on macOS (#9343). fish_git_prompt now quietly fails on macOS if the xcrun cache is not yet populated (#6625), working around a potential hang. For distributors¶ The vendored PCRE2 sources h'''
year_published = 2025
clearnet = "https://fishshell.com/docs/3.6/relnotes.html"
tags = ["$path", "2.0.0¶", "2.1.0¶", "2.1.1", "2.1.2", "2.2.0", "2.3.0", "2.3.1", "2.3b1", "2.3b2"]
