["https://fishshell.com/docs/current/tutorial.html"]
title = "Tutorial — fish-shell 4.0.0 documentation"
full_description = '''Tutorial¶ Why fish?¶ Fish is a fully-equipped command line shell (like bash or zsh) that is smart and user-friendly. Fish supports powerful features like syntax highlighting, autosuggestions, and tab completions that just work, with nothing to learn or configure. If you want to make your command line more productive, more useful, and more fun, without learning a bunch of arcane syntax and configuration options, then fish might be just what you’re looking for! Getting started¶ Once installed, just type in fish into your current shell to try it out! You will be greeted by the standard fish prompt, which means you are all set up and can start using fish: > fish Welcome to fish, the friendly interactive shell Type help for instructions on how to use fish you@hostname ~> This prompt that you see above is the fish default prompt: it shows your username, hostname, and working directory. You can customize it, see how to change your prompt. From now on, we’ll pretend your prompt is just a > to save space. Learning fish¶ This tutorial assumes a basic understanding of command line shells and Unix commands, and that you have a working copy of fish. If you have a strong understanding of other shells, and want to know what fish does differently, search for the magic phrase unlike other shells, which is used to call out important differences. Or, if you want a quick overview over the differences to other shells like Bash, see Fish For Bash Users. For the full, detailed description of how to use fish interactively, see Interactive Use. For a comprehensive description of fish’s scripting language, see The Fish Language. Running Commands¶ Fish runs commands like other shells: you type a command, followed by its arguments. Spaces are separators: > echo hello world hello world This runs the command echo with the arguments hello and world. In this case that’s the same as one argument hello world, but in many cases it’s not. If you need to pass an argument that includes a space, you can escape with a backslash, or quote it using single or double quotes: > mkdir My\ Files # Makes a directory called "My Files", with a space in the name > cp ~/Some\ File 'My Files' # Copies a file called "Some File" in the home directory to "My Files" > ls "My Files" Some File Getting Help¶ Run help to open fish’s help in a web browser, and man with the page (like fish-language) to open it in a man page. You can also ask for help with a specific command, for example, help set to open in a web browser, or man set to see it in the terminal. > man set set - handle shell variables Synopsis... To open this section, use help getting-help. This only works for fish’s own documentation for itself and its built-in commands (the “builtins”). For any other commands on your system, they should provide their own documentation, often in the man system. For example man ls should tell you about your computer’s ls command. Syntax Highlighting¶ You’ll quickly notice that fish performs syntax highlighting as you type. Invalid commands are colored red by default: > /bin/mkd A command may be invalid because it does not exist, or refers to a file that you cannot execute. When the command becomes valid, it is shown in a different color: > /bin/mkdir Valid file paths are underlined as you type them: > cat ~/somefi This tells you that there exists a file that starts with somefi, which is useful feedback as you type. These colors, and many more, can be changed by running fish_config, or by modifying color variables directly. For example, if you want to disable (almost) all coloring: fish_config theme choose none This picks the “none” theme. To see all themes: fish_config theme show Just running fish_config will open up a browser interface that allows you to pick from the available themes. Autosuggestions¶ As you type fish will suggest commands to the right of the cursor, in gray. For example: > /bin/hostname It knows about paths and options: > grep --ignore-case And history too. Type a command once, and you can re-summon it by just typing a few letters: > rsync -avze ssh . myname@somelonghost.com:/some/long/path/doo/dee/doo/dee/doo To accept the autosuggestion, hit right (→) or ctrl-f. To accept a single word of the autosuggestion, alt-right (→). If the autosuggestion is not what you want, just ignore it. If you don’t like autosuggestions, you can disable them by setting $fish_autosuggestion_enabled to 0: set -g fish_autosuggestion_enabled 0 Tab Completions¶ A rich set of tab completions work “out of the box”. Press tab and fish will attempt to complete the command, argument, or path: > /pritab => /private/ If there’s more than one possibility, it will list them: > ~/stuff/stab ~/stuff/script.sh (command) ~/stuff/sources/ (directory) Hit tab again to cycle through the possibilities. The part in parentheses there (that “command” and “directory”) is the completion description. It’s just a short hint to explain what kind of argument it is. fish can also complete many commands, like git branches: > git merge prtab => git merge prompt_designer > git checkout btab builtin_list_io_merge (Branch) builtin_set_color (Branch) busted_events (Tag) Try hitting tab and see what fish can do! Variables¶ Like other shells, a dollar sign followed by a variable name is replaced with the value of that variable: > echo My home directory is $HOME My home directory is /home/tutorial This is known as variable substitution, and it also happens in double quotes, but not single quotes: > echo "My current directory is $PWD" My current directory is /home/tutorial > echo 'My current directory is $PWD' My current directory is $PWD Unlike other shells, fish has an ordinary command to set variables: set, which takes a variable name, and then its value. > set name 'Mister Noodle' > echo $name Mister Noodle (Notice the quotes: without them, Mister and Noodle would have been separate arguments, and $name would have been made into a list of two elements.) Unlike other shells, variables are not further split after substitution: > mkdir $name > ls Mister Noodle In bash, this would have created two directories “Mister” and “Noodle”. In fish, it created only one: the variable had the value “Mister Noodle”, so that is the argument that was passed to mkdir, spaces and all. You can erase (or “delete”) a variable with -e or --erase > set -e MyVariable > env | grep MyVariable (no output) For more, see Variable expansion. Exports (Shell Variables)¶ Sometimes you need to have a variable available to an external command, often as a setting. For example many programs like git or man read the $PAGER variable to figure out your preferred pager (the program that lets you scroll text). Other variables used like this include $BROWSER, $LANG (to configure your language) and $PATH. You’ll note these are written in ALLCAPS, but that’s just a convention. To give a variable to an external command, it needs to be “exported”. This is done with a flag to set, either --export or just -x. > set -x MyVariable SomeValue > env | grep MyVariable MyVariable=SomeValue It can also be unexported with --unexport or -u. This works the other way around as well! If fish is started by something else, it inherits that parents exported variables. So if your terminal emulator starts fish, and it exports $LANG set to en_US.UTF-8, fish will receive that setting. And whatever started your terminal emulator also gave it some variables that it will then pass on unless it specifically decides not to. This is how fish usually receives the values for things like $LANG, $PATH and $TERM, without you having to specify them again. Exported variables can be local or global or universal - “exported” is not a scope! Usually you’d make them global via set -gx MyVariable SomeValue. For more, see Exporting variables. Lists¶ The set command above used quotes to ensure that Mister Noodle was one argument. If it had been two arguments, then name would have been a list of length 2. In fact, all variables in fish are really lists, that can contain any number of values, or none at all. Some variables, like $PWD, only have one value. By convention, we talk about that variable’s value, but we really mean its first (and only) value. Other variables, like $PATH, really do have multiple values. During variable expansion, the variable expands to become multiple arguments: > echo $PATH /usr/bin /bin /usr/sbin /sbin /usr/local/bin Variables whose name ends in “PATH” are automatically split on colons to become lists. They are joined using colons when exported to subcommands. This is for compatibility with other tools, which expect $PATH to use colons. You can also explicitly add this quirk to a variable with set --path, or remove it with set --unpath. Lists cannot contain other lists: there is no recursion. A variable is a list of strings, full stop. Get the length of a list with count: > count $PATH 5 You can append (or prepend) to a list by setting the list to itself, with some additional arguments. Here we append /usr/local/bin to $PATH: > set PATH $PATH /usr/local/bin You can access individual elements with square brackets. Indexing starts at 1 from the beginning, and -1 from the end: > echo $PATH /usr/bin /bin /usr/sbin /sbin /usr/local/bin > echo $PATH[1] /usr/bin > echo $PATH[-1] /usr/local/bin You can also access ranges of elements, known as “slices”: > echo $PATH[1..2] /usr/bin /bin > echo $PATH[-1..2] /usr/local/bin /sbin /usr/sbin /bin You can iterate over a list (or a slice) with a for loop: for val in $PATH echo "entry: $val" end # Will print: # entry: /usr/bin/ # entry: /bin # entry: /usr/sbin # entry: /sbin # entry: /usr/local/bin One particular bit is that you can use lists like Brace expansion. If you attach another string to a list, it’ll combine every element of the list with the string: > set mydirs /usr/bin /bin > echo $mydirs/fish # this is just like {/usr/bin,/bin}/fish /usr/bin/fish /bin/fish This also means that, if the list is empty, there will be no argument: > set empty # no argument > echo $empty/this_is_gone # prints an empty line If you quote the list, it will be used as one string and so you’ll get one argument even if it is empty. For more, see Lists. For more on combining lists with strings (or even other lists), see cartesian products and Variable expansion. Wildcards¶ Fish supports the familiar wildcard *. To list all JPEG files: > ls *.jpg lena.jpg meena.jpg santa maria.jpg You can include multiple wildcards: > ls l*.p* lena.png lesson.pdf The recursive wildcard ** searches directories recursively: > ls /var/**.log /var/log/system.log /var/run/sntp.log If that directory traversal is taking a long time, you can ctrl-c out of it. For more, see Wildcards. Pipes and Redirections¶ You can pipe between commands with the usual vertical bar: > echo hello world | wc 1 2 12 stdin and stdout can be redirected via the familiar < and >. stderr is redirected with a 2>. > grep fish < /etc/shells > ~/output.txt 2> ~/errors.txt To redirect stdout and stderr into one file, you can use &>: > make &> make_output.txt For more, see Input and output redirections and Pipes. Command Substitutions¶ Command substitutions use the output of one command as an argument to another. Unlike other shells, fish does not use backticks `` for command substitutions. Instead, it uses parentheses with or without a dollar: > echo In (pwd), running $(uname) In /home/tutorial, running FreeBSD A common idiom is to capture the output of a command in a variable: > set os (uname) > echo $os Linux Command substitutions without a dollar are not expanded within quotes, so the version with a dollar is simpler: > touch "testing_$(date +%s).txt" > ls *.txt testing_1360099791.txt Unlike other shells, fish does not split command substitutions on any whitespace (like spaces or tabs), only newlines. Usually this is a big help because unix commands operate on a line-by-line basis. Sometimes it can be an issue with commands like pkg-config that print what is meant to be multiple arguments on a single line. To split it on spaces too, use string split. > printf '%s\n' (pkg-config --libs gio-2.0) -lgio-2.0 -lgobject-2.0 -lglib-2.0 > printf '%s\n' (pkg-config --libs gio-2.0 | string split -n " ") -lgio-2.0 -lgobject-2.0 -lglib-2.0 If you need a command substitutions output as one argument, without any splits, use quoted command substitution: > echo "first line second line" > myfile > set myfile "$(cat myfile)" > printf '|%s|' $myfile |first line second line| For more, see Command substitution. Separating Commands (Semicolon)¶ Like other shells, fish allows multiple commands either on separate lines or the same line. To write them on the same line, use the semicolon (“;”). That means the following two examples are equivalent: echo fish; echo chips # or echo fish echo chips This is useful interactively to enter multiple commands. In a script it’s easier to read if the commands are on separate lines. Exit Status¶ When a command exits, it returns a status code as a non-negative integer (that’s a whole number >= 0). Unlike other shells, fish stores the exit status of the last command in $status instead of $?. > false > echo $status 1 This indicates how the command fared - 0 usually means success, while the others signify kinds of failure. For instance fish’s set --query returns the number of variables it queried that weren’t set - set --query PATH usually returns 0, set --query arglbargl boogagoogoo usually returns 2. There is also a $pipestatus list variable for the exit statuses [1] of processes in a pipe. For more, see The status variable. [1] or “stati” if you prefer, or “statūs” if you’ve time-travelled from ancient Rome or work as a latin teacher Combiners (And, Or, Not)¶ fish supports the familiar && and || to combine commands, and ! to negate them: > ./configure && make && sudo make install Here, make is only executed if ./configure succeeds (returns 0), and sudo make install is only executed if both ./configure and make succeed. fish also supports and, or, and not. The first two are job modifiers and have lower precedence. Example usage: > cp file1 file1_bak && cp file2 file2_bak; and echo "Backup successful"; or echo "Backup failed" Backup failed As mentioned in the section on the semicolon, this can also be written in multiple lines, like so: cp file1 file1_bak && cp file2 file2_bak and echo "Backup successful" or echo "Backup failed" Conditionals (If, Else, Switch)¶ Use if and else to conditionally execute code, based on the exit status of a command. if grep fish /etc/shells echo Found fish else if grep bash /etc/shells echo Found bash else echo Got nothing end To compare strings or numbers or check file properties (whether a file exists or is writeable and such), use test, like if test "$fish" = "flounder" echo FLOUNDER end # or if test "$number" -gt 5 echo $number is greater than five else echo $number is five or less end # or # This test is true if the path /etc/hosts exists # - it could be a file or directo'''
