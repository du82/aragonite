title = "fish shell blog"
description = "A smart and user-friendly command line shell"
full_description = "About two years ago, our head maintainer @ridiculousfish opened what quickly became our most-read pull request: fish is a smart and user-friendly command line shell with clever features that just work, without needing an advanced degree in bash scriptology. Today we are announcing an open beta, inviting all users to try out the upcoming 4.0 release. During the work on fish 3.7.0, we discovered that the licensing information in the documentation for some of the derived code contained in fish had been removed during the work on fish 3.1.0, and that this was not corrected until the release of fish 3.7.0. Although the source contained the correct licensing information, this was not published as part of the release’s documentation. fish shell 3.6.0 has been released. Major new features include Control-R support for history search, and more powerful and customizable abbreviations. For the full list of changes, see the release notes. fish shell 3.4.1 has been released, fixing some regressions identified in 3.4.0. For the full list of changes, see the release notes. fish shell 3.4.0 has been released. This release includes support for $(cmd) command substitutions, a terminal interface to change themes, faster globbing, the ability to disable autosuggestions, and more. For the full list of changes, see the release notes. fish shell 3.3.1 has been released, addressing some problems identified in the recent 3.3.0 release. For the full list of changes, see the release notes. fish shell 3.3 has been released with many improvements. For the full list of changes, see the release notes. fish shell 3.2.2 has been released, addressing some additional issues in the recent 3.2.0 release. For the full list of changes, see the release notes. fish shell 3.2.1 has been released, addressing some issues in the recent 3.2.0 release. Notable fixes include restoring compatibility with Midnight Commander, and fixing an issue where text may unexpectedly appear on the terminal when pasting. fish shell 3.2 has been released. This release includes undo/redo support, better truncation for long prompts, reduced buffering with builtins, a simpler way to add to $PATH, a new theme for documentation and fish_config, and hundreds of bug fixes, new completions, and other improvements."
