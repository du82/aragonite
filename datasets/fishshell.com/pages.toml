["https://fishshell.com/blog/licensing-error"]
title = "Incomplete licensing information in previous fish releases"
description = "A smart and user-friendly command line shell"
full_description = "During the work on fish 3.7.0, we discovered that the licensing information in the documentation for some of the derived code contained in fish had been removed during the work on fish 3.1.0, and that this was not corrected until the release of fish 3.7.0. Although the source contained the correct licensing information, this was not published as part of the release’s documentation. While these are noted in the source code, the user-visible documentation does not contain an appropriate acknowledgement. We regret the error. It was discovered during a routine audit of the code and documentation for fish, which will occur during the release cycle on an ongoing basis."
year_published = 2024
