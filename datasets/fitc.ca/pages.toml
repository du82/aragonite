["https://fitc.ca/code-of-conduct"]
title = "Code of Conduct - FITC"
description = "Harassment-Free Events FITC is dedicated to providing a harassment-free conference experience for everyone, regardless of gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, or religion. All participants, speakers, sponsors and volunteers are expected to comply with this code of conduct to ensure a safe and welcoming environment for all in […]"
full_description = "Code of Conduct Harassment-Free Events FITC is dedicated to providing a harassment-free conference experience for everyone, regardless of gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, or religion. All participants, speakers, sponsors and volunteers are expected to comply with this code of conduct to ensure a safe and welcoming environment for all in attendance. We do not tolerate harassment of conference participants in any form. Conference participants violating these rules may be sanctioned or expelled from the conference, without a refund, at the discretion of the conference organizers. Harassment includes offensive verbal comments (related to gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race and religion), sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact, and unwelcome sexual attention. Participants asked to stop any harassing behaviour are expected to comply immediately. Speakers, exhibitors, sponsor or vendor booths, or similar activities are also subject to the anti-harassment policy. In particular, speakers and exhibitors should not use sexualized images, activities, or other material or content. Booth staff (including volunteers) should not use sexualized clothing/uniforms/costumes, or otherwise create a sexualized environment. If a participant engages in harassing behaviour, the conference organizers may take any action they deem appropriate, including warning the offender or expulsion from the conference (with no refund). If you are being harassed, notice that someone else is being harassed, or have any other concerns, please contact a member of conference staff immediately, either at the event, or via email or you can DM us on our FITC twitter account. Conference staff will be happy to help participants contact hotel/venue security or local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the conference. We value your attendance. We expect participants to follow these rules at all conference venues and conference-related social events."
year_published = 2025
year_updated = 2018
