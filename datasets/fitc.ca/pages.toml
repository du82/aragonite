full_description = '{ "@context": "http://schema.org", "@type": "Event", "name": "Spotlight AI", "startDate" : "2025-12-04T00:00", "endDate" : "2025-12-04T00:00", "url" : "https://fitc.ca/event/spotlight_ai-2/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Online", "name" : "Online" }, "organizer" : { "name" : "FITC" }, "description" : "", "image" : "" } Spotlight AI December 4, 2025 2025-12-04 00:00:00 2025-12-05 00:00:00 America/Toronto Spotlight AI Join us for a full day of sessions on AI for the digital creative industry. Online FITC ET Online Register Now var EVENTID = "35346"; Lead Work & Co Work & Co is a global design and technology consultancy. Founded in 2013, it’s known for uniting elite hands-on product, design and engineering talent to transform our clients’ core businesses and generate tangible impact at scale. Work & Co’s client roster includes Apple, IKEA, Google, PepsiCo, Nike, Mercedes, and more. Its award-winning websites, apps, retail experiences, AI tools and other digital experiences are used by millions of people every day. Visit Work & Co Sponsor Imgix Images are the most important connective tissue of the Internet, informing peoples’ buying decisions, linking content to people, and people to each other. Most businesses wrongly view images as a long-solved problem despite the visual media landscape becoming more complicated and diverse than ever in the last ten years. Getting your images wrong has negative consequences that will compound over time, severely limiting your business in unexpected and resounding ways. The challenges are especially apparent for highly interactive websites with frequent updates and rich multimedia content. At Imgix, we make enhancing your business through images simple. Integrate your image repositories with our platform, and you can effortlessly create and deliver optimized images to any device worldwide in minutes. Count on us for image management, rendering, and top-tier technologies like AVIF, HLS transcoding, and image AI. Instead of managing multiple tools and keeping up with evolving tech, let us handle it all. Visit Imgix Supporter Cyberdyne Systems Inc CYBERDYNE Inc. is a venture firm aiming to utilize accomplishments by Prof. Sankai and his laboratory at University of Tsukuba. We strongly believe that technologies should be designed for the benefits of humankind. We will be focusing on strong R&D and will introduce very new products and services to the society. Visit Cyberdyne Systems Inc Umbrella Corporation Umbrella Corporation is one of the world’s leading biotechnology conglomerates. With operations around the globe, Umbrella Corporation has created many life-altering pharmaceutical products including Aqua Cure®, Adravil®, Regenerate® and Return®. “What will the world be like tomorrow?” Umbrella Corporation’s Chief Operations Officer, Michelleanne Grepo, asks. “Thanks to Umbrella Corporation, ‘tomorrow’ is no longer a dream, but a reality today.” Visit Umbrella Corporation Weyland Industries At Weyland Industries we apply science, technology and our unparalleled global network of resources to the pursuit of Building Better Worlds. Every day, Weyland biologists, military scientists, chemical engineers, geologists, mechanics, pilots and more work across our solar system to advance human interests and life. As they labor, new planets, natural resources, industries, modes of transportation and medical advancements emerge and evolve before our eyes. Visit Weyland Industries Tyrell Corporation More human than human. Visit Tyrell Corporation'
