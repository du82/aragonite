["https://fitc.ca/speaker/jessica-hische"]
title = "Jessica Hische - FITC"
full_description = "Jessica Hische Lettering Artist, jessicahische.is Oakland, CA, USA Jessica Hische is a lettering artist and author living in Oakland, California. She’s had the pleasure of working for some pretty crazy clients over the years (like Wes Anderson, Starbucks, Fender Guitars, and the US Postal Service), and spends a little too much time “procrasti-working” on personal projects. She and her work have been featured in numerous design, illustration, type, and web publications, including Communication Arts, Print Magazine, Novum, Graphis, and Eye Magazine. She was named a ‘Forbes 30 under 30’, a Print “New Visual Artist”, an ADC Young Gun, and in 2018 was listed as one of Adweek’s “Creative 100”. Her first children’s book, “Tomorrow I’ll be Brave”, is available everywhere books are sold. bluesky twitter instagram wikipedia"
