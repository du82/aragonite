["https://fitc.ca/speaker/james-victore"]
title = "James Victore - FITC"
full_description = "James Victore Principle, Your Work is a gift Round Rock, Texas, USA ames Victore is an artist, author, and activist who teaches people how to illuminate their individual gifts in order to achieve personal greatness. Described as part Darth Vader, part Yoda, James Victore is the designer and creative thought leader whom people look to to find clarity and purpose in their life and work. James is widely known for his timely wisdom and impassioned views about design and its place in the world. At the helm of his independently run design studio, James continually strives to make work that is sexy, strong and memorable; work that tows the line between the sacred and the profane. James’ work has been exhibited (twice!) at the Museum of Modern Art in New York and is represented in the permanent collections of museums worldwide including the Louvre in Paris, the Stedelijk in Amsterdam and the Library of Congress. His clients include Adobe, MailChimp, Starbucks, Bobbi Brown Cosmetics, Aveda, Time and Esquire Magazines, Moet & Chandon, and The City of New York. His new book, “Feck Perfuction: Dangerous Ideas on the Business of Life” (Chronicle) will change your life. Serious. instagram linkedin"
