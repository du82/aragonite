["https://fitc.ca/speaker/stef-smet"]
title = "Stef Smet - FITC"
full_description = "Stef Smet Product Design Lead, Instagram New York, USA Stef discovered his passion for technology early, building his first websites at age 11 and drawing inspiration from skateboard culture. This blend of creativity and code has shaped his career for over a decade. He currently leads product design for GenAI creation at Instagram New York. Before this role, he spent two years as co-founder of Yello, a venture-backed startup that explored AI development tools. During his 7 years at Meta, he helped transform Meta Spark (formerly Spark AR) into a platform serving 600,000+ creators with millions of AR effects, and pioneered Instagram’s early blockchain initiatives to empower creator monetization. Before Meta, he co-founded True Story, a design studio partnering with a wide range of clients, from startups to large corporations like Bausch+Lomb, Nikon, etc.. Outside of work, he seeks adventure through snowboarding and kitesurfing. twitter linkedin FITC Amsterdam 2020 February 24-25, 2020 Amsterdam How Do You Build Something for Something That Doesn’t Really Exist Yet?"
