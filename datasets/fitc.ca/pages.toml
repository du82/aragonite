title = "Event Services - FITC"
description = "Not your typical events company Since our beginning in 2002, FITC has produced more than 200 events in 27 cities, with over 100,000 attendees. From smaller meet-ups to large corporate gatherings, VIP receptions to interactive activations, and in-person conferences to online events, we can help make your vision a reality – from concept to finish. […]"
full_description = "Event Services Not your typical events company Since our beginning in 2002, FITC has produced more than 200 events in 27 cities, with over 100,000 attendees. From smaller meet-ups to large corporate gatherings, VIP receptions to interactive activations, and in-person conferences to online events, we can help make your vision a reality – from concept to finish. We know how to start something that doesn’t yet exist Starting a new project or an event can be daunting, but making it happen is what we do best. We have years of experience starting, growing, and consulting events. We know the processes involved in starting a new event, or revitalizing an old one. From concept and budget to marketing and production, we’ll work with you every step of the way. We understand design and technology, so you don’t have to We’ve spent the last two decades working with some of the most creative and technological minds the world has to offer. We live, breathe, and understand the nuances of the design and tech industry, with focus on inspiration, education, and interactivity. Whether you’re looking to hold a small budget one-room workshop or an international conference across several venues, we deliver high quality production and execution for every event. We think about user experience Taking a human-centered approach to all of our events and designing each step of the event from the audience perspective, we make sure the experience is second to none. From vendors and speakers to venues and volunteers, we plan the big ideas and pay attention to the small details that make our events smart, seamless, and enjoyable. Feel free to reach out for a chat at pucknell@fitc.ca Clients include: IO CONNECT Toronto • 500 Attendees • 2024 Summer Mixer – Interactive Ontario & XP Gaming hosted an exclusive networking mixer following the first day of XP Game Summit and kicking off Toronto Games Week for the video game/XR industry. Event Management and Production Venue management Supplier sourcing and management Onsite registration management Onsite staffing and volunteer team management Budget management Onsite signage and print collateral “FITC has consistently exceeded our expectations as a logistics partner for our main industry events, the IO Connect Mixers. Their professionalism, reliability, and attention to detail have been outstanding. We trust them completely to deliver on time and with excellence, and they always do. I highly recommend FITC to anyone looking for a top-tier logistics partner.” Lucie Lalumière, President & CEO, Interactive Ontario GAME DEVS OF COLOR Online • 2,000 Attendees • 2022 to present GDoC’s mission is to amplify the creative power held by people of color in games. They do this by organizing revolutionary events, uniting our vibrant community, and building access to knowledge, funding, and opportunities. Creators of color make great games but are often pushed to the margins. GDoC fights to create a better games industry that is intersectional and equitable. Event Management and Production Event Platform setup and management Speaker management Managing of networking events Onsite staffing and volunteer team management “The FITC team elevated and polished our event in a way we never could—and our stress levels were way lower than any of the seven years before we started working together! They are a top-tier production partner, and we’re grateful to collaborate with them.” Catt Small, Co-founder, Game Devs of Color Expo t GATSBYCONF Online • 4,00 Attendees • 2022 Gatsby is a React-based open source framework with performance, scalability and security built-in, who also host an annual free event for their community. Event Management and Production Event Platform setup and management Speaker management Managing of networking events Onsite staffing and volunteer team management t “Their knowledge of and assistance in setting up our virtual event platform and ensuring all speakers felt prepared and confident as we headed into our two- day event meant our internal team could keep our focus on the announcements, talks, and workshops being planned. Without hesitation, we would reach out to them again for our next big event!” Laci Texter, Senior Brand Marketing Manager, Gatsby TAAFI INDUSTRY Toronto & Online • 1,500 Attendees • 2015 to present TAAFI, a non-profit volunteer organization, hosts an annual professional development event for the animation community in Toronto and surrounding areas. Event Management and Production Platform sourcing and management Supplier sourcing and management (DJ’s, designers, developers) Speaker management Sponsor deliverables/management Networking events Onsite staffing and volunteer team management Event budget management Ticketing/registration setup and management Event signage and collateral .. “FITC understands not only event management, but people management, process management, and crafting an exceptional audience experience to such a degree that we can focus on what we do best and let them take us from start to finish with a smile on everyone’s face. Highly recommended.” Ben McEvoy, Co-founder, Toronto Animation Arts Festival International STACK OVERFLOW AGM Philadelphia & Austin • 300 Attendees • 2019 & 2022 Stack Overflow, the largest, most trusted online community for developers, hosts an internal event each year to bring their staff together. Event Management and Production Venue sourcing and management Supplier sourcing and management (A/V, catering, rentals, printers, etc) Speaker management Offsite events Onsite staffing and volunteer team management Budget management Onsite signage and print collateral From my first call with FITC, I knew Stack Overflow was in good hands. Their knowledge, passion, and attention to detail, along with a kick-ass team, made our event one that can’t be beat. Ilana S. Yitzhaki, Sr. Manager, Employee Experience, Stack Overflow t SDC 2017 San Francisco • 6,000 Attendees • 2017 Held at the San Jose McEnery Convention Center in sunny California, the Samsung Developer Conference is a showcase of the hottest topics in tech. Talent Management Working with Samsung, we managed full communication, content management, and coordinated all 175+ speakers Curation FITC curated and delivered some of the most innovative and creative minds in the world of tech and design to compliment the programming of SDC 2017 t “The FITC team really delivers. They are one of the best events team you can work with. I highly recommend all the FITC organized events.” Suzanne Nguyen, Senior Director Emerging Platforms, Samsung t STYLEFRAMES New York // 500 Attendees // 2013 & 2016 Presented by STASH MEDIA, Styleframes is a unique event focused on the art of the pitch for the motion graphics, advertising and VFX industy. Event Management and Production Venue sourcing and management Supplier sourcing and management (A/V, catering, rentals, printers, etc) Speaker management Sponsor deliverables/management Offsite events Onsite staffing and volunteer team management Budget management Ticketing/registration setup and management Onsite signage and print collateral t “The FITC crew were instrumental in planning, promoting, and producing the Stash Style Frames conferences in New York. Shawn and Alfred both bring deep experience, obsessive attention to detail, and a pragmatic approach to problem solving that were crucial to our success in a tough market.” Stephen Price, Executive Editor, Stash Magazine Clients also include:"
