description = "Gone are the days where you need to use different tools for each stage of the design process. From research to concept pitches to developer handoff, we’ll help you convey your ideas and tell the story behind it, all in…"
full_description = 'Elizé LeborgneAdobe XD Enterprise Instructor & UX Consultant, Adobe Long Beach, CA linkedin instagram { "@context": "http://schema.org", "@type": "Event", "name": "Sessions: Design, Prototype &#038; Share with Adobe XD", "startDate" : "2021-05-07T00:00", "endDate" : "2021-05-07T00:00", "url" : "https://fitc.ca/event/adobexd/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Online", "name" : "Online" }, "organizer" : { "name" : "FITC" }, "description" : "", "image" : "https://media-library.fitc.ca/wp-content/uploads/2021/03/13180218/Intro-to-XD-2800x970-1-1-1280x443.png" } Sessions: Design, Prototype & Share with Adobe XD Gone are the days where you need to use different tools for each stage of the design process. From research to concept pitches to developer handoff, we’ll help you convey your ideas and tell the story behind it, all in… May 7, 2021 2021-05-07 00:00:00 2021-05-08 00:00:00 America/Toronto Sessions: Design, Prototype & Share with Adobe XD Gone are the days where you need to use different tools for each stage of the design process. From research to concept pitches to developer handoff, we’ll help you convey your ideas and tell the story behind it, all in… Online FITC Online Watch Now Lead Partner Lead Partner var EVENTID = "31167"; Event Overview Gone are the days where you need to use different tools for each stage of the design process. From research to concept pitches to developer handoff, we’ll help you convey your ideas and tell the story behind it, all in one place. We’ll cover all the basics of XD from managing components to building interactive prototypes. This is part 1 of a 2-part XD series and is highly recommended in order to make the most of the following session – Register now for part 2- The How and Why of Design Systems Note: We will provide a practice file if you choose to design alongside us! Download the latest XD version for free prior to the session. Objective Learn all the basics of XD from managing components to creating interactive prototypes. Five Things Audience Members Will Learn Key XD features to streamline your design workflow Manage colors, styles, and components centrally Create an interactive prototype from your designs Sharing and collaborating with others to get feedback Seamless integrations with Photoshop, Illustrator and Sketch Target Audience Anybody interested in a UX/UI tool. Assumed Audience Knowledge No prior knowledge of any design tool is necessary. Speakers Elizé LeborgneAdobe XD Enterprise Instructor & UX Consultant, Adobe Long Beach, CA linkedin instagram Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here. Frequently Asked Questions Is Closed Captioning available for this event? If you are using a current Chrome browser to watch the event, you can use enable this feature to enable live captioning for the event. While we can’t guarantee it will work, in our tests it does seem to work well. What will the production quality be like? FITC has been a leader in hosting events since 2002, and this year we’ve perfected the virtual experience for you—including invaluable content paired with high-end production values using Crowdcast for presentations, Slack for conversations, and more. Check out this 90-second highlight video from our last online event. Is everything recorded and available after the event? We will be recording 100% of the presentations and Q&As. As an attendee, you’ll be able to access these recordings for six months after the event. What’s the time zone for this event? The event will be held in the Eastern Time zone (EDT) and will run from 1pm to 2pm. How can I contact you to ask additional questions? Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP.'
