title = "A Designer's Guide to AI & Machine Learning - FITC"
description = "This interactive workshop gives participants a deep dive into AI, machine learning, and emerging technology, through the lens of human-centered design. This approach provides individuals & teams a repeatable and scalable toolkit that can be applied to building better AI-enabled solutions.⠀"
full_description = '{ "@context": "http://schema.org", "@type": "Event", "name": "A Designer&#8217;s Guide to AI &#038; Machine Learning", "startDate" : "2021-06-08T00:00", "endDate" : "2021-06-08T00:00", "url" : "https://fitc.ca/event/aimachinelearning/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Online", "name" : "Online" }, "organizer" : { "name" : "FITC" }, "description" : "Half-Day Interactive Workshop", "image" : "https://media-library.fitc.ca/wp-content/uploads/2020/05/26211458/forms08-05-1280x443.jpg" } A Designer’s Guide to AI & Machine Learning Half-Day Interactive Workshop Join us for this intimate and interactive half-day ONLINE workshop that will run from 11:00 a.m. to 3:00 p.m. EDT. This hands-on workshop gives participants a deep dive into AI, machine learning, and emerging technology, through the lens of human-centered… June 8, 2021 2021-06-08 00:00:00 2021-06-09 00:00:00 America/Toronto A Designer’s Guide to AI & Machine Learning Join us for this intimate and interactive half-day ONLINE workshop that will run from 11:00 a.m. to 3:00 p.m. EDT. This hands-on workshop gives participants a deep dive into AI, machine learning, and emerging technology, through the lens of human-centered… Online FITC 11:00 a.m. EDT Online var EVENTID = "31178"; Back by Popular Demand - Limited Seats Event Overview Join us for this intimate and interactive half-day ONLINE workshop that will run from 11:00 a.m. to 3:00 p.m. EDT. This hands-on workshop gives participants a deep dive into AI, machine learning, and emerging technology, through the lens of human-centered design. This approach provides individuals and teams a repeatable and scalable toolkit that can be applied to building better AI-enabled solutions. The program, delivered by the author of the AI Product Design Handbook, is intended for those involved with bringing disruptive digital products and services to market. Participants will walk away with a set of tools, methods, and frameworks focused on applying these technologies to customer and organizational problems. Who Attends? Past participants of this workshop include design and product leaders from: Spotify, RBC, TELUS, Saks, Desjardins, Scotiabank, Bell, Equifax and many others. The program is created for designers, product leaders, and UX strategists looking to understand and leverage the power of AI. “Thanks again for the workshop, it helped me understand how my role in product relates to the technical aspects of AI and predictive tools that we use as an organization. I’m looking forward to sharing some of the tools you introduced with my team as we continue our transformation journey. Love the chocolate chip cookie example!” Jason, Director of Product, Bell Objective Participants will leave the workshop with a deep understanding of AI & machine learning, along with new tools, methods and frameworks for a human-centered approach to these powerful technologies. This includes AI-specific ideation tactics, validation strategies, and an introduction to responsible AI design. Target Audience UX designers, product managers/directors, product designers Assumed Audience Knowledge None assumed Audience Members Will Learn Upon completion of this program, participants will: Gain confidence speaking about AI and its use cases (machine learning, deep learning, narrow vs. general) Be able to understand design patterns and use cases for AI products, services, and platforms Understand AI design and validation methods (such as a confusion matrix) and how to apply them Have a toolkit with frameworks for AI-focused ideation and overcoming technical barriers (toolkit includes several canvas tools, ideation deck, and program workbook) Understand the ethical and business impacts of data bias on AI and machine learning algorithms Needed to Participate Chrome on a desktop or laptop with audio/video capabilities Speakers Ramy NassarManaging Partner, 1000 Days Out Kitchener linkedin'
