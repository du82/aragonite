["https://fitc.ca/speaker/olivier-goulet"]
title = "Olivier Goulet - FITC"
full_description = "Olivier Goulet President, Supply + Demand Montreal, Canada Olivier is a visual designer and producer who specializes in all things multimedia. With 25 years of experience in multimedia and more than 1,000 productions under his belt, Olivier’s expertise is second to none when it comes to anything that involves video content. He has worked on more than 16 Cirque Du Soleil performances as a producer or designer, including Delirium, Zaia, The Beatles Love, Michael Jackson Immortals, X the Land of Fantasy, R.U.N., Volta, Crystal, Axel, Drawn to Life and Messi10. He designed visuals for some of the biggest names in the music industry (over 100 artists, including Justin Timberlake, Jay-Z, Taylor Swift, Cher, Bon Jovi, Alicia Keys, and Sade). Olivier has produced and designed content for multiple ceremonies and TV productions, including the Asian Games 2019 in Jakarta, the UAE National Day 2016, the Invictus Games 2016, and the Victoria’s Secret Annual Shows in NYC 2016, Paris 2017, and Shanghai 2018. Throughout his career, Olivier developed and maintained an impressive network of collaborators. His experience in the live entertainment industry and the theater world, where he first discovered his passion for multimedia, made him the inspired project leader he is today. Extensive industry experience inspired Olivier to co-found Geodezik, one of the top multimedia studios in the music industry, from 2005 to 2015. He led the multimedia division of Cirque Du Soleil (4U2C) as Executive Creative Director and Executive Producer when they acquired Geodezik from 2015 to 2020. Olivier founded Supply and Demand in 2020 to empower communities through multi-sensory experiences. More recently, he lent his deep understanding of the creative process, production, and technology to develop a new modular system for multimedia exhibits. These achievements prove his trailblazing approach to technology. The new modular system developed by Olivier allows Supply and Demand to create compelling experiences within a comprehensive, cost-efficient, and easy-to-operate infrastructure. The first modular exhibit system opened in July 2021 at the Calgary Telus Spark Center. Supply + Demand’s objective is to open five more before 2025. With that in mind, Olivier works alongside a team of committed partners at Supply + Demand. He uses his rich experience and insight into each project’s unique requirements to ensure that he consistently delivers remarkable results. instagram linkedin"
