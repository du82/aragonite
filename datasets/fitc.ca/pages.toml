["https://fitc.ca/about"]
title = "About - FITC"
description = "Who are we? FITC stands for ‘Future. Innovation. Technology. Creativity.’ – four words that capture the essence of what our company and events are all about. We produce design and technology focused events worldwide that inspire, educate and challenge attendees. Since 2002, FITC has brought together like-minded professionals in Toronto, Amsterdam, Tokyo, San Francisco, Chicago, Seoul, New York, […]"
full_description = "Shawn Pucknell Founding Director Creative guru and successful entrepreneur, Shawn began his career in 1996 as a Flash developer producing award winning content for Maclaren McCann and later Blast Radius. He was the lead author on the Macromedia Press title “Flash MX 2004 Demystified”, and in 2001 he began his community efforts by starting the Toronto Flash user group FlashinTO. A notable and respected figure in the new media industry, he has taught at OCAD University and the International Academy of Design, is frequently called on to sit on program advisory boards and judge international award shows including SXSW Interactive, and in 2009 he was honoured with an induction into Algonquin College's Media Hall of Fame. Contact Leo Mates Event Producer Mostly within the world of theatre, Leo has spent just over a decade in Live Events, and has spent that time working across North America, the UK, and Spain. With experience that has ranged from designing immersive experiences to finding transport for an unexpectedly large number of crabs, Leo is always ready for the unexpected when it comes to events, and will always bring the best out of any project he is working on. In his spare time, Leo can usually be found working on various creative projects that he promises will start making sense as soon as they are finished, or attempting to finally find time to finish whatever book he's obsessing over this month.' Contact Alfred Park Senior Advisor With more than a decade of experience running professional development events, Alfred is a seasoned pro. He is a master of spreadsheets, checklists, contract negotiations, and dongles. In his years with FITC, Alfred’s responsibilities have evolved to him quite literally running the show. He is a multi-faceted event production guru who knows how to turn an event concept into a reality, from start to finish. A geek at heart, Alfred fits in well with the attendees of the design and tech events he hosts in the name of FITC worldwide. You’ll often find him tinkering with every device in the office to all hours of the morning and surfing on Reddit. Contact"
