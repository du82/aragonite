description = "Learn 7 key habits that enhance critical thinking, expand creative ideation, and integrate AI efficiently into your workflow."
full_description = '{ "@context": "http://schema.org", "@type": "Event", "name": "7 Habits For Highly Effective Prompting // Workshop", "startDate" : "2024-10-04T00:00", "endDate" : "2024-10-04T00:00", "url" : "https://fitc.ca/event/7_habits/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Online", "name" : "Online" }, "organizer" : { "name" : "FITC" }, "description" : "", "image" : "https://media-library.fitc.ca/wp-content/uploads/2024/04/24172804/7Habits-1280x720.png" } 7 Habits For Highly Effective Prompting // Workshop Learn 7 key habits that enhance critical thinking, expand creative ideation, and integrate AI efficiently into your workflow. October 4, 2024 2024-10-04 00:00:00 2024-10-05 00:00:00 America/Toronto 7 Habits For Highly Effective Prompting // Workshop Learn 7 key habits that enhance critical thinking, expand creative ideation, and integrate AI efficiently into your workflow. Online FITC ET Online var EVENTID = "35518"; Tickets are limited! Event Overview This intensive half-day workshop, led by renowned AI expert and creative consultant Jason Theodor, introduces a powerful framework for optimizing interactions with AI systems. Participants will learn and practice 7 key habits that enhance critical thinking, expand creative ideation, and seamlessly integrate AI into their workflow. By the end of this hands-on session, you’ll have practical skills to unlock the immense potential of AI tools through effective prompting. Date & Time: October 4| 1:00 PM – 4:00 PM ET Format: Online Interactive Workshop Course Objectives Master the art of AI prompting to significantly boost productivity and creative capabilities Develop a strategic approach to AI collaboration that maintains human agency and creativity Learn to leverage AI as a powerful tool for problem-solving, ideation, and decision-making Gain confidence in navigating and utilizing various AI platforms effectively The 7 Habits Format: Describe your intent clearly Chain-of-Thought: Show your work Role-Play: Ask an expert Tree of Thoughts: Expand your work Reflexion: Check your work Evaluation: Grade your work Mimicry: Use your words These habits form a comprehensive framework for engaging with AI, ensuring that interactions are purposeful, creative, and yield high-quality outputs. Target Audience This workshop is ideal for: Creators and artists looking to integrate AI into their process Professionals seeking to enhance productivity and decision-making Technologists aiming to optimize AI interactions Students and educators interested in leveraging AI for learning and teaching Anyone curious about maximizing the potential of AI in their work and life Prerequisites Participants should have basic familiarity with conversational AI tools. At minimum, attendees should have used ChatGPT, Gemini, Claude, Pi, or Copilot at least once. Key Takeaways Craft clear, effective prompts that yield precise and relevant AI responses Utilize techniques to enhance reasoning and logic in AI-generated content Apply methods to stimulate creative idea generation using AI Implement processes for evaluating and optimizing AI-generated results Maintain your unique voice and vision while collaborating with AI Workshop Format Interactive Lectures: Concise, informative sessions introducing each habit Hands-on Exercises: Practical prompting activities to reinforce learning Real-time AI Interaction: Direct experience with multiple AI platforms Group Discussions: Collaborative problem-solving and idea sharing Q&A Sessions: Opportunities to address specific challenges and scenarios Instructor Bio Jason Theodor is a seasoned creative consultant and recognized expert in AI-enhanced productivity. With over two decades of experience in design and innovation, Jason brings a unique perspective on integrating cutting-edge AI tools into creative and professional workflows. His approach emphasizes maintaining human creativity and critical thinking while leveraging the power of AI. Practical Information Platform: Zoom (link will be provided closer to event date) Materials: Participants should set up free accounts on ChatGPT, Copilot, Gemini, or Claude prior to the workshop Engagement: Come prepared to actively participate in discussions and exercises Expected Outcomes By the end of this workshop, participants will: Have a robust framework for effective AI collaboration Be able to generate higher quality outputs from AI interactions Feel confident in their ability to guide and control AI tools Understand how to maintain creative agency while leveraging AI capabilities Be prepared to implement AI-enhanced workflows in their specific fields Invest in your future today. Master the art of AI collaboration and position yourself at the forefront of this transformative technology. Speakers Jason TheodorCreative Consultant, MoreBetterDifferent.org Toronto linkedin Why buy a ticket? Ideas and inspiration Explore innovative techniques for working with AI to help you creatively. Bring cutting-edge knowledge back to your team. Leading edge programming Hear from a leader in the AI community. Take part in live Q&As and hands on exercises. Amazing quality FITC has been a leader in hosting online events and. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Learn along with like-minded folks who appreciate the value of a community. Frequently Asked Questions Why should I attend? You should attend because AI is changing the world, and quickly, and you want to stay current.You’ll gain professional insights and practical solutions to sharpen your skills. You’ll bring cutting-edge tools back to your team. Also, you’ll connect with a like-minded community. What will the format be like? This half-day ONLINE workshop will run from 1 p.m. to 4 p.m. EST, with a format that includes presentations, and will include live Q&A. There will also be a 15-minute intermission half way through the workshop What will the production quality be like? FITC has been a leader in hosting events since 2002, and this year we’ve perfected the virtual experience for you—including invaluable content paired with high-end production values using Crowdcast for presentations. Check out this 90-second highlight video from our last online event. If I can’t attend last minute, are refunds available? Unfortunately, we’re not in a position to issue refunds this year, but we are happy to setup a credit for you towards any future FITC event. Is there a code of conduct for attendees? Yes – you’ll need to agree to our code of conduct when you buy your ticket. Preview it here. What’s the time zone for this event? The event will be held in the Eastern Daylight time zone (EDT), from 1pm to 4pm. How can I contact you to ask additional questions? Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP.'
