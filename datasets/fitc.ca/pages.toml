["https://fitc.ca/event/am08"]
title = "FITC Amsterdam 2008 - FITC"
description = "Having successfully held events in Toronto, Chicago, Winnipeg, and Hollywood, FITC makes its Europe debut in Amsterdam."
full_description = '''{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Amsterdam 2008", "startDate" : "2008-02-25T00:00", "endDate" : "2008-02-26T00:00", "url" : "https://fitc.ca/event/am08/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Amsterdam", "name" : "Amsterdam" }, "organizer" : { "name" : "FITC" }, "description" : "Design. Technology. Cool Shit. ", "image" : "https://media-library.fitc.ca/wp-content/uploads/2012/06/16213751/a-1280x444.png" } FITC Amsterdam 2008 Design. Technology. Cool Shit. Having successfully held events in Toronto, Chicago, Winnipeg, and Hollywood, FITC makes its Europe debut in Amsterdam. February 25-26, 2008 2008-02-25 00:00:00 2008-02-27 00:00:00 America/Toronto FITC Amsterdam 2008 Having successfully held events in Toronto, Chicago, Winnipeg, and Hollywood, FITC makes its Europe debut in Amsterdam. Amsterdam FITC Amsterdam var EVENTID = "2461"; Event Overview At a Glance Explore the creation of NEW ideas and concepts, where the limits of technology in design and art can be experimented with, explored, broken and reinvented. Learn how designers and technologist are pushing limits that go beyond what their tools are designed to do, how they find alternate ways to get what they want, and push the boundaries of what is possible to avoid mediocrity. FITC comes to Amsterdam to facilitate the interaction of some of the most talented design work with the best technologists found today, laying the groundwork for the future in which digital interactive interfaces surround us. Whether your weapon of choice is Flash, Photoshop, Illustrator, After-Effects, or a combination of all, you’re in for a wild ride of presentations, panel discussions, and of course the infamous FITC parties. With some of the most interesting and engaging presenters from around the world, its 2 days and nights that will leave you inspired, energized and awed. Subscribe Jump on our monthly newsletter to get all the latest updates, news and discounts to this event and all our events. Subscribe Now Media Media Kit Get in touch and we'll send you our info package for more information about this event. Get in touch Media Registration Interested in covering an FITC event? Fill in our quick registration form and we'll get back to you shortly. Register Now Banners and Promo Copy Visit our banners page for current web banners and promotional copy for all of our current events. Banners / Info Logo Feel free to download our logo for your usage. For web, please link it to fitc.ca Download GMUNKDesign Director, gmunk.com San Francisco twitter vimeo Samuel Agesilas Chicago twitter linkedin Chris Allen Boston twitter Aral Balkan twitter R Blank Las Vegas twitter linkedin Lee Brimelow twitter Marco Casario twitter Nikolai Cornell San Francisco twitter All Speakers Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here.'''
