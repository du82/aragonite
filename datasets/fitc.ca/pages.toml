full_description = 'Elizé LeborgneAdobe XD Enterprise Instructor & UX Consultant, Adobe Long Beach, CA linkedin instagram { "@context": "http://schema.org", "@type": "Event", "name": "Sessions: Advanced Prototyping in Adobe XD", "startDate" : "2021-06-17T00:00", "endDate" : "2021-06-17T00:00", "url" : "https://fitc.ca/event/advancedprototyping/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Online", "name" : "Online" }, "organizer" : { "name" : "FITC" }, "description" : "", "image" : "https://media-library.fitc.ca/wp-content/uploads/2021/05/28142828/fitc-adv-prototyping-2800x970-1-1280x443.jpg" } Sessions: Advanced Prototyping in Adobe XD Join us for this free 60-minute online session at 1:00 p.m. EDT Whether you’re pitching for new business or sharing designs with your team, prototyping helps teams communicate intent and test their hypotheses. Building realistic prototypes helps remove barriers for… June 17, 2021 2021-06-17 00:00:00 2021-06-18 00:00:00 America/Toronto Sessions: Advanced Prototyping in Adobe XD Join us for this free 60-minute online session at 1:00 p.m. EDT Whether you’re pitching for new business or sharing designs with your team, prototyping helps teams communicate intent and test their hypotheses. Building realistic prototypes helps remove barriers for… Online FITC Online Watch Now Lead Partner Lead Partner var EVENTID = "31302"; Event Overview Join us for this free 60-minute online session at 1:00 p.m. EDT Whether you’re pitching for new business or sharing designs with your team, prototyping helps teams communicate intent and test their hypotheses. Building realistic prototypes helps remove barriers for a user and yields richer results. Objective Learn how to design realistic prototypes in Adobe XD. Five Things Audience Members Will Learn Transform a static design into a high fidelity prototype Add motion effects, playful interactions, visual feedback, and smooth transitions Create voice commands and speech playback Make component states and hover effects to create micro-interactions Web-based sharing with stakeholders, developers and users Target Audience Anybody interested in a UX/UI tool. Assumed Audience Knowledge No prior knowledge of any design tool is necessary. This is part 3 of the 3-part XD series. You do not need to have watched the previous session but it is recommended. Part 1, and Part 2. Note: We will provide a practice file if you choose to design alongside us! Download the latest version of Adobe XD for free prior to the session. Speakers Elizé LeborgneAdobe XD Enterprise Instructor & UX Consultant, Adobe Long Beach, CA linkedin instagram Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here. Frequently Asked Questions Is Closed Captioning available for this event? If you are using a current Chrome browser to watch the event, you can use this feature to enable live captioning for the event. While we can’t guarantee it will work, in our tests it does seem to work well. What will the production quality be like? FITC has been a leader in hosting events since 2002, and this year we’ve perfected the virtual experience for you—including invaluable content paired with high-end production values using CrowdCast for presentations, Slack for conversations, and more. Check out this 90-second highlight video from our last online event. Is everything recorded and available after the event? We will be recording 100% of the presentations and Q&As. As an attendee, you’ll be able to access these recordings for six months after the event. What’s the time zone for this event? The event will be held in the Eastern Time zone (EDT) and will run from 1:00 p.m. to 2:00 p.m. How can I contact you to ask additional questions? Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP.'
