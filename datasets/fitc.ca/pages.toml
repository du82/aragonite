description = "Now in its 7th year, FITC Amsterdam 2014 is host to the latest and greatest in design, technology and cool shit from all around the globe."
full_description = '''{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Amsterdam 2014", "startDate" : "2014-02-24T00:00", "endDate" : "2014-02-25T00:00", "url" : "https://fitc.ca/event/am14/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Amsterdam", "name" : "Amsterdam" }, "organizer" : { "name" : "FITC" }, "description" : "Design. Technology. Cool Shit. ", "image" : "https://media-library.fitc.ca/wp-content/uploads/2013/09/16214611/aa-1280x443.png" } Created with love by Sara Blake, ZSO. FITC Amsterdam 2014 Design. Technology. Cool Shit. Now in its 7th year, FITC Amsterdam 2014 is host to the latest and greatest in design, technology and cool shit from all around the globe. February 24-25, 2014 2014-02-24 00:00:00 2014-02-26 00:00:00 America/Toronto FITC Amsterdam 2014 Now in its 7th year, FITC Amsterdam 2014 is host to the latest and greatest in design, technology and cool shit from all around the globe. Amsterdam FITC Amsterdam Lead Partner Lead Partner var EVENTID = "12941"; Event Overview Where Design, Technology and Interactivity Intersect Join fellow digital creators and world renowned speakers at the Felix Meritis this February to learn about HTML5, CSS, design, creativity and so much more. FITC is the intersection between Creative Technologists, Designers, Developers and all-around awesome thinkers from various innovative industries across the globe. They converge every year in Amsterdam to connect, challenge, inspire and to experience the cutting edge in design and technology. This event has a history of selling out, so register today so you don’t miss out on… Two-day conference, one day of two optional workshops and two FITC evening events. Over 50 presentations and panels covering creative, technical and business topics in digital media. Topics Web Frameworks • Creative Coding • Installations/Hardware • Experiential media • Projection mapping • Gaming • Creativity • Design • Art • Video/VFX • WebGL • HTML5 • Javascript • APEXvj • Data Visualization • SASS • Cross Media • Plus more! Early Bird Tickets Early bird tickets are available until January 17th, so grab one before they’re gone and save $. Have a group? We offer a 20% discount on our 4 packs! Why should you attend? FITC Amsterdam covers the future of everything innovative, technical and creative to leave you informed, challenged and inspired to create your very best work. You’ll also have the opportuntiy to network with like-minded individuals. Connect with people who share your passion at presentations, in the exhibitor hall, or at one of the legendary parties – you could very well meet your next business partner, employee or boss. Who should attend DIGITAL CREATORS and TECHNOLOGISTS. This festival is for designers, developers, digital artists or anyone who creates things in the digital space. From technical to inspirational sessions, there’s always something for you, no matter what stage of your career you’re in. Subscribe Jump on our monthly newsletter to get all the latest updates, news and discounts to this event and all our events. Subscribe Now Media Media Kit Get in touch and we'll send you our info package for more information about this event. Get in touch Media Registration Interested in covering an FITC event? Fill in our quick registration form and we'll get back to you shortly. Register Now Banners and Promo Copy Visit our banners page for current web banners and promotional copy for all of our current events. Banners / Info Logo Feel free to download our logo for your usage. For web, please link it to fitc.ca Download Past Events FITC Amsterdam 2013 Amsterdam February 17-19, 2013 FITC Amsterdam 2012 Amsterdam February 27-28, 2012 FITC Amsterdam 2011 Amsterdam March 8-9, 2011 FITC Amsterdam 2010 Amsterdam February 22-23, 2010 FITC Amsterdam 2009 Amsterdam February 22-24, 2009 FITC Amsterdam 2008 Amsterdam February 25-26, 2008 Speakers Sougwen ChungArtist / Researcher / Technologist, sougwen.com New York linked