["https://fitc.ca/speaker/jasonzada"]
title = "Jason Zada - FITC"
full_description = "Jason Zada Founder / CCO, Secret Level San Francisco, USA Jason Zada is an award-winning filmmaker, creative technologist, and pioneer in AI-driven storytelling. With a career spanning film, interactive media, and emerging technology, he has consistently pushed the boundaries of how stories are told and experienced. He is best known for directing the feature film The Forest and creating the viral interactive experience Take This Lollipop, which captivated millions worldwide. His work seamlessly blends innovation and emotion, redefining audience engagement across multiple platforms. As the founder of Secret Level, the leading AI-native entertainment studio, Jason is at the forefront of reimagining filmmaking with artificial intelligence. His work explores how AI can revolutionize storytelling, reshape creative workflows, and challenge traditional notions of authorship. Through Secret Level, he is developing groundbreaking AI-native content while fostering a new generation of AI filmmakers. A thought leader in the space, Jason continues to push the limits of what’s possible, bridging technology and creativity to shape the future of entertainment. bluesky twitter linkedin wikipedia instagram imdb jasonzada.com"
