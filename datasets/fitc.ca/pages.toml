able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here. Frequently Asked Questions Why should I attend? You should attend because AI is going to affect all of us. We’ll have the most relevant topics in the space through some of the most knowledgeable minds in the industry. You’ll gain professional insights and practical solutions to sharpen your skills. You’ll also connect with a like-minded community. Is Closed Captioning available for this event? For online viewers, if you are using a current Chrome browser to watch the event, you can use this feature to enable live captioning for the event. While we can’t guarantee it will work, in our tests it does seem to work well. What will the online ticket quality be like? FITC has been a leader in hosting events since 2002, and this year we’ve perfected the virtual experience for you—including invaluable content paired with high-end production value using CrowdCast for presentations, chat and Q&A. Check out this 90-second highlight video of our last online events! Is everything recorded and available after the event? All presentations and Q&As are recorded for re-watching for both in-person and online attendees. You’ll be able to access these recordings for six months after the event. Is there a code of conduct for attendees? Yes – you’ll need to agree to our code of conduct when you buy your ticket. Preview it here. What’s the time zone for this event? The event will be held in the Eastern Daylight Time (EDT). How can I contact you to ask additional questions? Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP.'
