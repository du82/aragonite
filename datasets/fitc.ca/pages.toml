["https://fitc.ca/speaker/manuel-sainsily"]
title = "Manuel Sainsily - FITC"
full_description = "Manuel Sainsily AI Ethics Instructor, Manu.Vision Montreal, Canada Manuel Sainsily is a TEDx Speaker, and XR & AI Instructor at McGill University, OCADU, and UMass Boston. Born in Guadeloupe, and Canadian citizen based in Montreal where he completed his Master of Science in Computer Sciences, he is a trilingual global speaker (45 talks in 29 cities in 2024), designer, and educator with over 15 years of experience who champions the responsible use and understanding of artificial intelligence. From delivering a Masterclass on AI Ethics and speaking at worldwide tech, film, and gaming conferences, to being celebrated by NVIDIA, Mozilla Rise25 & SkillShare, and producing art exhibitions with Meta, OpenAI & VIFFest, Manuel amplifies the conversation around cultural preservation and emerging technologies such as Spatial Computing, AI, Real-Time 3D, Haptics, and BCI through powerful keynotes and curated events. instagram twitter youtube linkedin ted tiktok threads beacons.ai/manuvision"
