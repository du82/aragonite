["https://fitc.ca/diversity"]
title = "Diversity - FITC"
description = "We at FITC believe that having a diverse range of voices at our events makes them stronger, and better. Our current definition of diversity includes people of all gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, or religion. Having these voices on stage, and attending, allows us all to grow […]"
full_description = "Diversity We at FITC believe that having a diverse range of voices at our events makes them stronger, and better. Our current definition of diversity includes people of all gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, or religion. Having these voices on stage, and attending, allows us all to grow through hearing their experiences, stories, and viewpoints. Speakers Encourage further diversity in our speakers, including people of all races, religions, genders, sexual orientations, and the physically disabled. How? We will continue to be proactive in our efforts to find and review as diverse a group of potential speakers as we can; We will continue to track our speaker diversity, and to increase our goals for future events; We will strongly encourage companies that are sending speakers to our events to send diverse speakers; We will continue to seek out opportunities to talk about these issues at our events. Attendees We have launched a Scholarship program (This replaces our FITC Womens initiative that we ran from 2010 to 2016); We will continue to work with industry organizations that foster diversity (including but not limited to Women in Film and TV, Women Who Code, Girl Geeks Toronto, Ladies Learning Code, and Girls in Tech); We will strive to ensure that all of our venues are physically accessible to all; We will continue to work with any attendees with special needs to ensure they are accommodated as best that we can at our events. Question? Concerns? Comments? Please feel free to reach out to us at info@fitc.ca or you can contact any of our staff directly on this page. sincerely, — Shawn Pucknell, Founding Director and the entire team at FITC."
