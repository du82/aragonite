["https://fitc.ca/speaker/tom-emrich"]
title = "Tom Emrich - FITC"
full_description = "Tom Emrich Author, The Next Dimension San Francisco, USA Sometimes called the “man from the future,” Tom is recognized as a pioneer in augmented reality (AR), virtual reality (VR), and wearable technology. He has over 15 years of experience working in this space and a proven track record of leading teams and landing strategic impact for powerhouse brands and organizations. Tom’s first book, “The Next Dimension,” published by Wiley, is the definitive guide to transforming your business with spatial computing. It explores the power of augmented reality to propel your business strategy into the next wave of computing and features real use cases and proof points of augmented reality in marketing, advertising, and sales. You can order your copy at thenextdimensionbook.com. As a product leader, Tom has built teams, shaped solutions, and created developer ecosystems for some of the most influential AR/MR platforms, including those from Niantic and Meta. As VP of Product at 8th Wall, the WebAR platform now part of Niantic, Tom was instrumental in enabling agencies and brands with tools to create browser-based AR content for business growth. Some brands that launched WebAR campaigns powered by 8th Wall include Nike, Porsche, Sony Pictures, Burger King, General Mills, Heineken, McDonald’s, Red Bull, and COACH. Tom has played a critical role in building the AR/VR/wearables community. In 2013, Tom founded We Are Wearables, which grew to the largest wearable tech community before it was acquired. He also co-produced AWE, the world’s #1 spatial computing event series, expanding and growing this community globally. An investor in this space, Tom was a founding partner at Super Ventures, a Silicon Valley-based VC fund dedicated to early-stage investing in AR. Super Ventures investments include Gravity Sketch, Forcite (acquired by GoPro), Cognitive3D, and 6D.ai (acquired by Niantic). Tom was a freelance journalist and a recurring wearable tech expert on Canada’s largest TV morning show. In 2012, global events leader UBM acquired Tom’s influential blog about wearable tech, one of the earliest sources of news and analysis in the sector. Tom’s thoughts on this space have been featured in publications such as CNN, BBC, Forbes, and The New York Times and at conferences such as TEDx, CES, and SXSW. bluesky twitter linkedin instagram book"
