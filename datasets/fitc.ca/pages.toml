["https://fitc.ca/speaker/lanceweiler"]
title = "Lance Weiler - FITC"
full_description = "Lance Weiler Writer, Director & Experience Designer New York, USA Lance Weiler is a storyteller, entrepreneur and thought leader. An alumni of the Sundance Screenwriting Lab, he is recognized as a pioneer because of the way he mixes storytelling and technology. WIRED magazine named him “one of 25 people helping to re-invent entertainment and change the face of Hollywood.” Always interested in experimenting with new ways to tell stories and engage audiences, Lance has designed experiences that have reached millions of people via theaters, mobile devices, and online. In recognition of these storytelling innovations, BUSINESSWEEK named Lance “One of the 18 Who Changed Hollywood.” He sits on a World Economic Forum steering committee for the future of content creation and teaches at Columbia University on the art, craft, and business of storytelling in the 21st Century. Lance is currently developing a slate of film, tv, and gaming projects. bluesky twitter linkedin instagram facebook wikipedia lanceweiler.com FITC Toronto 2025 // In-person April 28-29, 2025 Toronto Creative Flux: Narrative, Imagination, And Generative Systems FITC Toronto 2025 // Online April 28-29, 2025 Online Creative Flux: Narrative, Imagination, And Generative Systems"
