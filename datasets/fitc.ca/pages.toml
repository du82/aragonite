title = "FITC Toronto 2025 - FITC"
description = "Pure Imagination // April 29 - May 1 - a professional celebration of the best the world has to offer in design, digital development, media and innovation in creative technologies – three days and nights of presentations, parties, installations and performances that unite and transform the industry."
full_description = 'var EVENTID = "35938"; FITC Toronto APRIL 28-29 2025 The Ultimate Conference For Digital Creators Of All Kinds. Event Overview Event Overview We look forward to seeing you at FITC Toronto, a professional celebration of the best the world has to offer in design, digital development, media, and innovation in creative technologies – two very full days that unite and transform the industry. Featured Speakers And Many More > Jessica Hische bluesky twitter Lettering Artist, jessicahische.is James Victore instagram linkedin Principle, Your Work is a gift Robert Hodgin bluesky instagram Head of R&D, Partner, Rare Volume Jason Zada bluesky twitter Founder / CCO, Secret Level And Many More > Why Attend 1 Ideas & Inspiration Network with well-known creatives from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Why Attend 2 Exciting Programming Hear from the industry’s top professionals from around the globe, and take part in live Q&As. Why Attend 3 A Sense of Community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of this community. Choose Your Experience Join us either in-person or online for our upcoming FITC Toronto 2025 event on April 28-29. April 28-29The Great Hall View Details April 28-29Online View Details FAQ What is the schedule of the event? > The event is on April 28-29, 2025, spanning two full days with two tracks of presentations and round table discussions to choose from. There will also be an exhibitor lounge, and an attendee lounge. We will be hosting an evening event on the Monday April 28, with details to come soon Why should I attend? > Because digital design is your passion. It’s time to get inspired. FITC Toronto explores the most relevant topics in the space through some of the most knowledgeable minds in the industry. You’ll gain professional insights and practical solutions to sharpen your skills. Also, you’ll connect with a like-minded community. What’s included with my ticket? > Access to all presentations at the event, including being part of the Q&A with each presenter Six months of access to all of the session videos from the main room after the event Access to all activities during the event including an evening event on Monday April 29. Is everything recorded and available after the event? > We will be recording the Main Hall presentations, which you will have access to right after the event for up to 6 months. Is there a code of conduct for attendees? > Yes – you’ll need to agree to our code of conduct when you buy your ticket. Preview it here. What is the COVID protocol for this event? > Masks are optional We will have hand sanitizer available at the event entrance We ask that you do NOT attend if you are feeling ill or have been exposed to someone with COVID How can I contact you to ask additional questions? > Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP. The event is on April 28-29, 2025, spanning two full days with two tracks of presentations and round table discussions to choose from. There will also be an exhibitor lounge, and an attendee lounge. We will be hosting an evening event on the Monday April 28, with details to come soon Because digital design is your passion. It’s time to get inspired. FITC Toronto explores the most relevant topics in the space through some of the most knowledgeable minds in the industry. You’ll gain professional insights and practical solutions to sharpen your skills. Also, you’ll connect with a like-minded community. Access to all presentations at the event, including being part of the Q&A with each presenter Six months of access to all of the session videos from the main room after the event Access to all activities during the event including an evening event on Monday April 29. We will be recording the Main