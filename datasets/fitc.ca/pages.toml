title = "FITC Toronto 2025 // In-person - FITC"
description = "Pure Imagination // April 29 - May 1 - a professional celebration of the best the world has to offer in design, digital development, media and innovation in creative technologies – three days and nights of presentations, parties, installations and performances that unite and transform the industry."
full_description = '{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Toronto 2025 // In-person", "startDate" : "2025-04-28T00:00", "endDate" : "2025-04-29T00:00", "url" : "https://fitc.ca/event/to25_ip/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Toronto", "name" : "Toronto" }, "organizer" : { "name" : "FITC" }, "description" : "The Ultimate Conference For Digital Creators Of All Kinds.", "image" : "https://media-library.fitc.ca/wp-content/uploads/2024/11/15182100/FITC_0030_webAssets_main_des_v0001-1280x720.png" } Artwork by Cantina Creative FITC Toronto 2025 // In-person The Ultimate Conference For Digital Creators Of All Kinds. Join us for a celebration of the best the world has to offer in design, digital development, media and innovation in creative technologies. April 28-29, 2025 2025-04-28 00:00:00 2025-04-30 00:00:00 America/Toronto FITC Toronto 2025 // In-person Join us for a celebration of the best the world has to offer in design, digital development, media and innovation in creative technologies. Toronto FITC ET Toronto Register Now var EVENTID = "35751"; Event Overview Join us as we explore the future of everything innovative, technical and creative to leave you informed, challenged and inspired. With hand-picked speakers from around the world and from a variety of backgrounds, we’ve got you covered. In-Person & Online Join us in-person, or online and watch from home. In-person ticket holders also get access to the online event and the recordings. The 2025 Theme: Resonate This year, FITC Toronto explores the shared frequency that bridges the space between people, ideas, and moments, when artistic expression illuminates universal bonds between creator and audience. This hum of alignment reverberates through time and craft and reminds us that we are all universally and inextricably linked. Together, we resonate. Speakers Jessica HischeLettering Artist, jessicahische.is Oakland, CA bluesky twitter James VictorePrinciple, Your Work is a gift Round Rock, Texas instagram linkedin Jason ZadaFounder / CCO, Secret Level San Francisco bluesky twitter Robert HodginHead of R&D, Partner, Rare Volume Brooklyn bluesky instagram Tom EmrichAuthor, The Next Dimension San Francisco bluesky twitter Lance WeilerWriter, Director & Experience Designer New York bluesky twitter Alan WilliamsCreative Director, Imaginary Forces New York twitter instagram Neil MendozaArtist, Neil Mendoza Studio Albuquerque bluesky twitter Mark JonesDean, Sheridan College Toronto instagram facebook Carly CerquoneDesign Supervisor, Cantina Creative Vancouver linkedin Manuel SainsilyAI Ethics Instructor, Manu.Vision Montreal instagram twitter Brad MacDonaldPrincipal, Brass Elastic New York City instagram linkedin All Speakers Why buy a ticket? Ideas and inspiration Network with well-known creatives from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from around the globe, and take part in live Q&As. Amazing quality FITC has been a leader in hosting conferences since 2002 and this year we’ll be delivering it live and online for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of this community. Main Hall talks will be recorded All the presentations in the main hall will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Frequently Asked Questions What is the schedule of the event? The event is on April 28-29, 2025, spanning two full days with two tracks of presentations and round table discussions to choose from. There will also be an exhibitor lounge, and an attendee lounge. We will be hosting an evening event on the Monday & Tuesday, with details to come soon. Why should I attend? Because digital design is your passion. It’s time to get inspired. FITC Toronto explores the most relevant topics in the space through some of the most knowledgeable minds in the industry. You’ll gain professional insights and practical solutions to sharpen your skills. It’s time to connect with a like-minded community. What’s included with my ticket? • Access to all presentations at the event, including being part of the Q&A with each presenter • Six months of access to all of the session videos of the main room after the event • Access to all activities during the event including an evening event on Monday April 29. Is everything recorded and available after the event? We will be recording the Main Hall presentations, which you will have access to right after the event for up to 6 months. Is there a code of conduct for attendees? Yes – you’ll need to agree to our code of conduct when you buy your ticket. Preview it here. What is the COVID protocol for this event? • Masks are optional • We will have hand sanitizer available at the event entrance • We ask that you do NOT attend if you are feeling ill or have been exposed to someone with COVID How can I contact you to ask additional questions? Please feel free to reach out to us any time at info@fitc.ca and we’ll get back to you ASAP.'
