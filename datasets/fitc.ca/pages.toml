["https://fitc.ca/terms-and-conditions"]
title = "Terms and Conditions - FITC"
description = "Last updated on June 11, 2021 Commitment FlashinTO Inc. (operating as FITC Events) respects and values its relationship with all our delegates, speakers, employees, customers, sponsors and other stakeholders. FITC is committed to protecting and keeping secure the personal information you provide into our custody and control. Our mailing address is 8-17 Worthington Avenue Suite […]"
full_description = "Terms and Conditions Last updated on June 11, 2021 Commitment FlashinTO Inc. (operating as FITC Events) respects and values its relationship with all our delegates, speakers, employees, customers, sponsors and other stakeholders. FITC is committed to protecting and keeping secure the personal information you provide into our custody and control. Our mailing address is 8-17 Worthington Avenue Suite #427 Brampton, Ontario, ON L7A2Y7. Our email address is: info@fitc.ca The personal information you choose to provide will be protected and used only for the purpose identified at the time of collection. Anti-harassment Policy FITC is dedicated to providing a harassment-free conference experience for everyone, regardless of gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, or religion. We do not tolerate harassment of conference participants in any form. Sexual language and imagery is not appropriate for any conference venue, including talks. Conference participants violating these rules may be sanctioned or expelled from the conference [without a refund] at the discretion of the conference organizers. Harassment includes offensive verbal comments [related to gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, religion, sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact, and unwelcome sexual attention. Participants asked to stop any harassing behaviour are expected to comply immediately. Exhibitors, sponsor or vendor booths, or similar activities are also subject to the anti-harassment policy. In particular, exhibitors should not use sexualized images, activities, or other material. Booth staff (including volunteers) should not use sexualized clothing/uniforms/costumes, or otherwise create a sexualized environment. If a participant engages in harassing behaviour, the conference organizers may take any action they deem appropriate, including warning the offender or expulsion from the conference [with no refund]. If you are being harassed, notice that someone else is being harassed, or have any other concerns, please contact a member of conference staff immediately. Conference staff will be happy to help participants contact hotel/venue security or local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the conference. We value your attendance. We expect participants to follow these rules at all conference venues and conference-related social events."
