full_description = '''{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Amsterdam 2018", "startDate" : "2018-02-19T00:00", "endDate" : "2018-02-20T00:00", "url" : "https://fitc.ca/event/am18/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Amsterdam", "name" : "Amsterdam" }, "organizer" : { "name" : "FITC" }, "description" : "Design. Technology. Cool Shit.", "image" : "https://media-library.fitc.ca/wp-content/uploads/2017/06/16174450/FITCAM18_2800x970px_RGB-1280x443.png" } Artwork by Gavin Strange FITC Amsterdam 2018 Design. Technology. Cool Shit. Now in its 11th year, FITC Amsterdam returns to host the groundbreaking design and tech event on the future of innovation, design and all the cool shit in between. February 19-20, 2018 2018-02-19 00:00:00 2018-02-21 00:00:00 America/Toronto FITC Amsterdam 2018 Now in its 11th year, FITC Amsterdam returns to host the groundbreaking design and tech event on the future of innovation, design and all the cool shit in between. Amsterdam FITC Amsterdam var EVENTID = "23848"; SOLD OUT Event Overview Now in its 11th year, FITC returned to Amsterdam to host their groundbreaking SOLD OUT design and tech event on the future of innovation, design and all the cool shit in between. Designed, Directed & Animated by Gavin Strange aka JamFactory Highlight Video for 2018 Who Spoke in 2018? Here’s just a taste… Why Should You Attend? This isn’t your ordinary conference. FITC Amsterdam features the world’s most innovative, technical and creative talks that will inspire you to pursue your dreams and create your very best work. You’ll have the opportunity to meet and mingle with like-minded individuals who have the potential to become key collaborators throughout your career. Connect with people who share your creative passion, whether in the exhibitor hall or at one of the legendary after parties. Who knows, you could meet your next business partner, employee, mentor or boss at FITC. Who Should Attend CREATIVES – From artists and illustrators, to filmmakers and animators, plus designers from UI to VFX, FITC Amsterdam will leave you full of ideas to bring back to your personal and professional work. TECHNOLOGISTS – Learn how to bring your most creative self into your projects from some of the most exciting minds pushing technology forward. From techniques to toolkits to emerging platforms and wearables, you’ll walk away inspired by innovative solutions. EXECUTIVES / MARKETERS – Explore the future of innovation, technology, and creativity through presentations from cutting edge artists, studios, creatives, and technologists from around the world. Subscribe Jump on our monthly newsletter to get all the latest updates, news and discounts to this event and all our events. Subscribe Now Media Media Kit Get in touch and we'll send you our info package for more information about this event. Get in touch Media Registration Interested in covering an FITC event? Fill in our quick registration form and we'll get back to you shortly. Register Now Banners and Promo Copy Visit our banners page for current web banners and promotional copy for all of our current events. Banners / Info Logo Feel free to download our logo for your usage. For web, please link it to fitc.ca Download Past Events FITC Amsterdam 2017 Amsterdam February 20-21, 2017 FITC Amsterdam 2016 Amsterdam February 22-23, 2016 FITC Amsterdam 2015 Amsterdam February 23-24, 2015 FITC Amsterdam 2014 Amsterdam February 24-25, 2014 FITC Amsterdam 2013 Amsterdam February 17-19, 2013 FITC Amsterdam 2012 Amsterdam February 27-28, 2012 FITC Amsterdam 2011 Amsterdam March 8-9, 2011 FITC Amsterdam 2010 Amsterdam February 22-23, 2010 FITC Amsterdam 2009 Amsterdam February 22-24, 2009 FITC Amsterdam 2008 Amsterdam February 25-26, 2008 Speakers Kyle CooperFounder, Prologue Los Angeles twitter wikipedia Joshua DavisArtist, Joshua Davis Studios New York twitter wikipedia beepleDesigner/Director, beeple-crap.com Wisconsin twitter vimeo David CarsonDesigner, David Carson Design Los Angeles wikipedia instagram Carl AddyDesign Creative Director, Mill+ twitter Abby BeckSenior UX Designer , Google AMP Mountain View twitter linkedin Krys BlackwoodPrincipal UX Designer, NASA JPL Pasadena twitter linkedin Zander BrimijoinCreative Director and Co Founder, Red Paper Heart New York twitter Alex CornellProduct Designer San Francisco twitter instagram Tom CrateMotion Designer/Director, tomcrate.me Copenhagen instagram linkedin Kate DawkinsFounder and Creative Director, Kate Dawkins Studio London twitter instagram Jan De CosterRobot Designer, Slightly Overdone Mechelen twitter instagram All Speakers Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here.'''
