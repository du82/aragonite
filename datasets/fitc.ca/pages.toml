["https://fitc.ca/speaker/mark-jones"]
title = "Mark Jones - FITC"
full_description = "Mark Jones Dean, Sheridan College Toronto, Canada Mark J. Jones is an educator, writer, film producer, and frequent strategist to arts organizations across Canada. He is the Dean of the Faculty of Animation, Art, and Design at Sheridan College, Canada’s largest art school with internationally recognized programs in animation, filmmaking, design, performance, and material arts. Prior to this, he was Chair of the School of Creative Arts and Animation at Seneca Polytechnique and Director of the Seneca Film Institute. An advocate of arts and culture for over 30 years, he began his career as publisher of CyberStage Magazine which examined the intersection of art and technology. Jones is a founding board member of The Toronto Animation Arts Festival International (TAAFI), and co-producer of several award-winning short animated films including Subconscious Password (dir: Chris Landreth, 2013), DAM! The Story of Kit the Beaver (dir: Kjell Boersma, 2014), and Nothing to Say (dir: Aubry Mintz, 2019). Mark holds an M.A. in Communication and Culture from Toronto Metropolitan University. He is author of the book The Starving Artist Myth: Bust the Stereotype and Find Success in Creative Careers from Dundurn Press. He lives in Toronto with his creative teenager and an equally creative cat. instagram facebook instagram StarvingArtistMyth.com FITC Toronto 2025 // In-person April 28-29, 2025 Toronto How To Shape A Viable Career In Challenging Times"
