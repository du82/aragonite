full_description = '''{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Amsterdam 2010", "startDate" : "2010-02-22T00:00", "endDate" : "2010-02-23T00:00", "url" : "https://fitc.ca/event/am10/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Amsterdam", "name" : "Amsterdam" }, "organizer" : { "name" : "FITC" }, "description" : "Design. Technology. Cool Shit. ", "image" : "https://media-library.fitc.ca/wp-content/uploads/2012/06/16214046/AM10-1280x443.png" } Artwork by Geoffrey Lillemon FITC Amsterdam 2010 Design. Technology. Cool Shit. The combination of unbelievable international presenters, incredible networking opportunities and the infamous FITC parties, all with the amazing backdrop of the city of Amsterdam, creates a stage set for the unexpected. February 22-23, 2010 2010-02-22 00:00:00 2010-02-24 00:00:00 America/Toronto FITC Amsterdam 2010 The combination of unbelievable international presenters, incredible networking opportunities and the infamous FITC parties, all with the amazing backdrop of the city of Amsterdam, creates a stage set for the unexpected. Amsterdam FITC Amsterdam Lead Partner Lead Partner var EVENTID = "2400"; SOLD OUT! Event Overview If you were lucky enough to attend FITC Amsterdam ’08 or ’09, then you know what it’s all about. If you missed it, grab a ticket now before they’re all gone. We’ve sold out the last two years and expect the same for 2010. There is no other event quite like it! We’ve brought back some of your favorite speakers, as well as a number of new ones, and we’ve also added a few surprises to keep everyone on their toes. With some of the most interesting and engaging presenters from around the globe, FITC Amsterdam 2010 will be 2 days and 2 nights that will leave you inspired, energized and awed (and probably pretty tired). Join us for an event that you will never forget! Two full days and nights of events, plus one day of optional pre-festival workshops Over 50 presentations and panels covering the Creative, Technical, and Business aspects of Flash and digital media Over 500 attendees from around the globe Over 50 internationally renowned design and technology presenters Includes three FITC evening events Subscribe Jump on our monthly newsletter to get all the latest updates, news and discounts to this event and all our events. Subscribe Now Media Media Kit Get in touch and we'll send you our info package for more information about this event. Get in touch Media Registration Interested in covering an FITC event? Fill in our quick registration form and we'll get back to you shortly. Register Now Banners and Promo Copy Visit our banners page for current web banners and promotional copy for all of our current events. Banners / Info Logo Feel free to download our logo for your usage. For web, please link it to fitc.ca Download Past Events FITC Amsterdam 2009 Amsterdam February 22-24, 2009 FITC Amsterdam 2008 Amsterdam February 25-26, 2008 GMUNKDesign Director, gmunk.com San Francisco twitter vimeo MK12mk12.com Kansas City twitter Samuel Agesilas Chicago twitter linkedin Mark Anders twitter Chris Bird Ratingen linkedin twitter R Blank Las Vegas twitter linkedin Lee Brimelow twitter Didier Brun twitter linkedin All Speakers Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here.'''
