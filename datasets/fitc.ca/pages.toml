["https://fitc.ca/speaker/neil-mendoza"]
title = "Neil Mendoza - FITC"
full_description = "Neil Mendoza Artist, Neil Mendoza Studio Albuquerque, USA Neil Mendoza is a UK born, US based artist who blends sculpture, software and engineering to animate objects and spaces. He employs absurdity and humor as tools to investigate how we mediate our interactions with each other and the natural world. His art often repurposes found objects, offering viewers a fresh perspective that challenges their preconceptions. He holds an MA in Maths and Computer Science from Oxford University and an MFA in Design Media Art from UCLA. He has showcased his work at venues including The Ars Electronica Center, The Barbican, The Children’s Museum of Pittsburgh, The Da Vinci Museum of Science and T echnology, The Exploratorium, T elfair Museum, The V&A Museum, among others. He has taken part in residencies including with Autodesk, Adobe, Recology and Macdowell among others. He regularly presents at international conferences and has taught art and technology at UCLA and Stanford. bluesky twitter instagram vimeo facebook github linkedin mastodon wikipedia"
