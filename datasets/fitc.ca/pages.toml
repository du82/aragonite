title = "Robert Hodgin - FITC"
full_description = "Robert Hodgin Head of R&D, Partner, Rare Volume Brooklyn, USA Robert Hodgin is a Brooklyn-based artist and co-founder of Rare Volume, a design and technology studio specializing in interactive and data-driven experiences. With a background in sculpture from the Rhode Island School of Design, his work spans generative art, 2D data visualization, and immersive 3D simulations, often inspired by physics, astronomy, and emergent systems. His work has been exhibited internationally, and he has spoken at numerous design and technology conferences, sharing insights into his creative process and technical explorations. Robert has been (stubbornly) attempting to learn Icelandic for years, despite its near-total lack of utility in his daily life. bluesky instagram linkedin roberthodgin.com FITC San Francisco 2010 August 17-19, 2010 San Francisco Practice Makes Perfect, So What Are You Practicing?"
