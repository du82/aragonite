["https://fitc.ca/privacy"]
title = "Privacy Policy - FITC"
description = "Last updated on January 8, 2018 Personal Information Defined Personal information is information that can be used to identify or contact a specific individual (i.e. name, home address and telephone number) and may also include survey responses expressing an individual’s opinion. Publicly available information (example: information in telephone directory) or business contact information is not […]"
full_description = "Privacy Policy Last updated on January 8, 2018 Personal Information Defined Personal information is information that can be used to identify or contact a specific individual (i.e. name, home address and telephone number) and may also include survey responses expressing an individual’s opinion. Publicly available information (example: information in telephone directory) or business contact information is not considered personal information. The provision by an individual of home information as business contact information will be considered business contact information and hence will not be subject to policies put in place to protect personal information. Privacy Protection Practices All personal information gathered by FITC is kept in confidence for the identified purpose for which it was collected. Festival employees or subcontractors only have authorized access to personal information based on the business needs for which it was collected. Physical, administrative and technical measures are in place to ensure that the information is not disclosed or shared for reasons other than achieving the purpose for which it was collected. All FITC employees use password protocols and firewalls are in place to protect personal information received or stored electronically. Protocols and software are maintained to maximize protection of personal information. Contact Information Questions, concerns or complaints relating to the Festival’s privacy policy on the treatment of personal information should be e-mailed to: info@fitc.ca At any time, should you wish to withdraw your consent authorizing FITC to use your personal information for the purpose(s) it identified, please advise info@fitc.ca DISCLOSURE OF PERSONAL INFORMATION We will not sell or rent your Personal Information to anyone. We will only disclose your Personal Information to third parties: Where you have specifically given us your consent to disclose your Personal Information for a designated purpose; Who are acting on our behalf as our agents, suppliers or service providers, solely to enable us to more efficiently provide you with the FITC Services. Such entities act under strict contractual controls, requiring them to maintain the confidentiality of all such Personal Information and to use such information solely for purposes related to the provision of the FITC Services; As may be set out in the Terms and Conditions applicable to a FITC Service, to facilitate the provision of such FITC Service, such as fulfilling legal requirements; As required by law, including by an order of any court, institution or body with jurisdiction or authority to compel the production of information, or in order to protect or defend a legal interest; or In connection with a FITC corporate re-organization, merger or amalgamation with another entity, or a sale of all or a substantial portion of the assets of FITC provided that the Personal Information disclosed continues to be used for the purposes permitted by this Privacy Policy by the entity acquiring the information. LINKS TO OTHER SITES AND ADVERTISEMENTS A FITC Service may contain links to other websites and services. While we try to link only to sites and services that share our high standards and respect for privacy, please understand that we are not responsible for the content of, or the privacy practices employed by, other companies or websites. This Privacy Policy applies only to the FITC Services referencing this Privacy Policy. SECURITY The security of your Personal Information is important to us. FITC takes technical, contractual, administrative, and physical security steps to protect Personal Information that you provide to us. We instruct our employees with access to your Personal Information that it is to be used only in adherence with the principles set forth in this Privacy Policy and the laws applicable to each specific business. In certain areas, such as when you provide credit card information to us, we work to help protect the security of your credit card information during transmission by using industry standard Secure Sockets Layer (SSL) encryption technology. Digital Data The following data may be collected by visiting our website • IP addresses • cookie identifiers • website activity Cookies When visitors come to our site, third parties (such as AdRoll) may place cookies on their browsers for targeted advertising purposes. If you would like to opt-out of cookie data collection, please visit here for further information"
