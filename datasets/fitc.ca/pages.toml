["https://fitc.ca/diversityprogram"]
title = "The FITC Diversity Scholarship Program - FITC"
description = "At FITC, we believe that including a diverse range of voices at our events makes them better, stronger, and more fun. Learn more about the Scholarship"
full_description = "The FITC Diversity Scholarship Program Diversity & Inclusivity We believe that including a diverse range of voices at our events makes them better, stronger, more inclusive, and more fun. Our current definition of diversity includes people of any gender, including identity and expression; sexual orientation; disabilities, mental or physical; physical appearance, including but not limited to body size; ethnicity/culture; personal expression; and beliefs – religious, political or otherwise. Having these voices on our stages, on our volunteer teams, and in our audiences give us all opportunities to grow through hearing a variety of experiences, stories, and viewpoints. What is the FITC Diversity Scholarship Program? This scholarship program is aimed at underrepresented groups to attend the upcoming FITC Toronto 2024 conference, an in-person & online event happening on April 29-30, 2024. The program consists of complimentary tickets to the event. All applicants must agree to follow our code of conduct. This program is aimed at those who are unable to secure a ticket through their company, or unable to afford a ticket themselves. We ask that if you or your company is able to purchase a ticket, please do so to avoid taking a spot from someone who can’t. APPLY NOW Privacy All personal information collected from applicants will only be reviewed by the staff of FITC, and will never be shared with anyone or made public. We are bound by and in compliance with the Canadian Privacy Act, and treat all personal information with the utmost respect and confidentiality. Submissions will be reviewed by a panel of judges with names and personal information removed. Top submissions may be showcased online, or during the event, with personal information removed unless otherwise granted by the individual. By applying for the scholarship you consent to the above, and to receive emails from FITC, including current and future event information and notifications. Questions? Drop us an email."
