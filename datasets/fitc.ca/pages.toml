["https://fitc.ca/event/am15"]
title = "FITC Amsterdam 2015 - FITC"
description = "Explore the undiscovered horizon, break walls between creator and spectator using any medium and means necessary."
full_description = '''{ "@context": "http://schema.org", "@type": "Event", "name": "FITC Amsterdam 2015", "startDate" : "2015-02-23T00:00", "endDate" : "2015-02-24T00:00", "url" : "https://fitc.ca/event/am15/", "location" : { "@type" : "PostalAddress", "addressLocality" : "Amsterdam", "name" : "Amsterdam" }, "organizer" : { "name" : "FITC" }, "description" : "Design. Technology. Cool Shit. ", "image" : "https://media-library.fitc.ca/wp-content/uploads/2014/08/16214756/am15-1280x444.png" } Creative by Sougwen Chung FITC Amsterdam 2015 Design. Technology. Cool Shit. Explore the undiscovered horizon, break walls between creator and spectator using any medium and means necessary. February 23-24, 2015 2015-02-23 00:00:00 2015-02-25 00:00:00 America/Toronto FITC Amsterdam 2015 Explore the undiscovered horizon, break walls between creator and spectator using any medium and means necessary. Amsterdam FITC Amsterdam Lead Partner Lead Partner var EVENTID = "15841"; Event Overview Now in its 8th year, FITC Amsterdam 2015 is host to the latest and greatest in design, technology and cool shit from all around the globe. Join fellow digital creators and world renowned speakers this February to learn about design, development, creativity and so much more. FITC is the intersection between Creative Technologists, Designers, Developers and all-around awesome thinkers from various innovative industries across the globe. They converge every year in Amsterdam to connect, challenge, inspire and to experience the cutting edge in design and technology. 40+ speakers from around the globe. Come hear their stories and be part of the conversation. FITC Amsterdam has a history of selling out, so get your tickets early to experience: 40+ speakers from around the globe Two-day conference + two evening events and optional workshop day add-on Over 50 presentations and panels Game-changing conversation on creative, technical and business topics in digital media Why should you attend? FITC Amsterdam covers the future of everything innovative, technical and creative to leave you informed, challenged and inspired to create your very best work. You’ll also have the opportuntiy to network with like-minded individuals. Connect with people who share your passion at presentations, in the exhibitor hall, or at one of the legendary parties – you could very well meet your next business partner, employee or boss. How we can help you get there Share with your boss why you should attend! We’ve created two customizable request letter packages you can download and submit to your boss or HR department – one for those going solo and one for groups. Just fill in the blanks and print. DOWNLOAD Who should attend DIGITAL CREATORS and TECHNOLOGISTS. This festival is for designers, developers, digital artists or anyone who creates things in the digital space. From technical to inspirational sessions, there’s always something for you, no matter what stage of your career you’re in. FITC Amsterdam 2015 Creative “FITC is an event for creative people with a boundless curiosity and interdisciplinary spirit. This image represents a meeting point between art, design, and technology with David, an icon of renaissance art, at the centre. Within a simple frame, cascading typography coalesces graphically with a multi-faceted circular composition, an abstraction representing the golden ratio. The frame delineates the fourth wall, the rendered view of David as real. Beyond the skewed frame the technological underpinnings of the form, represented by the wireframe object, is visible. The depiction of both rendered-real and abstracted virtual suggests the multifaceted abilities of the creative individual, constantly balancing the two contrasts. David’s gaze implicates the industry; it is directed off-frame, on unexplored horizons. “ Sougwen Chung FITC Amsterdam Presenter, and creator of FITC Amsterdam 2015 artwork. Highlight reel from the last FITC Amsterdam event Subscribe Jump on our monthly newsletter to get all the latest updates, news and discounts to this event and all our events. Subscribe Now Location Pakhuis de Zwijger Piet Heinkade 179, 1019 HC Amsterdam, Netherlands Media Media Kit Get in touch and we'll send you our info package for more information about this event. Get in touch Media Registration Interested in covering an FITC event? Fill in our quick registration form and we'll get back to you shortly. Register Now Banners and Promo Copy Visit our banners page for current web banners and promotional copy for all of our current events. Banners / Info Logo Feel free to download our logo for your usage. For web, please link it to fitc.ca Download Past Events FITC Amsterdam 2014 Amsterdam February 24-25, 2014 FITC Amsterdam 2013 Amsterdam February 17-19, 2013 FITC Amsterdam 2012 Amsterdam February 27-28, 2012 FITC Amsterdam 2011 Amsterdam March 8-9, 2011 FITC Amsterdam 2010 Amsterdam February 22-23, 2010 FITC Amsterdam 2009 Amsterdam February 22-24, 2009 FITC Amsterdam 2008 Amsterdam February 25-26, 2008 Speakers Jessica WalshPartner, Sagmeister & Walsh New York linkedin twitter BrosmindBrosmind Barcelona twitter instagram Brendan DawesDesigner and Artist, brendandawes.com Manchester linkedin twitter Naomi AtkinsonFounder, Whosit & Whatsit Newcastle twitter instagram QuayolaVisual Artist, Quayola.com London twitter Sougwen ChungArtist / Researcher / Technologist, sougwen.com New York linkedin twitter Yuko ShimizuIllustrator, yukoart.com New York linkedin twitter FROM FORMFilm & Design Studio, fromform.nl Rotterdam twitter twitter Stuart WoodFounder & Director, Random International London twitter twitter Felix Hardmood BeckArt Director (Sr.), ART+COM Studios Berlin twitter Carlos UlloaCo-founder, HelloEnjoy London twitter twitter Henrique AlvesUI Developer, healves.com linkedin twitter Wouter VerweirderCreative Coder, Devine twitter github Mario KlingemannArtist, Quasimondo Munich linkedin twitter All Speakers Why buy a ticket? Ideas and inspiration Network with well-known developers from around the world. Explore innovative techniques and emerging platforms. Bring cutting-edge tools and templates back to your team. Exciting programming Hear from the industry’s top professionals from Microsoft, BBC News, Netlify, CodePen, and others. Take part in live Q&As and Slack groups. Amazing quality FITC has been a leader in hosting online conferences since 2002 and this year we’ve perfected the experience for you. Expect top-end production values and content you can trust. A sense of community This is a time to make new friends and connect with people you never knew you missed! Relax, share, mix and mingle with like-minded folks who appreciate the value of a developer community. All talks will be recorded All the presentations will be recorded for your viewing pleasure after the event, so don’t sweat it if you have to dip out for a bit. You’ll be able to view the content 24/7 well after the conference closes. Live Captioning Available Live Caption is now available for Chrome without any extension. No plug-in needed, just turn it on and have captions automatically generated on any video you are playing. See details here.'''
