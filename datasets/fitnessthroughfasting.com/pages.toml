["https://www.fitnessthroughfasting.com/binge-eating-help.html"]
title = """
Binge Eating Help - Binge Eating Help - Prevent, Stop
& Recover."""
description = "Binge Eating Help - In this binge eating help page we focus on ways to prevent, stop and recovering from an episome of compulsive overeating. The disciplines of juice fasting &amp; water fasting can break the chains"
full_description = '''Welcome to our binge eating help, page TWO OF FIVE of the overeating series. If you have not done so, you can read Page One Here. In this page I want to talk about the cycle of compulsive overeating with emphasis on ways that we can learn to PREVENT A BINGE. This is a very important topic because, without a doubt, it is easier to stay away from a bull than it is to wrestle it to the ground and try to break free, right? So I am going to place a lot of emphasis on BINGE PREVENTION as the best type of binge eating help that one can receive. Like I said before, these pages are written from my personal bout with this terrible illness. I am NOT a doctor and I encourage you to seek help if you are in trouble. In the meantime, this binge eating help page is designed to give you some experience, strength and hope. Sharing with others is very important ... so I will do my best to be simple yet descriptive in these pages. If even just ONE person is helped by my humble writings, then I will feel that having survived this terrible illness has been more than worth it. :-) The primary focus of binge eating help should always be "preventing the episode from starting in the first place". Like we talked about in the previous page, once a binge has begun, a compulsion to keep eating, eating and eating takes over. The more I eat the more obsessed I become with eating. The anger, pain and self-hatred intensifies, which fuels the compulsion to eat still more... and so the cycle perpetuates itself. It is VERY difficult to overcome. Many times I found myself bingeing and basically saying: "Screw it, I just don't care - I'm gonna keep eating and the hell with my life and my health. There's just no use in trying; I'll just eat myself to death". Of course, as the days, weeks and sometimes months went by (and I continued to stuff myself uncontrollably), the mind, body and spirit would burn out. I would be left in pieces - wishing for death and feeling alone, worthless, hopeless and with NO self-esteem. I hated life and despised God who I feel had abandoned me to suffer. Imagine! I had deceived myself into thinking that I did not care, which only served to increase the damage. Yes, once in the grips of a binge, we are in severe danger. It is unpredictable and highly-destructive.'''
