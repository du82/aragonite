["https://www.fitnessthroughfasting.com/fasting-made-easy.html"]
title = "Fasting Made Easy. Fasting Made Easy is Fasting Now to Prevent Sickness Later"
description = "Fasting made easy. Fasting made easy is knowing it will be tough now,  yet simpler than sickness and an early grave later. Some discomfort now to transform your life. This is the easier, softer way."
full_description = '''I usually tell them to read the Fasting Made Easy book by Dr. Don Colbert - featured in The Anti-Prevention Nation© EXODUS Fasting Lose Weight Shop. All of Dr. Colbert's fasting and detox books are great. But when people ask me for easy fasting tips, I also make sure to also emphasize that there are NO magic pills, books or mysterious advice that will allow them to fast without discomfort or hunger pains. We do recommend various products to assist with hunger suppression in the Fasting Motivation portion of this website. You may also wish to read how Here, however, I wish to focus our discussion on what we consider the best fasting made easy approach: Fasting now for detoxification and loss of dangerous pounds with SOME pain, or the ULTIMATE pain of chronic, obesity-related ilness later. I don't say this to be insensitive or harsh, but rather because I myself became seriously ill from obesity and a liver condition worsened by intestinal toxicity. Whatever "pain" you go through from fasting NOW is NOTHING compared to the health benefits it provides. I am not against anything that can help you go through the fast as comfortable as possible. Tea, and herbal supplements such as Hoodia Gordonii and Oolong Green Tea can be a good addition to your fasting liquid diet. That is, so long as you don't expect them to be magical or flawless. So, I can tell you from first hand experience that the best approach to fasting for weight loss and fitness is realizing - in your gut - that it will not be easy. Accepting it and embracing it. With such a mentality, it actually becomes easier in the end. It has worked for me countless times. I know that days three through eleven are usually the most difficult. That is fasting made easy, in my mind. It is certainly easier to take action now - albeit some discomfort - than waiting ten more years and ending up with a chronic or more serious condition. The more you enter into the discipline of fasting thinking that "I should not have to go through hunger pains or discomfort," the more disappointed you will be. The higher will be the likelihood that you will abandon your efforts prematurely.'''
