["https://www.fitnessthroughfasting.com/fasting-diet.html"]
title = """
Fasting Diet: The Fasting Diet & The Time Factor
Lemonade Diet Works"""
description = """
Fasting Diet: The Fasting Diet & The Time Factor: Many people fasting for weight
  loss and detox cleansing become impatient and end up breaking the regimen prematurely and not attaining their goals."""
full_description = "One of the biggest deal breakers for people who are in a fasting diet is impatience and the constant battle with time, pounds and the scale. They have been eating poorly for a long time (sometimes years or even a lifetime), yet they enter the fasting diet expecting their entire problem to be solved overnight. Look at the cartoon above. Do you think that this fella is making a reasonable request? NOT! He MUST get a grip and realize that it will take time. And so must you dear friend. The fasting diet detox symptoms and hunger are usually the least of the problems. It is the downright impatience and insistence that the body respond how I want it to, and in the time frame that I demand. THAT, without a doubt, is what causes most people to fail at fasting - or any other weight loss, health-improvement regimen. Like they say... you have to take a 'chill pill' and let the weight loss process take as much time as it needs to. And you MUST stay off the scale. I call it the scale from hell because that little machine makes more fasters and dieters fall than anything else that I have ever seen. So if you are obsessed with losing weight and are getting on the scale constantly to see how many 'ounces' you have lost in the past two hours, you really need to cut it out. You are putting yourself in a position to take a right hook and find yourself breaking the fasting diet prematurely. Then you will have to face the horsemen of guilt, shame, remorse and anger. Why is the scale so dangerous? Because the fasting diet battle is NOT in the body... it is in the mind. How you handle your thoughts and/or emotions while fasting and/or dieting is what will determine whether you make it or eat the pavement. If you have seen that happen, let me know. But I have never seen that happen. Ten times out of ten, it is ME who releases my mental vision of what I want to accomplish and I, MYSELF, go to the burger joint, order the junk and put it in my own mouth... myself and without being restrained."
