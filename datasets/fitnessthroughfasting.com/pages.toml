title = "Fasting Health Benefits of Weight Loss, Body Detox Cleansing & Healing"
description = "Fasting Health Benefits include rapid weight loss and the deep cleansing of  toxins from the digestive system which cause lethargy, poor concentration and depression."
full_description = "So gauge your process by weighing yourself FIRST THING in the morning before you drink anything. If you need to use the toilet in the morning, do so BEFORE you weigh yourself to make the scale friendlier. : ) If you practice a religion or spiritual discipline, you will be wide open to receive fresh insight and discernment when either juice fasting or water fasting. You will likely get answers to problems that used to baffle you. For more on this, go to Spiritual Fasting series of articles. Another of the many fasting health benefits is that you will have substantially more energy, need less sleep and find it much easier to concentrate than before. The reason for this is that deep cleansing of toxins adhered to the colon renew your digestive system and cleanse the blood. Now please remember, these benefits will be very noticeable AFTER you finish the fasting process. The detoxification process, on the other hand, can have the opposite effect while your body cleanses itself. So it DOES often get worse before it gets better. Do not be surprised if this happens! You will find an ongoing discussion this detox topic on the Fasting and Cleansing section of this website. Toxins in the bloodstream can cause depression and many other psychological problems. When the body is polluted the mind is compromised. Go to Fasting and the Mind for a page that talks about the negativity which surfaces while one is fasting. Indeed, the more information you have while you are fasting, the better it will be and the more fasting health benefits you will receive. That way your body and mind cannot blindside and derail your efforts. When I first adopted fasting as a lifestyle, I suffered from a variety of emotional problems including depression, anxiety and isolation. It was hard for me to function from day-to-day. I would be alright for a few weeks or months, then another episode of depression would hit me and I would spend months isolating, gorging and getting fatter and fatter. Help with depression was one of the key fasting health benefits I received."
