full_description = "This last November I did the Master Cleanse. I had planned to do 21 days. I ended up only doing 15 days. It was a great change!! I was so used to needed 10-12 hours of sleep a day, and still needing coffee to get me going. After doing the cleanse I only needed 6-8 hours, and I felt great and energized in the morning without coffee. I finally started waking up without nasal congestion, and my eyes were no longer always red, I had never seen them so white! My cyst I had on my hand for 2 years went away, and my skin never looked so glowing and clear! I lost 15 pounds. I am starting the cleanse again this Sunday, but this time I am going for 40!!"
