["https://www.fitnessthroughfasting.com/lent-fasting.html"]
title = "Lent Fasting - Lent Fasting for Penance and Transformation"
description = "Lent Fasting - Lent Fasting is observed for Penance and can also be a powerful discipline of transformation and breakthrough for the Church. Observance of 40 day fast by Jesus Christ for sins."
full_description = 'If you are a Christian and/or practitioner of the Catholic faith, then lent fasting is an excellent way for you to show your devotion next Lenten season. From what history books indicate, lent was done -- to a great extent -- in preparation for baptism and the forgiveness of sins. One of the questions we are always asked is whether one needs to fast partially or for the entire 40 days of the Lenten season. A time of looking at ourselves honestly and without reserve with the aim of enhancing our spiritual condition through a closer relationship with God. And abstinence from food through juice or water fasting is certainly one way to do it. Many dear friends who are believers start out with a partial juice or water fast, then resume normal eating habits with the exception of certain customary foods as a form of penance. Lent fasting is a way of denying the flesh and its appetites in favor of submission and humility before God. But it ought not become a practice of self-flagellation or punishment. Neither should it be done grudgingly just to observe a religious requirement. The true power of fasting comes when human eyes are placed on God with childlike expectation of what he is, and continues to do in our lives. Yes, we believe the most important part of lent fasting is the attitude of our hearts. A sincere desire and willingness to let go of old destructive habits and behaviors, thus allowing the Grace of God to cleanse and purify us. Lent fasting does not necessarily have to be a fast from food on all 40 days, although Church proclamations strongly suggest it. For example, Catholics who are ill are not bound to observe the laws on lent fasting. To be sure, there are many ways in which we can humble ourselves during this season in regret for our sins. As indicated in Isaiah 58, “true fasting” is fasting where our purpose is to glorify God both externally and in our hearts. "Is not this the kind of fasting I have chosen: to loose the chains of injustice and untie the cords of the yoke, to set the oppressed free and break every yoke?'
