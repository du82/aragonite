["https://www.fitnessthroughfasting.com/catholic-fasting.html"]
title = "Catholic Fasting - Christian and Catholic Fasting - Transformation - not Dogma"
description = """
Catholic Fasting - Christian and Catholic Fasting should go beyond 
  tradition & dogma - Focus on  deep, heartfelt humility before God in prayer and worship. Change, breakthrough & revelation."""
full_description = '''The whole point of this discussion is to go beyond any type of dogma or religious ritual and talk about fasting as a means to penetrating the spiritual world for revelation, deliverance, freedom and a true encounter with the Almighty creator of the heavens and the earth. We are not here to put down any type of religious observance, however. Tradition and external religious practices are very positive and give us a sense of spiritual discipline and behavior. The problem is when the external practice becomes the whole end of spirituality in itself, at which point it can be empty and even judgmental and destructive. I love the passage in Matthew 6:16-18 where Jesus clearly speaks about the PROPER and IMPROPER conditions of the heart while fasting. Our Lord says: "When you fast, do not look gloomy like the hypocrites. They neglect their appearance, so that they may appear to others to be fasting. Amen, I say to you, they have received their reward. 17) But when you fast, anoint your head and wash your face, 18) so that you may not appear to be fasting, except to your Father who is hidden. And your Father who sees what is hidden will repay you. Catholic fasting is NOT a time to 'show off' or to be letting others know of what we are doing 'to impress' or to somewhow let people know how 'holy' or religious we are. As Jesus said, if this is the attitude, then the reaction of other people, in and of itself, will be the ONLY reward that such fasting will produce. The correct way to fast, Our Lord emphasized, was to take care of our appearance and behavior in such a way as to NOT make what we are doing evident to others. It is the condition of our hearts which God is after, and the TRUE spiritual rewards come when we practice christian and catholic fasting with humility and reverence before the Living God. What others think, say or do not say is, in truth, irrelevant. Religion for the sake of religion WITHOUT INTERNAL SUBMISSION AND SPIRITUAL AWARENESS may look good 'on the outside' (even Michael Corleone went to mass, remember?), but it produces ZERO results in the human heart, which is - by far - the place where God's presence, healing and guidance is MOST needed.'''
