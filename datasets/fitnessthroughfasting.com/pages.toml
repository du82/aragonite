full_description = '''If you have arrived at this page looking for answers and ARE willing to take action, then I'm going to give you some NO BS info that can help you start shedding pounds right away... TODAY! How? Start practicing fasting right away. See if you can do three-to-seven days as soon as possible. You will lose a lot of weight very quickly. If you are overweight (as I was), losing 20 pounds quickly can reduce your risk factor for a variety of ilnesses such as Type II Diabetes and heart disease, among many others. It will also relieve the stress on the joints caused by excess weight. When you see the results, you will feel much better about yourself; you'll be encouraged to do more to improve your life and health.AND THAT CAN HAPPEN IN JUST SEVEN DAYS OF WATER FASTING! When you are fasting to lose weight, the digestive system goes into hibernation, similar to a bear in winter. The body shifts its focus from constantly digesting and filtering food to burning accumulated fat. It eats away at the fat reserves and slims you down quickly. The body becomes a large furnace, focusing strictly on burning fat reserves and cleansing toxins in the colon and blood stream. Stock up on seltzer water and green tea for energy and to soothe hunger pains. You will likely also have bad breath for a few days and feel a metallic taste in your mouth. You may notice a white, pasty substance in your tongue. These symptoms are normal and will nearly always pass by day seven. Regardless, my message is this: Don't you think that going through a little hunger and discomfort is a small price to pay to get healthy? Yes, IT IS a small price to pay!! It is a much lesser price than living our whole lives in obesity and then getting sick. Or feeling the disattisfaction not never having reached your weight loss goals. Right away some argue with me and say:"Yeah, but most of that weight one loses in seven days of fasting is just water weight!" Yes, it IS mostly water weight... but don't you think it's definitely one heck of a good start? Is it not better than doing nothing?'''
