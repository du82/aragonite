["https://www.fitnessthroughfasting.com/fasting-colon-cleansing.html"]
title = "Fasting Colon Cleansing - Fasting Colon Cleansing & The Colema Board"
description = """
Fasting Colon Cleansing: At Home fasting colon cleansing 
  techniques and kits and how, combined with fasting, these can enhance detoxification  
  and foster dramatic  weight loss and improved health."""
full_description = 'One of the primary fasting colon cleansing methods used by most at-home enthusiasts is the Colema board. However, if you do not have or cannot afford to purchase a Colema board, you can easily follow the directions here with any enema kit that you have at hand. The Colema is awesome and I always recommend it if you are serious about long-term colon health. But anything that you have now is sufficient to get you started! A Colema board, pictured above, is basically a padded board that can be linked to an open toilet with a chair. This gear turns your bathroom into a full-blown home colonic clinic - with all the benefits thereof, minus the perpetual expense. If you are serious about fasting colon cleansing, then I highly highly recommend the Colema board system we are discussing in this page. Why? Because for an investment of several hundred dollars NOW, you can basically create a colon cleanse spa in your home and save tons of cash LATER. I can tell you from personal experience that going to a colonic cleansing therapist regularly can rack up to hundreds upon hundreds very quickly. In addition, I have found it indispensable to get to know my body and assume absolute personal responsibility for its wellbeing. Fasting colon cleansing with the use of a colema board has been one of the keys that helps me achieve that responsibility. The Colema board is different from a colonic in that the latter uses a tube (one-inch in diameter) that, in turn, is subdivided on the inside into a smaller 1/8th inch tube. Together the two tubes foster an "inflow/outflow" effect that is controlled by the colonic cleansing therapist. The therapist inserts the tube about two inches into the rectum so water current can start breaking up the hardened feces and toxins that are adhered to the colon. When the colon becomes full it induces a bowel movement as water continues to flow in and out. This goes on non stop for about an hour - depending on the type of colonic session that you purchase. I have gone to colonic clinics many times and the experience has always been pretty amazing.'
