["https://fitnessthroughfasting.com/breaking-a-fast.html"]
title = """
Breaking a Fast. Instructions for Breaking a Fast
Appropriately"""
description = "Breaking a Fast. Breaking a Fast appropriately is perhaps more important than the fast itself - proper eating after fasting sustains quick weight loss &amp; colonic / body detox health benefits."
full_description = '''If a bear is asleep and you whack him on the head, do you think he will react positively? Probably he will come after you and be very angry. The SAME is the case with the digestive system. When breaking a fast (especially one lasting longer than 72 hours), you have to remember that your body's digestive functions have slowed down dramatically. Your entire digestive system has, in essence, gone into a period of hibernation. The body has shifted its from feeding on the food you eat daily, to feeding on the fat storages. If you needed firewood for a fireplace, would you go out and get more lumber if you already had stacks of wood inside the cabin ready for the blaze? Probably not. So, when fasting, you are no longer cutting fresh food (eating), but the body is still "feeding" on the stored wood (fat). Making the transition from contant digestion to feeding from stored fat takes anywhere from three-to-nine days and, in my mind, is a very sacred process. If you had a loved-one who had spent months toiling to remodel a filthy, delapidated warehouse into a beautiful, clean office - would you show up with garbage and dump it in the lobby? I'm sure you would not. So why do it to your own body? What the body is doing on your behalf, I submit, must be respected.Breaking a fast has to be done properly and with much caution. If you allow hunger and desperation to grip you, you will no doubt diminish the effectiveness of the fast and possibly harm your body. Here's a wall-of-shame moment from my own experience to help illustrate this point. Breaking a fast should definitely be planned in advance. Waiting until the last moment to determine what one is going to eat and drink is a recipe for disaster. Take it from me. I have done amazingly-foolish things in years past. One time I broke a thirty-day water fast at a friend's birthday celebration with burritos, pizza, hot dogs and soda. What a great guy, huh? NOT! The "celebration" was short-lived. I was bed-ridden for almost a week afterwards and my stomach blew up like a balloon. I had severely irritated the digestive system which was NOT prepared for all of the trash I had abruptly dumped into it.'''
