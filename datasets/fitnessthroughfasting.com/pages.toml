["https://fitnessthroughfasting.com/fasting-is-a-great-blessing.html"]
title = "Fasting is a Great Blessing"
description = "I am on my ninth day of fasting. I started the first two days with water. On the third and fourth days,  I juiced some watermelon.   The watermelon juice"
full_description = "I am on my ninth day of fasting. I started the first two days with water. On the third and fourth days, I juiced some watermelon. The watermelon juice was a great blessing to my body. On the fifth day, I juiced carrots, apples and celery. On day six, I juiced watermelon juice. On the seventh day, I had fresh lemon and water. On day number eight, I juiced some lemons to add to my water. Today is my ninth day, I juiced some carrots, beets, apples and celery. I also juiced some ginger and lemon to add to my water. I used organic fruit and vegetables.I am feeling good. When I first started, I was feeling terrible. I have had sinus trouble all summer and my knee was bothering me. I am walking better. I feel great. Dannette Fishburne Scott"
