["https://fitnessthroughfasting.com/quickweightloss.html"]
title = "Quick Weight Loss - Fasting is The Ultimate Fat Burner"
description = """
Quick Weight Loss Fasting can burn the fat off of
  your skin at the speed of light. If you are willing to pay the price, then get 
  ready to lose weight fast and improve your life and health."""
full_description = '''If you are more than 50 pounds overweight, then I strongly encourage you to consider fasting as a means of ridding your body of dangerous pounds fast. I would implore you to set aside everything else going on in your life and take immediate stock of whether fasting is for you or not. And it doesn't have to be a very long fast either. In just 14 days of water fasting, it is possible to experience quick weight loss of 20 to as much as 30 - even 40 pounds. But even if you are only 10-to-20 pounds overweight, fasting can help you to lose weight fast and furious. Fasting for as little as SEVEN days can take as many as TWENTY pounds off your body, thus reducing the risk of chronic disease. Then you can work at staying free of junk and adopting permanent eating-habit changes. The equation I am presenting is simple and to-the-point: Get rid of excess weight quickly through fasting, THEN make a commitment that you will larn to eat in healthy rather than destructive ways. In my opinion, there is nothing more powerful than fasting to lose weight fast and improve physical, mental and spiritual health. All you have to do is MAKE UP YOUR MIND and take action. If you have tried many diets and failed, it is likely that your body needs some time WITHOUT food so it can heal. It's like the cigarette smoker. As long as this person keeps smoking, he or she will never be free of the addiction, right? Well, sometimes it is like that with food. If you have eaten poorly for a long time, your body is in many ways "addicted" and needs to withdraw and cleanse. Water and juice fasting are powerful ways to achieve body detox cleansing and quick weight loss. And, as a bonus, you get to lose massive amounts of weight in a short period of time. What other motivation could you possibly need? Look, it's about giving your digestive system time to rest. When you work a long week ... are you tired? Do you want to work the weekend also? Or do you want to rest? Well, imagine how your body feels! Day in, day out ... over and over and over having to digest all of the trash that we eat. And it has to do it 24/7 - WITHOUT REST OR CONSIDERATION. If an employer treated us that way, we'd probably go on strike! :-)'''
