["https://fitnessthroughfasting.com/fruit-fasting.html"]
title = """
Fruit Fasting - Fruit Fasting for Weight Loss and
Detoxification"""
description = """
Fruit fasting - Fruit fasting to lose weight, detoxify the colon and prepare for a 
  total liquid fasting diet via juice fasting or water fasting."""
full_description = '''In this page we are going to talk about fruit fasting as a compliment or in preparation to juice fasting or water fasting, as well as the raw food and vegan lifestyle as one you may wish to explore or even adopt. This practice can help you to lose weight quickly and start to detox your digestive system. If you are new to fasting, trying a three-to-seven day stretch with just fruits and water is a good way to get some " practice". I started fruit fasting at what I can easily say was one of the lowest points in my life. I was roughly 110 pounds overweight and ballooning fast. I was tired, lethargic, depressed and constantly bingeing on donuts, pastries, pizza and sodas. My liver was compromised, and the doctor told me I would not live long if I continued on the road I was in. The first time I tried a 'raw food diet' with fruit fasting, I did so in a feeble and desperate attempt to lose weight quickly. I could no longer stand the sight of myself in the mirror. I had no social life, always wore the same pair of black pants and black shirt, and stop taking phone calls from friends and family. Physically and emotionally I was bankrupt. I often considered taking my own life. So I stopped eating in disgust. But - 'lo and behold - before the first 24 hours of fruit fasting had transpired, I was gorging again. Headaches, dizziness, nausea, weakness, diarrhea, sporadic vomiting and sharp episodes of anger, rage and sadness overcame me like wildfire. I also developed a strong metallic taste in my mouth, a white 'sticky' film in the tongue and small white boils in the inner part of my lips. For most people, these detox symptoms do not emerge until roughly 48 to 72 hours of fasting. But after only twelve hours, I was really hurting. But something good did come out of this discomfort. The symptoms from not eating intrigued me enough to do some research on raw food diets and fasting. Soon I arrived at the ugly truth - I was more toxic than a landfill. The headaches, dizziness, nausea and fever were caused by toxins in the digestive system that were loosened into the blood stream when I stopped eating.'''
