description = "Master Cleanse Lemonade Diet: The Master Cleanse Lemonade Diet is a quick weight loss detox fasting cleansing diet. For 10-14 days you drink a mixture of lemonade, maple syrup and cayenne pepper. Results are colon, body detoxification and you lose weight fast."
full_description = '''Hello and welcome to the Master Cleanse Lemonade Diet page. This is page 2 of 4 that we have on this topic. In this series, you will learn "what" the master cleanser is and "how" to carry it out and break it properly. Here is PART ONE if you have not read it. If at any time you have a question that is not answered in these articles, please Contact Us. Ok, here we go! One of the first things I liked about the master cleanse lemonade diet is that it's actually easy to make. Many do-it-at-home health programs, as the picture above, proclaim simplicity but can become cumbersome and impractical. This lemonade detox, on the other hand, is simple and effective. I saw it raise my son from illness to renewed vitality and health. Again, the master cleanse lemonade diet is NOT a "fix-all" panacea, but it does work. Alright, the lemonade diet mixture combines the following ingredients: Combine the ingredients in a TEN OUNCE ounce glass. Drink SIX-TO-TWELVE glasses of the mixture daily. In reality, drink the mixture anytime you feel hungry - within reason. I DO NOT suggest that you drink more than 15 glasses per day. Of course, no other food should be taken during the master cleanse lemonade diet. For the sake of expediency, I suggest that you prepare the mixture in gallon increments. One gallon should last you at least two days. Each night, the master cleanse lemonade diet asks you to drink ONE CUP of Herbal Laxative Tea. That Traditional Medicinals tea linked to the left is AMAZING! You will have memorable bowel movements ... definitely for the record books. Really, really good tasting and effective. Another amazing natural laxative I want to bring to your attention is Herbs and Prunes. Two-to-four of those daily and you'll be barking at the moon for sure. :-) Seriously, these are both very good supplements that will accelerate the cleansing process exponentially. Upon awakening, the lemonade diet regimen asks that you drink a so called "salt-water flush" to incite a strong bowel movement. This flush has been referred to as an "oral enema" because it flushes the entire digestive tract and colon - usually in less than one hour. It helps the body clear out Mucoid Plaque, Parasitic Worms and debris from the walls of the intestines.'''
