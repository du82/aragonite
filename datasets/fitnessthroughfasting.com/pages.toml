["https://www.fitnessthroughfasting.com/help/rss.html"]
title = "What Is RSS?"
full_description = '''Click on the orange RSS button on any page to get the latest pages published on this site. You can use the same RSS button anywhere else on the Web, to get newsfeeds from CNN or BBC, or just about anything else, including news on upcoming movies and DVD releases, your favorite musician's tour updates, etc. Once you get started, it's like having your favorite parts of the Web come to you. No need to go out and check for updates all the time. No need for bookmarks! "RSS" means "Really Simple Syndication." But that's just a fancy way of saying that you can keep up with all the updates to this site without having to check the site every week to see "what's new." New pages and updates to old ones are released through RSS. Download a free RSS Reader first (or skip to the bottom to learn about Web-based readers). This is special software that reads the RSS feeds... Right-click on the orange RSS button on any page of this site, or any other blog or news source that interests you. Copy the URL and paste it into your RSS reader. You can also use a Web-based RSS reader, like Feedly or My Yahoo!. Look for one or both of these buttons on a page on this site. Click on a button to add the RSS feed to that Web-based reader. If you don't yet have an account, you can set up one after clicking on the button.'''
