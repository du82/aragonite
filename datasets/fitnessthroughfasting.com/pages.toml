["https://fitnessthroughfasting.com/fasting-cured-my-bulimia.html"]
title = "Fasting CURED my Bulimia!"
description = "I was bulimic for a long time, longer than anything I would wish on anyone. It's absolutely horrible to live with and the obsession, I was told, never"
full_description = '''I was bulimic for a long time, longer than anything I would wish on anyone. It's absolutely horrible to live with and the obsession, I was told, never goes away. How wrong they were!I had finally made up my mind, after months and months of failed diets to try a water fast. It was the best decision of my life!At first it was difficult, but I was determined and made it through 3 days. I had set that as my limit, but once I got there I felt the urge to binge and purge so I forced myself to keep fasting.It felt like some amazing had taken over my body! I admit I was a bit weak, but my mind...on my God, my mind was incredible. I felt so much more at peace with myself and the world, and I could concentrate on my actual needs not just my wants.After 10 days, I decided to stop. I was sure that I wouldn't binge or purge. And that's just what I did. I started out eating veggies and fruits for a few days, then moved up to adding some protein, finally adding a little bit of carbs. I am never struck with the urge to binge or purge anymore. I get the thoughts, but immediately tell myself "that's not who I am anymore" and they subside.Fasting, seriously, change my life for the better.'''
year_published = 2016
