title = "40 day fast! Day 5!!!"
description = "Day 5!!! Praise the Lord; I am sooo grateful and happy that I am finally on my way!   I’ve waited for this for a very long time and now it has finally"
full_description = "Day 5!!! Praise the Lord; I am sooo grateful and happy that I am finally on my way! I’ve waited for this for a very long time and now it has finally arrived. I am already feeling the calmness within me, I am catching glimpses of peace and joy!!! And I am not turning back come rain or sunshine. To be made in the image of God, I believe supreme health is most definitely part of the equation…Our bodies are a magnificent piece of work when restored to its former Glory!. We are the handiwork of what we consume whether it would be spiritual or physical. We are what we think, eat and believe. This shapes our outlook in life. We are bound by the laws of nature. There are consequences whichever way.As for me and my family, I have chosen to believe for life. I have walked this faith for many yrs. and now I believe it is time to reap the rewards. I love my God for I know that it is Him that taught me to love life! And God is this Life that I have come to Love and adore with my body, spirit and soul (mind). We are all destined for the grave in these bodies of flesh, so why not acquaint ourselves with our origin, that our departure may be a peaceful transition… We are here, but for a period. What is our purpose? What is our destiny? What is our origin? All these questions have answers!!! These answers lie within us and come to light when we experience peace within our souls.Fellow faster!D."
