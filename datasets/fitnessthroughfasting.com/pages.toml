["https://fitnessthroughfasting.com/spiritualfasting.html"]
title = """
Spiritual Fasting For the Demolition
of Strongholds"""
description = "Spiritual Fasting can help break depression, confusion and negative behavior patterns. It can fine-tune your perception into a razor-sharp lense of discernment, inspiration and God consciousness."
full_description = '''For thousands of years religions worldwide have used the discipline of spiritual fasting as a means to pound on the doors of heaven for breakthrough. The concept is that fasting weakens the body and allows the spirit to receive God's power and direction with greater intensity. While prayer can be seen as a gunshot that helps to penetrate the spiritual world, fasting becomes the 'machine-gun' that makes the discipline even more powerful and effective. The egoic mind, which is concerned mostly with external things, is set aside in favor of spiritual matters, which are more REAL than our three-dimensional reality. In this page we begin a discussion on spiritual fasting from a Christian perspective, including Lent Fasting and Catholic Fasting. Use the enclosed bible-search box to look up passages as they are presented, or for your own study. Overall, spiritual fasting centers on putting aside the domination of the flesh in favor of the spirit which, in essence, is the true source of power that can solve the problem or situation being fasted for. Christ himself, the Scriptures say, was filled with The Holy Spirit in the River Jordan and then led to the desert where he fasted for 40 days and came face-to-face with Satan (Matthew Chapters 3 & 4). Whether you believe this to be literal or not is irrelevant. We respect whatever your belief may be, and wish to use this passage primarily as an example of spiritual fasting and its results. Bible scholars indicate that Christ had to first confront every human weakness BEFORE being ready for his ministry, before becoming the suitable representative for the entire human race. It could only be done through fasting... imagine that! During the desert fast, Satan offered Christ food, riches and godhood (Matthew 4). In every case Christ alluded to the Word of God, indicating with his refusal that there was a higher and "more real" reality than the cravings and desires we experience as human beings. This required fasting. We are not told of Christ drinking water during his time in the desert. If he did not, then that particular fast was indeed supernatural.'''
