full_description = '''Welcome to the Fasting and Cleansing MAIN page. Here we kick off a SIX page series on the amazing power of fasting to help you achieve unprecedented body detox cleansing, health and wellness. I'm going to start by talking a little bit about my path through obesity, sickness and hopelessness and how fasting and cleansing saved my life. In this page I'll introduce you to the term "curative crisis" - what it means and why it is so important. Then we'll move on and look at a variety of ways via which you can achieve complete body cleansing and detoxification. Some of the topics we will address include cleansing diets, intermittent fasting, liquid fasting diets, liver, kidney & gallbladder detox, colonic-cleansing and home remedies. You may want to check out our lemonade diet series when you have a chance. The lemonade or "Master Cleanse" diet is another powerful fasting and cleansing system at your disposal. If at any time you have a question that is not answered in these articles, please Contact Us. Ok: Let's hit the pavement running! When I first started the process of fasting and cleansing as a lifestyle, my body was more than 70 pounds overweight. Concentrating on any one task for more than a few minutes was nearly impossible. I woke up each morning hating life. I went to mental health professionals and took a myriad of medications for anxiety and depression, meanwhile ballooning to 260 pounds (my ideal weight is 190). Went to colonic clinics and bought every colon cleansing product under the sun. But nothing seemed to help. To my dismay, they were not able to fix me. I was in my early thirties yet looked at least ten years older. When I would go out with my mother, people actually asked if I was her husband (a great compliment to her, at least). Much of my time was actually spent fantasizing on how I could take my own life and end the misery. I was ... in hell. Fasting and cleansing came into the picture sort of by accident. I had read in a magazine how people had lost dramatic amounts of weight and improved their health through 30 Day Detox Fasting. My health situation was worsened by a liver illness that threatened to cut my life short. I was literally a walking ball of obesity and toxicity. So much so, that some of my "friends" said I looked like the Stay Puft Marshmallow Man.'''
