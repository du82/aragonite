["https://www.fitnessthroughfasting.com/quick-weight-loss-diet.html"]
title = "Quick Weight Loss Diet - Fasting, The Very Best Free Quick Weight Loss Diet"
description = "Quick Weight Loss Diet. Fasting is the best quick weight loss diet. Lose one pound a day with water fasting and three to five pounds per week with juice fasting. Detoxify and rejuvenate."
full_description = '''We also want to keep the message realistic. Fasting for weight loss can be very tough and challenging. Yet, if you stick to it, I can tell you from personal experience that the rewards -physically and emotionally - will be beyond your wildest dreams. The hump during the first nine to eleven days of quick weight loss fasting is physical and mental. In most cases, colon and intestinal detoxification is accompanied with an increased mental obsession for the foods with which one overindulged. Being overweight was a foe that assaulted me with a constant mental preoccupation with greasy and sugar-filled food, together with a deadly compulsion that led me to overeat. In other words, it was not uncommon for me to start with ONE donut and end up eating the entire 12 in the box. Or eat an X-tra large pizza by myself, or a whole carton of ice cream ... you get the picture. I knew it was killing me. Yet even my most sincere desire to stop the cycle was no match for the food obsession-compulsion monster. My body was already toxic and sick. I was trapped in a destructive juggernaut from which no escape seemed possible. Any type of rapid weight loss diet I would start was broken within a week with massive binging and much shame. If you have not already done so, I invite you to go to Rob's Nightmare and read a part of my fasting testimony. So I want to emphasize that, in many cases, obesity is a obsessive/compulsive condition. It is, in essence, an addiction. One of the biggest stumbling blocks for me to overcome initially was "nonchalance." Many overweight people face this obstacle, I have found. "Yes, I am overweight, but I am either too busy to do anything about it, it is not that bad, or I simply do not care. Fasting or any type of quick weight loss diet is simply not worth it, some may think. Or perhaps one feels hopeless and is stuck in the mire of apathy and hopelessness. The problem with all of these negative states of mind is they are all tunnel-visioned. They do not consider that life can and does change for the better. Apathy, hopelessness, nonchalance and "too busy" patterns are real soul stealers.'''
