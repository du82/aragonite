full_description = "I am completing day 3 of my juice fast. I drank juice and distilled water. The first day I felt a little weak, but by day my third day had energy enough to go for a 1/2 hour walk. Edema in my feet disappeared. The mucus in my throat cleared up. I have lost 5 pounds. I have an incredible amount of energy, and clarity. Last night I had the best sleep without having a glass of wine or a sleep aid. I am breaking my 3 day fast with soup, yogurt, and more juice. I will have a light salad for lunch. I will continue to reintroduce foods back into my diet for at least 3 days. I feel like a new person. This was a prequel to my new vegetarian lifestyle; it was a great detox."
