["https://www.fitnessthroughfasting.com/fasting-inspiration-and-encouragement.html"]
title = "Fasting Inspiration and Encouragement!"
description = "Hey Everyone,  My name is Mike, I am 22 years old and I am on day 5 of my 30 day water fast. I have done a few fasts before (Weighed in around 240lbs)"
full_description = '''Hey Everyone,My name is Mike, I am 22 years old and I am on day 5 of my 30 day water fast. I have done a few fasts before (Weighed in around 240lbs) and lost roughly 30lbs of fat (Now at 210). Another 30lbs will bring me to my ideal weight of 180lbs, at 6'2.During my fast I am doing some light work out and lots of stretching. My energy levels aren't too bad at all, as I have felt worse from eating food!Once I get close to ending my fast and re-introducing healthy foods, I will be working out pretty often to get lean.After day 7 fasting gets even easier for me as I remind myself that I have come this far already, and ending now would ruin the progression. Mind over matter.The biggest motivating thing for me is WHEN I have hunger pangs. When I have them, I just tell myself that this is my body eating fat and ridding toxins. When I don't feel hunger, I feel I'm at status quo. When I feel "hunger", it's just my body fighting and ridding me of junk.Fasting is not easy though, when you feel like your 1 out of 10000. Everyone around you is eating, and the foods you loved are in front of your face. Think of it this way.. at the end of your fast, you WILL be 1 out of 10000. The mental clarity, renewed vigor, and appreciation for your body will truly put you on the other end of the spectrum.Fasting to me is more powerful than anything else the world has to offer us. Nothing but water, and the mindset to change makes a powerful cleansing tool both physically and mentally.I look foward to unlocking my full potential as a person, as I know confidence will change, other peoples opinions of me will change (even though I am happy and positive now, people have a different outlook on people who are healthy and in shape, regardless of attitudes), and my opinion of myself will change. The sad thing is, everything we do in life is a mental decision, and we just have to control it. We use only a small part of our brain, and it is my belief that it is making the difficult decisions that can ultimately better us which requires that unknown brain power. It is more than willpower, or self-control... it is knowing who you are and what you want in life.If anyone needs some support or encouragement, you can fire me an e-mail at michael@power1solar.comI want other people to experience how awesome a water fast feels. A little stomach growling is not worth that body you always wanted? Pleeeasssee my stomach does not own me. I tell it to shut the hell up :D. And now that it is day 5, me and stomach dont argue anymore.Good luck everyone,Mike'''
