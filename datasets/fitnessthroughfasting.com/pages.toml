title = "Food Addiction Story - How Fasting Saved My Life"
description = "In this page, webmaster Robert Dave Johnston tells the story of how fasting saved his life from food addiction, obesity, depression, alcoholism, illness and hopelesness."
full_description = '''I believe that I was born with food addiction already in my makeup. Ever since I was a small child, I recall always feeling inadequate, ugly, weak an unworthy. This translated to lots of bullying in school and very few friends. The kids called me "the ugly fat cow." Anytime I would walk by or get in the bus they would start "mooo, mooo, mooo." You know how tough kids can be. I was terrified to go to school. I was the overweight, nonathletic, dark-skinned kid in the group. The ugly duckling. My mother worked hard to raise and support me, but it was very hard as she was alone. My father was a very famous Latin American singer in the 1960s and 70s and I guess he was too busy with his fame to care much about me. So he left us when I was very young. I was always in emotional pain. Food addiction gave me the hiding place and "medication" that I needed. I recall that for a great part of my childhood my grandfather ran a little shop from the house. Kids would come up to the kitchen window and order candy, sodas and fried goodies. Needless to say, I ravaged the candy when no one was looking. It was not unusual for my grandparents to find tons of candy wrappers under my bed. "You're eating my profits!" grandpa would shout. I could not stop. I was not even ten years old and already food addiction was taking over. My mother went on to remarry, but the father image that I longed for did not materialize, something that I believe led to my full-blown food addiction. This stepfather was an alcoholic; there were periods of terrible mental and even physical abuse. I retreated further into my shell. Girls did not like me, I had no friends and became a total outcast. This went on through high school. Many other things happened and for a period of time I lost a lot of weight. It was mostly due to my huge love for Rocky and Sylvester Stallone. But that did not last and my binging eventually led me to regain all of the weight. By this time I was in my late teens and had gone off to Los Angeles to be on my own. I did ok at first and started to get in shape and do some acting. I played in numerous rock bands. Like they said in the movie Goodfellas - "It was a glorious time."'''
