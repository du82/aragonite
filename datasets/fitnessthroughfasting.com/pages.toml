["https://www.fitnessthroughfasting.com/dieting-and-fasting.html"]
title = "Dieting and Fasting - The distinct pathways of Dieting and Fasting"
description = "Dieting and fasting . Dieting and Fasting provide two distinctly different pathways to weight loss."
full_description = '''Now when we say "diet," we are not referring to a well-balanced nutrition program that you may adopt as a "lifestyle-change." In other words, many persons come to a point in their lives in which they understand the importance of food and proper eating and, on their own, make a firm decision to change their diets for the better. A good example is a person who goes from junk food and meat to a raw-food/vegan diet, macrobiotic diet, or some other type of healthy lifestyle. These types of changes are at the very heart of what we discuss in this website and are highly encouraged. What we are talking about when we say "diets" is the never-ending see-waw of jumping from one crash diet to another - always seeking to lose weight, always trying this regimen and that regimen - but never quite achieving true weight loss or improved health. Quite the contrary, in many of these cases, the person in some time grows worse - not better. This is the context that we are referring to in this dieting and fasting page. I had to first address the immense toxicity in my digestive system, as well as my heavy reliance on nicotine and caffeine - not to mention donuts and pizza. : ) Diets by themselves - at the initial state - did not totally address my distorted perception of food as comforting -- a buddy that could cover up any feeling, pain or situation at any time of the day or night. There was definitely a food "addiction" in place that I had to deal with through fasting "before" I could come back and re-establish a healthy relationship with food. Dieting and fasting was the right combination, but first I learned it was crucial to do them in the right order. Don't get me wrong - food is meant to be enjoyed and it can indeed bring us comfort. I am not referring to a healthy appreciation for food. Rather, I was constantly overtaken with a mental obsession for the "wrong foods" coupled by a physical compulsion that made it difficult to stop binging and overeating. Three AM binges for me were commonplace, even if it meant gorging on "diet" crackers or drinks. To be sure, the number of dieting and fasting detox plans out there are countless. There ARE programs that DO work and CAN help you accomplish this balance. Some of them are listed in this page.'''
