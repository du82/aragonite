["https://www.fitnessthroughfasting.com/dieting-fasting.html"]
title = "Dieting Fasting and The Mind in Revolt"
description = "Dieting Fasting and The Mind -Understanding how Fasting is Received by your mind and feelings will help you overide negativity and hold on to your health and weight loss goals."
full_description = "Fasting attacks pollution in the body, but it also will put you face to face with a large amount of negative thinking that, in turn, can sabotage your progress. And this is the case not only with fasting, but with any process of dieting, weight loss and health-improvement. If you have been overweight and/or unhealthy for a long time, then you will likely experience a lot of mental resistance when you start to make changes. This is normal and should be expected. You need to hang on and keep going regardless. The resistance will eventually yield and you will gain your breakthrough. But you will need to learn to endure and continue in spite of the mental and emotional storms. There are many misconceptions related to fasting. it is very possible that when you decide to launch your water or juice dieting fasting effort, some of your friends or family members may try to talk you out of it. Gather as much information as possible of what you are trying to accomplish and, by all means, share it with close relatives or friends. Stay close to them as you go through the process, and do not hesitate to approach them for support - especially during the first nine to eleven days when hunger and withdrawal pains are at their peak. But I suggest that you DO NOT trumpet your dieting fasting intentions to a large group of people. If you do so, you might have to endure endless opinions and criticisms that will only thwart your motivation and, even possibly, break your resolve. Yet the benefits of fasting are yours for the taking if you are willing to undergo a little sacrifice. I am not advocating that you flagellate yourself or any type of anorexia fasting. I am referring to dieting fasting as a discipline practiced responsibly. For more on fasting misconceptions and what to expect during a long-term fast, visit our Fasting Fast Weight Loss Diet Misconceptions & Mystical Benefits. Abstaining from food also awakens whatever subconscious, self-defeating belief systems and patterns lie within you."
