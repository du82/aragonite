title = "Fasting for Weight Loss & Colon, Kidney & Liver Detox Can Save Ur Life"
description = "Fasting for weight loss and regularly detoxifying the colon, kidneys, blood and liver can burn fat quickly, reverse potential disease, rejuvenate you and, literally, give you a brand new life. My journey to hell & back & how fasting & detox helped me dodge certain death."
full_description = "Welcome to the world of fasting for weight loss and detoxification! My name is Robert D Johnston and I'll be your host. I created this website to share my testimony about the horrors of morbid obesity, food addiction, chronic depression, binge eating, and the subtle yet merciless killer of toxic buildup. If this in any way describes you, then you are in the right place. I spent nearly two years incapacitated by constant nausea, dizziness, digestive spasms, constipation, fever, low energy, obesity and suicidal depression, among others. I am six feet tall. I recall getting on a scale at a doctor's office in 2016 and seeing the horrific truth in front of my eyes. I weighed 300.7 pounds. My ideal weight is 195 pounds, just to put it in context. In my experience, you can feel like you are dying and go from hospital to hospital; from doctor to doctor. But, sad to say, few or NONE will take the time to discover and directly treat the root cause of the illness.I'm not saying that all doctors and medications are bad. But I have found that, in many cases, traditional medicine will bombard you with pills to treat symptoms but will do little or nothing to CURE you. To illustrate from personal experience: I was hospitalized FOUR times during 2016 and saw more than six doctors. Amazingly, not ONE ever asked me about my diet or suggested testing my stools for fungi, bacteria and parasites. You constipated? Here's a pill. You have diarrhea? Here's another pill. And another, and another, and another. In desperation, I took many of these pills, not realizing that the massive amount of chemicals I was ingesting (under doctors orders) was only exacerbating the terrible toxicity that was killing me slowly but with absolute certainty. Test after test came back negative. I would be released from the hospitals gravelly ill, suffering and without a single answer on hand. I'll tell you more about my story later. I don't say these things to depress you. Far from it. I will share my experience with you in hopes that, whether you are thin, heavy-set or obese, you may consider that, when our bodies do not work properly, life will become a living hell."
