["https://www.fitnessthroughfasting.com/christian-fasting.html"]
title = "Christian Fasting for Deliverance and Revelation."
description = """
Christian Fasting draws the believer closer to God as well as 
  injects insight, healing, deliverance and spiritual revelation. A time of Worship,Prayer and Study of God's Word."""
full_description = '''google_ad_client="pub-0000000000000000";google_ad_width=200;google_ad_height=200; As believers, christian fasting is one of the most powerful disciplines we have at our disposal to grow spiritually, overcome habitual sins and grow in intimacy with the Holy Spirit of the Living God. Going to church, praying, helping others, are all wonderful. But ask many believers to fast! It could be equivalent to asking them to put needles in their eyes or submit to some other type of extreme flagellation. I am not joking I have had situations where Christians have cursed and ostracized me because I 'dared' to ask them to fast. They said that, since Christ had already died for our sins and risen from the dead, we no longer had any need to fast because He had given us the victory. They indicated that fasting was a sacrilige because one is trying to 'suffer' for their sins and thus invalidating what Christ had already done on the cross of Calvary. I recall being amidst my testimony in a retreat, talking about how facing my fleshly weaknesses purifies my soul, and the pastor - insulted - came and took the microphone away from me before I was through speaking. He sure was mad! And, you know what? I can see their line of reasoning. The are some who fast only to call attention to what they are doing, to let everyone know 'how much they are suffering' for Christ. But that is not at all the type of Christian fasting that I am talking about. Yet I was not given the opportunity to speak. This may sound harsh, but I have found it to be so with some people. Nobody these days likes to skip meals. One precious brother went as far as to tell me that Christian Fasting was outdated, and that the best way to worship God today was to eat and be merry. And, lo' and behold, he is more than 50 pounds overweight and a diabetic. They are supercharged with God's annointing to teach, preach and evangelize. Yet they are obese. I can see the devil laughing as he watches these great men and women stuff their faces with junk day after day. "Yeah, preach away all you want ... and keep eating while you're at it," the devil probably says. "I got you in my grasp and your days are numbered." I don't know about you but that is a tragedy in my book.'''
