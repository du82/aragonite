["https://www.fitnessthroughfasting.com/fasting-experience.html"]
title = "Fasting Experience - Fasting Experience - The Day-by-Day Process"
description = "Fasting Experience - Read about the Day-by-Day Fasting Experience and know what to expect when juice fasting or water fasting for health, weight loss, colon detox cleansing and overall detoxification."
full_description = 'The whole point of this series of pages is to give you a front seat to what I experienced while traversing the fast, and how I felt and made it through. Please note: This series is in an ongoing process of construction. If you are unable to access a particular fasting experience page, check back often. The page will be up very shortly. Day one of the fasting experience is one filled with apprehension and fear. I do not know what to expect. Being 70 pounds overweight, the task seems insurmountable, uphill and nearly impossible. Just a few hours from the last meal, the hunger pains waste no time in appearing and starting to poke at my resolve. "Why bother," the mind says. "You will never make it. This is a waste of time. You are too fat for any of this to make any difference." I have found great comfort with seltzer water and lime. It goes down smoothly and seems to grant me cover from the hunger. At this point the mind also reminds me that what I am doing is foolish because I intend to continue functioning on a daily basis to the best of my ability. I want to put it off, but I know in my heart that if I do not do it NOW, my health and weight will continue to deteriorate. I must seize the moment and not let this fasting experience go to waste. When there is so much weight to lose it seems like it will be forever before any results are noticed. Realistically I have to lose at least ten percent of my 250 pound body weight before any difference can be truly noticed. That means that, at roughly one pound per day, it will be a good 25 days before this fasting experience starts to give me the desired dramatic weight loss. One of our readers pointed out he did a 10 day water and vegetable fast starting from the same weight of 250. He lost 20 pounds in the first 6 days of and nothing for the remaining 4 days. From his direct fasting experience, the graph of weight loss vs. time can, for many, also be a steep, then flattening curve, not a straight line. Moving on with Day 1 of this fasting experience, I also realize that fasting by itself is not the solution. That I will have to permanently change my eating habits AFTER if I expect to sustain the weight loss.'
