description = """
Best Weight Loss Plan - The Best Weight Loss Plan
  Involved Knowing The True Definition of Fitness - Permanent Weight Loss Comes
  From The Mind, Body, Soul, Spirit Connection."""
full_description = '''The Best Weight Loss Plan... I frequently get emails from site visitors asking me: "Robert, why did you call the site 'Fitness Through Fasting'?" What does that mean? I think that is a good question and I hope to answer it here. This, actually, is what I consider to be the best weight loss plan. For many years, I would place all of my efforts to lose weight and improve my health 'on the outside.' It was all about "diet and exercise, diet and exercise, diet and exercise." And, of course, these ARE crucial elements in any weight loss program. I would lose weight all the time. How could I not, right? If you reduce the number of calories you take in, and increase your activity levels, weight loss occurs. It is a mathematical certainty. That is the best weight loss plan as usually promoted, right? But, but, but... the problem was that I always ended up gaining the weight back. That, too, became a mathematical certainty. I always thought that if I lost weight, had lots of muscles, took all the best bodybuilding supplements and got really thin and fit - THEN I would be happy and feel good about myself. THEN my life would work, make sense, and I could be free to experience it. My happiness was always placed in the future, WHEN I lost weight and LOOKED better. It had a 100% externally-oriented mentality. The best weight loss plan was always tied to some point yonder in the future and away from my grasp. And, guess what? It didn't work! I was looking through the same distorted, dirty and injured mental lense that was the root of all of my personal external issues. Sure, I would lose weight and 'look' better. However, on the inside, I felt the same as I always had; insecure and full of fear, doubt and self-pity. Looking good on the outside did not 'solve' the problem as I'd hoped. Within weeks or months (sometimes even just days), I would start to slack off my new diet and workout schedule. I would sneak a bite of junk food here and there. I would miss a workout here and there. Then I would take a bigger bite of junk and abandon my workout for another day. My best weight loss plan would slip out of my hands.'''
