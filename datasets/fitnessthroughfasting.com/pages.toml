["https://fitnessthroughfasting.com/a-new-beginning-going-on-a-60-water-fast.html"]
title = "A New Beginning - Going on a 60 water fast"
description = "I am a 29 year old female 5'4 and 290 lbs. My highest weight was 354 lbs in Dec. 2010.   I lost 18 lbs in 6 months through diet and exercise. The exercise"
full_description = '''I am a 29 year old female 5'4" and 290 lbs. My highest weight was 354 lbs in Dec. 2010. I lost 18 lbs in 6 months through diet and exercise. The exercise was killing my knees so I had to stop. I researched fasting for several months and decided to give it a go in July 2011. Well after going on a 12 day fast I lost 22 lbs! Very exciting!! I was elated! Well as you may know if you deviate off of a fast it is very hard to begin again. I fasted 2 other times during the summer, Aug. for 6 days and lost 12 lbs and Sept. for 7 days and lost 11 lbs. While fasting for 23 accumulative days I lost 45 lbs. In the last 10 months I have lost a total of 64 lbs and kept it off. I have been struggling to get back into fasting full swing ever since. I am making progress. I have been fasting or just taking bites of food for the past 2 weeks with some success but as you know taking bites is eating and eating is not fasting! I am ready to take the leap to full success. Ready or not tomorrow is water fasting day 1. Oh, I'm ready alright! If not now when?I encourage others to join me. I find it easier to avoid food altogether than to try tempt myself with "tastes" since that's all it takes to say "I'll start my fast tomorrow after I eat this last meal." I know this will be the beginning of the new me, a healthier more health conscious me! Good luck to me and all others ready to embark on this journey!'''
year_published = 2017
