["https://fitnessthroughfasting.com/fastinghealth.html"]
title = "Fasting Health - Information on Fasting Health Benefits & Risks"
description = "Fasting health benefits and risks. Read about how fasting can drastically improve your life and what may be the risks involved. Fasting and diabetes information."
full_description = '''Nevertheless, if not handled appropriately, fasting could, in some cases, produce adverse effects with some people. It is not a panacea and there could be risks involved. It is therefore important for us to discuss in this series of articles how the body reacts when it is deprived of food, and what impact this can have on persons with pre-existing conditions. Please visit Fasting & Diabetes for an expanding talk on fasting insulin - fasting glucose tolerance tests and how juice and/or water fasting can help avert diabetes and, in some cases, cure it. There are many documented cases of persons with terminal cancer having been healed after going on an extended fast. You can visit our dear colleague Tom Coghill's St. Theodore's Hospital of Sagada website. The medical reports suggest that depriving the body of solid food for a season allows it to detoxify and therefore fight off the disease on its own. That the "source" of the illness was actually a polluted digestive tract. There is much to say about the premise that Disease Begins in the Colon. I have found this to be absolutely true in my practice as a nurse. Nearly every person I come across with a terminal illness is overweight or has abused his or her body in other ways; cigarettes, drugs, alcohol etc. This, of course, is not the case every time. But, sadly, it is the majority. As a nurse I do believe in the power of fasting. However, I also insist that persons launching this undertaking should receive medical attention before, during and after they fast. Long-term fasting health benefits can be ensured when there is certainty that it is not causing other complications. This is specifically related to extended periods of water fasting because, in this case, vital organs as the brain and heart do not receive any type of glucose (food). Fasting glucose levels can go down dramatically during a water fast, causing the person to feel very weak and possibly even faint. Nobody amidst a water fast should continue to exert him or herself if at all possible. If you simply cannot take the time out to fast, then I suggest you stick to juice fasting for the time being. You will still receive fasting health benefits.'''
