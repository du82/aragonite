["https://fitnessthroughfasting.com/binge-eating.html"]
title = """
Binge Eating Disorder - The Heartbreaking Prison of
Binge Eating Disorder & How Fasting Can Break the Chains"""
description = "Binge Eating - The Heartbreaking Prison of Binge Eating Disorder. What is Binging? How does it affect a person's life? The Disciplines of Juice Fasting &amp; Water Fasting Can Break the Chains"
full_description = '''Welcome to our binge eating series. This is article #1 of 5 about this crippling and life-stealing condition. Here I will give you a definition of binge eating based on my personal experience. In the 2nd page we will look at ways to prevent a binge - AND in the 3rd page we'll discuss how to stop one after it has started. Pages 4 and 5 will focus on recovering after a binge and how the disciplines of juice fasting and/or water fasting can provide a way out. If you have struggled with obsessive/compulsive overeating (or you know someone who does), then you (probably) know FIRSTHAND how destructive this sickness is, and how it can literally turn an otherwise vibrant person into a prisoner of his (or her) mind and body. A human being caught in the downward-spiral of binge eating is, without a doubt, being assailed by a vicious mental and physical behemoth of utter destruction. While I am NOT a doctor, I write to you with assurance because I myself struggled with binge eating for many years. Having lost all hope and locked myself in a room to eat and commit suicide, the light of Providence shone down upon me from above and, in my darkest hour, led me to the amazing discipline of fasting. A 60-day water fast served as the platform for a dramatic process of physical, mental and spiritual detoxification which, against all hope, gave me the clarity and "cleanliness" that I needed to learn how to make better choices for myself. And so it is that, through this humble website, I endeavor to share about what I have experienced and learned in hopes that at least ONE person is spared the living hell that binge eating, toxicity and obesity caused me. I certainly do not presume to have the ONE-AND-ALL solution to this complex illness. There are many competent men and women of science and medicine who are much more suited than I to answer such questions as: "is there a cure to binge eating?" I can, however, talk to you about the ESCAPE HATCH that I have found thorugh fasting and full assumption of PERSONAL RESPONSIBILITY. Join we through the tunnel, if you will, and let's move forward until we reach the ocean, the sun, the stars ... freedom!'''
