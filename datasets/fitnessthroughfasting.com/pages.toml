["https://fitnessthroughfasting.com/health-diet-fitness.html"]
title = "Health Diet Fitness - Health Diet Fitness Through Fasting"
description = "Health Diet Fitness - Fasting as part of your Health  Diet  Fitness program can provide dramatic weight loss and detoxification. We can show you the way !"
full_description = 'They actually sabotage their own health diet fitness efforts. They do not realize that the period "after" a prolonged fast is when one is most easily able to transform eating habits. You want to know Why? Because the body is clean of toxins. Withdrawal is not there to cause grief as it does when one fasts for the first time. Personal quote: "Withdrawal from toxins is actually what many in the western world call - hunger. They eat, not so much out of hunger, but to feed the food addiction and give their toxic bodies a constant "fix" of unhealthy foods. Binging temporarily appeases the craving and prevents uncomfortable withdrawal. This cycle continues ad infinitum. Bodies asking time and again for more of the very toxic food that is actually killing them." Eating light is the key. After I broke my initial 40-day fast, my diet was made up of vegetable soup, fruits, vegetables and fish ... period. Very light, good meals low in sodium and sugar. These initial six months are crucial because you will be forging brand new ways to related to food and eating. It is at this time that it is also great to start a regular fitness regimen. After completing that first 40-day water fast I felt very light - physically and emotionally. It was awesome. All cravings for sugar-filled and fatty foods had left me. Compared to the way I was eating before the fast, this "freedom" was truly a miracle! Check out the page Fasting Made Easy for more on the "mystical" experience I had during and after that initial breakthrough water fasting effort. Oh, speaking of water. Yes, after I finished that first fast, I drank lots and lots of water. Water is a crucial part of any health diet fitness program. Please, when you have some time, do go and read our Water Diet discussion on how vital it is to drink at least half a gallon of cool water per day - whether you are fasting or not. The sections on Water Fasting and Water Fasting for Weight Loss expand on the water topic. Water fasting indeed produces very rapid weight loss, but it is also the toughest type of fast.'
