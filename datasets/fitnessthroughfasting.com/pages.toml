["https://fitnessthroughfasting.com/weight-loss-motivation.html"]
title = """
Weight Loss Motivation - Fasting Weight Loss Motivation
& Inspiration - Hang In There!"""
description = "Weight Loss Motivation - Here is some weight loss motivation and inspiration to help you stay on the fasting path and achieve your goals. Hang in there ... you can do it! Fasting for quick weight loss &amp; detoxification radically improves health and quality of life. Don't quit before the miracle happens!"
full_description = "Losing weight is hard. Getting weight loss motivation can often be even harder. We can start fasting and/or dieting one day filled with zest and determination and, just a few days later, we are overeating again and wondering what happened. Yes, weight loss motivation is crucial but not always the easist thing to come by. So it is my aim in this page to refresh your mind and spirit so that, if you are stuck, hopefully you will refill your tank just enough to keep going one more day. That is how weight loss and any other goals are reached... ONE DAY AT A TIME. No matter how many times we may fall - we must press on. We must continue. We must dust ourselves off and get up again. There is no such thing as failure if we have the right atttide. If we learn something from each fall, then we have not failed. To the contrary, we gain insight into our behaviors and into what makes us tick. And to know ourselves is to have the opportunity to master ourselves IF it is followed by focused action towards the achievement of our goals... this case our objective being weight loss and improved health. I can pump you up and give you lots of weight loss motivaton here. But if you do nothing, then nothing happens. If you always do what you did, then you will always get what you got! Let's get to the point: if you are more than twenty pounds overweight, then action is needed to protect your health. Looking slimmer and feeling more confident is terrific and desireable, but the truth is that excess weight kills. That was the weight loss motivation that REALLY got to me. Yes, I felt bloated and unattractive, but even worse than that I was on the road to an early grave. I want you to realize that your desire to lose weight and improve your health should be one of the top priorities in your life. Why? Because if you don't it is only going to get harder and, in the end, you may find yourself having to deal with an illness that could have been avoided if you had taken corrective action now. So, my point is, WHAT ARE YOU WAITING FOR?:-) This is the moment you have been waiting for. The time is NOW to take action, lose weight and improve your health. These are not empty words of weight loss motivation. I come from a deep place of binging, obesity, isolation and darkness. It is as a result of practicing these principles that I have dodged certain death and now have the privilege of sharing this website with you. So forgive me if I don't pull punches. But I realize that this is truly a life and death issue for many of us."
