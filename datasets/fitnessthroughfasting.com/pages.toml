["https://www.fitnessthroughfasting.com/weight-loss-and-the-mind.html"]
title = "Weight Loss & The Mind"
description = """
Weight Loss & The Mind: Why The Mental Aspect of Weight Loss Is Probably
  The Most Important and Overlooked"""
full_description = "Apart from fasting, keeping the 100+ pounds I lost some years ago has required something very important: complete willingness to create brand new (and permanent) eating habits. I was always hungry and in a bad mood, and going to the gym was like asking me to go get a root-canal. The only thing I could see was my fat reflection in the mirror and the huge amount of time that would be needed to lose all of that weight. For this I had to become 100% convinced that the old way of doing things simply did not work. It was a faulty equation that would NEVER produce the desired results. It was like trying to force 2+2 to equal 5. It will not happen. Not today, not ever. That means that I had to find a better way to eat; a system that would keep me free of binging and would help me to develop a healthy relationship with food. I talk about specific diets and menus elsewhere, but here I want to share with you the importance of you evaluating your past behavior, realizing that it doesnt work and becoming willing to let it go once and for all. Now this letting go does not happen just once and thats that. I have to let go every day, sometimes various times in the same day. Those old ideas related to food and eating always are looking for their way back into my life. I have to be aware of my thoughts and, once I become aware of them, I have to invalidate them and realize that they are part of that 2+2 =5 equation. This is not always easy, especially when the cravings are strong. I know that fish and chicken are the best protein supplements for my body, but without a doubt I will often crave a pizza and cheeseburger instead. You can talk to me about fat, carbohydrates, fruits, vegetables, protein and fitness, but my mind can easily forget all about it and take me back to the prison of obesity, binging and madness. But I have learned something very important: no matter how strong the craving is to give in and eat that donut, pizza, cake whatever, this feeling ALWAYS passes and I end up feeling GREAT when I DONT give in."
