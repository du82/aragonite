full_description = '''This is an all-inclusive audio, video and .pdf fasting masterclass extravaganza with more than eight hours of training is six modules. If you are interested in losing weight fast and improving your health, then this package is a MUST and will likely answer most (if not all) of your questions. I have basically taken all of my experience with over the past two decades and jammed it into six modules. lol With each module you get a video (my desktop point-by-point presentations), the .mp3 audio of each lesson (great to load into mp3 player so you can take me on the road!) AND the .pdf of the presentation itself. The videos are available for download in MP4, .AVI or mobile .MV4 in case you wish to view it in your smartphone or tablet. Some modules also come with various additional .pdf "homework" reports related to that week's topic. Module 1: What fasting is and what it is not. Clarifying your goals and expectations. How much weight will I lose in how much time? Am I prepared to pay the price? Robert's story - to hell & back. Q&A. Homework Bonus: Twenty Questions to Help You Break Negative Eating Habits & Position You to Succeed: This report will present you with a series of questions designed to help you clarify and sharpen your goals and vision. Going for a period of time without eating is mostly a "mental" task and having our dreams, goals and desires in writing is by far the biggest weapon against hunger pangs, emotional upheavals and detox symptoms. Module 2:The power of detox cleansing and liquid diets. Recipes you can use. The phytochemicals in fruits and vegetables and how juicing can harness them for detoxification and healing. Q&A. Introduction to Juicing Bonus. If you are new to juice fasting, this report will give you some guidelines to follow so you can get started right away. :-) Module 3:Water and dry fasting; definition and benefits. Common detox symptoms and tips to lessen them.Q&A. Rapid Weight Loss & Detoxification through 30-Day Intermittent Fasts & Home Enemas Bonus. This report talks about the benefits of coffee enemas and how, in combination with intermittent fasts, they can accelerate weight loss and body cleansing.'''
