["https://www.fitnessthroughfasting.com/benefits-of-water-fasting.html"]
title = "Benefits of Water Fasting, Quick Weight Loss, Body Detox Cleansing & Healing"
description = """
Benefits of Water Fasting, including weight loss, 
  body detox cleansing, spiritual / emotional renewal and physical healing."""
full_description = "If you are more than twenty pounds overweight and/or are having health problems related to obesity - then I beg you to stop what you are doing and give fasting some serious consideration. Why? Because there simply is NOTHING else on this planet that can help you lose weight and improve your health faster. If you are more than 50 pounds overweight, quick weight loss is crucial to reduce the risk of chronic illness. ONE-TO-TWO POUNDS A DAY? TWENTY POUNDS IN SEVEN DAYS? Where else can we find such a powerful life-giving resource? I have yet to run into an overweight person who tells me that he or she likes the excess weight and feels in optimum health. ALL of them tell me of their struggles to lose weight and how much better they would feel (physically and mentally) if they managed to overcome their troubles with food and eating. Well, LOOK NO FURTHER! If you are reading this page - then the time for excuses has run out: START TO TAKE ACTION AND DO NOT PROCRASTINATE ANY LONGER! The clock is ticking and the days of your life are going by. It is up to you to decide how you wish to live them. If you are overweight, the benefits of water fasting are just too many to ignore. Ok: In this page I want to look at water fasting benefits from a physical standpoint. Science points more and more to the benefits of calorie restriction, which basically means eating less and - yes - FASTING! Studies suggest that eating less can help humans live longer and lead to the retardation of aging.That is why I often refer to fasting as THE FOUNTAIN OF YOUTH... Listen, I am not a mystic - but I CAN tell you from first hand experience that there is definitely supernatural power in fasting. Whatever you religious beliefs may be - or even if you have no beliefs -, I have found that fasting puts us into direct contact with a healing force that is not of this world. You can call me crazy if you wish; but I felt it in my own skin... in my own mind and spirit. I was beaten. I was obese and hopeless. Sixty days of water fasting turned it all around for me. That is not a freak coincidence."
