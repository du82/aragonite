description = "The Lemonade Diet: The Lemonade Diet is a quick weight loss detox fasting cleansing diet. For 10-14 days you drink a mixture of lemonade, maple syrup and cayenne pepper. Results are colon, body detoxification and you lose weight fast."
full_description = '''Hello and welcome to the Lemonade Diet page. This is page 1 of 4 that we have on this topic. In this series, you will learn "what" the master cleanser is and "how" to carry it out and break it properly. If at any time you have a question that is not answered in these articles, do not hesitate to Contact Us. Are you ready? Alright; we're off and running! :-) I first became aware of the lemonade diet some five years ago. At the time, acute health conditions had developed in my son. These had taken away his energy and caused him to fall into deep depression and isolation. Blood tests showed that his liver, kidneys and digestive system were irritated and in turmoil Being 70 pounds overweight had taken its toll on his joints and muscles. A myriad of ailments were invading his body and threatening his health. This was a truly dark period for our family and we felt desperate and hopeless. The only solutions doctors offered was a very severe, highly toxic treatment that resembled chemotherapy that would have laid him out of commission for a complete year. There had to be another way ... I started looking for natural alternatives that could help him. We came upon fasting as a quick weight loss alternative and did much research. A very close friend, aware of my son's plight, one day brought up the benefits of a so called - lemonade diet. She emphasized it was a wonderful cleansing diet and a liver detox. I was always searching for healing through natural ways. But lemonade diet? Using lemons? I thought she was pulling my leg! Honestly, I had no clue what citrus could possibly do to for our bodies, apart from quenching thirst on hot summer afternoons. Still I listened to my friend with attention. I was not totally unfamiliar with liquid fasting diets. By using a cleansing regimen periodically, I myself had been relieved from acid reflux, constipation and skin and hair problems. It has consistently had a rejuvenating effect on my skin and helped me to maintain a youthful look - which I very much need in my artistic profession. In short, I was receptive to anything that could help my son, as well as broaden my health and nutrition knowledge. The lemonade diet was a true Godsend.'''
