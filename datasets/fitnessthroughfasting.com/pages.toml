description = "Colonic Cleansing - Colonic cleansing in conjunction with water or juice fasting is a powerful combination that can transform your health and yield dramatic weight loss in a short period of time."
full_description = '''If you are interested in losing weight quickly and dramatically improving your health, slowly reading this website will help you. You can also visit Body Cleanse for Good Health to read more about removing toxic matter from the body. Yes, they can sometimes be tasteless and gross. But it is good that we get to the details of how the body works and what it takes to keep it clean and in shape. I don't like to mince words, so I will give you the fasting info straight as I lived it, learned it and was transformed by it. The whole point of us discussing these topics in details is to assist you in launching and sticking to a fasting and cleansing program that can heal you and help you to lose weight. If you already have obtained the information you need and are here looking for an effective colon cleansing kit, I strongly recommend the https://www.fitnessthroughfasting.com/dual-action-cleanse"target="new"> Dual Action Cleanse which is the first one I ever used when I started fasting. This product is truly amazing. You can visit our Amazon Fasting Shop for more cleansing kits as well a hand-picked selection of juicers and books on fasting and colon health. You may prefer to go to The Lemonade Diet for information on how that program works and can help you in your quest for fasting and cleansing. Or, if you are ready to go, visit The Lemonade Master Cleanse Diet Store for kits and supplies related to that method of detox fasting and colonic cleansing. The process of colonic cleansing takes time but it is so very worth it. Anytime somebody would mention to me the word process, I would explode with anger and antagonism. I wanted health and weight loss to drop from the sky with minimal effort. I actually resented God for not miraculously melting the pounds of my body while I slept. Still, I could not sleep through the night without taking several trips to the kitchen and gorging on whatever was there. It was terrible. I even overate health and diet food. I just could not stop eating. I was toxic and needed withdrawal through fasting - not a mere diet.'''
