["https://www.fitnessthroughfasting.com/absolute-fasting.html"]
title = """
Absolute Fasting. Absolute or Dry Fasting - The Ultimate
Fasting Frontier"""
description = "Absolute fasting. Absolute fasting or dry fasting - when one does not eat OR drink for a period of time, can have health benefits but also be dangerous."
full_description = "How long do you think you can go without water? Absolute fasting or dry fasting is where one goes without food OR water for a period of time, usually anywhere from THREE-TO-FIVE days. It is the toughest of all the fasting disciplines and is often used to produce quick body detoxification. A dry fast has also been known to help people battle yeast infections as Candida Albicans, often referred to as Thrush. There are some who maintain that absolute fasting could cure the common cold if practiced when symptoms first emerge. I have read cases of persons who have done an absolute fast for three-to-five days and were cured of life-long allergic reactions. The premise to the healing power of dry fasting is that, since the body is not receiving food or hydration, the work of the digestive system is dramatically reduced. Therefore, it is believed, the immune system can operative with greater efficiency because of the lessened workload. While with Juice Fasting and Water Fasting the digestive system slows down considerably, a dry fast reduces body functions to even lower levels, thereby further increasing the immune system's healing ability, it is believed. More commonly - and historically -, absolute fasting is done for religious reasons as you can reference in the Christian Scriptures: Ezra 10:6, Esther 4:16, Acts 9:9, Acts 27:33. You can go to Spiritual Fasting where I talk about a few biblical descriptions of this practice. A rigid one means the person does not eat, drink or is exposed to water AT ALL- even in the form of a shower, bath, face-wash, enema or colonic. No water outside or inside... period. With a soft dry fast, the person does not drink or eat either, but IS allowed to take a shower, bath, enema or colonic. Let me give you some insight based on my personal experiece with this extreme discipline. What you are about to read are excerpts from my fasting journals. Some of the depictions you will read may be disturbing, but I am not here to paint any rosy pictures. I am here to share with you the truth about these disciplines."
year_published = 2025
