["https://www.fitnessthroughfasting.com/fastingjournal.html"]
title = "Keep a Fasting Journal. Reap Introspection and Wisdom."
description = "Keeping a Fasting Journal is a powerful tool of introspection during and after the fast. Learn to identify negative thoughts & behaviors by putting them in writing while fasting."
full_description = '''In this page we will tell you specifically how a fasting journal works and what is the best way to use it. Also, you can go to Fasting Experience to start reading a day-by-day description of a 30-day water and fruit fast I recently completed. The idea is to give you a front seat on what you can expect, the challenges and how I felt and managed to make it through. Note: When we say "Fasting Journal," we are referring to a notebook or bound journal-type book specifically purchased for the purpose of writing your fasting experiences. In this notebook, you will be writing what you are feeling physically and emotionally as you progress through the fast. I followed a very specific format that I believe you also may find beneficial. By the way, I have three journals totaling at least 200 pages of fasting experiences. I cherish them all and am grateful for every time I forced myself to write in them. Often I find myself going through these fasting journals and finding pearls of introspection and wisdom about what makes me tic. Reading them has helped me many times to identify negative belief systems that attempt to curtail my life quality and lead me back to destructive behaviors and eating patterns. I highly recommend journaling to everyone, whether or not you are fasting. This is my motto: A life worth living is a life worth recording. Don't you think? Oh, and I can tell you one thing: When your body and mind are pressured with fasting, what comes out while journaling tends to be very hard-hitting and intense. You definitely will want to read what you wrote later. I guarantee that in retrospect you will be amazed at some of the things you will put on paper. Sometimes it is necessary to squeeze the soul to cleanse ourselves of the emotional baggage and darkness that likes to hides in the innermost depths of our minds. Fasting can take you there. And keeping a fasting journal will be like the sights and sounds of your trip to the very center of your existence. It is very important that you pick a journal that stands out. This is going to be a life-transforming book. It should tell you that when you look at it.'''
year_published = 2025
