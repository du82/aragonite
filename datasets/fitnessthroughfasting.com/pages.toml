full_description = "I have just completed a 36 day water fast.One day for each year on Earth.The transformation both physically and mentally is quite amazing. I have a clarity of thought I have not previously known.Breaking the fast was a real concern for me as I have read how difficult a time it can be. But I find the determination to not jeopordize how good I feel sufficient to get me through it.I find the amazing taste of the raw foods I am eating enough to sustain me anyway.The fast itself was physically easier than I though it would be, but the psychological hunger plagued me until near the end.I continued to go to work, telling people I was jucing and going to gym to explain the rapid weight loss.Stress was occasionally a problem but nothing that tempted me to sway.My total weight loss was 60 pounds.This is without a doubt the best thing I have ever done for myself.I can actually 'hear' my body respond to what goes in to it. Giving me 'thumbs up' or 'thumbs down'Awesome!!!"
