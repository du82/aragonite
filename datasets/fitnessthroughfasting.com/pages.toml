["https://www.fitnessthroughfasting.com/fasting-testimonies.html"]
title = "Fasting Testimonies - Fasting Testimonies for Motivation and Support"
description = "Fasting Testimonies - Fasting Testimonies & Fasting Forum Pages for fasting detox support & weight loss motivation."
full_description = "This Fasting Testimonies page is designed to become a collection of community articles to encourage and motivate persons starting or in the middle of their fasting for weight loss and detoxification efforts. One of the most powerful forms of motivation available while fasting is reading a good collection of testimonies. That is what this page is all about.There will be many times in which the hunger pains or fasting withdrawal symptoms will become uncomfortable to the point that you will want to give up.But IT IS possible to hang on and make it to the other side! Inspirational fasting success and healing stories - in my experience - can intercept this discomfort and provide the courage and resolve needed to press on during those very difficult moments that ensue. Such was the case with me.So if you have water or juice fasting stories, we encourage you to take some time and write it here so that others can benefit from what you have accomplished.Also, we are very interested in testimonies of persons that have found physical healing through fasting. There have been many documented cases of cancer, diabetes and many other diseases being wiped out through fasting.I personally have struggled with a liver condition for many years. Although it has not been completely eradicated -- yet! : )-- its progression has slowed down drastically.For a specific discussion of fasting and physical healing, read our Water Fasting series. This page allows you to create your own page here at Fitness Through Fasting and even upload a picture - so in essence you are collaborating in writing and expanding our website to support and motivate those who are either undecided or struggling. To get started, I have written my personal experience. We also have been privileged with fasting expert and colleague Tom Coghill's story.I am sure you will find these experiences very encouraging. So whether your story is related to juice or water fasting, this fasting testimonies page is designed to create a powerhouse section of inspiration, experience, strength and hope for us all.If you run into any trouble or have any questions, go to the Contact page on the navigation bar to the left. One thing: Please DO NOT write posts here asking for fasting buddies. That is NOT what this forum is about. If you are looking for a fasting buddy, please register for free at the Fasting Forum and join the multiple fasting discussions. This page is for people that have fasted successfully and want to write about how they did it, what the challenges were and what helped them to stay on course. With any luck, we can compile some very powerful material that can change (and even save) lives. Thank you so much for visiting us, and may all your dreams always come true! Return from Fasting Testimonies to Fitness Through Fasting HOME."
