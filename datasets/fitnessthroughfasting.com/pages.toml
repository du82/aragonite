  cleansing and quick weight loss, or you can use it to prepare the body for fasting for weight loss
  and detoxification."""
full_description = '''This page includes an excerpt from my book Detoxify Your Body, Lose Weight, Get Healthy & Transform Your Life - Volumes 1-3. When I talk about a cleansing diet, I am referring to a calorie restriction menu that will help the body purge itself of toxins in the bloodstream and digestive system. This regimen can also help to initiatet weight loss, approximately two-to-four pounds daily. In this page, my discussion will focus on using the diet in preparation for fasting for weight loss and detoxification. The removal of these toxic foods will send your body into ultimate detoxification mode, and it will work hard on your behalf to eliminate the filth that keeps you from experiencing optimal health and wellness. Of course, usual offenders that must be eliminated in this cleansing diet are sugars, starches (enriched flour) and saturated fats. These include but are not limited to pastries, candy, white rice, white bread, soda pops, butter, frying oil, cheeseburgers, pizza, etc Stay away from then for 7-14 days before you start fasting. If you are going to use this cleansing diet without fasting, you can follow it for as long as necessary; 30 days is average, although I have heard of people who stay on it for several months for continued weight loss and ultimate body detox cleansing. I have come to realize that the foods we eat all have sodium, and that a healthy adult really has no need for 'salt' except to make the food taste better. In addition, when I stopped using salt, I immediately dropped like 15 pounds. It was mostly water weight, but it showed me that I was retaining a LOT of liquids, and that was greatly due to my abuse of salt and seasonings. I don't kid myself by thinking that "I'm cured." I still am susceptible to sugar and to binging. What keeps me free and clean is NOT to put sugar into my body... period. I can't draw the same conclusion for you, but I am certain that you probably have your own stories to tell about sugar and how it has affected your weight, life and health.'''
