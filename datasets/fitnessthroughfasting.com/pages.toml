description = "Green Tea Weight Loss: Green Tea Weight Loss energy-producing properties reduce hunger while juice fasting, water fasting and/or dieting to help you lose weight quick, achieve detoxification and improve your health, vitality .. wellbeing."
full_description = "Greetings and welcome to the Green Tea Weight Loss Page. Here we discuss green tea weight loss characteristics as they pertain to fasting and overall health, diet and fitness efforts. You will find how green tea can help you lose weight while you fast by giving you energy and reducing those ever-looming hunger pains and detox symptoms. With fasting, it's all about hanging on and going the distance. Green tea has helped me to complete water and juice fasts that I am certain would have otherwise ended prematurely. Fasting is very much like a military offensive. During the initial detoxification phase - which lasts anywhere from 9-to-11 days (depending on your level of toxicity), the mind and body can take the form of the enemy. Their objective is plain and simple: forcing one to break the fast. I have learned through much trial and error that it is crucial to be prepared. For a more in-depth discussion on the various methods that can help you deal with hunger, visit the water fasting tips page when you have a chance. I learned that drinking pure oolong tea or green tea extract - a more concentrated form of oolong tea - could give me more energy. It also could help accelerate fat burning or oxidation and consequently, facilitate weight loss. I was amazed, yet still skeptical. By the way, green tea contains a powerful antioxidant called Epigallocatechin (EGCG) which helps the body repair itself at the cellular level. I can tell you from first-hand experience that green tea, while not a fix-all, DID help to expedite loss of weight. It was not shockingly dramatic but it did help. It made the weight loss consistent and noticeable. I had fasted before without using green tea and noticed a positive difference. Drinking green tea also DID pep me up and allow me to stay functional. I was convinced. Green tea weight loss and energy-boosting properties were real. Micronutrient research by the Linus Pauling Institute at Oregon State University has looked closely at green tea and its effect in humans. According to the institute, green tea weight loss occurs because the body appears to use more energy after the tea is ingested due to the herb's inherent fat oxidation and body heating properties. The tea leaf contains large quantities of phytochemical polyphenols called flavonols, commonly known as catchetins."
