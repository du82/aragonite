["http://help@fiveable.me/post/fiveable-acquires-hours-to-bring-virtual-study-rooms-to-students"]
title = "Fiveable acquires Hours to bring virtual study rooms to students | Fiveable"
description = "Fiveable has acquired Hours—the #1 virtual studying platform for students."
full_description = '''The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Today, we are excited to announce that Fiveable has acquired Hours—the #1 virtual studying platform for students—and we're thrilled to welcome Founder Calix Huang to the Fiveable team as the Product Manager for Hours. Calix is a 16 year old high school student from the Bay Area that launched Hours post-pandemic to increase student productivity at home through virtual study rooms. At Fiveable, we deeply value student leadership and are thrilled for Calix to join the team. "I absolutely love Fiveable's team dynamic and mission. As a student myself, working with students to build something for students just seems like the most perfect and fun way to grow Hours into a massive platform. Up until this point, it's been a one-man show, and I'm happy to finally have a team dedicated to building Hours!" - Calix Huang, Founder of Hours In the coming weeks, Calix will post more about his journey, why he is excited to partner with Fiveable, and what it's like to experience an acquisition at 16 years old. But first, we want to officially introduce the Hours platform to the Fiveable community so that students can form AP study groups starting today. Fiveable and Hours have a shared belief that studying together is better than studying alone because group dynamics increase accountability and motivation. We're excited to build the future of social learning at Fiveable, in collaboration with Calix and his team. And he's excited to join us! Students around the world are often learning the same thing at the same time. They might be taking the same exams, preparing for shared deadlines, or studying the same curriculums. But there's no easy way for them to find and help each other. Edtech tools of the last two decades focused heavily on 1:1 tutoring and single-player content. These tools miss the opportunity to create community-focused experiences and mostly benefit students with resources.'''
