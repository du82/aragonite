["http://help@fiveable.me/post/serena-williams-backs-fiveable"]
title = "Serena Williams backs Fiveable as we hit new milestone of 600k students a month | Fiveable"
description = "We're so excited to welcome Serena Ventures and Swell Partners to the Fiveable fam."
full_description = '''The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day We've been talking about our broken education system for decades, but the system is not actually broken. It's working as intended. We're just fed up. Institutions like College Board hold a lot of power over students and actively preserve inequities. AP is a symbol of this power with their pre-reqs, tracking, colonized curriculum, and costly exams at $95 a pop. That's why we have centered APs at Fiveable. It's not about test-prep, it's about educational justice through online communities. We've seen the power of digital mass movements in politics and stock markets. Education is next. It's been budding for decades with teacher Facebook groups and student subreddits. Online communities share resources, motivate each other, and can overcome institutional barriers. Fiveable is the next generation of social learning, where we are building a high school community that will fight for each other. Today, we're excited to announce additional investors that will help us build this vision including Serena Williams ala Serena Ventures and Swell Partners. "What impresses us most about Fiveable is how well they understand and are immersed in today’s students; that’s what initially piqued our interest. The way they’ve brought students in to help guide their roadmap is unlike anything I’ve seen,” said Serena Williams, founder of Serena Ventures. “Based on their growth in users and engagement, it’s evident that their social learning community has cracked the code on peer-to-peer learning.” Our approach to social learning is to meet students right where they are — and this has led to more than half a million AP students studying with us in just the last 30 days. 👀 We've created open-sourced study guides for every unit in all 38 AP subjects. These were written and edited by students and teachers to be shared with everyone.'''
year_published = 2020
