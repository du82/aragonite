me cases where we need to provide you with additional information about how we use your Personal Information and/or what options you have regarding our use of your Personal Information. We may provide this additional information via notices on our Sites or via direct communications with you. If we do this, unless we tell you otherwise, the additional information will apply in addition to what is described in this Policy."
