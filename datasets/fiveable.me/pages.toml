["http://help@fiveable.me/post/why-tan-making-the-forbes-30-under-30-is-a-testament-to-fiveables-community"]
title = "Why Tán Making the Forbes 30 Under 30 is a Testament to Fiveable’s Community | Fiveable"
description = '"Honored doesn’t even begin to describe how it feels to be on the Forbes 30 Under 30 list."'
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day One of the reasons Fiveable is able to grow and support young people in meaningful ways is because of the incredible community of supporters we’ve built along the way. We have so many people who will go to bat for us—starting of course with students but also encompassing investors, advisors, colleagues, and many more. It’s been almost four years since our founding and I continue to be blown away by this incredible team of advocates. Not only do they believe in us as leaders, but they believe in Fiveable’s understanding of community and its ability to create a more equitable future for students. And it’s that deep, ‘feel-in-your-gut’ belief in something that has led us to so many exciting milestones, including Tán’s recent inclusion in the prestigious Forbes 30 Under 30 list! The list highlights innovators and their ideas who are “bringing access and opportunity to the classroom and beyond.” That couldn’t be more fitting for Tán, who’s been advocating for students, particularly those from underrepresented communities, since day one. “If you told me ten years ago—or even two years ago—that my picture would be in Forbes magazine, I would have told you you’re crazy. Honored doesn’t even begin to describe how it feels to be on the Forbes 30 Under 30 list,” said Tán. “Growing up as a first generation Asian American in a low-income household, the expectation in my family was always that you had to work hard to get ahead…but when it came to education, I saw a system that wasn’t designed for me, and the effects of that. It’s that perspective that made building Fiveable a no-brainer.” You may know that Tán and I met on Reddit just four years ago and that he was employee #1. Upon hearing my idea for Fiveable—yet to be a fully crafted company vision or even product roadmap—he moved across state lines, started working (essentially for free) and became my strongest, most trusted ally. A fire within him ignited and he has been head down researching, building, and advocating ever since."
year_published = 2022
