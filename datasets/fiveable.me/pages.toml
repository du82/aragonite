["http://help@fiveable.me/about/who-we-are"]
title = "Meet The Team  | Fiveable"
description = "Fiveable’s team is a quirky, passionate, and nerdy group of folx who love building products for students. We work remote and have big plans for the future of edtech!"
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day At Fiveable, we believe that a student is more than their grades and test scores. We do not measure success by how many 5s our students score on AP exams. This ethos started with our founder, Amanda, a former AP teacher, who believes that students deserve to thrive, no matter where they come from or the resources available to them. We think that instilling confidence in a student to continue taking academic risks is the true measure of success.Exams can be defining moments in a student’s educational journey and our goal is to make sure every student is confident in themself and their capabilities, in and out of the classroom. We center the student experience in everything we do, from hiring student content creators to developing approachable study resources that students will actually use. We will put students first, always. Above all else, our goal is to learn on behalf of our students so they can thrive. Our work is structured to encourage experimentation, innovation and reflection. We are not afraid to take risks and we see failure as a learning opportunity. Some of the best ideas came out of being challenged because the first experiment didn’t work. We learn. Then we learn some more. And when we’re done with that, we take a moment to breathe, and then get back to learning. At Fiveable, we believe that taking care of our people is central to running a successful company. We’re a small but mighty crew of passionate, quirky, and curious people scattered around the country who want to make education more accessible and equitable to all. Some of the perks we offer to staff are full medical, dental, and vision coverage, unlimited paid time off, work from home and professional development stipends, and wellness days, to name just a few. We also host company retreats at least two times a year to build community in person.We are dedicated to creating an environment where our employees feel valued, supported, and inspired to reach their full potential. Because we can only do our best work if we’re taking care of each other and ourselves.Check out our News page for more information on how we are learning and growing as a company!"
