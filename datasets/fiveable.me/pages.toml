t then whitewashing the curriculum anyway. In 2014, they published a new AP US History framework that had students seriously contending with the consequences of American white supremacy and imperialism. It was a much-needed, stark analysis of historical violence on marginalized communities. And when the conservatives squirmed, the College Board took a huge step back to create a vague, whitewashed framework that omitted the words “racist and xenophobia”."
