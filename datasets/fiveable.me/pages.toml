["https://fiveable.me/post/series-a-funding"]
title = "Fiveable Secures $10m in Series A Funding to Support High School Students Beyond APs | Fiveable"
full_description = '''The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Students are stuck in an inequitable school system while the world is literally on fire. But students are not waiting for systemic change. Instead, they have built up massive online communities through an underworld of the "study web" where students from around the world help each other, despite the failing systems around them. Fiveable is the social learning platform that connects students who are learning the same thing at the same time. Our mission is to create spaces that give students more access and confidence to explore their futures together. The more opportunities we give for students to connect, the more empowered they will be to change the systemic problems in our education system. Through student-generated content and accountability spaces on Hours, Fiveable is where students build their futures together. First, we built a social learning community for AP students and over 7M students studied with us. Now, it's time to expand way beyond AP. We're thrilled to announce that we've closed a $10M Series A to expand our social learning platform to all 18m high school students. The round was led by Union Square Ventures, who have deep experience in education and social platforms from their early investments in Quizlet, Duolingo, and Outschool. Rebecca Kaden will be joining our Board of Directors. This round was also in partnership with Owl Ventures, a long time leader in edtech, and Progression Fund, founded by TikTok alumni. They join our impressive list of early investors including BBG Ventures , Metrodora Ventures (Chelsea Clinton), Serena Ventures, Matchstick Ventures, Spero Ventures, Twenty Seven Ventures, Cream City Ventures, Deborah Quazzo, Darrell Silver, Del Johnson, and many more amazing folks.'''
