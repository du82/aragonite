title = "Fiveable partners with Forage to provide career exploration support to students | Fiveable"
description = "Fiveable is pleased to announce our partnership with Forage to give students access to college and career readiness resources."
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Fiveable is pleased to announce our partnership with Forage to give students access to college and career readiness resources. Fiveable is pleased to announce our partnership with Forage to give students access to resources that provide support around college and career readiness. Forage is a virtual work experience platform that gives students the opportunity to learn career skills through 70+ programs in diverse industries and roles from Fortune 500 companies like Electronic Arts, Citi, and JP Morgan. Through their free programs, students are able to discover the right career and company for them, build practical skills, and learn how to land jobs. Forage registrants, encompassing more than one million students, are 2x more likely to land a job at a partner company after completing company’s virtual experience program. At Fiveable we recognize the stress that students face with college and career readiness in our community. Our vision is to build the best community where students come to learn together. As part of building this community, creating strategic partnerships with organizations that align with our vision is an optimal way to meet our student's needs and provide them with additional resources. Forage is one of these partners and through this partnership, students at Fiveable will have free access to curated content by Forage focused on college and career readiness. Forage is also a trusted partner in the Fiveable College Program and will lead live events related to alternatives to college and how to gain work experience beyond internships. Please visit theforage.com to learn more about their free virtual work experiences and send us an email at hi@fiveable.me if you are interested in learning more about this partnership."
