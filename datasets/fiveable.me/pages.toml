["https://fiveable.me/post/fiveable-joins-tspa"]
title = "Fiveable Joins the Trust and Safety Professional Association | Fiveable"
description = "Fiveable has officially joined the Trust and Safety Professional Association (TSPA), alongside leaders like Google and Airbnb."
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Fiveable has officially joined the Trust and Safety Professional Association (TSPA), alongside leaders like Google and Airbnb. Fiveable has officially joined the Trust and Safety Professional Association (TSPA), alongside leaders like Google, Airbnb, Pinterest, Slack and Postmates. As an Omidyar Grant Participant, TSPA has recognized and applauded our work to equalize access to opportunities and improve human interactions online. Many of Fiveable’s core values lean heavily on accessibility and safety for our students, which is why we are committed to breaking down barriers. In our increasingly digital world, it’s essential that tech companies create an open environment where everyone’s rights are respected. We believe that every single person and company in technology should prioritize trust and safety. Since Fiveable’s inception, we have served more than 8 million students -- and we continue to grow every day! Students have believed in us which is why we owe it to them to ensure we’re doing everything we possibly can to create a safe and trusted environment for them. Because our community has become so much more than just a space to chat about AP exams, with conversations spanning identity, religion, mental health and more, it’s our responsibility to set community rules that align with Fiveable’s values. As a member of TSPA, we will have the opportunity to work alongside some of the biggest companies in trust and safety to build out our own strategy. Learning from top leaders in the industry will allow us to utilize existing insights and experiences to inform our strategies. As an Omidiyar Grant Participant, we will also receive consulting from experts as well as career and professional development support for our employees."
