["http://help@fiveable.me/post/fiveable-partners-with-joon-care-to-provide-mental-health-support-for-students"]
title = "Fiveable partners with Joon Care to provide mental health support for students | Fiveable"
description = "We're here to help destigmatize conversations around mental health for young people, especially those in high school."
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day We're here to help destigmatize conversations around mental health for young people, especially those in high school. Fiveable is happy to announce our new partnership with Joon Care. We recognize the mental health burden high school students face is very high and that most lifetime mental health conditions emerge between ages 13 and 24. At Fiveable we want to help students find their own success both inside and outside of the classroom, and this is the best time to teach these life-long mental health skills. We partnered with Joon to provide high-quality information to our community, make mental health knowledge accessible, and show our students that they are not alone. Our first article in collaboration with Joon, explores the intense stress students feel and ways to cope when we are overwhelmed. Joon Care is the world's first teletherapy platform designed exclusively for teens and young adults ages 13-24. Joon delivers a new model for mental health care that integrates the benefits of live one-on-one therapy sessions with a mobile app-based experience. Joon's clinical team uses an evidence-based, skills-focused approach that is personalized for each individual client."
