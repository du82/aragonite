["https://fiveable.me/post/fiveable-backed-by-top-tier-seed-investors-to-reimagine-social-learning-for-high-school-students"]
title = "Fiveable backed by top-tier seed investors to reimagine social learning for high school students | Fiveable"
description = "Today, we announced our latest round of funding of $2.3 million led by BBG Ventures."
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Today, we announced our latest round of funding of $2.3 million led by BBG Ventures with participation from new investors including Metrodora Ventures (Chelsea Clinton's fund), Matchstick Ventures, Spero Ventures, and prominent edtech angel Deborah Quazzo. The round also included follow-on investments from Cream City Ventures, 27V, Golden Angels, and SoGal. This is a big moment for Fiveable and we're so excited to work with investors who share our student-first vision for social learning. But more importantly, we are a team of 15 passionate, creative innovators who are ready to build the future students deserve. It's been a truly WILD year for, well, everyone. Back in early 2018, when Fiveable was a one-woman show, I never could have imagined the world I was actually building for. I've spent the last decade in education and like any young teacher, dreamed of innovation within my bureaucratic school district. I fought hard for access to technology, equitable policies, and new apps that would engage my students.But one of the hallmarks of burnout is to be so passionate about something that you are unable to change.I had full reign of my classroom and the luxury to innovate, but I couldn't seem to scale my success across the district or even the school. Now it feels like I was a teacher in a different era.As COVID hit in March, every school had to be innovative. Long-standing policies melted away, teachers adopted tech, and for the first time, remote learning was the norm. Just weeks before schools closed, the Fiveable team had announced our pre-seed funding as well as a student-first approach to growth. We sailed into 2020 with a roadmap to bring more content to more students.But in the last 7 months, everything about the education space has changed and we have found ourselves in the middle of a massive shift in education."
