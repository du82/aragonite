["https://fiveable.me/cram-mode"]
title = "Cram Mode"
description = "Unlock access to 100k+ study guides to ace whatever test you’ve got on deck (no matter how soon it is)."
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day Yaaaaa! We’re fully expanded now with study guides aligned to virtually every high school and college class. If you don’t see your classes listed, email us to request one! Cram Mode is the paid version of Fiveable that unlocks every single one of our study guides and practice questions for all classes. The free version of Fiveable is limited to 1 study guide and 1 practice question set per day. You’ll hit paywalls after that unless you sign up for cram mode which gives you 100% access to everything. Your Cram Mode subscription is active until you no longer need it! There are two options for how to sign up: a yearly subscription (renewed each year on the same date of purchase) or a monthly subscription (renewed each month on the same date of purchase). When you sign up for Cram Mode, you will receive a confirmation email from Fiveable. You can also see whether or not your Cram Mode is active in your Dashboard. We recommend that you use your student’s email address that they use for library.fiveable.me to sign up for Cram Mode so that the subscription is already linked to their account. If you use your email address to purchase, simply reply to the confirmation email with your student’s email address, and we can transfer to the account to your student. We understand that not everyone can afford to purchase Cram Mode. If you need financial assistance in order to participate, please fill out this form and we will be in touch."
