["https://fiveable.me/post/ap-african-american-studies-op-ed-florida-desantis"]
title = "The College Board can protect AP African American Studies for Florida students, but will they? | Fiveable"
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day I’m not surprised by Governor Ron DeSantis’ political stunt to reject Advanced Placement (AP) African American Studies in Florida. White supremacists will always try to limit access to information because empowered groups of people will upend oppressive systems. He downplayed the significance of the course saying it “lacks educational value” but he knows this is not true. In fact, it’s exactly the opposite. The course is so valuable that it could jeopardize his power. There is only one option to fight such blatant racism: The College Board, the creators and administrators of AP exams, should make the AP African American Studies course available online, for every student and teacher to access. Although the Florida Department of Education is the one picking this fight, I’m turning my attention to the College Board because it is their responsibility to protect the content. It is inexcusable for them to kowtow to conservative leaders who do not value educational justice. If the College Board edits the course to remove “intersectionality” and “Black Queer studies”, they will be complicit in the continued erasure and violence against these communities. Up until now, the College Board has deemed Black history as less important than white history, based on what content is worthy of assessment on the AP Exams. The greatest power the College Board has is deciding what is on the test. As much as we cringe at exam-centered curriculums, the test ultimately tells students what is worth learning. Textbooks and even non-AP curriculums are then influenced by those decisions. When it comes to creating inclusive frameworks, the College Board has a history of almost doing the right thing, but then whitewashing the curriculum anyway. In 2014, they published a new AP US History framework that had students seriously contending with the consequences of American white supremacy and imperialism. It was a much-needed, stark analysis of historical violence on marginalized communities. And when the conservatives squirmed, the College Board took a huge step back to create a vague, whitewashed framework that omitted the words “racist and xenophobia”."
