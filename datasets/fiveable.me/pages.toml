["http://help@fiveable.me/about/privacy-policy"]
title = "Privacy Policy"
full_description = "The most epic AP cram experience‍15 hours of live review with AP experts in the 5 nights before your exam📕 Night 1: All the Content! Part 1📘 Night 2: All the Content! Part 2📝 Night 3: Skills & Drills, Part 1✍🏽 Night 4: Skills & Drills, Part 2🧁 Night 5: The Grand Finale📌 Exam Day At Fiveable Inc., we understand and respect your concerns about the use of your personal information. We're committed to complying with the student data privacy laws that apply to your use of our platform and helping our customers comply with FERPA. Welcome to Fiveable (“Fiveable” or “we,” “us,” or “our”)! We are committed to privacy and will only use your personal information in accordance with the terms of this Privacy Policy (“Policy”). This Policy describes how we collect, use, protect, and disclose Personal Information received from your use of the websites owned and operated by us or our affiliates, including, but not limited to, https://fiveable.me, and the features, functionalities, applications, browser extensions, and other services available through our websites (collectively, the “Sites”) and through our interactions with you outside of our Sites, when you apply for a job with us, and otherwise through our business operations (collectively, with the Sites, our “Operations”). When we refer to “Personal Information” in this Policy, we mean information that identifies, relates to, describes, or is reasonably capable of being associated with, or could reasonably be linked, directly or indirectly, to a particular individual. Please note, as used in this Policy, Personal Information does not include information that has been de-identified or aggregated in a way that can not be used to identify a specific individual. You can access and interact with our Operations in many ways, including from a computer or mobile device. This Policy applies regardless of how you access or interact with our Operations. Depending on how you interact with our Operations, there may be some cases where we need to provide you with additional information about how we use your Personal Information and/or what options you have regarding our use of your Personal Information. We may provide this additional information via notices on our Sites or via direct communications with you. If we do this, unless we tell you otherwise, the additional information will apply in addition to what is described in this Policy."
