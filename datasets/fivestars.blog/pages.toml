title = "How To Adopt Dark Mode In Your iOS App 🌙 | FIVE STARS"
description = "Exploring iOS, SwiftUI & much more."
full_description = '''How To Adopt Dark Mode In Your iOS App 🌙 iOS UIKit June 11, 2019 Federico Zanetello @zntfdr My metro app, both in dark and light mode.This article is also available in Japanese 🇯🇵.Rejoice! iOS 13 comes with Dark Mode! 🤩I've just finished adopting the new appearance in my own apps, and I've learned a few things along the way: let’s see how you can do it, too!Two Steps Back FirstBefore diving in, we need to be aware of a few things:In order to give our users the best experience, it is really important that you don’t skip this part. Ready? Let’s go!RequirementsFor your app to support Dark Mode, it must: 1. Have been built and released with Xcode 11 If you use Xcode 10 (or earlier), the app will always display its normal appearance, even on devices with Dark Mode enabled. 2. Run on an iOS 13 device Only devices running iOS 13 (or later) support Dark Mode, previous versions of iOS will resort to the default appearance. You cannot enforce Dark Mode on an older iOS over the default appearance (actually, you can, however it involves creating a lot of custom logic to do so, it’s not worth it).⚠️ Here's another way to look at it: if your app has not been updated with Dark Mode support by the time iOS 13 launches, the app will always display its default appearance, regardless of the iOS system settings. If your users have enabled Dark Mode and your app doesn’t support it yet, your app will flash your users with that bright default interface! 🙈Using Apple words: “You really don't want to be that one light appearance that's stuck in dark appearance”.Your App Supports Dark Mode AlreadyThis is both the cool and scary part:Once the (two!) requirements above have been fulfilled, whenever Dark Mode is enabled, your UI will automatically switch appearance.This is awesome, because it means that we get a lot of work done for free:however, if we don’t make sure that our app looks good in dark mode, some of our UI will certainly look weird, probably with bright shiny colors, even in this new appearance. This would be a really bad experience for your users, read on to avoid this.You Can Force One Appearance Over The OtherIf you really wish to avoid adopting dark mode in your app, drop the “light mode” indefinitely in favor of dark mode, or simply postpone your dark mode adoption to another time, add a new key UIUserInterfaceStyle in your app info.plist and set its value to Light or Dark.Another way to do so would be to keep shipping your app with Xcode 10 😆Don’t Force One Appearance Over The OtherUsing Apple words: “Only a small subset of apps really should be dark all the time, and those are media-centric or content-creation apps“. Unless you have a very good reason to offer just one interface appearance, make sure to always respect the system preference. It doesn’t matter how much you prefer one over the other.Apple allows you to have an in-app setting where the user can choose which mode to use in your app, regardless of the system preference: again, unless your app has a very good reason to do so, the best experience is to respect the system mode. Don’t offer unnecessary, redundant settings.Dark Mode Is Not The Only New ModeThis might have not hit the press as much as Dark Mode, however iOS has always had two modes: default and high contrast (you can enable this in any iOS device by going to Settings > Accessibility > Increase Contrast, tap also on General if you're still running iOS 12).Left: iMessage in high contrast. Right: iMessage in the default appearance.While you might be able to read with ease both left and right images, for someone else having some help (read: high contrast) would be great, for others it is the only way possible to read anything at all.Now that we are aware of this, it’s clear that we have to take care of four appearances:DefaultDefault High ContrastDark ModeDark Mode High ContrastThis is another reason why it is really important to stick with default UIKit (or SwiftUI) elements as much as possible: - if we do so, we get support for all of these appearances for free. - If we create our own colors and UI components, we must take care of each mode, element, and element state ourselves. This work grows exponentially.Let’s Get Started!If you’ve made it so far, congratulations! 🎉 From now on we will talk about what you can do, right now, to support the new interface appearances.Step 1: ColorsAt the end of the day, all our app do is throwing colors at the screen: getting colors right means having your app 99% ready for Dark Mode.(Dynamic) System ColorsUntil iOS 12, UIColor has offered us a few simple colors like .red, .yellow etcetera: you don’t want to use these colors any longer. These colors are static, which means that their tint never changes.With iOS 13 and Xcode 11, Apple is introducing System Colors:Top: System Colors in the default interface. Bottom: System Colors in dark mode.Xcode Playground here.From left to right: .systemBlue, .systemGray, .systemGreen, .systemIndigo, .systemOrange, .systemPink, .systemPurple, .systemRed, .systemTeal, .systemYellow.As you can see from the picture above, contrary to the old static colors, system colors are dynamic: their tint will adapt to the current system interface.But those are not the only new colors! We also have a full range of grayscale colors, where the differente between dark and light appearance is even more obvious:Top: System Colors Grayscale in the default interface. Bottom: System Colors Grayscale in dark mode.Xcode Playground here.From left to right: .systemGray, .systemGray2, .systemGray3, .systemGray4, .systemGray5, .systemGray6.All dynamic system colors also come with a special tint for high contrast. #a11yBy using these dynamic colors (e.g. UIColor.systemBlue instead of UIColor.blue), your interface will automatically pick the right tint for the current system preference, no further work required! 🎉(Dynamic) Semantic ColorsXcode 10 and earlier offered two colors named .lightText and .darkText.The use of these is now discuraged, as they're static, and will not adapt to any interface. Instead, from Xcode 11 we a full new suite of semantic colors such as UIColor.label, UIColor.placeholderText, UIColor.systemBackground etc.Instead of describing a shade, these colors names are based on their intended usage: most of the time you want to use these, as, like system colors, they’re dynamic.Most importantly, semantic colors ensure that your app has a similar appearance to the rest of the system. By using these, your app will feel native, which is always the best experience for the user.The more you use these dynamic colors, the faster you’ll properly adapt to Dark Mode.Still supporting iOS 12 and earlier? Worry not: fellow developer Noah Gilmore shows you how to use the new colors while also maintaining backward compability in his brand new article "Backwards compatibility for iOS 13 system colors" 💯.(Dynamic) Custom Colors: The Assets CatalogThis should always be your very last option to look at.This is the only option that requires a lot of work, trial, and error, for both you and the design team:let Apple do the work for you, they’ve invested an unbelievable amount of time from their super talented teams on this, trust and use their work, your app will be fine.With the disclaimer out of the way, how do you define and use your own dynamic colors?Since iOS 11 and Xcode 9 we can add colors into assets catalogs.Now you can also define a dark variant for each color in there as well:to do so, select a color in your assets catalog, open the Attribute Inspector (shortcut: ⌘⌥4), and set its appearance from None to Any, Dark:Our own dynamic color!At this point a new color box for the Dark appearance will appear: congratulations! You have just created your first dynamic color! Set each variant to its appropriate tint and you're good to go.Don't forget to enable high contrast as well:Four variants for the same color 😅Again, I strongly suggest to use System and Semantic Colors as much as possible: in case of a button for example, using custom colors means defining one color for each button state: .normal, .highlighted, .focused, .selected, and .disabled.This means requiring a different color for each state, for each appearance. If you do the math, one button now requires (5 states * 4 appearances =) 20, t-w-e-n-t-y, different tints! 😱A heads-up in case you still want to go this route:for pressed button colors, using a darkened version of the default color doesn’t work any longer, as the effect is correct for light interfaces, however dark interfaces require a lighter color instead. 👍🏻(Dynamic) Custom Colors In Code 🙈If you’re still targeting iOS 10 (which doesn’t support colors declarations in the asset catalog) or don’t want or can’t use the options above, then the very last option available is to define colors in code:let dynamicColor = UIColor { (traitCollection: UITraitCollection) -> UIColor in switch traitCollection.userInterfaceStyle { case .unspecified, .light: return .white case .dark: return .black } } Don’t do this, drop iOS 10 and use assets catalogs.### Step 2: ImagesAlmost every app displays images and/or symbols in the UI. Unless those images display user content (like a profile picture), then it’s very good design to have one image variant for each mode. Let’s see how.SF SymbolsApple introduced SF Symbols at WWDC19. SF Symbols is a huge collection of glyphs (over 1500!) that are available for developers to use in their own apps.Apple itself uses SF Symbols in every stock app like Reminders, News, Maps and more:Some examples of iOS stock apps using SF SymbolsSome of the SF Symbols used in the screenshots above: can you spot them?Not only Apple uses them, but it also encurage us to do so, too. In Apple Words:"The system uses SF Symbols, which automatically look great in Dark Mode, and full-color images that are optimized for both light and dark appearances. Use SF Symbols wherever possible."To recap, SF Symbols are a bunch of glyphs ready to be used in our apps:wherever there's a glyph in your UI, see if you can replace it with one of these 1500+ glyphs that we get for free. Beside being vector images, which look perfect at any size, they also come built-in with the system: no need to package them up in our app! Yay for smaller app sizes!If you're using storyboards, you can tell Xcode which symbol to use by typing the correct glyph name in the image name field (find the name in Apple's SF Symbols app available in Apple SF Symbols guideline).Note how the Attribute Inspector confirms that we're using a system symbol with the "System" calloutAlternatively, you can fetch any of them by using the new api UIImage(systemName:):UIImage(systemName: "star.fill") Cannot find something that you fancy? You can always export any of the available glyphs (as .svg) from the official SF Symbols app and change them to perfectly meet your needs 👍🏻For more information about SF Symbols, watch the WWDC19 session 206: Introducing SF Symbols.If you would like to access to the whole list of symbols from anywhere, fellow developer Noah Gilmore (again!) has your back with his new website sfsymbols.com, very handy if you're on the go 😎.Since SF Symbols can be exported from the SF Symbols app, you can always package them in your app bundle: this way you can use the new symbols while still maintaining retrocompability.Custom Template Images (Glyphs)Like SF Symbols, template images are monocrome images that are defined in our Xcode assets catalog by selecting "render as" Template Image in the Attribute Inspector.By using them, you get several advantages. To name one, you gain dark mode for free.When using template images, remember to set the UIImageView tint to one of the dynamic colors described above:let glyphImage = UIImage(named: "myGlyph") let glyphImageView = UIImageView(image: glyphImage) glyphImageView.tintColor = .systemYellow Other ImagesFor all other kind of images that are not template images or symbols such as photos and more, we can follow the same steps as for custom colors: set their appearance to Any, Dark in the assets catalog and drop a new variant for each appearance.Example stolen from Apple's sample app.For more tips around images, use this Apple guide.Note that adding a dark variant to any assets in the catalog doesn't break retrocompatibility: older iOS versions will always choose the asset tagged with Any Appearance.Step 3: UIVisualEffectViews - Semantic MaterialsIn case you need a quick catch-up with what you can do with these fantastic views, here’s a very clear article by Nikola Kirev.Like for UIColors, until iOS 12 we had static UIBlurEffect.Styles (namely .dark, .light and .extraLight).Xcode 11 has revamped these styles with brand new Semantic Materials:we go from a delicate, semitransparent .systemUltraThinMaterial, to .systemThinMaterial, to .systemMaterial, until we arrive to a heavy .systemThickMaterial.You can see them all here (grab the playground under the image):Top: System Materials with vibrant label in the default interface. Bottom: System Materials with vibrant label in dark mode.Xcode Playground here.Note how the text vibrancy dynamically adapts based on both the interface appearance and the UIVisualEffectView effect it sits on: we don't need to worry about readability, because iOS takes care of it for us 💯.Step 4: Drawing Attributed TextWhen drawing attributed text, if not specified, the .foregroundColor property is set to .black:set it to a proper color instead (e.g. UIColor.label).let textToDraw = "FiveStars.blog" let attributes: [NSAttributedString.Key: AnyObject] = [.font: UIFont.preferredFont(forTextStyle: .title3), .foregroundColor: .label] textToDraw.draw(at: CGPoint.zero, withAttributes: attributes) Step 5: Dark Mode in CALayersCALayers don’t understand dynamic colors.When working with dynamic colors at this level, you can get the current UITraitCollection (which contains the active mode in .userInterfaceStyle) from the layer's view by calling view.traitCollection.Once obtained, you can resolve any dynamic color for example with:let resolvedColor = UIColor.label.resolvedColor(with: traitCollection) layer.borderColor = resolvedColor.cgColor In case where we need to resolve multiple colors, there's a UITraitCollection has a handy performAsCurrent() method that lets us do just that:let manyDynamicColors = ... traitCollection.performAsCurrent { for resolvedColor in manyDynamicColors { let resolvedCGColor = resolvedColor.cgColor ... } } Step 6: Overriding The System AppearanceSometimes it make sense for a view to stick with one appearance, regardless of the system preference.With iOS 13, UIView, UIViewController, and UIWindow have gained a new overrideUserInterfaceStyle property that lets us override the system appearance:let view = UIView() // this view will inherit the appearance of its superview let darkView = UIView() darkView.overrideUserInterfaceStyle = .dark // this view (and its subviews) will always be in dark mode overrideUserI'''
