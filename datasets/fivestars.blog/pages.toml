["https://fivestars.blog/articles/swift-5-1-collection-diffing"]
title = "Swift 5.1 Collection Diffing | FIVE STARS"
description = "Exploring iOS, SwiftUI & much more."
full_description = '''Swift 5.1 Collection Diffing Swift July 23, 2019 Federico Zanetello @zntfdr Disclaimer: this article refers to the first Swift implementation of collection diffing. The implementation itself has already been improved, however the concepts behind this article are exactly the same.Until recently, dealing with dynamic tables/collection views meant one of the following:Call reloadData() at every changeUse a dependency like IGListKit or DifferenceKitManually deal with every possible change (while praying to not miss anything 🤞🏻)Swift 5.1 introduces a new alternative: Use the new Collection’s difference(from:).Want to know about what else is new Swift 5.1? Check out my lightning talk here.Unlike other features, Swift collection diffing is entirely additive and it is completely written in Swift:this presents us an unique opportunity to learn how the collection diffing is actually implemented without digging into any other lower level language.In this article I'm going to do exactly that: at over 5000 words with a lot of technicalities and code, you might want to find a comfortable place before digging in.Ready? Let's go!CollectionDifference<ChangeElement>Before talking about the function itself, I want to focus on what it returns:an instance of CollectionDifference<ChangeElement>.CollectionDifference is a generic Collection defined as "A collection of insertions and removals that describe the difference between two ordered collection states".The generic type ChangeElement is the element type of the two collections that we are diffing, note that, if we look solely at the CollectionDifference definition, ChangeElement is completely unconstrained: it doesn’t even need to conform to Equatable!The elements of this collection are of type CollectionDifference.Change, which is a new enum with two cases: .insert and .remove. Before moving into this enum, there are a couple of points that must be disclosed about CollectionDifference:The collection returns first all the removals (all the .remove cases), and then all the insertions (all the .insert cases). This is assured by an internal initializer: even if we try to initialize this collection with changes in random order, the initialized collection will be always ordered properly.The collection insertions, deletions, and association between the two must be unique (more on this later). This is assured by an internal validator: while trying to initialize an unsorted CollectionDifference is allowed, failing this uniqueness validation will fail the collection initialization.Insertions and RemovalsIf we’re interested exclusively on the insertions or the removals of a CollectionDifference, instead of traversing the collection itself, we can use its public properties insertions and removals, which are two arrays (with elements of type CollectionDifference.Change).These arrays are actually where the elements of the main collection are stored, and accessing them directly is more performant the traversing the collection itself.CollectionDifference.ChangeWhen comparing two collections, you can think of any change between the collections elements as either:an insertion (a new element has been added)a removal (an element has been removed)or both (when an element changes position, it is removed from the current position and added to the new position).With that being said, it comes as no surprise that CollectionDifference.Change is an Enum with two cases: insert and remove.Both cases come with three associated values: an offset, an element, and an optional association.Change OffsetThe offset is the position of the change.In case of a removal, it reflects the position where the element used to be:let oldArray = ["a", "b", "c", "d"] let newArray = ["a", "b", "d"] // The element "c" at index 2 has been removed let difference = newArray.difference(from: oldArray) // difference is a one-element collection // where the element is of type `.remove` with `offset` 2 In the case of an insertion, it reflects the position of the element in the final collection:let oldArray = ["a", "b", "c", "d"] let newArray = ["a", "b", "c", "d", "e"] // A new element "e" has been added at index 4 let difference = newArray.difference(from: oldArray) // difference is a one-element collection // where the element is of type `.insert` with `offset` 4 Change ElementThis element is the whole reason why CollectionDifference is declared generic:the change element is the actual collection element that has been removed or inserted.let oldArray = ["a", "b", "c", "d"] let newArray = ["a", "b", "d", "e"] // The element "c" at index 2 has been removed // A new element "e" has been added at index 3 let difference = newArray.difference(from: oldArray) // difference is a two elements collection: // - the first element is of type `.remove` (with offset 2) with element "c" // - the second element is of type `.insert` (with offset 3) with element "e" Change AssociationAgain, when an element moves position between two collection states, the change can be considered as a deletion (from the old position) and as an insertion (to the new position).This is what the Change association is for: to link that removal and that insertion.The association, called associatedWith, is an index representing the other change offset:if we’re looking at a .insert change, the associatedWith index will be equal to the associated .remove offset index, and vice versa.As change associations add an extra cost on the diffing, they’re not computed by default:the difference(from:) result is a collection of .remove/.insert elements all with associatedWith value set to nil. If we’re also interested in this association, we need to call .inferringMoves() in our difference collection:let oldArray = ["a", "b", "d", "e", "c"] let newArray = ["a", "b", "c", "d", "e"] // the element "c" has moved from index 4 to 2 // therefore we can think it as: // - a removal from position 4 // - and an insertion at position 2 let difference = newArray.difference(from: oldArray) // difference is a two elements collection // - the first element is a `.remove` with offset 4 // and associated offset of `nil` // - the second element is an `.insert` with offset 2 // and associated offset of `nil` let differenceWithMoves = difference.inferringMoves() // differenceWithMoves is a two elements collection // - the first element is a `.remove` with offset 4 // and associated offset 2 // - the second element is an `.insert` with offset 2 // and associated offset 4 InferringMovesThis function is straightforward: it scans the whole CollectionDifference instance and adds an association when an element change matches both among the removals and the insertions, otherwise it just returns the Change unchanged.A Look Back to CollectionDifference’s RulesNow that we have a clear definition of what the Change type is, we can look back to the CollectionDifference definition and have a clearer understanding of some of its rules:Having non-unique removals would mean having multiple removals at the same index: it's impossible.Same with additions: having multiple additions at the same offset would mean having multiple elements at the same index in the final collection state.Lastly, associations must always come in pairs (an insertion linked to a removal and vice versa): there can’t be a one way association.A Second CollectionDifference OrderIf we look at the how the collection internal init is defined, we can see that CollectionDifference has a clear order that goes beyond "removals first and insertions second":all the insertions are stored in the insertions array in order from lowest to highest offset, and same goes for the deletions with the removals array.However, if we look at the CollectionDifference subscript, we can see that the collection is exposed in, again, a different order:the removals are exposed from highest to lowest offset, while the insertions from lowest to highest offset.This exposed order allows us to use the returned CollectionDifference instance to transform a collection from the old state to the new state by applying, one by one, the collection Changes:let oldArray = ["a", "b", "c", "d"] let newArray = ["x", "a", "e", "c"] var anotherArray = oldArray let difference = newArray.difference(from: oldArray) // difference is a four elements collection: // 1. `.remove` at offset 3 // 2. `.remove` at offset 1 // 3. `.insert` at offset 0 // 4. `.insert` at offset 2 for change in difference { switch change { case let .remove(offset, _, _): anotherArray.remove(at: offset) case let .insert(offset, newElement, _): anotherArray.insert(newElement, at: offset) } } // at this point `anotherArray` is equal to `newArray` anotherArray starts in the same state of oldArray and ends up like newArray by following the difference collection order:["a", "b", "c", "d"] // initial state ["a", "b", "c"] // removal at index 3 ["a", "c"] // removal at index 1 ["x", "a", "c"] // insertion at index 0 ["x", "a", "e", "c"] // insertion at index 2 If the collection was ordered in any another way, we would have obtained a different outcome (or even a crash!).ApplyingIf we need to apply the difference result to a collection, we don’t have to do it ourselves (like in the example above):Swift offers a new method, applying(_:), that does it for us.Therefore the example above could have been written entirely as:let oldArray = ["a", "b", "c", "d"] let newArray = ["x", "a", "e", "c"] var anotherArray = oldArray let difference = newArray.difference(from: oldArray) // applying the difference here 👇🏻 anotherArray = anotherArray.applying(difference)! // at this point `anotherArray` is equal to `newArray` Since this method can be called on any collection (as long the collection elements are compatible), instead of applying the difference in place, it returns a new optional collection with the difference applied.The reason why the return type is optional is clear as soon as we imagine doing a remove or an insert to an index out of range:instead of crashing, the function will return nil when the difference is applied to an incompatible collection.difference(from:)Now that we’ve covered the basics, it’s time to uncover what this method actually does, it might take you by surprise (it did to me!) but the whole implementation is a one liner:extension BidirectionalCollection where Element : Equatable { public func difference<C: BidirectionalCollection>( from other: C ) -> CollectionDifference<Element> where C.Element == Self.Element { return difference(from: other, by: ==) } } It turns out that we were using a convenience method all along!Before digging into the real difference(from:by:) method, it's important to note how it's difference(from:) that requires the elements of the collections to conform to Equatable, this requirement is nowhere to be seen in difference(from:by:) 👍🏻.difference(from:by:)So far we’ve used CollectionDifference to compute the difference in the equality of two states of a collection, however the truth is that this comparison could be used for many more use cases:in fact, the original pitch for collection diffing describes the feature as a "diffing functionality […] necessary to provide easy creation, representation, and application of ordered collection state transitions".A state transition can have different meanings based on the context, therefore it makes a lot of sense for Swift to set no limits on what this transition can be.With that being said, it should come with no surprise that the real difference function signature is: public func difference<C: BidirectionalCollection>( from other: C, by areEquivalent: (Element, C.Element) -> Bool ) -> CollectionDifference<Element> where C.Element == Self.Element Note how non-constraining this function is: all it requires is two BidirectionalCollections (two collections that can be traversed both by moving backward and/or forward) with the same associated types.The associated types don’t need to conform to any specific protocol, all it matters is that we pass a method that takes two elements of this type and returns a boolean:what this comparison method does, and what it means, is entirely up to the developer.An ExampleAs a fun example, let’s run difference(from:by:) with two identical collections and a comparison method that returns always false:let oldArray = ["a", "b", "c"] let newArray = ["a", "b", "c"] // same as `oldArray` let difference = newArray.difference(from: oldArray, by: { _, _ in false }) // `difference` is a 6 elements collection with: // - three removals // - three insertions The result is a collection with three removals and three insertions:this is because our comparison method (which, again, returns always false in this example) removes any connection between any element in either state, therefore the difference algorithm will see this transition as a complete rewrite of the array, regardless of the contents of those arrays!A Note on difference(from:by:) Return Typedifference returns a non-optional CollectionDifference.Previously I've mentioned that a CollectionDifference initialization fails when we try to initialize it with elements that do not comply to its rules. How does Swift guarantees a non-optional CollectionDifference instance?While Swift exposes only one failable initializer for CollectionDifference, it turns out that there's also a non-failable initializer:this second initializer is marked as internal, therefore it can only be used within the Swift repository, and it is not exposed when we use Swift from a toolchain in Xcode.This is because the internal initializer is used only with algorithms that have been mathematically proven to instantiate a correct CollectionDifference, therefore it is ok for Swift to return a non-optional collection.Inside difference(from:by:)The first thing that this method does is creating two collections, source and target, of internal type _CountingIndexCollection:the source reflects the old state of the original collection, while target reflects the new state of the original collection.If we call ["a","b","c"].difference(from: ["e", "f", "g"]) for example, source mirrors ["e", "f", "g"] while target mirrors ["a", "b", "c"]._CountingIndexCollection is a wrapper of the real collection, with an easy way to get the offset of its indices from its start index.let originalCollection = ["a", "b", "c", "d"] Let offsetCollection = _CountingIndexCollection(originalCollection) if let index = offsetCollection.index(of: "d") { print(index.offset) // prints "3" print(offsetCollection[index]) // prints "d" } Lastly, the method creates an instance of internal type _CollectionChanges, which takes the newly created source and target collections along with our injected comparison block.After the _CollectionChanges initialization is complete, the difference method maps back the _CollectionChanges instance into an array of Change instances, and returns a CollectionDifference initialized with these changes.Therefore, the real diffing doesn’t happ'''
