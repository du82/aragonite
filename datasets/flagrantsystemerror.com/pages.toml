full_description = '''The Pyramid Principle by Barbara Minto is a very short book on writing and thinking in a structured and logical manner. This review focuses on the first half of the book, which deals with how to structure writing.The book's advice is meant for business documents. It is not general-purpose writing advice but should apply to any non-fiction writing where clarity is important.⚠️This is a summary of the advice in the book The Pyramid Principle by Barbara Minto. While I attempt to apply the principles here, I am still learning, so this document may not properly reflect the material in that book. Document Structure (Chapter 1)Documents should be structured in a summary-to-main points pyramid using the following 3 rules.Any point higher in the pyramid should be a summary of the points grouped below.Siblings in a group should all be of the same kindApples and pears being fruit is a good grouping, and chairs and table being furniture is a good grouping, but apples and chairs are too disparate to reliably link together in a single concept usually.Topics or concepts in each group should be logically ordered. There are only four types of ordering:Deductively - major premise, minor premise, conclusion (Men are mortal. Socrates is a man. Socrates is mortal.)Chronologically - first, second, thirdStructurally - this is possibly the most arbitrary of the groupings and is based on contextComparatively - most important to least importantThese are the only four groupings that the mind can conceive: reasoning deductively, establishing cause-and-effect, breaking a whole into its parts, and categorizing.Determining Document Structure (Chapter 2)It is nearly impossible to know the structure of the document beforehand. It is therefore useful to explore the relationships of your points and the introductory narrative to discover the structure of your ideas.Documents will have points that spread in two directions.Vertical relations that tie together points and sub-pointsHorizontal relations that tie together similar pointsVertical RelationshipsVertical relations between subjects are modeled in question/answer pairs. The subject of a level should raise a question in the reader's mind, and subsequent paragraphs and sections should explore the answers to that question, posing more precise questions until the answers in the bottom of the pyramid.Here is an example explaining why humans should explore space.<img alt="notion image" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F048c3c25-2ade-46a6-9de7-34709ca5d9a1%252FUntitled.png%3Ftable%3Dblock%26id%3D14d786cf-a010-8114-b905-cabd66aa4f2d%26cache%3Dv2&amp;w=3840&amp;q=75 1x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F048c3c25-2ade-46a6-9de7-34709ca5d9a1%252FUntitled.png%3Ftable%3Dblock%26id%3D14d786cf-a010-8114-b905-cabd66aa4f2d%26cache%3Dv2&amp;w=3840&amp;q=75"/>ℹ️This diagram was taken from https://www.consultingmethodology.com/wp-content/uploads/Pyramid-principle_v2.1.pdf, which is a summary of the book reviewed here.The tree alternates between propositions and questions, with the final layers providing the answers to what are hopefully final questions that the reader will have.Horizontal RelationshipsMost subjects require multiple points to fully answer a question. These points must be related. As shown in the diagram above, these are horizontally related.The subjects of the points are related in one of two ways, deductively or inductively. Chapter 1 lists four ways; the first way is the deductive manner (using Socrates is mortal), and the other 3 are inductive. The inductive relations can usually be described by a plural noun e.g. reasons, steps, problems.Example of Vertical and HorizontalAn example of a vertical relationship above is the "Earth will eventually end." The two supporting reasons are "The sun will end." and "Disaster will happen." These two reasons are vertical to the main reason "Earth will eventually end." and are horizontal to each other. In turn, each is vertical to further sub-points, which are in turn horizontal to each other (despite being arranged vertically in the diagram.)Introductory NarrativeThe introduction is especially important in this structure. It establishes the reason for reading the document and thus needs more than just posing a question at the top of the document.Instead, the familiar story structure is used to give the reason enough information to decide if the document is worth reading.The story structure is:Situation - the history or events that lead to the document being necessary.Complication - the change in the situation that occurredQuestion - the question(s) raised by the complicationAnswer - the summary of the answer that the document provides to the question.ℹ️One of the things that I have done, and I see in other documents, is to "hide" the answer until later in the document. I'm not sure why this is; perhaps to provide some sort of suspense or reason for reading the document. However, providing answers in summary form up front prevents wasting time in understanding the purpose of the document.SCQASCQA is an abbreviation that stands for Situation, Complication, Question, and Answer. The SCQA method is used to capture a reader's attention. It is very<img alt="SCQA" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fcropped-cfi-favicon-2-192x192.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=256&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fcropped-cfi-favicon-2-192x192.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=384&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fcropped-cfi-favicon-2-192x192.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=384&amp;q=75"/>https://corporatefinanceinstitute.com/resources/careers/how-to-job-guides/scqa/<img alt="SCQA" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fscqa-1024x436.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fscqa-1024x436.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=2048&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fcdn.corporatefinanceinstitute.com%252Fassets%252Fscqa-1024x436.png%3Ftable%3Dblock%26id%3D14d786cf-a010-81a0-86c7-e51b310ab201%26cache%3Dv2&amp;w=2048&amp;q=75"/>This link does a good job of elaborating the SQCA format for business writing.In formulating the question in response to the complication, the question often is simply "How do we solve this complication?" or "Why did this complication arise?" The question often is a restated version of the complication.Creating the Structure (Chapter 3)You have an interesting topic, and you know what you want to write about. However, the subjects and topics don't automatically organize themselves vertically and horizontally as described in previous chapters. How do you get what is in your head onto paper properly structured? This chapter is about how to initially organize the information you have.There are two methods described: a top-down approach and a bottom-up approach. Both of these result in a good document, but the top-down approach is recommended by the author. For myself, I think the bottom-up approach might be a better starting place.Top Down ApproachThe top-down approach is much like it sounds. Starting from more general topics, and proceeding to more specifics until all details are explained. But these points don't usually spring from the imagination onto the page.The author suggests using a diagramming approach. Drawing boxes, form a tree, starting at the top with the general subject of the document, with edges posing questions that need to be answered. The result might look like the diagram above in the Chapter 1 summary.The top box is your introduction. In it, you should be able to identify the situation, complication, question, and answer.The top-down approach is useful when you know the subject (what you wish to talk about), but perhaps don't know all the details. It helps elucidate the questions that need to be answered, which then lets the writer drill down to answering those specific questions.Bottom Up ApproachThe bottom-up approach is useful when you perhaps don't have a clear understanding of what should be at the top. Undoubtedly you have some idea of what you should be writing about, or you wouldn't be writing the document. And you have points that you wish to make, but it's the connections between the points that aren't clear.The simplest way to start is to simply write what you know about the subject.The second step is to write what your audience is expected to already know (the situation, and perhaps the complication, of the introduction).Next, group these points by similarity. Where connections don't exist, these should likely be in separate sections.Think of the question that each point might be answering. These questions become the basis of the summary points that head each section.Using this iterative approach, you can build on each layer, moving from specific to general. But don't be surprised or disappointed if the structure doesn't immediately appear. This is an iterative approach, which will often require several passes.Like with the top-down approach above, you can start diagramming with boxes and edges, each box making a point and the edges asking questions that lead to those points, similar to the diagram in the summary of Chapter 1. Just prepare to either use your eraser or have scissors (digital or physical) ready to cut and rearrange.Eventually, you might end up with a diagram for functional programming that looks like this.<img alt="notion image" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F26f53cef-6dc1-44dd-92c4-11d04c82e729%252FPyramid_Principle_-_Functional_Programming.svg%3Ftable%3Dblock%26id%3D14d786cf-a010-8168-a3c4-c65aff6f5a99%26cache%3Dv2&amp;w=750&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F26f53cef-6dc1-44dd-92c4-11d04c82e729%252FPyramid_Principle_-_Functional_Programming.svg%3Ftable%3Dblock%26id%3D14d786cf-a010-8168-a3c4-c65aff6f5a99%26cache%3Dv2&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F26f53cef-6dc1-44dd-92c4-11d04c82e729%252FPyramid_Principle_-_Functional_Programming.svg%3Ftable%3Dblock%26id%3D14d786cf-a010-8168-a3c4-c65aff6f5a99%26cache%3Dv2&amp;w=1920&amp;q=75"/>Each layer is a more specific reason for using functional programming.Introductions (Chapter 4)Introductions are the most important paragraph in the document.It must tell the reader what they already know, and then weave a story about why they want to read this document.As mentioned in Chapter 1, the introduction consists of 3 parts.Situation - the current statusComplication - the predicament that the situation presentsQuestion - directs the expectations for what the document answersKey Line - the thesis statement for the solution that is described in the documentHow Long?The introduction can be any length, though succinct is better. Typically for short documents, it is a sentence for each part, and longer documents might be a few paragraphs.Feel free to use more as necessary, but you really shouldn't need more than 3-4 paragraphs unless the topic is very complicated.SituationThe situation presents a stable state, either currently or wished for. It is the basis from which deviation requires the document.HooksA hook is a literary device to pique the reader's interest as quickly as possible.By telling the reader something they already know, they can immediately establish the relevance of the document to themselves.A good hook is also specific to the reader and their interests. It's even better if you can relate it with specific mentions of people or groups that the reader is familiar with. Nothing engages the reader more than familiarity.Wide AudiencesWhen writing an introduction to a large audience, it is difficult to be specific.Instead of writing something that tells the audience what they already know, it is easier to plant a question in the reader's mind.Example SituationAs an example of a Situation, use the above diagram as inspiration.Functional programming is becoming more popular as software has struggled to adapt from faster single processors to multiple cores.Hopefully, if you're a software developer, it's not controversial to state that speed increases in CPUs have stalled so vendors have compensated by adding more cores; and software that has to coordinate between multiple processors is more complicated than single processor software.The key is that the Situation "is that they leave you expectant for further information."ComplicationThe complication infers a question that must be answered. It describes either something that happened, is about to happen or could happen that would move the situation to an undesired outcome. (Typically the outcome is desired, but it could be desired, in which case the complication might be how to ensur'''
