full_description = '''My name is Jay Kint.I’m a software engineer by day; a programmer, gamer, runner, and amateur mathematician by night. I write software for a small Property & Casualty insurance company to make sure you get your policy correctly. My off hours are devoted to a variety of activities, including running, gaming, and various research projects (including this blog).Flagrant System Error is a repository for things that I’ve learned or am learning, and wish to share. The hope is that others might find them useful.QuotesBelow are some quotes I find inspirational:Great minds discuss ideas; average minds discuss events; small minds discuss people. — Eleanor RooseveltNothing in this world can take the place of persistence. Talent will not: nothing is more common than unsuccessful men with talent. Genius will not; unrewarded genius is almost a proverb. Education will not: the world is full of educated derelicts. Persistence and determination alone are omnipotent. — Calvin CoolidgeWe need a witness to our lives. There's a billion people on the planet... I mean, what does any one life really mean? But in a marriage, you're promising to care about everything. The good things, the bad things, the terrible things, the mundane things... all of it, all of the time, every day. You're saying 'Your life will not go unnoticed because I will notice it. Your life will not go un-witnessed because I will be your witness'. — Beverly Clark, “Shall We Dance?”I could add four lanes to my carpal tunnel and still not write all the code I am dying to write. — Kenny TiltonAmateurs sit and wait for inspiration, the rest of us just get up and go to work. — Stephen King, “On Writing: A Memoir of the Craft”The test of a first-rate intelligence is the ability to hold two opposing ideas in mind at the same time and still retain the ability to function. — F. Scott FitzgeraldEat food. Not too much. Mostly plants. — Michael PollanDo not go gentle into that good night, Old age should burn and rave at close of day; Rage, rage against the dying of the light. — Dylan Thomas“Most people overestimate what they can do in a day, and underestimate what they can do in a month. We overestimate what we can do in a year, and underestimate what we can accomplish in a decade." — Matthew Kelly from the book “The Long View” 📡Contact me at: Email: jkint@icosahedron.org Made with 💕 in Seattle, Washington, USA'''
