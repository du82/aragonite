title = "Gitea Transfer to New Instance"
description = "Bonjour,  It would be useful to have an export format for Gitea, similar to what GitLab has. It could be used to import projects in other Gitea instances, as an alternative to migrating from an existing Gitea instance via the API.     The GitLab export format would be a good starting point but it is not documented which makes it unsuitable for anything but exchanging data between GitLab instances.  In the context of the fedeproxy project a file format is developed and used as a pivot to exchange..."
full_description = 'This article describes how to move a Gitea instance from one docker container to another. I thought that simply copying the mounted volume directory would be sufficient, but apparently isn’t.Gitea has a CLI that can export most of the data (excepting the projects).Here are some articles that I read to understand how to do the transfer.Export format for GiteaBonjour, It would be useful to have an export format for Gitea, similar to what GitLab has. It could be used to import projects in other Gitea instances, as an alternative to migrating from an existing Gitea instance via the API. The GitLab export format would be a good starting point but it is not documented which makes it unsuitable for anything but exchanging data between GitLab instances. In the context of the fedeproxy project a file format is developed and used as a pivot to exchange...<img alt="Export format for Gitea" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foptimized%252F2X%252Fd%252Fdbd07438eb6af60e86c654a6fb43694e7ff17b23_2_32x32.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=32&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foptimized%252F2X%252Fd%252Fdbd07438eb6af60e86c654a6fb43694e7ff17b23_2_32x32.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=64&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foptimized%252F2X%252Fd%252Fdbd07438eb6af60e86c654a6fb43694e7ff17b23_2_32x32.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=64&amp;q=75"/>https://forum.gitea.com/t/export-format-for-gitea/3845<img alt="Export format for Gitea" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foriginal%252F2X%252F2%252F2337249a93943324b538fa3ef5ebc42f54385c41.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foriginal%252F2X%252F2%252F2337249a93943324b538fa3ef5ebc42f54385c41.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fglobal.discourse-cdn.com%252Fflex020%252Fuploads%252Fgitea%252Foriginal%252F2X%252F2%252F2337249a93943324b538fa3ef5ebc42f54385c41.png%3Ftable%3Dblock%26id%3D163786cf-a010-8002-86e9-f7c610de614f%26cache%3Dv2&amp;w=1920&amp;q=75"/>https://github.com/go-gitea/gitea/pull/12244 - PR and issue that introduced the dump-repo and restore-repo options.Using the above it’s possible to dump the contents of the repo and restore it into another Gitea instance. (It supposedly works for other Git repos too.)Docker ContainersIf you run Gitea in a docker container, then there are a few extra steps.First, log in to the original docker container with docker exec -it <container name> /bin/shThis will give you a shell as root. But the gitea command line program refuses to run as root.su git to become the git user.cd ~ to go to the home directory, which is the /data/git directory (which should be mounted to the host).Run the the gitea command line from inside the original container to export the data:gitea dump-repo --clone_addr <https address of repo> --git_service giteaThis should create a directory called data under the /data/git directory, which contains the exported items as a set of YAML files. This directory should be visible on the host, as Gitea mounts the /data directory.In the docker container of the new instance of Gitea, follow the above steps, except use the following command line to import the items.gitea restore-repo --repo_name <repo name> --repo_dir pwd/data --owner_name <gitea account name>The owner must already be defined in Gitea, but the repo will be created by restore-repo.What about docker export ?Exporting the docker container (e.g. docker export) would also work, but I wanted to upgrade the version of Gitea, and, as mentioned above, simply copying the mounted volume directory didn’t work.'
