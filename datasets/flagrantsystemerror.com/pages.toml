title = "Category Theory: What Is A Category?"
description = "Introduction to Category Theory"
full_description = 'From a functional programming perspective, category theory is a branch of mathematics that serves a purpose similar to what patterns do in object-oriented programming. That is, categories provide a set of patterns or ideas that provide implementation recipes. This is an opinionated definition that will hopefully bear out in future articles.Categories and Functional ProgrammingFunctional programming is becoming more popular, and with it has come a new vocabulary. Words like monad, endofunctor, and monoid cause software engineers to scratch their heads in confusion. For most of us these words are new and unique, without analogs to the real world. They are mathematical terms that aren’t used much outside that domain.At first examination, it seems to me that using these mathematical terms are the approximation of patterns that object-oriented languages use (e.g., The Gang of Four Patterns). They describe constructs used frequently in functional programming the same way that Observer and Visitor might be used C++ or C#. (We’ll see if that definition holds up as I progress.)Category Theory for ProgrammersThere are many resources available to learn category theory, but one such resource is aimed at programmers. Category Theory for Programmers is an online book by Bartosz Milewski. It can be freely read, though there is a dead tree version if that is your preference.I have started the book a few times, but that format didn’t speak to me for some reason. Through the book and website though I discovered the video series. I find it much more approachable and so far has been my primary way to learn category theory.These posts are mostly summarized from the video series, supplemented with some additional material that I found helpful.Math Required?I am not a mathematician by trade or even experience, but you could say that I’m an enthusiast. Category Theory doesn’t require, at least so far in my studies, much math beyond high school level. Logic is helpful too. When appropriate, the logic will be explained, which mostly entails describing how the symbols map to English.Category theory, and this video series in particular, displays what is so neat about math. As Keith Devlin explains in his Mathematical Thinking book, math learned in higher education is different from the math in elementary education. It primarily differs by moving from calculation to conceptual. That is, rather than using math as a tool, we begin to use it for understanding.Functions as ConceptsA good example is the evolution of the function. A function as a calculation tool is an equation:But as a conceptual topic, a function can be almost anything. As an example, a function can be described in plain language: The former is used to compute values. The latter is a concept for mapping numbers to booleans. As Mr. Devlin says, “Try graphing that monster [function]!”.ℹ️Keith Devlin’s book on Mathematical Thinking is a pretty good introduction to making this transition, though I am still working my way through it.What is a Category?Starting at the very beginning, what is a category?First, what it is not. A category is not just a set (as in set theory). A set can be a category, and its elements are the objects in the category, but categories are not necessarily sets. Though sets-as-categories is often a convenient way to explain them.Categories are defined by two things:Composition IdentityBut composition of what? And identity of what?Objects in a CategoryA category is a group of objects or things, or as described in the videos, a bunch. A category is not a group in the mathematical sense. What is an object? It’s not really defined. We know it’s there, but category theory does not attempt to define it beyond “it’s what is in the category”. An object has no properties or attributes that are important within category theory.Functions in a CategoryIn category theory, a function (also known as a morphism) is a transformation between two objects in the categories. So if a category is a bunch of objects, a function takes something that is in that bunch and transforms it into something else that is in another category (or technically, it can be in the same category). <img alt="Figure 1, functions f and g map objects between categories A and B." loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fa1734327-c8fd-4f57-814a-ca6f4cb9e7d4%252FUntitled.png%3Ftable%3Dblock%26id%3D700ba1f9-5406-4d97-bf68-fe2a9ac9c890%26cache%3Dv2&amp;w=750&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fa1734327-c8fd-4f57-814a-ca6f4cb9e7d4%252FUntitled.png%3Ftable%3Dblock%26id%3D700ba1f9-5406-4d97-bf68-fe2a9ac9c890%26cache%3Dv2&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fa1734327-c8fd-4f57-814a-ca6f4cb9e7d4%252FUntitled.png%3Ftable%3Dblock%26id%3D700ba1f9-5406-4d97-bf68-fe2a9ac9c890%26cache%3Dv2&amp;w=1920&amp;q=75"/>Figure 1, functions f and g map objects between categories A and B.When diagramming, functions are represented as directed arrows, as in Figure 1. It is important that they show as directed. Functions are one way. You give it an argument, it returns a result. If you give the result back to the function, you don’t get the original argument, you get another result.In the diagram above, we see that and must be different functions because for the same object in A, they return different objects in B.While some functions have an inverse, the inverse function is a function in its own right and would be represented with a separate arrow back to the original object.Functions have a domain, a codomain, and an image. In the parlance of sets, the domain is the set that has valid elements for parameters to the function. The codomain is the set that has valid values returned by a function as elements. And an image is the actual elements in the codomain that a function will return.Wikipedia’s example of a domain, codomain, and image using sets:For a function , defined by , or equivalently , the codomain of is ℝ, but does not map to any negative number. Thus the image of is the set , i.e., the interval .📡This answer on Math Stack Exchange does a good job of explaining the differences between codomain and image. Codomains are specified for a function, and can not generally be inferred from the function alone.Not every object in a category needs to have a morphism between every other object in another category. Functions can be selective, or even infinite. There could be infinite number of functions between two objects.📡Interesting side fact: Two functions between the same objects are not considered isomorphic. They are different functions. (Citation needed.)IdentityKnowing what a function is, we refer back to our definition of a category, and tackle the identity.Each object in a category has an identity function. This function simply maps any object in the category back to itself.<img alt="Figure 2 Identity functions for objects in the category represented as arrows that map back to the original object." loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fe75c06f4-dbe5-4dd0-84ea-296397864bd7%252FUntitled.png%3Ftable%3Dblock%26id%3Da9a868e1-6002-4670-b0b6-fc143993649e%26cache%3Dv2&amp;w=640&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fe75c06f4-dbe5-4dd0-84ea-296397864bd7%252FUntitled.png%3Ftable%3Dblock%26id%3Da9a868e1-6002-4670-b0b6-fc143993649e%26cache%3Dv2&amp;w=828&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252Fe75c06f4-dbe5-4dd0-84ea-296397864bd7%252FUntitled.png%3Ftable%3Dblock%26id%3Da9a868e1-6002-4670-b0b6-fc143993649e%26cache%3Dv2&amp;w=828&amp;q=75"/>Figure 2 Identity functions for objects in the category represented as arrows that map back to the original object.In the category above, each object has an function, which returns the object itself, essentially . In code the equivalent is def id(x): return xIn a category, each object must have an identity function. Otherwise, it is not a category.An example of an identity function would be adding 0 or multiplying by 1 if your objects were numbers.CompositionBesides identity, categories must have composition. Composition is the concept of two functions composed by using the result of the first function as the input to a second function, etc. It is commonly expressed as or , both of which read “g after f”.In code this would look similar to:def compose(f, g, x): return g(f(x)) def inc(x): return x + 1 compose(inc, inc, 1) # evaluates to 3Where there is any function between two objects in category A and category B, and a function between the same object in category B and another object in category C, there must be a function which maps the object in category A to the object in category C, as shown in Figure 3. This function is always named “second function after first function”.<img alt="Figure 3 If a function exists from an object in A to an object in B and one from that object in B to an object in C, then a function must exist from the object in A to the object in C." loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" srcSet="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F8c0811de-0adf-4e05-997b-8fa57700a90c%252FUntitled.png%3Ftable%3Dblock%26id%3D9f245770-5e2d-419d-88c5-0828bd947862%26cache%3Dv2&amp;w=1080&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F8c0811de-0adf-4e05-997b-8fa57700a90c%252FUntitled.png%3Ftable%3Dblock%26id%3D9f245770-5e2d-419d-88c5-0828bd947862%26cache%3Dv2&amp;w=2048&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fwww.notion.so%2Fimage%2Fhttps%253A%252F%252Fs3-us-west-2.amazonaws.com%252Fsecure.notion-static.com%252F8c0811de-0adf-4e05-997b-8fa57700a90c%252FUntitled.png%3Ftable%3Dblock%26id%3D9f245770-5e2d-419d-88c5-0828bd947862%26cache%3Dv2&amp;w=2048&amp;q=75"/>Figure 3 If a function exists from an object in A to an object in B and one from that object in B to an object in C, then a function must exist from the object in A to the object in C.Composition and AssociativityWhat about composing more than 2 functions? What about a category D with a function from the object in C? That would look like , as you would expect.Composition is associative, like addition or subtraction, meaning it doesn’t mean how the operations are grouped. is the same as which is the same as the above without parentheses.Identity and CompositionWhen an identity function is composed with any other function, it simply maps to that function, as such . As one would expect, can be composed infinite amount of times and it will always return its argument.Category Theory and Information HidingIn programming, we strive for information hiding. We hide implementation details about an object (or module or structure) behind interfaces of functions or operations for a variety of reasons.In categories, objects are also hidden. We know they’re there, but we don’t know anything about them, except the functions which can operate on them.We abstract away the details of the objects themselves, and only look at the functions that can interact between objects. Already we see that categories in mathematics can help model one aspect of programming.'
