["https://flashlight.nitecore.com/About/release/cd/17"]
title = "LATEST RELEASE"
full_description = "The NITECORE CL10 Multipurpose Ultra Lightweight Clip-on Light weighs only 28g / 0.99 oz, and features three light sources lighting and red/blue warning flashing in one button. It is compatible with various AAA batteries and comes with a versatile clip, easily satisfying lighting needs of night duty. The NITECORE DL30 Dive Light is certified submersible in 100 meters depth. It delivers robust lighting of 1,100 lumens and 788 meters long throw, plus the strong penetrating capability brought by the 3° spot beam angle, displaying all-round excellence in escorting divers to explore the ocean. The NITECORE EDC31 Compact Tactical EDC Flashlight is consistent in excellence of EDC series, offering supreme performance with its UHi 20 MAX LED, Rapid Lock™, 3500-lumen LUMIN SHIELD™ and a length of 113.2mm. The EDC31 is ultra compact and lightweight, perfect for covert everyday carry. The NITECORE HA15 UHE, Multipurpose Ultra Lightweight AA Headlamp, utilizes matrix-design 6-Core UHE LEDs to deliver powerful lighting efficiency with a max output of 400 lumens, a long throw of 80 meters, and only 43g (1.52 oz) in weight. It’s compatible with various AA batteries and the NL1411R 14500 Li-ion battery. The NITECORE HA11, Multipurpose Ultra Lightweight AA Headlamp, utilizes a dual-core UHE LED to achieve ultra high luminous efficiency and a leap in performance, with a max output of 240 lumens, a max throw of 90 meters and a runtime up to 75 hours. The 38g (1.34 oz) ultralight weight and compatibility with AA/14500 batteries, make it applicable to various activities."
author = "Website Design HUNUO - http://www.hunuo.com"
year_published = 2020
clearnet = "https://flashlight.nitecore.com/About/release/cd/17"
