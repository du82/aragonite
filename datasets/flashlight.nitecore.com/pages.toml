title = "EVENTS"
full_description = 'We are delighted to announce that Fuzhao Xiang and Rongrong Chen join the NITECORE family as our new NITECORE ambassadors. Both of them are professional trail runners as they are always full of expectation on the trail races, and keep striving for better achievement. In the future, we will help and support them with our excellent products, taking them to the next level. Inspired by the notion to "Keep Innovating", NITECORE specially creates ideal solutions for trail running. We design various products to light up the ways of runners helping them finish the races. Therefore, NITECORE offers the Trail Running Elite Package specially to runners in the UTMB. We are delighted to announce that Scotty Hawker joins the NITECORE family as a new NITECORE ambassador in 2022. In the future, we will help and support him with our excellent products, taking him to the next level. Recently, NITECORE has the honor to be the Lighting Equipment Sponsor of MTB Pomerania Maraton and Pomerania Trail. The NITECORE HC65 V2 Triple Output Full Metal USB-C Rechargeable Headlamp, UT27 Ultra Lightweight Dual Beam Fusion Elite Headlamp and TINI2 Dual-Core Intelligent keychain Light are chosen as winners of Tmall x ISPO Choice 2021 F/W.'
