["https://flashlight.nitecore.com/About/release/cd/17/p/3"]
title = "LATEST RELEASE"
full_description = '''The MT1A Pro High Output Compact Rechargeable AA Flashlight is the first one to pack the NiteLab UHi 25 LED. It blasts up to 800 lumens over 250 meters, weighing at 52g (1.83 oz) (battery included) with a length of 93mm (3.66"). It includes a USB-C rechargeable Li-ion battery (NL1411R 1,100mAh) and also works with 1 x AA battery. The HU2000 is a high output split-type work headlamp with a USB-C extension cable compatible with most power banks available on the market. It features a 10-core UHE LED design with over 94% light transmission and a 950mm² large reflective surface, delivering 2,000 lumens and a 160-meter beam, all at just 114g (4.02 oz). The MH40 Pro utilizes a UHi 40 MAX LED with a max output of 3,500 lumens and a max throw of 1,300 meters. It works on NBP100R (USB-C rechargeable) or two 21700 batteries, offering up to 62 hours of runtime. Other features include a low power vibration indication, an included wireless remote switch, 1m impact resistance, and an IP68 rating. The NU20 Classic Ultra Lightweight Outdoor Headlamp retains the classic design at a total weight of 38g (1.34 oz). It features an ultra high efficiency UHE LED, with a max output of 360 lumens and a range of 109 meters. The charging port has been upgraded to USB-C. The new UT27 headlamp features UHE LEDs with dual color temperatures, delivering a combination of spotlight and floodlight with up to 800 lumens and a 168-meter throw. Weighing just 74g (2.61 oz), it runs on NITECORE's HLB1500 Li-ion battery pack or 3 x AAA batteries. Additional features include a glow-in-the-dark battery compartment, triple light sources, Lockout Mode, and IP66 rating.'''
