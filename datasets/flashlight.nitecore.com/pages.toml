["https://flashlight.nitecore.com/About/detail/ad/2042"]
title = "New Night Duty Lighting Series: CL10 Multipurpose Ultra Lightweight Clip-on Light"
full_description = 'NITECORE keeps exploring the lighting field and launches the CL10 Multipurpose Ultra Lightweight Clip-on Light on February 20th, 2025, marking the beginning of the new night duty Lighting series. The CL10 is a trustworthy gadget on night duty. It features red/blue warning flashing and white light / red light / blue light illumination, satisfying various lighting needs of night duty, including showing identity, offering deterrence and close-range lighting, and preserving night vision. Considering user experience and efficiency, the CL10 is designed with a textured and protruding single button for clear touch and intuitive operation. Besides, the CL10 boasts a compact and ultra lightweight design, weighing only 28g (0.99 oz) plus the clip, making it easy to carry and wear. The versatile clip allows the CL10 to be firmly clipped on the cap brim, shoulder, or chest area and realizes hands-free operation and the multiple uses of the CL10. Moreover, the design details reflect NITECORE’s consideration for users. As for power sources, the CL10 comes with 2 alkaline AAA batteries and is compatible with various AAA batteries, providing economical and accessible power options. For battery replacement, the side battery cap design allows users to replace the batteries with one hand without removing the clip. In addition, the CL10 is made from special PC plastic, with IPX4 rating and 1m impact resistance, making it sturdy and durable. Inspired by the notion to "Keep Innovating" as a global leader of LED flashlights and chargers with over 100 patents and a grand-slam award winner of the American International Design Excellence Awards (IDEA), German iF Design Award, Red Dot Design Award and the Japanese G-Mark (Good Design), NITECORE creates innovative products in a wide variety of fields and leads the industry in new standards of portability, aesthetic, output and functionality.'
