["https://flashlight.nitecore.com/About/detail/ad/2028"]
title = "Introducing the HA15 UHE – Multipurpose Ultra Lightweight AA Headlamp"
full_description = 'The NITECORE HA15 UHE, Multipurpose Ultra Lightweight AA Headlamp, is officially released on December 17th, 2024. The HA15 UHE carries on the lightweight design of the NITECORE HA series, and weighs only 43g / 1.52 oz (headband included), making it effortless to carry. The highlight of the HA15 UHE, which makes it stand out from other HA series products, is the 6-Core UHE LEDs arranged in a matrix to maximize the luminous efficiency and performance, providing a 400-lumen max output and 80m long range coverage, along with a max runtime up to 114 hours. At the frequently used 100-lumen level in outdoor activities, the HA15 UHE can last up to 10 hours and 30 minutes, offering you a more enjoyable outdoor experience with its excellent practicality. Light up your whole night! Another advantage of the HA series maintained by the HA15 UHE is the dual power options. The HA15 UHE is compatible with various AA batteries and the NITECORE NL1411R 14500 Li-ion battery. Stay flexible in battery usage! Inspired by the notion to "Keep Innovating" as a global leader of LED flashlights and chargers with over 100 patents and a grand-slam award winner of the American International Design Excellence Awards (IDEA), German iF Design Award, Red Dot Design Award and the Japanese G-Mark (Good Design), NITECORE creates innovative products in a wide variety of fields and leads the industry in new standards of portability, aesthetic, output and functionality.'
