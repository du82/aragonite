["https://flashlight.nitecore.com/About/events/cd/18/p/6"]
title = "EVENTS"
full_description = "In 2019, NITECORE is officially qualified as China's High and New Technology Enterprise (HNTE), which means a great support and recognition by the Chinese government. Specified by the documents, the HNTE shall possess ownership of the intellectual property rights which provide the core technological support for their main products and/or services. Outdoor by ISPO 2019 was held in Munich Trade Fair Centre from June 30 to July 3, in Germany. NITECORE attended this annual outdoor event in Munich for the first time, after the show was moved from Friedrichshafen. New products, creative designs and experience was presented by NITECORE in C6-612. Before OutDoor by ISPO, Europe’s largest outdoor trade fair with a new innovative concept, 21 judges from 9 countries experienced and discussed all applications and selected the awardees in the beautiful Annecy Mountains, among products from 17 categories for the criteria of Innovation, Design, Function, Price-Performance and Eco Responsibility. The independent and international jury comprises acknowledged experts from various sectors of the industry: retailers, designers, athletes, media and product specialists as well as selected consumers from the ISPO community. The Outstanding Outdoor label provides orientation for consumers, media and retailers; it tells stories about innovation, craftsmanship, and excellence. 2019 Outdoor Retailer Summer Market was held in Colorado Convention Center between 18-20 June in America. Outdoor Retailer Summer Market has grown over 30 years to become one of the world’s largest outdoor tradeshows. This tradeshow shows new products, creative designs and various experience activities and attracts outdoor equipment retailers, manufacturers, professionals in outdoor industry and thousands of buyers from all over the world. They gather together in this tradeshow and share the new fashion trend."
author = "Website Design HUNUO - http://www.hunuo.com"
