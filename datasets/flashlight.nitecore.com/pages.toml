title = "LATEST RELEASE"
full_description = "The NITECORE NPL25 is a Compact Tactical Light featuring a UHi 20 LED, delivering an output of 900 lumens and a beam distance of 255 meters. It has ambidextrous switches for flexible control and runs on a 500mAh Li-ion battery. It also features quick release design and supports magnetic charging. NITECORE Tactical EDC Flashlight EDC35 debuts with four ultimate technologies: UHi 40 MAX LED, 5000-lumen LUMIN SHIELD™, 550-meter max throw, and a 6,000mAh 21700 Li-ion battery, with 90 hours max runtime. The NITECORE HC65 UHE Ultra High Triple Output Metal Headlamp features an 8-core ultra high efficiency UHE LED that shines up to 2,000 lumens. It includes a 4,000mAh 18650 Li-ion battery; it is IP68-rated and 2m impact resistant. NITECORE Tactical EDC Flashlight EDC33 debuts with four ultimate technologies: UHi 20 MAX LED, LUMIN SHIELD™, Rapid Lock™, and a 4,000mAh 18650 Li-ion battery. It features excellent defense thanks to the 7000 series military grade aluminum alloy. The NITECORE MT2A Pro is a high performance rechargeable AA flashlight, debuting with the NiteLab UHi 20 LED. It has a max output of 1,000 lumens and a max throw of 255 meters. It includes a NL1416R rechargeable Li-ion battery and is also compatible with AA batteries."
