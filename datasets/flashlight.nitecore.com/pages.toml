["https://flashlight.nitecore.com/About/release/cd/17/p/2"]
title = "LATEST RELEASE"
full_description = '''The NITECORE NPL25 GL, Green Laser Compact Tactical Light, utilizes the UHi 25 LED to deliver a white, accurate, and clear lighting effect with an output of 900 lumens and a throw of 216 meters. The combination of the 520nm precise green laser helps to get everything under control. Moreover, it features a compact structure with only 74g (2.61 oz) in weight, and a convenient rapid battery removal and recoil-proof design. The NITECORE EDC23 SABER, Ultra Slim Pocket Tactical EDC Flashlight, utilizes the UHi 25 LEDs to deliver an output of 2500 lumens and a throw of 280 meters. It features a compact and ultra short structure, measuring just 102.8mm (4.05") in length. The NITECORE HC70 UHE High Performance 21700 Rechargeable Work Headlamp features a matrix-design 6-core UHE optics that provides a bright and wide lighting of 1600 lumens and 156m. Powered by a replaceable 6000mAh Li-ion battery for a long-lasting runtime, it is equipped with dual light sources, red and white, making it ideal for various activities. The EDC29 uses two UHi 20 MAX LEDs to produce up to 6,500 lumens. It features Rapid Lock™ for quick locking and unlocking, and an extensive armor-inspired anti-slip texture for a more secure grip. The NU27 is NITECORE's first headlamp with MCT (Multiple Color Temperatures) UHE LEDs, capable of providing 600 lumens across three color temperatures: warm light (3,000K), neutral white light (4,500K), and cool white light (6,500K). And it weighs only 56g (1.98 oz).'''
