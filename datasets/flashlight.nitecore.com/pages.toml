["https://flashlight.nitecore.com/About/release/cd/17/p/4"]
title = "LATEST RELEASE"
full_description = "The HC60 UHE is an outdoor headlamp featuring 6-core UHE LEDs. With over 94% light transmission and a large 411mm² reflective surface, it delivers 1,600 lumens and projects a beam up to 157 meters. It weighs just 140g (4.94 oz), and the center-of-gravity-design bracket makes it more comfortable to wear. The EDC27 UHi Ultra Slim Tactical EDC Flashlight boasts UHi 20 LEDs with 3,100 lumens and a 305-meter throw. It adds a power remaining display and a level preset function for setting the desired brightness level in advance. The NITECORE NU30 is a triple output lightweight outdoor headlamp with 4-core UHE LED that delivers 500 lumens and a range of 130 meters, featuring TrueVision+ flood beam. It includes a built-in 1,500mAh Li-ion battery and weighs only 90g (3.17 oz). The MT1C Pro is a high output compact tactical flashlight weighing only 80g (2.82 oz). It features a UHi 20 LED with 1,000 lumens and a 360-meter throw and includes a 1,600mAh 18350 Li-ion battery for up to 16 hours of runtime. The High Output Lightweight Industrial Headlamp NU53 features an 8-core UHE LED setup to deliver 1,800 lumens and a throw of 175 meters. It offers red and white lighting options and includes a built-in 6,000mAh battery for bright illumination all night long."
