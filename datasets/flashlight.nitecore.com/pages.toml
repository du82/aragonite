["https://flashlight.nitecore.com/About/index/id/15"]
title = "ABOUT US"
full_description = '''Inspired by the notion to "Keep Innovating" with the industry-leading innovative power for 16 years, NITECORE is the first brand to achieve a grand-slam milestone in the industries of professional lighting and chargers to receive the German iF Design Award, Red Dot Design Award, the Japanese G-Mark (Good Design) and the American IDEA, as well as Gold Winners of the ISPO Award and Outstanding Outdoor globally recognized in the outdoor industry. We specialize in product lines varying from tactical flashlights to outdoor lighting equipment and power solutions specially designed for law enforcement and military departments, industrial corporations and outdoor enthusiasts worldwide. Our partners include HK100, Rio 2016 Summer Olympics in Brazil and Supreme. Yes, we believe in the power of gear. The cool gear makes you outstanding while the right gear can simply be the difference between making it or not. Our creation brings the best help because we make sure it does. We are campers, hikers, mountaineers and enthusiasts of diving, cycling, fishing and boating. We receive trainings from shooting, hunting and search & rescue. We share with them the same passion on rocks, mountains, roads, water and ice, in the woods, the sea, the rain, the fog and even the snow. We share with our customers the same definition of the right gear as we understand what they have been through. Such understanding is the source of our new ideas and perfect designs. Innovation has rooted in our DNA since the company was founded by flashlight fanatics. They are obsessed with the latest technologies of all kinds and are bold in applying them in the design of our illumination products. We boast the most innovative designs and best user experience and performance in the industry: the world's first AA-based flashlight that featured Infinite Variable Brightness (the Nitecore NDI); the world's first flashlight that featured Smart Piston Drive System (D10); the world's first flashlight series that featured 3rd generation Smart Selector Ring technology.'''
