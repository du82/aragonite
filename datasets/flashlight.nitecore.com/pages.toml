["https://flashlight.nitecore.com/About/events/cd/18/p/2"]
title = "EVENTS"
full_description = "From August 28 to September 3, 2023, Chamonix, France hosts the annual Ultra-Trail du Mont-Blanc (UTMB), a landmark event in trail running. Celebrating its 20th anniversary, the UTMB has evolved from a modest local race to the most prestigious trail running competition in the world. Each year, athletes from across the globe brave icy conditions, high winds, and torrential rain as they race through the night in hopes of gunning for the win. On July 7, 2023, NITECORE has officially become the designated headlamp sponsor for the Hong Kong TransLantau™ by UTMB®. As part of the partnership, NITECORE will bring its cutting-edge innovations to support the event and to help runners perform at their best. The SHOT Show 2023 is held in Las Vegas, USA, on January 7th-20th. This grand tradeshow is an annual event for professionals in the shooting, hunting and outdoor industry, featuring firearms, ammunition, law enforcement, outdoor clothing, lighting and other related products and services. The world’s largest Outdoor Hunting Products Exhibition – IWA Outdoor Classics 2023 is held in Nuremberg from March 2nd to 5th. As one of the world’s top tactical, hunting, outdoor and personal protective equipment trade fair, IWA shows the most dazzling and coolest tactical equipment and the world’s top equipment brands. At the same time, IWA is also a “paradise” for all kinds of fans of hunting and outdoor sports. On February 10th-12th, 2023, ISPO Beijing is held at the China National Convention Center in Beijing. It has been 4 years since the last ISPO Beijing and has also been actively supported by a large number of outdoor enthusiasts."
author = "Website Design HUNUO - http://www.hunuo.com"
