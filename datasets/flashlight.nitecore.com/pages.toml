["https://flashlight.nitecore.com/About/detail/ad/2039"]
title = "NITECORE Welcomes Andreu Simon Aymerich to the Team"
full_description = '''NITECORE, a global leader in high-performance headlamps and outdoor lighting solutions, is proud to announce the addition of elite Spanish trail runner Andreu Simon Aymerich to our ambassador team. With an unwavering passion for the mountains and a relentless drive for excellence, Andreu exemplifies the endurance and determination that define the sport of trail running. From a young age, Andreu found freedom and self-expression in the mountains. "I have always loved sports and the mountains. I started trail running because it made me feel free – it allowed me to choose my own path after being diagnosed with diabetes, a condition full of limitations." Through persistence and dedication, he has continued to push past boundaries and redefine what is possible. His journey has been shaped not by famous athletes but by those closest to him. "My role models have not been great sports figures. My closest environment has inspired and motivated me, shaping my personality and approach to life." Andreu's career is marked by remarkable achievements, including victories at Asics SainteLyon and Transgrancanaria (both Marathon and Ultra), as well as a runner-up finish at Lavaredo Ultra Trail. Yet, he remains motivated by the belief that his best performances are still ahead. "It inspires me to train every day, knowing that I can still achieve my best version." Competing at an elite level in ultra-distance trail running presents unique challenges, but managing diabetes on top of that has required an extraordinary level of discipline and resilience. "Without a doubt, being a person with diabetes is a huge challenge in a sport like trail running. Managing glucose levels, insulin, and carbohydrate intake is an enormous difficulty that I work to overcome every day. My goal is to be an example and inspiration for the community living with the same condition." Andreu's approach to training is centered on control and preparation. "I try to simplify and control what can be controlled. If I show up for a race, it's because I know I've done what I needed to do. My coach has planned everything in detail to ensure I arrive in good shape, and all I have to do is run as I have done before."'''
author = "Website Design HUNUO - http://www.hunuo.com"
year_published = 2025
