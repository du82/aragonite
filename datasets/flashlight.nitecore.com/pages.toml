title = "ACCESSORIES"
full_description = "The NITECORE UAC20 is a USB-C to USB-A 2.0 nylon braided charging cable with a max current of 3A, compatible with the mainstream USB-C devices. The nylon braiding with multiple protections makes it fearless of the outdoor environments. The NTK05 Ultra-Tiny Titanium Keychain Knife is CNC machined from TC4 titanium alloy, ultra lightweight and portable for EDC. CNC machined from rigid TC4 titanium alloy, the NTP40 features lightweight, excellent impact and corrosion resistance, and skin friendliness. The German Schmidt Feinminen System 0.5mm offers smooth and clear writing with all-purpose applicable including cartooning, sketching and daily writing. The UI2 is a portable dual-slot USB-C battery charger with a single slot max output of 1A, capable of charging 2 batteries simultaneously and controlling each slot independently while available for large-sized 20700, 21700 Li-ion batteries and more. It has multiple charging safeguards with a weight of only 79.5g (2.8oz), enabling the users to enjoy the inexhaustible power supply on the go. The UI1 is a portable USB-C battery charger with a max output of 1A, available for large-sized 20700, 21700 Li-ion batteries and more. It has multiple charging safeguards with a weight of only 40.5g (1.43oz), enabling the users to enjoy the inexhaustible power supply on the go."
