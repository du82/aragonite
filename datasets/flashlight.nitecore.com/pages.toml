["https://flashlight.nitecore.com/About/detail/ad/2026"]
title = "NITECORE Launches the Newly Upgraded HA11 Multipurpose Ultra Lightweight AA Headlamp"
full_description = 'The NITECORE HA11 Multipurpose Ultra Lightweight AA Headlamp is officially released on December 9th , 2024. A new leap in performance. The dual-core UHE LED imparts ultra high luminous efficiency to the HA11, improving the max runtime to 75 hours while keeping the original max output of 240 lumens and a max throw of 90 meters. Ultra lightweight and portable design. As always, the HA11 is ultra lightweight, weighing only 38g / 1.34 oz (battery not included), half the weight of an egg. Besides, the included light and skin-friendly headband makes the HA11 comfortable to wear, even for an extended period, offering you a more enjoyable outdoor experience. Dual power options. The wide-voltage design makes the HA11 compatible with various AA batteries and the NITECORE NL1411R 14500 Li-ion battery. While the included alkaline AA battery is a good choice out of economical and accessible considerations, the optional NITECORE NL1411R 14500 Li-ion battery can improve the efficiency of the headlamp with the large capacity and long runtime. Diverse usage. The 90° adjustable bracket and the included 360° rotatable clip enable the HA11 to be worn on head, or clipped on the cap brim or strap, and applicable to various outdoor activities. Additionally, the HA11 carries on using the dual button interface to switch swiftly between the white light and red light. The lockout mode, the special PC plastic construction with impact and low temperature resistance, plus the IP66 rating and 1 meter impact resistance, also qualify the HA11 as an entry-level outdoor headlamp. Inspired by the notion to "Keep Innovating" as a global leader of LED flashlights and chargers with over 100 patents and a grand-slam award winner of the American International Design Excellence Awards (IDEA), German iF Design Award, Red Dot Design Award and the Japanese G-Mark (Good Design), NITECORE creates innovative products in a wide variety of fields and leads the industry in new standards of portability, aesthetic, output and functionality.'
