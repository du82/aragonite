["https://flashlight.nitecore.com/About/detail/ad/1949"]
title = "New NITECORE Ambassadors – Katie Schide and Germain Grangier"
full_description = '''On March 25, 2024, we are thrilled to announce Katie Schide and Germain Grangier as our new NITECORE ambassadors. Katie and Germain epitomize the essence of partnership in the trail running realm. As a couple, they are not only companions in life but also training allies, providing unwavering support to each other during races as they compete for top honors in their respective categories. Katie boasts an impressive track record, securing 1st in the 2022 UTMB – Woman, followed by the 2nd place in the 2023 UTMB OCC – Woman and the 2023 Western States Endurance Run – Woman. Meanwhile, Germain clinched 3rd in the 2023 UTMB, emerged as the champion in the 2023 Marathon du Mont-Blanc (90km), and attained fifth place in the 2021 UTMB. Trail running has become an integral part of Katie and Germain's lives. Neither of them began their journey as professional trail runners, nor did they initially envision themselves standing on the podium of UTMB, the pinnacle of trail running honors. Katie's journey as a sports enthusiast began at a young age, actively engaging in various athletic endeavors during her school years, notably focusing on field hockey. Her passion for the outdoors was ignited by her father, with whom she embarked on mountain explorations, fostering a deep appreciation for nature and instilling a love for outdoor activities. Germain's upbringing in the French Alps naturally infused him with a profound affinity for outdoor pursuits. From mountaineering and skiing to mountain biking, his recreational interests have always revolved around the majestic mountains that surrounded him. Before transitioning into a professional trail runner, Germain delved into the field of geology, a path influenced by his profound connection to the mountains. Everything changed in 2016, marking the pivotal moment when Katie and Germain crossed paths. With his extensive outdoor expertise, Germain recognized Katie's innate talent for trail running and became actively involved in guiding, encouraging, and supporting her pursuits. Katie once confessed, "Having that support and belief from someone else gave me an extra level of motivation and confidence to take trail running a little more seriously and set bigger goals for myself. He's someone who continues to support me every day and I'm grateful that he encouraged me to believe in myself from the very beginning."'''
author = "Website Design HUNUO - http://www.hunuo.com"
