["https://flashlight.nitecore.com/CARRYGEAR/Sling%20Bags"]
title = "Sling Bags"
full_description = "The NITECORE SLB06 is a commuting crossbody bag made from high quality 500D CORDURA® nylon fabric. With a 7L (427 cu in) large capacity, it features top two-way zippers and modular expansion options both inside and out, allowing for organized storage and quick access. The NITECORE SLB05 ILLUSION is a modular commuting sling bag built from high quality Nylon fabric. With a 2L (122 cu in) large capacity, it offers three carrying options including sling bag, handbag, and utility pouch. The NITECORE SLB07 SWALLOW Tote Bag features a wearproof 600D polyester fabric and a 7L (427 cu in) large capacity, making it ideal for commuting. With multiple carrying options, it can be held in hand or carried over the shoulder, and the fontal MOLLE system allows for modular extensions. The NITECORE SLB04 3-in-1 Sling Bag is made from waterproof 400D nylon fabric with 1.5L (92 cu in) large capacity and 135g (0.3 lbs) lightweight. It is available with 3 compartments and 2 side pockets for storing your belongings. Built from high density 500D nylon fabric with water and scratch resistant coating, the SLB03 features a weight of 220g (0.5 lbs) and a capacity of 1.6L (98 cu in) specially designed for commuting and trekking. The frontal MOLLE system consisting of high strength nylon straps is available to attach pouches, tools, and modular extensions. The bungee cords on the bottom are ideal for carrying umbrellas, light jackets or towels. With a capacity of 1L (61 cu in) and a weight of 150g (0.3 lbs), the SLB01 features a 2-in-1 stylish design, which enables to be detached or combined for different carrying experiences. Designed with triple seal protection, a premium water resistant zipper and an adjustable shoulder strap, the SLB01 is able to store smartphones, power banks and wireless earphones, ideal for rafting, river tracing, and commuting. Built from high density 500D polyester fabric with water and scratch resistant coating, the NITECORE SLB02 is specially designed for commuters and overnighters with a go-to fashionable feature. What's more, it is equipped with the widened padded shoulder strap, premium water resistant YKK zippers and UTX Duraflex buckles for stability and comfort."
