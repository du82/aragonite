["https://flashlight.nitecore.com/About/detail/ad/1298"]
title = "A Grand-Slam Milestone for NITECORE SRT9 to Be Named IDEA Finalist"
full_description = "The Industrial Design Society of America (IDSA) has recognized NITECORE SRT9 for the first time as Finalist in the prestigious International Design Excellence Awards (IDEA) 2018. It has been evaluated by IDEA Jury of 32 designers among over 1,600 entries across 20 categories based on their design innovation, user experience and product functionality. As the most innovative global leader of LED flashlights and chargers, the honor has made NITECORE as a result become the first brand in the professional lighting and illumination industry to receive all four grand international design prizes, along with the German iF Design Award, Red Dot Design Award and the Japanese G-Mark (Good Design). As the newest member in the SmartRing Tactical Series, NITECORE SRT9 is designed as all purposes applicable for law enforcement, hunting, search and rescue. The CREE XHP50 LED is capable of emitting an output of 2,150 lumens and a throw of 246 meters while efficiently reducing heat generation and energy loss to extend the LED lifespan. Besides the blazing white light output, it is also amazingly equipped with multi-colored LEDs (red, green, blue and ultraviolet), red-blue police warning signal, Strobe and Location Beacon modes in such a compact body. The unique 3rd generation Smart Selector Ring provides an easy user interface. The tactical Tail Switch offers momentary or constant illumination while rotating the Smart Selector Ring can switch between different special modes and brightness outputs. The flashlight can endure an excellent runtime of up to 250 hours when powered by 2 x 18650 / 4 x CR123 batteries. Benefiting from unibody die-casting technology, the body of SRT9 directly forms the interior space including the battery compartment and other fixing components in order to minimize its size and increase its portability. As a unibody die-cast flashlight, SRT9 is endowed with crafting techniques on a par with F1 car engines and spacecrafts providing a lightweight, rigid and fast cooling body. Integrated ATR technology allows SRT9 to keep working for long hours under high output. The streamlined and ergonomic body shape makes the flashlight extremely easy to grip. IPX8 ratings (2m submersible) and 1-meter impact resistance makes it all-weather applicable to the complex outdoor environment."
author = "Website Design HUNUO - http://www.hunuo.com"
