["https://flashlight.nitecore.com/About/release/cd/17/p/5"]
title = "LATEST RELEASE"
full_description = 'Weighing only 114g (4.02 oz) in a compact body, the MT2C Pro delivers 1,800 lumens with up to 520 meters long throw. It includes a 3,600mAh 18650 rechargeable battery featuring a USB-C port, runs on CR123/RCR123 batteries, and offers 2 brightness levels from a single button. The EDC25 is a 13.7mm (0.54") thick tactical flashlight equipped with dual UHi 20 LEDs, delivering up to 3,000 lumens and a beam distance of 300 meters. It also features a customizable button that allows users to switch between STROBE and TURBO. High Output Lightweight Rechargeable Headlamp NU45 features 8-core UHE LED to deliver 1,700 lumens and a throw of 172 meters. Equipped with a built-in 4,000mAh 18650 Li-ion battery and 14W fast charging, just one hour of charging keeps it shining for all night. The kit weighs 134g (4.73 oz) including the Carbon Battery™ 6K, a bracket, a headband, and a braided charging cable. It is designed to be compatible with select NITECORE headlamps. Equipped with 3 x UHi 40 MAX LEDs, the TM9K Pro is a high output self-defense tactical flashlight to emit an incredible output of 9,900 lumens with dual-stage tactical tail buttons and LUMIN SHIELD™.'
