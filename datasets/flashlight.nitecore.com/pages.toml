["https://flashlight.nitecore.com/About/detail/ad/2034"]
title = "Introducing the DL30 – Certified 100 Meters Submersible Dive Light"
full_description = 'NITECORE comes back to the diving field with its newly developed DL30 100 Meters Submersible Dive Light on January 13th, 2025. The DL30 is certified submersible in 100 meters depth. The thickened tempered glass with double-sided coating and the aero grade aluminum alloy construction with HAIII military grade hard-anodized finish provide all-round waterproof protection and qualify the DL30 as a reliable and durable underwater companion. The DL30 delivers robust lighting of 1,100 lumens and 788 meters long throw, and helps divers tackle with the changeable underwater environment with its strong penetrating capability brought by the 3° spot beam angle. Behind the excellent performance is the included NITECORE NL2153R 21700 USB-C rechargeable Li-ion battery to power the DL30 for up to 6 hours with its 5300mAh high capacity. Besides, the appropriate size and single button design of the DL30 offer divers one-handed and intuitive operation. Therefore, the DL30 is applicable to various diving scenarios and can escort divers to explore the ocean. Moreover, the DL30 comes with a wrist lanyard and a diffuser with lanyard to free divers’ hands and prevent loss of the flashlight. The diffuser with lanyard also creates more diverse use by turning the DL30 into an omnidirectional beacon light or a soft light. Additionally, the DL30 is equipped with various flashing frequencies which can be used in dive team grouping. Inspired by the notion to "Keep Innovating" as a global leader of LED flashlights and chargers with over 100 patents and a grand-slam award winner of the American International Design Excellence Awards (IDEA), German iF Design Award, Red Dot Design Award and the Japanese G-Mark (Good Design), NITECORE creates innovative products in a wide variety of fields and leads the industry in new standards of portability, aesthetic, output and functionality.'
