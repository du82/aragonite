full_description = "Mahjonggby The Mahjongg Team@mat on GNOME GitLabInstallOpen optionsDonateMahjongg in Light StyleMatch tiles and clear the board Single-player tile-matching game, commonly known as Mahjong solitaire. Tiles are stacked on the board at the start of the game. The goal is to remove all the tiles in as little time as possible. Select two matching tiles and they will disappear from the board, but you can only select a tile if there is an empty space to its left or right at the same level. Be careful: tiles that look alike may actually be slightly different. You can choose from a variety of starting layouts, some easy and some difficult. If you get stuck, you can ask for a hint, but this adds a large time penalty. Changes in version 47.225 days ago(Built 24 days ago)This release contains the following improvements: Fixed a regression making games needlessly difficult to solve SafeNo permissions; Auditable code; Software developer is verifiedCommunity builtThis app is developed in the open by an international community, and released under the GNU General Public License v2.0 or later.Get involvedInformationLinksStatisticsInstalled Size~3.93 MiBDownload Size3.33 MiBAvailable Architecturesx86_64, aarch64Installs88,624Tags:gamestrategypuzzleboardlinuxflatpak"
