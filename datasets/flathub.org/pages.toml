["https://flathub.org/apps/org.gaphor.Gaphor"]
title = "Install Gaphor on Linux | Flathub"
description = "Simple UML and SysML modeling tool"
full_description = "Gaphorby Arjan J. Molenaargaphor.orgInstallOpen optionsDonateThe Gaphor main windowSimple UML and SysML modeling tool Gaphor is a UML, SysML, RAAML, and C4 modeling application. It is designed to be easy to use, while still being powerful. Gaphor implements a fully-compliant UML 2 data model, so it is much more than a picture drawing tool. You can use Gaphor to quickly visualize different aspects of a system as well as create complete, highly complex models. Gaphor provides four modeling languages: UML, SysML, RAAML and C4 and makes them accessible to beginners. Changes in version 3.0.0about 1 month ago(Built about 1 month ago) Improved UI, based on user feedback from the University of Mannheim and Mainz. Double click on a model element in the Model Browser now selects the element on the open diagram. Edit settings have moved to global preferences. Added a small, neat style editor to get you started customizing the diagram style. UML Dependencies now show as relationships on package level. Internal changes: Data model changes: UML is now a completely separate model. This gives us the ability to implement models not based on UML, such as SysML v2. Models are now saved with their language/domain namespace. This allows for elements in different models to have the same name. Associations can now also contain subsets. This allows for relations in UML that were previously not possible. Bug fixes: Fixed file changed notification after save Fixed issues in Undo behavior Get more InformationPotentially unsafeHome folder read/write accessCommunity builtThis app is developed in the open by an international community, and released under the Apache License 2.0.Get involvedInformationLinksStatisticsInstalled Size~56.62 MiBDownload Size21.26 MiBAvailable Architecturesx86_64, aarch64Installs95,713Tags:umlraamlc4sysmldesigngraphlinuxflatpak"
