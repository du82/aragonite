full_description = "Voxel Paintby James William Fletchervoxdsp.comInstallOpen optionsVoxel Paint ScreenshotPaint in 3D using VoxelsMouse locks when you click on the game window, press ESCAPE or TAB to unlock the mouse. W,A,S,D = Move around based on relative orientation to X and Y. SPACE + L-SHIFT = Move up and down relative Z. Left Click / R-SHIFT = Place node. Right Click / R-CTRL = Delete node. Q / Middle Click = Clone texture of pointed node. R = Places node at your current position. E / F / Mouse4 = Toggle player fast speed on and off. 1-7 = Change move speed for selected fast state. X + C / Slash + Quote = Change texture of pointed node. T = Resets player state to start. G = Gravity on/off. P = Toggle pitch lock. F3 = Save. (auto saves on exit or idle for more than 3 minutes) F8 = Load. (will erase what you have done since the last save) F10 = Export the VoxelPaint data to a zip file in $HOME/EXPORTS. To multiselect click and drag with Middle Mouse or Q. Fill the nodes with B or delete them with N. Middle Scroll or X+C to change texture. V to paste selected nodes to pointed position. Arrow Keys can be used to move the view around. Your state is automatically saved on exit. You can customize the 17 block tileset, in your dataPath you will find a tiles.ppm image file, edit this file and save it as a PPM with a P6 272 16 255 header. Krita or KolourPaint can edit PPM files. Sensitivity as the 1st command line parameter default is 0.003 `./voxelpaintpro 0.003`. Changes in version 2.3.3over 1 year ago(Built 11 months ago)No changelog providedPotentially unsafeHome folder read/write accessCommunity builtThis app is developed in the open by an international community, and released under the GNU General Public License v2.0 only.Get involvedInformationLinksStatisticsInstalled Size~1.78 MiBDownload Size1.71 MiBAvailable Architecturesx86_64, aarch64Installs3,780Other apps by James William FletcherTux Fishing3D Fishing GameTuxocide3D FPS a war rages on in antarcticaAI Gene