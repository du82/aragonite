full_description = "Jupiiby Michal Koscieszamkiol.netInstallOpen optionsDonateJupii main windowPlay media on UPnP/DLNA devicesJupii let you play audio, video and image files on any device on your local network that supports UPnP/DLNA, such as smart speaker, smart TVs, gaming consoles, and more. In addition to the typical features you might expect from this type of application, Jupii also has some unique functionalities such as: support many different internet services as media source (Bandcamp, SoundCloud, YouTube and many more) live casting of video/audio from camera or microphone screen mirroring recorder that let you to extract music from Internet radio streams This app can be used in two different UPnP/DLNA modes: Playback control mode: Using Jupii, you connect to the player device (e.g. smart speaker) and transfer media from your phone/computer to this device. Media server mode: Using your playback device (e.g. smart TV), you browse and play media files shared by Jupii Changes in version 2.14.55 months ago(Built 4 months ago) A new option that let you switch between different User Interface styles. Different styles can improve readability on non-KDE Plasma desktops. Menu option for adding all files in the folder and subfolders to the play queue Drag and Drop support for adding files and folders to the play queue User Interface translated into Estonian language Fix: YouTube Music browser didn't work due to YouTube API change. Fix: Bandcamp search didn't work due to Bandcamp API change. Fix: Thumbnails of FLAC files were not displayed correctly. Fix: Track duration was not displayed when viewing Media Server content. Fix: User Interface glitches Potentially unsafeUser device access; Download folder read/write access; Can access some specific filesCommunity builtThis app is developed in the open by an international community, and released under the Mozilla Public License 2.0.Get involvedInformationLinksStatisticsInstalled Size~48.1 MiBDownload Size19.62 MiBAvailab