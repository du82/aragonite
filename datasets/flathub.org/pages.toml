["https://flathub.org/apps/org.mypaint.MyPaint"]
title = "Install MyPaint on Linux | Flathub"
description = "Painting program for digital artists"
full_description = "MyPaintby MyPaint DevelopersUnverifiedInstallOpen optionsPainting program for digital artists MyPaint is a fast, free, and easy graphics app for digital painters. It lets you focus on the art you make instead of the program you make it with. You can work on your canvas without clutter, and show the interface only when you need it. MyPaint works best with a graphics tablet. MyPaint’s brush engine is fast and almost infinitely configurable to simulate many natural media brushes or experimental ‘unrealistic’ ones. It ships with a variety of pre-made brushes by prominent artists, so you don’t have to configure your own if you don’t want to. Changes in version 2.0.1almost 5 years ago(Built 4 months ago)For those who primarily use the 2.x mode (the default mode), this is an important upgrade. A color conversion function in the v2.0.0 release has an error that can (and usually will) cause image degradation over multiple save/load cycles. Big thanks to gwojcik for noticing and fixing this. The 1.x mode has not been affected by this. HSV/HCY brush dynamics in 2.x mode fixed. Undo/Redo stack size made configurable and more efficient. Undo/Redo stack default size increased to 40. Rounding error when saving files in 2.x mode fixed. Invalid l11n strings fixed. Translated strings added/updated for several languages. Dependency on intltool removed (still required for libmypaint). Variables in l11n strings validated on build (xml tags are not validated yet, however). libmypaint translations are now bound, making them work properly in the appimages. OARS rating added to appdata (relevant for app-distribution software, but not much else). A number of Py3 compatibility issues were fixed. Svg icons fixed - some were previously considered invalid by librsvg >= 2.48. Svg icon sizes reduced across the board. Typos in documentation fixed (not user-facing typos). Potentially unsafeHome folder read/write access; Legacy windowing systemCommunity builtThis app is developed in the open by an international community, and released under the GNU General Public License v2.0 or later.Get involvedInformationLinksStatisticsInstalled Size~82.99 MiBDownload Size27.59 MiBAvailable Architecturesx86_64, aarch64Installs57,592Tags:linuxflatpak"
