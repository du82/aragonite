title = "Install Godot Engine on Linux | Flathub"
description = "Easily create 2D and 3D games"
full_description = "Godot Engineby The Godot Engine CommunityUnverifiedInstallOpen optionsDonateTexture ViewerEasily create 2D and 3D gamesNOTE: This Flatpak is unofficial and not supported by Godot Engine developers. Find officially supported binaries on godotengine.org. The feature-packed, cross-platform game engine to create 2D and 3D games from a unified interface. Godot Engine provides a comprehensive set of common tools, so that you can focus on making games without having to reinvent the wheel. Games can be exported in one click to a number of platforms, including the major desktop platforms (Linux, macOS, Windows) as well as mobile (Android, iOS), web-based (HTML5) platforms and consoles (Switch, PS4 and Xbox One - via thirdparty publishers). Completely free and open source under the very permissive MIT license. No strings attached, no royalties, nothing. Your game is yours down to the last line of engine code. Godot's development is fully independent and community-driven, empowering you to help shape the engine to match your expectations. It is supported by the non-profit Godot Foundation. Create games with ease, using Godot's unique approach to game development: Nodes for all your needs. Godot comes with hundreds of built-in nodes that make game design a breeze. You can also create your own for custom behaviors, editors and much more. Flexible scene system. Create node compositions with support for instancing and inheritance. Visual editor with all the tools you need packed into a beautiful and uncluttered context-sensitive UI. Friendly content creation pipeline for artists, level designers, animators and everything in between. Persistent live editing where changes are not lost after stopping the game. It even works on mobile devices! Create your own custom tools with ease using the incredible tool system. Current limitations of this Flatpak version: For C#/Mono support, install org.godotengine.GodotSharp instead: https://flathub.org/apps/org.godotengine.GodotSharp External script editors are supported, but you need to follow the steps described here: https://github.com/flathub/org.godotengine.Godot#using-an-external-script-editor Godot 4's Blender importer is supported, but Blender needs to be installed on your system and you need to follow the steps described here: https://github.com/flathub/org.godotengine.Godot#using-blender For projects using text-to-speech, make sure speech-dispatcher is installed on your system, so that this Flatpak can access it. Changes in version 4.43 days ago(Built about 21 hours ago)No changelog providedPotentially unsafeUser device access; Full file system read/write access; Can access some specific files; Legacy windowing system; Arbitrary permissionsCommunity builtThis app is developed in the open by an international community, and released under the MIT License.Get involvedInformationLinksStatisticsInstalled Size~142.83 MiBDownload Size67.25 MiBAvailable Architecturesx86_64, aarch64Installs230,937Other apps by The Godot Engine CommunityGodot Engine (C#/.NET)Easily create 2D and 3D gamesGodot 3Easily create 2D and 3D gamesGodot 3 (C#/.NET)Easily create 2D and 3D gamesTags:linuxflatpak"
