full_description = "Aqueductsby Endless Studiosendlessnetwork.comInstallOpen optionsA cosy villageHack your way to saving the dayAll the water has disappeared from your village and it's up to you to save the day! Go on an adventure to connect the water pipes and bring water back to your village. Solve puzzles and hack your way through 15 levels of fun and challenging islands. You may discover that you'll learn some things along the way… Level up your coding skills by learning and practicing variables, conditionals, loops, debugging, JavaScript, math, step by step, booleans, logical sequencing, and more. The goal on each level is to connect all the pipes together. When near a pipe, “hack” it to rotate and connect it to other pipes. Once this is done, a door appears. To reach the door, the character may have to hack other objects like platforms and bridges to change their position and scale. This may include changing water between ice, liquid, and steam to access different areas. The water must be in liquid form for the pipes to work. If the character ever ends up in a bad place, they will be reset to the nearest surface with no bad consequences. Important controls: Move Mateo: Tap the mouse or trackpad on the screen Restart Button: Restart the level from the beginning Pause Button: Open options to change audio/continue level/return to level selection Eye Button: Click the eye in the bottom right to highlight hackable objects Token Button: See which code tokens you have used in the current level Zoom In/Out: Scroll the mouse wheel Hacking objects: Right-click on white highlighted objects to see and change their code. Mateo needs to be close enough to the object. Red highlight means an object is too far. While hacking, any text with a box can be changed by tapping the box and selecting an option. Changes in version 1.2.2over 5 years ago(Built 11 months ago)No changelog providedPotentially unsafeLegacy windowing systemProprietaryThis app is not developed in the open, so