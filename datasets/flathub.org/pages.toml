full_description = 'Color Pickerby Christopher DavisUnverifiedInstallOpen optionsThe picker and the color paletteChoose colors from the picker or the screen Ever wanted to know the value of that color on your screen? Color Picker enables you to pick the color from any pixel on your screen. It also offers a palette, so that you can easily mix and match a couple of colors together. When you have found the perfect combination of colors, naturally you want to save them. Color Picker allows you to conveniently save and retrieve colors. Color Picker is a color selection dialog written in GTK 3. It is much alike Gcolor2, but uses the newer GTK version and other modernisations to better integrate into your modern desktop. Changes in version 2.4.0over 4 years ago(Built 10 months ago) Gcolor3 is now "Color Picker"! With the rename comes a new maintiner, a new icon, lots of new improvements, and many translation updates. Color Picker now works on Wayland! The typography and iconography of Color Picker has changed to be consistent and more in line with the GNOME HIG. The use of deprecated GTK APIs has been dropped, which will make porting to GTK4 a smooth process. Multiple other under-the-hood improvements SafeNo permissions; Auditable codeCommunity builtThis app is developed in the open by an international community, and released under the GNU General Public License v2.0 or later.Get involvedInformationLinksStatisticsInstalled Size~614 KiBDownload Size344.58 KiBAvailable Architecturesx86_64, aarch64Installs110,176Other apps by Christopher DavisSolanumBalance working time and break timeTags:colorpickerpalettelinuxflatpak'
