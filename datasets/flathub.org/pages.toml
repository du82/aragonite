full_description = "About Flathub: The Linux App StoreWhether you're a user looking for apps or a developer looking to reach more users, Flathub is the best choice for apps on Linux.UsersAll the apps you want — From big names you'd expect to fresh indie developers, Flathub has thousands of apps to meet your needs.Transparent safety — Clearly see when an app is verified as coming from its developer, what permissions it requires, and whether or not it's open source and auditableTastefully curated — Discover interesting, quality apps across Flathub with our staff curation that showcases the best on offerApps for you where you are — Whether you're on a Steam Deck, a powerful Linux workstation, a Raspberry Pi, or the rare Linux phone; Flathub has apps for youSetupGet appsDevelopersReach millions of users — Flathub comes out of the box on multiple Linux distros, is on the rest, and has over a million active usersIndependent & transparent — We're a grassroots open source community stewarding the best of what the ecosystem has to offerClear docs & guidance — Extensive documentation, thousands of public app manifests, and a large community means you're always able to get helpNative app store integration — Forget web downloads; Flathub delivers apps and automatic updates to users in their native app store client where they'd expectPublish Your AppGet in touchPressWe're always happy to answer questions from and arrange interviews with journalists and tech writersRead announcementsDownload Press KitContact for press inquiriesReporting issuesWe take security reports and legal issues very seriouslyReport an IssueDevelopers & UsersConnect with the team and other members of the community to ask questions and share your expertiseJoin Discourse forumChat on MatrixAcknowledgementsFlathub wouldn't be possible without the generous support of the following organizations and individuals.Organizations & InfrastructureCodethinkCloud Native Computing FoundationFastlyMythic BeastsPrerender.io