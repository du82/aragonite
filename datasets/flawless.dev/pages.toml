["https://flawless.dev/docs/installation"]
title = "Installation"
description = "How to install flawless and the `cargo-flw` command."
full_description = "(Dec. 9th 2024) Flawless Beta 3 is here. Try it out! flawless.dev docs replay discord Installation Introduction Setup Installation Your First Workflow Integration with Rust Workflows Fundamentals API Reference Server CLI HTTP API Advanced Idempotence Installation Flawless is supported on Windows (x64), Linux and macOS (x64 & arm64). The Flawless server exposes an HTTP API and workflows can be triggered and queried from any programming language through this API. The workflows itself are written in Rust. This means that you will need the Rust compiler and tooling to develop the workflows. Installing Rust The easiest way to get Rust is by using the rustup tool. If you are running an unix-like OS, all you need to do is run: $ curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh For more installation options check out the rustup website. Adding the WebAssembly target Flawless workflows are compiled to WebAssembly before they are executed. This allows them to be portable and run on different CPU architectures and operating systems, no matter on which one they were created. To add the WebAssembly compilation target for Rust run: $ rustup target add wasm32-unknown-unknown Installing Flawless The flawless binary can be downloaded on Unix system with: $ curl -fsSL https://flawless.dev/install.sh | sh or on Windows systems with: $ irm https://flawless.dev/install.ps1 | iex License Closed source The flawless binary (installed with the previous command) is free to use, but only distributed as a closed source binary. Open source The flawless library and all supporting libraries for creating workflows, like flawless-http or flawless-utils, are released under the BSD-2-Clause-Patent open source license. Next step You are now all set to write your first workflow."
