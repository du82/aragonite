["https://flawless.dev/essays/when-letting-it-crash-is-not-enough"]
title = 'When "letting it crash" is not enough'
description = """
This essay explores the connection between Erlang's process supervision,              state management and durable execution."""
full_description = '''(Dec. 9th 2024) Flawless Beta 3 is here. Try it out! flawless.dev docs replay discord When "letting it crash" is not enough When it comes to computer systems, The Erlang/OTP programming platform has an interesting approach to failure handling. It's also widely known under the name "let it crash". The core idea behind it has to do with the fact that modern applications have a huge number of states that they can find themselves in. The more complex your application is, the more variables you need to keep track of everything. Eventually it becomes impossible for developers to predict all combinations of state that these variables will form. Once your app gets into an undesirable state, the best thing you can do is to reset it and start from a fresh, well known and correct state. This works amazingly well together with Erlang's property that each process has a separate memory space. Allowing us to selectively reset only parts of our application, while keeping the system as a whole running. Then we can divide the application into a tree-like structure and keep restarting parts of it until we reach the root and are forced to restart the whole thing. This concept is also known as supervision trees. If you take a closer look at Erlang's approach, this is exactly what a human would do. If your phone gets stuck playing a video, you will try restarting the app, and if this doesn't fix it, you might end up restarting your phone. Or even the router of your home internet connection. You intuitively know that propagating the failure through your home will eventually bring all devices into a state that resembles the one when you first set everything up and everything was working. Even sometimes Erlang's claims around resilience and fault tolerance are a bit overblown, I still think that it's a very powerful way to deal with failure. If my web app breaks, the first thing I do is to restart the server. In the majority of cases this immediately fixes the issue, while I dive deeper into the logs trying to figure out what went wrong. Having this automatic restarting capability at every level of abstraction in your app, will definitely help you sleep better. However, resetting the state is almost never enough. In the phone example, once the phone starts up again, you still need to get back into the state where you stopped. This usually means finding the video again and jumping back to the right point on the timeline. We are partially reconstructing the state where we stopped, but ignoring all the other state where things might have gone wrong, like our home internet connection being broken. For humans, it's easy to approximately remember where we stopped watching a video, but for an application it's impossible to reconstruct the state without the developer explicitly keeping track of it. How to snapshot your state, where to store it and how often to do it, are very difficult questions. Even with very frequent snapshots, with my luck, it would probably fail in between snapshots and result in data loss. The only way of having total confidence in such a system is if every state change is captured. Durable Execution This brings me to a recent discovery I made, another approach to dealing with failure that completely blew my mind 🤯. It's commonly known under the name durable execution, and it's an elegant solution to the "keeping track of state changes" problem, and perfectly complements Erlang's approach. The simplest way of thinking of it is as a database for compute progression. It stores the minimal amount of data to be able to reconstruct your application's sate at any time. It makes your local variables indestructible, and for many scenarios you will not even require a traditional database anymore. Imagine if you could just start an arbitrary computation and the system guarantees that it will run until completion and all the operations will be performed exactly once. Even if your app needs to be restarted in the middle. Or even if you need to stop the computation, move it to a different machine and continue. Your running code suddenly becomes this tangible thing, that you can look at, move and play with. Durable execution is more of a general purpose technology that can be used for different use cases, like transactions across distributed services, or very long-running jobs (months), but the underlying guarantees also make it the ultimate tool to create snapshots for picking up where you stopped in case you need to partially restart your system. I have been working on my own engine for durable execution called flawless. It implicitly keeps a log of side effects, so that you always can reconstruct the latest state and pick up where you left off. It's still in private alpha, but I hope to soon open it up and share with everyone. ~ Bernard'''
author = "Bernard Kolobara"
year_published = 2025
