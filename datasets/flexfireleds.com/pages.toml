["https://flexfireleds.com/endeavor-120v-cove-light"]
title = "Endeavor™ 120V Cove Light Fixture - Color Temperature Selectable"
description = """
LED Strip Lights                            Powerful linear lighting in a variety of colors and brightnesses for architectural, residential, and commercial applications."""
full_description = '''Description >SPECIFICATIONS >Compatible Products&nbsp;&nbsp; dir="ltr">FAQ style="text-align: left;">DOWNLOADS Reviews Endeavor™ 120V Cove Light Description: The Endeavor™ 120V Cove Light can be directly connected to an AC input, eliminating the need to purchase additional drivers. It’s designed to provide bright, diffused lines of light that are perfect for both task and general lighting. The fixture is color selectable, so you can set your fixtures to emit 3000K, 3500K, or 4000K white light. The fixture's adjustable mounting brackets make it easy to give you control over the desired angle of the light in your space. While this product excels in illuminating coves, there are many other applications we recommend such as in the rafters of high ceilings, wall washing, long corridors, stairwell lighting, uplighting beams, floating ceilings, and much more. Creating beautifully lit coves has never been easier. Simply plug the fixtures into 120V AC power and daisy chain up to 30 ft of light bars together in one run. Its easy installation works well in retrofit applications that may have previously housed linear fluorescent lighting. This product is offered in 1 ft or 2 ft lengths. Both options work seamlessly together with extension cables or end-to-end connectors. Its premium diffusion level makes it ideal for installations that require dotless lines of light, and the high lumen output makes it a solid bet for ambient lighting with excellent color rendering. Adding Accessories: Important: A power cable is required, but is not included with this product, as only the first fixture in the run needs a power connector. Please visit our Endeavor™ 120V Cove Light Accessories page to select the right connector for your application. You will need to purchase a power cable of your choice for either a plug and play installation or a hardwired installation. The following lights that are daisy chained can connect directly unit to unit or with a Jumper Cable connector that is sold separately. Easy Installation: Top Features and Benefits: ✔ Premium diffusion with no visible dots ✔ 120 degrees beam angle ✔ Ability to daisy-chain multiple fixtures together up to 30 feet ✔ Dimmable with select 120V dimmers ✔ Color Rendering Index (CRI) values of over 93 and high R Values Why Choose Endeavor™ 120V Cove Light? Choose the Endeavor™ 120V Cove Light to achieve driverless installations of long runs of lights up to 30ft by powering directly from 120VAC and connecting multiple 1ft and 2ft light bars. No need to choose the color temperature in advance, you can choose right before installing them by selecting between 3000K, 3500K or 4000K without compromising brightness. Adjust light to the desired mounting angle from 0 up to 90 degrees so you can fulfill your exact vision for the project. Applications and Use: These light fixtures are installed in a wide variety of applications including: Specifications: ✔ 120VAC / 50~60 Hz input voltage ✔ 10W for 1ft fixture / 20W for 2ft fixture ✔ Up to 1043 lm/ft for 1ft fixture / 1,960 lm/ft for 2ft fixture ✔ Efficacy up to 104 lm/W for 1ft fixture / 94 lm/W for 2ft fixture ✔ High CRI of 93+ ✔ Max run length in series ∼30ft (300W) ✔ 120° beam angle ✔ IP20-rated for indoor use ✔ White powder-coated aluminum housing ✔ Ambient Temperature: -4°F to 122°F (-20°C to 50°C) ✔ Operating Temperature: -4°F to 158°F (-20°C to 70°C) ✔ 5-year warranty Endeavor™ 1FT Light Bar Weight: 0.72 lbs (.33 kg) Product Dimensions: 12.4" x 1.1" x 1" (315 x 28 x 25 mm) Product SKU Color - CCT Watts / Foot Lumens / Fixture Luminous Efficacy CRI TLCI Gamut Score Relative Filedity Score END-MULTI-120V 3000K 10 W/ft 941 lm 94 lm/W 93 91 97 92 END-MULTI-120V 3500K 10 W/ft 1,043 lm 104 lm/W 94 93 98 91 END-MULTI-120V 4000K 10 W/ft 1,035 lm 104 lm/W 93 92 97 91 Endeavor™ 2FT Light Bar Weight: 1.35 lbs (.61 kg) Product dimensions: 24.4" x 1.1" x 1" (620 x 28 x 25 mm) Product SKU Color - CCT Watts / Foot Lumens / Fixture Luminous Efficacy CRI TLCI Gamut Score Relative Filedity Score END-MULTI-120V 3000K 20 W/ft 1,705 lm 85 lm/W 93 91 97 92 END-MULTI-120V 3500K 20 W/ft 1,960 lm 98 lm/W 94 93 98 91 END-MULTI-120V 4000K 20 W/ft 1,882 lm 94 lm/W 93 91 97 90 Compatible Products: Dimmers Lutron Caseta Wireless In-Wall Dimmer 250W - PD-5NE-WH Connectors Endeavor™ Connectors and Accessories Endeavor™ 120V Cove Light FAQ: Q: Do I need an AC/DC driver to power this product, like your strip lights? No. Because this is a 120V LED product, no additional power supplies are required. You will, however, need to purchase a power cable of your choice for either a hardwired or plug-and-play installation as the power cables are not included. Please keep in mind that in order to meet UL requirements, hardwiring this product requires the Endeavor™ Junction Box. Q:What is CRI and TLCI and why should I care? Color Rendering Index (CRI) measures how colors are correctly rendered under a light source in comparison to natural sunlight. The index is measured on a 0-100 scale with 100 being a perfect rating of color accuracy, meaning the colors appear as they naturally would under unadulterated daylight. The bottom line: the higher the CRI, the higher quality is the light source. 95 - 100 → Phenomenal color rendering. Colors appear as they should, subtle tones pop out and are accented. All skin tones look beautiful and art comes alive as backsplashes and paint show their beautiful, full saturation. 90 - 95 → Great color rendering! Colors pop out, look vibrant and are easily distinguishable. Noticeably great lighting starts at a CRI of 90. 80 - 90 → Good color rendering. Though most colors will render well, you may not see items as fully saturated as you would like, but most people will not notice. 60 - 75 → Poor color rendering. Items and colors look desaturated, dull, toneless, and at times unidentifiable (cannot see the difference between black and navy-colored socks). Q: What is the maximum run length of the Endeavor™ 120V Cove Light fixtures before voltage drop? The maximum continuous line of lighting in series is 300W worth of cove fixtures in any combination of 1 foot or 2 foot fixtures which comes up to about 30 ft of lighting. Q: Is this product dimmable? The Endeavor™ 120V Cove Light fixtures are dimmable with select dimmers only. A buzzing sound may occur when using a dimmer with this product. Q: Is this product dynamic or tunable? How do I change the color of white? No, this type of cove light is color selectable but not dynamic or tunable. There is a switch located on the side of the fixture that enables you to select from three colors of white 3000K, 3500K or 4000K. To make sure all your lights look the same, make sure that all the fixtures you will be installing are set to the same setting you desire (3000K, 3500K, or 4000K) before installing in hard to reach areas. Q: What is the product warranty? Because of our unyielding confidence in the quality of our product, we offer a 5-year warranty on our Endeavor™ 120V Cove Light. For more info, please read our warranty policy. Q: Is there an outdoor option? No, we do not have an outdoor version of the Endeavor™ 120V Cove Lights. However, we have many other high-quality outdoor IP65-rated LED strip lights you can choose from. Q. Can I connect Endeavor™ 1FT bars with 2FT bars? Yes, you may connect 1FT bars with 2FT bars and mix and match as you please. The maximum run length before voltage drop will be up to 30 ft approximately or 300W. Downloads: User Guide - Data Sheet Endeavor™ 120V Cove Light Product User Guide IES 1FT Light Bar IES | 2FT Light Bar IES Photometric Reports 1FT Light Bar 3000K | 3500K | 4000K 2FT Light Bar 3000K | 3500K | 4000K Goniophotometer Reports 1FT Light Bar | 2FT Ligt Bar'''
