full_description = "Description >SPECIFICATIONS >COMPATIBLE PRODUCTS >FAQs >DOWNLOADS Reviews Leona® RGB HDMI Sync Box TV Kit Description: Ever dreamed of being inside a movie or right there in the stadium during a game? Now, you can do both from the comfort of your living room with the new Leona® RGB HDMI Sync Box TV Kit, our latest game-changer for watch parties and immersive home entertainment. Sync your built-in RGB pixel strip to the colors and sounds of your favorite video game or TV show—all in real time! You can also choose from thousands of static hues and dynamic modes in the Leona® Smart App to support your team or add a stylish accent glow to your room. The best part? This RGB backlighting kit is totally DIY. Simply plug it into your gaming console, Blu-ray player, or any HDMI device, and let the magic happen—or ask Google Home or Alexa, as it's 100% smart-home-ready. Please keep in mind that an external HDMI device is required to use this system; it cannot be connected directly to your TV. Why Choose our Smart TV Backlighting Kit? Syncs with your TV screen or monitor delivering real-time color matching and dynamic lighting effects for immersive viewing. Control lighting settings, colors, and modes through advanced control options using the Leona® Smart app. Enjoy preset and customizable lighting modes to suit various preferences. Simple plug-and-play installation including strong adhesive backing and mounting clips. Reduces eye strain and improves screen contrast for an enhanced viewing experience. Note: The Leona® RGB HDMI Sync Box TV Kit is controlled exclusively via the Leona® Smart app. The app is available on the iOS App Store or Google Play Store. Specifications: TV Size Compatibility: 55-65 inch Power Supply Input Voltage: 100-240V AC 50/60Hz Power Supply Output Voltage: 12V DC Control Protocol: SPI Signal Type: Wi-Fi/Bluetooth Operating Frequency: 2.4 GHz Strip Light Length: 12.5 ft (3.8 m) Strip Light Wattage: 24W Max LED Size: 5050 Number of LEDs: 114 Dimmable IP Rating: IP20 HDMI: HDCP 2.2 Video resolution, HDR Dolby Vision Supports 4K@ 60Hz, HDR 10+ Warranty: 3 Years Certifications: Compatible Products: Leona® Smart Home Products Leona® Smart Home Products Leona® Digital Controller FAQs Q. Can I connect this kit directly to my TV? No, an external HDMI device is required to use this system; it cannot be connected directly to your TV. This device is connected to the Sync Box which synchronises the image information of the input video device with the lights. Q. If I don’t have an HDMI device, can I still use this as a backlighting TV kit? Yes, this kit will work with the Leona® Smart App and you can still use third party integrations such as Google Home and Amazon Alexa. You can select the color combination of your preference and enjoy an enhanced viewing experience with your favorite colors! However, it won’t sync to the colors of the TV. Q. Can I still use this backlighting TV kit if I have a TV smaller than 55 inches or a TV larger than 65 inches? Though this system was designed for screens between 55 and 65 inches, we’ve tested it on smaller and larger TVs so you don’t have to. If you have a smaller TV, you’ll have to accommodate the extra strip light on the back of the TV since this system is not cuttable. If your TV is larger than 65” simply center the strip light as best you can (works with TVs up to 75”). The accuracy of the sync and chase/pattern functions on the back of the screen will vary depending on the screen size; smaller or larger screens may show less accurate results. Q. Can I cut the LED strip light if I have a smaller TV? No, the LED strip light cannot be cut because it comes with pre-soldered wires from the vendor, allowing you to make turns around corners. Need assistance with your project or purchase? Our design specialists are ready to help. Contact Us Downloads: Installation Guide General LED Strip Installation Guide Specification Sheet Leona® RGB HDMI Sync Box TV Kit Data Sheet"
