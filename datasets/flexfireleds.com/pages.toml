description = """
LED Strip Lights                            Powerful linear lighting in a variety of colors and brightnesses for architectural, residential, and commercial applications."""
full_description = 'Description >SPECIFICATIONS >Compatible Products&nbsp;&nbsp; dir="ltr">FAQ style="text-align: left;">DOWNLOADS Reviews ClickBright™️ LED Linkable Light Bars ClickBright™ light bars provide a simple and effective lighting solution perfect for projects requiring a mid-output light versatile enough to work as task lighting and accent lighting. These bars can be linked up to 16’ in continuous runs, and can be installed with L connectors to go around corners without interrupting the line of light. The cover on these bars guarantees a smooth, spotless line of light that can also be dimmed as needed. These bars are lightweight yet durable and have a 5-year warranty. Top Features and Benefits: ✔ Easy plug and play ✔ Attach additional bars and connectors with a click ✔ Mix and match 1FT and 2FT bars as you please ✔ Flicker-free uninterrupted lighting ✔ Fully diffused lighting ✔ CRI 94+ for perfect color rendering ✔ Slim lightweight design ✔ Durable and long-lasting Available Colors (CCTs): Choose ClickBright™ bars if you want to... Have the easiest and fastest lighting solution available Save a staggering amount of time Have clean, top-grade lighting without the fuss Want beautiful lighting that fully renders colors as they should naturally be Applications and Use: These light bars are installed in a wide variety of applications including: • Under cabinets • Above cabinets • Gondola lighting • Behind and under shelving • Backlighting • Kitchen lighting • Display lighting • Off grid lighting • Bed or headboard lighting • Trade shows Specifications: ✔ Bars available in 1ft (30cm) or 2ft (58cm) ✔ High CRI up to 98 ✔ High TLCI up to 98 ✔ Efficacy up to 104 Lumens/Watts ✔ 24V DC input ✔ 4014 SMD chips ✔ 48 LEDs per foot ✔ IP20-rated ✔ Width: ½” (12.6mm) / Height: ⅜” (10mm) ✔ 50,000 hour lifespan (8 hours/day for 17 years) ✔ 5-year warranty ✔ Operating temperature: -4ºF to 104ºF (-20°C to 40°C) ✔ 120° beam angle ClickBright™ 1FT Bar Maximum run length in series: 10’ (3m) High output up to 493 Lumens/Fixture Weight: 0.14 lbs (.06 kg) Product SKU Color - CCT Watts / Fixture Lumens / Fixture Luminous Efficacy CRI TLCI Gamut Score Relative Fidelity Score CLK-01-27K 2700K 4.3 W 416 lm 83 lm/W 98 98 100 95 CLK-01-30K 3000K 4.3 W 404 lm 90 lm/W 94 94 98 92 CLK-01-35K 3500K 4.3 W 478 lm 105 lm/W 95 97 98 91 CLK-01-40K 4000K 4.3 W 446 lm 96 lm/W 94 94 99 92 CLK-01-50K 5000K 4.3 W 493 lm 103 lm/W 96 97 98 91 ClickBright™ 2FT Bar Maximum run length in series: 16’ (4.8m) High output up to 917 Lumens/Fixture Weight: 0.23 lbs (.10 kg) Product SKU Color - CCT Watts Lumens / Fixture Luminous Efficacy CRI TLCI Gamut Score Relative Fidelity Score CLK-02-27K 2700K 8.6 W 735 lm 81 lm/W 98 98 99 92 CLK-02-30K 3000K 8.6 W 856 lm 93 lm/W 94 94 98 91 CLK-02-35K 3500K 8.6 W 917 lm 105 lm/W 95 97 100 95 CLK-02-40K 4000K 8.6 W 870 lm 96 lm/W 94 94 98 92 CLK-02-50K 5000K 8.6 W 900 lm 103 lm/W 96 97 98 91 Certifications: Light Bar Kits Purchase a complete kit with all the components needed: Hardwired Kit with a wall dimmer Plug and play kit with on/off or smartphone integration Dimmers and Home Automation Compatible Dimmers and Controllers Connectors ClickBight Connectors and Accessories Power Supplies Non Dimmable Drivers Flexfire LEDs® Plug-in Power SupplyMean Well™ HLG and LPV Hardwired Power Supplies Dimmable Drivers Zurik® Universal Dimmable DriverZurik® EMLV Dimmable LED DriverLutron Hi-Lume Dimmable Driver ClickBright™ Light Bar FAQ: Q: What is the difference between an LED strip light and LED light bar? LED strip lights are flexible tape lights that are made with soft circuit boards and an adhesive backing. These two main features allow the strip lights to be bent, cut and mounted with ease. In contrast, LED light bars have a rigid PCB with the channel and connectors already built into the product. This guarantees seamless glows of light and extremely fast and easy connections. Q:What is CRI and TLCI and why should I care? Color rendering index (CRI) measures how colors are correctly rendered under a light source in comparison to natural sunlight. The index is measured on a 0-100 scale with 100 being a perfect rating of color accuracy, meaning the colors appear as they naturally would under unadulterated daylight. The bottom line: the higher the CRI, the higher quality is the light source. 95 - 100 → Phenomenal color rendering. Colors appear as they should, subtle tones pop out and are accented. All skin tones look beautiful and art comes alive as backsplashes and paint show their beautiful, full saturation. 90 - 95 → Great color rendering! Colors pop out, look vibrant and are easily distinguishable. Noticeably great lighting starts at a CRI of 90. 80 - 90 → Good color rendering. Though most colors will render well, you may not see items as fully saturated as you would like, but most people will not notice. 60 - 75 → Poor color rendering. Items and colors look desaturated, dull, toneless, and at times unidentifiable (cannot see the difference between black and navy-colored socks). Television lighting consistency index (TLCI) , a newer method to measure color performance and accuracy, uses software to compare colors to a standardized sample on a 0-100 scale. Mainly used in production, film, and photography, it is a great tool to measure the quality of the light emitted from a source. 85 - 100 → Errors are so minuscule that corrections would not be necessary. 75 - 85 → Room for improvement. An acceptable result is easily achievable. 50 - 75 → A colorist would want to correct the errors for an acceptable result, but it would take a long time to get there. 25 - 50 → Poor color rendering needing much improvement from a good colorist, but the result would not meet broadcast standards. 0 - 25 → Very bad color rendering needing drastic improvements from a good colorist, but the result would not be acceptable. Q: What is the product warranty? Because of our unyielding confidence in the quality of our product, we offer a 5-year warranty on our ClickBright™ Light Bars. For more info, please read our warranty policy. Q: What is color temperature (CCT)? The color of light can be quantified by referring to its color temperature. White light is measured in Kelvins (K). Most white lights fall in a spectrum between 1800K and 6200K. When dropping below 3000K, the light becomes noticeably warmer. On the other end of the spectrum, the lights become cooler and emit a blue-ish tint as they rise above 6500K. It is important that you choose a color temperature that compliments the style, mood, or intention of your space. We recommend using warmer tones for accent or ambient lighting while using cooler tones in high-traffic, industrial or task-specific areas. Speak to one of our lighting experts if you need guidance. Q:What is the lifespan of your lights? Our lights have been rigorously tested and have an expected lifespan of 50,000 hours before dropping to 70% luminosity. This means that if you were to use your lights 12 hours a day, every day, the lights would be expected to last longer than 10 years. Even after that time has elapsed, the lights will maintain a brightness of 70%. Higher-output strips require a heat sink to reach the expected lifespan and beyond. Q: What are lumens (lm)? This is a quantifiable amount of light produced by an LED strip or other light-producing product, as seen by the human eye. In other words, this is one way we can measure how much light is produced. When comparing LED strip lights, you want to compare the lumen output as well as the CRI, watts/foot, warranty, and bin selection. Q: Is there an outdoor option? No, we do not have an outdoor version of the ClickBright™ Light Bars. However, we have many other high-quality outdoor IP65-rated LED strip lights you can choose from. Q: What is the maximum run length of the ClickBright™ light bars before voltage drop? The maximum run length of the ClickBright™ 1FT bar is 10’ (3m), while maximum run length for the 2FT bar is 16’ (4.8m). In other words, the maximum run length in series for both bars is up to 10 connections. However, you can create parallel connections from a single power supply and split the runs in different directions. Q. Can I connect ClickBright™ 1FT bars with 2FT bars? Yes, you may connect 1FT bars with 2FT bars and mix and match as you please. The maximum run length before voltage drop will be up to 10 connections. Q: Can I cut the lights myself? No, ClickBright™ light bars are not cuttable. Q: What is a 4014 SMD LED chip? The number 4014 refers to the size of the chips, which measures at 4.0mm x 1.4mm. Click here for more information on LED chip sizes. Q: What is the importance of ETL Listed? Electrical Testing Laboratories (ETL) is a testing and certification division that rigorously tests products to ensure safety and quality. ELT Listed products indicate that the tested product has been found in compliance with accepted national standards.. Q: What is the importance of RoHS Compliant? Restriction of Hazardous Substances (RoHS) restricts the use of 10 hazardous materials commonly found in electrical and electronic products. Being compliant with RoHS standards is necessary for all sales and distribution to meet safety standards. Q: What is Title 24 JA8? Title 24 JA8 is the California Building Standards Code that sets the new standard for energy efficient lighting for residential and commercial buildings. Its purpose is to ensure the state has a healthy, safe and reliable source of energy by reducing energy costs and environmental impacts of energy use. Color temperatures 4000K and below can be used to comply with California Title 24 JA8. Downloads: User Guide - Data Sheet ClickBright™ Light Bar Product User Guide IES / LDT Files 2700K IES / LDT | 3000K IES / LDT | 3500K IES / LDT | 4000K IES / LDT | 5000K IES / LDT Photometric Reports 2700K | 3000K | 3500K | 4000K | 5000K Goniophotometer Reports 1ft Light Bar 2700K | 3000K | 3500K | 4000K | 5000K 2ft Light Bar 2700K | 3000K | 3500K | 4000K | 5000K'
