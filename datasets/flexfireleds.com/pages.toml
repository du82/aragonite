["https://flexfireleds.com/pages/FAQ.html"]
title = "Best LED Strip Light FAQ  - Flexfire LEDs Frequently Asked Questions"
description = """
LED Strip Lights                            Powerful linear lighting in a variety of colors and brightnesses for architectural, residential, and commercial applications."""
full_description = 'Categories LED Strip Lights LED Strip Light Kits Aluminum Mounting Extrusions LED Power Supplies Dimmers, Amplifiers, and RGB Controllers View All Customer Service Customer & Partner Sign In / Account Longest LED Strip Warranty Shipping & Returns ADA Accessibility Policy OEM Partner Signup Contractor Discount Program Contact Us Toll Free Number: +1-844-353-9347 Local Number: +1-925-273-9080 Info: info@FlexfireLEDs.com Flexfire LEDs, Inc 3554 Business park drive, suite F Costa Mesa, CA 92626 FAQ FAQ - Frequently Asked Questions If you cannot find your answer here try our LED Knowledge Center! If you still cannot find your answer, please email us. FAQ Website and LED Terminology LED Strip Lights The Basics Product Quality Outdoor Rated Strip Lights: IP65 & IP68 Specific Use Case Questions Standards and Safety Add-Ons & Installations: Connectors, Dimmers, Drivers, & Extrusions. Wires and connectors Dimmers & Dimming Power Supplies/ Drivers Extrusions Shipping, Returns, Discounts, Orders, Account Questions Shipping Procedures Returns and 30-day guarantee Discounts/ Coupons Website and LED Terminology Q: What are lumens (lm)? Lumen is the measurement of brightness as perceived to the human eye. Because of incandescent lighting, we are all accustomed to using watts to measure the brightness of light. Today, we use lumen. Lumen is the most important variable when choosing which LED strip light you need to look at. Make sure you compare lumen output between LED strip lights before determining which one is best for your project. Q: What is AC? This is Alternating Current. This is the electricity that is used in most homes and commercial spaces. It’s often referred to as line voltage and number differs from country to country. US line voltage is typically 90V-220V, whereas it often averages higher in Europe. Q: What is DC? This is Direct Current. Most LED strips on the market use low-voltage DC. A transformer or low-voltage battery is often required to step-down the AC voltage to a suitable level for the LED strips, which is normally 12V or 24V DC. Q: Are your LED strips constant current or constant voltage? All of our strip lights require constant voltage. A constant voltage power supply is an electrical power source that regulates voltage to a constant level. In the case of Flexfire LED strip lights, a constant 12V or 24V, depending on the LED strip being used, would be required. Q: What is CRI and why is it important? Color Rendering Index (CRI) is the measurement of how colors look under a light source when compared with sunlight. Having information on the CRI of a LED strip light is important because you want to make sure that the colors are being accurately represented by the light source. CRI is measured on a scale from 0-100. A CRI of 80+ is the industry-standard for most applications while a CRI of 90+ tends to be necessary for situations that need color accuracy. Our UltraBright High CRI Series are used for photography lighting, retail lighting, bathroom or salon lighting, and residential lighting. Read more about the importance of CRI, here. Q: What is LED pitch and how does it affect the type of lighting I wish to achieve? LED pitch is the distance between the individual chips on a strip (FPCB). It is absolutely crucial to understand the importance that pitch plays in your project. The shorter the pitch, the more uniform the light tends to be and the less spotting you have. To read and learn more about LED pitch click here. Q: What is the difference between 3528 LEDs v 5050 LEDs? LED chips are all not all equal. The four digits represent the size of the chips in millimeters. For example, the 3528 chip is 3.5 mm X 2.8mm. Some chips are brighter than other and some have special uses and restrictions. Read more about the difference in chip size here. Q: What is color temperature? The color of light can be quantified by referring to its color temperature. White light is measured in Kelvins (K). Most white lights fall in a spectrum between 1800K and 6500K. When getting close to 3000K, the light is noticeably warmer. On the other end of the spectrum, the lights have a blue-ish tint and cooler tone when nearing 6500K. Q: Which color temperature should I choose? Choosing the correct color temperature lights for your project is very important, and as important as the brightness you choose. Consider the look and feel you want your project to have. What other color lights will be present? What material and color are the materials you wish to light? Q: What is mA or mAmp? This is 1/1000 or 0.001 of 1 ampere. When using LED strips it is common that the current draw for the LEDs will be less than one amp. In this case milliamps are used to indicate the amp draw. An example of this would be that a draw of ½ amp would be equal to 500mAh. Q: What is a Watt? A watt is equivalent to one joule per second, corresponding to the power in an electric circuit in which the potential difference is one volt and the current one ampere. A watt is equal to the voltage multiplied by the amperage. This is how your electric company keeps track of how much energy you consume. Q: What is Binning? Simply put, binning is the process of grouping LEDs during production so that they matched with LEDs of the same color sector. For example, all 2700K chips are ‘binned’ together and are separated from chips that have a higher/lower color temperature. Learn more about Binning here. Q: What is an LED (Light Emitting Diode)? A Light Emitting Diode (LED) is a solid-state semiconductor device that converts electrical energy directly into light. To learn more about how an LED light produces light click here. Q: What is solid-state lighting? Lighting devices that do not contain moving parts or parts that can break, rupture, shatter, leak, or contaminate the environment. LEDs do not use electrical filaments or gasses to produce light. Q: What is luminous efficacy? This is calculated by measuring the lumen output and then dividing that number by watts. For example, a strip that has a lumen output of 300lm/ft and a wattage draw of 3w/ft has an efficiency of 100lm/W. Q: What is a Luminous Intensity Distribution Diagram? Is a test to determine the angle of an emitted beams of light. TM30 vs CRI page. Q: What is an Isocandela diagram? Graphic representation of brightness distribution of a light source. TM30 vs CRI page. Q: What does Fidelity Index (TM-30) mean? How closely the observed light can render colors like the sun, using 99 color samples. TM30 vs CRI page. Q: What does Gamut Index (TM-30) mean? How saturated or desaturated colors are (aka how intense the colors are). TM30 vs CRI page. Q: What does Color vector Graphic (TM-30) mean? Which colors are saturated/desaturated and whether there is a hue shift in any of the 16 color bins. TM30 vs CRI page. Q: What does CQS - Color Quality Scale mean? An alternative to the unsaturated CRI measurement colors. There are 15 highly saturated colors that are used to compare chromatic discrimination, human preference, and color rendering.TM30 vs CRI page. Q: What is a goniophotometer? A photometric device for testing the luminous intensity distribution, efficiency and luminous flux of luminaires. Q: What is IP stand for? This is a rating system that defines the ability of a product to be able to work in different environments. IP is an acronym "Ingress Protection". It is a measurement of the protection an item will have against solid objects (dust, sand, dirt, etc.) and liquids. An IP rating is comprised of 2 numbers. The first number refers to the protection against solid objects (dust, etc) and the second number refers to protection against liquids. Here is a complete article about IP ratings. Q: What is the difference between IP65, IP67, & IP68? The differences between commonly sold IP65, IP67, & IP68 strips are slight, but very important. Using the above chart as a guide, we can see that all strips are protected at the highest level from solids and dust. The variations come with the protection against liquids. IP65 = Water resistant. “Protected against water jets from any angle” *Do NOT submerge IP65 LED lights, these are not waterproof. IP67 = Water resistant plus. “Protected against the events of temporary submersion (10 minutes)”*Do NOT submerge IP67 LED lights for extended periods, these are not waterproof. IP68 = Waterproof “Protected against the events of permanent submersion up to 3 meters” Return to top of page LED STRIP LIGHTS The Basics Q: What are the top 4 comparing factors to look for before purchasing LED strip lights? 1. Make sure you know the requirements for your project, then when looking at options, compare lumen output, CCT, and CRI.2. Compare LED strip size and number of chips on the reel.3. Understand the wattage and voltage that the LED strip light uses.4. Make sure that the products have verifiable quality. To read more details on these top considerations, click here. Q: What is an LED strip light and how does it work? A LED strip light is a flexible circuit board that is populated with LEDs. Strip lighting allows you to install powerful, energy efficient, discreet lighting fixtures in places you normally wouldn’t be able to reach. Check out this infographic to learn more about the benefits of using a LED strip light. Check out our catalogs to view images of the many applications Flexfire LED light strips can be used for. Q: How do LEDs produce light? In the middle of the LED SMD there is an N-type and a P-type semiconductor. The N-type has electrons and the P-type has holes. The holes and electrons rapidly cross the gap and then merge together. As they combine, it produces photons which in turn produces particles of light. Q: Can Flexfire LED strips be cut? Yes, they can be cut to desired lengths. Check out our how-to article on cutting LED strip lights. Q: Can Flexfire LED strips be soldered? Yes, Flexfire LED strips can be soldered. This is the ideal method to install strip lights. Q: Do Flexfire LED strips have an adhesive on the backs of the strips? Flexfire LEDs strip lights have a 3M brand adhesive that allows for a very easy and secure installation. For heavier outdoor-rated strips, we recommend using the silicone-mounting brackets for a more long-term mount. Q: What specific adhesive is used on your LED strips? Non water resistant IP20 and waterproof IP68 use the 3M VHB 4930 adhesive tape. Outdoor water resistant IP65 uses the 3M 9731 adhesive tape. Q: How long will the LED lights last? Our lights have been rigorously tested and have an expected lifespan of 50,000 hours before dropping to 70% luminosity. This means that if you were to use your lights 12 hours a day, every day, the lights would be expected to last longer than 10 years. Even after that time has elapsed, the lights will maintain a brightness of 70%. Higher-output strips require a heat sink to reach the expected lifespan. Q: What is the difference between rope lights and LED strip lights? Although rope lights have a greater run length and lower pricing, the benefits of strip lights outnumber those of rope lights. Strip lights are incredibly bright and easy to install due to their size, technology, and adhesive. They also come in a variety of colors and have dimming options. However, the most important factor to note when comparing the two is the immense difference in light quality, where strip lights (especially Flexfire’s LED strip lights) are beyond doubt, superior to rope lights. To continue to learn about the difference between the two, click here Return to top of page Product Quality Q: What makes Flexfire LEDs strips superior to those sold elsewhere? The look of the LED strip can often be deceiving. Although LED strips may look similar, their performance can vary widely. The quality of an LED strip relies on the use of top quality components, heat dissipation, color consistency through select binning, verifiable long lifespans, low or little color shifting over the life of the strip (chromaticity shifts), and verifiable performance. Only the highest quality components are invited to our assembly floor. We underpower our LEDs to make sure the strip stays cool and will be bright for many years and test each strip for 8 - 12 hours before it leaves the factory. Flexfire LEDs produces lighting that you should never have to go back out and fix. We believe we have truly created a ‘set and forget’ solution. See our full article, “How does Flexfire LEDs make the highest quality LED strip light?”. Q: Does Flexfire LEDs manufacture their own strip lights or are you just a reseller? We design the products in house and contract-manufacture in a single factory under intense quality control conditions. We source and select all of the components that are used and all of our strip lights are of the highest quality. Also, all of the lights are tested for 8 - 12 hours upon completion and prior to being shipped to our storage facility in Tustin, California. They are then tested a second time upon arrival. We can guarantee that your lights will work, every time. Q: What are the warranties of your products? We’re so happy with the quality of our product, we offer up to 15-year warranty on all of our LED strips to all of our clients. The warranty on power supplies ranges from 2 to 7 years which is model dependent. See our Warranties Page for full details. LED STRIP LIGHTS (15) Years - UltraBright™ Architectural Series (15) Years - UltraBright™ Architectural Dynamic Tunable White Series (15) Years - UltraBright™ Design Series (15) Years - ColorBright™ Dynamic Tunable White Series (15) Years - ColorBright™ UV Series (15) Years - ColorBright™ Vivid Color Series (15) Years - ColorBright™ Whites Series (15) Years - ColorBright™ Color Changing RGB 150 (15) Years - ColorBright™ Color Changing RGB 300 (15) Years - ColorBright™ Color Changing RGB+W (7) Years - UltraBright™ Industrial Series (7) Years - UltraBright™ Slim Series (7) Years - UltraBright™ High CRI Series POWER SUPPLIES AND DRIVERS (2) Years - Flexfire LEDs Desktop Style Power Supplies (5) Years - Zurik™ MLV Dimmable Drivers (3) Years - Zurik™ EMLV Dimmable Drivers (7) Years - Zurik™ EMLV2 Dimmable Drivers - New Updated Version (2) Years - Mean Well LPV Drivers (7) Years - Mean Well HLG Drivers DIMMERS & CONTROLS (1) Year - Lutron Dimmers (5) Years - Juno™ Amplifiers (5) Years - Juno™ Bluetooth Dimmers and Controllers (3) Years - Sensors ACCESSORIES, WIRE, & CONNECTORS (2) Years on anything else not specifically listed above Q: What is the lifespan of your strip lights? Our lights have been rigorously tested and have an expected lifespans from 30,000 to 50,000 hours before dropping to 70% luminosity. This means that if you were to use your lights every day for 12 hours a day, the lights would be expected to last longer than 10 years. Even after that time has elapsed, the lights will maintain a brightness of 70%. Higher-output strips require a heat sink to reach the expected lifespan and'
