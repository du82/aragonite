full_description = '''Categories LED Strip Lights LED Strip Light Kits Aluminum Mounting Extrusions LED Power Supplies Dimmers, Amplifiers, and RGB Controllers View All Customer Service Customer & Partner Sign In / Account Longest LED Strip Warranty Shipping & Returns ADA Accessibility Policy OEM Partner Signup Contractor Discount Program Contact Us Toll Free Number: +1-844-353-9347 Local Number: +1-925-273-9080 Info: info@FlexfireLEDs.com Flexfire LEDs, Inc 3554 Business park drive, suite F Costa Mesa, CA 92626 { "__shgImageElements": { "uuid": "s-794ae9df-26db-4c44-8245-b76a975f9587" } } { "__shgImageElements": { "uuid": "s-7441cffd-3280-43f0-a674-2829d825c466" } } Leona® Smart Home System Transform your house into a smart home with the Leona® Smart Home System! Have a smooth flawless lighting experience that adapts to your lifestyle with a variety of affordable, innovative smart home automation solutions. Create customized scenes and control your lighting and devices from a voice command, the phone app, or both. With smart home controllers and sensors, you can enjoy limitless personalization with no hub required. Limitless Personalization { "__shgImageElements": { "uuid": "s-410ef4be-46fe-4c27-b4f5-d959a80c9b63" } } { "__shgImageElements": { "uuid": "s-02a9fbb4-53a4-46e1-a233-ecd806d0b691" } } { "__shgImageElements": { "uuid": "s-dc047aec-15b5-4b4b-ac0b-0ac0df13e219" } } { "__shgImageElements": { "uuid": "s-7778460f-191f-4ac6-bb05-9170d3309047" } } { "__shgImageElements": { "uuid": "s-491fd0e2-dcde-4428-8175-979f381b15d3" } } { "__shgImageElements": { "uuid": "s-f7dbcf07-3f12-49de-9dfa-4cfa5edb0e7c" } } { "__shgImageElements": { "uuid": "s-426998b9-ce6c-4e00-b444-8b964eb5ac03" } } { "__shgImageElements": { "uuid": "s-53366a6c-9d38-4bda-82f5-7fce71eea997" } } Leona® Pro Smart Home Products { "__shgImageElements": { "uuid": "s-26db7401-b269-40d0-8a67-ace1de627a71" } } { "__shgImageElements": { "uuid": "s-2c6a2b51-125d-450c-92a6-55014f2df4fb" } } Leona® RGB HDMI Syn