85 { "__shgBox": { "id": "s-012d600c-3231-4be4-8983-f567f6b077c5", "url": "https://www.flexfireleds.com/leona-digital-controller/", "new_window": false } } { "__shgImageElements": { "uuid": "s-1e774519-a268-4df1-9ec2-b185a5ec733d" } } { "__shgImageElements": { "uuid": "s-f7621147-29dd-4034-9f46-9067cd83c85c" } } 5 reviews Leona® Door Sensor ✔ Rechargeable lithium battery ✔ Use it in any door, window, or drawer ✔ Sleek electromagnetic design $35 { "__shgBox": { "id": "s-d94050a4-b98c-4f2f-9e3f-94c52326aaa3", "url": "https://www.flexfireleds.com/smart-home-lighting-controllers-and-plugs/leona-smart-home-door-sensor/", "new_window": false } } { "__shgImageElements": { "uuid": "s-d38d2565-34c2-4e16-a882-76dff030b305" } } { "__shgImageElements": { "uuid": "s-b1b1635d-3054-42e8-9e26-114027ba10fe" } } 5 reviews Leona® Motion Sensor ✔ 120° detection angle ✔ 16ft detection distance ✔ Powered by 3 AAA batteries $35 { "__shgBox": { "id": "s-b2ff7af4-cea3-4934-a901-f8757c034e84", "url": "https://www.flexfireleds.com/smart-home-lighting-controllers-and-plugs/leona-smart-home-motion-sensor/", "new_window": false } } { "__shgImageElements": { "uuid": "s-a89f7143-e57f-488f-9aa6-a37c8caec5c9" } } { "__shgImageElements": { "uuid": "s-ef14b281-8474-4fce-ae9b-ad75e6f2e315" } } 2 Reviews Leona® Smart Plug ✔ Simple plug-and-play installation ✔ Timer and schedule functions ✔ Turn your appliances into smart appliances $19 { "__shgBox": { "id": "s-b3bf001f-5956-4763-845e-6ba55b790e80", "url": "https://www.flexfireleds.com/leona-smart-home-plug/", "new_window": false } } { "__shgImageElements": { "uuid": "s-57441110-9444-4c45-9d46-b48ab09e414b" } } { "__shgImageElements": { "uuid": "s-f3aa5a28-6897-47af-95bc-a2728a72bf51" } } 1 Reviews Leona® Smart Outlet ✔ Perfect for household appliances ✔ Fits in standard wall boxes ✔ USB smart port available $20 $10 { "__shgBox": { "id": "s-414515d1-2470-47fb-be2b-5859fc1db2e1", "url": "https://www.flexfireleds.com/leona-smart-home-outlet/", "new_window": false } } { "__shgImageElements": { "uuid": "s-6f67eab9-00a2-458a-9df1-8f375d0a83c8" } } { "__shgImageElements": { "uuid": "s-7afd9531-46c9-40a9-9bae-fb253e20a1f1" } } Leona® Tunable White Smart Bulb ✔ Dynamic Tunable White Output ✔ High Brightness: 800 lumens ✔ CCT White Range: 2700K - 6500K Starting at: $10 $5 { "__shgBox": { "id": "s-1b3e659a-fa2b-47d6-b719-81e77f7314ba", "url": "https://www.flexfireleds.com/leona-dynamic-tunable-white-smart-bulb/", "new_window": false } } { "__shgImageElements": { "uuid": "s-d741a824-9933-4529-acdd-407d5e1877ea" } } { "__shgImageElements": { "uuid": "s-1fddbf31-2e26-448e-95ff-3979425d9e90" } } Leona® RGB + Tunable White Smart Bulb ✔ RGB color changing + Tunable White ✔ High Brightness: 800 lumens ✔ CCT White Range: 2700K - 6500K Starting at: $12 $6 { "__shgBox": { "id": "s-ba7cca7c-fe33-41b1-be95-8a9df93b3151", "url": "https://www.flexfireleds.com/leona-rgb-dynamic-tunable-white-smart-bulb/", "new_window": false } } Leona® Instructional Videos Leona® Smart Home System Overview App and Device Setup Basic Control Functions Pairing with Amazon Alexa Pairing with Google Home Create Groups Pairing Remotes and Wall Panels Adding Users and New Homes Create Easy Automations Set Tap-to-Run Presets Leona® Smart Home System FAQ What is Leona® Pro Smart Home System? The Leona® Smart Home System is a complete line of affordable, innovative lighting products that make your smart home even smarter! Use your Amazon Alexa or Google Home smart speakers to voice activate smart devices such as: Color controllers able to control several styles of low voltage lighting products from plain white to RGB to RGB+Tunable White. Physical controls that can be used in tandem with your phone app and smart home speakers. Smart sensors that can trigger all types of devices. Smart plugs and outlets that you can turn on and off from anywhere in the world! Is the Leona® Pro Smart products compatible with other any smart home systems? Yes, the Leona® Controllers are compatible with Amazon Alexa and Google Home smart home systems. You can refer to the Third Party Integrations section of the Leona™ Smart app for more information on how to pair smart speaker systems to your Leona® devices. Keep in mind that there are some functionalities exclusive to the Leona® Smart app such as dimming, scene control, timers, account sharing, and more. Do I need a hub in order to use the Leona® devices with the Leona® Smart app? No, unlike other smart home products, you don’t require a hub or special device to be able to use the Leona® Smart app in conjunction with our Leona® devices. What are the benefits of smart home lighting systems / IoT? Bring your home to the IoT (Internet of Things) era Manage multiple devices from lighting to sensors, to appliances, all in one place Be more energy-efficient and cut costs by having better control of your energy use Control your devices from a remote location Increased safety by never having to worry about leaving your coffee maker on or any other appliances What app do I need to download on my phone to use these devices? Download the Leona® Smart app available for both Android and iOS operating systems. Use this app to control Leona®-compatible products such as LED strip lights, panels, smart plugs, etc. How do I pair my devices with the app? Search for the “Leona® Smart” app in the iOS App Store or Google Play Store. The app is compatible with Android 4.0 and iOS 8.1 or higher. Connect your phone or tablet to a 2.4GHz Wi-Fi connection, and enable Bluetooth on your phone or tablet. Open the app and either sign up for a new account or log in with an existing account. Power your Leona® devices and make sure they are on pairing mode. How can smart lighting improve your health? Establish wake-up and wind-down routines. Your lighting can help tell your body when it's time to wake up and be active and when it's time to wind down and start getting ready for bed. Whether that is through brightening or dimming your lights, set up a specific color temperature or color for the lighting or both. Your circadian rhythm is responsible for managing important bodily processes, especially sleep. Before the creation of artificial light, humans’ biological internal clocks were guided by the natural rise and fall of the sun, which is the 24-hour cycle we know today. With smart lighting systems such as Leona® Pro you can program your lights to sync with your natural circadian rhythm and stimulate productivity during peak hours while promoting more relaxed states later in the day. If you want to know more about circadian rhythm lighting, click here'''
