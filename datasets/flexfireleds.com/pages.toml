ing. If not, there is a good probability you walked into a trendy shopping mall, retail store or beautiful home and noticed the crisp and beautiful lighting provided by our strips. Our strips are UL listed with a 7 to 15 year warranty. Whatever the lighting challenge is, Flexfire LEDs is here to educate and provide a custom or out of the box solution. Don't just spec us, talk to us! We have a full design team in-house to answer any questions and turn your design ideas into realities. If you use Flexfire LEDs just once, you will never use another strip lighting company again. Eleven beliefs that run Flexfire LEDs: { "__shgImageElements": { "uuid": "s-a4e26fbb-4404-44f7-ba87-6f22e67879a3" } } 1. We don't just sell, we educate. { "__shgImageElements": { "uuid": "s-ef2a41b3-70e6-44c3-ada6-3b4e8396a579" } } 2. We obsess over our clients, not our competitors. { "__shgImageElements": { "uuid": "s-852a287b-6e85-4a96-976b-6aead42ffd55" } } 3. We are uncompromising about flawless lighting design. { "__shgImageElements": { "uuid": "s-44ffcb6c-ae65-4768-94a1-75959a9b358c" } } 4. We do not make recommendations we would not use ourselves. { "__shgImageElements": { "uuid": "s-9515a3d6-c68d-4691-a322-d3fed993cbd1" } } 5. We believe nothing is ever perfect, as it can always be improved. { "__shgImageElements": { "uuid": "s-7bd4b3df-b367-4dad-a4f4-619d6e323797" } } 6. We value curiosity and the exploration of ideas. { "__shgImageElements": { "uuid": "s-a6bbe522-debc-49d0-96ef-a1c53d60a459" } } 7. We speak the truth and deliver the raw facts. { "__shgImageElements": { "uuid": "s-b82fff8b-83d0-4e46-8eb6-2ad1de36b2e3" } } 8. We give ourselves the autonomy to be awesome. { "__shgImageElements": { "uuid": "s-c9af93c0-9577-47da-87e9-8ed8d1a7d366" } } 9. We are selective about quality components. { "__shgImageElements": { "uuid": "s-eacc1602-ca67-4faf-ac16-680decfd42e7" } } 10. We believe in work/life balance, not work vs. life. { "__shgImageElements": { "uuid": "s-8c4474e6-a13a-4a39-bfca-a