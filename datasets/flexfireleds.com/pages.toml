full_description = 'Description dir="ltr">COMPATIBLE PRODUCTS&nbsp; dir="ltr">SPECIFICATIONS dir="ltr">FAQ dir="ltr">DOWNLOADS Reviews IP65 Outdoor Solderless Grip Connectors Our Outdoor IP65 Grip Connectors are the best solution for solderless IP65-rated LED strip light connections. The lightweight yet durable design uses a pierce-to-contact technology to secure weatherproof connections, so there’s no need for tedious soldering. No need to use weatherproof connectors? We also offer indoor-rated versions of our solderless GRIP connectors which work great with our indoor-rated (IP20) LED strip lights and are available for our Single Color, Dynamic Tunable White, RGB, and RGBW LED strip lights. Please refer to our Connectors and Other Accessories page to check out more accessories for your lighting projects! Features Available in versions for our 10mm Outdoor (IP65) Single Color LED strip lights, our Outdoor (IP65) Dynamic Tunable White LED strip lights, our Outdoor (IP65) RGB LED strip lights, and our 12mm Outdoor (IP65) RGBW LED strip lights. Comes in a pack of 5 connectors. Lightweight yet reliable for strong connections. Effortlessly lets you connect to power, jump gaps, and attach strips For best results, use these connectors with our Electronic Grade Silicone Sealant Adhesive. → Choose the C1 Connector with 40" bare wire if you… Want to connect to receivers, power supplies, dimmers, or amplifiers. → Choose the C2 Jumper Connector with 8” wire if you… Want to connect an Outdoor (IP65) LED strip to another Outdoor (IP65) LED strip Want to go around columns, cross hallways, etc. → Choose the C3 Jumper Connector with no wire if you… Want to connect an Outdoor (IP65) LED strip to another Outdoor (IP65) LED strip without wire in between Want to extend your run lengths for larger projects Want to combine scraps together Outdoor IP65 LED Strip Lights Single Color or Dim to Warm LED Strips Outdoor (IP65) UltraBright™ Architectural LED Strip Lights Outdoor (IP65) UltraBright™ Outline LED Strip Lights Outdoor (IP65) UltraBright™ Accent LED Strip Lights Outdoor (IP65) UltraBright™ Sienna Dim-to-Warm LED Strip Light Dynamic Tunable White LED Strips Outdoor (IP65) UltraBright™ Architectural Tunable White LED Strip Lights Outdoor (IP65) UltraBright™ Accent Tunable White LED Strip Lights RGB LED Strips Outdoor (IP65) ColorBright™ RGB 600 Color Changing LED Strip Lights Outdoor (IP65) ColorBright™ RGB 300 Color Changing LED Strip Lights Outdoor (IP65) ColorBright™ RGB 150 Color Changing LED Strip Lights Outdoor (IP65) ColorBright™ RGB Digital Pixel LED Strip Light RGBW LED Strips Outdoor (IP65) ColorBright™ RGBW LED Strip Light Aluminum Mounting Channels For Single Color, Dynamic Tunable White, and RGB LED Strips: ION TITAN CALYPSO For RGBW LED Strip Lights: ION Specifications Works with both 12V and 24V DC LED strip lights. Maximum amperage: 5 amps. Wire gauge: 20 AWG for Single Color connectors, and 22 AWG for Dynamic Tunable White, RGB, and RGBW connectors. Wire length: 40” wire for C1 connector, and 8” wire for C2 jumper connectors. Dimensions for Single Color, Dynamic Tunable White and RGB connectors: Outdoor IP65 Grip C1 and C2 connectors with wire - Length: 1 ⅛” (28 mm) / Width: ¾” (17.5 mm) / Height: ⅜” (8.5 mm) Outdoor IP65 Grip C3 connectors with no wire - Length: 1 ⅝” (40 mm) / Width: ¾” (17.5 mm) / Height: ⅜” (8.5 mm) Dimensions for RGBW connectors: Outdoor IP65 Grip C1 and C2 connectors with wire - Length: 1 ⅛” (29 mm) / Width: 13/16” (20 mm) / Height: ⅜” (9 mm) Outdoor IP65 Grip C3 connectors with no wire - Length: 1 ⅝” (40 mm) / Width: 13/16” (20 mm) / Height: ⅜” (9 mm) SKU Connector Type Wire Length Wire Gauge Dimensions Single Color IP65-GRIP-SC-C1-10-40 Connector With Wire 40’’ 20 AWG 1 ⅛” x ¾” x ⅜” IP65-GRIP-SC-C2-10-08 Jumper Connector 8’’ IP65-GRIP-SC-C3-10-0 Jumper Connector No Wire - 1 ⅝” x ¾” x ⅜” Dynamic Tunable White IP65-GRIP-DYN-C1-10-40 Connector With Wire 40’’ 22 AWG 1 ⅛” x ¾” x ⅜” IP65-GRIP-DYN-C2-10-08 Jumper Connector 8’’ IP65-GRIP-DYN-C3-10-0 Jumper Connector No Wire - 1 ⅝” x ¾” x ⅜” RGB IP65-GRIP-RGB-C1-10-40 Connector With Wire 40’’ 22 AWG 1 ⅛” x ¾” x ⅜” IP65-GRIP-RGB-C2-10-08 Jumper Connector 8’’ IP65-GRIP-RGB-C3-10-0 Jumper Connector No Wire - 1 ⅝” x ¾” x ⅜” RGBW IP65-GRIP-RGBW-C1-10-40 Connector With Wire 40" 22 AWG 1 ⅛” x 13/16” x ⅜” IP65-GRIP-RGBW-C2-10-08 Jumper Connector 8" 1 ⅛” x 13/16” x ⅜” IP65-GRIP-RGBW-C3-10-0 Jumper Connector No Wire - 1 ⅝” x 13/16” x ⅜” IP65 Outdoor Grip Connectors Frequently Asked Questions Q: Can these connectors be submerged? No, they can withstand vapor condensation and low-pressure jets of water but cannot be submerged under water. Q: How long should I let the silicone sealant adhesive cure? Please refer to the silicone sealant’s instructions for curing time recommendations. Q: Can I load the connectors with more than 5 amps? It is not advisable to overload the connectors as this will result in future damages to the connectors and your setup. Q: Which connector should I use to turn a corner? The C2 connectors are typically used throughout our series for corners, bends and jumps shorter than 8”. Q: What do I do If my lights are not lighting up? 1. Make sure the polarities match.2. Make sure that the window of the translucent case and the LED Strip light are facing upward.3. Make sure that the connectors are properly closed all the way. The strip should feel secure and not loose. Need assistance with your project or purchase? Our design specialists are ready to help. Contact Us! IP65 Outdoor Grip Connector Downloads IP65 Outdoor Solderless Grip Connector - User Guide'
