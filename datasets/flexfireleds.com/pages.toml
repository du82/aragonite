title = "Leona® Lighting Control Smart System​​ | Addressable LED Strips"
description = """
LED Strip Lights                            Powerful linear lighting in a variety of colors and brightnesses for architectural, residential, and commercial applications."""
full_description = 'Description >SPECIFICATIONS >COMPATIBLE PRODUCTS >INSTALLATION >FAQs >DOWNLOADS Reviews Leona® Digital Controller Introduction: Engineered to provide precise control over your lighting projects using RGB or RGBW digital LED strip lights. This versatile controller allows you to effortlessly manage colors, brightness, and dynamic effects, making it ideal for both residential and commercial applications. With its intuitive interface and compatibility with popular smart home systems, you can customize your lighting experience to create captivating and vibrant environments. Choose one of the pre-programmed modes from the 44 available or create up to 10 custom dynamic modes using the Leona® Smart app. Control your Lights from your Phone, your Remote, or Both! The Leona® Digital Controller can be controlled from the Leona® Smart app to utilize all its capabilities. Alternatively, add an RF remote to control your lights without the need for an app, using a physical remote control. Keep your remote on a nearby desktop or mount it to the wall with the convenient remote holster included. Pair your Leona® Digital Controller with any of the products in our Leona® Smart Home family and create the affordable automated home experience that you’ve been dreaming of! Limitless Personalization: Create and save favorite settings for every room Include up to 20 users for family or friends Pair up to 200 Leona® Smart Home devices to the Leona® Smart app Set timers during the day and evening for perfect lighting Adjust colors and brightness levels to relax, work, or play Quick Set up & Easy Installation With our Leona® Smart app, you will be able to easily connect your devices to your smartphone via WiFi with pairing assistance via Bluetooth. Once your device is connected to the cloud you can control your lights from anywhere using WiFi or your phone’s cellular network. Take advantage of the quick bind function from our Leona® Smart app for automatic pairing to your Amazon Alexa or Google Home systems after initial set up. Quick bind functionality allows for automatic pairing to smart phone speaker systems after initial setup App compatible with Android 4.0 and IOS 8.1 and higher Compatible with Google Home and Amazon Alexa smart home speakers Specifications: Input Voltage: 5-24V DC Output Signal: SPI (TTL) x 2 Control up to 1,000 pixels Compatible with Google Home and Amazon Alexa smart home systems Control through your phone app or purchase an optional RF remote Able to be used with RGB or RGBW digital LED strip lights 44 pre-programmed modes + 10 custom modes Connector Type: Terminal Block and DC Port Signal Type: WiFi with Bluetooth pairing assistance Operating Frequency: 2.4GHz Maximum Wattage: 96W (12V) and 192W (24V) Dimming Range: 5-100% Operating Temperature: -22°F to 149°F (-30°C to 65°C) Color: White IP Rating: IP20 5-Year Warranty Controller Dimensions: 4 1/2" x 1 1/2" x 3/4" (114 mm x 38 mm x 20 mm) Remote Dimensions: 4 3/16" x 2 5/16" (107 mm x 59 mm) Leona® Digital Controller Compatible Products LED Strip Lights: ColorBright™ RGB Digital Pixel LED Strip LightOutdoor (IP65) ColorBright™ RGB Digital Pixel LED Strip Light Power Supplies: Plug-in Power SupplyMean Well™ HLG LED DriverMean Well™ LPV LED Driver Other Leona® Products: Leona® Smart Home PlugLeona® Smart Home OutletLeona® Motion Sensor Leona® Digital Controller Wiring Diagram Leona® Digital Controller FAQs Q. What app do I need to download on my phone to use this controller? Please download the Leona® Smart app and sync it to the receiver to control your lights. The app is available for both Android and iOS operating systems, and you can also use it to control other Leona®-compatible products such as light bulbs, panels, smart plugs, etc. Q. Do I need a physical remote to use the Leona® Digital Controller? No, this controller can be operated through a phone app and Amazon Alexa and Google Home integrations. This is great for users who prefer to control their lights with their smartphones or with voice control, but if you would like to use a physical remote they are available for purchase. Q. Is the Leona® Controller compatible with smart home systems? The Leona® Controllers are compatible with Amazon Alexa and Google Home smart home systems. You can refer to the Third Party Integrations section of the Leona Smart® app for more information on how to pair smart speaker systems to your Leona® devices. Keep in mind that there are some functionalities exclusive to the Leona® app such as dimming, scene control, timers, account sharing, and more. Q. Can I control multiple controllers from my phone? Yes, you can control up to 200 Leona® Smart Home devices from your phone app. You can control them individually, or control them in groups (i.e. a group of receivers to control the lights in your living room, or individual receivers around your kitchen to control your under-counter and toe kick lights separately). Q. Is this product outdoor-rated? Our Leona® Digital Controller and remote are indoor-rated. Please avoid exposition to moisture or direct sunlight. Downloads: Leona® Digital Controller Data Sheet Leona® Digital Remote Data Sheet'
