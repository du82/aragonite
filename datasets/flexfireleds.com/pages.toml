roject Type + Above Cabinet Lighting Cove Lighting Under Cabinet Lighting Stairway Lighting Restaurants and Bar Lighting Display Case and Merchandise Lighting Hotel and Resort Lighting Signage Lighting Terrarium Grow Lighting UV LED Lights Ask Us. Project Design Services Advice on Anything Project Assistance and More! Get It Free From Experts Chat | Call | Schedule { "__shgImageElements": { "uuid": "s-d3dbd07b-1585-41aa-8092-664aa9340533" } } { "__shgImageElements": { "uuid": "s-81a67bce-4899-4f89-9ab2-28c88e8b278d" } } Shipping Procedures LOCATION-BASED SHIPPING PROCEDURES: USA: We ship out UPS Ground mail which takes between 1 - 5 days transit service in the USA. This includes the 50 US States and Puerto Rico (Puerto Rico = 6 days). For a detailed reference see the UPS Ground Transit Times figure below. CANADA: Flexfire LEDs ships to Canada via USPS Priority Mail. Keep in mind, we have no way of tracking a package once it crosses the Canadian border. We can not give any guaranteed delivery dates as there are many possible factors (customs, brokerage fees, etc.) that may affect the delivery. INTERNATIONAL: We ship all international orders (anything outside the USA and Puerto Rico) via UPS Worldwide Expedited. Customers have the option of choosing USPS, FedEx, or DHL if preferred. To do so, Flexfire must be contacted for a shipping quote. Method-Based Shipping Procedures: All orders (Free & Expedited) are filled and shipped the following business day for processing purposes. Free Shipping Types: Standard Shipping to all 50 US States and Puerto Rico on retail orders of $249 USD or greater (for non-partner clients). Standard Shipping to Canada on retail orders of $300 USD or greater. Time Frame: Orders are filled and shipped the following business day from the date of purchase and can take anywhere from 1 to 7 business days to arrive. Example: Order Placed: Tuesday by 11:59pm PST Order Ships Out: Wednesday afternoon via the free shipping method Valid for: Retail sales only. Contractors, OEM/Resellers, Distributors, and Exporters are excluded. Expedited Shipping Types: UPS Worldwide Expedited to all 50 US States and Puerto Rico on all size orders. UPS, USPS, FedEx, or DHL to any international location on all size orders. Time Frame: Orders being shipped via an expedited service are also dispatched the next business day after order is placed. Valid for: All types of orders and customers. Example: Order Placed: Tuesday by 11:59pm PST Order Ships Out: Wednesday afternoon via the customer-paid expedited service Payment: It is the customer’s responsibility to cover all charges incurred by shipping carriers. Contact Flexfire LEDs for a shipping quote. Additional Notes Please read the following documentation regarding shipping policy: Pursuant to company policy all orders are shipped through UPS Ground mail service (unless international or requested otherwise by customer). Delivery through UPS Ground mail typically takes between 1 to 5 business days from dispatchment to arrival at the customer’s shipping address depending on the location. For a detailed reference refer to the UPS Ground Transit Times figure below. Some areas of the USA qualify for Saturday delivery via UPS. There is an additional $20 fee that UPS adds on to the shipping quote for Saturday delivery. To choose this option you must contact us and inform us. Flexfire LEDs does not use any other shipping carriers/services other than USPS, UPS, FedEx, and DHL Orders of $500 USD and greater will require a signature upon delivery. Once shipped, Flexfire LEDs holds no responsibility for lost or late packages while in the custody of the shipping carrier. If you wish to insure the shipment, please contact customer service before completing your purchase. For general questions regarding shipping, contact Flexfire LEDs. For detailed shipping information, contact the shipping carrier directly. Orders placed incorrectly online using the “free shipping” option will need to be paid in full before order is shipped. To make the payment please call Flexfire LEDs. International packages cannot be tracked after leaving the United States if shipped through USPS. Alternate shipping services may provide tracking capabilities and/or quicker delivery. Orders are normally shipped from our warehouse in Santa Ana, California. Sometimes it is necessary to drop ship from another warehouse to speed up the delivery time. During high volume periods, such as Cyber Weekend, some of the above mentioned shipping procedures may not apply. KLUS PRODUCTS Any orders involving KLUS extrusions and/or covers can not be shipped via USPS. UPS Ground Transit Times Transit Days = Business Days (exclude Saturdays & Sundays) Days are an estimate, not a guarantee { "__shgImageElements": { "uuid": "s-a6c525dc-6d64-4f07-8963-1568e0c0a4b2" } } Please let us know if you have any questions!'
