ur Events None of Our Business Fantastical is designed with a privacy-first approach, which means it keeps as much private data on your device as possible. Your account’s password is stored securely on your device using the Keychain and never leaves your device. See our privacy policy for more details. Privacy at Flexibits Scheduling for Everyone Desktop. Mobile. Web. Fantastical Scheduling works seamlessly across your Mac, iPad, iPhone, Apple Vision Pro, Windows PC, and any web browser."
