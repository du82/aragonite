["https://flexibits.com/privacy/california"]
title = "Flexibits | California Privacy Notice"
description = "Information about Flexibits, your data, and your privacy."
full_description = "Flexibits California Privacy Notice Last Updated: 2023-12-18 Flexibits, Inc. (“we,” “us,” “our”) works hard to build and maintain a relationship of trust with you. This California Privacy Notice (the “Privacy Notice”) supplements our Privacy Policy and provides specific information for California residents about our collection, use, and disclosure of your Personal Information (as defined below) in connection with your use of our website(s) on which this Privacy Notice is linked (the “Sites”), such as www.flexibits.com and any services, transactions, or other engagements you might have with us including your use of our applications (collectively, “Services”). This Privacy Notice is subject to change. We encourage you to review this Privacy Notice frequently for any revisions or amendments. Changes to this Privacy Notice will be posted on the Sites and will be effective immediately upon posting. You will be deemed to have been made aware of and have accepted the changes by your continued use of our Sites or Services. If we determine that a change to this Privacy Notice will result in using your Personal Information acquired before the change being used in a materially new way, we will provide you notice before using your Personal Information in the new way such as by sending you an email, posting a notice on our Sites, or sending a notice through our applications. INFORMATION WE COLLECT Personal Information We collect information that personally identifies, relates to, describes, or is capable of being associated with you (“Personal Information”), including: Identifiers such as name, email address, IP address, billing address, phone number, device ID; Commercial Information such as transaction history, payment method information, content of correspondence with us such as emails, chats, or text messages, crash reports, usage analytics, customer satisfaction surveys; User-Created Data such as events, tasks, meeting proposals, reminders, contacts, calendar names, meeting templates, notes; and Geolocation Information (approximate). The specific Personal Information we collect about you may vary based on how you use the Sites and/or Services and your relationship with us such as if you are a user of our products or if you are a contact person for a company with which we do business. User-Created Data When using our Services, you may create data such as calendars, events, tasks, and more that we refer to in this Privacy Notice as “User-Created Data”. We believe that User-Created Data should be kept on-device and not sent to us to the greatest extent possible; however, there will be times when User-Created Data will need to be sent to us in connection with providing the Services to you. We also believe that it is important for our users to understand how their User-Created Data is handled. Accordingly, we have created a Privacy at Flexibits FAQ which explains in more detail the instances when we need to receive and process User-Created Data off-device and steps we take to limit our ability to access User-Created Data as much as reasonably possible when it is stored on or transmitted through our servers. Sites Activity We may automatically collect information in connection with the actions you take on the Sites using a tool called Matomo. For example, each time you visit our website, we may automatically collect the type of web browser you use, the type of device you use, your operating system, your Internet Service Provider, the pages you view, referring and exit pages, the date and time of your visit, the number of clicks to, from, and within the Sites, and the duration of your visits to the Sites. This information is anonymized and therefore is not considered Personal Information as defined in this Privacy Notice. Usage Analytics Depending on which of our applications you use, we may collect analytics information about your use of our applications in order to understand how our applications are being used so we can improve them. This analytics data is transmitted to us approximately every 24-48 hours. This data may be anonymized and therefore, if anonymized, is not considered Personal Information as defined in this Privacy Notice. If you are using an application that collects analytics data, we will give you the option to disable analytics in your in-application account settings. Communication Recordings We may retain the content of text messages or other written/electronic communications between you and us. By communicating with us, you consent to our recording and retention of communications. HOW WE USE AND DISCLOSE INFORMATION Generally We use Personal Information for general business purposes, such as: Processing Purpose Categories of Personal Information Processed Provide you with access to and use of our Sites and Services All categories of personal information. Process payments, returns, or exchanges Identifiers. Commercial Information. Service your account and provide support for your use of the Sites and Services All categories of personal information. Conduct surveys or market research All categories of personal information. Design, develop, and improve our Sites and Services Identifiers. Commercial Information. Geolocation Information. Market our products to you Identifiers. Commercial Information. Perform data analytics Identifiers. Commercial Information. Geolocation Information. Operate physical security, information security, anti-fraud, and loss prevention programs All categories of personal information. Respond to governmental and other legal requests All categories of personal information. Meet our legal obligations and obtain legal advice All categories of personal information. Perform day-to-day business operations such as accounting and internal reporting All categories of personal information. We may disclose Personal Information to companies that provide services to us and to third parties as described in our Privacy Policy. We do not sell your Personal Information to third parties under any circumstance. We also do not share your Personal Information with third parties for targeted advertising or cross-context behavioral advertising purposes. PRIVACY RIGHTS Please review our Privacy Policy for information about how to exercise any rights that you may have under California law related to your Personal Information. CONTACT US If you have any questions about our Sites, Services, or this Privacy Policy, please contact us using the methods available on our Contact page or by email at [email protected]."
