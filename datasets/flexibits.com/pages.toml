["https://flexibits.com/fantastical"]
title = "Flexibits | Fantastical — The calendar and tasks app you won't be able to live without."
description = "Fantastical, the calendar app you won't be able to live without. Quickly create new events and reminders with natural language input and more."
full_description = "Events. Tasks. Meetings. Fantastical makes it super-easy to organize your day. Try Premium for Free 14 Day Free Trial For iOS/iPadOS 17 or later Download Fantastical for Mac For macOS Monterey or later or download from Flexibits Watch the Video Multiple Platforms Award-Winning Design Conference Call Detection Organize Calls and Meetings Events and Tasks Deeply Integrated Safe and Secure All Your Devices. All Your Accounts. Fantastical has its own powerful engine for CalDAV and Microsoft Exchange. This means you can add your calendar accounts directly into Fantastical. Fantastical supports iCloud, Google, Microsoft Exchange, Outlook.com, Microsoft 365, fruux, Meetup, as well as any other CalDAV account. Desktop Mac, Windows New Mobile iPhone, iPad Wearables Apple Vision Pro, Apple Watch All In Sync with your Flexibits Account Award-Winning Design Packed with Features Fantastical has an intuitive user interface with multiple views, including detailed (and beautiful) full screen views for iPhone, iPad, Mac, and Windows. File and Photo Attachments Quickly access the files or photos you need at your next meeting or for your next task. Quickly upload files or images directly from Fantastical to your iCloud, Google, or Exchange events. Attachments are accessible across all devices that sync with your calendar accounts. Powerful Views DayTicker. Day. Week. Month. Quarter. Year. No matter what device you’re using, Fantastical will give you the view you want. See a quick overview of your calendar with the Fantastical DayTicker and Calendar views, and browse comprehensive full screen views of your day, week, month, quarter, or year when you need more (or less) detail. Event & Task Templates Quickly add your most frequently used events and tasks. Fantastical can create quick templates from existing events and tasks. Selecting a template will copy all of the details from the template into a new event or task instantly. Scheduling frequent events has never been this simple. Tasks Plan. Schedule. Accomplish. Design and complete your projects directly in Fantastical. Add tasks alongside calendar events and complete them when you've accomplished the task. Tasks notify you when they're due, and overdue tasks carry over to future dates. You'll never forget about a task again. Also works with Light & Dark Some prefer dark. Some prefer light. Whatever style you like, it's your choice. Apple Vision Pro See your events in a new dimension! Stay on top of your schedule like never before. Keep an eye on events and tasks in a spatial environment. Get productive and step into the future of time management with Fantastical. Fantastical Scheduling Organizing calls and meetings is now easy. RSVP New Invite People Invite others to your event with control over yes/no/maybe response types, number of participants, and registration deadlines. Learn More Openings Request Time Set up the times you are available and share a link with others. They pick a date and time, and you are all set! Openings will automatically block out slots based on your existing calendar events. Learn More Proposals Easily Plan Events Fantastical lets you see your invitees' availability and helps you find a time that works for everyone. Even better, you can send event proposals to your invitees with multiple times and dates. Learn More Conference Calls Easily Add and Join Conference Calls Fantastical Scheduling can automatically add a Google Meet, Zoom, Microsoft Teams, or Webex conference call to events others have scheduled with Openings. When creating your meeting template, just specify which conference call service you want to use and Fantastical will do the rest! Quickly Join 30+ Conference Call Services Fantastical’s automatic conference call link detection supports Zoom, Webex, Microsoft Teams, Skype (for Business), Google Meet, GoToMeeting, RingCentral Meetings, BlueJeans (Events), Whereby, Chime, Lifesize, VooV, BigBlueButton, HighFive, Vidyo, Circuit, StarLeaf, Lifesize, Blackboard, Lync, Around, Hopin, Vonage, Doxy, Jitsi Meet, TheraNest, SimplePractice, Dialpad Meetings (formerly UberConference), Gather, net2Phone Huddle, RiversideFM, Workplace Rooms, 3CX, and MiTeam Meetings. Bringing Everyone Together Families & Teams Share your subscription with Flexibits Premium for Families or Teams. After you sign up, invite your family or team members to join and they will be able to use Flexibits Premium with their own private Flexibits Account. Add My Family For families up to 5. Personal use only. Add My Team For small and large teams. Commercial use. Your Events None of Our Business Fantastical is designed with a privacy-first approach, which means it keeps as much private data on your device as possible. Your account’s password is stored securely on your device using the Keychain and never leaves your device. See our privacy policy for more details. Privacy at Flexibits Time Zones Done Right Stay on top of time zones with Fantastical's clear and handy time zone support. Choose the time zones that are relevant to you and easily see the converted time on Fantastical's handy time zone card right in the event. Scheduling events in multiple time zones is now quick, easy, and helpful. Fantastical Widgets 14 widgets to mix-and-match your favorites directly on your home screen. Quickly see your upcoming events, tasks, conference calls, weather, and more. Multiple small, medium, and large widgets help you stay organized even when you’re not using Fantastical directly. Weather See weather conditions for your days and weeks ahead. Fantastical integrates a detailed 10-day weather forecast directly into all calendar views, with further details on demand. Powered by AccuWeather, Fantastical’s forecasts are accurate to the minute and RealFeel will inform you of what temperature conditions actually feel like once other factors (humidity, cloud cover, wind chill, etc.) have been taken into consideration. Sunrise and sunset times are also displayed so you plan your day perfectly. Plus, events with locations will display the weather details for that specific location on the location map. Powered by Interesting Calendars Stay up to date with events that are important to you. Browse, search, and instantly add new, up-to-date calendars for holidays of various countries, religions, or education systems. You can even add calendars for your favorite sports, TV shows, and much more... Get historical data and track your relevant upcoming events. It's relevant content for your calendar and it's never been this easy. Deeply Integrated Works With Your Ecosystem Standby Always by your side. Lock your iPhone and turn it sideways while connected to power to have Fantastical display your choice of widgets: Icon, Date, Calendar, Up Next, or Event List. Lock Screen Widgets Always visible. Quickly glance at your events directly on your Lock Screen with three widget options: Up Next, Calendar, and Quick Action. International Fantastical speaks your language. Fantastical is fully localized in English, French, German, Italian, Spanish, European Portuguese, Brazilian Portuguese, and Japanese. Simply enter your event or reminder in any of those languages and Fantastical will automatically understand. It's magical. Focus Filters Focus on what matters. With Fantastical’s Calendar Sets and Focus Filters you will only see the events and tasks that currently matter. Enable your Work calendars when you arrive at the office, or get reminders to call your kids when you get into the car. Fantastical Premium unlocks awesome new features and supports continued development of the best calendar app. — Zac Hall, 9to5Mac (Fantastical is) ... the only calendar app I need, offering more power and flexibility than any alternative from Apple or the App Store. — Federico Viticci, MacStories The interface of the apps, as usual from Flexibits, is exquisite. — John Gruber, Daring Fireball Fantastical Premium is an app I can’t live without. — Jim Dalrymple, The Loop Fantastical is our pick for the best calendar app for iPhone and iPad, for Mac, and yes, even for Apple Watch. — Staff, The Sweet Setup You can throw all your other calendar apps in the trash. — Lory Gil, iMore"
