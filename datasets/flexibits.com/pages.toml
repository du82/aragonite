["https://flexibits.com/blog/2024/12/the-flexibits-2024-year-in-review"]
title = "The Flexibits 2024 Year in Review | Flexibits"
description = "Fantastical and Cardhop: enjoyable calendar and contacts apps for Mac, iPhone, iPad, and Apple Vision Pro. Fantastical is also available on Windows."
full_description = "Cardhop Fantastical News & Updates December 10, 2024 by Chrissie The Flexibits 2024 Year in Review Share this article Copied URL to Clipboard! As 2024 is coming to a close (we can’t believe it, either!), it’s time to ring in 2025 Flexibits style. Kicking things off is our 2024 video recap, and then we’ll count down the biggest (and best) features we’ve released throughout the past year. So put on your fancy hats, grab your Floo-Floobers, and let’s get this party started! 🎉 10. . . Cardhop contact cards got a new look Cardhop may not be our most popular app, but it deserves some love too, so we redesigned the layout of the contact cards to make them easy to navigate and nice to look at. With the latest update, you can easily tell which accounts and lists your contact is added to, as well as if you need to make a quick trip to the store for a birthday card. 9. . . Live Activities on iPad When iOS 17.2 was released earlier this year, Apple added support for Live Activities on iPad and of course we had to add this option to Fantastical. Live Activities allow you to display up-to-date information about your Fantastical events directly on the lock screen of the iPad making it easy to see what you have upcoming in your schedule. 8. . . Big changes to Openings 2024 included the addition of some of our most requested Openings features: Break time before AND after events Co-hosts for events if you have a Flexibits Premium Teams subscription A personalized Openings page that showcases all your available meeting templates for easy access by your invitees. 7. . . Control Center widgets & Tinted Icons with iOS 18 You know we always make sure to have Apple’s latest features available for Fantastical and Cardhop as soon as a new iOS drops, and iOS 18 was no exception. This year we added 6 Control Center widgets (3 for Fantastical and 3 for Cardhop) as well as support for tinted home screen icons and widgets for both apps. 6. . . Durations for Todoist tasks When Todoist added duration support for their premium users, we received a lot of emails asking if this was going to be added to Fantastical as well. Of course, the answer is YES! Now you can choose exactly how long you need to block off when checking items off of your New Year’s Resolution list (like FINALLY cleaning out the garage). 5. . . Apple Watch gets a glow up ✨ We continued refreshing Fantastical’s Apple Watch app in watchOS 11 by adding: Support for Live Activities in your Smart Stack A Today’s Schedule complication that shows the title of your next event, the number or remaining events, and the number of remaining tasks for the current day. A dedicated button for creating new items The ability to see individual attendees and responses in event details 4. . . A new task list view for Fantastical Everyone has tasks that they need to complete, but keeping up with those can be difficult, so we added a new view to make it easier than ever to check things off your list. Choose to view all tasks at once or select a specific list to just view those related items. 3. . . RSVP Fantastical Scheduling welcomed a new addition in 2024 with RSVP, allowing you to invite multiple people to a specific event with registration and deadline options that you set for each event. RSVP joins customer favorites Openings and Proposals in the Fantastical Scheduling lineup, allowing you multiple options to fit all your scheduling needs. 2. . . Fantastical and Cardhop for Apple Vision Pro If managing your calendar in a spatial setting was on your 2024 Bingo card, we had you covered by releasing Fantastical as an Apple Vision Pro native app on launch day. Of course, we knew you would want to manage your contacts on the Vision Pro as well, so we brought Cardhop along for the ride just 2 weeks later. Your calendar and contacts have never looked so good! 1. . . 🎉 Fantastical for Windows 🎉 We wrapped up 2024 with our biggest announcement yet. After many customer requests and a LOT of hard work by our team, Fantastical for Windows arrived at the end of October allowing you to finally access your favorite calendar app on your PC’s! (That was definitely a hard secret to keep for so long. 🤫) 🎊 HAPPY NEW YEAR! 🎊 From all of us at Flexibits, we thank you for your continued support of Fantastical and Cardhop, and we wish you a happy and productive 2025. As always, we have more big things planned for 2025, so we’ll see you next year! Share this article Copied URL to Clipboard!"
