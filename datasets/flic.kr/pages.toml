["https://flic.kr/company/sustainability"]
title = "Flickr Sustainability | Photography forever starts today."
description = "Photography happens on Earth, and Earth needs as many people fighting for it as possible. Here’s how we’re tackling the challenges of climate change head-on."
full_description = "Photography happens on Earth. ‍Earth needs our help.Drif RiadhHow we operate our business is just as important as the businesses we operate.Here’s how Flickr is working toward a cleaner, greener, and more sustainable planet for everyone.climate neutral certifiedTrack, reduce, and compensate—every bit of carbon we produce is accounted for, and we’re part of a growing coalition of businesses dedicated to climate neutrality.Conservation alliance memberLand, water, wildlife, and people—balancing the interests of everyone (and everything) on our planet takes a strong coalition of businesses at your back.certified evergreenExcellence, longevity, and continual improvement—as a values-led and purpose-driven business, we’re in it for the long haul, and we’ve got the certification to prove it.1% for the planet memberResearch, source, and support—members of this global organization contribute at least 1% of their annual revenue to verified environmental causes to protect the planet.Building a better world through the power of photography.Curated LifestyleIlia BronskiyWe have a responsibility as a business to help push for and maintain higher standards of accountability for the health of our planet. If you’d like to get involved, reach out to one of the great organizations above. You’ll be in good company."
