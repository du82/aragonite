ixth scale line with the release of promotional images for its new Wolverine figure. The collectible is available to pre-order now until March 7th, priced at $245; check out the promotional images here… The Mondo X-MEN 1/6 scale line continues with a familiar face … […] Filed Under: Amie Cranswick, News, Television, Toys Tagged With: Mondo, Wolverine, X-Men, x-men '97, X-Men: The Animated Series"
