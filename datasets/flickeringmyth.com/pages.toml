full_description = "Matthew Lillard joins Marvel’s Daredevil: Born Again season 2 March 1, 2025 by Ricky Church Though Daredevil: Born Again is just a few days away from its series premiere, Marvel Studios is already getting prepared for its second season with production beginning next week. To that end, Marvel has announced its first piece of casting news with Deadline reporting that Scream‘s Matthew Lillard is joining the series. Lillard’s role is being […] Filed Under: News, Ricky Church, Television Tagged With: daredevil: born again, Marvel, Matthew Lillard The Lord of The Rings: The Rings of Power season 3 adds Jamie Campbell Bower and Eddie Marsan March 1, 2025 by Ricky Church With The Lord of the Rings: The Rings of Power officially greenlit for a third season, the series has already announced new cast members with Jamie Campbell Bower (Stranger Things) and Eddie Marsan (Ray Donovan) joining the series. Bower is most known for his roles in The Twilight Saga, Sweeney Todd and The Mortal Instruments: City of Bones. He most recently […] Filed Under: News, Ricky Church, Television Tagged With: Eddie Marsan, Jamie Campbell Bower, The Lord of the Rings: The Rings of Power DC’s Lanterns first-look features Aaron Pierre’s John Stewart and Kyle Chandler’s Hal Jordan March 1, 2025 by Gary Collinson With filming now underway on the Green Lantern series Lanterns, DC Studios’ first live-action TV offering under its James Gunn and Peter Safran-relaunched DC Universe, we now have a first teaser image of our two lead Lanterns John Stewart and Hal Jordan, played by Aaron Pierre (Rebel Ridge) and Kyle Chandler (Godzilla vs. Kong) respectively. […] Filed Under: Gary Collinson, News, Television, Top Stories Tagged With: Aaron Pierre, DC, dc studios, Green Lantern, Kyle Chandler, Lanterns Adult Swim shares trailer for Shinichirō Watanabe’s new anime Lazarus February 28, 2025 by Amie Cranswick Adult Swim has released a trailer for Lazarus, the upcoming anime sci-fi thriller series from Shinichirō Watanabe (Cowboy Bebop), which follows team of heroes hunting a deranged neuroscientist holding the world to ransom. Check out the trailer below… The year is 2052. The world seemed to be on the verge of unprecedented peace and stability, and […] Filed Under: Amie Cranswick, Anime, News, Television, Trailers Tagged With: Adult Swim, Lazarus, Shinichirō Watanabe"
