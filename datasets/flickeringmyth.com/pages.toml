["https://www.flickeringmyth.com/about-flickering-myth"]
title = "About Flickering Myth | Flickering Myth"
description = "From British film and the latest Hollywood blockbusters to genre and independent cinema, Flickering Myth covers all aspects of the entertainment industry with pop culture news, reviews, interviews, features and opinions across film, TV, comic books, video games and more. If you’re interested in writing for us please click here, and for advertising enquiries click here. […]"
full_description = "About Flickering Myth From British film and the latest Hollywood blockbusters to genre and independent cinema, Flickering Myth covers all aspects of the entertainment industry with pop culture news, reviews, interviews, features and opinions across film, TV, comic books, video games and more. If you’re interested in writing for us please click here, and for advertising enquiries click here. Team FM Gary Collinson – Managing Director Gary Collinson is a film, television and digital content producer and writer, who is the founder of the pop culture website Flickering Myth and producer of the upcoming gothic horror feature film The Baby in the Basket. He has 20 years of experience within the industry, including a decade of teaching and lecturing in film and media, and is the author of the book Holy Franchise, Batman! Bringing the Caped Crusader to the Screen. Amie Cranswick – Editor-in-Chief Amie Cranswick is the Editor-in-Chief of FlickeringMyth.com. She enjoys a variety of films, TV shows and video games, and her favourite movie is Footloose. Robert Kojder – Chief Critic Robert Kojder was born with Muscular Dystrophy Type 2 and used all his free time from being disabled to heavily study film. He is now a respected film critic and member of the Chicago Film Critics Association. Movies are his addiction, watching and reviewing nearly every new release. EJ Moreno – FMTV Executive Producer EJ Moreno is a film and television critic and entertainment writer who joined the pop culture website Flickering Myth in 2018 and now serves as the executive producer of Flickering Myth TV, a YouTube channel with over 27,000 subscribers. With over a decade of experience, he is a Rotten Tomatoes-approved critic who is also part of the Critics Choice Association and GALECA: The Society of LGBTQ Entertainment Critics. Andrew Newton – Staff Writer – Video Games Andrew Newton’s lifelong passionate affair with gaming began in the late 70’s when he cut his teeth on the Binatone TV Master, from there he moved through generations of handhelds, computers and consoles to the Xbox One. He has a fondness for all things 80’s and a love of anime with his current favourites being Interviews with Monster Girls and One Piece. You can follow him on Twitter here. Tom Jolliffe – Staff Writer – Features Tom Jolliffe is an award-winning screenwriter, film journalist and passionate cinephile. He has written a number of feature films including Renegades (Danny Trejo, Lee Majors), Cinderella’s Revenge (Natasha Henstridge) and War of the Worlds: The Attack (Vincent Regan). He also wrote and served as a producer on the upcoming gothic horror film The Baby in the Basket."
year_published = 2025
year_updated = 2024
