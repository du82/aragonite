full_description = "The Essential Sci-Fi Movies of 1985 (Beyond Back to the Future) March 1, 2025 by admin Casey Chong looks at the essential sci-fi movies of 1985… 1985 was a big year for a certain sci-fi movie called Back to the Future, which made over $210 million in the stateside alone. Robert Zemeckis’ genre-defining, time-travel masterpiece remains a cinematic icon to this day. However, the year also saw a handful of other […] Filed Under: Articles and Opinions, Casey Chong, Featured, Movies, Top Stories Tagged With: Brazil, Cocoon, Enemy Mine, Explorers, Lifeforce, Re-Animator, The Quiet Earth, the stuff 10 Essential Slow-Burn Horror Movies To Give You The Creeps February 24, 2025 by admin Casey Chong with ten creepy slow-burn horror movies… One of the most interesting things about the horror genre is its diverse A-to-Z elements from body horror to found footage, dark fantasy, slasher and supernatural. Then, there’s the slow-burn horror and as the name suggests, this subgenre focuses on the deliberate build-up of the character(s) and […] Filed Under: Articles and Opinions, Casey Chong, Featured, Movies, Top Stories Tagged With: Don't Look Now, Hereditary, It Follows, Let The Right One In, Rosemary's Baby, Session 9, The Orphanage, The Shining, the witch Constantine at 20: The Story Behind the Theological Neo-Noir Comic Book Actioner February 23, 2025 by admin Hasitha Fernando looks at the story behind 2005’s comic book adaptation Constantine starring Keanu Reeves as DC’s Hellblazer… Constantine debuted at a time when comic book movies and the genre as a whole was still getting to where it is today. But even in the present context the film still remains a unique entry in […] Filed Under: Articles and Opinions, Featured, Hasitha Fernando, Movies, Top Stories Tagged With: Constantine, DC, Francis Lawrence, Hellblazer, Keanu Reeves, Peter Stormare, rachel weisz, Shia LaBeouf 1995: The Year Horror Sequels Hit Rock Bottom? February 23, 2025 by EJ Moreno From Halloween 5 to Howling VII, EJ Moreno on why 1995 may be the worst year for horror and slasher follow-ups… The 1980s saw horror reach heights never expected. Franchises were continued, proving the power of intellectual property even in genre fare. Things looked terrific, but then the 1990s entered the chat. Things became murky […] Filed Under: Articles and Opinions, EJ Moreno, Featured, Movies, Top Stories Tagged With: Candyman: Farewell to the Flesh, Children of the Corn III: Urban Harvest, Halloween: The Curse of Michael Myers, Howling VII: New Moon Rising, leprechaun 3, Texas Chainsaw Massacre: The Next Generation"
