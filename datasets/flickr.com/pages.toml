description = '''If you can see through the lens you’re a photographer, if you can see beyond the lens you’re a photojournalist.       All people are welcome whether you’re a professional photojournalist or just happened to be in the right place at the right time to capture that one in a million shot. This group is dedicated to the interrelationship between news/events, protest/war and culture.   Welcome to our photographic journal of the world!  GLOBAL PHOTOJOURNALISM SITE MAP  1. Groups most interesting photos:  www.flickriver.com/groups/global_photojournalism_news_pro...  2. Index to the photography contests. A topic where you can browse current and prior photo contests: www.flickr.com/groups/global_photojournalism_news_protest...  3. Self Introduction thread. Please visit the “Who We Are” topic and tell us a little about yourself and your photography: www.flickr.com/groups/global_photojournalism_news_protest...  4. Place your galleries here; we'd love to see them: www.flickr.com/groups/global_photojournalism_news_protest...  5. Camera Discussion Thread: www.flickr.com/groups/global_photojournalism_news_protest...  6. Group Discussion and Code of Conduct (COC): www.flickr.com/groups/global_photojournalism_news_protest...  2016 Global Photojournalism Group Iconic Photo of the Year:    Demolition Man By Steven Jensen  2015 Global Photojournalism Group Iconic Photo of the Year:   Morning's Meeting by Bahai Yang Hui  and   Salt of the Sea by Pradeep Raja    2014 Global Photojournalism Group Iconic Photo of the Year:  Image Unavailable  Through the Looking-Glass by M G  and   Kiev by Tomas   2013 Global Photojournalism Group Iconic Photo of the Year:   "Charcoal Factory, Tondo - A partial blind charcoal girl" By Mio Cade  2012 Global Photojournalism Group Iconic Photo of the Year:   “Protest in Paris (2012, May 1st)” By philippe b photography  2011 Global Photojournalism Group Iconic Photo of the Year:   "US Army Spc Jacob Moore" by By jeromestarkey  2010 Global Photojournalism Group Iconic Photo of the Year:   "Sharp Dressed Man"  By Ray Skwire (2010)  Group Icon courtesy of and provided by Teresa García Madruga - madrugat  “MA15MA008 Manifestación 15 de Mayo 2011, Madrid” By Teresa García Madruga www.flickr.com/photos/madrugat/5730825376/   Group Photo Pool: Welcome to the Global Photojournalism photograph pool. Accepted and desired photographs are:   Protest – Photographs of protests, riots, demonstrations, rallies, and wars. Culture – Photographs of our global cultures with an emphasis on uniqueness, it’s strongly preferred these photographs include the people of the world in high quality portraiture. Politics - Photographs of political figures or political events from anywhere in the world. News - Photographs of global headline news events.  You must have either personally taken, or own the rights to any image posted. Unlicensed images from news or commercial sources are not permitted.   Our goal is to maintain a high standard of quality and these guidelines have been established: unless directly associated with any head line news events, no photo shopped images (minor image enhancement is allowed), no graphic art, no cartoons, no sports photography, no architecture or landscapes, no wildlife, no scanned text images. It is strongly suggested that all photos submitted to the group have a photo description and/or tags.  2017 Individual Contest Winners  Photojournalist Contest #2017-2.1  Photojournalist Contest #2017-2  Photojournalist Contest #2017-1.1  Almost There  By John Ripper   Photojournalist Contest #2017-1  2016 Individual Contest Winners  Photojournalist Contest #2016-11  2015 Individual Contest Winners  Photojournalist Contest #2015-Iconic Photograph of the Year  Morning's meeting By Bahai Yang Hui   and  Salt of the Sea By pradeep_kmpk14   Photojournalist Contest #2015-011  Cock Kicking... By vinhthphoto   Photojournalist Contest #2015-10/11 Halloween  Zombie sister By Jennifer HEULEU   Photojournalist Contest #20