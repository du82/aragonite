 Contest #11 winning photo:  “Konso” By Marcel Verdoner    Photojournalist Contest #10 winning photo:  “Apparently I'm going to hell.” by owmyhands     Photojournalist Contest #9 winning photo:  "Children of a Charcoal Factory" by royginald.     Photojournalist Contest #8 winning photo:  By Darshan Chakma     Photojournalist Contest #7 winning photo:  By csfotografia2.8     Photojournalist Contest #6 winning photo:  By Un zorro     Photojournalist Contest #5 winning photo:  By jeromestarkey     Photojournalist Contest #4 winning photo:  By Grey Photography    Photojournalist Contest #3 winning photo:  By Ivan LaBianca   Photojournalist Contest #2 winning photo:  By M R Hasan  "Climate Change"  Photojournalist Contest #1 winning photo:  By Politics for Misfits  “Trickle Down Economics”  By Ray Skwire (2010)  "Sharp Dressed Man"  Discussion:  This is a political, protest, news, and cultural discussion and debate format open to everyone in the world and seeking a diversity of opinions from our group members; where all the group members, moderators, and administrators are the columnists, editorial writers, and photojournalists. We seek a global membership to facilitate our discussions, debates, and understanding of one another. Please join us in our blog to share your views of headline news of the world we share together. The group Administrators and Moderators may act to protect members from identity theft, harassment, spamming, personal threats, trolls, and other excesses. Please contact a member of the group staff if you have any questions. The group discussion format functions under a code of conduct (COC); for more details: www.flickr.com/groups/global_photojournalism_news_protest...  Administration:  The policy of the administrators and moderators is to facilitate, but not to instigate, the free exchange of dialogue in discussion and photography among members of the group and peoples of the world.    Disclaimer:  Subject matter submitted to and/or invited to the group does not necessarily reflect the views of all members, moderators, and/or administrators.  The group administrators and moderators reserve the right to remove photographs without warning.    Global Photojournalism; Politics, News, Protest, and Culture Translations:  www.flickr.com/groups/global_photojournalism_news_protest...'''
