title = "Help | Flickr"
full_description = '''Explore What’s New New! Recent Photos Trending Events The Commons Flickr Galleries World Map Camera Finder Flickr Blog Prints The Print Shop Prints & Wall Art Photo Books Get Pro Pro Plans Stats Dashboard Get Auto-Uploadr Log In Sign Up Log In Explore Trending Events The Commons Flickr Galleries Flickr Blog The Print Shop Prints & Wall Art Photo Books Get Pro About Jobs Blog Advertise Developers Guidelines Help Privacy Terms Cookies English Policies & Guidelines Terms Privacy API Community Cookies Data Processing Flickr Privacy Policy For SmugMug’s Privacy Policy click here. Date of Last Revision: October 29, 2024 Flickr, Inc. ("Flickr") is passionately committed to the privacy of our customers. We strive to create consistent standards for all of our users. This agreement was written in English (US). To the extent any translated version of this agreement conflicts with the English version, the English version controls. If any portion of this statement is found to be unenforceable, the remaining portion will remain in full force and effect. This Privacy Policy explains how Flickr collects, uses and discloses information from and about you when you use the Flickr services, including the Flickr mobile and Apple TV applications and Flickr website (collectively, the "Services"). It does not cover data relating to the SmugMug service. We may change this Privacy Policy from time to time. If we make changes, we will notify you by revising the date at the top of the policy and, if the changes are significant, we will provide you with additional notice (such as adding a statement to our homepage or sending you an email notification). We encourage you to review the Privacy Policy whenever you access the Services to stay informed about our information practices and the choices available to you. For information about how to change your privacy settings, please see: https://flickrhelp.com/hc/en-us/articles/4404078163732-Change-your-privacy-settings. Collection of Information Information You Provide to Us We collect information you provide directly to us. For example, we collect information when you: Create an account and subscribe to our digital photography, media hosting or other services; Purchase photo prints or other products or services; Participate in a survey, contest or sweepstakes; Contact us for any reason, such as to request help with the Services or to provide us with your comments/feedback; or Post information in connection with your photos (e.g., in a photo caption) or in other forums or interactive areas of the Services. Otherwise communicate with Flickr. The types of information we may collect include your name, email address, postal address, phone number, fax number, credit card information, bank transfer information, title, gender, and other information you choose to provide. You have the option of telling us how you wish to be identified in connection with your photos, comments and elsewhere using the Services. If you choose to use your real name (or include any identifying information as part of your "nickname") that information will be publicly displayed through the Services. Therefore, please use caution in determining how you wish to be identified in using the Services. Information We Collect Automatically When You Use the Services When you access or use our Services, we automatically collect information about your use of the Services, including: Log Information: We log information about your use of the Services, including the type of browser you use, access times, pages viewed, your IP address and the page you visited before navigating to our Services. Device Information: We collect information about the computer or mobile device you use to access our Services, including the hardware model, operating system and version, screen resolution, color and depth, device identifiers and mobile network information. Location Information: With your consent, we may collect information about the location of your device. For example, we use your location information to provide you with the option to add POI data to your photo. For more details, please see "Your Choices" below. Photo Location Information: When you upload a photo with geographical data (i.e. from a mobile device) or manually geotag your photo, we collect the location of that photo. With your consent, we collect information about your location if you take a photo within the Flickr mobile application to add to your photo’s metadata. EXIF Data: Exchangeable Image File Format (“EXIF”) data is a record of the settings and other relevant metadata inserted by a digital camera when you take a photo or video such as camera type, aperture, shutter speed, focal length, and location (as described above), among other information. Unless you turn off EXIF data on your camera or device or remove it from the picture before uploading to Flickr, Flickr receives and stores EXIF data. Object and Scene Type Recognition Technology We use image recognition algorithms to find visually similar images as well as to help you organize your photos and make it easier to search images. This technology might identify and tag scenes, actions, objects. Information Collected by Cookies and Other Tracking Technologies We use various technologies to collect information, including cookies, web beacons and similar technologies. Cookies are small data files stored on your hard drive or in device memory that help us to provide and improve our Services and your experience, see which areas and features of our Services are popular and count visits, and for our advertising and analytics purposes. We use cookies to keep you logged in to the Services, to count the number of unique computers using the Services and to record your user preferences. We may also collect information using web beacons (also known as "tracking pixels"). Web beacons are electronic images that may be used in our Services or emails and help deliver cookies, count visits, understand usage and campaign effectiveness and determine whether an email has been opened and acted upon. You may be able to set your web browser to refuse certain types of cookies, or to alert you when certain types of cookies are being sent. Some browsers offer similar settings for HTML5 local storage, and Flash storage can be managed here. For more information and more detailed options, please see the “Advertising and Analytics Services Provided by Others” section below. Information We Collect From Other Sources We may also obtain information from other sources and combine that with information we collect through our Services. For example, if you create or log into your account through a social media site, we will have access to certain information from that site, such as your name, account information and friends lists, in accordance with the authorization procedures determined by such social media site. We may receive updated information about you, such as an updated billing address, from the financial institution issuing your credit card in connection with our billing for the Services. When somebody buys a gift for you on our service, we’ll receive your shipping information from the purchaser. Users also can share another person’s email address with us through features that can invite the other person to view the user’s content. Use of Information Our use of the following information, which we call “Photographer Personal Data,” is limited by our agreements with our registered users: (i) images and videos that the user uploads to or creates in the Services, and (ii) any labels, tags, comments, descriptions or categorizations that user adds to those images and videos in the Services. We use other information for the following purposes: To analyze, personalize and improve our Services; To provide the products and Services you order; To respond to questions, concerns, or customer service inquiries; To facilitate contests, sweepstakes and surveys; To enforce the legal terms that govern our business and commercial relationships; To comply with law and legal process and protect rights, safety and property; and For other purposes requested or permitted by our users or other relevant individuals, such as website visitors. We also may use personal information to create appropriately aggregated or anonymized data, which is not subject to this Privacy Policy, and which we may use or disclose for any purpose. Sharing of Information We may share information about you as follows or as otherwise described in this Privacy Policy: With vendors, consultants and other service providers who need access to such information to carry out work on our behalf; In response to a request for information if we believe disclosure is in accordance with any applicable law, regulation or legal process, or as otherwise required by any applicable law, rule or regulation; If we believe your actions are inconsistent with the spirit or language of our user agreements or policies, or to protect the rights, property and safety of Flickr or others; In connection with, or in anticipation of, any merger, divestiture, consolidation, bankruptcy, sale of company assets, financing or acquisition of all or a portion of our business to another company, or other significant corporate event (in which case the acquiring entity may use the information pursuant to its own privacy policies and procedures, to the extent legally permissible); and With your consent or at your direction, including if we notify you through our Services that the information you provide will be shared in a particular manner and you provide such information. We may also share aggregated or anonymized information that does not directly identify you. Our sharing of Photographer Personal Data is governed by our agreement with the user who posted it. If you contact us regarding a request or complaint about Photographer Personal Data, we may forward your communication to the user who posted it. Social Sharing Features and Third-Party Integrations The Services may offer social sharing features and other integrated tools which let you share actions you take on our Services with other media, and vice versa. The use of such features enables the sharing of information with your friends, the public, and others, depending on the settings you establish with the entity that provides the social sharing feature, and depending on that entity’s other sharing practices. For more information about the purpose and scope of data collection and processing in connection with social sharing features, please visit the privacy policies of the entities that provide these features. Additionally, you may give certain third-party apps different levels of permissions to interact with your account to take advantage of things like photo editing tools. If you want to stop using one of these apps and revoke your permission, click the "Remove Permission" link under "Sharing & Extending" on your account page and remove that permission. Advertising and Analytics Services Provided by Others We may allow others to serve advertisements on our behalf across the Internet and to provide analytics services. These entities may use cookies, web beacons, mobile device identifiers, and other technologies to collect information about your use of the Services and other websites, including your IP address, web browser, pages viewed, time spent on pages, links clicked and conversion information. This information may be used by Flickr and others to, among other things, analyze and track data, determine the popularity of certain content, deliver advertising and content targeted to your interests on our Services and other websites and better understand your online activity. For more information about interest-based-based ads, or to opt out of having your web browsing information used for behavioral advertising purposes, please visit www.aboutads.info/choices from each browser that you use to access our websites. You can opt out of Google’s collection or use of your data for ad personalization purposes in any particular browser there or at https://www.google.com/ads/preferences. You also can opt out of Google Analytics by installing Google Analytics’ opt-out browser add-on in each browser. Your device should also include a feature (“Limit Ad Tracking” on iOS or “Opt Out of Interest-Based Ads” or “Opt Out of Ads Personalization” on Android) that allows you to opt out of having certain information collected through apps used for interest-based advertising purposes. Legal Basis for Processing The laws in some jurisdictions require companies to tell you about the legal grounds that allow them to use or disclose your personal data. Where those laws apply, our legal grounds are: Legitimate interests: We often handle personal data because it furthers the legitimate interests of Flickr (or of our customers, affiliates, business partners, or suppliers) in business activities such as the ones listed below, and because that handling of data does not unduly impact your interests, rights, and freedoms: Facilitating free speech, artistic expression, and journalism; Providing customer service; Some of our marketing and advertising activities; Analyzing and improving business activities; Protecting business activities, individuals, and property (for example, protecting against abuse of our Services); and Managing risks and legal issues. To honor our contractual commitments to the individual: Some of our handling of personal data is necessary to meet our contractual obligations to individuals, or to take steps at the person's request because we are planning to enter into a contract with them. For example, when we process an individual’s personal payment data for a subscription, we are relying on this basis. Consent: If the law requires consent, and in some other cases, we handle personal data on the basis of consent. For example, we conduct some of our marketing-related activities on the basis of consent. If the law allows, we may be able to infer consent from the circumstances. Legal compliance: We sometimes need to use and disclose personal data to comply with our legal obligations. Legal claims: Sometimes we use or disclose personal data because it is necessary to establish, exercise, or defend legal claims. We process a user’s Photographer Personal Data as the user’s “processor” (under the GDPR and similar laws) or “service provider” (under the California Consumer Privacy Act) as set forth in our agreement with the user. Security Flickr takes physical, technical and administrative measures to help protect information about you from loss, theft, misuse and unauthorized access, disclosure, alteration and destruction. However, no security measure is perfect. Flickr cannot and does not promise that any information will remain secure. Data Retention We store the information we collect about you for as long as is necessary for the purpose(s) outlined in this Privacy Policy, unless the law requires us to kee'''
