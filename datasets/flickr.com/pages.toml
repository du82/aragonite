title = "Jobs | Flickr"
description = "This is work you will be proud of for the rest of your life."
full_description = "Explore What’s New New! Recent Photos Trending Events The Commons Flickr Galleries World Map Camera Finder Flickr Blog Prints The Print Shop Prints & Wall Art Photo Books Get Pro Pro Plans Stats Dashboard Get Auto-Uploadr Log In Sign Up Log In Explore Trending Events The Commons Flickr Galleries Flickr Blog The Print Shop Prints & Wall Art Photo Books Get Pro About Jobs Blog Advertise Developers Guidelines Help Privacy Terms Cookies English Work at Flickr This is work you will be proud of for the rest of your life. View openings Working at Flickr Our purpose is simple: building a better world through the power of photography. For over two decades, we have led the photography industry and thrived as a private, mission-focused, values-led company. We are a Certified Evergreen brand. We are also a Certified Great Place to Work, Climate Neutral Certified, and members of the Conservation Alliance.We’re building iconic brands that connect people through photography and unleash the value of the stories they tell. We make products that thrill photographers of all types, crafting experiences that empower them to preserve their precious memories, share their art, and run their businesses.A career at Awesome is much more than a job. Our people come first, and we invest in their growth and prioritize their well-being. Your work will contribute to our mission while leaving a positive, lasting impact on our community and our world.Our expanding family of brands includes SmugMug, Flickr, and TWiP (This Week in Photo). Photo by psexypsychic We love Engineers! Flickr engineering is based on the principles of rapid development, continuous deployment, and individual responsibility. Our small engineering team powers one of the largest photo-sharing platforms online. Join us and make Flickr bigger, better, and faster.Flickr Engineering Team Vision & Guiding Principles Photo by peterwelch We’re a tight-knit team! Everyone who joins the Flickr team drives us forward. We are designers making accessible and beautiful products the world loves. We are a customer support team delivering the best 1-1 care in the business. We are photographers and creators, geeks and makers, friends and Flickr Fam. Photo by pratikpatelcs Flickr is BIG Flickr processes millions of photos and videos every day, with billions of photos already online. We serve billions of pageviews and more than 7 billion API requests monthly for more than 100 million registered photographers. Photo by pratikpatelcs Benefits As part of SmugMug, Inc., Flickr provides market-leading employment benefits, including generous HSA and retirement contributions. Our People Team will care for you from the initial hiring process through to your career development within an organization dedicated to growing together. Photo by pratikpatelcs Remote Work Our teams are based out of various parts of the world. At Flickr, we encourage everyone to have a healthy work life balance and offer resources to help you do that. Photo by leticiaroncero Life at Flickr Flickr is quite possibly the most quirky and delightful place you’ll ever work. We welcome creativity, dedication, humor, diversity, and the desire to transform how the world shares photography online. Join us! Photo by pratikpatelcs Current Openings No current openings About Jobs Blog Advertise Developers Cookies Guidelines Privacy Terms Help Report abuse English Privacy Terms Connecting people through photography. About Jobs Blog Advertise Developers Cookies Guidelines Report abuse Privacy Terms English Privacy Terms Connecting people through photography."
