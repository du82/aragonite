title = "About Flickr | We’re the real deal."
full_description = "about us: Photography. For everyone. Forever.We are the world’s biggest (and friendliest!) online photography community. Here's why.Hans IsaacsonValeria KodraAnnie SprattFlickr was founded in 2004 as a revolutionary new kind of community: one committed to elevating the memories, artistry, and impact of photography online.Over the two decades since our founding, we’ve never lost sight of what makes this place so special:InspirationWe’ve got gorgeous photography representing every single subject, technique, style, genre, sub-genre, and sub-sub genre in the world. If you can’t find inspiration on Flickr, it’s not for lack of material.Julian MylesConnectionThere’s a passionate community for everyone here, powered by the kinds of tools that make it easy (and fun!) to co-create, to teach, to learn, to curate, and to grow as a photographer.Annie SprattSharingPhotography is for everyone, and Flickr is forever. We’re dedicated to providing a thriving, easy-to-use home for photography, now and for the next 100 years.Tom Kelley ArchivePhotography forever means fighting for the planet today.Here’s how we’re walking the walk.Find your audience where they find their inspiration.Advertise on flickr.Want to know more about what makes us tick?Get to know Awesome.co"
