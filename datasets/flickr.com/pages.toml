description = "Thank you for joining Flickr for the Planet! This is an official group managed by the Flickr Community team to celebrate your photos of sustainability, conservation, and biodiversity to support upcoming campaigns for organizations such as  1% For The Planet and Climate Pledge. Your images will play a crucial role in highlighting the importance of protecting our natural world and inspiring others to take action. You can participate by joining in on discussions and sharing photography relevant to these discussions in the group pool.  Participate in photowalks at climate-focused events to capture the beauty and urgency of our environmental challenges. These events provide a unique opportunity to document the impact of climate change, connect with fellow photographers, and raise awareness through powerful visual storytelling.  Submission Guidelines:  Add clear, well-composed photos that show the beauty and importance of conservation. When possible, make sure to accompany your photos with descriptions that explain the context, location, and any conservation efforts related to the image. Engage with other members' posts by fave-ing, commenting, and sharing helpful feedback on their photos."
