["https://www.flickr.com/groups/flickr21birthdaychallenge"]
title = "Flickr: The 21 Day Flickr Birthday Photo Challenge Pool"
description = "Help us celebrate Flickr’s 21st birthday by joining us in a 21 day photo challenge. We’ll provide a new prompt for each day starting Feb. 10th asking Flickr members to share their photography, inspire, engage and celebrate with the Flickr community.  Help us keep the fun alive by sharing submissions that align with each day’s featured prompts. Staying on-topic helps group members enjoy the experience and keeps the group focused on what we are celebrating. Photos that don’t match the daily themes may be removed.  The rules are simple, join the group, check out the list of themes and start snapping. Tag your photos with #Flickr21Challenge + the theme of the day (ex. #smile) on the appropriate day and start engaging with other group members.   We'd love for group members to stick to the specific photo per day but if you have to make up any missed days, please share them! Group members WILL be maxed out at 21 photos shared to the group so keep those submissions to one photo per theme.     Participants in the group will have a chance to be featured in Flickr galleries, highlighted on our social platforms and may be considered for a feature in our “Photo of the Day” on Instagram.   At the end of the 21 days, Flickr staff will choose their favorites for every single theme (best per theme/prompt) and will reward the “winners” with Flickr Pro + a feature of their photos in the Flickr blog.   Complete a challenge “streak” (aka full completion): For those who keep up with the challenge and participate with all the themes (one photo per subject), they will be entered into a pool of members eligible to win Flickr Pro.  Need help with tagging your photos?  Check out this article  Have questions, reach out to us at: https://www.flickrhelp.com/hc/en-us/requests/new  Our 21 day challenge runs from February 10th, 2025 to March 3rd, 2025.   Please note:  -Photos must all be ‘Safe’. -Discussion topics beyond the scope of this 21 day challenge may be closed or removed at the admin's discretion, as there are other places on Flickr to get   help or share feedback.  Permissions:  We want to expand the reach of our Flickr members, but respect your rights to your works, so by adding your photos to this challenge group, you will be granting us non-exclusive right use your image/s to promote your work and Flickr on our social media platforms, the Flickr blog, Photo of the Day, newsletter and other emails that Flickr sends. We will credit you and link to your Flickr account where possible.  We use  Flickr’s community guidelines to ensure that this group remains a space where everyone feels welcome to share their work and their stories. Thank you for thinking of your fellow Flickr members and helping us uphold these guidelines."
