title = "Flickr: The HCSP (Hardcore Street Photography) Pool"
description = "POSTING LIMIT NOW ONE PHOTOGRAPH PER WEEK  A group dedicated to candid situations that momentarily reveal themselves amidst the mundane hustle and bustle of everyday life. An ode to all great street photographers such as Winogrand, Arbus, Levitt, Koudelka and many, many more. Respect the past but avoid being beholden to it.  BE AWARE: The group pool is heavily curated. We look through all the submitted photos and only allow the very best into the pool. Once those photos are in the pool, it may not be permanent, as we may periodically go through and fine tune our decisions. Also, by submitting a photograph to the queue your photo may become subject to discussion in the critique thread. Just so you know.  If your submitted photo wasn't accepted into the pool, please don't start a new thread asking why because this group rejects hundreds of photos daily, and explaining each decision isn't how we want to spend our time.  If you want an opinion about your photo, please see the image critique thread and read the instructions there.    Don't take it personally.   What goes and what stays?  Read the group description. Give us a reason to remember the photograph. Ask yourself, what makes it so special, why is it worth remembering for more than a split second? The reason why it's so hard for us to tell you why we keep or delete a photo from the pool is because we don't have a quantified set of rules. It's just a feeling that we have.  Look through some of the Magnum images for starters. Check out In-public. Read Michael David Murphy's Ways of Working and Phyla of Street Photography and Nick Turpin's  Undefining Street Photography  Interesting Threads  Admins' favourites (1,  2) Members' favourites Books Published by Members of HCSP The Library List Interviews Cuttings Random Crap Which films should a photographer see? photo books - good deals Street Photography Video! Quotes from Photographers (Relating to Street Photography, Perhaps)  A Confederacy of Dunces (Part 1) The Infinite Monkey Theorem  Print exchanges The new resurrected image critique thread, The All-New, All-New Image Critique Thread, image critique thread, The new image critique thread (active) The short edit thread - personal The short edit thread - others Groups we like and what are people doing right now?, what are people doing right now? Blatant selfpromotion thread  HCSP Galleries Gallery Set IV: Panoramic Images, Ben Roberts Gallery Set III: Pacific Boredom, Ludmilla Morais Gallery Set II: Untitled (Images from Tokyo), Mecan Gallery Set I: Brazil Series, David Solomons"
