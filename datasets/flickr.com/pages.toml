["https://www.flickr.com/groups/blackwhite"]
title = "Flickr: The B&W Pool"
description = '''Dedicated to the beauty that is black and white.  This is a PURE black and white group. Black & White photos only. No Color-Tinted/Toned photos. No Selective-Color photos. No Low-Saturation Color photos. Any editing process or scan is allowed, as long as no color is noticeable in the posted image. If, for ANY reason, a color cast is noticeable, the photo is not for this group. Please remember...all black and white images are monochrome, but not all monochrome images are black and white. It doesn't make a difference whether colors show naturally, or by editing...if colors appear in the image, then it's not for this group. (However, most issues with color can easily be corrected by simply 100% de-saturating the image.) Please, no color borders. Refrain from re-posting the same photo over and over...once is sufficient. No photos of other people's work...only your own. No "Second Life", "Midjourney" and/or "AI-Generated" images. Please, no religion; no political, no advertising; no photos of dead animals and/or animals being killed. Thank you. :-)  It should be noted that if any posting goes against the stated rules, the poster will get a copy-&-paste notification in the comments under the photo, and the photo removed. I wish to run a happy group, with happy members adhering to the rules...but every once in a while, members do not like to be notified of their errant ways, and respond very belligerently and/or cursing me out. For years, I've been taking the high road when this happens, and politely just suggesting they re-read the rules. At this point, more and more and more posters are not adhering to the rules and negatively responding. So now, any further belligerence will simply be met with being removed and/or banned from the group, depending on the belligerence. I'm not looking to win any popularity contests...just run a happy group...without all the needless headaches I'm incurring now.  (Of course...if I DO win a popularity contest, I won't turn it down. lol)  (Last updated 2015-08-17)'''
