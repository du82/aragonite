title = "Flickr: The Your Best Shot 2024 Pool"
description = '''Group Description  Submissions are open December 1, 2024 - January 4, 2025.  Welcome to Your Best Shot, our biggest contest of the year!  - Categories: Choose one of the FIVE categories to submit your photo to, Learn more in the group FAQs.  - Prize packages:   Each of the five category winners will receive:  A metal print of a photo of your choice up to 20x30 print  A year subscription of Flickr Pro   And this year we’re offering a very special grand prize for the best of the best! From the 5 category winners, we’ll choose a grand prize winner. Our grand prize winner will receive a brand-new camera and can choose their preferred camera from four great options -   Sony A7 IV Canon EOS R6 Mark II Fujifilm X-T5 Nikon Z7 II   Throughout December we’ll curate submissions and share themed galleries with our favorite shots from the photo pool, feature photos on our "Flickr Photo of the Day", and more -  so join the group, read up on submission guidelines, and start looking for your best shot of the year.  Please note: – We will remove videos or collages of still images contributed to the pool. We only want your one best shot. – Discussion topics beyond the scope of Your Best Shot; may be closed or removed at the admin's discretion, as there are other places on Flickr to get help or share feedback.  Group Rules FLICKR YOUR BEST SHOT 2024 CONTEST OFFICIAL RULES  NO PURCHASE NECESSARY. A PURCHASE WILL NOT IMPROVE YOUR CHANCE OF WINNING.  CONTEST DESCRIPTION: YOUR BEST SHOT 2024 (the “Contest”) begins on or about December 1, 2024 at 9am PT and ends on January 4, 2025 at 7pm PT (the “Submission Period”). During the Contest Period, entrants will have the opportunity to upload an original photograph a (“Photo”) to the Your Best Shot 2024 group available at www.flickr.com/groups/yourbestshot2024/ pursuant to the Group Rules available at www.flickr.com/groups/yourbestshot2024/ and the Flickr Terms of Use available at www.flickr.com/help/terms (each a “Submission”). Only publicly viewable images will be considered valid entries. One Submission per entrant. By participating in the Contest, each entrant unconditionally accepts and agrees to comply with and abide by these Official Rules and the decisions of SmugMug, Inc., (“Sponsor”) which shall be final and binding in all respects.  ELIGIBILITY: The Contest is open only to entrants who are 18 years of age or older at the time of entry. Residents of Cuba, Iran, North Korea, Sudan, Syria and countries currently subject to United States embargo or on the United States list of state sponsors of terrorism are not eligible to participate. For a current list of countries currently subject to United States embargo or on the United States list of state sponsors of terrorism, go to pmddtc.state.gov/embargoed_countries/index.html. Officers, directors and employees of Sponsor, and their subsidiaries, affiliates, members, and each of their immediate family members and/or people living in the same household are NOT eligible to enter the Contest or win a prize. This Contest is void where prohibited by law. Contest subject to all federal, state and local laws.  HOW TO ENTER: No purchase necessary. To participate in the Contest, you must have a Flickr account. During the Submission Period, upload an original Photo that demonstrates your best interpretation of the content theme to the Flickr Group located at: www.flickr.com/groups/yourbestshot2024/. Submissions must meet the following “Submission Requirements”: (i) the Submission must be the submitting entrant’s original work and not feature or focus on any material owned or controlled by third parties (including without limitation, third party copyrighted material); (ii) the entrant must provide upon request all appropriate clearances, permissions and releases for the Submission; (iii) the Submission must not include images that are not “Safe” in accordance with the Flickr Community Guidelines located at www.flickr.com/groups/yourbestshot2024/, or images that are obscene, pornographic, libelous or otherwise objectionable; (iv) the submission must have been uploaded to Flickr in 2024; and (v) the entrant must add one of the following category tags (keywords) to their Submission: #YBS24Portrait, #YBS24Nature, #YBS24Urban, #YBS24Open, and #YBS24ThroughTheirLens or #YBS24ThroughHerLens. To learn more about these categories, see the Group FAQs *We encourage women and non-binary photographers to add YBSThroughTheirLens24 or YBSThroughHerLens24 as a tag to their main contest submission in addition to the main category tag they choose. For example, women and non-binary photographers can tag their submission with YBSNature24 and YBSThroughTheirLens24 or YBSThroughHerLens24.  Any entry featuring a Submission that, in Sponsor's good faith judgment, violates the Submission Requirements will be disqualified. All Submissions must be received by the end of the Submission Period. Proof of entering information on the Website is not considered proof of delivery to or receipt by Sponsor of such entry. All Submissions and use of the Flickr site are subject to the Terms of Use policy, which shall remain in full force and effect.  No cash alternative or prize substitutions will be allowed, except Sponsor reserves the right to substitute prize(s) of comparable value if the prize listed is unavailable for any reason, including cancellation of the Contest. Prize may not be extended, transferred or refunded. Any stated difference between the approximate value and actual value of a prize or any substituted prize will not be awarded. Winners are solely responsible for all federal, state and/or local taxes, and the reporting consequences thereof, and for any other fees or costs associated with the applicable prize. Sponsor makes no warranties, and hereby disclaims any and all warranties, express or implied, concerning any prize furnished in connection with the Contest. WITHOUT LIMITING THE GENERALITY OF THE FOREGOING, SUCH PRIZES ARE PROVIDED “AS IS” WITHOUT WARRANTY OF ANY KIND, EITHER EXPRESS OR IMPLIED, AND SPONSOR HEREBY DISCLAIMS ALL SUCH WARRANTIES, INCLUDING BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND/OR NON-INFRINGEMENT.  SELECTION OF WINNERS: On or about January 31, 2025 a panel of judges composed of Flickr staff appointed by Sponsor will select the winners (the “Judging Panel”) from among all eligible Submissions. The Judging Panel will determine the winners based on the following selection criteria: originality, creativity, and skill. The winners will be notified by SmugMug Inc. on or about January 31, 2025. Incomplete entries will not be accepted. The number of eligible entries will determine the odds of winning. In Sponsor’s sole discretion, a selected winner may be required to forfeit a prize and an alternate winner may be selected in accordance with these Official Rules from among the remaining eligible entries for that prize if selected winner (i) is unreachable, (ii) declines or cannot accept, receive or use the prize for any reason, or (iii) fails to comply with these Official Rules.  GRANT OF RIGHTS: For good and valuable consideration, the receipt and legal sufficiency of which is hereby acknowledged, each entrant into the Contest hereby irrevocably grants Sponsor, its successors and assigns, a non-exclusive, limited license (but not the obligation) to reproduce exploit and otherwise use the Submission for a period of [twelve (12) months from the expiration of the Submission Period], solely in connection with the Contest and the marketing and promotion thereof, throughout the universe, in perpetuity, in any and all media, without further notice to, consent by, or payment to entrant. Without in any way limiting the foregoing, Sponsor shall have the right, in its sole discretion, to edit, composite, morph, scan, duplicate, or alter the Submission in connection with Sponsor’s permitted uses hereunder and each entrant irrevocably waives any and all so-called moral rights they may have therein. Any alterations shall be made in accordance with Sponsor’s ethical guidelines. By entering the Contest, each entrant acknowledges and agrees that their Submission may be featured on Sponsor (and Sponsor’s assigns) social media and editorial websites. All uses of a Submission Photo will always include a credit line with the name of the owner and will never be sold at any time for profit.  FURTHER DOCUMENTATION: If Sponsor shall desire to secure additional assignments, releases from third parties appearing in the Submission, or other documents as Sponsor may reasonably require in order to effectuate the purposes and intents of these Official Rules, then each entrant agrees to sign the same upon Sponsor’s request therefor.  LIMITATION OF LIABILITY AND GENERAL CONDITIONS: By participating in this Contest, entrants agree to be bound by these Official Rules and the decisions of the judges, which are final and binding in all respects. By entering, each entrant agrees to release, discharge, indemnify, and hold harmless the Sponsor and its parent companies, affiliates, subsidiaries and advertising and marketing agencies and each of their respective employees, officers, shareholders, directors, representatives and agents (collectively, “Releasees”) from and against any claims, damages or liability involving or arising out of (i) late, lost, delayed, misdirected, postage due, mutilated, incomplete, unreadable, inaccurate, garbled or unintelligible entries; (ii) telephone system, technical or computer malfunctions, lost connections, disconnections, transmission or other errors of any kind whether mechanical, human, electronic or otherwise; (iii) data corruption, theft, destruction, unauthorized access to or alteration of entry or other materials; (iv) any injuries, losses or damages of any kind caused, including death, in whole or in part, directly or indirectly, by the prize or resulting from acceptance, possession or use or misuse of any prize or from participating in the Contest or any Contest related activity; or (v) any printing, distribution, typographical, administrative, human or technological errors involving or associated with the Contest. Sponsor disclaims any liability for damage to any computer system resulting from participating in, or accessing or downloading information in connection with the Contest. Sponsor reserves the right, in its sole discretion, to modify, cancel or suspend this Contest (or any portion of the Contest) should any virus, bug, computer problem or other cause or problem corrupt or inhibit the administration, security or proper operation of the Contest and, in such situation (or in the event of any type of error), to select the winners from eligible entries received prior to the action taken or in such manner as deemed fair and appropriate by Sponsor. In no event will Sponsor be liable for more than the stated number of prizes in these Official Rules. Sponsor may prohibit entrant from participating in the Contest or winning a prize if, in its sole discretion, it determines entrant is attempting to undermine the legitimate operation of the Contest by cheating, hacking, deception, or other unfair practices or intending to annoy, abuse, threaten or harass any other entrant or Sponsors’ representatives. Releases have not made and/or are not responsible for any misrepresentation or guarantee, express or implied, in fact or in law, relative to the prizes. By accepting a prize, winner agrees and acknowledges that Sponsor may use winner’s name, voice, biographical data, likeness and city name in any and all media throughout the universe and in perpetuity for promotional purposes without additional compensation, except where prohibited by law. By entering the Contest, entrants agree that: (1) any and all disputes, claims, and causes of action arising out of or connected with the Contest, or any prizes awarded, shall be resolved individually, without resort to any form of class action; (2) any and all claims, judgments and awards shall be limited to actual out-of-pocket costs incurred, including costs associated with entering the Contest, but in no event will attorneys’ fees be awarded or recoverable; and (3) under no circumstances will any entrant be permitted to obtain any award for, and entrant hereby knowingly and expressly waives all rights to seek, punitive, incidental or consequential damages and/or any other damages, other than actual out-of-pocket expenses, and/or any and all rights to have damages multiplied or otherwise increased.  WINNERS LIST: For the names of the prize winners, available after January 31, 2025 or a copy of these Official Rules, send a self-addressed, stamped envelope to: SmugMug Inc., 67 East Evelyn Avenue, Mountain View, CA 94041. Please specify “YOUR BEST SHOT Official Rules” or “YOUR BEST SHOT Winners List.”'''
