title = "Flickr: The Less Is More... Pool"
description = '''The Less is More... group is a focus on minimalism. Often Minimalism focuses on removing all context from a photograph. Abstractions are welcome.  Minimalism (as defined by Merriam-Webster)  min·i·mal·ism  1 : MINIMAL ART : abstract art consisting primarily of simple geometric forms executed in an impersonal style  2 : a style or technique (as in music, literature, or design) that is characterized by extreme spareness and simplicity.  Minimalism (as defined by 'Less is More...')  min·i·mal·ism  The essence of the image.  Everything that "doesn't matter" is stripped out, leaving only the focus, whether it be a shape or a color or an emotion. Simple in form (usually) but may be very complex in nature or in detail.  The "finest" examples of minimalism encompass all three to a degree - a clarity of imagery - a purity almost... nothing hidden, just an image laid bare.   "I've always loved the zen quality of minimalism. Submit your photos and invite your friends, family, contacts or any Flickr user whose photo you feel demonstrates excellent use of Minimalism." - MsCapriKell, pool creator.  Be sure to join our sister group, Less is More: The Best. This is our "best of the best" showcase of the absolute top minimalism on Flickr.'''
