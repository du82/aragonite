["https://flintamarch.de/zur-demo/barrierefreiheit"]
title = "Barrierefreiheit – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Wir bemühen uns, die Demonstration möglichst barrierearm zu gestalten. Auf dieser Seite informieren wir euch über mögliche Barrieren. Bitte beachtet bei allen Informationen zur Route, dass diese sich aus Sicherheitsgründen – beispielsweise wenn wir mehr oder weniger Menschen sind als geplant – immer noch verändern kann. Barrieren für Rollstühle, Kinderwägen etc.: Wir starten mit unserer Demonstration am Pariser Platz. Die Mittelinsel dort befindet sich auf einem erhöhten Bordstein, an den Seiten gibt es Absenkungen. Die Demouroute verläuft auf Asphalt, es gibt keine Pflastersteine oder ähnliches. Wir gehen allerdings über zwei Brücken – die Marschallbrücke und die Weidendammer Brücke, an denen einen etwas Steigung erwartet. An einer Stelle biegen wir auf die Friedrichstraße ab, wo in der Mitte die Tram verläuft. Zwischen den Tramspuren und dem Bürgersteig rechts ist ca. eine Autolänge Platz, die gut befahrbar ist. Die Demoroute wird ungefähr eine Stunde dauern. Wer nichts verpassen möchte, aber trotzdem keine Stunde laufen kann, kann zu Beginn des Demozuges von U Brandenburger Tor eine Station bis U Unter den Linden fahren und dort den Demozug abwarten, der am Ende von der Friedrichsstraße in unter den Linden einbiegt. Es gibt in der Nähe keine öffentlichen, kostenlosen Toiletten. Bei S/U-Brandenburger Tor, dem Platz des 17. Juni und an der Friedrichsstraße gibt es mehrere öffentliche Toiletten, für die gezahlt werden muss. Unsere Redenbeiträge sind in deutscher Lautsprache. Zudem haben wir eine Gebärdensprachendolmetscher*in für die deutsche Gebärdensprache. Bei unserer Demo ist ein Awarnessteam anwesend, welches ihr ansprechen könnt. Wenn ihr weitere Fragen zu Barrieren habt, könnt ihr uns gerne per Mail an flintamarch@gmail.com schreiben."
