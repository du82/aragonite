["https://flintamarch.de/spenden"]
title = "Spenden – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Hier klicken, um auf Gofundme zu spenden! Wir sind eine Gruppe von jungen Menschen, die sich als Ziel gesetzt haben, innerhalb von wenigen Wochen eine feministische Zentraldemonstration zu starten. Leider kostet sowas auch immer Geld – und dafür brauchen wir dich! Wir brauchen Plakate, Flyer, aber auch beispielsweise Technik am Tag selbst, und all diese Sachen kosten leider eine ganze Menge Geld. Und da kannst du uns unterstützen! In einer Welt, in der eine Krise auf die nächste folgt, kann man schnell mal die Hoffnung verlieren – das hier gibt uns Hoffnung und vielleicht ja auch dir. Einmal kurz die Hard Facts: Was? Eine feministische Zentraldemo am Wochenende, an dem auch der People’s March in den USA stattfindet am Tag vor Trumps Einzug ins weiße Haus und einen Monat vor der Bundestagswahl in Deutschland. Wann? Am 19.01.2025, 12 Uhr Wer? Eine Gruppe engagierter junger Menschen, die eine neue Initiative „FLINTA* March 2025“ bilden. Wo? Berlin, Brandenburger Tor. Und hier noch ein paar genauere Informationen: Wer sind „wir“? Für dieses große Projekt hat sich in der letzten Woche eine motivierte Gruppe von ungefähr 20 Menschen zusammengefunden! Die meisten von uns haben bereits Erfahrung mit ähnlichen Projekten, viele von uns sind unter Anderem seit Jahren ehrenamtlich aktiv und waren schon an der Organisation von mehreren Großdemonstrationen beteiligt. Im Verlauf der Planung wird voraussichtlich ein breites Bündnis entstehen, einige Gruppen haben uns bereits ihre Unterstützung zugesagt. Warum machen wir das alles? Der Rechtsrutsch und die politischen Entwicklungen global wie auch hier im Land machen uns allen Angst. Weltweit werden die Rechte von FINTA* Personen und anderen diskriminierten Menschengruppen immer weiter eingeschränkt, die jahrzehntelang erkämpften Ergebnisse feministischer Arbeit scheinen zu wackeln. Gerade erst hat Donald Trump, ein Faschist und Vergewaltiger die wichtigste Wahl der Welt gewonnen und wird am 20.01.2025 als Präsident der Vereinigten Staaten von Amerika schon zum zweiten Mal ins weiße Haus einziehen und seine misogynen Aussagen lassen darauf schließen, dass er vorhat, die Rechte von FINTA* Personen weiterhin einzuschränken, große Rückschritte im Bereich Frauen- und Trans*-Rechte wurden in von der republikanische Partei regierten Staaten in den letzten Jahren immer wieder gemacht. Auch hier in Deutschland ist eine Abtreibung unter §218 bis heute faktisch nicht legal. Alle drei Tage begeht ein Mann ein Femizid. Nebenbei geben 18% der Wahlberechtigten an, ihre Stimme bei der nächsten Bundestagswahl einer neofaschistischen und inheränt rückwärtsgewandt-sexistischen rechtspopulistischen Partei, wie die AFD es ist, zukommen zu lassen und die antifeministischen Strömungen rechter bis rechtsextremer Parteien nehmen zu. Das können wir uns nicht gefallen lassen! Wir werden nicht darauf warten, dass in Regierungen und Parlamenten über unsere Rechte verhandelt werden und uns unsere Selbstbestimmung über unsere eigenen Körper genommen wird. Deshalb haben wir uns entschieden, dem etwas entgegenzusetzen! Und was ist der Plan? Wir planen die Organisation einer zentralen Großdemo mit Bezugnahme auf feministische und FINTA* bezogene Themen weltweit in Berlin, die wir für den 19. Januar 2025 (an dem Wochenende, an dem auch der People’s March in den USA stattfindet) ansetzen! Des Weiteren planen wir, bundesweit Menschen zur Teilnahme mobilisieren. Dafür wollen wir Busanreisen aus verschiedenen Städten in ganz Deutschland ermöglichen. Was brauchen wir dafür? Die Demonstration wird nicht von einer einzelnen Organisation oder Gruppe ausgetragen. Wir wollen möglichst vielen verschiedenen Gruppen, Bewegungen und Initiativen die Möglichkeit bieten, sich zu beteiligen. und als Initiative haben wir uns spezifisch zu diesem Zweck neu gegründet. Deshalb sind wir aber auch auf Unterstützung anderer Gruppen angewiesen, sowohl in der Mobilisierung als auch insbesondere finanziell. Leider kostet eine Zentraldemo neben personellen Kapazitäten, die wir ehrenamtlich stellen können und möchten, auch Geld für Plakate, Flyer, aber auch beispielsweise Technik am Tag selbst. Wofür werden Spenden verwendet? Die Spenden werden ausschließlich für das Projekt verwendet, für Technik, Bühne, Mobilisationsmaterial, Druckkosten etc. Alles, was wir darüber hinaus haben, wird gespendet. Das Projekt ist ein nonprofit-Projekt und jegliche Organisationsarbeit wird ehrenamtlich gemacht. Wie kann ich Spenden? Wir haben eine Gofundme-Kampagne eingerichtet, bei der ihr für uns spenden könnt. Bei Fragen zu dem Spendenprozess könnt ihr uns gerne unter fintamarch@gmail.com erreichen. Jetzt spenden Schlagwörter: demonstrationfintaflintaflinta marchspendenspendenaufruf"
year_published = 2024
clearnet = "https://flintamarch.de/spenden"
