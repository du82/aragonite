["https://flintamarch.de/zur-demo/wer-darf-kommen"]
title = "Wer darf kommen? – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Auf unserer Demo sind grundsätzlich alle Personen willkommen – das heißt auch nicht-FLINTA* Personen. Wir freuen uns darüber, wenn cis Männer als Allies kommen und ihre Solidarität zeigen. Bitte achtet allerdings darauf, dass ihr bei der Veranstaltung nicht zu viel Raum einnehmt, so dass sich FLINTA* Personen wohl fühlen. Informationen für Parteien und Firmen: Unsere Demo ist weder eine Wahlkampfveranstaltung, noch eine Werbeveranstaltung. Wir freuen uns darüber, wenn zu unserer Demo aufgerufen wird, bitten aber darum, die Aufmerksamkeit nicht von den Themen zu nehmen, um die es geht, und die Themen und unseren Protest nicht für den Wahlkampf zu instrumentalisieren. Kommt gerne vorbei, aber bitte haltet euch als Partei/Firma zurück. Wir bitten alle Teilnehmer*innen darum, keine Nationalflaggen mitzubringen."
