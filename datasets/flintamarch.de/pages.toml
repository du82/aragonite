["https://flintamarch.de/narrativ"]
title = "Narrativ – FLINTA* March 2025 – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "„Your body, My choice. Forever.” Diesen Tweet postete der berüchtigte Rechtspopulist Nicholas Fuentes an dem Tag, an dem Donald J. Trump zum zweiten Mal zum US-Präsidenten gewählt wurde. Demokratische Kräfte auf der ganzen Welt verarbeiteten noch den Schock, in den nächsten vier Jahren um die amerikanische Demokratie fürchten zu müssen, als er das aussprach, was sich eigentlich nur als Drohung verstehen lässt. Und doch gehört es zur sehr realen Agenda der politischen Rechten. Das Recht auf Abtreibung in den USA ist eine der großen Errungenschaften feministischer Bewegungen des 20. Jahrhunderts. Nicht nur aber wurde die gesetzliche Selbstbestimmung Schwangerer in den USA durch die Umkehrung von Roe v. Wade in 2022 massivst eingeschränkt – mit Trump als republikanischem Präsident steht das Recht entgültig auf der Kippe. Unsere Körper werden casually zum politischen Spielplatz erklärt. Donald Trump ist ein Sexualstraftäter, notorischer Lügner, verurteilter Verbrecher und Sexist. Obwohl er seine rechtsextremen Vorhaben als offenes Geheimnis präsentiert, darf er erneut ins Weiße Hause einziehen. Dass eine Mehrheit der USA sich hinter ihm versammelt, ist ein riesiger Schlag ins Gesicht für FLINTA*s auf der ganzen Welt und für sämtliche marginalisierte Minderheiten. Längst hat es sich im politischen Wahlkampf der USA etabliert, die Rechte von trans* Menschen, gar ihre ganze Existenz, munter zur Debatte zu stellen. Weltweit erleben die vulnerabelsten Mitglieder der queeren Community, wie ihr Trans* sein zum politischem Objekt umfunktioniert wird. Doch das sind weltweit nicht die einzigen Rückschritte im Bereich der Rechten von FLINTA* Personen. In diesem Jahr hat das Vereinigte Königreich die Gewalt gegen Frauen in England und Wales zum nationalen Notstand erklärt. Polizeiliche Analysen waren zuvor zu dem Ergebnis gekommen, dass schätzungsweise über zwei Millionen Frauen jährlich Opfer männlicher Gewalt werden. Die Situation von Frauen in Afghanistan verschlechtert sich konstant. Das von den Taliban verhängte sogenannte „Tugendgesetz“, welches in diesem Jahr beschlossen wurde, deklariert sogar die Stimme der Frau als intim. Diese darf in der Öffentlichkeit nicht mehr gehört werden – nicht singend, nicht reimend, nicht rezitierend. Von der Kriegsführung der israelischen Regierung im Gazastreifen sind unter den Palästinenser*innen primär Frauen und Kinder betroffen – sie machen 70 Prozent der Getöteteten aus. Die Lebendigen sind in einer humanitären Notlage gefangen: Durch Blockaden kommt kaum Nahrung in das Gebiet, es mangelt an medizinischer Ausrüstung. Menstruierende müssen teilweise auf Zeltschnipsel zurückgreifen, weil ihnen keine Periodenprodukte zur Verfügung stehen. Gleichzeitig waren die Angriffe der Hamas am 7. Oktober 2023 durch schwerste sexualisierte Gewalt geprägt. Im Irak ist ein Gesetz nahezu beschlossen, das das konsensfähige Alter von Mädchen von 18 auf neun Jahre senken wird und somit nicht nur sexuellen Kontakt zu Mädchen ab neun Jahren legalisiert, sondern auch die Heirat im gleichen Alter. Auch hier in Deutschland ist eine Abtreibung unter §218 bis heute faktisch nicht legal. Alle drei Tage begeht ein Mann ein Femizid. Nebenbei geben 18% der Wahlberechtigten an, ihre Stimme bei der nächsten Bundestagswahl einer neofaschistischen und inheränt rückwärtsgewandt-sexistischen rechtspopulistischen Partei zukommen zu lassen. Die AfD spricht sich in ihrem Wahlprogramm von den letzten Europawahlen sogar für ein Verbot von Abtreibungen aus, lehnt teilweise überlebenswichtige trans*-Healthcare wie Pubertätsblocker ab und betreibt mit Begriffen wie „Gender-Ideologie“ und „Frühsexualisierung“ Hetzte gegen Queere Menschen. Die Existenz von nicht-binären Menschen wird im Wahlprogramm verleugnet. Die AfD verkörpert alles, was marginalisierte Gruppen heutzutage bedroht. Parallel mahnt sich ein CDU-Mitglied an, halbironisch in Tweets das Frauenwahlrecht infrage zu stellen, sollte Robert Habeck durch Frauen zum Kanzler gewählt werden. Diese träfen Entscheidungen vermeintlich emotionaler als Männer. Friedrich Merz, hinter dem sich die CDU für das Kanzleramt versammelt, erklärte im September, als Mann würde er sich zu einem Fahrer mit Kafiya ins Taxi setzen, als Frau allerdings nicht. Frauen fehle dafür das nötige Selbstvertrauen, brachte er Ricarda Lang entgegen. Das ist nicht nur rassistisch – weiblich sozialisierten Personen wird dabei fast spielerisch populistisch ihr Sicherheitsgefühl abgesprochen. In Zeiten ohnehin starker gesamtgesellschaftlicher Krisen und steigender Ungleichheit müssen wir beobachten, wie Sexismus und das Einschränken der Rechte marginalisierter Gruppen politisch salonfähiger wird. Die Mysogonie nimmt zu, progressive Themen finden kaum noch Beachtung und wir sehen unsere Rechte durch die Normalisierung von Gewalt gegen FLINTA* Personen und dem stetig weiter nach rechts abwandernden Diskurs ernsthaft bedroht. Wir werden aber nicht zusehen, wie rechtspopulistische Kräfte uns eiskalt in das letzte Jahrhundert katapultieren! Nicht ohne einen Kampf. Einen Monat vor der Bundestagswahl und einen Tag vor Trumps offizieller Amtseinführung gehen wir auf die Straße. Geschlossen, als FLINTA*s in einem Land, in dem wir das Recht haben, unsere Stimme zu erheben. Für all diejenigen, die es nicht haben. Und für all die FLINTA*s, die ihr Leben durch das Patriarchat verloren haben und ihre Stimmen nie wieder erheben können. Fotocredit: Lukas Stratmann AllgemeinStartseiteZur DemoBarrierefreiheitWer darf kommen?ForderungenÜber Uns & Unser BündnisDatenschutzerklärung Schlagwörter: berlindemofintaflintagroßdemonarrativprotest"
