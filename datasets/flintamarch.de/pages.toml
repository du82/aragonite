full_description = "Schutz und Ausbau des Rechts auf Abtreibung Das Recht auf körperliche Selbstbestimmung für Schwangere muss garantiert sein! Deshalb fordern wir eine Abschaffung von §218 Stgb. Bekämpfung geschlechtsspezifischer Gewalt Es braucht eine nationale Strategie und Gesetze zur Bekämpfung von Gewalt gegen FLINTA*s. Dazu gehören Maßnahmen gegen Femizide und Schutzprogramme sowie mehr und bessere Anlaufstellen für Betroffene sexualisierter und häuslicher Gewalt, inklusive ausreichender Frauenhausplätze. Trans* Rechte schützen: Es darf keine rechtliche oder gesellschaftliche Infragestellung der Existenz und der Rechte von trans* Personen wie des Selbstbestimmungsgesetzes geben. Deshalb müssen Antidiskriminierungsgesetze gestärkt werden und Hassverbrechen gegen queere Personen konsequent verfolgt werden."
