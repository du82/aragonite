["https://flintamarch.de/neue-aktion-queerfeministischer-block-beim-klimastreik"]
title = "Neue Aktion: Queerfeministischer Block beim Klimastreik! – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Destroy patriarchy, not the planet! 💜🔥 Wir beteiligen uns als FLINTA* March am 14.02. am Klimastreik von Fridays For Future Berlin. Am Valentinstag wird mit Blick auf die anstehenden Bundestagswahlen erneut für Klimagerechtigkeit gestreikt – und dabei dürfen auch FLINTA*s nicht vergessen werden ✨📢 Die Klimakrise trifft nicht alle Menschen gleich. FLINTA*s (Frauen, Lesben, inter*, nicht-binäre, trans* und agender Personen) sind von den Auswirkungen der Klimakrise weltweit besonders betroffen. Gleichzeitig spielen patriarchale Strukturen eine zentrale Rolle bei der Ausbeutung von Mensch und Natur – und Feminismus eine zentrale Rolle für Klimagerechtigkeit, wie Luisa Neubauer in ihrer Rede auf dem FLINTA* March gezeigt hat.💜🫶 Doch die Bedrohung endet hier nicht: Die queerfeministische Community sieht sich zusätzlich durch erstarkende faschistische Kräfte bedroht, die nicht nur gesellschaftlichen Fortschritt, sondern auch den Kampf für Klimagerechtigkeit gefährden. Wir kämpfen für eine feministische Perspektive auf die Klimagerechtigkeit – weil soziale und ökologische Gerechtigkeit zusammengehören! ✊🏻🔥Wir unterstützen die Forderungen von Fridays For Future Berlin und machen darauf aufmerksam, wie die Klimakrise und Geschlechtergerechtigkeit miteinander verknüpft sind. Um 12 Uhr geht’s los am Brandenburger Tor. Kommt vorbei – it’s a date! 💌 P.S. Nach dem Demo könnt ihr gerne am Brandenburger Tor bleiben: Um 16 Uhr startet dort One Billion Rising, einer Tanzdemo gegen geschlechtsspezifische Gewalt. 💃 Auf dem Klimastreik von Fridays For Future Berlin wird der Queerfeministische Block unter anderem vom FLINTA* March, Queermany, Feminist Rebellion und Femunity unterstützt. Schlagwörter: blockFeministischer BlockFLINTA* BlockfridaysforfutureklimastreikQueerfeministischer Block"
