["https://flintamarch.de/allgemein"]
title = "Allgemein – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Unsere Demonstration startet am 19.01.2025 um 12 Uhr am Brandenburger Tor an der Seite des Pariser Platzes. Die einfachste Anfahrt ist über S/U Brandenburger Tor möglich, das Brandenburger Tor ist jedoch auch in Laufweite vom Hauptbahnhof erreichbar. Es gibt eine Laufdemo und eine Kundgebung mit verschiedenen Redebeiträgen und Musik. Auf unserer Anfangskundgebung sprechen Menschen aus unserer FLINTA* March Orga und Luisa Neubauer, zudem gibt es Musik von Emi X. Danach laufen wir unsere Route, die ca. eine Stunde dauern wird. Während des Demozugs spricht auf einem Lautiwagen eine Person vom Netzwerk gegen Feminizide. Auf der Abschlusskundgebung haben wir Redebeiträge vom Bundesverband trans*, Daniela Sepehri, den Omas gegen Rechts und §218 abschaffen. Zudem gibt es musikalische Begleitung von Sorvina und ok.danke.tschüss. Wir freuen uns sehr auf das Programm! Aktuelle Informationen gibt es immer auf unserem Instagramkanal: https://www.instagram.com/flintamarch2025/"
