["https://flintamarch.de/pressemitteilung-flinta-rechte-bedroht-buendnis-ruft-zum-flinta-march-2025-auf"]
title = "Pressemitteilung: +++ FLINTA*-Rechte bedroht +++ Bündnis ruft zum FLINTA* March 2025 auf +++ – FLINTA* March 2025"
description = "19. Januar 2025, 12 Uhr, Brandenburger Tor"
full_description = "Am 19. Januar findet in Berlin der FLINTA* March 2025 statt. Um 12 Uhr beginnt die feministische Demonstration am Brandenburger Tor und zieht anschließend durch die Berliner Innenstadt. Der Protest ist eine Reaktion auf die Bedrohung der Rechte von Frauen, inter-, nicht-binären-, trans- und agender Personen. Ziel der Organisator*innen ist es, kurz vor der Bundestagswahl, feministische Themen wieder in den Fokus zu bringen. Unterstützt wird die Demonstration unter anderem von Campact, CSD Berlin, Fridays for Future Berlin, Pinkstinks, Seebrücke und Zusammen gegen Rechts. „In den letzten zwei Jahren sind die geschlechtsspezifisch gegen Frauen gerichteten Straftaten in allen Fallgruppen angestiegen. Dazu gehören häusliche und sexualisierte Gewalt sowie Femizide. Auch die Hasskriminalität gegen queere Menschen nimmt immer weiter zu. Das darf politisch nicht unbeachtet bleiben! Die Rechte von Frauen und queeren Menschen müssen mit höchster Priorität geschützt und gestärkt werden. Deswegen fordern wir von allen Parteien eine feministische Politik, die dem ersten Artikel des Grundgesetzes entspricht”, erklärt Carolin Moser vom FLINTA* March 2025. Die Organisator*innen des FLINTA* March sehen in der anstehenden Bundestagswahl die Möglichkeit, feministische Politik zu realisieren. Doch alle kürzlich vorgestellten Wahlprogramme sind dahingehend mindestens unzureichend. Aus diesem Grund rufen die Aktivist*innen zur Teilnahme an der Demonstration auf. Sie fordern die Legalisierung von Schwangerschaftsabbrüchen unter Streichung des Paragrafen 218 aus dem Strafgesetzbuch. Außerdem wird auf Maßnahmen gegen geschlechtsspezifische Gewalt sowie ein funktionsfähiges und gut finanziertes Gewalthilfegesetz gedrängt. Weiter steht die Stärkung der Rechte von trans* Personen in Deutschland, in Anbetracht der dauerhaften Hetze gegen diese und andere marginalisierte Gruppen, stark im Fokus. „Rechte hetzen immer wieder gegen FLINTA* Personen. Auch Konservative treten immer mehr auf queere Menschen ein. Während das Selbstbestimmungsgesetz endlich in Kraft getreten ist, wollen Union und AfD genau das wieder rückgängig machen. Da können wir nicht schweigend zusehen – alle FLINTA* Personen verdienen ein Leben in Sicherheit. Deswegen müssen wir jetzt gemeinsam aufstehen und für unsere Rechte einstehen - und das tun wir am 19.01.!“, stellt Sky Kersten vom FLINTA* March 2025 klar. Die konkreten Forderungen des FLINTA* March 2025 finden Sie unter https://flintamarch.de/forderungen/. Auf der Website finden Sie außerdem alle Informationen zum FLINTA* March. Schlagwörter: feminismusflinta march 2025flinta* marchflinta* rechtepressemitteilung"
year_published = 2025
clearnet = "https://flintamarch.de/pressemitteilung-flinta-rechte-bedroht-buendnis-ruft-zum-flinta-march-2025-auf"
