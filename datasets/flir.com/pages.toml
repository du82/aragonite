["https://flir.com/about/careers"]
title = "Careers | Teledyne FLIR"
description = "We don’t just come to work every day. We come to make a difference every day. We have the privilege of helping save lives and livelihoods. Our products are used in a wide array of situations to rescue people in danger, detect criminals, conserve energy, navigate safely, provide security around the globe, and protect our environment. We empower real-life heroes to do their jobs more effectively and it’s and honor and responsibility that fuels everything we do."
full_description = '''Careers var jsVariable = ""; var miniCartFlag = false; Together, we are limitless. At Teledyne FLIR, we have a simple but ambitious mission: to develop market-leading infrared and sensing technologies that enhance everyday life. Teledyne and FLIR joined forces in 2021 to deliver the full spectrum of imaging technology: opening new avenues for innovation and enabling technologies to sense, transmit, and analyze information unlike ever before. With expanded capabilities, greater collective expertise, and a unified vision, Teledyne FLIR relentlessly pursues perfection and pushes the boundaries of what’s possible. We channel this effort into building the technologies that help real-life heroes do their jobs more effectively, whether that's rescuing people in danger, detecting criminals, conserving energy, navigating safely, providing security, or protecting our environment. It's an honor and responsibility that fuels everything we do. Explore Teledyne FLIR Jobs Looking for openings at our parent company, Teledyne? Explore openings at teledyne jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Be Aware of Recruitment Scams Teledyne does not ask for any financial commitment or contribution from a candidate at any stage of the recruitment process. Learn More jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Who we are Founded in 1978 and acquired by Teledyne in 2021, FLIR is the global leader in the design, manufacture, and marketing of sensor systems created for users in the commercial and government sectors, both internationally and domestically. It's our innovative technology and our people that set us apart. We offer challenging careers and real professional growth in a culture that encourages constant creativity, continuous learning, and individual responsibility. Just as our products make a difference to the world, everyone who works with us has the opportunity to make an impact on our future. With Teledyne FLIR, you'll see the full spectrum of potential. jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; <img class="VideoBlock-img" src="/globalassets/corporate/1.jpg" alt="&quot;Thank you&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "Thank you" <img class="VideoBlock-img" src="/globalassets/corporate/2.jpg" alt="&quot;All of This&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "All of This" <img class="VideoBlock-img" src="/globalassets/corporate/3.jpg" alt="&quot;Unnoticed&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "Unnoticed" <img class="VideoBlock-img" src="/globalassets/corporate/4.jpg" alt="&quot;Unimaginable&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "Unimaginable" var jsVariable = ""; var miniCartFlag = false; How we work At Teledyne FLIR, we strive to build an environment of creativity, with continuous learning and professional freedom—ideal for flourishing careers. We gain energy and new ideas by bringing in creative people from all backgrounds and with diverse perspectives. With the trust of customers, shareholders, and communities at the core of our vision, we maintain an unwaivering committment to the highest ethical standards. We strive to make a difference in our countries and communities, as well as those in which we trade, by backing local charities and playing our part in disaster relief. jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Explore Teledyne FLIR Jobs Explore openings at teledyne jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Environmental Stewardship Sustainability The protection and preservation of our world’s natural resources is critical to ensure our climate is upheld for future generations. Teledyne FLIR is committed to sustainability and will continue to invest towards that recovering and combating the impacts of climate change. Furthermore, we aim to collaborate with scientific researchers and field experts to better understand and improve responsible use and protection of the natural environment through conservation, sustainable practices, ecological research, and citizen science. jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; WE CELEBRATE DIFFERENCE Diversity Diversity is an integral part of the way we do business and our success as a global leader depends on it. Therefore, Teledyne FLIR is proud to be an equal opportunity employer, dedicated to a culture that values and respects differences in race, gender, age, religion, and identity. As a Federal Contractor, Teledyne FLIR is required to participate in the E-Verify Program to confirm eligibility to work in the United States. For information regarding your legal rights and protections, please click here. We are committed to working with and providing reasonable accommodation to individuals with physical and mental disabilities. If you need special assistance or an accommodation while seeking employment, please e-mail [email protected]. We will make a determination on your request for reasonable accommodation on a case-by-case basis. jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; WE HONOR SERVICE Veterans At Teledyne FLIR, we work to empower real-life heroes to do their jobs more effectively. For almost four decades, the company has provided militaries around the world with technology to help them accomplish their mission. Today, Teledyne FLIR employs hundreds of veterans in a range of job roles, including engineering, sales, business development, support, and executive staff. Teledyne FLIR aspires to do more for those who have served their countries and sacrificed so much. To help veterans in their transition to the civilian workforce, our goal is to significantly increase the number of veterans at Teledyne FLIR and become a top employer for veterans in the coming years. jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; WHAT OUR EMPLOYEES SAY jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; Saga F. Project Manager – Täby, Sweden Read the story Federico L. Team Lead, Condition Monitoring Specialists — Milan, Italy Read the story Linnéa L. Director, Production Engineering — Täby, Sweden Read the story Nora L. Regional Marketing Director - Hong Kong, China Read the story Sam C. Business Excellence Manager — Goleta, California, USA Read the story Taizo K. Country Manager, Sales — Tokyo, Japan Read the story Kathryn P. Team Leader, Sales – Nashua, New Hampshire, USA Read the story Jeremy W. Director of Science & Technology — Pittsburgh, Pennsylvania, USA Read the story Chuck C. Senior Program Manager — Evansville, Indiana, USA Read the story Konnie C. Product Launch Manager — Nashua, New Hampshire, USA Read the story Sarah W. Regional Marketing Director – Kent, UK Read the story Dylan R. Manager, Cooled Detector Fabrication — Goleta, California, USA Read the story Victoria L. Product Manager – Täby, Sweden Read the story Chris B. Global VP of Strategic BD and Marketing – Pasadena, California, USA Read the story Joaquin R. Director of Engineering and Site Manager – Madrid, Spain Read the story Lisa G. Director, OEM Sales — Walnut Creek, California, USA Read the story Matt H. Product Lifecycle Engineer — Niceville, Florida, USA Read the story Heliel M. Director, Product Management – Miami, Florida, USA Read the story var jsVariable = ""; var miniCartFlag = false; Explore Teledyne FLIR Jobs Explore openings at teledyne jsVar