["https://flir.com/about/about-flir"]
title = "About FLIR | Teledyne FLIR"
description = "FLIR Systems, Inc. designs, develops, manufactures, markets, and distributes technologies that enhance perception and awareness. Our products improve the way people interact with the world around them, enhance public safety and well-being, increase energy efficiency, and enable healthy and entertained communities."
full_description = '''Teledyne FLIR - The World's Sixth Sense About Teledyne FLIR Teledyne FLIR designs, develops, manufactures, markets, and distributes technologies that enhance perception and awareness. We bring innovative sensing solutions into daily life through our thermal imaging, visible-light imaging, video analytics, measurement and diagnostic, and advanced threat detection systems. Teledyne FLIR offers a diversified portfolio that serves a number of applications in government & defense, industrial, and commercial markets. Our products help first responders and military personnel protect and save lives, promote efficiency within the trades, and innovate consumer-facing technologies. Teledyne FLIR strives to strengthen public safety and well-being, increase energy and time efficiency, and contribute to healthy and intelligent communities. var jsVariable = ""; var miniCartFlag = false; The World's Sixth Sense We're building more than innovative technologies; we're striving to build a more sustainable, more efficient, safer future. Learn More jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Company History The Global Leader in the Design, Manufacture and Marketing of Thermal Imaging Infrared Cameras Learn More jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; var jsVariable = ""; var miniCartFlag = false; Brand Films jsVariable = 'https://cart.flir.com/us'; miniCartFlag = true; <img class="VideoBlock-img" src="/globalassets/corporate/1.jpg" alt="&quot;Thank you&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "Thank you" <img class="VideoBlock-img" src="/globalassets/corporate/2.jpg" alt="&quot;All of This&quot;" data-pin-no-hover="true" /> This video is unavailable due to your cookie settings. "All of This" <img class="VideoBlock-img" src="