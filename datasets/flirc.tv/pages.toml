full_description = "The perfect home for your new Raspberry Pi 3. We will ensure our case is adjusted to fit the latest Raspberry Pi specifications without sacrificing form. This is the first affordable Raspberry Pi case made out of aluminum. We wanted to ensure we didn’t sacrifice form over function, so we used the aluminum housing of the case to provide a built in heat sink. Supplied with the case is a thermal pad and 4 screws for the simplest Raspberry Pi case assembly on the market. It only takes seconds to drop your Raspberry Pi into it’s amazing new home and show it off on your counter. We included rubber feet to raise the enclosure so it just hovers underneath your television. In addition to the built in heat sink, small GPIO pins are accessible through the slot on the bottom of the case and there is no need for disassembly to get to the SD card. We know you will love the attention to detail we put in throughout the case. Yes, included in the box is a new thermal pad labeled for the 3B+ that accommodates the small differences in the CPU height. Yes, the built in heat sink acts as a heat spreader allowing you to get more speed out of your Raspberry Pi. The 3 gets very hot, you probably don't need to overclock that puppy. On the B+ and 2 you can. Yes, there is a tiny cutout on the front of the Raspberry Pi where the LEDs shine through. The PI 3 moved the LEDs in exchange for the antenna and are no longer visible. Flirc is one of the best selling items for the Raspberry Pi. We haven't only been concentrating on Flirc, we've been concentrating on enhancing media centers and their experiences. We've got more coming. The case comes partially assembled. All you need to do is put your thermal pad on the CPU, drop your Raspberry Pi inside the case, and screw the bottom of the case on with the included screws. The case does not come with either. Some resellers we work with do provide affordable kits with Flirc cases."
