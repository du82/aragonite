["https://flirc.tv/products/flirc-jeffprobe"]
title = "Jeff Probe - Flirc"
description = """
Jeff Probe - open source JTAG probe        A cost effective solution for in house debugging, the ability for customization, open source, and open hardware."""
full_description = "A cost effective solution for in house debugging, the ability for customization, open source, and open hardware. It is able to control and examine the state of the target microprocessor using a JTAG or Serial Wire Debugging (SWD) port and on-chip debug logic provided by the microprocessor. The BMP is all around better. I wont lie. You get what you pay for. It's going to be supported by the inventor himself. It's built with a Cortex m3, it's faster, and is guaranteed to run the bleeding edge software. If you can afford their hardware, support them. If you are debugging a chip with single wire JTAG, there is a supported hardware command to enable UART over the existing JTAG connector. That means, the single JTAG cable can be used for both debug, and the second UART connection. No need for two cables, simplifying connections, and using the JTAG cable, which has better reliability. The JTAG connector, the UART connector, the Black Magic Probe. It does not ship with a USB micro cable. We branched our code off public release v1.6 of the bmp. They are quite ahead of this now, but we wanted to use a stable branch. We will rebase on another branch soon, and will merge our master branch only when they release their new stable branch."
