full_description = "A companion to the best selling raspberry pi case. We're introducing a portable, passively cooled, raspberry pi zero case that matches the aesthetic of it's big sister. We kept everything that makes our original case great, shrunk it down, and added some nice elements that make this mini PC for every day carry. The SD Card is enclosed in the case so it won't slip out, or get stolen. The case needs to be disassembled before the SD card can be removed. Swap the top for open access to the GPIO pins. Just unclip the top and pop in the included second top. Mount your favorite board and don't worry about heat. The heat sink is built into the metal and its efficiency is awesome regardless the top. Made for EDC, we also are shipping with a lanyard so you can throw it on a keychain or use it for earrings. Throw it in a bag or in luggage, it's safe and wont break. The keychain comes pre-installed for convenience. It's easy to take off, but it takes patience to install it again. Yes, install the secondary low profile top. All GPIO are accessible, and you can install a board on top of the case. Yes, a high efficiency 1mm thermal pad sized appropriately. We also include 4 screws in the same accessory bag."
