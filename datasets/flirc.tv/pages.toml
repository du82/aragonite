["https://flirc.tv/products/flirc-fire-tv-edition"]
title = "Flirc Fire TV Edition - Flirc"
description = """
Flirc Fire TV Edition        Flirc Fire TV Edition is a universal remote control receiver. It allows you to pair any remote control with your computer or media center. Just walk through our super simple cross platform pairing application, and you're done. Use your previously paired remote with no additional software on your Fire TV with Flirc."""
full_description = "Flirc Fire TV Edition is a universal remote control receiver. It allows you to pair any remote control with your computer or media center. Just walk through our super simple cross platform pairing application, and you're done. Use your previously paired remote with no additional software on your Fire TV with Flirc. Flirc allows you to pair any remote control with your computer or media center. Just walk through our super simple cross platform pairing application, and you're done. Use your previously paired remote with no additional software on any machine with Flirc. Long Key PressesAssign two functions to one button. Press the button for one function, hold down the button for the other function. Now possible with our new powerful arm processor.MacrosWant to run a number of commands on a key press? With the new flirc, you can store over 500 keys, and have more than one keypress per individual remote button. Use our cross platform pairing application for easy remote control pairing. You are walked through the setup process one button at a time until your remote is paired. Pair any remote control button with any keyboard key and use our builtin application profiles for easy setup. Use our cross platform commandline application for complete control and configuration of your flirc. Our commandline application can do everything the GUI can do. Pair the suspend and wakeup key to any remote control button for complete control of your media center. As long as your motherboard supports wake on USB, you're clicks away. Your paired remote configuration is saved on your device but you can back it up or share it with our cross platform applications. Because Flirc acts as a keyboard, our GUI allows you to pair any remote control button with any keyboard key for advanced functionality. Run hot scripts, launch applications, all with a single remote control button. Although Flirc's range depends on the strength of the remote control you are using, it will work up to 20 feet away with most remotes. Like all infrared (IR) devices, Flirc works best when it's placed in the line of site of the remote control."
