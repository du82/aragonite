full_description = '''The Skip 1s Universal Remote Control makes controlling your entertainment center a breeze. With support for 3 different activities that can be activated with the click of a button, a universe of device combinations is at your fingertips. Leave the simplicity to us, and we'll leave the creativity to you. As a special thanks to our early adopters and kickstarter backers, we proudly present to you the making of the Skip 1s. The Skip 1s software allows you to get deep into the weeds, but for most people the startup wizard will do almost everything needed. Create an Activity like "Streaming," tell us what devices you use for that Activity, and Skip 1s will do the rest! The command center and heart of our software. From here, you can browse all the possible buttons on all the remotes of your different devices, you can switch between Activities, and you can fine tune your Skip 1s to perfectly suit your needs. Drag and drop any button you want from any of the remotes in your Buttons Panel to any button on the Skip 1s. Feel like dragging the Volume Up button from your TV remote on to your Skip's Home button? That's possible. Feel like creating a Netflix and chill macro? Also possible. You have total control. If you have a unique device not already in the Skip library, easily record it by setting it up in the Skip App then pointing your unique remote at the Skip 1s and hitting each button. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse varius enim in eros elementum tristique. Duis cursus, mi quis viverra ornare, eros dolor interdum nulla, ut commodo diam libero vitae erat. Aenean faucibus nibh et justo cursus id rutrum lorem imperdiet. Nunc ut sem vitae risus tristique posuere. Make your media life easier by creating Activities. An Activity lets you control up to eight devices at once. For example, you can control the TV audio with the volume buttons and the cable box with your navigation buttons. Press the A button on the remote above to see an example!'''
