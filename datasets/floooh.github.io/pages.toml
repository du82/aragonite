["https://floooh.github.io/2019/12/13/cycle-stepped-6502.html"]
title = "A new cycle-stepped 6502 CPU emulator"
description = "TL;DR: The how and why of the new 6502 emulator in the chips project."
full_description = "A new cycle-stepped 6502 CPU emulator Dec 13, 2019 TL;DR: The how and why of the new 6502 emulator in the chips project. I wrote a new version of my 6502/6510 emulator in the last weeks which can be stepped forward in clock cycles instead of full instructions. The actual work didn’t take a couple of weeks, more like a few evenings and a weekend, because the new emulator is more or less just a different output of the code-generation python script which I keep mutating for each new emulator version. But while working on the new emulator I got a bit side-tracked by another project: https://floooh.github.io/visual6502remix/ But this is (maybe) the topic of another blog post. Before I’m getting to the cycle-stepped 6502 emulator, a little detour into 8-bit CPUs and CPU emulators in general: What CPUs actually do The general job of a CPU (no matter if old or new) is quite simple: given some memory filled with instructions and data, process instructions one after another to change some of the data in memory into some other data, and repeat this process forever. Everything else in a typical computer just exists to turn some of the data in memory into pretty pixels and sounds, or send the data to another computer. The processing of a single instruction can be broken down into several steps: fetch the instruction opcode from memory (on 8-bit CPUs this is the first - and sometimes only - byte of an instruction) ‘decode’ this opcode to decide what actions must be taken to ‘execute’ the instruction, and then step through those actions, like: load additional data from memory into the CPU change the data loaded into the CPU in some way (arithmetics, bit twiddling, etc) store data from the CPU back to memory repeat those steps for the next instruction Apart from simple data manipulation, this basic ‘core execution loop’ is also used for more interesting control-flow actions: branches: Jump to a different memory location and continue executing instructions from there, this is like a goto in higher level languages conditional branches: Based on the result of a previous computation, either jump to a different memory location, or continue with the instruction directly following the branch instruction. Conditional branches are the assembly-level building blocks of higher-level language constructs like if(), for() and while() subroutine calls: Store the current execution location on the ‘stack’ (a special area in memory set aside for storing temporary values), jump to a different memory location (the subroutine), and at the end of that subroutine (indicated by a special ‘return’ instruction), load the stored execution location from the stack and continue execution right after the original subroutine call. This is like a function call in a high level language. interrupts: Interrupts are like subroutine calls except they are initiated by an external hardware event (such as a hardware timer/counter reaching zero, a key being pressed, or the video signal reaching a specific raster line). The CPU stops whatever it is currently doing, jumps into a special ‘interrupt service routine’, and at the end of the service routine, continues with whatever it did before. CPUs usually have a few special registers to deal with control flow: The current execution location (where the next instruction is loaded from) is stored in the Program Counter (PC) register. The current stack location is stored in the Stack Pointer (S or SP) register. A Flags or Status Register (for some mysterious reason called ‘P’ on the 6502) which stores (mostly) information about the result of previous arithmetic operations to be used for conditional branching. For instance: if the last instruction subtracted two numbers and the result is 0, the Flags Register will have the Zero Flag bit set. The conditional branch instructions BEQ (branch when equal) and BNE (branch when not equal) look at the current state of the Zero Flag to decide whether to branch or not (there are other Flag bits and associated branch instructions too, but you get the idea). It’s interesting to note that the branch instructions of a CPU are essentially normal load instructions into the PC register, since that’s what they do: loading a new location value into the PC register so that the next instruction is fetched from a different memory location. The components of an 8-bit CPU 8-bit CPUs like the Z80 or 6502 are fairly simple from today’s point of view: a few thousand transistors arranged in a few logical blocks: A Register Bank with somewhere between a handful and a dozen 8- and 16-bit registers (the 6502 has about 56 bits worth of ‘register storage’, while the Z80 has over 200 bits worth of registers) An ALU (Arithmetic Logic Unit) which implements integer operations like addition, subtraction, comparison (usually done with a subtraction and dropping the result), bit shifting/rotation, and the bitwise logic operations AND, OR and XOR. The Instruction Decoder. This is where all the ‘magic’ happens. The instruction decoder takes an instruction opcode as input, and in the following cycles runs through a little instruction-specific hardwired program where each program step describes how the other components of the CPU (mainly the register bank and ALU) need to be wired together and configured to execute the current instruction substep. How exactly the instruction decoder unit is implemented differs quite a lot between CPUs, but IMHO the general mental model that each instruction is a small hardwired ‘micro-program’ of substeps which reconfigures the data flow within the CPU and the current action of the ALU is (AFAIK) valid for all popular 8-bit CPUs, no matter how the decoding process actually happens in detail on a specific CPU. And finally there’s the ‘public API’ of the CPU, the input/output pins which connect the CPU to the outside world. Most popular 8-bit CPUs look fairly similar from the outside: 16 address bus output pins, for 64 KBytes of directly addressable memory 8 data bus in/out pins, for reading or writing one data byte at a time a handful of control- and status-pins, these differ between CPUs, but the most common and important pins are: one or two RW (Read/Write) output pins to indicate to the outside world whether the CPU wants to read data from memory (with the data bus pins acting as inputs), or write data into memory (data pins as outputs) at the location indicated by the address bus pins IRQ and NMI: These are input pins to request a “maskable” (IRQ) or non-maskable (NMI) interrupt. RES: an input pin used to reset the CPU, usually together with the whole computer system, this puts the CPU back into a defined starting state Of course the CPU is only one part of a computer system. At least some memory is needed to store instructions and data. And to be any useful there must be a way to get data into and out of the computer (keyboard, joystick, display, loud speakers, and a tape- or floppy-drive). These devices are usually not controlled directly by the CPU, but by additional helper chips, for instance in the C64: 2 ‘CIA’ chips to control the keyboard, joysticks, and tape drive the ‘SID’ chip to generate audio and the ‘VIC-II’ chip to generate the video output The C64 is definitely on the extreme side for 8-bit computers when it comes to hardware complexity. Most other 8-bit home computers had a much simpler hardware configuration and were made of fewer and simpler chips. All these chips and the CPU are connected to the same shared address- and data-bus, and some additional ‘address decoder logic’ (and clever engineering in general) was needed so that all those chips only use the shared address and data bus when it’s their turn, but diving in there goes a bit too far for this blog post :) Back to emulators: How CPU emulators work While all CPU emulators must somehow implement the tasks of real CPUs outlined above, there are quite a few different approaches how they reach that goal. The range basically goes from “fast but sloppy” to “accurate but slow”. Where on this range a specific CPU emulator lives depends mainly on the computer system the emulator is used for, and the software that needs to run: Complex general-purpose home computers like the C64 and Amstrad CPC with an active and recent demo scene need a very high level of accuracy down to the clock cycle, because a lot of frighteningly smart demo-sceners are exploring (and exploiting) every little quirk of the hardware, far beyond what the original hardware designers could have imagined or what’s written down in the original system specifications and chip manuals. The other extreme are purpose-built arcade machines which only need to run a single game. In this case, the emulation only needs to be ‘good enough’ to run one specific game on one specific hardware configuration, and a lot of shortcuts can be taken as long as the game looks and feels correct. Here’s the evolution from “fast but sloppy” to “slow but accurate” CPU emulators that I’ve gone through, I’m using the words “stepped” vs “ticked” in a very specific way: “stepped” means how the CPU emulator can be “stepped forward” from the outside by calling a function to bring the emulator from a “before state” into an “after state” “ticked” means how the entire emulated system is brought from a “before state” into an “after state” Instruction-Stepped and Instruction-Ticked This was the first naive implementation when I started writing emulators, a Z80 emulator which could only be stepped forward and inspected for complete instructions. The emulator had specialized callback functions for memory accesses, and the Z80’s special IO operations, but everything else happening “inside” an instruction was completely opaque from the outside. This means that an emulated computer system using such a CPU emulator could only “catch up” with the CPU after a full instruction was executed, which on the Z80 can take anywhere between 4 and 23 clock cycles (or even more when an interrupt is handled). This worked fine for simple computer systems which didn’t need cycle-accurate emulation, like the East German Z- and KC-computers. But 23..30 clock cycles at 1 MHz is almost half of a video scanline, and once I moved to more complex systems like the Amstrad CPC it became necessary to know when exactly within an instruction a memory read or write access happens. The Amstrad CPC’s video system can be reprogrammed at any time, for instance in the middle of a scanline, and when such a change happens at the wrong clock cycle within a scanline, things start to look wrong, from subtle errors like a few missing pixels or wrong colors here and there to a completely garbled image. Instruction-Stepped and Cycle-Ticked The next step was to replace the specialized IO and memory access callbacks with a single universal ‘tick callback’, and to call this from within the CPU emulation for each clock cycle of an emulated instruction. I moved to this emulation model for two reasons: (a) because I had to improve the Amstrad CPC video emulation, and (b) because I started with a 6502 CPU emulator where a memory access needs to happen in each clock cycle anyway. From the outside, it’s still only possible to execute instructions as a whole. So calling the emulator’s ‘execute’ function once will run through the entire next instruction, calling the tick callback several times in turn, once for each clock cycle. It’s not possible to tell the CPU to only execute one clock cycle, or suspend the CPU in the middle of an instruction. With this approach, the CPU takes a special, central place in an emulated system. The CPU is essentially the controller which ticks the system forward by calling the tick callback function, and the entire remaining system is emulated in this tick callback. This allows a perfectly cycle accurate system emulation, and as far as I’m aware, this approach is used in most ‘serious’ emulators, and to be honest, the reasons to use an even finer-grained approach are a bit esoteric: Cycle-Stepped and Cycle-Ticked This is where I’m currently at with the 6502 emulation (but not yet with the Z80 emulation). Instead of an “exec” function which executes an entire instruction, there’s now a “tick” function which only executes one clock cycle of an instruction and returns to the caller. With this approach a ‘tick callback’ is no longer needed, and the CPU has lost it’s special ‘controller status’ in an emulated system. Instead the CPU is now just one chip amongst many, ticked forward like all the other chips in the system. The ‘system tick’ function has inverted its role: Instead of the system tick function being called from inside the CPU emulation, the CPU emulation is now called from inside the system tick function. This makes the entire emulator code more straightforward and flexible. It’s now ‘natural’ and trivial to tick the entire system forward in single clock cycles (yes, the C64 emulation now has a c64_tick() function). Being able to tick the entire system forward in clock cycles is very useful for debugging. So far, the step-debugger could only step one complete CPU instruction at a time. That’s good enough for debugging CPU code, but not so great for debugging the other chips in the system. Each debug step would skip over several clock cycles depending on what CPU instruction is currently executed. But now that the CPU can be cycle-stepped, implementing a proper ‘cycle-step-debugger’ is fairly trivial. Another situation where a cycle-stepped CPU is useful is multi-processor systems, which actually weren’t that unusual in the 80’s: the Commodore 128 had both a 6502 and Z80 CPU (although they couldn’t run at the same time), some arcade machines had sound and gameplay logic running on different CPUs, and even attaching a floppy drive to a C64 turns this into a multiprocessor system, because the floppy drive was its own computer with its own 6502 CPU. With a cycle-stepped CPU, it’s much more straightforward now to write emulators for such multi-CPU systems. If required, completely unrelated systems can now run cycle-synchronized without weird hacks in the tick callbacks or variable-length ‘time slices’. The new 6502 emulator The new emulator only has two ‘interesting’ functions for initializing a new 6502 instance and ticking it: // initialize a 6502 instance with default parameters: m6502_t cpu; uint64_t pins = m6502_init(&cpu, &(m6502_desc_t){ }); while (true) { // tick the CPU for one clock cycle pins = m6502_tick(&cpu, pins); // TODO: inspect and modify pins } Like my older emulators, a 64-bit integer is used to communicate the pin status in and out of the CPU. What’s new is that the m6502_init() function returns an initial pin mask to ‘ignite’ the CPU startup process, which must be passed into the first call to m6502_tick(). The first 7 calls to m6502_tick() will then run through the 7-cycle reset-sequence, only then will the CPU emulation start to run ‘regular’ instructions. The code example above still doe"
