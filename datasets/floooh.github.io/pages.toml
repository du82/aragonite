["https://floooh.github.io/2021/12/06/z80-instruction-timing.html"]
title = "Getting into way too much detail with the Z80 netlist simulation"
description = "TL;DR: a detailed look at Z80 instruction timings with the help of a Z80 netlist simulation."
full_description = "Getting into way too much detail with the Z80 netlist simulation Dec 6, 2021 TL;DR: a detailed look at Z80 instruction timings with the help of a Z80 netlist simulation. Table of Content Table of Content Intro The shape of Z80 instructions General Instruction Timing M-cycles and T-states Opcode Fetch Machine Cycles Memory Read Machine Cycles Memory Write Machine Cycles IO Read and Write Machine Cycles Wait states Extra Clock Cycles Overlapped Execution The 3 Instruction Subsets The 2-3-3 Opcode Bit Pattern Main Instructions Main Quadrant 1 (xx = 01) Main Quadrant 2 (xx = 10) Main Quadrant 0 (xx = 00) INC/DEC (HL) INC/DEC ss ADD HL,ss JR d DJNZ d JR cc,d Main Quadrant 3 (xx == 11) CALL nn CALL cc,nn RET cc LD SP,HL EX (SP),HL PUSH qq RST p Prefix Instruction Overview DD and FD Prefixes Special Case: LD (IX+d),n ED Prefix ED Quadrant 1 (x == 01) SBC/ADC HL,ss LD I,A and LD R,A LD A,I and LD A,R RRD and RLD ED Quadrant 2 (x == 10) LDI and LDD LDIR and LDDR CPI and CPD CPIR and CPDR INI and IND OUTI and OUTD INIR, INDR, OTIR and OTDR CB Prefix CB Quadrant 0 CB Quadrant 1 CB Quadrant 2 CB Quadrant 3 DD CB and FD CB Prefix Interrupt Behaviour Interrupt Detection Timing Prefix Bytes and Interrupts EI, DI and interrupts RETI and RETN NMI Timing Mode 0 Interrupt Timing Mode 1 Interrupt Timing Mode 2 Interrupt Timing Intro This is part one of a two-part series about a new cycle-stepped Z80 emulator I wrote recently. In the first post I’ll mainly take a look at the oddities and irregularities in the Z80 instruction set with the help of the Z80 netlist simulation from visual6502.org which I integrated into my own ‘remix’ before starting to work on the actual CPU emulator: https://floooh.github.io/visualz80remix/ The ‘remix’ has some usability advantages over the original: rendering and UI performance is much improved via WASM, WebGL and Dear ImGui an integrated assembler simplifies program input a tracelog window which shows more information and allows to ‘rewind’ the simulation There’s a lot more information in the project readme here: https://github.com/floooh/v6502r. A word of warning though, the Z80 netlist from visual6502 has some subtle differences in undocumented behaviour from what’s known about original Z80s (see here for a list of issues I found so far: https://github.com/floooh/v6502r/issues/2. My guess is that the netlist has been created from a Z8400 because of those two details found on the die: …at least this might explain why the netlist doesn’t suffer from the six ‘reverse engineering traps’ that were placed on the original Z80. By the time the Z8400 was created, the Z80 had already been widely cloned so reverse engineering probably was no longer a concern. Anyway, back to the actual topic of the blog post: The Z80 has probably the most messy and irregular instruction set of the popular 8-bit CPUs (certainly when compared to the MOS 6502 or Motorola 6800). The reason is that the Z80 had to be binary compatible with the Intel 8080. While the 8080 has a reasonably clean and structured instruction set, the only way for the Z80 to add new instructions while remaining 8080-compatible was to fill the ‘gaps’ in the 8080 instruction set. This is why the Z80 instruction set looks clean and structured only in some places (mainly those inherited from the 8080), while at the same time being peppered with seemingly random new Z80-specific instructions. This was the right approach to create an “8080 killer”, but nearly half a century later it makes life a lot harder for emulator authors :) The shape of Z80 instructions Like on the Intel 8080, instructions are made up of one or multiple bytes, where the first byte is always the opcode byte. This simple rule is also true for the Z80-specific ‘prefixed instructions’, which superficially seem to have two opcode bytes. But as we’ll see later, instruction prefixes are actually complete instructions on their own which just influence how the following opcode byte is decoded. Prefixes aside, there are only three basic instruction ‘shapes’: Just the opcode byte (for example NOP, LD A,B, RET): ┏━━━━━━━━┓ ┃ OPCODE ┃ ┗━━━━━━━━┛ C9 => RET An opcode byte followed by an 8-bit ‘immediate value’ (for example LD A,n, ADD n, JR d): ┏━━━━━━━━┳━━━━━━┓ ┃ OPCODE ┃ IMM8 ┃ ┗━━━━━━━━┻━━━━━━┛ 3E 11 => LD A,11h An opcode byte followed by a 16-bit immediate value (in little endian order): LD HL,nnnn, CALL nn): ┏━━━━━━━━┳━━━━━━━━━┳━━━━━━━━━┓ ┃ OPCODE ┃ IMM16LO ┃ IMM16HI ┃ ┗━━━━━━━━┻━━━━━━━━━┻━━━━━━━━━┛ 21 34 12 => LD HL,1234h Instructions that have been ‘modified’ by the DD or FD prefix may come in two additional shapes where an offset byte is inserted after the opcode and up to one immediate value byte (this is the ‘d’ in (IX+d) or (IY+d)). There is no instruction where the d-offset byte is followed by a 16-bit immediate value (why that’s the case will become clear later in the section about the DD/FD prefixes): ┏━━━━━━━━┓┏━━━━━━━━┳━━━━━━━┓ ┃ PREFIX ┃┃ OPCODE ┃ DIMM8 ┃ ┗━━━━━━━━┛┗━━━━━━━━┻━━━━━━━┛ DD 86 03 => ADD A,(IX+3) ┏━━━━━━━━┓┏━━━━━━━━┳━━━━━━━┳━━━━━━┓ ┃ PREFIX ┃┃ OPCODE ┃ DIMM8 ┃ IMM8 ┃ ┗━━━━━━━━┛┗━━━━━━━━┻━━━━━━━┻━━━━━━┛ FD 36 03 11 => LD (IY+3),11h The last special instruction shape looks extremely weird because at first glance it doesn’t fit into the above patterns at all. In ‘double-prefixed’ instructions (like SET 1,(IX+3)) the d-offset and ‘actual’ opcode have switched places: ┏━━━━━━━━┓┏━━━━━━━━┓┏━━━━━━━┳━━━━━━━━┓ ┃ PREFIX ┃┃ PREFIX ┃┃ DIMM8 ┃ OPCODE ┃ ┗━━━━━━━━┛┗━━━━━━━━┛┗━━━━━━━┻━━━━━━━━┛ DD CB 03 CE => SET 1,(IX+3) More on that later in the dedicated section about DD CB and FD CB double-prefixes. General Instruction Timing M-cycles and T-states The above ‘physical shape’ of Z80 instructions doesn’t tell us much what actually happens during execution of an instruction (e.g. how many clock cycles the instruction takes to execute, and how the internal and externally visible state of the CPU changes during execution). The Z80 netlist simulation is perfect for this because it allows us to inspect the internal and observable CPU state after each clock cycle (or rather: after each half-clock-cycle). But first an explanation of another Z80 oddity: When reading Z80 documentation there’s a lot of talk about so called “M-cycles” and “T-states”, often written as M1/T2 or M3/T1 which confused me to no end in the beginning. Long story short: M1/T2 simply means “the second clock cycle (T2) in the first machine cycle (M1)”, likewise, M3/T1 means “the first clock cycle (T1) in the third machine cycle (M3)”. So M-cycles and T-states are just a special notation to identify a specific clock cycle in an instruction. “T-state” is equivalent with a clock cycle. “M-Cycle” means “machine cycle” and simply means a related group of T-states or clock cycles. On the Z80, basic operations like reading or writing a memory byte take more time than a single clock cycle. But it’s useful to understand the action of reading or writing a memory byte as a single step, and that’s exactly what a “machine cycle” is. Machine cycles come in 7 flavours: Opcode Fetch (aka M1 cycle): this is always the first (and sometimes only) machine cycle in an instruction and takes 4 clock cycles Memory Read: read a byte from memory (3 clock cycles) Memory Write: write a byte to memory (3 clock cycles) IO Read: read a byte from an IO port (4 clock cycles) IO Write: write a byte to an IO port (4 clock cycles) Interrupt Acknowledge: these are special machine cycles which are executed at the start of maskable interrupt handling, they will be handled in detail in the last section of this blog post Extra: many instructions contain extra clock cycles necessary for computations, in the official CPU documentation these are sometimes identified as separate machine cycles, and sometimes just lumped together with other machine cycle types. Since machine cycles are the basic building blocks of all instructions, it helps to understand what exactly happens during their execution. This is where the ‘tracelog’ of the Z80 netlist simulation comes in. This is a window which records and visualizes CPU state (chip pins and register values) for each “half-clock-cycle”: Opcode Fetch Machine Cycles An Opcode Fetch looks like this in the tracelog (with all the relevant CPU state visible): OPCODE FETCH: ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 1/0 │ M1 │ │ │ │ 0004 │ 47 │ 0004 │ 47 │ 22 │ 03 │ │ 1/1 │ M1 │ MREQ │ │ RD │ 0004 │ 47 │ 0005 │ 47 │ 22 │ 03 │ │ 2/0 │ M1 │ MREQ │ │ RD │ 0004 │ 00 │ 0005 │ 47 │ 22 │ 03 │ │ 2/1 │ M1 │ MREQ │ │ RD │ 0004 │ 00 │ 0005 │ 00 │ 22 │ 03 │ │ 3/0 │ │ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 03 │ │ 3/1 │ │ MREQ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 04 │ │ 4/0 │ │ MREQ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 04 │ │ 4/1 │ │ │ RFSH │ │ 2200 │ 00 │ 0005 │ 00 │ 22 │ 04 │ Keep in mind that this shows half-clock-cycles, a 4-clock-cycle opcode-fetch machine cycle is shown as 8 half-clock-cycles in the trace log. The M1, MREQ, RFSH and RD columns show the current state of the respective CPU pins. AB and DB are “address bus” and “data bus”. IR is an internal register which holds the current opcode byte. I and R are the respective CPU registers (I is the upper byte of the interrupt vector, R is the ‘refresh counter’ register). Let’s go through each half-cycle of an opcode-fetch machine cycle: ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 1/0 │ M1 │ │ │ │ 0004 │ 47 │ 0004 │ 47 │ 22 │ 03 │ The M1 pin is set to active, and the address bus has been loaded with the current program counter (PC). The data bus and instruction register still have their values from the last instruction (which happened to an LD I,A instruction (byte sequence: ED 47). ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 1/1 │ M1 │ MREQ │ │ RD │ 0004 │ 47 │ 0005 │ 47 │ 22 │ 03 │ In the next half cycle, the MREQ and RD pins have been set in addition to M1, which initiates a memory read from the address that’s currently on the address bus (0004). The program counter has been incremented to the next address. ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 2/0 │ M1 │ MREQ │ │ RD │ 0004 │ 00 │ 0005 │ 47 │ 22 │ 03 │ Now the memory system has responded to the MREQ|RD pins being active by putting the content of address 0004 onto the data bus, which happens to be 00 (which is a NOP instruction). The instruction register hasn’t been updated yet. ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 2/1 │ M1 │ MREQ │ │ RD │ 0004 │ 00 │ 0005 │ 00 │ 22 │ 03 │ In the next half cycle the 00 value on the data bus has been written into the instruction register (IR). This concludes the first half of the opcode fetch machine cycle. ┌─────┬────┬──────┬──────┬────┬──────┬────┬──────┬────┬────┬────┐ │ T │ M1 │ MREQ │ RFSH │ RD │ AB │ DB │ PC │ IR │ I │ R │ ├─────┼────┼──────┼──────┼────┼──────┼────┼──────┼────┼────┼────┤ │ 3/0 │ │ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 03 │ │ 3/1 │ │ MREQ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 04 │ │ 4/0 │ │ MREQ │ RFSH │ │ 2203 │ 00 │ 0005 │ 00 │ 22 │ 04 │ │ 4/1 │ │ │ RFSH │ │ 2200 │ 00 │ 0005 │ 00 │ 22 │ 04 │ The remaining 4 half-cycles (2 clock cycles) are spent with the Z80-specific ‘memory refresh’. A 16-bit value made from the registers I and R is put on the address bus, the M1 pin is set to inactive, the MREQ|RFSH pins to active and the R register is incremented. I haven’t figured out so far why the lower 8 bits on the address bus are cleared in the very last half-clock-cycle (this also happens in the last half-cycle of some other instructions). Let’s quickly go over the remaining machine cycle types for completeness: Memory Read Machine Cycles A memory read machine cycle looks like this (in this case to load the byte value 22 from address 0001 into the register L): MEM READ: ┌─────┬──────┬────┬──────┬────┬──────┐ │ T │ MREQ │ RD │ AB │ DB │ HL │ ├─────┼──────┼────┼──────┼────┼──────┤ │ 1/0 │ │ │ 0001 │ 21 │ 5555 │ <== address 0001 on address bus │ 1/1 │ MREQ │ RD │ 0001 │ 21 │ 5555 │ <== MREQ|RD active │ 2/0 │ MREQ │ RD │ 0001 │ 22 │ 5555 │ <== memory content 22 on data bus │ 2/1 │ MREQ │ RD │ 0001 │ 22 │ 5555 │ │ 3/0 │ MREQ │ RD │ 0001 │ 22 │ 5555 │ │ 3/1 │ │ │ 0000 │ 22 │ 5522 │ <== target register L updated Memory Write Machine Cycles Here’s a memory write machine cycle to store the value in register A (33) into the address in register HL (1122): MEM WRITE: ┌─────┬──────┬────┬──────┬────┬──────┬──────┐ │ T │ MREQ │ WR │ AB │ DB │ AF │ HL │ ├─────┼──────┼────┼──────┼────┼──────┼──────┤ │ 1/0 │ │ │ 1122 │ 77 │ 3355 │ 1122 │ <== address 1122 on address bus │ 1/1 │ MREQ │ │ 1122 │ 33 │ 3355 │ 1122 │ <== value 33 on data bus │ 2/0 │ MREQ │ │ 1122 │ 33 │ 3355 │ 1122 │ │ 2/1 │ MREQ │ WR │ 1122 │ 33 │ 3355 │ 1122 │ <== MREQ|WR active │ 3/0 │ MREQ │ WR │ 1122 │ 33 │ 3355 │ 1122 │ │ 3/1 │ │ │ 1122 │ 33 │ 3355 │ 1122 │ Note how the MREQ pin, address and data bus already contain the required values in the second half cycle (T1/1), but the WR (write) pin is only set active in the 4th half cycle (T2/1). IO Read and Write Machine Cycles The IO read and write machine cycles look similar, but are one clock cycle longer, and setting the CPU pins is delayed by a half-clock-cycle. IO READ: ┌─────┬──────┬────┬────┬──────┬────┐ │ T │ IORQ │ RD │ WR │ AB │ DB │ ├─────┼──────┼────┼────┼──────┼────┤ │ 1/0 │ │ │ │ 1122 │ 78 │ │ 1/1 │ │ │ │ 1122 │ 78 │ │ 2/0 │ IORQ │ RD │ │ 1122 │ 33 │ │ 2/1 │ IORQ │ RD │ │ 1122 │ 33 │ │ 3/0 │ IORQ │ RD │ │ 1122 │ 33 │ │ 3/1 │ IORQ │ RD │ │ 1122 │ 33 │ │ 4/0 │ IORQ │ RD │ │ 1122 │ 33 │ │ 4/1 │ │ │ │ 1122 │ 33 │ IO WRITE: ┌─────┬──────┬────┬────┬──────┬────┐ │ T │ IORQ │ RD │ WR │ AB │ DB │ ├─────┼──────┼────┼────┼──────┼────┤ │ 1/0 │ │ │ │ 1122 │ 79 │ │ 1/1 │ │ │ │ 1122 │ 21 │ │ 2/0 │ IORQ │ │ WR │ 1122 │ 21 │ │ 2/1 │ IORQ │ │ WR │ 1122 │ 21 │ │ 3/0 │ IORQ │ │ WR │ 1122 │ 21 │ │ 3/1 │ IORQ │ │ WR │ 1122 │ 21 │ │ 4/0 │ IORQ │ │ WR │ 1122 │ 21 │ │ 4/1 │ │ │ │ 1122 │ 21 │ It’s interesting here that the ‘pin timing’ is identical between IO reads and writes. The WR pin is activated at the same moment as the IORQ pin, while in memory read machine cycles, the WR pin is activated two half cycles after the MREQ pin. Wait states All machine cycles that access memory or IO ports check the WAIT input pin at exactly one half-clock-cycle. If the WAIT "
