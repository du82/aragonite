["https://floooh.github.io/2024/08/24/zig-and-emulators.html"]
title = "Zig and Emulators"
description = "Some quick Zig feedback in the context of a new 8-bit emulator project I starteda little while ago:"
full_description = '''Zig and Emulators Aug 24, 2024 Some quick Zig feedback in the context of a new 8-bit emulator project I started a little while ago: https://github.com/floooh/chipz Currently the project consists of: a cycle-stepped Z80 CPU emulator (similar to the emulator described here: https://floooh.github.io/2021/12/17/cycle-stepped-z80.html chip emulators for Z80 PIO, Z80 CTC and three variants of the AY-3-8910 sound chip system emulators for Bombjack, Pengo and Pacman arcade machines, and the East German KC85/2../4 home computer series a code generation tool to create the Z80 instruction decoder code block various tests to check Z80 emulation correctness With the exception of an external C dependency for ‘host system glue’ (the cross-platform sokol headers used for wrapping the platform-specific windowing, input, rendering and audio-output code), the project is around 16 kloc of pure Zig code. I’m not yet sure how this new project will evolve in relation to the original C/C++ ‘chips’ emulator project, but I expect that the Zig project will overtake the C/C++ project at some point in the future. Dev Environment I’m coding on an M1 Mac in VSCode with the Zig Language Extension, and CodeLLDB for step-debugging. The Zig and ZLS (Zig Language Server) installation is managed with ZVM. For the most part this setup works pretty well, with a few tweaks: I’m doing ‘build-on-save’ to get more complete error information as described here: Improving Your Zig Language Server Experience (I’m not bothering with creating separate non-install build targets though) With the default Zig VSCode extension settings I was seeing that in long coding session (5..6 hours or so) saving would take longer and longer until it would eventually get stuck. After asking around on the Zig Discord this could be solved by explicitly setting the Zig Language Server as ‘VSCode Formatting Provider’ in the Zig Extension settings. When debugging, there’s a somewhat annoying issue that the debug line information seems to be off in some places, the debugger appears to step into the last line of an inactive if-else block for instance. Again, Discord to the rescue, this seems to be a known issue. All in all, not yet perfect, but good enough to get shit done. Zig Comptime and Generics Before diving into language details, I’ll need to provide some minimal background information of how the chipz emulators work: Microchips of the 70s and 80s were very much like ‘software libraries, but implemented in hardware’, they followed a minimal standard for interoperability so that chips from different manufacturers could be combined into computer systems without requiring too much custom glue logic between them. I think it’s fair to say that this ‘competition through interoperability’ was the main driver for the Cambrian Explosion of cheap 8-bit computer systems in the 70s and 80s. Microchips communicate with the outside world via input/output pins, and a typical 8-bit home computer system is essentially just a handful of microchips talking to each other through their ‘pin API’. The chipz project follows that same idea: The basic building blocks are self-contained chip emulators which communicate with other chip emulators via virtual input/output pins which are mapped to bits in an integer. Chips of that era typically had up to 40 pins which makes them a good fit for 64-bit integers used in today’s CPUs. The API of such a chip emulator only has one important function: pub fn tick(pins: u64) u64 This tick function executes exactly one clock cycle, it takes an integer as input where the bits represent input/output pins, and returns that same integer with modified bits. Fitting a CPU emulator into such a ‘cycle-stepped model’ can be a bit of a challenge and is described in these blog posts (for the 6502 and Z80): A new cycle-stepped 6502 CPU emulator A new cycle-stepped Z80 emulator A whole computer system is then emulated by writing a ‘system tick function’ which emulates a single clock cycle for the whole system by calling the tick functions of each chip emulator and passing pin-state integers from one chip emulator to the next. There’s two related problems to solve with the above approach: There’s not enough bits in a 64-bit integer to assign one bit for each inter-chip connection of a complete computer system. This means a system tick function will need to maintain one pin-state integer for each chip, and shuffle bits around before each chip’s tick function is called. For direct pin-to-pin connections it makes sense to assign the same bit position in different chip emulators to avoid ‘runtime bit shuffling’ from an output pin position of one chip to a different input pin position of another chip. Those direct pin-to-pin connections are different in each emulated computer system, so to make this idea work a specialized chip emulator needs to be ‘stamped out’ for each computer system. Both problems can be solved quite elegantly in Zig: Instead of 64-bit integers for the pin-state we can switch to wide integers (u128, u192, u256, …) with enough bits to assign each chip in a system its own reserved bit range instead of juggling with multiple 64-bit integers. With Zig’s comptime generics it’s possible to stamp out chip emulators which are specialized by a specific mapping of pins to bit positions in the shared wide integer. This means a chip emulator is specialized by two comptime configuration values: a Bus type which is an unsigned integer type with enough bits for all pin-to-pin connections in a system a Pins structure which defines a bit position for each input/output pin of a chip emulator For the Z80 CPU emulator this pin definition struct looks like this: pub const Pins = struct { DBUS: [8]comptime_int, ABUS: [16]comptime_int, M1: comptime_int, MREQ: comptime_int, IORQ: comptime_int, // ...more pins... }; …which is used as nested struct in a TypeConfig struct which holds all generic parameters to stamp out a specialized Z80 emulator: pub const TypeConfig = struct { pins: Pins, bus: type, }; This TypeConfig struct is used as parameter for a comptime Zig function which returns a specialized type (this is how Zig does generics): pub fn Type(comptime cfg: TypeConfig) type { return struct { // the returned struct is a new type which is comptime-configured // by the 'cfg' type configuration parameter }; } …now we can stamp out a Z80 CPU emulator that’s specialized for a specific computer system by the system bus integer type and the Z80 pins mapped to specific bit positions of this integer type: const z80 = @import("z80"); const Z80 = z80.Type(.{ .bus = u128, .pins = .{ .DBUS = .{ 0, 1, 2, 3, 4, 5, 6, 7 }, .ABUS = .{ 8, 9, // ... }, // ... } }); This specific Z80 type uses a 128-bit pin-state integer and maps its own pins to bit positions starting at bit 0, with the first 8 bits being the data bus (most other chips in any computer system will also map their data bus pins to the same bit range, since the data bus is usually shared between all chips in a system). Note that Z80 is just a type, not a runtime object. To get a default-initialized Z80 CPU object: var cpu = Z80{}; This example doesn’t look like much, it’s “just Zig code” after all, but this is exactly what makes generic programming in Zig so elegant and powerful. Arbitrarily complex comptime config options can be ‘baked’ into types, and dynamic runtime configuration options can be passed in a ‘construction’ function on that type, and all is just regular Zig code from top to bottom: var obj = Type(.{ // comptime options... .bus = u128, .pins = .{ ... }, }).init(.{ // additional runtime options... }); …and this is just scratching the surface. There’s a couple of really interesting side effects of this 2-step approach (first build the type, then build an object from that type): Can use designated-init-syntax for configuring the type which is just *chef’s kiss* because it makes the code very readable (no guessing what a generic parameter actually does because the name is right there in the code). TypeConfig structs can be composed by nesting other TypeConfig structs, or generic parameters in general, which then can be used to build types inside types (Yo Dawg…). It’s possible to build different struct interiors based on comptime parameters (for instance the different KC85 models have different runtime-config struct interiors for configuring model-specific features, which makes ‘accidential misconfiguration’ an immediate compile error). In conclusion, the idea to use Zig’s comptime features to stamp out specialized per-system chip and system emulators works exceptionally well and is (IMHO) much more enjoyable than C++ or Rust generic programming (I’m sure C++ and Rust can do the same things with sufficient template magic, but this code definitely won’t look as straightforward as the Zig version). Bit Twiddling and Integer Math can be awkward This section is hard to write because it’s criticizing without offering an obviously better solution, please read it as ‘constructive criticism’. Hopefully Zig will be able to fix some of those things on the road towards 1.0. Zig’s integer handling is quite different from C: arbitrary bit-width integers are the norm, not the exception there is no concept of integer promotion in math expressions (not that I noticed at least) implicit conversion between different integer types is only allowed when no data loss can happen (e.g. an u8 can be assigned to an u16, but assigning an u16 to an u8 requires an explicit cast) mixing signed and unsigned values in expressions isn’t allowed overflow is checked in Debug and ReleaseSafe mode, and there are separate operators for ‘intended wraparound’ At first glance these features look pretty nice because they fix some obvious footguns in C and C++. Arbitrary width integer types are especially useful for emulator code, because hardware chips are full of ‘odd-width’ counters and registers (3, 5, 20 bits etc…). Directly mapping such registers to types like u3, u5 or u20 should potentially allow for more readable and ‘expressive’ code. Unfortunately, in reality it’s not so clear cut. While C is definitely too sloppy when it comes to integer math, Zig might swing the pendulum a bit too far into the other direction by requiring too much explicit casting. The most extreme example I stumbled over was implementing the Z80’s indexed addressing mode (e.g. those instructions involving (IX+d) or (IY+d). This takes the byte d and adds it as a signed quantity and with wraparound to a 16 bit address (e.g. the byte is sign-extended to a 16-bit value before the addition). In C this is quite straightforward: uint16_t addi8(uint16_t addr, uint8_t offset) { return addr + (int8_t)offset; } The simplest way I could come up with to do the same in Zig is: fn addi8(addr: u16, offset: u8) u16 { return addr +% @as(u16, @bitCast(@as(i16, @as(i8, @bitCast(offset))))); } Note how the integer conversion gets totally drowned in ‘@-litter’. Both functions result in the same x86 and ARM assembly output (with -O3 for C and any of the Release modes in Zig): addi8: movsx eax, sil ; move low byte of esi into eax with sign-extension add eax, edi ; eax += edi ret For ARM (looks like ARM handles the sign-extension right in the add instruction, not very RISC-y but neat!): addi8: add w0, w0, w1, sxtb ret IMHO when the assembly output of a compiler looks so much more straightforward than the high level compiler input, it becomes a bit hard to justify why high level programming languages had been invented in the first place ;) Apart from that extreme case (which only exists once in the whole code base), narrowing conversions are much more common when writing code that mixes different integer widths, and those narrowing conversions require explicit casts, and those explicit casts may reduce readability quite a bit. The basic idea to only allow implicit conversions that can’t lose data is definitely a good one, but very often a cast is required even though the compiler has all the information it needs at compile time to prove that no information is lost. For instance this Zig code currently is an error: fn trunc4(val: u8) u4 { return val & 0xF; } The expression result would fit into an u4, yet an @intCast or @truncate is required to make it work: fn trunc4(val: u8) u4 { return @intCast(val & 0xF); } Similar situation with a right-shift: fn broken(val: u8) u4 { return val >> 4; } fn works(val: u8) u4 { return @truncate(val >> 4); } Somewhat surprisingly, this works fine though: const a: u8 = 0xFF; const b: u4 = a & 0xF; const c: u4 = a >> 4; A similar problem exists with loop variables, which are always of type usize and which need to be explicitly narrowed even if the loop count is guaranteed to fit into a smaller type: for (0..16) |_i| { const i: u4 = @intCast(_i); } There’s also surprising cases like this: Assuming that: a: u16 = 0xF000 b: u16 = 0x1000 c: u32 = 0x10000 This expression creates an overflow error: const d = a + b + c; …but this doesn’t: const e = c + a + b; The type of d and e is both u32 btw (which I find also a bit surprising, it means that Zig already picks the widest input type as the result type, but it doesn’t promote the other inputs to this widest type). And here’s another surprising behaviour I stumbled over: // self.sprite_coords[] is an array of bytes const px: usize = 272 - self.sprite_coords[sprite_index * 2 + 1]; This produces the error error: type 'u8' cannot represent integer value '272'. Why Zig tries to fit the constant 272 into an u8 instead of picking a wider type is a bit of a mystery tbh. One solution is to widen the value read from the array: const px: usize = 272 - @as(usize, self.sprite_coords[sprite_index * 2 + 1]); But this works too: const px: usize = @as(u9, 272) - self.sprite_coords[sprite_index * 2 + 1]; In conclusion, I only understood that C’s integer promotion actually has an important purpose after missing it so badly in Zig :D I think C’s main problem with integer promotion is that it promotes to int, and int being stuck at 32-bits even on 64-bit CPUs (not moving the int type to 64 bits during the transition from 32- to 64-bit CPUs was a pretty stupid decision in hindsight). TBF though, just extending to the natural word size (e.g. 64 bits) wouldn’t help much in Zig when using wide integers like u128. In any case, I hope that the current status quo isn’t what ends up in Zig 1.0 and that a way can be found to reduce ‘@-litter’ in mixed-width integer expressions without going back entirely to C’s admittedly too sloppy integer promotion and implicit conversion rules. Asking around on the Zig Discord there seems to be a proposal which lets operators narrow the result type for comptime known values (which if I understand it right would make the result type of the expression a & 0xF a u4 instead of whatever wider type a is). Another idea that might make sense is to promote integers to the widest input type. Currently the compiler already seems to use the wides'''
