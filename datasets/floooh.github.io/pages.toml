["https://floooh.github.io/2021/12/17/cycle-stepped-z80.html"]
title = "A new cycle-stepped Z80 emulator"
description = "Table of Content"
full_description = 'A new cycle-stepped Z80 emulator Dec 17, 2021 Table of Content Table of Content Intro A Code Sample Basic Implementation Ideas Code Generation The Shared Opcode Fetch Machine Cycle The Opcode Lookup Tables The 3 Tick Function Epilogues More on Wait Cycles Instructions with Variable Timing The ‘Overlapped Clock Cycle’ in more Detail DD/FD Prefix Handling ED Prefix Handling CB Prefix Handling Interrupt Detection NMI Interrupt Behaviour Mode 0 Interrupt Behaviour Mode 1 Interrupt Behaviour Mode 2 Interrupt Behaviour The EI, DI and RETI/RETN instructions Pin Timing Differences to a real Z80 Differences to the old Z80 Emulator Testing Amstrad CPC Accuracy Improvements Intro I finally got around rewriting the Chips Project Z80 emulator to a ‘cycle-stepped’ execution model. The idea has been rolling around in my head since at least 2019 when I gave the 6502 emulator the cycle-stepped treatment. ‘Cycle-stepped’ means that the CPU emulator state can be stepped forward in single clock cycles. Previously, the Z80 emulator was ‘instruction stepped’: Even if the user asked the emulator to only execute one clock cycle, the emulator would execute one full instruction before it could return to the caller. While this doesn’t prevent the creation of cycle-correct computer system emulators (because the CPU emulator would invoke a ‘tick callback’ multiple times while executing a single instruction), switching the CPU emulator to a cycle-stepped model allows a more straight-forward ‘whole system’ emulation because the CPU no longer has a special controller role in a system emulation, instead it’s just an ordinary chip that’s ticked along with the other chips in the system. The Z80-based Tiny Emulators have all been updated to the new cycle-stepped model, which also means that the CPU step debugger now supports cycle-stepping (which is very useful for debugging the other chips in the emulated system): …also, if you haven’t seen it yet, check out the Visual Z80 Remix project, which I did as preparation for the new Z80 emulator to get the cycle timing right and better understand what’s going on in some of the more esoteric instructions. A Code Sample Here’s a simple code example to get an idea how the new emulator works: #include <stdio.h> #define CHIPS_IMPL #include "z80.h" int main() { // 64 KB memory with test program at address 0x0000 uint8_t mem[(1<<16)] = { 0x3E, 0x02, // LD A,2 0x06, 0x03, // LD B,3 0x80, // ADD A,B 0x00, // NOP... }; // initialize Z80 emu and execute some clock cycles z80_t cpu; uint64_t pins = z80_init(&cpu); for (int i = 0; i < 20; i++) { // tick the CPU pins = z80_tick(&cpu, pins); // handle memory read or write access if (pins & Z80_MREQ) { if (pins & Z80_RD) { Z80_SET_DATA(pins, mem[Z80_GET_ADDR(pins)]); } else if (pins & Z80_WR) { mem[Z80_GET_ADDR(pins)] = Z80_GET_DATA(pins); } } } // register A should now be 5 printf("\nRegister A: %d\n", cpu.a); return 0; } Here’s the same code on Compiler Explorer. The emulator only has two important API functions: uint64_t z80_init(z80_t* cpu) …this initializes a Z80 instance and returns an ‘ignition pin bitmask’ which is passed into the first tick function call: uint64_t z80_tick(z80_t* cpu, uint64_t pins) …the tick function executes exactly one clock cycle and then returns to the caller with a modified pin bitmask. This bitmask is used to communicate with the ‘outside world’ just like the input/output pins on a real CPU. The caller inspects the returned pin mask (for instance to check if the CPU wants to read or write memory), modifies the pin mask accordingly, and feeds it back into the next call of z80_tick(). And that’s it, no more ‘system tick callback’, or ‘trace callback’ for debugger support like in the old Z80 emulator. Basic Implementation Ideas Instruction decoding happens in a big switch-case statement like in the previous emulator, but instead of one case-branch per opcode there’s now one case branch per instruction clock cycle. In the new emulator, the decoder switch-case statement looks more like a program which implements its own ‘meta control flow’. A simple sequence where each call to the tick function executes the next step would look like this: void tick(state_t* state) { switch (state->step++) { case 0: ... break; case 1: ... break; case 2: ... break; ... } } Calling such a tick function over and over would first step through all the case branches until there are no more branches left or the step counter overflows. To implement an unconditional branch the step counter is simply set to the destination step, so that execution continues there on the next call of the tick function. For instance here the step counter is reset to zero at the end of the sequence, implementing an infinite loop: void tick(state_t* state) { switch (state->step++) { case 0: ... break; case 1: ... break; case 2: ... break; case 3: state->step = 0; break; } } Calling the tick function will now execute the steps 0..3 forever: [0, 1, 2, 3, 0, 1, 2, 3, …]. Of course branches can also jump forward to skip steps: void tick(state_t* state) { switch (state->step++) { case 0: ... break; case 1: state->step = 3; break; case 2: ... break; case 3: state->step = 0; break; } } Step 2 will now always be skipped, resulting in [0, 1, 3, 0, 1, 3, …]. …and conditional branches only modify the step counter when a condition is true: void tick(state_t* state) { switch (state->step++) { case 0: state->cond = !state->cond; break; case 1: if (state->cond) { state->step = 3; } break; case 2: ... break; case 3: state->step = 0; break; } } Because state->cond is now toggled in step 0, step 2 will be skipped in every other ‘run’ of the program: [0, 1, 3, 0, 1, 2, 3, 0, 1, 3, …]. Code that needs to be executed on each call of the tick function can be placed in front (prologue) or after (epilogue) the switch-case statement: void tick(state_t* state) { prologue; switch (state->step++) { case 0: state->cond = !state->cond; break; case 1: if (state->cond) { state->step = 3; } break; case 2: ... break; case 3: state->step = 0; break; } epilogue; } And finally, in C we can “break into” different epilogue code blocks using the good old goto statement: void tick(state_t* state) { prologue; switch (state->step++) { case 0: state->cond = !state->cond; goto ep_1; case 1: if (state->cond) { state->step = 3; } goto ep_1; case 2: ...; goto ep_2; case 3: state->step = 0; goto ep_1; } ep_1: epilogue_1; ep_2: epilogue_2; } Now the steps 0, 1 and 3 will run epilogue_1 and epilogue_2 on function exit, but step 2 will only execute epilogue_2. With the above core ideas it’s now possible to encode Z80 instructions into switch-case ‘microcode’: For example, the LD HL,nn instruction loads a 16-bit immediate value into the register pair HL. Execution of the instruction takes 10 clock cycles, split into 3 machine cycle groups: opcode fetch and refresh (4 clock cycles) read low byte into L (3 clock cycles) read high byte into H (3 clock cycles) …encoded into a switch-case sequence (as simplified pseudocode, abus and dbus means ‘address bus’ and ‘data bus’): uint64_t tick(z80_t* cpu, uint64_t pins) { switch (cpu->step++) { // opcode fetch + refresh machine cycle case 0: pins = (M1|MREQ|RD) | set_abus(cpu->PC++); break; case 1: cpu->opcode = get_dbus(pins); break; case 2: pins = (RFSH|MREQ) | set_abus(...); break; case 3: break; // first read machine cycle case 4: break; case 5: pins = (MREQ|RD) | set_abus(cpu->pc++); break; case 6: cpu->L = get_dbus(pins); break; // second read machine cycle case 7: break; case 8: pins = (MREQ|RD) | set_abus(cpu->pc++); break; case 9: cpu->H = get_dbus(pins); cpu->step = 0; break; } } This looks pretty good already, but there’s a chicken-egg-problem: the opcode fetch machine cycle (the first four steps) doesn’t actually do anything. Even though it loads an opcode byte, the opcode is ignored and the CPU will only ever execute LD HL,nn instructions. Currently there’s no way to add additional instructions to the switch statement. The solution is to split the switch-case decoder into a shared opcode fetch machine cycle which is the same for all instructions, and then do a branch to the remaining steps (which I’ll call ‘the instruction payload’ henceforth) somewhere else in the big switch-case statement. At the end of the shared opcode fetch machine cycle, a table lookup is performed with the opcode as index which yields the first step of the instruction payload (look at case 3:): uint64_t tick(z80_t* cpu, uint64_t pins) { switch (cpu->step++) { // opcode fetch + refresh machine cycle case 0: pins = (M1|MREQ|RD) | set_abus(cpu->PC++); break; case 1: cpu->opcode = get_dbus(pins); break; case 2: pins = (RFSH|MREQ) | set_abus(...); break; case 3: cpu->step = cpu->opstep[cpu->opcode]; ... // somewhere else in the big switch-case: // first read machine cycle of LD HL,nn case N+0: break; case N+1: pins = (MREQ|RD) | set_abus(cpu->pc++); break; case N+2: cpu->L = get_dbus(pins); break; // second read machine cycle of LD HL,nn case N+3: break; case N+4: pins = (MREQ|RD) | set_abus(cpu->pc++); break; case N+5: cpu->H = get_dbus(pins); cpu->step = 0; break; ... } } Note how the last step at case (N+5) loops back to step 0 to load the next opcode byte. In general, that’s how the cycle-stepped emulation loop works, but there’s one last problem: most instructions in the Z80 instruction set take 4 cycles to execute, but this doesn’t fit into the above execution pattern. Since the opcode fetch machine cycle already takes 4 clock cycles, there’s no clock cycle left to execute the instruction payload. Let’s take the ADD A,B instruction as example, this should look like this: uint64_t tick(z80_t* cpu, uint64_t pins) { switch (cpu->step++) { // opcode fetch + refresh machine cycle case 0: pins = (M1|MREQ|RD) | set_abus(cpu->PC++); break; case 1: cpu->opcode = get_dbus(pins); break; case 2: pins = (RFSH|MREQ) | set_abus(...); break; case 3: cpu->step = cpu->opstep[cpu->opcode]; ... // ADD A,B payload: case N: cpu->a=add8(cpu->a,cpu->b); cpu->step=0; break; ... } } But this would take 5 clock cycles, not the required 4. The solution is to use the same trick as a real-world Z80: overlap the execution of the last instruction with the opcode fetch of the next instruction by merging the last instruction clock cycle with the first clock cycle of the next opcode fetch, note how the old case 0: step has been removed and merged with the ADD A,B payload step: uint64_t tick(z80_t* cpu, uint64_t pins) { switch (cpu->step++) { // last 3 clock cyles of opcode fetch + refresh machine cycle case 0: cpu->opcode = get_dbus(pins); break; case 1: pins = (RFSH|MREQ) | set_abus(...); break; case 2: cpu->step = cpu->opstep[cpu->opcode]; ... // ADD A,B payload: case N: cpu->a=add8(cpu->a,cpu->b); pins = (M1|MREQ|RD) | set_abus(cpu->PC++); cpu->step = 0; break; ... } } …it looks a bit nicer when wrapping the actions of the first opcode fetch cycle into a macro: #define _fetch() {pins=(M1|MREQ|RD)|set_abus(cpu->PC++);cpu->step=0} uint64_t tick(z80_t* cpu, uint64_t pins) { switch (cpu->step++) { // last 3 clock cyles of opcode fetch + refresh machine cycle case 0: cpu->opcode = get_dbus(pins); break; case 1: pins = (RFSH|MREQ) | set_abus(...); break; case 2: cpu->step = cpu->opstep[cpu->opcode]; ... // ADD A,B payload and first clock cycle of next opcode fetch case N+0: cpu->a=add8(cpu->a,cpu->b); _fetch(); break; ... } } With this overlap-trick the timing for 4-cycle instruction is working fine now. You might be wondering now how the very first instruction starts executing. The trick is that the z80_init() function doesn’t initialize the cpu->step to 0, but instead to the overlapped payload-and-fetch clock cycle of the NOP instruction. That way the CPU emulation is properly ‘ignited’ at the first call to the z80_tick() function. The only problem left to figure out now is how to ‘draw the rest of the f*cking owl’. Code Generation Like in my previous CPU emulators, I’m using a Python script to generate the instruction decoder C source code. But this time I tried another idea that was also rolling around in the back of my head for a long time: instead of hardwiring the instruction behaviour and timing entirely in the Python script, describe the instructions in a data file, and process that data file with a much smaller and more general Python script. I’m using YAML as file format for this data file. YAML isn’t perfect because it requires the separately installed PyYAML dependency, but apart from that it’s quite alright for this use case. The YAML file contains instruction descriptions like this: LD $RY,$RZ: cond: (x == 1) and (y != 6) and (z != 6) mcycles: - { type: overlapped, action: $RY=$RZ } Those 4 lines describe all 49 instructions for loading an 8-bit register into another. The cond: line is a python expression matching the 2-3-3 opcode bit pattern described here: Decoding Z80 opcodes Identifiers starting with $ are placeholders which will be replaced with concrete register names or C code snippets during code generation. Machine cycles with default timing are implicit and don’t need to be listed (for instance in this case the opcode fetch machine cycle). The generated code will look like this (for the LD A,B instruction): // 78: LD A,B (M:1 T:4) // -- overlapped case 399: cpu->a=cpu->b;goto fetch_next; Another more interesting example is the LD dd,nn instruction group, which loads the 16-bit immediate value nn into register pair dd. The YAML description looks like this: # 16-bit load immediate/add LD $RP,nn: cond: (x == 0) and (z == 1) and (q == 0) mcycles: - { type: mread, ab: $PC++, dst: $RPL } - { type: mread, ab: $PC++, dst: $RPH } Again, the opcode fetch machine cycle has default behaviour and isn’t listed, and this instruction also doesn’t overlap execution with the next instruction. What remains are two memory read machine cycles to load the 16-bit value from memory into the destination register pair. The stamped out C code for LD DE,nn looks like this: // 11: LD DE,nn (M:3 T:10) // -- mread case 83: goto step_next; case 84: _wait();_mread(cpu->pc++);goto step_next; case 85: cpu->e=_gd();goto step_next; // -- mread case 86: goto step_next; case 87: _wait();_mread(cpu->pc++);goto step_next; case 88: cpu->d=_gd();goto step_next; // -- overlapped case 89: goto fetch_next; The macro _mread() sets the CPU pins for a memory read machine cycle (MREQ|RD and address bus pins). The macro _gd() extracts the data bus pins into an uint8_t. The _wait() macro samples the WAIT pin and will be explained later. The code generation Python script is now just around 400 lines of code, compared to about 1000 lines for the old script. However, when counting lines for all involved files (a C header template file, the Python script, and the YAML file) the old and new approach is nearly identical (1691 C+YAML+Python for the new approach, and 1633 lines C+Python for the old approach). One clear advantage of the new approach is that the same YAML description file'
