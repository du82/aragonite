["https://flotcharts.org"]
title = "Flot: Attractive JavaScript plotting for jQuery"
description = "Flot is a pure JavaScript plotting library for jQuery, with a focus on simple usage, attractive looks and interactive features."
full_description = "Additional examples are bundled with Flot. Also take a look at the Flot Usage Wiki for screenshots and stories from people and companies using Flot. Documentation Short introduction Frequently asked questions API documentation Plugin authoring guide Jürgen Marsch has created a series of videos introducing Flot NEWS describes what has been changed lately If you need more help, consider posting to the friendly gang on the forum/mailing list. You can probably save yourself some time skimming the FAQ first. Bugs, patches suggestions Bugs in Flot can be reported on the issue tracker - but please be polite and report only confirmed bugs and enhancements. Unless you spot an obvious mistake in Flot or can produce a small self-contained test case reproducing the problem (ideally based on one of the examples), you are probably better off asking on the forums, which are watched by the development team and many other knowledgeable people. As for new features, you can open an issue or send a pull request on Github. Note that Flot is currently in a process of slimming the core in favour of placing the features in plugins, and new features should generally follow the same trend. Who's behind this? Flot is the combined result of countless suggestions, patches and bug reports by the people using Flot. It was started by Ole Laursen, sponsored by IOLA, an agile little Danish web-development house with a keen eye for Python/Django and jQuery. If you need commercial support, you're welcome to contact us - read more here. It is currently being maintained by Andrew Dove, Jonathan Meyer, and Carson Moore."
