title = "Flot Examples"
full_description = "Here are some examples for Flot, the Javascript charting library for jQuery: Basic Usage Basic example Different graph types and simple categories/textual data Setting various options and annotating a chart Updating graphs with AJAX and real-time updates Interactivity Turning series on/off Rectangular selection support and zooming and zooming with overview (both with selection plugin) Interacting with the data points Panning and zooming (with navigation plugin) Panning and zooming simple and log-axis charts with Touch (with touchNavigation plugin) Automatically redraw when window is resized (with resize plugin) Axes Plotting time series, visitors per day with zooming and weekends (with selection plugin) Time zone support Log scales Multiple axes Interacting with the axes Autoscaling options Tick labels options Axis labels Additional Features Using other symbols than circles for points (with symbol plugin) Thresholding the data (with threshold plugin) Stacked charts (with stacking plugin) Using filled areas to plot percentiles (with fillbetween plugin) Tracking curves with crosshair (with crosshair plugin) Plotting prerendered images (with image plugin) Plotting error bars (with errorbars plugin) Plot Legend Pie charts (with pie plugin) Note that these examples use the non-minified source, so they will not work on older browsers such as Internet Explorer. Use the built source (which comes installed with the NPM package) if you need broader support."
