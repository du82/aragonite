["https://www.flowptwellness.com/dry-needling"]
title = "Dry Needling | Flow Physical Therapy and Wellness | Lafayette LA"
description = "Dry needling is an evidence-based treatment performed by Doctors of Physical Therapy and physicians which involves the insertion of a sterile monofilament needle into the muscle, connective tissue, or periosteum."
full_description = '''Dry Needling in Lafayette, LAExperience pain relief, improved mobility, and decreased muscle spasms and trigger points. Dry needling allows us to directly treat tissues that we could not reach and treat with other tools, giving you even better results.Using dry needling as a part of your treatment plan can help you get relief from sore or tight muscles, improve your mobility, enhance your recovery, and even reset your nervous system and provide you with more relaxation. Dry needling could be the missing puzzle piece you need for lasting relief and best results. ​ Conditions dry needling can help with: ​ Headaches TMJ Sports injuries Low back pain Neck pain Rotator cuff pain Sprained ankle Knee pain Disc herniations Disc bulges Sciatica …and so much more. LEARN MORE ABOUT DRY NEEDLING"Dr. Patrick works wonders with dry needling ... to produce the best possible outcomes for their patients and it has helped me tremendously." —MonicaFrequently Asked Questions About Dry NeedlingWhat is Dry Needling? Dry needling is a game changer for our patients! Dry needling is an extremely safe treatment tool that involves insertion of a hair-thin monofilament needle directly into specific pain generating spots on the body. The results range from immediate pain relief to immediate decrease in muscle spasms and trigger points.What kind of training does Dr. Patrick have to perform Dry Needling? Dr. Patrick is certified in Dry Needling through the Dry Needling Institute/American Academy of Manipulative Therapy. As a component of Dr. Patrick's Fellowship program through the American Academy of Manipulative Therapy, Dr. Patrick completed rigorous testing on various Dry Needling techniques.Is Dry Needling the same as Acupuncture? Dry Needling is similar to Acupuncture in that both techniques utilize hair thin, monofilament needles inserted into various points in the body to treat your diagnosis. The philosophical framework of the two practices vary in that Acupuncture is rooted in Traditional Chinese Medicine/Eastern Medical Philosophy and treats traditional Eastern Diagnoses and attempts to move Qi along meridian lines by using acupoints. Dry Needling is rooted in Western Medical Philosophy and treats diagnoses such as muscular strains, chronic pain, neural system, and more. This is accomplished by inserting needles in or near specific structures such as muscles, tendons, ligaments, nerves, and bone. Dr. Patrick performs Dry Needling with his patients, not Acupuncture.How many sessions will I need? Each patient presentation is unique and your treatment plan will be discussed with you thoroughly throughout your time with us at Flow PT. Some patients plans involve 1 session of Dry Needling, while other patients have Dry Needling as a component of each Physical Therapy session.Have questions or ready to get started? Book a FREE introduction call.BOOK YOUR FREE INTRO CALLDr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPT4 min readDry Needling for an Achilles Tendon Injury - Does it work?Dr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPT2 min readDry Needling can Improve your Sports PerformanceDr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPT4 min readHow Dry Needling can help Leaking PeeDr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPT2 min readHow Dry Needling Can Help Relieve Your PainLearn more about Dry Needling'''
