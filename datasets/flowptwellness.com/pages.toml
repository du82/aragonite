["https://www.flowptwellness.com/post/benefits-of-virtual-physical-therapy"]
title = "Benefits of Virtual Physical Therapy"
description = "Virtual Physical Therapy can be a valuable addition to your healthcare plan. This blog investigates if this is right for you!"
full_description = "Benefits of Virtual Physical TherapyDr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPTNov 13, 20244 min readUpdated: Dec 31, 2024There are many benefits of Virtual Physical TherapyWhat in the world is virtual Physical Therapy? How does a profession that relies on hands-on techniques provide a service where you aren’t physically present or in person. Why would someone be interested in Physical Therapy delivered virtually?If you hear yourself asking any of the above questions regarding virtual Physical Therapy, then this blog should shed some light on Virtual PT’s place in healthcare. So let's first address the question of:Why would you need virtual Physical Therapy instead of in-person PT services?Well, there are a litany of answers to this questions, including:Physical distance from your desired practitioner’s locationMaybe your preferred rehab provider is outside of your driving radius but you really want to work with them. Virtual PT is a great solution to see your PT of choice when their clinic is 2, 3, even 6 hours drive time away (or even greater distances).You have a specific goal to return to exercise following an injury or in the postpartum phase. Returning to exercise following an injury or pregnancy can be a daunting and scary task. Virtual Physical Therapy is a great method for a PT to guide you through a program with your specific diagnosis or concerns in mind. You want to be proactive regarding your pelvic health as you prepare for childbirth.Virtual Pelvic Floor exercise programming is an invaluable resource to both provide guidance on how to perform exercises throughout pregnancy and teach strategies for your pelvic floor. Can’t sit for prolonged timeIf your injury limits your ability to sit in a car, even for a short time, then a virtual PT session may be the trick for fast relief until you are able to make the drive to the clinic.Surgical PrecautionsIt is possible that your recent surgery doesn’t allow you to ride in a car for a few weeks. Virtual PT services can offer an alternative solution for this situation.No TransportationAnd if you don’t have a car and ride-sharing apps are unavailable to you? Virtual services can provide healthcare to you despite sudden inability to drive to the clinic.Injury/Pain RelatedWhat if your neck pain is so severe you can’t safely check your blind spots? Or your shoulder impingement is so severe you can’t safely turn your steering wheel? Then a virtual session is a great opportunity to get fast relief until you can safely attend in person. The above examples are only a few of the many reasons someone would opt to attend Physical Therapy services virtually instead of in-person - but what would the sessions actually look like? What do Virtual Physical Therapy sessions look like? How are they delivered?First thing is first, Virtual Physical Therapy is still 1 on 1, 60 minute rehab sessions with a Doctor of Physical Therapy. You will still have your providers undivided attention for 60 minutes to discuss all concerns regarding your symptoms/diagnosis. The most valuable tool of a Physical Therapy evaluation is the ability to listen closely to our patients. So the history gathering & storytelling portion of a virtual PT evaluation is exactly the same. Following this detailed question and answer session with your Physical Therapist, your PT may ask you to perform a series of functional movements in front of your camera. This can be called a functional movement screen or functional movement assessment. From this series of movements, along with the continuous communication during the movements, a skilled Physical Therapist can determine specific movement dysfunctions and a treatment plan can be created. So what about the Hands-On part? How can Physical Therapy work virtually?This is a great question, especially when one of the components of physical therapy is the expert manual therapy techniques that a Physical Therapist utilizes. With that being said, all credible research on effective Physical Therapy services for orthopedic conditions include expert level, injury specific therapeutic exercise - which can be delivered virtually using a variety of platforms.These exercises can be delivered using many platforms that most people are familiar with. These platforms, such as Zoom - which are password protected - are great options for patients to be heard and their movements visualized. Additionally, many times you may find yourself confused and frustrated searching Google and/or YouTube for exercises without any direction. With Virtual PT, your Physical Therapist creates your personalized exercise program based on a comprehensive physical therapy evaluation with your specific diagnosis in mind. This takes the guesswork out of the exercises for you and guides you to your goals faster. Faintly, the aforementioned “living and breathing” home exercise program is delivered directly to your phone by your Physical Therapist. In this manner, your physical therapy therapeutic exercises can progress with your based on weekly check ins and your ongoing assessments based on your progress - or even pivot based on a change of your symptoms/goals. Who does Virtual Physical Therapy Benefit?Many patients want to continue their active lifestyle and take their healthcare into their own hands. This type of patient may not want to rely on passive approaches such as massage, TENS, , heat/cold therapy, adjustments and manipulations - but rather, they want to add the progressive, loaded exercise program that your physical therapist can provide virtually.Additionally, many patients already attend weekly or monthly sessions of Chiropractic care or Massage Therapy. Virtual Physical Therapy is a fabulous way to add the ever important exercise component to a comprehensive rehab approach. Where can I sign up for Virtual Physical Therapy?This is potentially the best part and where you can take advantage of the benefit of Virtual Physical Therapy. You can sign up right where you are, right now. In order to get started with virtual Physical Therapy services, you just need to schedule your appointment, and have a forward facing camera either on your phone, tablet, or computer. Your Physical Therapist can walk you through a 60 minute initial assessment which will include functional movements, injury education, and the creation of your custom rehab exercise program. So whether you are located in North Houston, West Texas, South Louisiana, Acadiana Region, and beyond, click the button below to learn more about our virtual Physical Therapy Services. Click Here for Virtual Physical TherapyDr. Patrick Thompson, PT, DPT, OCS, Dip. Osteopractic, FAAOMPTOwner of Flow Physical Therapy and Wellness337-366-1703"
author = "Dr. Patrick Thompson, DPT, OCS, Dip. Osteopractic, FAAOMPT"
