["https://www.flowptwellness.com/faq"]
title = "FAQ | Flow Physical Therapy and Wellness | Lafayette, LA"
description = "Answering your frequently asked questions to help ease the unnecessary stress and anxiety that can be associated with starting your physical therapy journey."
full_description = 'Frequently Asked QuestionsGeneral QuestionsDo you accept insurance? Flow Physical Therapy and Wellness PLLC operates outside of the confinement of insurance is an Out-of-Network (OON) Provider for all insurance. Insurance companies often restrict services to one body part and do not value prevention and performance. We use a 100% customized approach for our patients where we spend 1:1 time during your entire session and teach you how to manage your condition independently rather than being stuck with an endless amount of follow up visits. This results in a much higher quality of care and saves you time and unnecessary copays. We are able to provide documentation for you to submit to your insurance directly for an out of network claim. Please contact your insurance to inquire about your benefits.How much do sessions cost? The cost of the first session ranges from $150 and can be done in-person or virtually. Because each person’s needs are different depending on what they are going through, it would be hard to provide an exact number for what your treatment plan will be like before your PT meets with you and is able to fully evaluate you. Some of our clients come once a week, some come 2x/month, and some just 1x/month, and some clients are purely digital. Your PT will give you an exact recommendation for you to get the best results according to your situation at your first appointment.How does treatment at Flow compare to traditional PT? Because our philosophy of treatment empowers and educates you to become independent, our clients typically save money in the long run by attending PT at Flow compared to traditional PT settings. We typically see patients once a week, once every other week, or once a month for 8-12 weeks. Traditional PT under insurance require you to attend 3x a week for 12 weeks. Because 100% of your sessions will be one-on-one time with a physical therapist, you will get more out of each session compared to the standard model in which most PT’s see 3-5 patients at a time. If you have a high deductible insurance plan, you will have to pay the full session fee even if you go to an in-network clinic until you meet your deductible. Because we spend 100% of our sessions 1:1, you will get more out of our sessions with fewer visits and less time away from home or work.Do you accept HSA/FSA cards? Yes! Physical Therapy is a medical service, so we do accept FSA/HSA cards.Pelvic Health, Pregnancy, and PostpartumDo you provide internal exams and treatment? Yes! Dr. Melissa is trained through Herman and Wallace Pelvic Rehab Institute and is able to provide internal treatment if needed in addition to functional pelvic health assessment and treatment.Can I attend the pelvic health sessions on my period? Yes you can if you are comfortable. We are able to do all of our internal treatments while on your period. If you are not comfortable, we have plenty of other treatment components that are part of your care plan that we will focus on while you are on your period.If I am pregnant, when do you recommend starting pelvic health PT for my symptoms? It is important that you start physical therapy during the pregnancy as soon as possible to heal from pelvic floor and orthopedic issues during the remainder of the pregnancy and into postpartum. Those who begin PT before birth can expect to see positive results in both symptom improvement and improved labor outcomes.If I am postpartum, when do you recommend starting pelvic health PT? You may begin pelvic floor PT as early as 3 weeks postpartum for return to exercise concerns and to ease postpartum aches and pains. An internal exam can be performed around the 6 week time period once cleared by your provider. Our philosophy is to begin healing as soon as possible to help you meet the physical demands of motherhood.If I am an avid exerciser, barbell lifter, or enjoy lifting weights, will you be able to help me with pelvic therapy, or do I need to stop lifting? Dr. Melissa and Clara are both trained in fitness and strength training. You do NOT have to put your entire life on hold while in pelvic therapy. We developed our unique hybrid model so that we can help you plan both your rehab exercises AND your fitness workouts in a safe way so you are not completely stopping the activities you love. Our patients who are leaking, diagnosed with prolapse, have sciatica or back/hip pain, or diastasis are able to continue exercising safely with our custom treatment and exercise programming.Orthopedics and OsteopracticsDo you perform spinal adjustments? Spinal Manipulations (aka Spinal Adjustments) are a shared procedure between many healthcare professionals; however, the clinical reasoning in performing the technique are dramatically different between professions. If you are appropriate for this treatment approach, it will be one component of a comprehensive treatment program which may also include functional exercise, dry needling, and a variety of additional manual therapy techniques. Dr. Patrick is certified to perform Spinal Manipulation through the American Academy of Manipulative Therapy/Spinal Manipulation Institute and has completed the most advanced training to utilize this approach through the Fellowship of the American Academy of Orthopedic Manipulative Therapists.Do I see the same Physical Therapist at every session? Yes. You will see Dr. Patrick at every treatment session, which directly leads to improved outcomes and efficient treatment sessions. Comparatively, many in-network PT clinics use teams of Physical Therapists to manage your case, which leaves room for communication error and inefficient treatment sessions.What is Osteopractic Physical Therapy? Osteopractors are Physical Therapists who have completed extensive post-Doctorate training in a variety of hands on treatment techniques and differential diagnosis. Osteopractors make up a subspecialty within the Physical Therapy profession, treating orthopedic injuries and chronic pain, and specialize in spinal/extremity thrust manipulation (adjustments), Dry Needling, IASTM (cupping/scraping/MFR), and differential diagnosis. In other words: Osteopractors can be looked at as the "Bridge between Chiropractic Care and Physical Therapy treatments."For more information on Osteopractic Physical Therapy, click here to read a recent blog Dr. Patrick wrote on the topic.What is a Fellowship-trained Physical Therapist? A credential (FAAOMPT) that identifies a Fellow of the American Academy of Orthopaedic Manual Physical Therapist. The AAOMPT is a national organization committed to excellence in Orthopaedic manual physical therapy practice, education, and research. Fellows of the AAOMPT provide the highest level of musculoskeletal care through advanced manual therapy practice and research Expert differential diagnosis and treatment techniques on the true root cause of your symptoms directly leads to faster results and healing times.Have questions or ready to get started? Book a FREE introduction call.BOOK YOUR FREE INTRO CALL'
