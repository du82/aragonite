full_description = 'Specialized and results-driven orthopedic and osteopractic physical therapy located in Lafayette, LouisianaAll-inclusive and custom physical therapy services for those who are struggling with joint pain and injury and those who want to keep doing what they love for life.BOOK YOUR FREE INTRO CALLOur Fellowship-trained, Osteopractic Physical Therapist streamlines your care and gets you the best results.Our process is unique and specialized to ensure you get the best results for your orthopedic and chronic health concerns. ​ What you’ll get inside our practice: ​ One-on-one sessions with your provider (always!): You’ll get focused attention for your entire session which can lead to faster results and better outcomes Completely personalized care: Each session is tailored to you, your lifestyle, and your specific concern Consistent providers: You won’t have to worry about telling your story over and over again to a different provider. Continued Communication: You have access to your Physical Therapist between your sessions via our secure messaging service. A process that gets you results: We each have a specific, tried and true process that will get you the lasting results you want. Convenient appointment options: We offer in-person and online appointments for your convenience. ​ Orthopedic, Sports Performance, and Pre- and Post-Operation TreatmentPatrick utilizes a blended approach of hands-on manual therapy and exercise-based treatment to address sports-related injuries, general orthopedic injuries, and any aches and pains to accelerate results. ​ What Patrick treats: Back pain Headaches ACL/MCL injuries Knee pain Shoulder pain Rotator cuff strains Muscle strains Ankle and foot injuries ...and moreLEARN MOREManual TherapyPatrick is a Fellow of the American Academy of Orthopedic Manual Physical Therapist (FAAOMPT), as obtained through the American American Academy of Manipulative Therapy. Manual therapy is a broad term describing any "hands-on" techn