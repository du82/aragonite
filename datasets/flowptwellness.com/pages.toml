description = "We are a specialty Osteopractic physical therapy clinic for active adults who want to live pain and leak-free to get back to the activities you love."
full_description = '''FLOW is dedicated to utilizing a whole-body approach, rather than a “joint-by-joint” process.If you’ve ever been to a physical therapy practice where they “can only treat one joint at a time”, you can rest assured that we have designed our practice to be different. We offer a holistic, whole-body, and collaborative approach that focuses on finding the root cause and lasting results. ​ We know that your shoulder pain could have an origination in your neck and that your back pain can be a result from mobility in your hips. Approaching your treatment from this lens allows us to accelerate results and give you solutions that will keep you healthy long-term.Everything you need, all in one place.What makes FLOW unique is that our Physical Therapist is both an Osteopractor and an Orthopedic Fellowship trained Specialist who is committed to offering one-on-one, 60 minute personalized sessions to achieve fast results. ​ We have created a place for you to address​ all of your concerns without the headache of having to find different providers at different places for each concern. ​ We are committed to filling the gaps that traditional healthcare leaves behind by finding and treating the root cause in the first session, without unnecessary imaging studies or getting lost in the healthcare system. One on One care with your providerEvery session will be one-on-one with a Doctor of Physical Therapy to ensure that you always get the highest quality of care. Your provider will never split their attention between you and another patient and you won't get passed off to aids or techs. ​ This allows for streamlined communication, quicker results, and constant reassessment and corrections.Personalized Care and Treatment PlanA "one size fits all" approach actually fits no one when it comes to physical therapy. This is why we offer personalized care plans that are tailored to you, your lifestyle, your availability for exercise, and beyond. One person's treatment will never be the same as another's and we are always ready to pivot and adjust as needs arise to keep you on track to accomplish your goals.Communication between your visitsWe know that it can be extremely frustrating to feel like you can't have your question answered until the next time you see a provider. ​ When you work with us, you'll be able to send us questions (and celebrate your wins!) between sessions. You never have to wait until your next session to get in touch with us.Price transparency, alwaysYou'll never get an extra bill from us months later after you wrap up treatment with us. You will know what each session costs up front and an estimate of how many sessions you will need overall. We know that this is different than most other clinics and the healthcare system in general. ​ Price transparency is not only a promise, it's our standard.Dr. Patrick Thompson, PT, DPT, OCS, Dip. Osteopractic, FAAOMPT Owner & Physical TherapistHi! I’m Dr. Patrick Thompson, PT, DPT, OCS, Dip. Osteopractic, FAAOMPT. I’m a Doctor of Physical Therapy and a board certified orthopedic clinical specialist. I am also a Fellow of the American Academy of Orthopaedic Manual Physical Therapists. I am passionate about injury rehab from head to toe. Many patients are left wondering how to exercise or how to fully heal from low back, neck, shoulder, ankle, and knee injuries or surgeries. I believe in a root cause approach to your healing that goes beyond imaging, surgeries, and medications. In my practice, I focus on manual therapy, dry needling, and one-on-one sessions with my patients (and likely a corny joke or two). This one-on-one care is typically unheard of in today's fast paced physical therapy world.​ ​ I earned my Bachelor's degree at Nicholls State University where I played baseball and subsequently discovered my passion for injury rehab while working towards my Athletic Training degree. At NSU, I worked with both collegiate and high school athletes to rehab various orthopedic injuries to return to sport. I then went on to earn my Doctorate in Physical Therapy from LSU Health Sciences Center in New Orleans. ​ I was born and raised in South Louisiana and spent many years living and practicing in and around New Orleans. I now live in Lafayette, LA with my wife, our son, and our dog, Biggio. We enjoy discovering new restaurants together, watching the Astros, and spending as much time as possible with friends and family. Academics and Certifications Doctorate of Physical Therapy at Louisiana State University Health Sciences Center New Orleans Bachelor of Science in Athletic Training at Nicholls State University Licensed Physical Therapist in Louisiana and Texas BLS American Heart Association Fellow of the American Academy of Orthopaedic Manual Physical Therapists Diploma of Osteopractic with American Academy of Manipulative Therapy Board Certified Orthopaedic Clinical Specialist by the American Board of Physical Therapy Specialities Dry needling certified with American Academy of Manipulative Therapy Spinal Manipulation certified with American Academy of Manipulative Therapy Instrument assisted soft tissue mobilization certification Kinesiology Taping certified My mission is to take the fear out of your pain by providing expert orthopedic manual physical therapy and exercise rehab so you get stronger and get back to your activities pain free.Our Location102 Magnate Drive, Suite 105, Lafayette, LA 70508Questions about FLOW?Book your FREE intro call. We'd love to answer any questions you may have!"I saw Dr. Patrick for knee pain. He spent an hour with me at each session, which I thought was awesome since I've been to other therapy places where I never really got to spend time with them. I felt much better after each session and now I'm back to going to the gym without any pain. I definitely recommend Dr. Patrick to be your physical therapist." —ZacharyHave questions or ready to get started? Book a FREE introduction call.BOOK A FREE INTRO CALL'''
