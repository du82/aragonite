["https://flsenate.gov/Reference/PublicRecords"]
title = "Public Records - The Florida Senate"
full_description = "In coordination with the Office of the Senate President, the Senate’s Public Records Manager processes public records requests submitted to the Florida Senate. The applicable provisions of law governing public records of the Florida Senate are Art. 1, s. 24 of the Florida Constitution, s. 11.0431, F.S., and Senate Rule 1.48. Under Article 1, s. 24(c) of the Florida Constitution, each house of the Legislature is exclusively authorized to adopt rules governing the enforcement of the public records with respect to its own public records. “Public record” means all documents, papers, letters, maps, books, tapes, photographs, films, sound recordings, or other material, regardless of physical form or characteristics, made or received pursuant to law or ordinance or in connection with the transaction of official business by the legislative branch, see s.11.0431(4), F.S. The Senate works to fulfill public records requests in a reasonable amount of time. Most public records requests can be produced electronically and are able to be fulfilled without a charge. In the event that the request is foreseen to result in an extensive use of information technology resources or extensive clerical or supervisory assistance, an estimate for approval prior to processing the request will be provided. For more information, please refer to the Senate’s Public Records Requests Policy and Extensive Use Fee Estimate Policy. Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
year_published = 2025
