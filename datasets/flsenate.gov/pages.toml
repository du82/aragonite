["https://flsenate.gov/Reference/FAQ"]
title = "FAQ - The Florida Senate"
full_description = 'The regular legislative session begins on the first Tuesday after the first Monday in March of each odd-numbered year, and on the second Tuesday after the first Monday in January of each even-numbered year. For more information, see Article III, section 3 of the Florida Constitution. The Legislature meets in regular session for no more than 60 consecutive days, and in a special session for no more than 20 consecutive days, unless each house votes for an extension by an extraordinary vote of three-fifths. In November of each even-numbered year, the Legislature convenes for the sole purpose of organizing each house. At this organization session, held fourteen days after the general election, members are sworn in, officers are elected, and rules are adopted. House bills receive odd numbers (1, 3, 5, …) and are prefixed by "H" or "HB"; Senate bills receive even numbers (2, 4, 6, ...) and are prefixed by "S" or "SB." An engrossed bill is a bill that has been amended on the floor. Adopted amendments are incorporated into the bill’s text to create a new version of the bill. A bill may be engrossed more than once. An enrolled bill, which may or may not have been engrossed, is a bill that has passed both houses of the Legislature. After passage, the bill is prepared as an act for signature by the legislative officers and presentation to the Governor or transmittal to the Secretary of State, as applicable. A bill that is contingent upon passage of another bill. A trust fund bill, a bill providing a public record exemption, or an implementing bill may be a linked bill. A bill that is introduced in one house and is substantially the same and identical to the specific intent and purpose of a bill introduced in the other house. When a bill is transmitted from one house to another house, the bill is accompanied by a message stating the action that was taken on the bill by one house and requesting the other house to act. In Bill History, the action "In Messages" indicates that a bill has been acted on by one house and transmitted to the other house for consideration.'
year_published = 2025
clearnet = "https://flsenate.gov/Reference/FAQ"
