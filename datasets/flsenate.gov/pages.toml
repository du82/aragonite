["https://flsenate.gov/Laws/Constitution"]
title = "The Florida Constitution - The Florida Senate"
full_description = "The Constitution of the State of Florida as revised in 1968 consisted of certain revised articles as proposed by three joint resolutions which were adopted during the special session of June 24-July 3, 1968, and ratified by the electorate on November 5, 1968, together with one article carried forward from the Constitution of 1885, as amended. The articles proposed in House Joint Resolution 1-2X constituted the entire revised constitution with the exception of Articles V, VI, and VIII. Senate Joint Resolution 4-2X proposed Article VI, relating to suffrage and elections. Senate Joint Resolution 5-2X proposed a new Article VIII, relating to local government. Article V, relating to the judiciary, was carried forward from the Constitution of 1885, as amended. Sections composing the 1968 revision have no history notes. Subsequent changes are indicated by notes appended to the affected sections. The indexes appearing at the beginning of each article, notes appearing at the end of various sections, and section and subsection headings are added editorially and are not to be considered as part of the constitution. We, the people of the State of Florida, being grateful to Almighty God for our constitutional liberty, in order to secure its benefits, perfect our government, insure domestic tranquility, maintain public order, and guarantee equal civil and political rights to all, do ordain and establish this constitution. “I do solemnly swear (or affirm) that I will support, protect, and defend the Constitution and Government of the United States and of the State of Florida; that I am duly qualified to hold office under the Constitution of the state; and that I will well and faithfully perform the duties of (title of office) on which I am now about to enter. So help me God.”, and thereafter shall devote personal attention to the duties of the office, and continue in office until a successor qualifies. s. 190.049, F.S. (Pertaining to the creation of independent special districts having the powers enumerated in two or more of the paragraphs of s. 190.012, F.S.)."
year_published = 2025
