["https://flsenate.gov/Offices"]
title = "Offices - The Florida Senate"
full_description = "Senate offices provide leadership and administrative support for the legislative process. Visit each office to learn their purpose and how to contact them for more information. The President, who is elected by members of the Senate, manages the operations of the Senate and presides over its sessions. Find out who is on the leadership team, how to contact the President's Office and read a message from the Senate President. The Senate Majority Office, as the political extension of the Office of the Senate President, enables the Republican Caucus to fully participate in the governmental process; providing accurate information and services in a professional manner and enabling members to make unified, informed decisions affecting the quality of life of the people they represent. The Minority Office consists of the Minority Leader, who represents the members of the Minority Party in the Senate, as well as staff to support the leadership. Though fewer in numbers than the Majority Party, the Minority Caucus and its leader serve a critical function in ensuring that the diverse interests and priorities of all Floridians are fully represented in the legislative process. The Senate elects a Secretary of the Senate pursuant to the Constitution of the State of Florida. This nonmember constitutional officer publishes the journal and the calendar, keeps all Senate records, and authenticates each act and resolution passed by the Senate. Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
