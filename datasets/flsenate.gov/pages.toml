["https://flsenate.gov/About/Privacy"]
title = "Privacy Statement - The Florida Senate"
full_description = "The Florida Senate is committed to protecting individual privacy and securing the personal information made available to us when you visit www.flsenate.gov or any of its sub-domains (*.flsenate.gov). This privacy policy describes what information is made available to The Florida Senate and third parties when you visit www.flsenate.gov and any of its sub-domains that point to this privacy statement. It also references expectations about Florida Senate pages on other sites (such as official Florida Senate profiles on social networks) and what visitors should expect when they visit there. If you have questions about this policy or suggestions for its improvement, please let us know. You can contact us at webmaster@flsenate.gov or call us at (850) 487-5995 between 8 a.m. and 6 p.m. EST Monday - Friday. We will revise or update this policy if our practices change, or as we develop better ways to keep you informed about them. You should refer back to this page often for the latest information and the effective date of any changes. If we decide to change this policy, we will post a new policy on our site and change the date at the bottom. Changes to the policy shall not apply retroactively. When a computer is used to access information on *.flsenate.gov, the following basic information is automatically received and stored by The Florida Senate web servers hosting *.flsenate.gov: The Florida Senate does not use this information to identify or track the browsing of individual users. We do use it to generate aggregate statistics about how *.flsenate.gov is used. We retain this information upwards of two years—for example, server logs from June 2011 will be deleted by June 2013. We do not sell or rent this information to persons or organizations. However, s. 119.01, F.S., indicates that all state records are public records. The Florida Senate uses web measurement and customization technologies to make *.flsenate.gov function better for visitors and to better understand how the public is using the website."
