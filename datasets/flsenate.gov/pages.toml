["https://flsenate.gov/About/Accessibility"]
title = "Accessibility - The Florida Senate"
full_description = "The Capitol Complex (pdf) , by statute, includes the Capitol, Historic Capitol, Senate Office Building, House Office Building, Knott Building, Pepper Building, Holland Building, and the curtilage of each. Please contact Department of Management Services (DMS) for information regarding public access to the Capitol Complex. The Florida Senate is committed to making sure all Floridians have access to the legislative process. Accommodations for people with a disability can be made by contacting the Senate Sergeant’s Office at 850-487-5224 or via SENATE.SERGEANT@flsenate.gov for assistance. When possible, please contact the Sergeant’s Office in advance of scheduled meetings to request accommodations. The Senate will make every effort to fulfill requests for reasonable accommodations in a timely manner. Senate documents are available in alternate formats upon request by a person with a disability. Please contact the Senate Secretary’s Office at 850-487-5270 for assistance. Assistive listening devices are available upon request in the Senate Services Center, Room 301 Capitol. Additional information may be found on the Legislature’s website, Online Sunshine . Please contact the Senate Sergeant’s Office at 850-487-5224 or via SENATE.SERGEANT@flsenate.gov for assistance. The Florida Senate is committed to providing access to all individuals, with or without disabilities, seeking information on its website, Flsenate.gov. To provide this information, the site is built to comply with Section 508 of the U.S. Rehabilitation Act (as amended), Florida Statute Chapter 282 and Florida Administrative Code (FAC) Rule: 60-8.002 . W3C Web Content Accessibility Guidelines (WCAG) 2.0 were followed to ensure our information is accessible. If you use assistive technology (such as a screen reader, eye tracking device, voice recognition software, etc.) and have difficulties accessing information on Flsenate.gov, please contact us and provide the URL (web address) of the material you tried to access, the problem you experienced, and your contact information."
year_published = 2025
clearnet = "https://flsenate.gov/About/Accessibility"
