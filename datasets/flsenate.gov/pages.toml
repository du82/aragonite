["https://flsenate.gov/About/EffectiveCommunication"]
title = "Effective Communication With a Legislator - The Florida Senate"
full_description = "As a Floridian, one of your greatest responsibilities is to help elect the legislators who represent you and the state's more than 14 million other residents. But your role in the democratic process of government does not end at the polls. By sharing your opinions and ideas with your Representatives and Senators in Tallahassee, you help them decide what to do about the issues and pending legislation that affect us all. They value your suggestions and encourage you to express them. Your legislators receive a huge amount of phone calls and mail from their constituents. Unfortunately, their full agendas limit their ability to personally respond to them all. How, then, can you be sure your voice is heard? Here are some tips to help you get the most impact out of your communications with your legislators in Tallahassee. Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
