["https://flsenate.gov/Session/ExecutiveSuspensions"]
title = "Executive Suspensions - The Florida Senate"
full_description = "Article IV, section 7(a), of the State Constitution authorizes the Governor to suspend any state officer not subject to impeachment or any county officer on any of the following grounds: malfeasance, misfeasance, neglect of duty, drunkenness, incompetence, permanent inability to perform official duties, or commission of a felony. The Florida Senate has the exclusive responsibility to sit in judgment of the merits of a suspension. The Senate may remove from office or reinstate the suspended official. Senate Rule 12 outlines the process adopted by the Senate. Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
