["https://flsenate.gov/Reference/Glossary"]
title = "Glossary - The Florida Senate"
full_description = "Adjournment The recess of a legislative house until a later stated time or until the time fixed by its rules for reconvening. Sine die adjournment is the final adjournment of a legislative session. Each house adjourns after its daily session and adjourns sine die at the end of each session. Agenda The list of business (including proposed legislation) to be considered at a committee meeting or during a hearing. Amendment A proposal to change a procedural motion or proposed legislation. Types and versions of amendments include: Committee amendment Recommended changes to a bill, which a committee has agreed upon. By motion, each adopted committee amendment accompanies the bill reported favorably out of committee for floor consideration. When the bill goes to the floor, the committee amendment must be considered before any other amendment may be taken up. Floor amendment A proposal offered by one or more legislators for consideration in the respective chamber. Technical amendment A nonsubstantive amendment used to correct errors such as spelling, numbering, incorrect coding, or directory language. Analysis Sometimes called a bill analysis or staff analysis, it is prepared by the staff of each committee of reference. It summarizes the bill and explains the current law affected by the bill, the likely impact of the bill, any constitutional issues raised by the bill, and committee amendments, if any, are summarized. Apportionment and redistricting Legislative action required following each decennial census, fixing the size of each house of the Florida Legislature and drawing legislative and congressional district boundaries to provide representation in the Florida Legislature and the U.S. Congress for the people of the state. Bicameral A legislature having two houses; in Florida, these two houses are the Senate and the House of Representatives. Biennium A two-year period. This term is often used to describe the two-year term of the Florida Legislature that begins in November of an even-numbered year and ends in November of the next even-numbered year. See Legislature, the Florida."
year_published = 2025
clearnet = "https://flsenate.gov/Reference/Glossary"
tags = ["acronyms", "adjournment", "adoption", "agenda", "amendment", "analysis", "apportionment", "appropriations,", "arms", "bicameral"]
