["https://flsenate.gov/Session/Bills"]
title = "Bill List  - The Florida Senate"
full_description = 'Use the filters below to narrow down the list of bills or search for text with bills and amendments. The Show More Options button reveals additional filters. Not all filters are available for all sessions. Bill Search Tips are provided for more information. Enter a search term in the search box. Bills evolve into different versions as they are amended throughout the legislative process. "Current Bill Version" is selected by default and will only return search results for the latest version of bills in the selected session. Choose "All Bill Versions" to search for the term in all versions of all bills in the selected session. Choose "Include Amendments" to also search all amendment text. The vast majority of bills cite the Florida Statutes, however they can also cite the Florida Constitution or Laws of Florida. Use the Citation search field to determine which bills (latest version) cite sections of the Florida Statutes. Citations are formatted as “chapter.section”. If you add a number without a “.”, such as “120”, the search engine will automatically add a “.” at the end, so the search will return results for all bills that cite sections in Chapter 120—including bills creating new sections in Chapter 120. To search for specific section citations, you must include the chapter number, such as “120.555”. Bills cite the current version of the Florida Statutes at the time the bill is filed. For example, the 2013 Statues were published to reflect the changes that were made during the 2013 Legislative Session. Statute citations for bills in the 2014 Legislative Session cite the 2013 Florida Statutes. Use the Citation search field to determine which bills (latest version) cite sections of the Florida Constitution. Citations are formatted as “article, section”. The field will accept roman or arabic numerals, separated by a comma or period. If you add a number without a comma or period, such as “10”, the search engine will automatically add a “.” at the end, so the search will return results for all bills that cite sections in Article 10—including bills creating new sections in Article 10.'
year_published = 2025
clearnet = "https://flsenate.gov/Session/Bills"
