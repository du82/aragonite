["https://flsenate.gov/Offices/Secretary"]
title = "Office of Senate Secretary - The Florida Senate"
full_description = '''<a href="mailto:secretaryofthesenate@flsenate.gov">secretaryofthesenate<br />@flsenate.gov</a><br> Email this Office The Senate elects a Secretary of the Senate. This nonmember constitutional officer has various responsibilities, including: In addition, the Secretary's Office speaks to visiting civic and student groups and hosts numerous mock sessions throughout each year. Various documents and publications are prepared by the Secretary of the Senate (Secretary) or are received and distributed by the Secretary. These documents are available electronically or in print through the Senate Services Center, 301 Capitol, (850) 487-5915. Floor amendments—Amendments that are to be considered in the chamber are filed in the Senate Services Center by the established deadline. Amendments are "late filed" if filed after the deadline or filed during session at the Amendment Desk in the chamber. Amendments proposed for consideration at a committee meeting are assembled into a meeting packet; amendments filed for floor consideration are compiled into an amendment packet. Individual amendment copies or full amendment packets are available in the Senate Services Center. All amendments filed for floor consideration (adopted committee amendments, Senate amendments to Senate and House bills, engrossed amendments, engrossed Senate amendments to House bills, House amendments to Senate bills) and Senate floor action on such amendments are posted and can be viewed in the Session section. When a bill is submitted for filing, it is numbered, and made available electronically. With certain exceptions, such bills must be filed by noon of the first day of the regular session. Current year bills can be printed from the Session section or a copy of a bill may be picked up from the Senate Services Center. Copies of bills from the 1998 Regular Session forward are available on the Internet. Senate adoption of an amendment to a Senate bill triggers the engrossing stage in a bill's history. Proper placement of the amendment within the bill and text accuracy of each amendment are verified. If passed by the Senate, the engrossed Senate bill is sent to Messages for transmittal to the House. Copies can be printed from the Session section or may be picked up from the Senate Services Center.'''
year_published = 2025
