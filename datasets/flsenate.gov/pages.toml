["https://flsenate.gov/About"]
title = "About the Legislature - The Florida Senate"
full_description = "The Florida Senate and the Florida House of Representatives together are the Florida Legislature, a bicameral legislature. The Florida Legislature is one of three branches of government in Florida. The other two branches are the Executive and Judicial. The Senate is composed of 40 members, each elected from single-member districts across the state. The Florida Legislature meets in session every year for sixty consecutive days. A regular session of the legislature shall convene on the first Tuesday after the first Monday in March of each odd-numbered year, and on the second Tuesday after the first Monday in January of each even-numbered year. There are other ways in which the Legislature may be convened as outlined in Article III, Section 2, of the Florida Constitution, including special sessions, which may be called either by the Governor; or by a joint proclamation issued the Senate President and House Speaker. This website is a portal into the business of the Florida Senate, including actions on legislation, meetings of committees, and much more. This section of the website provides visitors with information on how to engage with the Legislature and take an active role in the legislative process. The Florida Senate is an Equal Opportunity Employer and does not discriminate on the basis of race, color, national origin, sex, religion, age, or disability in employment or the provision of services. Helpful information about visiting the Capital Complex in Tallahassee. You'll find information about the Capitol Area parking, maps, visitor center location and contact numbers. Find out how to contact The Florida Senate as well as other information on how to order publications and who to contact for what. A general list of common numbers, such as the Document Center, is provided. During regular sessions of the Florida Legislature, participating students from all across the state come to Tallahassee for one week to assist members of the legislature in carrying out the work of the people. During their assigned week, Senate Pages will learn about the legislative process through a hands-on approach, experience a mock session in which students role-play as Senators and engage in drafting, debating, discussing, and voting on legislation, and assist members of the Florida Senate by distributing materials and correspondence."
year_published = 2025
