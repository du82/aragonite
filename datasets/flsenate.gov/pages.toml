["https://flsenate.gov/Reference/Help"]
title = "Help - The Florida Senate"
full_description = "Flsenate.gov was designed with the user in mind. We welcome your input and ask that you email us with suggestions for future enhancements. The website is automatically set up to remove the header and footer and only provide what's in the content area (with the white background). This will save on printing time and ink. Use your normal browser print buttons to print or CTRL+P. From each Senator’s District tab two PDF maps are available. To print a district map that is 8.5 x 11 inches, select the Letter Size map. For a larger map, if you have a printer that can accommodate it, select the Poster Size map. Many copy centers have large-format printers. A full-size poster is 42 x 63 inches, portrait or landscape (depending on the district). PDFs can be reduced to your preferred size. For example, reductions to 24 x 36 inches or 20 x 30 inches will fit standard poster frames. Prints can be as small as 11 x 17 inches, but the legibility suffers. To print from within Acrobat Reader, click the print icon : Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
