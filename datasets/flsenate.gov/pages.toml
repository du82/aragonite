["https://flsenate.gov/Offices/President"]
title = "Office of Senate President - The Florida Senate"
full_description = 'Email this Office <a href="mailto:Officeofthesenatepresident@flsenate.gov"> Officeofthesenatepresident<br /> @flsenate.gov </a><br> The Senate President is a constitutional officer who leads the Florida Senate for a two-year term. The President, who is elected by members of the Senate, manages the operations of the Senate and presides over its sessions. The President’s many duties include: selecting a Majority Leader, appointing Senators to standing Senate committees, appointing committee chairs, and appointing citizens to a variety of boards and commissions. The President of the Senate has appointing authority for a diverse number of boards and commissions throughout the state. These boards and commissions include: The Advisory Council provides assistance to the Department of Health relating to the needs of patients and families of patients with developmental disabilities in the establishment of the information clearinghouse on developmental disabilities. Advise the Department of Elder Affairs on the treatment of a person with Alzheimer’s Disease and their caretakers. The James and Esther King Biomedical Research Program works within the Department of Health to provide a perpetual annual source of funding for research in the areas of tobacco-related cancer, cardiovascular disease, stroke, and pulmonary disease. The BRAC is charged with developing the strategic objectives and priorities of the programs, and with recommending which research proposals should be funded, based on the scientific merit of the proposals. http://www.floridahealth.gov/provider-and-partner-resources/research/funding-opportunity-announcements/kingfoa.html The Blood Clot and Pulmonary Embolism Policy Workgroup gathers specified data and information relating to blood clots and pulmonary embolisms and develops a risk surveillance system and policy recommendations relating thereto. To advise the Department of Health and the Legislature on developing a holistic approach to the state’s efforts to fund cancer research, cancer facilities, and the treatments for cancer patients. May make recommendations on proposed legislation, proposed rules, best practices, data collection and reporting, issuance of grant funds, and other proposals for state policy relating to cancer research or treatment. The collaborative is directed to advise the Department on the awarding of grants issued through the Cancer Innovation Fund.'
year_published = 2025
