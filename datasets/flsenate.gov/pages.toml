["https://flsenate.gov/Laws"]
title = "Laws - The Florida Senate"
full_description = "The constitution establishes the powers and duties of The Florida Senate. The Legislative Branch, as defined in the Constitution, has exclusive lawmaking power. In a simplified version, legislators propose bills which, if passed favorably by both houses and approved by the Governor, become law. Learn more about how an idea becomes a law. A permanent collection of state laws organized by subject area into a code made up of titles, chapters, parts, and sections. The Florida Statutes are updated annually by laws that create, amend, transfer, or repeal statutory material. An organized system of fundamental principles for the government of the state. It is of a permanent and general nature and originates from the people rather than from the Legislature. A compilation of all the laws, resolutions, and memorials passed during a legislative session. They are divided into two broad categories--General Laws and Special Laws. Bills vetoed by the Governor are not included. The Laws of Florida are hosted by the external website, http://laws.flrules.org/ Visit the Legistore to order Florida Statutes, Laws of Florida, CD-ROMs, indexes, and other publications by credit card. For more information, email lawbook.services@leg.state.fl.us. Disclaimer: The information on this system is unverified. The journals or printed bills of the respective chambers should be consulted for official purposes."
