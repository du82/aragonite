title = "Flymake -- an on-the-fly syntax checker for Emacs"
full_description = "Switching to the GNU Emacs/GNU Make environment from the Microsoft Visual Studio 6.0/Visual Assist 6.0 pair had both positive and negative consequences. On one hand, memory consumption was dramatically reduced, making many things work much faster then they used to. On the other hand, such nice IDE features as context aware auto-completion and auto parameter info were no longer available. This resulted in an increased amount of typos and errors, not to be revealed until compilation time. Furthermore, even Visual Assist was not able to correctly parse all of the C++ constructs I've been using. This is especially true for non-trivial templates as well as macros. In the end, the ultimate tool for checking syntax is the compiler, as it can easily handle any valid constructs and report errors if any. So, having compiler make on-the-fly syntax checks of the source code being edited seems like a good idea. Users of some modern Java IDEs, like IntelliJ IDEA, enjoy this feature for a relatively long time. I don't know of any C++ IDE with this feature, and Visual C++ 6.0/.NET lack it as well. So came the idea of developing of an on-the-fly syntax checker for Emacs -- flymake. Flymake is implemented as an Emacs minor mode. It runs the syntax check tool (the compiler for C++ files, perl for perl files, etc.) in the background, passing it a temporary copy of the current buffer and parses the output for known error/warning message patterns. Flymake then highlights erroneous lines (that is, lines for which at least one error or warning has been reported), and displays an overall buffer status in the mode line, as shown on the figure below. File Func.c here has 2 errors and 1 warning. Using flymake-goto-next-error, it is posible to jump to erroneous line 7, highlighted in red, and calling flymake-display-err-menu-for-current-line will popup a menu containing error text provided by the compiler. Line 4 is highlighted in blue, as it only has a warning attached to it. Line 1 is red, but as calling flymake-display-err-menu-for-current-line shows, the error really belongs to line 5 of Func.h."
