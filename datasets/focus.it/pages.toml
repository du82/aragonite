["https://focus.it/cultura/curiosita/hitler-era-vegetariano-probabilmente-si-ma-sono-varie-le-ipotesi-sul-motivo-di-questa-scelta"]
title = "Hitler era vegetariano? Probabilmente sì, ma perché? -  Focus.it"
description = "La questione è controversa, ma il suo medico personale e una delle sue assaggiatrici dichiararono che Hitler non mangiava né carne né pesce."
full_description = '''Curiosità Hitler era vegetariano? Probabilmente sì, ma perché? La questione è controversa, ma il suo medico personale e una delle sue assaggiatrici dichiararono che Hitler non mangiava né carne né pesce. Adolf Hitler (1889-1945) fotografato durante un pic-nic nel 1933. Getty Images Non è certo che Hitler fosse vegetariano: probabilmente lo divenne a partire dal 1931, ma la questione è controversa. A confermarlo sarebbe stato Theodor Gilbert Morell, medico personale di Hitler dal 1936 al 1945, e Margot Wölk (1917-2014) una delle sue assaggiatrici, che anni fa, novantenne, rilasciò alcune interviste ai giornali raccontando che il Führer non mangiava né carne né pesce. Inoltre, l'analisi dei suoi denti (2018) sui suoi presunti resti conservati in Russia confermerebbero il vegetarianesimo. Cultura A quando risale la prima campagna anti-fumo? Chi erano le assaggiatrici di Hitler? Per più di due anni, dalla primavera del 1942 al 20 novembre 1944, quindici ragazze, di età compresa tra i 18 e i 25 anni, di ottima salute e reputazione (certificate dal borgomastro della città) scelte dalla Commissione medica dell'Ufficio economico centrale delle Ss hanno protetto il Führer da bocconi avvelenati. Il leader nazista era convinto che le donne fossero fisiologicamente sensibili a quantità minime di tossine. "Ogni mattina venivamo prelevate alle otto da una pattuglia di Ss e portate nella cucina della caserma Krausendorf. Alle 12:00 e alle 18:00 assaggiavamo le portate disposte su un grande tavolo di legno: zuppe di verdura, uova, frutta esotica e strudel di mele" raccontò Margot Wölk, l'unica delle ragazze sopravvissuta alla Seconda guerra mondiale. Cultura Quali furono i best seller nella Germania nazista? Motivi di Salute? Rimangono dubbi anche sulle motivazioni che portarono Hitler a questa scelta. Il ministro dell'Alimentazione del Terzo Reich Richard Darré e Anni Winter, la domestica, ritenevano che la scelta fosse dovuta al trauma per il suicidio della nipote Geli Raubal (1931): la sua morte lo avrebbe fatto sentire a disagio nel mangiare alimenti contenenti sangue. Morrel annota, nel 1941, che la sua dieta in quel periodo consisteva in uova fritte, rape, fagiolini, patate e fragole. È possibile che Hitler abbia praticato l'astinenza dalle carni con il fine di ricercare la purezza del corpo come teorizzato dal compositore Richard Wagner nel 1881, che vedeva in questa pratica una redenzione morale. O forse fu solo dettata da motivi di salute. 10 FOTO Fotogallery 10 cose che (forse) non sai su Hitler VAI ALLA GALLERY Fotogallery 10 cose che (forse) non sai su Hitler I baffetti? Alla moda. Baffi squadrati, frustino da ufficiale e impermeabile stretto in vita: sono questi gli elementi del look di Adolf Hitler. Ma la sua non fu tanto una personale scelta di stile. Da giovane portava infatti baffi lunghi, secondo la moda di inizio ’900. Quando entrò nell’esercito (durante la Prima guerra mondiale) fu costretto a sfoltirli per poter meglio indossare le maschere antigas in dotazione. E poi li mantenne così, seguendo la nuova moda prevalente. Fu invece l’amico Dietrich Eckart, esponente di spicco della società segreta Thule (primo nucleo del partito nazista) a fargli abbandonare gli abiti trasandati da bohémien a favore di una tenuta più marziale. Foto: © Courtesy Everett Collection/Contrasto I suoi antenati erano ebrei? Hitler era ebreo? La questione è controversa. Già in passato si era ipotizzato che il padre di Hitler, Alois, fosse il figlio illegittimo di una cameriera, Maria Schickelgruber, e di un giovane ebreo presso cui prestava servizio, ma si trattava di voci considerate poco attendibili. A dar forza a questo paradosso storico è un recente studio belga che ha esaminato il Dna in campioni di saliva di 39 parenti del dittatore, riscontrandovi un frammento di cromosoma comune tra gli ebrei ashkenaziti e sefarditi, ma anche tra i berberi del Marocco. Lo studio, in realtà, non dimostra che Hitler fosse ebreo, ma conferma – se ancora ve ne fosse bisogno – che il mito nazista della razza ariana era totalmente privo di fondamento. Foto: © ARCHIVIO GBB Contrasto Un treno speciale (anzi due). Pur preferendo di gran lunga l’automobile, Hitler fu presto costretto dai numerosi impegni a optare per il treno, più rapido e sicuro. Alla fine degli Anni ’30 fu allestito per lui il Führersonderzug, un treno speciale che era un autentico quartier generale in movimento. I treni del dittatore, in realtà, furono due: il primo utilizzato in tempo di pace e il secondo attrezzato per la guerra, con vagoni blindati e armato. Quest’ultimo si chiamava Amerika ed era provvisto di cannoni contraerei. Gli alloggi interni erano comodi, arredati con cura, ma non di lusso poiché il führer riteneva uno stile spartano più consono alla guerra. Il treno seguiva tragitti segreti, eppure nel 1941 sfuggì per un soffio a un attentato dinamitardo. Foto: © adoc-photos / adoc-photos Adv Il mistero del testicolo. Hitler aveva un testicolo solo? Per gli autori delle canzoni satiriche fischiettate dai soldati inglesi nella Seconda guerra mondiale senz’altro sì. E una prova si troverebbe negli appunti di un sacerdote polacco, da poco resi pubblici, al quale il dettaglio fu rivelato negli Anni ’60 da Johann Jambor, medico militare che ebbe in cura il giovane Adolf durante la Prima guerra mondiale. La menomazione sarebbe stata causata da una scheggia che lo ferì all’inguine nella battaglia della Somme (Francia). Il dubbio però resta: lo storico inglese Thomas Weber, basandosi su documenti inediti, mette oggi in dubbio che Hitler sia stato in prima linea in quel conflitto. Foto: © Jerry Tavin/Everett Collection/Contrasto Una bambola per le truppe. Non sopportando che i propri soldati di stanza in Francia durante l’occupazione “inquinassero” il loro sangue ariano con le prostitute locali, nel 1941 Hitler fece progettare una speciale bambola gonfiabile in grado di soddisfare i desideri delle truppe. Le istruzioni erano dettagliate: “pelle chiara, capelli biondi, occhi azzurri, 1,76 m di altezza e seni grandi”. In breve, una perfetta donna ariana in versione giocattolone sexy, per la quale venne scelto il nome di Borghild (un’eroina della mitologia nordica). Un bombardamento alleato rase però al suolo la fabbrica di Dresda incaricata della produzione, e così i bordelli francesi continuarono a fare affari con i soldati tedeschi.La storia è raccontata da Graeme Donald nel libro Mussolini's Barber: And Other Stories of the Unknown Players Who Made History Happen, ma secondo alcuni storici si tratterebbe di una bufala. Amante del sesso estremo. Pornografia e sadomasochismo pare fossero alla base delle fantasie sessuali di Hitler. Almeno stando ai racconti della nipote Geli Raubal (morta suicida nel 1931 dopo una relazione con lo zio). Questa confessò che “zio Alf” la obbligava a posare nuda per lui in posizioni oscene, o a mettersi carponi per essere poi sculacciata con un frustino. Alcune di queste pratiche erano svolte in nome del “sesso magico” (ramo dell’occultismo che si fonda su riti sadomasochisti), una passione che secondo alcuni Hitler avrebbe condiviso con la bella Winifred Wagner, nuora del compositore Richard Wagner. Alcuni medici hanno poi testimoniato che il dittatore si faceva iniettare testosterone per aumentare la propria virilità.Nella foto la moglie del führer Eva Braun fa il bagno nuda. Foto: © Archivio GBB / CONTRASTO Adv Ammiratore di King Kong. Oltre alla pittura, Hitler apprezzava l’arte cinematografica. Disponeva di numerose sale di proiezione private, dove invitava spesso un altro appassionato di cinema, Joseph Goebbels. Ma quali erano i gusti del führer? L’attrice preferita era Greta Garbo, mentre l’attore che detestava di più (almeno pubblicamente, visto che in privato mostrò di apprezzarne le doti comiche) era Charlie Chaplin, che nel 1940 si era fatto beffe di lui nel film Il grande dittatore (nella foto). Pellicola del cuore era King Kong (1933). Il celebre scimmione rappresentava per Hitler un esempio di forza primordiale: da lui avrebbe preso a prestito il vezzo di battersi il pugno sul petto nei comizi. Foto: © Courtesy Everett Collection/Contrasto Occhiali? No, grazie. Hitler non aveva quella che si definisce una “vista d’aquila”. Per sopperire a questo limite fece costruire una speciale macchina da scrivere con cui veniva trascritto ogni documento a lui riservato. La caratteristica di tale apparecchio (che esisteva in un unico esemplare gelosamente custodito dalla Gestapo, la polizia politica del Terzo Reich) era di utilizzare caratteri tipografici molto più grandi di quelli soliti. Un accorgimento imposto dal fatto che il führer si rifiutava di indossare gli occhiali, giudicati segno di debolezza. Foto: © API/GAMMA RAPHO Fanatico dei dolci. A causa dello stato di salute precario e della sua ipocondria, Hitler intraprese numerose diete, durante le quali si privò dell’alcol e della carne (senza diventare mai del tutto vegetariano). Solo a una cosa non seppe mai dire di no: i dolci. Aveva una vera passione per il cioccolato e la panna. Inoltre zuccherava ogni tipo di bevanda, acqua e vino inclusi. Dal dentista. La golosità gli procurò ovvi problemi con i denti. Hitler però se la faceva sotto come un bambino di fronte al suo dentista, il fidato Johannes Blaschke. Questi raccontò in seguito che il führer aveva una soglia del dolore bassissima: “Moriva dalla paura alla sola idea di doversi sedere sulla mia sedia” riferì. Così, i denti guasti alla lunga provocarono a Hitler una perenne alitosi. Foto: © Courtesy Everett Collection/Contrasto Adv Un talento, ma per la pubblicità. A scuola Hitler era un vero somaro e persino i suoi scritti da adulto sono infarciti di errori di grammatica. Quanto alla sua carriera di pittore non decollò mai. La sua vena artistica riuscì però a brillare quando, a vent’anni, si cimentò con il mestiere di pubblicitario, a Vienna. Si trattava di dipingere cartelloni per reclamizzare prodotti di vario tipo, come le brillantine per capelli, o lucidi da scarpe, deodoranti e detersivi. Secondo alcuni storici fu anche così che perfezionò la conoscenza di quelle leggi della comunicazione e che gli saranno utili durante la presa del potere, quando il “prodotto” reclamizzato era il nazismo.Nella foto, il führer durante le Olimpiadi di Monaco del 1936. Negli stadi erano presenti le svastiche e in Germania erano già in vigore le leggi razziali (per questo gli ebrei non poterono partecipare). Foto: © adoc-photos / adoc-photos Approfondimenti 00:00 #accaddeoggi 14 ottobre 1944: muore Erwin Rommel 00:00 Curiosità Hitler ha mai ucciso qualcuno con le proprie mani? 00:00 Storia Che fine ha fatto il cane di Hitler? 18:00 Storia Quanti furono gli attentati alla vita di Hitler? Storia Gli ultimi misteriosi momenti del Führer 00:00 Curiosità Perché in Inghilterra c'è la Chiesa anglicana? Storia Che cos’era il diritto di bacio nell’antica Roma? Storia Giovanna d’Arco, la pulzella d'Orléans Storia Sono esistite Sultane donne? 20 febbraio 2025 Focus.it Tag cultura - curiosità - hitler - adolf hitler - vegetariani - vegetarianesimo - cibo - alimentazione'''
year_published = 2025
