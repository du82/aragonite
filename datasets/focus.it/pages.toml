["https://focus.it/talks/teresa-fornaro-che-cosa-stiamo-scoprendo-su-marte"]
title = "Teresa Fornaro | Che cosa stiamo scoprendo su Marte -  Focus.it"
description = "4 miliardi di anni fa, Marte ospitava ambienti abitabili. Le sue antiche rocce potrebbero rivelare tracce di vita microbica. Con Teresa Fornaro, INAF."
full_description = "Teresa Fornaro | Che cosa stiamo scoprendo su Marte 4 miliardi di anni fa, Marte ospitava ambienti abitabili. Le sue antiche rocce potrebbero rivelare tracce di vita microbica. Con Teresa Fornaro, INAF. Circa 4 miliardi di anni fa, Marte aveva condizioni simili alla Terra e molteplici ambienti abitabili, in grado, cioè, di supportare la vita. È possibile che si siano sviluppate forme di vita microbiche durante questa finestra temporale favorevole, prima che il pianeta si trasformasse nel deserto arido e gelido che conosciamo oggi, determinando potenzialmente l'estinzione di eventuali forme di vita marziane. Anche in questo caso, tuttavia, tracce della loro passata esistenza potrebbero essere rinvenute nelle rocce più antiche, tuttora preservate su Marte data l'assenza di una tettonica a placche. Lo studio delle rocce più antiche attraverso missioni di esplorazione robotica del pianeta rosso e il ritorno dei campioni da Marte, potrebbero finalmente rispondere a un interrogativo che l'uomo si pone da sempre: siamo soli nell'Universo? Con Teresa Fornaro, ricercatrice dell'Istituto Nazionale di Astrofisica (INAF) 14 gennaio 2025 Tag focus talks - focus live 2024 - focustalks - focus live - marte - spazio"
