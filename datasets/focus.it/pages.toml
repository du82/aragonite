["https://focus.it/comportamento/psicologia/le-relazioni-romantiche-contano-piu-per-gli-uomini-che-per-le-donne"]
title = "Le relazioni romantiche contano più per gli uomini che per le donne -  Focus.it"
description = "Gli uomini danno più importanza al rapporto con la partner: è l’unica relazione sulla quale possono contare per avere supporto emotivo. Ma questo non va bene, ecco perché..."
full_description = '''Psicologia Le relazioni romantiche contano più per gli uomini che per le donne Gli uomini danno più importanza al rapporto con la partner: è l'unica relazione sulla quale possono contare per avere supporto emotivo. Ma questo non va bene, ecco perché... Quando una storia finisce, gli uomini soffrono di più. simona pilolla 2 | Shutterstock Per gli uomini la relazione sentimentale conta più che per le donne: è la conclusione alla quale erano giunti diversi studi nel passato, e che viene confermata con nuove motivazioni da una ricerca pubblicata su Behavioral and Brain Sciences. Secondo quanto scoperto dai ricercatori, gli uomini tendono a ricavare dal rapporto maggiori benefici fisici e mentali rispetto alle donne: questo li motiva a cercare una compagna, e fa sì che tendano a non chiudere una relazione e a soffrire di più quando una storia finisce. «Gli uomini single sono normalmente meno felici rispetto alle donne single, sia nelle culture occidentali che in quelle orientali», spiega Elaine Hoan, esperta non coinvolta nella ricerca. Non fare la femminuccia! Lo studio, che ha analizzato oltre 50 ricerche condotte sul tema, ipotizza che il fatto che gli uomini contino così tanto sulla propria relazione sentimentale derivi dalla differente educazione emotiva avuta sin dall'infanzia. «Ai maschi si sconsiglia di mostrare la propria vulnerabilità», spiega Iris Wahring, coordinatrice dello studio. I genitori tendono a enfatizzare un linguaggio incentrato sulle emozioni più con le figlie femmine che con i maschi, che spesso – al contrario delle sorelle – vengono puniti quando si mostrano tristi. Comportamento Chi ha più potere nella coppia, tradisce più facilmente il partner Senza amici. Queste abitudini durante l'infanzia fanno crescere uomini più chiusi, che non cercano supporto da amici e famiglia e che, di conseguenza, vedono nella partner l'unico supporto emotivo. Le donne, al contrario, hanno una rete sociale più ampia, si sfogano con amici e familiari e, per questo, dipendono (emotivamente) meno dal proprio uomo. Comportamento Se il nostro partner piace, la relazione peggiora L'importanza delle (altre) relazioni. Secondo Mariko Visserman, psicologo non coinvolto nella ricerca, i risultati illustrano in modo chiaro quanto le norme di genere influiscano sullo sviluppo emotivo degli uomini e delle donne. Quel che è importante comprendere è che dobbiamo tutti, a prescindere dal nostro sesso, avere una rete di persone che ci supportano e investire in relazioni non solo romantiche, ma anche di amicizia – per non rimanere soli se qualcosa va storto con il nostro partner. Dobbiamo promuovere una cultura nella quale gli uomini vengano incoraggiati a instaurare rapporti di amicizia duraturi che offrano loro il giusto supporto emotivo, mettendo da parte una volta per tutte le classiche norme di genere che vorrebbero i maschi inscalfibili e mai fragili. 12 FOTO Fotogallery 12 cose in cui le donne sono diverse dagli uomini VAI ALLA GALLERY Fotogallery 12 cose in cui le donne sono diverse dagli uomini Che stress! Uomini e donne reagiscono allo stress in modo diverso, e i primi si abbandonano più facilmente alla bottiglia nelle situazioni che generano ansia. Secondo una ricerca, il glucosio presente nel sangue fornisce le energie necessarie ad affrontare i compiti stressanti. Ma esaurite queste "riserve" naturali, gli uomini non riescono a mantenere l'autocontrollo e si abbandonano all'alcol. Non accade altrettanto alle donne che sarebbero naturalmente meno inclini al bere. Leggi i dettagli della ricerca: Lo stress fa alzare il gomito agli uomini (ma non alle donne). Foto: © Shutterstock La bellezza è femmina. Il senso del bello è molto diverso tra uomini e donne. Così diverso che nei due sessi è associato all'attività cerebrale di due aree differenti. Lo confermano studi comportamentali, ma anche una ricerca sul cervello di un team internazionale di scienziati. La vista di opere d’arte, di paesaggi piacevoli e, più in generale, di “cose belle” attiva, in maschi e femmine, zone diverse del cervello: mentre nelle donne la vista di immagini "belle" attiva entrambe le aree parietali, nell’uomo accende solo il lato destro della corteccia. Questa differenza potrebbe essere una conseguenza dell’evoluzione e risale all’era in cui uomini e scimmie iniziarono a differenziarsi. Foto: © reuters Questione di cervello. La fisiologia cerebrale nei due sessi è diversa, in alcuni casi anche molto. E le cellule nervose femminili funzionano in maniera differente. Per esempio, nel cervello degli uomini il centro della parola si trova nell’emisfero sinistro, e quello dell’orientamento spaziale soprattutto nel destro. Nella donna questa separazione non esiste: anzi, gli emisferi sono collegati da un numero di cellule molto più alto. Forse per questo le donne hanno miglior memoria verbale (ricordano bene le parole lette in un elenco) e un eloquio più fluente (riescono a dire un gran numero di parole che cominciano con la stessa lettera). I maschi, invece, balbettano più facilmente (i balbuzienti sono quattro volte più numerosi nel sesso forte), ma già a 4 anni sono più bravi delle coetanee a immaginare un solido che ruota nello spazio. Leggi anche: Il cervello femminile è, a parità di età, di tre anni più giovane di quello maschile Foto: © reuters Adv Donne in carriera. Le donne sono meno collaborative degli uomini. Uno studio dell'università di Harvard pubblicato su Current Biology ha passato al setaccio le collaborazioni in 50 istituzioni del mondo accademico tra Usa e Canada. Risultato: donne e uomini sono ugualmente cooperativi con colleghi dello stesso sesso se si considerano le collaborazioni fra pari grado, ma quando entra in gioco il fattore gerarchia la proverbiale solidarietà femminile sembra vacillare rispetto a quella maschile. Vedo, sento, tocco. I cinque i sensi non funzionano nello stesso modo in uomini e donne. Olfatto: la capacità di distinguere e ricordare gli odori è più sviluppata nelle donne, a causa della conformazione del corpo calloso (struttura nervosa che unisce i due emisferi cerebrali).Vista: la memoria visiva è appannaggio femminile. Le donne ricordano meglio una fisionomia, la disposizione degli oggetti su un tavolo, e così via. Udito: sono invece gli uomini a concentrarsi di più, escludendo mentalmente ogni altro rumore che potrebbe disturbarli. E sentono meglio i toni acuti. Gusto: i maschi hanno in bocca meno recettori per il “salato” delle donne. Anche la percezione femminile dell’amaro è migliore. Tatto: nella manipolazione di oggetti sottili riescono meglio le donne. Non solo perché hanno dita sottili, ma perché le terminazioni tattili sono più sensibili (soprattutto a metà del ciclo mestruale). Io perdono, tu no. La capacità di perdonare è donna: gli uomini, in generale, hanno più difficoltà a scusare chi ha fatto loro un torto e si mostrano più vendicativi rispetto al gentil sesso. Questo atteggiamento sarebbe dovuto alla minore empatia dei maschi nei confronti del prossimo. La maggiore tolleranza delle donne dipende molto anche dal fatto che sono state abituate, fin dall'infanzia, a mettersi nei panni degli altri, sviluppando così una maggiore empatia. Ma quale sia il peso relativo dell'educazione rispetto alle caratteristiche innate è ancora tutto da valutare. Leggi anche: Le donne sono più altruiste degli uomini? Foto: © JGI/Jamie Grill/Blend Images/Corbis Adv A me gli occhi, please. Le donne prestano più attenzione agli sguardi e alle facce delle persone di quanto non facciano gli uomini. Le donne infatti si soffermano a guardare le facce per riconoscerle, soprattutto se sono familiari. Mentre per gli uomini non c’è questa differenza. Precedenti studi avevano messo in luce che le zone del cervello coinvolte nel riconoscimento delle facce, sono influenzate dagli ormoni. Ma ancora non è chiaro in che modo. Lo studio più approfondito di queste differenze potrebbe aiutare a capire alcuni disturbi gravi come l’autismo, che colpisce in maggioranza gli uomini. A ciascuno la sua fantasia. Secondo una ricerca spagnola, solo il 48% delle donne ricorre alle fantasie sessuali contro il 71% degli uomini. Secondo alcune teorie, questa differenza è da spiegare con ragioni evolutive: le fantasie tenevano i maschi più pronti a cogliere al volo le occasioni di accoppiamento. Dove siamo? Ci penso io! Ma perché gli uomini non chiedono mai le indicazioni stradali e le donne sì? Forse dipende dalla loro "memoria vettoriale".Quando si giunge in un luogo nuovo (per esempio una città) le donne tendono a usano di più i punti di riferimento incontrati lungo il cammino. Gli uomini impiegano invece una strategia chiamata “memoria vettoriale”: ricordano cioè la direzione in cui si è mosso il proprio corpo e per quanto tempo si sono spostati. Dovendo guidare, per esempio, fino alla nuova casa di un amico, una donna arriverà davanti al panettiere, qui girerà a destra, poi all’edicola a sinistra. Un uomo andrà diritto per cinque minuti, poi girerà a destra e proseguirà per altri tre minuti, prima di svoltare a sinistra. Le due strategie sono state verificate dai ricercatori dell’università di Rochester (Usa) chiedendo a studenti di entrambi i sessi di entrare in un labirinto. Quando il percorso era ricco di punti di riferimento le ragazze si dimostravano più abili dei loro compagni maschi a trovare l’uscita; ma se i ricercatori rendevano le pareti tutte uguali erano i ragazzi a orientarsi meglio. Adv Il rosa è femmina. Una ricerca dell’Università di Newcastle (Gran Bretagna), ha provato come mai le donne amano il colore rosa più degli uomini. Il fenomeno ha origini ancestrali: la sussistenza dei nostri antenati infatti si basava sulla caccia, affidata agli uomini, e la raccolta, di cui si occupavano le donne. Questo avrebbe sviluppato in loro una maggiore sensibilità per le tinte rossastre, proprie delle bacche e dei frutti maturi. L’azzurro, invece, piaceva perché segnalava la presenza di fonti di acqua e perché è il colore del cielo sereno. Donna al volante, pericolo costante? Macché! Per prudenza, responsabilità e sicurezza la donna ha un atteggiamento migliore nella guida rispetto all'uomo. Motivo? La maggiore quantità di estrogeni presenti nella donna che potrebbero influenzare positivamente l'attività neuronale dei lobi frontali, ovvero la zona preposta all'apprendimento delle regole, e al controllo dell'attenzione e dei riflessi. Il testosterone, invece, prevalente nell'organismo maschile, indurrebbe gli uomini alla guida a lasciarsi andare a comportamenti rischiosi, più impulsivi e quindi poco prudenti e alla conduzione del veicolo con un'andatura più veloce di quella delle donne. Quasi quasi scappo. Davanti a situazioni pericolose, gli uomini sono più propensi all’azione mentre le donne dedicano maggiore attenzione all'identificazione dei sentimenti suscitati dallo stimolo. Ovvero, le donna si lascia sopraffare dalle emozioni, l'uomo si prepara ad affrontare la situazione, o a darsela a gambe. Insomma, in caso di pericolo sono gli uomini i primi ad avere il "polso" della situazione. Leggi anche: La genialità è roba da maschi: parola di bambine Adv Approfondimenti Psicologia Non cerchiamo partner più attraenti di noi Scienze L'alcol ci fa sembrare gli altri più attraenti? Sessualità Dall'amicizia degli scimpanzé all'amore di coppia Psicologia Cos’è il ghosting (e perché fa male) Psicologia Relazione al capolinea? Si capisce da come parli Psicologia Felicità: uomini e donne la vivono in modo diverso Salute Salute: coppia più felice e sesso migliore se papà condivide cura figli Salute Ricerca: 2 cuori e una capanna ma solo per lei, lo studio Sessualità Orgasmo: perché per lei è più difficile? 28 febbraio 2025 Chiara Guzzonato Tag comportamento - psicologia - relazioni - uomini - donne - relazioni sentimentali - sentimenti - coppia - educazione emotiva - emotività'''
