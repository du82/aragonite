title = "Perché gli Alleati hanno bombardato l'Abbazia di Montecassino? -  Focus.it"
description = "Nel 1944 l'Abbazia di Montecassino fu rasa al suolo dal più imponente bombardamento della Storia contro un singolo edificio per un errore di traduzione."
full_description = '''Storia Perché gli Alleati hanno bombardato l'Abbazia di Montecassino? Per un malinteso Nel 1944 l'Abbazia di Montecassino fu rasa al suolo dal più imponente bombardamento della Storia contro un singolo edificio per un errore di traduzione. L'Abbazia di Montecassino subito dopo il bombardamento del 1944 da parte degli Alleati durante la Seconda guerra mondiale. Getty Images Il monastero di Montecassino, fondato da Benedetto da Norcia nel 529, è il più grande al mondo per dimensioni e il secondo più antico d'Italia dopo quello di Santa Scolastica (istituito sempre dal monaco benedettino intorno al 520). Il bombardamento alleato che, il 15 febbraio 1944, rase al suolo l'abbazia di Montecassino fu uno degli eventi più tragici della Seconda guerra mondiale, ma fu anche la conseguenza di un imperdonabile malinteso. Lost in translation. Si suppone infatti che la scellerata azione venne decisa per l'errata intercettazione radio di un messaggio tedesco. Il messaggio captato era Wo ist der Abt? Ist er noch in Kloster? ("Dov'è l'abate? È ancora nel monastero?") e la risposta fu Ja, im Kloster mit den Monchen. ("Sì, nel monastero con i monaci"). Ebbene, la parola tedesca Abt ("abate") fu intesa come l'abbreviazione di Abteilung, che significa "reparto militare", per cui gli Alleati credettero che i tedeschi fossero asserragliati all'interno del monastero. Cultura Quando gli Alleati presero Cassino, seguirono 50 ore di stupri Questione controversa. Non tutti gli storici concordano sulle esatte parole proferite, ma in ogni caso la parola Abt fu scambiata per "battaglione". Per cui, di fronte a questa "presenza" di truppe nemiche all'interno dell'abbazia, il comando angloamericano ne decise il bombardamento. Cultura 4 giugno 1944: Roma e la liberazione dai nazisti Oltre il danno... Il bombardamento ebbe inizio la mattina del 15 febbraio: 142 bombardieri pesanti e 114 bombardieri medi rasero al suolo l'abbazia. Morirono anche molti civili che avevano cercato rifugio dentro l'edificio. Il bombardamento non risultò essere solo un'operazione inutile, ma anche dannosa dal punto di vista della strategia militare perché consentì ai soldati tedeschi di trovare riparo tra le macerie e tenere a lungo quella posizione. 51 FOTO Fotogallery 40 foto storiche rare e importanti VAI ALLA GALLERY Fotogallery 40 foto storiche rare e importanti 1912 - Test di resistenza dei caschi da football americanoNon è chiaro chi sia l'inventore dei caschi per i giocatori di football americano, l'unica difesa contro i traumi cranici. Nel 1896 qualcuno iniziò a usare cinghie e auricolari per proteggere le orecchie. Nel 1900 i caschi vennero induriti con il cuoio e pian piano andarono a ricoprire tutto il capo. Negli anni '50 l'arrivo della plastica mandò in soffitta i caschi in cuoio che venivano testati anche con metodi che oggi potremmo definire poco scientifici. 1939 - L'ultima esecuzione pubblica con la ghigliottinaEugène Weidmann è stato l'ultimo criminale a essere stato giustiziato pubblicamente con la ghigliottina. Era il 17 giugno 1939. Era colpevole di vari rapimenti e omicidi.L'ultima esecuzione della pena capitale, sempre mediante ghigliottina ma in forma privata, risale al 10 settembre 1977. Nel 1981 la Francia ha abolito la pena di morte. 1955 - L'ufficio di Albert Einstein il giorno della sua morteAlbert Einstein morì in ospedale il 18 aprile 1955 di insufficienza cardiaca. Aveva 76 anni. Il suo funerale e la successiva cremazione avvennero in forma strettamente privata. Un solo fotografo riuscì a catturare gli eventi di quel giorno straordinario: Ralph Morse della rivista Life.Armato della sua macchina fotografica e di una casa di whisky - per aprire le porte e sciogliere le lingue - Morse raccontò l'addio al grande scienziato. Ma a parte questa famosa immagine dell'ufficio di Einstein, esattamente come l'aveva lasciato poche ore prima del decesso, le immagini di Morse non furono mai pubblicate. Su richiesta del figlio di Einstein e per rispetto della privacy, Life decise di non pubblicare il servizio di Morse e le sue foto rimasero per oltre 50 anni negli archivi della rivista. Foto: © Ralph Morse/Time & Life Pictures/Getty Images Adv 1907 - Annette Kellerman si batte per il diritto delle donne di poter vestire un costume da bagno intero, ma attillatoVenne arrestata per atti osceni. Anni '20 - Controllo costume da bagnoAll'epoca le donne con costumi troppo corti venivano multate. 1964 - Il primo monokiniL'invenzione del monokini (e del relativo nome) si deve allo stilista austriaco Rudi Gernreich. Il primo segno che i tempi (e il comune senso del pudore) erano cambiati arrivò nel immediato dopoguerra con l'introduzione del bikini.Il modello di Gernreich non ebbe molto successo, dato che le donne che praticavano il topless semplicemente non indossavano la parte di sopra del bikini. Ma la prima foto del nuovo costume, indossato dalla modella Peggy Moffitt, venne pubblicato il 3 giugno 1964 sul giornale Women's Wear Daily e fece scalpore. Foto: © William Claxton Adv 1936 - Jesse Owens sul podio del salto in lungo alle olimpiadi di BerlinoNell'estate del 1936 si celebrano le olimpiadi a Berlino. È l'occasione per Adolf Hitler e per la sua propaganda nazista per promuovere davanti alla Germania e al mondo la teoria della supremazia della razza ariana (e di conseguenza dell'inferiorità dei neri).È in questo contesto che Jesse Owens arriva a Berlino. Tornerà negli Stati Uniti con 4 medaglie d'oro (100, 200, salto in lungo e staffetta 4x100), 2 record mondiali e uno olimpico. Hitler reagì allo smacco sostenendo che gli afroamericani erano un popolo primitivo e pertanto avevano una costituzione fisica più robusta e più adatta alla corsa. 1961 - Gli impiegati di Disneyland in mensa«Ho sempre cercato di immaginare un posto dove portare le mie due figlie, un posto però dove potevo divertirmi anch’io!» aveva detto lo stesso Walt Disney all’apertura dell’impianto, 6 anni prima. 1922 - Il sigillo intatto della tomba di TutankhamonA differenza di quelle di quasi tutti gli altri faraoni, la tomba di Tutankhamon fu ritrovata intatta dal suo scopritore, l’inglese Howard Carter, il 4 novembre 1922. Fu una scoperta straordinaria, resa possibile dalla tenacia di Carter, che continuò a setacciare la Valle dei Re quando ormai si pensava non ci fosse più nulla da scovare. Invece saltò fuori quella tomba inviolata colma di tesori mai visti prima, con uno splendido sarcofago dorato che racchiudeva la mummia intatta di un giovane re. La camera funeraria della tomba KV62 (quella di Tutankhamon) fu aperta alla presenza tra gli altri della regina del Belgio, ospite d’onore, nel febbraio 1923, tre mesi dopo il ritrovamento. Alla mummia, però, si sarebbe arrivati solo nel novembre del 1925. Prima fu necessario misurare, fotografare, catalogare e consolidare una stanza dopo l’altra (in tutto quattro). Adv 1990 - Una donna di 106 a guardia di casaSiamo nel villaggio di Degh, vicino alla città di Goris, nell'Armenia meridionale, una zona contesta con l'Azerbaijan. Era il 1 gennaio 1990 e la donna stava difendendo la sua abitazione. Foto: © Armineh Johannes/UN Photo 1903 - La foto segnaletica di Benito MussoliniAll'età di 20 anni Benito Mussolini venne arrestato dalla polizia svizzera per aver promosso e partecipato a un violento sciopero generale. Secondo alcune fonti Mussolini fu invece arrestato perché sprovvisto di documento d'identità. Ad ogni modo, il cartello riporta l'erronea dicitura Mussolini Benedetto. 1967 - La mattina del giorno in cui la Svezia cambiò la guida da sinistra a destraAlle 5 del mattino del 3 settembre 1967 scattò il Dagen H (il Giorno H, in italiano). La H sta per Högertrafik, che in svedese significa "circolazione a destra". Quel giorno la circolazione stradale passò dalla guida a sinistra alla guida a destra, non senza incidenti, polemiche e disguidi. Alla fine si contarono 125 incidenti (pochi considerato tutto). Come scrisse Time nel Dagen H fu vietato tutto il traffico non essenziale fino alle 6 del mattino. Ogni veicolo in circolazione alle 4:45 si doveva fermare e, dopo aver aspettato 5 minuti, doveva spostarsi sulla destra e fermarsi di nuovo prima di procedere alle 5. In alcune città il divieto di circolazione fu più lungo per permettere agli operai di riconfigurare gli incroci stradali. Adv Nikola Tesla in laboratorioUna foto pubblicitaria di Tesla seduto nella stazione sperimentale di Colorado Springs con il suo trasmettitore d'amplificazione. Gli archi sono lunghi circa 7 metri. 1966 - Il più grande ko della storiaÈ una delle più belle foto di sport della storia quella scattata da Neil Leifer a 24 metri d'altezza sul ring dello Houston Astrodome. Ritrae il momento in cui Cleveland Williams finisce al tappeto durante l'incontro con Muhammad Ali per il titolo mondiale dei pesi massimi. Foto: © Neil Leifer 1912 - L'ultima foto del Titanic (a galla)Il naufragio del 1912 è circondato da molte dicerie, come quella dei musicisti che suonarono fino alla fine. Che non è una leggenda. Più di un superstite la confermò ai giornali nei giorni successivi. L’orchestra si fermò solo quando i flutti cominciarono a inghiottire la nave. Adv 1969 - La folla al concerto di WoodstockIl festival di Woodstock si svolse a Bethel, una piccola città nello stato di New York, dal 15 al 18 agosto 1969. Fu una "3 giorni di pace e musica" che raccolse circa 400.000 spettatori. 1936 - Un uomo si rifiuta di fare il saluto nazistaDurante il varo di una nave da guerra, alla presenza di Adolf Hitler, c'è un solo uomo che non saluta, che non grida Sieg Heil. Si chiamava August Landmesser e questa è la sua storia.Landmesser si era iscritto al partito nazista nel 1931, più per trovare un lavoro che per passione politica. Nel 1934 conobbe e si sposò con Irma Eckler, una donna ebrea. Il suo amore gli costò l'espulsione dal partito, l'anno successivo, e il campo di concentramento, nel 1938, dopo vari tentativi di fuga all'estero e diversi processi. La moglie morì in un campo di concentramento nel 1942; lui dopo due anni di lavori forzati fu arruolato di forza in un battaglione di disciplina e morì, disperso, in Croazia. Foto: © Die Zeit 1988 - Le tombe di una donna cattolica e del marito, protestante, divise da un muro. Siamo in Olanda Adv 1946 - La gioia di un orfano austriacoWerfel, un bambino di 6 anni ospite di un orfanotrofio in Austria, gioisce per il regalo di un paio di scarpe arrivate dalla Croce Rossa americana. La foto di Gerald Waller venne pubblicata su Life Magazine. 1932 - Manutenzione della Tour Eiffel Nel 1889, alla sua terza esposizione universale, la Francia stupisce il mondo inaugurando la Torre Eiffel, che diventerà il monumento simbolo di Parigi e il sito a pagamento più visitato al mondo (ancora oggi). Le invenzioni che dobbiamo agli expo 1912 - Arriva la notizia del disastro del TitanicUno strillone per le strade di Londra il 16 aprile 1912 annuncia che il Titanic era affondato la notte prima.La storia del Titanic è diventata un emblema di tutti gli epic fails. Durante il viaggio transatlantico inaugurale, sulla rotta Southampton- New York, nella notte tra il 14 e il 15 aprile del 1912 la nave colpì un iceberg. L’impatto aprì diverse falle lungo la fiancata destra e i compartimenti stagni (che avrebbero dovuto garantire l’inaffondabilità) si allagarono uno dopo l’altro. Finché, alle 2:20, il Titanic si spezzò in due tronconi e affondò, provocando la morte di più di 1.500 passeggeri sugli oltre 2.200 che si erano imbarcati in Inghilterra. Foto: © Hulton-Deutsch Collection/Corbis Adv 1939 - Albert Einstein al mareUna rara immagine di Einstein durante un soggiorno di riposo a Long Island (New York), nell'estate del 1939. 1937 - Gabbia prendisole per bambiniCostruita nel 1937 e distribuita a Londra ai membri del Chelsea Baby Club, la gabbia da appendere alla finestra era pensata per le famiglie con bambini, ma senza un cortile o un giardino dove farli stare all'aria aperta e al sole. Foto: © Getty Images Adv 1967 - Il bacio della vitaLa foto di Rocco Morabito è intitolata il bacio della vita per un semplice motivo: non è un bacio, come sembra, ma la respirazione bocca a bocca. Uno dei due operai aveva appena perso conoscenza dopo essere stato folgorato da una scossa elettrica durante i lavori su una linea a basso voltaggio. Il suo collega lo ha raggiunto velocemente per rianimarlo. Manovra perfettamente riuscita: il malcapitato è sopravvissuto. Foto: © Rocco Morabito 1967 - I giudici di gara cercano di impedire a Kathrine Switzer di correre la maratona di BostonKathrine Switzer è stata la prima donna a correre la maratona di Boston grazie a uno stratagemma. La reazione degli organizzatori, che cercarono di strattonarla fuori dalla pista, suscitò un movimento di opinione che portò all'apertura della maratona alle donne nel 1972. 1959 - A scuola in carrucolaUn gruppo di bambini con grembiuli e cartelle attraversa il fiume Panaro a Guiglia, vicino a Modena, per recarsi a scuola. Sono gli abitanti di due frazioni, Barletta e Castellino, che per andare a scuola devono attraversare il Panaro scorrendo lungo una corda d'acciaio tesa sul fiume.Guarda anche il filmato tratto da un cinegiornale dell'epoca. Adv 1911 - Una grotta di ghiaccio su un IcebergLa foto venne scattata su un iceberg il 5 gennaio 1911, durante una spedizione inglese nell'Antartide. 1958 - Audrey Hepburn fa la spesa con Ip, il cucciolo di cervo che l'attrice teneva in casaGuarda anche i più strani animali domestici. 1905 - L'arrivo del primo carico di banane in Norvegia Adv 1965 - Salvador Dali fa il baciamano a Raquel Welch dopo averne completato il famoso ritratto astratto 1940 - Londra, una bambina siede con la sua bambola sui resti della sua casa bombardata dai nazisti 1918 - Donne trasportano ghiaccio Adv 1944 - Georges Blind, membro della resistenza francese, sorride davanti al plotone di esecuzione 1945 - La prima bomba atomicaSi chiamava The Gadget e venne fatta esplodere alle 05:29:21 del 16 luglio 1945 su una rampa alta 30 metri posta nel deserto del New Mexico. Fu il primo ordigno nucleare a esplodere e provocò un cratere di materiale vetrificato profondo 3 metri e largo 340 metri. Le montagne vicine vennero illuminate a giorno per 2 secondi e investite da un calore devastante; l'onda d'urto fu registrata a 160 km di distanza mentre il fungo atomico raggiunse i 12 km di altezza. In seguito al successo del test vennero preparate 2 bombe. la prima fu sganciata su Hiroshima il 6 agosto; la seconda, con lo stesso meccanismo di questa bomba, rase al suolo Nagasaki il 9 agosto. Le due esplosioni provocarono almeno 148.000 morti immediate e un totale di 340.000 decessi. 1940 - Aspettami papàUna foto storica di Claude Dettloff: l'ultimo saluto di bambino al proprio papà, arruolato tra le truppe canadesi in partenza per l'Europa. Era il 1 ottobre 1940. Adv 1914 - Operai sul ponte di Brooklyn 1950 - La Coca Cola arriva in Francia 1958 - Elvis nell'esercito Adv 1896 - Tre corridore della prima maratona'''
