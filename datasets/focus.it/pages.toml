title = "12 cose che (forse) non sai sulle posizioni sessuali -  Focus.it"
description = "Perch&eacute; la posizione del missionario si chiama cos&igrave;? Come la definisce Shakespeare? Cosa c'entra la matematica col Kamasutra? Qual &egrave; la posizione pi&ugrave; comoda se hai mal di schiena?"
full_description = '''Sessualità 12 cose che (forse) non sai sulle posizioni sessuali 12 FOTO Sfoglia la gallery Perché la posizione del missionario si chiama così? Come la definisce Shakespeare? Cosa c'entra la matematica con il Kamasutra? Qual è la posizione più comoda se hai mal di schiena? Guarda la gallery 11 aprile 2024 Eugenio Spagnuolo Tag comportamento - sessualità - sesso - posizioni sessuali - kama sutra - vita sessuale - vita di coppia - coppie - accoppiamento - kamasutra Contenuti correlati Arte Che cos'è il Kama sutra 8 FOTO Salute Sesso e mal di schiena: le posizioni 7 FOTO Sessualità Sesso: che cosa è "normale"? 11 FOTO Sessualità Che cosa insegnano i classici del sesso Fotogallery 12 cose che forse non sai sulle posizioni sessuali Perché la posizione del missionario si chiama così? Secondo l’antropologo Bronislaw Malinowski (1884- 1942), questa posizione sessuale fu chiamata così nel 1700 dagli aborigeni dell’isola Trobriand, nella Melanesia occidentale, a est nella Nuova Guinea. Era infatti la posizione praticata dai missionari che, sbarcati nell’arcipelago per convertire gli indigeni, si prendevano... qualche libertà con le loro fanciulle. I locali guardavano questo modo di accoppiarsi con curiosità e stupore perché originale e diverso da quello in uso (donna accovacciata davanti, uomo dietro), ispirato agli animali. Secondo un’altra versione, questa posizione fu imposta dai missionari (i quali non “praticavano”) agli indigeni per motivi di ordine religioso: la posizione “faccia a faccia” sarebbe stata ritenuta l’unica adatta ai rapporti tra membri del genere umano, in grado di rafforzare la monogamia, e anche la migliore per la fecondazione. Foto: © Shutterstock Shakespeare e la bestia a due schiene. La posizione del missionario (lui sopra, lei sotto nella variante eterosessuale) ha molti nomi tra cui la “matrimoniale” e la “english-american”. Shakespeare nell’Otello la indica metaforicamente come “la bestia con due schiene”. È la posizione più praticata nel mondo, sebbene gli Zulu la giudichino volgare e sconveniente, mentre per i Santal e gli abitanti di Bali sia goffa e poco pratica. Quante ce ne sono? Secondo lo scienziato inglese Alex Comfort (1920-2000), autore di La gioia del sesso, libro che ebbe un ruolo importante nella rivoluzione sessuale, le posizioni sessuali possibili sono più di 600. Anche se, come ammise in seguito: «spesso le coppie cominciano col provarle tutte, ma quasi inevitabilmente finiscono con l'usarne sempre una o due, ricorrendo ai manuali solo in occasioni speciali». Adv Che cos'è il Kamasutra? Tutti ne hanno sentito parlare, ma pochi ne conoscono il significato. Confuso spesso con un manualetto erotico, il Kamasutra (letteralmente, “Massime sull’amore”) è considerato di solito un compendio di posizioni per fare sesso. In realtà è uno dei testi più importanti della poesia sanscrita, anche se non l’unico. Nell'immagine, sculture erotiche tratte dal Kamasutra scolpite sulle pareti del tempo Khajuraho, a Madhya Pradesh in India. La regola dell'8. Scritto tra il I e il VI secolo da un certo Vatsyayana, elabora e riunisce opere diverse, tramandate oralmente. Contiene le descrizioni di 64 posizioni sessuali, conosciute come le 64 arti. Vatsyayana, credeva che ci fossero 8 modi di fare l'amore, moltiplicati per 8 posizioni per ciascuno di questi, per un totale di 64. Il testo descrivere il fare l'amore come una “unione divina”. Ma come detto, soltanto il 20% del libro parla di posizioni, anche se è divenuto famoso proprio per questo. Kamasutra catalano. Cercare nuove posizioni sessuali non è una mania recente e neppure orientale. Anche nel Medioevo c’era curiosità a proposito. Speculum al foder è un testo catalano del XV secolo dedicato proprio alle posizioni sessuali. A volte tradotto come “Lo specchio di Coitus” è più un manuale di corteggiamento e di igiene, ma descrive (a parole, niente disegni, come si vede nell'immagine) l'arte delle posizioni sessuali come farà poi nel Rinascimento De omnibus Veneris noto anche come "I modi" o “Le 16 posizioni” dell’incisore Marcantonio Raimondi, che a sua volta si era ispirato a una serie di dipinti erotici di Giulio Romano. Adv Posizioni antiche. Ancora prima le posizioni sessuali erano state materia del trattato della greca Elefantide nel V secolo: Varias Concubitis Genera, che illustrava nove posizioni del coito e che era una delle letture preferite dell’imperatore Tiberio, che secondo Svetonio apprezzava l’arte erotica al punto da avere esposto in camera da letto un dipinto che rappresentava Atalanta e Meneagro impegnati in un… rapporto orale. Vade retro. La posizione da dietro (alla “pecorina” o doggy style per gli anglosassoni) ha anche un nome latino: coitus more ferarum, coito come le fiere. Nel Kama sutra invece è nota come: “l’unione della mucca”. Secondo una ricerca dell’Università di Waterloo (Canada) è la migliore per chi soffre di mal di schiena, a patto di fare forza sulle anche. Sperimentare fa bene. Una coppia dovrebbe sempre sperimentare nuove posizioni. Secondo gli psicologi della Chapman University sarebbe segno di vitalità e soddisfazione. In particolare, hanno scoperto che gli uomini e le donne sessualmente soddisfatti si impegnano in comportamenti più intimi, come coccole e baci profondi e ridono insieme durante l'attività sessuale; incorporano più atti di varietà sessuale come provare nuove posizioni sessuali o fantasie; e apprezzano atmosfere romantiche o sensuali, a base di candele e musica. E non hanno paura di dire “ti amo” durante il rapporto sessuale. Adv Quali posizioni erano considerate lecite nel Medioevo? L’unica realmente tollerata era quella del missionario (termine di origine incerta che allude alla classica posizione uomo sopra, donna sotto), mentre tutte le altre venivano a vario titolo bollate come immorali e illecite dalla Chiesa. Altre posizioni sconsigliate erano quelle che prevedevano la donna in posizione dominante, ovvero sopra all’uomo, oppure quelle in cui veniva presa da tergo, senza che potesse scambiare sguardi amorevoli con il partner. Questi modi di fare l’amore erano considerati animaleschi. Leggi anche: 11 cose che (forse) non sai sul sesso nel Medioevo Esiste un Kamasutra delle scimmie? In un certo senso sì. Diversi studi sul comportamento sessuale dei primati (tra cui quello condotto dallo zoologo J. P. Hanby) rivelano infatti che alcuni praticano una sorta di Kama sutra. In pratica, durante l’accoppiamento non ricorrono esclusivamente alla posizione più “classica”, quella in cui la femmina resta ferma, in segnale di invito, ed il maschio la monta “da tergo”. In particolare, gibboni siamango e gorilla in cattività praticano anche la posizione “del missionario”, come anche i bonobo (vedi foto). E dei macachi giapponesi sono state documentate ben otto diverse modalità di accoppiamento: quella in cui il maschio, in piedi, monta la femmina da dietro; oppure si aggrappa alle sue gambe; la morde; si accovaccia sul dorso; si sdraia sul dorso; o, in alternativa, di lato; alla “missionaria”; seduti di fronte. Papiri erotici. Non sono noti manuali sessuali dell'antico Egitto. Ma esistono vari papiri dedicati al sesso. Il più noto è il Papiro Erotico databile attorno al 1150 a.C. (XX dinastia) e oggi conservato nel Museo Egizio di Torino. In esso sono raffigurati un uomo e una donna che, aggrovigliati in posizioni sessuali al limite dell’acrobatico, svelano dettagli piccanti sulle abitudini dell’antico popolo egizio in camera da letto. Leggi anche: il sesso al tempo dei faraoni Adv Approfondimenti Storia Casta e pura: la storia della verginità Sessualità Perché si dice scopare? Animali Anche gli animali lo fanno strano (il sesso, ovviamente) Sessualità Sesso e mal di schiena: un aiuto dalla scienza Storia La storia della prostituzione 7 FOTO Mistero 7 cose che (forse) non sai su Halloween 8 FOTO Scienze Come nasce il latte di soia 4 FOTO Scienze Una firma famosa'''
