["https://focus.it/cultura/storia/e-morto-il-campione-di-scacchi-boris-spassky-protagonista-dell-incontro-del-secolo"]
title = "È morto il campione di scacchi Boris Spassky -  Focus.it"
description = "Nel 1972, in piena Guerra Fredda, il campione mondiale sovietico Boris Spassky perse a scacchi contro lo statunitense Bobby Fischer: quando la guerra si vinceva anche su una scacchiera."
full_description = '''Storia È morto il campione di scacchi Boris Spassky: protagonista dell'incontro del secolo Nel 1972, in piena Guerra Fredda, il campione mondiale sovietico Boris Spassky perse a scacchi contro lo statunitense Bobby Fischer: quando la guerra si vinceva anche su una scacchiera. Boris Spassky (1937-2025) nel febbraio 1969. Spasskij è stato campione del mondo dal 1969 al 1972. Prima di questa data, aveva giocato con Fischer cinque volte e non aveva mai perso. Wikimedia Commons "Pronto? Qui è il peggior giocatore di scacchi del mondo che vuole parlare con il migliore". Introducendo così la sua telefonata, nel 1972, il segretario di Stato americano Henry Kissinger convinse il connazionale Bobby Fischer ad affrontare il campione del mondo in carica, il russo Boris Spasskij, al campionato mondiale in corso a Reykjavik, in Islanda. A motivare la chiamata non era stato l'interesse agonistico: Kissinger non sottovalutava il ruolo che poteva giocare un'eventuale vittoria di Fischer sullo "scacchiere" della Guerra fredda. Guerra sul tavolo da gioco. La guerra su un tavolo. Il confronto tra pezzi bianchi e neri simboleggiava infatti una più generale contrapposizione tra presupposti ideologici, modelli economici, obiettivi militari. "Gli scacchi sono la guerra su un tavolo da gioco" dichiarò lo stesso Fischer: "lo scopo è distruggere la forza mentale dell'avversario". E il suo atteggiamento sembrò dimostrarlo: Bobby Fischer non si presentò alla cerimonia di apertura, perse la prima partita, diede forfait nella seconda e pareva non volesse affrontare la terza. Pretese di cambiare le sedie, la scacchiera, le luci e di bandire le telecamere per giocare in una stanza chiusa al pubblico. Scienza Lo sbarco sulla Luna avrebbe potuto essere una missione congiunta USA-URSS iNCONTRO salvatO IN Extremis. Alla fine giocò solo per due motivi: il raddoppio del premio in palio (da 125 a 250 mila dollari) e la telefonata di Kissinger. Fischer vinse con un match che lo storico degli scacchi Daniel Johnson ha definito "il supremo capolavoro della guerra fredda" per "il purismo astratto, l'incipiente paranoia, l'omicidio sublimato". L'hobby di Marx. La vittoria fu epocale, in una disciplina in cui la Russia deteneva la supremazia fin dal 1948, quando Michail Botvinnik conquistò il titolo di campione del mondo. Già Marx, Trotzkij e Lenin avevano amato quel gioco che eliminava le distinzioni di classe e richiedeva ragionamenti logici. Perciò, dagli Anni '20, con il motto "Diamo gli scacchi ai lavoratori" nell'Urss furono formati migliaia di campioni. Fino agli Anni '60, i migliori ebbero un ricco mensile e il permesso di uscire dal Paese per disputare i tornei. Cultura Bruno Pontecorvo: un italiano esule volontario nella cittadella sovietica dell'atomica Ebrei campioni. Gli Usa subirono sistematicamente le sconfitte del secondo dopoguerra, nonostante avessero accolto molti maestri ebrei scappati dall'Europa. Si calcola, infatti, che almeno la metà dei giocatori testa di serie del XX secolo fosse di origine ebraica. Perché? Il motivo non è chiaro. Forse gli ebrei hanno una "mente scacchistica", un mix di memoria, logica e immaginazione che si ritrovano nella loro cultura. Fatto sta che, tra i campioni di origine ebraica, ci sono stati lo stesso Bobby Fischer, Michail Botvinnik e Garry Kasparov. Quest'ultimo diventò campione del mondo nel 1985, e nel 1996 accettò la sfida contro Deep Blue, un supercomputer della Ibm. Cultura Come funzionava “Colossus”, il supercomputer che spiava (e sconfisse) i nazisti Simulazioni. Era stata proprio la Guerra fredda a stimolare, alla fine degli Anni '40, lo sviluppo di programmi al computer per il gioco degli scacchi, legati agli studi di matematici come Alan Turing e Claude Shannon. Le due superpotenze avevano poi usato la "teoria dei giochi", alla base di questi programmi, per simulare i conflitti nucleari, e negli Anni '70 la superiorità occidentale nel settore era emersa con chiarezza. Negli Anni '90, a Guerra fredda ormai conclusa, i computer erano diventati così potenti da poter sfidare i grandi campioni come Kasparov. Quest'ultimo vinse il primo incontro contro Deep Blue. Ma nel 1997 il match fu ripetuto contro una versione migliorata dello stesso calcolatore. E, questa volta, a vincere fu il computer. 28 febbraio 2025 Focus.it Tag cultura - storia - scacchi - guerra fredda - usa - urss - russia - unione sovietica - Henry Kissinger - casa bianca'''
year_published = 2025
