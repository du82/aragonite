title = "I cani comunicano (anche) battendo gli occhi -  Focus.it"
description = "Battere gli occhi è un segnale importante (e contagioso) nella comunicazione tra cani, ma viene usato anche con gli umani. Indica intenzioni non aggressive."
full_description = '''Animali I cani comunicano (anche) battendo gli occhi Battere gli occhi è un segnale importante (e contagioso) nella comunicazione tra cani, ma viene usato anche con gli umani. Indica intenzioni non aggressive. Cosa significa quando un cane sbatte gli occhi? Vinicius Florio / Shutterstock Avete mai fatto caso a quando, e quanto spesso, il vostro cane sbatte gli occhi? Probabilmente no, o avete sempre pensato che fosse solo un modo per tenere puliti i bulbi oculari. Un nuovo studio dell'Università di Parma, però, suggerisce che questo gesto abbia una valenza importante nella comunicazione tra cani, e anche in quella tra cani e umani: battere gli occhi non è solo un gesto istintivo, ma significa qualcosa. Per provare a capire cosa, il team parmense ha organizzato un esperimento, i cui risultati sono pubblicati su Royal Society Open Science, e che è solo un primo passo verso la comprensione di questo gesto. Ambiente Il tuo cane è intelligente? Serata al cinema con il cane. L'esperimento in questione ha coinvolto 54 cani e relativi umani, che sono stati messi di fronte a uno schermo a guardare una serie di film. Non di quelli che vanno al cinema: si trattava di tre diversi video, nei quali altrettanti cani di età differenti sbattevano gli occhi, si leccavano la faccia oppure fissavano la camera senza muoversi. Sappiamo che un cane che si lecca il naso è in attesa di qualcosa, oppure sta esprimendo frustrazione – due sentimenti non così distanti, se pensate a un animale in attesa del cibo. Un cane che ti fissa senza chiudere gli occhi, invece, sta tenendo d'occhio la situazione. E per quanto riguarda battere le palpebre? Ambiente Quanto ti vuole bene il tuo cane? Perché sbattere gli occhi? Gli esperimenti hanno dimostrato che un cane che vede un altro cane sbattere gli occhi farà altrettanto, con una frequenza decisamente superiore a quella dimostrata di fronte agli altri due comportamenti. Lo studio paragona questa reazione a quella che molti animali (compresi noi umani) hanno di fronte a uno sbadiglio: anche sbattere le palpebre, insomma, è contagioso, e d'altra parte succede lo stesso a noi umani (ci sono studi che dimostrano che durante una conversazione tendiamo a sincronizzare il reciproco battito di ciglia). Scienza 8 curiosità sullo sbadiglio (e i suoi misteri) Da approfondire. Rimane quindi una domanda: qual è il significato di questo gesto per i cani? Solitamente, sbattere le palpebre è considerato un modo per esprimere intenzioni non aggressive, e il fatto che sia contagioso potrebbe servire a facilitare i legami tra conspecifici, e anche con noi umani. Non ne siamo comunque ancora sicuri: quello che possiamo dire per ora è che quel gesto ha un significato preciso (oppure più di uno), ma serviranno ulteriori studi per identificarlo. 9 FOTO Fotogallery 100 anni di evoluzione dei cani VAI ALLA GALLERY Fotogallery 100 anni di evoluzione dei cani Il Saluki (levriero persiano) è probabilmente la più antica fra le razze canine conosciute: è stata selezionata nella "Mezzaluna fertile" (Medio Oriente) quasi 7.000 anni fa. Dall'inizio dell'amicizia tra uomo e cane, circa 100 mila anni fa, gli spostamenti dell'uomo in diverse regioni del mondo hanno fatto sì che si arrivasse a 400 razze canine differenti. Ma come si sono evolute alcune razze rispetto a com'erano 100 anni fa? Vediamo. Foto: © Shutterstock Ai primi del Novecento, qualcuno ha contato 167 razze canine. Ma come sono cambiate nel tempo? Il blog Science and Dogs ha provato a confrontare le foto di oggi con quelle apparse 100 anni fa nel libro "Dogs of all nations" (1915). L'accostamento delle foto dimostra come gli incroci e la selezione ha plasmato e trasformato alcune razze. Il Basset Hound ieri e oggi. Il Basset Hound è una razza creata in Francia e poi importata in Inghilterra nel 1800 e poi nuovamente sviluppata negli Usa. Oggi appare più basso rispetto al passato e anche le orecchie sembrano più grandi. Adv Il Bull Terrier ieri e oggi. È la raz