["https://focus.it/scienza/spazio/primo-pezzo-metallico-stampato-3D-spazio-tornato-terra"]
title = "Il primo pezzo metallico stampato in 3D nello spazio è tornato sulla Terra -  Focus.it"
description = "Per la prima volta un componente metallico stampato in 3D in orbita è tornato sulla Terra per essere analizzato. Ecco a cosa... servirà."
full_description = '''Spazio Il primo pezzo metallico stampato in 3D nello spazio è tornato sulla Terra Per la prima volta un componente metallico stampato in 3D in orbita è tornato sulla Terra per essere analizzato. Ecco a cosa... servirà. Un dettaglio del primo componente in metallo, ottenuto da stampa 3D nello spazio. ESA-R. Moorkens O'Reilly Un traguardo storico per la stampa 3D nello spazio: il primo componente metallico mai realizzato in orbita è rientrato sulla Terra. Il campione è stato prodotto dalla stampante 3D per metalli dell'ESA a bordo della Stazione Spaziale Internazionale (ISS) e ora si trova nei laboratori dell'ESTEC, il centro tecnico dell'ESA nei Paesi Bassi. La stampante, sviluppata da Airbus e altre aziende, è stata installata nel modulo Columbus dall'astronauta ESA Andreas Mogensen durante la missione Huginn nel gennaio 2024. A giugno ha realizzato la sua prima stampa, una linea curva a forma di 'S'. In estate ha prodotto il primo vero campione e un secondo esemplare a dicembre. Dopo la plastica, il metallo Ora il primo campione sarà analizzato nel Laboratorio dei Materiali e Componenti Elettrici dell'ESTEC e confrontato con stampe realizzate sulla Terra per studiare gli effetti della microgravità sul processo di stampa. Il secondo campione sarà consegnato all'Università Tecnica della Danimarca (DTU). Sebbene in passato sulla ISS siano stati usati stampanti 3D per materiali plastici, questa è la prima volta che si è riusciti a stampare metallo nello spazio. La produzione diretta di pezzi in orbita sarà essenziale per le future missioni di esplorazione spaziale, riducendo la dipendenza da costose spedizioni di rifornimento e permettendo agli astronauti di fabbricare componenti, strumenti e pezzi di ricambio su richiesta. 10 FOTO Fotogallery 10 progressi medici che dobbiamo agli astronauti VAI ALLA GALLERY Fotogallery 10 progressi medici che dobbiamo agli astronauti Gli esperimenti scientifici condotti sulla ISS hanno confini molto più ampi di quelli della piccola base in orbita attorno al Pianeta. Le scoperte e la tecnologia sviluppate nella stazione a 400 km di quota sono già serviti a migliorare la nostra vita di pazienti terrestri. Ecco 10 piccole grandi migliorie mediche che dobbiamo alla ricerca spaziale. Interventi oculari più precisi. In assenza di gravità, i movimenti oculari e la percezione del moto cambiano: gli stessi sistemi di eye-tracking sviluppati per monitorare lo sguardo degli astronauti sono usati, sulla Terra, per posizionare correttamente i laser negli interventi di chirurgia oculare e compensare i movimenti dell'occhio dei pazienti. Foto: © NASA Il braccio robotico per interventi al cervello. Gli arti meccanici in uso prima sullo Space Shuttle e poi sulla ISS, il Canadarm 1 e il Canadarm 2 (ma anche Dextre, il robot meccanico spaziale installato all'esterno della base spaziale) sono serviti da ispirazione per mettere a punto neuroArm, il primo braccio robotico capace di intervenire sui tumori cerebrali direttamente dall'interno della macchina per risonanza magnetica. Questo robot chirurgo, preciso e con il vantaggio di poter intervenire "in diretta" sulle immagini che vede, ha già salvato la vita a diversi pazienti altrimenti non operabili. Monitoraggio di pazienti asmatici. Il monossido di azoto è un comune gas inquinante sulla Terra, ed è rilevato anche all'interno della ISS. Quando una persona ha le vie respiratorie infiammate, nell'aria esalata sono visibili maggiori concentrazioni di questo gas. L'ESA ha sviluppato un dispositivo per monitorare le concentrazioni di monossido d'azoto nel fiato degli astronauti, e intervenire con farmaci prima che eventuali infiammazioni possano diffondersi. La stessa tecnologia è ora utilizzata, sulla Terra, per controllare la salute dei pazienti asmatici durante alcune terapie. Nella foto, l'astronauta britannico Tim Peake sperimenta il sistema di monitoraggio del respiro del Karolinska Institutet durante la missione Principia, sulla ISS nel 2016. Foto: © NASA/ESA Adv L'apparecchio invisibile. La ceramica policristallina che scompare - è dello stesso colore dei denti - resistente e ad alta tenuta, è ora tra i materiali più ampiamente utilizzati nell'ortodonzia. Inizialmente, però, era stata sviluppata per essere utilizzata nell'ingegneria aerospaziale e per la difesa militare. Altre tecnologie nate dalla ricerca spaziale Foto: © Shutterstock Ossa più forti. I programmi messi in campo per contrastare la perdita di densità ossea cui inevitabilmente vanno incontro gli astronauti in missione stanno aiutando, sulla Terra, i pazienti affetti da osteoporosi. Sulla ISS, la fragilità ossea si combatte con sessioni di allenamento serrato (nella foto) e dosi settimanali di bifosfonati, farmaci che inibiscono l'azione degli osteoclasti, le cellule impegnate nel riassorbimento del tessuto osseo. Gli effetti dello Spazio sull'organismo maschile e femminile Foto: © ESA Misurazione della temperatura interna. Le tecnologie agli infrarossi sviluppate alcuni decenni fa dal Jet Propulsion Laboratory della Nasa per misurare la temperatura di stelle e pianeti sono state impiegate, dai primi anni '90, per mettere a punto termometri agli infrarossi (come quello auricolare) capaci di rilevare con precisione e in modo non invasivo la temperatura interna dei pazienti. Foto: © Shutterstock Adv La misurazione della pressione intracranica. La principale ragione dei problemi alla vista lamentati dagli astronauti è l'aumento della pressione all'interno del cranio, causata dalla risalita dei fluidi per effetto della microgravità e dall'aumento del volume del liquido cerebrospinale. Lo sviluppo di metodologie non invasive per monitorare la pressione intracranica degli astronauti è salutato con favore anche dai pazienti che hanno questa necessità sulla Terra, per la quale in passato erano impiegati sistemi diagnostici anche molto invasivi. 10 modi in cui lo Spazio prova a ucciderti Foto: © NASA Il raggio traente alla Star Trek per i calcoli renali. Nello Spazio, per il cambiamento di dieta, metabolismo e idratazione aumenta la possibilità di sviluppare calcoli renali, potenzialmente molto pericolosi perché possono portare all'evacuazione di emergenza di un astronauta. Per questo è stata messa a punto una macchina agli ultrasuoni portatile capace di individuare, spostare e demolire i calcoli senza effetti collaterali, direttamente sul posto e senza necessità di intervenire da Terra. La stessa tecnologia sta servendo anche per trattare il problema quaggiù. Che cosa succede se ci si sente male sulla ISS? Foto: © Shutterstock Le tecniche di imaging cerebrale. L'analisi di segnali digitali fu inizialmente messa a punto per migliorare la visualizzazione delle immagini lunari e scegliere migliori siti di atterraggio per le missioni dell'era Apollo. In seguito, queste tecnologie sono servite a mettere a punto sistemi di imaging diagnostico sempre più precisi: le stesse tecniche di interpretazione dei segnali sono ora impiegate per leggere gli esiti di TAC e risonanze magnetiche e individuare eventuali lesioni. Foto: © Shutterstock Adv Più semplici tecniche di dialisi. I sistemi di riciclo dei liquidi - urina compresa - impiegati sulla ISS sono stati imitati per realizzare sistemi di filtraggio che permettano di rimuovere le sostanze di scarto dai fluidi utilizzati per la dialisi. Ciò è servito a creare macchine per la dialisi meno ingombranti e utilizzabili anche a casa, che richiedono un minore dispendio energetico. Le invenzioni della Nasa che hanno cambiato il mondo Foto: © Nasa Approfondimenti Innovazione Un microscopio stampato in 3D per tutte le tasche Tecnologia Il primo hotel stampato completamente in 3D Storia Dal Dna ecco il volto dell’imperatore cinese Wu Salute Se il cervello si stampa in 3D Ecologia Ecco il salmone vegano stampato in 3D Spazio La capsula Dragon vissuta due volte Spazio Una navicella spaziale "riciclata" Spazio Così stamperemo una base sulla Luna Spazio Video: l'asteroide Ryugu bombardato 27 febbraio 2025 Roberto Graziosi Tag scienza - spazio - stampa 3d - esa - astronauti - iss - Stazione Spaziale Internazionale'''
