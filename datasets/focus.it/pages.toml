["https://focus.it/ambiente/animali/100-anni-di-evoluzione-dei-cani"]
title = "100 anni di evoluzione dei cani -  Focus.it"
description = "In una serie di confronti fotografici, ecco come alcune razze di cane sono cambiate in 100 anni per colpa (o merito) dell'uomo."
full_description = '''Animali 100 anni di evoluzione dei cani 9 FOTO Sfoglia la gallery In una serie di confronti fotografici, ecco come alcune razze di cane sono cambiate in 100 anni per colpa (o merito) dell'uomo. Guarda la gallery 10 gennaio 2023 Tag ambiente - animali - cani - pet - razze canine - canidi - evoluzione - evoluzione dei cani - genetica - animali domestici Contenuti correlati Animali Qual è la razza canina più intelligente? Animali Da dove viene il tuo cane? Animali Perché i cani scodinzolano così tanto? Animali Perché i cani ci sembrano così carini? Fotogallery 100 anni di evoluzione dei cani Il Saluki (levriero persiano) è probabilmente la più antica fra le razze canine conosciute: è stata selezionata nella "Mezzaluna fertile" (Medio Oriente) quasi 7.000 anni fa. Dall'inizio dell'amicizia tra uomo e cane, circa 100 mila anni fa, gli spostamenti dell'uomo in diverse regioni del mondo hanno fatto sì che si arrivasse a 400 razze canine differenti. Ma come si sono evolute alcune razze rispetto a com'erano 100 anni fa? Vediamo. Foto: © Shutterstock Ai primi del Novecento, qualcuno ha contato 167 razze canine. Ma come sono cambiate nel tempo? Il blog Science and Dogs ha provato a confrontare le foto di oggi con quelle apparse 100 anni fa nel libro "Dogs of all nations" (1915). L'accostamento delle foto dimostra come gli incroci e la selezione ha plasmato e trasformato alcune razze. Il Basset Hound ieri e oggi. Il Basset Hound è una razza creata in Francia e poi importata in Inghilterra nel 1800 e poi nuovamente sviluppata negli Usa. Oggi appare più basso rispetto al passato e anche le orecchie sembrano più grandi. Adv Il Bull Terrier ieri e oggi. È la razza che ha subito la trasformazione più evidente. Nel libro "Dogs of all nations", appare molto più slanciato e soprattutto con il muso più naturale. Ora il muso è più appuntito e anche l'adddome è molto diverso.Il Bull Terrier è una razza nata in Gran Bretagna. Veniva usata soprattutto nei combattimenti con i tori. Il pastore tedesco ieri e oggi. Le zampe posteriori oggi sono più basse che in passato. In "Dogs of Nation" il pastore tedesco era descritto come un animale agile e veloce. Oggi è diventato molto più massiccio e pesante. Il Carlino ieri e oggi. Il carlino di oggi è più piccolo del precedente. Si è ridotto tramite selezione. Il carlino arrivò in Europa tra il '500 e il '600 dalla Cina. Adv Il bassotto ieri e oggi. Il bassotto (Dachshund) è una creazione di allevatori tedeschi. Rispetto al passato si è allungato e le gambe si sono oltremodo accorciate. Il San Bernardo ieri e oggi. Il San Bernardo di oggi è molto più grande del passato, mentre il muso appare più corto. Si pensa che l’origine della razza risalga ai grossi mastini che le legioni romane lasciavano con le truppe destinate a presidiare i punti strategici sulle grandi vie di comunicazione. Il suo nome deriva dalla fatto che vennero usati nell’Ospizio situato al Colle San Bernardo verso il 1660 sia come cani da soccorso che per altri usi. Il bulldog inglese ieri e oggi. Gambe più corte e muso più schiacciato. Come dice il nome, il bulldog era "nato" come cane da combattimento contro i tori. Adv Approfondimenti Animali Dentro a un chihuahua c'è anche un lupo 9 FOTO Animali Meglio il cane o il gatto? La gara continua... Animali Un cane con le orecchie cadenti sente meno? Animali L’ansia nei cani? Colpa dei geni 12 FOTO Animali 11 cose che fai, ma che ai cani non piacciono 16 FOTO Spazio 2003-2015: i primi 12 anni di Mars Express 09:45 Ecologia 2050: la nostra data di scadenza 7 FOTO Curiosità Zombie: che cosa dice la scienza 14 FOTO Arte Picasso, gli autoritratti di una vita'''
