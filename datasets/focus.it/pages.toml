["https://focus.it/cultura/storia/breve-storia-delle-parolacce-dalluomo-primitivo-a-beppe-grillo"]
title = "Breve storia delle parolacce -  Focus.it"
description = "Le parolacce erano nel vocabolario di Egizi, Greci e Romani... per non parlare dei medioevali. Il turpiloquio &egrave; vecchio quanto l&rsquo;uomo, anche se nei secoli &egrave; cambiato."
full_description = '''Storia Breve storia delle parolacce 14 FOTO Sfoglia la gallery Le parolacce erano nel vocabolario di Egizi, Greci e Romani... per non parlare dei medioevali. Il turpiloquio è vecchio quanto l’uomo, anche se nei secoli è cambiato. Guarda la gallery 2 aprile 2024 Tag cultura - storia - linguistica - costumi - parolacce - vita quotidiana - educazione - maleducazione - maledizioni - psicologia Contenuti correlati Psicologia Parolacce: fanno bene alla salute Psicologia Si torna a scuola. E sono subito dolori... Psicologia Bravi a scuola? Vincenti nel lavoro! 13 FOTO Psicologia I volti della bellezza Fotogallery Breve storia delle parolacce Freud e la civiltà. Per Sigmund Freud, padre della psicanalisi, «colui che per la prima volta ha lanciato all’avversario una parola ingiuriosa invece che una freccia è stato il fondatore della civiltà». L’etologo Irenäus Eibl-Eibesfeldt ha un’ipotesi ancora più azzardata: per lui gli insulti sono stati il più importante motore nello sviluppo del linguaggio, perché hanno aiutato a risolvere gli scontri in modo non cruento. Foto: © Shutterstock Le prime documentazioni scritte e la BibbiaLe parolacce hanno una tradizione millenaria: compaiono già nella saga di Gilgamesh (nella foto), il più antico poema della storia (2000 a. C.), nel quale una baldracca, Shamhat, trasforma il bruto Enkidu in un essere civilizzato. Persino nella Bibbia (Ezechiele, 16, 30) il profeta condanna l’infedeltà di Gerusalemme definendola sgualdrina. Bestemmie egizieRisalgono al III-II millennio a.C. le prime testimonianze di imprecazioni degli antichi egizi. Secondo un’interpretazione di alcuni geroglifici e papiri, Nefti, la dea dell’oltretomba, era definita una “femmina senza vulva”, il dio Thot un essere “privo di madre”, Ra il dio Sole “con la cappella vuota”.Nell'immagine il geroglifico che significa "facciamo l'amore". Adv Il Cavolo dei GreciGli antichi Greci imprecavano in nome del cavolo (mé tén krambén) ma anche “per l’aglio”, “per il cane” e “per la capra”. A loro risale la prima barzelletta con parolaccia di cui abbiamo una traccia. Si trova nel Philogelos, un’antologia di barzellette in greco del IV secolo d.C. Un abitante di Abdera vede un eunuco e gli chiede quanti figli avesse. L’eunuco gli risponde che non aveva le palle e quindi non era in grado di avere bambini; così l’abderita gli chiede: «E allora quando hai intenzione di prenderti le palle?».Nell'immagine, un antico vaso greco rappresenta una prostituta mentre fa pipì. La poetica delle parolacceGli uomini del passato – come quelli di oggi – offendevano e dicevano parolacce per sfogare rabbia, odio, indignazione o frustrazione, o, secondo alcuni antropologi, per provocare la reazione fisica dell’avversario. Ma c’era anche un altro motivo che aveva capito molto bene il commediografo Aristofane, uno dei più grandi maestri del turpiloquio, inventore di offese capaci di suscitare grande ilarità. Altrettanto abili furono i poeti latini. Per esempio Marziale scriveva «[...] queste mie rimette da sollazzo, così come un marito a una moglie, non possono piacere senza il cazzo. [...] Questa è la legge del poeta smaliziato: non può piacere se non è un po’ sboccato». Le prime parolacce scritte sui muri Un vocabolario di latino aperto alle pagine giuste svelerebbe che gli antichi Romani ci sapevano fare anche con il turpiloquio: termini come stercus (merda), mentula (membro maschile), futuere (fottere), meretrix (prostituta) e scortum (sgualdrina) erano già in uso, come mostrano per esempio i graffiti scurrili sui muri di Pompei. Un esempio? APOLLINARIS, MEDICUS TITI IMPERATORIS HIC CACAVIT BENE, ovvero "Apollinare, medico dell'imperatore Tiberio, qui ha cacato bene"I medioevali attingevano invece a piene mani dal mondo animale: bestia, cagna, bacalare (baccalà), iumenta (vacca), porco e scorfano. Adv Villano medioevale!I medioevali, razzisti e classisti, consideravano offensivo il termine “villano”, che indicava l’abitante della campagna, proprio com’era offensivo per i Romani dare del “sannita” a qualcuno. I fondatori dell’Urbe, infatti, consideravano questi italici, che si erano opposti strenuamente alle loro legioni, montani, agrestes e latrones, cioè “montanari”, “rozzi” e “briganti”. Non solo la provenienza, anche le professioni e il cibo più umile originavano termini sprezzanti per ogni occasione: i siciliani del Trecento erano mangiamaccarruna, i napoletani mangiafoglia (di cavolo). E nello stesso periodo si poteva squalificare un avversario dandogli del votacessi o dello “scardatore di castagne di villa”. La Prima parolaccia in italiano volgareFili de pute è la più antica parolaccia in lingua italiana (volgare, in tutti i sensi) e risale alla fine del XI secolo. Si trova nella basilica di San Clemente in Laterano ed è scritta su un affresco che illustra la vita di papa Clemente.Vi risparmiamo l’intuibile traduzione, prova che oggi come nel Medioevo le parolacce e le offese che tirano in ballo la famiglia sono ed erano molto diffusi. Qualche esempio? “figlio di uno traditore”, “figlio di prete” o, ancora peggio, “figlio di prevetessa”, cioè dell’amante del prete. Parole santeSe vedere una parolaccia in una Chiesa (e nella vita di un Papa) vi ha sconvolto, tenetevi forte: persino un santo come Francesco d’Assisi usò qualche parolaccia. Proprio lui, si legge ne I fioretti, consigliò a padre Ruffino di cacciare il diavolo rispondendo così alle sue tentazioni: Apri la bocca; mo’ vi ti caco. Era la maniera più efficace e diretta di arrivare al popolo. Lo stesso uso che ne fanno anche alcuni politici dei nostri giorni. Adv Parolacce politiche A proposito, non pensiate che gli insulti politici di parte siano una prerogativa moderna. Nei comuni medioevali divisi in fazioni e perennemente in lotta fra loro era facile offendere qualcuno in base al suo schieramento: a “mal ghibellino cacato” si poteva rispondere con “sozzo guelfo traditore”, ma anche con “fiorentino marcio” o, all’occorrenza geografica, con “sozzi marchisani” o “sozza romagnola”. Insomma, è evidente che gli uomini del passato offendevano e dicevano parolacce per sfogare rabbia, odio, indignazione o frustrazione, o, secondo alcuni antropologi, per provocare la reazione fisica dell’avversario. La prima parolaccia ufficiale di un presidente della RepubblicaSempre in campo politico, nel 1992, Francesco Cossiga alla base militare di Ronchi dei Legionari (Go) si lasciò andare a una delle sue famose esternazioni, questa volta un po’ più colorita del solito: «E voi volete che gli appartenenti alle forze dell’ordine non si incazzino se vedono che tutto l’impegno del governo è per l’obiezione di coscienza? Mi sarei incazzato anch’io, come mi sto incazzando». La prima parolaccia nello Spazio (documentata)Durante la missione Apollo 10 (1969) all’astronauta Gene Cernan sfuggì (in diretta TV) un “Figlio di puttana, che diavolo è successo!” quando il modulo lunare si mise a ruotare su se stesso.Cernan è una delle tre persone ad aver viaggiato due volte dalla Terra alla Luna (le altre due sono Jim Lovell e John Young), l’ultimo uomo che ha camminato sulla Luna e l'unico uomo ad aver effettuato due volte la discesa verso la Luna a bordo di un LEM (Apollo 10 e Apollo 17). Foto: © Nasa Adv Parolacce al cinemaLa prima – autorizzata – è del 1939, in Via col vento: «Non me ne frega un accidente!». Erano altri tempi.Famoso anche Il buono, il brutto e il cattivo (1966) di Sergio Leone che finisce con una parolaccia.Tra i film (di successo) con il maggior numero di parolacce c'è The Wolf of Wall Street (2013), di Martin Scorsese: la parola fuck (la parolaccia più usata in inglese) viene ripetuta 569 volte in 180 minuti! In totale le parolacce sono 687. Chi dice più parolacce? Per il popolo che dice più parolacce vi rimandiamo alla prossima foto, ma difficilmente qualcuno potrebbe battere l’alieno Wowbagger, uno dei personaggi della Guida galattica per autostoppisti di Douglas Adams: va a insultare tutti gli abitanti dell’Universo. La vera "bibbia" delle parolacce è il libro Parolacce di Vito Tartamella da cui sono state tratte le informazioni di questo articolo. Si può anche acquistare online. Approfondimenti Sessualità Perché si dice scopare? Storia Gli insulti politici nell'antica Roma Storia Come si insultavano gli antichi? Psicologia Imprecare rende più forti: ora abbiamo le prove Psicologia Tante parolacce, vocabolario più ricco Psicologia Parolacce: fanno bene alla salute 6 FOTO Scienze Le prime immagini del documentario sui Musei Vaticani 8 FOTO Salute Cancersutra 12 FOTO Curiosità Come si mangia il sushi?'''
