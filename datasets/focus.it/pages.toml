["https://focus.it/ambiente/animali/perche-le-tartarughe-danzano-nel-mare"]
title = 'La danza "magnetica" delle tartarughe marine -  Focus.it'
description = "Le tartarughe marine “danzano” in acqua per orientarsi con il campo magnetico terrestre, dice un nuovo studio."
full_description = '''Animali La danza "magnetica" delle tartarughe marine Le tartarughe marine "danzano" in acqua per orientarsi con il campo magnetico terrestre, dice un nuovo studio. Le tartarughe Caretta caretta hanno due diversi sensi magnetici. David Havel / Shutterstock Gli animali migratori utilizzano una vasta gamma di trucchetti per riuscire a orientarsi su distanze immense e non perdersi in mezzo all'oceano o nel nulla del cielo. Tra questi, l'utilizzo del campo magnetico terrestre come punto riferimento è uno dei più misteriosi: sappiamo che molti animali (uccelli, salmoni, aragoste…) lo usano, ma non ci è chiaro il meccanismo sottostante. Ora uno studio pubblicato su Nature aggiunge un nome alla lista di animali che percepiscono il campo magnetico del pianeta: le tartarughe marine, che non solo navigano seguendo le linee del campo, ma sono anche in grado di costruirsi una mappa mentale dei loro luoghi preferiti. C'è una novità fondamentale in quello che abbiamo scoperto sulle tartarughe marine della specie Caretta caretta, diffuse anche nel Mediterraneo. Normalmente, infatti, gli animali che usano il campo magnetico terrestre per orientarsi lo sfruttano per mantenere la direzione giusta durante una migrazione: è una direttrice generale che funziona come una sorta di bussola interiore. L'oceano in una vasca. Messe alla prova in speciali vasche circondate da bobine che simulavano le condizioni magnetiche dell'oceano Atlantico, le tartarughe marine hanno anche dimostrato di saper imparare la "firma magnetica" di una singola area geografica – e l'hanno fatto danzando. La danza di una tartaruga marina, che le serve per orientarsi con il campo magnetico. © Goforth et al., Nature, 2025 Come si vede nel video qui sopra, le tartarughe marine ballano e battono le zampe con entusiasmo quando sanno che sono in una zona dove si trova il cibo. Questo, secondo gli autori dello studio, è la prova che sanno memorizzare la posizione di un'area geografica ristretta basandosi sulle sue proprietà magnetiche. Meccanismo chimico. Non solo: la loro "bussola interiore", condivisa con molte altre specie, funziona secondo un meccanismo chimico; la loro capacità di mappare le singole aree, invece, è governata da… qualcos'altro, che ancora non siamo riusciti a identificare. Lo studio, insomma, dimostra che le tartarughe marine hanno non uno, ma due diversi sensi magnetici, che funzionano in modo diverso; il prossimo passo sarà scoprire se lo stesso vale per gli altri animali migratori succitati: pesci, uccelli… 10 FOTO Fotogallery 10 animali giganti del passato VAI ALLA GALLERY Fotogallery 10 animali giganti del passato Megalodonte. Lo scheletro di questi grandi squali preistorici era fatto, come quello dei moderni "cugini", di cartilagine, e non si è fossilizzato a dovere. Le uniche testimonianze dei giganti predatori del mare (qualche vertebra e denti lunghi fino a 17 cm) fanno ipotizzare potessero raggiungere anche i 20 m di lunghezza, molto più del più grande pesce esistente, lo squalo balena (12-14 m). v Foto: © Shutterstock I grandi dinosauri non sono gli unici colossi viventi ormai scomparsi. La BBC ne ha selezionato 10: i più impressionanti e interessanti. Eccoli.Aegirocassis benmoulae. Vicino, nell'aspetto, a un incrocio tra una balena e un'aragosta, questo colosso marino appartenente alla famiglia estinta degli anomalocarididi, filtrava le acque oceaniche in cerca di plancton all'incirca 480 milioni di anni fa. Si procurava il cibo grazie a due speciali appendici boccali simili a filtri, occupando una nicchia ecologica simile a quella delle moderne balene (ma era più piccolo: raggiungeva circa 2 metri di lunghezza). Lo studio dei suoi organismi filtratori potrebbe rivelare dati importanti sull'origine degli arti dei moderni artropodi come i crostacei, con i quali l'Aegirocassis benmoulae sarebbe imparentati. Foto: © Marianne Collins/ArtofFact/Reuters Jaekelopterus rhenaniae. Le acque preistoriche riservavano incontri da incubo per ogni aracnofobico che si rispetti. Nei fiumi e nei laghi europei di 390 milioni di anni fa si poteva incontrare questo gigantesco "scorpione di mare", come è stato soprannominato, tra i più grandi rappresentanti della famiglia degli artropodi mai apparsi sul pianeta, con i suoi 2,5 metri di lunghezza. Il suo aspetto è stato ricostruito a partire dal ritrovamento di una chela lunga 46 cm in uno scavo in Germania. Qualcuno ipotizza che gli antichi artropodi marini crescessero tanto grazie a un'atmosfera più ricca di ossigeno di quella odierna. Per altri, le dimensioni erano dovute all'assenza di grandi predatori. Foto: © Jaime Chirinos/SPL Adv Arthropleura. Vissuto tra i 340 e i 280 milioni di anni fa, questo preistorico millepiedi poteva raggiungere i 2,6 metri di lunghezza. Un suo fossile completo non è mai stato trovato, ma resti del suo corpo di 90 cm sono stati rinvenuti in Germania. Altre tracce della sua presenza sono state trovate in Canada, Scozia e Stati Uniti (nella foto, una ricostruzione). Il suo corpo formato - si pensa - da una trentina di parti segmentate protette da piastre laterali, era nutrito da una dieta a base, forse, di vegetali in decomposizione. Foto: © Cathy Meloan/Alamy Megatherium. A questo genere estinto di mammiferi apparteneva anche il cosiddetto bradipo gigante americano, di cui vediamo qui la ricostruzione dello scheletro. Più piccoli dei mammut lanosi, questi animali vissuti tra i 5 milioni e gli 11 mila anni fa raggiungevano comunque la ragguardevole lunghezza di 6 m. Lo scheletro robusto e i grandi artigli fanno pensare a una dieta vegetariana e lenta, a base di cortecce e arbusti irraggiungibili per animali più bassi. Tuttavia alcuni paleontologi sostengono che questi animali mangiassero carne: la forma del loro gomito fa pensare alla possibilità di acciuffare piccole prede molto velocemente. Foto: © age fotostock/Alamy Meganeura. Questi insetti preistorici simili nell'aspetto a libellule extralarge, con una apertura alare di circa 65 cm, sfrecciavano nell'aria 300 milioni di anni fa. Dopo il ritrovamento del loro primo fossile, nel 1880, in Francia, si aprì un dibattito su come potessero volare sostenendo un corpo così grande (e pesante). La risposta si cela forse negli alti livelli di ossigeno - il 35% della composizione gassosa dell'atmosfera, contro il 21% attuale - presente nell'aria nel Periodo Carbonifero (359-299 milioni di anni fa). Questa ricchezza permetteva agli insetti di estrarre grandi quantità di energia dall'aria per sostenersi in volo. Il che potrebbe spiegare perché non sopravvissero quando il livello di ossigeno in atmosfera iniziò a calare. Foto: © Stocktrek Images Inc./Alamy Adv Sarcosuchus imperator. Immaginatevi la sorpresa di un gruppo di paleontologi in missione nella Valle del Nilo nel 1997 quando, al posto del fossile di un dinosauro, trovarono i resti della mascella di un colossale coccodrillo preistorico. L'osso fossile era grande come un uomo, e l'intero animale doveva raggiungere i 12 m di lunghezza, per 8 tonnellate di peso. Il rettile gigante, la cui dieta doveva includere qualche piccolo dinosauro, visse nell'Africa nord tropicale 110 milioni di anni fa. Non è un diretto antenato delle 23 moderne specie note di coccodrillo, ma un esponente della famiglia estinta dei Pholidosauridae. Il coccodrillo gigante che camminava come un uomo: guarda Foto: © Sergey Skleznev/Alamy Metoposaurus. I pesci preistorici dovevano temere anche il metoposauro, una salamandra grande come un'utilitaria i cui fossili sono stati rinvenuti in Polonia, Germania, Portogallo, Nord America, Africa e India. I colossali anfibi carnivori furono spazzati via da una estinzione di massa avvenuta 201 milioni di anni fa, che liberò la strada ai grandi dinosauri. Foto: © Shalom, CC by 3.0 Phorusrhacids. Non poteva volare, in compenso l'"uccello del terrore", come è stato ribattezzato questo pennuto sudamericano vissuto tra i 60 e i 2 milioni di anni fa, vedeva le prede da molto lontano, con i suoi 3 metri d'altezza. Una volta raggiunto il bottino poteva atterrarlo con una zampata, divorando le carni di un animale grande come un cane di media taglia in un istante, grazie al becco ricurvo. Le zampe robuste gli permettevano di raggiungere i 50 km/h di velocità. Fortunatamente l'unico moderno antenato dell'uccello è il seriema del Sudamerica (fam. Cariamidae) che raggiunge al massimo gli 80 cm di altezza. Nuovo fossile ridà vita all'uccello del terrore Foto: © Jaime Chirinos/SPL Adv Titanoboa cerrejonensis. Lungo 14,6 metri (due volte più dei più lunghi serpenti odierni) e pesante più di una tonnellata, questo distante parente di anaconda e boa constrictor, vissuto circa 60 milioni di anni fa, strangolava le sue prede a morte. Alcune vertebre e parte del cranio sono state rinvenute in Colombia. Date le dimensioni, e poiché i serpenti sono animali a sangue freddo, si pensa potesse sopravvivere solo in virtù delle più alte temperature terrestri nell'epoca in cui visse. Foto: © Ryan Quick, CC by 2.0 Approfondimenti Animali Un nuovo nido di tartaruga marina in Liguria Animali Una tartaruga liuto batte il record di profondità Animali La tartaruga più vecchia del mondo ha 191 anni Animali L’inquinamento fa male alle tartarughe verdi? Animali La bomba atomica sul guscio deIle tartarughe Animali Come fanno le tartarughe marine a orientarsi? Animali Come stanno le tartarughe marine del Mediterraneo? Animali La misteriosa bussola degli uccelli Animali Così i ragni distinguono gli animali dagli oggetti 28 febbraio 2025 Gabriele Ferrari Tag ambiente - animali - tartarughe - tartarughe marine - campo magnetico - campo magnetico terrestre'''
