["https://focus.it/tecnologia/digital-life/intelligenza-artificiale-ia-assolvere-peccati-gesu"]
title = "L'intelligenza artificiale può assolvere dai peccati? -  Focus.it"
description = "Uno strano esperimento, tra tecnologia e spiritualità, si svolge in una chiesa svizzera (sfruttando l'intelligenza artificiale). Con effetti che vanno oltre il previsto."
full_description = '''Digital Life L'intelligenza artificiale può assolvere dai peccati? Uno strano esperimento, tra tecnologia e spiritualità, si svolge in una chiesa svizzera (sfruttando l'intelligenza artificiale). Con effetti che vanno oltre il previsto. Ovviamente no, l'intelligenza artificiale non può assolvere dai peccati, però può farlo credere... Una chiesa cattolica in Svizzera ha installato un "Gesù IA" in un confessionale per farlo interagire con i visitatori. Il progetto, intitolato Deus "in" Machina, è stato realizzato dall'Università di Lucerna per esplorare il rapporto tra religione, tecnologia e arte. L'installazione comprendeva un ologramma di "Gesù", animato da un'intelligenza artificiale programmata con testi teologici, a cui i fedeli, avvertiti che stavano comunicando con una macchina, potevano parlare tramite un microfono e vedere poi "Gesù" rispondere loro dal video. Tecnologia 10 cose da sapere su Vitruvian, l’IA italiana Gesù IA avrebbe dovuto dare consigli e supporto spirituale In teoria il "Gesù IA" non avrebbe dovuto ascoltare confessioni di peccati, visto che l'idea originaria era solo quella di offrire in qualsiasi momento informazioni, consigli e supporto spirituale teologicamente corretti. Però, aver installato l'interfaccia in un vero confessionale, lì dove il fedele si confessa in solitudine con il prete, e aver fatto conversare i fedeli addirittura con "Gesù", deve aver confuso non pochi, inducendoli a rivelare le proprie colpe, sperando di essere perdonati. Ma, secondo i teologi, non c'è stata alcuna assoluzione, una macchina, priva di esperienza umana e trascendenza, onon può certo concederla: è un caso in cui le IA non ruberanno il lavoro agli umani. Questo contenuto è tratto dal numero 389 di Focus, attualmente in edicola, di cui trovate un'anteprima gratuita qui. 20 febbraio 2025 Alessandro Saragosa Tag tecnologia - digital life - intelligenza artificiale - ia - peccati - gesù cristo - svizzera'''
year_published = 2025
