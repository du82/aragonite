title = "Contatti -  Focus.it"
full_description = "Ecco come contattarci redazione@focus.it Per scrivere alle redazioni di Focus (Focus, Focus EXTRA, Focus D&R eccetera) e Focus.it, e segnalare notizie, suggerimenti, abusi. redazione@focusstoria.it Per scrivere alla redazione di Focus Storia. abbonamenti@mondadori.it Per richieste, informazioni e segnalazioni relative agli abbonamenti ai nostri magazine cartacei. codice-sconto@mondadori.it Per domande, segnalazioni o suggerimenti legati ai codici sconto e alle offerte. redazione@focus.it Per scrivere alle redazioni di Focus (Focus, Focus EXTRA, Focus D&R eccetera) e Focus.it, e segnalare notizie, suggerimenti, abusi. abbonamenti@mondadori.it Per richieste, informazioni e segnalazioni relative agli abbonamenti ai nostri magazine cartacei. codice-sconto@mondadori.it Per domande, segnalazioni o suggerimenti legati ai codici sconto e alle offerte. In questo numero di Focus Storia ci immergiamo nella Belle Époque, un’epoca di straordinari cambiamenti che, tra invenzioni, arte e progresso, fece brillare l’Europa fino alla Prima guerra mondiale. Dalle origini del turismo al trionfo dell’Art Nouveau, dai fasti della borghesia ai grandi personaggi che segnarono quel periodo, ripercorriamo un’epoca tanto affascinante quanto effimera. In questo numero di Focus andiamo alla scoperta dei misteri dell’universo e delle possibilità di vita oltre la Terra. Il dossier centrale esplora l’origine del Sistema Solare e i luoghi più promettenti per trovare tracce di vita: dagli oceani nascosti delle lune di Giove e Saturno, al passato acquoso di Marte, fino alle missioni del futuro che sfidano i confini tra scienza e fantascienza."
