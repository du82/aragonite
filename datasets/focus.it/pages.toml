["https://focus.it/cultura/curiosita/quando-furono-scoperti-i-resti-di-pompei-e-a-chi-dobbiamo-l-intuizione-degli-scavi-scientifici"]
title = "Quando furono scoperti i resti di Pompei? -  Focus.it"
description = "Il progetto di riportare alla luce Pompei risale al III secolo, ma fu Carolina Bonaparte, nell'Ottocento, a dare un'accellerata agli scavi in maniera sistematica."
full_description = '''Curiosità Quando furono scoperti i resti di Pompei? E a chi dobbiamo l'intuizione degli "scavi scientifici"? Il progetto di riportare alla luce Pompei risale al III secolo, ma fu Carolina Bonaparte, nell'Ottocento, a dare un'accellerata agli scavi in maniera sistematica. La scoperta del tempio di Iside a Pompei in un dipinto dell'inglese William Hamilton. Getty Images L'antica città romana di Pompei (Patrimonio Unesco dal 1997) fu sepolta dall'eruzione del Vesuvio del 79 d.C. e già agli inizidel III secolo l'imperatore Alessandro Severo (che regnò tra il 222 e il 235) tentò di riportarla alla luce, ma il progetto fu abbandonato a causa dello spesso strato di ceneri e lapilli. Molti secoli dopo, tra 1594 e 1600, durante i lavori di costruzione di un canale idrico, alcuni operai trovarono resti di edifici, iscrizioni e monete di età romana. Nessuno, però, collegò questi ritrovamenti alle vicende di Pompei. Tombaroli. Gli scavi veri e propri furono cominciati nel 1748 per volere di Carlo di Borbone (re di Napoli dal 1734 al 1759). Tuttavia queste prime indagini erano poco scientifiche. Più tombaroli che studiosi, il metodo di indagine utilizzato procedeva con lo scavo di lunghe gallerie sotterranee (i cosiddetti "cunicoli borbonici"). Un modo di procedere dettato dal volere del sovrano: recuperare reperti e opere d'arte da accumulare nel Museo della Villa Reale di Portici. Quel che non serviva veniva lasciato sul posto e ricoperto. Cultura In quanto tempo è stata distrutta Pompei? Investimento. Poi, nel XIX secolo, Carolina Bonaparte, sorella di Napoleone e moglie di Gioacchino Murat (a cui dal 1808 fu affidata la guida del Regno di Napoli) e grande appassionata di archeologia, impose ai lavori di scavo un'accelerata e furono possibili così importanti ritrovamenti. Carolina Bonaparte (che dal 1815 si fece chiamare Contessa di Lipona: anagramma di Napoli) era un'appassionata di archeologia e prese subito a cuore le indagini. Aumentò il numero di operai e "zappatori" e li incentivò con continue ricompense economiche, il tutto mentre il nuovo responsabile, l'antiquario Michele Arditi, sostituì alla tecnica dei "buchi a caso" in ricerca di rarità, un piano di scavo razionale, che seguisse le strade, casa per casa. 14 FOTO Fotogallery Le foto dell'antico termopolio scoperto a Pompei VAI ALLA GALLERY Fotogallery Le foto dell'antico termopolio scoperto a Pompei Ancora una straordinaria scoperta a Pompei: nei nuovi scavi ripresi all’interno del progetto di manutenzione e restauro della Regio V riaffiora un Termopolio perfettamente conservato con l’immagine di una ninfa marina a cavallo e animali con colori talmente accesi da sembrare tridimensionali. Ma a stupire è il ritrovamento nei recipienti del Termopolio di tracce di alimenti che venivano venduti in strada. Era infatti abitudine dei pompeiani quella di consumare all’aperto cibi e bevande calde. Foto: © Luigi Spina/Parco Archeologico di Pompei I termopoli, dove si servivano bevande e cibi caldi, come indica il nome di origine greca, conservati in grandi dolia (giare) incassati nel bancone in muratura, erano molto diffusi nel mondo romano, dove era abitudine consumare il prandium (il pasto) fuori casa. Nella sola Pompei se ne contano una ottantina, ma nessuno con il bancone interamente dipinto, a conferma dell’eccezionalità del ritrovamento. Foto: © Luigi Spina/Parco Archeologico di Pompei Le decorazioni del bancone - le prime emerse dallo scavo - presentano sul fronte l’immagine di una Nereide a cavallo in ambiente marino e, sul lato più corto, l’illustrazione probabilmente della stessa bottega alla stregua di un’insegna commerciale. Al momento dello scavo, il ritrovamento di anfore poste davanti al bancone rifletteva non a caso l’immagine dipinta. Foto: © Luigi Spina/Parco Archeologico di Pompei Adv Una sbeffeggiante iscrizione graffita “Nicia cinede cacator” si legge sulla cornice che racchiude il dipinto del cane: “Nicia (probabilmente un liberto proveniente dalla Grecia) Cacatore, invertito!” forse lasciata per prendere in giro il proprietario o da qualcuno che lavorava nel Termopolio. Foto: © Luigi Spina/Parco Archeologico di Pompei In questa nuova fase di scavo sono emerse altre pregevoli scene di nature morte con rappresentazioni di animali, probabilmente macellati e venduti nel locale. Frammenti ossei, pertinenti gli stessi animali, sono stati inoltre rinvenuti all’interno di recipienti ricavati nello spessore del bancone contenenti cibi destinati alla vendita. Come le due anatre germane esposte a testa in giù, pronte per essere preparate e consumate. Foto: © Luigi Spina/Parco Archeologico di Pompei In questa nuova fase di scavo sono emerse altre pregevoli scene di nature morte con rappresentazioni di animali, probabilmente macellati e venduti nel locale. Frammenti ossei, pertinenti gli stessi animali, sono stati inoltre rinvenuti all’interno di recipienti ricavati nello spessore del bancone contenenti cibi destinati alla vendita. Come le due anatre germane esposte a testa in giù, pronte per essere preparate e consumate. Foto: © Luigi Spina/Parco Archeologico di Pompei Adv L'impianto commerciale dove è riaffiorato il Termopolio era stato indagato solo in parte nel 2019, durante gli interventi del Grande Progetto Pompei per la messa in sicurezza e consolidamento dei fronti di scavo storici. Considerata l’eccezionalità delle decorazioni e al fine di restituire la completa configurazione del locale, ubicato nello slargo all’incrocio tra il vicolo delle Nozze d’argento e il vicolo dei Balconi, si è deciso di estendere il progetto e di portare a termine lo scavo dell’intero ambiente in modo da proteggere con un restauro adeguato l’intero contesto. Foto: © Luigi Spina/Parco Archeologico di Pompei Di fronte al Termopolio, nella piazzetta antistante, erano già emerse una cisterna, una fontana e una torre per la distribuzione dell’acqua. Questo spiegherebbe la presenza sul fronte del bancone dell’immagine di una Nereide a cavallo in ambiente marino. Foto: © Luigi Spina/Parco Archeologico di Pompei Un'altra immagine del Termopolio. Foto: © Luigi Spina/Parco Archeologico di Pompei Adv In questa nuova fase di scavo sono emerse altre pregevoli scene di nature morte con rappresentazioni di animali, probabilmente macellati e venduti nel locale. Foto: © Luigi Spina/Parco Archeologico di Pompei Le prime analisi confermano come le pitture sul bancone rappresentino, almeno in parte, i cibi e le bevande effettivamente venduti all’interno del Termopolio: tra i dipinti del bancone sono raffigurate due anatre germane, e in effetti un frammento osseo di anatra è stato rinvenuto all’interno di uno dei contenitori, insieme a suino, caprovini, pesce e lumache di terra, testimoniando la grande varietà di prodotti di origine animale utilizzati per la preparazione delle pietanze. D’altro canto, le prime analisi archeobotaniche hanno permesso di individuare frammenti di quercia caducifoglie, probabilmente pertinente a elementi strutturali del bancone. Sul fondo di un dolio - identificato come contenitore da vino sulla base della bottiglia per attingere, rinvenuta al suo interno - è stata individuata la presenza di fave, intenzionalmente frammentate/macinate. Apicio nel De re Coquinaria (I,5) ce ne fornisce il motivo, asserendo che venivano usate per modificare il gusto e il colore del vino, sbiancandolo. Foto: © Luigi Spina/Parco Archeologico di Pompei Erano presenti inoltre, all’interno della stanza - e in particolare dietro al bancone dove sono state trascinate dai primi scavatori - un buon numero di ossa umane pertinenti ad un individuo di almeno 50 anni di età. Foto: © Luigi Spina/Parco Archeologico di Pompei Adv Nell’angolo tra le due porte (angolo nord occidentale della stanza) del Termopolio è stato rinvenuto uno scheletro completo di cane. Non si tratta di un grande cane muscoloso come quello dipinto sul bancone ma di un esemplare estremamente piccolo, alto 20-25 cm alla spalla, pur essendo un cane adulto. Cani di queste piccolissime dimensioni, sebbene piuttosto rari, attestano selezioni intenzionali avvenute in epoca romana per ottenere questo risultato. Gli specialisti del Parco archeologico di Pompei stanno già studiando il materiale per verificare quanto questa scoperta possa ampliare le conoscenze sulle abitudini alimentari di età romana. Foto: © Luigi Spina/Parco Archeologico di Pompei Approfondimenti 00:00 Storia Una nuova ricostruzione dell'eruzione del Vesuvio 08:33 Storia A Pompei niente "famiglie tradizionali" Pompei Scoperti i resti di due vittime e un tesoro 08:33 Storia Un terremoto seminò distruzione e morte a Pompei Arte A Pompei anche i muri parlano: i nuovi affreschi Storia In Iraq la città perduta di Alessandro Magno 12:15 Storia Scoperta la più importante via romana in Scozia Storia L'antica, misteriosa piramide a gradoni rinvenuta in Egitto Storia In Egitto: una città dei morti in uso per secoli 7 febbraio 2025 Focus.it Tag cultura - curiosità - pompei - scavi archeologici - scavi - napoleone bonaparte - napoli - ercolano - archeologia - napoleone'''
