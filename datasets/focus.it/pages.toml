full_description = '''Sessualità Gli appuntamenti: a Castell'Arquato mostra di Albino Vescovi In questa pagina vi segnaliamo eventi, iniziative, appuntamenti e novità editoriali. Prendete nota. FINO AL 28 LUGLIO: "SEGNO SPAZIO LUCE" , A CASTELL'ARQUATO LA PERSONALE ANTOLOGICA DI ALBINO VESCOVI, ARCHITETTO, ARTISTA E DESIGNER Opere pittoriche, progetti architettonici e oggetti di design animano fino al 28 luglio le sale del duecentesco Palazzo del Podestà di Castell'Arquato, borgo medioevale situato sulle prime alture della Val d'Arda, tra Parma e Piacenza. L'antologica apre una finestra sui 40 anni di ricerca artistica e quasi 30 anni di progettazione, con un allestimento che vale la visita e conduce attraverso un viaggio tra energie creative: pittura, architettura, design e grafica. Nato a Berna da genitori emiliani, dopo un periodo di formazione in Svizzera, Vescovi si trasferisce in Italia per frequentare scuole d'arte, formandosi tra Parma e Milano. Respira il fermento degli anni Novanta tra le principali città europee e nel 1996 apre il proprio studio professionale a Castell'Arquato, dove oggi vive e lavora. L'appuntamento è imperdibile: tra fare architettonico e pittorico, razionale e irrazionale, squarci di luce, evoluzione dei materiali e linee funzionali, si scoprono le collaborazioni dell'architetto con grandi maestri del design, primo tra tutti Ettore Sottsass, oggetti di design contemporaneo e progettazioni innovative. Tra le altre, la storica torrefazione Lino's Coffee, la sede di Alcamoretti a Fidenza, Cantine Ceci di Torrile, Gruppo FinIper, l'Autostrada del Brennero. La mostra, con il patrocinio del Comune di Castell'Arquato, è a cura di Giuseppe Pannini e Donata Meneghelli, che firmano anche i contributi critici della monografia edita Electa. ORARI: venerdì 14:30-18:00 • sabato e domenica 10:00-12:30 e 14:30-18:00 • Ingresso libero INFORMAZIONI: IAT Ufficio Informazioni e Accoglienza Turistica Tel: +39 0523 803215; E-mail: iatcastellarquato@gmail.com Dal 5 al 7 dicembre 2023: torna il New Space Economy European Expoforum alla Fiera di Roma Appuntamento annuale giunto alla quinta edizione del New Space Economy European Expoforum (NSE) organizzato presso il padiglione 4 di Fiera Roma (Ingresso EST, Viale Alexandre Gustave Eiffel, 00148 Roma), con il patrocinio dell'Agenzia Spaziale Italiana, del Consiglio Nazionale delle Ricerche, di ENEA, di INGV e dell'Ordine degli Ingegneri della Provincia di Roma e con la collaborazione di Regione Lazio e Camera di Commercio di Roma. NSE 2023 è la fiera internazionale sul trasferimento tecnologico, incentrata sulla capacità della nuova economia spaziale di consentire nuovi mercati terrestri basati sull'innovazione spaziale guidata dall'imprenditorialità. L'evento prevede una conferenza scientifica con numerose tavole rotonde e oltre cento speakers. Durante le tre giornate di NSE sono inoltre previsti una esposizione fieristica, eventi tematici e momenti dedicati al networking e al business to business. Clicca qui per saperne di più Giugno 2024, Rotterdam: consegna del premio Pezcoller per le donne impegnate nella Ricerca in ambito oncologico a Maria Rescigno Nel giugno 2024 verrà consegnato il Premio Pezcoller per le donne impegnate nella Ricerca in ambito oncologico che quest'anno quest'anno è stato assegnato alla prof.ssa Maria Rescigno, ricercatrice di Humanitas e prorettrice di Humanitas University. Rescigno l'anno scorso fu ospite al Focus Live (il festival della divulgazione scientifica di Focus, vedi foto) e in un incontro dove, tra le altre cose, si parlò come sia possibile mangiare bene per favorire la salute di ognuno di noi e del pianeta, tutto questo senza sacrificare il gusto. Il Premio Pezcoller-Marina Larcher Fogazzaro-EACR Women in Cancer Research celebra una ricercatrice oncologica che abbia dimostrato eccellenza accademica e realizzazioni nel campo della ricerca sul cancro e che abbia, tramite leadership o esempio, promosso l'avanzamento delle donne nella ricerca sul cancro. Il premio viene consegnato annualmente al Congresso EACR a un ricercatore di eccellenza che ha trascorso la maggior parte della propria carriera di ricerca in Europa, e il vincitore riceve un premio di 10.000 euro. Maria Rescigno terrà la conferenza del Premio Pezcoller-Marina Larcher Fogazzaro-EACR Women in Cancer Research al Congresso EACR 2024 che si terrà a Rotterdam dal 10 al 13 giugno 2024. Sarà inoltre invitata a tenere una conferenza a Trento presso la Fondazione Pezcoller. Sabato 2 dicembre a Piacenza: presentazione del libro "Il genio ribelle. Luigi Illica, una vita da Bohème". Sabato 2 dicembre alle ore 18:30 presso il Ridotto del Teatro Municipale di Piacenza, la rassegna LibrinScena culminerà in un evento da non perdere: la presentazione del libro "Il genio ribelle. Luigi Illica, una vita da Bohème". Giangiacomo Schiavi, editorialista del Corriere della Sera, svela la vita affascinante di questo geniale e ribelle librettista. Da Castell'Arquato a Milano, Illica si fa strada come uno dei protagonisti più influenti della storia teatrale e musicale dell'epoca. Una Milano scapigliata, le intese con Puccini, le liti con Giacosa e il dissenso con Toscanini: Schiavi dipinge un ritratto avvincente di questo personaggio indimenticabile che ha segnato un'era artistica senza tempo. Un finale coinvolgente per una rassegna, LibrinScena, che ha saputo svelare gli intricati legami tra teatro, musica e le vite straordinarie dei suoi protagonisti. Per informazioni, si può inviare una mail o telefonare alla Fondazione Teatri di Piacenza. Aprile 2024: premiazione degli studenti vincitori del concorso didattico "Si può fare!" A fine aprile 2024 ci sarà una serata (in data da definire) in cui verranno premiati gli alunni delle scuole medie che hanno partecipato alla settima edizione di Si può fare!, un progetto educativo gratuito che si rivolge agli alunni delle classi seconde della scuola secondaria di primo grado. Questo progetto sta avendo molto successo nelle scuole italiane: nella scorsa edizione si sono iscritti più di 780 ragazzi della scuola superiore di primo grado, e anche 136 studenti provenienti da Inghilterra, Croazia e Slovenia. Ai ragazzi in gara viene consegnato un kit di materiale (palloncini, cannucce, elastici, dischetti di cartone, etc,) con il quale dovranno costruire un giocattolo funzionante. Le varie squadre, composte da gruppetti di 4/5 alunni, presenteranno i lavori in classe, e una giuria, alla quale parteciperà anche un giornalista del magazine Focus, valuterà i giocattoli migliori. Il progetto "Si può fare!" è un'attività di team working e problem solving: i ragazzi, infatti, si sperimentano come progettisti (elaborando l'idea del giocattolo e facendone il disegno tecnico); costruttori (realizzando materialmente il giocattolo); promotori (lavorando allo slogan e poi presentando il lavoro); redattori (stesura del diario di bordo.) In questo modo, gli studenti sono quindi chiamati a coprire concretamente quei ruoli che un domani saranno importanti anche nel mondo del lavoro e che, anche se in forme nuove e innovative, saranno ancora strategici. Il concorso "Si può fare!" è diventato un ottimo strumento per gli insegnanti che, osservando i propri alunni lavorare, acquisiscono preziose informazioni per il loro orientamento scolastico alla scuola superiore. Per informazioni Federico Andreoletti (presidente(at)aghimagnetici.it). Il progetto Si può fare! è organizzato da Confindustria Brescia, Federmeccanica e dall'Associazione di divulgazione scientifica Aghi Magnetici. 16 novembre 2023: One Ocean Summit YOUNG a milano Il 16 novembre 2023 a Milano, presso il Teatro Franco Parenti, si terrà One Ocean Summit YOUNG, il primo format di eventi dedicato al mare per i giovani che si pone come punto di riferimento nell'educazione ambientale del mare per le nuove generazioni. L'evento, presentato da One Ocean Foundation, realtà non profit italiana operante a livello internazionale per la tutela dell'ambiente marino, vedrà la partecipazione di studenti delle scuole superiori di Milano e provincia e di Associazioni giovanili del territorio, invitati a intraprendere un viaggio narrativo lungo i sentieri dell'acqua, la sua presenza essenziale nella nostra vita e il suo percorso dal cuore delle città fino al mare. Testimoni e esperti, come la ricercatrice Monica Montefalcone, la campionessa olimpionica di vela Katja Salskov-Iversen e l'atleta paralimpico Daniele Cassioli, ci guideranno nella comprensione dei temi essenziali per poter affrontare e risolvere le sfide che minacciano la salute degli ecosistemi marini, dall'importanza dell'acqua all'inquinamento urbano. Per informazioni: One Ocean Summit DAL 22 OTTOBRE AL 13 NOVEMBRE 2023: FESTIVAL MAHLER A MILANO L'Orchestra Sinfonica di Milano, al giro di boa dei primi trent'anni della sua attività, lancia una sfida nel panorama sinfonico italiano, chiamando a raccolta le grandi orchestre nazionali per celebrare forse l'autore più caro al pubblico dell'Orchestra, Gustav Mahler. Tre settimane intere dedicate al repertorio di Gustav Mahler, all'Auditorium di Milano, dal 22 ottobre al 13 novembre 2023, l'integrale delle Sinfonie e dei Lieder per orchestra del compositore boemo. Per la prima volta ritroviamo chiamate all'appello le grandi orchestre sinfoniche italiane, in un Festival che potrebbe essere elevato a emblema della grande cultura sinfonica del nostro Paese: 14 gli appuntamenti che compongono un Festival in cui concorrono 10 istituzioni sinfoniche, la Filarmonica della Scala diretta da Riccardo Chailly, l'Orchestra dell'Accademia Nazionale di Santa Cecilia guidata da Manfred Honeck, la Spira mirabilis, l'Orchestra I Pomeriggi Musicali diretta da James Feddeck, l'Orchestra della Toscana insieme all'Orchestra Giovanile Italiana dirette da Markus Stenz, l'Orchestra Sinfonica Nazionale della Rai con Robert Treviño sul podio, l'Orchestra della Fondazione Arena di Verona sotto la direzione da Marco Angius, l'Orchestra Haydn di Bolzano e Trento sotto la bacchetta da Ottavio Dantone e la Filarmonica Arturo Toscanini diretta da Omer Meir Wellber. Per informazioni: https://sinfonicadimilano.org/ Da mercoledì 15 novembre 2023, A MILANO Riapre al pubblico la Sala del Cenacolo del Museo Nazionale Scienza e Tecnologia Leonardo da Vinci, dopo un importante restauro. La sala è l'antico refettorio del complesso monumentale del monastero Olivetano di San Vittore del XVI secolo, in cui ha sede il Museo dal 1953, anno della sua inaugurazione, ed è stata costruita tra il 1709 e il 1712 in occasione dell'ampliamento del Monastero. Grazie al lavoro effettuato sugli stucchi e sugli affreschi è stata restituita la bellezza originaria a una delle poche testimonianze rimaste a Milano di Barocchetto Lombardo in ambito religioso: la parete di fondo ospita il grande affresco delle Nozze di Cana di Pietro Gilardi mentre la volta ribassata e le pareti laterali presentano una serie di articolate quadrature architettoniche, con scene bibliche a monocromo tratte dall'Antico Testamento. Attraverso un intervento di consolidamento, pulitura e integrazione pittorica è stata restituita la possibilità di apprezzare la ricca decorazione di uno dei luoghi più suggestivi del Museo, riportando alla luce i colori e le dorature che il trascorrere del tempo e le vicende storiche avevano alterato. Per informazioni: Museo Nazionale Scienza e Tecnologia Leonardo da Vinci 8 LUGLIO 2023 ORE 18.00, CASTELL'ARQUATO: "IL GENIO RIBELLE. LUIGI ILLICA, UNA VITA DA BOHÈME" L'8 luglio alle ore 18 nei giardini di Palazzo Vigevani Gravaghi del borgo medioevale di Castell'Arquato si potrà assistere alla presentazione del libro Il genio ribelle. Luigi Illaca, una vita da Bohème dedicato al librettista, commediografo, scrittore e giornalista arquatese. Saranno presenti il giornalista Giangiacomo Schiavi, editorialista del Corriere della Sera, Gianni Canova, rettore dell'università IULM di Milano, Carlo Fontana presidente di Impresa Cultura Italia, già Sovrintendente Teatro alla Scala, e Massimo Baucia, conservatore del Fondo Antico della Biblioteca Passerini-Landi. È fitto il programma del festival dedicato al celebre librettista delle opere di Giacomo Puccini e di altri compositori a cavallo fra '800 e '900. Questi gli eventi del festival. giovedì 29 giugno 2023 - ore 20.30: "Una serata con Ennio Morricone" all'Auditorium di Milano Ennio Morricone è il protagonista del concerto che si terrà giovedì 29 giugno alle ore 20.30 all'Auditorium di Milano: l'apppuntamento, che celebra il premio Oscar con una selezione delle sue più celebri musiche, fa parte della mini-rassegna estiva proposta dall'Orchestra di Largo Mahler e tutta dedicata alle colonne sonore. Durante "Una serata con Ennio Morricone" si potranno ascoltare, tra le altre, le musiche nate da uno dei sodalizi più felici e prolifici della storia del cinema, quello con Sergio Leone: dalle melodie di C'era una volta in America (1984) fino alle musiche di Il buono, il brutto e il cattivo (1966), passando per le affascinanti sonorità di Giù la testa (1971). Ci sarà la possibilità di ascoltare anche le colonne sonore di grandi pellicole tutte italiane come Nuovo Cinema Paradiso o di Indagine di un cittadino al di sopra di ogni sospetto, con un grande Gian Maria Volontè nel ruolo di protagonista. Prossimo appuntamento: giovedì 13 luglio 2023 con "Una serata da Supereroi" che passerà in rassegna le musiche di Superman, Batman, Thor, Iron Man 3, Spiderman, i Fantastici 4 e X Men. Per informazioni: T. 02 83389.401, e-mail: biglietteria@sinfonicadimilano.org Dal 20 maggio al 18 giugno 2023: "DIPINGERE INSIEME", MOSTRA A CASTELL'ARQUATO Il comune di Castell'Arquato, in provincia di Piacenza, ospita "Dipingere insieme", l'esposizione del lavoro di dieci allievi internazionali dell'artista Giancarlo Bargoni, affermato pittore a livello internazionale, nato a Genova nel 1936 ma castellano di adozione, che vive e lavora tra la Francia e Castell'Arquato.La Mostra coinvolge dieci pittori con esperienze diverse, discepoli accompagnati con grande professionalità e generosità dalla guida di Giancarlo Bargoni. Moderni allievi di bottega che arrivano, grazie alla guida dell'artista maturo, a definire il loro spessore artistico e a proporsi in modo autonomo. In esposizione venti quadri di cui due del maestro Giancarlo Bargoni. Per saperne di più, clicca qui. 14 maggio 2023: L'Azalea della Ricerca di Fondazione AIRC Domenica 14 maggio, Festa della Mamma, appuntamento con i volontari Airc nelle piazze italiane. Ventimila volontari dei 17 comitati regionali tornano in oltre 3.600 piazze per distribuire l'Azalea della Ricerca a fronte di una donazione di 18 euro, per sostenere il lavoro dei ricercatori AIRC. Insieme alla pianta verrà consegnata la speciale Guida con informazioni sulla prevenzione 'età per età'. "La forza delle donne" è il messaggio che AIRC vuole trasmettere attraverso questa campagna per tutto il mese di maggio: la stessa forza che parte dalla ricerca, arr'''
