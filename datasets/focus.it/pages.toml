title = "Cosa sarebbe successo se non ci fosse stata la peste nera? -  Focus.it"
description = "Se non fosse arrivata in Europa l'epidemia di peste che, tra il 1347 e il 1352, uccise almeno 20 milioni di persone, probabilmente non avremmo avuto il Rinascimento."
full_description = '''Curiosità Cosa sarebbe successo se non ci fosse stata la peste nera? Se non fosse arrivata in Europa l'epidemia di peste che, tra il 1347 e il 1352, uccise almeno 20 milioni di persone, probabilmente non avremmo avuto il Rinascimento. Una miniatura tratta dalla Bibbia di Toggenburg (1411). Wikimedia Commons Se non ci fosse stata la peste nera (il morbo che solo in Europa uccise in 18 mesi un terzo della popolazione), al di là dei benefici immediati, alla lunga non avremmo forse avuto il Rinascimento. Crollo demografico. Nel dettaglio, se la "peste nera" non avesse colpito il continente europeo, quest'ultimo non avrebbe perso, tra il 1347 e il 1353, oltre 20 milioni di vite: un terzo della popolazione. Ma fu proprio il crollo demografico a contribuire a creare, negli anni seguenti, le condizioni per la nascita di un nuovo modello economico. Comportamento Firenze, la Silicon Valley del Rinascimento Svolta economica. L'alto tasso di mortalità comportò un drastico calo della forza lavoro e un aumento dei salari, permettendo ai sopravvissuti di avere un tenore di vita più elevato. Comportamento Quale fu il primo crack finanziario della Storia? Le premesse del Rinascimento. A livello culturale, questo "sprint economico" creò un contesto ideale, soprattutto in Italia, affinché si sviluppasse una nuova concezione dell'uomo e dell'universo. Tutte premesse necessarie alla nascita di un nuovo gusto artistico alla base dell'Umanesimo e, appunto, del Rinascimento. 25 febbraio 2025 Focus.it Tag cultura - curiosità - peste - peste nera - rinascimento - peste del trecento'''
year_published = 2025
