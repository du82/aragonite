title = "Guardare il tuo cane ti connette al suo cervello -  Focus.it"
description = "Uno scambio di sguardi tra cane e padrone porta a sincronizzare i rispettivi cervelli: un meccanismo che assomiglia a quello che scatta tra due umani."
full_description = '''Animali Guardare negli occhi il tuo cane ti connette al suo cervello Uno scambio di sguardi tra cane e padrone porta a sincronizzare i rispettivi cervelli: un meccanismo che assomiglia a quello che scatta tra due umani. Guardare il vostro cane negli occhi migliora il vostro rapporto. N K / Shutterstock Il rapporto tra cane e padrone è sempre speciale. Talmente speciale, suggerisce uno studio condotto in Cina e pubblicato su Advanced Science, che quando i due si scambiano uno sguardo, i loro cervelli si sincronizzano, un meccanismo che assomiglia molto a quello che scatta quando due umani hanno una conversazione. Ora vi spieghiamo meglio cosa si intende, e cosa c'entra l'LSD con questo studio. Cos'è l'accoppiamento neurale. Alla base dello studio c'è un fenomeno noto come neural coupling, che potremmo tradurre in "accoppiamento neurale", e che è diffuso nel mondo animale tra le specie sociali: l'abbiamo visto in azione nei topi, nei pipistrelli, in altri primati e ovviamente negli umani. Per capirci, è quello che succede nella nostra testa durante una conversazione, o quando ascoltiamo un'altra persona che racconta una storia: il nostro cervello e quello dell'interlocutore "si sincronizzano", nel senso che attivano le stesse aree relative all'attenzione e alla socialità. Questa sincronia permette alla nostra specie (e non solo, ovviamente) di collaborare, e di imparare da azioni e parole altrui. È molto più raro, però, che l'accoppiamento neurale avvenga tra specie diverse: lo studio cinese ha dimostrato che può succedere tra uomo e cane. Ambiente Come far scodinzolare felice la coda del nostro cane? 5 consigli per animali contenti (e sani) Cosa c'entra l'LSD? La verifica è arrivata sperimentalmente, monitorando l'attività cerebrale di un gruppo di uomini e beagle che non si conoscevano prima dell'esperimento. Quando hanno cominciato a interagire e guardarsi negli occhi, i loro cervelli hanno cominciato a sincronizzarsi, un'armonia che è migliorata nel corso dei cinque giorni dell'esperimento. Che è stato poi ripetuto con un gruppo di cani con una mutazione in un gene che può causare problemi di trasmissione dei segnali cerebrali, e in particolare disturbi dell'attenzione. Questi cani hanno fatto più fatica a sincronizzarsi con gli umani – almeno finché non è stata data loro una piccola dose di LSD, che aiuta a mantenere l'attenzione e facilita il comportamento sociale. Questo non significa che dovete drogare i vostri cani! Imparate però a guardarli negli occhi, ricordandovi che state lavorando per migliorare il vostro rapporto. 9 FOTO Fotogallery 100 anni di evoluzione dei cani VAI ALLA GALLERY Fotogallery 100 anni di evoluzione dei cani Il Saluki (levriero persiano) è probabilmente la più antica fra le razze canine conosciute: è stata selezionata nella "Mezzaluna fertile" (Medio Oriente) quasi 7.000 anni fa. Dall'inizio dell'amicizia tra uomo e cane, circa 100 mila anni fa, gli spostamenti dell'uomo in diverse regioni del mondo hanno fatto sì che si arrivasse a 400 razze canine differenti. Ma come si sono evolute alcune razze rispetto a com'erano 100 anni fa? Vediamo. Foto: © Shutterstock Ai primi del Novecento, qualcuno ha contato 167 razze canine. Ma come sono cambiate nel tempo? Il blog Science and Dogs ha provato a confrontare le foto di oggi con quelle apparse 100 anni fa nel libro "Dogs of all nations" (1915). L'accostamento delle foto dimostra come gli incroci e la selezione ha plasmato e trasformato alcune razze. Il Basset Hound ieri e oggi. Il Basset Hound è una razza creata in Francia e poi importata in Inghilterra nel 1800 e poi nuovamente sviluppata negli Usa. Oggi appare più basso rispetto al passato e anche le orecchie sembrano più grandi. Adv Il Bull Terrier ieri e oggi. È la razza che ha subito la trasformazione più evidente. Nel libro "Dogs of all nations", appare molto più slanciato e soprattutto con il muso più naturale. Ora il muso è più appuntito e anche l'adddome è molto diverso.Il Bull Terrier è una razza nata in Gran Bretagna. Veniva usata soprattutto nei combattimenti con i tori. Il pastore tedesco ieri e oggi. Le zampe posteriori oggi sono più basse che in passato. In "Dogs of Nation" il pastore tedesco era descritto come un animale agile e veloce. Oggi è diventato molto più massiccio e pesante. Il Carlino ieri e oggi. Il carlino di oggi è più piccolo del precedente. Si è ridotto tramite selezione. Il carlino arrivò in Europa tra il '500 e il '600 dalla Cina. Adv Il bassotto ieri e oggi. Il bassotto (Dachshund) è una creazione di allevatori tedeschi. Rispetto al passato si è allungato e le gambe si sono oltremodo accorciate. Il San Bernardo ieri e oggi. Il San Bernardo di oggi è molto più grande del passato, mentre il muso appare più corto. Si pensa che l’origine della razza risalga ai grossi mastini che le legioni romane lasciavano con le truppe destinate a presidiare i punti strategici sulle grandi vie di comunicazione. Il suo nome deriva dalla fatto che vennero usati nell’Ospizio situato al Colle San Bernardo verso il 1660 sia come cani da soccorso che per altri usi. Il bulldog inglese ieri e oggi. Gambe più corte e muso più schiacciato. Come dice il nome, il bulldog era "nato" come cane da combattimento contro i tori. Adv Approfondimenti Animali Davvero i cani di razza mista sono più sani? Animali I cani annusano il nostro stress (e ne soffrono) Cani Una scoperta sulle dimensioni del cervello Innovazione UK: i cani mangeranno carne coltivata Animali La citizen science per contare i cani randagi Animali I cani comunicano (anche) battendo gli occhi Salute Animali: parli col cane? Studio dimostra che il suo cervello cerca di capire Animali Cani: la voce del padrone come quella di una madre Psicologia Ascolto selettivo, ecco come il cervello seleziona i suoni 24 novembre 2024 Gabriele Ferrari Tag ambiente - animali - cani - occhi - occhio - occhio umano - sguardo'''
