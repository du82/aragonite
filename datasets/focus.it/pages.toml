title = "Che cos'è la finanza etica -  Focus.it"
description = "Domande e risposte per capire i fondamenti della finanza etica."
full_description = "Speciale Che cos'è la finanza etica 01:08 Quali differenze tra finanza e finanza etica? 01:13 Blue Economy e finanza etica 01:08 I nostri investimenti possono avere impatti positivi sull'ambiente? 01:21 Nelle crisi i fondi etici sono meno rischiosi? In questo numero di Focus Storia ci immergiamo nella Belle Époque, un’epoca di straordinari cambiamenti che, tra invenzioni, arte e progresso, fece brillare l’Europa fino alla Prima guerra mondiale. Dalle origini del turismo al trionfo dell’Art Nouveau, dai fasti della borghesia ai grandi personaggi che segnarono quel periodo, ripercorriamo un’epoca tanto affascinante quanto effimera. In questo numero di Focus andiamo alla scoperta dei misteri dell’universo e delle possibilità di vita oltre la Terra. Il dossier centrale esplora l’origine del Sistema Solare e i luoghi più promettenti per trovare tracce di vita: dagli oceani nascosti delle lune di Giove e Saturno, al passato acquoso di Marte, fino alle missioni del futuro che sfidano i confini tra scienza e fantascienza."
