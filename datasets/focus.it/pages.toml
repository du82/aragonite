in alcun formato, se non per il loro uso esclusivamente personale, non commerciale e domestico da parte dell’utente, così come consentito dalla legge sul diritto d’autore (Legge n. 633 del 22 aprile 1941) ed in ogni caso senza che venga arrecato alcun pregiudizio agli interessi economici e morali del titolare di diritti di privativa e/o di utilizzazione sugli stessi. Tutti i Contenuti presenti nel Sito sono di titolarità esclusiva di Mondadori Scienza S.P.A. Pertanto, è vietata ogni forma di estrazione e acquisizione degli stessi per le finalità di alimentazione di sistemi di Intelligenza Artificiale. 2. BANNER PUBBLICITARI E COLLEGAMENTO AD ALTRI SITI Il Sito contiene collegamenti ipertestuali ad altri siti esterni al Sito e banner pubblicitari e promozionali dei prodotti e/o servizi, ivi incluse a titolo esemplificativo le testate, di MONDADORI e/o di prodotti e/o servizi di terzi. Facendo clic sui collegamenti ipertestuali e/o sui banner pubblicitari, gli utenti sono indirizzati ai siti esterni al Sito dei relativi inserzionisti; tali siti e tutti i contenuti degli stessi non rientrano nel controllo e/o nella responsabilità di MONDADORI e la stessa non è in grado di garantire né l’affidabilità delle informazioni e/o dei dati e/o dei contenuti ivi proposti, né che le condizioni d’uso e/o le norme di tutela della privacy applicati a detti siti non siano differenti dalle Condizioni. 3. ACCETTAZIONE DELLE CONDIZIONI - REGISTRAZIONE ALLA COMMUNITY PER POTERSI REGISTRARE ALLA COMMUNITY ED UTILIZZARE I SERVIZI OFFERTI SUL SITO, È NECESSARIO CHE L’UTENTE ACCETTI PREVENTIVAMENTE LE CONDIZIONI. La registrazione alla Community consente agli utenti registrati di accedere ed usufruire di tutti i servizi offerti dalla Community e/o dal Sito, ivi inclusi, a titolo esemplificativo, sondaggi e test che prevedano concorsi a premi collegati, oltre al caricamento di foto e video nella piattaforma della Community. La registrazione alla Community dovrà avvenire secondo la procedura guidata indicata nel Sito; all’utente sarà richiesto di compilare un modulo, fornendo alcune informazioni e dati di carattere personale, di accettare le Condizioni ed acconsentire al trattamento dei suoi dati personali, dopo aver preso visione della Informativa ai sensi del D.Lgs. 196/2003. L’UTENTE GARANTISCE CHE LE INFORMAZIONI ED I DATI DI CARATTERE PERSONALE DI CUI VERRÀ RICHIESTO L’INSERIMENTO SARANNO QUELLI DELL’UTENTE, CORRETTI E VERITIERI. L’UTENTE SI IMPEGNA AD AGGIORNARLI TEMPESTIVAMENTE IN CASO DI BISOGNO. La registrazione alla Community è gratuita. Nel caso di utente minore di età, è necessario che l’utente chieda il permesso ai propri genitori o a chi ne fa le veci (ad es. tutori, etc…) per la registrazione alla Community e confermi di avere tale permesso fornendo il loro indirizzo email. Verrà inviata una comunicazione all’indirizzo email indicato dei genitori (e/o di chi ne fà le veci) dell’utente minore di età, informandoli dell’avvenuta registrazione dell’utente minore di età alla Community e, in base all’età dell’utente minore, potrà essere chiesto ai genitori o a chi ne fà le veci conferma del loro consenso a detta registrazione. L’utente minore di età è pregato di non inviare né spedire dati e/o informazioni a MONDADORI senza il consenso dei propri genitori e/o di chi ne fà le veci. Una volta conclusa la registrazione alla Community, l’utente riceverà via e-mail conferma dei codici di accesso personali, la Password e lo User Name, scelti dall’utente. L’UTENTE SI IMPEGNA A CUSTODIRE CON DILIGENZA I CODICI DI ACCESSO PERSONALI E PRENDE ATTO CHE LA LORO COMUNICAZIONE A TERZI E/O IL LORO UTILIZZO DA PARTE DI TERZI NON È CONSENTITO E POTRÀ COMPORTARE LA RESPONSABILITÀ DELL’UTENTE MEDESIMO. MONDADORI non sarà responsabile nel caso di comunicazione a terzi dei codici di accesso personali da parte dell’utente e/o di utilizzo dei medesimi da parte di terzi diversi dall’utente. Se l’utente ha motivo di ritenere che un terzo utilizzi indebitamente i suoi codici di accesso personali dovrà immediatamente informarne MONDADORI. Nei predetti casi, MONDADORI si riserva il diritto di sospendere o interrompere l’accesso dell’utente ai servizi per il quali il medesimo si è registrato. L’utente registrato riconosce che la Community è di natura pubblica e non è destinata a contenere comunicazioni di carattere privato, né potrà essere utilizzata per svolgere attività commerciali e/o pubblicare messaggi promozionali e/o pubblicitari di qualsiasi natura. Nella fruizione dei servizi della Community, l’utente registrato si impegna a tenere un comportamento corretto e, pertanto, a non utilizzare linguaggio o immagini osceni, indecenti, violenti, offensivi, razzisti o xenofobi ed a non diffondere alcun materiale di natura diffamatoria, ingiuriosa o che violi diritti e/o la privacy di terzi e/o incoraggi condotte criminose e/o illecite e che possa esporre MONDADORI a qualsiasi responsabilità, sia di natura civile che penale. 4. MATERIALI INVIATI E CONTRIBUTI CARICATI–PUBBLICAZIONE E DIVULGAZIONE MONDADORI è lieta che gli utenti inviino a quest’ultima i loro materiali, inclusi, a titolo esemplificativo e non limitativo, materiali, opere, fotografie, disegni, articoli, testi, sequenze audio, sequenze di immagini in movimento, con o senza audio, dati, informazioni e commenti (i “Materiali”). MONDADORI è inoltre lieta che gli utenti partecipino ai servizi della Community e/o del Sito ed immettano e/o carichino direttamente nelle aree riservate degli stessi, incluse a titolo esemplificativo i loro materiali, opere, fotografie, disegni, articoli, testi, sequenze audio, sequenze di immagini in movimento, con o senza audio, commenti, consigli, opinioni, informazioni e dati (i “Contributi”). L’invio dei Materiali a MONDADORI ed il caricamento dei Contributi sul Sito da parte degli utenti è soggetto alle Condizioni. Il caricamento dei Contributi sul Sito dovrà avvenire secondo le procedure ed utilizzando i mezzi previsti dalla partecipazione dell’utente ai servizi della Community. I supporti e/o i media contenenti i Materiali inviati a MONDADORI non verranno dalla stessa in alcun caso restituiti. Per ragioni ed esigenze editoriali, i Materiali inviati a MONDADORI saranno o meno pubblicati e/o comunicati al pubblico sul Sito ad insindacabile giudizio di MONDADORI. CON L’INVIO DEI MATERIALI A MONDADORI E/O IL CARICAMENTO DEI CONTRIBUTI SUL SITO, GLI UTENTI AUTORIZZANO ESPRESSAMENTE MONDADORI ALLA PUBBLICAZIONE E/O COMUNICAZIONE AL PUBBLICO DEGLI STESSI TRAMITE I SEGUENTI CANALI: SITO E/O APPLICAZIONI DIGITALI E/O LIBRI E/O PRODOTTI EDITORIALI E/O TESTATE (CARTACEE E/O ON LINE) DI MONDADORI E/O EDITE DA TERZI IN BASE AD ACCORDI CON MONDADORI, UNA O PIU’ VOLTE E SENZA LIMITAZIONE DI TEMPO E SENZA CHE SIA DOVUTO ALCUN INDENNIZZO E/O COMPENSO ALL’UTENTE E/O AD ALTRA PERSONA. L’UTENTE E’ CONSAPEVOLE CHE I MATERIALI INVIATI ED I CONTRIBUTI CARICATI SUL SITO, POTREBBERO ESSERE COPIATI, MODIFICATI, TRASMESSI E/O IN ALTRO MODO DIFFUSI DA PARTE DI TERZI E SI ASSUME OGNI RESPONSABILITA’ IN TAL SENSO, MANLEVANDO E TENENDO INDENNE MONDADORI. SI PRECISA CHE LA PUBBLICAZIONE DEI MATERIALI E DEI CONTRIBUTI OLTRE A NON COMPORTARE L’EROGAZIONE DI ALCUN INDENNIZZO E/O CONTRIBUTO DA PARTE DI MONDADORI A FAVORE DELL’UTENTE, NON PUO’ ESSERE INTESA COME ESERCIZIO DELLA PROFESSIONE GIORNALISTICA O DI RICHIESTA PER L’AMMISSIONE ALL’ISCRIZIONE NEL REGISTRO DEI PRATICANTI GIORNALISTI DI CUI AGLI ARTICOLI 26 E 33 DELLA LEGGE 3 FEBBRAIO 1963, N. 69. MONDADORI segnala che, ai sensi della legge sul diritto d’autore (Legge n. 633 del 22 aprile 1941), non sono considerati abusivi la riproduzione, la diffusione e lo spaccio di fotografie che non riportino l’indicazione dell’anno di loro realizzazione ed il nome del loro autore. NEL CASO L’UTENTE DESIDERI CHE I TERZI SIANO EDOTTI CHE L’UTILIZZO DELLE FOTOGRAFIE INVIATE A MONDADORI E/O CARICATE SUL SITO È RISERVATO, L’UTENTE DOVRÀ AVER CURA CHE LE FOTOGRAFIE, ANCHE IN FORMATO DIGITALE, CONTENGANO