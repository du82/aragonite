["https://focus.it/ambiente/animali/gatto-fa-fusa-a-tutti"]
title = "Il tuo gatto è amichevole anche con chi ti tratta male? -  Focus.it"
description = "Sembra che il gatto, a differenza del cane, non abbia problemi ad accettare da mangiare da chi tratta male il suo padrone. Ma c'è una spiegazione."
full_description = '''Speciale in collaborazione con Domande e Risposte Animali Il tuo gatto è amichevole anche con chi ti tratta male? La pappa è sempre la pappa... Sembra che il gatto, a differenza del cane, non abbia problemi ad accettare da mangiare da chi tratta male il suo padrone. Ma c'è una spiegazione. Nulla potrebbe indurlo a rinunciare a una ciotolina piena. Shutterstock Come funziona il rapporto tra uomo e gatto? È vero che c'è una differenza fondamentale tra il gatto e il cane, e che il primo non stringe, con gli umani, rapporti profondi quanto il secondo? Lo stereotipo del gatto indifferente è stato in parte demolito negli ultimi anni da una serie di studi che dimostrano come anche i gatti siano capaci di lealtà e rapporti profondi con noi umani, ma un nuovo studio che arriva dal Giappone sembra andare nella direzione opposta: stando a quanto si legge nel lavoro pubblicato su Animal Behavior and Cognition, il gatto, a differenza del cane, non si fa alcun problema a dimostrare affetto nei confronti di una persona che si è dimostrata ostile verso il padrone. Ambiente Sai che cosa ti dice il tuo gatto? L'esperimento descritto nello studio, condotto da un team dell'università di Kyoto, è la replica felina di un altro esperimento identico inventato per i cani. Prevede di prendere il gatto e il suo padrone e metterli in una stanza insieme a una scatola chiusa e a due sconosciuti. La scatola è impossibile da aprire per una sola persona, e i due sconosciuti rappresentano due atteggiamenti opposti di fronte alla situazione: uno aiuta il padrone del gatto, l'altro lo ignora. il gatto in scatola. Dopodiché, entrambi gli sconosciuti offrono del cibo al gatto: quando l'esperimento è stato condotto sui cani, questi ultimi hanno sempre dimostrato una preferenza evidente verso l'umano che ha aiutato il padrone, e indifferenza o addirittura ostilità verso quello che non ha alzato un dito. Al contrario, i gatti non hanno mostrato alcuna preferenza e nessuna voglia di evitare l'umano "cattivo": di fronte al cibo non c'è legame affettivo che tenga. Ambiente Capire i gatti? È un talento naturale Quindi il gatto è indifferente al destino del suo umano? Così potrebbe sembrare, ma secondo Ali Boyle, la ricercatrice di Cambridge - esperta di intelligenza animale - che ha raccontato lo studio giapponese su The Conversation, l'interpretazione dei risultati è più complessa. Non lo fanno apposta. Secondo Boyle, interpretare i risultati dicendo che i gatti non sono interessati a ciò che ci accade significa antropomorfizzare i loro comportamenti, ed è invece più probabile che il motivo per cui nell'esperimento non hanno dimostrato preferenze è che i felini non sono in grado di leggere così bene i nostri comportamenti sociali, e dunque non capiscono che uno dei due umani è "buono" e l'altro "cattivo". Secondo Boyle, insomma, non è vero che i gatti se ne fregano se qualcuno ci tratta male: semplicemente, non se ne accorgono. 11 FOTO Fotogallery 10 curiosità scientifiche sui gatti VAI ALLA GALLERY Fotogallery 10 curiosità scientifiche sui gatti Perché sbirciano e si avventurano in posti strani? Negli ambienti naturali, le prede tendono naturalmente a nascondersi in luoghi poco raggiungibili. L'istinto che spinge i mici di casa ad avventurarsi negli angolini nascosti della casa, o finire nelle borse vuote della spesa. è un retaggio della curiosità che ha garantito la loro sopravvivenza nell'arco della loro storia evolutiva (e che ha riempito loro lo stomaco). Foto: © Shutterstock Chi vive con un gatto non si annoia mai: tra "agguati" improvvisi, fughe, nascondigli, giochi e arrampicate, i nostri amici felini conservano ancora molti dei comportamenti che hanno permesso loro di sopravvivere in natura per milioni di anni. Ecco perché ai nostri occhi, alcune di queste abitudini sembrano così bizzarre: per i gatti, la nostra casa è una giungla da esplorare, piena di prede e nemici immaginari. Ispirati da un video di TED, abbiamo selezionato i gesti da gatto apparentemente più strani, che riportiamo assieme alla loro spiegazione scientifica. Foto: © Rana Refat, Flickr Perché si arrampicano nei posti più alti di casa? In natura, le spiccate doti da equilibristi e muscoli scolpiti ad hoc hanno sempre permesso ai gatti di raggiungere posizioni di vantaggio ed esplorare i dintorni dall'alto, in cerca di prede. E anche se oggi non hanno certo bisogno di salire sulle tende, per vedere dove abbiamo messo i croccantini, sono ancora istintivamente programmati per dominare la casa con un solo sguardo. Leggi anche: La fisica dei gatti Foto: © Tommy Hemmer Tolesen, Flickr Adv Perché attaccano ogni piccolo oggetto che capiti a tiro? In libertà, i gatti sono predatori opportunisti e si nutrono di qualunque preda sia disponibile. In genere recuperano piccoli pasti, e per mantenersi sazi, cacciano e mangiano più volte al giorno, in dosi ridotte. Ecco perché si "accaniscono" su gomitoli, tappi, giocattoli di piccole dimensioni, e preferiscono nutrirsi più volte, ma a porzioni contenute. Perché i gatti sono così selettivi in fatto di cibo? Foto: © Ralf, Flickr Perché si fanno le unghie sul divano? Non è che detestino il vostro sofà, il tappeto nuovo o le tende appena montate. Semplicemente, fanno quello che hanno sempre fatto in natura: levigare gli artigli per essere pronti ad usarli per cacciare, arrampicarsi o difendersi. Per i loro antenati selvatici, avere unghie affilate era questione di sopravvivenza. E ieri come oggi, questa attività ha anche il pregio di distendere i muscoli delle zampe, e alleviare un po' di stress. Sai che cosa dice il tuo gatto? Scoprilo con un test Foto: © Ruth, Flickr Perché si addormentano nei luoghi più strani? Perché in quei posti si sentono al sicuro. In natura, i gatti non hanno solamente cacciato. Sono anche stati oggetto delle mire sgradite di altri predatori. Addormentarsi in luoghi difficilmente raggiungibili, o imprevedibili, è una forma di difesa nel momento in cui sono più vulnerabili. Foto: © Davis Morris, Flickr Adv Perché sono così attenti alla pulizia? Per lo stesso motivo, apprezzano particolarmente che la loro lettiera sia pulita e priva di odori sgradevoli. Non è (solo) una questione di igiene: l'odore di urina attirerebbe facilmente un vicino predatore, rivelando la loro posizione. Dietro l'apparente tendenza ad essere schizzinosi c'è quindi un importante istinto di sopravvivenza. 10 ragioni scientifiche per vivere con un gatto Foto: © Petra Wegner/Nature Picture Library/contrasto Perché fanno le fusa? Uno dei loro comportamenti più noti è anche quello dalle ragioni più misteriose. I gatti producono il caratteristico "brontolio" quando sono affamati o stressati, quando sono felici o quando hanno bisogno di attirare la nostra attenzione. Ma per alcuni studi, la particolare frequenza a cui le fusa sono emesse (tra i 25 e i 150 hertz) avrebbe anche una funzione rigeneratrice dei tessuti, e potrebbe servire a riparare ossa o muscoli danneggiati. Leggi anche: Perché gatti e cani fanno bene ai bambini? Foto: © Willem Jan van den Eijkhof, Flickr Perché amano le scatole? Almeno per tre ragioni: la prima, più ovvia, è la necessità istintiva di nascondersi dai predatori. La seconda è la funzione antistress degli involucri vuoti di cartone: è stato dimostrato che i gatti con una scatola a disposizione si adattano meglio ai nuovi ambienti, perché hanno un luogo dove scappare quando percepiscono ostilità. La terza ha a che fare con la temperatura. Il cartone è un perfetto isolante, e i gatti hanno bisogno di temperature di circa 10 gradi più alte delle nostre (tra i 30 e i 36 °C). Foto: © Stephen Woods, Flickr Adv Perché strofinano la mascella sulle mani di chi li accarezza? Lo fanno per marcare l'umano con il proprio odore: il gatto preme contro le mani, o contro le gambe, la parte superiore della testa, poi un lato della bocca e infine struscia tutto il fianco, attorcigliando leggermente la coda. Spesso ripete l'operazione più volte, per poi allontanarsi, sedersi e iniziare a leccarsi i fianchi. I gatti hanno infatti ghiandole odorifere, utilizzate anche per marcare il territorio, soprattutto sulle tempie, lungo la mascella, alla base della coda, sui cuscinetti delle zampe. Per questo, dopo essersi strofinato si siede e si lecca. Ci sta "assaggiando". Foto: © G Ross, Flickr Perché hanno bisogno di mangiare erba? In realtà i gatti di casa, nutriti in modo adeguato alle proprie necessità, non hanno bisogno di erba. Quelli che vivono liberi, invece, ingeriscono erba soprattutto per vomitare le parti non digeribili di quello che ha mangiato, per esempio penne e piume di uccelli o pelo di topo. L'erba, di solito appartenente alla famiglia delle graminacee, serve quindi a liberare lo stomaco da residui inutili, inducendo il vomito. Anche i gatti domestici possono comunque trovare irresistibile, come forma di gioco o da sbocconcellare, l'erba gatta, o catnip (Nepeta cataria), forse perché contiene nepetalactone, un terpene, che è ritenuto essere un surrogato dei feromoni sessuali felini. Foto: © Contrasto Approfondimenti Animali Capire i gatti? È un talento naturale Animali Dove vanno i gatti quando si allontanano? Animali Una strizzatina d'occhi e il gatto è conquistato Animali Il tuo gatto riconosce il suo nome? Animali I gatti non sono asociali. Gli umani, sì Animali Il gatto, uno dei migliori amici dell'uomo Animali Cani, niente cibo da chi tratta male i padroni Animali Stai mentendo al tuo cane? Farà di testa sua Animali Anche Fido è geloso 10 marzo 2021 Gabriele Ferrari Tag ambiente - animali - Gatti: curiosità e cose da sapere - comportamento animale - pet - animali domestici - focus domande e risposte - etologia'''
