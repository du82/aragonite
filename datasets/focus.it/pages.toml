["https://focus.it/scienza/scienze/un-gene-umano-fa-squittire-in-modo-strano-i-topi-potrebbe-aver-contribuito-all-origine-del-linguaggio"]
title = "Origini del linguaggio: un gene umano fa squittire in modo strano i topi -  Focus.it"
description = "Una variante genetica squisitamente umana e favorita dall'evoluzione sembra cambiare il modo in cui i topi che l'acquisiscono producono i suoni."
full_description = '''Scienze Un gene umano fa squittire in modo strano i topi: potrebbe aver contribuito all'origine del linguaggio Una variante genetica squisitamente umana e favorita dall'evoluzione sembra cambiare il modo in cui i topi che l'acquisiscono producono i suoni. Come si è evoluto il linguaggio umano? Shutterstock Una variante genetica presente in quasi tutti gli esseri umani, ma non nei loro cugini estinti Neanderthal e Denisoviani, fa diventare più complessi gli squittii dei topi nei quali viene introdotta. Gli scienziati sospettano che questa modifica possa essere una delle molte alterazioni del DNA che hanno avuto ruolo nello sviluppo del linguaggio umano. La ricerca guidata da Yoko Tajima del Laboratorio di neuro-oncologia molecolare della Rockefeller University di New York è stata pubblicata su Nature Communications. La nostra specialità. Le origini del linguaggio rimangono misteriose perché difficili da ricostruire a partire dalle sole prove archeologiche. Per quanto alcuni nostri stretti "parenti", come i Neanderthal, avessero caratteristiche anatomiche che permettevano la produzione e la comprensione di suoni parlati, e condividessero con i sapiens la variante di un gene (la FOXP2) collegata alle abilità linguistiche, solo il cervello dell'uomo moderno mostra un'espansione nelle regioni cruciali per il linguaggio. Cultura A quando risale l’uso del linguaggio? Una nuova pista. Il nuovo studio ha individuato una variante genetica esclusivamente umana e praticamente onnipresente nella nostra specie - una diversa versione di un gene noto come NOVA1, cruciale per lo sviluppo neurale - che potrebbe aver avuto un ruolo importante nello sviluppo del linguaggio parlato. Introdotta nei topi, la variante ha alterato i loro squittii, modificando il modo con cui i roditori comunicavano. Potremmo insomma essere di fronte a uno dei "geni del linguaggio", anche se certamente uno tra i tanti. Scienza Groenlandia: secoli d'isolamento hanno modellato i geni della popolazione I disturbi, se manca. Robert Darnell, neuroscienziato della Rockefeller University a capo del laboratorio dove lavora Tajima, conosceva il gene NOVA1 dagli anni '90: aveva intuito che potesse essere legato al linguaggio dopo aver trattato, da neurologo, un ragazzo recante una sola copia funzionante del gene, che presentava autismo e gravi problemi linguistici e di movimento. In seguito, altri studi hanno confermato che tutti gli esseri umani hanno una versione del gene distinta da quella dei Neanderthal e da quella che presentavano i denisoviani. Una sola lettera di differenza. Il NOVA1 produce una proteina legante l'RNA (cioè in grado di instaurare legami con l'RNA) nei neuroni che ha un ruolo nello sviluppo cerebrale e nel controllo neuromuscolare, alla base del linguaggio parlato. La versione umana della proteina, la variante I197V, differisce dalla versione di NOVA1 presente in tutti gli altri mammiferi e negli uccelli solamente per un singolo amminoacido. Un vantaggio che ci teniamo stretto. La variante del gene NOVA1 è presente praticamente in ogni uomo moderno: il gruppo di lavoro ha settaciato 650.000 genomi sequenziati in diversi database genetici e non l'ha trovata solo in 6 persone. Deve dunque esserci stata una forte pressione selettiva che ha favorito la diffusione di questa variante, probabilmente negli ultimi 300.000 anni, dopo la separazione dei nostri antenati da quelli di Neanderthal e Denisoviani. La modifica del gene deve essere risultata talmente vantaggiosa da divenire praticamente universale. Ambiente Gli scimpanzé parlano? No, ma dicono "mamma" Richiami mutati. Yoko Tajima ha usato la tecnica CRISPR per sostituire la versione del gene NOVA1 presente nei neuroni di topi con la variante umana. Le analisi degli squittii ultrasonici dei roditori hanno mostrato che i topi aventi la versione umanizzata del gene NOVA1 presentavano vocalizzi alterati e diversi da quelli "normali", quando venivano separati dalle loro madri. E che, in presenza di una femmina di topo in calore nella stessa gabbia, i topi maschi recanti la mutazione producevano richiami di corteggiamento più complessi. Siamo solo all'inizio. Dunque la variante del gene NOVA1 potrebbe aver contribuito a fare la differenza nelle nostre capacità linguistiche (posto che il tema delle modalità di comunicazione di Neanderthal e Denisoviani è, e resta, complesso). Ora gli autori dello studio vogliono capire in che modo la modifica genetica introdotta cambi le singole cellule delle regioni cerebrali dei topi implicate nella produzione e nella comprensione di vocalizzi. 27 febbraio 2025 Elisabetta Intini Tag scienza - scienze - linguaggio - neuroscienze - cervello - genetica - evoluzione - homo sapiens - neanderthal - uomo di Denisova - parola - suoni'''
