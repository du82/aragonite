["https://focus.it/cultura/storia/perche-e-cosi-importante-il-nuovo-affresco-ritrovato-a-pompei"]
title = "Perché è così importante il nuovo affresco ritrovato a Pompei? -  Focus.it"
description = "Una nuova scoperta a Pompei rivela una megalografia, un grande affresco di rara bellezza che dà uno spaccato unico sui culti misterici del I secolo a. C."
full_description = '''Storia Perché è così importante il nuovo grande affresco ritrovato a Pompei? Una nuova scoperta a Pompei rivela una megalografia, un grande affresco di rara bellezza che dà uno spaccato unico sui culti misterici del I secolo a. C. La “megalografia” (ovvero il fregio a dimensioni quasi reali) emersa nella grande sala per banchetti nell’area centrale di Pompei, nell’insula 10 della Regio IX. Ufficio stampa e comunicazione del Parco archeologico di Pompei Una scoperta eccezionale riporta alla luce un nuovo capitolo della storia di Pompei: una sala affrescata di straordinaria bellezza, battezzata "Casa del Tiaso", dove il mito di Dioniso prende vita attraverso scene di iniziazione e cortei bacchici. A più di un secolo dalla scoperta della celebre Villa dei Misteri, un nuovo tesoro archeologico getta luce sui culti misterici dell'antichità. Un fregio di rara bellezza Nel cuore dell'antica città, durante gli scavi nella Regio IX, è emersa una "megalografia", un fregio a grandezza naturale che decora le pareti di una "sala per banchetti". Le immagini raffigurano il corteo di Dioniso, con baccanti danzanti e cacciatrici feroci, satiri che suonano il flauto e scene di sacrificio. Al centro della composizione, una donna, simbolo dell'inizianda, si prepara a essere introdotta ai misteri del dio del vino, in un rituale notturno. Un dettaglio del nuovo grande affresco rinvenuto a Pompei, che mostra un giovane satiro che suona il doppio flauto. © Ufficio stampa e comunicazione del Parco archeologico di Pompei Dettagli sorprendenti e significati profondi Le figure del fregio, dipinte su piedistalli come statue, appaiono sorprendentemente vive, grazie alla resa dei movimenti, della carnagione e degli abiti. Un secondo fregio, più piccolo, raffigura scene di caccia, con animali vivi e morti, aggiungendo un ulteriore elemento ai rituali dionisiaci. Un tuffo nel passato Il fregio, risalente al I secolo a.C., offre uno spaccato unico sui culti misterici dell'epoca, dove l'iniziazione prometteva una nuova vita. La Casa del Tiaso, con i suoi affreschi carichi di simbolismo, si affianca alla Villa dei Misteri come testimonianza eccezionale di questi riti. Cultura Le persone rimaste sepolte a Pompei non erano chi pensavamo che fossero Una bellezza che si può già visitare La Casa del Tiaso è già accessibile al pubblico, con visite guidate al cantiere, previa prenotazione telefonica al numero al 327 2716666. Gli scavi nella Regio IX, iniziati nel 2023, hanno riportato alla luce oltre 50 ambienti, tra cui due case ad atrio trasformate in botteghe e una grande domus con un salone nero, un sacrario e un quartiere termale. Nel frattempo continuano gli interventi di scavo, restauro e valorizzazione del sito. 27 febbraio 2025 Roberto Graziosi Tag cultura - storia - pompei - megalografia - archeologia - affreschi - reperti archeologici - parco archeologico di pompei - dipinti'''
