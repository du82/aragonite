["https://focus.it/ambiente/animali/i-cani-annusano-il-nostro-stress-e-ne-soffrono"]
title = "I cani annusano il nostro stress (e ne soffrono) -  Focus.it"
description = "Un nuovo studio dimostra che i cani sanno riconoscere quando un umano è stressato, e questo influisce sul loro umore."
full_description = '''Animali I cani annusano il nostro stress (e ne soffrono) Un nuovo studio dimostra che i cani sanno riconoscere quando un umano è stressato, e questo influisce sul loro umore. I cani "sentono" il nostro stress e ne vengono contagiati. MariaTsygankova / Shutterstock Buone notizie per tutti coloro che sono convinti che i cani abbiano una sorta di sesto senso per i nostri umori: non solo, come già confermato da studi precedenti, i nostri migliori amici sanno annusare il nostro stato d'animo, ma ne vengono influenzati in maniera diretta. Lo sostiene uno studio pubblicato su Scientific Reports che ha visto coinvolti 18 cani di varie razze, i loro padroni e, soprattutto, 11 volontari che non avevano mai avuto nulla a che fare con quegli animali – i quali hanno dimostrato di saper, per così dire, "leggere la stanza" anche in compagnia di sconosciuti. Nel numero 383 di Focus c'è lo speciale "Che tesori!", dedicato ai nostri animali domestici, con le più recenti ricerche scientifiche che ci mostrano perché cani e gatti migliorano il nostro umore e la nostra salute; gli esperti ci spiegano come farli vivere bene a casa nostra, senza stress, come coccolarli e gestirli in modo corretto. © Focus La raccolta del sudore. L'esperimento ha previsto due fasi. Nella prima, ai cani è stato insegnato che nella stanza c'erano due ciotole: una conteneva sempre del cibo, l'altra era sempre vuota. Ogni tanto, però, la ciotola vuota veniva spostata in una posizione "ambigua", a metà strada tra la sua solita e quella della ciotola con il cibo – il perché sarà chiaro tra poco. Nella fase successiva dell'esperimento, gli 11 sconosciuti sono stati prima sottoposti a un test per generare stress (che prevedeva risolvere operazioni matematiche rapidamente e parlare in pubblico), poi a uno volto a farli rilassare (guardare video di natura mollemente sdraiati su un comodo cuscino). In entrambe le fasi, il team ha raccolto campioni di sudore dai volontari: un essere umano stressato produce un ormone chiamato cortisolo, che i cani sanno annusare e riconoscere. Ambiente Giornata no? Anche il tuo cane ti starà alla larga Stress contagioso. Dopo aver raccolto i campioni odorosi, il team li ha presentati ai cani, chiedendo loro di annusarli e poi di andare in cerca di cibo. Quello che è successo è che, dopo un'annusata di sudore pieno di cortisolo, i cani hanno rinunciato alle ciotole messe in posizioni ambigue; l'odore del sudore privo di stress, invece, li ha convinti ad andare in cerca di cibo anche dove poteva non esserci. Che significa questo comportamento? Che i cani che hanno annusato lo stress si sono fatti contagiare, e hanno dimostrato un certo pessimismo nei confronti della vita: "sono stressato, e sono sicuro che in quella ciotola non ci sarà il cibo" è il ragionamento fatto dagli animali, secondo gli autori. D'altra parte, sappiamo che il cortisolo agisce anche sull'appetito, riducendolo: è possibile che, avendo annusato lo stress, i cani si siano fatti contagiare, e abbiano perso temporaneamente il loro appetito. Il team ora vuole ripetere l'esperimento in situazioni di stress vero, per confermare quanto i nostri cani siano in sintonia con le nostre emozioni. 9 FOTO Fotogallery Meglio il cane o il gatto? La gara continua... VAI ALLA GALLERY Fotogallery Meglio il cane o il gatto? La gara continua... Cane o gatto? Il mondo da sempre si divide tra fautori dell’uno o dell’altro. C’è chi… “è più intelligente il cane” e chi ...“il mio gatto capisce tutto”.. “ma i cani sono più affettuosi” e.. “i gatti sono indipendenti e non c’è bisogno di portarli fuori”. Ma gusti e preferenze personali a parte, che cosa dice la scienza? La rivista scientifica inglese New Scientist ha provato a tirare le somme di ricerche e esperimenti fatti negli anni su cani e gatti, individuando 11 categorie in cui i nostri amici a quattro zampe si sono confrontati, che sono cervello, storia condivisa con l’uomo, legami, popolarità, capacità di comprensione, problem solving, trattabilità, capacità di vocalizzazione, supersensi, impatto ambientale, utilità. E il vincitore è... Foto: © Shutterstock Cervello. Con 64 grammi di materia cerebrale i cani battono i gatti, il cui cervello pesa solo 25 grammi. Ma le cose cambiano se si contano i neuroni, 300 milioni quelli della corteccia dei gatti contro i soli 160 milioni dei cani cosa che aumenterebbe la capacità di processare le informazioni dei gatti rispetto ai cani. Quindi i vincitori di questa categoria sono i gatti. Vincitore: gatto. Gatti 1 - Cani 0 Foto: © catcrib Legame. Il cane si sa quando non c'è il padrone soffre, come un bambino che aspetta la mamma che si è allontanata. È proprio per questo che, secondo alcuni esperimenti condotti in laboratorio, il comportamento del cane nei confronti dei padroni è assimilabile a quello del figlio nei confronti della mamma. Per il gatto certi esperimenti sono più difficili, poiché il solo fatto di essere lontani dal loro territorio per essere osservati in laboratorio, li stressa troppo per poterli osservare. Ma del resto si sa i gatti sono più indipendenti e secondo i modelli che i ricercatori hanno usato finora, i cani si legherebbero di più al proprietario rispetto ai felini di casa (ma siamo sicuri che molti proprietari di gatti non saranno d’accordo). Vincitore: cane. Gatti 1 – Cani 2 Adv Popolarità. Qui i proprietari di gatti possono esultare: secondo recenti studi nei Paesi a maggioranza gatti, i piccoli felini sono 204 milioni, contro i 173 milioni di cani stimati nei Paesi a maggioranza cani. Online, inoltre gatti e gattini spopolano. Vincitore: gatto. Gatti 2 – Cani 2 Foto: © Shutterstock Capacità di comprtendere. far salire il punteggio dei cani in questa categoria è sicuramente Rico, il border collie capace di comprendere un vocabolario di 200 parole. Ma al di là dei singoli casi, gli ultimi studi hanno dimostrato che i cani sono in grado di capire anche il tono dei discorsi che facciamo.Vincitore: cane. Gatti 2 – Cani 3Nella foto, Petra, la prima star canina della televisione: "recitava" negli anni '70 in una trasmissione per bambini dell'emittente inglese BBC. Problem solving. I cani sembrano più preparati anche in questo, forse grazie anche alla loro motivazione. Mentre i gatti si disinteressano dei compiti a loro assegnati e sono meno attenti agli stimoli dati dagli umani, i cani invece riescono più frequentemente a risolvere i problemi grazie al loro naturale approccio collaborativo. Vincitore: cane. Gatti 2 – Cani 4 Adv Vocalizzazioni. Vari studi hanno dimostrato come cani e gatti abbiano adottato diversi tipi di vocalizzi per ottenere qualcosa o per comunicare con gli esseri umani. I lupi per esempio non abbaiano, i cani sì e lo fanno in modo assai diversi in base allo stato d’animo, se sono felici o se sono arrabbiati, anche se non è sempre facile capirne la differenza ed è necessario osservare il linguaggio del corpo. Ma i gatti, proprio secondo un recente studio (per saperne di più), sono davvero imbattibili, avendo sviluppato un miagolio con una frequenza molto simile a quella di un neonato, che agirebbe sui proprietari a livello subliminale. Vincitore: gatto. Gatti 3 - Cani 4 Supersensi. Mentre per vista e udito si sa che i gatti sono imbattibili, per l’olfatto si è sempre pensato che i cani se la passassero meglio. Invece non è così. Nuovi studi hanno dimostrato che i 200 milioni di recettori olfattivi presenti in media nei gatti (in realtà il numero varia in base alle diverse razze) è superiore al numero dei recettori nella media dei cani. Vincitore: gatto. Gatti 4 – Cani 5 Foto: © Shutterstock L’impronta ecologica. Si potrebbe dire che i gatti sono più “ambientalisti” dei cani. La porzione di terra necessaria per nutrire un cane di medie dimensioni è 0,84 ettari. Ma neanche il più piccolo dei cani, il chihuahua, non può competere con i gatti. La fetta di pianeta che consuma il piccolo cagnolino è di 0,28 ettari, quasi il doppio di quello di cui necessita il gatto, 0,15 ettari. Vincitore: gatto. Totale? Parità! Gatti 5 – Cani 5 Adv Approfondimenti Innovazione UK: i cani mangeranno carne coltivata Animali La citizen science per contare i cani randagi Animali "Occhi da cucciolo”: non solo per i cani Animali I cani capiscono i nomi degli oggetti, ma... Animali Esistono davvero razze di cani più aggressive? Animali Persino i cani sanno di non sapere... Animali Il tuo cane è ottimista? Animali Siamo stressati? I cani lo sentono (dall'odore) Animali Fido sa come non farsi scoprire 19 agosto 2024 Gabriele Ferrari Tag ambiente - animali - cani - cane - annusare - stress - cortisolo - ormone dello stress - esperimento - esperimento scientifico - appetito - ormoni dello stress - contagio - contagio emotivo - emozioni - emozioni umane - cani emozioni - emozioni degli animali'''
