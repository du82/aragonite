["https://focus.it/ambiente/animali/la-grande-corsa-degli-gnu-nel-serengeti"]
title = "Le più belle foto della La grande migrazione degli gnu del Serengeti: le foto -  Focus.it"
description = "La più imponente migrazione del pianeta Terra raccontata attraverso scatti spettacolari. Un epico viaggio che si rinnova ogni anno."
full_description = '''Animali La grande corsa degli gnu del Serengeti 16 FOTO Sfoglia la gallery Uno spettacolo di vita e di morte, una dura lotta per la sopravvivenza, un epico viaggio che si rinnova ogni anno: le foto spettacolari del fenomeno migratorio più imponente del pianeta Terra. Guarda la gallery 12 aprile 2024 Elisabetta Intini Tag ambiente - animali - mammiferi - kenya - tanzania - migrazioni animali - africa - gnu - ungulati - Masaai Mara - Serengeti Contenuti correlati Ecologia Ricchezza biologica in Africa orientale Animali La formica che sta cambiando il pranzo dei leoni Curiosità Scoperto per caso l'utensile più antico 10 FOTO Animali Nuove specie sulle montagne africane Fotogallery La grande corsa degli gnu del Serengeti Uno spettacolo senza eguali si ripete ogni anno in un angolo di Terra tra il Kenya e la Tanzania. Qualcuno l'ha definito "il più grande show del Pianeta": senza dubbio è il più imponente spostamento di massa che avvenga ogni anno nel mondo naturale. Stiamo parlando della migrazione degli gnu (e, insieme ad essi, di una nutrita schiera di ungulati) dal Parco Nazionale del Serengeti, in Tanzania, alla riserva di Maasai Mara, in Kenya. Un "trasloco" di gruppo in cerca di pascoli più verdi in cui rifocillarsi, che coinvolge oltre un milione e 600 mila esemplari, inseguiti da un vasto corollario di predatori. Ripercorriamo insieme il loro viaggio, attraverso una serie di scatti selvaggi. Foto: © Shutterstock Ma cosa governa il movimento sincrono di così tanti animali? I fattori che con ogni probabilità influiscono sui pattern migratori degli gnu (gen. Connochaetes) e di altre creature della savana sono l'abbondanza di cibo ed acqua; in particolare, la disponibilità di erba fresca in un suolo ricco di fosforo, elemento essenziale per le femmine di questa specie, soprattutto nel periodo dell'allattamento. Foto: © © Frans Lanting/Corbis I tempi delle migrazioni variano considerevolmente di anno in anno. In generale, alla fine della stagione delle piogge (che in Africa Orientale cade tra maggio e giugno) gli gnu del Serengeti migrano verso nord, in cerca di pascoli più verdi e acqua da bere. Quando, alcuni mesi più tardi (tra ottobre e novembre) le piogge ritornano, gli animali ritornano a sud, da dove erano partiti. Vi rimangono fino a febbraio-marzo, periodo della nascita dei cuccioli, per poi ricominciare a spostarsi verso nord alla fine di aprile. Un cerchio infinito che inizia con la nascita dell'animale e si chiude solo con la morte. Foto: © © Remi Benali/Corbis Adv Lo spostamento di gruppo è una consolidata tecnica anti-predatore: muovendosi in massa, gli gnu minimizzano le probabilità di finire tra le grinfie di leoni, iene, ghepardi e coccodrilli, un po' come fanno i pesci che si spostano in banchi. Anche partorire nello stesso periodo dell'anno risponde alla stessa esigenza. Con così tanti cuccioli a disposizione, infatti, sarà più improbabile che i nemici acciuffino il proprio. Foto: © © Anup Shah/Corbis Per lo stesso motivo, gli gnu non si spostano da soli, ma accompagnati da circa 200 mila zebre, e 400 mila tra gazzelle e impala. Alcuni studi scientifici hanno dimostrato che questi ungulati sanno percepire anche i richiami di allarme di altre specie animali (come, per esempio, quelli dei babbuini) e sfruttarli per mettersi a loro volta in salvo. Foto: © © Frans Lanting/Corbis Il sovrannumero non è l'unica arma che gli gnu del Serengeti hanno a disposizione. Possono contare anche su una notevole velocità (fino a 80 km orari), robuste corna e astute forme di cooperazione, come turni alternati di guardia notturna per vegliare sul resto della mandria.Scopri altri record del mondo animaleCornuto a chi? Tutti gli animali con le corna Foto: © © Winfried Wisniewski/Corbis Adv Tutte queste risorse tornano utili nel momento più impegnativo del viaggio: l'attraversamento del fiume Mara, tra il Kenya e la Tanzania, infestato di coccodrilli che sfruttano l'occasione di un così folto numero di prede per fare incetta di carne. Foto: © © Jiti Chadha / Demotix/Demotix/Corbis I rettili acquattati nel fiume possono percepire la vibrazione dei milioni di zoccoli sul terreno ben prima che gli ungulati giungano al corso d'acqua. In genere, prima di tuffarsi le mandrie si riuniscono sulle rive, e i capibranco vengono sospinti in avanscoperta, costretti cioè a buttarsi tra le acque impetuose del fiume. Foto: © © Jiti Chadha / Demotix/Demotix/Corbis Alcuni animali sono spazzati via dalle correnti travolgenti del Mara, che dopo la stagione delle piogge è in piena. Altri finiscono tra le fauci dei coccodrilli nascosti nelle profondità del fiume. Non solo, le acque ospitano anche un altro nemico, vegetariano ma molto territoriale, da cui guardarsi: l'ippopotamo, che potrebbe non prendere bene l'invasione - se pur momentanea - di così tanti mammiferi. Foto: © © Anup Shah/Corbis Adv Uno degli imperativi fondamentali per queste mandrie è tenere i cuccioli all'interno del gruppo proteggendoli con la propria stazza. Si calcola che ogni anno nel Serengeti, tra febbraio e marzo, nascano circa 500 mila nuovi gnu: dopo 45 minuti dalla nascita, i piccoli sono già in grado di correre alla stessa velocità dei genitori. Fuori dall'acqua i pericoli non sono finiti: iene e leonesse (nella foto) sono sempre in agguato, e la mandria è anche "tallonata" da stormi di avvoltoi, che la inseguono ripulendo le carcasse degli esemplari morti durante il viaggio. Ecco che cosa si prova a finire tra le fauci di un leone E tu, sei commestibile? La leonessa annusa il fotografo Foto: © © Mitsuaki Iwago/Minden Pictures/Corbis In un percorso migratorio annuale, un esemplare può arrivare a coprire anche 3 mila km di viaggio. La colonna di animali in migrazione può essere lunga anche 40 km. Guarda anche: savana by night, la vita notturna degli animali in libertà Foto: © © Paul Souders/Corbis Adv Non è difficile immaginare il motivo che rende i movimenti migratori degli gnu così frequenti: la capacità di consumo di cibo di oltre un milione di erbivori mette infatti a dura prova i ritmi di ricrescita dell'erba. In altre parole, quando un pascolo è in esaurimento, occorre dargli il tempo di germogliare di nuovo. Foto: © © Galen Rowell/Corbis Le necessità alimentari degli gnu e il loro calpestio giocano un ruolo fondamentale nel mantenimento degli ecosistemi della savana: la crescita dell'erba viene incoraggiata dal loro consumo (e dal loro letame, che funge da fertilizzante), e anche la parte superiore della catena alimentare, costituita dai predatori, beneficia del loro passaggio. Foto: © © Mitsuaki Iwago/Minden Pictures/Corbis Uno dei fatti più affascinanti di questa migrazione? Le rotte possono variare di anno in anno così come i tempi: il movimento delle mandrie si ripete con eterna ciclicità eppure in modo diverso ogni anno. Foto: © © Gerry Ellis/Minden Pictures/Corbis Adv Un ciclo di vita e di morte che lascia - secondo alcune stime - stesi al suolo 250 mila esemplari ogni anno, ma permette a quelli che restano di cercare migliori opportunità di sopravvivenza per sé e per la prole. Foto: © © Winfried Wisniewski/Corbis Approfondimenti Animali Salmoni caduti dal camion si tuffano in un fiume Animali Chi non migra in compagnia... Ecologia Gli appuntamenti mancati del global warming Animali Perché ora alcuni uccelli migrano da est a ovest Animali Il disastro della migrazione dei tonni Animali Le strade e i problemi genetici degli gnu 10 FOTO Natura I più belli dei sette mari 15 FOTO Spazio Le più belle immagini astronomiche dell'anno 12 FOTO Animali Tutti sulla bilancia'''
