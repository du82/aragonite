["https://focus.it/scienza/spazio/acqua-liquida-su-marte-scoperto-un-raro-fenomeno-sul-pianeta-rosso"]
title = "Acqua liquida su Marte: scoperto un raro fenomeno sul Pianeta rosso -  Focus.it"
description = "I ricercatori dell’INGV ritengono che sulle dune dei crateri di Marte si formerebbe acqua liquida: questo fenomeno avrebbe ripercussioni sulle missioni spaziali."
full_description = '''Spazio Acqua liquida su Marte: scoperto un raro fenomeno sul Pianeta rosso I ricercatori dell'INGV ritengono che sulle dune dei crateri di Marte si formerebbe acqua liquida: questo fenomeno avrebbe ripercussioni sulle missioni spaziali. Un gruppo di ricercatori dell'Istituto Nazionale di Geofisica e Vulcanologia (INGV) ha osservato un raro fenomeno sulle dune di Marte che potrebbe essere legato alla presenza di acqua liquida, anche se solo per brevi periodi. Lo studio, pubblicato sulla rivista Geosciences di MDPI, getta nuova luce sulla geologia marziana e potrebbe avere implicazioni significative per la ricerca di vita microbica e per le future missioni spaziali sul Pianeta Rosso. Un passato ricco d'acqua. Circa 3,7 miliardi di anni fa, Marte ospitava un'atmosfera molto più densa rispetto a quella attuale, con laghi e oceani che ricoprivano parte della sua superficie. Tuttavia, nel corso del tempo, gran parte dell'atmosfera marziana è andata perduta, rendendo quasi impossibile la presenza stabile di acqua liquida a causa della bassissima pressione atmosferica. Nonostante ciò, i ricercatori dell'INGV hanno scoperto che, in condizioni particolari, l'acqua potrebbe ancora esistere in forma liquida, anche se solo temporaneamente. Scienza Due novità sulla (ricerca della) vita su Marte Dune, brina e acqua liquida. La ricerca si è concentrata sulla duna Russell all'interno dell'omonimo cratere marziano. Analizzando 110 immagini ad altissima risoluzione (fino a 25 cm/pixel) raccolte dalla sonda Mars Reconnaissance Orbiter (MRO) della NASA nell'arco di 8 anni marziani (circa 16 anni terrestri), i ricercatori hanno osservato un fenomeno unico: la possibile presenza di acqua nel suo punto triplo, ovvero in un equilibrio in cui coesistono gli stati solido, liquido e gassoso. «Nei primi giorni della primavera marziana e in occasione di folate di vento, ogni anno su questa duna può comparire acqua in condizioni atmosferiche che ne consentono la presenza transitoria allo stato liquido», spiega Adriano Nardi, ricercatore dell'INGV e primo autore dello studio. «Si tratta di un ciclo stagionale ricorrente, che abbiamo potuto osservare grazie alle immagini della sonda MRO». Scienza Asteroidi come taxi celesti? Gli astronauti potrebbero raggiungere Marte o Venere sfruttando il loro passaggio I "linear gullies": misteriosi canali. Lo studio ha anche approfondito la formazione di particolari canali, chiamati linear gullies, che si distinguono dai calanchi marziani "classici" per la loro forma più lineare. «La genesi dei gullies marziani 'classici' era stata indagata da un nostro precedente studio, che evidenziava come l'acqua sorgiva potesse produrre quei calanchi attraverso la fusione stagionale del permafrost, ovvero il ghiaccio rimasto intrappolato nel terreno in epoche passate. Questa nuova ricerca, invece, ha individuato fenomeni ancora più rari che producono canali diversi da quelli classici, detti linear gullies a causa della loro forma più lineare», aggiunge Antonio Piersanti, Dirigente di Ricerca dell'INGV e co-autore dello studio. Questi canali potrebbero essere generati dalla brina che si forma sulla cima della duna Russell. «Quando i canali restano in penombra, si osservano tracce di umidità assorbita dalla sabbia», spiega Antonio Piersanti, Dirigente di Ricerca dell'INGV e co-autore dello studio. «Viceversa, quando un canale è esposto alla luce, si assiste all'immediata evaporazione dell'acqua che si era conservata liquida fino a quel punto». Gullies attivi sulla duna Russell. © HiRISE/MRO: ESP_047078_1255 – NASA/JPL-Caltech/UArizona Acqua nei tre stati. Normalmente, l'ambiente marziano supporta solo la presenza di ghiaccio secco, che può passare direttamente dallo stato solido a quello gassoso senza diventare liquido. Tuttavia, questo studio suggerisce che, in condizioni particolari, l'acqua potrebbe esistere contemporaneamente nei suoi tre stati: solido, liquido e gassoso. «Potrebbe essere la prima volta in assoluto che si osserva acqua liquida su Marte», afferma Nardi. «È senz'altro la prima volta che si associa la formazione dei linear gullies all'azione dell'acqua liquida sul Pianeta rosso». Scienza I "ragni" di Marte sono stati riprodotti per la prima volta in laboratorio Implicazioni per il futuro. Se confermata, la presenza di acqua liquida, anche per brevi periodi, potrebbe avere conseguenze significative in alcuni settori a partire dalla geologia marziana. La scoperta infatti, potrebbe aiutare a comprendere meglio i processi geologici attuali e passati di Marte. Avrebbe poi implicazione nella ricerca di vita. L'acqua liquida è un elemento chiave per la vita come la conosciamo. La sua presenza, anche temporanea, potrebbe aprire nuove prospettive per la ricerca di forme di vita microbiche. Ed infine potrebbe avere ripercussione per le missioni spaziali. Identificare siti dove l'acqua liquida potrebbe formarsi in certi periodi dell'anno, potrebbe essere cruciale per pianificare future missioni, comprese quelle con equipaggio umano. 8 FOTO Fotogallery Albe e tramonti alieni VAI ALLA GALLERY Fotogallery Albe e tramonti alieni mercurio. Albe e tramonti sono indimenticabili su Mercurio. Non per i loro colori, perché su questo pianeta non c'è un'atmosfera e quindi il cielo è nero e senza nubi e sfumature. Ma per le dimensioni del Sole (2,5 volte rispetto a come lo vediamo qui sulla terra) e per le traiettorie che segue nel cielo di questo pianeta. Mercurio, infatti, ha una particolarità: il suo giorno (determinato dalla rotazione attorno a se stesso ) è più lungo del suo anno (determinato dalla rivoluzione attorno al sole). Più precisamente, su questo pianeta, 2 giorni equivalgono a 3 anni, cioè a circa 9 mesi terrestri. E questo fa sì che, se ci trovassimo sulla superficie di questo pianeta, vedremmo il Sole disegnare traiettorie stranissime: per esempio lo potremmo vedere sorgere, ingrandirsi mentre si alza nel cielo, poi improvvisamente arretrare e infine riprendere il suo cammino verso il tramonto. Venere. Albe e tramonti su Venere sono appena visibili. Non perché il Sole sia lontano, anzi si trova soltanto a 108 milioni di km, ma per colpa del fitto strato di nuvole che saturano l'atmosfera venusiana. Il Sole sembra una macchia di colore chiaro nel cielo nuvoloso di giornata torbida. Marte. Questa non è un'illustrazione, ma è effettivamente l'unica vera foto di un tramonto su un altro pianeta, Marte, dove avviene l'esatto contrario di quanto accade sulla Terra: qui cielo azzurro di giorno e tramonti rossi; su Marte, cielo arancione di giorno e azzurro al tramonto.L'immagine è stata scattata da Curiosity con una fotocamera che "vede" i colori in maniera molto simile a come li vediamo noi. La tinta bluastra che aleggia nell'aria è dovuta alle particelle presenti nell'atmosfera marziana, che lasciano passare con più facilità la luce blu rispetto alle altre durante il tramonto, quando la luce del sole percorre la sua traiettoria più lunga nell'atmosfera. Adv GIove. Il Sole visto da Europa, una delle principali e più interessanti lune del gigante gassoso. Giove si trova a 779 milioni di km dal Sole (più di 5 volte la distanza tra noi e la nostra stella). Il questa illustrazione Miller immagina immagina il momento - frequente - in cui Giove eclissa il Sole. Saturno. La luce viene riflessa dagli anelli e da miliardi di cristalli di ghiaccio e polvere, creando incredibili riflessi e l'illusione che il Sole, una luce fioca distante 1,5 miliardi di Km, non sia uno solo. Urano. Su Ariel, uno dei satelliti naturali di Urano, la luce del Sole è molto flebile. La distanza dal Sole è 2,9 miliardi di Km (19 volte la distanza Terra-Sole). Adv Nettuno. L'alba su Tritone, il principale satellite di Nettuno, illumina getti neri di azoto e materiali organici che si innalzano per 8 Km sopra la superficie della luna. La sua superficie è molto fredda, con temperature che si aggirano attorno ai -235° C. Recentemente è stato scoperto che, nonostante la sua lontananza dal sole, 30 volte più della Terra, Tritone risente dell'influenza della nostra stella e ha un ciclo di 4 stagioni lunghe ciascuna 40 anni terrestri. D' estate, quando la temperatura aumenta, i gas ghiacciati sulla superficie evaporano e fanno aumentare la pressione dell'atmosfera. Plutone. Il Sole appare come un puntino luminoso e la luce che arriva su questo pianeta nano a 6 miliardi di Km dalla nostra stella è 1.600 volte più debole di quella che riceviamo noi sulla Terra. Ma è una luce pur sempre 250 volte più luminosa di quella ricevuta sul nostro pianeta durante una notte di luna piena. Approfondimenti Spazio Scoperto il (vero) motivo per cui Marte è rosso Spazio Nuove idee per recuperare i campioni marziani? Spazio Struttura aliena? Musk: «Indagheremo!» Spazio Dovremmo conservare la spazzatura spaziale? Spazio Ingenuity: com'è andato l'incidente aereo su Marte Spazio Nessuna traccia di "vita" nel meteorite marziano Spazio Il passato di Marte nei ghiacci polari sepolti Spazio Ultime da Marte: scoperti nuovi gas 1 marzo 2025 Paola Panigas Tag scienza - spazio - marte - acqua su marte - missioni su marte - geologia marziana - vento marziano - crateri marziani - dune marziane'''
