["https://focus.it/comportamento/psicologia/anche-se-conosciamo-una-strategia-efficace-ne-testiamo-di-nuove"]
title = "Anche se conosciamo una strategia efficace ne testiamo di nuove -  Focus.it"
description = "Una volta che abbiamo appreso una strategia efficace per concludere un compito decidiamo comunque di tentare nuove strade, anche con il rischio di peggiorare la performance."
full_description = '''Psicologia Perché se conosciamo una strategia efficace ne testiamo di nuove? Una volta che abbiamo appreso una strategia efficace per concludere un compito decidiamo comunque di tentare nuove strade, anche con il rischio di peggiorare la performance. Anche se conosciamo la migliore strategia per affrontare un compito, tendiamo a provare nuove vie per vedere se ci portano a un risultato diverso e migliore: è quanto emerge da uno studio condotto dal MIT e pubblicato su Current Biology, che ha testato il comportamento di umani e uistitì, piccoli primati diffusi in America meridionale. Questo comportamento apparentemente illogico sarebbe in realtà funzionale alla scoperta di nuove strategie migliori, poiché potrebbe esistere un modo più efficace migliore di quello che già conosciamo per completare un compito. «È come con il cibo», spiega Mriganka Sur, uno degli autori: «Tutti abbiamo dei piatti che ci piacciono, ma continuiamo a provarne di nuovi perché – non si sa mai – potremmo trovarne qualcuno che ci piace ancora di più». Una buona notizia per gli studi sull’autismo. Il fatto che umani e uistitì (in foto) si siano comportati allo stesso modo nei test è importante perché significa che questi primati, più cognitivamente complessi dei topi, potrebbero essere utili per studiare l’autismo negli umani. La differenza nel formulare previsioni riguardo determinate situazioni, infatti, è una caratteristica tipica dei disturbi dello spettro autistico. © Danny Ye | Shutterstock Schema interiorizzato. I test prevedevano che tre umani e due uistitì osservassero per un lasso di tempo più o meno breve un'immagine sullo schermo, e che premessero un pulsante quando l'immagine scompariva. Più il pulsante veniva premuto in fretta dalla scomparsa dell'immagine, maggiore era il successo ottenuto nel compito. Sia gli umani che i primati (questi ultimi in un po' più di tempo) hanno imparato che più l'immagine rimaneva sullo schermo, più era probabile che dovessero premere il pulsante a breve. Dopo un po' di esercizio, seguendo questo schema, i loro tempi di reazioni si erano velocizzati. Comportamento Vuoi imparare più efficacemente? Crea più percorsi per recuperare un'informazione E se qualcosa cambiasse? Mano a mano che l'esperimento continuava, però, gli autori hanno iniziato a notare qualcosa di inaspettato. I risultati della prova precedente influenzavano il comportamento di umani e animali nella prova successiva, portando a volte a peggiorare la performance: se nel test appena concluso l'immagine era rimasta sullo schermo per poco tempo, i partecipanti diminuivano il tempo di reazione (probabilmente aspettandosi ancora una volta una durata minore); se, al contrario, nel test precedente l'immagine era rimasta a lungo sullo schermo, aumentavano il loro tempo di reazione (probabilmente prevedendo di dover aspettare di più). Comportamento Perché non si deve vivere di rimpianti? E come possiamo gestirli? «Il fatto che il comportamento continui a cambiare anche dopo aver appreso il compito potrebbe indicare che l'esplorazione è una strategia utile a stabilire un modello interno ottimale dell'ambiente», concludono gli studiosi. In altre parole, continuare a esplorare anche dopo aver imparato qualcosa può portare a una comprensione più profonda e a un adattamento migliore alle situazioni future. 12 FOTO Fotogallery Primati: 11 comportamenti tipicamente umani VAI ALLA GALLERY Fotogallery Primati: 11 comportamenti tipicamente umani Non è solo una questione di aspetto fisico: condividiamo con le altre grandi scimmie (orangutan, gorilla, scimpanzé, bonobo) almeno il 97% del nostro codice genetico, e con esse, e altri primati, una gamma inaspettata di espressioni, reazioni, comportamenti e interazioni sociali. Ecco una selezione di questi comportamenti, scelti tra i meno noti. Foto: © Shutterstock Chiedono il cibo con la mano. Gli scimpanzé chiedono il cibo con una mano tesa e aperta, proprio come gli esseri umani. Spesso accompagnano il gesto lasciando intravedere i denti scoperti, con un'espressione cui è difficile resistere. I mandrilli di uno zoo britannico sono stati visti invece coprire il volto con una zampa ogni volta che desiderano essere lasciati in pace (una sorta di "non disturbare"). Scoperte di questo tipo sembrano indicare una nascita della comunicazione gestuale come linguaggio condiviso prima dell'avvento di quella verbale. Foto: © Shutterstock Dicono "no" scuotendo la testa. Alcuni bonobo (Pan paniscus) dello zoo di Lipsia sono stati osservati mentre scuotevano la testa contrariati davanti alle marachelle dei cuccioli: hanno compiuto il gesto quando i piccoli giocavano con il cibo anziché mangiare, o quando si allontanavano troppo nonostante i tentativi materni di riportarli vicino a sé. Non sappiamo se il "no" di queste scimmie abbia lo stesso significato del nostro, ma l'atteggiamento è comune anche tra gli scimpanzé: nel loro caso, lo scuotimento di capo è stato associato al tentativo delle femmine di non far avvicinare i cuccioli a maschi arrabbiati e aggressivi. Il gesto che corrisponde alla negazione potrebbe essere nato in un antenato comune a uomo e scimmie. Foto: © Shutterstock Adv Riconoscono le facce. Gli esseri umani sono portati a riconoscere le più piccole differenze nei volti dei loro simili - anche quando le loro facce sono disperse in mezzo a tante altre. Così le scimmie: i ricercatori del Max Planck Institute for Biological Cybernetics di Tubinga, in Germania, l'hanno verificato sottoponendo alcuni macachi a un classico test in cui le caratteristiche del volto vengono leggermente distorte (per esempio, ruotando occhi o bocca di 180 gradi). Proprio come l'uomo, i macachi hanno notato le anomalie nelle facce distorte dei loro simili quando queste erano presentate nel verso giusto (occhi in alto e bocca in basso), ma non se ne sono accorti quando i volti erano presentati capovolti. Questo avviene perché le facce sono codificate, percepite e memorizzate secondo un orientamento "classico" e nel loro insieme (anziché in più elementi scomposti). Foto: © Gavin Hellier / Alamy / IPA Ridono di gusto. Soprattutto in una situazione in cui nessuno può farne a meno: gli attacchi di solletico. Le risate delle grandi scimmie sono più cupe rispetto a quelle umane, ma l'alternanza di suoni e l'espressione che fanno sono talmente simili alle nostre che persino gli sperimentatori vengono "contagiati" dal divertimento. Uno studio del 2009, che ha comparato le risate di oranghi, gorilla, bonobo e scimpanzé durante il solletico a quelle dei bambini, ha rivelato che le scimmie ridono seguendo i nostri stessi meccanismi: emettono un respiro affannoso, anche se la conformazione della loro laringe non permette il classico "ah-ah" delle risate umane. Come nasce il senso dell'umorismo Foto: © Sergey Uryadnikov / Alamy / IPA Mangiano cibo spazzatura per tirarsi su. Una vita sociale stressante porta gli umani a consolarsi con patatine e gelati, e nelle scimmie non funziona molto diversamente. Le femmine di macaco rhesus (Macaca mulatta) che si trovano ai ranghi inferiori delle gerarchie di gruppo mostrano segni visibili di stress come frequenti sbadigli, prurito, auto grooming e mancanza di appetito. Quando alcuni ricercatori della Emory University (Georgia) hanno fornito a loro e alle scimmie di più alto grado la possibilità di una dieta simile a quella occidentale, ricca di grassi e di zuccheri, i macachi vessati hanno mangiato più "junk food" di quelli realizzati. E a differenza dei loro "capi", hanno continuato ad assumere schifezze anche nelle ore notturne. 10 cose che forse non sai sul cibo spazzatura Foto: © Shuttershock Adv Usano sex toys. Nel kit dei circa 20 diversi tipi di strumenti ("tool") che gli scimpanzé di varie popolazioni hanno imparato ad usare ce ne sono alcuni dedicati al miglioramento della propria vita sessuale. Sono "strumenti di piacere" ma in un senso leggermente diverso da quello che intendiamo noi: i maschi di scimpanzé di una popolazione della Tanzania utilizzano foglie secche per attirare l'attenzione delle femmine sulla loro erezione, e avvicinarle a sé. Si mettono seduti ben "in vista" e iniziano a frantumare la foglia in minuscoli pezzi producendo rumore e assicurandosi che il loro entusiasmo sia notato. Se le femmine "colgono", si fa avanti e inizia l'accoppiamento. 11 fatti curiosi e storici sui sex toys Foto: © FLPA / Alamy / IPA Hanno giochi "da maschio" e "da femmina". Anche i primati non umani sembrano prediligere giochi di diverso tipo in base al genere di appartenenza. Tra gli umani, le preferenze dei bambini per automobiline o bambole sembrano dettate da un mix di predisposizione genetica e influenze sociali. Un esperimento del 2008 su 34 macachi rhesus in una popolazione di 135 esemplari ha dimostrato che i maschi preferivano giochi con le ruote, e le femmine i peluche: tuttavia queste ultime, come le bambine umane, mostravano una maggiore flessibilità nelle scelte dei giochi prediletti. Secondo gli scienziati sarebbe su queste preferenze di tipo ormonale che poi si costruiscono le generalizzazioni che vediamo anche sugli umani. Foto: © Shutterstock Riconoscono le situazioni sleali. "Non è giusto! Perché a lui sì e a me no?": proteste di questo tipo non sono solo tipicamente umane. Ne sono capaci anche scimmie non così vicine a noi, come i cebi dai cornetti (Cebus apella): in un esperimento, a questi primati sono state offerte fettine di cetriolo o i più amati acini d'uva in cambio di un pezzetto di granito che dovevano consegnare agli sperimentatori. Quando tutti hanno avuto i cetrioli, è filato tutto liscio. Quando invece i cebi vicini hanno ricevuto l'uva, quelli che hanno avuto il cetriolo hanno notato l'ingiustizia e sono andati su tutte le furie: hanno gettato a terra il cibo e si sono voltati dall'altra parte, di fronte alle insistenze degli scienziati. La capacità di riconoscere le ingiustizie è fondamentale per lo sviluppo di una società cooperativa (nella foto, un macaco ben attento a ciò che riceve). Foto: © Tim Gainey / Alamy / IPA Adv Covano vendetta. Anche la punizione dei comportamenti ingiusti e antisociali sembra avere corrispondenze tra i nostri "cugini". Un recente studio ha dimostrato che i bambini di sapiens sono disposti a "pagare" - simbolicamente - pur di vedere punito il cattivo in una rappresentazione di burattini. Lo stesso avviene per gli adulti di scimpanzé: pur di veder soddisfatta la loro sete di giustizia, questi primati sono disposti a offrire qualcosa che possiedono o a compiere uno sforzo muscolare extra. Foto: © Shutterstock Si fanno la guerra. I due bonobo nella foto stanno avendo un'interazione aggressiva, ma i primati più vicini a noi sono capaci anche di vere e proprie guerre, che possono proseguire per anni. La prima fu osservata dall'etologa britannica Jane Goodall a partire dal 1974, tra due popolazioni di scimpanzé del Parco Nazionale del Gombe Stream, in Tanzania, che prima ne formavano una sola. La guerra degli scimpanzé del Gombe si protrasse fino al 1978, con ripetute incursioni violente dell'uno e dell'altro gruppo tra uccisioni, percosse, rapimenti e occupazioni. La presa di coscienza di questo "lato oscuro" nel comportamento degli scimpanzé lasciò la scienziata turbata a lungo. Foto: © Sergey Uryadnikov / Alamy / IPA Si baciano. Solo le grandi scimmie (gorilla, oranghi, scimpanzé, bonobo) praticano questo intimo e sofisticato tipo di interazione. In genere si tratta di baci sulle braccia e sul petto, in segno di rispetto e per rafforzare le gerarchie sociali. Gli scimpanzé - nella foto - si baciano per tirarsi su di morale o per riconciliarsi dopo un conflitto: è un gesto tipicamente maschile e senza una connotazione sessuale. Più "spinto" è il bacio tra bonobo, che spesso coinvolge la lingua: ma i bonobo sono creature molto esplicite nei comportamenti sessuali, e usano interazioni molto ravvicinate in una vasta gamma di situazioni sociali: non è il bacio tipicamente romantico dell'uomo, ma è quanto di più vicino nel mondo dei primati. Foto: © C.O. Mercial / Alamy / IPA Adv Approfondimenti Psicologia Benessere: la mattina è tutto più facile Psicologia Sei capace di pensare a un numero a caso? Psicologia Le decisioni avventate in adolescenza Scienze Che cosa fare per prendere le decisioni giuste? Psicologia La fame fa prendere decisioni migliori 2 marzo 2025 Chiara Guzzonato Tag comportamento - psicologia - strategie - uistitì - primati - autismo - scelte'''
