["https://focus.it/cultura/storia/antico-egitto-una-fabbrica-nel-deserto-in-cui-veniva-estratto-e-lavorato-l-oro"]
title = "Antico Egitto: una fabbrica nel deserto in cui veniva estratto e lavorato l'oro -  Focus.it"
description = "In Egitto, nel mezzo del deserto, è stato scoperto un antico giacimento aurifero in cui si estraeva e lavorava l'oro già tremila anni fa."
full_description = '''Storia Antico Egitto: una fabbrica nel deserto in cui veniva estratto e lavorato l'oro In Egitto, nel mezzo del deserto, è stato scoperto un antico giacimento aurifero in cui si estraeva e lavorava l'oro già tremila anni fa. L'area in cui si estraeva l'oro nell'Antico Egitto vista dall'alto. Ministero del Turismo e delle Antichità d'Egitto Dopo due anni di meticolose indagini archeologiche, il Ministero del Turismo e delle Antichità egiziano ha riportato alla luce un'antica città dell'oro, un sito minerario aurifero di oltre tremila anni. Questo progetto, senza precedenti, ha permesso di scoprire, documentare e preservare un'area di inestimabile valore storico, situata nella zona del Monte Sakari, a sud-ovest di Marsa Alam, nella provincia del Mar Rosso. La fabbrica nel deserto. Il Ministro del Turismo e delle Antichità, Sherif Fathy, ha sottolineato che questo ritrovamento fornisce dati importanti sulle tecniche di estrazione dell'oro utilizzate nell'antichità e ci permette di scoprire la vita quotidiana in una città industriale nel deserto orientale nel corso di vari periodi storici. Il dottor Mohamed Ismail Khaled, segretario generale del Consiglio supremo delle antichità, ha precisato che gli scavi hanno portato alla luce un campo minerario perfettamente strutturato dove sono stati individuati i resti di un complesso sistema di lavorazione dell'oro, con fabbriche specializzate nell'estrazione del prezioso metallo da vene di quarzo. Le prove rinvenute dimostrano un processo meticoloso che prevedeva la frantumazione e la macinazione del quarzo, la filtrazione e la sedimentazione in apposite vasche e, infine, la fusione in forni di argilla per ottenere oro puro. Cultura In Egitto scoperta una mummia con la lingua d'oro Vita da minatori. Oltre alle infrastrutture minerarie, gli scavi hanno portato alla luce vestigia della vita quotidiana dei minatori nell'antico Egitto. Tra i reperti rinvenuti si trovano abitazioni, officine, aree di lavorazione dei minerali, templi dedicati al culto religioso, edifici amministrativi e terme tolemaiche. Sono stati identificati anche elementi architettonici che dimostrano l'uso del sito in periodi successivi, tra cui resti di epoca romana e islamica. Cultura I rischi occupazionali degli scribi nell'Antico Egitto: anche loro avevano problemi di postura Non è solo oro... Tra i reperti portati alla luce figura una collezione di 628 ostraca (conchiglie e cocci), frammenti di ceramica o pietra con iscrizioni in geroglifici, demotici e greci, che riflettono la diversità linguistica e culturale del periodo. Inoltre monete di bronzo della dinastia tolemaica, statuette in terracotta con rappresentazioni umane e animali del periodo greco-romano, sculture in pietra, alcune incompiute, di divinità come Bastet e Arpocrate, cinque tavole per offerte risalenti all'epoca tolemaica e una collezione di vasi in ceramica di diverse dimensioni e forme, utilizzati per contenere profumi, medicine e incenso, nonché ornamenti realizzati con pietre preziose e conchiglie. Oggetti ritrovati durante gli scavi archeologici. © Ministero del Turismo e delle Antichità d'Egitto Ricostruzione e conservazione. Il professor Mohamed Abdel-Badea, capo del Dipartimento di antichità egizie presso il Consiglio supremo delle antichità, ha sottolineato gli sforzi compiuti per documentare e preservare questi resti architettonici. Nell'ambito del progetto, è stata creata una replica del campo minerario su un'area di sei acri, dove sono state ricostruite le principali strutture scoperte. Cultura Scoperti a Pompei i resti di due vittime con monete d'oro e gioielli Un'operazione complessa. Il progetto ha richiesto una serie di scavi archeologici approfonditi, accompagnati da un'accurata documentazione, restauro e trasferimento di elementi architettonici di grande pregio. Le strutture rinvenute sono state ricollocate in un luogo sicuro, a tre chilometri a nord del sito originale, lontano dalle moderne attività minerarie che continuano nella zona. La salvaguardia di questo sito è stata resa possibile grazie alla collaborazione tra le autorità archeologiche e l'amministrazione dell'attuale giacimento aurifero di Sakari, garantendo così la protezione del patrimonio storico egiziano dalle attività minerarie contemporanee. Importanza storica del sito. Questa scoperta è fondamentale per comprendere le tecniche avanzate di estrazione dell'oro utilizzate dagli antichi Egizi e per ricostruire la struttura sociale, religiosa ed economica delle comunità minerarie che hanno popolato il deserto orientale nel corso della storia. Questi risultati confermano l'importanza dell'Egitto come centro di produzione dell'oro fin dall'epoca dei faraoni. 12 FOTO Fotogallery Tutto quello che (forse) non sai sull'oro VAI ALLA GALLERY Fotogallery Tutto quello che (forse) non sai sull'oro Secondo uno studio delle università di Bristol (UK) e Munster (Germania), pubblicato su Nature, oro e platino sarebbero piovuti dal cielo 4 miliardi di anni fa, grazie a un bombardamento di meteoriti durato 200 milioni di anni. «Se fossimo in grado - scrivono i ricercatori Matthias Willbold e Thorsten Kleine - di scendere a 3mila chilometri di profondità, raggiungere il centro della Terra e recuperare tutto l'oro e il platino che vi sono depositati, potremmo ricoprire la superficie del pianeta con uno strato spesso quattro metri». Per misurare la purezza dell'oro si utilizza il carato: l'oro a 24 carati (di solito in lingotti) è puro, ossia non contiene altri metalli. Poco meno puro è l'oro a 22 carati di cui sono fatte alcune monete: ha il 91,7% di oro. Quello a 18 carati, usato in gioielleria, è puro al 75% e contiene altri metalli, tra cui argento, rame e a volte anche zinco, palladio e nichel. Quest'ultimo, il cui utilizzo è regolamentato per legge in quanto è un potente allergene, serve a produrre il cosiddetto oro bianco. E giù fino all'oro a 8 carati, che indica la percentuale di oro più bassa prevista al mondo: 37,5% di oro, 42,5% di argento e 20% di rame. Gli Stati Uniti detengono la più grande riserva aurea del mondo: 8.133 tonnellate. Hanno infatti più oro di Germania e Italia messe assieme, i due Paesi che seguono nella classifica delle riserve auree. Infatti, la Germania ha 3.362 tonnellate di oro e la Banca d’Italia ha 2.452 tonnellate di oro, quantità che porta il nostro Paese in quarta posizione, dietro al Fondo monetario internazionale. Dopo l’Italia troviamo Francia, Russia e Cina: tutte superano le 2mila tonnellate. E l’Unione europea ha 556 tonnellate. Adv Fino al 1931 i paesi europei più India, Russia, Usa e Giappone utilizzavano il sistema aureo (gold standard) che stabiliva un ordine economico basato sulla conversione in ogni momento delle banconote in oro secondo un rapporto di cambio fisso. «L'industria dell'oro», scrive l'economista Loretta Napoleoni nel libro Economia canaglia, «non è affatto regolamentata ed è costituita da una miriade di compagnie commerciali sparse in tutto il mondo. La raffinazione dell'oro è appannaggio di un esiguo gruppo di società che non controllano l'origine del metallo giallo che acquistano. E, come il mercato dei diamanti, anche quello dell'oro insanguinato non compare sull'agenda di alcun governo né organizzazione governativa internazionale.» Il 49% dell'oro estratto dalla miniere è usato in gioielleria. E circa il 20% dell'oro del mondo, usato per scopi decorativi, si trova nei sari, i tradizionali indumenti femminili indiani. Adv Per oltre 70 anni il trattamento standard per l'artrite reumatoide consisteva in iniezioni di una sospensione liquida di oro, che agiva come un anti-infiammatorio. La miniera di Grasberg, nella provincia indonesiana di Irian Jaya in Nuova Guinea, è la più grande miniera di oro e la seconda miniera di rame al mondo. È anche una delle miniere più alte del mondo situata a oltre 4000 metri. Occupa circa ventimila lavoratori. La miniera più famosa è quella di San José, nei pressi di Copiapó, in Cile, dove nell'agosto del 2010 sono rimasti intrappolati 33 minatori per 69 giorni a una profondità di 688 metri. L'ultimo minatore fu portato in salvo alle 21:55 del 13 ottobre dello stesso anno. Adv L'oro puro fonde a 1063 °C e bolle circa a 2800 °C. È estremamente malleabile e duttile: da un'oncia (28 grammi all'incirca) si possono ricavare 80 chilometri di filo da cinque micrometri (un decimo del diametro di un capello umano). La più grande moneta d'oro misura 80 cm di diametro ed è stata creata dalla Perth Mint nel 2012: vale 870 mila euro. La riconoscete dalle dimensioni e perché ha l'effige di un canguro. La squadra di football dei San Francisco 49ers prende il nome dall'ondata di cercatori d'oro che ha invaso la California (e San Francisco) nel 1849. Il che spiega anche i caschi color oro. Adv Approfondimenti Storia Un cocktail di allucinogeni per il dio Bes Curiosità Chi fu il primo faraone d’Egitto? Storia La misteriosa spada "firmata" Ramses II Storia Come venne costruita la piramide di Djoser? 00:00 Storia Perché questa mummia sta urlando? Ecologia Da miniera a museo, la proposta dell'Ispra. In Italia 3mila siti dismessi Storia Egitto: scoperti 100 sarcofagi di 2.500 anni fa Storia Un antico villaggio del delta del Nilo Storia Cosa si nasconde ancora sotto Petra? 28 febbraio 2025 Luigi Bignami Tag cultura - storia - antico egitto - egizi - egitto - antichi egizi - oro - quarzo - miniera - archeologia - scoperte archeologiche - siti archeologici - reperti archeologici - faraoni - periodo tolemaico'''
