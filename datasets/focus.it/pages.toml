pinioni e/o le informazioni e/o i dati contenuti nei Materiali e/o nei Contributi inviati a MONDADORI e/o caricati dagli utenti sul Sito. MONDADORI non potrà essere ritenuta responsabile dei contenuti e/o dell’accuratezza dei Materiali e/o dei Contributi e gli utenti sono i soli responsabili dei contenuti e dell’accuratezza dei Materiali e/o dei Contributi dagli stessi inviati a MONDADORI e/o immessi sul Sito. Gli utenti utilizzano e/o fanno affidamento sui Materiali pubblicati sul Sito e/o sui Contributi caricati sul Sito a proprio rischio. GLI UTENTI SI IMPEGNANO A MANLEVARE E TENERE INDENNE MONDADORI E/O I SUOI DIPENDENTI E/O INCARICATI E/O COLLABORATORI E/O FORNITORI DI SERVIZI ESTERNI, DA OGNI E QUALSIASI PRETESA, AZIONE, DOMANDA AVANZATA DA TERZI A SEGUITO DELLA PUBBLICAZIONE E/O COMUNICAZIONE AL PUBBLICO DEI MATERIALI E/O DEI CONTRIBUTI SUL SITO E/O DALLA VIOLAZIONE DA PARTE DELL’UTENTE DELLE CONDIZIONI, INCLUSI I DANNI, LE SPESE (TRE LE QUALI LE SPESE LEGALI) ED I COSTI SOSTENUTI DA MONDADORI. L’accesso al Sito e la fruizione dei servizi offerti tramite lo stesso e/o la Community vengono forniti nello stato di fatto e di diritto in cui si trovano e MONDADORI non fornisce garanzia alcuna in relazione alle caratteristiche e/o alla qualità dei servizi offerti tramite il Sito e/o la Community, né riguardo alla continuità e/o disponibilità ininterrotta dei medesimi. Gli utenti prendono atto ed accettano che, nei limiti previsti dalla legge applicabile, MONDADORI non sarà responsabile di eventuali danni ai computer e/o ai sistemi informatici degli utenti stessi, inclusa la perdita di dati e di informazioni a seguito dell’accesso e/o della fruizione del Sito e/o dei suoi contenuti e/o dei servizi offerti tramite lo stesso e/o la Community. MONDADORI non fornisce garanzia alcuna in relazione ai prodotti e/o servizi offerti e/o alle informazioni e/o dati e/o contenuti forniti dai terzi inserzionisti ai cui siti l’utente acceda tramite indirizzamento dal Sito a mezzo 