["https://focus.it/scienza/salute/il-te-in-infusione-rimuove-i-metalli-pesanti-dall-acqua"]
title = "Il tè in infusione rimuove i metalli pesanti dall'acqua -  Focus.it"
description = "Le foglie di tè catturano ioni di cadmio, piombo e altre sostanze tossiche dall'acqua in cui sono immerse. Più tempo le si lascia infuse, meglio è."
full_description = '''Salute Il tè in infusione rimuove i metalli pesanti dall'acqua Le foglie di tè catturano ioni di cadmio, piombo e altre sostanze tossiche dall'acqua in cui sono immerse. Più tempo le si lascia infuse, meglio è. Una pausa rigenerante... in tutti i sensi. Shutterstock Il consumo di tè potrebbe avere benefici sulla salute che non dipendono da quelli, in passato più volte indagati, della caffeina. Le foglie di tè sembrano avere un effetto purificante sull'acqua in cui sono lasciate in infusione, perché rimuovono da essa eventuali tracce di metalli pesanti. Esche vegetali. Una ricerca pubblicata sulla rivista scientifica ACS Food Science & Technology rivela che le foglie di tè attirano gli ioni (atomi che presentano carica elettrica) di piombo, cadmio, cromo e altri metalli dall'acqua per poi eliminarli, quando le rimuoviamo dalla tazza o dalla teiera. Come già ipotizzato in un piccolo studio di un altro gruppo scientifico, pubblicato a novembre 2024, le tracce di metallo rimangono intrappolate sulle foglie di tè: l'antica e popolare bevanda potrebbe dunque diventare un mezzo piacevole per depurare i liquidi che introduciamo nel corpo. Alla ricerca dell'infuso ideale. Nello studio, i ricercatori della Northwestern University negli Stati Uniti hanno testato diversi tipi di tè in foglie, polvere e bustina, sperimentando metodi e tempi di infusione differenti in campioni di acqua contenenti concentrazioni note di ioni di metalli pesanti. Hanno quindi rimosso il tè e testato di nuovo le soluzioni, usandone alcune in cui non era stato infuso del tè come controlli. Tè forti e depurati. Il fattore più importante per ottenere un tè purissimo senza metalli aggiunti è il tempo: maggiore quello di infusione, maggiori saranno le quantità di ioni rimossi, a prescindere dalla concentrazione di metalli pesanti nell'acqua. Nei classici 5 minuti di infusione del tè delle cinque, si rimuove circa il 15% della concentrazione di piombo nel liquido in tazza, ma risultati ancora migliori si ottengono lasciando macerare il tè in bottiglia per una notte, con la ricetta classica del tè freddo fatto in casa. Macinato è meglio. Il tè in polvere è il più efficace depuratore, semplicemente perché le polveri aumentano la superficie di assorbimento a contatto con l'acqua. Gli scienziati hanno testato diverse varietà di tè (verde, nero, bianco, oolong), ma in generale i tè erbacei hanno ottenuto tutti un risultato simile, mentre i fiori di camomilla non sembrano avere lo stesso potere purificante. Anche l'involucro conta. Quanto alle bustine da tè, la ricerca ha dato ragione a quelle in cellulosa, che oltre ad essere biodegradabili funzionano meglio da "spugna" per i metalli, conducendoli facilmente al tè che contengono. Le bustine di nylon, un materiale difficile da riciclare che produce microplastiche, non hanno invece avuto un effetto soddisfacente, e nemmeno quelle di cotone. Veleni da (non) bere. L'esposizione a metalli pesanti è associata ad effetti dannosi per la salute: problemi ai reni e alle ossa, disturbi neurocomportamentali e dello sviluppo, demenza precoce, elevata pressione sanguigna, tumori. Gli autori sottolineano che, se si è preoccupati per la quantità di metalli pesanti presenti nell'acqua che si consuma, usarla per fare il tè non è comunque una buona soluzione. Tuttavia, lo studio potrebbe ispirare nuovi metodi di depurazione più accessibili e sostenibili per rimuovere i contaminanti dall'acqua, un'esigenza urgente in molte parti del mondo. 27 febbraio 2025 Elisabetta Intini Tag scienza - salute - tè - alimentazione - bevande - infusione - metalli pesanti - piombo - arsenico - cadmio - acqua - contaminazione - inquinamento da piombo - bustine da tè - cibo - purificazione'''
