["https://focus.it/tecnologia/innovazione/si-puo-davvero-costruire-lo-scudo-di-capitan-america"]
title = "Si può davvero costruire lo scudo di Capitan America? -  Focus.it"
description = "Ignifugo, antiproiettile e leggerissimo: potremmo avvicinarci più di quanto immaginiamo a realizzare uno scudo simile a quello di Capitan America."
full_description = '''Innovazione Si può davvero costruire lo scudo di Capitan America? Ignifugo, antiproiettile e leggerissimo: potremmo avvicinarci più di quanto immaginiamo a realizzare uno scudo simile a quello di Capitan America. È indistruttibile, ignifugo, antiproiettile e leggerissimo; si può usare come strumento di difesa ma anche come una tagliente arma d'attacco; inoltre, se viene lanciato, rimbalza e torna indietro conservando tutta l'energia cinetica. Lo scudo di Capitan America, ormai iconico tanto quanto la frusta di Indiana Jones o la spada laser di Luke Skywalker, ha recentemente cambiato padrone cinematografico (da Steve Rogers/Chris Evans a Sam Wilson/Anthony Mackie) ma non ha perso il suo fascino. Peccato che esista solo nei fumetti e nelle trasposizioni cinematografiche di questi ultimi... o forse no? Secondo lo scienziato Ricardo Castro, docente di ingegneria dei materiali alla Lehigh University (Pennsylvania), la scienza potrebbe avvicinarsi più di quanto immaginiamo alla realizzazione di uno scudo simile a quello di Captain America. Il materiale perfetto. Nel mondo della Marvel, lo scudo deve la sua resistenza al vibranio, un metallo immaginario capace di assorbire e ridistribuire l'energia cinetica. Anche se un materiale del genere non esiste, i ricercatori studiano da anni leghe e compositi con proprietà simili. «È un oggetto molto interessante per un ingegnere dei materiali, perché racchiude quasi tutte le caratteristiche meccaniche ideali», spiega Castro. La chiave sta nel combinare leghe diverse per sfruttare al meglio le loro qualità. In laboratorio, metalli e ceramiche possono essere fusi per ottenere degli ibridi con straordinaria resistenza alla compressione, agli urti e alle alte temperature, caratteristiche che renderebbero il nostro scudo molto più vicino alla realtà. Cultura Davvero il metallo più prezioso non è l'oro, ma... il rodio? A prova di proiettile. Uno strumento del genere dovrebbe sopportare sia gli impatti devastanti di un supercattivo come Hulk Rosso (il rivale di Capitan American nel film Brave New World), sia colpi mirati e ad alta velocità, come quelli delle armi da fuoco. Per resistere alla compressione, Castro suggerisce una struttura in carburo di tungsteno, un materiale i cui atomi sono disposti così strettamente da renderne quasi impossibile la compattazione. Questo stesso principio viene già utilizzato in alcuni elementi compositi, come le ceramiche rivestite in metallo. Per opporsi ai proiettili, invece, la soluzione proposta è una lega nanocristallina di rame e tantalio, un prodotto sviluppato dall'esercito americano che ha una struttura microscopica capace di distribuire la forza dell'impatto su un'ampia superficie, assorbendo l'energia come fanno le fibre di kevlar nei giubbotti antiproiettile. «È come un alveare», prosegue Castro: «il rame fa da collante morbido, mentre il tantalio fornisce una struttura rigida che ferma il proiettile». Scienza Creato il materiale più tenace della Terra (ma per usarlo dovremo aspettare un bel po') Resistere al fuoco. Nel corso dei film, lo scudo viene esposto a esplosioni, fiamme e temperature estreme. Nel mondo reale, i metalli sono ottimi conduttori di calore e quindi si scaldano velocemente, ma un rivestimento in ceramica potrebbe risolvere il problema. Le ceramiche hanno forti legami covalenti che impediscono il trasferimento di calore, motivo per cui la NASA le usa come protezione delle navette spaziali durante il rientro nell'atmosfera. Un eventuale prototipo con strati di ceramica porosa e metallo sarebbe in grado, quindi, di resistere a incendi ed esplosioni, mantenendo una temperatura sufficientemente bassa da permettere a chi lo impugna di non ustionarsi. Cultura Il meccanismo di Antikythera: la vera storia del "quadrante del destino" cercato da Indiana Jones Rimbalza davvero? Un'altra incredibile caratteristica dello scudo è la sua capacità di rimbalzare sugli oggetti e tornare nelle mani del lanciatore. Nella realtà, un disco scagliato contro un muro perde parte della sua energia nell'impatto, quindi non potrebbe mai tornare indietro con la stessa velocità. Tuttavia, alcuni materiali con "memoria di forma" si comportano in modo simile. Un esempio è il nitinol, una lega di nichel e titanio che può deformarsi e poi tornare alla sua forma originale. «La superplasticità di questa lega permetterebbe allo scudo di recuperare la conformazione di partenza senza perdere l'energia» – spiega Castro – «anche se non esiste ancora un materiale capace di imitare l'esatto comportamento del fedele alleato di Capitan America». Cultura Gli “ornitotteri” di Dune sarebbero davvero in grado di volare? Problemi irrisolti. Siamo dunque pronti a costruire il celeberrimo Captain America's Shield? Non proprio. Sebbene, la scienza dei materiali abbia compiuto progressi significativi, permettendoci di ottenere singole caratteristiche dell'arma in questione, combinare tutte queste proprietà in un unico materiale resta una sfida irrisolta. Inoltre, anche se riuscissimo a inventare questo gemello del vibranio, replicare il peso ideale dello scudo sarebbe complicato. Nell'universo Marvel, infatti, ha un diametro di 76 centimetri, uno spessore di 76 millimetri e un peso di 5,45 chilogrammi, e trovare un sistema nel mondo reale per ottenere le medesime proprietà meccaniche mantenendo lo stesso peso contenuto è, al momento, oltre le nostre capacità tecnologiche. 15 FOTO Fotogallery I supereroi sono dappertutto VAI ALLA GALLERY Fotogallery I supereroi sono dappertutto Un improbabile Capitan America con la pancetta si improvvisa paladino dei lavoratori: è Maryo Mendez, un sindacalista della Toyota durante una manifestazione di protesta per la chiusura della loro fabbrica, in California, provocata della crisi economica. Foto: © Robert Galbraith - REUTERS Un giovane capofamiglia vestito da Capitan America si reca con moglie e figli a Comic Con, una manifestazione per appassionati di fumetti che si tiene ogni anno in Louisiana. Foto: © Bill Haber - REUTERS Cavalcare tori non è da tutti, e così questo cowboy colombiano, forse per darsi un po' di coraggio, si è vestito da Superman. Siamo nella Plaza de Toros di Medellin. La pelle antiproiettile di Superman è realtà Foto: © REUTERS/Albeiro Lopera Adv Batman esiste davvero ma non pattuglia le strade di Gotham City bensì quelle di Taubate, in Brasile. Nei panni del supereroe c'è Andre Luiz Pinheiro, un capitano della polizia in pensione, che affianca i suoi ex colleghi nelle operazioni contro lo spaccio in una delle zone più malfamate della città. L'idea, che secondo i dirigenti locali porterà benefici tangibili nel lungo periodo, è far capire ai bambini il concetto della lotta tra buoni e cattivi utilizzando un linguaggio a loro famigliare. Foto: © REUTERS/Roosevelt Cassio Tre avvenenti Cat Woman posano per i giornalisti davanti a un cinema inglese in occasione della prima dell'omonimo film dedicato a una delle storiche nemiche di Batman. Le più belle foto di gatti Foto: © REUTERS/Peter Macdiarmid PKM Batman, Robin, Wonder Woman, Cat Woman e Superman pattugliano le strade della movida milanese: si tratta in realtà di una manifestazione di protesta del 2009 contro una legge del governo che, all'interno di un progetto per la lotta all'immigrazione clandestina, autorizzava le ronde organizzate da privati cittadini. C'è chi dice no... e con clamore Foto: © REUTERS/Stefano Rellandini Adv Una quasi perfetta copia di Joker in visita alla Comic Con Convention di San Diego, una delle più importanti manifestazioni americane dedicate ai fumetti. In spiaggia con la maschera. Ma non sono supereroi Foto: © REUTERS/Mario Anzuon Thor e Iron Man, come sempre, prendono le parti dei più deboli. In questo caso protestano davanti agli uffici della polizia di Città del Messico rivendicando il diritto degli artisti di strada di esibirsi negli spazi pubblici. Arte di strada: le foto più belle Foto: © REUTERS/Edgard Garrido Iron Man si prepara a visitare la Superhero Experience, una mostra organizzata presso il museo delle cere di Madame Tussauds, a New York, interamente dedicata ai personaggi dei fumetti Marvel. Foto: © REUTERS/Keith Bedford Adv Un elettore travestito da Spiderman si reca alle urne a Hong Kong: l'obiettivo, non si sa quanto centrato, è quello di sottolinerare che le elezioni sono un'avvenimento serio e importante nella vita del paese per cui occorre andare a votare. Propaganda 2.0: manifesti, gadget e guerrilla elettorale Foto: © REUTERS/Stringer Chiudiamo con alcune foto molto diversa dalle precedenti. Nella foto, Paulino Cardozo, unno scaricatore di New York di origine messicana. Ogni settimana riesce a spedire a casa - in Messico - 300 dollari. Anche senza il vestito da Hulk è un vero super eroe. È uno scatto di Dulce Pinzón, una fotografa messicana autrice di un libro, Superheroes (super eroi) nel quale ritrae - nei panni di noti personaggi dei fumetti - alcuni immigrati messicani che lavorano a New York. Foto: © Dulce Pinzón Il vero uomo ragno. Bernabe Mendez è un lavavetri di professione e manda a casa, in Messico, 500 dollari al mese. Tratto da Superheroes. Foto: © Dulce Pinzón Adv José Rosendo de Jesús, di Guerrero in Mesico. Fa il sindacaluista sa New York e riesce a spedire 700 dollari al mese a casa. Tratto da Superheroes. Foto: © Dulce Pinzón Luis Hernandez, immigrato messicano a New York. Lavora in una società di demolizioni. Superheroes. Foto: © Dulce Pinzón Federico Martinez. Fa il taxista a New York e manda a casa, nello stato di Puebla in Messico, 250 dollari alla settimana. Tratto da Superheroes. Foto: © Dulce Pinzón Adv Approfondimenti Curiosità Sicuri che quella sul petto di Superman sia una S? Curiosità Lo snap mortale di Thanos Psicologia Perché i bambini amano tanto i supereroi? 7 FOTO Curiosità 7 superpoteri mortali (per chi li ha) Scienze Perché Spiderman non può esistere Innovazione L'armatura ispirata alle scaglie di pesce Scienze Il primo magnete 2D Innovazione Verso la pietra filosofale: il cemento si trasforma in metallo Innovazione Il materiale più leggero del mondo 1 marzo 2025 Simone Valtieri Tag tecnologia - innovazione - scudo - supereroi - armi - cinema - fumetti - giubbotti antiproiettile'''
