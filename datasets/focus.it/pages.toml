description = "Il futuro del volo: aerei supersonici silenziosi e spazioplani che coprono 15.000 km in 3 ore, con software al posto dei piloti. Con Tommaso Ghidini, ESA."
full_description = "Tommaso Ghidini | Da Sydney a New York in 3 ore e senza pilota Il futuro del volo: aerei supersonici silenziosi e spazioplani che coprono 15.000 km in 3 ore, con software al posto dei piloti. Con Tommaso Ghidini, ESA. Il futuro del volo aereo è già delineato. Dopo il bando dei Concorde, è allo studio una nuova generazione di aerei supersonici più silenziosi e più puliti, grazie a nuovi motori, nuovi carburanti e nuovi profili aerodinamici. La frontiera più avanzata della ricerca punta a uno spazioplano capace di uscire dall'atmosfera e rientrarci, consentendo di volare da Sydney a New York (una distanza di 15mila km!) in 3 ore. E i piloti spariranno, sostituiti dal software. Con Tommaso Ghidini, Capo del Dipartimento di Ingegneria Meccanica dell'Agenzia Spaziale Europea 14 gennaio 2025 Tag focus talks - focus live 2024 - focus live - focustalks - esa - marte - spazio"
