["https://focus.it/scienza/scienze/nelle-societa-industrializzate-dormiamo-piu-a-lungo-ma-riteniamo-il-sonno-meno-riposante"]
title = "Nelle società industrializzate dormiamo più a lungo, ma il sonno non ci riposa -  Focus.it"
description = "Alle popolazioni di cacciatori-raccoglitori bastano meno ore di sonno che a noi, forse perché godono di una maggiore regolarità nei ritmi circadiani."
full_description = '''Scienze Nelle società industrializzate dormiamo più a lungo, ma riteniamo il sonno meno riposante Alle popolazioni di cacciatori-raccoglitori bastano meno ore di sonno che a noi, forse perché godono di una maggiore regolarità nei ritmi circadiani. La tecnologia è spesso incolpata di toglierci il sonno. Ma è davvero così? Shutterstock Nelle chiacchiere mattutine davanti a un caffè è difficile trovare qualcuno che non lamenti il poco sonno. Siamo soliti pensare che le moderne abitudini e la presenza invasiva della tecnologia abbiano accorciato il riposo notturno: ma è proprio vero? No, secondo uno studio che ha confrontato il sonno nelle società industrializzate con quello di contesti lontani dagli agi e i disturbi della vita moderna. Le popolazioni di cacciatori-raccoglitori dormono meno di noi, ma hanno ritmi circadiani più regolari. In base alla ricerca, pubblicata su Proceedings of the Royal Society B, sarebbe proprio la scarsa regolarità dei ritmi circadiani (i cicli, nell'arco delle 24 ore, con cui si ripetono certi processi fisiologici) a farci percepire le ore di sonno che dormiamo come poco riposanti. Non dormiamo meno: siamo meno riposati. Si è soliti dare per scontato che la pervasività degli schermi di computer, TV e cellulari abbia diminuito le ore di sonno che ci concediamo per notte. Ma la maggior parte degli studi che lo affermano si basano su valutazioni individuali e non su metodi di monitoraggio più rigorosi, come i dispositivi indossabili che rilevano l'attività fisica o gli elettrodi che registrano le onde cerebrali. Le ricerche costruite su misurazioni più attendibili rivelano che non c'è stato un declino nella durata del sonno negli ultimi cinquant'anni. Scienza Come funziona il nostro orologio biologico Notti brevi e movimentate. Passati studi di questo tipo avevano rivelato durate del sonno sorprendentemente brevi (e ricche di interruzioni) nelle popolazioni di cacciatori-raccoglitori moderne. Per esempio i San (un tempo noti come boscimani: un popolo che vive nella regione desertica del Kalahari, tra Sudafrica, Namibia e Botswana) dormono in media 6,7 ore a notte; gli Hadza della Tanzania 6,2 ore, i Bayaka, nella Repubblica Centrafricana e nel Congo, 5,9 ore; e gli Himba, un popolo di allevatori nomadi della Namibia, 5,5 ore. Riposo a confronto. Per il nuovo lavoro, Leela McKinnon e David Samson, dell'Università di Toronto Mississauga, hanno analizzato 54 studi sul sonno condotti in ogni parte del mondo, comparando le abitudini di sonno delle società industrializzate con quelle di piccole popolazioni lontane da tutto abitanti dell'Amazzonia, del Madagascar e delle Isole del Pacifico. In tutto, sono state coinvolte 866 persone: non un numero massiccio, ma è il campione più rappresentativo finora in studi di questo tipo. Scienza Sonno: uomini e donne non dormono allo stesso modo Sonni lunghi e sicuri. In generale, le persone coinvolte nello studio si sono attestate su 6,8 ore di sonno in media a notte. Ma nelle società non industrializzate la media è stata di 6,4 ore, contro le 7,1 delle società industrializzate. Dunque dormiamo di più, e in modo "più efficiente": passiamo a dormire l'88% del tempo che trascorriamo a letto. Per le popolazioni non industrializzate, le ore di sonno effettivo rappresentano il 74% del tempo trascorso a letto. Per i ricercatori, i guadagni in ore di sonno e in efficienza dipendono dalle migliori condizioni di sicurezza delle nostri notti, non trascorse a evitare predatori e popolazioni rivali. Ritmi irregolari. In cambio, però, abbiamo perso regolarità nei ritmi circadiani: nelle società industrializzate, l'indice di funzionalità circadiana, che valuta le condizioni del nostro orologio interno, raggiunge un punteggio di 0,63, contro la media di 0,7 di quelle non industrializzate. Siamo meno esposti a stimoli che regolarizzano e tutelano la ciclica regolarità dei ritmi fisiologici, come la luce diurna o le basse temperature notturne. Potrebbe essere questo il motivo per cui troviamo il sonno meno ristoratore, anche se lo studio non ha verificato questa ipotesi. 8 FOTO Fotogallery Sette ragioni per cui ti senti sempre stanco VAI ALLA GALLERY Fotogallery Sette ragioni per cui ti senti sempre stanco Andate a dormire presto dopo una lunga e produttiva giornata. Aprite gli occhi naturalmente qualche minuto prima della sveglia e... siete esausti, come se non aveste chiuso occhio. Non sempre per battere la stanchezza basta una buona dormita. Se il sonno non vi manca potrebbero essere altre, le abitudini che vi lasciano senza energie. Eccone alcune. Foto: © IPA Fai una vita troppo sedentaria. Il grasso che si accumula nell'organismo non solo richiede più energia per "essere portato in giro", ma rilascia leptina, un ormone collegato a un maggior senso di fatica percepito. Chi è sovrappeso ha anche più alti livelli di infiammazione cronica. Non c'è da stupirsi quindi, se dopo solo sei settimane di esercizio fisico moderato le persone riportino maggiori livelli di energia. Chi fa sport regolarmente riporta in genere anche una migliore qualità del sonno, a parità di ore dormite. Foto: © IPA Bevi troppo caffè. La caffeina contrasta l'attività dell'adenosina, un composto chimico che agisce da naturale sedativo nel sistema nervoso centrale, accumulandosi durante il giorno e facendoci venire sonno la sera. Al mattino può darci "la spinta" necessaria, tuttavia consumare caffè o bevande energizzanti meno di sei ore prima di dormire può influenzare la qualità del sonno. Spesso, non a caso, chi non assume caffeina si sente più riposato al risveglio. Dopo tre notti in bianco il caffè non serve più Foto: © IPA Adv Hai bevuto poca acqua. L'idratazione è indispensabile per il mantenimento dell'attenzione: è sufficiente una diminuzione dell'1,5% dei liquidi nell'organismo per registrare un calo nella concentrazione. Quando l'acqua scarseggia il sangue si fa più denso e i nutrienti arrivano ai muscoli e agli organi (cervello incluso) più lentamente. Fortunatamente, una disidratazione pari al 2% è sufficiente a farci avvertire la sete, e correre ai ripari. Servono davvero 8 bicchieri di acqua al giorno? Foto: © IPA Hai bevuto troppo alcol. D'accordo, dopo qualche bicchiere di vino (o di birra) extra ci si addormenta più in fretta. Ma alzare il gomito prima di andare a letto peggiora la qualità del sonno, soprattutto nella seconda parte della notte, perché riduce la naturale quantità di sonno REM di cui abbiamo bisogno. La scienza della sbronza (e di come farsela passare) Foto: © IPA Non segui una costante routine. Dormire fino a mezzogiorno nei weekend rende estremamente difficile adattarsi di nuovo agli orari "da ufficio" in settimana. Se avete arretrati di stanchezza da recuperare, piuttosto concedetevi pisolini di 20 minuti tra sabato e domenica, cercando però di svegliarvi a orari non troppo diversi da quelli feriali. A lungo andare, sarà più rigenerante. La scienza della pennichella Foto: © IPA Adv Soffri di ansia o depressione. La spossatezza è uno dei primi sintomi del disturbo d'ansia generalizzato: preoccuparsi costantemente degli esiti delle proprie decisioni o di che cosa pensano gli altri può risultare fisicamente estenuante. Inoltre, chi ha disturbi di ansia o depressione, fa più fatica a dormire, spesso soffre di insonnia o non trova il sonno rigenerante, anche se - in caso di depressione - si può dormire anche più del solito. 13 accorgimenti per combattere l'ansia Foto: © IPA Sei semplicemente un "gufo". Il 20% circa della popolazione è geneticamente predisposta a tirar tardi la sera e rendere il massimo nelle tarde ore della giornata. A queste persone, l'orario canonico di lavoro risulta costantemente stretto: gli esperti lo chiamano "jet lag sociale". Sei gufo o allodola? Un test per scoprirlo La stanchezza inspiegata potrebbe essere spia anche di condizioni mediche più serie come celiachia, anemia, apnee notturne, diabete o problemi di tiroide. Quello presentato non è un elenco esaustivo, tanto meno un prontuario medico. Foto: © IPA Approfondimenti Salute I sonniferi impediscono al cervello di ripulirsi Psicologia Perché il sonno profondo aiuta la memoria? Scienze Il sonno di uomini e donne è diverso Scienze Che cos'è e a cosa serve il rumore rosa? Salute Esistono davvero 5 diversi tipi di insonnia Curiosità Le feste ti tolgono il sonno? Ecco perché Salute Quello che credevi di sapere sul sonno è falso Salute È il sonno il segreto per dimagrire? Salute Più sonno, più salute: perché? Salute In inverno potremmo avere più bisogno di sonno Salute Lasciateci dormire! Salute Perché il dolore sembra più forte di notte? 1 marzo 2025 Elisabetta Intini Tag scienza - scienze - sonno - dormire - ritmi circadiani - orologio biologico - cacciatori-raccoglitori - hadzabe - tecnologia - notte - luce solare - evoluzione'''
