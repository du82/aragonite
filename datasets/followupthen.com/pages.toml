["https://www.followupthen.com/privacy"]
title = ""
full_description = 'Welcome to the website (the "Site") of FollowUpThen, Inc. ("FollowUpThen", "we", "us" and/or "our"). This Site is operated by FollowUpThen and has been created to provide information about our company and its reminder services (together with the Site, the "Services") to our Service visitors ("you", "your"). This Privacy Policy sets forth FollowUpThen’s policy with respect to information including personally identifiable data ("Personal Data") and other information that is collected from visitors to the Site and Services. Our Service allows users to forward emails to our Service for the purpose of setting automated reminders associated with those emails. We recognize that your emails may be very private, and we take special care with them. For example, we encrypt the message body of these emails using industry-standard methodologies for long-term storage on our servers. We store the content of these emails for the period of time required in order to send you the requested reminder. After the requested reminder period has expired and the Service has sent the reminder, we delete the message body, message text and attachments after a "reminder retention period", when the user can choose to postpone the reminder until a later date. The retention period is variable based on the account level, ranging between 2 weeks (for free accounts) and 6 months for "Company" accounts. For example, if you are on the free plan and forward an email to 5months@followupthen.com, we retain the complete email information for five (5) months plus six (2) weeks. Postponing the followup will extend the length of time the data persists in our system. In the rare event that the content of an email interferes with the operation of the Service (ie, due to a bug), the problematic email may be temporarily logged in full or otherwise viewed for the purposes of debugging. With respect to other email-related information, we store the subject heading of these emails unencrypted the purpose of performing internal quality assurance and debugging, and for reference when a FollowUpThen user is browsing the activity history for a contact. We also retain certain non-personally identifiable information related to these emails (for example, date sent, email configuration, name of the email provider), for the purpose of improving our Services and as described below in the "Non-Identifiable Data" section.'
year_published = 2025
clearnet = "https://www.followupthen.com/privacy"
