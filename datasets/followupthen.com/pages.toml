["https://followupthen.com/how"]
title = "How to Use FollowUpThen. The free and easy email reminder"
full_description = '''FollowUpThen becomes more effortless the more you use it. Here are tips to improve followup efficiency. Teach your email program common FUT formats by sending an email to autocomplete@followupthen.com Hit "reply all" to the email we send back, and that's it. Take the time to learn your email program's keyboard shortcuts. When combined with FUT, you will fly. Place FUT in the BCC field to keep it entirely hidden. The reminder goes to only you. Your recipients see no trace of FUT (other than your uncanny timing). Placing FUT in the "cc" field automatically sends a followup to everyone in the "to" field when the followup is due. Preview the future followup by simply clicking on it in the web app, or by sending yourself an email and cc'ing 1sec@fut.io. Threading, or "conversation view" is a setting in nearly all email programs. It groups new emails with previous emails in the same conversation. Without threading, hit "forward", delete the FUT content and send the email to your original recipient. You can also find the earlier message. Email-based actions are incredibly efficient, especially on mobile. They even work if your device is offline! Read more Clicking on an action ("postpone" in the example above) composes a new email. It is pre-populated with instructions which tell use to postpone the followup. Nearly all email programs support this. Configuration is sometimes required. You may be surprised to find that this simple reminder, in practice, feels more like a personal assistant — one that you can train and invest in, just like an actual assistant. Customize and extend FollowUpThen to get exactly what you need at the perfect moment to get something done. Thousands of date formats are supported. Experiment using your own timezone and account settings on your skills page. When combining different parts of a date, avoid putting the numbers together directly. Separate them with a "th" or "nd". For example, April29th2024@fut.io, not April292024 does not.'''
year_published = 2025
