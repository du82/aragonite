  Water Purification





















  
  






  Water purification systems in Fønix shelters ensure uninterrupted access to sterilized water, even during municipal disruptions. Heat sterilization eliminates even the most resistant microbes, while positive pressure in the delivery system prevents contamination.Specifications:Minimum 20 liters/day, maximum 100 liters/dayUp to 15 log reduction in bacterial contaminationUses heat sterilization at 140C - impossible for biological life to sustainPositively pressurized to ensure no contaminant intrusionEnergy efficient





















  
  














































  

              
            
                                                                                            
                                                                
