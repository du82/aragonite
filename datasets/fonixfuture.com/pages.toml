  Waste System





















  
  






  The waste system applies biosafety lab protocols to safely manage disposal without risking contamination, allowing inhabitants to maintain comfort and hygiene.Specifications:10 liters/person/dayBased on biosafety laboratory designReliable and easy to maintainHandles all waste streams (requires packaging and clothing to be shredded before disposal)





















  
  




  
  
  


  


      
                                
  
  
  
  
  
  


  
  



                  





  







          
  
                    

