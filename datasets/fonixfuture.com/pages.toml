  Decontamination Airlock





















  
  






  Fønix shelters feature an airlock, or decontamination chamber, for putting on and removing protective gear. It can house equipment like a vaporized hydrogen peroxide generator and includes clear instructions for safe entry and exit—the most vulnerable moments for contamination.





















  
  














































  

              
            
                                                                                            
                                                                
