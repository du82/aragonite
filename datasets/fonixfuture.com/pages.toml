  Who we are





















  
  






  Ulrik Horn has dedicated his career to tackling some of the world’s most pressing challenges, with Fønix as a natural evolution of this mission. After over a decade deploying renewable energy infrastructure globally to combat the climate crisis, he now focuses on creating resilient solutions to mitigate risks posed by emerging biotechnologies.Drawing inspiration from humanity’s legacy of preparedness—spanning ancient granaries to Cold War nuclear shelters—Ulrik incorporates the Nordic tradition of civilian nuclear shelters and seed vaults into the vision for Fønix. His approach ensures affordable, scalable protection for families and essential workers worldwide.In recent years, Ulrik has immersed himself in diverse research fields, from nuclear air filtration to sterile animal housing systems. This extensive exploration underpins the innovative design of Fønix shelters, now available to fortify communities against emerging global threats.





















  
  














































  

              
            
                                                                                            
                                                                
