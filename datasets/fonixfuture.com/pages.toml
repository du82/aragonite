  Decontamination Airlock





















  
  






  Fønix shelters feature an airlock, or decontamination chamber, for putting on and removing protective gear. It can house equipment like a vaporized hydrogen peroxide generator and includes clear instructions for safe entry and exit—the most vulnerable moments for contamination.The shelters come with detailed instructions for best practices in decontamination and protective gear as exit and entry procedures are the most vulnerable point of any protective structure against outside contaminants. Specifications:26 sqm floor areaSpace for donning/doffing protective gearAccommodates decontamination equipment10 ACH in 30 min ensuring thorough purging before entry





















  
  














































  

              
            
                                                                                            
                                                                
