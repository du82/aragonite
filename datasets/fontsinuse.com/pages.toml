full_description = "Review by Stephen Coles Sep 5th, 2024 Harris/Walz 2024 US Presidential Campaign A move to the center: Kamala Harris takes a more conventional typographic approach in her second bid for the White House. Read More… Review by Florian Hardwig Aug 13th, 2024 As We Are Now book jacket A homage to Ursula Suess on the occasion of her 100th birthday Read More… Review by Stephen Coles Mar 11th, 2024 Martyr! book jacket A sparkling cover for a dazzling novel (and a suggestion for future flaps) Read More… Review by Florian Hardwig Sep 17th, 2023 Metra tickets, 1990–1991 Every month, Chicago’s commuter rail system releases a new ticket design. We examine the typographic diversity found in this batch of early 1990s ephemera from the collection of Nick Rougeux. Read More… Review by Florian Hardwig Apr 28th, 2023 Gestaltungsprobleme des Grafikers by Josef Müller-Brockmann We celebrate Akzidenz-Grotesk’s 125th birthday with one of its most iconic uses by a die-hard fan of the typeface. Read More… Review by Florian Hardwig Feb 13th, 2023 März book covers, 1969–1987 The identity for the emancipatory books by the radical West German publisher consists of two simple ingredients: the Block typeface and the color combo yellow, red and black. Read More… Review by Florian Hardwig Jan 26th, 2023 The Mystery of the Dune Font Putting a name to the typeface that defined the visual identity of the science fiction series and its author, Frank Herbert Read More… Review by Florian Hardwig Dec 26th, 2022 Rudolph the Red-Nosed Reindeer movie titles The classic Christmas TV special opens with letterforms that can be traced back to the Lettera alphabet book series, Ben Shahn lettering, and Romanesque capitals. Read More… Review by Nick Sherman Oct 17th, 2022 The Exorcist movie titles The classic horror film carried over an iconic typographic style from the novel it was based on, but later editions diverged curiously. Read More… Sponsor Out now: JAF Cupidus A rounded sans with an ultra-high x-height (or, ultra-short extenders)! Get it from Just Another Foundry: justanotherfoundry.com/cupidus Review by Maria Paganopoulou Oct 6th, 2022 Reclaiming the City, Reclaiming Words: Póli Gynaikón – City of Women Looking back on the Greek feminist periodical from the 1980s Read More… Review by Fonts In Use Staff May 12th, 2022 Call for Entries: Finding Forte A global crowdsourcing campaign is looking for in-use examples of the ubiquitous yet overlooked script typeface Read More… Review by Stephen Coles Aug 17th, 2021 Sega logo (1976–present) What does the video game manufacturer have in common with CNN? Both companies’ marks started with a typeface by Japanese designer Teruoki Yagi. Read More… Review by Florian Hardwig Jun 26th, 2021 I ❤️ NY On his 92th birthday, and one year after his death, we commemorate Milton Glaser’s most iconic creation. Read More… Review by Florian Hardwig Jun 20th, 2021 Philip K. Dick paperback covers (Panther Science Fiction) Over almost two decades, Roslyn Gothic graced dozens of covers with works by the writer, building a visual identity for the master of dystopian fiction. Read More… 1 2 3 4 5 Next Last"
