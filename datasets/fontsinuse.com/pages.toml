["https://fontsinuse.com/colophon"]
title = "Colophon - Fonts In Use"
description = "A searchable archive of typographic design, indexed by typeface, format, and topic."
full_description = "Colophon Fonts In Use is an independent project run by Florian Hardwig, Rob Meek, Nick Sherman, and Stephen Coles. Learn more. Staff Florian Hardwig Managing Editor Florian is a typographer, type writer, and researcher. With his Berlin-based studio Kaune & Hardwig he shapes books, websites, and other publications. He takes pictures of peculiar letterforms. See Uses and Blog posts contributed by Florian » Rob Meek Developer Rob is a creative technologist based in Berlin. He has created a number of typographic tools including FontStruct (for FontShop), the Meek FM typographic synthesizer, and the FontShop CS plugin. Nick Sherman Co-founder, Designer Nick is a Brooklyn-based typographer and typographic consultant. A graduate of Type@Cooper and MassArt, he has worked at Font Bureau, Webtype, and MyFonts, directing web design and promotional material for typefaces. He serves on the board of directors for the Type Directors Club, the Adobe Typography Customer Advisory Board, as well as the artistic board for the Hamilton Wood Type & Printing Museum. Occasionally he teaches typography, responsive design, and/or typeface design. Originally from Cape Cod and Boston, he is also a skateboarder, pizza enthusiast, musician, and classic horror film buff. See Uses and Blog posts contributed by Nick » Stephen Coles Co-founder, Editor Stephen is a writer, editor, and typographic consultant who is particularly interested in typeface selection and the relationship between font makers and users, frequently advocating for the interests of both groups. Along with Fonts In Use he publishes Typographica is the author of the book The Anatomy of Type. His day job is at Letterform Archive as Associate Curator and Editorial Director. He was formerly a creative director at FontShop and a member of the FontFont TypeBoard. See Uses and Blog posts contributed by Stephen » Matthijs Sluiter Editor Matthijs is a typographer and designer at his Studio Het Mes in The Hague. The studio focuses on communication in public space, working mostly for educational and cultural institutions. Find regular posts of Matthijs’ collection of type specimens on Instagram. See Uses and Blog posts contributed by Matthijs » Juliette Duhé Editor Juliette is a French independent art director, graphic and type designer based in Montreal. She mostly works with clients and collaborators across the field of visual arts, music, and cultural events. She is specialized in visual identity, web design and publishing, with a focus on typography. Juliette shaped a range of letters, including Compagnon. See Uses contributed by Juliette » Caren Litherland Editor Caren is an editor, writer, and designer in New York. She edits for A Book Apart, Typographica, and clients around the world and is an alumna of H&FJ, A List Apart, and Type Network. See Uses contributed by Caren » Past staff members Sam Berlow Co-Founder After graduating from The University of Wisconsin-Madison with a degree in History, Sam Berlow migrated east to work in the Boston Public Schools. In 1992 he joined the Font Bureau as General Manager. Along with Fonts In Use, Sam co-founded Webtype, Type Network, and The Type Founders. See Uses and Blog posts contributed by Sam » Indra Kupferschmid Editor Indra had been an editor and contributor at Fonts In Use from its first days in 2010 to 2015 and is now mostly posting on Alphabettes.org. See Uses and Blog posts contributed by Indra » Tânia Raposo Contributor Tânia is a graphic and type designer living in the San Francisco Bay Area who is passionate about books, food, stamps and cats. She studied at ESAD.CR Caldas da Rainha and KABK in The Hague, where she got her Type & Media Master’s degree. She has shared her love for type and typography through workshops in Portugal, Germany, and the UK. See Uses contributed by Tânia » Jennifer Kennard Contributor Jennifer is a designer, writer and educator who has written about books, printing, design, and the culture of typography for Letterology since 2008. Her own design and illustration work has been featured in industry design annuals, journals, and included in the special collections of universities and the Smithsonians’ archives. She taught typography and traditional book design practices to design students for six years at Seattle Central Creative Academy and The School for Visual Concepts. She looks forward to writing and designing some of her own books. See Uses and Blog posts contributed by Jennifer » André Mora Contributor André is a typographer who has made a lot of magazines and worked for Font Bureau and Process Type Foundry. See Uses and Blog posts contributed by André » Contact Us Have a question or interested in sponsoring? Reach us here. A Note on the Type Fonts used on this site include Relay Condensed (Occupant) and Benton Sans RE (Font Bureau)."
