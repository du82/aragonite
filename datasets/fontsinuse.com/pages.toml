["https://fontsinuse.com/about"]
title = "About This Site - Fonts In Use"
description = "A searchable archive of typographic design, indexed by typeface, format, and topic."
full_description = "About This Site Fonts In Use is a public archive of typography indexed by typeface, format, industry, and period. Supported by examples contributed by the public, we document and examine graphic design with the goal of improving typographic literacy and appreciation. Designers use our site for project research, type selection and pairing, and discovering new ways to choose and use fonts. The first incarnation of the site launched in December 2010 as a Blog. The full-fledged version, which debuted in July 2012, introduced the Collection, a much larger database open to contributions from visitors. More info: Meet the staff. Watch a presentation about the project. See our editorial policy and disclosure statement. Answer all your other questions. Participate! To contribute to the Collection, create an account and submit Uses: Click “Add a Use” from the account menu in the top right corner of the site. It opens a page that lets you upload images from your computer and add typeface, category, description, and copyright info. You can also use the bookmarklet to quickly and easily add Uses directly from nearly any website. Just drag the bookmarklet (below) to your bookmarks toolbar and click on it whenever you see an image (or images) you want to contribute. The image(s) will be sent to the “Add a Use” form where you can add more detail. Fonts In Use ↑ Drag to bookmark bar. Almost any kind of image (with a few exceptions) is welcome in the Collection, as long as type is clearly visible. Of course, large images are preferred to small ones. Don’t worry about resizing — images are automatically scaled to fit the site. All you need is an image, a title, and a short description. Commentary, typeface tags, or other metadata, are also welcome, but not required. Read more about contributing to the Collection."
year_published = 2025
clearnet = "https://fontsinuse.com/about"
