e":"Review"},{"name":"loads of duplicates, too many","reviewBody":"bought a few bundles. one of them had 3 of the same issue and the others had duplicates too. so i really didnt get much out of mine, wasnt happy at all tbh so wont be buying them again regardless how cheap, most likely get 4 of the same issue next time i buy! i know they're randomly selected but maybe they could at least make note of when a duplicate is added, most of us just like to read and not have to either sell spare comics/bin them/use up space to store them.","reviewRating":{"ratingValue":2,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-06-11T22:08:34.718590+01:00","datePublished":"2023-09-11T16:35:29.147476+01:00","author":"DJ","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"These have gone downhill","reviewBody":"They used to be good value but far too much duplication and drivel in the last few packs. Also quite a few 18+ titles without age verification.","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-05-04T15:50:29.161926+01:00","datePublished":"2023-05-05T09:30:30.571671+01:00","author":"mjm","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Absolutely delighted ","reviewBody":"Took a chance and ordered a pack and couldn't be happier. I received;\nBrzrkr #1\nX Factor #2\nFuture State: The Next Batman #1\nBlade Runner 2029 #3\nAnd for those moaning about duplicates, it clearly states that there is a high chance that you will get the same packs.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-04-20T11:24:35.474998+01:00","datePublished":"2023-05-05T09:30:31.953325+01:00","author":"PM1985","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Comic grab bag","reviewBody":"Very poor selection all independents no marvel or dc as advertised","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-04-12T17:54:23+01:00","datePublished":"2023-12-27T14:17:07Z","author":"Michael fisher","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Wowzers","reviewBody":"Absolutely the best value for money and entertainment... Bought 20 grab bags and got a huge selection of different titles, variant covers, lots of #1 s and lots of comics that I wouldn't have ever bought, however they were excellent and a change from the usual is good and I now have a few new favourites that I otherwise wouldn't of had Thanks to the Grab Bag... Downside if you are a real greed head is you might get a few duplicates... But it makes your boxes look more stacked... cheers","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-03-18T18:54:55.571082Z","datePublished":"2023-04-11T09:58:41.040871+01:00","author":"REWS333","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Mix them up a bit please...","reviewBody":"I bought nine grab bags recently, fully understanding that there would be a chance of duplication amongst some of 