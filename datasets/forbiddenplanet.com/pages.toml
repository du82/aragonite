met, featuring advanced LED technology, fans can imagine Star Wars action and adventure. \nUsed by the Empire for various missions, scout troopers were lightly armored compared with other Stormtroopers, which allowed them to move more quickly and easily in a range of environments\nFeaturing highly detailed deco, movie-inspired design, adjustable fit, and electronic voice distortion, this full-scale Scout Trooper Black Series helmet is an iconic addition to any Star Wars fan’s collection \nWith the press of a button, fans and collectors can distort their voice to sound like that of a Scout Trooper\nWith this Star Wars Black Series helmet, fans can imagine scenes from the Star Wars Galaxy inspired by the movie\nLook for other Star Wars The Black Series premium roleplay items such as the Force FX Lightsaber collection (Sold separately. Subject to availability.) \nStar Wars products are produced by Hasbro under license from Lucasfilm Ltd. \nHasbro and all related terms are trademarks of Hasbro. \nIncludes: Helmet and instructions. \nAges 14 and up \nx1 1.5v AAA ALKALINE BATTERY REQUIRED. Not included.","image":"https://media.forbiddenplanet.com/products/7a/ae/5d612c97332e11f07b35089248545b42fb77.png","mainEntityOfPage":"https://forbiddenplanet.com/393586-star-wars-black-series-electronic-replica-helmet-biker-scout/","name":"Star Wars: Black Series Electronic Replica Helmet: Biker Scout","url":"https://forbiddenplanet.com/393586-star-wars-black-series-electronic-replica-helmet-biker-scout/","category":"Toys & Collectibles > Props & Replicas","mpn":"F6911","offers":{"availability":"https://schema.org/InStock","price":104.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:393586","releaseDate":"2024-06-20","reviews":[],"sku":"5126217","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Graphic NovelSale The Sandman: Morpheus Helm Masterpiece Edition (Hardcover) £300.00 was £310.50 RRP£450.00Graphic Novels {"description":"New York Times bestselling author Neil Gaiman’s comics masterpiece, The Sandman, is regarded as one of the greatest graphic novels of all time.\nIt has won numerous literary awards, been adapted into an Audible audio drama, and most recently premiered as a highly acclaimed Netflix live-action show. This highly imaginative and thought-provoking series has endeared itself to fantasy and comics fans worldwide.\nNow you can own a piece of the Dreaming in the waking world with this Masterpiece Edition book set, comprising six exclusive leather-bound, foil-embossed hardcovers and a custom sculpted book stand resembling Morpheus’s helm. \nThese six volumes collect stories from the entire Sandman saga including The Sandman #1-75, the comics and prose editions of The Sandman: The Dream Hunters, The Sandman: Endless Nights, and The Sandman: Overture. \nThey are designed to fit perfectly in the intricately carved book stand that features a highly detailed bone snout and riveted exterior.\nAlso included is a set of art prints from legendary illustrator Michael Wm. Kaluta and an original piece of epistolary fiction from the world of The Sandman–written by Neil Gaiman himself, and exclusive to this set!\nThe Masterpiece Edition book set and stand is the perfect way to display these treasured DC volumes and is the ultimate gift for fans of The Sandman.","image":"https://media.forbiddenplanet.com/products/1f/44/74639585df201656859fd9a2792343038e7c.jpg","mainEntityOfPage":"https://forbiddenplanet.com/384179-the-sandman-morpheus-helm-masterpiece-edition-hardcover/","name":"The Sandman: Morpheus Helm Masterpiece Edition (Hardcover)","url":"https://forbiddenplanet.com/384179-the-sandman-morpheus-helm-masterpiece-edition-hardcover/","category":"Comics & Graphic Novels > Graphic Novels","gtin13":"9781779523518","mpn":"0323DC132","offers":{"availability":"https://schema.org/InStock","price":300.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781779523518","releaseDate":"2023-11-21","reviews":[],"sku":"5994700","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Props & ReplicaLimited Edition UFO: Model Replica: UFO £124.99Props & Replicas {"description":"Immerse yourself in nostalgia with an exclusive, meticulously crafted collectible that pays homage to the groundbreaking 1970s sci-fi series UFO by Gerry Anderson. \nKnown for its imaginative storytelling and pioneering use of special effects, relive the excitement of this cult classic with a model that perfectly captures the essence of the show’s iconic UFO spacecraft.\nThe UFOs in the show were known for their sleek, humming top-like design and mesmerising spinning motion, elements meticulously reproduced in this collectible with its moving parts. Each exquisite model, with a precise 200 mm diameter and high degree of screen accuracy, is made from brand-new tooling. \nThis is more than just a model – it’s a connection to television history, representing the era when Gerry Anderson’s innovative vision brought complex themes of alien encounters and military secrecy to life.\nThe craftsmanship and attention to detail make this piece a standout addition to any collection, embodying the futuristic and slightly eerie aesthetic that captivated audiences and set UFO apart from other series of its time.\nEach model is constructed from top-quality ABS plastic ensuring an authentic, detailed look that true enthusiasts will appreciate. Displayed on a custom clear acrylic base, the model comes in luxury packaging with an individually numbered and signed Certificate of Authenticity, assuring collectors of its genuine and limited nature: each model is one of only 2,004 units. \nDon’t miss the opportunity to own this unique collectible. Secure your piece of sci-fi nostalgia today and celebrate the enduring legacy of UFO, a show that paved the way for future science fiction series.\n200mm diameter\nSpining mechanism\nAcrylic display stand\nDeluxe box\nSequentially numbered certificate of authenticity\nProduction Qty: Limited to 2,004 units Worldwide\nBox size: 35 x 25 x 16 cm\nBox &amp; model weight: 870g\nModel &amp; base weight: 420g","image":"https://media.forbiddenplanet.com/products/eb/0e/95431697d385b3dfb28ba9d8499027275f81.png","mainEntityOfPage":"https://forbiddenplanet.com/443810-ufo-model-replica-ufo/","name":"UFO: Model Replica: UFO","url":"https://forbiddenplanet.com/443810-ufo-model-replica-ufo/","category":"Toys & Collectibles > Props & Replicas","gtin13":"5056463529454","mpn":"SKU-HOL-UFO1","offers":{"availability":"https://schema.org/InStock","price":124.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5056463529454","releaseDate":"2025-01-20","reviews":[],"sku":"6724696","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}CoinLimited Edition Metal Gear Solid: Limited Edition Metal Ingot: Foxhound Insignia £17.99 RRP£19.99Props & Replicas {"description":"Calling all FOXHOUND International Special Forces Units. This Officially Licensed merchandise displays this iconic video game franchise in all its glory! Our Metal Gear Solid ingot, highly embossed with the ‘FOXHOUND’ Insignia is Limited Edition with each item being individually numbered. A display stand is included within the presentation box. \nLimited to 5000 worldwide.","image":"https://media.forbiddenplanet.com/products/a3/8b/93c82c8e976414a815c17d0141624f609af3.png","mainEntityOfPage":"https://forbiddenplanet.com/405337-metal-gear-solid-limited-edition-metal-ingot-foxhound-insignia/","name":"Metal Gear Solid: Limited Edition Metal Ingot: Foxhound Insignia ","url":"https://forbiddenplanet.com/405337-metal-gear-solid-limited-edition-metal-ingot-