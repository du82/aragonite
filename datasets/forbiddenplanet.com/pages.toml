full_description = '''146 results in Books ▸ Gaming Fiction Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookPre-Order Dead Space: Martyr £6.99 RRP£9.99Due for release:22 Apr 2025Gaming Fiction {"description":"A prequel to Dead Space, the novel focuses on the birth of Unitology. In this novel set centuries before the events of the main series, geophysicist Michael Altman investigates an alien artefact called The Black Marker.\nWe have seen the future.\nA universe cursed with life after death.\nIt all started deep beneath the Yucatan peninsula, where an archaeological discovery took us into a new age, bringing us face-to-face with our origins and destiny.\nMichael Altman had a theory that no one would hear.\nIt cursed our world for centuries to come.\nThis, at last, is his story.","image":"https://media.forbiddenplanet.com/products/68/ce/2e2c25d0e01cecc8987e5aaf2a84dd8b25c6.jpg","mainEntityOfPage":"https://forbiddenplanet.com/444004-dead-space-martyr/","name":"Dead Space: Martyr ","url":"https://forbiddenplanet.com/444004-dead-space-martyr/","category":"Books > Gaming Fiction","gtin13":"9781835414347","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":6.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835414347","releaseDate":"2025-04-22","reviews":[],"sku":"6749538","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book RuneScape: The Gift Of Guthix £7.99 RRP£9.99Fantasy {"description":"A thrilling epic of betrayal and magic set during the founding of Falador and the doomed Fremennik Great Invasion. Sure to delight RuneScape fans old and new, this stunning tale shows how the gift of magic changed the course of Gielinor forever.\nAsgarnia’s fate hangs in the balance. Disparate tribes unite under the banner of Lord Raddalin, and his enemies look on in fear and hatred. Raddalin’s advisors – an uneasy alliance of Black and White knights – whisper of a discovery in the North that will give them the power to change everything.\nCaught in the midst of history, a lowly scribe and the son of a Jarl hold the fate of Raddalin’s new kingdom in their hands.\nFrom the glorious inauguration of King Raddalin’s reign to the disgraceful expulsion of the Zamorakians from Asgarnia, The Gift of Guthix tells an epic tale of the origin of magic, the plight of civil war, and the crushing defeat of the Fremennik Great Invasion. Amongst plots and betrayals, a penitent turncoat waits for her moment to leap into the unknown.","image":"https://media.forbiddenplanet.com/products/6e/12/6cdeba79ea53d50a753a14b8198881c9a1bf.jpg","mainEntityOfPage":"https://forbiddenplanet.com/405802-runescape-the-gift-of-guthix/","name":"RuneScape: The Gift Of Guthix","url":"https://forbiddenplanet.com/405802-runescape-the-gift-of-guthix/","category":"Books > Fantasy","gtin13":"9781803365213","mpn":"","offers":{"availability":"https://schema.org/InStock","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803365213","releaseDate":"2024-05-14","reviews":[],"sku":"5121311","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Encyclopaedia Eorzea: The World Of Final Fantasy XIV (Hardcover) £29.97 RRP£37.99Art & Design {"description":"The first volume of the official Final Fantasy XIV lore books, written and compiled by the Final Fantasy XIV development team! This deluxe, full-colour, hardcover volume is the definitive guide to the world of the massively popular online game.\nWith hundreds of pages detailing everything from Eorzea’s history and cultures to her geography and inhabitants, this expertly crafted tome is a veritable treasure trove of invaluable information. Encyclopaedia Eorzea offers an in-depth look at the realm’s city-states, organisations, and leading players, as well as its various professions and their foremost practitioners.\nReaders will also gain insight into Eorzea’s beastmen their cultures, customs, and deities and detailed data on the realm’s myriad creatures, from the timid to the terrifying. A timeless gift to all who call Eorzea home. Includes an exclusive bonus item code for an in-game Namingway minion!","image":"https://media.forbiddenplanet.com/products/41/4b/eaa252b98e3e4bed6096b7678745d995870e.jpg","mainEntityOfPage":"https://forbiddenplanet.com/350877-encyclopaedia-eorzea-the-world-of-final-fantasy-xiv-hardcover/","name":"Encyclopaedia Eorzea: The World Of Final Fantasy XIV (Hardcover)","url":"https://forbiddenplanet.com/350877-encyclopaedia-eorzea-the-world-of-final-fantasy-xiv-hardcover/","category":"Books > Art & Design","gtin13":"9781646091423","mpn":"","offers":{"availability":"https://schema.org/InStock","price":29.97,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781646091423","releaseDate":"2022-08-08","reviews":[],"sku":"5550548","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Marvel: Avengers: The Extinction Key £2.99 was £7.99 RRP£8.99Action & Adventure {"description":"The official prequel to Marvel’s Avengers from Marvel, Crystal Dynamics, Eidos Montreal, and Square Enix, with an exclusive adventure that leads into the game itself.\nThe official prequel to the blockbuster action video game Marvel’s Avengers, written by bestselling author Greg Keyes. The game is being developed by Crystal Dynamics, Eidos Montréal, Nixxes, and published by Square Enix. \nThe novel leads into the game as an ancient organisation called the Zodiac seeks to acquire an infinitely powerful weapon - the Zodiac Key. Captain America, Iron Man, Thor, Black Widow, and the Hulk must stop them before they use the key to warp the very fabric of time and space. \nWith the help of allies including Doctor Strange, Doctor Voodoo, and agents of S.H.I.E.L.D., they comb the globe to combat thirteen villains whose eldritch powers are a combination of technology and centuries-old sorcery.","image":"https://media.forbiddenplanet.com/products/ec/34/e342b7e0644db3db888dd2e5c20f4e9c3281.jpg","mainEntityOfPage":"https://forbiddenplanet.com/293004-marvel-avengers-the-extinction-key/","name":"Marvel: Avengers: The Extinction Key","url":"https://forbiddenplanet.com/293004-marvel-avengers-the-extinction-key/","category":"Books > Action & Adventure","gtin13":"9781789092066","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789092066","releaseDate":"2020-09-01","reviews":[],"sku":"4183723","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Fiction Companions Codex: Night Of The Hunter £4.00 RRP£5.99Books {"description":"R.A. Salvatore’s New York Times best-selling saga continues as dark elf Drizzt Do’Urden returns to Gauntlgrym with old friends by his side once again, as they seek to rescue Bruenor’s loyal shield dwarf-turned-vampire. \nBut not only do Drizzt and his allies face a perilous journey through the Underdark and the dangers of the undead that lie within, but they must cross through a colony of drow, who would like nothing better than to see Drizzt Do’Urden dead. ","image":"https://media.forbiddenplanet.com/products/128082.jpg","mainEntityOfPage":"https://forbiddenplanet.com/128082-companions-codex-night-of-the-hunter/","name":"Companions Codex: Night Of The Hunter","url":"https://forbiddenplanet.com/128082-companions-codex-night-of-the-hunter/","category":"Books","gtin13":"9780786965175","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780786965175","releaseDate":"2014-09-14","reviews":[],"sku":"3152805","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Endless Universe: Shadow Of The Endless £6.99 RRP£9.99Reviews★★★★★ (2)Gaming Fiction {"description":"WITHIN DEDICATION LIES TREACHERY. \nWITHIN TURMOIL LIES HOPE.\nPersecuted for their worship of the Endless, an ancient, galactic-spanning race of god-like power, who disappeared eons past—the Pilgrims escaped the world of Raia almost a century ago, fleeing the despotic rule of the United Empire in a dozen space-faring fleets.\nYoung Pilgrim Sewa Eze wants nothing more than to become a caver and head into the depths of deserted moons, asteroids, and worlds to secure whatever the fleet needs: precious resources, Endless relics, even Dust. However, when she discovers a strange device deep in the ice of the comet they shelter on, it becomes clear dark forces are afoot. Selected for a leadership role at the Ceremony of Duties, she must reassess her life, beginning with finding the traitor in their ranks who threatens her entire fleet’s existence.\nThe course of Sewa’s life changes forever as she is forced to confront treachery, discover the secrets of the ancient past and travel to the very heart of the tyrannical United Empire.","image":"https://media.forbiddenplanet.com/products/a1/f9/d2f377113c2e718286d507871ee2954194f4.jpg","mainEntityOfPage":"https://forbiddenplanet.com/413492-endless-universe-shadow-of-the-endless/","name":"Endless Universe: Shadow Of The Endless","url":"https://forbiddenplanet.com/413492-endless-universe-shadow-of-the-endless/","aggregateRating":{"ratingCount":2,"reviewCount":2,"ratingValue":5.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Books > Gaming Fiction","gtin13":"9781835410448","mpn":"","offers":{"availability":"https://schema.org/InStock","price":6.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835410448","releaseDate":"2024-10-30","reviews":[{"name":"Worthwhile Dive Into the Endless Universe","reviewBody":"Immediate caveat that I've played all of the Endless games including Endless Space, from which this novel takes a lot of its world building. I absolutely loved this book. Shadow of the Endless follows Sewa, a young adult on the run from a totalitarian civilization known as the United Empire, as she comes to terms with betrayal, abandonment, and drastic self rediscovery. If you're a fan of the Endless Universe or not, I think this book is really a treat if you enjoy Science Fiction. The descriptions of cave diving were fascinating; the characters and their motivations were compelling; and the overarching plot kept me hooked to the end. If they end up releasing another book, I'll definitely be giving it a try.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-11-12T16:38:19.235415Z","datePublished":"2024-12-11T12:38:55.549491Z","author":"Mooseknee","itemReviewed":{"url":"https://forbiddenplanet.com/413492-endless-universe-shadow-of-the-endless/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great read","reviewBody":"I was recommended to pick this up by a friend.\r\n\r\nDespite having no prior experience of the Endless universe it was a great read. Entertaining, well paced, it maintained a good level of tension throughout. There was enough explanation of the lore to ensure the book made sense to newcomers like myself, while not being overdone - so should still appeal to people who already know the universe from the games.\r\n\r\nThoroughly recommend - I found it engaging from start to finish","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-10-25T08:59:44.660681+01:00","datePublished":"2024-12-11T12:38:56.179670Z","author":"Ferg","itemReviewed":{"url":"https://forbiddenplanet.com/413492-endless-universe-shadow-of-the-endless/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"6363406","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Life Is Strange: Heatwaves £6.99 RRP£9.99Gaming Fiction {"description":"Alex and Steph have left Haven Springs in the rear-view mirror to travel the country, chasing the horizon. Though they don’t have much money, they have their guitar and drums and each other. But when their vehicle breaks down, they are stranded, their only hope a repair shop in a struggling town in the middle of nowhere.\nThe town is dealing with a severe drought after an extended heatwave wreaked havoc on local crops, plunging its inhabitants into poverty and water rationing. What remains of its essential resources are being diverted to indulge the local senator, gathering support for their out-of-touch political campaign.\nFeeling the anger and despair of the town’s inhabitants,\nAlex and Steph are compelled to do everything they can to help. But when Alex uses her powers to amplify the senator’s fear of the climate crisis, in the hope of galvanizing their support, her plan backfires, and emotions spiral wildly out of control. Alex and Steph now need to find a way to revive the hope of a failing town and resurrect its history of political action to save the townsfolk—and themselves.","image":"https://media.forbiddenplanet.com/products/cf/16/d67b3f980f4e6c73d606dd2443caec58e394.jpg","mainEntityOfPage":"https://forbiddenplanet.com/413469-life-is-strange-heatwaves/","name":"Life Is Strange: Heatwaves","url":"https://forbiddenplanet.com/413469-life-is-strange-heatwaves/","category":"Books > Gaming Fiction","gtin13":"9781789099645","mpn":"","offers":{"availability":"https://schema.org/InStock","price":6.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789099645","releaseDate":"2024-07-30","reviews":[],"sku":"6287818","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book The Official Far Cry Survival Manual (Hardcover) £16.19 RRP£22.99Gaming Fiction {"description":"The Far Cry video game series has taken players on extreme adventures around the world: from untamed tropical islands to towering mountains and beyond, this blockbuster series thrusts players into exciting but deadly sce'''
