title = "Copper Coins: Tong Qian Kan Shi: Volume 1 from Copper Coins by Mu Su Li published by Seven Seas @ ForbiddenPlanet.com - UK and Worldwide Cult Entertainment Megastore"
description = "In this historical fantasy danmei (Boys’ Love), a monk with amnesia and two raggedy paper dolls inhabited by a dragon and a ghost embark on a journey to reclaim their former glory. But can they endure each other long enough to find what they seek? Under the blue glow of dawn, Xue Xian former dragon and current paper doll is mere moments away..."
full_description = "Copper Coins: Tong Qian Kan Shi: Volume 1Pre-OrderFrom: Copper Coins Author: Mu Su Li Published by: Seven Seas £12.77 RRP£17.99Add to BasketThis item is available to pre-order.Due for release: September 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionIn this historical fantasy danmei (Boys’ Love), a monk with amnesia and two raggedy paper dolls inhabited by a dragon and a ghost embark on a journey to reclaim their former glory. But can they endure each other long enough to find what they seek?Under the blue glow of dawn, Xue Xian former dragon and current paper doll is mere moments away from being kidnapped and exorcized. Except, Xue Xian has no idea! Instead, he’s cursed to be trapped in the form of a hideous paper doll alongside the bickering Jiang Shining, a former ghost indebted to assist Xue Xian in reclaiming his lost glory and, ultimately, avenging the wrongs inflicted upon him.So when a monk with amnesia named Xuanmin hot on the trail of an unknown curse arrives at the burnt ruins of Jiang Manor, he quickly finds the source. Putting off the exorcism for his return, Xuanmin unceremoniously stuffs two crude paper dolls inside his pouch and heads back, none the wiser. Furious, Xue Xian grumpily stews in captivity and declares a new vow: To turn this high-minded monk’s life into a living hell!Trapped as a traveling trio, they must suffer one another’s company while seeking answers to their growing list of questions: Will Jiang Shining be able to fulfill the unfinished business that tethers him to this mortal coil? Will Xue Xian be able to crack Xuanmin’s icy demeanor, and will he like what he finds if he does? More importantly still, who even is Xuanmin?Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreAuthor Mu Su LiGenresAnime & MangaAction & AdventureDramaFantasyShojoHistorical FictionPublisherSeven SeasSeries Copper CoinsTypeMangaBindingTrade PaperbackVolume1Cat. No.6871222EAN979889561082451999ISBN9798895610824"
