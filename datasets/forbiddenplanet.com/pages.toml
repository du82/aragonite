full_description = '''291 results in Books ▸ Humour Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSale Rick & Morty: Show Me What You Got (Hardcover) £2.99 was £25.99 RRP£29.99Art & Design {"description":"Delve into the worlds of Rick and Morty in this stunning memento showcasing the best of the Gallery 1988 exhibition. \nTogether with Adult Swim, the gallery commissioned a series of art pieces to celebrate moments, characters, storylines and episodes from the show. The event was a huge hit and the limited pieces sold out at one one-hundredth the speed of reality.\nRick and Morty: Show Me What You Got allows fans to explore the stunning artwork from the exhibition. Artists have contributed passionately made posters, sculptures, book covers, hip flasks and much more to commemorate this beloved series. Discover what inspired them, see their work in progress, and enjoy a collection of stunning, original Rick and Morty artwork.","image":"https://media.forbiddenplanet.com/products/c0/ac/f5e33f6ebb55ed1359b1c6c1f4d077c508da.jpg","mainEntityOfPage":"https://forbiddenplanet.com/278721-rick-morty-show-me-what-you-got-hardcover/","name":"Rick & Morty: Show Me What You Got (Hardcover)","url":"https://forbiddenplanet.com/278721-rick-morty-show-me-what-you-got-hardcover/","category":"Books > Art & Design","gtin13":"9781789092073","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789092073","releaseDate":"2019-11-19","reviews":[],"sku":"4610243","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Doctor Who: Whodle £9.99 RRP£12.99Film, TV, & Music {"description":"Join your favourite Time Lord (every one of them!) as a whole host of puzzling mysteries await… \nWhich of three possible substances would make the best weapon against a Dalek? How can you tell which mannequin is an Auton? Where in the universe is the Master hiding? \nTravel through space and time, and across worlds, ships and space stations, as you crack clues, make deductions and solve cases. \nUsing your puzzling powers of logic (plus maybe a sonic screwdriver and some physic paper), it’s down to YOU to help the Doctor and their companions fight monsters and save the day.","image":"https://media.forbiddenplanet.com/products/e3/b6/48c1a8d3c20cec204837cbe00146299d4ecf.jpg","mainEntityOfPage":"https://forbiddenplanet.com/434680-doctor-who-whodle/","name":"Doctor Who: Whodle","url":"https://forbiddenplanet.com/434680-doctor-who-whodle/","category":"Books > Film, TV, & Music","gtin13":"9781405971843","mpn":"","offers":{"availability":"https://schema.org/InStock","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781405971843","releaseDate":"2024-10-14","reviews":[],"sku":"6623371","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Hex Life: Wicked New Tales Of Witchery (Hardcover) £14.99 RRP£17.99Fantasy {"description":"These are tales of witches, wickedness, evil and cunning. Stories of disruption and subversion by today’s women you should fear. \nIncluding Kelley Armstrong, Rachel Caine and Sherrilyn Kenyon writing in their own bestselling universes.\nThese witches might be monstrous, or they might be heroes, depending on their own definitions. Even the kind hostess with the candy cottage thought of herself as the hero of her own story. After all, a woman’s gotta eat.\nBring out your dread.","image":"https://media.forbiddenplanet.com/products/90/89/d2e9e01e68c1a925cf103edb5af6f1ca9331.jpg","mainEntityOfPage":"https://forbiddenplanet.com/278725-hex-life-wicked-new-tales-of-witchery-hardcover/","name":"Hex Life: Wicked New Tales Of Witchery (Hardcover)","url":"https://forbiddenplanet.com/278725-hex-life-wicked-new-tales-of-witchery-hardcover/","category":"Books > Fantasy","gtin13":"9781789090345","mpn":"","offers":{"availability":"https://schema.org/InStock","price":14.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789090345","releaseDate":"2019-10-01","reviews":[],"sku":"4610205","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-OrderSigned Inside No. 9: The Scripts: Series 7-9: (Signed Collector's Edition Hardcover) £60.00 RRP£75.00Due for release:7 Mar 2025Crime & Thrillers {"description":"‘The best comedy the UK has ever created’ Guardian ‘One of the most satisfying endings in TV history’ iNews\n‘Endlessly entertaining and richly rewarding’ Daily Telegraph\nInside No. 9 is the twisted, darkly comic, boundary-pushing creation of Steve Pemberton and Reece Shearsmith, universally acclaimed by viewers and critics as a masterpiece of TV comedy.\nTake one last glimpse behind the door marked ‘Number 9’ as the scripts from the final three series are collected here along with new introductions from the show’s creators, giving behind-the-scenes insights into each thrilling episode. \nWhat makes this special:\n\n\nA premium clothbound and foil-embossed slipcase featuring newly commissioned ‘9’ artwork, exclusive to this collector’s edition.\n\n\nThe slipcase contains three books, one for each series of scripts. Each with their own intricate cover design and foil colourway.\n\n\nEach book features an individual endpaper design.\n\n\nSeries 7 book is signed by the show’s two creators, Reece Shearsmith and Steve Pemberton.\n\n","image":"https://media.forbiddenplanet.com/products/33/ba/d3f16563d00f426c13838b7cd98b7bdfdc04.png","mainEntityOfPage":"https://forbiddenplanet.com/451201-inside-no-9-the-scripts-series-7-9-signed-collectors-edition-hardcover/","name":"Inside No. 9: The Scripts: Series 7-9: (Signed Collector's Edition Hardcover)","url":"https://forbiddenplanet.com/451201-inside-no-9-the-scripts-series-7-9-signed-collectors-edition-hardcover/","category":"Books > Crime & Thrillers","gtin13":"9781399739047","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":60.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781399739047","releaseDate":"2025-03-07","reviews":[],"sku":"6865900","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Disappointing Affirmations: 30 Postcards: Send Them, Keep Them, Whatever. It's Your Life, Do What You Want. £8.99 RRP£11.99Humour {"description":"From the wildly popular disappointingaffirmations Instagram account, here are thirty hilariously realistic affirmation postcards for a disappointing world where failure is always an option.\nThe Disappointing Affirmations postcard set offers a funny take on the inspirational language of a culture that insists that everyone try to remain upbeat in the face of a world that&rsquo;s clearly not okay, and gives us permission to not be okay as well.\nKeep or send to someone you love who also thinks toxic positivity can go to hell. SET OF 30 POSTCARDS TO KEEP OR SEND: Easy-to-detach cards make mini affirmational posters to hang at home or work.\nAlso a great way to keep in touch with friends and family-send them an affirmation to let them know you see them and that relentless positivity is bullshit.\nFROM THE POPULAR INSTAGRAM ACCOUNT: Fans of the popular Instagram account disappointingaffirmations will love these officially licensed postcards.\nUNIQUELY DESIGNED: Disappointing Affirmations creator Dave Tarnowski custom-remixed all 30 images and sayings for a uniquely beautiful postcardian or mini print-hanging experience.\nTHERE&rsquo;S MORE: See also the Disappointing Affirmations book and Disappointing Affirmations Pencils set. You won&rsquo;t be disappointed.\nPerfect for:\n\n\nAnyone looking to counter the culture of toxic positivity in a humorous way.\n\n\nFans of the disappointingaffirmations Instagram account.\n\n\nAnyone who isn&rsquo;t always cheerful and doesn&rsquo;t feel seen.\n\n\nFans of satire and sarcastic humour.\n\n","image":"https://media.forbiddenplanet.com/products/21/be/8ea60fb78eaf80c8327ba16b63c6f85c0823.png","mainEntityOfPage":"https://forbiddenplanet.com/414669-disappointing-affirmations-30-postcards-send-them-keep-them-whatever-its-your-life-do-what-you-want/","name":"Disappointing Affirmations: 30 Postcards: Send Them, Keep Them, Whatever. It's Your Life, Do What You Want.","url":"https://forbiddenplanet.com/414669-disappointing-affirmations-30-postcards-send-them-keep-them-whatever-its-your-life-do-what-you-want/","category":"Books > Humour","gtin13":"9781797227573","mpn":"","offers":{"availability":"https://schema.org/InStock","price":8.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781797227573","releaseDate":"2024-04-25","reviews":[],"sku":"6369118","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Rick & Morty: The Official Cookbook (Hardcover) £4.99 was £16.99 RRP£24.99Art & Design {"description":"Create dishes from across the multiverse with Rick and Morty: The Official Cookbook! Featuring cuisine from the planets and dimensions seen in the series, this colourful cookbook offers a wide variety of over 50 recipes inspired by the beloved show.\nFans will delight in recreating the show’s most iconic dishes, such as Szechuan Sauce and Pickled Ricks, along with a host of other appetisers, main courses, desserts, and drinks. Bursting with photography that’s sure to inspire chefs of any skill level, this cookbook is the perfect culinary companion for your travels across space and time.","image":"https://media.forbiddenplanet.com/products/12/67/e06a0a9a1455d444c0d5569da9b27a78d958_eODHl1C.jpg","mainEntityOfPage":"https://forbiddenplanet.com/355195-rick-morty-the-official-cookbook-hardcover/","name":"Rick & Morty: The Official Cookbook (Hardcover)","url":"https://forbiddenplanet.com/355195-rick-morty-the-official-cookbook-hardcover/","category":"Books > Art & Design","gtin13":"9781803361437","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803361437","releaseDate":"2022-11-01","reviews":[],"sku":"5609802","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Rick & Morty: Sometimes Science Is More Art Than Science: The Official Colouring Book £2.99 was £7.99 RRP£12.99Art & Design {"description":"Get strapped in broh! Hop in the Space Cruiser and tag along as we kick up some interdimensional trouble in Rick and Morty: The Official Colouring Book.\nDon’t be a Morty! Listen to me and let your unhinged creativity run wild! That’s right, go ahead and splash your individual mark of creativity all over the pages of this official colouring book.\nIt was made for it! Just look at all the scenes, moments, and characters from seasons four to six waiting for your special touch. It’s like you’re right there riding shotgun as we hop from dimension to dimension on a never-ending series of impossible adventures.\nThe best way to really let yourself be alarmingly carefree with these pages is to buy the book! You know, so it’s yours and no one can complain if you dump glitter, or glue a bunch of feathers to a page, or like, put really thick oily paint all over it!\nYou can do whatever you want, but you have to buy the book! Okay?! Got it?? Now don’t let me down here. I’m trusting you.","image":"https://media.forbiddenplanet.com/products/87/5f/516b920141a5fac252848839cd990db5a325.jpg","mainEntityOfPage":"https://forbiddenplanet.com/378284-rick-morty-sometimes-science-is-more-art-than-science-the-official-colouring-book/","name":"Rick & Morty: Sometimes Science Is More Art Than Science: The Official Colouring Book","url":"https://forbiddenplanet.com/378284-rick-morty-sometimes-science-is-more-art-than-science-the-official-colouring-book/","category":"Books > Art & Design","gtin13":"9781803365985","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803365985","releaseDate":"2023-05-02","reviews":[],"sku":"5906383","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Friends: The Official Central Perk Cookbook £4.99 was £16.19 RRP£22.99Film, TV, & Music {"description":"Gather your friends on your favourite couch and prepare over 50 recipes inspired by the iconic Central Perk café from the beloved hit sitcom Friends. \nFriends: The Official Central Perk Cookbook offers a variety of recipes for chefs of all levels. From appetisers and small bites to drinks and desserts, each chapter includes iconic treats from the show and café. \nThe latest in Insight Editions’ best-selling line of Friends products has more than 50 recipes and beautiful full-colour photography, as well as classic stills and iconic quotes from the show. \nThis will be the year’s best home cooking companion for fans of the show that has always been there for you.","image":"https://media.forbiddenplanet.com/products/61/c4/fe6d1a31a99a81702f48ff82c5704818a20e.jpg","mainEntityOfPage":"https://