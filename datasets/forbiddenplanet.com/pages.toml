full_description = '''88 results in Books ▸ Biography Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSale Roxy Live: Under Exposed (Hardcover) £2.99 was £39.99 RRP£39.99Reviews★★★★★ (1)Art & Design {"description":"A unique photographic record, from a die-hard Roxy Music fan’s perspective, of a now-legendary band whose influence lives on.\n2022 marks the 50th anniversary of Roxy Music’s eponymous debut album. To coincide with this milestone, we are proud to present a one-of-a-kind historical document and celebration of one of the most beloved and enduring bands of our times.\nDocumenting the band from their heyday in 1973 right up to Roxy’s last and final live performance in 2019 – more often than not from the photographer’s pit – and punctuated by rare memorabilia, priceless memories and cheeky anecdotes, Roxy Live is the book Roxy fans have been waiting for.","image":"https://media.forbiddenplanet.com/products/cf/b3/a7063107fb921313a2368bccb8dac9bdcbda.jpg","mainEntityOfPage":"https://forbiddenplanet.com/341128-roxy-live-under-exposed-hardcover/","name":"Roxy Live: Under Exposed (Hardcover)","url":"https://forbiddenplanet.com/341128-roxy-live-under-exposed-hardcover/","aggregateRating":{"ratingCount":1,"reviewCount":1,"ratingValue":5.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Books > Art & Design","gtin13":"9781789099508","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789099508","releaseDate":"2022-08-16","reviews":[{"name":"The Definitive Pictorial History Of An Iconic Band","reviewBody":"Well, where to begin? Not so much in reviewing this magnificent tome, as wading through it! I guess page 1 would be a start, but even before you get there, the attention to detail impresses with the comprehensive list of live dates on the inner cover.\n\nThis is, by a Country Life mile, the finest book ever produced on a beloved band and it's going to be hours of pure joy navigating its pages. Well done and thank you Jocelyn. This is a triumph and the finest of tributes in this 50th anniversary year.\n\nTruly, no fan will be complete without a copy.\n\nPS: Top marks to Forbidden Planet on their despatch and delivery. This was very securely packaged to begin with but then placed within a humongous box (see the carbon footprint!) meaning it couldn't possibly arrive in anything less than pristine condition.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-08-23T13:54:07.606984+01:00","datePublished":"2023-01-11T10:58:32.564502Z","author":"Richard S","itemReviewed":{"url":"https://forbiddenplanet.com/341128-roxy-live-under-exposed-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"5116676","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Beyond The Throne (Signed Edition Hardcover) £22.00 RRP£25.00Biography {"description":"Beyond the Throne is the first memoir to share behind‑the‑scenes stories of the perils and triumphs of Game of Thrones from beloved performer Kristian Nairn, who played Hodor and became one of the most recognizable figures of the global television phenomenon.\nThe story of an unlikely hero who fulfilled his destiny…\nFans will be fascinated by Kristian Nairn’s experience on Game of Thrones, from his unlikely audition to his on-the-job training as an actor to his ascendance as one of the most beloved and pivotal characters on the show. Nairn details the camaraderie that develops as the actors face the elements on set, not entirely unlike the ones their characters must endure on screen, as well as the life-altering effects of worldwide stardom.\nNairn’s personal story-raised by a single mother during the Troubles in Ireland, coming of age as a gay man in Lisburn and Belfast, navigating intolerance, and seeking out his scene-is an epic, often rollicking, sometimes heart-breaking journey.\nNairn finds his voice and his confidence performing as a drag queen called Revvlon and eventually DJing at the legendary nightclub Kremlin. Through the pitfalls and revelations of his creative pursuits, Nairn comes to understand who he really is and that he is enough-a message that will resonate for anyone who has struggled to find their place.","image":"https://media.forbiddenplanet.com/products/77/1c/e7684d6caccf08e4e4807ef63496f8f73896.jpg","mainEntityOfPage":"https://forbiddenplanet.com/429827-beyond-the-throne-signed-edition-hardcover/","name":"Beyond The Throne (Signed Edition Hardcover)","url":"https://forbiddenplanet.com/429827-beyond-the-throne-signed-edition-hardcover/","category":"Books > Biography","gtin13":"9781408731369","mpn":"","offers":{"availability":"https://schema.org/InStock","price":22.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781408731369","releaseDate":"2024-10-08","reviews":[],"sku":"5123490","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Run N' Gun: A History Of On-Foot Shooters (Hardcover) £24.99 was £29.99 RRP£34.99Action & Adventure {"description":"Enter a world of nostalgic bullet hell with Run ‘n’ Gun: A History of On-Foot Shooters, written by award-winning video game journalist and comic book author Dave Cook. Hot on the heels of Cook’s previous Bitmap Books release, Go Straight: The Ultimate Guide to Side-Scrolling Beat Em Ups, this new project charts 40 years of run ’n’ gun history across over 496 gorgeous pages.\nOpening with guest forewords by Mega Man’s legendary producer, Keiji Inafune and Cuphead creators Chad and Jared Moldenhauer, our explosive journey begins with 1975’s Gun Fight and the birth of the run ’n’ gun genre, before marching onward throughout the decades. With over 300 games featured, you’ll uncover incredible behind-the-scenes stories, interesting quotes, mind-blowing trivia, expert gameplay tips and beautiful high-quality screenshots.\nAll the classics are here, including Contra, Gunstar Heroes, Metal Slug, Mega Man, Sunset Riders, Midnight Resistance and Turrican, as well as some hidden gems you might not have tried before, such as Demon Front, Nitro Ball and Rapid Reload. As the years march on, you’ll become better acquainted with modern shooters, such as Cuphead, Blazing Chrome, Huntdown and Gunvolt.\nFeaturing guest contributions from Chris Scullion, Kurt Kalata, Sega Lord X and Graeme Mason, Run ‘n’ Gun: A History of On-Foot Shooters is an action-packed celebration of the genre. Whether you’re new to shooters or loading up your Spread Gun for the first time, this is the perfect reference guide.\nRun ’n’ Gun: A History of On-Foot Shooters is printed lithographically to the highest standards. This ensures that the colours in the book are really vibrant and that the pages have a high-quality, luxurious feel to them. As standard, each book is offered in hardback with a spot-varnished fascia featuring artwork by artist Jorge M. Velez.","image":"https://media.forbiddenplanet.com/products/3f/cf/38f680e09ef017e459f5147bb31436dd65a4.jpg","mainEntityOfPage":"https://forbiddenplanet.com/439417-run-n-gun-a-history-of-on-foot-shooters-hardcover/","name":"Run N' Gun: A History Of On-Foot Shooters (Hardcover)","url":"https://forbiddenplanet.com/439417-run-n-gun-a-history-of-on-foot-shooters-hardcover/","category":"Books > Action & Adventure","gtin13":"9781838458546","mpn":"","offers":{"availability":"https://schema.org/InStock","price":24.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781838458546","releaseDate":"2024-09-23","reviews":[],"sku":"6677954","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book HR Giger: 40th Edition (Hardcover) £18.00 RRP£18.99Art & Design {"description":"“At its essence, Giger’s art digs down into our psyches and touches our very deepest primal instincts and fears. His art stands in a category of its own. The proof of this lies in the intensity of his work and imagination, which I can only compare to Hieronymus Bosch and Francis Bacon in their powers to provoke and disturb.” ―Ridley Scott\nSwiss artist HR Giger (1940–2014) is most famous for his creation of the space monster in Ridley Scott’s 1979 horror sci-fi film Alien, which earned him an Oscar. Yet this was just one of the most popular expressions of Giger’s biomechanical arsenal of creatures, which consistently merged hybrids of human and machine into images of haunting power and dark psychedelia.\nThe visions drew on demons of the past, as well as evoking mythologies for the future. Above all, they gave expression to the collective fears and fantasies of his age: fear of the atom, of pollution and wasted resources, and of a future in which our bodies depend on machines for survival.\nFollowing the SUMO-sized monograph which was begun shortly before the artist’s unexpected death, this affordable anniversay edition pays homage to Giger’s unique vision. The book shows the complete story of Giger’s life and art, his sculptures, film design, and iconic album covers as well as the heritage he left us in his own artist’s museum and self-designed bar in the Swiss Alps. In an in-depth essay, Giger scholar Andreas J. Hirsch plunges into the themes of the artist’s oeuvre while an extensive biography draws on contemporary quotes and Giger’s own statements.\nAbout the series\nTASCHEN is 40! Since we started our work as cultural archaeologists in 1980, TASCHEN has become synonymous with accessible publishing, helping bookworms around the world curate their own library of art, anthropology, and aphrodisia at an unbeatable price. Today we celebrate 40 years of incredible books by staying true to our company credo.\nThe 40 series presents new editions of some of the stars of our program―now more compact, friendly in price, and still realized with the same commitment to impeccable production.","image":"https://media.forbiddenplanet.com/products/4c/82/7f50a2e33e6f1d997605693843b20fdf1c42.jpg","mainEntityOfPage":"https://forbiddenplanet.com/349165-hr-giger-40th-edition-hardcover/","name":"HR Giger: 40th Edition (Hardcover)","url":"https://forbiddenplanet.com/349165-hr-giger-40th-edition-hardcover/","category":"Books > Art & Design","gtin13":"9783836587020","mpn":"","offers":{"availability":"https://schema.org/InStock","price":18.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9783836587020","releaseDate":"2021-12-13","reviews":[],"sku":"5458561","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Of Dice & Men: The Story Of Dungeons & Dragons & The People Who Play It £7.99 RRP£10.99Biography {"description":"Updated with new chapters and an introduction for the 50th Anniversary of Dungeons &amp; Dragons, the fascinating and authoritative history of Dungeons &amp; Dragons that “tracks D&amp;D’s turbulent rise, fall, and survival, from its heyday in the 1980s… to the 21st century” (The Wall Street Journal), by award-winning journalist David M. Ewalt. \nEven if you’ve never played Dungeons &amp; Dragons, you probably know someone who has: the game has had a profound influence on our culture, and 2014 marks the intriguing role-playing phenomenon’s 40th anniversary. \nReleased decades before the Internet and social media, Dungeons &amp; Dragons inspired one of the original nerd subcultures and is still revered by more than 30 million fans. Now, the authoritative history and magic of the game are revealed by an award-winning journalist and lifelong D&amp;D player. \nIn Of Dice and Men, David Ewalt describes the development of Dungeons &amp; Dragons from the game’s origins on the battlefields of ancient Europe through the hysteria that linked it to satanic rituals and teen suicides to its apotheosis as father of the modern video-game industry.\nAs he chronicles the surprising history of the game’s origins (a history largely unknown even to hardcore players) and examines D&amp;D’s lasting impact, Ewalt weaves laser-sharp subculture analysis with his own present-day gaming experiences, “writing about the world of fantasy role-playing junkies with intelligence, dexterity, and even wisdom” (Ken Jennings). \nAn enticing blend of history, journalism, narrative, and memoir, Of Dice and Men sheds light on America’s most popular form of collaborative entertainment.","image":"https://media.forbiddenplanet.com/products/4a/d3/f7dcedc3573485f4149226472bbfe1348d28.jpg","mainEntityOfPage":"https://forbiddenplanet.com/413729-of-dice-men-the-story-of-dungeons-dragons-the-people-who-play-it/","name":"Of Dice & Men: The Story Of Dungeons & Dragons & The People Who Play It","url":"https://forbiddenplanet.com/413729-of-dice-men-the-story-of-dungeons-dragons-the-people-who-play-it/","category":"Books > Biography","gtin13":"9781668050101","mpn":"","offers":{"availability":"https://schema.org/InStock","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781668050101","releaseDate":"2024-04-22","reviews":[],"sku":"6339524","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Escape From St Hell: My Trans Life Levels Up (Signed Edition) £8.99 RRP£12.99Biography {"description":"MAN-MODE: ACTIVATED\nEscape from St Hell is the life-affirming sequel to the Eisner Award-nominated graphic memoir, Welcome to St Hell, by author, illustrator and filmmaker, Lewis Hancox.\nWe re-join Lewis on his transition journey as he leaves his small Northern hometown for university and starts picking his way through life as an adult, beset with hilarious awkwardness, plaid shirts and a second puberty.\nWith the guidance and wisdom from his future self, Lewis navigates what it takes to become the man he wants to be, from his first chin hair to his first bromance. This funny and honest personal story shows what it truly means to find self-acceptance (and the perfect meltdown soundtrack).","image":"https://media.forbiddenplanet.com/products/85/bd/d06d5663476713942f883f04ebc0026de6db.jpg","mainEntityOfPage":"https://forbiddenplanet.com/442740-escape-from-st-hell-my-'''
