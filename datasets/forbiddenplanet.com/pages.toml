a himself!\nEver since Goku became Earth’s greatest hero and gathered the seven Dragon Balls to defeat the evil Boo, his life on Earth has grown a little dull.\nBut new threats loom overhead, and Goku and his friends will have to defend the planet once again in this continuation of Akira Toriyama’s best-selling series, Dragon Ball!","image":"https://media.forbiddenplanet.com/products/37/7b/bbc5a5bd77efc3bcfba4aea4a9e2cec1c1d4.jpg","mainEntityOfPage":"https://forbiddenplanet.com/324337-dragon-ball-super-volume-15/","name":"Dragon Ball Super: Volume 15","url":"https://forbiddenplanet.com/324337-dragon-ball-super-volume-15/","category":"Manga","gtin13":"9781974725175","mpn":"","offers":{"availability":"https://schema.org/InStock","price":6.38,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781974725175","releaseDate":"2022-01-26","reviews":[],"sku":"5207794","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MangaPre-Order Dandadan: Volume 11 £6.38 RRP£8.99Due for release:27 Mar 2025Manga {"description":"A nerd must fight powerful spirits and aliens all vying for the secret power of his “family jewel,” so who better to fight alongside him than his high school crush and a spirit granny?!\nMomo Ayase and Okarun are on opposite sides of the paranormal spectrum regarding what they’ll believe in and what they won’t. Their quest to prove each other wrong leads them down a path of secret crushes and paranormal battles they’ll have to participate in to believe!\nMomo struggles to counter a sudden attack by alien clones, but through a temporary truce with her sworn enemy, the alien Serpo, she is able to persevere. However, her troubles are far from over—it’s now after 10 p.m.! \nIn order to avoid the slit-faced woman Reiko Kashima, who is still very much on the hunt for her, Momo and Serpo must hide out overnight in a manga cafe. And when Momo finally returns home in the morning, she finds her friends are gravely injured and being treated by none other than Mr. Shrimp!","image":"https://media.forbiddenplanet.com/products/88/00/222a055acf9f3d58ff1f376ae1384a6b6cee.jpg","mainEntityOfPage":"https://forbiddenplanet.com/430857-dandadan-volume-11/","name":"Dandadan: Volume 11","url":"https://forbiddenplanet.com/430857-dandadan-volume-11/","category":"Manga","gtin13":"9781974751808","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":6.38,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781974751808","releaseDate":"2025-03-27","reviews":[],"sku":"6576790","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Manga Jujutsu Kaisen: Volume 24 £6.38 RRP£8.99Manga {"description":"To gain the power he needs to save his friend from a cursed spirit, Yuji Itadori swallows a piece of a demon, only to find himself caught in the midst of a horrific war of the supernatural!\nIn a world where cursed spirits feed on unsuspecting humans, fragments of the legendary and feared demon Ryomen Sukuna have been lost and scattered about. Should any demon consume Sukuna’s body parts, the power they gain could destroy the world as we know it. Fortunately, there exists a mysterious school of jujutsu sorcerers who exist to protect the precarious existence of the living from the supernatural!\nMilitary forces from foreign countries invade the culling game, seeking to harness the unlimited potential of cursed energy. However, the soldiers soon find themselves facing off against a horde of cursed spirits! While the merger with Tengen forges on, Fushiguro tries to help his sister leave the culling game and its endless cycle of killing…","image":"https://media.forbiddenplanet.com/products/41/c8/ce8f85f7735eb42248a0c483aceafd4d7a8c.jpg","mainEntityOfPage":"https://forbiddenplanet.com/418735-jujutsu-kaisen-volume-24/","name":"Jujutsu Kaisen: Volume 24","url":"https://forbiddenplanet.com/418735-jujutsu-kaisen-volume-24/","category":"Manga","gtin13":"9781974749485","mpn":"","offers":{"availability":"https://schema.org/InStock","price":6.38,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781974749485","releaseDate":"2025-01-16","reviews":[],"sku":"6421762","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MangaPre-Order Kaiju No. 8: Volume 12 £6.38 RRP£8.99Due for release:27 Mar 2025Manga {"description":"Kafka wants to clean up kaiju, but not literally! Will a sudden metamorphosis stand in the way of his dream?\nWith the highest kaiju-emergence rates in the world, Japan is no stranger to attack by deadly monsters. Enter the Japan Defense Force, a military organisation tasked with the neutralization of kaiju. \nKafka Hibino, a kaiju-corpse cleanup man, has always dreamed of joining the force. But when he gets another shot at achieving his childhood dream, he undergoes an unexpected transformation. How can he fight kaiju now that he’s become one himself?!\nThe Eastern Division has been attacked by identified-class kaiju. Narumi and Kikoru have taken care of their targets, but Hoshina is still facing off against No. 11, the finished project that No. 10 served as the prototype for. \nEven worse, Numbers Weapon 10 won’t output more than 83 percent unleashed combat power, making this battle even more of a struggle for Hoshina.","image":"https://media.forbiddenplanet.com/products/5a/b8/bc744d632180f909e4f8e3ce27c96200b2f2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/430851-kaiju-no-8-volume-12/","name":"Kaiju No. 8: Volume 12","url":"https://forbiddenplanet.com/430851-kaiju-no-8-volume-12/","category":"Manga","gtin13":"9781974752720","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":6.38,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781974752720","releaseDate":"2025-03-27","reviews":[],"sku":"6577421","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MangaPre-Order Kinnporsche: Volume 3 (Light Novel) £12.77 RRP£17.99Due for release:22 Apr 2025Manga {"description":"The Thai Boys’ Love novel that inspired the hit live-action drama KinnPorsche: The Series!\nIn this action-packed romance, a hot-tempered college student is sucked into the criminal underworld after a chance encounter with the heir to a crime family.\nEver since the tragic death of his parents, Porsche’s life has been a balancing act between attending college and bartending to support his younger brother and pay off his deadbeat uncle’s gambling debt. When he witnesses a gang of thugs attacking a handsome young man in the alley behind his bar, he’s reluctant to intervene until he’s offered fifty thousand baht to help the stranger escape.\nThe stranger is known as Kinn, the second son of a notorious crime family. Impressed with Porsche’s fighting skills, Kinn makes a proposition: if Porsche agrees to become his personal bodyguard, his debts will be absolved. Porsche doesn’t want any trouble, especially not the kind of trouble Kinn deals in. But Kinn always gets what he wants.","image":"/static/catalog/default_product_image.a09eebf731fb.svg","mainEntityOfPage":"https://forbiddenplanet.com/433868-kinnporsche-volume-3-light-novel/","name":"Kinnporsche: Volume 3 (Light Novel)","url":"https://forbiddenplanet.com/433868-kinnporsche-volume-3-light-novel/","category":"Manga","gtin13":"9798891600799","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":12.77,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9798891600799","releaseDate":"2025-04-22","reviews":[],"sku":"6619534","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Manga One Piece: Volume 107 £6.38 RRP£8.99Manga {"description":"Join Monkey D. Luffy and his swashbuckling crew in their search for the ultimate treasure, One Piece!\nAs a child, Monkey D. Luffy dreamed of becoming King of the Pirates. But his life changed when he accidentally gained the power to stretch like rubber…at the cost of never being able to swim again! Years later, Luffy sets off in search of the One Piece, said to be the greatest treasure in the world…\nHaving learned too much of the world’s history, Dr. Vegapunk is now the target of the CP0 assassins. Vegapunk’s only hope may be to ask for help from Luffy and the Straw Hat crew, but where are they? Chaos erupts on Egghead Island as the world government sends some powerful reinforcements.","image":"https://media.forbiddenplanet.com/products/08/f9/da185648f67cf9cf16165438e75d15eb9a57.jpg","mainEntityOfPage":"https://forbiddenplanet.com/418710-one-piece-volume-107/","name":"One Piece: Volume 107","url":"https://forbiddenplanet.com/418710-one-piece-volume-107/","category":"Manga","gtin13":"9781974749799","mpn":"","offers":{"availability":"https://schema.org/InStock","price":6.38,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781974749799","releaseDate":"2024-12-19","reviews":[],"sku":"6421816","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MangaPre-Order My Hero Academia: Volume 40 £6.38 RRP£8.99Due for release:27 Mar 2025Manga {"description":"Midoriya inherits the superpower of the world’s greatest hero, but greatness won’t come easy.\nWhat would the world be like if 80 percent of the population manifested superpowers called “Quirks”? Heroes and villains would be battling it out everywhere! Being a hero would mean learning to use your power,