ersation starter and a charming companion during tea sessions with the missus.\nIn Jim Henson’s Labyrinth, The Worm captivates audiences as a quirky and endearing character. Our Mini Worm Plush not only captures its physical details faithfully but also brings the charm of the movie into your hands.\nWhether you’re a seasoned Labyrinth enthusiast or new to the magic, this Toy Vault exclusive is a delightful addition to your collection. Embrace the nostalgia, relive the enchantment, and embark on imaginative journeys with this whimsical Mini Worm Plush.","image":"https://media.forbiddenplanet.com/products/9e/97/32d8f18ea2467577ddb6eda033fe3fba4d01.png","mainEntityOfPage":"https://forbiddenplanet.com/445667-labyrinth-mini-plush-the-worm/","name":"Labyrinth: Mini Plush: The Worm","url":"https://forbiddenplanet.com/445667-labyrinth-mini-plush-the-worm/","category":"Toys & Collectibles > Soft Toys, Dolls, & Plush","gtin12":"651174700113","mpn":"70011","offers":{"availability":"https://schema.org/InStock","price":19.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:651174700113","releaseDate":"2024-11-30","reviews":[],"sku":"6695064","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Soft Toy Labyrinth: Plush: Ludo £17.99 RRP£19.99Soft Toys, Dolls, & Plush {"description":"Ludo, though menacing in appearance, quickly becomes one of the most lovable characters in Jim Henson’s The Labyrinth. Ludo is a large but gentle creature who has the ability to summon the rocks to help him, and Toy Vault’s shrink ray reduced him to the perfect plush size, measuring 9-inches tall.","image":"https://media.forbiddenplanet.com/products/e2/4e/4b1e9595a6aa9b9ee06f46716a49f436cd7d.png","mainEntityOfPage":"https://forbiddenplanet.com/264132-labyrinth-plush-ludo/","name":"Labyrinth: Plush: Ludo","url":"https://forbiddenplanet.com/264132-labyrinth-plush-ludo/"