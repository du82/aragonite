temCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:423629","releaseDate":"2024-07-01","reviews":[{"name":"14th Doctor Sonic Screwdriver - Forbidden Planet Exclusive","reviewBody":"I have just bought the 14th Doctor Screwdriver in matt gold that comes with the extra colours and sounds that the Online Exclusive had. The one I got looks great and slides perfectly not like the retail version that was a bit loose, this one you have to slide it forward with little force. But i was happy to find the extra button when you take off the cap to get at the battery compartment. I was able to try out the extra settings, it will take some practice to get them all to work, but I am very happy with what I purchased. I highly recommend this sonic screwdriver, don't be put of by the fact it is in matt gold. I'm just happy to have it with the extra features full stop.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-07-16T13:31:56.209956+01:00","datePublished":"2024-12-11T12:39:00.681906Z","author":"Andrew 52","itemReviewed":{"url":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Disappointing","reviewBody":"The \"cracked stone\" section is a sticker and not moulded like previous screwdrivers. its quite rattly and feels cheap. there is an exposed screw on the bottom. The sounds are good with multiple options when you press the button more than once, but overall not what I expected from an \"exclusive\" product.","reviewRating":{"ratingValue":2,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-07-05T18:54:06.128593+01:00","datePublished":"2024-12-31T09:57:46.976012Z","author":"Alex","itemReviewed":{"url":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"6393052","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Action Figure Doctor Who: Action Figure: The Fifteenth Doctor £16.19 RRP£17.99Action Figures {"description":"Get ready to embark on thrilling new adventures with the 15th Doctor Action Figure from Character Options! \nThis exquisitely crafted figure stands at an impressive height, meticulously modeled after the 15th Doctor as seen in the iconic “Doctor Who” series. \nFeaturing detailed facial expressions, a stylish costume, and multiple points of articulation, this action figure allows for dynamic posing and imaginative play. Included are signature accessories like the Sonic Screwdriver, making it perfect for recreating your favourite scenes or inventing new stories. \nWhether you’re a collector or a fan of the series, this 15th Doctor Action Figure is an essential addition to any “Doctor Who” collection. Dive into the action and let the timeless adventures begin!","image":"https://media.forbiddenplanet.com/products/a5/de/003c2013bb72ee1c156eb4a52a5c59cfbb02.png","mainEntityOfPage":"https://forbiddenplanet.com/440696-doctor-who-action-figure-the-fifteenth-doctor/","name":"Doctor Who: Action Figure: The Fifteenth Doctor","url":"https://forbiddenplanet.com/440696-doctor-who-action-figure-the-fifteenth-doctor/","category":"Toys & Collectibles > Action Figures","mpn":"08191","offers":{"availability":"https://schema.org/InStock","price":16.19,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:440696","releaseDate":"2024-11-01","reviews":[],"sku":"6417338","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Soft ToyPre-Order Wallace & Gromit: Plush: Feathers Mcgraw £14.99 RRP£16.99Due for release:18 Apr 2025Soft Toys, Dolls, & Plush {"description":"Wallace and Gromit has been a family favourite for over 30 years, since appearing in their first adventure, A Close Shave. This is a gorgeous super soft Feathers McGraw Penguin soft toy.\nThe new lodger at 62 West Wallaby Street has Gromit on guard from day one. Not only does he steal Gromit’s room, but Feathers quickly makes himself indispensable to Wallace, When Gromit spots a Wanted poster, the ‘chicken’ in the mug shot looks strangely familiar. It’s not long before this cool operator is exposed as a criminal mastermind, with a plan to rob the local museum of precious diamonds. \nFeathers McGraw Soft Toy is part of our Eco-Friendly initiative and comes with inner fibre fill and beans made from recycled plastic materials.\nOur hangtags are recyclable with our cloth labels being made from recycled materials. Aurora World is an industry leader with over 40 years of experience in designing and manufacturing innovative and high quality plush products.\nHandwash Only, Suitable Age 0+","image":"https://media.forbiddenplanet.com/products/6a/bf/7400d0544d11345c731d765feaf187474f6e.png","mainEntityOfPage":"https://forbiddenplanet.com/384830-wallace-gromit-plush-feathers-mcgraw/","name":"Wallace & Gromit: Plush: Feathers Mcgraw","url":"https://forbiddenplanet.com/384830-wallace-gromit-plush-feathers-mcgraw/","category":"Toys & Collectibles > Soft Toys, Dolls, & Plush","gtin13":"5034566615144","mpn":"61514","offers":{"availability":"https://schema.org/PreOrder","price":14.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5034566615144","releaseDate":"2025-04-18","reviews":[],"sku":"5998050","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Vinyl Art ToySaleBlind Boxed Star Trek: The Original Series: TITANS: Where No Man Has Gone Before Collection £2.99 was £7.99 RRP£7.99Vinyl {"description":"In an alliance more significant than the Federation and the Klingons, than Voyager and the Maquis - even more than Will Riker and his legendary facial hair - Titan Entertainment is excited to announce the first instalment in Titan’s ongoing mission to produce the finest collectible Star Trek vinyl figures:\nStar Trek TITANS - The “Where No Man Has Gone Before” Collection!\nUnder license by CBS Consumer Products, the collection features characters from the first season of the groundbreaking science-fiction phenomenon led by the unforgettable trio of Captain James T Kirk, Mister Spock and Doctor Leonard ‘Bones’ McCoy!\nAll of the iconic bridge crew from Season One of Star Trek: The Original SeriesTM are represented in this debut blind-boxed TITANS wave (Uhura, Sulu, Scotty, Nurse Chapel and Yeoman Rand) - alongside classic Season One nemeses such as the mysterious Balok, the manipulative Talosian Keeper, the terrifying Gorn and the legendary Khan Noonien Singh.\nEach figure is 3” blind-boxed and certain pieces come with a character-specific accessory.\nPLUS: 2 hidden chase figures for you to hunt and collect!","image":"https://media.forbiddenplanet.com/products/1d/a5/a6b1da45ce3ac5a55f9e24e859495c7e0531.png","mainEntityOfPage":"https://forbiddenplanet.com/176851-star-trek-the-original-series-titans-where-no-man-has-gone-before-collection/","name":"Star Trek: The Original Series: TITANS: Where No Man Has Gone Before Collection","url":"https://forbiddenplanet.com/176851-star-trek-the-original-series-titans-where-no-man-has-gone-before-collection/","brand":"TITANS","category":"Toys & Collectibles > Vinyl","gtin13":"5052473118466","height":"7.6cm (3in)","mpn":"STV-MINI-001","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5052473118466","releaseDate":"2016-10-30","reviews":[],"sku":"3575185","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Model KitSaleBlind Boxed Gundam: SH: Model Kit: FW Gundam Converge: Volume 25 (1 Pcs) £5.99 was £7.49 RRP£7.49Kits & Construction {"description":"25th volume of FW Gundam Converge #25 series. A collection of uniquely stylised static figures featuring popular mobile suit.\nApproximately 2” tall. This volume features newly introduced Gundams MS-C and MS-D from the upcoming movie, “Mobile Suit Gundam Seed Freedom.”\nAlso included in the line up is the highly popular:\nWing Gudam\nJagd Doga (Quess Parya-Type, Gyunei-Type)\nBall twin set\nPlease note: 1 randomly selected figure provided per purchase. Design can’t be specified, you may receive duplicates.","image":"https://media.forbiddenplanet.com/products/b4/ac/b328cd32163c1a2704a3cd91b528d4297bfb.png","mainEntityOfPage":"https://forbiddenplanet.com/431667-gundam-sh-model-kit-fw-gundam-converge-volume-25-1-pcs/","name":"Gundam: SH: Model Kit: FW Gundam Converge: Volume 25 (1 Pcs)","url":"https://forbiddenplanet.com/431667-gundam-sh-model-kit-fw-gundam-converge-volume-25-1-pcs/","category":"Toys & Collectibles > Kits & Construction","gtin13":"4549660958178","mpn":"CT2671902","offers":{"availability":"https://schema.org/InStock","price":5.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:4549660958178","releaseDate":"2024-01-08","reviews":[],"sku":"6394172","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Statues & BustBlind Boxed Skullpanda: Mini Figure: The Sound Series (1 Pcs) £13.50Statues & Busts {"description":"These Skullpanda mini figures are randomly supplied. Every series has the hidden edition. The chance to get a hidden edition is around 1 in 144, so if you get it, you are very lucky! They are so rare!\nEach kawaii figure height is between 2.36 and 3.94 inches (6cm to 10cm). \nOne randomly selected blind-boxed figure supplied per purchase.","image":"https://media.forbiddenplanet.com/products/6c/ca/e2eb26c09cbc7e16b5a1a07d173e9c80b76e.png","mainEntityOfPage":"https://forbiddenplanet.com/437188-skullpanda-mini-figure-the-sound-series-1-pcs/","name":"Skullpanda: Mini Figure: The Sound Series (1 Pcs)","url":"https://forbiddenplanet.com/437188-skullpanda-mini-figure-the-sound-series-1-pcs/","category":"Toys & Collectibles > Statues & Busts","gtin13":"6941848290694","mpn":"1240325062","offers":{"availability":"https://schema.org/InStock","price":13.5,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:6941848290694","releaseDate":"2024-10-12","reviews":[],"sku":"6669805","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Vehicles & PlaysetSale DC Multiverse: The Dark Knight: Gold Label Series Action Figure & Vehicle: Lucius Fox & The Tumbler £59.99 was £109.99 RRP£109.99Action Figures {"description":"With the help of Lieutenant Jim Gordon™ and District Attorney Harvey Dent™, Batman™ sets out to destroy organised crime in Gotham City™ for good.\nThe triumvirate proves to be effective, but they soon find themselves prey to a rising criminal mastermind known as The Joker™, who thrusts Gotham City into anarchy and forces The Dark Knight™ ever closer to crossing the fine line between hero and vigilante.\nTHE TUMBLER™ and LUCIUS FOX™ are based on their appearances in the theatrical smash hit THE DARK KNIGHT™. \nLUCIUS FOX™ is designed with Ultra Articulation with up to 22 moving parts for full range of posing and play. \nTumbler is made to fit two 7” scale figures.\nTumbler opens for cockpit access.\nIncludes 2 extra hands, remote, utility case, display base and collectible art card. \nCollect all McFARLANE TOYS™ DC MULTIVERSE™ figures.","image":"https://media.forbiddenplanet.com/products/94/4a/d8c627d385d1e439575cd48cb3d72499d19d.png","mainEntityOfPage":"https://forbiddenplanet.com/426792-dc-multiverse-the-dark-knight-gold-label-series-action-figure-vehicle-lucius-fox-the-tumbler/","name":"DC Multiverse: The Dark Knight: Gold Label Series Action Figure & Vehicle: Lucius Fox & The Tumbler","url":"https://forbiddenplanet.com/426792-dc-multiverse-the-dark-knight-gold-label-series-action-figure-vehicle-lucius-fox-the-tumbler/","brand":"DC Multiverse","category":"Toys & Collectibles > Action Figures","gtin12":"787926151930","mpn":"TM15193","offers":{"availability":"https://schema.org/InStock","price":59.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:787926151930","releaseDate":"2024-07-24","reviews":[],"sku":"6392048","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Props & Replica Star Wars: Black Series Electro'''
