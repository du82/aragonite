description = "Wherever men live, be they nomads or city dwellers, there they must have law and a man to enforce it. Meet Detective John Law of Crossroads City. Strong, decent, hardworking and hard-nosed. He’s a man who believes in the law and order. He’s the last of a dying breed. In 1948, Will Eisner produced the first issue of “John Law Detective”, which he..."
full_description = "The Collected Will Eisner's John Law (Hardcover)Pre-OrderAuthor: Gary Chaloner Artist: Will Eisner Published by: Titan Comics £17.24 RRP£24.99Add to BasketThis item is available to pre-order.Due for release: 5 Mar 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionWherever men live, be they nomads or city dwellers, there they must have law and a man to enforce it. Meet Detective John Law of Crossroads City. Strong, decent, hardworking and hard-nosed. He’s a man who believes in the law and order. He’s the last of a dying breed.In 1948, Will Eisner produced the first issue of “John Law Detective”, which he intended to add to a line of self-published comics. However, after Eisner’s “Baseball Comics”, “Kewpies”, and “Pirate Comics” failed to find an audience, John Law never made it to the newsstand and was quietly dropped, with much of the original artwork reworked in 1950 for his most famous creation, The Spirit.Featuring original stories by Will Eisner, Gary Chaloner’s award-winning reboot from 2004, including a previously unpublished John Law Story, and a foreword by long-time Eisner publisher Denis Kitchen, this is a must-have for not just Eisner fans but comic collectors of all ages.Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreArtist Will EisnerAuthor Gary ChalonerGenreCrime & ThrillersPublisherTitan ComicsTypeGraphic NovelWednesday ComicsWednesday Comics 05/03/2025BindingHardbackCat. No.6468729ISBN9781787745353"
