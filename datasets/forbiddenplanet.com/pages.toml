full_description = '''682 results in Books ▸ Crime & Thrillers Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSale Mike Hammer: Lady, Go Die! (Hardcover) £1.99 was £13.99 RRP£17.99Crime & Thrillers {"description":"This is the lost 1940s “Mike Hammer” novel, written between “I, the Jury” and “My Gun Is Quick”. \nHammer and Velda go on vacation to a Long Island beach town. Hammer becomes embroiled in the mystery of a missing well-known New York party girl who lives nearby. \nWhen the woman turns up naked - and dead - astride the statue of a horse in the town square, Hammer feels compelled to investigate.","image":"https://media.forbiddenplanet.com/products/2555300.jpg","mainEntityOfPage":"https://forbiddenplanet.com/82872-mike-hammer-lady-go-die-hardcover/","name":"Mike Hammer: Lady, Go Die! (Hardcover)","url":"https://forbiddenplanet.com/82872-mike-hammer-lady-go-die-hardcover/","category":"Books > Crime & Thrillers","gtin13":"9780857684653","mpn":"","offers":{"availability":"https://schema.org/InStock","price":1.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780857684653","releaseDate":"2012-05-25","reviews":[],"sku":"2555300","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Senseless (Signed Edition Hardcover) £15.99 RRP£19.99Crime & Thrillers {"description":"What do you see…?\nWhen the mutilated body of a young woman is discovered in the desert on the outskirts of Los Angeles, the detective assigned to the case can’t deny the similarities between this murder and one that occurred a year prior.\nMedia outlets are quick to surmise this is the work of a budding serial killer, but Detective Bill Renney is struggling with an altogether different scenario: a secret that keeps him tethered to the husband of the first victim.\nWhat do you hear…?\nMaureen Park, newly engaged to Hollywood producer Greg Dawson, finds her engagement party crashed by the arrival of Landon, Greg’s son. A darkly unsettling young man, Landon invades Maureen’s new existence, and the longer he stays, the more convinced she becomes that he may have something to do with the recent murder in the high desert.\nWhat do you feel…?\nToby Kampen, the self-proclaimed Human Fly, begins an obsession over a woman who is unlike anyone he has ever met. A woman with rattlesnake teeth and a penchant for biting. A woman who has trapped him her spell. A woman who may or may not be completely human. \nIn Ronald Malfi’s brand-new thriller, these three storylines converge to create a tapestry of deceit, distrust, and unapologetic horror.&nbsp; A brand-new novel of dark suspense set in the City of Angels, as only “horror’s Faulkner” can tell it.","image":"https://media.forbiddenplanet.com/products/54/17/fd6a91e4ba8f3c355cfba78e3f79275f57e8.jpg","mainEntityOfPage":"https://forbiddenplanet.com/451434-senseless-signed-edition-hardcover/","name":"Senseless (Signed Edition Hardcover)","url":"https://forbiddenplanet.com/451434-senseless-signed-edition-hardcover/","category":"Books > Crime & Thrillers","gtin13":"9781835414590","mpn":"","offers":{"availability":"https://schema.org/InStock","price":15.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835414590","releaseDate":"2025-02-17","reviews":[],"sku":"6870539","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book If We Were Villains (Hardcover Illustrated Edition) £11.99 RRP£18.99Crime & Thrillers {"description":"Oliver Marks has just served ten years for the murder of one of his closest friends – a murder he may or may not have committed. On the day he’s released, he’s greeted by the detective who put him in prison. Detective Colborne is retiring, but before he does, he wants to know what really happened ten years ago.\nAs a young actor studying Shakespeare at an elite arts conservatory, Oliver noticed that his talented classmates seem to play the same roles onstage and off – villain, hero, tyrant, temptress – though Oliver felt doomed to always be a secondary character in someone else’s story. But when the teachers change up the casting, a good-natured rivalry turns ugly, and the plays spill dangerously over into life.\nWhen tragedy strikes, one of the seven friends is found dead. The rest face their greatest acting challenge yet: convincing the police, and themselves, that they are blameless.","image":"https://media.forbiddenplanet.com/products/0d/e7/e64bfc18b20ca8b1422f0c72f24774f9c261.jpg","mainEntityOfPage":"https://forbiddenplanet.com/378772-if-we-were-villains-hardcover-illustrated-edition/","name":"If We Were Villains (Hardcover Illustrated Edition)","url":"https://forbiddenplanet.com/378772-if-we-were-villains-hardcover-illustrated-edition/","category":"Books > Crime & Thrillers","gtin13":"9781803364919","mpn":"","offers":{"availability":"https://schema.org/InStock","price":11.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803364919","releaseDate":"2023-04-04","reviews":[],"sku":"5910830","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned The Last Murder At The End Of The World (Signed Edition) £7.99 RRP£9.99Crime & Thrillers {"description":"THE COUNTDOWN HAS BEGUN\nAbi keeps them safe. \nOne hundred and twenty-two islanders and their three beloved scientists live in harmony, kept safe from a poisonous security barrier with the help of Abi’s instructions. \nNiema keeps the islanders occupied. \nNiema is one of the scientists who remembers what life was like before the fog. She ensures that all of the islanders have a job to do, and everyone loves her. Almost everyone. \nEmory can’t stop asking questions. \nBut then one of the scientists is found dead, and their murder triggers the dropping of the security barrier. The only way to reinstate it is to find the killer. But can Emory ask the right questions? \nThey have 107 hours to solve the murder before the fog sweeps in. Can they stop the end of their world? ","image":"https://media.forbiddenplanet.com/products/e3/e7/be88b7ead5c875e03bf517f3d632c7d826a6.jpg","mainEntityOfPage":"https://forbiddenplanet.com/448575-the-last-murder-at-the-end-of-the-world-signed-edition/","name":"The Last Murder At The End Of The World (Signed Edition)","url":"https://forbiddenplanet.com/448575-the-last-murder-at-the-end-of-the-world-signed-edition/","category":"Books > Crime & Thrillers","gtin13":"9781526634924","mpn":"","offers":{"availability":"https://schema.org/InStock","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781526634924","releaseDate":"2025-01-30","reviews":[],"sku":"6825096","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSaleSigned Family Of Liars: The Prequel To We Were Liars (Signed Hardcover) £1.99 was £6.50 RRP£12.99Crime & Thrillers {"description":"The thrilling prequel to the TikTok phenomenon and #1 New York Times bestseller We Were Liars takes readers back to the story of another summer, another generation, and the secrets that will haunt them for decades to come.\nA windswept private island off the coast of Massachusetts. \nA hungry ocean, churning with secrets and sorrow.\nA fiery, addicted heiress. An irresistible, unpredictable boy. \nA summer of unforgivable betrayal and terrible mistakes.\nWelcome back to the Sinclair family. \nThey were always liars.","image":"https://media.forbiddenplanet.com/products/6f/28/13eeccd5fe4723549d2ed9ba462c5d926391.png","mainEntityOfPage":"https://forbiddenplanet.com/352880-family-of-liars-the-prequel-to-we-were-liars-signed-hardcover/","name":"Family Of Liars: The Prequel To We Were Liars (Signed Hardcover)","url":"https://forbiddenplanet.com/352880-family-of-liars-the-prequel-to-we-were-liars-signed-hardcover/","category":"Books > Crime & Thrillers","gtin13":"9781471412271","mpn":"","offers":{"availability":"https://schema.org/InStock","price":1.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781471412271","releaseDate":"2022-05-09","reviews":[],"sku":"5577842","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale5 for £5 Dark Things I Adore £2.99 was £5.99 RRP£8.995 for £5 on Paperback BooksView AllCrime & Thrillers {"description":"\n\nA group of outcasts gather at a small, prestigious arts camp in the Maine woods. They’re the painters: bright, hopeful, teeming with potential. But secrets and dark ambitions develop, and the truths they tell will come back to haunt them in ways more deadly than they dreamed.\n\n\nEsteemed art professor Max Durant arrives at his protégé’s remote home to view her graduate thesis. He knows Audra is beautiful, brilliant, and being invited into her private world is a rare gift. But he doesn’t know that Audra has engineered every aspect of their weekend together. Every detail, every conversation. Audra has woven the perfect web.\n\n\nOnly Audra knows what happened that summer in 1988. Max’s secret, and the dark things that followed. And even though it won’t be easy, Audra knows someone must pay.","image":"https://media.forbiddenplanet.com/products/89/ba/7bc79e9c00374e3725f74160edc257eb3673.jpg","mainEntityOfPage":"https://forbiddenplanet.com/319649-dark-things-i-adore/","name":"Dark Things I Adore","url":"https://forbiddenplanet.com/319649-dark-things-i-adore/","category":"Books > Crime & Thrillers","gtin13":"9781789095906","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789095906","releaseDate":"2021-09-14","reviews":[],"sku":"5140404","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Sherlock Holmes: Will Of The Dead £5.99 RRP£7.99Crime & Thrillers {"description":"A young man named Peter Maugram appears at the front door of Sherlock Holmes and Dr Watsons Baker Street lodgings. \nMaugrams uncle is dead and his will has disappeared, leaving the man afraid that he will be left penniless. Holmes agrees to take the case and he and Watson dig deep into the murky past of this complex family.","image":"https://media.forbiddenplanet.com/products/2767178.jpg","mainEntityOfPage":"https://forbiddenplanet.com/97731-sherlock-holmes-will-of-the-dead/","name":"Sherlock Holmes: Will Of The Dead","url":"https://forbiddenplanet.com/97731-sherlock-holmes-will-of-the-dead/","category":"Books > Crime & Thrillers","gtin13":"9781781160015","mpn":"","offers":{"availability":"https://schema.org/InStock","price":5.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781781160015","releaseDate":"2013-06-30","reviews":[],"sku":"2767178","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale5 for £5 Fu Manchu: Re-Enter Fu-Manchu £1.99 was £5.99 RRP£7.995 for £5 on Paperback BooksView AllCrime & Thrillers {"description":"In the twelfth of the perilous adventures of Nayland Smith, the top British agent is once again pitted against the fiendish devices of the keenest criminal genius in history. For Fu-Manchu, long thought dead, is on the scene againand the great cities of London, Cairo and New York know the shadow of his sinister presence","image":"https://media.forbiddenplanet.com/products/114009_eIWQ2bF.jpg","mainEntityOfPage":"https://forbiddenplanet.com/137019-fu-manchu-re-enter-fu-manchu/","name":"Fu Manchu: Re-Enter Fu-Manchu","url":"https://forbiddenplanet.com/137019-fu-manchu-re-enter-fu-manchu/","category":"Books > Crime & Thrillers","gtin13":"9780857686145","mpn":"","offers":{"availability":"https://schema.org/InStock","price":1.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780857686145","releaseDate":"2015-06-07","reviews":[],"sku":"3309094","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book5 for £5 Escapology £5.99 RRP£7.995 for £5 on Paperback BooksView AllCrime & Thrillers {"description":"Shock Pao is the best. In the virtual world - the Slip - there’s nothing he can’t steal for the right price. Outside the Slip, though, he’s a Fail: no degree, no job. \nSo when his ex offers him a job, breaking into a corporate databank, he accepts it’s either that, or find himself a nice bench to sleep under. Amiga works for psychotic crime lord - Twist Calhoun - so when Shocks war comes to her, it’s her job to bring him to Twist, dead or alive.","image":"https://media.forbiddenplanet.com/products/3572412.jpg","mainEntityOfPage":"https://forbiddenplanet.com/194611-escapology/","name":"Escapology","url":"https://forbiddenplanet.com/194611-escapology/","category":"Books > Crime & Thrillers","gtin13":"9781785650918","mpn":"","offers":{"availability":"https://schema.org/InStock","price":5.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785650918","releaseDate":"2016-06-05","reviews":[],"sku":"3572412","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book5 for £5 The Violence £6.99 RRP£9.995 for £5 on Paperback BooksView AllCrime & Thrillers {"description":"When Chelsea Martin kisses her husband hello at the door of their perfect home, a chilled bottle of beer in hand and dinner on the table, she may look like the ideal wife, mother, and homemaker—but in fact she’s following an unwritten rulebook, carefully navigating David’s stormy moods in a desperate nightly bid to avoid catastrophe. \nIf family time doesn’t go exactly the way David wants, bad things happen—to Chelsea, and to the&nbsp;couple’s seventeen-year-old daughter, Ella. Cut off from all support, controlled and manipulated for years, Chelsea has no resources and no one to turn to. \nHer wealthy, narcissistic mother, Patricia, would rather focus on the dust on her chandelier than acknowledge Chelsea’s bruises. After all, Patricia’s life looks perfect on the surface, too.\nBut th'''
