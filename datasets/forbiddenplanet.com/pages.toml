full_description = '''348 results in Books ▸ Action & Adventure Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSale Batman V Superman: Dawn Of Justice: Art Of The Film (Hardcover) £4.99 was £23.99 RRP£29.99Action & Adventure {"description":"Batman v Superman: Dawn of Justice: The Art of the Film, takes fans deep into this world, accompanied by insight and interviews with cast and crew, including an afterword by director Zack Snyder. \nPacked with stunning concept art, Zack Snyder’s storyboards, blueprints, costume detail and behind-the-scenes shots from the set, this book is an invaluable insight into the world of Batman v Superman: Dawn of Justice.","image":"https://media.forbiddenplanet.com/products/3526927_15Ixc5x.jpg","mainEntityOfPage":"https://forbiddenplanet.com/156693-batman-v-superman-dawn-of-justice-art-of-the-film-hardcover/","name":"Batman V Superman: Dawn Of Justice: Art Of The Film (Hardcover)","url":"https://forbiddenplanet.com/156693-batman-v-superman-dawn-of-justice-art-of-the-film-hardcover/","category":"Books > Action & Adventure","gtin13":"9781783297498","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781783297498","releaseDate":"2016-03-22","reviews":[],"sku":"3526927","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale No Time To Die: The Making Of The Film (Hardcover) £5.00 was £29.99 RRP£39.99Action & Adventure {"description":"The official making of book for No Time To Die, the 25th official James Bond 007 film.\nBond has left active service and is enjoying a tranquil life in Jamaica. His peace is short-lived when his old friend Felix Leiter from the CIA turns up asking for help. The mission to rescue a kidnapped scientist turns out to be far more treacherous than expected, leading Bond onto the trail of a mysterious villain armed with dangerous new technology.\nThis lavish coffee table hardback takes readers behind the scenes of the 25th official James Bond film and reveals the locations, characters, gadgets, weapons, and cars of No Time To Die, with exclusive on-set photography, concept art, costume designs, stunt breakdowns, and more, accompanied by cast and crew interviews.","image":"https://media.forbiddenplanet.com/products/8d/d8/9b4be1686918225651f02e4ce8d646397ff3.jpg","mainEntityOfPage":"https://forbiddenplanet.com/290499-no-time-to-die-the-making-of-the-film-hardcover/","name":"No Time To Die: The Making Of The Film (Hardcover)","url":"https://forbiddenplanet.com/290499-no-time-to-die-the-making-of-the-film-hardcover/","category":"Books > Action & Adventure","gtin13":"9781789093599","mpn":"","offers":{"availability":"https://schema.org/InStock","price":5.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789093599","releaseDate":"2021-10-15","reviews":[],"sku":"4183693","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Marvel: Avengers: Art Of The Game (Hardcover) £4.99 was £23.99 RRP£29.99Action & Adventure {"description":"Marvel’s Avengers: The Art of the Game features intimate studies of the Avengers, their designs, outfits, gear, and abilities, plus a detailed look at the different environments and missions in the game. \nUnmasking the artistry behind the hotly anticipated videogame, this showpiece hardback book contains exclusive concept sketches, character art, storyboards, and fully rendered scenes alongside fascinating insights into the creative process.","image":"https://media.forbiddenplanet.com/products/7e/27/ac2abbf81beaebb28873cd49d5dae74bb90c.jpg","mainEntityOfPage":"https://forbiddenplanet.com/293005-marvel-avengers-art-of-the-game-hardcover/","name":"Marvel: Avengers: Art Of The Game (Hardcover)","url":"https://forbiddenplanet.com/293005-marvel-avengers-art-of-the-game-hardcover/","category":"Books > Action & Adventure","gtin13":"9781789092769","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789092769","releaseDate":"2020-10-08","reviews":[],"sku":"4183730","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book5 for £5 Wonder Woman: The Official Movie Novelization £5.99 RRP£7.995 for £5 on Paperback BooksView AllAction & Adventure {"description":"Before she was Wonder Woman, she was Diana, princess of the Amazons, trained to be an unconquerable warrior. \nRaised on a sheltered island paradise, when an American pilot crashes on their shores and tells of a massive conflict raging in the outside world, Diana leaves her home, convinced she can stop the threat. \nFighting alongside man in a war to end all wars, Diana will discover her full powers… and her true destiny.","image":"https://media.forbiddenplanet.com/products/50/42/194ba500bf9e38ef2573b7063d34c90e595b.jpg","mainEntityOfPage":"https://forbiddenplanet.com/213564-wonder-woman-the-official-movie-novelization/","name":"Wonder Woman: The Official Movie Novelization","url":"https://forbiddenplanet.com/213564-wonder-woman-the-official-movie-novelization/","category":"Books > Action & Adventure","gtin13":"9781785653780","mpn":"","offers":{"availability":"https://schema.org/InStock","price":5.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785653780","releaseDate":"2017-06-06","reviews":[],"sku":"3821206","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Sea Of Thieves: The Cookbook (Hardcover) £16.99 RRP£24.99Action & Adventure {"description":"Let Larinna, leader of the Bilge Rats, be your guide on a culinary Sea of Thieves adventure. Take in taverns across the regions, from the bountiful Shores of Plenty to the fiery Devil’s Roar, or venture to a distant Sea Post to sample delicacies cooked up by The Hunter’s Call.\nStop off at The Captain’s Head for Tina’s Vegan House Chili, choose succulent grilled “Kraken” tentacles at The Charred Parrot, or venture to The Unicorn for their House Roast. If you enjoy a tipple, try pirate-inspired cocktails such as Salty Sea Dog Grog, The Devil’s Roar, Siren’s Sorrow, Sunset Over Crescent Isle, or The Ancient’s Curse. Sweet spoils to tempt you include Grilled Mango and Coconut Ice Cream, Port Merrick Banana Cream Pie, Ashen Lava Cake, and Devil’s Shroud Cake.\nWith over 80 delicious recipes, Sea of Thieves: The Cookbook will inspire you to prepare a feast for your fellow marauders and help you to fuel your crew as they voyage forth on a new adventure. ","image":"https://media.forbiddenplanet.com/products/29/bd/76642f8d1cf5aa7f6801fc81c4ecd3bf0577.jpg","mainEntityOfPage":"https://forbiddenplanet.com/392733-sea-of-thieves-the-cookbook-hardcover/","name":"Sea Of Thieves: The Cookbook (Hardcover)","url":"https://forbiddenplanet.com/392733-sea-of-thieves-the-cookbook-hardcover/","category":"Books > Action & Adventure","gtin13":"9781803365077","mpn":"","offers":{"availability":"https://schema.org/InStock","price":16.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803365077","releaseDate":"2024-05-07","reviews":[],"sku":"6081577","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Back To The Future: Light-Up Flux Capacitor: With Sound! £9.99 RRP£11.99Action & Adventure {"description":"\n\nDeluxe Collectible: A finely detailed, 3 inch replica of Doc Brown’s flux capacitor.\n\n\nLight-up and Sound Effects: Equipped with multiple LED lights and sound effects.\n\n\nBook Included: A full-colour, 32-page book exploring the mechanics of time travel and the timelines featured in the beloved film series.\n\n\nOfficially Licensed: An authentic Back to the Future collectible.\n\n\nRequires two AAA batteries (not included).","image":"https://media.forbiddenplanet.com/products/6f/54/7536f72475c82b45195512d206f580146add.png","mainEntityOfPage":"https://forbiddenplanet.com/441207-back-to-the-future-light-up-flux-capacitor-with-sound/","name":"Back To The Future: Light-Up Flux Capacitor: With Sound!","url":"https://forbiddenplanet.com/441207-back-to-the-future-light-up-flux-capacitor-with-sound/","category":"Books > Action & Adventure","gtin13":"9780762488001","mpn":"","offers":{"availability":"https://schema.org/InStock","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780762488001","releaseDate":"2024-11-04","reviews":[],"sku":"6582654","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Morbius: The Living Vampire: Blood Ties (Hardcover) £2.99 was £12.23 RRP£16.99Action & Adventure {"description":"Seeking to cure his rare blood disorder, Dr. Michael Morbius instead cursed himself with an insatiable lust for human blood. While trying to cure his horrific condition, he has become allied with Amanda Saint, whose sister Catherine is one of the leaders of the Demon-Fire Cult.\nAlso known as Poison Lark, Catherine Saint has two goals above all else. She seeks to bring Satan to Earth, thus unleashing the powers of Hell, and to kill Morbius and Amanda.\nWhen Morbius and Amanda follow the cult’s trail to New York City, they run afoul of an underground fight club that uses monsters as their pawns in the arena. The club captures Morbius and he becomes the star attraction, forced to kill or be killed.","image":"https://media.forbiddenplanet.com/products/a2/ea/ca7a6a7293efc55fa5b83697b4d4920559e9.jpg","mainEntityOfPage":"https://forbiddenplanet.com/298113-morbius-the-living-vampire-blood-ties-hardcover/","name":"Morbius: The Living Vampire: Blood Ties (Hardcover)","url":"https://forbiddenplanet.com/298113-morbius-the-living-vampire-blood-ties-hardcover/","category":"Books > Action & Adventure","gtin13":"9781789094855","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789094855","releaseDate":"2021-03-09","reviews":[],"sku":"4837152","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale DC Comics Novels: Batman: The Court Of Owls £2.99 was £7.99 RRP£8.99Action & Adventure {"description":"For generations, an apocryphal cabal has controlled Gotham from the shadows, wielding fear and violence through its undead assassins, the Talons. Its leaders meet in secrecy, hiding their identities behind masks. Once, they sought to kill Bruce Wayne who, as Batman, dealt them their greatest defeats, but they faded back into darkness before he could eliminate them entirely.\nTHE COURT OF OWLS.\nNow Gotham City is plagued with a series of brutal murders. Batman and his allies – including Nightwing and Batgirl – realize the Talons have returned. Should the Owls obtain what they seek, it could grant them power that no one could counter.","image":"https://media.forbiddenplanet.com/products/94/52/0ff667b01c327352d35b5f6362982f6c4ef4.jpg","mainEntityOfPage":"https://forbiddenplanet.com/279478-dc-comics-novels-batman-the-court-of-owls/","name":"DC Comics Novels: Batman: The Court Of Owls","url":"https://forbiddenplanet.com/279478-dc-comics-novels-batman-the-court-of-owls/","category":"Books > Action & Adventure","gtin13":"9781785658181","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785658181","releaseDate":"2019-11-12","reviews":[],"sku":"4586401","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Batman V Superman: Dawn Of Justice: Tech Manual (Hardcover) £2.99 was £19.99 RRP£24.99Action & Adventure {"description":"Batman’s tech has been reimagined and reinvigorated in\nBatman v Superman: Dawn of Justice, the new blockbuster from director Zack Snyder releasing in March 2016. \nThis book takes an exclusive, in-depth look at Batman’s arsenal, vehicles, Batsuits, and the iconic Batcave. This official companion book to the new movie features interviews with concept artists, the film’s weapon’s master, the mechanic for the Batmobile, and Zack Snyder himself.","image":"https://media.forbiddenplanet.com/products/156694.jpg","mainEntityOfPage":"https://forbiddenplanet.com/156694-batman-v-superman-dawn-of-justice-tech-manual-hardcover/","name":"Batman V Superman: Dawn Of Justice: Tech Manual (Hardcover)","url":"https://forbiddenplanet.com/156694-batman-v-superman-dawn-of-justice-tech-manual-hardcover/","category":"Books > Action & Adventure","gtin13":"9781785650604","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785650604","releaseDate":"2016-03-17","reviews":[],"sku":"3526934","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale DC Comics Novels: Harley Quinn: Mad Love £2.99 was £7.28 RRP£9.99Action & Adventure {"description":"When she was only seven years old, Harleen Quinzel witnessed her father being beaten up by thugs, and then arrested by the police. \nThat night she ran away to the safest place she could think of: Coney Island amusement park. But there, pursued into the Funhouse by the men who brutalised her father, she beheld unimaginable horrors.\nYears later, Harleen has put her past behind her, and used her intelligence and ambition to escape her childhood of poverty with a career in psychiatry. \nAssigned to her first position at Arkham Hospital, she will discover, deep in the asylum, something dangerous and alluring, something quite unlike anything else she has ever known before: The Joker. Because why would you settle for love, when you could have MAD LOVE?\nFrom the moment that Harleen finds a rose on her desk, to the moment she dons her harlequin hat, this is the definitive story that chronicles the obsession, the burning desire, the manic la'''
