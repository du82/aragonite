le detail and motion.","image":"https://media.forbiddenplanet.com/products/12/7a/aaa81702bed38500f312bc66a9b1721bc226.jpg","mainEntityOfPage":"https://forbiddenplanet.com/278728-the-cinematic-art-of-world-of-warcraft-volume-1-hardcover/","name":"The Cinematic Art Of World Of Warcraft: Volume 1 (Hardcover)","url":"https://forbiddenplanet.com/278728-the-cinematic-art-of-world-of-warcraft-volume-1-hardcover/","category":"Books > Art & Design","gtin13":"9781789092981","mpn":"","offers":{"availability":"https://schema.org/InStock","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789092981","releaseDate":"2019-10-15","reviews":[],"sku":"4610175","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-Order Dead Space: Martyr £6.99 RRP£9.99Due for release:22 Apr 2025Gaming Fiction {"description":"A prequel to Dead Space, the novel focuses on the birth of Unitology. In this novel set centuries before the events of the main series, geophysicist Michael Altman investigates an alien artefact called The Black Marker.\nWe have seen the future.\nA universe cursed with life after death.\nIt all started deep beneath the Yucatan peninsula, where an archaeological discovery took us into a new age, bringing us face-to-face with our origins and destiny.\nMichael Altman had a theory that no one would hear.\nIt cursed our world for centuries to come.\nThis, at last, is his story.","image":"https://media.forbiddenplanet.com/products/68/ce/2e2c25d0e01cecc8987e5aaf2a84dd8b25c6.jpg","mainEntityOfPage":"https://forbiddenplanet.com/444004-dead-space-martyr/","name":"Dead Space: Martyr ","url":"https://forbiddenplanet.com/444004-dead-space-martyr/","category":"Books > Gaming Fiction","gtin13":"9781835414347","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":6.99,"priceCurrency":"GBP","itemCondition":"https://schema.o