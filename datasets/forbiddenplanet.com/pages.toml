full_description = '''1575 results in Books ▸ Science Fiction Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSale The Art Of Blade Runner: Black Lotus (Hardcover) £4.99 was £28.79 RRP£39.99Art & Design {"description":"The Art of Blade Runner: Black Lotus is a study and celebration of the artwork that went into making the first ever Blade Runner animated series.\nConcept art, sketchwork, pre-viz, animation tests, final frames and more, are paired alongside interviews with the masterminds behind the show to give fans the full story of Black Lotus. \nRespected co-directors Shinji Aramaki and Kenji Kamiyama provide an exclusive, in-depth interview that explores their relationship with the Blade Runner universe, and their intimate analyses of and inspiration behind the characters. Alcon producers describe the creative journey, that spans many years prior, behind what they envisioned for the story, how Black Lotus would fit in the wider Blade Runner narrative, and who they wanted the protagonist to be.\nThe writers explain how they conceptualised the characters and the voice actors share their personal journeys and light-hearted anecdotes on how they brought those characters to life. The lighting and animation team also share how they captured Blade Runner’s cyberpunk visual and auditory palette in a new medium for the franchise: anime. \nThis book is illustrated to the brim with concept art that is beautifully vivid and presented in a gallery format throughout the book; organised chronologically by character, location, and event as they are introduced in the show. Readers will be able to breeze through this companion guide as they watch the show for a deeper, richer, and more personal viewing experience.\nAt the back of the book, you’ll find never-before-seen sketches of the Black Out short films that accompanied Blade Runner 2049.","image":"https://media.forbiddenplanet.com/products/c7/48/4431aa6948433e712061523f8fd5a7577302.jpg","mainEntityOfPage":"https://forbiddenplanet.com/338300-the-art-of-blade-runner-black-lotus-hardcover/","name":"The Art Of Blade Runner: Black Lotus (Hardcover)","url":"https://forbiddenplanet.com/338300-the-art-of-blade-runner-black-lotus-hardcover/","category":"Books > Art & Design","gtin13":"9781789097146","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789097146","releaseDate":"2022-10-04","reviews":[],"sku":"5383054","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale The Art Of Overwatch: Volume 2 £4.99 was £25.19 RRP£34.99Art & Design {"description":"This gorgeous compendium showcases new content from summer 2017 onward, including the development process around fan-favourite heroes, environments, and cinematics. \nBeyond new content, this all-encompassing showcase dives deeper, expanding on the construction of unique, event-driven game modes, NPC design, and more. \nDon’t miss this stunning collection, painstakingly produced direct from the Overwatch game team!","image":"https://media.forbiddenplanet.com/products/ce/12/da80d36072bf3f2944fad6296054ebdd0fda.jpg","mainEntityOfPage":"https://forbiddenplanet.com/326910-the-art-of-overwatch-volume-2/","name":"The Art Of Overwatch: Volume 2","url":"https://forbiddenplanet.com/326910-the-art-of-overwatch-volume-2/","category":"Books > Art & Design","gtin13":"9781789098914","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789098914","releaseDate":"2021-12-22","reviews":[],"sku":"5248476","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Alien: Covenant: Behind the Scenes: Official Collector's Edition (Hardcover) £2.99 was £11.99 RRP£14.99Art & Design {"description":"Alien: Covenant is the long-awaited sequel to the Alien franchise, and Alien: Covenant – Official Collector’s Edition brings you everything you need to know about Ridley Scott’s latest masterpiece!","image":"https://media.forbiddenplanet.com/products/3843048_IO79xnU.jpg","mainEntityOfPage":"https://forbiddenplanet.com/215440-alien-covenant-behind-the-scenes-official-collectors-edition-hardcover/","name":"Alien: Covenant: Behind the Scenes: Official Collector's Edition (Hardcover)","url":"https://forbiddenplanet.com/215440-alien-covenant-behind-the-scenes-official-collectors-edition-hardcover/","category":"Books > Art & Design","gtin13":"9781785861925","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785861925 ","releaseDate":"2019-05-17","reviews":[],"sku":"3843048","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-OrderSigned Ice Planet Barbarians: Book 10: Barbarian's Hope (Signed Bookplate Edition) £13.97 RRP£14.99Due for release:4 May 2025Fantasy {"description":"The next novel in the Ice Planet Barbarians series, an international publishing phenomenon, now in a special print edition with bonus material!\nAsha and Hemalo’s relationship has never been easy, for there is just as much hurt between them as there is love. Will they find their way back to each other, or will they let tragedy keep them separated for good?\nSeasons ago, I resonated to the quietest of tribesmates, a male content to love me from afar while I was the centre of attention. We could have been happy. Despite our differences, I loved him and he loved me.\nBut then a terrible thing happened… and my world was never the same again.\nNow resonance is giving us a second chance, but… I’m afraid. What if our bond is too broken to be fixed? What if there’s no hope left for us at all?","image":"https://media.forbiddenplanet.com/products/3d/b7/21ee7483477ce062ebfb5746abe5b933c3d5.jpg","mainEntityOfPage":"https://forbiddenplanet.com/449694-ice-planet-barbarians-book-10-barbarians-hope-signed-bookplate-edition/","name":"Ice Planet Barbarians: Book 10: Barbarian's Hope (Signed Bookplate Edition)","url":"https://forbiddenplanet.com/449694-ice-planet-barbarians-book-10-barbarians-hope-signed-bookplate-edition/","category":"Books > Fantasy","gtin13":"9780593954775","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":13.97,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780593954775","releaseDate":"2025-05-04","reviews":[],"sku":"5124749","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Doctor Who: Whodle £9.99 RRP£12.99Film, TV, & Music {"description":"Join your favourite Time Lord (every one of them!) as a whole host of puzzling mysteries await… \nWhich of three possible substances would make the best weapon against a Dalek? How can you tell which mannequin is an Auton? Where in the universe is the Master hiding? \nTravel through space and time, and across worlds, ships and space stations, as you crack clues, make deductions and solve cases. \nUsing your puzzling powers of logic (plus maybe a sonic screwdriver and some physic paper), it’s down to YOU to help the Doctor and their companions fight monsters and save the day.","image":"https://media.forbiddenplanet.com/products/e3/b6/48c1a8d3c20cec204837cbe00146299d4ecf.jpg","mainEntityOfPage":"https://forbiddenplanet.com/434680-doctor-who-whodle/","name":"Doctor Who: Whodle","url":"https://forbiddenplanet.com/434680-doctor-who-whodle/","category":"Books > Film, TV, & Music","gtin13":"9781405971843","mpn":"","offers":{"availability":"https://schema.org/InStock","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781405971843","releaseDate":"2024-10-14","reviews":[],"sku":"6623371","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Mickey7: Book 2: Antimatter Blues (Signed Edition) £7.99 RRP£9.99Science Fiction {"description":"The thrilling follow-up to Mickey7, soon to be a major motion picture by Academy Award-winning director Bong Joon-Ho.\nSummer has come to Niflheim. The lichens are growing, the six-winged bat-things are chirping and much to his own surprise, Mickey Barnes is still alive, that last part thanks almost entirely to the fact that Commander Marshall believes that the colony’s creeper neighbours are holding an antimatter bomb and that Mickey is the only one who’s keeping them from using it.\nMickey’s just another colonist now. Instead of cleaning out the reactor core, he spends his time these days cleaning out the rabbit hutches. It’s not a bad life.\nIt’s not going to last.\nIt may be sunny now, but winter is coming. The antimatter that fuels the colony is running low, and Marshall wants his bomb back. If Mickey agrees to retrieve it, he’ll be giving up the only thing that’s kept his head off of the chopping block. If he refuses, he might doom the entire colony.\nMeanwhile, the creepers have their own worries, and they’re not going to surrender the bomb without getting something in return. Once again, Mickey finds the fate of two species resting in his hands. If something goes wrong this time, though, he won’t be coming back.","image":"https://media.forbiddenplanet.com/products/f8/44/3dfd6d15a2340bbf177e49643d84bc5efc3f.jpg","mainEntityOfPage":"https://forbiddenplanet.com/451435-mickey7-book-2-antimatter-blues-signed-edition/","name":"Mickey7: Book 2: Antimatter Blues (Signed Edition)","url":"https://forbiddenplanet.com/451435-mickey7-book-2-antimatter-blues-signed-edition/","category":"Books > Science Fiction","gtin13":"9781786188618","mpn":"","offers":{"availability":"https://schema.org/InStock","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781786188618","releaseDate":"2025-02-19","reviews":[],"sku":"6868765","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Star Trek: The Art Of Neville Page (Hardcover) £4.99 was £26.99 RRP£39.99Art & Design {"description":"Showcasing his entire Star Trek career to date, this visually stunning retrospective celebrates the inventiveness of Neville Page’s designs.\nDuring a career spanning over twenty years, visionary creature designer Neville Page has applied his considerable expertise to the creation and development of the aliens of the Star Trek Universe. From the movies Star Trek (2009) through to Star Trek Beyond (2016), as well as the shows Star Trek: Discovery and Star Trek: Picard, Page’s incredibly detailed and intricate work has yielded some of the franchise’s most memorable characters.\nFeaturing captivating concept art and detailed sketches, Star Trek: The Art of Neville Page provides exclusive insight into Page’s creative process. \nThis is essential reading for Star Trek fans as it includes a vast collection of illustrations from his remarkable work, plus an exclusive foreword and insightful afterword by award-winning filmmakers, Alex Kurtzman and Michael Westmore. \nCovers all aliens developed by Page for the recent entries in the Star Trek franchise, including the Klingon redesign and the Kelpiens.","image":"https://media.forbiddenplanet.com/products/cb/34/0d933e57c5a06615123e6949b3086e35d245.jpg","mainEntityOfPage":"https://forbiddenplanet.com/355380-star-trek-the-art-of-neville-page-hardcover/","name":"Star Trek: The Art Of Neville Page (Hardcover)","url":"https://forbiddenplanet.com/355380-star-trek-the-art-of-neville-page-hardcover/","category":"Books > Art & Design","gtin13":"9781789095159","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789095159","releaseDate":"2023-08-08","reviews":[],"sku":"5614400","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Valerian & The City Of A Thousand Planets: Art Of The Film (Hardcover) £2.99 was £26.99 RRP£29.99Science Fiction {"description":"The official art book of the blockbuster movie, written and directed by visionary Luc Besson (Lucy, The Fifth Element). Valerian (Dane DeHaan) and Laureline (Cara Delevingne) are special operatives for the government of the human territories charged with maintaining order throughout the universe. \nUnder directive from their Commander (Clive Owen), Valerian and Laureline embark on a mission to the breathtaking intergalactic city of Alpha, an ever-expanding metropolis comprised of thousands of different species from all four corners of the universe.","image":"https://media.forbiddenplanet.com/products/3864272.jpg","mainEntityOfPage":"https://forbiddenplanet.com/220704-valerian-the-city-of-a-thousand-planets-art-of-the-film-hardcover/","name":"Valerian & The City Of A Thousand Planets: Art Of The Film (Hardcover)","url":"https://forbiddenplanet.com/220704-valerian-the-city-of-a-thousand-planets-art-of-the-film-hardcover/","category":"Books > Science Fiction","gtin13":"9781785654008","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781785654008","releaseDate":"2017-07-14","reviews":[],"sku":"3864272","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Star Trek: Lost Scenes (Hardcover) £4.99 was £20.99 RRP£29.99Film, TV, & Music {"description":"Think you know everything about the Original Series? Think again. \nStar Trek: The Lost Scenes is packed with hundreds of never-before-seen colour photos of the world’s ultimate sci-fi series. Professionally restored images are used to chronicle the making of the series, reassemble deleted scenes, and showcase bloopers from the first pilot through the last episode. \nWhether you’re a new Star Trek fan or a seasoned veteran, this book is a must-have.","image":"https://media.forbiddenplanet.com/products/22/c1/69c502fff31d3c7a4a32a9922cdfe3b49610.jpg","mainEntityOfPage":"https://forbiddenplanet.com/251784-star-trek-lost-scene'''
