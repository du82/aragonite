on","@context":"https://schema.org","@type":"Product"}Vinyl Art ToySale Dungeons & Dragons: Pop! Vinyl Figure & Dice: Warduke £8.99 was £15.99 RRP£15.99RPG Gaming {"description":"From Funko’s popular POP! series comes this cool vinyl figure. It stands approximately 10 centimeters tall and comes in a window box packaging.\nPlease note that some of Funko exclusives listed may or may not have stickers.","image":"https://media.forbiddenplanet.com/products/08/3f/4b002a95753940aa3b59329385b916eb1cda.png","mainEntityOfPage":"https://forbiddenplanet.com/439570-dungeons-dragons-pop-vinyl-figure-dice-warduke/","name":"Dungeons & Dragons: Pop! Vinyl Figure & Dice: Warduke","url":"https://forbiddenplanet.com/439570-dungeons-dragons-pop-vinyl-figure-dice-warduke/","brand":"Pop! Vinyl","category":"Gaming > RPG Gaming","gtin12":"889698564656","mpn":"56465","offers":{"availability":"https://schema.org/InStock","price":8.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:889698564656","releaseDate":"2024-09-30","reviews":[],"sku":"6377922","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MiniaturePre-Order Dungeons & Dragons: Icons Of The Realms: Baldur's Gate 3: Characters (Box Set) £49.99Due for release:28 Mar 2025Accessories {"description":"Transport your favourite characters from the screen to the tabletop with the new D&amp;D Icons of the Realms: Baldur’s Gate 3, Character Boxed Set!\nThis set features 7 iconic characters from the critically acclaimed Baldur’s Gate 3 video game, perfectly recreated as detailed, pre-painted miniatures.\nHoused in non-blind windowed packaging, this set includes pre-painted miniatures for Astarion, Karlach, Gale, Shadowheart, Wyll, Lae’zel and Withers. The set is perfect for Dungeon Masters looking to feature a famous character or as a collector’s piece for Baldur’s Gate and D&amp;D fans.\nFeatures:\nSeven pre-painted miniatures from Baldur’s Gate 3’s iconic cast of characters.\nGreat for bringing your favourite Baldur’s Gate 3 characters to the tabletop.","image":"https://media.forbiddenplanet.com/products/54/7e/a1df033ddefcc479608563701966e2266352.png","mainEntityOfPage":"https://forbiddenplanet.com/442303-dungeons-dragons-icons-of-the-realms-baldurs-gate-3-characters-box-set/","name":"Dungeons & Dragons: Icons Of The Realms: Baldur's Gate 3: Characters (Box Set)","url":"https://forbiddenplanet.com/442303-dungeons-dragons-icons-of-the-realms-baldurs-gate-3-characters-box-set/","category":"Gaming > Accessories","mpn":"WZK96338","offers":{"availability":"https://schema.org/PreOrder","price":49.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:442303","releaseDate":"2025-03-28","reviews":[],"sku":"6729295","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Rulebook Call Of Cthulhu: 7th Edition: Keeper Rulebook (Hardcover) £35.99 RRP£39.99Horror {"description":"The Old Ones ruled the earth aeons before the rise of man. Traces of their cyclopean cities can still be found on remote islands, buried amid the shifting desert sands, and in the frozen wastes of the polar extremes. \nOriginally they came to this world from the stars. They sleep now, some deep within the earth or beneath the sea. When the stars are right they shall again walk the earth.\nCall of Cthulhu is a tabletop roleplaying game based upon the worlds of H. P. Lovecraft. It is a game of secrets, mysteries, and horror. Playing the role of steadfast investigators, you travel to strange and dangerous places, uncover foul plots, and stand against the terrors of the Cthulhu Mythos. \nYou encounter sanity-blasting entities, monsters, and insane cultists. Within strange and forgotten tomes of lore you discover revelations that man was not meant to know. You and your companions may very well decide the fate of the world.\nThis book, the Keeper Rulebook, contains the core rules, background, guidance, spells, and monsters of the game. It is intended for use by the Keeper of Arcane Lore (the Keeper) — that player who will present the adventure to the other players. You must have at least one copy of this book to play Call of Cthulhu. \nThe other players, the Investigators, should have one or more copies of the Investigator Handbook, containing expanded rules for character creation, skills, occupations, equipment, and more.\nCall of Cthulhu, 7th edition, is backwards-compatible with all other available Chaosium titles.","image":"https://media.forbiddenplanet.com/products/200359.jpg","mainEntityOfPage":"https://forbiddenplanet.com/200359-call-of-cthulhu-7th-edition-keeper-rulebook-hardcover/","name":"Call Of Cthulhu: 7th Edition: Keeper Rulebook (Hardcover)","url":"https://forbiddenplanet.com/200359-call-of-cthulhu-7th-edition-keeper-rulebook-hardcover/","category":"Books > Horror","gtin13":"9781568824307","mpn":"","offers":{"availability":"https://schema.org/InStock","price":35.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781568824307","releaseDate":"2024-02-16","reviews":[],"sku":"3646281","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Rulebook The Game Master's Book Of Villains, Minions & Their Tactics (Hardcover) £16.99 RRP£21.99Fantasy {"description":"Make your PCs sweat with villains and minions designed to challenge them as never before!\n\n\nNew deluxe edition of Masters, Minions and Tactics from the award-winning fantasy art studio Jetpack7\n\n\nIncludes more than two dozen deadly BBEGs, including 5 new villains exclusive to this edition\n\n\nVillains for low level and high level parties, plus tactics for more than 75 different minions and Big Bads\n\n\nCompletely re-edited and redesigned, with exclusive guidelines for creating your own original villains and minions, as well as three exciting one-shots adventures!\n\n\nA game master’s biggest challenge can be prep time. With busy lives in mind, this book provides new and exciting content to help GMs save hours of time preparing for a game.\nInside, readers will find twenty-five “Big Bosses,” along with insights into how they use their minions strategically in order to decimate any heroic threat that might cross their paths.\nThe Game Master’s Book of Villains, Minions and Their Tactics provides tips and strategies that readers can use to “drag and drop” a BBEG into a new or existing game, with full colour illustrations, lore, stats, combat tactics, and special abilities for each exciting entry.\nYou’ll also find detailed tactics and combat strategies for more than 75 minions and bosses found throughout the 5E game.\nIn addition to providing three exciting one-shot adventures, the book also shows you how to create your own original villains, minions and monsters the best of the worst your game has to offer.","image":"https://media.forbiddenplanet.com/products/a5/16/b1a17c8970ba028490b875eda7a9deced011.jpg","mainEntityOfPage":"https://forbiddenplanet.com/399172-the-game-masters-book-of-villains-minions-their-tactics-hardcover/","name":"The Game Master's Book Of Villains, Minions & Their Tactics (Hardcover)","url":"https://forbiddenplanet.com/399172-the-game-masters-book-of-villains-minions-their-tactics-hardcover/","category":"Books > Fantasy","gtin13":"9781956403411","mpn":"","offers":{"availability":"https://schema.org/InStock","price":16.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781956403411","releaseDate":"2023-12-29","reviews":[],"sku":"6156596","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Gaming AccessoriesBlind Boxed Dungeons & Dragons: Sirius Dice: Acererak's Treasure Pack: Gold Edition (1 Pcs) £19.99Accessories {"description":"Acererak’s Treasure dice boosters each come with a 7 dice set, a metal coin and a D&amp;D dice bag, each randomised from a great many possibilities of varying rarity. \nEach Gold Edition pack offers a chance to discover a special Gold Pack containing one of the 50 gold leatherette dice bags, numbered gold-plated Eye of Vecna coins and a rare or legendary dice set along with a redemption code for a super legendary gemstone dice set. This means you have the chance to add not just one, but two sets to your collection!\nContains:\n1x 7 PIECE POLYHEDRAL DICE SET Each Treasure Pack contains one of the 72 different dice sets including all new dice sets that are exclusive to our Acererak’s Treasure Packs: Gold Edition.\n1x ABILITY COIN Contains one of the 22 original 40mm metal dice coins featuring a unique design on each face and the Dungeons &amp; Dragons logo on the back.\n1x DICE BAG Contains one of the 8 colours Dungeons &amp; Dragons logo embroidered dice bags.\nPlease note:\n1 randomly selected pack provided per purchase. Exact contents can’t be specified, you may receive duplicates. Ordering the quantity of full box does not guarantee receiving a sealed box.","image":"https://media.forbiddenplanet.com/products/7b/bb/6c08affb595b04f524e830cfea288d6b02b4.png","mainEntityOfPage":"https://forbiddenplanet.com/449446-dungeons-dragons-sirius-dice-acereraks-treasure-pack-gold-edition-1-pcs/","name":"Dungeons & Dragons: Sirius Dice: Acererak's Treasure Pack: Gold Edition (1 Pcs)","url":"https://forbiddenplanet.com/449446-dungeons-dragons-sirius-dice-acereraks-treasure-pack-gold-edition-1-pcs/","category":"Gaming > Accessories","gtin12":"810113710839","mpn":"SDZ200108","offers":{"availability":"https://schema.org/InStock","price":19.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:810113710839","releaseDate":"2025-01-20","reviews":[],"sku":"6695712","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book So You Want To Be A Game Master £13.99 RRP£18.99Art & Design {"description":"Become the Ultimate Game Master\nThanks to tabletop roleplay, millions of fans are creating unforgettable collaborative stories. No matter what roleplaying game you want to play, this book is the key to unlocking endless adventure!\nAward-winning game designer Justin Alexander has created an incredible compendium of advice and maps, perfect for any aspiring Game Master. This book is packed with the strategies you need to create amazing dungeons, battles, roleplay encounters, and more.\nFull of practical, hands-on advice and sample maps, just reading the first chapter of this book will have you ready to run a game in less than an hour. From there, Justin teaches you all the skills and techniques you need to explore dungeons, solve mysteries, steal priceless artefacts, unravel strange conspiracies, and venture forth on epic journeys!\nNo matter what game you’re playing, this book is the key to unlocking the limitless realms of your imagination.","image":"https://media.forbiddenplanet.com/products/35/18/1fa426402dafb84260b05f0390788e1fad4c.jpg","mainEntityOfPage":"https://forbiddenplanet.com/401057-so-you-want-to-be-a-game-master/","name":"So You Want To Be A Game Master","url":"https://forbiddenplanet.com/401057-so-you-want-to-be-a-game-master/","category":"Books > Art & Design","gtin13":"9781645679158","mpn":"","offers":{"availability":"https://schema.org/InStock","price":13.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781645679158","releaseDate":"2024-01-04","reviews":[],"sku":"6194888","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Dungeons & Dragons: Worlds & Realms: Adventures From Greyhawk To Faerûn (Signed Bookplate Edition Hardcover) £30.00 RRP£40.00Action & Adventure {"description":"Celebrate fifty years of the spellbinding settings and planes of Dungeons &amp; Dragons with this beautifully illustrated exploration of the multiverse.\nWorlds &amp; Realms is an illustrated, story-driven retrospective celebrating the immersive worldbuilding of D&amp;D since the iconic game’s inception in 1974. Legendary mage Mordenkainen takes adventurers on a fantastical journey through the multiverse, delving into memorable and fascinating lore and locations across all five editions of the game.\nWith Mordenkainen’s guidance, readers will revisit worlds that have come to define D&amp;D over the decades, from the familiar realms of the Material Plane to lands beyond the Astral Sea.\nMordenkainen’s philosophical musings provide a mage’s-eye view of the worlds’ unique features, creatures, and characters, captivating readers’ imaginations as they learn more about the history and mysteri'''
