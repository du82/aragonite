full_description = '''159 results in Gaming ▸ Board Games Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Board GamePre-Order Micro Midgard £19.99Due for release:21 Mar 2025Board Games {"description":"Travel the 9 realms of Norse mythology and be the champion to fulfil the Norn’s prophecies before Ragnarok comes.\nPlayers move meeples on a shared board to gain resources, craft relics, and complete quests to gain glory, as the wolves Skoll and Hati get ever closer to catching the sun (Sol) or the moon (Mani). When one of the wolves reach the end of the track, the current objective is scored and points are awarded to the winning player. The game ends when either a player reaches 9 points, or the final 5th objective has been scored.","image":"https://media.forbiddenplanet.com/products/75/66/af576f945f0cc3b06158cf0968418638fd47.png","mainEntityOfPage":"https://forbiddenplanet.com/442521-micro-midgard/","name":"Micro Midgard","url":"https://forbiddenplanet.com/442521-micro-midgard/","category":"Gaming > Board Games","mpn":"PGLMM001","offers":{"availability":"https://schema.org/PreOrder","price":19.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:442521","releaseDate":"2025-03-21","reviews":[],"sku":"6657000","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MiniaturePre-Order DC: Heroclix Iconix: The Sandman £24.99Due for release:27 Mar 2025Accessories {"description":"Journey to the land of dreams, where Morpheus rules all. Neil Gaiman’s critically acclaimed saga changed the comic book industry forever - now it will change your HeroClix collection!\nDream of the Endless has become an enduring pop culture icon and one of the most beloved DC characters. Add him to your favorite HeroClix team, or build a team centered around him! This is something that can’t be missed by HeroClix collectors.\nThis item contains:\n\n\n1 Dream HeroClix Figure and his character card\n\n\n3 Objects and their cards\n\n\nDream’s Helm\n\n\nPouch of Sand\n\n\nDreamstone\n\n\nContents subject to change\nImages not final","image":"https://media.forbiddenplanet.com/products/82/dd/c9486a478f22d3e49290684c2ef14ccb3c94.png","mainEntityOfPage":"https://forbiddenplanet.com/440067-dc-heroclix-iconix-the-sandman/","name":"DC: Heroclix Iconix: The Sandman","url":"https://forbiddenplanet.com/440067-dc-heroclix-iconix-the-sandman/","category":"Gaming > Accessories","mpn":"WZK84116","offers":{"availability":"https://schema.org/PreOrder","price":24.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:440067","releaseDate":"2025-03-27","reviews":[],"sku":"6584504","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MiniaturePre-Order DC: Heroclix: Mr. Freeze (Snowglobe) £24.99Due for release:23 Mar 2025Accessories {"description":"See your opponents scattered like snowflakes in the wind with the coolest Mr. Freeze figure to ever make it to HeroClix!\nWhether you know him from your favourite comics, TV, or the big screen, Mr. Freeze is one of the most recognisable Batman villains of all time. He has it all: memorable quotes, awesome gear, and a compelling origin story. Bring him to your next HeroClix game and send shivers down your opponents’ spines!\nThis item contains:\n1 Mr. Freeze HeroClix Figure (on a 2 x 2 base) in decorative snowglobe and his character card","image":"https://media.forbiddenplanet.com/products/f1/5d/d49e10f2c37dd701fcf8c6ec1244e5e06f99.png","mainEntityOfPage":"https://forbiddenplanet.com/430180-dc-heroclix-mr-freeze-snowglobe/","name":"DC: Heroclix: Mr. Freeze (Snowglobe)","url":"https://forbiddenplanet.com/430180-dc-heroclix-mr-freeze-snowglobe/","category":"Gaming > Accessories","mpn":"WZK84114","offers":{"availability":"https://schema.org/PreOrder","price":24.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430180","releaseDate":"2025-03-23","reviews":[],"sku":"6551445","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}MiniaturePre-Order Dungeons & Dragons: Heroclix Iconix: Den Of The Displacer Beast £39.99Due for release:16 Mar 2025Accessories {"description":"For the first time ever, some of the most incredible elements of Dungeons &amp; Dragons are entering HeroClix!\nBelieve your eyes - the Displacer Beast is coming to HeroClix! Bring its monstrous power to your next HeroClix game! Deceive opponents with a Mimic!\nThis set contains:\n1 Premium Painted Displacer Beast Figure (and its corresponding card)\n1 Premium Painted Mimic Figure (and its corresponding card)\n1 Longsword 3-D Object on base (and its card)\n1 D20\nContents subject to change.\nImages not final.","image":"https://media.forbiddenplanet.com/products/f8/a1/ea7194cc4f9fd0a165298ea665d4d3aaa87d.png","mainEntityOfPage":"https://forbiddenplanet.com/430182-dungeons-dragons-heroclix-iconix-den-of-the-displacer-beast/","name":"Dungeons & Dragons: Heroclix Iconix: Den Of The Displacer Beast","url":"https://forbiddenplanet.com/430182-dungeons-dragons-heroclix-iconix-den-of-the-displacer-beast/","category":"Gaming > Accessories","mpn":"WZK84111","offers":{"availability":"https://schema.org/PreOrder","price":39.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430182","releaseDate":"2025-03-16","reviews":[],"sku":"6551452","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order World's Smallest: Catan £9.99Due for release:16 Mar 2025Board Games {"description":"Fun game play in miniature! The legendary game of trading and development only now in the palm of your hand! The World’s Smallest version of this classic game is perfect for travel and on the go fun.","image":"https://media.forbiddenplanet.com/products/6a/ae/b03c69ef8c725b5cfdf0891e831d52cc232f.png","mainEntityOfPage":"https://forbiddenplanet.com/430497-worlds-smallest-catan/","name":"World's Smallest: Catan","url":"https://forbiddenplanet.com/430497-worlds-smallest-catan/","category":"Gaming > Board Games","mpn":"ABG333SI5198","offers":{"availability":"https://schema.org/PreOrder","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430497","releaseDate":"2025-03-16","reviews":[],"sku":"6553685","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order DCeased £129.99Due for release:28 Mar 2025Board Games {"description":"Protect Earth from the Anti-Life Virus and its hosts in this epic DC Universe Zombicide game!\nNot even the most powerful Super Heroes in the universe are safe from the the Anti-Life Equation, a techno-organic virus that quickly spread around the world’s digital networks. The Justice League has been torn apart (quite literally) and now former enemies join forces as old allies must be put down before they can sow even more destruction. So, assemble you Super Hero team, muster all the power you can, and stand against the DCeased!\nDCeased – A Zombicide Game is a cooperative game were 1 to 6 players control the last uninfected Super Heroes facing off against Zombie Heroes and the zombie hordes controlled by the game itself.\nThe goal is to complete Mission Objectives, defeat the Enemies, and rescue Bystanders. Eliminating zombies gives you the experience needed to become an even more powerful Super Hero. But the stronger you are, the more zombies appear to hunt you down! Only by working together and pushing their powers to the limit can the Super Heroes hope to put an end to the Anti-Life threat!","image":"https://media.forbiddenplanet.com/products/44/44/a9d69e9a97618755d1b57bdd5ecbccf29df1.png","mainEntityOfPage":"https://forbiddenplanet.com/430328-dceased/","name":"DCeased","url":"https://forbiddenplanet.com/430328-dceased/","category":"Gaming > Board Games","mpn":"CMNDCS002","offers":{"availability":"https://schema.org/PreOrder","price":129.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430328","releaseDate":"2025-03-28","reviews":[],"sku":"6553593","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order DCeased: Green Lantern Corpse (Expansion) £34.99Due for release:28 Mar 2025Board Games {"description":"The Green Lantern Corps, an intergalactic peacekeeping force using their willpower to wield the might of their Power Rings, should be the universe’s greatest hope in stopping the spread of the Anti-Life virus.\nHowever, even these bastions of heroism are not immune to it and must stand together against the wave of fear that threatens the galaxy.\nGreen Lantern Corpse is an expansion, bringing the full power (and terror) of the Green Lantern Corps. Including 4 new Missions to explore all the gameplay possibilities of wielding Power Rings in the battle against Anti-Life, whether in brightest day or in blackest night.","image":"https://media.forbiddenplanet.com/products/4d/0c/aa43acd936da527c8210dde275ccb466bf42.jpg","mainEntityOfPage":"https://forbiddenplanet.com/430502-dceased-green-lantern-corpse-expansion/","name":"DCeased: Green Lantern Corpse (Expansion)","url":"https://forbiddenplanet.com/430502-dceased-green-lantern-corpse-expansion/","category":"Gaming > Board Games","mpn":"CMNDCS005","offers":{"availability":"https://schema.org/PreOrder","price":34.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430502","releaseDate":"2025-03-28","reviews":[],"sku":"6553623","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order DCeased: Gotham Knights (Expansion) £59.99Due for release:30 Mar 2025Board Games {"description":"Gotham City has always been besieged by crime and violence. From daring criminals to the Court of Owls secret society ruling from the shadows, danger has ever lurked behind every corner. The Bat-family alone has stood against them, fighting to bring safety and justice to its citizens. But in its darkest hour, Batman and many of the Gotham Knights have fallen prey to the Anti-Life virus, joining in the carnage with the rest of the hordes. It’s up to the few surviving heroes to keep the beacon of hope lit on Gotham City’s night skies.\nGotham Knights is an expansion that brings the battle against the Anti-Life to the mean streets of Gotham City, up to the Wayne Manor, and all the way down to the Batcave. Batman, his allies, and his enemies, have been scattered between both sides of this deadly conflict. Not even an arsenal of Bat-gadgets might be enough to succeed in your missions, with a horde of unliving Talons hunting you from the shadows!","image":"https://media.forbiddenplanet.com/products/e9/cd/80ad8eb2f5dcd65e523ae08933dd11275f32.png","mainEntityOfPage":"https://forbiddenplanet.com/430329-dceased-gotham-knights-expansion/","name":"DCeased: Gotham Knights (Expansion)","url":"https://forbiddenplanet.com/430329-dceased-gotham-knights-expansion/","category":"Gaming > Board Games","mpn":"CMNDCS003","offers":{"availability":"https://schema.org/PreOrder","price":59.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430329","releaseDate":"2025-03-30","reviews":[],"sku":"6553609","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order DCeased: Arkham Asylum (Expansion) £59.99Due for release:30 Mar 2025Board Games {"description":"Arkham Asylum is an expansion that brings Batman’s legendary rogues gallery to the game, in the form of both Super Heroes and Zombie Heroes.\nThese Super-Villains will have to make use of their most devious tactics in the fight against Anti-Life, especially since it’s not only their former accomplices that are now undead, but also the hulking Titan-infused inmates.","image":"https://media.forbiddenplanet.com/products/66/6a/2fb5e17130438a578a8f4a330a0cc491cdfc.png","mainEntityOfPage":"https://forbiddenplanet.com/430330-dceased-arkham-asylum-expansion/","name":"DCeased: Arkham Asylum (Expansion)","url":"https://forbiddenplanet.com/430330-dceased-arkham-asylum-expansion/","category":"Gaming > Board Games","mpn":"CMNDCS004","offers":{"availability":"https://schema.org/PreOrder","price":59.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430330","releaseDate":"2025-03-30","reviews":[],"sku":"6553616","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order Dune: Imperium: Bloodlines £39.99Due for release:21 Mar 2025Board Games {"description":"The Great Houses of the Imperium live and die by their lineage. Plots unfold over generations as Emperors build dynasties, and the Bene Gesserit weave prophecy into reality. As alliances rise and fall, leaders face a single question: How far will you go to secure your bloodline?\nBloodlines expands both Dune: Imperium and Uprising with powerful new tools to achieve victory. Recruit Sardaukar Commanders to bolster your fighting force. Unlock the potential of all-new Tech tiles. New Leaders, Contracts, and cards open more strategic possibilities than ever before. War sweeps across the universe, and only the strongest Bloodlines will survive.","image":"https://media.forbiddenplanet.com/products/9a/5e/76b7ebfac39af5bce71ce48d935a28e5c40b.png","mainEntityOfPage":"https://forbiddenplanet.com/440700-dune-imperium-bloodlines/","name":"Dune: Imperium: Bloodlines","url":"https://forbiddenplanet.com/440700-dune-imperium-bloodlines/","category":"Gaming > Board Games","mpn":"DWD01020","offers":{"availability":"https://schema.org/PreOrder","price":39.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:440700","releaseDate":"2025-03-21","reviews":[],"sku":"6656942","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Board GamePre-Order For Sale: Travel Edition £17.99Due for release:21 Mar 2025Board Games {"description":"Going once!'''
