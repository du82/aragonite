ontext":"https://schema.org","@type":"Offer"},"productID":"isbn:9780593954775","releaseDate":"2025-05-04","reviews":[],"sku":"5124749","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-OrderSigned Immortal Pleasures (Signed Edition) £7.99 RRP£9.99Due for release:13 Mar 2025Fantasy {"description":"In this seductive dark fantasy from the author of The Haunting of Alejandra, an ancient Aztec vampire roams the modern world in search of vengeance and love.\nHundreds of years ago, she was known as La Malinche: a Nahua woman who translated for the conquistador Cortés. In the centuries since, her name has gone down in infamy as a traitor. But no one ever found out what happened to La Malinche after Cortés destroyed her people.\nIn the ashes of the empire, she was reborn as Malinalli, an immortal vampire. And she has become an avenger of conquered peoples, traveling the world to reclaim their stolen artifacts and return them to their homelands.","image":"https://media.forbiddenplanet.com/products/7f/e3/cab39fccb372127af5a2311d64b2f899b2d9.jpg","mainEntityOfPage":"https://forbiddenplanet.com/422274-immortal-pleasures-signed-edition/","name":"Immortal Pleasures (Signed Edition)","url":"https://forbiddenplanet.com/422274-immortal-pleasures-signed-edition/","category":"Books > Fantasy","gtin13":"9781835410110","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835410110","releaseDate":"2025-03-13","reviews":[],"sku":"6480943","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Cosmic Chaos: Book 1: I Got Abducted By Aliens & Now I'm Trapped In A Rom-Com £12.97 RRP£15.99Humour {"description":"A hilarious and sexy romance about a woman who gets dropped on a strange planet only to fall for not one, but two, aliens, from the author of I Got Drunk and Yeeted a Love Potion at a Werewolf.\nDorothy Valentine is close to getting her PhD in wildlife biology when she’s attacked by a lion. On the bright side, she’s saved! On the not-so-bright side, it’s because they’re abducted by aliens. In her scramble to escape, Dory and the lion commandeer an escape pod and crash-land on an alien planet that has… dinosaurs?\nDory and her new lion bestie, Toto, are saved in the nick of time by a mysterious and sexy alien, Sol. On their new adventure, they team up with the equally hot, equally dangerous Lok, who may or may not be a war criminal. Whether it be trauma, fate, or intrigue, Dory can’t resist the attraction that’s developing in their trio....\nAs this ragtag group of misfits explore their new planet, Dory learns more about how and why they’ve all ended up together, battles more prehistoric creatures than she imagined (she imagined… zero), and questions if she even wants to go back home to Earth in this hilarious and steamy alien romance adventure comedy romp.","image":"https://media.forbiddenplanet.com/products/99/aa/812f35f3e862dc495ea2e341ce1c721d6375.jpg","mainEntityOfPage":"https://forbiddenplanet.com/444183-cosmic-chaos-book-1-i-got-abducted-by-aliens-now-im-trapped-in-a-rom-com/","name":"Cosmic Chaos: Book 1: I Got Abducted By Aliens & Now I'm Trapped In A Rom-Com","url":"https://forbiddenplanet.com/444183-cosmic-chaos-book-1-i-got-abducted-by-aliens-now-im-trapped-in-a-rom-com/","category":"Books > Humour","gtin13":"9780593818633","mpn":"","offers":{"availability":"https://schema.org/InStock","price":12.97,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780593818633","releaseDate":"2025-02-17","reviews":[],"sku":"6733612","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Crescent City: Book 3: House Of Flame & Shadow (Hardcover) £19.00 RRP£22.00Fantasy {"description":"The first 1000 people to pre-order this amazing book will also receive an additional Ruhn &amp; Lidia bonus chapter booklet EXCLUSIVE to Forbidden Planet customers!\nThe stunning third book in the sexy, action-packed Crescent City series, following the global bestsellers House of Earth and Blood and House of Sky and Breath.\nBryce Quinlan never expected to see a world other than Midgard, but now that she has, all she wants is to get back. Everything she loves is in Midgard: her family, her friends, her mate. Stranded in a strange new world, she’s going to need all her wits about her to get home again. And that’s no easy feat when she has no idea who to trust.\nHunt Athalar has found himself in some deep holes in his life, but this one might be the deepest of all. After a few brief months with everything he ever wanted, he’s in the Asteri’s dungeons again, stripped of his freedom and without a clue as to Bryce’s fate. He’s desperate to help her, but until he can escape the Asteri’s leash, his hands are quite literally tied.\nIn this sexy, breathtaking sequel to the #1 bestsellers House of Earth and Blood and House of Sky and Breath, Sarah J. Maas’s Crescent City series reaches new heights as Bryce and Hunt’s world is brought to the brink of collapse-with its future resting on their shoulders.","image":"https://media.forbiddenplanet.com/products/41/dd/657e8dae41a2bd1742b20de290a9720156f2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/406032-crescent-city-book-3-house-of-flame-shadow-hardcover/","name":" Crescent City: Book 3: House Of Flame & Shadow (Hardcover)","url":"https://forbiddenplanet.com/406032-crescent-city-book-3-house-of-flame-shadow-hardcover/","category":"Books > Fantasy","gtin13":"9781408884447","mpn":"","offers":{"availability":"https://schema.org/InStock","price":19.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781408884447","releaseDate":"2024-01-30","reviews":[],"sku":"6264789","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Never After: Hexed (Signed Bookplate Edition) £8.99 RRP£9.99Fantasy {"description":"A dark contemporary romance from viral BookTok and USA Today bestselling author Emily McIntire, featuring reimagined characters from popular fairy tales and other stories.\nHe’s the prince of La Cosa Nostra. She’s the witch who steals his heart.\nVenesa Andersen has never been good. She wasn’t good enough for her parents, and she isn’t good enough for the gangster uncle who took her in after they died. But she’s cunning. Beautiful. Dutiful to her uncle’s demands. And she doesn’t have time for a moral compass, anyway. When her runaway cousin returns to their coastal southern town, she brings a man with her…and Venesa soon realises he’s the only one who’s ever seen her for her.\nThere’s just one problem: she can never have him.\nEnzo “Loverboy” Marino is a wealthy businessman by day and prince of the underworld by night. Underboss to a notorious mafia syndicate, he answers to no one except his father: the strongest don in the northeast. When he’s tasked with marriage, Enzo doesn’t think twice.\nUntil he meets his fiancée’s cousin.\nVenesa is everything he never knew he wanted, bewitching him with her sultry voice and supple curves. But Enzo learned long ago that for a man like him, life is better without the things you want. When plans unravel and temptation sings its siren song, they’ll both have to choose what’s more important: duty to their families or a forbidden love that was never supposed to be.\nHexed joins the Never After series as a dark and sexy reimagining of a classic tale, twisting it into an enticing new shape for mature readers.\nTropes\nFractured Fairy Tale\nForbidden Love\nMafia Romance\nDark Romance\nSpicy Romance\nThe Never After Series:\nHooked\nScarred\nWretched\nTwisted\nCrossed\nHexed","image":"https://media.forbiddenplanet.com/products/d7/ab/180cf903b9c567ce1a197b599fa6206881db.jpg","mainEntityOfPage":"https://forbiddenplanet.com/441153-never-after-hexed-signed-bookplate-edition/","name":"Never After: Hexed (Signed Bookplate Edition)","url":"https://forbiddenplanet.com/441153-never-after-hexed-signed-bookplate-edition/","category":"Books > Fantasy","gtin13":"9781728297408","mpn":"","offers":{"availability":"https://schema.org/InStock","price":8.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781728297408","releaseDate":"2024-11-26","reviews":[],"sku":"6746612","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Ice Planet Barbarians: Book 4: Barbarian Mine (Signed Bookplate Edition) £10.97 RRP£12.99Fantasy {"description":"Harlow receives the shock of her life when she wakes up to see Rukh, a stranger who has clearly been on his own his whole life, but she soon learns that there is much more to this gruff, barbaric alien than the savage he appears to be. \nThe ice planet has given me a second lease on life, so I’m thrilled to be here. Sure, there are no cheeseburgers, but I’m healthy and ready to be a productive member of the small tribe. What I didn’t anticipate? That there’d be a savage stranger waiting nearby, watching me. And when he takes me captive, the unthinkable happens… I resonate to him. \nResonance means mating, and children… but I don’t know if this guy’s ever been around anyone before. He’s truly a barbarian in all ways, and he has claimed me as his own. So why is it that I crave his touch and hunger for more?","image":"https://media.forbiddenplanet.com/products/98/e1/9aa51778cf7d5ee261114f620b7577cf845b.jpg","mainEntityOfPage":"https://forbiddenplanet.com/363930-ice-planet-barbarians-book-4-barbarian-mine-signed-bookplate-edition/","name":"Ice Planet Barbarians: Book 4: Barbarian