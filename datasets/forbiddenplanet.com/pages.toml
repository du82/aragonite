full_description = "The Chronicles Of Castellane: Book 2: The Ragpicker King (Forbidden Planet Exclusive Digitally Signed Edition Hardcover)Pre-OrderSignedExclusive Signed by: Cassandra Clare Author: Cassandra Clare Published by: Tor £19.00 RRP£22.00Add to BasketThis item is available to pre-order.Due for release: 4 Mar 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct Description‘This is fantasy at its finest’ Leigh Bardugo, No. 1 New York Times bestselling author.The Ragpicker King is the epic sequel to the Sunday Times bestselling Sword Catcher by Cassandra Clare.His life is an illusion. Her lie is a gamble. Can two outliers save a kingdom?The royal court is in turmoil following a massacre. Kel, Prince Conor’s body-double, is hunting for traitors. And the notorious Ragpicker King, ruler of the dazzling city of Castellane’s criminal underworld, holds the only clues. But they lead to a dark conspiracy to destroy the royal family, headed by the man due to marry the woman Kel loves.Lin will be judged after claiming to be the legendary Goddess Reborn and wielder of powerful magic - now her people’s charismatic leader is ready to test her powers. Failure will mean exile, and only further dangerous deception can save her now.As the simmering tension in Castellane reaches fever pitch, Prince Conor demands that Lin heal his father’s madness. But the King is tormented by an ancient magic and Lin cannot deny its allure, any more than she can deny her growing passion for the prince.Lin and Kel must decide who they can trust