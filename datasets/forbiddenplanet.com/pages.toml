title = "The First Druids Of Shannara: Book 1: Galaphile (Hardcover) by Terry Brooks published by Random House @ ForbiddenPlanet.com - UK and Worldwide Cult Entertainment Megastore"
description = "New York Times bestselling author Terry Brooks makes his triumphant return to the world of Shannara, delving deep into the origin story of the druid order and its enigmatic creator that will change the face of the Four Lands forever. One of the most iconic structures in the Four Lands is Paranor, the fortress home of the Druid Order. Legend..."
full_description = "The First Druids Of Shannara: Book 1: Galaphile (Hardcover)Pre-OrderAuthor: Terry Brooks Published by: Random House £15.97 RRP£21.99Add to BasketThis item is available to pre-order.Due for release: 10 Mar 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionNew York Times bestselling author Terry Brooks makes his triumphant return to the world of Shannara, delving deep into the origin story of the druid order and its enigmatic creator that will change the face of the Four Lands forever.One of the most iconic structures in the Four Lands is Paranor, the fortress home of the Druid Order. Legend holds that it was erected by an Elven leader known as Galaphile Joss. But who was this Galaphile, and how and why did he choose to establish this centre of magic and learning?Within these pages we meet the real Galaphile, following him from a friendless teenage orphan stranded in the Human world to a powerful adult and master mage, studying under the infamous recluse, Cogline. We learn of the forces that shaped him, those he loved, and those he lost; those who aided him, and those who stood against him.Throughout it all, Galaphile’s goal is a noble one: to bring order to a chaotic world, and to make life better for those trying to survive it. To this end, he commences building the citadel which will one day be known as Paranor with the aid of the King of the Silver River.But there is one other who seeks dominion over the Four Lands and for far less virtuous ends. For this foe has been corrupted by an ancient evil, one that will not only reach out and touch Galaphile’s nearest and dearest, but also echo down through the centuries, sowing the seeds for some of the darkest times the Four Lands will ever face.Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreAuthor Terry BrooksGenresFantasyAction & AdventurePromotionFeatured Books 28/02/2025PublisherRandom HouseTypeBooksBindingHardbackCat. No.6817350EAN978059312980753000ISBN9780593129807"
