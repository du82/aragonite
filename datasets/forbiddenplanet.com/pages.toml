full_description = '''3216 results in Books ▸ Fantasy Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >BookSignedLimited EditionExclusive The Bone Season: Book 5: The Dark Mirror (Forbidden Planet Exclusive Signed Special Edition Hardcover) £22.00Fantasy {"description":"This signed Forbidden Planet special edition features an exclusive floral sprayed edge design, and is limited to only 1000 copies.\nFrom New York Times bestselling author of The Priory of the Orange Tree - the soaring fifth novel in the bestselling Bone Season series.\n‘A fabulous, epic fantasy thriller … Lavish, ebullient, escapist’ The Times.\n‘Samantha Shannon is a master storyteller and wordsmith’ Katherine Webber .\n‘Blazing a trail for a new generation of feminist fantasy authors’ Grazia.\nEverything is about to change. \nPaige Mahoney is outside the Republic of Scion for the first time in more than a decade - but she has no idea how she got to the free world. Half a year has been wiped from her memory. \nAs she makes her way back to the revolution, her journey takes her to Venice, where she learns a dangerous secret - one that could change the face of the war between humans and immortals. Before she can return to London, she must help the Domino Programme unravel the sinister Operation Ventriloquist.\nAnd it soon becomes clear that the one person who could recover her memories - Arcturus Mesarthim - might also hold the key to saving Italy. \nLyrical, touching and action-packed, The Dark Mirror drives the bestselling Bone Season series forward, showing Samantha Shannon at the height of her powers.","image":"https://media.forbiddenplanet.com/products/e2/6f/6f9fb7881fb413f71f379968afbb28185158.png","mainEntityOfPage":"https://forbiddenplanet.com/444049-the-bone-season-book-5-the-dark-mirror-forbidden-planet-exclusive-signed-special-edition-hardcover/","name":"The Bone Season: Book 5: The Dark Mirror (Forbidden Planet Exclusive Signed Special Edition Hardcover)","url":"https://forbiddenplanet.com/444049-the-bone-season-book-5-the-dark-mirror-forbidden-planet-exclusive-signed-special-edition-hardcover/","category":"Books > Fantasy","gtin13":"9781408879443","mpn":"","offers":{"availability":"https://schema.org/InStock","price":22.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781408879443","releaseDate":"2025-02-24","reviews":[],"sku":"6775544","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSaleSignedExclusive Empire Of The Vampire: Book 2: Empire Of The Damned (Forbidden Planet Signed Special Edition Hardcover) £17.00 was £23.00 RRP£23.00Fantasy {"description":"This FORBIDDEN PLANET EXCLUSIVE EDITION features:\n\n\nExclusive blue variant cover\n\n\nBespoke art card\n\n\nSigned by the author\n\n\nThe highly anticipated sequel to the SUNDAY TIMES bestselling EMPIRE OF THE VAMPIRE\n‘Bloody brilliant’\nV.E. Schwab\n‘A ripping read’\nJoe Abercrombie\nGabriel de León has saved the Holy Grail from death, but his chance to end the endless night is lost.\nAfter turning his back on his silversaint brothers once and for all, Gabriel and the Grail set out to learn the truth of how Daysdeath might finally be undone.\nBut the last silversaint faces peril, within and without. Pursued by children of the Forever King, drawn into wars and webs centuries in the weaving, and ravaged by his own rising bloodlust, Gabriel may not survive to see the truth of the Grail revealed.\nA truth that may be too awful for any to imagine.","image":"https://media.forbiddenplanet.com/products/a3/e4/6b75245f465409e837c1308298e3ae96256b.png","mainEntityOfPage":"https://forbiddenplanet.com/405450-empire-of-the-vampire-book-2-empire-of-the-damned-forbidden-planet-signed-special-edition-hardcover/","name":"Empire Of The Vampire: Book 2: Empire Of The Damned (Forbidden Planet Signed Special Edition Hardcover)","url":"https://forbiddenplanet.com/405450-empire-of-the-vampire-book-2-empire-of-the-damned-forbidden-planet-signed-special-edition-hardcover/","category":"Books > Fantasy","gtin13":"9780008350482","mpn":"","offers":{"availability":"https://schema.org/InStock","price":17.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9780008350482","releaseDate":"2024-02-29","reviews":[],"sku":"6236229","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Minecraft: Gather, Cook, Eat!: An Official Cookbook (Hardcover) £4.99 was £16.99 RRP£24.99Art & Design {"description":"Building can be hungry work. And sometimes, you just need to take a break and enjoy the fruits of your labour, whether that’s a quick baked potato while you’re hunkered down, waiting for a creeper to quit skulking at your door, or creating a celebratory feast for all your friends! Minecraft: \nThe Official Cookbook gives you everything you need to build awesome meals, no matter your skill level.","image":"https://media.forbiddenplanet.com/products/cb/6b/4b285db6ec233c8e3b878aeb1ff11e718aed.jpg","mainEntityOfPage":"https://forbiddenplanet.com/372460-minecraft-gather-cook-eat-an-official-cookbook-hardcover/","name":"Minecraft: Gather, Cook, Eat!: An Official Cookbook (Hardcover)","url":"https://forbiddenplanet.com/372460-minecraft-gather-cook-eat-an-official-cookbook-hardcover/","category":"Books > Art & Design","gtin13":"9781803364926","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803364926","releaseDate":"2023-05-02","reviews":[],"sku":"5866311","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book Good Omens: Tarot Deck & Guidebook (Hardcover) £16.99 RRP£24.99Art & Design {"description":"Fans of Good Omens can predict the future like Agnes Nutter with this official tarot deck.\nFeaturing beautiful illustrations of iconic angels, demons, Witchfinders, Professional Descendants, and many more fan-favourite characters and artifacts from the celestial comedy, this ineffable tarot deck is a must-have for fans of the Amazon Prime Video show.\nContaining both Major and Minor Arcana, the set also comes with a comprehensive guidebook explaining each card’s meaning. Packaged in a sturdy, decorative gift box, this compelling tarot deck is perfect for fans of Neil Gaiman and Terry Pratchett’s devilishly divine world and tarot enthusiasts alike.","image":"https://media.forbiddenplanet.com/products/34/a7/0cb2c06b5d06b437c17587d0e46f4d0af8eb.png","mainEntityOfPage":"https://forbiddenplanet.com/384293-good-omens-tarot-deck-guidebook-hardcover/","name":"Good Omens: Tarot Deck & Guidebook (Hardcover)","url":"https://forbiddenplanet.com/384293-good-omens-tarot-deck-guidebook-hardcover/","category":"Books > Art & Design","gtin13":"9781803367231","mpn":"9781803367231","offers":{"availability":"https://schema.org/InStock","price":16.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803367231","releaseDate":"2023-11-28","reviews":[],"sku":"5997534","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book The Book Of Bill (Hardcover) £22.50 RRP£25.00Audio Books {"description":"Did you miss him? Admit it, you missed him.\nThe demon that terrorised Gravity Falls is back from the great beyond to finally tell his side of the story in The Book of Bill, written by none other than Bill Cipher himself.\nInside, Bill sheds light on his bizarre origins, his sinister effects on human history, the Pines family’s most embarrassing secrets, and the key to overthrowing the world (laid out in a handy step-by-step guide).\nThis chaotic and beautifully illustrated tome contains baffling riddles, uncrackable ciphers, lost Journal 3 pages, ways to cheat death, the meaning of life, and a whole chapter on Silly Straws. But most importantly, The Book of Bill is deeply, deeply cursed.\nAlex Hirsch, #1 New York Times bestselling author, resuscitates this infamous villain and invites fans to a Bill’s eye view of the Gravity Falls universe. There are many who believe this book is too dangerous for human hands. But if you can’t resist, just know this: Once you make a deal with Bill, it’s not so easily undone… \nBeware: This book travels to dimensions meant for older readers.","image":"https://media.forbiddenplanet.com/products/b8/0e/cb3f2eae92c2f2c61adf6a80ef2fb84cadd2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","name":"The Book Of Bill (Hardcover)","url":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","category":"Books > Audio Books","gtin13":"9781368092203","mpn":"","offers":{"availability":"https://schema.org/InStock","price":22.5,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781368092203","releaseDate":"2024-11-29","reviews":[],"sku":"6465438","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-OrderSigned Wicked Games: Book 1: Phantasma (Signed Edition) £8.99 RRP£9.99Due for release:3 Mar 2025Fantasy {"description":"Welcome to Phantasma. There are only two rules to the game. Stay alive. And don’t fall in love.\nWhen Ophelia’s sister disappears, there is only one way to save her. Ophelia must enter Phantasma, a deadly con