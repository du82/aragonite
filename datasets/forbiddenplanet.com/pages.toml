s needed and fit into my non comicare resealable bags like a glove. Great price. I will be re-ordering again.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2018-09-17T16:55:55.515849+01:00","datePublished":"2018-12-07T10:46:12.305729Z","author":"im..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/72798-comicare-backing-boards-current-size-100-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"2183596","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Comic Supply Comicare: Comic Box: Long Size £5.99 RRP£6.99Reviews★★★★★ (8)Comic Supplies {"description":"Store your comic books in this handy long size comic box!\nBoxes feature double walled bottoms with single-walled box lids. Sturdy enough for stacking. Dimensions are approximately 73 x 21 x 30 cm (L x W x H) including the lid.\nOne box holds approximately 300 comics. ","image":"https://media.forbiddenplanet.com/products/82975_QROuqvM.jpg","mainEntityOfPage":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","name":"Comicare: Comic Box: Long Size","url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","aggregateRating":{"ratingCount":8,"reviewCount":8,"ratingValue":3.5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Comics & Graphic Novels > Comic Supplies","mpn":"SUP000123","offers":{"availability":"https://schema.org/InStock","price":5.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:82975","releaseDate":"2010-08-08","reviews":[{"name":"Good but dont guess at how to put it together","reviewBody":"Firstly I would agree with most other reviewers. This did not travel well and looked a little beaten up by the time it arrived, and the construction is confusing at first, but check how to put it together first so you dont risk bending and crumpling it unnecesarily.\n\nDespite the odd construction and not travelling well, once it is together it is very solid hence the 4 stars.\n\nWorth buying, just put it together properly in the first place:\nhttps://www.youtube.com/watch?v=Au0iOLwilVY\nLid is different but lid isnt the confusing part, pay attention to the main box assembly and you can't go wrong.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-01-07T17:27:52.118841Z","datePublished":"2023-01-23T11:18:33.208895Z","author":"TwoWheeledDaydreams","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Its a box","reviewBody":"The shipping time for this box was actually pretty quick compared to some other orders and the box does as it say on the tin. Hold comics. However initially, I don't know why, I thought this box was twice the length of the small boxes. I was wrong. They're only about a foot longer so take that into consideration. Also, my box did come slightly damaged but I am not all that fussed as it wasn't structural. If you want a chunk of storage with undamaged boxes I would just recommend getting two smaller boxes than one large one imo.","reviewRating":{"ratingValue":3,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2021-01-28T16:05:07.037853Z","datePublished":"2021-03-09T12:09:06.988964Z","author":"Chris","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Good box","reviewBody":"Good value for money and super easy to put together.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2019-10-01T10:06:35.642802+01:00","datePublished":"2019-10-02T14:36:42.958007+01:00","author":"Jessie","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Works as intended","reviewBody":"A nice sturdy box if a bit confusing to assemble. I did have to find a youtube tutorial however It was annoyingly simple afterwards.\r\nCould've been shipped better as it came packed inside an even larger box.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2019-02-02T18:13:25Z","author":"wi..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Do not buy if you have rage issues","reviewBody":"Do not buy this! It is impossible to put together and mine came damaged. Your better off going with a short one and buying multiples, because they are easy to put together.","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2016-11-27T00:33:55.068540Z","datePublished":"2017-03-08T14:24:37.336042Z","author":"Mad at this thing","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Good box","reviewBody":"Now I won't deny this is a good box. It easy to pick up with all my comic books in and its very sturdy but the actual box came to me damaged on the lid and there were no instructions on how to build it so I spent a good half an hour playing with flaps trying to figure out how the thing actually went together, it was very stressful to say the least. \r\n\r\nRegardless I would buy it again.","reviewRating":{"ratingValue":3,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2014-10-17T09:58:19+01:00","author":"Chanelle","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great box","reviewBody":"This box is great but during posting it had a large crease, only complaint.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2013-05-26T09:30:47+01:00","author":"Cooley","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Can a grown man stand on it? Yes he can.","reviewBody":"Pretty hard to put together at first, I was scratching my head for a while and shouting in anger trying to fit the flaps in, but persevere (or just be a better box-builder than I apparently am) and you will be rewarded with one helluva sturdy and smart looking box to store your comics in. I thought my collection was huge, but stored upright in the box and there is a nice sized empty space to fill with more comics!! \r\n\r\nOh, and as the title suggests, it really is sturdy enough to hold my weight!!","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2012-03-26T09:43:24+01:00","author":"Captain Britain","itemReviewed":{"url":"https://forbiddenplanet.com/82975-comicare-comic-box-long-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"2183558","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Comic Supply Comicare: Comic Box: Short Size £3.99 RRP£4.99Reviews★★★★★ (14)Comic Supplies {"description":"These durable, double-walled “oyster white” boxes come in three sizes - perfect for any collector’s needs.\n\n\nBoxes feature double-walled bottoms with single-walled box lids\n\n\nHolds 150 comics\n\n\nDimensions - 36x21x30cm\n\n","image":"https://media.forbiddenplanet.com/products/72795.jpg","mainEntityOfPage":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","name":"Comicare: Comic Box: Short Size","url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","aggregateRating":{"ratingCount":14,"reviewCount":14,"ratingValue":4.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Comics & Graphic Novels > Comic Supplies","mpn":"SUP000124","offers":{"availability":"https://schema.org/InStock","price":3.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:72795","releaseDate":"2010-08-08","reviews":[{"name":"Does the job","reviewBody":"Good price, fits comic in well. Comes flat and it’s easy to pop up.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2020-12-23T21:20:01.231629Z","datePublished":"2020-12-30T09:13:21.574154Z","author":"sa..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"what defines standard - these are too long, wrong description","reviewBody":"these are supposed to be the boxes which hold 150 comics, they are the ones that hold 300, standard is misleading beacuse these are the long bixes, pity i didnt pay attention to the measurements - still ok to store your stuff but completely the wrong size for my storage shelves","reviewRating":{"ratingValue":2,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2020-11-16T12:42:53.282858Z","datePublished":"2020-12-11T15:23:29.686992Z","author":"ki..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Hit and miss but good value","reviewBody":"A real pain to put together as there's no instructions that I can see. However once it's all assembled it does its job well. I've got three stacked on top of each other and they're easy to open and keep sealed. I'd pay more to have dividers but you can make your own.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2019-01-06T00:38:19Z","datePublished":"2019-01-07T11:47:16Z","author":"Omega","itemReviewed":{"url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Good and Bad, try your luck!","reviewBody":"So the first set of these that I ordered a while back were amazing quality and fit together perfectly. However after ordering two more recently I've found the quality to have dropped alot, with the box sections already arriving damaged and bent. When I did put it together there were serious sizing issues meaning about an inch was larger one side. This left it not locking into place well and causing myself to have to manually cut the other side down to size.","reviewRating":{"ratingValue":3,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2018-08-23T16:57:51.541296+01:00","datePublished":"2018-12-07T10:32:46.014516Z","author":"Davidor","itemReviewed":{"url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great Quality Boxes","reviewBody":"• All of my short boxes are in good condition and still provide adequate protection, even after several years of being shipped around.\r\n\r\n• I find the long boxes too unwieldy when full, especially when regularly transporting them around, short boxes are the perfect size.\r\n\r\n• Great for stacking, but I wouldn't go above two boxes high.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2017-05-21T02:16:42.296194+01:00","datePublished":"2017-06-16T16:36:51.921087+01:00","author":"Divine","itemReviewed":{"url":"https://forbiddenplanet.com/72795-comicare-comic-box-short-size/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Perfect","reviewBody":"This came super quick. Like other reviewers said I noticed it didn't come with in instructions but it's super easy to put together, took like 2 minutes. It's really sturdy. And it was the cheapest one '''
