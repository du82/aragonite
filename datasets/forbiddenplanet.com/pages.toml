full_description = "Model Home (Hardcover)Author: Rivers Solomon Published by: Merky Books £15.99 RRP£18.99Add to BasketOnce dispatched, estimated delivery within the United Kingdom is 3 to 5 working daysStore prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct Description‘Intense, original, and wonderfully unpredictable… Model Home is a story of a haunted house and haunted people; profound family secrets lie at the heart of this book as well as, surprisingly, blessedly, meaningful touches of love and hope. Rivers Solomon is an astonishingly talented writer.’ Victor LaValle, author of Lone Women‘A startling reimagination of the haunted-house genre. The twists and turns are carefully drawn, with the tension mounting toward a shocking end… With this exhilarating and unforgettable work, Solomon proves to be a formidable writer.’ KirkusTwo bodies lie in the garden of a sprawling property in Oak Creek Estate, a wealthy gated community in Dallas, Texas.The bodies belong to the parents of Ezri, Eve and Emmanuel, who have long since abandoned the childhood home in which their parents remained all these years. A home that has haunted and hollowed them throughout their lives, in a neighbourhood where they grew up as the only Black family, hoping to survive a place that wanted to claim them, expel them and ruin them all at once.In the wake of their parents’ death, Ezri and their siblings are forced to confront the reasons they left, the nightmares that have held them captive and the possibility that realities exist beyond those that have forged them.Bold and tender, Model Home is powerful meditation on the power of memory, loss and identity.Praise for Sorrowland:“A wonderland of fantastical and frightening, magical and real.” Marlon James“A fantastical, fierce reckoning… Sorrowland is gorgeous.” Roxanne Gay“Dark, magical and incredibly satisfying.” Independent“An exhilarating journey to the outer limits of science fiction.” Guardian“Intense, original and wonderfully unpredicatable.” Victor LaVelleProduct SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreAuthor Rivers SolomonGenresHorrorScience FictionPromotionFeatured Books 28/02/2025PublisherMerky BooksTypeBooksBindingHardbackCat. No.6868031EAN9781529901696 ISBN9781529901696"
