g secrets, and the key to overthrowing the world (laid out in a handy step-by-step guide).\nThis chaotic and beautifully illustrated tome contains baffling riddles, uncrackable ciphers, lost Journal 3 pages, ways to cheat death, the meaning of life, and a whole chapter on Silly Straws. But most importantly, The Book of Bill is deeply, deeply cursed.\nAlex Hirsch, #1 New York Times bestselling author, resuscitates this infamous villain and invites fans to a Bill’s eye view of the Gravity Falls universe. There are many who believe this book is too dangerous for human hands. But if you can’t resist, just know this: Once you make a deal with Bill, it’s not so easily undone… \nBeware: This book travels to dimensions meant for older readers.","image":"https://media.forbiddenplanet.com/products/b8/0e/cb3f2eae92c2f2c61adf6a80ef2fb84cadd2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","name":"The Book Of Bill (Hardcover)","url":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","category":"Books > Audio Books","gtin13":"9781368092203","mpn":"","offers":{"availability":"https://schema.org/InStock","price":22.5,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781368092203","releaseDate":"2024-11-29","reviews":[],"sku":"6465438","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Senseless (Signed Edition Hardcover) £15.99 RRP£19.99Crime & Thrillers {"description":"What do you see…?\nWhen the mutilated body of a young woman is discovered in the desert on the outskirts of Los Angeles, the detective assigned to the case can’t deny the similarities between this murder and one that occurred a year prior.\nMedia outlets are quick to surmise this is the work of a budding serial killer, but Detective Bill Renney is struggling with an altogether different scenario: a secret that keeps him tethered to the husband of the first victim.\nWhat do you hear…?\nMaureen Park, newly engaged to Hollywood producer Greg Dawson, finds her engagement party crashed by the arrival of Landon, Greg’s son. A darkly unsettling young man, Landon invades Maureen’s new existence, and the longer he stays, the more convinced she becomes that he may have something to do with the recent murder in the high desert.\nWhat do you feel…?\nToby Kampen, the self-proclaimed Human Fly, begins an obsession over a woman who is unlike anyone he has ever met. A woman with rattlesnake teeth and a penchant for biting. A woman who has trapped him her spell. A woman who may or may not be completely human. \nIn Ronald Malfi’s brand-new thriller, these three storylines converge to create a tapestry of deceit, distrust, and unapologetic horror.&nbsp; A brand-new novel of dark suspense set in the City of Angels, as only “horror’s Faulkner” can tell it.","image":"https://media.forbiddenplanet.com/products/54/17/fd6a91e4ba8f3c355cfba78e3f79275f57e8.jpg","mainEntityOfPage":"https://forbiddenplanet.com/451434-senseless-signed-edition-hardcover/","name":"Senseless (Signed Edition Hardcover)","url":"https://forbiddenplanet.com/451434-senseless-signed-edition-hardcover/","category":"Books > Crime & Thrillers","gtin13":"9781835414590","mpn":"","offers":{"availability":"https://schema.org/InStock","price":15.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835414590","releaseDate":"2025-02-17","reviews":[],"sku":"6870539","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-Order Dead Space: Martyr £6.99 RRP£9.99Due for release:22 Apr 2025Gaming Fiction {"description":"A prequel to Dead Space, the novel focuses on the birth of Unitology. In this novel set centuries before the events of the main series, geophysicist Michael Altman investigates an alien artefact called The Black Marker.\nWe have seen the future.\nA universe cursed with life after death.\nIt all started deep beneath the Yucatan peninsula, where an archaeological discovery took us into a new age, bringing us face-to-face with our origins and destiny.\nMichael Altman had a theory that no one would hear.\nIt cursed our world for centuries to come.\nThis, at last, is his story.","image":"https://media.forbiddenplanet.com/products/68/ce/2e2c25d0e01cecc8987e5aaf2a84dd8b25c6.jpg","mainEntityOfPage":"https://forbiddenplanet.com/444004-dead-space-martyr/","name":"Dead Space: Martyr ","url":"https://forbiddenplanet.com/444004-dead-space-martyr/","category":"Books > Gaming Fiction","gtin13":"9781835414347","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":6.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835414347","releaseDate":"2025-04-22","reviews":[],"sku":"6749538","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Morbius: The Living Vampire: Blood Ties (Hardcover) £2.99 was £12.23 RRP£16.99Action & Adventure {"description":"Seeking to cure his rare blood disorder, Dr. Michael Morbius instead cursed himself with an insatiable lust for human blood. While trying to cure his horrific condition, he has become allied with Amanda Saint, whose sister Catherine is one of the leaders of the Demon-Fire Cult.\nAlso known as Poison Lark, Catherine Saint has two goals above all else. She seeks to bring Satan to Earth, thus unleashing the powers of Hell, and to kill Morbius and Amanda.\nWhen Morbius and Amanda follow the cult’s trail to New York City, they run afoul of an underground fight club that uses monsters as their pawns in the arena. The club captures Morbius and he becomes the star attraction, forced to kill or be killed.","image":"https://media.forbiddenplanet.com/products/a2/ea/ca7a6a7293efc55fa5b83697b4d4920559e9.jpg","mainEntityOfPage":"https://forbiddenplanet.com/298113-morbius-the-living-vampire-blood-ties-hardcover/","name":"Morbius: The Living Vampire: Blood Ties (Hardcover)","url":"https://forbiddenplanet.com/298113-morbius-the-living-vampire-blood-ties-hardcover/","category":"Books > Action & Adventure","gtin13":"9781789094855","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789094855","releaseDate":"2021-03-09","reviews":[],"sku":"4837152","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Army Of The Dead: A Film By Zack Snyder: The Making Of The Film (Hardcover) £2.99 was £20.99 RRP£29.99Film, TV, & Music {"description":"Army of the Dead: The Making of the Film is the official companion to Zack Snyder s latest zombie film.\nFrom the director of Dawn of the Dead, Watchmen, and Man of Steel, comes Army of the Dead, Zack Snyder s eagerly awaited return to the zombie scene, staring Dave Bautista. Following a zombie outbreak in Las Vegas, a group of mercenaries take the ultimate gamble, venturing into the quarantine zone to pull off the greatest heist ever attempted.\nArmy of the Dead: The Making of the Film takes readers behind the scenes of this much-anticipated film and reveals the locations, characters, and zombies. The book is full to the brim with exclusive on-set photography, costume designs, storyboards by Zack Snyder, and more, and accompanied by cast and crew interviews.","image":"https://media.forbiddenplanet.com/products/06/2a/38863983a96142795ace1923ef120650f9d0.jpg","mainEntityOfPage":"https://forbiddenplanet.com/316848-army-of-the-dead-a-film-by-zack-snyder-the-making-of-the-film-hardcover/","name":"Army Of The Dead: A Film By Zack Snyder: The Making Of The Film (Hardcover)","url":"https://forbiddenplanet.com/316848-army-of-the-dead-a-film-by-zack-snyder-the-making-of-the-film-hardcover/","category":"Books > Film, TV, & Music","gtin13":"9781789095425","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789095425","releaseDate":"2021-06-01","reviews":[],"sku":"4185543","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookPre-Order Snake-Eater (Hardcover) £7.99 RRP£11.99Due for release:November 2025Horror {"description":"In an isolated desert town, a young woman seeking a fresh start is confronted by ancient gods, malevolent supernatural forces and eccentric neighbours. A witty horror-tinged fantasy, perfect for fans of Silvia Moreno-Garcia, Chuck Tingle and Rachel Harrison.\nWhen Selena travels to the remote desert town of Quartz Creek in search of her estranged Aunt Amelia, she is desperate and short of options. Fleeing an unhappy marriage, she has exactly twenty-seven dollars to her name, and her only friend in the world is her dog, Copper.\nOn arrival, Selena learns Amelia is dead. But the inhabitants of Quartz Creek are only too happy to have a new resident. Out of money and ideas, Selena sees no harm staying in her aunt’s lovely house for a few weeks, tending to her garden and enjoying the strange, desolate beauty of the desert. The people are odd, but friendly, and eager to help Selena settle into her new home.\nBut Quartz Creek’s inhabitants share their town with others, old gods and spirits whose claim to the land long predates their human neighbours. Selena finds herself pursued by disturbing apparitions, visitations that come in the night and seem to want something from her.\nAunt Amelia owed a debt. Now her god has come to collect.","image":"https://media.forbiddenplanet.com/products/bf/1c/b1f332134ebdf829872cd89387f0d4472205.jpg","mainEntityOfPage":"https://forbiddenplanet.com/451716-snake-eater-hardcover/","name":"Snake-Eater (Hardcover)","url":"https://forbiddenplanet.com/451716-snake-eater-hardcover/","category":"Books > Horror","gtin13":"9781835410042","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":7.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781835410042","releaseDate":"2025-11-11","reviews":[],"sku":"6872892","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSigned Hungerstone (Signed Special Indie Edition Hardcover) £12.99 RRP£16.99Horror {"description":"This special indie edition is signed, has purple blocked sprayed edges and floral purple foil on black wiblin case board.\nTHE FIERCEST, MOST POWERFUL RETELLING OF 2025: A STORY OF AMBITION, FEMALE OPPRESSION AND UNSTOPPABLE HUNGER . . .\n‘Rich and daring. This is everything I dream of in a novel’ Ava Re'''
