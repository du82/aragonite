full_description = '''78 results in Gaming ▸ RPG Rulebooks Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >RPG RulebookSale Auroboros: Coils Of The Serpent: Worldbook Lawbrand Campaign Setting (Hardcover) £2.99 was £28.00 RRP£40.00Books {"description":"Auroboros: Coils of the Serpent is a campaign setting for 5E by Chris Metzen and Warchief Gaming.\nThe first release in this universe, Worldbook: Lawbrand features the realm of Lawbrand, which is based on the roleplaying campaign that Chris ran with his childhood friends in the 1980s and 19990s, before he headed to work on Blizzard games.\nA 5E-compatible source book featuring dozens of pieces of stunning artwork, over 100 pages of lore, 5 new races, 4 subclasses, new spells, and more, Worldbook: Lawbrand gives you all the tools needed to adventure in this gritty fantasy setting.\nWill you tame this new world, or shatter it?","image":"https://media.forbiddenplanet.com/products/ba/1a/9be81eedd685234774869d0c4a5eaa06078b.jpg","mainEntityOfPage":"https://forbiddenplanet.com/349090-auroboros-coils-of-the-serpent-worldbook-lawbrand-campaign-setting-hardcover/","name":"Auroboros: Coils Of The Serpent: Worldbook Lawbrand Campaign Setting (Hardcover)","url":"https://forbiddenplanet.com/349090-auroboros-coils-of-the-serpent-worldbook-lawbrand-campaign-setting-hardcover/","category":"Books","gtin13":"9781803362373","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781803362373","releaseDate":"2022-11-15","reviews":[],"sku":"5525850","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Rulebook Call Of Cthulhu: 7th Edition: Keeper Rulebook (Hardcover) £35.99 RRP£39.99Horror {"description":"The Old Ones ruled the earth aeons before the rise of man. Traces of their cyclopean cities can still be found on remote islands, buried amid the shifting desert sands, and in the frozen wastes of the polar extremes. \nOriginally they came to this world from the stars. They sleep now, some deep within the earth or beneath the sea. When the stars are right they shall again walk the earth.\nCall of Cthulhu is a tabletop roleplaying game based upon the worlds of H. P. Lovecraft. It is a game of secrets, mysteries, and horror. Playing the role of steadfast investigators, you travel to strange and dangerous places, uncover foul plots, and stand against the terrors of the Cthulhu Mythos. \nYou encounter sanity-blasting entities, monsters, and insane cultists. Within strange and forgotten tomes of lore you discover revelations that man was not meant to know. You and your companions may very well decide the fate of the world.\nThis book, the Keeper Rulebook, contains the core rules, background, guidance, spells, and monsters of the game. It is intended for use by the Keeper of Arcane Lore (the Keeper) — that player who will present the adventure to the other players. You must have at least one copy of this book to play Call of Cthulhu. \nThe other players, the Investigators, should have one or more copies of the Investigator Handbook, containing expanded rules for character creation, skills, occupations, equipment, and more.\nCall of Cthulhu, 7th edition, is backwards-compatible with all other available Chaosium titles.","image":"https://media.forbiddenplanet.com/products/200359.jpg","mainEntityOfPage":"https://forbiddenplanet.com/200359-call-of-cthulhu-7th-edition-keeper-rulebook-hardcover/","name":"Call Of Cthulhu: 7th Edition: Keeper Rulebook (Hardcover)","url":"https://forbiddenplanet.com/200359-call-of-cthulhu-7th-edition-keeper-rulebook-hardcover/","category":"Books > Horror","gtin13":"9781568824307","mpn":"","offers":{"availability":"https://schema.org/InStock","price":35.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781568824307","releaseDate":"2024-02-16","reviews":[],"sku":"3646281","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Rulebook The Game Master's Book Of Villains, Minions & Their Tactics (Hardcover) £16.99 RRP£21.99Fantasy {"description":"Make your PCs sweat with villains and minions designed to challenge them as never before!\n\n\nNew deluxe edition of Masters, Minions and Tactics from the award-winning fantasy art studio Jetpack7\n\n\nIncludes more than two dozen deadly BBEGs, including 5 new villains exclusive to this edition\n\n\nVillains for low level and high level parties, plus tactics for more than 75 different minions and Big Bads\n\n\nCompletely re-edited and redesigned, with exclusive guidelines for creating your own original villains and minions, as well as three exciting one-shots adventures!\n\n\nA game master’s biggest challenge can be prep time. With busy lives in mind, this book provides new and exciting content to help GMs save hours of time preparing for a game.\nInside, readers will find twenty-five “Big Bosses,” along with insights into how they use their minions strategically in order to decimate any heroic threat that might cross their paths.\nThe Game Master’s Book of Villains, Minions and Their Tactics provides tips and strategies that readers can use to “drag and drop” a BBEG into a new or existing game, with full colour illustrations, lore, stats, combat tactics, and special abilities for each exciting entry.\nYou’ll also find detailed tactics and combat strategies for more than 75 minions and bosses found throughout the 5E game.\nIn addition to providing three exciting one-shot adventures, the book also shows you how to create your own original villains, minions and monsters the best of the worst your game has to offer.","image":"https://media.forbiddenplanet.com/products/a5/16/b1a17c8970ba028490b875eda7a9deced011.jpg","mainEntityOfPage":"https://forbiddenplanet.com/399172-the-game-masters-book-of-villains-minions-their-tactics-hardcover/","name":"The Game Master's Book Of Villains, Minions & Their Tactics (Hardcover)","url":"https://forbiddenplanet.com/399172-the-game-masters-book-of-villains-minions-their-tactics-hardcover/","category":"Books > Fantasy","gtin13":"9781956403411","mpn":"","offers":{"availability":"https://schema.org/InStock","price":16.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781956403411","releaseDate":"2023-12-29","reviews":[],"sku":"6156596","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Book So You Want To Be A Game Master £13.99 RRP£18.99Art & Design {"description":"Become the Ultimate Game Master\nThanks to tabletop roleplay, millions of fans are creating unforgettable collaborative stories. No matter what roleplaying game you want to play, this book is the key to unlocking endless adventure!\nAward-winning game designer Justin Alexander has created an incredible compendium of advice and maps, perfect for any aspiring Game Master. This book is packed with the strategies you need to create amazing dungeons, battles, roleplay encounters, and more.\nFull of practical, hands-on advice and sample maps, just reading the first chapter of this book will have you ready to run a game in less than an hour. From there, Justin teaches you all the skills and techniques you need to explore dungeons, solve mysteries, steal priceless artefacts, unravel strange conspiracies, and venture forth on epic journeys!\nNo matter what game you’re playing, this book is the key to unlocking the limitless realms of your imagination.","image":"https://media.forbiddenplanet.com/products/35/18/1fa426402dafb84260b05f0390788e1fad4c.jpg","mainEntityOfPage":"https://forbiddenplanet.com/401057-so-you-want-to-be-a-game-master/","name":"So You Want To Be A Game Master","url":"https://forbiddenplanet.com/401057-so-you-want-to-be-a-game-master/","category":"Books > Art & Design","gtin13":"9781645679158","mpn":"","offers":{"availability":"https://schema.org/InStock","price":13.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781645679158","releaseDate":"2024-01-04","reviews":[],"sku":"6194888","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG Rulebook Dungeons & Dragons: Character Sheets: 2024 £14.99Accessories {"description":"Inside the pockets of this lavishly illustrated folder are 50 double-sided character sheets for use in any fifth edition Dungeons &amp; Dragons adventure. Each character sheet provides plenty of room to keep track of everything that makes your D&amp;D character unique. Stock up for the next 50 years of your D&amp;D adventures today.\nContents:\n50x Double-sided Character Sheets\n1x Lavish Illustrated Folder","image":"https://media.forbiddenplanet.com/products/5d/54/20d3e3617170e1c2873081c1e2be195932bc.png","mainEntityOfPage":"https://forbiddenplanet.com/430573-dungeons-dragons-character-sheets-2024/","name":"Dungeons & Dragons: Character Sheets: 2024","url":"https://forbiddenplanet.com/430573-dungeons-dragons-character-sheets-2024/","category":"Gaming > Accessories","mpn":"WTCD38980000","offers":{"availability":"https://schema.org/InStock","price":14.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430573","releaseDate":"2024-09-20","reviews":[],"sku":"6559885","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG RulebookPre-Order Tales Of The Valiant: Monster Vault: Pocket Edition £21.99Due for release:31 Mar 2025Action & Adventure {"description":"Paperback Pocket Edition!\nThe Monster Vault crawls with over 400 hero-makes - claws out. All the classic monsters you know and many new surprises lurk inside!\nSpring new threats on players like ambush hags and sporeborn.\nBring the corrupting Void to your table with star crows and the mighty void dragon.\nStay in the action with streamlined stat blocks for faster play\nKeep players on their toes with the new Doom mechanic!\nPlus, get thorough advice and details on creating encounters, customising monsters, and beefing up challenges tailored to your world.","image":"https://media.forbiddenplanet.com/products/80/16/2f7bd43bb4d09ea88a31200f71944e39ba88.png","mainEntityOfPage":"https://forbiddenplanet.com/448353-tales-of-the-valiant-monster-vault-pocket-edition/","name":"Tales Of The Valiant: Monster Vault: Pocket Edition","url":"https://forbiddenplanet.com/448353-tales-of-the-valiant-monster-vault-pocket-edition/","category":"Books > Action & Adventure","mpn":"KOB6012","offers":{"availability":"https://schema.org/PreOrder","price":21.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:448353","releaseDate":"2025-03-31","reviews":[],"sku":"6819699","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}RPG RulebookPre-Order Final Fantasy XIV: TTRPG Standard Rulebook (Hardcover) £54.99Due for release:14 Mar 2025Fantasy {"description":"Discover a realm of adventure reborn!\nThe Final Fantasy XIV Tabletop Roleplaying Game is a gateway into the magical world of Final Fantasy XIV through which you and your friends can embark on exciting and memorable adventures. In this game, one player will act as your gamemaster; the arbiter and lead storyteller, while the rest of your group will play as adventurers.\nTogether you will confront powerful foes, interact with a diverse cast of characters, and roll dice to create a story all your own. Keep in mind that this game is not about winning or losing. If you have a good time, everyone wins!\nThe Final Fantasy XIV TTRPG Standard Rulebook contains all the core rules you will need to create your own adventurer and play the game.\nThis product is English version and does not support other languages.\nStandard Rulebook Contents\n• Eorzea Guide:\nA wide array of fascinating information about the realm of Eorzea can be found within the pages of the Standard Rulebook, making it a fantastic resource for players and GMs alike.\n• Character Creation Rules:\nIn the Final Fantasy XIV TTRPG, characters are created by combining a customisable profile that describes who an adventurer is with predetermined job information that determines what they can do. The Standard Rulebook contains information on a total of five different levels for each playable job: Lv. 30, Lv. 40, Lv. 50, Lv. 55, and Lv. 60.\n• Playable Jobs x13:\nEvery job from both A Realm Reborn and Heavensward is included, giving players a wide range of options when creating their adventurer.\n• Enhanced Gameplay:\nThe Standard Rulebook builds upon the Starter Set, adding a number of new rules that enhance gameplay and provide fun ways to spice up your game. Items, shopping, augmentation, personal quests, and more all help to make your adventures more exciting than ever before.\n• Original Scenarios x3:\nThe Standard Rulebook contains three official premade scenarios: one for Lv. 30 adventurers, one for Lv. 40 adventurers, and one for Lv. 50 adventurers. Each one provides all the information GMs will need to run them from start to finish. \nAges: 14+\nPlayers: 3 - 5 (Recommended for 5 Players)\nPlay Time: 120+ minutes ","image":"https://media.forbiddenplanet.com/products/29/ae/0004c969e503cd3726e6ce6c7532fe336030.png","mainEntityOfPage":"https://forbiddenplanet.com/442335-final-fantasy-xiv-ttrpg-standard-rulebook-hardcover/","name":"Final Fantasy XIV: TTRPG Standard Rulebook (Hardcover)","url":"https://forbiddenplanet.com/442335-final-fantasy-xiv-ttrpg-standard-rulebook-hardcover/","category":"Books > Fantasy","mpn":"SQUXFF14ZZ570","offers":{"availability":"https://schema.org/PreOrder","price":54.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:442335","releaseDate":"2025-03-14","reviews":[],"sku":"6656911","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Graphic NovelSale Marvel Multiverse: Role-Playing Game: Cataclysm Of Kang (Hardcover) £19.99 was £22.99 RRP£44.99Graphic Novels {"description":"Kang the Conqueror crosses the Multiverse to find the greatest weapon in any reality, and only your Super Heroes can stop him!\nWritten by d616 System co-creator and New York Times Best Seller Mat'''
