s://schema.org","@type":"Offer"},"productID":"id:372144","releaseDate":"2022-11-28","reviews":[],"itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}T-ShirtLimited EditionExclusivePrint on Demand Doctor Who: The 60th Anniversary Diamond Collection: Quote Sweatshirt: Wanderers In The Fourth Dimension £34.99Hoodies & Jackets {"description":"“Have you ever thought what it’s like to be wanderers in the fourth dimension?”\nThe First Doctor introduces himself, his granddaughter Susan and their impossible TARDIS with this iconic quote lifted from Doctor Who’s very fist episode “An Unearthly Child”.\nCelebrating the First Doctor, as played by William Hartnell, during Doctor Who’s 60th anniversary.\nIntroducing Doctor Who: The Diamond Collection: a celebration of 60 years of Doctor Who. An impressive array of 100 pieces, each strictly limited edition. Look out for additional items like mugs and coasters for some designs, too.\nLook out for other First, Second and Third Doctor items available now - with merchandise for the Fourth Doctor onwards announced monthly from November 2022.\nProduced on a 100% cotton Gildan sweatshirt. Available for a limited time only.","image":"https://media.forbiddenplanet.com/products/e9/cb/047113004c90890d640a841751e4d4698e5c.png","mainEntityOfPage":"https://forbiddenplanet.com/371666-doctor-who-the-60th-anniversary-diamond-collection-quote-sweatshirt-wanderers-in-the-fourth-dimension/","name":"Doctor Who: The 60th Anniversary Diamond Collection: Quote Sweatshirt: Wanderers In The Fourth Dimension","url":"https://forbiddenplanet.com/371666-doctor-who-the-60th-anniversary-diamond-collection-quote-sweatshirt-wanderers-in-the-fourth-dimension/","category":"Clothing & Accessories > Hoodies & Jackets","mpn":"","offers":{"availability":"https://schema.org/BackOrder","price":34.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:371666","releaseDate":"2022-11-07","reviews":[],"itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}T-ShirtLimited EditionExclusivePrint on Demand Doctor Who: The 60th Anniversary Diamond Collection: Quote Sweatshirt: One Day I Shall Come Back £34.99Hoodies & Jackets {"description":"“One day I shall come back…”\nThe First Doctor bids an emotional goodbye to his granddaughter Susan in one of Doctor Who’s most famous quotes, lifted from the closing moments of 1964’s “The Dalek Invasion Of Earth”.\nCelebrating the First Doctor, as played by William Hartnell, during Doctor Who’s 60th anniversary.\nIntroducing Doctor Who: The Diamond Collection: a celebration of 60 years of Doctor Who.\nAn impressive array of 100 pieces, each strictly limited edition. Look out for additional items like mugs and coasters for some designs, too.\nAvailable for a limited time only.","image":"https://media.forbiddenplanet.com/products/30/83/f6b9e9f0f46487a415fe71530916c92e5d50.png","mainEntityOfPage":"https://forbiddenplanet.com/371668-doctor-who-the-60th-anniversary-diamond-collection-quote-sweatshirt-one-day-i-shall-come-back/","name":"Doctor Who: The 60th Anniversary Diamond Collection: Quote Sweatshirt: One Day I Shall Come Back","url":"https://forbiddenplanet.com/371668-doctor-who-the-60th-anniversary-diamond-collection-quote-sweatshirt-one-day-i-shall-come-back/","category":"Clothing & Accessories > Hoodies & Jackets","mpn":"","offers":{"availability":"https://schema.org/BackOrder","price":34.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:371668","releaseDate":"2022-11-07","reviews":[],"itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}T-ShirtExclusivePrint on Demand Doctor Who: 60th Anniversary Diamond Collection: Sweatshirt: Every Master Story Ever! £22.99Hoodies & Jackets {"description":