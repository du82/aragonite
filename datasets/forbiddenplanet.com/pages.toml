full_description = '''7 results in Toys & Collectibles ▸ Role Play Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Role Play ToyExclusive Doctor Who: The Fourteenth Doctor's Sonic Screwdriver (Exclusive Gold Metallised Edition) £29.99Reviews★★★★★ (2)Role Play {"description":"Exclusive Gold&nbsp;Electro-plated&nbsp;Edition&nbsp;of&nbsp;the iconic Fourteenth Doctor’s&nbsp;sonic screwdriver.\nThis toy version of this iteration of the sonic screwdriver&nbsp;features&nbsp;an all-gold finish, with multiple light and sound FXs, plus an extending and opening emitter. Slide the control button upwards along the main body to open and close and press and hold for light and sounds.&nbsp;\nThis sonic comes beautifully presented in anniversary style\npackaging and is the perfect addition to any fans collection.\nAge: 5+\nBattery Requirements: Requires 3 x 1.5V A76/AG13/LR44 Button Cell Batteries.\n(Demonstration Batteries Included).","image":"https://media.forbiddenplanet.com/products/77/55/b71d8eae357f994c3238239432607284ae2a.png","mainEntityOfPage":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","name":"Doctor Who: The Fourteenth Doctor's Sonic Screwdriver (Exclusive Gold Metallised Edition)","url":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","aggregateRating":{"ratingCount":2,"reviewCount":2,"ratingValue":3.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Toys & Collectibles > Role Play","mpn":"08256","offers":{"availability":"https://schema.org/InStock","price":29.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:423629","releaseDate":"2024-07-01","reviews":[{"name":"14th Doctor Sonic Screwdriver - Forbidden Planet Exclusive","reviewBody":"I have just bought the 14th Doctor Screwdriver in matt gold that comes with the extra colours and sounds that the Online Exclusive had. The one I got looks great and slides perfectly not like the retail version that was a bit loose, this one you have to slide it forward with little force. But i was happy to find the extra button when you take off the cap to get at the battery compartment. I was able to try out the extra settings, it will take some practice to get them all to work, but I am very happy with what I purchased. I highly recommend this sonic screwdriver, don't be put of by the fact it is in matt gold. I'm just happy to have it with the extra features full stop.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-07-16T13:31:56.209956+01:00","datePublished":"2024-12-11T12:39:00.681906Z","author":"Andrew 52","itemReviewed":{"url":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Disappointing","reviewBody":"The \"cracked stone\" section is a sticker and not moulded like previous screwdrivers. its quite rattly and feels cheap. there is an exposed screw on the bottom. The sounds are good with multiple options when you press the button more than once, but overall not what I expected from an \"exclusive\" product.","reviewRating":{"ratingValue":2,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-07-05T18:54:06.128593+01:00","datePublished":"2024-12-31T09:57:46.976012Z","author":"Alex","itemReviewed":{"url":"https://forbiddenplanet.com/423629-doctor-who-the-fourteenth-doctors-sonic-screwdriver-exclusive-gold-metallised-edition/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"6393052","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Soft ToySale My Neighbor Totoro: Nakayoshi Plush Figure: Ootorisama £19.99 was £29.99 RRP£29.99Role Play {"description":"Ootori-Sama, an adorable yellow plush that is giant chickens or ducks that are clients of the Bathhouse in Hayao Miyazaki’s masterpiece: Spirited Away from Studio Ghibli. This plush will take you back into the perilous trip she made to try to save his parents.","image":"https://media.forbiddenplanet.com/products/9a/a0/d16cce3b9f9361baf1a9369439004e30bc5e.png","mainEntityOfPage":"https://forbiddenplanet.com/448153-my-neighbor-totoro-nakayoshi-plush-figure-ootorisama/","name":"My Neighbor Totoro: Nakayoshi Plush Figure: Ootorisama","url":"https://forbiddenplanet.com/448153-my-neighbor-totoro-nakayoshi-plush-figure-ootorisama/","category":"Toys & Collectibles > Role Play","gtin13":"3760226378433","mpn":"S-4216","offers":{"availability":"https://schema.org/InStock","price":19.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:3760226378433","releaseDate":"2024-07-08","reviews":[],"sku":"6481452","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Props & Replica Star Wars: Black Series Electronic Replica Helmet: Biker Scout £104.99Props & Replicas {"description":"Used by the Empire for various missions, scout troopers were lightly armored compared with other Stormtroopers, which allowed them to move more quickly and easily in a range of environments.\nFans can imagine the biggest battles and missions in the Star Wars saga with electronic helmets from The Black Series! (Each sold separately. Subject to availability.)\nWith exquisite features and decoration, this series embodies the quality and realism that Star Wars devotees love. With this Black Series helmet, featuring advanced LED technology, fans can imagine Star Wars action and adventure. \nUsed by the Empire for various missions, scout troopers were lightly armored compared with other Stormtroopers, which allowed them to move more quickly and easily in a range of environments\nFeaturing highly detailed deco, movie-inspired design, adjustable fit, and electronic voice distortion, this full-scale Scout Trooper Black Series helmet is an iconic addition to any Star Wars fan’s collection \nWith the press of a button, fans and collectors can distort their voice to sound like that of a Scout Trooper\nWith this Star Wars Black Series helmet, fans can imagine scenes from the Star Wars Galaxy inspired by the movie\nLook for other Star Wars The Black Series premium roleplay items such as the Force FX Lightsaber collection (Sold separately. Subject to availability.) \nStar Wars products are produced by Hasbro under license from Lucasfilm Ltd. \nHasbro and all related terms are trademarks of Hasbro. \nIncludes: Helmet and instructions. \nAges 14 and up \nx1 1.5v AAA ALKALINE BATTERY REQUIRED. Not included.","image":"https://media.forbiddenplanet.com/products/7a/ae/5d612c97332e11f07b35089248545b42fb77.png","mainEntityOfPage":"https://forbiddenplanet.com/393586-star-wars-black-series-electronic-replica-helmet-biker-scout/","name":"Star Wars: Black Series Electronic Replica Helmet: Biker Scout","url":"https://forbiddenplanet.com/393586-star-wars-black-series-electronic-replica-helmet-biker-scout/","category":"Toys & Collectibles > Props & Replicas","mpn":"F6911","offers":{"availability":"https://schema.org/InStock","price":104.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:393586","releaseDate":"2024-06-20","reviews":[],"sku":"5126217","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Role Play Toy Doctor Who: Sonic Screwdriver Roleplay Toy: The Fifteenth Doctor £24.99Role Play {"description":"The Fifteenth Doctor’s sonic screwdriver boasts a completely revamped shape and design, with its curved edges, making it the most unique rendition of his favourite bit of tech yet.\nThe Character options multi featured toy replica of the sonic includes light and sound effects plus pop out emitter and slide out viewer. \nIn its closed position the sonic can be used with the emitter extended or retracted. It has three basic sounds and light combinations activated by different numbers of button press. You can also extend the viewer/analyser arm and in addition you can also open the sonic completely by rotating the lower section 180 degrees left or right. Opening and closing the sonic activates an on/off sound and all other functions are the same, but in the open position the internal power crystal glows. \nThe sonic comes beautifully presented in Regeneration style packaging and is the perfect piece of memorabilia to add to any Doctor Who collection.\nThe Fifteenth Doctors sonic screwdriver boasts a completely revamped shape and design, with its curved edges, making it the most unique rendition of his favourite bit of tech yet. The Fifteenth Doctors sonic screwdriver boasts a completely revamped shape and design, with its curved edges. In its closed position the sonic can be used with the emitter extended or retracted. It has three basic sounds and light combinations activated by different numbers of button press. \nIt has three basic sounds and light combinations activated by different numbers of button press. You can also extend the viewer/analyser arm and in addition you can also open the sonic completely by rotating the lower section 180 degrees left or right. You can also extend the viewer/analyser arm. \nOpening and closing the sonic activates an on/off sound and all other functions are the same, but in the open position the internal power crystal glows. \nIn the open position the internal power crystal glows.\nThe sonic comes beautifully presented in Regeneration style packaging and is the perfect piece of memorabilia to add to any Doctor Who collection. \nThe sonic comes beautifully presented in Regeneration style packaging.","image":"https://media.forbiddenplanet.com/products/7b/21/9e6d2a55c716e1383bbf690405e61e34c4e0.png","mainEntityOfPage":"https://forbiddenplanet.com/436475-doctor-who-sonic-screwdriver-roleplay-toy-the-fifteenth-doctor/","name":"Doctor Who: Sonic Screwdriver Roleplay Toy: The Fifteenth Doctor","url":"https://forbiddenplanet.com/436475-doctor-who-sonic-screwdriver-roleplay-toy-the-fifteenth-doctor/","category":"Toys & Collectibles > Role Play","mpn":"08246","offers":{"availability":"https://schema.org/InStock","price":24.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:436475","releaseDate":"2024-10-01","reviews":[],"sku":"6417369","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Role Play ToySale A Nightmare On Elm Street: Freddy Krueger Knitted Jumper £9.99 was £39.99 RRP£39.99Role Play {"description":"This Freddy Krueger jumper is a Halloween staple for horror movie fans! This deluxe knitted jumper will instantly creep people out as it reminds them that not even their dreams are safe from the terrifying Freddy Krueger. Perfect for attending a more relaxed Halloween event like a house party, or a movie night with friends. Alternatively, you could load up your look with all the accessories to create a terrifying costume!\nOfficially Licensed.\nPurchase includes jumper only. All other items in images are for illustration purposes only.","image":"https://media.forbiddenplanet.com/products/d4/88/a1bad76cbdf62af6725afa3662125b47e9fa.png","mainEntityOfPage":"https://forbiddenplanet.com/431784-a-nightmare-on-elm-street-freddy-krueger-knitted-jumper/","name":"A Nightmare On Elm Street: Freddy Krueger Knitted Jumper","url":"https://forbiddenplanet.com/431784-a-nightmare-on-elm-street-freddy-krueger-knitted-jumper/","category":"Toys & Collectibles > Role Play","mpn":"","offers":{"availability":"https://schema.org/InStock","price":9.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:431784","releaseDate":"2024-10-04","reviews":[],"itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Role Play ToySale Indiana Jones & The Raiders Of The Lost Ark: Adventure Series Electronic Roleplay Toy: Staff Of Ra Headpiece £17.99 was £49.99 RRP£49.99Role Play {"description":"Fans and collectors can imagine the heart-stopping action and adventure of Indiana Jones with the Indiana Jones Adventure Series! With exquisite features and decoration, this series unearths the quality and realism that Indiana Jones devotees love. \nThe Adventure Series includes figures and roleplay items from the 40-plus-year legacy of the adventures of Indiana Jones. (Each sold separately. Subject to availability.) This Adventure Series Staff of Ra Headpiece electronic collectible roleplay talisman is designed to look like the fabled medallion featured in Indiana Jones and the Raiders of the Lost Ark. The removable headpiece, featuring a premium metallic look and feel, is great for on-the-go Indiana Jones cosplay and makes a great addition to any Indiana Jones costume. Makes a great Indiana Jones gift. If adventure has a name, it must be Indiana Jones!\nIncludes: Headpiece, staff, display base, and instructions.\nENTERTAINMENT-INSPIRED DESIGN: This Indiana Jones Adventure Series Staff of Ra Headpiece Indiana Jones prop is inspired by the bronze medallion features in Indiana Jones and the Raiders of the Lost Ark.\nLIGHT EFFECTS: This Adventure Series roleplay collectible features a removable headpiece with light-up inscriptions and center “crystal,” as well as portion of staff and entertainment-inspired display base.\nQUALITY DESIGN: Highly detailed, this premium Staff of Ra Headpiece electronic talisman is designed to replicate the ancient medallion, featuring a premium metallic look and feel.\nDISPLAY STAND: With the headpiece attached to the staff, fans can display their premium Indiana Jones roleplay collectible with the included display stand, inspired by Indiana Jones and the Raiders of the Lost Ark.\nGIVE THE GIFT OF ADVENTURE: Hasbro Indiana Jones toys make great Indiana Jones gifts for fans and collectors (Each sold separately. Subject to availability.)\nAges 4 and up","image":"https://media.forbiddenplanet.com/products/a5/47/f832e9966a4add8c7dd7b210dc7b17b856d4.png","mainEntityOfPage":"https://forbiddenplanet.com/370542-indiana-jones-the-raiders-of-the-lost-ark-adventure-series-electronic-roleplay-toy-st'''
