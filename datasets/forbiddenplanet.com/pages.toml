full_description = "Your Throne: Volume ThreePre-OrderFrom: Your Throne Author: Sam Published by: Webtoon Unscrolled £12.06 RRP£16.99Add to BasketThis item is available to pre-order.Due for release: September 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionFor fans of The Remarried Empress and Villains Are Destined to Die, this stunning fantasy comic by debut author SAM features a powerful noblewoman who has to rewrite her entire revenge plan when she wakes up in the body of her sworn rival.Two noblewomen, Lady Medea Solon and Lady Psyche Callista, who were competing for the throne of the Vasilios Empire, struggle to survive in a dangerous world of magic and betrayal when their souls are reversed.Trapped in each other’s bodies and in unfamiliar territory, Medea and Psyche will both have to play a dangerous game to survive.News spreads that the Temple of the Vasilios Empire has foretold a prophecy with potentially earth-shattering consequences. Medea takes action in Psyche’s body to determine the truth of it all. Meanwhile, Duke Solon is in a hurry to arrange a marriage between Medea and a foreign king.Your Throne Volume 3 collects episodes 24 to 34 of the stunning fantasy WEBTOON comic by SAM, a story of power, magic, and betrayal with over 830 million reads worldwide.Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreAuthor SamGenresAnime & MangaFantasyHistorical FictionSupernaturalPublisherWebtoon UnscrolledSeries Your ThroneTypeMangaBindingTrade PaperbackCat. No.6871291EAN978199834125251899ISBN9781998341252"
