full_description = '''49 results in Books ▸ Audio Books Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Book The Book Of Bill (Hardcover) £22.50 RRP£25.00Audio Books {"description":"Did you miss him? Admit it, you missed him.\nThe demon that terrorised Gravity Falls is back from the great beyond to finally tell his side of the story in The Book of Bill, written by none other than Bill Cipher himself.\nInside, Bill sheds light on his bizarre origins, his sinister effects on human history, the Pines family’s most embarrassing secrets, and the key to overthrowing the world (laid out in a handy step-by-step guide).\nThis chaotic and beautifully illustrated tome contains baffling riddles, uncrackable ciphers, lost Journal 3 pages, ways to cheat death, the meaning of life, and a whole chapter on Silly Straws. But most importantly, The Book of Bill is deeply, deeply cursed.\nAlex Hirsch, #1 New York Times bestselling author, resuscitates this infamous villain and invites fans to a Bill’s eye view of the Gravity Falls universe. There are many who believe this book is too dangerous for human hands. But if you can’t resist, just know this: Once you make a deal with Bill, it’s not so easily undone… \nBeware: This book travels to dimensions meant for older readers.","image":"https://media.forbiddenplanet.com/products/b8/0e/cb3f2eae92c2f2c61adf6a80ef2fb84cadd2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","name":"The Book Of Bill (Hardcover)","url":"https://forbiddenplanet.com/427474-the-book-of-bill-hardcover/","category":"Books > Audio Books","gtin13":"9781368092203","mpn":"","offers":{"availability":"https://schema.org/InStock","price":22.5,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781368092203","releaseDate":"2024-11-29","reviews":[],"sku":"6465438","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book The Adventures Of Luther Arkwright: Heart of Empire £15.99 RRP£17.99Audio Books {"description":"The legacy of Luther Arkwright haunts his daughter Victoria, as she embarks on a mission to uncover her family’s hidden secrets…\nPart One: Daughter of Albion. Princess Victoria Arkwright never knew her father, a man whose shadow she has lived under since he saved the multiverse from the cataclysmic forces of the Disruptors.\n23 years after she and her brother Henry were born in the flames of war, Victoria seeks answers, but the truth lies deep in shadow. As rebellion gains momentum against Queen Anne’s totalitarian rule, dark forces grow at the heart of the British Empire, forces that threaten all realities. The multiverse needs Luther Arkwright to save it once more, but Luther Arkwright is dead…\nPart Two: Cataclysm. Victoria Arkwright is drawn towards destiny as she unravels the dangerous secrets that have remained hidden since her brother’s brutal murder. Prophecy says that reality will cease on her 23rd birthday - Victory Day - but with the help of Harry Fairfax and Rose Wylde, Victoria is determined to prevent the new apocalypse.\nTo unlock her true self, Victoria must embrace painful realities and the enormity of the multiverse; only then will she discover the legacy of Luther Arkwright. \nNOTE: This release contains adult material and may not be suitable for younger listeners.","image":"https://media.forbiddenplanet.com/products/e0/8b/4bf20bd4d78f5a65d71f74c0f01c0cd77348.jpg","mainEntityOfPage":"https://forbiddenplanet.com/400098-the-adventures-of-luther-arkwright-heart-of-empire/","name":"The Adventures Of Luther Arkwright: Heart of Empire","url":"https://forbiddenplanet.com/400098-the-adventures-of-luther-arkwright-heart-of-empire/","category":"Books > Audio Books","gtin13":"9781838687663","mpn":"9781838687663","offers":{"availability":"https://schema.org/InStock","price":15.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781838687663","releaseDate":"2023-11-14","reviews":[],"sku":"6189419","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Doctor Who At The BBC: Who Are We? £11.00 RRP£14.00Audio Books {"description":"Six decades of BBC TV’s most successful sci-fi series are celebrated in this collection of radio programmes. \nIn Who Are We (The Classic Years and The Modern Years) Jo Whiley takes a trip through the Whoniverse to find out how the changing attitudes of Britain have been reflected through the TARDIS’s travels. It’s a tale that features Dalekmania, Dad’s Army, Mary Whitehouse, Ridley Scott, Cybermen and the JFK assassination. \nJo also learns how Doctor Who thrived during the wilderness years of the show’s cancellation, with fandom playing a vital role in its return. Along the way Jo is joined by fans, stars and writers of Doctor Who including Russell T Davies, Steven Moffat and Chris Chibnall. There are also archive interviews with David Tennant, Jodie Whittaker, Peter Capaldi, Matt Smith, Christopher Eccleston, Billie Piper, Kylie Minogue, Patrick Troughton and many more. \nMeanwhile in Surviving Doctor Who Toby Hadoke presents a wry insight into the ups and downs of being one of the universe’s most misunderstood species: the Doctor Who fan. \n2024 BBC Studios Distribution Ltd (c) 2024 BBC Studios Distribution Ltd. Who Are We produced by Paul Sheehan for BBC Radio 2. Surviving Doctor Who produced by Luke Doran for BBC Radio 4 Extra.","image":"https://media.forbiddenplanet.com/products/b7/88/c1cdf900110656c6cb1086afce77e3628333.jpg","mainEntityOfPage":"https://forbiddenplanet.com/438054-doctor-who-at-the-bbc-who-are-we/","name":"Doctor Who At The BBC: Who Are We?","url":"https://forbiddenplanet.com/438054-doctor-who-at-the-bbc-who-are-we/","category":"Books > Audio Books","gtin13":"9781529943764","mpn":"9781529943764","offers":{"availability":"https://schema.org/InStock","price":11.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781529943764","releaseDate":"2024-12-05","reviews":[],"sku":"6625719","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Star Cops: Blood Moon 2: Part 3: Devis £10.99 RRP£11.99Audio Books {"description":"The Star Cops are engaged in a desperate battle against time as the consequences of Devis’ search for Sophie play out to a tragic conclusion.\nNOTE: This release contains adult material and may not be suitable for younger listeners.","image":"https://media.forbiddenplanet.com/products/1b/c9/df64c0c155d6d321e3ede5fb0f27f0db4d5d.jpeg","mainEntityOfPage":"https://forbiddenplanet.com/427124-star-cops-blood-moon-2-part-3-devis/","name":"Star Cops: Blood Moon 2: Part 3: Devis","url":"https://forbiddenplanet.com/427124-star-cops-blood-moon-2-part-3-devis/","category":"Books > Audio Books","gtin13":"9781802403664","mpn":"9781802403664","offers":{"availability":"https://schema.org/InStock","price":10.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781802403664","releaseDate":"2024-07-31","reviews":[],"sku":"6505349","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Doctor Who: The Force Of Death £9.00 RRP£11.00Audio Books {"description":"8th Doctor Audio Original.\nDan Starkey reads this original adventure for the Eighth Doctor -as played on TV by Paul McGann and Victorian journalist James MacFarlane. \nThe Doctor is working undercover in 1890s Galway whilst investigating the mysterious sinking of the RMS Majestic. Witnesses recall something huge crashing into the sea, causing a massive wave which overturned the ship. Could it have been the mythical sea creature known as the Dobhar-chu? \nAlso on the scene is James MacFarlane, intrepid journalist and friend of the Doctor. Reunited, the pair discover death stalking the area in the form of animated corpses. The Doctor soon realises that aliens are present, and unless stopped their plans could kill everyone in County Connemara! \nDan Starkey, who played Strax and other characters in the BBC TV series, reads this zombie chiller from Andrew Lane. \n2024 BBC Studios Distribution Ltd © 2024 BBC Studios Distribution Ltd.\nReading produced by Morrison Ellis. Sound design by David Darlington. Executive producer for BBC Audiobooks: Michael Stevens","image":"https://media.forbiddenplanet.com/products/d0/7d/90be230b4387587f70181366c3296108c32d.jpg","mainEntityOfPage":"https://forbiddenplanet.com/434683-doctor-who-the-force-of-death/","name":"Doctor Who: The Force Of Death","url":"https://forbiddenplanet.com/434683-doctor-who-the-force-of-death/","category":"Books > Audio Books","gtin13":"9781529935134","mpn":"9781529935134","offers":{"availability":"https://schema.org/InStock","price":9.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781529935134","releaseDate":"2024-10-28","reviews":[],"sku":"6625740","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Doctor Who: Attack Of The Cybermen: Sixth Doctor Novelisation £16.00 RRP£20.00Audio Books {"description":"An unabridged reading of this thrilling novelisation featuring the Sixth Doctor and Peri.\nWhat links a diamond raid in 20th Century London, a secret base in the heart of the city’s sewer system, a cold and desolate planet light years from Earth and a daring plan to alter the entire course of interplanetary history?\nThe Doctor’s old enemy, Lytton, has allied himself with the Cybermen. Their scheme, if successful, could bring the human race to its knees.\nFor the Cybermen have journeyed back in time to prevent the destruction of their home world. And for Mondas to survive, the Earth must die…\n“Slick and polished… immersive productions of much-loved novelisations… long may we enjoy them.” Doctor Who Magazine","image":"https://media.forbiddenplanet.com/products/a4/9a/19909dcb1530b0fa995771fa59cda036d02b.jpg","mainEntityOfPage":"https://forbiddenplanet.com/408053-doctor-who-attack-of-the-cybermen-sixth-doctor-novelisation/","name":"Doctor Who: Attack Of The Cybermen: Sixth Doctor Novelisation","url":"https://forbiddenplanet.com/408053-doctor-who-attack-of-the-cybermen-sixth-doctor-novelisation/","category":"Books > Audio Books","gtin13":"9781529905250","mpn":"9781529905250","offers":{"availability":"https://schema.org/InStock","price":16.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781529905250","releaseDate":"2024-02-01","reviews":[],"sku":"6289447","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book The Death & Life of River Song: Series 1: Last Words £31.99 RRP£34.99Audio Books {"description":"Wrenched from her digital afterlife in the Library, River Song finds herself on sixty-first century Earth, resurrected in a clone body. Billionaire tech mogul Garrison Clay has a mystery to solve, and he’s selected River as the person to solve it. \nArmed with only her sonic screwdriver and a fake ID, River heads out into a world soon to be ravaged by solar flares…where danger stalks her at every turn.","image":"https://media.forbiddenplanet.com/products/f6/d7/58aa080ea9cfb81b7b6a4069e58dcdd557ec.jpg","mainEntityOfPage":"https://forbiddenplanet.com/438062-the-death-life-of-river-song-series-1-last-words/","name":"The Death & Life of River Song: Series 1: Last Words","url":"https://forbiddenplanet.com/438062-the-death-life-of-river-song-series-1-last-words/","category":"Books > Audio Books","gtin13":"9781802404609","mpn":"9781802404609","offers":{"availability":"https://schema.org/InStock","price":31.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781802404609","releaseDate":"2024-10-31","reviews":[],"sku":"6625696","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Doctor Who: I, TARDIS: Memoirs Of An Impossible Blue Box £16.00 RRP£20.00Audio Books {"description":"Packed with stories from across time and space, this is the first ever memoir by the TARDIS. \n‘Did you ever wonder why I chose you all those years ago? I wanted to see the universe, so I stole a Time Lord and I ran away…’ \nThe Doctor has a unique bond with their TARDIS. They’ve always loved the ‘old girl’ for the way she’s gone looking for trouble anywhere in the universe. The Doctor says they stole the TARDIS from Gallifrey. The TARDIS disagrees…she stole them. It hasn’t always taken the Doctor where they want to go, but it’s made sure to take them where they needed to be. \nFor the TARDIS is far more than just a time machine crossed with a spaceship. Its life reflects the Doctor’s life - a shared wanderlust and longing to explore. Now you can revisit the Doctor’s adventures as seen through the eyes - or the flashing rooftop light, at least - of the TARDIS. From the time the Doctor stole it from Gallifrey to its latest adventures with the Fifteenth Doctor, the TARDIS reflects wittily on its epic, incredible history - past, present and future!","image":"https://media.forbiddenplanet.com/products/05/b8/a97e691a23102a80acf1e3e3068ae0288315.jpg","mainEntityOfPage":"https://forbiddenplanet.com/428439-doctor-who-i-tardis-memoirs-of-an-impossible-blue-box/","name":"Doctor Who: I, TARDIS: Memoirs Of An Impossible Blue Box","url":"https://forbiddenplanet.com/428439-doctor-who-i-tardis-memoirs-of-an-impossible-blue-box/","category":"Books > Audio Books","gtin13":"9781529942316","mpn":"9781529942316","offers":{"availability":"https://schema.org/InStock","price":16.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781529942316","releaseDate":"2024-08-22","reviews":[],"sku":"6505271","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Audio Book Doctor Who: Time & The Rani: Seventh Doctor Novelisation £15.00 RRP£20.00Audio Books {"description":"Bonnie Langford reads this thrilling novelisation of the debut TV adventure for the Seventh Doctor. \nAssailed by violent bolts of energy, the TARDIS is blasted off-course and forced to land on the barren pla'''
