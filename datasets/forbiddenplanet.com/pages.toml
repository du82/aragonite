full_description = "Darkwing Duck #1 (Cover A Stones)Pre-OrderFrom: Darkwing Duck Universe: Disney Author: Daniel Kibblesmith Artists: Ted Brandt, and Ro Stein Published by: Dynamite Entertainment Subscribe & SaveSubscribe now to the Darkwing Duck (2025) series and save! View offerSingle Issue Price: £3.30 RRP£4.90Add to BasketThis item is available to pre-order.Due for release: 5 Mar 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionHe is the terror that flaps in the night! The fowl that felons most fear! A legend in his own time (and his own mind)! He is… DARKWING DUCK!But how did this avian exemplar develop his redoubtable reputation? What lessons did he learn in his early days of crime-busting and foe-foiling? His legion of fans (or, at least, his adopted daughter, Gosalyn) want to know and DW is more than happy to tell her the whole (possibly embellished) story in this unauthorized (and unorganized) autobiography!Renowned writer DANIEL KIBBLESMITH (The Late Show with Stephen Colbert, Loki, Black Panther vs. Deadpool) and the double-headed art team of TED BRANDT & RO STEIN (The Mighty Captain Marvel, Tales of the Titans: Beast Boy) return to the rooftops of St. Canard with an all-new series that revisits (and likely revises) Darkwing Duck’s formative years, with a debut issue cover from artist TAD STONES, creator of the original Darkwing Duck animated series, as well as instantly iconic imagery from BRANDT & STEIN, MARK BAGLEY, NICOLETTA BALDARI and CIRO CANGIALOSI!*** COVER SUBJECT TO CHANGE ***Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreArtists Ted Brandt Ro SteinAuthor Daniel KibblesmithGenresSuperheroesAction & AdventureFilm & TVHumourPreviewsPreviews December 2024PublisherDynamite EntertainmentSeries Darkwing DuckTypeComicUniverseDisneyWednesday ComicsWednesday Comics 05/03/2025BindingComicCat. No.6765767ISBN72513035273601011"
