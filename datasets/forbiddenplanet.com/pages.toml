full_description = '''56 results in Gaming ▸ Card Games Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Card GamePre-Order Gwent: The Card Game £39.99 RRP£44.99Due for release:18 Aug 2025Card Games {"description":"Gwent is coming to physical tabletops after 10 years in the making.\nHachette Boardgames has partnered with No Loading Games to bring the game to the US &amp; UK.\nGwent, which started life as a card game within The Witcher 3, has been one of the most popular spin-offs from a video game of all time. The Witcher 3 sold over 50 million copies, making it the 9th most popular video game of all time.\nGwent became so popular that it spawned spin-off titles such as The Witcher: Thronebreaker, as well as a hugely popular app simply titled GWENT, which has reached over 5 million players on Android alone. However, until now, there has not been a physical reproduction of the beloved card game.\nThe game comes with over 400 cards and a playmat, replicating the full experience of Gwent’s iteration within The Witcher 3. It includes several variants for casual play through to recognised tournament rules for stricter competition settings.","image":"https://media.forbiddenplanet.com/products/a1/a9/fe40da56a521187df0c5188c92587e8cd095.png","mainEntityOfPage":"https://forbiddenplanet.com/445435-gwent-the-card-game/","name":"Gwent: The Card Game","url":"https://forbiddenplanet.com/445435-gwent-the-card-game/","category":"Gaming > Card Games","mpn":"NOLO-GWENT-EN","offers":{"availability":"https://schema.org/PreOrder","price":39.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:445435","releaseDate":"2025-08-18","reviews":[],"sku":"6783112","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Gaming Accessories Gamegenic: Closable Inner Sleeves (100) £4.49 RRP£4.99Accessories {"description":"Playing and Collectible Cards are very valuable and deserve an extra layer of protection.\nThese inner sleeves add this kind of additional protection. These are used inside standard sleeves (sleeve-within-sleeve) to protect cards from dust, dirt or other damages (e.g. frequent shuffling).\nInner sleeves come in an exact size to fit perfectly around standard-sized gaming cards. One pack contains 100 inner sleeves to be suitable also for larger deck formats.\nFull 4-edge protection: double-sleeved cards are protected from all sides, against dust, dirt, or other damages.\nWater-resistant: double-sleeved cards in Closable Inner Sleeves stay dry under water for up to 1 hour.\nNo glue: The protective flap slips easily into the sleeve creating a self closing seal Sideloading for easier folding of additional protective flap.\nIdeal for double sleeving: ideal fitting and size keeping your cards safe when changing outer sleeves Consistent sizing.","image":"https://media.forbiddenplanet.com/products/ca/8a/64f61ad76a8dfbbb5434549a71bc36ce50ef.png","mainEntityOfPage":"https://forbiddenplanet.com/334320-gamegenic-closable-inner-sleeves-100/","name":"Gamegenic: Closable Inner Sleeves (100)","url":"https://forbiddenplanet.com/334320-gamegenic-closable-inner-sleeves-100/","category":"Gaming > Accessories","mpn":"GGS10128ML","offers":{"availability":"https://schema.org/InStock","price":4.49,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:334320","releaseDate":"2021-11-01","reviews":[],"sku":"5335176","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card GamePre-Order Flip 7 £13.99Due for release:19 Mar 2025Card Games {"description":"Flip over cards one by one without flipping the same number twice.\nSound easy? Think again! This isn’t just any deck of cards… In Flip 7 there’s only one 1 card, two 2’s, three 3’s, etc plus a bunch of special cards that can score you extra points, give you a second chance, or freeze you or your opponents in your tracks.\nAre you the type of player to play it safe and bank points before you bust, or are you going to risk it all and go for the bonus points by flipping over seven in a row? Press your luck meets strategy in this addictive card game that’s sure to be the greatest card game you’ve ever played!","image":"https://media.forbiddenplanet.com/products/22/d3/ccb5360c6a69b3c1ff6b8b73b080b2544b66.jpg","mainEntityOfPage":"https://forbiddenplanet.com/430130-flip-7/","name":"Flip 7","url":"https://forbiddenplanet.com/430130-flip-7/","category":"Gaming > Card Games","mpn":"USOPA1728710","offers":{"availability":"https://schema.org/PreOrder","price":13.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:430130","releaseDate":"2025-03-19","reviews":[],"sku":"6546380","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card GameSaleLimited EditionExclusive Star Trek: Playing Cards (Forbidden Planet Exclusive) £3.99 was £5.99 RRP£5.99Card Games {"description":"Star Trek playing cards have arrived at Forbidden Planet!\nThis exclusive deck features 52 standard cards and three distinct Jokers. \nEach suit is dedicated to a specific era of the franchise.\nStar Trek: The Original Series suit - Kirk (King), Uhura (Queen), Spock (Jack) and schematics of the NCC-1701 on the Ace.\nStar Trek: The Next Generation - Picard (King), Troi (Queen), Riker (Jack) and schematics of the NCC-1701-D on the Ace.\nStar Trek: Deep Space Nine - Sisko (King), Kira (Queen), Odo (Jack) and schematics of the station as the Ace. \nStar Trek: Voyager - Janeway (King), Seven of Nine (Queen), The EMH Doctor (Jack), and schematics of the NCC-74656 as the Ace.\nEach suit’s number cards feature series appropriate deltas.\nPlus! Choose your own Joker cards. 3 special cards to pick from, each featuring a unique face. These include Q, Garak and Quark with Tribbles!\nLimited edition, and only available from Forbidden Planet.","image":"https://media.forbiddenplanet.com/products/b1/64/cf0d19f662b2933fb81e41482beff675ba29.png","mainEntityOfPage":"https://forbiddenplanet.com/299979-star-trek-playing-cards-forbidden-planet-exclusive/","name":"Star Trek: Playing Cards (Forbidden Planet Exclusive)","url":"https://forbiddenplanet.com/299979-star-trek-playing-cards-forbidden-planet-exclusive/","category":"Gaming > Card Games","gtin13":"5055374684047","mpn":"PC-ST-001","offers":{"availability":"https://schema.org/InStock","price":3.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5055374684047","releaseDate":"2021-12-02","reviews":[],"sku":"4828952","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card GamePre-Order Agent Avenue £19.99Due for release:28 Mar 2025Card Games {"description":"Agent Avenue is a competitive card game for 2-4 players that combines bluffing, strategic set collection, and a race to uncover your opponent’s identity. Set in a colourful anthropomorphic world, players assume the roles of retired spies in a suburban neighbourhood, outsmarting each other with cards that can score points or trigger special effects.\nUtilize a unique “I split, you choose” mechanic to play one card face-up and one face-down each turn. Your opponent chooses one, influencing both your strategies. Cards feature different agents and tools that impact scoring and game progress on a track, advancing the “catch me” race to uncover the opposing spy.\nBeautifully illustrated by Fanny-Pastor Berlie, the game’s art brings to life a quirky neighbourhood of animal spies. The game includes over 50 cards, a custom game board, and meeples.\nOutwit your opponents by strategically collecting agent sets and effectively using spy tools. The game ends when a player successfully uncovers their opponent, combining both strategic depth and bluffing elements.\nPerfect for those who love a mix of strategy and lighthearted competition, “Agent Avenue” challenges you to think like a spy and act like a friendly neighbour.","image":"https://media.forbiddenplanet.com/products/c2/33/5d4c3b8c16e8829960b2d21d35a51ad376fc.png","mainEntityOfPage":"https://forbiddenplanet.com/445487-agent-avenue/","name":"Agent Avenue","url":"https://forbiddenplanet.com/445487-agent-avenue/","category":"Gaming > Card Games","mpn":"ASMNERAAV0101","offers":{"availability":"https://schema.org/PreOrder","price":19.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:445487","releaseDate":"2025-03-28","reviews":[],"sku":"6750664","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card GamePre-Order Earthborne Rangers £99.99Due for release:30 May 2025Card Games {"description":"Earthborne Rangers is a customizable, co-operative card game set in the wilderness of the far future. You take on the role of a Ranger, a protector of the mountain valley you call home: a vast wilderness transformed by monumental feats of science and technology devised to save the Earth from destruction long ago.\nYou begin by building a deck that reflects your Ranger’s interests, personal history, and personality. Then, as you explore the open world and your story takes shape, you augment your deck with improved equipment, refined skills, and the memories of your journey.\nThe story of Earthborne Rangers is presented as a branching narrative campaign consisting of a main storyline and a multitude of side stories. In it, you can choose to follow the critical path or to strike off on your own to discover the Valley’s many engaging characters, mysterious ruins, and beings both familiar and strange.\nEach game session represents one day in the Valley, and you’ll pick up in the same location on the map where you rested the night before. Your goal is to either complete one of your available missions or to explore the open world. The session ends when you’re either forced to rest (through either fatigue or injury), or you choose to rest for the night.\nAn individual game session is played in rounds, and those rounds consist of turns. On your turn, you perform one action: either play a card from your hand, or choose an action from a card on the table.\nEach action allows you to interact thematically and narratively with the world, and each time you take an action, the world comes to life around you. Predators stalk their prey, rain pours from the sky, rocks tumble down the mountain to block your path, and much more.","image":"https://media.forbiddenplanet.com/products/bc/ee/3b51d4b90e03c5971fd0c36ace228dc9e098.jpeg","mainEntityOfPage":"https://forbiddenplanet.com/396407-earthborne-rangers/","name":"Earthborne Rangers","url":"https://forbiddenplanet.com/396407-earthborne-rangers/","category":"Gaming > Card Games","mpn":"EBR001","offers":{"availability":"https://schema.org/PreOrder","price":99.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"id:396407","releaseDate":"2025-05-30","reviews":[],"sku":"6152086","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card Game Hello Kitty: Playing Cards £4.99Card Games {"description":"Shuffle and deal your way through card games in the most adorable way possible with these Sanrio Hello Kitty Playing Cards.\nInside the delightful blue storage tin, you’ll find a standard deck of playing cards featuring cute illustrations of the cute cat with her signature bow. Step further into the world of Hello Kitty with every turn of a card.\nThe Hello Kitty Playing Cards will put a sweet spin on your next game of cards.\n\n\nFeatures cute illustrations of Hello Kitty with her signature bow\n\n\nStandard deck of 52 cards and 2 jokers\n\n\nIncludes themed storage tin\n\n\nOfficially licensed Hello Kitty product\n\n","image":"https://media.forbiddenplanet.com/products/ee/77/e7b9ad1bf375525a70e8c436e30a802a37fd.png","mainEntityOfPage":"https://forbiddenplanet.com/428400-hello-kitty-playing-cards/","name":"Hello Kitty: Playing Cards","url":"https://forbiddenplanet.com/428400-hello-kitty-playing-cards/","category":"Gaming > Card Games","gtin13":"5056577735635","mpn":"PP13294HK","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5056577735635","releaseDate":"2024-07-05","reviews":[],"sku":"6454180","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card Game Minecraft: Playing Cards: Animals £4.99Card Games {"description":"Step into a pixelated world of cards with these Minecraft Animal Playing Cards.\nInside the Minecraft-themed storage tin, you’ll find a standard deck of playing cards featuring trusty animal and mob companions for your next gaming adventure. From Pig and Chicken, to Panda and Ocelot, Creeper and Enderman, these cards bring your favourite Minecraft creatures to life.\nThe Minecraft Animal Playing Cards will put a blocky spin on your next game night.\nPlay cards with your favourite Minecraft creatures.\nStandard deck of 52 cards and 2 jokers.\nIncludes storage tin.\nOfficially licensed Minecraft product.","image":"https://media.forbiddenplanet.com/products/86/e2/acb57ab17d639e68b72dd06347009892c715.png","mainEntityOfPage":"https://forbiddenplanet.com/428256-minecraft-playing-cards-animals/","name":"Minecraft: Playing Cards: Animals ","url":"https://forbiddenplanet.com/428256-minecraft-playing-cards-animals/","category":"Gaming > Card Games","gtin13":"5056577736816","mpn":"PP13379MCF","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:5056577736816","releaseDate":"2024-07-31","reviews":[],"sku":"6454135","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Card Game Cards Against Humanity (UK Edition Version 2.0) £32.39 RRP£35.99Card Games {"description":"Cards Against Humanity is a party game for horrible people. Each round, one player asks a question from a black card, and everyone else answers with their funniest white card.\nNow version 2.0 with over 150 new cards has been expanded to 600 cards (50 more than before).\nThis is the main game. Buy this first.\nAd'''
