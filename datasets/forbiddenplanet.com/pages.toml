full_description = '''14764 results in Comics & Graphic Novels Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Comic Forbidden Planet: Comic Grab Bag (4 Comic Pack) £2.00Reviews★★★★★ (36)Comics {"description":"Grab yourself a comic bargain with our wonderful Forbidden Planet Grab Bags. A great chance to increase your collection or to get a taste of something new!\nPlease Note:\nEach Grab Bag contains four random comics.\nAs Grab Bags are randomly selected, some packs may contain mature content (18+).\nDue to the nature of randomly selected sealed bags this item is not returnable or replaceable. Comics included in our grab bags are usually older stock, and are expected to be in a similar condition to our sale items, more information can be found Here. Please&nbsp;Contact Us in the event of receiving damaged goods.\nWhen ordering multiple grab bags duplicates are very likely to occur as these packs are created in advance and are subject to stock&nbsp;availability. This is especially likely for purchases of five or more.\nFor full Terms and Conditions see&nbsp;here.","image":"https://media.forbiddenplanet.com/products/6d/83/93baa8ae22aca8e8468942391081203ef194.png","mainEntityOfPage":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","name":"Forbidden Planet: Comic Grab Bag (4 Comic Pack)","url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","aggregateRating":{"ratingCount":36,"reviewCount":36,"ratingValue":4.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Comics & Graphic Novels > Comics","gtin12":"000001270136","mpn":"","offers":{"availability":"https://schema.org/InStock","price":2.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"ean:000001270136","releaseDate":"2006-05-28","reviews":[{"name":"4 Comic Pack review","reviewBody":"I really like. Good set of random comics.","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-04-18T14:18:16.920554+01:00","datePublished":"2024-05-02T15:53:55.390769+01:00","author":"Penda","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Absolute bargain","reviewBody":"Haven't received any duplicates but I’ve only purchased a few. Very happy with what I’ve received and it wouldn’t be that bad to see a duplicate or 2 judging by the price","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2024-04-02T14:34:53.099411+01:00","datePublished":"2024-04-11T12:20:02.393794+01:00","author":"Mz","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Pleasantly Suprised","reviewBody":"Only bought 2 packs due to reviews about duplication. Pleasantly suprised. Got a couple of nice looking variants. Never going to be incredible for 2 pound but definitely was worth it for me","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-11-20T10:59:31.175977Z","datePublished":"2023-12-06T09:48:38.832995Z","author":"BW","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"loads of duplicates, too many","reviewBody":"bought a few bundles. one of them had 3 of the same issue and the others had duplicates too. so i really didnt get much out of mine, wasnt happy at all tbh so wont be buying them again regardless how cheap, most likely get 4 of the same issue next time i buy! i know they're randomly selected but maybe they could at least make note of when a duplicate is added, most of us just like to read and not have to either sell spare comics/bin them/use up space to store them.","reviewRating":{"ratingValue":2,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-06-11T22:08:34.718590+01:00","datePublished":"2023-09-11T16:35:29.147476+01:00","author":"DJ","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"These have gone downhill","reviewBody":"They used to be good value but far too much duplication and drivel in the last few packs. Also quite a few 18+ titles without age verification.","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-05-04T15:50:29.161926+01:00","datePublished":"2023-05-05T09:30:30.571671+01:00","author":"mjm","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Absolutely delighted ","reviewBody":"Took a chance and ordered a pack and couldn't be happier. I received;\nBrzrkr #1\nX Factor #2\nFuture State: The Next Batman #1\nBlade Runner 2029 #3\nAnd for those moaning about duplicates, it clearly states that there is a high chance that you will get the same packs.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-04-20T11:24:35.474998+01:00","datePublished":"2023-05-05T09:30:31.953325+01:00","author":"PM1985","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Comic grab bag","reviewBody":"Very poor selection all independents no marvel or dc as advertised","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-04-12T17:54:23+01:00","datePublished":"2023-12-27T14:17:07Z","author":"Michael fisher","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Wowzers","reviewBody":"Absolutely the best value for money and entertainment... Bought 20 grab bags and got a huge selection of different titles, variant covers, lots of #1 s and lots of comics that I wouldn't have ever bought, however they were excellent and a change from the usual is good and I now have a few new favourites that I otherwise wouldn't of had Thanks to the Grab Bag... Downside if you are a real greed head is you might get a few duplicates... But it makes your boxes look more stacked... cheers","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-03-18T18:54:55.571082Z","datePublished":"2023-04-11T09:58:41.040871+01:00","author":"REWS333","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Mix them up a bit please...","reviewBody":"I bought nine grab bags recently, fully understanding that there would be a chance of duplication amongst some of them. That said, was really disappointed when all nine grab bags arrived they were exactly the same containing the same four comics throughout. Definitely good value but just would've liked more than four different comics from the 36 I received.","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-10-27T17:39:22.249685+01:00","datePublished":"2023-01-23T11:31:04.545154Z","author":"Quirkafleeg","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Excellent mix, awesome variants.","reviewBody":"I purchased 2 of these for £2 each and definitely think they were worth 50p each. I got 4 Marvel comics all from 2022 (and all issue 4 weirdly) including a Star Wars one from last month! There was an independent comic from the band Disturbed which was a blank cover variant. The last 3 were DC including Dark Knights Of Steel #1 which had 3 issues included and 2 much older comics. Batman Superman #23 Bombshells Variant from 2015 and my favourite of the lot....Harley Quinn #1 from 2014 and is a lenticular cover variant. I'll definitely consider buying more in a few months.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-10-07T13:13:40.917366+01:00","datePublished":"2023-01-11T10:58:29.764546Z","author":"Lee D","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"A little disappointed","reviewBody":"So after buying my first couple of grab bags to get me into reading comics i was really excited and happy when they arrived i then ordered another 10 of them which came only to find every single grab bag was exactly the same!","reviewRating":{"ratingValue":3,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-07-20T09:06:02.268742+01:00","datePublished":"2023-01-23T11:31:07.357420Z","author":"Chelsea","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Exact dupes","reviewBody":"Used to be a good variation, the occasional duplicate which is fine! Ordered 2 this time round and have never had the problem before where they send EXACTLY the same pack twice. All marvel/dc comics as well, poor variation.","reviewRating":{"ratingValue":1,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-07-15T11:29:38.534645+01:00","datePublished":"2023-01-23T11:31:08.166815Z","author":"Uni","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"great selection","reviewBody":"Great selection, \nWorth the money, but the delivery is a bit slow.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-06-07T15:28:58.630437+01:00","datePublished":"2022-12-16T09:56:44.235637Z","author":"re..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great","reviewBody":"Got some good comics including a Gwen variant","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-06-01T13:50:11.482659+01:00","datePublished":"2022-12-16T09:56:45.539759Z","author":"Comithan","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great Variation","reviewBody":"I've ordered around 10 of these now and have only ever had a few duplicates, most of which being the same amazing spider-man issue with the first appearance of cindy moon, so I have no complaints with these, especially considering the price","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-05-30T12:49:33.669965+01:00","datePublished":"2022-12-16T09:56:45.805143Z","author":"ri..@..l.com","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Very Satisfied","reviewBody":"First ever time buying any sort of mystery grab bag, and very satisfied with my selection! Will definitely be ordering this again.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2022-02-03T11:21:39.237064Z","datePublished":"2022-12-15T15:57:11.241790Z","author":"Rory","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Great","reviewBody":"I have bought quite a few of these over the past couple of months. I have found a few gems some signed variants and some issue 1s a few duplicates but to be fair not many.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2021-09-12T18:58:36.144635+01:00","datePublished":"2021-12-16T12:13:33.834304Z","author":"he..@..co.uk","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Incredible!","reviewBody":"Not only did I receive several rare variants, but also a signed, forbidden planet exclusive comic! Well worth the money and I will certainly be buying these again :)","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2021-07-12T16:55:30.670086+01:00","datePublished":"2023-01-23T11:34:50.350856Z","author":"Noah","itemReviewed":{"url":"https://forbiddenplanet.com/196635-forbidden-planet-comic-grab-bag-4-comic-pack/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Cool titles, several variants","reviewBody":"Great stuff! Currently not able to travel to the coolest shop in London, I ordered some grab bags. I was very pleased about the several variant covers, some I only get'''
