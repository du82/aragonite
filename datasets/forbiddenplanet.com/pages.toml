full_description = '''1098 results in Books ▸ Film, TV, & Music Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy < PreviousNext >Book The Art Of Tim Burton (Hardcover) £59.99Reviews★★★★★ (11)Art & Design {"description":"An amazing career overview of his art and movie pre-production drawings, this beautiful edition showcases Tim Burton’s film genius.\nMeasuring 11” x 12”, this 434 page book comes with over 1,000 illustrations and over 10 multi-page gatefolds. With a die cut hard-cover, and book marker included, it opens a wonderful door into the magical world of Tim Burton for collectors and fans alike.\nPrinted on top quality paper certified by Forest Stewardship Council, over 2,000 trees were planted to offset the environmental impact of the book.\nIf you are ordering The Art of Tim Burton Standard or Deluxe Editions from outside Europe and the United Kingdom please click here.","image":"https://media.forbiddenplanet.com/products/c8/00/6f148e8484ca5e54e4bb002ee2bd44b0d507.jpg","mainEntityOfPage":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","name":"The Art Of Tim Burton (Hardcover)","url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","aggregateRating":{"ratingCount":11,"reviewCount":11,"ratingValue":5.0,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"AggregateRating"},"category":"Books > Art & Design","gtin13":"9781935539018","mpn":"","offers":{"availability":"https://schema.org/InStock","price":59.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781935539018","releaseDate":"2023-04-24","reviews":[{"name":"Fantastic Art Book!!","reviewBody":"As an aspiring artist/filmmaker, this book is a must have for those who enjoy burton's work. The art and sketches are presented wonderfully, as well as the history and experiences of burton's career and those who worked alongside him. My favourite sections overall are the surreal aliens/creatures he invents, and the completely unfiltered monsterous way he portrays suburban american culture. I'll definitely be reading and using this for inspiration, as well as listening to Danny Elfman's Soundtracks on the side. One of the best art books I've bought. Thoroughly recommend.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2023-08-23T23:05:51.815440+01:00","datePublished":"2023-09-11T16:30:26.068930+01:00","author":"Will Hanekom","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"The art of Tim Burton","reviewBody":"I would like to give them a 5 star,i couldn't be happier with my purchase,it was a fantastic price,they kept me up to date with shipment and deliver,excellent packing and came in less than a week,will definitely use them again.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2021-06-10T19:03:35.400384+01:00","datePublished":"2021-07-01T14:48:42.886327+01:00","author":"CarolinePendleton","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"shipping to Slovakia","reviewBody":"Hello, I´m from Slovakia and I received my book 2 weeks after it was dispatched, so this part was great! Shipping charge for entire order was £55 and that is a bit too much in my opinion, shipping was more expensive than the book itself. But it was worth it, overall I'm very satisfied, thank you!","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2016-10-18T12:11:41.141624+01:00","datePublished":"2017-03-08T12:23:55.521715Z","author":"Klaudia","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Worth every pound","reviewBody":"Awesome book!","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2014-10-31T07:42:55Z","author":"Helena","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"You Need This!","reviewBody":"If you're a Burton fan, there's no better way to spend £50!!\r\nSo many fantastic illustrations, simply delicious! ","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2014-02-21T20:39:48Z","author":"Nathan","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Final price","reviewBody":"I ordered today and the final price was 73,20 euro's (because I'm from The Netherlands).\r\nBut it's worth paying for. I can't wait until I receive it!\r\nGO BURTON!","reviewRating":{"ratingValue":4,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2011-01-24T20:56:15Z","author":"Chloe","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":":)","reviewBody":"I was given this for christmas, best present ever.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2011-01-18T22:46:36Z","author":"Jenny","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"If you are a Tim Burton-fan - then buy it!","reviewBody":"The amazing art book The art of Tim Burton shows director Tim Burtons skills as a artist at full range. There are over 1000 illustrations showing everything from sketches to his dazzling film work such as Batman, Sleepy Hollow and Alice in Wonderland to more personal artwork that displays his love for freaks and other weird things. I had a fantastic time reading the massive book, so if you are a huge fan of Tim Burton, then buy this book. Every page of it is worth it.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2010-10-11T00:14:20+01:00","author":"Michael Larsen","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"one word... AMAZING!","reviewBody":"This truly unique book has got to be the best £50 I have ever spent! Absolutely amazing, a real eye opener to some one as significant as Tim Burton, always loved his unique crazy ways, and to own this book is just unbelievable! I strongly recomend it to any Tim Burton fans out there, you wont regret it at all! I think you'll cherish it just as much as I have! :)","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2010-05-28T00:16:07+01:00","author":"carly!","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Perfect!","reviewBody":"I bought this book because I am a huge fan of Tim Burton's art. It is a truly amazing collection of drawings spiked with personal notes from friends and co-workers of Burton's. It's made of very high quality paper and really an eye-catcher! I love it and I think it was not too expensive, even considering shipping costs to Germany, I think I paid 75 €.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2010-01-08T19:04:13Z","datePublished":"2010-01-11T16:42:17Z","author":"Schroe2004","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"},{"name":"Impressive book","reviewBody":"I received it for Christmas and I can say it's really the best collector book I have ever seen on a film maker. One thousand illustrations on a very high quality paper, four pounds of beautiful drawings often never seen before. The shipping to France was quite expensive but I have nothing to say, it was perfect, fast and clean. If you're really a fan of Tim Burton's work, buy it, this is not just a commercial product, but a very high quality artbook that won't disappoint the most demanding fans.","reviewRating":{"ratingValue":5,"bestRating":5,"worstRating":1,"@context":"https://schema.org","@type":"Rating"},"dateCreated":"2009-12-25T08:55:33Z","author":"macbain","itemReviewed":{"url":"https://forbiddenplanet.com/45901-the-art-of-tim-burton-hardcover/","@context":"https://schema.org","@type":"Thing"},"@context":"https://schema.org","@type":"Review"}],"sku":"1938029","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale The Art Of Blade Runner: Black Lotus (Hardcover) £4.99 was £28.79 RRP£39.99Art & Design {"description":"The Art of Blade Runner: Black Lotus is a study and celebration of the artwork that went into making the first ever Blade Runner animated series.\nConcept art, sketchwork, pre-viz, animation tests, final frames and more, are paired alongside interviews with the masterminds behind the show to give fans the full story of Black Lotus. \nRespected co-directors Shinji Aramaki and Kenji Kamiyama provide an exclusive, in-depth interview that explores their relationship with the Blade Runner universe, and their intimate analyses of and inspiration behind the characters. Alcon producers describe the creative journey, that spans many years prior, behind what they envisioned for the story, how Black Lotus would fit in the wider Blade Runner narrative, and who they wanted the protagonist to be.\nThe writers explain how they conceptualised the characters and the voice actors share their personal journeys and light-hearted anecdotes on how they brought those characters to life. The lighting and animation team also share how they captured Blade Runner’s cyberpunk visual and auditory palette in a new medium for the franchise: anime. \nThis book is illustrated to the brim with concept art that is beautifully vivid and presented in a gallery format throughout the book; organised chronologically by character, location, and event as they are introduced in the show. Readers will be able to breeze through this companion guide as they watch the show for a deeper, richer, and more personal viewing experience.\nAt the back of the book, you’ll find never-before-seen sketches of the Black Out short films that accompanied Blade Runner 2049.","image":"https://media.forbiddenplanet.com/products/c7/48/4431aa6948433e712061523f8fd5a7577302.jpg","mainEntityOfPage":"https://forbiddenplanet.com/338300-the-art-of-blade-runner-black-lotus-hardcover/","name":"The Art Of Blade Runner: Black Lotus (Hardcover)","url":"https://forbiddenplanet.com/338300-the-art-of-blade-runner-black-lotus-hardcover/","category":"Books > Art & Design","gtin13":"9781789097146","mpn":"","offers":{"availability":"https://schema.org/InStock","price":4.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789097146","releaseDate":"2022-10-04","reviews":[],"sku":"5383054","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale No Time To Die: The Making Of The Film (Hardcover) £5.00 was £29.99 RRP£39.99Action & Adventure {"description":"The official making of book for No Time To Die, the 25th official James Bond 007 film.\nBond has left active service and is enjoying a tranquil life in Jamaica. His peace is short-lived when his old friend Felix Leiter from the CIA turns up asking for help. The mission to rescue a kidnapped scientist turns out to be far more treacherous than expected, leading Bond onto the trail of a mysterious villain armed with dangerous new technology.\nThis lavish coffee table hardback takes readers behind the scenes of the 25th official James Bond film and reveals the locations, characters, gadgets, weapons, and cars of No Time To Die, with exclusive on-set photography, concept art, costume designs, stunt breakdowns, and more, accompanied by cast and crew interviews.","image":"https://media.forbiddenplanet.com/products/8d/d8/9b4be1686918225651f02e4ce8d646397ff3.jpg","mainEntityOfPage":"https://forbiddenplanet.com/290499-no-time-to-die-the-making-of-the-film-hardcover/","name":"No Time To Die: The Making Of The Film (Hardcover)","url":"https://forbiddenplanet.com/290499-no-time-to-die-the-making-of-the-film-hardcover/","category":"Books > Action & Adventure","gtin13":"9781789093599","mpn":"","offers":{"availability":"https://schema.org/InStock","price":5.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9781789093599","releaseDate":"2021-10-15","reviews":[],"sku":"4183693","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}BookSale Rick & Morty: Show Me What You Got (Hardcover) £2.99 was £25.99 RRP£29.99Art & Design {"description":"Delve into the worlds of Rick and Morty in this stunning memento showcasing the best of the Gallery 1988 exhibition. \nTogether with Adult Swim, the gallery commissioned a series of art pieces to celebrate moments, characters, storylines and episodes from the show. The event was a huge hit and the limited pieces sold out at one one-hundredth the speed of reality.\nRick and Morty: Show Me What You Got allows fans to explore the stunning artwork from the exhibition. Artists have contributed passionately made posters, sculptures, book covers, hip flasks and much more to commemorate this beloved series. Discover what inspired them, see their work in progress, and enjoy a collection of stunning, original Rick and Morty artwork.","image":"https://media.forbid'''
