full_description = "A Dark & Drowning Tide (Signed Bookplate Edition Hardcover)Pre-OrderSigned Signed by: Allison Saft Author: Allison Saft Published by: Daphne Press £15.99 RRP£19.99Add to BasketThis item is available to pre-order.Due for release: 12 Mar 2025. We expect to receive the item from our suppliers on or around this date.Store prices may varyReturn PolicyAdd to Wishlist Share More…Embed Copy and paste the following code where you want the embed to appear.If you're an affiliate make sure your code is set in the “Affiliate” section.Embed code Copy Affiliates If you are an affiliate you can add your code to the share link by entering it hereAffiliate code Your affiliate link to this page Copy DescriptionSpecificationsReviewsRelated ProductsProduct DescriptionAn Instant Sunday Times Bestseller!A sharp-tongued folklorist and her academic rival must solve their mentor’s murder in this lush sapphic fantasy romance from the New York Times bestselling author of A Far Wilder Magic.Lorelei Kaskel, a folklorist with a quick temper and an even quicker wit, is on an expedition with six eccentric nobles in search of a fabled spring. The magical spring promises untold power, which the king wants to harness to secure his reign of the embattled country and Lorelei is determined to use this opportunity to prove herself and to make her dream come true: to become a naturalist, able to travel freely to faraway lands.The expedition gets off to a harrowing start when its leader-Lorelei’s beloved mentor-is murdered in her quarters aboard their ship. The suspects are her five remaining expedition mates, each with their own motive. The only person Lorelei knows must be innocent is her long-time academic rival, the insufferably gallant and maddeningly beautiful Sylvia von Wolff.Now in charge of the expedition, Lorelei must find the spring before a coup begins and the murderer strikes again and a coup begins in earnest.But there are other dangers lurking in the dark: forests that rearrange themselves at night, rivers with slumbering dragons waiting beneath the water and shapeshifting beasts out for blood.As Lorelei and Sylvia grudgingly work together to uncover the truth-and resist their growing feelings for one another-they discover that their professor had secrets of her own. Secrets that make Lorelei question whether justice is worth pursuing, or if this kingdom is worth saving at all.Product SpecificationsKeep up to date with related content where you see this icon.Click to Watch and get regular updates… find out moreAuthor Allison SaftGenresFantasyRomancePromotionFeatured Books 28/02/2025PublisherDaphne PressSignerAllison SaftTypeBooksBindingHardbackCat. No.6873912ISBN9781837840618"
