el to the Sunday Times bestselling Sword Catcher by Cassandra Clare.\nHis life is an illusion. Her lie is a gamble. Can two outliers save a kingdom?\nThe royal court is in turmoil following a massacre. Kel, Prince Conor’s body-double, is hunting for traitors. And the notorious Ragpicker King, ruler of the dazzling city of Castellane’s criminal underworld, holds the only clues. But they lead to a dark conspiracy to destroy the royal family, headed by the man due to marry the woman Kel loves.\nLin will be judged after claiming to be the legendary Goddess Reborn and wielder of powerful magic - now her people’s charismatic leader is ready to test her powers. Failure will mean exile, and only further dangerous deception can save her now.\nAs the simmering tension in Castellane reaches fever pitch, Prince Conor demands that Lin heal his father’s madness. But the King is tormented by an ancient magic and Lin cannot deny its allure, any more than she can deny her growing passion for the prince.\nLin and Kel must decide who they can trust. Yet any false move will mean death, or worse…\nLose yourself in a vibrant world of power, intrigue and magic in this spellbinding fantasy from an internationally bestselling sensation.","image":"https://media.forbiddenplanet.com/products/05/83/85ae7ff128ea76b11e00bf13298f83b71298.png","mainEntityOfPage":"https://forbiddenplanet.com/447850-the-chronicles-of-castellane-book-2-the-ragpicker-king-forbidden-planet-exclusive-digitally-signed-edition-hardcover/","name":"The Chronicles Of Castellane: Book 2: The Ragpicker King (Forbidden Planet Exclusive Digitally Signed Edition Hardcover)","url":"https://forbiddenplanet.com/447850-the-chronicles-of-castellane-book-2-the-ragpicker-king-forbidden-planet-exclusive-digitally-signed-edition-hardcover/","category":"Books > Fantasy","gtin13":"9781529001433","mpn":"","offers":{"availability":"https://schema.org/PreOrder","price":19.0,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition"