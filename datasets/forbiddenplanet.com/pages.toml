h-quality materials and featuring a ribbon bookmark, and a little chaotic customisation, this journal is the perfect gift for those who embody the spirit of the City of Progress. \n192 RULED PAGES: Lined pages for notes, journaling, scientific theories, and council speeches \nLAB-PROOF QUALITY: With sturdy construction and high-quality, heavy-stock paper, this journal will last through years of experiments . . . just don’t drop the Hextech crystal! \nRIBBON BOOKMARK: Distinguished ribbon bookmark keeps your records safe, orderly, and easy to revisit. \nGREAT GIFT: A gorgeous collector’s item faithfully recreated from the show, this high-quality journal is fit to put on display or gift to any Arcane or League of Legends fan.","image":"https://media.forbiddenplanet.com/products/6d/45/4e4c72cc99c63489c16e78bc58c84db15cb2.jpg","mainEntityOfPage":"https://forbiddenplanet.com/448456-arcane-inventors-journal-hardcover/","name":"Arcane: Inventor's Journal (Hardcover)","url":"https://forbiddenplanet.com/448456-arcane-inventors-journal-hardcover/","category":"Home & Gifts > Stationery","gtin13":"9798886635546","mpn":"9798886635546","offers":{"availability":"https://schema.org/PreOrder","price":13.99,"priceCurrency":"GBP","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Offer"},"productID":"isbn:9798886635546","releaseDate":"2025-03-17","reviews":[],"sku":"6779740","itemCondition":"https://schema.org/NewCondition","@context":"https://schema.org","@type":"Product"}Sticker Hello Kitty: Puffy Gadget Decals £4.99Stationery {"description":"Let your favourite Sanrio character take over your tech with these Hello Kitty Puffy Gadget Decals.\nThe 32 squishy vinyl stickers have a tactile 3D finish and bring the adorable Hello Kitty to life. With a selection of poses and charming accessories, add some personality to your phone, laptop and gaming console.\nThe Hello Kitty Puffy Gadget Decals will bring a sprinkle of irresistible cuteness to your e