description = "Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job."
full_description = "Forgejo monthly update - January 2025 11 February 2025 newsreport New releases, improvements to the website and an update to the current state of federation in Forgejo. January was a productive month that ended in preparations to FOSDEM and allowed some team members to meet in real life for the first time. Read more → Forgejo Security Releases v10.0.1 and v7.0.13 8 February 2025 releasessecurity The Forgejo v10.0.1 and v7.0.13 releases contain critical security fixes related to permissions enforcement of web endpoints. Read more → Forgejo v10.0 is available 16 January 2025 releases Forgejo v10.0 is available. TOTP secrets were made more secure. The UI was made more accessible and reworked to improve the UX. Searching users, repositories, releases and issues was improved. Low German (Plattdüütsch) translation was completed. This is the last version to allow a transparent upgrade from Gitea v1.22 or lower. Read more → Forgejo monthly update - December 2024 5 January 2025 newsreport All the best for the new year from Forgejo. We are in the preparations for the upcoming v10 release, have improved testing and automation. A a big thanks to everyone who makes Forgejo a success, including upstream projects and libraries Forgejo depends on. Read more → Gitea 1.22 is the last version to allow a transparent upgrade to Forgejo 18 December 2024 news The Forgejo v10.0.0 release to be published 15 January 2025 supports upgrade from Gitea instances up to version v1.22 included. Future Forgejo versions will not support upgrades from Gitea instances running version v1.23 or above. Read more →"
