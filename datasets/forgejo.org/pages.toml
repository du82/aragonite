["https://forgejo.org/privacy-policy"]
title = "Privacy Policy | Forgejo – Beyond coding. We forge."
description = "Information we collect"
full_description = "Privacy PolicyInformation we collectYour contributionsCookies and AdsOther Third PartiesLinks to Third Party WebsitesSecurityChanges to This Privacy PolicyContact Information Privacy Policy Forgejo takes your privacy seriously. To better protect your privacy we provide this privacy policy notice explaining the way your personal information is collected and used. Information we collect This website does not track information about its visitors. We do however host this site on an external hosting provider. See Other Third Parties for details. Your contributions For all data you contribute to Forgejo (for example code, page content, people profile), you have full responsibility and control to add, modify and create this data. If some of your data cannot be modified by you, this is considered a technical bug that needs urgent fixing. Please report all issues to the Forgejo Issue Tracker. Contributions are subject to a Developer Certificate of Origin. Cookies and Ads This website does not use cookies, hidden pixels or any other trackers. We certainly do not include ads anywhere on our website. Other Third Parties The website source is hosted on Codeberg under a minimum-collection policy. All site data is subjected to the Codeberg Terms of Use. Please read the Codeberg Privacy Policy. Links to Third Party Websites We have included links on this website for your use and reference. Following these links may lead to the REFERRER URL to be added to their server logs. We are not responsible for the privacy policies on these websites. You should be aware that the privacy policies of these websites may differ from our own. Security The security of your personal information is important to us, but remember that no method of transmission over the Internet, or method of electronic storage, is 100% secure. While we strive to use acceptable means to protect your personal information, we cannot guarantee its absolute security. Changes to This Privacy Policy This Privacy Policy is effective as of 2022 and will remain in effect except with respect to any changes in its provisions in the future, which will be in effect immediately after being posted on this page. We reserve the right to update or change our Privacy Policy at any time and you should check this Privacy Policy periodically. If we make any material changes to this Privacy Policy, we will notify you by placing a prominent notice on our website for a period of time and document the change on our repository README. Contact Information You can reach out to us by creating an issue in our tracker or sending an email to contact@forgejo.org"
year_published = 2025
