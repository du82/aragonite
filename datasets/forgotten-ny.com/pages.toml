title = "Contributors - Forgotten New York"
description = "Webmaster Kevin Walsh was born in Brooklyn while Elvis Presley was just getting popular. Walsh graduated from St. Francis College and obtained a certificate from the Center of the…"
full_description = 'Contributors by Kevin Walsh May 11, 2011 Webmaster Kevin Walsh was born in Brooklyn while Elvis Presley was just getting popular. Walsh graduated from St. Francis College and obtained a certificate from the Center of the Media Arts. He began initial prep for Forgotten New York in 1998 and the site launched March 26, 1999. FNY’s purpose is to highlight neighborhoods, objects and aspects of New York City that have gone ignored or unnoticed by other guidebooks, websites, and articles. FNY has been profiled in all of NYC’s daily newspapers, and has been mentioned by name in columns by the New York Times‘ Christopher Gray and David Dunlap and by the New York Sun‘s Francis Morrone. It has twice been named to the Village Voice‘s Best of NYC list. It has also been cited by PC Magazine‘s Top 99 “Undiscovered” websites. For its 20th anniversary, Kevin and FNY were profiled in the New York Post (Hana Alberts) and AMNY (Lisa Colangelo). Forgotten New York won the first annual Outstanding Website award from the Guides Association of New York City in 2015. I appeared on Frank Morano’s Other Side of Midnight radio show on WABC on May 9, 2022, on the Brian Lehrer show on WNYC October 23, 2006, and numerous additional media appearances in the USA and Canada. FNY Correspondent Christina Wilkinson is a 5th generation native of Maspeth, Queens. As Chair of the Juniper Park Civic Association’s Committee to Save St. Saviour’s Church, she led a citywide educational effort about the importance of the Richard Upjohn-designed chapel and the historical figures connected to it. The battle drew the public’s attention toward inequities in the landmarking process. In 2007, she founded the Newtown Historical Society and has been its president ever since. Currently, Christina is the communications officer for the COMET civic association (Communities of Maspeth and Elmhurst Together) and is actively involved in many community issues. FNY Correspondent Gary Fonville (February 10, 1952 – October 31, 2024) was born in New Bern, NC on February 10, 1952 and entered the NYC Public Schools in 1958 but only attended for two years.He attended SUNY at New Paltz, graduating in 1975. After graduation, married wife Rebecca and worked in the educational field until 1982. In October, 1982 he began working for the NYCTA as a Bus Operator and worked in that capacity until October, 2003 when health issues forced him to be reclassified to the position as a TPPA (Transit Property Protection Agent). His new hobby, photography, came about by being a contributor to FNY and snapping many photos in the process. FNY Correspondent Sergey Kadinsky was raised in Queens and works as an analyst at NYC Parks Department and adjunct professor of history at Touro College. He is the webmaster of Hidden Waters Blog, and his book Hidden Waters of New York City was released by Countryman Press in 2016. FNY logo designer Steve Soldwedel is a web developer and graphic artist living in Brooklyn. He received his BA in Journalism from Michigan State University and a Master of Arts in English (Creative Writing) from the City College of New York. A snapshot of his work can be found at soldwedel.net I’d be remiss if I didn’t list illustrator Danny Hellman, whose caricature of your webmaster (left) has appeared occasionally on this site, as well as on my Facebook and Huffington Post pages in the past. Danny’s art has appeared in dozens of magazines and publications over the last thirty years. FNY would also like to thank Adam Kizer, who designed the site’s present appearance, our partnership with the Greater Astoria Historical Society, and Michael Synan of Open Wave Digital, who has provided assistance with inevitable internet issues. Additionally, DeeAnne Gorman and Rich Melnick of GAHS have assisted in co-hosting duties on Forgotten NY tours. Latest update: 8/3/2023 Share FacebookTwitterPinterestLinkedinEmail Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
