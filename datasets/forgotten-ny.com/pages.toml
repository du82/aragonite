full_description = 'Forgotten Slices TAPS MANSION, MIDTOWN NORTH by Kevin Walsh February 18, 2025 February 18, 2025 YOU can find connections in NYC in places that are miles apart. Take #36 West 56th Street, a Queen Anne -style mansion built in 1882 by architect Bruce Price for Dr. William J. Morton, one of the world’s first X-ray experts, in an era when this part of Manhattan was suburban, almost pastoral; now it’s heavily commercialized, with some of the tallest buildings in human history built nearby. For several months in 2019, I worked at a small design firm in the “MONY MONY” Mutual of New York building, 1740 Broadway at West 54th, whose sign inspired Richie Cordell and Tommy James to write and record “Mony Mony.” At lunch hour, I’d walk around and aim the camera around, and I was amazed to find pockets of 1880 amid all the 2010s architecture. From here, let’s go almost 70 blocks uptown, to Sakura Park. While Grant’s Tomb and Riverside Church get all the tourist attention along Riverside Dr. at W. 122nd Street, this small park featuring cherry trees reflects a friendship the USA had with the nation of Japan early in the 20th Century that was severed by the attack on Pearl Harbor in 1941, but resumed after World War II. “Sakura” means “cherry blossom” in Japanese, and the Committee of Japanese Residents in New York was planning to import 2000 cherry trees to give to the city in 1909 as part of the Hudson-Fulton Celebration, which is little-remembered today, but was a large citywide celebration held from September 25th to October 9th that year on what was the 300th anniversary of Henry Hudson’s arrival in New York harbor and the 100th anniversary of Robert Fulton’s demonstration of the practicality of the steamboat; numerous parades and public celebrations were held, among them what was to be called the Parade of Ships on the Hudson River. Tragedy occurred with that first shipment of cherry blossoms, which was lost at sea; a new shipment was brought in 1912, and many of the present cherry trees in Sakura and Riverside Parks descend from that original planting. Among Sakura Park’s highlights are a stone Japanese tori, toro, or lantern, a gift to the park by the City of Tokyo in 1960 and a common element in many Japanese gardens. Somewhat incompatibly in the otherwise Japanese-themed park is the presence of Gutzon Borglum’s statue of Major General Daniel Butterfield (1830-1901) who distinguished himself with his service at Chancellorsville, VA and at Gettysburg, PA in 1863, where he was wounded. Butterfield is perhaps best remembered as the composer of the mournful “Taps.” Borglum went on the sculpt the massive Presidential likenesses at Mount Rushmore. By 1890, Dr. Morton had moved out of 36 West 56th, and none other than General Butterfield and his family moved in. Tragedy struck again. Fire can come literally out of nowhere. My dryer caught fire last week and I had never used it or turned it on, but it was plugged in, and a power surge or even a mouse chewing the wires set it afire. (We don’t know yet.). A stove caught fire during Butterfield’s residency in 1890 and they wound up selling the place to widow Annie Barnes Kellogg, no relation to the cereal family. During Prohibition, 36 West 56th Street was home to a prominent speakeasy, the Mona Lisa Club. Currently the ground floor features Dainobu, a Japanese imported goods shop. I feel a 56th Street Crosstown page coming on, but I’ll have to wait till it’s a bit less windy. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/18/25 ManhattanMidtown North 10 comments FacebookTwitterPinterestLinkedinEmail previous post ELECTRIC CARS, MIDTOWN NORTH next post 3 MILE MARKER, MIDWOOD 10 comments chris February 19, 2025 - 9:52 am Or the time in the movie Midnight Cowboy Joe Buck looks out his hotel window and sees the MONY sign and thinks thats how money is spelled.What a dumbass Reply redstaterefugee February 19, 2025 - 10:46 am You own a clothes dryer but you’ve never used it?! Has your co-op board of directors permitted you to install a clothesline or do you visit a laundromat for your washing/drying needs? Pardon me; my washer/dryer unit just signaled that our laundry is ready. BTW: A former Staten Islander who lives here once informed me that she has never used her dishwasher because she doesn’t know how to operate it (& she’s probably too fearful to learn). Reply Kevin Walsh February 20, 2025 - 9:18 am I used to haul laundry to the laundromat 6-7 blocks away. Since the Pandemic I got used to spening a little extra for a service to clean and deliver for a little extra. When I bought the apartment I had a dryer but no washer. I suppose it’s on me, I should have had the dryer removed years ago. We have washer/dryers elsewhere on the property but I never wanted to bother to learn how to use them or buy detergent, or ascertain what soap goes with what. Reply redstaterefugee February 20, 2025 - 11:20 am Use a liquid detergent with bleach for linens and underwear & just detergent for colors. The washer-dryer controls are self-explanatory. Follow this sage advice & you’ll discover that your cost of living is lower & discretionary income is a good thing. Also, your confidence level & self-esteem will improve. Reply Kevin Walsh February 20, 2025 - 2:03 pm TMW Reply therealguyfaux February 19, 2025 - 4:47 pm That statue looks more like an Admiral. Reply chris February 20, 2025 - 12:59 pm Yeah,by the time of the Civil War army men no longer wore that type hat.Something doesnt add up. Reply S.+Saltzman February 20, 2025 - 2:33 pm I wonder if the Butterfield telephone exchange was named after the General? The BUtterfield 8 exchange operated out of the telephone central office located at 208 East 79th Street, along with REgent 4, RHinelander 4, REgent 7, TRafalgar 9, LEhigh 5, YUkon 6 and UN 1. (As of September, 1962). Reply snoh February 20, 2025 - 7:15 pm Apparently Japanese stone lanterns are called “toro”. A “tori(I)” is the gate at the shrine entrance. You know the ones that look like a large pi symbol. Reply Sheila Wolak February 23, 2025 - 2:04 pm In 1971 & ‘72 I shared an apartment at 31 W. 56th street. Loved it! The building was erected by the Leiman family in the early 20th century, in the Beaux Arts design. It was one of 2 buildings on that street still heated by coal. My boyfriend (now my husband) shoveled the coal after our landlord died suddenly. Soon afterwards, all the tenants had to leave in ‘72 because the building had been sold. I am very grateful that I had the opportunity to live there! It was so elegant! I loved the winding, marble staircase in the lobby & 17-foot ceilings. It’s a shame that the building was demolished and that the historic homes are gone. Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
