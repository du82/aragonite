["https://forgotten-ny.com/2025/02/covington-wheelies"]
title = "Covington Wheelies - Forgotten New York"
description = "Castirons were produced by the thousands by the Covington Machine Company in the 1920s and shipped to major cities on the East Coast"
full_description = 'Out of TownStreet Lamps COVINGTON WHEELIES by Kevin Walsh February 26, 2025 February 26, 2025 LARGE cast-iron stoplights I call “Wheelies” first began to show up in the late 1920s as wide boulevards began to appear and traffic got heavier. They appeared on narrower roads as well. I initially thought that the wheel design in the ironwork was a nod to the nautical nature of NYC’s oceanside location, but many Forgotten Fans have written and said they believe it represents an automotive car wheel used in the 1910s-1920s. These models were still somewhat common by the early 1960s, but by then, the guy-wired poles were supplanting them at a rapid rate. Recently, Forgotten Fan Scott Swett passed along some photos of Main Street in Covington, Virginia, where in the 1990s, the Alleghany Historical Society (then Covington Historical Society) placed reproductions along Main Street to commemorate the town’s industrial history. Per the Historical Society, castiron streetlamps were produced by the thousands by the Covington Machine Company in the 1920s and shipped to major cities on the East Coast. This was easily accomplished as The Chesapeake & Ohio railroad ran through the city. It’s possible that all of NYC’s castirons were produced in and shipped from Covington. Covington is Virginia’s second smallest city at under 6000 residents. It’s located in the northern part of the state on the Jackson River near the West Virginia border. I confess I had never heard of it previously, but that’s true of 98% of American towns. Covington’s retro “Wheelies” are a near exact match of NYC’s fleeting few remains; but as you can see the mast is shorter and while the rest of the post is painted black, the actual wheels are green. Scott Swett also passed along a shot of an original Wheelie he found in his yard, placed there by the original owner when the house was built in 1924, when he purchased his property. I wonder if the NYC Department of Transportation could acquire a batch and equip them with modern 3-color stoplights. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/26/25 CovingtonVirginia 3 comments FacebookTwitterPinterestLinkedinEmail previous post FOXED LIQUORS, BEDFORD-STUYVESANT next post DIAMOND’S, CONEY ISLAND 3 comments Ludvig Schnee February 27, 2025 - 12:04 am I remember seeing a few of those in Williamsburg, Brooklyn when I was a little boy. They always held traffic lights. I always thought they resembled the wood “artillery” wheels used by so many auto manufacturers back in the 1920s. Reply therealguyfaux February 27, 2025 - 9:15 am A wagon wheel, I would have guessed? Reply Scott Swett February 27, 2025 - 11:52 am The streetlamp in my yard (in Covington, Virginia) was placed there by the original owner when the house was built in 1924. He was an attorney who did a lot of work for the big paper mill here and for other industries in town. One more badly rusted Wheelie sits in front of a house a couple of miles west of town. Other than those and the ones you found in NYC I’m not aware of any other surviving originals. Some may still exist in other East Coast cities. Also, based on a web search I think the wheels represent a 1920s car wheel rather than a 1920s steering wheel. Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-re