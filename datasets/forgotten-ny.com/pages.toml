full_description = "One Shots VOTE IS IN… OUTSTANDING NYC WEBSITE! by Kevin Walsh March 3, 2015 by Kevin Walsh March 3, 2015 70 comments I’m honored and humbled (by the way, why do people say “I’m humbled” when they win an award? About twenty years ago, I was truly humbled at a bus stop… Read more I’m honored and humbled (by the way, why do people say “I’m humbled” when they win an award? About twenty years ago, I was truly humbled at a bus stop… I’m honored and humbled (by the way, why do people say “I’m humbled” when they win an award? About twenty years ago, I was truly humbled at a bus stop… NYC Lincoln Log [SpliceToday] Know Your Washington Place [SpliceToday] The Street They Can’t Spell [SpliceToday] 14th Street Beat [SpliceToday] Thank you to all our donors that continue to support Forgotten NY. To make a donation, please use the button below."
