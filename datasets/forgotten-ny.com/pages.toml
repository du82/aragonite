full_description = 'Ads ELECTRIC CARS, MIDTOWN NORTH by Kevin Walsh February 17, 2025 February 17, 2025 A painted ad at #315 West 53rd Street between 8th and 9th Avenues has perplexed me since I first saw it when I worked in the area between June and December 2019. It’s either very old, as I suspect, or was painted to look that way for a movie set. Its worn condition indicates it’s the former. Just enough paint has worn off to make it tantalizingly difficult to make out. We’ve got “Croton,” “Nights,” “From 100 to…”, “Discount for Cash,” “Electric Cars Pass Premises,” “To Depot,” “Commutation Grand Central,” “60 Rides for $7.00” (real money when this was painted), “Call For Map.” The ad was revealed when a layer of whitewash was removed sometime in 2016, according to Street View. My guess it has something to do with streetcars; long ago, there was a streetcar depot a block north on West 54th. I should also add that between 1890-ish and 1942, en elevated train, a connection between the 6th and 9th Avenue Els, rumbled above the street and depending on the height of the tracks, this ad may have been visible from passing cars. For more info, see #10 in this post from Untapped Cities. What say you? comments are open. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/17/25 ManhattanMidtown North 10 comments FacebookTwitterPinterestLinkedinEmail previous post TWIN CORVINGTON, MIDTOWN SOUTH next post TAPS MANSION, MIDTOWN NORTH 10 comments Peter February 18, 2025 - 6:04 am Electric cars had some degree of popularity in the early 1900’s. They were especially popular with women, who often hated the balky crank starters on gasoline cars. While most electrics had limited ranges that usually was enough for urban driving. With the invention of modern key starters just before the First World War sales of electric cars plunged. Reply michael giaquinto February 18, 2025 - 7:30 am Given the reference to “Croton”, which I believe is or was the point at which trains on the Hudson line using diesel or coal-fired engines switched to electric engines, I wonder if this may be an ad for a then new apartment building highlighting the appeal of being passed by clean and quiet “electric cars” for “commutation” to and from “Grand Central”? The “Discount for Gas” reference is baffling though. Reply Johnny February 18, 2025 - 2:45 pm A Parking garage//Gas station? Reply Pete February 18, 2025 - 8:29 pm I changed the contrast in Photoshop. This is what I could decipher SALES CROTON NIGHTS From 190 to 290 13ms. Discount for Gas ELECTRIC CARS PASS PREMISES TH DEP. of Commutation Grand Central. 60 Rides for $7.00 Call for Map Reply Joseph Ditta Jr February 19, 2025 - 6:28 am Everyone seems to be missing the “FOR SALE” which is almost invisible at the top. “Electric cars pass premises” and “Call for map” would indicate this is an ad for a real estate development. Reply Kevin Walsh February 19, 2025 - 8:18 am So that means streetcars or the el pass by this property? Reply Joseph Ditta Jr February 19, 2025 - 11:28 pm Yes, it seems (to me, anyway) that they’re advertising how easily accessible the property is. Reply Jerry Friedman February 20, 2025 - 1:47 pm “Discount for cash” maybe? Although don’t know if that would have been a thing in that era….. Reply Jerry Friedman February 20, 2025 - 1:51 pm And could the ad be saying the property is served by “Croton” system water (I e good quality). Was Croton water not universally supplied in Manhattan at this time? Reply Pete February 21, 2025 - 12:52 pm One more try: FOR SALE CROTON WASHINGTON HEIGHTS From 100 to 250 On Easy Terms. DISCOUNT FOR CASH ELECTRIC CARS PASS PREMISES TO DEPO F. Commutation Grand Central 60 Rides for $7.00 Call for Map Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
