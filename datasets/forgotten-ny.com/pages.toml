full_description = 'NeighborhoodsOne Shots BIG NOSE KATE’S, ROSSVILLE by Kevin Walsh February 23, 2025 February 23, 2025 SADLY I have never visited Big Nose Kate’s, a saloon way out in Rossville, at 2484 Arthur Kill Road, tucked near the huge Old Bermuda catering hall next to the West Shore Expressway. Vincent Signorile, the last of the three owners the inn has had since opening in 1994, decided to close it at EOB on February 20, 2025, though he plans to reopen another tavern elsewhere. I am always saddened to hear of neighborhood joints closing, and Big Nose Kate’s location has had an unusual history. “Big Nose Kate” was a real person, a prostitute who was an associate of Doc Holliday (himself the namesake of a “dive bar” on Avenue A in the East Village), a Hungarian immigrant named Mary Katherine Haroney; her aquiline nose gave her her nickname. Among other things in a colorful life, Big Nose Kate herself is remembered for the aftermath of a card game and bar fight involving her boyfriend at the time, Doc Holliday. Doc knifed a man supposedly in self-defense. As a result, long story short, Holliday was held in a guarded hotel room and Kate “with a pistol in each hand, disarmed the guard and the two escaped,” as per Bignosekatetombstone.com. Kate died at 89 and is buried as “Mary K. Cummings” in Prescott, Ariz, in 1940. [SILive] Kate herself isn’t the only Hungarian association with the building. According to urban chronicler Nathan Kensinger, “this simple wooden structure was built circa 1855, and was a chapel for St. John’s Methodist Episcopal Church. In the 1930s, it became home to the Magyar Reformed Church of Rossville, with a Hungarian congregation that had split off from the Magyar church in nearby Kreischerville.” And, according to the SILive article, “A bell has remained in its rafters since those pre-bar days of prayer and worship.” It’s a long journey from church to saloon, and reportedly the building’s next purpose will be as a dental office; hopefully the building is retained and not demolished. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/23/25 RossvilleStaten Island 1 comment FacebookTwitterPinterestLinkedinEmail previous post FORSYTH FORESIGHT next post St. PAUL’S CHURCH SIGN 1 comment Edward February 24, 2025 - 1:43 pm Imagine navigating those steps at 11pm when you’ve had a beer or twelve! Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
