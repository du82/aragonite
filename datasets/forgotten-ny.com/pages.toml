description = "FNY's New York City tours offer a different kind of tourism; one that values not the City's looming landmarks, but everything else within it. Join us!"
full_description = 'FNY 2025 Tour Schedule by maggiemel February 21, 2015 Forgotten NY is currently doing occasional online tours, and I have been doing in-person powerpoint programs as part of Forgotten NY’s 25th anniversary. I do not rule out an occasional live tour, as FNY’s 154 live tours were well-received from 1999-2019 and educated and entertained hundreds if not thousands of Forgotten NY fans. Live tour info: Locations subject to change. All tours run approximately 2 to 2-and-a-half hours unless noted. Note: MTA train schedules on weekends, as well as tour dates, are subject to change. Live tours cost $15 for Greater Astoria Historical Society members, $20 for non-members. RSVP for whichever tours you wish to attend to info@astorialic.org or Kevin Walsh at erpietri@earthlink.net or kevinjudewalsh@gmail.com. On individual tour pages I will have an easy payment Pay Pal box. However, walk-ups are always welcome! Share FacebookTwitterPinterestLinkedinEmail 10 comments A Forgotten Saturday | Brooklyn Locavore August 12, 2012 - 11:00 am […] Forgotten New York’s Kevin Walsh (a Bay Ridge native!) is known for chronicling the sometimes unnoticed details of the city such as painted building ads, decades-old lampposts, 18th-century houses, abandoned subway stations, trolley track remnants, out-of-the-way neighborhoods, and flashes of nature hidden in the midst of the big city. His book, Forgotten New York: Views of a Lost Metropolis was originally published in 2006 and is now in its 5th edition (2011). He also hosts series of walking tours several times a year. Check out Forgotten New York’s website. Check out this year’s schedule. […] Reply A Nice Pair in Richmond Hill | Brownstoner Queens July 1, 2014 - 10:04 am […] fifty Forgotten New York fans converged on Richmond Hill for the eightieth Forgotten New York tour in a series that goes back to June 1999. New York City, at one time or another, has had three […] Reply Blair Russell March 3, 2017 - 8:15 am Would love to get on your tour mailing list thanks Reply Jami Bernard April 17, 2017 - 1:16 am Yay I’m in for Spuyten Duyvil! Reply Anonymous April 18, 2017 - 11:59 am Im interested in the Saturday Night Fever tour. Did I miss the start time? Reply Kevin Walsh April 18, 2017 - 10:03 pm Moved to Saturday May 13th. Most of my tourgoers are walkups. Reply Rabir Zreig September 6, 2018 - 9:41 am Hey there, In one of my guides it says that the tours are free, but on this website 15$ are listed per person. Can someone tell me what is accurate now? Thank you, best regards Rabir Reply Kevin Walsh September 7, 2018 - 10:03 am Tours are $20, $15 for Greater Astoria Historical Society members. On what page does it say they are free? I have to fix that, wherever it is. Reply Stefanie January 4, 2019 - 2:21 pm When do the 2019 tours start? Reply Kevin Walsh January 4, 2019 - 11:14 pm Working on a list of this year’s tours. Usually they start in April. Also working on a method you can preregister and prepay using PayPal. Hoping for a list in mid-February. Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"