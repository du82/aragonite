title = "KNOW YOUR LAMPPOSTS: THE TWINLAMP - Forgotten New York"
description = "The Twin, originally produced for use on 5th Avenue at the dawn of the electrified lamppost era in the 1890s, originally had a different design (the mast of one of…"
full_description = 'One ShotsStreet Lamps KNOW YOUR LAMPPOSTS: THE TWINLAMP by Kevin Walsh August 22, 2012 August 22, 2012 The Twin, originally produced for use on 5th Avenue at the dawn of the electrified lamppost era in the 1890s, originally had a different design (the mast of one of those originals can still be seen at the NE corner of 5th Avenue and East 23rd Street at Madison Square). Later, a modified design that set the template for subsequent Twinlamps appeared on 5th Avenue, and by the time 5th Avenue’s Twins were torn down in 1965, it was about 50/50 between the originals and the modifieds. Both the original and modified Twin designs can be seen scattered around town throughout the 20th Century. The Twin was a favored design for roads with a separated median, and was used on roads that had them such as Queens Boulevard. By the late 20th and early 21st Century, older Twins had become rare and could be found on occasion on 5th Avenue and City Hall Park, with lone wolves on 6th Avenue and Amsterdam Avenue uptown (the latter a monumental Twin that was only used at major intersections). However, the City began installing new Twins on a limited basis, like this one on West 42nd Street in front of Bryant Park, and also on Central Park West from Columbus Circle north to West 81st Street. These new Twins have garlands winding around the shaft, which wasn’t in the first Twin designs. 8/22/12 10 comments FacebookTwitterPinterestLinkedinEmail previous post WOODLAWN HEIGHTS TO RIVERDALE next post WOODLAWN HEIGHTS TO RIVERDALE (Part 2) 10 comments Wayne Whitehorne August 22, 2012 - 6:15 pm The retro Twinlamps on CPW were placed after the Cat In The Hat balloon accident, replacing the fake Corvingtons that proved to be less than sturdy in an accident. To give the balloons extra clearance, these Twins are placed sideways (parallel to the sidewalk). They extend from Columbus Circle all the way to West 81st Street. regards, Wayne Reply Glen Norman August 24, 2012 - 1:44 am A few years ago, when the Macy’s Parade route was switched to Sixth Avenue, I recall the mast arms on the retro twins between 40th and 42nd Streets being rotated 90 degrees so that they too were now parallel to the street. (The corner-most poles at 40th and 42nd were not flipped). Yet last year when I went by, the arms had been rotated again, back to their “normal” positions. Anyone recall that? (Or, was I just having another one of my episodes)? Reply Ken B August 27, 2012 - 6:35 am While you may also be having another episode you are correct about the rotation of the mast arms. Immediately before the Macy*s Parade the DOT rotates all the arms to clear the streets of overhangs on the parade route. Sometimes this will require contractors to make temporary changes to existing sidewalk shed protection to make the arms accessible. Immediately after the parade the process is reversed, including restoration of any modifications to sidewalk sheds. Reply Glen Norman December 18, 2012 - 10:38 pm And this year, my walk-by in mid-December revealed the mast arms had been rotated again–parallel to the street. This time, the corner lights were flipped, too. NYCDOT is a little late in returning them to their normal position. Then again, I guess the City has more important matters to deal with these days. Reply Roger_the_Shrubber August 24, 2012 - 1:52 am The old-style lamp posts are aesthetically pleasing and make the city a more attractive place to live. It seems the word “progress” these days means anything new that is uglier, blander and more soulless than what came before. I am always suspicious of anything described as “progressive.” Reply Eric August 30, 2012 - 9:17 pm Those are not “acanthus garland winding around the shaft”. They don’t wind nor look like that. Reply Kevin Walsh August 31, 2012 - 4:14 pm What do they look like to you? Reply Chris L. September 12, 2012 - 10:48 am Looks like garand to me. Reply D.B. September 7, 2012 - 10:32 pm Why aren’t this type used instead of the clumbsy, stupid looking twin Corvington design? Reply Daniel Cronin October 24, 2021 - 7:15 am I believe the twin lamps and bishops crooks are a particularly elegant blending of beauty and function…unlike their grotesque 1960s successors. I was in high school at the time of their removal and wrote a letter of complaint to the city. I no longer live in NY but am delighted to see their return…I am vindicated after nearly 60 years! Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
