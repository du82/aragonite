title = "Downer's - Forgotten New York"
description = "Here's Downer's Pharmacy in 1940. The Ex-Lax etched glass signs are likely there, but hidden beneath the striped awning"
full_description = 'Forgotten Slices THREE FACES OF DOWNER’S by Kevin Walsh February 20, 2025 February 20, 2025 I got this photo at the dawn of Forgotten NY in the winter of 1998 at Bedford Avenue and North 4th, when Williamsburg was still an industrial/ethnic Eastern European stronghold, not the hipster domain and then upscale neighborhood it later became. It’s an ancient Downer’s drugstore front, with the glass Ex-Lax sign on the side window still visible. The building street signs remain though. This is the former corner of North Fourth and Fourth; Williamsburg north-south streets were originally numbered, increasing away from the river so that Kent Avenue was First Street, Wythe Second, Berry Third, Bedford Fourth, and so on. There was apparently no confusion whatever in the two numbering systems meeting in the grid. Here’s Downer’s Pharmacy in 1940. The Ex-Lax etched glass signs are likely there, but hidden beneath the striped awning. And here’s the corner in late 2024, from Street View. Right off the bat, you notice the welcome presence of sidewalk trees. If you look at photos of NYC in mid-century, the lack of curb trees is quite notable. Holding down the corner is Diptyque, an upscale perfumerie, goods that were inconceivable on Bedford Avenue in the hardscrabble area it was prior to 2000. You’ll never hear the word “perfume” in a TV ad. Manufacturers have decided the more mellifluous term is the French word, “parfum.” As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/20/25 BrooklynWilliamsburg 0 comment FacebookTwitterPinterestLinkedinEmail previous post 3 MILE MARKER, MIDWOOD next post FORSYTH FORESIGHT Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
