full_description = 'Signs FOXED LIQUORS, BEDFORD-STUYVESANT by Kevin Walsh February 25, 2025 February 25, 2025 FOR years, I’ve noticed that many liquor stores in the five boroughs have the same signage they must have had decades ago…whether they’re ceramic, painted signs or my favorite, NEON. It must just be a matter of the signs doing the same job they’ve done for many years doing just as good job now, and so the owners have no great need to replace them. Still, in an era with cheap vinyl awnings dominating most New York City storefronts, the meticulous, well-crafted liquor store signs stand out like a sore thumb. This one, at #108 Tompkins Avenue near Myrtle, is the most insanely weathered liquor store sign I’ve found yet. An electrical relay box (it appears) sits in front of the U; the LIQ is gone and the neon in the other letters are gone as well. Some time ago, “Tompkins Wine and LIquors” was changed to Foxed Liquors, as that’s how it’s listed in Yelp. When I say that liquor stores and their signs are in business a long time, I’m not kidding. The same sign appears in the 1940 tax photo. It appears to me that the vinyl or linoleum was changed out alog the way to the aqua green vinyl seen there today but the neon lettering is the same. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/25/25 Bedford-StuyvesantBrooklynliquor 5 comments FacebookTwitterPinterestLinkedinEmail previous post St. PAUL’S CHURCH SIGN next post COVINGTON WHEELIES 5 comments stephen solosy February 26, 2025 - 8:38 am The Baptist Church next door is also a solid looking old structure Reply Bill Friedman February 26, 2025 - 8:47 am If you look at the current street view….little has changed from the 1940 tax photo. https://www.google.com/maps/@40.6954666,-73.9463416,3a,75y,237.5h,101.75t/data=!3m7!1e1!3m5!1sH3JRqGP5gclJ_f6HFk2VXg!2e0!6shttps:%2F%2Fstreetviewpixels-pa.googleapis.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D-11.747554894816915%26panoid%3DH3JRqGP5gclJ_f6HFk2VXg%26yaw%3D237.50084431935997!7i16384!8i8192?entry=ttu&g_ep=EgoyMDI1MDIyMy4xIKXMDSoASAFQAw%3D%3D Reply chris February 26, 2025 - 11:36 am Looks like the kind of place where theres nothing on the shelves,you have to deal with a clerk behind a bullet proof partition,push your money through a slot at the bottom first…. Reply Michael Lagana February 26, 2025 - 10:04 pm The liquor store sign may have the same backing ,check out the panel spacing Reply Michael Lagana February 27, 2025 - 6:30 pm The sign on the liquor store may still be the original,the panels are in the same places Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
