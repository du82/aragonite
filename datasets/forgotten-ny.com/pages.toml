title = "VOTE IS IN... OUTSTANDING NYC WEBSITE! - Forgotten New York"
description = "I’m honored and humbled (by the way, why do people say “I’m humbled” when they win an award? About twenty years ago, I was truly humbled at a bus stop…"
full_description = 'One Shots VOTE IS IN… OUTSTANDING NYC WEBSITE! by Kevin Walsh March 3, 2015 March 3, 2015 I’m honored and humbled (by the way, why do people say “I’m humbled” when they win an award? About twenty years ago, I was truly humbled at a bus stop at Nostrand Avenue and Avenue R when a miscreant winged an apple out of a moving bus window and it hit me in the coconut) because Forgotten New York is the first-ever recipient of Outstanding New York City Website by the Guides Association of New York City. FNY has been associated with GANYC since 2012. The Guides Association of New York City is New York’s only organization representing licensed, professional New York City Sightseeing Tourist Guides. It’s also one of America’s oldest guides associations. The awards ceremony, at a packed Leonard Nimoy Thalia Theatre at Symphony Space, Broadway and 95th Street, March 2, 2015, attracted the cream of NYC-based websites, authors, tourguides, historians, restaurateurs, and many others who contribute to NYC’s status as the world capital of tourism. Among other winners were the Bowery Boys podcast and longtime New York Times Streetscapes columnist Christopher Gray. The first recent photographs of the webmaster, flapping jowls and all, were occasioned at the ceremony. My guest was my dear friend and fellow Greater Astoria Historical Society board member, DeeAnne Gorman, a renowned singer in her spare time. 3/3/15 GANYC 70 comments FacebookTwitterPinterestLinkedinEmail previous post KISSENA BOULEVARD, Part 1 next post TOYNBEE HOUSE, Lower East Side 70 comments Frank Brennan March 4, 2015 - 6:01 am Congratulations….all your hard work has always been realized by your faithful readers, but now a professional organization recognizes and honors you for it. Many thanks for all your posts….I look forward to each one (and I am particularly fond of any post that is Staten Island related). Kudos!!!!! Reply Dave D May 13, 2015 - 9:51 pm I just don’t know how you do it….and so well. Congratulations and thank you for the many many hours of enjoyment you gave me. Reply Nick Foad March 4, 2015 - 7:05 am forgotten-ny has been the outstanding NYC website for over a decade – congratulations for finally getting some recognition but mainly thanks for all the hard work… Reply Mary Beth March 4, 2015 - 9:44 am What a wonderful evening it must have been … much deserved. You looked VERY nice in your new suit … and DeeAnne stunning. Kudos to YOUdos. (Hmmm … you got bopped on the coconut with an apple, eh? Someone stole MY idea! Heh-heh. Reply Gerri Guadagno March 4, 2015 - 10:00 am How perfect that FNY was awarded at the Leonard Nimoy Theatre: LLAP! When’s the next tour? Reply Gerri Guadagno March 4, 2015 - 10:01 am How about a special Victory Tour? Reply NY2AZ March 4, 2015 - 10:09 am Congratulations. The recognition is well deserved. Reply Susan March 4, 2015 - 10:14 am Congratulations! Love this site and pass on the address to every New York person I know. Reply BobK March 4, 2015 - 11:08 am Many congratulations, Kevin! You deserve this recognition — and much more! Reply BarryT March 4, 2015 - 11:09 am Congrats on your “Oscar” win! You do a great job! Reply John March 4, 2015 - 11:31 am Great! Congratulations to the only writer in NYC that gives equal time to my native borough of Staten Island. Your site is much appreciated. Reply Mark March 4, 2015 - 12:03 pm Well deserved! You do a great job of promoting the city and honoring its past. You will be happy to know my week doesn’t start until I click on FNY. Keep up the great work Mark Reply Robert Mulero March 4, 2015 - 12:16 pm Congratulations!!!! Reply Michael March 4, 2015 - 12:40 pm Congratulations. I’ve been visiting your site since 2000. Always a pleasure to do so. Reply DeeAnne Gorman March 4, 2015 - 3:45 pm It’s an honor to know you, & was an honor to be there to witness the BIG win in person – BRAVO! Here’s to a great upcoming FNY season of tours & presentations! Reply Brian March 4, 2015 - 5:12 pm You deserve it! Forgotten NY is a daily read for me and I always share photos with family and friends to remind them of the good old days. Thanks for the enjoyment (from a New Yorker that lives far far away but remains close to the City – thanks to you.) Reply Rod Ivey March 4, 2015 - 7:30 pm Congratulations Kevin, Who is that in the picture? Your daughter? Rod Reply Kevin Walsh March 4, 2015 - 10:46 pm My pal DeeAnne Gorman… Reply nick5911 March 4, 2015 - 7:37 pm Phooey…it’s one of the outstanding websites period, not just NYC. I check in on this site often, and it doesn’t disappoint. And I’m not even from NYC. It’s very well done, informative, and entertaining. Congrats. Reply Yvonne Temann March 4, 2015 - 8:02 pm Kudos to Kevin !!!!! Reply Lynne March 4, 2015 - 8:12 pm Hurrah, my hero gets well-deserved recognition! Reply Joe Fliel March 4, 2015 - 8:54 pm Congratulations, Kevin. No need to be humble about being the best at what you do. You devote a lot of time and effort to make Forgotten New York the most informative and entertaining website, bar none. You can mail that check now. 🙂 Reply Michael Lagana March 4, 2015 - 9:06 pm All your GREAT work deserves many Awards !!! Reply Old Skool March 4, 2015 - 9:18 pm Well done my friend. Reply chris March 4, 2015 - 9:19 pm i wanna contribute dough to fny but cant cuz everything is done by computer these days-no street address to send money to,not even a PO Box,I aint sayin Im gonna make an endowment to the arts-just around $40-that might buy a few subway fares or whatnot to FNY upkeep…. Reply Ron Tyburski March 4, 2015 - 10:31 pm Congrats on the award. Your website is the greatest and as all your devoted readers will agree in that they look forward to your next posting. At one time in the past you mentioned that you were thinking of doing something about bowling alleys from the past. As an ex Brooklynite I would look forward to read about Paradise Lanes, Leemark Lanes, Prospect hall Lanes, Regal Lanes and Frankie and Johnny’s to name a few. Keep up the excellent work on the site and again Congratulations Kevin . Reply Tal Barzilai March 4, 2015 - 11:02 pm I’m glad to hear that you won Kevin, and I know that you deserved that award. Reply Jeff B. March 4, 2015 - 11:46 pm Kevin – Congratulations!!!! I’ve been coming to FNY for years and it’s always been great! – Jeff Reply Gene Murray March 5, 2015 - 12:59 am Heartfelt congratulations to Kevin Walsh from Denver, Colorado. Your site keeps my NYC hometown alive in my heart. Thanks for all you do. Reply the Cheese March 5, 2015 - 3:53 am Congratulations, Kevin! Your hard work shows in FNY; it is both a quality website and a class act. Reply Brooklyn Mel March 5, 2015 - 7:07 am WOW – My two favorite NYC sites, Forgotten NY and Bowery Boys bring home the gold. NYC history buff everywhere are elated by these acknowledgements. Reply Nigey Lennon March 5, 2015 - 9:13 am Glad to see you receiving the acclaim you so royally deserve! Reply Larry March 5, 2015 - 2:28 pm Congratulations from your Seattle contingent! Reply Ken B. March 5, 2015 - 5:50 pm The award makes official what many of us have known for years…that you are the best in the business! Reply Larry Mac March 5, 2015 - 7:33 pm Hearty congratulations on a well-deserved award, Kevin. As an old Flatbush, Woodside and Flushing creature I enjoy this site immensely. Way to go Irish! Reply steve March 5, 2015 - 10:30 pm So well deserved, congrats Kevin! Thanks to your devoted efforts I’ve learned much about NYC history, and enjoyed doing so. Reply DennisP March 5, 2015 - 11:28 pm Congratulations Kevin. FNY has been a great site for some time. Keep up the good work. Reply D March 5, 2015 - 11:35 pm Congrats, Kevin. All the boys down here at the street sign department are proud of you. Keep up the good work. Best, Anonymous DOT sign worker Reply anja March 6, 2015 - 3:42 am Congratulations and great job! Reply Edward Fenning March 6, 2015 - 3:58 am !Kevin, I offer my congratultionas as well!! Bravo!!! For 20 (right?) years your website has simply been unequaled in quality. Quality of it’s selection of pictures, text and layout – Quality of its conten! Content that is only the best! Well written text that shares your research (and enthusiasm) with all of us who follow your site! Pictures that put you “right there” from one end of a neighborhood to the other, and pictures that traverse extensive journeys along many signficant avenues and streets, and pictures that always capture the details, of a forgotten or unseen New York, apartment buildings, unusual signs, details that illustrate what makes every corner, road and alley of New York utterly unique and exciting. And you have brought this all to us, your readers. If Forgotten New York never existed, it would have to be invented….. and guess what, you invented it!!!!! Thank you so much for this wonderful piece of work – a true gallery of our city. Bravo Kevin! Ed Edward Fenning Reply RM March 6, 2015 - 12:58 pm Congratulations, Kevin! Your website brings a smile to many – especially those who live and work in this great city. Thank you, sir. Reply William Mangahas March 7, 2015 - 8:29 am My congratulations to you Kevin. What would the Big Apple be without your web site ? I shudder to think. Keep up the good work. Regards, William Mangahas Reply Renée in Tucson March 7, 2015 - 2:25 pm Kevin, it’s good to see you getting this well-deserved recognition. And thanks, as I’ve said many times before, for keeping me in touch with my old neighborhoods in Staten Island and my NYC hometown. Reply Bill March 7, 2015 - 10:54 pm Congratulation- your site is consistently remarkable. Hope it continues! Reply John P. Simonetti March 8, 2015 - 10:50 am Kevin: this award has been a long time coming! I have been visiting FNY for years now, and you certainly deserve it! The amount of time, the lengths of travel involved, and many other aspects of FNY show how hard you work at this. All of your posts are derived from actual experience in the field, so to speak. I cannot begin to tell you how much I have learned over the years…. and, just when I thought I knew it all, you showed me when I was wrong, and educated me in ways too numerous to count. CONGRATULATIONS!, and I am looking forward to many more years of your knowledge, expertise, and wit…. Reply Kevin Walsh March 8, 2015 - 11:11 am Thanks! Reply Robert Brennan March 8, 2015 - 6:33 pm mazel tov, and thanks. Reply CJ March 9, 2015 - 2:09 pm Kevin, I’ve been a loyal reader for about 15 years now and I love what you have brought to the table. Congratulations and many more years of interesting posts. Cathy Reply Kevin March 9, 2015 - 3:44 pm Well deserved congratulations from a relocated Queens boy. Reply Barry Popik March 10, 2015 - 1:55 am Congratulations! You’re the best in a great group! I solved the Big Apple and I wasn’t even nominated! Reply Don Gilligan March 10, 2015 - 3:29 pm Congratulations Kevin! Well earned recognition. You have worked long and hard at this blog. Your dedication deserves even greater recognition. This has been my favorite website for a long time now. I look forward to enjoying it for a long time. Best regards, DG Reply Kiwiwriter March 10, 2015 - 4:18 pm The honor is well-deserved and hard-earned. This is one of my favorite websites in the world. Congratulations, and may it continue forever. Reply Mike in fla via Bklyn March 11, 2015 - 4:23 pm Bravo, Kevin, Bravo!!! Reply Sharon March 11, 2015 - 11:15 pm Congratulations on a well deserved award, Kevin! Reply Jill-O March 12, 2015 - 3:29 pm Good on ya! I have been loving this site since you started it, and though I no longer live in NYC, I still look at it most weeks and I still love it. Thanks for all you do! Reply Priscilla March 12, 2015 - 5:35 pm Congratulations i love your website. The honor is deserved for your had work Reply Fred Mayer March 14, 2015 - 6:32 pm I know I’m way late to the party, but I’ve been a fan for at least 15 years and still check it every day. Congrats on the award, it should’ve happened sooner. Wish I still lived close enough to participate in the walking tours. Reply Pete Burke March 28, 2015 - 1:11 pm Congratulations Kevin! You made New York City history interesting long before it became fashionable. Here’s to many more years of FNY, one of the best sites dedicated to preserving the history of New York City. Reply John B April 6, 2015 - 10:39 am Congratulations! Well Done!! And Thank you for making the site a daily stop for me!!! Reply Fane April 20, 2015 - 8:18 am Congratulations Kevin FNY makes New York City history very interesting and a pleasure to read. It is a much deserved award and you earned it. Hopefully this will mean much bigger and greater things ahead for FNY. Thank You Fane Greater Astoria Historical Society Reply Rich H. April 22, 2015 - 2:58 pm Congratulations Kevin. Like many others I have been visiting your site for years and passing along the URL (do they still call it that?) to others inclined to things forgotten. I trust this accolade translates to more traffic for FNY, not the BQE Congrats again. Reply Bleu J. April 23, 2015 - 2:44 am Very Cool and well deserved! Reply Bob M May 11, 2015 - 3:31 pm Having grown up on Staten Island in the 1950’s and 1960’s before moving away, I’m always happy to see your photos of the old streets and buildings. Reply Tom May 28, 2015 - 10:49 pm Congrats Kevin! Well deserved. Reply Paul Nolting July 29, 2015 - 8:11 pm Congratulations, Kevin. I’ve been a regular reader for a long time. I always look forward to reading FNY. I grew up in South Ozone Park, and went to Bishop Loughlin HS in Brooklyn (on the A train). I live in NJ now but I’ve lived in 4 of the 5 NYC boroughs (haven’t lived in the Bronx) and I remember many of the places you write about and photograph. Reply Christopher Gray August 1, 2015 - 6:13 pm <<>> What kind of question is that??? It’s because you can’t bring yourself to say the truth: “OH COURSE I AM WORTH IT, WHAT YOU FINALLY NOTICED, AND WHERE’S MY TROPHY AND THE OPEN TOPPED CADDY GOING DOWN FOURTH AVENUE, YOU INSUFFERABLE INGRATS.” That’s what we’re all thinking. We just aren’t going to say it … except to each other. Kevin, et al., Vale!!! Christopher Gray Reply Christopher Gray August 1, 2015 - 6:14 pm Kevin’s question was deleted from my first post : “by the way, why do people say “I’m humbled” when they win an award?” Reply Patsy December 12, 2018 - 1:25 am One of many greatest ways to search for details would be to research online. Reply Anne Marie Giordano July 2, 2022 - 10:13 am Nobody knows NYC like Kevin Walsh. Congratulations! Reply chris September 19, 2024 - 4:50 pm Suit looks good.Looks custom made. Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/'
