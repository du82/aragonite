full_description = "NeighborhoodsOne Shots BIG NOSE KATE’S, ROSSVILLE by Kevin Walsh February 23, 2025 by Kevin Walsh February 23, 2025 1 comment SADLY I have never visited Big Nose Kate’s, a saloon way out in Rossville, at 2484 Arthur Kill Road, tucked near the huge Old Bermuda catering hall next to the… Read more One Shots COLEMAN-GRAY HOUSE, ROSSVILLE by Kevin Walsh January 30, 2025 by Kevin Walsh January 30, 2025 0 comment SOMETIMES historic buildings are hiding in plain sight. Take this unassuming two-story house on Woodrow Road and Rossville Avenue, in an area that has gone from rural to suburban to… Read more One ShotsYou'd Never Believe You're in NYC SKUNK’S MISERY, STATEN ISLAND by Kevin Walsh March 26, 2024 by Kevin Walsh March 26, 2024 7 comments WOODROW and Bloomingdale Roads in Rossville, Staten Island was once the center of a small settlement named Sandy Ground. Before the Civil War, the community was founded by New York… Read more One Shots ZEBRA PLACE, Rossville by Kevin Walsh April 22, 2021 by Kevin Walsh April 22, 2021 3 comments Zebra Place is a very short road in Rossville, running one block from Arthur Kill Road at the ancient Saint Lukes Cemetery one block east of Bloomingdale Road south to… Read more One Shots ROSSVILLE TANKS by Kevin Walsh April 22, 2021 by Kevin Walsh April 22, 2021 13 comments Though I haven’t been there for a couple of years, I have always been attracted to Rossville on Staten Island’s southwest, not least for its Ship Graveyard and several colonial-era… Read more CemeteriesOne Shots BLAZING STAR BURYING GROUND, Rossville by Kevin Walsh January 7, 2021 by Kevin Walsh January 7, 2021 5 comments I haven’t been to Staten Island in quite awhile, and when the Covid Crisis is over I might even do what I did in early 2005 when compiling photos for… Read more Forgotten Slices SANDY GROUND, Staten Island by Kevin Walsh June 25, 2014 by Kevin Walsh June 25, 2014 8 comments After wandering around northern Rossville in June 2014 I decided to probe south, curious about the enclave known as Sandy Ground, to see if anything remained of it (details on… Read more"
