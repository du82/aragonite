description = "In the post-castiron era, no more striking NYC lamppost has ever been designed. The Double Deskeys boasted a pewter color"
full_description = 'Street Lamps DOUBLE DESKEY, MIDTOWN by Kevin Walsh February 20, 2024 February 20, 2024 PERIODICALLY, I post about the dwindling number of twin 5th Avenue Donald Deskey-designed lampposts; I did so in 2013 and 2016, and in the former year I listed the locations of the surviving ones. I believe we’re now down to about five or six; when they fail or are knocked down, they are replaced with whatever the Department of Transportation has lying around in the lamppost yard (after the one I knew about in LIC on 37th Avenue moved out a few years ago, I don’t know where the DOT stores its poles these days; Comments are open). There’s this one, at 5th Avenue and East 47th, and there’s one at the prominent corner of 5th and West 42nd, and one in front of the Trump Tower. In the post-castiron era, no more striking NYC lamppost has ever been designed. The thousand of Deskey poles around town were silver-colored and had one mast. The 5th Avenue Specials boasted a pewter, or brown color, and had a special attachment at the apex that held two S-shaped masts and could also hold fire alarm indicator lamps, stoplight masts as here, and even flags. At first, all held M400 GE mercury lamps, which were later replaced by various makes of yellow sodium lamps. The few that remain were fitted with LED lights a few years ago. New York City desperately needs a new lamppost design exclusively for the Queen of Avenues. The famed castiron Twinlamp debuted in 1896, and the Double Deskey Special in 1965. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. Take a look at the new JOBS link in the red toolbar at the top of the page on the desktop version, as I also get a small payment when you view a job via that link. 2/20/24 ManhattanMidtown 2 comments FacebookTwitterPinterestLinkedinEmail previous post PHIL’S STATIONERY, MIDTOWN next post BATTLE AX OF LIC 2 comments Alan Greenstein February 21, 2024 - 8:13 am Interesting to note that I have not seen any retro (I prefer the term “faux”) twinlamps on Fifth Avenue. Reply Kevin Walsh February 21, 2024 - 2:37 pm They are on 42nd, 6th and 41st and also CPW up to 72nd Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
