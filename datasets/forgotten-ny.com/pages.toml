description = "My name is Kevin Walsh. After a 35-year residency in Bay Ridge, where I witnessed the construction of the Verrazano Bridge as a kid, I moved to Queens to be…"
full_description = 'About by Kevin Walsh May 2, 2011 My name is Kevin Walsh. After a 35-year residency in Bay Ridge, where I witnessed the construction of the Verrazano Bridge as a kid, I moved to Queens to be closer to a job as a copywriter/graphic designer at a well-known direct marketer in Long Island. That job has disappeared but FNY has endured. I had been noticing ancient advertising and unremarked-upon scenes in New York City for years, but it wasn’t till I moved to Flushing and saw the ancient remaining Victorian and older buildings that stand among the cookie cutter brick apartments that I put two and two together and noticed there was no one out there who was really calling attention to the artifacts of a long-gone New York. FNY began principal photography throughout 1998 and launched in March 1999. Within weeks, it was profiled by David Kirby in the New York Times, and FNY began a slow yet steady build in readership. In 2006, HarperCollins published Walsh’s book Forgotten New York: Views of a Lost Metropolis, which is, as of 2011, in its 5th printing. Forgotten NY is always in great debt to its contributors, especially Forgotten NY correspondent Christina Wilkinson, retired NYC bus driver Gary Fonville, Sergey Kadinsky, Mike Olshan, Jean Siegel and many other Forgotten regulars. Forgotten New York reviews and articles: “His Kind of Town,” Francis Morrone, New York Sun, October 25, 2006 “A Rare Look Behind the Gates,” Robert Worth, New York Times, March 22, 2004 “Right Under Your Nose,” radio interview with Brian Lehrer, WNYC-AM, October 23, 2006 Share FacebookTwitterPinterestLinkedinEmail 10 comments G Key February 27, 2017 - 5:18 pm Do you recall a Subway TV ad done by believe or not “Evil Knievel”? He had moved to NYC and they got him to do an ad where says I’ve jumped cars and the snake river canyon but I don’t play with subway doors. Those things are dangerous”. A bunch of friends who were in high school in the 70s remembered it but we can’t find online. In retrospect, it was somewhat humorous given the fact that he broke every bone in his body but was fearful of subway doors. Reply Anonymous June 13, 2017 - 9:46 pm About Staten Island Hylan Boulevard wasn’t known as Seaside Boulevard Seaside Boulevard is now called father capodanno Boulevard you have the two mixed up and father capodanno is the one that runs along the beaches Reply Jen November 24, 2017 - 9:43 pm I would love to get in touch with you. My mom and I lived above the hardware store in one of the pics you posted about Flushing circa 1980. I just had a dream last night about that apartment and am hoping you can help me with an address or anything that can help me track down pics. Thank you!!! Reply Nicole February 7, 2018 - 1:23 pm Hello…I have been searching for information regarding a hardware store owned by my father in the 1960’s (not sure if exact dates.) I believe the address was 188 eckford, Greenpoint across from the school P.S. 34. I’m trying to find the name of the store and hopefully a picture. any info you might would be greatly appreciated. Thank you! Reply Frank Salomon February 13, 2018 - 10:47 pm I’m a NYer who lives so very far away (Iowa) and FNY means a lot to me. Thank you Kevin. Reply Robert March 25, 2018 - 1:13 am Hi I’ve got old photo of Ny I think I’m just wondering Is it queens boulevard ? Or I am wrong ? I would like receive ur opinion. Where I can publish the photo? Thank You in advance Reply Mike May 22, 2018 - 10:19 am I’m trying to pretty up my front yard, while throwing some much needed light. I’m looking for a good source for an old or antique street lamp. any ideas or suggestions where to find some old street lamps? Reply D May 31, 2018 - 5:35 am Hey Kevin, Any idea about the cow statue on top of the 7-11 at Hillside Ave and Springfield Blvd? Reply Peter SCHIFTAN October 26, 2018 - 2:34 am Interested in a photo of the tea room at the mobrary in Kew gardens. Mentioned in the tour of Kew Gardens From 2011 Reply Teresa Kaufman November 10, 2018 - 9:08 am I am a former New Yorker living now in France. I just stumbled upon your site. Thanks to the web’s aptitude for getting distracted. Glad I did. Can you put me in a newsletter mailing? Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
