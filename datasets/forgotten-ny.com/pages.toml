title = "Chrystie Street - Forgotten New York"
description = "Chrystie Street is one of the few streets in Manhattan of any length, if not the only one, with no even-numbered addresses."
full_description = "Walks CHRYSTIE STREET-2ND AVENUE by Kevin Walsh May 15, 2022 May 15, 2022 THE mission was simple. To walk the entire length of Chrystie Street from Canal to Houston, and then 2nd Avenue as far north as I pleased, the reason being that I simply had never walked such a route before. Chrystie Street was named in 1817 for Lieutenant Colonel John Chrystie (1788-1813) who was an odd choice for such an honor since the regiment he commanded was forced to surrender during the Battle of Queenston Heights in Ontario in the War of 1812. Chrystie, in fact, was accused of cowardice. Nonetheless he was promoted to colonel, but perished of an undisclosed illness the following year at age 25. Photographed May 1 Photos in batch (which includes Canal, Chrystie, 2nd and 3rd Avenues: 112 South end of Sara D. Roosevelt Park Chrystie Street is one of the few streets in Manhattan of any length, if not the only one, with no even-numbered addresses. All of the buildings on its east side were knocked down in the 1930s to build Sara D. Roosevelt Park. Not even the Municipal Archives’ 1940s collection features any of those buildings in its archive. Chrystie Street falls outside of any protected Landmark District and thus, the buildings on its west side are a mishmash of very old plus new residential towers as seen here. A bicycle lane has been added in recent years on the park side of the street and the street can serve as something of a straightaway for cars and bikes alike, as it is crossed by only Delancey and Grand Streets as far north as Houston. However, there are pedestrian crossings at Hester, Broome, Stanton and Rivington and thus those intersections are controlled by stoplights. Here’s #73-75 Chrystie at Hester in 1940. This building exists today though in somewhat streamlined fashion. Barry Stolper Opticians occupied the ground floor; today it’s Kung Fu Tea. At left we see the 3rd Avenue El on the Bowery, which would be there until 1955. I should mention that today Chrystie Street’s house numbering begins at #47, just north of Canal. That’s because it used to extend south to Division Street before both streets were truncated by the construction of the Manhattan Bridge in the 19-oughts. Division Street is fascinating, as it was much longer in the past and even had an elevated train clattering along it before it was severely cut back by a number of projects in the 1900s. It’s all here. There isn’t much unusual infrastructure along Chrystie but I did find this at Hester, a pair of lampposts. The older one is on the right and was there before Chrystie Street had its eastern traffic lane awarded to bicycles. Its fire alarm indicator lamp is still in place, but not its streetlight. Designing parking garages that are at least not ugly has been a challenge for architects, probably the world over. Here’s one at #89 Chrystie that retains its original chieseled sign above the door. There are a number of “they don’t build ’em like this anymore” moments on both Chrystie Street and 2nd Avenue and 101 Chrystie, also known as 253 Grand, is one. Until I pointed my camera at it, I didn’t know the building had a cartouche with the date of construction and the initials LB, which stand either for the developer, owner or architect. Not only that, I was completely unaware of the carven address 253 Grand, which is hiding behond the street signs, which I captured to show contrast. Believe it or not here we are looking at an entrance to one of the newest stations in the NYC subways, and it opened in 1967(!) when a connection from the 6th Avenue Line (today serving the B and D lines here) to the Manhattan Bridge was built, known of course as the Chrystie Street Connection. At the same time the 6th Avenue Line was connected to the Broadway (Brooklyn) Elevated, which permits today’s M trains to go from 6th Avenue across the Williamsburg Bridge to Brooklyn. (Andy Sparberg! Am I right?–Comments) Here we see the former MTA logo, the two-tone blue M, which was supplanted in the 1990s by the “Doppler” MTA symbol. Totally bombed: Street art covers this building at Broome and Chrystie. To me, once you’ve seen Eduardo Kobra’s stuff, no street murals can really compare. On the opposite side of Broome is an inadvertent comparison between the residential architecture of 1900 vs that of 2022. Perhaps a lack of soul with the one on the right, or a case of putting more money into interiors than exteriors… The contrast between old and new is never greater than on the stretch of Chrystie between Broome and Rivington, spanning Delancey. I will say that the stylistic difference between residences and office towers is getting narrower and narrower all the time. #195-199 Christie, included here, has a grim history. The property once served as the city’s second African Burial Ground, after the first one in the Civic Center was closed and desecrated with development. This cemetery received burials from 1795 until 1853. Most of the remains were reinterred at Cypress Hills Cemetery in Brooklyn, which hosts relocated graves from a few other small cemeteries that were decommissioned in favor of urban growth. Street art acts as a palliative factor against the bland new buildings, and shows that robots have not yet assumed control. The venerable building at #205 Chrystie, bordering Stanton and adjacent to a new glass and metal tower, is home to Rochelle’s, a bar known originally as Leave Rochelle Out of It; the painting of the legs and boots is, I imagine, Rochelle herself, a former girlfriend of each of the owners. Me being me, I was more interested in the metal signs with the street names, including the misspelled Chrystie. The signs aren’t evident in Municipal Archives photos from the 1940s and 1980s (though both are pretty fuzzy). I wonder when these signs first appeared. From Sergey Kadinsky’s Sara Roosevelt Park page: 163 Chrystie has a German Rundbogenstil, or “round arch style.” This was a mid-19th Century attempt in Germany to develop a national architectural style. Kevin’s tour of 14th Street from October 2019 offers more examples of Rundbogenstil. Next door, 165 Chrystie offers the post-millennial look of floor-to-ceiling glass windows and concrete walls. Designed by ODA Architecture, the 9-unit luxury residence replaced a three-story Chinese kitchen supply store. The inclusion of sculpted birds on park lampposts at Sara D. Roosevelt Park’s northern end at Chrystie and East Houston is no mere random whim on behalf of NYC Parks. It’s my bet that these birds honor the Hua Mei Bird Garden, a short distance away at Delancey and Forsyth. Vanishing Jeremiah discusses it thus: Hanging in trees, from poles, around the chain-link fence, and sitting on the leafy ground, are dozens of beautiful bamboo bird cages, some half shrouded in white cloths, most of them ornately carved, and all containing a songbird.Many of the birds are small–colorful finches, a few black-capped chickadees–but some are the Hua Mei, a fighting thrush from China for whom the park was named. Many Chinatown residents keep caged birds and the garden was instituted serendipitously in 1995. Unfortunately the garden was closed, at least temporarily, after druggies and vagrants reasserted their presence in SDRP. Hopefully, the garden will reopen soon if it hasn’t already been. New York City didn’t have a grand overall plan to design the streets of the Lower East Side. When farms were subdivided, a very early map, the 1801 Mangin-Goerck Plan or Map of New York City, mapped out the streets we now find in the area. For a number of reasons it was found unsatisfactory. Later, the Commissioner’s Plan of 1811 codified the streets north of Houston, which was originally called North Street simply because it was the city’s northern end. Traffic flows from the north south streets across Houston into the avenues north of Houston. Thus, Chrystie Street runs two ways, but northbound traffic can’t enter 2nd Avenue, which is one-way southbound. Of the other Lower East Side Streets that flow into avenues above Houston… Allen Street (two-way) ➡️ 1st Avenue (northbound)Essex Street (two-way) ➡️ Avenue A (two-way)Clinton Street (northbound) ➡️ Avenue B (two-way)Pitt Street (northbound) ➡️ Avenue C (two-way)Columbia Street (two-way) ➡️ Avenue D (two-way) I was grateful for my luck when I saw the metal gate of the New York Marble Cemetery open on 2nd Avenue between East 2nd and 3rd Streets, but I shouldn’t have been surprised, as the cemetery is open to all comers during its outdoor board meeting the first Sunday in May. The NY Marble Cemetery (NYMC) is unique in New York City in that it contains no freestanding gravestones, and never has had them. The NYMC — along with the nearby New York City Marble Cemetery (NYCMC) (East 2nd Street between 1st and 2nd Avenues) were developed by the same person, Perkins Nichols, beginning in 1830, when East 2nd Street was still considered uptown. Instead of earth graves with headstones, family vaults the size of small rooms were built ten feet underground. The relatively deep location was decided on because at that time there was still fear of contamination from deadly or debilitating diseases from fresh remains. The vaults are set in pairs and can be accessed by removal of stone slabs set beneath the “lawn.” The NYMC contains 156 vaults and 78 entrances, with a total of approximately 2100 interments. Among the original internees were prominent businesspeople, what today some would call the “one percent.” Uriah Scribner, a founder of the Scribner publishing and book-selling empire; Aaron Clark, NYC’s first Whig mayor, and second popularly elected (from 1837-1839); US Representative and President of Columbia University, James Tallmadge; Benjamin Wright, Chief Engineer for the Erie Canal; and Deys, Varicks and other prominent names found on NYC street signs. See FNY’s All the Marbles page for info on both cemeteries. Toy Tokyo, at #91 2nd Avenue, is an emporium featuring rare and collectible toys and a premier location to find merchandise from famed toy designers such as Funko, Kaws and Ron English. In addition, unique vintage toys, model kits, games, dolls, and stuffed toys are also offered. Toy Tokyo specializes in rare and collectible Godzilla merchandise including everything from full-body Godzillas to build-it-yourself models, some of which are rare and sell for over $600. The store has been voted Best Toy Store of the Year by Clutter Magazine, a premier source for counterculture and art toy information. Block Drugs’ red neon sign on the SW corner of 2nd Avenue and East 6th, which (unofficially) goes back to 1948, still lights up brilliantly at night. Block has been in business since 1885, as the corner of the sign indicates. In the windows, there are smaller red neons, one of which says “Cut-rate Cosmetics.” If that date is correct that puts it among NYC’s oldest extant businesses, but surprisingly, it didn’t make my Bible on these matters, Ellen Williams & Steve Redlauer’s Historic Shops & Restaurants of New York (Little Bookroom, 2002). This seems to be the last survivor of a franchise. From wikipedia: The company was founded in 1907 by Alexander Block, a Russian immigrant who had a small drugstore on Fulton Street in Brooklyn, New York. He turned the company into a wholesaler in 1915, then became a drug manufacturer in 1925, acquiring a 50 percent interest in Wernet’s Dental Manufacturing Company…Block Drug Company was a pharmaceutical company based in Jersey City, New Jersey, United States, that specialized in dental care products. Its most popular products included Polident denture cleanser, Poli-Grip denture adhesive, Dentu-Creme denture toothpaste, Nytol sleeping pill, Tegrin medicated shampoo for psoriasis, Lava hand soaps (acquired from Procter & Gamble), Beano and Phazyme anti-gas products, Balmex diaper rash ointments, and Sensodyne desensitizing toothpaste.[1]GlaxoSmithKline purchased the company for $1.24 billion in 2001. A walk down several streets of the East Village, especially St. Mark’s Place, Cooper Square, 2nd and 3rd Avenues, and east 6th and 7th Streets, and you’ll notice dozens of lampposts whose bases and lower halves are covered withe ceramic tile, glass, broken crockery, rhinestones, terra cotta and other small decorative pieces. Some are arranged in patterns that spell out the names of fallen firemen on 9/11/01; politicians; local landmarks and theatres. They are all the work of Irish-born Vietnam vet Jim Power, who has been adding this embellishment for over twenty years and has become a beloved East Village institution. Power’s work is especially necessary at the NW corner of 2nd Avenue and east 6th Street, the site of the 1968-1971 Bill Graham rock palace, the Fillmore East. Graham took over the old cinema/Yiddish theatre in early 1968 and for two full years and part of two others presented a roister of superstars that to this day reads like a classic rock radio playlist. Just about every big name in rock and roll except the Beatles and Stones played the Fillmore East (Graham’s east coast counterpart was the Fillmore West in San Francisco.) No official plaque marks the spot of the Fillmore East (and none, for that matter, marks the locales of other legendary NYC rock venues such as CBGB, the Palladium, Bonds of Times Square, Folk City, Max’s Kansas City, the Peppermint Lounge (either of them), Danceteria, the Ritz, the Lone Star Cafe…I could go on. Read the full FNY report at the former Fillmore East location here. Without question, lower 2nd Avenue has sen its share of disasters during the past decade. The Tiffany windowed, double-spired Middle Collegiate Church has stood on 2nd Avenue between 6th and 7th Streets since 1892. Just next door is 110 2nd, the Isaac T. Hopper House, built in 1839, which early on in its history was a “home for wayward girls” instituted by Hopper, an abolitionist Quaker. It is the lone survivor of a set of four such Greek Revival townhouses. 110 2nd is the headquarters of the Women’s Prison Association, which assists women who have served time in the criminal justice system. Middle Collegiate Church, as well as the corner building to its immediate north, were completely gutted by a fire in December 2020 and the church awaits a rebuild. Meanwhile, the northwest corner of 2nd Avenue and East 7th Street was rendered an empty lot after three former buildings on the site were wiped out by an explosion, killing two, caused by an illegal tap into a gas main in March 2015. The landmarked buildings were constructed between 1835 and 1901. The corner building was the longtime home of popular thrift shop Love Saves The Day. However, a new building has since gone up on the site. The two men killed in the blast, Nicholas Figueroa and Moises Locón, have been remembered on street signs. I haven’t been in B&H Dairy Lunch at #127 2nd Avenue between East 7th ands St. Mark’s Place, but it’s a token remembrance of the formerly heavy Jewish population of the Lower "
