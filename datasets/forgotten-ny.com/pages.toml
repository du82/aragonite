["https://forgotten-ny.com/2025/02/3-mile-marker-midwood"]
title = "3 Mile Marker - Forgotten New York"
description = "This milestone, marked 3M, marks the third mile from Ocean Parkway’s northern terminus at Prospect Park."
full_description = 'Signs 3 MILE MARKER, MIDWOOD by Kevin Walsh February 19, 2025 February 19, 2025 WHEN I lived in Bay Ridge, I would frequently bicycle down Ocean Parkway from Church Avenue to Coney Island. It boasts a world-class bike path and it’s flat as a pancake…you can make good time even if you’re going against the wind. Just past Avenue P, I’d notice this little stone with a beveled edge up against the roadway. I must have gone past it hundreds of times in the 70s, 80s and 90s. Looks like a small gravestone, doesn’t it? Yet, I never thought it was a gravestone, unless it was an original plot that Ocean Parkway went through when it was first built. I had something else in mind. And, upon further investigation, my suspicions were confirmed. It is a mile marker dating back to the early days of Ocean Parkway. This one, marked 3M, marks the third mile from Ocean Parkway’s northern terminus at Prospect Park. Bklyner has more including research by me and by Gravesend’s Joseph Ditta; and Ditta produced a map showing the original locations of the milestones based on research by Richard J. Koke. When renowned city planners Frederick Olmstead and Calvert Vaux built Ocean Parkway between 1874 and 1876, they envisioned a six-mile long extension of their earlier creation, Prospect Park, which some say is even better than their masterpiece, Central Park. When first laid out, Ocean Parkway was a direct route for pedestrians and mounted traffic, as well as buggies and wagons, to get to the Coney Island shore from Prospect Park. Even the bicycle wasn’t yet invented when the parkway first appeared. These days, of course, Ocean Parkway is a pedal to the metal speedway, with synchronized stoplights. Occasionally you can hit the jackpot and never hit a red light while driving from the Belt Parkway to Prospect Park. Ocean Parkway milestones were placed at half-mile marks along the route. Only this one, by some stroke of fate, remains. Milestones were a common method of marking private routes beginning in the colonial era and lasting until the start of the 20th Century. Relatively few NYC thoroughfares boasted them, although the old Bloomingdale Road (now Broadway) in upper Manhattan had them, as well as Jackson Avenue (now Northern Boulevard) in Queens. Until about 15-20 years ago, the 5-mile marker was located at Ocean Parkway and Neptune Avenue. that one, though, was located right on the corner, and when the Department of Transportation installed new crosswalks, they didn’t know what a historic artifact they had, and unceremoniously trashed it. I haven’t been to Midwood lately; usually, you need a reason… but on the internet I discovered that NYC Parks has placed a nifty marker at the 3-mile stone, so you no longer need to go into the middle of Ocean Parkway to see the front of it. Parks has matched the serifed number of the front, so you get a good idea what it looks like. As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/19/25 BrooklynMidwood 2 comments FacebookTwitterPinterestLinkedinEmail previous post TAPS MANSION, MIDTOWN NORTH next post THREE FACES OF DOWNER’S 2 comments P-j Greiner February 21, 2025 - 3:02 pm Olmsted spelled his name without the “a” found in Hempstead. Reply Bill Tweeddale February 21, 2025 - 4:27 pm Don’t get trampled by horses on Ocean Parkway. Oh wait! That was back in the 1950’s… Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
