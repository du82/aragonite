title = "Diamond's - Forgotten New York"
description = '''Diamond's was owned by Polish immigrant Akeeba "Kieve" Diamond and his wife, Rose, from Russia. Neil was born in 1941'''
full_description = 'One Shots DIAMOND’S, CONEY ISLAND by Kevin Walsh February 27, 2025 February 27, 2025 In 1940, Diamond’s Dry Goods held down 2516 Mermaid Avenue, west of West 25th Street in Coney Island. The name was displayed in a diamond-shaped motif with a window display advertising “ladies’, men’s and children’s furnishings,” and a complete line of white goods and bathing supplies.” In the past, “white goods” referred to appliances that were usually colored white such as refrigerators, washers and dryers: however, I think 1940 was a bit early for those appliances and “white goods” may have referred to towels, which were more often white then, napkins and the like. Diamond’s was owned by Polish immigrant Akeeba “Kieve” Diamond and his wife, Rose, from Russia. Their son Neil was born a year after the photo was taken, in 1941. The family lived in Brighton Beach (where the store moved) and in Cheyenne, WY for a few years, as Kieve Diamond was stationed there during an Army stint. Neil Diamond was inspired to become a musician after hearing Pete Seeger sing at the upstate Surprise Lake Camp for Jewish kids. He attended Erasmus Hall High School with fellow future music superstar Barbra Streisand, his duet partner on “You Don’t Bring Me Flowers.” Diamond’s first big splash as a songwriter was with the Monkees’ “I’m a Believer” in 1966, when he was 25. He began a singing career, his own songs and others’, around the same time, and embarked on an over 50-year career in show business, retiring just recently. Both Kieve and Rose lived into old age and saw Neil reach his greatest fame. The block in which Diamond’s was located was knocked down in the 1960s to make way for the apartment complex Gerald J. Carey Gardens. Folksinger Woody Guthrie and his family lived further west on Mermaid Avenue for several years and may well have patronized Diamond’s. Related: Walken’s Bake Shop As always, “comment…as you see fit.” I earn a small payment when you click on any ad on the site. 2/27/25 BrooklynConey Island 3 comments FacebookTwitterPinterestLinkedinEmail previous post COVINGTON WHEELIES next post CENTRAL PARK ARSENAL AND ZOO 3 comments Peter February 28, 2025 - 8:46 am Another classmate of his at Erasmus Hall was future chess superstar Bobby Fischer, who gained fame for his Cold War match with Boris Spassky* but then largely disappeared from view before returning from time to time to espouse Holocaust denial and antisemitism. * = who died yesterday, age 88 Reply redstaterefugee February 28, 2025 - 10:55 am Neil Diamond was inspired to become a musician after hearing Pete Seeger sing at the upstate Surprise Lake Camp for Jewish kids: Times have certainly changed. Today, entertainers & other public personas would loudly & publically decline to appear at any venue identified with Judaism or Israel or anything else that their elite masters proclaim to be “politically incorrect”. Reply chris February 28, 2025 - 5:56 pm Erasmus High was renowned for scholastic achievement.The Stuyvesant High of Brooklyn.Its showcase held award after award for excellence in that area like another school would show their athletic trophies.But starting in the 1960s those awards start petering out until there are none now. Gee,I wonder why. Reply Leave a Comment Cancel Reply Save my name, email, and website in this browser for the next time I comment. <div style="width: 302px;"> <div style="width: 302px; height: 422px; position: relative;"> <div style="width: 302px; height: 422px; position: absolute;"> <iframe src="https://www.google.com/recaptcha/api/fallback?k=6LegnKYUAAAAAEHYNYWcpDdZ21loPHesKamopX03" frameborder="0" scrolling="no" style="width: 302px; height:422px; border-style: none;"></iframe> </div> </div> <div style="border-style: none; bottom: 12px; left: 25px; margin: 0px; padding: 0px; right: 25px; background: #f9f9f9; border: 1px solid #c1c1c1; border-radius: 3px; height: 60px; width: 300px;"> <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px !important; height: 40px !important; border: 1px solid #c1c1c1 !important; margin: 10px 25px !important; padding: 0px !important; resize: none !important;"> </div> </div> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed.'
