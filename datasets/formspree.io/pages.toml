full_description = "Founded in 2015 as a side project, Formspree has become a household name and a core technology powering forms across the Internet. Our bootstrapped journey reflects our belief in the power of the web to change lives. We’re developers, building for developers – helping you create custom, functional forms with ease! To our founders, collecting form data felt like the least creative aspect of building websites. We set out to eliminate the drudgery and make building forms creative too. We want to help builders focus on creative work. Think design, content and user experience, not servers and security. Coding is a tool that anyone can learn. We’re on a mission to enable hackers, professionals, students, and everyone in-between. The web used to be just HTML and forms. And man was it was weird! Now websites are super complex but somehow everything looks the same. We want to help people keep it simple AND unique! From support to product to strategy, every decision aims to improve our customers’ lives. They’re our raison d'être. We embrace flexible schedules and invest in each individual. We want to build relationships that last."
