hentication (2FA). We know how important your form data is, so we’re happy to offer you an additional way to secure your account. 🔐 The process should feel very familiar to you if you’ve set up 2FA on other websites. You can set up 2 factor authentication by visiting your account settings and clicking Setup in the Formspree Dashboard. Read more →"
