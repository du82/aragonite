full_description = '''Tue, Feb 27, 2024Rohit Datta Formspree is now SOC 2 certified We've successfully demonstrated our commitment to data security and privacy standards Tagged: Features Security in Announcements function playVideo() { var video = document.getElementById('video-header'); var button = document.getElementById('video-play-button'); video.setAttribute("src", "https://www.youtube.com/embed/YHR2Cqsq1Iw?autoplay=1"); video.style.display = 'inline-block'; button.style.display = 'none'; } We’re proud to announce that Formspree is now SOC 2 Type 2 certified! Our team has worked hard over the past few months to update our infrastructure and implement security policies that bring us into compliance with the SOC 2 standard. As a result of this effort, we are proud to announce that we have passed the SOC 2 audit and are now SOC 2 Type 2 certified. For a copy of our report you can reach out to security@formspree.io. What is SOC 2? SOC 2 was developed by American Institute of CPAs (AICPA) and is the industry’s leading standard for ensuring service providers securely manage data to protect the interests and privacy of their customers. It is widely recognized as a benchmark for data security. Achieving SOC 2 compliance demonstrates that Formspree has undergone a rigorous audit of our security policies and controls in place to protect customer data and privacy. Additionally, SOC2 requires continuous monitoring for security compliance, as well as ongoing training and education for our staff. What does this mean for you? It means peace of mind, knowing that our security processes are compliant with the SOC 2 standard. For companies with security teams, we can now streamline the approval process by sending over our audit results. It means you can rest assured that Formspree is a secure and reliable service. If you have questions about our security and privacy practices, feel free to reach out to security@formspree.io. If you’re interested in talking with Formspree about how we can help you capture and process high volumes of form submissions, reduce spam, and enable your web development team to build beautiful on-brand forms without the hassle of maintaining databases or servers, reach out to sales@formspree.io! Got Feedback? Name Email Message Send Introducing the Klaviyo plugin reCAPTCHA: Balancing User Experience with Security'''
