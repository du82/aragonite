full_description = "Our services are hosted with Amazon Web Services in the United States. They employ a robust security program with multiple certifications. For more information on our provider's security processes, please visit AWS Security. Formspree uses an industry-leading Web Application Firewall with automatic updates to thwart the latest attack vectors. All databases are encrypted at rest using AES-256 block-level storage encryption. We use a minimum of TLS 1.2 to encrypt network traffic between users' browsers and Formspree. Formspree salts and hashes passwords. We perform vulnerability scanning and actively monitor for threats. We actively monitor and log various cloud services. We use a leading intelligent threat and anomaly detection service to proactively to identify and respond to any potential threats. All of our team members are responsible for ensuring that your data remains secure, and we have adopted it into our culture. We follow the principle of least privilege. Access to cloud infrastructure and tools with access to customer data are limited to authorized personnel who require it for their role. We enforce 2 factor authentication and strong password policies to access critical systems. We maintain a dedicated offboarding process to immediately revoke access when no longer required. We also conduct quarterly access reviews of all team members to audit access to sensitive systems. We have developed an action plan distributed to all personnel to prepare for any unexpected disasters. We regularly backup all critical data systems and run walkthroughs to allow us to quickly recover in the event of a catastrophe. We have a process for handling information security events including escalation procedures, rapid mitigation, and communication. Formspree maintains a bug bounty program to encourage responsible disclosure. Personnel are required to undergo security awareness training covering phishing and password management. We perform background checks on all new team members in accordance with local laws. All team members are required to sign and adhere to an industry standard confidentiality agreement prior to their first day of work."
