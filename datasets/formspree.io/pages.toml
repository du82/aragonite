full_description = "Tue, May 30, 2023Rohit Datta Introducing the Klaviyo plugin Connect forms to your Klaviyo account Tagged: Features Plugins in Announcements Making sure that you can market to your customers throughout their e-commerce journey is crucial towards building customer loyalty. With uncertain economic times ahead, you want to make sure you personalize their journey with omnichannel marketing automation. This is exactly why we’ve been working on our newest plugin for the marketing automation tool Klaviyo. Connect Klaviyo Using the Klaviyo plugin Klaviyo is as simple to set up as all Formspree plugins. After creating your form, get started with just a few clicks. Select Klaviyo from the Plugins tab of your form, and copy the Private API key. Integrating with other plugins You can easily combine your form with other plugins in your e-commerce stack such as Gorgias or Gladly. If you’ve built a custom payment form with Stripe, you can add the Klaviyo plugin to automatically add your paid customers to your marketing pipeline. We’re looking forward to all the exciting things that will be delivered in the new year. Stay on form and here’s to the start of a happy summer from all of us at Formspree 😎 Got Feedback? Name Email Message Send Announcing React payment forms with Stripe Elements Formspree is now SOC 2 certified"
