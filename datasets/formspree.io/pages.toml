title = "Tutorials | Formspree"
full_description = "How to Create a Custom Payment Form with Stripe and Formspree Mon, Oct 10, 20225 Minute Read Collecting payment is the most crucial experience of your online business. So why settle for a stock Stripe Checkout page? Building a custom checkout form with Stripe Elements gives you control over the entire payment experience, all the way to the final moments of the sale. Now with formspree-react and the Formspree Stripe plugin, you can build fully custom payment experiences in a fraction of the time it would take with Stripe Elements alone. Read more → How to Build a Great Lead Generation Form that Connects with HubSpot Mon, Oct 26, 20207 Minute Read Lead generation forms are the linchpin of your marketing engine. You advertise and run campaigns at the top of the funnel in the hopes of collecting some more information about your users so that you can turn them into paying customers. A number of things can go wrong with your form: you don’t give people a good enough reason to fill it out, the form is clunky and long, or the page it’s on is too distracting. Your marketing dollars are wasted, and your potential customers will go elsewhere. Read more → 5 Creative Form Designs to Inspire Your Next Form (+11 Examples) Thu, Oct 15, 20207 Minute Read Content (and politics) aside, which of these two forms would you rather fill out? Read more → 5 Best Practices for Creating Accessible Forms Thu, Sep 10, 20208 Minute Read Accessible web design should be a given. Almost 41 million Americans live with a disability. That’s approximately 12.6% of the population. But much of the internet still isn’t designed to accommodate users with disabilities. One study, for example, found that 70% of websites were inaccessible to people with visual impairments. Inaccessible forms aren’t just inconsiderate—they’re bad business. They lead to your company missing potential orders, surveys, registrations, and more. Design with accessibility features in mind, and everyone can get what they need from your website. Read more →"
