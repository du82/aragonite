full_description = 'Protecting your private information is our priority. This Statement of Privacy applies to Formspree.io (“Formspree") and governs data collection and usage. The Formspree website and other services (the “Services”) provided by Formspree, Inc. are a service that accepts form submissions and sends emails. We need to process your personal information to run our business and provide you with the Services. By accepting our Terms of Use, you are confirming that you have read and understand this policy including how and why we use your information. If you don’t want us to collect or process your personal information in the ways described in this policy, you shouldn’t use the Services. By using the Services, you consent to the data practices described in this statement. By using the Services, you acknowledge that Formspree will use your information in the United States and any other country where Formspree operates. Please be aware that the privacy laws and standards in certain countries, including the rights of authorities to access your personal information, may differ from those that apply in the country in which you reside. We will transfer personal information only to these countries to which we are permitted by law to transfer personal information, and we will take steps to ensure that your personal information continues to enjoy appropriate protections. Please read on to learn more about how we protect personal information that’s transferred outside of Europe. Formspree may collect and store personal information, such as your name and email address. If you purchase Formspree’s products and services, billing and credit card information may be necessary in order for us to provide a particular service. We may gather additional personal or non-personal information that you may provide to us in the future. Information about your computer hardware and software may be automatically collected by Formspree. This information can include: your IP address, browser type, domain names, access times and referring website addresses. We may combine this information from your browser or your mobile device with other information that we or our partners collect about you, including across devices. This information is used to prevent fraud and to keep the Services secure, operate the services, to maintain quality of the service, and to provide general statistics regarding use of the Formspree website.'
