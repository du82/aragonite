description = "An online publication brought to you by the team at **Formspree** featuring editorial writing and technical how-tos on static site generation, HTML forms, and other web technologies you can use to get your site well built and running fast on the Internet."
full_description = "Blogophonic: A Free Hugo Theme for Blogs Tue, Jul 9, 2019 Not all themes are created equal. With Blogophonic we set out to create a clean theme with the right features for a serious blog. We also wanted Blogophonic to be a pleasure to modify, so we built it with Tachyons, CSS Grid, and packed it full of configurable options. Three new tools to fight spam Tue, May 28, 20193 Minute Read Fighting spam is one of the hardest challenges for any form backend, whether you build your own or use a service like Formspree. To help our customers cut back on spam, today we’re announcing three new tools: Custom reCAPTCHA support, authorized domains and the profanity filter. Read more → Formspree now has a blog! Sat, May 25, 20192 Minute Read Hey y’all! We launched our blog! (duh) A few cool things about this blog. It’s f–king gorgeous, right? It has a unique taxonomy feature called Series. We expect to publish series of posts on a single topic, and we wanted a way to link those posts together into a single narrative. So we created landing pages that make these stories and tutorials easier to navigate. We shall see how it goes. Read more →"
