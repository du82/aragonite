title = "F. von Never — .NET Support Dates"
full_description = ".NET Support Dates Publication date: 2021-04-10 Once in a while, I want to know which versions of .NET are currently officially supported. Unfortunately, it may be hard to figure this out from the official Microsoft documentation. So I've decided to collect this information in this post. I intend to update this information when new .NET versions come out in the future, and with more precise dates if they're available. This post will help you to determine whether a particular .NET version has any kind of official support from Microsoft (and thus if you should consider support in your software). Please note that this post shouldn't be used as a legal or technical advice of any sort; always refer to the original documents published by Microsoft (I'm adding the links specifically for this). Date of last update of this information: 2023-05-13. .NET Framework .NET Framework Version Still Supported? End of Main Support End of Extended Support Source 1.1 SP1 No 2015-07-14 N/A Lifecycle FAQ - .NET Framework 2.0 No 2011-07-12 N/A Microsoft .NET Framework Lifecycle 3.0 No 2011-07-12 N/A Microsoft .NET Framework Lifecycle 3.5 No before 2012-06-23 N/A Clarification on the support life cycle for the .NET Framework 3.5 […] 3.5 SP1 Yes (extended) 2007-11-09 2029-01-09 Microsoft .NET Framework Lifecycle 4 No 2016-01-12 N/A Lifecycle FAQ - .NET Framework 4.5 No 2016-01-12 N/A Microsoft .NET Framework Lifecycle, Lifecycle FAQ - .NET Framework 4.5.1 No 2016-01-12 N/A Microsoft .NET Framework Lifecycle, Lifecycle FAQ - .NET Framework 4.5.2 No 2022-04-26 N/A Microsoft .NET Framework Lifecycle 4.6 No 2022-04-26 N/A Microsoft .NET Framework Lifecycle 4.6.1 No 2022-04-26 N/A Microsoft .NET Framework Lifecycle 4.6.2 Yes 2027-01-12 N/A Microsoft .NET Framework Lifecycle 4.7 Yes (extended) 2022-01-11 2027-01-12 Lifecycle FAQ - .NET Framework, Windows Server 2016 Lifecycle 4.7.1 Yes (extended) 2022-01-11 2027-01-12 Lifecycle FAQ - .NET Framework, Windows Server 2016 Lifecycle 4.7.2 Yes 2024-01-09 2029-01-09 Lifecycle FAQ - .NET Framework, Windows Server 2019 Lifecycle 4.8 Yes 2026-10-13 2031-10-14 Lifecycle FAQ - .NET Framework, Windows Server 2022 Lifecycle 4.8.1 Yes 2026-10-13 2031-10-14 Lifecycle FAQ - .NET Framework, Windows Server 2022 Lifecycle Notes I wasn't able to find any sources for actual .NET Framework 3.5 support dates. Lifecycle FAQ sends the reader to the Lifecycle Policy document, which hasn't listed .NET Framework 3.5 as a separate entry. The clarification on the support life cycle lists it as unsupported, though it has no dates: The original version of the .NET Framework 3.5 together with the .NET Framework 2.0 SP1 and the .NET Framework 3.0 SP1 are no longer in support. The first recorded date of this document being publicly available is 2012-06-23 (see the Internet Archive). According to the Lifecycle FAQ, certain .NET Framework versions (all starting from .NET Framework 4.6.2) are considered as parts of the corresponding operating systems, and thus have the same mainstream/extended support dates as the operating systems. For these versions, I've chosen the ones with the most extended supported dates, and used them for the table above. These versions are listed in the table below. If there are several Windows versions for the same .NET Framework version, then I've tried to choose the latest published one (since it may have better chance of its support to be extended). Normally, the server versions are supported longer than the client ones, so these one should be considered. .NET Framework Version OS Version Lifecycle Document 4.7 Windows Server 2016 Windows Server 2016 Lifecycle 4.7.1 Windows Server 2016 Windows Server 2016 Lifecycle 4.7.2 Windows Server 2019 Windows Server 2019 Lifecycle 4.8 Windows Server 2022 Windows Server 2022 Lifecycle 4.8.1 Windows Server 2022 Windows Server 2022 Lifecycle .NET Core and .NET For .NET Core, .NET 5 and newer versions of .NET, the support policy is much clearer, so I see no point in reproducing that here."
