title = "F. von Never — ICFP Contest 2024"
full_description = '''ICFP Contest 2024 Publication date: 2024-07-01 This year, as every year since time immemorial, I participated in the ICFP contest as part of codingteam. Preparation As usual, before the contest started, I've managed to do some basic preparations. I have created a team repository, set up a CI pipeline on GitHub Actions (that one didn't live long, though), and created a pre-flight check issue, for the team members to check their environment. The Team Before and immediately after the start of the event, I've invited several people and some asked to join, but the final set of active contributors (in alphabetical order) was: ForNeVeR, Foxtran, Gsomix, Minoru, portnov. This year we've agreed to use Haskell as the main language (acknowledging that Foxtran will still write in Fortran regardless of any agreements; even if forced to use another language, he'll still write Fortran in said language). The Task Galaxy Language This year's task was a quite interesting one. We've been given the specification of so-called ICFP expressions (we decided to call it "the Galaxy language"). This language represented a variant of typed lambda calculus with booleans, integers, strings, and of course lambdas, and a bunch of operators, but written in a quite unorthodox way. For example, the expression B$ B$ L# L$ v# B. SB%,,/ S}Q/2,$_ IK mean ((\v2 -> \v3 -> v2) ("Hello" . " World!")) 42 While operators such as B$ (function application) and $+ (addition) are easy to read, even strings and integers are encoded so that they are unreadable in the original language. We've introduced our own notation that I'll use in this report. For example, the above expression would be written as Apply ( Apply ( Lambda 2 ( Lambda 3 ( Var 2 ) ) ) ( Concat ( Str "Hello" ) ( Str " World!" ) ) ) ( Number 42 ) But of course it wasn't all. We didn't have to just implement parser, evaluator, and emitter of the Galaxy language. We had to also solve several courses using this language. Sending specific HTTP requests in the Galaxy language, we were able to scout a whole "site" of several pages, each represented by a Galaxy expression evaluating to a Markdown string. The pages contained the task description, the leaderboard, and the course descriptions. And each course was its own whole thing: a set of connected tasks that sometimes require to write programs in other custom languages and encoded in Galaxy. I will explain each course in the sections above. The scoring was complex, but basically the team that gets the highest rank in each course wins. Hello Course The first course was called "hello" and the tasks were quite simple: read several pages from the "Galaxy HTTP" server (by sending Galaxy expressions evaluating to requests such as get index or get scoreboard), use the echo service (by sending a request evaluating to echo "something"), solve the basic language test (by evaluating an expression that used all the Galaxy operators). Lambdaman Course The first "real" course was devoted to solving the "lambdaman" tasks. Provided with a "labyrinth" map (in form of a Galaxy language expression, of course!), we needed to write a program that would navigate the map and eat all the dots. The map was a 2D grid with walls, dots, and a "lambdaman" character that could move in four directions. All the tasks were static and quite possible to solve even by hand, so the challenge was to provide a shortest Galaxy expression that successfully navigates a level. For example, for a level ###.#... ...L..## .####### the solution was UDLLLDURRRRRURR, written as Saaalalll~lllFllaa~laaaaaaa~ in Galaxy language. As the solutions were scored in their Galaxy form, some tricks were possible to make them shorter (the obvious ideas were to implement random walker or some form of compression; it was valid to make a solution that executes for longer time, up to 1000000 steps, but has short written form in Galaxy language). Spaceship Course The second course provided a set of levels for a spaceship with inertial controls. Each level had a set of points on 2d surface for the spaceship to visit, and we were able to control its thrust at every moment of time, thus indirectly affecting the velocity. A solution for a particular level would be a string such as 236659, with each character being a number from 0 to 9, representing the thrust at each moment of time (acting as numbers on keypad in some games). The score is based on the move number (notably, not their encoding in the Galaxy language, contrary to the previous course). 3D Course This one was very interesting. We were presented with a specification of so-called "3D programming language". The "program" is a set of numbers and instructions placed in a 2D grid, with third dimension being time. And there's a time-warp operator, allowing to send a number or an operator back in time, resetting the state of the program to some previous moment in time (but with additional things sent from the "future"). This was fascinating but also quite confusing. I'll just leave an example program that, receiving a number in spot A, calculates its factorial. . . . . . 0 . . . . . . A > . = . . . . . . v 1 . . > . . . . . . - . . . + S . . . < . . . ^ . . . -6 @ -1 v . . 1 > . . . 3 . . . . . A * . . . 1 @ 6 . . < . . . . . 3 . 0 @ 3 . . . . . . . . 3 . . . Here, @ is the time-warp operator, accepting dt, dx and dy as operands on the bottom and on the sides, and the thing that it will move on its top. Once activated (i.e. all the operands being provided), it will roll back the program execution back in time. The total score of the course was calculated according to "the amount of space-time" occupied by the program (so we were optimizing the latest moment in time its execution reached, together with the spatial dimensions of the 2D grid used). The tasks were also interesting and varied in complexity: from calculating a factorial or an absolute value of the input, to calculating an amount of unique positions for Lambdaman on a dynamically-provided level (encoded as a long number). (The latter task we were unable to solve.) Efficiency Course This course wasn't about solving nested tasks in derived languages, but about the Galaxy language itself. Several quite complex Galaxy expressions were provided, and we had to just evaluate them (and it required advanced analysis and knowledge of several tools and approaches). Several problems I cracked myself included: a program calculating Euler's totient function for a given number in a really inefficient way, a program performing a linear search for a number whose bits satisfy a particular boolean expression. The former we were expected to investigate and found an efficient way to calculate, while the latter we resolved using a SAT solver. The Events In this section, I'll describe the task and the contest's events in chronological order. When talking about dates, I'll refer to them in my local time zone, UTC+2 during the event. Day 0, 2024-06-28 The contest started at 14:00 in my time zone. We've gathered in a Telegram chat, opened the repo, and started reading the task specification and figuring it out together. In the meantime, I have registered a team on the contest website, to get the data access key (and Minoru did the same, so we've had to ask the contest organizers to delete the duplicate). I started sending some requests to check how the server behaves. We were provided with an initial request (the one meaning get index in the Galaxy language, though we didn't know that yet), so I tried to modify it and check what the server will return (it was returning error messages talking about invalid commands and page names, but again — we didn't know that yet). We quickly figured out that out request, as well as the server responses, were just string literals (a simplest kind of expression), so we started working on decoder for these literals first. Decoding is really simple (you just remap 94 ASCII characters to alternate codes and get a Galaxy string after adding the S prefix), but that already caused a fair amount of confusion. Akon32, who was only briefly present at this time (so I won't list him as a team member), was the first to figure out the decoding, and decided to use tr to do some automated decoding (since we knew that SB%,,/}Q/2,$_ was Hello, World in Galaxian). This gave some pretty convoluted results, and we were discussing that a bit while figuring out that the decoding schema is easier than what tr was giving to us. At this point we also figured that Minoru has outdated Telegram client (you know, Debian stable), and wasn't able to see some of our messages. Thankfully, this wasn't a big problem, but I had to keep in mind to not use certain advanced message formatting capabilities (custom quotes) in my messages so that Minoru can still read them. Eventually, we were able to decode the index page that told us: Hello and welcome to the School of the Bound Variable! Before taking a course, we suggest that you have a look around. You're now looking at the [index]. To practice your communication skills, you can use our [echo] service. Furthermore, to know how you and other students are doing, you can look at the [scoreboard]. After looking around, you may be admitted to your first courses, so make sure to check this page from time to time. In the meantime, if you want to practice more advanced communication skills, you may also take our [language_test]. This page has some basic directions, and we started to take a look around, as it suggested. Since we agreed on using Haskell, I started reading about HTTP clients in Haskell. I was struggling with figuring out my path through Haskell's string types. There are five different types: String (that's just a linked list of Chars and thus is never used for anything serious), Data.Text and Data.ByteString (the latter two having lazy and strict variants) and a lot of conversion necessary to get from one to another. (And these types are seemingly without any system enforced by some piece of Haskell ecosystem, e.g. the HTTP tutorial I followed suggested us to use a lazy ByteString for the most purposes.) This wasn't a blocked, but a bit annoying for me. Though I used to it after some time. In the meantime, Minoru implemented a number decoded in Haskell, while Portnov did a quick HTTP script in Bash (thus introducing a concept of using the TOKEN.txt file that I've reused). Also, Portnov then implemented fileToGalaxy and fileToGalaxy commands, thus nailing the name "Galaxy" we used for the language (I, for one, would prefer to call it Cultic or something, but Galaxy it is). If we believe his messages, Gsomix was brewing tea all this time (about 1.5 hours! Good tea!). We've discovered all the course names after executing the get scoreboard request. Minoru started implementing the AST module for the Galaxy language, while Portnov did a whole parser for it in Megaparsec (a Haskell parser combinator library). Gsomix decided to take a try on AST in F# (and threatened to call me several times, that was terrifying!), while also struggling with Haskell tooling on an AArch64 computer. After performing some basic tasks from the Hello course (we didn't know that yet!), we have moved from 101st place to 55th. I have tried guessing how many tasks are there in the Hello course and how the scoring works, based on the behavior we observed. I spent some time to push all the available pages to our repository, to have them available at hand at all times. Also, while listing all the pages, I found that some of them can't be decoded by the naïve approach our HTTP client used (because they were represented by full-blown Galaxy expressions, not just string literals). I have pushed these in their encoded form to the repository, so that we can decode them later. Portnov and Foxtran started to solve Lambdaman tasks, while Minoru and Portnov were working on the Galaxy evaluator and corresponding encoder (to encode the stuff back). We noted that several teams already started to solve tasks in the Efficiency course, while skipping the 3D course (as we learned later in the Spoilers document, they have used a "backdoor" the authors left for them — thankfully, it was also possible to get to the course legitimately). We have learned to use echo service to print the results of arbitrary Galaxy expressions. So, since the language_test task was just a complex expression, we've tried abusing echo to get its result. Thankfully, the organizers have considered that people will try that, and it was refusing to print any results for the language test. We've had to improve our own evaluator to solve that task. And at that moment GitHub decided our free credit for private repo's CI has come to the end, and it must spam my email with notifications about that. (Apparently, building Haskell programs takes quite a lot of time on CI if you don't keep any build caches between runs.) Minoru delivered the evaluator, so we've tried to use it on several real-world tasks. Interestingly, it was telling about the "invalid application" on the language_test task, and I started investigation. I thought that there's a problem in our code and the error corresponds to some message in the Haskell evaluator, but actually that was a diagnostic message from the language test itself! It tried doing some basic calculations and check their results, env even print the helpful messages in case any of the calculations weren't correct according to the spec. Thanks to help from Portnov, we've found out that there's a problem in how we handle recursive lambda definitions (we should "shadow" the variables in such case when they conflict, and we never did that). I told folks about what I know of de Brujin index, and they kept brainstorming in that direction for a while. And I tried to hack the language_test by decompiling it and reading the raw string fragments it contained (thankfully, the access code word wasn't included in its raw form, so I didn't succeed). Soon enough, Minoru finished the renumbering, and we were able to get the code legitimately. solve language_test 4w3s0m3 allowed us to move forward with completed Hello course. Foxtran was solving Lambdaman tasks and writing some basic solvers for them in… wait, not in Fortran? He was using C++ and Python?! That's a surprise! But actually no, keep calm. He successfully wrote Fortran in C++ and Python. As expected. He was also drawing some graphs to figure out the solutions for Spaceship. I wanted to write some basic TUI to solve Lambdaman tasks manually, so I decided to take a look at Brick, the Haskell terminal UI library. It turns out to be too complex, so after some reading I put that aside :( In the evening, we finally opened the 3D course and started learning what is the whole "time-traveling programming" about. And the day ended. Day 1, 2024-06-29 Portnov was struggling with A* (in almost every competition, somebody from our team struggles with implementing A*) for Lambdaman, while providing so'''
