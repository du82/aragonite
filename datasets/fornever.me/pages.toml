full_description = '''Code Vectorization in .NET and Other Technologies Publication date: 2023-10-21 Recently somebody sent me a link to a benchmark that compares the performance of .NET, JVM and C++ on a simple task: provided an array of numbers, find the triples of numbers such as their sum is equal to a predetermined number (in our example, the number will be zero, i.e. x + y + z = 0). Here's the whole function in C#: private static int CountTriples(int[] arr, int sum) { int n = arr.Length; int count = 0; for (int i = 0; i < n; i++) { for (int j = i + 1; j < n; j++) { for (int k = j + 1; k < n; k++) { if (arr[i] + arr[j] + arr[k] == sum) { count++; } } } } return count; } For comparison, here's the same function in Java: private static int countTriples(int[] arr, int sum) { int n = arr.length; int count = 0; for (int i = 0; i < n; i++) { for (int j = i + 1; j < n; j++) { for (int k = j + 1; k < n; k++) { if (arr[i] + arr[j] + arr[k] == sum) { count++; } } } } return count; } The implementations are very similar, there's no difference in behavior and algorithm, and they were verified to work the same way on same input. But still, if you run the code, you'll find that Java implementation is 1.3 times faster than C# one! Here are the results from my computer (Intel Core i9-9900 KF @ 3.6 GHz, JVM Corretto-17.0.7.7.1, .NET 8.0.100-rc.1.23463.5): $ javac Triples.java && java TriplesJ ints1k.txt 100 10 […] 47.82 ms +/- 4.90 $ dotnet run -c Release -- ints1k.txt 100 […] 65.03 ms +/- 5.77 Normally, we are used to a situation when .NET implementations of algorithms are a little bit faster than the same implementations in Java, mostly because of value types, generic speicalizations and standard library optimizations that are done in .NET and aren't possible or aren't viable in Java. But in this case, something strange is happening: JVM is notably faster. Let's dig deeper! First of all, let's take a look at the assembly that Java has generated. For whatever reason, JDK is unable to generate assemby code out of the box, so you have to download a separate "disassembly plugin" from a third party (why isn't it published as a part of JDK is beyond me). I used a version from this site, and put it into the current directory. After that, it's possible to see the assembly: $ java -XX:+UnlockDiagnosticVMOptions -XX:CompileCommand=print,TriplesJ.countTriples TriplesJ ints1k.txt 100 10 You can see that the method was recompiled several times during the warm-up stage, and the final version is here: ============================= C2-compiled nmethod ============================== ----------------------------------- Assembly ----------------------------------- Compiled method (c2) 889 272 4 TriplesJ::countTriples (79 bytes) total in heap [0x000001801f812890,0x000001801f812d58] = 1224 relocation [0x000001801f8129e8,0x000001801f812a00] = 24 main code [0x000001801f812a00,0x000001801f812c20] = 544 stub code [0x000001801f812c20,0x000001801f812c38] = 24 oops [0x000001801f812c38,0x000001801f812c40] = 8 metadata [0x000001801f812c40,0x000001801f812c48] = 8 scopes data [0x000001801f812c48,0x000001801f812cd0] = 136 scopes pcs [0x000001801f812cd0,0x000001801f812d40] = 112 dependencies [0x000001801f812d40,0x000001801f812d48] = 8 nul chk table [0x000001801f812d48,0x000001801f812d58] = 16 -------------------------------------------------------------------------------- [Constant Pool (empty)] -------------------------------------------------------------------------------- [Verified Entry Point] # {method} {0x0000018051400670} 'countTriples' '([II)I' in 'TriplesJ' # parm0: rdx:rdx = '[I' # parm1: r8 = int # [sp+0x50] (sp of caller) 0x000001801f812a00: mov %eax,-0x7000(%rsp) 0x000001801f812a07: push %rbp 0x000001801f812a08: sub $0x40,%rsp 0x000001801f812a0c: mov 0xc(%rdx),%ebp ; implicit exception: dispatches to 0x000001801f812bec 0x000001801f812a0f: xor %r9d,%r9d 0x000001801f812a12: test %ebp,%ebp 0x000001801f812a14: jbe 0x000001801f812a39 0x000001801f812a16: mov %ebp