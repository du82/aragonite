full_description = '''What's Your Productivity Potential? This short quiz will help you reflect on the daily practices that impact your productivity and reveal which area would benefit from improvement. TAKE OUR QUIZ AS SEEN INHi, I'm Tiago ForteI’m the founder of Forte Labs, and the question that drives me is, “How can humans reach their creative potential?”To answer that question, I teach and write about new ways for you to thrive in our connected, digital world.Over the last decade, I’ve helped thousands of people build a Second Brain.It’s a trusted place outside your head where you can collect and organize your most important ideas and insights, and use them to do your best work.The ultimate goal of building a Second Brain is to help you lead a more fulfilling life with more ease and less stress.New to Forte Labs? Start here → A Proven Method to Organize Your Digital Life And Unlock Your Creative Potential Read the Best-Selling Book Get the step-by-step guide to building a fully functional digital Second Brain. Order your copy now and get an exclusive bonus. Get the Book Get the Actionable Guide Organize your digital life in seconds with the PARA Method. This is the simple, intuitive system to find any information right when you need it. Get the Guide Join Our Self-Paced Course, BASB Foundation Absorb the fundamentals of the BASB methodology on your own time and in the most distilled, easy-to-understand way. Join BASB Foundation Get the Blueprint for Modern, Digital Productivity Our new self-paced course will provide you with powerful tools and habits so you can start every week with the focus you need to do your best work. Join Pillars of Productivity Success StoriesHow People From All Walks of Life Benefit From a Second Brain Building a Second Brain has freed me up from needing to keep everything inside of my mind. It's made me think like a CEO and made me a better professional. Nivaldo GomesBusiness Development Manager With a Second Brain, the chaos now lives in an external system. Which means my first brain is free of anxieties and is a much better place to be. My relationships with others (and myself) are better for it too. Ariane SantosServiceNow Architect Building a Second Brain has given me the tools to have less stress and anxiety. My tasks now take 1/3 or 1/4 of the time and I'm able to have weekends, Friday mornings, and evenings free for my relationship, family and friends. I'm even enjoying my hobbies like cooking more! Jayme Del RosarioStrength and Movement Coach, NTP, Business Owner I loved the Building a Second Brain course. I wish I started 40 years ago. If I had, today, it would be one of my most valuable tools and possessions. Michael J. SmithFormer College President This is the best investment I’ve made in improving my personal output, productivity, and knowledge management. All of the materials taken together are phenomenal, and I’m really happy with what I’ve learned from the course. Nat EliasonFounder of Growth Machine, podcaster, blogger Having a Second Brain has freed me from brainfog. I have a precise view of my projects and an amazing system of not just „getting things done“ but „GTD with a happy brain!" Erika MagyarosiDipl.-Phil I feel as though I have increased my IQ by 20 points. Of course this isn't true, but it feels this way because I am thinking so much more clearly and with so much more relaxation and concentration. Rob JosephFractional CFO Building a Second Brain is like a fuel injection. I'm ready to create, design, and get things done! Dallas FuentesGerontologist & Transformation Coach The Building a Second Brain course was a game-changer. In the past, all I did was collect and lose information. Now I have a system! Data is not isolated anymore and everything connects. I can feel how my creativity flows freely and my delivery is not only faster, my content is more complex. Carlos SolisTech Evangelist & Author BASB has literally changed my life. Every time I take this course I get a new job, that's more specialized and better aligned with my goals and beliefs. Camila HolandaDesigner, Researcher & Futurist Get Started With Our Free Resources Read Our Blog Our blog is dedicated to exploring the frontier of modern productivity. If you enjoy mind-bending ideas and practical results, if you are tired of the same old productivity advice, and if you believe work can be a source of profound personal growth, you’ll feel right at home. Explore the Blog Watch Our YouTube Videos Every week, we publish fresh videos around building your Second Brain, productivity, and notetaking tools. You’ll also see collaborations with other thought leaders and productivity experts. Browse Our Videos Listen to Our Podcast The Building a Second Brain Podcast gives you the tools to thrive in our digital world in under 10 minutes per episode. Tiago Forte teaches you how to turn your notes, bookmarks and unread articles into completed creative works. Find an Episode Join Our Community​ Looking to meet others interested in productivity and personal knowledge management? Join our free Facebook group to ask questions, share struggles, compare productivity setups, and think deeply with others about the topics that matter most to you. Join the Community'''
