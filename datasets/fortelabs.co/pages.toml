full_description = "Privacy PolicyForte Labs Privacy PolicyThis Privacy Policy explains how Forte Labs, LLC (“Forte Labs,” “we” or “us”) collects, uses, maintains and discloses information collected from users (each a “User” or “you”) of the website fortelabs.co and related online services, including the Praxis Blog, Forte Academy online courses and Forte Labs forum (collectively, the “Services”)What Information Is CollectedWe receive, collect and store any information you enter through the Services or provide us in any other way. In addition, we and our third-party service providers (including any third-party content, advertising, analytics, shipping, and payment processing providers) automatically collect certain information from your device or web browser when you interact with the Services. We collect information in a variety of ways, including:Email Subscriptions: When you sign up to receive our emails, we collect your email address.User Accounts: In order to use certain features of the Services, including our online courses and forum, you may need to sign up for an account. We collect your name, email address and password when you sign up for an account.Analytics: We use third-party service providers to monitor and analyze the use of our Services. Each time you visit the Services we and our third-party service providers automatically collect your Internet Protocol (IP) address, device identifier or other unique identifier, browser and computer type, access time, the webpage you came from and go to next, and your interaction with the Services. In particular, we use Google Analytics, which is a service offered by Google that tracks and reports website traffic. Google uses the data collected to track and monitor the use of our Services. To opt out of being tracked by Google Analytics across all websites, visit this link: http://tools.google.com/dlpage/gaoptout.Purchases: When you make a purchase or place an order through the Services, our third-party service providers will collect your shipping and payment information in order to process and ship your order.Social Media Features: Our Services include certain Social Media features and widgets, single sign on features, such as the “Facebook Connect” or “Google Sign-in”, the “Facebook Like” button, the “Share this” button or other interactive mini-programs (“Social Media Features”). These Social Media Features may collect information such as your IP address or which page you are visiting on our Services.How Information Is UsedWe use the information we collect:to enable you to use our Services, to process information you provide via our Services and to process your transactions;to perform statistical, demographic and marketing analyses of our users and for other internal business purposes to improve our Services;to provide you with information, products, or services that you have requested;to tailor content, recommendations, and advertisements we and third parties display to you, both on the Services and elsewhere online;to comply with regulatory and legal obligations.Sharing Your InformationWe do not sell, trade, or rent your information to others.When you use certain features of the Services, including signing up for our online courses, subscribing to our emails, submitting responses to surveys, and posting in our online forum, we share your information with third-party service providers for the purpose of providing those features.We may also share your information where reasonably necessary to (1) comply with a law, regulation or if we are otherwise legally required to do so; (2) establish, protect, or exercise our legal rights or to defend against legal claims; (3) protect the safety or vital interests of another person.CookiesA “cookie” is a piece of data stored on your computer. We and our third-party service providers use several categories of cookies:Essential Cookies: These allow the Services to function as intended and ensure that the Services are secure and safe to use.Analytics Cookies: These allow us to monitor and analyze the performance, operation and effectiveness of the Services.Personalization Cookies: These allow our Services to remember choices you make to parts of our Services which you can customize in order to provide you with a more personal experience and to avoid you having to re-enter information every time you visit our Services.Social Media Cookies: Third-party social media services may use these cookies when you share information using a social media sharing button or “like” button on our Services or engage with our Services on or through a social networking website such as Facebook, Twitter or Google+.Advertising Cookies: Third-party advertisers that place advertisements through our Services may use these cookies track your browsing habits to enable us to show advertising which is more likely to be of interest to you.Your RightsDepending on where you live, you may have certain legal rights with respect to any personal information collected about you, including the right to access, correct, remove, or restrict the use of your personal information. If you wish the exercise these rights, you may do so by contacting us at [email protected]. We will respond to such requests in accordance with applicable data protection laws.ChangesWe may update this privacy policy at any time. When we do, we will revise the updated date at the bottom of this page. We encourage you to frequently check this page for any changes to stay informed about how we are helping to protect the personal information we collect. You acknowledge and agree that it is your responsibility to review this privacy policy periodically and become aware of modifications.Last updated: Dec. 13, 2019"
