t include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Fort Worth center gives free support to grieving families. Annual run keeps memories alive by Kathryn Miller, Fort Worth Report February 27, 2025 <h1>Fort Worth center gives free support to grieving families. Annual run keeps memories alive</h1> <p class="byline">by Kathryn Miller, Fort Worth Report <br />February 27, 2025</p> <p>Sam Holden became a widow and a single mother to her four daughters at 33.&nbsp;</p> <p>One of her biggest motivators in navigating life after the death of her husband, Bert, is keeping his spirit alive.&nbsp;</p> <p>“I love that this is an opportunity to say his name again and to remember who he was,” Holden said. “Even though his physical body left us, it doesn’t mean that he left us.”</p> <p>The WARM Place, a Fort Worth grief support center for children, is hosting its annual <a href="https://www.thewarmplace.org/get-involved/signature-events/r2rt/">“Race 2 Remember Them” </a>5K and 1-mile fun run at 8:30 a.m. March 1 at 3024 Acme Brick Plaza in southwest Fort Worth’s Clearfork development. The event raises funds to support its children and families.&nbsp;</p> <p>The fundraising goal? $75,000, so The WARM Place —&nbsp; which stands for What About Remembering Me — can keep providing support at no cost.&nbsp;</p> <p>Holden will give a speech about her family’s story of heartbreak, growth and resilience. She didn't give it a second thought when the organization asked her to share about Bert’s life.&nbsp;&nbsp;</p> <p>“When I was in the hospital with him saying my goodbyes, I made him two promises,” Holden said through tears. “To take care of our girls and to make him proud of me.”</p> <p>Holden and her family discovered The WARM Place shortly after moving to Irving from New Braunfels to be closer to their support system.&nbsp;</p> <p>As a newly single parent, she enrolled her girls in public school after she could no longer homeschool them while working a full-time job.</p> <p>The transition to public school was a burden on the girls, especially as they navigated a major loss.</p> <p>“Even though I felt like they were adjusting to the public school system and our new normal pretty well, I realized they weren’t connecting to kids their age who could understand them,” Holden said.&nbsp;</p> <div class="wp-block-group is-style-border has-light-gray-background-color has-background"> <p><strong>If you go</strong></p> <p><strong>What: </strong>“Race 2 Remember Them” 5K and 1-mile fun run</p> <p><strong>When:</strong> Activities begin at 8:30 a.m. March 1</p> <p><strong>Where:</strong> 3024 Acme Brick Plaza, Fort Worth</p> <p><strong>How to attend: </strong>Register to race <a href="https://www.thewarmplace.org/get-involved/signature-events/r2rt/">here</a>.</p> </p></div> <p>The WARM Place was a perfect fit for the Holden family’s needs and has been immensely helpful in providing stability and community, she said.&nbsp;</p> <p>Lilian Holden’s favorite part of The WARM Place is the potluck dinners at the start of every peer support group session. The 9-year-old also likes doing crafts, which have helped her express the emotions that come with grief.&nbsp;</p> <p>“It has made me less sad and a little bit more happy,” Lilian said. “I was really nervous and kind of uncomfortable because the first time I went, every time I talked about Dad, I felt like I was going to cry. But now that I’ve been talking with these people, I’m really friendly and open to talking about my experience.”</p> <p>The WARM Place has helped Holden gain insight into her unique situation as a young single mother and widow with others who can relate. The community she has formed has helped assure her it’s OK that she doesn’t have it all together.&nbsp;</p> <p>“I may go to group one week and feel so angry at the loss, then the next week I may be sobbing because a grief wave has hit,” Holden said. “I’m met with the same love and kindness and acceptance no matter where I’m at emotionally, which allows me to show up in a really authentic way.”</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/The-Warm-Place-1024x768.jpg" alt="" class="wp-image-197682" /><figcaption class="wp-element-caption">The WARM Place, 809 Lipscomb St., offers grief support services for children who experience a loss in their family. (Kathryn Miller | Fort Worth Report)</figcaption></figure> <p>Shelley Bettis, executive director of The WARM Place, said the most special part of the organization’s annual race is the “Mile of Memories.” During the first mile, The WARM Place places signs on the route in honor of loved ones so runners can read special messages and remember for whom they’re running.</p> <p>“It really is a community memorial event,” Bettis said. “Sometimes life gets so busy and so chaotic, so slowing down for a minute and taking a chance to do something all together is so special to these families and to their friends.”</p> <p>Lilian and her sister, Piper Holden, are excited for “Race 2 Remember Them.” They can’t wait for their mom to tell the runners about their family’s story.</p> <p>“Now we get to tell our story to help people learn about their grief,” Piper, 12, said. “I think that’s actually pretty cool.”</p> <p><em>Kathryn Miller is a reporting fellow at the Fort Worth Report. You can contact her at kathryn.miller@fortworthreport.org. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; hre