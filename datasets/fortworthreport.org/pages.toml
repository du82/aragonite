can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Industry leaders envision future of new Texas A&M-Fort Worth campus at downtown summit by Shomial Ahmad, Fort Worth Report February 27, 2025 <h1>Industry leaders envision future of new Texas A&M-Fort Worth campus at downtown summit</h1> <p class="byline">by Shomial Ahmad, Fort Worth Report <br />February 27, 2025</p> <p>Standing on a stage in a downtown Fort Worth office building, Mayor Mattie Parker reflected on how her day began: looking out her hotel window onto the streets of downtown Austin. The view made her think about her city’s future, and how an expanded Texas A&amp;M-Fort Worth campus will transform it.&nbsp;</p> <p>“I’m kind of asking myself, ‘What will Fort Worth look like in the next 10 to 20 years?’” she told the audience gathered inside Frost Tower. </p> <p>The answer to that question marries both of Parker’s academic identities. She’s a Longhorn who got her law degree from the Texas A&amp;M School of Law back when it was still Texas Wesleyan. What’s powered a lot of Austin’s growth, she said, is her alma mater.</p> <p>“University of Texas (at Austin) has anchored their city in so many ways, it’s been an exciting hub of innovation and moving a city and a community forward,” said Parker, who was wearing a burnt orange jacket that appeared brown in the afternoon light of downtown Fort Worth. “And I know for a fact that A&amp;M is already doing that now and will continue to do it.”</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/IMG_8404-1024x768.jpg" alt="" class="wp-image-197838" /><figcaption class="wp-element-caption">Mayor Mattie Parker addresses business and academic leaders at a Texas A&amp;M-Fort Worth innovation summit in the Frost Tower in downtown Feb. 27, 2025. (Shomial Ahmad | Fort Worth Report)</figcaption></figure> <p>Over 100 business and academic leaders attended a Texas A&amp;M-Fort Worth Innovation Summit in downtown Thursday with the purpose of building out the academic and industry partnerships that will eventually be housed in Texas A&amp;M-Fort Worth’s <a href="https://fortworthreport.org/2024/08/01/second-building-in-texas-ams-downtown-fort-worth-campus-gets-green-light/">Research and Innovation Building currently being designed</a>. Industry experts met in small groups to discuss the role the university could play in aerospace, agriculture, entrepreneurship, media and entertainment, workforce education and health care innovation.&nbsp;</p> <p>“Our breakouts today are focused on taking the hub concept ideas that we’ve created based on industry input,” said Darryl Heath, executive director of the Fort Worth and Tarrant County Innovation Partnership. “Now we are taking them down a level to understand how we’re going to activate those in the marketplace as small businesses in the next six months.”</p> <p>The first Texas A&amp;M-Fort Worth building, known as the <a href="https://fortworthreport.org/2024/11/11/city-leaders-mark-milestone-in-texas-am-fort-worth-campus-construction/">Law and Education Building</a>, won’t open its doors until 2026. There’s no current opening date for the Research and Innovation Building, which still needs further approval from the university’s board of regents to move forward.</p> <p>But university and business leaders are laying the groundwork for their ideas, especially for upcoming research programs, now.&nbsp;</p> <p>Lockheed Martin, Cook Children’s and health care business incubator Techstars were among the organizations represented at the event.&nbsp;</p> <p>Heath said in the past year they’ve had conversations with 70 companies across North Texas. Following the summit, university officials will establish a working group that will then create an action plan.&nbsp;</p> <p>“We want them up and running now, probably in a temporary space. And the reason is because they have to grow, and they need time,” said Heath. “It will take time for them to get to a scaled place where they can actually occupy the new building.”</p> <p>With federal and state funding hanging in the balance, Texas A&amp;M-Fort Worth may have to make some adjustments along the way. Federally funded research has already been affected in the first weeks of the Trump administration, with <a href="https://fortworthreport.org/2025/02/12/unt-health-science-centers-150m-alzheimers-study-could-face-cuts-under-new-trump-rule/">major changes at the National Institutes of Health</a> and the National Science Foundation that could cut hundreds of millions in funds going to higher education institutions.&nbsp;</p> <p>This week, both the Texas House and the Senate unveiled their budget proposals. It would include <a href="https://www.texastribune.org/2025/02/27/dan-patrick-texas-legislature-higher-education-cut-dei/">a $420 million cut to higher education</a>. For A&amp;M, that would mean around a $50 million loss in funding over the next two years if passed, according to the Texas Tribune.&nbsp;</p> <p>Robert Ahdieh, the chief operating officer of Texas A&amp;M-Fort Worth and the dean of A&amp;M’s law school, said that there are “huge risks” around what’s happening at the state and federal level. But he doesn’t have long-term concerns.</p> <p>“We’re looking at all the contingencies and trying to prepare for the worst-case scenario, the somewhat bad scenario, and so on and so forth,” said Ahdieh. “Is it possible that it slows down some of the things? Sure.”</p> <p>In Washington and Austin, Ahdieh said, Texas A&amp;M officials are making their case every day to show not just how funding cuts would impact the university, but the community around it.&nbsp;</p> <p><em>Shomial Ahmad is a higher education reporter for the Fort Worth Report, in partnership with </em><a href="https://www.opencampusmedia.org/"><em>Open Campus</em></a><em>. Contact her at </em><a href="mailto:shomial.ahmad@fortworthreport.org"><em>shomial.ahmad@fortworthreport.org</em></a><em>.</em></p> <p><em>At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/02/27/industry-leaders-envision-future-of-ne'''
