title = "After his son adjusted to school, he learned the boy’s Fort Worth ISD campus could close | Fort Worth Report"
description = "More than 500 people attended FWISD’s third community meeting about school closures. Here’s why this dad is concerned about his son."
full_description = '''He knows the hallways. He knows the teachers. He knows the principal. Joshua Puente, a pre-K student at Bruce Shulkey Elementary, has become familiar with the rhythms of school. Nailing the process was hard, said his dad, Daniel Puente. Joshua has autism. Puente picked Shulkey because of its programs that help his son. Now Joshua may have to deal with the potential closure of his school.“He’s not someone who quickly right away can turn and pivot on something out of nowhere,” Puente said.Puente was one of more than 500 people packed into the auditorium at Benbrook Middle-High School to learn about Fort Worth ISD’s potential school closure plans. Leaders detailed still-fluid options for closing elementary schools in the Arlington Heights, Benbrook, South Hills, Southwest and Western Hills high school pyramids.<iframe title="How many empty seats does Fort Worth ISD have?" aria-label="Bullet Bars" id="datawrapper-chart-nUcb3" src="https://datawrapper.dwcdn.net/nUcb3/2/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="344" data-external="1"></iframe>!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}(); ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe Consultant Tracy Richter outlined two options for the Southwest pyramid. Both included the potential closure of Shulkey Elementary. In the first option, either Shulkey Elementary or J.T. Stevens Elementary would close. In the second, one of the two schools would be rebuilt and the other closed. Two schools would become one.Both schools have fewer than 400 students. Enrollment is projected to slide further by the 2028-29 school year. Fewer families are expected to live in the neighborhoods surrounding the campuses.<iframe title="Fort Worth ISD's enrollment projected to dip below 60,000 by 2033-34 school year" aria-label="Interactive line chart" id="datawrapper-chart-R2LIS" src="https://datawrapper.dwcdn.net/R2LIS/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="433" data-external="1"></iframe>!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}();Puente listened to Richter as he leaned against a gray wall in the back of the auditorium. Questions popped into his head. How will students get to school? Will Shulkey Elementary close?What about Joshua?“I hope this is just a starting point,” Puente said.Superintendent-designate Karen Molinar answers audience questions about the Fort Worth ISD school closure plans during a meeting Feb. 27, 2025, in Benbrook Middle-High School. (Jacob Sanchez | Fort Worth Report)Superintendent-designate Karen Molinar slowly paced on the light oak wood stage with her microphone. She stopped and looked at the audience. The draft options, she said, are just that. Drafts. They’re changing and have shifted since they were presented to the school board in mid-February.For example, an initial option presented to trustees was to close Western Hills High School and convert it into a middle school. That option is no longer on the table, Molinar said.<iframe title="Nearly a third of Fort Worth ISD's elementary classrooms are empty" aria-label="Bullet Bars" id="datawrapper-chart-w5yZb" src="https://datawrapper.dwcdn.net/w5yZb/2/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="194" data-external="1"></iframe>!function(){"use strict";window.addEventListener("message",(function(a){if(void 0!==a.data["datawrapper-height"]){var e=document.querySelectorAll("iframe");for(var t in a.data["datawrapper-height"])for(var r=0;r<e.length;r++)if(e[r].contentWindow===a.source){var i=a.data["datawrapper-height"][t]+"px";e[r].style.height=i}}}))}();Why close schools? Nearly 1 in 5 students have left Fort Worth ISD since its enrollment peak of 87,233 during the 2016-17 school year. Around 70,000 students currently attend Fort Worth ISD schools. Lower birth rates, fewer immigrants, demographic shifts and an aging population are fueling the enrollment drops. Parents also are choosing to enroll their children into charter schools, other traditional public schools and private schools. No sustainable path exists for Fort Worth ISD to keep operating 140 schools, many of which have too few students and too many empty classrooms, according to district officials.District leaders want the school closure plans ready for school board consideration later in the spring. If it doesn’t, Molinar intends to push it to the fall semester so parents can be involved. No decisions will happen during the summer.In fact, no school will close next academic year. Instead, the plan will be rolled out over the next two, five and upward to 15 years, according to district officials.Hearing Molinar say a closure is not imminent eased Puente. Still, he knows moving schools will be difficult regardless of his son’s age.“Just a quick uproot for him is going to really freak him out,” Puente said.For now, Puente will keep his son in his routine. The question of whether Joshua’s school will close will linger.Will he know the new hallways? The new teachers? The new principal?What closure options were presented? Fort Worth ISD leaders showed new draft options for closing schools to more than 500 attendees gathered inside Benbrook Middle-High School. Some options include construction projects that require the school board to call for a bond election, an effort district leaders are not considering for the immediate future. The ideal enrollment the district is looking for is 500 to 750 students per school. Here’s what’s on the table, as of Feb. 27, 2025: Arlington Heights pyramid 260 empty seats 2 schools with under 350 students 2 schools do not have live-in enrollment under 300 1 does not have capacity equal or greater than ideal range Option 1: Close North Hi Mount Elementary and send students into Burton Hill Elementary and South Hi Mount Elementary. Rezone around 60 Ridglea Hills Elementary students who live south of Interstate 20 to Benbrook Elementary. Option 2: Rebuild Burton Hill Elementary to increase capacity to 750 students. Rebuild South Hi Mount Elementary to increase capacity to 600 students. Close M.L. Phillips Elementary and send students to a Burton Hills Elementary replacement campus and Leadership Academy Network at Como Elementary. Rezone around 60 Ridglea Hills Elementary students who live south of Interstate 20 to Benbrook Elementary. Option 3: Rebuild Burton Hill Elementary to increase capacity to 750 students. Rebuild South Hi Mount Elementary to increase capacity to 750 students. Close North Hi Mount Elementary and send students into South Hi Mount Elementary. Rezone around 60 Ridglea Hills Elementary students who live south of Interstate 20 to Benbrook Elementary. Benbrook pyramid 983 empty seats 1 school with under 350 students 1,583 new students projected for next five years, with growth trend continuing All elementary schools have capacity equal or greater than ideal range Option 1: Rezone around 60 Ridglea Hills Elementary students who live south of Interstate 20 to Benbrook Elementary. Option 2: Rebuild Benbrook Elementary to increase capacity to 750 students. Rezone around 60 Ridglea Hills Elementary students who live south of Interstate 20 to Benbrook Elementary. South Hills pyramid 1,199 empty seats 1 school with under 350 students 71% of elementary school capacity is in use All elementary schools have capacity equal or greater than ideal range Option 1: Rebuild Worth Heights Elementary to increase capacity to 750 students. Close Richard Wilson Elementary or Hubbard Heights Elementary and send students to the campus that remains open. Option 2: Rebuild Worth Heights Elementary to increase capacity to 750 students. Renovate either Richard Wilson Elementary or Hubbard Heights Elementary. Close the other campus and send students to the school that remains open. Southwest pyramid 1,015 empty seats 3 schools with under 400 students 67.5% of elementary school capacity is in use All elementary schools have capacity equal or greater than ideal range Option 1: Close either Bruce Shulkey Elementary or J.T. Stevens Elementary and send students to the campus that remains open. Adjust attendance boundaries at remaining campus and Westcreek Elementary to balance enrollment. Option 2: Rebuild either Bruce Shulkey Elementary or J.T. Stevens Elementary to have a capacity of 750 students. Close the other campus and send students to the new school. Renovate Westcreek Elementary. Adjust attendance boundaries at remaining campus and Westcreek Elementary to balance enrollment. Western Hills Elementary 877 empty seats 69.1% of elementary school capacity is in use All schools have capacity equal or greater than ideal range Option 1: Repurpose Western Hills Elementary to serve pre-K to fifth-grade students after closing Western Hills Primary and merging the two campuses. Adjust attendance boundaries for Western Hills Elementary and Luella Merrett Elementary to balance enrollment. Option 2: Repurpose Western Hills Elementary to serve pre-K to fifth-grade students after closing Western Hills Primary and merging the two campuses. Adjust attendance boundaries for Western Hills Elementary and Luella Merrett Elementary to balance enrollment. Rebuild Luella Merrett Elementary to increase capacity to 750 students.Jacob Sanchez is a senior education reporter for the Fort Worth Report. Contact him at jacob.sanchez@fortworthreport.org or @_jacob_sanchez. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-26015').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworthreport.org. For noncommercial digital publications: Look for the "Republish This Story" button underneath each story. To republish online, simply click the button, copy the html code 