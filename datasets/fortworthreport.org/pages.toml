was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Asian artistic expression sits at heart of new UTA exhibition by Drew Shaw, Arlington Report February 27, 2025 <h1>Asian artistic expression sits at heart of new UTA exhibition</h1> <p class="byline">by Drew Shaw, Arlington Report <br />February 27, 2025</p> <p>Keisho Okayama’s life as a Japanese American painter has been largely overlooked by art historians.</p> <p>Like his minimalist, muted paintings, his experiences offered a unique glimpse into the lives of 20th century Japanese Americans. Years spent as a child incarcerated in a detainment camp for Japanese Americans during World War II impacted his artistic views of his heritage and religion for the rest of his life.&nbsp;</p> <p>When Fletcher Coleman, an art history professor at the University of Texas at Arlington, gave Okayama’s artwork a second look, he knew it was worth elevating as an unexplored piece of Asian artistic expression.</p> <p>As Coleman began curating <a href="https://solaceinpainting.com/" target="_blank" rel="noreferrer noopener">“Solace in Painting: Reflecting on a Tumultuous Century”</a> — an exhibition now on display at The Gallery at UTA — he wanted to highlight Asian artists who lived through conflict in the 1900s but have historically been excluded from conversations about artistic depictions of turmoil.&nbsp;</p> <p>“I’m introducing these artists’ biographies, and I’m using those to show the strength of the work,” Coleman said.</p> <p>“Solace in Painting” is the first UTA-originated exhibition that will go on to travel across the country, Coleman said. The exhibition is free to visit until March 29 before heading to the UNO Gallery at the University of Nebraska at Omaha.</p> <p><a href="https://solaceinpainting.com/chao-shao-an/" target="_blank" rel="noreferrer noopener">Okayama</a>’s paintings hang next to two other lesser-known artists: <a href="https://solaceinpainting.com/chao-shao-an/" target="_blank" rel="noreferrer noopener">Chao Shao-an</a>, a Hong Kong-born artist who died in 1998, and <a href="https://solaceinpainting.com/ann-phong/" target="_blank" rel="noreferrer noopener">Ann Phong</a>, a Vietnamese American artist born in 1957.&nbsp;</p> <p>Work by each of the artists, while different, subtly explores both of their experiences of major conflicts in Asia.</p> <p>Okayama immigrated to the U.S. with his family at age 2, and his father soon became one of America’s highest-ranking Buddhist priests.&nbsp;</p> <p>He spent his career as an artist in Los Angeles, building a local reputation for his style that reflected a complicated relationship with Buddhism.</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/UTA-Art-4-1024x683.jpg" alt="" class="wp-image-192644" /><figcaption class="wp-element-caption">Yukio Lippit, a professor of Japanese art and architecture at Harvard University, discusses the artwork of Keisho Okayama Feb. 6, 2025, at the University of Texas at Arlington’s “Solace in Painting: Reflecting on a Tumultuous Century” exhibition. (Drew Shaw | Arlington Report)</figcaption></figure> <p>When Coleman found Okayama’s work, he was struck by their resemblance to medieval Buddhist compositions, which mimic ancient cave paintings — an area Coleman studied deeply.</p> <p>Shao-an, a Hong Kong artist, lived through many of the 20th century conflicts in China, from the 1911 fall of the Qing dynasty to the return of Hong Kong to the People’s Republic of China in 1997.</p> <p>The subject of his paintings? Flowers and birds.&nbsp;</p> <p>In his peaceful ink and pigment artwork, Shao-an embedded metaphors about the chaotic period he lived through.</p> <p>The three-dimensional acrylic paintings of Phong, the only living artist of the trio, jump from the gallery’s walls with vibrant motifs reminiscent of ocean waves, rolling hills and cotton clouds. Humanoid faces and figures hide in the abstract paintings, making both the artwork and the nature it depicts feel dynamic.</p> <p>Phong escaped from Saigon at the end of the Vietnam War. Her recent paintings combine her experiences as an immigrant with her passion for how climate change affects nature in Vietnamese and American communities.</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/UTA-Art-2-1024x683.jpg" alt="" class="wp-image-192642" /><figcaption class="wp-element-caption">A university student studies the work of Ann Phong, a Vietnamese American painter, on Feb. 6, 2025, at the University of Texas at Arlington’s “Solace in Painting: Reflecting on a Tumultuous Century” exhibition. (Drew Shaw | Arlington Report)</figcaption></figure> <p>He feels the exhibition is especially relevant to UTA, which ranks as the nation’s sixth-most diverse university and, in 2022, reported that 12% of its students were of Asian descent, according to the university’s website.</p> <p>“Oftentimes, diasporic artists’ stories become the focal point, rather than the work itself,” Coleman said. “I want to recognize artists, and the relationship of their work to their biography, while shining a light on their work and highlighting its power.”</p> <div class="wp-block-group has-light-gray-background-color has-background"> <h2 class="wp-block-heading has-text-align-center" id="h-if-you-go">If you go:</h2> <p><strong>What:</strong> <a href="https://fortworthreport.org/event/solace-in-painting-reflecting-on-a-tumultuous-century/2025-03-06/" target="_blank" rel="noreferrer noopener">“Solace in Painting: Reflecting on a Tumultuous Century” at the University of Texas at Arlington</a></p> <p><strong>Where:</strong> <a href="https://thegallery.uta.edu/visit/" target="_blank" rel="noreferrer noopener">The Gallery at UTA</a>, 502 S. Cooper St., Arlington</p> <p><strong>When:</strong> 10 a.m.-5 p.m. Mondays-Fridays; noon-5 p.m. Saturdays through March 29</p> <p><strong>Price: </strong>Free, but parking must be booked in advance</p> <p><strong>More info:</strong> Free parking in the gallery visitor spots in the F7 parking lot is available during the week, by reservation. For information on how to reserve, visit the <a href="https://thegallery.uta.edu/visit/" target="_blank" rel="noreferrer noopener">Gallery’s website</a>.</p> <p>Free parking o'''
