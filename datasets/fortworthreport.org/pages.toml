title = "City of Fort Worth pushes for public vote in Keller ISD split | Fort Worth Report"
description = "Fort Worth urges Texas AG to require public vote on KISD potential split, arguing state law mandates voter approval for district detachment."
full_description = '''The city of Fort Worth formally urged Texas Attorney General Ken Paxton to clarify the legal requirements for detaching a new school district from an existing one, emphasizing that an election must be held regardless of how the process is initiated.In a letter sent Feb. 27, Fort Worth City Attorney Leann Guzman argues that state law necessitates voter approval before a new district can be formed.The issue arises as Keller ISD considers forming a new school district by detaching a portion of its existing territory. Some, like Tarrant County Commissioner Matt Krause, have suggested that a board resolution alone may be sufficient to create the new district, bypassing the need for an election. Phil Sorrells and the Tarrant County District Attorney’s Office sought an official opinion from the attorney general on the matter Feb. 13, prompting Fort Worth to submit its own interpretation.Fort Worth’s letter contends that the Texas Education Code explicitly mandates an election when a new district is formed through detachment, whether the process is initiated by a resolution from a school board or by a petition from registered voters. The letter states that detachment can be “initiated by” a resolution or petition but does not distinguish between the two in terms of procedural requirements. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe “‘Initiated by,’ in plain language, means ‘started by,’” Guzman wrote. “Thus, a plain reading of the language of 13.103 allows that the process of creating a new school district by detachment may be started in one of two ways: a petition or a resolution. But if a resolution alone were sufficient to create the new district — whereas a petition may only start the process — then the words ‘initiated by’ would mean two completely different things within the space of a single sentence.”The letter references historical legislative revisions to the Texas Education Code, noting that before 1995, detachment was only permitted through a petition process. While the law was later amended to allow initiation by resolution, Fort Worth argues that this change did not remove the election requirement. Furthermore, Guzman points out that no other provisions in the education code allow school districts to unilaterally alter their boundaries without voter input.“The better interpretation, and the one that ensures parents have a direct voice in such an important decision affecting their children’s education, is the one that recognizes that an election is required,” the letter states.If the attorney general rules in favor of Fort Worth’s interpretation, Keller ISD and any future districts seeking detachment would need to hold elections before proceeding. If the ruling favors the view that a resolution alone is sufficient, Keller ISD would gain autonomy in redrawing district lines.In a Feb. 28 Facebook post, Fort Worth City Council member Alan Blaylock voiced support for ensuring that voters have the final say in any potential split. Fort Worth City Council districts include portions of Keller ISD.“I, along with Councilmembers (Charles) Lauersdorf and (Macy) Hill, stand with our constituents in their deep concerns regarding Keller ISD,” Blaylock said in the post. “We remain committed to advocating on their behalf to ensure the best possible outcome for our residents. We firmly believe that if a split were to occur, the public has the right to vote on the matter and the law supports this interpretation.”Lauersdorf also emphasized that the issue should not be about exploiting legal loopholes but about following the intent of the law.“We support the issue of law that says this should be put to a vote,” Lauersdorf said. “No district should be able to move forward with a split without taking it to a vote.”He acknowledged the political complexities surrounding the attorney general’s decision, noting that Paxton is not required to issue an opinion.“With as big of a deal as this is and how this could impact school districts statewide — between that and all the talk of vouchers and everything else — I don’t know if he would pick it up because of everything else going on,” Lauersdorf said. “This could easily become all about politics and not about the people.”Officials, such as Mayor Mattie Parker, Tarrant County Commissioners Alisa Simmons and Manny Ramirez and state representatives David Lowe and Nate Schatzline have all voiced their support for requiring a public vote on any potential Keller ISD split.Matthew Sgroi is an education reporter for the Fort Worth Report. Contact him at matthew.sgroi@fortworthreport.org or @matthewsgroi1. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-3fd28').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work i