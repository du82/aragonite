full_description = "Honoring unsung heroes for making extraordinary differences every day. Sponsored by Central Market, H-E-B and JPS Health Network. What is 52 Faces of Community? 52 Faces of Community honors unsung heroes for making extraordinary differences every day: the people who are our neighbors and who quietly make our lives better every day. They serve based on filling a need and rarely receive recognition for all they give.Nominate a candidate for 52 Faces of Community Let us know about an unsung hero in the Tarrant County community! All submissions will be reviewed by the editorial committee. Selected candidates will be profiled here. Nominate a candidateThroughout 2025, unsung heroes will be nominated through a variety of ways, including local non-profits, churches,schools and other community organizations. A selection committee will review nominees and select 52 honorees.Each week, Fort Worth Report will publish an article, with a photo, highlighting the accomplishments ofthe recipient. Year-end recognition eventAfter sharing 52 weeks of profile stories, each unsung hero and a guest will be honored at a recognition luncheon where we willhighlight ten of our heroes and announce the name of one honoree to represent Tarrant County at the Jefferson Awards inWashington, D.C.The Jefferson Awards were founded over 50 years ago by Jacqueline Kennedy Onassis to honor people who wake up every day to help one another and make their community a better place to live. .wp-block-newspack-blocks-homepage-articles article .entry-title{font-size: 1.2em;}.wp-block-newspack-blocks-homepage-articles .entry-meta{display: flex;flex-wrap: wrap;align-items: center;margin-top: 0.5em;}.wp-block-newspack-blocks-homepage-articles article .entry-meta{font-size: 0.8em;}.wp-block-newspack-blocks-homepage-articles article .avatar{height: 25px;width: 25px;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail{margin: 0;margin-bottom: 0.25em;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail img{height: auto;width: 100%;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail figcaption{margin-bottom: 0.5em;}.wp-block-newspack-blocks-homepage-articles p{margin: 0.5em 0;}.wpnbha.ts-3 .entry-title{font-size: 1em}.wpnbha.ts-3 article .newspack-post-subtitle,.wpnbha.ts-3 article .entry-wrapper p,.wpnbha.ts-3 article .entry-wrapper .more-link,.wpnbha.ts-3 article .entry-meta{font-size: 0.8em;} 52 Faces: Lupe Lynch’s love for students fuels PTA growth in Fort Worth ISD Lynch played a key role in increasing the number of FWISD PTAs from 55 to 65. Here’s how she did it and why she volunteers. by Jacob Sanchez March 1, 2025 4:30 pmFebruary 28, 2025 1:45 pm 52 Faces: Al Lobo is driving force for change for Catholic Charities Fort Worth Retirement didn’t slow down Al Lobo. Behind the wheel, he’s more than a driver, connecting Tarrant County’s most vulnerable to hope. by Matthew Sgroi February 22, 2025 5:15 pmFebruary 25, 2025 2:13 pm 52 Faces: Historic Black Northside church is both home and family for Shirley Knox Benton Benton sees her work in documenting the church’s history as being part of building a shared community. by Shomial Ahmad February 15, 2025 3:00 pmFebruary 25, 2025 2:13 pm 52 Faces: Denise Blakely connects impoverished North Texans with tools to succeed Blakely created Eastside Ministries’ Railroad Project to offer food, clothing and counseling and help clients break cycles of poverty. by Marissa Greene February 8, 2025 4:30 pmFebruary 7, 2025 5:57 pm 52 Faces: Chantel Bedlington uses personal experience to ensure every child has a home After she and her husband helped two relatives avoid foster care, Chantel Bedlington made it a mission to help kinship caregivers in North Texas. by Nicole Lopez February 2, 2025 12:00 pmFebruary 3, 2025 11:58 am 52 Faces: Trinity Habitat for Humanity volunteer day turns into one man’s 20-year passion Gary Baxter, a longtime Habitat for Humanity volunteer in Fort Worth, got hooked after one day of building. by Scott Nishimura January 26, 2025 12:00 pmFebruary 17, 2025 2:52 pm 52 Faces: Personal experience with tragic loss fans Karen Johnson’s fire for volunteer work Karen Johnson traces her passion for community service to watching her mother cook and bake for needy families. by Scott Nishimura January 18, 2025 12:00 pmJanuary 19, 2025 5:45 pm 52 Faces: Nancy Marchant spends lifetime blending passions for volunteerism, community, travel Marchant has enjoyed the freedom to mix paid work and volunteering, but prioritizes community service. by Scott Nishimura January 12, 2025 12:00 pmJanuary 13, 2025 2:37 pm"
