hat reads: “This story was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.52 Faces: Lupe Lynch’s love for students fuels PTA growth in Fort Worth ISD by Jacob Sanchez, Fort Worth Report March 1, 2025 <h1>52 Faces: Lupe Lynch’s love for students fuels PTA growth in Fort Worth ISD</h1> <p class="byline">by Jacob Sanchez, Fort Worth Report <br />March 1, 2025</p> <p>Lupe Lynch was in her natural element during the Fort Worth ISD Council of PTAs’ annual luncheon.</p> <div class="wp-block-group alignright has-light-gray-background-color has-background" style="padding-right:var(--wp--preset--spacing--50);padding-left:var(--wp--preset--spacing--50)"> <h3 class="wp-block-heading has-text-align-left" id="h-welcome-to-52-faces"><strong>Welcome to 52 Faces</strong></h3> <figure class="wp-block-image aligncenter size-full is-resized"><img src="https://fortworthreport.org/wp-content/uploads/2025/01/52-faces-transparent-2.png" alt="52 faces of community logo" class="wp-image-185414" style="width:256px;height:auto" /></figure> <p class="has-text-align-left"><a href="https://fortworthreport.org/52-faces-of-community/" target="_blank" rel="noreferrer noopener">52 Faces of Community</a> is a Fort Worth Report weekly series spotlighting local unsung heroes. It is sponsored by <a href="https://www.centralmarket.com/" target="_blank" rel="noreferrer noopener">Central Market</a> and <a href="http://heb.com" target="_blank" rel="noreferrer noopener">H-E-B</a>.</p> <p>At the end of the year, these rarely recognized heroes will gather for a luncheon where the Report will announce one honoree to represent Tarrant County at the Jefferson Awards in Washington, D.C.</p> </p></div> <p>She greeted people as they entered.</p> <p>She crisscrossed the room checking whether members were ready to vote.</p> <p>She presented awards, including golden apples, to PTA members to thank them for their hard work.</p> <p>Lynch, 38, pours herself into serving as a PTA leader, according to her colleagues. Her efforts led to her nomination for <a href="https://fortworthreport.org/52-faces-of-community/" target="_blank" rel="noreferrer noopener">52 Faces of Community</a>, the Fort Worth Report’s weekly series spotlighting unsung heroes in Tarrant County.</p> <p>“It’s not my intention to bring glory to myself at all — or even to glorify my school — even though I 100% love it,” Lynch said.</p> <p>Lynch started volunteering when her daughter entered pre-K and the school’s secretary suggested it. Even though it was outside of her comfort zone, Lynch leaped at the opportunity, so she could be inside the school and see her child.</p> <p>Five years later, she is now vice president of the <a href="https://www.fwisdpta.org/home" target="_blank" rel="noreferrer noopener">Fort Worth ISD Council of PTAs</a>. And, she’s still an active member at Riverside Applied Learning Center’s PTA.</p> <p>Marisol Herrera, the council’s current president, described Lynch as her right-hand woman and instrumental in <a href="https://fortworthreport.org/2022/09/08/explainer-want-to-start-a-pta-at-your-school-heres-how/" target="_blank" rel="noreferrer noopener">expanding PTAs</a> into underrepresented areas of Fort Worth ISD. </p> <p>When Herrera brought the idea up to Lynch, she whipped out maps and sifted through data to find gaps. They found them in Eastside, in Northside and even in Riverside.</p> <div class="wp-block-group alignleft has-light-gray-background-color has-background" style="padding-right:var(--wp--preset--spacing--50);padding-left:var(--wp--preset--spacing--50)"> <h4 class="wp-block-heading has-text-align-left" id="h-know-an-unsung-hero-in-tarrant-county">Know an unsung hero in Tarrant County?</h4> <p>Tell us about them by filling out the form below. </p> <div class="wp-block-buttons"> <div class="wp-block-button"><a class="wp-block-button__link has-primary-background-color has-background has-text-align-center wp-element-button" href="https://docs.google.com/forms/d/e/1FAIpQLScRZweSSIqBAKXpCpfkACOhDGHEIYrJZcqo9dmjhX9udkRj0Q/viewform?usp=sf_link" target="_blank" rel="noreferrer noopener">Nominate an unsung hero</a></div> </p></div> </p></div> <p>Lynch pinpointed schools. Herrera sent Lynch to the campuses and talked to parents and teachers.</p> <p>In the past two years, Lynch helped <a href="https://fortworthreport.org/2022/06/21/van-zandt-guinn-elementary-could-provide-blueprint-to-growing-ptas-in-fort-worth-isd/" target="_blank" rel="noreferrer noopener">grow the number of PTAs</a> in the district from 55 to 65 — with another three schools in the works, including her alma mater of Diamond Hill-Jarvis High School.</p> <p>“When you find somebody who’s deeply committed to the mission, you hang on to those people because those people are priceless,” Herrera said.</p> <p>Lynch hangs on not because of her two kids nor hours upon hours of unpaid work. She volunteers for a bigger reason.</p> <p>“It’s all about the kiddos,” she said. “If we can make an influence in just one student’s life, we truly succeeded.”</p> <p><em>Jacob Sanchez is a senior education reporter for the Fort Worth Report. Contact him at <a href="mailto:jacob.sanchez@fortworthreport.org" target="_blank" rel="noreferrer noopener">jacob.sanchez@fortworthreport.org</a> or </em><a href="https://twitter.com/_jacob_sanchez" target="_blank" rel="noreferrer noopener"><em>@_jacob_sanchez</em></a><em>. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/" target="_blank" rel="noreferrer noopener"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/03/01/52-faces-lupe-lynchs-love-for-students-fuels-pta-growth-in-fort-worth-isd/&quot;&gt;article&lt;/a&gt; first appeared on &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org&quot;&gt;Fort Worth Report&lt;/a&gt; and is republished here under a Creative Commons license.&lt;img src=&quot;https://i0.wp.com/fortworthreport.org/wp-content/uploads/2021/04/cropped-favicon.png?resize=150%2C150&amp;amp;ssl=1&quot; style=&quot;width:1em;height:1em;margin-left:10px;&quot;&gt;&lt;img id=&quot;republication-tracker-tool-source&quot; src=&quot;https://fortworthreport.org/?republication-pixel=true&amp;post=198056&amp;amp;ga4=2820184429&quot; style=&quot;width:1px;height:1px;&quot;&gt;&lt;script&gt; PARSELY = { autotrack: false, onload: function() { PARSELY.beacon.trackPageView({ url: &quot;https://fortworthreport.org/2025/03/01/52-faces-lupe-lynchs-love-for-students-fuels-pta-growth-in-fort-worth-isd/&quot;, urlref: window.location.href }); } } &lt;/script&gt; &lt;script id=&quot;parsely-cfg&quot; src=&quot;//cdn.parsely.com/keys/fortworthreport.org/p.js&quot;&gt;&lt;/script&gt;</p> Copy to Clipboard 1 Tagged: 52 Faces, Fort Worth ISD Jacob SanchezSenior Education Reporter Jacob Sanchez is senior education reporter for the Fort Worth Report. His work has appeared in the Temple Daily Telegram, The Texas Tribune and the Texas Observer. He is a graduate of St. Edward’s University.... More by Jacob Sanchez'''
