["https://fortworthreport.org/2025/03/01/arlington-museum-of-art-seeks-artists-for-its-first-pride-exhibition-in-june"]
title = "Arlington Museum of Art seeks artists for its first Pride exhibition in June | Fort Worth Report"
description = "The museum will host the juried exhibition in collaboration with Help Center for LGBTQ+ Health and Wellness to support diverse artists."
full_description = '''Are you a Tarrant County artist in the LGBTQ+ community with work to showcase? The Arlington Museum of Art wants to hear from you. The nonprofit museum recently announced it will host its first Pride juried exhibition in June in collaboration with Fort Worth-based Help Center for LGBTQ+ Health and Wellness. Get Arlington news that matters. Sign up for local stories in your inbox every Thursday. Subscribe for free Kendall Quirk, director of exhibitions at Arlington Museum of Art, said the show is part of the institution’s broader effort to reflect the community and support diverse artists. “It’s a really big priority for us to focus on artists who are in certain groups or who need spaces to display their artwork and just finding ways to celebrate them and boost them up,” she told the Report. The free exhibition will take place at the Arlington Museum of Art’s new location inside the Esports Stadium at 1200 Ballpark Way in the city’s Entertainment District. The museum relocated to the new space in March 2024 to boost foot traffic. “Both AMA and HELP share a commitment to showcasing the achievements of all members of our community. The Pride month juried art exhibition presents a wonderful opportunity to unite our visions and introduce a vibrant new event featuring world-class art to the North Texas community,” DeeJay Johannessen, CEO of the Help Center, said in a statement. While the Arlington museum is excited to launch its Pride exhibition, the institution anticipates potential pushback, Quirk said. Over the past year, Tarrant County has been the site of controversies involving Pride celebrations and exhibitions featuring LGBTQ+ artists. Last September, the Amon Carter Museum of American Art celebrated the opening of the traveling exhibition “Cowboy.” Less than two weeks later, the show — which included works that “disrupt the homogeneous ideal of the cowboy as a White, cisgender American male,” including pieces by openly LGBTQ+ artists — was temporarily closed without explanation. The show later reopened with a new sign warning guests of “mature content.” Museum officials have declined to say which pieces within the exhibition the label refers to, leaving artists with unanswered questions. “Cowboy” remains on view through March 23. The city of Fort Worth also did away with its most prestigious form of recognition, proclamations issued on behalf of the entire City Council, after a proposed proclamation recognizing June as Pride month led to division among the council last year. Fort Worth’s score on the Municipal Equality Index — released by advocacy group Human Rights Campaign to grade cities annually on their inclusion of LGBTQ residents — fell for the first time in eight years in 2025. The Arlington Museum of Art remains committed to inclusivity, Quirk said. The exhibition will coincide with Arlington Pride, the annual LGBTQ+ event that attracts thousands of attendees to Levitt Pavilion. The 2025 celebration is slated for June 14. “We don’t necessarily see this (exhibition) as controversial at all, but we know that other members of the community might,” she said. “We will continue to support those groups regardless of what feedback we hear.” The application for artists seeking to be featured in the Pride exhibition will be open March 3 through April 28. David Moreno is the arts and culture reporter for the Fort Worth Report. Contact him at david.moreno@fortworthreport.org or @davidmreports.At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-f4f72').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworthreport.org. For noncommercial digital publications: Look for the "Republish This Story" button underneath each story. To republish online, simply click the button, copy the html code and paste into your Content Management System (CMS). Do not copy stories straight from the front-end of our web-site. You are required to follow the guidelines and use the republication tool when you share our content. The republication tool generates the appropriate html code. You are required to add this language at the top of every republished story, including a link to the story. This story was originally published by the Fort Worth Report. You may read the original version here. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. You can’t sell or syndicate our stories. Any web site our stories appear on must include a contact for your organization. If you use our stories in any other medium — for example, newsletters or other email campaigns — you must make it clear that the stories are from the Fort Worth Report. In all emails, link directly to the story at fortworthreport.org and not to your website. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. For noncommercial print publications: You have to credit Fort Worth Report. Please use “Author Name, Fort Worth Report” in the byline. If you’re not able to add the byline, please include a line at the top of the story that reads: “This story was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Arlington Museum of Art seeks artists for its first Pride exhibition in June by David Moreno, Arlington Report March 1, 2025 <h1>Arlington Museum of Art seeks artists for its first Pride exhibition in June</h1> <p class="byline">by David Moreno, Arlington Report <br />March 1, 2025</p> <p>Are you a Tarrant County artist in the LGBTQ+ community with work to showcase? The Arlington Museum of Art wants to hear from you.&nbsp;</p> <p>The nonprofit museum <a href="https://www.facebook.com/share/p/1ANkzEmrF4/">recently announced</a> it will host its first Pride juried exhibition in June in collaboration with Fort Worth-based Help Center for LGBTQ+ Health and Wellness.</p> <p>Kendall Quirk, director of exhibitions at Arlington Museum of Art, said the show is part of the institution’s broader effort to reflect the community and support diverse artists.&nbsp;</p> <p>“It’s a really big priority for us to focus on artists who are in certain groups or who need spaces to display their artwork and just finding ways to celebrate them and boost them up,” she told the Report.&nbsp;</p> <p>The free exhibition will take place at the Arlington Museum of Art’s new location inside the Esports Stadium at 1200 Ballpark Way in the city’s Entertainment District. The museum relocated to the new space in March 2024 to <a href="https://fortworthreport.org/2024/04/03/new-arlington-museum-of-art-to-propel-entertainment-districts-foot-traffic-growth/">boost foot traffic</a>.&nbsp;</p> <p>“Both AMA and HELP share a commitment to showcasing the achievements of all members of our community. The Pride month juried art exhibition presents a wonderful opportunity to unite our visions and introduce a vibrant new event featuring world-class art to the North Texas community,” DeeJay Johannessen, CEO of the Help Center, said in a statement.&nbsp;</p> <p>While the Arlington museum is excited to launch its Pride exhibition, the institution anticipates potential pushback, Quirk said. Over the past year, Tarrant County has been the site of controversies involving Pride celebrations and exhibitions featuring LGBTQ+ artists.&nbsp;</p> <p>Last September, the Amon Carter Museum of American Art <a href="https://fortworthreport.org/2024/09/27/like-beyonce-album-cowboy-at-carter-museum-challenges-western-stereotypes-culture/">celebrated the opening</a> of the traveling exhibition “Cowboy.” Less than two weeks later, the show — which included works that “disrupt the homogeneous ideal of the cowboy as a White, cisgender American male,” including pieces by openly LGBTQ+ artists — was <a href="https://fortworthreport.org/2024/10/17/carter-museum-quietly-closes-reopens-cowboy-exhibition-with-mature-content-warning/">temporarily closed</a> without explanation.&nbsp;</p> <p>The show later reopened with a new sign warning guests of “mature content.” Museum officials have declined to say which pieces within the exhibition the label refers to, leaving artists with <a href="https://www.keranews.org/arts-culture/2025-02-05/what-is-mature-content-at-carter-museums-cowboy-exhibit-artists-want-to-know">unanswered questions</a>. “Cowboy” remains on view through March 23.&nbsp;&nbsp;</p> <p>The city of Fort Worth <a href="https://fortworthreport.org/2024/09/12/fort-worth-city-council-will-no-longer-issue-unanimous-recognitions-after-pride-month-fallout/">also did away with its most prestigious form of recognition</a>, proclamations issued on behalf of the entire City Council, after a proposed proclamation recognizing June as Pride month <a href="https://fortworthreport.org/2024/08/04/fort-worths-proclamation-process-has-council-members-divided-heres-why/">led to division among the council</a> last year. Fort Worth’s score on the Municipal Equality Index — released by advocacy group Human Rights Campaign to grade cities annually on their inclusion of LGBTQ residents — <a href="https://fortworthreport.org/2025/01/27/fort-worths-score-on-lgbtq-inclusiveness-dips-below-100-for-first-time-in-8-years/">fell for the first time</a> in eight years in 2025.&nbsp;</p> <p>The Arlington Museum of Art remains committed to inclusivity, Quirk said. The exhibition will coincide with Arlington Pride, the annual LGBTQ+ event that <a href="https://fortworthreport.org/2024/06/09/arlington-pride-festival-offers-a-place-where-we-dont-have-to-worry/">attracts thousands of attendees</a> to Levitt Pavilion. The 2025 celebration is slated for June 14.&nbsp;</p> <p>“We don’t necessarily see this (exhibition) as controversial at all, but we know that other members of the community might,” she said. “We will continue to support those groups regardless of what feedback we hear.”&nbsp;</p> <p>The application for artists seeking to be featured in the Pride exhibition <a href="https://arlingtonmuseum.org/">will be open</a> March 3 through April 28.&nbsp;</p> <p><em>David Moreno is the arts and culture reporter for the Fort Worth Report. Contact him at david.moreno@fortworthreport.org or </em><a href="https://twitter.com/davidmreports"><em>@davidmreports</em></a><em>.</em></p> <p><em>At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/03/01/arlington-museum-of-art-seeks-artists-for-its-first-pride-exhibition-in-june/&quot;&gt;article&lt;/a&gt; first appeared on &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org&quot;&gt;Arlington Report&lt;/a&gt; and is republished here under a Creative Commons license.&lt;img src=&quot;https://i0.wp.com/fortworthreport.org/wp-content/uploads/2021/04/cropped-favicon.png?resize=150%2C150&amp;amp;ssl=1&quot; style=&quot;width:1em;height:1em;margin-left:10px;&quot;&gt;&lt;img id=&quot;republication-tracker-tool-source&quot; src=&quot;https://fortworthreport.org/?republication-pixel=true&amp;post=198106&amp;amp;ga4=2820184429&quot; style=&quot;width:1px;height:1px;&quot;&gt;&lt;script&gt; PARSELY = { autotrack: false, onload: function() { PARSELY.beacon.trackPageView({ url: &quot;https://fortworthreport.org/2025/03/01/arlington-museum-of-art-seeks-artists-for-its-first-pride-exhibition-in-june/&quot;, urlref: window.location.href }); } } &lt;/script&gt; &lt;script id=&quot;parsely-cfg&quot; src=&quot;//cdn.parsely.com/keys/fortworthreport.org/p.js&quot;&gt;&lt;/script&gt;</p> Copy to Clipboard 1 Tagged: #ArlingtonReport, Amon Carter Museum of American Art, Arlington, Arlington Museum of Art, City of Arlington, City of Fort Worth David MorenoArts & Culture Reporter David Moreno is the arts & culture reporter at Fort Worth Report. He earned his Bachelors of Arts in broadcast journalism and political science from the University of North Texas. On his free time,... More by David Moreno'''
