title = "Industry leaders envision future of new Texas A&M-Fort Worth campus at downtown summit | Fort Worth Report"
description = "The meeting of 100-plus officials came as state legislators proposed cutting about $50M from Texas A&M’s budget over the next two years."
full_description = '''Standing on a stage in a downtown Fort Worth office building, Mayor Mattie Parker reflected on how her day began: looking out her hotel window onto the streets of downtown Austin. The view made her think about her city’s future, and how an expanded Texas A&M-Fort Worth campus will transform it. “I’m kind of asking myself, ‘What will Fort Worth look like in the next 10 to 20 years?’” she told the audience gathered inside Frost Tower. The answer to that question marries both of Parker’s academic identities. She’s a Longhorn who got her law degree from the Texas A&M School of Law back when it was still Texas Wesleyan. What’s powered a lot of Austin’s growth, she said, is her alma mater.“University of Texas (at Austin) has anchored their city in so many ways, it’s been an exciting hub of innovation and moving a city and a community forward,” said Parker, who was wearing a burnt orange jacket that appeared brown in the afternoon light of downtown Fort Worth. “And I know for a fact that A&M is already doing that now and will continue to do it.”Mayor Mattie Parker addresses business and academic leaders at a Texas A&M-Fort Worth innovation summit in the Frost Tower in downtown Feb. 27, 2025. (Shomial Ahmad | Fort Worth Report)Over 100 business and academic leaders attended a Texas A&M-Fort Worth Innovation Summit in downtown Thursday with the purpose of building out the academic and industry partnerships that will eventually be housed in Texas A&M-Fort Worth’s Research and Innovation Building currently being designed. Industry experts met in small groups to discuss the role the university could play in aerospace, agriculture, entrepreneurship, media and entertainment, workforce education and health care innovation. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe “Our breakouts today are focused on taking the hub concept ideas that we’ve created based on industry input,” said Darryl Heath, executive director of the Fort Worth and Tarrant County Innovation Partnership. “Now we are taking them down a level to understand how we’re going to activate those in the marketplace as small businesses in the next six months.”The first Texas A&M-Fort Worth building, known as the Law and Education Building, won’t open its doors until 2026. There’s no current opening date for the Research and Innovation Building, which still needs further approval from the university’s board of regents to move forward.But university and business leaders are laying the groundwork for their ideas, especially for upcoming research programs, now. Lockheed Martin, Cook Children’s and health care business incubator Techstars were among the organizations represented at the event. Heath said in the past year they’ve had conversations with 70 companies across North Texas. Following the summit, university officials will establish a working group that will then create an action plan. “We want them up and running now, probably in a temporary space. And the reason is because they have to grow, and they need time,” said Heath. “It will take time for them to get to a scaled place where they can actually occupy the new building.”With federal and state funding hanging in the balance, Texas A&M-Fort Worth may have to make some adjustments along the way. Federally funded research has already been affected in the first weeks of the Trump administration, with major changes at the National Institutes of Health and the National Science Foundation that could cut hundreds of millions in funds going to higher education institutions. This week, both the Texas House and the Senate unveiled their budget proposals. It would include a $420 million cut to higher education. For A&M, that would mean around a $50 million loss in funding over the next two years if passed, according to the Texas Tribune. Robert Ahdieh, the chief operating officer of Texas A&M-Fort Worth and the dean of A&M’s law school, said that there are “huge risks” around what’s happening at the state and federal level. But he doesn’t have long-term concerns.“We’re looking at all the contingencies and trying to prepare for the worst-case scenario, the somewhat bad scenario, and so on and so forth,” said Ahdieh. “Is it possible that it slows down some of the things? Sure.”In Washington and Austin, Ahdieh said, Texas A&M officials are making their case every day to show not just how funding cuts would impact the university, but the community around it. Shomial Ahmad is a higher education reporter for the Fort Worth Report, in partnership with Open Campus. Contact her at shomial.ahmad@fortworthreport.org.At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-36a9a').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Comm