full_description = '''Are mortgage rates going down? While 30-year mortgage rates recently stabilized at just below 7%, economist Mark Dotzour, who served for 18 years as chief economist of the Real Estate Center at Texas A&M University, doesn’t believe they are going back to the 3% to 4% level anytime soon. “The likelihood of that happening, in my mind, is virtually zero,” Dotzour said, speaking to the Society of Commercial Realtors on Feb. 27 at River Crest Country Club. “We’re going to keep rates high until we get to 2% inflation, and we haven’t got there yet.” Burgers, Tacos & Avocados Benbrook will be the site of the first Tacos & Avocados location in Tarrant County, a Mexican food concept from Mad Concepts Group, which also owns Jakes Burgers & Beer. Mad Concepts, in collaboration with the Benbrook Economic Development Corporation and Blue Plate Network, broke ground on a new restaurant park development at the southwest corner of Benbrook Boulevard and Westpark Drive. This project will feature two full-service restaurants: Tacos & Avocados and Jakes Burgers. Each restaurant will include a full bar, outdoor seating, and offer a 1.5-acre backyard with dedicated play areas for families and children.Jakes Burgers currently has locations across the Dallas-Fort Worth area and in Waco. The chain was founded in 1985 in Dallas and acquired by Addison-based Mad Concepts Group in 2021. Founded by Courtney Lindley and Bob Gregg, Mad Concepts operates 12 Jakes Burgers spots in addition to the upcoming Tacos & Avocados location, with several new units under development. Founded in 2012 by Carter Wilson, Dallas-based Blue Plate Network is a restaurant-focused real estate development group. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe D.R. Horton subsidiary inks solar deal Streetleaf, a solar panel streetlight company, has inked a deal with Arlington-based Forestar, a division of D.R. Horton and one of the largest single-family community developers in the U.S. The agreement streamlines the process for Forestar to incorporate the solar-powered streetlights into their new communities. “Forestar develops approximately 1 in 50 single-family homesites across the country, and we’re thrilled by the possibility of lighting their communities with solar-powered streetlights that run on clean energy and operate dependably through storms and power outages,” said Liam Ryan, CEO of Streetleaf. “By using smart technology to provide a better homeowner experience, Forestar is building for the future.”More than 8,000 Streetleaf streetlights have already been installed in more than 183 projects across the U.S. The Tampa-based company says these installations have led to a savings of more than $32 million in infrastructure costs, and almost 3.3 million pounds of CO2 savings compared to traditional streetlights.Streetleaf lights deliver utility-grade performance and are designed and managed to stay on 365 days a year, even when the power goes out, said Ryan. Ryan said that in neighborhoods impacted by hurricanes, where the power is often out to homes, areas with Streetleaf lights still have illumination at night. “That can mean a lot and really help during a disaster,” he said. The agreement between Forestar and Streetleaf streamlines the process for the developer’s divisions to selectively incorporate solar-powered streetlights into their new communities. Fort Worth company adds solar divisionFGM-Fabral, a metal post-frame materials manufacturer, has launched Fabral Solar to capitalize on the rapidly growing solar energy complex and its need for premium steel racking for solar panel installation.Leading this effort are John Cummings and Larkin Canington, who were both Bethlehem Steel executives until the company was sold in 2003, before forming Baltimore Steel Partners, which was the genesis of their foray into solar project installation. M2G acquires Dallas design center Fort Worth-based real estate investment and development company, M2G Ventures, acquired the 14-building 740,000-square-foot Inwood Design Center on 38 acres at 1110 Inwood Road in Dallas. The property is a light industrial, showroom and retail park at the intersection of the Design District and West Brookhollow submarkets.This transaction follows a flurry of recent activity for M2G and its general partner equity fund, Grey Swan I. Among the recent transactions are sites in Austin, Lewisville, Garland and Dallas. The ultimate pong game Argyle-based GoVision LLC, a staple at pro and amateur golf tournaments for nearly 20 years, is taking its large-scale LED video displays into the world of professional racquet sports. In January, GoVision provided over 90 square meters of 3.9mm high-resolution panels to the Reserve Padel Tournament in Miami, including all LED sidewalls and backwalls, player entrance columns and two live screens to display content and live action. Padel is a mix between tennis and squash. The opening event of the 2025 Reserve Cup Series showcased 16 of the world’s top-ranked padel players, including Team Reserve, led by Derek Jeter.In February, the 2025 Dallas Open, held at The Star in Frisco, featured 178 square meters of 3.9mm panels. In addition, GoVision constructed a player entrance structure composed of ultra-high-res 1.9mm fine-pitch indoor panels and installed 3.9mm LED scoring and shot clocks on the Grandstand Court at the men’s ATP indoor tournament.Similar LED displays will be on-site at the ATX Open in Austin — part of the 2025 Women’s Tennis Association Tour — later this month, as well as other professional men’s and women’s tournaments in the spring and summer.Another key element to GoVision’s new emphasis on tennis is a strategic partnership with Crionet, the preferred service provider for live scoring and data collection. GoVision first teamed up with Crionet to provide LED scoring boards for the USTA Tour in 2024. Now, the two companies are expanding their alliance to integrate live video displays with real-time event management systems. Do you have something for the Bob on Business column? Email Bob Francis at bob.francis@fortworthreport.org. Bob Francis is business editor for the Fort Worth Report. Contact him at bob.francis@fortworthreport.org. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-9ad47').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworth