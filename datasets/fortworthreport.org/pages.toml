description = "Drew Shaw is a reporting fellow for the Arlington Report. He previously worked as an intern at Al Jazeera and the managing editor at The Shorthorn, UT-Arlington’s student publication. Shaw grew up in Waxahachie, and he recently graduated with a degree in journalism and political science. He can be reached at Drew.Shaw@fortworthreport.com."
