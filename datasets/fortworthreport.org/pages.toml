rea and in Waco. The chain was founded in 1985 in Dallas and acquired by Addison-based Mad Concepts Group in 2021.&nbsp;</p> <p>Founded by Courtney Lindley and Bob Gregg, Mad Concepts operates 12 Jakes Burgers spots in addition to the upcoming Tacos &amp; Avocados location, with several new units under development. Founded in 2012 by Carter Wilson, Dallas-based Blue Plate Network is a restaurant-focused real estate development group.&nbsp;</p> <h2 class="wp-block-heading" id="h-d-r-horton-subsidiary-inks-solar-deal-nbsp">D.R. Horton subsidiary inks solar deal&nbsp;</h2> <p>Streetleaf, a solar panel streetlight company, has inked a deal with Arlington-based Forestar, a division of D.R. Horton and one of the largest single-family community developers in the U.S. The agreement streamlines the process for Forestar to incorporate the solar-powered streetlights into their new communities.&nbsp;</p> <p>“Forestar develops approximately 1 in 50 single-family homesites across the country, and we’re thrilled by the possibility of lighting their communities with solar-powered streetlights that run on clean energy and operate dependably through storms and power outages,” said Liam Ryan, CEO of Streetleaf. “By using smart technology to provide a better homeowner experience, Forestar is building for the future.”</p> <p>More than 8,000 Streetleaf streetlights have already been installed in more than 183 projects across the U.S. The Tampa-based company says these installations have led to a savings of more than $32 million in infrastructure costs, and almost 3.3 million pounds of CO2 savings compared to traditional streetlights.</p> <p>Streetleaf lights deliver utility-grade performance and are designed and managed to stay on 365 days a year, even when the power goes out, said Ryan. Ryan said that in neighborhoods impacted by hurricanes, where the power is often out to homes, areas with Streetleaf lights still have illumination at night.&nbsp;</p> <p>“That can mean a lot and really 