title = "Texas two-step: Amtrak seeks additional partner to lead high-speed rail development | Fort Worth Report"
description = "Amtrak seeks to hire a business partner to help manage a Dallas to Houston high-speed rail project."
full_description = '''Amtrak is seeking an additional business partner as it moves ahead with a proposed high-speed rail route between Dallas and Houston.The passenger railroad company — which took over as the project’s lead agency in 2023 and secured a $64 million federal grant — posted a request for qualifications for a company to work on the project. Fort Worth and Arlington would be linked to the high-speed rail project through a separate proposal.Amtrak, which teamed with Texas Central Partners, the company that initiated the project, wants to bring in another partner to manage activities for future high-speed rail development. The two-step process is commonly used for new, innovative projects, said Dan Lamers, senior program manager for metropolitan transportation planning with the North Central Texas Council of Governments. “Public agencies typically do not have the internal expertise with these types of projects, particularly in the case of high-speed rail, where nothing like it exists in the U.S. today,” he said. “There are, however, companies that have worked on high-speed rail in other areas that can bring in specialized expertise resulting in a more streamlined project development process.”The additional rail partner will have much to manage as legal issues, including eminent domain concerns, swirl around proposed rail projects. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe Tarrant County leaders have expressed their support for a high-speed rail project to connect Fort Worth and Arlington to downtown Dallas.Regional planners are proposing a high-speed rail route west of downtown Dallas after the Dallas City Council approved a resolution in June that opposed an elevated rail line through the Central Business District. (Courtesy image | North Central Texas Council of Governments)That project’s revised alignment was developed after the Dallas City Council passed a resolution opposing high-speed rail in downtown Dallas last summer. The elevated route, still being finalized, would generally take trains west of Interstate 35 East and run mostly parallel with South Riverfront Boulevard and extend over several businesses before heading to a station at the Cedars neighborhood south of downtown.In January, the Regional Transportation Council, an independent policy group of the North Central Texas Council of Governments, allocated $1 million in funding “in preparation for potential litigation” by Dallas-based Hunt Realty Investment Inc. related to the project. Hunt wants to invest $5 billion into development on land surrounding the Hyatt Regency Hotel and Reunion Tower near Eddie Bernice Johnson Union Station in downtown Dallas. Hunt Realty CEO Chris Kleinert told a reporter that the company does not plan on litigation but the company’s lawyer, Eric Gambrell of Akin Gump Strauss Hauer & Feld LLP, continued to send numerous legal letters to the council of governments after that January interview.Paul Schulze, vice president of public affairs for Hunt Consolidated, told the Fort Worth Report Kleinert was unavailable for an interview and the company had no further comment on the matter.The proposed Fort Worth to Dallas route could carry up to 30,000 daily passengers and is currently more than four years into a lengthy engineering and environmental review process related to the National Environmental Policy Act. The regional agency is working with state and federal agencies on the proposal. The review process may be complete this month but the council of governments has been granted some flexibility for those requirements.Amtrak’s requestOn Feb. 26, Amtrak posted a request for qualifications, part of the procurement process to select a partner that could include prospective companies, joint ventures, contractors and subcontractors. Amtrak would then create a short list of prospective companies from which to choose. The new partner, Amtrak’s post said, “will provide programmatic support for the development and execution of the Texas High Speed Rail Project.”The chosen candidate will be responsible for facilitating Amtrak’s delivery of the project and would be a “fully integrated and accountable member” of the team by providing leadership and support to ensure the project is delivered in the “most innovative and cost-efficient manner.”The filing also lists a broad range of duties for the project partner, including program management, design management, construction management and expertise, quality management, third party and stakeholder coordination, procurement, commercial strategy, field representation and monitoring services. However, the partner would not be responsible for the design or construction of the high-speed route.The filing also said the high-speed rail partner should be willing to enter into an compensation structure that includes incentives and disincentives. Requests for qualification will be made through Amtrak’s Ariba on Demand website. “Amtrak is working to confirm the viability of the concept of a dedicated high-speed rail route between Dallas and Houston,” a spokesperson said. “As part of these efforts, we are seeking to identify the interest of potential partners through responses to this request for qualifications process.”Eric E. Garcia is a senior business reporter at the Fort Worth Report. Contact him at eric.garcia@fortworthreport.org. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-ebf56').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=7408