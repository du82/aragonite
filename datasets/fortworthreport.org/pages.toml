full_description = '''Learn about Fort Worth Report DocumentersLocal government meeting reporting by Fort Worth Report and citizen journalists Fort Worth Report Documenters empowers citizen journalists to help fill the gaps in reporting on the numerous local government public meetings in Tarrant County. In collaboration with Fort Worth Report editors and reporters, we’ll be reporting even more vital news. About Documenters Become a Documenter Program FAQs Upcoming trainings and public meetings News from DocumentersAbout Documenters Fort Worth Report Documenters trains and pays residents to document local government meetings with notes and live tweets. Read Documenters stories and meeting summaries on the Fort Worth Report site as a public record, broadening and deepening coverage of our community. The Fort Worth Report and City Bureau — a nonprofit, Pulitzer Prize-winning newsroom in Chicago that pioneered Documenters and is expanding it across U.S. newsrooms — launched Fort Worth Report Documenters in early 2025. Fort Worth Report Documenters, like the Fort Worth Report, is funded by donors large and small who care about transparency in local institutions and are concerned by the diminution of media coverage. How it works: We assign our Documenters — Tarrant County residents who are interested in civic affairs — to attend public meetings, take notes in an easy-to-use template, tell us what questions they were left with after the meeting and submit the notes to us. We track down the answers, write brief summaries based on the Documenters notes and questions and publish them on our site and in our newsletters. To help our Documenters, we provide a library of explainers, guides and other civic resources to help you understand local government better and hold it accountable. Want to be a Documenter? Fill out the form below and we’ll be in touch. "*" indicates required fields Your email* Name* First Last Zip code*Newsletter Sign me up for the Fort Worth Report newsletter (optional) Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); gform.initializeOnLoaded( function() {gformInitSpinner( 41, 'https://fortworthreport.org/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_41').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_41');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_41').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_41').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_41').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_41').removeClass('gform_validation_error');}setTimeout( function() { /* delay the scroll by 50 milliseconds to fix a bug in chrome */ }, 50 );if(window['gformInitDatepicker']) {gformInitDatepicker();}if(window['gformInitPriceFields']) {gformInitPriceFields();}var current_page = jQuery('#gform_source_page_number_41').val();gformInitSpinner( 41, 'https://fortworthreport.org/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery(document).trigger('gform_page_loaded', [41, current_page]);window['gf_submitting_41'] = false;}else if(!is_redirect){var confirmation_content = jQuery(this).contents().find('.GF_AJAX_POSTBACK').html();if(!confirmation_content){confirmation_content = contents;}jQuery('#gform_wrapper_41').replaceWith(confirmation_content);jQuery(document).trigger('gform_confirmation_loaded', [41]);window['gf_submitting_41'] = false;wp.a11y.speak(jQuery('#gform_confirmation_message_41').text());}else{jQuery('#gform_41').append(contents);if(window['gformRedirect']) {gformRedirect();}}jQuery(document).trigger("gform_pre_post_render", [{ formId: "41", currentPage: "current_page", abort: function() { this.preventDefault(); } }]); if (event && event.defaultPrevented) { return; } const gformWrapperDiv = document.getElementById( "gform_wrapper_41" ); if ( gformWrapperDiv ) { const visibilitySpan = document.createElement( "span" ); visibilitySpan.id = "gform_visibility_test_41"; gformWrapperDiv.insertAdjacentElement( "afterend", visibilitySpan ); } const visibilityTestDiv = document.getElementById( "gform_visibility_test_41" ); let postRenderFired = false; function triggerPostRender() { if ( postRenderFired ) { return; } postRenderFired = true; jQuery( document ).trigger( 'gform_post_render', [41, current_page] ); gform.utils.trigger( { event: 'gform/postRender', native: false, data: { formId: 41, currentPage: current_page } } ); gform.utils.trigger( { event: 'gform/post_render', native: false, data: { formId: 41, currentPage: current_page } } ); if ( visibilityTestDiv ) { visibilityTestDiv.parentNode.removeChild( visibilityTestDiv ); } } function debounce( func, wait, immediate ) { var timeout; return function() { var context = this, args = arguments; var later = function() { timeout = null; if ( !immediate ) func.apply( context, args ); }; var callNow = immediate && !timeout; clearTimeout( timeout ); timeout = setTimeout( later, wait ); if ( callNow ) func.apply( context, args ); }; } const debouncedTriggerPostRender = debounce( function() { triggerPostRender(); }, 200 ); if ( visibilityTestDiv && visibilityTestDiv.offsetParent === null ) { const observer = new MutationObserver( ( mutations ) => { mutations.forEach( ( mutation ) => { if ( mutation.type === 'attributes' && visibilityTestDiv.offsetParent !== null ) { debouncedTriggerPostRender(); observer.disconnect(); } }); }); observer.observe( document.body, { attributes: true, childList: false, subtree: true, attributeFilter: [ 'style', 'class' ], }); } else { triggerPostRender(); } } );} ); Program FAQs Here are questions and answers about the Fort Worth Report Documenters program. What is the Documenters program and why is the Fort Worth Report investing in it?Fort Worth Report Documenters, in partnership with the nonprofit City Bureau news initiative, pioneer of Documenters in newsrooms nationally, is launching Fort Worth Report Documenters. We’ll recruit, train and pay citizen journalists to attend selected public meetings, take notes and submit them to us. We’ll write up brief summaries using your notes and publish them on our site, with your notes. We expect this to broaden and deepen the coverage of the talented journalists in our fast-growing organization. Can I become a Documenter?Ideal Documenters are engaged citizens — everybody from students to young professionals and retirees — who are interested in the civic affairs of our community and who can take accurate, detailed notes of public meetings. We want our notes to be unbiased reporting of what happens at meetings, not the Documenters’ opinions. If you’re speaking at a particular meeting or advocating a position, we require that you not sign up to document it. Do I need prior experience as a journalist?Absolutely not! How will I be assigned meetings?We’ll establish a dashboard with meetings we need covered and ask for Documenters to sign up to cover them. What kind of training will I receive before attending a meeting?We’ll hold periodic orientations to train Documenters and establish a library of resources on our site to help you in your coverage. What will I be expected to do at these meetings?We’ll set up an online template for our Documenters. You’ll be able to take notes in that template. We’ll also ask you to record the meetings in an app such as iPhone voice memo. You’ll have up to 48 hours to upload your notes and recordings to our site. In some cases, when we become aware of something that happened of relative news value at a meeting, we may ask you to accelerate your submission of notes and recordings, if possible. What will Fort Worth Report do with my notes?We’ll write short summaries using your notes and publish those summaries, along with your notes, on our site. We’ll use our social media and newsletters to push out distribution so our readers can see your great work. Is Fort Worth Report going to rely solely on my notes?Fort Worth Report’s staff will back you up, so you’re not flying solo! We’ll fact-check what happened at the meeting using your recordings. We’ll also check for accuracy of spellings of names, locations and other specifics you mention in your notes. How will I get paid?You’ll be a freelance contractor. We’ll ask you to submit a W-9 so we can get you paid. We have a standard per meeting rate that we will share upon receiving your contact information. Will I have the opportunity to graduate from taking notes into reporting and writing stories for the Fort Worth Report?We’d love it if this happens. Other Documenters programs nationally have had success in turning Documenters into full-fledged reporters and writers. When will all this start?We’ll start assigning meetings in early 2025, but we’ll begin recruiting and training later this fall. Please stay tuned for more information. And if you’re interested, please send us an email.Upcoming trainings and public meetings Loading… Loading…'''
