bsite, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.City of Fort Worth pushes for public vote in Keller ISD split by Matthew Sgroi, Fort Worth Report February 28, 2025 <h1>City of Fort Worth pushes for public vote in Keller ISD split</h1> <p class="byline">by Matthew Sgroi, Fort Worth Report <br />February 28, 2025</p> <p>The city of Fort Worth formally urged Texas Attorney General Ken Paxton to clarify the legal requirements for detaching a new school district from an existing one, emphasizing that an election must be held regardless of how the process is initiated.</p> <p>In a letter sent Feb. 27, Fort Worth City Attorney Leann Guzman argues that state law necessitates voter approval before a new district can be formed.</p> <p>The issue arises as Keller ISD considers forming a new school district by detaching a portion of its existing territory. Some, <a href="https://fortworthreport.org/2025/01/17/keller-isd-superintendent-threatens-to-resign-over-plan-to-split-district-what-comes-next/">like Tarrant County Commissioner Matt Krause</a>, have suggested that a board resolution alone may be sufficient to create the new district, bypassing the need for an election.&nbsp;</p> <p>Phil Sorrells and the Tarrant County District Attorney’s Office sought an official opinion from the attorney general on the matter Feb. 13, prompting Fort Worth to submit its own interpretation.</p> <p>Fort Worth’s letter contends that the Texas Education Code explicitly mandates an election when a new district is formed through detachment, <a href="https://fortworthreport.org/2025/01/17/keller-isd-superintendent-threatens-to-resign-over-plan-to-split-district-what-comes-next/">whether the process is initiated by a resolution from a school board or by a petition from registered voters.</a>&nbsp;</p> <p>The letter states that detachment can be “initiated by” a resolution or petition but does not distinguish between the two in terms of procedural requirements.</p> <p>“‘Initiated by,’ in plain language, means ‘started by,’” Guzman wrote. “Thus, a plain reading of the language of 13.103 allows that the process of creating a new school district by detachment may be started in one of two ways: a petition or a resolution. But if a resolution alone were sufficient to create the new district — whereas a petition may only start the process — then the words ‘initiated by’ would mean two completely different things within the space of a single sentence.”</p> <p>The letter references historical legislative revisions to the Texas Education Code, noting that before 1995, detachment was only permitted through a petition process.&nbsp;</p> <p>While the law was later amended to allow initiation by resolution, Fort Worth argues that this change did not remove the election requirement. Furthermore, Guzman points out that no other provisions in the education code allow school districts to unilaterally alter their boundaries without voter input.</p> <p>“The better interpretation, and the one that ensures parents have a direct voice in such an important decision affecting their children’s education, is the one that recognizes that an election is required,” the letter states.</p> <p>If the attorney general rules in favor of Fort Worth’s interpretation, Keller ISD and any future districts seeking detachment would need to hold elections before proceeding.&nbsp;</p> <p>If the ruling favors the view that a resolution alone is sufficient, Keller ISD <a href="https://fortworthreport.org/2025/01/17/keller-isd-superintendent-threatens-to-resign-over-plan-to-split-district-what-comes-next/">would gain autonomy in redrawing district lines.</a></p> <p>In a <a href="https://www.facebook.com/share/p/1GbaBpPJAA/">Feb. 28 Facebook post</a>, Fort Worth City Council member Alan Blaylock voiced support for ensuring that voters have the final say in any potential split. Fort Worth City Council districts include portions of Keller ISD.</p> <p>“I, along with Councilmembers (Charles) Lauersdorf and (Macy) Hill, stand with our constituents in their deep concerns regarding Keller ISD,” Blaylock said in the post. “We remain committed to advocating on their behalf to ensure the best possible outcome for our residents. We firmly believe that if a split were to occur, the public has the right to vote on the matter and the law supports this interpretation.”</p> <p>Lauersdorf also emphasized that the issue should not be about exploiting legal loopholes but about following the intent of the law.</p> <p>“We support the issue of law that says this should be put to a vote,” Lauersdorf said. “No district should be able to move forward with a split without taking it to a vote.”</p> <p>He acknowledged the political complexities surrounding the attorney general’s decision, noting that Paxton is not required to issue an opinion.</p> <p>“With as big of a deal as this is and how this could impact school districts statewide — between that and all the talk of vouchers and everything else — I don’t know if he would pick it up because of everything else going on,” Lauersdorf said. “This could easily become all about politics and not about the people.”</p> <p>Officials, such as Mayor Mattie Parker, Tarrant County Commissioners Alisa Simmons and Manny Ramirez and state representatives David Lowe and Nate Schatzline have all voiced their support for requiring a public vote on any potential Keller ISD split.</p> <p><em>Matthew Sgroi is an education reporter for the Fort Worth Report. Contact him at </em><a href="mailto:matthew.sgroi@fortworthreport.org"><em>matthew.sgroi@fortworthreport.org</em></a><em> or </em><a href="https://x.com/matthewsgroi1"><em>@matthewsgroi1</em></a><em>. </em></p> <p><em>At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/02/28/city-of-fort-worth-pushes-for-public-vote-in-keller-isd-split/&quot;&gt;article&lt;/a&gt; first appeared on &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org&quot;&gt;Fort Worth Report&lt;/a&gt; and is republished here under a Creative Commons license.&lt;img src=&quot;https://i0.wp.com/f'''
