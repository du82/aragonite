["https://fortworthreport.org/2025/03/01/made-in-tarrant-beloved-roadside-peach-stand-debuts-new-store-offers-special-native-produce"]
title = "Made in Tarrant: Beloved roadside peach stand debuts new store, offers special native produce | Fort Worth Report"
description = "Shannon Houchin and son Finn Canard sell produce that can’t be easily found in supermarkets."
full_description = '''Editor’s note: Made in Tarrant is an occasional Q&A series on small businesses started in Tarrant County. Submit your business here.What started as a peach stand quickly became a local go-to spot for fresh produce. Shannon Houchin and her son, Finn Canard, knew The Roadside Stand had to evolve when customers started asking for a variety of produce.The Roadside Stand, which started in 2014, still proudly sells and specializes in their famous peaches but has also become a hub for heirloom Texas produce — nonmodified fruits and vegetables that have been grown in the state for the past century. Some of those heirloom produce include the Pecos cantaloupe, exclusively grown in Pecos. It became Houchin and Canard’s mission to identify the best produce by traveling and visiting farms all over Texas. After years of market hopping and customers asking for a storefront, Houchin and Canard took to the Northside open-air market, Pequeño Mexico, where they debuted The Roadside Stand’s permanent home in the spot known as La Pulga, Feb. 22.Still, Houchin and Canard can be found at pop-ups and farmers markets all over North Texas. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe Business name: The Roadside StandLocation: 950 N. University Drive, Fort Worth and farmers markets across North TexasPhone: 817-688-7094Website: roadsideroyalty.comFacebook: The Roadside StandEmail: shannon@roadsiderepublic.comInstagram: @roadside_standThis interview has been edited for clarity, grammar and length.Nicole Lopez: How did your business start? How long has The Roadside Stand been operating?Shannon Houchin: This is our 11th year. Since 2014, we’ve been selling peaches. We started as a peach broker, which means we buy and sell peaches all over the country. And then it evolved into what our customers wanted, and that is, “Can you also carry other fresh local produce?” We started traveling the state to identify the mom-and-pop farms that we wanted to work with. So not only did we visit all of the mom-and-pop farms we wanted to work with, we started identifying the wholesalers and brokers also where we could bring back the local stuff. We identify the best produce in Texas.Lopez: Is your business Fort Worth-based or accessible to all of Dallas-Fort Worth?Houchin: We sell to DFW at large. We travel all over DFW doing markets. Customers can also order from us online. We will deliver within a 25 mile radius, so we can hit Roanoke, Keller and Haslet. And then we started a farm box subscription service too, so people can order that and we will deliver to their front door the best produce that’s available that week. So whatever’s being harvested, maybe a lot of corn and cabbage and sweet potatoes and broccoli, beets, cucumbers, so we just deliver a whole menu to their front door.The Roadside Stand sells seasonal produce, including heirloom produce native to Texas, and specializes in peaches. (Fort Worth Report | Nicole Lopez)Lopez: How did your business operate before its grand opening?Houchin: We’ve done the mobile market, we will pop-up all over. The cost to set up a storefront is so high, and that doesn’t work for us doing produce because we don’t want to pass on the high prices to our customers. The market manager here at La Pulga Spirits, Julie Perez, contacted me and asked if we thought about selling here. I was like, “Yes, this would be perfect, because we can grow as much as we want.”Lopez: Do you sell produce by the season or depending on the time of year? How does that work?Houchin: We specialize in peaches number one, and then we specialize in heirloom Texas produce. I try to find produce specifically in Texas. But then there are things out of state that are absolutely phenomenal. During the summer, we’ll get a ton of sweet corn from Michigan. And unlike Iowa and Indiana, Colorado has a corn that’s called Olathe corn that people just absolutely go crazy for. So again, we try to get iconic heirloom-type produce, impossible to get here unless you come buy it from us.Lopez: Is there any kind of produce you have that customers can always find, no matter what time of year it is?Houchin: We occasionally do things out of season or out of the country. There is produce we carry as a convenience. Right now, berries, strawberries, blueberries and blackberries, we’re not growing that in Texas yet. It’s not ready. So Central America is the only place that berries are readily available right now. So we will do that as a convenience for people, but we just say, “hey, this isn’t grown here.”Lopez: Is there a high demand for local produce businesses?Houchin: Most people are producers, meaning they grow their own. Like Stones Throw Farm Co. — they’re out in Benbrook — they’re a retail store like us, too, and they grow on their farm. They do travel around and do a lot of mobile farmers markets. Their mission is to provide educational opportunities for people, so they’re real comparable to what we do.Lopez: What makes your business stand out or makes it different from others in Fort Worth?Houchin: We really listen to the customer specifically about what they want, we do our best to provide it, and we also guarantee everything. Customers feel that if they get something they don’t like, they expect it’s going to be either impossible to return or to replace. And with us, they know that that’s not a problem. We stand behind everything that we sell, and we do our best never to sell anything that’s not delicious, ripe, sweet.Lopez: What do local produce markets have that customers can’t find in supermarkets?Houchin: There’s a connection between the food and the people and the resellers at the grocery store. As a consumer, when we go into the grocery store, there’s nobody for us to talk to about where these tomatoes grow. You know, where are the green beans from today? What farm is that? When people shop with us, we can tell them exactly when produce was harvested and the organic practices used to grow the produce. We can also teach them how to store it and how produce can be cooked.Lopez: Is there anything you’d like to add?Houchin: Our mission is to help rising students who are going to college to earn tuition money throughout the summer. Our whole staff is all high school and college kids and they all work the summers to make money for college. It has been a great experience for all of them and they learn entrepreneurial skills. That’s become our accidental mission, to help college kids stay out of as much debt as possible.Disclosure: Janna Franzwa Canard is copy editor for the Fort Worth Report; Finn Canard is her nephew. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.Nicole Lopez is the environment reporter for the Fort Worth Report. Contact her at nicole.lopez@fortworthreport.org. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-a45b4').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworthreport.org. For noncommercial digital publications: Look for the "Republish This Story" button underneath each story. To republish online, simply click the button, copy the html code and paste into your Content Management System (CMS). Do not copy stories straight from the front-end of our web-site. You are required to follow the guidelines and use the republication tool when you share our content. The republication tool generates the appropriate html code. You are required to add this language at the top of every republished story, including a link to the story. This story was originally published by the Fort Worth Report. You may read the original version here. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. You can’t sell or syndicate our stories. Any web site our stories appear on must include a contact for your organization. If you use our stories in any other medium — for example, newsletters or other email campaigns — you must make it clear that the stories are from the Fort Worth Report. In all emails, link directly to the story at fortworthreport.org and not to your website. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. For noncommercial print publications: You have to credit Fort Worth Report. Please use “Author Name, Fort Worth Report” in the byline. If you’re not able to add the byline, please include a line at the top of the story that reads: “This story was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Made in Tarrant: Beloved roadside peach stand debuts new store, offers special native produce by Nicole Lopez, Fort Worth Report March 1, 2025 <h1>Made in Tarrant: Beloved roadside peach stand debuts new store, offers special native produce</h1> <p class="byline">by Nicole Lopez, Fort Worth Report <br />March 1, 2025</p> <p><em>Editor’s note: Made in Tarrant is an occasional Q&amp;A series on small businesses started in Tarrant County. Submit your business </em><a href="https://fortworthreport.org/made-in-tarrant-submission/"><em>here</em></a><em>.</em></p> <p>What started as a peach stand quickly became a local go-to spot for fresh produce. Shannon Houchin and her son, Finn Canard, knew The Roadside Stand had to evolve when customers started asking for a variety of produce.</p> <p>The Roadside Stand, which started in 2014, still proudly sells and specializes in their famous peaches but has also become a hub for heirloom Texas produce — nonmodified fruits and vegetables that have been grown in the state for the past century. Some of those heirloom produce include the Pecos cantaloupe, exclusively grown in Pecos.&nbsp;</p> <p>It became Houchin and Canard’s mission to identify the best produce by traveling and visiting farms all over Texas.&nbsp;</p> <p>After years of market hopping and customers asking for a storefront, Houchin and Canard took to the Northside open-air market, Pequeño Mexico, where they debuted The Roadside Stand’s permanent home in the spot known as La Pulga, Feb. 22.</p> <p>Still, Houchin and Canard can be found at pop-ups and farmers markets all over North Texas.</p> <p><strong>Business name: </strong>The Roadside Stand</p> <p><strong>Location: </strong>950 N. University Drive, Fort Worth and farmers markets across North Texas</p> <p><strong>Phone: </strong>817-688-7094</p> <p><strong>Website: </strong><a href="http://roadsideroyalty.com">roadsideroyalty.com</a></p> <p><strong>Facebook: </strong><a href="https://www.facebook.com/roadsidestandUSA">The Roadside Stand</a></p> <p><strong>Email: </strong><a href="mailto:shannon@roadsiderepublic.com">shannon@roadsiderepublic.com</a></p> <p><strong>Instagram: </strong><a href="https://www.instagram.com/roadside_stand/">@roadside_stand</a></p> <p><em>This interview has been edited for clarity, grammar and length.</em></p> <p><strong>Nicole Lopez:</strong> How did your business start? How long has The Roadside Stand been operating?</p> <p><strong>Shannon Houchin:</strong> This is our 11th year. Since 2014, we’ve been selling peaches. We started as a peach broker, which means we buy and sell peaches all over the country. And then it evolved into what our customers wanted, and that is, “Can you also carry other fresh local produce?” We started traveling the state to identify the mom-and-pop farms that we wanted to work with. So not only did we visit all of the mom-and-pop farms we wanted to work with, we started identifying the wholesalers and brokers also where we could bring back the local stuff. We identify the best produce in Texas.</p> <p><strong>Lopez: </strong>Is your business Fort Worth-based or accessible to all of Dallas-Fort Worth?</p> <p><strong>Houchin:</strong> We sell to DFW at large. We travel all over DFW doing markets. Customers can also order from us online. We will deliver within a 25 mile radius, so we can hit Roanoke, Keller and Haslet. And then we started a farm box subscription service too, so people can order that and we will deliver to their front door the best produce that’s available that week. So whatever’s being harvested, maybe a lot of corn and cabbage and sweet potatoes and broccoli, beets, cucumbers, so we just deliver a whole menu to their front door.</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/Lopez_Roadside-Stand-2-1024x768.jpg" alt="" class="wp-image-197842" /><figcaption class="wp-element-caption">The Roadside Stand sells seasonal produce, including heirloom produce native to Texas, and specializes in peaches. (Fort Worth Report | Nicole Lopez)<'''
