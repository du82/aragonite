title = "Where I Live: Burton Hill Trinity Trails scores high with trees, charm to spare | Fort Worth Report"
description = "Trees to trails to location and schools, this mother of two sons finds Burton Hill neighborhood just right."
full_description = '''by Lucy Ledue IvesI moved to Burton Hill Trinity Trails when my oldest, now nearly 9, was small, a 1 year old. My other son, 6, has lived here his whole life. The schools, the pyramid — Burton Hill Elementary, Stripling Middle School and Arlington Heights High School — were one reason. They all score well. But it’s not just the schools that are important. It’s also the trails, as there are two trail systems nearby. For my sons, we don’t have to call up friends and make playdate arrangements. We can just hit the trails and see who’s there. It’s great. It’s a lot of activity and it’s fun for me to see that happen as well. The trails really got a workout during COVID. There wasn’t much to do, but unlike people that were stuck at home, we had plenty of safe places to go outdoors. At least twice a day I hit the trails and maybe more. The Westworth Village police put in a police substation near one of the trails recently and that, I think, has increased activity on the trails as well. I’ve never felt unsafe there and that really helps and means people stay in the park longer. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe The parks are great, too, for kid’s birthday parties and other activities such as picnics. It’s a bit of a walk, but you can easily take your bike to pop over to Roy Pope Grocery. That’s another place where you can see people from the neighborhood. We’re also close to the Naval Air Station Joint Reserve Base, and I don’t know if that was the reason or not, but when we had the big freeze in 2021 nearly everyone here had power. The area has a lot of trees and some of those are starting to show their age, but they’re beautiful. But while the area boasts a lot of nature, it’s also very close to West 7th Street, so my commute was down to nearly nothing. The area is close to downtown too.Really, it was perfect when we moved here because of the affordability — it’s not so much now. I’ve not only lived in this area, I’ve lived in three different homes here. Obviously, I love it. Burton Hills Trinity Trails Population: 1,255 Male: 64% Female: 46%Age 65+: 18940-64: 46922-39: 23218-21: 46 0-17: 320 Race: White: 86%Two or more races: 5.2% Black: 4.2%Hispanic or Latino: 2.9%Asian: 1.3%Median household income: $181,243EducationNo degree: 7%High school: 35%College and higher: 59%SchoolsClick on the link to view the schools’ Texas Education Agency ratings:Burton Hill Elementary School Stripling Middle School Arlington Heights High School#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-1d531').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworthreport.org. For noncommercial digital publications: Look for the "Republish This Story" button underneath each story. To republish online, simply click the button, copy the html code and paste into your Content Management System (CMS). Do not copy stories straight from the front-end of our web-site. You are required to follow the guidelines and use the republication tool when you share our content. The republication tool generates the appropriate html code. You are required to add this language at the top of every republished story, including a link to the story. This story was originally published by the Fort Worth Report. You may read the original version here. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. You can’t sell or syndicate our stories. Any web site our stories appear on must include a contact for your organization. If you use our stories in any other medium — for example, newsletters or other email campaigns — you must make it clear that the stories are from the Fort Worth Report. In all emails, link directly to the story at fortworthreport.org and not to your website. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. For noncommercial print publications: You have to credit Fort Worth Report. Please use “Author Name, Fort Worth Report” in the byline. If you’re not able to add the byline, please include a line at the top of the story that reads: “This story was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Where I Live: Burton Hill Trinity Trails scores high with trees, charm to spare by The FWR Staff, Fort Worth Report March 1, 2025 <h1>Where I Live: Burton Hill Trinity Trails scores high with trees, charm to spare</h1> <p class="byline">by The FWR Staff, Fort Worth Report <br />March 1, 2025</p> <p>by Lucy Ledue Ives</p> <p>I moved to Burton Hill Trinity Trails when my oldest, now nearly 9, was small, a 1 year old. My other son, 6, has lived here his whole life.&nbsp;</p> <p>The schools, the pyramid — Burton Hill Elementary, Stripling Middle School and Arlington Heights High School — were one reason. They all score well. But it’s not just the schools that are important. It’s also the trails, as there are two trail systems nearby.&nbsp;</p> <p>For my sons, we don’t have to call up friends and make playdate arrangements. We can just hit the trails and see who’s there. It’s great. It’s a lot of activity and it’s fun for me to see that happen as well.&nbsp;</p> <p>The trails really got a workout during COVID. There wasn’t much to do, but unlike people that were stuck at home, we had plenty of safe places to go outdoors. At least twice a day I hit the trails and maybe more.&nbsp;</p> <p>The Westworth Village police put in a police substation near one of the trails recently and that, I think, has increased activity on the trails as well. I’ve never felt unsafe there and that really helps and means people stay in the park longer.&nbsp;</p> <p>The parks are great, too, for kid’s birthday parties and other activities such as picnics.&nbsp;</p> <p>It’s a bit of a walk, but you can easily take your bike to pop over to Roy Pope Grocery. That’s another place where you can see people from the neighborhood.&nbsp;</p> <p>We’re also close to the Naval Air Station Joint Reserve Base, and I don’t know if that was the reason or not, but when we had the big freeze in 2021 nearly everyone here had power.&nbsp;</p> <p>The area has a lot of trees and some of those are starting to show their age, but they’re beautiful. But while the area boasts a lot of nature, it’s also very close to West 7th Street, so my commute was down to nearly nothing. The area is close to downtown too.</p> <p>Really, it was perfect when we moved here because of the affordability — it’s not so much now.&nbsp;</p> <p>I’ve not only lived in this area, I’ve lived in three different homes here. Obviously, I love it.&nbsp;</p> <p><strong>Burton Hills Trinity Trails&nbsp;</strong></p> <p><strong>Population:</strong> 1,255&nbsp;</p> <p><strong>Male:</strong> 64%&nbsp;</p> <p><strong>Female:</strong> 46%</p> <p><strong>Age&nbsp;</strong></p> <p><strong>65+</strong>: 189</p> <p><strong>40-64:</strong> 469</p> <p><strong>22-39</strong>: 232</p> <p><strong>18-21</strong>: 46&nbsp;</p> <p><strong>0-17</strong>: 320&nbsp;</p> <p><strong>Race:&nbsp;</strong></p> <p><strong>White:</strong> 86%</p> <p><strong>Two or more races:</strong> 5.2%&nbsp;</p> <p><strong>Black:</strong> 4.2%</p> <p><strong>Hispanic or Latino:</strong> 2.9%</p> <p><strong>Asian:</strong> 1.3%</p> <p><strong>Median household income:</strong> $181,243</p> <p><strong>Education</strong></p> <p><strong>No degree</strong>: 7%</p> <p><strong>High school</strong><strong>:</strong> 35%</p> <p><strong>College and higher</strong><em>: 59%</em></p> <p><strong>Schools</strong></p> <p><em>Click on the link to view the schools’ Texas Education Agency ratings:</em></p> <ul class="wp-block-list"> <li><a href="https://txschools.gov/?view=school&amp;id=220905107&amp;tab=overview&amp;lng=en"><em>Burton Hill Elementary School</em></a></li> <li><a href="https://txschools.gov/?view=school&amp;id=220905058&amp;tab=overview&amp;lng=en"><em>Stripling Middle School</em></a></li> <li><a href="https://txschools.gov/?view=school&amp;id=220905002&amp;tab=overview&amp;lng=en"><em>Arlington Heights High School</em></a></li> </ul> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/03/01/where-i-live-burton-hill-trinity-trails-scores-high-with-trees-charm-to-spare/&quot;&gt;article&lt;/a&gt; first appeared on &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org&quot;&gt;Fort Worth Report&lt;/a&gt; and is republished here under a Creative Commons license.&lt;img src=&quot;https://i0.wp.com/fortworthreport.org/wp-content/uploads/2021/04/cropped-favicon.png?resize=150%2C150&amp;amp;ssl=1&quot; style=&quot;width:1em;height:1em;margin-left:10px;&quot;&gt;&lt;img id=&quot;republication-tracker-tool-source&quot; src=&quot;https://fortworthreport.org/?republication-pixel=true&amp;post=198079&amp;amp;ga4=2820184429&quot; style=&quot;width:1px;height:1px;&quot;&gt;&lt;script&gt; PARSELY = { autotrack: false, onload: function() { PARSELY.beacon.trackPageView({ url: &quot;https://fortworthreport.org/2025/03/01/where-i-live-burton-hill-trinity-trails-scores-high-with-trees-charm-to-spare/&quot;, urlref: window.location.href }); } } &lt;/script&gt; &lt;script id=&quot;parsely-cfg&quot; src=&quot;//cdn.parsely.com/keys/fortworthreport.org/p.js&quot;&gt;&lt;/script&gt;</p> Copy to Clipboard 1'''
