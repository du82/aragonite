full_description = "Honoring unsung heroes for making extraordinary differences every day. Sponsored by Central Market, H-E-B and JPS Health Network. What is 52 Faces of Community? 52 Faces of Community honors unsung heroes for making extraordinary differences every day: the people who are our neighbors and who quietly make our lives better every day. They serve based on filling a need and rarely receive recognition for all they give.Nominate a candidate for 52 Faces of Community Let us know about an unsung hero in the Tarrant County community! All submissions will be reviewed by the editorial committee. Selected candidates will be profiled here. Nominate a candidateThroughout 2025, unsung heroes will be nominated through a variety of ways, including local non-profits, churches,schools and other community organizations. A selection committee will review nominees and select 52 honorees.Each week, Fort Worth Report will publish an article, with a photo, highlighting the accomplishments ofthe recipient. Year-end recognition eventAfter sharing 52 weeks of profile stories, each unsung hero and a guest will be honored at a recognition luncheon where we willhighlight ten of our heroes and announce the name of one honoree to represent Tarrant County at the Jefferson Awards inWashington, D.C.The Jefferson Awards were founded over 50 years ago by Jacqueline Kennedy Onassis to honor people who wake up every day to help one another and make their community a better place to live. .wp-block-newspack-blocks-homepage-articles article .entry-title{font-size: 1.2em;}.wp-block-newspack-blocks-homepage-articles .entry-meta{display: flex;flex-wrap: wrap;align-items: center;margin-top: 0.5em;}.wp-block-newspack-blocks-homepage-articles article .entry-meta{font-size: 0.8em;}.wp-block-newspack-blocks-homepage-articles article .avatar{height: 25px;width: 25px;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail{margin: 0;margin-bottom: 0.25em;}.wp-block-newspack-blocks-homepage-art