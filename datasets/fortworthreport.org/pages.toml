title = "About Us | Fort Worth Report"
description = "Discover our story. Dive into the 'About Us' page to learn how Fort Worth Report is shaping local journalism for our dynamic community."
full_description = 'Meet the ReportWe are a nonprofit, nonpartisan news organization serving Fort Worth, Arlington and Tarrant County. We provide independent, factual news coverage that holds government officials accountable, finds solutions for community issues and strengthens a diverse and rapidly growing city and home county.We launched in 2021 to fill the community’s need for more news about local government, schools, business, the environment, health care and other important topics. <iframe title="What is the Fort Worth Report?" width="780" height="439" src="https://www.youtube.com/embed/jGADQ8xPsXc?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe> Our mission and visionMission statement:We pledge to produce high-quality objective local journalism that informs public decision-making, addresses the quality of life of our community’s citizens, holds our policymakers accountable and tells our readers’ stories by listening to them and making sure they are valued and understood. In all that we do, earning the trust and respect of our audience is paramount. Our reporting will be free to all who access our primary digital channels.Vision statement:The Fort Worth Report is committed to making Fort Worth and Tarrant County better through reliable local news reporting and information.Annual Impact Report Read about the difference we’ve made in our community in our impact reports: 2023 Annual Impact Report 2022 Annual Impact ReportNews Coverage & Awards In October 2022, Fort Worth Report was named the best new large publisher at a national independent journalism contest. Local Independent Online News, a professional organization of over 400 U.S. and Canadian independent news publishers, also chose Fort Worth Report as a finalist in three other categories. Read additional news coverage of Fort Worth Report on our media center page.Certifications Fort Worth Report has been awarded certification from the Journalism Trust Initiative (JTI), an international benchmark initiated by Reporters Without Borders to fight disinformation by rewarding editorial and professional excellence. Fort Worth Report was independently audited by the Alliance for Audited Media, which confirmed Fort Worth Report’s compliance with the JTI Standard. The Journalism Trust Initiative is an international standard for producing trustworthy journalism that focuses on the standards and accountability mechanisms that govern news production. The JTI certification awarded to Fort Worth Report can be accessed here. To learn more, read our announcement. Memberships and Affiliations Institute for Nonprofit News: Fort Worth Report is a member of the Institute for Nonprofit News, an association of over 400 independent news organizations that are nonprofit, nonpartisan and dedicated to public service. American Journalism Project: Fort Worth Report is a recipient of an exclusive $1.1 million grant from the American Journalism Project to support grow the long-term financial sustainability. Frequently Asked Questions What is the Fort Worth Report?Fort Worth Report is a 501(c)(3) organization that launched April 12, 2021. We provide our communities with journalism that is fact-based, thoughtful and free of bias. These principles guide all editorial decisions. What is the Arlington Report?The Arlington Report is a nonprofit news source serving Arlington, Texas. It is powered by Fort Worth Report and KERA. All of the content, including the weekly newsletter, is free to read. How are you funded?The Burnett Foundation provided a generous grant of $1.25 million to fund our launch and support our first three years in business. Our community has stepped up to help us raise a total of more than several million, including foundation grants, individual gifts, corporate gifts, event sponsorships and advertising. Because we are a nonprofit, gifts are tax-deductible to the extent allowed by law, and all gifts are re-invested in our news organization. Our commitment to financial transparency is detailed in our donor transparency policy. Donating individuals and organizations are publicly available. Our IRS 990 tax filings are also shared here for 2019 (our legal founding year), 2020, 2021, and 2022. How does your work impact Tarrant County?On our website and in our newsletters, we’ve published thousands of pieces of original journalism since our launch on April 12, 2021. Our work has received a number of awards, including ones from the local Society of Professional Journalists First Amendment Awards and Texas Managing Editors Awards. However, we consider the impact our stories have on our community to be a more important measure. Our best stories have helped bring about needed change, helped residents understand complicated issues and helped bring our community closer together. More information can be found in our annual impact report. Why does nonprofit news matter?Nonprofit news organizations are supported by and committed to the communities they serve. These organizations are not intended to replace traditional newspapers. They are intended to strengthen communities by holding those in power accountable, encouraging civic engagement and telling stories that would otherwise go untold. The Fort Worth Report is and will always be a 501c3 nonprofit organization. This model allows us to adapt to the economic challenges caused by disruptive innovation. The nonprofit model also facilitates our editorial independence by ensuring our commitment to the wellbeing of Tarrant County’s communities rather than commercial or political interests. Are your stories free to read?Yes, the news on our website is free to all, because we believe local journalism is a public service that should be available to everyone, whether or not the reader can afford to pay. We’re able to provide this public service thanks to individual and business memberships, donations, advertising, sponsorships, corporations and foundations. Does the Fort Worth Report have a political agenda or cultural bias?No. Our mission is to produce trusted and independent local journalism. Whether we are successful is up to you – the audience. We do not publish partisan editorial opinions or candidate endorsements. Rather, we focus on reporting the facts that allow our audiences to form their own opinions. What is your relationship with KERA and the Dallas Morning News?We partner with other publishers to help our journalism reach a wider audience and further serve our community. We partner with KERA to republish Tarrant County news that we haven’t reported ourselves. KERA likewise republishes certain stories from us. We partner with the Dallas Morning News to include more Tarrant County news in their print edition. Can I republish Fort Worth Report’s stories?We encourage organizations to use and republish Fort Worth Report stories, but they must fully follow our guidelines. The guidelines can be found here or by clicking the republish button found at the end of our stories online. How can I help?As a nonprofit, we rely on the generosity of our community. You can help grow our newsroom by becoming a member. You can also submit a news tip, sign up for our newsletters, and share our stories with your friends.'
