ct stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Roots of Black Theatre in Fort Worth by Hollace Weiner, Fort Worth Report February 28, 2025 <h1>Roots of Black Theatre in Fort Worth </h1> <p class="byline">by Hollace Weiner, Fort Worth Report <br />February 28, 2025</p> <p><em>Editor’s Note: This article is part of a series on Fort Worth and Tarrant County history contributed by local historian Hollace Weiner. Original publication was in the Fort Worth Star-Telegram.</em></p> <p>From her position in 1971 as director of teenagers at the city’s Black YWCA, Erma Duffy Lewis saw the potential for kids of color to excel as actors, dancers, singers and directors. But in racially segregated Fort Worth, their avenues to the performing arts were virtually nonexistent.&nbsp;&nbsp;&nbsp;&nbsp;</p> <p>Lewis shared her vision with the Rev. Paul Sims, pastor at Community Christian Church, a Disciples of Christ congregation with a humble, 128-seat annex on its grounds at Riverside Drive and&nbsp; E. Vickery. Envisioning its transformation into a community theater, Lewis corralled volunteers to sand floors, insulate windows, install air conditioning, paint walls, build sets and wire footlights.&nbsp;&nbsp;&nbsp;&nbsp;</p> <p>With encouragement and fundraising from the Junior Debutantes, a club at segregated Dunbar High, Lewis launched the city’s first Black theater troupe—the Sojourner Truth Players and Cultural Arts Center, named for a slave who escaped to freedom and dramatically preached abolition.&nbsp;&nbsp;</p> <p>The curtain went up Aug. 20, 1972, with “Amen Corner” by James Baldwin. The director was Rudy Eastman, a history and drama teacher at O.D. Wyatt High, who in 1981 launched downtown’s still-thriving Jubilee Theatre.&nbsp; The next production for the Sojourner Truth Players was “Down to the Roots,” a journey through Black history created by Johnny Simons—who in 1976&nbsp; opened Fort Worth’s avant-garde Hip Pocket Theatre.&nbsp;&nbsp;</p> <p>In seasons to come, Sojourner Truth audiences included pre-teen Channing Godfrey Peoples, who in 2020 produced and directed the film “Miss Juneteenth,” which premiered at the Sundance Film Festival and won awards at Austin’s South by Southwest. <em>&nbsp;&nbsp;</em></p> <p>“There was great power on that cracker-box stage, ” raved longtime Star-Telegram drama critic Perry Stewart during the opening season at Sojourner Truth.&nbsp;&nbsp;&nbsp;</p> <p>To expand the theater into a cultural arts center for the younger generation, the founder teamed up with the Fort Worth school district, which was under a court order to integrate. With a Federal grant, Erma Lewis developed performing arts workshops where Black and Latino youths used music, mime, drama and dance to spark discussions about school bussing and desegregation.&nbsp; These workshops became a key component at day-long community seminars at Texas Wesleyan College (now University).&nbsp;</p> <figure class="wp-block-image size-large"><img src="https://fortworthreport.org/wp-content/uploads/2025/02/25.-A.-Erma-D.-Lewis-aug-9-1974-exec-producer-STP-nonprofit-black-drama-group-680x1024.jpg" alt="" class="wp-image-198115" /><figcaption class="wp-element-caption">Mrs. Erma D. Lewis was the executive producer of the Sojourner Truth Players, Inc., a local nonprofit Black drama group dedicated to the development of theatrical talent.</figcaption></figure> <p>Lewis also taught ballet, acting, and singing to kids from preschoolers to high schoolers, with recitals open to the public. These performances were so entertaining that Sojourner Truth ensembles received invitations for dancing, singing, and storytelling on the children’s stage at Mayfest, at Bicentennial celebrations, at United Way campaign luncheons, at UTA’s Student Center and the Texas Christian University ballroom. During Brotherhood Month, Black History Month, and Juneteenth celebrations, they were in demand for performances at Sycamore Park and on the steps of the Amon Carter Museum.&nbsp;&nbsp;&nbsp;</p> <p>With $10,000 in grants, some from the National Endowment for the Arts, Curtis King, who had a master’s degree from TCU’s Department of Theatre, planned a three-day Sojourner Truth National Cultural Arts Festival. Held in 1976 at the Tarrant County Convention&nbsp; Center over Labor Day Weekend, the festival featured ten Black artists and intellectuals from around the nation.&nbsp;</p> <p>Another highlight was an original musical drama directed by King and created by Bob Ray Sanders, then a public television executive at KERA/Channel 13.&nbsp; Titled “A Time to Build,” the musical had a cast of 75, from tots to grandparents, and dramatized the Black exp'''
