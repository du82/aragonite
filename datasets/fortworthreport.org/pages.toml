["https://fortworthreport.org/2025/03/01/52-faces-lupe-lynchs-love-for-students-fuels-pta-growth-in-fort-worth-isd"]
title = "52 Faces: Lupe Lynch’s love for students fuels PTA growth in Fort Worth ISD | Fort Worth Report"
description = "Lynch played a key role in increasing the number of FWISD PTAs from 55 to 65. Here’s how she did it and why she volunteers."
full_description = '''Lupe Lynch was in her natural element during the Fort Worth ISD Council of PTAs’ annual luncheon.Welcome to 52 Faces 52 Faces of Community is a Fort Worth Report weekly series spotlighting local unsung heroes. It is sponsored by Central Market and H-E-B. At the end of the year, these rarely recognized heroes will gather for a luncheon where the Report will announce one honoree to represent Tarrant County at the Jefferson Awards in Washington, D.C.She greeted people as they entered.She crisscrossed the room checking whether members were ready to vote.She presented awards, including golden apples, to PTA members to thank them for their hard work.Lynch, 38, pours herself into serving as a PTA leader, according to her colleagues. Her efforts led to her nomination for 52 Faces of Community, the Fort Worth Report’s weekly series spotlighting unsung heroes in Tarrant County. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe “It’s not my intention to bring glory to myself at all — or even to glorify my school — even though I 100% love it,” Lynch said.Lynch started volunteering when her daughter entered pre-K and the school’s secretary suggested it. Even though it was outside of her comfort zone, Lynch leaped at the opportunity, so she could be inside the school and see her child.Five years later, she is now vice president of the Fort Worth ISD Council of PTAs. And, she’s still an active member at Riverside Applied Learning Center’s PTA.Marisol Herrera, the council’s current president, described Lynch as her right-hand woman and instrumental in expanding PTAs into underrepresented areas of Fort Worth ISD. When Herrera brought the idea up to Lynch, she whipped out maps and sifted through data to find gaps. They found them in Eastside, in Northside and even in Riverside.Know an unsung hero in Tarrant County? Tell us about them by filling out the form below. Nominate an unsung heroLynch pinpointed schools. Herrera sent Lynch to the campuses and talked to parents and teachers.In the past two years, Lynch helped grow the number of PTAs in the district from 55 to 65 — with another three schools in the works, including her alma mater of Diamond Hill-Jarvis High School.“When you find somebody who’s deeply committed to the mission, you hang on to those people because those people are priceless,” Herrera said.Lynch hangs on not because of her two kids nor hours upon hours of unpaid work. She volunteers for a bigger reason.“It’s all about the kiddos,” she said. “If we can make an influence in just one student’s life, we truly succeeded.”Jacob Sanchez is a senior education reporter for the Fort Worth Report. Contact him at jacob.sanchez@fortworthreport.org or @_jacob_sanchez. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-c48a5').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a lice