title = "Fort Worth designation marks major milestone for new film and TV studio in Alliance | Fort Worth Report"
description = "Fort Worth recently got approval from the state to establish the city as a Media Production Development Zone. Here’s what that means."
full_description = '''Two months after Fort Worth council members voted to grow the city’s film industry, a new state designation paves the way for a production facility in Alliance to start rolling. The city of Fort Worth recently earned approval from the Texas Film Commission to establish the land within city limits as a Media Production Development Zone, also known as an MPDZ. The designation opens up access to a two-year use and sales tax exemption for the construction, maintenance, expansion, improvement and renovation of a media production facility within the city. The program was established in 2009 to encourage a stronger film industry across the state. The commission’s approval directly supports the conversion of a 224,616-square-foot facility in Alliance into a space for television and film production, including four 18,000-square-foot stages, a set building shop, storage, wardrobe and offices. The project is part of Hillwood’s AllianceTexas development.<iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d53560.07756671524!2d-97.3462705!3d32.96408!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x864ddbd2f9f27e41%3A0x7b5a7555ef89995e!2s2701%20Spirit%20Dr%2C%20Fort%20Worth%2C%20TX%2076177!5e0!3m2!1sen!2sus!4v1740768798070!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>“The MPDZ is just an incredible opportunity for the city. Not only will it attract new business here with the studio and infrastructure that we need, but it also gives us the opportunity to support more projects,” Fort Worth Film Commissioner Taylor Hardy told the Report. “Having this infrastructure in Fort Worth will make us a top choice for filmmakers.” ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe Council member Alan Blaylock, who represents north Fort Worth, previously confirmed that 101 Studios, the production company behind “Yellowstone,” is interested in the new Alliance space. “It’s a step in the process, but we’re excited about the opportunity,” he said in December. “It’s great for the city.”The move is also a boon to an industry that has grown rapidly in recent years with the introduction of multiple Taylor Sheridan productions and Phil McGraw, better known as Dr. Phil, bringing Merit Street Media to Fort Worth. “The film and entertainment industry has created more than $700 million of direct economic impact in the City of Fort Worth since 2015,” Mayor Mattie Parker said in a statement. “This is a true success story in our city, and I’m focused on continuing this momentum and creating real return on investment through this industry for the future of Fort Worth and its residents.”Fort Worth’s first media production zone was established in the Near Southside neighborhood in 2018, which helped support the growth of Red Productions. David Moreno is the arts and culture reporter for the Fort Worth Report. Contact him at david.moreno@fortworthreport.org or @davidmreports.At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-cd91b').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, please email hello@fortworthreport.org. For noncommercial digital publications: Look for the "Republish This Story" button underneath each story. To republish online, simply click the button, copy the html code and paste into your Content Management System (CMS). Do not copy stories straight from the front-end of our web-site. You are required to follow the guidelines and use the republication tool when you share our content. The republication tool generates the appropriate html code. You are required to add this language at the top of every republished story, including a link to the story. This story was originally published by the Fort Worth Report. You may read the original version here. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. You can’t sell or syndicate our stories. Any web site our stories appear on must include a contact for your organization. If you use our stories in any other medium — for example, newsletters or other email campaigns — you must make it clear that the stories are from the Fort Worth Report. In all emails, link directly to the story at fortworthreport.org and not to your website. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. For noncommercial print publications: You have to credit Fort Worth Report. Please use “Author Name, Fort Worth Report” in the byline. If you’re not able to add the byline, please include a line at the top of the story that reads: “This story was originally published by Fort Worth Report” and include our website, fortworthreport.org. You can’t edit our stories, except to reflect relative changes in time, location and editorial style. Our stories may appear on pages with ads, but not ads specifically sold against our stories. You can’t sell or syndicate our stories. You can only publish select stories individually — not as a collection. Any web site our stories appear on must include a contact for your organization. If you share our stories on social media, please tag us in your posts using @FortWorthReport on Facebook and @FortWorthReport on Twitter. The Fort Worth Report retains the copyright for all of its published content. If you have any other questions, contact us.Fort Worth designation marks major milestone for new film and TV studio in Alliance by David Moreno, Fort Worth Report March 1, 2025 <h1>Fort Worth designation marks major milestone for new film and TV studio in Alliance</h1> <p class="byline">by David Moreno, Fort Worth Report <br />March 1, 2025</p> <p>Two months after Fort Worth council members <a href="https://fortworthreport.org/2024/12/10/fort-worth-paves-way-for-new-film-and-tv-studio-in-alliance-through-new-designation/">voted to grow the city’s film industry</a>, a new state designation paves the way for a production facility in Alliance to start rolling.&nbsp;</p> <p>The city of Fort Worth recently <a href="https://www.fortworthtexas.gov/news/2025/2/media-zone">earned approval</a> from the Texas Film Commission to establish the land within city limits as a <a href="https://gov.texas.gov/uploads/files/film/230326_mpdz_one-sheet-with-flowchart.pdf">Media Production Development Zone</a>, also known as an MPDZ.&nbsp;</p> <p>The designation opens up access to a two-year use and sales tax exemption for the construction, maintenance, expansion, improvement and renovation of a media production facility within the city. The program was established in 2009 to encourage a stronger film industry across the state.&nbsp;</p> <p>The commission’s approval directly supports the conversion of a 224,616-square-foot facility in Alliance into a space for television and film production, including four 18,000-square-foot stages, a set building shop, storage, wardrobe and offices. The project is part of Hillwood’s <a href="https://fortworthreport.org/2023/08/11/hillwood-adding-two-new-industrial-buildings-at-alliance/">AllianceTexas development</a>.</p> <p>“The MPDZ is just an incredible opportunity for the city. Not only will it attract new business here with the studio and infrastructure that we need, but it also gives us the opportunity to support more projects,” Fort Worth Film Commissioner Taylor Hardy told the Report. “Having this infrastructure in Fort Worth will make us a top choice for filmmakers.”</p> <p>Council member Alan Blaylock, who represents north Fort Worth, <a href="https://fortworthreport.org/2024/12/10/fort-worth-paves-way-for-new-film-and-tv-studio-in-alliance-through-new-designation/">previously confirmed</a> that 101 Studios, the production company behind “Yellowstone,” is interested in the new Alliance space.&nbsp;</p> <p>“It’s a step in the process, but we’re excited about the opportunity,” he said in December. “It’s great for the city.”</p> <p>The move is also a boon to an industry that has grown rapidly in recent years with the introduction of multiple <a href="https://fortworthreport.org/2024/12/27/taylor-sheridan-asked-texas-legislators-to-support-film-incentives-heres-what-could-happen/">Taylor Sheridan productions</a> and Phil McGraw, better known as Dr. Phil, bringing <a href="https://fortworthreport.org/2023/11/08/dr-phils-merit-street-media-network-to-be-based-in-fort-worth/">Merit Street Media to Fort Worth</a>.&nbsp;</p> <p>“The film and entertainment industry has created more than $700 million of direct economic impact in the City of Fort Worth since 2015,” Mayor Mattie Parker said in a statement. “This is a true success story in our city, and I’m focused on continuing this momentum and creating real return on investment through this industry for the future of Fort Worth and its residents.”</p> <p>Fort Worth’s first media production zone was established in the Near Southside neighborhood in 2018, which helped support the growth of <a href="https://redproductions.com/">Red Productions</a>.&nbsp;</p> <p><em>David Moreno is the arts and culture reporter for the Fort Worth Report. Contact him at david.moreno@fortworthreport.org or </em><a href="https://twitter.com/davidmreports"><em>@davidmreports</em></a><em>.</em></p> <p><em>At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy </em><a href="https://fortworthreport.org/about/fort-worth-report-editorial-independence-policy/"><em>here</em></a><em>.</em></p> <p>This &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org/2025/03/01/fort-worth-designation-marks-major-milestone-for-new-film-and-tv-studio-in-alliance/&quot;&gt;article&lt;/a&gt; first appeared on &lt;a target=&quot;_blank&quot; href=&quot;https://fortworthreport.org&quot;&gt;Fort Worth Report&lt;/a&gt; and is republished here under a Creative Commons license.&lt;img src=&quot;https://i0.wp.com/fortworthreport.org/wp-content/uploads/2021/04/cropped-favicon.png?resize=150%2C150&amp;amp;ssl=1&quot; style=&quot;width:1em;height:1em;margin-left:10px;&quot;&gt;&lt;img id=&quot;republication-tracker-tool-source&quot; src=&quot;https://fortworthreport.org/?republication-pixel=true&amp;post=198038&amp;amp;ga4=2820184429&quot; style=&quot;width:1px;height:1px;&quot;&gt;&lt;script&gt; PARSELY = { autotrack: false, onload: function() { PARSELY.beacon.trackPageView({ url: &quot;https://fortworthreport.org/2025/03/01/fort-worth-designation-marks-major-milestone-for-new-film-and-tv-studio-in-alliance/&quot;, urlref: window.location.href }); } } &lt;/script&gt; &lt;script id=&quot;parsely-cfg&quot; src=&quot;//cdn.parsely.com/keys/fortworthreport.org/p.js&quot;&gt;&lt;/script&gt;</p> Copy to Clipboard 1 Tagged: AllianceTexas, Media Production Development Zone, Taylor Sheridan, Texas Film Commission, Visit Fort Worth David MorenoArts & Culture Reporter David Moreno is the arts & culture reporter at Fort Worth Report. He earned his Bachelors of Arts in broadcast journalism and political science from the University of North Texas. On his free time,... More by David Moreno'''
