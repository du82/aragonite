["https://fortworthreport.org/2025/02/27/fort-worth-center-gives-free-support-to-grieving-families-annual-run-keeps-memories-alive"]
title = "Fort Worth center gives free support to grieving families. Annual run keeps memories alive | Fort Worth Report"
description = "The WARM Place wants to raise $75K through its annual “Race 2 Remember Them,” a 5K and 1-mile run on March 1."
full_description = '''Sam Holden became a widow and a single mother to her four daughters at 33. One of her biggest motivators in navigating life after the death of her husband, Bert, is keeping his spirit alive. “I love that this is an opportunity to say his name again and to remember who he was,” Holden said. “Even though his physical body left us, it doesn’t mean that he left us.”The WARM Place, a Fort Worth grief support center for children, is hosting its annual “Race 2 Remember Them” 5K and 1-mile fun run at 8:30 a.m. March 1 at 3024 Acme Brick Plaza in southwest Fort Worth’s Clearfork development. The event raises funds to support its children and families. The fundraising goal? $75,000, so The WARM Place — which stands for What About Remembering Me — can keep providing support at no cost. Holden will give a speech about her family’s story of heartbreak, growth and resilience. She didn’t give it a second thought when the organization asked her to share about Bert’s life. ENJOY READING THE NEWS AGAIN Join your neighbors that count on Fort Worth Report for refreshing, nonpartisan reporting on stories happening in our backyard. Subscribe “When I was in the hospital with him saying my goodbyes, I made him two promises,” Holden said through tears. “To take care of our girls and to make him proud of me.”Holden and her family discovered The WARM Place shortly after moving to Irving from New Braunfels to be closer to their support system. As a newly single parent, she enrolled her girls in public school after she could no longer homeschool them while working a full-time job.The transition to public school was a burden on the girls, especially as they navigated a major loss.“Even though I felt like they were adjusting to the public school system and our new normal pretty well, I realized they weren’t connecting to kids their age who could understand them,” Holden said. If you go What: “Race 2 Remember Them” 5K and 1-mile fun run When: Activities begin at 8:30 a.m. March 1 Where: 3024 Acme Brick Plaza, Fort Worth How to attend: Register to race here.The WARM Place was a perfect fit for the Holden family’s needs and has been immensely helpful in providing stability and community, she said. Lilian Holden’s favorite part of The WARM Place is the potluck dinners at the start of every peer support group session. The 9-year-old also likes doing crafts, which have helped her express the emotions that come with grief. “It has made me less sad and a little bit more happy,” Lilian said. “I was really nervous and kind of uncomfortable because the first time I went, every time I talked about Dad, I felt like I was going to cry. But now that I’ve been talking with these people, I’m really friendly and open to talking about my experience.”The WARM Place has helped Holden gain insight into her unique situation as a young single mother and widow with others who can relate. The community she has formed has helped assure her it’s OK that she doesn’t have it all together. “I may go to group one week and feel so angry at the loss, then the next week I may be sobbing because a grief wave has hit,” Holden said. “I’m met with the same love and kindness and acceptance no matter where I’m at emotionally, which allows me to show up in a really authentic way.”The WARM Place, 809 Lipscomb St., offers grief support services for children who experience a loss in their family. (Kathryn Miller | Fort Worth Report)Shelley Bettis, executive director of The WARM Place, said the most special part of the organization’s annual race is the “Mile of Memories.” During the first mile, The WARM Place places signs on the route in honor of loved ones so runners can read special messages and remember for whom they’re running.“It really is a community memorial event,” Bettis said. “Sometimes life gets so busy and so chaotic, so slowing down for a minute and taking a chance to do something all together is so special to these families and to their friends.”Lilian and her sister, Piper Holden, are excited for “Race 2 Remember Them.” They can’t wait for their mom to tell the runners about their family’s story.“Now we get to tell our story to help people learn about their grief,” Piper, 12, said. “I think that’s actually pretty cool.”Kathryn Miller is a reporting fellow at the Fort Worth Report. You can contact her at kathryn.miller@fortworthreport.org. At the Fort Worth Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-23048').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contact us for details. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. This work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Unless otherwise noted, noncommercial entities may republish most of Fort Worth Report stories for free as long as they follow all of the guidelines below. For commercial licensing, ple