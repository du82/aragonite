title = "Asian artistic expression sits at heart of new UTA exhibition | Fort Worth Report"
description = "UTA’s “Solace in Painting” features artists whose work illustrates their experiences of modern Asian conflicts."
full_description = '''Keisho Okayama’s life as a Japanese American painter has been largely overlooked by art historians.Like his minimalist, muted paintings, his experiences offered a unique glimpse into the lives of 20th century Japanese Americans. Years spent as a child incarcerated in a detainment camp for Japanese Americans during World War II impacted his artistic views of his heritage and religion for the rest of his life. Get Arlington news that matters. Sign up for local stories in your inbox every Thursday. Subscribe for free When Fletcher Coleman, an art history professor at the University of Texas at Arlington, gave Okayama’s artwork a second look, he knew it was worth elevating as an unexplored piece of Asian artistic expression.As Coleman began curating “Solace in Painting: Reflecting on a Tumultuous Century” — an exhibition now on display at The Gallery at UTA — he wanted to highlight Asian artists who lived through conflict in the 1900s but have historically been excluded from conversations about artistic depictions of turmoil. “I’m introducing these artists’ biographies, and I’m using those to show the strength of the work,” Coleman said.“Solace in Painting” is the first UTA-originated exhibition that will go on to travel across the country, Coleman said. The exhibition is free to visit until March 29 before heading to the UNO Gallery at the University of Nebraska at Omaha.Okayama’s paintings hang next to two other lesser-known artists: Chao Shao-an, a Hong Kong-born artist who died in 1998, and Ann Phong, a Vietnamese American artist born in 1957. Work by each of the artists, while different, subtly explores both of their experiences of major conflicts in Asia.Okayama immigrated to the U.S. with his family at age 2, and his father soon became one of America’s highest-ranking Buddhist priests. He spent his career as an artist in Los Angeles, building a local reputation for his style that reflected a complicated relationship with Buddhism.Yukio Lippit, a professor of Japanese art and architecture at Harvard University, discusses the artwork of Keisho Okayama Feb. 6, 2025, at the University of Texas at Arlington’s “Solace in Painting: Reflecting on a Tumultuous Century” exhibition. (Drew Shaw | Arlington Report)When Coleman found Okayama’s work, he was struck by their resemblance to medieval Buddhist compositions, which mimic ancient cave paintings — an area Coleman studied deeply.Shao-an, a Hong Kong artist, lived through many of the 20th century conflicts in China, from the 1911 fall of the Qing dynasty to the return of Hong Kong to the People’s Republic of China in 1997.The subject of his paintings? Flowers and birds. In his peaceful ink and pigment artwork, Shao-an embedded metaphors about the chaotic period he lived through.The three-dimensional acrylic paintings of Phong, the only living artist of the trio, jump from the gallery’s walls with vibrant motifs reminiscent of ocean waves, rolling hills and cotton clouds. Humanoid faces and figures hide in the abstract paintings, making both the artwork and the nature it depicts feel dynamic.Phong escaped from Saigon at the end of the Vietnam War. Her recent paintings combine her experiences as an immigrant with her passion for how climate change affects nature in Vietnamese and American communities.A university student studies the work of Ann Phong, a Vietnamese American painter, on Feb. 6, 2025, at the University of Texas at Arlington’s “Solace in Painting: Reflecting on a Tumultuous Century” exhibition. (Drew Shaw | Arlington Report)He feels the exhibition is especially relevant to UTA, which ranks as the nation’s sixth-most diverse university and, in 2022, reported that 12% of its students were of Asian descent, according to the university’s website.“Oftentimes, diasporic artists’ stories become the focal point, rather than the work itself,” Coleman said. “I want to recognize artists, and the relationship of their work to their biography, while shining a light on their work and highlighting its power.”If you go: What: “Solace in Painting: Reflecting on a Tumultuous Century” at the University of Texas at Arlington Where: The Gallery at UTA, 502 S. Cooper St., Arlington When: 10 a.m.-5 p.m. Mondays-Fridays; noon-5 p.m. Saturdays through March 29 Price: Free, but parking must be booked in advance More info: Free parking in the gallery visitor spots in the F7 parking lot is available during the week, by reservation. For information on how to reserve, visit the Gallery’s website. Free parking on weekends and during receptions is available in unreserved spaces in the F7 lot. On weekends, free parking is also available at all parking meters on campus.Drew Shaw is a reporting fellow for the Arlington Report. Contact him at drew.shaw@fortworthreport.org or @shawlings601. At the Arlington Report, news decisions are made independently of our board members and financial supporters. Read more about our editorial independence policy here.#placement_740889_0_i{width:100%;max-width:550px;margin:0 auto;} var divsize = document.querySelector('#emp-64b5d').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid740889 = rnd; var plc740889 = window.plc740889 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=740889;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid740889+';place='+(plc740889++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); Related Fort Worth Report is certified by the Journalism Trust Initiative for adhering to standards for ethical journalism.Republish This StoryRepublishing is free for noncommercial entities. Commercial entities are prohibited without a licensing agreement. Contac