["https://fosdem.org/2025/schedule/event/fosdem-2025-5495-what-floss-means-in-the-ai-world"]
title = "FOSDEM 2025 - What FLOSS Means in the AI World"
full_description = "In an era where artificial intelligence is simultaneously celebrated and scrutinized, how can we ensure that technological innovation serves humanity's best interests? Mitchell Baker, Chair of the Mozilla Foundation and a former Mozilla CEO, will share how Mozilla is pioneering ethical AI development, drawing parallels to our historic contributions to open source by releasing Netscape’s source code in 1998 and inventing the Mozilla Public License in 2012. From democratizing speech technology through Common Voice and establishing rigorous ethical AI guide, to developing innovative open-source AI projects like Llamafile, Mozilla has been doing extensive work in the AI ecosystem by defining a principled approach to AI that prioritizes transparency, ethics, and community-driven innovation. Learn how we're applying the same open-source philosophy that revolutionized software development to the complex challenges of artificial intelligence, and how Mozilla has been playing a key role in defining a definition of Open Souce AI."
year_published = 2025
