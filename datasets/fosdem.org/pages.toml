["https://fosdem.org/2025/schedule/event/fosdem-2025-6370-early-screening-of-zemarmot-animation-film-work-in-progress-with-live-music"]
title = 'FOSDEM 2025 - Early Screening of "ZeMarmot" animation film (work-in-progress) with live music'
full_description = "« ZeMarmot » is a short animation film project by members of the GIMP team, drawn in GIMP and animated in GIMP and Blender. The film itself will be released under Libre licenses (CC by-sa, Art Libre), including the music and all source files for both graphics and music. Aryeom is the film director and basically did everything graphics-wise, from storyboarding to drawing, coloring, backgrounds, animating and editing. Jehan is the scenarist and technical side of the project, patching GIMP, Blender and other software. He became GIMP’s maintainer while working on ZeMarmot as direct consequence of this movie project. The production is LILA, non-profit film production based in France working with Free Software and producing Libre Art movies. Music is composed and recorded by AMMD, a cooperative of artists producing Libre Art music with Free Software (such as Ardour). The short is a bit less than 10 min and is still work-in-progress, i.e. it is in unfinished state (some coloring and backgrounds are missing in particular). Instead of recorded music, musicians from the AMMD will be present and play live on the video. The screening will be followed by presentation and questions."
