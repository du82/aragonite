["https://fosdem.org/2025/about/sponsors"]
title = "FOSDEM 2025 - Sponsors"
full_description = "If you are interested in sponsoring FOSDEM, send us an email at sponsors@fosdem.org or see our contact page for more information. While FOSDEM is primarily funded by sponsors and the sale of t-shirts, we also gratefully accept voluntary donations. See our donations page for more information. Google believes that open source is good for everyone. By being open and freely available, it enables and encourages collaboration and the development of technology. Red Hat is the world’s leading provider of enterprise open source software solutions, using a community-powered approach to deliver reliable and high-performing Linux, hybrid cloud, container, and Kubernetes technologies. Red Hat helps customers develop cloud-native applications, integrate existing and new IT applications, and automate and manage complex environments. A trusted adviser to the Fortune 500, Red Hat provides award-winning support, training, and consulting services that bring the benefits of open innovation to any industry. Red Hat is a connective hub in a global network of enterprises, partners, and communities, helping organizations grow, transform, and prepare for the digital future. Arm is leader in global semiconductor design and software. Our energy-efficient processor designs and software platforms have enabled advanced computing in more than 270 billion chips to date and are defining the future of computing. Collaboration is at the heart of all we do. With more than 1,000 technology partners, Arm provides a trusted foundation for a vast range of applications, from the sensor to the smartphone and the supercomputer. We support thousands of open-source software projects, enabling more than 15 million developers who target Arm platforms to build, deploy, and manage their projects seamlessly, enabling top performance across the wide spectrum of hardware on Arm. At Block, engineering is at the heart of everything we do. From developing seamless payment solutions to creating new tools for financial inclusion, our engineers are not just building products — they’re shaping the future of financial services and more. Since the founding of the company, open source software has been central to our technology."
