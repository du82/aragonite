["https://fosdem.org/2025/schedule/event/fosdem-2025-6674-lightning-lightning-talks"]
title = "FOSDEM 2025 - Lightning Lightning Talks"
full_description = "The regular FOSDEM lightning talk track isn't chaotic enough, so this year we're introducing Lightning Lightning Talks (now with added lightning!). Thought of a last minute topic you want to share? Got your interesting talk rejected? Has something exciting happened in the last few weeks you want to talk about? This is an experimental session taking place on Sunday afternoon (13:00 in k1105), containing non-stop 5 minute talks. If the format works well, we might expand this in future editions (feedback welcome!). Submitted talks will be automatically presented by our Lightning Lightning Talk System, which keeps track of the time limit for the current speaker and the order of presentations. Presenters who attempt to speak for longer than 5 minutes risk being swept off the stage by our Lightning Lightning Talk Cleanup Crew."
