["https://fosdem.org/2025/news/2"]
title = "FOSDEM 2025 - News (2 of 3)"
full_description = "We were made aware of planned protests during the upcoming FOSDEM 2025 in response to a scheduled talk which is causing controversy. The talk in question is claimed to be on the schedule for sponsorship reasons; additionally, some of the speakers scheduled to speak during this talk are controversial to some of our attendees. To be clear, in our 25 year history, we have always had the hard rule that sponsorship does not give you preferential treatment for talk selection; this policy has always applied, it applied in this particular case, and it will continue to apply in the future. Any claims that any talk was allowed for sponsorship reasons are false. At FOSDEM, we have always allowed and welcomed protest, even when that protest was directed at the organization or one of our sponsors. Open Source and Free Software are inherently political, and as such it is normal and expected that our attendees are more vocal about the wider world, and about FOSDEM in particular. As such, if a peaceful protest were to take place during the talk in question, we will not take action, provided the protest is indeed peaceful and does not disrupt the proceedings. We would appreciate if anyone organizing a protest would contact us in advance at info@fosdem.org so we can ensure that we’re able to meet our crowd control and fire safety obligations. FOSDEM Junior is a collaboration between FOSDEM, Code Club, CoderDojo, developers, and volunteers to organize workshops and activities for children during the FOSDEM weekend. These activities are for children to learn and get inspired about technology. This year’s activities include microcontrollers, embroidery, game development, music, and mobile application development. Last year we organized the first edition of FOSDEM Junior. We are pleased to announce that we will be back this year. Registration for individual workshops is required. Links can be found on the page of each activity. The full schedule can be viewed at the junior track schedule page."
year_published = 2025
year_updated = 2025
