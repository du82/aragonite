["https://fosdem.org/2025/schedule"]
title = "FOSDEM 2025 - Schedule"
full_description = "Every year, FOSDEM hosts a wide variety of activities. This page gives an overview with links to further information about scheduled events. All times CET (UTC+1). FOSDEM is a rather busy conference. This edition features 1193 speakers, 1105 events, and 79 tracks. We do our best to provide you with as much information and navigation options about the schedule as we can. There are essentially the following categories of sessions and activities: keynotes, main tracks, developer rooms, lightning talks, stands and BOFs. For a complete (but crowded) overview, there is also a page that lists all events. A list of all speakers is available, too. During the event, the live streaming page is also updated every few minutes to show you what is currently scheduled in each room. Like almost every other conference, FOSDEM invites speakers to gently start the day with talks concerning slightly less technical, but nevertheless interesting topics from the Open Source realm. The closing keynote at the end of the conference helps everyone digest the vast amount of insightful information collected over the weekend. The main tracks consist of series of talks that are organised by topic, where the FOSDEM program committee selects suggestions and actively invites speakers on those topics. The vast majority of events (talks, hacking sessions, open discussions) are held in so-called developer rooms (devrooms), which are organized and managed by open source projects themselves, or even associations between several such projects on a common topic in order to foster collaboration. The lightning talk is a very popular format, used at many conferences, where speakers have a mere 15 minutes at their disposal to showcase an open source project, an idea, or a concept thereof. While that brief lapse of time may seem awkward, it almost always leads the presenters to concentrate on the absolute essence and what is really important, which is why it is often a much appreciated approach, as is the wide variety of the topics."
year_published = 2025
clearnet = "https://fosdem.org/2025/schedule"
