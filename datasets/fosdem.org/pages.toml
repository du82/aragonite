["https://fosdem.org/2025/schedule/speaker/aryeom"]
title = "FOSDEM 2025 - Aryeom"
full_description = '''Aryeom Han is an independent animation film director and artist, born and raised in South Korea where she graduated fine arts, with a specialization in animation films. Her first co-directed (with Kang Hui-jin) short animation, “Grandma Ocean” got screened in more than a dozen festivals and won 2 prices. She worked with a few other directors on other projects and also produced a few commissioned movies such as "What is Peertube?" or "What is the Fediverse?" for the Framasoft non-profit for Free Software promotion, among various other projects. She has been contributing to GIMP since 2012 and is now one of the core team contributors, for illustrations, UI/UX designs, testing, event organization and more… Aryeom is ZeMarmot's film director, animator, artistic director, editor… and pretty much everything graphics-related on this project.'''
