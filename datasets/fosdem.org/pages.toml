["https://fosdem.org"]
title = "FOSDEM 2025 - Home"
full_description = "Please let us know about your FOSDEM experience at feedback@fosdem.org. All your feedback, good or bad, and suggestions for future years will be greatly appreciated. Please use the links under each event to provide feedback to the speakers. We are adding a video of each talk to its web page when it is ready. See the processing status of individual talks. or download from video.fosdem.org/2025 (arranged by room name). FOSDEM is a free event for software developers to meet, share ideas and collaborate. Every year, thousands of developers of free and open source software from all over the world gather at the event in Brussels. You don't need to register. Just turn up and join in! Treasure hunters, we have an update! Unfortunately, some of our signs have been removed or stolen, but don’t worry—the hunt is still on! Are you ready for a challenge? We’re hosting a treasure hunt at FOSDEM, where participants must solve six sequential riddles to uncover the final answer. Teamwork is allowed and encouraged, so gather your friends and put your problem-solving skills to the test! The regular FOSDEM lightning talk track isn't chaotic enough, so this year we're introducing Lightning Lightning Talks (now with added lightning!). FOSDEM takes place at the ULB Solbosch Campus, Brussels, Belgium, Europe, Earth. If you aren't there, you may watch the live streams from the main tracks and developer rooms."
