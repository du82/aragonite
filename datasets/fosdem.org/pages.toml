["https://fosdem.org/2025/schedule/event/fosdem-2025-6648-14-years-of-systemd"]
title = "FOSDEM 2025 - 14 Years of systemd"
full_description = "Almost a decade and a half ago we introduced systemd, and it since has been adopted by most commercial and community distributions in one form or another. Let's have a look back at the tumultuous beginnings, how we became what we are now, and let's talk a bit the perspective for the future, what systemd is supposed to be in the eyes of its developers – and what it shouldn't be."
