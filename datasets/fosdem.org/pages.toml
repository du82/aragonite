["https://fosdem.org/2025/schedule/speaker/amreen_taneja"]
title = "FOSDEM 2025 - Amreen Taneja"
full_description = "Amreen is a seasoned expert in open source technologies and digital public goods (DPGs), with a proven track record of advancing global standards, fostering innovation, and enabling collaboration across diverse stakeholders. As the Standards Lead at the Digital Public Goods Alliance (DPGA), Amreen spearheads the development and governance of the DPG Standard that recognises open source solutions including Open software, data, AI systems and content as Digital public goods while ensuring it aligns with best practices for open source, ethical considerations, privacy, and interoperability. Amreen’s work bridges the gap between policy and technology, driving the adoption of open-source solutions in global development and public sector transformation, with a strong focus on leveraging technology for social impact and advancing equitable access to digital tools for the public good."
