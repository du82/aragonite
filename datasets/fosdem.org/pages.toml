["https://fosdem.org/2025/schedule/speaker/denver_gingerich"]
title = "FOSDEM 2025 - Denver Gingerich"
full_description = "Denver is a software right-to-repair and standards activist who is currently Director of Compliance at Software Freedom Conservancy, where he enforces software right-to-repair licenses such as the GPL, and is also a director of the worker co-operative that runs JMP.chat, a FOSS phone number (texting/calling) service. Denver writes free software in his spare time: his patches have been accepted into Wine, Linux, and wdiff. Denver received his BMath in Computer Science from the University of Waterloo. He gives presentations about digital civil rights and how to ensure FOSS remains sustainable as a community and financially, having spoken at conferences such as FOSSY, CopyleftConf, LibrePlanet, LinuxCon North America, CopyCamp Toronto, FOSSLC's Summercamp, and the Open Video Conference."
