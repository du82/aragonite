["https://fosdem.org/2025/practical"]
title = "FOSDEM 2025 - Practical information"
full_description = "FOSDEM is free to attend. There is no registration. Just turn up! The conference is primarily funded by sponsors and the sale of t-shirts but we also gratefully accept donations. All the times on this website are displayed in the local time zone for Brussels which is Central European Time, CET (UTC+1). In order to keep FOSDEM a fun, interesting and positive experience for everybody, we expect participants to follow the FOSDEM Code of Conduct. Some passive recruitment is allowed for open source positions and contracting. See Job Corner for details. The fosdem@ mailing list is a good place to ask for more information. The list archive, going back to 2006, contains a wealth of useful information."
