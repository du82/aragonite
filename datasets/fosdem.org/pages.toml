["https://fosdem.org/2025/news/3"]
title = "FOSDEM 2025 - News (3 of 3)"
full_description = 'FOSDEM 2025 will take place at the ULB on the 1st and 2nd of February 2025. As has become traditional, we offer free and open source projects a stand to display their work "in real life" to the audience. You can share information, demo software, interact with your users and developers, give away goodies, sell merchandise or accept donations. Anything is possible! You can choose whether you want the spot for the entire conference, or simply for one day. Joint submissions (sharing a table) will be favoured in the process. Submit your application at https://pretalx.fosdem.org/fosdem-2025-call-for-stands/! Deadline closes the 7th of November; accepted stands will be announced the 16th of November. FOSDEM offers open source and free software developers a place to meet, share ideas and collaborate. Renowned for being highly developer-oriented, the event brings together some 8000+ geeks from all over the world. The twenty-fifth edition will take place Saturday 1st and Sunday 2nd February 2025 in Brussels, Belgium. Developer rooms are assigned to self-organising groups to work together on open source and free software projects, to discuss topics relevant to a broader subset of the community, etc. Most content should take the form of presentations. Proposals involving collaboration across project or domain boundaries are strongly encouraged. Developer room proposals should be submitted through the form at https://fosdem.org/devroom which contains further information. FOSDEM 2025 will take place on Saturday 1st and Sunday 2nd of February 2025. This will be our 25th anniversary.'
