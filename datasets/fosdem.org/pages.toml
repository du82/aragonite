["https://fosdem.org/2025/sightseeing"]
title = "FOSDEM 2025 - Sightseeing"
full_description = "Sorry, this year's tours are fully booked. You can still subscribe to the waiting list should someone have to cancel. FOSDEM hires professional guides each year to offer free guided tours of Brussels to the spouses/partners of FOSDEM visitors. If your partner would like to accompany you to Brussels but is not interested in the FOSDEM conference, this will make their stay worthwhile. Brussels has a rich historical past and a cosmopolitan present. The free tours will take place on both days during the conference. Each tour will give you a view of a different side of the city, and the tours offered this year will be different from those offered in previous years. The meeting point is in the hallway of the UD building, and the tours end here as well. For both tours, Saturday and Sunday, you have to register in front providing phone number and e-mail. Send an e-mail to tour@fosdem.org providing name, e-mail and phone number and await a confirmation. We need this information for emergencies and won't use it or store it for any other purpose. It will be deleted after FOSDEM ends. Come to the meeting point ON TIME. If you are to late we sadly can't wait for you! We go to the city centre by public transport kindly offered by FOSDEM. The Saturday tour starts at 12:30. This will be the popular tour of the beautiful city centre of Brussels. The guide will show you the main sights of Brussels. By foot, we will show you some of the city in just two hours. Potential places to see include: • Grand Place • Town Hall • Maison du Roi • Comic art scene • The Stock Exchange • Galeries Saint Hubert • Manneken Pis • The Monnaie Opera • St Nicolas’ Church • River Senne • The Royal Square • Mont des Arts The tour usually ends close to the Cathedral. At 16:00, we go to Cinematek, the cinema museum, for a silent movie with live piano accompaniment. Afterwards, we will take public transport back to the ULB. We expect to arrive back at ULB around 18:30. The Sunday tour starts at 12:00. We'll discover the Marolles/Marollen quarter and get a guided tour of the Art&Marges museum. We expect to be back at ULB at 16:30 approximately."
year_published = 2025
clearnet = "https://fosdem.org/2025/sightseeing"
