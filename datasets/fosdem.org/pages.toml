["https://fosdem.org/2025/practical/accessibility"]
title = "FOSDEM 2025 - Accessibility"
full_description = '''FOSDEM welcomes all free software and open source developers! While we don't own the university campus and have little control over its accessibility, we have tried to find ways for developers with physical limitations to make the most of the event. Wheelchair accessible routes and toilets can be found through nav.fosdem.org (hint: search for "wheelchair" and use the "avoid stairs" navigation setting). All rooms apart from the upper rooms in AW are weelchair accessible. A static map of the campus is available here. We realise some people on the autism spectrum might need some quiet time. While we cannot offer that on campus, we suggest Bois de La Cambre/Terkamerenbos, only a five minute walk away. We welcome your ideas for improving accessibility at FOSDEM. Please email them to feedback@fosdem.org.'''
