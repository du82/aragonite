["https://fosdem.org/2025/schedule/speaker/jehan"]
title = "FOSDEM 2025 - Jehan"
full_description = "Contributor of GIMP for 12 years and maintainer for the last 4 years (and also occasional contributor on any software I use when I find issues I want fixed). I started heavily improving GIMP for our animation film project ZeMarmot with the non-profit movie production LILA based in France. All our development work is therefore based on professional daily usage of the software. The software is fully Free Software and the produced movie will be Libre Art (Free Art and Creative Commons by-sa 4.0 International licences). I also had various other experience in the cinema industry, in movie dubbing, as an engineer for digitalization of movie theaters, and even in front of the camera."
