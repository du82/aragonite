["https://fosdem.org/2025/practical/services"]
title = "FOSDEM 2025 - Services provided during the event"
full_description = '''Need information about scheduled talks, the location of the rooms or other practicalities? We're happy to assist you at one of the Infodesks. Tired of carrying your coat, bags or umbrella around? Store them at our free and permanently staffed cloak room. Disclaimer: FOSDEM cannot accept responsibility for the loss or damage from any cause whatsoever of items left at the cloak room. A Red Cross first aid team is present during the entire weekend. Get there using the on-campus interactive map or follow the signs in the K building. The goal of FOSDEM is to organise an event where everyone can feel safe and comfortable. For that purpose, we have invested in having multiple professional security guards during the weekend. If you see a (potential) problem, please approach one of them or a staff member who can be recognised by his/her bright yellow t-shirt with "Staff" on the back.'''
