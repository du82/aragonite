["https://fosdem.org/2025/faq"]
title = "FOSDEM 2025 - Frequently Asked Questions"
full_description = "The most common reason for rejection is not a lack of quality, but simply FOSDEM's popularity. There are always many more requests than we can accommodate. While this is a good thing, it does constitute a challenge for the programme team. Rest assured we make our decisions with the best possible intent. For legal reasons, the FOSDEM organization can only issue such letters of invitation to “main track” speakers for whom we also make travel and hotel arrangements. If you are attending FOSDEM as part of your involvement with a project represented at our conference, we recommend you get in touch with someone you know locally who is involved in the project and ask them to invite you. For information regarding Belgian visa requirements, we refer you to the website of the Belgian ministry of foreign affairs. All talks can be watched from our website. Go to schedule, find the topic you are interested in, click on the Watch the live stream-link and enjoy the presentation. All talk recordings will be made available on video.fosdem.org/2025 as soon as the presenter reviewed the contents to make sure the recording is correct. You can talk to us at the Infodesk (K or H), in the Infodesk channel on chat.fosdem.org or open an issue on our Github repository. Pull requests welcome! No. FOSDEM staff are not compensated for their work. FOSDEM does refund them some expenses. Think of a place to sleep near the campus during the conference, and limited compensation for international travel to the conference and meetings. FOSDEM staff are the volunteers who start work on the next edition as soon as the current one finishes. Almost everything you see, hear or experience is here because we bring it. We call for speakers, set up a submission system for devrooms, stands and talks; review them in the hope we select an interesting programme; we negotiate the use of the campus, make sure we have the right permits; we make sure you have something to eat and drink, talk with the student association so you can have a seat at the bar; we pull network cables everywhere so you can enjoy some free quality WiFi; we set up stands, rooms, infodesks and much other things so this looks like FOSDEM and not like a day at university; we put signs everywhere and still have to find people who get lost on campus; we also record every talk with our own custom libre equipment, broadcast it for the world to see and archive it. In short, we spend huge amounts of our spare time - and lots more closer to FOSDEM - to try to make this a fun and interesting event. FOSDEM staff membership is a yearlong commitment to create something that lasts two days. For this, you need a close-knit group of trusted people, so we invite our staff members. If you are committed to help us out, you can always volunteer - almost all staff members started out as volunteers."
year_published = 2025
clearnet = "https://fosdem.org/2025/faq"
