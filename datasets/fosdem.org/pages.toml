["https://fosdem.org/2025/schedule/event/fosdem-2025-4564-where-have-the-women-of-tech-history-gone-2-0"]
title = "FOSDEM 2025 - Where have the women of tech history gone? 2.0"
full_description = "Last year, we explored the extraordinary contributions of women to the history of computer science. But did you know that was just the tip of the iceberg? After diving deeper into this fascinating subject, I’ve uncovered even more incredible stories to share. What about the pioneer behind assembly language? Or the creator of the STP, without which the World Wide Web might never have existed? And what about the brilliant mind behind the ARM architecture? Join me as we journey once again into the history of computer science to uncover the remarkable achievements of even more amazing women."
