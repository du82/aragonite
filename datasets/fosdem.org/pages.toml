["https://fosdem.org/2025/schedule/event/fosdem-2025-5687-scaling-open-source-solutions-to-achieve-the-sustainable-development-goals-a-global-call-to-action"]
title = "FOSDEM 2025 - Scaling Open-Source Solutions to Achieve the Sustainable Development Goals: A Global Call to Action"
full_description = "With just five years remaining to achieve the Sustainable Development Goals (SDGs), the window for action is rapidly closing. This session explores how the United Nations and other stakeholders are accelerating efforts toward meeting these goals and how open source solutions are critical. The Digital Public Goods Alliance in collaboration with the UN Envoy on Technology will dive into the role of digital public goods in supporting SDG progress, highlighting innovative initiatives, partnerships, and technologies that can scale impact in areas like health, education, climate action, and more. Join us for a conversation about how the open-source community can unite with governments, NGOs, and the private sector to build the digital infrastructure needed to meet these ambitious goals. The Digital Public Goods Alliance is a multi-stakeholder UN-endorsed initiative that facilitates the discovery and deployment of open-source technologies, bringing together countries and organisations to create a thriving global ecosystem for digital public goods and helping to achieve the sustainable development goals. The Office of the UN Secretary-General’s Envoy on Technology is dedicated to advancing the United Nations’ digital cooperation agenda, ensuring that technological advancements benefit all of humanity while mitigating associated risks. The Global Digital Compact (GDC): 1. The UN Envoy on Technology will present highlights of the GDC, emphasizing its relevance to open source communities and sustainable development. 2. Key areas of focus: - Digital Inclusion: Bridging digital divides through open collaboration and equitable access. - Open-Source as a Foundation: Recognizing open technologies as a cornerstone of global cooperation and innovation. Formal Recognition of New Flagship DPGs and insights from some other notable DPGs and their alignment with open source principles and the impact of their inclusion as DPGs on advancing global digital equity. Engaging the FOSDEM Community: A compelling closing appeal to developers, contributors, and organizations in the open-source ecosystem to: 1. Actively participate in scaling DPGs. 2. Leverage their expertise to support SDG-aligned open initiatives. 3. Join global efforts like ours to create inclusive, ethical, and open digital infrastructure."
year_published = 2025
clearnet = "https://fosdem.org/2025/schedule/event/fosdem-2025-5687-scaling-open-source-solutions-to-achieve-the-sustainable-development-goals-a-global-call-to-action"
