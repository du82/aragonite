["https://fosdem.org/2025/news/2025-01-17-call-for-volunteers"]
title = "FOSDEM 2025 - Call for volunteers"
full_description = "Every year, an enthusiastic band of volunteers make FOSDEM happen and make it a fun and safe place for all our attendees. We could not do this without you. This year we again need as many hands as possible, especially for heralding during the conference, during the buildup (starting Friday at noon) and teardown (Sunday evening). No need to worry about missing lunch at the weekend, food will be provided. Would you like to be part of the team that makes FOSDEM tick? Sign up here! You could really help us out with the following: If any or all of these sound like your kind of gig, pick your task(s) at our volunteer tool, subscribe to the volunteers mailing list and keep an eye on #fosdem-infodesk on Matrix Feel free to shout out and introduce yourself!"
