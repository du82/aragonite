["https://fosdem.org/2025/news/2025-01-27-lightning-lightning-talks"]
title = "FOSDEM 2025 - Introducing Lightning Lightning Talks"
full_description = "The regular FOSDEM lightning talk track isn't chaotic enough, so this year we're introducing Lightning Lightning Talks (now with added lightning!). Thought of a last minute topic you want to share? Got your interesting talk rejected? Has something exciting happened in the last few weeks you want to talk about? This is an experimental session taking place on Sunday afternoon (13:00 in k1105), containing non-stop lightning fast 5 minute talks. Submitted talks will be automatically presented by our Lightning Lightning Talk System, which keeps track of the time limit for the current speaker and the order of presentations. Presenters who attempt to speak for longer than 5 minutes risk being swept off the stage by our Lightning Lightning Talk Cleanup Crew. The FOSDEM lightning talk track contains lightning talks, but they are 15 minutes long and scheduled months in advance. This Lightning Lightning Talk session tries to bring more lightning to FOSDEM, with a faster pace and more spontaneous talks."
year_published = 2025
