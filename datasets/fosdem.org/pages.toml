["https://fosdem.org/2025/news"]
title = "FOSDEM 2025 - News (1 of 3)"
full_description = "Treasure hunters, we have an update! Unfortunately, some of our signs have been removed or stolen, but don’t worry—the hunt is still on! To ensure everyone can continue, we will be posting all signs online so you can still access the riddles and keep progressing. However, there is one exception: the 4th riddle must still be heard in person at Building H, as it includes an important radio message. Keep your eyes on our updates, stay determined, and don’t let a few missing signs stop you from cracking the code! Good luck, and see you at Infodesk K with the final answer! Update 2025-02-02 19:30: The hunt continues online! When you solve it, let us know on info@fosdem.org with your answer! Are you ready for a challenge? We’re hosting a treasure hunt at FOSDEM, where participants must solve six sequential riddles to uncover the final answer. Teamwork is allowed and encouraged, so gather your friends and put your problem-solving skills to the test! The six riddles are set up across different locations on campus. Your task is to find the correct locations, solve the riddles, and progress to the next step. No additional instructions will be given after this announcement, it’s up to you to navigate and decipher the clues! To keep things fair, no hints or tips will be given until the end of the first day, so participants will have to rely on their own ingenuity to progress. The first two individuals or teams to arrive at Infodesk K with the correct answer will win a special FOSDEM prize! The prize is awarded on a first-come, first-served basis, and the answer must be validated by the staff member responsible for the treasure hunt before confirming a winner. If the responsible staff member is not at Infodesk K when you arrive with your answer, please wait and ask a FOSDEM staff member to contact them. The regular FOSDEM lightning talk track isn't chaotic enough, so this year we're introducing Lightning Lightning Talks (now with added lightning!). Thought of a last minute topic you want to share? Got your interesting talk rejected? Has something exciting happened in the last few weeks you want to talk about?"
