title = "FOSDEM 2025 - Jens Mönig"
full_description = "Jens Mönig is a researcher at SAP. He is the architect and lead programmer of UC Berkeley’s SNAP! programming language for which he has been awarded the U.S. National Technology Leadership Symposium (NTLS) Educational Leadership Award 2020 together with Brian Harvey. Previously Jens has conducted research under Alan Kay, helped develop Scratch for the MIT Media Lab and written enterprise software. He is a fully qualified lawyer in Germany and has been an attorney, corporate counsel and lecturer for many years before rediscovering his love for programming. For leisure Jens loves riding his bicycle and fooling around with musical instruments."
