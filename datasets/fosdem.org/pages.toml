["https://fosdem.org/2025/practical/transportation"]
title = "FOSDEM 2025 - Transportation"
full_description = '''FOSDEM is easy to reach by public transport. For details, see below. If you are afraid of getting lost, the following links may be helpful: From Brussels South (a.k.a. "Bruxelles Midi", "Brussel Zuid" or "Gare du Midi") Station (about 30 minutes): From Brussels Central ("Bruxelles Central", "Brussel Centraal" or "Gare Centrale") station (about 20 minutes): If you come to FOSDEM by car, you can park your car on the campus. The main parking is located between Janson and the K building. See the map on this page for the exact location. The entrance to the parking is on Av. Franklin Roosevelt next to the H building. Note: There is no entrance from Av. Adolphe Buyl. An additional parking on the campus is available next to the U building at Av. Antoine Depage. Note that this is a one-way street, only accessible from Av. Franklin Roosevelt as well. The parkings of the campus can be very busy since early morning during both days. An alternative is to leave your car in the Parking Sablon-Poelaert, from there to take the Tram 8, direction Roodebeek. Then follow the instructions above. Be aware that most streets directly surrounding the ULB campus are in a so-called 'blue zone'. Parking in the blue zone is free, but limited to a maximum of two hours on Monday - Saturday. Use of a parking disc displaying the arrival time is mandatory here. The picture on the right shows one of the signs that may be used to indicate this blue zone. These signs are placed on the zone edges, so not repeated on every street inside the zone. Other nearby streets are in paid parking zones: check where you park your car. As of 2018, the ULB campus Solbosch is within the Brussels Low Emissions Zone (LEZ). Drivers of cars registered abroad are required to register before entering the LEZ, or risk being fined. Registering is free of charge. More information can be found here. If you need a taxi, we suggest calling Taxi Verts on +32 2 349 49 49. The address of the venue is: ULB Campus Solbosch 50, Av. Franklin D. Roosevelt 1050 Bruxelles The location where taxis expect to pick you up is marked on the map.'''
year_published = 2025
clearnet = "https://fosdem.org/2025/practical/transportation"
