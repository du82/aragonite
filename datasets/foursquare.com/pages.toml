["https://foursquare.com/about"]
title = "Who We Are | Foursquare"
description = "Foursquare is a leader in location data and creating technology that connects digital and physical places. Find out more today!"
full_description = "Company / Who We Are The industry-leading platform for all things geospatial From foundational building blocks to turnkey solutions, from developers to marketers For 15 years now, we have fully dedicated ourselves to building geospatial technology, giving us a deep understanding of its potential. Our suite of solutions empowers businesses to harness the power of location, removing barriers and accelerating time to value. Whether you’re building products with our tools, tapping into our data, transforming your own data with our technology, or using our out-of-the-box solutions, we provide the building blocks you need. The industry-leading platform for all things geospatial Awards & recognition2024 Best Places To Work AwardsBIG Innovation 2024 Awards2024 Best Innovation in Mobile & Device Development100 Best Workplaces for Innovators 2022Foursquare Places API named Best in Enterprise APIs 2022Best Attribution Tool Our visionThe location layer of your tech stackFrom beloved consumer app to industry leader – that’s our journey in a nutshell. We pioneered the whole ‘check-in’ thing, but we’ve come a long way since then. We realized the power of our technology to other businesses, so we decided to think bigger. Today, we’ve pivoted to become the #1 geospatial platform, offering solutions for developers, marketers, data scientists and more. With proprietary technology, continuous innovation, and a strong focus on consumer privacy, we’re helping businesses across various industries drive real world outcomes. Foursquare by the numbers16B+Human-verified check-ins ensuring data quality120M+Global points of interest500M+Unique devices reached via our targeting solutions550+Integrated partners100%Of the top national advertisers use our technology300+Employees worldwide Our storyHow we got here2009Foursquare launches.Places API open to developers.2011Built snap-to-place technology.2013Developers using tools reach 40k.2014Updated our branding.Launched the Swarm app.2015Launched Pinpoint media.2016Launched Attribution.Hit 10B check-ins.2017Opened SDK to developers.2018Developers using tools reach 125k.Hit 12B check-ins.2019Foursquare acquired Placed.2020Foursquare acquired Factual.2021Foursquare acquired Unfolded Places API wins Best API award.2022Launched Hex Tiles &Closed Loop.2023Launched Foursquare Knowledge Graph.Hit 16B check-ins.2024Launched Sales Impact #cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoFormRow .mktoLabel, #cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoFormRow .mktoLabel .mktoAsterix{color:#ffffff;}#cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoFormRow .mktoHtmlText, #cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoCheckboxList label{color:#ffffff;}#cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoTemplateBox span, #cta-v2-0c19b37a-923e-4798-9564-a0f238e41fca .fsq_form_expanded .form-two-col.mktoForm .mktoTemplateBox span a{color:#ffffff!important;}Power your business with the best in location intelligenceInterested in exploring how Foursquare can help drive your business forward? We’d love to show you.Speak to an expertTalk to an expertThanks so much for your interest. One of our location experts will get back to you ASAP. html { scroll-behavior: smooth !important; } .trim-bottom { padding-bottom: 20px !important; } .trim-top { padding-top: 20px !important; } .tighten-features { padding: 0 0 4rem 0 !important } .tighten-features .feature--v4_head { margin-bottom: 0; } .revealscroll {transition: none !important;} .tighten-list.use-case-tab.layout-two ul li { padding: 18px 0 !important; } .tighten-list.use-case-tab.layout-two .use-case-tab__body { align-items: center !important; } .counter__body .counter__body_head h4 { font-family: SometypeMonoMedium; font-weight: 500; text-align: cente