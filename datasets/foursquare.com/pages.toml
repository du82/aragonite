title = "About - Foursquare"
description = "Apply for one of our open positions and invent the future with Foursquare."
full_description = "Home » About If it tells you where, it’s probably built on FoursquareWe believe in the power of location. What people experience in the real world and the places they go are powerful reflections of who they are and what they care about. We help leading global companies tap into this intelligence to create better customer experiences and smarter business outcomes, all based on the world’s leading platform for understanding people, places, and the interactions between them. Learn more about how we can help you drive business impact at Location.Foursquare.com. Our mission is to create technology that constructs meaningful bridges between digital spaces and physical places. Executive TeamGary LittlePresident & CEOLinkedInAs CEO of Foursquare, Gary is responsible for driving the company mission and vision as the world’s most trusted and independent location technology platform.Jonathan BankSVP, Customer SuccessLinkedInAs SVP of Customer Success, Jonathan is responsible for optimizing the operational footprint of the company in order to deliver industry-leading customer experiences while enabling the company to scale along with expected growth opportunities.Vikram GundetiChief Technology OfficerLinkedInAs the Chief Technology Officer, Vikram is responsible for driving the technical strategy, decision making and research for Foursquare’s geospatial platform.David ImSVP & Head of Global FinanceLinkedInAs our SVP of Finance, David will oversee Foursquare’s accounting, FP&A, financial reporting, investor relations, procurement, tax and treasury functions on a global basis.Lindsey KintnerSVP, Global Head of SalesLinkedInAs Global Head of Sales, Lindsey drives the development of strategies to maximize sales, bolster revenue growth, and optimize monetization across Foursquare’s leading suite of geospatial solutions.Kit KrugmanSVP, People & CultureLinkedInAs SVP of People & Culture at Foursquare, Kit is responsible for leading Foursquare’s approach to people innovation and organizational design. She leads the development of Foursquare’s team functions with a particular focus on building the organization as a strategic multiplier.Michele MorelliSVP, Marketing & CommunicationsLinkedInAs SVP of Marketing & Communications, Michele is responsible for overseeing the brand strategy, communications, and product and performance marketing of Foursquare’s apps and enterprise products.James HuYoungGeneral CounselLinkedInAs General Counsel, James is responsible for guidance regarding litigation risks, corporate initiatives, risk management, equity, employment, regulatory and all other legal and compliance matters at Foursquare.Pam ThomasVP, Chief of StaffLinkedInIn her role as VP, Chief of Staff, Pam works on a wide array of strategic and operational initiatives, all focused on increasing the velocity of Foursquare’s strategy. Foursquare blogIntroducing the Foursquare Graph, a Pioneer in Location IntelligenceNew technology will transform how business value is extracted from movement dataRead moreFSQ Faces / David Im, SVP & Head of Global FinanceA nine-year veteran of the company, David Im was just appointed SVP & Head of Global Finance at Foursquare…Read moreAnd the 2022 Digiday Award for best Attribution tool goes to…We sat down with Dan Hebert, Foursquare’s Senior Manager of Data Science, to learn why Foursquare Attribution’s methodology proved to…Read moreFoursquare partners with The Points Guy to make travel easier and more cost-efficientPopular mobile app The Points Guy will be leveraging Foursquare’s Pilgrim SDK to help users…Read moreFoursquare Proudly Partners on NAI Location Solution Provider Enhanced StandardsToday, Foursquare is proud to announce our participation in the Network Advertising Initiative’s new…Read more Discover your next roleApply for one of our open positions and invent the future with Foursquare.Visit our career page"
