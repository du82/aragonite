["https://foursquare.com/legal/cookiepolicy"]
title = "Privacy Center | Foursquare"
description = "Discover more about Privacy Center with Foursquare."
full_description = ":Foursquare privacy center We make it easy for you to learn more about our data practices and how to exercise your privacy rights. . . Data is a privilegeAs pioneers in location technology, we believe it is our duty and responsibility to set best practices related to data privacy and the ethical use of data. The data we collect powers our apps and location platform solutions for enterprises responsibly, always protecting user privacy.Transparency, Notice & ChoiceWe know that location data is some of the most sensitive data out there. That’s why people must be in control of what personal data they share and how it is used. We empower our customers to make choices and exercise their rights.We believe that: • Mobile apps that want to collect location data need to ask permission from consumers in everyday language.• Consent should not be buried within terms and conditions.• Alerts should be clear and identify the purposes for which data will be used.• People should benefit from the collection of location data, so we only make our location technology available when there is a clear and legitimate use-case for location data. Privacy by DesignAll of our products, services, applications, processes, and procedures are designed and built with privacy in mind. Our Privacy Team closely partners with our Product and Engineering teams to ensure that our products are embedded with privacy-protecting featuresProtecting sensitive placesWe are committed to protecting against potential harms that may result from the abuse of location data, particularly around sensitive locations. In accordance with our long-standing internal policies, as well as our commitments under NAI’s Precise Location Information Solution Provider Voluntary Enhanced Standards, we maintain an inventory of sensitive location categories to ensure additional protections are in place to prevent the misuse of data associated with locations such as: • Places of worship;• Places primarily intended to be occupied by children; • Medical facilities catering to sensitive conditions (including women’s reproductive health clinics);• Domestic abuse shelters;• Military bases, and• Many other types of sensitive locations.Call for AccountabilityWe are leading the call to action for accountability in our industry. Location technology can be a tool to serve the greater good, but regulation is needed to raise the bar. We are a vocal advocate for comprehensive federal privacy legislation to protect consumers from unethical, unfair, or opaque practices. Your privacy choicesFoursquare knows that you take your privacy seriously. We do, too. We seek to be transparent about our data practices and give you control over your personal data. Exercising your privacy rightsFoursquare has established processes for you to exercise your privacy rights. You may have the right to (1) access/view your personal data, (2) copy/transfer your personal data, (3) correct/update your personal data, and (4) delete your personal data.In addition, you may have the right to (1) opt out of the sale of your personal data, (2) opt out of the sharing of your personal data for cross-context behavioral advertising purposes, (3) opt out of the processing of your personal data for targeted advertising, and (4) limit the use and disclosure of your sensitive personal data.Detailed instructions on the steps you can take are provided below. View your personal data City GuideLog into the Foursquare City Guide app and click on the History tab to view your location history.SwarmLog into the Swarm app and view your location history on the home screen.Developer AccountLog into your Developer account and go to My Account. Request copies of your personal data City GuideLog into Foursquare Settings > Request Copy of My Data.SwarmLog into Foursquare Settings > Privacy Settings > Initiate Data Download Request.Developer AccountLog into Foursquare Settings > Privacy Settings > “Initiate Data Download Request”. To help protect your privacy and maintain security, you must be able to login to your City Guide or Swarm account in order to receive copies of your data. If you are unable to login to your City Guide or Swam account, please follow the steps to reset your password as outlined in our Support Center. In the event you signed up for City Guide or Swarm using an email address you no longer have access to, you will need to contact your email service provider to recover your email account. Correct/Update your personal data City GuideLog into the Foursquare City Guide app and go to Settings > Edit profile.SwarmLog into the Swarm app and go to Settings > Edit profile.Developer AccountLog into your Developer account and go to My Account. Delete your personal data City GuideLog into Foursquare Settings > “Delete My Account”.SwarmLog into Foursquare Settings > “Delete My Account”.Developer AccountLog into Foursquare Settings > Privacy Settings > “Delete your account”. Opt Out of Sale/Sharing Of Your Data or Limit Use of Your Sensitive Data If you would like to opt out of the sale/sharing of your personal data or would like to limit the user of your sensitive personal data, you can submit your request on Foursquare’s Opt-Out Page. To fulfill your request, you must provide us with a Mobile Advertising Identifier, which can be located as follows: iOS Advertising Identifier (“IDFA”). If you use an iOS operating system, a third-party application is required to locate your Apple IDFA. We do not control such third-party tools and are not responsible for their content, privacy policies, or use of your personal information. Android Advertising Identifier. If you use an Android operating system, open the Google Settings app on your Android device and select “Ads.” Your Advertising Identifier should be listed at the bottom of the screen. If you choose to limit the use of your sensitive personal data, your location data will not be sold or shared. Opt out of internet-based advertising Desktop or Mobile Web Browser (US only). You may opt out of seeing interest-based ads from us or our third party advertising partners on your desktop browser and/or mobile web browser by visiting the Digital Advertising Alliance’s (“DAA”) AdChoices or by visiting the Network Advertising Initiative’s (“NAI”) Consumer Opt-Out Choices. Connected TVs (US only). You may also opt out of seeing interest-based ads on TV streaming devices and connected TVs by visiting the NAI’s Internet Connected TV Choices. Mobile Apps (US only). You may opt out of seeing mobile app interest-based ads and ad delivery/reporting by downloading the DAA’s AppChoices mobile application, which is available here: – DAA AppChoices iOS– DAA AppChoices Android– DAA AppChoices Amazon You can learn more about how opting-out of interest-based advertising works by visiting our Cookies & Similar Technologies Policy. Unsubscribe from Marketing Emails & Text Messages Email. You can unsubscribe from marketing or promotional emails at any time by logging into your Foursquare account adjusting your preferences in Settings. You may also unsubscribe from marketing emails by following the instructions in the email. Please note that you cannot unsubscribe from updates regarding service terms or legal notices. Text (SMS). If you have elected to receive SMS messages, you can always unsubscribe at any time by texting STOP in response to a message or by following the instructions in the SMS iOS Advertising Identifier (“IDFA”). Other Ways to Exercise Your Privacy Rights If you would like to delete your data and are unable to login to your City Guide or Swarm account, you may submit a request to delete your personal data via our Privacy Portal. To help protect your privacy and maintain security, we will take steps to verify your identity before taking action on your request . We will not use the data you provide as part of your deletion request for any purpose other than to fulfill your request. In the United States, you can exercise your privacy rights by calling us toll-free at (800) 673-0117. Authorized Agents Requests from authorized agents can be submitted using this form. Please include a notarized power of attorney and/or other signed permission that authorizes you to act on behalf of the individual you are representing. Requests from agents that do not submit sufficient proof that they have been authorized to act on behalf of an individual will be denied. Privacy Rights Reporting The following metrics reflect all privacy requests received from consumers worldwide between January 1 and December 31, 2023. Privacy Rights Reporting (Global)Requests for deletionReceived: 104,819Completed in whole or in part: 104,767Denied*: 52Average days to complete:21 Requests for accessReceived: 19,488Completed in whole or in part:19,451Denied*: 37Average days to complete:8Requests to opt-outReceived:1,197,964Completed in whole or in part:1,197,964Denied*:0Average days to complete:14 *Requests are denied because a request was not verifiable or FSQ was unable to locate an account and/or data related to the consumer who made the request. Digital Services Act ReportingFoursquare has approximately 42,817 monthly average EU users. This number is the best available information at the time of publication and will be updated from time to time. Appeal:You may appeal our decision with respect to a request you have submitted using this form. Our privacy policiesFoursquare’s privacy policies explain how Foursquare collects, uses and shares personal data. Consumer apps & websiteView moreUS State consumer privacy notice View moreDeveloper tools & enterprise productsView moreApplicant privacy policyView moreConsumer health data privacy noticeView more Cookies & similar technologiesCookies are small pieces of data that are stored on your computer, mobile phone, or other devices. They are generally used to remember you and your preferences for one visit (through a “session cookie”) or multiple visits (using a “persistent cookie”). Last Updated: April 05, 2024 About cookies This Cookie Policy should be read in connection with our privacy policy and our terms of use. The cookies that we set are known as “first party cookies.” Cookies set by third parties, such as companies who serve content, provide advertising or perform analytics are known as “third party cookies.” You can learn more about cookies at all about cookies. Both websites and HTML emails may also contain other tracking technologies such as web beacons or pixels. Web beacons and pixels are small blocks of code on web pages and in emails that enable us to perform analytics, and are often used in connection with cookies. However, web beacons and pixels are not stored in the same ways as cookies. As a result, if you disable cookies, web beacons may still load, but their functionality will be restricted. Learn more about why Foursquare uses cookies and similar technologies in the following sections. Strictly necessary cookies These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in, or filling in forms. You can set your browser to block or alert you about these cookies, but some parts may not function properly. These cookies do not store any personally identifiable information. Performance & analytics cookies These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site. They help us to know which pages are the most and least popular and see how visitors move around the site. All information these cookies collect is aggregated and cannot be used to identify you. If you do not allow these cookies we will not know when you have visited our site, and will not be able to monitor its performance. Targeting cookies These cookies may be set through our site by our advertising partners. They may be used by those companies to build a profile of your interests and show you relevant adverts on other sites. These cookies are based on uniquely identifying your browser and internet device. If you do not allow these cookies, you will experience less targeted advertising. Social media cookies These cookies are set by a range of social media services that we have added to the site to enable you to share our content with your friends and networks. They are capable of tracking your browser across other sites and building up a profile of your interests. This may impact the content and messages you see on other websites you visit. If you do not allow these cookies you may not be able to use or see these sharing tools. Functional cookies These cookies enable the website to provide enhanced functionality and personalisation. They may be set by us or by third party providers whose services we have added to our pages. If you do not allow these cookies then some or all of these services may not function properly. Can cookies be turned off? Most web browsers have an option to customize your cookie settings. For example, you can adjust your permission settings to block all cookies or only third party cookies. Please be aware that limiting the ability of websites to set cookies may worsen your overall user experience, and in some cases the services will not work properly without cookies, local storage, and similar technologies. Some web browsers incorporate “do not track” features. Currently, no industry standard exists for handling “do not track” requests, therefore at this time, we do not honor “do not track” browser signals. Limited internet-based advertising To opt out of seeing interest-based ads from us or our third party advertising partners on various platforms, please follow these instructions: Desktop or Mobile Web Browser (US only). You may opt out of seeing interest-based ads from us or our third party advertising partners on your desktop browser and/or mobile web browser by visiting the Digital Advertising Alliance’s (“DAA”) AdChoices or by visiting the Network Advertising Initiative’s (“NAI”) Consumer Opt-Out Choices. Connected TVs (US only). You may also opt out of seeing interest-based ads on TV streaming devices and connected TVs by visiting the NAI’s Internet Connected TV Choices. Mobile Apps (US only). You may opt out of seeing mobile app interest-based ads and ad delivery/reporting by downloading the DAA’s AppChoices mobile application, which is available here: – DAA AppChoices iOS– DAA AppChoices Android– DAA AppChoices Amazon When you opt out on a particular device, we will stop using and transferring data from that device for purposes of interest-based advertising on, and ad delivery/reporting to, other linked devices. Additionally, we will also stop using data coming from other linked devices for interest-based advertising on, and ad delivery/reporting to, the device from which the choice was exercised. If you use more than one device, you should opt "
