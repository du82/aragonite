description = "Use Foursquare's geospatial APIs and SDKs to add location-based recommendations and functionality to your apps, products and solutions."
full_description = "Developers DevelopersBuild better app experiences with leading geospatial APIs and SDKs Scalable and privacy-compliant location-aware experiences for your customers. Receive $200 in credits when you sign up. Get started for freeRead the docs Use CasesSDKsAPIsGuides & TutorialsCommunity Built to meet your needs Retail rewards appsGuide active deal seekers that want to optimize their budget and discover new products.The Movement SDK helps to deliver rewards at the right place and right time. Increase and audit data quality for your marketing and competitive analytics offerings too.Enhance your retail rewards app by leveraging Places API for seamless user check-ins, ensuring accurate visit verification and increased customer engagement.Travel tracking & recommendation appsHelp travelers easily map out and follow their itineraries and share stories about their travel experiences.Places API helps with precise location searches, seamless geotagging and check-ins, and efficient trip planning, ensuring a more intuitive and enriched travel experience for your end-users.Use our Movement SDK for snap-to-place place identification, integrations for taxi coordination, and more.Ride-hailing appsEmpower end-users seeking efficient, safe, and seamless travel experience.Movement SDK ensures precise pick-ups and drop-off with real-time location tracking, ensuring ride accuracy and efficiency.Use Places API to offer end-users quick and intuitive location searches, accurate address data, and effortless ride check-ins, delivering an unmated ride experience every time. Developer toolsOur suite of SDKs & APIs SDKs Leverage our SDKs to not only engage app users by delivering context-aware content in real-time, but also visualize and analyze geospatial data on a planetary scale. #doc-cards-90467143-50fe-4fb9-94c5-78d9dfdf6360 .doc-cards__box .doc-cards__tags li{background-color:#022b4f;color:#4250de;border-color:#022b4f;}#doc-cards-90467143-50fe-4fb9-94c5-78d9dfdf6360 .doc-cards__box .doc-cards__tags li:hover{background-color:#000000;color:#4250de;border-color:#000000;}Movement SDKEmbed foreground and background location awareness into your iOS and Android apps, and engage users with contextual content in real-time.AndroidiOSAllStudio Data SDKAllow your web applications to access geospatial assets, invoke analytics services and start pipeline tasks for bulk processing of geospatial data.Get startedData functionsAllStudio Map SDKDesigned for building custom geospatial web applications. Control, embed and customize Studio maps on web pages or Jupyter notebooks.Get startedMap functionsAll #hero-banner-a13a8b3a-611e-4a9c-b8a2-5ad139eb307d .btn-main.btn-one{background-color:#2ed7c1;color:#000025;border-color:#2ed7c1;}#hero-banner-a13a8b3a-611e-4a9c-b8a2-5ad139eb307d .btn-main.btn-one:hover{background-color:#00bea8;color:#000025;border-color:#2ed7c1;}#hero-banner-a13a8b3a-611e-4a9c-b8a2-5ad139eb307d .btn-main.btn-two{background-color:;color:#2ed7c1;border-color:#2ed7c1;}#hero-banner-a13a8b3a-611e-4a9c-b8a2-5ad139eb307d .btn-main.btn-two:hover{background-color:#2ed7c1;color:#000000;border-color:;} APIs Leverage our APIs to build location-driven features in your app or website. Drive user engagement and retention through access to millions of high-quality and accurate POIs available to you in real-time. Access global POI data and rich content from 100k+ trusted sources via our Places API for real-time venue search, discovery, and ranking. Explore Places APIRead docs #doc-cards-90467143-50fe-4fb9-94c5-78d9dfdf6360 .doc-cards__box .doc-cards__tags li{background-color:#f6f6f6;color:#000000;border-color:#f6f6f6;}#doc-cards-90467143-50fe-4fb9-94c5-78d9dfdf6360 .doc-cards__box .doc-cards__tags li:hover{background-color:#000000;color:#ffffff;border-color:#000000;}Search & DataReturns places based on user-submitted keywords. Matches against names, categories, tips, and tastes.Read docsGeotagging & Check-inProvide POI tagging that supports check-in based on where your end-user’s device is and what is around them.Read docsAutocompleteReturns a list of top addresses, places, geos, and/or searches partially matching the provided keyword and location inputs.Read docsAddress DataRetrieve details for any address including non-Places. Works only in conjunction with the Autocomplete endpoint.Read docs #feature_box_v4-650d7e2a-76ad-4df0-9e21-e37b03c0a22e .feature--v4__box .btn-main{background-color:;color:#2ed7c1;border-color:#2ed7c1;}#feature_box_v4-650d7e2a-76ad-4df0-9e21-e37b03c0a22e .feature--v4__box .btn-main:hover{background-color:#2ed7c1;color:#000025;border-color:#2ED9C3;}Getting started guidesSet up your FSQ developer consolePut the most trusted, independent location data and technology platform to work for your business.Learn moreGet started with the Places APINew to the Foursquare Places API? Not to worry, we’ve got you covered. In just a few simple steps, you’ll be up and running with your first API call in no time!Learn moreGet started with Foursquare StudioUsing Foursquare Studio, you can create powerful geospatial visualizations that you can share with the world.Learn more Developer toolsAPI demosView working web experiences leveraging our most popular API endpoints, including code samples.View demosGeospatial data catalogExplore a growing list of geospatial datasets provided by Foursquare Studio and our partners.View catalogAPI explorerView working code examples and make authenticated API requests with full responses.Explore APIStudio map communityInteract with a wide array of Studio Maps created by Studio engineers and other community members.Explore mapsAPI statusReal-time info on the uptime and status of the Foursquare Developer Console and our API endpoints.Check API statusStudio map playgroundExplore the Studio Map SDK in an interactive sandbox before implementing any code.Learn more Foursquare Developer Community Find solutions, share ideas and discuss all things geospatial through our dedicated community of developers on Discord and Slack. #speak-to-expert-v3-53023773-61ad-44ef-843b-b33dc489eaff .form-two-col.mktoForm .mktoFormRow .mktoLabel, #speak-to-expert-v3-53023773-61ad-44ef-843b-b33dc489eaff .form-two-col.mktoForm .mktoFormRow .mktoLabel .mktoAsterix{color:#ffffff;}#speak-to-expert-v3-53023773-61ad-44ef-843b-b33dc489eaff .form-two-col.mktoForm .mktoFormRow .mktoHtmlText, #speak-to-expert-v3-53023773-61ad-44ef-843b-b33dc489eaff .form-two-col.mktoForm .mktoCheckboxList label{color:#ffffff;}#speak-to-expert-v3-53023773-61ad-44ef-843b-b33dc489eaff::before{background-color:#4250de;}Get startedNew users receive $200 in free credits → Access the console #breadcrumbs {display:none;} body {background-color: #000025;} html { scroll-behavior: smooth !important; } .trim-bottom { padding-bottom: 16px !important; } .trim-top { padding-top: 16px !important; } .tighten-features { padding: 0 0 4rem 0 !important } .tighten-features .feature--v4_head { margin-bottom: 0; } .doc-cards { padding-top: 0px; } .reduce-padding-top { padding-top: 20px !important; } .revealscroll {transition: none !important;} .hero-banner:not(.align-center) .hero-banner__content:first-child:last-child { width: 100% !important; } .hero-banner { padding: 50px; } .feature--v4__box { border: solid 1px #2ed9c3 !important; } .feature-box-v2__body .feature-box-v2__boxes h4 { font-size: 18px; } @media (min-width: 768px) { .fq-navigation-menu__body .fq-navigation-menu__main .wp-block-navigation__container .wp-block-navigation-link a { letter-spacing: 0.04em; } .hero-banner-v2 .hero-banner-v2__content-wrap { width: 75%; } .title-raw.title-raw-anim-line { text-align: center; } .use-case-tab-with-accordion .scrollable-sec ul { max-height: none; overflow-y: display; } .use-case-tab-with-accordion .scrollable-sec ul:before { background: none; position: static; } .use-case-tab-with-accordion .scrollable-sec { position: static; } .feature-box-v2__body { padding: 50px 0px 70px; } .speak-to-expert-v3.align-cen