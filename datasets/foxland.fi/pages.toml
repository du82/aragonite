full_description = "Experiment &#8211; commercial theme for free May 2, 2014I’m not happy with my theme sales which are about 1400$ starting from early 2013. That covers pretty much the same as maintaining this site. Kultalusikka theme is leading the stats and have 15 downloads. It’s time for experiment. Themes and Plugin updates May 2, 2014Most of the themes and plugins have been updated and they now work better with WordPress version 3.9. Here is the most common things that was making some problems. Themes Widgets should now appear also in theme customizer. Some themes still don’t support this new feature but I’m working on updates. Some themes had some … DevPress.com is for sale April 6, 2014DevPress.com is for sale on Flippa auction. I hope all goes well for Tung Do and his wife. Plugin release: Webshare March 20, 2014I have always had difficulties to find fast and attractive social sharing plugins. I’ve tried Jetpack sharing module and Floating Social Bar just to name few. But there was always something missing. Then I visited VelocityPage blog and immediately saw that I wanted to have those kind of Social sharing options. Simple font icon with … Becoming a theme author in WordPress.com March 13, 2014I was offered 100 000$ and half of Automattic to become a premium theme author on WordPress.com. This was a one time deal. Take it or leave it. Hmmmm, let me think about it. Mina olen v1.0.2 released March 3, 2014Mina olen version 1.0.2 is now available. It has couple of changes. Better CSS for header image and callout link. Also couple of body class added. FitVids updated to version 1.1. In front page template portfolios and testimonials are shown as random by default. You can change this using filters. New theme release: Mina olen February 9, 2014I’m happy to announce my new theme Mina olen. I’m not sure am I just slow or into details but it took me several months to create this one. Some of the components are similar to Stargazer theme. They both use the most current HTML5 conventions and Schema.org microdata."
