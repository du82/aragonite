description = "I&#8217;ve been developing with Windows WSL2 system several months now, and I only have had couple of issues. One of them is that I&#8217;ve been forced to enter passphrase every time when I use SSH or pull from Git for example. So annoying. Keychain for rescue I tried all the tutorials that I could find &hellip;"
full_description = "Remember passphrase in WSL2 using keychain November 25, 2020 Written by Sami KeijonenI’ve been developing with Windows WSL2 system several months now, and I only have had couple of issues. One of them is that I’ve been forced to enter passphrase every time when I use SSH or pull from Git for example. So annoying.Keychain for rescueI tried all the tutorials that I could find but nothing seems to work. But Ubuntu keychain package worked for me!First, install keychaing in terminal:sudo apt install keychainSecond, add these lines in your ~/.bashrc file:/usr/bin/keychain --nogui ~/.ssh/id_rsa source $HOME/.keychain/$HOSTNAME-shIf the variable $HOSTNAME doesn’t work get your hostname with command:hostnameAnd replace $HOSTNAME with your computers hostname:/usr/bin/keychain --nogui ~/.ssh/id_rsasource $HOME/.keychain/YOUR-HOSTNAME-shWith this I now only have to enter passphrase only once when I open my laptop or reboot. Much better and I’m totally OK to enter it once a day.Note that I’m not trying to share SSH key between Windows and WSL2. At the moment I only develop inside WSL2.Categories:Code SnippetTags:WSL2"
year_published = 2020
