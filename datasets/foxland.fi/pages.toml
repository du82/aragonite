full_description = "Guest Post: Why Accessibility Matters December 3, 2017I wrote an article in Envato Tuts+ site, it’s called Building an Inclusive Web: Why Accessibility Matters. In that article I share my ideas form empathy to accessibility laws. It all boils down to quote from Andrea Fercia. Would you build a bridge that only a specific type of car can use? In the article … Gutenberg Discussion in WordPress Helsinki Meetup October 27, 2017We had vivid conversation about Gutenberg in WordPress Helsinki Meetup. I was hosting the meetup and shared my opinions about Gutenberg. We also got our hands dirty and tested Gutenberg. In short people were worried about the Gutenberg. It’s such a huge change. Here are my slides about Gutenberg Meetup: Gutenberg Slides in Google Sheets. … WordPress speaks with wp.a11y.speak October 8, 2017I know I’m really late in the game but WordPress can speak! And has been speaking since version 4.2. Lately I’ve been learning more Javascript and needed this feature in one project. In this article I’ll try to explain simplified version how WordPress speaks with wp.a11y.speak() JavaScript method. Usually we have spinner or animation to indicate … Elmastudio: Beautiful and Creative Themes May 21, 2017This interview with Elmastudio was long time coming. But it was worth to wait. I have followed their work for years and they build very attractive and creative WordPress themes. This is part of the WordPress theme shops interview series. I hope you have some time to read Elmastudio’s story, who they are, and what … Checathlon 1.2.0 and Checathlon Plus 1.1.2 April 30, 2017Checathlon theme have been updated to version 1.2.0 and Checathlon Plus Plugin to version 1.1.2. Most of the updates was made while I was building custom child theme for Checathlon. Checathlon updates: Add better support for Subtitles plugin. Check Team Page Template how it looks. Or Pricing Page Template. Or testimonials. Add Polylang support for … Speaking at WordCamp London 2017 March 21, 2017What can I say. WordCamp London 2017 was amazing. It was well organised and atmosphere was relaxed. The coolest part was meeting people as always. You know the feeling when you meet people which you have been chatting in Twitter or Slack. I was privileged to be in Theme Panel and have a lightning talk …"
