title = "Top 10 songs: 2020 edition - Foxland"
description = "I don&#8217;t do lists. Not shopping lists, to-do lists. I do not do lists. But here I am listing top 10 songs of all time! And oh boy it&#8217;s hard, almost impossible. I could name 10000 songs. I still want to give it a shot because music is so crucial part of my life. Let&#8217;s &hellip;"
full_description = "Top 10 songs: 2020 edition November 16, 2020 Written by Sami KeijonenI don’t do lists. Not shopping lists, to-do lists. I do not do lists. But here I am listing top 10 songs of all time! And oh boy it’s hard, almost impossible. I could name 10000 songs.I still want to give it a shot because music is so crucial part of my life. Let’s get this show on the road!Spotify list1. Let There Be Rock – AC/DCFirst I need to define rock and roll. And Let There Be Rock by AC/DC is the one for me. I have seen many live shows but I wish I’ve been in Paris 1979. Pure, energetic, raw rock and roll!2. Nutshell – Alice In ChainsThere are many magical moments on MTV unplugged shows. Nutshell by Alice In Chains brings all that magic together. Layne Staley’s lyrics and voice is so powerful, I can listen this song over and over and over again. And the band is in perfect harmony.3. Satu Peikoista – KotiteollisuusFinnish song in the middle. Satu Peikoista by Kotiteollisuus is one of those songs we have so many memories. It represents friendship, emotions, power of music.If you’re interested the song name is “Fairy tale about goblins” and album title “the name of the dead flower”.4. Luonas kai olla saan – Juice LeskinenEspecially the version of this song from film called Saimaa-ilmiö. It’s kind of our national version of The Blues Brothers in a way.Juice Leskinen lyrics in general defines how we can play around with our mother language in ingenious ways.5. Deutschland – RammsteinWell, Deutschland by Rammstein is just badass video and song! Great memories from live shows also.6. Killing in the Name – Rage Against The MachineKilling in the Name blew my mind in 1995. We went to local bar with C-cassette and insisted to play full album. Something flipped inside my body that night.7. Leipää, lempee, lämpöö – Herra YlppöI’m not sure does other countries have TV shows where artists get together and perform each other songs in small room. Leipää, lempee ja lämpöö is one of those songs.Perfect lyrics, “this song will make you cry” performance.8. Comfortably Numb – Pink FloydWhat can I say. One of the classics. I can listen Comfortably Numb and this guitar solo every day.9. Normaali? – HuoraSome refreshing punk rock is always needed! Let me present Normaali? by Huora.10. Comforting Sounds – MewLet’s end with Comforting Sounds by Mew. I first heard them 2002 when they were warming up Manics Street Preachers. That’s a show we’ll never forget.Categories:WordsTags:FunMusic"
year_published = 2020
