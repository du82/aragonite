full_description = "Maybe next year will be better than 2013 January 1, 2014Let’s be honest here. My site title says it all: No, not another WordPress Themes shop. I got $877.10 from this site in the year of 2013. At least $200 of that was testing purposes. Am I disappointed? Goes without saying that I am. Paytrail Payment Gateway demo for Easy Digital Downloads November 24, 2013I’ve been building Paytrail Payment Gateway add-on plugin for Easy Digital Downloads. It’s been fun and another step that I want to take on my WordPress trip. I don’t go into all details just yet but there are couple of things what I’d like to say. wp-translations.org for WordPress developers and translators October 15, 2013Is your theme or plugin translations up to date? Would you want your theme or plugin translated to a several languages? Have you translated a theme or plugin and found out that the guy next door is doing the same thing in the same time? Do you feel like it would be easier to translate … What, there are no new themes! October 9, 2013Well, yes and no. There are no new themes in Foxnet Themes site but I’ve been working some really cool custom themes for clients really hard. I let you know when sites are up and running. I got plenty of ideas for new public themes, just need some time to put them in action. I … I&#8217;m speechless, I&#8217;m without speech September 7, 2013When you wake up in Saturday morning and receive this kind of twitter status you’re literally speechless. I know I was, still am, always will be. I’m without speech. I hope everyone recognizes that @samikeijonen is one of the best WordPress theme developers in the world. – Craig MacMillan Curriculum of WordPress School August 23, 2013I wrote in WP Daily about WordPress Curriculum and now that they have closed they site I feel like I should back up my writing here. I know that original post is now re-directed in torquemag but I don’t feel that comfortable about it. So here is the orginal article. Keeping your shit secure August 14, 2013Mike Jolley wrote some good tips for secure code. Go check it out."
