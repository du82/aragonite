full_description = "Retirement of Themes October 22, 2015I still remember that feeling when I got my first theme called Live Wire on WordPress.org. It was B.R.I.L.L.I.A.N.T. I can say the same for Path theme also. But there are times when you need to focus on something new and let go of the old. There is absolutely nothing wrong (well, some issues) with … Kuorinka Theme and Kuorinka Plus Plugin updated September 21, 2015Kuorinka Theme and it’s add-on Kuorinka Plus Plugin have major updates. I’ve tested them both as much as I can on live sites also. But there could be some issues that I missed. Note that Kuorinka Plus Plugin works only in WordPress 4.3+ version. For example Logo upload in Kuorinka Plus Plugin have big update … Mina Olen Theme updated to version 1.2.0 September 21, 2015Mina Olen WordPress theme had a huge update. The major update was updating Hybrid Core to version 3.0.0. Actually at the moment this is my only theme that uses Hybrid Core, my other themes uses just parts of it. Version 1.2.0 – September 21, 2015 Update Hybrid Core to version 3.0.0. Update using Core functions the_archive_title() and get_the_archive_description() … Content Restriction and EDD Members working together September 17, 2015Did you know that you can set membership site also using Easy Digital Downloads. It’s the best plugin for selling digital products. There are at least three add-on plugins that can help you with Membership sites. Recurring Payment Content Restriction EDD Members I’ll give you short example how Content Restriction and EDD Members works together. … Toivo updated to version 1.1.0 September 10, 2015There is one new feature in Toivo theme version 1.1.0 and couple small tweaks. I added setting in the Customizer for disabling multi-level dropdown menu for narrow screens. You can find it under Theme Settings >> Nagivation Settings. This is pretty powerful feature and I’m testing my own fork of Responsive Nav here. For … Accessibility in WordPress Helsinki Meetup September 7, 2015In Tampere there have been active WordPress community and they have had their own WordPress Meetup several years. Now also Helsinki have our own Meetup group, everyone is more than welcome to join! We have very open atmosphere and we are definitely going to see lot’s of great topics. WordPress Helsinki Helsinki, FI 1,140 Members …"
