title = "Foxland products for free - Foxland"
description = "All my themes and plugins are now free. At the moment I feel that&#8217;s a permanent decision but you&#8217;ll never know. I want to thank all who have supported my journey. Either by purchasing, helping, or sharing ideas. I&#8217;ll do my best to answer some of the questions you might have. Why free? I don&#8217;t &hellip;"
full_description = "Foxland products for free August 3, 2018 Written by Sami KeijonenAll my themes and plugins are now free. At the moment I feel that’s a permanent decision but you’ll never know.I want to thank all who have supported my journey. Either by purchasing, helping, or sharing ideas. I’ll do my best to answer some of the questions you might have.Why free?I don’t have enough time to run a theme shop. I don’t have enough time to build new themes. I don’t have enough time to update old themes. You get the picture.I have done more and more client work in the last three years. And one month ago I started working in 10up as a front-end engineer. That’s keeping me busy.Also Foxland isn’t a gold mine. Foxland brings about 3000 to 4000 euros per year which is OK but my goal was 10 000 euros.I have cancelled all the subscriptionsI have cancelled all the subscriptions which was yearly recurring payment. I have done this because I don’t want to charge people who have purchased before. Once again, I can’t thank you enough of your support!You might get email that your subscription have been cancelled.What about support?Support time for every purchase has been one year. You can still have support if it has been less than year from your purchase. After that I probably advice users to ask questions via email or WordPress.org support forums.What if I just purchased?If you have purchased less than 30 days ago send me a message, and I’ll refund your purchase.What happens to Foxland?Foxland is not closing doors! I have plans to update existing themes when they need updates. I have never actually build lot’s of new features for old themes, and I’m not planning to start now.I will maintain most of the old themes and plugins, small updates are coming at some point. But I need to decide are there some themes and plugins which I deprecate. I haven’t decided yet.I also have plans to create new free themes which have Gutenberg support and a lot more modern code behind the scenes. More on that later on.Question?Let me know if you have any questions or concerns. You can use comment form or send me a message. Cheers!Categories:NewsTags:themesWordPress Themes"
year_published = 2018
clearnet = "https://foxland.fi/foxland-products-for-free"
