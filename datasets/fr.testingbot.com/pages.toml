title = "Sécurité de niveau entreprise - TestingBot"
description = "Sécurité de niveau entreprise pour les tests Selenium basés sur le cloud."
full_description = "Pour chaque test que vous exécutez, nous créons une nouvelle machine virtuelle (VM) avec la plate-forme / le navigateur / l'appareil que vous souhaitez tester. Chaque test s'exécute sur une machine vierge, fraîchement amorcée. Tout ce que fait votre test sur la VM est écrit sur un disque RAM (mémoire) via COW (Copy-On-Write). À la fin de votre test, après avoir recueilli les captures d'écran, les journaux et la vidéo du test, nous demandons à notre hyperviseur d'effacer complètement le disque RAM et la machine virtuelle. Chaque test s'exécute de lui-même, pare-feu, VM. TestingBot assure que vous seul pouvez accéder à la VM, tout autre trafic est bloqué en appliquant un pare-feu pour chaque VM que vous exécutez. Les machines virtuelles peuvent uniquement accéder à Internet public. Ou, si vous utilisez un tunnel TestingBot, le contenu de votre ordinateur / réseau. Par défaut, nous prenons des captures d'écran et une vidéo de votre test, ainsi que la journalisation de différents composants (journaux Selenium, journaux de pilotes Chrome, journaux de pilotes Firefox, journaux de consoles, ...) Ces actifs sont téléchargés sur nos serveurs d'actifs via SSL. L'accès à ces ressources est restreint: nous créons une URL signée pour chaque ressource. Chaque ressource est uniquement accessible via SSL pendant 30 minutes. Vous pouvez également désactiver la journalisation, la capture d'écran et l'enregistrement vidéo. De cette façon, nous ne pourrons rien enregistrer pendant votre test. Ajoutez des collègues à votre équipe et appliquez des stratégies utilisateur en tant que propriétaire de compte, telles que: En tant que propriétaire ou administrateur, vous pouvez répartir le nombre de tests parallèles que votre abonnement est autorisé à exécuter entre les membres de votre équipe. Vous pouvez voir un aperçu de l'activité de tout utilisateur (tests, connexions, ...) et ajouter / supprimer des utilisateurs à votre équipe."
year_published = 2025
clearnet = "https://fr.testingbot.com/security"
