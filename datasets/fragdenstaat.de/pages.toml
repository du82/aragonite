["https://fragdenstaat.de/aktionen/klima-helpdesk"]
title = "Klima-Helpdesk – FragDenStaat"
description = "FragDenStaat Klima-Helpdesk: Umweltinformationen von staatlichen Stellen befreien"
full_description = "Kein Thema ist drängender als die Klimakrise. Daher haben wir den Klima-Helpdesk gestartet. Er beinhaltet alles, was Sie von FragDenStaat kennen, nur mit extra Service, Hilfe und Beratung! Ob Feinstaubgutachten, Klimaschutzplan oder umweltpolitisches Lobby-Treffen: Unser Klima-Helpdesk ist für Sie da, wenn Sie Informationen von Behörden aus den Bereichen Umwelt und Klima benötigen. Dafür teilen wir unsere Technik und Erfahrung, unser Netzwerk sowie unser juristisches Know-How. Video ansehen Mit dem Umweltinformationsgesetz Klimadokumente befreien Die Grundlage für umweltbezogene Anfragen ist das Umweltinformationsgesetz (UIG). Es gibt allen das Recht, Umweltinfos von staatlichen Stellen zu erhalten. Unser Klima-Helpdesk hilft dabei, dieses Recht auf Informationen wahrzunehmen. Jetzt eigene Umweltanfrage stellen! Drehen Sie jetzt an der UIG-Slot-Maschine. Sie zeigt, welche Dokumente angefragt werden können: ​​ Für wen ist der Klima-Helpdesk? Für Klima-NGOs und Initiativen Kampagnen, Studien oder politische Forderungen werden durch umweltrelevante Dokumente untermauert. Für Journalist:innen Artikel und investigative Recherchen können auf befreite Dokumente gestützt werden. Für alle Jede:r kann Umweltinformationen nach dem UIG anfragen, z. B. aus der eigenen Region. Der Klima-Helpdesk: Unser Angebot Hilfe beim Antrag Wir helfen, Anfragen zu stellen, Dokumente zu definieren und die richtige Behörde zu finden Juristische Hilfe Wir können u. a. bei Anfragen, Widersprüchen sowie Fragen zu Urheberrecht oder Datenschutz helfen. Veröffentlichung Anfragen und Antworten werden auf FragDenStaat veröffentlicht. Bei relevanten Erkenntnissen helfen wir mit Presseansprache. Vernetzung Wir vernetzen Akteur:innen, um auf Erfahrungen anderer zurückgreifen zu können. Jetzt Kontakt aufnehmen! Aktuelle Umweltanfragen UIG-Anfragen, die User:innen auf FragDenStaat kürzlich gestellt haben EKF bzw. KTF-Berichte Bundesministerium der Finanzen – Bund Anfrage teilweise erfolgreich, 1 Monat her Ordnungsamt - Bußgelder zur Ahndung von Ordnungswidrigkeiten im Bereich des Umweltschutzes Kommunalverwaltung Herzogenrath – Nordrhein-Westfalen Anfrage erfolgreich, 2 Monate, 3 Wochen her Hinweise der Bayerischen Staatsregierung zur StVG- und StVO-Reform Landratsamt Neustadt a.d.Aisch-Bad Windsheim – Bayern Antwort verspätet, 3 Monate her Hinweise der Bayerischen Staatsregierung zur StVG- und StVO-Reform Bayerisches Staatsministerium für Wohnen, Bau und Verkehr – Bayern Antwort verspätet, 4 Monate, 1 Woche her Weiterführende Informationen Anfrage-Ideen: Feinstaub- oder Lärmbelastung in einem Kiez Dokumente in Bezug auf z. B. Inbetriebnahme eines neuen Kohlekraftwerks Planungsdokumente z. B. bzgl. der Verkehrsinfrastruktur meiner Kommune Gutachten zu Auswirkungen auf Fauna und Flora durch ein Bauvorhaben Gutachten Diesel-Manipulationen Klimaschutzpläne in Städten Protokolle von Umweltgremien in Verwaltungen Energieausweise von u. a. Schulen Umweltverträglichkeitsprüfungen Sanierungspläne Wirtschaftlichkeitsuntersuchungen Autobahn-Planungen Emissionsmessungen, z. B. in Städten oder bei Fabriken Häufig gestellte Fragen ​ Informationsblatt herunterladen Kontakt zu Philipp Sie möchten eine UIG-Anfrage stellen und haben vorher eine Frage? Oder Sie haben eine Kampagnenidee, die auf UIG-Anfragen basieren könnte und möchten sich austauschen? Schicken Sie einfach eine Mail an Philipp Schönberger. philipp.schoenberger.fm@fragdenstaat.de Ihr Browser unterstützt diese Video-Format nicht."
year_published = 2025
