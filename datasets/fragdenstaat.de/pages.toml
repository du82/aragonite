title = "Bilanz der Ampel-Regierung: Kaum Fortschritt von der Fortschrittskoalition"
description = "Mit unserem Koalitionstracker haben wir drei Jahre lang die angekündigten Pläne der Ampel-Koalition überwacht. Die abschließende Auswertung zeigt: Nur jedes vierte Vorhaben wurde umgesetzt.&nbsp;"
full_description = "Bilanz der Ampel-RegierungKaum Fortschritt von der FortschrittskoalitionMit unserem Koalitionstracker haben wir drei Jahre lang die angekündigten Pläne der Ampel-Koalition überwacht. Die abschließende Auswertung zeigt: Nur jedes vierte Vorhaben wurde umgesetzt. von Arne Semsrott – 28. Januar 2025 Bluesky Mastodon Auf Mastodon teilenBitte geben Sie die Domain Ihrer Mastodon-Instanz ein.https:// Share! Kurzlink kopieren Teilen… Kohleausstieg vorziehen, Mindestlohn erhöhen, neue Wohnungen bauen – die Ampel-Parteien hatten sich im November 2021 viel vorgenommen. Wir haben damals den Koalitionsvertrag auseinandergenommen und 271 messbare Vorhaben identifiziert. Gemeinsam mit mehr als 20 zivilgesellschaftlichen Partnerorganisationen haben wir mitverfolgt, ob und wie die Regierung diese Themen umsetzt. Das Ergebnis: Geliefert hat die Ampel kaum etwas.Insbesondere in progressiven Themenbereichen – Demokratie, Digitalisierung, Kultur, Sozialstaat – lieferte die Fortschrittskoalition keinen sichtbaren Fortschritt. Nur 73 von 271 Vorhaben aus dem Koalitionsvertrag setzte sie tatsächlich um. Das ist nur wenig mehr als ein Viertel der ursprünglich ankündigten Vorhaben. 35 weitere Ankündigungen wurden nur teilweise umgesetzt. Ein Drittel der Vorhaben wurde gar nicht erst begonnen oder zurückgestellt. Die verschiedenen Themenfelder unterscheiden sich deutlich in der Umsetzung. Im Bereich Digitales wurde kein Projekt vollständig umgesetzt. Mit 12 von 18 Vorhaben wurde lediglich begonnen. Darunter fällt beispielsweise ein Gesetz gegen Digitale Gewalt oder die Digitalisierung im Bildungswesen. Teilweise umgesetzt wurde in dieser Kategorie nur der Breitbandausbau, also die flächendeckende Versorgung mit Glasfaserkabeln. Ähnlich schlecht ist die Bilanz für den Bereich Familie. Hier wurde nur ein einziges Vorhaben umgesetzt: der Sofortzuschlag für Kinder. Mit versprochenen Reformen im Bereich Elterngeld, Sorgerecht und Familienrecht wurde lediglich begonnen. In der Kategorie Bildung und Wissenschaft ist als einziges die Reform des BAföG umgesetzt worden. Angesichts dessen sticht der Bereich Wohnen und Bauen vergleichsweise positiv hervor. Dort wurde imerhin fast die Hälfte der Vorhaben umgesetzt. Darunter fällt unter anderem der einmalige Heizkostenzuschuss und die Stärkung des Wohngeldes. Mit der Bekämpfung illegaler Immobilienfinanzierung wurde lediglich begonnen. → Hier geht es zum KoalitionstrackerDranbleibenAbonnieren Sie unseren Newsletter um keine Recherche mehr zu verpassen!Bitte geben Sie hier nichts einE-MailAbonnierenArtikel teilen Bluesky Mastodon Auf Mastodon teilenBitte geben Sie die Domain Ihrer Mastodon-Instanz ein.https:// Share! Kurzlink kopieren Teilen… Über den:die Autor:in Arne SemsrottArne ist Journalist und Chefredakteur von FragDenStaat. E-Mail: arne.semsrott@okfn.de (PGP-Verschlüsselung)Verschlüsselter Kontakt über SignalInstagram: arne.semsrott Mastodon: @arnesemsrott Bluesky: arnesemsrott Schlagwörter: #Koalitionstracker 23. Januar 2025 Kriegsopferrenten:Steuergeld für NS-KollaborateureWährend etliche Holocaustüberlebende keinerlei Entschädigung bekamen, zahlt Deutschland bis heute SS-Angehörigen, Wehrmachtssoldaten und NS-Kollaborateuren in ganz Europa zusätzliche Renten."
year_published = 2025
year_updated = 2025
