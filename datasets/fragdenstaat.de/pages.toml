description = "Fragen Sie Dokumente und Akten von mehr als 40.000 Behörden kostenlos an. Das Informationsfreiheitsgesetz (IFG) gibt Ihnen Zugang zu staatlichen Informationen."
full_description = "27. Februar 2025 Beraterberichte-Datenbank:Wie Berater*innen vom Staat Hunderte Millionen Euro kassierenVerschleiern, Verschwenden, Klüngeln: Die Berater*innen-Deals der Bundesregierung haben schon für zahlreiche Skandale gesorgt. Es fehlt Kontrolle. Bis jetzt. Wir veröffentlichen erstmals die bislang geheimen Beraterberichte. 12. Februar 2025 Abschiebepolitik:Ein fragwürdiges AngebotDas Bundesamt für Migration und Flüchtlinge (BAMF) schickt Briefe an Asylsuchende, um sie zur freiwilligen Ausreise nach Griechenland zu bewegen. Es wird suggeriert, dass sich die Situation für Geflüchtete verbessert habe – ohne Garantien. 5. Februar 2025 Bundespolizeiakademie:Professor mit rechter Vergangenheit unterrichtet wiederNachdem seine rechte Vergangenheit aufgedeckt wurde, sollte ein umstrittener Dozent nicht länger Bundespolizist*innen ausbilden. Nun ist er überraschend wieder zurück in der Lehre. Das sorgt für Unruhe an der Polizeihochschule. 28. Januar 2025 Bilanz der Ampel-Regierung:Kaum Fortschritt von der FortschrittskoalitionMit unserem Koalitionstracker haben wir drei Jahre lang die angekündigten Pläne der Ampel-Koalition überwacht. Die abschließende Auswertung zeigt: Nur jedes vierte Vorhaben wurde umgesetzt. 7. November 2024 Bundesverwaltungsgericht schafft Klarheit:Auch Online-Medien haben PresserechteBisher war umstritten, ob auch Online-Medien vom Presserecht gedeckt sind. Das Bundesverwaltungsgericht urteilte nach unserer Klage: Es darf keinen Unterschied zu Printmedien geben. 4. November 2024 „Pegasus“:BND-Spionagesoftware vor GerichtNutzen deutsche Geheimdienste eine umstrittene Spionage-Software, mit denen auch Journalist*innen gehackt werden? Und müssen sie dazu detailliert Auskunft geben? Am Donnerstag verhandelt das Bundesverwaltungsgericht unsere Grundsatzklage. 18. Oktober 2024 Paragraph 353d:Arne Semsrott lässt sich für die Pressefreiheit verurteilenFragDenStaat-Chefredakteur Arne Semsrott ist heute verurteilt worden, weil er amtliche Dokumente aus einem laufenden Strafverfahren veröffentlicht hat. Wir nehmen das nicht hin – und ziehen notfalls vors Bundesverfassungsgericht."
