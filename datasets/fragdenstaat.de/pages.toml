title = """
Jede Klage Zählt!
\t\t\t\t\t|
\t\t\t\t\t\t\t\tGegenRechtsSchutz"""
description = "Autoritäre missbrauchen den Rechtsstaat und bedrängen mit rechtswidrigen Maßnahmen die Zivilgesellschaft. Mit Ihrer Hilfe geht der Gegenrechtsschutz dagegen vor."
full_description = "Jede Klage Zählt! Rechtsmissbrauch hat viele Gesichter. Dem geflüchteten Kind wird ein Kindergartenplatz verwehrt. Eine linke Journalistin wird wegen Verleumdung verklagt. Das Kulturzentrum wird geschlossen. Die Behörde verbietet die antifaschistische Demo. All das kann rechtswidrig und missbräuchlich sein. Es ist wichtig, dies auch juristisch zu überprüfen. Ein schlechtes Bauchgefühl reicht. Denn: Jeder Einzelfall zählt! Der Gegenrechtsschutz unterstützt Sie dabei, sich zur Wehr zu setzen. Wir unterstützen Sie, vermitteln anwaltliche Hilfe und übernehmen die rechtlichen Kosten. Betroffen? Jetzt Kontakt aufnehmen! ​​ PGP ​​ Förderrichtlinien Was macht der Gegenrechtsschutz? Spenden: Unterstützen Sie den Gegenrechtsschutz “Es hat eine hohe Bedeutung, dass es gesellschaftliche Strukturen gibt, die das unterstützen. Man merkt, man ist nicht alleine.” (Thomas Meyer-Ross über den Gegenrechtsschutz in der Sächsischen Zeitung 25.1.2024) Nur dank Ihrer Spende können wir Betroffene unterstützen. Jetzt über FragDenStaat spenden! Widerstand ist sinnvoll Weltweit werden autoritäre Populist:innen zunehmend in die Parlamente gewählt. Einmal an der Macht, schrecken diese auch vor rechtswidrigen Maßnahmen nicht zurück. Nach dem Vorbild von Parteien wie Fidesz in Ungarn und der PiS in Polen können autoritäre Populist:innen auch in Deutschland das Recht missbrauchen, um ihre antidemokratischen und illiberalen Ziele zu erreichen. Auf diese Weise verschieben sie graduell Grenzen dessen, was “normal” ist, schikanieren politische Andersdenkende und grenzen Betroffene aus. Mittels Abmahnungen und Klagen üben rechte Netzwerke Druck auf Menschen aus Aktivismus, Politik, Wissenschaft, Kunst und Journalismus aus. Wenn kritische Stimmen dabei systematisch mundtot gemacht werden, bedroht das die Meinungsfreiheit und den öffentlichen Diskurs. Dieses Vorgehen wird „SLAPP“ genannt. In all diesen Fällen kommt es darauf an, den Rechtsstaat in Anspruch zu nehmen und sich dagegen zu stellen. Fälle des Rechtsmissbrauchs müssen vor Gericht landen. Dafür gibt es den Gegenrechtsschutz. Wir unterstützen Demonstrationen gegen Rechts Rechtliche Beratung im Vorfeld einer Versammlung, anwaltliche Begleitung einer Demonstration oder Rechtsschutz im Nachgang? Melden Sie sich unter kontakt@gegenrechtsschutz.de! Hier können Sie überprüfen, ob ihre Versammlung unter unsere Förderrichtlinien fällt. Betroffene erzählen Sahak Ibrahimkhil Flüchtlingsaktivist und Lokalpolitiker „Ich kenne mich mit Abmahnungen nicht aus und als ich die riesigen Summen gesehen habe, hatte ich Angst.“ → Sahaks Geschichte lesen Silvio Lang Silvio Lang vertritt einen Verein, der durch die Klage existenzgefährdet ist → Silvios Geschichte lesen Schakeela Stark „Die Sache hat mich bestärkt, mich erst recht für Demokratie einzusetzen.“ → Schakeelas Geschichte lesen Luca Barakat Schüler Luca Barakat wurde wegen eines Tweets abgemahnt → Lucas Geschichte lesen Mit Expertise zur Gegenwehr Ein zivilgesellschaftlicher Beirat unterstützt die Arbeit des Gegenrechtsschutzes und stellt sicher, dass wir unsere Ziele einhalten. Wir stehen in ständigem Austausch mit zivilgesellschaftlichen Initiativen und freuen uns über Hinweise auf mögliche Fälle, in denen wir unterstützen können. Heike Kleffner Verband der Beratungsstellen für Betroffene rechter, rassistischer und antisemitischer Gewalt e.V. „Es braucht dringend mehr Solidarität, damit Betroffene von Abmahnungsklagen durch rechte Akteure nicht alleine bleiben! Praktische Unterstützung – rechtlich und finanziell – mildert die Folgen der Angriffe ab und schützt Wissenschaft und Zivilgesellschaft!“ Prof. Fabian Virchow Leiter des Forschungsschwerpunktes Rechtsextremismus / Neonazismus an der Hochschule Düsseldorf „Machtentfaltung von Rechtsaußen funktioniert auch durch Einschüchterung. Dagegen gilt es solidarisch zusammenzustehen.“ Bianca Klose Bundesverband Mobile Beratung e.V. „Die ständigen Angriffe auf die demokratische Zivilgesellschaft sind kein Nebenprodukt rechtsextremer und rechtspopulistischer Politik, sondern eine bewusste Strategie. Daher heißt praktische Solidarität auch: Schutz vor Rechts durch Rechtsschutz!“ Nora Sdun Verlegerin Textem Verlag, Herausgeberin Kultur & Gespenster, Galeristin „Unsinnig auf Besserung der Blöden zu warten.“ Elena Kountidou Neue Deutsche Medienmacher*innen „Gegenrechtsschutz! Damit wichtige Stimmen nicht mundtot gemacht werden.“ Lisa Kretschmer Reporter ohne Grenzen e.V. „Von rechts wird gegen kritische Medienschaffende handgreiflich und zunehmend auch juristisch vorgegangen. Ohne rechtliche Unterstützung für die Betroffenen wäre Pressefreiheit bloße Theorie statt demokratischer Realität.“ Zurück Weiter Fragen und Antworten zum Gegenrechtsschutz Wer kann unterstützt werden? Der Gegenrechtsschutz steht grundsätzlich allen Menschen sowie Organisationen und Verbänden offen, die sich zivilgesellschaftlich für eine offene demokratische Gesellschaft engagieren. Wir unterstützen Betroffene mit diversen Hintergründen und richten uns dabei besonders an marginalisierte Gruppen. Der Gegenrechtsschutz bietet juristische und finanzielle Unterstützung vor allem für Personen, denen diese Ressourcen fehlen und die deshalb ohne die Förderung nicht (juristisch) gegen die missbräuchliche Maßnahme vorgehen würden. Wir richten uns an Personen, die durch Maßnahmen der Verwaltung oder anderer staatlicher Stellen in ihren Rechten beschnitten werden, weil sie nicht den politischen Vorstellungen autoritär handelnder Kräfte entsprechen. Das können Angehörige diskriminierter Gruppen sein, aber auch Aktivist:innen, Medienschaffende, Lehrer:innen, oder Beamt:innen in der Verwaltung selbst. Auch Personen, die wegen ihrer Äußerungen im Zusammenhang mit dem Thema Rechtsextremismus bzw. von rechtsextremen Akteur:innen, Parteien oder Unternehmen rechtlich belangt werden können sich bei uns melden. Was kann gefördert werden? Welche Förderrichtlinien gibt es? Der Gegenrechtsschutz unterstützt insbesondere in solchen Verfahren, die ansonsten nicht geführt würden. Gefördert werden Verfahren gegen Maßnahmen öffentlicher oder privater Stellen, die einen missbräuchlichen Charakter haben und deshalb nicht nur für die einzelnen Personen relevant sind: Indem wir bei der Abwehr helfen, schützen wir auch rechtsstaatliche und demokratische Strukturen für die gesamte Gesellschaft. Dabei muss die staatliche oder private Maßnahme missbräuchlich sein. Dies kann z.B. der Fall sein, wenn es Anhaltspunkte dafür gibt, dass die Maßnahme rechtswidrig ist und zudem der Durchsetzung einer autoritären politischen Agenda dient. Gleiches gilt bei einer Maßnahme, die von einer Behörde ausgeht, deren Leitung einer verfassungsfeindlichen Partei (im Sinne einer Einstufung als gesichert extremistisch durch das zuständige Amt für Verfassungsschutz) angehört. Anlass solcher juristischer Angriffe durch öffentliche oder private Stellen kann die Veröffentlichung wissenschaftlicher Texte, journalistische Berichterstattung, eine künstlerische oder aktivistische Auseinandersetzung oder jegliche Meinungsäußerung sein. Hierfür ist nicht ausreichend, dass es sich um eine potenziell rechtswidrige Maßnahme handelt, sondern es muss zugleich eine politische Motivation nahe liegen. Gefördert wird – sofern in einem angemessenen Umfang personell und finanziell möglich – auch die juristische Hilfestellung und Beratung, um zivilgesellschaftliches Engagement zu ermöglichen und abzusichern. Wir unterstützen dabei insbesondere im Vorfeld von geplanten Veranstaltungen und Veröffentlichungen (z.B. Flyer, Plakate, Handouts). Um ein einheitliches und transparentes Verfahren zu ermöglichen, legen wir den Entscheidungen unsere Förderrichtlinien zu Grunde. Ein Rechtsanspruch auf Unterstützung besteht nicht. Die genauen Förderrichtlinien finden Sie hier. Was kann nicht gefördert werden? Wir können keine Verfahren finanziell fördern, die bereits abgeschlossen sind. Auch können wir keine Bußgelder, Abmahnkosten o.ä. übernehmen. Der Gegenrechtsschutz ist ein Abwehr-Rechtsschutzfonds gegen konkrete Angriffe. Die proaktive Durchsetzung eigener Ansprüche, ohne dass ein missbräuchlicher rechtlicher Angriff vorliegt, können wir nicht unterstützen. Welches Ziel verfolgt der Gegenrechtsschutz? Das Ziel des Gegenrechtsschutzes ist es eine Struktur gegen den Missbrauch rechtlicher Instrumente zu schaffen. Durch Information, Aufklärung, Beratung, Prozessbegleitung und Kostenübernahme wirken wir einer drohenden Beeinträchtigung rechtsstaatlicher Grundsätze, der Aushöhlung demokratischer Entscheidungsstrukturen und Angriffen auf die Pluralität unserer Gesellschaft aktiv entgegen. Damit begegnen wir auch möglichen Beeinträchtigungen der Äußerungs-, Wissenschafts- oder Kunstfreiheit und beugen einem Klima der Einschüchterung vor. Wir wollen das Recht auf effektiven Rechtsschutz stärken, indem die Inanspruchnahme von Rechtsschutz gegen hoheitliche Akte oder sonstige juristische Angriffe mit missbräuchlicher Zielsetzung erleichtert wird. Was macht der Gegenrechtsschutz konkret? Sie können sich an den Gegenrechtsschutz für finanzielle und auch für ideelle Unterstützung wenden. Wir besprechen Ihr Anliegen mit Ihnen und prüfen, ob sie unseren Förderrichtlinien unterfallen. Wenn das der Fall ist, können wir je nach Fall anwaltliche Hilfe vermitteln und die Kosten übernehmen. Darüber hinaus können wir Sie mit anderen Betroffenen oder Organisationen vernetzen, einen Erfahrungsaustausch ermöglichen und bei der Öffentlichkeitsarbeit unterstützen. Anfragen an den Gegenrechtsschutz werden streng vertraulich behandelt. Geförderte Fälle werden (ggf. anonymisiert) journalistisch und wissenschaftlich begleitet und aufbereitet. Kontaktieren Sie uns mit Ihrem Anliegen bitte unter kontakt@gegenrechtsschutz.de. Einen PGP-Schlüssel für die Mailadresse finden Sie hier. Jeder Einzelfall zählt! Sie wollen für den Gegenrechtsschutz spenden? Der gemeinnützige Rechtshilfefonds trägt sich vor allem über Spenden. Wir möchten Sie daher bitten, für den Gegenrechtsschutz zu spenden. Hier geht es zur Spendenseite. Ihre Spende wird zunächst ausschließlich für den Gegenrechtsschutz und die Finanzierung der darunter ausgerichteten Tätigkeiten verwendet. Hauptkostenpunkt sind hierbei insbesondere die Finanzierung anwaltlicher Beratung und Rechtsverteidigung. Ein kleinerer Teil der Spenden ermöglicht die allgemeine Recherche, Koordinierung und Information Betroffener, den Aufbau einer Fall-Datenbank, die Organisation von Informationsveranstaltungen und -materialien, Öffentlichkeitsarbeit sowie die Verwaltung des Fonds. Sollte absehbar sein, dass die im Fonds befindlichen Spenden für die Unterstützung entsprechender Verfahren auf absehbare Zeit nicht mehr erforderlich sein dürften, behalten wir uns vor, die im Fonds befindlichen Spenden in andere Projekte zu überführen, die diesem Projekt ihrem Zweck nach möglichst nahekommen. Dies werden wir transparent ankündigen. Ihre Spende ist steuerlich absetzbar. Sie können bei uns eine Spendenquittung für Ihre Steuererklärung erhalten. Sie wollen über den Gegenrechtsschutz informieren? Wir freuen uns, wenn Sie andere auf den Gegenrechtsschutz aufmerksam machen wollen. Hier finden Sie Informationen zum Gegenrechtsschutz im Kurzüberblick – auf einer Seite. Sie erreichen uns bei Fragen per E-Mail unter kontakt@gegenrechtsschutz.de. Einen PGP-Schlüssel für die Mailadresse finden Sie hier."
year_published = 2025
