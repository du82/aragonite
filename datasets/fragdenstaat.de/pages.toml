["https://fragdenstaat.de/artikel/exklusiv/2025/02/beraterberichte"]
title = "Beraterberichte-Datenbank: Wie Berater*innen vom Staat Hunderte Millionen Euro kassieren"
description = "Verschleiern, Verschwenden, Klüngeln: Die Berater*innen-Deals der Bundesregierung haben schon für zahlreiche Skandale gesorgt. Es fehlt Kontrolle. Bis jetzt. Wir veröffentlichen erstmals die bislang geheimen Beraterberichte."
full_description = "Beraterberichte-DatenbankWie Berater*innen vom Staat Hunderte Millionen Euro kassierenVerschleiern, Verschwenden, Klüngeln: Die Berater*innen-Deals der Bundesregierung haben schon für zahlreiche Skandale gesorgt. Es fehlt Kontrolle. Bis jetzt. Wir veröffentlichen erstmals die bislang geheimen Beraterberichte. von Sabrina Winter, Stefan Wehrmeyer, Vera Deleja-Hotko – 27. Februar 2025 Bluesky Mastodon Auf Mastodon teilenBitte geben Sie die Domain Ihrer Mastodon-Instanz ein.https:// Share! Kurzlink kopieren Teilen… Die Bundesregierung hat von bestimmten Themen keine Ahnung. Und das weiß sie auch – denn immer dann rekrutiert sie Berater*innen. Hunderte Millionen Euro geben die Bundesministerien jedes Jahr für Beratung aus, Tendenz steigend. Es geht dann zum Beispiel darum, wie Behörden endlich eine elektronische Akte führen oder Bürger*innen ihren Pass online beantragen können – Themen mit fachspezifischen Problemen, die Ministerien nicht alleine bewältigen können oder wollen.Dass die Bundesregierung sich bei komplexen Fragestellungen Hilfe von außen holt, ist erst einmal nachvollziehbar. Ebenso nachvollziehbar sollte es sein, dass genau kontrolliert wird, wer millionenschwere Regierungsaufträge bekommt – und auf welchem Weg die lukrativen Deals vergeben werden. Doch genau diese Kontrolle fehlt. Immer wieder kommt es zu Vetternwirtschaft und Steuerverschwendung. Wir haben gemeinsam mit der NDR-Sendung Reschke Fernsehen monatelang zu staatlichen Beratungsaufträgen recherchiert – und festgestellt: Aktuell ist Kontrolle darüber kaum möglich. Die Unterlagen, mit denen die Bundesregierung Transparenz und Kontrolle über ihre Berater*innen-Deals schaffen soll, sind in großen Teilen intransparent, fehlerhaft und chaotisch. Darum machen wir die geheimen „Beraterberichte“ der Bundesregierung erstmals öffentlich.Transparenzberichte, die geheim bleiben sollenWie viel Geld zahlt die Bundesregierung an ihre jeweiligen Berater*innen? Und wofür genau? Das Bundesfinanzministerium muss darüber jedes Jahr einen Bericht erstellen: den Beraterbericht. Allerdings sehen diesen Bericht nur sehr wenige Menschen, im Wesentlichen die 46 Abgeordneten des Haushaltsausschusses. Sie diskutieren über den Bericht in einer nichtöffentlichen Sitzung. Auch der Bundesrechnungshof, der oberste Finanzkontrolleur der Bundesrepublik, hat Zugriff auf den Beraterbericht, um ihn zu prüfen. Andere Abgeordnete, Staatsbedienstete oder die Öffentlichkeit sehen ihn nicht. Bis jetzt.Der Bundesrechnungshof hat die Bundesregierung bereits mehrmals dazu aufgefordert, die Beraterberichte der letzten Jahre zu veröffentlichen. Ein öffentliches Interesse an den Berichten „wiegt schwer“, argumentiert der Bundesrechnungshof. Denn Berater*innen sind nicht demokratisch legitimiert, dürfen und sollen aber Regierungsentscheidungen beeinflussen. Bisher ist dem klaren Appell des Rechnungshofs keine Bundesregierung gefolgt. Die Berichte blieben geheim. Das ändern wir jetzt: Wir veröffentlichen alle Beraterberichte der Bundesregierung aus den Jahren 2017 bis 2023 in einer Datenbank. Man kann die Daten durchsuchen, filtern, sortieren und exportieren. Zusätzlich veröffentlichen wir die Originaldokumente.Ursprünglich hatte FragDenStaat-Chefredakteur Arne Semsrott den Beraterbericht für 2019 über das Informationsfreiheitsgesetz beim Finanzministerium angefragt. Die Anfrage lehnte das Finanzministerium ab. Daraufhin hatte er den Bericht eingeklagt – und gewonnen. Das Verwaltungsgericht Berlin entschied: Der Beraterbericht muss freigegeben werden. Doch das Finanzministerium wollte das nicht und ging in die nächste Instanz. Der Rechtsstreit ist noch nicht abgeschlossen. Die Dokumente sind mittlerweile auf anderem Weg zu uns gelangt.DranbleibenAbonnieren Sie unseren Newsletter um keine Recherche mehr zu verpassen!Bitte geben Sie hier nichts einE-MailAbonnierenBundesrechnungshof: Beraterbericht ist mangelhaftJede Person in Deutschland darf sich Berater*in nennen. Es ist keine geschützte Berufsbezeichnung. Man braucht also keine spezielle Ausbildung, um Projekte abzuwickeln und damit Geld zu verdienen. Schätzungen zufolge gibt es mehr als 180.000 Berater*innen in Deutschland. Und viele von ihnen wurden und werden von der Regierung beauftragt – egal ob unter Kohl, Schröder, Merkel oder Scholz. Mehr als 45 Milliarden Euro verdient die Beraterbranche jährlich. Jeder zehnte Euro kommt vom Staat. Wir haben in den letzten Monaten die Beraterberichte gewälzt, Daten aufbereitet und viel gerechnet – genauer gesagt: nachgerechnet. Denn relativ schnell fällt auf, dass die Zahlen in den Beraterberichten unvollständig, durcheinander und widersprüchlich sind. Das kritisiert auch der Bundesrechnungshof. Er schreibt etwa zum Beraterbericht 2021, die Datenqualität sei „mangelhaft“.Gerne würden wir eine finale Aussage treffen, wie viel Geld jeweils an welches Unternehmen geflossen ist. Doch die Zahlen in den Berichten ergeben Unstimmigkeiten – schon bei einfacher Addition. Wenn man bestimmte Einzelausgaben addiert, kommt man nicht immer auf die dazugehörige Gesamtsumme, die in den Berichten steht. Im Beraterbericht von 2021 klaffen die addierten Einzelausgaben und die angegebenen Gesamtsummen für Beratungsaufträge des Landwirtschaftsministeriums um 14.000 Euro auseinander. Beim Umweltministerium waren es gar mehr als eine Million Euro. Auch dem Bundesrechnungshof fielen diese Unstimmigkeiten auf. Das Finanzministerium erklärte damals, es sei lediglich dafür zuständig, die Berichte zu bündeln, nicht sie zu überprüfen. An dieser Argumentation hält es bis heute fest. Für die Daten und deren Qualität seien die Ressorts verantwortlich, teilt eine Sprecherin auf Anfrage mit.Auszug aus der Beraterberichte-DatenbankJahrRessortVertragszweckAuftragnehmerVertragsvolumenAusgaben Jahr 1Ausgaben Jahr 1-42023BMDVKoordination und Steuerung im Projekt „IPv6-Migration im Ressort BMDV“Keine Zustimmung zur Namensnennung14.973.502 €1.680.393 €1.680.393 €2023BMDVUnterstützung bei der Umsetzung der Maßnahmen des Klimaschutz- programmsPD Partnerschaft Deutschland - Berater der öffentlichen Hand GmbH Nachunternehmer: Keine Zustimmung zur Namensnennung13.515.544 €1.125.383 €5.739.863 €2023BMDVBeratung des BMDV zur Einrichtung einer gemeinwohlorientierten Infrastruktursparte innerhalb der Deutschen Bahn AGKeine Zustimmung zur Namensnennung Nachunternehmer: Keine Zustimmung zur Namensnennung10.007.310 €5.511.697 €10.007.309 €2023BMFKonzeption der Betriebsplattform Bundkeine Zustimmung zur Namensnennung8.629.310 €4.535.786 €5.128.974 €2023BMDVProjektmanagement Digitales Planen, Bauen und BetreibenKeine Zustimmung zur Namensnennung7.140.000 €2.623.185 €2.623.185 €Auch im Beraterbericht 2023 werden die Namen vieler Auftragnehmer von millionenschweren Projekten nicht genannt. Hier die fünf größten Verträge ohne Namensnennung.Ein weiteres Problem in den Beraterberichten: Bei durchschnittlich einem Drittel der Beratungsprojekte von 2017 bis 2023 wird nicht genannt, welche Firma dafür Steuergeld kassiert hat. Die beauftragten Firmen konnten viele Jahre lang selbst entscheiden, ob ihr Name in den Beraterberichten steht und somit gegenüber dem Haushaltsausschuss genannt wird. Zwar verlangt der Haushaltsausschuss die Namensnennung. Ob das tatsächlich umgesetzt wird, liegt allerdings in der Hand der Ministerien. Im Beraterbericht von 2023 fehlt ein Fünftel der Namen. Zwar sind es deutlich weniger als 2017, als noch die Hälfte der Beratungsfirmen geheim blieb. Aber: Wenn auch nur in Teilen unklar bleibt, wer die Regierung berät, kann der Ausschuss nicht kontrollieren, ob dabei alles korrekt läuft. Der Oberberater der PolizeiZwar lassen sich wegen der fehlerhaften Zahlen und der unvollständigen Namensnennungen nur vorsichtige Berechnungen über die Beratungsgeschäfte der Bundesregierung anstellen. Was man aber festhalten kann: Das Bundesinnenministerium (BMI) gibt mit großem Abstand am meisten Geld für Beratungen aus. Knapp 60 Millionen Euro waren es allein im Jahr 2023. Danach folgen Finanz- und Verkehrsministerium.Wie viel Geld Ministerien für Beratung ausgebenIm Jahr 2023 hat das Innenministerium das meiste Geld für Beratungen ausgegeben; das Arbeits- und Sozialministerium hingegen am wenigsten.Ein Projekt des Innenministeriums sticht in den Beraterberichten besonders heraus: „Polizei 2020“. Knapp 56 Millionen Euro zahlte das Innenministerium dafür in den vergangenen Jahren an Beratungsfirmen. So geht es aus den Zahlen der Beraterberichte hervor. Ziel des 2017 gestarteten Projekts ist es, die Arbeit der Polizei zu digitalisieren. Zum Beispiel sollen alle Polizeien bundesweit mit denselben Programmen arbeiten und Daten schneller tauschen.Inzwischen ist „Polizei 2020“ das wohl größte Digitalisierungsprojekt der Polizei. Das Bemerkenswerte: Die Gesamtleitung des Projekts hat das Innenministerium ausgelagert – an einen einzelnen Berater: den Freiberufler Holger Gadorosi. Der Name „Holger Gadorosi Consulting“ fällt auf zwischen großen internationalen Firmen wie PWC, Capgemini oder Accenture, die in dem Großprojekt „Polizei 2020“ auch tätig sind. Dabei bekommt Holger Gadorosi Consulting ähnlich hohe Summen vom Ministerium überwiesen wie die Branchenriesen. Laut den Beraterberichten waren es 3,8 Millionen Euro zwischen 2019 und 2023. Gadorosi erklärt auf Nachfrage, dass er einen wesentlichen Teil des Geldes für Steuern, Mitarbeitende und Subunternehmer*innen habe aufwenden müssen. Dass Gadorosi als Externer ein riesiges Projekt des Innenministeriums leitet, ist ungewöhnlich. „Es ist ein Unding, dass die Gesamtleitung eines Projektes extern liegt“, sagt Thomas Deelmann. Er ist Wirtschaftswissenschaftler und war früher selbst Berater. Seit 20 Jahren forscht er zur Beratungsbranche. „Externe Kräfte dürfen gerne unterstützen, aber die finale Verantwortung, Kontrolle und Steuerung des Gesamtprojektes hat abschließend beim Innenministerium zu liegen.“Bemerkenswert ist auch: Keiner der Beratungsaufträge, die Gadorosi vom Innenministerium bekam, war öffentlich ausgeschrieben, wie es sonst bei staatlichen Großaufträgen üblich ist. Das Innenministerium erklärt dies damit, dass der Auftrag für die Projektleitung von „Polizei 2020“ aus „technischen Gründen nur von einem bestimmten Unternehmen erbracht werden“ könne. Gemeint ist: Holger Gadorosi Consulting.Über das Informationsfreiheitsgesetz haben wir die Vergabeunterlagen für „Polizei 2020“ erhalten. Darin erklärt das Innenministerium, warum nur Gadorosi für den Auftrag in Frage komme: Gadorosi sei innerhalb des Gesamtprogramms akzeptiert. Ginge die externe Programmleitung an einen anderen Berater, würde dies zu Unverständnis bei den Beteiligten in Innenministerium und Bundeskriminalamt führen. Zudem erklärt die Behörde, dass Gadorosi hochgradig spezialisiert sei, der Auftrag nur von seinem Unternehmen ausgeführt werden könne und es für den Auftrag keinen Wettbewerb gebe. Aufgrund dieser Argumentation kann das Ministerium auf eine Sonderregel im deutschen Vergaberecht zurückgreifen – und muss keine weiteren Angebote einholen, wenn es einen millionenschweren Auftrag vergibt. Berater*innen sollten grundsätzlich nur bei Projekten eingesetzt werden, die „besonderes Spezialwissen voraussetzen“, welches „für kurze Zeit gefordert wird“. Das schreibt die Bundesregierung selbst als Antwort auf eine kleine Anfrage. Schaut man auf Gadorosis Berater-Karriere, scheint dies nur wenig mit einem kurzzeitigen Projekt gemein zu haben. Seit 2001 beauftragt das Innenministerium ihn immer wieder für IT-Projekte. Allein seit sechs Jahren leitet er „Polizei 2020“. Mit solchen Kettenbeauftragungen laufen Ministerien Gefahr, sich von Beratern abhängig zu machen. Ein solches Risiko sehe das Innenministerium hier nicht, teilt ein Sprecher auf Nachfrage mit. Dabei ist Gadorosi aktuell der einzige, der als externer Freiberufler ein IT-Projekt für das Innenministerium leitet. Wahrscheinlich macht er das noch weitere Jahre. Erst vor wenigen Monaten hat das Innenministerium seinen Beratervertrag für „Polizei 2020“ um vier Jahre verlängert – für knapp 3,5 Millionen Euro. Rechentrick: Millionenausgaben verschleiertLaut einer Schätzung arbeiten 2.600 Berater*innen täglich für die Bundesregierung. Hätten sie ein eigenes Ministerium, wäre es personell eines der größten in Deutschland. Immer wieder beteuert die Bundesregierung, sie wolle die Ausgaben für Berater*innen reduzieren. Und tatsächlich sanken die Ausgaben von 2019 zu 2020 schlagartig um 124 Millionen Euro. Doch das lag nicht daran, dass die Bundesregierung weniger Berater anheuerte. Vielmehr basierte die scheinbare Kostensenkung auf einem simplen Trick: Die Bundesregierung änderte die Definition dafür, was als Beratungsleistung zählt.So viel gibt die Bundesregierung für Berater*innen ausJedes Jahr erstellt das Bundesfinanzministerium einen Beraterbericht und summiert die Ausgaben der Ministerien. Im Folgejahr werden die Zahlen meist korrigiert. Wir stellen hier die korrigierten Zahlen dar.Wie gravierend diese Änderung war, zeigt folgendes Beispiel: Laut Beraterbericht gab die Bundesregierung im Jahr 2020 insgesamt 172 Millionen Euro für Berater*innen aus. In der Antwort auf eine Anfrage eines Abgeordneten sprach die Bundesregierung für dasselbe Jahr hingegen von 433,5 Millionen Euro Beratungskosten. Dass eine Differenz von mehr als 260 Millionen Euro keineswegs mit tatsächlich gesunkenen Ausgaben zusammenhängt, räumt das Finanzministerium im Beraterbericht offen ein: Die deutliche Reduzierung der aufgeführten Ausgaben beruhe „ganz wesentlich“ auf der neuen Definition. Der Rechentrick Wegen einer Änderung der Definition für Beratung sinken die Kosten für Beratung im Folgejahr. Hervorhebung von unsDer Haushaltsausschuss hatte 2020 gefordert, der Einsatz von Berater*innen müsse „substanziell“ gesenkt werden. Damals war Olaf Scholz der zuständige Bundesfinanzminister. Doch Scholz wollte die Ausgaben nicht senken. Nicht einmal eine Evaluation der bisherigen Projekte fand er notwendig. Sein Weg, um der Forderung nachzukommen: Projekte im Bereich IT, wissenschaftliche Gutachten, Studien und vieles weitere gelten seitdem nicht mehr als Beratungsleistung, sondern als „Umsetzungsleistung“. Durch die veränderte Definition schrumpften die Gesamtausgaben für Berater*innen auf dem Papier, obwohl die Bundesregierung keineswegs anfing, sparsamer Aufträge zu vergeben. Vor allem für die parlamentarische Kontrolle hatte Scholz´ Rechentrick drastische Folgen. „Die Definitionsänderung ermöglicht es der Bundesregierung weiterhin, Ausgaben zu externen Beraterleistungen nicht transparent zu machen“, sagt Sven-Christian Kindler, der 15 Jahre lang für die Grünen im Haushaltsausschuss saß. „Was nicht in den Berichten steht, müssen wir uns jetzt über andere Wege, wie kleine Anfragen, besorgen. Das ist deutlich mehr Aufwand für uns“, erklärt Kindler.Eine besondere BeziehungWie die Definitionsänderung Kontrolle erschwert, zeigt folgende Geschichte: Ernst Bürger, Abteilungsleiter für Digitale Verwaltung im Innenministeriu"
