title = "Der Prinzenfonds – FragDenStaat"
description = "Rechthilfefonds für Personen, die vom Prinz von Preußen verklagt werden"
full_description = "Für die Verteidigung der Wissenschafts- und Meinungsfreiheit: Der Prinzenfonds Der Hohenzollern-Prinz Georg Friedrich von Preußen geht mit Abmahnungen und Klagen gegen ihm unerwünschte Berichterstattung vor – unter anderem in Zusammenhang mit der Erforschung der Rolle der Hohenzollern im Nationalsozialismus und deren Auswirkungen auf ihre Entschädigungsforderungen. Für betroffene Forscher:innen und Journalist:innen richten wir einen Hilfsfonds ein. Georg Friedrich Prinz von Preußen, nach eigenen Angaben „Chef des Hauses Hohenzollern“, hat in den vergangenen Jahren dutzende Personen aus Wissenschaft, Journalismus und Politik für Äußerungen zur Geschichte und Gegenwart der Hohenzollern abgemahnt und verklagt. Damit versucht er, (außer-)gerichtlich mitunter erfolgreich, Einfluss auf die öffentliche Meinungsbildung in der Interpretation des Wirkens der Hohenzollern zu nehmen und ihm unerwünschte Berichterstattung zu bekämpfen. Der Direktor des Zentrums für Zeithistorische Forschung, Martin Sabrow, sieht im Vorgehen des Herrn von Preußen einen „Angriff auf die Freiheit der Wissenschaft”. Warum klagt der Prinz? Herr von Preußen hat unter anderem Historiker:innen in Zusammenhang mit deren Erforschung des NS-Vergangenheit des Hauses Hohenzollern verklagt und Aussagen im Kontext des insoweit komplizierten Streits um den Anspruch der Hohenzollern wegen Enteignungen nach Ende des Nationalsozialismus abmahnen lassen. So wollte Herr von Preußen beispielsweise auch FragDenStaat gerichtlich verbieten lassen zu schreiben, dass er gegen kritische Berichterstattung teils strafrechtlich vorgehe. Im Verfahren vor dem Landgericht sagte der Anwalt des Herrn von Preußen, es würden “hunderte Artikel” über die Hohenzollern geschrieben, er komme “gar nicht mit dem Klagen hinterher”. Während Herr von Preußen es sich offenbar leistet, selbst harmlose Äußerungen gerichtlich verbieten zu lassen und hierbei vor seinem Lieblingsgericht, dem Landgericht Berlin, mitunter auch Erfolg hat, schrecken viele der von ihm angegriffenen Personen aus Wissenschaft und Forschung häufig vor einer konsequenten Verteidigung ihrer Position zurück, u.a. in den Folgeinstanzen – auch in Anbetracht möglicher Kosten. Hierunter leidet unseres Erachtens der wissenschaftliche Diskurs und die öffentliche Meinungsbildung. Dass ein solches Vorgehen Methode haben kann, hat jüngst eine Studie unter Mitwirkung der Otto-Brenner-Stiftung und der Gesellschaft für Freiheitsrechte zu präventiven Anwaltsstrategien gegenüber Medien ergeben. Die Freiheit von Wissenschaft und Forschung muss aber gerade auch vor Gericht verteidigt werden. Betroffene Personen müssen unabhängig von ihren persönlichen finanziellen Möglichkeiten die Chance haben, den Rechtsweg vollständig zu beschreiten. Im schlimmsten Fall wird ansonsten ein Klima geschaffen, in dem kritische Forscher:innen und (Wissenschafts-)Journalist:innen durch die sogenannte „Schere im Kopf“ so eingeschüchtert sind, dass sie bei jeder Beschwerde der vermeintlich übermächtigen Gegenseite von ihren Ansichten abrücken oder gar ihre Forschung und Recherche künftig erst gar nicht beginnen, weiter betreiben oder öffentlich machen. Wir präsentieren: Den Prinzenfonds Um Angriffe auf die Freiheit von Wissenschaft und Forschung und die damit verbundene Meinungsfreiheit effektiv zu verteidigen, gründet FragDenStaat einen Rechtshilfefonds. Er soll Personen unterstützen, die vom Prinz von Preußen wegen Äußerungen im Themenfeld der Erforschung der Geschichte der Hohenzollern im Nationalsozialismus und des heutigen Geschichtsbilds, nicht zuletzt auch in Anbetracht der Debatten um die umstrittene Berechtigung der Entschädigungsforderungen der Hohenzollern wegen Enteignungen nach Ende der NS-Zeit, abgemahnt und verklagt werden. Freie Forschung und Wissenschaft müssen auch auf juristischer Ebene verteidigt und die juristische Verteidigung entsprechend gefördert werden. Der Fonds wird unterstützt von der Deutschen Journalistinnen- und Journalisten-Union (dju) in ver.di. Auch der Verband der Historiker und Historikerinnen Deutschlands tritt im Sinne der Wissenschaftsfreiheit für die Unterstützung der Beklagten ein. Als zentrale Anlaufstelle für Betroffene in entsprechenden äußerungsrechtlichen Verfahren koordinieren wir nicht nur Verfahren und bieten strategischen Austausch und ein Netzwerk für Betroffene, die von Herrm von Preußen abgemahnt und verklagt werden. Sollte dies nötig sein, finanzieren wir auch anwaltliche Hilfe und Gerichtsverfahren. Finanzierung Der Rechtshilfefonds trägt sich vor allem über Spenden. Wir gehen davon aus, dass Betroffene pro Verfahren des Herrn von Preußen ein Prozessrisiko von rund 5.000 Euro tragen. Um eine gute finanzielle Basis zu haben, benötigen wir zunächst 10.000 Euro. Wir möchten Sie daher bitten, für den Prinzenfonds zu spenden. Spenden für den Prinzenfonds Spendenbetrag: 20 Euro 50 Euro 100 Euro Anderer Betrag Euro Spendenrhythmus einmalig monatlich vierteljährlich jährlich Weiter Persönliche Daten Anrede Hallo Guten Tag Sehr geehrte Frau Sehr geehrter Herr Liebe Lieber Liebes Vorname Nachname E-Mail → Möchten Sie als Firma spenden? Firma Möchten Sie eine Spendenbescheinigung? Nein, danke. Ja, einmal im Jahr per E-Mail. Straße, Hausnummer Postleitzahl Ort Land --- Deutschland Österreich Schweiz Belgien Niederlande Luxemburg Frankreich Liechtenstein Dänemark Polen Tschechien Italien Spanien Portugal Schweden Finnland Zahlungsweise Spenden per Kreditkarte, SEPA-Lastschrift oder Paypal funktionieren leider nicht über unsere .onion-Seite. Zahlungsweise SEPA-Lastschrift Paypal Überweisung Kreditkarte Die Eingabe Ihrer Zahlungsinformationen erfolgt sicher verschlüsselt im nächsten Schritt. Auf dem Laufenden bleiben Neuigkeiten Erhalten Sie Neuigkeiten zum Thema Informationsfreiheit direkt in Ihr Postfach und erfahren Sie mehr über die Wirkung Ihrer Spende. Ja, gerne! Nein, danke. Account bekommen In Ihrem FragDenStaat-Konto können Sie Ihre Daten pflegen, Ihre Spenden einsehen sowie Ihre Anfragen verwalten. Ja, super praktisch. Ich stimme den Nutzungsbedingungen zu. Nein, danke. Was ist drei plus vier? Bitte beantworten Sie diese Frage, um einen Beleg zu liefern, dass Sie ein Mensch sind. Jetzt spenden Fragen und Antworten zur Förderung Wer kann unterstützt werden? In erster Linie beabsichtigt der Rechtshilfefonds Historiker:innen und Journalist:innen zu unterstützen, die wegen Äußerungen vom Prinzen abgemahnt und verklagt werden. Sie können sich an den Prinzenfonds für finanzielle (soweit bedürftig) und/oder ideelle Unterstützung, insbesondere zwecks Koordinierung des Verfahrens, inhaltlichen Erfahrungsaustausch, Bekanntmachung mit anderen Betroffenen, Öffentlichkeitsarbeit, o.ä. wenden. Anfragen an den Fonds werden vertraulich behandelt. Nach Abschluss der Verfahren werden die jeweiligen Ergebnisse anonymisiert veröffentlicht, vorher ist natürlich aber Berichterstattung möglich. Kontaktieren Sie uns bitte unter arne.semsrott@okfn.de – sehr gerne auch, wenn Ihr Verfahren etwa durch Abgabe einer Unterlassungserklärung oder gerichtliche Entscheidungen bereits abgeschlossen ist. Wofür setzen Sie meine Spende ein? Ihre Spende wird zunächst ausschließlich für den Rechtshilfefonds der Open Knowledge Foundation Deutschland e.V. und den darauf ausgerichteten Tätigkeiten im Projekt FragDenStaat verwendet (Recherche und Finanzierung von Rechtsverteidigung, Prüfung der Förderungsanträge, Verwaltung des Fonds, Koordinierung und Information Betroffener, Öffentlichkeitsarbeit). Sollte absehbar sein, dass die im Fonds befindlichen Spenden für die Unterstützung entsprechender Verfahren auf absehbare Zeit nicht mehr erforderlich sein dürften, behalten wir uns vor, die im Fonds befindlichen Spenden in andere eigene Projekte zu überführen, die diesem Projekt ihrem Zweck nach möglichst nahekommen. Dies werden wir transparent ankündigen. Wir werden sie dann zur Unterstützung von Projekten und Verfahren gebrauchen, mit denen die freie Wissenschaft und Forschung und der Zugang zu Wissen gefördert werden. Sie kommen also weiterhin unmittelbar unserem satzungsmäßigen Vereinszweck zur Förderung von Wissenschaft und Forschung und zur Förderung des freien und ungehinderten Zugangs der Bürgerinnen und Bürger zu Bildung und Wissen mit dem Ziel der Förderung der Wissensgesellschaft und einer aktiven Bürgergesellschaft zugute. Ihre Spende ist daher steuerlich absetzbar. Sie können bei uns eine Spendenquittung für Ihre Steuererklärung erhalten. Warum wird ein solcher Fonds benötigt? Prinz Georg von Preußen ist in der Vergangenheit mehrfach gegen Berichterstattung im Kontext der Erforschung der historischen Verstrickungen des Hauses Hohenzollern in das NS-Regime und die damit zusammenhängende heutige Interpretation der Familiengeschichte vorgegangen. Allein vor dem Landgericht Berlin wurden in den vergangenen Jahren mehr als 45 Entscheidungen erwirkt, häufig zu Lasten der Betroffenen, die sich gegen die Angriffe des durch den Prinzen stets beauftragten Haus- und Hofjuristen nicht mit Erfolg zur Wehr setzen konnten. Überwiegend waren dies Eilverfahren, die unter anderem auf einstweilige Versicherungen von Einzelpersonen aus dem Lager des Prinzen gestützt worden sind und die in der Kürze der Zeit kaum zu erschüttern waren. Aber auch, was die tatsächliche Aufklärung und rechtliche Würdigung der Sachverhalte durch das Gericht anbelangt, geben die Entscheidungen nach unserer Einschätzung verschiedentlich Anlass zu Kritik. Teilweise kam es auch erst gar nicht zu Gerichtsverfahren, nicht zuletzt, weil manche Betroffene die Kosten einer Verteidigung gegen die Abmahnung des Prinzen vor Gericht scheuten. Schon gar nicht ging der Großteil der Unterlegenen gegen die Entscheidungen in der nächsthöheren Instanz oder in Hauptsacheverfahren vor. Dieses konsequente Vorgehen des Prinzen von Preußen gegen ihm unerwünschte Berichterstattung hat Methode. So hat sein Anwalt in dem uns betreffenden Verfahren erklärt, er komme „mit dem Klagen gar nicht hinterher”. Unseres Erachtens droht hier im schlimmsten Fall, dass kritische Forscher:innen und Wissenschaftsjournalist:innen durch die „Schere im Kopf“ in einer Weise eingeschüchtert sind, dass sie ihre Forschung und Recherche erst gar nicht weiter betreiben oder öffentlich machen. Recht sollte aber keine Kostenfrage sein! Daher wollen wir, dass Betroffene es sich leisten können, Berichterstattung, Forschung und wissenschaftliche Erkenntnisse bestmöglich rechtlich verteidigen zu können und die finanziellen Folgen nicht fürchten müssen. Vielstimmiger Diskurs, unabhängige Forschung und kritischer Wissenschaftsjournalismus leben auch davon, Vorwürfe von Rechtsverletzungen umfassend aufklären lassen zu können. Daher sollte bei den entsprechenden Auseinandersetzungen nicht in der Regel vor dem Landgericht Berlin im Eilverfahren Schluss sein, sondern Betroffene sollen es sich leisten können, gegen die Entscheidungen des Landgerichts in die nächsten Instanzen zu ziehen bzw. die Vorwürfe in Hauptsache-Verfahren mit erweiterten Möglichkeiten der Beweisführung gründlich überprüfen zu lassen. Schon gar nicht darf es im Sinne eines lebhaften wissenschaftlichen Diskurses passieren, dass Betroffene aus Angst vor gerichtlicher Inanspruchnahme in vorauseilendem Gehorsam direkt Unterlassungserklärungen abgeben oder erst gar nicht mehr zu bestimmten Themenkomplexen in der Geschichte der Hohenzollern forschen und veröffentlichen. Was passiert genau mit meiner Spende und ist sie steuerlich absetzbar? Ihre Spende wird zunächst ausschließlich für den Rechtshilfefonds der Open Knowledge Foundation Deutschland e.V. und den damit unmittelbar in Verbindung stehenden Tätigkeiten im Projekt FragDenStaat verwendet (Recherche und Finanzierung von Rechtsverteidigung, Verwaltung des Fonds, Koordinierung und Information Betroffener, Öffentlichkeitsarbeit). Sollte absehbar sein, dass die im Fonds befindlichen Spenden für die Unterstützung entsprechender Verfahren auf absehbare Zeit nicht mehr erforderlich sein dürften bzw. aufgebraucht werden können, behalten wir uns vor, die betreffenden Spenden in andere Projekte zu überführen, die diesem Projekt ihrem Zweck nach möglichst nahe kommen und sich für die Stärkung der freien Wissenschaft und Forschung engagieren. Bei der entsprechenden Umwidmung von Spenden orientieren wir uns zeitlich an der gesetzlichen Vorgabe, nach der Spenden spätestens in den auf den Zufluss folgenden zwei Jahren für die steuerbegünstigten satzungsmäßigen Zwecke verwendet werden müssen. Damit kommt Ihre Spende in jedem Fall unmittelbar unserem satzungsmäßigen Vereinszweck zur Förderung von Wissenschaft und Forschung und des freien und ungehinderten Zugangs der Bürgerinnen und Bürger zu Bildung und Wissen mit dem Ziel der Förderung der Wissensgesellschaft und einer aktiven Bürgergesellschaft zugute. Ihre Spende für den Prinzenfonds ist daher steuerlich absetzbar. Sie können bei uns eine Spendenquittung für Ihre Steuererklärung erhalten. Welche Rechtsstreitigkeiten werden durch den Prinzenfonds bezuschusst? Wer kann Förderung beantragen? Der Prinzenfonds unterstützt insbesondere in solchen äußerungsrechtlichen Verfahren, bei denen die Erforschung und Diskussion der Rolle des Hauses Hohenzollern im Nationalsozialismus und das davon berührte gegenwärtige Geschichtsbild des Hauses Hohenzollern sowie die Entschädigungsansprüche der Hohenzollern wegen Enteignungen nach Ende des Nationalsozialismus in Streit stehen und eine Beeinträchtigung von wissenschaftlicher Vielstimmigkeit und Publikationsfreiheit durch juristische Verfolgung und abschreckende Kosten der Rechtsverteidigung drohen. Formlose Anträge können von Einzelpersonen sowie Organisationen und Verbänden gestellt werden, die durch Angehörige des Hauses Hohenzollern (außer-)gerichtlich wegen vermeintlichen Rechtsverletzungen in Anspruch genommen werden. Neben der erforderlichen Bedürftigkeitsprüfung behalten wir uns eine Vorprüfung mit Blick auf die wissenschaftliche Seriosität und Relevanz der betreffenden Äußerungen sowie eine grobe Vorprüfung der Erfolgsaussichten vor. Insbesondere eine Verteidigung von schmähkritischen oder erwiesen unwahren Tatsachenbehauptungen wird aus dem Fonds nicht unterstützt. Eine besondere Bedeutung der Verfahren ist grundsätzlich nicht erforderlich. Das Ziel des Fonds ist es gerade, möglichst allen von Rechtsverfolgung der Hohenzollern betroffenen Forscher:innen und (Wissenschafts-)Journalist:innen zu ermöglichen, ihr begründetes Recht auf Meinungs- und Wissenschaftsfreiheit in Zusammenhang mit der Erforschung und Auseinandersetzung mit der Geschichte der Hohenzollern soweit von öffentlichem Interesse vor Gericht zu erstreiten. Die Richtlinien zur Förderung aus dem Fonds finden Sie untenstehend. Richtlinien für die Vergabe von Förderungen Richtlinien für die ideelle und materielle Förderung aus dem Prinzenfonds der Open Knowledge Foundation Deutschland e.V. (OKF), Stand: 17.6.2020 1. Zweckbestimmung Es werden Finanzierungshilfen zur Abwehr vor allem äußer"
