description = "Aktuelles rund um Recherchen, Anfragen, Kampagnen und politische Entwicklungen im Bereich der Informationsfreiheit"
full_description = "27. Februar 2025 Beraterberichte-Datenbank: Wie Berater*innen vom Staat Hunderte Millionen Euro kassieren Verschleiern, Verschwenden, Klüngeln: Die Berater*innen-Deals der Bundesregierung haben schon für zahlreiche Skandale gesorgt. Es fehlt Kontrolle. Bis jetzt. Wir veröffentlichen erstmals die bislang geheimen Beraterberichte. 12. Februar 2025 Abschiebepolitik: Ein fragwürdiges Angebot Das Bundesamt für Migration und Flüchtlinge (BAMF) schickt Briefe an Asylsuchende, um sie zur freiwilligen Ausreise nach Griechenland zu bewegen. Es wird suggeriert, dass sich die Situation für Geflüchtete verbessert habe – ohne Garantien. 6. Februar 2025 Edit-A-Thon: Ist die AfD verfassungswidrig? Sammle mit uns Belege zum AfD-Verbot Wir laden ein zum großen Edit-A-Thon am 22. Februar in Berlin. Was wir vorhaben? Gemeinsam gerichtsfeste Beweise zu einem AfD-Verbotsverfahren sichern. 5. Februar 2025 Bundespolizeiakademie: Professor mit rechter Vergangenheit unterrichtet wieder Nachdem seine rechte Vergangenheit aufgedeckt wurde, sollte ein umstrittener Dozent nicht länger Bundespolizist*innen ausbilden. Nun ist er überraschend wieder zurück in der Lehre. Das sorgt für Unruhe an der Polizeihochschule. 29. Januar 2025 Bundestagswahl: Wir starten den Real-O-Mat! Statt an Wahlversprechen sollten wir uns vor der Wahl lieber daran orientieren, wie Parteien wirklich gehandelt haben. Beim Real-O-Mat können sich Nutzer*innen zu zwanzig politischen Forderungen positionieren und dann damit vergleichen, wie Fraktionen im Bundestag tatsächlich abgestimmt haben – unabhängig von ihren Versprechen. 28. Januar 2025 Bilanz der Ampel-Regierung: Kaum Fortschritt von der Fortschrittskoalition Mit unserem Koalitionstracker haben wir drei Jahre lang die angekündigten Pläne der Ampel-Koalition überwacht. Die abschließende Auswertung zeigt: Nur jedes vierte Vorhaben wurde umgesetzt. 23. Januar 2025 Kriegsopferrenten: Steuergeld für NS-Kollaborateure Während etliche Holocaustüberlebende keinerlei Entschädigung bekamen, zahlt Deutschland bis heute SS-Angehörigen, Wehrmachtssoldaten und NS-Kollaborateuren in ganz Europa zusätzliche Renten."
year_published = 2025
