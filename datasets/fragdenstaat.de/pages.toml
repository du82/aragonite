["https://fragdenstaat.de/artikel/exklusiv/2025/02/abschiebepolitik-ein-fragwuerdiges-angebot-briefe-bamf"]
title = "Abschiebepolitik: Ein fragwürdiges Angebot"
description = "Das Bundesamt für Migration und Flüchtlinge (BAMF) schickt Briefe an Asylsuchende, um sie zur freiwilligen Ausreise nach Griechenland zu bewegen. Es wird suggeriert, dass sich die Situation für Geflüchtete verbessert habe – ohne Garantien.&nbsp;"
full_description = "AbschiebepolitikEin fragwürdiges AngebotDas Bundesamt für Migration und Flüchtlinge (BAMF) schickt Briefe an Asylsuchende, um sie zur freiwilligen Ausreise nach Griechenland zu bewegen. Es wird suggeriert, dass sich die Situation für Geflüchtete verbessert habe – ohne Garantien. von Vera Deleja-Hotko – 12. Februar 2025 Bluesky Mastodon Auf Mastodon teilenBitte geben Sie die Domain Ihrer Mastodon-Instanz ein.https:// Share! Kurzlink kopieren Teilen… Vier Monate kostenlose Unterkunft mit „Vollverpflegung”, ein Abholservice vom Flughafen und ein Griechischkurs inklusive. Was sich wie das Angebot eines All-Inclusive-Reiseanbieters liest, stammt vom Bundesamt für Migration und Flüchtlinge (BAMF). Die Behörde hat zahlreiche Briefe mit einem fragwürdigen Angebot an Schutzsuchende in Deutschland geschickt. Das Ziel: Sie zur freiwilligen Ausreise nach Griechenland bewegen – obwohl ihr Asylverfahren in Deutschland noch läuft. Griechenland ist bislang dafür bekannt, Asylsuchende auf der Straße sich selbst zu überlassen. Die Bundesregierung sucht seit Jahren nach Möglichkeiten, um Asylsuchende, die über Griechenland erstmals registriert wurden, massenhaft abzuschieben. Doch die Situation in Griechenland ist für Schutzsuchende verheerend. Viele leben auf der Straße, ohne Arbeit, ohne medizinische Versorgung. Deutsche Gerichte widersprechen deshalb immer wieder den Abschiebeplänen der Bundesregierung. Erst im August 2024 hatte das Verwaltungsgericht Gelsenkirchen festgestellt, dass es „unzumutbar“ sei, Menschen nach Griechenland abzuschieben. Geflüchtete seien dort in „ernsthafter Gefahr“ für „unmenschliche oder erniedrigende Behandlung“. Eine Abschiebung verstoße daher gegen die Europäische Menschenrechtskonvention, erklärte das Gericht. „Zwangsweise Rückführungen angestrebt“Glaubt man dem Schreiben des BAMF, so hat sich die Situation in Griechenland ein halbes Jahr nach diesem harten Urteil grundlegend geändert. Durch das „Integrationsprogramm Helios+“ gäbe es ausreichend Unterkünfte, Versorgung und zahlreiche Angebote, um „ein eigenständiges Leben in Griechenland zu beginnen“, schreibt das BAMF in dem Brief, den wir im Wortlaut veröffentlichen. Doch wie kommt die Bundesregierung zu dieser Einschätzung? Auf Nachfrage können weder das BAMF noch das Bundesinnenministerium (BMI) Details zu den Unterkünften und Leistungen nennen. Helios+ sei ein „nationales griechisches Integrationsprogramm“, erklären die deutschen Behörden und verweisen auf das griechische Migrationsministerium. Das Programm Helios+ startete erst vor wenigen Tagen, am 6. Februar 2025, schreibt uns das BAMF auf Anfrage. Im ersten Jahr wird es von der Europäischen Kommission finanziert, danach trägt Griechenland die Kosten selbst. Es soll sich zunächst an Schutzsuchende richten, die freiwillig nach Griechenland zurückkehren. Auf unsere Anfrage schreibt das BAMF aber, dass „langfristig“ auch eine „zwangsweise Rückführung angestrebt“ werde. Das griechische Migrationsministerium und die EU-Kommission haben auf mehrfache Nachfrage nicht reagiert. Um Menschen leichter abschieben zu können, will sich Deutschland schon länger finanziell daran beteiligen, die Unterbringung und Versorgung von Schutzsuchenden in Griechenland zu verbessern. 2021 unterzeichnete der damalige Innenminister Horst Seehofer (CSU) eine entsprechende Absichtserklärung. Im März 2022 griff seine Nachfolgerin Nancy Faeser (SPD) das Vorhaben auf. Die Verhandlungen über die Details sind bis heute nicht abgeschlossen. Das geht aus der Antwort der Bundesregierung auf eine Kleine Anfrage vom Dezember 2024 hervor. Auch das BAMF und das BMI bestätigen uns, dass die Verhandlungen noch nicht abgeschlossen sind. Die Bundesregierung verschickt also die Briefe, ohne sicher zu sein, dass sich die Situation für Asylsuchende in Griechenland bereits tatsächlich zum Positiven verändert hat. DranbleibenAbonnieren Sie unseren Newsletter um keine Recherche mehr zu verpassen!Bitte geben Sie hier nichts einE-MailAbonnierenAsylverfahren nicht beendet Die Briefe sorgen für große Verunsicherung unter den Asylsuchenden, sagt Andreas Meyerhöfer, rechtspolitischer Referent von Pro Asyl. Zahlreiche Menschen hätten sich in den vergangen Wochen bei der Asylrechtsorganisation gemeldet – so auch eine alleinerziehende Mutter von zwei Kindern aus Afghanistan. Das Asylverfahren der Mutter und ihrer Kinder läuft noch an. Das Schreiben kam in einem gelben Umschlag, wie es auch bei Asylbescheiden üblich ist. Das alleine habe schon emotionalen Stress ausgelöst, erklärt Meyerhöfer. Vom Inhalt ganz zu schweigen: Die Frau habe gedacht, sie habe einen Abschiebebescheid erhalten. Das BAMF suggeriert in dem Schreiben, dass der Asylantrag “aller Voraussicht nach abgelehnt oder als unzulässig betrachtet” werde. Es bestehe daher “keine langfristige Bleibeperspektive in Deutschland”. Der Frau wird nahegelegt, mit ihren Kindern freiwillig nach Griechenland auszureisen und innerhalb von sieben Tage den Online-Fragebogen auszufüllen – noch bevor das Asylverfahren in Deutschland überhaupt abgeschlossen ist. Was ist Helios+? Über das sogenannte „Integrationsprogramm Helios+“ ist bisher wenig bekannt. Folgendes wissen wir aus der Presseanfrage an das BAMF:Helios+ startete am 6. Februar 2025. Welche Schutzsuchenden für das Programm in Frage kommen, wird zunächst von Deutschland und dann von Griechenland geprüft. Das aktuell vom BAMF verschickte Formular ist keine Anmeldung zu Helios+. Laut eigener Aussage will das BAMF damit „Personen identifizieren, die nach Griechenland zurückkehren möchten“ und die Kriterien für Helios+ erfüllen. Das Schreiben wird derzeit sowohl an Schutzsuchende verschickt, deren Asylantrag abgelehnt wurde, als auch an Menschen, die sich noch im Asylverfahren befinden. Schutzsuchende, deren Verfahren noch nicht abgeschlossen ist, erhalten das Schreiben in einem gelben Umschlag, der Hinweis für ein förmliches Schreiben. Bei abgeschlossenen Verfahren erfolgt die Zustellung regulär.Es gibt aktuell zwei Programme, die eine Versorgung von Geflüchteten in Griechenland sicherstellen sollen: Helios+ und ein von der EU-Kommission finanziertes „Überbrückungsprogramm“. In beiden Programmen würden Geflüchtete in Griechenland eine Unterkunft, Verpflegung und Sozialberatung erhalten. Allerdings ziele nur Helios+ auf eine „langfristige Integration“ ab. Das Überbrückungsprogramm dauert laut BAMF nur „die ersten Monate“, nachdem die Schutzsuchenden nach Griechenland zurückgekehrt sind. Dort würden dann auch die notwendigen Dokumente vorbereitet werden, um anschließend in das Programm Helios+ aufgenommen zu werden, schreibt das BAMF. Eine Garantie, vor dem Verlassen Deutschlands in das Programm Helios+ aufgenommen zu werden, scheint es nicht zu geben. → Hier die Antworten des BAMF im Wortlaut/ 3DokumentendetailsZeige/verstecke TextPDF herunterladen123Artikel teilen Bluesky Mastodon Auf Mastodon teilenBitte geben Sie die Domain Ihrer Mastodon-Instanz ein.https:// Share! Kurzlink kopieren Teilen… Über den:die Autor:in Vera Deleja-HotkoVera ist Journalistin und leitet das Investigativ-Team von FragDenStaat.E-Mail: vera.deleja-hotko@okfn.de (PGP), Bluesky: @veradelejahotko.bsky.social, Signal 5. Februar 2025 Bundespolizeiakademie:Professor mit rechter Vergangenheit unterrichtet wiederNachdem seine rechte Vergangenheit aufgedeckt wurde, sollte ein umstrittener Dozent nicht länger Bundespolizist*innen ausbilden. Nun ist er überraschend wieder zurück in der Lehre. Das sorgt für Unruhe an der Polizeihochschule."
