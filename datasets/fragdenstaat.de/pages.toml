title = "Zensurheberrecht Klage 2019 – FragDenStaat"
description = """
Die zuständige Ministerin Julia Klöckner.                                                –                                                Bild: G20 Argentina, CC-BY 2.0"""
full_description = '⚡⚡ #Zensurheberrecht abschaffen! Weil wir ein staatliches Gutachten zu Krebsrisiken von Glyphosat veröffentlicht haben, wollte die Bundesregierung uns mithilfe des Urheberrechts zwingen, es wieder zu löschen. Nach dem Landgericht Köln entschieden auch Oberlandesgericht und Bundesgerichtshof: Das war rechtswidrig. Wir haben gewonnen. Jetzt muss sich auch politisch etwas verändern: Das #Zensurheberrecht muss abgeschafft werden! Zum offenen Brief Mehr Details Spenden Der offene Brief Unser gemeinsamer Brief an Bundesjustizministerin Lambrecht – das Zensurheberrecht muss abgeschafft werden! / 2 Dokumentendetails Zeige/verstecke Text PDF herunterladen 1 2 Frau Bundesministerin Christine Lambrecht Bundesministerium der Justiz und für Verbraucherschutz Mohrenstraße 37 10117 Berlin Berlin, 11.12.2019 Offener Brief zu Rechtsstreiten um Glyphosat-Gutachten des BfR Sehr geehrte Frau Bundesministerin, die Unterzeichnenden dieses offenen Briefes fordern Sie hiermit auf, sich innerhalb der Bundesregierung dafür einzusetzen, dass ... 1. missbräuchlicher Einsatz urheberrechtlicher Ansprüche bei vom Bund verantworteten Inhalten – wie jüngst gegen die zivilgesellschaftliche Initiative “FragDenStaat” im Falle des Glyphosat-Gutachtens des Bundesinstituts für Risikobewertung – gestoppt werden und zukünftig unterbleiben, und dass 2. im Zuge der anstehenden Umsetzung der CDSM-Richtlinie der EU die Regelungen des Urheberrechtsgesetzes zu amtlichen Werken so ausgestaltet werden, dass der intendierte freie Zugang der Menschen, z. B. der Journalistinnen und Journalisten zu staatlichen Publikationen praktisch erleichtert wird, und zwar konkret durch eine entsprechende Vermutungsregelung in § 5 Abs. 2 UrhG. Bundesbehörden setzen in wiederholten Fällen urheberrechtliche Rechtsdurchsetzung mit dem einzigen Ziel ein, das öffentliche Bekanntwerden bestimmter Schriftstücke zu verhindern – die nicht nur nach dem Informationsfreiheitsgesetz des Bundes, sondern nach allen Grundlagen verantwortungsbewussten staatlichen Handelns frei zugänglich sein sollten. Die Klage gegen die Veröffentlichung des Glyphosat-Gutachtens des Bundesinstituts 1 für Risikobewertung ist nur der jüngste Fall dieses Einsatzes urheberrechtlicher Positionen in zensur-ähnlicher Weise. In einem anderen Fall untersagte das Bundesverteidigungsministerium und damit die Bundesregierung selbst die Veröffentlichung von militärischen Lageberichten, ebenfalls unter Berufung auf das Urheberrecht, obwohl die fraglichen Dokumente mutmaßlich noch nicht einmal die urheberrechtliche Schöpfungshöhe erreichen. Nicht nur bringt diese Art taktischer Zweckentfremdung legitimer urheberrechtlicher 1 siehe https://fragdenstaat.de/aktionen/zensurheberrecht-klage-2019/ Schutzmechanismen das Urheberrecht als Instrument insgesamt in Verruf. Es widerspricht auch dem angeblichen Selbstverständnis der Bundesregierung von “good governance” und den Grundprinzipien von Initiativen wie der Open Government Partnership (OGP), wenn die Exekutive auf höchster Ebene selbst bzw. über nachgeordnete Behörden mithilfe des Urheberrechts die freie Berichterstattung von Medien behindert. Was diese taktische Durchsetzung urheberrechtlicher Positionen gegen die Interessen der Allgemeinheit angeht, muss das genannte Vorgehen zur Unterdrückung von Informationen ein Ende haben, sowohl im aktuellen Fall des Glyphosat-Gutachtens als auch insgesamt. In Bezug auf den rechtlichen Rahmen werden bereits seit einiger Zeit Anpassungen des § 5 des Urheberrechtsgesetzes gefordert, die im Zuge der nun anstehenden Umsetzung der EU-Richtlinie zum Urheberrecht im Digitalen Binnenmarkt (CDSM-RiLi) Teil der ohnehin anstehenden Änderungen des UrhG sein müssen. Konkret geht es darum, die Urheberrechtsausnahme für “​andere amtliche Werke​” mit einer Vermutungsregelung zu versehen, derzufolge nicht anderweitig gekennzeichnete Inhalte, die im Verantwortungsbereich der öffentlichen Hand erstellt wurden, im Zweifel andere amtliche Werke in diesem Sinne und damit urheberrechtsfrei sind. Die legistischen Vorschläge hierzu sind Ihrem Hause bereits bekannt. Unterzeichnende Arne Semsrott Projektleiter FragDenStaat Open Knowledge Foundation Deutschland e. V. Abraham Taherivand Geschäftsführender Vorstand Wikimedia Deutschland e. V. Prof. Dr. Frank Überall Vorsitzender Deutscher Journalisten-Verband, Gewerkschaft der Journalistinnen und Journalisten Tina Groll Bundesvorsitzende Deutsche Journalistinnen- und Journalisten-Union - ver.di Christian Mihr Geschäftsführer Reporter ohne Grenzen e. V. Seite 2 von 2 Was ist das Problem mit dem Urheberrecht? Die Bundesregierung missbraucht das Urheberrecht, um die Veröffentlichung von Dokumenten zu verhindern. Das ist möglich, weil das deutsche Urheberrecht hoffnungslos veraltet ist. Es müsste eigentlich klarstellen, dass steuerfinanzierte Dokumente wie das Glyphosat-Gutachten frei verwendet werden dürfen. Statt Probleme wie dieses zu lösen, will die Bundesregierung aber das Urheberrecht weiter verschärfen. Weil die Politik versagt, müssen wir jetzt vor Gericht – wie schon 2014 gegen das Innenministerium – dafür kämpfen, dass das Urheberrecht nicht zum Zensurheberrecht wird. Warum hat euch Bundesregierung verklagt? Das Bundesinstitut für Risikobewertung, das dem Landwirtschaftsministerium (damals: Julia Klöckner (CDU)) untersteht, hat 2015 die Krebsursachen des Unkrautvernichtungsmittels Glyphosat untersucht, vor allem die Bildung von Tumoren. Wir haben das Gutachten auf Basis des Umweltinformationsgesetzs beim Institut angefragt, erhalten und veröffentlicht. Das wollte das Bundesinstitut mit seiner Klage verhindern. Es wollte mithilfe des Urheberrechts erreichen, dass wir das Gutachten löschen. Und es will uns auch einschüchtern: Denn die Abmahnanwälte der Bundesregierung wollten, dass wir mehr als 1.200 Euro zahlen – obwohl dem Bundesinstitut gar kein Schaden entstanden ist. Die zuständige Ministerin Julia Klöckner. – Bild: G20 Argentina, CC-BY 2.0 Was steht in dem Glyphosat-Gutachten? Das Bundesinstitut für Risikobewertung, das dem Landwirtschaftsministerium von Julia Klöckner (CDU) untersteht, hat 2015 die Krebsursachen des Unkrautvernichtungsmittels Glyphosat untersucht, vor allem die Bildung von Tumoren. Die Internationale Agentur für Krebsforschung stuft Glyphosat als „wahrscheinlich krebserregend“ ein, die Bundesbehörde geht nicht davon aus. Dabei wird ihr vorgeworfen, bei wichtigen Untersuchungen zu Glyphosat nicht unabhängig geforscht, sondern von der Industrie abgeschrieben zu haben. Mit Zustimmung von Klöckner wurden Glyphosat-Produkte 2019 auf dem deutschen Markt zugelassen. Wie hat der Rechtsstreit angefangen? Im Frühjahr erwirkte das Bundesinstitut für Risikobewertung eine einstweilige Verfügung gegen uns. Uns drohte eine Strafzahlung bis zu 250.000 Euro. Das Landgericht Köln entschied auf unsere Beschwerde hin allerdings, dass die Abmahnanwälte der Bundesregierung, die Kanzlei Gleiss Lutz, mehrfach formelle Fehler bei der Zustellung der einstweiligen Verfügung gemacht hatte. Einer Veröffentlichung des Gutachtens stand dann nichts mehr im Weg – bis zur erneuten Klage durch die Bundesregierung. In der Zwischenzeit hatten fast 45.000 Personen das Gutachten auch angefragt und erhalten – nachdem das Bundesinstitut extra eine eigene Plattform gebaut hatte, mit der es die Veröffentlichung der Gutachten verhindern wollte. Wie viel Geld kostet der Rechtsstreit? Wir haben insgesamt rund 20.000 Euro für unsere Verteidigung ausgegeben. Die Kosten für die Bundesregierung sind deutlich höher. Offenbar hat das Bundesinstitut für Risikobewertung über 200.000 Euro ausgegeben, um mithilfe des Urheberrechts Berichterstattung zu behindern. Das Glyphosat-Gutachten / 6 Dokumentendetails Zeige/verstecke Text PDF herunterladen 1 2 3 4 5 6 AGJ( Seite 1 von 6 �ll- I BfR 6-6211-o5-a4a1o23 Anlage I 04.09.2015 Stellungnahme des BfR zur IARC-Monographie über Glyphosat Vorwort Der Entwurf des Bewertungsberichtes Glyphosat wurde im März (RAR, eng/. Renewal Assessment Report) für 2014 veröffentlicht. Im Februar 2015 wurde der durch das Bundesinstitut für Risikobewertung (BfR) erstellte und nach der Konsultation mit den Mitgliedsstaaten und der Öffentlichkeit überarbeitete RAR für Glyphosat im Rahmen eines Experten-Treffens bei der Europäischen Behörde für Lebensmittelsicherheit (EFSA, eng/. European Food Safety Authority) diskutiert. Im Nachgang zu diesem Treffen wurde der RAR für Glyphosat dur�h das BfR nochmals ergänzt. Es wurden weitere Erläuterungen zu bestimmten Sachtragen und zusätzliche Bewertungstabellen zur Klarstellung eingefügt. Am 01. April 2015 wurde diese ergänzte Version an das Bundesamt für Verbraucherschutz und Lebensmittelsicherheit (BVL) zur Weiterleitung an die EFSA übermittelt. Die Internationale Agentur für Krebsforschung (IARC, eng/. International Agency for Research on Cancer), eine Einrichtung der Weltgesundheitsorganisation (WHO, eng/. World Health Organization), hat Glyphosat auf Grundlage der weltweit frei verfügbaren Literatur zu Glyphosat bewertet und den Wirkstoff als "wahrscheinlich krebserzeugend für den Menschen (Gruppe 2A)" beurteilt. Die vollständige Monographie zu Glyphosat (Volume 112) wurde am Als State) 29. Juli 2015 veröffentlicht. berichterstattender Mitgliedstaat europäische Verfahren (RMS, zur erneuten eng/. Rapporteur Genehmigung Member des Wirkstoffes für das Glyphosat wurde Deutschland von der EFSA beauftragt, eine Bewertung dieser IARC-Monographie bis zum 31. August 2015 zu erstellen, damit dieser wissenschaftliche Bericht noch im laufenden Verfahren berücksichtigt werden kann. Das BfR hat diese Bewertung in Form eines Addendums zum vorangegangenen RAR erstellt und an das BVL zur Weiterleitung an die EFSA übermittelt. Dieses Addendum Mitgliedsstaaten kommentiert. wird in einer Konsultation von allen anderen Auf einem Experten-Treffen der EFSA ("Pesticides Peer Review teleconference TC 117 Mammalian Toxicology") wird das Ergebnis der Konsultation am 29. September 2015 beraten. Die resultierende europäische Bewertung der IARC­ Monographie wird von der EFSA in ihre Schlussfolgerung ("EFSA conclusion") im erneuten Genehmigungsverfahren zu Glyphosat einfließen und an die EU-Kommission übermittelt. Danach wird der abschließende RAR durch die EFSA veröffentlicht werden. Um die Integrität des Entscheidungsprozesses zu schützen, ist eine vorherige überarbeiteten RAR, einschließlich des Addendums, nicht angezeigt. Veröffentlichung des · Seite 2 von 6 Zusammenfassung der Bewertung der IARC-Monographie Auf Grundlage der epidemiologischen Studien an Menschen kommt die IARC zur der Schlussfolgerung, dass es begrenzte Hinweise für die Kanzerogenität von Glyphosat beim Menschen gebe (,. There is limited evidence in humans for the carcinogenicity of glyphosate"). Der RMS hält wie die IARC die drei anderen IARC-Kategorien (,.Evidence suggesting Iack of carcinogenicity", carcinogenicity") .Jnadequate evidence of carcinogenicity", .,Sufficient evidence of zur Klassifizierung der Ergebnisse aus den Humanstudien für nicht anwendbar. Die Bewertung der epidemiologischen Studien durch den RMS, im Ergebnis der durchgeführten Konsultationen, entspricht weitgehend der Bewertung durch die IARC. Gleichwohl wird vom RMS festgestellt, dass die Studien keine konsistent positive Assoziation zeigen und insbesondere die aussagestärkste Studie keinen Effekt nachweist. Es wird vom RMS darauf hingewiesen, dass die bislang vorliegenden epidemiologischen Studien prinzipiell nicht zwischen den von Glyphosat hervorgerufenen Effekten und denen von Pflanzenschutzmitteln (PSM) oder Beistoffen differenzieren können. Auf Grundlage der Studien zur Kanzerogenität bei Tieren kommt die IARC zu der Schlussfolgerung, dass es ausreichend Hinweise für die Kanzerogenität von Glyphosat bei Versuchstieren gebe (.. There is sufficient evidence in experimental animals for the carcinogenicity of g/yphosate") . Die IARC verweist in diesem Zusammenhang insbesondere auf zwei Studien, in denen Glyphosat einen positiven Trend für die Häufigkeit von seltenen Nierentumoren und Hämangiosarkomen bei männlichen Mäusen und von Inselzelladenomen der Bauchspeicheldrüse bei männlichen Ratten bewirkte. Für die Gesamtbeurteilung des kanzerogenen Potenzials von Glyphosat ist jedoch von Bedeutung, dass deutlich mehr Tierstudien durchgeführt wurden, als durch die Bestimmungen der Verordnung (EG) Nr. 1107/2009 gefordert werden. Vom RMS wurden für die Spezies Maus fünf Langzeitfütterungsstudien zur Kanzerogenität und für die Spezies Ratte neun Studien zur chronischen Toxizität und Kanzerogenität berücksichtigt; in sieben Studien an Ratten erfolgte die Verabreichung von Glyphosat über die Nahrung und in zwei Studien über das Trinkwasser. Elf dieser Studien lagen als Originalstudien vor. Sie wurden unter GLP­ Bedingungen und nach harmonisierten OECD-Testrichtlinien durchgeführt. Aus diesen Gründen stützt sich die Bewertung des RMS vorrangig auf diese elf Studien. ln der Präambel für die Arbeit der IARC ist vorgeschrieben, dass ausschließlich öffentlich zugängliche Studien berücksichtigt werden dürfen. Daher konnte die IARC nicht alle vom RMS bewerteten Studien in der Monographie zu Glyphosat (Volume 112) berücksichtigen. ln Anlage ist eine Übersicht zu ausgewählten Tumorinzidenzen aus drei Studien an CD-1 Mäusen beigefügt. · • Nierenturnare ln zwei Studien an CD- 1 Mäusen und einer Studie an Swiss Albino Mäusen zeigt die statistische Auswertung mit dem Cochran-Armitage-Test (linearer Trend-Test) einen signifikanten Trend, wohingegen ein paarweiser Vergleich keinen statistisch signifikanten Unterschied zwischen den einzelnen Gruppen ergab. Dabei lagen die kombinierten lnzidenzen für Adenome und Karzinome innerhalb des lnzidenzbereichs der historischen Kontrollen von bis zu 6 Prozent. Außerdem ist von Bedeutung, dass die bei den höchsten Dosierungen von 1460 bis 4841 mg/kg Körpergewicht pro Tag beobachteten Effekte durch übermäßige Toxizität beeinflusst worden sein können. ln V Seite 3 von 6 beiden Studien an CD-1 Mäusen, jedoch nicht in der Studie an Swiss Albino Mäusen, war die Zunahme des Körpergewichtes im Vergleich mit der Kontrollgruppe um mehr als 15 Prozent reduziert, die Sterblichkeit war jedoch nicht verändert. Diese Dosierungen liegen oberhalb der von der OECD empfohlenen Höchstdosierung von 1000 mg/kg Körpergewicht pro Tag für diese Tierversuche und können beim Menschen bereits nach einmaliger Aufnahme zu Todesfällen führen. • Hämangiosarkome ln zwei Studien an CD-1 Mäusen wurden die lnzidenzen von Hämangiosarkomen in männlichen Mäusen mit zusätzlichen statistischen Methoden ausgewertet. Für beide Studien ergab die Auswertung mit dem Cochran-Armitage-Test .ßinen signifikanten Trend, wohingegen ein paarweiser Vergleich keinen statistisch signifikanten Unterschied zwischen den einzelnen Gruppen ergab. Für Hämangiosarkome in männlichen Mäusen liegt der lnzidenzbereich der historischen Kontrollen bei bis zu 12 Prozent, wenn verschiedene Organe berücksichtigt werden'
