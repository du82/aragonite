full_description = '''Issue Type: Bug Created: 2011-12-05T17:36:41.000+0000 Last Updated: 2012-07-12T14:08:50.000+0000 Status: Resolved Fix version(s): Reporter: Massimiliano Torromeo (mtorromeo) Assignee: Ralph Schindler (ralph) Tags: - Zend\Code\Reflection I don't see any valid reason to do this as I cannot use anymore tag names with underscores which were allowed in zf 2.0 dev2 That instruction only normalize the tag name internally. I don't see any problem in use tags with scores in their names. The tag works but the underscore is stripped and if in my code I need to check for that tag, I have to search without underscores. Anyway I don't see the point in filing bugs here anymore if I have to see it ignored again 6 months from now. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
