["https://framework.zend.com/blog/2017-12-14-expressive-3-dev.html"]
title = "Expressive 3 Preview - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Last week, the PSR-15 working group voted to start its review phase. PSR-15 seeks to standardize server-side request handlers and middleware, and both Stratigility and Expressive have been implementing draft specifications since their version 2 releases. Entering the review phase is an important moment: it means that the working group feels the specification is stable and ready for adoption. If, after the review period is over, no major changes are required, the specification can be presented to the PHP-FIG core committed for a final acceptance vote, at which point it will be frozen and ready for mass adoption. Our plan is to have Stratigility and Expressive follow the new specification in its final form. To that end, we have been executing on a plan to prepare all our projects that work with PSR-15 to adopt the latest round of changes. The latest round of changes to the specification prior to entering the review period were as follows: The namespace of the draft specification was changed from Interop\Http\ServerMiddleware to Interop\Http\Server. These will therefor become Psr\Http\Server once the specification is accepted. The DelegateInterface was renamed to RequestHandlerInterface, and the method it defines renamed to handle(). The MiddlewareInterface's second argument to process() was updated to typehint against RequestHandlerInterface. The package shipping the interface was split into two, http-interop/http-server-handler and http-interop/http-server-middleware; these will become psr/http-server-handler and psr/http-server-middleware, respectively, once the package is accepted. The http-server-middleware packages depend on the http-server-handler packages. These changes, of course, are not backwards compatible, and our attempts to write a polyfill library were ultimately unsuccessful. As a result, we decided to bump the major version of all libraries currently depending on the draft specification. These changes ensure users can install the new development versions of packages by feeding an appropriate development constraint.'''
