["https://framework.zend.com/manual/1.12/en/learning.layout.conclusions.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Zend_Layout is a very simple wrapper around Zend_View which provides you immediately with the benefits of a Two Step View, giving you the flexibility to create a site-wide design into which you may inject your application content. If you're looking closely at the examples, however, you may come away with the idea that the functionality is relatively limited: how do you alter the page title, inject an optional script tag, or even create an optional sidebar? These questions are addressed with the concept of a "Composite View" -- and are the subject of the next chapter in the tutorial, which covers view "placeholders." Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
