["https://framework.zend.com/blog/2017-12-06-zend-db-2.9.0.html"]
title = "A new release of zend-db - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = "Today, we released zend-db 2.9.0! This is our first new feature release in over 18 months, and contains 7 bug fixes, 6 new features, numerous unit test additions, and many documentation improvements. zend-db is an important component of many PHP projects, and we know that its support is crucial for many people. As such, we allocated a number of weeks to triaging the various open issues and patches (more than 50) to ensure we would provide a stable release. We also dropped support for PHP 5.5 (EOL last year) and HHVM; zend-db 2.9 and above now only support PHP 5.6 and PHP 7+ releases. We are planning a 3.0 release of zend-db release sometime in 2018. This new major version will contain new features sucha as extended DDL support for different database vendors (currently, most support targets MySQL), and support for SEQUENCE. Additionally, that release will drop support for PHP versions older than 7.1. If you want to contribute to zend-db, you are more than welcome! For more information, read the Zend Framework contribution guide. We also extend thanks to our community review team for their efforts in making this release of zend-db possible. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy"
