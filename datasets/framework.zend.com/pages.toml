title = "Expressive 3 Alpha 3 - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Today, we pushed the final changes and fixes that culminated in the Expressive Installer and Skeleton 3.0.0alpha3 release! We released 3.0.0alpha1 on Tuesday, 6 February 2018, and 3.0.0alpha2 on Wednesday, 7 February 2018. While they were usable, there were a few issues we discovered that we felt should be addressed before a public announcement. 3.0.0alpha3 represents a stable, testable release. Currently, we do not have a completed migration path for 3.0; this is our work in the coming weeks. Additionally, there may yet be changes coming as we get your feedback. As such, we recommend: This will install the skeleton, and then start prompting you for specific components you want to install, including choice of PSR-11 container, choice of router, choice of template engine, and choice of error handler. Generally speaking, we recommend the default values, except in the case of the template engine (which defaults to none; choose the engine you're most comfortable with). Once your selections are made, the skeleton will install dependencies; when it is complete, you can enter the newly created directory to begin development: You can specify an alternate directory when calling composer create-project; when you do, you can also specify the specific version separate from the root package: Version 3 of Expressive will work with PSR-15 (HTTP server request handlers) middleware and request handlers only. You will be writing these to create your application. The skeleton project now ships with zend-expressive-tooling by default, and maps its expressive command as a composer command: This will create the class App\XClacksOverheadMiddleware, and tell you where it has been created. You can then edit it: Once your middleware is created, register it in the container as an invokable, via the config/autoload/dependencies.global.php file: PSR-15 defines two interfaces. In the previous section, we demonstrated implementing the MiddlewareInterface. That interface references another, the RequestHandlerInterface.'''
