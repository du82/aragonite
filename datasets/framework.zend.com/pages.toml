full_description = 'Provides logic to easily create aggregate listeners, without worrying about manually detaching events Implementors of this interface may report on the existence of unknown input, as well as retrieve all unknown values. Interface that aggregates a Zend\Paginator\Adapter\Abstract just like IteratorAggregate does for Iterators. This class is used in DocBlockGenerator and creates the needed Tag classes depending on the tag. So for example an @author tag will trigger the creation of an AuthorTag class. Bcrypt algorithm using crypt() function of PHP with password hashed using SHA2 to allow for passwords >72 characters. Strategy used to discover methods to be considered as endpoints for dependency injection based on implemented interfaces, annotations and method names Dependency injector that can generate instances using class definitions and configured instance parameters Proxy used to analyze how instances are created by a given Di. Overrides Zend\Di\Di to produce artifacts that represent the process used to instantiate a particular instance Generator that creates the body of a service locator that can emulate the logic of the given Zend\Di\Di instance without class definitions Parses the properties of a class for annotations in order to create a form and input filter definition. A view helper to render the hidden input with a Session progress id for file uploads progress tracking. A view helper to render the hidden input with a Session progress id for file uploads progress tracking. A view helper to render the hidden input with a UploadProgress id for file uploads progress tracking. A sockets based (stream\socket\client) adapter class for Zend\Http\Client. Can be used on almost every PHP environment, and does not require any special extensions. A Zend\Http\Cookies object is designed to contain and maintain HTTP cookies, and should be used along with Zend\Http\Client in order to manage cookies across HTTP requests and responses. Abstract file loader i