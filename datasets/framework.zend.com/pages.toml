["https://framework.zend.com/manual/2.4/en/in-depth-guide/services-and-servicemanager.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = 'Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ In the previous chapter we’ve learned how to create a simple “Hello World” Application in Zend Framework 2. This is a good start and easy to understand but the application itself doesn’t really do anything. In this chapter we will introduce you into the concept of Services and with this the introduction to Zend\ServiceManager\ServiceManager. A Service is an object that executes complex application logic. It’s the part of the application that wires all difficult stuff together and gives you easy to understand results. For what we’re trying to accomplish with our Blog-Module this means that we want to have a Service that will give us the data that we want. The Service will get it’s data from some source and when writing the Service we don’t really care about what the source actually is. The Service will be written against an Interface that we define and that future Data-Providers have to implement. When writing a Service it is a common best-practice to define an Interface first. Interfaces are a good way to ensure that other programmers can easily build extensions for our Services using their own implementations. In other words, they can write Services that have the same function names but internally do completely different things but have the same specified result. In our case we want to create a PostService. This means first we are going to define a PostServiceInterface. The task of our Service is to provide us with data of our blog posts. For now we are going to focus on the read-only side of things. We will define a function that will give us all posts and we will define a function that will give us a single post. As you can see we define two functions. The first being findAllPosts() that is supposed to return all posts and the second one being findPost($id) that is supposed to return the post matching the given identifier $id. What’s new in here is the fact that we actually define a return value that doesn’t exist yet. We make the assumption that the return value all in all are of type Blog\Model\PostInterface. We will define this class at a later point and for now we simply create the PostService first.'
author = "Zend, a Rogue Wave Company"
year_published = 2025
