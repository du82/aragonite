full_description = '''Issue Type: Bug Created: 2011-11-19T05:36:33.000+0000 Last Updated: 2012-02-23T16:59:18.000+0000 Status: Resolved Fix version(s): Reporter: Oscar Merida (omerida) Assignee: Matthew Weier O'Phinney (matthew) Tags: Related issues: Attachments: It seems that the Zend\Mvc\Router\Http\Part::factory() method does not convert the whole configuration to an array, as the $option['child_routes'] is an instance of Zend\Config\Config in my case. The following patch seems to fix this, by converting $options['child_routes'] to an array before invoking the constructor. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
