["https://framework.zend.com/blog/2017-02-07-laravel-homestead.html"]
title = "Using Laravel Homestead with Zend Framework Projects - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = "Laravel Homestead is an interesting project by the Laravel community that provides a Vagrant box for PHP developers. It includes a full set of services for PHP developers, such as the Nginx web server, PHP 7.1, MySQL, Postgres, Redis, Memcached, Node, and more. One the most interesting features of this project is the ability to enable it per project. This means you can run a vagrant box for your specific PHP project. In this post, we'll examine using it for Zend Framework MVC, Expressive, and Apigility projects. In each case, installation and usage is exactly the same. The first step is to install the laravel/homestead vagrant box. This box works with a variety of providers: VirtualBox 5.1, VMWare, or Parallels. Homestead, by default, uses the host name homestead.app, and requires that you update your system hosts file to point that domain to the virtual machine IP address. To faciliate that, Homestead provides integration with the vagrant-hostsupdater Vagrant plugin. We recommend installing that before your initial run of the virtual machine: If we install Homestead per-project, we will have a full development server configured directly in the local folder, without sharing services with other projects. This is a big plus! To use Homestead per-project, we need to install the laravel/homestead package within our Zend Framework, Apigility, or Expressive project. This can be done using Composer with the following command: By default, the vagrant box is set up at address 192.168.10.10 with the hostname homestead.app. You can change the IP address in Homestead.yaml if you want, as well as the hostname (via the sites[].map key). The Homestead.yaml configuration file contains all details about the vagrant box configuration. The following is an example: This configuration file is very simple and intuitive; for instance, the folders to be used are reported in the folders section; the map value is the local folder of the project, the to value is the folder on the virtual machine."
