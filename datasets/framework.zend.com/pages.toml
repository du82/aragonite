["https://framework.zend.com/manual/1.12/en/migration.06.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ When upgrading from a previous release to Zend Framework 0.6 or higher you should note the following migration notes. We encourage use of the Response object to aggregate content and headers. This will allow for more flexible output format switching (for instance, JSON or XML instead of XHTML) in your applications. By default, dispatch() will render the response, sending both headers and rendering any content. You may also have the front controller return the response using returnResponse(), and then render the response using your own logic. A future version of the front controller may enforce use of the response object via output buffering. There are many additional features that extend the existing API, and these are noted in the documentation. The main changes you will need to be aware of will be found when subclassing the various components. Key amongst these are: Zend_Controller_Front::dispatch() by default traps exceptions in the response object, and does not render them, in order to prevent sensitive system information from being rendered. You can override this in several ways: Zend_Controller_Dispatcher_Interface::dispatch() now accepts and returns a The Request Object instead of a dispatcher token. Zend_Controller_Router_Interface::route() now accepts and returns a The Request Object instead of a dispatcher token. The constructor now accepts exactly three arguments, Zend_Controller_Request_Abstract $request, Zend_Controller_Response_Abstract $response, and Array $params (optional). Zend_Controller_Action::__construct() uses these to set the request, response, and invokeArgs properties of the object, and if overriding the constructor, you should do so as well. Better yet, use the init() method to do any instance configuration, as this method is called as the final action of the constructor."
author = "Zend, a Rogue Wave Company"
year_published = 2025
clearnet = "https://framework.zend.com/manual/1.12/en/migration.06.html"
