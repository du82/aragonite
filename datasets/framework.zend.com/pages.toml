["https://framework.zend.com/manual/1.12/en/doc-standard.file-formatting.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ XML files from translated languages must also include a revision tag containing the revision of the corresponding English-language file the translation was based on. The maximum line length, including tags, attributes, and indentation, is not to exceed 100 characters. There is only one exception to this rule: attribute and value pairs are allowed to exceed the 100 chars as they are not allowed to be separated. Line termination follows the Unix text file convention. Lines must end with a single linefeed (LF) character. Linefeed characters are represented as ordinal 10, or hexadecimal 0x0A. Note: Do not use carriage returns (CR) as is the convention in Apple OS's (0x0D) or the carriage return - linefeed combination (CRLF) as is standard for the Windows OS (0x0D, 0x0A). Opening block tags should have no whitespace immediately following them other than line breaks (and indentation on the following line). Closing block tags may be preceded by whitespace equivalent to the current indentation level, but no more than that amount. The first child tag should open directly below its parent, with no empty line between them; the last child tag should close directly before the closing tag of its parent. The opening <programlisting> tag must indicate the appropriate "language" attribute and be indented at the same level as its sibling blocks. <programlisting> sections must not add linebreaks or whitespace at the beginning or end of the section, as these are then represented in the final output. The <programlisting> tag should contain the "language" attribute with a value appropriate to the contents of the program listing. Typical values include "css", "html", "ini", "javascript", "php", "text", and "xml". For program listings containing only PHP code, PHP tags (e.g., "<?php", "?>") are not required, and should not be used. They simply clutter the narrative, and are implied by the use of the <programlisting> tag.'''
