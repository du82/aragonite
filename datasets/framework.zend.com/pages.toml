title = "Security Advisory - Security - Zend Framework"
description = "Zend Framework project official website"
full_description = "The package zendframework/zend-developer-tools provides a web-based toolbar for introspecting an application. When updating the package to support PHP 7.3, a change was made that could potentially prevent toolbar entries that are enabled by default from being disabled. A test was added to the package to verify that only whitelisted entries should be aggregated when configuring the toolbar, and the code updated to comply. The Zend Framework team thanks the following for identifying the issues and working with us to help protect its users: Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy"
