["https://framework.zend.com/participate/contributor-guide.html"]
title = "Contributor Guide - Participate - Zend Framework"
description = "Zend Framework project official website"
full_description = '''In the spirit of open-source software, you can contribute as little or as much as you like: bug reports, patches, full components or documentation are all equally appreciated. The following section describes contributing to Zend Framework. So, you've found what you think might be a bug. Before you file it, we'd ask that you ensure that what you have is indeed a bug, by doing a little due-diligence (which also is good information to add to the bug report): You don't have to do all of those, but by doing a few of them, it helps ensure that your bug report is complete and will get tended to. By and large, this framework is built and maintained by the community. This means that process for submitting something back, be it a patch, some documentation, or new feature requires some level of community interaction. We proudly host our code on GitHub. If you're not already familar with git or GitHub, take a moment to read through our CONTRIBUTING.md. The steps to create a patch are: Use this forum to ask questions, particularly around usage, configuration, etc. Do _not_ use it to report issues, unless you discover an issue in the process of discussing a question; if you _do_ discover an issue, please then follow-up by creating an issue in the relevant repository as detailed in the section above entitled "So, you think you found a bug". If you want to get the latest news delivered straight to your inbox, consider subscribing to our contributor newsletter! Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
