full_description = "Today, we released zend-db 2.9.0! This is our first new feature release in over 18 months, and contains 7 bug fixes, 6 new features, numerous unit test additions, and many documentation improvements. zend-db is an important component of many PHP projects, ... (continue) When writing middleware-based applications, at some point you will need to emit your response. PSR-7 defines the various interfaces related to HTTP messages, but does not define how they will be used. Diactoros defines several utility classes for these pur ... (continue) Every PHP application generates errors, warnings, and notices and throws exceptions. If we do not log this information, we lose a way to identify and solve problems at runtime. Moreover, we may need to log specific actions such as a user login and logout ... (continue) When writing PSR-7 middleware, at some point you'll need to return a response. Maybe you'll be returning an empty response, indicating something along the lines of successful deletion of a resource. Maybe you need to return some HTML, or JSON, or just plai ... (continue) PHP 7.2 will be released later this year (2017). This version contains some interesting additions, including two new security features: support of the Argon2 password hash algorithm, and the ext/sodium extension wrapping the libsodium library. With these n ... (continue) We've been working towards our various Apigility on Expressive goals, and have recently published two new components: zend-problem-details zend-expressive-hal These components provide response representations for APIs built with PSR-7 middleware. Spe ... (continue) We've been working on the Apigility on Expressive initiative for a couple months now, and have a bit of progress to report. First, if you're unfamiliar with the initiative, please head over and read the RFC. In this post, we'll discuss what's done and read ... (continue) APIs are all the rage these days, and a tremendous number of them are being written in PHP. When APIs were first gaining popularity, this seemed like a match made in heaven: query the database, pass the results to json_encode(), and voilà! API payload! In ... (continue)"
