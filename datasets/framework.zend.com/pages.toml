["https://framework.zend.com/manual/1.12/en/coding-standard.coding-style.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = 'Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Short tags are never allowed. For files containing only PHP code, the closing tag must always be omitted (See General standards). When a string is literal (contains no variable substitutions), the apostrophe or "single quote" should always be used to demarcate the string: When a literal string itself contains apostrophes, it is permitted to demarcate the string with quotation marks or "double quotes". This is especially useful for SQL statements: Strings must be concatenated using the "." operator. A space must always be added before and after the "." operator to improve readability: When concatenating strings with the "." operator, it is encouraged to break the statement into multiple lines to improve readability. In these cases, each successive line should be padded with white space such that the "."; operator is aligned under the "=" operator: An indexed array may start with any non-negative number, however all base indices besides 0 are discouraged. When declaring indexed arrays with the Array function, a trailing space must be added after each comma delimiter to improve readability: It is permitted to declare multi-line indexed arrays using the "array" construct. In this case, each successive line must be padded with spaces such that beginning of each line is aligned: Alternately, the initial array item may begin on the following line. If so, it should be padded at one indentation level greater than the line containing the array declaration, and all successive lines should have the same indentation; the closing paren should be on a line by itself at the same indentation level as the line containing the array declaration: When using this latter declaration, we encourage using a trailing comma for the last item in the array; this minimizes the impact of adding new items on successive lines, and helps to ensure no parse errors occur due to a missing comma.'
author = "Zend, a Rogue Wave Company"
year_published = 2025
