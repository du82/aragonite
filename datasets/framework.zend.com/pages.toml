["https://framework.zend.com/issues/browse/ZF2-10.html"]
title = "Issue - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Issue Type: Bug Created: 2009-03-23T11:57:59.000+0000 Last Updated: 2012-10-08T20:15:38.000+0000 Status: Closed Fix version(s): Reporter: meugen (meugen) Assignee: Ben Scholzen (dasprid) Tags: - Zend\Config If the /path/to/config.xml to substitute config1.xml, then everything works correctly. But if you substitute config2.xml error I'm not sure there's any way to resolve this issue due to the other than creating a dummy key to force an array: This issue also exists when using the toArray() method of Zend_Config. The problem is that you just want the array to ALWAYS have the same layout. Config files tent to grow and be extended, just like XML files. In my opinion the Zend_Config API should work the same as the of SimpleXml, here two extended examples and their output: h2. Using SimpleXML h2. Using Zend_Config_Xml possibly a global Zend_Config or other Zend_Config* types issue, I have not tested that_ Although this is fixable, fixing it will always break backwards compatibility. When a developer knows there's only 1 item, code such as this will be broken : I would advise against modifying this for ZF 1.x - not sure how this will be handled in ZF 2, but introducing this backwards incompatibility is not a good idea in any case... The only other option is to modify just the magic/fluent notation, but that will make things complicated and will cause inconsistency between fluent notation and array notation, which should be avoided. One idea I have had is to introduce a children() method that always returns an iterator/array regardless of whether there is is one or many children: This issue has been closed on Jira and moved to GitHub for issue tracking. To continue following the resolution of this issues, please visit: https://github.com/zendframework/zf2/issues/2443 Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API'''
