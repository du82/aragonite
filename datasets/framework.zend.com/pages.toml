["https://framework.zend.com/issues/browse/ZF-1000.html"]
title = "Issue - Zend Framework"
description = "Zend Framework project official website"
full_description = "Issue Type: Improvement Created: 2007-03-01T18:06:08.000+0000 Last Updated: 2007-07-05T14:43:53.000+0000 Status: Resolved Fix version(s): Reporter: Gavin (gavin) Assignee: Thomas Weidner (thomas) Tags: - Zend_Date I also recommend using a static setOptions() method to set options that affect an entire component (i.e. all instances or static methods), where the option name would be 'usePhpDateFormat'. See Zend_Session::setOptions() for an example. When we remove the format specifier we have the problem that other functions which use date format specifier within Zend_Date would not interact correct... The functions calling Zend_Locale would use php format, the functions within Zend_Date would use ISO format. And when I want to use php format for Zend_Date's toString function why should I call a function within Zend_Locale ??? This would be unlogic and inconsistent. Make Zend_Date only affect for php format... this leads to problems within the functions calling Zend_Locale for getting results... we have to add logic to detect if php or iso format is specified within Zend_Locale and then act the expected way... change to iso, call function, revert to previous format. But this stretches our code by about 50 lines... Zend_Locale is often called for all localizing/normalizing tasks within Zend_Date. The first can not be accepted... and second... we have already a HUGE class... shall we really do it this way ?? Having setOptions() implemented is no problem for all static avaiable parameters. This will be done the next days. I added setOptions with one if the latest SVN to Zend_Date and Zend_Locale. usePhpDateFormat was deleted. Both classes use now setOptions() seperately. But also to mention, I see some negative sideeffects having one class set to iso and the other to php as it has to be included. I now solve this side effects by more than 100 lines of code... In my opinion there is no usecase in which a user would use iso with the one and php with the other class. And both classes are close related to each other because Zend_Locale gives Zend_Date the possibility to act locale aware."
