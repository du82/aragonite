description = "Zend Framework project official website"
full_description = '''Issue Type: Bug Created: 2010-06-17T01:08:37.000+0000 Last Updated: 2012-11-20T21:38:05.000+0000 Status: Open Fix version(s): Reporter: Leopold Chmielewski (poldekch) Assignee: None Tags: - Zend_Dojo While creating customDijit by captureStart/End methods if inside exist another customDijit then outer dijit gets dojoType from last inner customDijit. Example: $this->customDijit()->captureStart('outer',array('dojoType'=>'outerType')); echo $this->customDijit('inner','content',array('dojoType'=>'innerType'); echo $this->customDijit()->captureEnd('outer'); Result inner and outer get the same type of 'innerType'. Other params/attribs seems unaffected but not extensively tested. Workaround: $innerContent = $this->customDijit('inner','content',array('dojoType'=>'innerType'); echo $this->customDijit('outer',$innerContent,array('dojoType'=>'outerType')); Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
