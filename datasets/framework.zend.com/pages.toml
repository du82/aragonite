["https://framework.zend.com/manual/2.4/en/in-depth-guide/zend-form-zend-form-fieldset.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = 'Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ So far all we did was read data from the database. In a real-life-application this won’t get us very far as very often the least we need to do is to support full Create, Read, Update and Delete operations (CRUD). Most often the process of getting data into our database is that a user enters the data into a web <form> and the application then uses the user input and saves it into our backend. We want to be able to do exactly this and Zend Framework provides us with all the tools we need to achieve our goal. Before we jump into coding, we need to understand the two core components for this task first. So let’s take a look at what these components are and what they are used for. The first component that you have to know about is Zend\Form\Fieldset. A Fieldset is a component that contains a reusable set of elements. You will use the Fieldset to create the frontend-input for your backend-models. It is considered good practice to have one Fieldset for every Model of your application. The Fieldset-component, however, is no Form, meaning you will not be able to use a Fieldset without attaching it to the Form-component. The advantage here is that you have one set of elements that you can re-use for as many Forms as you like without having to re-declare all the inputs for the Model that’s represented by the Fieldset. The main component you’ll need and that most probably you’ve heard about already is Zend\Form\Form. The Form-component is the main container for all elements of your web <form>. You are able to add single elements or a set of elements in the form of a Fieldset, too. Explaining how the Zend\Form component works is best done by giving you real code to work with. So let’s jump right into it and create all the forms we need to finish our Blog module. We start by creating a Fieldset that contains all the input elements that we need to work with our Blog-data.'
author = "Zend, a Rogue Wave Company"
year_published = 2025
