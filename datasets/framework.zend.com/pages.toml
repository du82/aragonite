["https://framework.zend.com/blog/2017-08-08-expressive-rest-representations.html"]
title = "REST Representations for Expressive - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = '''We've been working towards our various Apigility on Expressive goals, and have recently published two new components: These components provide response representations for APIs built with PSR-7 middleware. Specifically, they provide: These two formats provide both JSON and XML representation options (the latter through a secondary proposal). What can clients expect when they make a request to your API? Will they get a wall of text? or some sort of serialization? If it's a serialized format, which ones do you support? And how is the data structured? The typical answer will be, "we'll provide JSON responses." That answers the serialization aspect, but not the data structure; for that, you might develop and publish a schema for your end users, so they know how to parse the response. These and all of the previous are questions that a representation format answers. A well-considered representation format will: Errors need separate representation, as they are not requestable on their own; they are returned when something goes wrong, and need to provide enough detail that the consumer can determine what they need to change in order to perform a new request. We chose Problem Details to standardize on when starting the Apigility project as it has very few requirements, but can model any error easily. The ability to link to documentation detailing general error types provides the ability to communicate with your consumers about known errors and how to correct them. Application resources generally should have their own schema, but having a predictable structure for providing relational links (answering the "what can I do next" question) and embedding related resources can help those making clients or those consuming your API to automate many of their processes. Instead of having a list of URLs they can access, they can hit one resource, and start following the composed links; when they present data, they can also present controls for the embedded resources, making it simpler to make requests to these other items.'''
author = "Zend, a Rogue Wave Company"
