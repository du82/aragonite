["https://framework.zend.com/manual/2.4/en/in-depth-guide/preparing-db-backend.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ In the previous chapter we have created a PostService that returns some data from blog posts. While this served an easy to understand learning purpose it is quite impractical for real world applications. No one would want to modify the source files each time a new post is added. But luckily we all know about databases. All we need to learn is how to interact with databases from our ZF2 application. But there is a catch. There are many database backend systems, namely SQL and NoSQL databases. While in a real-world you would probably jump right to the solution that fits you the most at the time being, it is a better practice to create another layer in front of the actual database access that abstracts the database interaction. We call this the Mapper-Layer. The term “database abstraction” may sound quite confusing but this is actually a very simple thing. Consider a SQL and a NoSQL database. Both have methods for CRUD (Create, Read, Update, Delete) operations. For example to query the database against a given row in MySQL you’d do a mysqli_query('SELECT foo FROM bar'). But using an ORM for MongoDB for example you’d do something like $mongoODM->getRepository('bar')->find('foo'). Both engines would give you the same result but the execution is different. So if we start using a SQL database and write those codes directly into our PostService and a year later we decide to switch to a NoSQL database, we would literally have to delete all previously coded lines and write new ones. And in a few years later a new thing pops up and we have to delete and re-write codes again. This isn’t really the best approach and that’s precisely where database abstraction or the Mapper-Layer comes in handy. Basically what we do is to create a new Interface. This interface then defines how our database interaction should function but the actual implementation is left out. But let’s stop the theory and go over to code this thing."
author = "Zend, a Rogue Wave Company"
year_published = 2025
