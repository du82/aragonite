["https://framework.zend.com/manual/1.12/en/introduction.installation.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Installing Zend Framework is extremely simple. Once you have downloaded and extracted the framework, you should add the /library folder in the distribution to the beginning of your include path. You may also want to move the library folder to another – possibly shared – location on your file system. » Download the latest stable release. This version, available in both .zip and .tar.gz formats, is a good choice for those who are new to Zend Framework. » Download the latest nightly snapshot. For those who would brave the cutting edge, the nightly snapshots represent the latest progress of Zend Framework development. Snapshots are bundled with documentation either in English only or in all available languages. If you anticipate working with the latest Zend Framework developments, consider using a Subversion (SVN) client. Using a » Subversion (SVN) client. Zend Framework is open source software, and the Subversion repository used for its development is publicly available. Consider using SVN to get Zend Framework if you already use SVN for your application development, want to contribute back to the framework, or need to upgrade your framework version more often than releases occur. » Exporting is useful if you want to get a particular framework revision without the .svn directories as created in a working copy. » Check out a working copy if you want contribute to Zend Framework, a working copy can be updated any time with » svn update and changes can be commited to our SVN repository with the » svn commit command. An » externals definition is quite convenient for developers already using SVN to manage their application's working copies. The URL for the trunk of Zend Framework's SVN repository is: » http://framework.zend.com/svn/framework/standard/trunk Once you have a copy of Zend Framework available, your application needs to be able to access the framework classes. Though there are » several ways to achieve this, your PHP » include_path needs to contain the path to Zend Framework's library."
