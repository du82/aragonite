["https://framework.zend.com/blog/2017-07-13-apigility-on-expressive-update.html"]
title = "Apigility on Expressive Update for 2017-07-13 - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = "We've been working on the Apigility on Expressive initiative for a couple months now, and have a bit of progress to report. These two provide us the representations that will be returned by your API. Problem Details is used to describe API errors — whether those are due to the client sending bad information, or server-side errors that occur. HAL is used to provide your API payloads to the client. We provide a ProblemDetailsResponseFactory for you to compose in middleware. When you encounter an error condition, you can use it to generate and return a Problem Details response. It has built-in content negotiation, and will return either a JSON or XML response based on the Accept client request header. We provide a custom exception interface, ProblemDetailsException, which you can implement that defines a number of getter methods for retrieving information to use when building a Problem Details response. (We also provide a trait, CommonProblemDetailsException, that implements the various getters, allowing you to focus on constructors.) We provide ProblemDetailsMiddleware, which acts as error handling middleware, catching exceptions and PHP errors and turning them into Problem Details responses via the ProblemDetailsResponseFactory. If you throw a ProblemDetailsException, this middleware will pull data from it to fully populate the error details! We feel these three faculties allow a great deal of flexibility in how you handle errors for your APIs. Low-level value objects representing relational links and HAL resources. These can be created manually, and independently of any other ZF components. A LinkGenerator that uses a PSR-7 request instance and a composed UrlGenerator to allow creating links that reference application routes. Renderers for both JSON and XML. Each accepts a HAL resource, with its relational links, and produces the serialized version. A ResourceGenerator that maps an object to related metadata, and the related metadata to a strategy for creating the HAL resource. The shipped metadata and strategies use zend-hydrator for extracting data from objects, and zend-paginator awareness for producing pagination relational links."
author = "Zend, a Rogue Wave Company"
year_published = 2025
