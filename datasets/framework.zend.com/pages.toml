full_description = '''Issue Type: Patch Created: 2010-06-18T00:56:26.000+0000 Last Updated: 2012-11-20T21:37:58.000+0000 Status: Open Fix version(s): Reporter: Hying (rahy) Assignee: None Tags: - Zend_Search_Lucene In some cases the search for 'dingo' returns no results, however the search for 'ding' return the correct hits, although the index contains documents with the text 'dingo'. ------------ from ---------------------- } else { // We have reached term we are looking for break; } ------------ to ------------------------ } else { // We have reached term we are looking for $highIndex = $mid; break; Because delta can be exact 0 if strcmp for a term in the middle match (line 1905). Then, highIndex can be 520, lowIndex 500. For further serch, the hightIndex should start at the current match with the index '$mid=510' and not 520 !!! Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
