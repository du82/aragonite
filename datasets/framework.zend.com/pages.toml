full_description = '''Issue Type: Bug Created: 2010-12-09T04:05:38.000+0000 Last Updated: 2011-06-07T15:26:20.000+0000 Status: Resolved Fix version(s): Reporter: Alexander Thomas (fanatique) Assignee: Satoru Yoshida (satoruyoshida) Tags: - Zend\Db Afterwards the execution is stopped although it should throw a Zend\Db\Adapter\Exception to enable handling this error properly. Maybe I should point out that this ticket refers to ZF2 (therefore it is set to "affects next major release")? Hi, Alexsander. Do you mean the string "FAILED TO FIND" exists in http://framework.zend.com/svn/framework/… ? (FYI) Ralph changed this issue 05/May/11.(please see this issue's History page). and, he is working for refactoring Zend\Db. exactly, This issue will be closed when refactored Zend\Db is merged. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
