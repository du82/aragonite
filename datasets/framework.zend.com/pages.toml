["https://framework.zend.com/security/advisory/ZF2016-02.html"]
title = "Security Advisory - Security - Zend Framework"
description = "Zend Framework project official website"
full_description = 'The implementation of ORDER BY and GROUP BY in Zend_Db_Select of ZF1 is vulnerable by the following SQL injection: We fixed the reported SQL injection using two regular expressions for the order() and the group() methods in Zend_Db_Select, created as the class constants REGEX_COLUMN_EXPR_ORDER and REGEX_COLUMN_EXPR_GROUP, respectively. These are defined as: This regexp is different from the previous REGEX_COLUMN_EXPR, which used the character pattern [\w]*; we now require at least one word boundary ([\w]+). This SQL injection attack does not affect Zend Framework 2 and 3 versions because the implementations of Zend\Db\Sql\Select::order() and Zend\Db\Sql\Select::group() do not manage parenthetical expressions. The Zend Framework team thanks the following for identifying the issues and working with us to help protect its users: Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'
