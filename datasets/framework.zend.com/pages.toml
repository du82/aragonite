["https://framework.zend.com/issues/browse/ZF2-110.html"]
title = "Issue - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Issue Type: Bug Created: 2011-12-05T17:41:21.000+0000 Last Updated: 2012-10-08T20:15:37.000+0000 Status: Closed Fix version(s): Reporter: Massimiliano Torromeo (mtorromeo) Assignee: Maks 3w (maks3w) Tags: - Zend\Code\Scanner I believe this issue has been rectified already. I ran this unit test against Zend\Code\Scanner\DocBlockScanner: And it passed. I've issued a PR (https://github.com/zendframework/zf2/pull/820) to get this test added to the ZF2 test suite. It seems I was wrong thinking that the problem was simply about tags without values. I still couldn't get my tags recognized with latest master and I found out that the issue was caused by a bug in the docblock cleaning function. The regular expression used with single quotes failed to recognize tabs (\t) and also the cleaned docblock was not passed to the scanner. You can send a Pull Request in Github with your patch. Anyway I tried to proposal but break some tests. This issue has been closed on Jira and moved to GitHub for issue tracking. To continue following the resolution of this issues, please visit: https://github.com/zendframework/zf2/issues/2445 Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
