Provides functionality to interact with Google data APIs
Subclasses exist to implement service-specific features"""
full_description = "Provides functionality to interact with Google data APIs Subclasses exist to implement service-specific features Provides Atom Publishing Protocol (APP) functionality. This class and all other components of Zend_Gdata_App are designed to work independently from other Zend_Gdata components in order to interact with generic APP services. Overrides the traditional socket-based adapter class for Zend_Http_Client to enable logging of requests. All requests are logged to a location specified in the config as $config['logfile']. Requests and responses are logged after they are sent and received/processed, thus an error could prevent logging. Represents the gCal:color element used by the Calendar data API to define the color of a calendar in the UI. Data model for a collection of Google Apps email list entries, usually provided by the Google Apps servers. Data model for a collection of Google Apps email list recipient entries, usually provided by the Google Apps servers. Assists in constructing queries for Google Apps email list recipient entries. Instances of this class can be provided in many places where a URL is required. Gdata Gapps Error class. This class is used to represent errors returned within an AppsForYourDomainErrors message received from the Google Apps servers. Represents the apps:emailList element used by the Apps data API. This class represents properties of an email list and is usually contained within an instance of Zend_Gdata_Gapps_EmailListEntry. Represents the apps:login element used by the Apps data API. This class is used to describe properties of a user, and is usually contained within instances of Zene_Gdata_Gapps_UserEntry or any other class which is linked to a particular username. Represents the apps:name element used by the Apps data API. This is used to represent a user's full name. This class is usually contained within instances of Zend_Gdata_Gapps_UserEntry. Represents the apps:nickname element used by the Apps data API. This is used to describe a nickname's properties, and is usually contained within instances of Zend_Gdata_Gapps_NicknameEntry."
