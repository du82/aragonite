full_description = '''Issue Type: Bug Created: 2011-11-14T08:49:05.000+0000 Last Updated: 2012-02-23T16:36:57.000+0000 Status: Resolved Fix version(s): Reporter: Alexey Kosov (mazafaka) Assignee: Matthew Weier O'Phinney (matthew) Tags: Related issues: - ZF2-89 c:\WebServer\htdocs>zf create project zf2test Creating project at C:/WebServer/htdocs/zf2test Note: This command created a web project, for more information setting up your V HOST, please see docs/README Notice: Undefined property: Zend\Code\Reflection\FileReflection::$contents in C: \WebServer\htdocs\lib\ZendFramework2\library\Zend\Code\Reflection\FileReflection .php on line 262 Notice: Undefined property: Zend\Code\Reflection\FileReflection::$contents in C: \WebServer\htdocs\lib\ZendFramework2\library\Zend\Code\Reflection\FileReflection .php on line 262 Zend\Tool does not work with ZF2. You can clone the ZendSkeletonApplication to get a base working ZF2 project. I'm closing this, as I'll be removing Zend\Tool prior to the upcoming beta3 release. The functionality is largely replaced by having the ZendSkeletonApplication repository, and we will be creating functionality for tooling surrounding our Zend\Console component for beta4. Yes. We'll likely build such functionality off a combination of Zend\Console and Zend\Code\Generator in the future; the current solution had design goals that we don't feel fit ZF2, and which are hard to maintain and extend. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
