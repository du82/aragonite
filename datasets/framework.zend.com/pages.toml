["https://framework.zend.com/manual/1.12/en/learning.layout.usage.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Basic usage of Zend_Layout is fairly trivial. Assuming you're using Zend_Application already, you can simply provide some configuration options and create a layout view script. To initialize Zend_Layout, add the following to your configuration file ("application/configs/application.ini"): The first line indicates where to look for layout scripts; the second line gives the name of the layout to use, minus the view script extension (which is assumed to be ".phtml" by default). Now that you have your configuration in place, you need to create your layout script. First, make sure that you've created the "application/layouts/scripts" directory; then, open an editor, and create the markup for your layout. Layout scripts are simply view scripts, with some slight differences. In the example above, you'll note the call to a layout() view helper. When you register the Zend_Layout resource, you also gain access to both an action and view helper that allow you access to the Zend_Layout instance; you can then call operations on the layout object. In this case, we're retrieving a named variable, $content, and echoing it. By default, the $content variable is populated for you from the application view script rendered. Otherwise, anything you'd normally do in a view script is perfectly valid -- call any helpers or view methods you desire. At this point, you have a working layout script, and your application is informed of its location and knows to render it. Within view scripts: use the layout() view helper, which returns the Zend_Layout instance registered with the front controller plugin. Since it returns the layout instance, you can also simply call methods on it, rather than assigning it to a variable. As with the view helper, since the action helper returns the layout instance, you can also simply call methods on it, rather than assigning it to a variable.'''
