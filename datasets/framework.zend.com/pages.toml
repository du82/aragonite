["https://framework.zend.com/manual/1.12/en/learning.form.decorators.composite.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ How might you represent this element as a Zend_Form_Element? How might you write a decorator to render it? Regardless, how would you then allow for discrete form inputs for the three segments (day, month, year)? The first two questions center around the form element itself: how would setValue() and getValue() work? There's actually another question implied by the question about the decorator: how would you retrieve the discrete date segments from the element and/or set them? The solution is to override the setValue() method of your element to provide some custom logic. In this particular case, our element should have three discrete behaviors: If an integer timestamp is provided, it should be used to determine and store the day, month, and year. If a textual string is provided, it should be cast to a timestamp, and then that value used to determine and store the day, month, and year. Internally, the day, month, and year will be stored discretely. When the value of the element is retrieved, it will be done so in a normalized string format. We'll override getValue() as well to assemble the discrete date segments into a final string. This class gives some nice flexibility -- we can set default values from our database, and be certain that the value will be stored and represented correctly. Additionally, we can allow for the value to be set from an array passed via form input. Finally, we have discrete accessors for each date segment, which we can now use in a decorator to create a composite element. Revisiting the example from the last section, let's assume that we want users to input each of the year, month, and day separately. PHP fortunately allows us to use array notation when creating elements, so it's still possible to capture these three entities into a single value -- and we've now created a Zend_Form element that can handle such an array value."
