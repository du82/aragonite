["https://framework.zend.com/blog/2017-08-17-php72-argon2-hash-password.html"]
title = "Protecting passwords with Argon2 in PHP 7.2 - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = "PHP 7.2 will be released later this year (2017). This version contains some interesting additions, including two new security features: support of the Argon2 password hash algorithm, and the ext/sodium extension wrapping the libsodium library. With these new features, PHP is the first programming language to adopt modern cryptography in its standard library. If you are reading this article before the general availability of 7.2, you need to compile PHP to use that version. You can download the source code from the PHP downloads site. Today, 17 August 2017, the most recent available version is 7.2.0 Beta 3 (file php-7.2.0beta3.tar.gz). Before compiling PHP, you need to install the argon2 library. If you are using a Debian/Ubuntu Linux distribution, you can run the following command: To compile PHP, you need to extract the previous source code in a folder and run the following commands: Please note the usage of the option --with-password-argon2 for including support for the Argon2 algorithm. This will install PHP 7.2 as the default PHP on your system. If you do not want to change the default PHP, you can omit the execution of the last command make install, or use the --prefix option to configure to specify an alternate location. In each of these cases, you will need to reference PHP 7.2 using the path of the folder installation. Argon2 is a password-based key derivation function winner of the Password Hashing Competition in July 2015. Argon2 provides security against brute force attacks using a predefined memory size, CPU time, and a degree of parallelism to prevent GPU attacks. It uses 3 parameters that control the memory requirements, the execution time, and the parallelism level. There are two main versions of this algorithm: Argon2i and Argon2d. Argon2i is the safest against side-channel attacks, while Argon2d provides the highest resistance against GPU cracking attacks. The implemented algorithm in PHP is Argon2i (v1.3), and it can be provided via the $algo parameter to the password_hash() function. The signature of password_hash() is as follows:"
