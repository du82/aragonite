full_description = '''Issue Type: Bug Created: 2010-06-17T03:06:54.000+0000 Last Updated: 2010-06-30T14:19:37.000+0000 Status: Resolved Fix version(s): Reporter: Maarten Tibau (webtrix) Assignee: Christian Albrecht (alab) Tags: - Zend_Form I have searched in the ZF code, in the file Zend/View/Helper/FormSelect.php on line 64 you have the public function formSelect. When I do a var_dump of the $attribs, I see that the select options that I pass are in this variable and not it the variable $options. Everything works OK. I can not find where the options are being set or why my select options aren't set into the $options variable. In ZF version 1.9.7 I don't have this problem. What I did find out is that when I do a vardump of $options variable form the Zend/View/Helper/FormSelect.php file of ZF version 1.9.7. the select options are printed correctly. I'm going to try to find out where the $options variable is set because I don't think anything has been changed since the introduction of the ZF 1.10 version. I've been searching for a while but I just can't find where it goes wrong. The current solution stays the same as mentioned in the issue. I am not able to follow you - setOptions is the wrong method for what you want to achieve. Second you are using a custom Decorator Select, maybe there is something wrong with it. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
