["https://framework.zend.com/manual/2.4/en/in-depth-guide/review.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Throughout the past seven chapters we have created a fully functional CRUD-Application using music-blogs as an example. While doing so we’ve made use of several different design-patterns and best-practices. Now it’s time to reiterate and take a look at some of the code-samples we’ve written. This is going to be done in a Q&A fashion. Long answer: The importance of interfaces goes up the bigger your application becomes. If you can foresee that your application will be used by other people or is supposed to be extendable, then you should strongly consider to always code against interfaces. This is a very common best-practice that is not tied to ZF2 specifically but rather aimed at strict OOP programming. The main role of the multiple layers that we have introduced ( Controller -> Service -> Mapper -> Backend ) are to get a strict separation of concerns for all of our objects. There are many resources who can explain in detail the big advantages of each layer so please go ahead and read up on them. For a very simple application, though, you’re most likely to strip away the Mapper-layer. In practice all the code from the mapper layer often resides inside the services directly. And this works for most of the applications but as soon as you plan to support multiple backends (i.e. open source software) or you want to be prepared for changing backends, you should always consider including this layer. Long answer: there doesn’t need to be. Most code-duplication would come from the mapper-layer, too. If you take a closer look at the class you’ll notice that there’s just two things that are tied to a specific object. First, it is the name of the database-table. Second, it is the object-prototype that’s passed into the mapper. The prototype is already passed into the class from the __construct() function so that’s already interchangeable. If you want to make the table-name interchangeable, too, all you need to do is to provide the table-name from the constructor, too, and you have a fully versatile db-mapper-implementation that can be used for pretty much every object of your application."
author = "Zend, a Rogue Wave Company"
