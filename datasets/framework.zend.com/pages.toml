["https://framework.zend.com/manual/2.4/en/in-depth-guide/zend-db-sql-zend-stdlib-hydrator.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = 'Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ In the last chapter we have introduced the mapping layer and created the PostMapperInterface. Now it is time to create an implementation of this interface so that we can make use of our PostService again. As an introductionary example we will be using the Zend\Db\Sql classes. So let’s jump right into it. Before we can start using a database we should prepare one. In this example we’ll be using a MySQL-Database called blog which is accessible on the localhost. The database will have one table called posts with three columns id, title and text with the id being the primary key. For demo purpose, please use this database-dump. To create queries against a database using Zend\Db\Sql you need to have a database connection available. This connection is served through any class implementing the Zend\Db\Adapter\AdapterInterface. The most handy way to create such a class is through the use of the Zend\Db\Adapter\AdapterServiceFactory which listens to the config-key db. Let’s start by creating the required configuration entries and modify your module.config.php adding a new top-level key called db: As you can see we’ve added the db-key and inside we create the parameters required to create a driver instance. One important thing to note is that in general you do not want to have your credentials inside the normal configuration file but rather in a local configuration file like /config/autoload/db.local.php, that will not be pushed to servers using zend-skeletons .gitignore file. Keep this in mind when you share your codes! The next thing we need to do is by making use of the AdapterServiceFactory. This is a ServiceManager entry that will look like the following: Note the new Service that we called Zend\Db\Adapter\Adapter. Calling this Service will now always give back a running instance of the Zend\Db\Adapter\AdapterInterface depending on what driver we assign.'
