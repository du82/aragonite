full_description = 'Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ In the previous chapter we’ve come to learn how we can use the Zend\Form- and Zend\Db-components to create the functionality of creating new data-sets. This chapter will focus on finalizing the CRUD functionality by introducing the concepts for editting and deleting data. We start by editting the data. The one fundamental difference between an insert- and an edit-form is the fact that inside an edit-form there is already data preset. This means we need to find a way to get data from our database into the form. Luckily Zend\Form provides us with a very handy way of doing so and it’s called data-binding. All you need to do when providing an edit-form is to get the object of interest from your service and bind it to the form. This is done the following way inside your controller. Compared to the addAction() the editAction() has only three different lines. The first one is used to simply get the relevant Post-object from the service identified by the id-parameter of the route (which we’ll be writing soon). The second line then shows you how you can bind data to the Zend\Form-Component. We’re able to use an object here because our PostFieldset will use the hydrator to display the data coming from the object. Lastly instead of actually doing $form->getData() we simply use the previous $post-variable since it will be updated with the latest data from the form thanks to the data-binding. And that’s all there is to it. The only things we need to add now is the new edit-route and the view for it. The edit route is a normal segment route just like the route blog/detail. Configure your route config to include the new route: All that is really changing on the view-end is that you need to pass the current id to the url() view helper. To achieve this you have two options. The first one would be to pass the ID to the parameters array like'
