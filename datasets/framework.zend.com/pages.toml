["https://framework.zend.com/security/advisory/ZF2014-04.html"]
title = "Security Advisory - Security - Zend Framework"
description = "Zend Framework project official website"
full_description = '''The implementation of the ORDER BY SQL statement in Zend_Db_Select of Zend Framework 1 contains a potential SQL injection when the query string passed contains parentheses. The SQL injection occurs because we create a new Zend_Db_Expr() object, in presence of parentheses, passing directly the value without any filter on the string. We fixed the issue in the Zend_Db_Select::order() function using a more granular regular expression to match only SQL functions in an ORDER BY statement, such as ORDER BY ABS("zfproducts"."product_id"). The new regular expression is '/^[\w]*\(.*\)$/' instead of the previous '/\(.*\)/'. This change fixes the issue, filtering the input using quotes for the previous attack. This SQL injection attack does not affect Zend Framework 2 versions because the implementation of Zend\Db\Sql\Select::order() does not manage parenthetical expressions. The Zend Framework team thanks the following for identifying the issues and working with us to help protect its users: Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
