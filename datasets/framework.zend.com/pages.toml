["https://framework.zend.com/manual/2.4/en/in-depth-guide/first-module.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Now that we know about the basics of the Zend Framework 2 Skeleton Application, let’s continue and create our very own module. We will create a module named “Blog”. This module will display a list of database entries that represent a single blog post. Each post will have three properties: id, text and title. We will create forms to enter new posts into our database and to edit existing posts. Furthermore we will do so by using best-practices throughout the whole QuickStart. To be recognized as a module by the ModuleManager all we need to do is create a PHP class named Module under our module’s namespace, which is Blog. Create the file /module/Blog/Module.php We now have a module that can be detected by ZF2s ModuleManager. Let’s add this module to our application. Although our module doesn’t do anything yet, just having the Module.php class allows it to be loaded by ZF2s ModuleManager. To do this, add an entry for Blog to the modules array inside the main application config file at /config/application.config.php: At this point it’s worth taking a step back to discuss what modules are for. In short, a module is an encapsulated set of features for your application. A module might add features to the application that you can see, like our Blog module; or it might provide background functionality for other modules in the application to use, such as interacting with a third party API. Organizing your code into modules makes it easier for you to reuse functionality in other application, or to use modules written by the community. The next thing we’re going to do is add a route to our application so that our module can be accessed through the URL localhost:8080/blog. We do this by adding router configuration to our module, but first we need to let the ModuleManager know that our module has configuration that it needs to load."
