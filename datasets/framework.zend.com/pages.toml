["https://framework.zend.com/blog/2017-06-21-zend-hydrator.html"]
title = "Convert objects to arrays and back with zend-hydrator - Blog - Zend Framework"
description = "Zend Framework project official website"
full_description = "APIs are all the rage these days, and a tremendous number of them are being written in PHP. When APIs were first gaining popularity, this seemed like a match made in heaven: query the database, pass the results to json_encode(), and voilà! API payload! In reverse, it's json_decode(), pass the data to the database, and done! Modern day professional PHP, however, is skewing towards usage of value objects and entities, but we're still creating APIs. How can we take these objects and create our API response payloads? How can we take incoming data and transform it into the domain objects we need? Zend Framework's answer to that question is zend-hydrator. Hydrators can extract an associative array of data from an object, and hydrate an object from an associative array of data. Out-of-the-box, it only requires zend-stdlib, which is used internally for transforming iterators to associative arrays. However, there are a number of other interesting, if optional, features that require other components: In our examples below, we'll be demonstrating naming strategies and the delegating hydrator, so we will install the dependencies those need: What we have is a value object, with no way to publicly grab any given datum. We now want to represent it in our API. How do we do that? Let's say that somebody has just submitted a book via a web form or an API. We have the values, but want to create a Book out of them. The newInstanceWithoutConstructor() construct is necessary in this case because our class has required constructor arguments. Another possibility is to provide an already populated instance, and hope that the submitted data will overwrite all data in the class. Alternately, you can create classes that have optional constructor arguments. Most of the time, it can be as simple as this: create an appropriate hydrator instance, and use either extract() to get an array representation of the object, or hydrate() to create an instance from an array of data. Since a common rationale for extracting data from objects is to create payloads for APIs, you may find there is data in your object you do not want to represent."
author = "Zend, a Rogue Wave Company"
