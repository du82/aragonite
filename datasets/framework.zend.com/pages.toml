title = "Issue - Zend Framework"
description = "Zend Framework project official website"
full_description = "Issue Type: Improvement Created: 2010-06-17T11:44:43.000+0000 Last Updated: 2010-09-23T07:44:53.000+0000 Status: Postponed Fix version(s): - Next Major Release () Text Element: items[410412345][fieldname] Works perfect if I am just rendering the form normally (ie. echo $this->form; ) This time around though, I'm doing some more complicated stuff with the form and wanted to control exactly where and how the elements are rendered, so I thought I'd echo the subforms/elements directly in my view script. That would require Zend_Form_SubForm to have a belongsTo member as well, that is not the case atm. What is the way you see it? I would love to see that. I have a deeply nested set of elements that I finally got to name correctly using the elementsBelongTo property on their immediate subform parent, but that is making for some interesting returns in ::getValues($_POST) since Zend_Form is seeing multiple belongTos and nesting them oddly in the merge - element is getValues is merging the subForms' belongTos on top of array so that I end up with something like: I was planning to override getValues in my extended form and see if I can get it to drop the extra nesting. With that in mind, I think adding an option to iterate over all the parents would be great. The idea seems easier than what I'm doing above (elementsBelongTo and overriding the ::getValues() to fix the array). But you know this thing inside and out and know what kind of mess it would make to add that feature. I thought about what you said about adding a belongsTo member to SubForm and decided to give that a shot since my attempt at overriding ::getValues() above was turning into a bigger mess than it was worth. I can guarantee I've missed some obvious things/bugs/disasters in what I did, but I thought I'd pass it on and if there is anything you can use, have at it! I decided to go with 'parent' as the subForm member and used it to modify the belongsTo properties as needed. It basically grabs the parent of the previous form/subform and adds it to the current subform + the current's parent, a simple array. I extended Zend_Form and Zend_Form_SubForm (only so I could point it at my new Form class so it could pick up the parent property). I made a small change to Zend_Form_Decorator_FormElements::render method as follows:"
