["https://framework.zend.com/manual/2.4/en/in-depth-guide/understanding-routing.html"]
title = "Manual - Documentation - Zend Framework"
description = "Zend Framework project official website"
full_description = "Caution: The documentation you are viewing is for an older version of Zend Framework. You can find the documentation of the current version at: https://docs.zendframework.com/ Right now we have a pretty solid set up for our module. However, we’re not really doing all too much yet, to be precise, all we do is display all Blog entries on one page. In this chapter you will learn everything you need to know about the Router to create other routes to be able to display only a single blog, to add new blogs to your application and to edit and delete existing blogs. Before we go into details on our application, let’s take a look at the most important route types that Zend Framework offers. The first common route type is the Literal-Route. As mentioned in a previous chapter a literal route is one that matches a specific string. Examples for URLs that are usually literal routes are: Configuration for a literal route requires you to set up the route that should be matched and needs you to define some defaults to be used, for example which controller and which action to call. A simple configuration for a literal route looks like this: The second most commonly used route type is the Segment-Route. A segmented route is used for whenever your url is supposed to contain variable parameters. Pretty often those parameters are used to identify certain objects within your application. Some examples for URLs that contain parameters and are usually segment routes are: Configuring a Segment-Route takes a little more effort but isn’t difficult to understand. The tasks you have to do are similar at first, you have to define the route-type, just be sure to make it Segment. Then you have to define the route and add parameters to it. Then as usual you define the defaults to be used, the only thing that differs in this part is that you can assign defaults for your parameters, too. The new part that is used on routes of the Segment type is to define so called constraints. They are used to tell the Router what “rules” are given for parameters. For example, an id-parameter is only allowed to be of type integer, the year-parameter is only allowed to be of type integer and may only contain exactly four digits. A sample configuration can look like this:"
