title = "Issue - Zend Framework"
description = "Zend Framework project official website"
full_description = '''Issue Type: Bug Created: 2011-12-05T20:23:09.000+0000 Last Updated: 2012-06-14T21:05:48.000+0000 Status: Resolved Fix version(s): Reporter: david quintard (booradleys) Assignee: Matthew Weier O'Phinney (matthew) Tags: - Zend\Mvc\Controller Hi there, I'm using forward plugin like this: $result = $this->forward()->dispatch('another-controller', array('action' => 'anotheraction')); But i got the following error: Script "index/anotheraction.phtml" not found in path (my script view is here: another-controller/anotheraction.phtml) code from \Application\View\Listener::renderLayout(): [code] ... $layout = $this->view->render($this->layout, $vars); if($this->view->layout()->isEnabled()) { $response->setContent($layout); } else { $response->setContent($vars['content']); } ... [code] This is a problem of scope. When you call forward(), you end up creating a new RouteMatch which is passed on to the new controller. However, when execution is returned to the originating controller, the original RouteMatch object is used. Since the view listener is listening on the Application::dispatch event, this means that it looks only at the original RouteMatch. Zend Framework manages issues on GitHub. From the list below, please choose the package against which to report the issue, and then click the "Open Issue" button. Documentation Overview Training and Certification Support and Consulting Webinars Blog Zend Framework 2 - API Zend Framework 1 - API Participate Overview Slack Forums Contributor guide Code Manifesto Contributors Logos Get certified Privacy Policy'''
