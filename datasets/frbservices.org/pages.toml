["https://frbservices.org/news/fed360/issues/011525/cash-nuvision-federal-credit-union-e-manifest"]
title = "Nuvision Federal Credit Union E-Manifest Service Testimonial | Federal Reserve Financial Services"
description = "Hear from Nuvision Federal Credit Union on the benefits of adopting the E-Manifest Service."
full_description = "Fed Spotlight: Nuvision Federal Credit Union on ease of adopting the FedCash® E‑Manifest Service Cash | January 15, 2025 | Our world is becoming increasingly digital, with automated processes prevalent in everyday life. In support of digitalization, the Federal Reserve is working with the payments industry to advance Cash Visibility and bring greater transparency and efficiency to cash supply chain operations by identifying, tracking and sharing data about cash packages as they move between organizations. The Fed’s E-Manifest Service supports the movement toward Cash Visibility, as it enables financial institutions and armored carriers that work directly with the Fed to electronically process currency deposits and orders at Fed docks. It replaces the manual paper process for deposits and orders at Fed docks with technology that enables scanning and an electronic exchange of data. Nuvision Federal Credit Union (Off-site), headquartered in Southern California, has been experiencing the benefits of the E-Manifest Service since becoming an early adopter of the E-Manifest Service in May 2023. Watch this video (Off-site) to hear from Nuvision on how the E-Manifest Service has improved their day-to-day operations. Learn more Explore what other E-Manifest Service adopters, including BankNorth, Davis Bancorp and AXIOM Armored (Off-site), have to say about the benefits they’ve experienced. All financial institution customers of the Federal Reserve Banks and their servicing armored carriers can access the E-Manifest Service. To learn more and get started, visit the E-Manifest Service page and complete an expression of interest form."
year_published = 2025
