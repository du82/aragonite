["https://frbservices.org/news/fed360/issues/030425/education-resources-2025-spring-conference-preview"]
title = "Engage with the Fed at Spring 2025 Events | Federal Reserve Financial Services"
description = "Connect with Federal Reserve Financial Services at upcoming industry conferences. See a preview of key events where FRFS will engage on a variety of topics."
full_description = "Conference Connection: Engage with the Federal Reserve at spring 2025 events Education and Resources | March 4, 2025 | With spring on the horizon, mark your calendar to join Federal Reserve Financial Services (FRFS) at upcoming industry conferences. Below, see a preview of key events where FRFS will engage on a variety of topics, including current trends and insights about instant payments adoption and the FedNow® Service (Off-site), fraud and scams mitigation efforts, and the latest in payments innovation. America’s Credit Unions Governmental Affairs Conference The annual America’s Credit Unions Governmental Affairs Conference, formerly the Credit Union National Association Governmental Affairs Conference, will be held March 2-6 in Washington, D.C. FRFS representatives are pleased to join the largest gathering of credit unions and their service providers from across the U.S. to network on the meaningful work credit unions do to improve the financial well-being of their members. This year’s theme is “Together We Move – Moving with purpose. Moving with passion. Moving with strength.” Look for the FRFS booth #527 in the exhibit hall to discuss how credit unions can benefit from adoption of instant payments and the FedNow Service, the ISO® 20022 standard, and the latest trends in fraud mitigation. Attendees can also hear from Lance Wagner, assistant vice president of customer and industry relations, on how the FedNow Service could support various instant transfer use cases and evolve with new tools and capabilities on Tuesday, March 4 at 11 a.m. ET. Visit the America’s Credit Unions website (Off-site) for more information on the conference and the full program schedule. Independent Community Bankers of America (ICBA) LIVE FRFS representatives will be in Nashville, TN for the ICBA LIVE event, March 11-14. This annual conference allows community bankers, core service providers, fintechs and others from across the payments ecosystem to connect on unique issues facing community banks, identify solutions and take learnings back to individual local communities. Attendees are encouraged to partake in two FRFS “Meet the Expert” sessions: Erik Van Bramer, senior vice president and head of customer relations, and Joni Hopkins, vice president of customer relations, will lead a fireside chat discussing lessons learned from FedNow Service adopters, including use cases and how to productize and monetize instant payments on Tuesday, March 11 at 4:30 p.m. CT. Staci Shatsoff, assistant vice president of payments improvement, will present on fighting fraud in the current payments landscape, common fraud scenarios and trends, and gaps in fraud prevention tactics on Wednesday, March 12 at 12:30 p.m. CT. Be sure to stop by the exhibit hall at FRFS booth #114 to continue conversations around the above topics and for information on the payments offerings from the Fed. Visit the ICBA Live website (Off-site) for event information. Nacha® Smarter Faster Payments® 2025 Join FRFS at one of the largest gatherings for payments professionals, the Nacha Smarter Faster Payments Conference, in New Orleans on April 27-30. Smarter Faster Payments is an annual event focused on payments education to drive innovation, discuss new solutions and services, and provide opportunities to network. Visit the FRFS booth #802 in the exhibit hall, where attendees can engage on timely payment topics. During the exhibit hall hours, we’ll feature demonstrations of the FedNow Service so attendees can see the transaction flow and discuss features and functionalities. FRFS representatives also will speak on a variety of topics, including harnessing instant payments to solve real-life business problems, examining trends in cash payments, combatting fraud with information sharing and more. For a full list of topics and conference sessions with Fed speakers, visit our Events page and the Nacha website (Off-site). ACTION ITEM: Planning to attend these spring conferences or other events this year? Stay up to date on where we’re heading next by visiting our Industry Events page. Note: The Federal Reserve Banks do not sponsor or endorse any of the non-Federal Reserve Bank-related products, parties or entities mentioned in this publication. Speakers and sessions are subject to change. Smarter Faster Payments is a registered trademark of Nacha – The Electronic Payments Association."
