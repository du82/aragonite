["https://www.frbservices.org/central-bank/reporting-central"]
title = "Reporting Central | Federal Reserve Financial Services"
description = "Get information about the electronic reporting application, report forms, and instructions and documents for filing regulatory and financial reports."
full_description = "Home Central Bank Reporting Central Reporting Central The Federal Reserve uses reporting forms to collect data from bank holding companies, depository institutions, other financial and nonfinancial entities and consumers. Submission of the forms is required in some cases, voluntary in others. Some data are collected frequently, others only occasionally. The information gathered by these reports aids the Federal Reserve in carrying out its responsibilities for the conduct of monetary policy, the supervision and regulation of the banking industry and the protection of consumers’ rights. REPORTING CENTRAL Reporting Central provides a more secure, technically advanced and efficient system where institutions submit report data. Secure Logon Reporting Central Secure Logon RESOURCE CENTER STRUCTURE CENTRAL Structure Central provides holding companies and foreign banking organizations with information about our electronic reporting application, organizational structure information and relevant resources needed to prepare and file the FR Y-6 Annual Report of Holding Companies and FR Y-7 Annual Report of Foreign Banking Organizations. Secure Logon Structure Central Secure Logon RESOURCE CENTER SURVEY CENTRAL Survey Central provides consumers, financial institutions and non-financial entities with information about our electronic survey application and relevant documents needed for preparing and completing surveys. Secure Logon Survey Central Secure Logon RESOURCE CENTER Submitting FR Y-6 and FR Y-7 with Structure Central in 2025 In July 2024, the Federal Reserve announced a new electronic reporting application that will be known as Structure Central. This application implements changes to the FR Y-6 and FR Y-7 that were first proposed in the Federal Register on May 9, 2022, and finalized in a subsequent notice on Nov. 29, 2022. Structure Central enhances the overall reporter experience in filing the FR Y-6 and FR Y-7, providing a technically advanced and efficient system for the submission of accurate data. Learn more on the Structure Central Resources page. We're Here to Help Please contact your local Reporting Central District Contact with questions regarding electronic submission of financial data and reporting instructions. For assistance with setting up access to the Structure Central application via the FedLine Web Solution, contact the Federal Reserve's Support Center. Top of Page Reporting Central SPOTLIGHT Reporting Central Application Setup Reporting Central District Contacts Support Center Contacts Reporting and Reserves Business Continuity Contacts Central Data Repository (CDR) (Off-site) National Information Center (NIC) (Off-site)"
