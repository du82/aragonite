["https://frbservices.org/financial-services/check/feddetect"]
title = "FedDetect Duplicate Notification for Check"
description = "This page provides an overview of the FedDetect Duplicate Notification Check Notifier Service, which was developed to offer banks of first deposit (BOFDs) who are FedForward® customers daily reports of potential duplicate Treasury checks processed by the Federal Reserve Banks."
full_description = "Home Financial Services Check FedDetect® Duplicate Notification for Check FedDetect® Duplicate Notification for Check FedDetect Duplicate Notification for Check Services (FedDetect Duplicate Notification) offers banks of first deposit (BOFDs) early notice of potential duplicate checks processed by the Federal Reserve Banks. Reports are available for both commercial and Treasury checks deposited by your institution or another BOFD on the current day or within a specific date range. Notices are sent directly to your inbox via encrypted email and may be used at your discretion to supplement your own research and to take appropriate action. How can FedDetect Duplicate Notification help you? Do you want greater visibility into checks that your customers may be depositing at other institutions as well as your own financial institution? FedDetect Duplicate Notification provides notice of potential duplicate Treasury and commercial checks across any BOFD that deposits through FRFS. Do deposits at your own financial institution (e.g., ATM, mobile, over the counter) lack cross-platform duplicate detection? FedDetect Duplicate Notification provides notice of potential duplicate Treasury and commercial checks across multiple payment channels within your own institution Would you like timely notification of duplicate deposits, including those caused by operational errors, so that you can take appropriate action to reduce losses? FedDetect Duplicate Notification helps mitigate the loss of funds due to fraud or deposit capture errors. Service Details If your organization is a Check participant, you can enroll in FedDetect Duplicate Notification at no additional cost by enabling one or more of the available reports to provide notification of matching checks processed through the Federal Reserve Banks. FedDetect Duplicate Notification offers a Treasury Check Report and a Commercial Check Report. One or both reports can be scheduled for delivery to designated contacts at your institution. Reports are generated separately by BOFD routing number and will be delivered in distinct emails. Both reports: Provide details of each potential duplicate check your BOFD deposited and its associated matched item(s) available when the report is run Provide deposit details with available front and rear images of potential duplicate items from your own institution, as well as partial deposit information, and available front images of potential duplicate items from other BOFDs Generate secure email delivery at designated early-morning and end-of-processing day times Do not interrupt normal check processing and do not affect presentment of checks Report Descriptions Treasury Report: Provides notification of matching U.S. Treasury checks for the current processing day against U.S. Treasury checks that were presented on the current day or the previous 60 calendar days. Commercial Report: Provides notification of potential duplicate commercial checks processed by the Federal Reserve Banks on the current day or up to the previous eight calendar days. Sample Reports View FedDetect Duplicate Notification - Treasury Check Report sample (PDF) View FedDetect Duplicate Notification - Commercial Check Report sample (PDF) Easy sign-up There is no additional cost for Check participants. To enable notifications, existing Check Subscribers should: Log into their FedLine Web® or FedLine Advantage® Solution Click on the Check tab Click FedDetect Duplicate Notification for Check Services in the left navigation Add contacts, select reports and start receiving secure email notifications For Customers without Check Services access the Service Request Form (PDF) References FedDetect Duplicate Notification for Check Services Guide, available in FedLine® Training FedDetect Duplicate Notification for Check Services product sheet (PDF) Questions Contact FedACH® and Check Services Customer Support or submit a contact request and your relationship manager will reach out to you. Top of Page Check Check Home Check 21-Enabled Services Check Adjustments Services FedDetect® Duplicate Notification for Check Services FedForward® Image Deposit Services FedImage® and Electronic Check Services FedImage® and Electronic Check Services Home FedImage®-Enhanced Truncation Service FedImage® Services Presentment Point Services FedPayments® Reporter Service for Check Services FedReceipt® Services FedReceipt® Services Home Accelerated Imaged Returns Delivery Service FedReceipt Daily — Returns Questions to Discuss with Your Vendor FedReturn® Services Foreign and Canadian Check Service Image-Enabled Savings Bond Processing Paper Check Clearing Paper Check Clearing Services Home Forward Paper Check Clearing Services Return Paper Check Clearing Services 2024 Fees 2025 Fees Business Continuity Forms Resources Service Setup Check Services Setup Home Check 21-Enabled Products Technical Information Check Adjustments Service Federal Reserve Banks' Vendor Outreach Program FedImage® Services FedPayments® Reporter Service for Check Services FedReceipt®, FedForward® and FedReturn® Services Foreign Check - Including Canadian Paper Check Services Testing Opportunities"
