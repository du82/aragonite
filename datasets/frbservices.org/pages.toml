full_description = '''Home Central Bank Central Bank Programs The Federal Reserve System, the central bank of the United States, was founded by Congress to provide a safe, flexible and stable monetary and financial system. The Federal Reserve carries out the nation’s monetary policy guided by the goals set forth in the Federal Reserve Act, namely "to promote effectively the goals of maximum employment, stable prices, and moderate long-term interest rates." The Federal Reserve Banks offer a range of tools and information to assist financial institutions in meeting reporting requirements and understanding policies governing reserve balances, term deposits, and Discount Window lending programs. REPORTING CENTRAL Reporting Central provides financial institutions with information about our electronic reporting application, report forms, instructions and relevant documents needed for preparing and filing regulatory and financial reports. Learn More About Reporting Central RESERVES CENTRAL Reserves Central provides financial institutions with resources and tools to access information on reserve balances as well as comprehensive information on term deposits. Learn More About Reserves Central LENDING CENTRAL (DISCOUNT WINDOW) Lending Central (Discount Window) provides financial institutions with information about lending programs and discount rate tables, as well as guidelines to help them comply with the Federal Reserve's operating circulars and regulations. Learn More About Lending Central'''
