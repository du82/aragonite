full_description = "Home FedLine® Solutions FedMail® FedMail® FedMail is a cost-effective, electronic messaging system used to transmit information via email from the Federal Reserve Banks to organizations. FedMail provides same-day, and in some cases, real-time delivery of statements and information from a number of Federal Reserve Bank Services areas. To see a full list of available services, view the FedMail Service Descriptions. Discover how FedMail can benefit your organization Provides same-day or real-time delivery of statements and information Distributes communication to an email address Offers multiple email address delivery, including shared email accounts Works with your choice of formatting options, including TXT and HTML Provides flexibility to receive information in the body of the email or as an attachment Email option eliminates intensive paper distribution to staff members and allows for subsequent forwarding to others Complimentary contingency method for some FedLine Web® applications Enables you to receive information directly instead of having to contact your processor or correspondent Information currently available via FedMail includes: Accounting Capital Stock statements and advices Accounting Daily Statement of Account (Monthly) Billing Summary Statement of Service Charges Check Adjustment Messages and Images Check 21 FedForward®/Returns Deposit Acknowledgements Check 21 FedReceipt®/Presentment Notifications FedACH® Advices FedCash® Difference Advices Fedwire® Securities Reports and Advices Treasury and Defense Finance and Accounting Service (DFAS) ACH Reclamations Treasury Check Reclamations and Reports Sign up today To start using this service, visit the FedMail Setup page or contact your relationship manager. Top of Page FedLine Solutions FedLine Solutions Home FedLine Advantage® FedLine Command® FedLine Direct® FedLine Web® FedMail® 2024 Fees 2025 Fees Application and Connectivity Testing Business Continuity FedLine® Solutions Business C