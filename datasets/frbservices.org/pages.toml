["https://www.frbservices.org/central-bank/reporting-central/stats-reporting-disruption.html"]
title = "Overview - Disruption to Federal Reserve Statistical Reporting"
description = "Overview of how to prepare for and what to do during a potential disruption to the Federal Reserve Statistical Reporting."
full_description = '''Home Central Bank Reporting Central Reporting Central National Business Continuity Information Reporting Central National Business Continuity Information Overview — Disruption to Federal Reserve Statistical Reporting Statistical Reporting collects information that is needed by the Federal Reserve to carry out its monetary policy, supervision, and fiscal agency responsibilities. Reports may be submitted electronically through an online statistical reporting application, fax, or mail. The Federal Reserve provides online reporting through the Reporting Central application, which is available via the FedLine Web® Solution. Preparing for Statistical Reporting Disruptions It is important to identify and prepare key personnel (including alternates) in your organization, who will be relied upon to supply statistical report data to the Federal Reserve during a contingency situation, e.g., a pandemic, weather emergency, or electrical outage. Key personnel should be equipped with the necessary procedures and technology, e.g., computer, token, and software that allow them to complete reporting from an alternate location. The primary contact information that we have for each institution is taken from the report forms sent to us throughout the year, and it is updated on an ongoing basis. Should you wish a specific person to be your contingency contact person, please send an email informing us of the person's name, telephone number and email address; provide this information to your regular contact; or reach out using the general contact information provided in the Federal Reserve Reporting and Reserves Business Continuity Contacts section. During a Statistical Reporting Disruption — What to Expect Federal Reserve Disruption: For most emergency situations at the Federal Reserve, our back-up and recovery processes will allow us to continue operations with minimal interruption. During a technology system outage, you may be asked to resubmit your reports or submit your reports in another manner. During a local building outage, Federal Reserve staff may be required to relocate; in these instances, your local Reserve Bank may notify you of such a disruption. In the event your regular contact is not available, please utilize the local Federal Reserve Reporting and Reserves Business Continuity Contacts. A Federal Reserve disruption may cause the FedLine Web Solution to be inaccessible. The Federal Reserve has developed an extensive back-up and recovery process that should allow, under most circumstances, for operations to resume within a relatively short period of time. Institution Disruption: If your institution is experiencing a contingency situation and cannot access statistical reporting applications, the Federal Reserve can offer support: For information on report deadlines and submission options, contact your regular contact or your local Federal Reserve Reporting and Reserves Business Continuity Contacts. For support on restoring electronic access to the Federal Reserve online applications, contact the Support Center. During a Statistical Reporting Disruption — What You Should Do Federal Reserve Disruption: Institutions must continue to submit all statistical reports to the Federal Reserve in compliance with normal deadlines, unless otherwise instructed by Federal Reserve staff. If the FedLine Web Solution is unavailable, reporting institutions may reach out to their regular contacts or use the contact numbers provided in the Federal Reserve Reporting and Reserves Business Continuity Contacts section for assistance with report submissions. Unless noted, these continuity numbers remain valid even if Federal Reserve staff have relocated to a contingency site. The following general guidance is provided: Electronic Submissions: Institutions that submit reports electronically should continue to send reports in this manner, unless notified otherwise by Federal Reserve staff. Fax Submissions: Institutions that submit reports via fax should continue to send reports in this manner, unless notified otherwise by Federal Reserve staff. U.S. Mail Submissions: Institutions that submit reports via U.S. Mail may continue to send reports in this manner to the mailing address provided by their Federal Reserve Bank. Some scenarios may call for a recommended switch from paper mail to alternative or electronic submission methods for reports. Federal Reserve staff will notify you of any changes. If you have difficulty submitting your reports to the Federal Reserve using your standard process, please reach out to your regular contact or use the contact numbers provided in the Federal Reserve Reporting and Reserves Business Continuity Contacts section, and be prepared to submit your reports by fax, mail or email. Institution Disruption: If an institution's ability to submit statistical reports is impaired as the result of a technology system outage, the Federal Reserve Bank will review each institution’s situation on a case-by-case basis. Depending upon the specific circumstances, you may be asked to resubmit reports to the Federal Reserve. If you cannot submit your reports to the Federal Reserve on your regular schedule, please reach out to your regular contact or inform your Federal Reserve Reporting and Reserves Business Continuity Contacts. The most appropriate individuals to enact business continuity activities concerning FedLine® electronic access are the End User Authorization Contacts (EUACs). EUACs are responsible for identification, authentication, and notification processes between reporting institutions and Federal Reserve Banks. To reestablish access to FedLine, an EUAC should contact the Support Center. The Support Center staff will assess each institution’s unique needs and provide an appropriate solution to reestablish access. If you are unfamiliar with your institution’s EUACs, please contact the Support Center for assistance in identifying the appropriate individuals. Additional Information Refer to the Reserve Administration Business Continuity section for additional information on Reserve Administration in a contingency situation or contact your regular contact or your Federal Reserve Reporting and Reserves Business Continuity Contact. The FR Y-10 report (Report of Changes in Organizational Structure) can be filed electronically using the Y-10 Online (Off-site) application. Contact your regular contact at your assigned Reserve Bank or refer to the "Contact Us (Off-site)" tab on the home page for the contact listing of additional sources for guidance in a contingency situation. Top of Page Reporting Central Reporting Central Home Reporting Central and Structure Central User Guides Business Continuity Forms Resources Service Setup Reporting Central and Structure Central Applications Setup Home Step 1: Designate Authorized Individuals Step 2: Establish End User Authorization Contacts (EUACs) Step 3: Set Up New or Make Changes to Existing FedLine Subscribers Step 4: Set Up Report Access'''
year_published = 2025
