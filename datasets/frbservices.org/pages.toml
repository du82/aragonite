["https://www.frbservices.org/central-bank/reserves-central"]
title = "Reserves Central | Federal Reserve Financial Services"
description = "Reserves Central provides financial institutions with tools and information about reserve balances, term deposits and excess balance accounts."
full_description = "Home Central Bank Reserves Central Reserves Central Reserves Central provides resources and tools to help financial institutions access information on reserve balances and related calculations, such as the amount of interest earned on those balances. From Reserves Central, financial institutions can review their reserve balances and drill down into comprehensive reserves data. Financial institutions can also find comprehensive information on term deposits and excess balance accounts. Interest Postings on Thanksgiving Day: In accordance with the Federal Reserve System’s seven-day accounting week, in effect since July 20, 2023, Federal Reserve interest payments will post on the Thanksgiving holiday on Thursday, November 28, 2024. In the Federal Reserve's 2024 Maintenance Period Schedule, Thursday, November 28, 2024, is one calendar day after the end of a maintenance period and thus is an interest payment date. Therefore, a depository institution’s account at the Federal Reserve Bank will be credited with their interest payment on Thursday, November 28, 2024. Now available: A new version of the Reserves Central—Reserve Account Administration (RC-RAA) application was released on June 1, 2024. The application has a new layout in addition to some minor feature updates. For more information on functionality and to access the new application, please navigate to the Reserves Central—Reserve Account Administration section below. No action is needed to access the new application. If you have any questions, please reach out to your Reserves Central District Contact. Reserves Central—Reserve Account Administration Reserves Central—Reserve Account Administration is the application through which depository institutions can access information on their reserve balances and the amount of interest earned on those balances. For more information, please consult the following resources: If you have questions about Reserves administration or the application, consult the Reserves Administration Frequently Asked Questions. If you have specific questions on the functionality within the Reserves Central application, please refer to the User Guide which is available in the FedLine® Training Center. Log in to FedLine Home via FedLine Web® and select the link to “Training” in the upper right-hand corner of the screen. The User Guide is available under the Central Bank, Reserves Central menu. If you would like to set up access to the application, visit the Reserves Central — Reserve Account Administration Setup page for more information. Click the button below to access the Reserves Central—Reserve Account Administration application. Reserves Central - Reserve Account Administration Secure Logon Reserves Central - Reserve Account Administration Secure Logon Schedule for Maintenance Periods and Interest Payments The Schedule for Maintenance Periods and Interest Payments provides the date range for each maintenance period and the date associated interest payment. Please contact your Reserves Central District Contact with any questions. Term Deposit Facility The Term Deposit Facility (TDF) is a program under which the Federal Reserve offers term deposits to institutions that are eligible to receive interest on the balances they maintain at the Reserve Banks. An eligible institution may place funds at its Reserve Bank in a term deposit for an agreed upon number of days and reduce the amount of reserves it holds. Click the button below to access the Term Deposit Facility application. Term Deposit Facility Secure Logon Term Deposit Facility Secure Logon The following materials have been prepared to help familiarize participants with auction operations, fixed-rate operations, and floating-rate operations under the Term Deposit Facility. All of these documents are available in the FedLine® Training Center. Term Deposit Facility Overview Auction Operation Step-by-Step Guide; Accessible Version Fixed-Rate Operation Step-by-Step Guide; Accessible Version Floating-Rate Operation Step-by-Step Guide; Accessible Version Early Withdrawal Step-by-Step Guide; Accessible Version Term Deposit Facility Frequently Asked Questions (FAQs) Log in to FedLine Home via FedLine Web® and select the link to “Training” in the upper right-hand corner of the screen. The User Guides are available under the Central Bank, Reserves Central menu. Excess Balance Account Excess balance accounts are limited-purpose accounts for maintaining the excess balances of institutions that are eligible to earn interest on balances at Federal Reserve Banks. The participating eligible institutions ('participants') authorize another institution ('agent') to manage the excess balance account on their behalf. Historical Reference Material Archived Reserve Maintenance Manual (Off-site): Effective March 26, 2020, the Board reduced reserve requirement ratios to zero percent. This action effectively eliminated reserve requirements for all depository institutions. This archived manual provides detail on how reserve requirements were administered prior to March 26, 2020. Questions? Please contact your Reserves Central District Contact with questions about reserves administration. Top of Page Reserves Central SPOTLIGHT Reserve Account Administration Setup Reserves Administration Frequently Asked Questions Reserves Central Forms Regulations Reserves Central District Contacts Term Deposit Facility District Contacts Excess Balance Account District Contacts Support Center Contacts Reporting and Reserves Business Continuity Contacts"
