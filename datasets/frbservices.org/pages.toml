["https://www.frbservices.org/fedline-solutions/business-continuity"]
title = "FedLine Solutions Business Continuity Guide"
description = "Prepare for and respond to service disruptions by having your staff become familiar with the information provided for each of the FedLine business applications and services you use."
full_description = "Home FedLine® Solutions FedLine® Solutions Business Continuity Guide FedLine® Solutions Business Continuity Guide Overview — Service Disruptions to FedLine and Other Access Solutions The Federal Reserve provides depository institutions with several options to access Federal Reserve Financial Services. Currently, the FedLine Solutions include: FedLine Web® FedLine Advantage® FedLine Command® FedLine Direct® Other access methods include: FedMail® The Support Center provides customer support for access connections and services and strives to provide timely information regarding service disruptions. Service disruption information will be communicated in a number of ways, including via email, phone calls and announcements on FedLine Home and the Service Status page. The CCC has multiple geographically-dispersed locations to help ensure its ability to provide customer support during service disruptions. The systems that support FedLine access solutions and other services are also located in multiple geographically-dispersed locations for redundancy. Preparing for and Responding to Service Disruptions It is important that your staff become familiar with the information provided on this page, as well as the information provided for each of the FedLine business applications and services you use. For information about contingency planning for FedMail, please review the FedMail® Contingency Guide for FedACH® Services (PDF) and the FedMail Contingency Guide for Fedwire® Services (PDF). Detailed information regarding FedLine Advantage contingency planning is available via the EUAC Center on FedLine Home. A summary overview of options available can be found on the FedLine Advantage and FedLine Command Business Continuity Quick Tips page. For more information about contingency planning for FedACH Services or Fedwire Services via the FedLine Direct or FedLine Command access solutions, contact the Support Center. If your organization has a FedLine Direct connection, consider the benefits of the FedLine Direct Contingency Solution (PDF), which is designed to provide automatic failover of FedACH operations. Also, organizations with Dedicated Wide Area Network (WAN) connections may choose to consider the FedLine Access Solutions Network Diversity (PDF) service to reduce the risk of disruption to both their primary and secondary circuits. Top of Page FedLine Solutions FedLine Solutions Home FedLine Advantage® FedLine Command® FedLine Direct® FedLine Web® FedMail® 2024 Fees 2025 Fees Application and Connectivity Testing Business Continuity FedLine® Solutions Business Continuity Guide Home FedLine Advantage® and FedLine Command® Business Continuity Quick Tips Forms Resources Service Setup FedLine® Solutions Setup Home FedLine Advantage® FedLine Advantage® Hardware and Software Requirements FedLine Direct® and FedLine Command® FedLine Web® FedLine Web® Hardware and Software Requirements FedMail® Subscriber Access Level Descriptions"
