["https://www.frbservices.org/central-bank/reserves-central/excess-balance-account.html"]
title = "Excess Balance Account"
description = "Listing of resources available regarding excess balance account."
full_description = "Home Central Bank Reserves Central Excess Balance Account Excess Balance Account An excess balance account is an account at a Federal Reserve Bank established for one or more institutions (participants) that are eligible to earn interest on balances held at the Federal Reserve Banks. Each participant must authorize another institution (an agent) to manage the excess balance account on its behalf pursuant to an Excess Balance Account Agreement. The Federal Reserve Banks pay interest on the balances in the excess balance account and the agent disburses that interest to each participant in accordance with the instructions of the participant. Regulation D, Reserve Requirements of Depository Institutions, was amended to authorize the establishment of excess balance accounts, effective July 2, 2009. For more information, read the Federal Reserve Board press release (Off-site) and Federal Register notice (Off-site). More Information Excess Balance Account Frequently Asked Questions (FAQs) Excess Balance Account Setup Questions? Please contact your Excess Balance Account District Contact with questions or for assistance with excess balance account setup. Top of Page Reserves Central Reserves Central Home Excess Balance Account Reserves Administration National Business Continuity Information Forms Resources Service Setup Service Setup Home Excess Balance Account Setup Reserves Central—Reserve Account Administration Application Setup Term Deposit Facility Setup"
