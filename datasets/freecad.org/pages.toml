["https://freecad.org/contributing.php"]
title = "FreeCAD: Your own 3D parametric modeler"
description = "FreeCAD, the open source 3D parametric modeler"
full_description = '''FreeCAD Contribution Process (FCP) FreeCAD's contribution process is inspired by the Collective Code Construction Contract which itself is an evolution of the github.com Fork and Pull Model. The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in RFC 2119. 0. Status FreeCAD is in a transition period. The following are to be regarded as GUIDELINES for contribution submission and acceptance. For historical reasons, the actual process MAY diverge from this process during the transition. Such deviations SHOULD be noted and discussed whenever possible. 1. Goals The FreeCAD Contribution Process is expressed here with the following specific goals in mind: To provide transparency and fairness in the contribution process. To allow contributions to be included as quickly as possible. To preserve and improve the code quality while encouraging appropriate experimentation and risk-taking. To minimize dependence on individual Contributors by encouraging a large pool of active Contributors. To be inclusive of many viewpoints and to harness a diverse set of skills. To provide an encouraging environment where Contributors learn and improve their skills. To protect the free and open nature of the FreeCAD project. 2. Fundamentals FreeCAD uses the git distributed revision control system. Source code for the main application and related subprojects is hosted on github.com in the FreeCAD organization. Problems are discrete, well-defined limitations or bugs. FreeCAD uses GitHub's issue-tracking system to track problems and contributions. For help requests and general discussions, use the project forum. Contributions are sets of code changes that resolve a single problem. FreeCAD uses the Pull Request workflow for evaluating and accepting contributions. 3. Roles "User": A member of the wider FreeCAD community who uses the software. "Contributor": A person who submits a contribution that resolves a previously identified problem. Contributors do not have commit access to the repository unless they are also Maintainers. Everyone, without distinction or discrimination, SHALL have an equal right to become a Contributor. "Maintainer": A person who merges contributions. Maintainers may or may not be Contributors. Their role is to enforce the process. Maintainers have commit access to the repository. "Administrator": Administrators have additional authority to maintain the list of designated Maintainers. 4. Licensing, Ownership, and Credit FreeCAD is distributed under the Lesser General Public License, version 2, or superior (LGPL2+). Additional details can be found in the LICENSE file. All contributions to FreeCAD MUST use a compatible license. All contributions are owned by their authors unless assigned to another. FreeCAD does not have a mandatory copyright assignment policy. A Contributor who wishes to be identified in the Credits section of the application "About" dialog is responsible for identifying themselves. They should modify the Contributors file and submit a PR with a single commit for this modification only. The contributors file is found at https://github.com/FreeCAD/FreeCAD/blob/main/src/Doc/CONTRIBUTORS A contributor who does not wish to assume the copyright of their contribution MAY choose to assign it to the FreeCAD project association by mentioning Copyright (c) 2022 The FreeCAD project association fpa@freecad.org in the file's license code block. 5. Contribution Requirements Contributions are submitted in the form of Pull Requests (PR). Maintainers and Contributors MUST have a GitHub account and SHOULD use their real names or a well-known alias. If the GitHub username differs from the username on the FreeCAD Forum, effort SHOULD be taken to avoid confusion. A PR SHOULD be a minimal and accurate answer to exactly one identified and agreed-on problem. A PR SHOULD refrain from adding additional dependencies to the FreeCAD project unless no other option is available. Code submissions MUST adhere to the code style guidelines of the project if these are defined. If a PR contains multiple commits, each commit MUST compile cleanly when merged with all previous commits of the same PR. Each commit SHOULD add value to the history of the project. Checkpoint commits SHOULD be squashed. A PR SHALL NOT include non-trivial code from other projects unless the Contributor is the original author of that code. A PR MUST compile cleanly and pass project self-tests on all target platforms. Changes that break python API used by extensions SHALL be avoided. If it is not possible to avoid breaking changes, the amount of them MUST be minimized and PR MUST clearly describe all breaking changes with clear description on how to replace no longer working solution with newer one. Contributor SHOULD search for addons that will be broken and list them in the PR. Each commit message in a PR MUST succinctly explain what the commit achieves. The commit message SHALL follow the suggestions in the git commit --help documentation, section DISCUSSION. The PR message MUST consist of a single short line, the PR Title, summarizing the problem being solved, followed by a blank line and then the proposed solution in the Body. If a PR consists of more than one commit, the PR Title MUST succinctly explain what the PR achieves. The Body MAY be as detailed as needed. If a PR changes the user interface (UI), the body of the text MUST include a presentation of these UI changes, preferably with screenshots of the previous and revised state. A “Valid PR” is one which satisfies the above requirements. 6. Process Change on the project follows the pattern of accurately identifying problems and applying minimal, accurate solutions to these problems. To request changes, a User logs an issue on the project GitHub issue tracker. The User or Contributor SHOULD write the issue by describing the problem they face or observe. Links to the forum or other resources are permitted but the issue SHOULD be complete and accurate and SHOULD NOT require the reader to visit the forum or any other platform to understand what is being described. Issue authors SHOULD strive to describe the minimum acceptable condition. Issue authors SHOULD focus on User tasks and avoid comparisons to other software solutions. The User or Contributor SHOULD seek consensus on the accuracy of their observation and the value of solving the problem. To submit a solution to a problem, a Contributor SHALL create a pull request back to the project. Contributors and Maintainers SHALL NOT commit changes directly to the target branch. To discuss a proposed solution, Users MAY comment on the Pull Request in GitHub. Forum conversations regarding the solution SHOULD be discouraged and conversation redirected to the Pull Request or the related issue. To accept or reject a Pull Request, a Maintainer SHALL use GitHub's interface. Maintainers SHOULD NOT merge their own PRs except: in exceptional cases, such as non-responsiveness from other Maintainers for an extended period. If the Maintainer is also the primary developer of the workbench or subsystem. Maintainers SHALL merge valid PRs from other Contributors rapidly. Maintainers MAY, at their discretion merge PRs that have not met all criteria to be considered valid to: end fruitless discussions capture toxic contributions in the historical record engage with the Contributor on improving their contribution quality. Maintainers SHALL NOT make value judgments on correct contributions. Any Contributor who has value judgments on a PR SHOULD express these via their own PR. The User who created an issue SHOULD close the issue after checking the PR is successful. Maintainers SHOULD close issues that are left open without action or update for an unreasonable period. 7. Branches and Releases The project SHALL have one branch (“main”) that always holds the latest in-progress version and SHOULD always build. The project SHALL NOT use topic branches for any reason. Personal forks MAY use topic branches. To make a stable release a Maintainer SHALL tag the repository. Stable releases SHALL always be released from the repository main branch. 8. Project Administration Project Administrators are those individuals who are members of the FreeCAD Github organization and have the role of 'owner'. They have the task of administering the organization including adding and removing individuals from various teams. Project Administrator is a technical role necessitated by the GitHub platform. Except for the specific exceptions listed below, the Project Administrators do not make the decision about individual team members. Rather, they carry out the collective wishes of the Maintainers team. Project Administrators will be selected from the Maintainers team by the Maintainers themselves. To ensure continuity there SHALL be at least four Project Administrators at all times. The project Administrators will manage the set of project Maintainers. They SHALL maintain a sufficiently large pool of Maintainers to ensure their succession and permit timely review of contributions. If the pool of Maintainers is insufficient, the Project Administrators will request that the Maintainers select additional individuals to add. Contributors who have a history of successful PRs and have demonstrated continued professionalism should be invited to be Maintainers. Administrators SHOULD remove Maintainers who are inactive for an extended period, or who repeatedly fail to apply this process accurately. The list of Maintainers SHALL be publicly accessible and reflective of current activity on the project. Administrators SHALL act expediently to protect the FreeCAD infrastructure and resources. Administrators SHOULD block or ban “bad actors” who cause stress, animosity, or confusion to others in the project. This SHOULD be done after public discussion, with a chance for all parties to speak. A bad actor is someone who repeatedly ignores the rules and culture of the project, who is hostile or offensive, who impedes the productive exchange of information, and who is unable to self-correct their behavior when asked to do so by others. This page is retrieved from https://github.com/FreeCAD/FreeCAD/blob/master/CONTRIBUTING.md'''
year_published = 2025
clearnet = "https://freecad.org/contributing.php"
