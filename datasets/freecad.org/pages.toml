title = "FreeCAD: Your own 3D parametric modeler"
description = "FreeCAD, the open source 3D parametric modeler"
full_description = "Current stable version: 1.0.0 Select your desired platform (note that all downloads are for 64-bit systems): Windows x86_64 installer x86_64 portable (.7z) Windows 8 is the minimum supported version. For more info on installation, please check out the wiki. Mac Apple Silicon Intel macOS 10.13 High Sierra is the minimum supported version. For more info on installation, please check out the wiki. Linux x86_64 AppImage aarch64 AppImage For distro-specific install instructions such as Ubuntu PPA and other ways to install on Linux please check out the wiki. See what has changed since last version in the FreeCAD 1.0 release notes Development versions FreeCAD's development happens daily! The FreeCAD community generates weekly builds that are based on bleeding edge FreeCAD code in order for users to test bugfixes/regressions along with new features. We ask that advanced users occasionally run the development builds to assist with testing new code. These builds are not suitable for production use, and care should be taken when using them (back up your files regularly, etc.). Development builds should be expected to be slower, consume more memory, and be less stable than the official release versions. Download here a Weekly Build for Windows, macOS or Linux. On Linux, Snap and Flatpak also provide development channels. Additional modules and macros The FreeCAD community provides a wealth of additional modules and macros. They can now easily be installed directly from within FreeCAD using the Addon manager. Source code The source code of FreeCAD is hosted primarily on GitHub and mirrored on GitLab, Codeberg and Sourceforge Learn more"
year_published = 2025
