["https://freediag.sourceforge.net/Scantool-Manual.html"]
title = "Freediag - Scantool Application Manual"
full_description = '''In the Mid 1990's the US introduced mandated diagnostics on all vehicles sold in the USA for certain emissions related information. The idea behind this is that cars would monitor for emissions related problems and when they occur to light a "Check Engine" lamp on the dashboard and log fault information that could be then read by a Scantool. Scantools would become cheap and available to the smallest of vehicle repairers. These diagnostic protocols were grouped under the term "OBD II". OBDII/EOBD requires a standardised physical connector to be present within a small distance of the vehicle�s steering wheel. OBDII allows 3 types of physical interface (ISO9141/14230, SAEJ1850 VPW and SAEJ1850-PWM) and the related software protocols that are used with those physical interfaces. This manual assumes that you have some knowledge of vehicle systems and have probably used a scantool before. This Scantool uses SAEJ1979 (ODB II) protocol on ISO9141, ISO14230, SAEJ1850 VPW and SAEJ1850-PWM interfaces depending on what hardware interface is attached to the PC. The scantool does not yet support any manufacturer specific protocols for talking to non OBDII vehicles. It is configured by default to use a generic (dumb) serial to ISO9141 converter such as those used on the VAG-COM software, It also supports smart interfaces from Multiplex Engineering and from B.Roadman for SAEJ1850 vehicles (mainly Ford and GM). Support for ELMxxx devices is being added but should be considered inexistant as of early 2014. Please refer to Supported Interfaces to determine which protocols are supported by each interface type. Under Linux / unix variants, the scantool should not be run as superuser / root, for obvious security reasons. A regular user account should be sufficient, provided you setup the udev rules (or equivalent) to give access to the relevant hardware. The scantool will read commands from a startup file called .freediagrc in your home directory or freediag.ini in the program directory, depending on options set at compile time.'''
year_published = 2025
clearnet = "https://freediag.sourceforge.net/Scantool-Manual.html"
