["https://freediag.sourceforge.net/Supported-Interfaces.html"]
title = "Freediag - Supported Interfaces"
full_description = 'There are various common hardware interfaces used for diagnostic interfaces to vehicle electronic control units (ecus). Most manufacturers use one or two such interfaces for all systems on a vehicle. These include: ISO9141 and ISO14230 are essentially compatible at an electrical level (with the exception that the latter will work on 24 volt vehicles). The freediag protocol stack supports the above list with the exception of the CAN. The US OBDII standard and the European EOBD standard for communicating with emissions related ECUs do not mandate CAN support. The ISO protocols are generally used by European Vehicles, and the two SAEJ1850 types by Ford and GM. At a software level, ISO14230 is a vastly extended ISO9141-2 protocol that supports much longer data frames and much quicker communications startup with the ECU. There are two general types of interfaces, referred to as "active" / "smart" (with an onboard microcontroller) and "passive" / "dumb" (no mcu, only signal level translation and possibly opto-isolation). Freediag contains various drivers for different adapters that connect the PC serial port to a vehicle. Certain interfaces support more protocol types than have been implemented/tested within a driver, and some interfaces need to be ordered with special attributes (such as their address) to work without recompiling the freediag software library.'
year_published = 2025
clearnet = "https://freediag.sourceforge.net/Supported-Interfaces.html"
tags = ["freediag", "hardware", "interfaces", "supported"]
