["https://freediag.sourceforge.net/index.html"]
title = "Freediag - Vehicle Diagnostic Suite"
full_description = 'Freediag is an experimental suite of vehicle diagnostic protocols and an OBD II (mostly) compliant ScanTool, designed to run on Linux and Windows platforms natively. Only a command-line interface is provided at the moment. OBD II is a standard for vehicle diagnostics relating to emissions implemented on all US vehicles since the mid 1990s. Europe has introduced a standard called EOBD which is basically the same. The idea is that any garage/workshop will have a scantool and can diagnose vehicles with emissions problems - these are brought to the attention of the driver by a "Check Engine" light. This suite also contains protocol suites for some manufacturer specific protocols such as the protocol used on some Mercedes Benz gearbox controllers. It is intended to add the VW and Nissan diagnostic protocols eventually. It is intended that this grow into a full blown diagnostic suite for configuring and checking faults on many vehicles. There are 4 physical interfaces specified for vehicles, ISO9141 (K-Line), ISO14230 (effectively the same as ISO9141), SAE-J1850 VPW and SAE-J1850 PWM. A 5th interface type (CANbus) is increasingly popular. The bulk of the original code and design was written by Richard Almeida, the code was then checked and made more portable as the first stage of a project to make it portable to Windows by Andy Whittaker. Much work has been done by Bjorn Helgaas on enhancing the usability of the scantool, sanitising the comments in the code and adding functionality to the scantool. From around 2006 to 2014, the project was in a prolonged coma, with only a few commits now and then. Some changes in >2.6 linux kernels caused some timing issues, and the increasing popularity of USB-Serial converters (not handled properly in freediag, in large part due to the ugliness of the linux TTY API) also became a problem. Since 2014, the current maintainer (fenugrec) fixed most of those old issues, adapted freediag to run natively on Windows (i.e. no Cygwin / MSYS requirement), and added proper ELMxxx support.'
year_published = 2025
clearnet = "https://freediag.sourceforge.net/index.html"
