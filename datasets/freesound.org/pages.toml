full_description = '''Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. The Freesound web portal - https://freesound.org - (hereinafter "Freesound") is managed by the Music Technology Group at Universitat Pompeu Fabra, Barcelona, Spain Universitat Pompeu Fabra (“UPF” or “WE/US”) domiciled at Plaça de la Mercè, 10-12, Barcelona, Spain, with tax number (CIF) Q-5850017-D. Freesound uses our own technical cookies, as described below in order to allow users access and use the website. Our website uses cookies to manage the well-functioning of the website, and to understand how it is being used so we can improve it. This policy describes what information those cookies gather, how we use them, and why we make use of them. We will also share how you can restrict or block the cookies from being downloaded automatically. However, this might downgrade or even hinder certain elements of the website's functionality. In accordance with their purpose, the cookies we use are defined “technical cookies” (or necessary): we use technical cookies that are necessary for browsing and for the proper functioning of the website. Its use allows basic functions of the website and also to enable recognition of the users only when they have been registered so that they do not have to register each time they visit or access areas or services that are reserved exclusively for them (session management), which means that the legal basis to use it is our legitimate interest to manage our website. See the table below for the full list of cookies we set. If you want to gather more information about the cookies that we use on this website, you can contact us via this web form.'''
