full_description = "Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. Freesound (“Freesound” or “we/us”), a project of the Music Technology Group at Universitat Pompeu Fabra, Barcelona, Spain, domiciled at Plaça de la Mercè, 10-12, Barcelona, Spain is committed to protecting the privacy of the users of our website and Services (“You/r”). This Privacy Policy is part of the Freesound terms of use and explains our practices regarding the use of personal data collected and processed through our Services. Defined terms set out herein shall have the same meaning as in the terms of use of which it forms part. Freesound collects and processes (1) profile data, (2) data related to the sounds uploaded, (3) the comments between moderators and uploaders, (4) data created while contributing to the community. We collect those data for the purpose of creating your account, provide you with our service, and other purposes set out below. We maintain the security and confidentiality of your data in accordance with applicable law and will not make your personal data public other than on the site (username). By completing and submitting your personal data to Freesound via any online registration or other forms presented on our website, you declare to have read and accepted the terms of this Policy. Without prejudice to the foregoing, when we require your consent, by clicking the tickbox, you expressly and unequivocally consent to the collection and processing of your personal data (as identified below) by us in accordance with the indicated purposes and this Policy. You may revoke consent at any time by writing to mtg@upf.edu accompanied with a proof of your identity (copy of ID card or passport). Data Controller. The entity responsible for your data is Universitat Pompeu Fabra, Pl. de la Mercè, 10-12, 08002, Barcelona, Spain. All communications regarding the processing of your personal data shall be directed to our Data Protection Officer dpd@upf.edu. Please send a copy to mtg@upf.edu."
