["https://freesound.org/forum/off-topic/44678/104212"]
title = "Freesound - Forums - Off Topic - download bots"
description = "Freesound: collaborative database of creative-commons licensed sound for musicians and sound lovers. Have you freed your sound today?"
full_description = "Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. Yes, in fact the reason I found it was because I looked at who had downloaded a certain sound and that user had downloaded it at least twice in the last day. Having nothing better to do, I clicked on the profile in idle curiosity and then saw the amount of sounds it had downloaded. yeah happens to me and makes me feel rather disappointed. like oh looks! i uploaded a sound and it has ten downloads after a day![looks and sees they all are a few days old and have thousands of downloads] I think they are trying to crash the pages of the sounds they are downloading, if they mass-download or mass-comment I think on someone's sound, eventually that page will crash because just like on scratch, if you spam and mass comment on someones profile, their page will crash. You'd think so, but another account https://freesound.org/people/yuchen22314/ holds that dubious honour with over 4 million downloads. However someone else already reported it so I didn't mention it. Yes, right, I remember we had talked about this user (and some others) having a huge number of downloads some months ago. That’s crazy to see how many sounds these bots have downloaded, and I wonder how they may affect the download statistics published by freesound every year ? That's it! They trying to change the yearly download statistics! But the reason could be for the good; people who don't use freesound see these statistics, wonder how many people found this website useful, and then they join freesound, or for the bad; people who don't use freesound know these are just bot downloads, think *in mind: wow freesound does a lot of mass bot downloads to make their website look good, im not joining*, and freesound is seen as a bad website, i really hope these bots stop downloading. I think it's probable the bots are actually downloading the sounds for their content be it just someone hoarding sounds, or someone wanting to re-upload elsewhere."
