["https://freesound.org/forum/production-techniques-music-gear-tips-and-tricks/44923/104232"]
title = "Freesound - Forums - Production Techniques, Music Gear, Tips and Tricks - Superlux ECM999"
description = "Freesound: collaborative database of creative-commons licensed sound for musicians and sound lovers. Have you freed your sound today?"
full_description = "Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. Here are a few samples with it (see ECM999 tag): https://freesound.org/browse/tags/?q=&f=tag%253A%2522ecm999%2522&s=Date+added+%28newest+first%29&si_tags=0&si_name=0&si_description=0&si_packname=0&si_sound_id=0&si_username=0&d0=0&d1=*&ig=0&r=0&g=0&dp=0&cm=0&mm=0 Overall meh.I regret not getting a omni-capsule for my Rode NT5, even if it's more than double the price. I find the Superlux to be quite noisy, and sensitive to RF frequencies. For field recording, it's not optimal. For measuring purposes, that's above my paygrade, maybe it's good for a frequency sweep, however for a impulse response or to measure reverb, I suspect the noise will get in the way of reverb data :/ Otherwise, I find Omni-mics lovely for ambience recordings! Much better to hear everything going on in a space! Well, I confirm that NT45-Ocapsules are great in that regard. It’s true that they are more expensive than an ECM-999, but if you already own Rode NT5s, they are way better for field recording at very affordable price! Well balanced, low noise floor, and even with small windscreens like Rode WS8, they’re not so sensitive to wind. In my opinion, you would have to spend way more money to get a real improvement. For those of you who are interested, here are some recordings I made with them : https://freesound.org/search/?q=centrance+%2Brode On an other hand, if you’re looking for nice cheap omnis, you could also have a look to thoses mics using Primo EM272 or PUI AOM-5024 capsules. For example, you can find some at https://micbooster.com or at https://immersivesoundscapes.com . They’re quite small and unobtrusive, and they give very nice results too !"
