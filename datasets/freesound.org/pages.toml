["https://freesound.org/forum/dare-the-community/44913/104234"]
title = "Freesound - Forums - Dare the Community - Dare 2025-02 - Leave your gear at home - deadline for uploads 16-Feb-2025"
description = "Freesound: collaborative database of creative-commons licensed sound for musicians and sound lovers. Have you freed your sound today?"
full_description = "Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. I didn't mean to be restrictive, but phones are the current obvious option - because pretty much everyone has a mobile phone these days. Previously, a video camera or most 2nd generation digital cameeas could record short videos with sound. Many people don't own or regularly use a camera anymore - that function has been taken over by mobile phones. Getting the recordings out of mobile phones is also very easy, as you have many options such as email or airdrop.Cameras will require you to plug them in to the computer. Camreas will also record sound and vireo into a compressed format (like mpeg), and may offer different levels of resolution and/compression.The more compressed formats will have a marked impact on sound quality. This takes me to the 3 final points of this post:1) intentionally recording on different pieces of equipment, including lo-fi equipment is useful for creative effects and can make you achieve a different sound. This can be nusically very useful.2) experiment with your phone, recording videos instead of sound clips. See if you have different options for video compression. - it is likely this will give you different recordings, due to the application of sound compression. Low volume sounds and high feequency sounds likely to be the most affected.3) is it worth investing on a mic for your phone vs a recorder. Maybe. If yiu don't record often or want the convenience of being able to email, airdrop or even directly uploading from your phone, yes it could be a better option. Update : I notice some drastic auto-leveling / compression /expander or IDK.The action cam isn't very usable for ambiance/field recording x') And given we're on a new page.Anyone wanting to participate. Record something with your phone and share it using the Dare2025-02 tag.I also encourage you to add Phone-Recording as a tag Cheers!"
