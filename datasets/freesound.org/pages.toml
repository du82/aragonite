["https://freesound.org/help/faq"]
title = "Freesound - Help - Frequently Asked Questions"
description = "Freesound: collaborative database of creative-commons licensed sound for musicians and sound lovers. Have you freed your sound today?"
full_description = '''Didn't receive the email? Check your Spam folder, it may have been caught by a filter. If you still don't see it, you can resend the verification email. Freesound aims to create a huge collaborative database of audio snippets, samples, recordings, bleeps, ... released under Creative Commons licenses that allow their reuse. Freesound provides new and interesting ways of accessing these samples, allowing users to: We also aim to create an open database of sounds that can also be used for scientific research. Many audio research institutions have trouble finding correctly licensed audio to test their algorithms. Many have voiced this problem, but so far there hasn't been a solution. As long as you follow the legal guidelines described below in the Licenses section, ... yup! Some sounds you cannot use commercially, and many of the sounds you need to credit the author. See one section below! Well, it depends on what you want to do and which files you want to use. First of all, freesound lets the user select one of three licenses for their sounds. And, we used to have a 4th license, which complicates matters. Depending on the license there are things you can and can't do with the files. Let's start with the licenses. Creative commons has a really nice page explaining them: We aren't lawyers so this isn't legal advice, but here's our summary: for the "zero" license you can do pretty much what you want with the sound. You could even sell the sound, ... but you can't claim you are the author! For "attribution" you should always mention the original creators of the sounds when you use them. "Noncommercial" works like attribution, but you can't earn any money with the piece of work you create! As with all licenses the original creator can give you permission to use the sound outside of the original license. The content of the Freesound website is uploaded by the users of the site. As per our terms of service our users are required to follow the rules and not upload any copyrighted material. However, like all content on the internet, there might be cases where the users of our site are (un)knowingly uploading illegal content. If you find such content, make sure that you click the "Flag it!" link on the page which contains the sound.'''
