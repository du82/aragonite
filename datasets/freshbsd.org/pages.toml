["https://freshbsd.org/freebsd/src/branch/main"]
title = "FreeBSD / src - FreshBSD"
full_description = '''FreeBSD/src bba883d — sys/kern subr_pctrie.c, sys/sys pctrie.h2025-02-16 19:05:18 UTC by Doug Moore (dougm) on ⎇mainpctrie: iter_remove check from panic to KASSERT pctrie_iter_remove checks to see if the thing the iterator points to is actually there, and panics if it is not. This panic would likely indicate the same iterator had been used for removal twice, without advancing the iterator in-between. This test takes a bit of time, and as it indicates a programmer error rather than some external condition, it is better handled as a KASSERT. This means with KASSERTs disabled, a wee bit of time is saved. Reviewed by: alc, markj Differential Revision: https://reviews.freebsd.org/D49015 DeltaFile+19-22sys/kern/subr_pctrie.c+2-5sys/sys/pctrie.h+21-272 files FreeBSD/src 19f202f — sys/dev/sdhci sdhci_fdt_rockchip.c2025-02-16 10:41:43 UTC by Bojan Novković (bnovkov) on ⎇mainsdhci: Fixes for sdhci_fdt_rockchip.c This change fixes a couple of issues in the Rockchip SDHCI driver: - Fix a panic caused by sdhci_fdt_rockchip_attach not populating the softc's dev variable before initializing clocks - Fix a bug where sdhci_fdt_rockchip_set_clock fails to call sdhci_fdt_set_clock Fixes: e17e33f997d6 Reported by: Alonso Cárdenas Márquez (acardenas at bsd-peru.org) DeltaFile+6-7sys/dev/sdhci/sdhci_fdt_rockchip.c+6-71 files FreeBSD/src 5778cbd — sys/compat/linuxkpi/common/include/net mac80211.h2025-02-15 23:53:19 UTC by Bjoern A. Zeeb (bz) on ⎇mainLinuxKPI: 802.11: implement various VHT helper functions Implement ieee80211_rate_set_vht(), ieee80211_rate_get_vht_{mcs,nss}(), and ieee80211_get_vht_max_nss(). Sponsored by: The FreeBSD Foundation MFC after: 3 days DeltaFile+118-18sys/compat/linuxkpi/common/include/net/mac80211.h+118-181 files FreeBSD/src c272abc — sys/compat/linuxkpi/common/src linux_80211.c2025-02-15 23:22:39 UTC by Bjoern A. Zeeb (bz) on ⎇mainLinuxKPI: 802.11: adjust the hw_scan channel list Until net80211 will grow proper scan offload with the various options needed and will allow switching the scan engine try to improve the situation if we are doing a hw_scan and the device supports SINGLE_SCAN_ON_ALL_BANDS. In that case create the channel list from our device information of supported channels rather than from the net80211 scan list. Filter out currently unsupported bands. While the general "scan EBUSY" problem remains at least in my local testing I am seeing a lot more 2 and 5 GHz band results rather than being stuck on a single band (as was also often the case with iwm for me in the past). Tested by: rene (previous version) MFC after: 3 days DeltaFile+50-11sys/compat/linuxkpi/common/src/linux_80211.c+50-111 files'''
