full_description = '''FreeBSD/src bba883d — sys/kern subr_pctrie.c, sys/sys pctrie.h2025-02-16 19:05:18 UTC by Doug Moore (dougm) on ⎇mainpctrie: iter_remove check from panic to KASSERT pctrie_iter_remove checks to see if the thing the iterator points to is actually there, and panics if it is not. This panic would likely indicate the same iterator had been used for removal twice, without advancing the iterator in-between. This test takes a bit of time, and as it indicates a programmer error rather than some external condition, it is better handled as a KASSERT. This means with KASSERTs disabled, a wee bit of time is saved. Reviewed by: alc, markj Differential Revision: https://reviews.freebsd.org/D49015 DeltaFile+19-22sys/kern/subr_pctrie.c+2-5sys/sys/pctrie.h+21-272 files FreeBSD/src 19f202f — sys/dev/sdhci sdhci_fdt_rockchip.c2025-02-16 10:41:43 UTC by Bojan Novković (bnovkov) on ⎇mainsdhci: Fixes for sdhci_fdt_rockchip.c This change fixes a couple of issues in the Rockchip SDHCI driver: - Fix a panic caused by sdhci_fdt_rockchip_attach not populating the softc's dev variable before initializing clocks - Fix a bug where sdhci_fdt_rockchip_set_clock fails to call sdhci_fdt_set_clock Fixes: e17e33f997d6 Reported by: Alonso Cárdenas Márquez (acardenas at bsd-peru.org) DeltaFile+6-7sys/dev/sdhci/sdhci_fdt_rockchip.c+6-71 files FreeBSD/src b6490ad — . ObsoleteFiles.inc2025-02-16 04:15:31 UTC by Jose Luis Duran (jlduran) on ⎇stable/13ObsoleteFiles.inc: Remove test debug file from wrong dir Reported by: des Reviewed by: des, emaste Approved by: emaste (mentor) Fixes: 88d448ec815c ("mk: Move vm stack test debug symbols") MFC after: 3 days Differential Revision: https://reviews.freebsd.org/D48991 (cherry picked from commit e159dcc37e6f538d3d61ea3b2d08b052cf0e0ced) DeltaFile+1-0ObsoleteFiles.inc+1-01 files FreeBSD/src 24d3fd3 — . ObsoleteFiles.inc2025-02-16 04:13:51 UTC by Jose Luis Duran (jlduran) on ⎇stable/14ObsoleteFiles.inc: Remove test debug file from wrong dir Report