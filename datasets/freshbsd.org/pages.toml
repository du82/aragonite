full_description = '''FreeBSD/src 9ab9e13 — sys/cddl/dev/fbt/aarch64 fbt_isa.c2025-02-14 19:25:19 UTC by Mark Johnston (markj) on ⎇stable/14dtrace/arm64: Fix enumeration of FBT return probes On arm64, the FBT provider treats tail calls as return probes. Ignoring the question of whether this is really correct, the implementation is wrong: instr is a pointer to uint32_t, so the removed multiplication by the instruction size is wrong. As a result, FBT would create return probes for intra-function branches. MFC after: 2 weeks Sponsored by: Innovate UK (cherry picked from commit 4da070ce6c015a994ec4ecf3d31ee94810ea19f1) DeltaFile+1-2sys/cddl/dev/fbt/aarch64/fbt_isa.c+1-21 filesUnifiedSplitRaw<a href="/freebsd/src/commit/9ab9e138f30e9590f40cfce40f7a4075d5bbdac0">+ '/diff/unified' Diff</a>'''
