["https://freshbsd.org/freebsd/src/commit/d2870b8666f2438af400269c0f6a1a48031bb71e"]
title = "FreeBSD / src / d2870b8 / queue: Add atomic variants for *_EMPTY - FreshBSD"
full_description = '''FreeBSD/src d2870b8 — share/man/man3 queue.3, sys/sys queue.h2025-02-14 15:45:11 UTC by Mark Johnston (markj) on ⎇mainqueue: Add atomic variants for *_EMPTY In some places, these macros are used without a lock, under the assumption that they are naturally atomic. After commit 34740937f7a4 ("queue: New debug macros for STAILQ"), this assumption is false. Provide *_EMPTY_ATOMIC for such cases. This lets us include extra debug checks for the non-atomic case, and gives us a way to explicitly annotate unlocked checks, which generally deserve extra scrutiny and might otherwise raise reports from KCSAN. Reviewed by: kib, olce (previous version) MFC after: 2 weeks Differential Revision: https://reviews.freebsd.org/D48899 DeltaFile+25-1share/man/man3/queue.3+12-0sys/sys/queue.h+37-12 filesUnifiedSplitRaw<a href="/freebsd/src/commit/d2870b8666f2438af400269c0f6a1a48031bb71e">+ '/diff/unified' Diff</a>'''
