title = "FreeBSD / src / bba883d / pctrie: iter_remove check from panic to KASSERT - FreshBSD"
full_description = '''FreeBSD/src bba883d — sys/kern subr_pctrie.c, sys/sys pctrie.h2025-02-16 19:05:18 UTC by Doug Moore (dougm) on ⎇mainpctrie: iter_remove check from panic to KASSERT pctrie_iter_remove checks to see if the thing the iterator points to is actually there, and panics if it is not. This panic would likely indicate the same iterator had been used for removal twice, without advancing the iterator in-between. This test takes a bit of time, and as it indicates a programmer error rather than some external condition, it is better handled as a KASSERT. This means with KASSERTs disabled, a wee bit of time is saved. Reviewed by: alc, markj Differential Revision: https://reviews.freebsd.org/D49015 DeltaFile+19-22sys/kern/subr_pctrie.c+2-5sys/sys/pctrie.h+21-272 filesUnifiedSplitRaw<a href="/freebsd/src/commit/bba883df5e88d0fb1133b23c05db5501dd321ad8">+ '/diff/unified' Diff</a>'''
