["https://freshbsd.org/freebsd/src/commit/948e8413aba0"]
title = "FreeBSD / src / 948e841 / pflog: pass the action to pflog directly - FreshBSD"
full_description = '''FreeBSD/src 948e841 — sys/net if_pflog.h pfvar.h, sys/netpfil/pf pf.c pf_norm.c2024-01-04 22:08:08 UTC by Kristof Provost (kp) on ⎇mainpflog: pass the action to pflog directly If a packet is malformed, it is dropped by pf(4). The rule referenced in pflog(4) is the default rule. As the default rule is a pass rule, tcpdump printed "pass" although the packet was actually dropped. Use the actual action, rather than the rule's action, or an attempt at guessing the correct action. Inspired by OpenBSD's 'pflog(4) logs packet dropped by default rule with block.' commit. Sponsored by: Rubicon Communications, LLC ("Netgate") DeltaFile+11-11sys/netpfil/pf/pf.c+5-5sys/netpfil/pf/pf_norm.c+2-2sys/net/if_pflog.h+2-2sys/netpfil/pf/if_pflog.c+1-1sys/net/pfvar.h+21-215 filesUnifiedSplitRaw<a href="/freebsd/src/commit/948e8413aba0ee600ceb563cee048a6ef74a6a2c">+ '/diff/unified' Diff</a>'''
