["https://freshbsd.org/news/2023/09/23"]
title = "News / 2023-09-23 / Word-wise Diff Highlighting - FreshBSD"
full_description = "Word-wise Diff HighlightingFreshBSD now has support for word lightlighting in Split diffs. This makes it much easier to notice small changes between two versions of a file, such as fixing a typo or changing a version number. Effort is made to stop it being too noisy, so not every change will be highlighted, only lines that would otherwise be sufficiently similar. This may need some tuning. This does break my with_optional_linebreaks helper that prevented wide diffs from making the page extend off too far into the horizontal, but this should be relatively rare. Fixing that, and adding support for Unified diff view are on the TODO."
