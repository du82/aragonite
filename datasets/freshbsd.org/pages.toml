["https://freshbsd.org/freebsd/src/commit/89e3c2d27ab426e1edf326d470318d75d8be5e37"]
title = "FreeBSD / src / 89e3c2d / flash: add w25n (nand flash) support - FreshBSD"
full_description = '''FreeBSD/src 89e3c2d — sys/conf files, sys/dev/flash w25n.c w25nreg.h2025-02-15 03:03:55 UTC by Adrian Chadd (adrian) on ⎇mainflash: add w25n (nand flash) support This adds read only support for the W25N series of flash parts. Specifically starting with the W25N01GV, a 128MiB SPI NAND flash. This doesn't currently support writing or erasing, as this requires a NAND flash layer that we don't currently have. There are also plenty of other commands that aren't currently supported - notably maintaining the on-chip flash translation layer, flash wear statistics, etc. But read support is fine enough for now; it at least allows for reading the boot / config / calibration flash on my ASUS IPQ4018 based router. Reviewed by: imp Differential Revision: https://reviews.freebsd.org/D48979 DeltaFile+603-0sys/dev/flash/w25n.c+85-0sys/dev/flash/w25nreg.h+1-0sys/conf/files+689-03 filesUnifiedSplitRaw<a href="/freebsd/src/commit/89e3c2d27ab426e1edf326d470318d75d8be5e37">+ '/diff/unified' Diff</a>'''
