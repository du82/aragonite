full_description = '''Linux/linux ff1848d — arch/x86/events rapl.c, arch/x86/events/intel core.c ds.c2025-02-16 18:41:50 UTC by Linus Torvalds on ⎇masterMerge tag 'perf_urgent_for_v6.14_rc3' of git://git.kernel.org/pub/scm/linux/kernel/git/tip/tip Pull x86 perf fixes from Borislav Petkov: - Explicitly clear DEBUGCTL.LBR to prevent LBRs continuing being enabled after handoff to the OS - Check CPUID(0x23) leaf and subleafs presence properly - Remove the PEBS-via-PT feature from being supported on hybrid systems - Fix perf record/top default commands on systems without a raw PMU registered * tag 'perf_urgent_for_v6.14_rc3' of git://git.kernel.org/pub/scm/linux/kernel/git/tip/tip: perf/x86/intel: Ensure LBRs are disabled when a CPU is starting perf/x86/intel: Fix ARCH_PERFMON_NUM_COUNTER_LEAF perf/x86/intel: Clean up PEBS-via-PT on hybrid perf/x86/rapl: Fix the error checking order DeltaFile+14-19arch/x86/events/intel/core.c+25-3arch/x86/include/asm/perf_event.h+4-8arch/x86/events/rapl.c+9-1arch/x86/events/intel/ds.c+2-1arch/x86/include/asm/msr-index.h+54-325 filesUnifiedSplitRaw<a href="/linux/linux/commit/ff1848d81ca63e49bce57c29ffb12c6539333ac4">+ '/diff/unified' Diff</a>'''
