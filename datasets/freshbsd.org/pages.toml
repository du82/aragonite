["https://freshbsd.org/freebsd/src/commit/685fb42538199fb03a4cf0f3763c69f146366794"]
title = "FreeBSD / src / 685fb42 / pf: Log the intended action when a NAT rule matches a packet - FreshBSD"
full_description = '''FreeBSD/src 685fb42 — sys/netpfil/pf pf.c, tests/sys/netpfil/pf pflog.sh2025-02-14 15:24:15 UTC by Franco Fichtner via Mark Johnston (markj) on ⎇mainpf: Log the intended action when a NAT rule matches a packet When a packet matches a binat/nat/rdr rule, pf logs the match. The log metadata includes the rule's action on the packet, e.g., PF_PASS. NAT rules have their own actions: PF_BINAT, PF_NAT, PF_RDR. Before commit 948e8413aba0 ("pflog: pass the action to pflog directly"), pflog_packet() would obtain the action from the rule definition, whereas after that commit the action is passed as a parameter. When a NAT rule matches, we want to log the rule action, but after that commit, PF_PASS is hard-coded. Restore the previous behaviour. Add a regression test which installs a redirect, logs packets matching the redirect rule, and verifies that the corresponding pflog entry includes the correct action. Reviewed by: kp Fixes: 948e8413aba0 ("pflog: pass the action to pflog directly") MFC after: 2 weeks Sponsored by: Klara, Inc. Sponsored by: OPNsense Differential Revision: https://reviews.freebsd.org/D48911 DeltaFile+59-0tests/sys/netpfil/pf/pflog.sh+1-1sys/netpfil/pf/pf.c+60-12 filesUnifiedSplitRaw<a href="/freebsd/src/commit/685fb42538199fb03a4cf0f3763c69f146366794">+ '/diff/unified' Diff</a>'''
