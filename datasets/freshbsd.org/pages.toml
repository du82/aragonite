title = "FreeBSD / src / 7eb92c5 / Reinstate returning EOVERFLOW from stats_v1_blob_clone() - FreshBSD"
full_description = '''FreeBSD/src 7eb92c5 — sys/kern subr_stats.c2024-04-03 01:58:26 UTC by Lawrence Stewart (lstewart) on ⎇mainReinstate returning EOVERFLOW from stats_v1_blob_clone() a0993376ec5f (from D43179) subtly changed stats_v1_blob_clone() to stop returning EOVERFLOW in the case where the user buffer is not large enough to receive the entire statsblob. This results in any consumers which are implemented to retry on receiving EOVERFLOW to instead give up after receiving an empty statsblob header. Fix by latching any errors recorded prior to copyout. Reviewed by: markj Obtained from: Netflix, Inc. MFC after: 1 week Differential Revision: https://reviews.freebsd.org/D44585 Fixes: a0993376ec5f ("stats: Check for errors from copyout()") DeltaFile+6-4sys/kern/subr_stats.c+6-41 filesUnifiedSplitRaw<a href="/freebsd/src/commit/7eb92c502eb503d808a51296e426de625239a0d9">+ '/diff/unified' Diff</a>'''
