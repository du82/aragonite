["https://freshbsd.org/freebsd/src/commit/649a910e34b0314647d16a94f8af6de0f4cfd4b5"]
title = "FreeBSD / src / 649a910 / bhyve: Avoid holding /dev/pci open unnecessarily - FreshBSD"
full_description = '''FreeBSD/src 649a910 — usr.sbin/bhyve pci_passthru.c2025-02-14 15:25:08 UTC by Mark Johnston (markj) on ⎇mainbhyve: Avoid holding /dev/pci open unnecessarily Some device models, LPC in particular, will call pci_host_read_config() when probing for devices. Currently this results in pcifd_init() opening /dev/pci, and thus bhyve holds the fd open even when it's not needed. Modify pci_host_{read,write}_config() to open /dev/pci independent of the global pcifd. This means that these routines can only be used during VM initialization, as capsicum will prevent further opens afterward. Introduce internal wrappers which use the global pcifd, intended for the passthru code. Reviewed by: jhb MFC after: 3 weeks Fixes: 563fd2240e13 ("bhyve: export funcs for read/write pci config") Differential Revision: https://reviews.freebsd.org/D48908 DeltaFile+83-36usr.sbin/bhyve/pci_passthru.c+83-361 filesUnifiedSplitRaw<a href="/freebsd/src/commit/649a910e34b0314647d16a94f8af6de0f4cfd4b5">+ '/diff/unified' Diff</a>'''
