["https://freshbsd.org/freebsd/src/commit/0f63c4af5e4761680550b0aa08cc96f52076c08c"]
title = "FreeBSD / src / 0f63c4a / limits tests: Try to fix spurious cputime test failures - FreshBSD"
full_description = '''FreeBSD/src 0f63c4a — usr.bin/limits/tests limits_test.sh2025-02-14 16:26:19 UTC by Mark Johnston (markj) on ⎇mainlimits tests: Try to fix spurious cputime test failures I very occasionally see test failures caused by the total CPU time being several milliseconds under 3s. The test runs "limits -t 3 time <busy loop>" and verifies that the reported time elapsed is at least 3s (and not too much more). In particular, any time spent executing time(1) itself is counted against the limit but not recorded in the output. I think it makes more sense to reverse the order, so that the CPU time limit is not applied to time(1) itself. This also resolves the test failures I was seeing, which were reproducible only under load (i.e., running many tests in parallel). MFC after: 2 weeks Sponsored by: Klara, Inc. DeltaFile+2-2usr.bin/limits/tests/limits_test.sh+2-21 filesUnifiedSplitRaw<a href="/freebsd/src/commit/0f63c4af5e4761680550b0aa08cc96f52076c08c">+ '/diff/unified' Diff</a>'''
