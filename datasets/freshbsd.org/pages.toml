title = "FreeBSD / ports / 0c5cb19 / devel/R-cran-R.cache: New port - FreshBSD"
full_description = '''FreeBSD/ports 0c5cb19 — devel Makefile, devel/R-cran-R.cache Makefile pkg-descr2025-02-16 14:03:47 UTC by Zsolt Udvari (uzsolt) on ⎇maindevel/R-cran-R.cache: New port R.cache: Fast and Light-Weight Caching (Memoization) of Objects and Results to Speed Up Computations Memoization can be used to speed up repetitive and computational expensive function calls. The first time a function that implements memoization is called the results are stored in a cache memory. The next time the function is called with the same set of parameters, the results are momentarily retrieved from the cache avoiding repeating the calculations. With this package, any R object can be cached in a key-value storage where the key can be an arbitrary set of R objects. The cache memory is persistent (on the file system). DeltaFile+20-0devel/R-cran-R.cache/Makefile+10-0devel/R-cran-R.cache/pkg-descr+3-0devel/R-cran-R.cache/distinfo+1-0devel/Makefile+34-04 filesUnifiedSplitRaw<a href="/freebsd/ports/commit/0c5cb198d9ba1d6725b6eca4f8650398339131b9">+ '/diff/unified' Diff</a>'''
