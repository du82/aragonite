["https://freshbsd.org/freebsd/src/commit/31af1ba0a87cbf2fcc9850e012e5a62f750211b1"]
title = "FreeBSD / src / 31af1ba / Reinstate returning EOVERFLOW from stats_v1_blob_clone() - FreshBSD"
full_description = '''FreeBSD/src 31af1ba — sys/kern subr_stats.c2025-02-14 19:25:19 UTC by Lawrence Stewart (lstewart) via Mark Johnston (markj) on ⎇stable/14Reinstate returning EOVERFLOW from stats_v1_blob_clone() a0993376ec5f (from D43179) subtly changed stats_v1_blob_clone() to stop returning EOVERFLOW in the case where the user buffer is not large enough to receive the entire statsblob. This results in any consumers which are implemented to retry on receiving EOVERFLOW to instead give up after receiving an empty statsblob header. Fix by latching any errors recorded prior to copyout. Reviewed by: markj Obtained from: Netflix, Inc. MFC after: 1 week Differential Revision: https://reviews.freebsd.org/D44585 Fixes: a0993376ec5f ("stats: Check for errors from copyout()") (cherry picked from commit 7eb92c502eb503d808a51296e426de625239a0d9) DeltaFile+6-4sys/kern/subr_stats.c+6-41 filesUnifiedSplitRaw<a href="/freebsd/src/commit/31af1ba0a87cbf2fcc9850e012e5a62f750211b1">+ '/diff/unified' Diff</a>'''
