title = "FreeBSD / ports / c710d1b / textproc/R-cran-R.rsp: New port - FreshBSD"
full_description = '''FreeBSD/ports c710d1b — textproc Makefile, textproc/R-cran-R.rsp Makefile pkg-descr2025-02-16 18:18:33 UTC by Zsolt Udvari (uzsolt) on ⎇maintextproc/R-cran-R.rsp: New port The RSP markup language makes any text-based document come alive. RSP provides a powerful markup for controlling the content and output of LaTeX, HTML, Markdown, AsciiDoc, Sweave and knitr documents (and more), e.g. 'Today's date is <%=Sys.Date()%>'. Contrary to many other literate programming languages, with RSP it is straightforward to loop over mixtures of code and text sections, e.g. in month-by-month summaries. RSP has also several preprocessing directives for incorporating static and dynamic contents of external files (local or online) among other things. Functions rstring() and rcat() make it easy to process RSP strings, rsource() sources an RSP file as it was an R script, while rfile() compiles it (even online) into its final output format, e.g. rfile('report.tex.rsp') generates 'report.pdf' and rfile('report.md.rsp') generates 'report.html'. RSP is ideal for self-contained scientific reports and R package vignettes. It's easy to use - if you know how to write an R script, you'll be up and running within minutes. DeltaFile+27-0textproc/R-cran-R.rsp/Makefile+14-0textproc/R-cran-R.rsp/pkg-descr+3-0textproc/R-cran-R.rsp/distinfo+1-0textproc/Makefile+45-04 filesUnifiedSplitRaw<a href="/freebsd/ports/commit/c710d1b797a53262b90e05d60f5aa73c4e1bac32">+ '/diff/unified' Diff</a>'''
