full_description = "LLVM/project e080366 — llvm/lib/Analysis LoopAccessAnalysis.cpp, llvm/test/Analysis/LoopAccessAnalysis retry-runtime-checks-after-dependence-analysis-forked-pointers.ll2025-02-16 18:56:13 UTC by Florian Hahn on ⎇main[LAA] Inline hasComputableBounds in only caller, simplify isNoWrap. Inline hasComputableBounds into createCheckForAccess. This removes a level of indirection and allows for passing the AddRec directly to isNoWrap, removing the need to retrieve the AddRec for the pointer again. The early continue for invariant SCEVs now also applies to forked pointers (i.e. when there's more than one entry in TranslatedPtrs) when ShouldCheckWrap is true, as those trivially won't wrap. The change is NFC otherwise. replaceSymbolicStrideSCEV is now called earlier. DeltaFile+20-39llvm/lib/Analysis/LoopAccessAnalysis.cpp+43-1llvm/test/Analysis/LoopAccessAnalysis/retry-runtime-checks-after-dependence-analysis-forked-pointers.ll+63-402 files LLVM/project 6e94007 — llvm/test/CodeGen/AArch64 tail-call-unused-zext.ll br-to-eh-lpad.ll, llvm/test/CodeGen/AMDGPU cgp-bitfield-extract.ll2025-02-16 18:44:46 UTC by Yeaseen via GitHub on ⎇main[llvm] Remove `br i1 undef` in some `llvm/test/CodeGen` tests (#127368) This PR replaces some instances of `br i1 undef` with function argument value in several tests under `llvm/test/CodeGen/ `directory. This PR is a continuation of PR #125460DeltaFile+10-10llvm/test/CodeGen/AMDGPU/cgp-bitfield-extract.ll+4-4llvm/test/CodeGen/AArch64/tail-call-unused-zext.ll+3-3llvm/test/CodeGen/AArch64/br-to-eh-lpad.ll+2-2llvm/test/CodeGen/AArch64/arm64-storebytesmerge.ll+2-2llvm/test/CodeGen/AArch64/gep-nullptr.ll+2-2llvm/test/CodeGen/AArch64/machine-sink-getmemoperandwithoffset.mir+23-236 files not shown+32-3212 files LLVM/project 6812fc0 — mlir/include/mlir/Dialect/Affine Passes.h Passes.td, mlir/lib/Dialect/Affine/Transforms LoopUnrollAndJam.cpp2025-02-16 16:50:04 UTC by lonely eagle via GitHub on ⎇main[mlir][affine] make affine-loop-unroll-j