full_description = '''FreeBSD/src 8f2e5b6 — sbin/ifconfig ifieee80211.c, sys/net80211 ieee80211_var.h2025-02-15 15:49:02 UTC by Bjoern A. Zeeb (bz) on ⎇mainnet80211/ifconfig: swap IEEE80211_FVHT_USEVHT160 and 80P80 ieee80211_setupcurchan() compares the flags in a greater than manner. In this case VHT160 should be > VHT80P80 as it is preferable. Swap the two flags and add a comment to note this. Sponsored by: The FreeBSD Foundation MFC after: 3 days Reviewed by: adrian Differential Revision: https://reviews.freebsd.org/D48976 DeltaFile+6-2sys/net80211/ieee80211_var.h+2-2sbin/ifconfig/ifieee80211.c+8-42 filesUnifiedSplitRaw<a href="/freebsd/src/commit/8f2e5b6ef32304ce340b91057b1eb4b191dbeac1">+ '/diff/unified' Diff</a>'''
