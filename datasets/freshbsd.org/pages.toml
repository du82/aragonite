title = "LLVM / project / e080366 / [LAA] Inline hasComputableBounds in only caller, simplify isNoWrap. - FreshBSD"
full_description = '''LLVM/project e080366 — llvm/lib/Analysis LoopAccessAnalysis.cpp, llvm/test/Analysis/LoopAccessAnalysis retry-runtime-checks-after-dependence-analysis-forked-pointers.ll2025-02-16 18:56:13 UTC by Florian Hahn on ⎇main[LAA] Inline hasComputableBounds in only caller, simplify isNoWrap. Inline hasComputableBounds into createCheckForAccess. This removes a level of indirection and allows for passing the AddRec directly to isNoWrap, removing the need to retrieve the AddRec for the pointer again. The early continue for invariant SCEVs now also applies to forked pointers (i.e. when there's more than one entry in TranslatedPtrs) when ShouldCheckWrap is true, as those trivially won't wrap. The change is NFC otherwise. replaceSymbolicStrideSCEV is now called earlier. DeltaFile+20-39llvm/lib/Analysis/LoopAccessAnalysis.cpp+43-1llvm/test/Analysis/LoopAccessAnalysis/retry-runtime-checks-after-dependence-analysis-forked-pointers.ll+63-402 filesUnifiedSplitRaw<a href="/llvm/project/commit/e080366a76b78a746c53caccf84661b109ccbc20">+ '/diff/unified' Diff</a>'''
