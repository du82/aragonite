full_description = '''FreeBSD/src fa462b8 — sys/vm vm_object.c2025-02-15 18:09:26 UTC by Doug Moore (dougm) on ⎇mainvm_object: drop pointless assignment An assignment in collapse_scan() has become useless because, on every path, another assignment to that variable overrides it before that variable is read. Another assignment can be avoided sometimes, so move it down in the loop to where it's really necessary. Reviewed by: alc, markj Differential Revision: https://reviews.freebsd.org/D49017 DeltaFile+2-5sys/vm/vm_object.c+2-51 filesUnifiedSplitRaw<a href="/freebsd/src/commit/fa462b8b8ebc5db0be95c478b21ae8cc1288cdd2">+ '/diff/unified' Diff</a>'''
