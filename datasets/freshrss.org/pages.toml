["https://freshrss.org/10-years.html"]
title = "10 years · FreshRSS"
description = "FreshRSS development started in October 2012. Let’s celebrate!"
full_description = "FreshRSS development started in October 2012. For its 10th anniversary, we wanted to do something special. We propose two ways to celebrate with us: 1. Find about its origins Most of the first articles about FreshRSS were written in French, but you can get a glimpse of the story behind FreshRSS in English on GitHub. Read the history of FreshRSS 2. Tell us what you think Over the years, we got a lot of testimonials about how FreshRSS was appreciated. Let’s add yours to the list! Express yourself"
