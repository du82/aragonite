["https://freshrss.org"]
title = "FreshRSS, a free, self-hostable feeds aggregator"
description = "FreshRSS is lightweight, easy to work with, powerful, and customizable."
full_description = "FreshRSS is a self-hosted RSS and Atom feed aggregator. It is lightweight, easy to work with, powerful, and customizable. 🎂 Happy birthday FreshRSS turns 10 this year. We’re very proud to be there today, let’s celebrate together! Give it a try Not sure if it’s for you? Try FreshRSS at demo.freshrss.org, or sign up to an existing server. Host yourself Wonder about your data? Start by downloading the code and follow the instructions to install it on your server. A powerful aggregator Syndication Follow websites, podcasts and video channels in a single place. Reader Read your articles directly in FreshRSS. Search Search and save queries for quick access. Web scraping Generate feeds by scraping external websites. Feeds generation Generate new feeds based on your filters. OPML Import and export your feeds with OPML. WebSub Stay connected to your feeds in real-time. Configurable Adapt to your needs thanks to a lot of options. Mobile Follow your feeds with or without a third-party application. Fast & efficient FreshRSS can manage 1M+ articles and 50k+ feeds without complaining. Themes & extensions Customize FreshRSS with themes and extensions. International FreshRSS is translated in more than 15 languages. Join the community FreshRSS is a free software (AGPL 3) and community-friendly. Help us to make it better. Read the guide Contact us Contribute Be credited Testimonials “My @FreshRSS installation is the first, last, and sometimes only place I go on the Internet.” @scatmandan “[…] A number of RSS readers came on the scene. […] One of the better ones is FreshRSS.” opensource.com “C'est LE lecteur de flux que je voulais : beau, léger, simple, installable sur son propre serveur et libre.” dadall.info “📡Fall in love with @FreshRSS” @LinuxUserSpace “I use @FreshRSS and I love it like crazy.” @topher1kenobe “A free, self-hostable aggregator… probably the best! (in our opinion)” our old website"
year_published = 2025
clearnet = "https://freshrss.org"
category = "SitesList"
tags = ["aggregator", "aggregator.", "atom", "birthday", "community", "configurable", "data?", "efficient", "extensions", "fast"]
