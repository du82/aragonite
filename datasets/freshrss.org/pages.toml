["https://freshrss.org/contact.html"]
title = "Contact us · FreshRSS"
description = "You can contact us in two different ways."
full_description = "You can contact us in two different ways. On GitHub (preferred) Open a ticket to report a bug, or a discussion if you have any question, or if you want to ask for a new feature. This is where you’ll most probably get an answer. Go to GitHub On Framateam (Mattermost) If you don’t want to create an account on GitHub, you may be more comfortable to contact us via a chat hosted by a small French nonprofit organization. Go to Framateam Open a ticket to report a bug, or a discussion if you have any question, or if you want to ask for a new feature. This is where you’ll most probably get an answer. If you don’t want to create an account on GitHub, you may be more comfortable to contact us via a chat hosted by a small French nonprofit organization."
