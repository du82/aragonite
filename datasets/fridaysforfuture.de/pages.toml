["https://fridaysforfuture.de/wer-ist-wirklich-bereit-verantwortung-zu-tragen"]
title = "Wer ist wirklich bereit, Verantwortung zu tragen? | Fridays for Future"
description = "Wir haben in den letzten Wochen einen Wahlkampf erlebt, der sich wie in einer Parallelwelt abgespielt hat. Eine Welt, in der es keine Klimakrise mehr gibt, denn welchen anderen Eindruck sollte man haben, wenn kaum eine Partei wirklich über die größte Bedrohung unserer Zeit spricht? Aber wir wissen, dass die Klimakrise nicht verschwindet oder auch"
full_description = "Wer ist wirklich bereit, Verantwortung zu tragen? 22. Februar 202522. Februar 2025 in Erzähl mal!, Gut zu wissen!, Neuigkeiten Wir haben in den letzten Wochen einen Wahlkampf erlebt, der sich wie in einer Parallelwelt abgespielt hat. Eine Welt, in der es keine Klimakrise mehr gibt, denn welchen anderen Eindruck sollte man haben, wenn kaum eine Partei wirklich über die größte Bedrohung unserer Zeit spricht? Aber wir wissen, dass die Klimakrise nicht verschwindet oder auch nur ein bisschen weniger eskaliert, nur weil wir nicht mehr darüber reden, im Gegenteil. Wenn inzwischen auch der BND gemeinsam mit Klimawissenschaftler*innen vor der Klimakrise als eines der größten Sicherheitsrisiken warnt, ist endgültig klar: Die nächste Regierung wird sich mit der Klimakrise befassen müssen, ob sie will oder nicht. Wir haben uns deswegen angeschaut, was die großen Parteien zum Klima in ihren Wahlprogrammen haben. Die wichtigsten Details im Überblick: AfD Stellt den menschengemachten Klimawandel infrage Will aus dem Pariser Klimaabkommen und dem EU Green Deal aussteigen Plant, Förderprogramme für Klimaschutz “ersatzlos” zu streichen Fazit: Wenig überraschend, ist die AfD auch klimapolitisch wie bei allen anderen Themen ein gefährlicher Totalausfall. FDP Kohleausstieg erst 2038 Ausbau der Erdgasförderung in Deutschland Aufhebung des deutschen Klimaziels 2045 Abschaffung aller Regulierungen außer dem Emissionshandel Abkehr vom EU-weiten Verbrenneraus Abschaffung des Heizungsgesetzes Fazit: Die FDP steuert klimapolitisch in die Vergangenheit und streicht explizite soziale Klimaschutzmaßnahmen. CDU/CSU Kohleausstieg erst 2038 Setzt auf neue Gaskraftwerke Abkehr vom EU-weiten Verbrenneraus Abschaffung des Heizungsgesetzes Abschaffung des Deutschlandtickets Kein sozialer Ausgleich beim CO2-Preis Fazit: Die Union hält an der Vergangenheit und Klimazerstörung fest. Menschen und unsere Zukunft scheinen ihr egal zu sein. SPD Kein klares Bekenntnis zum Kohleausstieg Kein geplanter Gasausstieg Beibehaltung des Heizungsgesetzes Bekenntnis zum Deutschlandticket und Verbrenneraus Deutschlandfonds für Klimainvestitionen Klimageld nur vielleicht Fazit: Die SPD bringt erste Maßnahmen, doch für die Verkehrswende und den fossilen Ausstieg bleibt es halbherzig. Grüne Kohleausstieg bis 2030 Gasunabhängigkeitsstrategie (ohne klaren Ausstiegspfad) Ende der Öl- und Gasförderung erst 2035 Beibehaltung des Heizungsgesetzes Bekenntnis zum Deutschlandticket und Verbrenneraus Deutschlandfonds für Klimainvestitionen Klimageld Fazit: Die Grünen wollen Klima-Vorreiter sein und machen in einigen Bereichen ernst. Doch ein echter Wandel erfordert den entscheidenden Ausstieg aus fossilen Energien. Die Linke Klimaneutralität bis 2040 Kohleausstieg bis 2030 Gasausstieg ohne festgelegtes Jahr Abschaffung des Heizungsgesetzes, stattdessen Investitionsoffensive Wiedereinführung des 9-Euro-Tickets und Verbrenneraus Klimainvestitionsprogramm Klimageld Fazit: Die Linke fordert ambitionierte Maßnahmen und geht hier voran. Doch es fehlen an vielen Stellen Details zur konkreten Umsetzung In aller Kürze zusammengefasst: AfD: Leugnet den Klimawandel und lehnt Klimapolitik ab. FDP: Massive Rückschritte in der Klimapolitik. Union (CDU/CSU): Rückschritte vor allem bei Verkehr und Gebäuden. SPD: Keine größere Ambition – weiter wie bisher. Grüne: Die meisten konkreten Maßnahmen, aber Zögern teilweise bei übergeordneten Zielen. Linke: Mutige klimapolitische Ziele, aber oft fehlende Maßnahmen. Es lässt sich also festhalten, es macht einen Unterschied an wen unsere Stimme bei dieser Wahl geht, doch zugleich steht fest, egal wer in der neuen Regierung sitzen wird und mit wie vielen Plätzen im Bundestag sitzen wird, ausreichende Klimapolitik wird es nur mit unserem Druck geben! Also nutz morgen deine Stimme, sprich mit Freund*innen und Familie über die Wahl. Deine Stimme macht einen Unterschied – auch fürs Klima. Wir sehen uns nach der Wahl wieder auf den Straßen, denn wir haben ein Recht auf Zukunft und für das werden wir kämpfen! Jetzt teilen!teilen teilen teilen E-Mail merken Quellen: CDU: https://www.cdu.de/app/uploads/2025/01/km_btw_2025_wahlprogramm_langfassung_ansicht.pdf SPD: https://www.spd.de/fileadmin/Dokumente/Beschluesse/Programm/SPD_Programm_bf.pdf Die Linke: https://www.die-linke.de/fileadmin/user_upload/Wahlprogramm_Langfassung_Linke-BTW25_01.pdf Grüne: https://cms.gruene.de/uploads/assets/Regierungsprogramm_DIGITAL_DINA5.pdf FDP: https://www.fdp.de/sites/default/files/2024-12/fdp-wahlprogramm_2025.pdf Wahlprogramm der AfD Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
