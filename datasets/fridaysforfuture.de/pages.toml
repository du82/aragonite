["https://fridaysforfuture.de/eu-wahl-unsere-forderungen"]
title = "EU-Wahl: Unsere Forderungen! | Fridays for Future"
description = "Während die Folgen der Klimakrise weltweit immer dramatischer und tödlicher werden, attackieren Rechte offen unsere Zukunft. Sie attackieren die Grundpfeiler unserer Demokratie genauso wie unsere Perspektive für eine gute Zukunft. Wir wissen konsequenter und gerechter Klimaschutz ist die Grundlage für eine stabile Wirtschaft, den Erhalt unserer Lebensgrundlagen und den gesellschaftlichen Zusammenhalt. Und breite Teile der"
full_description = "EU-Wahl: Unsere Forderungen! 27. Mai 202427. Mai 2024 in Neuigkeiten, Wir sind laut! Während die Folgen der Klimakrise weltweit immer dramatischer und tödlicher werden, attackieren Rechte offen unsere Zukunft. Sie attackieren die Grundpfeiler unserer Demokratie genauso wie unsere Perspektive für eine gute Zukunft. Wir wissen konsequenter und gerechter Klimaschutz ist die Grundlage für eine stabile Wirtschaft, den Erhalt unserer Lebensgrundlagen und den gesellschaftlichen Zusammenhalt. Und breite Teile der Gesellschaft sehen Klimaschutz weiterhin als eins der wichtigsten Themen, in denen die Politik mehr tun muss. Gleichzeitig gewinnen rechte Kräfte – auch, weil sie ihre Themen strategisch in den Mittelpunkt der Debatten rücken. Sie schüren Hass und Hetze, machen Kulturkampf nach Kulturkampf auf – und aufbauend auf ihren Attacken gegen Klimaschutz greifen jetzt auch Konservative gerade massiv Klimaschutzgesetze an und wollen das Herzstück der europäischen Klimapolitik, den Green Deal, wirkungslos machen & Klimaschutzmaßnahmen zurücknehmen. Es braucht ein demokratisches und gerechtes Europa für alle, wenn wir gegen die Krisen dieser Zeit ankommen wollen. Eines, das echte und gute Lösungen für die Sorgen der Bürger*innen hat, statt wissenschaftsfeindliche, undemokratische Scheinlösungen. Deshalb fordern wir… Die Bekämpfung der Klimakrise muss wieder zur politischen Priorität werden. Keine Partei kann sich vor der Klimakrise verstecken: Wer die wissenschaftlichen Erkenntnisse leugnet und lieber auf extrem teure Technologien wie E-Fuels setzt, ist keine ernst zu nehmende Option bei dieser Wahl. Es gibt einen klaren Auftrag an die Parteien, die neue Kommission und das Parlament: Die Bekämpfung der Klimakrise muss auch nach den Wahlen wieder ganz vorne in der EU-Politik stehen. Die aktuelle Klimapolitik der EU ist unzureichend. Die EU muss ihre Klimaziele verschärfen und mehr Klimaschutz umsetzen, um die Vorgaben des Pariser Klimaabkommens einzuhalten. Das bedeutet unter anderem: einen verbindlichen Ausstieg für alle fossilen Energieträger bis 2035 (Kohle bis 2030) beschließen Klimainvestitionen bis 2030 mehr als verdoppeln Dafür gehen wir am 31.05. überall in Deutschland auf die Straße! Damit sind wir in Europa nicht allein – in zahlreichen Ländern gehen an diesem Wochenende junge Menschen im Vorfeld der Europawahlen auf die Straße. Sei auch du dabei! Die Rolle der EU Die EU ist ein wichtiger Player am globalen Verhandlungstisch, zum Beispiel bei internationalen Klimakonferenzen, wo sie bisher als treibende Kraft aufgetreten ist. Außerdem setzt die EU auch wichtige Leitplanken für die nationale Klimapolitik der Mitgliedstaaten. Auf globale Herausforderungen wie die Klimakrise müssen wir international und gemeinsam solidarisch antworten – dafür sind wir auf eine handlungsfähige EU angewiesen. Die EU kann und muss zeigen, wie Klimaschutz möglich ist. In den letzten Jahren hat die EU wichtige Klima-Gesetzgebungen verabschiedet (Green Deal, Verbrenner-Aus, Gebäudesanierung etc.) mit Beteiligung und teilweise unter Führung der konservativen Fraktion. Damit haben wir große Fortschritte im Klimaschutz gemacht, so konnte der Klimapfad der EU in den letzten 5 Jahren um mehr als 1 Grad korrigiert werden. Das ist zwar immer noch nicht ausreichend, aber ganz klar unser Erfolg. Diesen großen Erfolg wollen die Rechten mit aller Kraft angreifen. Ein Angriff auf Klimaschutzmaßnahmen ist ein Angriff auf unsere Zukunft. Das können wir so nicht hinnehmen und gehen deswegen am 31. Mai wieder auf die Straße, für ein demokratisches Europa, für einen verbindlichen Ausstieg aus allen fossilen Energieträgern bis 2035 (Kohle bis 2030) und mindestens eine Verdopplung der Klimainvestitionen bis 2030. Jetzt Streik finden! Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
author = "JonAuer"
year_published = 2024
year_updated = 2024
clearnet = "https://fridaysforfuture.de/eu-wahl-unsere-forderungen"
