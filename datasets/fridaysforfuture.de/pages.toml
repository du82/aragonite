["https://fridaysforfuture.de/forderungen/forderungen-2025"]
title = "Forderungen 2025 | Fridays for Future"
description = "Wir haben ein Recht auf Zukunft. Die Regierung muss es schützen. 2024 war ein Klima-Katastrophenjahr. Die Klimakrise ist hier und jetzt. Wir spüren sie überdeutlich und wissen, dass sie in Zukunft nur noch schlimmer wird. Wie schlimm, das zu entscheiden, steht noch in unserer Macht. Wir haben keine Zeit, auf die Apokalypse zu warten, bis"
full_description = "Forderungen 2025 Wir haben ein Recht auf Zukunft. Die Regierung muss es schützen. 2024 war ein Klima-Katastrophenjahr. Die Klimakrise ist hier und jetzt. Wir spüren sie überdeutlich und wissen, dass sie in Zukunft nur noch schlimmer wird. Wie schlimm, das zu entscheiden, steht noch in unserer Macht. Wir haben keine Zeit, auf die Apokalypse zu warten, bis wir endlich handeln. Das sagen wir schon seit sechs Jahren und das war immer richtig. Heute aber ist es wichtiger denn je. Das muss auch der nächsten Bundesregierung klar sein. Zwischen Scheindebatten und falschen Fakten entscheidet sich in diesen Tagen auch das Klima der nächsten Jahre und Jahrzehnte. Wir müssen im Alltagstrubel die echten Probleme dieses Landes im Blick behalten. Mit unseren Forderungen setzen wir einen Rahmen und zeigen, was jetzt nötig und möglich ist. Es darf jetzt keine Rückschritte geben. Gesetzte Ziele dürfen nicht aufgeweicht werden. Aktuelle Projekte müssen bis zum Ende durchgezogen werden. Aber das reicht nicht. Wir müssen jetzt weiter gehen, nach vorne blicken. Nach dem Klima-Katastrophenjahr 2024 ist klar: Jetzt muss es noch schneller gehen. Wir müssen nachschärfen, brauchen mehr Tempo beim Klimaschutz, müssen Deutschland zukunfts- und klimafest machen, müssen mit einer Welt im Wandel umgehen. Das tun diese Forderungen. Forderungen für ein klimagerechtes Deutschland und eine sichere Zukunft für alle. Für einen lebenswerten Planeten. Für die gerechte und schnelle sozial-ökologische Transformation. Für ein funktionierendes Land. Für heute und für morgen. Für alle. Pressekonferenz-Livestream Webinar-Aufzeichnung Zukunft machen: Klimaneutralität bis 2035. Wir haben ein Recht auf Zukunft – ohne die schlimmsten Folgen der Klimakrise. Das haben Gerichte immer wieder bestätigt. Doch mit den deutschen Klimazielen steuern wir auf eine fast drei Grad heißere Welt zu. Als eines der Länder, die historisch am meisten zur Klimakrise beigetragen haben und wirtschaftlich stark sind, ist Deutschland in der Verantwortung, global voranzugehen und einen gerechten Anteil an der Emissionsreduktion zu leisten. Deshalb fordern wir: Emissionen ab jetzt konsequent reduzieren und Klimaneutralität bis 2035 erreichen. Planbarkeit schaffen: Ein klarer Plan für den geordneten Gasausstieg bis 2035. Die Zeit der Fossilen ist endgültig vorbei. Das ist schon lange klar und das muss jetzt auch politisch deutlich werden. Während der Kohleausstieg beschlossene Sache ist, wird Erdgas fatalerweise weiterhin als vermeintliche Zukunftstechnologie propagiert. Energiewende bedeutet nicht nur den Ausbau der Erneuerbaren, sondern auch einen Plan für das Ende aller fossilen Energien. Keine Fabrik, kein Kraftwerk, keine Industrie darf mehr ohne klaren Plan für einen geordneten Ausstieg weiterlaufen. Deshalb fordern wir: Schluss mit Erdgas – klarer Plan für den Gas-Ausstieg bis 2035. Bezahlbarkeit sichern: Recht auf klimafreundliche Wärme und Mobilität. Die meisten Menschen wollen Klimaschutz, niemand will mit seinem Verhalten die Zukunft kaputt machen – oder kaputt machen müssen. Trotzdem können es sich viele nicht leisten, selbst klimafreundlich zu leben. Im Moment scheitert die Einhaltung der deutschen Klimaziele an dreckigen Heizungen und zu vielen Autos, denn viel zu oft ist Klimazerstörung der Standard. Die Transformation wird nur gelingen, wenn es genau andersrum ist: Klimaschutz muss bezahlbar und einfach sein – für alle Menschen. Wo das nicht automatisch möglich ist, muss der Staat mit einfachen und sozial gerechten Förderungen nachhelfen. Deshalb fordern wir: Eine Mobilitäts- und Wärmegarantie für alle. Das bedeutet: Alle Grundbedürfnisse müssen bezahlbar klimaneutral erfüllt werden können. Kosten teilen: Superreichensteuer zur Finanzierung der Transformation. Der klimaneutrale Umbau von Infrastruktur, Industrien und Gesellschaft ist eine riesige Aufgabe. Jede*r muss einen gerechten Beitrag zur Transformation leisten – die Superreichen machen das bislang nicht. Superreiche feuern mit ihrem Lebensstil die Klimakrise besonders stark an, spüren aber kaum etwas von den Folgen und beteiligen sich nur wenig an der Transformation. Auch und gerade Superreiche müssen aber endlich Verantwortung übernehmen. Deshalb fordern wir: Superreiche besteuern, damit sie ihren fairen Beitrag zur Transformation leisten. Menschen schützen: Ein Fonds für den Schutz vor den schlimmsten Folgen der Klimakrise. Schon heute zerstören Dürren ganze Ernten und Überschwemmungen Häuser und Straßen. Doch statt Menschen vor den Folgen der Klimakrise zu schützen, machen fossile Konzerne Milliardengewinne mit der Zerstörung unserer Lebensgrundlagen. Gleichzeitig fehlen die Gelder für den Schutz von gefährdeten Regionen und die Unterstützung im Ernstfall. Deshalb fordern wir: Einen zentralen Fonds für Klimaanpassung und Katastrophenhilfe, finanziert durch eine Besteuerung fossiler Unternehmen. Transformation gestalten: Jährlich 300.000 Leute in Zukunftsindustrien ausbilden. Solarpaneele installieren, Wärmepumpen einbauen, Busse fahren – die Transformation kann nur gelingen, wenn überall in Deutschland Millionen Menschen anpacken. Doch aktuell droht sie am Fachkräftemangel zu scheitern. Arbeitsplätze in Zukunftsindustrien sind eine Perspektive für junge Menschen genauso wie für diejenigen, die in sich verändernden Branchen arbeiten. Die Transformation zur Klimaneutralität 2035 liegt in den Händen derer, die unser Energie- und Mobilitätssystem umbauen. Deshalb fordern wir: Eine Ausbildungsoffensive für jährlich 300.000 neue Leute in Zukunftsbranchen mit fairen Löhnen und guten Arbeitsbedingungen. Die nächste Bundesregierung wird eine Klimakatastrophen-Regierung. Sie muss beweisen, dass sie das Zeug dazu hat, uns durch eine Zeit im Wandel und im Umbruch zu lenken. Wir werden sie an ihren Taten messen, nicht an ihren Versprechen. Diese Forderungen sind unser Maßstab. Von allen demokratischen Parteien erwarten wir, dass sie sich im Wahlkampf und danach für unser Recht auf Zukunft einsetzen."
year_published = 2025
