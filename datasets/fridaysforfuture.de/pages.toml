["https://fridaysforfuture.de/klima-demokratie-worauf-es-jetzt-ankommt"]
title = "Klima & Demokratie – worauf es jetzt ankommt | Fridays for Future"
description = "In wenigen Tagen gehen wir an über 130 Orten in ganz Deutschland eine Woche vor der Bundestagswahl zum großen Klimastreik auf die Straße. Warum das jetzt wichtig ist und was die Klimastreiks mit dem Schutz der Demokratie zu tun haben, erklärt unsere Autorin Paula. In der letzten Woche waren wir mit Hunderttausenden auf der Straße,"
full_description = "Klima & Demokratie – worauf es jetzt ankommt 10. Februar 202522. Februar 2025 von Paula in Erzähl mal!, Neuigkeiten, Wir sind laut! 6 In wenigen Tagen gehen wir an über 130 Orten in ganz Deutschland eine Woche vor der Bundestagswahl zum großen Klimastreik auf die Straße. Warum das jetzt wichtig ist und was die Klimastreiks mit dem Schutz der Demokratie zu tun haben, erklärt unsere Autorin Paula. In der letzten Woche waren wir mit Hunderttausenden auf der Straße, um für die Demokratie einzustehen und die Brandmauer gegen die AfD zu verteidigen. Und unser Protest hat gewirkt: Ein Gesetz von Friedrich Merz, das sich auf die Stimmen der AfD gestützt hätte, ist im Bundestag abgelehnt worden. Der Protest, den wir auf die Straße getragen haben, hat gerade genug Abgeordnete im Bundestag davon abgehalten, gemeinsam mit Faschisten zu stimmen. Wäre das nicht passiert, wäre das erste Mal in der Geschichte der Bundesrepublik ein Gesetz mit der Hilfe einer in Teilen rechtsextremen Partei abgestimmt worden – ein Gesetz, das das Asylrecht untergraben und die deutschen Grenzen geschlossen hätte. Unser Protest hat das verhindert. Und trotzdem muss klar sein: Die Scherben dieser Debatte bleiben. Der Umgang mit Migrant*innen sitzt vielen von ihnen tief in den Knochen. Die Art und Weise, wie unsere Demokratie in diesem Diskurs durch den Dreck gezogen wurde, wird nicht ohne weiteres verschwinden. Wir sind weiter gebraucht. Ich habe mich in der letzten Woche vor allem gefragt: Wie? Was können wir tun, um diese Demokratie nachhaltig zu stärken? Die AfD ist vor allem dann stark, wenn ihre Themen stark sind. Die Taktik der CDU ist deswegen eine brandgefährliche: In der Hoffnung auf ein paar Prozentpunkte mehr übernehmen sie die Themen und Rhetorik der AfD. Sie lassen sich auf Rassismus und Klimawandelleugnung ein und verwerfen damit demokratische Grundsätze. Aber Politik ist kein Sandkasten: Wir können nicht einer anderen politischen Gruppe das Thema wegnehmen und dann darauf setzen, dass sie nicht weiter damit spielen. Die Realität ist, dass diese Taktik sie nur stärkt. Als engagierte Zivilgesellschaft können und müssen wir es deshalb besser machen. Wir brauchen eigene Visionen. Auch wenn es ungewohnt wirken mag: Gerade jetzt ist es zentral für die Stärkung unserer Demokratie, dass wir über demokratische Themen und echte Krisen reden. Wir brauchen Politiker*innen, die Verantwortung übernehmen und lösungsorientiert arbeiten, statt sich auf die Aufstachelung der Rechten einzulassen. Weltweit setzen Faschisten darauf, zu polarisieren und zu zerstören – sei es bei Migration, Sozialem oder Klimafragen. Es ist kein Zufall, dass der Klimaschutz ein solches Hassthema der rechten Kräfte weltweit ist – wer die Welt brennen sehen will, muss nur weiter fossile Politik betreiben. Indem wir unsere Lebensgrundlagen schützen, schützen wir Menschenrechte, unsere Demokratie und unsere Zukunft. Indem wir mutig für Klimagerechtigkeit einstehen, nehmen wir der AfD die Macht und stärken die Brandmauer, hinter der wir unsere Demokratie leben können. Klimaschutz und Demokratieschutz gehen Hand in Hand. Was wir jetzt brauchen, sind echte Lösungen für echte Krisen, denn so entziehen wir den Rechten die Spaltungsgrundlage. Gerade jetzt ist es wichtiger denn je, dass wir diese Demokratie mit Leben füllen. Wir stärken unsere Demokratie, wenn wir gemeinsam demokratische Themen auf die Straße tragen. Und wir stärken die Demokratie, wenn wir gemeinsam für wirkungsvolle und sozial-gerechte Klimapolitik einstehen. Deswegen werde ich am 14. Februar auf den Klimastreik gehen, um Demokratie und Klimaschutz zu stärken und unser Recht auf Zukunft einzufordern. Bist Du dabei? Streik finden! Paula ist Aktivistin bei Fridays for Future und Pfadfinderin. Sie kommt aus Karlsruhe und setzt sich dort und bundesweit für Demokratie und eine sozial-ökologische Klimapolitik ein. Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
author = "JonAuer"
year_published = 2025
year_updated = 2025
clearnet = "https://fridaysforfuture.de/klima-demokratie-worauf-es-jetzt-ankommt"
