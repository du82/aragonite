full_description = "MITMACHEN Du willst bei Fridays for Future mitmachen? Hier findest Du verschiedene Wege Dich zu engagieren. Wann war noch mal der erste Globale Klimastreik? Was ist zur letzten Weltklimakonferenz passiert? Und wann hat Fridays for Future seine Forderungen veröffentlicht? Diese Übersicht über alle Aktionen hilft Dir weiter! Zur Aktions-Übersicht Wo Du mithelfen kannst: Momentan gibt es über 500 Ortsgruppen deutschlandweit und es werden immer mehr. Hier findest du eine Gruppe in Deiner Nähe. Ortsgruppen Arbeitsgruppen agieren bundesweit und sind auf Themen bezogen, die national und international organisiert werden. In diesen AGs kannst Du Dich engagieren. Arbeitsgruppen Hier findest Du heraus wann und wo die nächsten Streiks stattfinden. Streiks werden von Ortsgruppen organisiert. Streiks Aus der ganzen Breite der Gesellschaft sind über 40 for Future-Gruppen entstanden und haben Ortsgruppen in allen Winkeln Deutschlands gegründet. for Future-Bündnis Und sonst so: In einem Klimacamp geht vieles, was auf Demos nicht so geht. In diesen Zeltlagern ist Raum für Workshops zu Themen rund ums Klima, für Vernetzung und neue Begegnungen. Klimacamps Um unsere Streiks groß zu machen, muss ordentlich mobilisiert werden. Hier findest Du Druckvorlagen für Sticker, Flyer, Plakate und einiges mehr. Mobimaterial In Deinem Ort gibt es noch keinen Klimastreik? Organisiere doch einfach selber eine Aktion! Es ist ganz einfach. Im Leitfaden wird Dir alles Schritt für Schritt erklärt. How To Klimastreik Keine Zeit, aber Geld? Auch finanzielle Unterstützung ist entscheidend, wichtig und hilfreich. Spenden .entry-content, .entry-summary, .page-content { margin-top: -8.5em; }"
