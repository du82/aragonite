["https://fridaysforfuture.de/wie-niedrig-haetten-sies-denn-gerne-cop-daily-tag-12"]
title = "“Wie niedrig hätten Sie’s denn gerne?“ | COP Daily Tag 12 | Fridays for Future"
description = "Crunchtime bei der UN-Klimakonferenz. Eigentlich sollte heute die COP offiziell zu Ende gehen. Doch von einer Abschlusserklärung mit Inhalt sind wir immer noch weit entfernt. neuer entwurf zum abshlussbericht Nachdem der gestrige Entwurf zur Abschlusserklärung von allen Seiten zurückgewiesen wurde, hat die COP Präsidentschaft heute Mittag ein neues Papier vorgestellt. 250 Milliarden USD jährlich sollen"
full_description = "“Wie niedrig hätten Sie’s denn gerne?“ | COP Daily Tag 12 22. November 202422. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged Crunchtime bei der UN-Klimakonferenz. Eigentlich sollte heute die COP offiziell zu Ende gehen. Doch von einer Abschlusserklärung mit Inhalt sind wir immer noch weit entfernt. neuer entwurf zum abshlussbericht Nachdem der gestrige Entwurf zur Abschlusserklärung von allen Seiten zurückgewiesen wurde, hat die COP Präsidentschaft heute Mittag ein neues Papier vorgestellt. 250 Milliarden USD jährlich sollen die Industrieländer für den Klimafond zahlen. Das ist zwar mehr als doppelt so viel, wie das bisherige Finanzziel beträgt, aber immer noch nur ein Tropfen auf den heißen Stein im Angesicht der 1,3 Billionen USD jährlich, die es eigentlich bräuchte. Ein weiteres Problem an den 250 Milliarden USD – es ist nicht festgelegt, wie das Geld zustande kommt. Im aktuellen Entwurf zählen sowohl Gelder aus den Haushalten der Staaten zu den 250 Milliarden, als auch günstige Krediten, die ärmeren Länder vergeben werden oder private Investitionen von Unternehmen. Das wäre fatal, denn gerade private Gelder oder Kredite helfen den Ländern, denen das Geld aus dem Finanztopf zugutekommen soll, fast gar nicht. Das 250 Milliarden Ziel wäre somit nicht nur viel zu niedrig, sondern auch maximal unhilfreich für die tatsächlich betroffenen Länder. Auch um die Passagen zum fossilen Ausstieg sieht es noch schlecht aus. So bleibt weiter unklar, ob das Bekenntnis zum fossilen Ausstieg von der letzten COP bestehen bleibt. Eine Verbesserung im Vergleich zu gestern gab es dann doch – die 1,3 Billionen USD jährlich haben es jetzt endlich in den Entwurf für die Abschlusserklärung geschafft. Wer das Geld aber zahlen soll, das lässt der Entwurf offen. In Summe also nicht wirklich ein Fortschritt im Entwurf der Abschlusserklärungen. Jetzt liegt also ein konkreter Vorschlag auf dem Tisch liegt, zu dem erstmal eine bessere Alternative gefunden werden muss. Ob die Geberbasis (um China und die Golfstaaten) erweitert wird, bleibt weiter offen. Auch weil die Industrieländer und vor allem die EU von sich aus immer noch keine klare Summe genannt haben, die sie zahlen wollen. Wir sind bereit, mehr zur internationalen Klimafinanzierung beizutragen, aber dann müssen das auch andere große Emittenten wie die Golfstaaten und China ebenfalls tun – Außenministerin Annalena Baerbock zu der aktuellen Verhandlungssituation. Damit fasst sie die Verhandlungstaktik der EU gut zusammen: Solange sich China und die Golfstaaten nicht verpflichten, auch zur Klimafinanzierung beizutragen, werde die EU keine konkreten Summen auf den Tisch legen. Wie gut diese Taktik aber funktioniert hat, das zeigen die letzten zwei Wochen. Bis jetzt haben wir kein Finanzierungsziel und die EU, allen voran Deutschland riskiert mit dieser Verhandlungstaktik, dass die COP29 ohne konkrete Ergebnisse endet. Jetzt wäre die Zeit konkrete Zahlen auf den Tisch zu legen, denn die Zeit rennt und der aktuelle Entwurf kann auf keinen Fall so bleiben, wie er ist. Die Wut und Frustration ist vor allem bei den Ländern zu spüren, die am meisten unter der Klimakrise leiden. Vor allem über ihre Zukunft wird hier verhandelt und dass die großen Wirtschaftsnationen sich in der Frage der Klimafinanzierung nicht einig werden, sorgt – milde ausgedrückt – für Unverständnis. Die vorgeschlagenen 250 Milliarden Dollar werden zu einem inakzeptablen Verlust von Menschenleben in Afrika und auf der ganzen Welt führen und die Zukunft unserer Welt gefährden. – Ali Mohamed, Vorsitzender der afrikanischen Gruppe der Verhandlungsführer Mit dem Vorschlag spucken die Industrieländer gefährdeten Ländern wie meinem Land ins Gesicht. Sie geben uns Krümel, während wir die Toten ertragen müssen – unverschämt, böse und ohne Reue – Juan-Carlos Monterrey-Gomez, Verhandlunsgführer von Panama. [Wir] sind zutiefst enttäuscht vom Zustand des neuesten Textes, der die Parteien prinzipiell fragt: Wie niedrig hätten Sie’s denn gerne?“ – Alianz kleiner Inselstaaten (AOSIS) Gibt es keine weiteren Änderungen am Entwurf, wäre das eine absolute Katastrophe. Die COP29 würde ohne richtiges Klimafinanzierungsziel enden. In diesem Sinne ist es also ein gutes Zeichen, dass die COP erstmal auf unbestimmte Zeit verlängert wurde. Journalist*innen und den Delegationsmitglieder*innen wurde bereits vor einigen Tagen geraten, keine Abreise vor Sonntag zu buchen. Baerbock bleibtAuch Außenministerin Baerbock hat ihre für heute geplante Abreise nach hinten verschoben. Trotz Krankheit möchte sie die Verhandlungen vorantreiben. Sie wolle weiter Bündnisse schmieden und auf Verhandlungspartner aktiv zugehen. Das ist längst überfällig, denn aktuell sieht es um die Ergebnisse der COP29 schlecht aus. Nach 12 Tagen harten Verhandlungen ist nur klar, dass auf die Verhandlungsführer*innen kommen noch lange Nächte zu. Denn eines ist auch den Delegationen in Baku bewusst: Eine COP29 ohne Ergebnis wäre eine absolute Katastrophe! Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
author = "COP Daily"
year_published = 2024
year_updated = 2024
