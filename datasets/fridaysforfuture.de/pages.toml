["https://fridaysforfuture.de/bundesweite-arbeitsgruppen"]
title = "Bundesweite Arbeitsgruppen | Fridays for Future"
description = "Um auf Bundesebene produktiv arbeiten zu können haben wir sogenannte Arbeitsgruppen (AGs) gebildet. Jede AG hat bestimmte Zuständigkeiten und Aufgaben, die die bundesweite Vernetzung unter den Ortsgruppen sowie Fridays for Future allgemein voranbringen. Hier findest Du alle AGs auf Bundesebene! Lese dir hier die Kurzvorstellungen der verschiedenen Arbeitsgruppen durch und finde die passenden Kontaktmöglichkeiten zu"
full_description = "Bundesweite Arbeitsgruppen Um auf Bundesebene produktiv arbeiten zu können haben wir sogenannte Arbeitsgruppen (AGs) gebildet. Jede AG hat bestimmte Zuständigkeiten und Aufgaben, die die bundesweite Vernetzung unter den Ortsgruppen sowie Fridays for Future allgemein voranbringen. Hier findest Du alle AGs auf Bundesebene! Lese dir hier die Kurzvorstellungen der verschiedenen Arbeitsgruppen durch und finde die passenden Kontaktmöglichkeiten zu ihnen. AG Abgeordnetengespräche Die AG Abgeordnetengespräche unterstützt Ortsgruppen bei der Vorbereitung von Gesprächen mit ihren lokalen Bundestagsabgeordneten. Kontakt:abgeordnetengespraeche@fridaysforfuture.de E-Mail AG Wir bearbeiten die E-Mails, die an die offizielle, deutschlandweite E-Mail-Adresse (kontakt@fridaysforfuture.de) von Fridays for Future gesendet werden. Dies beinhaltet auch Mails die dorthin weitergeleitet werden, wie z.B. von impressum@fridaysforfuture.de und insbesondere Mails, die über allgemeine Anfragen über das Kontaktformular auf der Website gesendet werden. Bearbeiten bedeutet in diesem Fall sowohl beantworten als auch an entsprechende Stellen weiterleiten. Kontakt: kontakt@fridaysforfuture.de Finanz AG Die Finanz AG hat den Anspruch verantwortungsvoll und auch im Interesse der Spender, das Geld auf sinnvoller Art und Weise auszugeben, durch Absprache der Delegierten-Telefonkonferenz. Finanzielle Entscheidungen von Fridays for Future sind, um Transparenz und Planungssicherheit in der Bewegung zu erhöhen, mit Hilfe eines klaren Finanzkonzepts getroffen. Alle finanziellen Mittel über die Fridays for Future auf Bundesebene verfügt, befinden sich auf dem Spendenkonto der Bewegung. Das Spendenkonto existiert primär zur Erstattung von Geld, das Ortsgruppen für mobilisierungs Materialien ausgeben, wie Flyer, Plakate, Kreide, et cetera. Als Leitlinie sollten alle Ortsgruppen maximal 300 Euro im Monat für solche Zwecke ausgeben dürfen, unabhängig von ihrer Größe oder Reichweite. Falls Beträge über 300 Euro anfallen, können diese nach Rücksprache mit den Ortsgruppen-Delegierten in einer Telefonkonferenz genehmigt werden.Alternativ zur Finanzierung von lokalen Bedürfnissen können auch auf Ebene der Ortsgruppen NGOs oder Bündnisse nach finanzieller Unterstützung gefragt werden. Kontakt:finanzen@fridaysforfuture.de Internationale AG Die Internationale AG setzt sich zum Ziel, den Internationalismus innerhalb von FFF zu fördern, denn die Klimakrise ist eine globale Krise und wir müssen global zusammenarbeite um Klimagerechtigkeit zu erreichen.Internationale Themen und Connections zu fördern ist eine Kernaufgabe der AG. Kontakt:internationalismus@fridaysforfuture.de Kooperations AG Die Kooperations AG übernimmt die Koordination der bundesweiten Kooperationsanfragen. Dabei wird nicht unterschieden zwischen Unternehmen, Einzelpersonen oder NGOs. Der Aufgabenbereich umfasst somit alle Kooperation die von bundesweiter Relevanz sind. Der interne Bereich in Form von Zusammenarbeit mit allen For Future Bewegungen, obliegt der Untergruppe NGO’s&Bewegungen (vernetzung@fridaysforfuture.de). Du bist ein Unternehmen, eine Organisation oder Einzelperson und möchtest Fridays for Future Deutschland gegen die Klimakrise unterstützen. Dann kontaktierte uns unter: kooperation@fridaysforfuture.de. Wir freuen uns auf dich/euch! Moderations AG Die Moderations AG verwaltet die bundes- sowie landesweiten und auf Anfrage auch OG/AG-weite Chatgruppen auf verschiedenen Plattformen. Dies umfasst administrative und moderative Aufgaben sowie das Entwickeln und Bereitstellen von Chatbots für verschiedene Dienste. Des Weiteren wird die aktuelle Netiquette überarbeitet und an die einzelnen Plattformen angepasst. Kontakt:messenger@fridaysforfuture.de Newsletter AG Die Newsletter-AG verfasst Berichte, Zusammenfassungen und andere Texte über Neuigkeiten zu Fridays for Future und veröffentlicht diese auf der Website, per E-Mail und über verschiedene Messenger. Kontakt:newsletter@fridaysforfuture.de Presse AG Die Presse AG kümmert sich um das mediale Auftreten von FFF. Dafür gibt es jede Woche eine Beispiel-Pressemitteilung, die Anfang der Woche von der AG verfasst wird und von den OGs genutzt werden kann. Zu besonderen Ereignissen verschickt die AG auch bundesweite PMs. Kontakt:presse@fridaysforfuture.de Rechtshilfe und Sicherheits AG Die Rechtshilfe und Sicherheits AG betreibt Aufklärungsarbeit für Fridays for Future Aktivistis bei rechtlichen Problemen und Fragen steht sie als Anlaufstelle zur Verfügung. Außerdem kümmert sie sich um Prozesssicherheit, technische Sicherheit, akute Unterstützung bei Gefahrensituationen und Vernetzung für Sicherheitskonzepte für Demos Kontakt:rechtshilfe@fridaysforfuture.de Regio AG Die AG Regionalgruppenbetreuung beschäftigt sich mit der Betreuung und Eingliederung neuer Ortsgruppen (OGs) in die bundesweite Struktur. Dabei setzen sich die Personen der Regionalgruppenbetreuung mit den einzelnen OGs in Kontakt. Dabei kümmern wir uns primär um die Registrierung der Delegierten, bei der wichtige Infos abgefragt werden. Ihr bekommt von uns eure Ortsgruppenmailadresse [ortsgruppe]@fridaysforfuture.de. Damit können wir unter der Bundesebene eine gute Kommunikation gewährleisten. Wir stellen eure Messengergruppen auf unsere Website, damit eure Mitglieder euch leicht erreichen können. Außerdem sind wir für die Weitergabe der Deli Kontakte zuständig. Dort geben wir auf Anfrage einen Kontakt weiter, damit ein anderer Delegierter oder Arbeitsgruppe sowie die Bundesorgane Deli-TK, CTF und AGSK ihre Arbeit bewältigen können (nach Zustimmung der Person). Sonst könnt ihr eine E-Mail an eure Ortsgruppe schreiben. Wir stellen Formulare bereit, um diese Kommunikationswege möglich zu machen.Die Regionalgruppenbetreuung möchte demokratische Wahlen in den Ortsgruppen, jedoch möchten wir uns keinesfalls einmischen, sondern euch zu einer sinnvollen Konsensfindung anregen. Das heißt zum Beispiel auf Plena auch ein Protokoll zu führen. Wir sind junge Menschen und wir politisieren uns gerade selber, dazu möchten wir mit den Handlungsempfehlungen beitragen. Kontakt:regional@fridaysforfuture.de Social Media AG Die Social Media AG beschäftigt sich mit der Verwaltung der Social Media Kanäle von Fridays for Future Deutschland und allen Ortsgruppen. Wir verwalten die öffentliche Präsenz von Fridays for Future über Social Media und arbeiten stetig daran, diese zu optimieren und weiterzuentwickeln. Unsere täglichen Aufgaben bestehen darin, neue Publikationen in Form von Beiträgen, Bildern, Storys und Kommentaren zu erarbeiten und diese im bestmöglichen Rahmen zu vermarkten. Kontakt:socialmedia@fridaysforfuture.de Strategie AG Es soll, ein Raum geschaffen werden, in dem Strategiedebatten geführt und über grundlegende Fragen der Bewegung diskutiert werden kann. Wir verstehen uns dabei als reine Organisator*innen und Sammler*innen von Meinungen, explizit nicht als Organ, welches verbindliche Vorgaben formuliert. Wir werden OGs dazu aufrufen und motivieren sich mit dem Thema zu beschäftigen und werden ihren Input sammeln. Der Raum dazu und die Vernetzung wird von uns gestellt – wir wollen schlicht Diskussionen, die sowieso geführt werden, sinnvoll vernetzen und organisieren, damit auch etwas dabei rauskommt, von dem alle profitieren. Kontakt:ag.strategie@fridaysforfuture.de Web AG Die Website AG kümmert sich bei FFF um alles, was mit der Website sowie anderen Webservices zu tun hat. Zu den Aufgaben gehören die folgenden Punkte: Website betreuen und Inhalt aktuell halten Webtools und deren Server einrichten und verwalten Server betreuen E-Mails für die AGs/OGs einrichten Kontakt: website@fridaysforfuture.de"
year_published = 2025
