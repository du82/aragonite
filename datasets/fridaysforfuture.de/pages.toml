["https://fridaysforfuture.de/forderungen/landwirtschaft"]
title = "Forderungen im Bereich Landwirtschaft | Fridays for Future"
description = "Präambel Im Bereich der Landwirtschaft können wir als Gesellschaft entweder einen großen Schritt Richtung Klimaschutz und Klimagerechtigkeit tun, oder aber weiterhin die Klimakatastrophe anheizen. Momentan trägt die Landwirtschaft zu einem erheblichen Anteil an den globalen Treibhausgasemissionen bei, ist jedoch andererseits ein Sektor der sehr stark unter den Auswirkungen der Erderwärmung leidet. Bei einem Umbau der Landwirtschaft"
full_description = "Forderungen im Bereich Landwirtschaft Präambel Im Bereich der Landwirtschaft können wir als Gesellschaft entweder einen großen Schritt Richtung Klimaschutz und Klimagerechtigkeit tun, oder aber weiterhin die Klimakatastrophe anheizen. Momentan trägt die Landwirtschaft zu einem erheblichen Anteil an den globalen Treibhausgasemissionen bei, ist jedoch andererseits ein Sektor der sehr stark unter den Auswirkungen der Erderwärmung leidet. Bei einem Umbau der Landwirtschaft hinzu einer nachhaltigen und umweltfreundlichen Landbewirtschaftung eröffnen sich jedoch große Chancen und richtige „Gamechanger“ für globalen Klimaschutz und Klimagerechtigkeit. Gerade die Landwirtschaft mit ihrem Potenzial als Kohlenstoff-Senke zu dienen, kann entscheidend dazu beitragen die globale Erderwärmung zu stoppen, gleichzeitig kann durch das Nährstoff- und Wasserspeicherpotential des Bodens die globale Versorgung mit Lebensmitteln besser gesichert werden. 1. Externe Kosten der Landwirtschaft internalisieren Kosten, die der Allgemeinheit aufgrund von Umweltverschmutzungen (Pestizide, Treibhausgasemissionen, etc.) entstehen, müssen auf die Verursacher umgelegt werden. 2. Landwirtschaftliche und natürliche CO2-Senken 2.1 Humusaufbau fördern, Hinderungsregelungen beseitigen Maßnahmen zum Aufbau von Humus in der Landwirtschaft fördern, regulatorische Hindernisse (z. B. in der Düngeverordnung oder in der Bioabfall-Verordnung) beseitigen. Kreislaufwirtschaft in der Landwirtschaft fördern. 2.2 Moore schützen und wiedervernässen Rahmenbedingungen so gestalten, dass eine Wiedervernässung von Mooren und/oder Paludikulturen für landwirtschaftliche Betriebe attraktiv ist. 2.3 Ökolandbau und extensive Landwirtschaft stärken Rahmenbedingungen so gestalten, dass mindestens 30% Ökolandbau bis 2030 erreicht werden. Extensive Landwirtschaftsformen wie Permakultur, agrarokölogische und regenerative Landwirtschaft, Weidehaltung, etc. fördern. 2.4 Verminderung des Einsatzes von Pestiziden und mineralischen Düngemitteln Mineralicher Stickstoffdünger werden mit hohem Energieaufwand hergestllt. Weitere mineralische Düngemittel sind endlich, und verursachen Emissionen in der Gewinnung und Transport. Pestizide können das ökologische Gleichgewicht stören 2.5 Biodiversität in der Landwirtschaft fördern Hecken, Blühstreifen oder Agroforst können die Biodiversität entscheidend fördern und Emissionen binden.Rechtliche und Förderhindernisse abbauen und ökonomische Anreize für die Erbringung von Naturschutzleistungen setzen. 3. Nutztierhaltung Rahmenbedingungen so zu setzen, das der Nutztierbestand und der Fleischkonsum bis 2035 halbiert werden. 3.1 Flächenbindung für die Tierhaltung Verpflichtende Flächenbindung von maximal 2,5 Großvieh-Einheiten (GV) pro Hektar Fläche einführen. 3.2 Artgerechte und Umweltverträgliche Nutztierhaltung Artgerechte und umweltverträgliche Nutztierhaltungsstandards fördern und sicherstellen. 3.3 Kreislaufwirtschaft in der Futtermittelproduktion fördern Hinderliche Rahmenbedingungen zur Umsetzung einer Kreislaufwirtschaft in der Futtermittelproduktion beseitigen. 4.Verbraucher und Gesellschaft 4.1 Ökonomische Anreize Ökonomische Anreize für den Konsum von mehr pflanzlichen Lebensmitteln schaffen 4.2 Faire Löhne und faire Sozialleistungen Sicherstellen, dass landwirtschaftliche Betriebe fair entlohnt werden und das eine nachhaltige Ernährung für alle Bevölkerungsgruppen möglich ist. Ebenso sollten die Arbeitsbedingungen im lebensmittelverarbeitenden Gewerbe verbessert und alle Arbeitenden gleichwertig entlohnt werden. 4.3 Vorbildfunktion der Gemeinschaftsverpflegung und des Staates Steigerung des Anteils hochwertiger produzierter und ausgewogener Lebensmittel in öffentlichen Einrichtungen. Steigerung der Wertschätzung durch Bildungsarbeit. 4.4 Staatliche Rahmenbedingungen gegen Lebensmittelverschwendung Staatliche Rahmenbedingungen so setzen, dass weniger Lebensmittel verschwendet werden 5. Rahmenbedingungen und internationales 5.1 Bodenmarkt reformieren Zugriff von nichtlandwirtschaftlichen Investoren auf landwirtschaftliche Nutzflächen verhindern. 5.2 Bäuerliche Landwirtschaft stützen Inhabergeführte landwirtschaftliche Betriebe unterstützen 5.3 Fairer internationaler Handel umsetzen Marktzugang für alle, Lieferkettengesetz überarbeiten, Kostenvorteile für nicht nachhaltig erzeugte Produkte beseitigen"
year_published = 2025
clearnet = "https://fridaysforfuture.de/forderungen/landwirtschaft"
