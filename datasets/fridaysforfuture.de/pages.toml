["https://fridaysforfuture.de/streiktermine/faq"]
title = "Streiken – FAQ | Fridays for Future"
description = "Fragen und Antworten zum Thema Streiken. Einen Leitfaden zur Aktions-Organisation findest du hier. Weitere Fragen beantwortet die Rechtshilfe-Arbeitsgruppe gerne direkt. Allgemein Wie organisiere ich einen Streik in meiner Stadt? Dazu findest du hier einen Leitfaden. Einen Leitfaden konkret zur Versammlungs-Leitung findest Du hier. Wichtig: Es ist ratsam, den Streik so früh wie möglich anzumelden. Dann"
full_description = "Streiken – FAQ Fragen und Antworten zum Thema Streiken. Einen Leitfaden zur Aktions-Organisation findest du hier. Weitere Fragen beantwortet die Rechtshilfe-Arbeitsgruppe gerne direkt. Allgemein Wie organisiere ich einen Streik in meiner Stadt? Dazu findest du hier einen Leitfaden. Einen Leitfaden konkret zur Versammlungs-Leitung findest Du hier. Wichtig: Es ist ratsam, den Streik so früh wie möglich anzumelden. Dann kannst du nämlich bei rechtlichen Rückfragen/Schwierigkeiten noch Unterstützung bekommen. Wie vernetze ich mich mit anderen? Gibt es schon eine Gruppe bei dir? Schau hier mal nach. Es gibt noch keine Gruppe bei dir? Erstelle eine Whatsapp-Gruppe für deine Stadt! Schick den Link deiner Stadt in die Gruppe des Bundeslands. Die Gruppe findest du hier. Schreib an regional@fridaysforfuture.de, dass ihr euch gegründet habt. Einen Leitfaden zur Gründung einer Ortsgruppe findest du auch hier. Wo kann ich mich mit anderen treffen? Für einen Treffpunkt kannst du NGO´s bei dir vor Ort anfragen. Die Kontaktdaten dafür kannst du u.a. hier herausfinden: BUND: https://www.bundjugend.de/ueber-uns/bundjugend-vor-ort/ Naturfreunde: https://www.naturfreunde.de/gruppe/suche Greenpeace: https://www.greenpeace.de/gruppen/uebersicht Wie erscheine ich in der Presse? Dinge, die wir dir empfehlen, um eine erfolgreiche Pressearbeit zu garantieren, sind unter anderem: Schreibe eine Pressemitteilung! Eine Pressemitteilung ist ein Text von ca. einer dreiviertel Seite, in dem du euren Streik und die dazugehörigen Proteste ankündigst und gerne auch die Presse einlädst. Eine Pressemitteilung sollte diese Komponenten enthalten: Eine kurze Einleitung, die alle W-Fragen wie zum Beispiel Wo?, Wann?, Was?, Wie? und auch kurz Warum? zu eurem Streik beantwortet. Ein bis zwei „Zitate“, in denen sich Gruppenmitglieder von euch zu eurer politischen Motivation und den Gründen für den Streik äußern. Dieser Teil ist praktisch dazu da, das Warum noch genauer auszuführen! Falls ihr wollt, einen Informationsblock, in dem ihr die Fridays for Future Bewegung auf internationaler und nationaler Ebene erklärt. Eine Einladung an alle Interessierten und die Pressevertreter*innen. Ein paar Ansprechpartner*innen (mit Telefon und E-Mail) für die Presse. Es ist sehr nützlich, wenn diejenigen Personen mit den Zitaten auch Ansprechpartner*innen sind. Außerdem ist es praktisch, wenn diese Ansprechpersonen während des Streiks erreichbar sind. Verschicke die Pressemitteilung: an deine lokalen Zeitungen, an lokale Fernseh- und Radiosender. Außerdem ist es empfehlenswert auch an das lokale Büro der Deutschen Presseagentur zu schreiben. Das nächste Regionalbüro findest du hier: https://www.dpa.com/de/kontakt/redaktion/ (wenn du sicher gehen möchtest): Kontaktiere die Redaktionen noch einmal telefonisch. Erzähle von eurem Streik und weise auf eure E-Mail hin. Hier findest du eine Beispiel-Pressemitteilung, an der du dich gerne orientieren kannst. Arbeite mit Social Media! Es lohnt sich momentan sehr, wenn ihr euch als Gruppe Social Media-Accounts anschafft und diese Accounts auch betreut. Solche Accounts empfehlen wir euch besonders bei Twitter, Instagram und Facebook. Um möglichst viel Reichweite auf diesen Plattformen zu erreichen, könnt ihr Beiträge von anderen Ortsgruppen oder von den bundesweiten Stellen reposten oder eure eigenen Ideen ins Spiel bringen. Falls ihr noch Fragen bezüglich der Social Media-Arbeit habt, wendet euch an die Social Media-WhatsApp-Gruppe auf Bundesebene oder kontaktiert uns per Mail. Wie überzeuge ich andere, mitzumachen? Um Unterstützer*innen zu finden, bringt es meist sehr viel, mit Schüler und Studierendenvertretungen in Kontakt zu treten. Dafür könnt ihr einfach Bekannte in diesen Gremien ansprechen oder eine Email schreiben. Eine vorformulierte Email, die ihr nutzen könnt findet ihr hier. Um auf eure Streiks und Demos aufmerksam zu machen, könnt ihr Flyer verteilen und Plakate aufhängen. Hier kann vorgefertigtes Material heruntergeladen werden. Teilt Links zu dieser Website und zu euren und unseren Social Media-Accounts. Die simpelste Methode, andere zu überzeugen, ist jedoch mit den Leuten in eurem Umfeld zu reden und Diskussionen über das Thema anzustoßen. Dies könnt ihr zum Beispiel in eurer Schule tun. Was kann ich meinen Lehrer*innen schreiben? Unerwähnt sollte an dieser Stelle nicht der FFF-Entschuldigungsgenerator nicht sein. Rechtliches Was mache ich, wenn mir mit Bußgeldern/Geldstrafen gedroht wird? Wende dich möglichst schnell an legal@fridaysforfuture.de. Wir gucken, ob wir helfen können. Ist es möglich, legal zum Protest die Schule zu bestreiken? Gibt es „Gesetzeslücken“, die es zulassen, dass die Schüler*innen während der Unterrichtszeit statt in die Schule zum Demonstrieren gehen? Du kannst versuchen, dich vom Unterricht freistellen zu lassen. Dazu kannst du einfach unseren interaktiven Entschuldigungsgenerator verwenden: Jetzt Entschuldigung generieren! Außerdem kannst du versuchen, deine Lehrer*innen bzw. deine Schulleitung davon zu überzeugen, die Demonstration als Schulveranstaltung, quasi als Exkursion anzusehen. Um das zu erreichen, kannst du z.B. mit den Schulgesetzen bzw. dem Bildungsauftrag der Schulen in deinem Bundesland argumentieren. Passende Stellen kannst du hier heraussuchen: https://www.kmk.org/dokumentation-statistik/rechtsvorschriften-lehrplaene/uebersicht-schulgesetze.html Hier ein Beispiel aus Niedersachsen: Nach § 2 Niedersächsisches Schulgesetz (NSchG) sollen die Schüler*innen u.a. fähig werden, die Grundrechte für sich und jeden anderen wirksam werden zu lassen, die sich daraus ergebende staatsbürgerliche Verantwortung zu verstehen und zur demokratischen Gestaltung der Gesellschaft beizutragen, ökologische Zusammenhänge zu erfassen und für die Erhaltung der Umwelt Verantwortung zu tragen. Die Schule soll Schüler*innen hierfür auch den erforderlichen Erfahrungsraum und die erforderliche Gestaltungsfreiheit bieten (§ 2 Abs. 2 NschG). Rechtlich kann aber nicht dagegen vorgegangen werden, wenn deine Schule sowohl die Beurlaubung als auch den Wunsch nach einer Schulveranstaltung ablehnt. Welche Folgen kann es für die Schüler*innen und/oder Studierenden haben, wenn sie, statt in den Unterricht zu gehen, für das Klima streiken und demonstrieren? Auf unentschuldigtes Fehlen kann die Schule zunächst einmal mit pädagogischen Maßnahmen reagieren. Typische Beispiele für solche Erziehungsmaßnahmen sind Ermahnungen, Strafarbeiten oder Nachsitzen. Bei dauerhaftem unentschuldigten Fehlen kann die Schule zu formellen Erziehungs- und Ordnungsmaßnahmen bis hin zum Schulausschluss greifen. So weit darf aber nur gegangen werden, wenn der normale Schulbetrieb durch dein Handeln auf Dauer behindert werden würde. (Da wir ja nur freitags streiken, halten wir es für unwahrscheinlich, dass es so weit kommen würde.) Die detailreichen Regelungen zu Ende und Befreiungen von der Schulpflicht unterscheiden sich in den Bundesländern und können hier nicht vollständig dargestellt werden. In einigen Ländern ist der Verstoß gegen die Schulpflicht nicht nur für Eltern, sondern auch für die Schüler*innen eine Ordnungswidrigkeit (z.B. nach § 92 Abs. 1 Nr 1 i.V.m. § 72 Abs. 3 Schulgesetz für Baden-Württemberg; § 176 Abs. 1 Nr. 1 Niedersächsisches Schulgesetz). In hartnäckigen Fällen kann dann gegen Schulpflichtige ab 14 Jahren auch eine Geldbuße verhängt werden. Ob eine Anwesenheitspflicht bei Lehrveranstaltungen an Hochschulen gilt, ist abhängig von Bundesland und der jeweiligen Prüfungsordnung der Hochschule. Mögliche Konsequenzen richten sich dann ebenfalls nach der jeweiligen Prüfungsordnung. Eine Ordnungswidrigkeit ist die Verletzung einer Anwesenheitspflicht für Studierende einer Hochschule aber nicht. Ihnen drohen also keine Bußgelder. Bekommen Schüler*innen unentschuldigte Fehlstunden angerechnet, falls sie sich am Streik beteiligen? Wenn du unentschuldigt fehlst, ja. Sieh dir dazu die oben aufgeführten Möglichkeiten an. Inwieweit kann und wird die Polizei oder das Ordnungsamt eingreifen, um Schüler*innen dazu zu bewegen, ihre Schulpflicht wahrzunehmen? Es ist sehr ungewöhnlich und bei unseren Streiks noch nie vorgekommen, dass Schulen die Polizei darum bitten, Schüler*innen zum Unterricht zu zwingen. Prinzipiell enthalten aber fast alle Schulgesetze Regelungen über den Schulzwang. Unentschuldigt der Schule fernbleibende Schüler*innen können daher von der Polizei auch mit unmittelbarem Zwang zum Besuch des Unterrichts gezwungen werden. Wie sind Schüler*innen während des Streiks versichert? Unfälle während des unentschuldigten Fehlens sind nicht über die Schule versichert. Deine gesetzliche Krankenversicherung greift aber weiterhin. Was müssen die Schüler*innen beachten, wenn sie andere Schüler*innen dazu aufrufen, sich am Schulstreik für das Klima zu beteiligen? Wenn du ausdrücklich dazu aufrufst, unentschuldigt vom Unterricht fernzubleiben, ist das als Aufruf zu einer Ordnungswidrigkeit selbst eine Ordnungswidrigkeit. Das gilt, wenn der Aufruf in einer Versammlung (z.B. auf einer Demo) oder durch das Verbreiten von Schriften, Bildträgern, Abbildungen erfolgt (§ 116 OWiG). Auch ohne Aufruf in einer Versammlung oder ohne Verbreiten von Schriften ist die Anstiftung zu einer Ordnungswidrigkeit eine Ordnungswidrigkeit, wenn es tatsächlich zu einem unentschuldigten Fehlen kommt (§ 14 OWiG). Beide Varianten können für Jugendliche ab 14 Jahren daher ein Bußgeld nach sich ziehen. Wir denken also, dass du Formulierungen wie z.B. „Ich streike mit hunderten Anderen am XX.XX am Ort X“ nutzen kannst. Wie ist die allgemeine Situation bezüglich der Bewerbung eines Streikes und dürfen wir in der Schule Werbung machen? Grundsätzlich gilt das Recht auf freie Meinungsäußerung auch für Schüler*innen in der Schule. Die Meinungsfreiheit kann aber eingeschränkt werden, wenn das zur Erfüllung des schulischen Bildungs- und Erziehungsauftrages erforderlich und in der Wahl der Mittel angemessen ist. Daher kann die Schule Aufrufe zu Schulstreiks bzw. Unterrichtsboykotts als rechtswidrige Störung des Schulbetriebs unterbinden und darauf mit angemessenen pädagogischen Maßnahmen reagieren. (Siehe dazu den Tipp bei der vorigen Frage) Schülerzeitungen sind von allein Schüler*innen eigenverantwortlich herausgegebene periodische oder auch einmalige Druckerzeugnisse. Sie unterfallen der grundrechtlich geschützte Pressefreiheit. Eine Vorzensur ist verfassungsrechtlich unzulässig, deine Schule kann also eine Veröffentlichung nicht verhindern. Einzelheiten zu Schülerzeitungen regeln die Schulgesetze der einzelnen Bundesländer. Wie kann sichergestellt werden, dass die Person, die eine Schüler*innen-Demonstration angemeldet hat, nicht wegen des Aufrufes zu einer Ordnungswidrigkeit zur Verantwortung gezogen werden kann? Eine Demonstration anzumelden ist nicht ordnungswidrig! Das heißt aber auch, dass deutlich gemacht werden muss, dass die Person, welche die Demonstration anmeldet, sie eben nur anmeldet, aber nicht gleich zum unerlaubten Fehlen vom Unterricht aufruft. Es ist also wichtig zu betonen, dass die Person einzig und allein eine Demonstration anmeldet und nicht zum „Schwänzen“ aufruft. Gibt es einen Hinweis, der auf Flyer oder die Website gesetzt werden sollte, um deutlich zu machen, dass die Schüler*innen/Studierenden selber verantwortlich sind und um sich gegen den Vorwurf des Aufrufs zu einer Ordnungswidrigkeit/Straftat zu schützen? Wie bereits oben erläutert, geht es um den großen Unterschied zwischen Streik- und Demonstrationsaufrufen. Ideal wäre es daher, wenn alle Materialien, die zu den Demonstrationen aufrufen, möglichst nicht (explizit) zum direkten „Unterrichtsboykott“ mobilisieren, sondern zu Demonstrationen aufrufen. An Hochschulen drohen keine Ordnungswidrigkeiten, so dass sich diese Problematik dort nicht stellt. Dürfen die SV'en (Schüler*innen-Vertretungen) Werbung für den Streik machen? Welche Konsequenzen könnten auf sie zukommen? Die SV kann zur Wahrnehmung ihrer Aufgaben die Schüler*innen über relevante Vorgänge informieren. Ein Streikrecht, wie es Arbeitnehmer haben, gibt es in der Schule nicht. In einigen Bundesländern gibt es zum Aufruf von Streiks und ähnlichen Veranstaltungen allerdings noch gesetzliche Sonderregelungen. In der Vergangenheit haben allerdings bereits mehrere SV’en zu Streiks aufgerufen und wurden juristisch nicht belangt. Dürfen ASten aus Bundesländern, in denen sie ausdrücklich kein allgemeinpolitisches Mandat haben (sondern sich eigentlich nur mit hochschulpolitischen Sachen beschäftigen dürfen), zum Streik aufrufen/Werbung machen? Welche Lücken kann man nutzen, welche Konsequenzen drohen? Wir empfehlen, sich die Zuständigkeiten der Studierendenschaft in den Hochschulgesetzen der Länder genauer anzuschauen. Es gibt zum Beispiel grundlegend verschiedene Positionen und Aussagen im Hamburger und im Bayrischen Hochschulgesetz. In der Regel ist es ASten allerdings freigestellt, über Aktionen zu informieren. Im Falle eines Aufrufverbotes sollte hierbei aber zumindest formal die Neutralität der Mitteilung gewahrt werden. Welche Konsequenzen kann es für die Lehrer*innen haben, wenn sie zum Streik aufrufen? Die Aufforderung zu unentschuldigtem Fernbleiben vom Unterricht widerspricht den Dienstpflichten der Lehrer*innen und kann zu Disziplinarmaßnahmen führen. Ein genehmigter Klassenausflug oder der Besuch als Maßnahme der politischen Bildung hingegen müssen nicht zwingend so gewertet werden. Trotz alledem raten wir zu großer Vorsicht der Lehrkräfte. Ist Kreidemalerei auf der Straße, dem Gehweg oder einem öffentlichen Platz Sachbeschädigung? Könnten Schüler*innen dazu verpflichtet werden, sie zu entfernen? Die Veränderung des Erscheinungsbildes einer Sache ist nur dann als Sachbeschädigung strafbar, wenn das Erscheinungsbild nicht nur unerheblich und nicht nur vorübergehend verändert wird (§§ 303 Abs. 2, 304 StGB). Bei Kreide, die sich beim nächsten Regen von alleine wieder löst oder mit Wasser und Besen leicht zu entfernen ist, ist das nicht der Fall. Es ist also nicht als Sachbeschädigung strafbar. In vielen Städten gibt es allerdings Gefahrenabwehrverordnungen und Sondernutzungssatzungen, nach denen auch das Beschriften und Bemalen von öffentlichen Straßen und öffentlichen Anlagen oder Einrichtungen verboten ist und als Ordnungswidrigkeit mit Bußgeldern geahndet werden kann. Jedenfalls großflächige und systematische Kreidemalereien oder Kreidemalereien zu (auch politischen) Werbezwecken auf öffentlichen Straßen und Wegen können eine (ohne vorherige Genehmigung) unzulässige Sondernutzung der Straße sein. Kreidemalereien ohne Genehmigung sind je nach konkretem Straßen- und Wegegesetz des Bundeslandes dann u.U. auch ordnungswidrig und können mit Bußgeldern geahndet werden. Gegen Wildplakatieren ist unter diesem Gesichtspunkt schon vorgegangen worden. Weil die Bemalung das Eigentum beeinträchtigt, kann, auch wenn die Bemalung nicht strafbar oder ordnungswidrig ist, der Eigentümer verlangen, die Kreidemalerei zu entfernen, bzw. "
