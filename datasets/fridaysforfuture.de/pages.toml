se ? enterSearchView() : exitSearchView(); } }); searchElement.addEventListener('input', function () { jets.search() }); function enterSearchView() { console.log('enterSearchView') document.getElementById('primary').classList.add('search-view'); jQuery('.su-spoiler').removeClass('su-spoiler-closed'); updateResultsCounter(); _paq.push(['trackGoal', 9]); } function exitSearchView() { document.getElementById('primary').classList.remove('search-view'); jQuery('.su-spoiler').addClass('su-spoiler-closed'); } function updateResultsCounter() { var resultCount = jQuery('.wp-block-table tr:visible').length; document.getElementById('results-info').innerHTML = (resultCount ? resultCount : 'Keine') + ' Suchtreffer'; } } catch (error) { console.error(error); } Jetzt teilen!teilen 2997 teilen teilen E-Mail merken 13 Vier Dinge, die Du tun kannst! Mobi-Material drucken Damit der 14. Februar 2025 so richtig groß wird, kannst Du einfach selber Mobi-Material drucken und den Klimastreik auch in Deiner Straße bekannt machen. Sorge mit Plakaten und Stickern dafür, dass alle in deiner Stadt vom Streik erfahren – wir zählen auf Dich! Mobi-Material-Druckvorlagen Einen eigenen Streik organisieren In Deiner Stadt oder in Deinem Ort gibt es noch keine Aktion am 14. Februar 2025 und Du hast Lust, selber aktiv zu werden? Nichts leichter als das! In unserem Leitfaden erklären wir Dir Schritt für Schritt wie Du eine richtig gute Aktion oder Demonstration auf die Beine stellst. Klick Dich rein! How to Klimastreik! Spenden Alle Streiks und Aktionen sind komplett ehrenamtlich organisiert. Natürlich fallen trotzdem Kosten an. Zum Beispiel für den Druck von Plakaten und Stickern, Technik-Leihgebühren oder ähnliches. Kannst Du mit einer Spende den Streik möglich machen? Finanziell unterstützen! Teilen, teilen, teilen! Damit alle vom Klimastreik mitbekommen, müssen wir natürlich auch auf Social Media ordentlich Werbung machen. Let’s go auf allen Kanälen, #Klimastreik! Klicke einfach auf eines der Bilder, um es herunterzuladen. Jetzt teilen!teilen 2997 teilen teilen E-Mail merken 13 Was wir fordern Die Klimakrise ist hier und jetzt – und sie eskaliert. Während Hitzewellen, Überschwemmungen und Dürrekatastrophen unsere Lebensgrundlagen bedrohen, feuern Superreiche und fossile Konzerne die Klimakrise weiter an. FDP und CDU planen mit Rückschritten beim Klimaschutz, SPD und Grüne üben sich darin, Klimaschutz umzusetzen, aber es darf bloß keiner mitbekommen. Es fehlt eine Antwort, mit der wir der Klimakrise realistisch etwas entgegensetzen können. Das können und wollen wir nicht hinnehmen! Wir haben ein Recht auf Zukunft, und bezahlbarer Klimaschutz ist möglich – wenn wir es wollen. Doch statt sozial gerechte Lösungen voranzutreiben, werden soziale Fördergelder gekürzt und Klimakiller weiter subventioniert. Wir sagen: Schluss mit Realitätsverweigerung und leeren Versprechen! Es braucht endlich ehrliche Klimapolitik, die auf wissenschaftlichen Fakten basiert und alle Menschen mitnimmt. Deswegen fordern wir am 14'''
