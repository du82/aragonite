["https://fridaysforfuture.de/how-to-klimastreik"]
title = "How to Klimastreik! | Fridays for Future"
description = "Cool, dass Du auch in Deiner Stadt einen Klimastreik organisieren willst. Nur wenn wir so richtig viele sind und Fridays for Future wirklich laut auf den Straßen ist, können wir zusammen die Klimakrise wieder an den Küchen- und an den Verhandlungstisch bringen. Dann können wir gemeinsam für eine bessere und klimagerechte Welt einstehen. Und das"
full_description = "How to Klimastreik! Cool, dass Du auch in Deiner Stadt einen Klimastreik organisieren willst. Nur wenn wir so richtig viele sind und Fridays for Future wirklich laut auf den Straßen ist, können wir zusammen die Klimakrise wieder an den Küchen- und an den Verhandlungstisch bringen. Dann können wir gemeinsam für eine bessere und klimagerechte Welt einstehen. Und das ist ganz leicht. Hier sind zehn einfache Schritte, mit denen Du einen richtig guten Klimastreik organisieren kannst. 1 – Check: Gibt es vielleicht schon eine Aktion oder Demo? Bevor Du mit der Organisation Deiner Aktion oder Demonstration beginnst, schau mal auf unserer Streikkarte nach – vielleicht hat eine bereits bestehende Ortsgruppe schon etwas in Deiner Nähe geplant und braucht Unterstützung. Am besten wirfst Du auch mal einen Blick auf die Social Media Kanäle der Ortsgruppen in Deiner Nähe oder fragst direkt zum Beispiel per E-Mail dort nach. 2 – Hol Dir Mitstreiter*innen Es ist noch keine Aktion in Deiner Nähe geplant? Prima, dann bist jetzt Du am Zug! Und am einfachsten ist es, wenn Du nicht alleine bist. Also trommel’ Deine Freund*innen zusammen, frag Nachbar*innen oder Schulkamerad*innen – zusammen macht alles mehr Spaß und ihr könnt noch mehr coole Dinge auf die Beine stellen. Am besten eröffnet ihr zur Planung eine gemeinsame Gruppe auf einem Messenger-Dienst und verabredet euch zu Organisations-Treffen, auf denen ihr alles wichtige besprecht und plant. 3 – Überlegt, was ihr machen wollt Jetzt seid ihr ein Team und habt einen gemeinsamen Plan. Aber was für eine Aktion wollt ihr eigentlich machen? So ein Klimastreik kann ganz vielfältig sein. Wollt ihr mit einem Demonstrationszug zu Fuß durch die Stadt ziehen? Oder mit dem Fahrrad? Lieber eine Kundgebung an einem spannenden Ort abhalten oder einen Infostand veranstalten, mit dem ihr über die Klimakrise aufklärt? Vielleicht wollt ihr euch auch kreativ austoben und an einem wichtigen Ort ein großes Banner aufhängen, Kreidebilder malen, oder was euch sonst noch so einfällt? Oder vielleicht doch etwas ganz anderes? Euren Ideen und eurer Kreativität sind keine Grenzen gesetzt! Überlegt euch, was am besten zu euch passt, worauf ihr am meisten Lust habt und was ihr am coolsten findet. Sobald das steht, legt am besten auch fest, wo und wann eure Aktion starten soll. 4 – Meldet eure Aktion an Die meisten Aktionen und Demonstrationen müssen 48 Stunden im Voraus eurem Ordnungsamt mitgeteilt werden. Wie genau das abläuft und was ihr tun müsst, um eure Aktion anzumelden, findet ihr am einfachsten auf der Internetseite eurer Stadtverwaltung heraus. Vermutlich füllt ihr einfach ein Formular aus und besprecht alles weitere direkt mit den Beamten. Einen Leitfaden zur Versammlungs-Anmeldung haben wir euch auch ausgearbeitet, einen zur Versammlungs-Leitung auch. Mehr Infos zur Streikorganisation findest Du auch in unserem FAQ! Und die Fridays for Future Rechtshilfe-Arbeitsgruppe hilft euch gerne bei allen weiteren Fragen. Praktisch zu wissen: eure Aktion muss in den meisten Fällen nicht genehmigt werden, sondern nur angemeldet werden. Das Ordnungsamt kann eure Aktion außerdem in der Regel auch nicht verbieten, aber vielleicht bestimmte Auflagen erlassen, die ihr dann beachten müsst. 5 – Ein cooles Programm Jetzt wo der bürokratische Aufwand hinter euch liegt kommen wir zu den coolen Dingen. Zum Beispiel zu einem coolen Programm. Was soll auf eurer Aktion passieren? Wer könnte eine Rede halten? Gibt es jemanden, der gut musizieren kann und auftreten möchte? Das alles sind Fragen, mit denen ihr euch jetzt beschäftigen könnt, um eure Aktion inhaltlich besonders spannend und bunt und interessant zu gestalten. Achtet bei der Programmplanung auch auf Inklusion und darauf, dass sich später alle wohl fühlen. 6 – Vergesst die Technik nicht Was wäre eine tolle Aktion oder Demo ohne coole und laute Musik, spannende Reden und energievolle Demosprüche? Wahrscheinlich eine Demo ohne Sound-Technik. Also vergesst nicht, euch eine Musikbox mitzunehmen, ein Megafon einzupacken oder vielleicht sogar eine richtige Tonanlage aufzustellen. Wenn ihr nicht direkt selber diese Technik kaufen oder teure Ausleihgebühren vermeiden wollt, fragt doch mal bei Jugendclubs oder anderen Klima-Organisationen bei euch vor Ort nach. Die haben diese Technik oft bereits und ihr könnt sie euch bestimmt ausleihen, damit die Menschen auf eurer Aktion auch ordentlich was auf die Ohren bekommen. 7 – Werbung, Werbung, Werbung Eure Aktion ist in trockenen Tüchern, ihr habt ein spannendes Programm, Technik, um alle zu beschallen und auch mit dem Ordnungsamt ist alles geklärt – da fehlt nur noch eins: die Leute. Und die müssen natürlich erstmal mitbekommen, dass bei euch ein Klimastreik stattfindet. Also rührt ordentlich die Werbetrommel! Das könnt ihr zum Beispiel mit Plakaten, Flyern und Stickern machen, die ihr selber gestaltet und druckt. Besonders gut funktioniert natürlich immer noch die Mund-zu-Mund-Propaganda. Also erzählt es am besten wirklich allen, egal ob Mitschüler*innen, Arbeitskolleg*innen, Nachbarn, Freund*innen, Bekannten vom Kiosk um die Ecke oder Verwand*innen. Und jung und motiviert wie wir sind, darf natürlich auch Social Media nicht fehlen. Also teilt auch auf Instagram, Facebook, Twitter, WhatsApp, per eMail und so weiter die Infos zu eurer Aktion. Ein cooles Bild zum weiterleiten und teilen über alle Accounts könnt ihr zum Beispiel hier erstellen. Und vielleicht erstellt ihr sogar eigene Social-Media-Accounts für Fridays for Future in eurer Stadt, wenn es die noch nicht gibt. 8 – Ladet die Presse ein Auch Journalist*innen sollen von eurer Aktion natürlich Wind bekommen und darüber berichten. Dafür verschickt ihr am besten eine Pressemitteilung, also eine E-Mail, in der alle wichtigen Informationen zu eurer Aktion oder Demo gesammelt sind. Darin beantwortet ihr die W-Fragen: Was passiert? Wo passiert es? Wann passiert es? Warum passiert es? Und hier gebt ihr außerdem die Kontaktdaten von einer oder mehrerer Personen aus eurem Team an, die für Nachfragen erreichbar sind. Diese Pressemitteilung könnt ihr an Journalist*innen und Redaktionen bei euch vor Ort schicken, also zum Beispiel an euer Lokalradio, eure Kreiszeitung oder das regionale Fernsehteam. Ein konkretes Beispiel für eine Pressemitteilung findet ihr hier. 9 – Gebt uns Bescheid Damit auch online auf unserer Streikkarte vermerkt seid, und damit alle anderen Ortsgruppen auch Bescheid wissen, was ihr vorhabt, gebt bitte kurz Meldung, dass ihr eine Aktion plant. Wenn ihr für eure Aktion oder Demo Geld ausgegeben habt, kann euch das von der Fridays for Future-Bundesebene zurückerstattet werden. Wir können euch auch dabei helfen, Technik auszuleihen und vieles mehr. Und auch wenn ihr noch Fragen habt oder andere Unklarheiten, könnt ihr euch immer gerne melden! Das geht ganz einfach entweder per Mail oder per WhatsApp. 10 – Let’s fetz! Jetzt ist alles getan und der große Tag ist nah. Wir drücken euch die Daumen, dass alles rund läuft. Aber so gut wie ihr jetzt vorbereitet seid, kann nichts mehr schiefgehen. Also habt ganz viel Spaß und hoffentlich eine spannende und coole Aktion! Macht doch mal ein paar Fotos und markiert uns auf Instagram @fridaysforfuture.de damit wir sehen, was ihr auf die Beine gestellt habt. PS – nächstes Mal wieder? Lief es gut? Seid ihr super motiviert und engagiert und wollt endlich was bewegen jetzt? Dann überlegt doch mal, ob ihr vielleicht eine Ortsgruppe gründen und ab jetzt regelmäßiger Aktionen planen wollt. Habt ihr Bock? Schreibt uns einfach eine Mail, dann helfen wir mit allem weiteren! Noch Fragen? eMail schreiben!WhatsApp-Nachricht schreiben! .entry-content, .entry-summary, .page-content { margin-top: -6.0em; }"
year_published = 2025
clearnet = "https://fridaysforfuture.de/how-to-klimastreik"
