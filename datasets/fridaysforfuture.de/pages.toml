["https://fridaysforfuture.de/ortsgruppen/freising"]
title = "OG Freising | Fridays for Future"
description = "Hier stellen wir als OG Freising unsere Forderungen an die Lokalpolitik vor. Diese richten sich zum einen an die Stadt Freising, zum anderen an den Landkreis."
full_description = "Forderungen der OG Freising Wir als OG Freising haben nach dem Vorbild anderer OGs konkrete Forderungen an unsere Regionalpolitik formuliert. Dabei adressieren wir in den relevanten Bereichen jeweils getrennt voneinander die Stadt Freising (die Maßnahmen also, welche im Stadtrat umgesetzt werden müssen) und der Landkreis (wofür dann der Kreistag zuständig ist). Unsere Forderungen sind auch als Download erhältlich: Forderungen and die Stadt FreisingHerunterladen Forderungen an den Landkreis FreisingHerunterladen Wir haben mit 12 unserer zentralen Forderungen die Parteien auf der kommunalen Ebene kontaktiert und um eine Stellungnahme zu den einzelnen Punkten gebeten. Hier steht eine Übersicht mit den Antworten bereit. Bitte unbedingt beachten: Die ausführlichen Antworten sowie die Kommentierung von Fridays for Future ist im zweiten Dokument enthalten. Übersicht der Positionen der ParteienHerunterladen Ausführliche Antworten der ParteienHerunterladen Stadt Freising Mobilität Energie Bau- und Stadtplanung Umwelt- und Naturschutz Land- und Forstwirtschaft Verwaltung Landkreis Freising Mobilität Energie Bau- und Stadtplanung Umwelt- und Naturschutz Land- und Forstwirtschaft Verwaltung Forderungen an die Stadt Freising Vorwort Unsere Forderungen richten sich an den Freisinger Stadtrat, den aktuellen und die folgenden Oberbürgermeister*innen sowie alle Parteien und Personen, die sich auf diese politischen Ämter bewerben. Zudem sprechen wir alle Vereinigungen, Bewegungen und Bürger*innen in Freising an, uns in diesen Forderungen zu unterstützen. Diese Forderungen wurden gemeinsam mit Expert*innen der jeweiligen Themenfelder erarbeitet. Auch Freisinger Bürger*innen haben ihre Wünsche für ein gutes und klimagerechtes Leben in der Stadt und dem Umland eingebracht. Viele dieser Vorschläge sind zudem Teil der sechs Kernmaßnahmen („Kippinterventionen“), die eine im Januar veröffentlichte wissenschaftliche Studie aufzeigt, um die internationalen Klimaziele doch noch erreichen zu können [1]. Die menschengemachte Klimakrise stellt die größte Bedrohung für die Menschheit und unsere Ökosysteme im 21. Jahrhundert dar. Die Folgen wie Meeresspiegelanstieg, Brände, Dürren, Hitzewellen und Artensterben werden immer sichtbarer und die Entwicklung nimmt rasant zu [2,3]. Wir sind die letzte Generation, die diese Entwicklung eindämmen kann, indem wir den Ausstoß an Treibhausgasen stoppen [4]. Deutschland kommt als wohlhabendem Land mit hohen pro- Kopf-Emissionen und der Möglichkeit, in zukunftsträchtige Infrastruktur zu investieren, eine besondere Verantwortung zu. Maßnahmen, die bisher auf nationaler und internationaler Ebene getroffen wurden, sind nicht ausreichend [5]. Die Stadt Freising hat das anerkannt und eine Resolution zum Klimawandel verabschiedet [6]. Wir unterstützen die Stadt in ihren Vorhaben und erwarten ein entschiedenes und ambitioniertes Umsetzen der darin enthaltenen Maßnahmen. Wir fordern: Die Stadt Freising und der Landkreis Freising müssen bis 2030 CO 2 -neutral werden. Als Klimagerechtigkeitsbewegung ist es uns ein Anliegen, dass Klimaschutz nicht auf den Schultern unterprivilegierter Menschen ausgetragen wird. Unsere Vision einer ökologisch-sozialen Transformation ist ein gutes Leben für alle. Als solche bitten wir, unsere Forderungen zu verstehen und gemeinsam an der Umsetzung zu arbeiten. [1] https://www.pnas.org/content/pnas/early/2020/01/14/1900577117.full.pdf[2] IPCC Special Report on Global Warming 2018[3] UN Intergovernmental Science-Policy Platform on Biodiversity and Ecosystem Services (IPBES) Global Assessment Report 2019[4] Scientists for Future zum Klimapaket 2019[5] Lenton et al. Climate Tipping Points – Too Risky to Bet Against. Nature, 2019[6] Freisinger Resolution zum Klimawandel 2020 Mobilität Die Stadt- und Verkehrsplanung soll den Umweltverbund (Fuß, Rad, Bus) klar priorisieren. Dafür müssen die Vorteile des motorisierten Individualverkehrs (MIV) reduziert werden. Dieser ist extrem energieintensiv und trägt deutschlandweit zu rund einem Fünftel der Treibhausgase bei [1]. Daneben hat der MIV einen besonders hohen Flächen- und Ressourcenverbrauch und ist verantwortlich für Lärm, Schadstoffe und Unfälle. Ziel soll eine zukunftsfähige Stadt der kurzen Wege mit erhöhter Lebensqualität sein. Ein Vorbild liefert z.B. die autofreie Stadt Pontevedra in Spanien [2]. Um den Energieverbrauch im notwendigen Maße zu senken, muss Verkehr vermieden und verlagert werden. Die entsprechenden Maßnahmen aus dem Mobilitätskonzept sollen beschleunigt umgesetzt werden. Fuß- und Radverkehr Die Stadt erfüllt das Bürgerbegehren Radentscheid [3] fristgerecht. Sie schafft durchgängige Radrouten und geeignete Verbindungen, um die Trennung der Stadt durch Isar und Bahnschienen zu überwinden. Gleichzeitig beheben breitere Gehwege und barrierefreie Querungshilfen auch die Kritikpunkte von Fußgänger*innen. Mehr Sitzgelegenheiten und Grünflächen verbessern die Aufenthaltsqualität für alle. Motorisierter Individual-Verkehr Die Altstadt ist ab spätestens 2025 autofrei. Tempo 30 wird auf weitere Straßen ausgeweitet (zum Beispiel Erdinger Straße, Wippenhauser Straße, Vöttinger Straße). Zusätzliche Stellen im Ordnungsamt überwachen verstärkt die Einhaltung von Geschwindigkeits- und Parkbeschränkungen. Die Einrichtung von 2 Radabstellplätzen pro Wohnung ermöglicht eine Reduzierung des MIV- Stellplatzschlüssels. Ebenso werden keine neuen öffentlichen Parkhäuser gebaut, während die Stadtwerke ihre Parkgebühren schrittweise anheben, um die bestehenden bis 2025 kostendeckend zu bewirtschaften. Parkplätze unter freiem Himmel werden jährlich rückgebaut. Die Versiegelung mit Straßenflächen hält sich an eine Netto-Null, weshalb die Stadt jeden Neubau minimiert und Möglichkeiten zum Rückbau schafft. Öffentlicher Personen-Nahverkehr Eine Betriebszeit bis 24 Uhr, der 10-Minuten-Takt auf Hauptlinien sowie Busspuren stellen gute Verfügbarkeit sicher. Neue Haltestellen werden nach Bedarf gebaut, während bestehende im Hinblick auf Gemütlichkeit und Sauberkeit aufgewertet werden. Wir erfüllen unsere globale Verantwortung durch insektenfreundlich begrünte Haltestellen und regenerativ betriebene Busse sowie für alle erschwingliche Ticketpreise. Alle vom MVV unabhängigen öffentlichen Verkehrsmittel werden ticketfrei angeboten. [1] https://www.umweltbundesamt.de/themen/klima-energie/treibhausgas-emissionen/emissionsquellen#energie-stationar[2] https://www.sueddeutsche.de/wirtschaft/pontevedra-fussgaenger-autos-1.4259542[3] http://radentscheid.infreising.de/das-will-das-begehren/ Energie Bedingung für eine Energieversorgung zu 100% aus Erneuerbaren Energien ist, die Subvention fossiler Energieträger zu stoppen. Die Stadt Freising soll darauf auf Landes-/Bundes-/EU- und Gemeinde-Ebene hinarbeiten, um zum Beispiel einen CO 2 -Preis, der die realen Kosten [1] deckt, zu erreichen. Weil der Energiebedarf durch die Sektorkopplung stark steigen wird [2], ist der aktuelle Zubau an Erneuerbaren Energien nicht ausreichend [3]. Die öffentliche Hand soll eine deutliche Vorbildfunktion bei allen Maßnahmen übernehmen. Energieplanung und Ausbau Die Stadt Freising deckt bis 2030 ihren Energiebedarf zu 100% aus Erneuerbaren Energien. Ein Energienutzungsplan, der dieses Ziel erreicht, wird erstellt. Ein Ausbau der Stellen für Energie- und Klimaschutz bei der Stadt beschleunigt die Umsetzung. Die Stadtwerke stellen Projektentwickler*innen ein, um den Ausbau umzusetzen. Wind- und Solaranlagen auf stadteigenen Flächen werden bevorzugt in Genossenschaftsmodellen gebaut. Erneuerbare Wärme Nahwärme-Netze werden aus- und umgebaut, damit sie mit Erneuerbaren Energien gespeist werden können (niedrigere Vorlauftemperatur). Das Gasnetz wird re-kommunalisiert und mit Erneuerbaren Energien betrieben. Die Stadt reduziert ihren Wärmebedarf deutlich. Privathaushalte Daneben fördert die Stadt genossenschaftliche und Mieter*innenstrommodelle. Um Fördermöglichkeiten für Privatleute nutzbar zu machen, stellt die Stadt mehr Personal zur Beratung im Energielokal zur Verfügung. Diese Beratung und die der Stadtwerke werden stärker beworben und leichter zugänglich gemacht. [1] https://www.umweltbundesamt.de/daten/umwelt-wirtschaft/gesellschaftliche-kosten-von-umweltbelastungen#umweltkosten-der-strom-und-warmeerzeugung[2] Ausfelder et al.: Sektorkopplung. Untersuchungen und Überlegungen zur Entwicklung eines integrierten Energiesystems (Schriftenreihe Energiesysteme der Zukunft), München 2017.[3] Solarregion Freisinger Land. Strom aus Erneuerbaren Energien 2019. Bau und Stadtplanung Freising wird dem Bedarf an erschwinglichem Wohnraum derzeit nicht gerecht. Gleichzeitig stehen im Moment viele Gebäude in zentraler Lage leer [1] und neue Bodenversiegelung zerstört weiterhin Frei- und Naturräume. Um ihre soziale und ökologische Verantwortung zu erfüllen, muss die Stadt wirtschaftliche Interessen zurückstellen und eine Wohnungspolitik für das Allgemeinwohl anstreben. Bauvorschriften Bauunternehmen müssen ihre Einhaltung der Energieverordnungen, insbesondere bezüglich Dämmung, belegen und eine CO 2 -Bilanzierung bei der Planung von Neubauten und baulichen Veränderungen vorlegen [2]. Darüber hinaus fördert die Stadt den Einsatz von nachhaltigen Werkstoffen wie naturnah und heimisch produziertem Holz, sowohl im Bebauungsplan als auch durch Anreizmaßnahmen und eine Planstelle zur Förderung des nachhaltigen Bauens. Wir veranlassen, dass Neubauten als Plusenergiehäuser gebaut und mit Erneuerbaren Energien versorgt werden [3]. Begrünung Die Stadt verpflichtet bei geeigneter Bauform zur Fassaden- und Dachbegrünung. Bei öffentlicher Wegesanierung wird die Begrünung an Privatgebäuden bereits eingeplant. Bodenversiegelung Die Stadt nutzt alle zur Verfügung stehenden Möglichkeiten, um Flächenverbrauch sozial und ökologisch verträglich zu minimieren. Hierzu müssen sowohl rechtliche Hebel wie eine Erhöhung der Zweitwohnungssteuer [4] als auch baurechtliche Möglichkeiten [5] zur Nachverdichtung abgewogen werden. Neue Versiegelung wird drastisch reduziert [6]. Besonders die Ausweisung neuer Gewerbegebiete ist nur auf klaren Wunsch der lokalen Bevölkerung und mit strikter Verkehrsprüfung legitim. Wohnungspolitik Die Stadt veranlasst eine regelmäßige Prüfung leerstehender Gebäude auf Potenzial für neue Nutzung. Durch Bauvorschriften stellt sie sicher, dass eine flexible Umnutzung möglich ist. Die Stadt stellt in ausreichendem Maße sozialen Wohnraum zur Verfügung. [1] https://www.freising.de/media/user_upload/52_Soziales/5210_pdf-Files/Treffpunkt_Ehrenamt/Agenda/agenda-praesentation-bauen-wohnen-verkehr2019.pdf[2] EnEV-Durchführungsverordnung – Baden-Württemberg[3] https://www.moosburg.de/neubaugebiet-amperauen[4] https://www.umweltbundesamt.de/daten/umwelt-wirtschaft/gesellschaftliche-kosten-von-umweltbelastungen#umweltkosten-der-strom-und-warmeerzeugung[5] BauNVO, §6a[6] https://www.umweltbundesamt.de/themen/nachhaltigkeit-strategien-internationales/umweltrecht/umweltschutz-im-fachrecht/oeffentliches-baurecht#bauleitplanung Umwelt- und Naturschutz Die globale Erwärmung stellt neben der Landnutzung die größte Bedrohung für die Vielfalt des Lebens dar [1]. Die Stadt Freising muss effektive Maßnahmen zur Entwicklung resilienter Ökosysteme und für den Erhalt der natürlichen Lebensgrundlagen ergreifen. Hierbei werden ökosystembasierte Ansätze, die auf der nachhaltigen Nutzbarkeit dauerhaft stabiler Ökosysteme, wie nachhaltig bewirtschafteter Niedermoore beruhen, bevorzugt [2]. Biodiversitätsstrategie Freising erstellt ein Konzept zur Verbesserung des Arten- und Biotopschutzes (z.B. Stadt Bamberg [3]). Es wird Wert auf Biotopvernetzung von in besonderem Maße unter Druck stehenden Arten sowie die Erhaltung und Entwicklung resilienter Ökosysteme gelegt [4]. Ein gemeinsames Vorgehen auf Landkreisebene wird unterstützt, um eine möglichst großflächige Vernetzung zu erreichen. Die Stadt stellt ein regelmäßiges Monitoring sicher. Grünflächenmanagement Intensiv gepflegte Grünflächen wie Rasenflächen und Staudenbeete werden zu extensiv gepflegten Wiesen und Staudenmischpflanzungen mit mehrjährigen, trockenheitsverträglichen und heimischen Arten entwickelt [5]. Die Stadt pflanzt an geeigneten, insbesondere den von Überhitzung bedrohten, Standorten Bäume und Sträucher, die stadtklimafest sind, ein hohes Lebensraumpotential bieten und durch eine angepasste Geschlechterverteilung die allergene Wirkung vermindern (Hilfestellung bei der Artenauswahl geben Gloor und Hofbauer 2018 [6]). Alternativ wird eine temporäre Durchgrünung z.B. durch Containerbäume und Wanderbaumalleen (vgl. Wanderbaumallee München [7]) erreicht oder Fassaden- und Dachbegrünungen angelegt. Es wird geprüft, inwiefern zuvor genannte und weitere Maßnahmen der Biodiversitätsförderung über das bisherige Maß hinaus im Rahmen der Bauleitplanung verbindlich vorgeschrieben oder durch kommunale Förderung angeregt werden können. Klimaanpassungskonzept Die Stadt erstellt ein umfassendes Klimaanpassungskonzept gemäß der Freisinger Resolution zum Klimaschutz (vgl. Klimaanpassungskonzept Stadt Münster [8]). Synergiepotenziale mit dem Umwelt- und Naturschutz werden hierbei berücksichtigt. Die Stadt Freising setzt sich ferner für ein abgestimmtes Vorgehen auf Landkreisebene ein (vgl. Klimaanpassungskonzept Landkreis Ostallgäu [9]). Landschaftspflege und Landwirtschaft Freising setzt sich dafür ein, dass kommunale landwirtschaftliche Fläche in Verbund mit Ausgleichsflächen, Ökokontoflächen und sonstigen Flächen öffentlicher Hand im Sinne des Natur- und Umweltschutzes bewirtschaftet werden. Eine vielfältige Nutzung in Kombination mit der nachhaltigen Produktion Erneuerbarer Energien (z.B. artenreiche und oder mehrjährige Biomassekulturen, Energieholzhecken, Freiflächenphotovoltaik mit extensiver Beweidung) wird angestrebt [10,11]. Ferner setzt sich die Stadt Freising z.B. in Zusammenarbeit mit dem Landkreis, dem BUND Naturschutz, dem Landesbund für Vogelschutz, dem Landschaftspflegeverband sowie Landwirt*innen für ein gemeinsames Verwertungsnetz für Landschaftspflegematerial und Grüngut ein [12,13]. Freisinger Moos Die Stadt Freising verstärkt in Zusammenarbeit mit den Moosanreinerkommunen ihre Bestrebungen zum Moorschutz und Renaturierungsvorhaben. In Kooperation mit den zuständigen Behörden und den Flächeneigentümerinnen und – nutzerinnen werden unter Berücksichtigung der Belange des Naturschutzes moorschonende Bewirtschaftungs- und Vertriebskonzepte entwickelt und durchgeführt [14]. Die Rahmenbedingungen für Renaturierungsvorhaben werden durch Flächenankauf und -tausch verbessert und nötigenfalls Maßnahmen der unterirdischen Bewässerung ergriffen. Neben öffentlichen Fördermitteln können die Maßnahmen über CO 2 -Zertifikate wie z.B. MoorFutures-Kohlenstoffzertifikate [15] finanziert werden. Gewässer und Hochwasserschutz Freising setzt sich in Kooperation mit dem Landkreis intensiv für Schutz, Pflege und Entwicklung von Oberflächengewässern dritter Ordnung und je nach Flächenzugriff für d"
