description = "Die lokale Website von Fridays For Future in Wuppertal. Hier findet ihr die wichtigsten Infos und Termine der Wuppertaler Ortsgruppe"
full_description = "Fridays for Future in Wuppertal Hey, wir sind FFF Wuppertal Wir sind ein Zusammenschluss von Jugendlichen, die glauben, dass eine gerechte Welt für alle möglich ist. Als Teil der weltweiten Fridays for Future Bewegung sind wir seit über 5 Jahren in Wuppertal aktiv. 2019 standen wir nach dem Motto „Freitag ist Streiktag !“ quasi jeden Freitag auf der Straße, statt in die Schule und Unis oder zur Arbeit etc. zu gehen. Zusammen mit bis zu 5000 Menschen haben wir gestreikt, haben wir die Politik aufgefordert endlich zu handeln. Heute ist unsere Gruppe weiterhin auf der Straße laut, hat aber auch in der Lokalpolitik Fuß gefasst. Gemeinsam mit verschiedenen Mobilitätsverbänden setzen wir uns für eine sozial-gerechte Verkehrswende ein und sind in verschiedenen Beiräten vertreten. Dazu suchen wir regelmäßig das Gespräch mit verantwortlichen Personen und mischen uns ein. Wir haben den Anspruch, für eine gerechte Welt für alle zu kämpfen. Um dem Gerecht zu werden sind nicht nur Aktionen nach außen – sondern auch interne Bildungs- und Awarenessarbeit ein Teil unserer Arbeit. Melde dich gerne, bei diesbezüglichen Anregungen. Klimastreik zur Bundestagswahl Hol dein Demoschild raus: Am 14.02. ist Klimastreik zur Bundestagswahl! Gemeinsam kämpfen wir für einen Klimawahlkampf und fordern die Parteien auf endlich realistische Klimapolitik zu machen! Politik und Medien versinken in rechten Scheindebatten, während die AFD auftrumpfen kann. CDU/CSU und FDP laufen dem Rechtspopulismus hinterher und haben sich von evidenzbasierter Politik längst verabschiedet. Wir stellen uns dem entgegen und fordern ein, dass die Klimakrise auch als solche behandelt wird. Die Klimakrise ist die größte Bedrohung unserer Zeit, wir werden sie im Wahlkampf endlich auf die 1 setzen! Um 15 Uhr beginnt unsere Kundgebung auf dem Vorplatz des Hauptbahnhof in Elberfeld. Anschließend ziehen wir durch Elberfeld zum Laurentiusplatz. Komm vorbei und mach den Parteien klar: Gute Klimapolitik ist alternativlos! WERDE AKTIV Es gibt so viele Möglichkeiten aktiv zu werden, wir könnten immer mehr machen. Dafür fehlt nur eins: Du! Im Organisationsteam: Wir treffen uns jeden zweite Woche, um Entscheidungen zu treffen, unsere nächsten Aktionen zu planen und uns auszutauschen. Du willst auch in die Orga? Dann komm doch einfach mal zu einen Plenum von uns! Schreib uns dafür einfach auf SocialMedia oder per Mail an. In der Schule/Uni Vernetze dich mit anderen Schüler*innen und mache Aktionen an deiner Schule. Das kann vom Plakat aufhängen bis hin zur gemeinsamen Teilnahme an einen Streik vieles sein. Kontaktier uns, wenn du auf der Suche nach Ideen bist oder Fragen hast. Deine Spende Für Technik, Plakate, Bühnen und viele weiter Sachen fallen hohe Kosten an. Wir sind als politisch unabhängige Jugendbewegung daher auf Spenden angewiesen. Mit den eingenommenen Spendengeldern finanzieren wir unsere Demo und Aktionskosten und internationale Klimagerechtigkeitsarbeit Wir sind für jeden Beitrag dankbar!!! 💚✊ https://fridaysforfuture.de/spenden/ Bleibe immer auf dem laufenden! Forderungen an die Kommunalpolitik der „for Future“-Bewegung Wuppertal Hier geht es zu unseren Forderungen E-Mail Trete mit uns in Kontakt! Schreiben!"
