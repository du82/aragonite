title = "Forderungen – Glossar | Fridays for Future"
description = "Glossar zu unseren Forderungen 1,5 °C-Ziel: Das Ziel, die Erderwärmung langfristig auf unter 1,5 Grad gegenüber dem Niveau vor der Industrialisierung zu begrenzen. Allgemeine Erklärung der Menschenrechte: Eine Resolution der Vereinten Nationen (UN), in der in 30 Artikeln festgehalten ist, welche grundlegenden Rechte jedem Menschen unabhängig von Wohnort, Religion, Geschlecht etc. zustehen sollten. Artikel 20a"
full_description = "Forderungen – Glossar Glossar zu unseren Forderungen 1,5 °C-Ziel: Das Ziel, die Erderwärmung langfristig auf unter 1,5 Grad gegenüber dem Niveau vor der Industrialisierung zu begrenzen. Allgemeine Erklärung der Menschenrechte: Eine Resolution der Vereinten Nationen (UN), in der in 30 Artikeln festgehalten ist, welche grundlegenden Rechte jedem Menschen unabhängig von Wohnort, Religion, Geschlecht etc. zustehen sollten. Artikel 20a Grundgesetz: „Der Staat schützt auch in Verantwortung für die künftigen Generationen die natürlichen Lebensgrundlagen und die Tiere im Rahmen der verfassungsmäßigen Ordnung durch die Gesetzgebung und nach Maßgabe von Gesetz und Recht durch die vollziehende Gewalt und die Rechtsprechung.“ CO2-Steuer: Je nachdem, welche Menge Treibhausgase ausgestoßen wird, muss der Verursacher dafür Geld zahlen. So wird bewirkt, dass der Treibhausgasausstoß verringert wird. Bei der Einführung der Steuer wird ein Startpreis festgesetzt, der dann ansteigt. Energieversorgung: Die Versorgung mit Energie einschließlich Energieträgern. Eine 100% erneuerbare Energieversorgung bedeutet also, dass auch der Energiebedarf in anderen Sektoren als der Stromerzeugung, wie z.B. im Verkehr oder der Wärmebereitstellung durch erneuerbare Energien gedeckt wird. Erneuerbare Energien: Energiequellen, die (fast) unendlich genutzt werden können oder nachwachsen (Wind, Sonne, Wasserkraft, Biomasse, Erdwärme, Gezeiten). Existenziell: Lebenswichtig, betrifft die Existenz- und Lebensgrundlagen und damit das Überleben. Fossile Energieträger: Kohle, Öl und Gas Industrialisierung: Ein Prozess, bei dem Handarbeit durch Fabrikarbeit abgelöst wurde. Initiative: Erster Handlungsschritt IPCC: Intergovernmental Panel on Climate Change, der Weltklimarat. Hier erarbeiten tausende Wissenschaftler*innen ehrenamtlich eine Zusammenfassung des weltweiten Wissensstandes zum Klimawandel. Kipppunkte des Klimas: Übergang von einem Zustand des Klimas in einen neuen. Dies passiert bei Überschreitung einer bestimmten Erwärmung sehr schnell und kann später nicht mehr rückgängig gemacht werden. Erwärmen wir die Erde weiter, wird beispielsweise der tropische Regenwald absterben, der große Mengen an Kohlenstoff speichert. Dadurch würden große Mengen an Treibhausgasen freigesetzt werden, die die Erderwärmung zusätzlich antreiben würden. Klimagerechtigkeit: Die Länder mit einem großen Treibhausgasausstoß müssen ihre Verantwortung dafür übernehmen und gemeinsam mit den ärmeren Ländern Lösungen suchen und umsetzen. Klimakrise: Die nie dagewesene Herausforderung für die Menschheit durch den Klimawandel. Klimaschutzgesetz: Ein Gesetz, mit dem sich die Bundesregierung verbindlich verpflichtet, kurzfristige und langfristige Klimaziele einzuhalten und verbindliche Vorgaben und Maßnahmen für das Erreichen der Ziele in den verschiedenen Sektoren festlegt. Klimasystem: Zusammenfassung aller Bestandteile, die das Klima bilden und verändern (Atmosphäre, Ozeane, Seen, Flüsse, Eis und Schnee, Böden und Gestein, Biosphäre). Kommunalebene: Die politische Verwaltung in Gemeinden und Städten Nettonull: Es wird nur die Menge Treibhausgase ausgestoßen, die durch natürliche Prozesse (z. B. Wachstum von Pflanzen) wieder aufgenommen wird. Okosystem: Zusammenspiel von Lebewesen verschiedener Arten und ihrem Lebensraum Pariser Abkommen; auch: Übereinkommen von Paris: Die verbindliche Vereinbarung von 196 Staaten mit dem Ziel, die Erderwärmung bei möglichst 1,5 Grad gegenüber dem Niveau vor der Industrialisierung zu stoppen. Planetare Grenzen; auch: Belastungsgrenzen der Erde; Grenzen, bei deren Überschreitung die Stabilität der heutigen Ökosysteme und die Lebensgrundlagen des Menschen gefährdet sind und unumkehrbare Schäden drohen. Zu den planetaren Grenzen zählen z. B. Artensterben, Klimawandel, Wasserverbrauch und Landnutzung. Priorisierung: Prozess, in dem festgelegt wird, was dringend ist und daher Vorrang hat. Sektoren: Bereiche, Gebiete (z. B. Landwirtschaft, Transport) Sektorenübergreifend: Mehrere Sektoren betreffend Subventionen: Geldzuschüsse vom Staat an Unternehmen, Betriebe oder Einzelpersonen, um das Wirtschaftsgeschehen zu beeinflussen. Neben Finanzhilfen und Steuervergünstigungen meinen wir hier explizit auch indirekte Subventionen. Subventionen für fossile Energieträger: Subventionen für die Förderung, Verarbeitung und Nutzung von Kohle, Öl und Gas. Die deutsche Regierung subventioniert laut UBA Kohle, Öl und Gas mit ca. 45 Milliarden Euro pro Jahr. Treibhausgasemissionen: Ausstoß von Gasen, die den Treibhauseffekt verstärken und so zur Erderwärmung führen (vor allem CO2, Methan und Lachgas) UBA: Umweltbundesamt; die zentrale staatliche Umweltbehörde Deutschlands Ungebremste Erderwärmung: Falls es der Menschheit nicht gelingt, die Treibhausgasemissionen in den nächsten Jahren und Jahrzehnten drastisch zu reduzieren, werden wir die Kipppunkte des Klimasystems überschreiten und die Erderwärmung dann auch mit dramatischen Einsparmaßnahmen von Treibhausgasen nicht mehr stoppen können. Solange wir das 1,5 °C-Ziel einhalten, wird sich das Klima langfristig auf dieser Temperatur stabilisieren und die Erde sich somit nicht weiter erwärmen."
