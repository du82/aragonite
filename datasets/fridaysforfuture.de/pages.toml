title = "FORDERUNGEN FRIDAYS FOR FUTURE BADEN-WÜRTTEMBERG | Fridays for Future"
description = "Fridays for Future Baden-Württemberg stellt Forderungen an Landesregierung."
full_description = "FORDERUNGEN FRIDAYS FOR FUTURE BADEN-WÜRTTEMBERG Hintergrund: Im “Sonderbericht 1,5 °C globale Erwärmung“ des Weltklimarates IPCC werden gravierende Unterschiede zwischen einer Klimaerwärmung von 1,5 °C und 2 °C aufgezeigt (u.a. Verdoppelung von Extremereignissen; Auftauen von Permafrostböden von der Fläche des Mittelmeers; Ausweitung extremer Armut um mehrere hundert Millionen Menschen bereits bis 2050; …). Wir fordern, dass Baden- Württemberg (BW) sich im derzeit in der Diskussion befindenden Klimaschutzgesetz (KSG) verpflichtet, mit seinen Klimaschutzmaßnahmen die notwendigen Schritte zur Unterschreitung der 1,5 °C Grenze zu leisten und folgende Punkte im KSG aufzunehmen: Mehr als 20 % der vom Menschen verursachten Zunahme der Konzentration von Treibhausgasen (THG) stammt aus Emissionen der EU einschließlich Deutschlands (Global Carbon Project, Stand 2016). Daraus ergibt sich eine besondere Verantwortung für die Bundesrepublik Deutschland zur Einhaltung der 1,5 °C Grenze. Aus dem dafür noch zulässigen CO2-Budget folgt, bei gleichmäßiger Verteilung auf die Bevölkerung, für BW ein Budget von 420 Mt ab dem 01.01.2020. Bei linearer Reduktion bedeutet dies 88% THG-Reduktion bis 2030 undNettonull 2035. Der dem KSG derzeit zugrunde liegende Reduktionspfad für die THG-Emissionen in BW (THG-Reduktion -42% in 2030) überschreitet die Erderhitzung um 1,5 °C deutlich, da die zugrundeliegenden wissenschaftlichen Arbeiten nicht den Budgetansatz verwendet haben, sondern ein Szenario beschreiben, das bis 2050 das 90%-Minderungsziel des KSG erreicht. Die 90%-Minderung ist nicht mit der überlebenswichtigen 1,5 °C Grenze kompatibel. Es gibt bis heute keine Studie, die aufzeigt, wie Baden-Württemberg sein oben genanntes Budget einhalten kann. Dieser Missstand muss sofort behoben werden. Wir fordern deshalb: DIE ERSTELLUNG EINER WISSENSCHAFTLICHEN STUDIE ZUR EINHALTUNG DER 1,5°C GRENZE MIT AKTIONS- UND REAKTIONSPLAN FÜR BW. Bis Ende 2020 muss eine Studie angefertigt werden, die aufzeigt wie BW sein CO2-Budget für die 1,5 °C Grenze einhalten kann. Aus dieser muss ein verpflichtender Maßnahmenplan abgeleitet werden. Allen Maßnahmen müssen hierbei konkret messbare Reduktionsziele zugeordnet werden. In diesem Maßnahmenplan muss ein jährlicher Monitoring Prozess fest integriert sein. Werden die jährlichen, aus der Studie abgeleiteten, Reduktionsziele verfehlt, muss unverzüglich mit dem vorbereiteten Reaktionsplan gegengelenkt werden. Dadurch entsteht Planungssicherheit und die notwendige schnelle Umsetzung wird möglich. Obwohl diese Studie erst gegen Ende 2020 abgeschlossen sein wird, muss in allen Bereichen sofort und entschieden gehandelt werden. Die Umsetzung zentraler Maßnahmen muss unverzüglich erfolgen. Wir haben uns im Folgenden auf Maßnahmen beschränkt, die im Verantwortungsbereich der Landesregierung liegen. Diese erheben nicht den Anspruch auf Vollständigkeit. Bei der Umsetzung muss stets auf eine sozial gerechte Lastenverteilung geachtet werden. Einführung eines CO2- Schattenpreises von mindestens 180 € pro Tonne CO2-Äquivalent Alle landeseigenen Unternehmen und Einrichtungen müssen bei sämtlichen Entscheidungen und Ausgaben mit einem CO2-Preis von 180 € pro Tonne CO2-Äquivalent rechnen. Bei allen Ausschreibungen muss das Land fordern, dass sich bewerbende Firmen ebenso mit diesem Schattenpreis kalkulieren. Darüber hinaus muss sich die Landesregierung auf Bundesebene für einen CO2-Preis einsetzen, der so hoch ist, wie die Kosten, die uns und zukünftigen Generationen durch THG-Emissionen entstehen (laut UBA Stand 2016 mindestens 180 € pro Tonne CO2-Äquivalent). Kohleausstieg in Baden-Württemberg bis spätestens 2030 Die Landesregierung muss, in Absprache mit EnBW, MVV, den betroffenen Städten bzw. Stadtwerken und ggf. weiteren relevanten Akteuren, vereinbaren, bis spätestens 2030 die Verfeuerung von Kohle in Kraftwerken und Heizkraftwerken zu beenden. Verpflichtende Wärme- und Kälteplanung für alle Kommunen In der KSG-Novelle ist vorgesehen, die verbindliche Wärme- und Kälteplanung für Stadtkreise und große kreisfreie Städte des Landes einzuführen. Diese Verpflichtung muss auf alle Kommunen ausgedehnt werden. In Zusammenarbeit mit den Kommunen muss bis Ende 2021 ein Konzept ausgearbeitet werden, wie die Ergebnisse der kommunalen Wärmeplanung umgesetzt werden und so eine klimaneutrale Wärmeversorgung der Kommunen verbindlich bis 2030 erreicht wird. In dem Konzept muss die Entwicklung gebäudeindividueller energetischer Sanierungsfahrpläne für alle Gebäude verankert werden. Der Sanierungsfahrplan muss eine Vor-Ort-Analyse des Gebäudes im Hinblick auf den baulichen Wärmeschutz und die Anlagentechnik für Heizung, Kühlung und Trinkwassererwärmung, sowie das Solar-Potential umfassen. Dachflächen konsequent für Solarenergie nutzen Alle Neubauten müssen Plusenergiehäuser werden. Hierfür muss die Nutzung von Photovoltaik (ggf. auch Solarthermie) auf Dächern verpflichtend sein. Auch die Integration in Gebäudefassaden ist einzuschließen. Darüber hinaus muss die Landesregierung einen Plan ausarbeiten und anschließend umsetzen, wie bis 2025 alle Dachflächen und andere geeignete Flächen zumindest mit sehr guter Eignung nach LUBW mit Solarenergie bestückt werden können. Auch die Dächer von größeren Bestandsgebäuden (Gewerbeparks, Industriedächer, Sporthallen u. ä.) müssen bei Eignung mit Solarmodulen bestückt werden. Landflächennutzung für Wind- und Solar-Anlagen erleichtern und Landesziele nach Potential verpflichtend auf Regionen verteilen Die Ausschlusskriterien für eine Flächennutzung durch Erneuerbare Energien (EE) müssen deutlich weniger restriktiv gestaltet werden. Die Genehmigungsverfahren für Windanlagen müssen transparenter, vereinheitlicht und gestrafft werden. Photovoltaik-Freiflächenanlagen (u.a. als Agro-Photovoltaik) müssen deutlich stärker unterstützt werden. Um dies zu gewährleisten, soll zum Bürokratieabbau z.B. eine landesweite Zentrale geschaffen werden, die den Windradausbau koordiniert und die Genehmigungsverfahren bearbeitet. Landesweite Ausbauziele von PV und Windrädern müssen anhand der Potentiale (nach LUBW) auf Regionen heruntergebrochen werden und ihnen verpflichtend zugewiesen werden. Nicht zweckgebundene Finanzzuweisungen an die Kommunen müssen an deren Erfolg bei der CO2-Reduktion gekoppelt werden. Klimaschutzpakt mit der Industrie Der Treibhausgasausstoß der landeseigenen Unternehmen und Einrichtungen muss bis 2025 um 75 % reduziert werden, bis 2030 müssen sie klimaneutral sein. Die erforderlichen Reduktionsmaßnahmen können in Kooperation mit Unternehmen umgesetzt werden. Darüber hinaus muss die Landesregierung einen Großteil der in BW ansässigen Unternehmen davon überzeugen, bis 2025 klimaneutral zu sein. Für die Durchführung dieser Maßnahmen kann das Land Anreize, wie Wettbewerbe, Steuervorteile oder Subventionen schaffen und umgekehrt Strafmaßnahmen beim Verfehlen der Ziele verhängen. ÖPV erheblich aus- und den städtischen Verkehr umbauen Ziel muss ein flächendeckender Ausbau von Fahrrad-, Bus- und Bahninfrastruktur im Land sein; dabei müssen sämtliche Maßnahmen auf den Deutschlandtakt abgestimmt werden. Konkret muss ab 2022 der Öffentliche Personenverkehr (ÖPV) für Endverbraucher stets daswirtschaftlichste Verkehrsmittel sein (z.B. über eine Nahverkehrsabgabe in Verbindung mit einerCity-Maut). Mittel für den Neubau von Landes- und Kreisstraßen müssen vollständig in den Ausbau des ÖPV, den Radwegeausbau und fußgängerfreundlichere Kommunen umgeleitet werden. Gleichzeitig müssen nachhaltige Verkehrsmittel gefördert werden und neue Mobilitätsangebote entstehen (Bsp. Kopenhagen). Zudem muss in den Städten der Individualverkehr mit PKW verringert werden. Die dadurch entstehenden Freiräume können dann wieder der Bevölkerung zu Gute kommen, z.B. in Form neuer Grünflächen. Treibhausgasreduktion und Steigerung der Artenvielfalt in der Landwirtschaft Eine Landwirtschaft, die Klima- und Artenschutz aktiv unterstützt, muss angemessen gefördert werden. Dazu ist eine Umschichtung der Fördermittel im Agrarbereich von flächenbezogenen Direktzahlungen hin zur Honorierung umweltschonender Landbewirtschaftung sowie Bürokratieabbau erforderlich. Es muss untersucht werden, inwieweit die Landwirtschaft möglichst rasch zu einer CO2-Senke werden kann und die entsprechenden Maßnahmen sofort ergriffen werden. Alle landeseigenen Landwirtschaftsflächen sind bis 2025 mit einer dauerhaften und artenreichen Randbepflanzung zu versehen; dabei sind Flächen größer 1,5 ha durch Hecken, Baumreihen oder andere Staudenbepflanzungen entsprechend zu unterteilen. Waldflächen müssen zu artenreichen Mischwäldern werden. Die Trockenlegung von Mooren muss beendet und geschädigte Moore renaturiert werden. Zusätzlicher Aufwand und Flächenverluste der Land- und Forstwirtschaft durch diese Maßnahmen sind vom Land aufzufangen. Zudem muss ein bewussterer Umgang mit Nahrungsmitteln geschaffen werden. Hier kann die Landesregierung mit der schrittweisen Einführung eines “Meat Days” (im Sinne eines “Sonntagsbratens”) pro Woche an landeseigenen Mensen (Schulen, Universitäten, Verwaltung etc.) bei der Reduktion von klimaschädlichen Lebensmitteln voraus gehen. Gemeinwohlorientierte Kreditvergabe Kredite, die das Land, landeseigene Betriebe oder Banken, an denen das Land Anteilseigner ist (z.B. LBBW), vergeben, müssen sich an Kriterien des Gemeinwohls orientieren und in Einklang mit der Einhaltung der 1,5 °C Grenze stehen. Bis Mitte 2020 müssen klare Ausschlusskriterien implementiert sein. Bestehende Investitionen in klima- und umweltschädliche Unternehmen (z.B. fossile Energien, Rüstung etc.) müssen bis spätestens 2022 komplett beendet werden. Kreislaufwirtschaft und zukunftsfähiges Bauen Alle Bauprojekte des Landes müssen ab sofort, wann immer möglich, aus regionalen, kreislauffähigen, schadstofffreien und klimapositiven Materialien zur späteren Wieder- und Weiterverwendung geplant und gebaut werden. Der Einsatz von Beton muss auf diejenigen Anwendungen reduziert werden, für die keine Alternativen zur Verfügung stehen, hierbei ist stets die klimafreundlichste Betonart zu verwenden. Gleiches gilt für den Einsatz von Aluminium. Abriss und Downcycling muss vermieden und der Einsatz an grauer Energie (einschl. Transportwege, Montage und Nutzung (Lebenszykluskosten)) minimiert werden. Zusätzlich müssen landeseigene Bauvorhaben ab sofort aktiv die Biodiversität schützen und fördern. Dies gilt insbesondere für die Dach-, Fassaden- und Freiraumgestaltung. Bis Ende 2020 sind rechtliche Maßnahmen umzusetzen, die diese Vorgaben auch auf alle privaten und privatwirtschaftlichen Bauvorhaben ausdehnen. Auch in allen anderen Sektoren müssen bei öffentlichen Ausschreibungen kreislauffähige Produkte bevorzugt werden. Darüber hinaus soll das Land ein Programm erarbeiten, das Unternehmen dazu bringt, Produkte reparierbar, kreislauffähig und langlebig zu gestalten. Schlusswort Baden-Württemberg hat die besten Voraussetzungen, die Chancen, die aus einer mutigen Klimapolitik erwachsen, in neue Geschäftsfelder, klimaverträgliches Wirtschaften, gesteigerte Lebensqualität und gesunde Umwelt umzusetzen. Hochqualifizierte Forschungseinrichtungen, eine große Anzahl innovativer, insbesondere mittelständischer Unternehmen, eine kreative und engagierte Bevölkerung und eine vergleichsweise solide und vorausschauende Politik bieten die besten Voraussetzungen für ein gutes Gelingen dieser zentralen Aufgabe. Damit ist Baden-Württemberg in der Lage, die enormen Herausforderungen erfolgreich zu meistern, die von uns allen, zur Eindämmung der Klimakrise, verlangt werden. Wir verlassen uns darauf, dass Sie sich ihrer Verantwortung bewusst sind, die überlebenswichtige 1,5 °C Grenze einzuhalten und daher unverzüglich mit der Umsetzung der notwendigen Maßnahmen beginnen. Wir sind es uns und den kommenden Generationen schuldig, dabei erfolgreich zu sein! Unterzeichnende Fridays for Future Ortsgruppen: AchernBiberachCalw Friedrichshafen Heidelberg Karlsruhe Leutkirch i. Allgäu Möckmühl RastattRottweil Sigmaringen Stuttgart Überlingen WangenBad Mergentheim Blaubeuren Filderstadt Friesenheim Heilbronn KonstanzLörrachNürtingen Ravensburg SchriesheimSingen Tauberbischofsheim UlmWeinheimBad Waldsee Bruchsal Freiburg Geislingen Herrenberg Lahr Ludwigsburg Öhringen Riedlingen Schwäbisch Hall Sinsheim Tübingen Vaihingen EnzReutlingenBaden-BadenBühlFreudenstadtGöppingenIsnyLaupheimMannheimPforzheimRottenburg a. Neckar Schwetzingen SpaichingenTuttlingen Villingen-SchwenningenRadolfzell Scientists for Future Stuttgart unterstützt voll und ganz den Inhalt und die Forderungen dieses Dokuments. Forderungen Baden-Württemberg als Download (PDF) 1.) 2016 gab es nach IPCC 2018 weltweit noch ca. 500 Mrd Tonnen CO2-Äquivalente um mit einer 67%-igen Wahrscheinlichkeit die 1,5 °C Grenze einzuhalten. Teilt man dieses Budget gleichmäßig auf die Bevölkerung auf, so ergibt sich das erwähnte Budget für Baden-Württemberg.2.) Der genaue Absenkpfad muss Teil einer Studie sein.3.) Dabei müssen die CO2-Zertifikate aus dem ETS Handel stillgelegt werden.4.) https://um.baden-wuerttemberg.de/de/energie/informieren-beraten-foerdern/sanierungsfahrplan-bw/wohngebaeude/"
