full_description = "DEGGENDORF Hey ihr Klimaschützer! Willkommen auf unserer Seite! Wir sind die Ortsgruppe Deggendorf, das liegt am Bayerischen Wald. Wir machen regelmäßig Aktionen, Demos, u.v.m. Hier findet ihr Infos zu uns und Updates zu den neuesten Aktionen! Klickt gerne weiter unten auf die Social Media-Icons, um unsere Seiten zu besuchen und unserer WhatsApp-Gruppe beizutreten! Bleibe immer auf dem Laufenden Termine 24.09. Globaler Streik Was? Die Bundestagswahl steht an und wir werden laut. Diese Wahl muss eine Klimawahl sein und wir machen sie dazu. Komm und geh mit uns auf die Straße!Wann? 24.09.2021 11:30 Uhr Wo? Demozug durch Deggendorf Forderungen an die Kommunalpolitik Fridays for Future Deggendorf möchte nicht nur aufrütteln, sondern konkrete Umwelt- und Klimaschutzmaßnahmen voranbringen. Zusammen mit anderen (Umwelt) – Organisationen (BN, LBV, Greenpeace, Amnesty International, Demokratie leben, Parentsforfuture) haben wir deshalb Forderungen an die Politik in Deggendorf Stadt und Landkreis erarbeitet. Forderungen-FFF-DeggendorfHerunterladen"
