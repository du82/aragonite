["https://fridaysforfuture.de/forderungen/thueringen"]
title = "Forderungen Thüringen | Fridays for Future"
description = "Die FridaysForFuture-Gruppen aus Thüringen haben anlässlich der Landtagswahl Forderungen aufgestellt. Die Klimakrise stellt für die Stabilität der Ökosysteme unseres Planeten und für Milliarden von Menschen weltweit eine existenzielle Bedrohung dar. Eine ungebremste Erderwärmung ist eine erhebliche Gefahr für Frieden und Wohlstand auf der ganzen Welt. Seit über 30 Jahren warnen tausende Wissenschaftler*innen immer eindringlicher vor"
full_description = "Forderungen Thüringen Die FridaysForFuture-Gruppen aus Thüringen haben anlässlich der Landtagswahl Forderungen aufgestellt. Die Klimakrise stellt für die Stabilität der Ökosysteme unseres Planeten und für Milliarden von Menschen weltweit eine existenzielle Bedrohung dar. Eine ungebremste Erderwärmung ist eine erhebliche Gefahr für Frieden und Wohlstand auf der ganzen Welt. Seit über 30 Jahren warnen tausende Wissenschaftler*innen immer eindringlicher vor den Folgen der Erderwärmung – in all den Jahren wurden allerdings keine ausreichenden Maßnahmen dagegen ergriffen. Infolge des vom Menschen verursachten Anstiegs des Treibhausgasgehalts in der Atmosphäre hat sich unser Planet bereits jetzt um etwa 1°C gegenüber dem vorindustriellen Zeitalter erhitzt, erste Folgen dieser Klimaveränderung machen sich bereits bemerkbar. Auf der Grundlage aktueller Forschungsergebnisse, wie den zuletzt veröffentlichten Sonderberichten des IPCC (Weltklimarats), erinnern zahlreiche Menschen, auch in Thüringen, umso dringender daran, dass sich Deutschland 2015 in Paris zur Begrenzung der Erderwärmung auf maximal 1,5°C verpflichtet hat. Jede Erhöhung der globalen Durchschnittstemperatur um den Bruchteil eines Grad Celsius wird potentiell katastrophale Folgen für das Leben auf der Erde mit sich bringen. Noch haben wir die Chance und damit die Verantwortung, eine Klimakatastrophe abzuwenden. Aus diesem Grund ist jeder Akteur, insbesondere auch das Bundesland Thüringen in der Pflicht, alle notwendigen Schritte zu unternehmen, um die Klimakrise zu begrenzen. Fridays for Future Thüringen fordert die neue Landesregierung auf, ihrer Verantwortung zur Einhaltung des Pariser Klimaabkommens und des 1,5°C-Ziels gerecht zu werden. Explizit fordern wir deshalb eine Revision des Thüringer Klimagesetzes, das in seiner jetzigen Form völlig unzureichend ist, um die Thüringer Treibhausgasemissionen im notwendigen Maße zu reduzieren. Wir fordern: Bis 2035 Klimaneutralität des Bundeslands Thüringen Sektorübergreifend 100% erneuerbare Energieversorg Sofort Massiver und stark beschleunigter Ausbau der Windkraft (auf mind. 2% der Landesfläche bis 2030) und der Photovoltaik in Thüringen Einsatz der Thüringer Landesregierung auf Bundesebene für eine CO2 Steuer, die schnell auf 180 € pro Tonne CO2 steigt Ende aller fossilen Subventionen des Landes, u.a. für den Flughafen Erfurt-Weimar Verpflichtung der Landwirtschaft zur ausreichenden Emissionsreduktion im Rahmen des Thüringer Klimagesetzes Unabhängige und wissenschaftliche Überprüfung aller Gesetze und Entscheidungen der Landesregierung und Landesverwaltung hinsichtlich ihrer Klimaverträglichkeit, einschließlich öffentlicher Kommunikation der Ergebnisse Die sozial gerechte Ausgestaltung unserer Forderungen muss bei deren Verwirklichung oberste Priorität haben. Keinesfalls dürfen Maßnahmen einseitig zu Lasten von Menschen mit geringem Einkommen gehen. Diesbezüglich muss die Landesregierung entsprechende Konzepte vorlegen. Nachdem die Thüringer Treibhausgasemissionen nach der Wende – und dem damit verbundenen Abzug der Industrie aus der Region – deutlich zurückgegangen sind, sinken die Emissionen seit mehr als zehn Jahren nicht signifikant ab. Bis heute hat keine Thüringer Landesregierung die notwendige Gestaltungskraft an den Tag gelegt, um ein schlüssiges Gesamtkonzept zur vollständigen Treibhausgasneutralität des Bundeslandes vorzulegen. Zwar hat der Freistaat im vergangenen Jahr ein Klimagesetz verabschiedet, das zur Senkung der Treibhausgasemissionen Thüringens führen soll. Dieses Gesetz spiegelt allerdings nicht ansatzweise die Transformation wider, die in allen Bereichen der Gesellschaft und Wirtschaft angesichts der Bedrohung durch die Klimakrise zwingend erforderlich ist. So sind die im Gesetz formulierten Klimaschutzziele kaum ambitioniert – bis 2050 sollen die Emissionen lediglich um 80-95% im Vergleich zum Jahr 1990 sinken. Das ist für die tatsächliche Einhaltung des 1,5°C-Ziels viel zu spät. Der Ausbau der erneuerbaren Energien wird nicht ambitioniert genug vorangetrieben, nur 1% der Landesfläche soll für die Nutzung der dringend benötigten Windenergie bereitgestellt werden und der tatsächliche Ausbau ist in den letzten Jahren zum Erliegen gekommen. Der zweitgrößte Emittent an Treibhausgasemissionen in Thüringen, die Land- und Forstwirtschaft, wird mit keinem Wort im Gesetz erwähnt. Letztendlich fehlt es dem Thüringer Klimagesetz insbesondere an einer Möglichkeit zur Sanktionierung, wenn Zielvorgaben nicht eingehalten werden. Tausende Menschen verschiedener Generationen, die freitags im Rahmen von Fridays for Future in Thüringen auf die Straße gehen, setzen sich dafür ein, dass in der Klimapolitik endlich auf den wissenschaftlichen Konsens reagiert wird; dass das größte existentielle Problem, dem die Menschheit jemals bevorstand, endlich als solches behandelt wird. Es liegt nun in der Verantwortung der politischen Entscheidungsträger*innen in Zusammenarbeit mit Expert*innen aus der Wissenschaft dafür zu sorgen, dass ein umfassendes Maßnahmenpaket auf den Weg gebracht wird, das auf den wissenschaftlichen Erkenntnissen zur durch den Menschen verursachten Klimakrise beruht und das Gesellschaft, Wirtschaft und Politik zu umfangreichen Veränderungen anregt. Zu dieser Verantwortung gehört es auch, transparent vorzugehen, die Bürger*innen Thüringens faktenbasiert über die Notwendigkeit von Klimaschutzmaßnahmen aufzuklären und die positiven Möglichkeiten, die durch Klimaschutz entstehen, öffentlich zu kommunizieren. Es darf nicht die alleinige Aufgabe der Jugend sein, Verantwortung für die Priorisierung des Klimaschutzes zu übernehmen. Da die Politik diese jedoch gerade kaum wahrnimmt, sehen wir uns gezwungen, weiter zu streiken, bis gehandelt wird! Lade Dir die Forderungen hier herunter!"
