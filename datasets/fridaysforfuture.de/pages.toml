full_description = "Kempten Hallo! Wir sind die Fridaysforfuture Ortsgruppe Kempten. Hier findest du alle Infos rund um unsere Aktionen und was wir sonst noch so treiben <3 Unten findest du unsere ganzen anderen Kanäle mit noch mehr Infos! Falls du mit uns direkt in Kontakt treten willst, dann schreib uns doch eine Mail (kempten@fridaysforfuture.de) oder auf Instagram. Ein alt bewehrter klassischer Anruf unter 0171 7594404 ist auch möglich. 🙂 Wir freuen uns schon, dich bei unseren nächsten Aktionen zu sehen. Folg uns gerne auf unseren anderen Kanälen! Du willst mitmachen? Schreib uns gerne 🙂 Unsere Aktionen Nächste DEMO! Wann? 14.02.2025 14:00 Uhr Wo? Hildegardplatz Was? Die nächste klassische FFF Demo in Kempten! Andere Events Karls Tagebuch aus der JVA Kempten Blogg/ Tagebuch von Karl findet ihr hier: Webseite Letzte Generation Informationen und Vorträge findet ihr hier: Webseite Zukunftsbündnis Allgäu Wir sind Bündnispartner beim Zukunftsbündnis Allgäu! Webseite Seebrücke Kempten Wir sind Bündnispartner bei der Seebrücke in Kempten! Webseite Klimaplan 2035 Kempten? Hast du das schonmal gehört? Kempten hat in Sachen Klimaschutz tatsächlich einen guten Plan! Ob sie sich daran halten, ist dann die Frage (Spoiler nein). Lies dir den einfach mal durch. So in der Art könnte es mit richtiger Politik laufen. Link Klimaplan Bündnis Kempten muss handeln Das ist ein Aktionsbündnis, bei dem Privatpersonen und Firmen, Organisationen Partner werden können. Man kann auf der Website sich als unterstützer eintragen und somit die Forderungen unterstützen. Probiert’s doch mal aus! Website Kempten muss Handeln Faktenblätter Nicht ganz sicher, warum du auf die Stratrße gehen solltest? Auf der Seite von der EZA! findest du Info und Fakaktenblätter. Link zu den Faktenblättern"
