description = "Hey, wir sind FFF Aachen! Mach mit bei FFF! Die nächsten Termine! Spenden an FFF-Aachen Wir sind ein Zusammenschluss von Jugendlichen, die glauben, dass eine gerechte Welt für alle möglich ist. Als Teil der weltweiten Fridays for Future Bewegung sind wir seit über 4 Jahren in Aachen aktiv. 2019 standen wir nach dem Motto „Freitag"
full_description = "Aachen Hey, wir sind FFF Aachen! Mach mit bei FFF! Die nächsten Termine! Spenden an FFF-Aachen Wir sind ein Zusammenschluss von Jugendlichen, die glauben, dass eine gerechte Welt für alle möglich ist. Als Teil der weltweiten Fridays for Future Bewegung sind wir seit über 4 Jahren in Aachen aktiv.2019 standen wir nach dem Motto „Freitag ist Streiktag!“ quasi jeden Freitag auf der Straße, statt in die Schulen und Unis oder zur Arbeit etc. zu gehen. Zusammen mit bis zu 40.000 Menschen – beim großen #ac2106 Zentralstreik – haben wir gestreikt, um zu demonstrieren und auch andere Aktionen im Rahmen des zivilen Ungehorsams durchzuführen.Mittlerweile konzentrieren wir uns für Klimastreiks auf globale Streiktage und andere Großstreiks und arbeiten dazwischen an verschiedenen Projekten und beteiligen uns an anderen Aktionen.Im Dezember 2022 haben aktive von FFF zusammen mit anderen Studierenden als „EndFossil: Occupy RWTH!“ ein Gebäude der RWTH-Aachen eine Woche lang besetzt und so den Startschuss für Klimastreiken auf einem neuen Level gegeben!Anstatt wie 2019 an die Politik zu appellieren, wollen wir mittlerweile an die gesamte Gesellschaft appellieren, sich uns anzuschließen. Wir sind der Überzeugung, dass wir nur so eine gerechte Welt erkämpfen können.Deswegen setzen wir als Jugendbewegung da an, wo wir für ein System ausgebildet werden, was keine Zukunft hat: Die Schulen und Universitäten. Wir besetzen unter dem Motto „EndFossil: Occupy!“ unsere Bildungseinrichtungen und lernen, wie wir uns gemeinsam organisieren können.Als Gruppe haben wir den Anspruch, für eine gerechte Welt für alle zu Kämpfen. Um dem Gerecht zu werden sind nicht nur Aktionen nach außen sondern auch Interne Bildungs- und Awarenessarbeit ein Teil unserer Gruppe. MACH MIT BEI UNS – WERDE AKTIV! In einer Zeit der Krisen wir uns massenhaft zusammenschließen um für eine gerechte Welt zu kämpfen. In der großen FFF-AC Orga:Als FFF Orga treffen wir uns deswegen regelmäßig: Wir planen unsere nächsten Aktionen und tauschen uns aus. Du willst auch in die Orga? Dann komm doch einfach mal zu einem Plenum von uns! Schreib uns dafür einfach auf Social Media, die Links findest du unten. In deiner Schule/UniVernetze dich mit anderen Schüler*innen und mache Aktionen an deiner Schule. Das kann alles von Plakate-aufhängen bis Aulabesetzung sein. Kontaktiert uns am besten und wir helfen euch weiter bei der Orga und beantworten gerne Fragen. Die nächsten Termine: Klimastreik zur Bundestagswahl Wann? 14.02.; 14 Uhr Wo? Markt Weitere Termine Jeden Donnerstag 18 UhrFFF Plenum. Schreib uns, wenn du Jugendlich bist und dabei sein möchtest!Jeden letzten Freitag im MonatCritical Mass um 18 Uhr am Elisenbrunnen. InfosFrühjahr 2025#WirFahrenZusammen: Gemeinsam mit ver.di für besseren ÖPNV!Ihr habt Termine die hier fehlen? Schreibt uns! Noch mehr Termine! Beim Bewegungsmelder Aachen findet ihr weitere Termine die in Aachen und Umgebung anstehen. Zum Bewegungsmelder SPENDEN Für Technik, Plakate, Bühne und viele weitere Sachen fallen hohe Kosten an. Wir sind als politisch unabhängige Jugendbewegung daher auf Spenden angewiesen. Mit den eingenommenen Spendengelden finanzieren wir unsere Demo und Aktionskosten und internationale Klimagerechtigkeitsarbeit. Wir sind für jeden Betrag dankbar! 💚✊ Jetzt Spenden Hier gibt es mehr von uns:"
year_published = 2021
year_updated = 2022
