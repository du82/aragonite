title = "Fridays for Future - Lübeck | Fridays for Future"
description = "Wer wir sind Seit Januar 2019 streiken wir in Lübeck für Klimagerechtigkeit. Am 20. September des Jahres waren 6000 Menschen auf der Straße und auch 2021 haben wir direkt vor der Bundestagswahl gemeinsam mit 4000 Menschen gezeigt, dass wir jetzt sofort handeln müssen! Es passiert viel zu wenig in der Politik, deshalb machen wir weiter"
full_description = "Fridays for Future Lübeck Wer wir sind Seit Januar 2019 streiken wir in Lübeck für Klimagerechtigkeit. Am 20. September des Jahres waren 6000 Menschen auf der Straße und auch 2021 haben wir direkt vor der Bundestagswahl gemeinsam mit 4000 Menschen gezeigt, dass wir jetzt sofort handeln müssen! Es passiert viel zu wenig in der Politik, deshalb machen wir weiter Druck – solidarisch mit der ganzen Klimagerechtigkeitsbewegung in Lübeck. Wenn ihr Fragen habt, kontaktiert uns gerne unter luebeck@fridaysforfuture.de. Termine 25. Mai bis 10. Juni – Klimacamp Lübeck Wann? 25.05. bis 10.06. Wo? Markt Was? 📷 💥🎉 Lübecker Klimacamp 🎉💥 Mitten auf dem Lübecker Markt vorm Rathaus schlagen wir unsere Zelte auf und werden über zwei Wochen für ernst gemeinten Klimaschutz und Gerechtigkeit in Lübeck, Europa und auf der ganzen Welt protestieren! – Und das Tag und Nacht! ✊🔥⛺ Mit viel Programm rund um Klimagerechtigkeit und dem gemeinsamen Kampf für ein gutes Leben für alle wollen wir einen Ort schaffen um gemeinsam in den Austausch zu kommen, uns zu bilden und zu vernetzen. Im Vordergrund steht dabei die Europawahl im Juni – denn die politischen Entscheidungen im gar nicht so fernen Brüssel haben mehr mit uns zu tun als wir uns vielleicht manchmal bewusst sind – und es braucht den Druck von uns allen, damit sich was verändert. Klimagerechtigkeit müssen wir uns gemeinsam erkämpfen und Klimaschutz kann nur funktionieren, wenn alle am gleichen Strang ziehen. ✊Also kommt vorbei! 👉Alle Infos findet ihr in unserem immer aktuellen Linktree. Und hier geht es direkt zu unserem Programm. Wir freuen uns auf euch! 🔥💚 31. Mai 16 Uhr – Gegen Rechts – Für das Klima Wann? 31.05. 16 Uhr Wo? Markt Lübeck Was? Neun Tage vor der Europawahl geht es gemeinsam in einem Bündnis aus Gerechtigkeitsorganisationen auf die Straße. Wir sind laut gegen Rechts und für mehr Klimagerechtigkeit. Hier geht es zur Pressekonferenz zum Europaweiten Aktionstag. Und hier könnt ihr gratis Mobimaterial direkt nach Hause bestellen. Impressionen Über uns Hier findet ihr unseren Gruppenkonsens und Stellungnahmen zur Kommunalpolitik sowie weitere interessante Dokumente. Forderungen zur Kommunalwahl Lübeck 2023 Bis spätestens 2035 muss Lübeck klimaneutral sein und darf dabei maximal noch 8,05 Mt CO2 ab 2022 ausstoßen, um einen gerechten Beitrag zur Einhaltung der 1,5-Grad-Grenze zu leisten. Hier findet ihr unsere gesamten Forderungen zur Kommunalwahl Lübeck. Lübeck Klimagerecht Straßenbahn Hier gibt es interessante Einblicke in das System Straßenbahn. Von der allgemeinen Definition über die Geschichte hin zu tollen Beispielen in Frankreich und was in Lübeck vielleicht möglich ist. Ein Online-Vortrag von Herrn Prof. Monheim sowie Foliensätze von Frau Dr. Jakob von NAH.SH zum aktuellen Stand der Planungen in Kiel und Herrn Stödter, dem Verkehrswendebeauftragten der Hansestadt Lübeck. Außerdem eine Stellungnahme von uns zur Straßenbahn in Lübeck. Infos zur Straßenbahn Lokalpolitische Stellungnahmen Die Verwaltung hat auf Beschluss der Bürgerschaft ein kurzfristiges Maßnahmenpaket für den Klimaschutz in Lübeck erstellt. In unserem Kritikpapier nehmen wir Stellung zu diesen 49 Maßnahmen und ergänzen diese mit weiteren Handlungsvorschlägen. Das komplette Dokument, welches in Zusammenarbeit mit Greenpeace Lübeck entstanden ist, findet ihr hier. Lokalpolitische Stellungnahmen Gruppenkonsens In unserem Gruppenkonsens beschreiben wir, was grundlegende Haltungen unserer Lübecker Ortsgruppe sind. Gruppenkonsens Lokale Forderungen In unseren lokalen Forderungen haben wir formuliert, was in Lübeck konkret geändert werden muss. Dieses Dokument ist in den Anfängen der Bewegung entstanden – also in der ersten Jahreshälfte von 2019. Unsere Forderungen Finanzielle Unterstützung Demonstrationen und andere Aktionen zu organisieren kostet meistens Geld, daher freuen wir uns immer über finanzielle Unterstützung!Kontoinhaber: Linus SchwetjeIBAN: DE22430609673116055000GLS Bank Bleibe immer auf dem Laufenden!"
