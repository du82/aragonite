["https://fridaysforfuture.de/forderungen/allgemein"]
title = "Unsere Forderungen an die Politik | Fridays for Future"
description = "Mit zahlreichen Wissenschaftler*innen haben wir Forderungen an die Politik ausgearbeitet. Die Umsetzung ist notwendig, um das 1,5 Grad Ziel einzuhalten!"
full_description = "UNSERE FORDERUNGEN AN DIE POLITIK Nach Monaten intensiver Zusammenarbeit mit zahlreichen Wissenschaftler*innen, haben wir im April 2019 unsere konkreten Forderungen an die Politik vorgestellt. Diesen Folge zu leisten ist notwendig um die Ziele des Pariser Klimaabkommens einzuhalten und die globale Erwärmung auf unter 1,5° Celsius zu begrenzen. Ergänzend dazu haben wir im Jahr 2020 beim Wuppertal Institut für Klima, Umwelt und Energie eine Machbarkeitsstudie in Auftrag gegeben. Das Ergebnis: Die Forderungen sind technisch umsetzbar! Mehr zur Machbarkeitsstudie Glossar FAQ Pressekonferenz als PDF „Wir sind nicht nur verantwortlich für das, was wir tun, sondern auch für das, was wir nicht tun.“ Molière Die Klimakrise stellt für die Stabilität der Ökosysteme unseres Planeten und für Millionen von Menschen eine existenzielle Bedrohung dar. Eine ungebremste Erderwärmung ist eine enorme Gefahr für Frieden und Wohlstand weltweit. Seit Beginn der Industrialisierung hat sich die Erde laut IPCC bereits um circa ein Grad Celsius erwärmt. Es bleibt daher wenig Zeit, den Klimawandel aufzuhalten und so zu verhindern, dass die Kipppunkte im Klimasystem überschritten werden. Tun wir das nicht, werden die verursachten Schäden weit höhere Kosten mit sich bringen als alle Investitionen in konkrete Maßnahmen zur Vermeidung der Klimakatastrophe. Einhaltung der Ziele des Pariser Abkommens und des 1,5°C-Ziels Fridays for Future fordert die Einhaltung der Ziele des Pariser Abkommens und des 1,5°C-Ziels. Explizit fordern wir für Deutschland: Nettonull 2035 erreichen Kohleausstieg bis 2030 100% erneuerbare Energieversorgung bis 2035 Entscheidend für die Einhaltung des 1,5°C-Ziels ist, die Treibhausgasemissionen so schnell wie möglich stark zu reduzieren. Deshalb fordern wir ab sofort: Das Ende der Subventionen für fossile Energieträger 1/4 der Kohlekraft abschalten Eine CO2-Steuer auf alle Treibhausgasemissionen. Der Preis für den Ausstoß von Treibhausgasen muss schnell so hoch werden wie die Kosten, die dadurch uns und zukünftigen Generationen entstehen. Laut UBA sind das 180€ pro Tonne CO2 Von April 2019 bis jetzt hat die Politik es geschafft, unsere Forderungen konsequent zu ignorieren und mit ihrem Klimapäckchen gezeigt, wie wenig sie von einer lebenswerten Zukunft halten. Wir haben die Umsetzung von drei unserer Forderungen bis spätestens Ende 2019 gefordert und das nicht, weil uns die Zahl so gut gefällt – das ist das Mindeste, was wir brauchen, damit Deutschlands Klimapolitik einen gerechten Weg zum 1,5 Grad Ziel einschlägt. Wir bedanken uns bei allen Menschen, die auf Kommunal-, Landes- und Bundesebene für diese Forderungen einstehen und trotzdem nur scheinbare Wertschätzung und feige Ausreden erhalten. Wir sind auf dem besten Wege, das 1,5 Grad Ziel krachend zu verfehlen und wir haben keine Zeit, wieder bis zum Jahresende zu hoffen, um dann mit einer Anmaßung von Klimapaket gezeigt zu bekommen, wie wenig Wert dieser Planet für die Politik scheinbar hat. Daher ändern wir unsere drei Forderungen von Ende 2019 auf SOFORT. Das Klima verhandelt nicht und jede Ausrede, diese Forderungen nicht erfüllen zu müssen, ist nichtig. Wir werden im Frühjahr ausführlicher Stellung nehmen, bei Fragen freuen wir uns über eine Mail an ag.Grundsatz@fridaysforfuture.de. Erläuterung Das Pariser Abkommen ist die verbindliche Grundlage für effektive Klimaschutzmaßnahmen, die auf internationaler Zusammenarbeit basiert. Der aktuelle klimapolitische Kurs in Deutschland ist mit diesem Abkommen unvereinbar und muss durch ein auf dem 1,5 °C-Ziel beruhendes Klimaschutzgesetz sowie eine zukunftsorientierte und nachhaltige Zusammenarbeit auf europäischer und globaler Ebene ersetzt werden. In dieser Politik muss sich der Gedanke der Klimagerechtigkeit widerspiegeln. Entscheidungen, die zu Lasten ärmerer Regionen und künftiger Generationen getroffen werden, sind inakzeptabel. Fridays for Future Deutschland fordert die Regierungen auf Kommunal- Landes- und Bundesebene auf, die Klimakrise als solche zu benennen und sofortige Handlungsinitiative auf allen Ebenen zu ergreifen. Noch haben wir die Chance und damit die Verantwortung, eine Klimakatastrophe abzuwenden. Für den notwendigen Wandel müssen sektorübergreifend grundlegende Veränderungen stattfinden. Vor allem in den Sektoren Energieerzeugung, Wohnen und Bauen, Industrie, Transport und Verkehr sowie Landwirtschaft sind enorme Anstrengungen nötig. Das wirtschaftliche Handeln darf nicht weiterhin planetare Grenzen überschreiten. Die Verwirklichung dieser Forderungen muss sozial verträglich gestaltet werden und darf keinesfalls einseitig zu Lasten von Menschen mit geringem Einkommen gehen. Diesbezüglich müssen die Regierungen entsprechende Konzepte vorlegen. Der Staat muss seiner Verantwortung gegen über der Umwelt und nachfolgenden Generationen im Sinne von Artikel 20a des Grundgesetzes und der Allgemeinen Erklärung der Menschenrechte gerecht werden. Uns ist bewusst, dass diese Forderungen ambitioniert sind, doch wenn wir jetzt nicht entschlossen handeln, werden wir das 1,5°C-Ziel verfehlen. Die dadurch entstehenden Schäden werden nicht reparabel sein. Um eine Wende zu erreichen, die von der Gesellschaft mitgetragen werden kann, fordern wir absolute Transparenz und faktenbasierte Aufklärung für alle Bürger*innen. Alle getroffenen Maßnahmen müssen unabhängigen wissenschaftlichen Kontrollen unterliegen, die ihre Wirksamkeit beurteilen. Vorallem junge Menschen müssen wegen ihrer besonderen Betroffenheit stärker in den demokratischen Prozess einbezogen werden. Es darf nicht die alleinige Aufgabe der Jugend sein, Verantwortung für die Priorisierung des Klimaschutzes zu übernehmen. Da die Politik diese kaum wahrnimmt, sehen wir uns gezwungen, weiter zu streiken, bis gehandelt wird! Wir als Fridays for Future Deutschland sind eine überparteiliche Bewegung gleichgesinnter Klimaaktivist*innen und solidarisieren uns mit allen, die sich friedlich für unsere Forderungen einsetzen. Glossar FAQ Pressekonferenz als PDF"
year_published = 2025
