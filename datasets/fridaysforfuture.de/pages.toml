["https://fridaysforfuture.de/kein-ende-in-sicht-cop-daily-tag-11"]
title = "Kein Ende in Sicht | COP Daily Tag 11 | Fridays for Future"
description = "Jetzt ist offiziell, was sich die letzten 10 Tage bereits angebahnt hat. Die Verhandlungen haben bis jetzt keine nennbaren Ergebnisse hervorgebracht. Zu unkonkret sind bislang die Zusicherungen der Verhandlungsstaaten. Ein Tag vor offiziellem Ende der Verhandlungen ist das ein katastrophales Zeichen! Entwurf zu Abschlusserklärung enttäuscht Jetzt ist das offiziell, was die letzten 10 Tage bereits"
full_description = "Kein Ende in Sicht | COP Daily Tag 11 21. November 202421. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged Jetzt ist offiziell, was sich die letzten 10 Tage bereits angebahnt hat. Die Verhandlungen haben bis jetzt keine nennbaren Ergebnisse hervorgebracht. Zu unkonkret sind bislang die Zusicherungen der Verhandlungsstaaten. Ein Tag vor offiziellem Ende der Verhandlungen ist das ein katastrophales Zeichen! Entwurf zu Abschlusserklärung enttäuscht Jetzt ist das offiziell, was die letzten 10 Tage bereits absehbar war. Der Entwurf zum Abschlussbericht ist eine volle Katastrophe. Im 10-seitigen Bericht, den der COP Präsident heute vorstellte, findet sich wenig, was zuversichtlich stimmt. Nachdem Tag und Nacht über ein neues Klimafinanzierungsziel verhandelt wurde, hat es nicht einmal eine konkrete Summe in das Abschlusspapier geschafft. Genannt wird nur ein nicht näher bezifferter Betrag in Billionenhöhe. Als Alternativvorschlag zu diesem unkonkreten Beitrag schlägt der Entwurf eine Verlängerung des bestehenden Betrags von 100 Milliarden pro Jahr vor. Das wäre eine echte Katastrophe, den wir brauchen mindestens das 13-fache um Klimaschutz und Anpassung global möglich zu machen. Außerdem nirgends zu finden in dem Entwurf zur Abschlusserklärung: Ein konkretes Bekenntnis zum Ausstieg aus den Fossilen, auf den 10 Seiten wird „fossil fuel phase out“ kein einziges Mal erwähnt und das bei der COP28 beschlossene Ziel der Verdopplung der Energieeffizienz bis 2030. Das wäre ein echter Rückschritt im Vergleich zu den Ergebnissen der letzten COP. Doch zumindest einen kleinen Lichtblick gibt es: während die Industriestaaten weiterhin „die führende Rolle“ bei der Klimafinanzierung übernehmen sollen, werden auch die „wirtschaftlich fähigen“ Schwellenländern (gemeint sind hier Staaten wie China und Saudi-Arabien) dazu aufgerufen, einen Beitrag zur Zahlung zu leisten. Die Industriestaaten sollen zwar weiterhin „die führende Rolle“ einnehmen, aber es gelte das Verursacherprinzip – wer viel CO₂ emittiert, muss auch zahlen. Das geht zumindest in die richtige Richtung. Doch in Summe sind ausnahmslos alle Länder unzufrieden mit dem Entwurf. Die Lateinamerikanische und Karibische Allianz fordert, dass der fossile Ausstieg unabhängig von historischen Verantwortungen überall vorangetrieben müsse. Außerdem brauche es jetzt konkrete Zahlen, damit die Verhandlungen vorangehen. Australien fordert, dass die neuen Klimaziele für alle Länder gelten müssen, während Pakistan betont, dass vor allem entwickelte Länder, wie auch China, in der Verantwortung stehen. China wiederum weigert sich seinen Status als „Entwicklungsland“ abzulegen, da es so auch einen Beitrag zur Klimafinanzierung leisten müsse. Japan ist der Meinung, dass das neue Finanzierungsziel nicht allen mit Haushaltsgeldern finanziert werden könne. Und zwischen all diese Meinung geht das Entsetzen der von der Klimakrise am meisten betroffenen Länder fast unter. So nennt der Vertreter Panamas Juan-Carlos Monterrey-Gomez die fehlenden Ambitionen der Industrieländer „verachtenswert“ und böse“ und die Alianz kleiner Inselstaaten (AOSIS) mahnt die Vereinten Nationen, dass viel auf dem Spiel stehe. Auch die deutsche Delegation kritisiert, dass der Entwurf für die Abschlusstexte noch lange nicht dort sei, wo wir ihn für ein gutes Ergebnis bräuchten. Annalena Baerbock machte in ihrer heutigen Rede vor allem die COP Präsidentschaft für die mangelhaften Ergebnisse verantwortlich. „Es gibt hier eine Verantwortung einer Präsidentschaft“, so die Außenministerin. Es ist wahr – die Rolle des COP Präsidenten füllt der aserbaidschanische Regierungschef Ilham Alijew höchstens maximal dürftig besetzt. Gas und Öl als „Geschenk Gottes“, das diplomatische Sticheln gegen andere Nationen, die schlechte Verhandlungsführung und jetzt der niederschmetternde Entwurf der COP Abschlusserklärung. Es scheint fast so, als wäre Alijew nicht an einem erfolgreichen Abschluss der COP orientiert. Und ja, es ist nur bedingt verwunderlich, dass sich ein autoritären Ölstaat nicht besonders ehrgeizig in Sachen Klimaschutz zeigt. Auf der anderen Seite, die von den Vereinigten Arabischen Emiraten geführte COP28 im letztes Jahr auch einige wegweisende Ergebnisse hervorgebracht. Die Verhandlungen sind schwer und werden auch nicht durch die Zurückhaltung Chinas einfacher. Zur Wahrheit gehört aber auch, dass die EU auch eine Schuld an den fehlenden Inhalten der Abschlusserklärung schuld ist. Bis jetzt hat die EU offiziell keine konkreten Summen genannt, die sie zur Klimafinanzierung beitragen möchte. (Die diskutierten Summen, von denen Politico gestern berichtete, wurden von offizieller Seite nicht bestätigt.) Dahinter steckt natürlich Verhandlungstaktik. Die EU möchte sich nicht zu konkreten Zahlen äußern, solange die Geberbasis nicht erweitert wird – solange also China und Saudi-Arabien nicht auch versprechen, in den Topf einzuzahlen. Doch das ist die Taktik seit Beginn der COP und man muss sagen, bis jetzt hat sie nicht funktioniert. Einen Tag vor dem offiziellen Ende der COP wäre es jetzt Zeit konkret zu werden und eine Führungsrolle am internationalen Verhandlungstisch der Klimadiplomatie zu übernehmen. Die EU muss endlich ihr Portmonee herausholen und konkrete Summen auf den Tisch legen, anstatt die Verhandlungen weiter hinauszuzögern. Dass die Klimakonferenz nicht (wie geplant) am Freitag enden wird, gilt inzwischen als entschlossen, war aber bereits vorhersehbar. Aufgrund des geringen Commitments des Gastgebers zu effektiven Verhandlungsgesprächen der COP wird inzwischen nicht ausgeschlossen, dass die Gespräche scheitern könnten. Das wäre ein Skandal! Ansprache von baerbock Nachdem die Außenministerin alle Termine für gestern krankheitsbedingt absagt, spricht Annalena Baerbock heute erstmals auf der COP. In ihrer Rede zieht vor allem die COP Präsidentschaft in die Verantwortung für die schleppenden Verhandlungen. Außerdem mahnt sie davor, bereits erreichte Ziele aufzugeben. „Wir haben letztes Jahr etwas geschafft, was zuvor nicht vorstellbar war. Wir werden nicht zurückfallen“. – Annalena Baerbock Die Außenministerin erklärte zudem, dass sie nun aktiv die Verhandlungen vorantreiben und auf Länder wie China explizit zugehen wollen. Erstmals äußerte sich heute mit Baerbock auch eine prominente deutsche Politikerin zu der Menschenrechtslage in Aserbaidschan. Auf ihrer heutigen Pressekonferenz bezeichnete sie die Inhaftierung von ca. 300 politischen Gefangenen, darunter auch oppositionellen und (Klima-)Aktivist*inne als ‚‚besorgniserregend“. Absolut inakzeptabel sei auch das Einreiseverbot für 76 Abgeordnete aus dem Europarat, darunter auch deutsche Bundestagsabgeordnete. Auf die Frage, wie sie beurteile, dass auch Deutschland schon Aktivist*innen und 8 Oppositionelle nach Aserbaidschan abgeschoben hat, gab die Außenministerin keine Antwort. Fossil Free North Sea! Der Hauptfokus der COP liegt natürlich auf den Verhandlungen, die allem Anschein nach wieder länger dauern werden. Aber sie sind nicht alles, was in Baku passiert! Heute etwa haben junge Klimaaktivist*innen aus Dänemark, Norwegen, Großbritannien und Deutschland verkündet, die „Fossil Free North Sea Alliance“ zu gründen. Der Zusammenschluss verschiedener Organisationen und Bewegungen, unter anderem auch uns, Fridays for Future Deutschland, fordert das sofortige Ende aller fossilen Energie-Projekte in der Nordsee. Außerdem muss es einen Plan für eine sozial gerechte Energiewende in den Staaten geben, die aktuell fossile Energie-Projekte in der Nordsee betreiben. Gelauncht wurde die Alliance mit einer Aktion auf der COP, die sich an alle Staaten richtete, die an der Nordsee liegen. Sie feiern sich nämlich in den Verhandlungsräumen als „Klima-Champions“, während sie direkt vor ihren Küsten fossile Energien zementieren möchten. Matilde Angelveit von Norwegian Church Aid erklärt in der gemeinsamen Pressemitteilung des Bündnisses: „Die fortgesetzte Exploration und Ausweitung der Förderung fossiler Brennstoffe in der Nordsee verspottet die Grundsätze der Klimagerechtigkeit, auf denen das Pariser Abkommen aufbaut. Ölreiche Länder wie Norwegen müssen die Führung bei der Abkehr von fossilen Brennstoffen übernehmen, wie es die Staats- und Regierungschefs auf dem letzten Klimagipfel COP28 vereinbart haben.“ Während aus wissenschaftlicher Sicht klar ist, dass es kein einziges neues fossiles Projekt mehr geben darf, sind immer noch vor allem Gasprojekte in der Pipeline. Es geht konkret um Projekte wie die geplanten Gasbohrungen vor Borkum und die Erweiterung des Rosebank-Gasfeldes. Alleine letzteres würde mehr CO₂-Emissionen verursachen, als die 28 weltweit einkommensschwächsten Länder in einem Jahr gemeinsam. Wir freuen uns riesig, ab jetzt gemeinsam gegen fossile Energien in der Nordsee vorgehen zu können! Pressemitteilung zur Fossil Free North Sea Youth Alliance: https://fridaysforfuture.de/press-release-fossil-free-north-sea-youth-alliance-launched-at-cop29-stop-the-fossil-fuel-expansion/ Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
