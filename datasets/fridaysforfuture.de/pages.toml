["https://fridaysforfuture.de/ortsgruppen/offenburg"]
title = "Fridays for future Offenburg | Fridays for Future"
description = "Wir sind Fridays for Future Offenburg und seit Januar 2019 Teil der FFF-Bewegung. Wir streiken regelmäßig für mehr Klimaschutz und organisieren verschiedene andere Aktionen zum Thema Klimakrise drehen - von Diskussionsrunden bis Müllsammeln. Wir sprechen immer wieder mit verschiedenen Vertreter:innen aus Politik und Zivilgesellschaft, um unsere Forderungen einzubringen. Außerdem arbeiten wir aktiv an Projekten zur"
full_description = "Fridays for future Offenburg Willkommen im Bearbeitungsmodus der Website von FFF Offenburg! 🙂 Hier kannst du die Internetseite bearbeiten. Sobald du rechts oben auf „Aktualisieren“ klickst und die normale Seite neu lädst, siehst du dort deine Änderungen. Wenn du dir nicht sicher bist, ob etwas gut aussieht, kannst du auch erst auf „Vorschau“ gehen und dir so die Änderung angucken, bevor du sie final hochlädst. Prinzipiell würde ich dir empfehlen, deine Änderungen alle paar Minuten zu speichern, weil der Bearbeitungsmodus manchmal dazu neigt, plötzlich zusammenzubrechen und die Seite dann auf die letzte gespeicherte Version zurückgesetzt wird – und es ist sehr frustrierend, wenn man eine halbe Stunde an etwas gearbeitet hat und dann auf einmal alles weg ist (glaub mir, ich spreche aus Erfahrung). Wenn du mit irgendwas nicht klarkommst, kannst du dich entweder per E-Mail an website@fridaysforfuture.de wenden oder in der Websupport-WhatsApp-Gruppe fragen (Einladungslink: https://fffutu.re/websupport). Bei beidem bekommst du normalerweise ziemlich schnell eine Antwort. Wenn du dich noch nicht so gut mit WordPress (so heißt der Webseiten-Editor, den du hier gerade benutzt) und Webseiten-machen damit auskennst, fang am besten erstmal mit einfachen Layouts an. Links oben mit dem blauen Plus kannst du sogenannte Blöcke einfügen; Blöcke sind alle Elemente, mit denen die Webseite gestaltet ist. Die Überschrift oben ist ein Block, Buttons sind Blöcke, jeder Textabsatz ist ein Block, dieser Absatz hier ist ein Block – you understand the idea. Für den Anfang reichen dir wahrscheinlich erstmal die Blöcke „Überschrift“ und „Absatz“, danach kannst du Buttons erstellen oder Bilder einfügen. Probier einfach etwas aus ^^ Wenn du kompliziertere Blöcke verwendest, schau aber, dass es sowohl auf Geräten mit großen Bildschirmen (zB Laptops) als auch an Handys gut aussieht. Liebe Grüße, Cara (ehemaliges Mitglied aus der Ortsgruppe) PS: Dieser Text ist natürlich nicht sichtbar auf der öffentlichen Seite, sondern nur hier im Bearbeitungsmodus 😉 Wir sind Fridays for Future Offenburg und seit Januar 2019 Teil der FFF-Bewegung. Wir streiken regelmäßig für mehr Klimaschutz und organisieren verschiedene andere Aktionen zum Thema Klimakrise drehen – von Diskussionsrunden bis Müllsammeln. Wir sprechen immer wieder mit verschiedenen Vertreter:innen aus Politik und Zivilgesellschaft, um unsere Forderungen einzubringen. Außerdem arbeiten wir aktiv an Projekten zur Umsetzung dieser Forderungen mit. Um ein paar Schlagworte in den Raum zu werfen: Wir sind eine queerfeministische, antirassitische, basisdemokratische und selbstständige Jugendgruppe, die sich für eine bessere Welt einsetzen will. Bei all dem brauchen wir allerdings Unterstützung und freuen uns immer über neue aktive Gesichter in unserem Team! Unsere Aktionen Termine 1. März 2024, 11 Uhr: Bundesweiter Klimastreik Der Bundesweite Klimastreik rückt immer näher!Am 1. März gehen wir gemeinsam für bessere Arbeitsbedingungen im ÖPNV und für Klimafreundliche Mobilität auf die Straße.Die Kundgebung startet um 11:00 Uhr auf dem Marktplatz in Offenburg, dort werden wir ungefähr bis um 12:00 bleiben und um kurz nach 12:00 Uhr werden wir unseren Laufzug starten.Wir freuen uns auf euch, bringt gerne eure Freund*innen mit! Mitmachen Wir brauchen immer neue Mitglieder, die uns bei der Organisation helfen, also komm doch gern einfach mal zu einem unserer Orgatreffen vorbei! Wir treffen uns immer donnerstags um 17:30 Uhr im Jugendbüro. Schreib uns am besten vorher eine E-Mail oder per DM auf unseren Social-Media-Kanälen, dass du kommen möchtest (sowohl die E-Mail-Adresse als auch unsere Profile der sozialen Medien findest du unten verlinkt). Die Adresse des Jugendbüro ist die Glaserstraße 8 (Zugang über Bäckergasse). Adresse in Google Maps anzeigen Ziele Am wichtigsten ist die Einhaltung des 1,5-Grad-Ziels und des Pariser Abkommens. Daher kämpfen wir für die schnellstmögliche Reduzierung der Treibhausgasemissionen durch Nettonull der Emissionen bis 2035 Vollständiger Kohleausstieg bis 2030 100% erneuerbare Energien bis 2035 Regional fordern wir ein 30-Euro-Monatsticket, 1-Euro-Tagesticket und 30-Minutentakt in jedes Dorf und jede Stadt für Bus und Bahn. Weitere Infos Social Media & Kontakt + Demosprüche FacebookTwitterInstagramTikTok Trete der Infoverteiler-WhatsApp-Gruppe bei Schreibe uns eine E-Mail Lade dir die Demosprüche herunter Andere Ortsgruppen in der Nähe Achern Freiburg Karlsruhe"
