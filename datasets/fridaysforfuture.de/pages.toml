full_description = "Forderungen Niedersachsen Die FridaysForFuture-Gruppen aus Niedersachsen haben anlässlich der Landtagswahl Forderungen aufgestellt. Die Klimakrise ist eine reale, gegenwärtige sowie zukünftige Bedrohung für die Menschheit. Fridays for Future Deutschland streikt seit mehr als 3 Jahren jeden Freitag. In diesen drei Jahren haben Klimafolgen in Form von Bränden, Dürren, Hitzewellen, Überflutungen und vielem mehr weltweit und in Deutschland zu millionenfachem Leid geführt. Im Jahr 2020 haben wir bereits mit dem Wuppertal-Institut gezeigt, dass das 1,5°-Ziel noch einhaltbar ist, und was dafür gemacht werden muss. Die nächsten Jahre werden laut aktuellem Bericht des Weltklimarats entscheidend dafür sein, ob wir die Erderhitzung noch auf ein kontrollierbares Maß beschränken können. Im Wahlkampf hat sich jede demokratische Partei zum 1,5°-Ziel bekannt. Ausreichende Pläne zur Umsetzung dessen hat jedoch bis heute keine Partei vorgestellt. Die neue Landesregierung hat jetzt durch einen breiten Rückhalt für effektive Klimapolitik die Chance, sich Glaubwürdigkeit für ihre Versprechen zu erarbeiten. Hierfür stellen wir Forderungen an den Koalitionsvertrag der künftigen Landesregierung. Ob die Regierung diese Maßnahmen einarbeitet und ergreift oder nicht, wird zeigen, ob sie überhaupt ein ernsthaftes Interesse am Erhalt unserer Lebensgrundlagen hat. Wir fordern von der zukünftigen Landesregierung… … Das Einhalten der eigenen sowie bundesweiten Klimaziele. Niedersachsen muss einen angemessenen Beitrag zum Pariser Klimaabkommen leisten und seine historische und globale Verantwortung in der Klimakrise übernehmen und entsprechend handeln. … Die Beachtung von Klimagerechtigkeitskriterien in allen Entscheidungen sowie ein sofortiger Stopp von fossilen Projekten und Subventionen in allen Bereichen. Treibhausgasemissionen, die keine CO2-Emissionen sind (Methan, Lachgas, …) müssen in das Klimaschutzgesetz des Landes inklusive einem Paris-kompatiblen Reduktionspfad aufgenommen werden.Klimaschutz muss zur kommunalen Pflichtaufgabe werden. Den Kommunen müssen für die Umsetzung von struktureller Veränderung und Anpassungsmaßnahmen ausreichende Mittel zur Verfügung gestellt werden. … Einen schnellen Ausbau erneuerbarer Energien. Das bedeutet unter anderem: Einen Ausbau von mindestens 8 GW der Solarenergie pro Jahr (20mal schneller als jetzt) und mindestens 100 GW Ausbau insgesamtMindestens 2,5% der Landesfläche müssen bis 2024 für Windkraftanlagen zur Verfügung gestellt werden, diese müssen dann so schnell wie möglich gebaut werden Einen Stopp neuer fester LNG-Terminals und der Gas-Bohrungen vor Borkumeine landesweite Wärmewende weg von fossilen Energien … Einen Stopp des Autobahnausbaus und einen sozial gerechten ÖPNV-Ausbau besonders in ländlichen Gebieten.Das bedeutet unter anderem: Einen 20 Minuten-Takt für ÖPNV-Verbindungen (ggf. auf Abruf)Eine Fortsetzung des 9€-Tickets oder die Einführung eines ähnlichen günstigen MonatsticketsEinen massiven Ausbau der Radinfrastruktur … Eine schnelle, sozial gerechte und nachhaltige Agrarwende, die besonders kleine Betriebe unterstützt. Das bedeutet unter anderem: Ein systematischer Abbau der industriellen Tierhaltung und eine Flächenbindung der NutztierhaltungEin umfassendes „Klimawirt*innen-Programm“, das Landwirt*innen auf Moorflächen mit Flächenprämien eine Umorientierung hin zu klimafreundlicher Bewirtschaftung ermöglichtDen Schutz und die Wiedervernässung von Moorflächen sowie einen Genehmigungsstopp für neuen Torfabbau"
year_published = 2025
clearnet = "https://fridaysforfuture.de/forderungen/niedersachsen"
