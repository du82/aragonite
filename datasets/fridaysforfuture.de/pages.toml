title = "Jetzt erst recht – unsere Analyse! | Fridays for Future"
description = "Die USA steigen unter Trump aus dem Pariser Abkommen aus – ein klarer Angriff auf unsere Zukunft. Ja, das ist schlimm. Ja, Klimaschutz voranbringen mit diesem Präsidenten wird hart. In den USA aber auch global. Aber: Wir dürfen jetzt nicht aufgeben. Warum, das erklärt unsere Autorin Zahra. Es kommt mir vor wie ein Fiebertraum: Donald Trump"
full_description = "Jetzt erst recht – unsere Analyse! 21. Januar 202521. Januar 2025 von Zahra in Erzähl mal!, Gut zu wissen!, Neuigkeiten, Und jetzt? 1 Die USA steigen unter Trump aus dem Pariser Abkommen aus – ein klarer Angriff auf unsere Zukunft. Ja, das ist schlimm. Ja, Klimaschutz voranbringen mit diesem Präsidenten wird hart. In den USA aber auch global. Aber: Wir dürfen jetzt nicht aufgeben. Warum, das erklärt unsere Autorin Zahra. Es kommt mir vor wie ein Fiebertraum: Donald Trump ist zurück im Weißen Haus. In Kalifornien zerstören Brände ganze Städte. Währendessen kündigt Trump in seiner Antrittsrede an, Klimaschutz beenden zu wollen und massiv auf die Förderung von Öl zu setzen. Nur Minuten später kommt aus dem Weißen Haus die Meldung, dass der Austritt aus dem Pariser Abkommen eine von Trumps Prioritäten ist. Diese Entwicklungen machen mir Angst. Punkt. Und weil ich glaube, dass es vielen von euch ähnlich geht, möchte ich ein paar Gedanken mit euch teilen. Wenn ihr mehr lesen wollt, findet ihr unten einige Leseempfehlungen. Als Präsident wird Trump auch noch weitere wichtige Klima-Institutionen angreifen: Die wichtigste staatliche Wetterbehörde, unter anderem zuständig für Frühwarnung bei Extremwettern, will er abschaffen und die US-Umweltbehörde EPA der Leitung eines Klimawandelleugners unterstellen. Ja, Trump will den “Klimaschutz beenden” und wir können uns sicher sein, dass er in seiner zweiten Amtszeit gezielter und effizienter sein wird als beim ersten Mal. Aber so einfach ist das nicht. Viel Klimaschutz passiert auf regionaler und lokaler Ebene, wo er gar keinen Einfluss hat. Viele Vorhaben werden außerdem in Gerichten gestoppt werden können. Eine breite Allianz aus 5000 Unternehmen, Verbänden, Städten und Institutionen hat angekündigt, den Klimaschutz auch in einer Trump Amtszeit weiter voranzutreiben. Sie werden dafür Wege finden. Vor gut anderthalb Monaten war ich in Baku auf der Weltklimakonferenz. Eine Woche nach Trumps Wahlsieg war längst klar, dass die USA mit einem Präsidenten, der “DRILL, BABY, DRILL” schreit, 75 Millionen Dollar Spenden von der fossilen Industrie für seinen Wahlkampf bekommen und mehrfach angekündigt hat, das Pariser Abkommen verlassen zu wollen, kein verlässlicher Partner im internationalen Klimaschutz sein würden. Aber Trumps Präsidentschaft mit dem Untergang des internationalen Klimaschutzes gleichzusetzen, wäre ein Fehler. Klimapolitisch sind wir heute immerhin an einem anderen Punkt als noch vor fünf Jahren, als Trump zum ersten Mal das Pariser Abkommen verlassen hat. Viele Länder, die damals noch blockiert haben, stehen jetzt fest hinter dem Pariser Abkommen – China zum Beispiel. Es kommt jetzt auf die anderen Länder an, die jetzt zusammenhalten und die Lücke, die die USA hinterlassen, füllen müssen – dabei ist die EU ganz zentral. Während wir besorgt in die USA schauen, schauen Klimabewegte aus den USA nach Europa, auch nach Deutschland. “We’re counting on you to hold the line”, das hat mir eine befreundete Klimaaktivistin aus den USA gesagt, als wir in Baku auf dem Boden des Konfrenzgeländes saßen. Sie weiß genau, dass bei uns die Bundestagswahlen anstehen und verfolgt die Nachrichten, wenn Lindner “mehr Musk wagen will” (das Bundesumweltamt abschaffen zum Beispiel) oder wenn Merz jetzt plötzlich 50 neue Gaskraftwerke bauen will. Und sie hat Angst, dass wir den Trumps und Musks dieser Welt jetzt das Geschenk machen, aufzugeben. “Don’t you dare give up”, hat sie mir geschrieben. In den nächsten Wochen werden wir immer wieder Rufe hören, dass sich Klimaschutz ja eh nicht mehr lohnen würde, dass eh alles verloren sei. “Klimaschutz schön und gut, aber wir können ja nicht alleine voran gehen” oder “wenn die USA nicht mitmachen, dann bringt Klimaschutz in Deutschland ja sowieso nichts”, werden sie sagen. Das sind vor allem die Stimmen derjenigen, die seit Jahrzehnten jede Gelegenheit nutzen, Ausreden zu finden, warum Klimaschutz gerade keine so gute Idee sei. Sie zählen auf unsere Resignation. Und es wäre einfach dem nachzugeben – manchmal scheint es vielleicht sogar verlockend. Wir können alle nicht leugnen, dass es gerade unglaublich anstrengend ist, fürs Klima zu kämpfen. Und ja, es wird nicht einfach so von selbst leichter werden. Die politischen Verhältnisse werden rauer, Unsagbares sagbarer, nicht nur beim Klimaschutz sondern bei allem: Der Diskurs rückt weiter nach rechts, mehr Spaltung, weniger Menschlichkeit. Aber da draußen eskaliert die Klimakrise weiter und wir wissen: Jedes Zehntel Grad hat konkrete Auswirkungen auf Lebensmittelpreise, auf Konflikte um Ressourcen, auf Menschen, die ihre Häuser verlieren, und in den schlimmsten Fällen ihre Leben. Also machen wir weiter, auch wenn es hart ist. Also bleiben wir dran und kämpfen für Klimaschutz, auch und gerade wenn in diesem Wahlkampf kaum wer darüber spricht. Und ich bin wirklich dankbar für jede Person, die mit uns am Start ist, auch in diesen Zeiten. Unsere Arbeit bei Fridays for Future wird erst durch Dich möglich: Durch viele einzelne Privatpersonen, die uns mit Spenden – vor allem regelmäßigen Spenden – unterstützen. So können wir Demonstrationen für Hunderttausende Menschen organisieren, für Klimagerechtigkeit kämpfen und unabhängig von Großspendern agieren. Klimaaktivismus war mal leichter, das stimmt, aber gerade jetzt zeigt sich, wer es ernst meint mit dem Klima und unserer Zukunft. Wenn Du die Möglichkeit hast, unterstütze uns gern mit einer regelmäßigen Spende. Danke, dass Du dabei bist! Jetzt Unterstützer*in werden! PS: Wenn du noch mehr zu den aktuellen Geschehnissen lesen möchtet, dann sind hier noch ein paar Texte, die ich empfehlen kann, um in diesen Tagen die Gedanken zu sortieren: Im Gastbeitrag bei watson beschreibt Helena Marschall, warum Aufgeben trotz und wegen Trump keine Option ist. Im Interview mit der taz spricht Luisa Neubauer übers Wählen und Kämpfen, und, wer übers Klima spricht, wenn wir es nicht tun. Und ebenfalls bei der taz schreibt Pauline Brünger in einem Gastkommentar über die gefährliche Erzählung, dass „Klima kein Thema mehr“ sei. Zahra ist Aktivistin bei Fridays for Future in Dresden. Für Fridays for Future war sie unter anderem auf der Weltklimakonferenz COP29 in Baku, Aserbaidschan, um auch global für mehr Klimaschutz zu kämpfen. Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
