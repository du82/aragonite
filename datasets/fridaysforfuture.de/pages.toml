description = "Wir sind die Fridays for Future Fulda und seit Januar 2019 Teil der Bewegung! 🥳 Seitdem streiken wir regelmäßig an allen globalen Steikterminen und bieten auch verschiedene andere Aktionen an. Im Moment machen wir jeden Freitag einen Sitzstreik vor dem Fuldaer Stadtschloss, um die Kommunalpolitiker:innen zum Handeln aufzufordern. 🙌🏻 Wir fordern Klimaneutralität für 2030 in"
full_description = "OG Fulda Wir sind die Fridays for Future Fulda und seit Januar 2019 Teil der Bewegung! 🥳 Seitdem streiken wir regelmäßig an allen globalen Steikterminen und bieten auch verschiedene andere Aktionen an. Im Moment machen wir jeden Freitag einen Sitzstreik vor dem Fuldaer Stadtschloss, um die Kommunalpolitiker:innen zum Handeln aufzufordern. 🙌🏻 Wir fordern Klimaneutralität für 2030 in der Region Fulda und wollen in der Kommunalpolitik einen Klimarat installieren, sodass zukünftige politische Entscheidungen auf ihre Klimaverträglichkeit hin geprüft werden. Dafür hat sich jetzt auch ein regionales zivilgesellschaftliches Bündnis für Klima und Nachhaltigkeit gegründet, welche in den Bereichen Verkehr, Energie, Bauen, Ernährung und Landwirtschaft usw. Forderungen und Lösungen entwickelt, ganz nach dem Motto „Global denken, Lokal handeln.“ Du findest das Bündnis hier: https://www.bkn-fulda.de/ Wir haben regelmäßig Orga-Treffen in der L14zwo in Fulda bzw. bei schönem Wetter draußen im Schlosspark, jeden Mittwoch um 19 Uhr. Wenn du Lust hast dich zu engagieren, komm doch gerne mal dazu und lern uns kennen :D. Wir freuen uns auf dich und deine Ideen. Bei all unseren Aktionen freuen wir uns über Unterstützung. Sei auch du aktiv dabei! 💚 Kontaktiere uns gerne über fulda@fridaysforfuture.is. Bleibe Immer Auf Dem Laufenden Termine 19.3 Globaler Klimastreik Wann? Freitag der 19.3, 12:00 Uniplatz Fahrraddemo, 13:00 Uhr Uniplatz Kundgebung Thema? Globaler Klimastreik #keingradweiter Die Klimakrise ist nach wie vor eine existenzielle Bedrohung – und noch immer hat die Politik keinen Plan für konsequenten Klimaschutz. ❌ Daher gehen wir am 19.03. wieder weltweit auf die Straßen – und natürlich auch in #fulda !💥 Wir sind mit einer bunten #fahrraddemo dabei. 🚴♀ Start der Demo: 12 Uhr am Uniplatz Start der Kundgebung: 13 Uhr Uniplatz Aber warte, was heißt eigentlich dieses BUNT🤔 es steht für alle klimaneutralen Fahrzeuge die keine Fahrräder sind, heißt ihr könnt z.B. auch als Skateboard-Gang zur Demo kommen 😱 oder Inliner, Cityroller… 🛴 Seid kreativ, ihr müsst lediglich sicher und schneller als Schrittempo fahren. Bei der Kundgebung wartet ein kreatives Programm auf euch 🔥 Neu: – Die Kundgebung wird von einer Gebärdensprachdolmetscherin übersetzt. – Für die Fahrraddemo haben wir ein Ausleihsystem errichtet. Also wir sind am Start, DU auch? #AlleFür1Komma5 💚 #NoMoreEmptyPromises 💚 #climatejustice 💚 Wegen der aktuellen Corona-Pandemie müssen Abstände eingehalten werden und ein Mund-Nase-Schutz getragen werden. Aktuelle Informationen finden Sie auf Instagram unter @fridaysforfuture.fulda Blog Unser Positionspapier – Dafür stehen wir! Zu allen unterstrichenen Wörtern findet sich unten eine Begriffserklärung. Wir sind alle aus unterschiedlichen Gründen bei FFF aktiv, doch trotzdem verbindet uns ein Wille zur Veränderung, der Drang, GEMEINSAM etwas zu verändern und die Welt gerechter zu machen. Wir müssen und wollen kämpfen, auch wenn wir vielleicht keine einheitliche Vision vor unseren Augen haben – bloß zuzusehen und nichts zu machen ist für uns keine Option. Wir kämpfen für die Einhaltung der 1,5 Grad Grenze vom Pariser Klimaschutzabkommen, stehen hinter den Forderungen von FfF Deutschland und beziehen uns auf die wissenschaftlichen Erkenntnisse der Klimawissenschaft.Unser oberstes Ziel ist Klimagerechtigkeit. Trotzdem ist FFF Fulda nicht nur eine reine Klimabewegung – der Kampf für Klimagerechtigkeit ist auch mit anderen Kämpfen verbunden. Klimagerechtigkeit heißt Antirassismus, Feminismus, Anti-Ableismus, Anti-Klassismus, Kapitalismuskritik und der Support von LGBTQIA+-Rechten.Antirassismus: Der Globale Norden und vor allem Deutschland trägt als ehemalige Kolonialmacht in der Klimakrise eine besondere Verantwortung. Deutschland ist einer der Hauptverursacher*innen der Klimakrise und leidet wie andere Staaten des Globalen Nordens im globalen Vergleich wenig unter den Folgen der Klimakrise. Deutschland wirtschaftet auf Kosten anderer Länder und deren Menschen, sowie auf Kosten der nachfolgenden Generationen. Außerdem ist Deutschland mitverantwortlich für die sich verschärfende Klimaflucht und muss deshalb flüchtende Menschen aufnehmen und sich für diese einsetzen.Darum stehen wir in Solidarität mit den MAPA Menschen. Sie sind im Mittelpunkt unseres Kampfes, ihre Stimmen müssen wir am meisten hören und bei jeder Gelegenheit weiter nach außen tragen! Wir stehen ebenfalls solidarisch mit geflüchteten Menschen und fordern die Achtung der universalen Menschenrechte.Feminismus: Die Klimakrise verstärkt soziale Ungerechtigkeiten – und benachteiligt somit FLINTA* weiterhin. Innerhalb unserer Ortsgruppe sind vor allem cis-Männer gebeten, ihre Männlichkeit kritisch zu reflektieren und auf Aspekte wie Rededominanz zu achten. Zerstört das Patriarchat, nicht den Planeten!Ableismus: Die Klimakrise verstärkt Ungerechtigkeiten, indem sie die Teile der Gesellschaft stärker trifft, die bereits heute benachteiligt sind. Menschen mit Behinderung sind stärker von der Klimakrise betroffen – z.B. durch ein höheres Armutsrisiko und körperliche Einschränkungen, die es erschweren, sich bei Gefahren zu retten. Wir achten in unserer OG auf ableistische Strukturen und die Beseitigung dieser, und fordern eine inklusivere Gesellschaft.Klassismus: Fridays For Future hat klassistische Strukuren, und auch in unserer Ortsgruppe sind vor allem Studierende und Gymnasialschüler*innen aktiv, die es sich leisten können sich in ihrer freien Zeit ehrenamtlich zu engagieren. Damit müssen wir uns auseinandersetzten und aktiv dagegen vorgehen – z.B. durch die Schüler*innen AG, die Schüler*innen von allen Schulen mobilisieren und empowern will. Die Verwendung von Fachbegriffen ohne Erklärung ist zu vermeiden. Plakate sollten in jedem Stadtteil, wenn möglich, aufgehangen werden.FFF ist eine Bewegung für alle!LGBTQIA+: Als marginalisierte Gruppe sind auch queere Menschen stärker durch die Klimakrise betroffen. Wir versuchen ein safe-space zu sein, kämpfen für LGBTQIA+ Rechte und wollen dies z.B. konkret durch das Sagen unserer Pronomen bei Vorstellungsrunden und das Gendern in öffentlichen Texten durchsetzen. Wir arbeiten kontinuierlich an unseren Entscheidungs- und Gruppenprozessen und wollen diese gerecht und sensibel gestalten. Jede*r soll gehört und gesehen werden.There is no pride on a dead planet.Bei uns ist kein Platz für Rassismus und andere Diskriminierungsformen! Sehr wichtig ist die Reflektion des eigenen Verhaltens, des eigenen Weißseins und eine Lernbereitschaft, denn wir leben alle in einem rassistischen System und sind davon geprägt. Menschen, die andere diskriminieren und ihr Verhalten nicht verändern wollen, werden aus der Ortsgruppe ausgeschlossen. Antikapitalismus: Wir sprechen uns gegen Kapitalismus aus und üben Kritik, da in unserem kapitalistischen System der Grundsatz der Nachhaltigkeit und Gerechtigkeit zu kurz kommt und die Klimakrise so befeuert wird. Wir haben bisher auch keine ausgereifte Lösung für das Problem – doch dies ist für uns als junge Menschen auch nicht unsere Verantwortung. Wir kritisieren Unternehmen, klimaschädliche Subventionen und Gesetze, sowie den kulturell vorherrschenden Wachstums-, Profit- und Leistungszwangs.System Change, not Climate Change!Als FFF sind wir nicht für Lösungsentwürfe verantwortlich. Wir können auch Druck auf die Politik ausüben und gesellschaftliche Zustände kritisieren, ohne die perfekten Lösungen zu kennen. Im Sinne der Generationengerechtigkeit fordern wir die älteren Generationen zum Handeln auf. Radikalität, mit der Bedeutung mehr Aktionen des Zivilen Ungehorsams zu machen, lehnen wir nicht grundsätzlich ab. Wir erachten es aber als FFF Fulda in unserer aktuellen Situation als einzige Klimagerechtigkeitsbegung in einer konservativen Stadt nicht als sinnvoll, radikaler zu werden. Wir können mehr erreichen, indem wir die breite Masse ansprechen und beim Schulstreik bleiben, welches ebenfalls Ziviler Ungehorsam ist. Unsere Aktionen sind gewaltfrei.Wir träumen von einer klimagerechten Welt, in welcher Ressourcen gemeinsam verwaltet und geteilt werden und Solidarität und soziale Gerechtigkeit zentrale Grundwerte sind. Für Fulda wünschen wir uns Klimaneutralität für 2030 und eine Fuß- und Fahhrradfreundliche Stadt. Die Utopien, die wir uns wünschen, leben wir teilweise auch selbst: Wir organiseren uns basisdemokratisch ohne hierarchische Strukturen, und versuchen so gut es geht individuell einen ökologisch-gerechten Lifestyle zu leben. Somit lassen wir die Utopien nicht nur Utopien sein, sondern versuchen sie in unserer Gegenwart und Lebenswelt konkret zu beginnen. Klimaaktivismus ist gelebte Demokratie.Wir unterstützen uns gegenseitig in unserem Kampf für Klimagerechtigkeit, hören einander zu, schaffen Platz für Reflektion, Awareness, Regeneration & unsere Emotionen und sind alle super stolz auf uns selbst für all das, was wir bereits erreicht haben und weiterhin erreichen werden! WE ARE UNSTOPPABLE, ANOTHER WORLD IS POSSIBLE! Begriffserklärungen: Ableismus ist die Diskriminierung von Menschen mit Behinderung. Klassismus bezeichnet Vorurteile oder Diskriminierung aufgrund der sozialen Herkunft oder der sozialen Position und richtet sich meist gegen Angehörige einer sogenannten „niedrigeren“ sozialen Klasse mit geringeren Einkommen. LGBTQIA+ steht für Lesbisch, Gay (Deutsch: Schwul), Bisexuell, Trans*, Queer, Intersex, Asexuell/Aromantisch/Agender und mehr. Damit werden nicht heterosexuelle, cis-gender oder allosexuelle (=nicht asexuelle) Menschen bezeichnet.MAPA: most affected people and areas – am meisten (von der Klimakrise) betroffene Menschen und Regionen.FLINTA*: Frauen, Lesbian, Intersex, Nicht Binäre Menschen, Trans Menschen & Agender – der Begriff wird verwendet, um nicht nur von Frauen zu sprechen, sondern alle Gruppen außer cis-Männer, welche vom Patriarchat profitieren, zusammenzufassen.Cis: Cis Menschen sind die, die sich dem Körper zugehörig fühlen, in dem sie geboren sind – also das Gegenteil von trans. Patriarchat: Das Patriarchat ist die Gesellschaftsordnung, in der Männer eine bevorzugte Stellung haben und von der sie profitieren. In Deutschland gibt es ein Patriarchat und es wirken in allen Bereichen patriarchale Strukturen.marginalisiert: ausgegrenztQueer: Queer wird oftmals als Sammelbegriff für Mitglieder der LGBTQIA+ Community verwendet, im Endeffekt ist es aber die eigene Entscheidung jedes Mitglieds, ob es sich als queer labeln will oder nicht.Safe-Space: Ein Safe Space ist ein Ort, an dem in der Gesellschaftlich benachteiligte Menschen sich wohl fühlen können und keine Diskriminierung erwarten müssen.Kapitalismus bezeichnet die vorherrschende (Deutsche) Wirtschafts- und Gesellschaftsordnung. Darin besitzen einige wenige Menschen mehr als andere – gibt es ein paar Menschen, die extrem reich sind, und viel mehr, die sehr arm sind. Kapitalismus basiert auf der Logik der Gewinnmaximierung dem individuellen Profitstreben sowie dem Verwertungszwang von Mensch, Tier und Natur. Euch sind (andere) Begriffe noch unklar? Googelt sie gerne oder meldet euch bei Fragen! Sitzstreik vorm Stadtschloss – „Wir streiken bis die Fuldaer Politik handelt“ Mit unseren wöchentlichen Sitzstreiks als Mahnwache, wollen wir jeden Freitag sichtbar machen, dass Fulda viel mehr für Klimagerechtigkeit machen muss. Wir fordern eine Politik, die die Klimawissenschaft und die Klimakrise ernst nimmt und dem 1,5 Grad Ziel von Paris gerecht wird. Die Stadt und der Landkreis Fulda sind noch weit davon entfernt, deswegen wollen wir mehr Aufmerksamkeit für die Verantwortung der Städte und Kommunen an der Klimakrise schaffen. Mit einer Verkehrswende, Energiewende und Agrarwende könnte Fulda zu einem nachhaltigeren, grüneren und lebenswerteren Ort werden, wo Menschen noch gut und gerne viele Jahre wohnen können…Doch bislang ist Fulda immer noch eine autogerechte Stadt mit schlecht aufgebauten ÖPNV, wenig Stadtbegrünung und Naturräume und einem veralteten und wenig ambitionierten Klimaschutzkonzept von 2013. Hier muss sich etwas ändern ! Wenn wir etwas verändern können, dann auf kommunaler Ebene. Hier lässt sich eine Menge C02 einsparen, und wir sind bereit diese kommunale ökologische und soziale Transformation einzuleiten! Es braucht jetzt aber politischen Mut und Wille mehr Klimaschutz endlich zu wagen! hdr „Bunt statt Braun“ – Fulda feiert Vielfalt Anlässlich der Wahlkampfauftaktveranstaltung der Fuldaer Afd, haben wir gemeinsam als Bündnis mit anderen Fuldaer Initiativen und Vereinen eine Gegendemo gestartet, um ein Zeichen für Geschlechtergerechtigkeit, die Rechte der LGBTIQ+ -Community, Antirassismus und für eine weltoffene und tolerante Gesellschaft zu setzen. Es kamen um die 300 Menschen an diesem Samstag abend zusammen und wir haben deutlich gemacht, dass wir laut und bunt sind und mehr sind als die Afd. Wir dulden rechtes Gedankengut, Hass und Hetze, Verschwörungserzählungen und Klimawandelleugner:innen nicht und stehen auf für eine bessere und gerechte Welt, in der jeder Mensch, so sein, so leben und lieben kann, wie er*sie das möchte. Hier noch ein paar Impressionen unserer Bündnisdemo für Vielfalt und Gleichberechtigung: Mobilitätswende-demos am 5. und 6. Juni „Verkehrswende JETZT!“ Dieses Wochenende stand voll und ganz im Zeichen der Verkehrswende. Wir nahmen an den Fahrraddemos der Verkehrswende und des vcds Fulda teil und forderten mehr Raum für Fußgänger:innen und Fahrrafahrer:innen in Fulda, und fordern ein Baustopp von neuen Autobahnen! Wir fuhren sogar auf der Autobahn ! hdrFotos unter Anderem von Osthessen news Globaler Klimastreik am 19. März 2021 #Nomoreemptypromises An diesem Tag kamen trotz Corona 300 Menschen zusammen und haben erneut ein Zeichen für globale und lokale Klimagerechtigkeit gesetzt. Zuerst gab es einen bunten Demozug mit Fahrrädern, Inlinern, Skateboards usw. rund um die Stadt und anschließend gab es Redebeiträge und Musikstücke auf dem Uniplatz zu hören. Mal hat es geschneit, mal war die Sonne zu sehen…wir waren aber da und haben unsere Stimmen erhoben und es wurde sogar auch getanzt. Trotz Corona Pandemie haben wir gezeigt, dass immer noch viele Menschen einen ökologischen und sozialen Wandel wollen und mehr Klimaschutz von der Regierung fordern. Dieses Jahr ist ein Superwahljahr, deswegen machen wir die Bundstagswahl zur Klimawahl. Auch in Fulda werden wir nicht locker lassen und die Stadtverordneten sowie den Kreistag an ihre Veratwortung und Pflicht erinnern, eine nachhaltige und zukunftsfähige Stadt und Land zu gestalten, und die C02 Emissionen gezielt zu reduzieren. Hier sind ein paar Auszüge aus zwei Reden von unserem Orgateam: Rede zu Klimagerechtigkeit: Als ich angefangen habe, diese Rede zu schreiben, war ich noch sehr optimistisch, hier Klimagerechtigkeit erklären zu können. Aber eine 5-Minütige Rede kann der Komplexität des Problems nicht gerecht werden: Rassismus, Kolonialismus, Ausbeutung, Unterdrückung, so viele Machtasymmetrien, all das spielt eine Rolle, und es geht um so viel mehr"
