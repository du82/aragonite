["https://fridaysforfuture.de/klimacamps"]
title = "Klimacamps | Fridays for Future"
description = "Ein gelebter Weg in die Zukunft! In einem Klimacamp geht vieles, was auf Demos nicht so geht: In diesen mehrtägigen, in manchen Fällen auch auf unbestimmte Zeit andauernden Zeltlagern ist Raum für Workshops zu Themen rund ums Klima, für Vernetzung und neue Begegnungen. Insbesondere im Zuge der Corona-Pandemie ist die Zahl von Klimacamps gewaltig gewachsen,"
full_description = '''Klimacamps Ein gelebter Weg in die Zukunft! In einem Klimacamp geht vieles, was auf Demos nicht so geht: In diesen mehrtägigen, in manchen Fällen auch auf unbestimmte Zeit andauernden Zeltlagern ist Raum für Workshops zu Themen rund ums Klima, für Vernetzung und neue Begegnungen. Insbesondere im Zuge der Corona-Pandemie ist die Zahl von Klimacamps gewaltig gewachsen, da sie lokal vor Ort auf die Klimakrise aufmerksam machen können, ohne tausende von Menschen auf einmal zu beherbergen. Natürlich gab und soll es auch weiterhin Klimacamps geben, die in den Innenstädten Passant:innen fortdauernd auf die Klimakrise aufmerksam machen. In folgenden Städten findest du solche Klimacamps, mit spannenden Workshops, Vorträgen und vielem mehr. Die Zeltlager sind öffentlich zugänglich und freuen sich auf viele Besucher:innen. var zeltIcon = L.icon({ iconUrl: 'https://fridaysforfuture.de/wp-content/uploads/2020/08/Zelt_resized.png', shadowUrl: 'https://fridaysforfuture.de/wp-content/uploads/2020/08/Schatten-Zelt.png', iconSize: [117, 65], // size of the icon shadowSize: [117, 76], // size of the shadow iconAnchor: [50, 47], // point of the icon which will correspond to marker's location shadowAnchor: [20, 60], // the same for the shadow popupAnchor: [7, -39] // point from which the popup should open relative to the iconAnchor }); var map = L.map('map', { center: [51.5, 10], zoom: 5.5, maxZoom: 18, zoomSnap: 0, gestureHandling: true, prefereCanvas: true }); L.tileLayer('https://mapcache.fridaysforfuture.de/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Fridays for Future' }).addTo(map); L.marker([48.369025, 10.898511], {icon: zeltIcon}).addTo(map).bindPopup('<strong>Klimacamp Augsburg</strong><br />Fischmarkt 1'); L.marker([52.9222675, 12.8046069], {icon: zeltIcon}).addTo(map).bindPopup('<strong>Klimacamp Neuruppin</strong><br />Bernhard-Brasch-Platz<br /> Vom 1.9. bis zum 3.9.'); L.marker([52.0182865, 8.4949961], {icon: zeltIcon}).addTo(map).bindPopup('<strong>Klimacamp Bielefeld</strong><br />Am alten Ratshaus<br /> Vom 5.9. bis zum 11.9.'); L.marker([47.663028712897905, 9.175937511752386], {icon: zeltIcon}).addTo(map).bindPopup('<strong>Klimacamp Konstanz</strong><br />Pfalzgarten'); L.marker([47.9962132,7.8493536], {icon: zeltIcon}).addTo(map).bindPopup('<strong>Klimacamp Freiburg</strong><br />Rathausplatz<br><a href="https://www.klimacampfreiburg.de/">Zur Website des Klimacamps</a>'); Wo gibt es aktuell Klimacamps? Augsburg Zur Website vom Klimacamp Augsburg Am Klimacamp 186150 Augsburg Das Augsburger Klimacamp befindet sich zwischen dem Perlachturm und dem Rathaus in der Augsburger Innenstadt. Mit dem Camp wollen wir die Politik und die Stadt Augsburg zum Handeln bewegen – als Ortsgruppe Augsburg fordern wir deshalb: Eine öffentliche Positionierung zum KohleEINstiegsgetz und den Aufruf zur Klimagerechtigkeit Die Einhaltung des CO2 Budgets Die Stadt soll ihren Anteil am 1,5 Grad Ziel einhalten und ihr noch übriges CO2 Budget öffentlich kommunizieren. Es soll transparent ein Plan offengelegt werden, wie viel CO2 die Stadt noch zu emittieren gedenkt. Wenn der geplante Ausstoß über dem Anteil, der der Stadt zu steht, liegt, muss begründet werden mit welchem Recht die Stadt sich das herausnimmt. (Das CO2-Budget kann für eine Stadt kann sehr einfach ausgerechnet werden.) Den sofortigen Start der Energiewende in Augsburg Augsburger Kohleausstieg bis 2025 schneller Solarenergieausbau Fahrradstadt jetzt! Die Stadt Augsburg soll die Verkehrswende voranbringen. Dazu ist es nötig das lokale Radbegehren umzusetzen. Um auch in Zeiten einer Pandemie protestieren zu können und dabei das Infektionsrisiko möglichst niedrig zu halten, halten wir uns an folgendes Hygienekonzept: Teilnehmendenbeschränkung: Je 2 Personen oder eine Bezugsgruppe (BW-Zelt, Küche, Holzhaus, Gitarrenpavillon) Maskenpflicht – Ein Verstoß kostet 500€ Strafe! Immer echte 1,5m Abstand Beim Essen echte 3m Abstand Beim Rauchen echte 5m Abstand Generell: Rauchen nur am Rand & Alkoholverbot Kein Singen oder Sprüche-Rufen ohne Maske! Allgemein möglichst nie ohne Maske sprechen! In der Küche Hände desinfizieren Beim Essen nicht sprechen und keine Menschen ansprechen, die gerade essen Also schnappt euch euren Schlafsack, eure Isomatte und eventuell auch ein Zelt und kommt mit euren Freund*innen und ganz viel guter Laune ins Augsburger Klimacamp – wir freuen uns über jede*n Besucher*in! Wenn ihr Lust habt ein eigenes Camp zu starten oder Fragen zu dem Klimacamp habt, schreibt gerne eine E-Mail an augsburg@fridaysforfuture.de – oder sendet uns Postkarten an unsere inoffizielle Anschrift: Am Klimacamp 1; Fischmarkt, 86150 Augsburg! Konstanz Zur Website vom Klimacamp Konstanz Pfalzgarten (Kiesplatz rechts vom Münster an der Säule)78462 Konstanz Seit dem 1. August sind auch wir mit unserem Konstanzer Klimacamp am Start. Alle sind herzlich willkommen und eingeladen, einfach mal vorbeizuschauen oder aktiv mitzumachen! Wir freuen uns auf spannende Workshops, Vorträge, Diskussionen und Austausch mit Passant:innen und Besucher:innen – schließlich können wir nur gemeinsam etwas gegen die Klimakrise tun. Da wir uns auch in der Corona-Krise solidarisch verhalten wollen, um uns bestmöglich vor Infektionen zu schützen, halten wir uns an folgendes Hygienekonzept: Maskenpflicht Abstandsgebot Hände waschen und desinfizieren Freiburg Zur Website vom Klimacamp Freiburg Ihr plant selbst ein Klimacamp? Dann schickt uns über unser Kontaktformular eine Nachricht mit dem Anliegen „Website/IT“.'''
year_published = 2025
