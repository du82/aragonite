acht lang hatten die Diplomat*innen verhandelt und nach einer Verlängerung von über 30 Stunden wurde das Abschlussdokument mit dem Hammerschlag besiegelt. Dass es dazu noch kommt, hatten viele bezweifelt. Die Gräben zwischen den verschiedenen Parteien waren groß, … Weiterlesen über „COP Daily – Ende der COP29“!"
