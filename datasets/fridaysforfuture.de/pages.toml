["https://fridaysforfuture.de/aktionen"]
title = "Aktionen | Fridays for Future"
description = "Am 14. Februar ist der nächste Klimastreik! Hier findest Du heraus, wann welche Fridays for Future-Aktionen stattfinden oder stattgefunden haben. Bist Du auf der Suche nach einem wöchentlichen Streik in Deinem Ort? Dann hier entlang! Willst Du selber eine Aktion organisieren, dann hier entlang!"
full_description = 'Aktionen Am 14. Februar ist der nächste Klimastreik! #klimastreik-button:hover { background-color: white !important; color: red !important; border-color: red !important; } Hier findest Du heraus, wann welche Fridays for Future-Aktionen stattfinden oder stattgefunden haben. Bist Du auf der Suche nach einem wöchentlichen Streik in Deinem Ort? Dann hier entlang! Willst Du selber eine Aktion organisieren, dann hier entlang! // setup and timeline entries // number of items to display let displayCount = 10; // timeline items always need a sorting date in the format YYYY-MM-DD (e.g. 2020-09-24) and a date for display purposes let timelineItems = [ { date: "18. Januar 2019", sortingDate: "2019-01-18", title: "Erster dezentraler Aktionstag", description: "Eine überwältigende Anzahl von über 30.000 Schüler*innen, Studierenden und Azubis auf den Straßen sind ein eindeutiges Zeichen: Die Klimabewegung wächst immer weiter!", url: "https://fridaysforfuture.de/18januar/", }, { date: "25. Januar 2019", sortingDate: "2019-01-25", title: "Großstreik in Berlin", description: "Wir streiken vor dem Bundeswirtschaftsministerium, wo die Kohlekommission gerade den Kohleausstieg verhandelt.", url: "https://fridaysforfuture.de/grossstreik-am-25-01-in-berlin/", }, { date: "15. März 2019", sortingDate: "2019-03-15", title: "Erster Globaler Klimastreik", description: "Gemeinsam fordern wir von den Regierungen unserer Länder und der internationalen Staatengemeinschaft unsere Zukunft nicht weiter kurzfristigen Interessen zu opfern.", url: "https://fridaysforfuture.de/march15th/", }, { date: "08. April 2019", sortingDate: "2019-04-08", title: "#FFFfordert", description: "Wir stellen unsere Forderungen an die Politik vor. Es ist klar: wir haben gesprochen – jetzt muss gehandelt werden!", url: "https://fridaysforfuture.de/ffffordert/", }, { date: "24. Mai 2019", sortingDate: "2019-05-24", title: "Globaler Klimastreik zur Europawahl", description: "Anlässlich der Europawahl gehen über die Grenzen Europas hinaus junge Menschen auf die Straßen, um auf die Bedeutung der Europawahl für unser globales Klima aufmerksam zu machen.", url: "https://fridaysforfuture.de/24mai/", }, { date: "26. Mai 2019", sortingDate: "2019-05-26", title: "#VoteForClimate", description: "Jeder hat eine Wahl, aber nicht jeder darf wählen. Deshalb machen wir die Europawahl zur Klimawahl", url: "https://fridaysforfuture.de/klimawahl/", }, { date: "21. Juni 2019", sortingDate: "2019-06-21", title: "Zentraldemo in Aachen #ac2106", description: "Der erste internationale, zentrale Streik von Fridays for Future. Aus insgesamt 16 Ländern kommen wir nach Aachen, um für eine gerechte und verantwortungsbewusste Klimapolitik zu demonstrieren.", url: "https://ac2106.fridaysforfuture.de/", }, { date: "31. Juli - 4. August 2019", sortingDate: "2019-07-31", title: "Sommerkongress in Dortmund", description: "Auf dem Kongress wollen wir zusammenkommen, damit unsere Bewegung noch größer, bunter und weltbewegender wird. Mit über tausend Aktivist*innen tauschen wir uns aus und vernetzen uns", url: "https://www.kongress.fridaysforfuture.de/", }, { date: "5.-9. August 2019", sortingDate: "2019-08-05", title: "Smile for Future Summit", description: "Über 450 junge Klimastreikende aus 37 Ländern Europas versammeln sich angesichts der durch die Klimakrise bedrohten Zukunft der Erde zum internationalen Gipfeltreffen Smile For Future in Lausanne.", url: "https://fridaysforfuture.de/smileforfuture-summit/", }, { date: "1. September 2019", sortingDate: "2019-09-01", title: "Landtagswahlen in Brandenburg und Sachsen", description: "Brandenburg und Sachsen sind die Bundesländer, in denen noch immer Braunkohletagebaue betrieben werden, um Kohle gemeinsam mit unserer Zukunft in den Kraftwerken der Lausitz zu verfeuern. ", url: "https://fridaysforfuture.de/ltw/", }, { date: "20. September 2019", sortingDate: "2019-09-20", title: "Globaler Klimastreik #AlleFürsKlima", description: "Über 1,4 Million Menschen gehen auf die Straße, um für die Einhaltung des Parisabkommen und gegen die anhaltende Klimazerstörung laut zu werden.", url: "https://fridaysforfuture.de/2019-allefuersklima/", }, { date: "21.-27. September 2019", sortingDate: "2019-09-21", title: "#week4CLIMATE", description: "Sieben Tage – sieben Themen – ein Ziel: die Rettung der Erde. Wir streiken eine Woche lang für konsequente Klimapolitik", url: "https://fridaysforfuture.de/week4climate/", }, { date: "27. Oktober 2019", sortingDate: "2019-10-27", title: "Landtagswahl in Thüringen", description: "Dieser Landtag wird der letzte sein, der wirkungsvolle Maßnahmen zur Begrenzung der Klimakrise umsetzen kann. Deshalb machen wir diese Wahl zur Klimawahl", url: "https://fridaysforfuture.de/streik-zu-den-landtagswahlen-in-thueringen/", }, { date: "29. November 2019", sortingDate: "2019-11-29", title: "Globaler Klimastreik #NeustartKlima", description: "Es muss endlich Schluss sein mit Pillepalle und business as usual. Streiks in über 519 Orten fordern Klimagerechtigkeit – und zwar jetzt!", url: "https://fridaysforfuture.de/neustartklima/", }, { date: "17. Januar 2020", sortingDate: "2020-01-27", title: "Die Uhr tickt!", description: "Ein Jahr? Nix passiert! Wir werden die Handlungsunfähigkeit der Bundesregierung nicht weiter akzeptieren und rufen zu einer länderübergreifenden Demonstration in Mainz auf!", url: "https://fridaysforfuture.de/dieuhrtickt/", }, { date: "5. Februar 2020", sortingDate: "2020-02-05", title: "Anti-Siemens-Proteste #StopAdani", description: "Siemens hat uns eine unmissverständliche Botschaft gesandt - ihnen ist die Zukunft egal. Deshalb setzen wir vor der Aktionär*innen-Hauptversammlung ein Zeichen", url: "https://fridaysforfuture.de/siemens-hauptversammlung/", }, { date: "13. Februar 2020", sortingDate: "2020-02-13", title: "Time To Change", description: "Beim Zentralstreik in Bielefeld fordern wir eine Wirtschaftspolitik, die den Wert aller Lebewesen respektiert und eine Klimapolitik, die Klimagerechtigkeit garantiert!", url: "https://fridaysforfuture.de/timetochange/", }, { date: "13. März 2020", sortingDate: "2020-03-13", title: "#BayernWähltKlima", description: "Zur Kommunalwahl geht Bayern wegen Corona netzstreiken für’s Klima!", url: "https://fridaysforfuture.de/netzstreik/", }, { date: "24. April 2020", sortingDate: "2020-04-23", title: "Globaler Klimastreik #FightEveryCrisis #NetzstreikFürsKlima", description: "Um die Ausbreitung des Corona-Virus zu reduzieren, um Menschen zu schützen und unsere Gesundheitssysteme zu entlasten streiken wir digital und im Netz", url: "https://fridaysforfuture.de/netzstreikfursklima/", }, { date: "Mai 2020", sortingDate: "2020-05-03", title: "#WirBildenZukunft", description: "Wir organisieren in den Tagen und Wochen des Lockdowns Livestreams zur Klima-Gesellschafts-Krisen-Bildung!", url: "https://fridaysforfuture.de/wirbildenzukunft/", }, { date: "Seit 2020", sortingDate: "2020-05-20", title: "#WirFahrenZusammen", description: "Die aktuelle Politik verhindert, dass wir klimafreundlich und günstig unterwegs sein können. So kann es nicht weitergehen.", url: "https://fridaysforfuture.de/oepnv/", }, { date: "Seit 2020", sortingDate: "2020-06-01", title: "Klimacamps", description: "In einem Klimacamp geht vieles, was auf Demos nicht so geht: Im Zeltlagern ist Raum für Workshops zu Themen rund ums Klima, für Vernetzung und neue Begegnungen.", url: "https://fridaysforfuture.de/klimacamps/", }, { date: "2. Juni 2020", sortingDate: "2020-06-02", title: "#KlimazielStattLobbydeal", description: "Wir streiken für ein gerechtes und nachhaltiges Konjunkturpaket. Denn wenn die Politik über Wirtschaftshilfen in Millionenhöhe verhandelt, müssen diese müssen nachhaltig sein.", url: "https://fridaysforfuture.de/bailout/", }, { date: "14. August 2020", sortingDate: "2020-08-14", title: "Aktionstag Datteln IV", description: "Wir haben gemeinsam mit Aktivist*innen aus ganz Europa dezentral in 35 Städten aus 13 Ländern vor finnischen Botschaften und Konsulaten gegen das Kraftwerk Datteln IV demonstriert.", url: "https://fridaysforfuture.de/aktionstag-datteln-iv/", }, { date: "13. September 2020", sortingDate: "2020-09-13", title: "#NRWähltKlima", description: "In Nordrhein-Westfahlen sind Kommunalwahlen – wir machen die Wahl zur Klimawahl", url: "https://fridaysforfuture.de/nrwwaehltklima-lasst-uns-die-kommunalwahl-zur-klimawahl-machen/", }, { date: "25. September 2020", sortingDate: "2020-09-25", title: "Globaler Klimastreik #KeinGradWeiter", description: "Die Klimakrise macht keine Pause! Für starke EU-Klimaziele, einen Kohleausstieg bis 2030 und eine sozial-ökologische Wende gehen wir gemeinsam auf die Straßen!", url: "https://fridaysforfuture.de/keingradweiter/", }, { date: "4. Oktober 2020", sortingDate: "2020-10-04", title: "Rettet den Danni", description: "Der Dannenröder Forst, ein Wald im Vogelbergkreis, ist durch die fatale Klimapolitik von Verkehrsminister Andreas Scheuer und der hessischen Landesregierung gefährdet. Gemeinsam sagen wir: Wald statt Asphalt!", url: "https://fridaysforfuture.de/rettet-den-danni/", }, { date: "Oktober 2020", sortingDate: "2020-10-13", title: "Die 1,5°C-Studie", description: "Fast zwei Jahre nach dem Beginn der Schulstreiks ist Klima eines der größten Themen in Gesellschaft und Politik. Gleichzeitig gibt es keine Partei, die einen Plan für 1,5-Grad-Politik hat. Deswegen haben wir das Wuppertal Institut beauftragt, die erste Studie durchzuführen, die untersucht, wie ein gerechter Beitrag Deutschlands zu 1,5 Grad aussieht.", url: "https://fridaysforfuture.de/studie/", }, { date: "11. Dezember 2020", sortingDate: "2020-12-11", title: "#FightFor1Point5", description: "Fünf Jahre nach dem Pariser Klimaabkommen ist klar: bis aus Worten Taten folgen, ist es ein langer Weg. Aber wir haben keine Zeit mehr! Das Klima verhandelt und wartet nicht!", url: "https://fridaysforfuture.de/fightforonepointfive/", }, { date: "2021", sortingDate: "2021-01-01", title: "Superwahljahr 2021", description: "Neben der Bundestagswahl im Herbst gibt es dieses Jahr in vielen Regionen auch noch Landtags- oder Kommunalwahlen. Es ist klar: Jede Stimme fürs Klima zählt!", url: "https://fridaysforfuture.de/wahlen/", }, { date: "19. März 2021", sortingDate: "2021-03-19", title: "Globaler Klimastreik #NetzstreikFürsKlima #AlleFür1Komma5 #NoMoreEmptyPromises", description: "In Zeiten einer globaler Pandemie ist es uns an vielen Stellen nicht möglich, gemeinsam auf die Straße zu gehen. Trotzdem werden wir präsent sein. In vielen Städten gibt es vielseitige, coronakonforme Aktionen!", url: "https://fridaysforfuture.de/allefuer1komma5/", }, { date: "29. April 2021", sortingDate: "2021-04-29", title: "Klimaklage", description: "Teile des Klimaschutzgesetzes der Bundesregierung wurden in Karlsruhe für verfassungswidrig erklärt.", url: "https://fridaysforfuture.de/eil-retten-die-grundrechte-unsere-zukunft/", }, { date: "Juni 2021", sortingDate: "2021-06-06", title: "#Aufbruchsklima", description: "Landtagswahlen in Sachsen-Anhalt. Das heißt: Klimawahlen in Sachsen-Anhalt", url: "https://fridaysforfuture.de/aufbruchsklima-landtagswahlen-in-sachsen-anhalt/", }, { date: "24. September 2021", sortingDate: "2021-09-23", title: "Globaler Klimastreik #AlleFürsKlima", description: "Another world is possible - eine bessere Welt ist möglich! Das haben wir in über 471 Orten unter dem Motto #AlleFürsKlima deutlich gemacht", url: "https://fridaysforfuture.de/allefuersklima/", }, { date: "September 2021", sortingDate: "2021-09-26", title: "Bundestagswahl 2021", description: "Die Bundestagswahl haben wir zur Klimawahl gemacht", url: "https://fridaysforfuture.de/wahlen/bundestagswahl/", }, { date: "26. September 2021", sortingDate: "2021-09-26", title: "Landtagswahlen in Mecklenburg-Vorpommern", description: "Wir müssen jetzt Druck auf Politiker*innen ausüben und die Menschen wählen, die Verantwortung in der Klimakrise übernehmen.", url: "https://fridaysforfuture.de/wahlen/mecklenburg-vorpommern/", }, { date: "Oktober 2021", sortingDate: "2021-10-20", title: "100-Tage-Forderungen", description: "Wir stellen Forderungen an die ersten 100 Tage der neuen Regierungskoalition", url: "https://fridaysforfuture.de/forderungen/100-tage/", }, { date: "22. Oktober 2021", sortingDate: "2021-10-22", title: "Ihr lasst uns keine Wahl!", description: "Bundesweiter Zentralstreik in Berlin. Aus ganz Deutschland reisen wir nach Berlin, um uns mit einem bunten, großen, und widerständigen Klimastreik unüberhörbar in die Koalitionsverhandlungen einzumischen!", url: "https://fridaysforfuture.de/ihr-lasst-uns-keine-wahl/", }, { date: "3. März 2022", sortingDate: "2022-03-03", title: "Stand with Ukraine", description: "Weltweit gehen wir für ein Ende des Krieges Putins gegen die Ukraine auf die Straße.", url: "https://fridaysforfuture.de/stand-with-ukraine/", }, { date: "25. März 2022", sortingDate: "2022-03-05", title: "Globaler Klimastreik #ReichtHaltNicht", description: "Es ist Krieg in Europa und wir rufen zum Streik auf. Für den Frieden und für Klimagerechtigkeit.", url: "https://fridaysforfuture.de/reichthaltnicht/", }, { date: "23. September 2022", sortingDate: "2022-09-23", title: "Globaler Klimastreik #PeopleNotProfit", description: "Klimakatastrophen werden immer häufiger und verursachen unvorstellbares Leid. Unter dem Motto #PeopleNotProfit fordern wir, dass die Politik nicht mehr länger Konzerninteressen über Menschenleben stellt!", url: "https://fridaysforfuture.de/klimastreik-2022/", }, { date: "Januar 2023", sortingDate: "2023-01-14", title: "#LütziBleibt", description: "Unter dem Motto #LütziBleibt rufen wir überall in Deutschland zu Streiks auf, um eine sofortige und energische Energiewende und eine Politik, die nicht länger Konzerninteressen über Menschenleben stellt, zu fordern. Wir verteidigen Lützerath. Am 14.1. reisen aus über 60 Orten Aktivist*innen zur großen Demonstration am Tagebau an!", url: "https://fridaysforfuture.de/lutzerath/", }, { date: "Januar 2023", sortingDate: "2023-01-31", title: "Wissings Autowahn", description: "Fridays for Future fordert von der Ampel ein Autobahnmoratorium. Der de-facto Boykott der Klimaziele durch Verkehrsminister Wissing gefährdet die Einhaltung jeglicher Klimaversprechen Deutschlands.", url: "https://fridaysforfuture.de/autowahn/", }, { date: "3. März 2023", sortingDate: "2023-03-03", title: "Globaler Klimastreik #TomorrowIsTooLate", description: "Wir gehen im ganzen Land und weltweit auf die Straße, weil nur unser gemeinsamer Druck den Klima-Stillstand in der Koalition noch beenden kann.", url: "https://fridaysforfuture.de/globaler-klimastreik/", }, { date: "27. März 2023", sortingDate: "2023-03-27", title: "Wir Streiken Zusammen", description: "Am 3. März war ver.di mit uns auf der Straße. Heute streiken wir solidarisch mit ver.di in über 20 Städten!", url: "https://fridaysforfuture.de/wirfahrenzusammen-27-maerz/", }, { date: "8.-12. August 2023", sortingDate: "2023-08-08", title: "Sommerkongres'
year_published = 2025
