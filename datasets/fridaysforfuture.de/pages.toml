["https://fridaysforfuture.de/ortsgruppen/ulm"]
title = "Fridays for Future Ulm / Neu-Ulm | Fridays for Future"
description = "Kontakt: ulm@fridaysforfuture.is Fridays for Future gibt es auch in Ulm und Neu-Ulm. Seit Januar 2019 demonstrieren wir für Klimagerechtigkeit und bieten immer wieder verschiedene Aktionen zum diesem Thema an: Von Kundgebungen über Diskussionsrunden bis Müll sammeln. Wir setzen uns für möglichst umfassende, schnelle und effiziente Klimaschutzmaßnahmen ein, um das auf der Weltklimakonferenz in Paris"
full_description = "ULM / Neu-Ulm Kontakt: ulm@fridaysforfuture.is Fridays for Future gibt es auch in Ulm und Neu-Ulm. Seit Januar 2019 demonstrieren wir für Klimagerechtigkeit und bieten immer wieder verschiedene Aktionen zum diesem Thema an: Von Kundgebungen über Diskussionsrunden bis Müll sammeln. Wir setzen uns für möglichst umfassende, schnelle und effiziente Klimaschutzmaßnahmen ein, um das auf der Weltklimakonferenz in Paris 2015 im Weltklimaabkommen beschlossene 1,5-Grad-Ziel der Vereinten Nationen noch einhalten zu können. Eine stärkere Erwärmung ist weder sozial verträglich noch (generationen-)gerecht. Spenden Bei unseren Demonstrationen entstehen immer wieder größere und kleinere Kosten. Über eine Spende würden wir uns sehr freuen. Aktuell sind wir mit Umstrukturierung beschäftigt, was auch unser Spendenkonto betrifft. Bei Spendeninteresse kontaktiern Sie uns gerne über unsere E-Mail Adresse ulm@fridaysforfuture.isHinweis: Wir sind kein gemeinnütziger Verein und dürfen euch keine Spendenbescheinigung ausstellen. FOrderungen 2025 2024 war ein Klima-Katastrophenjahr. Die Klimakrise ist hier und jetzt. Wir spüren sie überdeutlich und wissen, dass sie in Zukunft nur noch schlimmer wird. Wie schlimm, das zu entscheiden, steht noch in unserer Macht. Wir haben keine Zeit, auf die Apokalypse zu warten, bis wir endlich handeln. Das sagen wir schon seit sechs Jahren und das war immer richtig. Heute aber ist es wichtiger denn je. Das muss auch der nächsten Bundesregierung klar sein. Deshalb haben wir folgende Forderungen aufgestellt: Forderungen Klimaneutralität bis 2035 Einen klaren Plan für den geordneten Gasausstieg bis 2035 Eine Mobilitäts- und Wärmegarantie für alle Superreichensteuer zur Finanzierung der Transformation Ein Fonds für den Schutz vor den schlimmsten Folgen der Klimakrise. Eine Ausbildungsoffensive für jährlich 300.000 Menschen in Zukunftsbranchen mit fairen Löhnen und guten Arbeitsbedingungen. Näheres zu den Forderungen findet ihr auf der FFF Deutschland Seite. Aktuelle Aktionen Wir müssen reden! Junger Aktivismus, Klimakrise, soziale Gerechtigkeit und Politik – wie hängt das überhaupt mit uns zusammen? Was: Talks for Future (Radiosendung)Wann: alle 4 Wochen donnerstags, 17-18 Uhr Nächster Termin: 13.03.2025Wo: Radio free FM (102,6 MHz)Letze Sendung: RadioFreeFm Helfer:innengruppen Ihr wollt uns bei zukünftigen Aktionen helfen? Dann kommt in unsere Helfer:innengruppen. Dort gibt’s direkte Infos, wann z.B. das Aufbauen oder Abbauen losgeht. Wir freuen uns auf euch: WhatsApp Telegram Signal Gemeinsam machen wir Ulm und Neu-Ulm klimaneutral! Das Bündnis Klimaentscheid hat ein Bürger:innen-Begehren auf den Weg gebracht, das Ulm und Neu-Ulm bis 2030 klimaneutral werden lässt. Weitere Informationen und wo ihr unterschreiben könnt, findet ihr hier:https://klimaentscheid-ulm.de/Wenn ihr auch sonst nichts verpassen wollt, dann schreibt eine Mail an kontakt@klimaentscheid-ulm.de und werdet Teil unseres Verteilers! Vergangene Aktionen OB WAHL 01.12.23 GLOBALER STREIK 15.09.23 WISSING AKTION 18.07.23 ULMWELTWOCHE 23.06.23 RADDEMO 03.06.23 EARTH HOUR 25.03.23 GLOBALER STREIK 03.03.23 GLOBALER STREIK 23.09.22 GLOBALER STREIK 25.03.22 GLOBALER STREIK 24.09.21 PODIUMSDISKUSSION 03.09.21 AUFBRUCHSKLIMA 18.06.21 24-STUNDEN-AKTION 19.03.21 KLIMACAMP 10.09. – 02.11.20 DEMONSTRATION 25.09.20 NETZSTREIK 24.04.20 DEMONSTRATION 29.11.19 DEMONSTRATION 24.05.19 Globaler Streik – 03.03.23 Am 3. März waren wir in Ulm unter dem Motto #TomorrowIsTooLate mit 1000 Menschen auf der Straße – inklusive Musik von „Tomorrow In Your Hands“ und Reden von den Psychologists for Future, Jugend aktiv in Ulm und der Letzten Generation. Einen Rückblick zur Demo findet ihr hier: Rückblick globaler Klimastreik 03.03.2023 (FFF Ulm/Neu-Ulm x Tomorrow In Your Hands) – YouTube Presseartikel Schwäbische – Mehr als 1000 Menschen demonstrieren in Ulm für KlimaschutzWeltweit haben am Freitag Menschen für mehr Klimaschutz demonstriert. In Ulm gingen mehr als 1000 Demonstranten auf die Straße. Das waren ihre Forderungen. Artikel lesen SWR Aktuell – „Fridays for Future“: rund 400 Demonstrierende in UlmIm ganzen Land sind am Freitag Aktivisten und Aktivistinnen von „Fridays for Future“ auf die Straßen gegangen. Demonstrationen gab es auch in Ulm und Heidenheim. Artikel lesen Südwest Presse – Beats und Tanz: Hunderte bei Demo auf dem MünsterplatzGut gefüllt war der Münsterplatz am Freitagnachmittag bei der Demo von Fridays For Future. Was die Klimaaktivisten forderten. Artikel lesen Südwestpresse – In Ulm gehen 6000 Demonstranten für den Klimaschutz auf die StraßeTausende Schüler, Studenten, Eltern und Großeltern sind am Freitagnachmittag in Ulm für einen besseren Klimaschutz auf die Straße gegangen. Artikel lesen Regeln für Aktionen Hier findet ihr alle wichtigen Regeln für unsere Aktionen. Download (aktualisiert am 27.07.2023)"
