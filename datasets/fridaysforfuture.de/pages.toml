title = "| Fridays for Future"
description = "Fridays for Future Baden-Württemberg stellt Forderungen an Landesregierung."
full_description = "Unsere Forderungen zur Landtagswahl Wir streiken, bis ihr handelt:Die Klimakrise ist die größte Bedrohung der menschlichen Zivilisation. Als Fridays for Future-Bewegung streiken wir nun bereits seit drei Jahren, doch die Politik ruht sich weiterhin auf Symbolpolitik aus. Das Land Schleswig-Holstein hat bis heute seine Klimaziele nicht an die völkerrechtlich verbindlichen Ziele des Pariser Klimavertrags angepasst. Gemäß den Berechnungen des Sachverständigenrat für Umweltfragen dürfte Deutschland für 1,5 Grad nur noch 4,2 Gt CO2-Äquivalente ausstoßen – Schleswig-Holstein ab 2020 dann runtergerechnet nur noch ca. 147 Mt CO2-Äquivalente. Wie das vorgeschlagene Budget konkret eingehalten werden soll, zeigen wir in unserem Forderungspapier auf. Wir möchten alle Entscheidungstragenden der Landespolitik daran erinnern, dass Sie sich auch persönlich und bewusst mit ihrer Amtsübernahme dazu verpflichtet haben, die Lebensgrundlagen für zukünftige Generationen aufrecht zu erhalten. Diese Internetseite bietet lediglich einen Einblick in unser Forderungspapier. Bei veränderter Erkenntnislage behalten wir uns auch vor, Änderungen vorzunehmen. Download: Unsere Forderungen zur Landtagswahl Der Weg bis 2035 Anhebung der Klimaschutzziele:Klimaneutralität bis 2035. Festschreibung eines Restbudgets von 147 Mt CO2 äq, gemessen ab 2020. Es gibt nicht nur einen Weg zur Erreichung der Pariser Klimaziele. Aber andere Wege, die ebenfalls zum Ziel kommen mögen, werden unseren Forderungen in entscheidenden Punkten folgen oder stark ähneln müssen. Bis 2035 fordern wir in Schleswig-Holstein: 100 TWh Strom aus Wind an Land und PhotovoltaikStromnetze für 100 TWh Strom aus Wind auf See in Bundesgebieten25 TWh erneuerbare Energien aus anderen Quellen (biogene Reststoffe, Solarthermie, Tiefen-Geothermie u.a.) In unserem Forderungspapier führen wir Zwischenziele für 2025 und 2030 auf, die auch Treibstoff- und Wärmeenergiegewinnung abdecken. Download: Unsere Forderungen zur Landtagswahl Rahmenbedingungen für gute Klimapolitik Voraussetzung für eine gute Klimapolitik ist ein gutes Monitoring. Damit die Treibhausgasemissionen besser erfasst werden können, soll neben dem Inventarbericht an den UNFCCC eine zusätzliche, genauere Treibhausgasbilanz geführt werden, die für die Bewertung der nötigen Klimaschutzmaßnahmen besser geeignet ist („Dual Accounting“). Klimaschutz, Generationengerechtigkeit und Energiewende sollen als einklagbare Rechte in die Landesverfassung aufgenommen werden. Für zukünftige Gesetze und Entscheidungen der Landesregierung und Landesverwaltung soll eine Prüfung auf Klimaverträglichkeit unter Hinzuziehung unabhängiger Wissenschaftler*innen verpflichtend und Haushalt und Finanzen grundlegend umgebaut werden. Das Land und Betriebe mit Landesbeteiligung sollten alle verbliebenen klimaschädlichen Investitionen beenden und in Klimaschutz investieren. Dafür sollen sowohl Fördertöpfe als auch Mittel aus dem eigenen Haushalt in klimaschützende Technologien und Maßnahmen fließen oder Unternehmen unterstützen, die sich auf den Weg der Klimaneutralität bis 2035 begeben. Für die Wirtschaft soll die Entwicklung hin zu einer Kreislaufwirtschaft und Gemeinwohl-Ökonomie handlungsleitend sein. Entsprechend sollen Gemeinwohl-Bilanzierung oder andere alternative Metriken (im Gegenüber etwa zum BIP) sowie die Beachtung externalisierter Kosten in die Arbeit des Landesrechnungshofs integriert werden. Wichtige Maßnahmen zur Umsetzung Zur Finanzierung der Maßnahmen müssen ab sofort 100 % der Gelder aus EFRE und ELER sowie mindestens 5 % des Landeshaushaltes in direkten Klimaschutz investiert werden! Diese Gelder sollen nur für Nullemissionstechnologien auf Basis erneuerbarer Energien und den Aufbau von CO2-Senken ausgegeben werden, die Negativemissionen erreichen. Dieser Anteil ist regelmäßig zu überprüfen und bei absehbarem Nichterreichen der klimapolitischen Ziele anzuheben. Bildung Energie Mobilität Bauen Landwirtschaft Bildung, Ausbildung und Öffentlichkeit Bildungs- & Ausbildungsoffensive:In allen Bildungs- und Aubildungseinrichtungen, Unternehmen und Betrieben müssen alle notwendigen Kompetenzen für die klimaneutrale Wirtschaft von heute vermittelt werden. Weil uns nur noch 15 Jahre für den Weg zur Klimaneutralität bleiben, müssen wir flächendeckend bereits heute Menschen für die klimaneutrale Wirtschaft von morgen bilden und ausbilden. Wo es grundsätzlicher an geeigneten Fachkräften mangelt, etwa im Bereich der städtebaulichen Planung oder des Handwerks, ist zu prüfen, wie diese Berufe attraktiver gemacht werden können. Auch Politiker*innen, Ministerien, staatliche und halbstaatliche Einrichtungen wie Museen müssen über die Dringlichkeit der Klimakatastrophe und ihre Lösungen aufklären. Dazu bedarf es einer umfassenden Öffentlichkeitsarbeit, in Form von Kampagnen und öffentlichen Informationszentren. Weitere konkrete Maßnahmen sind in unserem Forderungspapier aufgeführt. Download: Unsere Forderungen zur Landtagswahl Energie Anpassung der Ausbauziele bis 2025 und 2030:Der Ausbau der erneuerbaren Energien ist die wichtigste politische Stellschraube für das Tempo von Energiewende und Klimaschutz. Deshalb gilt: Erneuerbare Energien stehen im öffentlichen Interesse. Das muss auch rechtlich verankert werden. Um die Pariser Klimaziele einzuhalten, muss bis 2035 ein Anteil von 100 % erneuerbare Energien in den Sektoren Strom, Wärme, Verkehr erreicht werden. Dafür ist ein Stopp des LNG-Terminals, des Autobahnausbaus und aller direkten oder indirekten fossilen Subventionen essentiell. Schleswig-Holstein ist außerdem das Bundesland mit dem größten wirtschaftlichen Potential und den besten Standorten für Windenergie. Es ist darum umso wichtiger, diese günstige Position zu nutzen, um durch Energieexporte unseren Beitrag zum Kohleausstieg und der Versorgung des Ballungszentrums Hamburg zu leisten. Entscheidende Rollen zur Erreichung der nötigen Energiewende spielen der Ausbau der Wind- und Solarenergie. Wir fordern daher unter anderem, 3 % der Landesfläche für die Windkraft auszuweisen und die Mindestabstände von Windrädern zu Siedlungen auf 600 m zu reduzieren. Außerdem muss überflüssige Bürokratie abgebaut werden! Weitere konkrete Maßnahmen, zum Beispiel auch zur Nutzung von Wasserstoff und Kohlenwasserstoffen sowie zur Unterstützung der Kommunen durch das Land, sind in unserem Forderungspapier aufgeführt. Download: Unsere Forderungen zur Landtagswahl Mobilität Investitionen in Bahnverkehr und ÖPNV:Die Verkehrswende ist nur zu schaffen, wenn weniger Strecken durch motorisierten Individualverkehr zurückgelegt werden. Eine Schlüsselrolle kommt dabei der Verbesserung des öffentlichen Personennahverkehrs zu. Emissionsreicher und ineffizienter Individualverkehr wird immer noch staatlich gefördert, oft gegenüber anderen Mobilitätsformen bevorzugt und zu einer kulturellen Identität stilisiert. Die dringend notwendige Elektrifizierung des Verkehrs erreicht immer noch nicht das nötige Tempo. Bisher schneidet Schleswig-Holstein im bundesweiten Schnitt besonders schlecht ab, steht etwa bei der Elektrifizierung der Schiene bundesweit an letzter Stelle. Neben einer Neuverteilung des Straßenraums soll auch der motorisierte Individualverkehr entsprechend eingeschränkt werden. Dies ist nicht nur in Bezug auf Klimaschutz wichtig, sondern erhöht auch die Lebensqualität. Der verstärkte Einsatz kleiner Anrufsammeltaxen, die auf niedrig frequentierten Strecken ohne gute ÖPNV-Anbindung von der Haustür biszum Zielort oder dem nächsten Verkehrsknotenpunkt fahren, und die Einführung eines landesweiten 1-Euro-Pro-Tag-Tickets wären wichtige Schritte in die richtige Richtung. Weitere konkrete Maßnahmen, zum Beispiel auch zum Ausbau der Radinfrastruktur, sind in unserem Forderungspapier aufgeführt. Download: Unsere Forderungen zur Landtagswahl Bauen Grundlegendes Umdenken beim Bauen:In Bau, Instandhaltung und Beheizung unserer vier Wände steckt eine große Menge Energie und Rohstoffen, mit denen Treibhausgasemissionen verbunden sind. Gebäude müssen zukünftig vorausschauend und langlebig geplant, gebaut und saniert werden. Die energetische Sanierung von Gebäuden ist mit < 1 % pro Jahr deutlich zu niedrig. Nötig wäre stattdessen eine Sanierungsquote von 4 % pro Jahr wofür neben einer verbesserten Förderung insbesondere neue Fachkräfte gewonnen werden müssen. Gleichzeitig hat der Ausbau des Wohnraums und die Nutzung von Immobilien als finanzielle Spekulationsobjekte alle bisherigen Effizienzeinsparungen zunichte gemacht. Darüber hinaus muss auch zum Schutz vor Starkregen und Überschwemmungen sowie für den Erhalt der Biodiversität die Flächenversiegelung verringert werden. Insgesamt sollten die Leitkonzepte Suffizienz, Konsistenz und Effizienz in der Landesbaupolitik in dieser Reihenfolge vorherrschen: Insgesamt weniger (neu) bauen und neu versiegeln, anstelle dessen mehr platzsparendes Wohnen fördern, darüber hinaus die Verwendung alternativer, klimaschonender Baustoffe vorantreiben und den Bauvorgang selbst sowie den Energie- und Wärmehaushalt von Gebäuden effizient gestalten. Weitere konkrete Maßnahmen, zum Beispiel auch zur Unterstützung von Hausbesitzenden, sind in unserem Forderungspapier aufgeführt. Download: Unsere Forderungen zur Landtagswahl Land- und Forstwirtschaft, Ernährung, Senkenaufbau Klimeneutrale Bedarfsdeckung und Neudenken der Landnutzung:Etwa 14 % der Treibhausgasemissionen in Schleswig-Holstein werden durch die Landwirtschaft verursacht. Land kann und muss anders genutzt werden, um die Emissionen in allen Sektoren auf Netto-Null zu senken. Zunehmende Wetterextreme sorgen für erhebliche Einschränkungen in der Landwirtschaft und steigende Lebensmittelpreise. Eine Fortführung des Status Quo in der Agrarpolitik würde die Vernichtung intakter Ökosysteme zur Folge haben und eine Fortsetzung der Massentierhaltung würde auch in Zukunft einen idealen Nährboden für Epidemien und Pandemien bieten. Um die Agrarwende nachhaltig, tragfähig und sozial gerecht zu gestalten braucht es einen Umbruch hinsichtlich der Bewirtschaftungsmethoden und einen Umbau der Verteilungs- und Organisationsformen. Vorrangiges Ziel der Agrarwende muss es sein, dass Bäuer*innen beim Umbau vom Land unterstützt werden und von ihrer für die Gesellschaft essentielle Arbeit gut leben können. Der Aufbau von Treibhausgassenken wie z.B. Waldflächen und Mooren ist inzwischen unumgänglich geworden, da auch bei sofortiger, vollständiger und internationaler Umsetzung aller notwendigen Schutzmaßnahmen Treibhausgase noch für lange Zeit ihre Wirkung entfalten. Wälder sind aber auch Holzlieferanten und Biodiversitätshotspots. Diese Funktionen müssen in den Wirtschaftswäldern Schleswig-Holsteins berücksichtigt werden, um den wachsenden Bedrohungen durch die Klimakrise mit krisenfesten Wäldern zu begegnen. Entscheidend für einen klimapositiven Forstbetrieb und für eine Bauwende sind zum einen hohe Holzvorräte und eine extensive Forstwirtschaft und zum anderen die Nutzung langlebiger Holzprodukte im Bau- und Möbelsektor und weniger energetische Holznutzung. Weitere konkrete Maßnahmen, zum Beispiel zu alternativen Anbaumethoden und Lebensmittelverschwendung, sind in unserem Forderungspapier aufgeführt. Download: Unsere Forderungen zur Landtagswahl"
