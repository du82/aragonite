description = "„Und jetzt?“ präsentiert alle Informationen über die Politik und ihre klimapolitischen Entscheidungen. Hier lest ihr von Klimagesetzten, unzureichenden Entscheidungen und vielleicht sogar die ein oder andere gute Nachricht."
full_description = "Jetzt erst recht – unsere Analyse! 21. Januar 202521. Januar 2025 von Zahra in Erzähl mal!, Gut zu wissen!, Neuigkeiten, Und jetzt? Die USA steigen unter Trump aus dem Pariser Abkommen aus – ein klarer Angriff auf unsere Zukunft. Ja, das ist schlimm. Ja, Klimaschutz voranbringen mit diesem Präsidenten wird hart. In den USA aber auch global. Aber: Wir dürfen jetzt nicht aufgeben. Warum, das erklärt unsere Autorin Zahra. Es kommt mir vor wie ein Fiebertraum: Donald Trump … Weiterlesen über „Jetzt erst recht – unsere Analyse!“! EU-Wahl: Die Analyse 12. Juni 202422. Juni 2024 von Linus in Erzähl mal!, Neuigkeiten, Und jetzt? Bei den Europa-Wahlen haben rechte Kräfte stark zugelegt. Populismus übertrumpfte Klimaschutz. Keine guten Zeichen. Aber was bedeutet die Wahl für unsere Zukunft? Unser Autor Linus zieht Bilanz. Man könnte denken: Dieser Wahlsonntag war ein schwarzer Tag für uns alle. Die AfD konnte in Deutschland in allen Altersgruppen stark zulegen, es gibt keine progressive Mehrheit im … Weiterlesen über „EU-Wahl: Die Analyse“! Mehr Bäume auf den Acker – Agroforstsysteme wirksam unterstützen! 2. Dezember 20232. Dezember 2023 in Gut zu wissen!, Neuigkeiten, Und jetzt? Die Landwirtschaft befindet sich im Kreuzfeuer zahlreicher unsere Gesellschaft bedrohenden Krisen, die einerseits durch den Status Quo der Landnutzung verstärkt werden und andererseits die Landwirtschaft selbst gefährden. Die Klima-, Umwelt- und Biodiversitätskrise, daraus resultierende Wasserknappheit, Überflutungen und Ernteeinbußen erlauben keinen Aufschub bei der Umsetzung aller Lösungsansätze, auf die wir bereits zurückgreifen können. Einer dieser Ansätze … Weiterlesen über „Mehr Bäume auf den Acker – Agroforstsysteme wirksam unterstützen!“! Verwässert und entkernt: Heizungs- & Klimaschutzgesetz in der Analyse 24. Juni 202324. Juni 2023 von Pit & Nicco in Gut zu wissen!, Neuigkeiten, Und jetzt? Die Ampelkoalition schlägt auf den Klimaschutz ein, wie auf einen Boxsack. In den vergangenen Wochen hat sie gleich zwei essentielle Gesetze für die deutschen Klimaziele entkernt. Das Heizungsgesetz ist nur noch ein Schatten seiner selbst und ermöglicht noch viele Jahre fossiles Heizen. Das Klimaschutzgesetz ist durch die de facto Abschaffung der Sektorziele um sein Herzstücks … Weiterlesen über „Verwässert und entkernt: Heizungs- & Klimaschutzgesetz in der Analyse“!"
