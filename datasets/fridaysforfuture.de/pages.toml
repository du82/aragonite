["https://fridaysforfuture.de/forderungen"]
title = "Forderungen | Fridays for Future"
description = "GlobalDeutschlandBundesländer Globale Forderungen Fridays for Future fordert Klimagerechtigkeit. 2015 haben sich alle UN-Staaten im Pariser Klimaschutzabkommen eigentlich dazu verpflichtet, leider passiert trotzdem viel zu wenig. Wir fordern, dass die Regierungen ihre Versprechen einhalten und uns eine krisenarme Zukunft ermöglichen. Dafür brauchen wir sofort einen sicheren Plan, um die globale Erwärmung auf unter 1,5°C im Vergleich"
full_description = "Forderungen GlobalDeutschlandBundesländer Globale Forderungen Fridays for Future fordert Klimagerechtigkeit. 2015 haben sich alle UN-Staaten im Pariser Klimaschutzabkommen eigentlich dazu verpflichtet, leider passiert trotzdem viel zu wenig. Wir fordern, dass die Regierungen ihre Versprechen einhalten und uns eine krisenarme Zukunft ermöglichen. Dafür brauchen wir sofort einen sicheren Plan, um die globale Erwärmung auf unter 1,5°C im Vergleich zum vorindustriellen Niveau zu begrenzen und die katastrophalen Auswirkungen der Klimakrise zu verhindern. Dabei ist es uns wichtig, neben Klimaschutz auch globale Gerechtigkeit für alle zu gewährleisten. Dafür müssen wir auf die wissenschaftlichen Erkenntnisse hören und uns hinter der Wissenschaft vereinen, um fundierte Entscheidungen zum Schutz unseres Planeten und damit der Zukunft der Menschheit zu treffen. Mehr Infos! Forderungen für Deutschland Von der Deutschen Regierung fordern wir ebenfalls die konsequente Einhaltung des Pariser Abkommens und des 1,5°C-Ziels. Die Bundesrepublik muss damit ihrer verfassungsmäßig definierter Verantwortung gegenüber zukünftigen Generationen gerecht werden. Wir setzen uns für einen Nettonull-Emissionsstatus bis 2035, den Kohleausstieg bis 2030 und eine 100% erneuerbare Energieversorgung bis 2035 ein. Dafür brauchen wir mehr Transparenz, faktenbasierte Aufklärung und die Einbeziehung junger Menschen in den demokratischen Prozess. Folgende Punkte müssen in Deutschland sofort umgesetzt werden: Nettonull 2035 erreichen Kohleausstieg bis 2030 100% erneuerbare Energieversorgung bis 2035 Das Ende der Subventionen für fossile Energieträger Eine CO2-Steuer auf alle Treibhausgasemissionen. Der Preis für den Ausstoß von Treibhausgasen muss schnell so hoch werden wie die Kosten, die dadurch uns und zukünftigen Generationen entstehen. Laut UBA sind das 180€ pro Tonne CO2 Zu den allgemeinen ForderungenFAQGlossar Forderungen 2025 Die Klimakrise ist hier und jetzt – und sie eskaliert. Während Hitzewellen, Überschwemmungen und Dürrekatastrophen unsere Lebensgrundlagen bedrohen, feuern Superreiche und fossile Konzerne die Klimakrise weiter an. FDP und CDU planen mit Rückschritten beim Klimaschutz, SPD und Grüne üben sich darin, Klimaschutz umzusetzen, aber es darf bloß keiner mitbekommen. Es fehlt eine Antwort, mit der wir der Klimakrise realistisch etwas entgegensetzen können. Das können und wollen wir nicht hinnehmen! Wir haben ein Recht auf Zukunft, und bezahlbarer Klimaschutz ist möglich – wenn wir es wollen. Doch statt sozial gerechte Lösungen voranzutreiben, werden soziale Fördergelder gekürzt und Klimakiller weiter subventioniert. Wir sagen: Schluss mit Realitätsverweigerung und leeren Versprechen! Es braucht endlich ehrliche Klimapolitik, die auf wissenschaftlichen Fakten basiert und alle Menschen mitnimmt. Deshalb fordern wir vor der Bundestagswahl 2025: Klimaneutralität bis 2035 Gasausstieg bis 2035 mit klarem Plan Besteuerung von Superreichen und fossilen Konzernen Eine Mobilitäts- und Wärmegarantie für alle Ein Fond für Klimaanpassung und Katastrophenhilfe Jährlich 300.000 neue Jobs für die Klimawende Zu den Forderungen! Hintergründe EU-Wahl 2024: Unsere Forderungen Vor der Europawahl 2024 sehen wir einen drohenden, anti-ökologischen Rechtsruck. Wir brauchen jetzt aber Fortschritt statt Blockade und Rückschritt. Deshalb fordern wir: Klimaschutz muss in der EU wieder Priorität werden. Das bedeutet unter anderem: den Ausstieg aus allen fossilen Energien bis 2035 beschließen und Klimainvestitionen bis 2030 mindestens verdoppeln! Zu den EU-Forderungen! Kohleausstieg im Osten Wir setzen uns gegen die Pläne des Kohlekonzerns LEAG zur weiteren Förderung von 700 Mio t Kohle aus der Lausitz ein und kritisieren die Verhandlungen zwischen der Regierung und dem Kohlekonzern. Es braucht keinen faulen Deal, der lediglich das Ausstiegsdatum vorverlegt, aber keine Emissionen einspart, sondern einen sozial gerechten Strukturwandel in der Region, der die Interessen der Menschen vor Ort über die der Konzerne stellt. Das zeigt auch eine 2023 von uns beauftragte Studie. Mehr Infos! 100 Milliarden für das Klima Im Jahr 2022 fordern wir die Einrichtung eines 100 Milliarden Euro schweren Sondervermögens, um die Klimakrise zu bewältigen und fossile Abhängigkeiten zu überwinden. Wir verlangen eine Energiegrundsicherung, um bezahlbare Energie für alle zu gewährleisten, sowie den sofortigen Ausbau erneuerbarer Energien. Zudem fordern wir die sofortige Wiedereinführung eines 0€-Tickets für den öffentlichen Nahverkehr und einen massiven Ausbau desselben. Schließlich verlangen wir von Deutschland, die zugesagte Klimafinanzierung für den Globalen Süden bereitzustellen. Zu den Forderungen! Landwirtschafts-Forderungen Die Landwirtschaft spielt eine entscheidende Rolle für Klimagerechtigkeit. Aktuell trägt die Landwirtschaft einen erheblichen Anteil zu den globalen Treibhausgasemissionen bei und leidet gleichzeitig stark unter den Auswirkungen der Erderhitzung. Doch ein Umbau der Landwirtschaft hin zu einer nachhaltigen und umweltfreundlichen Bewirtschaftung eröffnet enorme Chancen. Wir fordern 2022 deshalb explizit für den Landwirtschaftssektor: die externen Kosten der Landwirtschaft internalisieren, landwirtschaftliche und natürliche CO2-Senken fördern, die Nutztierhaltung besser gestalten, dabei Verbraucher*innen , Gesellschaft und Internationales nicht vergessen! Zu den Landwirtschaftsforderungen! 100-Tage-Forderungen Im Wahlkampf 2021 hat sich jede demokratische Partei zum 1,5°C-Ziel bekannt. Ausreichende Pläne zur Umsetzung dessen hat jedoch keine Partei vorgestellt. Deshalb fordern wir von der Ampel-Koalition in den ersten 100 Tagen ihrer Amtszeit, die richtigen Weichen zu stellen, um das 1,5°C-Ziel einhalten zu können. Zu den 100-Tage-Forderungen! Machbarkeits-Studie Es gibt immer noch keine Partei, die einen Plan für 1,5°C-Politik hat und keine Partei mit einem Plan, was die Einhaltung der 1,5-Grad-Grenze für Deutschland eigentlich bedeutet. Deswegen haben wir 2020 das Wuppertal Institut beauftragt, die erste Studie durchzuführen, die untersucht, wie ein gerechter Beitrag Deutschlands zu 1,5°C aussieht. Zur Studie! Bundesland-Forderungen Auch unsere Ortsgruppen in vielen Bundesländern fordern von den Landesregierungen konsequenten, schnellen und sozial gerechten Klimaschutz. Hier findest Du die lokalen Forderungen! Forderungen Niedersachsen Forderungen Baden-Württemberg Forderungen Berlin Forderungen Brandenburg Forderungen Bremen Forderungen Hamburg Forderungen Mecklenburg-Vorpommern Forderungen Sachsen Forderungen Thüringen Forderungen Sachsen-Anhalt Forderungen Schleswig-Holstein Noch Fragen? Schreib uns! .site-footer{margin-top: -2rem!important;} .entry-content, .entry-summary, .page-content { margin-top: -7.5em; }"
