["https://fridaysforfuture.de/neuigkeiten/page/3"]
title = "Neuigkeiten | Fridays for Future - Seite 3"
description = "Hier schreiben wechselnde Autor*innen der Klimagerechtigkeitsbewegung über das Klima, den Kampf für echten Klimaschutz und ihre Perspektiven auf eine klimagerechte Zukunft. In Interviews und Kolumnen geben wir Menschen eine Stimme, die oft kein Gehör finden. In Hintergrundartikeln bringen wir Dir die harten Fakten der Klimakrise näher und in unserem zweiwöchentlichen Klima-Update fassen wir zusammen, was klimapolitisch so passiert ist. Das und noch viel, viel mehr gibt es hier: im Fridays for Future-Blog! Dein Kontakt zur Redaktion: newsletter@fridaysforfuture.de - Seite 3"
full_description = "COP Daily – Was bisher geschah… 10. November 202410. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged 29 Weltklimakonferenzen, 29 Jahre lang ein regelmäßiges Treffen (fast) aller wichtigen Staaten nur zum Thema Klimapolitik – das klingt doch, als müssten wir die Klimakrise voll im Griff haben. Warum das nicht so ist, das lest ihr hier. Was ist bisher passiert? Zuallererst: Auf der COP werden zwar jedes Jahr viele Abmachungen, Ziele und Vereinbarungen … Weiterlesen über „COP Daily – Was bisher geschah…“! COP Daily – live aus Baku! 9. November 20249. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged Am 11. November beginnt die COP, die 29. Weltklimakonferenz. Hier, aber auch auf Instagram und Telegram wollen wir euch gemeinsam mit Fridays for Future Berlin inhaltlich mitnehmen, Ergebnisse zusammenfassen, einschätzen und Perspektiven bieten. Dafür sind wir im Kontakt mit verschiedenen zivilgesellschaftlichen Bündnissen und COP-Delegationen. Jeden Tag sammeln wir für euch die wichtigsten Informationen zusammen und … Weiterlesen über „COP Daily – live aus Baku!“! Ein starkes Zeichen für Klimagerechtigkeit – Rückblick auf den Klimastreik am 20. September 29. September 202429. September 2024 in Erzähl mal!, Neuigkeiten, Wir sind laut! Mit über 75.000 Menschen auf den Straßen, verteilt auf mehr als 110 Orte in Deutschland. Der Klimastreik am 20. September 2024 war ein starkes Signal und ein voller Erfolg. Eine Woche später hallen die Bilder und Eindrücke noch immer nach – die Menschenmengen, die Plakate, die lautstarken Forderungen nach Klimagerechtigkeit. Unser Autor Ole blickt zurück. … Weiterlesen über „Ein starkes Zeichen für Klimagerechtigkeit – Rückblick auf den Klimastreik am 20. September“! Brandenburg muss wählen! 19. September 202419. September 2024 von Ladina in Erzähl mal!, Gut zu wissen!, Neuigkeiten Am Wochenende wird in Brandenburg gewählt. Vor zwei Wochen wurde in Sachsen und Thüringen gewählt. Autorin Ladina zieht Bilanz und gibt einen Ausblick. Brandenburg muss wählen am 22. September 2024. Und es muss zukunftsgewandt wählen. Die Hoffnung, dass es schon irgendwie gehen wird reicht nicht mehr. Hat eigentlich noch nie gereicht, denn es geht um … Weiterlesen über „Brandenburg muss wählen!“!"
year_published = 2024
clearnet = "https://fridaysforfuture.de/neuigkeiten/page/3"
