["https://fridaysforfuture.de/cop-daily-ende-der-cop29"]
title = "COP Daily – Ende der COP29 | Fridays for Future"
description = "Am frühen Sonntagmorgen, um 4:38 Uhr, ging sie zu Ende - die 29. UN-Klimakonferenz (COP) in Aserbaidschan.Die ganze Nacht lang hatten die Diplomat*innen verhandelt und nach einer Verlängerung von über 30 Stunden wurde das Abschlussdokument mit dem Hammerschlag besiegelt. Dass es dazu noch kommt, hatten viele bezweifelt. Die Gräben zwischen den verschiedenen Parteien waren groß,"
full_description = "COP Daily – Ende der COP29 25. November 202425. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged Am frühen Sonntagmorgen, um 4:38 Uhr, ging sie zu Ende – die 29. UN-Klimakonferenz (COP) in Aserbaidschan.Die ganze Nacht lang hatten die Diplomat*innen verhandelt und nach einer Verlängerung von über 30 Stunden wurde das Abschlussdokument mit dem Hammerschlag besiegelt. Dass es dazu noch kommt, hatten viele bezweifelt. Die Gräben zwischen den verschiedenen Parteien waren groß, die Verhandlungen festgefahren. Selbst nach der Verhandlungen wurden noch wütende Reden geschwungen. Und das zurecht, denn der letztendlich beschlossene Deal ist traurig. Oder es mit den Worten Juan Carlos Monterrey Gómez, Delegierter Panamas, zu sagen: „Das bedeutet Tod und Elend für unsere Länder.“ Wie endet die diskussion um die finanzeirung? Ja, immerhin gibt es überhaupt eine Abschlusserklärung, das ist bei den vielen Auseinandersetzungen der vergangenen zwei Wochen wirklich ein Erfolg. Aber es ist ein schwacher Erfolg, denn die beiden großen Ziele, insgesamt 1,3 Billionen USD jährlich aufzutreiben und die Gruppe der Finanzierenden-Länder zu erweitern, sind gescheitert. Auf gerade mal 300 Milliarden USD pro Jahr konnte sich geeinigt werden. Dass es nun ein neues Finanzierungsabkommen gibt, ist wirklich wichtig, denn das alte Abkommen mit einer jährlichen Zahlung in Höhe von 100 Milliarden USD läuft 2025 aus. Allerdings sind 300 Milliarden angesichts der 1,3 Billionen, die ärmere Länder laut einem unabhängigen Expertengremium der UN brauchen, nur ein Tropfen auf den heißen Stein. Zu den Zahlungen sind nur die Industriestaaten verpflichtet, andere Länder, darunter die Golfstaaten und China, sind nur dazu „aufgerufen“, sich freiwillig an weiteren Zahlungen zu beteiligen. LOL. Außerdem sollen sich auch private Geldgeber*innen an den 300 Milliarden USD beteiligen. Das bedeutet: finanzielle Unterstützung darf auch in Form von Investitionen oder Kredite geleistet werden. Genau das wollten ärmere Länder aber von Beginn an nicht. Investitionen stärken vor allem die Wirtschaft der Geberländer und günstige Kredite treiben arme Länder noch weiter in die Verschuldung. Und damit nicht genug: die mickrige Finanzhilfe darf nur für Klimaschutz und Klimaanpassung genutzt werden. Das sind beides Bereiche, die wirtschaftlich interessant sind, weil sich unter ihrem Namen neue Projekte aufbauen lassen, durch die die Geber auch wieder an Geld kommen könnten. Wofür die 300 Milliarden USD nicht ausgegeben werden dürfen: Ausgaben, die durch Schäden hervorgerufen wurden, die die Klimakrise verursacht hat (Loss & Damage). Fällt also wegen einer Dürre die Ernte aus oder verlieren Menschen wegen einer Flut ihr zu Hause, müssen ärmere Länder das Geld für die Abdämpfung der Katastrophe größtenteils selbst auftreiben. Geld für Schäden bereitzustellen, ist für wirtschaftlich die Geberländer nicht profitabel. Die 1,3 Billionen USD werden im Abschlussbericht zwar als großes Zukunftsziel erwähnt, konkreter wird’s aber nicht mehr. Es ist gut, dass es die 1,3 Billionen als Ziel in die Abschlusserklärung geschafft haben. Ohne Vorschlag, wann und woher das Geld kommen soll, ist dieses Ziel vorerst maximal unrealistisch. Damit es nicht bei völlig leeren Worten bleibt, müssen die Industriestaaten jetzt dranbleiben und im Hinblick auf die COP30 in Brasilien ersten, den eigenen Haushalt nochmal checke und zweites darauf hinwirken, dass sich die Gruppe der Geberländer doch nochmal erweitert. Mit dem gesetzten Ziel der 1,3 Billionen gibt es zumindest ein Ziel, gibt es jetzt zumindest eine Basis für weitere Verhandlungen. Was bei der ganzen Finanzierungsfrage nicht vergessen werden darf: Die Industriestaaten haben historisch gesehen am meisten Treibhausgase ausgestoßen. Sie sind die Hauptverursacher für die Klimakrise, unter der jetzt die Länder, die am wenigsten Treibhausgase ausgestoßen haben, am meisten leiden. Die Zahlungen für die Klimafinanzierung sind deshalb kein nettes Geschenk der Industrienationen, “sondern eine rechtliche Verpflichtung”, betont ein Delegierter Boliviens. Dieser Verpflichtung bleiben die Industrienationen, China und die Golfstaaten den ärmeren Ländern schuldig. Was sonst so beschlossen wurde… Ausstieg aus den FossilenDrei wichtige Errungenschaften aus dem letzten Jahr von der COP28 in Dubai sind der Ausstieg aus Kohle, Öl und Gas, eine Verdreifachung des Ausbaus von erneuerbaren Energien und eine Verdopplung der Energieeffizienz bis 2030. Alle drei Ziele haben es nicht direkt bis ins Abschlussdokument geschafft, denn besonders Saudi-Arabien versuchte wohl, diese Einigungen aus dem letzten Jahr nicht in die diesjährige Erklärung gelangen zu lassen. Glücklicherweise gelang dieses Vorhaben nicht vollständig, denn obwohl die Ziele nicht direkt wiederholt wurden, wird in dem Dokument darauf verwiesen, dass die Beschlüsse weiterhin gelten, was immerhin kein inhaltlicher Rückschritt ist. KohlenstoffmärkteAlle Länder, die das Pariser Klimaabkommen unterschrieben haben, müssen alle fünf Jahre einen Plan vorlegen, wie sie die 1,5 Grad Grenze auf nationaler Ebene einhalten möchten. Zu den nationalen Klimaschutzplänen gehört natürlich auch, Emissionen zu reduzieren. Jetzt wurde auf der COP festgelegt, dass ein Land ein anderes Land für das Einsparen von Treibhausgasen bezahlen kann und die Einsparung dann auf das eigene Konto angerechnet werden darf. So könnte beispielsweise Qatar im eigenen Land nicht viel für Klimaschutz tun, stattdessen aber Kolumbien dafür bezahlen, dass dort Wald gepflanzt wird und könnte so trotzdem seine Klimaziele einhalten. Ihr merkt schon – da ist ein Haken dran, denn Qatar würde in unserem Beispiel ja immer noch ganz viel Treibhausgase in die Atmosphäre schleudern. Für solche Regelungen gibt es einen Fachbegriff: Greenwashing. Lima-ProgrammDas Lima-Programm stellt Frauen in den Fokus, denn Frauen sind von der Klimakrise stärker betroffen als Männer. Das hängt mit sozialen, wirtschaftlichen und kulturellen Gründen zusammen. Um diese genau zu erklären, bräuchte es einen extra Artikel. Deshalb hier nur in aller Kürze: Frauen sind häufiger von Armut betroffen als Männer und sie haben oft auch einen schlechteren Zugang zu wichtigen Ressourcen wie Bildung oder Technologie. Durch diese Ungleichheit können sich Frauen nicht so gut vor der Klimakrise schützen und können sich auch nicht so einfach an ihre Folgen anpassen.Das Programm wurde vor zehn Jahren auf der COP in Lima verabschiedet und läuft dieses Jahr aus. Saudi-Arabien, der Vatikan und Russland hatten versucht, eine Verlängerung des Programms zu verhindern. Glücklicherweise haben sich andere Partein durchgesetzt und das Programm wurde so um weitere zehn Jahre verlängert. Wie geht’s jetzt weiter? Es muss es jetzt weitergehen in der Klimadiplomatie. Die COP ist und bleibt der Ort, an dem Klimaschutz international verhandelt wird. Und alle Menschen, die jetzt gerne sagen: “Internationaler Klimaschutz funktioniert nicht, jetzt haben wir wieder einen Kompromiss, bei dem China und co. gar nicht mitzahlen. Warum soll Deutschland dann überhaupt Klimaschutz vorantreiben?”, dem sagen wir ganz entschieden: “Weil dann genau das passiert, was wir in den letzten Tagen in Baku gesehen haben. Wenn Deutschland nicht entschlossen vorangeht, dann können wir China und die Golfstaaten auch nicht dazu zwingen mitzuziehen.” Deutschland muss seine internationale Verantwortung wahrnehmen und das geht nur, wenn wir mit gutem Beispiel vorangehen. In 54 Wochen steht die nächste COP in Brasilien an. Die Hoffnung bleibt, dass auf dieser COP das Klimafinanzierungsziel nochmal neu aufgerollt wird uns wir den 1,3 Billionen ein Stück näher kommen. Denn die kommende COP findet (endlich mal) nicht in einem Autoritären Ölstaat statt, sondern in einem Land, dass zwar wirtschaftlich stark, aber dennoch von der Klimakrise außerordentlich betroffen ist. Klar, der Kampf gegen die Klimakrise ist ein Kampf gegen die Zeit und ein Jahr warten zu müssen, sind dahingehend keine rosigen Aussichten, gerade wenn der US-Präsident dann Donald Trump heißen wird. Und trotzdem, manches (wenn auch weniges) gibt Grund für Optimismus. Obwohl Saudi-Arabien sich jetzt als großer Blockierer am Verhandlungstisch gezeigt hat – China zeigt sich international etwas kooperationsbereiter als noch vor einigen Jahren. Sie sind potenziell gerne bereit, die Macht-Lücke zu füllen, die die USA in der internationalen Klimadiplomatie hinterlassen werden. Außerdem ist hat es das Ziel von 1,3 Billionen zumindest in die Abschlusserklärung geschafft. Auch wenn es aktuell unwahrscheinlich scheint, dass das Geld jemals zusammenkommt, ist davon auszugehen, dass bei der nächsten COP die Frage nochmal aufgerollt wird, ob und wie viel andere Länder zum Geldtopf beitragen. Das Thema Klimafinanzierung wird nach dieser COP auf jeden Fall nicht vollkommen beendet sein. Was kann ich tun? Tja, diese Frage lässt sich nicht einfach beantworten. Klar ist: Die Ergebnisse der diesjährigen UN-Klimakonferenz sind bei Weitem nicht ausreichend – so lässt sich die 1,5 Grad Grenze nicht einhalten. Wenn diese Grenze nicht eingehalten wird, ist das nicht nur schade für die armen Eisbären, die dann kein Eis mehr haben. Nein, wenn diese Grenze nicht eingehalten wird, kostet das Menschenleben. Klimaschutz ist kein “nice to have”, Klimaschutz ist die Basis für das Fortbestehen unserer Zivilisation. Die Klimakrise lässt Lebensmittelpreise steigen, treibt Menschen in die Flucht, verursacht Kriege und tötet Menschen. Auf Klimaschutz können wir also nicht verzichten.Was also, wenn die Delegierten von 197 Ländern es nicht schaffen, einen Kompromiss zu vereinbaren, der das Klima – und somit uns – ausreichend schützt? Dann sind wir gefragt. Der Kampf für eine lebenswerte Welt findet nicht nur auf den Klimakonferenzen statt, sondern vor allem in den 50 Wochen, die zwischen den Konferenzen liegen. Auch diese Zeit sieht nicht rosig aus. Trump wird aus dem Pariser Klimaabkommen aussteigen, rechte, die Klimakrise leugnende Parteien gewinnen in vielen Ländern an Beliebtheit und dank der COP29 werden viele arme Länder nicht genug Geld haben, sich an die Klimakrise anzupassen.Echt miese Aussichten, da kann man leicht die Hoffnung verlieren. Wozu das ganze Spektakel der COP? Lohnt sich das überhaupt noch? Diese Fragen sind berechtigt, aber wenn wir jetzt aufgegeben, machen wir genau das, wovon die fossile Lobby träumt. Nein, diese Freude wollen wir ihnen nicht gönnen. Gerade in Deutschland lohnt es sich jetzt richtig Druck zu machen, denn in drei Monaten ist Bundestagswahl. Auf der COP werden internationale Richtlinien für Klimaschutz getroffen, aber die wirkliche Reduzierung von Treibhausgasen passiert auf nationaler Ebene. Wie viel Klimaschutz in den nächsten vier Jahren in Deutschland gemacht wird, hängt also vor allem auch von der Bundestagswahl.Wenn wir uns nicht auf die Politiker*innen verlassen können, sind wir umso mehr gefragt. Wir, das sind du und ich. Und deine Schwester, dein Papa, deine Arbeitskolleg*innen, dein bester Freund. Gemeinsam können wir etwas bewirken.Jetzt nur noch eine Frage: wie fängt man damit an, etwas zu bewirken? Da gibt es ehrlich gesagt viiiiiele Möglichkeiten. Eine davon wäre: kommt zum großen Bundestagswahl-Streik von Fridays for Future am 14.02.2025. Eine andere Option: werde Aktivist*in und komme zu unserem Plenum. Wann und wo wir uns treffen, erfährst du hier. Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
