full_description = "Ortsgruppe in HOLZKIRCHEN Wir sind die Zukunft! Neues Projekt!!! Ich habe gelernt, dass man nie zu klein dafür ist, einen Unterschied zu machen.Greta Thunberg Informationen Die Klimakrise ist eine reale Bedrohung für die menschliche Zivilisation. Die Bewältigung der Klimakrise ist die Hauptaufgabe des 21. Jahrhunderts.🌳Wir fordern eine Politik, die dieser Aufgabe gerecht wird.💪 Darüber hinaus kämpfen wir auch in anderen Bereichen für eine allgemein gerechtere und bessere Zukunft.🌻 Für unsere Zukunft! (Unsere Nächste Demo) (Unser letztes Projekt) (Bleibe immer auf dem Laufendem) (Du willst mitmachen?) (Aktuelle Themen und Links) (Presse) Unsere nächsten Demos Hey Leute, wir, die Fridays For Future Ortsgruppe Holzkirchen und andere motivierte Holzkirchener haben ein neues Projekt am Start: Mithilfe von German Zero wollen wir ein Bürgerbegehren starten, damit Holzkirchen klimafreundlicher wird. Wenn ihr mitmachen wollt, schreibt uns gerne eine E-Mail an germanzero.holzkirchen@gmail.com und wir schicken euch einen Zoom-Link für unser nächstes Treffen. Wir freuen uns auf euch, Fridays For Future 🌳💚 Unser letztes Projekt Lauf Demonstration 29.7.21. Danke an alle teilnehmer 🙂 !!!! Bleibe Immer Auf Dem Laufenden Instagram Du willst mitmachen? schreib uns einfach eine Email! holzkirchen@fridaysforfuture.is Aktuelle-Themen und Links Germanzero PM Fridays for Future kommentiert Ergebnisse der Bundestagswahl Wer ist wirklich bereit, Verantwortung zu tragen? Über 130.000 Menschen beteiligen sich am Klimastreik von Fridays for Future in über 150 Orten PM: Über 150 Klimastreiks unter dem Motto “Recht auf Zukunft” in ganz Deutschland Klima & Demokratie – worauf es jetzt ankommt Presse🗞 So demonstriert Fridays For Future am Freitag in Holzkirchen 24.04.2020 Demonstranten trotzen dem Regen 29.11.2020 Schluss mit lustig: Junge Klima-Rebellen hauen knackige Parolen raus 05.07.2019 Fridays For Future kommen nach Holzkirchen 02.07.2019 (Seitenanfang)"
