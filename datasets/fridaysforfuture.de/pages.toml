title = "Fridays For Future Kiel | Fridays for Future"
description = "Willkommen auf der Seite der OG Kiel! Nächste Termine 14.02 Klimastreik zur Bundestagswahl, Start 14 Uhr Exerzierplatz. Mit buntem Straßenfest im Anschluss auf dem Exerzierplatz :-) Plenum jeden Montag 18 Uhr Alte Mu Unser Spendenkonto Unser ehrenamtlicher Klimaaktivismus kostet Geld, unterstütze uns jetzt mit deiner Spende! Spenden bitte an folgendes Konto: IBAN: DE63430609671281197800BIC: GENODEM1GLS Oder"
full_description = "Kiel Willkommen auf der Seite der OG Kiel! Nächste Termine 14.02 Klimastreik zur Bundestagswahl, Start 14 Uhr Exerzierplatz. Mit buntem Straßenfest im Anschluss auf dem Exerzierplatz 🙂 Plenum jeden Montag 18 Uhr Alte Mu Unser Spendenkonto Unser ehrenamtlicher Klimaaktivismus kostet Geld, unterstütze uns jetzt mit deiner Spende! Spenden bitte an folgendes Konto: IBAN: DE63430609671281197800BIC: GENODEM1GLS Oder direkt hier online spenden: https://pay.sumup.com/b2c/QLZDPJPY Bleibe immer auf dem Laufenden: Messenger Infokanäle: WhatsApp Telegram Signal Social Media: Instagram Facebook Twitter Mastodon Moin, wir sind die Ortsgruppe Kiel! Wir treffen uns wöchentlich, um gemeinsam für Klimagerechtigkeit kämpfen. In Kiel betreffen uns vor Allem die Kernthemen Mobilität, Kreuzfahrttourismus und Energiewende. Regelmäßig organisieren wir kleinere oder größere Proteste, um auf absurde Mindestabstände von Windrädern, den Methanausstoß von LNG betriebener Kreuzfahrt oder die konsequent nicht eingehaltenen Abgaswerte auf großen Kieler Straßen aufmerksam zu machen. Wir kämpfen gegen die Verlagerung der Konsequenzen der Klimakrise durch Verursacher*innen auf die am wenigsten privilegierten Teile unserer Gesellschaft, gegen die Rodung von Wäldern und das Abbaggern von Dörfern im Namen von Großkonzerninteressen. Wir stehen ein für Klimagerechtigkeit und sorgen dafür, dass die fossile Schreckenspolitik ein Ende hat! Gemeinsam treffen wir uns jeden Dienstag um 18:00 Uhr in der Alten Mu, um Aktionen zu planen, zu diskutieren und Aufgaben zu verteilen. Jede*r ist bei unseren Treffen willkommen, also wenn Du Lust hast dabei zu sein, schreib uns einfach eine Mail an kiel@fridaysforfuture.de oder komm einfach vorbei! Unsere Forderungen zur Kommunalwahl 2023 Hier findet ihr unsere Forderungen zur Kommunalwahl: FFFKiel_alleForderungen_Kommunalwahl23-2Herunterladen Die fünf Kernforderungen „Gestalten statt Verwalten!“ haben die folgenden Initiativen, Institutionen und Bewegungen unterzeichnet: Fridays for Future Kiel, Scientists for Future Schleswig-Holstein, People for Future Kiel, Students for Future Kiel, Bündnis „Vorfahrt für den Klimagürtel“, NABU Kiel, BUND Kiel, Wind of Change, Tram für Kiel e.V., Ver.di Jugend Kiel-Plön, Gemeinwohlökonomie Kiel-Region, Bielenbergkoppel.de, Bürgerinitiative Klimanotstand Kiel, Greenpeace Kiel Unsere Parteien-Ampel fridaysforfuture.de//kiel/kommunalwahl-2023/: Kiel Hier haben wir für euch die Kommunalwahl-Programme der Parteien gecheckt. Geht am 14.Mai unbedingt wählen – jede Stimme zählt! Bootsdemo auf der Förde am 23.9.22, Foto: NDR Aus rechtlichen Gründen sind wir als FFF Kiel e.V. organisiert. Das ist unsere einzig gültige rechtliche Nachfolge. Entscheidungen der Ortsgruppe werden aber weiterhin basisdemokratisch getroffen. Auch wenn uns vorrangig die Klimagerechtigkeit zusammenbringt, verstehen wir uns im Grundsatz als weltoffene, antifaschistische, feministische und kapitalismuskritische Bewegung. Intoleranz oder gruppenbezogene Menschenfeindlichkeit haben bei uns keinen Platz. Großdemo am 20.09.2019 (Foto: Bühnenhopper)"
