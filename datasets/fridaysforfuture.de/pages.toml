["https://fridaysforfuture.de/forderungen/allgemein/faq"]
title = "Forderungen – FAQ | Fridays for Future"
description = "Fragen und Antworten zu unseren Forderungen Allgemein Tun wir nicht schon genug für den Klimaschutz? Nein. Der Weltklimarat kommt zum Schluss, dass selbst bei Einhaltung der aktuellen weltweiten Klimaschutzziele eine Erwärmung um 3 Grad bis 2100 und eine weitere Erhitzung danach nicht zu verhindern wäre. Kohleausstieg 2030 Die Kohlekommission hat einen Kompromiss gefunden, dem alle,"
full_description = "Forderungen – FAQ Fragen und Antworten zu unseren Forderungen Allgemein Tun wir nicht schon genug für den Klimaschutz? Nein. Der Weltklimarat kommt zum Schluss, dass selbst bei Einhaltung der aktuellen weltweiten Klimaschutzziele eine Erwärmung um 3 Grad bis 2100 und eine weitere Erhitzung danach nicht zu verhindern wäre. Kohleausstieg 2030 Die Kohlekommission hat einen Kompromiss gefunden, dem alle, sowohl die Wirtschaftsverbände als auch die Umweltverbände, die daran beteiligt waren, zugestimmt haben Die Umweltverbände haben in einem Sondervotum erklärt, dass ihnen das Ergebnis der Kohlekommission nicht weit genug geht und der Kohleausstieg bis 2030 notwendig ist. Das Ergebnis der Kommission haben sie nur mitgetragen, um einen völligen Stillstand im Klimaschutz zu verhindern. Der Kompromiss der Kohlekommission ist mit dem 1,5-Grad-Ziel unvereinbar. Viele Studien (z.B. vom Fraunhofer Institut für Energiewirtschaft und Energiesystemtechnik) haben erwiesen, dass der Kohleausstieg bis 2030 möglich ist. Der Kohleausstieg führt zu einem Import von nicht in Deutschland erzeugter Energie, die Emissionen werden dann einfach ins Ausland verlagert Bisher exportiert Deutschland viel Kohlestrom billig in Nachbarländer, die dafür verwendete Kohlekraft kann also ohne zusätzliche Importe aus dem Ausland abgeschaltet werden. Das Deutsche Institut für Wirtschaftsforschung (DIW) schreibt zu dieser Frage: „Die Befürchtung, dass sich durch einen deutschen Kohleausstieg die Stromerzeugung auf bestimmte andere Technologien in den Nachbarländern, wie französische Atomkraft oder polnische Braunkohle verlagert, ist unbegründet. Im Gegenteil: Der Kohleausstieg treibt auch die Dekarbonisierung (d.h. die Umstellung auf erneuerbare Energien) in Europa voran. Verlust zahlreicher Arbeitsplätze in ohnehin strukturschwachen Regionen Die Kohlekommission sieht über 40 Milliarden Euro für den Kohleausstieg vor. In der Kohleindustrie arbeiten noch 20.000 Menschen. Alle Kohlearbeiter*innen könnte man mit dieser Geldsumme zu Millionär*innen machen. Stattdessen soll viel Geld als Entschädigung an die Kohlekonzerne fließen, nur weil sie nicht länger Umwelt und Klima zerstören dürfen. Durch den Ausbau der erneuerbaren Energien werden deutlich mehr neue Arbeitsplätze entstehen, als durch den Kohleausstieg verloren gehen. Bereits heute arbeiten 340.000 Menschen in der Branche rund um erneuerbare Energien. Ein Ausbau der erneuerbaren Energien in den Braunkohlerevieren könnte auch dort viele gut bezahlte Arbeitsplätze liefern. Kohlestrom ist günstig, warum auf erneuerbare Energien umsteigen? Kohlestrom ist unter Einberechnung der Kosten durch Klima- und Umweltschäden der teuerste Strom. Diese Klima- und Umweltschäden zahlt die Allgemeinheit, also wir alle. Wenn die Kohlekonzerne diesen Schaden bezahlen müssten, wäre Kohlestrom sofort unrentabel. Wir fordern das mit der CO2-Steuer. 100% erneuerbare Energieversorgung bis 2035 Atomenergie als 'klimafreundliche Alternative'? Deutschland hat den Ausstieg aus der Atomenergie bereits beschlossen. Die Atomenergie stellt keinen relevanten Teil der Energiegewinnung dar und kann durch erneuerbare Energien ersetzt werden. Was ist mit Kernfusion oder ähnlichen Technologien? Warum wird nur von erneuerbaren Energien gesprochen? Die Wissenschaft sieht Kernfusion erst in frühestens 30 Jahren. Bis die Kraftwerke eventuell irgendwann mal eingesetzt werden könnten, würde es noch viel länger dauern. Wenn wir bis zu dieser Zeit bei der Nutzung von fossilen Energieträgern bleiben, lässt sich das Klima nicht mehr retten. Das bedeutet nicht, dass die Forschung nicht für andere Anwendungszwecke weitergeführt werden sollte. Warum fordert ihr hier keine konkreten Maßnahmen, wie etwa Kohleabbaufelder oder Hausdächer mit Solaranlagen zu bedecken etc.? Es gibt viele verschiedene Möglichkeiten, unsere Forderung nach 100 % erneuerbarer Energieversorgung umzusetzen. Wir können uns hier nicht auf einen Lösungsweg festlegen, über die detaillierte Umsetzung unserer Forderungen sollte in der Politik diskutiert werden. Der Ausbau ist viel zu teuer! Erneuerbare Energien sind in den letzten Jahren so preiswert geworden, dass die Kosten inzwischen kein Argument gegen den Ausbau mehr sind. Bezieht man die Klimaschäden mit ein, sind erneuerbare Energien die günstigste Form der Stromproduktion. BIS ENDE 2019 1⁄4 der Kohlekraft abschalten Wenn Deutschland Kohlekraftwerke abschaltet, werden CO2-Zertifikate (aus dem europäischen Emissionshandelssystem) frei, die andere Länder dann verwenden können, um mehr CO2 auszustoßen Das Emissionshandelssystem hat es noch nicht geschafft, einen großen Beitrag zum Erreichen der Klimaschutzziele zu leisten. Soll der Zertifikathandel einen Beitrag zur Einhaltung des Pariser Klimaabkommens leisten, muss er grundlegend verbessert werden. So lange kann man aber mit dem Kohleausstieg nicht warten. Die durch die Abschaltung von Kohlekraftwerken freiwerdenden CO2-Zertifikate muss Deutschland zunächst zurückkaufen, damit andere Länder diese frei gewordenen Zertifikate nicht verwenden können. Die Details sind eine Frage der Umsetzung unserer Forderungen und sind von der Wissenschaft bereits ausführlich diskutiert worden. Die Politik muss mit Bezug auf die Wissenschaft die beste Lösung auswählen. Kann man wirklich 1/4 der Kohlekraft abschalten, ohne die Versorgungssicherheit zu gefährden? Ja. Der Kohlekommission lag ein Bericht vor, der beinhaltet, dass wir bis 2020 13 Gigawatt an Kohlekraftkapazitäten abschalten können, ohne die Versorgungssicherheit zu gefährden. Damit ist umsetzbar, bis zum Ende dieses Jahres mindestens 10,5 GW, also 1/4 der derzeitigen Kohlekraftkapazitäten, abzuschalten. Ende der Subventionen für fossile Energieträger vor Ende 2019 Ist der Abbau von Subventionen juristisch gesehen überhaupt möglich? Deutschland ist laut UBA (Umweltbundesamt) in der Lage, die meisten Subventionen schnell zu befristen und abzubauen. Für Subventionen, die auf internationalen Abkommen oder EU-Regelungen beruhen, muss sich Deutschland auf der entsprechenden Ebene für einen Abbau einsetzen. Ist Flugverkehr dann überhaupt noch möglich? Derzeit wird Fliegen durch Subventionen billig gehalten. Der Preis für einen Flug ist momentan viel niedriger als die eigentlichen Kosten. Werden diese Subventionen gestrichen, wird Fliegen an sich teurer. Durch die Subventionen bezahlen wir derzeit alle das Fliegen über Steuern mit, selbst, wenn wir nicht fliegen. Das ist klimaschädlich und unfair. Fliegen wird weiterhin auf manchen Strecken möglich sein, dann aber zu faireren Preisen. Führt der geforderte Subventionsstopp bis Ende 2019 zwangsläufig zu Carbon Leakage (= Verlagerung von Treibhausgasemissionen ins Ausland)? Carbon Leakage lässt sich vermeiden. Bisherige Erfahrungen haben gezeigt, dass Carbon Leakage in einem weit geringeren Maß als befürchtet auftritt. Laut DIW würde das Abschalten von Kohlekraftwerken, was durch den Abbau der Subventionen beschleunigt werden kann, den Ausbau von erneuerbaren Energien in den Nachbarländern sogar vorantreiben. Die Subventionierung der erneuerbaren Energien verbrennt Geld Wir geben aktuell 46 Mrd. Euro pro Jahr für die Subventionierung von fossilen Energieträgern aus. Zudem müssen die Schäden durch die ausgestoßenen Treibhausgase nicht vom Verursacher gezahlt werden. Würden die Subventionen abgebaut werden und die Schäden durch die Treibhausgase bezahlt (wie wir fordern), wären erneuerbare Energien schon heute die günstigste Form der Energiegewinnung. Die Abschaffung der Subventionen für fossile Energieträger ist also dringend notwendig: Die Gelder für die Subventionierung fossiler Energieträger werden frei und gleichzeitig wird die Nutzung erneuerbarer Energien vorangetrieben. CO2-Steuer Warum nur CO2? Was ist mit den anderen Treibhausgasen (Methan, Stickoxide, etc.)? Alle Treibhausgase werden besteuert! Es ist üblich, diese Steuer auf Treibhausgase „CO2- Steuer“ zu nennen. Methan und andere Treibhausgase werden entsprechend ihrer Klimaschädlichkeit auf Tonnen CO2 umgerechnet (CO2-Äquivalente) und entsprechend besteuert. Warum eine CO2-Steuer und nicht nur das ETS (europäischer Emissionshandel)? Wir fordern eine wirksame Bepreisung von Treibhausgasemissionen. Damit die Wirtschaft auf klimafreundlichere Produktion umstellt, braucht sie die Sicherheit, wie hoch der Preis für den Ausstoß von Treibhausgasen sein wird. Deshalb sollte es einen klaren Mindestpreis für den Ausstoß von Treibhausgasen geben. Details der Umsetzung sind Aufgabe der Politik. Dabei ist einfach nur fair, wenn die Verursacher der Treibhausgasemissionen die Kosten zahlen, die uns durch die Klimaschäden entstehen. Laut Umweltbundesamt liegen diese Kosten bei 180 Euro pro Tonne CO2. Eine CO2-Steuer und das ETS sind kein Widerspruch, sondern können sich ergänzen. Ein Beispiel für die erfolgreiche Kombination der beiden Mittel ist Schweden. Steuern gehen immer zu Lasten der Bevölkerung, das ist doch nicht sozial verträglich. Zusätzlich entsteht eine soziale Spaltung, weil sich die Reichen die CO2-Steuer leisten können, arme Menschen aber nicht ('Umweltzerstörung wird ein Recht der Reichen!'). Menschen mit hohem Einkommen verursachen in der Regel deutlich mehr Treibhausgasemissionen und würden deshalb auch deutlich mehr CO2-Steuer zahlen müssen als Menschen mit geringem Einkommen. Die Einnahmen aus dieser CO2-Steuer können und sollen so verwendet werden, dass soziale Ungerechtigkeiten vermieden und sogar reduziert werden. Es gibt viele verschiedene Modelle und Möglichkeiten, wie das gemacht werden kann. Hier die Beste auszusuchen, ist Aufgabe der Politik. Als Beispiele für eine erfolgreiche, sozial verträgliche Umsetzung können die Schweiz und Schweden dienen. FFF generell Wie viele Menschen waren direkt oder indirekt an der Erstellung beteiligt? Die Anzahl an Menschen in der AG hat sich über die drei Monate, in denen wir an den Forderungen gearbeitet haben, immer wieder verändert. Zum Zeitpunkt der Pressekonferenz bestand die AG Forderungen aus 101 Menschen. Wir haben Wissenschaftler*innen diverser Fachgebiete in den Arbeitsprozess eingebunden und Feedback zu den Forderungen aus allen Ortsgruppen eingeholt. Sind auch europaweite oder globale Forderungen geplant? Momentan fokussieren sich die Arbeitsgruppen auf nationale Forderungen, die sich an der Einhaltung des 1,5 Grad Ziels ausrichten. Inwiefern stehen die Forderungen in Einklang mit der internationalen Bewegung? Der internationale Konsens ist die Einhaltung des 1,5-Grad-Ziels. Unsere bundesweiten Forderungen stehen repräsentativ für Fridays For Future in Deutschland und zeigen, was Deutschland tun muss, um seinen Beitrag zur Einhaltung des 1,5-Grad-Ziels zu leisten. Wie geht's weiter mit FFF, wann hören wir auf zu streiken? Uns reichen keine Versprechungen der Politik. Wir streiken, bis gehandelt wird und hören erst auf, wenn die Einhaltung des 1,5-Grad-Ziels sichergestellt ist! Grundsätzliches Warum präsentiert ihr keine konkreten Lösungsvorschläge? Wir fordern in unserem Forderungspapier das, was nötig ist, damit Deutschland seinen Beitrag zur Einhaltung des 1,5-Grad-Ziels leistet. Die Forderungen sind dabei bewusst als Ziele formuliert. Es gibt viele verschiedene Wege und Lösungen, um diese Ziele zu erreichen und genau das ist Aufgabe der Politik. In Zusammenarbeit mit der Wissenschaft muss sie die besten und sinnvollsten Maßnahmen zur Einhaltung unserer Forderungen heraussuchen und umsetzen. Sind die Forderungen realistisch? Ja, sie sind realistisch, für die Einhaltung des 1,5-Grad-Ziels notwendig und mit dem nötigen politischen Willen umsetzbar. Die Maßnahmen wirken sich negativ auf die Wirtschaft aus! Wenn die Wirtschaft weitermacht wie bisher, wird das zu Klimaschäden führen, die nicht mehr rückgängig zu machen und nicht mehr reparabel sind. Diese Schäden werden viel mehr kosten als heute umgesetzte Klimaschutzmaßnahmen und der Wirtschaft damit viel mehr schaden. Eine Veränderung der Klimapolitik steht also nicht im Widerspruch zu einer langfristigen positiven Entwicklung der Wirtschaft, sondern ermöglicht sie erst! Wollt ihr, dass alles klimaschädliche Handeln komplett verboten wird? Nein, klimaschädliches Handeln soll aber endlich den Preis bekommen, den es uns und zukünftige Generationen kostet. So wird verhindert, dass auf unsere Kosten gelebt wird. Warum sollten wir jetzt auf so viel verzichten? Das Verringern von klimaschädlichem Handeln ist weit weniger schlimm für uns als die Folgen eines dramatischen Klimawandels. Selbst bei einer Erwärmung von „nur“ 2 Grad würden gegenüber der Einhaltung des 1,5-Grad-Ziels doppelt so viele Menschen unter Wassermangel leiden und das Zuhause von 10 Millionen weiteren Menschen durch den Meeresspiegelanstieg bedroht werden. Das Verringern klimaschädlichen Handelns ist diesen Folgen eindeutig vorzuziehen. Deutschland verantwortet nur 2% des globalen CO2-Ausstoßes, andere Länder (z.B. China) tun aber nichts gegen den Klimawandel, obwohl sie viel mehr Emissionen verursachen. Warum sollte Deutschland dann etwas machen? Deutschland ist im internationalen Vergleich wenig ambitioniert im Klimaschutz. Andere Länder unternehmen sehr viel größere Anstrengungen. So gibt es in Schweden beispielsweise schon eine CO2-Steuer in Höhe von 120 € pro Tonne und zusätzlich dazu den EU Emissionshandel, in Deutschland existiert noch nicht einmal eine CO2-Steuer. Deutschlands Pro-Kopf-Emissionen sind deutlich höher als der globale Durchschnitt und auch höher als die Pro-Kopf-Emissionen in China. Im Pariser Abkommen hat sich Deutschland als reiches Industrieland verpflichtet, eine Vorreiterrolle einzunehmen, die die derzeitige Regierung nicht erfüllt. Was ist mit anderen Sektoren wie Landwirtschaft, Verkehrspolitik, etc.? Deutschland muss bis 2035 Nettonull erreichen, damit sind hier alle Sektoren miteinbezogen. Die CO2-Steuer ist ebenfalls sektorenübergreifend konzipiert. Für die Einhaltung des 1,5-Grad-Ziels sind Emissionsreduktionen in allen Sektoren notwendig. Das Tempolimit, autofreie Innenstädte, echte Elektroautos, Reduktion von Massentierhaltung, Plastikreduzierung, ÖPNV, Abholzung in Brasilien, Kreuzfahrtschiffe usw. fehlen in den Forderungen! Nein, denn die klimaschädlichen Emissionen aus all diesen Bereichen sind in der Forderung nach Nettonull enthalten und werden unter anderem durch die CO2-Steuer abgedeckt. Wir haben uns bewusst dazu entschlossen, nur die großen, zwingend notwendigen Ziele in die Forderungen mitaufzunehmen. Das schmälert aber auf keinen Fall den großen Handlungsbedarf, der in all diesen Bereichen vorliegt. Viele der genannten Aspekte sind detaillierte Maßnahmen zur Erreichung der in den Forderungen genannten Ziele. Welche Maßnahmen zur Einhaltung unserer Forderungen am geeignetsten sind, muss die Politik mit Blick auf die Wissenschaft entscheiden. Es muss nur sichergestellt sein, DASS die Forderungen umgesetzt werden. Jede*r muss auf sich selber schauen und seinen*ihren Konsum ändern! Jede*r von uns kann seine*ihre Emissionen nu"
