["https://fridaysforfuture.de/spenden"]
title = "Unterstütze uns jetzt! | Fridays for Future"
description = "Unterstützte uns jetzt! Hilf uns Material für Demonstrationen, Plakate, Lautsprecher etc. zu finanzieren. Jede Spende hilft, die Klimastreiks weiter zu ermöglichen!"
full_description = '''UNTERSTÜTZE UNS JETZT! Demonstrationen, Aktionen, Sticker, aber auch unsere Plakate werden ausschließlich durch Spenden finanziert. Erst Deine Spende gibt uns die Möglichkeit, für hunderttausende Menschen Demonstrationen zu organisieren und für Klimagerechtigkeit zu kämpfen. Alle Zahlungen gehen direkt auf das Konto unseres Unterstützervereins “Alle fürs Klima e.V. ”. Der Verein ist nicht als gemeinnützig anerkannt, daher können keine Spendenbescheinigungen ausgestellt werden. Mehr Infos zum Verein findest Du in den den FAQs. document.getElementById("header-img").style["display"]="none"; document.getElementById("menu-menue-new").style["display"]="none"; window.addEventListener("message", function(event){ if(event && event.data && event.data.type === "stepChange") { _paq.push(['trackEvent', 'Spende', 'Schritt', event.data.value.step ]); } } , false); window.addEventListener("message", function(event){ if(event && event.data && event.data.type === "donationFinished") { _paq.push(['trackGoal', 6, event.data.value.amount]); _paq.push(['trackEvent', 'Spende', 'Erflog - Betrag: ', JSON.stringify(event.data.value) ]); } } , false); (function() { var u="https://spenden.twingle.de/embed/genericorganisation/genericproject/tw5dd563a82c6ee/widget"; var id = '_' + Math.random().toString(36).substr(2, 9); var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0]; document.write('<div id="twingle-public-embed-' + id + '"></div>'); g.type='text/javascript'; g.async=true; g.defer=true; g.src=u+'/'+id; s.parentNode.insertBefore(g,s); })(); Fridays For Future Spendenkonto Konto 1246 5016 00 IBAN DE78 4306 0967 1246 5016 00 BIC GENODEM1GLS Kontodaten in Zwischenablage kopieren function copyKonto() { copyToClp("Alle fürs Klima e.V. | Konto: 1246 5016 00 | IBAN: DE78 4306 0967 1246 5016 00 | BIC: GENODEM1GLS"); } function copyToClp(txt){ txt = document.createTextNode(txt); var m = document; var w = window; var b = m.body; b.appendChild(txt); if (b.createTextRange) { var d = b.createTextRange(); d.moveToElementText(txt); d.select(); m.execCommand('copy'); } else { var d = m.createRange(); var g = w.getSelection; d.selectNodeContents(txt); g().removeAllRanges(); g().addRange(d); m.execCommand('copy'); g().removeAllRanges(); } txt.remove(); } Damit wir uns in Zukunft weiterhin unabhängig und eigenständig für eine 1,5°C-konforme Klimapolitik organisieren können, brauchen wir Deine Spende. Egal, wie viel. Egal, wie oft. Wir können jede Unterstützung gebrauchen! Du möchtest uns nicht nur finanziell unterstützen, sondern auch eine Kooperation mit uns beginnen? Dann schau mal hier vorbei. FAQ Wofür gebt ihr das Geld aus? Bei unseren lokalen Ortsgruppen und bundesweiten Arbeitsgruppen fallen immer wieder verschiedene Ausgaben an. Es wird u.a. Geld für Flyer und Plakate, Technik für Streiks oder Kreativmaterialien, wie Kreide, Farbe oder Stoff um Transparente zu malen benötigt. Außerdem fallen Fixkosten wie Serverkosten oder Kosten für Telefonkonferenzräume an. So organisieren wir uns seit 2019 als Bewegung ganz selbstverständlich über eine eigene unabhängige digitale Infrastruktur, mit eigenem Mail Hosting, Cloud und Website. Wie stellt ihr sicher, dass das Geld dem Zweck zugute kommt? Innerhalb der Bewegung gibt es klare Regeln wofür und wie viel Geld durch wem ausgegeben werden darf. Das regelt unser bewegungsinternes Finanzkonzept und wird durch unsere Abrechnungs- und Rechnungsprüfungsteams kontrolliert. So können wir sicherstellen, dass alle finanziellen Angelegenheiten professionell abgewickelt werden. Dazu gehört, dass Geld nur gegen ordnungsgemäße Abrechnung ausgezahlt wird. Können Spendenbescheinigungen ausgestellt werden? Leider können im Normalfall keine Spendenbescheinigungen ausgestellt werden. Deswegen sind wir umso mehr auf Deine Unterstützung angewiesen, um Technik, Bühnen und Materialien zu finanzieren. Wer ist Alle fürs Klima e.V.? Alle fürs Klima wurde im Juni 2021 gegründet. Das Ziel dieses Vereins ist die Schaffung einer rechtssicheren Struktur für die Finanzierung und Verwaltung der finanziellen Mittel von Fridays for Future in Deutschland. Der Verein verwahrt das Geld und bezahlt die Vorhaben von Fridays for Future wie basisdemokratisch von der Bewegung beschlossen. Die Mitglieder des Vereins sind Privatpersonen, die sich mit den Zielen der Bewegung solidarisch erklärt haben, aber selbst nicht in der Bewegung aktiv sind. Der Verein hat keinen Einfluss auf interne Entscheidungsprozesse der Bewegung, sondern dient ausschließlich der Verwaltung der Finanzen. Bei weiteren Fragen erreichst du uns unter spenden@fridaysforfuture.de. .entry-content, .entry-summary, .page-content { margin-top: -7.5em; }'''
