["https://fridaysforfuture.de/ltw/forderungen-sachsen"]
title = "Forderungen Sachsen | Fridays for Future"
description = "Die FridaysForFuture Gruppen aus Sachen haben anlässlich der Landtagswahl Forderungen aufgestellt. Aktionskarte Kernforderungen Maßnahmenkatalog Präambel Wir fordern, dass konsequenter Klimaschutz zur Einhaltung des 1,5 °C-Ziels ab sofort der Maßstab ist. Schon jetzt spüren wir die Folgen einer unzureichenden Klimapolitik – auch in Sachsen: von Ernteausfällen, Waldbränden bis hin zu Hitzetoten. Dabei befinden wir uns, als Teil"
full_description = "Forderungen Sachsen Die FridaysForFuture Gruppen aus Sachen haben anlässlich der Landtagswahl Forderungen aufgestellt. Aktionskarte Kernforderungen Maßnahmenkatalog Präambel Wir fordern, dass konsequenter Klimaschutz zur Einhaltung des 1,5 °C-Ziels ab sofort der Maßstab ist. Schon jetzt spüren wir die Folgen einer unzureichenden Klimapolitik – auch in Sachsen: von Ernteausfällen, Waldbränden bis hin zu Hitzetoten. Dabei befinden wir uns, als Teil des globalen Nordens und als Industriestaat in einer vergleichsweise sehr privilegierten und gesicherten Situation. In anderen Regionen hingegen, insbesondere dem globalen Süden, leben Menschen klimabedingt in existenz- und lebensbedrohlichen Zuständen oder müssen vor diesen fliehen. Die Schäden des Nichtstuns werden bereits jetzt auf bis zu 62 Milliarden Euro bis 2030 geschätzt – allein für Deutschland [1]. Die Klimakrise wird jedoch nicht nur Geld, sondern auch unzählige Menschenleben kosten, wenn wir nicht jetzt handeln. Deshalb fordern wir nachdrücklich, in Sachsen sämtliche Maßnahmen zu ergreifen, die zu einem grundlegenden Strukturumbruch im Sinne des Klimaschutzes führen. Dabei ist es unabdingbar, dass die Maßnahmen nicht zu Lasten der Betroffenen insbesondere von Menschen im ländlichen Raum und finanziell schwächer Gestellten umgesetzt werden, sondern, dass sie zu einer sozial gerechten Zukunft beitragen – nur so sind Klimaschutzmaßnahmen tragfähig und zukunftstauglich. Wir sind Fridays For Future, eine Bewegung, die vor allem von jungen Menschen getragen wird, doch es ist nicht allein die Aufgabe der Jugend, Klimaschutz und Klimagerechtigkeit einzufordern. Es darf nicht allein die Jugend sein, die diese Katastrophe verhindert. Stattdessen sind sämtliche Politiker*innen und die Regierung des Freistaats Sachsen gefragt. Liebe Politiker*innen, die Klimakrise ist die größte Herausforderung der Gegenwart und Zukunft. Das planetare Gleichgewicht gerät aus den Fugen, während ihr tatenlos zuschaut. Es ist 3vor12 – ACT NOW! Forderungen: Um eine jährliche Senkung der Treibhausgasemissionen um 23 % im Vergleich zum Vorjahr beginnend 2020 zu erreichen, braucht Sachsen: ein Klimaschutzgesetz und eine Neuauflage des veralteten Energie- und Klimaprogramms. Dieses muss bis Ende 2019 erarbeitet und bis spätestens August 2020 verabschiedet werden. Die folgenden Forderungen müssen dabei umgesetzt werden: …KOHLEAUSSTIEG: Wir fordern den sachsenweiten Kohleausstieg bis spätestens 2030, Abschaltung der Blöcke N und P des Kraftwerks Boxberg bis Ende 2019. WÄRMEWENDE: Wir fordern die Beschleunigung der Wärmewende in Sachsen. ERNEUERBARE ENERGIEN Wir fordern den weitreichender Ausbau von Windkraftanlagen und eine verpflichtende Installation von Photovoltaikanlagen auf allen geeigneten Neubauten. VERKEHR Wir fordern den klimaschädlichen Individualverkehr durch klimafreundlichen öffentlichen Personenverkehr zu ersetzen LANDWIRTSCHAFT Wir fordern die Ausrichtung der Landwirtschaft und der Fleischproduktion am 1,5°C Ziel durch eine sofortige Agrar- und Ernährungswende BIODIVERSITÄT Wir fordern die Verabschiedung eines verschärften Naturschutzgesetzes bis 2020 mit dem Ziel, das sechste Massenaussterben zu stoppen. BILDUNG Wir fordern die konsequente Umsetzung des Prinzips von „Bildung für Nachhaltige Entwicklung (BNE)“ entsprechend der UN-Vorgaben bis Ende 2020 JUGENDBETEILIGUNG Wir fordern die Stärkung der Jugendbeteiligung in Sachsen durch die Senkung des Wahlalters und Schaffung eines sächsischen Jugendparlaments mit Initiativrecht bis spätestens 2021 BUNDESEBENE Wir fordern, dass sich die Landesregierung auf Bundesebene für die Umsetzung der bundesweiten „Fridays for Future“- Forderungen einsetzt. Alle Maßnahmen und Fortschritte im Sinne dieser Forderungen müssen transparent gemacht und in einem jährlich veröffentlichten Klimaschutzbericht mit Fokus auf die CO2-Reduktion dokumentiert werden. Dieser Bericht muss im Besonderen die Sozialverträglichkeit der umgesetzten Maßnahmen und ihren Einfluss auf Generationen- und globale Klimagerechtigkeit erfassen. Es ist 3vor12. Jetzt ist das Zeitfenster, etwas in Bewegung zu setzen. Jetzt lässt sich die Klimakrise noch aufhalten. Nicht in 10 Jahren, nicht in 5 Jahren. Jetzt! Weitere Informationen"
year_published = 2025
