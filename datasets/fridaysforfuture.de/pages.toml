full_description = 'Altkreis Halle (Westf.) Herzlich willkommen Wir sind Fridays for Future Altkreis Halle von der globalen Fridays for Future Bewegung. Zum Altkreis Halle gehören die Kommunen Borgholzhausen, Halle (Westf.), Steinhagen, Versmold und Werther (Westf.). Wir streiken auf der Straße und bieten immer wieder verschiedene Aktionen an, um auf die Klimakrise aufmerksam zu machen und die Politik zum Handeln zu zwingen. Am 24. April 2020 haben wir unsere Forderungen an die Lokalpolitik aufgestellt, denn es erfordert auch auf Kommunalebene weitreichende Veränderungen sowie die Ausrichtung aller städtischen Sektoren auf Nachhaltigkeit. Kontakt: altkreishalle[at]fridaysforfuture.de Bundesweiter Klimastreik am 14. Februar zur Bundestagswahl Über 130.000 Menschen beteiligen sich am Klimastreik in über 150 Orten. Weiterlesen Globaler Klimastreik am 20. September 2024 Am 20.09. gingen wir wieder international auf die Straße und zeigten zusammen: Wir streiken, bis ihr handelt! Weiterlesen EU-weiter Klimastreik am 31. Mai 2024 zur Europawahl Vor der EU- Wahl (9. Juni) waren wir für klimagerechte Politik und Demokratie auf der Straße! Weiterlesen Bundesweiter Klimastreik am 01. März 2024 #WirFahrenZusammen In über 100 Städten haben wir als Klimabewegung gemeinsam mit Bus- und Bahnfahrer*innen gestreikt! Weiterlesen Halle (Westf.) Kommentar zur Änderung der wasserrechtlichen Erlaubnis der Firma Storck KG Wie zu erwarten war, hat die August Storck KG nun auch seine letzte Genehmigung am Standort Halle erhalten: die Lizenz zur Erhöhung der Grundwasser-Entnahmemengen von 450.000 m³ auf 625.000 m³ Wasser jährlich. Weiterlesen Zu allen Berichten Bleibe Immer Auf Dem Laufenden WhatsApp Instagram Threads Facebook Newsletter YouTube X (Twitter) Signal TikTok Mitmachen Komm zu uns in die Ortsgruppe und hilf uns dabei Streiks und verschiedene Aktionen zu organisieren sowie für Klimagerechtigkeit zu kämpfen. Egal ob du schon viel Erfahrung hast oder keine: wir freuen uns, wenn du dazu kommst! Schreib uns einfach eine Nachricht über unsere Social Media Kanäle oder über WhatsApp, Signal, E-Mail. Termine 14 September 2025 Kommunalwahl 2025 12:00am – 12:00am Weiteres Storckerweiterung in Halle (Westf.) Newsletter Forderungen .sm { font-size: 1.5vw; } @media screen and (max-width: 480px) { .sm { font-size: 3vw; } } /* Style the buttons that are used to open and close the accordion panel */ .accordion { background-color: #1DA64A; color: #444; cursor: pointer; padding: 18px; width: 100%; text-align: left; border: none; outline: none; transition: 0.4s; border-radius: 0; margin-top: 10px; } /* Add a background color to the button if it is clicked on (add the .active class with JS), and when you move the mouse over it (hover) */ .active, .accordion:hover { background-color: #90D3ED; } /* Style the accordion panel. Note: hidden by default */ .panel { padding: 0 18px; background-color: white; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; } var acc = document.getElementsByClassName("accordion"); var i; for (i = 0; i < acc.length; i++) { acc[i].addEventListener("click", function() { this.classList.toggle("active"); var panel = this.nextElementSibling; if (panel.style.maxHeight){ panel.style.maxHeight = null; } else { panel.style.maxHeight = panel.scrollHeight + "px"; } }); }'
