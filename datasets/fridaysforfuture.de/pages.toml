full_description = "30 junge Menschen fordern in Offenem Brief konsequenten Klimaschutz 29. Januar 202529. Januar 2025 in Offener Brief, Pressemitteilungen Drei Wochen vor der Bundestagswahl fordern 30 junge Menschen bis 30 Jahre in einem Offenen Brief mit dem Motto #RechtAufZukunft eine Kehrtwende in der Klimapolitik. Die Unterzeichner*innen aus verschiedenen politischen, gesellschaftlichen und kulturellen Bereichen richten ihren Appell besonders an Olaf Scholz, Friedrich Merz und Robert Habeck: Junge Menschen und ihr Recht auf eine lebenswerte Zukunft … Weiterlesen über „30 junge Menschen fordern in Offenem Brief konsequenten Klimaschutz“! Offener Brief: Wir haben ein Recht auf Zukunft! 29. Januar 202529. Januar 2025 in Erzähl mal!, Neuigkeiten, Offener Brief, Wir sind laut! Sehr geehrter Herr Merz, sehr geehrter Herr Scholz, sehr geehrter Herr Habeck, sehr geehrte Spitzenkandidat*innen, Der Ablauf dieses Wahlkampfs scheint vorprogrammiert: Sechs weitere Wochen lang werden die Interessen von jungen Menschen höchstens eine Randnotiz sein, bis man sich beim Anblick der Wahlergebnisse wieder an unsere Existenz erinnert und nach Erklärungen fragt. Statt lediglich am Wahlabend … Weiterlesen über „Offener Brief: Wir haben ein Recht auf Zukunft!“! Offener Brief an SPD-Spitze zu Borkum 3. September 20243. September 2024 in Erzähl mal!, Neuigkeiten, Offener Brief, Wir sind laut! Sehr geehrter Herr Bundeskanzler Scholz, sehr geehrte Frau Esken, sehr geehrter Herr Klingbeil, sehr geehrter Herr Kühnert, wir wenden uns an Sie, weil wir besorgt sind. Vor der deutsch-niederländischen Nordseeküste will der Gaskonzern ONE-DYAS ein neues Gasfeld erschließen. Für mindestens 18 Jahre soll dort klimazerstörerisches Erdgas gefördert werden – und nach den größten Protesten jemals … Weiterlesen über „Offener Brief an SPD-Spitze zu Borkum“! Offener Brief an die demokratischen Parteien in Sachsen, Thüringen und Brandenburg 29. August 20243. September 2024 in Neuigkeiten, Offener Brief, Wir sind laut! An alle demokratischen Parteien in Sachsen, Thüringen und Brandenburg, diese Landtagswahlen finden in einer zunehmend aufgeheizten Stimmung statt. Der politische Diskurs verroht zusehends, unsere Demokratie steht auf dem Spiel. Auch wenn es sich im Wahlkampf bisher wenig widerspiegelt, so ist nicht nur das gesellschaftliche Klima erhitzt, sondern auch das Weltklima: Diese Wahlen finden im Zeichen … Weiterlesen über „Offener Brief an die demokratischen Parteien in Sachsen, Thüringen und Brandenburg“!"
