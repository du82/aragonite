title = "#RechtAufZukunft: Unsere Forderungen anlässlich der Bundestagswahl | Fridays for Future"
description = "Letzten Donnerstag haben wir unsere Forderungen zur Bundestagswahl veröffentlicht, denn wir brauchen jetzt dringend eine Regierung, die die ökologische Realität anerkennt und endlich konsequent ins Handeln kommt. Die Klimakrise ist die größte Herausforderung unserer Zeit. Das ist schon lange klar, aber das Klimakatastrophen-Jahr 2024 hat uns mit seiner Wucht erneut vor Augen geführt, wie drängend die"
full_description = "#RechtAufZukunft: Unsere Forderungen anlässlich der Bundestagswahl 13. Januar 202513. Januar 2025 von Greta in Gut zu wissen!, Neuigkeiten, Wir sind laut! 1 Letzten Donnerstag haben wir unsere Forderungen zur Bundestagswahl veröffentlicht, denn wir brauchen jetzt dringend eine Regierung, die die ökologische Realität anerkennt und endlich konsequent ins Handeln kommt. Die Klimakrise ist die größte Herausforderung unserer Zeit. Das ist schon lange klar, aber das Klimakatastrophen-Jahr 2024 hat uns mit seiner Wucht erneut vor Augen geführt, wie drängend die Lage ist. Diese Katastrophen sind nicht nur Vorboten dessen, was uns erwartet, wenn wir weiter untätig bleiben, sondern auch eine Erinnerung: Die Entscheidungen, die wir heute treffen, werden unser Leben in den nächsten Jahrzehnten formen. Um die Klimakrise zu bewältigen, sind eine Vielzahl an Maßnahmen und eine riesige gesamtgesellschaftliche Kraftanstrengung notwendig. Diese Forderungen sind bei weitem kein komplettes Klimaprogramm – das ist auch nicht ihr Anspruch. Sie zeigen vielmehr auf, wo die großen Hebel zur Bewältigung der Klimakrise und zum Gelingen einer gerechten Transformation liegen. Würden sie umgesetzt, wäre das ein Zeichen dafür, dass wir auf dem richtigen Weg sind. Hier stellen wir Euch unsere Forderungen kurz vor und erklären, was sie bedeuten. Zukunft machen: Klimaneutralität bis 2035. Wir haben ein unverhandelbares Recht auf Zukunft – ohne die schlimmsten Folgen der Klimakrise. Das haben Gerichte immer wieder bestätigt. Doch mit den deutschen Klimazielen steuern wir auf eine fast drei Grad heißere Welt zu (climateactiontracker). Als eines der Länder, die historisch am meisten zur Klimakrise beigetragen haben – wir sind auf dem unrühmlichen Platz 4 (statista) – und wirtschaftlich stark sind, ist Deutschland in der Verantwortung, global voranzugehen und einen gerechten Anteil an der Emissionsreduktion zu leisten. Deshalb fordern wir: Wir müssen unsere Emissionen ab jetzt konsequent reduzieren und Klimaneutralität bis 2035 erreichen. Das haben wir bereits 2019 gefordert und angesichts der eskalierenden Klimafolgen und der realitätsverkennenden Klimapolitik ist diese Forderung aktueller denn je. Ein klares Klimaneutralitäts-Ziel, das sich an einem global gerechten Beitrag zum Pariser Klimaabkommen orientiert, ist zentraler Baustein für Klimagerechtigkeit. Planbarkeit schaffen: Ein klarer Plan für den geordneten Gasausstieg bis 2035. Die Zukunft gehört den erneuerbaren Energien und die Zeit der fossilen Energien ist endgültig vorbei. Dennoch propagiert Deutschland Erdgas fatalerweise als Zukunftstechnologie. Die Investitionen in Gasinfrastruktur erzeugen „Lock-In-Effekte“, die Gas für Jahrzehnte fest in unser Energiesystem einbauen und uns dadurch den Weg zu einer konsequenten Energiewende verbauen (Kemfert et al, 2022). Dabei ist der Ausbau von Gasinfrastruktur weder aus Klimaschutz-Sicht noch aus wirtschaftlicher Perspektive sinnvoll (DUH, Kemfert et al, 2022): Erdgas ist in vielen Fällen klimaschädlicher als Kohle durch Methan- und CO2-Emissionen bei Förderung, Speicherung, Transport und Verbrennung (Howarth, 2014; Alvarez et al, 2012). Insbesondere importiertes Flüssiggas (LNG) weist eine katastrophale Klimabilanz auf: in einem 30-Jahres-Zeitraum ist es durchschnittlich 33% klimaschädlicher als Kohle (Howarth, 2024; Howarth, 2014). Energiewende bedeutet nicht nur Ausbau von Erneuerbaren, sondern braucht auch einen Plan für das Ende aller fossilen Energien. Dass es einen geplanten Kohleausstieg gibt, ist unser Teilerfolg. Jetzt braucht es auch einen klaren Plan für einen geordneten Ausstieg aus Erdgas bis spätestens 2035. Keine Fabrik, kein Kraftwerk und keine Industrie darf mehr ohne klaren Plan für einen geordneten Ausstieg weiterlaufen. Bezahlbarkeit sichern: Recht auf klimafreundliche Wärme und Mobilität. Die Klimawende funktioniert nur, wenn alle an ihr mitwirken können. Die meisten Menschen wollen Klimaschutz, niemand will mit seinem Verhalten die Zukunft kaputt machen – oder kaputt machen müssen. Trotzdem können es sich viele nicht leisten, selbst klimafreundlich zu leben. Es fehlt an finanzieller Unterstützung in einem auf fossile Energien ausgerichteten System. Der Weg zu einer nachhaltigen Wärme- und Mobilitätsversorgung darf für niemanden – unabhängig von Einkommen oder Wohnort – nicht bezahlbar sein. Im Moment scheitert die Einhaltung der deutschen Klimaziele an dreckigen Heizungen und zu vielen Autos: Wärme und Mobilität haben in den vergangenen Jahren ihre Klimaziele immer wieder verfehlt (UBA). Gleichzeitig sind sie mit einem Anteil von 36 % (Wärme: 2021 etwa 16 %, Verkehr 2022 etwa 20 %) an den Emissionen in Deutschland ein wesentlicher Faktor (UBA, Destatis, Destatis mit eigener Berechnung). Viel zu oft ist Klimazerstörung in diesen Sektoren der Standard. Die Transformation wird nur gelingen, wenn es genau andersrum ist: Klimaschutz muss bezahlbar und einfach sein – für alle Menschen. Wo das nicht automatisch möglich ist, muss der Staat mit einfachen und sozial gerechten Förderungen nachhelfen. Deshalb fordern wir: Eine Mobilitäts- und Wärmegarantie für alle. Das bedeutet: Alle Grundbedürfnisse müssen bezahlbar klimaneutral erfüllt werden können. Niemand sollte mehr gezwungen sein, mit fossilen Heizungen oder unzureichendem Nahverkehr zu leben. Investitionen in Fernwärme, ÖPNV, Schiene, das Verkehrsangebot im ländlichen Raum und die Ladeinfrastruktur für E-Autos sind zentral; gleichzeitig braucht es finanzielle Förderung von Privathaushalten, die sonst weiterhin von Fossilen abhängig bleiben würden. Diese Förderprogramme müssen natürlich an ökologische und soziale Bedingungen geknüpft sein (z.B. durch Preistransparenz, Versorgungspflicht, Klimaneutralität) (UBA). Kosten teilen: Superreichensteuer zur Finanzierung der Transformation. Der klimaneutrale und sozial gerechte Umbau von Infrastruktur, Industrien und Gesellschaft ist eine riesige Aufgabe. Es ist untragbar, dass die reichsten Menschen der Welt, die maßgeblich zur Klimakrise beitragen, sich ihrer Verantwortung entziehen. Superreiche verursachen nicht nur überproportional viele Emissionen, sondern profitieren oft auch noch von bestehenden fossilen Strukturen. Die reichsten 50 Billionäre der Welt befeuern die Klimakrise schlimmer als der allergrößte Teil der Menschheit. In 90 Minuten verursachen sie so viele Emissionen wie die durchschnittliche Person in ihrem ganzen Leben (Oxfam). Jede*r muss einen gerechten Beitrag zur Transformation leisten, aber die Superreichen machen das bislang nicht – im Gegenteil. Aktuell zahlen Milliardär*innen in Deutschland oft sogar deutlich weniger Steuern als durchschnittliche Bürger*innen (Greenpeace). Deshalb fordern wir: Superreiche besteuern, damit sie ihren fairen Beitrag zur Transformation leisten. Eine Vermögenssteuer für die reichsten 2000 Menschen in Deutschland mit über 100 Millionen Euro Vermögen könnte bis 2030 rund 200 Milliarden Euro generieren (Greenpeace) – Gelder, die dringend für den klimaneutralen Umbau unserer Gesellschaft benötigt werden. Menschen schützen: Ein Fonds für den Schutz vor den schlimmsten Folgen der Klimakrise. Schon heute zerstören Dürren ganze Ernten und Überschwemmungen Häuser und Straßen. Zwischen 2000 und 2021 sind so Schäden in Höhe von rund 145 Milliarden Euro durch die Klimakrise in Deutschland entstanden, bis 2050 werden weitere Schäden in Höhe von bis zu 900 Milliarden erwartet (IÖW). Während fossile Unternehmen Milliardenprofite auf Kosten unserer Lebensgrundlagen kassieren, fehlen Gelder für den Schutz von gefährdeten Regionen und die Unterstützung von Betroffenen. Deshalb fordern wir einen zentralen Fonds für Klimaanpassung und Katastrophenhilfe, finanziert durch eine Besteuerung fossiler Unternehmen. Durch so eine “Klimaschädensteuer” müssten allein die 21 klimaschädlichsten fossilen Konzerne bis 2050 rund 200 Milliarden Euro an Reparationen zahlen (DW). So kommen die Unternehmen für die von ihnen verursachten Schäden auf. Die US-Bundesstaaten New York und Vermont haben es vorgemacht (NBC) und auch in Deutschland muss das Verursacherprinzip gelten. Transformation gestalten: Jährlich 300.000 Personen in Zukunftsindustrien ausbilden. Die sozial-ökologische Transformation wird nur gelingen, wenn genug Menschen anpacken – etwa beim Aufbau erneuerbarer Energien, Einbau von Wärmepumpen oder Fahren von Bussen. Der Fach- und Arbeitskräftemangel droht, eine der größten Bremsen auf dem Weg zur Klimaneutralität zu werden (ZDH). Schon heute fehlen zehntausende Fachkräfte in Bereichen wie Gebäudetechnik, Elektromobilität und erneuerbare Energien. Arbeitsplätze in Zukunftsindustrien sind eine Perspektive für junge Menschen genauso wie für diejenigen, die in sich verändernden Branchen arbeiten. Die Transformation zur Klimaneutralität 2035 liegt in den Händen derer, die unser Energie- und Mobilitätssystem umbauen. Deshalb fordern wir: Eine Ausbildungsoffensive für jährlich 300.000 neue Leute in Zukunftsbranchen mit fairen Löhnen und guten Arbeitsbedingungen. Nur so kann die Transformation gelingen und langfristige Perspektiven für alle geschaffen werden (ZDH). Die Zahl von 300.000 ergibt sich aus einer Kombination unterschiedlicher Studien, die den Arbeitskräftebedarf für die Transformation in bestimmten Sektoren berechnen – meistens wird dort von einer Klimaneutralität 2040/45 ausgegangen, weswegen wir jeweils etwas höhere Zahlen für eine schnellere Transformation bis 2035 angesetzt haben: Bis zu 600.000 neue Arbeitsplätze im Ausbau erneuerbarer Energien (Umweltbundesamt, IHK); bis zu 1 Million neue Arbeitskräfte für energetische Sanierungen und klimaneutrale Heizsysteme (DUH); bis zu 500.000 Arbeitsplätze im Bereich Infrastruktur, Elektromobilität und öffentliche Verkehrsmittel (Wuppertal-Institut); 400.000 bis 500.000 zusätzliche Arbeitsplätze durch CO₂-freie Produktionsprozesse und Wasserstofftechnologie (Agora Energiewende); 200.000 bis 300.000 neue Arbeitskräfte für den Ausbau des Stromnetzes und Speicherkapazitäten (Fraunhofer-Institut für Solare Energiesysteme). Fazit: Unsere Forderungen sind ein Maßstab für eine Klimapolitik, die die Realität anerkennt und verantwortungsvoll unserer Gesellschaft umgeht Die nächste Bundesregierung wird eine Klimakatastrophen-Regierung. Sie muss beweisen, dass sie das Zeug dazu hat, uns durch eine Zeit im Wandel und im Umbruch zu lenken. Wir werden sie an ihren Taten messen, nicht an ihren Versprechen. Diese Forderungen sind unser Maßstab. Von allen demokratischen Parteien erwarten wir, dass sie sich im Wahlkampf und danach für unser Recht auf Zukunft einsetzen. Die Klimakrise kann nicht aufgeschoben oder wegdiskutiert werden – es ist Zeit zu handeln, für heute und für morgen. Greta ist Aktivistin bei Fridays for Future und hat die Forderungen maßgeblich mit ausgearbeitet. Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
