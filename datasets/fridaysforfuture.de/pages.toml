title = "Forderungen aus Sachsen-Anhalt | Fridays for Future"
description = "Die Klimakrise ist schon lange nicht mehr eine düstere Vision der Zukunft, sondern bittere Realität. Es ist 5 nach 12! Der menschengemachte Klimawandel ist 2021 nicht mehr zu leugnen und daraus resultierende Probleme sind in Sachsen-Anhalt spürbar und werden sich in den nächsten Jahren anhäufen. Extreme Wetterereignisse, Artensterben und Wasserknappheit sind in Sachsen-Anhalt, in Deutschland"
full_description = "Forderungen aus Sachsen-Anhalt Die Klimakrise ist schon lange nicht mehr eine düstere Vision der Zukunft, sondern bittere Realität. Es ist 5 nach 12! Der menschengemachte Klimawandel ist 2021 nicht mehr zu leugnen und daraus resultierende Probleme sind in Sachsen-Anhalt spürbar und werden sich in den nächsten Jahren anhäufen. Extreme Wetterereignisse, Artensterben und Wasserknappheit sind in Sachsen-Anhalt, in Deutschland sowie auf der ganzen Welt keine Einzelfälle mehr. Wir leben zurzeit auf Kosten der folgenden Generationen und anderer Länder und entfernen uns von einer enkeltauglichen Zukunft. Nun liegt es an Ihnen, sich mit uns gemeinsam für eine gerechte und lebenswerte Zukunft einzusetzen. Jetzt ist es an der Zeit zu handeln. Deutschland und viele weitere Länder haben das Pariser Klimaabkommen unterzeichnet und sich somit verpflichtet, die Erderwärmung auf deutlich unter 2 °C, vorzugsweise 1,5 °C, zu begrenzen im Vergleich zu 1990. Leere Wahlversprechen, Beschwichtigungen und mutloses Agieren sind jedoch leider an der Tagesordnung und damit ein sicherer Weg in die Klimakrise. Auch das Bundesverfassungsgericht hat uns mit seiner Entscheidung im Mai 2021 ein Recht auf Zukunft zugesprochen. Bundesweit fordert Fridays for Future noch immer den Kohleausstieg bis 2030, Klimaneutralität bis 2035 und eine 100-prozentige Energieversorgung durch erneuerbare Energien bis 2035. Sachsen-Anhalt muss jetzt seiner Rolle gerecht werden, einen Beitrag zum Erhalt des Planeten zu leisten. Das Land Sachsen-Anhalt muss sich bundesweit für einen raschen Weg zur Klimaneutralität aussprechen und vor allem dementsprechend selbst Maßnahmen ergreifen. Deswegen stellen wir von Fridays for Future Sachsen-Anhalt konkrete Forderungen, die die Landesregierung umsetzen muss und laut der Studie des Wuppertal Institutes auch kann. Alle Wahlprogramme und -parolen werden sich daran messen lassen müssen. Wir fordern hiermit alle Landespolitiker*innen auf, die folgenden Maßnahmen sofort umzusetzen oder weitere angemessene Maßnahmen in Gang zu bringen. Der Forderungskatalog ist hierbei dynamisch und kann noch um weitere Forderungen ergänzt werden. Alle umzusetzenden Maßnahmen müssen hierbei sozialverträglich sein. Die Forderungen als PDF downloaden K E R N F O R D E R U N G E N Ausbau erneuerbarer Energiequellen und Stopp der Subventionierung von fossiler Energieversorgung Förderung von klimaneutralen Technologien Umsetzung einer 1,5 °C-kompatiblen Land- und Forstwirtschaft bis spätestens 2035 Umgestaltung der Wälder hin zu klimakrisenfesten Laub – und Mischwäldern Ausweitung der Naturschutzgebiete Ausbau von ÖPNV, Fahrrad- und Fußwegen in Stadt und Land, sicherere Fahrradwege Stopp des Autobahnausbaus Klimawandel, Klimagerechtigkeit und Nachhaltigkeit als festen Bestandteil des Schulunterrichts Zentrale Koordinationsstelle für Klimaschutz Einrichtung einer dauerhaften Bürger*innenbeteiligung Diese 10 Punkte stellen eine stark gekürzte Version unsere Forderungen dar, die ausführliche Version auf den folgenden Seiten beinhaltet neben den vollständigen Forderungen eine Begründung zur Notwendigkeit der jeweiligen Forderungen. E N E R G I E 1) Ausbau Erneuerbarer Energien Wir fordern den konkreten Ausbau erneuerbarer Energiequellen. An den Erlösen, die die lokalen Unternehmen am Ertrag alternativer Energieversorgung machen, sollen die Kommunen beteiligt werden. Außerdem sollen lokale Genossenschaften bevorzugt werden, damit die Menschen vor Ort davon profitieren können. Sachsen-Anhalt kann bundesweit Vorreiter bei der kompletten Eigenversorgung mit regenerativen Energien werden. Zudem fordern wir, dass sich das Land in Zukunft für bundesweite Regelungen für den Ausbau erneuerbarer Energien und gegen bundesweite Subventionen fossiler Energien einsetzt. Um Unternehmen und Privatpersonen die Umstellung auf erneuerbare Energien zu erleichtern, fordern wir außerdem eine Beratung und vereinfachte Informationsvermittlung über die Energieversorgungsmöglichkeiten. Weiterhin muss es eine Beratungsmöglichkeit geben, wie der Energieverbrauch von Unternehmen und Privatpersonen gesenkt werden kann. 2) Stopp fossiler Subventionen Wir fordern, dass das Land Sachsen-Anhalt sämtliche Subventionen fossiler Energiequellen und Technologien sofort einstellt. Fossile Energiequellen wie Erdöl, Erdgas oder Kohle sind keine Energieträger, die einen Weg aus der Klimakrise bieten, sondern diese durch hohe CO2-Emissionen beschleunigen. Die Subventionierung fossiler Energieversorgung muss deswegen vom Land umgehend gestoppt werden. 3) Grüner Strom für öffentliche Gebäude Wir fordern, dass alle Gebäude in öffentlicher Hand so schnell, wie laufende Verträge einen Wechsel erlauben, mit grünem Strom versorgt werden. In sämtlichen Ausschreibungen dürfen ab sofort nur noch Angebote mit 100% grünen Strom in Betracht gezogen werden. Das Land muss so seiner Vorreiterrolle gerecht werden. Wir fordern außerdem, dass Gebäude, die nicht direkt in öffentlicher Hand liegen, wie private (Hoch-)Schulen und Universitäten, bei der Umstellung unterstützt werden. Dies kann durch Förderungen, Beratung oder Handlungsempfehlungen erfolgen. 4) Unterstützung lokaler Versorger Wir fordern die Unterstützung der lokalen Versorger, insbesondere der Stadtwerke, bei der Umstellung zur Klimaneutralität. Dabei fordern wir echte grüne Tarife, d.h. dass die gesamte benötigte Energie von lokalen Versorgern selbst produziert wird und auf keinerlei fossile Energieträger zurückgegriffen wird. Vom Land Sachsen-Anhalt muss dazu ein Energieleitplan bereitgestellt und eine Förderpolitik zur Unterstützung einer klimaneutralen Umstellung etabliert werden. Diese Umstellung bietet für viele Haushalte eine vereinfachte Grundlage, auf erneuerbaren, nicht fossilen Strom zurückzugreifen. I N D U S T R I E 1) Reduktion CO2-Ausstoß Wir fordern eine Klausel, die besagt, dass das Land bei größeren Investitionen besonders Unternehmen mit geringem CO2-Ausstoß unterstützt. Dies kann z.B. durch klimafreundliche und nachhaltige Förderprogramme für Technologien, Wirtschafts- und Forschungsförderung gelingen. Dafür würden Regelungen im Klimaschutzgesetz und Vergabekriterien bei öffentlichen Ausschreibungen wie Tariftreue, Nachhaltigkeit und Fairer Handel einenAnsatzpunkt darstellen. Wir fordern weiterhin eine Industriestrategie zur Klimaneutralität 2035: Alle neu zubauenden Anlagen müssen klimaneutral sein. Nicht-klimaneutrale Anlagen müssen bis 2035 stillgelegt oder entsprechend umgebaut werden. Es muss eine Kreislaufwirtschaft zur Reduzierung des Ressourcenverbrauchs aufgebaut werden. Die Industriestrategie muss auch eine Wasserstoff-Strategie beinhalten. 2) Beratung Außerdem fordern wir eine aktive Beratung der Unternehmen zur Minimierung des CO2-Ausstoßes. Durch diese Maßnahme kann Sachsen-Anhalts Wirtschaft eine Vorreiterrolle in Deutschland einnehmen. 3) Förderung Wir fordern weiterhin, dass lokale Wertschöpfungsketten, wie zum Beispiel die Windkraft und Photovoltaikindustrie, sowie die damit verbundenen lokalen Fachkräfte und Arbeitsplätze, gefördert werden. 4) Lobbyarbeit Weiterhin fordern wir vom Land Sachsen-Anhalt mehr bundesweite Lobbyarbeit für eine klimaneutrale Industrie. L A N D W I R T S C H A F T & F O R S T W I R T S C H A F T 1) 1,5 °C-kompatible Land– und Forstwirtschaft Wir fordern die Umsetzung einer 1,5 °C-kompatiblen Land– und Forstwirtschaft bis spätestens 2035, damit unsere Ernährung sowie unsere Biodiversität auch in Zukunft gesichert sein werden. Besonders in Sachsen-Anhalt leiden die Böden und Felder schon jetzt an den Folgen der Erderwärmung die global bereits um 1,2°C im Vergleich zur vorindustriellen Zeit vorangeschritten ist. Die extremen Dürren der letzten Jahre bedeuten für die landwirtschaftlichen Betriebe ausgetrocknete Böden, geringe Wasserspeicherkapazität, sinkende CO2-Speicherkraft und somit einen enormen Ernteverlust. Millionenbeträge mussten bereits als Nothilfe an Landwirtinnen fließen. Eine 1,5 °C-kompatible Agrarindustrie kann diesen Entwicklungen entgegentreten, erfordert jedoch eine Vielzahl verschiedener Maßnahmen und Lösungsansätze. Unabhängig davon rufen wir das Land auf, sich in allen Bereichen der Agrarindustrie für eine nachhaltige und 1,5 °C-kompatible Land– und Forstwirtschaft einzusetzen, und sowohl gerechte als auch wirkungsvolle Maßnahmen in die Wege zu leiten. 2) Stärkung der ökologischen Landwirtschaft Wir fordern, dass eine nachhaltige Landwirtschaft mit einem Anteil von mind. 30% ökologischer Landwirtschaft eine finanzielle Förderung des Landes erhält, sodass dieser Anteil spätestens im Jahr 2035 erreicht wird. Des Weiteren fordern wir die Vereinfachung der Bürokratie sowohl bei ökologischer als auch bei konventioneller Landwirtschaft, um die Umstellung auf eine ökologische Landwirtschaft schneller umsetzen zu können. 3) Regionale, saisonale und nachhaltige Produkte fördern Wir fordern eine massive Förderung regionaler, saisonaler und nachhaltiger Produkte sowie einen Umschwung im Kantinenangebot unserer Schulen und in anderen öffentlichen Einrichtungen. Dieser soll in Zukunft auf eine Kombination von Fleischreduktion und erhöhter Nachhaltigkeit setzen. 4) Verpachtung von landeseigenen Flächen Wir fordern, dass die Verpachtung landeseigener Flächen an die Kriterien der 1,5 °CKompatibilität geknüpft ist. Jene beinhalten den Schutz der Biodiversität und des saisonalen, regionalen und nachhaltigen Anbaus. Eine Umorientierung der Landwirtschaft führt zu weniger Futtermittelerzeugung und mehr Pflanzen für den direkten Gebrauch. Auch die Umsetzung von Tierwohl- sowie Düngeregularien sind für eine zukunftsfähige Landwirtschaft dringend notwendig. 5) Beratungsstelle zur nachhaltigen Landwirtschaft und Neugestaltung der Lebensräume Wir fordern eine aktive Beratung zur nachhaltigen Landwirtschaft und Neugestaltung der Lebensräume des Landes Sachsen-Anhalt. Dazu benötigt es eine öffentliche Beratungsstelle. Die Kommunen und Landkreise sollen dabei unterstützt werden, ihre Umgebung mit klimaresilienten Pflanzen auszustatten und Lebensräume grüner zu gestalten. Hierbei erwarten wir auch, dass lokale Unternehmen und Forschungsinstitutionen, wie das Institut für Pflanzengenetik und Kulturpflanzgenetik, mit ihren Innovationen und Maßnahmen für eine zukunftsfähige Land– und Forstwirtschaft stark gefördert werden, sodass auch die Region davon profitiert. 6) Umgestaltung der Wälder zu klimakrisenfesten Laub- und Mischwäldern Wir fordern die Umgestaltung der Wälder im Land hin zu klimakrisenfesten Laub– und Mischwäldern. Damit sind sie gegen die zunehmenden Dürreperioden und Wasserknappheiten gerüstet. Unser Wald leidet schon jetzt massiv unter der Erderwärmung. Im Harz erleben wir ein flächendeckendes Waldsterben und Waldbrände werden sich häufen. 7) Ausweitung der Naturschutzgebiete Wir fordern eine Ausweitung der Naturschutzgebiete. Hierdurch werden die Biodiversität, die Artenvielfalt sowie die wichtigen CO2-Speicher unserer Erde geschützt und gestärkt. Biodiversität ist die Grundlage allen Lebens. 8) Nutzung des Vorkaufrechts durch das Land Wir fordern, dass das Land Sachsen-Anhalt sein Vorkaufsrecht auf die Flächen in der Region nutzt und Verpachtung oder Verkauf an 1,5 °C-kompatible Kriterien knüpft. Durch diese Maßnahme wird das Ziel einer klimaneutralen und nachhaltigen Landwirtschaft unterstützt. 9) Positionierung und Lobbyarbeit in Deutschland und der Europäischen Union Wir fordern, dass sich das Land Sachsen-Anhalt und insbesondere die Regierung auf allen politischen Ebenen klar für eine nachhaltige Landwirtschaft positionieren. Sie muss aktiv dafür eintreten, dass wir das 1,5 °C- Ziel auch in der Landwirtschaft einhalten können. Wir erwarten dabei Lobbyarbeit in allen Entscheidungen für eine nachhaltige und zukunftsfähige Land– und Forstwirtschaft. V E R K E H R 1) Ausbau alternativer Verkehrsmöglichkeiten Wir fordern den Ausbau und die Umgestaltung bisheriger Verkehrsstrukturen, die eine Alternative zum Auto darstellen (z.B. Bahn, Bus, Rad). Der Ausbau muss vor allem auch im ländlichen Raum stark ausgeführt werden, um einen Anschluss an andere Orte zu gewährleisten. Bei allen Maßnahmen sollten langfristige Mobilitätskonzepte erstellt bzw. einbezogen werden. 2) Einsatz zur Zusammenarbeit aller Verkehrsverbünde Wir fordern, dass das Land eine Zusammenarbeit aller Verkehrsverbünde in Sachsen-Anhalt initiiert. Die Zusammenarbeit soll ein einheitliches Konzept zum Ausbau der Infrastruktur und zur besseren Fahrplanabstimmung beinhalten. Weiterhin ist die Entwicklung einheitlicher und sozialverträglicher Ticketpreise notwendig. 3) Stärkung umweltverträglichen Güterverkehrs Wir fordern, dass der Güterverkehr auf der Schiene und auf dem Wasser flächendeckend gestärkt wird, beispielsweise durch Förderungen und Reaktivierung der vorhandenen Infrastruktur. Dementsprechend muss ein weitreichendes Konzept zum Ausbau entwickelt und umgesetzt werden. 4) Ausbau des ÖPNV Wir fordern einen flächendeckenden und bedarfsgerechten Ausbau des Angebotes des ÖPNV, sowohl in den Städten als auch im ländlichen Raum. Der Mangel an Beschäftigten und die schlechten Arbeitsbedingungen im ÖPNV sind schwerwiegende Probleme. Hier müssen Finanzierungs- und Investitionshürden überwunden und der Nachwuchs massiv gefördert werden. Nur gemeinsam kann die Verkehrswende gelingen. 5) Günstige Tickets Wir fordern für alle Bevölkerungsgruppen erschwingliche Tarife der öffentlichen Verkehrsmittel, wenn möglich kostenlos. Dadurch steigt die Attraktivität des ÖPNV. Des Weiteren ist eine Zusammenarbeit zwischen dem Land und den Verkehrsverbünden für ein Ticket, das das Reisen zwischen den verschiedenen Tarifzonen kostengünstig ermöglicht, notwendig. Dazu wird das Reisen innerhalb Sachsen-Anhalts durch diese Maßnahmen attraktiver, was ebenfalls eine positive Auswirkung auf den Tourismus hat. 6) Unterstützung von autoarmen Gebieten Wir fordern, dass das Land durch diverse Maßnahmen die Kommunen bei der Entwicklung von Konzepten für autoarme Gebiete unterstützt. Zudem sollte die praktische Umsetzung dieser zur Neugestaltung von Lebensräumen in der Stadt begünstigt werden. Dadurch ergeben sich Räume für alternative Verkehrsmöglichkeiten in den Orten von Sachsen-Anhalt. Diese Forderung betrifft alle Kommunen, sowohl Städte als auch Orte im ländlichen Raum. 7) Ausbau der Radinfrastruktur Wir fordern den Ausbau sowie eine Verbesserung der Radinfrastruktur sowohl in ländlichen Bereichen als auch in Städten. Weiterhin sollte eine dauerhafte Instandhaltung der Radinfrastruktur sichergestellt werden. Es darf keine Straße mehr ohne Radweg geben. Es müssen Radparkhäuser gebaut und der Fahrbelag verbessert werden. Zusätzlich fordern wir die Verbesserung der Sicherheit auf Fahrradwegen, zum Beispiel durch leicht erhöhte oder farblich abgegrenzte Radwege. Auch Fußwege sind auszubauen. 8) Verminderung des Autoverkehrs Wir fordern, dass das Land die Investitionen für den Ausb"
