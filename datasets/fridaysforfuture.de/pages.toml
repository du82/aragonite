["https://fridaysforfuture.de/es-bleibt-ein-drama-cop-daily-tag-13"]
title = "ES BLEIBT EIN DRAMA | COP DAILY TAG 13 | Fridays for Future"
description = "Die Uhr tickt! 24 Stunden nach dem offiziellen Ende der 29. Klimakonferenz (COP) gibt es immer noch keine Fortschritte und das Klopapier wird langsam knapp. Dass die Verhandlungen ein paar Stunden verlängert werden, ist schon oft passiert, aber dass sich selbst einen Tag nach dem geplanten Ende kein Kompromiss abzeichnet, ist einmalig. Das liegt wohl"
full_description = "ES BLEIBT EIN DRAMA | COP DAILY TAG 13 23. November 2024 in Gut zu wissen!, Klimaupdate, Neuigkeiten Mit COP Daily, COP29 getagged Die Uhr tickt! 24 Stunden nach dem offiziellen Ende der 29. Klimakonferenz (COP) gibt es immer noch keine Fortschritte und das Klopapier wird langsam knapp. Dass die Verhandlungen ein paar Stunden verlängert werden, ist schon oft passiert, aber dass sich selbst einen Tag nach dem geplanten Ende kein Kompromiss abzeichnet, ist einmalig. Das liegt wohl auch daran, dass Aserbaidschan die Verhandlung schlecht leitet. So wird der Präsidentschaft der COP zum Beispiel vorgeworfen, dass Vorschläge von Minister*innen anderer Länder nicht in die Dokumente aufgenommen werden. Während auf dem COP-Gelände schon die Restaurants schließen und die kostenlosen Shuttlebusse weniger fahren, gehen die schwierigen Verhandlungen Tag und Nacht weiter. DER AKTUELLE ENTWURF: EINE KATASTROPHE Heute Mittag hat der COP Präsident den dritten Entwurf für die Abschlusserklärung vorgelegt. 300 Milliarden USD jährlich, statt der gestern vorgeschlagenen 250 Milliarden, sollen es nun sein. Das ist noch immer viel zu wenig. Länder, die besonders von der Klimakrise betroffen sind, haben pro Jahr 500 Milliarden von den Industrienationen gefordert. Insgesamt werden 1,3 Billionen USD jährlich gebraucht, um angemessen auf die Klimakrise reagieren zu können. Dabei muss betont werden: Die 1,3 Billionen sind nicht einfach eine vermessene Forderung der ärmeren Länder. Eine unabhängige UN-Expert*innengruppe hat berechnet, dass es genau so viel Geld braucht, um das Schlimmste zu verhindern und Menschenleben zu schützen.Der aktuelle Abschlussentwurf ruft explizit auch private Investor*innen wie Banken und Konzerne auf, zu den 300 Milliarden etwas beizutragen. Dabei hatten ärmere Länder von Anfang an gefordert, dass Investitionen und Kredite nicht Teil der Klimafinanzierung sein dürfen. Oftmals profitieren vor allem diejenigen von Investitionen, die sie selbst tätigen. Zudem werden Investitionen häufig mit neokolonialen Strukturen in Verbindung gebracht. Kredite führen zu hohen Verschuldungen, was offensichtlich keine Hilfe ist.Auch China und die Golfstaaten werden dazu aufgefordert, einen Beitrag zu leisten – verpflichtend ist das aber nicht. So sind wir also keinen Schritt weiter als gestern. DIE GROSSEN BLOCKIERE Saudi-Arabien ist aktuell das bockige Kind am Verhandlungstisch. Nachdem die Saudis letzte COP einen herben Rückschlag kassiert haben, weil gegen ihren Willen die Abkehr der fossilen Energien beschlossen wurde, wollen sie jetzt die Uhr zurückstellen und blockieren alles, was mit dem Ausstieg fossiler Energien zu tun hat. Der Guardian berichtet sogar, dass Saudi-Arabien ein Dokument verfälscht haben soll. Dabei geht es um den Beschlussentwurf des „Just Transition Work Program“ (JTWP). Dieses Programm soll Ländern bei der Transformation hin zu nachhaltigen Energieträgern helfen. Die Saudis verdienen allerdings viel Geld damit, dass andere Länder auf fossile Energie aus Saudi-Arabien angewiesen sind. Jetzt hat ein Delegierter des saudischen Energieministeriums einen Absatz aus dem JTWP-Entwurf gelöscht, in dem Länder dazu aufgerufen werden, den Energiesektor in Einklang mit ihren nationalen Klimazielen zu bringen. Der Verdacht, dass die beiden Blockierer Aserbaidschan und Saudi-Arabien unter einer Decke stecken, wird immer lauter. Sollte Aserbaidschan wirklich erlaubt haben, die Passage zu löschen, wäre das ein großer Vertrauensverlust für die diesjährige COP. Im aktuellen Abschlussentwurf ist von einem fossilen Ausstieg jedenfalls konkret nicht die Rede. Bleibt das so, wäre das ein massiver Rückschritt im Vergleich zur letzten COP, auf der der Ausstieg aus fossilen Energien beschlossen wurde. “WIR WURDEN NICHT GEHÖRT” Aus Protest gegen den katastrophalen Abschlussentwurf hat viele Delegationen, darunter die Allianz kleiner Inselstaaten, den Verhandlungssaal heute verlassen. “Wir wurden nicht gehört”, begründete der Unterhändler Cedric Schuster im Namen der Allianz der kleinen Inselstaaten (AOSIS). Trotzdem sieht inzwischen auch die UN den neuen Entwurf mit 300 Milliarden als möglichen Kompromiss. Das wäre ein Schlag ins Gesicht der Länder, die von der Klimakrise am stärksten betroffen sind. Sie leiden am meisten, emittieren am wenigsten und werden jetzt von der Verantwortlichen im Stich gelassen.Über 300 internationale NGOs haben die ärmeren Länder jetzt aufgefordert, die Verhandlungen abzubrechen, falls kein neues Klima-Finanzierungsziel beschlossen wird. Kein Beschluss sei besser als ein schlechter.Die COP 29 droht zu scheitern und ohne Abschlusserklärung zu enden, das ist vor ein paar Wochen schon bei der UN-Biodiversitätskonferenz (COP16) passiert. WAS JETZT? Da die COP-Präsidentschaft die besonders von der Klimakrise betroffenen Länder überhört, trafen sich nun die Delegation der EU mit den Inselstaaten und afrikanischen und südamerikanischen Delegationen. Außenministerin Annalena Baerbock, die die deutsche Delegation anleitet, hat dazu heute gesagt: “Hier auf der Klimakonferenz in Baku befinden wir uns in der Mitte eines geopolitischen Machtspiels […]. Wir Europäer werden nicht zulassen, dass die verletzlichsten Staaten auf der Welt, insbesondere die kleinen Inselstaaten, von einigen der neuen fossilen und reichen Emittenten jetzt hier über den Tisch gezogen werden. Und das im Zweifel auch noch auch mit Rückendeckung der COP-Präsidentschaft” Am späten Abend hat nun das Abschlussplenum begonnen – mit den am stärksten von der Klimakrise betroffenen Ländern. Nachdem diese am Nachmittag das Plenum verlassen haben, erklären sie sich nun doch bereit, die Verhandlungen fortzusetzen, aber nur unter der Bedingung, dass die aserbaidschanische Präsidentschaft der COP ihre Anliegen nicht ignoriere. Verhandelt werden jetzt aber erstmal nur entscheidungsreife Punkte – das Streitthema Finanzierung wird zunächst ausgespart. Die Verhandlungen werden sich wahrscheinlich noch weit in die Nacht ziehen, es wird vermutet, dass die COP29 morgen zu einem Ende kommt. Jetzt bleibt uns nur noch zu hoffen, dass die Delegierten auf COP ihre Verantwortung und die Klimakrise ernst nehmen und dass sie nicht unnötig das Leben vieler Menschen und unsere Zukunft gefährden.ES BLEIBT EIN DRAMA | COP DAILY TAG 13 Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
