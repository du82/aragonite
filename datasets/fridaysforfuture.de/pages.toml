description = "Hier schreiben wechselnde Autor*innen der Klimagerechtigkeitsbewegung über das Klima, den Kampf für echten Klimaschutz und ihre Perspektiven auf eine klimagerechte Zukunft. In Interviews und Kolumnen geben wir Menschen eine Stimme, die oft kein Gehör finden. In Hintergrundartikeln bringen wir Dir die harten Fakten der Klimakrise näher und in unserem zweiwöchentlichen Klima-Update fassen wir zusammen, was klimapolitisch so passiert ist. Das und noch viel, viel mehr gibt es hier: im Fridays for Future-Blog! Dein Kontakt zur Redaktion: newsletter@fridaysforfuture.de - Seite 39"
full_description = "Großstreik am 25.01. in Berlin 20. Januar 201920. April 2019 in Neuigkeiten In Berlin tagt am 25.01. die Kohlekommission, die einen schnellen Kohleausstieg beschließen kann. Das passiert aber nicht von alleine. Daher werden wir vor Ort sein und der Kommission lautstark zeigen, dass wir in Deutschland keine Zeit mehr für fossile Brennstoffe haben, weil sie unsere Zukunft verbauen. Wir streiken am Freitag, den 25.01. um 12:00 Uhr vor … Weiterlesen über „Großstreik am 25.01. in Berlin“! Freitag 18.01. 18. Januar 201920. April 2019 in Neuigkeiten Hey, unser Streik am 18.01.2019 war mit über 30000 Teilnehmern ein riesen Erfolg! „Wir sind hier wir sind laut, weil ihr uns die Zukunft klaut!“ Eine überwältigende Anzahl von über 30.000 SchülerInnen, Studierenden und Azubis auf den Straßen sind ein eindeutiges Zeichen: Die Klimabewegung … Weiterlesen über „Freitag 18.01.“! Rede von Henrik Peitsch 18. Januar 201921. Mai 2019 in Neuigkeiten Während unseres FridaysForFuture Klimastreiks am 18.01.2019 in Osnabrück hat Herr Henrik Peitsch als Vertreter der Gewerkschaft Erziehung und Wissenschaft (GEW) des Kreisverbandes Osnabrück-Stadt am Platz der Deutschen Einheit in Osnabrück eine sehr motivierende und bekräftigende Rede vor den streikenden Schüler*innen, Studierenden und Azubis gehalten. Wir danken ihm dafür vielmals! Liebe Schülerinnen und Schüler, meine Name ist … Weiterlesen über „Rede von Henrik Peitsch“!"
