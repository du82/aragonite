tenrat für Klimafragen seinen Bericht veröffentlicht. Carla Reemtsma, Sprecherin von Fridays for Future, kommentiert den Bericht: „Der Bericht des Expertenrat zeigt mit aller Klarheit: Klimaschutz ist eine Frage des politischen Willens. Der schnelle Ausbau der Erneuerbaren Energien in den vergangenen Jahren hat die Emissionen deutlich gesenkt – aber in den Sektoren, in … Weiterlesen über „PM: Statement zum Bericht des Expertenrat für Klimafragen“!"
