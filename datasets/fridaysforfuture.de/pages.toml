title = "Die Ampel ist Geschichte – wir die Zukunft! | Fridays for Future"
description = "Wir waren über 130.000 Menschen an über 150 Orten in ganz Deutschland! Wir waren gemeinsam laut, um für Klimagerechtigkeit und unser Recht auf Zukunft einzustehen. Zur Pressemitteilung! Klimastreik am 14. Februar! Nachdem die ehemalige “Fortschrittskoalition” sich monatelang nur noch an sich selbst abgearbeitet und die Augen vor der politischen Realität verschlossen hat, heißt es jetzt:"
full_description = '''Die Ampel ist Geschichte – wir die Zukunft! Wir waren über 130.000 Menschen an über 150 Orten in ganz Deutschland! Wir waren gemeinsam laut, um für Klimagerechtigkeit und unser Recht auf Zukunft einzustehen. Zur Pressemitteilung! Klimastreik am 14. Februar! Nachdem die ehemalige “Fortschrittskoalition” sich monatelang nur noch an sich selbst abgearbeitet und die Augen vor der politischen Realität verschlossen hat, heißt es jetzt: Die Ampel ist Geschichte! Nachdem Lindner angekündigt hat, die deutschen Klimaziele abschaffen zu wollen, ist natürlich niemand traurig darüber, dass Scholz die FDP aus der Regierung wirft. Klar ist jedoch, es ist keine Zeit für Illusionen – jetzt wird nicht einfach alles besser. Spanien steht unter Wasser, die Welt steuert auf 3,1 Grad Klimaerhitzung zu, ein Faschist wird Präsident der USA und das alles wenige Tage vor der Weltklimakonferenz in Baku – der Weltschmerz könnte nicht größer sein. Nicht nur, dass die Klimakrise in den letzten Monaten kaum eine Rolle gespielt hat, noch viel schlimmer, die öffentliche Debatte drehte sich nahezu nur um die Themen der Rechten. Überlassen wir ihnen weiter die Bühne, drohen uns bei der Bundestagswahl ähnliche Wahlergebnisse wie in Brandenburg, Sachsen und Thüringen. Eine vorgezogene Bundestagswahl bedeutet eine vorgezogene Entscheidung über unsere Zukunft. Es steht viel auf dem Spiel: Wir können gewinnen – aber auch alles verlieren. Darum ist jetzt klar: Wir müssen über das sprechen, was wirklich zählt. Für eine gerechte, friedliche Welt müssen wir die Klimakrise eindämmen. Dafür brauchen wir Parteien, die Klimaschutz ernst nehmen – unabhängig davon, ob gerade Wahl ist oder die nächste Hitzewelle kommt. Und dafür brauchen wir ernsthafte Gespräche übers Klima. Lasst uns auf die Straßen gehen, die Debatte zurückerobern und gemeinsam für eine lebenswerte Zukunft kämpfen. Deshalb rufen wir zum bundesweiten Klimastreik vor der Wahl auf – am Freitag, 14. Februar 2025 überall in Deutsc