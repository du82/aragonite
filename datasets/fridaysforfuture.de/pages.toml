title = "2024 – der Klima-Rückblick! | Fridays for Future"
description = "Das Jahr 2024 ist vorbei. Zeit, zurückzublicken. Denn im letzten Klima-Katastrophen-Jahr ist so einiges passiert. Hitzerekorde, Extremwetterereignisse und politische Entscheidungen prägten die Schlagzeilen. Doch neben den Herausforderungen gab es auch Hoffnungsschimmer. Hier gibt es den kurzen und knackigen Überblick. Januar: Nach Straßenblockaden von Landwirt:innen nimmt die Bundesregierung die geplanten Kürzungen für Fahrzeuge teilweise zurück. Um knapp"
full_description = "2024 – der Klima-Rückblick! 3. Januar 20253. Januar 2025 in Klimaupdate, Neuigkeiten Das Jahr 2024 ist vorbei. Zeit, zurückzublicken. Denn im letzten Klima-Katastrophen-Jahr ist so einiges passiert. Hitzerekorde, Extremwetterereignisse und politische Entscheidungen prägten die Schlagzeilen. Doch neben den Herausforderungen gab es auch Hoffnungsschimmer. Hier gibt es den kurzen und knackigen Überblick. Januar: Nach Straßenblockaden von Landwirt:innen nimmt die Bundesregierung die geplanten Kürzungen für Fahrzeuge teilweise zurück. Um knapp eine Milliarde Euro jährlich mehr einzunehmen sollte die Steuervergünstigung für Diesel wegfallen und eine Kfz-Steuer eingeführt werden – die wird aber erstmal nicht kommen. Februar: Erstmals lag die globale Temperatur 12 Monate in Folge über der Grenze von 1,5°C – das Pariser Klimaziel ist damit aber noch nicht gebrochen. Die Menschheit bewege sich damit noch schneller auf die Grenzen zu, die im Pariser Abkommen vereinbart wurden. Überschritten wäre das 1,5°C-Limit aber erst, wenn die Temperatur über einen Zeitraum von 20 Jahren darüber liegt. März: Die weltweiten CO2-Emissionen im Energiebereich sind 2023 auf einen neuen Höchststand gestiegen. Wegen dem Ausbau erneuerbarer Quellen fiel das Wachstum mit 1,1 Prozent aber niedriger aus als in den Vorjahren. Zunehmende Hitze und Dürren sorgten dafür, dass weltweit weniger Energie aus Wasserkraft gewonnen wurde. Auch das chinesische Wirtschaftswachstum führte zu höheren Emissionen. Ab dem nächsten Jahr muss der Ausstoß im Energiesektor kontinuierlich sinken. April: Die Ampel-Fraktionen haben die Abschwächung des Klimaschutzgesetzes beschlossen – verbindliche Sektorenziele sind damit Geschichte. Sobald das Gesetz rechtskräftig ist, müssen die Ministerien keine Sofortprogramme mehr vorlegen, wenn ihr Bereich zu viele Emissionen ausstößt: eines der bisherigen Kernstücke des Gesetzes. Handeln müssen sie erst, wenn zweimal nacheinander prognostiziert wird, dass die Regierung ihre Klimaziele für 2030 verfehlt. Das bisherige Gesetz wurde 2019 unter dem Druck der Klimabewegung von SPD und Union verabschiedet. Mai: Schwere Unwetter stürzen das Saarland und Teile von Rheinland-Pfalz ins Chaos. Mancherorts fielen innerhalb eines Tages über 100 Liter Regen pro Quadratmeter – mehr als im gesamten April im Saarland zuvor. Solche Starkregenlagen kommen durch den Klimawandel immer häufiger vor. Juni: Bei der Pilgerfahrt nach Mekka sind laut offiziellen Angaben mehr als 1.300 Menschen an den Folgen der Hitze gestorben. Bereits in der Vergangenheit gab es wegen extremer Temperaturen immer wieder Tote – diesmal lag die Anzahl wegen Temperaturen von über 51°C aber ungewöhnlich hoch. Kritiker:innen machen fehlende Schutzmaßnahmen durch die Regierung Saudi-Arabiens mitverantwortlich. Die fünftägige Pilgerfahrt „Hadsch“ zählt zu den fünf Säulen des Islam und gilt als eine der größten religiösen Versammlungen der Welt. Juli: Das 49-Euro-Ticket soll ab nächstem Jahr teurer werden. Das beschlossen die Verkehrsminister:innen der Bundesländer. Die Ankündigung kommt, obwohl der Bund die notwendigen Gelder bereit stellt. Verbände wie ProBahn warnen davor, das Ticket zu verteuern, damit es seine Wirkung nicht verfehlt. Seit Einführung des 49-Euro-Tickets sind die Emissionen im Verkehrssektor um fünf Prozent gesunken. August: Der Ausbau der Photovoltaik in Deutschland boomt. Im April waren rund 3,4 Mio. Solaranlagen installiert, fast 30 Prozent mehr als im Vorjahr. Der Anstieg komme insbesondere von Gewerbe-Dächern. Umweltverbände begrüßen die Entwicklung, fordern perspektivisch aber eine Solarpflicht für alle Dächer. September: Heftige Überschwemmungen setzen mehrere europäische Länder unter Wasser und sind nun auch für Deutschland angekündigt. Hunderttausende waren ohne Strom, Straßen und Zugstrecken mussten gesperrt werden. Das Sturmtief zog unter anderem durch Polen, Tschechien, Österreich und Rumänien, wo mehrere Menschen an seinen Folgen starben. Oktober: Mit den aktuellen Maßnahmen steht der Menschheit eine 2,4°C heißere Welt bevor, so die Internationale Energieagentur IEA. Die weltweit führende Agentur sieht den Höhepunkt der Nachfrage nach fossilen Energien aber in diesem Jahrzehnt. Investitionen in neue fossile Anlagen seien mit den Klimazielen unvereinbar und führen voraussichtlich zu Überkapazitäten. Dem Bericht nach bedrohen Extremwetter die weltweite Energiesicherheit inzwischen enorm. November: Die 29. Weltklimakonferenz geht mit einer Einigung zur Finanzierung der Klimafolgen zu Ende. Bis 2035 sollen die Entwicklungsstaaten jährlich mindestens 300 Milliarden US-Dollar für die Bewältigung des Klimawandels erhalten. Laut Expert:innen ist das nur ein kleiner Teil dessen, was gebraucht wird. Zwar gibt es das Ziel, insgesamt 1,3 Billionen US-Dollar bereitzustellen – wer diese bezahlt, ist aber unklar. Auf weitere Schritte zur Senkung der Emissionen einigten sich die Staaten derweil nicht. Dezember: In ihrem Wahlprogramm fordert die Union die Rücknahme zentraler klimapolitischer Errungenschaften. CDU und CSU sprechen sich gegen das Verbrenner-Aus, für eine Rücknahme des Gebäude-Energie-Gesetzes und eine Fortführung fossiler Subventionen aus. Im Energiebereich wollen sie am Kohleausstieg 2038 festhalten und nennen Kernenergie und „grünes Öl“ als angebliche Möglichkeiten zur Dekarbonisierung. Entstanden ist dieser Jahresrückblick in Zusammenarbeit mit dem Team von „RE: Klimakrise“, die jeden Tag die wichtigsten Klimanachrichten zusammenfassen. Schaut doch mal auf Telegram vorbei – es lohnt sich! Nichts mehr verpassen? – Infostream abonnieren! WhatsApp Telegram Newsletter"
