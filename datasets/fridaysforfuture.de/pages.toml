["https://fridaysforfuture.de/ortsgruppen/villingen-schwenningen"]
title = "Ortsgruppe Villingen-Schwenningen | Fridays for Future"
description = "Aktuelle Infos der FridaysForFuture Ortsgruppe Villingen- Schwenningen | Termine | Infos | Lokale Forderungen"
full_description = "VILLINGEN-SCHWENNINGEN Wir sind Fridays for Future Villingen-Schwenningen und damit eine kleine Ortsgruppe aus dem Schwarzwald! Seitdem streiken wir regelmäßig und bieten immer wieder verschiedene andere Aktionen an, die sich um das Thema Klimakrise drehen. Bei all dem brauchen wir allerdings immer Unterstützung und freuen uns immer über neue aktive Gesichter in unserem Team. Aktuelle Infos gibt es über: Des Weiteren haben wir noch eine Whatsapp-Diskussionsgruppe und einen E-Mail Verteiler. Wer in diesen aufgenommen werden möchte schreibt uns bitte eine E-Mail an villingen-schwenningen[at]fridaysforfuture.de. Termine: Globaler Klimastreik Wann? 15. September 13:30 Uhr Wo? Villingen Bahnhof Was? globaler Klimastreik Berichte: Aktionswoche 2023 Zwischen Montag, den 29.05.23 und Freitag, den 02.06.23, fand in Villingen die zweite große Klimaaktionswoche statt. Viele gemeinsame Aktivitäten wurden von der FFF-Gruppe Villingen-Schwenningen organisiert und gemeinsam mit interessierten Bürgern durchgeführt. Das Ziel war dabei, ein Forum zu schaffen für den Austausch mit Interessierten. Dazu wurden am Montag ab 10 Uhr in der Innenstadt an der Oberen Straße zwei Stände mit Sitzgelegenheiten und Infomaterialien aufgebaut. Ab 14.30 Uhr ging es dann richtig los. Beim gemeinsamen Malen von Bannern und einer Kleidertauschbörse konnte ein Austausch mit interessierten Bürgern beginnen. Wer abends noch Lust hatte, kam zur FfF-Kneipe, wo im geselligeren Rahmen Spiele gespielt wurden. An den folgenden Tagen fanden viele weitere spannende Workshops und Aktionen mit interessierten Bürgern statt. So wurde beispielsweise nach einer gemeinsamen Radtour zum Schwenninger Moos bei einer geführten Moorwanderung die Relevanz des Moors für den Klimaschutz thematisiert. Es wurden gemeinsamen Samenbomben gebastelt, um zu illustrieren, wie jeder selbst einen Beitrag zu einer insektenfreundlicheren Stadt leisten kann und es wurde in Vorträgen besonders auch die soziale Auswirkung der Klimakrise betrachtet. In Gesprächen mit Bürgern wurde klar, dass dies auch ein Punkt ist, der viele beschäftigt. Einen kleinen Beitrag versuchte FfF Villingen-Schwenningen hier zu leisten – mit einem Workshop mit Tipps zum billigeren Bahnfahren. Im Themenbereich Klima gingen es dieses Mal besonders um die lokal von der Stadt durchführbaren Maßnahmen und die Vision vom klimaneutralen Villingen-Schwenningen. Dabei wurde auch der bisher von der Stadt geplante Reduktionspfad untersucht und mit dem Notwendigen verglichen. Dabei steht leider fest, dass die bisher vorliegende Planung das Restbudget nach dem Pariser Klimaabkommen weit überschreitet. Jetzt soll möglichst wenig reduziert und erst 2040 die Klimaneutralität überhaupt angestrebt werden. Damit gilt wie üblich: Zu wenig, zu spät! Um für eine schnellere Klimaneutralität der Stadt zu kämpfen, beendeten wir eine sehr spannende Klimaaktionswoche am Freitag mit einer gemeinsamen Demo. Wir bedanken uns bei allen Bürgern für ihre Unterstützung, die angenehmen Gespräche und das tolle Feedback. Wir freuen uns darauf, auch in Zukunft mit euch für eine klimaneutrale Stadt zu kämpfen! Rückblick auf die 48 Stunden Mahnwache Vom Freitag den 16.10.2020, um 14Uhr bis zum Sonntag den 18.10.2020 um 14Uhr organisierte die fridaysforfuture Ortsgruppe Villingen Schwenningen eine 48 Stunden Mahnwache. Der Anlass dieser Mahnwache war, dass am 16.10.2019 in der Gemeinderatssitzung, der Klimanotstand in der Doppelstadt Villingen Schwenningen beschlossen worden ist. Jetzt könnte man ja glatt behaupten, dass doch damit alles erreicht sei und wir gar nicht mehr demonstrieren müssten. Genau da sehen wir das Problem. Beschlossen wurde der Klimanotstand, doch beachtet und berücksichtigt wurde er so gut wie kaum. Und das in einem Jahr so wenig passiert ist, trotzdem das der Gemeinderat den Klimanotstand beschlossen hatte, sahen wir es als Ortsgruppe nötig eine 48 Stunden Mahnwache abzuhalten. Wir gründeten das Bündnis „Aktion Klimanotstand“, bestehend aus den Gruppe Fridays For Future, Extincion Rebellion, Omas gegen Rechts und der Seebrücke. Das gesamte Wochenende war sehr bunt gestaltet. Es gab Demonstrationen, Kunstaktionen und vieles mehr. Durch unsere ständige Präsenz, an einem Infopavillion, hatten viele Bürger*innen die Möglichkeit mit uns ins Gespräch und in die Diskussion zu kommen. Haupt Akt unserer Mahnwache stellte eine Installation, mitten auf dem Latscharieplatz dar. Ein Skelett an einem Tisch, hinter dem Skelett ein Banner, auf dem „Klimanotstand“ geschrieben war. Das Skelett sollte den Gemeinderat und die beiden Bürgermeister Herrn Roth und Herrn Bührer darstellen. Damit wurde die Dringlichkeit, endlich zu handeln und den Klimanotstand in Villingen-Schwenningen als höchste Priorität zu berücksichtigen, verdeutlicht. Enttäuscht wurden wir von Herrn Roth und Herrn Bührer, die beiden uns schriftlich mitteilten, dass sie auf Grund der aktuellen Corona Lage nicht zu unserer Mahnwache erscheinen werden. Außerdem ließ sich kein Gemeinderatsmitglied, trotz Einladung bei uns blicken. Doch trotz der Enttäuschungen war die Mahnwache eine gute Erfahrung, die uns Aktivist*innen bestätigte, wie viel noch getan werden muss und das der Klimanotstand in Villingen Schwenningen unbedingt an höchster Stelle stehen sollte! Lea Hüttl 25.September #KeinGradWeiter Hand in Hand dem Widerstand. Am Freitag, den 25.09.2020 hieß es Globaler Streik von Fridaysforfuture und die Ortsgruppe Villingen-Schwenningen war natürlich auch mit am streiken. Da es sich um einen Globalen Streik handelte, begannen wir bereits in den Sommerferien mit den ersten Planungen. Da unsere Proteste und Demonstrationen durch die Corona Pandemie, etwas in dem Hintergrund gerutscht sind, wollten wir um so mehr, dass der Globale Streik eine grandiose Demonstration wird. Um so viele Menschen wie möglich zu erreichen und zu mobilisieren, hatten wir einige Interviews im Vorab mit der Presse und konnten die Demo dadurch gut bewerben. Es war viel zu organisieren, ob Bühne, Tontechniker, mit dem Amt und der Polizei alles abklären, Pavillons, neue Banner und Plakate malen, etc. Doch mit vereinten Kräften bewältigten wir erneut eine große Herausforderung. Und dann war es endlich soweit. Wir trafen uns am Freitag bereits früh genug zum Aufbau. Aufgrund der unklaren Wetterverhältnisse, gab es dementsprechend viel zum aufbauen. Doch alle gemeinsam schafften wir schnell eine trockene Bühne und ein sehr buntes Bild für Presse und interessierte Passanten. Die Bühne stand und die Band konnte endlich ihren Soundcheck durchführen. Um 14Uhr ging es dann endlich los. Wir hatten die Demo aufgrund der, durch Corona verloren gegangen Unterrichtsstunden extra auf 14Uhr gelegt, damit die Schüler*innen nicht noch mehr Unterrichtsstunden verpassen sollten. Mit 350 Demonstrant*innen, viel Krach und Parolen zogen wir in den Außenring von Villingen, den die Polizei zeitweise für uns sperren musste. Die Stimmung war grandios und wir hatten Unterstützung von anderen Organisationen, wie zum Beispiel den Omas gegen Rechts, der SeebrückeVS oder dem ADFC. Die Laufdemonstration verlief ohne weitere Komplikationen. An der Bühne angekommen, begrüßte und die Band mit tollen Liedern, die teils selbst geschrieben waren und die Stimmung wurde noch besser, als sie ohnehin schon war. Abwechselnd zur Band, gab es Redebeiträge und Poetry Slams. Mit einem wunderbaren Abschlusslied der Band, beendeten wir unsere Demo, um ca 16Uhr und wir machten uns ans abbauen. Es war ein unfassbarer Tag und eine wunderbare Demonstration, die uns allen wieder viel Mut und Motivation geben konnte. Wir waren so in Stimmung und Rage, dass wir direkt am Abend eine neue Aktion auf die Beine stellten, also seid gespannt was in der Zukunft noch so auf euch wartet. Bleibt Klimafreundlich und Gesund euere Fridaysforfuture Ortsgruppe VS. Lea Hüttl 20.09. #AlleFürsKlima Ein historischer Tag Die Woche, vor dem Globalen Klimastreik, war mit voller Aufregung verbunden. Wir planten und bereiteten alles für den Freitag vor. Die Woche näherte sich dem Ende und der Freitag rückte immer näher. Nach einem Besuch in der Lehrerkonferenz und Gesprächen mit dem Geschäftsführer der Rudolf-Steiner Schule in Schwenningen, bekamen die ganzen Schüler und Lehrer frei. Das war ein riesen Erfolg für uns und die Spannung und Vorfreude wuchs noch ein Stückchen weiter. Auch mit der Gewerkschaft IG Metall führten wir ein Gespräch. Von ihnen bekamen wir eine sehr positive Rückmeldung und Unterstützung. Da das Gespräch jedoch etwas spät in der Woche stattfand, konnte die gesamte Gewerkschaft nicht streiken. Jedoch kamen trotzdem einige, um mit uns gemeinsam zu streiken. Nun war es endlich so weit. Es war der 20.9.2019. Mit fleißigen Händen bauten wir die Technik und die Bühne für unsere Demonstration in der Villinger Innenstadt auf. Während ein paar noch aufbauten, zogen wir von der Rudolf-Steiner Schule Richtung Villingen. Viele Schüler und Lehrer liefen mit uns von Schwenningen zu unserem Treffpunkt am Villinger Bahnhof. Als wir am Bahnhof ankamen und von der Brücke auf den Vorplatz schauten, konnten wir unseren Augen gar nicht trauen. Alle Erwartungen und Vorstellungen hatten sich übertroffen. Wir konnten gar nicht glauben, wie viele Menschen gekommen waren. Nun ging es los. Wir liefen mit einem riesigen Demonstrationszug in die Innenstadt und um die Stadt herum. Die Demonstration wurde mit bunten und selbstgemalten Plakaten und Bannern begleitet. Wir zogen mit Musik und Lärm durch die Straßen. Auf dem Münsterplatz machten wir eine Lärmminute. Damit die ganze Stadt uns hört und nächstes Mal auch mit uns auf die Straßen geht. In einer großen Schleife zogen wir langsam zu unserem Endstandpunkt auf dem Latschariplatz. Gespannt hörten wir den Reden zu. Diese unterstrichen die Ernsthaftigkeit dieser Bewegung und diesen Demonstrationen. Und langsam sickerte auch die Nachricht hindurch, dass wir 900 Menschen waren. Es war unfassbar. Wir haben damit ein Zeichen in Villingen und der Umgebung gesetzt. Nach einer riesigen Menschenkette, die von der Oberestaße bis zum Ende der Niederestaße reichte, löste sich die Demo langsam auf. Wir ließen den Nachmittag mit einem schönen Picknick ausklingen. Bei guten Gesprächen und einem Stück Kuchen auf der Hand saßen wir bei Sonnenschein in der Innenstadt. Es war ein historischer Tag. 1,4 Millionen Menschen haben alleine in Deutschland demonstriert. Über 4 Millionen Menschen auf der ganzen Welt. Wir verfolgen ALLE dasselbe Ziel. Wir wollen den Klimawandel stoppen! Wir wollen ALLE eine lebenswerte Zukunft! Wir sind laut und werden es bleiben! Lilli Hüttl Aktionswoche Weil nur freitags nicht mehr reicht! Aktionswoche VS Am Montag den 26.8.19 startete, nach vielen Stunden Planung, die Aktionswoche von Fridays for Future in Villingen. Aus ganz Baden-Württemberg reisten Aktivist*innen zu uns nach Villingen. Manche blieben nur ein paar Tage, doch viele blieben auch die ganze Woche. Die Obere Straße wurde ganz von uns eingenommen. Wir hatten einen Infostand aufgebaut, an dem wir viele spannende Begegnungen mit Passanten hatten. Eine selbstgebaute Bühne und unser Kochzelt machten unser Lager perfekt. Nicht weit von unserem Standplatz in der Stadt entfernt, hatten wir auf dem Hubenloch ein gemütliches Zeltlager aufgebaut. Über die Woche verteilt wurde viel verschiedenes Programm angeboten. Dieses wurde mit viel Interesse von den Aktivist*innen und vorbeilaufenden Passanten besucht. Nachdem man morgens noch etwas verschlafen in der Stadt ankam, konnte man den Morgen auf einem unserer gemütlichen Sitzsäcke beginnen. Noch während man sich fast wieder versunken im Schlaf befand, stieg einem der wunderbare Geruch von frischem Müsli und Früchten in die Nase. Frisch ausgeruht genossen wir das Frühstück. Langsam wärmten uns die ersten Sonnenstrahlen und der erste Workshop begann. Über die Woche gab es verschiedenste Workshops die alle mit dem Thema Umwelt und Klimaschutz in Verbindung standen. Man kam aus jedem Workshop mit vielen Lösungen, Ideen und positiven Gedanken hinaus. Doch es wurden nicht nur Workshops über den Tag angeboten. Auch kleinere Programmpunkte wie eine Müllsammelaktion, Transpiparty (Banner und Plakate gestalten), Kleidertauschaktion oder ein mitgebrachtes Kleidungsstück mit Linoldruck neu verzieren. Workshop Linoldruck Jeden Abend gab es unterschiedliches Programm auf unserer Bühne. Von Poetry Slam (Poeten Slam- mit Studenten aus Tübingen) bei dem die Gedichte und Geschichten ganz um Nachhaltigkeit und Umwelt gingen, dem Film Tomorrow, einer Podiumsdiskussion mit den verschiedenen Parteien (CDU, freie Wähler, die Grünen, FDP und die Linken) bis hin zu einem Rave, der in der Innenstadt für ordentliche Tanzstimmung sorgte. Die Abende zogen sich bei lauem Wind bis in die tiefen Nächte hinein. Podiumsdiskussion Poetry Slam Ein wichtiges Anliegen von uns war, mit den Menschen ins Gespräch zu kommen. Da unser ganzes Programm in der Innenstadt stattfand, erhielten wir viel Aufmerksamkeit. Wir bekamen viel positive Rückmeldung und Unterstützung. Die Rückmeldungen waren nicht immer positiv, doch von Beleidigungen und negativen Rückmeldungen lassen wir uns nicht unterkriegen. Am Donnerstag hatte die Woche einen ihrer Höhepunkte. Das Fridays for Future Team übergab die 24 lokalen Forderungen an den Bürgermeister Detlev Bührer. Die Aktionswoche endete mit einer großen Demonstration. Mit viel Freude, Lärm und Musik zogen wir durch die Straßen von Villingen. Begleiten durfte uns unsere Weltkugel, die von der 5.Klasse der Rudolf-Steiner Schule selbstgebaut wurde. Durch und um Villingen herum liefen wir zu unserem Endstandpunkt zum Vorplatz der Tonhalle. Dort kamen wir alle mit wunderbarer Stimmung an und hörten gespannt den Reden zu. Ich hatte in der Aktionswoche tolle Begegnungen und Gespräche mit Passanten und Aktivist*innen. Es war eine Chance mit anderen Aktivist*innen, Ideen auszutauschen. Es war wahnsinnig viel Arbeit und ich möchte dem Orgateam nochmals ganz herzlich danken. Der Klimawandel betrifft uns ALLE. Wir können ihn JETZT noch stoppen. Der Klimawandel wird solche zerstörerischen Auswirkungen schaffen, dass die Erde nicht mehr lebenswert ist. Die Chance ist da. Lasst uns gemeinsam auf die Straße gehen und den Klimawandel mit seiner ganzen Zerstörung stoppen. Wir gehen freitags nicht umsonst auf die Straße. Wir schwänzen die Schule NICHT, weil es uns Spaß macht oder, weil wir keine Lust auf Unterricht haben. Wir verzichten selber auf unsere Bildung, weil wir eine riesen Angst vor den Ausmaßen des Klimawandels haben. Und glaubt mir, ich würde freitags wirklich gerne wieder in die Schule gehen. Lilli Hüttl Lokale Forderungen: Wir haben in den letzten Monaten unsere lokalen Forderungen an die Stadt Villingen-Schwenningen geschrieben. Diese sind nun veröffentlicht. Forderungen"
