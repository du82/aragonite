["https://fridaysforfuture.de/forderungen/100-Tage"]
title = "Forderungen für die ersten 100 Tage der neuen Bundesregierung | Fridays for Future"
description = "Im Wahlkampf hat sich jede demokratische Partei zum 1,5°-Ziel bekannt. Ausreichende Pläne zur Umsetzung dessen hat jedoch bis heute keine Partei vorgestellt. Deshalb fordern wir von der neuen Koalition in den ersten 100 Tagen die richtigen Weichen zu stellen, um das 1,5°-Ziel einhalten zu können. Im Jahr 2020 haben wir bereits mit den Wuppertal-Institut gezeigt,"
full_description = "Forderungen für die ersten 100 Tage der neuen Bundesregierung Im Wahlkampf hat sich jede demokratische Partei zum 1,5°-Ziel bekannt. Ausreichende Pläne zur Umsetzung dessen hat jedoch bis heute keine Partei vorgestellt. Deshalb fordern wir von der neuen Koalition in den ersten 100 Tagen die richtigen Weichen zu stellen, um das 1,5°-Ziel einhalten zu können. Im Jahr 2020 haben wir bereits mit den Wuppertal-Institut gezeigt, dass das 1,5°-Ziel noch einhaltbar ist, und was dafür gemacht werden muss. Ebenfalls haben wir 2019 unsere Forderungen präsentiert, um klar zu machen, wofür wir streiken! Mehr zur MachbarkeitsstudieZu den allgemeinen Forderungen Die Forderungen unterstützen „Wir sind nicht nur verantwortlich für das, was wir tun, sondern auch für das, was wir nicht tun.“ Molière Livestream der Pressekonferenz Jetzt auf YouTube ansehen Präambel Fridays for Future Deutschland streikt seit fast 3 Jahren jeden Freitag. In dieser Zeit hat sich die Regierung von der Einhaltung des 1,5°C-Ziels entfernt. Es ist so wenig passiert, dass das Bundesverfassungsgericht die Rechte der jüngeren Generationen gegenüber dem aktuellen Regierungshandeln verteidigen musste. In diesen drei Jahren haben Klimafolgen in Form von Bränden, Dürren, Hitzewellen, Überflutungen und vielem mehr weltweit und in Deutschland zu millionenfachem Leid geführt. Dieses Jahrzehnt und insbesondere die nächsten 4 Jahre werden laut aktuellem Bericht des Weltklimarats entscheidend dafür sein, ob wir die Erderhitzung noch auf ein kontrollierbares Maß beschränken können. Die vergangene Bundesregierung und alle Regierungen vor ihr sind trotz immer neuer Ankündigungen und Versprechen an diesem Anspruch gescheitert. Die neue Bundesregierung kündigt erneut entschlossene Klimapolitik an und verspricht die Einhaltung der 1,5°C-Grenze. Doch warum sollten wir ihr glauben? Die neue Bundesregierung hat jetzt durch einen breiten Rückhalt für effektive Klimapolitik die Chance, sich Glaubwürdigkeit für ihre Versprechen zu erarbeiten. Hierfür stellen wir Forderungen für die ersten 100 Tage der neuen Amtsperiode. Ob die Regierung diese Maßnahmen in dieser Frist entschieden ergreift oder nicht, wird zeigen, ob sie überhaupt ein ernsthaftes Interesse am Erhalt unserer Lebensgrundlagen hat. Wir fordern in den ersten 100 Tagen einer neuen Bundesregierung: Die Verabschiedung eines 1,5°C-konformen CO2-Budgets: Verbindlich als Grundlage eines Reduktionspfades Unabhängige Kontrolle: Einführung eines Mechanismus zur Prüfung aller Gesetze und Infrastrukturprojekte auf Kompatibilität mit dem CO2-Budget Die sofortige Beendigung neuer Erdgasinfrastrukturprojekte und Beschluss des Erdgasausstiegs bis spätestens 2035 Einen sozialverträglichen Ausstieg aus allen fossilen Energien in Deutschland Alle Dörfer Bleiben: Keine weiteren Flächen für Kohle abbaggern und verbindlicher Kohleausstieg bis spätestens 2030 Ende aller Subventionen für fossile Energieträger Die Beseitigung aller (politischen) Ausbaubremsen für Sonnen- und Windenergie und die Versiebenfachung des Ausbaus Das Einleiten einer radikalen, sozial gerechten Mobilitätswende Einen Einbaustopp für fossile Verbrennungsmotoren ab 2025 Einen sofortigen Neu- und Ausbaustopp für Autobahnen und Bundesstraßen Das Übernehmen globaler Verantwortung: Deutschland verpflichtet sich, für seine historischenVerantwortungen einzustehen Festlegung von mindestens 14 Milliarden Euro jährlich für internationale Klimafinanzierung Ausschluss der Ratifizierung klima- und umweltschädlicher sowie menschenrechtsgefährdender Handelsverträge (wie bspw. das Mercosur-Abkommen) Die Forderungen unterstützen Erläuterung Es gibt für jede künftige Regierung den klaren Auftrag aus der Gesellschaft und der Wissenschaft, alles dafür zu tun, die 1,5°C-Grenze nicht zu überschreiten. Die vorliegenden Forderungen zu erfüllen, kann der Anfang ernsthafter Anstrengungen sein. Das bedeutet, sich am besten wissenschaftlichen Stand zu orientieren und sofort zu handeln. Gute Klimapolitik ist vor allem: schnelle Klimapolitik. Die Einhaltung der 1,5°C-Grenze scheitert nicht an der Machbarkeit oder vermeintlichen Zielkonflikten. Sie scheitert an politischem Willen. Diesen politischen Willen muss die neue Bundesregierung jetzt beweisen. Die Klimakrise ist eine globale, soziale und wirtschaftliche Krise. Klimakatastrophen, wie die Fluten im Juli, treffen diejenigen am härtesten, die sich am wenigsten davor schützen können. Bestehende Ungerechtigkeiten wie struktureller Rassismus, Sexismus, Klassismus, (Neo-)Kolonialismus etc. bedingen die ungerechte Verteilung der Klimafolgen. Die Einhaltung der 1,5-Grad Grenze darf nicht auf dem Rücken derjenigen ausgetragen werden, die am wenigsten dazu beigetragen haben. In Anerkennung historischer Emissionen und neokolonialer Abhängigkeitsverhältnisse akzeptiert Deutschland die Pflicht, diese aufzuarbeiten und internationale Politik nach dem Interesse der MAPA (most affected people and areas) auszurichten. Die Regierung muss für Klimagerechtigkeit und die Einhaltung der 1,5°C-Grenze diskriminierende Strukturen auflösen und Probleme intersektional lösen, anstatt sie gegeneinander auszuspielen. Es darf nicht die alleinige Aufgabe der Jugend sein, Verantwortung für die Priorisierung von Klimagerechtigkeit zu übernehmen. Da die Politik diese kaum wahrnimmt, sehen wir uns gezwungen, weiter zu streiken, bis gehandelt wird! Wir als Fridays for Future Deutschland sind eine überparteiliche Bewegung gleichgesinnter Klimaaktivist*innen und solidarisieren uns mit allen, die sich friedlich für unsere Forderungen einsetzen. Die Forderungen unterstützen"
year_published = 2025
