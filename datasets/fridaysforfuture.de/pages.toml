full_description = 'VILSBIBURG Die Fridays for Future Ortsgruppe Vilsbiburg wurde im März 2019 gegründet. Wenn ihr mitmachen wollt, meldet euch gerne bei uns:) Bei uns ist jede/r Willkommen! Ihr findet uns auf Whatsapp (talk.fffvib.de - oder nur wichtige News unter news.fffvib.de) oder auf Social Media bei Instagram und Facebook (die Links dazu findet ihr unten) Schreibt uns bei Fragen oder Anregungen gerne eine Mail an vilsbiburg@fridaysforfuture.de Noch mehr #FFF #VIB & aktuelle News…. Unsere Social Media Accounts! Termine Noch in Planung:) Schaut für aktuellere Infos gerne auf unseren Social Media Seiten vorbei Danke an Stefanie Baum, „einfach Arlaine“, Jürgen Liebenstein und all die anderen für die tollen Fotos! Gerne erwähnen wir euch auch hier, wenn ihr uns Bescheid gebt 🙂 .sm { font-size: 1.5vw; } @media screen and (max-width: 480px) { .sm { font-size: 3vw; } } /* Style the buttons that are used to open and close the accordion panel */ .accordion { background-color: #1DA64A; color: #444; cursor: pointer; padding: 18px; width: 100%; text-align: left; border: none; outline: none; transition: 0.4s; border-radius: 0; margin-top: 10px; } /* Add a background color to the button if it is clicked on (add the .active class with JS), and when you move the mouse over it (hover) */ .active, .accordion:hover { background-color: #90D3ED; } /* Style the accordion panel. Note: hidden by default */ .panel { padding: 0 18px; background-color: white; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; } var acc = document.getElementsByClassName("accordion"); var i; for (i = 0; i < acc.length; i++) { acc[i].addEventListener("click", function() { this.classList.toggle("active"); var panel = this.nextElementSibling; if (panel.style.maxHeight){ panel.style.maxHeight = null; } else { panel.style.maxHeight = panel.scrollHeight + "px"; } }); }'
