description = "Wir sind Fridays for Future! Wir kämpfen für eine lebenswerte Zukunft und fordern eine Politik, die die Bewältigung der Klimakrise ernsthaft angeht!"
full_description = 'GROSSER KLIMASTREIK VOR DER BUNDESTAGSWAHL! KLIMASTREIK AM 14. FEBRUAR 2025! EIN RECHT AUF ZUKUNFT! ZUM OFFENEN BRIEF FORDERUNGEN 2025 Wir haben ein Recht auf Zukunft – und das fordern wir ein! Zu den Forderungen Auf dem Laufenden bleiben! Eintragen Ich habe die Datenschutzerklärung gelesen und akzeptiere diese. #slider-nlform { --primary-color: #1b7340; --text-color: white; --input-border-radius: 25px; --input-border-color: #ccc; color: var(--text-color); width: 100%; max-width: 600px; margin: 0 auto; padding: 0 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; } #slider-nlform .input-group { display: flex; align-items: center; justify-content: center; width: 100%; } #slider-nlform input[type="email"], #slider-nlform button { height: 50px; padding: 0 15px; box-sizing: border-box; margin: 0 !important; } #slider-nlform input[type="email"] { border: 1px solid var(--input-border-color); border-right: none; flex: 2; border-radius: var(--input-border-radius) 0 0 var(--input-border-radius); } #slider-nlform button[type="submit"] { border: none; background-color: var(--primary-color); color: var(--text-color); border-radius: 0 var(--input-border-radius) var(--input-border-radius) 0; cursor: pointer; transition: all 0.3s; font-weight: bold; } #slider-nlform button[type="submit"]:hover { background-color: var(--text-color); color: var(--primary-color); } #slider-nlform button[type="submit"]:active { transform: scale(0.95); } #slider-nlform input[type="email"]:focus { border: 2px solid var(--input-border-color); border-right: none; outline: none; } #slider-nlform .privacy-notice { display: flex; align-items: baseline; justify-content: center; width: auto; padding: 10px; } #slider-nlform .privacy-notice label { font-size: 0.6em; font-weight: lighter; width: 100%; text-wrap: pretty; } #slider-nlform .privacy-notice input[type="checkbox"] { transform: scale(1.2); margin-right: 5px; accent-color: var(--primary-color); } #slider-nlform a { color: var(--text-color); text-decoration: underline; } Wir sind Fridays for Future! Werde Teil der Bewegung Ich habe die Datenschutzerklärung gelesen und akzeptiere diese.* Die Klimakrise ist eine reale Bedrohung für die menschliche Zivilisation – die Bewältigung der Klimakrise ist die Hauptaufgabe des 21. Jahrhunderts. Wir fordern eine Politik, die dieser Aufgabe gerecht wird. Fridays for Future: Das sind alle, die für unser Klima auf die Straße gehen. Die Klimastreik-Bewegung ist international, überparteilich, unabhängig und dezentral organisiert. Mach mit und werde Teil unserer Bewegung! 600 + Ortsgruppen 9.000 + Streiks 5.000.000 + Menschen auf der Straße Warum auf eine Zukunft bauen, die bald nicht mehr lebenswert sein wird? Unsere Antwort auf diese Frage ist der Klimastreik: Wir streiken für eine wirkungsvolle Politik, die dem Ausmaß der Klimakrise gerecht wird. Wir haben zehn Jahre, um unsere Ziele zu erreichen und müssen jetzt beginnen. Auf geht’s! Die Wissenschaft gibt uns Recht: Über 26.000 Wissenschaftler*innen im deutschsprachigen Raum bestätigen, dass unser Anliegen berechtigt ist. Dazu haben wir folgende Forderungen aufgestellt. Wir fordern von der Politik nicht mehr als die Berücksichtigung wissenschaftlicher Fakten.'
