["https://fridaysforfuture.de/studie"]
title = "1,5°-Ziel Machbarkeitsstudie | Fridays for Future"
description = "CO2-Neutralität bis 2035 ist nicht nur notwendig, sondern auch möglich. Wie? Das zeigt uns die Machbarkeitsstudie. #SoGeht1Komma5 #UniteBehindTheScience"
full_description = "Die Machbarkeitsstudie Komplette StudieSchlüsselergebnisseBlogeintrag Lade dir jetzt Infomaterial herunter: DIY-Poster (A4) Poster (A2, 3mm Zuschnitt) Poster (A2, kein Zuschnitt) Postkarte (A6) Aufzeichnungen des Streams: Ton (MP3) Video (MP4) Video, geringe Qualität (MP4) Fast zwei Jahre nach dem Beginn der Schulstreiks ist Klima eines der größten Themen in Gesellschaft und Politik. Gleichzeitig gibt es keine Partei, die einen Plan für 1,5-Grad-Politik hat und keine Partei mit einem Plan, was die Einhaltung der 1,5-Grad-Grenze für Deutschland eigentlich bedeutet. Hier kannst Du nachlesen, warum die 1,5-Grad-Grenze unverhandelbar sein muss. Deswegen hat Fridays for Future das Wuppertal Institut beauftragt, die erste Studie durchzuführen, die untersucht, wie ein gerechter Beitrag Deutschlands zu 1,5 Grad aussieht. Der Sachverständigenrat für Umweltfragen errechnet ein deutsches Restbudget von 4,2 Gigatonnen CO2 – jede ernsthafte Diskussion über die Klimaziele der Bundesregierung oder andere Ziele, die diese Grundlage missachten, riskiert unsere Gesundheit und Sicherheit und stellt in Frage, dass jeder Mensch dieser Welt über die gleichen Rechte verfügt. Das Wuppertal Institut schreibt, das berechnete Restbudget könne nur eingehalten werden, wenn “Deutschland bis etwa zum Jahr 2035 CO2-neutral wird und […] wenn die Emissionen schon in den unmittelbar vor uns liegenden Jahren besonders stark sinken”. Das Erreichen von CO2-Neutralität wäre “bis zum Jahr 2035 aus technischer und ökonomischer Sicht zwar extrem anspruchsvoll […], grundsätzlich aber möglich”. Die Studie untersucht, wie sich in den Sektoren, die am meisten zum deutschen CO2-Ausstoß beitragen, 2035 netto null erreichen lässt. Für uns ist klar, dass der Diskurs über die Herausforderungen und Lösungen “mit größtmöglicher Transparenz und Ehrlichkeit in der ganzen Breite der Gesellschaft geführt werden” muss. Wir nehmen die Herausforderungen und Sorgen ernst und wissen, dass es noch viele weitere Untersuchungen braucht, die sich mit der sozialen und gerechten Umsetzung von netto null 2035 beschäftigen. “Ist [der gesellschaftliche und politische Wille] gegeben, stehen der Zielerreichung keine unüberwindbaren Hindernisse entgegen”, schreiben die Wissenschaftler*innen des Wuppertal Instituts. Der gesellschaftliche Wille ist da, die Unterstützung unserer Forderungen enorm – jetzt liegt es an Politiker*innen aller Parteien, endlich faktenbasiert über Klima zu sprechen. Komplette StudieSchlüsselergebnisseBlogeintrag Jetzt teilen!teilen 1032 teilen teilen E-Mail merken 1"
