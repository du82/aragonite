["https://fridaysforfuture.de/category/neuigkeiten"]
title = "Neuigkeiten | Fridays for Future"
description = "Hier schreiben wechselnde Autor*innen der Klimagerechtigkeitsbewegung über das Klima, den Kampf für echten Klimaschutz und ihre Perspektiven auf eine klimagerechte Zukunft. In Interviews und Kolumnen geben wir Menschen eine Stimme, die oft kein Gehör finden. In Hintergrundartikeln bringen wir Dir die harten Fakten der Klimakrise näher und in unserem zweiwöchentlichen Klima-Update fassen wir zusammen, was klimapolitisch so passiert ist. Das und noch viel, viel mehr gibt es hier: im Fridays for Future-Blog! Dein Kontakt zur Redaktion: newsletter@fridaysforfuture.de"
full_description = "Wer ist wirklich bereit, Verantwortung zu tragen? 22. Februar 202522. Februar 2025 in Erzähl mal!, Gut zu wissen!, Neuigkeiten Wir haben in den letzten Wochen einen Wahlkampf erlebt, der sich wie in einer Parallelwelt abgespielt hat. Eine Welt, in der es keine Klimakrise mehr gibt, denn welchen anderen Eindruck sollte man haben, wenn kaum eine Partei wirklich über die größte Bedrohung unserer Zeit spricht? Aber wir wissen, dass die Klimakrise nicht verschwindet oder auch … Weiterlesen über „Wer ist wirklich bereit, Verantwortung zu tragen?“! Klima & Demokratie – worauf es jetzt ankommt 10. Februar 202522. Februar 2025 von Paula in Erzähl mal!, Neuigkeiten, Wir sind laut! In wenigen Tagen gehen wir an über 130 Orten in ganz Deutschland eine Woche vor der Bundestagswahl zum großen Klimastreik auf die Straße. Warum das jetzt wichtig ist und was die Klimastreiks mit dem Schutz der Demokratie zu tun haben, erklärt unsere Autorin Paula. In der letzten Woche waren wir mit Hunderttausenden auf der Straße, … Weiterlesen über „Klima & Demokratie – worauf es jetzt ankommt“! Offener Brief: Wir haben ein Recht auf Zukunft! 29. Januar 202529. Januar 2025 in Erzähl mal!, Neuigkeiten, Offener Brief, Wir sind laut! Sehr geehrter Herr Merz, sehr geehrter Herr Scholz, sehr geehrter Herr Habeck, sehr geehrte Spitzenkandidat*innen, Der Ablauf dieses Wahlkampfs scheint vorprogrammiert: Sechs weitere Wochen lang werden die Interessen von jungen Menschen höchstens eine Randnotiz sein, bis man sich beim Anblick der Wahlergebnisse wieder an unsere Existenz erinnert und nach Erklärungen fragt. Statt lediglich am Wahlabend … Weiterlesen über „Offener Brief: Wir haben ein Recht auf Zukunft!“! Jetzt erst recht – unsere Analyse! 21. Januar 202521. Januar 2025 von Zahra in Erzähl mal!, Gut zu wissen!, Neuigkeiten, Und jetzt? Die USA steigen unter Trump aus dem Pariser Abkommen aus – ein klarer Angriff auf unsere Zukunft. Ja, das ist schlimm. Ja, Klimaschutz voranbringen mit diesem Präsidenten wird hart. In den USA aber auch global. Aber: Wir dürfen jetzt nicht aufgeben. Warum, das erklärt unsere Autorin Zahra. Es kommt mir vor wie ein Fiebertraum: Donald Trump … Weiterlesen über „Jetzt erst recht – unsere Analyse!“!"
