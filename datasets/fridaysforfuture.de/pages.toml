["https://fridaysforfuture.de/kohleausstieg-ost"]
title = "Kohleausstieg im Osten – Demo am 25.06. | Fridays for Future"
description = "Am 25.06. demonstrieren wir direkt an der Abbruchkante am Tagebau Welzow in der Lausitz!Gemeinsam mit einem breiten Bündnis gehen wir alle gemeinsam auf die Straße und fordern einen 1,5 Grad-kompatiblen Kohleausstieg und sozial gerechten Strukturwandel! Es braucht faire Lösungen für die Arbeitskräfte in den Kohlekraftwerken und echte Angebote und Chancen für junge Menschen in der"
full_description = "Kohleausstieg im Osten – Demo am 25.06. Am 25.06. demonstrieren wir direkt an der Abbruchkante am Tagebau Welzow in der Lausitz!Gemeinsam mit einem breiten Bündnis gehen wir alle gemeinsam auf die Straße und fordern einen 1,5 Grad-kompatiblen Kohleausstieg und sozial gerechten Strukturwandel! Es braucht faire Lösungen für die Arbeitskräfte in den Kohlekraftwerken und echte Angebote und Chancen für junge Menschen in der Lausitz. Wann? 25.06. – Beginn 12 UhrWo? Tagebau Welzow, Treffpunkt am SchaufelradShuttles ab 11 Uhr vom Bf Neupetershain Zur gemeinsamen Anreise mit Bussen! Gemeinsamer Aufruf – Warum streiken wir? Derzeit verhandelt Bundeswirtschaftsminister Habeck mit dem Kohlekonzern LEAG über einen vorgezogenen Kohleausstieg in der brandenburgischen und sächsischen Lausitz. Habeck zeigt sich nach einem Treffen mit dem brandenburgischen Ministerpräsidenten Woidke “geduldig” beim Vorziehen des Kohleausstiegs – obwohl der Koalitionsvertrag der Ampel-Regierung einen Kohleausstieg bis idealerweise 2030 verspricht. Dabei ist klar: Um die 1,5-Grad-Grenze einhalten zu können, muss der Kohleausstieg vorgezogen und außerdem die Menge an Kohle, die in der Lausitz noch gefördert wird, auf maximal 205 Mio. t beschränkt werden. Es braucht einen beschleunigten, sozial gerechten Umstieg auf Erneuerbare Energien, um die Klimakrise einzudämmen und gleichzeitig zukunftssichere, nachhaltige Arbeitsplätze in der Region zu schaffen. Das ist machbar: Laut aktuellem Bericht der Bundesnetzagentur wäre die deutsche Stromversorgung weiterhin gesichert. In der Region sind die Folgen der Klimakrise mit Waldbränden, Dürren und Wasserknappheit schon längst spürbar. Die neu entstehenden Tagebauseen müssen möglichst geringe Verdunstungsverluste aufweisen, da die bisher geplanten großen Seen die Wasserknappheit in der Region noch weiter verschärfen würden. Klar ist: Der Kohleausstieg wird kommen, am Wandel zu einer klimagerechten Wirtschaft führt kein Weg vorbei — aus ökologischen, sozialen und ökonomischen Gründen. Der Kohlekonzern LEAG und sein Investor EPH wollen jedoch an der klimaschädlichen Kohleverstromung bis 2038 festhalten und spekulieren weiter auf staatliche Entschädigungen, obwohl Kohleverstromung wegen steigender CO2-Preise spätestens ab 2030 nicht mehr wirtschaftlich rentabel sein wird. Damit nehmen sie einen unkontrollierten Strukturbruch ohne soziale Abfederung in Kauf, dessen Auswirkungen am Ende die Mitarbeiter*innen tragen müssen. Jetzt liegt es an Politiker*innen wie Wirtschaftsminister Habeck und den Ministerpräsidenten Kretschmer und Woidke, dem etwas entgegenzusetzen und den Kohleausstieg sozial und klimagerecht und 1,5°-konform zu gestalten. Deshalb rufen wir am 25. Juni 2023 gemeinsam zu einer Demonstration am Tagebau Welzow in der Lausitz auf. Klimaschutz und soziale Gerechtigkeit gehen Hand in Hand. Mehr Infos und Hintergründe! Wir fordern: Einen bundesweiten Kohleausstieg mit einem 1,5-Grad-kompatiblen Abschaltpfad bis spätestens 2030, bei dem die Restfördermenge auf maximal 205 Mio. t Kohle aus der Lausitz beschränkt wird. Eine dezentrale Energiewende in der Lausitz, die den Bürger*innen vor Ort zugutekommt und nicht die Monolpolstellung eines einzelnen Konzerns weiter erhält. Einen sozial gerechten Strukturwandel, von dem die Menschen in der Region profitieren und echte Perspektiven für diese. Dazu gehören faire Lösungen für die Arbeitskräfte in den Kohlekraftwerken und die Schaffung nachhaltiger und zukunftsfähiger Arbeitsplätze. Eine Überarbeitung der Pläne für die Tagebaue Nochten und Welzow-Süd, durch die der Tagebau mehr Abstand zu bewohnten Orten einhält und künftige Restseen verkleinert werden, um wertvolles Wasser zu sparen. Eine insolvenzfeste Sicherung von Betriebsgewinnen / finanziellen Rückstellungen der LEAG zur vollständigen Deckung der bergbaubedingten & verursachten Folgekosten. Mitspracherechte für Sorb*innen im Strukturwandel und im Umgang mit den Tagebauflächen. Unsere Partner*innen Zur gemeinsamen Anreise mit Bussen! Studie: Raus aus den Fossilen – Auch in der Lausitz! Wenige Tage nach dem klaren Appell des Expertenrats Klima an die Bundesregierung, konsequente Maßnahmen zur raschen Senkung der Emissionen einzuleiten, haben Fridays for Future und die Forschungsgruppe FossilExit der Europa-Universität Flensburg (EUF) am 27.04.2023 auf einer Pressekonferenz die Ergebnisse einer neuen Studie zum Kohleausstieg in der Lausitz präsentiert. Hier sind die wichtigsten Punkte der Studie: Ein vorgezogener Kohleausstieg auf das Jahr 2030 allein reicht nicht aus, um die 1,5°C-Grenze des Pariser Klimaabkommens einzuhalten. Um das deutsche 1,5°C-Budget einzuhalten, dürfen nicht mehr als 205 Millionen Tonnen Braunkohle aus der Lausitz verbrannt werden. Entscheidend für den Klimaschutz ist nicht die Jahreszahl, sondern die Menge an erzeugten CO2-Emissionen. Um die 1,5°C-Grenze einzuhalten, müssen bereits vor 2030 Kohlekraftwerke in der Lausitz abgeschaltet oder gedrosselt werden. Die Auslastung der Kohlekraftwerke muss ab sofort jährlich um 25% gedrosselt werden oder aber der Kohleausstieg bis zum Jahr 2026 abgeschlossen sein. Bei einem früheren Kohleausstieg wird die Kohle unter Mühlrose nicht benötigt. Aktuelle Energiemarktsimulationen gehen davon aus, dass Kohlekraftwerke aufgrund des steigenden CO2-Preises nach 2030 nicht mehr profitabel betrieben werden können. Download der Studie (PDF) .entry-content, .entry-summary, .page-content { margin-top: -8.5em; }"
year_published = 2025
