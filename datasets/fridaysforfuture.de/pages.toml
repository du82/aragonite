["https://fridaysforfuture.de/ortsgruppen/nuernberg"]
title = "Ortsgruppe Nürnberg | Fridays for Future"
description = "Aktuelle Termine: 01.03.2024 Klimastreik und 02.03.2024 Demo gegen rechts 02.03.2024 Get Organized! Demonstration gegen rechts Gegen Rechts müssen wir immer und immer wieder aktiv werden & das geht am besten gemeinsam!! Zusammen mit anderen Nürnberger Gruppen organisieren wir am 02.03 eine Demo auf dem Nelson-Mandela-Platz.Get organized! heißt: Miteinander reden, diskutieren, auf die Straße gehen und"
full_description = 'Fridays for Future Nürnberg Aktuelle Termine: 01.03.2024 Klimastreik und 02.03.2024 Demo gegen rechts 02.03.2024 Get Organized! Demonstration gegen rechts Gegen Rechts müssen wir immer und immer wieder aktiv werden & das geht am besten gemeinsam!! Zusammen mit anderen Nürnberger Gruppen organisieren wir am 02.03 eine Demo auf dem Nelson-Mandela-Platz.Get organized! heißt: Miteinander reden, diskutieren, auf die Straße gehen und den Rechtsextremismus im sozialen Umfeld bekämpfen ♥️🔥 Get organized! 01.03.2024 Bundesweiter Klimastreik #wirfahrenzusammen Am 01. März demonstrieren wir Seite an Seite mit den Beschäftigten des Bus-, U-Bahn- und Straßenbahnverkehrs, denn ein guter ÖPNV kann nur mit guter Bezahlung des Personals funktionieren. 🚩 Wir sind solidarisch mit Verdi, da die Arbeitnehmer*innen unter enormen Druck (z.B. auch krank zur Arbeit gehen zu müssen), Personalmangel usw.! 💚 Sei deshalb auch du in weniger als drei Wochen mit uns auf der Straße! Die Anfangskundgebung startet am Kornmarkt um 14:30. ⏰ Folge uns für mehr Infos auf Instagram oder komm zum Plenum jeden Sonntag in der Frauentormauer 7-9 ab 17:00, um beim Organisieren des Streiks zu helfen. 🚉 Wir Fahren Zusammen! 15.09.2023 Globaler Klimastreik Globaler Klimastreik 03.03.2023 Am 03. März ist wieder Globaler Klimastreik! Wir sehen uns am 03.03. ab 12 Uhr am Kornmarkt und fordern: Öffis für alle & kostenlos – das heißt: Bessere Finanzierung und vor allem bessere Arbeitsbedingungen! Dafür arbeiten wir bundesweit mit der Gewerkschaft ver.di zusammen und sagen: Streik in der Schule, Uni und (Verkehrs-) betrieb, das ist unsre Antwort auf eure Politik! Beachtet, dass diesen Freitag auch die Beschäftigten in Bus, Tram und U-Bahn streiken! Kommt also mit dem Fahrrad oder mit der S-Bahn zum Klimastreik! Aktuelle Infos und die Route findet ihr auf Instagram. Jan 2023: Lützerath bleibt! Im Januar 2023 hat der Energiekonzern RWE mit Unterstützung von Tausenden Polizisten das von Klimaaktivist*innen besetzte Dorf Lützerath an der Kante des Tagebaus Garzweiler II geräumt. Damit hat die Bundes- und Landesregierung die 1,5 Grad Grenze überschritten. Mit vielen anderen waren wir als FFF Nürnberg vor Ort: Wir haben direkt in Lützerath die Räumung blockiert, haben mit Zehntausenden bei der Großdemo am 14.01. im Matsch das Dorf umringt und haben auch hier in Nürnberg mit zwei lauten und wütenden Demonstrationen Druck gemacht! Der Ort Lützerath ist Geschichte, aber die Kohle ist noch im Boden. Jetzt machen wir stärker als zuvor weiter und sorgen dafür, dass das so bleibt! Nov & Dez 2022: #endfossil – Unibesetzungen! Um die Klimakrise zu stoppen reicht es nicht aus, nur in unserer Freizeit zu demonstrieren! Wir müssen uns dort organisieren und streiken, wo wir sind: An unseren Schulen und Unis! Nach einer länger vorbereiteten Besetzung an der FAU in Erlangen, haben alleine in Nürnberg im Herbst vier Unibesetzungen stattgefunden – organisiert von den Studierenden der jeweiligen Hochschule. An der Hochschule für Musik haben wir gedichtet und musiziert, an der Technischen Hochschule haben wir diskutiert, an der Akademie der bildenden Künste wurde erfolgreich gegen Machtmissbrauch protestiert und an der Lehramtsfakultät der FAU konnte nichtmal die Polizei unseren friedlichen Protest untererbinden! Als FFF waren wir bei allen Besetzungen von Anfang an beteiligt und versprechen euch: Wir kommen wieder! Mitmachen Du willst der Klimakrise nicht länger einfach nur zuschauen? Das kannst du tun: Komm zu unseren regelmäßigen Treffen! Wir sehen uns jeden Sonntag, ab 17 Uhr am Turm V, (Frauentormauer 7-9) Komm in unsere What’sApp, Signal oder Telegram Infogruppen! Dort erfährst du regelmäßig über anstehende Veranstaltungen, Projekte und wie du mitmachen kannst. Über uns Wir organisieren Klimastreiks und andere Aktionen für Klimagerechtigkeit in Nürnberg. Wir sind Schüler*innen, Studierende, Azubis, junge Menschen, die sich regelmäßig treffen, um etwas gegen die Klimakrise zu tun. Du willst mitmachen? Aktuell treffen wir uns jeden Sonntag um 17 Uhr, wenn du vorbeikommen willst, dann schreib uns per E-mail (nuernberg@fridaysforfuture.is) oder auf Instagram. Bleibe Immer Auf Dem Laufenden Sonstiges Wir haben einige bekannte Lieder mit anderen Texten versehen. Die Lyrics findest du hier hier Klima-Notfallpaket -Ausbaustopp Frankenschnellweg -365€ jetzt für alle -Autofreie Innenstadt -Durchgehendes Radwegenetz bis 2026 -Parkplätze schrittweise durch Begegnungsflächen wie Spielplätze oder Stadtgärten ersetzen -Keine klimaschädlichen Wertanlagen -Nürnberg soll Zero Waste Stadt werden -Repräsentative Bürger- und Bürgerinnenversammlung mit Vorschlagsrecht -N-Ergie klimaneutral bis 2025 -Verpflichtende Ausstattung von Neubauten mit Photovoltaik oder grünem Dach -Kommunale Einrichtungen und Eigenbetriebe klimanautral bis 2030 -Nachhaltige Ernährung in städtischen Einrichtungen Bündnispartner Parents For Future Die Ortsgruppe Parents for Future (P4F) Nürnberg ist Teil von Parents for Future Deutschland und damit – wie auch Fridays for Future – in der globalen For Future-Bewegung organisiert. Die P4F unterstützen uns regelmäßig bei unseren Aktionen auf verschiedenste Art und Weise sowohl physisch als auch finanziell. FridaysforFuture Nbg und Parents for Future Nbg arbeiten oft zusammen, sind jedoch eigenständige Initiativen. P4F Nbg setzen auch eigene Projekte um und kooperieren mit weiteren Klimagruppen. Sie kämpfen wie wir für Klimagerechtigkeit, also sozialverträglichen Klimaschutz, und sie stehen hinter unseren lokalpolitischen und den bundesweiten Forderungen von FridaysforFuture Deutschland. Auch die P4F freuen sich über jede Art von Unterstützung, neue Mitglieder sind sehr herzlich willkommen. Mehr Infos findest du auf ihrer Website. Nürnberg For Future Das Bündnis „Nürnberg for Future“ (NFF) ist ein Zusammenschluss von derzeit 24 zivilgesellschaftlichen Organisationen in Nürnberg. Das Bündnis hat sich 2019 auf Initiative von Fridays for Future Nürnberg formiert und will ab sofort eine klimagerechte Kommunalpolitik für Nürnberg durchzusetzen, wofür der Forderungskatalog „Nürnberg muss handeln“ entwurfen wurde. Wir fordern gemeinsam die Stadtverwaltung dazu auf, die Energie-, Verkehrs- und Wärmewende, die Biodiversität, die Ressourceneffizienz, die nachhaltige und faire Beschaffung sowie viele weitere Themen voranzubringen. Mehr Infos findest du auf der Website. Klimacamp Seit Donnerstag, den 03.09.2020, steht auf dem Sebalder Platz in Blickweite zum Rathaus das Klimacamp Nürnberg, das von verschiedenen Initiativen des Bündnisses Nürnberg for Future (NFF) sowie Einzelpersonen getragen wird. Mit dieser Dauermahnwache weisen wir auf die katastrophale Bedrohung durch die menschengemachte Klimakrise hin und fordern ein entschlossenes Handeln von Politik, Wirtschaft und Gesellschaft mittels des Forderungskatalogs „Nürnberg muss handeln“. Darüber hinaus veranstaltet das Klimacamp wöchentlich attraktive, spannende und fortbildende Mitmachprojekte, Vorträge, Workshops und weitere Aktionen und bietet jeder*m einen Platz zum Vernetzen, Austauschen und Kennenlernen. Helfende Hände sind hier immer gerne gesehen, du kannst jedoch auch einfach vorbei kommen, um zu entspannen. Mehr Infos findest du auf der Website. Besuche uns am Sebalder Platz Bündnis 8.März Ein feministisches Bündnis, das jährlich den feministischen Streik zum Weltfrauentag organisiert. Mehr zu ihnen auf findest du auf Facebook. FLINTA* Komitee Das Frauen, Lesben, Inter, Non-binary und Trans-Komitee organisiert diverse Veranstaltungen zum Thema Feminismus und der Gleichberechtigung von nicht Cis-männlichen Personen. Mehr zu ihnen findest du auf ihrer Website .sm { font-size: 1.5vw; } @media screen and (max-width: 480px) { .sm { font-size: 3vw; } } /* Style the buttons that are used to open and close the accordion panel */ .accordion { background-color: #1DA64A; color: #444; cursor: pointer; padding: 18px; width: 100%; text-align: left; border: none; outline: none; transition: 0.4s; border-radius: 0; margin-top: 10px; } /* Add a background color to the button if it is clicked on (add the .active class with JS), and when you move the mouse over it (hover) */ .active, .accordion:hover { background-color: #90D3ED; } /* Style the accordion panel. Note: hidden by default */ .panel { padding: 0 18px; background-color: white; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; } var acc = document.getElementsByClassName("accordion"); var i; for (i = 0; i < acc.length; i++) { acc[i].addEventListener("click", function() { this.classList.toggle("active"); var panel = this.nextElementSibling; if (panel.style.maxHeight){ panel.style.maxHeight = null; } else { panel.style.maxHeight = panel.scrollHeight + "px"; } }); }'
