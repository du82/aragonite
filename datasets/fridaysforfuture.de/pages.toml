full_description = "Mannheim Willkommen bei Fridays For Future Mannheim! 👋 Wir sind eine politische Gruppe aus Schüler:innen und Student:innen, die sich durch Demos und Aktionen für Klimaschutz und Klimagerechtigkeit einsetzt. Hierbei geht es darum, dass nicht die Menschen am stärksten unter der Klimakrise leiden sollen, die am wenigsten dazu beigetragen haben. Die Industrieländer des globalen Nordens haben die Klimakrise hauptsächlich verursacht und verstärken sie weiter. Deshalb fordern wir sie dazu auf, global Verantwortung für die Folgen und Schäden des Klimawandels zu übernehmen. Sei dabei! Du hast Lust, Dich zu engagieren und Teil der Bewegung zu werden? Dann komm gern zu uns in Plenum! Du kannst Dich auf ganz unterschiedliche Art und Weise einbringen – z.B in der Social Media AG, in der Organisation von Demos, Workshops, Diskussionen und vielem mehr. Wann? Jeden SonntagWo? Abwechselnd vor Ort in Mannheim und online Wenn Du dabei sein willst, schreib uns gern bei Instagram / Facebook oder komm in eine unserer WhatsApp-Gruppen! Jede:r ist herzlich willkommen – wir freuen uns auf Dich und Deine Ideen!🤗 Termine Kommende Termine 31.05.2024 Globaler Klimastreik Wann? 17:00 UhrWo? Ehrenhof Am 09.06. wird das neue Europaparlament gewählt, daher machen wir davor nochmal ordentlich Rabatz auf den Straßen!Lass uns zeigen, dass wir gegen den Rechtsruck zusammenstehen & uns für ein klimagerechtes Europa einsetzen! 📍In Mannheim ist am gleichen Tag außerdem Kommunalwahl – daher ist es umso wichtiger nochmal ein lautes und entschlossenes Zeichen auch hier vor Ort zu setzen. Komm zur Demo, bring deine Freund*innen, Mitbewohner*innen und Großeltern, jede einzelne Person macht einen großen Unterschied 💚Wir freuen uns auf dich! Vergangene Termine & Blog 11.03.23 „Wege erkämpfen“ – Konferenz für Klimagerechtigkeit Die Bewegung für Klimagerechtigkeit hat mehr Fragen alsAntworten. Auf der einen Seite bringen die globalen Klimastreiksregelmäßig viele Menschen auf die Straßen und in Lützerathstellten sich Zehntausende entschlossen der fossilen Zerstörungentgegen. Auf der anderen Seite entfernt sich die Möglichkeit,unter der 1,5 Grad Grenze zu bleiben, immer weiter. Wenn wir aneiner klimagerechten Zukunft festhalten wollen, brauchen wirdringend neue Strategien, um den grundlegenden Wandel zubewirken, den wir so dringend brauchen. Deshalb laden wir alleInteressierten zur Mannheimer Konferenz für Klimagerechtigkeit ein.Gemeinsam wollen wir überlegen, mit welchen Strategien wirweiter kommen. Mit diesen Überlegungen stehen wir nicht alleineda, deshalb haben wir verschiedene Teile unserer Bewegungeingeladen, um ihre Perspektiven in Workshops und auf einemgroßen Podium vorzustellen. Wir sind viele, wir haben noch langenicht verloren und wir können neue Wege erkämpfen! Adresse: JugendkulturzentrumForum, Neckarpromenade 47 68169Mannheim Zeitplan 14-16 Uhr Workshop Slot 116-18 Uhr Workshop Slot 218-19:30 Abendessen19:30 Uhr Große Podiumsdiskussion mit verschiedenen Gruppen der Klimagerechtigkeitsbewegung 03.03.23 12. Globaler Klimastreik Es ist wieder soweit! Am 03.03.2023 ist der mittlerweile 12. globale Klimastreik und auch in Mannheim gehen wir unter dem Motto #TomorrowIsTooLate auf die Straßen. In der sogenannten „Klimakoalition“ ist von echtem Wandel noch nicht viel zu spüren; sei es die Räumung von Lützerath, mangelhafte Verkehrspolitik oder klimaschädliche Subventionen. Wir brauchen echtes Umdenken, echtes Handeln, und das schnell. Bei konstanten Emissionen ist unser weltweites CO2 Budget für das 1.5 Grad Ziel in nicht einmal 7 Jahren aufgebraucht. Kurz vor dem Koalitionsgipfel müssen wir deswegen noch einmal richtig laut werden, und die Veränderung einfordern, die uns zusteht und versprochen wurde. 22.05.22 Pressemitteilung: „Schluss mit dem Greenwashing der MVV!“ Aktion am Frühjahrsempfang der Stadt Mannheim Fridays for Future Mannheim hat sich beim heutigen Frühjahrsempfang der Stadt Mannheim mit einem eigenen Stand beteiligt. Die lokale Bewegung unterstützt das diesjährige Motto „Gutes Klima – !DEAL für Mannheim“, kritisiertjedoch einzelne Aussteller für Greenwashing. Insbesondere das Energieunternehmen MVV wirbt so lautstark mit dem Ziel der Klimaneutralität, investiert jedoch weiter in neue fossile Infrastruktur wie beispielsweise Gaskraftwerke. Fridays for Future Mannheim protestierte gegen dieses Verhalten vor dem Stand der MVV mit einem Banner und klärte die Besucherinnen über das Greenwashing des Energieversorgers auf: „Wir fordern eine echte Energiewende mit echten erneuerbaren Energien – Schluss mit dem Greenwashing der MVV! Weder der Bau eines neuen Gaskessels, noch die Verbrennung von Müll und Holz ist klimagerecht.“ Dass die Aktivistinnen anschließend aufgrund der Kritik von der Veranstaltung verwiesen wurden, ermutigt Fridays for Future nur weiter.Gemeinsam mit den Initiativen Mannheim Kohlefrei, Mannheim Zero, Extinction Rebellion, Scientist for Future und People and Parents for Future Mannheim protestiert Fridays for Future Mannheim am 01.06.2022 gegen die MVV. Die Fahrraddemonstration startet um 15:30 Uhr im Ehrenhof am Mannheimer Schloss und führt durch die Stadt zum Hauptsitz der MVV an der Kurpfalzbrücke. Aufgrund der Umbauten am Ring, muss diese Demonstration ausnahmsweise an einem Mittwoch stattfinden. Gemeinsam fordern die Initiativen den tatsächlichen Ausstieg aus schmutzigen Energien, Transparenz und eine ehrliche Kommunikation ohne grün bemalte Versprechungen. 20.04.22 Offener Brief der Mannheimer Klimagerechtigkeitsgruppen an die Stadt MA Mannheim, 20.04.2022 Der Klimaschutzaktionsplansplan der Stadt Mannheim liegt auf Eis. Dabei waren die Zeiten nie besser fürschnelle große Schritte in Richtung Klimaneutralität, raus aus den fossilen Brennstoffen.Sehr geehrte Frau Prof. Pretzell, sehr geehrter Herr Dr. Kurz,dies ist ein offener Brief der Klimagerechtigkeitsgruppen Mannheim kohlefrei, Mannheim Zero, Fridays forFuture, People & Parents for Future, Scientists for Future, Health 4 Future und extinction rebellion an dasUmweltdezernat V und die Stadt Mannheim. Wir sind in den Klimaschutzaktionsplan (KSAP) der StadtMannheim involviert und wurden neben dem kleinen Bürgerinnenklimarat begrüßt als „Stakeholderinnen“, deren „Input“ gebraucht wird, um die Bevölkerung mitzunehmen. Schon im Mai wirdder KSAP dem Gemeinderat zur Bewilligung vorgelegt, die öffentliche Beteiligung steckt aber weiter fest,schon eine geraume Weile passiert nichts. Statt die Klima- und Energiekrise mutig zu managen, rechnenderzeit die Stadt Mannheim und die MVV AG ihre Klimabemühungen schön. Wir fürchten, das hat Methodeund bleibt auch nach der Bewilligung des Plans so. Zusammen mit den Bürger*innen Mannheims würdenwir uns freuen, wenn die Verwaltung umsetzt, was zugesagt wurde – den tatsächlichen fossilen Ausstieg.Keine Kohle, kein Erdgas, kein Rohöl, keine betrügerische Müllverbrennung, keine absurde Verbrennung dessich verknappenden Roh- und Lebenssstoffes Holz. Dafür zügig Photovoltaikausbau, Windkraftplanung,fahrradfreundliche Innenstadt, weiter verbesserte Taktung von Bus und Bahn, größere Bewegungen bei der„Smart City“, also der Digitalisierung von Klimadaten. Vor allem wollen wir den Ausstiegspfad derGesamtemissionen sehen, um die jährlichen, bisher freilich zu niedrigen Minderungen derTreibhausgasemissionen nachvollziehen zu können. Wir wollen Pläne mit überprüfbaren Zahlen zumkonkreten fossilen Ausstieg, d. h. Wärmeplanung und großdimensionalen Flusswärmebau.Mannheim hat den wohlfeilen Ehrgeiz, 2030 eine der 100 klimaneutralen Städte der Europäischen Union zuwerden1. Das dritte und letzte Kapitel des 6. Sachstandsberichts des Internationalen Klimarats IPCC vom 4.April ist nur zu deutlich. Baldige Klimaneutralität ist eine Notwendigkeit. Die Rede ist dort von welt- undwirtschaftsweitem Strukturwandel, von überfälliger „systematischer Transformation“2. Aber in Mannheimgeht die vom Land Baden-Württemberg geforderte kommunale Wärmeplanung sowie neue Konzepte imÖPNV nicht oder zu langsam voran. Der Klimaschutzaktionsplan Mannheim ist bald das Einzige, das auf Eisliegt. Die Stadt müsste politisch agieren, „regieren“ eben. Das Mindeste wäre, den Energieverbrauch inöffentlichen Liegenschaften runterzudrehen, bei „Tempo 30 in der Innenstadt“ dranzubleiben undGrünflachen grün zu lassen. Der Klimaschutzaktionsplan ist kein Spielball, mit gutem Design könnte erMannheims Zukunft sein. In seiner jetzigen Form und Ausgestaltung aber ist er eine Hängepartie.Die Krise ist eine Chance, wenn man mutig ist – Beispiel WärmeproduktionDas Mannheimer Budget der restlichen Treibhausgasemissionen schmilzt, weniger als 13 Mio t CO2 bleibenuns noch. Schon 2026/27 wird Mannheim seinen Anteil verbraucht haben, wenn so weitergemacht wird wiebisher. Einen erheblichen Anteil daran hat das GKM. Es stößt mit ca. 5 Mio. Tonnen/Jahr die zweitgrößteCO2-Menge eines Steinkohlekraftwerks in Deutschland aus und ist einer der größten CO2-Emittentenüberhaupt in Europa3. Verschärft wird diese Situation immer wieder von außen, derzeit durch dendramatischen Ukrainekonflikt. Dieser ist ein geostrategischer Krieg und kein Klimakonflikt, aber er machtdeutlich, dass ein Ausstieg aus den fossilen Energien und ein Ausbau der erneuerbaren Energien notwendigist. In Zeiten, in denen die Bombardierung ukrainischer Städte mit Hilfe der Erdgasverkäufe (200 Mio Eurotäglich aus der EU4) auch von der MVV querfinanziert wird; in denen die Dörfer des Schorenvolkes fürSibiriens Kohle abgebaggert werden5 und in denen Profite über den Klimaschutz gestellt werden, will dieMVV bei steigenden fossilen Energiepreisen die Abhängigkeit von Erdgas weiter verfestigen, indem sie zweineue Kessel am GKM baut (286 MW nach Vorhaben ab 20236). Erdgas aber ist als „Brückentechnologie“untauglich, denn die Treibhausgasemissionen sind nur geringfügig niedriger als bei der Kohleverbrennungund Methan ist grundsätzlich bei weiten Transporten ein außerordentlich problematisches Treibhausgas.US-Fracking-Gas, aus Übersee an LNG-Terminals angeliefert, ist in der Bilanz noch klimaschädlicher und diePreiserhöhungen werden an den Verbraucher weitergegeben. Profitmaximierung hier wie dort.Klotzen nicht kleckern – Flusswärme ist die Zukunftstechnologie, wenn man mutig istDenn es gibt eine Alternative. Dass die MVV den Bau einer experimentellen Flusswärmeanlage am Standort Rheinau begonnen hat, ist eine gute Idee. Aber angesichts der anvisierten Größe ist sie ein Tropfen auf denheißen Stein, denn sie ist auch experimentell klein. Die 20 MW-Anlage (+ 7 MW Strom) nimmt sich nebenden Kohleblöcken, die ca. 2000 MW fahren, wie eine Minigolfanlage aus. Mindestens 150 Mwth (th =thermisch, d. h. Wärmeproduktion) sind pro Flusswärmegroßpumpe möglich, bei mehreren Anlagen parallelmehr als das Doppelte. Flusswärme ist nicht neu, sie ist in Stockholm, Lemgo, Wien erprobt, viele andereStädte planen welche. In das Fernwärmesystem Stockholms werden 420 MW aus Großwärmpumpeneingespeist7. Das entspräche in Mannheim einer CO2-Einsparung von etwa 1.320 Megatonnen. Die MVV AGwill dennoch trotz ihres milliardenschweren internationalen Portfolios für den Ausbau „auf die Gesetzeslagewarten“ und „Förderbedingungen abwarten“8. Der Block 9 des GKM hingegen hatte im Jahre 2015 1,3 Mrd.Euro Risiko-Investitionsvolumen9. Und heute würde man nicht mehr wie damals sagen, dass das eineInvestition „for Future“ war.Was macht nun die Stadt Mannheim? Sie wiederum wartet ab, was die MVV macht, posiert für Fotos stattder MVV als Mehrheitsaktionär Bedingungen zu stellen und sie klimapolitisch zu fordern. Die MVV verkauftdem Gemeinderat, der Stadtregierung und der Öffentlichkeit die Verbrennung riesiger Mengen Holz- undMülls als klimaneutral. Für für echte, netto-klimaneutrale Investitionen aber ist sie zu wenig ambitioniert. Sowurde der Kellner zum Koch. Ob all dessen Ursache der beklagte Personalmangel im Dezernat V ist? Odereine schlecht kommunizierende Verwaltung? Oder, noch schlimmer, mangelnder politischer Mut?People not Profit! Mutige Klimapolitik – bedingungslos – jetzt! i. A. Arnulf Quentin (Mannheim kohlefrei)1 https://ec.europa.eu/jrc/communities/sites/jrccties/files/100_climate_neutral_cities_report_.pdf2 https://www.ipcc.ch/sr15/chapter/chapter-3/3 europäisches Schadstoffregister https://thru.de/index.php?id=4214 https://www.bruegel.org/publications/datasets/european-natural-gas-imports/5 https://klimawende.koeln/2020/03/02/sibirische-kohle-fur-kraftwerke-der-rheinenergie/ 6 https://www.mvv.de/fileadmin/user_upload/Ueber_uns/de/geschaeftsfelder_1/aktuelle_projekte/BesicherungRheinuferNeckarau_BeRUN_MVVUmwelt_aktuell.pdf7 https://www.energiewendebauen.de/projekt/neu-grosswaermepumpen-in-deutschen-fernwaermenetzen/8 „Das FWP-Investment wäre kein Problem. Aber man muss die Umlagen zahlen und wäre nicht wirtschaftlich. Wärebei heutigem Strompreis möglich, aber Zusatzstromkosten müssen gefördert werden. Wäre ab 2026 wohl gesetzlichmöglich.“ Dr. Hansjörg Roll (damaliger Technikvorstand der MVV Energie AG) am Ingenieurstag VereinDeutscher Ingenieure – Nordbadisch-Pfälzischer Bezirksverein e.V. und VDE Kurpfalz, 30.09.2021, Mitschrieb„Mannheim kohlefrei“)„Von Paris nach Mannheim während Corona: Das ,Mannheimer Modell’“9 https://www.rnz.de/wirtschaft/wirtschaft-regional_artikel,-Wirtschaft-Regional-Kohlekraftwerk-Mannheim-Block-9-geht-ans-Netz-_arid,126688.html 25.03.22 10. Globaler Klimastreik 22.10.21 Fahrt nach Berlin zum Zentralstreik 18.09. – 25.09.21 Klimacamp 24.09.21 Globaler Klimastreik Vielen Dank für die Fotos an @joeisavailable und @celinechiarabu 💚 Material Sprüchesammlung für DemosHerunterladen"
