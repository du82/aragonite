full_description = 'Hamburg Jetzt zur neuen Website wechseln! Hamburg for Future sagt Moin! ❮ ❯ var slideIndex = 1; showSlides(slideIndex); function plusSlides(n) { showSlides(slideIndex += n); } function currentSlide(n) { showSlides(slideIndex = n); } function showSlides(n) { var i; var slides = document.getElementsByClassName("mySlides"); var dots = document.getElementsByClassName("dot"); if (n > slides.length) {slideIndex = 1} if (n < 1) {slideIndex = slides.length} for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; } for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); } slides[slideIndex-1].style.display = "block"; dots[slideIndex-1].className += " active"; } Du bist Mutter*, Vater*, Psycholog:in, Ärzt:in, Wissenschaftler:in, Unternehmer:in, Landwirt:in, Architekt:in oder fühlst dich einer anderen gesellschaftlichen Gruppe zugehörig? Und DU möchtest Dich einbringen – klicke hier! Aktuelles Interaktive Ausstellung zum Thema Gas & Energie Muss ich mit einem Gas-Embargo im Winter wirklich frieren? Ist Gas nun umweltschädlich oder nicht? Hast du noch mehr solche oder ähnlichen Fragen zum Thema Gas?Dann bist DU genau richtig bei unserer Ausstellung zum Thema Gas! Wo? Nach dem Erfolg auf der Mönckebergstraße - demnächst auf der Altonale! An Station 1 dreht sich alles um die Frage wie und wo Gas gefördert wird. An Station 2 dreht es sich um die Frage, welche Auswirkungen das Fördern von Gas auf das Klima und die von Fracking betroffenen Menschen hat. An Station 3 geht es um die Frage, welche Folgen ein Gas-Embargo hätte und warum es notwendig ist. Und zu guter Letzt geht es bei der Station 4 um die Szenarien und Alternativen, die wir zur Verfügung haben, um ohne Gas auszukommen. Die Ausstellung komprimiert und zum Nachlesen.In voller Länge bereiten wir sie gerade noch auf. Forderungen & Vollversammlung der Students for Future Was die Students for Future fordern, findest du hier: https://fridaysforfuture.de/forderungen-sff-hh/ Spenden Die Umsetzung von Klimastreiks und anderen Aktionen ist sehr teuer! Daher brauchen wir deine finanzielle Unterstützung und sind für jede Spende sehr dankbar! Jetzt spenden! .entry-title {display: none;} Lützerath lebt Greenpeace hat sie eindrucksvoll gezeichnet: Die 1,5-Grad-Linie vor dem kleinen Dorf Lützerath am Kohletagebau Garzweiler II. Das einst 80 Seelen Dorf besteht heute nur noch aus drei Gebäudekomplexen, den Rest hat RWE bereits in Besitz genommen und abgerissen. Bis Ende 2022 will RWE den Tagebau um die Fläche des kompletten Dorfs erweitern und bis 2038 weitere 650 Mio. Tonnen Braunkohle fördern. Die Braunkohleförderung in Deutschland nimmt derzeit 45% unseres CO2 Restbudgets ein. Kohle, die wir nicht mehr brauchen – auch nicht, um die Stromversorgung über die Energiewende hinweg stabil zu halten. Dies bestätigt ein Bericht der Kohlekommission bereits 2019. Die Kohlekommission sollte im Auftrag der Bundesregierung einen sozial- und klimaverträglichen Plan für den Kohleausstieg erarbeiten, veröffentlicht wurde er aber erst ein Jahr später, nachdem Leitentscheidungen zur Umsiedelung und Erweiterung des Kohletagebaus abgesegnet wurden. Nun hat das Landgericht Münster entschieden: Der Abriss Lützeraths darf stattfinden. Nicht, weil die Notwendigkeit für das Gemeinwohl besteht, sondern weil die Kohle für den Betrieb der Kohlekraftwerke vor Ort notwendig ist. Nicht, weil das Klimaschutzgesetz von NRW 1,5 Grad verträglich ist und den Abbau der Kohle als kompatibel zulässt, sondern weil die Bundesregierung keine rechtliche Grundlage gelegt hat, das vom Pariser Abkommen zugeschriebene Budget auf Landesebene zu verteilen. Die alten Siedlungsnachweise der Römer, die teils 1000-jährige Geschichte der umliegenden Ortschaften nehmen keinen Einfluss auf die wirtschaftlichen Interessen, auch nicht der Friedhof am alten Dom in Immerath, nicht die Dorfbewohner, als RWE morgens die Bäume in ihrem Garten fällten. Besitz und Eigentum hat in Deutschland den feinen Unterschied, dass die Flächen RWE nicht gehören müssen, um sie abreißen zu dürfen. RWE darf das und das Gericht hat ihnen Recht gegeben. Aber für uns ist klar: Nicht ohne Widerstand! Seit über einem Jahr wird Eckhardt Heukamp, der letzte Bewohner Lützeraths, vor Ort durch Aktivisti der Klimagerechtigkeitsbewegung unterstützt! Auch wenn Eckhardt gehen muss, wir bleiben! Und auch wenn RWE versucht, uns nachts in kaum 100 Meter Entfernung mit ihren Kohlebaggern den Schlaf zu rauben, wir bleiben! Damit Lützerath bleibt! Für ein klimagerechtes DeutschlandAls Wegweiser für den Ausbau erneuerbarer EnergienZum Erhalt der Grundwasserlandschaft des Niederrheins - und damit dem wichtigsten Trinkwasserreservegebiet Nordrhein-Westfalensfür ein CO2-Budget, das unsere Handlungen zukunftskompatibel macht! Highlights Hamburgs neuer Schriftzug Die Klimakrise als Gerechtigkeits-, Freiheits-, Wirtschafts-, Sicherheits- und zukunftbedrohendste Krise unserer Zeit kann nur gemeinschaftlich angegangen und gelöst werden. Für diese Vision brauchen wir gesamtgesellschaftliche Bündnisse, die unsere Vielfalt abbilden und gemeinsam für klimagerechte Lösungen kämpfen. Dabei bedeutet Klimagerechtigkeit nicht nur eine CO2-neutrale Erde, sondern auch das Auflösen von rassistischen, patriarchalen und durch und durch ungerechten Strukturen, die uns in diese größte Krise der Menschheit geführt haben. Lasst uns gemeinsam einen neuen, klimagerechten Weg gestalten! Deswegen zeigen wir gemeinsam: »Wir alle kämpfen für 1,5°C«! Von #MakeItStay zu #MadeItStay! Besuche uns auf YouTube Hier gibt es unseren Informationsflyer zum Schriftzug. Was wir fordern Es liegt in unserer Verantwortung, das Steuer herumzureißen und uns unserer globalen Verantwortung zu stellen. Wir müssen unserer Verantwortung ein Maß geben - dem politischen Weiterso ein Budget! Unsere 100-Tage-Forderungen an die Bundesregierung 1. Die Verabschiedung eines 1,5°C-konformen CO2-Budgets Verbindlich als Grundlage eines Reduktionspfadesmit unabhängigen Kontrollen: Einführung eines Mechanismus zur Prüfung aller Gesetze und Infrastrukturprojekte auf Kompatibilität mit dem CO2-BudgetFür Hamburg bedeutet das, dass ein spezifisches Budget nur für Hamburg ausgerechnet und festgelegt werden muss. Die Einhaltung dieses ist verpflichtend. 2. Die sofortige Beendigung neuer Erdgasinfrastrukturprojekte und ein Beschluss des Erdgasausstiegs bis spätestens 2035 Ein sozialverträglicher Ausstieg aus allen fossilen Energien in DeutschlandAlle Dörfer Bleiben: Keine weiteren Flächen für Kohle abbaggern und ein verbindlicher Kohleausstieg bis spätestens 2030 3. Ende aller Subventionen für fossile Energieträger Hamburg sorgt dafür, dass diese Forderungen bundesweit umgesetzt werden und stoppt selbst die Subventionen fossiler Energieträger. 4. Die Beseitigung aller (politischen) Ausbaubremsen für Sonnen- und Windenergie und die Versiebenfachung des Ausbaus 5. Das Einleiten einer radikalen, sozial gerechten Mobilitätswende Ein Einbaustopp für fossile Verbrennungsmotoren ab 2025Ein sofortiger Neu- und Ausbaustopp für Autobahnen und BundesstraßenHamburg setzt eine autofreie Innenstadt um und verstärkt aktiv das schon bestehende ÖPNV Angebot. 6. Das Übernehmen globaler Verantwortung: Deutschland verpflichtet sich, für seine historischen Verantwortungen einzustehen Festlegung von mindestens 14 Milliarden Euro jährlich für internationale KlimafinanzierungAusschluss der Ratifizierung klima- und umweltschädlicher sowie menschenrechtsgefährdender Handelsverträge (wie bspw. das Mercosur-Abkommen)Hamburg schaut sich die eigene Vergangenheit bezüglich des Ausstoßes von Treibhausgasen an und unterstützt finanziell. Zudem sorgt Hamburg dafür, dass keine weitere Ausbeutung stattfindet wie durch die Ostsee-Gaspipeline Nord Stream 2. Offener Brief Wir haben zusammen mit über 40 weiteren Organisationen unseren offenen Brief an den Hamburger Senat veröffentlicht. Die aktuell immer stärker eskalierende Klimakrise, deren Auswirkungen wir inzwischen selbst in Deutschland in Form von starken Naturkatastrophen zu spüren bekommen, sollte auch für die Politik ein erhöhtes Verantwortungsbewusstsein bedeuten. Doch davon ist leider nichts zu bemerken. Der Hamburger Senat scheint immer noch nicht bereit, Maßnahmen zur Einhaltung der 1,5-Grad-Grenze und damit des Pariser Klimaabkommens durchzusetzen. Wir wollen nun gemeinsam, als breites Bündnis der Klimagerechtigkeitsbewegung, erneut ein Zeichen für einen politischen Wandel hin zu wirklichem, sozial-gerechten Klimaschutz. Wir wissen aber auch, dass nur der konstante Druck durch Demonstrationen uns die Möglichkeit verschafft hat, einen solchen Brief formulieren zu können. Es muss klar werden, dass genau dieser Druck auch hinter dem offenen Brief steckt! Kommt daher alle um 14 Uhr zum Arrivatipark (Neuer Pferdemarkt) und streikt gemeinsam mit uns und dem Bündnis! Lasst uns unsere Forderungen laut und deutlich mitteilen, denn gemeinsam bringen wir die Politik zum Handeln! Hier könnt ihr den offenen Brief lesen! Pressekonferenz: Die Klimakrise ist hier und jetzt Am Freitag den 23.07. haben wir hier in Hamburg eine Pressekonferenz zu dem Thema Klimafolgen veranstaltet. Mit dabei waren Annika Rittmann (Sprecherin FFF), Claudia Kemfert (Ökonomin), Carl-Friedrich Schleussner (Klimawissenschaftler), Jonas und Julia Wischnewski (von FFF Bonn und selbst Betroffene von der Flutkatastrophe). Moderiert wurde von Luisa Neubauer. Thematisch ging es insbesondere um die Ereignisse der letzten Woche, die Zusammenhänge zwischen der Klimakrise und der Wetterextreme und was die Politik nun machen muss. Die Teilnehmenden fanden die richtigen Worte um die Politik, Wissenschaft und das Geschehene zu beschreiben. Die Verzweiflung über das Nichthandeln und wieso wir nun konsequenten Klimaschutz brauchen. Das Letzte, was einem noch Halt gegeben hat, war die Hand vor dir, Julia Wischnewski Dass es schneller gehen soll, hören wir inzwischen seit Jahren. Da frage ich mich: Hat diese Katastrophe, hat dieses Versprechen überhaupt irgendwas verändert, Jonas Wischnewski Die menschengemachte Erderwärmung trägt ohne Zweifel zur Schwere des Flutereignisses bei, Carl Friedrich Schleussner Jeden Euro, den wir jetzt in Klimaschutz investieren, sparen wir an 15 Euro, den wir für Klimaschäden ausgeben müssten, Claudia Kemfert Und jetzt ist die Zeit des Handelns, es ist die Zeit, in der wir entscheiden können, wer dieses Land die kommenden vier Jahre regieren wird, Annika Rittmann Gesundheit braucht Klimaschutz – Rede von Health for Future am 23.07. Hallo Hamburg, ich bin Jon und Aktivist bei Health for Future, einem breiten Bündnis aus dem Gesundheitswesen, welches sich – der Name verrät es – mit dem Klima aus medizinischer Perspektive beschäftigt. Schon häufiger in den letzten Jahren standen wir hier, bei Vorträgen, in Interviews, Podcasts, oder in der akademischen Lehre, um darüber zu berichten, was die Klimakrise für die menschliche Gesundheit bedeutet. Wieso selbst bei gesunden Menschen ab gewissen Temperaturen Schwitzen nicht mehr ausreicht, um uns adäquat zu kühlen, und Hitze tödlich wird. Wie Luftverschmutzung mit Herzinfarkten und Schlaganfällen zusammenhängt. Wie Trinkwasser- und Nahrungsmittelsicherheit durch die Klimakrise herausgefordert wird. Warum wir uns durch Umweltveränderungen auf neue Infektionserkrankungen vorbereiten müssen. Und, welche psychische Belastungen mit Extremereignissen und einer destabilisierten Umwelt einhergehen. Darüber aufzuklären haben wir als eine Kernverantwortung der Menschen im Gesundheitssystem gesehen. Als Menschen, die sich aufhalten zwischen Lancet-Studien, IPCC-Berichten und alltäglicher Patientenversorgung. (Oder, in meinem Fall, auf dem Weg dorthin.) Aus dieser speziellen Perspektive heraus wollten wir die Erkenntnisse über die Gesundheitsfolgen heraustragen. Jetzt übernehmen das die Nachrichten ganz von alleine. Leider viel greifbarer, viel realer, und viel näher, als wir das können und wollen. Es ist nunmal so: Wenn wir zu lange warten, klärt die Klimakrise ganz von selbst über sich auf; Gesundheitsfolgen werden ganz von selbst spürbar. Aber wir dürfen nicht warten. Gerade gestern habe ich einen Bericht von einer ärztlichen Kollegin gehört, aus der Region der Extremwetterereignisse. Neben den persönlichen Schicksalen, die für mich schwer vorstellbar sind, ist eines einmal mehr klar geworden: Selbst in einem Land wie Deutschland, wo uns der medizinischen Versorgung sehr sicher fühlen können, ist diese nicht unverwundbar, nicht immun gegen eine destabilisierte Umwelt. Es hilft nicht, wenn Ärzte:innen die besten Praxen der Welt führen, wenn diese Praxis von einem auf den anderen Tag einfach nicht mehr da steht, wo sie gestern noch war. Aktuell sind knapp 100 Praxen und Apotheken in Westdeutschland nicht versorgungsbereit. Dank schneller, und häufig auch ehrenamtlicher Hilfe von Engagierten, können wir die medizinische Versorgung großenteils aufrechterhalten. Dank diesen Helfenden können wir kompensieren. Aber erleben wir dadurch auch, wie aufwendig, anstrengend und entbehrungsvoll eben dieses „Kompensieren“ ist. Und dass es großer Anstrengung bedarf, medizinische Versorgung zu sichern, wenn wir uns dabei nicht auf eine stabile Umwelt verlassen können. In all unserer „Fortschrittlichkeit“, von der wir in der Medizin sicher massiv profitieren, wäre es falsch zu vergessen, wie sehr unsere Gesundheit von der Umwelt abhängt. Wir können uns damit aufhalten, zu diskutieren, ob das eine jetzt „Wetter“ oder „Klima“ ist; wir können uns damit aufhalten, zu diskutieren, ob der andere Sommer mit Hitzetoten, Ernteausfällen und Trinkwasserknappheit ein „Einzelfall“ ist oder sich in ein gewisses Gesamtbild einfügt; wir können uns mit der Frage aufhalten, ob man besser jetzt oder später über Konsequenzen aus gewissen Ereignissen spricht. Aber wenn wir bei all dem ausblenden, dass wir aus der Klimaforschung seit Jahren übereinstimmende Erkenntnisse haben, die genau in diese Richtung deuten… wenn wir das ausblenden, wenn wir die Bedeutung für die Zukunft nicht anerkennen, dann riskieren wir Menschenleben. Und auf dem Weg dahin viele weitere Gesundheitseinschränkungen. Auch hier bei uns in Deutschland. Fridays for Future motiviert zum Glück längst generationenübergreifend. Aus der Generation meiner Eltern höre ich häufig ein durchaus ehrenwertes Argument: Für die Generationen nach ihnen, für ihre Kinder. Wenn ich an meine Eltern denke, weiß ich aber auch: Ich tue das auch für sie. Denn, wenn wir uns die Gesundheitsfolgen anschauen, sind es eben gerade ältere Personen, die zu allererst betroffen sind. Sei es die limitierte Fähigkeit, mit Hitzestress umzugehen; sei es das durch Klimakrise und Luftverschmutzung messbar erhöhte Risiko für Herzinfarkte und Schlaganfälle; sei es der Verlust von Lebenswerken und Lebensgrundlagen durch Extremwetterereignisse. Alt werden in einer durch die Klimakrise geprägten Welt ist nicht das alt werden, was wir uns wünschen. Und es muss auch nicht das sein'
