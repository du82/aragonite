["https://frontiersin.org/about/leadership"]
title = "Frontiers | Leadership"
description = "Frontiers' leadership team is responsible for the overall strategy and policies and runs Frontiers' operations on a day to day basis"
full_description = "Kamila Markram, PhD CEO and co-founder, chair of the executive committee Kamila co-founded Frontiers with the vision to make research openly and widely available for the benefit of humanity.﻿ Kamila obtained a MSc in Psychology from the Technical University Berlin and completed her Master’s thesis at the Max-Planck Institute for Brain Research, Germany in 2003. She obtained an award-winning PhD degree in Neuroscience at the EPFL, Switzerland. During her postdoctoral studies at the EPFL she co-developed the 'Intense World Theory of Autism', which proposes that autism results from a 'super-brain' that perceives, absorbs, and feels too much – causing autistic people to withdraw from an overly intense world. The theory resonated beyond the research community, featuring in popular science magazines and documentaries, and published as a book, The boy who felt too much, in 2018. Kamila was named a L’HEBDO Forum 100 personality, a finalist for the 2016 Ernst and Young Entrepreneur Award and the 2017 EU Prize for Women Innovators, and a Special Prize Winner at the Vaud International Business Awards in 2021. Julian Oei President, Chief Business Officer, member of the executive committee Julian joined Frontiers in May 2023 and serves as President and Chief Business Officer. In this role he is the deputy to the CEO and is responsible for the overall strategy of Frontiers, the implementation of the annual strategic plan, the overall business model including expansion into new segments, and the group organizational structure. Before joining Frontiers, Julian spent 12 years with Holtzbrinck Publishing Group in various roles including Executive Vice President Group Strategy, CEO of Holtzbrinck Digital, and Chairman of Digital Science. He started his career as a strategy consultant and investment banker before moving into the media/publishing space. He is an alumnus of WHU – Otto Beisheim School of Management. Giovanni Lippi Chief Financial Officer, member of the executive committee Giovanni is Frontiers’ Chief Financial Officer, overseeing financial and accounts operations. He joined Frontiers in 2009 and has held various business support roles, including planning, operations, and leading the people team. Holding a Master’s degree in business administration, Giovanni has an extensive, global career in multiple sectors, including equity market trading at Euromobiliare SIM, software product development at Stockpoint Inc and more recently, board member and financial auditor at the Project Management Institute Switzerland Chapter."
