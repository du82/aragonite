full_description = "Librarians Support your researchers and institution today Your library plays a vital role in driving impactful research, and we’re maximizing it by removing the barriers to publishing. Enjoy discounts, dedicated support and a simplified process for your researchers. Consortia A consortium-wide collaboration for a more effective outcome Partnering with us ensures that your research is accessible to a wider audience, boosting the profile and reach of your consortium. Funders Stay up to date on the latest developments and make the right funding decisions Together we can support your grantees with increased access to high-quality papers. Our partners Collaboration and co-creation Explore our list of partnerships and learn more about how our partners are championing open access collaborations. How we work What to expect when partnering with Frontiers Reduced publishing costs, efficient communication channels, and a tailored dashboard where you can approve funding, monitor engagement and download reports. Your payment options What plans are available for my institution? The Frontiers Institutional Partnerships program offers flexible and predictable payment models. We ensure that institutions can allocate resources effectively while supporting open access initiatives. Our team Here to help you succeed Get in touch with our team and find out how your institution can benefit from an institutional partnership. Affiliated researchers How are we helping your researchers? Researchers are the core of the publishing community. With open access publishing, researchers can collaborate better and innovate faster. Discover if your institution is already part of the Frontiers partner community, Eligibility criteria Does my institution have a partnership with Frontiers? Find out if your institution is currently partnering with Frontiers and review our eligibility criteria. Research Topics Published on 28 Apr 2023 Learn more about Research Topics A Research Topic is a peer-reviewed article collection (similar to a special issue) that brings together researchers across disciplines to publish articles responding to critical research questions, emerging issues, and new ideas."
