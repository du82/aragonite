full_description = "Find a journal We have a home for your research. Our community journals and sections cover more than 1,700 academic disciplines. Find a topic Research Topics bring together leading researchers around emerging themes. Find your community or start a new one. Submit your research Ready to publish? Start your submission today and get more impact for your research by publishing with us. How to publish Check our guidelines and policies for everything you need, from choosing a journal to submitting your manuscript for review. Peer review Our efficient collaborative peer review means you’ll get a decision on your manuscript in an average of 61 days. PRESS RELEASE Published on 30 Jan 2025 How tackling sepsis can save millions of lives — and prevent future pandemic deaths Understanding the different types of immune dysregulation that cause sepsis will let us target treatments, lower future death tolls, and prevent lingering illness like long COVID-19. SCIENCE NEWS Published on 12 Feb 2025 500-year-old Transylvanian diaries show how the Little Ice Age completely changed life and death in the region Scientists used sources from the 'society's archive' to reconstruct the evolution of the climate and resulting effects on the people who lived in Transylvania in the 16th century. PRESS RELEASE Published on 05 Dec 2024 Gene editing and plant domestication essential to protect food supplies in a worsening climate, scientists say To continue producing enough food for the world, we need to adapt our crops by changing their genetic code or by domesticating their more resilient ancestors. SCIENCE NEWS Published on 14 Feb 2025 Dangerous bacteria lurk in hospital sink drains, despite rigorous cleaning Scientists have warned that potentially dangerous bacteria are lurking within the drains of hospitals, including several strains detected proved resistant to modern antibiotics, including cephalosporins and carbapenems. SCIENCE NEWS Published on 06 Feb 2025 Efforts to find alien life could be boosted by simple test that gets microbes moving Efforts to search for life on Mars set to be boosted with the discovery that L-serine, an amino acid, can induce movement in different bacteria. This method could eventually make life detection cheaper and faster."
