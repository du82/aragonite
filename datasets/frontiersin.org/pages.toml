description = "Open access publisher of peer-reviewed scientific articles across the entire spectrum of academia. Research network for academics to stay up-to-date with the latest scientific publications, events, blogs and news."
full_description = "Find a journal We have a home for your research. Our community journals and sections cover more than 1,700 academic disciplines. Find a topic Research Topics bring together leading researchers around emerging themes. Find your community or start a new one. Submit your research Ready to publish? Start your submission today and get more impact for your research by publishing with us. How to publish Check our guidelines and policies for everything you need, from choosing a journal to submitting your manuscript for review. Peer review Our efficient collaborative peer review means you’ll get a decision on your manuscript in an average of 61 days. PRESS RELEASE Published on 30 Jan 2025 How tackling sepsis can save millions of lives — and prevent future pandemic deaths Understanding the different types of immune dysregulation that cause sepsis will let us target treatments, lower future death tolls, and prevent lingering illness like long COVID-19. OPEN SCIENCE Published on 19 Dec 2024 2024 in review: a message from our CEO Frontiers CEO Kamila Markram reflects on a year in which quality and research integrity continued to be at the top of our agenda. PRESS RELEASE Published on 05 Dec 2024 Gene editing and plant domestication essential to protect food supplies in a worsening climate, scientists say To continue producing enough food for the world, we need to adapt our crops by changing their genetic code or by domesticating their more resilient ancestors. SCIENCE NEWS Published on 09 Dec 2024 Sugary drinks significantly raise cardiovascular disease risk, but occasional sweet treats don’t, scientists find Researchers studying the effects that different types of sugar consumption have on health risks have found that although higher sugar intake raises your risk of certain cardiovascular diseases, sugary drinks in particular carry notably higher risks. SCIENCE NEWS Published on 06 Dec 2024 3D scans of giant hailstones reveal surprising discoveries that could help predict future storms Hail is the result of raindrops being propelled into the coldest parts of the atmosphere. Now, with the help of CT scans, researchers could see the insides of the icy stones without breaking them for the first time."
