["https://frontiersin.org/guidelines/policies-and-publication-ethics"]
title = "Frontiers | Policies and publication ethics"
description = "All submissions to Frontiers must align with our and COPE ethics guidelines. All Frontiers articles since July 2012 are published under the Creative Commons CC-BY license"
full_description = '''Editorial policies and publication ethicsAuthorship policies Frontiers’ authorship policy ensures that all intellectual contributors are appropriately credited for their involvement in the work, as well as ensuring authors and contributors take responsibility for the final published material. We ask that individuals contributing to academic work are clearly defined as either named authors (published in the byline and details specified in the contributions statement) or contributors (credited for their contribution in the acknowledgments section).Author affiliations Authors must list the institution at the time that the research was conducted as their primary affiliation. Further affiliations can be listed subsequently in the submission system. Qualifying for named authorship Frontiers follows the International Committee of Medical Journal Editors (ICMJE) guidelines which state that, in order to qualify for authorship of a manuscript, the following criteria should be observed.Acquisition, analysis, or interpretation of data for the workDrafting the work or revising it critically for important intellectual contentProvide approval for publication of the contentAgree to be accountable for all aspects of the work in ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolvedContributors who do not meet these criteria but nonetheless provided important contributions to the final manuscript should be included in the acknowledgment section. It is the author's responsibility to get written approval from the persons named in the acknowledgment section.Author contribution and CRediT taxonomy Frontiers uses CRediT (Contributor Roles Taxonomy), which provides a standardized framework for acknowledging individual contributions to research projects, including 14 roles that can be used to represent the roles typically played by contributors to research outputs.During the submission process, the submitting author will be asked to specify each co-author's contributions to the manuscript by choosing from among the 14 CRediT roles (listed in the table below). The authors’ contributions statement will be generated automatically based on the information provided, for example: 'AB: Writing – review & editing, Conceptualization, Methodology, Project administration; CZD: Writing – review & editing, Conceptualization, Methodology; EF: Writing – original draft, Conceptualization, Methodology; CYD: Writing – review & editing, Formal Analysis; GH: Writing – review & editing; IJ: Writing – review & editing.'To comply with Frontiers authorship policy and ICMJE authorship criteria, each of the co-authors must have participated in writing the original manuscript draft, and/or have critically reviewed and edited the manuscript. Contributors who do not fulfill all ICMJE authorship criteria must be included in the acknowledgments section of the manuscript with their permission. CRediT roles ConceptualizationIdeas; formulation or evolution of overarching research goals and aims.Data curationManagement activities to annotate (produce metadata), scrub data and maintain research data (including software code, where it is necessary for interpreting the data itself) for initial use and later re-use.Formal analysisApplication of statistical, mathematical, computational, or other formal techniques to analyze or synthesize study data.Funding acquisitionAcquisition of the financial support for the project leading to this publication.InvestigationConducting a research and investigation process, specifically performing the experiments, or data/evidence collection.MethodologyDevelopment or design of methodology; creation of models.Project administrationManagement and coordination responsibility for the research activity planning and execution.ResourcesProvision of study materials, reagents, materials, patients, laboratory samples, animals, instrumentation, computing resources, or other analysis tools.SoftwareProgramming, software development; designing computer programs; implementation of the computer code and supporting algorithms; testing of existing code components.SupervisionOversight and leadership responsibility for the research activity planning and execution, including mentorship external to the core team.ValidationVerification, whether as a part of the activity or separate, of the overall replication/reproducibility of results/experiments and other research outputs.VisualizationPreparation, creation and/or presentation of the published work, specifically visualization/data presentation.Writing – original draftPreparation, creation and/or presentation of the published work, specifically writing the initial draft (including substantive translation).Writing – review & editingPreparation, creation and/or presentation of the published work by those from the original research group, specifically critical review, commentary, or revision – including pre or post-publication stages. Responsibilities of corresponding authors The corresponding author takes primary responsibility for communication with the journal and editorial office during the submission process, throughout peer review, and during publication. The corresponding author is also responsible for ensuring that the submission adheres to all journal requirements, including, but not exclusive to, details of authorship, study ethics and ethics approval, clinical trial registration documents, and conflict of interest declaration. The corresponding author should also be available post-publication to respond to any queries or critiques.Changes in authorship The submitting author is expected to include all co-authors on the submission system during the manuscript submission process. Requests to change the authors’ list will be considered only in exceptional circumstances and only where the authorship change is in adherence with Frontier's existing authorship policy. Requests to modify the authors’ list after submission should be made to the editorial office using the authorship change request form. Authorship changes requested post-acceptance will be denied except in exceptional circumstances. In case of any concerns regarding potential authorship manipulation, Frontiers reserves the right to contact the authors’ institution(s) for further investigation and/or decline the requested changes.Publication ethics policies The following policies ensure that Frontiers’ high standards of publication ethics is maintained. They discuss established best practices in publishing and definitions of scientific, academic or publishing misconduct. We advise that you review the policies below to ensure your submission meets the necessary requirements to ensure the integrity of submissions to Frontiers.Where evidence of misconduct is found, we reserve the right to take action that may include rejection, retraction, and/or further follow-up with the institution. Inclusive language policy Frontiers is committed to upholding and fostering an environment that champions diversity, equity, and inclusivity (DEI) in all its aspects. It is our pledge to ensure that every individual has an equal opportunity to be a part of the scientific community. Our mission at Frontiers is to make science open, and that means it should be accessible to everyone. To achieve this, our use of language must be culturally sensitive and inclusive of others - readers, authors, and staff alike. In recognition of the evolving nature of language, we must strive to remain on top of cultural nuances and shifts over time, while continuously reviewing our unconscious biases. What is deemed acceptable may not always be universal and will differ across geography and time. Authors, reviewers, editors, and Frontiers' staff have a shared responsibility to ensure that articles submitted and published use language that is appropriate for the respective field and is free from terminology that could be interpreted as hostile or offensive to people based on group differences such as ethnicity, gender, sexuality, age, or health. We expect all authors to demonstrate receptiveness to feedback on their choice of words or language from the editors and reviewers. We are committed to suggesting alternative language to ensure that all publications adhere to our inclusive language requirements. Frontiers will endeavour to support authors to replace offensive, outdated or exclusionary terms during the review process, however, we reserve the right not to publish material that goes against this policy. In certain exceptional circumstances, and to uphold our commitment to diversity and equity, we may modify language pre- and post-publication to ensure compliance with this policy. The process of using inclusive language relates to day-to-day communication as well as content published by Frontiers. As part of this, all individuals should be culturally sensitive and inclusive of others in all communications. Plagiarism, redundant publication and ethical text-reuse policies Material submitted to Frontiers must comply with the following policies to ensure ethical publication of academic work.Originality of content and duplicate submission Frontiers only publishes original content. Authors confirm that the content they're submitting is original in the terms and conditions upon submission. Manuscripts submitted to Frontiers must not have been previously published or be under consideration for publication elsewhere, either in whole or in part. If an article has been previously submitted for publication elsewhere, Frontiers will only consider publication if the article has been definitively rejected by the other publisher(s) at the point of submission to Frontiers.Submitting to multiple journals is classified as duplicate submission and is considered publication misconduct.Fabrication and falsificationFrontiers opposes both the fabrication of data or images (that is, fake or made-up data) and falsification of data or images (that is, the intentional misrepresentation or deceptive manipulation of data).Manuscripts prepared and written by commercial entities (fake-paper factories, ‘paper mills’) on behalf of researchers listed as authors on the manuscript do not meet Frontiers' policies and will not be considered for publication. We will take proactive action to reject suspicious manuscripts before peer review.Redundant publication Redundant publication occurs when the same research (same or similar idea, data, results, and or drawn conclusions) is published more than once by the same or overlapping author groups. This includes adding small amounts of new data to an existing published paper and submitting it for review or publishing the same paper in multiple journals (sometimes known as salami slicing). This type of publication is unethical, and manuscripts where redundant publication is shown to have occurred will not be considered for publication in a Frontiers journal. All submissions are screened for redundancy. To ensure the manuscript complies with our policy, authors must disclose any related publications and cite all related material where appropriate. It is advisable to discuss how the publication adds to the literature beyond any preliminary or related studies in the introduction. Frontiers follows the COPE guidelines on redundant publication. Plagiarism Plagiarism occurs when an author attempts to present previously published work as original content. Every manuscript submitted to Frontiers is screened for textual overlap by the software CrossCheck, powered by iThenticate. Manuscripts found to contain textual overlap will not be considered for publication by Frontiers. We check all submitted manuscripts for plagiarism and duplication and publish only original content. Those manuscripts where plagiarism or duplication is shown to have occurred will not be considered for publication in a Frontiers journal. It is required that all submissions consist of content that has not been published previously. In accordance with COPE guidelines, we expect that "original wording taken directly from publications by other researchers should appear in quotation marks with the appropriate citations." This condition also applies to an author's own work.Ethical text re-use and permitted publications Theses and dissertationsFrontiers allows the inclusion of content that first appeared in an author's thesis so long as this is the only form in which it has appeared, is in line with the author's university policy, and can be accessed online. If the thesis is not archived online, it is considered original, unpublished data and is subject to the unpublished data restrictions of some article types. Inclusion of material from theses or dissertations should be noted in the Acknowledgements section of the manuscript and cited accordingly in the reference list. For some examples, please check the 'References' section of our author guidelines.Conferences, proceedings, and abstractsManuscripts that first appeared as conference papers must be expanded upon if they are to be considered as original work. Authors are required to add a substantial amount of original content in the form of new raw material (experiments, data) or new treatment of old data sets, which lead to original discussion and/or conclusions, providing value that significantly exceeds the original conference version. As a rule of thumb, at least 30% of the content must be original. Authors submitting such work are required to:seek permission for reuse of the published conference paper if the author does not hold the copyrightcite the conference in the acknowledgments section or the references section if applicable.BlogsAlthough permissible, extended manuscript content that previously appeared online in non-academic media, such as blogs, should be declared at the time of submission in the acknowledgments section of the manuscript.PreprintsOur supportive preprint policy encourages full open access at all stages of a research paper, to share and generate knowledge researchers need to support their work. Authors publishing in Frontiers journals may share their work ahead of submission to a peer-reviewed journal, as well as during the Frontiers review process, on repositories or preprint servers, provided that the server imposes no restrictions upon the author's full copyright and re-use rights. Also note that any manuscript files shared after submission to Frontiers journals, during the review process, cannot contain the Frontiers logo or branding.Correct attribution of the original source in repositories or preprint servers must be included within the manuscript on submission or added at re-submission if the deposition is done during the review process. We ask that the preprint is both listed within the acknowledgement section and the full citation included in the reference list.If the article is published, authors are then strongly encouraged to link from the preprint server to the Fron'''
