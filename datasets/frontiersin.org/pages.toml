the world. Data source: Altmetric 2024Evaluating researchTo benchmark the reach, influence and quality of our journals, we measure and communicate a range of indicators of our journals’ impact, including Journal Impact Factors, CiteScores, overall citation rates, aggregate views and downloads, press pick-ups, and social media mentions.We fully support the responsible use of Journal Impact Factors, other quantitative research metrics, and innovative ways for researcher evaluation, as proposed by the San Francisco Declaration on Research Assessment (DORA, to which we are a signatory), the Leiden Manifesto, the Metric Tide for Responsible Metrics and the European Commission's Expert Group on Altmetrics."
