title = "Frontiers | Science news"
description = "The latest science & research news from Frontiers - Publishing the most cited open-access journals in their fields"
full_description = "Featured newsPublished on 25 Feb 2025Laser-powered device tested on Earth could help us detect microbial fossils on MarsScientists successfully identify microbe fossils in terrestrial rocks like those found on Mars, opening up the possibility of searching for fossils on the Red Planet. Today, we interview Dr Nerea Casal García, professor at the Institut Nacional d'Educació Física de CatalunyaFeatured newsPublished on 27 Feb 2025Taking sports science in her stride: how Dr Nerea Casal García aims to maximise performance on the trackCasal García is the corresponding author of a new article in Frontiers in Sports and Active Living, which reveals a pronounced recent shift of stride patterns during elite women's 400 meters hurdle competitions. She has kindly taken the time to share some thoughts about her career and research as part of our Frontier Scientist series. Graffiti in Alto Hospicio that shows how the city is currently supplied with water. Credit: Dr Virginia Carter Gamberini. EnvironmentPublished on 20 Feb 2025‘Fog harvesting’ could yield water for drinking and agriculture in the world’s driest regions A field study spanning a year showed that water collected from fog could ease water scarcity affecting vulnerable populations living in Chile’s Atacama Desert Research TopicsPublished on 27 Feb 2025Four Research Topics on turning science into action for a sustainable futureFour Research Topics showcasing solutions for a more sustainable world. HealthPublished on 14 Feb 2025Dangerous bacteria lurk in hospital sink drains, despite rigorous cleaningResearchers from Spain sampled sink drains from different wards in a single modern university hospital where state-of-the-art cleaning protocols are adhered to. Through culturing and DNA barcoding, they found 67 species of bacteria. These included Klebsiella, Enterobacter, and Pseudomonas aeruginosa, notorious for their potential to cause healthcare-associated infections. Several strains detected proved resistant to modern antibiotics, including cephalosporins and carbapenems. Sink drains thus appear to function as reservoirs for known and emerging pathogens of concern."
