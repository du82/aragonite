d Allergy1.10.67.3kQ4Q4Journal of Pharmacy and Pharmaceutical Sciences2.96.9Q2Q1Oncology Reviews3.16.355.2kQ2Q2Pastoralism: Research, Policy and Practice1.74.2Q3Q1Pathology and Oncology Research2.36.3930kQ2Q1Public Health Reviews3.58.3419kQ1Q1Spanish Journal of Soil Science 2.02.268.9kQ3Q3Transplant International2.74.7Q1Q2 See all journalsHow are journal metrics calculated? The Journal Impact Factor is the average number of citations received in the last year to articles published in the previous two years. It is measured each year by the Web of Science Group and reported in the Journal Citation Reports (JCR). The Journal Impact Factors, published in this year's report, are based on citations in 2023 for articles published in 2021 and 2022.The CiteScore journal impact metric measures the average citations received in a four-year time window to selected documents published in the same four years. The 2023 CiteScores (released in 2024) are based on citations received to articles, reviews, conference papers, book chapters, and data papers published in 2020-2023, divided by the total number of documents published in this four-year window. CiteScore covers all journal titles in Elsevier's Scopus database and is released once a year. Infographic showing how the annual Journal Impact Factors and CiteScores are each calculatedTotal journal citationsMany of our journals rank as the most influential and most cited in their fields, including neurosciences, immunology, microbiology, plant science, and psychology.Journal Citation Report Data source: Journal Citation Reports 2024Ranking of the most cited journals in JCR categories (released in 2024 by Web of Science Group). Bar plots show the total number of citations received in 2023 to articles published in 2021 and 2022, with Frontiers' journals in blue. Clinical Neurology (SCIE) (278 Journals) Developmental Biology (SCIE) (39 Journals) Endocrinology & Metabolism (SCIE) (187 Journals) Genetics & Heredity (SCIE) (191 Journals) 