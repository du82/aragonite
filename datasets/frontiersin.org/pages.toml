["https://frontiersin.org/about/research-topics"]
title = "Frontiers | Research Topics"
description = "Frontiers' Research Topics are peer-reviewed article collections around cutting-edge research themes defined, managed, and led by renowned researchers"
full_description = "Research TopicsFrontiers' Research Topics are collaborative hubs built around an emerging theme. ​​Defined, managed, and led by renowned researchers, they bring together leading experts around a shared area of interest – stimulating collaboration and accelerating science. Managed and disseminated on Frontiers' custom open science platform, topics are free to access and highly visible. They maximize the impact of your research by getting it out into the community so more people can read and discuss it.Browse open topicsShape the future of your fieldBecome a guest editor for a topic around your own area of research. Benefit from increased impact and discoverability, a dedicated platform and support team, and rigorous peer review for every paper.Suggest your topicAs a guest editor you will:edit a topic around your chosen areagrow your network and collaborate with leading researchers around the worldtrack impact in real-time with advanced impact metricsensure quality through rigorous, transparent and fast peer reviewincrease visibility with the possibility of a freely shareable ebook.More impactThanks to Frontiers' platform, anyone and everyone around the world will have free and unrestricted online access to your Research Topic.Each topic has its own page and can be cross-listed from multiple Frontiers' journals. Plus you can track your impact in real-time with our advanced impact metrics.More collaborationCollaborate with colleagues from around the world to propose a topic. We encourage early career researchers to team up with more senior colleagues.Grow your network by inviting key experts to contribute to your topic and ensure the quality of every article with our collaborative peer review – a unique online forum with real-time interactions.More supportManaging a Research Topic is simple with our innovative technology and professional support team. We'll support you through every step of the process, from defining your topic and inviting contributors to promoting your topic and tracking impact.With Frontiers you also retain the copyright of your work by publishing under the CC-BY license.Submit your topicSuggest your topic, or ask for more information, by contacting our editorial team.We welcome teams of guest editors to propose Research Topics. Early career researchers are encouraged to team up with senior colleagues.Publication feesOpen access provides free, unrestricted online access to research for everyone in the world. Frontiers is a gold open access publisher. This means that we maintain high quality services through article processing charges (APCs). Articles accepted for publication following peer-review by our external editors will incur a publishing fee."
