["https://frontiersin.org/about/research-integrity"]
title = "Frontiers | Research integrity"
description = "Discover how Frontiers upholds research integrity through rigorous peer review, AI-powered quality checks, and industry-wide collaboration to safeguard the scientific community."
full_description = '''Julie Svalastog Research Integrity Manager "There's a dropping trust in science. I think the COVID pandemic spurred on quite a lot of this discussion because of the lack of trust in vaccines. People were asking a lot more questions of the research with a demand to know what the truth is." Renee Devonish Peer Review Portfolio Manager "Equity, transparency, collaboration, and accessibility. These are the core principles of open access and they all hinge on trust. This is even more critical for open access publishers because our work reachers a much broader audience. Think about it: a patient looking up a new diagnosis or a policy maker building a case for innovation - they need to trust the research they find. Without a strong commitment to these values we can't hope to build a more knowledgeable, equitable, and sustainable world." Javier Salguero Specialty Chief Editor, Frontiers in Veterinary Science, UK Health Security Agency (UKHSA) "I like Frontiers' artificial intelligence assistant, AIRA, which helps at the beginning to detect some issues. This can save time for editors because you know you'll be working with manuscripts that are fit for review." Elena Vicario Head of Research Integrity “Frontiers’ approach to RI sets us apart. Our proactive and detailed approach to pre-screen for research integrity issues before peer review is unique in the publishing industry. We are also pioneers in exploring patterns and using data and audits to uncover larger fraudulent networks. If you are not doing this, you are risking problematic articles reaching peer reviewers or the wider community.” Ryan Begley Research Integrity Manager "We’re now seeing not just individual researchers committing misconduct for their own benefit, but an entire business model built around it, such as papermills and authorship for sale. The historical foundations of publishing incentives, as well as more researchers and more funding, have created an entire industry that has only really come to the surface in the past five or so years."'''
