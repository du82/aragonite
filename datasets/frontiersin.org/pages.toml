["https://frontiersin.org/guidelines/author-guidelines"]
title = "Frontiers | Author guidelines"
description = "How should authors submitting to Frontiers format their articles ? Find on this page the Author guidelines explaining everything you need to know"
full_description = "Author guidelinesWriting and formatting Title The title should be concise, omitting terms that are implicit and, where possible, be a statement of the main result or conclusion presented in the manuscript. Abbreviations should be avoided within the title.Witty and creative titles are welcome, but only if relevant and within measure. Consider if a title meant to be thought-provoking might be misinterpreted as offensive or alarming. In extreme cases, the editorial office may veto a title and propose an alternative.Authors should avoid:titles that are a mere question without giving the answerunambitious titles, for example starting with 'Towards,' 'A description of,' 'A characterization of' or 'Preliminary study on'vague titles, for example starting with 'Role of', 'Link between', or 'Effect of' that do not specify the role, link, or effectincluding terms that are out of place, for example the taxonomic affiliation apart from species name.Abstract As a primary goal, the abstract should make the general significance and conceptual advance of the work clearly accessible to a broad readership. The abstract should be no longer than a single paragraph and should be structured, for example, according to the IMRAD format. For the specific structure of the abstract, authors should follow the requirements of the article type or journal to which they're submitting. Minimize the use of abbreviations and do not cite references, figures or tables.For clinical trial articles, please include the unique identifier and the URL of the publicly accessible website on which the trial is registered.Manuscript length We encourage you to closely follow the article word count lengths given in the 'Article types' page of the journals. The manuscript length includes only the main body of the text, footnotes, and all citations within it, and excludes the abstract, section titles, figure and table captions, funding statement, acknowledgments, and references in the bibliography. Please indicate the number of words and the number of figures and tables included in your manuscript on the first page.Sections The manuscript is organized by headings and subheadings. The section headings should be those appropriate for your field and the research itself. You may insert up to 5 heading levels into your manuscript (i.e.,: 3.2.2.1.2 Heading Title).For Original Research articles, it is recommended to organize your manuscript in the following sections or their equivalents for your field.IntroductionSuccinct, with no subheadings.Materials and methodsThis section may be divided by subheadings and should contain sufficient detail so that when read in conjunction with cited references, all procedures can be repeated. For experiments reporting results on animal or human subject research, an ethics approval statement should be included in this section (for further information, see the 'Bioethics' section of our policies and publication ethics.)ResultsThis section may be divided by subheadings. Footnotes should not be used and must be transferred to the main text.DiscussionThis section may be divided by subheadings. Discussions should cover the key findings of the study: discuss any prior research related to the subject to place the novelty of the discovery in the appropriate context, discuss the potential shortcomings and limitations on their interpretations, discuss their integration into the current understanding of the problem and how this advances the current views, speculate on the future direction of the research, and freely postulate theories that could be tested in the future.For further information, please check the descriptions defined in the journal's 'Article types' page, in the 'For authors' menu on every journal page.Language editing Frontiers requires manuscripts submitted to meet international English language standards to be considered for publication.For authors who would like their manuscript to receive language editing or proofreading to improve the clarity of the manuscript and help highlight their research, we recommend the language-editing services provided by the following external partners.Note that sending your manuscript for language editing does not imply or guarantee that it will be accepted for publication by a Frontiers journal. Editorial decisions on the scientific content of a manuscript are independent of whether it has received language editing or proofreading by these partner services or other services.EditageWe recommend the language-editing service provided by our external partner Editage. These services may be particularly useful for researchers for whom English is not the primary language. They can help to improve the grammar, syntax, and flow of your manuscript prior to submission. Frontiers' authors will receive a 10% discount by visiting the following link: editage.com/frontiers.The Charlesworth GroupWe recommend the Charlesworth Group's author services, who has a long-standing track record in language editing and proofreading. This is a third-party service for which Frontiers' authors will receive a 10% discount by visiting the following link: www.cwauthors.com/frontiers.Frontiers推荐您使用在英语语言编辑和校对领域具有悠久历史和良好口碑的查尔斯沃思作者服务。此项服务由第三方为您提供，Frontiers中国作者通过此链接提交稿件时可获得10％的特别优惠: www.cwauthors.com.cn/frontiers.Language style The default language style at Frontiers is American English. If you prefer your article to be formatted in British English, please specify this on the first page of your manuscript. For any questions regarding style, we recommend authors to consult the Chicago Manual of Style.Inclusive language guidelines Frontiers is an inclusive publisher and we ask that all submissions are in line with our inclusive language policy. When preparing your manuscript for submission, take a mindful approach towards personal biases and a concerted effort to limit their influence. Authors should remove any suggestion or implication of superiority or inferiority of one person over another based on age, gender, race, ethnicity, culture, sexual orientation, disability, religion, or socio-economic class. We ask authors to use inclusive language practices and awareness of diversity, equity, and inclusion into their research and keep it at the forefront during the composition of their findings.External guidance that may be useful is available at C4DISC’s Guidelines on Inclusive Language and Images in Scholarly Communication.Furthermore, when drafting your work, please take into account the following considerations In general, seek to avoid language that could be deemed insulting, profane, or derogatory. descriptors that identify personal attributes such as age, gender, race, ethnicity, culture, sexual orientation, disability, or health conditions, where they are not critically relevant to the discussion. any form of language that suggests a particular culture or group as the default or standard. And where feasible: proactively ask individuals or groups how they would prefer to be referenced. adhere to the SAGER guidelines for reference to sex and gender in research. Remember, the language we use can influence perceptions, evoke emotions, and shape perspectives. Let’s work together to nurture an inclusive, respectful, and empowering discourse in science. Guidelines for artificial intelligence and related technologies These guidelines cover acceptable uses of generative AI technologies such as Large Language Models (ChatGPT, Jasper) and text-to-image generators (DALL-E 2, Midjourney, Stable Diffusion) in the writing or editing of manuscripts submitted to Frontiers.Use of AI to create written or visual contentAuthors should not list a generative AI technology as a co-author or author of any submitted manuscript. Generative AI technologies cannot be held accountable for all aspects of a manuscript and consequently do not meet the criteria required for authorship.If the author of a submitted manuscript has used written or visual content produced by or edited using a generative AI technology, this use must follow all Frontiers guidelines and policies. Specifically, the author is responsible for checking the factual accuracy of any content created by the generative AI technology. This includes, but is not limited to, any quotes, citations or references. Figures produced by or edited using a generative AI technology must be checked to ensure they accurately reflect the data presented in the manuscript. Authors must also check that any written or visual content produced by or edited using a generative AI technology is free from plagiarism.If the author of a submitted manuscript has used written or visual content produced by or edited using a generative AI technology, such use must be acknowledged in the acknowledgements section of the manuscript and the methods section if applicable. This explanation must list the name, version, model, and source of the generative AI technology.We encourage authors to upload all input prompts provided to a generative AI technology and outputs received from a generative AI technology in the supplementary files for the manuscript.The entire document should be single-spaced and must contain page and line numbers in order to facilitate the review process. The manuscript should be written using either Word or LaTeX. See above for templates. Abbreviations and nomenclatures The use of abbreviations should be kept to a minimum. Non-standard abbreviations should be avoided unless they appear at least four times, and must be defined upon first use in the main text. Consider also giving a list of non-standard abbreviations at the end, immediately before the acknowledgments.Equations should be inserted in editable format from the equation editor.Italicize gene symbols and use the approved gene nomenclature where it is available. For human genes, please refer to the HUGO Gene Nomenclature Committee (HGNC). New symbols for human genes should be submitted to the HGNC here. Common alternative gene aliases may also be reported, but should not be used alone in place of the HGNC symbol. Nomenclature committees for other species are listed here. Protein products are not italicized.We encourage the use of Standard International Units in all manuscripts.Chemical compounds and biomolecules should be referred to using systematic nomenclature, preferably using the recommendations by the International Union of Pure and Applied Chemistry (IUPAC).Astronomical objects should be referred to using the nomenclature given by the International Astronomical Union (IAU) provided here.Life Science Identifiers (LSIDs) for ZOOBANK registered names or nomenclatural acts should be listed in the manuscript before the keywords. An LSID is represented as a uniform resource name (URN) with the following format: urn:lsid:<Authority>:<Namespace>:<ObjectID>[:<Version>]For more information on LSIDs please see the 'Code' section of our policies and publication ethics.Enhancing search engine optimization (SEO) There are a few simple ways to maximize your article's discoverability and search results. Include a few of your article's keywords in the title of the articleDo not use long article titlesPick 5-8 keywords using a mix of generic and more specific terms on the article subject(s)Use the maximum amount of keywords in the first two sentences of the abstractUse some of the keywords in level 1 headingsReferences Preparing and formatting referencesSubmissions to Frontiers must be grounded in relevant and up to date peer-reviewed, academic research, and this should be reflected in the accompanying reference lists.Authors are welcome to use online referencing tools in preparation of their manuscript. Some useful resources include RefMe, Zotero, and Mendeley.The citation of non-academic and non-peer-reviewed sources (e.g. blog posts, website content), as well as anonymous sources or commercial websites should be avoided or kept to a minimumAuthors should avoid citing content that is not directly relevant to the scope of the article and the journalReference lists should reflect the current status of knowledge in the field, avoid bias, and not include a high proportion of citations to the same authors or sources, school of thought, etc.The length of the reference list should be appropriate depending on the article type, covering the relevant literature through sufficient referencingAuthors should ensure that references are accurate, that all links are accessible, and that the citations/references adhere to the reference styles outlined belowFrontiers' journals use one of two reference styles, either Harvard (author-date) or Vancouver (numbered). These formats should be adhered to for the in-text citations and the reference lists. Please check our help center to find the correct style for the journal to which you're submitting.All citations of published works in the text, figures, or tables must be in the reference list and vice-versa.The names of the first six authors followed by et al. and the DOI (when available) should be provided.Given names of authors should be abbreviated to initials (e.g. Smith, J., Lewis, C.S., etc.).The reference list should only include articles that are published or accepted.Unpublished data, submitted manuscripts, or personal communications should be cited within the text only, for article types that allow such inclusions. Where additional details are available, these will be included as footnotes.For accepted but unpublished works use 'in press' instead of page numbers.Data sets that have been deposited to an online repository should be included in the reference list. Include the version and unique identifier when available.Personal communications should be documented by a letter of permission.Website URLs should be included as footnotes.Any inclusion of verbatim text must be contained in quotation marks and should clearly reference the original source.Preprints can be cited provided that a DOI or archive URL is available, and the citation clearly mentions that the contribution is a preprint. If a peer-reviewed journal publication for the same preprint exists, the official journal publication is the preferred source. See the preprints section for each reference style below for more information.Harvard reference style (author-date) Reference examples for Frontiers’ journals using the Harvard referencing system can be found below. For examples of other sources, and for general questions regarding the Harvard reference style, please refer to the Chicago Manual of Style.References should include the full last name and first name initials of the first six authors, followed by et al. and the year of publication in brackets.Alphabetical order is followed for the reference list. Reference guidelines - Harvard Source Reference list entry In-text citation Article in a print journalSondheimer, N., and Lindquist, S. (2000). Rnq1: an epigenetic modifier of protein function in yeast. Mol. Cell. 5, 163-172.(Sondheimer and Lindquist, 2000)Article in an o"
