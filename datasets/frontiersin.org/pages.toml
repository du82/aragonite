full_description = "Image: Shutterstock.comFeatured newsPublished on 07 Feb 2025Relationships that shape us: here are five Frontiers articles on social relationships for Valentine’s DayAt Frontiers, we bring some of the world’s best research to a global audience. But with tens of thousands of articles published each year, it’s impossible to cover all of them. With Valentine’s Day just around the corner, we’re taking a look at some papers that help us understand how the relationships we have with the people around us shape our lives. Scientists used sources from the 'society's archive' to reconstruct the evolution of the climate and resulting effects on the people who lived in Transylvania in the 16th century. Credit: Gaceu et al., 2024. Featured newsPublished on 12 Feb 2025500-year-old Transylvanian diaries show how the Little Ice Age completely changed life and death in the regionTapping into ‘society’s archive’, researchers have examined written sources from the 16th century that chronicle famine, excessive flooding, and plagues in what today is Romania. Featured newsPublished on 14 Feb 2025Dangerous bacteria lurk in hospital sink drains, despite rigorous cleaningResearchers from Spain sampled sink drains from different wards in a single modern university hospital where state-of-the-art cleaning protocols are adhered to. Through culturing and DNA barcoding, they found 67 species of bacteria. These included Klebsiella, Enterobacter, and Pseudomonas aeruginosa, notorious for their potential to cause healthcare-associated infections. Several strains detected proved resistant to modern antibiotics, including cephalosporins and carbapenems. Sink drains thus appear to function as reservoirs for known and emerging pathogens of concern. Three middle-aged friends play a casual game of basketball; one is in a wheelchairFeatured newsPublished on 10 Feb 2025Scientists find that a playful approach to life activates ‘lemonading’, which helps people cope with adversity Highly playful people are realistic about their circumstances, scientists say, but they are more resilient in the present and more optimistic about the future."
