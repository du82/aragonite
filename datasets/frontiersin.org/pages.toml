["https://www.frontiersin.org/about/mission"]
title = "Frontiers | Mission"
description = "Our mission is to make science open so that scientists can collaborate better and innovate faster to enable healthy lives on a healthy planet"
full_description = "About FrontiersFrontiers is a leading research publisher. Our role is to provide the world’s scientists with a rigorous and efficient publishing experience. Powered by custom-built technology, artificial intelligence, and a constructive peer review, our community journals give experts in more than 1,800 academic fields an open access platform to publish high quality, high impact research. ​Through our outreach work to build strong partnerships with business, policymakers, and educators, we’re leading the transition to open science.​Our missionOur mission is to make science open – so that scientists can collaborate better and innovate faster to deliver the solutions that enable healthy lives on a healthy planet. Research is the foundation of modern society and it’s thanks to advances in science that we enjoy longer, healthier and more prosperous lives than ever before in human history. We want to make science even more powerful by ensuring it is openly available. This way, society will be able to generate more knowledge and accelerate innovation, health and prosperity for all. Our innovationsWe place researchers at the center of everything we do and empower them through pioneering technology, artificial intelligence, outstanding service and rigorous quality standards. Community-driven journalsLeading researchers serve as independent editors and reviewers on our editorial boards.Research Topics Collaborative hubs bringing communities of researchers together around emerging and important areas of research.Collaborative peer reviewOur unique online forum with real-time interactions to ensure rigorous, constructive and transparent peer review.AIRA – our artificial intelligence review assistant AI which supports the review and quality control of research articles.Impact metrics A suite of article level metrics, measuring article and author impact. Frontiers for Young Minds A platform where young people engage with leading scientists to review cutting-edge research and make sure it's accessible for their peers.Frontiers Planet PrizeAn annual global prize celebrating solutions that show measurable potential to help humanity remain within the boundaries of the Earth’s ecosystem. Key factsArticles published with us have been cited 9.4 million times, and viewed and downloaded more than 2.8 billion times109 of the journals published by Frontiers have an Impact Factor113 of the journals published by Frontiers have a CiteScoreFrontiers June 2024Our valuesOur core values are key to achieving our mission and form a golden thread through everything we do.Scientists power modern society. That's why every decision we make starts with one consideration: what’s best for the researcher – the people doing the science? Our role is to provide the world’s scientists with the best, the fastest, and the most efficient publishing experience. This approach forms the basis of our five values. Researcher-centricity: We place the researcher at the center of everything we do.Collaboration: We are dedicated to building communities and working together to empower each other.Innovation: We are bold in our decision-making, driven by technology and innovation, and constantly making improvements.Quality: We are rigorous in everything we do and committed to only the highest quality standards. Speed: We work efficiently and decisively to achieve results. Read more:Our impactOur latest progress report"
