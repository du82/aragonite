d Allergy1.10.67.3kQ4Q4Journal of Pharmacy and Pharmaceutical Sciences2.96.9Q2Q1Oncology Reviews3.16.355.2kQ2Q2Pastoralism: Research, Policy and Practice1.74.2Q3Q1Pathology and Oncology Research2.36.3930kQ2Q1Public Health Reviews3.58.3419kQ1Q1Spanish Journal of Soil Science 2.02.268.9kQ3Q3Transplant International2.74.7Q1Q2 See all journalsHow are journal metrics calculated? The Journal Impact Factor is the average number of citations received in the last year to articles published in the previous two years. It is measured each year by the Web of Science Group and reported in the Journal Citation Reports (JCR). The Journal Impact Factors, published in this year's report, are based on citations in 2023 for articles published in 2021 and 2022.The CiteScore journal impact metric measures the average citations received in a four-year time window to selected documents published in the same four years. The 2023 CiteScores (released in 2024) are based on citations received to articles, reviews, conference papers, book chapters, and data papers published in 2020-2023, divided by the total number of documents published in this four-year window. CiteScore covers all journal titles in Elsevier's Scopus database and is released once a year. Infographic showing how the annual Journal Impact Factors and CiteScores are each calculatedTotal journal citationsMany of our journals rank as the most influential and most cited in their fields, including neurosciences, immunology, microbiology, plant science, and psychology.Journal Citation Report Data source: Journal Citation Reports 2024Ranking of the most cited journals in JCR categories (released in 2024 by Web of Science Group). Bar plots show the total number of citations received in 2023, with Frontiers journals in blue. Clinical Neurology (SCIE) (278 Journals) Developmental Biology (SCIE) (39 Journals) Endocrinology & Metabolism (SCIE) (187 Journals) Genetics & Heredity (SCIE) (191 Journals) Geriatrics & Gerontology (SCIE) (74 Journals) Immunology (SCIE) (181 Journals) Marine & Freshwater Biology (SCIE) (113 Journals) Microbiology (SCIE) (161 Journals) Neurosciences (SCIE) (310 Journals) Pediatrics (SCIE) (186 Journals) Pharmacology & Pharmacy (SCIE) (354 Journals) Physiology (SCIE) (85 Journals) Plant Sciences (SCIE) (265 Journals) Psychiatry (SCIE) (279 Journals) Psychology, Multidisciplinary (SSCI) (218 Journals) CiteScore Data source: Scopus 2024Ranking of the most cited journals in 2023 CiteScore categories (released in 2024 by Scopus, Elsevier). Bar plots show the total number of citations received in 2020–2023 to articles, reviews, conference papers, book chapters and data papers published in 2020–2023, with Frontiers journals in blue. Cell Biology (285 journals) Developmental Biology (82 journals) Endocrinology, Diabetes and Metabolism (244 journals) Genetics (clinical) (99 journals) Histology (62 journals) Immunology (236 journals) Immunology and Allergy (233 journals) Microbiology (182 journals) Microbiology (medical) (140 journals) Neurology (192 journals) Neurology (400 journals) Neuroscience subject area (632 journals) Pharmacology (313 journals) Pharmacology (medical) (272 journals) Plant Science (516 journals) Psychiatry and Mental Health (567 journals) Psychology (all) (216 journals) *Neuroscience subject area: The ranking is calculated from CiteScore citations to all journals in the Frontiers in Neuroscience journal series. The Frontiers in Neuroscience journal series includes all Frontiers journals in the field of Neuroscience with the exception of Frontiers in Neurology.Reach and real-world impact Frontiers’ articles achieve international visibility with more than 252,000 mentions in major news outlets worldwide including BBC, Newsweek, Time. They have been mentioned 3.4 million times in social media channels.They also achieved 7,000 mentions in policies and 13,000 in patents, demonstrating the real impact your research is having in the world. Data source: Altmetric 2024Evaluating researchTo benchmark the reach, influence and quality of our journals, we measure and communicate a range of indicators of our journals’ impact, including Journal Impact Factors, CiteScores, overall citation rates, aggregate views and downloads, press pick-ups, and social media mentions.We fully support the responsible use of Journal Impact Factors, other quantitative research metrics, and innovative ways for researcher evaluation, as proposed by the San Francisco Declaration on Research Assessment (DORA, to which we are a signatory), the Leiden Manifesto, the Metric Tide for Responsible Metrics and the European Commission's Expert Group on Altmetrics."
