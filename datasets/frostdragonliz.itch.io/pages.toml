description = '''
Socrates. Galileo. Jesus Christ. Many great men have been misunderstood and misrepresented in their time, but perhaps none so much as Professor Brian J. Ford.
Known for his work as a cruise ship lecturer and spontaneous human combustion expert, it is Ford's masterwork "Too Big Too Walk" that has made him a household name. Boldly reviving a theory debunked in the early 20th century, his grand thesis that all dinosaurs were not only too large to walk on land, but that shallow lakes were neccessary for dino sex, has shaken the "Big Palaeo" establishment to it's core. Cruelly rejected by every single professional dinosaur expert, his theory proposes that neither volcanism, asteroid impacts nor climate change ended the dinosaurs. Their extinction was caused by a lack of sex lakes.
Dedicated to his maverick genius, this game attempts to recreate the world 150 million years ago, when giant dinosaurs flew the Earth looking for waterways in which to boink.
Instructions
Get both dinosaurs in the sex lake. Fling the horny dino by pulling back and releasing.  Press <space> or <r> to restart level.  Splat all the turtles for a bonus achievement!
Special Thanks to
Tangmo Mopet (title screen design and testing), Andrew Stück (turtle idea), the Paleontology Coproliteposting Group
Professor Brian J. Ford for his continued genius and inspiration.'''
full_description = '''Socrates. Galileo. Jesus Christ. Many great men have been misunderstood and misrepresented in their time, but perhaps none so much as Professor Brian J. Ford. Known for his work as a cruise ship lecturer and spontaneous human combustion expert, it is Ford's masterwork "Too Big Too Walk" that has made him a household name. Boldly reviving a theory debunked in the early 20th century, his grand thesis that all dinosaurs were not only too large to walk on land, but that shallow lakes were neccessary for dino sex, has shaken the "Big Palaeo" establishment to it's core. Cruelly rejected by every single professional dinosaur expert, his theory proposes that neither volcanism, asteroid impacts nor climate change ended the dinosaurs. Their extinction was caused by a lack of sex lakes. Dedicated to his maverick genius, this game attempts to recreate the world 150 million years ago, when giant dinosaurs flew the Earth looking for waterways in which to boink. Get both dinosaurs in the sex lake. Fling the horny dino by pulling back and releasing. Press <space> or <r> to restart level. Splat all the turtles for a bonus achievement! Tangmo Mopet (title screen design and testing), Andrew Stück (turtle idea), the Paleontology Coproliteposting Group What a game...I loved it 😅😂 it’s a fun, little short game with very funny level names 😅 great work! Wonderful to see Ford's brave, establishment-shaking theory come to life through this game - nay, highly realistic simulation - giving us valuable insights into the reality of dinosaur sex. I recommend this remarkably immersive experience to anyone who's considering reading Too Big To Walk, as a taste of what's to come.'''
