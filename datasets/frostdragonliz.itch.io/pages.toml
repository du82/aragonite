["https://frostdragonliz.itch.io/collecc3d"]
title = "COLLECC 3D by Frost Dragon Liz"
description = """
All hope seems lost when a spaceship crashes on a strange prehistoric world. Does this plucky Opabinia have what it takes to return home?
Collecc all 10 Bep15 Power cores to launch the escape pod. Snab dorits to stay alive. Don't get snabbed.
Keys
Move - WASD keys and MouseSnab/Inspect - Mouse ClickRise - Space Sink - ControlSprint - ShiftOpen/Resize the Map - M keyOpen the Bestiary - B keyPause/Options - P Key

If you get performance issues on the web player, don't forget you can download the game as a standalone app using the links above.
Linux and MacOS builds are untested because I don't have anything to test them on!
Secret Keys (If you get stuck somehow)
Reset player location  - Home KeyClear save data - End Key"""
full_description = '''All hope seems lost when a spaceship crashes on a strange prehistoric world. Does this plucky Opabinia have what it takes to return home? Collecc all 10 Bep15 Power cores to launch the escape pod. Snab dorits to stay alive. Don't get snabbed. Move - WASD keys and MouseSnab/Inspect - Mouse ClickRise - Space Sink - ControlSprint - ShiftOpen/Resize the Map - M keyOpen the Bestiary - B keyPause/Options - P Key If you get performance issues on the web player, don't forget you can download the game as a standalone app using the links above. I LOVED this. The music is perfect, the graphics are clean, the map is perfectly made, and oh my gosh that snabby thing scared the crap out of me. Excellent game. this is so much fun. seeing the anomalocaris patrolling in the distance is very ominous and very cool I love the atmosphere of this! Although I did spend a lot of time looking at the map when I was down to the last few BEP15 cannisters. But overall it felt as authentically Cambrian as I'll ever likely experience. Hallucigenia's riddle: "In the morning I walk on three legs", when the answer says that in the morning it walks on four legs. I'd have expected to see the controls displayed from somewhere in the Esc-menu (to check them in-game since I didn't remember them all from earlier) but the controls are pretty standard, so not hard to guess them if you're familiar with FPSs. I can't think of anything more to add. So many cool critters and sponges! And the hidden game was a nice touch. I wonder if there's more stuff I should look for...'''
