full_description = "About FS Mastering the best of what other people have already figured out. Hi, I’m Shane Parrish. I spent years working for a three-letter intelligence agency doing cool stuff I can never tell anyone about. It was the most fascinating job ever. The New York Times blew my cover. Since then, I’ve… Written a book that became an instant New York Times bestseller; Started a weekly newsletter (read by over 750,000 people); Co-created an encyclopedia of big ideas called The Great Mental Models; Created and host one of the top business podcasts in the world; Keynoted at events worldwide; and Started an investment company called Syrus Partners. You can find me elsewhere on X, Instagram, and LinkedIn. **Reach the team** Speaking & Press Newsletter and podcast advertising Support: [email protected] Investments: [email protected] (criteria: on syruspartners.com) The Boring (but Important) Stuff Ethics I take your trust in FS very seriously. We are not paid by any company for any opinion or article posted on FS or in any public forum, including podcasts and Twitter. We are not paid by any podcast guest to appear on the show, nor do we receive kickbacks. Farnam Street participates in the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means for sites to earn advertising commissions by linking to Amazon. Simply put, if you click on our Amazon.com links and buy something, we earn a (very) small commission, yet you don’t pay any extra. We do not share your information with anyone. Ever. Sponsors are not allowed editorial insight or control. I am invested in several companies and occasionally mention them if I use and love the products myself. Copyright We often post excerpts of things created by others. In fact, if you see anything useful on here at all, I’m likely just paraphrasing someone smarter or forgetting where I sourced it from. If you, as a copyright holder, feel we have violated or infringed on your copyright, please email us, and we will take down the link or modify the article in question. (email: [email protected]) Legal Disclaimer The content contained in this blog represents only the opinions of Farnam Street Media Inc. The content herein is intended solely for the entertainment of the reader and the author and should not be relied upon in making any decisions. Privacy Policy You may read the privacy policy here. The quick summary is that we have not, don’t, and will not sell any information you give us. By continuing to access, link to, or use this website and/or newsletter, you accept the Farnam Street Media Inc. privacy policy in full. If you disagree with the privacy policy, you must not use the website or newsletter. Terms of service You may view the terms of service here. By continuing to access, link to, or use this website and/or newsletter, you accept the Farnam Street Media Inc. terms and conditions in full. If you disagree with the terms and conditions or any part of these terms and conditions, you must not use the website or newsletter."
