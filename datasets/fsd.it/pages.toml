["https://fsd.it/2018/09/05/pragmatapro-0-827-a-giant-running-like-a-cheetah"]
title = "PragmataPro 0.827: a giant running like a cheetah! - Fabrizio Schiavi Design"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = '<img fetchpriority="high" decoding="async" class="alignnone size-full wp-image-3505" src="https://fsd.it/wp-content/uploads/loading_time_pro.png.webp" alt="PragmataPro 0.827 loading time, a giant running like a cheetah" width="1630" height="608" srcset="https://fsd.it/wp-content/uploads/loading_time_pro.png.webp 1630w,https://fsd.it/wp-content/uploads/loading_time_pro-350x131.png.webp 350w,https://fsd.it/wp-content/uploads/loading_time_pro-595x222.png.webp 595w,https://fsd.it/wp-content/uploads/loading_time_pro-800x298.png.webp 800w,https://fsd.it/wp-content/uploads/loading_time_pro-1200x448.png.webp 1200w,https://fsd.it/wp-content/uploads/loading_time_pro-150x56.png.webp 150w,https://fsd.it/wp-content/uploads/loading_time_pro-300x112.png.webp 300w" sizes="(max-width: 1630px) 100vw, 1630px" />With the help of @kelas and other good friends of Pragmata Pro from the open source community, version 0.827 comes with a brand new ligature substitution engine which is 10-20x faster than before, depending on the input. Now Pragmata Pro, with its 9437 glyphs, can be loaded in a few µs. Practically a giant who run like a cheetah! — Java and C/C++ reserved keywords are now kerned <img width="600" height="168" decoding="async" class="alignnone size-full wp-image-3479" src="https://fsd.it/wp-content/uploads/gpos_kern_sample.gif.webp" alt="PragmataPro C++ and Java reserved keywords kerned with GPOS table" /> Pragmata Pro™ is the first monospaced typeface to offer precise glyph positioning in common programming keywords, enabled by default in editors that support OpenType GPOS table. The consistency and orthogonality of fixed pitch is now combined with the finesse of a proportional font. The result is less tiring, aesthetically pleasing coding experience. Your eye will know the difference before you do. — Added Enclosed Alphanumerics set <img decoding="async" class="alignnone size-full wp-image-3466" src="https://fsd.it/wp-content/uploads/enclosed_alphanumerics.gif.webp" alt="Pragmata Pro Enclosed Alphanumerics" width="1800" height="1200" /> In all the weights of all the versions. — Enabled Hebrew Nikkud <img decoding="async" class="alignnone size-full wp-image-3470" src="https://fsd.it/wp-content/uploads/nikkud.png.webp" alt="Pragmata Pro Hebrew Nikkud" width="1800" height="1200" srcset="https://fsd.it/wp-content/uploads/nikkud.png.webp 1800w,https://fsd.it/wp-content/uploads/nikkud-350x233.png.webp 350w,https://fsd.it/wp-content/uploads/nikkud-595x397.png.webp 595w,https://fsd.it/wp-content/uploads/nikkud-800x533.png.webp 800w,https://fsd.it/wp-content/uploads/nikkud-1200x800.png.webp 1200w,https://fsd.it/wp-content/uploads/nikkud-150x100.png.webp 150w,https://fsd.it/wp-content/uploads/nikkud-300x200.png.webp 300w" sizes="(max-width: 1800px) 100vw, 1800px" /> At the moment only in Regular versions. In the next releases the same marking system will be added to all the weights and also in Arabic alphabet. — Added Markdown checklist ligatures <img decoding="async" class="alignnone size-full wp-image-3469" src="https://fsd.it/wp-content/uploads/markdown_checklist.gif.webp" alt="" width="1200" height="366" /> Markdown checklist ligatures are available enabling OpenType Stylistic Set 12 in your editor and are based on these combinations: - [ ] - [-] - [v] - [x] — Marks and accents are combinable with letters <img decoding="async" class="alignnone size-full wp-image-3465" src="https://fsd.it/wp-content/uploads/combined_letters.png.webp" alt="PragmataPro sample of letters combined with marks" width="1920" height="1000" srcset="https://fsd.it/wp-content/uploads/combined_letters.png.webp 1920w,https://fsd.it/wp-content/uploads/combined_letters-350x182.png.webp 350w,https://fsd.it/wp-content/uploads/combined_letters-595x310.png.webp 595w,https://fsd.it/wp-content/uploads/combined_letters-800x417.png.webp 800w,https://fsd.it/wp-content/uploads/combined_letters-1200x625.png.webp 1200w,https://fsd.it/wp-content/uploads/combined_letters-150x78.png.webp 150w,https://fsd.it/wp-content/uploads/combined_letters-300x156.png.webp 300w" sizes="(max-width: 1920px) 100vw, 1920px" />Marks are often used in Phonetics texts and Mathematical formulas. Since this version they are in their right place. — Other improvements: — all weights: problems with some terminal emulators have been resolved — all weights: added these ligatures: |- turnstile like ||- double turnstile like _|_ bottom like =~= <-< >-> <--> <== <<== ==>> — all weights: vertical position of * (asterisk) are aligned to x-height — Regular: improved TrueType hinting of → ← ↑ ↓ # { } / \ — Regular: improved the consistency between Mathematical Operators and Miscellaneous Technical set — Bold, Italic and Bold Italic: added IPA characters and its extensions — all weights: typing us after numbers and space will appears microsecond µs in serif variant Feel free to contact me directly or notify an issue via Github to improve PragmataPro again and again. Thank you!'
