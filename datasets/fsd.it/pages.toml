full_description = 'Dutch public-service broadcaster NTR uses CP Company by Fabrizio Schiavi Design as the default typeface for their visual identity. From Wikipedia:NTR was created in 2010, following the merger of the Nederlandse Programma Stichting (NPS) and two educational broadcasters, Televisie Academie (Teleac) and the Radio Volksuniversiteit (RVU).CP Company is used in all of its four weights, from on-screen graphics to the website and annual reports. Gast Producties have worked on the design of the TV station at least since 2013. <img fetchpriority="high" decoding="async" width="700" height="394" src="https://fsd.it/wp-content/uploads/NaamFunctie_XL_16-9.jpeg.webp" alt="" class="wp-image-6425" srcset="https://fsd.it/wp-content/uploads/NaamFunctie_XL_16-9.jpeg.webp 700w,https://fsd.it/wp-content/uploads/NaamFunctie_XL_16-9-350x197.jpeg.webp 350w,https://fsd.it/wp-content/uploads/NaamFunctie_XL_16-9-595x335.jpeg.webp 595w" sizes="(max-width: 700px) 100vw, 700px" />Exemplary name title<img decoding="async" width="700" height="394" src="https://fsd.it/wp-content/uploads/Exemplary-end-titles.jpeg.webp" alt="" class="wp-image-6426" srcset="https://fsd.it/wp-content/uploads/Exemplary-end-titles.jpeg.webp 700w,https://fsd.it/wp-content/uploads/Exemplary-end-titles-350x197.jpeg.webp 350w,https://fsd.it/wp-content/uploads/Exemplary-end-titles-595x335.jpeg.webp 595w" sizes="(max-width: 700px) 100vw, 700px" />Exemplary end titles<img decoding="async" width="700" height="394" src="https://fsd.it/wp-content/uploads/Exemplary-end-titles-NTR.jpeg.webp" alt="" class="wp-image-6427" srcset="https://fsd.it/wp-content/uploads/Exemplary-end-titles-NTR.jpeg.webp 700w,https://fsd.it/wp-content/uploads/Exemplary-end-titles-NTR-350x197.jpeg.webp 350w,https://fsd.it/wp-content/uploads/Exemplary-end-titles-NTR-595x335.jpeg.webp 595w" sizes="(max-width: 700px) 100vw, 700px" />Exemplary end titles<img decoding="async" width="700" height="611" src="https://fsd.it/wp-content/uploads/NTR-w