["https://fsd.it/graphics"]
title = "Fabrizio Schiavi graphic design portfolio"
description = "FSD graphic design for Ferrari, C.P. Company, Mandarina Duck, Philip Morris, Expanded Music, MTV, Nike and many others."
full_description = 'Siruca playing cards Wayfinding engineering and heraldic for more ergonomic cards #pictogram-design #packaging Quality Bau rebranding No ink and perforated typography to communicate the respect for the nature. #corporate-identity Firenze logo My proposal for the Florence logo contest coming from building decoration of Renaissance architecture. #corporate-identity <img decoding="async" width="350" height="200" src="https://fsd.it/wp-content/uploads/2015/11/dga2.gif.webp" class="vc_single_image-img attachment-full" alt="Duccio Grassi Architects web site 2006" title="Duccio Grassi Architects web site 2006" /> Duccio Grassi Architects I designed the web site using an interface resembling the design of the well known work of my client, the store for Max Mara in Soho NY. Some parts of the structure are hidden to clean the space visually. ducciograssiarchitects.com (live from 2007-2010) #web-design <img decoding="async" width="350" height="240" src="https://fsd.it/wp-content/uploads/2015/11/mdk.gif.webp" class="vc_single_image-img attachment-full" alt="Mandarina Duck web site 1999" title="Mandarina Duck web site 1999" /> Mandarina Duck 1999, Sartoria Comunicazione commissioned me the design and programming for the Mandarina Duck website – www.mandarinaduck.com (live from 1999 to 2003). An open request was to convey the right mood of MD, thru peculiar traits of the brand like play, innovation, color, dynamism and fun. To animate in a playful way the web pages I used moving cubes that rotate suggesting a third dimension in the visual space. #web-design <img decoding="async" width="507" height="508" src="https://fsd.it/wp-content/uploads/2015/11/expanded_music.gif.webp" class="vc_single_image-img attachment-full" alt="Expanded Music sleeves" title="Expanded Music sleeves" /> Expanded Music Expanded Music is a record company in Bologna and publish electronic music since 1980’s. My work for Expanded Music is, above all, to design the artworks of the mix cases for djs. #sleeve-design <img decoding="async" width="350" height="219" src="https://fsd.it/wp-content/uploads/2015/11/psc.gif.webp" class="vc_single_image-img attachment-full" alt="Prodotti del Sud Consumi del Nord game in Flash" title="Prodotti del Sud Consumi del Nord game in Flash" /> Prodotti del Sud Consumi del Nord ‘Prodotti del Sud Consumi del Nord’ is a campaign sponsored by organizations not affiliated with the government such as COSPE and the Italian Ministry of Foreign Affairs. The objective is to educate students towards a critical approach to consumption. Choosing a chocolate bar from a co-operative society whose members have been fairly paid, avoiding in this way to by from the multi-nationals is what critical consumption is about, while helping poor and under-developed countries. I proposed COSPE to create a game involving students and making them play the role of a poor African farmer. As in real life, any choice of the poor farmer would have made him to inevitably succumb in an economical perspective. In short an ‘anti-multinationals’ game. #game-design YU YU® intends to revolutionize the Italian insurance system. The ambitious mission is supported by a revolutionary branding based by: — the identification of an incisive and memorable name, — the first open source logo of the history. #corporate-identity #naming Marco Cantù For Marco Cantù’s “Delphi 2007 Handbook” book cover I duplicated the birds using the Fibonacci sequence. Nothing represents relation between nature, computer science and mathematics better than the Fibonacci sequence. Delphi in 2009 adds Unicode features so birds becomes Y and some similar glyphs. In Delphi 2010 the new great feature is gestures so birds becomes gesture signs. #book-design <img decoding="async" width="900" height="694" src="https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1.jpg.webp" class="vc_single_image-img attachment-full" alt="Al Hamra Floor Colors and custom stencil font" title="Al Hamra Floor Colors and custom stencil font" srcset="https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1.jpg.webp 900w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-800x617.jpg.webp 800w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-350x270.jpg.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-595x459.jpg.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-150x116.jpg.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-300x231.jpg.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Siruca_Al_Hamra_Floor-colors1-680x524.jpg.webp 680w" sizes="(max-width: 900px) 100vw, 900px" /> Al Hamra I redesigned the graphic identity with a custom font and signage system for the Al Hamra Complex in Kuwait. Client: Duccio Grassi Architects #corporate-identity #way-finding #type-design <img decoding="async" width="350" height="245" src="https://fsd.it/wp-content/uploads/2015/11/cpc.gif.webp" class="vc_single_image-img attachment-full" alt="CP Company web site 2001" title="CP Company web site 2001" /> CP Company The prestigious fashion mark wanted a functional site where the user arrives quickly to interesting info. The loading time is very short for a photographic site. Awarded as shocked site of the week at Macromedia.com cpcompany.com (live from 2001-2007) cpcompany-corporate.com (live from 2008-2010) For this project I have designed two custom fonts: CP Company™ and CP Company Flash™ #web-design #type-design <img decoding="async" width="350" height="192" src="https://fsd.it/wp-content/uploads/2015/11/mixedmedia.jpg.webp" class="vc_single_image-img attachment-full" alt="Mixedmedia mark" title="Mixedmedia mark" srcset="https://fsd.it/wp-content/uploads/2015/11/mixedmedia.jpg.webp 350w,https://fsd.it/wp-content/uploads/2015/11/mixedmedia-300x165.jpg.webp 300w,https://fsd.it/wp-content/uploads/2015/11/mixedmedia-150x82.jpg.webp 150w" sizes="(max-width: 350px) 100vw, 350px" /> Mixedmedia The logo become a design object as representation of the concept of mixed medias. The object functions as invitation, pass and viral marketing subject. This identity design is for Mixedmedia, a manifestation of digital art, architecture and electronic music planned for 2005. #corporate-identity ••••|• molto.fm Molto FM Molto FM was a project of online radio of Molto Recordings. My concept for the logo is to reinterpret the symbol of volume, designing it using typographic symbols. The red part of the logo is composed of symbols found in all fonts. Circles are represented by the “bullet” symbol (shift+.) and the bar is made by the symbol, “bar” (shift+/). The revolutionary idea is that the logo can be realized with any font and no pictures are necessary, so changing the way it looks while the structure remains the same. #corporate-identity'
author = "Md Abul Kalam Azad"
year_published = 2020
year_updated = 2023
