full_description = 'Sys is a condensed font designed to be used at low sizes like phone books but have also so much personality to be used at big sizes. The Truetype version of Sys can quietly substitute a system font for web pages or others screen application files. <img decoding="async" width="1024" height="543" src="https://fsd.it/wp-content/uploads/2015/11/Sys_a_new.png.webp" class="vc_single_image-img attachment-full" alt="Inktraps used in Sys font" title="Inktraps used in Sys font" srcset="https://fsd.it/wp-content/uploads/2015/11/Sys_a_new.png.webp 1024w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-800x424.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-350x186.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-595x316.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-150x80.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-300x159.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Sys_a_new-680x361.png.webp 680w" sizes="(max-width: 1024px) 100vw, 1024px" /> Designed as replacement of Verdana I was very tired to read all the text of the web in the aliased Verdana font so I decided to design my own first web font in 2002 and, using Netscape Communicator settings, replace all the fonts with my Sys <img decoding="async" width="700" height="456" src="https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1.png.webp" class="vc_single_image-img attachment-full" alt="Verdana vs Sys comparison" title="Verdana vs Sys comparison" srcset="https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1.png.webp 700w,https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1-350x228.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1-595x388.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1-150x98.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1-300x195.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Verdana_Sys_comparison1-680x443.png.webp 680w" sizes="(max-width: 700px) 100vw, 700px" /> Used for Nintendo Yes! Nintendo GameBoy Advance. What a surprise! <img decoding="async" width="800" height="600" src="https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8.jpg.webp" class="vc_single_image-img attachment-full" alt="Nintendo wallpaper set in Sys font" title="Nintendo wallpaper set in Sys font" srcset="https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8.jpg.webp 800w,https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8-350x263.jpg.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8-595x446.jpg.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8-150x113.jpg.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8-300x225.jpg.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Nintendo_wallpaper8-680x510.jpg.webp 680w" sizes="(max-width: 800px) 100vw, 800px" /> Used in the NFL scoreboard by Fox For its design, Sys seems to be also the ideal font for the low size texts on broadcasting <img decoding="async" width="864" height="486" src="https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4.jpg.webp" class="vc_single_image-img attachment-full" alt="NFL on FOX Score Board set in Sys font" title="NFL on FOX Score Board set in Sys font" srcset="https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4.jpg.webp 864w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-800x450.jpg.webp 800w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-350x197.jpg.webp 350w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-595x335.jpg.webp 595w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-150x84.jpg.webp 150w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-300x169.jpg.webp 300w,https://fsd.it/wp-content/uploads/2015/11/NFLonFOX-Score-4-680x383.jpg.webp 680w" sizes="(max-width: 864px) 100vw, 864px" /> Flexible Also thanks to cyrillic versions added by Evgeny Laskovy in Regular and Bold weights <img decoding="async" width="1000" height="505" src="https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs.png.webp" class="vc_single_image-img attachment-full" alt="Sys font family glyphs" title="Sys font family glyphs" srcset="https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs.png.webp 1000w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-800x404.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-350x177.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-595x300.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-150x76.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-300x152.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Sys_glyphs-680x343.png.webp 680w" sizes="(max-width: 1000px) 100vw, 1000px" />'
