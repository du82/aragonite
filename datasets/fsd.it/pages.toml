full_description = 'In September, 2003 I’ve been contacted by MTV for the restyling of mtv.it I started from the beginning to work on a radical simplification of its visual elements, to achieve a better usability. It didn’t take much to realize the basic design I attempted would have called for a notable reduction of the rich imagery distinguishing MTV’s visual identity. As a visual aid to help me in this process I designed Virna, a headline “op-art” inspired face with the ability to create both vertical and horizontal ligatures between single words among two text lines, with the same ease of linking letters in handwriting or a linked script typeface. Horizontal and vertical ligatures Virna is probably the first western font with vertical combination of glyphs <img decoding="async" width="1450" height="1000" src="https://fsd.it/wp-content/uploads/2015/11/virna_ligatures.png.webp" class="vc_single_image-img attachment-full" alt="Some vertical ligatures of Virna font" title="Some vertical ligatures of Virna font" srcset="https://fsd.it/wp-content/uploads/2015/11/virna_ligatures.png.webp 1450w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-800x552.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-1200x828.png.webp 1200w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-350x241.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-595x410.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-150x103.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-300x207.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/virna_ligatures-680x469.png.webp 680w" sizes="(max-width: 1450px) 100vw, 1450px" /> Pure power! <img decoding="async" width="899" height="442" src="https://fsd.it/wp-content/uploads/2015/11/virna_movie.gif.webp" class="vc_single_image-img attachment-full" alt="Virna in use, slideshow" title="virna_movie" /> Virna is included in ADI Design Index 2005 A great satisfaction <img decoding="async" width="1024" height="453" src="https://fsd.it/wp-content/uploads/2015/11/virna_specimen.png.webp" class="vc_single_image-img attachment-full" alt="Virna custom font for MTV" title="Virna custom font for MTV" srcset="https://fsd.it/wp-content/uploads/2015/11/virna_specimen.png.webp 1024w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-800x354.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-350x155.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-595x263.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-150x66.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-300x133.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/virna_specimen-680x301.png.webp 680w" sizes="(max-width: 1024px) 100vw, 1024px" />'
