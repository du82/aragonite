["https://fsd.it/2021/05/14/pragmatapro-0-829-curly-git-tree-and-new-essential-glyphs"]
title = "PragmataPro 0.829: Curly Git tree and new essential glyphs - Fabrizio Schiavi Design"
description = """
Hi Fabrizio! I really enjoy this font and was very excited to see the addition of git-graph support! You mentioned in your post that the ligature for git tree will trigger based on some conditions, may I know what those conditions are? Do I need to setup a specific formatting in order for them to trigger properly?
For me, most of the time the ligature does not show up, I am using the very basic “git log –graph” command.
Here is a video demonstrating what I mean by they almost never show up:
https://watch.screencastify.com/v/1sypfHJLXlCoowfQFij4
Ignoring that one issue, I’ve had absolutely no problem with this font and it’s a joy. The little additions you added in this update made a big difference for me, especially for the lower case L and the ‘; :’.
Many thanks for your work!"""
full_description = 'This version coming from my experience as web developer. Often I exchanged colon (:) with semicolon (;) and sometime I had the suspect that L lowercase can be more distinguished using a new design. After this redesign I can work now more sure to avoid misinterpretations. <img fetchpriority="high" decoding="async" class="alignnone size-thumbnail wp-image-7309" src="https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett.png.webp" alt="Redesign dollar l colon eszett in PragmataPro 0.829" width="1800" height="1800" srcset="https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett.png.webp 2000w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-900x900.png.webp 900w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-1800x1800.png.webp 1800w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-1536x1536.png.webp 1536w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-redesign-dollar-l-colon-eszett-100x100.png.webp 100w" sizes="(max-width: 1800px) 100vw, 1800px" /> — Curly slash and backslash in Git tree command line It’s possible to enable it using Pragmata Pro™ with OpenType Stylistic Set 13 named ‘git tree’. Every slash and backslash, at specific conditions, will appears with curly terminations even with Italic versions. From now coders can see a more nice Git tree in their command line editor <img decoding="async" class="alignnone size-thumbnail wp-image-7308" src="https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree.png.webp" alt="PragmataPro command line git tree" width="1800" height="1800" srcset="https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree.png.webp 864w,https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-command-line-git-tree-100x100.png.webp 100w" sizes="(max-width: 1800px) 100vw, 1800px" /> — Extended the range of ligatures Ligatures helps a lot the programmers. Now the help is increased! <img decoding="async" class="alignnone size-thumbnail wp-image-7305" src="https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark.png.webp" alt="PragmataPro 0829 ligatures" width="1800" height="1800" srcset="https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark-900x900.png.webp 900w,https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-0829-ligatures-dark-100x100.png.webp 100w" sizes="(max-width: 1800px) 100vw, 1800px" /> — Added Bulgarian and Serbian language support Cyrillic set now includes also Bulgarian and Serbian characters <img decoding="async" class="alignnone size-thumbnail wp-image-7306" src="https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support.png.webp" alt="" width="1800" height="1800" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support.png.webp 2000w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-900x900.png.webp 900w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-1800x1800.png.webp 1800w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-1536x1536.png.webp 1536w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Bulgarian-Serbian-support-100x100.png.webp 100w" sizes="(max-width: 1800px) 100vw, 1800px" /> — Other improvements: — Regular: Soft dotted improved and Mathematical Alphanumeric Symbols glyphs can be accented like other standard letters using Combining Diacritical Marks set — Regular: improved the design of APL glyphs — Regular: improved the design of Mathematical Operators — Regular: BQN programming glyphs like ˜˘•÷×¬⎉⚇⍟◶⊘⎊⍎⍕⟨⟩√⋆⌽∊↑∧⊔⊏⊐π←↙⍷⍋⊑⊒⍳⊣⊢⍉↕⊸∘○⟜⋄↩↖⌾⥊↓∨⌊⍒⌈≢≤≥⇐… are improved by design — Regular: added curly arrows ︎↖︎↗ ↙↘︎ ↘︎↙ ↗↖︎ ligature coming from ↘︎ ↖︎ ↗ ↙ diagonal arrows combinations — Regular: Geometric Shapes set are more distinguished at small sizes — Regular: added Combining Diacritical Marks Extended and Combining Diacritical Marks Supplemental set — all weights: checkmarks appears by default from now, no more from Stylistic Set ss12 — all weights: added Creative Commons glyphs and harmonized © copyright sign also — all weights: added Hellschreiber pause symbol — all weights: improved design and positioning of Graphics for Legacy Computing symbols Feel free to contact me directly or notify an issue via Github to improve PragmataPro again and again. Thank you!'
