full_description = 'Do you like Futura and Gill Sans? This is a contemporary version of these great typefaces. Perfect for corporate identities, user interfaces, web sites and everywhere is necessary to read a text clearly My favourite supermarket can have a better branding now I was always been a loyal customer of the greatest retail trader in Italy: coop. Everytime I see their product I think “they deserve more”. So, in 2019 I designed the key factor behind their rebranding: the variable font Seitu™ A font derived by the coop logo This variable font is my typographic interpretation and development of the legendary coop logotype designed by Albe Steiner and later improved by Bob Noorda in 1985 <img decoding="async" width="2481" height="2289" src="https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo.webp" class="vc_single_image-img attachment-full" alt="Seitu font designed by Fabrizio Schiavi and the Coop Italia logo designed by Bob Noorda" title="Seitu font designed by Fabrizio Schiavi and the Coop Italia logo designed by Bob Noorda" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo.webp 2481w,https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo-900x830.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo-1800x1661.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo-1536x1417.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo-350x323.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-noorda-logo-595x549.webp 595w" sizes="(max-width: 2481px) 100vw, 2481px" /> Consistency, dynamism and readability The diagonals inthe letter c and p of the logo are key details in the development of the font family. A good way to mark the entire typeface and create dynamism in texts. The first goal anyway is the readability. Very very important! <img decoding="async" width="2481" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-ideal.webp" class="vc_single_image-img attachment-full" alt="Seitu™ coop font key details" title="Seitu&#x2122; coop font key details" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-ideal.webp 2481w,https://fsd.it/wp-content/uploads/seitu-specimen-ideal-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-ideal-1800x1654.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-ideal-1536x1412.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-ideal-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-ideal-595x547.webp 595w" sizes="(max-width: 2481px) 100vw, 2481px" /> A geometric font with a soul I’m very happy about the results! <img decoding="async" width="2482" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-headlines.webp" class="vc_single_image-img attachment-full" alt="Sample headlines set in Seitu™ variable font" title="Sample headlines set in Seitu&#x2122; variable font" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-headlines.webp 2482w,https://fsd.it/wp-content/uploads/seitu-specimen-headlines-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-headlines-1800x1654.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-headlines-1536x1411.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-headlines-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-headlines-595x547.webp 595w" sizes="(max-width: 2482px) 100vw, 2482px" /> At the top of readability! Great typefaces like Futura and Gill Sans inspired me for this project but the results have surprised me because Seitu™ is even more readable <img decoding="async" width="4961" height="4961" src="https://fsd.it/wp-content/uploads/seitu-specimen-text-labels.webp" class="vc_single_image-img attachment-full" alt="Sample text set in Seitu variable font" title="Sample text set in Seitu variable font" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-text-labels.webp 4961w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-1800x1800.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-300x300-1.png.webp 300w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-350x350-1652624997.png.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-595x595-1652624953.png.webp 595w,https://fsd.it/wp-content/uploads/seitu-specimen-text-labels-100x100-1652625087.png.webp 100w" sizes="(max-width: 4961px) 100vw, 4961px" /> Perfect for web! Readability improved on screen as in print <img decoding="async" width="2480" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-coop-website.webp" class="vc_single_image-img attachment-full" alt="e-coop.it website redesigned and set in Seitu™ variable font" title="e-coop.it website redesigned and set in Seitu&#x2122; variable font" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-coop-website.webp 2480w,https://fsd.it/wp-content/uploads/seitu-specimen-coop-website-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-coop-website-1800x1655.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-coop-website-1536x1412.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-coop-website-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-coop-website-595x547.webp 595w" sizes="(max-width: 2480px) 100vw, 2480px" /> Variable font and single fonts are available The variable font includes infinite combinations derived by Weight axis interpolation, anyway you can use the single standard weight available: Seitu™ Thin Seitu™ ExtraLight Seitu™ Light Seitu™ Regular Seitu™ Medium Seitu™ SemiBold Seitu™ Bold Seitu™ ExtraBold Seitu™ Black <img decoding="async" width="2482" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-lowercase.webp" class="vc_single_image-img attachment-full" alt="Seitu™ font lowercases" title="Seitu&#x2122; font lowercases" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-lowercase.webp 2482w,https://fsd.it/wp-content/uploads/seitu-specimen-lowercase-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-lowercase-1800x1654.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-lowercase-1536x1411.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-lowercase-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-lowercase-595x547.webp 595w" sizes="(max-width: 2482px) 100vw, 2482px" /> This variable font is available in Weights › All package <img decoding="async" width="2482" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-uppercase.webp" class="vc_single_image-img attachment-full" alt="Seitu™ font uppercases" title="Seitu&#x2122; font uppercases" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-uppercase.webp 2482w,https://fsd.it/wp-content/uploads/seitu-specimen-uppercase-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-uppercase-1800x1654.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-uppercase-1536x1411.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-uppercase-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-uppercase-595x547.webp 595w" sizes="(max-width: 2482px) 100vw, 2482px" /> <img decoding="async" width="2482" height="2280" src="https://fsd.it/wp-content/uploads/seitu-specimen-all-chars.webp" class="vc_single_image-img attachment-full" alt="All the characters in Seitu™ variable font" title="All the characters in Seitu&#x2122; variable font" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-all-chars.webp 2482w,https://fsd.it/wp-content/uploads/seitu-specimen-all-chars-900x827.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-all-chars-1800x1654.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-all-chars-1536x1411.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-all-chars-350x322.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-all-chars-595x547.webp 595w" sizes="(max-width: 2482px) 100vw, 2482px" /> Maybe one day… At the moment the coop staff ignored this project but I never lost the hope to one day see my Seitu™ on the shelves of its supermarkets. Meanwhile feel free to use it in your artworks today! <img decoding="async" width="4961" height="4962" src="https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging.webp" class="vc_single_image-img attachment-full" alt="Spaghetti coop packaging set in Seitu variable font" title="Spaghetti coop packaging set in Seitu variable font" srcset="https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging.webp 4961w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-900x900.png.webp 900w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-1800x1800.png.webp 1800w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-300x300.webp 300w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-350x350.webp 350w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-595x595.webp 595w,https://fsd.it/wp-content/uploads/seitu-specimen-spaghetti-packaging-100x100.webp 100w" sizes="(max-width: 4961px) 100vw, 4961px" />'
