full_description = 'Looking for a font that’s both stylish and versatile? With its clean lines and modern aesthetic, Nure is perfect for a wide range of design projects, from branding and advertising to web design and print materials. Whether you’re a graphic designer, marketer, or business owner, Nure is the font you need to make your message stand out. Its unique design is sure to catch the eye of your audience and leave a lasting impression. So why settle for a generic font when you can elevate your work with Nure? Try it today and see the difference it can make! The extended Abitare Sans family Nure™ is a variable font family designed in 3 axes (Weight, Optical, Width) to cover all the graphic design needs. Included in ADI Design Index 2022! Flexible texts and flexible headlines One of the key features of Nure is its flexibility, as it allows designers to seamlessly adjust the font’s weight and width to fit their specific needs. This makes it an ideal choice for designers who require a versatile font that can be adapted to various applications. Nure’s design is sleek and contemporary, with sharp edges and clean lines that give it a modern feel. Its letterforms are inspired by classic geometric shapes, giving it a clean and minimalistic look that is perfect for contemporary design projects. <img decoding="async" width="2480" height="6142" src="https://fsd.it/wp-content/uploads/Nure-Text-sample-2024.webp" class="vc_single_image-img attachment-full" alt="Nure Variable Font text sample" title="Nure Variable Font text sample" srcset="https://fsd.it/wp-content/uploads/Nure-Text-sample-2024.webp 2480w,https://fsd.it/wp-content/uploads/Nure-Text-sample-2024-595x1474.png 595w,https://fsd.it/wp-content/uploads/Nure-Text-sample-2024-1018x2520.png 1018w,https://fsd.it/wp-content/uploads/Nure-Text-sample-2024-620x1536.webp 620w,https://fsd.it/wp-content/uploads/Nure-Text-sample-2024-827x2048.webp 827w,https://fsd.it/wp-content/uploads/Nure-Text-sample-2024-350x867.png 350w" sizes="(max-width: 2480px) 100vw, 2480px" /> The sans-serif font for every taste Thanks to 11 OpenType Stylistic Sets, Nure™ is one of the most flexible typefaces of all times. In addition to its aesthetic qualities, Nure also has a range of technical features that make it a great choice for digital applications. It includes OpenType features such as ligatures, stylistic alternates, and small caps, which allow designers to customize their designs and create unique typographic compositions. <img width="1600" height="400" decoding="async" src="https://fsd.it/wp-content/uploads/Nure-features.svg" class="vc_single_image-img attachment-full" alt="Nure OpenType features" title="Nure OpenType features" /> <img decoding="async" width="2480" height="7535" src="https://fsd.it/wp-content/uploads/Nure-OpenType-features-2.png" class="vc_single_image-img attachment-full" alt="Nure OpenType features" title="Nure OpenType features" srcset="https://fsd.it/wp-content/uploads/Nure-OpenType-features-2.png 2480w, https://fsd.it/wp-content/uploads/Nure-OpenType-features-2-595x1808.png 595w, https://fsd.it/wp-content/uploads/Nure-OpenType-features-2-829x2520.png 829w, https://fsd.it/wp-content/uploads/Nure-OpenType-features-2-506x1536.png 506w, https://fsd.it/wp-content/uploads/Nure-OpenType-features-2-674x2048.png 674w, https://fsd.it/wp-content/uploads/Nure-OpenType-features-2-350x1063.png 350w" sizes="(max-width: 2480px) 100vw, 2480px" /> 1350 glyphs which covers practically all the publishing needs Overall, Nure™ is a highly versatile and functional variable font that is perfect for modern design projects. Its clean lines, sleek design, and range of technical features make it a great choice for designers who require a flexible and adaptable font. <img decoding="async" width="1700" height="2200" src="https://fsd.it/wp-content/uploads/Nure-all-glyphs-2023.webp" class="vc_single_image-img attachment-full" alt="Nure all glyphs of every weight" title="Nure all glyphs of every weight" srcse