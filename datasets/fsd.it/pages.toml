full_description = '''<img fetchpriority="high" decoding="async" width="1200" height="411" src="https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison-1200x411.png.webp" alt="PragmataPro HTML5 Entity compared with other fonts" class="wp-image-4794" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison-1200x411.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison-800x274.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison-350x120.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison-595x204.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Entities-comparison.png.webp 1632w" sizes="(max-width: 1200px) 100vw, 1200px" />— All the 2109 HTML 5 entities are included in this versionFrom now your web page can supports HTML5 entities without worries with Pragmata Pro because it’s one of the rarest fonts that can do this.HTML5 requires also some weird combined characters hard to find.<img decoding="async" width="5333" height="5333" src="https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash.png.webp" alt="All the 2109 HTML5 entities was designed and available since PragmataPro 0.828" class="wp-image-4753" srcset="https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash.png.webp 5333w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-800x800.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-1200x1200.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-HTML5-entities-flash-100x100.png.webp 100w" sizes="(max-width: 5333px) 100vw, 5333px" />Click here to see the entire HTML 5 list set in PragmataPro™— Comodore 64 nostalgia?<img decoding="async" width="1920" height="1920" src="https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64.png.webp" alt="Sample of PragmataPro Graphic for Legacy Computing coming from Teletext, Atari and Comodore64" class="wp-image-4751" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64.png.webp 1920w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-800x800.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-1200x1200.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Graphic-Computer-Teletext-Atari-Comodore64-100x100.png.webp 100w" sizes="(max-width: 1920px) 100vw, 1920px" />Pragmata Pro™ is the first monospaced typeface offering ‘Graphic for Legacy Computing’ Unicode set. All these glyphs coming from Teletext, Atari and Comodore 64 system.These symbols converted as text are designed to build images. Practically is a ‘Block Elements’ set extension.— Added Runic set<img decoding="async" width="1200" height="833" src="https://fsd.it/wp-content/uploads/PragmataPro-Runic-w-1200x833.png.webp" alt="PragmataPro Runic, includes Elder Futhark, Younger Futhark, Anglo-Saxon and Medieval Runes" class="wp-image-4792" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Runic-w-1200x833.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-w-800x556.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-w-350x243.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-w-595x413.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-w.png.webp 1728w" sizes="(max-width: 1200px) 100vw, 1200px" />I love the design of Runic letters and, after the request of a user, I’ve added them with pleasure to PragmataPro<img decoding="async" width="1271" height="1271" src="https://fsd.it/wp-content/uploads/PragmataPro-Runic-code.png.webp" alt="PragmataPro Runic coding sample" class="wp-image-4755" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Runic-code.png.webp 1271w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-300x300.png.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-800x800.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-1200x1200.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-350x350.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-595x595.png.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Runic-code-100x100.png.webp 100w" sizes="(max-width: 1271px) 100vw, 1271px" />PragmataPro Runic is the first monospaced Runic of all time— New # TODO, # ERROR and other useful programming ligatures<img decoding="async" width="1153" height="971" src="https://fsd.it/wp-content/uploads/PragmataPro-new-TODO-w.png.webp" alt="PragmataPro new # TODO, # ERROR and other useful programming ligatures" class="wp-image-4791" srcset="https://fsd.it/wp-content/uploads/PragmataPro-new-TODO-w.png.webp 1153w,https://fsd.it/wp-content/uploads/PragmataPro-new-TODO-w-800x674.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-new-TODO-w-350x295.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-new-TODO-w-595x501.png.webp 595w" sizes="(max-width: 1153px) 100vw, 1153px" />Do you remember [TODO], [ERROR]… ligatures?The same trick was extended also # TODO, # ERROR…— Better Drawings with Boxes and Arrows<img decoding="async" width="1493" height="1218" src="https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w.png.webp" alt="PragmataPro 0.828 - All the glyphs of the 'Box Drawing' set are vertically aligned to 'Arrows', 'Supplemental Arrows', 'Supplemental Arrows-C' and 'Geometric Shapes' when they are next" class="wp-image-4790" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w.png.webp 1493w,https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w-800x653.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w-1200x979.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w-350x286.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Box-drawing-calt-w-595x485.png.webp 595w" sizes="(max-width: 1493px) 100vw, 1493px" />The position of the arrows or geometric shapes like triangles are now correct when them are next to Box Drawing symbols.Since v_0.828 diagrams and schemas are now more consistent— Greek letters are more distinguishable<img decoding="async" width="1400" height="900" src="https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w.png.webp" alt="PragmataPro new Greek Theta, theta and zero. Letters are more distinguishable" class="wp-image-4793" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w.png.webp 1400w,https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w-800x514.png.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w-1200x771.png.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w-350x225.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Theta-theta-O-zero-w-595x383.png.webp 595w" sizes="(max-width: 1400px) 100vw, 1400px" />— PragmataPro Arabic with accents<img decoding="async" width="946" height="1083" src="https://fsd.it/wp-content/uploads/PragmataPro-Arabic-accents-w.png.webp" alt="PragmataPro Arabic with accents planned to works as automatic composition" class="wp-image-4789" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Arabic-accents-w.png.webp 946w,https://fsd.it/wp-content/uploads/PragmataPro-Arabic-accents-w-699x800.png.webp 699w,https://fsd.it/wp-content/uploads/PragmataPro-Arabic-accents-w-350x401.png.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Arabic-accents-w-595x681.png.webp 595w" sizes="(max-width: 946px) 100vw, 946px" />PragmataPro Arabic diacritics are combinable with Arabic script— Other improvements:— Regular: ‘Greek’, ‘Cyrillic’,’Latin Extended-A’ and ‘Latin Extended-B’ setsare combinable with ‘Combining Diacritical Marks’— all weights: added these new ligatures:->- -<- =>= =<=— all weights: added and updated new Nerd symbols from Nerd font— Regular: improved the design of л (el), м (em), н (en), ģ (gcommaccent)— Regular: improved the design of some ‘Mathematical Operators’ and ‘Miscellaneous Technical’ glyphs to improve APL programming— Bold, Italic and Bold Italic: added ‘Latin Extended-B’ and ‘Latin Extended Additional’ sets— all weights: added the glyphs set by two numbers ‘Enclosed Alphanumerics’ like 11, 12, 13… 20Feel free to contact me directly or notify an issue via Github to improve PragmataPro again and again.Thank you!<img decoding="async" width="1190" height="1190" src="https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen.jpg.webp" alt="Kus-stenen retraced by Fabrizio Schiavi, set in PragmataPro Runic" class="wp-image-4757" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen.jpg.webp 1190w,https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen-300x300.jpg.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen-800x800.jpg.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen-350x350.jpg.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen-595x595.jpg.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Kus-stenen-100x100.jpg.webp 100w" sizes="(max-width: 1190px) 100vw, 1190px" />'''
