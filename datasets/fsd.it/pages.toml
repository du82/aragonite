full_description = 'In 2012 the Austrian design firm Lichtwitz Leinfellner committed me the Book weight of Sys to be used as CeMM corporate font. Optimized for publishing I took the opportunity to redesign, after ten years, the entire font family with the goal of to improve the readability of long texts in print <img decoding="async" width="999" height="937" src="https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail.png.webp" class="vc_single_image-img attachment-full" alt="cemm.oeaw.ac.at 2014 site in Sys 2.0" title="cemm.oeaw.ac.at 2014 site in Sys 2.0" srcset="https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail.png.webp 999w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-800x750.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-350x328.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-595x558.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-150x141.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-300x281.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/cemm.oeaw_.ac_.at-detail-680x638.png.webp 680w" sizes="(max-width: 999px) 100vw, 999px" /> Sys 2.0 is available in 8 weights to offer the right flexibility of use <img decoding="async" width="1024" height="531" src="https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen.png.webp" class="vc_single_image-img attachment-full" alt="Sys 2.0 font family specimen ideal for long texts" title="Sys 2.0 font family specimen ideal for long texts" srcset="https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen.png.webp 1024w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-800x415.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-350x181.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-595x309.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-150x78.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-300x156.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/Sys2.0_specimen-680x353.png.webp 680w" sizes="(max-width: 1024px) 100vw, 1024px" /> Cool printed texts Detail of the text of a graph of CeMM Annual Report 2014 <img decoding="async" width="1083" height="423" src="https://fsd.it/wp-content/uploads/2015/11/cemm_graph.png.webp" class="vc_single_image-img attachment-full" alt="CeMM graph in annual report 2014" title="CeMM graph in annual report 2014" srcset="https://fsd.it/wp-content/uploads/2015/11/cemm_graph.png.webp 1083w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-800x312.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-350x137.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-595x232.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-150x59.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-300x117.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/cemm_graph-680x266.png.webp 680w" sizes="(max-width: 1083px) 100vw, 1083px" /> Sys vs Sys 2.0 Sys 2.0 has: more than 500 glyphs and useful OpenType features designed for publishing <img decoding="async" width="1020" height="1025" src="https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0.png.webp" class="vc_single_image-img attachment-full" alt="Sys 2.0 vs Sys 1.0 infographics" title="Sys 2.0 vs Sys 1.0 infographics" srcset="https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0.png.webp 1020w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-300x301.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-796x800.png.webp 796w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-350x352.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-595x598.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-592x595.png.webp 592w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-100x100.png.webp 100w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-150x151.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-127x127.png.webp 127w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-348x350.png.webp 348w,https://fsd.it/wp-content/uploads/2015/11/infographic_Sys2-0-680x683.png.webp 680w" sizes="(max-width: 1020px) 100vw, 1020px" />'
