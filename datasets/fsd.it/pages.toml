full_description = 'Designed to be used in Abitare magazine, Abitare Sans is a 30 weight readable sans serif with special OpenType features for publishing The Abitare magazine custom font Abitare Sans was originally commissioned by the group RCS Rizzoli Corriere della Sera in 2013. It’s a typeface of 30 weights designed to be used in Abitare magazine. The request of the president Mario Piazza was a new CP Company™ with some redesigned glyphs, but the result is a radical evolution of its concept being intended to be used as a font for text far more readable. In Abitare Sans was kept the geometric structure without neglecting the numerous editorials requirements. Some pictures of Abitare Sans used in Abitare magazine are shown at this page A special specimen I asked at the graphic design studio Artiva to design the specimen of my Abitare Sans because I love their simple, minimal and clever works You can download for just €9,99 the ebook Abitare Sans specimen page 39 <img decoding="async" width="2000" height="1500" src="https://fsd.it/wp-content/uploads/artiva-abitare-39.png.webp" class="vc_single_image-img attachment-full" alt="Abitare Sans™ specimen page 39, graphic design by Artiva" title="Abitare Sans™ specimen page 39, graphic design by Artiva" srcset="https://fsd.it/wp-content/uploads/artiva-abitare-39.png.webp 2000w,https://fsd.it/wp-content/uploads/artiva-abitare-39-800x600.png.webp 800w,https://fsd.it/wp-content/uploads/artiva-abitare-39-1200x900.png.webp 1200w,https://fsd.it/wp-content/uploads/artiva-abitare-39-350x263.png.webp 350w,https://fsd.it/wp-content/uploads/artiva-abitare-39-595x446.png.webp 595w,https://fsd.it/wp-content/uploads/artiva-abitare-39-150x113.png.webp 150w,https://fsd.it/wp-content/uploads/artiva-abitare-39-300x225.png.webp 300w,https://fsd.it/wp-content/uploads/artiva-abitare-39-680x510.png.webp 680w" sizes="(max-width: 2000px) 100vw, 2000px" /> Abitare Sans specimen page 38 <img decoding="async" width="2000" height="1500" src="https://