description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = '<img fetchpriority="high" decoding="async" width="1200" height="1200" src="https://fsd.it/wp-content/uploads/flag-sky_1200.jpg.webp" class="vc_single_image-img attachment-full" alt="Siruca Stencil Wayfinding Flag at Milan Design Week" title="Siruca Stencil Wayfinding Flag at Milan Design Week" srcset="https://fsd.it/wp-content/uploads/flag-sky_1200.jpg.webp 1200w,https://fsd.it/wp-content/uploads/flag-sky_1200-350x350.jpg.webp 350w,https://fsd.it/wp-content/uploads/flag-sky_1200-595x595.jpg.webp 595w,https://fsd.it/wp-content/uploads/flag-sky_1200-300x300.jpg.webp 300w,https://fsd.it/wp-content/uploads/flag-sky_1200-800x800.jpg.webp 800w,https://fsd.it/wp-content/uploads/flag-sky_1200-100x100.jpg.webp 100w,https://fsd.it/wp-content/uploads/flag-sky_1200-150x150.jpg.webp 150w,https://fsd.it/wp-content/uploads/flag-sky_1200-700x700.jpg.webp 700w" sizes="(max-width: 1200px) 100vw, 1200px" />The flag you’ll find at via Ventura 12, Milan. The pictograms meaning is: draw using Siruca Stencil here One of the most successful projects by Fabrizio Schiavi Design is certainly Siruca, the typographical system created in 2006 for the wayfinding of the complex Al Hamra in Kuwait City. On the occasion of Milan Design Week 2018, a special stencil in plexiglass containing the essential letters of the Siruca alphabet will be exhibited in via Ventura 12. A limited edition design object that could be sold-out very soon just like the previous edition in steel produced in 2009. <img decoding="async" width="6000" height="4000" src="https://fsd.it/wp-content/uploads/overlapping.jpg.webp" class="vc_single_image-img attachment-full" alt="Overlapping of Siruca Stencils in Plexiglass" title="Overlapping of Siruca Stencils in Plexiglass" srcset="https://fsd.it/wp-content/uploads/overlapping.jpg.webp 6000w,https://fsd.it/wp-content/uploads/overlapping-350x233.jpg.webp 350w,https://fsd.it/wp-content/uploads/overlapping-595x397.jpg.webp 595w,https://fsd.it/wp-content/uploads/overlapping-800x533.jpg.webp 800w,https://fsd.it/wp-content/uploads/overlapping-1200x800.jpg.webp 1200w,https://fsd.it/wp-content/uploads/overlapping-150x100.jpg.webp 150w,https://fsd.it/wp-content/uploads/overlapping-300x200.jpg.webp 300w,https://fsd.it/wp-content/uploads/overlapping-700x467.jpg.webp 700w" sizes="(max-width: 6000px) 100vw, 6000px" />Overlapping of Siruca Stencils in Plexiglass Every visitor can write using the stencil what he things in a 100 meter paper, buying a deck of Siruca Playing Cards or just take a free copy of a poster designed for this exhibition with all characters of Pragmata Pro in one of the sides. See you at Milan Design Week! via Ventura 12, Milan April 17—22 2018'
