full_description = '<img fetchpriority="high" decoding="async" width="3508" height="2662" src="https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4.jpg.webp" class="vc_single_image-img attachment-full" alt="PragmataPro Live perimetral view" title="PragmataPro Live perimetral view" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4.jpg.webp 3508w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-800x607.jpg.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-1200x911.jpg.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-350x266.jpg.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-595x452.jpg.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-150x114.jpg.webp 150w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-300x228.jpg.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Live-external_A4-680x516.jpg.webp 680w" sizes="(max-width: 3508px) 100vw, 3508px" /> PragmataPro Live is the exhibition of the first set of 9,000 glyphs of the Regular weight printed on a Forex panel of 21 meters folded into a big spiral. <img decoding="async" width="3720" height="2480" src="https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4.jpg.webp" class="vc_single_image-img attachment-full" alt="PragmataPro hint created between the folded panel" title="PragmataPro hint created between the folded panel" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4.jpg.webp 3720w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-800x533.jpg.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-1200x800.jpg.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-350x233.jpg.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-595x397.jpg.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-150x100.jpg.webp 150w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-300x200.jpg.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Live-inside_A4-680x453.jpg.webp 680w" sizes="(max-width: 3720px) 100vw, 3720px" /> PragmataPro exhibition is hosted by Aiap at the first floor of Palazzo Poli, the palace where was build Trevi Fountain in Rome and it’s visible until October 1, 2017 <img decoding="async" width="1440" height="1440" src="https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome.jpg.webp" class="vc_single_image-img attachment-full" alt="PragmataPro Live Rome poster" title="PragmataPro Live Rome poster" srcset="https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome.jpg.webp 1440w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-300x300.jpg.webp 300w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-800x800.jpg.webp 800w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-1200x1200.jpg.webp 1200w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-350x350.jpg.webp 350w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-595x595.jpg.webp 595w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-100x100.jpg.webp 100w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-150x150.jpg.webp 150w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-127x127.jpg.webp 127w,https://fsd.it/wp-content/uploads/PragmataPro-Live-Rome-680x680.jpg.webp 680w" sizes="(max-width: 1440px) 100vw, 1440px" /> My son presents PragmataPro Live installation to you in a unusual way: a roller coaster inside the hint created by the big spiral. He makes a great surprise to me with this video. ❤️ <iframe title="Roller coaster all’interno dell’installazione Pragmata Pro" width="500" height="281" src="https://www.youtube.com/embed/oqdoZF3QDXg?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe> <img decoding="async" class="vc_single_image-img " src="https://fsd.it/wp-content/uploads/PragmataPro-P-Poli-1400x1400.jpg" width="1400" height="1400" alt="PragmataPro is here, Palazzo Poli Rome" title="PragmataPro is here, Palazzo Poli Rome" loading="lazy" />'
