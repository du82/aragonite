full_description = 'Widiba institutional typefaces <img fetchpriority="high" decoding="async" width="2000" height="2538" src="https://fsd.it/wp-content/uploads/widiba_custom_fonts.png.webp" class="vc_single_image-img attachment-full" alt="Widiba custom fonts designed by Fabrizio Schiavi and j&amp;h" title="Widiba custom fonts designed by Fabrizio Schiavi and j&amp;h" srcset="https://fsd.it/wp-content/uploads/widiba_custom_fonts.png.webp 2000w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-630x800.png.webp 630w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-946x1200.png.webp 946w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-350x444.png.webp 350w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-595x755.png.webp 595w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-150x190.png.webp 150w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-300x381.png.webp 300w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-276x350.png.webp 276w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-469x595.png.webp 469w,https://fsd.it/wp-content/uploads/widiba_custom_fonts-680x863.png.webp 680w" sizes="(max-width: 2000px) 100vw, 2000px" /> Fabrizio Schiavi designed in collaboration with jekyll & hyde the typography of the corporate identity of Widiba a new Italian bank. The typeface family was designed keeping in mind the goals: readability in every device (pixel perfect!) and flexibility. The project was awarded by the prestigious Print, Hiii and A’design award. <img decoding="async" width="1090" height="575" src="https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original.png.webp" class="vc_single_image-img attachment-full" alt="Widiba ads" title="Widiba ads" srcset="https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original.png.webp 1090w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-800x422.png.webp 800w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-350x185.png.webp 350w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-595x314.png.webp 595w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-150x79.png.webp 150w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-300x158.png.webp 300w,https://fsd.it/wp-content/uploads/ef8b744a-9432-45f5-8147-827d4679595f-original-680x359.png.webp 680w" sizes="(max-width: 1090px) 100vw, 1090px" />Widiba ads. Credit: Widiba Abitare custom font family <img decoding="async" width="1780" height="2510" src="https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian.png.webp" class="vc_single_image-img attachment-full" alt="Abitare Sans is available in 30 weights Roman and Italic with Cyrillic set" title="Abitare Sans is available in 30 weights Roman and Italic with Cyrillic set" srcset="https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian.png.webp 1780w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-567x800.png.webp 567w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-851x1200.png.webp 851w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-350x494.png.webp 350w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-595x839.png.webp 595w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-150x212.png.webp 150w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-300x423.png.webp 300w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-248x350.png.webp 248w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-422x595.png.webp 422w,https://fsd.it/wp-content/uploads/abitare_sans_30_weights_russian-680x959.png.webp 680w" sizes="(max-width: 1780px) 100vw, 1780px" /> Abitare Sans was originally commissioned to Fabrizio Schiavi by the group RCS Rizzoli Corriere della Sera in 2013. It’s a typeface of 30 weights designed to be used in Abitare magazine. In Abitare Sans was kept the geometric structure without neglecting the numerous editorials requirements. The license of this project covered a temporary exclusive, after this Fabrizio Schiavi can resell the font family from this web site. <img decoding="async" width="2000" height="1500" src="https://fsd.it/wp-content/uploads/artiva-abitare-39.png.webp" class="vc_single_image-img attachment-full" alt="Abitare Sans™ specimen page 39, graphic design by Artiva" title="Abitare Sans™ specimen page 39, graphic design by Artiva" srcset="https://fsd.it/wp-content/uploads/artiva-abitare-39.png.webp 2000w,https://fsd.it/wp-content/uploads/artiva-abitare-39-800x600.png.webp 800w,https://fsd.it/wp-content/uploads/artiva-abitare-39-1200x900.png.webp 1200w,https://fsd.it/wp-content/uploads/artiva-abitare-39-350x263.png.webp 350w,https://fsd.it/wp-content/uploads/artiva-abitare-39-595x446.png.webp 595w,https://fsd.it/wp-content/uploads/artiva-abitare-39-150x113.png.webp 150w,https://fsd.it/wp-content/uploads/artiva-abitare-39-300x225.png.webp 300w,https://fsd.it/wp-content/uploads/artiva-abitare-39-680x510.png.webp 680w" sizes="(max-width: 2000px) 100vw, 2000px" /> Virna custom font for MTV <img decoding="async" width="1024" height="1576" src="https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD.png.webp" class="vc_single_image-img attachment-full" alt="mtv.it propose 2003 by FSD" title="mtv.it propose 2003 by FSD" srcset="https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD.png.webp 1024w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-520x800.png.webp 520w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-780x1200.png.webp 780w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-350x539.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-595x916.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-150x231.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-300x462.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-227x350.png.webp 227w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-387x595.png.webp 387w,https://fsd.it/wp-content/uploads/2015/11/mtv.it_propose_2003_FSD-680x1047.png.webp 680w" sizes="(max-width: 1024px) 100vw, 1024px" /> In September, 2003 I’ve been contacted by MTV for the restyling of mtv.it I started from the beginning to work on a radical simplification of its visual elements, to achieve a better usability. It didn’t take much to realize the basic design I attempted would have called for a notable reduction of the rich imagery distinguishing MTV’s visual identity. As a visual aid to help me in this process I designed Virna, a headline “op-art” inspired face with the ability to create both vertical and horizontal ligatures between single words among two text lines, with the same ease of linking letters in handwriting or a linked script typeface. Virna is included in ADI Design Index 2005 <img decoding="async" width="899" height="442" src="https://fsd.it/wp-content/uploads/2015/11/virna_movie.gif.webp" class="vc_single_image-img attachment-full" alt="Virna in use, slideshow" title="virna_movie" /> Everseen custom font Your browser does not support the video tag. Everseen is an Irish company that developes visual AI for business. I’ve been contacted by Ideosuite in 2022 to improve their custom font used to create logotypes and headlines. <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-mark-2023-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="e as icon set in Everseen custom font 2022 designed by Fabrizio Schiavi" title="e as icon set in Everseen custom font 2022 designed by Fabrizio Schiavi" srcset="https://fsd.it/wp-content/uploads/everseen-mark-2023-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-mark-2023-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-mark-2023-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-mark-2023-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-mark-2023-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-mark-2023-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-mark-2023.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />e icon mark <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="Everseen logo and pay-off typeset in the new Fabrizio Schiavi custom font" title="Everseen logo and pay-off typeset in the new Fabrizio Schiavi custom font" srcset="https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-logotype-2023-by-fabrizio-schiavi.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />Everseen 2022 logo and pay-off <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="Everseen custom font 2022 designed by Fabrizio Schiavi in use" title="see &amp; solve typeset in new Everseen custom font" srcset="https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-see-and-solve-fsd-custom-font.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />see & solve typeset in new Everseen custom font <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="Everseen custom font designed by Fabrizio Schiavi" title="Everseen custom font designed by Fabrizio Schiavi" srcset="https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-custom-font-by-fabrizio-schiavi.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />Essential glyphs of Everseen custom font <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="Some brand names typeset in Everseen custom font deisgned by Fabrizio Schiavi" title="Some brand names typeset in Everseen custom font" srcset="https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-brand-names-custom-font-2023.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />Some brand names typeset in Everseen custom font <img decoding="async" width="595" height="595" src="https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-900x900.jpg.webp" class="vc_single_image-img attachment-medium" alt="Everseen custom font designed by Fabrizio Schiavi numbers and punctuation at work" title="Numbers and punctuation typeset in Everssen custom font" srcset="https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-900x900.jpg.webp 900w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-300x300.webp 300w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-1536x1536.webp 1536w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-350x350.webp 350w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-595x595.webp 595w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation-100x100.webp 100w,https://fsd.it/wp-content/uploads/everseen-custom-font-punctuation.webp 1600w" sizes="(max-width: 595px) 100vw, 595px" />Numbers and punctuation typeset in Everssen custom font'
