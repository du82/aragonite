full_description = 'My first custom font CP Company™ is a typeface designed in 2000 as part for the corporate image and internal communication of the Italian clothes manufacturer C.P. Company CP Company™ in use <img decoding="async" width="1024" height="354" src="https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany.png.webp" class="vc_single_image-img attachment-full" alt="The People More set in CP Cpmpany 2001" title="The People More set in CP Cpmpany 2001" srcset="https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany.png.webp 1024w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-800x277.png.webp 800w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-350x121.png.webp 350w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-595x206.png.webp 595w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-150x52.png.webp 150w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-300x104.png.webp 300w,https://fsd.it/wp-content/uploads/2015/11/ThePeopleMore_CP_Cpmpany-680x235.png.webp 680w" sizes="(max-width: 1024px) 100vw, 1024px" /> Optimized for screen The company makes intensive use of press and web solutions for promotion and advertising, so they needed a typeface that is consistent for reading both on paper and on screen. So every weight of CP Company was TrueType hand hinted. <img decoding="async" width="400" height="191" src="https://fsd.it/wp-content/uploads/2015/11/cp_hints.gif.webp" class="vc_single_image-img attachment-full" alt="" title="CP Company Hand Hinting" /> Ideal web font for “micro” texts <img decoding="async" width="417" height="64" src="https://fsd.it/wp-content/uploads/2015/11/cp_aalias.gif.webp" class="vc_single_image-img attachment-full" alt="CP Company Regular antialiased at small size" title="CP Company Regular antialiased at small size" /> Inusual stylistic solutions | Pre-Helvetica sans | OCR technology | XVII century serifs <img decoding="as