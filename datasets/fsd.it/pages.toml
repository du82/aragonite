oads/abitare_text_specimen.png.webp 1444w,https://fsd.it/wp-content/uploads/abitare_text_specimen-638x800.png.webp 638w,https://fsd.it/wp-content/uploads/abitare_text_specimen-956x1200.png.webp 956w,https://fsd.it/wp-content/uploads/abitare_text_specimen-350x439.png.webp 350w,https://fsd.it/wp-content/uploads/abitare_text_specimen-595x747.png.webp 595w,https://fsd.it/wp-content/uploads/abitare_text_specimen-150x188.png.webp 150w,https://fsd.it/wp-content/uploads/abitare_text_specimen-300x376.png.webp 300w,https://fsd.it/wp-content/uploads/abitare_text_specimen-279x350.png.webp 279w,https://fsd.it/wp-content/uploads/abitare_text_specimen-474x595.png.webp 474w,https://fsd.it/wp-content/uploads/abitare_text_specimen-680x853.png.webp 680w" sizes="(max-width: 1444px) 100vw, 1444px" /> Useful OpenType features Abitare Sans is not just a typeface for text, it’s designed to used in every way, and the numerous features covers almost all kind of typographic needs above all in publishing <img decoding="async" width="1627" height="2477" src="https://fsd.it/wp-content/uploads/abitare_ot_features.gif.webp" class="vc_single_image-img attachment-full" alt="Abitare Sans™ opentype features" title="Abitare Sans™ opentype features" /> The perfect UI font The user interface design will looks better with a “resilient” typeface like this. Above all at very low sizes! <img decoding="async" width="1110" height="709" src="https://fsd.it/wp-content/uploads/Abitare_Sans_user_interface_font.png.webp" class="vc_single_image-img attachment-full" alt="Abitare Sans as user interface font" title="Abitare Sans as user interface font" srcset="https://fsd.it/wp-content/uploads/Abitare_Sans_user_interface_font.png.webp 1110w,https://fsd.it/wp-content/uploads/Abitare_Sans_user_interface_font-800x511.png.webp 800w,https://fsd.it/wp-content/uploads/Abitare_Sans_user_interface_font-350x224.png.webp 350w,https://fsd.it/wp-content/uploads/Abitare_Sans_user_interface_font-595x380.png.webp 595w,https://fsd.it/w