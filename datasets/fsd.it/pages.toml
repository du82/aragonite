 employees, you cannot use a license meant for 2-50 employees. Licenses are specific to the type of usage. If you purchased a desktop license, you CAN’T use it in apps and websites. If you purchased a website license, you CAN’T use it in apps or as a desktop font. If you purchased an app license, you CAN’T use it in websites or as a desktop font. You MUST order the appropriate license from https://fsd.it/ You may copy the software, but only for personal backup purposes. You must not rent, lease, loan, resell for profit, distribute, or network the Software. Reverse engineering or decompilation of the Software is prohibited. Fonts may be embedded in static PDFs, provided they are subset. A desktop license covers all uses except websites and apps, including broadcasting (YouTube, Vimeo…), ePubs (eBooks, eMagazines, eNewspapers, or interactive PDFs). PAY ONCE. This license does not need to be renewed. If the font will be used for a project that reaches more than one (1) million viewers, you must notify Fabrizio Schiavi using the contact page https://fsd.it/contact-me/ to make a custom license agreement. If the company has more than five hundred thousand (500,000) employees, you must notify Fabrizio Schiavi using the contact page https://fsd.it/contact-me/ to make a custom license agreement. In no event will Fabrizio Schiavi be liable for any damages, including loss of data, or other incidental or consequential damages arising out of the use or inability to use the data supplied. This limitation of liability applies to any damages or injury, including those caused by any failure of performance, error, omission, interruption, deletion, defect, delay in operation or transmission, computer virus, communication line failure, theft or destruction of, or unauthorized access to, alteration of, or use of record, whether for breach of contract, tort, negligence, or under any other cause of action. The Software and the accompanying articles are protected by Copyright Law and international treaty. Unauthorized reproduction or distribution is subject to civil and criminal penalties. This Agreement will be governed by and construed in accordance with the laws of Italy.For Web font licensors:You CAN’T convert desktop fonts into web fonts, you must order the corresponding web font version directly by http://www.fsd.it/ site. You may use it as a font embedding for web pages (@ font-face) provided it is converted in a way that makes it impossible to recover the original font. You must follow the procedure described at http://www.fsd.it/how-to-protecting-the-webfont-files/ to avoid linking. You can install the web font at one (1) site. If you need to install at two (2) sites you must buy another license. The limitation of page views per month is of ten thousand (10,000) if you exceed this you must notify Fabrizio Schiavi using contact page http://www.fsd.it/contact-me/ You CAN’T convert web fonts into desktop fontsFor App licensors:You must embed the font files in your mobile application—s code in a way that makes it impossible to recover the original font. You can install the app font in one (1) app. If you need to install it in two (2) apps you must buy another license.Refund policy:We issue refunds for digital products within 14 days of the original purchase of the product.There are some items, however, that are ineligible for return, including:– Electronic Fonts and Icons Downloads– Gift CardsShipping policy:All orders are processed within 1 to 2 business days (excluding weekends and holidays) after receiving your order confirmation email..You’ll be updated by email about issues such as potential delays due to a high volume of orders or postal service problems that are outside of your control.We use tracked shipping by Poste Italiane as carrier. Shipping costs will be show at the checkout and are all variable.The extimated delivery time is 1 day for Italy, 2 days for Europe, 3-10 days for the rest of the World.We accept returns up to 30 days aft