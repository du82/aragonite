["https://ftc.gov/advice-guidance/competition-guidance/antitrust-complaint-intake"]
title = "Antitrust Complaint Intake | Federal Trade Commission"
description = "This question is for testing whether or not you are a human visitor and to prevent automated spam submissions."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Current General Information Complaint Information Company Information Complainant Information Complete The FTC will never demand money, make threats, tell you to transfer money, or promise you a prize. If you have been targeted by an illegal business practice or scam, report it at Reportfraud.ftc.gov. If you have an antitrust complaint, please submit it to the Bureau of Competition by using this webform. Please note that the FTC cannot provide legal advice, take action on behalf of private individuals, or answer questions about its cases. The FTC’s Guide to the Antitrust Laws answers general questions about the antitrust laws and contains Frequently Asked Questions on a number of topics. Inside BC provides information about the work of the Bureau of Competition. Complaints may also be sent by mail to: Office of Policy and Coordination Bureau of Competition Federal Trade Commission 600 Pennsylvania Avenue, NW Washington, DC 20580 NOTE: Confidential information should be marked “Confidential” and sent via regular mail. To learn how we may use the information you provide, please read our Privacy Policy. RESPONSES: The Bureau appreciates hearing your concerns and the time you have taken to express your views. Please understand that in some instances the volume of communication we receive on a particular issue is such that we cannot respond individually to each message. You have our assurance, however, that all incoming messages are forwarded to the appropriate division within the Bureau of Competition and that your views are being heard. CAPTCHA This question is for testing whether or not you are a human visitor and to prevent automated spam submissions. Return to top"
