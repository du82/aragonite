full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Tags: Competition The FTC provides guidance in the form of advisory opinions concerning proposed conduct. The process starts with a request for advice from the party proposing the conduct. Many competition advisory opinions are rendered by Bureau staff, and often involve issues in the health care field. Commission advisory opinions are voted on by the Commission and are intended to address substantial or novel questions of fact or law, or subjects of significant interest. (See also the Antitrust Division of the Department of Justice for information on their business review procedure.) Joint FTC-DOJ Antitrust Statement Regarding COVID-19 | press release (Mar. 24, 2020) Advisory Opinion Process (General Competition Matters) (PDF) Advisory Opinion Process (Healthcare) (PDF) Health Care Advisory Opinions Other Advisory Opinions"
