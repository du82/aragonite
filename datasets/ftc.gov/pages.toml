["https://ftc.gov/business-guidance/industry/clothing-and-textiles"]
title = "Clothing and Textiles | Federal Trade Commission"
description = "How to comply with requirements for labeling products made of cashmere, cotton, down, feather, fur, wool, rayon made from bamboo or other materials; attaching care instructions to garments; making truthful “Made in the USA” claims, and more."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM By Industry Menu By Industry Alcohol Appliances Automobiles Clothing and Textiles Finance Franchises, Business Opportunities, and Investments Funerals Human Resources Jewelry Real Estate and Mortgages Tobacco How to comply with requirements for labeling products made of cashmere, cotton, down, feather, fur, wool, rayon made from bamboo or other materials; attaching care instructions to garments; making truthful “Made in the USA” claims, and more. Featured Registered Identification Number DatabaseSeptember 26, 2018 Plain Language Guidance .com Disclosures: How to Make Effective Disclosures in Digital AdvertisingWhether advertising in print, on radio or TV, or on the Internet, it’s important to disclose the details of the deal up front. This publication offers practical tips on how to make effective disclosures online. Cachet of Cashmere: Complying with the Wool Products Labeling ActDoes your business manufacture or sell clothing or household items that contain wool – including specialty wools like cashmere, camel hair, mohair, alpaca, llama, or vicuna? Find out how to comply with labeling requirements about fiber content, country of origin, care instructions, and other information important to buyers. Calling It Cotton: Labeling and Advertising Cotton ProductsConsumers “cotton” to correct content information. If you advertise or sell clothing or household items containing cotton, product labels must accurately reflect the fabric content. Clothes Captioning: Complying with the Care Labeling RuleCare labels can be crucial when consumers shop for clothing. Some look for the convenience of dry cleaning, while others prefer the economy of washable garments. This guide helps you comply with the FTC’s Care Labeling Rule. Comience con seguridad: una guía para negociosEste campo está desactivado porque no tiene permisos suficientes para editarlo. Down...But Not Out: Advertising and Labeling of Feather DownWhen selling feather or down products, it’s important to comply with truth-in-advertising standards. Are your down claims on the up and up? Environmental Claims: Summary of the Green GuidesIf your company makes environmental claims in your ads or on your products, you'll want to know about the FTC's Green Guides. This summary of the Guides introduces how truth-in-advertising principles apply to green marketing and highlights terms often used in environmental ads. Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. How to Avoid Bamboozling Your CustomersDo you make or sell bamboo-based textiles? Do you market clothing, linens, or other products advertised or labeled as bamboo? If your product isn’t made directly from bamboo fiber, it can’t be called bamboo. Read this publication to get clued in on bamboo. How to Comply with the Fur Products Labeling ActGarment labels give consumers important purchasing information. If you manufacture, import or sell fur garments — whether coats, capes, stoles or parkas — you must comply with the labeling requirements under the Fur Products Labeling Act (FPLA). This guidance explains the FPLA’s current requirements. Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? Start with Security: A Guide for BusinessTen practical lessons businesses can learn from the FTC's 50+ data security settlements. Threading Your Way Through the Labeling Requirements Under the Textile and Wool ActsMost textile and wool products must have a label listing the fiber content, the country of origin, and the identity of the manufacturer or another business responsible for marketing or handling the item. Read this guide to avoid a “tag snag.” Wedding Gown Labels: Unveiling the Requirements When shopping for the most memorable – and expensive – clothing purchase of a lifetime, today’s savvy bride needs to know about the manufacturer, fiber content, country of origin and care instructions. Make sure your labels accurately “unveil” the details. Related Blog Posts In Olde English or modern, Made in USA means Made in USAJune 27, 2023 FTC says Made in USA claims about mattress pads for truck bunks were, well, bunkAugust 30, 2022 Lions Not Sheep lambasted for deceptive Made in USA claimsMay 11, 2022 $5.5 million total FTC settlements with Kohl’s and Walmart challenge “bamboo” and eco claims, shed light on Penalty Offense enforcementApril 8, 2022 I’ll pay you to give this blog post five starsJanuary 25, 2022 Legal Resources on Clothing and Textiles Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Advisory Opinions Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Closing Letters Closing Letters Closing Letters Closing Letters Closing Letters Closing Letters Closing Letters