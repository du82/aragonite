["https://ftc.gov/about-ftc/bureaus-offices/office-administrative-law-judges"]
title = "Office of Administrative Law Judges | Federal Trade Commission"
description = "The Office of Administrative Law Judges performs the initial adjudicative fact-finding in Commission administrative complaint proceedings, guided by the FTC Act, the Administrative Procedure Act, r"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM The Office of Administrative Law Judges performs the initial adjudicative fact-finding in Commission administrative complaint proceedings, guided by the FTC Act, the Administrative Procedure Act, relevant case law interpreting these statutes, and the FTC's Rules of Practice, 16 C.F.R. Part 3. The administrative law judge assigned to handle each complaint issued by the Commission holds pre-hearing conferences; resolves discovery disputes, evidentiary disputes, and procedural disputes; and conducts the full adversarial evidentiary hearing on the record. The administrative law judge issues a recommended decision which sets out relevant and material findings of fact with record citations, explains the correct legal standard, applies the law to the facts, and, where appropriate, issues an order on remedy. In addition, the Office of Administrative Law Judges reviews appeals of final civil sanctions imposed under the Horseracing Integrity and Safety Act.Administrative Law Judges are independent decision makers, appointed under 5 U.S.C. § 3105."
