description = "John Krebs, Chief Privacy OfficerThe Office of the Chief Privacy Officer (OCPO) manages the FTC’s internal privacy program and is responsible for ensuring that the Commission complies with"
full_description = 'Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM John Krebs, Chief Privacy OfficerThe Office of the Chief Privacy Officer (OCPO) manages the FTC’s internal privacy program and is responsible for ensuring that the Commission complies with all applicable privacy laws and guidance. OCPO identifies the privacy risks, controls, and mitigating solutions when making decisions involving the collection, use, sharing, retention, disclosure and destruction of personally identifiable information. It is also responsible for investigating and mitigating privacy incidents, supporting the FTC mission with an evolving privacy program, and promoting a culture of privacy among FTC staff, contractors, and third parties. For more information, see the FTC’s privacy policy.Has "John Krebs" contacted you?Important: John Krebs will never demand money, make threats, tell you to transfer money, or promise you a prize. FTC employees will not ask you for personal or financial information, or call to notify you that you’ve been a victim of identity theft. If someone says they’re from the FTC and demands money, they’re a scammer. Don’t pay them or give them any personal information.Learn more about How to Avoid Government Impersonation ScamsIf you have been targeted by an illegal business practice or scam, contact your local law enforcement authorities, and report it to the FTC.Report to the FTC'
