full_description = 'Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM The FTC will never demand money, make threats, tell you to transfer money, or promise you a prize. If you have been targeted by an illegal business practice or scam, report it at Reportfraud.ftc.gov.If you have a question or comment about an issue, please submit it to the appropriate Bureau by one of the methods below. To learn how we may use the information you provide, please read our Privacy Policy. To help us serve you better, please include a day-time telephone number in your communication.In addition to our offices in DC, the FTC has eight regional offices — in Atlanta, Chicago, Cleveland, Dallas, Los Angeles, New York, San Francisco, and Seattle — that help to amplify our national impact and local presence, and allow us to respond better to the diversity of the U.S. marketplace.Federal Trade CommissionHeadquartersFederal Trade Commission600 Pennsylvania Avenue, NWWashington, DC 20580Telephone: (202) 326-2222Constitution CenterFederal Trade Commission400 7th St., SWWashington, DC 20024Telephone: (202) 326-2222Note: Email is not secure. Mark confidential information "Confidential" and send it via postal mail only to the 600 Pennsylvania Ave., NW (Headquarters) address above. Shipping and Courier InformationCouriers are prohibited from making deliveries directly to the Federal Trade Commission. Couriers delivering sealed envelopes or packages to the FTC must do so via BrightKey:BrightKey Offices9050 Junction Dr, Annapolis Junction, Maryland 20701Hours: Monday – Friday, 8 am – 5 pmContact Number for Couriers: 301-604-3305For ConsumersReport fraud, scams, and bad business practices at ReportFraud.ftc.gov.Report identity theft at IdentityTheft.gov.Report unwanted calls at donotcall.gov.Contact the Consumer Response Center by calling 1-877-FTC-HELP (382-4357)For JournalistsOffice of Public AffairsTelephone: (202) 326-2180Email: opa@ftc.govHSR FilingsFor questions about how to file Premerger notification or for information about the HSR program, please see the Premerger Notification Office contact information.Administrative LitigationsFor general information, or to submit a filing in an administrative litigation before an Administrative Law Judge or before the Commission, please contact electronicfilings@ftc.gov.For OrganizationsComplaints about mergers, antitrust issues, acquisitions and business conduct that harm competition, limit products or services, destroy innovation, or raise prices may be submitted via the antitrust complaint intake form.Bureau of CompetitionOffice of Policy and CoordinationRoom CC-5422Bureau of CompetitionFederal Trade Commission600 Pennsylvania Ave., NWWashington, DC 20580Email: antitrust@ftc.govPremerger Notification OfficeTelephone: (202) 326-3100Staff Email Addresses: Premerger Notification Office contact informationBureau of Consumer ProtectionBureau of Consumer ProtectionFederal Trade Commission600 Pennsylvania Ave., NWWashington, DC 20580Bureau of EconomicsBureau of EconomicsFederal Trade Commission600 Pennsylvania Ave., NWWashington, DC 20580Educational MaterialsBulk Order (50 or more copies)https://bulkorder.ftc.gov/Consumer Education Materialshttp://www.consumer.ftc.gov/Registered Numbers (RN) & Textile, Wool, & FurRN DatabaseClothing & Textiles GuidanceOther Contact InformationFind an OfficePhone: (202) 326-2222Find a Staff MemberPhone: (202) 326-2000To File An Employment Discrimination ComplaintOffice of Equal Employment OpportunityPhone: (202) 326-2196TTY: (202) 326-3798Report Website IssuesTo report technical problems with our website, such as a link not working, or suggest site improvements:Email: webmaster@ftc.govContact our FOIA OfficeRequest Agency Records'
