["https://ftc.gov/business-guidance/advertising-marketing/endorsements-influencers-reviews"]
title = "Endorsements, Influencers, and Reviews | Federal Trade Commission"
description = "If you use consumer reviews or endorsements in your marketing, are you both meeting the standards of the FTC Act and complying with the specific prohibitions of the Rule on the Use of Consumer Reviews and Testimonials? What about the FTC's Guides Concerning Use of Endorsements and Testimonials in Advertising (Endorsement Guides), revised in 2023? Get plain language guidance from the FTC related to reviews, social media influencers, and for complying with the Consumer Review Fairness Act."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing If you use consumer reviews or endorsements in your marketing, are you both meeting the standards of the FTC Act and complying with the specific prohibitions of the Rule on the Use of Consumer Reviews and Testimonials? What about the FTC's Guides Concerning Use of Endorsements and Testimonials in Advertising (Endorsement Guides), revised in 2023? Get plain language guidance from the FTC related to reviews, social media influencers, and for complying with the Consumer Review Fairness Act. Featured The Consumer Reviews and Testimonials Rule: Questions and Answers FTC's Endorsement Guides: What People Are Asking Plain Language Guidance Consumer Review Fairness Act: What Businesses Need to KnowThe Consumer Review Fairness Act protects consumers’ ability to share their honest opinions about a business’s products, services, or conduct in any forum – and that includes social media. The FTC has tips to help your company comply with the law. Disclosures 101 for Social Media InfluencersDo you work with brands to recommend or endorse products? If so, you need to comply with the law when making these recommendations. One key is to make a good disclosure of your relationship to the brand. This brochure from FTC staff gives tips on when and how to make good disclosures. Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. FTC's Endorsement Guides: What People Are AskingAnswers to questions people are asking about the FTC’s Endorsement Guides, including information about disclosing material connections between advertisers and endorsers. The brochure also addresses how those established consumer protection principles apply in social media and influencer marketing. Native Advertising: A Guide for BusinessesMarketers and publishers are using innovative methods to create, format, and deliver digital advertising. One form is “native advertising,” content that bears a similarity to the news, feature articles, product reviews, entertainment, and other material that surrounds it online. But as native advertising evolves, are consumers able to differentiate advertising from other content? Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? The Consumer Reviews and Testimonials Rule: Questions and AnswersThe FTC’s Rule on the Use of Consumer Reviews and Testimonials addresses the persistent problem of fake and false consumer reviews and testimonials. Here are answers to the top questions businesses are asking about what’s covered and how to comply. Use of Endorsements and Testimonials in Advertising Resources Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. Related Blog Posts No shortcuts to five stars: Lessons from the FTC’s settlement with SitejabberNovember 6, 2024 We’ll pay you to give our new rule a good reviewAugust 14, 2024 FTC says CarShield shielded consumers from the truth about limitations of its vehicle service contractsJuly 31, 2024 $43.5 million in redress and debt cancellation to servicemembers, military spouses, and other consumers due to multiple missteps by education provider Career StepJuly 30, 2024 How is a student debt relief outfit allegedly misleading consumers? Let us count the ways. July 22, 2024 Legal Resources on Endorsements, Influencers, and Reviews Cases Cases Leader Automotive Group, et al., FTC and State of Illinois v. Cases Sitejabber Cases Rytr LLC, In the Matter of Cases Verkada Inc., U.S. v. Cases CarShield Cases USA Student Debt Relief, FTC v. Cases CRI Genetics, FTC and State of California v. Cases Hey Dude Inc., FTC v. Cases TruthFinder, LLC, FTC v. Cases Rejuvica, LLC., FTC v. Cases Smoke Away, U.S. v. Cases The Bountiful Company Cases Google LLC and iHeartMedia, Inc., In the Matter of Cases DK Automation Cases Roomster Corp Cases Gravity Defyer, FTC v. Cases Vision Path, Inc., d/b/a Hubble Contacts, U.S. v. Cases Fashion Nova, LLC, In the Matter of Cases Wellco, Inc., FTC v. Cases Health Center, Inc. Cases SLAC, Inc. Cases Teami, LLC Cases ZyCal Bioceuticals Healthcare Company, Inc. Cases LendEDU, et al., In the Matter of Cases A.S. Research, LLC (Synovia) Cases Nudge, LLC Cases Mortgage Solutions FCS, Inc. Cases NatureCity, LLC Cases Sunday Riley Modern Skincare, LLC; In the Matter of Cases Zurixx, LLC Cases Truly Organic Inc. Cases Devumi, LLC Cases Grand Te