["https://ftc.gov/business-guidance/industry/automobiles"]
title = "Automobiles | Federal Trade Commission"
description = "If your business sells automobiles, fuel, or related products, have you kept up to date on the rules and laws that could affect your company? The FTC has resources discussing the Used Car Rule, labeling guidelines for alternative fueled vehicles and alternatives fuels, how the FTC’s Privacy Rule applies to auto dealers – and other topics of interest to the automotive industry."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM By Industry Menu By Industry Alcohol Appliances Automobiles Clothing and Textiles Finance Franchises, Business Opportunities, and Investments Funerals Human Resources Jewelry Real Estate and Mortgages Tobacco If your business sells automobiles, fuel, or related products, have you kept up to date on the rules and laws that could affect your company? The FTC has resources discussing the Used Car Rule, labeling guidelines for alternative fueled vehicles and alternatives fuels, how the FTC’s Privacy Rule applies to auto dealers – and other topics of interest to the automotive industry. Featured FTC CARS Rule: Combating Auto Retail Scams – A Dealers GuideDecember 11, 2023 Plain Language Guidance .com Disclosures: How to Make Effective Disclosures in Digital AdvertisingWhether advertising in print, on radio or TV, or on the Internet, it’s important to disclose the details of the deal up front. This publication offers practical tips on how to make effective disclosures online. 16 CFR Part 455 Trade Regulation Rule; Sale of Used Motor VehiclesThe staff of the Federal Trade Commission publishes its staff compliance guidelines for the Used Car Rule to provide assistance to industry members. The views expressed in the guidelines are those of the staff only. They have not been approved or adopted by the Commission and are not binding on the Commission. However, the guidelines will serve as enforcement criteria for the staff in assessing compliance with the trade regulation rule. 16 CFR Part 455 Trade Regulation Rule; Sale of Used Motor VehiclesAnalysis of Public Comments and Final Staff Compliance Guidelines Advertising Consumer LeasesDoes your company advertise consumer leases? This publication focuses on your legal obligations under the Consumer Leasing Act and Regulation M. Advertising FAQ's: A Guide for Small BusinessFocusing on federal truth-in-advertising standards, this A-to-Z primer is an essential resource for businesses of any size. Answering Dealers’ Questions about the Revised Used Car RuleThe Used Car Rule requires auto dealers to display on used cars a window sticker called a Buyers Guide with important information for consumers. The FTC revised the Used Car Rule in 2016. Here are answers to questions we’ve heard about complying with the revised Rule. Businessperson's Guide to Federal Warranty LawDo your product warranties comply with law? This guide explains the Magnuson-Moss Warranty Act, the federal law governing warranties on consumer products. Buyers Guide (Fillable form)The FTC's Used Car Rule requires dealers to post a Buyers Guide in every used car they offer for sale. This version of the form can be filled in. Buyers Guide (Format Notes)The FTC's Used Car Rule requires dealers to post a Buyers Guide in every used car they offer for sale. This version of the form includes the format notes for the forms. Comience con seguridad: una guía para negociosEste campo está desactivado porque no tiene permisos suficientes para editarlo. Complying with the Credit Practices RuleIf your company is a creditor subject to FTC jurisdiction, the Credit Practices Rules applies to you. Read this guide to find out what the Rule requires and what transactions are covered. Complying with the FTC Fuel Rating RuleThe FTC prepared this guide to help you comply with the Automotive Fuel Ratings, Certification and Posting Rule, also known as the Fuel Rating Rule. The Rule covers the sale and transfer of liquid automotive fuel. Dealer's Guide to the Used Car RuleMost dealers who sell used vehicles must comply with the Used Car Rule. This publication explains how to prepare and display the Buyers Guide and provides a compliance checklist. FTC CARS Rule: Combating Auto Retail Scams – A Dealers GuideThe primary purpose of the FTC’s CARS Rule is to add truth and transparency to the car buying or leasing process by making it clear that certain deceptive or unfair practices are illegal – for example, bait-and-switch tactics, hidden charges, and other conduct that harms consumers and honest dealers. Why is it called the CARS Rule? Because the Rule is about Combating Auto Retail Scams that cost consumers billions of dollars each year and cause honest dealers to lose business. FTC's Privacy Rule and Auto Dealers: FAQsAuto dealers that extend credit, arrange financing or leasing, or give financial advice must notify customers about the information they collect, who they share it with, and how they protect it. Are you following the rules of the road? Guía del Comprador (Con notas sobre el formato)La Ley de Automóviles Usados de la Comisión Federal de Comercio requiere a los concesionarios a fijar una Guía del Comprador en cada automóvil usado que esté a la venta. Esta versión incluye notas sobre el formato. Guía del Comprador (Versión para llenar)La Ley de Automóviles Usados de la Comisión Federal de Comercio requiere a los concesionarios a fijar una Guía del Comprador en cada automóvil usado que esté a la venta. Esta versión se puede llenar. Start with Security: A Guide for BusinessTen practical lessons businesses can learn from the FTC's 50+ data security settlements. Related Blog Posts Car dealers included add-ons without consumers’ consent and discriminated against Black and Latino buyers, alleges FTCAugust 20, 2024 Bait, switch, hitch, and which? FTC and Arizona AG challenge car dealers’ alleged deceptive and discriminatory practicesAugust 15, 2024 FTC says CarShield shielded consumers from the truth about limitations of its vehicle service contractsJuly 31, 2024 Little used coupe: $1 million FTC settlement with online auto dealer Vroom sends key compliance messages to industryJuly 5, 2024 Car dealer tacked on junk fees and bogus add-ons, FTC and Connecticut allege January 4, 2024 Legal Resources on Automobiles Advisory Opinions Advisory Opinions Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Closing Letters Closing Letters Videos Start with Security Protecting Your Business From Fraud Return to top"
