["https://ftc.gov/about-ftc/bureaus-offices"]
title = "Bureaus & Offices | Federal Trade Commission"
description = "FTC Organization Chart"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM FTC Organization ChartBureausThe Bureau of Competition seeks to prevent anticompetitive mergers and other anticompetitive business practices in the marketplace. By enforcing the antitrust laws, the Bureau promotes competition and protects consumers' freedom to choose goods and services in an open marketplace at a price and quality that fit their needs.The Bureau of Consumer Protection's mandate is to protect consumers against unfair, deceptive or fraudulent practices. The Bureau enforces a variety of consumer protection laws enacted by Congress, as well as trade regulation rules issued by the Commission. Its actions include individual company and industry-wide investigations, administrative and federal court litigation, rulemaking proceedings, and consumer and business education. In addition, the Bureau contributes to the Commission's on-going efforts to inform Congress and other government entities of the impact that proposed actions could have on consumers.The Bureau of Economics helps the FTC evaluate the economic impact of its actions. To do so, the Bureau provides economic analysis and support to antitrust and consumer protection investigations and rulemakings. It also analyzes the impact of government regulation on competition and consumers and provides Congress, the Executive Branch and the public with economic analysis of market processes as they relate to antitrust, consumer protection, and regulation.OfficesOffice of Administrative Law JudgesOffice of the Chief Privacy OfficerOffice of Congressional RelationsOffice of the Executive DirectorOffice of International AffairsOffice of Policy PlanningOffice of the General CounselOffice of Public AffairsOffice of the SecretaryOffice of TechnologyRegional Offices"
