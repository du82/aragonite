full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Clarke Edwards, Acting DirectorThe Office of Policy Planning assists the Commission to develop and implement long-range competition and consumer protection policy initiatives and advises staff on cases raising new or complex policy and legal issues.One of the Office of Policy Planning's primary roles involves advocacy, submitting filings supporting competition and consumer protection principles to state legislatures, regulatory boards, and officials; state and federal courts; other federal agencies; and professional organizations. The Office also organizes public workshops and issues reports on cutting-edge competition and consumer protection topics, addressing questions of substantive antitrust law, industry-specific practices, and significant national and international policy debates.In addition to the Office of Policy Planning, several offices throughout the Commission, including the Bureau of Competition’s Office of Policy and Coordination, also provide policy advice."
