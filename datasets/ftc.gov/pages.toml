full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Download Hi-res (7.2 MB) Chairman Follow @AFergusonFTC Tweets represent the views of Chairman Andrew N. Ferguson alone Speeches, Articles or Testimony Biography Andrew N. Ferguson is Chairman of the Federal Trade Commission.Ferguson most recently served as solicitor general of the Commonwealth of Virginia. Prior to that position, he served as chief counsel to U.S. Sen. Mitch McConnell of Kentucky, the Republican leader, and as a Republican counsel on the U.S. Senate Judiciary Committee. He also practiced law at several Washington, D.C. law firms. He earned his undergraduate degree and law degree from the University of Virginia. After law school, Ferguson clerked for Judge Karen L. Henderson on the U.S. Court of Appeals for the D.C. Circuit and U.S. Supreme Court Justice Clarence Thomas."
