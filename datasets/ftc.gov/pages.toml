description = "IMPORTANT NOTICE (2/19/2025): On February 18, 2025, a vendor providing FOIA support services experienced a data outage that may have affected the FTC’s ab"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM IMPORTANT NOTICE (2/19/2025): On February 18, 2025, a vendor providing FOIA support services experienced a data outage that may have affected the FTC’s ability to receive FOIA requests. If you submitted a FOIA request on February 18, 2025, and have not yet been contacted by a member of the FTC’s FOIA staff, please contact us at FOIA@ftc.gov and we will be happy to assist you. Thank you.The Freedom of Information Act (FOIA) and Privacy Act (PA) gives the public with the right to make a request for federal agency records. Consult the Make a FOIA request or Make a Privacy Act Request pages for details on how to request records from the Federal Trade CommissionFreedom of Information ActThe FOIA allows any person to make a request for Federal Trade Commission records so long as one of the nine FOIA exemptions do not apply to the record(s) or portions of the record(s). See 5 U.S.C. § 552. Consult Make a FOIA request for more information. However, if you are seeking records about yourself or a specific person, see Make a Privacy Act Request.Privacy Act (PA)The Privacy Act of 1974 requires additional identification verification to obtain Federal Trade Commission records about yourself or a specific individual. 5 U.S.C. § 552a(b). If you are requesting records about yourself, we are required to verify your identity before releasing any records. If you are a third-party requesting records about a specific individual, that individual is required to authorize the release of those records, see Make a Privacy Act Request.FOIA ContactsFOIA Requester Service Center: (202) 326-2430FTC FOIA Public Liaison:Richard Gold, (202) 326-3355Comments?Email your FOIA comments to FOIAcomments@ftc.gov. File FTC plan for Improvement of the Administration of the Freedom of Information Act Program (558.99 KB) File FTC FOIA Status Report (July 2008) (63.64 KB)"
