["https://ftc.gov/business-guidance/advertising-marketing/advertising-marketing-basics"]
title = "Advertising and Marketing Basics | Federal Trade Commission"
description = "Under the law, claims in advertisements must be truthful, cannot be deceptive or unfair, and must be evidence-based. For some specialized products or services, additional rules may apply."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing Under the law, claims in advertisements must be truthful, cannot be deceptive or unfair, and must be evidence-based. For some specialized products or services, additional rules may apply. Featured Informing Businesses about the INFORM Consumers Act Business Guide to the FTC's Mail, Internet, or Telephone Order Merchandise Rule Plain Language Guidance Ads for Business Opportunities: How To Detect DeceptionPromoters of fraudulent business opportunities run ads where their targets are likely to see them: in daily and weekly newspapers, in magazines, and on the Internet. Advertising sales staff with a well-trained eye can recognize – and reject – ads promoting bogus promotions. Advertising FAQ's: A Guide for Small BusinessFocusing on federal truth-in-advertising standards, this A-to-Z primer is an essential resource for businesses of any size. Applying FTC Consumer Protection Standards in the Sale of Outdoor PlantsEven though the FTC has rescinded its Nursery Guides, established truth-in-advertising standards still apply to the sale of trees, shrubs, and other products used for outdoor planting. Industry members also should consider long-standing FTC guidance regarding products collected from the wild state. Avoid Fake-Degree Burns By Researching Academic CredentialsSome resumes list credentials — like a college degree or professional certification — that sound credible, but were bought from “diploma mills.” Human resources professionals need to educate themselves on the steps to take to suss out suspect degrees. Big Print. Little Print. What's the Deal?If the disclosure of information is necessary to prevent an ad from being deceptive, the disclosure must be clear and conspicuous. Read more about why fine print is not so fine in advertising and what you need to do to disclose the details of the deal. Business Guidance Concerning Multi-Level MarketingDo you have questions about multi-level marketing? The FTC staff has guidance to help members of the MLM industry apply core consumer protection principles to their business practices. Business Guide to the FTC's Mail, Internet, or Telephone Order Merchandise RuleDo you sell products by mail, by phone, or online? This publication discusses what the FTC's Mail Order Rule covers, offers how-to compliance advice, answers common questions, explains where to go for more information – and includes a copy of the Rule. Businessperson's Guide to Federal Warranty LawDo your product warranties comply with law? This guide explains the Magnuson-Moss Warranty Act, the federal law governing warranties on consumer products. CAN-SPAM Act: A Compliance Guide for BusinessIf you use email in your business, you need to know about the CAN-SPAM Act. The law establishes requirements for commercial messages and gives recipients the right to have you stop emailing them. The FTC enforces the CAN-SPAM Act and the accompanying CAN-SPAM Rule. Consumer Review Fairness Act: What Businesses Need to KnowThe Consumer Review Fairness Act protects consumers’ ability to share their honest opinions about a business’s products, services, or conduct in any forum – and that includes social media. The FTC has tips to help your company comply with the law. Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. FTC CARS Rule: Combating Auto Retail Scams – A Dealers GuideThe primary purpose of the FTC’s CARS Rule is to add truth and transparency to the car buying or leasing process by making it clear that certain deceptive or unfair practices are illegal – for example, bait-and-switch tactics, hidden charges, and other conduct that harms consumers and honest dealers. Why is it called the CARS Rule? Because the Rule is about Combating Auto Retail Scams that cost consumers billions of dollars each year and cause honest dealers to lose business. Informing Businesses about the INFORM Consumers ActIf your business is an online marketplace or a "high-volume third party seller" on one of those platforms, the INFORM Consumers Act requires certain information collection, verification, and disclosure requirements. Native Advertising: A Guide for BusinessesMarketers and publishers are using innovative methods to create, format, and deliver digital advertising. One form is “native advertising,” content that bears a similarity to the news, feature articles, product reviews, entertainment, and other material that surrounds it online. But as native advertising evolves, are consumers able to differentiate advertising from other content? Scams and Your Small Business: A Guide for Business This article is part of the FTC’s efforts to help small business owners avoid scams. It explains common scams that target small businesses and non-profit organizations, describes scammers’ tactics, and provides steps people can take to protect their company from scams. Copies can be ordered for free at ftc.gov/bulkorder. Screening Advertisements: A Guide for The MediaDo you know the buzz words that may be a tip-off to a rip-off? By spotting – and stopping – deceptive ads before they run in your publication or on your station, your sales staff can help maintain your reputation for accuracy. Selling a Work-at-Home or Other Business Opportunity? Revised Rule May Apply to YouIf you sell business opportunities, including work-at-home bizopps, find out how the FTC’s revised Business Opportunity Rule may apply to you. Avoid a compliance miscue by making required disclosures and steering clear of prohibited practices. Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? What Third Party Sellers Need to Know About the INFORM Consumers ActDo you sell products on online platforms? If you meet the definition of a "high-volume third party seller," the INFORM Consumers Act may impact your business. The FTC has more information about the law. Resources Health Products Compliance GuidanceCompanies must have appropriate substantiation to back up claims for health-related products. Through more than 50 examples, this guidance explains the how-tos of making sure you have scientific support. Related Blog Posts Level up: Tips for businesses from the FTC’s settlement with Genshin Impact developer HoYoverseJanuary 17, 2025 Becoming a gold star property manager: Lessons from the FTC’s case against GreystarJanuary 16, 2025 Food for thought: The FTC’s proposed settlement with GrubhubDecember 17, 2024 Getting to the bottom line: The FTC’s bipartisan Junk Fees Rule and your businessDecember 17, 2024 Click to Cancel: The FTC’s amended Negative Option Rule and what it means for your businessOctober 16, 2024 Legal Resources on Advertising and Marketing Basics Advisory Opinions Advisory Opinions Letter To Commercial Alert Concluding -- With Respect To A Type of Amplified Word of Mouth Marketing -- That The Staff Will Determine On A Case-By-Case Basis Whether Law Advisory Opinions Letter To Commercial Alert Applying Commission Policy To Determine On A Case-By-Case Basis Whether Particular Advertising Formats Such As Product Placements Are Deceptive Advisory Opinions Letter Responding To Complaint From Computer & Communications Industry Association Regarding Alleged Misrepresentations of Consumer Fair Use and Related Rights by Certain Advisory Opinions Letter Responding To Complaint From Campaign for a Commercial-Free Childhood Concerning the Advertising and Promotion of PG-13-Rated Movies To Children Advisory Opinions Sony Electronic's Proposal to Resell As “New” Returned Consumer Electronics Products Advisory Opinions Opinion 08-1 Advisory Opinions Opinion 09-1 Advisory Opinions Opinion 09-2 Advocacy Filings Advocacy Filings Samuel Levine Letter to Virginia Legislature on Junk Fees Advocacy Filings Samuel Levine Letter to New York Senate on Junk Fees Advocacy Filings BCP Staff Comment to U.S. Department of Education Concerning Proposed Regulations Protecting Postsecondary Students Cases Cases Handy Technologies Cases Lindsay Chevrolet, et al, FTC and State of Maryland v Cases Leader Automotive Group, et al., FTC and State of Illinois v. Cases DoNotPay Cases Invitation Homes Inc., FTC v. Cases Asbury Automotive Group, Inc., et al., In the Matter of Cases Coulter Motor Company and Gregory DePaola, FTC and State of Arizona v. Cases Career Step, LLC, FTC v. Cases Vroom, Inc. FTC v. Cases Adobe, Inc., U.S. v. Cases Cancer Recovery Foundation, Inc Cases H&R Block, In the Matter of Cases Traffic and Funnels, LLC., FTC v. Cases Lurn Cases ConsumerInfo.com, Inc. d/b/a Experian Consumer Services, U.S. v. (Experian II) Cases Celsius Network, Inc., et al., FTC v. Cases Publishers Clearing House, LLC (PCH), FTC v. Cases Stratics Networks Cases The Bountiful Company Cases Square One Development Group Inc., et al., U.S. and State of Wisconsin v. Cases DK Automation Cases Ygrene Energy Fund Inc., FTC v. Cases F & G International Group Holdings, LLC Cases Weber-Stephen Products, LLC Cases Treashonna P. Graham, et al, FTC and The State of Florida, v. Cases Financial Education Services Cases Warrior Trading, Inc., FTC v. Cases Napleton Auto Cases Intuit Inc., In the Matter of (TurboTax) Cases HomeAdvisor, In the Matter of Cases Electronic Payment Systems, In the Matter of Cases Fashion Nova, LLC, In the Matter of Cases Dun & Bradstreet, Inc., d/b/a D&B Cases MoviePass, Inc., In the Matter of Cases Wellco, Inc., FTC v. Cases Inmate Magazine Service, Inc. Cases Amazon Flex Cases Disruption Theory LLC (Inmate Call) Cases Traffic Jam Events, LLC, In the Matter of Cases Traffic Jam Events, LLC Cases F & G International Group Holdings, LLC Cases SPM Thermo-Shield, Inc. Cases Marc Ching, In the Matter of Cases Whole Leaf Organics Cases SLAC, Inc. Cases Federal-Mogul Motorparts LLC: In the Matter of Cases ZyCal Bioceuticals Healthcare Company, Inc. Cases Fleetcor Technologies Cases Nudge, LLC Cases Agora Financial LLC Cases Zurixx, LLC Cases The University of Phoenix, Inc. Cases Match Group, Inc. Cases LVTR LLC, In the Matter of Cases iBackPack of Texas, LLC Cases UrthBox, Inc., In the Matter of Cases Worldwide Executive Job Search Solutions, LLC Cases Sunkey Publishing and Fanmail.com Cases Veterans of America Cases Help the Vets, Inc. Cases MOBE Ltd., et al. Cases Pointbreak Media, LLC Cases Vision Solution Marketing LLC, et al. Cases Prime Sites, Inc. (Explore Talent) Cases Reservation Counter, LLC Cases AdoreMe, Inc. Cases Tarr Inc. Cases Victory Media, G.I. Jobs, and Military Friendly, In the Matter of Cases Pact, Inc. Cases NutriMost LLC Cases ABC Hispana Inc., et al. Cases XXL Impressions LLC / J2 Response L.L.P. / Synergixx, LLC Cases Asbury Automotive Group, Inc., In the Matter of Cases West-Herr Automotive Group, Inc., In the Matter of Cases CarMax, Inc., In the Matter of Cases NetSpend Corporation Cases DOTAuthority Cases Advertising Strategies, LLC, et al. Cases Laptop & Desktop Repair, LLC Cases Universal City Nissan, Inc., et al. Cases OMICS Group Inc. Cases Mars Petcare US, Inc