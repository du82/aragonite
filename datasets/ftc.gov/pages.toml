description = "If you sell jewelry, textiles, funeral services, or used cars, or are in industries with other FTC rules, consult resources to help streamline compliance."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Business Guidance Menu Business Guidance Advertising and Marketing Credit and Finance Privacy and Security By Industry Alcohol Appliances Automobiles Clothing and Textiles Finance Franchises, Business Opportunities, and Investments Funerals Human Resources Jewelry Real Estate and Mortgages Tobacco For Small Businesses Browse Business Guidance Resources Business Blog FTC compliance advice for companies covered by industry-specific rules. Members of the textile, appliance, jewelry, used car, or funeral businesses: Check out publications written with your sector in mind. AlcoholInformation about how the FTC addresses concerns about the effects of alcohol marketing on youth by conducting law enforcement investigations, promoting effective industry self-regulation, educating consumers about teens and drinking, promoting effective label disclosures, and coordinating with other federal agencies. AppliancesDoes your company sell appliances? Learn about the Energy Labeling Rule, light bulb labels, and other rules that apply to marketers and manufacturers of appliances. AutomobilesIf your business sells automobiles, fuel, or related products, have you kept up to date on the rules and laws that could affect your company? The FTC has resources discussing the Used Car Rule, labeling guidelines for alternative fueled vehicles and alternatives fuels, how the FTC’s Privacy Rule applies to auto dealers – and other topics of interest to the automotive industry. Clothing and TextilesHow to comply with requirements for labeling products made of cashmere, cotton, down, feather, fur, wool, rayon made from bamboo or other materials; attaching care instructions to garments; making truthful “Made in the USA” claims, and more. FinanceLearn about compliance responsibilities for businesses that provide credit, loans, or other financial services. Franchises, Business Opportunities, and InvestmentsFor companies selling franchises and business opportunities – and entrepreneurs in the market – the FTC's Franchise Rule and Business Opportunity Rule mandate disclosures and offer buyers certain protections. In addition, the FTC has resources to help people spot business opportunity and investment scams and avoid franchise taboos. FuneralsIf your company is in the funeral industry, the FTC has resources to make it easier to comply with the Funeral Rule and other consumer protection standards. Human ResourcesPractical information for human resources and administrative professionals about protecting personal data in your company's possession, spotting B2B fraud, responding to identity theft, complying with the Fair Credit Reporting Act in the employment process – and more. JewelryIf you manufacture or sell jewelry, the FTC has resources to help you comply with the Jewelry Guides. In addition, jewelry retailers can find information especially for their businesses. Real Estate and MortgagesIf your real estate or mortgage-related business is within the jurisdiction of the FTC, it's important to see to it that your advertising, marketing materials, and day-to-day practices meet legal standards. TobaccoCompanies that advertise or sell tobacco products are subject to specific laws and rules about how cigarettes, cigars, and smokeless tobacco may be marketed. // Load Query parameters using a name. const urlParam = function (name) { let results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.search); return (results !== null && results[1]) ? results[1] : false; } // Check for a url parameter and set a default value. const checkUrlParam = function (ElementId) { let customFilter = document.getElementById(ElementId); if (customFilter) { let filterName = customFilter.getAttribute('name'); // Set a clas