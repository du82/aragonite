full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Image David B Robbins, Executive DirectorThe Office of the Executive Director (OED) is responsible for the administration and management of the Commission. The Executive Director reports directly to the Chair of the Commission. OED is comprised of four organizations, which manage the Commission’s human capital, information technology, financial management, and administrative services. OED works closely with the law enforcement bureaus and other FTC offices to ensure the efficient and effective use of agency resources through, among other things, participating in strategic planning, and assessing the management and resource implications of proposed actions. We are committed to excellence in providing quality and timely services to the agency and American consumers.FTC employees will never demand money, make threats, tell you to transfer money, or promise to help you get money or a prize. Anyone who does is a scammer. Report them to the FTC at ReportFraud.ftc.gov."
