["https://ftc.gov/business-guidance/advertising-marketing/health-claims"]
title = "Health Claims | Federal Trade Commission"
description = "Companies must support their advertising claims with solid proof. This is especially true for businesses that market food, over-the-counter drugs, dietary supplements, contact lenses, and other health-related products."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing Companies must support their advertising claims with solid proof. This is especially true for businesses that market food, over-the-counter drugs, dietary supplements, contact lenses, and other health-related products. Featured Complying with the Eyeglass Rule Health Products Compliance Guidance Plain Language Guidance Complying with the Eyeglass RuleThe Federal Trade Commission enforces the Eyeglass Rule. It requires eye doctors – ophthalmologists and optometrists – to give patients a copy of their prescription, whether they ask for it or not and before offering to sell eyeglasses. It’s the law. Here are questions and answers to help you comply with the Eyeglass Rule. FAQs: Complying with the Contact Lens RuleThe Federal Trade Commission enforces the Contact Lens Rule (amended in 2020), which requires eye care providers to give customers copies of their prescriptions. Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. Gut Check: A Reference Guide for Media on Spotting False Weight Loss ClaimsTo help media outlets spot false weight loss representations — "gut check" claims — the FTC has compiled a list of seven advertising claims that are likely to be a tip-off to deception. Take the quiz to see if you can trust your gut to spot them. Health Products Compliance GuidanceCompanies must have appropriate substantiation to back up claims for health-related products. Through more than 50 examples, this guidance explains the how-tos of making sure you have scientific support. Marketing of Refractive Eye Care Surgery: Guidance for Eye Care ProvidersThis guidance for eye care providers on marketing Lasik and alternative laser refractive procedures, known as surface ablation techniques, explains the requirements of Section 5 of the FTC Act that apply to the promotion of these procedures. Mobile Health App Developers: FTC Best PracticesWhen developing a health app, sound privacy and security practices are key to consumer confidence. Here are some best practices to help you build privacy and security into your app. These practices also can help you comply with the FTC Act and other federal laws and regulations. Mobile Health App Interactive ToolYou’re developing a health app for mobile devices and you want to know which federal laws apply. Check out this interactive tool. Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? The Contact Lens Rule: A Guide for Prescribers and SellersConsumers have the right to shop around when buying contact lenses — and prescribers and sellers have specific legal obligations. Are you complying with the Contact Lens Rule? Voluntary Guidelines for Providers of Weight Loss Products or ServicesThese guidelines, developed by a panel of weight management companies, medical professionals, and consumer protection groups, can help you give consumers the accurate information they need when evaluating weight loss products and services. Resources Health Products Compliance GuidanceCompanies must have appropriate substantiation to back up claims for health-related products. Through more than 50 examples, this guidance explains the how-tos of making sure you have scientific support. Related Blog Posts Warning to companies selling cannabis edibles packaged like snacks popular with kids: Put safety over salesJuly 16, 2024 The specs on specs: What eye doctors need to know about the FTC’s revised Eyeglass RuleJune 27, 2024 Small business people are among those getting $100 million back due to FTC action challenging Benefytt Technologies’ sham health plansMarch 19, 2024 The DNA of privacy and the privacy of DNAJanuary 5, 2024 FTC says what was “invisible” about Invisible Mask was proof for its anti-virus claimsOctober 24, 2023 Legal Resources on Health Claims Advisory Opinions Advisory Opinions Letter to Council for Responsible Nutrition Regarding ConsumerLab.com, LLC and its Product Review and Voluntary Certification Programs for Testing Dietary Supplements and Similar Advocacy Filings Advocacy Filings Possible Anticompetitive Barriers to E-Commerce: Contact Lenses: A Report from the Staff of the FTC Cases Cases Legion Media LLC, et al., FTC v. Cases Dalal A. Akoury d/b/a AWAREmed, et al., U.S. v. Cases doTERRA - Wong Cases doTERRA - Busch Cases doTERRA - Bacot Cases ALG-Health LLC, et al., U.S. v. Cases Benefytt Technologies, et al., FTC v. Cases Gravity Defyer, FTC v. Cases R360, FTC v. Cases B4B Corp. Cases Vision Path, Inc., d/b/a Hubble Contacts, U.S. v. Cases Xlear, Inc. Cases Stem Cell Institute of America, LLC Cases Kushly Industries LLC, In the Matter of Cases Quickwork LLC and Eric A. Nepute Cases BASF SE, In the Matter of Cases Steves Distributing, LLC, In the Matter of Cases Reef Industries, In the Matter of Cases CBD Meds, Inc., In the Matter of Cases HempmeCBD, In the Matter of Cases Epichouse LLC, (First Class Herbalist CBD), In the Matter of Cases Bionatrol Health, LLC, In the Matter of Cases H