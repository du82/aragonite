full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Jake Denton , Chief Technology OfficerThe Office of Technology (OT) assists the Commission by: (1) strengthening and supporting law enforcement investigations and actions; (2) advising and engaging with FTC staff and the Commission on policy and research initiatives; and (3) engaging with the public and relevant experts to understand trends and to advance the Commission’s work. OT technologists have deep expertise across a range of specialized fields. This includes practitioners and subject matter experts across security and software engineering, data science, artificial intelligence, machine learning, human-computer interaction design, and social science research relating to technology. The Office will facilitate the onboarding of technologists with a wider array of expert training, formalize the efficient deployment of these expert resources across the agency, and promote collaboration and coordination among technologists working across the agency."
