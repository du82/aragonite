title = "Bureau of Economics | Federal Trade Commission"
description = "The FTC’s Bureau of Economics helps the FTC evaluate the economic impact of its actions by providing economic analysis for competition and consumer protection investigations and rulemakings, and an"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM The FTC’s Bureau of Economics helps the FTC evaluate the economic impact of its actions by providing economic analysis for competition and consumer protection investigations and rulemakings, and analyzing the economic impact of government regulations on businesses and consumers. Featured Economic Research The Bureau conducts economic studies and other research related to the missions of the FTC. Visit our Economics Research page for more information on this research, including the FTC Bureau of Economics Working Paper Series. Seminar Series The Bureau of Economics hosts a seminar series where economists present current research. See our current seminar schedule. Reports Merger Analysis with Latent Price February 20, 2025 | 12:00PM View all Reports Latest Blog Posts Blog Post New Bureau of Economics Conflicts Disclosure Policy Aviv Nevo and Ted Rosenbaum December 10, 2024 View all Competition Matters blog posts More Information Bureau of Economics Staff Do you want to know more about the economists, financial analysts, and research analysts working here at the FTC? Take a look at our staff bios. Careers in the Bureau The Bureau of Economics (BE) has a proud tradition of providing scientifically sound, data-driven economic analysis that informs antitrust, consumer protection, and business regulation policy in the US. With a staff of approximately 80 PhD-holding applied microeconomists, BE plays an essential role in virtually all aspects of the FTC’s mission. Learn more about career opportunities in the Bureau. There also are opportunities for Research Analysts within the Bureau. Call for Papers The FTC's Bureau of Economics will host its Conference on Marketing and Public Policy on October 18, 2024 in Washington, D.C. The conference will feature research paper sessions as well as a panel discussion including both policymakers and academic experts. Learn about the submission requirements and much more. Seventeenth Annual FTC Microeconomics Conference (November 14-15, 2024) The Federal Trade Commission's Bureau of Economics and the Tobin Center for Economic Policy at Yale will host a two-day conference to bring together scholars working in areas related to the FTC's antitrust, consumer protection, and public policy missions."
