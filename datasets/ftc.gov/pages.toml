["https://ftc.gov/about-ftc/bureaus-offices/bureau-consumer-protection"]
title = "Bureau of Consumer Protection | Federal Trade Commission"
description = "The FTC’s Bureau of Consumer Protection stops unfair, deceptive and fraudulent business practices by collecting reports from consumers and conducting investigations, suing companies and people that"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM The FTC’s Bureau of Consumer Protection stops unfair, deceptive and fraudulent business practices by collecting reports from consumers and conducting investigations, suing companies and people that break the law, developing rules to maintain a fair marketplace, and educating consumers and businesses about their rights and responsibilities. Featured Fighting Scams and Fraud As the nation’s consumer protection agency, the FTC takes reports about scammers that cheat people out of money and businesses that don’t make good on their promises. We share these reports with our law enforcement partners and use them to investigate fraud and eliminate unfair business practices. Each year, the FTC also releases a report with information about the number and type of reports we receive. Robocalls People are getting more robocalls than ever. Technology is the reason: Companies are using auto-dialers that can send out thousands of phone calls every minute for an incredibly low cost. So what’s the FTC doing to stop these illegal robocallers? And what can you do to limit the number of robocalls you receive? Find out. Keep up with the latest News Press Release FTC Launches Joint Labor Task Force to Protect American Workers February 26, 2025 Press Release FTC Announces Refund Claims Process for Avast Customers Impacted by Deceptive Privacy Claims February 24, 2025 More News Latest in Consumer Protection in the Legal Library Seek CapitalCase | February 26, 2025 AvastCase | February 24, 2025 Sleep Holdco, LLCClosing Letter | February 21, 2025 Asbury Automotive Group, Inc., et al., In the Matter ofCase | February 21, 2025 C. Mufarrige Ltr. to Counsel re Weaponization of the Federal Government EOLegal Public Statement | February 20, 2025 Browse the Legal Library Reports Rotational Health Warnings for Cigarettes (January 2023 - March 2023) January 1, 2023 | 12:00PM View all Reports Latest Blog Posts Business Blog Level up: Tips for businesses from the FTC’s settlement with Genshin Impact developer HoYoverse Julia Solomon Ensor January 17, 2025 View all Competition Matters blog posts Upcoming Events May13 Consumer Basics for Your Patrons: consumer.gov Tuesday, May 13, 2025 | 2:00PM More Events More Information Tips and Advice for Consumers Want to order a copy of your free credit report? Or find out how to get a refund for a defective product? Maybe you’re shopping for a car, or investigating a money-making opportunity. The Bureau of Consumer Protection provides tips and advice about money and credit, homes and mortgages, health and fitness, jobs and making money, and privacy and identity. Getting Refunds for Consumers The FTC sues companies that make deceptive claims about their products or services. These lawsuits sometimes result in refunds for the people affected. Want more information about the FTC’s refunds program? Take a look at recent FTC cases that resulted in refunds. Resources for Consumer Advocates If you work with traditionally underserved communities — whether you’re a legal aid provider, a TESOL or other teacher, or an advocate — the FTC’s resources can help. You can use our materials in direct client services, language classes, financial literacy or life skills programs, workshops, and credit and debt counseling sessions. BCP Business Guidance BCP’s Business Center provides plain language guidance to help businesses understand their responsibilities and comply with the law. Browse by topic — Advertising & Marketing, Credit & Finance, Privacy & Security — or by industry to find what you need. Bureau of Consumer Protection Offices Eight divisions and eight regional offices make up the Bureau of Consumer Protection. Find out how each office contributes to the Bureau’s mission."
