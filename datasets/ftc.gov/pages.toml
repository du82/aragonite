["https://ftc.gov/business-guidance/advertising-marketing/online-advertising-marketing"]
title = "Online Advertising and Marketing | Federal Trade Commission"
description = """
The Internet connects marketers to customers across the country and around the world. If you advertise online, remember the rules and guidelines that protect consumers also help businesses by maintaining the credibility of the Internet as a marketing medium. In addition, truth-in-advertising standards apply if you sell computers, software, apps, or other products or services. The FTC also enforces the INFORM Consumers Act, which requires online marketplaces to verify the identity of high-volume third-party sellers on their platforms and make it easier for consumers to report suspicious conduct.(Question about kids' online privacy privacy? Read about the Children's Online Privacy Protection Act.)

  Image"""
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing The Internet connects marketers to customers across the country and around the world. If you advertise online, remember the rules and guidelines that protect consumers also help businesses by maintaining the credibility of the Internet as a marketing medium. In addition, truth-in-advertising standards apply if you sell computers, software, apps, or other products or services. The FTC also enforces the INFORM Consumers Act, which requires online marketplaces to verify the identity of high-volume third-party sellers on their platforms and make it easier for consumers to report suspicious conduct.(Question about kids' online privacy privacy? Read about the Children's Online Privacy Protection Act.) Image Featured What Third Party Sellers Need to Know About the INFORM Consumers Act CAN-SPAM Act: A Compliance Guide for Business Plain Language Guidance .com Disclosures: How to Make Effective Disclosures in Digital AdvertisingWhether advertising in print, on radio or TV, or on the Internet, it’s important to disclose the details of the deal up front. This publication offers practical tips on how to make effective disclosures online. Business Guide to the FTC's Mail, Internet, or Telephone Order Merchandise RuleDo you sell products by mail, by phone, or online? This publication discusses what the FTC's Mail Order Rule covers, offers how-to compliance advice, answers common questions, explains where to go for more information – and includes a copy of the Rule. CAN-SPAM Act: A Compliance Guide for BusinessIf you use email in your business, you need to know about the CAN-SPAM Act. The law establishes requirements for commercial messages and gives recipients the right to have you stop emailing them. The FTC enforces the CAN-SPAM Act and the accompanying CAN-SPAM Rule. Consumer Review Fairness Act: What Businesses Need to KnowThe Consumer Review Fairness Act protects consumers’ ability to share their honest opinions about a business’s products, services, or conduct in any forum – and that includes social media. The FTC has tips to help your company comply with the law. Electronic Commerce: Selling Internationally A Guide for BusinessesBy selling your goods online, you can potentially reach customers in every country of the world. But this can pose challenges if you’ve never shipped overseas. These guidelines answer questions about taxes, duties, customs laws, and more. Featuring Online Customer Reviews: A Guide for PlatformsPeople who rely on online reviews of companies, products, and services should be getting an accurate picture of what other consumers think. If you operate a website or platform that features reviews, have processes in place to ensure those reviews truly reflect the feedback received from genuine customers. FTC's Endorsement Guides: What People Are AskingAnswers to questions people are asking about the FTC’s Endorsement Guides, including information about disclosing material connections between advertisers and endorsers. The brochure also addresses how those established consumer protection principles apply in social media and influencer marketing. Informing Businesses about the INFORM Consumers ActIf your business is an online marketplace or a "high-volume third party seller" on one of those platforms, the INFORM Consumers Act requires certain information collection, verification, and disclosure requirements. Marketing Your Mobile App: Get It Right from the StartAttention app developers! Basic truth-in-advertising and privacy principles apply to your product. It’s important to give the straight story about what your app can do and be transparent about your privacy practices. This start-from-scratch publication from the FTC reminds you to consider your choices from the user's perspective. Native Advertising: A Guide for BusinessesMarketers and publishers are using innovative methods to create, format, and deliver digital advertising. One form is “native advertising,” content that bears a similarity to the news, feature articles, product reviews, entertainment, and other material that surrounds it online. But as native advertising evolves, are consumers able to differentiate advertising from other content? Online Charitable Giving Portals Online charitable giving portals must ensure that their efforts to provide more giving options do not inadvertently create donor confusion or violate advertising law principles. Here’s some guidance on how to do that. Scams and Your Small Business: A Guide for Business This article is part of the FTC’s efforts to help small business owners avoid scams. It explains common scams that target small businesses and non-profit organizations, describes scammers’ tactics, and provides steps people can take to protect their company from scams. Copies can be ordered for free at ftc.gov/bulkorder. Selling on the Internet: Prompt Delivery RulesIf you’re selling goods or services online, it pays to know the ground rules for making promises about shipments, notifying consumers about unexpected delays, and refunding consumers' money. Soliciting and Paying for Online Reviews: A Guide for MarketersConsumers rely on online reviews in deciding what to buy. But some businesses abuse that trust by writing or procuring fake reviews or by paying supposedly independent websites for good rankings. Is your company taking steps to avoid that kind of deception and manipulation? What Third Party Sellers Need to Know About the INFORM Consumers ActDo you sell products on online platforms? If you meet the definition of a "high-volume third party seller," the INFORM Consumers Act may impact your business. The FTC has more information about the law. Resources .com Disclosures: How to Make Effective Disclosures in Digital AdvertisingWhether advertising in print, on radio or TV, or on the Internet, it’s important to disclose the details of the deal up front. This publication offers practical tips on how to make effective disclosures online. Related Blog Posts Level up: Tips for businesses from the FTC’s settlement with Genshin Impact developer HoYoverseJanuary 17, 2025 Getting to the bottom line: The FTC’s bipartisan Junk Fees Rule and your businessDecember 17, 2024 No shortcuts to five stars: Lessons from the FTC’s settlement with SitejabberNovember 6, 2024 Click to Cancel: The FTC’s amended Negative Option Rule and what it means for your businessOctober 16, 2024 When “IP” stands for illegal practices: Protecting your business from trademark deceptionSeptember 13, 2024 Legal Resources on Online Advertising and Marketing Advisory Opinions Advisory Opinions Letter to the DMA Regarding Email Messages Containing Content From Multiple Advertisers When One of the Advertisers Has the Recipient's Affirmative Consent Advisory Opinions Opinion 09-1 Cases Cases Handy Technologies Cases Leader Automotive Group, et al., FTC and State of Illinois v. Cases Ecom Genie Cases Care.com, Inc., FTC v. Cases CarShield Cases Career Step, LLC, FTC v. Cases Razer Cases H&R Block, In the Matter of Cases InMarket Media, LLC Cases X-Mode Social, Inc. Cases Traffic and Funnels, LLC., FTC v. Cases Lurn Cases Automators Cases Vision Online Inc. and Ganadores IBR, Inc., FTC v. Cases Nexway, Inc., In the Matter of Cases The Bountiful Company Cases GoodRx Holdings, Inc. Cases DK Automation Cases Roomster Corp Cases Treashonna P. Graham, et al, FTC and The State of Florida, v. Cases Gravity Defyer, FTC v. Cases Financial Education Services Cases B4B Corp. Cases Kuuhuub, Inc., et al., U.S. v.