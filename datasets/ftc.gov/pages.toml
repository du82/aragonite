title = "Bureau of Competition | Federal Trade Commission"
description = "The FTC’s Bureau of Competition enforces the nation's antitrust laws, which form the foundation of our free market economy."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM The FTC’s Bureau of Competition enforces the nation's antitrust laws, which form the foundation of our free market economy. The antitrust laws promote the interests of consumers; they support unfettered markets and result in lower prices and more choices. Featured Inside the Bureau of Competition Meet our managers and read about the work of the Bureau. Keep up with the latest News Press Release FTC Approves Final Order Requiring Building Service Contractor to Stop Enforcing a No-Hire Agreement February 26, 2025 Press Release FTC Launches Joint Labor Task Force to Protect American Workers February 26, 2025 More News Latest in Competition in the Legal Library Caremark Rx, Zinc Health Services, et al., In the Matter of (Insulin) Tempur Sealy International, Inc. and Mattress Firm Group Inc., In the Matter of Chairman Ferguson Memo re Merger Guidelines Clarke Edwards Letter to Indiana State Senate Regarding Senate Bill 119 Statement Regarding Request for Public Comment on Protecting Workers from Illegal Business Practices Reports Economics at the FTC: Non-Horizontal Mergers, the CARS Rule, and the Non-Compete Rule November 1, 2024 | 12:00PM View all Reports Latest Blog Posts Competition Matters New HSR thresholds and filing fees for 2025 February 6, 2025 View all Competition Matters blog posts More Information Competition in Health Care Markets Competition in health care markets benefits consumers by helping contain costs, improve quality, and encourage innovation. Read more about the FTC’s efforts to promote competition in health care markets. Monitoring Energy Markets The energy industry plays a crucial role in our economy. The FTC devotes significant resources to monitoring energy markets, and takes action to stop or prevent anticompetitive mergers and conduct that could raise energy prices. Competition Enforcement Stats The Bureau maintains statistics on the FTC’s competition enforcement actions involving anticompetitive mergers and conduct. To find FTC cases, use the improved Search function with new drop-down menus and keyword searching."
