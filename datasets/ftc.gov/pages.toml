["https://ftc.gov/enforcement/competition-matters/2025/02/new-hsr-thresholds-filing-fees-2025"]
title = "New HSR thresholds and filing fees for 2025 | Federal Trade Commission"
description = "Each year, the Commission adjusts the minimum dollar jurisdictional thresholds that determine reportability under the Hart-Scott-Rodino Act based on the change in gross national product in the prio"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Each year, the Commission adjusts the minimum dollar jurisdictional thresholds that determine reportability under the Hart-Scott-Rodino Act based on the change in gross national product in the prior year. The 2023 Consolidated Appropriations Act created filing fee tiers with filing fees. The thresholds for these filing fees, as well as the fee amounts, are also adjusted annually along with the jurisdictional thresholds.The Commission recently announced the updated jurisdictional thresholds and the updated fee schedule, published at 90 FR 7697, both of which will become effective on February 21, 2025. The following rules of thumb should help parties determine the relevant thresholds and any resulting reporting obligations that apply based on when the filing is made, when the transaction closes, and when the thresholds adjust. They should also help parties determine the correct filing fee.Rule 1: The correct threshold for determining reportability is the one in effect at the time of closing.The most significant threshold in determining reportability is the minimum size of transaction threshold. This is often referred to as the “$50 million (as adjusted)” threshold because it started at $50 million and is now adjusted annually. For 2025, that threshold will be $126.4 million. To determine reportability for a deal that will close around the time that the new threshold is effective, look to what the $50 million (as adjusted) threshold will be at the time of closing. For example, a deal valued at $122 million which will close on or after February 21, 2025, is not reportable because it is below the new minimum size of transaction threshold, even though it exceeds the current threshold of $119.5 million.Here are the new jurisdictional thresholds, effective on February 21, 2025:ORIGINAL THRESHOLDADJUSTED THRESHOLD$10 million$25.3 million$50 million$126.4 million$100 million$252.9 million$110 million$278.2 million$200 million$505.8 million$500 million$1.264 billion$1 billion$2.529 billionRule 2: The filing fee is determined by the value of the transaction at the time of filing.If you determine that a transaction is reportable, the filing fee should be based on the filing fee threshold that is in effect when the waiting period begins (which is in most cases, the time of initial filing).Here are the new filing fee thresholds, as well as the adjusted fee amounts, revised in accordance with the 2023 Consolidated Appropriations Act and effective on February 21, 2025:ORIGINAL FILING FEEADJUSTED FILING FEESIZE OF TRANSACTION$30,000$30,000less than $179.4 million$100,000$105,000not less than $179.4 million but less than $555.5 million$250,000$265,000not less than $555.5 million but less than $1.111 billion$400,000$425,000not less than $1.111 billion but less than $2.222 billion$800,000$850,000not less than $2.222 billion but less than $5.555 billion$2,250,000$2,390,000$5.555 billion or moreRule 3: Notification thresholds for subsequent purchases adjust yearly, too.The HSR Rules contain additional notification thresholds that relieve parties of the burden of making another filing every time additional voting shares of the same person are acquired. So, when HSR notification is filed, the acquiring person has one year from the end of the waiting period to cross the threshold stated in its HSR filing. Under Section 802.21, you must cross the threshold stated in the filing within one year after the end or termination of the waiting period, or you will have to file a new HSR notification in order to cross that threshold. Section 802.21 also specifies that once the filed-for waiting period ends or terminates, you can acquire up to the next threshold over the next five years without filing again.Here’s how this works. If you file on January 28, 2025, for a $127 million voting securities acquisition that will close after February 21, 2025, you should file to cross the $126.4 million threshold because that is the $50 million (as adjusted) threshold in effect at the time of closing (See Rule 1) and pay a $30,000 fee, the filing fee in effect at the time you file. You then have one year from the end of the waiting period to cross the $126.4 million threshold, even though the $50 million (as adjusted) threshold may be higher next year when the thresholds adjust again.The next relevant threshold is the “$100 million (as adjusted)” threshold (so called because it started as $100 million and is now adjusted annually). So, after the end of the waiting period for the filing to cross the $126.4 million threshold, you then have five years to acquire up to the next notification threshold -- in this case, the $100 million (as adjusted) threshold -- without an additional HSR filing. In each subsequent year of the five-year period under Section 802.21, that threshold will adjust and you always look to the revised threshold in effect at the time. The revised $100 million (as adjusted) threshold for 2025 will be $252.9 million, but in 2026, it will likely be higher and you would look to the higher 2026 figure for evaluating additional acquisitions at that time.As always, contact the PNO with specific questions regarding the HSR rules. Tags: Competition Bureau of Competition Hart-Scott-Rodino Act (HSR)"
