["https://ftc.gov/business-guidance/advertising-marketing"]
title = "Advertising and Marketing | Federal Trade Commission"
description = "Resources to help you comply with FTC truth-in-advertising standards, including how to support your claims with solid proof."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Business Guidance Menu Business Guidance Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing Credit and Finance Privacy and Security By Industry For Small Businesses Browse Business Guidance Resources Business Blog Advertising and Marketing BasicsUnder the law, claims in advertisements must be truthful, cannot be deceptive or unfair, and must be evidence-based. For some specialized products or services, additional rules may apply. ChildrenIf you advertise directly to children or market kid-related products to their parents, it’s important to comply with truth-in-advertising standards. (Questions about kids’ privacy? Check out the FTC's resources about COPPA, the Children’s Online Privacy Protection Act. The FTC also has a special page about food advertising to children and adolescents.) Endorsements, Influencers, and ReviewsIf you use consumer reviews or endorsements in your marketing, are you both meeting the standards of the FTC Act and complying with the specific prohibitions of the Rule on the Use of Consumer Reviews and Testimonials? What about the FTC's Guides Concerning Use of Endorsements and Testimonials in Advertising (Endorsement Guides), revised in 2023? Get plain language guidance from the FTC related to reviews, social media influencers, and for complying with the Consumer Review Fairness Act. Environmental MarketingCompanies are offering consumers an ever-growing assortment of “green” options. But whether your environmental claims are about the product or the packaging, you'll need competent and reliable scientific evidence to support what you say. Find out more by consulting the FTC’s revised Green Guides. Have you spotted what you think might be a deceptive claim or practice? File a complaint. Health ClaimsCompanies must support their advertising claims with solid proof. This is especially true for businesses that market food, over-the-counter drugs, dietary supplements, contact lenses, and other health-related products. Made in USADo you promote your products as “Made in the USA”? Under the law, some products must disclose U.S. content. For others, manufacturers and marketers who choose to make claims about the amount of U.S. content need to know about the FTC’s Made in USA Labeling Rule and Enforcement Policy Statement on U.S. Origin Claims. Is your company up on what's required? Online Advertising and MarketingThe Internet connects marketers to customers across the country and around the world. If you advertise online, remember the rules and guidelines that protect consumers also help businesses by maintaining the credibility of the Internet as a marketing medium. In addition, truth-in-advertising standards apply if you sell computers, software, apps, or other products or services. The FTC also enforces the INFORM Consumers Act, which requires online marketplaces to verify the identity of high-volume third-party sellers on their platforms and make it easier for consumers to report suspicious conduct.(Question about kids' online privacy privacy? Read about the Children's Online Privacy Protection Act.) Image TelemarketingThe FTC’s Telemarketing Sales Rule helps protect consumers from fraudulent telemarketing calls and gives them certain protections under the National Do Not Call Registry. Companies also need to be familiar with rules banning most forms of robocalling. If you or someone working on your behalf is telemarketing products or services, know the dos and don’ts before you plan your strategy. // Load Query parameters using a name. const urlParam = function (name) { let results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.search); return (results !== null && results[1]) ? results[1] : false; } // Check for a url parameter and set a default value. const checkUrlParam = function (ElementId) { let customFilter = document.getElementById(ElementId); if (customFilter) { let filterName = customFilter.getAttribute('name'); // Set a class on the body element. document.body.classList.add('js-alt-edit--' + filterName); if (urlParam(filterName)) { customFilter.value = urlParam(filterName).replace(/(\+)/g, ' '); } } } // Set Large Search value on load. checkUrlParam('alt-edit--search'); // Set Items per page value on load. checkUrlParam('alt-edit--items-per-page'); // Set Sort By value on load. checkUrlParam('alt-edit--sort'); document.body.classList.add('js-alt-filters--enabled'); Return to top'''
