full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Business Guidance Menu Business Guidance Advertising and Marketing Credit and Finance Credit and Loans Debt Debt Collection FinTech Mortgages Payments and Billing Privacy and Security By Industry For Small Businesses Browse Business Guidance Resources Business Blog Credit and LoansIf you extend credit to consumers, are in the business of offering loans, or help companies that do, know your compliance responsibilities. (Looking for information about credit reports or consumer reports? Visit Credit Reporting.) DebtIf you market products or services promising to help consumers with their debts – or assist companies that do – are you up on the rules and laws that apply to your business? (For resources related to the Fair Debt Collection Practices Act, visit Debt Collection.) Debt CollectionThe Fair Debt Collection Practices Act protects consumers from abusive or harassing treatment by debt collectors and establishes guidelines for the industry. Is your company complying with the law? FinTechFinTech describes the emerging marketplace of new financial technologies. Even as companies innovate in the products they offer and how they offer them, established consumer protection principles apply. Keep up on FinTech developments at the FTC. MortgagesThe FTC enforces laws that protect consumers from deceptive mortgage practices by certain kinds of lenders. The FTC also takes action when companies use illegal tactics directed to people facing foreclosure. If your company is within the jurisdiction of the FTC, are you complying with the law? Payments and BillingUnder the law, businesses must take steps to ensure that charges to customers' credit cards, debit cards, phone bills, and other accounts are authorized. Those principles apply to mobile payments, too. It's also illegal to bill people for negative options, automatic shipments, or continuity programs without their express consent. Does your company process payments for others? There are compliance standards you need to meet. Find out more about resources from the FTC. // Load Query parameters using a name. const urlParam = function (name) { let results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.search); return (results !== null && results[1]) ? results[1] : false; } // Check for a url parameter and set a default value. const checkUrlParam = function (ElementId) { let customFilter = document.getElementById(ElementId); if (customFilter) { let filterName = customFilter.getAttribute('name'); // Set a class on the body element. document.body.classList.add('js-alt-edit--' + filterName); if (urlParam(filterName)) { customFilter.value = urlParam(filterName).replace(/(\+)/g, ' '); } } } // Set Large Search value on load. checkUrlParam('alt-edit--search'); // Set Items per page value on load. checkUrlParam('alt-edit--items-per-page'); // Set Sort By value on load. checkUrlParam('alt-edit--sort'); document.body.classList.add('js-alt-filters--enabled'); Return to top'''
