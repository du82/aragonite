title = "Children's Privacy | Federal Trade Commission"
description = "The Children’s Online Privacy Protection Act (COPPA) gives parents control over what information websites can collect from their kids. The COPPA Rule puts additional protections in place and streamlines other procedures that companies covered by the rule need to follow. The COPPA FAQs can help keep your company COPPA compliant. Learn about the COPPA Safe Harbor Program and about organizations the FTC has approved to implement safe harbor programs. You can also get information about ways to get verifiable parental consent– including new methods the Commission has approved – and the process for seeking approval for new methods."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Privacy and Security Menu Privacy and Security Children's Privacy Health Privacy Consumer Privacy Credit Reporting Data Security Gramm-Leach-Bliley Act Red Flags Rule Data Privacy Framework Privacy Shield U.S.-EU Safe Harbor Framework Tech The Children’s Online Privacy Protection Act (COPPA) gives parents control over what information websites can collect from their kids. The COPPA Rule puts additional protections in place and streamlines other procedures that companies covered by the rule need to follow. The COPPA FAQs can help keep your company COPPA compliant. Learn about the COPPA Safe Harbor Program and about organizations the FTC has approved to implement safe harbor programs. You can also get information about ways to get verifiable parental consent– including new methods the Commission has approved – and the process for seeking approval for new methods. Featured Complying with COPPA: Frequently Asked Questions Plain Language Guidance Children's Online Privacy Protection Rule: Not Just for Kids' SitesThe Children’s Online Privacy Protection Act (COPPA) applies to websites for kids, but it also may apply to sites aimed at general audiences. Read this revised publication to find out when your site is subject to COPPA. Children’s Online Privacy Protection Rule: A Six-Step Compliance Plan for Your BusinessA step-by-step plan for determining if your company is covered by COPPA — and how to comply with the Rule. Complying with COPPA: Frequently Asked QuestionsDo you have a question about COPPA, the Children's Online Privacy Protection Act Rule? Here are answers from FTC staff to help your business comply with COPPA. Resources Complying with COPPA: Frequently Asked Questions A GUIDE FOR BUSINESS AND PARENTS 