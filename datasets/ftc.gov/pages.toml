full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Credit and Finance Menu Credit and Finance Credit and Loans Debt Debt Collection FinTech Mortgages Payments and Billing If you extend credit to consumers, are in the business of offering loans, or help companies that do, know your compliance responsibilities. (Looking for information about credit reports or consumer reports? Visit Credit Reporting.) Featured Getting Business Credit Plain Language Guidance Advertising Consumer LeasesDoes your company advertise consumer leases? This publication focuses on your legal obligations under the Consumer Leasing Act and Regulation M. Complying with the Credit Practices RuleIf your company is a creditor subject to FTC jurisdiction, the Credit Practices Rules applies to you. Read this guide to find out what the Rule requires and what transactions are covered. Getting Business CreditThinking about starting your own business or expanding the one you own? When you shop for a loan or line of credit, the law protects you against discrimination. The Equal Credit Opportunity Act prohibits creditors from denying you a loan based on reasons that have nothing to do with your credit-worthiness. New Rules on Electronic Payments Lower Costs for RetailersIf your business accepts payment by credit or debit card, new rules on electronic payments may help you lower your costs. Using Consumer Reports: What Landlords Need to KnowLandlords, property managers, or other housing providers: If you run tenant background checks using companies that compile background information, consider your legal responsibilities under the Fair Credit Reporting Act. Related Blog Posts Car dealers included add-ons without consumers’ consent and discriminated against Black and Latino buyers, alleges FTCAugust 20,