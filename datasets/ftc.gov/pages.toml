full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Cases and Proceedings Seek Capital The Federal Trade Commission is taking action against Seek Capital and its founder and CEO, Roy Ferman, for operating a bogus business finance scheme that cost small business owners more than $37 million.According to a complaint filed by the FTC, the company has targeted new and aspiring small business owners looking for loans or lines of credit to open or grow their businesses. While the company’s advertising implies that business owners would have access to cash, instead Seek charges clients thousands of dollars simply to open credit cards in the owners’ names. Type of Action Federal Last Updated February 26, 2025 Docket Number 2:24-cv-09511 Case Status Pending Cases and Proceedings Adjudicative Proceedings Caremark Rx, Zinc Health Services, et al., In the Matter of (Insulin) The FTC filed a lawsuit against the three largest prescription drug benefit managers (PBMs)—Caremark Rx, Express Scripts (ESI), and OptumRx—and their affiliated group purchasing organizations (GPOs) for engaging in anticompetitive and unfair rebating practices that have artificially inflated the list price of insulin drugs. Type of Action Administrative Last Updated February 26, 2025 FTC Matter/File Number 221 0114 Docket Number 9437 Case Status Pending Cases and Proceedings Avast The FTC will require Avast to pay $16.5 million and prohibit the company from selling or licensing any web browsing data for advertising purposes to settle charges that the company and its subsidiaries sold such information to third parties after promising that its products would protect consumers from online tracking.The Federal Trade Commission is sending claim forms to consumers who bought deceptively marketed antivirus software from Avast. Type of Action Administrative Last Updated February 24, 2025 FTC Matter/File Number 2023033 Case Status Pending"
