["https://ftc.gov/business-guidance/industry/human-resources"]
title = "Human Resources | Federal Trade Commission"
description = "Practical information for human resources and administrative professionals about protecting personal data in your company's possession, spotting B2B fraud, responding to identity theft, complying with the Fair Credit Reporting Act in the employment process – and more."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM By Industry Menu By Industry Alcohol Appliances Automobiles Clothing and Textiles Finance Franchises, Business Opportunities, and Investments Funerals Human Resources Jewelry Real Estate and Mortgages Tobacco Practical information for human resources and administrative professionals about protecting personal data in your company's possession, spotting B2B fraud, responding to identity theft, complying with the Fair Credit Reporting Act in the employment process – and more. Featured Small Business Computer Security BasicsApril 26, 2017 Plain Language Guidance Background Checks: What Employers Need to KnowIf employers use background checks in making personnel decisions, they must comply with the Fair Credit Reporting Act and laws that protect people from discrimination. The FTC and EEOC have tips for businesses on the lawful use of background information. Comience con seguridad: una guía para negociosEste campo está desactivado porque no tiene permisos suficientes para editarlo. Data Breach Response: A Guide for BusinessThis guide addresses the steps to take once a breach has occurred. For advice on implementing a plan to protect consumers’ personal information and prevent breaches and unauthorized access, check out the FTC's Protecting Personal Information: A Guide for Business and Start with Security. Digital Copier Data Security: A Guide for BusinessesDoes your company keep sensitive data — Social Security numbers, credit reports, account numbers, health records, or business secrets? If so, then you’ve probably instituted safeguards to protect that information. Your information security plans also should cover the digital copiers your company uses. If the data on your copiers gets into the wrong hands, it could lead to fraud and identity theft. Medical Identity Theft: FAQs for Health Care Providers and Health PlansExplains how medical identity theft occurs, and how health care providers and insurers can minimize the risk and help their patients if they’re victimized. Online Charitable Giving Portals Online charitable giving portals must ensure that their efforts to provide more giving options do not inadvertently create donor confusion or violate advertising law principles. Here’s some guidance on how to do that. Peer-to-Peer File Sharing: A Guide for BusinessMost businesses collect and store sensitive information about their employees and customers. If you use Peer-to-Peer (P2P) file sharing software in your business, consider the security implications and minimize the risks associated with it. Portales de donaciones caritativas en línea Los portales de donaciones caritativas en línea deben tomar las medidas necesarias para garantizar que sus esfuerzos para brindar más opciones para hacer contribuciones no creen confusión inadvertidamente entre los donantes ni infrinjan los principios legales de la publicidad. A continuación algunas pautas de orientación para cumplir estos objetivos. Recomendaciones para negocios minoristas: Cómo revisar las solicitudes de las organizaciones de caridadComo líder de negocios dentro de su comunidad, es posible que le pidan que apoye a organizaciones de caridad locales o nacionales. Establezca una norma en su negocio para que todo aquel que le pida ayuda para recaudar fondos le entregue información básica sobre la organización de caridad y el recaudador. Puede usar este formulario de solicitud de organizaciones de caridad. Start with Security: A Guide for BusinessTen practical lessons businesses can learn from the FTC's 50+ data security settlements. Tips for Retailers: How to Review Charity Requests As a business leader in your community, you may be asked to support local or national charities. Supporting a charity can be a great thing to do, but before you give your time, money, or your business’s name, make sure the request isn’t a scam. Make it a policy to get anyone asking for fundraising help to give you basic information about the charity and the fundraiser. You can use this Charity Request Form. Using Consumer Reports: What Employers Need to KnowWhen you use consumer reports to make employment decisions like hiring, promotion, reassignment, and retention, the Fair Credit Reporting Act requires you to take important compliance steps. Find out more about keeping your company within the law. What Employment Background Screening Companies Need to Know About the Fair Credit Reporting ActIf your company is in the business of compiling background information for employment purposes, it’s likely you’re covered by the Fair Credit Reporting Act. Are you following reasonable procedures to assure accuracy, getting required certifications from your clients, and complying with other FCRA provisions? Related Blog Posts A job scam that college students – and your HR team – need to know aboutDecember 27, 2023 FTC lawsuit insists on FCRA compliance and transparency from background report providersSeptember 11, 2023 Job scammers go even lower in the way they “hire”August 3, 2023 FTC policy statement: Established consumer protection and competition principles apply to gig companies September 20, 2022 Businesses: Phishing scheme targets unemployment benefits, PIIAugust 4, 2021 Legal Resources on Human Resources Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Cases Closing Letters Closing Letters Closing Letters Videos Defend Against Ransomware Start with Security Protecting Your Business From Fraud Return to top"
