title = "About the FTC | Federal Trade Commission"
description = "The FTC is a bipartisan federal agency that champions the interests of American consumers. We protect consumers from deceptive and unfair business practices and promote a free and competitive marketplace by challenging anticompetitive mergers and business practices."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM .region-banner { background-image: url(/sites/default/files/styles/wide_standard_banner/public/ftc_gov/images/FTC_Building_Penn_Ave_Wide.JPG?itok=oSPsmy8I); } Our Mission Protecting the public from deceptive or unfair business practices and from unfair methods of competition through law enforcement, advocacy, research, and education. Our Vision A vibrant economy fueled by fair competition and an empowered, informed public. Our Strategic Goals Protect the public from unfair or deceptive acts or practices in the marketplace Protect the public from unfair methods of competition in the marketplace and promote fair competition Advance the FTC’s effectiveness and performance How the FTC Benefits Consumers As a consumer or business person, you may be more familiar with the work of the Federal Trade Commission than you think. The FTC deals with issues that touch the economic life of every American. The FTC is the only federal agency with both consumer protection and competition jurisdiction in broad sectors of the economy. The FTC pursues vigorous and effective law enforcement; advances consumers’ interests by sharing its expertise with federal and state legislatures and U.S. and international government agencies; develops policy and research tools through hearings, workshops, and conferences; and creates practical and plain-language educational programs for consumers and businesses in a global marketplace with constantly changing technologies. FTC’s work is performed by the Bureaus of Consumer Protection, Competition and Economics. That work is aided by the Office of General Counsel and eight regional offices. History of the FTC When the FTC was created in 1914, its purpose was to prevent unfair methods of competition in commerce as part of the battle to “bust the trusts.” Over the years, Congress passed additional laws giving the agency greater authority to police anticompetitive practices. In 1938, Congress passed a broad prohibition against “unfair and deceptive acts or practices.” Since then, the Commission also has been directed to administer a wide variety of other consumer protection laws, including the Telemarketing Sales Rule, the Pay-Per-Call Rule and the Equal Credit Opportunity Act. In 1975, Congress gave the FTC the authority to adopt industry-wide trade regulation rules. Learn more about the FTC's history The FTC will never demand money or personal information from you. If you have been targeted by an illegal business practice or scam, report it at ReportFraud.ftc.gov. File FTC Organization Chart (44.21 KB)"
