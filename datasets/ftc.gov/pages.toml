full_description = "Si tiene alguna pregunta o comentario sobre un tema, por favor envíelo al Buró correspondiente por medio de uno de los siguientes métodos. Para saber cómo podemos usar la información que nos suministre, por favor lea nuestra Política de privacidad. Para ayudarnos a atenderlo mejor, por favor incluya en su comunicación un número de teléfono donde podamos ubicarlo durante el día. Nota: El email no es un sistema seguro. Marque la información “Confidential” y envíela por correo postal. Comisión Federal de Comercio Oficina central Federal Trade Commission 600 Pennsylvania Avenue, NW Washington, DC 20580 Teléfono: (202) 326-2222 Constitution Center Federal Trade Commission 400 7th St., SW Washington, DC 20024 Teléfono: (202) 326-2222 Peticiones para la Comisión Las peticiones de acción de la Comisión deben enviarse a secretary@ftc.gov. Buró de Competencia Oficina de Políticas y Coordinación Room CC-5422 Bureau of Competition Federal Trade Commission 600 Pennsylvania Ave., NW Washington, DC 20580 Teléfono: (202) 326-3300 Email: antitrust@ftc.gov Notificación previa de fusiones Teléfono: (202) 326-3100 Buró de Protección del Consumidor Bureau of Consumer Protection Federal Trade Commission 600 Pennsylvania Ave., NW Washington, DC 20580 Buró de Economía Bureau of Economics Federal Trade Commission 600 Pennsylvania Ave., NW Washington, DC 20580 Materiales educativos Pedidos en grandes cantidades (más de 50 copias) https://bulkorder.ftc.gov/Default.aspx?language=spanish Materiales de educación del consumidor www.consumidor.ftc.gov/ Números registrados (RN) & artículos textiles, de lana y de piel Sección de artículos textiles Division of Enforcement Federal Trade Commission 600 Pennsylvania Avenue, NW Washington, DC 20580 Teléfono: (202) 326-3553"
