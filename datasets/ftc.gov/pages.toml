title = "Environmental Marketing | Federal Trade Commission"
description = "Companies are offering consumers an ever-growing assortment of “green” options. But whether your environmental claims are about the product or the packaging, you'll need competent and reliable scientific evidence to support what you say. Find out more by consulting the FTC’s revised Green Guides. Have you spotted what you think might be a deceptive claim or practice? File a complaint."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing Companies are offering consumers an ever-growing assortment of “green” options. But whether your environmental claims are about the product or the packaging, you'll need competent and reliable scientific evidence to support what you say. Find out more by consulting the FTC’s revised Green Guides. Have you spotted what you think might be a deceptive claim or practice? File a complaint. Featured Environmental Claims: Summary of the Green Guides Plain Language Guidance EnergyGuide Labeling: FAQs for Appliance ManufacturersFAQs to help manufacturers comply with the Appliance Labeling Rule Environmental Claims: Summary of the Green GuidesIf your company makes environmental claims in your ads or on your products, you'll want to know about the FTC's Green Guides. This summary of the Guides introduces how truth-in-advertising principles apply to green marketing and highlights terms often used in environmental ads. How to Avoid Bamboozling Your CustomersDo you make or sell bamboo-based textiles? Do you market clothing, linens, or other products advertised or labeled as bamboo? If your product isn’t made directly from bamboo fiber, it can’t be called bamboo. Read this publication to get clued in on bamboo. The FTC “Lighting Facts” Label: Questions and Answers for ManufacturersThese FAQs help manufacturers comply with the Energy Labeling Rule, which includes the Lighting Facts label. It has information to help consumers choose the most energy-efficient bulb for their needs. Resources Environmental Claims: Summary of the Green GuidesIf your company makes environmental claims in your ads or on your products, you'll want to know about the FTC's Green Guides. This summary of the Guides introduces how truth-in-advertising principles apply to green marketing and highlights terms often used in environmental ads. Related Blog Posts FTC public workshop on recyclable claims starts soonMay 23, 2023 The topic is trash: FTC event explores recycling claimsMay 10, 2023 Next step in FTC’s Green Guides review: A closer look at “recyclable” claimsMarch 1, 2023 FTC greenlights Green Guides comment extensionJanuary 31, 2023 FTC Environmental Marketing Guides: Is it time for a change of green-ery?December 28, 2022 Legal Resources on Environmental Marketing Advisory Opinions Advisory Opinions General Motors Company Cases Cases Kohl's Inc., U.S. v. Cases Walmart, U.S. v. Cases Truly Organic Inc. Cases Moonlight Slumber, In the Matter of Cases YOLO Colorhouse, In the Matter of Cases ICP Construction, Inc, In the Matter of Cases Imperial Paints, In the Matter of Cases Benjamin Moore & Co., Inc., In the Matter of Cases California Naturel, In the Matter of Cases Trans-India Products, Inc., In the Matter of Cases Beyond Coastal, In the Matter of Cases The Erickson Marketing Group Inc., In the Matter of Cases ABS Consumer Products, In the Matter of Cases Volkswagen Group of America, Inc. Cases Backcountry.com, LLC Cases Bed Bath & Beyond Inc. Cases Nordstrom, Inc. Cases J.C. Penney Company, Inc. Cases Nice-Pak Products, Inc., In the Matter of Cases Zipatone, Inc. Cases Vons Companies, Inc. Cases Texwipe Company Cases PerfectData Corporation Cases Nationwide Industries Cases Mobil Oil Corporation Cases G.C. Thorsen, Inc. Cases DeMert & Dougherty, Inc. Cases American Enviro Products, Inc. Cases Benckiser Consumer Products, Inc. Cases Mattel, Inc. Cases Creative Aerosol Corporation Cases BPI Environmental, Inc. Cases North American Plastics Corporation Cases AJM Packaging Corporat