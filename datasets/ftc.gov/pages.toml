title = "Payments and Billing | Federal Trade Commission"
description = "Under the law, businesses must take steps to ensure that charges to customers' credit cards, debit cards, phone bills, and other accounts are authorized. Those principles apply to mobile payments, too. It's also illegal to bill people for negative options, automatic shipments, or continuity programs without their express consent. Does your company process payments for others? There are compliance standards you need to meet. Find out more about resources from the FTC."
