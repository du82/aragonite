["https://ftc.gov/business-guidance/privacy-security/credit-reporting"]
title = "Credit Reporting | Federal Trade Commission"
description = "Does your business use consumer reports or credit reports to evaluate customers’ creditworthiness? Do you consult reports when evaluating applications for jobs, leases, or insurance? Here's information about your responsibilities under the Fair Credit Reporting Act and other laws when using, reporting, and disposing of information in those reports."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Privacy and Security Menu Privacy and Security Children's Privacy Health Privacy Consumer Privacy Credit Reporting Data Security Gramm-Leach-Bliley Act Red Flags Rule Data Privacy Framework Privacy Shield U.S.-EU Safe Harbor Framework Tech Does your business use consumer reports or credit reports to evaluate customers’ creditworthiness? Do you consult reports when evaluating applications for jobs, leases, or insurance? Here's information about your responsibilities under the Fair Credit Reporting Act and other laws when using, reporting, and disposing of information in those reports. Featured Using Consumer Reports: What Landlords Need to Know Businesses Must Provide Victims and Law Enforcement with Transaction Records Relating to Identity Theft Plain Language Guidance Background Checks: What Employers Need to KnowIf employers use background checks in making personnel decisions, they must comply with the Fair Credit Reporting Act and laws that protect people from discrimination. The FTC and EEOC have tips for businesses on the lawful use of background information. Businesses Must Provide Victims and Law Enforcement with Transaction Records Relating to Identity TheftThe Fair Credit Reporting Act (FCRA) spells out rights for victims of identity theft – and responsibilities for your business. Are you complying with the requirement that you provide victims of identity theft and law enforcers with copies of transaction records related to the theft? Consumer Reports: What Information Furnishers Need to KnowIf you report information about consumers to consumer reporting agencies (CRAs) — like a credit bureau, tenant screening company, or check verification service — you have legal obligations under the Fair Credit Reporting Act's Furnisher Rule. Consumer Reports: What Insurers Need to KnowWhen using credit reports to consider whether to underwrite policies, insurers must comply with the Fair Credit Reporting Act. Disposing of Consumer Report Information? Rule Tells HowOnce your business is finished with sensitive information derived from consumer reports, what happens to it then? Under the Disposal Rule, your company must take steps to dispose of it securely. Using Consumer Reports for Credit Decisions: What to Know About Adverse Action and Risk-Based Pricing NoticesIf you use consumer reports to make credit decisions, here’s what you need to know about your legal obligations under the Risk-Based Pricing Rule of the Fair Credit Reporting Act. Using Consumer Reports: What Employers Need to KnowWhen you use consumer reports to make employment decisions like hiring, promotion, reassignment, and retention, the Fair Credit Reporting Act requires you to take important compliance steps. Find out more about keeping your company within the law. Using Consumer Reports: What Landlords Need to KnowLandlords, property managers, or other housing providers: If you run tenant background checks using companies that compile background information, consider your legal responsibilities under the Fair Credit Reporting Act. What Employment Background Screening Companies Need to Know About the Fair Credit Reporting ActIf your company is in the business of compiling background information for employment purposes, it’s likely you’re covered by the Fair Credit Reporting Act. Are you following reasonable procedures to assure accuracy, getting required certifications from your clients, and complying with other FCRA provisions? What Tenant Background Screening Companies Need to Know About the Fair Credit Reporting ActIf your company is in the business of compiling background information for housing purposes, it’s likely you’re covered by the Fair Credit Reporting Act (FCRA). Are you following reasonable procedures to assure accuracy, getting required certifications from your clients, and complying with other FCRA provisions? Resources Disposing of Consumer Report Information? Rule Tells How In an effort to protect the privacy of consumer information and reduce the risk of fraud and identity theft, a federal rule is requires businesses to take appropriate measures to dispose of sensitive information derived from consumer reports. Any business or individual who uses a consumer report for... What Employment Background Screening Companies Need to Know About the Fair Credit Reporting Act When is an employment background screening company a “consumer reporting agency”? Background screening reports are “consumer reports” under the FCRA when they serve as a factor in determining a person’s eligibility for employment, credit, insurance, housing, or other purposes and they include... Related Blog Posts How the FTC is showing its commitment to protecting renters’ rightsJune 4, 2024 Aqua Finance’s sales, financing, and FCRA practices land company in hot waterMay 2, 2024 FTC Privacy and Security Update: What your business needs to knowMarch 28, 2024 Three ways your business can mark Identity Theft Awareness WeekJanuary 29, 2024 Read these 2023 FTC best sellers to be a better seller in 2024January 2, 2024 Legal Resources on Credit Reporting Advisory Opinions Advisory Opinions Section 606: Investigative consumer report disclosures Advisory Opinions Section 623(c): Liability of furnishers Advisory Opinions Section 623(b): Duty of furnishers to investigate consumer disputes Advisory Opinions Section 623(a)(5): Duty of furnishers to provide date of delinquency on charge-off, collection or similar accounts Advisory Opinions Section 623(a)(3): Duty of furnishers to provide notice of dispute Advisory Opinions Section 623(a)(2): Duty of furnishers to correct and update information Advisory Opinions Section 623(a)(1): Duty of furnishers to provide accurate information Advisory Opinions S