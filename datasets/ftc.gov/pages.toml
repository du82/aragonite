title = "Telemarketing | Federal Trade Commission"
description = "The FTC’s Telemarketing Sales Rule helps protect consumers from fraudulent telemarketing calls and gives them certain protections under the National Do Not Call Registry. Companies also need to be familiar with rules banning most forms of robocalling. If you or someone working on your behalf is telemarketing products or services, know the dos and don’ts before you plan your strategy."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing The FTC’s Telemarketing Sales Rule helps protect consumers from fraudulent telemarketing calls and gives them certain protections under the National Do Not Call Registry. Companies also need to be familiar with rules banning most forms of robocalling. If you or someone working on your behalf is telemarketing products or services, know the dos and don’ts before you plan your strategy. Featured Complying with the Telemarketing Sales Rule Plain Language Guidance Business Guide to the FTC's Mail, Internet, or Telephone Order Merchandise RuleDo you sell products by mail, by phone, or online? This publication discusses what the FTC's Mail Order Rule covers, offers how-to compliance advice, answers common questions, explains where to go for more information – and includes a copy of the Rule. Complying with the 900 Number RuleBusinesses that operate – or provide billing for – pay-per-call services must follow the provisions of the 900-Number Rule. Find out more about the legal requirements for advertising, billing, and collections. Complying with the Telemarketing Sales RuleIf your business or organization uses telemarketing, this in-depth guide is a “must read.” Review the dos and don’ts to make sure you’re up on the law, including the ban on most prerecorded robocalls. Debt Relief Services & the Telemarketing Sales Rule: A Guide for BusinessDoes your business market debt relief services? Read this guide on complying with amendments to the Telemarketing Sales Rule. Debt Relief Services & the Telemarketing Sales Rule: What People Are AskingAnswers to questions people are asking about debt relief services and the Telemarketing Sales Rule. Q&A for Telemarketers & Sellers About DNC Provisions in TSRCurious about complying with the Do Not Call provisions of the Telemarketing Sales Rule? This publication answers common questions posed by telemarketers. Scams and Your Small Business: A Guide for Business This article is part of the FTC’s efforts to help small business owners avoid scams. It explains common scams that target small businesses and non-profit organizations, describes scammers’ tactics, and provides steps people can take to protect their company from scams. Copies can be ordered for free at ftc.gov/bulkorder. Resources Q&A for Telemarketers & Sellers About DNC Provisions in TSRCurious about complying with the Do Not Call provisions of the Telemarketing Sales Rule? This publication answers common questions posed by telemarketers. Related Blog Posts Look who’s covered: the amended TSR and tech support scamsDecember 19, 2024 Mark your calendars, telemarketers and sellers! October 15 is the Telemarketing Sales Rule’s Record Store Day.October 11, 2024 FTC says CarShield shielded consumers from the truth about limitations of its vehicle service contractsJuly 31, 2024 $43.5 million in redress and debt cancellation to servicemembers, military spouses, and other consumers due to multiple missteps by education provider Career StepJuly 30, 2024 How is a student debt relief outfit allegedly misleading consumers? Let us count the ways. July 22, 2024 Legal Resources on Telemarketing Advisory Opinions Advisory Opinions Advisory opinion concluding that the Telemarketing Sales Rule generally imposes no restrictions on the legitimate fundraising activities of nonprofit organizations Advisory Opinions Opinion 14-1 Advisory Opinions Opinion 03-1 Advisory Opinions Opinion 10-1 Advisory Opinions Opinion 06-1 Advisory Opinions Opinion 09-1 Advisory Opinions Opinion