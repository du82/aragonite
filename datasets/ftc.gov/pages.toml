["https://ftc.gov/about-ftc/our-history/presidential-visit"]
title = "President Obama Visits the FTC to Announce Identity Theft, Privacy Initiatives | Federal Trade Commission"
description = "January 12, 2015President Obama made a historic visit to the Federal Trade Commission, the first presidential visit to the FTC since 1937."
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM January 12, 2015President Obama made a historic visit to the Federal Trade Commission, the first presidential visit to the FTC since 1937. The Commission was proud to host the President in its Centennial year. Following a brief introduction from FTC Chairwoman Edith Ramirez, the President announced forthcoming initiatives to address identity theft, and consumer and student privacy.Video Transcript (PDF) PhotographsChairwoman Ramirez welcomes attendees and thanks President Obama for his shared commitment to protecting American consumers.President Obama greets Chairwoman Ramirez with a hug – they worked together on the Harvard Law Review as students.President Obama thanked the FTC for 100 years of protecting American consumers: “Every day you take the lead in making sure Americans, their hard-earned money, and their privacy are protected – especially when they go online.” Speaking to a packed auditorium at the FTC, President Obama discussed the growing problem of cyber hacks, and noted that 9 out of 10 Americans in one survey said they feel they’ve lost control of their information. “If we’re going to be connected, then we’ve got to be protected,” he said.Following his remarks, President Obama greets FTC employees. Chairwoman Ramirez and FTC Commissioners say farewell to President Obama after his remarks at the Commission.Additional CoverageAdditional Photos at the FTC Facebook pageRemarks of Chairwoman Edith Ramirez Introducing President ObamaRemarks by the President at the Federal Trade Commission (White House press release, Jan. 12, 2015)The President Announces New Actions to Protect Americans' Privacy and Identity (White House, Jan. 12, 2015) File Transcript - President Barack Obama Visits the FTC, January 12, 2015 (35.45 KB)"
