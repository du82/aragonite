["https://ftc.gov/advice-guidance/competition-guidance/negotiating-merger-remedies"]
title = "Negotiating Merger Remedies | Federal Trade Commission"
description = "This content is also available as a pdf."
full_description = '''Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Tags: Competition Merger This content is also available as a pdf. Statement of the Federal Trade Commission's Bureau of Competition on Negotiating Merger Remedies The Federal Trade Commission's Bureau of Competition has revised this Statement, which provides guidance to those negotiating a settlement in a merger case.(1) . This guidance should answer many of the questions that frequently arise and should expedite negotiations.(2) In addition, merging parties should review the Commission's past complaints, orders, and related documents, to see various order provisions that the Commission has required in past cases.(3) Each merger is unique, however, and any proposed remedy is evaluated on the particular facts of the case. Accordingly, that the Commission has accepted a particular provision in the past will not on that basis alone be persuasive that the same provision should be accepted in a new matter. The Commission and its staff are constantly learning from their experiences; provisions in previous cases that proved insufficient may not be acceptable in a subsequent case. This statement assumes that the staff have identified concerns with a proposed or consummated transaction, and that the merging parties and staff are negotiating a settlement. This statement addresses issues arising in the following areas: (1) the assets to be divested, (2) an acceptable buyer, (3) the divestiture agreement, (4) additional order provisions, (5) orders to hold separate and/or maintain assets pending divestiture, (6) divestiture applications, and (7) timing.(4) Table of Contents The Proposed Divestiture Anticompetitive horizontal mergers are most often remedied by a divestiture; a proposal to divest one party's demonstrably autonomous, on-going business unit will usually expedite settlement. If the proposed package of assets does not comprise a separate business unit that has operated autonomously in the past, the staff is unlikely to recommend that the Commission accept such a proposal until the parties show that the package includes all necessary components, or that those components are otherwise available to a prospective buyer. The Commission will typically require an up-front buyer if the parties seek to divest assets comprising less than an autonomous, on-going business or if the to-be-divested assets are susceptible to deterioration pending divestiture. If the parties propose to divest primarily intellectual property or other limited assets, the Commission will typically require an up-front buyer. An Acceptable Buyer To be acceptable, a buyer must be competitively and financially viable; a proposed a buyer that does not satisfy these tests will be rejected, and the parties will be required to propose an acceptable one. The Divestiture Agreement Whether up-front or post-order, the staff will review the divestiture agreement carefully to determine that it conveys all assets required to be divested and contains no provisions inconsistent with the terms of the Commission's order or with the order's remedial objectives. In evaluating the terms of the divestiture agreement, the staff will rely primarily on information obtained from the buyer; however, the staff remains aware that the buyer's incentives may not always be consistent with the Commission's objectives. The merging parties must obtain all required third-party consents and approvals before the Bureau recommends that the Commission approve a proposed divestiture. Additional Order Provisions In some cases, the buyer may need additional, short-term assistance from the merging parties, particularly when less than the entire business of one party is being divested. If the Commission's order imposes obligations requiring a continuing relationship between the respondent and the buyer, the Commission may appoint an independent third party to monitor the parties' compliance with their obligations under the Commission's order Order to Hold Separate or Maintain Assets If there is concern about interim competitive harm or diminution in the competitive strength of the assets to be divested pending divestiture, staff will require an additional order that requires the parties to hold separate the assets to be divested. Even if an order to hold separate is not necessary, the parties will be required to maintain the assets to be divested pending divestiture. The order to hold separate or maintain assets will include the appointment of an independent third party to oversee the operations of the held separate business or monitor the parties' compliance with the order. Divestiture Applications In cases requiring a post-order divestiture, the respondent has the burden of showing that the proposed divestiture meets the order's specific requirements and satisfies the order's remedial purposes. The respondent must include in its application all information and documents sufficient to satisfy its burden and should ensure that the buyer will cooperate with the staff's requests for information and documents. The respondent's application should include a representation that the proposed divestiture conveys all assets required to be divested, including obtaining all necessary consents and approvals. Failure to consummate the required divestiture within the time limit set forth in the Commission's order violates the Commission's order Timing The parties should raise any concerns or complexities as early as possible and consider alternatives that may expedite the matter. The Proposed Divestiture Anticompetitive horizontal mergers are most often remedied by a divestiture; a proposal to divest one party's demonstrably autonomous, on-going business unit will usually expedite settlement. The Commission and the staff analyze proposed or consummated mergers between competitors to determine whether they will cause or have caused anticompetitive effects in violation of Section 7 of the Clayton Act. If staff determines that anticompetitive effects are likely, it will discuss with the parties what it has learned and what it believes an acceptable remedy must include to maintain or restore competition in the markets affected by the merger. A negotiated settlement is intended to achieve that remedy while allowing the parties to proceed with the merger's non-problematic portions. The parties must decide whether they wish to engage in settlement discussions with the staff. On the Commission's side, the discussions will involve the Commission's Bureau of Competition (including the Compliance Division) and the Bureau of Economics. On the parties' side, the discussion should include not only outside counsel if the parties are so represented, but in-house representatives as well, including lawyers and operations people. Although the parties and the staff negotiate a proposed settlement and finalize terms, the Commission ultimately determines whether the proposal is acceptable. It does so by a majority vote of the Commissioners after they review the materials that staff prepares and forwards to them. If the Commission concludes that a proposed settlement will remedy the merger's anticompetitive effects, it will likely accept that settlement and not seek to prevent the proposed merger or unwind the consummated merger. The Commission and the staff review most mergers prior to consummation, but they also review consummated deals. The legal analysis of a proposed transaction does not differ significantly from the legal analysis of a consummated deal; however, remedying a consummated deal poses different issues. The Commission's objective in all cases is to eliminate, to the extent possible, the anticompetitive effects that will result or have resulted from the merger, which most often requires divestiture. In a consummated deal, the parties have already acquired assets and have often integrated them. If the acquired assets are well integrated, crafting an effective divestiture to eliminate the anticompetitive effects may be problematic, (5) but it nonetheless may be necessary to undo the illegal effects of the merger.(6) Most merger cases involve horizontal mergers, and the Commission prefers structural relief in the form of a divestiture to remedy the anticompetitive effects of an unlawful horizontal merger. Non-structural, or conduct, relief may also be required in aid of a required divestiture to remedy those effects. Such additional relief may include supply agreements, employee obligations, confidentiality protections, and other provisions necessary to support a successful divestiture. Conduct relief also may be required to remedy the anticompetitive effects of a vertical merger. Such conduct relief may include a requirement to erect firewalls to protect confidential information or a requirement not to favor certain entities. The staff is most likely to accept the parties' offer to divest an autonomous, on-going business unit that comprises at least one party's entire business in the relevant market. Such a remedy will most immediately eliminate the competitive problems created by the merger by preserving or re-creating the competitive status quo, and it entails the least amount of risk. It also requires the Commission and the staff to make the fewest assumptions about the market and its participants and about the viability and competitiveness of the proposed divestiture. The parties should be prepared to show that the business unit contains all components necessary to operate autonomously, that it has operated autonomously, that it is segregable from the parent, and that the unit's buyer will be able to maintain or restore competition almost immediately. The business people should be prepared to explain the unit's business operations and to provide relevant financial information and separate financial documents. As discussed below, a proposal short of that requires the staff to ask additional questions and conduct further analysis; as a result, completing negotiations will likely take more time. The staff will examine a proposed divestiture to determine whether it includes all of the unit's components. These components generally include: manufacturing and other facilities access to key inputs and other supply access to markets for ancillary outputs research and development capability intellectual property, whether owned or licensed technology, including know-how and trade secrets as well as information technology identification of and access to personnel marketing and distribution capabilities supply, service, and customer relationships capital resources anything else necessary to compete effectively in the relevant market The proposed package may also include business components relating to markets outside the relevant geographic or product market, if such components are necessary to assure that the buyer retains the same efficiencies that the respondent had. For example, when the product is marketed and distributed with other products, the assets to be divested may include assets relating to these other products in order to remain efficient. Similarly, if vertical integration is an important competitive element, it may be necessary to include assets at more than one level of the industry. If the proposed package of assets does not comprise a separate business unit that has operated autonomously in the past, the staff is unlikely to recommend that the Commission accept such a proposal until the parties show that the package includes all necessary components, or that those components are otherwise available to a prospective buyer. If the parties seek to exclude any of these components, they must explain why the components are not included and what a buyer would use instead. The parties must also explain how the buyer will be able to integrate the divested components into its own operations to operate competitively. The parties' operational employees tend to be the most knowledgeable about these issues. Suppliers, customers, competitors, and other possible buyers may also provide instructive evidence; the parties should be prepared to make such evidence available if necessary or direct the staff to where it can be obtained. A blanket assertion by the parties that certain components – for example, the research and development unit – are not necessary will generally not be persuasive. The parties should provide evidence that the carve out will not undermine the buyer's viability or competitiveness. For instance, an explanation that any buyer acceptable to the Commission will have its own research and development unit may be persuasive if the parties provide evidence to support the explanation. The parties may also demonstrate that manufacturing facilities need not be divested if they can show that appropriate third-party contract manufacturing is readily and competitively available. The parties must show that such arrangements are common, are readily available, and will not disadvantage the buyer. Providing evidence that competitors use such arrangements and that customers will purchase the contract-manufactured finished product may expedite negotiations. If the parties propose to assemble all necessary components by combining assets that have never been combined in the past (e.g., combining one party's assets with some of the other party's assets, rather than including all of one party's assets), the parties must show that the proposed divestiture will enable the buyer to maintain or restore competition in the market. For example, in the grocery retailing market, the parties might provide detailed analysis of each supermarket that the parties propose to divest to show that the proposed divestiture would maintain or restore competition in the market. If, however, the parties have proposed divesting lower performing, higher operating cost, older, less conveniently located supermarkets, they will have difficulty persuading the staff to accept such a package. The Bureau is willing to examine any proposal, but it will always require sufficient evidence to conclude that the proposed divestiture will maintain or restore competition and will require sufficient time to analyze the evidence. In general, a "mix and match" proposal tends to slow the negotiations down, requiring a more fact-specific, detailed, and time-consuming evaluation of each asset The Commission will typically require an up-front buyer if the parties seek to divest assets comprising less than an autonomous, on-going business or if the to-be-divested assets are susceptible to deterioration pending divestiture. If the parties propose to divest more limited assets, the staff will typically consider such a package only if the proposed order specifies an "up-front buyer"; that is, the parties must identify an acceptable buye'''
