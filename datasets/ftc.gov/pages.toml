description = "Do you promote your products as “Made in the USA”? Under the law, some products must disclose U.S. content. For others, manufacturers and marketers who choose to make claims about the amount of U.S. content need to know about the FTC’s Made in USA Labeling Rule and Enforcement Policy Statement on U.S. Origin Claims. Is your company up on what's required?"
full_description = "Technology Blog The FTC Is on the Front Lines of Tech Innovation & Regulation Stephanie T. Nguyen, Chief Technologist January 17, 2025 Mar05 Protecting Your VA Benefits and Avoiding Scams (English) Wednesday, March 5, 2025 | 2:00PM - 3:00PM Advertising and Marketing Menu Advertising and Marketing Advertising and Marketing Basics Children Endorsements, Influencers, and Reviews Environmental Marketing Health Claims Made in USA Online Advertising and Marketing Telemarketing Do you promote your products as “Made in the USA”? Under the law, some products must disclose U.S. content. For others, manufacturers and marketers who choose to make claims about the amount of U.S. content need to know about the FTC’s Made in USA Labeling Rule and Enforcement Policy Statement on U.S. Origin Claims. Is your company up on what's required? Featured Complying with the Made in USA Standard Plain Language Guidance Complying with the Made in USA StandardDo you promote your products as “Made in the USA”? Under the law, some products must disclose U.S. content. For others, manufacturers and marketers who choose to make claims about the amount of U.S. content need to know about the FTC’s Made in USA Labeling Rule and Enforcement Policy Statement on U.S. Origin Claims. Is your company up on what's required? Selling 'American-Made' Products? What Businesses Need to Know About Making Made in USA ClaimsAccording to the Federal Trade Commission, “Made in USA” means that “all or virtually all” the product has been made in America. That is, all significant parts, processing and labor that go into the product must be of U.S. origin. Resources Complying with the Made in USA StandardDo you promote your products as “Made in the USA”? Under the law, some products must disclose U.S. content. For others, manufacturers and marketers who choose to make claims about the amount of U.S. content need to know about the FTC’s Made in USA Labeling Rule and Enforcement Policy Statement on U.S. O