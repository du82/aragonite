full_description = "News Home / News Home / News #page-header-1876903115 .page-title-inner { min-height: 250px; } #page-header-1876903115 .title-bg { background-image: url(https://ftdichip.com/wp-content/uploads/2020/07/AboutUs_News.jpg); } News News We are in Embedded World 2025 28/02/2025 FTDI Chip to Showcase Advanced USB Solutions at Embedded World 2025. We will be participating in Embedded World 2025, at Hall 3A, Booth #429, where we will showcase live demonstrations of cutting-edge technology. Experience the power and versatility of the... Read More News Recent press speculation regarding requirement by UK Government to divest 80.2% shareholding in FTDI 11/11/2024 FTDI is aware of certain media reports concerning an order by the UK Government requiring a certain shareholder in FTDI to divest 80.2% of its shares in FTDI (the “UK Government Order”) and certain FTDI products having been sold to... Read More News embedded world North America 2024 11/11/2024 Our exhibition at embedded world North America, Austin, Texas has come to a close. The event has been a resounding success, and we want to extend a huge thank you to everyone who visited, connected, and engaged with us at... Read More News Public Response 06/12/2023 We note that there have been certain comments recently concerning the supply of certain of our products into Russia. FTDI continues to adhere to applicable UK government sanctions and export control laws in force and our future business plans take... Read More News Important Notice: Fake, Phishing and Spoofing Emails Warning 06/06/2023 FTDI has recently learned of an email scam involving persons posing as company officers, or falsely claiming to represent the company or company group affiliates, while soliciting the opportunity to become collection agents on behalf of the company. The company,... Read More News Notice of Singapore Office Relocation 05/06/2023 We are delighted to inform you that we are moving to a new office location as of 5th June 2023. Our office telephone number remains unchanged and facsimile number is no longer in service. Our new office details are as... Read More News Important Notice: Beware of Unauthorised Reseller 05/06/2023 Dear valued customer, We have recently become aware of an unauthorised store who is reselling FTDI products using our name and logo on Taobao Alibaba. The unauthorised store/ reseller may claim to offer FTDI products at discounted prices, but we... Read More News Embedded World 2022 29/06/2022 The 3-day Embedded World 2022 tradeshow has ended successfully. We were grateful and delighted that we could finally meet everyone at the exhibition after 2 years. During these 3 days, we met many people who were interested with our innovative... Read More News Anti-counterfeit products 07/04/2022 The recent chip shortage has led to an increase of counterfeit products in semiconductor industry. FTDI has also been seeing a rise in cases of fraudulent chip of our FT232R and FT232B devices in recent months. To reduce the risk... Read More News USB Bridge ICs 30/09/2021 Embedded systems that need to be connected to a host computer platform require a universal communication standard. The Universal Serial Bus (USB) is a popular interface standard for enabling communication between an embedded system and a computing platform. Rapid USB... Read More 12 TaggingsCables Community Corporate Customer Survey 2021 ICs Modules New Launch News #image_1358093218 { width: 100%; } Newsletter CountryAfghanistanAlbaniaAlgeriaAmerican SamoaAndorraAngolaAnguillaAntarcticaAntigua and BarbudaArgentinaArmeniaArubaAustraliaAustriaAzerbaijanBahamasBahrainBangladeshBarbadosBelarusBelgiumBelizeBeninBermudaBhutanBoliviaBosnia and HerzegovinaBotswanaBouvet IslandBrazilBritish Indian Ocean TerritoryBrunei DarussalamBulgariaBurkina FasoBurundiCambodiaCameroonCanadaCape VerdeCayman IslandsCentral African RepublicChadChileChinaChristmas IslandCocos (Keeling) IslandsColombiaComorosCongoCook IslandsCosta RicaCote