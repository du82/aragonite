title = "Drivers - FTDI"
full_description = "Drivers Home / Drivers Home / Drivers #page-header-925386583 .page-title-inner { min-height: 250px; } #page-header-925386583 .title-bg { background-image: url(https://ftdichip.com/wp-content/uploads/2020/07/5_1_1_1_TechnicalSupport_Drivers_Overview.jpg); } Device Overview VCP Drivers D2XX Drivers D3XX Drivers PLEASE NOTE – When editing driver INF files, refer to the following document: AN_107 – Advanced Driver Options New drivers are now available to support the FT4222H – for D2XX drivers please click here. Click here to download the Windows 7 to Windows 11 and Windows Server driver installer. The Windows driver installer contains both VCP and D2XX drivers. Drivers are available which allow FTDI devices to work with the following operating systems: Windows Certified Others Legacy Windows 11 (64) Linux Windows Vista (32/64) Windows 10 (32/64) MAC OSX Windows XP (32/64) Windows 8.1 (32/64) Windows CE (Version 4.2 and greater) Windows 2000 Windows 8 (32/64) Windows RT Windows ME Windows 7 (32/64) Android MAC OS9 Windows Server 2012 R2 x64 Windows 98 Windows Server 2008 R2 x64 MAC OS8 Support for WinCE FTDI drivers are available for Windows CE 4.2-5.2, 6.0/7.0 and 2013. Support for older versions of Windows Desktop NOTE: Microsoft have ended support for certifying XP and VISTA through their WHCK test program. From revision 2.12.24 with Device Guard Support, the driver will not load on XP or VISTA. Differences in Driver API For most of these operating systems two types of driver are available: Virtual COM Port (VCP) drivers and direct (D2XX) drivers. The VCP driver emulates a standard PC serial port such that the USB device may be communicated with as a standard RS232 device. The D2XX driver allows direct access to a USB device via a DLL interface. To locate the drivers you want to install for a device, select which of the driver types you wish to use (VCP or D2XX) and then locate the appropriate operating systems. With the exception of Windows 98 and Windows ME, all devices are supported in each driver package. D3XX D3XX drivers are only suitable for FTDI's Superspeed USB bridge services (e.g. FT60x series). #section_1174421152 { padding-top: 50px; padding-bottom: 50px; } #image_1015084911 { width: 100%; } Newsletter CountryAfghanistanAlbaniaAlgeriaAmerican SamoaAndorraAngolaAnguillaAntarcticaAntigua and BarbudaArgentinaArmeniaArubaAustraliaAustriaAzerbaijanBahamasBahrainBangladeshBarbadosBelarusBelgiumBelizeBeninBermudaBhutanBoliviaBosnia and HerzegovinaBotswanaBouvet IslandBrazilBritish Indian Ocean TerritoryBrunei DarussalamBulgariaBurkina FasoBurundiCambodiaCameroonCanadaCape VerdeCayman IslandsCentral African RepublicChadChileChinaChristmas IslandCocos (Keeling) IslandsColombiaComorosCongoCook IslandsCosta RicaCote D'IvoireCroatiaCubaCyprusCzech RepublicDenmarkDjiboutiDominicaDominican RepublicEast TimorEcuadorEgyptEl SalvadorEquatorial GuineaEritreaEstoniaEthiopiaFalkland Islands (Malvinas)Faroe IslandsFijiFinlandFrance, MetropolitanFrench GuianaFrench PolynesiaFrench Southern TerritoriesGabonGambiaGeorgiaGermanyGhanaGibraltarGreeceGreenlandGrenadaGuadeloupeGuamGuatemalaGuineaGuinea-BissauGuyanaHaitiHeard and Mc Donald IslandsHondurasHong KongHungaryIcelandIndiaIndonesiaIran (Islamic Republic of)IraqIrelandIsraelItalyJamaicaJapanJordanKazakhstanKenyaKiribatiNorth KoreaSouth KoreaKuwaitKyrgyzstanLao People's Democratic RepublicLatviaLebanonLesothoLiberiaLibyan Arab JamahiriyaLiechtensteinLithuaniaLuxembourgMacauFYROMMadagascarMalawiMalaysiaMaldivesMaliMaltaMarshall IslandsMartiniqueMauritaniaMauritiusMayotteMexicoMicronesia, Federated States ofMoldova, Republic ofMonacoMongoliaMontserratMoroccoMozambiqueMyanmarNamibiaNauruNepalNetherlandsNetherlands AntillesNew CaledoniaNew ZealandNicaraguaNigerNigeriaNiueNorfolk IslandNorthern Mariana IslandsNorwayOmanPakistanPalauPanamaPapua New GuineaParaguayPeruPhilippinesPitcairnPolandPortugalPuerto RicoQatarReunionRomaniaRussian FederationRwandaSaint Kitts and NevisS