title = "Smart Phone - FTDI"
description = """
Smart Phone
\t\t\t\t\t\t\tCustom cables with embedded FTDI products can be used in factories to communicate over serial to run tests and write to the system configuration (for serial definitions etc) during production. This can be used to program parameters to the phone memory. Mobile phone tests can be done by UART MUX port where the PC sends commands to the phone to perform some functional test. The phone can receive commands from UART MUX port and will parse it and operate the command.

The FTDI IC can handle the serial mux interface from the mobile phone under test and control LEDs to show test status. FTDI can easily provide a USB interface to the test PC with our USB to UART based products.
FTDI IC’s have the following key features which make them an ideal candidate for this application:



USB Full/High/SuperSpeed connectivity depending on the application requirements.
Multiple data interfaces including UART, RS232, RS485, RS222, SPI, I2C, FIFO and GPIO.
Entire USB protocol handled on the chip. No USB specific firmware programming required.
EEPROM for customization.
Data transfer rates (up to): UART (12Mbaud), SPI (52.8Mbps), I2C (6.66Mbit/s), FIFO (Full Speed: 1Mbyte/s, High Speed: 40Mbyte/s, SuperSpeed: 400Mbyte/s)
Integrated receive and transmit buffers for high data throughput.
FTDI’s royalty-free drivers eliminate the requirement for USB driver development.
Low operating current and USB suspend current.
Extended operating temperature range: -40°C to 85°C (Industrial), -40°C to +105°C (Automotive)
Available in various compact Pb-free from 12 Pin DFN package (RoHS compliant).



The block diagram below shows how FTDI’s USB UART ICs can be integrated into this typical application.

Recommended ICs:
FT232RN
Any USB to UART IC (FT230X, FT231X, FT234X, FT232H)"""
