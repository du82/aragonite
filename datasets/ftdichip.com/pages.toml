ble is the multi-protocol synchronous serial engines (MPSSEs) which allow for communication using JTAG, I2C and SPI, and in the case of the dual channel FT2232H, on two channels simultaneously. Some key hardware features of FTx232H series ICs are: Entire USB protocol handled on the chip. No USB specific firmware programming required. USB 2.0 Hi-Speed (480Mbits/Second) and Full Speed (12Mbits/Second) compatible. Multi-Protocol Synchronous Serial Engine (MPSSE) to simplify synchronous serial protocol (USB to JTAG, I2C, SPI or bit-bang) design. UART transfer data rate up to 12Mbaud. (RS232 Data Rate limited by external level shifter). USB to asynchronous 245 FIFO mode for transfer data rate up to 8 MByte/Sec. USB to synchronous 245 parallel FIFO mode for transfers up to 40 Mbytes/Sec. Supports a half duplex FT1248 interface with a configurable width, bi-directional data bus (1, 2, 4 or 8 bits wide). CPU-style FIFO interface mode simplifies CPU interface design. Fast serial interface option. FTDI’s royalty-free Virtual Com Port (VCP) and Direct (D2XX) drivers eliminate the requirement for USB driver development in most cases. Adjustable receive buffer timeout. Configurable ACBUS I/O pins. An example of the usage of FTx232H in JTAG for debugging and programming application is shown in the block diagram. The FTx232H can be used in various JTAG applications for programming and debugging purposes. Here’s an outline of how you might use the FT232H for JTAG: Hardware Setup You’ll need to wire the FT232H to your target device’s JTAG interface. Typically, this involves connecting the FT232H’s GPIO pins to the JTAG signals (TCK, TDI, TDO, TMS) on your target device. The specific pin connections will depend on your target device’s JTAG interface. Driver Installation Ensure you have the appropriate drivers installed for the FT232H on your operating system. FTDI provides drivers for various platforms, including Windows, macOS and Linux. Software Configuration Use a programming language or software environment that supports the FT232H. Initialize the FT232H and configure pins for JTAG operation. See AN_129 Interfacing FT2232H Hi-Speed Devices to a JTAG TAP for some reference. JTAG Commands Implement the necessary JTAG commands for your specific application. This may include operations such as boundary scan testing, flash programming, device interrogation or debugging. Integration with Development Tools Integrate the FT232H-based JTAG solution into your development workflow. This could involve integrating with IDEs (Integrated Development Environments) like Visual Studio Code or Eclipse, using debugging tools like OpenOCD (Open On-Chip Debugger) or scripting automated testing procedures. Testing and Debugging Test your JTAG setup thoroughly to ensure proper functionality. Debug any issues that arise, such as incorrect pin mappings, signal integrity problems or communication errors. Deployment Once your FT232H-based JTAG solution is working correctly, deploy it in your production or development environment as needed. Overall, the FT232H provides a flexible and cost-effective solution for JTAG applications, offering compatibility with various platforms and programming languages. With proper setup and configuration, it can streamline the process of programming and debugging embedded systems and other JTAG-enabled devices. Recommended ICs: FT232H FT2232H FT4232 No stock. Please check with our global distributors below or contact your local distributor. #row-1611581541 > .col > .col-inner { padding: 10px 10px 10px 10px; } Login Username or email address * Password * Remember me Log in Lost your password? Register First name * Last name * Company name (optional) Phone * Email address * Password * Subscribe to our newsletterCountry * AfghanistanÅland IslandsAlbaniaAlgeriaAmerican SamoaAndorraAngolaAnguillaAntarcticaAntigua and BarbudaArgentinaArmeniaArubaAustraliaAustriaAzerbaijanBahamasBahrainBangladeshBarbadosBelarusBelauBelgiumBelizeBeninBermudaBhu