 to adjust settings (brightness, contrast, etc.) via a USB interface instead of using physical OSD controls. FTDI products can be integrated into various applications to allow for: Port expansion USB charging USB connectivity to phone or PC Data download Synchronization to application software either on PC or system with USB Host Firmware updates Configuration and more! FTDI IC’s have the following key features making it an ideal candidate for the application: USB Full / High / SuperSpeed connectivity depending on the application requirements Multiple data interfaces including UART, RS232, RS485, RS222, SPI, I2C, FIFO and GPIO Entire USB protocol handled on the chip. No USB specific firmware programming required. EEPROM for customization Data transfer rates (up to): UART (12Mbaud), SPI (52.8Mbps), I2C (6.66Mbit/s), FIFO (40MBps for USB2.0 and 400MB/s for USB3.0) Integrated receive and transmit buffers for high data throughput FTDI’s royalty-free drivers eliminate the requirement for USB driver development in most cases Battery Charger Detection which may be used by mobile devices to detect the presence of a charger on the USB port to enable higher current / faster charging of batteries Low operating current and USB suspend current Extended operating temperature range: -40°C to 85°C (Industrial), -40°C to +105°C (Automotive) Available in various compact Pb-free from as small as 12 Pin DFN package (RoHS compliant)! The block diagram below shows at a high level how FTDI’s IC can be integrated into the application. The USB port of the application can be connected to a phone, PC, tablet or embedded processor. The application software controls the FTDI IC which may be connected to a processor inside the application and communicates via one of the supported protocols (UART, RS232, RS485, RS222, SPI, I2C, FIFO and GPIO). This could allow for configuration, data download, firmware updates, etc. Another typical use case to integrate FTDI ICs into the application is to host the FTDI ICs with an MCU or embedded system which has a USB Host Controller allowing for port expansion and other various communications paths: Recommended ICs: All ICs No stock. Please check with our global distributors below or contact your local distributor. #row-772024981 > .col > .col-inner { padding: 10px 10px 10px 10px; } Login Username or email address * Password * Remember me Log in Lost your password? Register First name * Last name * Company name (optional) Phone * Email address * Password * Subscribe to our newsletterCountry * AfghanistanÅland IslandsAlbaniaAlgeriaAmerican SamoaAndorraAngolaAnguillaAntarcticaAntigua and BarbudaArgentinaArmeniaArubaAustraliaAustriaAzerbaijanBahamasBahrainBangladeshBarbadosBelarusBelauBelgiumBelizeBeninBermudaBhutanBoliviaBonaire, Saint Eustatius and SabaBosnia and HerzegovinaBotswanaBouvet IslandBrazilBritish Indian Ocean TerritoryBruneiBulgariaBurkina FasoBurundiCambodiaCameroonCanadaCape VerdeCayman IslandsCentral African RepublicChadChileChinaChristmas IslandCocos (Keeling) IslandsColombiaComorosCongo (Brazzaville)Congo (Kinshasa)Cook IslandsCosta RicaCroatiaCubaCuraçaoCyprusCzech RepublicDenmarkDjiboutiDominicaDominican RepublicEcuadorEgyptEl SalvadorEquatorial GuineaEritreaEstoniaEswatiniEthiopiaFalkland IslandsFaroe IslandsFijiFinlandFranceFrench GuianaFrench PolynesiaFrench Southern TerritoriesGabonGambiaGeorgiaGermanyGhanaGibraltarGreeceGreenlandGrenadaGuadeloupeGuamGuatemalaGuernseyGuineaGuinea-BissauGuyanaHaitiHeard Island and McDonald IslandsHondurasHong KongHungaryIcelandIndiaIndonesiaIranIraqIrelandIsle of ManIsraelItalyIvory CoastJamaicaJapanJerseyJordanKazakhstanKenyaKiribatiKuwaitKyrgyzstanLaosLatviaLebanonLesothoLiberiaLibyaLiechtensteinLithuaniaLuxembourgMacaoMadagascarMalawiMalaysiaMaldivesMaliMaltaMarshall IslandsMartiniqueMauritaniaMauritiusMayotteMexicoMicronesiaMoldovaMonacoMongoliaMontenegroMontserratMoroccoMozambiqueMyanmarNamibiaNauruNepalNetherlandsNew CaledoniaNew ZealandNicaraguaNigerNigeriaNiue