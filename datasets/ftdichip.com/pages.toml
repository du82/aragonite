full_description = "Future Technology Devices International Ltd. The USB Bridging Solutions Specialists Category ICCategory ModulesCategory CablesSearch #section_1769548896 { padding-top: 50px; padding-bottom: 50px; min-height: 550px; } Drivers Documents FAQ Contact Support Community #image_340193886 { width: 100%; } #gap-518119609 { padding-top: 30px; } #section_1407024759 { padding-top: 25px; padding-bottom: 25px; } #section_1653542028 { padding-top: 25px; padding-bottom: 25px; } #gap-702849159 { padding-top: 20px; } New Products - Power Delivery USB High Speed Devices USB High Speed device fully supports the latest USB Type-C and Power Delivery (PD) 3.0 controller standards enabling support for power negotiation. #text-269352215 { text-align: center; } FT232HPQ USD4.57 FT233HPQ USD4.67 FT2232HPQ USD5.89 FT2233HPQ USD5.99 FT4232HPQ USD6.67 FT4233HPQ USD6.77 #section_1751503039 { padding-top: 50px; padding-bottom: 50px; } Featured Products Chipi-X10 USD17.00 Add to cart TTL-234X-5V USD20.20 Add to cart USB-RS232-WE-1800-BT_0.0 USD25.80 Add to cart UMFT200XD-01 USD10.80 Add to cart #section_1236646534 { padding-top: 50px; padding-bottom: 50px; } News We are in Embedded World 2025 FTDI Chip to Showcase Advanced USB Solutions at Embedded World 2025. We will be participating in Embedded World 2025, at Hall 3A, Booth #429, where we will showcase live demonstrations of cutting-edge technology. Experience the... Read More embedded world North America 2024 Recent press speculation regarding requirement by UK Government to divest 80.2% shareholding in FTDI Public Response View All News #section_1711909525 { padding-top: 50px; padding-bottom: 50px; background-color: rgb(40, 56, 69); } Drivers Documentation Reference Design Software Examples #section_365251376 { padding-top: 50px; padding-bottom: 50px; } About Us FTDI Chip develops innovative silicon solutions that enhance interaction with the latest in global technology. The major objective from the company is to ‘bridge technologies’ in order to support engineers with highly sophisticated, feature-rich, robust and simple-to-use product platforms. These platforms enable creation of electronic designs with high performance, low peripheral component requirements, low power budgets and minimal board real estate. FTDI Chip’s long-established, continuously expanding Universal Serial Bus (USB) product line boasts such universally recognized product brands as the ubiquitous R-Chip, X-Chip, Hi-Speed and SuperSpeed USB 3.0 series. In addition to both host and bridge chips, it includes highly-integrated system solutions with built-in microcontroller functionality. Read More Future Technology Devices International Ltd. The USB Bridging Solutions Specialists #section_1022106272 { padding-top: 50px; padding-bottom: 50px; background-color: rgb(183, 28, 38); }"
