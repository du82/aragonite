full_description = "Corporate Profile Home / Corporate Profile Home / Corporate Profile #page-header-776764164 .page-title-inner { min-height: 250px; } #page-header-776764164 .title-bg { background-image: url(https://ftdichip.com/wp-content/uploads/2020/07/compo-AboutUs.jpg); } About Us FTDI Chip is a fab-less semiconductor company established in 1992, partnered with the world’s leading foundries. The headquarter is located in Glasgow, UK and is supported with research and development facilities in Glasgow and Singapore plus regional sales and technical support sites in Glasgow, Tigard (Oregon, USA) and Shanghai (China). FTDI Chip develops innovative silicon solutions that enhance interaction with the latest in global technology. The major objective from the company is to ‘bridge technologies’ in order to support engineers with highly sophisticated, feature-rich, robust and simple-to-use product platforms. FTDI Chip continues its philosophy of Design Made Easy, where it strives to incorporate device and system features in its chips that enable the designer to quickly and easily create and implement designs. We supplement this strategy, with WW regional support and a “total” solutions mindset to provide reduced development and debug costs and a fast time to market. #image_1205088451 { width: 100%; } #section_22664574 { padding-top: 50px; padding-bottom: 50px; } #image_1892843896 { width: 100%; } Corporate Headquarters Future Technology Devices International Limited Unit 1, 2 Seaward Place, Centurion Business Park, Glasgow, G41 1HH, United Kingdom Tel: +44 (0) 141 429 2777 Fax: +44 (0) 141 429 2758 E-Mail (Sales): sales1@ftdichip.com E-Mail (Support): support1@ftdichip.com E-Mail (General Enquiries): admin1@ftdichip.com Web Site URL: https://ftdichip.com #col-52959044 > .col-inner { padding: 50px 0px 50px 50px; max-width: 570px; } #section_1743436968 { padding-top: 0px; padding-bottom: 0px; background-color: rgb(40, 56, 69); } Disclaimer Links to external websites and