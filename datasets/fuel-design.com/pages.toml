Stalkers’ Guide a one-of-a-kind contribution to the Chernobyl archive. No other author has achieved such a comprehensive investigation of the Exclusion Zone. Bradley Garrett, author of Explore Everything and Bunker Interview with Darmon Richter Intrepid Times Exploring Chernobyl‘s Imprint on Neighboring Belarus Atlas Obscura Step inside the irradiated heart of the nuclear power plant GreyScape A new photo book offers a glimpse into the forgotten history of Chernobyl Creative Review Darmon Richter discusses his new book, ‘Chernobyl: A Stalkers‘ Guide‘, which takes a broader look at one of the world's most misunderstood regions. Degraded Orbit Writer and photographer Darmon Richter’s new book Chernobyl: A Stalkers’ Guide represents a study of the contemporary Exclusion Zone not as a “dead zone”, but as a “new Eden populated by scientists, settlers and scrap-metal thieves” AnOther"
