full_description = 'CCCP COOK BOOK: True Stories of Soviet Cuisine Previous project Next project Zoom Olga and Pavel Syutkin205x125 mm hardback192 pagesISBN 978-0-9931911-1-4Published in 2015 Sold out Featuring 60 recipes, each introduced with an insightful historical anecdote and accompanying image sourced from original Soviet recipe books. As the Soviet Union struggled along the path to Communism, food supplies were often sporadic and shortages commonplace. Day to day living was hard, both the authorities and their citizens had to apply every ounce of ingenuity to maximize often inadequate resources. The stories and recipes contained here reflect these turbulent times: from basic subsistence meals consumed by the average citizen (okroshka), to the extravagant banquets held by the political elite (suckling pig with buckwheat), and a scattering of classics (beef stroganoff) in between. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: grid; grid-template-columns: 1fr 1fr; } .related-touch h3 { grid-column: span 2; margin-bottom: 10px; } .related-touch .publication-cover { height: auto; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 60px; /* more space for title */ } .related-touch .publication-cover__title { padding-left: 5px; padding-right: 5px; } /*.related-touch .publication-cover:nth-child(2), .related-touch .publication-cover:nth-child(3), .related-touch .publication-cover:nth-child(6), .related-touch .publication-cover:nth-child(7) { background: #fee; } .related-touch .publication-cover:nth-child(2) div, .related-touch .publication-cover:nth-child(3) div, .related-touch .publication-cover:nth-child(6) div, .related-touch .publication-cover:nth-child(7) div { background: #fee; } */ Related publications ALCOHOL Russian Alphabet Colouring Book The Folly Acres Cook Book SOVIETS Notes from Russia Reviews Food for comrades. ‘Rumours are it’s in Jeremy Corbyn’s stocking this year’.The Guardian Gift Guide, Christmas 2015 This remarkable little book amounts to an enlightened history of Soviet food, characterized as much by magnificent European style and abundance as by post-revolutionary rationing. The postcard-like charm of the illustrations and photographs are enough to recommend the book, but the witty and informative text offers pleasure of its own.The New York Times From Russia with MayonnaiseInterview with Pavel Syutkin on NPR. As a practical cookbook, I have neither the will nor stomach to actually prepare any of these dishes, yet CCCP Cook Book is an amazing work of culinary history. The book as an object is a marvel. The heavy quality paper, the purposefully reproduced photos, the exposed stitching binding, all appeal to a collector’s artisanal instincts. It’s my new "You Must Buy This Book" recommendation for my foodie friends. Christina Ward, boing boing'
