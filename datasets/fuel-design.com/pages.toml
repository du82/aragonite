full_description = "AZ Record Shop Bags Previous project Next project Zoom £24.95 Buy Jonny Trunk 180 x 220 mm softback 240 pages ISBN: 978-1-9162184-8-2Published in 2022 A visual celebration of the shopping bags produced by British record stores between the 1940s and the 1990s. Fully illustrated with over 500 examples of this previously unrecorded aspect of popular culture. This unique book tells the graphic history of the British record shop through a huge and inspiring collection of original and exceptionally rare carrier bags. From large chains to hidden basements, with a cast of famous staff and eccentric owners, these paper and plastic bags bring the visceral history of music shopping to life. With a foreword by Jon Savage. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: grid; grid-template-columns: 1fr 1fr; } .related-touch h3 { grid-column: span 2; margin-bottom: 10px; } .related-touch .publication-cover { height: auto; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 60px; /* more space for title */ } .related-touch .publication-cover__title { padding-left: 5px; padding-right: 5px; } /*.related-touch .publication-cover:nth-child(2), .related-touch .publication-cover:nth-child(3), .related-touch .publication-cover:nth-child(6), .related-touch .publication-cover:nth-child(7) { background: #fee; } .relat