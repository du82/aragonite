["https://fuel-design.com/publishing/alcohol"]
title = "ALCOHOL | Current | Publishing / Bookshop | FUEL"
description = "Alcohol presents an exhaustive collection of previously unpublished, Soviet Anti-Alcohol posters. The book includes examples from the 1960s through to the 1980s, but focuses on those produced during the Mikhail Gorbachev campaign initiated in 1985."
full_description = "ALCOHOL: Soviet Anti-Alcohol Posters Previous project Next project Zoom £19.95 Buy ALCOHOLSoviet Anti-Alcohol Posters 205x125 hardbackLenticular cover248 pagesISBN: 978-0-9931911-5-2Published in 2017 Alcohol presents an exhaustive collection of previously unpublished, Soviet Anti-Alcohol posters. The book includes examples from the 1960s through to the 1980s, but focuses on those produced during the Mikhail Gorbachev campaign initiated in 1985.Displayed in public places these posters attempted to sober up the Soviet citizen by forcing them to confront the issues associated with excessive alcohol consumption. This allowed the poster designers to present the anti-alcohol message in the most graphic terms. They depicted drunks literally trapped inside the bottle or being strangled by ‘the green snake’. Their protagonists always produce sub-standard work, are smashed when pregnant, neglect their families and present a constant danger to fellow citizens. These dangerous elements are paralytic freeloaders and shirkers who drive under the influence, they are violent, black-marketeers and desperate cologne drinkers… An accompanying exhibition of Soviet anti-alcohol posters was held at Pushkin House, London WC1 from 23 March–13 April 2017. Photographed by Hugo Glendinning. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: grid; grid-template-columns: 1fr 1fr; } .related-touch h3 { grid-column: span 2; margin-bottom: 10px; } .related-touch .publication-cover { height: auto; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 60px; /* more space for title */ } .related-touch .publication-cover__title { padding-left: 5px; padding-right: 5px; } /*.related-touch .publication-cover:nth-child(2), .related-touch .publication-cover:nth-child(3), .related-touch .publication-cover:nth-child(6), .related-touch .publication-cover:nth-child(7) { background: #fee; } .related-touch .publication-cover:nth-child(2) div, .related-touch .publication-cover:nth-child(3) div, .related-touch .publication-cover:nth-child(6) div, .related-touch .publication-cover:nth-child(7) div { background: #fee; } */ Related publications Godless Utopia Looking for Lenin CCCP COOK BOOK Soviet Space Dogs SOVIETS Notes from Russia Reviews When Mikhail Gorbachev assumed the role of general secretary in 1985, he instituted measures “to Overcome Drinking, Alcoholism and to Eradicate Bootlegged Alcohol.” Booze sales slumped, drunks were tossed into shoddy rehab centers, bootlegging took off, and the desperate turned to dubious alcohol substitutes, like cologne and varnish. At least the Soviet anti-alcohol program leaves us with some lavishly illustrated, often very funny propaganda. [This book contains many] of the posters enlisted in the doomed effort to scale back the USSR’s consumption. Look them over with a chilled glass of Stolichnaya Elit and some fine caviar. The Paris Review Varnish, cologne and insecticide: how to drink like a Russian. The Telegraph The 248-page book takes an alternative look at end of a political era. Each poster is translated with slogans such as 'Little by little you end up with a hooligan' accompanied with graphics that include red-nosed and bleary eyed cartoon characters and hard hitting constructivist-style compositions.It’s Nice That FUEL’s book captures the bold, graphic attempts made by designers to try and mitigate an unfolding crisis in Soviet society.Creative Review ... the posters in Alcohol, along with its suitably dizzying lenticular cover design, expertly capture a nation’s attempts to ameliorate a social crisis in esoteric, colourful, and often humorous ways. Art Quarterly"
