description = "The Soviet Country Cottage"
full_description = "Dacha Previous project Next project Zoom £26.95 Buy Fyodor Savintsev160x200 mm hardback240 pagesISBN: 978-1-9162184-9-9Published in 2023 The Soviet Country Cottage A ‘dacha’ is a country cottage, made of wood, used by Soviet citizens to escape the rigors of the city for rural idyll. Widespread in the countries of the former USSR, this important cultural and architectural form has been largely ignored academically. In Dacha, Fyodor Savintsev documents this particularly Russian phenomenon, his photographs constitute a unique record of a rapidly vanishing fairytale wooden world.The word ‘dacha’ has been used to describe constructions ranging from grand imperial villas to small sheds. Originally bestowed by the Tsar to reward courtiers, this custom continued following the revolution, with Soviet cooperatives building dachas for their members. Supposedly for the benefit of labourers, in reality they were destined for those favoured by the State, including famous writers, architects and artists – from Pasternak to Prokofiev. The fall of the Soviet Union accelerated their use, as economic uncertainty forced city dwellers towards self-sufficiency. The dacha tradition has survived Revolution, war and the collapse of Communism, becoming an integral part of life in the process.With an introductory essay, illustrated with archive images by Anna Benn. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !impor