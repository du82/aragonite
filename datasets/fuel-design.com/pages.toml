description = "In Chernobyl: A Stalkers’ Guide, researcher Darmon Richter journeys into the contemporary Exclusion Zone, venturing deeper than any previously published account. While thousands of foreign visitors congregate around a handful of curated sites, beyond the tourist hotspots lies a wild and mysterious land the size of a small country. In the forests of Chernobyl, historic village settlements and Soviet-era utopianism have lain abandoned since the time of the disaster – overshadowed by vast, unearthly mega-structures designed to win the Cold War."
full_description = "Chernobyl: A Stalkers' Guide Previous project Next project Zoom £24.95 Buy Darmon Richter160x200 mm hardback248 pagesISBN: 978-1-9162184-2-0 Published in 2020 10% goes to the British Red Cross Ukraine Crisis Appeal. In Chernobyl: A Stalkers’ Guide, researcher Darmon Richter journeys into the contemporary Exclusion Zone, venturing deeper than any previously published account. While thousands of foreign visitors congregate around a handful of curated sites, beyond the tourist hotspots lies a wild and mysterious land the size of a small country. In the forests of Chernobyl, historic village settlements and Soviet-era utopianism have lain abandoned since the time of the disaster – overshadowed by vast, unearthly mega-structures designed to win the Cold War. Richter combines photographs of discoveries made during his numerous visits to the Zone with the voices of those who witnessed history – engineers, scientists, police and evacuees. He explores evacuated regions in both Ukraine and Belarus, finding forgotten ghost towns and Soviet monuments lost deep in irradiated forests. He gains exclusive access inside the most secure areas of the power plant itself, and joins the ‘stalkers’ of Chernobyl as he sets out on a high-stakes illegal hike to the heart of the Exclusion Zone. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: gri