description = "Brutal concrete hotels, futurist TV towers, heroic statues of workers—this collection of Soviet-era postcards documents the uncompromising landscape of the Eastern Bloc through its buildings and monuments. These are interspersed with quotes from prominent figures of the time, which both support and confound the ideologies presented in the images."
full_description = "Brutal Bloc Postcards Previous project Next project Zoom £22.50 Buy Foreword by Jonathan Meades 165x205 mm hardback 192 pages ISBN 978-0-9957455-2-0 Published in 2018 Brutal concrete hotels, futurist TV towers, heroic statues of workers—this collection of Soviet-era postcards documents the uncompromising landscape of the Eastern Bloc through its buildings and monuments. These are interspersed with quotes from prominent figures of the time, which both support and confound the ideologies presented in the images. In contrast to the photographs of a ruined and abandoned Soviet empire we are accustomed to seeing today, the scenes depicted here publicize the bright future of communism: social housing blocks, palaces of culture and monuments to comradeship. Dating from the 1960s to the 1980s, they offer a nostalgic yet revealing insight into social and architectural values of the time, acting as a window through which we can examine cars, people and of course, buildings. These postcards are at once sinister, funny, poignant and surreal. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: grid; grid-template-columns: 1fr 1fr; } .related-touch h3 { grid-column: span 2; margin-bottom: 10px; } .related-touch .publication-cover { height: auto; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 60px; /* more space for title */ } .related-touch .publication-cover__title { padding-left: 5px; padding-right: 5px; } /*.related-touch .publication-cover:nth-child(2), .related-touch .publication-cover:nth-child(3), .related-touch .publication-cover:nth-child(6), .related-touch .publication-cover:nth-child(7) { background: #fee; } .related-touch .publication-cover:nth-child(2) div, .related-touch .publication-cover:nth-child(3) div, .related-touch .publication-cover:nth-child(6) div, .related-touch .publication-cover:nth-child(7) div { background: #fee; } */ Related publications Spomenik Monument Database Soviet Bus Stops Volume II Holidays in Soviet Sanatoriums Looking for Lenin ALCOHOL Soviet Bus Stops SOVIETS Reviews Postcards From Big Brother: The Curious Propaganda of a Brutal Soviet Era Collectors Weekly A surreal insight into a time when the Soviet empire’s characteristic architecture was a symbol of optimism for the years ahead. AnOther A vital compilation of perverse nostalgia. We Heart Showcasing brutalist hotels, futurist TV towers, and bold concrete tower blocks, each image is a snapshot of the transformative decades between 1960 and 1990: from the endless optimism of Khrushchev's Thaw, to the closing years of the Cold War... it lets readers glimpse some of the former Eastern Bloc’s iconic landmarks at a time when they were prized and cherished. Calvert Journal They are visible indicators of the Soviet state’s capacity to change its environment but also, when viewed now in the slightly faux-colours of their postcard reproductions, monuments not to its success but to its eventual failure. The grand hotels, apartment blocks, cultural centres, and heroic statuary can look to a modern reader like the topography of a doomed utopian project. Russian Art + Culture Mundanity is exactly the quality these postcards wanted to give out. The idea of an architectural landscape built for the many was, (while) boring, still very much able to mesmerize. [...] They aren't aimed at design enthusiasts or architects, but at regular individuals. They are all the more convincing in their message because of that. [...] It might look quite surreal and strange today, but it's also an invaluable insight of the economic, social, even technological ambitions of the Eastern Bloc at the time. These are posters of a utopian totalitarianism. […] To me, they seem to say 'Look at the marvel of our collective buildings! This is progress, and we are part of it.' Owen Hatherley in CNN Style"
