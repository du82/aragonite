title = "Audio Erotica | Current | Publishing / Bookshop | FUEL"
description = "From austere post-war Britain to poppy pre-millennium Japan, Audio Erotica presents a nostalgic nirvana of the strangest and most significant period hi-fi brochures. Alphabetically listed, from Aiwa to Zenith, with Braun, JVC Nivico, Nakamichi, Sony and everything in between, this book will resonate with any music fan."
full_description = "Audio Erotica Previous project Next project Zoom £26.95 Buy 180 x 220 mm softback240 pagesScreenprinted coverISBN: 978-1-7398878-1-0Published in 2024 From austere post-war Britain to poppy pre-millennium Japan, Audio Erotica presents a nostalgic nirvana of the strangest and most significant period hi-fi brochures. Alphabetically listed, from Aiwa to Zenith, with Braun, JVC Nivico, Nakamichi, Sony and everything in between, this book will resonate with any music fan. Setting the tempo are the pipe-smoking, high-end separates (amplifiers, speakers, turntables) of the 1950s, followed by the swinging Dansette record players of the 1960s, the prog-brushed-metal music centres of the 1970s, and the sleek capitalist cabinet stack systems of the 1980s – not forgetting the aerobic stereo sound portability facilitated by the boom-box, and that final high-fidelity, hardware hurrah: the compact disc. All accompanied by questionable fashion decisions and acres of shag-pile carpet. The evocative brochures in Audio Erotica track the technological development of audio equipment before the digital download, while simultaneously revealing the way hi-fi was marketed to the listening public. With knobs on. .swiper-wrapper { align-items: center; } .spreads__slideshow { margin-top: 20px; margin-bottom: 15px; /*outline: 1px solid red;*/ position: relative; } .spreads__slideshow .slide__image img { object-fit: contain; max-width: 100vw; max-height: 50vw; } @media all and (min-width: 1145px) { .spreads__slideshow .slide__image img { max-width: 1145px; max-height: calc( 1145px * 0.5 ); } } .spreads__slideshow .nav-arrow { transform: none; } .swiper-pagination { position: static; width: 100%; } .swiper-pagination-bullet { margin: 0 3.5px; } .swiper-pagination-bullet-active { background: #000 !important; opacity: 1 !important; } Next Previous .related-touch { /*background: red;*/ display: grid; grid-template-columns: 1fr 1fr; } .related-touch h3 { grid-column: span 2; margin-bottom: 10px; } .related-touch .publication-cover { height: auto; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 60px; /* more space for title */ } .related-touch .publication-cover__title { padding-left: 5px; padding-right: 5px; } /*.related-touch .publication-cover:nth-child(2), .related-touch .publication-cover:nth-child(3), .related-touch .publication-cover:nth-child(6), .related-touch .publication-cover:nth-child(7) { background: #fee; } .related-touch .publication-cover:nth-child(2) div, .related-touch .publication-cover:nth-child(3) div, .related-touch .publication-cover:nth-child(6) div, .related-touch .publication-cover:nth-child(7) div { background: #fee; } */ Related publications AZ Record Shop Bags Auto Erotica Wrappers Delight The Music Library Own Label Reviews Graphic designers will find both books [Auto Erotica] as a treasure trove for art direction from bygone eras, as well as unique typefaces that, similar to the renewed interest in high end amps and turntables, is rearing its head into the style guides of emerging designers and corporate rebrands.Hypebeast Guaranteed to appeal to both closet hi-fi anoraks and connoisseurs of vintage product and graphic design, Jonny Trunk’s latest labour of love elevates the lure of all things hi-fi to almost fetishist objects of desire in their own right. A must have addition to any right-thinking record collector’s reference library.Shindig! AUDIO EROTICA | MIGHT WE INTEREST YOU IN A TEST DRIVE?FLAUNT Densely packed colour images on every page defy expectations set by the black, white, and grey cover. Breaking the conventions of book cover design, the title is camouflaged as a cassette label in the lower right corner, making this catalogue-of-catalogues present itself as a designer’s object or artist’s book. The Brooklyn Rail"
