description = "Bedtime Tales for Sleepless Nights is a book for ‘children’ in which Jake & Dinos Chapman re-imagine the Victorian morality tale. While their immorality tales are wrought from the innocent language of the children’s colouring book, the messages they sagely pass on to our younger folk are far from the saccharin coated yarns familiar to the genre. The scenes these tales depict are vivid and troubling, and will have dramatic consequences for the nocturnal serenity of the reader’s children…"
