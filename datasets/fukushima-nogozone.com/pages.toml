["https://www.fukushima-nogozone.com/copie-de-a-no-man-s-land"]
title = "Chiaroscuro - Clair obscur à Fukushima"
full_description = "Retrace our stepsAs far as the eyes can seeErasureSuspended Time Bad Dreams ?PortfolioMaking ofNewsAboutContactsA no man's land BACK© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/17The 1,000 square kilometers of land comprising the no-go zone around the Fukushima plant represent the most impressive, and most brutal, evidence of the nuclear accident. More than 80,000 people had to pack a few belongings and follow orders to evacuate, while others, fearful of radiation, left of their own volition, bequeathing ghost towns, almost devoid of light. Time has stood still. We went inside the no-go zone to examine those landscapes from a fresh perspective; using flashlights to illuminate the empty streets at night. This allowed us to select our viewpoint and decide which countryside buildings or features to bring into sharp relief. But instead of bringing these areas to life, the artificial lights highlight their desolation and exacerbate the sense of unease we felt standing amid these lost territories."
year_published = 2025
