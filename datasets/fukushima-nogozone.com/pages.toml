full_description = "PortfolioMaking ofNewsAboutContactsAbout 2011年3月、私たちが驚愕の中で福島第一原子力発電所周辺で目にしたのは、「ノーマンズランド」そのものだった。原子力発電所から約15キロの距離にある小高地区の中心部では、その時以来、時が止まってしまっている。道の真ん中に放置されたままのソファ、まるで主人の帰りを待っているかのように、泥だらけの窓から外を覗く一匹の猫。コインランドリーの店内で流れ続ける一昔前の音楽。このような現実は、福島第一原発から半径20キロ以内、今では立入禁止となった場所に住んでいた8万人もの人々が、いかにしてわずか数日のうちに避難せざるを得なかったか、その慌ただしさを物語っている。人のいなくなった町々で、私たちは異様な雰囲気に包まれた住民に出会った。マスクと放射線防護服を着用しパニック状態で走り回る人、次にどんな指示をだすべきか判断を迷っている警官。飢えた自分の馬を救おうとする畜産農家。避難のどさくさで数週間にわたり世話をされることのなかった馬たちは、地震と津波によって破壊された馬小屋の中でただ横たわっているだけだった。 私たちは、線量計の数値に注意しながら、恐る恐る前進して行った。「なるほど、これが原発事故というものか」と思いながら。約６か月後、その最初のショックを個人的な作品として表現したいと思い、そのなかで生まれたのが「福島ノーゴーゾーン」である。このプロジェクトの完成までには6年もの時間を要し、そのために私たちは何度も福島の立入禁止区域に向かうことになった。 私たちが最初に写真を撮ったのは2011年の12月だった。放射線防護服に身を包み、通過許可証を手にし、やっと原子力発電所から20キロ圏内に入ることができたのである。進入禁止区域内での報道や芸術を目的とした活動は厳重に制限されており、私たちは逮捕される可能性と常に隣り合わせだった。 福島で活動する間、私たちがまず恐れなければならなかったのは、放射能より治安当局だった。放射能は危険ではあったが、後者のリスクの方がより直接的で目に見えたものであったのである。 その日の夕方、私たちは原子力発電所から7㎞にあり、完全に津波により水没していた富岡駅に赴いた。すると線路の間で、私たちの車のヘッドライトが車の残骸を照らし出した。この津波の猛威や住民の避難を象徴するような光景は、シリーズ「ノーマンズランド」の最初の写真となった。そしてこの写真はある意味で、私達の作品全体のトーンを決定したのである。 私たちはそれ以来、この1986年のチェルノブイリ原発事故以降最悪の原子力災害の結果住民が居なくなった都市とその周辺、放射能の恐怖、困難な住民の帰宅、彼らの不在をいいことに本来の野生を顕にする自然、日本政府の政策による天文学的な量の放射能廃棄物などをひとつひとつ撮影していった。 この写真集は、この歴史的大災害の記録への私たちのささやかな貢献である。この出来事の終結は、福島第一原発においても、そして避難している人々にとっても依然として遠いものである。私たちは、今後も悲劇的かつ複雑なこの福島の歴史の一章をカメラに収めていくつもりである。 ​ Carlos Ayesta - Guillaume Bression Guillaume Bression ギヨーム・ブレッション ISAEとIFPを卒業後、2008年にはパリの学校で写真コースを専攻したきっかけで本格的に写真への道を歩み始める。２００９年にはカルロス・アイエスタ氏とオドレー・ボエリ氏とTROIS8（トルワユイット）を結成し、ドキュメンタリーや芸術的なプロジェクトをいくつか手がける。その共同作品がヨーロッパの写真フェスティバルやギャラリーで展示される。２０１０年以降はフリランスの写真家として日本に在住。 Carlos Ayesta １９８５年のカラカス生まれ。フリランスのフォトグラファーとしてパリを拠点に活躍する。特に建築写真を専門分野にする。2012年には、彼の作品が「SFR Young Talents & Exhibition « Doisneau-Paris Les Halles »」の一環としてフォーラム・デ・アルとパリ市役所で展示される。"
