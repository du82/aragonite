["https://www.fukushima-nogozone.com/copie-de-nature-1"]
title = "Retrace our steps - Revenir sur nos pas"
description = "Les plus de 80 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison..."
full_description = "回顧2500万立方メートル止まった時間悪夢ノーマンズランドPortfolioMaking ofNewsAboutContacts消し去ること BACK© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone1/19 東日本大震災により全国で３３万世帯が転居したが、福島県内での転居件数はおよそ７万1000世帯、住宅に住めなくなったことが理由で転居した世帯にかぎっても４万世帯にのぼるという。 震災から数年が経った、福島第一原発から２０キロ圏内の地域では、やむを得ず主人を失った家や建物がそのまま放置され、多くが廃墟と化している。そこで私たちが目撃したのは、家屋のみならず道路や車、人工物のすべてを、木や草が覆い尽くした様だった。人が住まなくなった環境において、その増殖の速さは人類の足跡まで消してしまうような勢いだ。 このシリーズは、福島の取り残された街並みを自然が呑み込んでいく、その様子を記録したものだ。"
