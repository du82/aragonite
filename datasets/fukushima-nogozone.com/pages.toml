full_description = 'INFORMATIONS 販売情報 Title / Titre タイトル : Retrace our steps Fukushima exclusion zone – 2011-2016 Authors / Auteurs 著者 : Carlos AYESTA - Guillaume BRESSION Text/Texte 作文: Christian Caujolle Design / Maquette モックアップ : Dominique Roynette Editor / Éditeur 出版社 : Kehrer Verlang Format 形式 : 160 pages 160ページ・/ 23 X 23 cm Languages / Langues : Englais/Français/Japonais 言語：英語・フランス語・日本語 ISBN: 978-3-86828-738-7 Price/ Prix: 39 euros 値段：39ユーロ（約4800円） ​ Depuis le tsunami et la catastrophe nucléaire de mars 2011 au Japon, Carlos Ayesta et Guillaume Bression se sont rendus à de nombreuses reprises dans la région de Fukushima et tout particulièrement dans le no man’s land qui entoure le site accidenté. De leurs différents séjours sur place résultent six séries photographiques à l’esthétique forte qui mêlent la mise en scène et l’approche documentaire. Des photos qui permettent de penser les différentes conséquences d’un accident nucléaire de cette ampleur.Press releaseOUT OF STOCK .heightByImageRatio::before { display: block; content: ""; } .heightByImageRatio0::before { padding-top: calc(100% / (3 / 2)); } .heightByImageRatio1::before { padding-top: calc(100% / (4 / 3)); } .heightByImageRatio2::before { padding-top: calc(100%); } .heightByImageRatio3::before { padding-top: calc(100% / (3 / 4)); } .heightByImageRatio4::before { padding-top: calc(100% / (2 / 3)); } .heightByImageRatio5::before { padding-top: calc(100% / (16 / 9)); } .heightByImageRatio6::before { padding-top: calc(100% / (9 / 16)); } Quick View BOOK - Retracing our steps 回顧Out of stock'
