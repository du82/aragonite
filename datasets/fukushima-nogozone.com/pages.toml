title = "temps suspendu | no-go-zone"
full_description = "PortfolioMaking ofNewsAboutContactsTemps suspendu BACKRevenir sur nos pasÀ perte de vue L'effacement Mauvais rêves ?A no man's land© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/20Des brocolis desséchés, des coquilles d’œuf et de la viande moisie. Leur date de péremption étant dépassée depuis longtemps, ces biens de consommations retrouvés dans les supermarchés de Fukushima sont devenus les vestiges pétrifiés d’un territoire désert, les reliques d’un Pompéi contemporain. Avec une pointe d’ironie, nous les avons photographiés sous forme de packshot, un mode de prise de vue généralement associé aux catalogues et à la promotion de produits en vente. Mais il s’agit d’un packshot décalé, réalisé à même le bitume bien loin des studios. Ces produits ne seront jamais vendus ni consommés, leur sort est de continuer à porter la trace du temps qui passe."
