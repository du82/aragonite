["https://www.fukushima-nogozone.com/clair-obscur"]
title = "Chiaroscuro - Clair obscur à Fukushima"
full_description = "À perte de vue Revenir sur nos pasL'effacement Temps suspenduMauvais rêves ?A no man's landPortfolioMaking ofNewsAboutContactsA no man's land BACK© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/17Un no man’s land de 1000 kilomètres carré aux alentours de la centrale de Fukushima. Cette zone morte est certainement la trace la plus brutale et la plus visible de l’accident nucléaire. Plus de 80 000 personnes ont dû plier bagages, laissant derrière elles des villes fantôme. Pas ou peu d’éclairage public, des rues vides, des magasins abandonnés. Depuis un an, le temps s’est suspendu. Nous nous sommes rendus dans cette zone d’exclusion, en partie interdite, pour découvrir ces paysages désolés sous un angle nouveau. A l’aide de flashs, nous avons éclairé ces villes désertes la nuit. Nous pouvions ainsi focaliser notre regard, imprimer une perspective, choisir un bâtiment, un paysage. Et les faire surgir de nulle part, comme une anomalie. Les lumières artificielles, loin de rendre vie à ces villes, soulignent l’absence et le vide. Les photographies froides et brutes accentuent le malaise ressenti devant ces territoires perdus."
year_published = 2025
clearnet = "https://www.fukushima-nogozone.com/clair-obscur"
