title = "Portfolio Fukushima"
full_description = "PortfolioMaking ofNewsAboutContacts Portfolio 回顧 ​ もし原発事故による避難者が突然自分の家に戻れば何が起きるのだろう。 日常と不思議とが絡み合うような、どことなく不安にさせる写真が出来るであろう。 2500万立方メートル ​ 5階建てビルを越える高さに積み上げられた黒い袋がある。 幾何学的でエンドレスなこのフレスコ画「2500万立方メートル」は、福島県の除染計画の整然として体系的な様相を見せ、またその法外さも見せている。 不穏な自然 ​ 東日本大震災により全国で３３万世帯が転居したが、福島県内での転居件数はおよそ７万1000世帯、住宅に住めなくなったことが理由で転居した世帯にかぎっても４万世帯にのぼるという。 止まった時間 ​ 乾燥しきったブロッコリにカビの生えたお肉。立ち入り禁止区域にあるスーパーの食品は、もはや現代版ポンペイの名残りのように映る。 悪夢 目に見えないもの、におわないものをどういう風に表現すれば良いのだろう。 プラスチック性の巨大泡とセロハンを用いたこれらの演出は、放射能を可視化することが狙いである。虚構が現実を露にする瞬間。 ノーマンズランド ​ 福島の立ち入り禁止区域にある建物や景色は、フラッシュで撮られる瞬間、 暗闇の中から 異様な雰囲気を漂わせるように我々の目の前に現れてくる。"
