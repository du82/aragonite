["https://www.fukushima-nogozone.com/porfolio"]
title = "Portfolio Fukushima"
full_description = "PortfolioMaking ofNewsAboutContacts Portfolio REVENIR SUR NOS PAS ​ Que se passerait-il si les réfugiés du nucléaire revenaient vivre chez elles d’un coup d’un seul ? Des photos dérangeantes qui mêlent le banal à l’étrange À PERTE DE VUE ​ Présentée comme une fresque, cette série montre la démesure de la décontamination des alentours de la centrale de Fukushima – un projet inédit par son ampleur - mais aussi son caractère systématique et organisé… L’EFFACEMENT ​ Une nature luxuriante et inquiétante, quelques années après la catastrophe, elle recouvre tout, les maisons, les voitures et les routes. TEMPS SUSPENDU ​ Des brocolis desséchés et de la viande moisie. Ou quand des packshots servent à promouvoir les produits périmés de la zone interdite de Fukushima.MAUVAIS REVES ​ Comment montrer ce qui ne se voit pas, ne se sent pas ? Ces mises en scènes faites de bulles et de films en plastique visent à rendre visible la radioactivité. Ou quand la fiction révèle le réel.A NO MAN’S LAND ​ Photographiés de nuit avec l’aide de flash, les paysages et les bâtiments de la zone interdite de Fukushima surgissent de nulle part, comme des anomalies."
year_published = 2025
