full_description = '''PortfolioMaking ofNewsAboutContacts" I cry when I talk. I cry when I look at my photographs. I’ve cried so much I don’t have any tears left. They’ve all dried out. Now, you can see I’m smiling … that’s because I feel a bit better. But I can’t go home because of the radiation " Sakuko MATSUMOTO 日本語ENTERFRANÇAISA no mans land-©-Ayesta-Bression-2Retrace_our_steps-©-Ayesta-Bression-21nature-©-Ayesta-Bression-14A no mans land-©-Ayesta-Bression-21/8"I was born here in Namie, 10 km away from the nuclear power station, and of course I’d like to go back. Despite the evacuation, I’ve kept my permanent address in Name because, deep down, I’m a resident of Namie, no matter where I go. But as the years have gone by, I’ve ended up telling myself that it’s time to move on because the town will never be the same, everybody’s in the process of buying houses elsewhere." Keiko Suzuki "After March 11, 2011, proprietors complied with the evacuation order by leaving animals in their enclosures. In the beginning, I didn’t dare set foot on this farm. But three weeks later, I was too worried and I came in. Almost all the cows were already dead or in the throes of agony." Naoto Matsumura "My grandfather opened this toy store 70 years ago. My family is an important family in the town. There were about 50 of us living in Namie or Odaka and we are all nuclear refugees now. The government wants to reopen the town of Namie in 2017. But just some of the houses will be decontaminated. So, what will happen if a child goes playing around them...? What the government’s doing right now doesn’t make any sense." Yuzo Mihara " We are seniors. If anyone decided to come home to the no-go zone, a hospital nearby would be the most important thing for us. Even outside the no-go zone, where we’re refugees, I have to get up at 5 in the morning, the line is so long to see a doctor. If the hospitals don’t reopen in the zone, nobody will come back." Tamotsu Hayakawa " First, I want to know if my neighbors will return. If they won’t, then neither will I " Kaoru SATO In March 2011, we were distraught by the sight of the no man’s land around the nuclear power station. In the city center of Odaka, about fifteen kilometers away from the power station, time had suddenly come to a standstill. A couch had been left in the middle of the road, a cat was watching from a mud-covered windowpane as though in anticipation of its owners’ return, old-fashioned music continued to resound from a laundromat’s interior. These details recalled the urgency with which the 80 000 residents of the no-go zone had fled, a territory of a radius of 20 km around the Fukushima Daiichi site having been evacuated in just a few days. Still, we came across the odd inhabitant in the midst of these deserted towns: residents in masks and radiological protection suits running about in panic, police officers who were a bit lost, not knowing what instructions to give, or a breeder trying to save his famished horses. Several of his horses, abandoned for several weeks due to the evacuation, were housed in this stable that had been largely destroyed by the seism and tsunami. For our part, we moved forward, eyes riveted on our dosimeter: “So this is what a nuclear accident is like.” Six months later, we wanted to convert this initial shock into a personal artistic project. “Fukushima no-go zone” was born. This long-term work was to go on for six years and took us to the forbidden zone of Fukushima multiple times. Our first photograph was taken in December 2011. Equipped with radiological protection suits and passes, we were able to cross the checkpoint 20 km away from the power station. As journalistic and artistic activities within the no-go zone were strictly limited, we had the threat of a police arrest hanging over us. Throughout our work in Fukushima, fear of the authorities was finally superseded by fear of radioactivity, which in our view represented a less tangible and immediate danger. Late in the evening, we arrived at Tomioka train station, 7 km away from the nuclear power station, which had been entirely submerged by the tsunami. In between the rails, our headlamp lit up the husk of a car. This unexpected apparition—in our eyes, symbolic of the tsunami and the inhabitants’ evacuation—gave rise to the first photo in the “A No-man’s Land” series. And, in a certain way, it set the tone for all of our photographic work. Since then, we have been applying ourselves to unfolding, one by one, the consequences of this nuclear disaster, the most serious since the Chernobyl accident in 1986: towns and rural areas emptied of their inhabitants, the fear of radioactivity, the difficult matter of going back, nature that is reclaiming its rights in the absence of humans, and the astronomical quantities of polluted waste issuing from the decontamination campaign launched by the Japanese authorities. This photographic work is our contribution to the narrative of a historic disaster. The accident is far from being over, either at the power station or among the nuclear refugees. And we hope to continue to testify to this sad but also multifaceted page of the Fukushima region’s history. ​ ​ Carlos Ayesta - Guillaume Bression By Christian CAUJOLLE​ ​ On March 11, 2011, a magnitude-9 earthquake shook the north-east of Japan, in the Sendai region. This seism triggered a spectacular tsunami, the waves of which reached a height of more than 30 meters in some places. We all saw the terrifying images—they were shown in loops on televisions across the world before being dispelled by other dramatic news—of this wall of water that destroyed everything in its progress, carried everything away, heedlessly redefined the ocean-side landscape up to ten kilometers inland. Like all news images, they disappeared the moment the media tried to “show” another consequence of the tsunami: the nuclear accident at Fukushima, which affected the power station of the same name and delimited what has become a forbidden territory. Images of densitometers and figures in radiological protection suits were shown repeatedly. There were 150 000 displaced persons in Fukushima prefecture alone. ​ Carlos Ayesta and Guillaume Bression were on the scene very quickly. In order to take stock. To see. They were staggered by what they saw. They took photographs not in order to testify but out of necessity, because they were there and could not believe their eyes, and that is what transformed their astonishment into a project: the outrageousness of the situation. ​ It is an atypical project, profoundly linked to photography’s role as a documentary medium. One does not require the truth from it, but a form of operational neutrality that allows photographers to assume a position and express themselves. A project that comes in a succession of renewed points of view, analytical angles that are different each time, visual proposals that may even seem contradictory. The will to document resides in the intention, in the will to explore a situation in as complete a manner as possible, including what the situation comprises of the invisible, of the non-visual. Not in what it is customary to call “documentary style”, which is based on repetition of frame, of point of view, in order to make up an ensemble of images that we can compare and mix and match. Each series, which has been planned and produced as a unit, is highly coherent. It even, occasionally, has a demonstrative dimension. When the series are brought together, we realize that we are progressing from the detail, with objects, painful still-lifes, to the monumental, the infinitely large, with the 25 000 000 cubic meters of contaminated soil which have been piled together within walls protected by plastic. It is a universe, in all its dimensions, that has been affected. By playing in turn with the observation—exuberant nature—, with the production—the protagonists’ return to their former places of residence—, with fiction or realism, the two authors practice the potentials of photography in its interpretative relationship to the real with incredible freedom. They assume a position and, at the same time, since they decide on a very precise plan at each stage, they deliver to us, by blending the different approaches, a troubling result, which provides access to information but demonstrates nothing, an effect is desolate and visually dazzling at the same time. And, more important than everything, while they have made a pact with time in order to put together this ensemble, they cause us to see the extent to which time is wounded, deeply, for thousands of people, for an earth. Nothing, after years of work, allows a glimpse of an open future, a change. Everything seems to have become immutable, unless nature accelerates its development. ​ One could analyze each series, take apart the oeuvre’s visual logic that ensures its impact. It is more important to linger on what constitutes the true photographic basis of this long-term work: color. The tsunami’s aftermath, the Fukushima disaster, generated a great number of photographic works. Documentary or conceptual, serial or literary. Many among those that were elaborated over a long period are in black and white. By choosing color, by deciding on methods without regard to color processing, Carlos Ayesta and Guillaume Bression are not seeking “realism”. But they affirm, unlike other photographers, that their work is constructed today, at the moment when the facts that mobilized them and prompted their reaction were taking place. To be of one’s time, to confront the issues of one’s time is a courageous decision. It is also a necessity. NEWS #comp-j9o0uemj #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_j9o0uen6_Array__0 .paginationPrev{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}#comp-j9o0uemj #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_j9o0uen6_Array__0 .paginationNext{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}WINNERS NEW DISCOVERY AWARD 2017 - Les Rencontres d'Arles September 28, 2017Carlos Ayesta & Guillaume BressionRetracing Our Steps, Fukushima Exclusion Zone – 2011-2016Le 247, Paris, France Carlos Ayesta and Guillaume Bression rushed to Fukushima after the March 2011 earthquake and tsunami. To see for themselves. To bear witness. They photographed not to testify but by necessity, because they could not believe their eyes, and that—the unbelievable magnitude of the devastation—turned their amazement into a project. An atypical project deeply linked to the role of a certain kind of documentary photography expected not to tell the truth, but to offer a form of operational neutrality by which photographers situate and express themselves. The show can be split up into a series of repeated perspectives, ever-different angles of analysis and proposals that might seem contradictory, in order to probe a situation as thoroughly as possible, including what is non-visible and non-visual. Christian Caujollewww.rencontres-arles.comExhibition - JIMEI X ARLES 2017 INTERNATIONAL PHOTO FESTIVAL November 24, 201725 NOVEMBRE 2017 - 3 JANVIER 2018The third Jimei x Arles International Photo Festival will take place in Xiamen (south of China) from November 25, 2017 to January 3, 2018. Co-created by Sam Stourdzé, the director of famous international photo festival Rencontres d’Arles (France), and Chinese photographer RongRong (also the founder of Three Shadows Photography Art Centre (www.threeshadows.cn), first professional art center in China dedicated to photography), Jimei x Arles features international artists selected from Rencontres d’Arles (www.rencontres-arles.com) alongside Chinese and Asian photography talents. The festival has attracted more than 100,000 visitors since its inception in 2015.www.rencontres-arles.comExhibition Fotofever paris 2017 November 07, 20176th edition of the contemporary photography art fair FOTOFEVER PARIS 201710 > 12 NOV 2017 ● CARROUSEL DU LOUVRE The international contemporary photography art fair returns to the Carrousel du Louvre for its 6th edition, with the Galerie Le 247 from Paris www.fotofever.comExhibition - Galerie DOMUS et L’Enssib - Université Claude Bernard Lyon October 15, 2017Du 10 octobre au 23 novembre 2017Vernissage en présence des artistes le jeudi 12 octobre : 18h00 à l’Enssib 18h30 à la Galerie Domuswww.galeriedomus.univ-lyon1.frExhibition LANDSKRONA FOTO FESTIVAL September 09, 2017Landskrona Foto is one of the most important institutions in Scandinavia for photographic mediation, research and conservation.www.landskronafoto.orgExhibition festival Getxophoto August 31, 2016September - October​www.getxophoto.comNew Book !!! Retracing our stepsDecember 31, 2016Fukushima exclusion zone 2011-2016rer éléments.More information - Buy the book New series : 25 millions cubic metre !August 18, 2016We have just finished a new series, the 6th of this long term Fukushima project ! It will be featured in our book! A part of it can already be seen on the dedicated website of the project.See the seriesExhibition In OrleansSeptember 29, 2016​Please reload.app1[data-state~="content"] .app1error {display:none;}.app1[data-state~="content"] .app1loading {display:none;}.app1[data-state~="error"] .app1inlineContent {display:none;}.app1[data-state~="error"] .app1loading {display:none;}.app1[data-state~="loading"] .app1inlineContent {opacity:0.1;}.app1[data-state~="loading"] .app1loading {position:absolute;top:0;right:0;bottom:0;left:0;-webkit-animation:app1_semi-rotate 1s 1ms linear infinite;animation:app1_sem