description = "This photographic work about Fukushima exclusion zone is our contribution to the narrative of a historic disaster. The accident is far from..."
full_description = '''PortfolioMaking ofNewsAboutContacts" Quand je parle, je pleure. Quand je vois mes photos, je pleure. Je n’ai plus de larmes à force de pleurer. Elles ont toutes séché. Là, vous me voyez en train de rire parce que je vais un peu mieux. Mais je ne peux pas rentrer chez moi, à cause de la radioactivité ." Sakuko MATSUMOTO 日本語ENGLISH ENTRERA no mans land-©-Ayesta-Bression-2Retrace_our_steps-©-Ayesta-Bression-21nature-©-Ayesta-Bression-14A no mans land-©-Ayesta-Bression-21/8"Je suis née ici à Namie, à 10 km de la centrale nucléaire, et bien sûr je voudrais revenir. Malgré l’évacuation, j’ai conservé mon adresse permanente à Namie parce qu'au fond je me sens résidente de Namie, peu importe où je vais. Mais avec les années, j’ai fini par me dire qu’il était temps de passer à autre chose car la ville ne sera plus jamais la même, tout le monde est en train de racheter des maisons ailleurs." Keiko Suzuki "Après le 11 mars 2011, les propriétaires ont suivi l'ordre d'évacuation en laissant les bêtes dans leur enclos. Au départ, je n'ai pas osé pénétrer dans cette ferme. Mais trois semaines après, j’étais trop inquiet et j'ai franchi le pas. Presque toutes les vaches étaient déjà mortes ou en train d’agoniser. " Naoto Matsumura "Mon grand-père a ouvert ce magasin de jouets il y a 70 ans. Ma famille est une famille importante de la ville. Nous étions environ 50 à vivre à Namie ou à Odaka et nous sommes tous des réfugiés du nucléaire maintenant. Le gouvernement souhaite rouvrir la ville de Namie en 2017. Mais seule une partie des maisons seront décontaminées. Alors, que se passera-t-il si un enfant joue aux alentours... ? Ce que le gouvernement est en train de faire n'a aucun sens." Yuzo Mihara " Nous sommes des personnes âgées. Si on décidait de rentrer dans la zone interdite où se trouvait notre maison, un hôpital à proximité serait la chose la plus importante pour nous. Même à l’extérieur de la zone interdite où nous sommes réfugiés, je suis obligé de me lever à 5 heures du matin tellement la file d’attente est longue pour voir un médecin. Si les hôpitaux ne rouvrent pas dans la zone, personne ne reviendra." Tamotsu Hayakawa " Je veux attendre de savoir si mes voisins reviendront eux aussi. Sinon, je ne rentrerai pas. " Kaoru SATO En mars 2011, nous avons découvert, hallucinés, le no man’s land autour de la centrale nucléaire. Dans le centre-ville d’Odaka à une quinzaine de kilomètres de la centrale, le temps s’était subitement interrompu. Un canapé avait été laissé au milieu de la route, un chat regardait par la vitre d’une fenêtre couverte de boue comme s’il attendait le retour de ses maîtres, une musique ringarde continuait de résonner à l’intérieur d’une laverie automatique. Ces détails rappelaient l’urgence avec laquelle les 80 000 résidents de la zone interdite avaient pris la fuite, un territoire d’un rayon de 20 km autour du site de Fukushima Daiichi ayant été évacué en seulement quelques jours. Au milieu des villes désertes, nous croisions pourtant de rares habitants : des résidents en masque et combinaison radiologique courant affolés, des policiers un peu perdus ne sachant pas quelle instruction donner ou encore un éleveur essayant de sauver ses chevaux affamés. Plusieurs de ses chevaux, abandonnés pendant plusieurs semaines à cause de l’évacuation, gisaient dans cette étable en grande partie détruite par le séisme et le tsunami. De notre côté, nous avancions, les yeux rivés sur notre dosimètre : « C’est donc cela un accident nucléaire ». Six mois plus tard nous avons voulu convertir ce choc initial en un projet artistique personnel. « Fukushima no go zone » était né. Ce travail au long cours allait durer six ans et nous a conduit à de multiples reprises dans la zone interdite de Fukushima. Notre première photographie a été prise en décembre 2011. Munis d’une combinaison radiologique et d’un laisser passer, nous avons pu franchir le check-point, à 20 km de la centrale nucléaire. Les activités journalistiques et artistiques à l’intérieur de la zone interdite étant strictement limitées, nous étions habités par la menace d’une interpellation par la police. Pendant toute la durée de notre travail à Fukushima, la peur des autorités l’a finalement emporté sur la crainte de la radioactivité qui représentait à nos yeux un danger moins palpable et immédiat. Tard dans la soirée, nous avons rejoint la gare de Tomioka, à 7 km de la centrale nucléaire et qui avait été entièrement submergée par le tsunami. Au milieu des rails, notre lampe frontale a éclairé une épave de voiture. Cette apparition inattendue – symbolique pour nous du tsunami et de l’évacuation des habitants – a donné lieu à la première photo de la série « A no man’s land ». Et d’une certaine façon, elle a donné le ton à tout notre travail photographique. Depuis lors, nous nous sommes attachés à déplier une à une les conséquences de cette catastrophe nucléaire, la plus grave depuis l’accident de Tchernobyl en 1986 : les villes et les campagnes vidées de leurs habitants, la peur de la radioactivité, la question difficile du retour, la nature qui reprend ses droits en l’absence de l’homme et les quantités astronomiques de déchets pollués issus de la campagne de décontamination lancée par les autorités japonaises. Ce travail photographique est notre contribution au récit d’une catastrophe historique. L’accident est loin d’être terminé, ni à la centrale, ni parmi les réfugiés du nucléaire. Et nous espérons continuer à témoigner de cette page triste mais également riche de l’histoire de la région de Fukushima. ​ ​ ​ ​ ​ Carlos Ayesta - Guillaume Bression Par Christian CAUJOLLE​ ​ Le 11 mars 2011 un tremblement de terre de magnitude 9 a ébranlé le nord-est du Japon, dans la région de Sendai. Ce séisme a déclenché un spectaculaire tsunami dont les vagues ont atteint par endroits une hauteur de plus de 30m. Nous avons tous vus les images terrifiantes – elles ont tourné en boucle sur les télévisions du monde entier avant d’être chassées par d’autres actualités dramatiques - de ce mur d’eau qui détruisait tout sur son passage, qui emportait tout, redéfinissait sans tenir compte du poids des choses le paysage du bord de mer, jusqu’à 10 km à l’intérieur des terres. Comme toutes les images d’actualité, elles ont disparu au moment où les media tentaient de « montrer » une autre conséquence du tsunami : l’accident nucléaire de Fukushima, affectant la centrale du même nom et délimitant ce qui est devenu un territoire interdit. Les images de densitomètres et de personnages en combinaisons radiologiques se sont répétées. Il y a eu 150 000 déplacés dans la seule préfecture de Fukushima. Carlos Ayesta et Guillaume Bression sont allés très vite sur place. Pour se rendre compte. Pour voir. Ils sont restés sidérés de ce qu’ils voyaient. Ils ont photographié non pour témoigner mais par nécessité, parce qu’ils étaient là et ne pouvaient en croire leurs yeux et c’est cela qui a transformé leur étonnement en projet : la démesure de la situation. ​ Projet atypique, lié profondément à une fonction documentaire de la photographie à laquelle on demande non point la vérité mais une forme de neutralité opérationnelle permettant aux photographes de se situer et de s’exprimer. Projet qui se décline en une succession de points de vue renouvelés, d’angles d’analyse à chaque fois différents, de propositions visuelles qui pourraient même sembler contradictoires. La volonté documentaire réside dans le propos, dans la volonté d’explorer de la façon la plus complète possible une situation, y compris dans ce qu’elle a de non visible, de non visuel. Pas dans ce qu’il est convenu de nommer « style documentaire » qui se fonde sur la répétition du cadre, du point de vue, afin de constituer un ensemble d’images que nous puissions comparer et combiner de façon complémentaire. ​ Chaque série, qui correspond à une décision de dispositif et de mode de traitement, est d’une grande cohérence. Elle a même, parfois, une dimension démonstrative. Lorsqu’on les réunit, on constate que l’on va du détail, avec les objets, les natures mortes douloureuses, au monumental, à l’infiniment grand, avec les 25 000 000 de mètres cubes de terre contaminée qui ont été rassemblés dans des murs protégés par du plastique. C’est un univers, dans toutes ses dimensions, qui a été affecté. En jouant tour à tour du constat – une nature exubérante – , de la mise en scène – le retour des personnages sur leurs anciens lieux de vie -, de la fiction ou du réalisme, les deux auteurs pratiquent avec une incroyable liberté les possibles de la photographie dans son rapport interprétatif au réel. Ils prennent position et, en même temps, comme ils décident à chaque étape d’un dispositif très précis, ils nous livrent en mêlant les différentes approches un résultat troublant, qui donne accès à des informations mais ne démontre rien, qui est à la fois désolé et visuellement brillant. Et, plus important que tout, alors qu’ils ont pactisé avec le temps pour constituer cet ensemble, ils nous font percevoir à quel point le temps est blessé, profondément, pour des milliers de gens, pour une terre. Rien, après des années de travail, ne laisse entrevoir un avenir ouvert, un changement. Tout semble être devenu immuable, si ce n’est la nature qui accélère son développement. ​ On pourrait analyser chaque série, démonter la logique visuelle à l’œuvre qui en assure l’impact. Il est plus important de s’attarder sur ce qui constitue la vraie base photographique de ce travail au long cours : la couleur. L’après tsunami, la catastrophe de Fukushima ont généré bien des travaux photographiques. Documentaires ou conceptuels, sériels ou littéraires. Beaucoup, parmi ceux qui ont été élaborés sur la durée, sont en noir et blanc. En choisissant la couleur, en déterminant des modalités sans effet de leur traitement de la couleur, Carlos Ayesta et Guillaume Bression ne recherchent aucun « réalisme ». Mais ils affirment, contrairement à d’autres photographes, que leur travail se construit aujourd’hui, au moment où les faits qui les ont mobilisés et fait réagir se sont déroulés. Etre de son temps, affronter les questions de son temps est une décision courageuse. Et une nécessité.NEWS #comp-j9o0t463 #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_Array__0 .paginationPrev{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}#comp-j9o0t463 #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_Array__0 .paginationNext{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}WINNERS NEW DISCOVERY AWARD 2017 - Les Rencontres d'Arles September 28, 2017Carlos Ayesta & Guillaume BressionRetracing Our Steps, Fukushima Exclusion Zone – 2011-2016Le 247, Paris, France Carlos Ayesta and Guillaume Bression rushed to Fukushima after the March 2011 earthquake and tsunami. To see for themselves. To bear witness. They photographed not to testify but by necessity, because they could not believe their eyes, and that—the unbelievable magnitude of the devastation—turned their amazement into a project. An atypical project deeply linked to the role of a certain kind of documentary photography expected not to tell the truth, but to offer a form of operational neutrality by which photographers situate and express themselves. The show can be split up into a series of repeated perspectives, ever-different angles of analysis and proposals that might seem contradictory, in order to probe a situation as thoroughly as possible, including what is non-visible and non-visual. Christian Caujollewww.rencontres-arles.comExhibition - JIMEI X ARLES 2017 INTERNATIONAL PHOTO FESTIVAL November 24, 201725 NOVEMBRE 2017 - 3 JANVIER 2018The third Jimei x Arles International Photo Festival will take place in Xiamen (south of China) from November 25, 2017 to January 3, 2018. Co-created by Sam Stourdzé, the director of famous international photo festival Rencontres d’Arles (France), and Chinese photographer RongRong (also the founder of Three Shadows Photography Art Centre (www.threeshadows.cn), first professional art center in China dedicated to photography), Jimei x Arles features international artists selected from Rencontres d’Arles (www.rencontres-arles.com) alongside Chinese and Asian photography talents. The festival has attracted more than 100,000 visitors since its inception in 2015.www.rencontres-arles.comExhibition Fotofever paris 2017 November 07, 20176th edition of the contemporary photography art fair FOTOFEVER PARIS 201710 > 12 NOV 2017 ● CARROUSEL DU LOUVRE The international contemporary photography art fair returns to the Carrousel du Louvre for its 6th edition, with the Galerie Le 247 from Paris www.fotofever.comExhibition - Galerie DOMUS et L’Enssib - Université Claude Bernard Lyon October 15, 2017Du 10 octobre au 23 novembre 2017Vernissage en présence des artistes le jeudi 12 octobre : 18h00 à l’Enssib 18h30 à la Galerie Domuswww.galeriedomus.univ-lyon1.frExhibition LANDSKRONA FOTO FESTIVAL September 09, 2017Landskrona Foto is one of the most important institutions in Scandinavia for photographic mediation, research and conservation.www.landskronafoto.orgExhibition festival Getxophoto August 31, 2016September - October​www.getxophoto.comNew Book !!! Retracing our stepsDecember 31, 2016Fukushima exclusion zone 2011-2016rer éléments.More information - Buy the book New series : 25 millions cubic metre !August 18, 2016We have just finished a new series, the 6th of this long term Fukushima project ! It will be featured in our book! A part of it can already be seen on the dedicated website of the project.See the seriesExhibition In OrleansSeptember 29, 2016​Please reload.app1[data-state~="content"] .app1error {display:none;}.app1[data-state~="content"] .app1loading {display:none;}.app1[data-state~="error"] .app1inlineContent {display:none;}.app1[data-state~="error"] .app1loading {display:none;}.app1[data-state~="loading"] .app1inlineContent {opacity:0.1;}.app1[data-state~="loading"] .app1loading {position:absolute;top:0;right:0;bottom:0;left:0;-webkit-animation:app1_semi-rotate 1s 1ms linear infinite;animation:app1_semi-rotate 1s 1ms linear infinite;height:30px;left:50%;margin-left:-15px;margin-top:-15px;overflow:hidden;position:absolute;top:50%;-webkit-transform-origin:100% 50%;transform-origin:100% 50%;width:15px;}.app1[data-state~="loading"] .app1loading::before {content:'';top:0;left:0;right:-100%;bottom:0;border:3px solid currentColor;border-color:currentColor transparent transparent currentColor;border-radius:50%;position:absolute;-webkit-transform:rotate(-45deg);transform:rotate(-45deg);-webkit-an'''
