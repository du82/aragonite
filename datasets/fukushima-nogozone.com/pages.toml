title = "Fukushima, No Go Zone"
description = "Les plus de 110 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison..."
full_description = '''PortfolioMaking ofNewsAboutContacts「話そうとすると涙が出てくる。写真とかをみる時もそうだ。もう泣きすぎて涙が出てこない。完全に枯れてしまったんだ。今になってやっと少しでも元気になってこうやって笑っていられるかも知らないけど、、、やっぱり放射線のせいで家に帰りたくない。」 EnterENGLISH FRANÇAISA no mans land-©-Ayesta-Bression-2Retrace_our_steps-©-Ayesta-Bression-21nature-©-Ayesta-Bression-14A no mans land-©-Ayesta-Bression-21/8「私は、ここでは浪江における原子力発電所から10キロに生まれ、そしてもちろん私は戻って来たいと思っていました。避難はしていても、基本的に自分は浪江の住民であるという意識があったので、私は浪江に私の本籍を変えませんでした。しかし、年を経るに従い、町が元通りになることはあり得ないと自分に言い聞かせ、移転することにしましたし、誰もが他の場所で住宅を購入しようとしています」。鈴木恵子 「2011年3月11日以後、所有者は、囲いの中に動物を残したまま避難するようにという命令に従ってきました。当初、私は農場に入る勇気がありませんでした。しかし、3週間後、私はあまりにも心配になったので、思い切って行動を起こしました。ほとんどすべての牛はすでに死んでいるか、死の瀬戸際にいました」。松村直人 「私の祖父は70年前におもちゃ屋を始めました。私の家族は町で重要な一家となりました。私たちは、浪江または小高に住んでいる約50戸の一部であり、我々は今、全員が原発難民です。政府は2017年に浪江町への出入りを自由にする考えのようです。しかし、それまでに除染されるのは住居の一部だけです。だとすると、子供が遊んでいる場合はどうなるのか?政府がやっていることは無意味です」。宮沢雄三 「私たちは高齢者です。私たちが制限区域にある自宅に帰ろうと決めた場合は、近くに病院があることが私たちにとって最も重要になるでしょう。我々がいま避難場所として住んでいる非制限区域では、病院に行く日は、朝5時に起きなければなりません。病院が地域に開かれなければ、誰も戻らないでしょう」。早川保 「隣のひとたちが戻ってくるかどうかをまず知りたい。戻らないとなったら、私も帰らない。」 2011年3月、私たちが驚愕の中で福島第一原子力発電所周辺で目にしたのは、「ノーマンズランド」そのものだった。原子力発電所から約15キロの距離にある小高地区の中心部では、その時以来、時が止まってしまっている。道の真ん中に放置されたままのソファ、まるで主人の帰りを待っているかのように、泥だらけの窓から外を覗く一匹の猫。コインランドリーの店内で流れ続ける一昔前の音楽。このような現実は、福島第一原発から半径20キロ以内、今では立入禁止となった場所に住んでいた8万人もの人々が、いかにしてわずか数日のうちに避難せざるを得なかったか、その慌ただしさを物語っている。人のいなくなった町々で、私たちは異様な雰囲気に包まれた住民に出会った。マスクと放射線防護服を着用しパニック状態で走り回る人、次にどんな指示をだすべきか判断を迷っている警官。飢えた自分の馬を救おうとする畜産農家。避難のどさくさで数週間にわたり世話をされることのなかった馬たちは、地震と津波によって破壊された馬小屋の中でただ横たわっているだけだった。 私たちは、線量計の数値に注意しながら、恐る恐る前進して行った。「なるほど、これが原発事故というものか」と思いながら。約６か月後、その最初のショックを個人的な作品として表現したいと思い、そのなかで生まれたのが「福島ノーゴーゾーン」である。このプロジェクトの完成までには6年もの時間を要し、そのために私たちは何度も福島の立入禁止区域に向かうことになった。 私たちが最初に写真を撮ったのは2011年の12月だった。放射線防護服に身を包み、通過許可証を手にし、やっと原子力発電所から20キロ圏内に入ることができたのである。進入禁止区域内での報道や芸術を目的とした活動は厳重に制限されており、私たちは逮捕される可能性と常に隣り合わせだった。 福島で活動する間、私たちがまず恐れなければならなかったのは、放射能より治安当局だった。放射能は危険ではあったが、後者のリスクの方がより直接的で目に見えたものであったのである。 その日の夕方、私たちは原子力発電所から7㎞にあり、完全に津波により水没していた富岡駅に赴いた。すると線路の間で、私たちの車のヘッドライトが車の残骸を照らし出した。この津波の猛威や住民の避難を象徴するような光景は、シリーズ「ノーマンズランド」の最初の写真となった。そしてこの写真はある意味で、私達の作品全体のトーンを決定したのである。 私たちはそれ以来、この1986年のチェルノブイリ原発事故以降最悪の原子力災害の結果住民が居なくなった都市とその周辺、放射能の恐怖、困難な住民の帰宅、彼らの不在をいいことに本来の野生を顕にする自然、日本政府の政策による天文学的な量の放射能廃棄物などをひとつひとつ撮影していった。 この写真集は、この歴史的大災害の記録への私たちのささやかな貢献である。この出来事の終結は、福島第一原発においても、そして避難している人々にとっても依然として遠いものである。私たちは、今後も悲劇的かつ複雑なこの福島の歴史の一章をカメラに収めていくつもりである。 ​ Carlos Ayesta - Guillaume Bression By Christian CAUJOLLE​ ​ 2011年3月11日、日本の東北地方をマグニチュード９の地震が襲いました。この地震は、高さ30m以上にも達する巨大な津波を引き起こします。すべてを破壊し、流し去るこの水の壁の威力は、場所によっては海岸から10キロにある場所の地形を変えるほどでした。津波の恐ろしい映像は、ドラマティックなニュースとともに、世界中のメディアにより何度も何度も繰り返し報道されました。しかしそれはすぐ他のニュースに取って代わられます。メディアは津波のもう一つの結果ー福島第一原発事故ーを報道し始めたのです。原子力発電所の周辺は立入禁止となりました。 メディアは今度は一斉に線量計と防護服に身を包んだ人たちの映像を報じました。福島県だけで、避難生活を強いられることになる人々が15万人にも達したのです。 カルロス·アエスタとギョーム·ブレッションは直ちに現地に入りました。その状況を自らの目で見るために。彼らは次々に目に映る驚くべき光景に愕然としました。そして写真を撮り続けます。記録としてではなく、それが本当に起きているのか、彼ら自身信じられなかったからです。この、目を疑うほどの惨状。まさにその惨状によって、彼らの衝撃をこのプロジェクトへと昇華することになります。 この独自色溢れるプロジェクトは、ドキュメンタリーの手段としての写真の役割と深く関連しています。真実ではなく、写真家自らがそれにより自分の意見をはっきりさせ、自らの感じることを表現できるような中立性こそが求められるのです。この作品は、次々に変化する視点、その都度変わる分析の角度、互いの矛盾させ感じさせるような構図の数々によって展開されます。記録しようとする意志は現地の状況を可能な限り完璧に、見えないもの、目立たないようなものをも含めて探ろうという意図に基づいています。この作品はひとつひとつのイメージを互いに比較できるよう計算された、同じ構図と視点の連続を基礎とするいわゆる「ドキュメンタリー」と呼ばれるスタイルを採ってはいません。 ですが各イメージは、複数でひとつのユニットを構成するよう計算·製作され、見事な一貫性を保っているばかりか、ある狙いを持っています。このユニットの連続を俯瞰する時、心が痛むような日用品等の静物という細部の次元から、プラスチックで防護された壁の内側に積み上げられていく2500万立方メートルもの汚染土という無限大に大きい次元へと進んで行くのがわかります。つまり、ひとつの世界が、その全ての次元において、揺るがされたのです。 観察者と演出者という役割をフィクションとリアリズムをないまぜながら演じつつ、二人の写真家は野生に還った自然の脅威や避難民の帰宅に代わる代わるカメラを向け、そうすることで、現実を解釈する手段としての写真というメディアの可能性を、驚くべき自由を持って発揮させています。彼らの視点は明確なものですが、同時に正確な構図を各段階で選び、また様々なアプローチを試すことで、情報への鍵を与えながらも何かを明示するわけではないという、作品を見た者が考え込むような結果を出すことに成功しています。これはある種読者を幻惑するような効果を作品にもたらしていると言えるでしょう。そして最も重要なことは、長時間の撮影を行うことで、いかにして何千人もの人々の時間が自然環境と同様深く傷つけられたかを、この作品が私たちに伝えているということです。彼らの数年間に及ぶ福島での作業の後でさえ、未来はおろか状況の変化さえ一切感じられません。全ては、野生に戻った自然を除けば、不動と化したようです。各イメージを分析し、作品の効果を生み出している論理を抜き出すこともできるでしょう。ですがこの長期プロジェクトにおける写真技術のベースを構成する要素ー色ーを考える方がより重要です。2011年の津波の被害や福島の原発事故についての写真の作品は数多く発表されています。ドキュメンタリータッチのもの、あるいはより抽象的な作品、シリーズになっているもの、そしてより文学的なもの。時間をかけて造られた作品のうちの多くは白黒になっています。カルロス·アエスタとギョーム·ブレッションは、カラー写真を選択し、現実そのままの色を表現することによって「リアリズム」を探求しようとは、考えていません。彼らは感情が揺さぶられ、行動をおこさせるような事実を目の当たりにしたその瞬間に、作品が構成されるのだと、他の写真家とは違い、語っています。目の前で起きている、同時代の重要な問題を扱うというのは勇気のいる決断です。しかしそれは同時に、多くの人々が必要としている決断でもあるのです。 NEWS #comp-j9o0v0x0 #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_j9o0v0xy_Array__0 .paginationPrev{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}#comp-j9o0v0x0 #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0t47a_j9o0v0xy_Array__0 .paginationNext{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}WINNERS NEW DISCOVERY AWARD 2017 - Les Rencontres d'Arles September 28, 2017Carlos Ayesta & Guillaume BressionRetracing Our Steps, Fukushima Exclusion Zone – 2011-2016Le 247, Paris, France Carlos Ayesta and Guillaume Bression rushed to Fukushima after the March 2011 earthquake and tsunami. To see for themselves. To bear witness. They photographed not to testify but by necessity, because they could not believe their eyes, and that—the unbelievable magnitude of the devastation—turned their amazement into a project. An atypical project deeply linked to the role of a certain kind of documentary photography expected not to tell the truth, but to offer a form of operational neutrality by which photographers situate and express themselves. The show can be split up into a series of repeated perspectives, ever-different angles of analysis and proposals that might seem contradictory, in order to probe a situation as thoroughly as possible, including what is non-visible and non-visual. Christian Caujollewww.rencontres-arles.comExhibition - JIMEI X ARLES 2017 INTERNATIONAL PHOTO FESTIVAL November 24, 201725 NOVEMBRE 2017 - 3 JANVIER 2018The third Jimei x Arles International Photo Festival will take place in Xiamen (south of China) from November 25, 2017 to January 3, 2018. Co-created by Sam Stourdzé, the director of famous international photo festival Rencontres d’Arles (France), and Chinese photographer RongRong (also the founder of Three Shadows Photography Art Centre (www.threeshadows.cn), first professional art center in China dedicated to photography), Jimei x Arles features international artists selected from Rencontres d’Arles (www.rencontres-arles.com) alongside Chinese and Asian photography talents. The festival has attracted more than 100,000 visitors since its inception in 2015.www.rencontres-arles.comExhibition Fotofever paris 2017 November 07, 20176th edition of the contemporary photography art fair FOTOFEVER PARIS 201710 > 12 NOV 2017 ● CARROUSEL DU LOUVRE The international contemporary photography art fair returns to the Carrousel du Louvre for its 6th edition, with the Galerie Le 247 from Paris www.fotofever.comExhibition - Galerie DOMUS et L’Enssib - Université Claude Bernard Lyon October 15, 2017Du 10 octobre au 23 novembre 2017Vernissage en présence des artistes le jeudi 12 octobre : 18h00 à l’Enssib 18h30 à la Galerie Domuswww.galeriedomus.univ-lyon1.frExhibition LANDSKRONA FOTO FESTIVAL September 09, 2017Landskrona Foto is one of the most important institutions in Scandinavia for photographic mediation, research and conservation.www.landskronafoto.orgExhibition festival Getxophoto August 31, 2016September - October​www.getxophoto.comNew Book !!! Retracing our stepsDecember 31, 2016Fukushima exclusion zone 2011-2016rer éléments.More information - Buy the book New series : 25 millions cubic metre !August 18, 2016We have just finished a new series, the 6th of this long term Fukushima pro