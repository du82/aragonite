full_description = "PortfolioMaking ofNewsAboutContactsAbout En mars 2011, nous avons découvert, hallucinés, le no man’s land autour de la centrale nucléaire. Dans le centre-ville d’Odaka à une quinzaine de kilomètres de la centrale, le temps s’était subitement interrompu. Un canapé avait été laissé au milieu de la route, un chat regardait par la vitre d’une fenêtre couverte de boue comme s’il attendait le retour de ses maîtres, une musique ringarde continuait de résonner à l’intérieur d’une laverie automatique. Ces détails rappelaient l’urgence avec laquelle les 80 000 résidents de la zone interdite avaient pris la fuite, un territoire d’un rayon de 20 km autour du site de Fukushima Daiichi ayant été évacué en seulement quelques jours. Au milieu des villes désertes, nous croisions pourtant de rares habitants : des résidents en masque et combinaison radiologique courant affolés, des policiers un peu perdus ne sachant pas quelle instruction donner ou encore un éleveur essayant de sauver ses chevaux affamés. Plusieurs de ses chevaux, abandonnés pendant plusieurs semaines à cause de l’évacuation, gisaient dans cette étable en grande partie détruite par le séisme et le tsunami. De notre côté, nous avancions, les yeux rivés sur notre dosimètre : « C’est donc cela un accident nucléaire ». Six mois plus tard nous avons voulu convertir ce choc initial en un projet artistique personnel. « Fukushima no go zone » était né. Ce travail au long cours allait durer six ans et nous a conduit à de multiples reprises dans la zone interdite de Fukushima. Notre première photographie a été prise en décembre 2011. Munis d’une combinaison radiologique et d’un laisser passer, nous avons pu franchir le check-point, à 20 km de la centrale nucléaire. Les activités journalistiques et artistiques à l’intérieur de la zone interdite étant strictement limitées, nous étions habités par la menace d’une interpellation par la police. Pendant toute la durée de notre travail à Fukushima, la peur des autorités l’a finalement emporté sur la crainte de la radioactivité qui représentait à nos yeux un danger moins palpable et immédiat. Tard dans la soirée, nous avons rejoint la gare de Tomioka, à 7 km de la centrale nucléaire et qui avait été entièrement submergée par le tsunami. Au milieu des rails, notre lampe frontale a éclairé une épave de voiture. Cette apparition inattendue – symbolique pour nous du tsunami et de l’évacuation des habitants – a donné lieu à la première photo de la série « A no man’s land ». Et d’une certaine façon, elle a donné le ton à tout notre travail photographique. Depuis lors, nous nous sommes attachés à déplier une à une les conséquences de cette catastrophe nucléaire, la plus grave depuis l’accident de Tchernobyl en 1986 : les villes et les campagnes vidées de leurs habitants, la peur de la radioactivité, la question difficile du retour, la nature qui reprend ses droits en l’absence de l’homme et les quantités astronomiques de déchets pollués issus de la campagne de décontamination lancée par les autorités japonaises. Ce travail photographique est notre contribution au récit d’une catastrophe historique. L’accident est loin d’être terminé, ni à la centrale, ni parmi les réfugiés du nucléaire. Et nous espérons continuer à témoigner de cette page triste mais également riche de l’histoire de la région de Fukushima. ​ ​ ​ ​ ​ Ayesta - Bression Carlos Ayesta Né à Caracas en 1985, travaille en tant que photographe indépendant à Paris, entre autre pour des suivis de chantiers et photographies d’architecture. Il a été exposé en 2012 au forum des Halles et à la Mairie de Paris, dans le cadre de la carte blanche SFR jeunes talents & de l'exposition « Doisneau-Paris Les Halles » Guillaume Bression Diplômé de l’ISAE et de l’IFP School, Guillaume termine son virage vers la photographie en 2008 en suivant une formation spécialisée à Paris. Il monte en 2009 avec Carlos Ayesta le collectif de photographe Trois8 avec lequel il réalise différent projets artistiques et documentaires. Ces travaux ont été exposés dans plusieurs festivals et galeries en Europe. Il est installé au Japon depuis 2010 comme photographe et cadreur freelance. Carlos et Guillaume travaillent ensemble pour certaines séries documentaires depuis 2009. En 2011, ils commencent un travail collectif autour de la thématique de Fukushima. Ce travail a été exposé dans de nombreux festivals, en France ou à l’étranger (festivals « Circulation(s) », « Photaumnales » « Getxo photo » dans la région de Bilbao, au festival «Athens Photo Festival » Landskrona Foto Festival… ) dans des galeries (« Fait et Cause », « Le 247 » à Paris , Galerie Domus et l’Enssib à Lyon) il a donné lieu en 2016 a une rétrospective à Tokyo dans l’espace « Chanel Nexus Hall » et a été approuvé par les professionnels en obtenant le Prix Découverte d’Arles en 2017. L’exposition qui aborde 6 thématiques différentes autour de l’accident nucléaire de Fukushima, continue à tourner (Pérou, Jimei en Chine etc.) et est paru en livre « Retracing our steps » avec les editions Kherer Verlag. ​ ​ ​ ​ ​ ​ ​ ​ ​ ​EXHIBITIONS AND AWARD ​ 2017 / 11 Exhibition in Jimei x Arles 2017, International Photo Festival. Jimei – China. Series: « Retracing our steps ». 2017 / 11 Exhibition in Fotofever paris 2017: 6th edition of the contemporary photography art fair. France. Series: « Retracing our steps ». 2017 / 10 Exhibition in the Galerie Domus and l’Enssib. Université de Lyon – France. Series: « Retracing our steps ». 2017 / 09 Exhibition in the festival “Landskrona Foto Festival ». Landskrona – sweden. series: « Retracing our steps ». 2017 / 07 Winner and exhibition “New discovery award 2017” in the “Les Rencontres Photographiques” d’Arles – France. Series: «Retracing our steps ». 2016 / 09 Exhibition in the Festival Getxophoto - Getxo – Spain. Series: « Nature ». 2016 / 06 Exhibition in Chanel Nexus Hall Tokyo. Series: « Retracing our steps ». ​ 2016 / 06 Exhibition in Athens Photo Festival. Series: « Retracing our steps ». 2016 / 03 Exhibition in the Festival « Les Photographiques » Mans - France. Series: « Retracing our steps ». 2015 / 06 Finalist of the European Publishers Award for Photography 2015 / 06 Finalist of the Environmental photographer of the year 2015 / 07 Selected by Festival Voies Off 2015 à Arles – France. ​ 2015 / 05 Winner of the SOPHOT Concours - Exhibition at the galery FAIT & CAUSE in Paris. 2014 / 04 Exhibition at Espace André Malraux - Herblay - Series « Mauvais rêves ? » & « Clair Obscur à Fukushima » 2014 / 02 Exhibition at Espace SFR - Saint Denis - Series « Mauvais rêves ? » 2014 / 01 Exhibition at Fnac - galery - Rennes and Montpellier - Series « Mauvais rêves ? » 2013 / 09 Exhibition at festival « Les Photaumnales ». Séries « Clair obscur à Fukushima» & «Mauvais rêves ? » 2013 / 07 Exhibition at the galery 7inLuxembourg. Luxembourg. Series «Clair obscur à Fukushima» & « Mauvais rêves ? » ​ 2013 / 05 Gagnant du concours Actuphoto en partenariat avec le Downtown. Série « Vertical Visions » 2013 / 03 Exhibition at Festival Circulation(s). Series « Clair obscur à Fukushima » 2012 Best year Portfolio of « Le Journal De La Photographie.com » (series « Clair Obscur à Fukushima ») ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​"
