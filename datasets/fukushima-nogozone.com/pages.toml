["https://www.fukushima-nogozone.com/mauvais-reves"]
title = "Bad dreams - Mauvais rêves"
description = "Comment montrer ce qui ne se voit pas ? Ce qui ne se sent pas ? Nous avons choisi de délaisser l’approche documentaire pour la mise en scène..."
full_description = "PortfolioMaking ofNewsAboutContacts Mauvais revês BACKRevenir sur nos pasÀ perte de vue L'effacement Temps suspenduA no man's land© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/11Comment montrer ce qui ne se voit pas ? Ce qui ne se sent pas ? Nous avons choisi de délaisser l’approche documentaire pour la mise en scène, seule façon de révéler l’invisible. Directement touchés dans leurs corps et dans leur cœur par la menace de la radioactivité, les résidents de Fukushima eux-mêmes ont été sollicités pour désigner la frontière impalpable entre ce qui est contaminé et ce qui ne l’est pas. Frontière subjective s’il en est. Pourtant, les villes, les campagnes et les forêts sont divisées entre des zones interdites et d’autres pas. Pour montrer ces limites et leur flou, nous avons choisi un film étirable ou encore une bulle. Précision utile : les mises en scène sont bien réelles, les logiciels de retouche n’ont été utilisés qu’à la marge. Avec la série « Mauvais rêves », la fiction révèle le réel et non l’inverse. Propos recueillis dans le hors série N°19 d’Image magazine par Sophie Bernard, rédactrice en chef . Après une première série sur Fukushima intitulée “Clair obscur ” réalisée un an après la catastrophe, Guillaume Bression et Carlos Ayesta sont retournés au Japon. Un deuxième volet nommé “Mauvais rêves” propose une réflexion sur le mal invisible qui ronge autant l’environnement que le corps et le cœur des habitants de la région. Dans “Clair obscur”, l’intention première des deux photographes était de dresser un constat de la catastrophe en montrant les paysages dévastés. Les photographes y affirmaient également leur volonté de réaliser des images à l’esthétique forte. D’où le choix de faire les prises de vue de nuit. Avec “Mauvais rêves”, ils délaissent encore un peu plus le documentaire en ayant recours à la mise en scène. Guillaume Bression et Carlos Ayesta sont en effet partis à la rencontre des habitants et, après de longues discussions, ils sont parvenus à les convaincre de devenir les acteurs de leur propre histoire. La radiation ne se voit pas. Elle n’a pas d’odeur non plus. Alors où donc se situe la frontière entre ce qui est contaminé et ce qui ne l’est pas ? Dans les faits, il est difficile de répondre. Pourtant, des villes, des forêts ou encore l’océan sont divisés en différentes zones, les unes interdites, les autres pas… Pour montrer ces frontières, Guillaume Bression et Carlos Ayesta ont choisi le plastique transparent, sous la forme d’un film étirable encore d’une bulle. Précision utile : tous les objets présents dans les photos sont réels. Les photographes n’ont pas utilisé de logiciel de retouche. Etrangement, c’est par le recours à la fiction que Guillaume Bression et Carlos Ayesta parviennent à révéler ce qui est invisible. Et pour une fois, c’est la fiction qui conduit au réel et non l’inverse. Bienvenue dans ce monde à la fois beau et inquiétant."
