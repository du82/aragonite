["https://www.fukushima-nogozone.com/copie-de-mauvais-reves"]
title = "Bad dreams - Mauvais rêves"
description = "Comment montrer ce qui ne se voit pas ? Ce qui ne se sent pas ? Nous avons choisi de délaisser l’approche documentaire pour la mise en scène..."
full_description = "PortfolioMaking ofNewsAboutContactsBad dreams BACKRetrace our stepsAs far as the eyes can seeErasureSuspended Time A no man's land© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/11How do we depict something not seen or felt? Instead of adopting a documentary approach to this project, we decided to stage the photographs using plastic bubbles and cellophane wrap to reveal the “invisible”. Here, fiction reveals reality, not vice versa. Before looking at the photographs, please note that all the settings were real, with minimal photo retouching involved. We requested the involvement of people whose hearts and minds were directly touched by the threat of radiation – the residents of Fukushima – to depict tangible frontiers between what is and isn’t contaminated. The result is a series of blurred and subjective frontiers. That said, the affected communities, countryside and forests are actually divided between those now accessible and those to which entry remains prohibited."
