["https://www.fukushima-nogozone.com/revenir-sur-nos-pas"]
title = "Retrace our steps - Revenir sur nos pas"
description = "Les plus de 80 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison..."
full_description = "PortfolioMaking ofNewsAboutContacts Revenir sur nos pas... BACKÀ perte de vue L'effacement Temps suspenduMauvais rêves ?A no man's landHiroyuki Igari habite à Iwaki (40 km au sud de la centrale de Fukushima Daiichi). Il tient un café avec sa femme. Nombre de ses amis proches sont d’anciens habitants de la zone interdite. Il est ici dans le restaurant abandonné d’un de ses amis, restaurant où il avait l’habitude d’aller, situé à 500 mètres de la côte et à 9 km au sud de la centrale dans le quartier de la gare de Tomioka. Les plus de 80 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison, leur école ou leur commerce. Et tous ont eu du mal à reconnaître ces lieux familiers devenus hostiles. Les années d’absence, les rongeurs mais aussi les effets du séisme et du tsunami du 11 mars ont laissé des traces. Dans cette nouvelle série, nous avons voulu souligner ce choc violent perçu par les habitants à leur retour. Nous avons demandé à d’anciens residents – parfois les propriétaires des lieux – de revenir dans leur commerce ou leur école, de pousser les portes de ces lieux autrefois banals. Nous avons aussi demandé à certains habitants de la region de Fukushima de se rendre avec nous dans cette zone devenue interdite. Une façon pour eux d’avoir un regard direct sur les consequences de cette catastrophe. Face à l’objectif, ils sont pourtant tous tenus de faire « comme si de rien était » et de se comporter normalement. L’étrange et la banalité se mêlent dans des photographies quasi-surnaturelles et pourtant plausibles, résultat d’une catastrophe nucléaire historique."
