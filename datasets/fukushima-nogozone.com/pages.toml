["https://www.fukushima-nogozone.com/copie-de-portfolio"]
title = "Portfolio Fukushima"
full_description = "PortfolioMaking ofNewsAboutContacts Portfolio RETRACING OUR STEPS ​ What would happen if the nuclear evacuees all returned home at once ? That thought conjures disturbing images that combine the strange and the banal. SUSPENDED TIME ​ Rotten heads of broccoli and mouldy meat are among the products still on display in supermarkets inside the no-go zone. They look like the petrified vestiges of a contemporary Pompei.AS FAR AS THE EYES CAN SEE ​ Black bags, piled up on 5 floors until the eyes can’t reach the end. Geometric, endless, the fresco «25 million cubic meters » transposes the organized and methodical nature of the decontamination project in Fukushima, as well as its excessiveness. BAD DREAMS ​ Using large plastic bubbles and cellophane wrap IS THIS OK ?, the aim of these staged photographs is to render radiation « visible ». Fiction can sometimes be used as a way to reveal reality.ERASURE ​ Disturbing nature… a few years after the disaster, it covers everything, houses, cars and roads. This series documents the abandoned Fukushima struggling with creepers and weeds. A nature that gradually erases the traces of man. A NO MAN’S LAND ​ When buildings and other scenes in the Fukushima no go zone are photographed at night with flashlights, they appear like bolts from the blue … like anomalies."
year_published = 2025
clearnet = "https://www.fukushima-nogozone.com/copie-de-portfolio"
