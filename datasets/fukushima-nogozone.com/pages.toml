["https://www.fukushima-nogozone.com/copie-de-temps-suspendu"]
title = "SUSPENDED TIME | no-go-zone"
full_description = "PortfolioMaking ofNewsAboutContactsSuspended Time BACKRetrace our stepsAs far as the eyes can seeErasureBad Dreams ?A no man's land© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/20Rotten broccoli, eggshells and moldy meat are some of the products we encountered in abandoned Fukushima supermarkets. With their expiry dates long since passed, they resembled petrified objects in a desert, or the relics of a modern Pompeii. With a touch of irony, we shot these items using a method commonly associated with catalogs and product promotions. But these products will never be sold or consumed. Their fate is to continue showcasing the merciless ravages of passing time."
