["https://www.fukushima-nogozone.com/copie-de-retrace-our-steps"]
title = "Retrace our steps - Revenir sur nos pas"
description = "Les plus de 80 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison..."
full_description = "PortfolioMaking ofNewsAboutContacts回顧 BACK2500万立方メートル消し去ること止まった時間悪夢ノーマンズランドいわき市 (福島第一原発の南40キロ) に住み、夫婦で喫茶店を営んでいる猪狩弘之さん。親しい友人の多くは立ち入り禁止区域の元住人である。彼がいるのは、友人が経営していた馴染みの和食店。富岡駅近くのこの店は、海岸から500メートル、福島第一原発から9キロの場所にある。 原発事故による避難民が一斉に自分の家に戻ったら、いったい何が起きるだろう？福島第一原発事故によって避難を余儀なくされた周辺住民は８万人にのぼる。そのほとんどの人々が、住んでいた家、通っていた学校、営んでいた店へ帰りたいという思いに駆られたにちがいない。 しかし、実際に一時帰宅がかなったとき、慣れ親しんだはずの場所をすぐに認識するのは困難な状況だった。3月11日の地震と津波によって倒壊し、長らく放置され、害虫や動物に荒らされて、地域の建物は無残に姿を変えていたのだ。 本シリーズで被写体としてご協力くださったのは、この地域で実際に暮らしていた元住民や店主の方々である。帰還困難区域内に一緒に立ち入っていただき、震災前に時が戻ったかのようにカメラの前で振る舞ってくださるよう、お願いしたのである。 この超現実的な写真は、日常と非日常を組み合わせるというアイデアに基づいて生み出された。歴史的な原発事故が起こったという事実が、このあり得ないイメージに現実味を与えているのだ。 ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​ ​"
year_published = 2025
clearnet = "https://www.fukushima-nogozone.com/copie-de-retrace-our-steps"
