["https://www.fukushima-nogozone.com/copie-de-a-no-man-s-land-1"]
title = "Chiaroscuro - Clair obscur à Fukushima"
full_description = "回顧2500万立方メートル消し去ること止まった時間悪夢PortfolioMaking ofNewsAboutContactsノーマンズランド BACK© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/17 福島第一原発周辺の1,000平方キロにもおよぶ無人地帯。この地こそ、原発事故の最も残酷かつ衝撃的な事実を物語っている。国の命令に従って、あるいは自ら避難を決意して、８万人の人々が土地を離れた。後には灯がともることのないゴーストタウンが残され、時は止まったのだ。 私たちは、この風景を新たな観点で撮影するために、立ち入り禁止区域に足を踏み入れた。人気のない夜の町並みでフラッシュを焚き、アングルを定め、風景や建物を選び出して光に照らした。 しかし、人工の光はこの地に息吹を吹き込むどころか、むしろその空虚さを浮き彫りにするばかりだった。写真の冷たくむき出しのイメージは、見捨てられた地を前にして感じる不穏さをより鮮明にするのだ。"
