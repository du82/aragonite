November 25, 2017 to January 3, 2018. Co-created by Sam Stourdzé, the director of famous international photo festival Rencontres d’Arles (France), and Chinese photographer RongRong (also the founder of Three Shadows Photography Art Centre (www.threeshadows.cn), first professional art center in China dedicated to photography), Jimei x Arles features international artists selected from Rencontres d’Arles (www.rencontres-arles.com) alongside Chinese and Asian photography talents. The festival has attracted more than 100,000 visitors since its inception in 2015.www.rencontres-arles.comExhibition Fotofever paris 2017 November 07, 20176th edition of the contemporary photography art fair FOTOFEVER PARIS 201710 > 12 NOV 2017 ● CARROUSEL DU LOUVRE The international contemporary photography art fair returns to the Carrousel du Louvre for its 6th edition, with the Galerie Le 247 from Paris www.fotofever.comExhibition - Galerie DOMUS et L’Enssib - Université Claude Bernard Lyon October 15, 2017Du 10 octobre au 23 novembre 2017Vernissage en présence des artistes le jeudi 12 octobre : 18h00 à l’Enssib 18h30 à la Galerie Domuswww.galeriedomus.univ-lyon1.frExhibition LANDSKRONA FOTO FESTIVAL September 09, 2017Landskrona Foto is one of the most important institutions in Scandinavia for photographic mediation, research and conservation.www.landskronafoto.orgExhibition festival Getxophoto August 31, 2016September - October​www.getxophoto.comNew Book !!! Retracing our stepsDecember 31, 2016Fukushima exclusion zone 2011-2016rer éléments.More information - Buy the book New series : 25 millions cubic metre !August 18, 2016We have just finished a new series, the 6th of this long term Fukushima project ! It will be featured in our book! A part of it can already be seen on the dedicated website of the project.See the seriesExhibition In OrleansSeptember 29, 2016​Please reload.app1[data-state~="content"] .app1error {display:none;}.app1[data-state~="content"] .app1loading {display:none;}.app1[