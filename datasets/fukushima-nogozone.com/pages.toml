["https://www.fukushima-nogozone.com/copie-de-mauvais-reves-1"]
title = "Bad dreams - Mauvais rêves"
description = "Comment montrer ce qui ne se voit pas ? Ce qui ne se sent pas ? Nous avons choisi de délaisser l’approche documentaire pour la mise en scène..."
full_description = "回顧2500万立方メートル消し去ること止まった時間ノーマンズランドPortfolioMaking ofNewsAboutContacts悪夢 BACK© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression© Carlos Ayesta - Guillaume Bression1/12見ること、感じることのできないものは、どのように表現すればよいのだろう？例えば、色や形のない、無味無臭ですらある放射線や、その脅威を写すことはできるのだろうか？このプロジェクトではそんな不可視のものを明らかにするために、ドキュメンタリーによるアプローチを捨て、演出写真の手法を取り入れた。 私たちは放射線の危険にさらされ心理的な傷を負った人々——福島県住民の方々——にお願いし、汚染されたものとそうでないものとの境界線を描いてもらった。その結果わかったのは、境界線が不明瞭かつ恣意的であるということだ。実際には、町や田畑や森は立ち入りが許された区域とそうでない区域が人為的に分けられているにもかかわらず。 そこで私たちは、この境界線のあいまいさを表現するために、プラスチック製の巨大泡とセロハンを用いることにした。もちろん、撮影した舞台装置、つまり風景はすべて現実のものであり、写真の加工は施していない。 このシリーズでは虚構が現実を露にしているのだ。その逆では決してない。"
