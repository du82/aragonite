full_description = '''PortfolioMaking ofNewsAboutContactsNews #comp-j9o18g0k #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0vman_j9o18gtf_Array__0 .paginationPrev{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}#comp-j9o18g0k #TeamListView_i6m8gew6109_dup_i6qm3pfb338_dup_i6ro0rw0157_dup_i70h8xkx181_dup_i7ek4o403_iviieqks_j9l2atjy_j9o0vman_j9o18gtf_Array__0 .paginationNext{-webkit-user-select:none;display:inline-block;-ms-user-select:none;-webkit-touch-callout:none;padding:0 5px;cursor:pointer;-khtml-user-select:none;-moz-user-select:none;user-select:none;font-size:14px}WINNERS NEW DISCOVERY AWARD 2017 - Les Rencontres d'Arles September 28, 2017Carlos Ayesta & Guillaume BressionRetracing Our Steps, Fukushima Exclusion Zone – 2011-2016Le 247, Paris, France Carlos Ayesta and Guillaume Bression rushed to Fukushima after the March 2011 earthquake and tsunami. To see for themselves. To bear witness. They photographed not to testify but by necessity, because they could not believe their eyes, and that—the unbelievable magnitude of the devastation—turned their amazement into a project. An atypical project deeply linked to the role of a certain kind of documentary photography expected not to tell the truth, but to offer a form of operational neutrality by which photographers situate and express themselves. The show can be split up into a series of repeated perspectives, ever-different angles of analysis and proposals that might seem contradictory, in order to probe a situation as thoroughly as possible, including what is non-visible and non-visual. Christian Caujollewww.rencontres-arles.comExhibition - JIMEI X ARLES 2017 INTERNATIONAL PHOTO FESTIVAL November 24, 201725 NOVEMBRE 2017 - 3 JANVIER 2018The third Jimei x Arles International Photo Festival will take place in Xiamen (south of China) from November 25, 2017 to January 3, 2018. Co-created by Sam Stourdzé, the director of famous international photo festival Rencontres d’Arles (France), and Chinese photographer RongRong (also the founder of Three Shadows Photography Art Centre (www.threeshadows.cn), first professional art center in China dedicated to photography), Jimei x Arles features international artists selected from Rencontres d’Arles (www.rencontres-arles.com) alongside Chinese and Asian photography talents. The festival has attracted more than 100,000 visitors since its inception in 2015.www.rencontres-arles.comExhibition Fotofever paris 2017 November 07, 20176th edition of the contemporary photography art fair FOTOFEVER PARIS 201710 > 12 NOV 2017 ● CARROUSEL DU LOUVRE The international contemporary photography art fair returns to the Carrousel du Louvre for its 6th edition, with the Galerie Le 247 from Paris www.fotofever.comExhibition - Galerie DOMUS et L’Enssib - Université Claude Bernard Lyon October 15, 2017Du 10 octobre au 23 novembre 2017Vernissage en présence des artistes le jeudi 12 octobre : 18h00 à l’Enssib 18h30 à la Galerie Domuswww.galeriedomus.univ-lyon1.frExhibition LANDSKRONA FOTO FESTIVAL September 09, 2017Landskrona Foto is one of the most important institutions in Scandinavia for photographic mediation, research and conservation.www.landskronafoto.orgExhibition festival Getxophoto August 31, 2016September - October​www.getxophoto.comNew Book !!! Retracing our stepsDecember 31, 2016Fukushima exclusion zone 2011-2016rer éléments.More information - Buy the book New series : 25 millions cubic metre !August 18, 2016We have just finished a new series, the 6th of this long term Fukushima project ! It will be featured in our book! A part of it can already be seen on the dedicated website of the project.See the seriesExhibition In OrleansSeptember 29, 2016​Please reload.app1[data-state~="content"] .app1error {display:none;}.app1[data-state~="content"