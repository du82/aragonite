["https://www.fukushima-nogozone.com/copie-de-nature"]
title = "Retrace our steps - Revenir sur nos pas"
description = "Les plus de 80 000 habitants évacués des alentours de la centrale nucléaire de Fukushima ont tous un jour eu cette tentation : revenir voir leur maison..."
full_description = "PortfolioMaking ofNewsAboutContactsErasure BACKRetrace our stepsAs far as the eyes can seeSuspended Time Bad Dreams ?A no man's land© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone© Carlos Ayesta - Guillaume BressionFukushima exclusion zone1/19The impact of the Great East Japan Earthquake meant 330,000 households had to relocate nationwide, approximately 71,000 of which were households in Fukushima prefecture. Even if limiting the total to the number of households who moved house due to their housing becoming unlivable, the figure was 40,000. Within a radius of 20 km around the Fukushima Daiichi nuclear power plant, several years have now elapsed since the earthquake. Houses and buildings which were forcibly parted from their owners have been left as they were and many lie in ruins. What we saw were entire artifacts; not only houses but also roads and cars overrun with vegetation. Within an environment where people no longer live, the speed of this propagation eliminates virtually all human footprints. This series is a record of the abandoned streets of Fukushima; swallowed up by nature."
