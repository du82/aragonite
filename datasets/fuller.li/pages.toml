["https://fuller.li/posts"]
title = "Kyle Fuller"
full_description = '''Using Swift Package Manager with Carthage Some users of my libraries have asked how they can integrate these libraries into their applications using Carthage dependency manager. Carthage requires libraries to provide an Xcode project or a binary framework. However, since many of my Swift libraries are cross-platform, I am not developing them in Xcode. In addition, distributing binary frameworks from Swift source is not recommended by Apple because the Swift ABI is not yet stable. Therefore the frameworks are tied to specific releases of Xcode. "While distribution and use of 3rd-party binary frameworks is not recommended … Read more → Automated CocoaPod releases with CI Using continuous integration (CI), we can automate releasing our CocoaPods to trunk. When someone tags a new release and runs git push, CI will publish the pod to CocoaPods trunk. This guide walks you though settings this up on both Circle CI and Travis CI. If you are not using these CI providers, you should be able to follow a similar technique. CocoaPods trunk Access Token To release new or updates to existing pods you will need an access token for trunk. This is normally created using the pod trunk … Read more → Migrating from OCUnit to XCTest You might think you were in luck when Xcode offered you an option to migrate to XCTest, but shortly after trying you will discover that this isn't a true migration. Xcode will only migrate your code, it will not update your project to be testable with XCTest. There are still some steps left and unfortunately Apple have not shared any documentation on how to do this. Note I have later discovered that it does work as expected, but only if you run the conversion from a project directly. If you try running the conversion from a workspace you will get the problems mentioned above. I have filed this as rdar://16581037 so Apple can fix this in the future. For now, you'll need to follow the below steps. You can follow these steps to migrate your project to XCTest once you've migrated the code with the automatic converter: Read more →'''
