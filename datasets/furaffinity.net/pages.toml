["https://furaffinity.net/advertising.html"]
title = "Advertising -- Fur Affinity [dot] net"
description = "Fur Affinity | For all things fluff, scaled, and feathered!"
full_description = "Browse Search Support ▼ News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Log In or Create an Account Log In Create an Account News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter .ad-pad{margin:0 15px;} Advertising on FA Updated - 5/11/2021 Our community-based advertising delivers over a billion impression each month! In addition to our third party ads, these ads help cover the costs of hosting and paying for site development. How Do I Advertise on FA? Step One - Send an e-mail to advertising@furaffinity.net, including your website address, a brief description of your site and (if you have one ready) include your ad as an attachment. If your advertisement is date/time sensitive, please be sure to note that in your initial e-mail. Please expect up to 3 business days (M-F) for a response. Step Two - Advertising banners and links will be reviewed for both content and quality. On rare occasions, ads may be rejected and sent back with feedback as to why they were declined (after all, we want your ad to be successful!). Step Three - Once your ad is approved, payment instructions will be sent via e-mail. Fur Affinity only accepts payment via Paypal. If you have any questions or concerns, please email advertising@furaffinity.net. Rates and Information The Lil's Package includes our standard 300x90 banner spot. 1 month - $25 | 6 months - $125 | 12 months - $225 File Size Restrictions: 750K (JPG, GIF or PNG) 300x90 The Bigs Contains both 300x200 and 728x90 ads in a single package. 1 month - $60 | 6 months - $300 | 12 months - $540 File Size Restrictions: 1MB (JPG, GIF or PNG) 300x200 Kaiju Package Snag all our ad slots (300x90, 300x200, and 728x90) together with this monstrously good deal. 1 month - $75 | 6 months - $350 | 12 months - $625 File Size Restrictions: 1MB (JPG, GIF or PNG) 728x90 Advertising Limitations/Requirements The only accepted file formats are JPG, GIF, or PNG. Ads may not contain imagery which blink, flash, or rapidly scroll/pan through content. Advertisements may not exceed the Mature rating per the Upload Policy. Additionally, ads which feature NSFW content will be limited so that they only show on appropriately rated pages."
