["https://furaffinity.net/aup"]
title = "Upload Policy -- Fur Affinity [dot] net"
description = "May contain some profanity; however, language is not used in a sexual context. Dialogue may be suggestive, contain sexual innuendo, discussion of adult themes, and the expression of views and opinions that users may find offensive, disrespectful, or controversial."
full_description = '''Browse Search Support ▼ News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Log In or Create an Account Log In Create an Account News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Fur Affinity | Upload Policy Updated - 1/9/2025 1. Content Guidelines 2. All Media 3. Photography 4. Screenshots & 3D Models 5. Music and Audio 6. Avatars 7. Enforcement 1. Content Guidelines 1.1 Ratings All content uploaded to the site must be appropriately rated. General Content Guidelines Language May contain some profanity; however, language is not used in a sexual context. Dialogue may be suggestive, contain sexual innuendo, discussion of adult themes, and the expression of views and opinions that users may find offensive, disrespectful, or controversial. Nudity Free of detailed nudity of any kind, as well as outlines of genitalia, anus, sheaths, female nipples, or detailed/exaggerated bulges. (“Barbie” nudity is allowed) Sexual Situations Free of sexual or excessive fetish themes with exception of brief displays of affection, such as a kiss or hug. Violence May contain mild violence, but may not be gory, bloody, pervasive, or sexual in nature. Other Free of sexual fluids, bodily waste, or forced involuntary drug use. Minimal blood presented in a comedic manner or mild, non-violent injury is allowed. Mature Content Guidelines Language Contains persistent use of profanity. Nudity Contains partial or full detailed nudity where the context is educational or artistic yet not sexual. Sexual Situations Contains mild sexual activity or themes such as implied sex acts, light or comedic sexual fetish references or behavior, or mild sexual situations or discussion. No juvenile characters permitted in this nature. Violence May contain mildly violent or disturbing content that may be disturbing or repulsive to sensitive users. This includes depictions of scary or disgusting content in a horror or fantasy context. Other May contain blood or bodily waste, wet/soiled undergarments as long as it is not excessive or depicted in a nonsexualized context. May contain drug use against the user’s will, but may not be sexual in nature. Adult Content Guidelines Language May contain vulgar dialogue that is sexually explicit. Nudity May contain nudity involving adult themes or sexual situations of adult characters. Sexual Situations May contain explicit sexual content such as sex acts, explicit sexual situations or discussion, and extreme fetishes. No juvenile characters permitted in this nature. Violence May contain violence that is intense and graphic. This includes situations that are extremely violent and/or extremely disturbing or repulsive such as gore or sexual violence. Other May contain bodily fluids, bodily waste or drug use in excessive or sexual situations. 1.2 Submission Detail Keywords, Ratings, Categories, Themes, and Species are used to define images as they appear in Fur Affinity's search engine. Abuse of these (misleading, inaccurate, or false) is not allowed. This does not apply to the Gender section. Submission file type should correspond to submission type. Intentionally listing inaccurate keywords in the description is not allowed. 2. All Media 2.1 Submissions Used as Reminders Users may post reminder submissions so long as they meet all of the requirements below: One (1) submission used as a reminder may be uploaded per 24 hour time frame. This limit applies to all accounts owned by the creator. Submission rating must match the highest content rating of the submission(s) being promoted. Reminders may not be posted on behalf of other creators. 2.2 Sales Submissions Users may post sale submissions so long as they meet all of the requirements below: Goods being sold through submissions may only be user-created or handcrafted items. Sales submissions cannot be removed and reposted more than once every 24 hours. Once a sale submission is uploaded, that same sale may not be uploaded to any other accounts owned by the creator. Sales posts may not be posted on behalf of other creators. The submission rating must reflect the final product. 2.3 Stream Notices Submissions used to inform users that they are streaming are allowed. The rating of the submission must appropriately reflect the rating of the stream's content according to our Content Guidelines (see section 1.1). Stream notifications may be removed and reposted only after 4 hours have elapsed and you are still streaming. Streaming notices must still comply with all other rules in this document. 2.4 Stream Restrictions Users may not link to streams whose sole purpose is the broadcasting of copyrighted content (movies, TV shows, music). This does not apply to Let's Play or game streams. 2.5 Citing Sources Content that was not made explicitly by you that is used as part of your submission (such as free-to-use lineart, backgrounds, or royalty-free content) must cite its original source and be used with permission from the copyright holder. All permissions and copyright holders must be cited in the content's description. If an artist or character owner wished to be kept anonymous they must be credited as anonymous. 2.6 Content Not Made By You / For You Content that was neither made by nor for the uploader is not allowed, unless part of a derivative work (see section 2.5 for more information), or a group that has permission from the copyright holder. All permissions and copyright holders must be cited in the content's description. A group is defined as a user account dedicated to showcasing content of a chosen theme with others who share similar interests for the purpose of building a community and giving artists exposure. 2.7 Baby, Juvenile, and Non-Adult Appearing Characters Baby, juvenile, or otherwise "non-adult" appearing characters, henceforth referred to simply as "juvenile characters", are defined as either: Explicitly being stated in the submission as under the age of 18, Or: Having features or appearances of that of a child or young animal/creature, real or fictional. Context will be carefully considered for submissions that include stylized content such as chibis, “shortstack” characters, or mental regression of adult characters. See section 2.7.3 for more information. 2.7.1 Rules Related to Juvenile Characters Juvenile characters ARE permitted in higher rated submissions (mature, adult) so long as the submissions meet all the following requirements: Juvenile characters are not permitted to be in the same scene (such as sharing a comic panel, contiguous image, reference sheet, specific section of a story, etc.) where characters are engaging in sexual activity. Depictions of birth or breastfeeding with no sexual activity in the presence of a juvenile is permitted. Juvenile characters are not permitted to be depicted with visible genitalia or anus. Juvenile characters are not permitted in works depicting them as pregnant. Juvenile characters are not permitted to appear in heavily fetishized content or sexually based attire, including but not limited to lingerie, BDSM gear, bondage, and overly gratuitous (“hyper”) depictions of soiled or leaking undergarments that are typically unfeasible for an average person (for further information on ABDL and “babyfur” content, see section 2.7.2.) Furthermore, Fur Affinity does NOT permit sexual submissions with content featuring or tagged with loli, shota, or cub. 2.7.2 ABDL and “Babyfur” Content Diaper and ageplay scenarios are not subject to the prohibitions above as long as all characters in the scene are depicted as adults. All juvenile characters in "babyfur" art are, unless categorized for any other reason above, allowed so long as no other violations exist (e.g., a juvenile character wearing a diaper is allowed, but a juvenile character wearing a diaper in the same scene as sexual activity, as outlined in section 2.7.1 for instance, would not be, independently of the undergarment as a factor). All soiled or leaking undergarments (diaper, underwear, etc.) must be rated mature or adult regardless of whether the character is a juvenile (per section 2.7.1) or an adult, per Fur Affinity's rating guidelines in our upload policy, section 1.1 regarding depictions of bodily waste. 2.7.3 Art Style Subjectivity Art is very subjective and certain art styles can sometimes make it difficult to determine the age of a character. Fur Affinity must moderate the site fairly with regard to its users, its partners, and the law. As such moderator discretion will be required in uncertain or edge cases. There are no special exceptions based on lore or fantasy worlds. To determine if reported content meets our guidelines, we will examine the artist's previous works, user history, and general style. If you have works removed that you disagree with, please appeal the decision via appeals@furaffinity.net or via our Trouble Ticket system 2.8 Content Lacking Artistic Merit Content lacking artistic merit is not permitted on FA, and includes such items as: Photography focusing on body parts without creative content. Placeholder content with empty documents or blank submissions. Text-only imagery. Content modified to be generally unviewable through use of filters, blurring, or censorship. 2.9 Duplicate Content Duplicate content is not allowed. 2.10 Flashing Images Content that may be seizure inducing or contains rapidly flashing images is not allowed. 2.11 Traced, Plagiarized, or Stolen Content Traced, plagiarized, or stolen content is not allowed. This includes any character that is heavily derived from another user's unique character. 2.12 Content Involving Real Hate Groups or Terrorist Organizations Content which displays imagery, language, or rhetoric associated with real world hate groups (e.g. Nazism, ISIS, KKK), terrorists, mass murderers, or serial killers is not allowed whether that content promotes, denounces, or incidentally features these groups and their symbols. 2.13 Artificial Intelligence (AI) Content made using AI, machine learning, or similar generators is not allowed, including derivative works created from it (e.g. stories, audio, backgrounds, paint-overs, using one's own content to generate new content). 3. Photography 3.1 Sexual Activity Photography featuring sexual activity (human or animal) is not allowed. 3.2 Adult Objects Photography displaying adult toys (sex toys or sexually modified objects) is not allowed unless you created them from scratch, they are not in use, not being worn, don't show signs of having been in use, and you mark them with the adult content rating. 3.3 Indecent Photography Photography depicting nudity or physical contact with nudity (exposed buttocks, breasts, bulges, outlines of genitalia, etc.), indecently-clothed models (undergarments, diapers, lingerie, etc.) is not allowed. Exceptions may be made for swimsuits worn in public locations, such as a pool or beach, but not activities such as breastfeeding. 3.4 Bodily Fluids, Gore, Injuries, Death Photography containing bodily fluids (with the exception of saliva), gore/injuries, or death is not allowed, unless the content is fake, special effects, or the final product of taxidermy when the pelt is preserved in good condition and the presentation is in good taste. This includes freeze dry and wet taxidermy as well as bones and finished pelts, but excludes anything raw or gory. 3.5 Photos Of Others’ Work Photography focusing on artwork or photographs that you do not own or have express permission to photograph and display is not allowed. 3.6 Animals Eating Photography of animals eating other animals, living or pre-frozen, is not allowed. This does not include foodstuff like chicken breasts, steak, or kibble. 4. Screenshots and 3D Models 4.1 Screenshots Screenshots of applications, copyrighted content (movies, tv shows, etc), or websites are not allowed, unless showcasing new, original, user-created content (models, textures, etc). This rule does not apply to games with user created content (Garry's Mod, Second Life, Minecraft, IMVU, etc). 5. Music and Audio 5.1 Disruptive Audio Audio that is intentionally disruptive (e.g. loud, screeching) is not allowed. 6. Avatars and Profile Banners 6.1 Avatars and Profile Banner Requirements Content must be rated General as per section 1.1 and follow all other rules of this document, the Code of Conduct, and Terms of Service. 7. Enforcement 7.1 Penalties Failure to abide by the content of this document may result in the following penalties. ("You" refers to you and all accounts you own/operate): 1st Level Offense - You will receive a Warning Notice. 2nd Level Offense - You will be temporarily suspended for 1 day. 3rd Level Offense - You will be temporarily suspended for 3 days. 4th Level Offense - You will be temporarily suspended for 1 week, and will receive a final warning to cease violating the relevant section. 5th Level Offense - You will be permanently banned from using Fur Affinity's services. Any future accounts you create will also be Permanently Banned. 7.2 Stacking Only violations of the same section stack when concerning penalties. e.g. If you violate section 1.10 and then subsequently section 1.11, you will receive warnings both times. 7.3 Escalation Violations of the following sections may be escalated immediately to the 4th Offense Level: 2.4, 2.7, 2.11, 3.1, 3.2, 3.3, 3.4, and 3.5. These sections have been highlighted for your convenience. 7.4 Blocks, Suspensions, and Bans If for any reason, your account is suspended, banned, restricted, blocked (via users), or otherwise disabled by Fur Affinity, you may not create another account with the intent to bypass these limitations without our permission. Any effort to evade these limitations yourself or on behalf of another user may result in a suspension or the length of your current suspension being extended or changed to a permanent ban. When permanently banned, you may not use Fur Affinity as a registered user nor create accounts. 7.5 Further Details All decisions are made based upon your history, the severity of your offense, and the discretion of the Moderator. If you disagree with the decision of a Moderator, you may appeal his decision by opening a Trouble Ticket under the Dispute Administrative Action section. If your account is currently inaccessible due to a Suspension or Ban, you may email appeals@furaffinity.net. Disputes must be filed within 6 months of when the decision took place.'''
