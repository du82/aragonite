["https://furaffinity.net/help"]
title = "Help page -- Fur Affinity [dot] net"
description = "Fur Affinity | For all things fluff, scaled, and feathered!"
full_description = '''Browse Search Support ▼ News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Log In or Create an Account Log In Create an Account News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Fur Affinity | Support Updated - 11/28/2024 1. General 2. Account 3. Uploads & Submissions 4. Tags & Codes 5. Flash General Why do I sometimes see a page saying “We are checking your browser” from a website called CloudFlare when I try to access FA? If you are receiving a message from CloudFlare, our DDoS protection system, then there is currently a check in place to make sure your browser is not part of a DDoS attack. Rest assured that after a few seconds you will be redirected to FA. How do I use the Commissions tab? Click here for a short walkthrough that should answer all your questions. I’m missing notifications! To help maintain server performance, Fur Affinity periodically removes notifications which are older than a year old. Fur Affinity says I have an unread notification but I can’t find it. In rare instances the system may show you have an unread note (1N) but you’re unable to find it in your inbox. Simply open up a ticket (Category: User Interface Issue) and report that your notifications are out of sync and we will be able to assist. Account How do I reset my password? You can go to the password recovery page and follow the steps there to reset your password. If you continue to have issues please contact accounts[at]furaffinity.net How do I delete my account? You can choose to disable or delete your account from the Account Settings page. How do I change my username? Account renames are currently in development. Once completed, we will make them available to all Fur Affinity members. We do not have an ETA on when renames will be implemented into the site, but will make the system accessible to all users once available. Can I have an account that has been abandoned? We are no longer transferring accounts. How do I block other users from contacting me? Blocking a user will prevent that user from commenting on your content and responding to your comments. It will not remove their watch nor prevent them from accessing your content. Users may block anyone for any reason and Fur Affinity will not contact users on your behalf. Do not have other users contact someone who has blocked you as this violates our Code of Conduct. You can block a user by visiting their profile and selecting the “+Block” option from the tabs at the top of their profile. Additionally, you can block a user by going to the Profile Info page and putting the user’s name on your block list. Make sure to check your spelling and have only one user per line. Do not include the ~ symbol preceding the username or underscores. A user has passed away. Is there a way to show this on the profile? An account marked as deceased will show ∞ next to the username and will no longer be usable. When a user passes on we have the ability to mark the account as deceased to keep it as a memorial. In order for us to do this open a Trouble Ticket with the required documentation that the user has passed on. This can be an obituary, a news article, a death certificate, or a funeral pamphlet. Once administration has verified the information the account can be marked as deceased. My avatar is updated but the little icon version won’t change! The little icons that show using :usernameicon: and :iconusername: update at Midnight Eastern Time. I keep getting logged out. Most of the time this is an issue with security browser settings. You can resolve this with the following steps: 1. In your FA Account Settings set the Account Security Level to Full Security Mode. 2. Clear all cookies for furaffinity.net in your browser. This will also log you out. 3. Log back in again. This should make sure you are issued the correct cookies from here on out. Uploads & Submissions The submission titles and artist names under the thumbnails disappeared. What do I do? There is a function on FA to toggle the display of image information. Simply go to your submission inbox, the browse page, your favorites, or a gallery then click the button labeled “Enable Titles”. That should make them reappear. When trying to view submissions I keep getting this "You are not allowed to view this image” message. Why? You likely have your Content Filter set to General, which means it doesn't let you view Mature or Adult content. You can change those settings on the Account Settings page. Please be advised that you may only view Mature or Adult content if you are over 18. If you enable this content and are under 18, disciplinary action may be taken against your account. If you still run into this issue with Mature and Adult content enabled you’ll want to ensure the SFW button at the top of the page isn’t highlighted. I don’t want my content to show up on search engines. You can disable search engine indexing via the Site Settings page. Please note this doesn't remove your content on search engines (we have no way to do that) but it prevents future content from being indexed. Tags & Codes Text Formatting [b]bold text[/b] Bold Text. Shortcut: CTRL+B [i]italic text[/i] Italic Text. Shortcut: CTRL+I [u]underlined text[/u]Underlined Text. Shortcut: CTRL+U [s]strike out text[/s] Strike Out Text Text [sup]supscripted[/sup] Text supscripted Text [sub]subscripted[/sub] Text subscripted [color=green]text[/color] This is green and This is #ffcc00. You can use either the color name or the "hex color code" that starts with a "#". [spoiler]spoiler text[/spoiler]This is a spoiler! Text Codes (c) All your base are belong to us © (tm) 'Sup™ (r) Spam® Headers [h1]H1 heading[/h1] H1 heading [h2]H2 heading[/h2] H2 heading [h3]H3 heading[/h3] H3 heading [h4]H4 heading[/h4] H4 heading [h5]H5 heading[/h5] H5 heading Horizontal divider More then 5 dashes in a line are replaced with a horizontal divider. ----- Positioning [left]Left aligned text [/left] Left aligned text [center]Centered text [/center] Centered text [right]Right aligned text [/right] Right aligned text Quotes [quote]Example text.[/quote] Example text. [quote=Fender]Example text.[/quote] Fender wrote:Example text. Note: Nested quotes are not supported. Links Links automatically translate to recognized URLs, such as www.furaffinity.net. [url=https://www.furaffinity.net/user/fender]Fender's page[/url] Fender's page Fender's page [url=/user/fender]as a relative URL[/url] Fender's page as a relative URL Long URLs will be automatically compressed to the first 60 or 70 or so characters. YouTube [yt]https://www.youtube.com/embed/Qit3ALTelOo[/yt] Note: YouTube embedding only works in journal bodies, nowhere else. Both https://www.youtube.com/watch?v=Qit3ALTelOo full video URLs and https://youtu.be/Qit3ALTelOo "share" URLs are supported. Icon Embedding :iconusername: or @@username Add a user's avatar with their name tagged at the end. :iconfender: fender :usernameicon: Add a user's avatar without their the name. :fendericon: :linkusername: or @username Creates a link to a user's page. :linkfender: fender Comic Navigation [1896964, 1010790, 3277777] <<< PREV | FIRST | NEXT >>> This is a quick way to create navigation links comics or submissions as part of a series. Note: The numbers above represent the submission IDs. 1. Only one whitespace character is allowed anywhere between the numbers, commas, and square brackets. 2. To disable a certain link, for example you don't have the "next" link on your latest piece or the "first" link on your first one, replace the ID with a dash, "-". and that link will be disabled. 3. Works only in submission descriptions. Flash Flash is discontinued. How is Fur Affinity preserving Flash content? Fur Affinity uses Ruffle for Flash content. Ruffle is a Flash emulator that is currently in development, and as of this time many features are missing. At this time, ActionScript 1.0 and 2.0 are mostly supported, while 3.0 is still in development. Additionally, Flash submissions used to deliver video playback may not work correctly. New builds of Ruffle are published almost nightly, and we will be continuing to update the emulator to improve Flash compatibility on a weekly basis. You can follow Ruffle’s development by visiting https://ruffle.rs'''
