title = "Fender's Journals -- Fur Affinity [dot] net"
description = "Fur Affinity | For all things fluff, scaled, and feathered!"
full_description = '''Browse Search Support ▼ News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Log In or Create an Account Log In Create an Account News & Updates Help & Support Advertising Black Lives Matter SUPPORT FA Subscribe to FA+ FA Merch Store RULES & POLICIES Terms of Service Privacy Code of Conduct Upload Policy SOCIAL Discord Twitter Feb 14th 2025- Furry Musicians Contest Posted 2 weeks ago Our friends at furry_musicians are back with their annual Express Yourself contest, and we're happy to once again host their announcement! There so many talented musicians in our community and we love seeing the entries entered each year! Keep in mind that this contest is run by them, Fur Affinity is just hosting and promoting the event! To Submit to the 2025 Express Yourself Contest, please follow this link to our home journal, where we have set up a place to do so! https://www.furaffinity.net/journal/11062378 Hello, folks! Puppy here from Furry Musicians with an announcement for the 2025 Express Yourself Contest. We’re going bigger and better this year, with over $800 worth of prizes and some fresh, unique opportunities for big promotion. Everything you need to know is below, so get reading, critters! WHAT IS THE EXPRESS YOURSELF CONTEST? WHAT IS THE PROCESS? The contest is to express yourself through a minute-twenty (1:20) musical piece. The first round is a Public Submission Round, meaning anyone can submit a song and so long as it follows the rules, be considered. The contest then undergoes a private voting round, where the songs from the Public Submission Round are placed on a rating criteria and at least twelve are selected to move on by our panel of judges (Myself, Yangwatanabe & Felix the Coyote (guest judge)). The remaining twelve, those that scored the highest on our rating criteria, will be moved directly into the Semifinal Rounds. The Semifinal Rounds will be publicly voted on by you, the community. After the Semifinal Rounds, a Final Round consisting of 5 submissions will occur to pick this year's winning 3, and prizes will be distributed! This is also a public voting round. THE RULES / RATING CRITERIA Can be found on our original journal over here >>> https://www.furaffinity.net/journal/11062378 Make sure you read them before submitting! A UNIQUE OPPORTUNITY FOR NON-MUSICIANS ARTISTS: As always, we are looking for new artists to contribute to the prize pool! If you are interested in having your very own placement prize promoted like this, reply to the designated comment on the submission journal. Yes, you will be paid. Again, submission for the 2025 Express Yourself Contest should be sent to the journal found on Furry Musicians -Reminder to be excellent to each other in the comments and keep them on topic ❤️ 46 Comments | View Journal Feb 13th- Tag FAQ, Memorial Reminder, & Town Hall Posted 2 weeks ago Tag Blocking FAQ, Memorial Reminder, and Town Hall Prep Hey there! We have a few things we would like to update you on so please read through the journal in its entirety! Celebration of Life and Memorial Update! Firstly we would like to remind you all that there are only a couple weeks left to get submissions in on Neer’s memorial here journal link. We will be attending Fur The More from March 6th-9th if you wanna stop by and see us in the Dealer’s Den or meet us during the Celebration of Life on Sunday the 9th at noon. You can pre-reg for the con here Fur the More link but a reminder that the Celebration of Life itself is free to the public! Tag Blocking Update Next we want to update you on the FAQ in regards to Tag Blocking and items we are working on from the feedback received! FAQ link We know we’ve been silent a bit but we’ve had our nose to the grindstone trying to get some updates fleshed out, on-boarding new mods, training, and catching up on tickets that have piled up during the past few months. Things are moving along well in that area and starting to see progress has gotten us very eager and lively again after many months of grief and depression. Town Hall Announcement While we are waiting until things are set to push live we want to put together a Town Hall. We realize it’s been a long time since Fur Affinity had one! With all the change that’s happened over the last few months we think it might be a good idea to catch the community up on what all has happened and what our goals are moving forward. We know this may be a bit of a chaotic idea, so we are going to follow what was done the last time and post a form to collect questions ahead of time that we will then answer live. Form Link We will collect questions for two weeks, closing on February 27th, then prep time for two weeks with a plan to go live for the event on March 15th around 1pm EST. It will be recorded for those that aren't able to make it and we will see about transcribing as well. Our hope is to bring a breath of fresh air into FA and get back to supporting the community, planning events, and working together to improve the site. This site means so much to all of us, and with all the community has done to support FA and keep it going, it’s about time FA started supporting the community properly in return. We want to do all we can to keep it going in a positive direction. FA has had an unfortunate history of over promising and under delivering and transparency being something that was sorely lacking. That is something we aim to fix, especially after all the feedback in regards to the previous rules update. We are not at our best yet and still learning and recovering from all that's happened. We're sure mistakes will be made but we want to learn from them and we aim to do better and work with the community. Fender Journal Comments The previous journal was a bit of “testing the waters” in regards to having the comments turned back on. We were really pleased with the majority of the comments following the guidelines and not causing trouble. We would like to try leaving them open again and see if we can continue the positivity in being able to communicate there. Things to keep in mind- Comments need to stay PG-13 at most. We need everyone to remain respectful, on topic, and remember that the rules apply to Fender journals too. If you don't have something nice to say, take it elsewhere. Be excellent to each other. 474 Comments | View Journal Jan 16th 2025- Dragoneer Memorial Community Project Posted a month ago Hey there everyone! Specifically Sciggles here to make some announcements regarding Dragoneer's public Celebration of Life. First note- We WILL have comments turned on for this journal...it is the first time in years we've done this. So please, I need everyone to remain respectful, on topic, and remember that the rules apply to Fender journals too. If you don't have something nice to say, take it elsewhere. Staff will be monitoring replies. Secondly- I know many of you have feedback for tag blocking! We've been collecting them and are putting together some bug fixes and add-ons that will hopefully be ready to go in the next couple weeks. This journal isn't about that either though so let's try to keep it on topic for this one ❤️ You can send your feedback if you haven't yet via trouble ticket FA trouble tickets under "feedback". On to the community project! This song was written and performed by our very own Sakuri Rainne novetrix Additional vocalists are Palikui Manic Knux (URL linktr.ee/Manicknux ) Tygre (URL hyperfollow.com/Tygre ) (background is an edit from a Bluey episode with a quote I hold dear) "...sometimes special people come into our lives, stay for a bit and then they have to go" "...but that's sad!" "It is...But the bit where they were here was happy, wasn't it?" We wanted to give people the opportunity to submit art to slide show in this video while it was played live at his public Celebration of Life. Which will be hosted at FurTheMore on March 9th at 12pm EST in Herndon, VA. https://furthemore.org/ for more information and location of the event. To clarify some things, FurTheMore has been gracious to allow us space during their convention to help save on funding and in return we will be making a donation to their non-profit. You do NOT need to register to FurTheMore to attend this specific event. It is free to the public. However, if you wish to attend or access any other part of the convention YOU WILL NEED TO REGISTER. We are looking into options on how to stream this for those who can't make it. If you don't have art but still want to contribute to the celebration you may also submit a SHORT video or recording sharing kind words, memories, stories you have of Neer. **EDIT** art of Preyfar and Wren (his hyena and eevee character) are also acceptable to submit! The art can feature others too so long as its SFW Reference Sheets Dragoneer Preyfar Wren All submissions accepted will be listed in a master post with credits to each contributor Please fill out this form or comment below with what you would like to share https://forms.gle/z3uB3PEG9msdz8vFA (must be SFW only). It can be art already done in the past or something new. You can also email submissions to info[at]sciggles[dot]com. Submissions and writings will be reviewed before accepted into the project. We hope many of you will join us in creating this community piece of art to celebrate the life of Neer as a friend, family member, and pillar of the furry community. Please have all submissions in by March 1st so that we have time to piece it all together! There will be another update with the finished project as well as "estate sale" items being posted to help conclude some of the final affairs lingering, this is a request from Momma Neer but I promise the GoFundMe link and posts of the like will be ending soon. We just need to get through these last few hurdles. We are all incredibly grateful for all your support through this. We literally would not be online right now if not for the generosity of this community. Thank you and I can't wait to see what we can pull together! ~Sciggles 463 Comments | View Journal Jan 9th, 2025 - Tag Blocking and Policy Update Posted a month ago Tag Blocking and Policy Update Happy New Year!! We are excited to start the year off by announcing some updates we’ve been working on for the last few months! Client Side Tag Blocking The new Tag Blocking feature will allow users to censor artwork that contain specific tags. There are two ways you can add and remove tags to your blocklist: *You can access the page the offending artwork is on and select the tags you'd like to block/unblock in the future. *You can add/remove them manually on the Profile Info page: "Profile Info" There is also an option to hide content that has no tags you can adjust the setting on your "Profile Info". Currently the system only filters exactly what is tagged. For example, blocking "dog" will not filter out something like "canine" or "hotdog". This is intended to avoid accidentally blocking unrelated content. This is new so there may still be some lingering bugs or fixes as we find them. If you encounter anything please be sure to put in a ticket with a screenshot so we can address it! This is a short term stopgap solution for a long time requested system. The hope is that this will provide users with the basic functions while we work on a more robust system. ⚠️PLEASE NOTE⚠️- Classic theme is no longer being updated. Tag blocking is only available on modern themes. Contacts Update We’ve updated the contacts system! This will be a mostly invisible backend change, but you will notice a range of new contact options that will include popular requested services such as; Bluesky, Cara, Mastodon, Piczel, Itaku, Pixiv, and personal emails have been added to the roster. With help adding your Mastodon contact you can link your account with FA by using this: Link. The update is meant to allow us to add requested contacts more easily moving forward. We want users to be able to keep in contact with each other as much as possible by keeping up and staying current in regards to new services. New 2.7 Write Up Many have been anxiously awaiting a follow up to the 2.7 policy we placed on hold a few months ago. We took a bit longer than we ideally wanted but we hope the time and efforts put into trying to resolve this that best works for all will be seen. As a recap, a few months ago there was a major issue that involved the ABDL and babyfur community, they were the targets of a deliberate mass-reporting incident and our response to the matter was not handled with the proper care and attention it deserved. A rushed policy change happened without enough consideration to what it would mean to these communities was implemented and then put on hold soon after hearing community feedback. During that time many hours have been put into discussions, meetings, and feedback about this subject from our community discord, social media, trouble ticket feedback, fellow art sites, as well as meetings with lawyers, our host, and community members directly in these affected communities. With all this we feel we have put together a solid rewrite that works for all in the safest way. We would also like to remind everyone of two things: first, malicious mass reporting is an abuse of the trouble ticket system and will not be tolerated. Second, harassment of anyone is not allowed on Fur Affinity; this includes attaching negative implications to people because they enjoy particular types of art. If this is happening to you on Fur Affinity, please report it. We mentioned both of these things in previous updates but would like to reiterate them, since nothing in this update changes that. If there is content that you don’t want to see, use the new tag blocking system. The new policy:2.7 Baby, Juvenile, and Non-Adult Appearing Characters Baby, juvenile, or otherwise "non-adult" appearing characters, henceforth referred to simply as "juvenile characters", are defined as either: Explicitly being stated in the submission as under the age of 18, Or: Having features or appearances of that of a child or young animal/creature, real or fictional. Context will be carefully considered for submissions that include stylized content such as chibis, “shortstack” characters, or mental regression of adult characters. See section 2.7.3 for more information. 2.7.1 Rules Related to Juvenile Characters Juvenile characters ARE permitted in higher rated submissions (mature, adult) so long as the submissions meet all the following requirements: *Juvenile characters are not permitted to be in the same scene (such as sharing a comic panel, contiguous image, reference sheet, specific section of a story, etc.) where characters are engaging in sexual activity. *Depictions of birth or breastfeeding with no sexual activity in the presence of a juvenile is permitted. *Juvenile characters are not permit'''
