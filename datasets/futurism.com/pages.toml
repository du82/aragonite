["https://futurism.com/the-byte/wearable-muscles-strap-stronger"]
title = 'Scientists Show Off "Wearable Muscles" You Can Strap on to Get Way Stronger'
description = '''A team of researchers at ETH Zurich in Switzerland have created a "wearable muscles" exosuit that's designed to give its wearer serious strength boost.'''
full_description = '''Body BuilderScientists Show Off "Wearable Muscles" You Can Strap on to Get Way StrongerbyVictor TangermannIt's compact enough to fit underneath a shirt.6.27.22, 11:00 AM EDTFlorian Haufe/ETH ZurichIt's compact enough to fit underneath a shirt.ExomuscleA team of researchers at ETH Zurich in Switzerland have created an intriguing new exosuit that's designed to give its wearer an extra layer of muscles.The suit is intended to give those with limited mobility back their strength — and early trials are already showing plenty of potential, the scientists say.The soft "wearable exomuscle," dubbed the Myoshirt, automatically detects its wearer's movement intentions and use actuators to literally take some of the load off. MyoshirtThe device is also impressively unobtrusive. The box housing the suit's electronics weighs a mere 8 pounds, the researchers say, while the shirt itself is thin enough to fit underneath clothing."Although hospitals have numerous good therapy devices, they are often very expensive and unwieldy," said Marie Georgarakis, a former ETH Zurich doctoral student and author of a new paper about the suit published in the journal Nature Machine Intelligence, in a statement.In an experiment with 12 participants, including ten who didn't have any physical impairments, one person with muscular dystrophy, and one with a spinal cord injury, the team found the exomuscle enabled them to lift their arms for much longer.For the participant with muscular dystrophy, the suit was able to increase endurance by roughly 60 percent. The person with the spinal cord injury was also able to perform exercises for three times as long a period thanks to the suit.In other words, early results are promising. And the team is already looking forward to take the Myosuit out for a spin in the real world."In the next phase, we want to test our prototype outside the lab in the natural environment of future wearers and use the results to further improve it," said Michele Xiloyannis, co-author, in the statement.More on exoskeletons: Japanese Company Creates Suit That Turns You Into a Towering MechaShare This Article'''
