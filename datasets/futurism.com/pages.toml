["https://futurism.com/categories/enhanced-humans/page/60"]
title = "Enhanced Humans | Page 60 of 60 | Futurism"
description = "Augmented humans aren't starry-eyed visions of the future—they're walking among us right now. From cochlear implants to robotic limbs controlled by our minds, the fields of biotechnology, nootropics and gene editing are allowing us to dictate evolution and engineer a new kind of human. Here, we’ll take a look at the scientific and technological breakthroughs like CRISPR that are transforming our bodies and reshaping the future of humanity. Page 60 results."
