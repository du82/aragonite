["https://futurism.com/neoscope/irritable-bowel-microplastics-gut"]
title = "Inflammatory Bowel Disease Linked to Microplastics in Your Gut"
description = "A new study conducted by top scientists in China found a link between microplastics and IBD, or inflammatory bowel disease."
full_description = '''Gut PollutionUpdated 12.23.21, 2:02 PM EST / by Lonnie Lee HoodInflammatory Bowel Disease Linked to Microplastics in Your GutWe've just got a gut feeling...Updated 12.23.21, 2:02 PM EST / Lonnie Lee HoodImage by Getty ImagesPlastic ProblemScientists around the world have been ringing alarm bells about microplastics, tiny particles now found in pregnant people's bodies, in the deepest reaches of the Earth's oceans and unfortunately, your gut. For years it's been unclear how these tiny pollution particles affect human health, but continued research is starting to zero in on the consequences.Case in point, a new study by scientists in China found a link between microplastics and IBD, or inflammatory bowel disease. The report, published this week, examined fecal samples from patients with IBD for the presence of microplastics."We found that the fecal [microplastic] concentration in IBD patients was significantly higher than that in healthy people," the authors wrote in the study. "In total, 15 types of [microplastics] were detected in feces."Entry PointAccording to Science Alert, it's not clear whether people with IBD have more trouble filtering plastic out of their body, causing the increased levels, or whether the plastic itself causes the disease. What is clear, though, is that there's some kind of link between chronic gut issues and microplastics exists, and it's strong.There are many ways that microplastics get into our bodies, according to Discover Magazine. Plastic we throw away breaks down in the sun, ocean water and in the wind. Then we breathe in dust, drink water from plastic bottles or from the tap, and we eat meat — shellfish in particular. All these can contain microplastics and chemicals.Scientists say we're reaching an irreversible tipping point in the fight against plastic pollution. Once chemicals and particles enter our bodies, they may be with us for generations, and it's not exactly easy to comb the Earth for microscopic particles.Bleak? Maybe, but knowledge is power.Headline updated.More on plastic problems: Pollution is Shrinking Human Penises, Warns Famous Environmentalist Share This ArticleImage by Getty ImagesRead This Next2.07.18 A Possible Culprit in the Infertility Crisis: Plastic1.31.17 New Evidence Shows That Air Pollution Causes Alzheimer's and Dementia3.01.25 A Cancer Scientist Got Fired and Replaced Their Research Data With Wildest Thing You Can Imagine2.27.25 DevelopmentsCops Investigating Bizarre Circumstances of Gene Hackman's Death2.27.25 DevelopmentsMeasles Outbreaks Are Popping Off Across the Country'''
