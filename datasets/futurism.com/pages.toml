["https://futurism.com/neoscope/cops-investigating-gene-hackman-death"]
title = "Cops Investigating Bizarre Circumstances of Gene Hackman's Death"
description = 'The death of legendary actor Gene Hackman and his wife Betsy Arakawa has been labelled "suspicious" by authorities.'
full_description = '''Crime SceneFeb 27, 5:11 PM EST / by Frank LandymoreCops Investigating Bizarre Circumstances of Gene Hackman's Death"The autopsy is going to tell us more."Feb 27, 5:11 PM EST / Frank LandymoreImage by Hector Mata / AFP via Getty / FuturismDevelopmentsThe passing of actor and Hollywood icon Gene Hackman was tragic enough.But now his death, along with his wife, classical musician Betsy Arakawa, has been labelled "suspicious" by investigators, NBC News reports.On Wednesday, Hackman, 95, and Arakawa, 64, were found dead in their home in Santa Fe, New Mexico, along with one of the couple's dogs.While initial reports stated that foul play had been ruled out by police — which they still maintain — detectives in a recently released search warrant wrote that Hackman and Arakawa's deaths are "suspicious enough in nature to require a thorough search and investigation," as quoted by NBC.The grim discovery was made by a maintenance worker who checked inside the household after noticing that the couple's front door was left open. Investigators who arrived at the scene found Hackman's body lying in a mudroom, while Arakawa was found on a bathroom floor with a space heater near her head. The deceased dog was discovered in Arakawa's closet, while two others on the property were still alive: one in the bathroom, and another outside.A deputy noted that Hackman appeared to have suddenly fallen. In the bathroom where Arakawa was found, a bottle of pills was spilled on the countertop. It's possible that the space heater "could have fallen in the event the female abruptly fell to the ground," the deputy said, per NBC.The fire department found no signs of a carbon monoxide leak or poisoning, according to the warrant, which quickly emerged as theories that could explain the grisly scene. One detective notes, however, that such a cause of death can be difficult to detect, per the Associated Press. Nearby gas lines were tested by New Mexico Gas Company, but no issues were found with any of the pipes.Neither body showed obvious signs of trauma, police said, stressing that it's still early into the investigation."The autopsy is going to tell us more," Santa Fe county sheriff Adan Menda told the New York Times. Hackman, a two-time Oscar winner, confirmed his retirement from acting in 2008, ending a legendary career spanning more than four decades. He boasted a singular screen presence — somewhere between a leading man and character actor, excelling at both. He brought vigor and an often buried sense of humanity to all his roles, no matter how larger than life. Deceptively versatile, his trademark wry smirk and gritty mug were equally suited for dogged bastards, moody messes, and sneering villains. No one can forget the palpable desperation he brought to his now genre-defining performance as tough-as-nails cop Popeye in "The French Connection" (1971). Hackman was also effortless in comedic roles, like in what was his veritable swan song as a blundering head of a family in "The Royal Tenenbaums" (2001).Fellow industry legend and New Hollywood trailblazer Francis Ford Coppola grieved Hackman's passing. "The loss of a great artist, always cause for both mourning and celebration: Gene Hackman, a great actor, inspiring and magnificent in his work and complexity," Coppola, who directed Hackman in the Palme d'Or winning film "The Conversation" (1974), wrote on Instagram. "I mourn his loss, and celebrate his existence and contribution."More on Hollywood: NASA Posts Touching Tribute to the Late David LynchShare This ArticleImage by Hector Mata / AFP via Getty / FuturismRead This Next12.16.20 DevelopmentsTom Cruise Melts Down at "Mission Impossible" Crew For Not Following COVID Rules3.01.25 A Cancer Scientist Got Fired and Replaced Their Research Data With Wildest Thing You Can Imagine2.27.25 DevelopmentsMeasles Outbreaks Are Popping Off Across the Country2.26.25 TreatmentsNow That Trump Has Banished the Woke From Science, This Truth-Telling New Scientific Paper Reveals What COVID Vaccines Actually Do to Children2.26.25 DevelopmentsDark Mark Appears on Trump's Hand'''
