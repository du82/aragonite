["https://futurism.com/neoscope/american-alcoholism-getting-worse"]
title = "American Alcoholism Is Getting Worse"
description = "Surges in alcohol consumption during the early pandemic seem to be growing rather than easing up, raising questions about what habits will persist on."
full_description = '''American Exceptionalism7.7.21, 11:40 AM EDT / by Dan RobitzskiAmerican Alcoholism Is Getting WorsePandemic-related spikes in alcohol sales and consumption continue to grow.7.7.21, 11:40 AM EDT / Dan RobitzskiImage by FuturismOrganic ChemistryAmericans started to drink a whole lot more during the coronavirus pandemic than they did prior to it, and those numbers still seem to be climbing.Alcohol sales and use tend to spike after stressful events in the United States, Axios reports. Similar trends occurred in the aftermath of 9/11 and Hurricane Katrina, for example. But what could have been a brief surge in heavy drinking as we all navigated the confusion and horror of the first months of the pandemic seems to have only grown, raising questions about what habits will persist whenever the COVID era is finally over.For example, an American Psychological Association (APA) poll from March 2021 probed changes to Americans' lifestyles one year into the pandemic — and found a sharp yet ongoing increase in drinking, alongside other changes like worsening sleep and weight gain."We've been concerned throughout this pandemic about the level of prolonged stress, exacerbated by the grief, trauma and isolation that Americans are experiencing," APA CEO Arthur Evans said in a press release. "This survey reveals a secondary crisis that is likely to have persistent, serious mental and physical health consequences for years to come."This also seems to be a distinctly American trauma response, according to Axios, since Europeans actually drank less during the early months of the pandemic.People are going to cope how they're going to cope. But as Axios notes, the troubling thing here is that solitary rather than social drinking seems to be on the rise. As Kate Julian recently wrote in The Atlantic, drinking heavily on one's own is far more likely to lead to problem behavior than grabbing a beer with friends.Share This ArticleREAD MORE: America's deepening drinking habit [Axios]More on drinking: This Study To Assess How Drinking Affects Our Health Is a Master Class in How To Do Science PoorlyImage by FuturismRead This Next1.29.25 DevelopmentsBefuddled RFK Jr. Says There Were No Chronic Diseases Back When He Was Young1.28.25 DevelopmentsRFK Jr.'s Cousin Says He Used to Grind Up Baby Animals in His Drug Den1.06.25 DevelopmentsKids Are Huffing Galaxy Gas Until They Get Tremors, Limps and Lose Bowel Control12.14.24 Organic ChemistryScientists Horrified by "Mirror Life" That Could Wipe Out Biology As We Know It11.21.24 DevelopmentsTrump Nominates Television Quack Dr. Oz to Run Medicare and Medicaid'''
