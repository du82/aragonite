["https://futurism.com/uae-sheikh-tahnoon-wealth-ai"]
title = "This Emirati Prince Controls Four Times Elon Musk's Wealth"
description = '''The United Arab Emirates' so-called "spy sheikh" controls a whopping $1.5 trillion in wealth, and he's funneling a good hunk of it into AI.'''
full_description = '''Sheikh, Rattle, and RollFeb 27, 4:19 PM EST by Noor Al-SibaiSheikh, Rattle, and Roll/Artificial IntelligenceThis Emirati Prince Controls Four Times Elon Musk's Wealth and He’s Going All-In on AITalk about power./ Artificial Intelligence/ Donald Trump/ Investors/ StargateFeb 27, 4:19 PM EST by Noor Al-SibaiImage by Andrew Harnik / Evelyn Hockstein / Pool / AFP via Getty / FuturismThe United Arab Emirates' so-called "spy sheikh" controls a whopping $1.5 trillion in wealth — and he's funneling a colossal stream of it into AI, making him one of the world's most powerful figures in the space.As the Wall Street Journal reports, Sheikh Tahnoon bin Zayed Al Nahyan — the son of the UAE's founder and brother to its crown prince, and at one time a top contender for the throne himself — has already swiftly begun achieving his dream of becoming a global AI power player thanks to MGX, his mysterious AI investment vehicle.Launched in 2024, this "investment fund of the future" boasts $100 billion in investments from Tahnoon, who along with possessing a purportedly vast personal fortune is the head of two Emirati wealth funds that put him in control of more than quadruple Elon Musk's net worth, which stands at roughly $356 billion.While we don't know much about the exactitudes of MGX's projects, the Abu Dhabi-based fund briefly went viral in January after being announced as one of the investors backing Stargate, President Donald Trump's new $500 billion AI initiative. Shortly thereafter, people began buying up stock in a company that uses "MGX" as its ticker — which turned out to belong to Metagenomi, a California-based biotech startup, and not the Emirati AI fund.Beyond that, most of the sheikh's public profile involves either "Hydra," the chess computer he poured money into in the early-to-mid-2000s — or his family's corruption scandals, which include allegations of widespread human rights abuses and illegal financial practices so egregious, it earned the confederation of Arab states a recurring spot on the United Nations' "black list."If none of that was sketchy enough, Tahnoon is also an advisor to the Emirates' national security apparatus, where he's been implicated in spycraft, including the distribution of a messaging app that US officials alleged was used to eavesdrop on users.Despite those concerns, Musk and the Trump administration seem more than happy to jump into bed with Tahnoon — and the feeling seems to be very mutual.Ahead of the presidential election last year, the sheikh flew to the United States to meet with the South African-born billionaire at his Giga Texas factory and was seen posing outdoors — a major thing for Tahnoon, who suffers from an eye condition that requires he wear sunglasses even indoors — in jeans and a t-shirt instead of his traditional Emirati prince's garb. Though the specifics of that discussion weren't publicized, it seems highly unlikely that the moneyed pair talked about the UAE's well-documented record of torturing migrant workers.While Tahnoon is most certainly not the only purported human rights criminal to be investing big in AI, he's perhaps one of the most prominent ones ever to do so — though in the eyes of these American benefactors, that may be a good thing.More on weird AI investors: There’s Something Very Weird About This $30 Billion AI Startup by a Man Who Said Neural Networks May Already Be ConsciousShare This Article @media (max-width: 1024px) { #railParFuture { height: 0px !important; overflow: hidden !important; } } Read This NextSlop OfficialsAs Trump Offers Buyout to Get Rid of as Many Government Workers as Possible, OpenAI Announces New Version of ChatGPT Designed to Do Government WorkBad MorningGullible Donald Trump Thinks an AI Slop Car Is a Real OneBad BetTrump Embraced AI and It Exploded Spectacularly in His FaceStargate GateThere's Apparently a Huge Financial Problem With Trump's Massive AI ProjectAutopilotTrump Admin Accused of Using AI to Draft Executive Orders'''
