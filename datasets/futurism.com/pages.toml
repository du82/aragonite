title = "First Metal Object 3D-Printed in Space Recovered on Earth"
description = "The first metal thingamajig ever 3D printed in space has landed on Earth, where European Space Agency scientists are now studying it."
full_description = '''Prints CharmingFeb 28, 4:03 PM EST by Noor Al-SibaiPrints Charming/Off WorldFirst Metal Object 3D-Printed in Space Recovered on EarthThe world has just gotten one step closer to space manufacturing. / Off World/ 3 D Printing/ ESA/ IssFeb 28, 4:03 PM EST by Noor Al-SibaiImage by ESA-R / Moorkens O'Reilly / FuturismThe first metal thingamajig ever 3D printed in space has landed on Earth, where European Space Agency (ESA) scientists are now studying it.In a press release, the ESA announced that the object — a round metal demonstration part, produced on the International Space Station, that features a variety of stubby cylindrical objects — is now safely in the hands of agency scientists in the Netherlands.🤘 Space metal lands on Earth 🌍The first ever metal part 3D-printed on orbit is here 🛰️🔧Made on the @Space_Station in @esa’s Metal 3D Printer - built by @AirbusSpace & installed by @Astro_Andreas during #Huginn - it has arrived at @esa’s site in the Netherlands for testing… pic.twitter.com/mXUXRQASEu— Human Spaceflight (@esaspaceflight) February 27, 2025At the ESA's European Space Research and Technology Center (ESTEC), scientists will soon conduct quality analysis experiments to see what differences show up in objects manufactured in zero-gravity environments. A second, similarly 3D-printed object will be brought back to Earth and handed over to the Technical University of Denmark.Just over a year ago, ESA astronaut Andreas Mogensen successfully installed the Airbus-built metal 3D printer in the Space Station's Columbus module — a feat unto itself, given that setting up complicated machinery like that is hard enough on Earth and all the more so without gravity.Soon after, the printer proved its prowess when it printed a curly "S" shape on a flat piece of metal, followed by two full samples including the one now in the hands of ESA scientists at ESTEC.Though this feat will inevitably help pave the way for future off-world manufacturing endeavors, this wasn't the first time an object had been 3D printed in orbit.That distinction occurred more than a decade ago, when NASA astronaut Butch Wilmore — the same one who's slated to come back down to Earth in a few weeks after being stuck on the ISS for 10 months longer than expected — installed and test-calibrated the first-ever in-orbit 3D printer.That printer could only produce plastic objects, though, which Wilmore used to craft a faceplate for its own casing.While we're still many moons away from building self-sufficient space habitats with objects created in situ, this test is a fascinating look into what humans can build for themselves in zero gravity — and a nice reminder that there are broader horizons beyond our Terran foibles.More on space manufacturing: Robot With Large Drill Headed for Surface of MoonShare This Article @media (max-width: 1024px) { #railParFuture { height: 0px !important; overflow: hidden !important; } } Read This NextRIP ISSElon Musk Just Caused a Huge Headache for the New Head of NASADigital BreakdownNews Outlets Are Falsely Reporting That a NASA Astronaut Is Still in the HospitalTeam ISSAstronauts Hold Their Own Olympics on Board Space StationMartian WaterScientists Discover Enough Mars Ice to Cover Planet in WaterNumber One FanSpace Tourists Learn Harsh Reality of Space Station Bathroom'''
