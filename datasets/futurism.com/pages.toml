["https://futurism.com/neoscope/ufc-psychedelics-brain-injuries"]
title = "UFC Investigating Whether Psychedelics Help Fighters With Traumatic Brain Injuries"
description = '''"This is a contact sport. Anyone has ever done this [when they were] younger — myself included — is dealing with brain issues. It's part of the gig."'''
full_description = '''Brain BruiseUpdated 1.14.21, 4:51 PM EST / by Dan RobitzskiUFC Investigating Whether Psychedelics Help Fighters With Traumatic Brain InjuriesThe UFC is partnering with Johns Hopkins University to explore medical psychedelics.Updated 1.14.21, 4:51 PM EST / Dan RobitzskiImage by Image via Pixabay/Victor TangermannOrganic ChemistryThe Ultimate Fighting Championship (UFC) has a bit of a problem on its hands: Letting two fighters bludgeon each other in a ring tends to lead to serious brain injuries — not unlike boxing and football.Now the UFC is partnering with Johns Hopkins University's prominent psychedelics research lab to see if mind-altering drugs might be able to help remedy fighters' brain trauma, according to ESPN. Work hasn't begun yet — the UFC and Johns Hopkins have reportedly been in touch about potential projects for the past few weeks — but those projects could help reveal new therapeutic uses for psychedelics like psilocybin or DMT.Preliminary research suggests that psilocybin might be able to help treat conditions like depression and eating disorders. News about similar research is what prompted UFC president Dana White to direct other higher-ups in the company to reach out to Hopkins in order to further explore whether psychedelics might be able to help UFC fighters who got hurt in a fight."Dana said, 'Hey, find out what this is about,'" UFC vice president of health and performance Jeff Novitzky told ESPN. "To see if it does help with some traumatic brain injury, addiction, mental health problems. We want to be on board and we want to be first."Traumatic brain injuries are unfortunately common among UFC fighters, according to ESPN, and a growing number of athletes are opening up to the public about the challenges they face and their desire to improve conditions within the sport."He's not the first and he's definitely not gonna be the last," White told ESPN, regarding one such athlete named Spencer Fisher. "This is a contact sport. Anyone has ever done this [when they were] younger — myself included — is dealing with brain issues. It's part of the gig."Of course, the simplest solution to the problem, which wouldn't involve drugs at all, would be for the participants to stop punching and kicking each other — but that seems far fetched.Share This ArticleREAD MORE: UFC looks into Johns Hopkins study on psychedelic drugs as potential therapy for fighters [ESPN]More on psychedelics: Meet the Woman Who Wants to Sell Psychedelic Drugs to ScientistsImage by Image via Pixabay/Victor TangermannRead This Next9.28.24 BreakthroughsWoman's Own Stem Cells Appear to Reverse Her Type 1 Diabetes in First-Ever Procedure9.07.24 DevelopmentsScientists Use Wild Trick to Create Transparent Mice Where You Can See Their Internal Organs, Like a Clear 90s Nintendo7.20.24 Neuroscience/Brain ScienceScientist Takes High Dose of Psilocybin, Clambers Into MRI Machine to Scan His Own Brain6.22.24 Neuroscience/Brain ScienceScientists Reverse Alzheimer's Synapse Damage in Mice4.30.24 StudiesTherapists Warn That Taking Magic Mushrooms for Treatment Can Lead to Unwanted Romantic Feelings'''
