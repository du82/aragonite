["https://futurism.com/neoscope/man-horrible-diarrhea-new-york-times"]
title = "Man Gets Such Horrible Diarrhea That It Ends Up in the New York Times"
description = "A blood pressure medication gave a 77-year-old patient such intense diarrhea he was hospitalized and ended up in the New York Times."
full_description = '''Side Effects4.15.22, 4:16 PM EDT / by Lonnie Lee HoodMan Gets Such Horrible Diarrhea That It Ends Up in the New York TimesA terrible fate!4.15.22, 4:16 PM EDT / Lonnie Lee HoodImage by Getty Images/FuturismOrganic ChemistryHere's one for the annals of horrifying medical case studies: an unfortunate 77-year-old man was hospitalized after being ill for weeks with diarrhea so severe that he shed nearly 10 pounds.It was gastrointestinal distress so severe, in fact, that it made it into the pages of the New York Times, which reported that the symptoms were ultimately found to have been caused by a blood pressure medication he was taking.The description sounds horrible. The patient was waking up at night and using the bathroom constantly, unable to rest properly and always feeling ill.In mid-2021 he rushed to the ER, according to the Grey Lady, because his gastrointestinal issues were so severe his doctor believed his kidneys surely couldn't take much more. Repeated tests and monitoring provided little long-term relief or official diagnoses, until a specialist noticed what medication the patient was taking.As noted by the NYT, the Mayo Clinic published a report 10 years ago about 22 patients who fell seriously ill after taking Olmesartan and didn't recover until they stopped taking it. After the man in the NYT report stopped taking the prescription, he was finally able to comfortably leave home and even regained some of his lost weight.The case sounds reminiscent of potential diagnoses that people who menstruate are searching for as they experience increased or worsened symptoms after getting the COVID vaccine. People have been sharing their period symptoms anecdotally online, and now at least one researcher is hoping to find a link.It's important to take outlying cases seriously. If those 22 patients hadn't helped scientists find the link with their blood pressure medication, the man in the NYT report could've ended up in critical condition or worse. If such a link should be found between the COVID vaccine and menstrual health, everyone should know.Making potential health risks and side effects public knowledge could have potentially prevented side effects in both cases.More on wild health news: Brazilian Military Faces Still Questions About Purchase of Penis ImplantsShare This ArticleImage by Getty Images/FuturismRead This Next1.02.25 DevelopmentsBabies Being Found in Dumpsters After Texas Abortion Ban12.10.24 DevelopmentsLeaked Video Shows Insurance CEO Gloating About Denying Care, Calling Critics Delusional12.09.24 UN Deploys Investigators as Mysterious "Disease X" Continues to Spread12.06.24 DevelopmentsReddit Mods Delete Doctors Slamming Insurance Industry After CEO's Murder12.04.24 Mysterious Disease Outbreak Has Already Killed Dozens'''
