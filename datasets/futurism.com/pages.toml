["https://futurism.com/neoscope/unitedhealthcare-threatens-legal-action-doctor"]
title = "UnitedHealthcare Threatens Legal Action Against Doctor Who Says They Interrupted Her in the Middle of Surgery"
description = "In the aftermath of its CEO's assassination, UnitedHealthcare is now threatening legal retaliation against those who criticize the company."
full_description = '''Gaslight AnthemFeb 8, 12:00 PM EST / by Noor Al-SibaiUnitedHealthcare Threatens Legal Action Against Doctor Who Says They Interrupted Her in the Middle of Surgery"Your claims are false. You clearly know they are false."Feb 8, 12:00 PM EST / Noor Al-SibaiImage by Elisabeth PotterDevelopmentsIn the aftermath of its CEO's stunning assassination, UnitedHealthcare is now threatening legal retaliation against those who criticize the insurance giant online.Last month, Texas plastic surgeon Elisabeth Potter posted on TikTok and Instagram that she had just been interrupted in the middle of a procedure for a breast cancer patient with a supposedly "urgent" call.On the other line was a UHC representative, who asked her if it was absolutely necessary that her patient stay overnight post-surgery — a question that appalled the doctor and most everyone who saw the video.A month after going viral, Potter made an entirely different social media post explaining that she had been contacted by UHC, accused of libel, and subjected to thinly veiled threats of legal retaliation if she didn't comply with the company's demands.In the letter, the surgeon was told that UHC had never asked her to step out of surgery and only called her because the company believed that her request for her patient's overnight stay — a claim that was eventually denied — was made in error.Furthermore, the company accused Potter of knowingly sharing "misinformation" and hosting threats against the company's executives because people made references to Luigi Mangione, the alleged assassin of UHC CEO Brian Thompson, in the comments of her videos."Your claims are false. You clearly know they are false. You falsely laid the blame for your office's error on UnitedHealthcare publicly, unleashing a firestorm of dangerous misinformation," the letter, which Potter posted in full on her Instagram, reads. "We expect you to promptly correct this publicly by removing your videos and posting a public apology."This "gaslighting and harassment," as the surgeon calls it, has only strengthened her resolve to speak out about healthcare inequities — and she's going to need it.As Bloomberg reported around the same time that Potter posted the cease and desist letter, UHC had hired preeminent defamation law firm Clare Locke — the one that got Dominion Voting Systems a nearly $800 million settlement in 2023 in its defamation case against Fox News — to handle its case against Potter.Along with taking Potter to task, Clare Locke also sicced the Securities and Exchange Commission on billionaire investor Bill Ackman after he shared the surgeon's video on his own X account."I would not be surprised," Ackman wrote in since-deleted post, "to find that the company’s profitability is massively overstated due to its denial of medically necessary procedures and patient care."More on UHC: UnitedHealth Is Asking Journalists to Remove Names and Photos of Its CEO From Published WorkShare This ArticleImage by Elisabeth PotterRead This Next2.01.25 Rx/MedicinesMother Says Her Son Died After UnitedHealth Jacked the Price of His Inhaler From $66 to $5391.28.25 DevelopmentsWhite House Caught With Pants Down As Medicaid Funding Portals Go Down1.25.25 UnitedHealthcare's New CEO Announcement Draws a Frenzy of Dark Humor1.16.25 Insurance Company Where CEO Was Assassinated Jacking Up Cost of Cancer Drugs by "Thousands of Percent," Government Finds1.09.25 DevelopmentsUnitedHealthcare Calls Doctor Mid Surgery To Ask If Her Patient’s Overnight Stay Is Necessary'''
