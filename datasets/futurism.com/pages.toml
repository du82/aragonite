["https://futurism.com/neoscope/replacement-teeth-dental-implants"]
title = 'Scientists Grow Living "Replacement Teeth" for Dental Implants'
description = 'Like something out of "Repo! The Genetic Opera," scientists have managed to grow human-like "replacement teeth" in a lab.'
full_description = '''Tooth SayerFeb 8, 6:45 AM EST / by Noor Al-SibaiScientists Grow Living "Replacement Teeth" for Dental Implants"We’re working on trying to create functional replacement teeth."Feb 8, 6:45 AM EST / Noor Al-SibaiImage by Glow Images / Getty ImagesDevelopmentsLike something out of "Repo! The Genetic Opera," scientists have managed to grow human-like teeth in a lab — and implant them inside a miniature pig's mouth, in a harbinger of weird new frontiers for dentistry.As the MIT Technology Review explains, researchers at Tufts bioengineered this fascinating monstrosity using a mix of bovine and human tooth cells that were grown inside bits of pig teeth.The idea behind this terrifying lab-made concoction, which was detailed in a December paper published in the journal Stem Cells Transitional Medicine, is to create replacement teeth for human patients.Lead investigator Pamela Yelick — who runs an eponymous tissue bioengineering lab at Tufts — and her postdoctoral fellow Weibo Zhang have for years been looking for ways to create dental implants that fit peoples' mouths perfectly."It’s very difficult to replace an implant, because first you have to rebuild all the bone that has been absorbed over time that's gone away," the bioengineering expert told Tech Review. "We’re working on trying to create functional replacement teeth."Throughout her lengthy quest to grow better chompers, Yelick has used cells from pig jaws because the farm animals grow many sets of teeth throughout their lifetimes. To this end, the scientist has long salvaged pig jaws from slaughterhouses and gotten the cells from there — making this entire project all the more gruesome, if thrifty.During a particularly sinister-sounding prior iteration of the experiment, the professor grew pig-human hybrid teeth on biodegradable scaffolds that were then implanted into the abdomens of rats because, as Tech Review notes, the rodents' jaws were too small for the array of teeth."It doesn’t bother the rats," Yelick told the magazine.While that freaky experiment clearly paved the way for this latest development, the researchers said that they didn't get to the human-like structure discovered in the latest iteration until they built scaffolds from bits of bovine teeth and implanted the semi-finished product inside the jaws of mini-pigs.After two months, the lab-grown teeth were subsequently removed — sorry to those pigs — and Yelick was impressed upon discovering that they were very "toothlike." The new structures had even begun growing hard layers of dentin and cementum, which occurs in adult human teeth.An obvious perfectionist, Yelick admitted that she and Zhang have not yet created "beautifully formed teeth yet" — but that's just spurring her to keep going.“We’re optimistic that one day we will be able to create a functional biological tooth substitute that can get into people who need tooth replacement," the scientist told Tech Review.More on teeth: Scientists About to Test Medicine to Grow New TeethShare This ArticleImage by Glow Images / Getty ImagesRead This Next2.23.25 DevicesLet’s Talk About Botched Weiner Implants9.07.24 Government Scientist Investigating Whether Aging Parts of Your Brain Can Be Replaced With Cloned Tissue5.06.24 StudiesScientists About to Test Medicine to Grow New Teeth3.30.24 DevicesScientists Test Battery Powered by the Body's Oxygen2.22.24 Woman Gets Dental Implants, Realizes They Do Something Wild in the Nightclub'''
