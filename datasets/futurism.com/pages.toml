["https://futurism.com/neoscope/trump-cancer-research"]
title = "Trump Administration Throws Cancer Research Into Turmoil"
description = "During Donald Trump's draconian first-week rollbacks, cancer research and other crucial medical projects have been paused indefinitely."
full_description = '''Death PanelsJan 28, 8:51 AM EST / by Noor Al-SibaiTrump Administration Throws Cancer Research Into Turmoil"This kind of disruption could have long ripple effects."Jan 28, 8:51 AM EST / Noor Al-SibaiImage by Chip Somodevilla via Getty / FuturismCancerThe second Trump administration's draconian rollbacks have put cancer research and other crucial government-funded medical projects on the chopping block.In one of his first post-inauguration acts, Donald Trump ordered the Department of Health and Human Services — which oversees the National Institutes of Health, the Centers for Disease Control and Prevention, and the Food and Drug Administration — to pause all its outside communications.As Mother Jones and Science magazine report, that directive has sown confusion and chaos at NIH, where funding meetings have at the same time been indefinitely suspended.The NIH, as the world's largest public funder of biomedical research, requires multiple meetings to get everything from grant proposals to funding off the ground. After Trump took office for the second time, medical researchers working with the NIH saw all their meetings abruptly canceled.Cancer researcher Chrystal Starbird of the University of North Carolina's Medical Center was preparing to sit on her first NIH grant review panel later this month when she got an email telling her, essentially, not to show up."I’ve never seen a complete pause like this as part of a transition," the researcher told Mother Jones.The Monday after that coverage broke, the acting director of the NIH told employees that ongoing clinical trials would be continuing — shortly before the White House issued an order pausing all federal grants and loans, save for those that go to Social Security and Medicare.With that one-two punch, the state of funding for any new trials — and for billions of dollars worth of other important programs, including foreign aid — remains on hold, its future uncertain.Emily Gillespie, a speech-language pathologist and professor at Emory University had just had a $2.5 million funding proposal that was getting ready to be approved when the initial order came down last week. That council meeting was also canceled, Gillespie told Mother Jones, and there's no telling when or if it will be rescheduled."It was, to put it mildly, quite a letdown," the researcher said. "It’s really frustrating because it’s very hard to plan."Ironically, this bizarre suspension of NIH research may end up putting the US behind China and other science rivals."This kind of disruption could have long ripple effects," University of Pittsburg opioid addiction researcher Jane Liebschutz told Science after the pause was first enacted. "Even short delays will put the United States behind in research."Along with harming national competitiveness, this ill-conceived suspension is, as Liebschultz said, sowing a "lot of uncertainty, fear, and panic" among the medical research world — and the longer it goes on, the more that chaos will grow.More on Trump dystopia: Trump Admin Announces Plans to Build Database of Migrant DNAShare This ArticleImage by Chip Somodevilla via Getty / FuturismRead This Next2.27.25 DevelopmentsMeasles Outbreaks Are Popping Off Across the Country2.26.25 TreatmentsNow That Trump Has Banished the Woke From Science, This Truth-Telling New Scientific Paper Reveals What COVID Vaccines Actually Do to Children2.26.25 DevelopmentsDark Mark Appears on Trump's Hand1.29.25 Trump Said We Should Kill Drug Dealers. Then He Appointed One as Health Secretary1.28.25 DevelopmentsRFK Jr.'s Cousin Says He Used to Grind Up Baby Animals in His Drug Den'''
