["https://futurism.com/neoscope/schizophrenia-avatar-therapy-trials"]
title = "New Psychiatric Technique Asks Schizophrenics to Engage in Dialogue With the Voices in Their Heads"
description = 'Researchers have come up with a new approach to treating schizophrenia: creating an "avatar" for the voices and talking to them.'
full_description = '''Voices Carry11.2.24, 12:30 PM EDT / by Noor Al-SibaiNew Psychiatric Technique Asks Schizophrenics to Engage in Dialogue With the Voices in Their Heads"My aim wasn’t to get rid of them — just to get along with them."11.2.24, 12:30 PM EDT / Noor Al-SibaiImage by Getty / FuturismMental HealthResearchers have come up with an ingenious new approach to treating psychosis: creating an "avatar" for the often upsetting voices in one's head and talking to them like they're real, living people.As The Guardian reports, there have now been multiple clinical trials displaying the power of this so-called "avatar therapy." Case in point, a new paper in the journal Nature Medicine demonstrates that giving voice and face to the dark forces inside the heads of people who suffer from auditory hallucinations can be a promising treatment strategy.Like customizing a character in a video game, people who undergo this experimental treatment create digital avatars that resemble or symbolize the voices they hear. Some people are talked down to by cruel authority figures and others are menaced by demons — and by creating an externalized avatar on a screen and having a therapist simulate the things they say, those persecuting voices can often be controlled.It's a deceptively simple scheme that has time and again borne out promising results. These digitally-assisted interventions not only help people who hear voices in their heads feel calmer and less suicidal — a common comorbidity with schizophrenia and psychosis — but in some cases even make the voices go away entirely.Initially conceptualized by the celebrated British psychiatrist Julian Leff, a specialist in schizophrenia who died in 2021, the therapy's name is apparently a bit of a misnomer."It’s called avatar therapy, and that sounds like it’s primarily about the visual representation, but not everyone has an existing image that goes with their voice," explained Neil Thomas, the director of the Voices clinic in Melbourne, Australia and lead investigator of that country's avatar therapy trial. "I think the auditory transformation is particularly powerful."That was certainly the case for Claire, one of the participants in the UK's Avatar 2 trial, who told The Guardian that before she enrolled, she'd heard voices for more than 40 years.An abused child, Claire said the first voice she heard was a man's voice who told her to jump out of the window when she was 10 years old. Decades and many suicide attempts and hospitalizations later, she began doing avatar therapy.Despite worrying the treatment could worsen her psychosis, four sessions into her allotted 12 she found that the voices were straight up gone."My aim wasn’t to get rid of them — just to get along with them," Claire told the newspaper. "I wasn’t quite sure I wanted to let go. I’d never really been on my own. As abusive as it was, it’s still a relationship."While researchers in the UK, Australia, and Denmark continue their reserach into the treatment, people in the United States seem left out in the dust. As STAT News reports, Americans seeking avatar therapy may still have to wait years to get it on this side of the pond.More on schizophrenia: Scientists Say They’ve Traced Back the Voices Heard by People With SchizophreniaShare This ArticleImage by Getty / FuturismRead This Next10.07.24 StudiesScientists Say They’ve Traced Back the Voices Heard by People With Schizophrenia12.12.23 StudiesChildhood Cat Exposure Once Again Linked to Schizophrenia11.06.23 Robotics/ProstheticsScientists Say This Weird Robot Can Make You Hear Voices That Don’t Exist12.21.22 Mental HealthMan Says His Online Therapist Told Him to Simply Stop Being Gay5.02.22 Mental HealthCan Cats Infect You With a Psychosis-Inducing Brain Parasite? The Answer Is Complicated'''
