["https://futurism.com/microsoft-ceo-hesitation-ai-expensive-data-centers"]
title = "Microsoft Backing Out of Expensive New Data Centers After Its CEO Expressed Doubt About AI Value"
description = "After its CEO expressed hesitancy about AI's real-world value, Microsoft is backing out of the construction of new data centers."
full_description = '''Center Cannot HoldFeb 24, 1:47 PM EST by Victor TangermannCenter Cannot Hold/Artificial IntelligenceMicrosoft Backing Out of Expensive New Data Centers After Its CEO Expressed Doubt About AI Value"The canary just died."/ Artificial Intelligence/ Artificial Intelligence/ Generative Ai/ MicrosoftFeb 24, 1:47 PM EST by Victor TangermannImage by Getty / FuturismLast week, Microsoft CEO Satya Nadella made an eyebrow-raising appearance on a podcast dismissing the hype around claims of having achieved "some [artificial general intelligence] milestone" as "nonsensical benchmark hacking."Most strikingly, Nadella admitted that AI simply hasn't generated much value so far, arguing that economic growth due to the tech would be a much more compelling demonstration of AI's actual accomplishments.It was an unusually muted response given the tens of billions of dollars the tech giant has poured, and is planning to pour, into the development of AI and the infrastructure to support it — despite real-world applications for the tech remaining few and far between.Is Nadella worried about a looming dot-com-like bubble that's set to burst? Was the emergence of Chinese AI startup DeepSeek's hyper-efficient reasoning AI model, which shook up the entire industry last month, an early warning shot?Now, investment banking company TD Cowen has informed Bloomberg that Microsoft has canceled some leases for the buildout of its US data center capacity, further bolstering the possibility that the company is realizing it was overzealous in its plans to invest in the tech.While it's too early to draw any definitive lines between Nadella's comments last week and the latest developments, it's certainly looking like some of the major players in the AI space are increasingly worried about overleveraging themselves."The canary just died," one Bluesky user wrote in response to the news."While we have yet to get the level of color via our channel checks that we would like into why this is occurring, our initial reaction is that this is tied to Microsoft potentially being in an oversupply position," TD Cowen analysts wrote in a note, as quoted by Bloomberg.Microsoft subsequently confirmed to Bloomberg that it was still committed to spending some $80 billion on AI infrastructure worldwide, but declined to comment on the news that it was canceling leases."While we may strategically pace or adjust our infrastructure in some areas, we will continue to grow strongly in all regions," a spokesperson told the publication.It's also entirely possible that there could be a more mundane, business-based explanation. In a separate report, TD Cowen suggested that Microsoft was canceling the leases as OpenAI is significantly shifting its spending from Microsoft to SoftBank as part of president Donald Trump's massive, $500 billion Stargate AI infrastructure project."To me this all looks and sounds like business as usual," Mizuho Securities analyst Jordan Klein wrote in a note, as quoted by Bloomberg. "A company this large and with $80 billion of annual spend has the right to move in and out of data center leases, many of which were never officially signed."Other companies, like Google owner Alphabet, Amazon, and Meta have pledged to spend their own fortunes building AI infrastructure. Alphabet boosted its AI investments to a whopping $75 billion over the weekend, showing there's still plenty of hype out there.Even if Microsoft's latest actions were a sign of "business as usual," the optics alone aren't great.Any news that would undermine those sky-high ambitions or signal that the tech may never turn a profit could play into fears of a bubble. And considering the chaos DeepSeek caused, investors are already jittery.Given AI's very real struggles to make money, it's hard not to read into the drama. During his podcast appearance last week, Nadella told Patel that "at some point, the supply and demand have to map.""You can go off the rails completely when you are hyping yourself with the supply-side, versus really understanding how to translate that into real value to customers," he added.More on Microsoft: Microsoft CEO Admits That AI Is Generating Basically No ValueShare This Article @media (max-width: 1024px) { #railParFuture { height: 0px !important; overflow: hidden !important; } } Read This NextArms RaceMicrosoft Shows Off AI That Can Control an Entire RobotPopping BalloonsMicrosoft CEO Admits That AI Is Generating Basically No ValueConsent No MoreFury Erupts After Netflix Used AI to Clone the Voice of a Murdered Influencer for a True Crime Doc About Her DeathCome OnAmazon's Prime Video Appears to Have Left AI Slop in the Public Description of an Oscar-Winning Al Pacino FilmFor AIs OnlyStartup Adds Job Listing Specifically for AI Agents, With Horrible Salary'''
