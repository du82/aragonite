["https://futurism.com/neoscope/brain-rot-poisoning-minds"]
title = '"Brain Rot" Is Poisoning Our Minds'
description = "The latest research suggests that addictively consuming mind-numbing digital content may almost literally be rotting our brains."
full_description = '''Brain Pain12.28.24, 1:00 PM EST / by Frank Landymore"Brain Rot" Is Poisoning Our MindsIt's "altering the way we perceive and respond to the world."12.28.24, 1:00 PM EST / Frank LandymoreImage by Getty/FuturismNeuroscience/Brain ScienceIt turns out that the slang "brain rot" may not be an inaccurate description of what's actually going on in our domes while we endlessly scroll TikTok.As Spanish newspaper El País reports, a growing body of scientific evidence over the past decade suggests that consuming mind-numbing content, from sources ranging from algorithmically driven social media junk to sensationalist news, can literally reduce the physical gray matter in our brains. That's along with wreaking other pernicious effects like shortened attention spans and weakened memory.The nefarious thing? These symptoms are often by design. The most infamous example is the implementation of infinite scrolling in apps, which is intended to feed our compulsive desire to endlessly consume content, or "doomscroll.""This can significantly impair attention and executive functions by overwhelming our focus and altering the way we perceive and respond to the world," Michoel Moshel, lead author of a 2023 meta-analysis documenting the neuropsychological impacts of disordered screen use, told El País.According to Moshel, who is a researcher at Macquarie University, doomscrolling is a consequence "of our brain's natural tendency to seek out new things, especially when it comes to potentially harmful or alarming information, a trait that once helped us survive."Some research has suggested that this mindless digital consumption induces a dissociative state, which explains why we often lose track of time while glued to our phones. One 2023 study which surveyed around 1,100 people found that compulsive digital content consumption could lead to poor physical and mental health outcomes, especially high levels of stress. The US Surgeon General has even warned against letting anyone younger than 13-year-old use social media sites.These sites and apps constantly bombard us with rapidly changing and variable stimuli, explained Eduaordo Fernández Jiménez, a clinical psychologist at Hospital La Paz Madrid, forcing us to constantly change our focus, too.In the long run, this degrades our ability to concentrate on one task for long periods of time, he told El País. "It is the one that is linked to academic learning processes."The physical effects on the brain are perhaps the most alarming. In brain regions involved with decision-making, reward processing, and impulse control, Moshel's meta-analysis indicated that excessive internet use was linked with decreased gray matter volume."These changes reflect patterns observed in substance addictions," Moshel told El País, likening them to the toll of methamphetamines or alcohol.So it may be time to put the phone down. If the rot hasn't fully taken hold yet, that is.More on neuroscience: You'll Laugh When You Hear How Many Bits Per Second the Human Brain Processes... Once Your Sluggish Human Brain Finally Comprehends It, That IsShare This ArticleImage by Getty/FuturismRead This Next11.23.24 Mental HealthScientists Find That Yelling at AI Chatbots Can Make You Feel Better9.21.24 Rx/MedicinesNovo Nordisk's New Weight Loss Drug Shows Ominous Psychiatric Side Effects8.21.24 Mental HealthEminem Slaps Affiliate Link for Much-Criticized Teletherapy Startup on End of New Video8.16.24 Mental HealthDoctors Suggest 'Raw-Dogging' Your Flight Is Bad For Your Health7.20.24 StudiesIf Your Family Moved a Lot as a Kid, We Have Bad News About Your Mental Health'''
