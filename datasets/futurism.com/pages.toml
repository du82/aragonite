["https://futurism.com/neoscope/borderline-personality-disorder-music"]
title = "People With Borderline Personality Disorder Prefer These Head-Scratching Types of Music"
description = "People with borderline personality disorder prefer music that's reflective and complex versus loud, raucous music."
full_description = '''Brain Waves3.23.24, 8:00 AM EDT / by Sharon AdarloPeople With Borderline Personality Disorder Prefer These Head-Scratching Types of MusicTake a wild guess!3.23.24, 8:00 AM EDT / Sharon AdarloImage by Matt Henry GuntherMental HealthPatients are diagnosed with borderline personality disorder (BPD) to describe moods that swing from one extreme to another, and often have trouble maintaining stable relationships with other people. Basically, they can't keep a lid on their roiling emotions and are prone to impulsive actions — a challenging condition both for people suffering from it and for their loved ones.You'd think they'd prefer listening to music that reflects their troubled inner life, but that's not the case, according to a team of Polish researchers, who uncovered the surprising musical preference of people with BPD.In a new paper published in the journal Psychology of Music and spotted by PsyPost, the researchers discovered that people who tended to have severe BPD symptoms were more likely to prefer listening to jazz or classical music — genres that are often calming, elegantly composed, and complex.And they typically turned their noses at loud, intense music like punk and heavy metal. Counterintuitive? Maybe, but maybe not. Instead of gravitating toward angry music, maybe people with BPD are selecting soundtracks that soothe them intentionally.The researchers uncovered this surprising musical preference by looking at 549 people, of whom 274 had signs of BPD. Each study participant underwent a screening test that quantified any BPD symptoms, as well as a quiz about their musical preferences.Most of the study participants were female at 75.6 percent — which tracks with research that females predominantly have BPD.Obviously, the study has limitations. The researchers said the research was conducted during the COVID-19 pandemic lockdowns and thus were self-reported.Followup research that dives into how different musical genres effect the emotions of people with BPD could further explore the relationship — as well as the implications for music therapy for people who suffer from it.More on psychology: Scientists Are Studying the Psychology of "A**holes"Share This ArticleImage by Matt Henry GuntherRead This Next1.11.25 Humans Can Access Something Akin to "Bullet Time," Scientist Says7.31.24 StudiesYour Facial Features Gradually Change to Go With Your Name, Researchers Find7.21.24 Neuroscience/Brain ScienceDevious Scientists Scan People's Brains While They Watch Video of Themselves Singing Karaoke7.20.24 StudiesIf Your Family Moved a Lot as a Kid, We Have Bad News About Your Mental Health7.13.24 StudiesiPad Use by Kids Linked to Long Term Emotional Problems'''
