["https://futurism.com/neoscope/man-exoskeleton-ping-pong-vs-king-spain"]
title = "Man Who Can Only Walk With Exoskeleton Plays Ping Pong Against King of Spain"
description = "Richard Hernandez rarely gets the opportunity to use his body while upright, but taking advantage of a new exoskeleton, he's also taking on royalty."
full_description = '''Royal Romp3.5.23, 10:10 AM EST / by Frank LandymoreMan Who Can Only Walk With Exoskeleton Plays Ping Pong Against King of SpainThat's a serious flex.3.5.23, 10:10 AM EST / Frank LandymoreImage by Getty / FuturismRobotics/ProstheticsWhile robotic exoskeletons have a long way to go before they're affordable and available to the average consumer, they're still helping patients make monumental strides.Take Richard Hernandez, who became bound to a wheelchair after a spinal cord injury over twenty years ago. Now, using an exoskeleton developed by the Barcelona-based medical startup ABLE Human Motion, Hernandez can walk around on his own, largely unimpeded."It would change my life completely [to have the exoskeleton full time]," he told EuroNews at the Mobile World Congress 2023 in Barcelona.Hernandez has been testing ABLE's exoskeletons for several years now as a "pilot." Although "rudimentary" in its initial stages, he says, the latest version is an "immense" upgrade."With my relatively low injury and my fairly good balance, I can use it as you saw a moment ago, completely autonomously, simply with a remote control that I carry on a crutch or walker, which I use to control all the functions with two buttons," Hernandez said.In fact, Hernandez got to put his newfound mobility to the test in a game of ping pong versus literal royalty: Felipe VI, the King of Spain.It's unclear, however, who won the match.Here's @AbleHumanMotion's lightweight exoskeleton in motion at #MWC23!The Barcelona-based start-up are on a mission to provide easy-to-use and affordable technology that empowers people with disabilities.🦽 pic.twitter.com/u8z8GFDsf1— Euronews Next (@euronewsnext) February 27, 2023The exoskeleton is a surprisingly simple device: it straps around a user's legs, with a set of motors at the knees and hips "that drives the motion of walking for you to be able to walk again, for somebody who doesn't have sensation or movement in their legs from a spinal cord injury," Katlin Kreamer, product manager at ABLE Human Motion told EuroNews.According to a video, the device can also be programmed through a smartphone that can cycle through different modes, such as "Walking."ABLE hopes to start selling the exoskeleton starting this spring. At this stage, though, it's not being sold to private users, but instead is intended for clinics and hospitals, where doctors can safely use it for rehabilitating patients in a safe environment.And the costly projected price would reflect that, ranging between $40,000 to $60,000.In other words, the exoskeleton is more like training wheels than a bipedal equivalent of a wheelchair — but don't let that undermine its impressive ability to help a person walk."The first step is to offer it in a clinical setting like a hospital," Kreamer said. "And then the next step in our roadmap would be to make a personal use device for someone to be able to take home and use in their daily life."More on exoskeletons: FDA Gives Go-Ahead for Robotic Exoskeleton For Stroke SurvivorsShare This ArticleImage by Getty / FuturismRead This Next9.27.24 Robotics/ProstheticsParalyzed Man Unable to Walk After Maker of His Powered Exoskeleton Tells Him It's Now Obsolete1.26.23 Robotics/ProstheticsFDA Gives Go-Ahead for Robotic Exoskeleton For Stroke Survivors9.24.21 Robotics/ProstheticsMIT Establishes New Initiative to Meld Humans and Machines7.27.21 Robotics/ProstheticsEngineer Builds Voice-Controlled Exoskeleton So His Son Could Walk7.23.21 DevicesExoskeletons Are Causing Problems With Wearers' Brains, Scientists Say'''
