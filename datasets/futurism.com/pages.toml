title = "Game Over, Astrologists: Zodiac Signs Have Zero Bearing on Our State of Mind, Researchers Find"
description = "A psychologist published a study that found no correlation between subjective well-being and Western astrological signs"
full_description = '''Flim Flam6.2.24, 6:30 AM EDT / by Sharon AdarloGame Over, Astrologists: Zodiac Signs Have Zero Bearing on Our State of Mind, Researchers FindIt's simply not written in the stars.6.2.24, 6:30 AM EDT / Sharon AdarloImage by Getty / FuturismMental HealthIf you have been going around blaming your bad attitude on your astrological birth chart, we have some bad news for you.Mohsen Joshanloo, an associate professor of psychology at South Korea's Keimyung University, set out to see if there was any correlation between "subjective well-being" and the supposed influence of Western astrological signs. As detailed in a study published in the journal Kyklos, which was first picked up in PsyPost, he found no significant correlation between the two, dealing a blow to astrological girlies all over the world.In other words, people have yet to find a real excuse for their terrible state of mind and not because they are a persnickety Virgo.Joshanloo took more than 12,000 participants from the long running General Social Survey, an American-based survey, and analyzed how they gauged their well-being and saw if there was any correlation between it and their self-reported zodiac birth sign."Well-being was measured across eight components: general unhappiness, depressive symptoms, psychological distress, work dissatisfaction, financial dissatisfaction, perceived dullness of one's life, self-rated health, and unhappiness with marriage," wrote Joshanloo.Joshanloo also performed analysis on whether the zodiac signs had a predictive impact on future well-being — and surprise, surprise, found none."An additional analysis revealed that astrological signs were no more predictive of than random numbers," Joshanloo noted in his paper.It's a convincing, albeit unsurprising finding, especially given the large sample size involved, but knowing humanity, many of us will persist in believing that our fate is already written in the stars — as much as 30 percent of Americans do in fact.More on astrology: Investment App Recommends Stocks Based on Your HoroscopeShare This ArticleImage by Getty / FuturismRead This Next2.27.25 DevelopmentsCops Investigating Bizarre Circumstances of Gene Hackman's Death2.27.25 DevelopmentsMeasles Outbreaks Are Popping Off Across the Country2.26.25 TreatmentsNow That Trump Has Banished the Woke From Science, This Truth-Telling New Scientific Paper Reveals What COVID Vaccines Actually Do to Children2.26.25 DevelopmentsDark Mark Appears on Trump's Hand2.25.25 DevelopmentsNew Disease Spreading Rapidly, Killing Dozens, After Children Ate a Bat'''
