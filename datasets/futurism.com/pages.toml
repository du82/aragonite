["https://futurism.com/neoscope/robot-first-fully-autonomous-dental-surgery"]
title = "Robot Performs First Ever Fully Autonomous Dental Surgery on Live Patient"
description = "A dental robotics company claims to have used an AI-controlled robot to perform the first fully autonomous dental procedure on a human."
full_description = '''Open Wide8.3.24, 1:00 AM EDT / by Victor TangermannRobot Performs First Ever Fully Autonomous Dental Surgery on Live PatientThe company claims it's eight times faster than a human dentist.8.3.24, 1:00 AM EDT / Victor TangermannImage by PerceptiveDevicesA dental robotics company claims to have used an AI-controlled robot to perform a fully autonomous dental procedure on a human patient — for the first time, heralding a possible new era for dental treatment.Perceptive, the company behind the robot, claims its system can shave off a considerable amount of time for routine procedures. The bot can replace crowns in just 15 minutes, it says, which takes a human dentist two hours across two office visits to complete.The company says it's tested the device on a patient in Colombia, but has yet to release any peer-reviewed clinical data. As Stat points out, the company will need this data to apply for Food and Drug Administration approval, something that's still around five years away, according to Perceptive CEO Chris Ciriello.Nonetheless, the company is celebrating the test as a big win."We’re excited to successfully complete the world's first fully automated robotic dental procedure," said Ciriello in a press release. "This medical breakthrough enhances precision and efficiency of dental procedures, and democratizes access to better dental care, for improved patient experience and clinical outcomes."The robotic system uses a handheld 3D scanner that captures highly detailed 3D images of beneath the gum line, allowing patients to "clearly visualize their dental conditions."The AI then comes up with an efficient and precise procedure."The robotics system has been designed and rigorously tested to ensure that dentists can perform treatments safely, even in conditions where patient movement is prevalent," said dentist and Perceptive investor Edward Zuckerberg in the press release.Perceptive has raised a considerable $30 million in funding, including from Zuckerberg — who also happens to be the father of Meta CEO Mark Zuckerberg. It's unclear whether the younger Zuckerberg is involved in the financing of the venture.Robotic surgery has made big strides over the years, and companies are hoping to leverage AI technologies to bring the tech to the masses. But when that will happen remains an open question, as they still have plenty of regulatory hurdles to overcome.More on dentistry: Dentists Horrified by People Carving Off Tooth Enamel at HomeShare This ArticleImage by PerceptiveRead This Next1.09.25 DevelopmentsUnitedHealthcare Calls Doctor Mid Surgery To Ask If Her Patient’s Overnight Stay Is Necessary6.26.24 StudiesMan Sneezes So Hard That His Intestines Burst Through Surgical Wound4.30.24 DevelopmentsDentists Horrified by People Carving Off Tooth Enamel at Home4.27.24 StudiesOrgan Transplants Can Change Personality and Even Sexual Orientation, Scientists Find3.12.24 DevicesSurgeons Use Apple VR Headset During Spinal Operation'''
