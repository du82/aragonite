["https://futurism.com/neoscope/activists-hand-free-weed-dc-vaccination-sites"]
title = "Activists Plan to Hand Out Free Weed at DC Vaccination Sites"
description = "The activist group DC Marijuana Justice plans to hands out free bags of weed to people who get the coronavirus vaccine in Washington D.C."
full_description = '''Goody Bags1.12.21, 4:50 PM EST / by Dan RobitzskiActivists Plan to Hand Out Free Weed at DC Vaccination Sites"I want people to get the shots and to know they are appreciated for doing so."1.12.21, 4:50 PM EST / Dan RobitzskiImage by NIAID via Flickr/FuturismOrganic ChemistryThe cannabis activist group DC Marijuana Justice (DCMJ) says it's going to hand out free bags of weed to people who get their coronavirus vaccine at some locations in Washington, D.C.Both the medical and recreational use of marijuana is perfectly legal in D.C., so DCMJ doesn't expect any legal trouble while it gives out its post-vaccine goody bags, Motherboard reports. The ultimate goal is two-fold: further incentivizing people to protect themselves against COVID-19 and, hopefully, recruiting their grateful recipients into the fight for federal marijuana legalization."I want people to get the shots and to know they are appreciated for doing so," DCMJ co-founder Adam Eidinger told Motherboard. "We also see the vaccination center as a place for education and outreach as well as to mobilize people to let lawmakers know they want to protect and even expand home grow rights in the District and to allow adults to buy and sell cannabis.""We want to end the intense policing of Black communities too as it's completely connected to marijuana enforcement to this day," Eidinger added.The "Joints for Jabs" campaign will begin as soon as vaccines are available to the general public, according to a DCMJ press release. Along with the free bag, DCMJ will distribute cards with information on how people can call their representatives to fight for legal cannabis.But the call to arms shouldn't get in the way of a good time, DCMJ's other co-founder, Nikolas Schiller, said in the press release."We are looking for ways to safely celebrate the end of the pandemic," Schiller said, "and we know nothing brings people together like cannabis."Share This ArticleREAD MORE: 'Joints For Jabs:' This Group Wants to Give You Weed With Your Covid Vaccine [Motherboard]More on drugs: Meet the Woman Who Wants to Sell Psychedelic Drugs to ScientistsImage by NIAID via Flickr/FuturismRead This Next2.26.25 TreatmentsNow That Trump Has Banished the Woke From Science, This Truth-Telling New Scientific Paper Reveals What COVID Vaccines Actually Do to Children2.10.25 TreatmentsOne of Elon Musk’s DOGE Staffers Used to Sell Ketamine Professionally1.29.25 Trump Said We Should Kill Drug Dealers. Then He Appointed One as Health Secretary1.25.25 Rx/MedicinesNew Law Would Allow AI to Replace Your Doctor, Prescribe Drugs1.06.25 DevelopmentsKids Are Huffing Galaxy Gas Until They Get Tremors, Limps and Lose Bowel Control'''
