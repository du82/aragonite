title = "Scientists Build Tiny Robots That Can Inspect, Manipulate Your Cells"
description = "A team of researchers at Tel Aviv University in Israel has come up with tiny micro-robots that can distinguish between healthy and dying cells."
full_description = '''Cell Inspector4.1.23, 10:16 AM EDT / by Victor TangermannScientists Build Tiny Robots That Can Inspect, Manipulate Your CellsThey could even be used to deliver drugs or remove cancer cells.4.1.23, 10:16 AM EDT / Victor TangermannImage by Getty ImagesRobotics/ProstheticsA team of researchers at Tel Aviv University in Israel has come up with tiny micro-robots that can scan individual cells to tell whether they're healthy or in trouble.These tiny cell inspectors, a mere ten microns across each, are even capable of transporting desired cells to a different location with the use of electricity or a magnet for later genetic analysis, making them a potentially groundbreaking new tool for diagnosing diseases or delivering drugs to a chosen location.As detailed in a study published in the journal Advanced Science, the researchers borrowed from the natural functions of other organisms found in our bodies to develop the micro-robots."Developing the micro-robot’s ability to move autonomously was inspired by biological micro-swimmers like bacteria and sperm cells," said Gilad Yossifon, biomedical engineering professor at Tel Aviv University and lead author of the paper, in a statement. "This is an innovative area of research that is developing rapidly, with a wide variety of uses in fields such as medicine and the environment and as a research tool."The tiny robots could, for instance, be used to single out cancer cells and transport them for taking biological samples and later medical diagnosis.In tests, the researchers were able to use the robots to distinguish between healthy or dying cells and capture individual blood and cancer cells within a single bacterium."Our new development significantly advances the technology in two main aspects — hybrid propulsion and navigation by electric and magnetic mechanisms that are very different," Yossifon said in the statement. "In addition, the micro-robot has an improved ability to identify and capture a single cell — without the need for tagging — for local testing or retrieval and transport to an external instrument."The researcher and his team are now looking to develop micro-robots that are capable of working inside the body that could, for instance, be used as "effective drug carriers that can be precisely guided to the target," according to Yossifon.More on bio robots: Scientists Build Gruesome Robots That Move With Mouse MusclesShare This ArticleImage by Getty ImagesRead This Next7.31.23 CancerScientists Intrigued by Clever Trick That Makes Cancer Cells Self-Destruct3.01.25 A Cancer Scientist Got Fired and Replaced Their Research Data With Wildest Thing You Can Imagine2.27.25 DevelopmentsCops Investigating Bizarre Circumstances of Gene Hackman's Death2.27.25 DevelopmentsMeasles Outbreaks Are Popping Off Across the Country2.26.25 TreatmentsNow That Trump Has Banished the Woke From Science, This Truth-Telling New Scientific Paper Reveals What COVID Vaccines Actually Do to Children'''
