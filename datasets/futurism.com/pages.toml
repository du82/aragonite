["https://futurism.com/panels-flying-off-cybertrucks"]
title = "Body Panels Flying Off Cybertrucks on Highway, Drivers Report"
description = "Tesla's Cybertruck faces safety concerns as metal body panels detach at high speeds due to a unique manufacturing method."
full_description = '''Panel PoppingFeb 22, 6:45 AM EST by Joe WilkinsPanel Popping/Advanced TransportBody Panels Flying Off Cybertrucks on Highway, Drivers ReportIt's giving new meaning to the term "trim down."/ Advanced Transport/ Cars/ Cybertruck/ TeslaFeb 22, 6:45 AM EST by Joe WilkinsImage by Getty / FuturismTesla's Cybertruck has quickly become an extremely politically charged target of anti-Elon Musk sentiment. The bulky steel tanks seem to court vandals and loathing almost everywhere they go.But when spray paint is the worst a Cybertruck driver has to worry about, they’ve gotten off easy — there are now several reports of the 6,600-pound EVs shedding metal body panels at dangerously high speeds.The Cybertruck is designed with a nine-foot piece of boomerang-shaped window trim on each side. In a typical car, similar bits of body panels are held in place by bolts or else welded to the frame. But the Cybertruck is not a typical car, as one Michigan driver found out the hard way.While driving at highway speeds, the glue holding that piece of frame failed, causing it to rip off."I ran a quick errand tonight," the driver complained in a post on the Cybertruck Owners Club forum, "and while merging and accelerating on the interstate in normal traffic, at about 70 mph, I heard a loud ripping sound and the metal panel liberates and flew into traffic behind me.""I was not able to stop as I was in the middle of a highway split," he continued. "I rolled the window down and felt for it, and yes, the trim was gone."The Michigan driver is far from the only one. Car enthusiast publication Road & Track found multiple cases where that exact panel has peeled off its adhesive, on top of other body panels and the tailgate.Since the Cybertruck launched in November 2023, at least two other boomerang-panel complaints have been filed with the National Highway Traffic Safety Administration. When one Illinois driver's piece flew off, he asked a Tesla representative to also replace the other side, only to be told they "will not do it unless [the panel] falls of," per Road & Track.Heavy steel panels aren't the only thing flying off Elon Musk's EVs. A four-year investigation by the NHTSA found that almost 75,000 Teslas were equipped with shoddy front suspension, causing the tires to fly off at speed. Nicknamed "whompy wheels," the issue haunts Teslas of all makes and models around the world, including the brand new Cybertruck.Though the EV company issued seven Cybertruck recalls in a little over a year, it has seemingly yet to address whompy wheels or the boomerang trim.Until it does, drivers might want to give these rolling doorstops a wide birth, unless they want a piece of the "toughest and most badass truck ever made" flying through their windshield.More on Cybertrucks: Cybertruck Owners Actually Love the Fact That Their Car Could Fly Apart at Any MomentShare This Article @media (max-width: 1024px) { #railParFuture { height: 0px !important; overflow: hidden !important; } } Read This NextBrand DamageTesla Drivers Overcome With Shame by ProtestersLove LostTesla Owners Now Disgusted By Elon MuskVolkswagenAds for Elon Musk’s "Swasticar" Go Viral as Tesla CrumblesWhich Is It?There's Something Very Sketchy Going on With the Government Trying to Buy $400 Million in Armored TeslasTesla RecoilTesla Just Got Some Extremely Bad News'''
