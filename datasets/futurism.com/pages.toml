full_description = '''Monarch Cancer2.5.24, 1:47 PM EST / by Victor TangermannKing Charles Has CancerHe wants to "assist public understanding for all those around the world who are affected by cancer."2.5.24, 1:47 PM EST / Victor TangermannImage by Dan Kitwood/Getty ImagesCancerKing Charles III has been diagnosed with cancer, Buckingham Palace officials confirmed today."During The King’s recent hospital procedure for benign prostate enlargement, a separate issue of concern was noted," a statement reads. "Subsequent diagnostic tests have identified a form of cancer."We still don't know how serious the situation is, as tightlipped officials didn't disclose what stage or what form of cancer it is.Late last month, King Charles was admitted to a hospital for a "corrective procedure" for an enlarged prostate. During the course of treating that issue, according to the statement, doctors found a different issue that led to the cancer diagnosis.In spite of the slim details, Buckingham Palace said the king was publicizing his diagnosis "in the hope it may assist public understanding for all those around the world who are affected by cancer."More on cancer: Doctors Alarmed by Young People Getting Cancer at Unprecedented RatesShare This ArticleImage by Dan Kitwood/Getty ImagesRead This Next1.23.25 DevelopmentsPatients Are Dying After a Strange Cancer Treatment on a Remote Island12.20.24 CancerElon Musk Bullies Congress Into Cutting Funding for Child Cancer Research11.17.24 CancerScientist Injects Her Own Cancerous Tumor With Viruses She Grew in Lab10.08.24 TreatmentsGroundbreaking Ovarian Cancer Vaccine at an "Exciting" Moment, Lead Scientist Says9.21.24 CancerExperts Warn of Link Between Drinking Alcohol and Getting Cancer'''
