["https://futurism.com/trump-musk-ignore-order"]
title = "Trump Just Told Elon He's Stepped Over the Line"
description = "It took just over a month after his second inauguration, but it appears that Donald Trump may finally have put Elon Musk in his place."
full_description = '''Bad BloodFeb 25, 10:40 AM EST by Noor Al-SibaiBad Blood/Future SocietyTrump White House Tells Elon He's Stepped Over the LineMusk isn't taking it well./ Future Society/ Donald Trump/ Elon Musk/ PoliticsFeb 25, 10:40 AM EST by Noor Al-SibaiImage by Alex Wong and Andrew Harnik via Getty / FuturismIt took just over a month after his second inauguration, but it appears that Donald Trump may finally have put Elon Musk in his place.After Musk's team at DOGE emailed virtually all federal workers over the weekend demanding that they summarize their activities over the past week in bullet points or risk termination, there was a near-universal outcry at the sense of overreach — especially when it emerged that Musk's plan was to feed the answers into an AI chatbot to decide which jobs were "necessary."The chaos was so immense, in fact, that Trump's administration ended up telling agency heads, per sources that spoke to the Washington Post, that they could simply "ignore the public decree from Elon Musk to effectively fire employees who do not send in bullet-point summaries of their work last week."It's a striking rebuke after Musk had been given seemingly unlimited rein over the federal government for weeks, and likely an inflection point in what's been an extremely cozy relationship between the billionaire Tesla owner and president Trump. But it shows that even the pair's chummy bond has limits.Though his own administration slapped the email's power down, Trump himself contradicted that guidance by praising it yesterday."I thought [the email] was great," Trump told reporters during a Monday evening press conference, "because we have people that don’t show up to work and nobody even knows if they work for the government."Musk — not a man given to submission to authority — seemed to publicly struggle to articulate why Trump had undermined his latest salvo against federal workers."The email request was utterly trivial, as the standard for passing the test was to type some words and press send!" he seethed online. "Yet so many failed even that inane test, urged on in some cases by their managers."Minutes later, he seemed to get ahold of himself, issuing a Dwight Schrute-esque warning: even though his threat turned out to be totally empty before, next time it'll totally be real."Subject to the discretion of the President, they will be given another chance," he posted. "Failure to respond a second time will result in termination."In an interview with Politico, an external Trump advisor who was granted anonymity to discuss the situation with candor said that although it's "too early" for White House staffers to be complaining openly about Musk, they are "hearing a lot of groans and seeing a lot of eye rolls."It's unclear exactly how much drama is occurring behind the scenes between the elected and unelected billionaire pair as they struggle for control of the US government — but one thing's for sure: with Musk's public approval tanking, Trump knows their fates are tied together, and that means Musk's carte-blanche to remake the federal government is now on thin ice.More on Trump and Musk: Wait, Was Elon's Son Just Caught on Camera Telling Trump What Musk Really Thinks of Him?Share This Article @media (max-width: 1024px) { #railParFuture { height: 0px !important; overflow: hidden !important; } } Read This NextBase DesiresAntarctic Research Stations in ChaosSelf-EnrichmentIt Looks an Awful Lot Like Elon Musk Is Awarding a Huge Government Contract to HimselfLet Them FightSounds Like Elon Musk Is About to Get Eviscerated by Jon StewartPain and No GainElon Musk's Guiding Principle Seems to Be Trying to Inflict as Much Cruelty as PossibleAll for Me and None for AllElon Musk Has Sucked Up $38 Billion in Aid From the Federal Government, and Now He's Slashing That Help for Others'''
