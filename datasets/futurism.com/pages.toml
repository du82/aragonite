full_description = "We’re Futurism, a Recurrent Ventures media company, based out of New York City. Futurism was started off a Knight Foundation grant in 2017 — it’s grown from an infographic on a subreddit into a trusted news source read by millions all over the world every month. Since then, our mission: To provide readers a window into the news and stories of tomorrow, today.LEADERSHIPWe’re a small, award-winning independent team of reporters and writers, who pride ourselves on a commitment to accuracy and ethics in journalism, and publish our news and features entirely free of editorial interference from our parent company.Content Director Foster KamerEDITORIALExecutive Editor Jon ChristianSenior Editor Victor TangermannStaff Writers Noor Al-Sibai, Maggie HarrisonContributors Frank Landymore, Sharon AdarloCREATIVEDirector of Design Tag Hartman-SimkinsAUDIENCE DEVELOPMENTSenior Audience Development Director Paul SarconiPUBLISHINGGeneral Manager Adam MorathPublisher Emeritus James DelFounder Alex KlokusMISSIONWe cover the market-moving and world-shaking technological and scientific developments changing the world. This isn’t a site to read about personal or “retail” technologies. On Futurism, you’ll find news about the titans of industry changing the world (and possibly, the worlds beyond ours), as well as the developments of the emergent innovations that will affect every single one of our lives — if they don’t already.The vast majority of what you’ll see on the site is news-oriented; we also publish features, interviews, and the occasional opinion piece. We strive to provide readers not just with news, but the smart sensibility and gimlet-eyed perspective they won’t find anywhere else. We’re supported by advertising revenue, and the occasional bit of commerce revenue (earned through commissions on posts supplied by a non-news editorial team).Futurism’s website is currently divided into three sections:The Latest, which you can find via our homepage. These are our