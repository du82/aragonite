["https://futurism.com/neoscope/paralyzed-fly-drone-brain-implant"]
title = "Paralyzed Man Can Now Fly Drone Using Brain Implant"
description = "A groundbreaking brain implant has allowed a paralyzed man to control a virtual drone and fly it through an obstacle course."
full_description = '''Flying HighJan 26, 11:15 AM EST / by Frank LandymoreParalyzed Man Can Now Fly Drone Using Brain ImplantSimply by using his thoughts.Jan 26, 11:15 AM EST / Frank LandymoreImage by Willsey et alNeuroscience/Brain ScienceA groundbreaking brain implant has allowed a paralyzed man to control a virtual drone and fly it through an obstacle course.The feat, as detailed in a study published in the journal Nature Medicine, was achieved by mapping virtual inputs to signals sent by a region of the brain that controls the fingers, the left precentral gyrus, which is where the brain computer interface (BCI) was implanted.All the paralyzed patient had to do to exert control is simply think about moving the digits of his hand — bringing a whole new meaning, we must report, to the expression of "not lifting a finger.""This is a greater degree of functionality than anything previously based on finger movements," said study lead author Matthew Willsey, an assistant professor of neurosurgery and biomedical engineering at the University of Michigan, in a statement about the work. Key to the BCI's success, the researchers argue, was the fact that it was a brain implant, and not a noninvasive alternative like a brain cap. The researchers believe that placing electrodes as close as possible to neurons is essential to achieve highly functional motor control.In this case, a total of 192 electrodes were surgically placed in the patient's brain, connecting to a computer. From there, a type of AI called a feed-forward neural network interprets the signals, assigning them to different finger movements. The AI system learned to distinguish the signals during a training stage in which the patient tried to perform motions with their fingers — in their mind, to clarify — in sync with a moving virtual hand.In total, the system provides four degrees of freedom: forwards and backwards, left and right, up and down, and horizontal rotation. Plenty to fly a drone or take control of any virtual environment.The researchers hope that their technique will open up vast recreational opportunities for people with paralysis and other severe disabilities — like being able to play multiplayer video games, a feat already achieved by a Neuralink patient."People tend to focus on restoration of the sorts of functions that are basic necessities — eating, dressing, mobility — and those are all important," co-author Jamie Henderson, a Stanford professor of neurosurgery, said in the statement. "But oftentimes, other equally important aspects of life get short shrift, like recreation or connection with peers. People want to play games and interact with their friends."Willsey's patient, a 69-year-old man who became quadriplegic after sustaining a devastating spine injury, has a passion for flying. With any luck, he may be able to play a full blown flight simulator — or maybe even control a real drone — in the near future.More on brain implants: First Neuralink Patient Using It to Learn New LanguagesShare This ArticleImage by Willsey et alRead This Next11.26.24 DevicesNeuralink Testing Robot Arm Controlled by Brain Chip8.29.24 Neuroscience/Brain ScienceFirst Neuralink Patient Using It to Learn New Languages8.15.24 DevicesGroundbreaking Brain Chip Allows Man With ALS to "Speak" Again7.01.24 DevicesNeuralink Cancels Second Implant Surgery Due to Medical Issues7.01.24 DevelopmentsScientists Create Robot Controlled by Blob of Human Brain Cells'''
