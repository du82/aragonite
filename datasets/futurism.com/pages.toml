["https://futurism.com/neoscope/lawsuit-toxic-ingredient-skittles-health"]
title = "Please No! Lawsuit Claims Toxic Ingredient in Delicious Skittles"
description = "A suit filed against Mars Inc, on Thursday claims the company doesn't inform customers that Skittles contains titanium dioxide, which could be toxic."
full_description = '''Worst RainbowUpdated 7.17.22, 4:39 PM EDT / by Lonnie Lee HoodPlease No! Lawsuit Claims Toxic Ingredient in Delicious SkittlesTo taste or not taste the rainbow?Updated 7.17.22, 4:39 PM EDT / Lonnie Lee HoodImage by Getty / Futurism Organic ChemistryThe rainbow might not taste quite as good as we thought, if a lawsuit filed against the candy company that makes Skittles turns out to have substantial evidence.The Guardian reported yesterday that a California resident filed suit against Mars Inc on Thursday because they claim the company doesn't properly inform customers that the candy contains titanium dioxide. The dye was banned in France in 2016, and court documents say Mars agreed to remove the ingredient from its candy, but it still appears on some ingredients lists."Incredibly, Defendant even claimed that '[a]rtificial colors pose no known risks to human health or safety,'" court documents the Guardian obtained claim. "In doing so, Defendant concealed from consumers material information it knew."The science behind the ingredient's ban is admittedly a little thin. In 2016 the European Food Safety Authority said titanium dioxide isn't currently considered toxic or dangerous when ingested, but that many experts think more testing is needed. In particular the EFSA said titanium dioxide, which gives candy a white background or a cloudy effect, could negatively impact reproductive organs and can theoretically build up in the body over time — albeit in small amounts.It's not clear which party will win the actual suit, but it's not unfair to say that consumers have a right to be concerned about the chemical's effects on their bodies. More research would be helpful in clarifying just how concerned they really should be.More on medical news: Medical Examiner Releases Details About Death of Ivana TrumpShare This ArticleImage by Getty / Futurism Read This Next1.29.25 DevelopmentsBefuddled RFK Jr. Says There Were No Chronic Diseases Back When He Was Young