["https://futurism.com/neoscope/scientists-new-material-reconnect-severed-nerves"]
title = "Scientists Say New Material Can Reconnect Severed Nerves"
description = "Researchers have developed a material that can remotely stimulate neural tissue and allow nerve signals to flow again."
full_description = '''Nervy10.14.23, 5:30 AM EDT / by Sharon AdarloScientists Say New Material Can Reconnect Severed NervesImagine healing a damaged brain or a severed nerve.10.14.23, 5:30 AM EDT / Sharon AdarloImage by Getty ImagesBreakthroughsIn news that could be significant for patients with brain or nerve issues, researchers at Rice University have developed a new material that they say can stimulate neural tissue in a less invasive manner than previous treatments, and also allow nerve signals to flow again despite a severed connection.The research team at Rice says they've developed a magnetoelectric material, meaning it converts magnetic fields into electric fields. Doctors have long pondered whether such a biomedical material could help patients suffering from brain and nerve problems, but previous experiments on magnetoelectrics had a difficult time making neurons react to the converted electrical signal."We asked, ‘Can we create a material that can be like dust or is so small that by placing just a sprinkle of it inside the body you’d be able to stimulate the brain or nervous system?’" asked lead researcher Joshua Chen, a Rice doctoral alumnus, in a statement about the research. "With that question in mind, we thought that magnetoelectric materials were ideal candidates for use in neurostimulation. They respond to magnetic fields, which easily penetrate into the body, and convert them into electric fields — a language our nervous system already uses to relay information."Using rats as experimental subjects, according to a study published in the journal Nature Materials, the researchers were able to spark neurons to "restore a sensory reflex" and also allowed neural signals to flow again despite a severed nerve. In addition, they say the new material converts magnetic fields to electric fields 120 times faster than previous candidates.The material is also extremely tiny — as small as a fleck of dust on a penny. But it's a sophisticated piece of engineering; it's made up of the inorganic compound lead zirconium titanate, sandwiched between two layers of a special type of metallic glass alloy. The researchers then stacked atop this sandwich layers of platinum, hafnium oxide and zinc oxide."A lot of work went into making this very thin layer of less than 200 nanometers that gives us the really special properties," said Rice University neuroengineer and the study's principal investigator Jacob Robinson in a statement.While neurons couldn't detect the electric signal from previous magnetoelectric materials because the signal was too high, the scientists say the new material is able to create an electric signal that neurons can pick up.The material presages a future in which an injection could precisely stimulate damaged nerves so that movement and function are restored. And beyond biomedical uses, the researchers envision that this magnetoelectric material can be potentially applied in computing, electronics and more."Once you discover a new material or class of materials, I think it’s really hard to anticipate all the potential uses for them," said Robinson.More on neurology: Genetic Engineering Makes Paralyzed Mice Walk AgainShare This ArticleImage by Getty ImagesRead This Next7.09.24 Neuroscience/Brain ScienceWhite House Admits Parkinson's Specialist Repeatedly Evaluated President Biden6.16.24 Neuroscience/Brain ScienceHuman Neurons Are Stuck Between Shifting Phases of Matter, Scientists Say5.30.24 Neuroscience/Brain ScienceScientists Connect 16 Mini Brains Made of Human Tissue to Create a "Living Computer"8.16.23 Scientists Extracted a Pink Floyd Song From Someone's Brain Waves. Here's What It Sounds Like.2.24.23 DevicesScientist Says He's Invented a Cure for Hiccups'''
