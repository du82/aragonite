["https://fuzzingbook.org/html/AcademicPrototyping.html"]
title = "Academic Prototyping - The Fuzzing Book"
description = '''This is the manuscript of Andreas Zeller's tutorial"Academic Prototyping" at the ESEC/FSE 2022 conference.'''
full_description = '''Academic Prototyping¶This is the manuscript of Andreas Zeller's tutorial "Academic Prototyping" at the ESEC/FSE 2022 conference. from bookutils import YouTubeVideo YouTubeVideo("Z7Z0cdwPS0U") About this Tutorial¶ In our Fuzzing Book, we use Python to implement automated testing techniques, and also as the language for most of our test subjects. Why Python? The short answer is Python made us amazingly productive. Most techniques in this book took 2-3 days to implement. This is about 10-20 times faster than for "classic" languages like C or Java. A factor of 10–20 in productivity is enormous, almost ridiculous. Why is that so, and which consequences does this have for research and teaching? What I will talk about¶ In this tutorial, I will demonstrate this by prototyping a symbolic test generator from scratch. This normally would be considered a very difficult task, taking months to build. Yet, developing the code in this chapter took less than two hours – and explaining it takes less than 20 minutes. We will explore the reasons for this productivity, singling out to Python and Jupyter notebooks as the main drivers. And we will discuss the consequences for academic software development. What you will learn¶ Using Python and its libraries as language for prototyping Using Jupyter Notebooks as a tool for coding and running evaluations Understanding where gains in productivity and replicability come from The Trouble with Analyzing Compiled Languages¶In the course of my career, I have built (and let build) several tools that operate on compiled languages such as C or Java – notably automated debugging tools that would extract and analyze dynamic information from program executions, and automated testing tools that would exercise individual applications or functions with (generated) inputs. What I learned from this experience can be summarized as follows: Instrumenting compiled code is hard. You need to plug into existing infrastructures such as the Java or C compilers, find out which code to add, find out how to adapt this to the respective compiler. Capturing information from compiled code is hard, too. Again, you need to instrument code (see above), but you also need to make sure the information gets stored (efficiently?), later retrieved and decoded. All this is immensely bug-prone. There is a good reason why successful test generators assume an absolute minimum of infrastructure (e.g. getting coverage with existing tools, and nothing more). If you want to go into static or even symbolic analysis, things are even worse. Parsing C and Java code yourself is difficult; for large-scale code, it's next to impossible. Working on some intermediate representation is possible, thanks to the power of existing infrastructures such as Soot. But if you want to extend these, you are in for weeks and weeks of work. Symbolic analysis is extra hard, as you typically want to operate on an abstraction level that is at least as high as the source code, requiring you to create ties between the symbolic level, the source code level, and the actual machine code. All possible, but hard. Now, if your focus is to actually analyze large scale code, for instance because the domain is very important, and the problems are challenging you are in industry and work on safety-critical systems you'd like to evaluate some approach on lots of samples in compiled languages then it may well make sense to eventually apply your approach to large-scale code. But before that, you may want to check whether your approach actually works. This is where prototyping comes into play. Prototyping means to develop a quick solution to explore the feasibility of some approach: to gather feedback from practice to quickly evolve an approach to show that something may work In other words, the proof of concept that we typically need to show in our academic world. Python is Easy¶Python is a high-level language that allows one to focus on the actual algorithms rather than how individual bits and bytes are passed around in memory. For this book, this is important: We want to focus on how individual techniques work, and not so much their optimization. Focusing on algorithms allows you to toy and tinker with them, and quickly develop your own. Once you have found out how to do things, you can still port your approach to some other language or specialized setting. As an example, take the (in)famous triangle program, which classifies a triangle of lengths $a$, $b$, $c$ into one of three categories. It reads like pseudocode; yet, we can easily execute it. def triangle(a, b, c): if a == b: if b == c: return 'equilateral' else: return 'isosceles #1' else: if b == c: return 'isosceles #2' else: if a == c: return 'isosceles #3' else: return 'scalene' Here's an example of executing the triangle() function: triangle(2, 3, 4) 'scalene' For the remainder of this chapter, we will use the triangle() function as ongoing example for a program to be tested. Of course, the complexity of triangle() is a far cry from large systems, and what we show in this chapter will not apply to, say, an ecosystem of thousands of intertwined microservices. Its point, however, is to show how easy certain techniques can be – if you have the right language and environment. Building a Minimal Tester¶ If you want to test triangle() with random values, that's fairly easy to do. Just bring along one of the Python random number generators and throw them into triangle(). from random import randrange for i in range(10): a = randrange(1, 10) b = randrange(1, 10) c = randrange(1, 10) t = triangle(a, b, c) print(f"triangle({a}, {b}, {c}) = {repr(t)}") triangle(6, 4, 3) = 'scalene' triangle(9, 9, 9) = 'equilateral' triangle(5, 1, 9) = 'scalene' triangle(4, 9, 6) = 'scalene' triangle(3, 4, 2) = 'scalene' triangle(8, 3, 7) = 'scalene' triangle(6, 3, 7) = 'scalene' triangle(1, 1, 8) = 'isosceles #1' triangle(3, 8, 6) = 'scalene' triangle(8, 9, 1) = 'scalene' So far, so good – but that's something you can do in pretty much any programming language. What is it that makes Python special? Dynamic Analysis in Python: So Easy it Hurts¶Dynamic analysis is the ability to track what is happening during program execution. The Python settrace() mechanism allows you to track all code lines, all variables, all values, as the program executes – and all this in a handful of lines of code. Our Coverage class from the chapter on coverage shows how to capture a trace of all lines executed in five lines of code; such a trace easily converts into sets of lines or branches executed. With two more lines, you can easily track all functions, arguments, variable values, too – see for instance our chapter on dynamic invariants. And you can even access the source code of individual functions (and print it out, too!) All this takes 10, maybe 20 minutes to implement. Here is a piece of Python that does it all. We track lines executed, and for every line, we print its source codes and the current values of all local variables: import sys import inspect def traceit(frame, event, arg): function_code = frame.f_code function_name = function_code.co_name lineno = frame.f_lineno vars = frame.f_locals source_lines, starting_line_no = inspect.getsourcelines(frame.f_code) loc = f"{function_name}:{lineno} {source_lines[lineno - starting_line_no].rstrip()}" vars = ", ".join(f"{name} = {vars[name]}" for name in vars) print(f"{loc:50} ({vars})") return traceit The function sys.settrace() registers traceit() as a trace function; it will then trace the given invocation of triangle(): def triangle_traced(): sys.settrace(traceit) triangle(2, 2, 1) sys.settrace(None) triangle_traced() triangle:1 def triangle(a, b, c): (a = 2, b = 2, c = 1) triangle:2 if a == b: (a = 2, b = 2, c = 1) triangle:3 if b == c: (a = 2, b = 2, c = 1) triangle:6 return 'isosceles #1' (a = 2, b = 2, c = 1) triangle:6 return 'isosceles #1' (a = 2, b = 2, c = 1) In comparison, try to build such a dynamic analysis for, say, C. You can either instrument the code to track all lines executed and record variable values, storing the resulting info in some database. This will take you weeks, if not months to implement. You can also run your code through a debugger (step-print-step-print-step-print); but again, programming the interaction can take days. And once you have the first results, you'll probably realize you need something else or better, so you go back to the drawing board. Not fun. Together with a dynamic analysis such as the one above, you can make fuzzing much smarter. Search-based testing, for instance, evolves a population of inputs towards a particular goal, such as coverage. With a good dynamic analysis, you can quickly implement search-based strategies for arbitrary goals. Static Analysis in Python: Still Easy¶Static analysis refers to the ability to analyze program code without actually executing it. Statically analyzing Python code to deduce any property can be a nightmare, because the language is so highly dynamic. (More on that below.) If your static analysis does not have to be sound, – for instance, because you only use it to support and guide another technique such as testing – then a static analysis in Python can be very simple. The ast module allows you to turn any Python function into an abstract syntax tree (AST), which you then can traverse as you like. Here's the AST for our triangle() function: from bookutils import rich_output import ast if rich_output(): # Normally, this will do from showast import show_ast else: def show_ast(tree): ast.dump(tree, indent=4) triangle_source = inspect.getsource(triangle) triangle_ast = ast.parse(triangle_source) show_ast(triangle_ast) 0 FunctionDef 1 "triangle" 0--1 2 arguments 0--2 9 If 0--9 3 arg 2--3 5 arg 2--5 7 arg 2--7 4 "a" 3--4 6 "b" 5--6 8 "c" 7--8 10 Compare 9--10 18 If 9--18 33 If 9--33 11 Name 10--11 14 Eq 10--14 15 Name 10--15 12 "a" 11--12 13 Load 11--13 16 "b" 15--16 17 Load 15--17 19 Compare 18--19 27 Return 18--27 30 Return 18--30 20 Name 19--20 23 Eq 19--23 24 Name 19--24 21 "b" 20--21 22 Load 20--22 25 "c" 24--25 26 Load 24--26 28 Constant 27--28 29 "equilateral" 28--29 31 Constant 30--31 32 "isosceles #1" 31--32 34 Compare 33--34 42 Return 33--42 45 If 33--45 35 Name 34--35 38 Eq 34--38 39 Name 34--39 36 "b" 35--36 37 Load 35--37 40 "c" 39--40 41 Load 39--41 43 Constant 42--43 44 "isosceles #2" 43--44 46 Compare 45--46 54 Return 45--54 57 Return 45--57 47 Name 46--47 50 Eq 46--50 51 Name 46--51 48 "a" 47--48 49 Load 47--49 52 "c" 51--52 53 Load 51--53 55 Constant 54--55 56 "isosceles #3" 55--56 58 Constant 57--58 59 "scalene" 58--59 Now suppose one wants to identify all triangle branches and their conditions using static analysis. You would traverse the AST, searching for If nodes, and take their first child (the condition). This is easy as well: def collect_conditions(tree): conditions = [] def traverse(node): if isinstance(node, ast.If): cond = ast.unparse(node.test).strip() conditions.append(cond) for child in ast.iter_child_nodes(node): traverse(child) traverse(tree) return conditions Here are the four if conditions occurring in the triangle() code: collect_conditions(triangle_ast) ['a == b', 'b == c', 'b == c', 'a == c'] Not only can we extract individual program elements, we can also change them at will and convert the tree back into source code. Program transformations (say, for instrumentation or mutation analysis) are a breeze. The above code took five minutes to write. Again, try that in Java or C. Symbolic Reasoning in Python: There's a Package for That¶Let's get back to testing. We have shown how to extract conditions from code. To reach a particular location in the triangle() function, one needs to find a solution for the path conditions leading to that branch. To reach the last line in triangle() (the 'scalene' branch), we have to find a solution for $$a \ne b \land b \ne c \land a \ne c$$ We can make use of a constraint solver for this, such as Microsoft's Z3 solver: import z3 Let us use Z3 to find a solution for the 'scalene' branch condition: a = z3.Int('a') b = z3.Int('b') c = z3.Int('c') s = z3.Solver() s.add(z3.And(a > 0, b > 0, c > 0)) # Triangle edges are positive s.add(z3.And(a != b, b != c, a != c)) # Our condition s.check() sat Z3 has shown us that there is a solution ("sat" = "satisfiable"). Let us get one: m = s.model() m [a = 1, c = 3, b = 2] We can use this solution right away for testing the triangle() function and find that it indeed covers the 'scalene' branch. The method as_long() converts the Z3 results into numerical values. triangle(m[a].as_long(), m[b].as_long(), m[c].as_long()) 'scalene' A Symbolic Test Generator¶With what we have seen, we can now build a symbolic test generator – a tool that attempts to systematically create test inputs that cover all paths. Let us find all conditions we need to solve, by exploring all paths in the tree. We turn these paths to Z3 format right away: def collect_path_conditions(tree): paths = [] def traverse_if_children(children, context, cond): old_paths = len(paths) for child in children: traverse(child, context + [cond]) if len(paths) == old_paths: paths.append(context + [cond]) def traverse(node, context): if isinstance(node, ast.If): cond = ast.unparse(node.test).strip() not_cond = "z3.Not(" + cond + ")" traverse_if_children(node.body, context, cond) traverse_if_children(node.orelse, context, not_cond) else: for child in ast.iter_child_nodes(node): traverse(child, context) traverse(tree, []) return ["z3.And(" + ", ".join(path) + ")" for path in paths] path_conditions = collect_path_conditions(triangle_ast) path_conditions ['z3.And(a == b, b == c)', 'z3.And(a == b, z3.Not(b == c))', 'z3.And(z3.Not(a == b), b == c)', 'z3.And(z3.Not(a == b), z3.Not(b == c), a == c)', 'z3.And(z3.Not(a == b), z3.Not(b == c), z3.Not(a == c))'] Now all we need to do is to feed these constraints into Z3. We see that we easily cover all branches: for path_condition in path_conditions: s = z3.Solver() s.add(a > 0, b > 0, c > 0) eval(f"s.check({path_condition})") m = s.model() print(m, triangle(m[a].as_long(), m[b].as_long(), m[c].as_long())) [a = 1, c = 1, b = 1] equilateral [c = 2, a = 1, b = 1] isosceles #1 [c = 2, a = 1, b = 2] isosceles #2 [c = 1, a = 1, b = 2] isosceles #3 [c = 3, a = 1, b = 2] scalene Success! We have covered all branches of the triangle program! Now, the above is still very limited – and tailored to the capabilities of the triangle() code. A full implementation would actually translate entire Python conditions into Z3 syntax (if possible), handle more control flow constructs such as returns, assertions, exceptions and half a million things more (loops, calls, you name it) Some of these may not be supported by the Z3 theories. To make it easier for a constraint solver to find solutions, you could also provide concrete values observed from earlier executions that already are known to reach specific paths in the program. Such concrete values would be gathe'''
