full_description = '''The Fuzzing Book¶ Sitemap¶While the chapters of this book can be read one after the other, there are many possible paths through the book. In this graph, an arrow A → B means that chapter A is a prerequisite for chapter B. You can pick arbitrary paths in this graph to get to the topics that interest you most: Fuzzer Fuzzing: Breaking Things with Random Inputs Coverage Code Coverage Fuzzer->Coverage SearchBasedFuzzer Search-Based Fuzzing Fuzzer->SearchBasedFuzzer Grammars Fuzzing with Grammars Fuzzer->Grammars SymbolicFuzzer Symbolic Fuzzing Fuzzer->SymbolicFuzzer FuzzingInTheLarge Fuzzing in the Large Fuzzer->FuzzingInTheLarge MutationFuzzer Mutation-Based Fuzzing Coverage->MutationFuzzer MutationAnalysis Mutation Analysis Coverage->MutationAnalysis GrammarCoverageFuzzer Grammar Coverage Coverage->GrammarCoverageFuzzer ProbabilisticGrammarFuzzer Probabilistic Grammar Fuzzing Coverage->ProbabilisticGrammarFuzzer ConcolicFuzzer Concolic Fuzzing Coverage->ConcolicFuzzer DynamicInvariants Mining Function Specifications Coverage->DynamicInvariants PythonFuzzer Testing Compilers Coverage->PythonFuzzer WhenToStopFuzzing When To Stop Fuzzing Coverage->WhenToStopFuzzing GrammarFuzzer Efficient Grammar Fuzzing Grammars->GrammarFuzzer Intro_Testing Introduction to Software Testing Intro_Testing->Fuzzer GreyboxFuzzer Greybox Fuzzing MutationFuzzer->GreyboxFuzzer GrammarMiner Mining Input Grammars GrammarCoverageFuzzer->GrammarMiner ConfigurationFuzzer Testing Configurations GrammarCoverageFuzzer->ConfigurationFuzzer Carver Carving Unit Tests GrammarCoverageFuzzer->Carver GUIFuzzer Testing Graphical User Interfaces GrammarCoverageFuzzer->GUIFuzzer APIFuzzer Fuzzing APIs ProbabilisticGrammarFuzzer->APIFuzzer GreyboxGrammarFuzzer Greybox Fuzzing with Grammars GreyboxFuzzer->GreyboxGrammarFuzzer GrammarFuzzer->GrammarCoverageFuzzer GrammarFuzzer->PythonFuzzer Parser Parsing Inputs GrammarFuzzer->Parser GeneratorGrammarFuzzer Fuzzing with Generators GrammarFuzzer->GeneratorGrammarFuzzer Reducer Reducing Failure- Inducing Inputs GrammarFuzzer->Reducer FuzzingWithConstraints Fuzzing with Constraints GrammarFuzzer->FuzzingWithConstraints WebFuzzer Testing Web Applications GrammarFuzzer->WebFuzzer Parser->ProbabilisticGrammarFuzzer Parser->GreyboxGrammarFuzzer InformationFlow Tracking Information Flow Parser->InformationFlow GeneratorGrammarFuzzer->APIFuzzer WebFuzzer->GUIFuzzer InformationFlow->ConcolicFuzzer InformationFlow->GrammarMiner APIFuzzer->Carver Table of Contents¶Part I: Whetting Your Appetite¶In this part, we introduce the topics of the book. Tours through the Book¶This book is massive. With more than 20,000 lines of code and 150,000 words of text, a printed version would cover more than 1,200 pages of text. Obviously, we do not assume that everybody wants to read everything. Introduction to Software Testing¶Before we get to the central parts of the book, let us introduce essential concepts of software testing. Why is it necessary to test software at all? How does one test software? How can one tell whether a test has been successful? How does one know if one has tested enough? In this chapter, let us recall the most important concepts, and at the same time get acquainted with Python and interactive notebooks. Part II: Lexical Fuzzing¶This part introduces test generation at the lexical level, that is, composing sequences of characters. Fuzzing: Breaking Things with Random Inputs¶In this chapter, we'll start with one of the simplest test generation techniques. The key idea of random text generation, also known as fuzzing, is to feed a string of random characters into a program in the hope to uncover failures. Code Coverage¶In the previous chapter, we introduced basic fuzzing – that is, generating random inputs to test programs. How do we measure the effectiveness of these tests? One way would be to check the number (and seriousness) of bugs found; but if bugs are scarce, we need a proxy for the likelihood of a test to uncover a bug. In this chapter, we introduce the concept of code coverage, measuring which parts of a program are actually executed during a test run. Measuring such coverage is also crucial for test generators that attempt to cover as much code as possible. Mutation-Based Fuzzing¶Most randomly generated inputs are syntactically invalid and thus are quickly rejected by the processing program. To exercise functionality beyond input processing, we must increase chances to obtain valid inputs. One such way is so-called mutational fuzzing – that is, introducing small changes to existing inputs that may still keep the input valid, yet exercise new behavior. We show how to create such mutations, and how to guide them towards yet uncovered code, applying central concepts from the popular AFL fuzzer. Greybox Fuzzing¶In the previous chapter, we have introduced mutation-based fuzzing, a technique that generates fuzz inputs by applying small mutations to given inputs. In this chapter, we show how to guide these mutations towards specific goals such as coverage. The algorithms in this chapter stem from the popular American Fuzzy Lop (AFL) fuzzer, in particular from its AFLFast and AFLGo flavors. We will explore the greybox fuzzing algorithm behind AFL and how we can exploit it to solve various problems for automated vulnerability detection. Search-Based Fuzzing¶Sometimes we are not only interested in fuzzing as many as possible diverse program inputs, but in deriving specific test inputs that achieve some objective, such as reaching specific statements in a program. When we have an idea of what we are looking for, then we can search for it. Search algorithms are at the core of computer science, but applying classic search algorithms like breadth or depth first search to search for tests is unrealistic, because these algorithms potentially require us to look at all possible inputs. However, domain-knowledge can be used to overcome this problem. For example, if we can estimate which of several program inputs is closer to the one we are looking for, then this information can guide us to reach the target quicker – this information is known as a heuristic. The way heuristics are applied systematically is captured in meta-heuristic search algorithms. The "meta" denotes that these algorithms are generic and can be instantiated differently to different problems. Meta-heuristics often take inspiration from processes observed in nature. For example, there are algorithms mimicking evolutionary processes, swarm intelligence, or chemical reactions. In general, they are much more efficient than exhaustive search approaches such that they can be applied to vast search spaces – search spaces as vast as the domain of program inputs are no problem for them. Mutation Analysis¶In the chapter on coverage, we showed how one can identify which parts of the program are executed by a program, and hence get a sense of the effectiveness of a set of test cases in covering the program structure. However, coverage alone may not be the best measure for the effectiveness of a test, as one can have great coverage without ever checking a result for correctness. In this chapter, we introduce another means for assessing the effectiveness of a test suite: After injecting mutations – artificial faults – into the code, we check whether a test suite can detect these artificial faults. The idea is that if it fails to detect such mutations, it will also miss real bugs. Part III: Syntactic Fuzzing¶This part introduces test generation at the syntactical level, that is, composing inputs from language structures. Fuzzing with Grammars¶In the chapter on "Mutation-Based Fuzzing", we have seen how to use extra hints – such as sample input files – to speed up test generation. In this chapter, we take this idea one step further, by providing a specification of the legal inputs to a program. Specifying inputs via a grammar allows for very systematic and efficient test generation, in particular for complex input formats. Grammars also serve as the base for configuration fuzzing, API fuzzing, GUI fuzzing, and many more. Efficient Grammar Fuzzing¶In the chapter on grammars, we have seen how to use grammars for very effective and efficient testing. In this chapter, we refine the previous string-based algorithm into a tree-based algorithm, which is much faster and allows for much more control over the production of fuzz inputs. Grammar Coverage¶Producing inputs from grammars gives all possible expansions of a rule the same likelihood. For producing a comprehensive test suite, however, it makes more sense to maximize variety – for instance, by not repeating the same expansions over and over again. In this chapter, we explore how to systematically cover elements of a grammar such that we maximize variety and do not miss out individual elements. Parsing Inputs¶In the chapter on Grammars, we discussed how grammars can be used to represent various languages. We also saw how grammars can be used to generate strings of the corresponding language. Grammars can also perform the reverse. That is, given a string, one can decompose the string into its constituent parts that correspond to the parts of grammar used to generate it – the derivation tree of that string. These parts (and parts from other similar strings) can later be recombined using the same grammar to produce new strings. Probabilistic Grammar Fuzzing¶Let us give grammars even more power by assigning probabilities to individual expansions. This allows us to control how many of each element should be produced, and thus allows us to target our generated tests towards specific functionality. We also show how to learn such probabilities from given sample inputs, and specifically direct our tests towards input features that are uncommon in these samples. Fuzzing with Generators¶In this chapter, we show how to extend grammars with functions – pieces of code that get executed during grammar expansion, and that can generate, check, or change elements produced. Adding functions to a grammar allows for very versatile test generation, bringing together the best of grammar generation and programming. Greybox Fuzzing with Grammars¶In this chapter, we introduce important extensions to our syntactic fuzzing techniques, all leveraging syntactic parts of existing inputs. Reducing Failure-Inducing Inputs¶By construction, fuzzers create inputs that may be hard to read. This causes issues during debugging, when a human has to analyze the exact cause of the failure. In this chapter, we present techniques that automatically reduce and simplify failure-inducing inputs to a minimum in order to ease debugging. Part IV: Semantic Fuzzing¶This part introduces test generation techniques that take the semantics of the input into account, notably the behavior of the program that processes the input. Fuzzing with Constraints¶In previous chapters, we have seen how Grammar-Based Fuzzing allows us to efficiently generate myriads of syntactically valid inputs. However, there are semantic input features that cannot be expressed in a context-free grammar, such as Mining Input Grammars¶So far, the grammars we have seen have been mostly specified manually – that is, you (or the person knowing the input format) had to design and write a grammar in the first place. While the grammars we have seen so far have been rather simple, creating a grammar for complex inputs can involve quite some effort. In this chapter, we therefore introduce techniques that automatically mine grammars from programs – by executing the programs and observing how they process which parts of the input. In conjunction with a grammar fuzzer, this allows us to take a program, extract its input grammar, and fuzz it with high efficiency and effectiveness, using the concepts in this book. #### Tracking Information Flow We have explored how one could generate better inputs that can penetrate deeper into the program in question. While doing so, we have relied on program crashes to tell us that we have succeeded in finding problems in the program. However, that is rather simplistic. What if the behavior of the program is simply incorrect, but does not lead to a crash? Can one do better? Concolic Fuzzing¶In the chapter on information flow, we have seen how one can use dynamic taints to produce more intelligent test cases than simply looking for program crashes. We have also seen how one can use the taints to update the grammar, and hence focus more on the dangerous methods. Symbolic Fuzzing¶One of the problems with traditional methods of fuzzing is that they fail to exercise all the possible behaviors that a system can have, especially when the input space is large. Quite often the execution of a specific branch of execution may happen only with very specific inputs, which could represent a minimal fraction of the input space. The traditional fuzzing methods relies on chance to produce inputs they need. However, relying on randomness to generate values that we want is a bad idea when the space to be explored is huge. For example, a function that accepts a string, even if one only considers the first $10$ characters, already has $2^{80}$ possible inputs. If one is looking for a specific string, random generation of values will take a few thousand years even in one of the super computers. Mining Function Specifications¶When testing a program, one not only needs to cover its several behaviors; one also needs to check whether the result is as expected. In this chapter, we introduce a technique that allows us to mine function specifications from a set of given executions, resulting in abstract and formal descriptions of what the function expects and what it delivers. Part V: Domain-Specific Fuzzing¶This part discusses test generation for a number of specific domains. For all these domains, we introduce fuzzers that generate inputs as well as miners that analyze the input structure. Testing Configurations¶The behavior of a program is not only governed by its data. The configuration of a program – that is, the settings that govern the execution of a program on its (regular) input data, as set by options or configuration files – just as well influences behavior, and thus can and should be tested. In this chapter, we explore how to systematically test and cover software configurations. By automatically inferring configuration options, we can apply these techniques out of the box, with no need for writing a grammar. Finally, we show how to systematically cover combinations of configuration options, quickly detecting unwanted interferences. Fuzzing APIs¶So far, we have always generated system input, i.e. data that the program as a whole obtains via its input channels. However, we can also generate inputs that go directly into individual functions, gaining flexibility and speed in the process. In this chapter, we explore the use of grammars to synthesize code for function calls, which allows you to generate progr'''
