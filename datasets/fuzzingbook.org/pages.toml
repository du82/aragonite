title = "Carving Unit Tests - The Fuzzing Book"
description = "So far, we have always generated system input, i.e. data that the program as a whole obtains via its input channels.  If we are interested in testing only a small set of functions, having to go through the system can be very inefficient.  This chapter introduces a technique known as carving, which, given a system test, automatically extracts a set of unit tests that replicate the calls seen during the system test.  The key idea is to record such calls such that we can replay them later – as a whole or selectively.  On top, we also explore how to synthesize API grammars from carved unit tests; this means that we can synthesize API tests without having to write a grammar at all.Prerequisites Carving makes use of dynamic traces of function calls and variables, as introduced in the chapter on configuration fuzzing. Using grammars to test units was introduced in the chapter on API fuzzing."
full_description = '''Carving Unit Tests¶So far, we have always generated system input, i.e. data that the program as a whole obtains via its input channels. If we are interested in testing only a small set of functions, having to go through the system can be very inefficient. This chapter introduces a technique known as carving, which, given a system test, automatically extracts a set of unit tests that replicate the calls seen during the system test. The key idea is to record such calls such that we can replay them later – as a whole or selectively. On top, we also explore how to synthesize API grammars from carved unit tests; this means that we can synthesize API tests without having to write a grammar at all. Prerequisites Carving makes use of dynamic traces of function calls and variables, as introduced in the chapter on configuration fuzzing. Using grammars to test units was introduced in the chapter on API fuzzing. import bookutils.setup import APIFuzzer Synopsis¶ To use the code provided in this chapter, write >>> from fuzzingbook.Carver import <identifier> and then make use of the following features. This chapter provides means to record and replay function calls during a system test. Since individual function calls are much faster than a whole system run, such "carving" mechanisms have the potential to run tests much faster. Recording Calls¶The CallCarver class records all calls occurring while it is active. It is used in conjunction with a with clause: >>> with CallCarver() as carver: >>> y = my_sqrt(2) >>> y = my_sqrt(4) After execution, called_functions() lists the names of functions encountered: >>> carver.called_functions() ['my_sqrt', '__exit__'] The arguments() method lists the arguments recorded for a function. This is a mapping of the function name to a list of lists of arguments; each argument is a pair (parameter name, value). >>> carver.arguments('my_sqrt') [[('x', 2)], [('x', 4)]] Complex arguments are properly serialized, such that they can be easily restored. Synthesizing Calls¶While such recorded arguments already could be turned into arguments and calls, a much nicer alternative is to create a grammar for recorded calls. This allows synthesizing arbitrary combinations of arguments, and also offers a base for further customization of calls. The CallGrammarMiner class turns a list of carved executions into a grammar. >>> my_sqrt_miner = CallGrammarMiner(carver) >>> my_sqrt_grammar = my_sqrt_miner.mine_call_grammar() >>> my_sqrt_grammar {'<start>': ['<call>'], '<call>': ['<my_sqrt>'], '<my_sqrt-x>': ['2', '4'], '<my_sqrt>': ['my_sqrt(<my_sqrt-x>)']} This grammar can be used to synthesize calls. >>> fuzzer = GrammarCoverageFuzzer(my_sqrt_grammar) >>> fuzzer.fuzz() 'my_sqrt(4)' These calls can be executed in isolation, effectively extracting unit tests from system tests: >>> eval(fuzzer.fuzz()) 1.414213562373095 System Tests vs Unit Tests¶Remember the URL grammar introduced for grammar fuzzing? With such a grammar, we can happily test a Web browser again and again, checking how it reacts to arbitrary page requests. Let us define a very simple "web browser" that goes and downloads the content given by the URL. import urllib.parse def webbrowser(url): """Download the http/https resource given by the URL""" import requests # Only import if needed r = requests.get(url) return r.text Let us apply this on fuzzingbook.org and measure the time, using the Timer class: from Timer import Timer with Timer() as webbrowser_timer: fuzzingbook_contents = webbrowser( "http://www.fuzzingbook.org/html/Fuzzer.html") print("Downloaded %d bytes in %.2f seconds" % (len(fuzzingbook_contents), webbrowser_timer.elapsed_time())) Downloaded 474839 bytes in 0.48 seconds fuzzingbook_contents[:100] '\n<!-- A html document -->\n<!-- \nwith standard nbconvert css layout\nwith standard nbconvert input/out' A full web browser, of course, would also render the HTML content. We can achieve this using these commands (but we don't, as we do not want to replicate the entire Web page here): from IPython.display import HTML, display HTML(fuzzingbook_contents) Having to start a whole browser (or having it render a Web page) again and again means lots of overhead, though – in particular if we want to test only a subset of its functionality. In particular, after a change in the code, we would prefer to test only the subset of functions that is affected by the change, rather than running the well-tested functions again and again. Let us assume we change the function that takes care of parsing the given URL and decomposing it into the individual elements – the scheme ("http"), the network location ("www.fuzzingbook.com"), or the path ("/html/Fuzzer.html"). This function is named urlparse(): from urllib.parse import urlparse urlparse('https://www.fuzzingbook.com/html/Carver.html') ParseResult(scheme='https', netloc='www.fuzzingbook.com', path='/html/Carver.html', params='', query='', fragment='') You see how the individual elements of the URL – the scheme ("http"), the network location ("www.fuzzingbook.com"), or the path ("//html/Carver.html") are all properly identified. Other elements (like params, query, or fragment) are empty, because they were not part of our input. The interesting thing is that executing only urlparse() is orders of magnitude faster than running all of webbrowser(). Let us measure the factor: runs = 1000 with Timer() as urlparse_timer: for i in range(runs): urlparse('https://www.fuzzingbook.com/html/Carver.html') avg_urlparse_time = urlparse_timer.elapsed_time() / 1000 avg_urlparse_time 1.4512089546769858e-06 Compare this to the time required by the web browser webbrowser_timer.elapsed_time() 0.48406379198422655 The difference in time is huge: webbrowser_timer.elapsed_time() / avg_urlparse_time 333558.98916153726 Hence, in the time it takes to run webbrowser() once, we can have tens of thousands of executions of urlparse() – and this does not even take into account the time it takes the browser to render the downloaded HTML, to run the included scripts, and whatever else happens when a Web page is loaded. Hence, strategies that allow us to test at the unit level are very promising as they can save lots of overhead. Carving Unit Tests¶Testing methods and functions at the unit level requires a very good understanding of the individual units to be tested as well as their interplay with other units. Setting up an appropriate infrastructure and writing unit tests by hand thus is demanding, yet rewarding. There is, however, an interesting alternative to writing unit tests by hand. The technique of carving automatically converts system tests into unit tests by means of recording and replaying function calls: During a system test (given or generated), we record all calls into a function, including all arguments and other variables the function reads. From these, we synthesize a self-contained unit test that reconstructs the function call with all arguments. This unit test can be executed (replayed) at any time with high efficiency. In the remainder of this chapter, let us explore these steps. Recording Calls¶Our first challenge is to record function calls together with their arguments. (In the interest of simplicity, we restrict ourselves to arguments, ignoring any global variables or other non-arguments that are read by the function.) To record calls and arguments, we use the mechanism we introduced for coverage: By setting up a tracer function, we track all calls into individual functions, also saving their arguments. Just like Coverage objects, we want to use Carver objects to be able to be used in conjunction with the with statement, such that we can trace a particular code block: with Carver() as carver: function_to_be_traced() c = carver.calls() The initial definition supports this construct: \todo{Get tracker from dynamic invariants} import sys class Carver: def __init__(self, log=False): self._log = log self.reset() def reset(self): self._calls = {} # Start of `with` block def __enter__(self): self.original_trace_function = sys.gettrace() sys.settrace(self.traceit) return self # End of `with` block def __exit__(self, exc_type, exc_value, tb): sys.settrace(self.original_trace_function) The actual work takes place in the traceit() method, which records all calls in the _calls attribute. First, we define two helper functions: import inspect def get_qualified_name(code): """Return the fully qualified name of the current function""" name = code.co_name module = inspect.getmodule(code) if module is not None: name = module.__name__ + "." + name return name def get_arguments(frame): """Return call arguments in the given frame""" # When called, all arguments are local variables local_variables = frame.f_locals.copy() arguments = [(var, frame.f_locals[var]) for var in local_variables] arguments.reverse() # Want same order as call return arguments class CallCarver(Carver): def add_call(self, function_name, arguments): """Add given call to list of calls""" if function_name not in self._calls: self._calls[function_name] = [] self._calls[function_name].append(arguments) # Tracking function: Record all calls and all args def traceit(self, frame, event, arg): if event != "call": return None code = frame.f_code function_name = code.co_name qualified_name = get_qualified_name(code) arguments = get_arguments(frame) self.add_call(function_name, arguments) if qualified_name != function_name: self.add_call(qualified_name, arguments) if self._log: print(simple_call_string(function_name, arguments)) return None Finally, we need some convenience functions to access the calls: class CallCarver(CallCarver): def calls(self): """Return a dictionary of all calls traced.""" return self._calls def arguments(self, function_name): """Return a list of all arguments of the given function as (VAR, VALUE) pairs. Raises an exception if the function was not traced.""" return self._calls[function_name] def called_functions(self, qualified=False): """Return all functions called.""" if qualified: return [function_name for function_name in self._calls.keys() if function_name.find('.') >= 0] else: return [function_name for function_name in self._calls.keys() if function_name.find('.') < 0] Recording my_sqrt()¶ Let's try out our new Carver class – first on a very simple function: from Intro_Testing import my_sqrt with CallCarver() as sqrt_carver: my_sqrt(2) my_sqrt(4) We can retrieve all calls seen... sqrt_carver.calls() {'my_sqrt': [[('x', 2)], [('x', 4)]], 'Intro_Testing.my_sqrt': [[('x', 2)], [('x', 4)]], '__exit__': [[('tb', None), ('exc_value', None), ('exc_type', None), ('self', <__main__.CallCarver at 0x164d98e20>)]]} sqrt_carver.called_functions() ['my_sqrt', '__exit__'] ... as well as the arguments of a particular function: sqrt_carver.arguments("my_sqrt") [[('x', 2)], [('x', 4)]] We define a convenience function for nicer printing of these lists: def simple_call_string(function_name, argument_list): """Return function_name(arg[0], arg[1], ...) as a string""" return function_name + "(" + \ ", ".join([var + "=" + repr(value) for (var, value) in argument_list]) + ")" for function_name in sqrt_carver.called_functions(): for argument_list in sqrt_carver.arguments(function_name): print(simple_call_string(function_name, argument_list)) my_sqrt(x=2) my_sqrt(x=4) __exit__(tb=None, exc_value=None, exc_type=None, self=<__main__.CallCarver object at 0x164d98e20>) This is a syntax we can directly use to invoke my_sqrt() again: eval("my_sqrt(x=2)") 1.414213562373095 Carving urlparse()¶ What happens if we apply this to webbrowser()? with CallCarver() as webbrowser_carver: webbrowser("https://www.fuzzingbook.org") We see that retrieving a URL from the Web requires quite some functionality: function_list = webbrowser_carver.called_functions(qualified=True) len(function_list) 361 print(function_list[:50]) ['requests.api.get', 'requests.api.request', 'requests.sessions.__init__', 'requests.utils.default_headers', 'requests.utils.default_user_agent', 'requests.structures.__init__', 'collections.abc.update', 'abc.__instancecheck__', 'requests.structures.__setitem__', 'requests.hooks.default_hooks', 'requests.hooks.<dictcomp>', 'requests.cookies.cookiejar_from_dict', 'http.cookiejar.__init__', 'threading.RLock', 'http.cookiejar.__iter__', 'requests.cookies.<listcomp>', 'http.cookiejar.deepvalues', 'http.cookiejar.vals_sorted_by_key', 'requests.adapters.__init__', 'urllib3.util.retry.__init__', 'urllib3.util.retry.<listcomp>', 'requests.adapters.init_poolmanager', 'urllib3.poolmanager.__init__', 'urllib3.request.__init__', 'urllib3._collections.__init__', 'requests.sessions.mount', 'requests.sessions.<listcomp>', 'requests.sessions.__enter__', 'requests.sessions.request', 'requests.models.__init__', 'requests.sessions.prepare_request', 'requests.cookies.merge_cookies', 'requests.cookies.update', 'requests.utils.get_netrc_auth', 'collections.abc.get', 'os.__getitem__', 'os.encode', 'requests.utils.<genexpr>', 'posixpath.expanduser', 'posixpath._get_sep', 'collections.abc.__contains__', 'os.decode', 'genericpath.exists', 'urllib.parse.urlparse', 'urllib.parse._coerce_args', 'urllib.parse.urlsplit', 'urllib.parse._splitnetloc', 'urllib.parse._checknetloc', 'urllib.parse._noop', 'netrc.__init__'] Among several other functions, we also have a call to urlparse(): urlparse_argument_list = webbrowser_carver.arguments("urllib.parse.urlparse") urlparse_argument_list [[('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')], [('allow_fragments', True), ('scheme', ''), ('url', 'https://www.fuzzingbook.org/')]] Again, we can convert this into a well-formatted call: urlparse_call = simple_call_string("urlparse", urlparse_argument_list[0]) urlparse_call "urlparse(allow_fragments=True, scheme='', url='https://www.fuzzingbook.org')" Again, we can re-execute this call: eval(urlparse_call) ParseResult(scheme='https', netloc='www.fuzzingbook.org', path='', params='', query='', fragment='') We now have successfully carved the call to urlparse() out of the webbrowser() execution. Replaying Calls¶ Replaying calls in their entirety and in all generality is tricky, as there are several challenges to be addressed. These include: We '''
