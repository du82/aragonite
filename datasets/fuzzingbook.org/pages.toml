title = "Concolic Fuzzing - The Fuzzing Book"
description = "In the chapter on information flow, we have seen how one can use dynamic taints to produce more intelligent test cases than simply looking for program crashes. We have also seen how one can use the taints to update the grammar, and hence focus more on the dangerous methods. While taints are helpful, uninterpreted strings is only one of the attack vectors. Can we say anything more about the properties of variables at any point in the execution? For example, can we say for sure that a function will always receive the buffers with the correct length? Concolic execution offers a solution here. The idea of concolic execution over a function is as follows: We start with a sample input for the function, and execute the function under trace. At each point the execution passes through a conditional, we save the conditional encountered in the form of relations between symbolic variables. Here, a symbolic variable can be thought of as a sort of placeholder for the real variable, sort of like the x in solving for x in Algebra. The symbolic variables can be used to specify relations without actually solving them.With concolic execution, one can collect the constraints that an execution path encounters, and use it to answer questions about the program behavior at any point we prefer along the program execution path. We can further use concolic execution to enhance fuzzing.In this chapter, we explore in depth how to execute a Python function concolically, and how concolic execution can be used to enhance fuzzing.Prerequisites You should have read the chapter on coverage. You should have read the chapter on information flow. A familiarity with the basic idea of SMT solvers would be useful."
full_description = '''Concolic Fuzzing¶In the chapter on information flow, we have seen how one can use dynamic taints to produce more intelligent test cases than simply looking for program crashes. We have also seen how one can use the taints to update the grammar, and hence focus more on the dangerous methods. While taints are helpful, uninterpreted strings is only one of the attack vectors. Can we say anything more about the properties of variables at any point in the execution? For example, can we say for sure that a function will always receive the buffers with the correct length? Concolic execution offers a solution here. The idea of concolic execution over a function is as follows: We start with a sample input for the function, and execute the function under trace. At each point the execution passes through a conditional, we save the conditional encountered in the form of relations between symbolic variables. Here, a symbolic variable can be thought of as a sort of placeholder for the real variable, sort of like the x in solving for x in Algebra. The symbolic variables can be used to specify relations without actually solving them. With concolic execution, one can collect the constraints that an execution path encounters, and use it to answer questions about the program behavior at any point we prefer along the program execution path. We can further use concolic execution to enhance fuzzing. In this chapter, we explore in depth how to execute a Python function concolically, and how concolic execution can be used to enhance fuzzing. from bookutils import YouTubeVideo YouTubeVideo('KDcMjWX5ulU') Prerequisites You should have read the chapter on coverage. You should have read the chapter on information flow. A familiarity with the basic idea of SMT solvers would be useful. import bookutils.setup from typing import List, Callable, Dict, Tuple Synopsis¶ To use the code provided in this chapter, write >>> from fuzzingbook.ConcolicFuzzer import <identifier> and then make use of the following features. This chapter defines two main classes: SimpleConcolicFuzzer and ConcolicGrammarFuzzer. The SimpleConcolicFuzzer first uses a sample input to collect predicates encountered. The fuzzer then negates random predicates to generate new input constraints. These, when solved, produce inputs that explore paths that are close to the original path. ConcolicTracer¶At the heart of both fuzzers lies the concept of a concolic tracer, capturing symbolic variables and path conditions as a program gets executed. ConcolicTracer is used in a with block; the syntax tracer[function] executes function within the tracer while capturing conditions. Here is an example for the cgi_decode() function: >>> with ConcolicTracer() as _: >>> _[cgi_decode]('a%20d') Once executed, we can retrieve the symbolic variables in the decls attribute. This is a mapping of symbolic variables to types. >>> _.decls {'cgi_decode_s_str_1': 'String'} The extracted path conditions can be found in the path attribute: >>> _.path [0 < Length(cgi_decode_s_str_1), Not(str.substr(cgi_decode_s_str_1, 0, 1) == "+"), Not(str.substr(cgi_decode_s_str_1, 0, 1) == "%"), 1 < Length(cgi_decode_s_str_1), Not(str.substr(cgi_decode_s_str_1, 1, 1) == "+"), str.substr(cgi_decode_s_str_1, 1, 1) == "%", Not(str.substr(cgi_decode_s_str_1, 2, 1) == "0"), Not(str.substr(cgi_decode_s_str_1, 2, 1) == "1"), str.substr(cgi_decode_s_str_1, 2, 1) == "2", str.substr(cgi_decode_s_str_1, 3, 1) == "0", 4 < Length(cgi_decode_s_str_1), Not(str.substr(cgi_decode_s_str_1, 4, 1) == "+"), Not(str.substr(cgi_decode_s_str_1, 4, 1) == "%"), Not(5 < Length(cgi_decode_s_str_1))] The context attribute holds a pair of decls and path attributes; this is useful for passing it into the ConcolicTracer constructor. >>> assert _.context == (_.decls, _.path) We can solve these constraints to obtain a value for the function parameters that follow the same path as the original (traced) invocation: >>> _.zeval() ('sat', {'s': ('A%20B', 'String')}) The zeval() function also allows passing alternate or negated constraints. See the chapter for examples. ConcolicTracer ConcolicTracer __call__() __init__() zeval() __enter__() __exit__() __getitem__() concolic() smt_expr() Legend Legend • public_method() • private_method() • overloaded_method() Hover over names to see doc SimpleConcolicFuzzer¶The constraints obtained from ConcolicTracer are added to the concolic fuzzer as follows: >>> scf = SimpleConcolicFuzzer() >>> scf.add_trace(_, 'a%20d') The concolic fuzzer then uses the constraints added to guide its fuzzing as follows: >>> scf = SimpleConcolicFuzzer() >>> for i in range(20): >>> v = scf.fuzz() >>> if v is None: >>> break >>> print(repr(v)) >>> with ExpectError(print_traceback=False): >>> with ConcolicTracer() as _: >>> _[cgi_decode](v) >>> scf.add_trace(_, v) ' ' '+' '%' '+A' 'AB' '++' '++A' IndexError: string index out of range (expected) '+++' 'A' '+A' '+++A' '+AB' '++' '%' '++AB' '++A+' '+A' '++' '+' '+%' IndexError: string index out of range (expected) IndexError: string index out of range (expected) We see how the additional inputs generated explore additional paths. SimpleConcolicFuzzer SimpleConcolicFuzzer __init__() fuzz() add_trace() get_newpath() next_choice() Fuzzer Fuzzer __init__() fuzz() run() runs() SimpleConcolicFuzzer->Fuzzer Legend Legend • public_method() • private_method() • overloaded_method() Hover over names to see doc ConcolicGrammarFuzzer¶The SimpleConcolicFuzzer simply explores all paths near the original path traversed by the sample input. It uses a simple mechanism to explore the paths that are near the paths that it knows about, and other than code paths, knows nothing about the input. The ConcolicGrammarFuzzer on the other hand, knows about the input grammar, and can collect feedback from the subject under fuzzing. It can lift some constraints encountered to the grammar, enabling deeper fuzzing. It is used as follows: >>> from InformationFlow import INVENTORY_GRAMMAR, SQLException >>> cgf = ConcolicGrammarFuzzer(INVENTORY_GRAMMAR) >>> cgf.prune_tokens(prune_tokens) >>> for i in range(10): >>> query = cgf.fuzz() >>> print(query) >>> with ConcolicTracer() as _: >>> with ExpectError(print_traceback=False): >>> try: >>> res = _[db_select](query) >>> print(repr(res)) >>> except SQLException as e: >>> print(e) >>> cgf.update_grammar(_) >>> print() select 245 from :2 where r(_)-N+e>n Table (':2') was not found delete from vehicles where Q/x/j/q(p)/H*h-B==cz Invalid WHERE ('Q/x/j/q(p)/H*h-B==cz') insert into months (:b) values (22.72) Column (':b') was not found select i*q!=(4) from months where L*S/l/u/b+b==W delete from months where W/V!=A(f)+t<O*E/S-. Invalid WHERE ('W/V!=A(f)+t<O*E/S-.') update months set d=u,month=r,name=f,month=s,month=I where z!=v!=(P-I) Column ('d') was not found delete from months where (b==D)-_/W+z/s/e>W*x>L Invalid WHERE ('(b==D)-_/W+z/s/e>W*x>L') select E((f),C) from vehicles where I+g-y-v+G>y-P*l select _ from vehicles Invalid WHERE ('(_)') delete from vehicles where _*A-w-R<m/V-d*z/p-x Invalid WHERE ('_*A-w-R<m/V-d*z/p-x') TypeError: 'NotImplementedType' object is not callable (expected) TypeError: 'NotImplementedType' object is not callable (expected) ConcolicGrammarFuzzer ConcolicGrammarFuzzer fuzz() coalesce() prune_tokens() prune_tree() tree_to_string() update_grammar() GrammarFuzzer GrammarFuzzer __init__() check_grammar() choose_node_expansion() choose_tree_expansion() expand_node_randomly() expand_tree() expand_tree_once() expand_tree_with_strategy() fuzz() fuzz_tree() log_tree() process_chosen_children() supported_opts() ConcolicGrammarFuzzer->GrammarFuzzer Fuzzer Fuzzer __init__() fuzz() run() runs() GrammarFuzzer->Fuzzer Legend Legend • public_method() • private_method() • overloaded_method() Hover over names to see doc Tracking Constraints¶ In the chapter on information flow, we have seen how dynamic taints can be used to direct fuzzing by indicating which part of input reached interesting places. However, dynamic taint tracking is limited in the information that it can propagate. For example, we might want to explore what happens when certain properties of the input changes. For example, say we have a function factorial() that returns the factorial value of its input. def factorial(n): if n < 0: return None if n == 0: return 1 if n == 1: return 1 v = 1 while n != 0: v = v * n n = n - 1 return v We exercise the function with a value of 5. factorial(5) 120 Is this sufficient to explore all the features of the function? How do we know? One way to verify that we have explored all features is to look at the coverage obtained. First we need to extend the Coverage class from the chapter on coverage to provide us with coverage arcs. from Coverage import Coverage import inspect class ArcCoverage(Coverage): def traceit(self, frame, event, args): if event != 'return': f = inspect.getframeinfo(frame) self._trace.append((f.function, f.lineno)) return self.traceit def arcs(self): t = [i for f, i in self._trace] return list(zip(t, t[1:])) Next, we use the Tracer to obtain the coverage arcs. with ArcCoverage() as cov: factorial(5) We can now use the coverage arcs to visualize the coverage obtained. from ControlFlow import to_graph, gen_cfg to_graph(gen_cfg(inspect.getsource(factorial)), arcs=cov.arcs()) 1 1: enter: factorial(n) 3 2: if: n < 0 1->3 2 1: exit: factorial(n) 4 3: return None 4->2 6 6: return 1 6->2 8 9: return 1 8->2 13 16: return v 13->2 3->4 5 5: if: n == 0 3->5 5->6 7 8: if: n == 1 5->7 7->8 9 11: v = 1 7->9 10 12: while: n != 0 9->10 10->13 11 13: v = v * n 10->11 12 14: n = n - 1 12->10 11->12 We see that the path [1, 2, 5, 8, 11, 12, 13, 14] is covered (green) but sub-paths such as [2, 3], [5, 6] and [8, 9] are unexplored (red). What we need is the ability to generate inputs such that the True branch is taken at 2. How do we do that? Concolic Execution¶One way to cover additional branches is to look at the execution path being taken, and collect the conditional constraints that the path encounters. Then we can try to produce inputs that lead us to taking the non-traversed path. First, let us step through the function. lines = [i[1] for i in cov._trace if i[0] == 'factorial'] src = {i + 1: s for i, s in enumerate( inspect.getsource(factorial).split('\n'))} The line (1) is simply the entry point of the function. We know that the input is n, which is an integer. src[1] 'def factorial(n):' The line (2) is a predicate n < 0. Since the next line taken is line (5), we know that at this point in the execution path, the predicate was false. src[2], src[3], src[4], src[5] (' if n < 0:', ' return None', '', ' if n == 0:') We notice that this is one of the predicates where the true branch was not taken. How do we generate a value that takes the true branch here? One way is to use symbolic variables to represent the input, encode the constraint, and use an SMT Solver to solve the negation of the constraint. As we mentioned in the introduction to the chapter, a symbolic variable can be thought of as a sort of placeholder for the real variable, sort of like the x in solving for x in Algebra. These variables can be used to encode constraints placed on the variables in the program. We identify what constraints the variable is supposed to obey, and finally produce a value that obeys all constraints imposed. Solving Constraints¶ To solve these constraints, one can use a Satisfiability Modulo Theories (SMT) solver. An SMT solver is built on top of a SATISFIABILITY (SAT) solver. A SAT solver is being used to check whether boolean formulas in first order logic (e.g. (a | b ) & (~a | ~b)) can be satisfied using any assignments for the variables (e.g a = true, b = false). An SMT solver extends these SAT solvers to specific background theories -- for example, theory of integers, or theory of strings. That is, given a string constraint expressed as a formula with string variables (e.g. h + t == 'hello,world'), an SMT solver that understands theory of strings can be used to check if that constraint can be satisfied, and if satisfiable, provide an instantiation of concrete values for the variables used in the formula (e.g h = 'hello,', t = 'world'). We use the SMT solver Z3 in this chapter. import z3 z3_ver = z3.get_version() print(z3_ver) (4, 11, 2, 0) assert z3_ver >= (4, 8, 13, 0), \ f"Please install z3-solver 4.8.13.0 or later - you have {z3_ver}" Let us set up Z3 first. To ensure that the string constraints we use in this chapter are successfully evaluated, we need to specify the z3str3 solver. Further, we set the timeout for Z3 computations to 30 seconds. # z3.set_option('smt.string_solver', 'z3str3') z3.set_option('timeout', 30 * 1000) # milliseconds To encode constraints, we need symbolic variables. Here, we make zn a placeholder for the Z3 symbolic integer variable n. zn = z3.Int('n') Remember the constraint (n < 0) from line 2 in factorial()? We can now encode the constraint as follows. zn < 0 n < 0 We previously traced factorial(5). We saw that with input 5, the execution took the else branch on the predicate n < 0. We can express this observation as follows. z3.Not(zn < 0) ¬(n < 0) Let us now solve constraints. The z3.solve() method checks if the constraints are satisfiable; if they are, it also provides values for variables such that the constraints are satisfied. For example, we can ask Z3 for an input that will take the else branch as follows: z3.solve(z3.Not(zn < 0)) [n = 0] This is a solution (albeit a trivial one). SMT solvers can be used to solve much harder problems. For example, here is how one can solve a quadratic equation. x = z3.Real('x') eqn = (2 * x**2 - 11 * x + 5 == 0) z3.solve(eqn) [x = 5] Again, this is one solution. We can ask z3 to give us another solution as follows. z3.solve(x != 5, eqn) [x = 1/2] Indeed, both x = 5 and x = 1/2 are solutions to the quadratic equation $2x^2 -11x + 5 = 0$ Similarly, we can ask Z3 for an input that satisfies the constraint encoded in line 2 of factorial() so that we take the if branch. z3.solve(zn < 0) [n = -1] That is, if one uses -1 as an input to factorial(), it is guaranteed to take the if branch in line 2 during execution. Let us try using that with our coverage. Here, the -1 is the solution from above. with cov as cov: factorial(-1) to_graph(gen_cfg(inspect.getsource(factorial)), arcs=cov.arcs()) 1 1: enter: factorial(n) 3 2: if: n < 0 1->3 2 1: exit: factorial(n) 4 3: return None 4->2 6 6: return 1 6->2 8 9: return 1 8->2 13 16: return v 13->2 3->4 5 5: if: n == 0 3->5 5->6 7 8: if: n == 1 5->7 7->8 9 11: v = 1 7->9 10 12: while: n != 0 9->10 10->13 11 13: v = v * n 10->11 12 14: n = n - 1 12->10 11->12 Ok, so we have managed to cover a little more of the graph. Let us continue with our original input of factorial(5): In line (5) we encounter a new predicate n == 0, for which we again took the false branch. src[5] ' if n == 0:' The predicates required, to follow the path until this point are as follows. predicates = [z3.Not(zn < 0'''
