["http://www.fuzzysecurity.com/tutorials/expDev/16.html"]
title = "FuzzySecurity | Windows ExploitDev: Part 12"
full_description = "Hola, and welcome back to part 12 of the Windows exploit development tutorial series. Today we have another rapid-fire post on exploiting a null pointer dereference in @HackSysTeam's extreme vulnerable driver. For more details on setting up the debugging environment see part 10. Let's get to it! Resources: + HackSysExtremeVulnerableDriver (hacksysteam) - here + EMET - here + Small Hax to avoid crashing ur prog - here Ok, so we have a check on a magic value, if it succeeds we print the value and the callback function (this is normal execution flow). If the check fails we free the pool tag and null the pointer. Up to there there is no issue but then, in the vulnerable version, the driver simply calls the callback function without checking if it was previously nulled! The IOCTL for this function is 0x22202B. To see how the IOCTL can be identified, please check out part 10 and part 11 of this series. Let's quickly jump into IDA and have a look at the function. So, in theory, if we call the TriggerNullPointerDereference function and pass in the magic value we should execute the function in an expected manner and not trigger the null pointer dereference. We can test this out with the following POC. Perfect, no crash, no exception triggered. If the magic value does not match we enter a block where the callback function pointer is nulled. After this operation we jump to the next instruction block where the null pointer dereference is triggered. Ok, let's break on that call and verify our theory! All we need to do is pass the driver a magic value which will fail the comparison (eg: 0xdeadb33f). As expected, we trigger the null pointer dereference. You may have noticed from the C++ code above that there is a driver exception handler at work here. This is nice because be don't end up BSOD'ing the box! NtAllocateVirtualMemory The only real trick here is how to allocate a dword at 0x00000004. I strongly recommend that you have a quick look at this, most amusing and illuminating, post on rohitab."
