title = "FuzzySecurity | Tutorials: Arachni"
full_description = "Looking for an automated web vulnerability scanner? Arachni is without doubt the most awesome web application security framework and I highly suggest it to anyone (Let’s face it W3AF doen’t fit the start-and-take-a-nap profile and tools like websecurify are just bull!#*t). Why this isn’t included in backtrack kind of mystifies me. Anyway here is a quick guide to get it up and running. While this process is not really that difficult, it might be of use to someone… I should say installing Ruby and Ruby Gems is beyond the scope of this tutorial, if you still need to do this I suggest getting the latest stable release from http://www.ruby-lang.org/ and then install gems http://docs.rubygems.org/. However if you are performing this install on backtrack this shouldn't be necessary. (1) First things first, there are a ton of requirements and dependencies, so lets get those out of the way first (depending on your OS-build most will probably already be installed). (4) Verify which Ruby version is required for the latest release of Arachni (currently v1.9.2) - http://arachni.segfault.gr/latest. Thats it!! You’re ready to enjoy the fruits of your labor. I suggest you click here for the Arachni user-guide so you can get started. You have a choice between (1) command line interface and a (2) web user GUI (which is very pretty hehe). You can see some screenshots below..."
