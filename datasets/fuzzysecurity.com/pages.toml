["https://fuzzysecurity.com/scripts/1.html"]
title = "FuzzySecurity | Coding: Sh@d0w"
full_description = '''Ok this program does something pretty cool and simple but I haven’t seen this kind of script in the wild yet. Let’s say there are multiple clients on a local subnet; the Gateway identifies these clients by their unique MAC-address; once identified they are assigned an IP-address. Of course this assumes there is a DHCP-Server that hands out IP-addresses and that’s the way this script is designed (it can easily be modified for static IP assignment). So ask yourself what happens when there are two clients with the same MAC-address. The computer with the best optimized TCP/IP stack will be recognized as the “actual client". If you run this attack against a windows client (and since you’re running this script on a Linux distribution) your machine should be recognized as the “actual client" replacing the "victim". This procedure doesn’t always work, in my experience it works best when tested against an idle machine. Below I have pasted sample output of the program attacking a machine on my local network (the output isn't exactly displayed like in the terminal due to HTML formatting). Download: shadow.sh'''
