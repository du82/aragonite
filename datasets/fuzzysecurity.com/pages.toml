["https://fuzzysecurity.com/scripts/3.html"]
title = "FuzzySecurity | Coding: Fl@sh"
full_description = "We all know port scanning is the bread and butter of the enumeration faze. There is no denying that nmap sets the standard for port scanning on both windows and UNIX systems. However full range UDP and TCP port scans (65k ports) take a long time to finish. There is another scanner which excels at speed; unicornscan is an asynchronous stateless port scanner that implements its own TCP/IP stack. This script invokes unicornscan and passes the ports that are found to nmap and/or amap for further fingerprinting. I have built in two main port ranges into this script, unicornscan’s default port range and the full 65k port range. I would like to stress that the default packet speed for unicornscan is 300pps and I wouldn’t go higher than 400pps. After this is finished you have the option to search some keywords in the locally cached version of exploit-db on backtrack… EDIT: Version update from v1.5 to v1.6 to avoid an issue brought to light by scottm99. When you halt the script before it finishes some temporary files created by the script will not be removed hence resulting in erroneous port-lists (with duplicate entries or ports from a previous target). I added a cleanup routine at the beginning of the script to avoid this issue… Download: flash.sh"
