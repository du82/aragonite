["https://fuzzysecurity.com/scripts/9.html"]
title = "FuzzySecurity | Tools Of The Trade: ForwardHQ"
full_description = '''Let's face it, we all love pentesting infrastructure!! There is nothing more exiting than being routed into a corporate network and pop shells left, right and center. These networks often have complicated structures and restrictions which require serious network gymnastics to achieve what we want and get where we’re going. As time progresses I have come to develop my own post-exploitation/network migration methodology (as most pentesters do I guess). I want to share with you a tool-kit which is really useful to have on hand. For easy deployment these tools can be dropped in you local ftp server or webserver (many other ways exist of course). These tools are collected below in an archive and are up-to-date as of this post but I have included links to the various sources if you want to grab the latest versions. Download: ForwardHQ.rar Ncat is nmap's version of NetCat, it comes packaged with newer versions of nmap. The archive includes a standalone pre-compiled version of Ncat. Ncat is much improved over the original NetCat, it supports TCP, UDP, SSL and it can proxy connections via SOCKS4 and HTTP proxies. It also bears mentioning that Ncat has not made it into the virus signature databases unlike NetCat. This is a portable command line version of PUTTY for all your Windows SSH-Tunneling needs (totally irreplaceable). Traverse the network in seemingly impossible ways and surprise even yourself on occasion!! Do not underestimate Microsoft-Fu there are allot of tools included in the Sysinternals Suite (way to many to sum up here). These tools offer you powerful leverage on the localhost and network. I highly suggest you take time to investigate their various uses (I plan to dedicate a whole tutorial to Microsoft's psexec combined with WCE as I believe they are often poorly understood). Again we have the added bonus here that these tools are signed Microsoft binaries w00t! The archive includes the 32-bit version but 64-bit is also available. Windows Credential Editor is basically a post-exploitation tool to "steal" and reuse NTLM hashes, Kerberos tickets and plaintext passwords which can then be used to compromise other machines. Under certain circumstances, WCE can allow you to compromise the whole Windows domain after compromising only one server or workstation. WCE will get detected by AV but I have obfuscated it and so can you!'''
