description = "When a man has finished building his house, he finds that he has learnt unawares something which he ought absolutely to have known before he began. - Friedrich Nietzsche"
full_description = '''When a man has finished building his house, he finds that he has learnt unawares something which he ought absolutely to have known before he began. - Friedrich Nietzsche Home » Patreon When a man has finished building his house, he finds that he has learnt unawares something which he ought absolutely to have known before he began. - Friedrich Nietzsche When a man has finished building his house, he finds that he has learnt unawares something which he ought absolutely to have known before he began. - Friedrich Nietzsche I launched FuzzySecurity in 2011 and I have enjoyed every minute of it! Since starting my career in InfoSec I have also delivered hundreds of engagements and popped many shellzzz. I really enjoy the work I do and I think people in InfoSec are lucky in a way that they can do their hobby as a profession! Let's face it, how would we occupy our time if InfoSec wasn't a career path? Most of all though I like to give back to the community that has taught me so much over the years! I have been an assistant trainer at Black Hat USA and I have delivered workshops at DefCon, 44Con and various BSides events. Additionally I maintain this blog and a GitHub page where I publish research on a variety of topics. I also became one of the project owners for the PowerSploit post-exploitation framework where I mostly try to kill bugs ¯\_(ツ)_/¯! In September of 2017 I launched a Patreon page. Why you ask? I'm not here to take your hard earned $$'s, your support will help me do a lot of cool stuff/grab pieces of kit/research technical topics and drop POC's/tools! I will not go on this journey by myself, Patrons will have the opportunity to steer the direction of my research and we will organize some live workshops and QA sessions! If that is something you would be interested in, please check out my Patreon page! All patrons have the opportunity (if they want) to get a custom funky badge and have it displayed here as a shout-out from myself to show I really appreciate their support!'''
