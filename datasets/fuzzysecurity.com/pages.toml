["https://fuzzysecurity.com/tutorials/25.html"]
title = "FuzzySecurity | Windows Domains: Pivot & Profit"
full_description = '''Hola! In this write-up we will be looking at different ways to move laterally when compromising a Windows domain. This post is by no means exhaustive but it should cover some of the more basic techniques and thought processes. To keep things in perspective we will be following a mock objective on my local domain REDHOOK. Hopefully this will be the first in a series of posts centred around Windows domains, if you have something specific you would like to see (such as Kerberos tickets) don't hesitate to drop me an email, enjoy! Scenario: Our mission is to get usable credentials for the "redhook.DA" domain account. We are starting from a position where the attacker is already on the corporate network but not yet in the same subnet as the targeted domain controller. You can see a diagram of the setup below. Additionally we are going to assume the attacker has found a set of valid local Administrator credentials for Client 1. Typically, if the network is large enough, you will find valid credentials stored on a network share somewhere (batch, vbs, .NET, ps1, etc.), "dir /s", "findstr /SI" and Find-InterestingFile are your friends. Depending on how initial access was gained you may have a nice framework to work with like Cobalt Strike or you may be limited to natively available functionality on a corporate workstation. For this post the attacker is on a Kali box but I will explain some things you can do when you only have access to Windows. Lastly, in the post, we will not be dealing with SRP & AV evasion just keep that in the back of your mind because AV events = bad. Resources: + Active Directory Security (@PyroTek3) - here + harmj0y (@harmj0y) - here + Exploit-Monday (@mattifestation) - here + PowerView - here + PowerSploit - here + Impacket - here + Impacket compiled by maaaaz - here + Mimikatz - here + Incognito - here + Windows Credentials Editor - here + Sysinternals Suite - here As I mentioned earlier, we "found" user credentials for "Client 1" on a network share. Something like this comes to mind.'''
