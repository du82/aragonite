["https://fuzzysecurity.com/tutorials/5.html"]
title = "FuzzySecurity | Tutorials: Hackademic.RTB1"
full_description = "Hello and welcome. Today I’ll be writing another “Game Over” tutorial based on a pentesting VM called Hackademic (this tutorial will be for level 1 aka RTB1, I’m still on the fence about doing level 2). This is a pretty recent VM created by “mr.pr0n”, you can download RTB1 & RTB2 here… Let’s get to the good stuff, I’ll be using two VM’s: Attacker: Backtrack 5 => 192.168.111.129 Victim: Hackademic.RTB1 => 192.168.111.131 First we need to have a look at our attack surface, which is pretty limited (I should mention that I did a full UDP&TCP port scan with unicornscan even though the results are omitted here). So let’s see what we have… It’s not a whole lot of information but it gives us enough to get going with. After some poking and prodding I finally checked out the ”/readme.html”. This page contains a readme for the installed version of WordPress. I had no previous experience with WordPress so I got out my google-fu and started doing some general research (to discover it’s functionality and specifically searching for vulnerabilities). You can see a screenshot of the html page below, notice how helpful it is in telling us the exact version of WordPress ;))… To put it gently, there are many many WordPress vulnerabilities. So let’s just throw spaghetti at the wall and see what sticks hehe. After checking some of the parameters for SQL-injection I found that the “cat” parameter was vulnerable… This is a pretty good beginning and we can glean allot of information from this injection. What I’ll usually do in this kind of (academic) situation is dump the entire contents of the database; obviously I can’t reproduce it here. I encourage the diligent reader to play around with this injection as much as possible. What I’ll do below is show a top -> down overview of the Databases and Tables we will be using later on… As you can see this table is enormous, so let me break it down into what is actually useful. The dump below shows us some login information for users registered in the database (only MaxBucky passed our superficial hashcrack)…"
