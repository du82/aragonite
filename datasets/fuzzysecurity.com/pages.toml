title = "FuzzySecurity | Coding: MacMon"
full_description = "When I’ve done some wireless hacking in the past there were always a couple of things which I needed to do again and again. (1) Set wireless devices to monitor mode, (2) destroy/revert monitor interfaces and (3) use macchanger to fake the mac addresses of these various devices. In practice typing all these commands over and over is very tedious (especially if you want to use macchanger each time). This little script does all of that: (a) Monitor Mode + Random MAC, (b) Monitor Mode + Specific MAC, (c) Lookup vendor MAC-addresses, (d) Reverse lookup MAC-address to find the vendor. It should be noted that option (a) and (b) destroy all pre-existing monitor interfaces as part of the process. This script might be a bit rough round the edges but it does the job well enough :)) Download: macmon.sh"
