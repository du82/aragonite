["http://www.fuzzysecurity.com/tutorials/15.html"]
title = "FuzzySecurity | Python & Regex"
full_description = '''Today will be a gentile introduction to using regular expressions. One of the most important things you want to do when your working with text files is pull out specific pieces of information and store them in a way that you can work with later on. Regular expressions will help you pick out the pieces of data that you need and python will provide you with a structure to use that information in a programmatic fashion. Many people will tell you regular expressions are ph33r. It is true that regular expressions can be really dense in terms of how much though is put into them on a per character basis. However I think by starting with basic cases and working our way up no one should feel intimidated by regex. A couple of caveats: This is not an exhaustive guide to regex or python but it will give you an idea of the constructs and tools you have in hand to build on. We will start off in the interpreter because it gives us an interface where we can quickly run test-cases and get basic help for modules and functions that we want to use. First things first lets have a look at the interpreter, import re (which is the python module that gives access to regex) and have a look at getting basic help. Ok time to take our first steps with regular expressions. The first things we will look at are "." (dot) "\" and "r". To make our life more easy we will define a small function straight in the interpreter. At the end I will provide a python script which has all the test cases in it so you can review them. Definition: . (dot) – Matches any character except newline. \ (backslash) – Allows certain characters to be interpreted literally. r' ' - Prepending the pattern with "r" makes sure that it is interpreted literally. We don't really need to think about this to much, we will just add it to all our patterns. So far so good, time to throw some more regex into the mix. The next thing we will look at are "\w", "\d", "\s" and the "+" operator. Definition: \w – Matches any "word" character which is a bit misleading but it includes alphanumeric and underscore. \d – Matches any digit. \s & \S – \s matches white-space and \S matches any non whitespace character. + Operator - Appending "+" to a regex operator indicates one or more of that operator type (eg: \w+ will match word characters until it hits a non-word character).'''
