["https://fuzzysecurity.com/tutorials/24.html"]
title = "FuzzySecurity | Low-Level Windows API Access From PowerShell"
full_description = '''Hola, as I'm sure you know by now PowerShell, aka Microsoft's post-exploitation language, is pretty awesome! Extending PowerShell with C#\.NET means that you can do pretty much anything. Sometimes, native PowerShell functionality is not enough and low-level access to the Windows API is required. One example of this is the NetSessionEnum API which is used by tools such as NetSess and Veil-Powerview to remotely enumerate active sessions on domain machines. In this post we will look at a few examples that will hopefully get you going on scripting together you own Windows API calls! It should be noted that the examples below are using C# to define the Windows API structs. This is not optimal from an attackers perspective as the C# compilation will write temporary files to disk at runtime. However, using the .NET System.Reflection namespace adds some overhead to what we are trying to achieve. Once the basics have been understood, it is relatively easy to piggyback the great work done by Matt Graeber to get true in-memory residence. Resources: + Pinvoke - here + Use PowerShell to Interact with the Windows API: Part 1 - here + Use PowerShell to Interact with the Windows API: Part 2 - here + Use PowerShell to Interact with the Windows API: Part 3 - here + Accessing the Windows API in PowerShell via .NET methods and reflection - here + Deep Reflection: Defining Structs and Enums in PowerShell - here Download: + Invoke-CreateProcess.ps1 - here + Invoke-NetSessionEnum.ps1 - here Creating a message box is probably one of the most straight forward examples as the API call requires very little input. Make sure to check out the pinvoke entry for MessageBox to get a head-start on the structure definition and the MSDN entry to get a better understanding of the structure parameters. The C++ function structure from MSDN can be seen below. Obviously you can change the parameters you pass to the message box function, for example the message box type. Let's try something a bit more complicated, what if we wanted to call an exported function inside a dll. Basically we would need to perform the following steps.'''
