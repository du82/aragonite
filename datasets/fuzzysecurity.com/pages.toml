["http://www.fuzzysecurity.com/scripts/7.html"]
title = "FuzzySecurity | Coding: WACg"
full_description = 'I have always had a soft spot for wireless hacking mainly because (1) if it is successful it offers the attacker powerful leverage on the local network and (2) insecure networks allow bad people to do bad things anonymously. The black arts of wireless hacking are no longer a mystery to me but in general when doing wireless pentesting one of two things will happen. Either everything will be done manually (which is tedious) or some tool will be used to do everything automatically (but overspecialization breeds weakness). I feel that neither approach is optimal so I present you with WACg a semi-automatic tool which will save you valuable time while retaining the ability for manual intervention. Important: Make sure you have all the requirements installed, if you run this script on Backtrack you will need to install wash/reaver ("apt-get install reaver"). Download: WACg.sh'
