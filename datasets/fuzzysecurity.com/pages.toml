["http://www.fuzzysecurity.com/tutorials/expDev/22.html"]
title = "FuzzySecurity | Windows ExploitDev: Part 18"
full_description = "Hello and welcome back to another installment of the Windows Kernel exploitation series! It has been a while since my last post due to a lack of free time, I have however been putting out and refining a good amount of code in my PSKernel-Primitives repo so please keep an eye on that if you are interested in PowerShell Kernel pwn. Today we will be resurrecting our, much loved, Bitmap kernel primitive on Windows 10 RS2. We are skipping RS1 as I wrote a blogpost for @mwrlabs detailing how to bypass the new mitigations present in the anniversary edition here. We will go through two different techniques to leak Window objects from the desktop heap and then, using those objects, leak Bitmaps. I strongly recommend that you consult the resources below for more background information. Anyway, enough jibber jabber, let's get to it! Resources: + Win32k Dark Composition: Attacking the Shadow part of Graphic subsystem (Peng Qui & SheFang Zhong => 360Vulcan) - here + LPE vulnerabilities exploitation on Windows 10 Anniversary Update (Drozdov Yurii & Drozdova Liudmila) - here + Morten Schenk's tweet revealing the first technique :D (@Blomster81) - here + Abusing GDI for ring0 exploit primitives: reloaded (@NicoEconomou & Diego Juarez) - here + A Tale Of Bitmaps: Leaking GDI Objects Post Windows 10 Anniversary Edition (@FuzzySec) - here + PSKernel-Primitives (@FuzzySec) - here + Windows RS2 HmValidateHandle Write-What-Where (@FuzzySec) - here We would do well to briefly list the the mitigations Microsoft implemented to prevent Bitmap leaks and how these were bypassed for each iteration. The major build versions are used below for reference. Windows 10 v1511 + No mitigation in place at this point. + To leak, we grabbed a handle to the GdiSharedHandleTable from the PEB, performed a lookup to find the correct GDI_CELL struct and then read out the pKernelAddress which disclosed the Kernel address of the Bitmap SURFOBJ. Sample code can be found here. Windows 10 RS1 v1607 + Microsoft nulled the pKernelAddress in the GDI_CELL struct killing the old infoleak. + It was found that a number of objects, located in the same pool as our coveted Bitmap (paged pool), could be leaked. This was achieved by getting the address of gSharedInfo (global variable) from user32, reading out the address of the aheList HANDLEENTRY array, finding the correct array entry and finally reading out the phead element to get the kernel address of the object. Though we could not get the address of our bitmap directly, it was possible to craft/leak objects with a large size (ensuring the would end up in a low entropy large pool) and then perform a UAF style attack where the original object was free'd and the Bitmap allocated in it's place. Sample code can be found here. Windows 10 RS2 v1703 + Wouldn't you know it, Microsoft nulled the phead pointer killing the leak. + In this post we will discuss how we can use the user mapped Desktop heap to leak Window objects and, similar to what we did before, perform a UAF style attack to regain our Bitmap primitive!"
