["http://www.fuzzysecurity.com/tutorials/26.html"]
title = "FuzzySecurity | Game Over: CanYouPwnMe > Kevgir-1"
full_description = '''Hola! I had some time over the weekend and had a quick look at the Kevgir boot2root VM posted on VulnHub. This is a bullet point style write-up of some of the external/internal vulnerabilities on the VM. I'm confident there are vectors that I wont have covered but => [Δt - work]*0xc0ff33 is all I the time I could invest hehe. Enjoy! Resources: + CanYouPwnMe - here + Kevgir VulnHub - here Tomcat - Port 8080: Call me cynical but any time there is the vaguest mention of Tomcat I immediately think; default creds => war file. Not to far of the mark in this case! Browsing to 8080 presents us with the default install frontpage for Tomcat. Browsing to the admin panel results in a authentication popup, the credentials in this case are tomcat/tomcat. Nothing special here, we can just generate a payload with msfvenom. Running "jar tf" we can actually see the jsp inside. Joomla - Port 8081: Searching the version of Joomla in Google immediately reveals that it is vulnerable to CVE-2008-3681. This is an input validation issue in the password reset token field. As I understand, by putting a single quote in the token field there is some sort of confusion where Joomla matches it with the first enabled user in the database (most likely admin). As no further information is required we can immediately change the Admin's password for the Joomla instance. Getting access to a CMS pretty much = shell. Joomla runs on php so it's only a matter of finding a place to inject some php code. I chose to replace the "Milkyway" template through the template manager. For the payload I used "php-reverse-shell.php" which is in the webshells package on Kali but you can also generate something with msfvenom. The FTP folder for the admin user appears to be mapped to the user's home folder. Notice also that the server is poorly locked down allowing users to traverse the operating system essentially providing read/write access to any files the OS user account has access to. It occurred to me that the user is probably allowed to log in remotely and that the credentials are likely to be the same!'''
