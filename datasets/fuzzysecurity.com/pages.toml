["https://fuzzysecurity.com/tutorials/27.html"]
title = "FuzzySecurity | Anatomy of UAC Attacks"
full_description = "Hola, in this post we will look at the basic principals involved in UAC (User Account Control) bypass attacks. I will not go into to much detail on what Microsoft says UAC is or is not except here in the introduction. UAC, introduced with Windows Vista, enables Admin users to operate their Windows machine with standard user rights as opposed to Administrative rights. By default the initial user account on Windows is part of the Administrator group, this is simply a requirement. Because of this, back in the day (pre Vista era), developers had a tendency to assume users had local admin rights and often developed their applications carelessly to require elevated privileges. The official line is that UAC was introduced as a way to curb this behavior and to provide backwards compatibility. Be that as it may, a direct benefit of UAC is that it protects Admin users from, or alerts them to, malicious, elevated, actions performed by software components. Microsoft would not agree, but I think UAC is actually a very proficient security mechanism (if we forget about the prevalent dll side-loading issues!). Anyone who wants to argue this only needs to look at some advanced malware kit’s or exploitation frameworks such as Metasploit/Cobalt Strike, all of which include mechanisms to bypass UAC. Also, let’s not forget that Microsoft has patched a whole bunch of bypasses, eg using WUSA to extract CAB files to a specific path. It is a shame really that a solid side-loading fix can’t be implemented as doing so would greatly increase end-user safety. Anyway, UAC always sparks vigorous debate, so I won’t say any more on the subject. Let’s poke some holes is this “compatibility” feature! Resources: + Bypass-UAC (@FuzzySec) - here + UACME (@hFireF0X) - here + Bypassing Windows User Account Control (UAC) and ways of mitigation (@ParvezGHH) - here + “Fileless” UAC Bypass Using eventvwr.exe and Registry Hijacking (@enigma0x3) - here + Bypassing UAC on Windows 10 using Disk Cleanup (@enigma0x3) - here + Bypassing User Account Control (UAC) using TpmInit (@Cneelis) - here + Inside Windows 7 User Account Control (Microsoft Technet) - here + Inside Windows Vista User Account Control (Microsoft Technet) - here + User Account Control (MSDN) - here"
