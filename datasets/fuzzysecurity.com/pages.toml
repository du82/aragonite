["http://www.fuzzysecurity.com/tutorials/expDev/14.html"]
title = "FuzzySecurity | Windows ExploitDev: Part 10"
full_description = '''Hola, and welcome back to part 10 of this series, returning after 3+ years intermission! We will start our journey down to ring0 and gradually tackle new challenges as we face them! In this part we will look at a plain stack overflow in kernel space on Windows 7 (no SMEP & SMAP). Our target here is 32-bit but that does not put us at an advantage, with some minor changes the same exploit could be made to work on 64-bit. For our target driver we will use a most excellent project by @HackSysTeam, they have create a demo driver with a number of vulnerabilities built in to practise kernel exploitation, sw33t! Ok, let's get to it! Resources: + HackSysExtremeVulnerableDriver (hacksysteam) - here + Kernel Data Structures (CodeMachine) - here + x64 Kernel Privilege Escalation (McDermott) - here + Abusing GDI for ring0 exploit primitives (Core Security) - here + VirtualKD - here + Kernel debugging with IDA Pro, Windbg plugin and VirtualKd (hexblog) - here + OSR Driver Loader - here Just for this first part I want to briefly touch on the debugging environment as setting it up used to be painful. Specifically, this setup targets users with a Windows base (Yea, I know, deal with it!). First grab VirtualKD from the link above and once extracted install the target component in the VM you will be debugging. Once that is done start the vmmon binary on your base (x32/x64) and restart the VM in question. You should see something like this. If you configure the "Debugger path..", point it at WinDBG in your base and then select the VirtualKD boot option in the VM you should automatically attach to the machine. Easy & painless! That still leaves loading the vulnerable driver. To do this, grab the OSR driver loader from the link above (you will need to register -> disposable email). Start the OSR loader and register the service (you may need to reboot), after this is done, click browse, select the driver and click start service. If all goes well you should see something like this. If you are connected to the machine with WinDBG you can check that the driver was loaded successfully by using the "lm" command.'''
