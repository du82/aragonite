["http://www.fuzzysecurity.com/tutorials/28.html"]
title = "FuzzySecurity | Capcom Rootkit POC"
full_description = "Hola and welcome! Recently I was reading an article on the Derusbi malware. The focus of the post was on a technique used by the malware authors which leveraged a vulnerability (CVE-2013-3956) in a signed Novell driver to flip some bits in the kernel which temporarily disabled the driver signing requirement. Once disabled, Derusbi loaded a NDIS driver, presumably this allowed for transparent sniffing and transmission of raw packets (I have not looked into the specifics). Anyway, I was curious how difficult it would be to put together a POC with the same basic functionality (not very difficult as it turns out!). To fully simulate the attacker's scenario I decided to use a vulnerability in a signed driver, Capcom.sys, first disclosed by @TheWack0lian on 23 September 2016. Enough nonsense, let get to it! Resources: + Capcom-Rootkit (@FuzzySec) - here + Windows driver signing bypass by Derusbi - here + A quick insight into the Driver Signature Enforcement (@j00ru) - here + Defeating x64 Driver Signature Enforcement (@hFireF0X) - here The main goal of this post is not to analyse the driver bug. I highly recommend that you have a look at @TheColonial most excellent walkthrough's to get a better picture of the exploitation process. Essentially, the driver provides ring0 code execution as a service! It's only function is to take a user-land pointer, disable SMEP, execute code at the pointer address and re-enable SMEP. A disassembly of the offending function can be seen below. With the ability to execute arbitrary shellcode, I chose to stage a GDI bitmap primitive which would give me persistent read/write in the kernel without needing to call the driver over and over again. To create the bitmaps I used Stage-gSharedInfoBitmap and set up the shellcode in the following manner. Further details on this technique can be found in a post I wrote for @mwrlabs titled A Tale Of Bitmaps: Leaking GDI Objects Post Windows 10 Anniversary Edition and part 17 of my Windows exploit development tutorial series."
