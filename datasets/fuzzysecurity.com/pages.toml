title = "FuzzySecurity | Tutorials: Sulley on Windows"
full_description = '''Hello to all concerned. I recently started to play/work with Sulley and it has some really nice features which make it stand out from other fuzzers like Spike. The main benefits to using sulley are that (1) it doesn't require a third party debugger (pydbg), (2) if the program crashes it will record the data in a capture file for later analysis and (3) it will automatically restart the program and continue fuzzing. The really big issue I had with Sulley was the lack of proper installation instructions. There are allot of guides out there and non of them seem to paint the complete picture. That's why I decided to write this guide based on three tutorials I pieced together to help anyone out who wants to give it a go. This install guide is currently fully functional on my "Windows 7 32-bit" VM. We will first set up the windows path and include all the things we are going to install/need in this tutorial so we don't have to keep coming back to it later. Head over to the MinGW website here and download/install, make sure to check the box to install the c++ compiler. You need two packages. First head here to the WinPcap Download page and install. Then go here to get the WinPcap Developers Pack and extract the archive somewhere with easy access (we will need this later to install pcapy). Later we will need to do some compilation which will throw up an error about gcc not having a module called "mno-cygwin". This module has been depreciated since 2010 (I think). Browse to C:\Python27\Lib\distutils and edit "cygwinccompiler.py" with your favorite text editor. Press Ctrl-f to search for "-mno-cygwin" (there should be 5 instances), delete them and then save the file. Download the Pcapy zip here. When installing Pcapy we will need to use the WinPcap developers pack we downloaded earlier so take note of that directory (eg: C:\WpdPack412\....). Extract the archive browse to the folder in cmd and do the following: Download the Impacket zip here and extract the archive. Browse to the folder in cmd and do the following:'''
