["https://fws.gov/about"]
title = "About Us | U.S. Fish & Wildlife Service"
description = "One of the easiest ways that anyone can support bird habitat conservation is by buying duck stamps."
full_description = '''We are the U.S. Fish and Wildlife Service, the only agency in the federal government whose primary responsibility is the conservation and management of fish, wildlife, plants and their habitats for the American people.We offer a variety of opportunities to enjoy the outdoors and our shared natural heritage. And through our work to conserve natural resources, we provide communities with healthier environments, clean water, flood control and a strong economy. Achieving Our MissionLearn about our priorities, statutory authority and functions. Our Mission & VisionHistory of Fish and Wildlife Image DetailsThe U.S. Fish and Wildlife Service is a bureau within the U.S. Department of the Interior and the nation’s oldest conservation agency. Our origins date back to 1871 when Congress established the U.S. Fish Commission to study why the nation’s food fishes were decreasing and recommend ways to reverse that decline.Though the name of our agency has changed multiple times over the years, what endures is the collective dedication of Service employees to face the conservation challenges of their day—and now, our day—with ingenuity, integrity and hard work. Fortunately, our history shows that we’ve always been up to the challenge.Our HistoryOur Organization Our Staff Our Programs Our Regions Our Locations var fws_search_app_config = {"id":"visit_us_facilities","root":"default","app":{"appConfig":{"leftTitleText":"","doNotShowResults":true,"doNotReparentFiltersOnMobile":true},"top":[{"filter":"title","type":"typeAhead","config":{"label":"Select Facility"}},{"filter":"type","type":"selectMultiple"},{"filter":"state_name","type":"typeAhead","config":{"label":"State"}},{"filter":"geo_title","type":"map","config":{"banner":false,"uncluster":true}}],"serviceDefaults":{"$top":0,"$orderby":"search_api_relevance desc","view_mode":"search_result","print_view_mode":"print"}},"index":[{"filter":"activities","label":"Activity","datasource_id":"entity:node","property_path":"field_para_activity:entity:field_activity_term_reference:entity:name","type":"string","dependencies":{"config":["field.storage.node.field_para_activity","field.storage.paragraph.field_activity_term_reference"],"module":["paragraphs","taxonomy"]}},{"filter":"az_title","label":"AZ Title","datasource_id":"entity:node","property_path":"fws_search_alphabet__title","type":"string"},{"filter":"changed","label":"Changed","datasource_id":"entity:node","property_path":"changed","type":"date","dependencies":{"module":["node"]}},{"filter":"field_name","label":"Locations \u00bb Paragraph \u00bb Name","datasource_id":"entity:node","property_path":"field_location:entity:field_name","type":"solr_text_custom:ngram","dependencies":{"config":["field.storage.node.field_location","field.storage.paragraph.field_name"],"module":["paragraphs"]}},{"filter":"ft_title","label":"Text title","datasource_id":"entity:node","property_path":"title","type":"solr_text_custom:ngram","dependencies":{"module":["node"]}},{"filter":"geo_title","label":"Geo Title","datasource_id":"entity:node","property_path":"fws_facility_geotitles","type":"string"},{"filter":"latlon","label":"Locations \u00bb Paragraph \u00bb GeoData \u00bb LatLong Pair","datasource_id":"entity:node","property_path":"field_location:entity:field_geodata:latlon","type":"rpt","dependencies":{"config":["field.storage.node.field_location","field.storage.paragraph.field_geodata"],"module":["paragraphs"]}},{"filter":"program","label":"Program","datasource_id":"entity:node","property_path":"field_program:entity:title","type":"string","dependencies":{"config":["field.storage.node.field_program"],"module":["node"]}},{"filter":"state_name","label":"State","datasource_id":"entity:node","property_path":"field_state:entity:name","type":"string","dependencies":{"config":["field.storage.node.field_state"],"module":["taxonomy"]}},{"filter":"title","label":"Title","datasource_id":"entity:node","property_path":"title","type":"string","dependencies":{"module":["node"]}},{"filter":"type","label":"Facility Type","datasource_id":"entity:node","property_path":"field_facility_type:entity:name","type":"string","dependencies":{"config":["field.storage.node.field_facility_type"],"module":["taxonomy"]}}]}; Latest Stories Working Lands Family grazes sheep sustainably in WisconsinWe care about working lands and the people who work them. For Jeremie Favre and Ellen Geisler, their farm is everything. “It’s our heartbeat,” Favre shares. The Laxey Sheep Ranch is a thriving example of sustainable farming in southwestern Wisconsin that prioritizes both the productivity of their...Feb 27, 2025 .a,.b{fill:#fff;}.b{stroke:#000;stroke-miterlimit:10;} Recreation Unforgettable HuntingNational wildlife refuges offer several unforgettable hunting opportunities that many outdoorsmen and women would consider the experience of a lifetime. Here are just a few.Jan 22, 2025 .a,.b{fill:#fff;}.b{stroke:#000;stroke-miterlimit:10;} Recreation Gone FishingMore than 340 national wildlife refuges offer fishing. Learn about a handful of our favorite refuge fishing spots from those who know them best.Jan 22, 2025 Science and Technology Returning turtles to the wildWe're working with state, nonprofit and academic partners to get poached native turtles back home. It can be a years-long process that relies on informed emergency response, sound long-term care and careful consideration of the risk to local populations.Jan 23, 2025 Wildlife Management Over $1.3 Billion to Support Fish and Wildlife Conservation and Outdoor AccessThe U.S. Fish and Wildlife Service today announced over $1.3 billion in apportionments to support states, commonwealths and territories in their efforts to fund conservation and connect people with nature. This critical funding is generated by manufacturers who paid federal excise taxes last year...Jan 15, 2025 Habitat Restoration More Than $25 Million To Protect and Restore Coastal Wetlands and Build Coastal ResiliencyToday, the U.S. Fish and Wildlife Service is awarding $25.7 million to support 28 projects in 11 coastal states to protect, restore or enhance over 10,000 acres of coastal wetlands and adjacent upland habitats and more than eight miles of streams and shoreline under the National Coastal Wetlands...Jan 7, 2025View All StoriesYou may also want to... Image DetailsSee Where Your Tax Dollars Go Each year, the U.S. Fish and Wildlife Service develops an annual budget justification which defines our goals, objectives, and the funding necessary to accomplish them. Once approved, funds are allocated to programs and regions, and monitored to ensure those funds are used as mandated by Congress.View Our Budget Image DetailsDo Business With UsThe mission of the U. S. Fish and Wildlife Service (FWS) is to work with others to conserve, protect, and enhance fish, wildlife, and plants and their habitats for the continuing benefit of the American people. In support of the mission, the FWS procures goods and services that include: land rehabilitation; information technology resources; construction projects; professional and nonprofessional services; supplies; and environmental studies. We look forward to working with qualified, capable contractors, including small businesses.Learn About Contracting Image DetailsWork With UsThe range of career options available in the U.S. Fish and Wildlife Service is as wide as it is rewarding. A career with us might be just what you’re looking for if you’re passionate about supporting our mission and science, water quality, nature, air quality, fish, birds, mammals, reptiles, amphibians, native plants, or education. You can make a difference by bringing your unique experience, background, and perspective to our work. Browse Current Job Opportunities'''
