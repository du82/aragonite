full_description = "Have a Question? Our customer call center fields thousands of questions every month. Check our FAQ and you may find your question, too.If you have questions for a particular national wildlife refuge national wildlife refuge A national wildlife refuge is typically a contiguous area of land and water managed by the U.S. Fish and Wildlife Service for the conservation and, where appropriate, restoration of fish, wildlife and plant resources and their habitats for the benefit of present and future generations of Americans. Learn more about national wildlife refuge or other facility, be sure to check the contact information on their site first. Find a facility Call us at 1-800-344-WILD (1-800-344-9453) or fill out the form below. Send Us A MessageFill out the form below to send a message.If you would like a response, please provide your name and email address. If you are a minor, please get your parent’s or guardian’s help to contact us. Your ​​name​ Your email address? Subject Message CAPTCHA This question is for testing whether or not you are a human visitor and to prevent automated spam submissions. Send MessageFor more on what we do with information you provide and how we protect your privacy, see our privacy statement.Cancel Or Contact Us by MailMailing AddressU.S. Fish and Wildlife Service1849 C Street, NWWashington, DC 20240Contact1-800-344-WILD (1-800-344-9453)Monday - Friday 8AM - 8PM Eastern Find a FacilityDid you know we manage hundreds of facilities across the country including National Wildlife Refuges, National Fish Hatcheries and education centers? Use the Find a Facility button below to search for a Service facility to contact them and get more information.Find a Facility You may also want to...You may be interested in learning more about the services FWS offers or the resource materials available in our library. Image DetailsFind Our ServicesAre you wanting to purchase a Duck Stamp or apply for a permit? We offer many services to the public, businesses and local governments. From applying for grants to finding an internship, we are here to help.View Our Services Image DetailsFind Items in Our LibraryThe FWS Library gathers together thousands of resources, maps, images, videos, podcasts, journals and more, all into one searchable library. See what is available in the FWS Library.View Our Library"
