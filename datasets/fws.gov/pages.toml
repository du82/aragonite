["https://fws.gov"]
title = "U.S. Fish and Wildlife Service"
description = "United States federal agency that manages national wildlife refuges, protects endangered species, manages migratory birds, restores nationally significant fisheries, and enforces federal wildlife laws."
full_description = "Working with others to conserve, protect, and enhance fish, wildlife, plants, and their habitats for the continuing benefit of the American people.What's going on at FWS With more than 560 National Wildlife Refuges, 70 national fish hatcheries, numerous regional and field offices across the country and thousands of active conservation projects, the nearly 8,000 employees of the U.S. Fish & Wildlife Service have a lot going on. Here are a few of the latest news stories from across the Service... Working Lands Family grazes sheep sustainably in WisconsinWe care about working lands and the people who work them. For Jeremie Favre and Ellen Geisler, their farm is everything. “It’s our heartbeat,” Favre shares. The Laxey Sheep Ranch is a thriving example of sustainable farming in southwestern Wisconsin that prioritizes both the productivity of their...Feb 27, 2025 .a,.b{fill:#fff;}.b{stroke:#000;stroke-miterlimit:10;} Recreation Unforgettable HuntingNational wildlife refuges offer several unforgettable hunting opportunities that many outdoorsmen and women would consider the experience of a lifetime. Here are just a few.Jan 22, 2025 .a,.b{fill:#fff;}.b{stroke:#000;stroke-miterlimit:10;} Recreation Gone FishingMore than 340 national wildlife refuges offer fishing. Learn about a handful of our favorite refuge fishing spots from those who know them best.Jan 22, 2025 Science and Technology Returning turtles to the wildWe're working with state, nonprofit and academic partners to get poached native turtles back home. It can be a years-long process that relies on informed emergency response, sound long-term care and careful consideration of the risk to local populations.Jan 23, 2025 Wildlife Management Over $1.3 Billion to Support Fish and Wildlife Conservation and Outdoor AccessThe U.S. Fish and Wildlife Service today announced over $1.3 billion in apportionments to support states, commonwealths and territories in their efforts to fund conservation and connect people with nature. This critical funding is generated by manufacturers who paid federal excise taxes last year...Jan 15, 2025 Habitat Restoration More Than $25 Million To Protect and Restore Coastal Wetlands and Build Coastal ResiliencyToday, the U.S. Fish and Wildlife Service is awarding $25.7 million to support 28 projects in 11 coastal states to protect, restore or enhance over 10,000 acres of coastal wetlands and adjacent upland habitats and more than eight miles of streams and shoreline under the National Coastal Wetlands...Jan 7, 2025View All StoriesOur Focus The history of the U.S. Fish and Wildlife Service can be traced back to 1871. We are the only federal government agency whose primary responsibility is to manage fish and wildlife resources in the public trust for people today and future generations. Here are just a few of our focus areas... Pollinators National Wildlife Refuges Protecting Wildlife Climate Change National Fish Hatchery Systems Law Enforcement What We Do For You If you’re looking for places to experience nature; interested in partnering with us; seeking technical advice, permits, grants, data or scientific research; want to know more about today’s conservation challenges; looking for ways on how you can get involved and make a difference -- the Service has a lot to offer and more… Our Services Partnerships Volunteering Education Programs Visit Us - Our Locations With more than 560 national wildlife refuges, dozens of national fish hatcheries and more than 100 field offices, there are numerous great U.S. Fish and Wildlife Service locations to visit. Image DetailsFeatured LocationWichita Mountains Wildlife Refuge Indiahoma, OKLearn MoreFeatured LocationRidgefield National Wildlife Refuge Ridgefield, WALearn MoreFeatured LocationJackson National Fish Hatchery Jackson, WYLearn MoreFeatured LocationMississippi Sandhill Crane National Wildlife Refuge Gautier, MSLearn More"
