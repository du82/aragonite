title = "Jackson National Fish Hatchery | U.S. Fish & Wildlife Service"
description = "Jackson National Fish Hatchery is located in the beautiful valley of Jackson Hole with the majestic Teton mountains nearby. Founded in 1950, the hatchery raises native cutthroat trout for federal, state and Tribal partners."
full_description = 'Jackson National Fish Hatchery is located in the beautiful valley of Jackson Hole with the majestic Teton mountains nearby. Founded in 1950, the hatchery raises native cutthroat trout for federal, state and Tribal partners.Visit Us Image DetailsJackson National Fish Hatchery provides many exciting visitor opportunities. Located 3.5 miles north of Jackson on Highway 89, the hatchery is open daily for a close-up view of the fish production process. Every year nearly 10,000 people visit the hatchery to observe fish in several indoor tanks and view photographic displays of spawning and stocking activities. During summer months the outdoor raceways are full of fish.Learn More About VisitingLocation and Contact Information var fws_locations_map_config = {"org_code":"61240","locations":[{"id":"2311","name":"Jackson National Fish Hatchery","geodata":{"value":"POINT (-110.73296 43.53716)","geo_type":"Point","lat":43.53716,"lon":-110.73296000000001,"left":-110.73296000000001,"top":43.53716,"right":-110.73296000000001,"bottom":43.53716,"geohash":"9x9r8jwwr4","latlon":"43.53716,-110.73296"},"summary":"<div class=\"paragraph paragraph--type--location paragraph--view-mode--summary\"> <div class=\"layout layout--onecol\"> <div class=\"layout__region layout__region--content\"> <section class=\"block block-layout-builder block-field-blockparagraphlocationfield-phone-number clearfix\"> <div class=\"block-container\"> <div class=\"field field--name-field-phone-number field--type-telephone field--label-hidden field--item\"><a href=\"tel:+1-307-733-2510\">(307) 733-2510<\/a><\/div> <\/div>\n<\/section> <section class=\"block block-layout-builder block-field-blockparagraphlocationfield-address clearfix\"> <div class=\"block-container\"> <div class=\"field field--name-field-address field--type-address field--label-hidden field--item\"> <div class=\"form-group\"><span class=\"address-display-element address-line1-element\">1500 Fish Hatchery Road<\/span>\n<span class=\"address-display-element locality-element\">Jackson,<\/span>\n<span class=\"address-display-element administrative-area-element\">WY<\/span>\n<span class=\"address-display-element postal-code-element\">83001-9805<\/span>\n<\/div> <\/div> <\/div>\n<\/section> <\/div> <\/div> <\/div>","main":true,"url":"\/fish-hatchery\/jackson\/visit-us\/locations\/jackson-national-fish-hatchery"}],"boundary":{"type":"Feature","geometry":{"type":"Polygon","coordinates":[[[-110.73219817456,43.530938295356997],[-110.73219817456,43.537767221635001],[-110.73935592242,43.537767221635001],[-110.73935592242,43.530938295356997],[-110.73219817456,43.530938295356997]]]}}}; About Us Jackson National Fish Hatchery was originally established in 1950 as part of the Palisades Dam Act to improve fish populations along the headwaters of the Snake River. The current emphasis is producing native Snake River cutthroat trout for Federal water development projects in Wyoming and Idaho, and providing recreational fish to the Wind River Reservation. Learn More About Us View Our ToursWhat We Do Jackson National Fish Hatchery produces native cutthroat trout for federal and Tribal waters in Wyoming and Idaho. These trout help to restore fish populations, encourage sustainable fish populations and provide angling opportunities for recreational users like you. As a result of the Jackson National Fish Hatchery propagation program, economic benefits weigh-in at over 50,000 angler days of recreational fishing valued at over $5 million.More About What We DoOur Organization Fish and Aquatic ConservationThe Fish and Aquatic Conservation programs work together to deliver resilient habitats, healthy fish, connected people, and strong partnerships. From habitat restoration to aquatic invasive species prevention, captive breeding to population assessment and monitoring, our programs are driven by the...ProgramFalls Church,VA National Fish Hatchery SystemThe National Fish Hatchery System raises millions of fish and aquatic wildlife to improve sustainable recreational fishing, support fisheries that have been impacted by a federal dam, recover federally listed threatened or endangered species, fulfill our Tribal Trust responsibilities, and prevent...ProgramOur Species Image DetailsView Our Species View More Opportunities View All Projects'
