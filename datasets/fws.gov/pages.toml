title = "FWS Leadership | U.S. Fish & Wildlife Service"
description = "One of the easiest ways that anyone can support bird habitat conservation is by buying duck stamps."
full_description = "Stephen D. GuertinDeputy Director for Program Management and Policy Contact+1800-344-9453Washington,DC Stephen D. GuertinDeputy Director for Program Management and Policy Contact+1800-344-9453Washington,DC About Us About Us Mission & Vision FWS Leadership Directorate Our Organization Our Facilities Regions Our organization, powered by more than 8,000 employees and volunteers, is spread across the country, from Guam to Georgia, Alaska to Puerto Rico. You can also find us helping ensure the future of wildlife throughout the world. We are organized into thematic programs and geographical regions, overseen by a senior management team of regional and program heads coordinated and guided by our Director. The Director, appointed by the President and confirmed by the Senate, is charged with managing longstanding organizational responsibilities and furthering the White House's priorities.Our Leadership DirectorVacant Deputy Directors Stephen D. GuertinDeputy Director for Program Management and Policy Contact+1800-344-9453Washington,DC Gary FrazerDeputy Director for OperationsFull leadership team Join Us Image DetailsAre you looking for something different than a volunteer opportunity? We employ around 9,000 people nation-wide and offer great internship opportunities every year.Careers at FWSInternships at FWSCareers and Internships"
