["https://fws.gov/about/programs"]
title = "Our Organization | U.S. Fish & Wildlife Service"
description = "One of the easiest ways that anyone can support bird habitat conservation is by buying duck stamps."
full_description = "Aviation The U.S. Fish and Wildlife Service’s Branch of Aviation Management is responsible for the safety and oversight of the U.S. Fish and Wildlife Service’s fleet of planes and pilots. Budget Each year, the U.S. Fish and Wildlife Service develops an annual budget justification which defines our goals, objectives, and the funding necessary to accomplish them. Once approved, funds are allocated to programs and regions, and monitored to ensure those funds are used as mandated by Congress. Center for Pollinator Conservation The Center for Pollinator Conservation promotes working together to address declining pollinator populations in America. This national center is a place for land managers, decision and policy makers, scientists, program leaders and others to explore, coordinate and share best practices and approaches. We work collaboratively with partners to implement conservation that benefits pollinator species. Congressional and Legislative Affairs The Division of Congressional and Legislative Affairs is the liaison between the U.S. Fish and Wildlife Service and Congress. The Division is responsible for ensuring effective and appropriate communications between Congress and the Service, and for implementing the Service’s legislative agenda through clearance of testimony, outreach initiatives, and legislative proposals. Conservation Planning and Policy The National Wildlife Refuge System is the nation’s largest collection of public lands and waters conserved for fish and wildlife. Planning is essential to ensure that the Refuge System meets this conservation commitment. Ecological Services The Ecological Services Program works to restore and protect healthy populations of fish, wildlife, and plants and the environments upon which they depend. Using the best available science, we work with federal, state, Tribal, local, and non-profit stakeholders, as well as private land owners, to avoid, minimize, and mitigate threats to our nation's natural resources. Endangered Species We provide national leadership in the recovery and conservation of our nation's imperiled plant and animal species, working with experts in the scientific community to identify species on the verge of extinction and to build the road to recovery to bring them back. We work with a range of public and private partners to protect important habitat, and increase species' populations and reduce the threats to their survival so that they can be removed from federal protection."
