["https://fws.gov/about/mission-and-vision"]
title = "Mission and Vision | U.S. Fish & Wildlife Service"
description = "One of the easiest ways that anyone can support bird habitat conservation is by buying duck stamps."
full_description = "About Us About Us Mission & Vision FWS Leadership Our Organization Our Facilities Regions Our Mission Image DetailsThe mission of the U.S. Fish and Wildlife Service is working with others to conserve, protect, and enhance fish, wildlife, plants, and their habitats for the continuing benefit of the American people.Our PurposeTo protect the natural world so current and future generations can live with, live from, and find awe in lands, waters, and wildlifeOur VisionWe envision a future where people and nature thrive in an interconnected way and where every community feels part of and committed to the natural world around us. Our Statutory Authority and Functions Image DetailsThe U.S. Fish and Wildlife Service, working with others, is responsible for conserving, protecting, and enhancing fish and wildlife and their habitats for the continuing benefit of the American people through Federal programs relating to migratory birds, endangered species, interjurisdictional fish and marine mammals, and inland sport fisheries.Acquires, protects and manages unique ecosystems necessary to sustain fish and wildlife such as migratory birds, resident species and endangered species.Operates a National Fish Hatchery System in support of the restoration of depleted interjurisdictional fish stocks, the recovery of federally listed threatened and endangered species, and the fulfillment of Federal mitigation responsibilities.Provides protection of fish and wildlife from dislocation or destruction of their habitats, overuse, and industrial, agricultural and domestic pollutants.Renders financial and professional technical assistance to States through Federal Aid programs for the enhancement and restoration of fish and wildlife resources.Conducts programs of enforcement, management and professional technical assistance to other agencies for the protection of endangered species.Promulgates and enforces regulations for the protection of migratory birds, marine mammals, fish and other nonendangered wildlife from illegal taking, transportation or sale within the United States or from foreign countries.Conducts programs of planning, evaluation, and professional technical assistance to other agencies for the proper use and protection of fish and wildlife habitat that directly benefit the living natural resource and add quality to human life.Conducts programs of interpretation, education and recreation to foster a stewardship ethic in the American public through high quality fish and wildlife oriented experiences.Communicates information essential for public awareness and understanding of the importance of fish and wildlife resources, and interprets fish and wildlife changes reflecting environmental degradation that ultimately will affect the welfare of human beings.Laws, Agreements, and Treaties Image DetailsAs part of our mission, we are charged with enforcing Federal Wildlife Laws and Protecting Endangered Species. Learn more about the U.S. Conservation Laws, Acts, Treaties, Conventions and AgreementsLaws, Agreements, and Treaties"
