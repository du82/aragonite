title = "Fylgja Components Overview - Fylgja"
description = "Browser all of what Fylgja has to offer in CSS components and add-ons"
full_description = "Fylgja Components OverviewBrowser all of what Fylgja has to offer in CSS components and add-onsFeaturedOur recommended componentsFormThe form component is super easy to use, it's a zero config module that styles all form elements directly. Allowing you to focus on the form itself.Auto GridA super small grid with auto flowing behavior, based on the container size. Using a similar method to container queries.DialogThe dialog combines 3 components in 1, it a modal by default, and with a small change it's a offcanvas, notification popup aka the snackbar.TokensA collection of all Fylgja tokens offered for specific design tools or frameworks.UtilpackBuild and use your own CSS utility classes with Sass using the Fylgja utilpack.Alpine DialogBring the power of AlpineJs to the HTML dialog.Native ElementsFylgja Components that require no additional CSS classes to workBaseCommon defaults to make your body and typography look good and easy to change to your needs.ControlThe control component styles the default `input[radio]` and `input[checkbox]`, allowing an easier control on the style of both these elements.FormThe form component is super easy to use, it's a zero config module that styles all form elements directly. Allowing you to focus on the form itself.DialogThe dialog combines 3 components in 1, it a modal by default, and with a small change it's a offcanvas, notification popup aka the snackbar.CodeThe Code component is a extension component on the base component.DetailsThe details component enhances the default details behavior.ProgressThe progress component is used to show progress indication in a form or somethings else.RangeRange component will add solid foundation for a input range sliderTableThe table component is super easy to use, since it is a zero config module that styles the table directly. Allowing you to focus on the table it self.CSS UtilitiesFylgja Utilities that make it easier to apply styles and spacing, using CSS classes directly in your HTMLUtilpackBuild and use your own CSS utility classes with Sass using the Fylgja utilpack.Aria-onlyThe aria-only (a.k.a. sr-only) visually hides elements. But keeps it accessible to screen-readers and other aria tools.GradientAdd gradient's with ease via the gradient utility class.HashlinkThe Hashlink is a small utility component, which adds smooth scrolling to the page via CSS and a scroll offset to any element with a id.ScrollbarCustomize or hide the scrollbar with ease.Stretched-linkMake any component fully clickable via a nested link.TransformAdd transforms with ease, with the power of CSS variables.TransitionAdd transitions with ease, with the power of CSS variables.CSS Props (Design Tokens)Fylgja Props (Design Tokens) that make it easier to apply styles and spacing, using CSS variablesTokensA collection of all Fylgja tokens offered for specific design tools or frameworks.ColorsAdd a collection of prebuild colors to any project with ease, using Fylgja Colors.FontsThe Fylgja fonts offers Design Tokens (CSS props) for consistent and semantic typography.BordersThe Fylgja borders offers Design Tokens (CSS props) for consistent and semantic borders.EasingThe Fylgja easing offers Design Tokens (CSS props) for consistent and semantic transitions.MqHelper component for adding media query specific variables to multiple components.ShadowThe Fylgja shadow offers Design Tokens (CSS props) for consistent and semantic shadows.SizesThe Fylgja Sizes offers Design Tokens (CSS props) for consistent and semantic sizes, in typography, spacing and general sizes.Z LayerThe Fylgja z-layer offers Design Tokens (CSS props) for consistent and semantic z-indexing.ElevationThe Elevation component is a util package for shadows, where it offers shadows as CSS variables.LayoutsFylgja Components that make it easier to apply layout stylesAuto GridA super small grid with auto flowing behavior, based on the container size. Using a similar method to container queries.Aspect RatioThe aspect ratio component is used to set videos to a certain responsive aspect ratio, but can also be used for images and other content.CardThe card component is a wrapper component. It allows you to make visual sectioned content, that is not part of the main flow.ContainerThe container component is wrapper component, to make all child elements fit better in the page.Input-groupThe input group extends upon the `@fylgja/form`. By providing a wrapper that allows for more complex form field styles.MarqueeThe marquee component lets you make infinite CSS sliders without any JavaScriptScroll-sliderThis CSS slider component allows you to make sliders with ease, and has no requirements to any Javascript.SectionThe Section component is a wrapper component to show content in a sectioned area.Flex GridCreate a complete grid using flexbox, and only set the columns you need.NavigationFylgja Components that make it easier to apply navigation stylesBreadcrumbsThe breadcrumbs component is a navigational aid, it allows users to maintain awareness of their location in an app or a website.ButtonThe Button component serves as an interactive element. To call your users to an action.MenuThe menu component makes it easy to build common navigation patterns, like a navbar or menu in a dropdown.PaginationThe pagination component makes it easy to build many pagination patterns, like button only next previous nav or dots nav.Skip LinkThe aria-only (a.k.a. sr-only) visually hides elements. But keeps it accessible to screen-readers and other aria tools.TypographyFylgja Components that make it easier to apply typography stylesBaseCommon defaults to make your body and typography look good and easy to change to your needs.CodeThe Code component is a extension component on the base component.DetailsThe details component enhances the default details behavior.ListThe list component adds more control on how you can style lists. By adding a custom marker option with full flexibility to style and animate.PrintPrint component will add solid foundation for printing.TableThe table component is super easy to use, since it is a zero config module that styles the table directly. Allowing you to focus on the table it self.Font FaceAdd fonts with ease, via the font-face mixinFormsFylgja Components that make it easier to apply form stylesControlThe control component styles the default `input[radio]` and `input[checkbox]`, allowing an easier control on the style of both these elements.FormThe form component is super easy to use, it's a zero config module that styles all form elements directly. Allowing you to focus on the form itself.Input-groupThe input group extends upon the `@fylgja/form`. By providing a wrapper that allows for more complex form field styles.ProgressThe progress component is used to show progress indication in a form or somethings else.RangeRange component will add solid foundation for a input range sliderElementsFylgja components that make it easier to apply element specific stylesAvatarThe avatar component allows you to make an avatar style with ease.BadgeThe badges component serves as a small blocks to indicate notifications, or to highlight an item.ControlThe control component styles the default `input[radio]` and `input[checkbox]`, allowing an easier control on the style of both these elements.DialogThe dialog combines 3 components in 1, it a modal by default, and with a small change it's a offcanvas, notification popup aka the snackbar.ButtonThe Button component serves as an interactive element. To call your users to an action.CardThe card component is a wrapper component. It allows you to make visual sectioned content, that is not part of the main flow.ProgressThe progress component is used to show progress indication in a form or somethings else.Add-ons and HelpersFylgja Plugins that improve or add extra functionality to Fylgja and/or other toolsTokensA collection of all Fylgja tokens offered for specific design tools or frameworks.Alpine DialogBring the power of AlpineJs to the HTML dialog.Props BuilderBuild your own CSS props a.k.a Design Tokens, with ease.Sass ExtendAdds more SCSS super power functions.ThemeHelper component for adding theme specific SCSS variables to multiple components.Stylelint ConfigA sharable stylelint config object that enforces Fylgja's CSS rules.Flex GridCreate a complete grid using flexbox, and only set the columns you need."
