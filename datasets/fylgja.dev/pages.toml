["https://fylgja.dev/about"]
title = "About us - Fylgja"
description = "About Fylgja and how it was created"
full_description = "About usFylgja is created by Sean van Zuidam (@GrimLink), with help from Ruud van Zuidam (@Allrude).Fylgja makes it easier to start with a front-end, using common block styles.So you don't have to repeat them in every project, giving you a good default to start with.BackstoryThe original version of Fylgja, (that was never released), was build as an utility pack for Bootstrap 2 & 3. This version was purely to add specific flex features to the grid, made it easier to add button styles, and added the spacer utility class that's now know as .mb-4Later versions moved to the SCSS syntax and started to add own blocks, slowly growing and converting that what started as a simple extension for Bootstrap, to a complete CSS framework.The initial release candidates looked like most CSS frameworks, with some early and easier variables and mixins.But we quickly concluded this was the wrong direction for Fylgja. We wanted Fylgja to be more modular, so plug and play had to be first and style had to be second.This triggered the first off many complete rebuilds 😅The framework grew and profited from changing insights and we learn from other pioneers and CSS Hero's.But also from using it in many projects, like e-commerce projects in Magento 1 and Magento 2, CMS projects like Wordpress and Joomla! and Headless projects with Javascript frameworks as React and Vue.Slowing growing to the CSS Framework you see here.InspirationsFylgja is not made out of thin air, it has many inspirations and we learned a lot on do's and don't from other CSS frameworks, and the dev's from Google and Mozilla.So a little shout out to;Bootstrap for always being a great tool. It has its own little modularity flaws, but it did kick start the Fylgja project.Bulma and Material Components On how to do modularity with SCSS and CSS properly.TailwindCSS on how to do Utility classes and most importantly! How to not do Utility classesOpen Props on how to provide a comprehensive set of CSS Design TokensDead but not forgoten, for what awesome stuff they did;Native Elements for showing how you can do nice looking Native Elements without losing any freedom on personal styleIota grid showed how you can create a fully customizable CSS grid with only a small CSS footprint, inspired some option in the @fylgja/flex-gridAlso a little shout out to Mooore Digital for assisting this project and utilizing it in their own work."
