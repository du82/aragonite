["https://fylgja.dev"]
title = "Fylgja"
description = "Fylgja is your CSS front-end framework for building your own websites or webapps using modular and customizable CSS components, by loading only what you need."
full_description = '''Get StartedGuidesComponentsTry in browser The modular highly customizable CSS framework.Get started View all ComponentsOr explore the full range of Fylgja's Components → SCSS@use "@fylgja/theme" with ( $color-theme: #1565c0, $color-on-theme: #fff ); @use "@fylgja/button"; @use "@fylgja/form"; @use "@fylgja/control"; @use "@fylgja/auto-grid"; @use "@fylgja/utilpack"; PostCSS Import:root { --color-theme: #1565c0; --color-on-theme: #fff; } @import "@fylgja/button"; @import "@fylgja/form"; @import "@fylgja/control"; @import "@fylgja/auto-grid"; @import "@fylgja/utilpack";The experiences you get from using FylgjaFylgja is a highly flexible CSS framework that brings together the best features from other frameworks.With Fylgja, you have the option to use it as is or customize it to fit your unique needs with your own CSS.Whether you're looking to enhance your current stack or build a new project from scratch,Fylgja is the ideal solution.Modularity firstFylgja is build with modularity in mind, import only what you need.No extra tools required.Add your own style, with easeUse Fylgja as a solid basis to build your own styles with minimal effort, thanks to SCSS and/or CSS VariablesRTL out of the boxFylgja is made with writing direction in mind, so it works with Languages that use a different direction than LTRWeb Accessibility in mindEach Fylgja component is built with accessibility in mind, and Encourages the use of the right HTML syntaxEasy to start with design tokensFylgja offers a comprehensive set of design tokens,also known as CSS props, available through Javascript, SCSS, and CSSEmpower Your Designs with CSS UtilitiesFylgja streamlines design with CSS utilities, easy experimentation, no awkward modifiers, and RTL readyOur Featured CSS ComponentsOur Featured CSS Components, that really show the full potential of what each Fylgja Component can do.FormThe form component is super easy to use, it's a zero config module that styles all form elements directly. Allowing you to focus on the form itself.Auto GridA super small grid with auto flowing behavior, based on the container size. Using a similar method to container queries.DialogThe dialog combines 3 components in 1, it a modal by default, and with a small change it's a offcanvas, notification popup aka the snackbar.TokensA collection of all Fylgja tokens offered for specific design tools or frameworks.Want to explore what Fylgja has the offer, checkout the Components pageBrowse all Fylgja ComponentsGet involved onGitHub DiscussionsQuestions or Supportask them in the community.MastodonFollow the Fylgja Mastodon accountfor news and updates.TwitterFollow the Fylgja Twitter accountfor news and updates.'''
