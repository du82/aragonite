["https://www.fysnet.net/blog/2015/03"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "I haven't had time to do much here on this blog lately, but should be able to get back to it soon. I just wanted to put a shout-out to my web page provider iPage. They have done very well, providing many different features, statistics, as well as WordPress and many other features and utilities. If you are looking for a reliable, fully featured web hosting service, I would suggest you give iPage a try. I am going to have some time in the near future to come back to this stuff. See you soon. I have been working on Volume 3 of the Operating System Design Book Series. It has been coming along well. It is about 75% done. It details:the Floppy Disk Controller, floppy disks, and how to find the formats. the IDE ATA hard drive controller. How to read and write to hard drives and CDROM's/CDRW, etc., using the IDE type controller. the SATA (non-AHCI) type controller. It is very similar to the IDE ATA controller, with a few additions. the SATA AHCI (HBA) type controller. It will emulate the non-AHCI type SATA controller. Details on how to program the SATA AHCI (HBA) type controller. Brief information about RAID controllers. I have a bit more work to do, but it is coming along nicely."
