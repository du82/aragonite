["https://www.fysnet.net/blog/2020/05"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''A conversation with a fellow reader reminded me that I have an 8" floppy drive in storage. Today I got it out to have a look at it again. I really want to create a small board and see if I can hook it up to a standard 3 1/2" Floppy Disk Controller, and wondered why I haven't done that yet. I even have researched a little how to do it, and found someone else that has done this. So, first things first, I opened up the package to see what I have, and the drive is still in its shipping container wrapped in the plastic from the factory. After a little more looking, I remembered why I haven't experimented with it yet. The drive still has the protective cardboard insert in the slot. The drive has never been taken out of its plastic home, nor has a disk ever been inserted, more so, it has never been plugged in to a machine. It is brand new, so to speak. There is no way I am ever going to hook it up to something, in fear of damaging it. I would never forgive myself. What a fine peice of hardware history. Here is a pic of the bottom side... (sorry I took the picture through the plastic. Static electricity is not a good thing, right? Didn't want to take the chance of touching something I shouldn't.) ...and I have two cases of 8" disks, 10 per case. This fine piece of hardware history was given to me by a fellow reader so long ago. I don't remember who it was, but if he/she is still reading this, my greatest appreciation to you for this gift. This is the reason I continue to work on my own projects. Some one has shared with me so I wish to share back. Thank you all for your support.'''
