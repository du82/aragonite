["https://www.fysnet.net/bochs/user/serial-port.html"]
title = "Using the serial port"
full_description = "This section describes what is possible to do with Bochs serial port emulation. These examples use dlxlinux disk image (downloaded from https://bochs.sourceforge.io/guestos/dlxlinux4.tar.gz ) running as guest, on a debian x86 linux 2.4.19 host. For the examples to work in dlxlinux, after you login as root, you will need to kill the running gpm, as it grabs the serial port. The first example shows how to log information sent to the serial port on the guest system into a file on the host system. First, you need to find an unused virtual terminal. Typically, X uses vt7; vt8 and up are unused. On my system, I can switch from X to vt9 by pressing ctrl-alt-f9 : this virtual terminal is not used, the screen is all black. Pressing alt-f7 switches back to X. Also, if you plan to use this feature, the best would be to deactivate gpm in /etc/rc.d/rc.local, and add a agetty line in /etc/inittab, for example: The third example is very similar to the second one, except that we connect to the guest OS with kermit as client, and we the connection is done through a pseudo terminal. This example uses /dev/ptyp0 and /dev/ttyp0 as pseudo terminal pair. We will tie Bochs to the controlling terminal, whereas kermit will use the slave terminal."
