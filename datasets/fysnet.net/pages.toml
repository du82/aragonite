["https://www.fysnet.net/bochs/user/feedback-support.html"]
title = "Feedback and Support"
full_description = '''There are some requirements when submitting bug reports, patches, and feature requests for Bochs to make it easier to reproduce bugs and test patches. When reporting errors while building Bochs to the bochs-developers mailing list or the SF bug tracker for the Bochs project, this information is required to fix the issue: Before reporting us the issue, make sure that a similar one hasn't been already reported or someone created a patch to fix it. If you are familiar with C++ and you can write some code to fix your problem, you can post it in the bochs-developers mailing list or submit the patch in SF patch tracker for Bochs. If Bochs does not work properly (e.g. panic, segfault, malfunction of emulated device) we need some information to find out what's going on: Patches for Bochs should be provided in the "unified diff" format. In addition to the patch file and a detailed description this information is required: When you are are interested in writing a patch to fix bugs or add new features, you should have a look at the developer documentation. For some parts of the Bochs code we have already written some basic information.'''
