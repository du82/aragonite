full_description = "I have been working on my Ultimate utility and have enhanced the EFI GPT format code. It now correctly creates a GPT image ready for Windows 10. (right click to view image in full size) For instructions on how to make such an image, visit this page. Thank you all for your support. To make it easier to access the code from my books, I have made most of the source code freely available via GitHub. Most all source code to each book is available and will be updated as needs arise. Image files and a few other utilities and source code is not included for various reasons. If you need the image files, please see the web page for each book for instructions on how to get the freely available CD-ROM ISO image file containing all source and misc files. I have also include a little more information on the format of the source files and why I suggest using an obsolete media format and testing operating system. I am still making progress on all books as well as the most asked about Volume 7, The Network Interface. However, with other items going on in my real world, time and interest has not been as available as I may have wished. However, please know that I am continuing the work, and I do still try to reply to all who ask questions, so please keep your questions and comments coming. Thank you all for your support."
