["https://www.fysnet.net/bochs/user/config-tuntap.html"]
title = "Configuring and using a tuntap network interface"
full_description = "If you use linux (optionally FreeBSD and Solaris, not tested), you may want to access the network through a tuntap interface. The main advantage of this interface, is that the guest has access to the host. The guest can even have access to the whole network if the host routes or masquerades the guest requests. No extra IP address is needed, all can be done using private IP addresses. You'll find here instructions to set up Linux/Bochs to provide network access to the guest OS through a tuntap interface and private IP network. We're going to see howto : Note: Make sure there is a /dev/net/tun device. (Can be created with 'mkdir /dev/net ; mknod /dev/net/tun c 10 200'). Note: Some of the other options in this group is probably also needed, (but the default setting should be OK). Make sure Bochs has one of the network adapters enabled. If you have to recompile Bochs, use --enable-ne2000 or --enable-e1000 when running ./configure (see Section 3.4) Since the tuntap interface cannot be configured until a process opens it, Bochs may run a script file for you. In this case /path/to/tunconfig should be changed to match the actual place where you'll create this script. Note: Bochs must be started by root (at least for now - the script won't have root privileges otherwise). We are going to set up standard masquerading configuration. Edit the /path/to/tunconfig script ans add : Note: The configuration assumes the default policy is ACCEPT (can be examined by doing '/sbin/iptables -L') much of the information of the following section is taken from this email from Samuel Rydh of the Mac-On-Linux list"
