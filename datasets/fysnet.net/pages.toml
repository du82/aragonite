["https://www.fysnet.net/blog/2024/09"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "Through popular demand, PDF versions of my books are now available, while the Kindle versions have now been discontinued. I have had numerous readers state that my printed books were not available in their area, or if they were, the shipping cost was not feasible. Also, from the start, I did not like how the Kindle formatted my books. Nothing wrong with Kindle, it just wasn't designed to show tables, figures, and such items within these kinds of books. Therefore, I am going to try to manage the sales of the PDFs myself, not anticipating too many transactions (once the initial burst is over), hence the trial heading. If you wish a PDF copy of any of the six currently offered books, please send me an email at fys at fysnet dot net requesting more information and instructions on how to purchase one or more copies. A few notes:The initial versions of the PDFs will be (mostly) identical to their respected printed versions. As with anything in electronic form, updates will be made, though major updates will be kept to a minimum. If you have purchased a printed copy of any of the books, I do not offer the PDFs for free or at a discounted price. Sorry. If you purchase a PDF version, future updated versions will not be available for free or at a discounted price. Sorry. All sales are final, and any new versions are a new purchase. Although there may be rare alternate occasions, all transactions will be through Paypal. You must have an email address and service that allows large attachments, currently up to 10Meg for a single archived file, 20Meg for multiple files within a single archive. Gmail allows up to 25Meg. No download or transfer service will be used. Archived files will default to .ZIP but most any format supported by 7-zip will be allowed. US Dollars only. It looks like PayPal charges from 3.5% to 4% currency conversion plus a 4.5% conversion service fee. Buyer pays all conversion fees. Due to demand (or the lack thereof), prices may change. You will have to read through a single page of terms and conditions (via email), with things like you won't distribute, sell, or give away any files, won't host them publicly, etc. Since I will be doing this myself, please be patient and allow up to five business days for me to reply. After a lot of thinking and change after change, these are the prices I have decided upon. I hope they are fair not only to me but to you as well:Volume 1 -- The System Core -- Rev: 20170406 -- ($10.00*) Volume 2 -- The Virtual File System -- Rev: 20220209 -- ($10.00*) Volume 3 -- Media Storage Devices -- Rev: 20150601 -- ($10.00*) Volume 4 -- Input and Output Devices -- Rev: 20220222 -- ($10.00*) Volume 5 -- Misc. System Services **** Not yet available **** Volume 6 -- The Graphical User Interface -- Rev: 20160704 -- ($10.00*) Volume 7 -- The Network Interface **** Not yet available **** Volume 8 -- The Universal Serial Bus -- Rev: 20220101 -- ($20.00*) Add $1.00 for every $10.00 if the buyer must convert their currency to US Dollars Again, this is a trial. I don't know how successful this current technique will be and please note that there may be changes as well as I am open to suggestions. Sorry that this sounds so formal and detailed. This will be a first for me and I am just trying to keep the transaction safe for the both of us, after all, this is not my day job."
