["https://www.fysnet.net/osdesign_book_series.htm"]
title = "Operating System Design Book Series"
full_description = "This page hosts the list of books within the Operating System Design Book Series by Benjamin David Lunt. There are currently eight books planned with six already published and one in development. Please note that the names and count of volumes may change as the need arises or interests change. Please visit this page every so often to see the progress of this series. Thank you. Please note that I write these books for my enjoyment, not for a living. This is my hobby. I do this because I enjoy the process of the research, development, layout, and writing of these books. I also enjoy helping other people. Yes, I do make a slight (and I mean slight) profit from them, but this doesn't even pay for the time I spend returning emails from readers asking questions. I am grateful to help and am happy to and try to reply to every reader, but please don't expect the next greatest and wonderful book series from this. I do this for the purpose that it is an enjoyment for me, it takes me away from my real job, i.e.: a hobby--and above all, I hope that others learn from my work. I am grateful for all of the wonderful words many have sent in--and for those who sent not so nice words, I am still grateful, for no one can improve their work without learning from trial and error. So please, if you have comments, I would be very grateful to hear them, good or bad. When I release later versions of that book, I will surely try to include more information about a certain subject you ask for. The other day I came across a downright nasty review. I think the reader might have anticipated that I was a renowned author and worked with USB as a living. This is far from the case. Again, this is a hobby of mine, so truth be told and being completely honest and transparent, please understand that I write these books as a hobby intented for others with the same hobby interest. Nothing more. There might be errors, grammar or otherwise. However, I have done my best to try to teach others whom might have the same interest as I."
