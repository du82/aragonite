full_description = "Just a few updates: A fellow OSer at osdev.org posted a concern with Bochs and the UHCI code. Come to find out, it was a small bug in the interrupt code due to deferred packets. I have made a fix and hopefully it will be posted to Bochs soon. I am still doing work on the new USB Attached SCSI (USB UAS) protocol, and progress should be done soon. Thank you, Ben Unfortunetly, I haven't had much time to work on any of my projects. My real jobs have been taking most of my time. I have done a little work on Volume 3 with ATAPI devices, updated some documentation and code for the next edition. I am still trying to decide what to base Volume 5 on. If you have any ideas, please let me know. I have been doing a little work on the new USB Attached SCSI (USB UAS) protocol, though a bit more work is needed. One thing I would much appreciate from my readers is if you find comments or reviews, good or bad, on other sites, please send me a note on where you found it. I would love to read them. Thank you, Ben"
