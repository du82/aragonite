full_description = "The 3rd Edition has the ISBN numbers of: ISBN-13: 978-1717425362 ISBN-10: 1717425364 The previous editions have the numbers of: ISBN-13: 978-1468151985 ISBN-10: 1468151983 However, due to a mix up with the early publishing of the new edition, if you recently bought this book with the previous ISBN number, you may still receive the new edition. Also, from this date on, if you purchase this book using the previous ISBN number, as long as you do so as a new book purchase, direction from Amazon (not any affiliates of Amazon), you will still receive the 3rd Edition of this book. It was no mistake of CreateSpace or Amazon, well 5% maybe, but most of the blame was on me. I made an assumption and as with all assumptions, it was a mistake. Thank you to CreateSpace and Amazon for helping me get my book published, as well as all of you for your support. Also, there will not be a Kindle version of this new Edition. Kindle does not display the tables and figures correctly and in my opinion is very difficult to follow. Please let me know if you have any questions and/or suggestions. I am proud to announce that the 3rd Edition of the book, USB: The Universal Serial Bus, is now available. Many new items have been added:UASP: USB Attached SCSI Protocol for the latest thumb drives. ISO transfers for all four controller types More details on Video Cameras which include details on Association Descriptors More details controller schedules which includes many new figures and images New detailed figures and images that are more pleasing to the eye. For example, the following figure shows how an EHCI Controller may organize its companion controllers: With that image in mind, more information added for Controller Root Hubs as well as extern hubs. Improved information on HID devices Added information for booting of USB thumb drives I have also made corrections and update of information throughout the entire book. Thank you to all for your support. Please let me know if you have any questions and/or suggestions."
