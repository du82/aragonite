["https://www.fysnet.net/bochs/user/faq.html"]
title = "FAQ"
full_description = '''Phonetically the same as the English word "box". It's just a play on the word "box", since techies like to call their machines a "Linux box", "Windows box", ... Bochs emulates a box inside a box. Kevin Lawton is the primary author of Bochs. There have been bug fixes, enhancements, and code contributions from some few hundred people, so it is not possible to list them all. Later, Kevin had been working on a PC virtualization project called plex86. In Fall 2002, he made contributed some major CPU speedups and helped with integration and debugging of the x86-64 emulation code. With Kevin's help, in April 2001, the members of the bochs-developers mailing list set up a new official Bochs site hosted by Source Forge. The admins on this project are Greg Alexander, Don Becker, Christophe Bothamy, Bryce Denney, Volker Ruppert and Stanislav Shwartsman. Because Bochs emulates every x86 instruction and all the devices in a PC system, it does not reach high emulation speeds. Users who have an x86 processor and want the highest emulation speeds may want to consider PC virtualization software such as Vmware or VirtualBox (free software). Another related project is QEMU. No. It uses a disk image file, which is simply a large file, like any other file, on your platform's disk. Think about this. If you had two different PC's, they would require different hardware drivers. So you may not be able to safely move a disk drive with WinXP on it, from one to the other. Bochs is no different. It emulates a certain set of hardware devices, and requires each OS be configured for those devices. Yes. You will usually find Bochs developers and users on IRC at irc.freenode.net:6667, channel #bochs. Yes, the CD-ROM emulation and accessing ISO files is always available. Reading from host CD-ROM media is supported in Linux, Windows, and most BSDs. The CD-ROM drivers for Bochs allow the guest operating system to access the host operating system's CD-ROM data directly. Yes, Bochs emulates a Sound Blaster 16 card (ISA, no plug&play) or an ES1370 PCI. Output to the host sound system is implemented for some platforms. See Section 1.7 for details.'''
