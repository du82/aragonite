["https://www.fysnet.net/bochs/user/debugger-gui.html"]
title = "The Bochs debugger GUI"
full_description = '''The graphical front-end for the Bochs command line debugger is available for Windows and GTK2/GTK3 hosts. To use the GUI debugger, you must configure Bochs with the default debugger switch and the --enable-debugger-gui flag. For example: At runtime you need to add the value gui_debug to the display_library options parameter in order to use the GUI instead of the command line debugger. This example shows how to use it with the 'x' GUI: Note: The wxWidgets port of Bochs always uses this debugger GUI. Passing the option to the display library is not necessary, since the command line interface is not available then. The GUI debugger consists of a GUI window with a menu bar, a button bar and some child windows for different purposes. Not all windows are visible at the same time. Typically, all the various registers are grouped by color. If you don't like the colors, they can be turned off, or modified at compile time. There are options to show or hide most register "groups", so that you can focus more strictly on the registers you are interested in (probably just the GP registers). Doubleclicking a register attempts to change its value. Bochs may not allow you to change most registers. In future versions, more registers may be modifiable. Disassembly output that is autoloaded, or generated from the menu, ends up here. If the frontend cannot detect the "current instruction" in the list, when it reaches the next instruction -- then it will autoload a new list. Having a big list will reduce the number of autoloads, and allows you to see more. The list can contain up to 2048 lines. However, if you load more than 1000 lines, you are more likely to see performance problems. There are two kinds of emulated memory in Bochs: Linear and Physical. Emulated Linear memory is mapped onto Physical memory by x86 virtual memory methods (paging and segmentation). If paging and segmenataion are "off", or "identity mapped", then both "types" of memory mean the same thing. But they still work a little differently. With the Internal Debugger, you can set breakpoints to either kind of memory, separately. Normally, you would use the "b" command to set breakpoints in physical mem, and "lb" to set breakpoints in linear mem. This frontend ONLY displays linear breakpoints. It does not bother trying to figure out the linear->physical reverse mapping to show physical breakpoints. (There are also "virtual" breakpoints that are also not shown.) All the types of breakpoints still WORK, it is just that you will not see them marked on the screen.'''
year_published = 2025
clearnet = "https://www.fysnet.net/bochs/user/debugger-gui.html"
