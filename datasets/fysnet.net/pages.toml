["https://www.fysnet.net/blog/2016/04"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "As many of you probably know, I have been working with some older, obsolete hardware, and the Bus Mouse Adapter is one of those items. After reading a few articles, one in particular on www.hackaday.com about adapting a bus mouse trackball to USB HID device, I thought I would try to do the same. I went looking for a 9-pin connector, and found one at www.mouser.com. Using the datasheet, I created a small PCB break-out board. I then attached it to my ATTiny2313 board, added a few resisters and off I went... ...Nothing. Come to find out, the pin-out for the bus mouse is different depending on the brand of the mouse. I am using the Microsoft Inport 9-pin mini-DIN mouse here. Out comes the voltage tester. After a few Ohm's tests and voltage tests, I now had an accurate pin-out for the bus mouse. To be sure, I tested a few other bus mice I had laying around. Ya, I got a few... :-) With my tests, I already have the HID part done, as a Vendor Specific part, so that I could see the port values of the ATTiny2313. I stole my code from Appendix Q, the Input section."
