["https://www.fysnet.net/blog/2016/05"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "I am proud to announce that Volume 4, FYSOS: Input and Output Devices, is now available. This volume has information on different forms of mice and keyboard input and Sound Blaster output. I have to admit, this was probably the most enjoyable of the series. I worked with older hardware with little to no documentation and got it to function. Most of the documentation in this book may be outdated to your liking, except for the PS/2 support. Hence, I put a lot of work and effort into documenting this part. This book will show you how to communicate with a PS/2 style keyboard and/or mouse. The remaining chapters are mostly for enjoyment, at least for me anyway. Thank you everyone for your support. I updated my MTools Package, a new MGetCD and MCDInfo, to now retireve the information from UDF style CD-ROM discs. I quickly threw it together since I was trying to get some information off of a disc. To continue a little with last month's blog, Volume 4, FYSOS: Input and Output Devices, is nearly complete. I have tested my code with numerous devices, but would like to test with more. If you have any old Bus, Serial, or PS/2 mice, or any ISA Sound Blaster or compatible cards lying around that you don't mind giving up, please send them my way. I will be forever grateful and will be sure to include your name in the Contributors section of the book. Please send to the following address: Ben Lunt 321 Pinedale Rd, box 875 Taylor AZ 85939-0875 USA Please include your name or handle you wish to have included in the book. Thank you."
