["https://www.fysnet.net/bucket/specification.php"]
title = "The FYSOS Memory Allocation System specification 1.0.0"
full_description = '''the FYSOS registry system Part of the FYSOS project Overview Specification Downloads The FYSOS memory allocation system specification 1.0.0-rc2 Version 1.0.0-rc2, last update: 2025 February 22 Copyright © 1984-2025 by Forever Young Software Permission to make and distribute verbatim copies of this specification, translations of this specification into another language, and derivative works that comment on or otherwise explain it or assist in its implementation, for any purpose and without fee or royalty is hereby granted, provided that the present copyright notice, licensing terms and disclaimer are preserved on all copies. In addition, the Author covenants not to assert any claims on implementations of this specification, unless such implementations contain derivative work of implementations by the Author, for which specific licensing terms may apply. THIS SPECIFICATION IS PROVIDED "AS IS," AND THE AUTHOR MAKES NO REPRESENTATIONS OR WARRANTIES, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, NON-INFRINGEMENT, OR TITLE; THAT THE CONTENTS OF THIS SPECIFICATION ARE SUITABLE FOR ANY PURPOSE; NOR THAT THE IMPLEMENTATION OF SUCH CONTENTS WILL NOT INFRINGE ANY THIRD PARTY PATENTS, COPYRIGHTS, TRADEMARKS OR OTHER RIGHTS. TO THE FULLEST EXTENT PERMITTED BY APPLICABLE LAW, THE AUTHOR WILL NOT BE LIABLE FOR ANY DIRECT, INDIRECT, SPECIAL, INCIDENTAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF ANY USE OF THIS SPECIFICATION OR THE PERFORMANCE OR IMPLEMENTATION OF THE CONTENTS THEREOF. No other rights are granted by implication, estoppel or otherwise. This document describes version 1.0.0-rc2 of the FYSOS memory allocation system: a free, simple, portable, personal, fully featured allocation system for embedded tasks and hobbyists alike. Minor changes made to this document (e.g. wording) that do not affect the registry system format are tracked by the third number in the document version number. This memory allocation system is in the release development stage: this document supersedes any previous version of the memory allocation system specification with no care for backward compatibility. Since this is a new memory allocation system, and some aspects are still to be defined, suggestions or corrections are welcome, for either the memory allocation system or this document. Please contact the author at: fys at fysnet.net. The author wishes to thank those who have submitted comments and criticism in order to improve this system. This document contains the formal specification of the FYSOS memory allocation in-memory format. For an overview of this system and for downloads, please see the overview page. Table of contents Differences from the previous versions Definitions Machine Size Virtual Heap Heap Catalog The Bucket Structure The Pebble Structure Splitting Pebbles Merging Pebbles Aligned Requests Physical Requests Initialization Allocation requests Requirements Differences from the previous versions version 1.0.0-rc2 Reformat: A few more modifications Spinlock: Change the Spinlock function version 1.0.0-rc1 Reformat: Reformatted the specification to be consistent with other like FYSOS specifications Structure: Modified the structure layout slightly version 1.0.0-rc0 Official Release: Official release version 1.0.0-rc0. Definitions The following terms and conventions will be used throughout this specification: must, must not, should, should not, may: these words are to be interpreted as described in RFC 2119; reserved for future use: a data field that has not yet been defined. When creating a new entry that field must be written as zeros. When reading an existing entry, a driver must not make assumption about the content of that field. When writing that field to an existing entry, a driver must preserve the value in that field; byte: a group of eight adjacent bits, an octet; driver: a system driver, or any other part of the operating system, or any application implementing this specification to access the registry system; page: a minimum number of contiguous bytes of an allocation unit of the underlining system, usually 4k; pebble: a block of memory, used to store data, belonging to a single task or request; bucket: a block of memory, used to store child pebbles; heap: a contiguous block of memory, physical or other, containing an arbitrary number of buckets, each bucket containing an arbitrary number of pebbles. A heap has but one owner, though an owner may have multiple heaps; The C++ syntax is used for code snippets and structure formats, with stdint.h integral types. The char type is assumed to be 8-bit. Hex numbers are prefixed with 0x; Unless otherwise stated, all numbers must be stored in little endian format (least significant byte first). Machine Size This specification outlines a 32-bit memory module and a 64-bit memory module. When you compile for a 32-bit platform, pointers and size_t declarations are 32-bit wide. When you compile for a 64-bit platform, pointers and size_t declarations are 64-bit wide. The struct Bucket structure is always 64 bytes in size, no matter the platform. The struct Pebble structure is of a different size depending on the inclusion of the name field and the platform size. On a 64-bit platform and the name field is omitted, the struct Pebble structure is 64 bytes in size. On a 64-bit platform and the name field is included, the struct Pebble structure is 128 bytes in size. On a 32-bit platform and the name field is omitted, the struct Pebble structure is 64 bytes in size. On a 32-bit platform and the name field is included, the struct Pebble structure is 64 bytes in size. Virtual Heap Figure 1: Layout of a FYSOS memory allocation system. To make it easier on the kernel, a virtual memory heap is created. The heap is a number of blocks of memory available to the kernel. The heap is used as a simple way to allocate and free virtual memory without calling the underlining physical allocator for each and every memory request, making it much faster to allocate memory. On Kernel start up, it calls the Virtual Memory Allocator (mmap()) to allocate a single linear block of memory, 64 Meg is suggested but not required, for this heap. The memory in the heap may or may not be physically contiguous. This heap is then further managed by a Heap Allocator. All requests for memory go through this Heap Allocator. If a memory request can be satisfied from this initial block of memory, the Heap Allocator records the allocation within its catalog and returns a pointer to a region large enough to satisfy the request. No call to the Virtual Memory Allocator or Physical Memory Allocator is needed, drastically speeding up the memory request. If the memory request cannot be satisfied, due to lack of remaining room in the current catalog, a special alignment request, a physical address request, or other situation, the Heap Allocator may then call upon the Virtual Memory Allocator to satisfy the request. The Virtual Memory Allocator may then call upon the Physical Memory Allocator to satisfy the request. This Virtual Heap Allocator maintains a catalog of virtual memory addresses from base address of the Bucket to the size of the heap set by the Kernel. The Kernel’s heap may set this limit to any amount. Any Heap created for a user task may set an initial limit, resizing as needed. Heap Catalog The Heap Catalog consists of Buckets and Pebbles. Initially there is a single Bucket of any size holding one to an arbitrary number of Pebbles within it. Each Pebble is marked used or free. If a Pebble is marked free, it may be used to satisfy a memory request. This Pebble can be split into two Pebbles so that the remaining part of the Pebble can then be used to satisfy another request. If at any time there is not a Pebble within a Bucket to satisfy a memory request, a new Bucket may be allocated, placing free Pebbles within, to satisfy the request. Buckets A Bucket is allocated by the Virtual Memory Allocator, is of an arbitrary size, and is considered a contiguous number of virtually allocated bytes from start to end. The starting memory location and any contiguous byte to the end may or may not be physically contiguous, but must be virtually contiguous. A Bucket is allocated and freed from the Virtual Memory Allocator using two functions, the first may be a function called mmap() and the second may be called mmap_free(). No other system memory function is required as far as the Heap Allocator is concerned. All Virtual Memory allocated for a Bucket is cataloged by the Virtual Memory Allocator. A Bucket maintains only the Pebbles within it and has no awareness of any other Pebbles within another Bucket. A Bucket may be resized at any time as long as the Pebbles within are maintained. If a Bucket has excess free Pebbles, or a single free Pebble with excess memory allocated for it, a Bucket may shrink to accommodate. If a Bucket doesn’t have enough free space within, it may expand to create an addition number of Pebbles. However, any memory added to the Bucket must be contiguously added at the end of the currently allocated memory. i.e.: A Bucket may only increase in size if the added memory is Virtually consecutively added at the end and the new sized Bucket is still completely continuous. A Bucket has the following format and must be stored in the first bytes of the allocated space returned from the Virtual Memory Allocator. struct Bucket uint32_t magicThis must be equal to 0x4255434B (the 'BUCK' characters in ASCII), and it must be used to identify a valid bucket within the system. uint32_t localFlagsFlags used for this bucket. See below. Each bucket is independent of another. size_t largestThis field holds the size of the largest free block within this Bucket. The Heap Allocator code can compare this field with the request to see if there is a Pebble large enough to satisfy the request. This is so the Heap Allocator does not have to parse any of the Pebbles to see if one is large enough, and can move on to another Bucket if there is none. This field must be maintained after a Pebble in this Bucket is modified. size_t sizeThis field is used to store the number of pages allocated for this Bucket. This value is used for the free function of the Virtual Memory Allocator, so it knows how many virtually contiguous pages to free. uint32_t spinLockIn a multithreaded/tasking system, this field is used to lock this Bucket. If this bucket is locked, no value should be assumed valid until this field shows no lock. This specification does not define the technique used to lock this Bucket. It is up to the implementation to use this field to lock this Bucket. uint8_t reserved[n]Reserved and preserved. For 64-bit platforms, n = 12. For 32-bit platforms, n = 32. void *firstPebbleThis field points to the first Pebble in this Bucket. A Bucket must always have at least one Pebble, even if it is a free-for-use Pebble. After a call to free a Pebble, after any merging of Pebbles, if this happens to create a single Pebble within a Bucket and this Pebble is free for use, it is up to the Heap Allocator if it would like to free this Bucket from the Heap’s list. Again, making sure to not free the all Buckets. The First Pebble, the Bucket’s firstPebble field, must not be assumed to be just after the Bucket structure. The First Pebble field may point to any Pebble within the Bucket. An advantage of this is to update the Bucket’s first Pebble field to point to the newly freed Pebble, so that when the next allocation is to take place, the first Pebble found is a free Pebble. However, this creates more work when finding a used Pebble. Also, see a later section for more reasons why you must not assume the first Pebble starts at an offset just after the Bucket Structure in the memory region. void *previousThis field, along with the next field, create a linked list of Buckets. If a field is non-zero, there is another Bucket in that direction at that address. At least one Bucket must always exist and its previous field must be NULL. If it is the last or the only Bucket, its next field must also be NULL. void *nextThis field, along with the previous field, create a linked list of Buckets. If a field is non-zero, there is another Bucket in that direction at that address. The Bucket's localFlags field is defined as the following: enum BucketLocalFlags Symbolic namebit positionDescription blfMethod0If set, the allocator is to use the Best Fit method when allocating a free Pebble within this Bucket. That is to use the smallest free Pebble that will satisfy the request. If clear, the allocator must use the first free Pebble it finds in this Bucket. blfReserved7:1reserved and preserved blfRequestType15:8This field is equal to the enum requestType value that was used to allocate this Bucket. blfReserved31:16reserved and preserved Pebbles Pebbles are stored within a bucket. A Bucket must have at least one Pebble. A Pebble is used to satisfy a memory allocation request. A Pebble has the following format. struct Pebble uint32_t magicThis must be equal to 0x524F434B (the 'ROCK' characters in ASCII), and it must be used to identify a valid pebble within the system. uint32_t localFlagsThis field is used to indicate a few attributes about this Pebble. Any flag given is for this Pebble only. No field, flags or other, are used in any other Pebble. uint32_t reserved0reserved and preserved. uint32_t alignmentThis field is used to pass on the Alignment value if this Pebble is to be aligned. This way, a function, such as a call to realloc(), can maintain this alignment. Allowed alignment values passed to the Heap Allocator are any power-of-two, from 1 to 1Meg, inclusive. Any value that is not a power-of-two, will be increased to the next closest power-of-two. However, the Heap Allocator’s minimal alignment will be 64. Any value below will be returned on an alignment of at least 64 bytes. A value from 64 to 1 Meg fits within a 32-bit unsigned integer, hence the size of the field. However, when using calculations on 64-bit values, remember to use correct casts to a 64-bit value to eliminate errors. size_t sizeThis field is the number of bytes within this Pebble assigned for use. This size must be at least 64 and must be a count of 64 bytes in size. i.e.: It must be at least 64, 128, 192, 256, 320, etc. This field may not actually represent the exact number of bytes requested, but must be at a 64-byte count at or above the amount requested. This is to align the next Pebble on a 64-byte count from the end of the previous pebble. This alignment is not to be relied upon, nor assumed. See a later section for reasons why. This Size value does not include the size of the Pebble Structure described here. char name[32] (optional)This field is an optional field and may contain anything the Kernel wishes to place here. This could simply be a character string of the function or filename that called the allocator. It can also be a s'''
