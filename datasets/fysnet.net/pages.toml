title = "LEAN file system specification 1.0.3"
full_description = '''the LEAN file system Part of the FYSOS project Part of the FreeDOS-32 project Chew the Fat Overview Specification Downloads LEAN file system specification 1.0.3 Version 1.0.3, last update: 2022 December 28 Copyright © 2004-2010 by Salvatore ISAJA (original Author through version 0.6.1) Copyright © 2021-2025 by Forever Young Software (Author starting with version 0.7.0) Permission to make and distribute verbatim copies of this specification, translations of this specification into another language, and derivative works that comment on or otherwise explain it or assist in its implementation, for any purpose and without fee or royalty is hereby granted, provided that the present copyright notice, licensing terms and disclaimer are preserved on all copies. In addition, the Author covenants not to assert any claims on implementations of this specification, unless such implementations contain derivative work of implementations by the Author, for which specific licensing terms may apply. THIS SPECIFICATION IS PROVIDED "AS IS," AND THE AUTHOR MAKES NO REPRESENTATIONS OR WARRANTIES, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, NON-INFRINGEMENT, OR TITLE; THAT THE CONTENTS OF THIS SPECIFICATION ARE SUITABLE FOR ANY PURPOSE; NOR THAT THE IMPLEMENTATION OF SUCH CONTENTS WILL NOT INFRINGE ANY THIRD PARTY PATENTS, COPYRIGHTS, TRADEMARKS OR OTHER RIGHTS. TO THE FULLEST EXTENT PERMITTED BY APPLICABLE LAW, THE AUTHOR WILL NOT BE LIABLE FOR ANY DIRECT, INDIRECT, SPECIAL, INCIDENTAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF ANY USE OF THIS SPECIFICATION OR THE PERFORMANCE OR IMPLEMENTATION OF THE CONTENTS THEREOF. No other rights are granted by implication, estoppel or otherwise. This document describes version 1.0.3 of the LEAN file system (where the word LEAN is a recursive backronym for Lean yet Effective Allocation and Naming, based on the ironical contrary of FAT, as an English word): a free, simple, portable, personal, fully featured file system for embedded tasks. Minor changes made to this document (e.g. wording) that do not affect the file system format are tracked by the third number in the document version number. The LEAN file system is in the release development stage: this document supersedes any previous version of the LEAN file system specification with no care for backward compatibility. Since this is a new file system, and some aspects are still to be defined, suggestions or corrections are welcome, for either the file system or this document. Please contact the original author at: salvois at users.sourceforge.net or for later releases: fys at fysnet.net. The authors wish to thank those who have submitted comments and criticism in order to improve the LEAN file system. This document contains the formal specification of the LEAN on-disk format. For an overview of LEAN and for downloads, please see the LEAN home page. Table of contents Differences from the previous versions and future plans Definitions Partition identifier Structure identification and checksum Bands Character encoding The Superblock The bitmap The data area and file allocation The inode structure Directories Symbolic links Extended attributes Extended Capabilities Undelete Capabilities Transactional Updates Differences from the previous versions and future plans version 1.0 Official Release: Official release version 1.0. version 1.0-rc1 Transactional Updates: Added a section about Transactional Updates. Bitmap Checksum: Added a Bitmap Checksum to the Superblock. This addition means the complete Volume can now be Checksum'ed. Encoding: Removed the Character Encoding option. All text and strings are UTF-8 as originally specified. version 1.0-rc0 First non-alpha/non-beta release: First release with a Major version greater than zero. Version field: Added clarification to the version field in the Superblock. Next Free: Added a hint to the next free block field the Superblock. Capabilities field: Added a capabilities field to the Superblock. Character Encoding: Added a character encoding field to the Superblock. Inode size: Changed the size of an Inode. inodeSize = 200 Extents per inode: Changed the extentsPerInode constant to 8 for standard extents (remains 6 for extended extents). Extended attributes: Changed the header dword to include an 'Implementation Specific' field. This restricts the size of an attribute value from 16 Meg to 1 Meg (minus 1), though Linux restricts them to 64k, so I think we are still good. version 0.8 Hidden Attribute: Removed iaHidden from the enum InodeAttributes and placed it in the directory entry's type field. This allows multiple hard links to the same inode to be hidden independently of each other. Undelete: Added the ftDeleted file type and comments about undelete capabilities. version 0.7 Block size: 512-byte sectors are no longer assumed. A block size can be specified. Extended lengths: The length of some items have been extended to accommodate for larger block sizes. Band size: The minimum size of a band has been extended to accommodate for larger block sizes. Journal inode: An entry in the Superblock was added to accommodate this arbitrary block size and a Journal. Misc: A field in the Indirect structure was extended to a 16-bit value to accommodate for larger block sizes. Superblock location: Tightened the constraints on the Superblock location when large block sizes are used. Bad Block inode: Added section to clarify the Bad Block inode. version 0.6 License: the GNU Free Documentation License has been replaced with a custom license that makes more sense for a specification. Preallocation: added support for drivers that may want to preallocate more disk space than needed for a file to reduce fragmentation and improve locality. Creation time stamp: creation and last status modification time stamps have been splitted. Extended attribute names: introduced constrains on names of extended attributes for compatibility with existing extended attribute APIs. Inline extended attributes: there are only two options for inline extended attributes now: do not use them, or reserve the whole space after the inode structure in the first sector, instead of the old inodeExtra parameter. Naming convention: removed identifiers in ALL_CAPITALS to avoid clash with the conventional namespace of C and C++ macros. version 0.5 Directory entry restrictions: directory entries are no longer required to fit within a single sector. This increases the maximum file name length, and makes storage of directory entries and extended attributes consistent. version 0.4 File allocation: new definitions for some fields of the inode structure to simplify traversal of indirect sectors. Extended attributes: extended attributes can now be stored in an optional extra space after the inode structure, or in a separate fork for each file. Access control: POSIX permissions, although optional, have been included. Access Control Lists may be added in a future version using an extended attribute. version 0.3 Sector size: sector size is now fixed to 512 bytes. This simplifies the layout of several structures and implementation of drivers. A driver should convert actual disk sectors to conventional sectors in case they differ. 64-bit addressing: sector addressing has been extended from 32-bit to 64-bit. Extent sizes are still 32-bit to reduce bookkeeping space. The layout of all data structures has been modified to accommodate the new sizes. version 0.2 Multiband layout: a volume is split in bands, each with its portion of the bitmap. Extent-based allocation: file allocation is expressed in terms of extents instead of the old clusters. File name restrictions: removed constrains on characters not allowed in file names. Definitions The following terms and conventions will be used throughout this specification: must, must not, should, should not, may: these words are to be interpreted as described in RFC 2119; reserved for future use: a data field that has not yet been defined. When creating a new entry that field must be written as zeros. When reading an existing entry, a driver must not make assumption about the content of that field. When writing that field to an existing entry, a driver must preserve the value in that field; byte: a group of eight adjacent bits, an octet; driver: a file system driver, or any other part of the operating system, or any application implementing this specification to access a LEAN file system; disk: a block device hosting a LEAN file system. This wording is used for simplicity, although that device does not need to be an actual disk memory (e.g. disk partition, memory card, RAM disk). Drivers must limit disk sizes to 263-1 blocks, that is the maximum number that can be represented with a signed 64-bit integer; volume: a self-contained LEAN file system on a disk; sector: an allocation unit, an arbitrary number of bytes, singly accessible, read or written, by a device controlling the media of the volume. This is the smallest number of bytes accessible per physical access of the media, by default usually being a 512-byte block. This must be a power of two equal to or greater than 256. It is the goal of this specification to eventually target a sector size of 4096 bytes with a matching block size; block: by default, a conventional sector of 512 bytes, though not limited to this size. A block must be an array of contiguous sectors and the disk must be an array of contiguous blocks, numbered starting from zero. The block size may or may not equal the media sector size; Superblock: a structure containing fundamental information about a volume; bitmap: a structure tracking free blocks of a volume; band: a portion of the disk made up of several contiguous blocks. Each band stores a part of the bitmap, in order to take advantage of locality in space; data area: part of a volume storing files, directories and other file system objects; directory: a special file storing a list of directory entries; directory entry: a structure containing a file name and location; inode structure: a structure containing fundamental information about a file. The inode structure of a file is stored in the first block of the file; inode number: the block number of the first block of a file, that is the block containing the inode structure of the file. The inode number must uniquely identify a file on a volume; extent: a contiguous addressable portion of a file, specified by a starting block and a size; fork: a special file, associated with another non-fork file, storing a list of extended attributes; extended attribute: a structure containing an arbitrary name-value pair of metadata; The C++ syntax is used for code snippets and structure formats, with stdint.h integral types. The char type is assumed to be 8-bit. Hex numbers are prefixed with 0x; Unless otherwise stated, all numbers must be stored in little endian format (least significant byte first). Partition identifier On the i386 platform, each file system is identified by an 8-bit number in an entry of an MBR partition table. The value 0xEA (after LEAN) has been proposed as it seems unassigned. For GUID partition tables the following GUID is provided to identify a LEAN data partition (placed in the GUID Type field): bb5a91b0-977e-11db-b606-0800200c9a66 Block size This file system uses an arbitrary sized allocation block, not necessarily fixed to the size of the disk's sector size, though with larger sector-sized disks becoming available, larger block sizes equal to the sector size will have a large advantage. The Block Size is specified in the Superblock and must have a size of a power of two equal to or greater than 256. It is recommended, but not mandated, that a block size match the sector size of the disk. A default size of 512 bytes is recommended for most disks. One such advantage of larger block sizes is that since an Indirect Block uses all remaining space within the block for extents, a larger block size will use less Indirect Blocks on heavily fragmented files. With a 4096-byte sector and block size, many Indirect extents can be read with one read operation. If the block size does not match the sector size, the implementation must use sector buffering, and its implementation is not defined by this specification. For simplicity and for less prone to corruption, it is highly recommended that a block size does not exceed the sector size of the disk. Structure identification and checksum Several structures of LEAN include fields to make the file system more robust. Sensitive structures, such as the Superblock, Inode, or Indirect Block, each store a checksum field in their first 32 bits. The checksum is computed on any data following the checksum field itself, up to the end of the sensitive structure and/or block. Other areas might also contain checksums. The area to check must be cast to an array of 32-bit unsigned integers, then each element of this array must be summed, rotating the sum one bit to the right at every iteration. The size of the area to check must be a multiple of 4 bytes. The checksum must be recomputed at least every time a sensitive structure or data area is written back to disk. The following functions shows how to calculate the checksum. The data parameter is a pointer to the sensitive structure (including the checksum field in its first 4 bytes), or the data area to be checked. The size parameter is the size in bytes of the structure pointed to by data, including the 4 bytes for the checksum field if it is a sensitive structure. It must be a multiple of 4 bytes. The function skips the first 4 bytes when computing the checksum if the isSensitive parameter is non-zero. When calculating the checksum on the bitmap, either read in each band's bitmap, consolidating to one contiguous buffer and then call computeChecksum, or keep a running total, initially setting res to zero, read in each band's bitmap and call computeChecksumPartial, sending res each remaining time. /* Compute the Checksum of an area. * data -> Sensitive stucture or data area to be checked. * size = size in bytes of area. * isSensitive = non-zero to skip first 32-bit entry (is a Sensitive structure) */ uint32_t computeChecksum(const void *data, const size_t size, const bool isSensitive) { uint32_t res = 0; if (isSensitive) { assert(size >= sizeof(uint32_t)); res = computeChecksumPartial(res, static_cast<const uint8_t *>(data) + sizeof(uint32_t), size - sizeof(uint32_t)); } else { res = computeChecksumPartial(res, data, size); } return res; } /* Compute the Checksum of a partial area. * res = running checksum of last checked area. * data -> Sensitive stucture or data area to be checked. * size = size in bytes of area. */ uint32_t computeChecksumPartial(uint32_t res, const void *data, size_t size) { const uint32_t *d = static_cast<const uint32_t *>(data); assert((size & (sizeof(uint32_t) - 1)) == 0); size /= sizeof(uint32_t); for (size_t i = 0; i != size; ++i) '''
