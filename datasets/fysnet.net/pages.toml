["https://www.fysnet.net/bochs/user/diskimagehowto.html"]
title = "How to make a simple disk image"
full_description = '''This was contributed by Greg Alexander in October 2001 and updated by Volker Ruppert in October 2013. A FreeDOS boot disk, or a boot disk from another OS capable of producing DOS partitions (e.g. a Linux install disk). You will need to know the geometry of the disk you want to create. You have to compute the disk sector count: When you update your configuration file, please fill in the same cylinders, heads, and sector per track values. Since we are creating a hard disk image, accept the default of hd by pressing Enter or typing 'hd' and pressing Enter. Next, bximage will ask for the type of hd to create: We want to create a simple flat image, so accept the default by pressing Enter. Then, bximage will ask for the size of the disk image you want to create, in Megabytes: Enter the size of the hard disk you want to create, and press Enter. Then bximage will ask you for a filename to use for the file it is creating. At this point, type in the filename you want to use for the image. The default of "c.img" is appropriate if this will be your only hard disk image. After you have typed in the name of the filename you want to use, press Enter. Bximage will tell you it is writing the disk and then it will show you a line that should be added to your bochsrc when you want to use this disk image. I named my 10 Megabyte image "teaching.img" and the output of bximage looked like this: At this point, a file called "teaching.img" was created in my current directory and is ready to be used as an image file for a Bochs session. Tip: You may want to name your image teaching_20-16-63.img so that you always know the values to use for CHS. First, you need to edit the bochsrc file that Bochs uses for configuration information (see Section 5.2). Open bochsrc with a text editor. Remove all lines in the file which start with "ata0-master:". Add the "ata0-master:" line that was displayed when you ran bximage to bochsrc at the same place where you removed the old "ata0-master:" lines from. Also, you need to download or create a FreeDOS (or DOS, or Windows, or Linux) disk image. Modify the "floppya:" line in your bochsrc to point at the downloaded FreeDOS floppy image and change its status to "status=inserted".'''
