title = "Win32 only: Tools to manipulate disk images"
full_description = "Someone on the bochs-developers mailing list mentioned that they use a program called WinImage, from www.winimage.com to read and write disk images (floppy and hard disk). Winimage is a commercial product with a 30-day trial. I eventually found what all of you were looking for for a long time: a freeware, graphical, win32 compatible HardDisk image editor! It can handle a large variety of formats, but the one you need is VMWARE 2.0 PLAIN DISK: you can import/export to/from Bochs images COMPLETE DIRECTORIES! Inserting, extracting, and deleting files from said file systems. (some file system support is currently read-only)"
