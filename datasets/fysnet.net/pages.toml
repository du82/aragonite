["https://www.fysnet.net/blog/2023/09"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''First, I have made some updates to the USB emulation of the Bochs emulator, with the latest code at my fork and information page. Along with a few fixes and enhancements, the big addition is the start of the USB Debugger. It will allow you to stop the emulation and view the statistics of the USB controller. For example, view and/or modify an xHCI Command Ring TRB before the controller sees it. See this page for an example. Currently only the xHCI is included, but work on the UHCI has begun, and the other two emulated controllers are in the works. Back in June, a fellow reader had stumbled across my Sectors Across a Serial Line utility and told me that it was exactly what they were looking for, though had a question about it. I tried to reply, but the email bounced back. I used a different email address and server and the reply didn't bounce, but I go no response back. Hope the reader received my reply and was able to get the utility to work. However, I had completely forgot about this until today, when I came across a link to my utility on a forum I haven't visited before. After going to the utility page myself, I noticed that it wasn't really well documented, so today I updated it a little. I also came across an old post at hackaday (direct link to demo page) I haven't seen in some time, though am so impressed with the work that must have had been done to do something like this. This demo, which included the image above, was done on an x86 8088 machine with a CGA adapter. The hackaday link above has a video of the demo. The documentation for it states that it won't run on any emulator. Knowing that is going to be a very true statement, has any one heard the statement "challenge accepted"? Maybe I might just have to see why...Maybe. And finally, if you have visited my page in the no-so-recent past, you might remember the x86 size-coding competitions I participated in. They were an enjoyable out, away from work, something to keep my attention on programming. Recently, Adok has added another, though unfortunately it hasn't drawn the attention as the older ones did. I am not surprised, but am a little disappointed. It hasn't drawn enough attention to warrant a standard set of rules. Anyway, I am (currently) in second place, though with only three entries, that doesn't say much. :-) Anyway, thanks to all my readers. This is a very interesting and fulfilling hobby of ours.'''
