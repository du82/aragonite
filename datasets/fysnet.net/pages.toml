["https://www.fysnet.net/blog/2017/12"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "Best wishes for everyone as the new year approaches. Good progress is being made on Volume 8 and the UAS Protocol. There is a little work here and there on misc additions for the other volumes. Happy New Year to all. As a side project, I decided to see if I could get Bochs to install and run Win 8.1. After about two days of emulation, reboots, and a single fix, I got Win 8.1 to install, boot, and run. (Click on the image to view full size) The date of 2014 (2nd image--bottom right corner) is actually correct, since I told Bochs to use that date. No reason other than I wanted to be sure it would. Just a few updates: I have made progress on the work of the new USB Attached SCSI (USB UAS) protocol. More progress to come. I also want to wish everyone a Merry Christmas."
