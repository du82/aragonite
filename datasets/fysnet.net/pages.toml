["https://www.fysnet.net/blog/2013/06"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "The other day, my office network went down. Nothing. So I looked at the Dell PowerConnect 2016 and all of the LED's were lit up. So, as anyone with our interest, I opened it up. I found two of the caps on the power supply were bulging. Again, since I was ordering a few other parts, I added a couple of 680 uF 10V caps to the list. When they came in, I swapped out the two caps and plugged it back in. No difference. I went looking for information. Come to find out, this is a common error with this model. Oh well, the thing lasted more than 10 years. Luckily I had a spare 16-port unmanaged switch underneath it. I checked the power supply and it puts out a managed 3.322 volts. I think I will rip it out and use it in a different project. Since I needed a few other parts from Mouser, I ordered an ATTINY13A and a batt holder so that I could make the simple project at Karl Lunt's page (no relation as far as I know). He states that with a fully charged battery, this project should work for more than 2 years. I think I will put it on my bookshelf and find out. (Karl, if you see this, please send me an email.)"
