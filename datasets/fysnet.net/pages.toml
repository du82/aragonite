["https://www.fysnet.net/blog/2022/04"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "I have recently been looking over my FYSOS project and have come to the conclusion that it deserves a complete re-write. Most of the code still has legacy support and hacks and other items from years ago. It is finally time to abandon any legacy support, such as text mode, Legacy BIOS, 32-bit, PIC, PIT, FDC, etc., and only support any modern hardware, less than 10 years old. I will now only support 64-bit Long-mode, UEFI, APIC/MSI, USB, SATA (AHCI), and other hardware that most modern machines of today, contain. Anything that is 10 years old or older, will be abandonded. Mostly...Being my main interest is USB, I think I may still support UHCI and OHCI :-)... Thank you for all the support I have received in the past. I will see if I can get this new code-base out within the next few years. We shall see. Interests have changed in the past few years, namely grandkids.... :-) I have recently updated my FontEdit app to support Grub PFF2 fonts. You can load the Grub PFF2 font format and modify the characters. However, at the moment, you can only save it as one of the other three formats supported. I haven't added the code to save back as a PFF2 font yet. Please let me know if you find any issues with it. If you create a font of your own, please let me know. I would like to see it and with your permission, post it for others to use."
