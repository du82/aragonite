["https://www.fysnet.net/bochs/user/using-sound.html"]
title = "Using sound"
full_description = 'Bochs supports two types of soundcards (SB16 ISA and ES1370 PCI) and the legacy PC speaker. The lowlevel sound interface provides a set of functions for wave (PCM) input / output and MIDI output using the host sound system. A driver must not implement all of these functions. The following table shows the supported drivers and their features. When compiling Bochs, the lowlevel sound support is activated if one of the soundcards is enabled (--enable-sb16 or --enable-es1370). The configure script detects the available drivers and sets up a platform-default one. At runtime the lowlevel sound module will be loaded automatically if one of the sound devices are enabled in the bochsrc file. The drivers and devices for wave input / output and MIDI output must be set up with the sound option. The PC speaker is connected to the PIT 8254 timer #2 and generates a square wave beep with a frequency depending on the timer value. In Bochs the speaker is a separate plugin that is controlled by the two events "beep on" and "beep off". The "beep on" event is also called when the frequency changes while turned on. The destination for the speaker output can be selected with the mode parameter of the speaker option. Three choices are available: sound : the beep is generated by the square wave generator which is a part of the lowlevel sound support. system : only available on Linux and Windows. On Linux /dev/console is used for output and on Windows the Beep() function. Most of the SB16 configuration parameters are available in the runtime configuration menu or dialog. In addition to this, there is a small program called SB16CTRL to change emulation settings from inside the simulation. Unlike other devices, the SB16 emulation has its own logfile and a loglevel parameter to control what should be printed there. Both the log file and loglevel parameters can be changed at runtime. See the sb16 bochsrc option for details. The dmatimer parameter controls the DMA timing for wave (PCM) input and output. When you get non-continuous sound, this value can be ajusted to fix this. This needs a reasonably correct setting for the cpu: ips option.'
year_published = 2025
clearnet = "https://www.fysnet.net/bochs/user/using-sound.html"
