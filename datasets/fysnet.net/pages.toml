["https://www.fysnet.net/blog/2016/12"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "Are you working on remaining titles of the FYSOS series? That is a question I receive quite often. Currently I am working on a few small additions to Volume 1, a fix and small additions to Volume 3, and a couple updates to Volume 8. These additions should be in the errata for each volume when I finish them. Each errata is freely available on their respected page: https://www.fysnet.net/the_system_core.htm https://www.fysnet.net/media_storage_devices.htm https://www.fysnet.net/the_universal_serial_bus.htm Volume 5, the PCI(e) is in the works, but not ready for release. I have a bit of work to do yet. Volume 7, the Network Interface, is also in the works, but not as far along yet. I still have quite a bit of work on it too. Thank you everyone for your interest, support, questions, and comments. I will be sure to announce any major additions. Thank you. I have added a few items to a future release of my USB: The Universal Serial Bus book. Have a look at this PDF for more information. I plan on documenting what I add via that PDF as progress is made, though it might be a while before the next version is released as time and interest allows. Thank you all for your support."
