title = "eMBR partitioning system specification 1.05"
full_description = '''the LEAN file system Part of the FYSOS project Overview Specification Downloads eMBR partitioning specification 1.05 Version 1.05, last update: 2023 January 11 Copyright © 1984-2025 by Forever Young Software Permission to make and distribute verbatim copies of this specification, translations of this specification into another language, and derivative works that comment on or otherwise explain it or assist in its implementation, for any purpose and without fee or royalty is hereby granted, provided that the present copyright notice, licensing terms and disclaimer are preserved on all copies. In addition, the Author covenants not to assert any claims on implementations of this specification, unless such implementations contain derivative work of implementations by the Author, for which specific licensing terms may apply. THIS SPECIFICATION IS PROVIDED "AS IS," AND THE AUTHOR MAKES NO REPRESENTATIONS OR WARRANTIES, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, NON-INFRINGEMENT, OR TITLE; THAT THE CONTENTS OF THIS SPECIFICATION ARE SUITABLE FOR ANY PURPOSE; NOR THAT THE IMPLEMENTATION OF SUCH CONTENTS WILL NOT INFRINGE ANY THIRD PARTY PATENTS, COPYRIGHTS, TRADEMARKS OR OTHER RIGHTS. TO THE FULLEST EXTENT PERMITTED BY APPLICABLE LAW, THE AUTHOR WILL NOT BE LIABLE FOR ANY DIRECT, INDIRECT, SPECIAL, INCIDENTAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF ANY USE OF THIS SPECIFICATION OR THE PERFORMANCE OR IMPLEMENTATION OF THE CONTENTS THEREOF. No other rights are granted by implication, estoppel or otherwise. This document describes version 1.05 of the eMBR partitioning system: a free, simple, fully featured disk partitioning system. The eMBR partitioning system is in the release development stage: this document supersedes any previous version of the specification with no care for backward compatibility. Since this is a unique partitioning system, and some aspects are still to be defined, suggestions or corrections are welcome, for either the partitioning system or this document. Please contact the author at: fys at fysnet.net. The author wishes to thank those who have submitted comments and criticism in order to improve the eMBR partitioning system. This document contains the formal specification of the eMBR partitioning on-disk format. For an overview of emBR and for downloads, please see the eMBR home page. Table of contents Differences from the previous versions Definitions Binary Multiples Structure identification and checksum Layout Legacy MBR eMBR Partition Start eMBR Partition Header eMBR Partition Entry Requirements User interface Things to consider Differences from the previous versions version 1.05 Official Release: Official release version 1.05 (2023 January 04) limit the code size: Added limits to the sect_offset and remaining fields (2023 January 10) version 1.04 Source code fix and added functionality: (2015 Sept 28) version 1.03 Minor clarifications: (2015 Jan 03) version 1.02 Minor clarifications: (2013 Oct 06) version 1.01 Minor clarifications: (2013 June 30) version 1.00 Initial Release: Initial release (2011 June 14) Definitions The following terms and conventions will be used throughout this specification: must, must not, should, should not, may: these words are to be interpreted as described in RFC 2119; reserved for future use: a data field that has not yet been defined. When creating a new entry that field must be written as zeros. When reading an existing entry, a driver must not make assumption about the content of that field. When writing that field to an existing entry, a driver must preserve the value in that field; byte: a group of eight adjacent bits, an octet; driver: firmware or boot code, or any other part of the operating system, or any application implementing this specification to access an eMBR partitioning system; disk: a block device hosting an eMBR partitioning system. This wording is used for simplicity, although that device does not need to be an actual disk memory (e.g. hard disk, memory card, RAM disk). Drivers must limit disk sizes to 264-1 sectors; volume/partition: a group of contiguous sectors containing a self-contained file system on a disk; sector: an allocation unit, an arbitrary number of bytes, singly accessible, read or written, by a device controlling the media of the disk. This is the smallest number of bytes accessible per physical access of the media, by default usually being a 512-byte sector. This must be a power of two equal to or greater than 512; The C++ syntax is used for code snippets and structure formats, with stdint.h integral types. The char type is assumed to be 8-bit. Hex numbers are prefixed with 0x; Disk addressing is in the form of Linear Base Addressing, or LBA, and is zero based from the start of the disk. Cylinder/Head/Sector (CHS) addressing is only used in the MBR at LBA 0. Unless otherwise stated, all numbers must be stored in little endian format (least significant byte first). Binary multiples Table 1 below shows the Binary Multiples and their names which may be used within this specification. Binary multiples nameSymbolValue (Binary)Value (Decimal, General disk size labels) Kilok/K210 = 1,024103 = 1,000 MegaM220 = 1,048,576106 = 1,000,000 GigaG230 = 1,073,741,824109 = 1,000,000,000 TeraT240 = 1,099,511,627,7761012 = 1,000,000,000,000 PetaP250 = 1,125,899,906,842,6241015 = 1,000,000,000,000,000 ExaE260 = 1,152,921,504,606,846,9761018 = 1,000,000,000,000,000,000 ZettaZ270 = 1,180,591,620,717,411,303,4241021 = 1,000,000,000,000,000,000,000 YottaY280 = 1,208,925,819,614,629,174,706,1761024 = 1,000,000,000,000,000,000,000,000 Next would be Ronna then Quetta, but who needs more than 64k of RAM anyway! Structure identification and checksum Some structures of the eMBR specification may include a field to make the partitioning system more robust. A sensitive structure, such as the partition header, may store a checksum field and is computed on a specified block of data. The definition and technique to calculate this checksum is defined by the official CRC-32 standard. The checksum must be recomputed at least every time a sensitive structure or data area is written back to disk. The following functions show how to calculate the checksum. The data parameter is a pointer to the data area to be checked. The size parameter is the size in bytes of the structure pointed to by data. A driver must initialize the crc32_table once before calling any of the remaining routines. A call to crc32_initialize() may be used. Please note that the checksum field in the partition header must not be included in the checksum calculation. Initially setting this field to zero will allow it to be a part of the check. /* Predefined polynomial */ #define CRC32_POLYNOMIAL 0x04C11DB7 /* Lookup table. Must be pre-initialized. */ uint32_t crc32_table[256]; /* Initialize table. * no parameters */ void crc32_initialize(void) { // 256 values representing ASCII character codes. for (int i=0; i<256; i++) { crc32_table[i] = crc32_reflect(i, 8) << 24; for (int j=0; j<8; j++) crc32_table[i] = (crc32_table[i] << 1) ^ ((crc32_table[i] & (1 << 31)) ? CRC32_POLYNOMIAL : 0); crc32_table[i] = crc32_reflect(crc32_table[i], 32); } } /* Reflection: * reflect = current value to process * ch = size in bits of value * (Reflection is a requirement for the official CRC-32 standard. * You can create CRCs without it, but they won't conform to the standard.) */ uint32_t crc32_reflect(uint32_t reflect, char ch) { uint32_t ret = 0; // Swap bit 0 for bit ch-1, bit 1 For bit ch-2, etc.... for (int i=1; i<(ch + 1); i++) { if (reflect & 1) ret |= 1 << (ch - i); reflect >>= 1; } return ret; } /* Compute the checksum of an area. * data -> data area to be checked. * len = count in bytes of area to check. */ uint32_t crc32(void *data, uint32_t len) { uint32_t crc = 0xFFFFFFFF; crc32_partial(&crc, data, len); return (crc ^ 0xFFFFFFFF); } /* Compute the checksum of a partial area. * crc -> running checksum value. * ptr -> data area to be checked. * len = count in bytes of area to check. */ void crc32_partial(uint32_t *crc, void *ptr, uint32_t len) { uint8_t *data = (uint8_t *) ptr; while (len--) *crc = (*crc >> 8) ^ crc32_table[(*crc & 0xFF) ^ *data++]; } Some structures also contain one or more magic fields storing a 32-bit constant signature identifying the structure. This can be used as a first test to validate a sensitive structure. Figure 1: Layout of an eMBR partitioned disk. Layout A typical eMBR partitioned media device would contain two or more partitions, each just after the other, all listed in the eMBR headers. At boot time, the eMBR application would load the specified amount of sectors into memory to be able to enumerate the partitions, and display the partitions in a form that the user could choose which partition to boot. The eMBR app would also watch for a key press from the user. If a key press was not found within the specified amount of time, the eMBR app would boot the partition that was most recently booted. This specification will show the required format and steps to create and boot the eMBR partition scheme and show the format of the partition entries. It is outside this specification on what type of firmware is used to boot from the eMBR partitioned device. If a legacy firmware is used, it is assumed to be a 16-bit Intel® x86 style firmware. Figure 1 shown to the right, shows a typical layout for an eMBR partitioned disk. The format of the first few sectors of the disk must follow the outline within this specification. Once the eMBR format is complete, the format of the remaining sectors of the disk is outside this specification. This specification does not limit the sector size to 512 bytes per sector. However, please note that with the MBR explained below and the offset of the Signature Block within the first sector of the eMBR partitioned area, the sector size is assumed 512. Therefore, if the sector size is more than 512, these offsets remain at the locations as indicated within this specification. Legacy MBR The first sector of the disk must contain a Legacy Master Boot Record. The format of this MBR must follow the format originally designed for PC DOS 2.0 in March of 1983. It may contain more modern features but must maintain the standard partition entry table starting at offset 0x01BE. This MBR must contain these four partition entries, with the first one starting at offset 0x01BE, and must contain the standard boot signature at offset 0x01FE, a byte of 0x55 at offset 0x01FE followed by a byte of 0xAA. The first partition entry must point to the second sector of the disk, LBA 1. This partition table entry must have the values listed in Table 2 below. First Legacy Partition Entry uint8_t boot_indicatorThis value, when set to 0x80, instructs a legacy firmware that this partition is a bootable partition. For legacy systems, this field must be 0x80. For UEFI systems, this field can be ignored. uint8_t start[3]This is the Legacy CHS value for the start of this partition. This field must be 0x00 (head), 0x02 (sector), 0x00 (cyl) respectively. uint8_t sys_indicatorThis is the System Indicator. This field must have a value of 0xE0. This is an otherwise unused value that I have chosen for this specification. uint8_t end[3]This is the Legacy CHS value for the end of this partition. This field might be 0xFF, 0xFF, 0xFF respectively, though read a later note for why it may be different. uint32_t start_lbaThe starting sector of the partition. this field must have a value of 0x00000001. uint32_t countThis is the count of sectors used for this eMBR partitioning scheme starting at LBA 1. This field might have a value of 0xFFFFFFFF The values in the other three partition entries are not defined within this specification. A driver may use the other three entries to boot other partitions. This specification does not require that the eMBR be the only bootable partition. However, see the notes on "other partitions entries" below. Please note that it is not a requirement for the Ending CHS and Sector Count fields to be the values defined above. If the disk is not larger than the amount specified, you must use the actual size values to denote the size of the disk. However, if the disk has less than 232 sectors, there would be little reason to use this specification. Definition of any other part of the Legacy MBR is outside this specification. An implementation may choose to place code within this Legacy MBR to boot one of the included partitions, as long as that partition is within the location and size specifications of a Legacy partition specification. A Legacy boot code must not modify any part of the sectors described within this specification. eMBR Partition Start The eMBR partition scheme must start at LBA 1 of the disk. When booted with legacy firmware, within these first few sectors is the code to load the remaining sectors that contain the eMBR Partition Entries, along with the code to display and allow the user to select which partition to boot. This specification limits the amount of sectors reserved for this code and any eMBR partition entries. See the end of this section for information on this limit. When a modern UEFI firmware is used, only the first sector is required, allowing the remaining sectors to be used for entries. The first sector of the eMBR partition scheme, LBA 1, must contain the following information at offset 0x01F2, shown in Table 3 below. Remember that any code before this offset must jump over this memory block when continuing any (optionally) remaining code. Table 3: eMBR Signature Block uint8_t signature[8]This is the eMBR signature defining this block contains valid values. It must be checked before proceeding. This field must contain the string 'EmbrrbmE' = 0x456D627272626D45. uint16_t sect_offsetThis is the sector offset to the eMBR Partition Header Block, relative from LBA 0. This limits the count of sectors for the boot code at LBA 1 to 65,534 sectors. This value must be at least 2, leaving one (optionally) used sector for the code and this required Signature Block. See the note below for why this field may be limited. uint16_t remainingThis is the count of sectors remaining that must be loaded to include all of the code (not counting this first sector), the eMBR Partition Header, and all of the eMBR Partition Entries that are within the containment of this eMBR partition. A Legacy firmware driver must load these sectors into memory, following the current sector, to be able to read and parse the available entries to display and boot. An UEFI firmware driver must load count = ((remaining + 1) - (sect_offset - 1) + 1) sectors from sect_offset. See the note below for a limit on this field. uint16_t legacy_sigThis is the Legacy boot sector signature, 0xAA55, of offset 0x01FE of the sector (in little-endian format). The remaining area from LBA 1 to the LBA specified by 1 + remaining, not counting the'''
