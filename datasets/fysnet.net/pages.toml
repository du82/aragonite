full_description = "the eMBR partitioning system Part of the FYSOS project Overview Specification Downloads Downloads A reference implementation of eMBR partitioning system software is available in two forms.They include: a tool to create and modify eMBR partitioned image files; source code for a simple legacy bootable UI for the eMBR partitioned disks. Ultimate The first form is a Windows-only implementation, 32- and 64-bit versions, giving a GUI interface allowing you to manipulate the eMBR partitioned image. This utility is shown at https://www.fysnet.net/ultimate/index.htm and the source code and binaries can be downloaded via github. Bootable UI source The second form is an implementation written in x86 assembly, giving an example legacy bootable UI ready to be placed in the boot code section of an eMBR partitioned disk. The source code is available below. Reporting bugs To report bugs, please contact the author at fys [at] fysnet [dot] net. Thank you for your help. Demo eMBR boot UI The provided compressed archive contains example eMBR bootable x86 assembly source code. Uncompress the archive in a directory of your choice and follow the included instructions to see the demo. Download 18 Kb fysos_embr.zip Lastest update: 10 Jan 2023"
