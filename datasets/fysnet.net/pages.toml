["https://www.fysnet.net/blog/2019/05"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "First, for those of you here in the States, Happy Memorial Day. My love and respect goes out to all of those who have paid the greatest debt to protect their country, whether it by this fine country or not. I have been working on the 64-bit version of my operating system and have made good progress. I have re-written many parts to make it more efficient and easier to use. With this in mind, I can now start to document my findings. For example, something that I wasn't aware of is that an interrupt on the 64-bit machine pushes the SS and RSP registers whether it is a protection change or not. Normally, these registers are only pushed on the stack with a protection change. The 64-bit does it unconditionally. Anyway, just a heads-up that I am continuing to work on it and hope to have results soon. Thank you again for all of your comments and suggestions. I am grateful. First, let me apologize for the lack of posts to this blog. It has been a while. Please be assured that I am still working on the series and still have been committing updates as I find the time to do so. With many recent requests, I am now working on a revised format so that I can combine both the 32-bit and 64-bit documentation within Volume 1 as one book. i.e.: Whether you are learning how to build a Legacy BIOS/32-bit operating system or a modern, UEFI driven 64-bit system, you can use the same book(s). Currently, there is no set date for the release of the new format, but feel free to still send in questions and comments. Thank you again for all of your comments and suggestions. I am grateful."
