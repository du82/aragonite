["https://www.fysnet.net/bochs/user/using-bximage.html"]
title = "Using the bximage tool"
full_description = 'Bximage is an easy to use console based tool for creating, converting and resizing disk images, particularly for use with Bochs. It also supports committing redolog files to their base images. It is completely interactive if no command line arguments are used. It can be switched to a non-interactive mode if all required parameters are given in the command line. When you run bximage without one of the following options, it will appear in interactive mode and ask for all required parameters to manipulate an image. Disk image mode autodetection does not work for the modes concat and dll. To use those images as convert source, you have to add a prefix ("concat:" or "dll:") to the image path. This function can be used to create several disk image formats for the use with Bochs. See the table above for supported formats (modes). For an example of the usage, refer to Section 9.2. With this function a disk image can be converted from one mode (format) to another. The type of the source image is auto-detected. For the target format it supports the same disk image modes as the create function. If the name of the new image file is not specified or identical to the source one and you have enabled the backup switch, a backup of the source file will be created with its original name plus the suffix ".orig". This function can be used to increase the virtual disk size of an image. It supports the same disk image modes as the create function. Making a disk image smaller is not supported, since it may damage the disk and data will be lost. If the name of the new image file is not specified or identical to the source one and you have enabled the backup switch, a backup of the source file will be created with its original name plus the suffix ".orig". The type of the base image is auto-detected. The name of the redolog file only needs to be specified if it is not based on the base image. If you have enabled the backup switch, backups of the original base and redolog files will still be created with their original name plus the suffix ".orig".'
