title = "Using the 'slirp' networking module"
full_description = '''Slirp is a software program that emulates a PPP, SLIP, or CSLIP connection to the Internet via a shell account. The original version has been written by Danny Gasparovski in 1995. It has been integrated in QEMU to provide user mode networking. Now a port of the QEMU Slirp implementation is available in Bochs. Access to the internet and host network services without root/Administrator privileges or additional libraries. This example shows how to use the 'slirp' module with the NE2000 adapter. The line is very similar for the E1000 or PCI Pseudo NIC. An example for a Slirp config file can be found in the Bochs sources and in binary packages (misc/slirp.conf). With the config file option "hostfwd" you can map guest ports to ports on the host system. This is the format of the directive:'''
