["https://www.fysnet.net/blog/2016/03"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "I noticed the other day that I have had my web site up for nearly 19 years now, and though I didn't start the hits counter until quite a bit later, I have nearly 875,000 unique hits since the middle of 2004, nearly 12 years ago. I have all of you to thank for that. Through out those years, I have had a few webpage services host my pages, the first being a man named Zeke. I was one of his first customers and even helped him put the radio antenna on top of his tower. I was excited to have a web page. I just dug up an old email I had with Zeke about the web page size limit. My service had a 3 meg limit. Yes, 3 megabytes. This was back when 100 Meg disks were the norm. Unfortunately, Zeke passed away in January of 2012. One of the local papers had a small article about him. A few years after I started with Zeke, I moved away from the area and needed a new internet service. This one I will not name since it is still doing business. This ISP offered DSL which was much faster than the 14.4 and 28.8 baud I was getting with Zeke. I got my page up and going and was doing well. Then a while later, this company, who also was the phone service, said I didn't pay them for a few months and shut me down. I had receipts to prove them wrong, but to no avail. To this day, I do not do any business with that company and suggest to others they do not either. Because of that, I now needed a new service. In came Cable One. Their webspace service was much better than the previous service, and I used that service for some time. However, a few years ago, they decided that the webspace service was not worth the trouble and dropped that part of their services. I still have my connection through Cable One, but had to move on to another webspace service. So I went looking around and found my current provider, iPage. They have done very well and I am very pleased with their service. They offer numerous tools and technology to help me get my pages up and going as I want them to. Though not everyone is perfect. I once had an issue with one of their services. After I talked with the customer service rep a few minutes, that issue was resolved and I have never seen it again. They fixed it promptly. As for the space limit, unlimited. No more 3 Meg limit, I can have as much space as I need. Emails? Numerous email addresses. Free Domain Name. Free Security tools. Visitor Stats. You name it, they got it. They even have WordPress, which if I would spend a little time working with it, I wouldn't have to hand write all of these blog pages :-). Below is an example of the web stats page. That is actual data from my statistics page. Last month I had an average of 1,253 unique hits a day. Granted some of those are web search spiders and what not, but move to the end of that month and more than 36,000 hits for last month alone. I am just trying to express my satisfaction of my current web space provider. If you are looking for a provider, I suggest you look into iPage and their services. Right now you can start with only $1.99 a month. How can you beat that? Thank you iPage for your services. I have no reason to go elsewhere."
