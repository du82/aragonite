["https://www.fysnet.net/bochs/user/using-socket.html"]
title = "Using the 'socket' networking module"
full_description = "The original patch for the 'socket' networking module has been written by Mariusz Matuszek in 2003. It supported interconnecting two Bochs sessions running on the same machine via UDP using an external program called 'bxhub'. The 'socket' networking module uses two UDP ports per Bochs session. By default, the first session receives packets from port 40000 and sends packets to port 40001. The second session uses then the ports 40002 and 40003. For further sessions the port numbers are incremented accordingly. The port number for receiving packets is specified with the 'ethdev' parameter of the bochsrc line for the network adapter. The format is host:port for connecting the 'bxhub' utility. If it runs on the same machine ('localhost') the host name can be omitted. These examples show how to use the 'socket' module with the NE2000 adapter. The line is very similar for the E1000 or PCI Pseudo NIC. The 'vnet' server now provides passive FTP support also using the TFTP directory as root. The FTP server name is vnet-ftp. For read only access, the username must be set to anonymous with any password. This mode supports browsing the directory subtree and downloading files. For read/write access, the user must be set to bochs with password bochs. This enables support for uploading, renaming and deleting files, creating, and removing directories."
