["https://www.fysnet.net/faq/index.htm"]
title = "x86 Assembly Language FAQ"
full_description = "This FAQ is (use to be) posted monthly on or about the 21st of the month to the alt.lang.asm, comp.lang.asm.x86, news.answers, alt.answers and comp.answers newsgroups. This is the x86 Assembly Language FAQ for the comp.lang.asm.x86 and alt.lang.asm newsgroups. Currently, this FAQ is broken into six sections. The following are the sections and the scope of each section of the FAQ. To view a particular section of the FAQ, just click on the appropriate link. There are links in the Table of Contents to go to any other FAQ Section, and at the end of every document there is a link to return to the Table of Contents for that FAQ Section. Essentially, once you enter one of the FAQs in html format, you can navigate to any other FAQ Section. There are no links back to this page, though. This is the basic portion of the FAQ that contains information of interest to all assembly language programmers. In general, the information contained in this portion of the FAQ is not specific to any particular assembler. This portion of the FAQ contains information specific for the Shareware A86 Assembler and D86 Debugger. The scope and content of this FAQ is to go beyond just answering the frequently asked questions. I am including pointers to assembly language treasure troves that are hidden out on the internet. I believe that this will enhance the FAQ's value not only to the novices but also to the old hands. These .zip files may lag behind the above files slightly. The current date of these zip files: 24 Jan 2010 The entire FAQ as DOS text files is available to download as a .zip file. Download the zipped FAQ, 64K in size. The entire FAQ as HTML files is available to download as a .zip file. Download the zipped FAQ, 72K in size. I am always looking for contributors to the FAQ. I you see a whole which you would like to fill, please e-mail me with your intensions. This e-mail notification allows me to get back to you if someone else already is working on that subject. I have quite a bit of storage space available for this FAQ list. Therefore, don't be shy with your addition information if details are needed."
