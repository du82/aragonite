["https://www.fysnet.net/bochs/user/get-src-git.html"]
title = "Tracking the source code with GIT"
full_description = '''GIT is a free and open source version control system designed to handle small to very large project efficiently. Git is used to tracking changes in the source code, enabling multiple developers to work together on non-linear development. The Bochs source code and documentation is available using GIT[1] hostet on GitHub. When you have a GIT client installed, the first step is to do a checkout. The initial checkout command is long and ugly, but usually you only have to do it once. The example below shows the GIT checkout process of the Bochs master branch in Unix. On the Windows platform, you can download a GIT client from git-scm.com, or use GIT within Cygwin[2]. Note: This is just an example output of a checkout of specific version of the Bochs trunk and folder. Depending on the checkout command and revision, you most likely will see more/other files. The GIT checkout process (above) gives you a directory called Bochs that contains the very latest source code. I will refer to this directory as $BOCHS. In this directory there's also a subdirectory called ".git" which tells the GIT software where the code was checked out, what version you have, and where to go for future updates. Most developers use GIT to always give them the latest source code. The minute that any developer checks in a change, they are available to everyone else through GIT. You just have to type git pull in the $BOCHS directory, and GIT will retrieve any files and directories that have been changed since you did a checkout. If you update regularly, each update takes a short time because it downloads only the files that changed. See also Getting a release version. The git pull command tells you if any new files have been downloaded from the server, and it also tells you if you have modified any of the GIT-controlled files. As it checks through the source directories, it will list files that have changed. You can also use the GIT checkout command to get the Bochs source code for any release since March 2000. The command is'''
