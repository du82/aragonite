["https://www.fysnet.net/blog/2012/10"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''I received my TI Stellaris LM4F120 LaunchPad today. I am eager to start using it. For now, have a look at Joonas' page. Joonas has assembled one of my, I mean, his password generator. Have a look at his blog. I also received my PS2 breakout board along with my programmer board, have assembled both of them, and will test them soon. I also got some small alligator clips and put on the leads of my solar panel to test the USB charger I assembled earlier. My current project is a 4-port, self powered, independant port power with over-current detection, USB hub. I beleive I have the Gerber files complete, but want to take another look to make sure. Will send to fab in a few days. Here is my "Pulse" project fully assembled. It is very sensitive. A slight move of the finger and it skips a beat. I guess a few adjustments are in order. The camera sure was dark. I will have to see about getting some more light on the board next time. I have 5v0 and Grn on the three pin header along with a "pulse" pin. When the light flashes, power is applied to this pin. This way, I can use my ATTINY2313 Breakout Board, put this pin on PB0 of the breakout board, then send this "pulse" through the USB to the host, calculating the pulse in BPM. Here is my USB charger fully assembled. Now, all I need to do is change out the large car-battery gator clips on the solar panel for the smaller ones and try it out. I already put 9 volts to it and a volt meter on the other side, seemed to work fine, now for the real test, the solar panel and my phone...However, the sun must be out, right? The easiest way to find if there is current on a board is to put an LED on it. However, you have to limit the amount of current to the LED or you will burn it up. To limit the amount of current, you can put a resistor just before or just after the LED. It is very simple to calculate how much ohms the resistor needs if you know the source voltage, the LED's voltage, and current (amps) used. In the example below, we have 5v0 as the source voltage and an LED that is rated at 2v6 and uses 30mA. With this calculation, we know we need an 80 Ohm resistor. Since an 80 Ohm resister is not a common Ohm rating, you can always move to the next common rating, for example, 82 Ohms. This is why you see an 82 Ohm resistor in most of my boards. I use LED's that use 2v6 and 30mA.'''
