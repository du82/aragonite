["https://www.fysnet.net/blog/2014/07"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''I finally was able to get back here to the fun stuff, and dug out the parts I recently received from Newark. I am very pleased in the packaging they arrived in. The resistors are the nice little resistors that take up very little real estate (Mouser doesn't stock some of the ohms I buy in this size from this manufacturer). Everything was well marked and protected from static. If you have not bought parts from Newark yet, I suggest you give them a try. I decided to revisit an older project I started a while back. With the new parts from Newark, I was able to build a working model. It uses the ADC (Analog to Digital Convertor) of an ATTiny45 to measure the millivolts given by a LM34 temerature sensor. While doing this, the ATTiny45 waits for the host to request an HID report. Once found, it sends this information, letting the host convert to a Fahrenheit degree value. It is a fairly simple build and shows how to use the ADC along with sending the data back to the host via the USB hardware. This blog post will show you what you will need to build it, how to build it, and then how to write the software (firmware) to occomplish this. Continue reading... I received confirmation that my parts for my next project are on their way. I have an idea of the project, but have not gotten to the details. Once the parts from Newark arrive, I will be able to determine the details. I have a Newark Catalog on my shelf. The thing is two inches thick. It is a little old, but has a huge listing of many parts. If you are serious about electronics, I would give them a call and see if they will send you one. It has been most helpful for me. Please go to my page at https://www.fysnet.net/usb_help.htm and see if you can offer some help with my next edition of "USB: The Universal Serial Bus". Continued from last months post, I have made an order for numerous parts from Newark and am anticipating their arrival. It will be interesting to see the size and shape of the resistors, the resinator, crystal, and other items. More to follow when they arrive.'''
