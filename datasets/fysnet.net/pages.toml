["https://www.fysnet.net/bochs/user/guest-winxp.html"]
title = "Windows XP"
full_description = "Please read the message regarding software licenses in Section 1.6 before you install Windows XP as a guest operating system in Bochs. Windows XP has been reported to install from the CD-ROM, and run inside Bochs. Here are a few settings that seem to work well when running on a Windows10 host, running at 3.0Ghz. Also don't set it to more than 250,000,000. Anything faster and WinXP seems to stall within the CPU loop function. WinXP seems to work well with an IPS setting of 75,000,000 on a 3.0Ghz host. The 64-bit version of WinXP needs Bochs compiled with ACPI support even though you only set to one CPU. For some reason, writing to a USB disk in WinXP, where the write takes a little while, WinXP will think it is an error since it didn't complete fast enough, displaying the error. I don't know why."
