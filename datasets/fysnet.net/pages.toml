["https://www.fysnet.net/bochs/user/harddisk-modes.html"]
title = "Disk Image Modes"
full_description = '''Bochs can handle independent disk image format for each disk present on the ata interfaces. The disk image type is selected in the configuration file by the "mode" option of the ataX-xxx directives. Example: The "path" option of the ataX-xxx directive in the configuration file must point to the flat image file. Flat mode is Bochs default harddisk layout. This is also the layout of disk images provided on Bochs websites. Disk images for the usage in 'concat' mode can be created as 'flat' mode image files with the bximage utility (see Section 9.22 for more information). The "path" option of the ataX-xxx directive in the configuration file must point to the first file (e.g. win95-1). The lower layer files names are found by adding 1 to the last character (e.g. win95-2, win95-3, etc.). If every single file contains a complete partition, they can be accessed with same tools as the 'flat' mode images. If the partition sizes and file sizes are set up correctly, this allows you to store each partition in a separate file, which is very convenient if you want to operate on a single partition (e.g. mount with loopback, create file system, fsck, etc.). This mode is only useful for developers and needs an additional win32 / win64 DLL loaded by Bochs at runtime. Large hard drive can be created, and only used space will be stored in the file. In practice, on Unix, this is not a large gain as it is done anyway. Multiple sparse drive images can be mounted on top of each other. Writes go to the top image. This allows several similar configurations to share a master "base" file, and also allows file system rollback or no-write options. Up to 10 disk images can be layered on top of each other. Sparse disk images must be created with the bximage utility (see Section 9.22 for more information). Be sure to enter "sparse" when selecting the image type. The "path" option of the ataX-xxx directive in the configuration file must point to the top layered file. The lower layer files names are found by substracting 1 from the last character (must be a digit)'''
year_published = 2025
