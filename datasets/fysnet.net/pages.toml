["https://www.fysnet.net/blog/2018/08"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''The other day I found a couple of cheap 6-button mice for sale at a discount/outlet store. I bought two just for the fun of it. I then plugged one in to my test machine and wouldn't you know it, I found a bug in my USB driver. As always, I like to continue to test my code and especially my knowledge and test with all the hardware I can get my hands on. Therefore, if you have any USB devices: mice, keyboards, thumb drives, hubs, anything; that you don't use anymore, I would greatly appreciate it if you would send it my way. If you run across a yard sale with numorous items and wish to send them my way or maybe a URL on ebay/amazon/another web site of someone selling their used/unwanted USB devices for cheap, please let me know. If your contribution helps the cause, I will be sure and include your name in the next edition of my book, just as I have with the previous contributors. You can send them to: Ben Lunt 321 Pinedale Rd, Box 875 Taylor AZ 85939-0875 USA If you found this site to be helpful, interesting, or simply just wish to contribute or donate, you can purchase one or more of my books. In a roundabout way, you are donating to the cause and you get something in return. If you have a pre-teen aged young one that likes camping, you might like another one of my books as well. If you don't have anything you wish to send, or would just like to say thank you, you can also make a monetary donation via Paypal. Thank you. Going along with the Lunchbox post below, I wanted to preserve the contents of the hard drive. If it was a modern machine, I could have simply written a simple app (not counting the many I could have downloaded) to read each sector of the disk and save it to a USB thumb drive. Easy, right? Well, this isn't a modern machine and no USB. With this in mind, if I read each sector and try to save it to the disk, the disk itself will fill up fast, let alone write to sectors I have already read. It doesn't have another HDC slot either, so no Slave drive...Where do I send the sector data? I got out my Serial Port notes and wrote a small/quick app to send these sectors across a serial line to another computer with a hard drive large enough to hold the disk image. Have a look at my git page for the code. For the receiver, I used a standard x86 desktop machine running Windows XP (with a DOS session), with the following command line: mcopyata /r /c 1 For the sender, you guessed it, it is the Lunchbox described on a previous post. I used the following command line: mcopyata /s /x 0 /l 205360 /d 0x80 /c 2 /M This code is designed to read up to 127 sectors at a time (though reading whole tracks only), sending the data across the line. It sends and receives 32-byte packets for services such as: "Okay, I'm ready", "Okay, I will send a buffer of 'count' sectors", "Okay, I received it, send the next", etc. It needs work. For example, I don't check for timeouts (the machine will wait for a character indefinitely), as well as other errors. I only needed it to copy the whole drive. Once I did that, the task was over. No need to make it any more robust. If you use this code, you might need to slow down the baud-rate, transfer a sector at a time (the /m command parameter), and/or modify the code a little to get it to work for your particular situation. I would like to know if you do use it and how it worked.'''
