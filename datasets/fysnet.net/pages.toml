["https://www.fysnet.net/bochs/user/bochsopt-usb-debugger.html"]
title = "USB Debugger"
full_description = '''Currently only none, uhci, or xhci can be specified as the type. Future additions will include the other two controller types. The USB Debugger also has a button-bar icon that when clicked will trigger the debugger. However, please note that if the debugger is currently unavailable, due to the controller state for example, the icon will change to squiggly lines and then at the next available controller state, the debugger will display. If the icon has an 'X' through it, the debugger is unavailable. If you modify any value within the debugger's display, any change that might trigger a change to the controller's state will take place. For example, if you change the Current Connect Status and the Current Enable Status, both will be triggered at the same time by the controller. To keep this from happening, change one and hit the Apply Button. Then trigger the debugger again and change another. When the Debugger dialog is displayed, you can view/modify different aspects of the controller, the controller root hub ports, as well as other items. For example, with the xHCI debugger, you can view and modify TRBs on the Command Ring. Simply set the 'doorbell' trigger, and when a doorbell is written, the emulation will stop and display the current Command Ring with any available TRBs. You can turn off or on any trigger (listed above) while within the Debugger dialog. If all of them are off, you can use the Ribbon Trigger button to display the Debugger, then set any triggers active. The figure below is an example of an xHCI controller using the Doorbell trigger to stop when the Controller receives a TRB in the Command Ring with the Command Ring Doorbell being triggered. The Debug Flags box allows you to set or clear a trigger. If the checkbox is checked, the trigger is active. The Port Register set displays the used registers allowing you to modify them as you see fit. Again, undefined results may happen if you modify these registers. The Tree List shows the current TRB list of the Command Ring. Notice that six TRBs have already been executed. (You should have had the Debugger triggered six times already). The TRB listed in bold is the current TRB to be executed. If you select that item and then click the "View TRB" button, you can modify the TRB before the controller has a chance to execute it. Note that you cannot change the TRB's type, though you can modify its attributes.'''
