["https://www.fysnet.net/bochs/user/vesa-notes.html"]
title = "Notes about VESA usage"
full_description = "Since Bochs 1.4 it is possible to use VESA graphics. There are some limitations in the current implementation, but in general it should work ok (we have run several test programs, the XFree86 VESA display driver, etc.) In order to use VESA VBE, you need to enable it in your bochsrc by setting the vga option to vbe. Finally, you need to use the LGPL'd VGABIOS as vgaromimage option for applications to correctly detect VESA support. Note: To take advantage of the VBE, you must tell Bochs to use the LGPL'd VGA BIOS version 0.4c or higher. A current version of the VGA BIOS will work. You need a display driver capable of using the VESA BIOS for this to work (a recent XFree86 will do, Windows 9x/NT/2K/XP probably will not work 'out of the box'."
