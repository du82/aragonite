["https://www.fysnet.net/ultimate/help/fat.html"]
title = "Ultimate: FAT File Systems"
full_description = '''The below image is an example of a FAT12 partition: Most fields on this tab allow you to modify the FAT BPB of the current partition. You may use decimal integers or hexadecimal values prefixed with the C standard "0x" prefix. The "DOS 2.x FAT?" check box, when checked, treats the BPB as the older DOS 2.0 BPB which stopped at the "Hidden Sectors" field. Please note that valid FAT volumes must follow the "clusters per volume" rules for Ultimate to correctly parse the volume. i.e, the following must be met or undefined behavior may occur. FAT 12: Total Clusters must be less than 4085 FAT 16: Total Clusters must be at least 4085 and less than 65525 FAT 32: Total Clusters must be at least 65525 If the above rules are not met, image integrity may be at risk. The fields that are disabled are for FAT 32 partitions. The Format button will allow you to format this partition. The Clean button will simply write zeros to all sectors of the partition. The Check button will check the partition for errors. (Not yet completed) The Update Boot button will allow you to update the boot code of this partition. Note that if the current BPB has only one sector reserved for the code, you cannot update the code with a file that requires more than one sector. A Format is then required. The Entry button will be enabled when you select a valid entry in the directory list. When pressed, the app will display information about that particular entry. See below for more on this. The Copy and Insert buttons allow you to copy a file or folder (including files within that folder) from the image to your host and insert a file or folder from your host to the image. Please note that the code is not complete and does not check for a full partition. i.e.: It does not check for free space available before inserting. The Delete button allows you to delete a file or folder from the image. The Search button allows you to search for a file or folder within the listing. You may use standard DOS wildcards. i.e.: '*' and '?' characters. Please note that the search code is not complete and will only search "down". It won't go back up a parent folder once it is within a child. Something to do, right? The FYSOS Sig button is specific to my OS. My OS requires a small structure at the end of the first sector of the partition and uses this structure as an LBA marker as well as a signature. This button allows me to update that structure. If you don't use that exact same structure, you should not use this button. The Apply button, of course, is used to apply any changes that you have made. The following image shows the dialog when you use the Entry button: This will allow you to modify the entry of this directory entry. The FAT Entries button will show the Cluster entries used for this entry. The Delete LFN button deletes the LFN part of the entry. (Please note, this isn't complete yet, and not tested well)'''
year_published = 2025
