["https://www.fysnet.net/book_series/more_info.htm"]
title = "Operating System Design Book Series"
full_description = '''I have been asked about the format of the source code and utilities that are available with my books. The most heard questions are: In this hobby of ours, when you create your Operating System and all the little parts that go along with it, you will want to test your progress. The recommended way to do this is to use a system emulator. This emulator will allow you to boot your operating system within an emulated space on the same computer you are writing your code. This way, you can have all the tools, documents, and emulation all loaded on one machine without having to reboot each time you want to test your progress. This makes it a quick and easy process. However, eventually you will want to test your progress on real hardware. I strongly suggest that you do not test it on your main computer or a computer that you use for other purposes. Quite a few times within the beginning of your project, you will crash the computer. You absolutely do not want to take the chance of damaging anything on this computer, especially if you use it for other purposes. Therefore, I suggest that you find a machine that someone is throwing out, a machine at a yard sell, off of ebay, any cheap somewhat modern machine. You can find many 32-bit machines with Legacy BIOS at yard sells, garage sells, on the curb for the trash guy, etc., for around 20 USD. If you want a 64-bit machine, you will need to do a little more looking, but still can find a decent older 64-bit machine for less than 40 USD. With this older machine, it is okay if you accidently damage part of the computer's hardware. Since it was not used for anything else, and you didn't pay very much for it, you don't need to worry about it much. It is quite a bit easier than you might think. For example, most modern hardware is now controlled by writing data to a memory offset. This data instructs the hardware to do certain things. If you write the wrong data, there is a good chance that the hardware will indeed do something wrong. It can be a rare situation, but it can happen. Having a "throw-away" computer for your initial testing is a very good idea.'''
year_published = 2025
