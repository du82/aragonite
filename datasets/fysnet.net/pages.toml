["https://www.fysnet.net/blog/2020/12"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "Due to many requests from fellow coders, I have (probably prematurely) released the source code to Ultimate, my disk image utility. There are a few things I wished to add and change before I released the code, but kept putting them off. The release kept getting later and later, so I finally decided to just release the code anyway. Maybe I can get to these items at a later time. The source code can be found on a GitHub page located in the /main/filesys/utils/ultimate folder structure at the main book page. The release files are in, you guessed it, the release folder. Other than releasing the source code, a few things have been added, mainly things such as different sector sizes. Currently, the utility will allow images that use 512-, 1024-, 2048-, and 4096-byte sectors. However, it is coded so that adding any sector size is a simple task. You can also now create an image formatted to a GPT partitioning system with a FAT file system, whereas writing this image to a USB thumb drive, Windows will recognize the thumb drive and read and write to it. Anyway, there are many things I wish to add, as well as things that need to be worked on, improved, and/or fixed, as this originally started out as a bunch of separate utilities, now merged into one. If you use this utility, I would appreciate any comments you might have. If you see a need for an addition, please let me know. Thank you all for your support."
