["https://www.fysnet.net/blog/2013/01"]
title = "Blog – USB: The Universal Serial Bus"
full_description = "My kids decided to give me a AM/FM/CD radio player for my truck for Christmas. The old one had a broken cassette player and the buttons hardly worked anymore. Once I figured out what wires went where, using a volt meter (all diagrams I found on the net had different color codes), I soldered in the new radio. It works great. Since I now had an old radio sitting on my desk, I decided to pull it apart. I found the motor runs well on 5v0, but need to find the specs to be sure, found a magnetic coil that when you apply 5v0 to it, it attracts a paper clip quite well, and found a soleniod that doesn't seem to work. I tried 5v0 and even 16v0 and could not get it to work. Come to think about it, I could never get the thing to eject the cassette with out a little help. Anyway, I have some nice little toys I think I will build something with. Along with the pulleys and belt, I might build a small robot. We will have to see. Watch for pics in future posts."
