["https://www.fysnet.net/blog/2016/08"]
title = "Blog – USB: The Universal Serial Bus"
full_description = '''I have released the boot and loader code for this OS. Have a look at https://github.com/fysnet/FYSOS. I was going through some of my storage and found two PS/2 Model-50's. After working with them for a little while, come to find out, one had a bad floppy drive and the other had a bad hard drive. After an easy swap, I now had one good machine, though I couldn't get it to boot. After looking up the two error codes it printed (161-Dead Battery, 163-Time and Date not set), I had to find a setup disk for the model, which I guess is called a reference disk. After following the instructions, rebooting each time it asked, I finally got the hard drive to boot. This machine has WordPerfect 5.1, Lotus 123, as well as a few other apps on it. As I am typing this, I thought to myself, "you should have checked the version of DOS its running!". Well, as figured, the massive power unit started to get warm, I mean warm enough you couldn't touch it, so I shut it down. Now that the CMOS battery is dead, I may have to run that whole setup again, but not until I find a new battery.... The two images below shows the unit, without the cover, and the screen. Sorry it is blurry, I will try to get another one. It was to show that I could actually type in WP5.1, to show it was actually working... (Click on each image to show in full screen.) The floppy disk drive on the right has a hard time accepting a disk, but once I changed the setting in the CMOS I think I got the drive to work, though the mechanical part of the disk drive, the part that holds the disk, will not sometimes accept the disk, i.e.: pull it into place. The hard drive is a whopping 20Meg, the two floppies are 1.44m however, the machine is a 286 with 1Meg of RAM. I think it has an MCA bus and those adapter card ports in the upper left sure look like PCI slots, but I think MCA looked like PCI slots anyway, didn't they?'''
