["https://www.fysnet.net/leanfs/downloads.php"]
title = "LEAN file system - Downloads"
full_description = "the LEAN file system Part of the FYSOS project Part of the FreeDOS-32 project Overview Specification Downloads Downloads Version 1.0.x A reference implementation of LEAN file system software, written in C/C++, is available via github in two forms.They include: a tool to create empty LEAN file system images; a Dialog GUI interface to browse and edit the content of LEAN images. Ultimate The first form is a Windows-only implementation, 32- and 64-bit versions, giving a GUI interface allowing you to manipulate the LEAN image. This utility is shown at https://www.fysnet.net/ultimate/index.htm and the source code and binaries can be downloaded via github. Cross Platform The second form is a Cross Platform implementation written in C for a Command Line Interface, allowing you to create new LEAN images and optionally adding user files. The source code is available via github, at mleanfs. Reporting bugs To report bugs, please contact the author at fys [at] fysnet [dot] net. Thank you for your help. Demo LEAN Image file The provided 7-Zip compressed archive contains a demo LEAN File System image. Uncompress the archive in a directory of your choice, then load it with one of the utilities mentioned above. Download 4.4 MiB lean_image.7z Version 0.6.x A reference implementation of LEAN file system software, written in C++, is available.It includes: a cross-platform user-mode file system driver library; a tool to create empty LEAN file system images; a utility to check the correctness of LEAN volumes; a file-manager-like GUI frontend to browse and edit content of LEAN images. The reference implementation is currently released under the terms of the GNU General Public License version 2 or later, so that you can study and modify the source code and help improve this software. A more relaxed license may be used in the future. Change log version 0.6.1 (released on 2011-04-09): bug fixes version 0.6.0 (released on 2010-03-22): first release, implements the LEAN file system specification version 0.6 Reporting bugs To report bugs, please use the FreeDOS-32 bug tracker. Please use the fs/lean bug category and write your email address if you don't use a SourceForge.net account. Thank you for your help. Binaries for Windows XP or later The provided 7-Zip compressed archive contains the LEAN File System GUI and all required libraries. Uncompress the archive in a directory of your choice and run the leanfsgui.exe executable. The program does not save settings to the registry or other configuration files. Download 1.9 MiB leanfsgui-0.6.1-win32.7z Binaries for Debian GNU/Linux Squeeze The provided 7-Zip compressed archive contains the LEAN File System GUI executable built with GCC 4.4 on Debian Squeeze. You need the wxWidgets 2.8 library (2.8.10 was used for this build). Uncompress the archive in a directory of your choice and run the leanfsgui executable. The program does not save settings into your home directory or other places. This binary may work on other Linux distributions. Download 100 KiB leanfsgui-0.6.1-squeeze.7z Source code The provided 7-Zip compressed archive contains all the source code of the reference implementation, from which the above binaries have been built. To rebuild from sources you need the GCC compiler (MinGW on Windows) and the last stable versions of the wxWidgets (2.8.x) and Boost C++ libraries. GNU Makefiles and project files for the Code::Blocks IDE are provided. Download 72 KiB leanfsgui-0.6.1-src.7z"
