title = "Blog – USB: The Universal Serial Bus"
full_description = '''Here is another screen shot. A few changes and found a few things I need to fix. (To view full size, right click, then select "View Image", or what ever your browser's options are). First, if the background is dark, you can't see the Black text of the icons. I will have to check to see if the background is dark and change the text to white. I think a flag of something like "ALWAYS_SHOW" or something like that and let the text renderer make sure the text shows through. Second, a child window shows just fine, but that child window's border frame does not... (Look at the Color Picker's frame). Something to fix... Update: My 32-bit real mode emulator now runs Wing Commander. Yes--it's not Doom--it is Wing Commander. Since everyone else chooses Doom or Quake, I chose a different one (for more reasons than that, as well). (To view full size, right click, then select "View Image", or what ever your browser's options are). When in Qemu, it runs quite slow, almost so slow you can't play it. However, you have to realise that there is an OS running QEMU, running an OS, running another emulator, running another OS, running Wing Commander. The next task is to load it on a USB and run it straight, not through QEMU.'''
