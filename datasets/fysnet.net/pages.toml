["https://www.fysnet.net/bochs/user/bochsrc.html"]
title = "The configuration file bochsrc"
full_description = '''Bochs uses a configuration file called bochsrc to know where to look for disk images, how the Bochs emulation layer should work, etc. When you first start up Bochs, it looks around for its configuration file (see Section 5.2), and parses it. Here are a few lines from a sample file: The syntax used for bochsrc can also be used as command line arguments for Bochs. If you have any spaces in your command line arguments, they should be enclosed in single quotes, for example: You can use the #include statement in the bochsrc to read the configuration from other files. Now it is possible to put platform or installation defaults in a global config file (e.g. location of rom images). Put this on top of your config file if the global configuration is stored in /etc: Bochs now treats an unknown option as optional device plugin if it exists. It loads this plugin and then it tries to call the parser function for this configuration line which is located in the plugin. This mechanism is implemented for the Bochs network, sound, and USB host controller devices. Externally developed device plugins (AKA "user plugins") now can also be loaded this way. These plugins will be loaded by default (if present): 'biosdev', 'extfpuirq', 'gameport', 'iodebug','parallel', 'serial', 'speaker' and 'unmapped'. These plugins are also supported, but they are usually loaded directly with their bochsrc option: 'e1000', 'es1370', 'ne2k', 'pcidev', 'pcipnic', 'sb16', 'usb_ehci', 'usb_ohci', 'usb_uhci', 'usb_xhci' and 'voodoo'. The configuration interface is a series of menus or dialog boxes that allows you to edit all the settings that control Bochs' behavior. Depending on the platform there are up to 3 choices of configuration interface: a text mode version called "textconfig" and two graphical versions called "win32config" and "wx". The text mode version uses stdin/stdout or GUI console (if available / runtime config) and is always compiled in, unless Bochs is compiled for wx only. The choice "win32config" is only available on win32/win64 and it is the default on these platforms. The choice "wx" is only available when Bochs is compiled with wxWidgets support, see Section 3.4.13. If you do not write a config_interface line, Bochs will choose a default for you.'''
year_published = 2025
clearnet = "https://www.fysnet.net/bochs/user/bochsrc.html"
