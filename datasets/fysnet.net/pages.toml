["https://www.fysnet.net/bochs/user/bochsopt-usb-config.html"]
title = "USB configuration"
full_description = '''By default, this emulates a 3-button mouse. After a reset, it is set up to send the Report Protocol report and consists of a 4-byte report: Using the 'model:xxxx" parameter, you can set the mouse to report a different type packet. See below. This device may be used on all Host Controller types using a speed of 'low', 'full', or 'high' (see model 'm388phy'). The model: parameter may have one of the following names: 'm228', 'm338', 'm3312', 'm3316', 'm338phy', or 'm33xDebug'. Note: This model uses a Report ID, and prepends this byte ID to the Report Packet. (See byte 0 above) Returns the 4-byte packet shown at Section 5.7.1 above. This is the default model and will be used if the model: parameter is not used. Returns the default 4-byte packet, same as m338, but includes a HID Physical Descriptor and associated Designator entries. Note: To make the Bochs source code simpler, this model must be used with low- and full-speed devices only. Note: Note that some Guests, including (older) widely used commercial Guests, see an HID Report with Physical indicators (Designator Min/Max) as invalid and won't continue to use the mouse. This report is deliberately irregular by design, so that a Guest can test its HID Report Descriptor Parser. Again, this is deliberate. A correctly written parser will extract the neccessary fields no matter the irregularity. Please note that this model is not for normal use. It is intentionally irregular, and its purpose is to test an HID Parser. Note: Note that the mouse is known to not function correctly in a Windows 2000 Guest. Clearing HANDLE_TOGGLE_CONTROL to zero in usb_common.h and rebuilding Bochs allows this guest to function more regularly, though there are still some issues. Since the USB mouse and keyboard work in all other regulary tested Guests, it must be a quirk with Win2k that needs to be investigated. This emulates a standard keyboard. Key press and release codes are translated from the Host's keyboard to the Guest as USB Interrupt packets.'''
year_published = 2025
clearnet = "https://www.fysnet.net/bochs/user/bochsopt-usb-config.html"
