["https://gabrielgambetta.com/computer-graphics-from-scratch/10-describing-and-rendering-a-scene.html"]
title = "Describing and Rendering a Scene - Computer Graphics from Scratch - Gabriel Gambetta"
description = '''
\(A = (1, 1, 1)\)
\(B = (-1, 1, 1)\)
