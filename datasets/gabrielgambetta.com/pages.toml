["http://gabrielgambetta.com/lag-compensation.html"]
title = "Lag Compensation - Gabriel Gambetta"
full_description = "Client-Server Game Architecture | Client-Side Prediction and Server Reconciliation | Entity Interpolation | Lag Compensation | Live Demo The previous three articles explained a client-server game architecture which can be summarized as follows: This situation is generally fine, but it’s quite problematic for very time- and space-sensitive events; for example, shooting your enemy in the head! So you’re aiming perfectly at the target’s head with your sniper rifle. You shoot - it’s a shot you can’t miss. Because of the client-server architecture explained before, you were aiming at where the enemy’s head was 100ms before you shot - not when you shot! In a way, it’s like playing in an universe where the speed of light is really, really slow; you’re aiming at the past position of your enemy, but they’re long gone by the time you squeeze the trigger. Fortunately, there’s a relatively simple solution for this, which is also pleasant for most players most of the time (with the one exception discussed below). When you shoot, client sends this event to the server with full information: the exact timestamp of your shot, and the exact aim of the weapon. Here’s the crucial step. Since the server gets all the input with timestamps, it can authoritatively reconstruct the world at any instant in the past. In particular, it can reconstruct the world exactly as it looked like to any client at any point in time. This means the server can know exactly what was on your weapon’s sights the instant you shot. It was the past position of your enemy’s head, but the server knows it was the position of their head in your present. The enemy may be the only one not entirely happy. If they were standing still when he got shot, it’s their fault, right? If they were moving… wow, you’re a really awesome sniper. But what if they were in an open position, got behind a wall, and then got shot, a fraction of a second later, when they thought they were safe? Well, that can happen. That’s the tradeoff you make. Because you shoot at him in the past, they may still be shot up to a few milliseconds after they took cover."
year_published = 2025
