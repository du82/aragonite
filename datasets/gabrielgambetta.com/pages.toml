["http://gabrielgambetta.com/practical-astar.html"]
title = "Practical A* - Gabriel Gambetta"
full_description = "The first three articles of this series start from the very basics of pathfinding algorithms, and end up with a clear exposition of the A* algorithm. This is great in theory, but understanding how to apply it in practice is a different topic. What if you don’t care about the length on the path, but you depend on solar power and need to be under sunlight as much as possible? In the original examples we searched for the shortest path between the start node and the goal node. However, instead of storing the partial path lengths in a variable called length, we called it cost. Why? We can make A* search not only for the shortest path, but the best path for some definition of “best” which is good for our purposes. When we want the shortest path, the cost is the length of the path, but if you want to minimize, say, the fuel consumption, that should be used as the cost. If you want to maximize “time under sunlight”, the cost is the time spent without sunlight. And so on. This generally means that each edge in the graph has an associated cost with it. In the original examples the cost was implicit and it was assumed to be always 1, because we were counting steps in the path, but you can tweak this edge cost according to whatever you’re trying to minimize. Suppose you’re a car and need to get to a gas station. Any gas station will do. You want the shortest path to the closest gas station. A naive approach would be computing the shortest path to each gas station in turn, and then choosing the shortest one. That would work, but it would be quite wasteful. What you can do instead is to replace the single goal_node with a method which given a node can tell whether it’s a goal node or not. This way you can search for more than one goal at the same time. You also need to tweak the heuristic to return the minimum estimated cost for all the possible goals. Depending on the specifics of your situation, you may not be able to reach the goal exactly, or it would be costly to do so (if you’re sending a character halfway across a huge map, do you care about a difference of an inch?), so the is_goal_node method can return true when you’re “close enough”."
year_published = 2025
