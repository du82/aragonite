title = "Afterword - Computer Graphics from Scratch - Gabriel Gambetta"
full_description = "Congratulations! You now have a good understanding of how 3D rendering works. You’ve created a raytracer and a rasterizer and gained a good conceptual understanding of the algorithms and math that power them. However, as I explained in the introduction, it’s impossible to cover the entirety of 3D rendering in a single book. Here’s a few topics you might want to explore on your own to expand your horizons: This includes offline and dynamic mesh simplification, impostors, and billboards. These algorithms are how we efficiently render forests with billions of plants, crowds of millions of people, or extremely detailed 3D models. This includes binary space partition trees, k-d trees, quadtrees, and octrees. These structures help efficiently render massive scenes, such as an entire city. How to efficiently render a terrain model that might be as big as a country yet have human-scale detail. Of course, there are many other topics, and that’s just 3D rendering! Computer graphics is an even broader subject. Here are some areas you might want to investigate: Before you can “blur the background” of your video call, you need to determine which pixels are background and which aren’t. Congratulations again on taking your first step into the world of computer graphics. Now you get to choose where to go next!"
