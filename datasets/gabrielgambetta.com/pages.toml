["https://gabrielgambetta.com/tgs-swiss-trains.html"]
title = "How I wrote my first novel during my daily commute - Gabriel Gambetta"
full_description = "It is said that everyone has a book in them. Ask around and you’ll find most people have an amazing idea that would make for a great story — if they only had the time to write it! Having a full-time job, family, friends, and all these annoying “adult” responsibilities leaves little time to write. But I found the time I needed in the otherwise dead time known as “the commute”. I love Swiss trains. They’re comfortable, quiet, and always on time (some of these facts actually made it into the novel itself). But perhaps most importantly, I could almost always find a seat. Back in 2010 I found myself reading my third or fourth Dan Brown novel and thinking two things: “This man knows how to write page-turners” and “I should be able to do this”. I had written short stories before, but could I pull off a novel? I set out to work. I did what felt natural, but in retrospect may have been a product of my engineering background: I created a spreadsheet with a Dan Brown novel in each column and a story point or character relationship in each row. Then I re-read the novels, taking copious notes as I went along, and filled this table. Soon the structure underlying The Da Vinci Code and Angels and Demons and The Lost Symbol was laying bare before my eyes. I could see why the stories worked. So I took the obvious next step: I added a new column named _“my novel”_and set out to fill in the blanks. Although it ended up looking quite different, this column was the basis for what later became my first novel, The Golden Seed. Four more years would pass before I had the first copy of the novel in my hands. As it turns out, writing is a lot of work. I became obsessed with story structure. I needed to understand why novels and movies worked. I had to know the blueprint. I read book after book after book, from The Hero with a Thousand Faces to _The Screenwriter’s Bible_to the controversial Save the Cat, until I could see the underlying themes and principles that unified all the different structures and methodologies."
year_published = 2025
