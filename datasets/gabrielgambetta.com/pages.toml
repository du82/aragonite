["https://gabrielgambetta.com/astar-demystified.html"]
title = "A* Demystified - Gabriel Gambetta"
full_description = "The first article in this series presented the generic pathfinding algorithm; every pathfinding algorithm is a slight variation of it. The second article revealed the secret behind the different search algorithms: it all comes down to the choose_node function. It also presented a reasonably simple choose_node that yields an algorithm called Uniform Cost Search. This algorithm is pretty good: it will find the shortest path from the start node to the goal node. However, it’s somewhat wasteful: it considers paths that a human clearly sees as “wrong” - they tend to move away from the goal. Can we avoid this? Imagine we’re running a search algorithm in a special computer which has a chip that can do magic (bear with me). With this awesome chip, we can express choose_node in a very simple way which is guaranteed to produce the shortest path without losing any time exploring partial paths that won’t lead anywhere: Tempting, but magic chips still require somewhat lower level code. This would be a good approximation: This is a great way to choose the next node: we choose the node that yields the shortest path from the start node to the goal node, which is exactly what we’re looking for. We have also minimized the use of magic: we know exactly what’s the cost from the start node to each node (that’s node.cost), and we use magic only to divine the cost from the node to the goal node. Unfortunately, magic chips are quite new, and we want to support legacy hardware. Most of the code is fine, except for this line: So we can’t use magic to know the cost of the path we haven’t explored yet. Fine. Let’s make a guess, then. We’re optimistic, so we’ll assume there’s nothing between the current node and the goal node, and we can just go straight: Note that the shortest path and the minimum distance are different: the minimum distance assumes there are absolutely no obstacles between the current node and the goal node. This estimate can be quite simple. In our grid-based examples, it’s the Manhattan distance between the two nodes (that is, abs(Ax - Bx) + abs(Ay - By)). If you could move in diagonals, it would be sqrt( (Ax - Bx)^2 + (Ay - By)^2 ), and so on. The really important thing is to never overestimate the cost."
year_published = 2025
