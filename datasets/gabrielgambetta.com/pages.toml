["https://gabrielgambetta.com/index.html"]
title = "Gabriel Gambetta"
full_description = "I’m a Senior Software Engineer in Zürich; the author of Computer Graphics from Scratch; and an actor/filmmaker. My recent work experience includes 7 years at Google Zürich (in various SWE and SRE teams) and 4 years at Improbable in London (joined as employee #30, wore a lot of hats). In the more distant past I founded and ran a small indie game dev studio for almost a decade (leading to the Fast-Paced Multiplayer articles). I also taught Computer Graphics at university level (leading to Computer Graphics from Scratch). Computer Graphics from Scratch: A book about 3D rendering, covering rasterization and raytracing, based on the lectures I gave during my teaching years. You can buy the book, published by No Starch Press. Fast-Paced Multiplayer: A series of articles about Client-Side Prediction, Server Reconciliation, Entity Interpolation, and the architecture of fast-paced client-server multiplayer games. These articles have become one of the main references on the topic found on the Internet. Opt-in: an hour-long, no-budget feature film I wrote, produced, directed, and edited; made with a tiny, all-volunteer cast and crew. “An idealistic engineer lands his dream job at the biggest social media company in the world. But when he discovers the dark side of the business, he must decide whether to stay silent or risk everything to expose the truth.”."
