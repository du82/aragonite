full_description = 'Originally from Venezuela, I moved to Miami, Florida almost 20 years ago. I’m a profesional, versatile graphic artist and illustrator. While the mainstay of my current creative practice involves working digitally, I am equally comfortable, and originally started working on traditional media (watercolor, oils, color pencil, ink). Much of my work is inspired, influenced or informed by my love of nature, wildlife and experience as a herpetologist (herpetology is the branch of zoology dedicated to the studies of amphibians and reptiles). You can find my art for sale in my Redbubble shop and in my DeviantArt page. I am available for commissions and I am always on the lookout for new opportunities for collaboration, so please don’t hesitate to get in touch. contact © Gabriel N. Ugueto 2015-2016. window.scrollEffects = {"RevealFX1":{"effect":"slide","parameters":{"from":"bottom","distance":"50px","opacity":"0","start":"2"},"over":"800ms","defaultDelay":"500ms","easing":"ease-out","viewportFactor":"0","preset":"custom","init":"false","play-easing":"ease-out"},"RevealFX2":{"effect":"slide","parameters":{"from":"bottom","distance":"50px","opacity":"0","start":"2"},"over":"800ms","defaultDelay":"700ms","easing":"ease-out","viewportFactor":"0","preset":"custom","init":"false","play-easing":"ease-out"},"RevealFX4":{"effect":"slide","parameters":{"from":"bottom","distance":"50px","opacity":"0","start":"2"},"over":"800ms","defaultDelay":"500ms","easing":"ease-out","viewportFactor":"0","preset":"custom","init":"false","play-easing":"ease-out"},"RevealFX5":{"effect":"slide","parameters":{"from":"bottom","distance":"50px","opacity":"0","start":"2"},"over":"800ms","defaultDelay":"700ms","easing":"ease-out","viewportFactor":"0","preset":"custom","init":"false","play-easing":"ease-out"},"RevealFX6":{"effect":"slide","parameters":{"from":"bottom","distance":"50px","opacity":"0","start":"2"},"over":"800ms","defaultDelay":"900ms","easing":"ease-out","viewportFactor":"0"