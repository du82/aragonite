full_description = "The GadgetVersus website provides Internet users with technical data for electronic devices, such as smartphones, processors for desktops, servers, laptops, tablets, phones or consoles. This website also allows this information to be compared for two different devices or for groups of devices, as well as their respective performance. On these pages which present technical specifications, as well as comparison tables and performance graphs, one can find textual and graphic links which can be advertising links, for which GadgetVersus can earn a commission. Indeed, if the Internet user clicks on one of these links or if he buys a product on the store to which these links redirect, the administrator of GadgetVersus can receive compensation, without adding an additional cost on purchases carried out by the Internet user. The commission is paid from the seller's margin, often as a marketing expense. Please note that our editorial line regarding the technical data and performance of these devices is not influenced by these commissions. GadgetVersus is not paid by third parties to modify this information. In full transparency, and in accordance with the directives of the Federal Trade Commission (FTC), as well as the European Commission, we wish to inform you of the following things: Affiliate links Many affiliate links can be found on the pages of the GadgetVersus website, for which the GadgetVersus administrator can earn a commission when the Internet user makes a click or a purchase, at no additional cost to the Internet user. These links are marked with the hashtag #ad or with text immediately below warning that these are advertising links. On each page is a warning at the bottom which informs the Internet user that the administrator of GadgetVersus may earn a commission with advertising programs present on the website. When advertising links are displayed on the website, a warning is also present at the top of the website with a link to the advertising policy of GadgetVersus. Amazon Disclosure As an Amazon Associate I earn from qualifying purchases. Ebay Disclosure When you click on links to various merchants on this site and make a purchase, this can result in this site earning a commission. Affiliate programs and affiliations include, but are not limited to, the eBay Partner Network. Google Adsense Disclosure The administrator of GadgetVersus participates in the Google Adsense program. This program allows webmasters, bloggers and Youtubers to earn commissions by displaying graphic and / or text ads. These advertisements come in recognizable rectangular inserts. The Internet user can find out more about these advertisements by clicking at the top right of these inserts. The Internet user can also decide to close the advertisement if he wishes by clicking on the small cross at the top right of the insert. Other programs The GadgetVersus administrator may participate in other similar affiliate programs with stores offering their customers to purchase electronic devices. Product prices and availability Because these programs require affiliates and partners to post a price and availability with values ​​updated less than 24 hours ago, we do not currently have the technical means to meet these obligations. Therefore we cannot display this information. The Internet user must therefore go to the desired store to find out the availability and the respective price if the product concerned is actually present."
