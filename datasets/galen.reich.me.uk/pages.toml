description = "Part of Bellingcat's Investigative Tech Team. Former BBC R&D Engineer. PhD in Electrical Engineering. Based in London, UK."
full_description = '''About Me I was born and raised in San Francisco with a passion for arts and science. I'm a fan of good coffee, tinkering with technology, and talking to people about science. I'm part of the Investigative Tech Team at Bellingcat, where I work with a diverse community of contributors to develop, maintain and improve software tools for open source investigations. I am currently the Scientist-in-Residence at the Birmingham & Midland Institute, a Birmingham-based Society founded in 1854 for the "Diffusion and Advancement of Science, Literature and Art amongst all Classes of Persons resident in Birmingham and Midland Counties". Previously, I was an engineer with BBC R&D and worked as a researcher on BBC Panorama. BMI Talk on Sir Oliver Lodge (2022). © 2022 The Birmingham & Midland Institute. Lapworth Lates (2018) - Exhibiting a radar system at the Lapworth Museum. Image Courtesy of Greg Milner. Pint of Science (2016) - Demonstrating the surprising quantum properties of light to the crowd. Between 2016 and 2021 I helped organize the Pint of Science festival on both local and national scales in the UK. Pint of Science helps to engage people with cutting-edge science by bringing professional scientists to local pubs and community spaces to talk about their research in a relaxed environment. See my research Research Background In 2015, I graduated with a First-Class Physics degree from the University of Birmingham. My final year projects covered quantum cryptography, remote planetary sensing, and automated semiconductor analysis. I finished my PhD in Biologically-Inspired Radar in 2020 and you can watch me explain my research in the video below. Publications G.M. Reich, J. Heathcote (2022), Analysis of Generation Loss for Wavelet-Based Compression, SMPTE Motion Imaging Journal Read G. Reich, C. Pike, T. Nixon (2021), Development and analysis of decorrelation filters for binaural rendering of Audio Definition Model content, Immersive and 3D Audio: from Architecture to Automotive (I3DA) Read G.M. Reich, Biologically-Inspired Radar Sensing (2020), PhD Thesis, University of Birmingham, UK. Read G.M. Reich, M. Antoniou, C.J. Baker (2020), Memory-Enhanced Cognitive Radar for Autonomous Navigation, IET Radar, Sonar & Navigation. Read G.M. Reich, M. Antoniou, C.J. Baker (2019), MIMO Radar for Cognitive Robot Platform Control and Navigation, IEEE International Radar Conference. Read G.M. Reich, M. Antoniou, C.J. Baker (2018), Biologically-inspired wideband target localisation, IET Radar, Sonar & Navigation. Read G.M. Reich, M. Antoniou, C.J. Baker (2018), Bio-inspired techniques for target localization, IEEE International Radar Conference. Read G.M. Reich, L. Thaler, X. Zhang, D. Wang, G. E. Smith, Z. Tao, R.S.A Abdullah, M. Cherniakov, C.J. Baker, D. Kish, M. Antoniou (2017), Mouth-Clicks used by Blind Expert Human Echolocators – Signal Description and Model Based Signal Synthesis, PLOS Computational Biology. Read X. Zhang, G. Reich, M. Antoniou, M. Cherniakov, C.J. Baker, L. Thaler, G.E. Smith (2017), Human echolocation: waveform analysis of tongue clicks, IET Electronic Letters. Read G.M. Reich, M. Antoniou, C.J. Baker (2017), Frequency-dependent target localization, IET Radar Conference. Read See my creative work'''
