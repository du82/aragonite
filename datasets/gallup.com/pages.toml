nds. Impact on People and the Planet E My organization makes a positive impact on people and the planet. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Respect S At work, I am treated with respect. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Development S There is someone at work who encourages my development. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Wellbeing S My organization cares about my overall wellbeing. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-