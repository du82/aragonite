essage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods Global data are based on the Gallup World Poll conducted in more than 100 countries and areas each year since 2006. The surveys of roughly 1,000 adults per country are nationally representative of those aged 15 and older in each country, conducted either by phone or in person. U.S. data are based on nationally representative telephone surveys of adults aged 18 and older. Data from individual polls are generally based on surveys of 1,000 national adults, while annual data may represent combined data from quarterly or monthly surveys. Results are weighted to ensure the sample demographics conform with the most recent U.S. Census targets. Related Content Recent Content on Leadership Approval PoliticsRecord Surge in Republican Satisfaction With State of NationPoliticsTrump's Job Approval Rating at 45%; Congress' Jumps to 29%PoliticsTrump's Inaugural Approval Rating Is Historically Low AgainPoliticsSatisfaction With U.S. Democracy Edges Up From Record Low Next Steps Take a Deeper Look at Global Leadership Approval Gallup has been measuring global leadership approval since 2006. Our data represent the performance of the world's leaders from the people's perspective. Get country-by-country data and insights on people's views of current and past world leaders. Rating World Leaders Report Get the latest country-level data on global leadership approval and view past reports. View Report about Gallup's Latest Global Leadership Report Global Leadership Approval Center Track trends and get the latest insights on global leadership. Explore Page about Global Leadserhisp Approval Center Get Connected Submit a media inquiry to request a Gallup expert to answer questions about this topic. Subscribe to our newsletters and real-time alerts for our latest insights and analysis.'''
