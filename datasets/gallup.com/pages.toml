full_description = '''World Explore Gallup's research. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/41223769-34f6-4fab-af45-22f3cd05e2c9.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/41223769-34f6-4fab-af45-22f3cd05e2c9.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/41223769-34f6-4fab-af45-22f3cd05e2c9.jpg 2x" height="400" width="800" alt="" /> WorldSep 24, 2024 Global Safety Starts to Slip Gallup's latest update on global safety shows people worldwide feel safer today than they did a decade ago, but many countries have a long way to go. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/316729ae-bc71-4d5e-99cb-cf423d64ab84.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/316729ae-bc71-4d5e-99cb-cf423d64ab84.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/316729ae-bc71-4d5e-99cb-cf423d64ab84.jpg 2x" height="400" width="800" alt="" /> WorldFeb 26, 2025 Global Generosity: World Felt Less Charitable in 2024 After surging between 2021 and 2023, global charitable activity -- including monetary donations, volunteering and helping strangers -- declined in 2024. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/78500371-892a-49c7-b0ab-92556f9a1c77.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/78500371-892a-49c7-b0ab-92556f9a1c77.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/78500371-892a-49c7-b0ab-92556f9a1c77.jpg 2x" height="400" width="800" alt="" /> WorldFeb 17, 2025 Germany's Election: 5 Key Issues Facing the Next Chancellor Ahead of Germany's election, Gallup data point to several issues facing the victor, including living standards, housing and migration. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/WORKPLACEV9CMS/a86f3eb8-565b-4147-b4e9-de465f383a3a.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/WORKPLACEV9CMS/a86f3eb8-565b-4147-b4e9-de465f383a3a.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/WORKPLACEV9CMS/a86f3eb8-565b-4147-b4e9-de465f383a3a.jpg 2x" height="400" width="800" alt="" /> WorkplaceFeb 11, 2025 What Do People Need Most From Leaders? Hope is powerful -- and it's what people need most consistently from the leaders in their lives. See what this means for current and future leaders. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/e2f1e0c1-4ee8-486d-8b70-f17fd5ca5596.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/e2f1e0c1-4ee8-486d-8b70-f17fd5ca5596.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/e2f1e0c1-4ee8-486d-8b70-f17fd5ca5596.jpg 2x" height="400" width="800" alt="" /> WorldJan 30, 2025 Australians' Housing Crisis: Dreams Turn Into Nightmares New data highlight the housing crisis in Australia, where satisfaction with affordable housing has collapsed compared with other wealthy nations. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/cfa4a5d5-fe62-4f00-9d94-f421e8b90e9f.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/cfa4a5d5-fe62-4f00-9d94-f421e8b90e9f.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/cfa4a5d5-fe62-4f00-9d94-f421e8b90e9f.jpg 2x" height="400" width="800" alt="" /> WorldJan 21, 2025 Cancer Testing for Women Falls as Rates Rise The latest Hologic Global Women's Health Index shows that for the first time in the survey's four-year history, fewer women are reporting that they were tested for any type of cancer. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/9c4163bd-ff1f-41ef-b8ef-e96c4572e443.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/9c4163bd-ff1f-41ef-b8ef-e96c4572e443.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/9c4163bd-ff1f-41ef-b8ef-e96c4572e443.jpg 2x" height="400" width="800" alt="" /> WorldJan 14, 2025 Global Diets: Fewer Enjoying Food, Eating Healthy Although people worldwide were less satisfied with aspects of their eating experiences in 2023 than in 2022, most continued to enjoy their food and say it was healthy. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/ec4b4056-a58d-4b3b-8147-a863c92ade09.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/ec4b4056-a58d-4b3b-8147-a863c92ade09.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/ec4b4056-a58d-4b3b-8147-a863c92ade09.jpg 2x" height="400" width="800" alt="" /> WorldJan 13, 2025 U.S. Image Among NATO Allies Improved Under Biden Ratings of U.S. leadership across NATO suggest America's image abroad was closer to "better" than "back" throughout Joe Biden's presidency. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/983219b1-462f-4e38-aadc-0943043cb669.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/983219b1-462f-4e38-aadc-0943043cb669.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/983219b1-462f-4e38-aadc-0943043cb669.jpg 2x" height="400" width="800" alt="" /> PoliticsDec 20, 2024 More Americans Favor Quick End to Russia-Ukraine War Americans are split over whether Ukraine should make concessions to promote a faster end to the war with Russia, a shift from prior readings, when they favored Ukraine fighting as long as needed to regain its captured territory. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/TGBCMS/d974dc6d-e831-4bab-ad6d-7e69a4528bf8.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/TGBCMS/d974dc6d-e831-4bab-ad6d-7e69a4528bf8.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/TGBCMS/d974dc6d-e831-4bab-ad6d-7e69a4528bf8.jpg 2x" height="400" width="800" alt="" /> Gallup BlogDec 19, 2024 8 Global Trends to Follow in 2025 As the Gallup World Poll enters its 20th year, we look back at the biggest global discoveries from 2024 while looking ahead to what's in store for 2025. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/406bf48f-0d48-44ad-93e6-c197b2c3fb8e.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/406bf48f-0d48-44ad-93e6-c197b2c3fb8e.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/406bf48f-0d48-44ad-93e6-c197b2c3fb8e.jpg 2x" height="400" width="800" alt="" /> WorldDec 17, 2024 Americans Pass Judgment on Their Courts Between 2020 and 2024, Americans' confidence in the U.S. judicial system and courts declined by 24 percentage points, one of the largest country-level drops for the courts measured globally since 2006. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/93daf65c-18f1-42ed-815d-23c3381c04a2.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/93daf65c-18f1-42ed-815d-23c3381c04a2.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/93daf65c-18f1-42ed-815d-23c3381c04a2.jpg 2x" height="400" width="800" alt="" /> WorldDec 10, 2024 Javier Milei's Argentina in 6 Charts At the one-year mark of Javier Milei's presidency, economic optimism in Argentina is higher, but long-standing challenges remain. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/544311a5-5002-4650-9d35-c9e643a1caae.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/544311a5-5002-4650-9d35-c9e643a1caae.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/544311a5-5002-4650-9d35-c9e643a1caae.jpg 2x" height="400" width="800" alt="" /> WorldNov 22, 2024 Ukrainians Less Hopeful About the Future Ukrainians' future life ratings have dropped from 7.9 to 6.9 since Russia's invasion, reflecting growing war fatigue. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/59d9fd6b-0e2a-410d-853b-680cb098b9bf.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/59d9fd6b-0e2a-410d-853b-680cb098b9bf.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/59d9fd6b-0e2a-410d-853b-680cb098b9bf.jpg 2x" height="400" width="800" alt="" /> WorldNov 21, 2024 War Rally Fades for Ukraine's Leadership Ukrainians' approval of their president and confidence in their national government are at the lowest points since the war with Russia began, but their trust in their military is unwavering. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/662e92c7-d0d0-47f8-a479-313bfa833f5f.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/662e92c7-d0d0-47f8-a479-313bfa833f5f.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/662e92c7-d0d0-47f8-a479-313bfa833f5f.jpg 2x" height="400" width="800" alt="" /> WorldNov 20, 2024 Ukrainians Grow More Skeptical of West After more than two years of war, Ukrainians' hopes for a quick accession to NATO and the EU have slipped, along with their approval of U.S. leadership. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/6e59a66f-b1f2-4d75-90d5-314825d5adf2.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/6e59a66f-b1f2-4d75-90d5-314825d5adf2.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/6e59a66f-b1f2-4d75-90d5-314825d5adf2.jpg 2x" height="400" width="800" alt="" /> WorldNov 19, 2024 Half of Ukrainians Want Quick, Negotiated End to War Ukrainians are growing increasingly weary of the war with Russia. Gallup's latest surveys of Ukraine show 52% would like to see the war end as soon as possible. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/5cb3ee0b-05f8-46dd-af5c-84d359ae055d.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/5cb3ee0b-05f8-46dd-af5c-84d359ae055d.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/5cb3ee0b-05f8-46dd-af5c-84d359ae055d.jpg 2x" height="400" width="800" alt="" /> WorldNov 15, 2024 Road Accidents Remain World's Top Perceived Safety Risk New data from the Lloyd's Register Foundation World Risk Poll show that road accidents are still the biggest perceived safety risk worldwide. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/0ab89692-09f8-45f9-a5e4-cca986299475.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/0ab89692-09f8-45f9-a5e4-cca986299475.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/0ab89692-09f8-45f9-a5e4-cca986299475.jpg 2x" height="400" width="800" alt="" /> WorldNov 7, 2024 Germany's 'Wall in the Head' Is Coming Down Gallup trends show that in many respects, public opinion in the former East and West Germany is converging. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/81c1c2e8-d759-4206-84dc-3070359f0d6a.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/81c1c2e8-d759-4206-84dc-3070359f0d6a.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/81c1c2e8-d759-4206-84dc-3070359f0d6a.jpg 2x" height="400" width="800" alt="" /> WorldOct 31, 2024 Desire to Migrate Remains at Record High Global migration data show people's desire to leave their country remains at its highest point in over a decade -- including in the U.S. and Canada. <img src="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/fcae0437-865a-4919-8280-09908efb6349.jpg" srcset="https://imagekit.gallup.com/fusion/tr:emd_btm_feature/POLL/fcae0437-865a-4919-8280-09908efb6349.jpg, https://imagekit.gallup.com/fusion/tr:emd_btm_feature_2x/POLL/fcae0437-865a-4919-8280-09908efb6349.jpg 2x" height="400" width="800" alt="" /> WorldOct 22, 2024 No One Trusts Elections Less Than Bulgarians Just 10% of Bulgarians are confident in their elections as they head to the polls Sunday for the seventh time since 2021. Load More'''
