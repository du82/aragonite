full_description = '''Share on LinkedIn Share on Twitter Share on Facebook Share via Email Print Privacy Statement Last Updated April 11, 2024 The protection of personal privacy has always been a hallmark of Gallup. Since its inception in 1935, Gallup has maintained the confidentiality of each survey respondent unless an individual user consents to the release of the user’s Personal Information or individual results. In a similar manner, Gallup protects the identity of individuals who access Gallup websites. For the purposes of this Privacy Statement, the terms “Gallup,” “we,” “us” and “our” refer to Gallup, Inc., 901 F Street, NW, Washington, D.C., 20004, U.S.A. and its subsidiaries and affiliates. Gallup’s data protection officer can be contacted at Privacy_Administrator@Gallup.com. This Privacy Statement describes the types of information, including Personal Information, collected and processed through Gallup websites and mobile applications (collectively, “websites”) and through the services delivered via Gallup websites, and how Gallup treats such information. For questions about this Privacy Statement or your Personal Information, please contact Privacy_Administrator@Gallup.com. Personal Information By using the term “Personal Information” in our Privacy Statement, we refer to information that you individually provide to Gallup, either directly or indirectly, that, on its own or in combination with other information, can be used to identify you or make you identifiable. Personal Information includes, for example, your name, your mailing address, your telephone number, your email address or other information that identifies you or makes you identifiable. Information that by itself cannot be used to identify you or make you identifiable does not qualify as Personal Information. This Privacy Statement covers the following topics: I. INFORMATION COLLECTED BY GALLUP WEBSITES Information Collected Indirectly Information Collected Directly II. DATA COLLECTION Access to Your Survey or Assessment Results From Another User Account Sharing Your Survey Results With Other People III. GENERAL INFORMATION ON COLLECTION AND PROCESSING OF INFORMATION Correcting and Changing User Information and Preferences; Deletion of User Accounts Information Security Third-Party Information Storage Children and Privacy Links to Other Sites Location of Data Collection and Processing and Storage Your Rights Sensitive Information Dispute Resolution “Do Not Track” Signals U.S. State-Specific Privacy Disclosure Gallup Privacy Notice for California Residents Policy Updates Accessibility Additional Questions or Comments I. INFORMATION COLLECTED BY GALLUP WEBSITES Gallup websites gather information in two ways: (1) indirectly (for example, through our site’s technology), and (2) directly (for example, when you, the site visitor, voluntarily provide information on various pages). 1. Information Collected Indirectly Gallup indirectly collects a variety of information through your interaction with and use of Gallup websites. This information may include, but is not limited to, browser and device information, data collected through automated electronic interactions, application usage data, content information based on your individual interests, demographic information, geographic or geo-location information, statistical and aggregated information (“Other Information”). Statistical or aggregated information does not directly identify a specific person, but it may be derived from Personal Information. For example, we may aggregate Personal Information to calculate the percentage of users in a particular ZIP code. If we combine Other Information with Personal Information, we will treat the combined information as Personal Information. Cookies and Other Tracking Technologies Like many other companies, we use cookies and other tracking technologies (such as pixels and web beacons). To learn more about how we use cookies and your choices regarding our use of cookies, please see our Cookie Policy. 2. Information Collected Directly Gallup also collects Personal Information and other information that users voluntarily provide. It is entirely your decision to provide the requested information. Gallup keeps all information directly collected confidential, and will use the information only for the particular purpose stated at the point of collection. Gallup will seek your specific permission for any additional use. You may choose to have this information removed at any time. 2.1. User Account Data When setting up an account on one of the Gallup websites (“User Account”), you may be asked to provide Personal Information including, but not limited to, your name, email address and your phone number. If you choose to purchase any products, services, access codes or other items for sale by Gallup, you will be asked to provide payment details and your full address for billing purposes. As a customer/user of Gallup, we may obtain Personal Information about you when you register to use one of our websites or services/products or when you provide feedback about our products or services. For European data subjects, the processing is necessary to perform the contract with you according to Article 6 (1) 1 lit. b) of the European Union’s General Data Protection Regulation (“GDPR”) or UK General Data Protection Regulation for United Kingdom data subjects. As a customer/user, we will use your Personal Information, unless otherwise prohibited by law, for the following purposes: To provide you with the products and services you request. To communicate with you about your account or transactions with us and send you changes to our policies. To provide support, including, but not limited to, product updates, product patches and fixes and other similar communications. Furthermore, we will use your Personal Information for our legitimate interests according to Article 6 (1) 1 lit. f) GDPR to notify you about information about features on our site, new product releases and service developments and to advertise Gallup's products and services in accordance with this Privacy Statement. Any User Account data will be stored only until you decide to terminate your User Account (see clause III.1. below). In case we are obliged to further store your Personal Information due to statutory retention requirements, your Personal Information will be barred for further use by Gallup and be stored only until such retention periods expire. 2.2. Other Personal Information Provided Directly Personal Information provided by you on Gallup websites, e.g., via contact forms or via telephone, will be stored in our service database and retained for the period necessary to fulfill our contractual obligations to you in accordance with Art. 6 (1) 1 lit. b) GDPR unless a longer retention period is required by law. II. DATA COLLECTION Many Gallup websites offer users the opportunity to participate in surveys or assessments via the internet. Gallup will provide information about the purpose and process for each survey or assessment as part of the applicable survey or assessment. 1. Access to Your Survey or Assessment Results From Another User Account Another online user may purchase an access code to a Gallup survey or assessment for you. Please note that when participating in a survey or assessment, your results will also be accessible to the online user who purchased the Gallup access code. The data accessible to that account holder may include your name and your results, but will not include your specific answers to individual questions within the survey or assessment. In addition, the account holder cannot modify, alter or delete any of your results or User Account data. After completion of the survey or assessment, you will at all times have the opportunity to change the settings for sharing your results with other account holders and to opt out from sharing your results. 2. Sharing Your Survey Results With Other People After completion of the survey or assessment, you may have the opportunity to share your survey or assessment results via email or social networks. Please note that only your name and results will be displayed. By sharing your information from your User Account with any social media service, you are authorizing us to share information we collect from and about you with the social media service provider, other users, and your network of contacts on the social media service, and you understand that the social media service's use of the shared information will be governed by the social media service's privacy policy. If you do not want your Personal Information shared in this way, please do not connect your Gallup information to a social media service provider. III. GENERAL INFORMATION ON COLLECTION AND PROCESSING OF INFORMATION 1. Correcting and Changing User Information and Preferences; Deletion of User Accounts If you have given your consent in accordance with Article 6 (1) 1 lit. a) GDPR to receiving email communications from Gallup but wish to withdraw your consent and discontinue this service, you may do so at any time by clicking the unsubscribe link included in the footer of our emails or by contacting us (see also below clause III.7. "Your Rights"). You also have the option at all times to have your User Account deleted for any of the Gallup websites or to request a revision of your user information at any time. To do so, please contact us. 2. Information Security Gallup employees understand the need for user privacy, and we maintain reasonable and appropriate security procedures to protect your information from loss, misuse and unauthorized access, disclosure, alteration and destruction, taking into account the risks involved in the processing and the nature of the Personal Information. Gallup has appointed a Privacy Policy Administrator to monitor privacy practices. Access to user data is strictly limited to specific individuals who are trained to respect user privacy. The access given to these employees is restricted to their need for such information for business purposes. A log of those who accessed the data is maintained and monitored to prevent security breaches. However, no security measure or modality of data transmission over the internet is 100% secure. Although we strive to use commercially acceptable means to protect your Personal Information, we cannot guarantee absolute security. 3. Third-Party Information Storage We provide Personal Information to our affiliates and other trusted businesses or persons to process it for us, based on our instructions and in compliance with our Privacy Statement and any other appropriate confidentiality and security measures. For example, we use vendors such as Amazon cloud for data storage. Any vendor or agent that we retain is not allowed to use Personal Information they receive from us for any other purpose than to perform the contracted services we have contracted them to perform. 4. Children and Privacy Gallup encourages parents and guardians to spend time with their children online and to be fully familiar with the sites visited by their children. Gallup websites do not contain content that is generally considered unsuitable for children. 5. Links to Other Sites Gallup websites may contain links to sites owned and/or operated by other organizations, and the privacy policies of those sites may differ from that of Gallup. These sites may collect data and make use of it in ways that Gallup does not. We encourage you to review the privacy policies posted on all third-party sites. 6. Location of Data Collection and Processing and Storage In personally accessing Gallup websites, you may be submitting Personal Information and survey or assessment results that Gallup will use for business purposes that are consistent with this Privacy Statement. As a worldwide organization, Gallup collects information that may be processed internationally throughout Gallup offices worldwide. Your information may be processed in the United States or any other country in which Gallup maintains facilities, including any Gallup subsidiary (a complete list of Gallup companies can be found on Gallup.com). Gallup keeps Personal Information gathered and processed for the purposes described in this Privacy Statement for as long as there is a business purpose for doing so. Please also see clauses I.2.1 and I.2.2 above for additional information on how we retain your Personal Information. 7. Your Rights You have the right to access the Personal Information that we hold about you and to correct, update, amend, suppress, delete or otherwise modify any Personal Information where it is inaccurate. When updating your Personal Information, we may ask you to verify your identity before we can act upon your request. You may also, if governed by GDPR, object to the use or processing of your Personal Information or withdraw consent to use your Personal Information at any time. Under GDPR, regarding the processing of your Personal Information, you have the following rights: the right to require free of charge (i) information on whether your Personal Information is retained and (ii) access to and/or (iii) duplicates of the Personal Information retained. However, if the request affects the rights and freedoms of others or is manifestly unfounded or excessive, we reserve the right to charge a reasonable fee (taking into account the administrative costs of providing the information or communication or taking the action requested) or refuse to act on the request; the right to request proper rectification, removal or restriction of your Personal Information; where processing of your Personal Information is either based on your consent or necessary for the performance of a contract with you, and processing is carried out by automated means, the right to receive the Personal Information concerning you in a structured, commonly used and machine-readable format or to have your Personal Information transmitted directly to another company, where technically feasible (data portability); where the processing of your Personal Information is based on your consent, the right to withdraw your consent at any time without impact to data processing activities that have taken place before such withdrawal or to any other existing legal justification of the processing activity in question; the right not to be subject to any automatic individual decisions that produce legal effects on you or similarly significantly affect you; and the right to take legal actions in relation to any breach of your rights regarding the processing of the Personal Information, as well as to lodge complaints before the competent data protection regulators. Gallup complies with the EU-U.S. Data Privacy Framework (EU-U.S. DPF) and the UK Extension to the EU-U.S. DPF, and the Swiss-U.S. Data Privacy Framework (Swiss-U.S. DPF) as set forth by the U.S. Department of Commerce. Gallup has certified to the U.S. Department of Commerce that it adheres to th'''
