title = "Public Sector Success Stories | Gallup"
description = "Read success stories about our work with SDSN, the World Bank, Knight Foundation, West Health, Lumina Foundation, Gates Foundation and Omidyar Network."
full_description = '''Working Together to Change the World The organizations we work with are more than clients. They are partners in solving the most pressing problems facing humankind. Read Success Stories There was a need for more. More knowledge, more access, more voices, more change. We've still got work to do, but together we're making progress. View All Client Stories to learn about all of their accomplishments Featured Project Wellbeing for Planet Earth Foundation Aims to Establish Globally Inclusive Wellbeing Models The need to understand, measure and promote wellbeing is more urgent than ever before. The Wellbeing for Planet Earth Foundation recognizes this and seeks to foster a more inclusive and global understanding of wellbeing -- and in doing so, promote wellbeing for all. Read the full story about the Planet Earth Report 116 countries and territories surveyed Featured Project Measuring Risk and Safety Around the World With Lloyd's Register Foundation Making the world a safer place is an ambitious mission. Learn how Lloyd's Register Foundation is tackling this challenge by developing a first-of-its-kind poll to establish a baseline for how people perceive and experience risk in their everyday lives. Read the full story about the Lloyd's Report 150,000+ individuals surveyed Featured Project Making Everyday Cooking Fun and Measuring Global Home Cooking Habits With Cookpad Cooking can be an agent for change. Learn how Cookpad is helping home cooks across the globe find daily cooking inspiration and leading the first ever global analysis of cooking across the world. Read the full story about the Cookpad Report 300,000+ individuals surveyed Featured Project Wellcome Measures Trust in Science How can important discoveries for improved public health best reach the public they are meant to serve? Wellcome seeks to find out by using the Wellcome Global Monitor to discover vital insights on attitudes toward science, health and vaccines across the world. Read the full story about the Wellcome Measures Trust in Science Report 73% of people worldwide would trust a doctor or nurse more than any other source of health advice. Featured Project Sustainable Development Solutions Network (SDSN) Tracks the World's Happiness The most famous statistics -- GDP, household income and unemployment -- focus on the rational side of what people do: what they spend, how much they make and whether they have a job. Traditional metrics like these do not tell us anything about people's happiness. That's why SDSN partnered with the Gallup World Poll to create the World Happiness Report -- a novel means of uncovering and promoting approaches that address the economic, social and environmental challenges confronting people around the world. Read The Full Story about tracking the world's happiness "Happiness can change, and does change, according to the quality of the society in which people live." John F. Helliwell, Editor, World Happiness Report Featured Project The World Bank Monitors Progress on Financial Inclusion The more people with bank accounts, the better the world's citizens can safely store their money, manage risks and access credit when needed. But there was no comprehensive way to measure who had bank accounts until the World Bank -- with funding from the Bill & Melinda Gates Foundation -- combined its passion and mission with Gallup's expertise in measuring global public opinion to create the Global Findex database. Read the Full Story about monitoring world bank progress on financial inclusion Sustainable Development Goal 8.10.2 Featured Project Confidence in News Media and Democracy: Knight Foundation Leads National Conversation As the informational landscape has rapidly transformed, Americans' trust in mass media is eroding in real time. The stakes could not be higher for the ongoing work of the John S. and James L. Knight Foundation to understand perceptions of media, technology, social media and freedom of expression in the digital age. Read the full story 50,000+ unique respondents Featured Project West Health Shapes the Debate on Healthcare Costs West Health has been working toward its mission of lowering healthcare costs for seniors since 2006. As the healthcare crisis in the U.S. continues to burden Americans with physical, psychological, financial and economic impacts, the organization found a way to amplify its mission and become a leader in turning discussion toward action. Read the full story about the World Happiness Report 77% of Americans fear rising healthcare costs will damage the U.S. economy Featured Project Lumina Foundation, Gates Foundation and Omidyar Network Tell Full Story of U.S. Job Quality Numbers tell a story. But traditional measures of job quality were missing an important piece: how workers felt about their jobs. Lumina Foundation, the Bill & Melinda Gates Foundation, Gallup and Omidyar Network collaborated to create a pivotal new job survey that would measure what workers truly need and value in their jobs and make sure key influencers understand what matters most. Read the full story about the World Happiness Report 60% U.S. workers who are in mediocre or bad jobs More Partnerships Mission-Driven Work to Elevate Voices Around the Globe From serving local communities to creating global impact, we help our clients fill data gaps, take the pulse of the world and generate new insights to pave the way toward solutions. Download List of Partnerships We live out the mission at Gallup too. We're using what we know to provide benchmarks for bettering lives. We are committed to conducting our own independent research and creating global statistics and metrics to track progress toward change. Center on Black Voices To fill the need for an independent, nonpartisan research center that documents and reports how Black Americans experience their lives, Gallup launched the Center on Black Voices. This is a 100-year commitment to listen, learn and report the facts on Black Americans' level of access to and relationship with the economy, justice, wellbeing, education equity and opportunity -- which are the driving forces of a great life. Learn More about this partnership Global Happiness Center Improving and sustaining high wellbeing is vital to any population's overall health and to its economy. This is why Gallup regularly asks people around the world about their lives, including how satisfied they are with them and what they are feeling and experiencing -- both good and bad -- on a daily basis. Learn More Global Law and Order Research Center Discover which countries are the furthest from or closest to reaching the United Nations' goal for peaceful, secure societies. Each year, Gallup monitors important indicators of global feelings on security, crime and law enforcement in more than 140 countries worldwide. Learn More about this partnership Global Leadership Approval Center In the Information Age, power isn't only determined by whose army wins, but also by whose story wins. Soft power -- the ability to affect others to get what you want without paying them or using force -- depends on people's perceptions. Since 2005, Gallup has been tracking the entire world's perceptions of the job performance of the leadership of some of the biggest players on the global stage -- the U.S., Germany, China and Russia. Learn More about this partnership Migration Research Center How many people want to leave their country? Where do they want to go? How do people feel about migrants living in their communities? How do migrants feel about their own lives? With the number of migrants expected to top 400 million over the next few decades, these questions need answers. That's why Gallup has been asking them. Learn More about this partnership Learn More Everyone has an opinion. A thought leader has a solution. Gallup can help you get the insights you need to cut through the noise. Build your platform. Learn More Ask the right questions. Learn More Lead the conversation. Learn More Let's make change together. Fill out the form below to learn more about our research and strategic communications offerings. A Gallup expert may contact you. //<![CDATA[ var theForm = document.forms['aspnetForm']; if (!theForm) { theForm = document.aspnetForm; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> //<![CDATA[ function WebForm_OnSubmit() { if (typeof(ValidatorOnSubmit) == "function" && ValidatorOnSubmit() == false) return false; return true; } //]]> (*) Required * Full Name * Job Title Select One Executive Vice President Director Senior Manager Manager Staff President/Superintendent Senior Administrator Faculty/Staff/Educator Student Other * Email Address * Phone Number * Company * Postal Code * Country or Region Select One United States of America Afghanistan Aland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia (Plurinational State of) Bonaire, Sint Eustatius and Saba Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory (the) Brunei Darussalam Bulgaria Burkina Faso Burundi Cambodia Cameroon Canada Cape Verde Cayman Islands (the) Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands (the) Colombia Comoros Congo (Kinshasa) Congo Brazzaville Cook Islands (the) Costa Rica Cote d'Ivoire Croatia Cuba Cyprus Czech Republic Democratic People's Republic of Korea Denmark Djibouti Dominica Dominican Republic Ecuador Egypt El Salvador Equatorial Guinea Eritrea Estonia Ethiopia Falkland Islands (the) [Malvinas] Faroe Islands Federated States of Micronesia Fiji Finland France French Guiana French Polynesia French Southern Terr