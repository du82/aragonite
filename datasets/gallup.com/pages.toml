["https://www.gallup.com/analytics/318923/world-poll-public-datasets.aspx"]
title = "Discover Global Datasets for Public Use | Gallup"
description = "Develop new analyses and insights on the world’s most pressing issues with datasets made freely available to the public by Gallup’s clients."
full_description = '''Global Datasets for Public Use Explore datasets made freely available to the public by Gallup's clients. Powered by the Gallup World Poll, these datasets, collected on behalf of our partners at different organizations, allow researchers and decision-makers to access data and develop new analyses and insights on the world's most pressing issues. Gallup World Poll data subscribers can merge the datasets below with the full World Poll dataset for additional analyses. Learn More about Gallup Analytics subscription Briq InstituteGlobal Preferences Survey A globally representative study on risk and time preferences, positive and negative reciprocity, altruism, and trust from 76 countries around the world. Access Data From the Briq Instituteabout the Global Preferences Survey (will open in a new window) European Commission DG REGIONew Standardized Degree of Urbanisation Variable The United Nations-endorsed Degree of Urbanisation variable is a single global method for classifying what constitutes a city, an urban area or a rural area in any part of the world. Access Dataabout the New Standardized Degree of Urbanisation Variable (will open in a new window) Food and Agriculture Organization of the United NationsVoices of the Hungry Gallup collects Food Insecurity Experience Scale (FIES) data in support of FAO's monitoring of global progress toward ending hunger and achieving food security (SDG 2.1.2). FAO provides public access to annual, Gallup-collected data from 77 countries from 2014 onward. Access Data From FAOabout the Food and Agriculture Organization of the United Nations (will open in a new window) Lloyd's Register FoundationWorld Risk Poll The world's largest study into how people worldwide think and feel about risk and safety, including at work. The first wave of World Risk Poll data was collected in 2019 across 142 countries and territories. Building on the findings from the first wave, the second wave was conducted in 2021 across 121 countries and territories, covering subjects like resilience in the face of disasters, violence and harassment at work, as well as continuing to monitor risk perceptions and experiences of harm worldwide. Access Data From the World Risk Pollconcerning what the world worries about (will open in a new window) Omidyar NetworkPrindex The Global Property Rights Index (Prindex) measures citizens' perceptions of the security of their land and property rights globally. Access Data From Prindexconcerning the Omidyar Network (will open in a new window) S&PGlobal FinLit Survey The Standard & Poor's Ratings Services Global Financial Literacy Survey is the world's largest, most comprehensive global measurement of financial literacy. Access Data From S&Pto measure people's knowledge about financial concepts (will open in a new window) The World BankGlobal Findex Database The world's most comprehensive dataset on how adults save, borrow, make payments and manage risk. Every three years, Gallup surveys 150,000 adults in over 140 economies. Access Data From Findexabout The World Bank (will open in a new window) Wellbeing for Planet Earth FoundationGlobal Wellbeing Initiativee The Global Wellbeing Initiative (GWI) will generate an innovative research agenda aimed at improving societies, families and workplaces. This includes developing new models of wellbeing to reflect the impact of culture, community, governance and nature. Access Data From Global Wellbeing Initiativeto find the purpose of this wellbeing module (will open in a new window) WellcomeWellcome Global Monitor In 2018, the Wellcome Global Monitor survey (opens in a new window) asked more than 140,000 people in more than 140 countries and areas about their attitudes toward science and major health challenges, including vaccinations, their trust in health authorities and how science benefits society. In its second iteration, the Monitor explored how the pandemic affected the lives of people around the world and influenced their perceptions of science, healthcare systems and governments. Access Dataabout Wellcome (will open in a new window) About Gallup Analytics and World Poll Microdata Subscriptions: Your Comprehensive Data Sources For more than a decade, Gallup's World Poll has enabled international organizations, foundations, academic institutions and more to gather nationally representative cross-country comparable data in more than 160 countries and areas, empowering researchers to answer questions that nobody else can. In addition to the publicly available data highlighted above, the respondent-level global datasets are available for purchase. In addition, global trends from Gallup's World Poll are also available in Gallup Analytics, a subscription-based data visualization and data access portal that houses more than a decade of international data from more than 160 countries and areas and 80+ years of U.S. national data. Find out if you have access through your university or institution, or fill out the contact form below to learn more about getting a subscription. Access crucial data for your research. To learn more about Gallup Analytics and World Poll microdata subscriptions, fill out the form below. A Gallup expert may contact you. //<![CDATA[ var theForm = document.forms['aspnetForm']; if (!theForm) { theForm = document.aspnetForm; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> //<![CDATA[ function WebForm_OnSubmit() { if (typeof(ValidatorOnSubmit) == "function" && ValidatorOnSubmit() == false) return false; return true; } //]]> (*) Required * Full Name * Job Title Select One Executive Vice President Director Senior Manager Manager Staff President/Superintendent Senior Administrator Faculty/Staff/Educator Student Other * Email Address * Phone Number * Company * Postal Code * Country or Region Select 