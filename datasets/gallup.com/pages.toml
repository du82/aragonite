title = "Walton Family Foundation-Gallup Gen Z Research Hub"
description = "Explore Gen Z's perceptions of their lives, school and their outlook for the future."
full_description = '''Thank you for downloading the Parenting Gen Z: Navigating Boundaries, Complex Emotions and Tough Conversations report. See PDF See the Press Release Walton Family Foundation Gen Z Research Walton Family Foundation and Gallup have partnered to study Gen Z's lives and experiences. Download the Latest Report Download the Latest Press Release Parenting Gen Z: Navigating Boundaries, Complex Emotions and Tough Conversations The latest survey from Walton Family Foundation and Gallup, in partnership with clinical psychologist Dr. Lisa Damour, provides greater insight into parents' experiences raising Gen Z, how parents and children contend with their emotions, and the coping mechanisms and parenting support Gen Z prefers when struggling. The results reveal that Gen Z's emotional lives and parent-child dynamics are complicated. Most Gen Z children are happy and enjoy their lives -- but sizeable segments also struggle with stress, anxiety, sadness and loneliness. Parents find it difficult to talk about topics they worry most about, such as their child's mental health, feelings and experiences on social media -- but their children overwhelmingly find those conversations to be helpful. To better understand the most critical challenges of being a Gen Z child or their parent, Walton Family Foundation and Gallup asked both groups to share what was most difficult or important about their experiences as parents or children. Download Reportabout parenting Gen Z Parenting Gen Z: Navigating Boundaries, Complex Emotions and Tough Conversations The latest survey from Walton Family Foundation and Gallup, in partnership with clinical psychologist Dr. Lisa Damour, provides greater insight into parents' experiences raising Gen Z, how parents and children contend with their emotions, and the coping mechanisms and parenting support Gen Z prefers when struggling. The results reveal that Gen Z's emotional lives and parent-child dynamics are complicated. Most Gen Z children are happy and enjoy their lives -- but sizeable segments also struggle with stress, anxiety, sadness and loneliness. Parents find it difficult to talk about topics they worry most about, such as their child's mental health, feelings and experiences on social media -- but their children overwhelmingly find those conversations to be helpful. To better understand the most critical challenges of being a Gen Z child or their parent, Walton Family Foundation and Gallup asked both groups to share what was most difficult or important about their experiences as parents or children. Download Reportabout parenting Gen Z 90%+ of Gen Z children felt a lot of happiness and enjoyment the prior day -- but sizeable segments also struggle with stress, anxiety, sadness and loneliness. 59% Nearly six in 10 parents report feeling stressed a lot the previous day, and 40% felt worried. 42% of parents say their leading source of worry is their child's plans for the future. Other Work Additional Work Insights Social & Policy IssuesFewer Jobs, College Options May Push Rural Gen Zers to MoveSocial & Policy IssuesFive Things to Know About Gen Z Kids and Their ParentsEducationK-12 Schools Struggle to Engage Gen Z StudentsEducationParents Avoid Hard -- but Helpful -- Conversations With Gen Z Additional Reports Download Past Walton Family Foundation-Gallup Reports 2024 Voices of Gen Z Study Download Report about Gen Z Study | about Voices of Gen Z Study Report Link 2024 Voices of Gen Z: Arkansas Youth Download Report about Voices of Gen Z: Arkansas Youth | about Voices of Gen Z: Arkansas Youth Report Link 2024 Report Card: Student Perspective on U.S. Schools Download Report about Report Card: Student Perspective on U.S. Schools | about Report Card: Student Perspective on U.S. Schools Report Link 2024 Voices of Gen Z: Youth Happiness Download about Voices of Gen Z: Youth Happiness Report | about Voices of Gen Z: Youth Happiness Report Link | Download about Voices of Gen Z: Youth Happiness Data 202