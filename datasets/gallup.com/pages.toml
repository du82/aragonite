U.S. satisfaction is Gallup's version of the "right track/wrong track" questions asked by many polling firms over the years. The indicator reflects Americans' assessments of conditions in the country in the broadest sense, and it can be a useful indicator of a president's reelection prospects. Gallup first asked its satisfaction question in 1979 and, after updating it periodically for two decades, began tracking it monthly as part of the ongoing Gallup Poll Social Series. Additionally, Gallup has reported on presidential job approval since 1938, reporting it at least monthly for the vast majority of that history. Read More about U.S. Governance and Institutional Measures Read Less about U.S. Governance and Institutional Measures U.S. Satisfaction !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); U.S. Presidential Approval View all historical data here !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); U.S. Congressional Approval !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { v