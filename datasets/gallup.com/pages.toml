full_description = '''Thank you for downloading The Global Safety Report! See Global Safety Report PDF Download Press Release World Poll Global Safety Research Center Personal Security Worldwide Gallup's Global Safety Research Center measures countries' progress toward achieving the United Nations' goal for peaceful, secure societies. Download the Latest Report Featured Report Interactive Data Survey Methods Additional Insights Additional Reports The Global Safety Report: Measuring Personal Security Worldwide Traditional statistics like crime reports, arrests and victimization rates objectively describe how safe communities are -- but they can't tell us anything about how safe people feel. People's feelings of safety are so vital to human development that the United Nations includes the metric as an indicator for its Sustainable Development Goals. The only way to know if people feel safe is to ask them, which is what Gallup has done for nearly 20 years. Ensuring people feel safe is the first, crucial step on the path to sustainable growth and building successful societies, but it is hardly the last. The data in Gallup's 2024 Global Safety Report show where the world stands on that first step. Download Report Download Report Personal Security for People Worldwide The Global Safety Report Every year, The Global Safety Report tracks people's perceptions of their safety, security and confidence in their local police. 71% More people (71%) feel safe walking alone at night than they did a decade ago. 27% Ecuadorians feel the least safe walking alone at night (27%) of any population in the world. 68% Feelings of safety walking alone at night in Israel fell from 88% before the Oct. 7, 2023, attacks to 68% after. Gauging Global Feelings of Safety Key Findings Sustainable growth starts with ensuring people feel secure. Gallup's Global Safety Report explores who feels the most and least secure worldwide, based on metrics such as how safe they feel walking alone at night and their confidence in local police. 71% More people (71%) feel safe walking alone at night than they did a decade ago. 27% Ecuadorians feel the least safe walking alone at night (27%) of any population in the world. 68% Feelings of safety walking alone at night in Israel fell from 88% before the Oct. 7, 2023, attacks to 68% after. Use the map below to explore each country's results. Global Safety placeholder Law and Order Index placeholder !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods The results in this report are based on nationally representative, probability-based samples among the adult population aged 15 and older in 140 countries and areas in 2023. With the exception of China and a subset of 26 countries, the 2023 results are based on telephone or face-to-face surveys of approximately 1,000 or more respondents. The 2023 survey in China was done via web with 2,200 respondents. 2023 data for China were collected using a web self-administered mode (computer-aided web interviewing or CAWI). Gallup adopted a hybrid approach to data collection in 26 countries that are typically surveyed by telephone. The countries Gallup identified for this hybrid approach all have high levels of access to the internet among the adult population. Gallup used high quality, third-party panels that are commercially available as the sample source for the portion of World Poll data collected via web in 2023. Many of these panels are put together using opt-in methods, although where there was access to high quality, probability-based panels, we incorporated it into our design. To ensure adequate representation of the adult 15 and older population among panel members, Gallup set interview quotas on age, gender, region and education. There is no such quota requirement for the telephone random-digital-dial part because it is expected to fall out naturally according to population proportions. From a questionnaire design perspective, the web survey instrument closely matched the telephone survey instrument with the item format adapted slightly for self-administered mode and to capture of high-quality data via web. Gallup implemented best practices on web-survey design to minimize item non-response, illogical responses, and incomplete responses. For results based on the total sample of national adults in 2023, the margin of sampling error ranges between ±2.2 and ±5.5 percentage points at the 95% confidence level. The margin of error reflects the influence of data weighting. In addition to sampling error, question wording and practical difficulties in conducting surveys can introduce error or bias into the findings of public opinion polls. Additional Insights WorldLife in Israel One Year After Oct. 7WorldGlobal Safety Starts to SlipWorldGuayas, Ecuador: The Least Safe Place on the Planet?WorldConfidence in Police Rises, but World Doesn't Feel Safer Reports Tracking Global Safety The Global Safety Report (previously the Law and Order Report) allows world leaders to compare each country's progress (including their own) toward the United Nations' goal of building a more peaceful and secure world. World Poll Law and Order 2023 Report Download Report Law and Order 2023 World Poll Law and Order 2022 Report Download Report Law and Order 2022 Report World Poll Law and Order 2021 Report Download Report Law and Order 2021 World Poll Law and Order 2020 Report Download Road Law and Order 2020 Report World Poll Law and Order 2019 Report Download Report Law and Order 2019 Report Show More of Additional Reports Download The Global Safety Report Fill out the form below to get instant access to the 2024 Global Safety Report. //<![CDATA[ var theForm = document.forms['aspnetForm']; if (!theForm) { theForm = document.aspnetForm; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> //<![CDATA[ function WebForm_OnSubmit() { if (typeof(ValidatorOnSubmit) == "function" && ValidatorOnSubmit() == false) return false; return true; } //]]> (*) Required * Email Address * Country or Region Select One United States of America Afghanistan Aland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia (Plurinational State of) Bonaire, Sint Eustatius and Saba Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory (the) Brunei Darussalam Bulgaria Burkina Faso Burundi Cambodia Cameroon Canada Cape Verde Cayman Islands (the) Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands (the) Colombia Comoros Congo (Kinshasa) Congo Brazzaville Cook Islands (the) Costa Rica Cote d'Ivoire Croatia Cuba Cyprus Czech Republic Democratic People's Republic of Korea Denmark Djibouti Dominica Dominican Republic Ecuador Egypt El Salvador Equatorial Guinea E