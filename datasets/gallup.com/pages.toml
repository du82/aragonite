opportunities or actively looking for another job may be ready to leave your organization. U.S. placeholder Regional placeholder Global placeholder !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Top Reasons for Leaving a Job Why are employees leaving their employer? We asked U.S. employees to identify their primary reason for leaving their previous job. "Pay/Benefits" is the most common single reason employees left their job in 2024, yet it was identified only 16% of the time. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Looking at the top reasons in isolation can be misleading. When we classify all the reasons people give for leaving an employer into larger categories, as shown in the table below, we see that the theme of "Engagement and Culture" is the most prominent (37%), followed by the theme of "Wellbeing and Work-Life Balance" (31%). Together, these two areas of dissatisfaction make up 68% of the total reasons employees left their employer in 2024. That means four times as many people left their job due to "Engagement and Culture" or "Wellbeing and Work-Life Balance" reasons, compared with the number of people who primarily left for better "Pay/Benefits." !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Attributes That Attract Employees to a Different Organization Creating an inspiring employee value proposition is about more than fixing what is dissatisfying your workforce. Effective employee attraction and retention strategies require both an understanding of what people are looking for in a great career and the follow-through of bringing that employee value proposition to life. Below is a list of the top factors that attract people to their next job. Note the similarities between the reasons employees leave a job, as shown above, and the importance of the factors that most often attract them to an opportunity somewhere else. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); What else draws employees to new opportunities? Below is the full list of factors that Gallup studies, ranked by importance, to reveal what matters most to employees who are considering taking a job with a different employer. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods Global data are collected using the Gallup World Poll, which has conducted surveys of the world’s adult population, using randomly selected samples, since 2005. The survey is administered annually in person or by telephone, covering more than 160 countries and areas since its inception. Gallup’s global wellbeing data reflect the responses of adults, aged 15 and older, who are employed for any number of hours by an employer. The 2015 U.S. data come from Gallup’s Q12 Client Database, Gallup Panel studies or Gallup Daily tracking. See Gallup’s State of the American Workplace report, published in 2017, for more details. The more recent U.S. data are results for the Gallup poll of U.S. employees, based on self-administered web surveys of a random sample of adults who are aged 18 and older, working full time or part time for organizations in the United States, and members of the Gallup Panel. Gallup uses probability-based, random sampling methods to recruit its Panel members. Gallup weighted the obtained samples to correct for nonresponse. Nonresponse adjustments were made by adjusting the sample to match the national demographics of gender, age, race, Hispanic ethnicity, education and region. Demographic weighting targets were based on the most recent Current Population Survey figures for the aged 18 and older U.S. population. In addition to sampling error, question wording and practical difficulties in conducting surveys can introduce error or bias into the findings of public opinion polls. In line charts on this webpage, Gallup labels some data points with a year and month. Years that have only one data point labeled with the year and "Jan" (abbreviated for "January") reflect annual survey results. Years that have one data point labeled with a specific month besides January or that have multiple data points labeled with specific months reflect results obtained during the noted month(s). When Gallup’s survey field dates for one data point occur in more than one month, Gallup labels the data point with the ending month. Full wording for the intent to leave survey item is as follows:To what extent are you currently looking for a different job than the one you have now? I am actively looking for another job. I am watching for opportunities, but not actively looking. I am not looking for another job. Full wording for the survey item on primary reasons for leaving the previous job is in the comprehensive table called, “The Four Most Common Themes for Leaving a Job in 2022.” Results for some responses were combined. Item wording for some responses was shortened in the table showing the primary reasons U.S. employees voluntarily left their company. Full wording for the survey item on reasons for taking the next job is as follows:Please indicate how important each of the following is to you when considering whether or not to take a job with a different organization. It allows me to have greater work-life balance and better personal wellbeing. It significantly increases my income or improves my benefits package. It allows me to do what I do best. It provides greater stability and job security. The organization is diverse and inclusive of all types of people. The company/organization has a great reputation or brand. It allows me to move away from a bad manager or leader. It gives me greater autonomy in my work. It provides the option to work remotely from home some of the time. It allows me to work for a greater cause. Their COVID-19 vaccine policies align with my beliefs. It accelerates my professional or career development. Their COVID-19 policies for wearing masks and social distancing align with my beliefs. It provides the option to fully work from home all of the time. The organization’s record on protecting the environment It allows me to work in a new location, such as a country or city that I have always wanted to work in. Related Content Discover How to Improve Employee Retention and Attraction These data are more than just numbers. Explore this content for a deeper dive into employee retention metrics and attraction in the modern workplace. Featured Article 42% of Employee Turnover Is Preventable but Often Ignored Employee turnover risk is at its highest in nearly a decade. Learn how to reduce employee turnover by regularly having the right conversations. Read More about 42% of Employee Turnover Is Preventable but Often Ignored Featured Article Employee Retention Depends on Getting Recognition Right Recognition is a powerful tool that connects employees to their organization. Discover how quality recognition can boost employee retention. Read More about Employee Retention Depends on Getting Recognition Right Featured Article The Recruitment Process Is More Digital Than Ever The recruiting landscape has evolved -- finding top talent now requires an even greater online presence and highly accurate job descriptions. Learn more about what this means for organizations competing for talent. Read More about The Recruitment Process Is More Digital Than Ever Featured Article Enhancing the Employee Exit Experience Is Worth It Most workers who voluntarily leave weren't satisfied with their exit experiences. Discover why employers should be intentional about how leaving employees are treated. Read More about Enhancing the Employee Exit Experience Is Worth It Next Steps How Does Your Workplace Compare? Global and regional data tell a story -- but what you choose to do with the knowledge you gain from your own organization’s data shapes its unique story. Visit the resources below for solutions and next steps: Unlock your organization’s potential by embracing employee engagement -- a business strateg'''
