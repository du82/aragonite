["https://www.gallup.com/394505/indicator-life-evaluation-index.aspx"]
title = "Global Indicator: Life Evaluation Index - Gallup"
description = "Explore the global standard of measuring wellbeing, including how people around the world rate their lives now and expectations for the future."
full_description = '''!(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Indicators Life Evaluation Index Share on LinkedIn Share on Twitter Share on Facebook What We Measure The Life Evaluation Index measures how people rate their current and expected future lives. Global Life Evaluation Index Thriving 29% 1 Struggling 60% 1 Suffering 12% 1 Why It Matters Related Content Next Steps For Media Why it matters Why Does Gallup's Life Evaluation Index Matter? For its Life Evaluation Index, Gallup asks people to imagine a ladder, with the lowest rung representing the worst possible life and the highest rung representing the best possible life. Those rungs are numbered zero to 10, based on the Cantril Self-Anchoring Striving Scale. People rate where they stand today and where they expect to stand in five years. Gallup classifies those who rate their current life a 7 or higher and their anticipated life in five years an 8 or higher as thriving. Those who rate their current life and anticipated life in five years a 4 or lower are classified as suffering. Those who are neither suffering nor thriving are considered struggling. Globally, Gallup has tracked life evaluations in at least 100 countries and areas each year since 2005, recording the highs and lows of how people have viewed their lives through major upheavals and changes -- including such events as Brexit, the Arab uprisings and the Euromaidan revolution. Since Gallup began tracking this in 2005, the percentage of the global population rating their lives highly enough to be considered thriving has ranged from a low of 21% in 2009 to a high of 29% in 2020 and 2023. In the U.S., Gallup has tracked the Life Evaluation Index as part of domestic polling since 2008, recording the highs and lows of Americans' perceptions of their lives through the Great Recession and the COVID-19 pandemic, among other major events. Throughout that time, the percentage of Americans who are thriving has ranged from a low of 46% in November 2008 and April 2020 to a high of 59% in June 2021. Read More about Jim Clifton Read Less about Why Does Gallup's Life Evaluation Index Matter? U.S. placeholder Global placeholder !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods Global Methodology Results for the 2023 life evaluation ratings are based on nationally representative, probability-based samples among the adult populations, aged 15 and older, in 142 countries and areas surveyed throughout 2023. With the exception of China and a subset of 26 countries, the 2023 results are based on telephone or face-to-face surveys of approximately 1,000 or more respondents. 2023 data for China were collected using a web self-administered mode (computer-assisted web interviewing or CAWI). Gallup adopted a hybrid approach to data collection in 26 countries that are typically surveyed by telephone. The countries Gallup identified for this hybrid approach all have high levels of access to the internet among the adult population. For results based on the total sample of national adults, the margin of sampling error ranges from ±2.2 to ±5.5 percentage points at the 95% confidence level. The margin of error reflects the influence of data weighting. In addition to sampling error, question wording and practical difficulties in conducting surveys can introduce error or bias into the findings of public opinion polls. U.S. Methodology Results from the most recent survey, conducted in June 2024, are based on responses from 6,031 adults, aged 18 and older, living in all 50 U.S. states and the District of Columbia as part of the Gallup Panel. For results based on this sample of national adults, the margin of sampling error is about ±1.5 percentage points at the 95% confidence level. Most Gallup Panel monthly samples from February 2022 backward to August 2020 were between 2,500 and 4,000 respondents. Monthly samples from July 2020 backward to October 2019 were composed of 10,259; 10,779; 11,221; 16,584; 4,357; 9,155; 9,082; 20,006; 9,317; and 33,451 respondents, respectively. Results from July 31 to Sept. 3, 2020, are based on a survey conducted by mail and web as part of the Gallup National Health and Well-Being Index, with a random sample of 2,321 adults, living in all 50 U.S. states and the District of Columbia. Results from January 2018 through August 2019 are based on surveys conducted by mail and web as part of the Gallup National Health and Well-Being Index, with a random sample of 9,664 adults in 2019, living in all 50 U.S. states and the District of Columbia and another 115,929 in 2018. About 80% of all surveys completed in 2018 and 2019 were done so by mail. Prior years of measurement were based on telephone interviews conducted daily from Jan. 2 to Dec. 30 of each year with roughly equally sized samples each month. In 2017, 2016, 2015 and 2014, a total of 161,161; 177,192; 177,281; and 176,702 interviews were completed, respectively. Each daily sample of national adults for data collected between Jan. 2, 2014, and Aug. 31, 2015, comprised 50% cellphone respondents and 50% landline respondents. Each daily sample from Sept. 1, 2015, to Dec. 30, 2016, comprised 60% cellphone respondents and 40% landline respondents. Daily samples in 2017 consisted of 70% cellphone respondents and 30% landline respondents. Additional minimum quotas by time zone and within region are included in the sampling approach. Samples are weighted to correct for unequal selection probability, nonresponse, and double coverage of landline and cell users in the two sampling frames. They are also weighted to match the national demographics of gender, age, race, Hispanic ethnicity, education, region, population density and phone status (cellphone only/landline only/both and cellphone mostly). Demographic weighting targets are based on the March 2019 Current Population Survey figures for the aged 18 and older U.S. population. Population density targets are based on the 2010 census. All reported margins of sampling error include the computed design effects for weighting. The means of data collection (e.g., mail/web versus phone) can result in differing estimates for some metrics in randomized large population polling. Gallup has extensively studied these effects and has determined that Life Evaluation (% thriving) is comparable across modes, thus effectively preserving past trending without the need for an adjustment due to the change in mode. Comparisons of national weighted estimates from samples that fielded at similar time periods between Gallup’s National Panel of Households and the Gallup National Health and Well-Being Index demonstrated highly convergent results with statistically insignificant differences. Related Content Recent Content on Global Life Evaluations WorldSuffering Reaches Unprecedented Levels in AfghanistanWorldLife Ratings Crashed Amid Lebanon’s MeltdownWorldThe Wall Is Gone, but Germans Are Divided in Other Ways Recent Content on U.S. Life Evaluations WorkplaceU.S. Employee Life Evaluation Hits New Record LowWellbeingIn U.S., Poor Life Ratings Reach Record HighWellbeingIn U.S., Life Ratings Drop to 13-Month LowWellbeingLife Evaluation Slips More for U.S. Working Women Than Men Next Steps How Do People Around the Globe Evaluate Their Lives? Gallup has been measuring how people evaluate their lives in the U.S. and around the globe for more than a decade through the Life Evaluation Index. Learn more about how that measure is useful in understanding people's lives. Learn more about how Americans rate their lives. Learn More about Articles regarding Life Satisfaction Learn more about how people around the globe rate their lives. Learn More about Articles regarding the World Get Connected Submit a media inquiry to request a Gallup expert to answer questions about this topic. Subscribe to our global indicators list to be notified when we publish new indicator content and update data on existing pages.'''
