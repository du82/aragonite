title = "Our Approach to Public Sector Projects | Gallup"
description = "Learn how we align client objectives with rigorous methodologies that generate novel insights and metrics for measuring human development."
full_description = '''Our Approach Combining research with purpose so your organization can make a difference. About Our Methods of Public Sector Work At Gallup, we approach public sector projects just as we do our world-renowned social science research: with rigor, integrity and a strategic plan to measure what matters and use it to make a difference. Our Process 1 Determine research objectives. 2 Develop highest-quality research design and measurement tools. 3 Amplify the discoveries. What sets us apart is our ability to not only conduct the research but to help our partners communicate the insights and build thought leadership with credible data to support their missions. About Us Meet Our Team Meet the consulting leaders and research experts who bring human development project ideas to life. Joe Daly Senior Partner, Public Sector Andrew Rzepa Partner, EMEA Stephanie Marken Executive Director, Education Research Ilana Ron Levey Senior Director, Public Sector Consulting Jonathan Rothwell, Ph.D. Principal Economist Rajesh Srinivasan, Ph.D. Global Research Director, World Poll Jenny Marlar, Ph.D. Research Director, U.S. Survey Research Our mission Elevate the Voices of the World Since George Gallup founded our organization in 1935, integrity and independence have been at the core of how we do things. His legacy has made Gallup among the most trusted research organizations in the world. Throughout his life, Dr. Gallup remained committed to learning and reporting "the will of the people," and we continue to answer that call today. As Dr. Gallup once said, "There are 5 billion ways to live a life, and we should study them all." The possibilities only increase, but one constant remains: Gallup's commitment to measuring the key indicators of a life well-lived and helping leaders and decision-makers turn data into solutions for the most pressing problems in the human experience. Dr. Gallup built the foundation for our enduring legacy as one of the world's top data sources. Explore Our Unique Toolbox for Human Development Projects Our expertise in both research and communications ensures that every new insight we discover has an audience so you can do the work that matters most: Help people live better lives. <img alt="" class=" img-circle img-responsive" src="//imagekit.gallup.com/fusion/tr:f-webp/ANALYTICSV9CMS/qt1tthzjc0qrtqdqlij4zg.jpg" width="70" height="70"> Global Research Click Here <img alt="" class=" img-circle img-responsive" src="//imagekit.gallup.com/fusion/tr:f-webp/ANALYTICSV9CMS/la0hnw_xauk1fimdplyfoq.jpg" width="70" height="70">> U.S. Social Research Click Here <img alt="" class=" img-circle img-responsive" src="//imagekit.gallup.com/fusion/tr:f-webp/ANALYTICSV9CMS/nc4_ov7lu0yxr4bxzketfa.jpg" width="70" height="70">> Strategic Communications Click Here <img alt="" class=" img-circle img-responsive" src="//imagekit.gallup.com/fusion/tr:f-webp/ANALYTICSV9CMS/o8vaqpuwzuuyljzt2ofumg.jpg" width="70" height="70">> Success Stories Click Here Have questions? We have answers. Fill out the form below to learn more about our advice and analytics for the public sector. A Gallup expert may contact you. //<![CDATA[ var theForm = document.forms['aspnetForm']; if (!theForm) { theForm = document.aspnetForm; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> //<![CDATA[ function WebForm_OnSubmit() { if (typeof(ValidatorOnSubmit) == "function" && ValidatorOnSubmit() == false) return false; return true; } //]]> (*) Required * Full Name * Job Title Select One Executive Vice President Director Senior Manager Manager Staff President/Superintendent Senior Administrator Faculty/Staff/Educator Student Other * Email Address * Phone Number * Company * Postal Code * Country or Region Select One United States of America Afghanistan Aland Islands Albania Algeria American 