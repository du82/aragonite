description = "Gallup’s Emotional Wellbeing Indicator reveals the world’s daily experiences, both good and bad."
full_description = '''!(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Indicators Emotional Wellbeing Share on LinkedIn Share on Twitter Share on Facebook What We Measure The Positive and Negative Experience Indexes reflect people's daily experiences around the globe, offering leaders insights into the health of their societies that they cannot gain from economic measures alone. Emotional Wellbeing Negative Experience Index in 2023 31 2 Positive Experience Index in 2023 71 1 Why It Matters Related Content Next Steps For Media Why it matters Why Emotional Wellbeing Matters Emotions are powerful. Yet, traditional indicators aren't designed to measure how people feel. Gallup created the Positive and Negative Experience Indexes to capture a snapshot of people's daily experiences that provide insights into the health of their societies. While most leaders watch measures such as GDP and unemployment closely, few pay attention to how their people are feeling. Gallup has produced global statistics for wellbeing and happiness since 2006, and these metrics perfectly complement the objective indicators for human development. Wellbeing and happiness metrics help leaders and researchers better understand what makes a great life. The Positive and Negative Experience Indexes track the world's experiences with pain, worry, stress, anger, enjoyment, laughter and more. Global negative experiences ticked down for the first time since 2014 after being on the rise since then. Positive experiences continued to rebound in 2023 after dropping at the height of the COVID-19 pandemic. Read More about why emotional wellbeing matters Read Less about why emotional wellbeing matters How We Measure the Positive Experience Index The Positive Experience Index score is a mean of all valid affirmative responses to the items below multiplied by 100. Higher scores indicate that positive emotions are more pervasive in a country. These scores strongly relate to people's perceptions of their living standard, their personal freedoms and the presence of social networks. Well-Rested !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Respected !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Smiled or Laughed !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Learned or Did Something Interesting !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Experienced Enjoyment !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); How We Measure the Negative Experience Index The Negative Experience Index score is the mean of all valid affirmative responses to the items below multiplied by 100. The higher the score, the more pervasive negative emotions are in a country. People's experiences with health problems and their ability to afford food are predictive of higher negative scores. Pain !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Worry !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Sadness !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Stress !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Anger !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods Gallup’s Positive and Negative Experience Indexes The results are based on nationally representative, probability-based samples among the adult population, aged 15 and older, in each country. In most years, except for 2020 and 2021, the Positive Experience Index and Negative Experience Index are calculated from surveys in more than 140 countries and areas. In 2020 and 2021, scores are based on surveys in 116 and 122 countries, respectively. Results are based on telephone or face-to-face surveys of approximately 1,000 or more respondents in each country. Gallup typically conducts more than 3,000 interviews in China and India and 2,000 in the Russian Federation. For results based on the total sample of national adults in 2021, the margin of sampling error ranges between ±2.0 and ±5.5 percentage points at the 95% confidence level. The margin of error reflects the influence of data weighting. In addition to sampling error, question wording and practical difficulties in conducting surveys can introduce error or bias into the findings of public opinion polls. Related Content Explore related content on global wellbeing. WorldOver 1 in 5 People Worldwide Feel Lonely a LotWorldNegative Emotions Take a Positive TurnWorkplaceCan Great Management Improve Mental Health?WorldGlobal Rise in Unhappiness Stalls Next Steps What Is the State of Emotions by Country? View More on Global Emotions Check out the Gallup Global Emotions report to get the latest insights and see country-level data on emotions. View Report about Gallup Global Emotions View More Country-Level Data Explore our Global Emotions interactive to see the latest data on emotions from each country. Explore Page about Gallup Global Emotions report Get Connected Submit a media inquiry to request a Gallup expert to answer questions about this topic. Subscribe to our global indicators list to be notified when we publish new indicator content and update data on existing pages.'''
