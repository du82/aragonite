full_description = '''!(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Indicators Employee Retention & Attraction Share on LinkedIn Share on Twitter Share on Facebook What We Measure We measure employee retention and attraction trends, as well as employee perceptions of their current job climate, to help organizations more effectively retain and attract top talent. Intent to Leave To what extent are you currently looking for a different job than the one you have now? Watching For or Actively Seeking New Job 51% -- Why It Matters Related Content Next Steps For Media Why it matters Why Do Employee Retention Metrics and Attraction Research Matter? Delving into employees’ openness to new job opportunities reveals their intent to leave (or stay at) their current organization. As leaders seek to retain and attract talent, understanding more about employee perceptions of the job climate and why they choose to leave or join an organization is critical. Employers can evaluate how these details relate to their own culture to create strategies for curtailing turnover, attracting top talent and keeping their star employees from being wooed away. State of the Global Job Climate Would you say now is a good time or a bad time to find a quality job? See what employees everywhere say in the charts below. U.S. placeholder Regional placeholder Global placeholder !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t =