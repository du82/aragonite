["https://www.gallup.com/cliftonstrengths/en/253676/how-cliftonstrengths-works.aspx"]
title = "How the CliftonStrengths Assessment Works | EN - Gallup"
description = "Learn how the assessment formerly called the Clifton StrengthsFinder works, and see samples of the reports you get when you take the CliftonStrengths test."
full_description = '''Learn How the CliftonStrengths Assessment Works Completing the online talent assessment (StrengthsFinder®) is your way to: discover what you naturally do best learn how to develop your greatest talents into strengths use your personalized results and reports to maximize your potential Play iconWatch VideoBuy Assessment Close banner Leading With Strengths Watch interviews with leaders from around the world as they reveal the hidden layers of their own unique strengths and how they’ve used them to be successful. View Leaders Use the CliftonStrengths Assessment to Discover & Develop Your Greatest Talents It only takes a series of insightful questions to uncover the one true you. But it takes commitment to become the best you. Complete the CliftonStrengths assessment to unlock the personalized reports and resources you need to maximize your potential. Step 1: Take the CliftonStrengths Assessment During this 30-minute assessment, you'll see paired statements and choose which one best describes you. The assessment measures your unique talents -- your natural patterns of thinking, feeling and behaving -- and categorizes them into the 34 CliftonStrengths themes. image of a CliftonStrengths Assessment question and the options of answers with a cursor moving to show how to choose answer Step 2: Get Your Personalized CliftonStrengths Results Finishing the assessment is just the start of fulfilling your purpose. Your customized CliftonStrengths reports and guides help you chart your course to accomplish great things using the true north of what you naturally do best. View Sample of CliftonStrengths Top 5 Sample Report These Statements Describe Who You Are Precisely "How did they know that? That's exactly … me!" One look at your first personalized strengths insights, and you'll ask yourself the same thing. Developed over decades spent studying millions of CliftonStrengths assessment results, these statements explain exactly how each of your Signature Themes makes you stand out in the world. The pinpoint accuracy will leave you inspired and empowered with a newfound self-awareness. View Sample of a CliftonStrengths 34 Report Your Complete Profile Makes You Different "What makes me uniquely powerful?" This is the most in-depth CliftonStrengths report Gallup has ever released. Your CliftonStrengths 34 Report shows you how to: make the most of your strongest CliftonStrengths understand your full CliftonStrengths profile manage potential weaknesses Purchase CliftonStrengths 34 -- or upgrade your existing CliftonStrengths account -- to receive this unprecedented report that unlocks who you are and how you can maximize your infinite potential. View All Report Options These Role-Specific Reports Will Help You Succeed Check out our role-specific reports for: Students Managers Leaders Sales These reports include role-specific content based on your dominant CliftonStrengths themes. Learn more about how you can use your strengths in your role to succeed. Step 3: Use Your CliftonStrengths to Succeed Now it's time to aim your CliftonStrengths at anything that comes your way. Use your customized dashboard on the Gallup Access platform to find resources and tools that will help you learn how to do more of what you naturally do best. Find a Gallup-Certified Strengths Coach to help unlock your potential and succeed in every facet of life. Shop at store.gallup.com for essential strengths-based development products. Sign up to receive the best strengths-based development insights delivered directly to your inbox. Shop the CliftonStrengths Assessment Whether you're trying to discover your own strengths, empower your team to develop theirs, or create a strengths-based culture throughout your organization, we can help. Shop ReportsShop Reports Compare CliftonStrengths Report Options Shop Report OptionsShop Report Options Close Video: Unlock Your Potential: Introduction to the CliftonStrengths Assessment'''
