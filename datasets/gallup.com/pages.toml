title = "Media Center - Gallup"
description = "Browse our media kit and other resources for journalists, and learn more about how we can help you tell your story."
full_description = "Gallup Media Center We want to help you tell your story. Browse our press kit and other media resources to find what you’re looking for, or submit a media inquiry and someone will follow up on your request. Company Overview Company Overview Gallup, Inc. is a private, employee-owned analytics and advisory company based in Washington, D.C. Founded by George Gallup as the American Institute of Public Opinion in 1935, the organization evolved to include management and workplace consulting while maintaining its position as the preeminent public opinion research firm in the world. Learn More About Gallup Media Inquiries Media Inquiries We're here to help you tell your story. Gallup experts can provide expertise and data on a variety of U.S. and global topics. Request a Gallup Expert to Help Experts Experts Gallup experts can provide a wide range of expertise on topics that affect leaders, employers and people around the world. Browse Full List of Experts Featured Reports & Perspectives Featured Reports & Perspectives Our global research and workplace science teams regularly publish reports and perspective papers. See below for our featured reports, or browse our full list. State of the Global Workplace Global Emotions Global Law and Order Rating World Leaders Reporter Resources Newsletter Reporter Resources Newsletter Get data, discoveries and detailed analyses on the most pressing U.S. and global issues, designed for media like you. Subscribe to Reporter Resources Browse Other Newsletters Featured Press Releases Featured Press Releases Explore the Press Releases page for key findings from Gallup's latest major research outputs. Browse Full List of Press Releases Our Social Media Accounts Follow Gallup on Social Media You can find our latest articles, reports and insights posted regularly to the following social media accounts: Gallup Linked In Facebook YouTube Twitter Instagram Gallup Workplace Gallup Workplace Linked In Gallup Workplace Facebook Gallup Workplace Twitter CliftonStrengths® CliftonStrengths Linked In CliftonStrengths Facebook CliftonStrengths YouTube CliftonStrengths Twitter CliftonStrengths Instagram Our Methodologies Gallup Methodologies We use scientifically proven methodologies for our research and polling in more than 160 countries and territories worldwide. We want to make it easy to accurately represent this research in your reporting. Visit our Methodology Center for details about how to report on our data. Visit Methodology Center"
