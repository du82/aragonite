title = "Gallup-Lumina State of Higher Education"
description = "Exploring perceptions around postsecondary education."
full_description = '''Research Hub Lumina Foundation Gallup and Lumina Foundation are committed to studying the most pressing issues facing higher education. Download the Latest Report , Gallup-Lumina Foundation-State of Higher Education 2024 ReportDownload The Latest Press Release about the Lumina Foundation Press Release Thank you for downloading the Lumina Foundation State of Higher Education 2024 report. Download Report Download Press Release about the Lumina Foundation Press Release Featured Report Survey Methods In the Media Articles Additional Reports Featured Report Survey Methods In the Media Articles Additional Reports Featured Report State of Higher Education 2024 Report Despite a steady decline in college enrollment over the last decade, adults' interest in pursuing some form of higher education is at the highest level that Lumina Foundation and Gallup have recorded. At the same time, 94% of adults say at least one kind of postsecondary credential -- such as an associate degree, bachelor's degree, certificate or industry certification -- is very valuable. But while interest is high, significant barriers to enrollment and completion remain, with cost leading the way as it has in previous years. Download Gallup and Lumina Foundation's State of Higher Education 2024 report to learn more about U.S. adults' interest in pursuing higher education, what's keeping them from enrolling and what's causing currently enrolled students to consider stopping out. Download State of Higher Education 2024 Report Featured Report State of Higher Education 2024 Report Despite a steady decline in college enrollment over the last decade, adults' interest in pursuing some form of higher education is at the highest level that Lumina Foundation and Gallup have recorded. At the same time, 94% of adults say at least one kind of postsecondary credential -- such as an associate degree, bachelor's degree, certificate or industry certification -- is very valuable. But while interest is high, significant barriers to enrollment and completion remain, with cost leading the way as it has in previous years. Download Gallup and Lumina Foundation's State of Higher Education 2024 report to learn more about U.S. adults' interest in pursuing higher education, what's keeping them from enrolling and what's causing currently enrolled students to consider stopping out. Download State of Higher Education 2024 Report . Survey Methods Results for the Lumina-Gallup Study are based on web surveys conducted from Oct. 9-Nov. 16, 2023, with samples of 6,015 students who are currently enrolled in a postsecondary education program (certificate, associate or bachelor’s degree), 5,012 adults who were previously enrolled in a postsecondary education program but had not completed an associate or bachelor’s degree, and 3,005 adults who had never enrolled in a postsecondary education program. All respondents were between the ages of 18 and 59 and had a high school diploma or equivalent but not an associate or bachelor’s degree. Of the currently enrolled students, 2,532 say they are pursuing a bachelor’s degree, 1,468 are pursuing an associate degree, 1,373 are pursuing a certificate and 642 are pursuing an industry certification. Respondents were interviewed via Dynata’s non-probability web-based panel. The data are weighted to match national demographics of gender, age, race, Hispanic ethnicity, education and region for the population of U.S. adults ages 18 to 59 with a high school diploma but without a college degree. Demographic weighting targets are based on the most recent American Community Survey figures. 64% of currently enrolled students who recently considered stopping out of their program say emotional stress or mental health concerns are significant reasons why. 51% of currently unenrolled adults say they are likely to enroll in higher education in the next five years. 10 Men are 10 percentage points more likely to feel like they belong at their institution than women. Lumina Foundation in the Media CBS News Confused about the cost of going to college? Join the club. CNN Student debt is haunting Americans from graduation to retirement The New York Times Who Would Want to Go to a College Like This? CBS News New Survey Sheds Light on College Students' Mental Health Concerns Inside Higher Ed Survey Details Obstacles to Black Student Attainment The Chronicle of Higher Education For Black Students, 2 Obstacles to Graduation Loom Large: Discrimination and Responsibilities Articles Additional Work Insights View More EducationOne in Four Applicants Had Difficulty Submitting FAFSAEducationAmericans More Confident in Two-Year SchoolsEducationU.S. Confidence in Higher Education Now Closely DividedEducationCost Leading Reason College Students Are Stopping Out Additional Reports Download Past Gallup-Lumina Foundation Reports 2024 Cost of College: The Price Tag of Higher Education and Its Effect on Enrollment Download Now 2024 Policies and Laws: How They're Impacting College Enrollment Download Now 2023 Education for What?Download Now 2023 The State of Higher Education 2023 Report Download Now 2023 Stressed Out and Stopping Out: The Mental Health Crisis in Higher Education Download Now 2023 Balancing Act: The Tradeoffs and Challenges Facing Black Students in Higher Education Download Now 2022 The State of Higher Education 2022 Report Download Now 2020 State of the Student Experience: Fall 2020 Report Download Now 2019 Some College and No Degree Download Now 2015 Americans Value Postsecondary Education Download Now 2014 Great Jobs Great Lives: The 2014 Gallup-Purdue Index Report Download Now 2014 What America Needs to Know About Higher Education Redesign Download Now Show More of Additional Reports Download Featured Report Fill out the form below to get instant access to the Lumina Foundation State of Higher Education report and learn what students and unenrolled adults are seeking when making their enrollment decisions. //<![CDATA[ var theF