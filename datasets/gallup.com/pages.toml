title = "Explore Social Research and More in Gallup Analytics | Gallup"
description = "What is public opinion about your research topic now? How has it changed through the decades? Find out in Gallup’s unique data access platform."
full_description = '''Gallup Analytics: What Will You Discover? Explore leading economic indicators and social and wellbeing data collected since 2005 in more than 160 countries and areas. Contact Usto learn more about Gallup Analytics Gallup Analytics What's Inside Who's It For? Related Services Contact Us What Is Gallup Analytics? A One-of-a-Kind Data Access Portal Gallup Analytics is a subscription-based platform that houses more than a decade of international public opinion data from more than 160 countries and areas and nearly a century of U.S. national data. Powered by the Gallup World Poll and other public opinion and survey research, Gallup Analytics provides subscribers with unprecedented access to internationally comparable, broad coverage, in-depth research, with trend lines on important measurements of human development. Find out if you have access through your college or university What's Inside Opportunities for New Research Do you already know the type of data that your research is missing? Or are you trying to find your starting place? Avoid walking a worn path -- find a new angle in Gallup Analytics. Because Gallup Analytics data are not widely accessed, they are rich in potential discoveries -- especially at the national and individual levels. With different tiers of access, including to our microdata, you can find the subscription option that gets you the data you need. Learn more about how to subscribe to Gallup Analytics Who's It For? Researchers, Academics and Students Interested in the Human Side of Data Supplement your research objectives or find a jumping-off point with Gallup Analytics' wealth of primary data on people's firsthand life experiences and opinions. Whatever your focus, the nuanced, quantitative data on how people are living their lives can be a guide for research inquiry and an influential force with larger implications on social research, public policy and society. Research topics include: Migration Health Wellbeing Happiness and life evalution U.S. indicator data View All Gallup World Poll Topics Have a question you want to ask the world? Learn how you can add questions to the Gallup World Poll or another Gallup survey. Related Services Gallup's Unique Toolbox for Understanding Human Development No one reaches as many people or asks as many questions as we do. Learn more about how we measure the thoughts, feelings and behaviors of the world's 7.8 billion people. Global Research U.S. Social Research Measuring Human Development Global Datasets for Public Use Make your discovery. Fill out the form below to learn more about Gallup Analytics or schedule a demo. A Gallup expert may contact you. //<![CDATA[ var theForm = document.forms['aspnetForm']; if (!theForm) { theForm = document.aspnetForm; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> //<![CDATA[ function WebForm_OnSubmit() { if (typeof(ValidatorOnSubmit) == "function" && ValidatorOnSubmit() == false) return false; return true; } //]]> (*) Required * Full Name * Job Title Select One Executive Vice President Director Senior Manager Manager Staff President/Superintendent Senior Administrator Faculty/Staff/Educator Student Other * Email Address * Phone Number * Company * Postal Code * Country or Region Select One United States of America Afghanistan Aland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia (Plurinational State of) Bonaire, Sint Eustatius and Saba Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory (the) Brunei Darussalam Bulgaria Burkina Faso Burundi Cambodia Cameroon Canada Cape Verde Cayman Islands (the) Central African Republic 