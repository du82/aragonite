title = "Global Indicator: Economic Performance & Financial Security - Gallup"
description = "Gallup’s Economic Performance and Financial Security Indicator tracks U.S. opinion on the economy, global bank account ownership and more."
full_description = '''!(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Indicators Economic Performance and Financial Security Share on LinkedIn Share on Twitter Share on Facebook What We Measure The Economic Confidence Index summarizes Americans’ view of the economy based on their rating of current economic conditions and outlook for its performance. Gallup has measured economic confidence routinely since 1996 and has tracked other U.S. economic concerns for 20+ years, including the job market, stock ownership and retirement income. Globally, Gallup and the World Bank have tracked financial inclusion since 2011. U.S. Economic Confidence Index Current Conditions -27 2 Economic Outlook -47 5 Why It Matters Related Content Next Steps For Media Why it matters Why Economic Performance and Financial Security Matter Gallup's diverse economic ratings metrics provide a robust evaluation of Americans' mindset about the economy and their personal finances that can have implications for consumer spending, the labor market and political behavior. The monthly Economic Confidence Index is strongly correlated with The Conference Board's Consumer Confidence Index and the University of Michigan Consumer Sentiment Index. The Global Financial Inclusion Index (Global Findex) tracks how the world saves, borrows, pays and manages risk by tracking bank account ownership worldwide. The data are used to track progress toward the U.N. sustainable development goal (Indicator 8.10.2), the World Bank's goal of Universal Financial Access and the G-20 Digital Financial Inclusion Indicators. Read More about Economic Performance and Financial Security ratings Read Less about Economic Performance and Financial Security ratings Global Economic Measures Gallup is the World Bank's research partner behind the data in the Global Findex database. Every three years, we conduct nationally representative surveys with adults aged 15 and older in more than 140 economies, tracking a host of indicators on how people use bank accounts, save money, access credit and manage financial risk. View all of the data here. U.S. Economic Measures U.S. Economic Confidence Index Measured periodically from 1996 to 2000 and at least monthly thereafter, the index captures the nation’s economic mood on a scale from -100 to +100, where the midpoint of zero represents an equal balance of negative and positive views. The index is composed of two dimensions -- current conditions and economic outlook -- with each also having a potential range of -100 to +100. !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); U.S. Job Market !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); U.S. Stock Ownership !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Americans' Financial Situation !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Americans’ Financial Worry Index !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Americans' Retirement Income !(function () { "use strict"; if (!window.datawrappermessage) { window.datawrappermessage = true; window.addEventListener("message", function (e) { if (void 0 !== e.data["datawrapper-height"]) { var t = document.querySelectorAll("iframe"); for (var a in e.data["datawrapper-height"]) for (var r = 0; r < t.length; r++) { if (t[r].contentWindow === e.source) { t[r].style.height = e.data["datawrapper-height"][a] + "px"; window.dispatchEvent(new Event('resize')); } } } }); } })(); Survey Methods The U.S. Economic Confidence Index and U.S. Job Market data are based on annual averages of all measurements from nationally representative telephone polls conducted each year. Annual sample sizes vary depending on the number of measurements. Other economic indicators are based on nationally representative telephone polls of roughly 1,000 adults, aged 18 and older, conducted each April. All surveys are weighted to ensure the sample demographics conform with the most recent U.S. Census targets. Related Content Recent Content on Economic Performance and Financial Security WorldGlobal Generosity: World Felt Less Charitable in 2024EconomyEconomic Confidence Index Steady at -19 in FebruaryEconomyAmericans Offer Upbeat Outlook for Key Economic FactorsWorldAustralians' Housing Crisis: Dreams Turn Into Nightmares Next Steps How Gallup Tracks Economic Performance and Financial Security Gallup partners with organizations worldwide to provide official statistics on some of the most pressing problems facing humankind. Explore some of our partnerships aimed at measuring and understanding nuances in economic performance and financial security around the globe. Global Findex Gallup and the World Bank partnered to measure how the world saves, borrows, pays and manages risk. View More about Articles regarding Global Findex U.S. Job Quality Gallup, Lumina Foundation, the Bill & Melinda Gates Foundation and Omidyar Network partnered to uncover perceptions about jobs in the U.S. View More about Articles regarding U.S. Job Quality Get Connected Submit a media inquiry to request a Gallup expert to answer questions about this topic. Subscribe to our global indicators list to be notified when we publish new indicator content and update data on existing pages.'''
