title = "About | Game Developer"
description = "What is GameDeveloper.com? Learn more about Game Developer's editorial policy, blogging guidelines, and more."
full_description = '''TechTarget and Informa Tech’s Digital Business Combine.TechTarget and InformaTechTarget and Informa Tech’s Digital Business Combine.Together, we power an unparalleled network of 220+ online properties covering 10,000+ granular topics, serving an audience of 50+ million professionals with original, objective content from trusted sources. We help you gain critical insights and make more informed decisions across your business priorities.Game Market ResearchGDC VaultGDCAdvertise With Game DeveloperStay UpdatedStay UpdatedTrendingRelated TopicsGenerative AIHorror Game DesignGame Industry LayoffsInvestments & AcquisitionsUnionizationTop StoriesNewsDeep DivesMobileGame DesignProgrammingMoreRelated TopicsInterviewsQ&AsDeep DivesPostmortemsCultureUnionizationBusinessMarketingDesignProgrammingProductionArtAudioPCSteam DeckConsoleMobileExtended RealityRecent in MoreRead More: BusinessLogo for the Epic Games Store.BusinessEpic Games Store reached 295 million PC players in 2024Epic Games Store reached 295 million PC players in 2024byJustin CarterFeb 14, 20252 Min ReadBox art for Final Fantasy Crystal Chronicles.BusinessFinal Fantasy Crystal Chronicles delisted on iOS after 'unfixable' bugFinal Fantasy Crystal Chronicles delisted on iOS after 'unfixable' bugbyJustin CarterFeb 14, 20251 Min ReadDeveloper BlogsRelated TopicsBrowse Latest BlogsSubmit Your Blog PostFrequently Asked QuestionsBlogging Rules and GuidelinesRead Featured BlogsSponsored ByAbout Game DeveloperAbout Game DeveloperGame Developer, part of Informa TechTarget, was first founded in 1997 as Gamasutra and has strived since its inception to be a leading resource and reference for game development and industry knowledge. Following the shift from Gamasutra to Game Developer in August 2021, the site has maintained that mission while embracing the in-depth content its namesake Game Developer magazine is known for.To accomplish this, Game Developer publishes multiple stories on a daily basis to inform, empower, and inspire its game developer readership. This includes news posts on current events and developments in the game industry alongside regular, in-depth features and interviews exploring many different aspects of game development and the diverse individuals that make up the industry.While Game Developer's editorial teams work directly with game developers to provide the many articles found in the Features and Developer Insights sections, the site also hosts a robust community of game makers through its blogging platform. This section offers developers an additional avenue to share their own experiences, thoughts, and advice with Game Developer's readership and the wider game development community.Editorial TeamPublisherAlissa McAloonEditor-in-ChiefDanielle RiendeauSenior EditorBryant FrancisNews EditorChris KerrCommunity Editorial CoordinatorHolly GreenContributing EditorJustin CarterEditorial PolicyGame Developer strives to maintain the highest-possible ethical standards in its staff writing—just as it does in all business activities. Whatever platform we use—print, online, mobile, social media, video—we strive to deliver the complete, unvarnished truth as best we understand it at the time of writing. We compete ferociously with our rivals, but we are open and fair. If journalists use material published by competitors, they attribute it.Game Developer staff writers should pay their own way to events—including travel, accommodation, and sustenance. This is the best way to preserve our neutrality. Where it is unavoidable to accept a source's hospitality (on an organized press trip, for example), this is stated in writing at the bottom of the article in question - it should be made clear at the outset that the covering of any expenses will not influence our coverage. Game Developer staff writers sometimes receive free games or other minor promotional items. We will note these instances in content where this is relevant information to the reader, in order to avoid perceived conflict of interest. Game Developer writers will strive to avoid covering individuals or projects to which they are personally contributing funding via platforms like Patreon. However, if a scenario arises where such a situation is unavoidable, the relationship will be clearly stated in the story.All sponsored content on Game Developer shall be clearly labeled as such. Advertisers are given no control over editorial content or planning. Writers do not publish stories with the intent of pleasing advertisers.As a company within Informa TechTarget, we are sibling organizations of various businesses, including Game Developers Conference and its associated events. When material is presented on Game Developer discussing these events, it will be labeled with clear wording such as "EVENT NAME and Game Developer are sibling organizations under Informa Tech Target."User-Generated ContentGame Developer staff writers aren't the only ones who put content on our sites, of course. We invite the community we serve to contribute, and our readers (game developers) contribute the new content on Game Developer in any given day. The content provided by our community has 'blogs' clearly mentioned in the URL and a disclaimer at the top of each story.When readers blog on the site, they have to adhere to our guidelines for blogs:Blogging GuidelinesGame Developer Blogs are intended solely for articles about game development by and for game developers. That means everyone from members of triple-A studios to indie developers, garage creators, and students—as long as all your posts are about the art and business of making games.Feel free to repost content from your own personal blog, and note that Game Developer makes no claim to ownership of user-submitted materials. We just want to highlight great writing about game-making. That said, you may not post material you did not write, or that you do not have full permission to reprint. Also, please no teaser-link posts -- reprint your blog post in its entirety. Feel free to link back to your site, however.While the Game Developer staff will be monitoring content posted to the blogs, please refrain from posting inappropriate content that will later be removed. Use your best judgment, and please steer clear of pornographic images or excessive profanity; the line should be pretty clear in most cases! In addition, we would ask that your blog does not wholly advertise products or services at the exclusivity of anything else. Our goal is absolutely not to modify or censor material, but illegal or highly objectionable content will be necessarily excised.Feel free to format your posts, but don't make them too visually outrageous—too many colors and font sizes will just make things harder to read!All blog accounts must be individual accounts. We do not allow company accounts. Further, each blog post must be posted by its author, under his or her name. In cases where multiple authors contribute to one post, one should post and credit the others within the post's body.More from GDBlog with Game DeveloperBlogging GuidelinesGame Developer PodcastSubmit a TipConnectAbout UsAdvertise With Game DeveloperContact UsJoin UsStay UpdatedFollow UsCopyright © 2025. This website is owned and operated by Informa TechTarget, part of a global network that informs, influences and connects the world’s technology buyers and sellers. All copyright resides with them. Informa PLC’s registered office is 5 Howick Place, London SW1P 1WG. Registered in England and Wales. TechTarget, Inc.’s registered office is 275 Grove St. Newton, MA 02466.Home|Cookie Policy|Privacy|Terms of Use'''
