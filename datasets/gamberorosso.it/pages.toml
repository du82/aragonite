["https://www.gamberorosso.it/docente/iacopo-guiducci"]
title = "Iacopo Guiducci - Gambero Rosso"
description = "Sous Chef Gambero Rosso Academy Iacopo Guiducci, classe ‘93, nato e cresciuto nella sua amata Roma. Durante gli studi universitari inizia a lavorare nella ristorazione per poter inseguire il suo sogno, la cucina. Una volta messi da parte i risparmi necessari, lascia l’università per frequentare il corso professionale da chef del Gambero Rosso. Sotto la […]"
full_description = "Iacopo Guiducci, classe ‘93, nato e cresciuto nella sua amata Roma. Durante gli studi universitari inizia a lavorare nella ristorazione per poter inseguire il suo sogno, la cucina. Una volta messi da parte i risparmi necessari, lascia l’università per frequentare il corso professionale da chef del Gambero Rosso. Sotto la guida di Igles Corselli e Cosimo Branca termina il percorso tra i migliori, con forti competenze su macchinari per l’alta cucina. Si trasferisce per diventare capo partita alle Calandre e al Gran Caffè Quadri di Venezia, dove accresce ancora di più la sua esperienza. Con l’arrivo del Covid è costretto a tornare a Roma, ma non passa molto che decide ben presto di tornare in cucina ed è così che torna nelle cucine dove tutto è iniziato. Qui trasmette la sua passione e le sue competenze nei corsi professionali, ed è sous chef per gli eventi del Gambero Rosso."
year_published = 2025
