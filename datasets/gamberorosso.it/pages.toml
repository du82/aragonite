title = "Cookie policy - Gambero Rosso"
full_description = "I Cookie sono pacchetti di informazioni (stringhe di testo di piccole dimensioni) inviate da un web server (ad es. il Sito) al browser Internet dell’utente, da quest’ultimo memorizzati automaticamente sul computer e rinviati automaticamente al server ad ogni successivo accesso al sito. I cookie consentono al Sito di riconoscere il dispositivo dell'utente e consentono di navigare fra le pagine, ricordando le preferenze espresse e migliorando la user experience degli utenti. Possono inoltre fare in modo che le pubblicità visualizzate online siano più adeguate e pertinenti agli interessi e abitudini di consumo degli utenti. Questo sito web può utilizzare, anche in combinazione tra di loro, i seguenti tipi di cookie classificati in base alle indicazioni del Garante Privacy e dei Pareri emessi in ambito Europeo dal Gruppo di Lavoro ex art. 29 del GDPR, e nel rispetto delle Linee Guida pubblicate dall’Autorità Garante il 10 Giugno 2021: Gambero Rosso installerà sul suo dispositivo e, in particolare, sul suo browser o lascerà installare a terzi alcuni cookie che sono necessari per acquisire o far acquisire a nostri partner informazioni statistiche in forma totalmente anonima e aggregata, e quindi non riconducibili ad alcuna persona fisica specifica, relative alla navigazione dell’utente sulle pagine del sito, al fine di migliorarne usabilità e funzionalità. Premesso che il Titolare del trattamento dei dati indicati in calce alla presente informativa estesa ha individuato nella società Audioboost S.r.l. il soggetto imprenditoriale al quale affidare l’attività di raccolta pubblicitaria in modalità Programmatic, qualora Lei presti il relativo consenso attraverso una delle modalità semplificate descritte nell’informativa presentata al momento del suo primo accesso sul sito di Gambero Rosso: “Accetto” o “Gestisci Opzioni”, o cliccando su “Maggiori informazioni” (funzione che permette di accedere alla gestione dei singoli cookie da parte di Audioboost S.r.l. e alla illustrazione, tra gli altri, degli scopi di raccolta dei dati, delle modalità di trattamento, dei loro tempi di conservazione), potrà installare e/o lasciar installare alle società terze qui di seguito indicate, ulteriori cookie, c.d. di profilazione, per i quali può scegliere di modificare o revocare in tutto o in parte il consenso prestato agendo sul bottone “modifica impostazioni cookie” nel footer del sito."
