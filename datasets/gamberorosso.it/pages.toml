["https://www.gamberorosso.it/docente/igles-carelli"]
title = "Igles Corelli - Gambero Rosso"
description = 'Il telecronista della cucina. Volto storico del  canale 412 di Sky con il suo programma "Il gusto di Igles", dal 2018 Igles è il nuovo Coordinatore del Comitato Scientifico di Gambero Rosso Academy. La cucina di Igles è sempre stata caratterizzata dalla ricerca dei migliori prodotti italiani, dal 2010 inizia a descrivere la propria cucina […]'
full_description = 'Volto storico del canale 412 di Sky con il suo programma "Il gusto di Igles", dal 2018 Igles è il nuovo Coordinatore del Comitato Scientifico di Gambero Rosso Academy. La cucina di Igles è sempre stata caratterizzata dalla ricerca dei migliori prodotti italiani, dal 2010 inizia a descrivere la propria cucina come una Cucina Garibaldina, una cucina che appunto unisce l’intera Italia. Igles arriva alla ribalta nazionale e internazionale tra gli anni ottanta e novanta, come chef dell’ormai mitico ristorante Il Trigabolo di Argenta, in provincia di Ferrara. Poi La Locanda della Tamerice, immersa nelle valli di Ostellato e ancora chef del ristorante Atman, in provincia di Pistoia'
