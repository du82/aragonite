title = "Dario Palminteri - Gambero Rosso"
description = "Migliore del suo corso nella seconda edizione del corso Professione Chef della Gambero Rosso Academy di Roma, per 15 anni ha girato l’Europa, sperimentando le diverse espressioni territoriali del fine dining. Il mal di Sicilia, però, alla fine, si è fatto sentire, così ha deciso di ritornare a Palermo dove, dal 2015, è docente resident […]"
full_description = 'Migliore del suo corso nella seconda edizione del corso Professione Chef della Gambero Rosso Academy di Roma, per 15 anni ha girato l’Europa, sperimentando le diverse espressioni territoriali del fine dining. Il mal di Sicilia, però, alla fine, si è fatto sentire, così ha deciso di ritornare a Palermo dove, dal 2015, è docente resident dei corsi professionali per cuoco presso la Gambero Rosso Academy di Palermo. Appassionato di panificazione, ha da sempre inserito una trattazione ampia dei processi dell’arte bianca nei suoi corsi di cucina, poiché "lavorare con il lievito significa toccare materia vivente, mutevole, ci insegna a rispettare i processi naturali e a prendercene cura, ci costringe ad adattarci e a imparare come gestire contemporaneamente ciò che possiamo controllare e ciò che, in qualche modo, impone a noi delle regole”.'
year_published = 2025
