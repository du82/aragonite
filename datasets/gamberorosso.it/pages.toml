["https://www.gamberorosso.it/docente/antonio-putignano"]
title = "Antonio Putignano - Gambero Rosso"
description = "Ho indossato con orgoglio la Giacca Bianca” alla tenera età di 13’ anni, per la mia prima stagione estiva e da allora di tempo ne è passato, quasi 30’anni per l’esattezza. Ad oggi posso affermare di essere un professionista nell’ambito della ristorazione, con una forte influenza Gourmet sia per quanto riguarda l’accostamento di materie prime […]"
full_description = "Ho indossato con orgoglio la Giacca Bianca” alla tenera età di 13’ anni, per la mia prima stagione estiva e da allora di tempo ne è passato, quasi 30’anni per l’esattezza. Ad oggi posso affermare di essere un professionista nell’ambito della ristorazione, con una forte influenza Gourmet sia per quanto riguarda l’accostamento di materie prime ricercate che per la presentazione visiva e sensoriale del piatto. La fantasia e la conoscenza dell’ampio panorama gastronomico mi permette la stesura di menù nel pieno rispetto delle tradizioni e delle stagionalità, tenendo come punto fermo l’impiego di nuove tecnologie e nuovi metodi di cottura e conservazione degli alimenti. La carriera conseguita come executive chef all’interno di varie strutture, affiancata dalla docenza, mi hanno permesso di scoprire innumerevoli modi ed occasioni attraverso le quali riuscire a trasmettere la passione per questo lavoro. Tutto ciò mi ha consentito di cesellare e rendere efficaci ed efficienti i miei interventi nelle strutture ristorative che si avvalgono della mia attività di consulenza. Nella continua ricerca della completezza, ho deciso di intraprendere un percorso universitario nella facoltà di economia, per completare la mia figura con conoscenze accademiche volte a tutelare e gestire, con particolare attenzione all’indirizzo dell’attività svolta, i vari profili economici e sociali."
year_published = 2025
year_updated = 2022
