["https://www.gamberorosso.it/docente/cristina-basso"]
title = "Cristina Basso - Gambero Rosso"
description = "Cristina Basso, nata a Napoli il 23 marzo 1959, proviene da una famiglia con una lunga tradizione nel settore della panificazione. Questa eredità ha coltivato in lei una passione profonda per l’arte dei lievitati, che l’ha portata a specializzarsi in un ambito più complesso: la produzione senza glutine e le intolleranze alimentari. Cristina ha sviluppato […]"
full_description = "Cristina Basso, nata a Napoli il 23 marzo 1959, proviene da una famiglia con una lunga tradizione nel settore della panificazione. Questa eredità ha coltivato in lei una passione profonda per l’arte dei lievitati, che l’ha portata a specializzarsi in un ambito più complesso: la produzione senza glutine e le intolleranze alimentari. Cristina ha sviluppato una vasta competenza nella creazione di mix di farine naturalmente prive di glutine, utilizzando ingredienti integrali e naturali. Il suo obiettivo è offrire prodotti che mantengano la qualità e i sapori autentici, senza rinunciare alla genuinità."
