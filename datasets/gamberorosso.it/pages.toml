["https://www.gamberorosso.it/campioni-della-tradizione-guida-lombardia-gambero-rosso"]
title = "I Campioni della Tradizione - Guida Lombardia del Gambero Rosso - Gambero Rosso"
full_description = "Cinque piatti simbolo della tradizione milanese e lombarda e i loro migliori interpreti sono i protagonisti di un tour di cene in cinque tappe. I locali coinvolti sono quelli premiati come I Campioni della Tradizione sulla guida Lombardia - Il meglio di Milano e delle altre province 2025 del Gambero Rosso. Il riconoscimento viene assegnato ai ristoranti e trattorie che propongono le versioni più ortodosse e convincenti di ricette tipiche. Si passa così dai mondeghili dell’Osteria del Treno al risotto alla Vecchia Lodi dell’Antica Osteria del Cerreto, dal luccio alla gardesana dell'Osteria Gattolardo all'ossobuco della Pesa 1902 e alla cotoletta alla milanese della Trattoria del Nuovo Macello."
