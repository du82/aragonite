["https://www.gamberorosso.it/docente/pierangelo-chifari"]
title = "Pierangelo Chifari - Gambero Rosso"
description = "Pizza-chef classe 86, nasce e cresce in Sicilia in una famiglia in cui l’amore e il rispetto per il cibo sono stati alla base della sua educazione. Fin da bambino trascorre molto tempo in cucina con sua madre ed é proprio lì che coltiva l’amore per i lievitati. Nel 2015 nasce dalla mente pionieristica e […]"
full_description = "Pizza-chef classe 86, nasce e cresce in Sicilia in una famiglia in cui l’amore e il rispetto per il cibo sono stati alla base della sua educazione. Fin da bambino trascorre molto tempo in cucina con sua madre ed é proprio lì che coltiva l’amore per i lievitati. Dopo un intenso periodo di sperimentazioni e studio, arriva l’incontro con l’università della pizza che segna un momento importante nella sua carriera, suggellando così le sue competenze. La preparazione della pizza è un gesto culturale, alla base di ogni sua creazione c’è il rispetto e la valorizzazione delle materie prime che portano a svolgere un attento lavoro di ricerca delle migliori specialità d’Italia così da consentire combinazioni inedite e spesso audaci. Impasti contemporanei, storia, tradizione ma soprattutto tanta curiosità, elementi questi, che hanno permesso di realizzare all’interno del laboratorio della sua gelateria artigianale, da sei anni, panettoni e colombe di altissima qualità."
