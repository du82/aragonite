["https://www.gamberorosso.it/chi-siamo"]
title = "Gambero Rosso - Chi siamo"
description = "Gambero Rosso è la piattaforma leader multicanale per contenuti, formazione, promozione e consulenza nel settore Wine Travel Food. Scopri di più su noi!"
full_description = "Gambero Rosso è la piattaforma leader per contenuti, formazione, promozione e consulenza nel settore del Wine Travel Food italiani. Offre una completa gamma di servizi integrati per il settore agricolo, agroalimentare, della ristorazione e dell’hospitality italiana che costituiscono il comparto di maggior successo con un contributo rilevante per la crescita costante dell’economia. Gambero Rosso, unico nel suo format di operatore multimediale e multicanale del settore, possiede un’offerta di periodici, libri, guide, broadcasting (SKY e DDT) e piattaforma OTT con la quale raggiunge appassionati, professionisti, canali commerciali distributivi in Italia e nel mondo. Gambero Rosso Academy è la più ampia piattaforma formativa professionale, che ad oggi comprende 3 strutture operative in Italia (Città del gusto Roma, Lecce e Palermo) e joint ventures con le principali Università italiane e Academy nei più importanti paesi esteri. Gambero Rosso offre al sistema produttivo italiano un programma esclusivo di eventi di promozione B2B per favorirne il costante sviluppo internazionale. Gambero Rosso oganizza Eventi internazionali come il Tre Bicchieri World Tour, il più prestigioso ciclo di eventi dedicato all’eccellenza del vino italiano nel mondo, il Top Italian Wines Roadshow o Vini d’Italia Tour. Gambero Rosso è anche una community di appassionati e operatori del settore in continua crescita sui social:"
