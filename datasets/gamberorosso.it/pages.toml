["https://www.gamberorosso.it/academy/academy-presentazione"]
title = "Academy: chi siamo - Gambero Rosso"
full_description = '''Le Gambero Rosso Academy è il punto di riferimento del mondo dell’enogastronomia con un'offerta di formazione multidisciplinare, corsi amatoriali, professionali e sul management del settore enogastronomico. Gambero Rosso Academy è l’area di formazione multidisciplinare di Gambero Rosso che dal 2002 sviluppa, organizza ed eroga Corsi professionali per aspiranti chef, pasticceri, pizzaioli, panettieri e operatori di sala oltre a Corsi di alta formazione in collaborazione con le più prestigiose Università d’Italia fra cui Luiss, Iulm, Suor Orsola Benincasa e Università Mercatorum, ateneo telematico delle camere di commercio. Un hub in continua espansione con sede centrale a Roma - e sedi collegate a Torino, Lecce, Napoli e Palermo - dove professionisti e appassionati hanno la possibilità di sviluppare e fortificare le proprie skills grazie alla collaborazione di esperti Gambero Rosso e docenti di fama nazionale e internazionale. Nel 2021 Gambero Rosso Academy, in collaborazione con Università Mercatorum, ha avviato il primo progetto di digital education grazie alla nascita di "Gambero Rosso University", la prima università online - accreditata al MIUR - rivolta al settore enogastronomico. Una piattaforma digitale creata per erogare percorsi formativi in modalità e-learning rivolta ad aziende, professionisti, e appassionati del settore che intendono migliorare le proprie competenze avvalendosi delle migliori tecnologie della formazione a distanza e di consulenze personalizzate.'''
