["https://www.gamberorosso.it/docente/marco-brioschi"]
title = "Marco Brioschi - Gambero Rosso"
description = '''Resident Chef Gambero Rosso Academy dal 2023 Nato a Varese il 18 Settembre 1984, si avvicina al mondo della cucina professionale in "tarda età", prima il liceo scientifico, poi il corso in scienze e tecnologie chimiche all'Università Bicocca di Milano. Ma la passione per la cucina ha il sopravvento e nel 2011, quando, lascia tutto […]'''
full_description = '''Nato a Varese il 18 Settembre 1984, si avvicina al mondo della cucina professionale in "tarda età", prima il liceo scientifico, poi il corso in scienze e tecnologie chimiche all'Università Bicocca di Milano. Ma la passione per la cucina ha il sopravvento e nel 2011, quando, lascia tutto e frequenta il corso di Alta Formazione Professionale per Chef, dove si forma a livello professionale. Superati gli esami finali, inizia subito a lavorare nel ristorante stellato "La Rei", del Boscareto Resort & Spa, a Serralunga d'Alba, sotto lo Chef Giampiero Vivalda. Inizia a girare l'Italia, Liguria, Piemonte, Toscana, Lombardia, Lazio, dagli stellati e i gourmet, alla ristorazione dei grandi numeri, fino ad approdare a Roma all'OFFClub. Anni in partita dei primi, grande amante di risotti e paste fresche, continua a seguire corsi di formazione e perfezionamento, dalla cucina classica alle tecniche più moderne come la cottura a bassa temperatura.'''
year_published = 2025
year_updated = 2024
