title = "Enzo Piedimonte - Gambero Rosso"
description = '''Residente a Messina, nel Villaggio Marmora, Piedimonte ha iniziato la sua carriera nel mondo della pizza all’età di soli 11anni. Grazie alla sua passione e alla sua dedizione, ha maturato una vasta esperienza nel settore gastronomico, ricoprendo ruoli importanti come quello di consulente per impasti e docente presso l'accademia "Pizzaioli Italiani". Dal 2021 è responsabile […]'''
full_description = '''Residente a Messina, nel Villaggio Marmora, Piedimonte ha iniziato la sua carriera nel mondo della pizza all’età di soli 11anni. Grazie alla sua passione e alla sua dedizione, ha maturato una vasta esperienza nel settore gastronomico, ricoprendo ruoli importanti come quello di consulente per impasti e docente presso l'accademia "Pizzaioli Italiani". Dal 2021 è responsabile dell' Area Food di Casa Sanremo , incarico confermato fino al 2025. Ha ricoperto lo stesso ruolo per eventi di rilievo come il “Festival del Cinema Italiano 2024” e il “Concerto del 1° maggio”. Tra i numerosi riconoscimenti ricevuti, Enzo Piedimonte ha ottenuto nel 2022 l'assegnazione dei “2 spicchi”, dalla Guida "Pizzerie d'Italia" del Gambero Rosso riconfermato anche nel 2023 e 2024. Nel 2020, Enzo ha aperto il ristorante-pizzeria-gelateria #PIEDIMONTE 1.0 a Rodia, in provincia di Messina.'''
