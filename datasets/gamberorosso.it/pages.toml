["https://www.gamberorosso.it/docente/rita-monastero"]
title = "Rita Monastero - Gambero Rosso"
description = "Rita Monastero, Food Stylist e Chef, insegna cucina in Italia e nel mondo e si occupa di consulenze, catering, eventi aziendali. Autrice di 13 libri di cucina, due dei quali sono stati pubblicati anche in Turchia e Bulgaria. E’ docente di cucina, pasticceria e terminologia inglese settoriale nell’ambito di corsi a breve/medio/lungo termine e cura […]"
full_description = "Rita Monastero, Food Stylist e Chef, insegna cucina in Italia e nel mondo e si occupa di consulenze, catering, eventi aziendali. E’ docente di cucina, pasticceria e terminologia inglese settoriale nell’ambito di corsi a breve/medio/lungo termine e cura la formazione in ambito sia amatoriale che professionale. Collabora con molti Istituti Italiani di Cultura e Ambasciate italiane, con progetti mirati alla diffusione della cultura gastronomica italiana in tutto il mondo, nello specifico con Masterclass e conferenze in lingua inglese. E’ stata vicedirettore editoriale di una rivista di cucina, è presente con articoli e interviste su diverse testate nazionali e cura settimanalmente dirette radiofoniche con varie emittenti. Partecipa regolarmente a note trasmissioni televisive di Rai1 e Rai3, fra cui Uno Mattina, Tutto chiaro, Geo, Mi manda Rai3. Collabora inoltre con l’emittente vaticana TV2000, sui canali radio e tv. Per Rai la Chef presta anche opera di Consulente esperta in Food Styling. Rita è testimonial dell’Associazione Ascoltami, che sostiene le famiglie di persone affette da disturbi dello spettro autistico."
