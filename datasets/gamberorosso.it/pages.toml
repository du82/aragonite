["https://www.gamberorosso.it/abbonamenti/page/2"]
title = "Informativa - Gambero Rosso"
description = "Informativa per trattamento di dati ai sensi e per gli effetti di cui all'articolo 13, D.Lgs 30/06/2003 n.196 Gentile Utente, ai sensi dell'articolo 13 del Codice in materia di protezione dei dati personali (D.Lgs 196/03). Le forniamo, qui di seguito, l'informativa riguardante il trattamento dei Suoi dati personali che sarà osservata da Gambero Rosso S.p.A. […]"
full_description = '''#speakup-player{margin: 0 !important; max-width: none !important; min-height: 85px !important; padding-bottom: 25px !important; padding-top: 10px !important;}#speakup-player:empty::after{align-items: center; background-color: #fff; border-radius: 0.5rem; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12); font-family: sans-serif; content: 'Loading...'; display: flex !important; font-size: 13px; font-weight: bold; line-height: 1; justify-content: center; min-height: 50px; text-transform: uppercase;}#speakup-player:empty{display: block;} Informativa per trattamento di dati ai sensi e per gli effetti di cui all'articolo 13, D.Lgs 30/06/2003 n.196 Gentile Utente, ai sensi dell'articolo 13 del Codice in materia di protezione dei dati personali (D.Lgs 196/03). Le forniamo, qui di seguito, l'informativa riguardante il trattamento dei Suoi dati personali che sarà osservata da Gambero Rosso S.p.A. in qualità di Titolare del Trattamento. I dati personali, da Lei forniti in fase di adesione ai servizi o raccolti successivamente durante l'utilizzo dei servizi stessi saranno trattati dal Titolare del Trattamento per le seguenti finalità: 1. a) Erogazione dei servizi richiesti e gestione di eventuali reclami e/o contenziosi; b) Partecipazione a Forum tematici e alle attività della Community; 2. a) Iniziative promozionali su prodotti e/o servizi di http://www.gamberorosso.it/, dei siti collegati e/o di suoi partner commerciali; b) Invio, anche tramite posta elettronica e/o canali telefonici, di materiale pubblicitario, informativo e informazioni commerciali prodotti e/o servizi di http://www.gamberorosso.it/ dei siti collegati, e/o di suoi partner commerciali, comunicazioni a carattere politico; c) Attività di vendite e di collocamento dirette ed indirette mediante differenti canali di vendita; d) Comunicazioni commerciali interattive; e) Rilevazioni del grado di soddisfazione della clientela sulla qualità dei servizi forniti (anche attraverso soggetti terzi); f) Iniziative promozionali su prodotti e/o servizi di società terze; g) Studi e ricerche statistiche e di mercato. h) Informazione a carattere politico/sociale da parte di enti, associazioni e partiti politici Il conferimento dei Suoi dati è obbligatorio per il conseguimento di entrambe finalità di cui sopra; il loro mancato, parziale o inesatto conferimento potrebbe avere come conseguenza l'impossibilità di fornirLe i servizi richiesti. I trattamenti, di cui ai precedenti punti, potranno essere eseguiti con modalità informatiche o manuali con procedure tali da garantirne la conformità alle disposizioni normative vigenti in materia. Nel caso di trattamento con strumenti informatici, ed in particolare con l'utilizzo della posta elettronica, il titolare al fine di monitorare la corretta ricezione e lettura da parte degli interessati della comunicazione inviata, inserirà nelle stesse comunicazioni alcuni tag che permettano la verifica della ricezione, lettura del messaggio e verifica degli eventuali link selezionati dall'interessato. I Suoi dati personali saranno trattati dai dipendenti che operano sotto la diretta autorità del rispettivo "Responsabile del trattamento" e che sono stati incaricati del trattamento ed hanno ricevuto, al riguardo, adeguate istruzioni operative. Oltre che dai dipendenti alcuni trattamenti dei Suoi dati personali potranno essere effettuati anche da soggetti terzi, con sede in Italia e/o all'estero, ai quali il Titolare affida talune attività di natura tecnica o organizzativa o di gestione (o parte di esse) funzionali alla fornitura dei servizi citati al punto 1) o allo svolgimento delle attività indicate al punto 2). In tal caso gli stessi soggetti opereranno in qualità di Titolari autonomi o saranno designati come Responsabili o Incaricati del trattamento. I Responsabili o gli Incaricati eventualmente designati riceveranno adeguate istruzioni operative, con particolare riferimento all'adozione delle misureminime di sicurezza, al fine di poter garantire la riservatezza e la sicurezza dei dati. Il titolare del trattamento dei Suoi dati personali è: Gambero Rosso per Gambero Rosso S.p.A. In relazione al trattamento dei dati personali, Lei potrà direttamente, in ogni momento, esercitare i diritti di cui all'art. 7 del Codice in materia di protezione dei dati personali, che per comodità le riportiamo qui di seguito, scrivendo a: Gambero Rosso S.p.A., Via Ottavio Gasparri, 13/17 – 00152 Roma (RM) Si informa che, per ragioni tecniche, i tempi necessari per l'eventuale cancellazione dei Suoi dati personali dall'archivio saranno al massimo di 5 giorni lavorativi. Ai sensi dell'art. 7 del D.lgs n. 196/2003 (e successive modifiche), gli utenti cui si riferiscono i dati personali hanno il diritto in qualunque momento di ottenere la conferma dell'esistenza o meno dei medesimi dati e di conoscerne il contenuto e l'origine, anche per verificarne l'esattezza o chiederne l'integrazione o l'aggiornamento, oppure la rettificazione. Ai sensi del medesimo articolo gli utenti hanno inoltre il diritto di chiedere la cancellazione, la trasformazione in forma anonima o il blocco dei dati trattati in violazione di legge nonché di opporsi in ogni caso, per motivi legittimi, al loro trattamento.'''
author = "Gambero Rosso"
