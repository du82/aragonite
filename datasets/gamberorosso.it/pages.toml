["https://www.gamberorosso.it/calendario-eventi"]
title = "Calendario eventi - Gambero Rosso"
description = "12mar20:0023:00Evento Gambero RossoA cena con GiorgioneRomaRistorante Vertici - Cardo Roma, Viale del Pattinaggio, 100"
full_description = "12mar20:0023:00Evento Gambero RossoA cena con GiorgioneRomaRistorante Vertici - Cardo Roma, Viale del Pattinaggio, 100 Il 12 marzo 2025 è in programma una cena degustazione speciale presso il ristorante Vertici - Cardo Roma, durante la quale sarà possibile conoscere Il 12 marzo 2025 è in programma una cena degustazione speciale presso il ristorante Vertici - Cardo Roma, durante la quale sarà possibile conoscere il mitico Giorgione, l'oste più amato d'Italia, e assaggiare alcuni tra i suoi piatti più iconici abbinati ai vini più rappresentativi dell'azienda Spinelli. Ristorante Vertici. É il ristorante di punta dell'Hotel 4 Stelle Cardo Roma, il primo della costola del gruppo Autograph Collection di Marriott, aperto negli stessi spazi dello storico hotel Sheraton all'Eur, dopo la chiusura di quest'ultimo. Vincenzo Spinelli ha fondato l'azienda che porta il suo nome nel 1973; il marchio, tuttora, è tra quelli abruzzesi più conosciuti nel mondo. Attualmente è sul mercato interno che si concentrano gli sforzi delle nuove generazioni alla guida dell'azienda. Agli ettari vitati di proprietà si aggiungono quelli coltivati da fidatissimi conferitori, seguiti dal punto di vista agronomico in tutte le fasi del lavoro in vigna. Le Stagioni del Vino è il nome della linea su cui si concentrano molti degli sforzi dell'azienda con risultati eccellenti. N.B. Si prega di comunicare eventuali allergie o intolleranze entro e non oltre il 4 marzo. Oltre questa data non saranno garantite varianti ai piatti del menu. Antipasto Insalata di cavolo rosso Pappa al pomodoro in abbinamento: Le Stagioni del Vino Abruzzo Doc Pecorino Superiore 2023 *** Primo Gnocchi al Sagrantino in abbinamento: Zione Cerasuolo d'Abruzzo Doc 2023 *** Secondo Coppa di Maiale Patate alla tirolese in abbinamento: Le Stagioni del Vino Montepulciano d'Abruzzo Doc 2022 *** Dolce Torta della Monaca 04aprTutto il giorno06Evento Gambero RossoDegustazione Vini d’Italia – Vinitaly And The CityVeronaCortile del Tribunale - Verona"
