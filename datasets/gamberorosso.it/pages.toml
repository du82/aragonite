["https://www.gamberorosso.it/docente/roberto-tomei"]
title = "Roberto Tomei - Gambero Rosso"
description = "Inizio da giovanissimo la mia carriera seguendo le orme di famiglia e completo gli studi in economia & management aziendale applicata al food & beverage, settore con il quale ormai da più di trent’anni vivo in osmosi, dedicandomi dapprima alla gestione del comparto ristorazione dei più importanti circoli golfistici della Capitale e proseguendo poi come […]"
full_description = "Inizio da giovanissimo la mia carriera seguendo le orme di famiglia e completo gli studi in economia & management aziendale applicata al food & beverage, settore con il quale ormai da più di trent’anni vivo in osmosi, dedicandomi dapprima alla gestione del comparto ristorazione dei più importanti circoli golfistici della Capitale e proseguendo poi come consulente nel supportare progetti imprenditoriali che oggi sono realtà consolidate. Da diversi anni, con orgoglio ed entusiasmo, metto il mio know how a disposizione di giovani appassionati prestando docenze in Master di settore per Istituti d'eccellenza su territorio nazionale ed estero. Come imprenditore ho creduto fortemente in alcuni progetti come PummaRe, brand di pizzerie della Capitale; InsidEat, start up specializzata in food experience per turisti appassionati di Made in Italy; Squp, start up innovativa con cui ho realizzato un gustoso gelato in barattolo completamente naturale, gluten & lactos free e dal ridotto apporto calorico. “Da soli si va veloci, ma insieme si va più lontano”: è con questo spirito di valorizzazione del mio team e delle sue competenze che nel 2004 ho fondato Ginevra Consulting, società di consulenza che ad oggi rappresenta un vero e proprio generatore d’ impresa al servizio di aziende e start up con focus sui temi dell’ Agroalimentare, del Turismo e del Made in Italy. La mia mission è generare valore per le imprese, attraverso servizi davvero pensati per fare la differenza, come quello di strategy e ricerca & sviluppo, per inquadrare i bisogni del cliente e delineare le linee guida di progetto in base allo studio del mercato; digital marketing & comunicazione, per traghettare al meglio il messaggio del Brand dal suo universo valoriale alla user experience finale; food & wine menu engineering, per la creazione di menu e carte dei vini di alto profilo e vantaggiosi per il cliente e per l’azienda; HR resource, per il supporto nella selezione e nella formazione del team; Financial Advisory, per lo sviluppo di business plan che permettano di attrarre i giusti stakeholders anche grazie ad operazioni di Crowdfunding; Start up advisory, per supportare la nascita di nuove idee ed aiutare gli imprenditori a renderle realtà tangibili."
