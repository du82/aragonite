full_description = "SUPPORT THE VIDEO GAME HISTORY FOUNDATION Join Our Community A sustaining membership is the best way to support our work all year long. We’ve got the best community of game history fans in the entire world in our Patreon-only Discord, join today and make some new friends! Or join us for a monthly video call! Get Involved Gift Magazine Subscriptions Did you know we offer monthly subscriptions to vintage video game magazines? Surprise yourself or a friend with a monthly piece of history. We also have prepaid gift subscriptions available, so you can share with a friend! Give the gift of History Charitable Donation The Video Game History Foundation, Inc. is a non-profit corporation, and is exempt from taxation under Section 501(c)(3) of the U.S. tax code. The Video Game History Foundation’s Tax ID is 81-1737317. Contributions by U.S. taxpayers are deductible to the extent permitted by law. $ Donation Amount: $5.00$10.00$25.00$50.00$100.00Custom Select Payment Method PayPal Offline Donation Log In to Your Account (optional) Username or Email Address Password Reset Password Personal Info First Name * Last Name Is this donation on behalf of a company? No Yes Company Name Email Address * Comment Credit Card Info This is a secure SSL encrypted payment. Card Number * CVC * Cardholder Name * Expiration * Donation Total: $10.00 Even more ways to give Donate via PayPal PayPal supports one-time donations as well as monthly recurring donations. Donate via PayPal Donate by mail The Video Game History FoundationP.O. Box 22458Oakland, CA 94609 If there is some other way that you’d like to contribute, please reach out to us at info@gamehistory.org."
