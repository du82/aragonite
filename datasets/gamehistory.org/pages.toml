title = "The Long-Lost Tarzan Atari Game, Preserved | Video Game History Foundation"
description = "After 40 years, the Atari 2600 masterpiece Tarzan has been unearthed."
full_description = "The Long-Lost Tarzan Atari Game, Preserved The Lord of the Jungle emerges, unscathed, from the video game industry crash. Post author By Kevin Bunch Post date June 3, 2024 Tarzan battles Beastmen on a jungle temple to free his friends, in his unreleased Atari 2600 adventure. When you think about games written for the Atari Video Computer System (or 2600) today, what do you picture? Likely a home version of an arcade game, or some kind of shooter, a maze game, something that takes place entirely on a single screen. This is not the entirety of the 2600 library, though – major releases such as Pitfall!, Adventure, E.T: The Extra-Terrestrial, or Smurfs: Rescue in Gargamel’s Castle were built around worlds that extended beyond the screen’s borders, where you didn’t necessarily know what was coming next or how you’d need to approach that challenge. And among the most ambitious of these titles announced was Tarzan, to be published by Coleco for the 2600 and the ColecoVision console in 1984. Tarzan is announced for ColecoVision (and obliquely, the Atari 2600), as seen in the Video Game Update’s February 1983 edition. Tarzan was initially announced for as a 1983 ColecoVision release at the 1983 Winter Consumer Electronics Show, held in Las Vegas, with a 2600 port announced later that year during the summer CES for a November release. These dates slipped, with the ColecoVision Tarzan finally shipping in August, and the 2600 game announced as a second quarter release before being quietly canceled. The released ColecoVision version was fairly well-reviewed, with the newsletter Computer Entertainer praising the graphics and the varied action, noting strategy is required to clear the game. But the 2600 version faded into obscurity, considered just another project canceled due to the 1983 North American market collapse and its yearslong aftermath. In 2011 a manual for the game turned up, but the game itself remained lost. Lost, that is, until collector Rob “AtariSpot” managed to purchase a working copy of the game off of a former Coleco employee in 2022 and successfully worked with longtime Atari homebrew programmer Thomas Jentzsch to get it dumped. All 2600 games bigger than 4 kilobytes in size utilize an approach called “bankswitching” to get around hardware limitations by inserting code that gets the console to look at a separate 4-kilobyte chunk of data. This allowed for larger and more complex game programs, and Tarzan, a 16-kilobyte cartridge, is no exception. The game uses a unique bankswitching scheme, but Jentzsch was able to modify it into a standard “F6” bankswitch to make it operable on emulators and flash carts. Both versions are included with this article. “I remember when they first came to me with the concept (of bankswitching for Tarzan), I’m like, ‘it’s gonna do what?’ Because in order to switch the banks, your software had to be in a certain place. So it landed in the right place in the other bank … once we got the hang of figuring out how we were gonna do it, it wasn’t too complicated.” – Henry Will IV, interview with AtariSpot, July 8, 2023 The two Tarzan boards AtariSpot received. Both had identical game ROMs on them, though only one board worked. The Story of Tarzan Members of the James Wickstead Design Associates team, as seen in the special edition of Activisions included with Little Computer People, circa 1985. From left, Andrew Bergman, Roger Booth, James Wickstead, Robin McDaniel Ballweg, Henry Will IV, and Todd Marshall. Tarzan for the 2600 was not being produced in-house at Coleco, but rather from the New Jersey-based design studio James Wickstead Design Associates (JWDA). Founded in 1969, JWDA had spent the years prior to the video game boom designing toys for Parker Brothers, including electronic games like Bank Shot and Wildfire Pinball, particularly after Mattel Electronics’ handheld Football game became a huge success. James Wickstead remembered being told by an industry friend in California that they should look into developing video games, as there were no design studios on the East Coast despite the market being hot in the early 1980s. The company took its first steps into the 2600 library when then-JWDA designer Garry Kitchen reverse-engineered the console and produced Space Jockey, a straightforward shooting game that nonetheless provided enough information for JWDA to understand the hardware. JWDA predominantly produced its console releases through US Games, but as they had a preexisting relationship with Parker Brothers and Coleco, the company designed games for those publishers as well. “Many times, (these publishers) approached us. They had some games that already existed … they pushed us some of the games they wanted us to do for them, which we did. Basically, translating games from other systems or (the ColecoVision) into the Atari format.” – James Wickstead, interview with Kevin Bunch, Nov. 16, 2021 Wickstead said that at its height, JWDA had eight programmers, each assigned to a given project, along with a separate electrical engineering team to design any special tech needed for the cartridges. The company received a fee for each game developed on top of royalties, an arrangement Wickstead said worked out very well for JWDA and its employees even when the market ran into trouble overall. “We worked as a team, and if somebody had a problem or anything, we would bring the team together for some time to try analyze the problem to help that person get over their hurdle.” – James Wickstead, interview with Kevin Bunch, Nov. 16, 2021. Coleco’s game design team was overseen at that time by the late legendary game developer and designer Jennell Jaquays, who served as a design group manager. Coleco largely focused on home conversions of arcade games and utilizing existing licenses to help sell their products, Jaquays told David Craddock in 2017, because then the games had a leg up on selling themselves. “They figured they would jump into the market by licensing arcade consoles, because another thing Coleco did was they wanted someone else to pre-sell their work. They liked licensing, and they’d already found out from the tabletop electronics they’d sold that people knew what Pac-Man was, people knew what Donkey Kong was, people knew what Galaxian was. [Consumers] liked the game and wanted to play them at home. That is the experience that, as ColecoVision designers and artists, we were expected to reproduce, and to be honest, we did.” – Jennell Jaquays, interview with David Craddock, published Dec. 4, 2017 But sometimes designers had the opportunity to work on original game concepts, too, largely when the company licensed a non-game property. In a 2015 interview with David Wolinsky, Jaquays explained that the game was licensed as part of a marketing blitz for the movie Greystoke: The Legend of Tarzan, released in March 1984. The Atari 2600 version of Tarzan running in its default game variation. Tarzan as a game was designed by future Baldur’s Gate 3 principal narrative designer Lawrence Schick, then a project manager at Coleco, which Jaquays described in an interview with Retrovideogamer.co.uk as the modern equivalent of an associate producer. Jaquays and Schick had known each other from their shared time working on materials for Dungeons and Dragons. “I had grown up on Edgar Rice Burroughs’ stories and was eager to do the Tarzan game, especially because it was an original design rather than an arcade adaptation, and those were prized assignments. I think it’s my favorite of the games I designed or adapted for Coleco.” – Lawrence Schick, correspondence with Kevin Bunch, Feb. 18, 2024 Schick oversaw both the ColecoVision and 2600 versions of Tarzan the first few months of active development before his primary role was shifted over to Coleco’s ADAM computer, where he recalls continuing to oversee the Coleco version right up to its completion. Design documents suggest Schick continued providing some feedback, but for the most part another Coleco designer, Phil Taterczynski, a TSR veteran-turned Coleco designer like Schick, seems to have stepped in as the lead for design and feedback duties for the 2600 version of Tarzan. The singular mandate from the Edgar Rice Burroughs’ estate for the game was that however the game ended, and no matter what happens in the game, Tarzan himself could not die. This put a serious restriction on how Tarzan could be implemented, one cleverly circumvented by making it into a timer-based title. Schick said that typically, an original game would be designed around the ColecoVision hardware and its capabilities first before considering how to adapt it to other platforms. Since the ColecoVision was well suited for platforming games, he designed the game so that Tarzan runs, jumps, and fights through a series of obstacles from a side-view. This carried over to the 2600, which, while creaky by 1983 standards, could still handle such a game with experienced developers, as proven by Activision’s Pitfall! published in 1982. “We took our usual approach of designing the ColecoVision game first and then adapting it to additional consoles. The CV game was a run/jump/fight side view game – we knew we could do that, and that we could port that to other platforms. It was just a matter of pushing the gameplay a bit beyond what we’d done previously.” – Lawrence Schick, correspondence with Kevin Bunch, Feb. 18, 2024 The lead ColecoVision version was produced by a small studio in St. Paul, Minnesota called 4D Interactive Systems (which Schick had worked with while at TSR, as they contributed materials for Dungeons & Dragons), while JWDA, by this point very familiar with the hardware, developed the 2600 version. Tarzan dashes through a hunter encampment while dodging rifle fire. “This was our answer to Pitfall! by David Crane.” – Todd Marshall, sound designer on Tarzan, interview with Scott Stilphen, 2014 Putting together a game this ambitious on the 2600 hardware took multiple people. Leading on the programming was Henry Will IV, who previously had led on Word Zapper and Smurfs: Rescue in Gargamel’s Castle and contributed to multiple other games in the collaborative JWDA environment. Smurfs had been Will’s first experience with multi-screen game development, an experience he was able to bring to Tarzan’s development. In addition to Will, Sylvia Day and Roger Booth also worked as programmers on Tarzan, with Will in his notes crediting Day in particular for getting the vines working correctly and Booth for assisting on the game loops. “Looking back on it, it was kind of cool to do a Tarzan game. We all watched Tarzan when we were kids. So, I mean, it was cool being able to, just in general, get these licensed cartridges and stuff.” – Henry Will IV, interview with AtariSpot, July 8, 2023 Excerpt from Henry Will IV’s JWDA design notebook, dated Sept. 6-8, 1983. JWDA artist Robin McDaniel Ballweg helped design the game’s graphics, animation and color scheme, as she had in multiple other JWDA games. Tarzan himself is a large, multicolor character, smartly designed so his hair and loincloth do not overlap vertically with his flesh-toned body – a limitation of the 2600 hardware – and while poachers and apes are all large, single-colored sprites, they are nonetheless legible to be what they are. In the dumped build, the game effectively uses the 2600’s color palette to paint the jungle imagery, from the thick treeline to the dusky sky seen in the distance – whether or not she was responsible for these elements is unclear, but they create a lovely backdrop within the hardware’s limitations. Todd Marshall was tapped with developing the game’s audio. In his 2014 interview with Scott Stilphen of Ataricompendium.com, Marshall recalled doing a lot of “advanced sound” for Tarzan, and indeed the newly dumped build truly has a unique soundscape. The background drumbeat in particular sounds like nothing else on the 2600 platform and serves as a further testament to the skills of the JWDA staff. “Well, there were two major challenges (we faced when developing games). One was getting animation that was interesting, dynamic, and fun. Then secondly, getting it all to fit within the memory spaces that are allocated. There is the third, of course, which is not technical, and that’s schedule. Everybody wanted it done yesterday in time for, say, the Christmas marketplace.” – James Wickstead, interview with Kevin Bunch, Nov. 16, 2021 Marshall snagged Will’s development notebooks when JWDA closed up its video game business, which have since been made available online through the scanning efforts of Scott Stilphen. This document contains a great deal of details about Tarzan’s development, including that it initially got underway in October 1982 with Sylvia Day leading, though the idea for a Tarzan-based game was initially pitched in January. Work on this initial, 4-kilobyte version was halted December 2nd for about 8 months – according to Will, this was because Warner was producing Greystoke and they expected Atari, a subsidiary of Warner, would be getting the home game rights. During that break he was moved over to working on other projects, such as Smurfs, while Day and Booth were shuffled over to the similarly unreleased Pursuit of the Pink Panther. JWDA received the green light in August to return to Tarzan, now using an 8-kilobyte cartridge (later expanded again to 12 kilobytes in September, with the newly available game coming in at 16 kilobytes). Will no longer recalled where the unique bankswitching scheme used in the prototype came from, but considered it likely to have been developed by JWDA’s hardware engineers, the late Tom Heidt and Jerry Sullivan. Additionally, Marshall recalled in his interview with Stilphen that Tarzan was supposed to use a custom combined RAM/ROM chip (used in Pink Panther) that would include additional memory on the cartridge, but Will’s notebook doesn’t suggest that this was used in Tarzan, nor does the final prototype utilize it. Tarzan climbs a tree to reach a pair of cages, where his ape friends are being held prisoner. Taterczynski provided his feedback to JWDA several times over the course of its development in the fall through early 1984, remarking for an early build from September 1983 that he thought “Tarzan in general is great – better than Jungle Harry in Activision(‘s Pitfall!).” Based on Will’s notebook, the final version of the game appears to have gone to Coleco on or around April 30, 1984, following months of revisions and requests by the publisher and the Burroughs estate. These ranged from enlarging the game’s sprites to reducing Tarzan’s movement speed and capabilities to make the game more challenging, but Will recalled the working relationship with Coleco was quite positive. “I’m sure there were times when I had to push back (against Coleco’s notes), but usually, it’s because of a technical limitation or something. Or it might be gameplay feedback or whate"
