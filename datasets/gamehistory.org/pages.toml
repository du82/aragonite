title = "Introducing the VGHF Digital Library | Video Game History Foundation"
description = "A sneak preview of the future of video gaming's past."
full_description = "Introducing the VGHF Digital Library A sneak preview of the future of video gaming’s past. Post author By Phil Salvador Post date December 13, 2023 The following is part of our 25-day Holiday Countdown Calendar! Every day from December 1st through the 25th, we’re posting a cool game history treat, daily updates from the VGHF, giveaways, and more! To make sure you don’t miss a day, sign up for our email list: Join our mailing list: This is all part of our annual Winter Fundraiser donation drive, where we ask those who are able to generously give what they can so that we can continue thriving. If you’re able to make an additional one-time charitable contribution, this really is the best time to do so, as your donations will be DOUBLED thanks to a generous group of sponsors! Head on over to gamehistory.org/donate to learn more and give today. Today, we’re giving you a first look at our upcoming digital library platform! One of the most frequent questions we get is how you can access our collections of rare video game history research materials. Well, wonder no more! For the past two years, we’ve been building a digital platform where you can explore our archives, without having to visit in person. And we think it’s ready to show off. Today’s Sponsor Today’s sponsor is Organized Havoc! They help creatives of all types with project management and strategy…and that includes us! They’ve offered to DOUBLE every dollar put toward our goal this year, up to $1,000! As I write this we’re still pretty far from our goal, so if you’ve been waiting to give this year, this would be a really great time. Producing content like this takes a lot of effort, and if you’re able this year, we could really use your support. We’ve put together an 18-minute demo of what our work-in-progress digital library looks like. This is our first look at how you’ll access the resources in our collection—plus an advance preview of the Mark Flitman papers, one of the exciting collections we’ll be rolling out when the library soft-launches next year. Remember: This is a preview, and some things are a little unfinished! But if we’re all cool with that, we think it’s about time to show you what we’ve been up to. You can see tomorrow’s post right now! Members of our Patreon who support us at $5 a month or higher get access to our daily Holiday Countdown Calendar posts one day early! If you’re a patron, today you can check out an original internal pitch document for Persona 2: Eternal Punishment! UNLOCK NOW"
