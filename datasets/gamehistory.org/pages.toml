["https://gamehistory.org/super-sushi-pinball"]
title = "Super Sushi Pinball | Video Game History Foundation"
description = "Sony's second ever game in the U.S. was lost, until now."
full_description = "Super Sushi Pinball Sony’s second ever game in the U.S. was lost, until now. Post author By Frank Cifaldi Post date December 25, 2023 The following is part of our 25-day Holiday Countdown Calendar! Every day from December 1st through the 25th, we’re posting a cool game history treat, daily updates from the VGHF, giveaways, and more! To make sure you don’t miss a day, sign up for our email list: Join our mailing list: This is all part of our annual Winter Fundraiser donation drive, where we ask those who are able to generously give what they can so that we can continue thriving. If you’re able to make an additional one-time charitable contribution, this really is the best time to do so, as your donations will be DOUBLED thanks to a generous group of sponsors! Head on over to gamehistory.org/donate to learn more and give today. Today we’re proud to unveil some history on a thought-to-be-lost piece of Sony and Nintendo’s relationship – an unreleased game called Super Sushi Pinball. We’ll let the YouTube video embedded above speak for itself, but essentially, when Sony first opened a video game division in the United States, they’d planned on publishing three games, all of them from companies in Japan: Super Dodge Ball, Super Sushi Pinball, and Super Rescue. A rare Imagesoft brochure from the earliest days of Sony’s U.S. video game division. Of the three, only one came out, despite Super Sushi Pinball being marketed by the company for over a year! It was even advertised to consumers who purchased Super Dodge Ball. The poster included in the first printing of Super Dodge Ball showed two more titles “coming soon,” but neither would ever materialize! We were able to find and preserve what might be the only surviving copy of the game, and as the video above will demonstrate, it is a… unique experience. Thanks to owner Ed Semrad for letting us digitize his copy of the game, and to Hidden Palace for hosting it."
