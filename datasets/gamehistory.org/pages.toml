["https://gamehistory.org/ep-14-alex-smith-discusses-they-create-worlds"]
title = "Ep. 14: Alex Smith Discusses They Create Worlds | Video Game History Foundation"
description = "Alex Smith, author of They Create Worlds: The Story of the People and Companies That Shaped the Video Game Industry, Vol. 1: 1971-1982 and fellow podcaster, joins us to discuss the North American console crash of the early 80’s: its causes, its effects, and the lessons we’ve learned since then.  See more from Alex Smith:…"
full_description = "Ep. 14: Alex Smith Discusses They Create Worlds Post author By Robin Kunimune Post date January 13, 2021 Alex Smith, author of They Create Worlds: The Story of the People and Companies That Shaped the Video Game Industry, Vol. 1: 1971-1982 and fellow podcaster, joins us to discuss the North American console crash of the early 80’s: its causes, its effects, and the lessons we’ve learned since then. See more from Alex Smith: Book: They Create Worlds: The Story of the People and Companies That Shaped the Video Game Industry, Vol. I: 1971-1982 Podcast: http://podcast.theycreateworlds.com/ The Video Game History Hour music is Blippy Trance by Kevin MacLeod (incompetech.com) Licensed under Creative Commons: By Attribution 4.0 License: http://creativecommons.org/licenses/by/4.0/ Transcript Kelsey Lewin 00:00 Welcome to episode number 14 of the Video Game History Hour, presented by the Video Game History Foundation. Every episode we’ll be bringing in an expert guest, and this guy here is definitely an expert: someone who’s done their research and has an interesting story from video game history to tell. My name is Kelsey Lewin, I’m the co-director of the Video Game History Foundation. And I’m here as always with Frank Cifaldi, the founder and co-director of the Video Game History Foundation. Frank Cifaldi 00:24 Our guest today is Alex Smith, author of “They Create Worlds,” a series of frankly groundbreaking video game history books, at least I assume the other ones will be! So far Volume I is available, covering 1971 through 1982. It’s available through CRC Press. Can’t recommend it enough – we’ll talk about that later. Alex is also the co-host of a sister podcast, also called The Create Worlds, and he’s here today to talk with us about the video game industry crash of the early ’80s. Alex, welcome to the Video Game History Hour. Alex Smith 01:01 Thank you so much happy to be here! Frank Cifaldi 01:04 So the crash is a little more nuanced than I think a lot of people realize. There’s maybe one or two very large factors, but there’s almost, like, five things happening at once that just contribute to video games essentially going away as an American industry for a while. Let’s just dive right into it, Alex. What was the video game industry crash of the early ’80s? Alex Smith 01:33 Absolutely. So, first to put a couple of limiting factors on what this was: it was a North American crash of the industry in primarily the United States, but that also includes Canada. There were industry events going on in places like Japan and the United Kingdom, other parts of Europe that were not strictly affected by that. Also – and this is a part that a lot of people actually get confused on – it was a console industry crash, specifically. A lot of people tie what was going on in coin-operated amusements into what was going on in the home at this time, and there was certainly a symbiotic relationship there. But the arcade industry, the coin-op industry, actually went through its own period of difficulty right before the console industry did. So they kind of snowballed into each other but were kind of separate events. So to focus in on this North American console crash, basically it’s not an exaggeration to say that the entire thing got wiped out. You had an industry that had been growing like gangbusters for two or three years, starting in about 1980. You had Atari leading the way which, for a brief period of time, was the fastest growing company in history, essentially. It went from about a $400 million business to a $2 billion (with a “B”) business. You had the entire industry rising to a crescendo of about $3.2 billion in sales and then plummeting, within the space of about two years, to sales of about $100 to $200 million. So really a complete wipe out of an industry. Frank Cifaldi 03:28 So I think we should sort of set the stage for where the industry is at this point. I don’t know, when is the first sign of trouble? Maybe mid-’82, something like that? Alex Smith 03:39 Yeah. So in 1982, you had Atari kind of leading the way in this marketplace having about 70%, 75% of the industry. They had a they had a small-but-spirited competitor in Mattel. Hard to think of calling Mattel small but they only had about 15% of the market. So in video games terms they were small, but coming on strong. Frank Cifaldi 04:10 And then they also made Barbie or whatever. [laughter] Alex Smith 04:12 Well, yeah, I mean, they had some toy business, I guess? I don’t know. [Laughter] But in video games, they were small but definitely distinguished. And you had a bunch of third-party publishers coming in for the first time: companies that did not have their own video game systems but we’re publishing on other consoles, most notably Activision. And this had worked out very well in 1981. The industry was worth over $2 billion and basically companies could not keep up with demand. There was so much demand for video game product, all of the retailers, all of the distributors, the general public, just wanted more, more, more video games and couldn’t get enough, which caused this kind of snowball effect where the manufacturers started producing more and more product to fulfill all of these rapidly expanding orders from retailers. And then somewhere around the middle of 1982 everyone suddenly realized, essentially, that there was way too much product on the market and they couldn’t sell it all. And that’s when the trouble really began. Yeah, and it’s not just that the existing companies are increasing production, we also have an increase in companies producing games all of a sudden. And that’s when you start seeing, for example, a game literally about dog food on the Atari. Sure! You know, that one gets brought up a lot, Chase the Chuck Wagon. Now, in all fairness to the fine people at Purina, that was not something that you went into Toys”R”Us or you went into a Sears and you purchased off the shelf. It was a promotional thing. It was more akin to when Burger King did those games a few years back, Sneak King, that you could get. But it is very true that you had so many companies getting into this industry that didn’t understand what they were doing and only so much talent that could actually work with these systems. Because as I’m sure many of your listeners know, that VCS, or the 2600 as it was called by this time, was not something that was simple to get to do anything that you wanted it to do. Kelsey Lewin 06:38 We had a very good episode with Garry Kitchen explaining just how difficult it was to make anything of note on the 2600. Alex Smith 06:46 Exactly! Frank Cifaldi 06:47 Right, and not only that it was difficult, but it wasn’t like you purchased – like you would today – a development kit from Atari with documentation and stuff like that. Atari didn’t even want people making games for the system other than Atari. Alex Smith 07:02 Exactly, there were a few individuals that had reverse engineered it, and some of these people would offer their information for sale. There was one guy that was offering, I think, a dev manual for, like, $20,000 a pop. And that’s where a lot of these companies learned how to work this thing. But that dev material just basically told you what the calls were. “Do this to do this.” It didn’t tell you how to be good at making something happen. It didn’t tell you how to do slanted platforms and Donkey Kong, as Garry Kitchen was able to do Kelsey Lewin 07:36 Make Combat again. People want more combat, right? [laughter] Alex Smith 07:39 Right! It was a system that was made the play Pong and Tank, two early 1970s arcade games that had no more than four or five objects on the screen at a time, and now it’s been asked to do Space Invaders, Pac-Man and beyond. It’s a miracle that anyone was able to do anything with it. But truly, you had to have a certain level of talent to make it do anything at all. You had all of these companies popping up and there just wasn’t enough talent to go around. But that’s one of the factors that gets talked about a lot, that there were all of these bad games coming out. And don’t get me wrong, there were definitely bad games. But the fact is, every single game that was released could have been the most absolute brilliant game ever made and you would have still had literally 200% of market demand. There was only so much that people could afford to buy or that the people wanted to buy to play on these video game systems. Frank Cifaldi 08:43 Yeah, so what starts happening? So we’ve we’ve got, obviously, stores have… Well, we’ve got a lot of product being manufactured, but in addition, we have a lot of stores who are sort of over-ordering trying to meet this demand, right? Alex Smith 08:58 Absolutely. Because in 1981, nobody got what they wanted. In 1980, nobody got what they wanted. There was this trend with retailers and distributors of knowing that they were not going to get what they wanted. And so what distributors and retailers started doing is deliberately over-ordering. If they thought they could sell 200,000 units of something they would order 400,000 units because they knew that Atari, or Activision, or Mattel, or whoever they were ordering from, would only give them 200,000 units and then everything would work out. Kelsey Lewin 09:36 I was just going to say, for a modern perspective on this as someone who owns a game store, I’m having to do this with Pokemon cards right now. So I’m curious to see the inevitable Pokemon card crash again. Obviously, Pokemon cards haven’t been nearly this popular since the late ’90s, early 2000s, but I’m doing that exact Same thing that happened here in the game crash where it’s like, “Well, they can’t give me the Pokemon cards I want, so I’m going to get a second distributor and I’m going to try to order three times as much as I actually want.” Alex Smith 10:11 There you go. And when the Pokemon market collapses, remember, you heard it here first. [Laughter] It’s so true! This was a problem both at the retailer level. And you also mentioned, you know how you were getting a second distributor? Well, this was also going on in video games. When Atari was first setting up its distributor network, they set up a pretty orderly network. They gave everybody territories. They had manufacturers reps, those reps each had a set territory, and then they would sell to individuals within their territories. As supply became constrained as nobody could get what they wanted, these manufacturers reps started encroaching on each other’s territory. And so you would have multiple people selling into one territory. Then Atari confused the matter even more by allowing certain of their best customers to serve as their own regional distribution centers. So rather than strictly being manufacturers reps working on behalf of the company, they were their own independent agents that were still buying their product from Atari and then serving as a regional distributor of their own. So in some cases, Atari, his manufacturing reps were selling into an area AND these super-distributors were selling into the same area. So if you’re not getting enough product, what are you going to do? You’re going to order from both of them and hope that between them it comes through. So that’s the real mess. A lot of popular histories like to focus on how bad a lot of these games were. I think that excites us, from the point of view of being video game fans and being into the games and saying, “These games are great, these games are not so great.” And I’m sure consumer confidence was shaken a little bit by some of the substandard quality. But at the end of the day, it was a pipeline issue, as boring as that may sound. It was logistics. There was 200% of market demand out there and it was just unsustainable. Kelsey Lewin 12:24 And so when you have this many games, you have all of these retailers that have games that they can’t sell. Now, it becomes a problem for the companies who are making good games. I mean, even if we’re not looking at this from a good game/bad game standpoint, even the really good, the Activations and that sort of thing of the world, how are they supposed to compete when retailers already have five times as many games as they need to sell and they’re having to discount them? Alex Smith 12:54 Exactly, you just can’t do it. So what inevitably happened is that all of these games were discounted just to clear the inventory. So if you could go to the front of the store into these discount bins and buy one game for $5, or even by the end of it, five games for $5, you’re not going to go to the new game rack elsewhere in the store and pay $34-$39 for a new game because the economics are just not there. Because in this period of time, console games really were primarily for children. You were primarily looking at a demographic of somewhere between, say, 6 and 14. Older teenagers would tend to go to the arcade to play games instead and adults in general didn’t play at all. So the kids were not the ones buying. It was their parents buying for a birthday or for Christmas, especially since these were very expensive items. Especially when adjusted for inflation. So if dad or mom are going to the store and they’re looking at this, they’re like, “Well, Jimmy said he wanted this game, but this game is $40. These five games here look very similar and I can get these for, like, seven bucks all together. Then I look great because I got him a bunch of presents and it’s all the same, anyway. What are these video games I don’t even know?” So that’s what would happen. You just couldn’t reach the public to go find those those $35-$40 games that would allow the companies that make the games to continue to make the money they needed to make to keep operating. It was just a vicious cycle of discounting and losses. Frank Cifaldi 14:48 So this excess product is in stores essentially because there’s, in a lot of cases, no one to return them to, right? Alex Smith 14:57 Right. So in some cases Is the companies that made these games, especially the smaller companies, they wind up in trouble very quickly. So they really can’t offer any kind of refund and are starting to go out of business. But I mean, a company like Atari could have theoretically offered some kind of money-back situation and absorbed inventory. But I’ve talked to people at Atari and one of the things that I think gives me a different insight into what happened in this period is, I’ve talked to a lot of the executives that were there. Sales people, marketing people, even presidents and CEOs. And it feels like that’s a demographic that has been generally underrepresented really throughout video game history, but especially in these very early days. A lot of these people had never been interviewed before. And at Atari, there was a feeling – because Ray Kassar, the CEO of Atari at the time, he was a marketer. That was his background, he came out of the textile industry out of Burl"
