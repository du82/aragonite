full_description = "Ep. 118: Noclip Game History Archive Post author By Robin Kunimune Post date September 13, 2023 Documentarian Danny O’Dwyer of Noclip has been sifting through thousands of videotapes in a recent mass-acquisition of video game (and adjacent) recordings. In this episode: Burger King and Kellogg’s games, Danny can fix your VCR, conferences in 1080p, shop talk on uploading footage, BBC Domesday Project methodology, slow Sonic, is that Frank?, it’s lonely work, and (not) preserving live service games. Project: youtube.com/@NoclipArchive See more from Danny O’Dwyer: Twitter: @dannyodwyer YouTube: /noclipvideo Patreon: /noclip Video Game History Foundation: Podcast Twitter: @gamehistoryhour Email: podcast@gamehistory.org Twitter: @GameHistoryOrg Website: gamehistory.org Support us on Patreon: /gamehistoryorg"
