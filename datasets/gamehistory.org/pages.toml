description = "Game designer and creator of Karateka Jordan Mechner, joined by Chris Kohler of Digital Eclipse, shares a new interactive documentary The Making of Karateka exploring this 1984 karate classic title. In this episode: Jordan’s earliest work, perfect paper preservationist, Prince of Persia source code, hitting it rich in video games vs. going to class, celebrating…"
full_description = "Ep. 119: Karateka Post author By Robin Kunimune Post date September 29, 2023 Game designer and creator of Karateka Jordan Mechner, joined by Chris Kohler of Digital Eclipse, shares a new interactive documentary The Making of Karateka exploring this 1984 karate classic title. In this episode: Jordan’s earliest work, perfect paper preservationist, Prince of Persia source code, hitting it rich in video games vs. going to class, celebrating old games, an inspiration train, a father’s love of his son, the lost leopard: found, and bringing a game back to life See more from Jordan Mechner: Website: jordanmechner.com Facebook: /jmechner Twitter: @jmechner Instagram: @jmechner Mastodon: @jmechner YouTube: /JordanMechner See more from Chris Kohler: Twitter: @kobunheat Website: www.chriskohler.biz Amazon Author Page: https://www.amazon.com/Chris-Kohler/e/B001IOFJPI%3F Video Game History Foundation: Podcast Twitter: @gamehistoryhour Email: podcast@gamehistory.org Twitter: @GameHistoryOrg Website: gamehistory.org Support us on Patreon: /gamehistoryorg"
