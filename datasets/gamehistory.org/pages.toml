description = "In this field report from Mead, Washington, Cyan co-founder Rand Miller takes VGHF library director Phil Salvador on an exclusive tour of the “Cyan Vault.” Together, they uncover rare game artifacts, prototypes, and cool behind-the-scenes treasures while diving into Cyan’s rich history. Listen in to discover how thoughtful, meticulous preservation can not only tell a…"
full_description = "Episode 121: Exploring the Cyan Vault Post author By Robin Kunimune Post date December 25, 2024 In this field report from Mead, Washington, Cyan co-founder Rand Miller takes VGHF library director Phil Salvador on an exclusive tour of the “Cyan Vault.” Together, they uncover rare game artifacts, prototypes, and cool behind-the-scenes treasures while diving into Cyan’s rich history. Listen in to discover how thoughtful, meticulous preservation can not only tell a story but also breathe new life into a classic like Riven. See more from Rand Miller: Twitter/X: @randemtweets Website: cyan.com Video Game History Foundation: Podcast Twitter: @gamehistoryhour Email: podcast@gamehistory.org Twitter/X: @GameHistoryOrg Website: gamehistory.org Support us on Patreon: /gamehistoryorg Transcript Transcription provided by Jeremy Seith SUMMARY KEYWORDS cyan headquarters, Riven remake, video game history, Myst series, Cyan Vault, production materials, promotional items, game development, historical artifacts, design documents, fan memorabilia, game editions, laser disc, smoke effects, employee photos Phil Salvador 00:08 Welcome to the Video Game History Hour where we talk with people from and about video game history. I’m Phil Salvador, library director at the Video Game History Foundation and for this week’s episode, we decided to try something a little different. This is our first ever field episode. Instead of bringing someone onto the show to talk with us, we went out to visit them. We were out doing some video game history archeology this summer, and we wanted to bring you, the listener, along for the ride with us. Take a listen. Phil Salvador 00:40 We are out in Mead, Washington. It’s a little town in the eastern half of Washington State, about half an hour north of Spokane. And we’re at the headquarters of Cyan, developers of classic, influential adventure games, you know and love. The Myst series, Cosmic Osmo, the Manhole, Abduction, Bug Chucker. All the classics, all the classics here at Cyan. And joining us today is the co founder of Cyan, Rand Miller. Rand, thanks for inviting us up here. Rand Miller 01:07 Hey, we’re glad you could come. Nobody ever comes to Mead, Washington. So– Phil Salvador 01:12 It was a quick Uber ride away from the hotel we were at. So first off, before we get into the meat of this thing, I want to pass it over to you, because what’s going on at Cyan? We’re obviously here for a reason. It’s kind of a big week for y’all right now? Rand Miller 01:24 Yeah, you’ll hear the noises in the background. There’s a lot of people here. We’re releasing the rerelease of Riven, our new, reimagined, rebuilt, redone-from-scratch Riven is finally mostly done. For those of you who do software development, you’ll know exactly what I mean. Yeah, so, people are coming in to kind of celebrate, so it’s a big weekend. Phil Salvador 01:24 Yeah, and the reason we’re here specifically, I mean, obviously it would just be fun to come up to Cyan, but we, the Video Game History Foundation, kind of sort of worked on the Riven– we contributed to the Riven remake, I guess is something we would say, right? Rand Miller 01:59 Absolutely. Yeah. Phil Salvador 02:00 So just a little background for folks if you missed this announcement last year. We’ve been working with Cyan to help preserve some of the stuff in their archives of material. Specifically, we’ve been doing all the video tapes they have, so it’s all the raw filming footage of the game, interviews, all this incredible material Cyan has held on to. And we were doing this for historical reasons. We were doing in support of an upcoming documentary called The Myst Documentary, directed by Philip Shane. But it turns out, y’all had another use for some of this material as well. Rand Miller 02:28 It came in handy. Over the 25 or so years that we’ve been just kind of sitting there. Hannah Gamiel 02:34 I’ve been told to bring this to you. She says she couldn’t find the one you may have been referencing. Rand Miller 02:34 Yeah, she didn’t. Phil Salvador 02:41 That was Hannah Gamiel. What’s your title at Cyan now? Hannah Gamiel 02:44 So sorry. I’m the development director at Cyan. <laughter> Phil Salvador 02:49 Hannah was just walking in and handing something that looked like a puzzle box to Rand. Rand Miller 02:51 It’s actually a little piece of history itself. It’s, yeah, we can get into that. But it’s yeah, it’s cool little artifact for testing Riven that we used. Phil Salvador 03:00 Interesting. Rand Miller 03:01 I mean, honestly, it’s every little bit of– piece of something we can get to help with this development. So, you get the stuff you guys found in vaults was great, because we had lost so much stuff over the 25 years. We had to dig stuff in the vault. The vault was missing things and also in formats that we didn’t know. And so even textures or reference things for how big things were or small they were, it was just invaluable to see some of that stuff, even on videotape. So we could, you know, take that, the tape measure and go, How is that related to the– to that person, to that thing. Phil Salvador 03:40 It’s also pretty unique that you have, you’ve referred to the vault. There is a room at this building at Cyan’s headquarters called the Cyan vault, where you’ve kept a lot of this stuff, like production materials or props from live action filming and promotional items, all this. I know that we’ll see some of the stuff we get on it, and I won’t spoil any of it, but it’s kind of unique, because this building, I think, is one of the reasons we even have the space to do that. And this building’s got kind of a history behind it, right? Rand Miller 04:02 Yeah, yeah. This is the building that Myst built. We finished Myst, and in case you guys don’t know, it was rather popular, much to our surprise, and it created a lot of, I think, what is currently referred to as resources for us. And so we built a building that we could work in, and so most of Riven was actually done in this building and over the intervening years, it’s been kind of something that kept us alive as an indie company. We don’t have to pay rent in a big city. It’s just a building in Mead, Washington, and we get to kind of be here. So as we get bigger and smaller, we still have our place to work, and we have a vault. Phil Salvador 04:51 Amazing. Well, let’s go check it out. I was really excited, like, All right, let’s go check out the vault. But you’ve been there many times. It’s your closet. Rand Miller 04:58 Oh yeah. Yeah, yeah, yeah. Phil Salvador 04:59 But this is my first time going in the vault. Rand Miller 05:00 We’re not going to the lower D’ni floors. Phil Salvador 05:03 That’s right, that’s right. Rand Miller 05:04 No, this is just the upper vault. Phil Salvador 05:06 This is the public facing stuff. This is not– that’s not where you keep, like, the books are down there. Rand Miller 05:10 Exactly. There’s wink winks, a lot of winks and nods going on right now. All right, Phil Salvador 05:14 Alright, well I realize this is not a visual medium, so I’ll try to narrate as we go. But we are walking over to the Cyan vault now. We’re walking through their offices where I assume, well, there’s a lot of books here. I guess there’s not workstations here. Rand Miller 05:26 Don’t touch the linking panel on those books. <laughter> We have a big server room in here. That’s the old sound room. We did all the sounds for Riven in there. Tim Larkin. Phil Salvador 05:35 Amazing. Amazingly that server room, one of the videos we had from the vault is from the construction of the building. So we have, like, videos showing off the construction of the server room. Rand Miller 05:43 Yes! Right, right. Phil Salvador 05:44 If you’re curious about the server room, listeners, that will be something you can look into. Rand Miller 05:48 Alright, the vault is always locked. So I did manage to remember to get my keys. Phil Salvador 05:54 Thank you for the foley sound effect there. Phil Salvador 05:56 Yes, my grand master key will open the vault. Phil Salvador 06:02 And here we go. Here’s the vault. Rand Miller 06:03 It’s nice and quiet in here. Phil Salvador 06:05 Goodness gracious. So to describe this room, as you walk in, I’d say it’s, like, maybe, like, 15 by 15 feet is kind of the size of this thing. And there’s just boxes as far as the eye can see, and it’s– there’s physical games, there’s just boxes of paperwork, there’s development material, there’s lots of swag. Tons of stuff in here. So I think the format of this is, I’m just gonna kind of say, Hey, what’s that? We’re just gonna kind of poke around at some things. Rand Miller 06:27 Yeah, you definitely should. Some things I’ll be like, Ah doesn’t matter. Some things I’ll be like, Oh yeah, that’s really cool. Phil Salvador 06:34 So the first thing I noticed when we walked in, I’m looking at these big metal shelves, and they have, and this obviously is not like the most, like, historical stuff, but there’s a lot of swag here. There’s Myst shirts from over the years. I see a hat for Red Orb, which was one of Brøderbund’s adventure game publishing arms. They’re just– I’m not sure where to prompt from that, apart from, geez, that’s a lot of t-shirts. <laughter> But you’ve had a lot of– it seems like there’s, like, jackets, like, I don’t know. It’s amazing that you have all this kind of merch made for each of the individual games that you worked on. Rand Miller 07:03 The idea behind all of that being in here is, every time we get merch or make merch, or somebody else makes merch to market, Myst or Riven or any of the other projects, we’re like, Okay, let’s put a few of those in the vault. So we end up with lots of stuff in the vault. I don’t know what we’re gonna do with it. But, like, here’s, like, Myst t-shirts. This is the original design. Phil Salvador 07:24 Oh, wow. Rand Miller 07:25 When we at first did a Myst t-shirt, that’s the one we did. Phil Salvador 07:28 Sort of a sepia image of Myst Island with the word Myst on it. Rand Miller 07:31 Yes, exactly. Cosmic Osmo t-shirts. You know. Phil Salvador 07:35 Is that a vintage, like, of the time Cosmic Osmo t-shirt? Rand Miller 07:37 It’s a good question. It might be. Phil Salvador 07:39 Wow. Rand Miller 07:40 Yeah, you’re– Yeah, you just don’t know what you’re gonna find in here. Some old Myst t-shirts– Phil Salvador 07:43 I also– I noticed– Phil Salvador 07:45 Oh, what’s this? Rand Miller 07:46 Phil Salvador 07:46 What do we have here? Rand Miller 07:47 No, no, no, that’s– Oh! Here, here, here. This! Phil Salvador 07:50 Oh, my goodness. Marie Chapman 07:51 Wow. Rand Miller 07:51 This is the very first piece of clothing we ever made here at the company. My brother Robin and I. Phil Salvador 07:57 Wow. It’s a black sweatshirt that just says Cyan in, like, Times New Roman or Georgia font. Rand Miller 08:02 And our little blue dot– Phil Salvador 08:05 Very early. Rand Miller 08:06 –that seems to accompany things throughout history. So yeah, that one is kind of special. Phil Salvador 08:11 I also noticed there’s just some other swag. I see what appears to be a wine bottle with the Myst label on it that’s filled with pieces of a jigsaw puzzle. Rand Miller 08:19 So yes, those were– I forget who did those. If it was somebody who was selling Myst back in the day, could have been Brøderbund. It could have been Sunsoft, related to those, or one of the other spin offs decided to market it with a puzzle. Everything– We’re fans too. So everything that gets made, we’re like, You got to send us a few of those, and we can stick them in the vault. And so we have– how many do we have there? Seven puzzles, or something like that? Seven or eight puzzles in wine bottles. Phil Salvador 08:49 Yeah, I mean, this is the largest collection of Myst memorabilia. Like, I’ve seen people’s fan collections. But this is far beyond anything that– Rand Miller 08:54 Oh yeah, yeah. And then, okay, so mixed in with the crazy, you know, swag, is also, like, pieces of history, like, for example, this is the actual handle from Riven that Catherine pulls at the end when she gets in the elevator to pull down. Marie Chapman 09:14 Oh my god. Phil Salvador 09:14 Oh wow. Phil Salvador 09:14 Yeah, picture, it’s like a kind of a big rusty triangle with a screw on the end, is the shape of it. Rand Miller 09:18 Exactly. Almost like you could, you know, play it. “I need more cowbell” kind of stuff now with it. Phil Salvador 09:22 So this was– when you were doing production, you went down to Pacific Video Resources in San Francisco for the filming of Riven so these were, like, the props that were on the set with the blue screen. Rand Miller 09:29 Yes, and anything that people had to interact with had to be a physical item, because it was too hard to align the digital things with people’s fingers that we were recording with the live action. Phil Salvador 09:41 So it was like, tables could just be blue screen, but if you had, like, a door, you had to, like, actually make a door, Rand Miller 09:45 Yes. Which we did, and have also. Although it doesn’t fit in the vault, but it’s around here somewhere. Phil Salvador 09:49 Yeah, it’s kind of a big door. Rand Miller 09:51 Atrus’ boots from something. Phil Salvador 09:54 Oh goodness. Rand Miller 09:54 We have a satchel from something. We have the actual burned books from the original Myst. Phil Salvador 10:00 Oh so this was when, like, when you went to the shelves in the library and you pull out a book– you actually burned a book to do this. Rand Miller 10:06 We burned several books just to get the texture and the feel. Phil Salvador 10:09 For the readers, I’m trying to– it seems to be titled Maintaining a Healthy Heart. <laughter> Rand Miller 10:15 Shh, don’t tell anybody. Phil Salvador 10:17 Don’t let anyone know it’s a burned book. Gonna have fans, mass-burning that book to reproduce it. Rand Miller 10:21 Yes. I’m old enough now where I probably shouldn’t have burned this when I need to read it. Maintain my healthy heart. <laughter> Oh, look at this. Do you know what that is? Phil Salvador 10:30 Oh, I don’t. So looking at it, it seems to be, like, a transparent piece of something plastic with the Cyan logo on it. Rand Miller 10:35 Yeah, it is a– Marie Chapman 10:37 Pocket protector. Rand Miller 10:37 –pocket protector. Phil Salvador 10:38 Oh, my goodness. Rand Miller 10:39 A Cyan pocket protector. It’s old. Phil Salvador 10:41 I don’t know of any other video game companies with their own branded pocket protectors. That’s remark– because, so I try to put this in perspective, like, as someone who collects some of this stuff, I one time saw a Sim City 2000 pen on eBay, and I was like, That’s amazing. And then I realized, well, that was just a piece of swag they ordered. So like, what– you know, it’s a pocket protector company. You just get that. But that’s, 30 years later, is kind of exciting and weird. Rand Miller 11:03 And the cool thing is"
