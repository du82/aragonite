["https://gamehistory.org/episode-123-gamepro-magazine-collection"]
title = "Episode 123: GamePro Magazine Collection | Video Game History Foundation"
description = "Guests Katrin Auch & Dan Amrich, formerly of GamePro magazine, discuss their time at the publication as well as the archival collection now housed by the VGHF. Kat and Dan recount their experience of transitioning from film to digital layouts, unintentional blunders, working under tight budgets and deadlines, and the creative process of creating content.…"
full_description = "Episode 123: GamePro Magazine Collection Post author By Robin Kunimune Post date January 22, 2025 Guests Katrin Auch & Dan Amrich, formerly of GamePro magazine, discuss their time at the publication as well as the archival collection now housed by the VGHF. Kat and Dan recount their experience of transitioning from film to digital layouts, unintentional blunders, working under tight budgets and deadlines, and the creative process of creating content. You can also listen to the Video Game History Hour every other Wednesday on Patreon (one day early at the $5 tier and above) or on Spotify. See more from Katrin Auch: Website: katrinauch.com See more from Dan Amrich: Twitter/X: @danamrich Bluesky: bsky.app/profile/danamrich.bsky.social See more from both Kat & Dan: Dan & Kat Talk podcast (on hiatus): danandkattalk.com Etsy: bit.ly/katrinauch The Kyberpunks: thekyberpunks.com Video Game History Foundation: Podcast Twitter/X: @gamehistoryhour Email: podcast@gamehistory.org Twitter/X: @GameHistoryOrg Website: gamehistory.org Support us on Patreon: /gamehistoryorg Transcript Transcription provided by Jeremy Seith Frank Cifaldi 00:09 Hello and welcome to the Video Game History Hour, the official podcast of the Video Game History Foundation. I’m your host, Frank Cifaldi. Today’s show we’re really excited about. We brought in two very special guests who worked on GamePro magazine, which is a magazine I actually read as a child. They came on because we actually have a really interesting collection in our archives of material related to the production of GamePro magazine and we brought in two experts, basically to tell us what it is that we have and why it even exists. So we had this conversation back on August 2 of 2024. Let’s roll the tape. Frank Cifaldi 00:47 So Phil and I are happy to have two very special guests with us today, unabashed Disney adults and former action figures, Dan Amrich and Katrin Auch. Hi guys. Katrin Auch 00:57 Hi. Dan Amrich 00:58 I did not expect that one. Hi. Frank Cifaldi 01:02 But I think more importantly, or directly for this podcast, Dan and Kat, may I call you Kat? Frank Cifaldi 01:11 You can. Frank Cifaldi 01:11 You’re Kat to me. Dan and Kat worked at GamePro magazine for quite a while, and I believe even met there, right? Katrin Auch 01:20 No. Frank Cifaldi 01:20 No? Oh, okay, okay. Katrin Auch 01:22 We were married when we were working at GamePro, like, four years. Frank Cifaldi 01:26 Oh, wow! Okay, my head canon was that you had a really romantic meeting at GamePro and falling in love story, but wow. Katrin Auch 01:34 It was more a meeting at Ithaca College and falling in love. Frank Cifaldi 01:37 Got it. Katrin Auch 01:39 And then Dan got a job in California after we had been working together at a magazine, the magazine company in New York for couple years, and we were working in the same cube, and that’s when we actually got married. It was when we were in New York and we were in the same cube, and apparently we kept our relationship so underground that somebody who worked with us thought we were brother and sister, because we came together and left together, but we weren’t like, romantic in the office, and then we left for a two week vacation and came back married, and they were like, Oh, oh, we thought you were– Frank Cifaldi 02:18 You married your brother?! Katrin Auch 02:19 That’s very weird. Dan Amrich 02:21 Somebody told me they thought there was a death in the family, and that’s why we were both out for so long. Frank Cifaldi 02:25 That’s very funny. Dan Amrich 02:26 So that was– we were very, very concerned about the sort of voting block that a married couple working together represents. So we tried to keep PDA out. But, you know, they said, Well, you guys go to lunch together every day, and you come and you go, you know? So they knew there was a relationship, but they didn’t know it was romantic. Katrin Auch 02:43 Dan had started working there first so, and then we moved out to California, and then I started working at PC Games, which was the sister publication for GamePro. And then Dan came on to GamePro, and then eventually we were both on GamePro, but it took a little while to get there, but we got there. Dan Amrich 02:59 Yeah, that was a– you started a PC Games in 1996 if I recall. And my first issue was September ’97 which means I started writing in June of that year that I joined the staff, because that’s how long the lead time was, was almost three months. But yeah let’s set the calendar of the Wayback Machine for ’97 to the beginning of GamePro for us. Frank Cifaldi 02:59 Got it. Frank Cifaldi 03:24 Thank you for clarifying that, because I was going to ask that. So really, there’s two things we’re going to talk about today. I think it’s really interesting and important to kind of capture what working on a video game magazine was like in, I mean, maybe not peak peak, but basically the peak of game magazines. But then also, Phil has been dealing with a collection of GamePro assets that literally have Kat’s handwriting on them, and so I think it might be fun to sort of talk about, like, what these things are and why they exist, and why Kat was so freakish about organizing them. Katrin Auch 04:12 You have to understand, I set up that system because prior to me start taking over the head of that department, we didn’t archive things nearly as well as we did. And we also, like, shortly before that point, we were actually still working in film, which would mean we would send our files out to the publisher, and we would get back four pieces of film for every page. And having to, you know, have that, you know, stack of things to go through. It was really a lot to deal with. And then we started to move over to going all digital. And when we started to go all digital, it’s like, No, we should– We can package this stuff together and save it. And so we don’t have to make things from scratch each time. So that was something that I was very, very adamant about. And then I also had a team of interns that I used to put that system together and maintain it. Frank Cifaldi 05:15 Well, let’s start there, Kat, because this is something that I’ve tried to figure out. So you came in in ’96 I know at least partially there’s a digital layout happening, right? So when you started, was there sort of a hybrid digital and what like paste up situation? Katrin Auch 05:35 No, we weren’t doing paste up anymore. It was all digital when I came in, and because I started on PC Games, PC Games and GamePro were sort of parallel. They were sister publications, both in, like, on the same floor of the building, but they weren’t– different teams. So, yeah, we would do everything in– and I always thought it was funny that the PC Games magazine was entirely put together on Mac. And that’s the thing. It’s like all of the publications were almost always put together on Mac. We didn’t use PCs for that later, you know, like the editors had PCs that they would play on, but they would even write on Mac because they had to edit things later on the Mac, but yeah, we used Quark for, I’m gonna say half my run. I’m trying to remember when we switched over. I think it was like 2002. Phil Salvador 06:36 For listeners, This is a QuarkXPress, which was an early desktop publishing program that predates– what does everyone use now? InDesign, that’s kind of the standard one, InDesign now, but this was one of the earlier competitors that eventually got eclipsed by Adobe. But yeah, from what we’ve seen– Frank Cifaldi 06:50 it’s still around! Phil Salvador 06:52 It is? Really? Well, okay, eclipsed doesn’t necessarily mean put out of business, just nobody talks about QuarkXPress anymore. Katrin Auch 06:52 Still around Katrin Auch 06:58 Well, QuarkXPress was the thing, like, it was the– like, it was, like, PageMaker, I think was a thing, but InDesign, didn’t they? Adobe wanted to take over, and they tried several things, and we kept looking at them and going, No, we’re going to stay with Quark. And Quark got to one thing that was sort of stable, and then they didn’t. They had a lot of problems. Quark had a lot of problems. It was not like a very smooth system, including one of the big ones for us was when we’re doing layouts, a lot of times we would have character art that we would want to put into the text and have text run around it. Like that’s a very typical thing you’d see. Quark couldn’t do that without a third party extension being stuck onto it. So we had to have a secondary, you know, we had like five different sub programs that were, like, built into Quark, you know, like put over our Quark so we could make it and we had that Quark dialed in so hard by the time we went over, and when we did decide to switch over, it was going to be painful. We knew it was going to be painful because we were so into it. They actually brought in a InDesign trainer, and they put us all in the conference room together, the whole production team and the whole design team into the conference room, and we spent two days learning specifically what we needed to know for this, because they’re like, oh, let’s talk about graphs. It’s like, we don’t do graphs. We don’t care about graphs. We need to know this lane way, and we need to know it fast, and we need to know it quick and well. Phil Salvador 08:35 How do we put the little guy who’s, like, screaming when he gets excited about a game? We need the pathway for getting that onto a page. Katrin Auch 08:40 Exactly. We don’t need charts. We don’t need to know, like, there was a lot of stuff. There’s a lot of stuff InDesign can do, like, I know InDesign really, really well. At this point, there’s a lot of stuff InDesign can do that I have no clue about, because it’s this. I know my stuff, and I know it very well. But style sheets, oh, yeah, we know style sheets, master pages, like, all of the stuff you need to do templated work over and over and over again. We have in the bag, but yeah, we would lay everything out in Quark originally. And it would get well, do you want to just talk like the pathway? Like, how something we got into the magazine? Because– Frank Cifaldi 09:19 I’m down. I don’t care if we lose every listener. I want to hear this. Katrin Auch 09:26 Dan, why don’t you take the beginning and I’ll take the ending. Frank Cifaldi 09:29 Well, I want to pause really quick. Were you working with film when you came in? Katrin Auch 09:34 Like, we were working with film at the end stage, like we would proof on film the very last– we would get film proofs back, we would check them, and then we would send– Frank Cifaldi 09:43 So publisher assets were totally digital by the time you came in or were you still getting sent film? Katrin Auch 09:48 You mean from– Dan Amrich 09:49 Were you still getting like, 35 millimeter slides for screenshots and stuff like that? Katrin Auch 09:52 Yes, we were. Frank Cifaldi 09:53 So were you scanning those? Frank Cifaldi 09:56 Yes, we were. Frank Cifaldi 09:57 Got it. Okay. All right. All right, I’m good. Let’s hear it. Let’s have this path. Path me Dan Amrich 10:02 Well, at GamePro, and this was a point of contention, honestly, but it was a waterfall, right? So the editorial staff, the writing staff, started with, What’s this issue going to be? What’s our cover story? What are our features, etc, What are the reviews and we had editors for each section. We had a features e11ditor, we had a reviews editor, we had a previews editor. They were all in charge of their specific wells, right? But the text, it was the editor’s job to say, these are the things that we’re going to do this issue, and then ask the art team go and get us assets. Or if they could get assets themselves, they would. Katrin Auch 10:39 I’m gonna say that they were supposed to get the assets. They were supposed to ask for the assets. Dan Amrich 10:44 But, editors being lazy creatures, a lot of times, Kat would wind up having relationships with every art person everywhere. So GamePro worked on a beat system, so like only one person, Mike Weigand talked to Capcom, that way, if somebody called and said, Hello, I am from GamePro. You need to send me free games. They’d be like, you’re not Mike Weigand, so we all had different beats, and it was part of your responsibility as the editor to to get all the assets from your main contact at that company. But, you know, inevitably, that did not happen, and Kat wound up having really good relationships with a lot of other people from, you know, in the PR departments. So, we would write the text and we would offer the assets. We would get our own screenshots. Generally, we did not use canned screenshots for reviews. We would for previews, because that’s all that was available. We would get our– Frank Cifaldi 11:35 And you were digital capture at this point. Dan Amrich 11:36 We were doing digital capturing, yeah. I mean, when I joined in’ 97 they still had some equipment from the days of when they would have to use a camera and point it at a CRT. They had black shrouds around televisions, things like that. But they had mostly moved out of that when I got there in ’97. We had early digital capture cards, and we were using Adobe Premiere, and we would take screenshots or gameplay. We would generally pull stills out of gameplay and then deinterlace them, which was sometimes tricky, but that’s how we were able to get very dynamic images to go with a review. And we could write a pro tip specifically for what we wanted to show, or show exactly what we wanted to write as a pro tip, so that there was a sense that the screen shouldn’t just illustrate the game. It should actually help the player do something, be a little bit better at the game, On level three, you know. So for all the jokes that pro tips get, they were really supposed to be to help the reader a little surprise and delight. So we would have a story conference. We would get the article written– Katrin Auch 11:43 For features, for features. Dan Amrich 12:06 For features, yeah, for reviews, we would just put it on the server and say it’s ready to go, right? Oh no! We had physical dockets! Katrin Auch 12:38 Oh yeah! Dan Amrich 12:43 We had plastic pouches. And we had a template, photo copied form where you would have to fill it out and say, Who is the editor, who’s the writer on this thing, who is the designer on this thing. And there was a checklist, and it would route around. And so you would always have a stack of these plastic things that had printouts, and they would get bigger and bigger, especially if there were multiple revisions to the design. There would be like a Microsoft Word, just a straight document printed out of the text. Katrin Auch 13:16 And you were supposed to put your CD of assets in there, if you had it. Dan Amrich 13:19 Right. And eventually that became, I’m going to put it on the server, under the previews folder, under the name of the game, or whatever, but yeah, in the early days, it was a physical a"
