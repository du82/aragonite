full_description = "The Video Game History Hour Episode 125: ROMchip, What’s Next? February 19, 2025 Laine Nooney, an associate professor at NYU and managing editor of ROMchip: A Journal of Game Histories, joins Phil Salvador on The Video Game History Hour to chat about the journal’s mission to make game history more than just timelines. ROMchip is an open-access, independent journal that brings together academics, enthusiasts, and industry pros, supported… Episode 124: Digital Library Launch February 5, 2025 It’s finally arrived: our digital library archive is now open in early access! Our library team: library director Phil Salvador, director of technology Travis Brown, and artist and engineer Amanda Cifaldi all join foundation director Frank Cifaldi and show producer Robin Kunimune to celebrate and discuss the years-long project sampling just a portion of our… Episode 123: GamePro Magazine Collection January 22, 2025 Guests Katrin Auch & Dan Amrich, formerly of GamePro magazine, discuss their time at the publication as well as the archival collection now housed by the VGHF. Kat and Dan recount their experience of transitioning from film to digital layouts, unintentional blunders, working under tight budgets and deadlines, and the creative process of creating content.… Episode 122: Save the Games Recap January 8, 2025 We’re joined by Director of Digital Preservation at The Strong National Museum of Play Andrew Borman to recap the events of the first ever Save the Games Symposium put on by the museum in August 2024, a conference dedicated to digital preservation and advancing the field of video game preservation. Mentioned in the show: Chris… Episode 121: Exploring the Cyan Vault December 25, 2024 In this field report from Mead, Washington, Cyan co-founder Rand Miller takes VGHF library director Phil Salvador on an exclusive tour of the “Cyan Vault.” Together, they uncover rare game artifacts, prototypes, and cool behind-the-scenes treasures while diving into Cyan’s rich history. Listen in to discover how thoughtful, meticulous preservation can not only tell a… Episode 120: Nintendo’s Virtual Boy December 12, 2024 In our very first episode of season two, university professor José Zagal and video game historian Benj Edwards, co-authors of Seeing Red: Nintendo’s Virtual Boy, join host Frank Cifaldi to educate us all on Nintendo’s Virtual Boy. Mentioned in the show: Benj’s original article on VB: https://www.fastcompany.com/3050016/unraveling-the-enigma-of-nintendos-virtual-boy-20-years-later José’s original academic article on the VB (from… Season Two Announcement December 12, 2024 We’re thrilled to announce season two of the Video Game History Hour is finally here! We’ve been toiling away behind the scenes putting together a fun and interesting new line-up of guests and we can’t wait to share them all with you. Keep an eye on your feed for our re-launch episode coming up next.You… Holiday Update & Winter Fundraiser December 14, 2023 It’s been awhile so, let’s catch up. Plus, we’re right in the middle of our 2023 Winter Fundraiser and we can’t wait to tell you all about how it’s going. Video Game History Foundation: Podcast Twitter: @gamehistoryhour Email: podcast@gamehistory.org Twitter: @GameHistoryOrg Website: gamehistory.org Support us on Patreon: /gamehistoryorg Ep. 119: Karateka September 29, 2023 Game designer and creator of Karateka Jordan Mechner, joined by Chris Kohler of Digital Eclipse, shares a new interactive documentary The Making of Karateka exploring this 1984 karate classic title. In this episode: Jordan’s earliest work, perfect paper preservationist, Prince of Persia source code, hitting it rich in video games vs. going to class, celebrating… Ep. 118: Noclip Game History Archive September 13, 2023 Documentarian Danny O’Dwyer of Noclip has been sifting through thousands of videotapes in a recent mass-acquisition of video game (and adjacent) recordings. In this episode: Burger King and Kellogg’s games, Danny can fix your VCR, conferences in 1080p, shop talk on uploading footage, BBC Domesday Project methodology, slow Sonic, is that Frank?, it’s lonely work,… 1 2 3 … 13 →"
