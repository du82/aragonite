full_description = 'Dooly Bravo Land, a rare look at 90s Korean game development When it comes to the preservation of console games of the 1990s, the development work that came out of Korea tends to get overlooked by many historians and archivists. And it’s not hard to see why: these games were usually only sold in Korea and, even then, in what seem to be pretty small quantities.… Post author By Frank Cifaldi Post date March 15, 2017 A Look Back at Our GDC 2017 Display We were fortunate enough to have a space at GDC 2017’s first-ever Retro Play area, alongside a handful of other organizations. We had three main goals with our display: Promote our “We want your old development stuff!” campaign, which encouraged game developers to archive their old materials so that historians of the future can tell… Post author By Frank Cifaldi Post date March 7, 2017 The NES Launch Collection "Success breeds success," promised a 1986 trade advertisement for the NES. In developing the Foundation’s Digital Library, one need we identified early on was the ability to house special collections – that is, groups of related media, typically all tied together by one subject matter. One of our core beliefs is that historians are missing many of the tools needed to tell the stories of video games, so… Post author By Frank Cifaldi Post date February 27, 2017'
