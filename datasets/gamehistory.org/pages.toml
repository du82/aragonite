["https://gamehistory.org/our-mission"]
title = "Mission | Video Game History Foundation"
description = "We're bringing video game history back to life. The Video Game History Foundation is a 501(c)3 non-profit organization dedicated to preserving, celebrating, and teaching the history of video games."
full_description = 'Mission We’re bringing video game history back to life. The Video Game History Foundation is a 501(c)3 non-profit organization dedicated to preserving, celebrating, and teaching the history of video games. Our archives provide rare material for study, and our advocacy and educational outreach bring everyone together to do their part in celebrating and discovering video game history. Why aren’t people talking about video game history? Music Film & TV Video games .locker,.locker-loader{position:absolute;top:0;left:0;width:100%;height:100%}.locker{z-index:1000;opacity:.8;background-color:#fff;-ms-filter:"progid:DXImageTransform.Microsoft.Alpha(Opacity=80)";filter:alpha(opacity=80)}.locker-loader{z-index:1001;background:url(https://gamehistory.org/wp-content/plugins/visualizer/images/ajax-loader.gif) no-repeat center center}.dt-button{display:none!important}.visualizer-front-container.visualizer-lazy-render{content-visibility: auto;}.google-visualization-controls-categoryfilter label.google-visualization-controls-label {vertical-align: middle;}.google-visualization-controls-categoryfilter li.goog-inline-block {margin: 0 0.2em;}.google-visualization-controls-categoryfilter li {padding: 0 0.2em;}.visualizer-front-container .dataTables_scrollHeadInner{margin: 0 auto;} Books There just aren’t that many video game history books out there, as any visit to a bookstore will tell you. .locker,.locker-loader{position:absolute;top:0;left:0;width:100%;height:100%}.locker{z-index:1000;opacity:.8;background-color:#fff;-ms-filter:"progid:DXImageTransform.Microsoft.Alpha(Opacity=80)";filter:alpha(opacity=80)}.locker-loader{z-index:1001;background:url(https://gamehistory.org/wp-content/plugins/visualizer/images/ajax-loader.gif) no-repeat center center}.dt-button{display:none!important}.visualizer-front-container.visualizer-lazy-render{content-visibility: auto;}.google-visualization-controls-categoryfilter label.google-visualization-controls-label {vertical-align: middle;}.google-visualization-controls-categoryfilter li.goog-inline-block {margin: 0 0.2em;}.google-visualization-controls-categoryfilter li {padding: 0 0.2em;}.visualizer-front-container .dataTables_scrollHeadInner{margin: 0 auto;} Documentaries Documentaries fare even worse, with video games representing just a tiny sliver of what is currently available. .locker,.locker-loader{position:absolute;top:0;left:0;width:100%;height:100%}.locker{z-index:1000;opacity:.8;background-color:#fff;-ms-filter:"progid:DXImageTransform.Microsoft.Alpha(Opacity=80)";filter:alpha(opacity=80)}.locker-loader{z-index:1001;background:url(https://gamehistory.org/wp-content/plugins/visualizer/images/ajax-loader.gif) no-repeat center center}.dt-button{display:none!important}.visualizer-front-container.visualizer-lazy-render{content-visibility: auto;}.google-visualization-controls-categoryfilter label.google-visualization-controls-label {vertical-align: middle;}.google-visualization-controls-categoryfilter li.goog-inline-block {margin: 0 0.2em;}.google-visualization-controls-categoryfilter li {padding: 0 0.2em;}.visualizer-front-container .dataTables_scrollHeadInner{margin: 0 auto;} Revenue And yet, annual spending suggests that interest in video games is more than music and film combined! Sources: Wikipedia[1][2], Statista, MPA Here’s what we’re doing about it! See all projects Preservation We’re finding and preserving the endangered materials that help people tell new stories before they’re forgotten. Education Great stories inspire more great stories. We’re committed to bringing the history of video games to life through educational content and public outreach. Advocacy Saving video game history is a collaborative effort, and we need to get everybody on board. Our Values Inclusion Video games are, and always have been, for everyone. All stories deserve to be remembered. Access Anyone can be a video game historian, given the tools. And those tools should be available to everyone. Immediacy We’ve already lost a lot of our past, and we’re going to lose more. We must act now before it’s too late. Our Vision: A thriving ecosystem of video game history. Creators Historians Collectors Institutions Players Students We believe in pursuing a world where people are inspired to discover and celebrate the stories of video game history. We’re bridging the gaps between video game fans, historians, academics, institutions, collectors, and the industry. Historical video game preservation is a collaborative process — so let’s collaborate!'
