["https://gamehistory.org/episode-125-romchip-whats-next"]
title = "Episode 125: ROMchip, What’s Next? | Video Game History Foundation"
description = "Laine Nooney, an associate professor at NYU and managing editor of ROMchip: A Journal of Game Histories, joins Phil Salvador on The Video Game History Hour to chat about the journal’s mission to make game history more than just timelines. ROMchip is an open-access, independent journal that brings together academics, enthusiasts, and industry pros, supported…"
full_description = "Episode 125: ROMchip, What’s Next? Post author By Robin Kunimune Post date February 19, 2025 Laine Nooney, an associate professor at NYU and managing editor of ROMchip: A Journal of Game Histories, joins Phil Salvador on The Video Game History Hour to chat about the journal’s mission to make game history more than just timelines. ROMchip is an open-access, independent journal that brings together academics, enthusiasts, and industry pros, supported by community fundraising instead of traditional academic publishing. They discuss ROMchip‘s success, its growing community, and dreams of what the future holds for the journal. You can listen to the Video Game History Hour every other Wednesday on Patreon (one day early at the $5 tier and above), on Spotify, or on our website. See more from Laine Nooney: Linktree: linktr.ee/lainenooney See more from ROMchip: Website: romchip.org/ Socials, Events, Blog: donate.romchip.org/ Video Game History Foundation: Email: podcast@gamehistory.org Website: gamehistory.org Support us on Patreon: /gamehistoryorg TRANSCRIPT –Transcript edited by Jeremy Seith Phil Salvador 00:08 Hello and welcome to the Video Game History Hour presented by the Video Game History Foundation. On this show we sometimes have folks who are studying video game history, or maybe from video game history, or are preserving video game history. Today, we’ve got something kind of different. We have someone who is helping share video game history. Joining us today is Laine Nooney, associate professor of media industries at New York University. But they are here because they are the managing editor of ROMchip, a journal of game histories. We’ve danced around ROMchip a little bit on this podcast. We’ve had folks who have written for ROMchip on before, and we’ve talked about it, but now we’re going to talk about what ROMchip is and why you, the listener at home who is probably not an academic, should give a hoot about an academic game history journal. Laine, thanks so much for coming back to the show. Laine Nooney 00:57 Amazing. What a warm up. Yes, please give a hoot. Hey there. Phil Salvador 01:02 So before we start talking about what ROMchip is and all that, I want to zoom out a little bit and just talk a little bit about your work. Because you are a media and communications professor. I assume, when you tell people that you’re a video game history professor, that sounds like a fake thing. I don’t know if people outside of academia know what your job doing game history as an academic involves. So what’s your deal, Laine? What does a semester in the life of Laine look like? Laine Nooney 01:31 Oh, well, this is a funny time to ask that, because I’m on sabbatical, because I just got tenured. But typically, yeah, so i– Phil Salvador 01:37 Congratulations, by the way. Laine Nooney 01:39 Thank you. Phil Salvador 01:40 For non-academic folks, that basically means you have effective independence? What word am I looking for there? Autonomy? Laine Nooney 01:47 Preservation of academic freedom is usually how we talk about it. So I theoretically should be able to write and publish things that piss people off without risk of censure from my employer. I am not in a particularly high risk category in that way, right? You can imagine. Phil Salvador 02:05 I was about to ask if you wanted to piss anyone off right now. Laine Nooney 02:07 No, I’m good. Laine Nooney 02:10 For folks who work on, like, more charged topics that’s obviously really important to them. Yeah. So I’m an associate professor in a department called media, culture and communication at New York University. My job is comprised basically of kind of like three sets of activities. One is research, one is teaching, and one is what we vaguely call service. Research is exactly what that sounds like. That is the expectation that I write and publish and circulate historical knowledge. So I think it was last year– God, I’m in such a time warp. It was last year my first book came out, the Apple II Age: How the Computer Became Personal. So as a historian, writing what we in the biz call a monograph, and what normal people call a book is considered to be, like, that’s kind of the thing you have to do in order to get tenure, right, in order to have job security, to make a meaningful historical contribution to the world, right? Often, and you know, sometimes that means to a small group of scholars, sometimes it means to a much larger community. And I also publish, you know, journal articles, which we’ll talk about a lot, but those are usually papers, formal papers that are somewhere between, you know, 15 to 25 pages, you know, usually around 10,000 words, also putting forward original historical research as well as– I also, you know, I also write for public outlets. So I’ve written for the Atlantic, Motherboard, The Verge as part of what I consider my own commitment to circulating historical knowledge, kind of outside of academia, right? Phil Salvador 02:10 Okay. Phil Salvador 03:55 You did a very good article. I think it was for either Vice or The Verge a while ago about the orthopedics of using a computer and how, like, the culture of sitting at a desk and using the computer has contorted our bodies and created pain in new and exciting ways that have not existed in previous centuries. Laine Nooney 04:12 Yes, that was called How the personal Computer Broke the Human Body. That was a COVID essay. I had been working on that for a long time, and then it got kind of kicked off by this moment where we were all kind of like hunched over our laptop, sitting on top of a box, sitting on top of our dining room table. Phil Salvador 04:30 Were you not allowed to take your Herman Miller chair home And that was the impetus? Laine Nooney 04:35 Actually, there was a really, like, in that week where there was shut down. I actually rolled everything I had in my office in a wagon to my apartment. It was a really weird time. Phil Salvador 04:47 New York, baby. Laine Nooney 04:48 Yeah, that’s right, public transit. So I also teach. So I teach classes. I teach an undergrad class called Video Game Economies, which is what I call a critical political economy of the game industry, you know, that’s a medium sized lecture class. I also teach a big 240 person lecture on the history of media and communication. That’s kind of like one of those intro history courses for the major. And then I do this thing called service. And service is like, that’s both service to my department that’s sitting on committees, that’s writing letters of recommendation. There’s also what’s called service to the field and ROMchip fits into that. This is a thing I do and I work on to advance the state of game history as a wide ranging body of knowledge, kind of outside my own publishing record and beyond the material interests of my university. Phil Salvador 05:50 So I’m curious, why start a journal? Because you mentioned you published in other journals. There are places that are publishing video game history. Why did the world need a– you don’t use the word video game, you just say game history broadly. But why? Why does the world need a game history journal specifically the way you’re doing it? Laine Nooney 06:06 Yes, so, we are– I do want to underscore, we imagine games really broadly. We have a kind of techie title. That was because I already owned that URL and I thought it was good. But Phil Salvador 06:20 You just registered ROMchip.org on a whim one day? Laine Nooney 06:23 Yes, back when I was a grad student, I had some weird vision of, like, what if I did a game history version of Kill Screen or something like that? And I was like, ROMchip’s a good name. And so I just, like, bought that URL and camped out on it for a long time. And then when we decided to make this journal I was like, I think this is the name, right? I’ve already got it. I already own the Twitter handle, and I had the URL. I had the Gmail account already set up. But the the reason that we– so why do you need a journal? So to get in– this is a little bit insider baseball for academia, but I’ll try to keep it as brief as I can. Phil Salvador 07:04 I’ll steer you away from the rocks, if anything, if this goes astray. Laine Nooney 07:08 Thank you. So you know academia, right? Is pretty it’s organized into fields, right? And you know you could think about whatever your major was in college, right? English, history, art, physics, mathematics, right? Computer Science. When we’re in undergrad, we tend to enter into those with a kind of occupational mindset. We think we’re going to get a degree and we get some sort of job that’s loosely related. But once you start moving up the graduate level for things like that, into master’s degrees and PhDs, the conversations get increasingly more specific, because really who you’re talking to is this narrowing band of experts. And in order for something to be a feel, to be understood within academia as that there even is a collection of experts debating and moving knowledge forward in a specific arena, one of the things you need are places for that conversation to happen. So yes, I was publishing stuff in a variety of, you know, media and game studies journals when I was a historian, but there was really nowhere where dedicated conversations about game history could happen. It just didn’t exist. And so we were always, you know, I think folks in my generation and earlier were always trying to fit our work into these kind of other venues. And, you know, journals, they’re publishing outlets, they have certain ideas about, you know, who their audience is and what’s interesting to that audience. And so they try and shape you to those audiences. And what I really wanted, and my co-founders, Henry Lowood and Raiford Guins, wanted was a place where game history was the conversation. That’s what we wanted to make. Phil Salvador 08:49 Right. I can speak to that from my own experience too, having been in academia previously that like at my old university, games were split between, like, the communications program had the game design school, and then, like, the literature program had some game studies as part of media study, because they’re like, Oh, games are film kind of, like, if you’re David Cage, like games are films. So, yeah, it’s weird. So yeah, having a place that’s just, No, this is our area, we can get really in depth on stuff. Before we get into how, like, you know, you organize this. When we say, get in depth on stuff, what kind of stuff does ROMchip publish? Because it’s not just like, you know, a chronology of games released by Nintendo. You often go very deep into some specific subjects in ways that even to me, I sometimes I’m like, this is far beyond what I’m able to deal with. But it’s interesting. It’s like, excitingly niche subjects that you are the place for. Laine Nooney 09:43 Yeah. So, you know, one thing that’s helpful to know is that ROMchip basically has kind of three tiers of content. The first one of those is what we call peer review articles. This is the primary currency of academic publishing, right? In order to get tenured. You have to have peer reviewed articles published in academic journals, right? And those topics, just like any historical field, I mean, man, you think we get niche? How many books and essays do you think exist about the French Revolution? Phil Salvador 10:16 Just Abraham Lincoln, yeah. Laine Nooney 10:19 Medieval Europe, right? Yeah, like, just Henry Kissinger, right? I mean, there’s– Phil Salvador 10:25 There should be as many books about Marble Madness as there are Henry Kissinger. Laine Nooney 10:29 I mean, I might disagree, but I’m just looking at some of the stuff that we’ve published. So, you know, a few years ago, we did a article called Gaming Families: Therapeutic Board Games and Interpersonal Communication, which was about the use of board games as kind of family therapy devices in the home, right? We did a special issue on eSports and there we have essays about following a single ticket to the DOTA 2 international all around China. We have, you know, history essays, kind of weaving ethnography and history about the development of eSports arenas in Turkey, right? Phil Salvador 11:13 You had something in there about, like, the history of, like gold farming as, like an economy for like MMOs, right? That’s, that’s– people ask us all the time, like, Can you do, like, oral histories about MMOs? But it’s like, no. The people who are doing that research and documenting like this is a great document of this stuff to have. Laine Nooney 11:30 Yes. And so all of us, in our own way, are trying to, you know, add to this kind of, I tend to think of particularly computer and video game history. It’s like, standing in front of this giant pile of stuff, and there’s like, 15 of us with a shovel, and so each of us is just trying to, like, chip off the little bit that, like, we’re responsible for. And I’m like, Okay, I’ve got personal computing from 1978 to 1985. I need you to take, like, you know, consoles from 1990 to 1996 if you could. Thank you. And then we’re also trying to bring, we’re trying to do more than a chronology, right? Like, history is not just, it’s not just like a lineup of dates and facts. And this is, I think, one of the real commitments that ROMchip has is in trying to improve and elevate the general conversation around game history, right? In academia, that’s not a problem. But I think our general idea of a lot of game history is that it’s just a timeline. And the problem with the timeline is that it doesn’t tell you anything about why the stuff on the timeline showed up there. It doesn’t tell you anything about its historical context. It doesn’t tell you about why certain things appeared at the moment they did or rose or failed. It can’t situate these technologies into broader themes of, you know, culture, whether that’s you know, culture, economics, technology, gender, race, class, globalization, right? You know, that is the kind of stuff that we’re really trying to put a map together of like, what even happened, and then also, in the way that historians do, you know, we’re interested in having conversations with each other about how we think historical change happens. Phil Salvador 13:14 Yeah, one of the questions I wanted to ask was about the idea of, you know, what makes this different from a blog? But I think you answered that very well, that like, there’s this commitment, like this deeper type of material. The one I want to focus on that I think we kind of got off the talking about the tiers of ROMchip, but I wanted to mention specifically, you have something called the materials section, where you talk about, like, going deep on a specific game or a specific artifact. And that’s really good, because I feel like so much of that often focuses on, Here’s a thing, and not on, like, What’s the story behind it? Where did the thing come from? But that’s what you’re really drill"
