ar ett kontrollfreak är ingen nyhet för den som intresserat sig för Apples grundare. Han var raka motsatsen till medgrundare, “den andre Steve”, Steve Wozniak. Wozniak var tekniknörden som ville sprida hemdatorns evangelium, medan Jobs var marknadsföringsgeniet som ville sälja kalsingarna av världen. Så när iPhone väl introducerades så levererades den med ett helt slutet operativsystem. För den som inte ville låsa upp sitt oprerativsystem, kunde man endast läsa ner och installera programvara från Apple-kontrollerade Apple Store. Och där tilläts inte Flash. Flash var nämligen inte bara en programvara för uppspelning av interaktiv video, den erbjöd dessutom ett eget programspråk och en egen utvecklarmiljö. Hade Apple släppt in Flash i operativsystemet hade man med andra ord även öppnat en bakdörr för tredjepartsutvecklare. Och det vill man absolut inte. Detta fördröjde såväl tv-spelens, som Youtube-klippens, som nätcasinonas intåg på iPhone. HTML5 och en lösning Konkurrensen skulle dock jaga på Apple i det här avseendet. 2008 lanserade Google sitt eget operativ för smart phones. Android var raka motsatsen till iOS. Det var helt och hållet Open Source och vem som så önskade kunde både skapa program till systemet, liksom hjälpa till att utveckla det. På bara några år blev det det största operativsystemet för mobiltelefoner i världen. Apple riskerade att tappa marknadsandelar. När sedan HTML5 lanserades 2014 så var saken biff. HTML5 var ett nytt uppmärkningsspråk för webben, och bland dess många nya funktioner fanns stöd för interaktiva medier. Det gjord det omedelbart enklare för spelutvecklare att porta spelen för iPhone, och spel som tidigare endast funnits tillgängliga för Androider blev plötsligt snabbt tillgängliga för iPhone-användare. Samma sak inträffade på casinosidan. Inom bara något år var i stort sett alla nätcasinon kompatibla med såväl Apple som Android. Surfar du idag in på casinon som Mr Green eller Kaboo så slussas du omedelbart vidare till mobilcasinot