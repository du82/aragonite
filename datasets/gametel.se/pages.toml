full_description = "Spel till Gametel Som du säkert redan vet så går det inte att spela alla spel via gametel bluetooth konsollen, utan man måste ladda ner en app där det finns ett stort utbud av spel. Appen heter gametel och finns på Market som motsvarar apples App Store och är ett forum där du kan ladda ner applikationer. Super Mario Boss i Gametel appen Några exempel på spel som finns i appen Gametel är Super Mario Boss. Det är ett känt spel som går ut på att klara av olika värdar och banor. Man är en gubbe som sedan kan utvecklas i olika storlekar och ha olika användbara funktioner. De olika värdarna består av olika teman som till exempel vattenvärd, snölandskap, dödslandskap och regnskog. Detta är ett populärt spel som slog igenom för ett antal år sen. I samband med att Apple släppte deras nyaste lansering och version av Iphone 7 släppte dom även ett samarbete med Super Mario Boss skapare. Det betyder att Apple kommer lansera ett spel på deras App Store om Super Mario Boss. Med tanke på att Super Mario Boss inte finns som enskild app på androids Market är det ännu en anledning att köpa gametel bluetooth konsollen och ladda ner gametel appel eftersom man då kan spela Super Mario Boss även på Android. Förutom Super Mario Boss som är ett spel för både tjejer och killar, finns det även olika spelkategorier för tjejer och killar med tanke på att könen har olika favoriter när det kommer till spel. Givetvis hindrar inte det att tjejer till exempel ska kunna spela spel som är från killarnas kategori. Det finns alltså hästspel, spel som går ut på att bygga farmer eller städer, hundspel och massvis med liknande där man kan använda sig av gametel konsollen. Kategorin som inriktar sig på killar innefattar spel som inriktar sig på krig, bilspel, strategispel och spel som utspelar sig i fantasivärldar. Exempel på detta är Star Wars. Bilspelen är extremt populärt med tanke på att man kan utnyttja gametel bluetooth konsollens olika funktioner. Stort utbud av spel Som du säkert