["https://gametogen.com/news/gameto-appoints-dr-ghassan-gus-haddad-as-chief-medical-officer-to-lead-clinical-development-of-fertilo-a-cell-based-treatment-for-ivf-and-egg-freezing"]
title = "Gameto Appoints Dr. Ghassan (Gus) Haddad as Chief Medical Officer to Lead Clinical Development of Fertilo, a Cell-Based Treatment for IVF and Egg Freezing | Gameto"
full_description = '''Written By:Last updated:October 23, 2024Share NEW YORK, September 9th, 2024 — Gameto, a biotechnology company dedicated to advancing treatment options in women’s health and reproductive longevity, today announced the appointment of Dr. Ghassan (Gus) Haddad as Chief Medical Officer (CMO). ‍Dr. Gus Haddad received his medical degree from the American University of Beirut, and has completed his Residency in Obstetrics and Gynecology from the University of Mississippi with further subspecialty training in Reproductive Endocrinology and Infertility from the University of Cincinnati in Ohio and has been a practicing physician since 2007. In addition to practicing medicine, Dr. Haddad is also a prolific entrepreneur. He co-founded the Houston Fertility Institute (currently Aspire HFI) and drove it to become one of the largest fertility practices in the nation. He is also a cofounder of Vivere Health, one of the first private equity backed fertility practice networks in the United States. He was part of the team that engineered multiple sequential sales of both HFI and Vivere to Prelude Fertility Network and remains on the HFI team as Medical Director. Dr. Haddad also co-founded Conceptions Pharmacy, a fertility specialty pharmacy which he later sold.‍In his new role, Dr. Haddad will oversee the clinical development of Gameto’s lead program, Fertilo, their novel investigational in vitro maturation (IVM) solution containing engineered ovarian support cells (OSCs) that is designed to improve IVF and egg freezing processes by reducing hormonal stimulation and maturing eggs outside the body. As Gameto’s CMO, Dr. Haddad will spearhead Gameto’s efforts in guiding Fertilo through the company’s Phase 3 clinical trial, which will aim to evaluate the safety and efficacy of the treatment in improving egg maturation and IVF outcomes with a minimal hormonal stimulation protocol. Dr. Haddad will also lead strategic efforts to develop physician education and training programs surrounding IVM minimal stimulation retrievals.‍"We are excited to welcome Dr. Haddad to Gameto, particularly at this pivotal time as we are preparing to meet requirements to initiate Fertilo’s Phase 3 clinical trial,” said Dr. Dina Radenkovic, Gameto’s Co-founder and CEO. “Dr. Haddad’s range of experiences as both a practicing reproductive medicine physician and successful entrepreneur make him a valuable addition to the Gameto team.”‍"I am excited to be joining Gameto as Chief Medical Officer at such a crucial point in the development of Fertilo,” said Dr. Haddad. "Gameto is a company that is uniquely positioned to revolutionize reproductive medicine, providing women with innovative solutions that prioritize the patient experience and empower them to take control of their reproductive futures. I look forward to leading our medical and scientific teams in delivering care that will help shape the future of women's health."‍About FertiloFertilo, Gameto’s lead investigational program, is a solution derived from induced pluripotent stem cells (iPSC) and designed to mature eggs outside of the body as part of minimal hormonal stimulation cycles for in vitro fertilization and egg freezing. Gameto’s goal in developing Fertilo is to make fertility treatments more convenient, safer, and accessible for a wider patient population. Fertilo has received different regulatory classifications in foreign jurisdictions, and after consultation with national regulators, has been cleared for commercialization in Australia, Japan and in large markets in Latin America. ‍About GametoGameto is a biotechnology company developing novel treatment solutions for women's health, starting with infertility. Gameto brings together an experienced scientific management team with the vision and passion to develop a product suite to support women throughout their reproductive journeys. Gameto's lead program, Fertilo, aims to make IVF and egg freezing shorter, safer, and more accessible through reduced hormonal injections by maturing eggs outside of the body. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and founder of North America's largest fertility network Prelude Fertility, Martin Varsavsky, as Chairman. For more information, go to gametogen.com or follow us on Twitter and Instagram @gametogen and on LinkedIn.‍Press and Investor ContactKylie Jordankylie@gametogen.com‍These statements are based on current plans, estimates, targets and projections, and are subject to inherent risks, uncertainties and other factors which could cause actual results to differ materially from the future results expressed or implied by such forward-looking statements.'''
