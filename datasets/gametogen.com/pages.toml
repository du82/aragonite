from truncated hormonal stimulation; Presenter: Luis Guzmán, PhD; Poster Presentation (P-571) 10/22/2024 3:30 PM - 3:45 PM Mile High Poster Hall, 1a-1e, Station 6Ovarian support cells enhance oocyte maturation and developmental competence by recreating a complex follicle-like environment in vitro; Presenter: Christian Kramme, PhD, Poster Presentation (P-594) 10/22/2024 4:15 PM - 4:30 PM Mile High Poster Hall, 1a-1e, Station 10‍About GametoGameto is a biotechnology company developing novel treatment solutions for women's health, starting with infertility. Gameto brings together an experienced scientific management team with the vision and passion to develop a product suite to support women throughout their reproductive journeys. Gameto's lead program, Fertilo, aims to make IVF and egg freezing shorter, safer, and more accessible through reduced hormonal injections by maturing eggs outside of the body. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and founder of North America's largest fertility network Prelude Fertility, Martin Varsavsky, as Chairman. For more information, go to gametogen.com or follow us on Twitter and Instagram @gametogen and on LinkedIn.Investor and Press ContactKylie Jordankylie@gametogen.comThese statements are based on current plans, estimates, targets and projections, and are subject to inherent risks, uncertainties and other factors which could cause actual results to differ materially from the future results expressed or implied by such forward-looking statements.‍"
