["https://www.gametogen.com/news/gameto-appoints-dr-jaime-knopman-as-chairwoman-of-clinical-advisory-board"]
title = "Gameto Appoints Dr. Jaime Knopman as Chairwoman of Clinical Advisory Board to Guide Clinical Strategy and Innovation in Women’s Health | Gameto"
full_description = "Written By:Last updated:October 23, 2024Share NEW YORK, September 30th, 2024 — Gameto, a biotechnology company dedicated to advancing treatment options in women’s health and reproductive longevity, is pleased to announce the appointment of Dr. Jaime Knopman as Chairwoman of its Clinical Advisory Board. In this key role, Dr. Knopman will provide strategic leadership and guidance on company programs, working closely with the Gameto team to drive innovation in fertility treatments and other areas of women’s health.“We are honored to welcome Dr. Jaime Knopman to lead our Clinical Advisory Board,” said Dr. Dina Radenkovic, Co-founder and CEO of Gameto. “Jaime is a renowned expert in reproductive endocrinology and infertility, and her clinical insight will be invaluable as we advance our programs, particularly as we move forward with the development of our lead program, Fertilo. Her commitment to improving outcomes for women aligns perfectly with Gameto’s mission to transform women’s health.”Dr. Knopman is a respected reproductive endocrinologist and a leader in the field of infertility, with years of clinical experience helping patients navigate complex fertility challenges. After graduating Summa Cum Laude and Phi Beta Kappa from the University of Pennsylvania, Dr. Knopman received her medical degree from Mount Sinai School of Medicine where she was elected to the AOA honor society. She completed both her residency training in Obstetrics and Gynecology as well as her subspecialty training in Reproductive Endocrinology and Infertility from NYU Medical Center. She currently serves as the Director of Fertility Preservation for CCRM Fertility of New York and also is the medical director of Chick Mission, a non-profit organization dedicated to the critical issues unique to young adult cancer patients with a focus on fertility challenges. Jaime is known for her compassionate approach and commitment to personalized patient care, and she brings a wealth of knowledge in both clinical and research settings.“I am excited to join Gameto’s Clinical Advisory Board at such an exciting time,” said Dr. Knopman. “Gameto’s innovative approach to fertility and women’s health, including their development of cell-based therapies, has the potential to revolutionize how we treat reproductive issues. I look forward to working with this talented team to help bring these important advancements to patients in need.”As Chairwoman of the Clinical Advisory Board, Dr. Knopman will work closely with Gameto’s leadership team and scientific advisors to shape clinical strategy, oversee trial design, and ensure the highest standards of patient safety and clinical excellence.‍About FertiloFertilo, Gameto’s lead investigational program, is a solution derived from induced pluripotent stem cells (iPSC) and designed to mature eggs outside of the body as part of minimal hormonal stimulation cycles for in vitro fertilization and egg freezing. Gameto’s goal in developing Fertilo is to make fertility treatments more convenient, safer, and accessible for a wider patient population. Fertilo has received different regulatory classifications in foreign jurisdictions, and after consultation with national regulators, has been cleared for commercialization in Australia, Japan and in large markets in Latin America. About GametoGameto is a biotechnology company developing novel treatment solutions for women's health, starting with infertility. Gameto brings together an experienced scientific management team with the vision and passion to develop a product suite to support women throughout their reproductive journeys. Gameto's lead program, Fertilo, aims to make IVF and egg freezing shorter, safer, and more accessible through reduced hormonal injections by maturing eggs outside of the body. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and founder of North America's largest fertility network Prelude Fertility, Martin Varsavsky, as Chairman. For more information, go to gametogen.com or follow us on Twitter and Instagram @gametogen and on LinkedIn.‍Press and Investor ContactKylie Jordankylie@gametogen.com‍These statements are based on current plans, estimates, targets and projections, and are subject to inherent risks, uncertainties and other factors which could cause actual results to differ materially from the future results expressed or implied by such forward-looking statements.‍"
