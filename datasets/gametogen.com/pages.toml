estor working at the convergence of health and technology, primarily in women's and family health; and Andrew McLaughlin, former Deputy Chief Technology Officer of the United States, to ensure that Gameto's developments are used for positive change.About Gameto:Based in New York and Madrid, Gameto is a biotechnology company using cell engineering to develop therapeutics for diseases of the female reproductive system. Gameto brings together an experienced scientific management team with vision and passion to develop groundbreaking products for women's health. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and leader in the fertility space Martin Varsavsky as Chairman. For more information, go to gametogen.com or follow us on Twitter @gametogen.About Insight Partners:Insight Partners is a global software investor partnering with high-growth technology, software, and Internet startup and ScaleUp companies that are driving transformative change in their industries. As of June 30, 2022, the firm has over $80B in regulatory assets under management. Insight Partners has invested in more than 700 companies worldwide and has seen over 55 portfolio companies achieve an IPO. Headquartered in New York City, Insight has offices in London, Tel Aviv, and Palo Alto. Insight's mission is to find, fund, and work successfully with visionary executives, providing them with practical, hands-on software expertise to foster long-term success. Insight Partners meets great software leaders where they are in their growth journey, from their first investment to IPO. For more information on Insight and all its investments, visit insightpartners.com or follow us on Twitter @insightpartners.SOURCE Gameto‍'''
