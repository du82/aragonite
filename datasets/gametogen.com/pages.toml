["https://gametogen.com/news/gameto-selected-for-seven-presentations-at-the-american-society-for-reproductive-medicine-asrm-2024-annual-meeting"]
title = "Gameto Selected for Seven Presentations at the American Society for Reproductive Medicine (ASRM) 2024 Annual Meeting | Gameto"
full_description = "Written By:Last updated:October 23, 2024Share NEW YORK, October 8th, 2024 — Gameto, a biotechnology company dedicated to advancing treatment options in women’s health and reproductive longevity, today announced the company was selected to give seven presentations at the American Society for Reproductive Medicine (ASRM) 2024 Annual Meeting, the largest reproductive medicine conference in the United States. Gameto’s presentations highlight progress across multiple areas of reproductive health using its product candidate for in vitro maturation, Fertilo.The presentations are as follows: Oral Presentations (4):Ovarian support cell-assisted in vitro maturation of immature oocytes from truncated hormonal stimulation used in donor egg cycles; Presenter: Christian Kramme, PhD; Oral Presentation (O-103) 10/21/2024 4:14 PM - 4:25 PM Mile High Ballroom 4aClinical procedures for in vitro maturation (IVM) treatment; Presenter: Dr. Michel De Vos; Oral Video Presentation (V-10) 10/22/2024 11:16 AM - 11:24 AM Room 303Ovarian support cell in vitro maturation results in healthy murine live births with no evidence of reprotoxicology in a multigenerational study; Presenter: Christian Kramme, PhD; Oral Presentation (O-172), 10/22/2024 11:18 AM - 11:29 AM Mile High Ballroom 4eNovel cell-based strategy utilizing ovarian support cells for in vitro maturation: from proof-of-concept to clinical manufacturing; Presenter: Christian Kramme, PhD; Oral Presentation (O-218) 10/22/2024 1:30 PM - 1:41 PM Mile High Ballroom 4d Poster Presentations (3):Donor side effects experienced under minimal controlled ovarian stimulation (COS) with in vitro maturation (IVM) versus conventional COS for in vitro fertilization (IVF) treatment; Presenter: Sabrina Piechota; Poster Presentation (P-259) 10/21/2024 4:15 PM - 4:30 PM Mile High Poster Hall, 1a-1e, Station 6First case of reported positive pregnancy from novel ovarian support cell-assisted in vitro maturation of immature oocytes derived from truncated hormonal stimulation; Presenter: Luis Guzmán, PhD; Poster Presentation (P-571) 10/22/2024 3:30 PM - 3:45 PM Mile High Poster Hall, 1a-1e, Station 6Ovarian support cells enhance oocyte maturation and developmental competence by recreating a complex follicle-like environment in vitro; Presenter: Christian Kramme, PhD, Poster Presentation (P-594) 10/22/2024 4:15 PM - 4:30 PM Mile High Poster Hall, 1a-1e, Station 10‍About GametoGameto is a biotechnology company developing novel treatment solutions for women's health, starting with infertility. Gameto brings together an experienced scientific management team with the vision and passion to develop a product suite to support women throughout their reproductive journeys. Gameto's lead program, Fertilo, aims to make IVF and egg freezing shorter, safer, and more accessible through reduced hormonal injections by maturing eggs outside of the body. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and founder of North America's largest fertility network Prelude Fertility, Martin Varsavsky, as Chairman. For more information, go to gametogen.com or follow us on Twitter and Instagram @gametogen and on LinkedIn.Investor and Press ContactKylie Jordankylie@gametogen.comThese statements are based on current plans, estimates, targets and projections, and are subject to inherent risks, uncertainties and other factors which could cause actual results to differ materially from the future results expressed or implied by such forward-looking statements.‍"
