full_description = "If you're interested in working with Gameto but can't find a job opening at the moment, please share your resume with us at careers@gametogen.com. We may reach out about future opportunities! Gameto is a private biotechnology company in women’s health. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as a co-founder & CEO and a serial entrepreneur & leader in the fertility space, Martin Varsavsky, founder of Prelude Network, one of the largest proprietary fertility clinics chain in the US, as Chairman. Gameto’s underlying science platform was developed with a sponsored research agreement with Harvard University/Wyss Institute. We are using the cell engineering platform to develop novel treatment solutions for infertility and other diseases of the female reproductive system. Last year we published that our cell engineering platform of the female ovary developed with Professor George Church’s lab at Harvard Medical School surpasses the previous gold standard animal models. Gameto has raised $40 million in a Series A from funds such as Insight Partners, Future Ventures, Lux Capital, Bold Capital, Bob Nelsen & Anne Wojcicki. Gameto currently has about $22m cash on hand. Our team is mission-driven, kind, collaborative, and authentic. Read about Gameto in MIT Technology Review, The New Yorker, The Boston Globe, and Stat News. We are an equal opportunity employer and value diversity at our company; we do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status. If interested in working with Gameto, please send the following to careers@gametogen.com with the email subject “Interested in Working at Gameto (your full name)”:"
