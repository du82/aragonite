["https://gametogen.com/science"]
title = "Platform | Gameto"
description = "Advancing reproductive health technologies."
full_description = "Through cell engineering, Gameto is developing an ecosystem of therapeutics to support modern women throughout their reproductive journeys. Women are born with all of the eggs they will ever have. As women age, the number and quality of these eggs decline. The relative decline leads to infertility, and the absolute decline causes menopause.This decline is not a biological imperative. Only humans and four types of whales experience menopause, meaning that studying the female reproductive system is challenging. Gameto has developed a platform to produce female reproductive cell lines. We use proprietary cell engineering to generate ovarian cell lines that mimic the functions of reproductive system cells, producing and responding to all hormones.Our team of engineers is using this platform to build a portfolio of treatments for women’s health.Gameto is advancing the first application of this platform, Fertilo, a technology designed to improve assisted fertility outcomes. We are focused on improving fertility care outcomes, but what we are currently doing for infertility, we will soon do for drug development, menopause, and more... Clinical trials have only been required to include women since 1993. Many products used today are understudied in women, leading to severe side effects and low efficacy. Diseases of the female reproductive system have particularly poor animal models, as many of these diseases and conditions don’t occur naturally in animals. These diseases typically have no targeted treatments, leaving patients struggling. We are developing Deovo, an engineered model of the female reproductive system to improve the drug development process for women. Deovo is an organoid platform of the female reproductive system for disease modeling, drug discovery, and safety testing.‍Our goal is more efficient development of therapeutics designed for the female reproductive system, as well as safety screening for all drugs entering clinical trials. Despite the fact that over 1 billion women will experience menopause by 2025, few effective treatments exist. In addition to debilitating symptoms, menopause is associated with an increased risk of numerous conditions, including osteoporosis, dementia, depression, heart disease, and Alzheimer’s Disease.But menopause is not a biological imperative."
