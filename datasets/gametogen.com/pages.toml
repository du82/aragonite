title = "Supply Chain Manager (Austin or NYC Based)"
full_description = "We are seeking a highly skilled Supply chain manager with extensive experience in a commercial company in a highly regulated industry with global presence, ideally in biotechnology who has experience with outsourced manufacturing components or in full and proven ability to manage multiple CDMOs, vendors and product logistics. The ideal candidate will be responsible for the entire Fertilo supply chain - from manufacturing currently with a CDMO in the US to delivery to clinics globally. With strong project management acumen, you will ensure that manufacturing processes meet regulatory standards and organizational goals while driving efficiency and innovation. Additional points for familiarity with cell therapy CDMOs and cell therapy products. - Oversee contract negotiations, performance monitoring, and compliance with contractual obligations. - Coordinate production runs, ensuring timely execution and adherence to quality and safety standards. - Prepare long term manufacturing plans for the company including in house and externally sourced manufacturing. - Track project costs and provide regular financial updates, ensuring adherence to budgetary constraints. - Communicate project status, challenges, and successes to internal stakeholders and executive leadership. - Prepare and present regular updates on manufacturing performance, contract status, and project progress. - 5+ years of experience in supply chain & manufacturing CMDO management in a commercial stage biotechnology company - Proven track record of managing relationships with CDMOs and coordinating complex manufacturing operations. Interested candidates should submit their resume and a cover letter outlining their relevant experience and qualifications via Linkedin. Please include title in the subject line. Join our team and contribute to the advancement of cutting-edge cell therapy products by ensuring the highest standards of manufacturing excellence. We look forward to reviewing your application! Gameto is a clinical & commercial stage biotechnology company developing novel treatment solutions for women's health, starting with infertility. Gameto brings together an experienced scientific management team with the vision and passion to develop a product suite to support women throughout their reproductive journeys. Gameto's lead program, Fertilo, aims to make IVF and egg freezing shorter, safer, and more accessible through reduced hormonal injections by maturing eggs outside of the body. Gameto is led by physician-turned-entrepreneur Dina Radenkovic as CEO and serial entrepreneur and founder of one of North America's largest fertility networks Prelude Fertility, Martin Varsavsky, as Chairman. For more information, visit gametogen.com or follow us on Twitter and Instagram @gametogen and on LinkedIn."
