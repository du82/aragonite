title = "Fertilo Product Overview"
description = "Physically: Women are subject to ~two weeks of hormonal injections, which can cause complications, side effects, and ovarian hyperstimulation syndrome.Professionally: Women often miss work and everyday activities due to frequent clinic visits and medical side effects.Financially: IVF is expensive. The average woman must go through 3+ cycles to have a baby."
full_description = "Physically: Women are subject to ~two weeks of hormonal injections, which can cause complications, side effects, and ovarian hyperstimulation syndrome.Professionally: Women often miss work and everyday activities due to frequent clinic visits and medical side effects.Financially: IVF is expensive. The average woman must go through 3+ cycles to have a baby. Maturing eggs outside the body could reduce the need for hormonal injections, improving the patient experience and safety while maintaining efficacy. Fertilo recreates an ovarian environment using young ovarian support cells (OSCs), maturing eggs through dynamic feedback during a ~1 day co-culture. Fertilo replicates the eggs’ natural maturation in a healthy, young body, yielding healthy, mature eggs. Fertilo is an engineered line of ovarian support cells that aid egg maturation, developed by reprogramming iPSCs. These cell types behave like the body's own cells, producing and responding to all key hormones. ​​Ovaries age faster than the rest of a woman’s body. Today’s high injection paradigm attempts to boost a signaling environment that is often already impaired, requiring excessive hormone doses to yield mature eggs and causing painful and extensive side effects.Fertilo treats the eggs directly, efficiently yielding healthy eggs that are ready for fertilization and protecting the patient against systemic hormonal stimulation. If you are interested in partnering with Gameto as we conduct preclinical studies and clinical trials, please fill out our partnership form. If you are a patient interested in participating in future clinical trials, please fill out the form below."
