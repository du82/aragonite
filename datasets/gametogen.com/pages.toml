full_description = "Fertilo would move the egg maturation process outside of the body, allowing for a shorter, easier, and more accessible cycle, on your terms. With a Fertilo cycle, patients would receive minimal stimulation, physicians intentionally retrieve immature eggs, and the eggs mature in the lab supported by Fertilo.The concept of maturing eggs outside of the body, called in vitro maturation (IVM), is not new and not considered experimental. Thousands of babies have been born by IVM since 1991. Fertilo would make IVM more effective and, therefore, an acceptable treatment option for more women. Patients who have undergone the Fertilo protocol as part of trials have reported overwhelmingly positive experiences: Fertilo is not yet approved in the United States. We are pleased to share that the FDA has provided tentative approval for our company to proceed to Phase 3 trial, subject to the completion of specific assay qualificaFertilo can be accessed ex-US in Australia and Latin America: If you are interested in partnering with Gameto as we conduct preclinical studies and clinical trials, please fill out our partnership form. If you are a patient interested in participating in future clinical trials, please fill out the form below."
