full_description = "Dina is a medical doctor and a healthcare entrepreneur. Prior to her role as Co-founder & CEO of Gameto, Dr Dina Radenkovic was a partner at SALT Bio Fund (salt.org) and had research posts at King’s College London and the Buck Institute for Research on Aging. She qualified with a dual degree in medicine and physiology from UCL Medical School awarded the best overall performance in physiology BSc. Dina did her residency at St Thomas’ Hospital in London. She has over 30 academic papers, 7 grants and over 40 scientific conference presentations. She is fluent in 5 languages and 3 programming languages. Prior to joining Gameto, Christian Kramme completed his PhD at Harvard Medical School working with the Sponsored Research Agreement of Gameto and Professor George Church’s lab. His thesis work “Multimodal investigation of human in vitro oogenesis” was based on high-throughput screening of transcription factors for generation of human germ cells, oocytes, and ovarian supporting cells to model genetic causes of infertility. Prior to Harvard, Christian received his B.S. in Molecular Genetics from UCLA, graduating Magna Cum Laude. While at UCLA, Christian conducted research on cannabinoids for migraine and chronic pain treatment. His work on synthetic biology and cell engineering for human oogenesis has yielded numerous patents and publications. Agustina graduated with a Bachelor of Laws from the Universidad Nacional del Nordeste in Corrientes where she completed the six-year law degree in fewer than three. She also completed an MBA in Innovation Management at the Universidad de Buenos Aires, and graduated from the University of Georgia Master of Laws program where she received a merit-based full scholarship. Her most recent role was in Complex Litigation at Clarin Group, where she worked on high-stakes cases, such as securing an injunction against the federal government of Argentina to suspend the nationalization of telecommunication services. Agustina has performed pro bono work, including a project funded by the United Nations Democracy Fund which aims to promote vulnerable women’s access to justice in civil cases. She was selected as one of 500 young leaders in LATAM by the Climate Finance Group for Latin America and the Caribbean to promote transparency and accountability of international financing in climate change."
