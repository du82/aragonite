full_description = 'Art / Audio 34-key Kalimba music theory analysis Seeds Kalimba "Pisces" is a pretty interesting 34-key Kalimba! I love when a brand try to pioneer something and there are not much information anywhere else, I wanted to be at the frontier and experiment. Sep 1, 2021 24 min read Art / Audio Mix and master game audio for mobile devices There is a "bug" in my audio, specifically the snares were too hot and they are overpowering melodies. Bass disappeared. But they sounded fine on my ATH-M50 headphone. Aug 22, 2019 15 min read Art / Audio Unity 2D asset pipeline with Affinity Designer Many may know how to create an artwork in art program, however I am still seeing some people slicing images for export manually or even create each artboard for each little images... the technology had already advanced far past that point though! Jul 12, 2019 8 min read Art / Audio Tips on game sound effect processing There will be an occasion where searching the net is costing you more time to find the exact SFX you have in your head than sculpting one by yourself. Especially abstract ones like magic, combo attacks, or UI sounds. May 21, 2019 10 min read Unity TextMeshPro Anatomy Your imported TMP font looks weird, kinda off from the RectTransform you setup, or broke when using multiple languages that falls back to other TMP asset? Let’s not rely on extracted data and understand it completely in this article. Dec 26, 2018 10 min read Unity Unity’s Android audio latency improvement in 2019.1.0 Spicy news! Unity 2019.1.0a7 appears and in the release note, for the first time in forever, “audio latency” was mentioned! Nov 2, 2018 6 min read Unity Using most Japanese characters in a game is possible with 1024x1024 texture In games we need to include all the character image as a rendered texture, and so it is a big problem for language like Chinese/Japanese… Jul 20, 2018 10 min read Unity Android Native Audio Primer for Unity Developers I will demystify the “black box” surrounding the Android audio system and analyze why Unity’s way of using it makes your audio latency even higher than the already awful Android latency. Jul 5, 2018 67 min read'
