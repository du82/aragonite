title = "มาลองเริ่มต้นอัดเสียงไปทำ Sound Effect กันเถอะ"
description = "หลายๆคนอาจจะเริ่มต้นจากการ Google หาเสียงฟรีๆมาใช้ ซึ่งส่วนมากก็จะเจอแต่จะมีปัญหาที่ว่า.."
full_description = "Art / Audio มาลองเริ่มต้นอัดเสียงไปทำ Sound Effect กันเถอะ หลายๆคนอาจจะเริ่มต้นจากการ Google หาเสียงฟรีๆมาใช้ ซึ่งส่วนมากก็จะเจอแต่จะมีปัญหาที่ว่า.. 5argon / Sirawat Pitaksarit Apr 6, 2018 • 1 min read To California!หลายๆคนอาจจะเริ่มต้นจากการ Google หาเสียงฟรีๆมาใช้ ซึ่งส่วนมากก็จะเจอแต่จะมีปัญหาที่ว่าเจอแต่อันเดิมๆอยากได้ variation ของเสียงที่เจอจะยาก เพราะถ้าเจออีกอันก็เป็นคนละโทนไปเลย อันนี้เป็นข้อได้เปรียบของการจ้างฝ่าย sound effect โดยเฉพาะมากกว่าหาเองด้วย เพราะเราสามารถขอ variation ของเสียงอะไรในเกมก็ได้ ที่เจอบ่อยๆก็เช่น เสียงตีแล้วโดนกับเสียงตีแล้ว bounce ของอาวุธชนิดเดียวกัน มันจะต้องมีความเกี่ยวข้องกันบ้าง หรือเสียงสัตว์ประหลาดร้องแบบจะฆ่าเรากับแบบเจ็บ ถ้าทำมาจาก source เดียวกันมันก็จะรู้สึกว่าเป็นตัวเดียวกันกว่า แบบนี้ search เอาจะโอกาสน้อยที่เจอ 2 อันที่อยู่ด้วยกันได้ต้องพึ่งดวงว่าเสียงจะเข้ากับโทนของเกมเราเสียง environment ต่างๆหาเจอแต่ไม่ตรงเป๊ะๆ เช่นอยากได้เสียงเมืองแต่ที่หาเจอรถเยอะไป แต่ขณะเดียวกันถ้าเซิจว่าแค่ town ก็ไม่รู้จะได้รถมั้ย ถ้า town no car ก็ไม่มีใครอัพให้เป็นชื่อแบบนั้นเสียงไม่รู้ว่าจะเซิจเป็นภาษาอังกฤษว่าอะไรก็จะหาไม่ได้ เช่นอยากได้ “หวึ่ง” หรืออยากได้เสียง “อาวุธ blunt โจมตีใส่สัตว์ประหลาดที่ดูมีเลือดเนื้อหน่อยตีดังแผละ” หรืออยากได้ “เสียงตีติด critical ดัง ตะชิ้ง”ปัญหาเหล่านี้แก้ได้โดยไปทำ field recording เองเลยจะดีกว่า แล้วค่อยมาทำ sound design อันนี้เป็นแบบ noobๆ สไตล์วิศวะคอม/โปรแกรมเมอร์ ผมไม่รู้หรอกว่าคนเรียนเฉพาะทางมาเขาต้องทำไงField recording ใช้อะไรอัดดีใช้มือถือนั่นแหละ ในมือถือหลายๆคนคงมีฟังก์ชั่น Voice Memo ที่ไม่เคยกดใช้เลย มันเกิดมาเพื่อสิ่งนี้แหละครับ! ไม่ต้องไปฟังสัมมนาพารวยอะไรเลยก็ได้ถ้ามีเครื่องอัดเสียงโดยเฉพาะก็อีกเรื่องนึงแต่ส่วนมากเวลาเจออะไรน่าสนใจไม่ได้ถือเครื่องที่ว่าไว้หรอก (จริงๆจะตัดสินใจไม่เอามาตั้งแต่แรกแล้ว เช่นไปทริป ก็จะคิดว่าเออ ไม่มีอะไรให้อัดหรอก ไม่ต้องใส่กระเป๋าไปละกัน)เรื่องคุณภาพเสียงไม่ต้องห่วง มือถือมันดีกว่าที่คิด แล้วก็คุณภาพมันค่อนข้าง subjective บางทีเสียงคุณภาพแย่ทางเทคนิค ก็ไม่ได้แย่ตอนใช้จริงทาง artistic เช่นอย่างสตาร์วอร์สก็ยังใช้เสียงหวู่มเดิมมาตั้งแต่ยุคแรก อย่างดราก้อนบอลใช้เสียงชู้ยยิ้วมาตั้งแต่ยุคแรก ก็ไม่เห็นเป็นไรระวังลมสิ่งแรกที่อาจจะมองข้ามคือลม ไมค์ต่างกับหูเราตรงที่หูเรากันลมโดยธรรมชาติ (มันวนเข้าไปเป็นก้นหอย) แต่ไมค์มันโดนลมแล้วเยื่อมันจะกระแทกรัวๆ ถ้ามาฟังก็จะเป็นย่านต่ำระเบิดจนใช้ไม่ได้เลย ถ้าอัดเสียงสูงอยู่อย่างคลื่นชายหาดอาจจะตัดออกไม่ยาก แต่เอาให้ไม่ต้องตัดเลยดีกว่าถ้าอัดเสียงทะเลอาจจะวางไมค์ไว้หลังโขดหิน ถ้าไม่มีอะไรบังลมอาจจะเอาเสื้อตัวเองมาคลุมบังลมไว้เป็นต้น จริงๆเขาต้องมี windshield เป็นฟองน้ำสีดำมาคลุมสำหรับไมค์จริงๆ แต่มือถืออาจจะลำบากหน่อยรู้ว่าไมค์อยู่ตรงไหนถ้าใช้มือถือควรจะรู้ว่าไมค์อยู่ไหน ไม่งั้นอาจจะเป็นแบบนี้ ผมอัดเสียงตัวเองเดิน ก็เลยคิดจะถือมือถือแล้วเดินไปด้วยจะได้ได้เสียงตลอดระยะเดิน ถือแบบยื่นออกมาข้างหน้าตรงๆแล้วลงล่างหน่อย (ก็คือยื่นไว้ตรงหำ) แต่เสียงออกมามีแต่ข้างขวาเพราะลืมไปว่าไมค์มันไม่ได้อยู่ตรงกลางของเครื่องถ้าโดนแบบนี้ไปแล้วก็เอามาแปลงเป็น Mono ก็ได้ แต่ถ้าได้แบบ Stereo แล้วกลางๆแต่แรกน่าจะดีกว่าอัดเสียงแนว Foleyในการผลิตหนัง Foley คือการตั้งใจทำเสียงสังเคราะห์ขึ้นมาเพื่อเอาไปทับภาพเคลื่อนไหว ให้เหมือนว่าเสียงอัดมาจากที่จริงด้วยกัน อันนี้คือไม่ได้ออกไปไหนแต่อัดในห้องเงียบๆ แล้วพยายามเอาสิ่งของต่างๆมาทำให้เกิดเสียงที่เราต้องการ เช่น ผมเคยเอากล่องดินสอมาเทดินสอออก แล้วก็ได้เป็นเสียง equip ของใส่ตัวละครได้ หรือการทุบผักกาดแช่แข็งให้เป็นเสียงตีหัวกระดูกหักได้เป็นต้น แบบนี้ถ้ามีไมค์ condenser โดยเฉพาะก็ดี (ใครจะซื้อ ราคาประมาณ 3000–10000 บาท) เพราะมัน sensitive แต่เราคุม noise อื่นๆที่อาจจะเข้าไปไว้หมดแล้ว ที่เข้าไปก็มีแต่ที่จะเอาจริงๆการหาที่เงียบอัดเสียง Foleyเอาง่ายๆก็หาห้องส่วนตัวที่ปิดหน้าต่าง ปิดแอร์ (เปิดไว้ให้เย็นก่อนค่อยปิด)ถ้าไม่ได้อยู่บ้านแล้วต้องรีบสร้างเสียงด่วน ที่ๆนึงที่ดีมากที่ผมค้นพบสมัยทำงานที่ บ. Extend Interactive คือบันไดหนีไฟ ไม่ว่าตึกไหนก็มี เราสามารถอยู่คนเดียวโดยมีเสียงรบกวนน้อยมากได้ทันที แต่ก็ไม่ได้น้อยขนาดนั้นส่วนมากจะมีเสียงก่อสร้างความถี่ต่ำรบกวน (เสียงความถี่ยิ่งต่ำ = ความยาวคลื่นสูง = ทะลุกำแพงได้ดี) การอัดเสียงในบันไดหนีไฟต้องทำใจอย่างนึงคือจะได้ reverb มาด้วย ถ้าเป็นเสียงแนวๆนั้นอยู่แล้วเช่นเหล็กกระทบกัน ก็โอเคเลยอีกที่นึงคือห้องน้ำ แต่ผมว่าไม่เงียบเท่าบันไดหนีไฟ แล้วก็จะรู้สึกเขินว่าจะมีใครฟังเราอยู่นอกห้องน้ำมั้ย ขณะที่บันไดหนีไฟค่อนข้างชัวร์ว่าไม่น่าจะมีใครผ่านมา (คิดดูว่าตอนนั้นผมทำเสียงตัวประหลาดเป็นเสียงแอ๊วๆ แบบพูดเอาเอง ถ้าเป็นห้องน้ำแล้วคนผ่านมาได้ยินเขาจะคิดว่ายังไง)Stereo หรือ Monoผมชอบปล่อยไว้เป็น Stereo แล้วค่อยไป Mono ทีหลังถ้าอยากจะใช้แบบนั้น บางเสียงที่ Stereo แล้วฟินเช่นเสียงเดินที่มันแกร๊บหูซ้ายกับขวาไม่พร้อมกัน แต่เสียงแบบเสียงฟันดาบคิดว่า Mono น่าจะฟังดูดีกว่าถ้ากำจัดเสียงที่ไม่ต้องการระหว่างอัดไม่ได้ ให้คิดว่า EQ ออกได้มั้ยการ EQ คือตัดความถี่ที่ไม่ต้องการออกไป ต้องคิดว่าเสียงที่จะเอามันจะหายด้วยมั้ยสมมติผมไปอัดเสียงคลื่นริมทะเลมาแต่แถวๆนั้นมีเสียงรถที่วิ่งไปมาอยู่ไกลๆ อันนี้ได้เพราะเสียงรถอยู่ย่านต่ำแต่คลื่นทะเลค่อนข้างสูง ตัดต่ำออกไปทะเลก็ไม่ค่อยหายสมมติผมจะอัดเสียงสตาร์ทรถแต่ดันเป็นตอนกลางคืน มีจั๊กจั่นร้องงี้ดๆตลอดเวลา แบบนี้ก็ได้เพราะว่าจั๊กจั่นอยู่สูงมากแล้วไม่ทับมาย่านต่ำเลยถ้าอัดเสียงทะเลแล้วเป็นกลางคืนมีจั๊กจั่นด้วยแบบนี้ไม่ได้ จะได้ทั้งสองอย่างมาแทน ทำให้เอาไปใส่ฉากทะเลกลางวันไม่ได้ ถ้าเป็นไปได้ควรจะแยกเป็นสองอันให้ได้จากประสบการณ์ส่วนตัว ส่วนมากเสียงต่ำๆจะตัดสูงแล้วฟังไม่โอเคเพราะมันมีย่านสูงที่ทำให้เสียงต่ำดูมีเอกลักษณ์ปนอยู่เยอะ แต่เสียงสูงๆตัดต่ำแล้วจะยังฟังใช้ได้ในภาพนี้เป็นเสียงป่ากับนก ก่อนตัดย่านต่ำมีเสียงแถวๆนั้นเยอะพอสมควร (ดู EQ อันซ้าย) แต่ไม่เกี่ยวกับป่าและนกเท่าไหร่เลยเอาออกได้เลย แล้วก็แนะนำให้ใช้ EQ ที่ slope มันไกลๆหน่อยจะฟังดูฟินกว่าอย่าลืมว่า EQ มีโหมด LR กับ Mid/Sideถ้าอัดมาเป็น Stereo บางทีถึงย่านทับกันแต่ถ้าโชคดีอันที่ไม่ต้องการมันอยู่แค่หูซ้าย หรือออกแค่ข้างๆ ก็สามารถ EQ ออกโดยกระทบน้อยลงได้ เคยไปอัดเสียงอะไรซักอย่างทีนึง แล้วพอมาฟังมันมีเสียงกวนมาตลอดแต่มันแพลมออกข้างเสมอ ผมก็ไป EQ ออกแค่ Side ได้ไม่กระทบ Midเสียง Night Sea ที่เห็นนี้ตัดย่านต่ำออกแค่ Side ผมไม่รู้เหมือนกันว่าทำไมเสียงกวนมันอยู่แค่ออกข้างแต่ก็ดีเหมือนกัน แล้วก็ตัดความ stereo ออกด้วยนิดนึงอยากได้เสียงแบบตามที่ได้ยิน ก็ต้องให้ไมค์อยู่เหมือนตรงที่หูอยู่บางทีก็ลืมคิด เออ อยากได้เสียงนี้แฮะ แต่ตอนอัดดันเอาไมค์ไปจ่อ เอามาฟังทีหลังไม่ค่อยเหมือนที่อยากได้ เพราะไมค์มันไม่ได้อยู่ตรงหูเหมือนที่ได้ยินระวังเสียงหายใจตอนอัดเสียงนี่ระวังมากตัวอย่างนิ่ง ขาไม่กระดิก แอร์ก็ปิดแล้ว เสียงข้างนอกก็ไม่มีอะไร แต่ลืมไปว่าหายใจอยู่ (ปกติไม่ได้ตั้งใจหายใจ ก็เลยลืมไป) มาฟังอีกทีนี้ซี้ดซี้ดเลย กลายเป็นใช้ไม่ได้หรือไม่ก็ตัดตรงที่หายใจไม่โดนออกมาได้แค่นิดเดียว เทคนิคส่วนตัวคือใช้ปากหายใจช่วยได้ อ้าปากไว้กว้างๆแล้วไม่ต้องหุบ มันจะไม่เกิดเสียงซี้ดที่เกิดจากอากาศผ่านจมูกที่แคบกว่าตัดเสียงรบกวนด้วย Gateสมมติถ้าใช้ EQ แล้วเอาเสียงปัญหาออกไม่ได้มาลองใช้ Gate แทน เอฟเฟคนี้ก็คือ ถ้าเสียงต่ำกว่า threshold เมื่อไหร่ให้ตัดเหลือ 0 หรือค่าที่น้อยกว่าได้เลย ซึ่งไม่ได้ตัดฉับเลยก็ได้แต่ให้ตัดเป็น slope ลงไป ด้วยการตั้งค่า releaseเอาไว้ใช้กับไมค์ประกาศข่าวไรงี้ก็ได้ สมมติเวลาไม่ได้พูดแต่ไม่ได้ปิดไมค์ไว้จะได้ไม่มีเสียงเล็กน้อยเล็ดรอดออกไป หรือใครเคยไปเล่นรถบั้มแล้วตอนคนมันพูดแล้วเพลงหาย นั่นก็ประมาณว่าใช้ Gate ตัดเพลง แต่ sidechain สัญญาณจากไมค์พูดมาเป็นตัวกำหนดว่าเกิน threshold เมื่อไหร่แทนที่จะใช้เสียงเพลงเป็นตัว Gate ตัวเองวิธีใช้ ใช้ได้ดีกับเสียงที่ไม่ต่อเนื่องเช่นเสียงเดิน ผมไปเดินที่สะพานไม้นึงที่ชอบเสียงมาแต่สะพานที่ว่านี้อยู่กลางป่าชายเลนที่มีเสียงนกมากมาย เนื่องจากเสียงเดินเป็นครั้งๆผมสามารถใช้ Gate ตัดเสียงที่ไม่อยากได้ที่อยู่ระหว่างก้าวออกไปได้ถ้าเซ็ต threshold ดีๆ จะเห็นตรงลูกศรสีแดงที่ชี้ไว้ ตรงคลื่นเทาๆนั้นที่เห็นคือเสียงที่โดน Gate เล็มออกไปให้ ทีนี้ก็จะเหลือแต่เสียงนกที่ร้องพอดีกับก้าวเดิน ซึ่งอาจจะเนียนจนฟังไม่ออกแล้วว่าเป็นเสียงรบกวนปิดแอร์แอร์นี่มันจะเพิ่ม noise ให้ทั้งย่านสูงที่ลมออกมา แล้วก็ย่านต่ำที่เครื่องข้างในแอร์ทำงานด้วย ต้องระวังระวังเสียงห่างไกลที่ไม่เคยได้ยินตอนอัดเสียงมีอย่างนึงที่ทำให้เรารู้ คือเราไม่เคยได้ยินเสียงอะไรเลยจนกระทั่งอยากได้แค่เสียงเดียวจริงๆ เช่น ตอนผมจะอัดเงียบๆในห้องผมก็เริ่มได้ยินเสียงก่อสร้างมาจากไกลๆทั้งๆที่ก่อนหน้านี้ไม่เคยรู้สึก หรือไปอัดเสียงนกในเขา พอเริ่มอัดเท่านั้นแหละเราก็เลยเริ่มได้ยินเสียงมอไซค์แว้นดังลอยมาจากเขาอีกลูกนึง วิธีแก้คือให้สังเกตุว่าเสียงเหล่านี้มีนิสัยเป็นยังไง มันหายบ้างมาบ้างมั้ย แล้วเลือกอัดตรงช่องโหว่ที่มีตั้งชื่อไฟล์ทันทีที่อัดเสร็จการที่ต้องไล่ฟังเสียงแล้วมาระลึกชาติว่าตอนนั้นตั้งใจจะอัดอะไรกันแน่มันนรกกว่าที่คิดมาก ทางที่ดีแนะนำให้ตั้งชื่อเลย ส่วนมากเครื่องอัดจะสามารถทำได้เสียงไหนที่เกิดจากตัวเราเอง ลองทำสิ่งนั้นให้ช้าลงถ้าอัดเสียงธรรมชาติก็คุมอะไรไม่ได้ แต่สมมติจะโยกเก้าอี้ให้เป็นเสียงหุ่นยนต์ขยับ หรือจะเปิดประตูให้มันดังเอี๊ยด เอามีดมาลูบกันให้เป็นเสียงเสียดสี ฯลฯ แบบนี้เราสามารถลองทำสิ่งที่ว่าเร็ว-ช้า ดูเพื่อให้เกิดเสียงใหม่ๆไม่จำกัดได้เสียงที่เหมือนใช้ไม่ได้อาจจะมีประโยชน์กับบาง Effectเสียงไหนฟังดูไร้ค่าแนะนำให้จินตนาการ ว่าถ้าเอาใส่เอฟเฟคที่เปลี่ยนเนื้อเสียงเยอะๆแล้วมันน่าจะออกมาเป็นยังไง เอฟเฟคที่ว่าเช่น Overdrive, Amp, Waveshaper, Vocoder, Bitcrusher ที่ทำให้ได้เสียงที่ไม่เหมือนต้นฉบับเลย อาจจะกลายเป็นใช้ได้ก็ได้สุดท้าย เสียงที่อัดทั้งหมดว่าจะทำหน้าแจกไว้เป็นหน้านี้ ตอนนี้ยังมีอะไรไม่มากแต่ถ้าว่างๆคงจะอัพที่อัดมาขึ้นเรื่อยๆ เอาไปใช้ได้เลยครับhttp://5argon.info/recordings"
