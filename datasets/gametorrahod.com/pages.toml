title = "วิจัยเปรียบเทียบ Encoding Quality (CRF) ของ H.264"
description = "มีงานวิจัยเล็กๆมาให้ดูอีก เวลา Encode H.264 นี่มันปรับคุณภาพได้ที่ค่า CRF ซึ่งเลขมากแล้วจะกากลงแต่ขนาดก็เล็กลงด้วย…"
full_description = "Technology วิจัยเปรียบเทียบ Encoding Quality (CRF) ของ H.264 มีงานวิจัยเล็กๆมาให้ดูอีก เวลา Encode H.264 นี่มันปรับคุณภาพได้ที่ค่า CRF ซึ่งเลขมากแล้วจะกากลงแต่ขนาดก็เล็กลงด้วย… 5argon / Sirawat Pitaksarit May 24, 2018 • 1 min read มีงานวิจัยเล็กๆมาให้ดูอีก เวลา Encode H.264 นี่มันปรับคุณภาพได้ที่ค่า CRF ซึ่งเลขมากแล้วจะกากลงแต่ขนาดก็เล็กลงด้วย ก็เลยทดลองทำวิดิโอเล็กๆที่ยืดกลับมาเป็นใหญ่ๆที่คุณภาพต่างกันมาเทียบกันไว้ให้ดูว่าควรเลือกประมาณระดับไหน (จริงๆจดไว้กลับมาดูเองนี่แหละ) ขนาดกว้าง 2000 วิดิโอนี้ยาว 1:47 นาที (ไม่มีเสียง) อันสุดท้ายนี่ย่อได้เล็กลงไม่ถึง 1MB เลยทีเดียว ลองคลิกลูกศรเทียบๆกันดูส่วน preset นี่มีผลกับเวลาที่ใช้เอ็นโค้ด ยิ่งช้ายิ่งไฟล์เล็ก อันนี้เลือกแบบใช้เวลานานมากๆที่สุดไฟล์เล็กที่สุดแล้ว (จริงมีมากกว่านี้อีกคือ placebo แต่ที่ลองบางอันขนาดดันใหญ่กว่า veryslow — -)จริงๆขึ้นกับวิดิโอด้วย ถ้าวิดิโอธรรมชาติ ส่วนมากคุณภาพต่ำก็ดูไม่แตกต่างเท่าวิดิโอที่สีออกภาพวาด ลดขนาดได้มากกว่าterminal ข้างล่างเป็นขนาดไฟล์และแถมอีกนิดคือ การ Encode H.264 จะเห็นว่ามีปรับ Compatibility Level ได้ด้วย แต่หารู้ไม่ว่าระดับ Baseline ขนาดจะใหญ่กว่าระดับอื่นน่ะครับ มาบอกแค่นี้แหละลองเอ็นโค้ดเทียบกันเล่นๆ 555"
