title = "Introduction to การทำเสียง Sound Effect"
description = "บทความนี้ไม่ลงลึกว่าทำยังไง แต่เอาให้ดูคร่าวๆว่าบรรยากาศตอนทำต้องคิดอะไรยังไงบ้างนะครับ (เผื่อทำงานกับฝ่ายเสียง เราโปรแกรมเมอร์งี้…)"
full_description = "Art / Audio Introduction to การทำเสียง Sound Effect บทความนี้ไม่ลงลึกว่าทำยังไง แต่เอาให้ดูคร่าวๆว่าบรรยากาศตอนทำต้องคิดอะไรยังไงบ้างนะครับ (เผื่อทำงานกับฝ่ายเสียง เราโปรแกรมเมอร์งี้…) 5argon / Sirawat Pitaksarit Mar 29, 2018 • 1 min read ไม่ใช่ข้าวสวยแต่เป็นเค้กมะพร้าว อร่อยมากแต่ไม่เกี่ยวกับบทความบทความนี้ไม่ลงลึกว่าทำยังไง แต่เอาให้ดูคร่าวๆว่าบรรยากาศตอนทำต้องคิดอะไรยังไงบ้างนะครับ (เผื่อทำงานกับฝ่ายเสียง เราโปรแกรมเมอร์งี้ จะได้พอเข้าใจเขาได้มากขึ้นอีกนิด) เพิ่งเคยรับงานทำ SFX แบบเต็มเกม ไม่คิดว่าจะปวดหัวขนาดนี้ แบบ ใส่เอฟเฟคจนหมดมุขแล้วเสียงที่ต้องทำก็ยังไม่หมดซักที 555 ออกมาจากร้านกาแฟแล้วเดินไม่ตรงเลยแล้วตอนแรกนึกว่าจะเร็วง่าย ez นะ (เทียบกับแต่งเพลง ตอนแรกมันรู้สึกว่า ก็แค่เสียงเล็กๆ) พอเอาจริงๆบางเสียงสั้นๆ 1 ชม. ถึงเสร็จก็มี (มีเสียงนึงเป็นเสียง sequence ตอนกดกาชา มันน่าจะสำคัญมากเลยทำไปหลาย ชม. เลย) วันนึงทำได้แค่ไม่กี่อัน เอาไปเอามาแต่งเพลงวันนึงยังดูได้เยอะกว่า พอเทียบกับไฟล์เสียงขนาดรวมไม่ถึง MB ที่ออกมาได้ในวันนึง..ที่ปวดหัวเพราะหลังๆจะเริ่มคิดไม่ออกว่าเช่นถ้าเสียง impact จะ ขิ เขาะ ขุ ดิ ถ้าเสียงเวทๆจะ ววม วาม วอม เลือกเนื้อเสียงแล้วก็คิดว่าจะมีกี่จังหวะดี จะเป็น จะขิ หรือ จุขิ หรือขิจุ ดี หรือ จะเป็น ขิแฉะ ดี ถ้าเป็นโน้ต ก็ไม่รู้จะเอาอารมณ์ major หรือ minor ดี เลือกได้แล้วเอาโน้ตตัวกลางออกดีมั้ย หรือจะ arp ดี ถ้า arp แล้วห่างเท่าๆกันดีมั้ย หรือให้ ตึ ตึ แต๊! สุดท้ายแต๊ห่างๆหน่อยดี แล้วเอฟเฟคไหนดี จะ amp หรือ pedal จะ overdrive หรือ saturator จะ echo หรือ reverb 555ใครอยากเห็นหน้าตา workflow ตอนทำเสียงมันเป็นประมาณนี้นะครับคือก่อนอื่นเราต้องมี reference video ก่อน (เซ็นเซอร์ไว้นะครับเกมยังไม่เปิดเผย) แล้วเอาเสียงที่ออกแบบมาวางเทียบดู เสียงที่สร้างก็หลักๆเลือกมาจาก 2 ประเภทคือจะใช้ sample หรือจะใช้ synth ดี (หรือปนกัน)ที่เห็นเป็นคลื่นคือ sample เป็นไฟล์เสียงที่มีอยู่แล้ว แต่ใช้จะๆเลยไม่ได้ เช่น มีเสียงโรงเลื่อยไม้ แบบเอาไมค์ไปวางไว้ในนั้นจริงๆไม่ใช่แบบ เลื่อยทีเดียว ในห้องเก็บเสียงเงียบๆ แล้วเสียงก็ยาวเป็น 20 วิ เราก็พยายามฟังแล้วเอาส่วนที่คิดว่าจะกลายเป็นที่เราอยากได้มาใช้ โดยพยายามมองข้ามเนื้อเสียง (timbre) ก่อนครับเพราะแต่งทีหลังได้ เอาลักษณะนิสัยของเสียงไว้ก่อน (envelope, ADSR) ซึ่งเอามาหั่นฝอยแล้วพยายามใส่เฟดอะไรงี้ก็ได้ถ้ามันไม่ใช่อย่างที่คิด เช่น เสียงไดรเป่าผม แฮ~~~ ยาวๆงี้ ถ้าเราตัดเหลือนิดเดียวแล้วใส่ fade out สั้นๆเข้าไป มันก็จะกลายเป็นเสียงเหมือนแฉได้ครับ เพราะเป็นโทน noise เหมือนกัน ในภาพ จะเห็นว่าแต่ละ audio clip มี curve อยู่หัวท้ายหมด คือจริงๆเสียงพวกนี้มันหั่นมาจากเสียงยาวมากๆครับแต่เอามาตัดแต่งใหม่ถ้าใครจำได้ที่ผมเคยแนะนำ GDC Audio 20GB คือเสียงแบบนี้เอามาจากนั้นแหละ เป็นวัตถุดิบตั้งต้นให้เราได้ แต่ส่วนมากจะฟังดูเหมือนใช้ไม่ได้ถ้าไม่ EQ ดีๆก่อน (ส่วนมากเบสบวมมากเพราะมาจากโลกจริง เสียงครึกโครมเยอะ)[FREE DOWNLOAD] - The #GameAudioGDC Bundle Part 2: 16GB+ of High-Quality #GameAudioThe #GameAudioGDC Bundle - Part 2 - In celebration of GDC16 we have something special for you all... 16GB+ of…www.sonniss.com[FREE DOWNLOAD] - (20GB+) - The #GameAudioGDC Bundle - (Part 3) - 2017The #GameAudioGDC Bundle (Part 3) In celebration of #GDC2017 we are giving away 20GB+ of high-quality sound effects…www.sonniss.comถ้าเป็นแผนก foley ของภาพยนตร์ ก็คงต้องไปเก็บเสียง sample เองด้วยหรือจะมีห้องนรกไว้เสกเสียงเองก็ได้ (แบบ ในห้องมีแตงโม ผักกาด กับไม้ไว้ทุบมัน หรือมีถาดใส่ทรายไว้ให้ลงไปเดินย่ำอะไรงี้ครับแล้วไมค์ก็จ่อเอาเสียง) จะได้ได้ตามที่อยากได้จริงๆเลย แต่เราเบื้องต้นอยู่ พึ่ง sample กับดวงไปก่อนก็ได้ครับแล้วหวังว่ามันจะมีเสียงที่ใส่เอฟเฟคแล้วเข้ากันกับเกมเราที่เห็นเป็นแท่งแบบแทรค FieldSkill สีฟ้าอ่อนที่เลือกไว้ก็คือจะใช้เป็น synth แท่งที่เห็นคือตัวโน้ตครับไ่ม่มีเสียง แล้วเดี๋ยว synth ตัวนี้จะตีความออกมาเป็นเสียง มีประโยชน์เวลาอยากเสกเสียงที่คิดไว้ในหัวแล้ว จะได้ไม่ต้องคุ้ย sample ว่าอันไหนจะดัดได้ เอาได้เลย เหมาะกับพวกเวทย์หรือเสียง UI เพราะคงจะหาเสียงจากโลกจริงที่เป็นแบบนั้นยาก ที่เห็น 3 แท่งแสดงว่าเป็นคอร์ดsynth ก็มีหลายประเภท เช่นเป็น frequency modulation, เป็น amplitude modulation เป็นเลียนแบบวงจร analog synth หรือเป็น wavetable หรือแม้แต่ physical modeling เลยก็มี (เช่น synth นึงชื่อ collision ก็คือไม่ได้เลือกคลื่น แต่ให้เลือกไม้ เลือกวัตถุ เลือกความแข็ง เลือกตำแหน่งฟัง ฯลฯ แล้วพอมันรับโน้ตปุ้ม มันก็จะเอาไปให้ไม้ตีแบบจำลองๆ) อย่าง Wavetable ที่เห็นอยู่ล่างสุดตอนนี้ เป็น synth ประเภท wavetable ครับ ก็คือรับโน้ตมาแล้วเล่นคลื่น (เส้นสีเหลือง) ที่เลือกมาจาก table (เส้นสีเทาทั้งหมด) ถ้า FM, AM ก็จะไม่ใช้หลักการนี้เป็นรสชาติอื่นเสร็จแล้ว ก็เอาทั้งสองแบบนี้มาใส่เอฟเฟคต่างๆให้พอใจแล้ววางเรียงเบี้ยวๆแบบที่พอใจแล้วลองกด play ดู ถ้าวิดิโอพรีวิวมันดูเข้ากับเสียง ก็ไปขั้นสุดท้ายคือ mix ให้ดี แล้วก็พยายาม maximize ไปที่ 0dB ด้วยพวก compressor/limiter เราไม่ควรจะคิดว่าเสียงนี้ควรดังเบาเท่าไหร่ในขั้นนี้ เราควรทำให้ดังที่สุดโดยไม่ clipping เพื่อให้ไป mix ในเกมให้เบาลงเท่าไหร่ก็ได้ครับจะได้ flexible ที่สุด (แต่ก็ต้องคุยกับคนในทีมดีๆทีหลัง ว่าเสียงนี้จริงๆต้องเบามากๆนะแต่ max เสียงไว้)โปรแกรมในภาพชื่อ Ableton Live นะครับ แต่จริงๆจะใช้โปรแกรม DAW ตัวไหนก็ได้หมดแหละ เช่น FL Studio, Reason, Reaper, Bitwig, Cubase, Studio One, Logic Pro, Protools เป็นต้นMusic production with Live and Push | AbletonAbleton makes Push and Live, hardware and software for music production, creation and performance. Ableton´s products…ableton.com"
