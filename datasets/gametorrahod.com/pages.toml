["https://gametorrahod.com/visual-studio-code-vs-rider-unity"]
title = "Visual Studio Code vs Rider for Unity"
description = "Visual Studio Code is almost perfect, very very few annoyances. But in this competitive scene of text editor, it is tempting to pay just to eliminate those annoyances from the tool I touch every day."
full_description = '''Unity Visual Studio Code vs Rider for Unity Visual Studio Code is almost perfect, very very few annoyances. But in this competitive scene of text editor, it is tempting to pay just to eliminate those annoyances from the tool I touch every day. 5argon / Sirawat Pitaksarit Dec 15, 2019 • 34 min read I switched from Atom to VSCode years ago simply because I like blocky and flat UI, but soon I discovered that VSCode has just the right amount of features yet well tucked away from view. But what leads me to evaluate Rider now?Visual Studio Code is almost perfect, very very few annoyances. But in this competitive scene of text editor, it is tempting to pay just to eliminate those annoyances from the tool I touch every day. (Of course, after knowing several years passed with no resolution about them.)Rider is not even famous for these annoyances fix I would like to pay for. It is famous for its "intelligence" as an IDE or deep Unity integration, that I am not really care at the moment. I just want a beefed up text editor like VSCode but without little flaws. Let's see if Rider can fix them. And how to modify Rider so it looks more like VSCode, so I could get both bug fixes and simple looks.What better or worse things in Rider compared to VSCode.How to make Rider more like VSCode for those who liked VSCode, but just want that one bug fixed or that feature added now without waiting for submitted issue to be resolved in VSCode.I will go as far as very little polishes, since fundamentally all modern code editor could do the same job. It's these details that make a difference.Rider version evaluated is 2019.3.Fallback perpetual licenseThe first thing you may think as soon as you notice that the business model is a subscription based in their website : "I don't want to subscribe to a mere text editor!!" Well text editor is our tool of the trade and is hard to perfect so you may need to reconsider its worth.Anyways, I would be fine with one-off payment. I was put off by the subscription model because of insecurity of having to pay indefinitely.Until I see that they offer this. Basically, when you stop your 1 year subscription you simply stop receiving updates and can continue using your version back when you first started. Also you can extend for a few months if you would like to stretch the coverage to get new features that match your use case then you could stop there.Unlike Adobe for example which they will prevent you from using the tools completely. This is very nice and made me change my mind about purchasing Rider. Yes, it feels more like purchasing this way and I may even continue the subscription because they are generous. More information here.VSCodeVim vs IdeaVimI rely on Vim key bindings daily, and VSCodeVim has lingering problems that was unfixed for multiple years :gd to jump to definition usually works fine, but the reverse Control + O often return back to wrong place or throw dialog box error.The plugin doesn't count code refactor as an undo step, when you do something next to a refactor and undo, you undo that step plus the whole refactor.Code snippets with variable transformation doesn't work when this plugin is on.Macro recording qq playback "too literally" and sometimes missing some movement commands causing my plan to fail. Also it is quite slow, if the command is long then I can see it doing things as I wait for it to complete.I evaluate IdeaVim for a bit, it seems to not have any of mentioned problem. But instead : == or =i( to format code in IdeaVim doesn't work, while it works in VSCodeVim.gc for commenting in visual mode is not implemented, but it is in VSCodeVim. I have to resort to Cmd+/ normal shortcut.There is always something missing in any Vim emulation!I understand that I should not feel entitled to have a bug-free VSCodeVim where it is an open source project with tons of open issues on GitHub. If I am not willing to contribute, then I have no right to demand things from them. However it is also true that I don't have time to study how to contribute, and IdeaVim is a company maintained solution that I could spend money on instead of time. I guess this is where money could motivate you and result in a more polished product.IdeaVim is fast!Maybe this alone worth the price. As in, in VSCode when you turn off VSCodeVim even simple line movement command is slower than you press down arrow with plugin off. It is apparent in a command that jumps over distance like Shift + ].It feels like VSCodeVim went through "something" before it could move. Maybe you won't feel it, but I am a music gamer and a game developer. I can tell responsiveness difference. Using real Vim like the one in Terminal or MacVim, the feel of responsiveness is very similar to Rider, but not to VSCodeVim.(I am not saying Rider is faster than VSCode, that is impossible since Rider is more of an IDE. But if only the IdeaVim part, then it is faster. And it worth noting here that this text editing is the core part of programming experience, not start up time.)Omnisharp vs ReSharperOmnisharp works fine most of the time, including project-wide variable rename that's important to my workflow so I can name my variable mindlessly when drafting up quick code.In a very complicated case however it fails. For example, this variable in a lambda-in-a-method doesn't auto complete, where it does in a simpler lambda. This pattern is important in Unity's ECS library.ReSharper is well, sharper...Also I should mention ReSharper start up faster than Omnisharp. VSCode has reputation of being very fast, but that's not counting the time until your C# project truly come alive. In Rider, starting up the program itself is quite slow. But it is fully usable soon after. In the end I think total time is about the same.Code completion dialog sizeFrom the earlier screenshot, one thing VSCode get a win from me is the super compact code completion dialog. Rider one is way too wide and line height is too big. And there is no way to change this. You can drag the right edge to narrow it, but when it appears again it expands to the longest entry that maybe deep below and you are not likely to access it. In Unity ECS, the verbosity cause this dialog to get unwieldly almost always.And I really hate it when it go upwards, erasing all my context that I am thinking with. This is because the height is too high. If I could set it to about 4-5 entries then it could have fit below just fine.Here's from VSCode. Small and cute. There is no need to show the whole thing. ... is fine 95% of the time. The documentation balloon is equally compact.Meahwhile look at this Rider documentation balloon. It's huge! And it can also appear if you linger around the code completion box for 1 second, adding up to the clutter. I ended up turn it off because it was too obtrusive and always decided to go upwards.And it is hell with ForEach lambda that contains million of permutations of valid lambdas, basically you take a lag punishment for waiting more than 1 second inside a lambda, that I have to turn it off. Then when I am using a normal method I have to go to definition to see the signature... damn.Code completion performanceRider is slow on completion! The VSCode one feels like "just" a string replace. However in Rider you can type ahead of the result and the keystoke can catch up later. It must be because of reformatting stuff and other intelligence. I think I can live with this, but VSCode is more snappy when choosing a code completion. (Also with template/snippet)This offset with faster Vim performance in Rider however. Moving around the cursor is faster in Rider.The look can be matched, somewhatI like VSCode's minimal and blocky look. Some don't like full blown IDE like Rider not because it has heavy startup time, but it looks heavy. You know that feeling when you open Android Studio. You feel tired even before you start working.Startup time asides (I don't really care), I could strip off bloated look from Rider until it looks empty just like VSCode. The most important point is one level of top bar. Then one level of bottom bar. And then eliminate the surrounding side bar of features (with rotated text like "Project", "Ve.. that's so distracting) that make you feels like you are coding in a box. You go to View > Appearance to do this. Anti aliasing off on fonts make me alert, it is possible in Rider too in the preferences.TargetBeforeAfterWith side bar off. Just top and bottom border now.Editor themeRainglow theme is also available on Rider. I like changing themes depending on mood rather than trying to "master" a theme, so that's perfect. But there is one thing I like in VSCode, the theme extends to the side bar and not just the editor area. For example this more brown theme, the Rider dark that was fine in the screenshot earlier now looks weird because there are now 2 kind of different temperature of dark. But I hide the sidebar when not used anyways.Taming rulesRider came with rules built-in and my code are all moaning. Luckily I can tame them by clicking the light bulb and select what I want instead of digging preferences.I do think they are too much sometimes, such as the var naming rules. They offer a rule about do/don't use var for simple type, or do/don't use var for when it is "evident". But in real code it is more complicated than that. When I use ToComponentDataArray<T>, it is to my eye "evident" that the type is gonna be NativeArray<T> but of course the rule can't "see". The out var pattern is often conflicting with some rules. And finally sometimes I arbitrarily use or not using var based on how busy the surrounding. (The combined JobHandle need it for emphasis, but the handle returned from out var I don't want to type out JobHandle, etc.) I ended up turning off many of the rules.In VSCode's first few days I do have to turn something off such as code lens (I hate when my characters move around on their own) or folding, but there are more to turn off in Rider. I spent about 2-3 hours to config Rider fully.Some rules are annoying though, like float == where I used 0 as special value to trigger some logic. (I don't want to make a new bool)Code Snippet vs Live TemplatesRider's Live Template wins.. because it works with IdeaVim while VSCode Code Snippet cannot perform parameter transform while in VSCodeVim. Yeah it's all about Vim for me, can't be helped...Here is an example of snippet config file from VSCode. Each $ represent where your cursor will go on each tab. You can perform some transformation with regex on them. See more : https://code.visualstudio.com/docs/editor/userdefinedsnippetsIn Rider, I like that I can name my variable whatever I want like $type$ here. I haven't read yet how to perform variable transform. (So the type name inside <> could also become variable name but in camel case, for example.)Follow deep into the packageVSCode do not understand Unity, and when you try to follow something into the package, it ask the C# project file and found that it is a dll, and so it dig into the dll (generated from asmdef) instead of an actual package source code that is also available somewhere else.Rider is winning here, because it knows about Unity UPM packages. If you follow into EntityCommandBuffer.RemoveComponent for example :You can get into the package with Rider. This is very important in modern Unity as source code are all available. You no longer have to wonder what happen inside when you can just gd into it then out quickly with Ctrl+O. (Vim commands) It is possible to turn off all the documentation popup with this. I think it is better as popups are distracting, let the code completion box be the only one.(Though the VSCode dll version one is useful to quickly see the neighboring overloads such as which one has EntityQuery overload, though you can use the outliner in Rider too.)PeekingRed hot in Rider 2019.3, you can do this to peek the definition : VSCode could do it from long ago. Personally I like the VSCode one better because it works well with its "boundless design" by filling horizontally. Also..Matching find usages behaviourThat peeking UX is very well used in find usages. Now the part at right has a browsable list.I don't like this massive tree of usage result that Rider presents me. It's clunky, and I can't see the code immediately like in VSCode while retaining old context.VSCode later even improve by adding a more complete version of find usages, which is still better than Rider's presentation. Just a file and lines where that appears. No need to present me a tree. Luckily there is a way to match Rider to this look. First, click the cog and select Left Top.And to eliminate useless folder entries on the tree and make it simpler like VSCode, it's in this Group By menu. Uncheck things from top until it is useful for you.If you like the peek style in VSCode, move to Bottom Left again and select the bottom left corner button "Preview Usages". The VSCode one again for comparison. It is just that the code is on the opposite side.Matching file browser behaviourClick this not so descriptive "Always Select Opened File" button with down arrow so it works like VSCode. When you use Search Anything, the browser then focus on that file. I prefer this more than breadcrumb at top (which I turned off) because I could see the surrounding contexes and I could eliminate the height of top bar to just the tabs like in VSCode.That button on the left with opposite side of arrow, make it so a single click open the file like in VSCode. (The icon looks equally no so descriptive..)Rename refactoringIn VSCode it is deceptively simple, but feature complete. On pressing F2, there is a little box where if you type something else it updates the entire project such that there is no error. (If the name didn't conflict.) And it is fast!Rider is not only slower as it is more careful to update an entire web of project, and also comments, but I don't know why sometimes it gives a dialog box. (And this version is quite slow.)Sometimes the same shortcut gets me a little box instead (I want this all the time...) I guess it is when it is a local variable?Also I am not a fan of Rider's small box rename that constantly updates the same thing nearby as you type. It seems to be more impressive that way, but I like the way VSCode did that they only commit ripple changes after you press enter.Unity aware project browserSomething I found nice, Rider's looks like Unity's Project panel. The blue box indicates a folder with asmdef inside it. It works with nested asmdef too.At first I was not a fan of colored icons, but I do look the cartoonish bordered look on them. The shade of yellow they choose is nice, fortunately.Annoying save behaviourRider seems to love to save your file automatically, or do something too transparent that you ended up feeling insecure if it was saved or not. This is hell with Unity where iteration time is a very well known problem.For instance when you tab back to Unity all files are a'''
