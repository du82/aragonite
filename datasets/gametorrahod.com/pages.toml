description = "ไปเล่น iPad pro มา สนุกดี ถ้าฟรีก็อยากได้ 555 รีวิวเรื่องการเอามาใช้ทางครีเอทีฟ"
full_description = "Art / Audio รีวิว iPad Pro สำหรับทำงานวาดภาพ ไปเล่น iPad pro มา สนุกดี ถ้าฟรีก็อยากได้ 555 รีวิวเรื่องการเอามาใช้ทางครีเอทีฟ 5argon / Sirawat Pitaksarit Jul 17, 2017 • 1 min read ไปเล่น iPad pro มา สนุกดี ถ้าฟรีก็อยากได้ 555 รีวิวเรื่องการเอามาใช้ทางครีเอทีฟก่อนอื่นมักจะถามกันว่าจะแทน PS, CSP, Sai ได้มั้ย จริงๆอยากให้มองเป็น medium ใหม่ platform ใหม่มากกว่ามองเป็น upgrade (ไม่เหมือน Cintiq Companion ที่เขาทำมาให้เป็นคอมที่ลงอะไรก็ได้) ตรงนี้ขึ้นกับโปรแกรมมากๆเพราะมันช่วยเราเยอะ แล้วโปรแกรมส่วนมากมี character ไม่ใช่เอนกประสงค์เหมือนในคอมบางคนกังวลว่าโปรแกรมมันโกงไปมั้ย เช่น Procreate มันก็ช่วยเรามากเหมือนกัน แต่ไม่ได้รู้สึกโกง เพราะสุดท้ายรู้สึกว่าเราทำงาน based on ฐานที่มันช่วยเรา (เหมือนถ้าเพ้นต์สีน้ำจริง การที่สีกระจายเอง น้ำไหลไปสวยงามเอง ก็ไม่ได้โกง แต่มันเป็น character ของ medium นั้น หรือสีชอล์กมันขุยๆเราก็จะพยายามให้สวยในฐานที่มันขุยๆ เป็นต้น) โปรแกรมจะโกงแค่ไหนก็มี skill ceiling ใหม่ให้ฝึกแน่ๆจากข้อที่แล้ว ทำให้อดคิดไม่ได้ว่าถ้าทำเกมที่ภาพ assets ในเกมสร้างมาจาก iPad Pro + Procreate ก็คงจะมีเอกลักษณ์ใหม่ที่ตัวเองก็คงยังไม่เคยเห็นน่าดู เช่นเดียวกับเกมที่บอกว่า “ภาพทั้งเกมเหมือนสีน้ำ” “ภาพทั้งเกมเป็น 8-bit” อันนี้ก็มีสไตล์ของมันเช่นกันไม่ได้ช่วยให้ง่ายขึ้นหรือเก่งขึ้นอย่างเดียว บางทีรู้สึกว่ากากลง เพราะเพิ่งมาใช้ใหม่ยังไม่ได้ฝึกก็เป็นธรรมดา อย่างว่ามันไม่ใช่อุปกรณ์เสริมแต่มองเป็นของใหม่ดีกว่ารู้สึกดีที่จะอยู่ในกรอบ ถึงจะลงโปรแกรมตามสบายไม่ได้แต่ก็มีหลายอย่างที่คอมไม่มีที่อาจจะให้ไอเดียกับสไตล์ใหม่ๆได้ อันนี้คือข้อดีของงานครีเอท ถ้างานเอกสาร อาจจะต้องวัดกันที่ usability อย่างเดียวซึ่งอาจแพ้คอมล้วนๆ งานครีเอทเฉือนกันที่ที่อื่นได้เยอะ เหมือนในเรื่องดนตรี จะซื้อ groove box, sequencer, workstation แยกทำไมซื้อ DAW ลงคอมก็ทำได้เหมือนกัน แต่พอไปยืนอยู่หน้าเครื่องแยกที่ว่า ข้อจำกัดกลับทำให้ได้เพลงไวกว่า เพราะทุกอย่างที่เหลือมัน optimize มาให้เข้ากันกับข้อจำกัด (เช่นมี knob เฉพาะฟังก์ชั่น)เป็น stylus แรกที่รู้สึกสนุกเวลาทัชบนกระจก ส่วนมากการทัชอะไรที่ไม่ใช่แบบโฟม (โฟมก็ไม่ feel good ที่จริง) บนกระจกมันจะก้อกแก๊กน่าหงุดหงิดแถมลื่น อันนี้ไม่รู้ทำจากอะไรแต่มันฝืดแบบ perfect มาก เสียงก็เบาที่สำคัญกดแรงๆแบบสะใจๆได้ ปากกา Intuos 2 ถ้าทำแบบนี้หัวหัก เพราะหัวมันเป็นก้านเล็กๆ (ในฐานปากกา Intuos Pro มีหัวมาให้เยอะ เหมือนจะรู้ว่ามันบิ่นง่าย) อันนี้เป็นบ้องโคนใหญ่เลยเวลาใช้กับชอล์กอะไรงี้กดแรงๆแล้วสะใจ แล้วของ Intuos Pro ถ้าบิ่นแล้วน่ารำคาญมากเพราะระหว่างใช้มันจะหมุนไปมาเวลากดผิดมุมลงแบบแม่นๆยาก เช่นปาดเงาให้มันอยู่ในจุดที่ต้องการ ตอนลงสีพื้นถ้าทำสไตล์ซุยๆเละๆก็โอเค ถ้าเทสีก็โอเค แต่ถ้าปาดให้ลงตรงที่อยากได้เป๊ะๆนี่เริ่มยาก ตอนสีพื้นมันออกนอกนิดหน่อยได้ไง แต่ตอนเงา ถ้าเงามันทะลุเส้นออกไปนิดนึงนี่มันจะดูแหม่งๆทันที ถ้าใช้ clipping mask น่าจะช่วยได้ แต่จำได้ว่าใช้แล้วแต่ก็ยังไม่คมเท่าวาดด้วย tablet กับคอมอยู่ดี อาจจะต้องปรับ art style/workflow ตามสื่อที่ใช้หน่อยpalm detection โอเค แต่การแตะ pencil ให้นิ่งทำได้ยาก (เวลาค้างนิ่งๆแล้วจะหยิบลาก layer ได้อะไรงี้) ต้องเปลี่ยนมาใช้นิ้วแตะเคยใช้ Cintiq 13 มาแล้ว อันนีัสนุกกว่าเยอะ เบา จอสว่างสวยกว่ามาก ที่สำคัญไม่มีสายรุงรัง (USB+HDMI+Power) เหมือน Cintiq ถึงจะไม่ได้ถือไปไหน แต่แค่ตอนพยายามหมุน iPad ก็ฟินแล้ว (ไม่ต้องใช้หมุนกระดาษในโปรแกรมก็ได้)แต่แพง ราคานี้อยากเอาไปประกอบคอมมีการ์ดจอมาทำงาน 3D มากกว่า 555"
