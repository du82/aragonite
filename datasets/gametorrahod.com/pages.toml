["https://gametorrahod.com/photoshop-opacity-fill"]
title = "อธิบายจุดแตกต่างของ Opacity และ Fill ใน Photoshop"
description = "ทั้งสองอันทำให้เลเยอร์ใสลงได้ แต่ว่า"
full_description = "Art / Audio อธิบายจุดแตกต่างของ Opacity และ Fill ใน Photoshop ทั้งสองอันทำให้เลเยอร์ใสลงได้ แต่ว่า 5argon / Sirawat Pitaksarit Jun 3, 2017 • 2 min read ทั้งสองอันทำให้เลเยอร์ใสลงได้ แต่ว่าOpacity เกิดขึ้นหลังจากทุกสิ่งทุกอย่างFill เกิดขึ้นก่อนทุกสิ่งทุกอย่างคาดว่าหลายๆคนที่ใช้มาซักพักอาจจะรู้แล้ว แต่อยู่ๆก็อยากเขียนบทความสั้นๆไว้เผื่อใครเซิจมาเจอถ้าเรารู้ว่าทุกสิ่งทุกอย่างที่ว่าคืออะไรบ้างจะทำให้เราใช้ Opacity และ Fill ได้อย่างเต็มที่ ซึ่งถ้า layer เราไม่ค่อยมีอะไรสองอันนี้มันก็จะดูเหมือนว่าผลเหมือนกันครับ วิธีการเอามาสร้างสรรค์งานเช่นLayer Effectsที่คลิกขวาเลเยอร์แล้วกด Blending Options… นั่นแหละ ทุกอย่างจะถูกสร้างทับขึ้นไปบน Fill ครับ ถ้าเอา Fill ออก จะเห็นแต่ Blending Options แบบนี้ได้ (แต่ถ้าเอา Opacity ออกจะหายหมดเลย)เลเยอร์นี้ มีแค่ Outer Glow สีดำเช่นใช้ Color Overlay ถ้าไม่ได้ปรับ opacity (ของในหน้าต่าง Layer Effects ไม่ใช่ของ layer หลัก) เลยมันก็จะทับหายไปหมดไม่ว่า fill จะเป็นเท่าไหร่ แต่ถ้าลด opacity ลงจะทำให้เรามองเห็น fill ได้แต่ประโยชน์อีกอย่างคือ Color Overlay เองก็มี blending mode ให้เลือก ตรงนี้มันจะ blend ลงไปบน fill เท่านั้น ทำให้เราสามารถปรับความแรงของเอฟเฟคสำหรับบางอันที่แรงๆได้เช่น color dodge, additive ซึ่งบางทีปรับที่ color overlay ไม่ได้ผลที่ต้องการอันนี้แปลว่า “multiply ค่าของสีแดง ลงบน fill ที่มีอยู่” ซึ่งถ้าเรามีไอเดียหลักว่าอยากจะได้อะไรแดงๆ แทนที่จะปรับสีแดง opacity ของสีแดงก็มีทางเลือกไปปรับ Fill แทนได้ครับเผื่อจะได้ผลที่ต้องการถ้าลด opacity ของตัวคูณ กลายเป็นว่าเห็นความฟ้ากลับมาเพราะเป็นแดงอ่อนคูณกับฟ้าถ้าลดด้าน fill แทนแต่แดงยังเต็มที่อยู่ จะได้แดงสดคูณกับฟ้าที่มืดลงBlending ModesFill เกิดขึ้นก่อน layer จะโดน blend ด้วย (การ blend นี้เป็นขั้นตอนรองสุดท้ายของการ render เลเยอร์ใน Photoshop ขั้นสุดท้ายคือ Opacity)เราสามารถศึกษาความแตกต่างของ Opacity ได้ง่ายๆจาก Color Dodge ด้วยสีขาวครับภาพหลักภาพที่ว่าจะทำ color dodge ลงบนภาพหลักผลที่อยากจะได้ที่คิดไว้ในหัวคืออยากให้ตรงขาวๆกลายเป็นออกฟ้าๆเหมือนฉากหลังซึ่ง Color dodge นี้ก็คล้ายๆ Additive ที่มีชั้นเชิงหน่อย หลักๆคือถ้าสีค่าใกล้ 1 ก็จะเพิ่มค่าสีให้ภาพได้ ถ้าเป็นสีดำซึ่งค่า 0 ก็จะไม่มีอะไรเกิดขึ้น แต่สีที่ได้มักจะสดกว่า Additive สมชื่อ (อยากจะรู้จริงๆว่ามันเป็นอะไรก็ไปอ่านเอง https://en.wikipedia.org/wiki/Blend_modes#Dodge_and_burn)ทีนี้สรุป หลายๆคนมาถึงจุดนี้น่าจะเดาผลออกแล้ว ถ้าลด Opacity จะทำให้ Color Dodge ไร้ค่า เพราะสีขาวเต็มที่ทำอะไรที่เป็นทำนองบวกกับสีอะไรก็ได้สีขาวอยู่ดีเพราะมันเต็มแล้ว จากนั้นมันถึงถูกทำให้ใสลง ทำให้เราไม่เห็นผลของ Color Dodge(ได้สีขาวแท้ๆ ที่ใสลงจนเห็นข้างหลังได้)แต่ถ้าลด Fill ล่ะก็ผลของ Fill จะเกิดก่อน ความจางลงของสีขาวถึงถูกนำไปคิด Color Dodge ทำให้ออกมาเป็นสีฟ้าสดตามที่ตั้งใจไว้ครับ(ได้สีฟ้าสด ที่แท้จริงยังไม่ได้ใสเลยแต่มันดูใสเพราะมันเอาค่าสีของข้างล่างมาเป็นของตัวเองผ่าน Blending Mode ต่อจากนี้จะให้ฟ้าสดที่ได้มานี้ใสลงก็ปรับ Opacity ลง ทับอีกชั้นได้ครับ)"
