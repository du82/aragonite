title = "ความในใจถึงคนเปิดร้านกาแฟทั่วไทย"
description = "พอไปญี่ปุ่น ได้โอกาสไปซื้อแผ่นเพลงจากคนแต่งเพลงที่เจอในเน็ตกับมือ ก็เลยว่าจะเอามาฟังเรื่อยๆระหว่างทำงาน ตอนนั้นแหละที่ผมค้นพบว่า ผมฟังเพลงระหว่างทำงานไม่ได้อีกต่อไป"
full_description = "Story ความในใจถึงคนเปิดร้านกาแฟทั่วไทย พอไปญี่ปุ่น ได้โอกาสไปซื้อแผ่นเพลงจากคนแต่งเพลงที่เจอในเน็ตกับมือ ก็เลยว่าจะเอามาฟังเรื่อยๆระหว่างทำงาน ตอนนั้นแหละที่ผมค้นพบว่า ผมฟังเพลงระหว่างทำงานไม่ได้อีกต่อไป 5argon / Sirawat Pitaksarit Aug 10, 2019 • 1 min read มีตอนนึงประมาณปี 3-4 ผมเริ่มลองศึกษาโปรแกรมแต่งเพลง แล้วพอเรียนไปถึงขั้นที่ต้อง mix/master มันเหมือนหลงอยู่ในเขาวงกต ตื่นมาบางทีไม่รู้สึกว่าเป็นที่ตัวเองทำเมื่อวาน หนำซ้ำเรื่องนี้ ไม่สามารถชนะด้วย Google + YouTube ได้เหมือนทฤษฎีดนตรี หรือวิธีทำเสียงต่างๆ ทำไม? ผิดตรงไหน? ที่ดูมาในเน็ต ห้องก็ไม่เหมือนเรา ของใช้ก็ดูมีตังกว่าเรา ที่สำคัญ ไม่ใช่เพลงเราพอไปญี่ปุ่น ได้โอกาสไปซื้อแผ่นเพลงจากคนแต่งเพลงที่เจอในเน็ตกับมือ ก็เลยว่าจะเอามาฟังเรื่อยๆระหว่างทำงาน ตอนนั้นแหละที่ผมค้นพบว่า ผมฟังเพลงระหว่างทำงานไม่ได้อีกต่อไปเพราะดันเผลอฟังแบบ critical ตลอดเวลาว่าเสียงไหนจัดไว้ตรงไหน ความถี่นี้หลบเครื่องดนตรีไหนไว้ dynamics ต่างๆ release สั้นยาวแค่ไหน หลายๆคนอาจจะเป็นแบบนี้กับเพลงเนื้อร้อง แต่ตอนนี้แม้กระทั่งเพลง Techno ที่ repeat แทบจะทั้งเพลง ก็ดันสนใจว่ามันกำลังค่อยๆ fade อะไรมาใน 16 หรื 32 ห้องเพลง จังหวะนี้มี swing แอบใส่มาหรือไม่มี อันนี้ hard pan ซ้ายหรือมีแพลมอยู่หูขวาด้วย ไหนถอดหูขวาเช็คซิถ้าเพลงพวกนั้นมาจากร้านกาแฟ ไม่ได้มาจากหูฟัง ถึงจะโอเคเพราะรู้สึกมัน dilute พอที่จะไม่แคร์ได้แล้วก็ฟังแบบ critical ที่ว่า เป็นคนละอย่างกับพวกคนเล่นหูฟัง ผมเป็นคนที่ไม่ hi-fi เลย ใช้ DAC กับไม่ใช้ burn กับไม่ burn หรือ MP3 320kbps กับ flac ผมทำเพลงมาหลายปี ผมยังแยกไม่ออกใน blind ABC test ให้ถูกเกิน 3 ครั้งติดต่อกันได้ (มี 3 choice แต่สองอันเหมือนกัน มีอันที่เป็น FLAC อยู่อันเดียวให้เลือกให้ถูก)เป็น critical เชิงโครงสร้างกับความสร้างสรรค์มากกว่า ว่าท่อนนี้คิดยังไงถึงใส่อันนี้อันนั้นไว้ตรงนี้ตรงนั้น ทำไม reverb ถึงต้องเยอะน้อยเท่านี้ ซึ่งผมพบว่า มัน mind-taxing กว่าฟังเพลง critical แบบสุนทรีย์มาก (แบบว่า ท่อนนี้ซึ้ง เศร้า ความหมายดี เมโลดี้ดี ฝีมือดี)เพลงที่ซื้อมาจากคนญี่ปุ่น กลายเป็นว่าต้องแบ่งเวลาฟังจริงๆ ไม่ใช่เอามาฟังระหว่างทำงานได้ หรือไม่ก็ไว้ฟังระหว่างเดินทางแทน แต่เดินทางเช่นบนเครื่องบิน ก็กางโน้ตบุ๊คทำงานอยู่ดี 555 ก็เลยหาเวลาฟังยากมากแล้วต่อมาก็ค้นพบอีกว่าถ้าเป็นวาดรูปหรือ modeling สามารถฟังได้ แต่ก็ไม่ค่อยดีอยู่ดี โปรแกรมมิ่งจะฟังไม่ได้เลย แบบนิ้วไม่กระดิก แล้วรู้สึกตัวอีกทีก็จบเพลงแล้ว (ความรู้สึกเหมือนดูหนังโรง เปิดไฟสว่างถึงรู้สึกตื่นกลับมาโลกจริง) มองไปที่ iPod Touch Gen 5 ที่ซื้อไว้สมัยปี 2-3 ก็เสียดายว่าคงไม่ได้ใช้ตามจุดประสงค์มันอีกต่อมาผมก็เลยกลายเป็นคนฟังเสียง ambient เป็นเพลงแทน โต๊ะหินอ่อนแต่ละที่ถึงไม่มีปลั๊กก็ลองไปนั่งมาว่านกกาจะต่างกันมั้ย ลมพัดใบไม้เยอะแค่ไหน (แต่เป็นภูมิแพ้)มาถึงร้านกาแฟ ก็เลยซีเรียสมาก กับบางร้านที่ทั้งปีทั้งชาติไม่เคยเปลี่ยนเพลง เพราะเจ้าของร้านฟังเพลงอื่นหรือดู YouTube ในหูฟังตัวเองเลยไม่ได้รับรู้ความทรมาน 555 ส่วนร้านที่เงียบกริบเลยก็กลายเป็นนั่งไม่ได้เพราะเครียดกับเสียงเงียบ ร้านนึงที่ปิดไปแล้ว ก่อนไปญี่ปุ่นเพลงเดิม กลับไทยมาเยี่ยมพ่อแม่ก็เพลงเดิม เรียนจบ ก่อนปิดก็เพลงเดิม แถมมีแต่ผู้ชายร้อง (Chainsmokers.. เยอะ) แล้วร้านนี้เปลี่ยนพนักงานบ่อย จนยุคเปลี่ยนผ่านพนักงานเปลี่ยนกี่คน จนผมกลายเป็นคนเดียวในร้านที่รู้จักครบคนโดยที่คนใหม่ไม่เคยเจอกับคนเก่า แต่เพลงดันไม่เคยเปลี่ยน มีตอนนึง ที่พนักงานชุดนึง วันนึงเดินเข้าร้านมาแล้วเป็นเพลง My Soul Your Beats ผมตะโกนในใจ ถูกแล้ว! ทำดีแล้ว! เพลงต่อไป Gee ดี! แต่ทีนี้ก็มีพนักงานอีกคนเดินมากด แล้วกลายเป็น Coldplay ไม่! อย่า!ร้านที่เปิด Spotify ยังดีเพราะท็อปฮิตมันเปลี่ยนให้ แต่ร้านที่เปลี่ยนได้บ่อยพอดีสุดก็คง Starbucks ซึ่งมี seasonal playlist ด้วย เหมาะกับแต่ละฤดูร้านนึงผมยอมรับว่าผมเลิกไป เพราะว่าพอเปิดเข้าไปแล้วได้ยินเพลงเดิมปุ้บ มัน hallucinate เหมือนอดีตทั้งหมด 150 วันที่เคยนั่งร้านนั้น วนเข้ามาโจมตีในทีเดียว ทำเกม ไม่มีวันหยุดไม่มีนัดสังสรรค์กับเพื่อนตอนเย็นก็ทำให้วันเหมือนกันพอแล้ว ทีนี้เพลงเดิมเข้าไป แค่ได้ยินมันทำให้รู้สึกเสียดายชีวิตว่าเรากำลังทำอะไรอยู่ 555 รู้สึกไปถึง เอื้อ..​ ตอนนั้นที่เราได้ยินเพลงนี้ เราก็ยังแก้บัคหน้านี้อยู่ ตอนนี้ทำไมยังอยู่ที่เดิม เอื้อ... หมดแรงทำงานตั้งแต่ก้าวเข้าร้านส่วนรสนิยม บางร้านฝรั่งล้วน บางร้านบรรเลงล้วน บางร้านเพลงไทยด้วย ไม่ว่ากัน ฟังได้หมด แค่เปลี่ยนบ้าง จริงๆมีแค่ 2 set แล้วสลับวันคู่วันคี่แค่นี้ก็ดีกว่ามากๆแล้ว เพื่อเอาใจขาประจำที่มาวันติดๆกัน ให้อยากมาติดๆกันไปเรื่อยๆร้านปัจจุบันก็เริ่มเข้าลูปขี้เกียจเปลี่ยนเพลง เป็น cafe mix เพลงฮิตแทบทุกวัน แต่เหมือนมีบางวันที่เวรพนักงานเหลือคนน้อยๆ แล้วคนนั้นจะชอบเล่นเพลง downtempo / techno กับเคยได้ยิน Ghibli cafe mix ผมล่ะอยากให้ถึงเวรคนนั้นบ่อยๆส่วนตอนนี้ผมกลับมาฟังเสียงระหว่างทำงานได้อีกครั้งเพราะค้นพบสิ่งนึง สิ่งนั้นคือ e-sports.. (เปิดในมือถือ จะได้แยกจอไม่กวนงานในคอม) บางทีเวลาไม่มีอะไรให้ look forward to มันก็แย่ ยิ่งทำเกมคนเดียว แผนเที่ยวก็ไม่มี ของสั่งซื้อก็ไม่มี ทีนี้มี match ให้ตามดูสดหรือดูคะแนนมันก็โอเคขึ้น มี storyline ของทีมต่างๆให้ติดตามให้ meme ไปด้วยกันได้podcast ผมเคยพยายามลอง แต่มันก็ดึงความสนใจอยู่ดี มาถึงการแข่งขันต่างๆนี่แหละที่ผมว่าพอดี จะฟังผ่านๆก็ได้ จะหันไปดูก็ได้ เสียงเกมเสียงพากย์ ฟังดูเป็น noise ตลอดเวลาได้เพราะมันไม่สม่ำเสมอกำลังดี ไม่เหมือนเพลง ที่มีโน่นนี่ที่ repeat มาตามช่วงเวลาแล้วบางทีเราอยากจะตั้งใจฟังมันสุดท้าย ตอนนี้ผมมีอีกโรคนึง คือโรคเมื่อไหร่เพลงจะจบ 555 ความเห็นส่วนตัว เพลงสมัยนี้จบแบบ fade out น้อยมาก หนำซ้ำเทรนด์ใหม่เพลงฝรั่ง จบแบบหายไปเลย (ไม่มีแฉ ไม่มีอะไร) ทีนี้เวลาเพลงนั้น repeat มาใหม่ทีไร ผมจะนับห้องเพลง ว่าเมื่อไหร่มันจะฉับหายไป ยิ่งเพลงฝรั่งชอบ repeat ท่อน outro หลายๆรอบแล้วไม่มีอะไรใหม่ก่อนตัดจบ กลายเป็นกังวลว่า เนี่ยๆ ต่อไปตัดจบ.. อ้าวไม่ใช่ อีกรอบ เนี่ยๆ ต่อไป... โรคจิต 5555"
