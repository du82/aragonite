["https://gametorrahod.com/android-native-audio-primer-for-unity-developers"]
title = "Android Native Audio Primer for Unity Developers"
description = "I will demystify the “black box” surrounding the Android audio system and analyze why Unity’s way of using it makes your audio latency even higher than the already awful Android latency."
full_description = '''Unity Android Native Audio Primer for Unity Developers I will demystify the “black box” surrounding the Android audio system and analyze why Unity’s way of using it makes your audio latency even higher than the already awful Android latency. 5argon / Sirawat Pitaksarit Jul 5, 2018 • 67 min read I will demystify the “black box” surrounding the Android audio system and analyze why Unity’s way of using it makes your audio latency even higher than the already awful Android latency.Actually a supplementary documentation for the plugin Native Audio which skips all Unity’s audio system for the best latency, but it should also be useful for anyone who want to know more about the mystery of Android’s audio.(Also I hate manually editing HTML for long article with proper code tags and uploading images is a chore so I choose to put it here instead.)Be prepared for an hour-long audio lesson! Android is really complicated!Why skip Unity’s audio? What is the point of Native Audio?Latency! It is quite critical in some kind of games. If you have time you can read all of the reason from this front page :Native Audio - Lower audio latency via OS's native audio library.Native Audio is a plugin that helps you easily loads and plays an audio using each platform's fastest native method…exceed7.comWhat is Unity doingOn application start, Unity request 1 "native source" from Android device. This native source is configured based on unknown algorithm that sometimes results in a slow source.On AudioSource.Play in C# code, it will wait and collects all these kind of commands until the end of frame.When at the end of frame, Unity will calculate based on fall off, mixer, effects, etc. then finally mix them together.That one native source get the mixed audio bytes. You get virtually unlimited concurrent audio.Imagine you do 3 AudioSource.Play in a different Update. They will sound exactly at the same time after passing through latency.What is Native Audio doing (briefly)On application start, NA allocates several "native source" with settings geared toward low latency. Also preload audio bytes waiting.On NativeAudioPointer.Play, one of the native sourcce is seleted to play at specified audio bytes memory area immediately, right at that C# line without waiting for the end of frame, and without mixing or effects. It even works from threads.One source is exclusively for one preloaded audio. This is the "no mix" policy."Native source" is a limited resource per device, NA only allocates 3 by default and that means only 3 concurrent audio maximum until you have to cut off old sounds.Imagine you do 3 AudioSource.Play in a different Update. They will sound at slightly different time depending on which one comes first, since native plugin doesn't wait for frame.You will learn about "native source" later how to get the fast one and various experiments like, what happen if we request too many.Ways of playing native audio in Android from UnityWe will start from learning why my plugin Native Audio choose OpenSL ES as the implementation in Android side.Note : When I say “faster than Unity” from this point on, that is compared with Unity + the setting “Best Latency” (plays the fastest possible) in Audio Settings. (It minimize the buffer size, but we don’t know how small it is or could it be smaller). This is opposite of “Best Performance” with BIG buffer to ensure the audio does not drop out but the latency will go to hell with that setting.AndroidJavaClass / AndroidJavaObject / AndroidJavaProxy / AndroidJNI / AndroidJNIHelper They are not directly related to audio, but with these helper classes, you are able to use Java stuff from C# without writing a single Java code. This open up a way to access MediaPlayer, SoundPool , and (Java) AudioTrack from Unity. Which you will get to know them next.https://docs.unity3d.com/ScriptReference/AndroidJavaClass.htmlhttps://docs.unity3d.com/ScriptReference/AndroidJavaObject.htmlhttps://docs.unity3d.com/ScriptReference/AndroidJavaProxy.htmlhttps://docs.unity3d.com/ScriptReference/AndroidJNI.htmlhttps://docs.unity3d.com/ScriptReference/AndroidJNIHelper.htmlSoundPoolSoundPool | Android DevelopersA SoundPool is a collection of samples that can be loaded into memory from a resource inside the APK or from a file in…developer.android.comI have confirmed that SoundPool is slower than (Java) AudioTrack .The definition of SoundPool is so that you don't have to worry about underlying "native source" but rather a pool of sounds you want to use. One from many native sources will be selected and maintained automatically, instantiated more if not enough. Those native source are sometimes referrred as "stream".For example you play 3 different sounds quickly while having 2 sources, it will allocate you a new one. If you wait a bit and play the 4th sound and some earlier sound ended, SoundPool knows which one to reuse. You can fine tune this by giving "priority" weight to each native source (stream) as well.It is ideal for example entering a level and you load all the possible sounds in that level to one pool. With (Java) AudioTrack if you want to do the same you will have to command the push and pull of audio data manually to change sounds.If you need SoundPool-based solution for Unity, a plugin Android Native Audio by CHRISTOPHER CREATES is the choice (now free!). That means a plethora of functions that Native Audio cannot do like setting play rate.This ANA plugin is based on various Java helper classes in Unity mentioned earlier, which helps you do C# -> Java talk without actually using any Java. Should you need to hack it to add or access other methods on SoundPool, you won't have to write any native code or go compile a new .AAR package in Android Studio or something.SoundPool's limitation is concurrency and total size of each audio https://stackoverflow.com/questions/18170517/android-soundpool-limit . It is not suitable for music.On the reason why Native Audio (OpenSL ES) is much more limited, setting sampling rate in terms of OpenSL ES means destroying the source and create a new ones with different rate which we absolutely cannot do for latency critical audio playing, while for SoundPool it is already there for you and it just works. I don’t know what it is doing underneath... Moreover for OpenSL ES, just by having the set rate feature enabled and even not using it yet disqualify you from obtaining the fast audio mixer.And remember even if OpenSL ES has less latency, SoundPool is still much superior to Unity’s mixing latency. So if you also want utility plus still less latency, try it.Note : SoundPool is actually able to use fast flag like OpenSL ES , the underlying solution of Native Audio. See :Design For Reduced Latency | Android Open Source ProjectThe fast mixer runs periodically, with a recommended period of two to three milliseconds (ms), or a slightly higher…source.android.comLater on, when you learned about native AudioTrack and how Native Audio do it, we will come back to SoundPool vs Native Audio again, because in essence Native Audio is trying to reinvent the wheel of SoundPool but with settings geared for the lowest latency + sacrificing functions.MediaPlayerMediaPlayer | Android DevelopersPlayback control of audio/video files and streams is managed as a state machine. The following diagram shows the life…developer.android.comA very multimedia-ish player class for audio and video available in Java with sophisticated state machine. Just from this definition it is not for minimizing latency. (Sure enough I have tested and the latency was pretty bad)If you need MediaPlayer -based solution, Android Native Audio mentioned above has “ANA Music” feature. ANA Music is also based on doing Java helper call to get you a MediaPlayer from Java, and you have the priviledge of using OGG compression on your audio file.Native Audio could also use OGG now, but it will need to be decompressed completely to PCM data. (That is, decompressed to sized as big as WAV file.) But MediaPlayer could play the compressed file as-is.Also I know one case where in some Android device/version that SoundPool lags on play but MediaPlayer does not (explained later in “AudioPolicyManager” part), so I guess you can also use MediaPlayer to play sound effects even if the usage suggests to play music.OpenALOpenAL: Cross Platform 3D AudioOpenAL is a cross-platform 3D audio API appropriate for use with gaming applications and many other types of audio…www.openal.orgNative Audio maps to OpenAL in the iOS’s native side since I have confirmed it to be the best latency-wise there. I have no idea how OpenAL interfaces to iOS, but it is doing a good work.From the name you might think OpenAL is cross platform, why not use OpenAL in Android also when we have confirmed it is the best in iOS?In iOS I use it because while it is not by Apple, Apple include it in Xcode by default for use.In Android the default open standard is OpenSL ES, which translate to (C++) AudioTrack. To use OpenAL I would have to find an implementation that some one made which likely maps to (C++) AudioTrack anyways.I would like to stay pure and official rather than being able to reuse the code from iOS part.So I did not choose OpenAL.(Java) AudioTrackAudioTrack | Android DevelopersUpon creation, an AudioTrack object initializes its associated audio buffer. The size of this buffer, specified during…developer.android.comWe are finally at the lowest level of audio solution in (Java) Android, AudioTrack!This topic is AudioTrack as in the class name of Java. Android has an another (C++) “AudioTrack” defined at hardware level which this (Java) AudioTrack class interface to. OpenSL ES also interface to that (C++) “AudioTrack” low-level (it's C++ to C++).The reason of the same name is that one Java instance of AudioTrack really corresponds to one (C++) AudioTrack at native side one to one. As opposed to one SoundPool which governs multiple native (C++) AudioTracks. When you new the (Java) AudioTrack, you are really working with (C++) AudioTrack via Java.The “low-level AudioTrack” that `AudioTrack` Java and OpenSL ES interface to.How this class works is that you have to push audio data into the track’s buffer and it will push the content out to your speaker. Very few utilities unlike SoundPool but from my very first experiment, I have confirmed that it is the fastest and almost equal in latency to OpenSL ES. So why am I not using this Java ones but the OpenSL ES wrapper instead?AudioTrack is a class in Java. Remember that we are not making an Android native game but must issue commands from Unity. In Unity we have to use AndroidJavaClass to talk with Java which might be costly.If we use OpenSL ES which is in C language code (can talk to Java via JNI also), Unity can talk to it directly via extern (similar to how iOS plugin works with Unity) which could be very good for reducing latency.There’s this thing very important called FAST TRACK audio which just from the name obviously we will try to get at all costs. There are many conditions we must met (I will talk about them for sure) and to meet all those conditions in Java, look at this image it is HELL.API LEVEL HELLIn Android they have change, add, and remove API on almost every new version. Unfortunately it’s audio library is also one of the changes.In Unity, the lowest selectable is still Jelly Bean (API level 16) while the latest one is Oreo (API level 26). I want to support all the way down to what’s selectable in Unity. However this results in a compile time error if you try to use anything that is not available in Jelly Bean, unless you put it in an if ( Build.VERSION.SDK_INT >= ....) At the same time, newer API seems to have settings that can potentially improves latency that we can't ignore.Instead of using the least common possible setting I have go to great lengths to make sure my players get the most updated API as possible. For example with Nougat but not Oreo, you get AudioAttributes.FLAG_LOW_LATENCY in your AudioAttributes. With Oreo or newer, you instead get AudioTrack.PERFORMANCE_MODE_LOW_LATENCY in your AudioTrack.…all of that is actually in my Native Audio plugin version 1.0 where I used (Java) AudioTrack. Since v2.0.0 Native Audio is now pure OpenSL ES.OpenSL ESOpenSL ES will in turn making us "native track" (C++) AudioTrack for us much like what (Java) AudioTrack did.And one more reason, look at this page :High-Performance Audio | Android NDK | Android DevelopersHigh performance audio apps typically require more functionality than the simple ability to play or record sound. They…developer.android.comOnly 2 options (and there is no (Java) AudioTrack) officially recommended here is OpenSL ES and AAudio. So we are in a good company!However with OpenSL ES in C language, you can't use those Java helper class from C# to work on it. Native Audio comes with precompiled .AAR package. Inside this package is a mix of Java and OpenSL ES C code. We can no longer work entirely from C# unlike Android Native Audio plugin.AAudioAAudio | Android NDK | Android DevelopersAAudio is a new Android C API introduced in the Android O release. It is designed for high-performance audio…developer.android.comNewly introduced in Android Oreo, this is very interesting as it is Google’s answer to OpenSL ES by making it a new (closed) standard fitted for Android only rather than open.But! Not a lot of players right now would be able to use this until Oreo is old enough, but I am looking forward to assessing its performance and add it along with the old OpenSL ES approach that works pre-Oreo.Look at this page :AAudio and MMAP | Android Open Source ProjectAAudio is an audio API introduced in the Android 8.0 release. The Android 8.1 release has enhancements to reduce…source.android.comIt is really exciting that AAudio can put the data very close to the audio driver! It says in EXCLUSIVE mode we actually use the same memory area with the driver itself. So imagine all the goodness! All the fun music games you can make! I will do a research comparing AAudio with OpenSL ES for sure when I can afford a new phone with Oreo 8.1 or higher.It is also in C language similar to OpenSL ES so also you can fast-talk with it from Unity without going to Java. Now that I got OpenSL ES working and recovered my pointer arithmetic knowledge, I am quite confident to try putting in AAudio next so if the player has Oreo or higher he would get the goodness… but for now let’s dive deeper into OpenSL ES + (C++) AudioTrack.Oboehttps://github.com/google/oboeThis aims to fix the headache I said earlier. "Automatically use AAudio when the Android phone is able to, otherwise use OpenSL ES". It is maintained by Google! I better migrate my own plugin to this one but migrating various hacks I put in might take time.There is an Oboe implementation usable from Unity too, with this Asset Store item : Oboe for Unity (https://assetstore.unity.com/packages/tools/audio/oboe-for-unity-134705) He even mentions my own pl'''
