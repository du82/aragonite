["https://gametorrahod.com/texture-import-settings"]
title = "ทดลอง Texture Import Settings"
description = "ภาพ 512x256 จำนวน 64 ภาพเหมือนกัน แต่ชุดแรกเป็นแบบเดี่ยวๆให้ compress ด้วยพลัง power of two แต่ละภาพ (กติกาของ Android ไม่ต้องจตุรัสก็ได้) อีกชุดให้ pack ลง 2048x2048 สองแผ่นพอดี"
full_description = "Art / Audio ทดลอง Texture Import Settings ภาพ 512x256 จำนวน 64 ภาพเหมือนกัน แต่ชุดแรกเป็นแบบเดี่ยวๆให้ compress ด้วยพลัง power of two แต่ละภาพ (กติกาของ Android ไม่ต้องจตุรัสก็ได้) อีกชุดให้ pack ลง 2048x2048 สองแผ่นพอดี 5argon / Sirawat Pitaksarit Jun 24, 2017 • 2 min read Pack vs. Single POTภาพ 512x256 จำนวน 64 ภาพเหมือนกัน แต่ชุดแรกเป็นแบบเดี่ยวๆให้ compress ด้วยพลัง power of two แต่ละภาพ (กติกาของ Android ไม่ต้องจตุรัสก็ได้) อีกชุดให้ pack ลง 2048x2048 สองแผ่นพอดี ซึ่งขนาดภาพแต่ละภาพเล็กลงนิดหน่อยเพราะ Unity มันมี padding power อยู่ 2 pixelโค้ดโปรเจคทดสอบนี้ออกแบบไว้ให้ใช้ภาพทั้งหมดในโปรเจคแล้ว ตามภาพ ดังนั้นทุกภาพต้องถูกใส่ลงไปใน buildใน Import Settings บอกว่าภาพขนาด 64 KBใน Import Settings บอกว่าภาพขนาด 378 KB แต่ขนาดจริงน่าจะต้องรอ Atlasภาพหลัง pack แล้วผลหลังจาก build ออกมา (ทำไม inf% nan%) พบว่าในรายการ build มีบรรทัด atlas อันเดียว ถึงจริงๆแล้วจะมี 2 แผ่น atlas ก็เถอะเหมือนนอกจากจะมีแผ่นใหญ่ข้างบนสุดแล้วยังมีวิญญาณอยู่ข้างล่างอีก แต่ขนาดเล็กกว่าผลสรุปคือแบบ atlas4000 KB + (0.4 KB * 12) + (0.3 KB * 52) = 4020.4 KBแบบ compress power of two เดี่ยวๆ(64.5 KB * 12) + (64.4 KB * 52) = 4122.8 KBแบบ atlas ขนาดชนะนิดนึง แถมตอน draw น่าจะดีต่อ draw call มากกว่า ถ้าบังเอิญภาพอยู่ใน atlas แผ่นเดียวกัน เพราะงั้นเราควรใช้แบบ atlas ที่ภาพเล็กลงมากว่า power of two นิดนึงให้ pack ได้(แล้วตกลง 378 KB ที่โชว์มันคืออะไร)Compression Qualityทีนี้เราจะมาทดลองแบบเดิมแต่เปลี่ยน Compression Quality กันดูครับซึ่ง High แปลว่าเสียเวลา compress นาน แล้วตอนใช้กิน memory มากกว่า แต่น่าจะเล็กกว่า เขาว่างั้นLow QualityผลคือเหมือนเดิมHigh Qualityผลก็ยังเหมือนเดิม (อ้าว!)Compression Quality อีกอันแต่เดี๋ยวก่อน! ยังมี option ลับอีกอย่างที่ต้องตั้งจากโค้ดซึ่งมีค่าตั้งแต่ 0 ถึง 100 (ปกติคือ 50)Quality : 100 + HQ Compressionเอาแบบสุดติ่งไปเลยทีนี้Reimport นานมาก ประมาณภาพละ 6–10 วิ แสดงว่าต้องรอ 1280 วินาทีถ้าเราไปแตะต้องอะไรก็ตามที่ทำให้ต้อง import ใหม่ (21 นาที!!)จริงๆไม่ถึง ประมาณ 10 นาทีก็เสร็จ ผลลัพธ์คือเหมือนเดิม (อ้าว!)สำหรับคนสงสัยว่าขนาด APK อาจจะต่างกันมากก็ได้Crunch Textureยังมีอีก! เทคโนโลยี Crunch นี้ค่อนข้างใหม่ (https://github.com/BinomialLLC/crunch) เสียเวลา crunch นิดๆแต่ขนาดเล็กลงมาก เครื่องที่รับ DXT Texture ได้จะสามรถใช้ Crunch Texture ได้เลย แต่เครื่องที่ว่ามีน้อย (พวก Tegra) ถ้าเครื่องไหนรับไม่ได้ขึ้นมามันจะบานเป็น RGBA 32 bit ทันที แต่ก็ดีที่เซฟขนาด APK ได้ (ถ้ายอมโดนบานไหว RAM เยอะจัด หรือเป็นภาพ key จริงๆที่อยากจะให้ดูแปปเดียวแต่ภาพใหญ่)อันนี้ไม่รู้เหมือนกันว่าทำไม Fast แล้วขนาดยิ่งเล็กลงอีกได้ ขนาดที่เห็นคือขนาดเมื่ออยู่ใน memory นะครับแล้วก็ Crunch ที่ให้ติ้กหน้าแรกลองติ๊กแล้วไม่มีผล ต้องมาหน้า Androidเมื่อลอง reimport และ build ดูCrunch NormalCrunch Fastจะเห็นว่าผลคือขนาดเล็กลงแล้วครับ"
