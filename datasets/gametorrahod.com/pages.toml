title = "Duel Otters clone analysis : Cats Carnival"
description = "This is a deep analysis of a clone of my game Duel Otters, called Cats Carnival. It's an honor to be copied THIS much."
full_description = "Story Duel Otters clone analysis : Cats Carnival This is a deep analysis of a clone of my game Duel Otters, called Cats Carnival. It's an honor to be copied THIS much. 5argon / Sirawat Pitaksarit Sep 10, 2019 • 47 min read Duel Otters 2.0 is nearing its release, and I think it's time to talk about this a bit! Because 2.0 is a major rework and many things changed, I want to write down all about what Cats Carnival copied (it's an honor!). At the same time, an analysis of my design that the person who copied probably don't know about, as a postmortem before I let go of pre-2.0 Duel Otters.In this article, I hope you learn how a game came to be and why some devs keep saying \"inspiration\" rather than a \"clone\". That doesn't mean nothing in Duel Otters is a blatant copy, and so I will point those out too. Also I will explain thought process of something transforming from a mere clone at first into an inspiration. These are likely invisible to devs who just copy things.日本人「かわうそ\u001Dバトル」のファンへ、この記事はパクリゲー「Cats Carnival」を軽いに話しますw 自分が作ったゲームがパクリされのは人生初めてでした! 嬉しい!Quick preface about Duel Ottershttp://exceed7.com/duel-ottershttps://apps.apple.com/th/app/duel-otters/id915930373https://play.google.com/store/apps/details?id=com.Exceed7.DuelOttershttps://www.facebook.com/exceed7.DuelOtters/In university I started a project, a serious same-device fighting game which you play upside-down. (Named \"Factora\")Due to prototyping mistakes, it goes long way before I realize it was no fun. (I even made music and all the UI!)I prototyped a \"stupid baseball game\" in 1 day using Unity a while after graduated bachelor (the fighting game was made with Cocos2D) and it is more fun that that game I made for multiple months while in university.Factora was scrapped into a more stupid same-device party game, with simpler but more (mini) games on it.I managed to release it before I go to master degree at Japan, in 2014.The team disbands at that point into only me maintaining the project alone from Japan because others got a stable job now.I pushed some updates from Japan but not much due to working on papers. I birth a new solo music game project there, and decided to complete it before returning to Duel Otters.After graduated, that music game was going at slower pace than expected and I thought Duel Otters which is currently an active game is long overdue for update. (I call this \"rotting\") The end of 2018 I decided to open up the project, so I can prepare my mindset to update it in 2019.The project is a mess since I have improved so much from 2014, and I decided instead of updating I should rework the game and lay better groundwork.Because of life I only able to start the rework around 20 April 2019.The rework is finished around June 2019. Then I started working on a new content, it would be a shame if it is just a rework.Right now, September 2019, everything for v2.0 is ready except some social stuff.Then I decided to write about this topic.If you want a longer (darker?) version of the history you could visit a more personal blog here http://blog.exceed7.com, particularly this post which contains links to many related posts at around the end. I remembered there are suicidal thoughts in there and maybe mildly NSFW, but rest assured it wasn't because of Cats Carnival. (lol)Well I had came a long long way. I have my own story and my own cause I fought for. Maybe you have your own story that leads to having to clone my game. Did your life get better since then? Did I help you become who you are today?I did talk about this on stage!There are multiple occasions I can go back home to Thailand even while studying for master degree in Japan. In 2016, there is a \"bar camp\" event which participant could submit a talk and by voting you may or may not get to talk. (barcampbangkhen.org)I thought it was funny I became a good enough game designer to get my very own first copy game, so I submited the topic, and I was voted enough! If you can understand Thai maybe you could watch it for fun, this article is kind of a remake of this talk with an added context of Duel Otters 2.0.For Cats Carnival devs, I didn't talk negatively about you in Thai so rest assured! (There are few swear worlds but jokingly) You even get some free publicity from me I guess. And this article adds more to that.InventionsI always appreciate how each \"mechanics\" get invented and being copied. For example in Angry Birds era, every game somehow wants to use the \"grid stage select with 3 stars\" layout. Then in energy-game era, everyone must have that plus button glued to the bar to lure you into paying, or having a \"gated material\" like the upgrade screws in Hayday. Then in endless runner era, Cookie Run managed to get the most satisfying experience with many small polishes. Match-3 or a variant of color block games was always a thing, but King with its Candy Crush Saga popularized the \"puzzle match 3\" solution which instead of just score attacking, it is instead half RNG and half skill to get the block to the destination and \"execute the move\". It may take some man resource to mass-produce new stages (and not instantly infinite like score attacking games like Bejeweled for example) but damn it is so satisfying to complete the objective. Even a big company like Disney copied this invention almost entirely in a game like Frozen Free Fall.Since I am a music gamer, I can talk for hours about invention in this area. Like how DDR invented beat-colored notes, or the fast/slow indicator, or the groove gauge. I must stop myself from talking more now.These are the invention I am obsessed with observing, and appreciating whoever invented a new one. In this post, I will also share my own polishes and inventions openly.Cloning (functional) polishesYou see a million of Flappy Birds and 2048 clones. Mechanically they are the same. However do you realized they have cloned \"polishes\" too? Maybe the dev that clone them are aware or not.For example what if the original 2048 (the real original is a game called Threes however) didn't have a swipe-and-merge animation? That's actually a \"functional polish\" that make the game works. Notice that Candy Crush clones somehow have to display a word when you score big? (\"Delicious\" and so on) That's a very obvious non-mechanic, but a polish, that is easily cloned.But do they realized that the length of animation and its curve characteristic in Candy Crush Saga is controlled in the same theme on the entire game? This is some polished they may failed to clone. In this article, I will also talk about such things Cats Carnival failed to notice.The real inspiration of Duel OttersIs a game called Bishi Bashi Special 2 (PS1) and King of Opera (iOS/Android). Here's what I took from these games. Yes, real dev do not pretend you invented something.I will also talk what got indirectly transferred to Cats Carnival, probably without them knowing the origin and how that design came to be from the thought process.Bishi Bashi Special 2 (PS1)There are multiple 2-player mini games. And there are SO MANY like more than 50! Each with surprising amount of details. (Graphic-wise, the gameplay is simple.)You collect wins from each game and depending on scoring modes you try to win the \"campaign\".That's about it. In Japan, this game is an arcade cabinet too so this is kinda a port. Other than the 2 player minigames aspect, there is a not so obvious point I took from this game, but not blatantly.BBS2 has characters. I found this the most charming point of the game that this girl and boy is fighting each other on each game. There are games without this two too, and this is the point I think Bishi Bashi Special 3 (PS1) didn't look as good, because there is no character. (And so, limits the \"story\" behind it.)I decided that Duel Otters would avoid to be like BBS3, and be a bit different from BBS2, by always constantly feature the character on every games.The clone game Cats Carnival that copied Duel Otters without thinking probably missed this point, and the cats are instead generic. Then a common extension a game dev could think of to \"get ahead\" of the game you cloned is to add some kind of customization, (like if you cloned Flappy Bird, then you add a new bird which looks different. Common sense.) which Cats Carnival added an option to change the cats. However not knowing Duel Otters' constant green-pink character is \"by-design\", that extension actually violates the rule in my design. I chuckled a bit when I see they decided to extend on that route. However, character customization can lead to a new monetization opportunity too, like having to watch ads to farm currency to unlock those.BBS2 requires a score indicator. Which changes depending on games what is required to win.In Duel Otters prototype, I once copied this shamelessly but it conflicted with the upside-down design because you now require to duplicate the indicator to be readable by both sides, and it looks weird. I then try to force them into a bar-type so that both sides could read it. But what kick start everything is when I worked on the Baseball minigame's decoration, which is a sun that keeps expanding when you score. At that point I realized if I am creative enough, I can roughly tell a score without any numbers. At this moment one of Duel Otter's identity was born, the score indicators are mostly graphical and understandable from both sides.This is an aspect that Cats Carnival dev probably realized, as other than minigames that they copied me they have added their own originals too. (Great!) But those games featured numerical score indicator because they don't have my creativity to copy.BBS2 is explosive. This is one aspect that is hard to copy, and Cats Carnival missed on this. The animations are janky, explosions everywhere, and it is so satisfying. I \"blatantly copied\" this, by making the keyframes of my character a stepped constant rather than continuous. Cats Carnival features many easing animation (more often the default ease-in-out) and probably didn't realize this in my Duel Otters design. BBS3 is also falling short, because it is much more tame and not as \"explosive\". If you played BBS3, you know what I am talking about.Though, actually BBS2 is not the only inspiration. The other one is Tom and Jerry. What I liked as a kid is that the cuts after each time Tom gets hurt was quick and satisfying, and I want to replicate that feeling. There are many mini games in Duel Otters that the character gets hurt somehow because of this.Their latest iteration is the arcade-only Bishi Bashi Channel, which is much modernized with moe characters. The games are still wacky, but I missed the 2 characters from BBS2 so I credited this particular \"2\" iteration the most for the creation of Duel Otters.King of Opera (iOS/Android)Around the time when I was in university, and only a few people got an iPhone 3. This game is phenomenal and I can see someone grouped up and play it when it is not Angry Birds. That was a time when you have to borrow friend's phone to have a go at Angry Birds.There are many \"4P corner multiplayer\" game like this at that time, however King of Opera is the most polished and nothing is lazy.This game is where the \"same screen multiplayer\" aspect came from. However it is not that simple to copy :The game works for 1-4 players, I want to make a strictly 2 players game as inspired from BBS2. Therefore you are at each side instead of corners.The game works because it is an opera hall and the character is fat, and he looks good from above, and he can spin, and that is the core mechanics of the game. Everything was designed as a top-down game. And when compared with Duel Otters it is a game of single minigame. In Duel Otters, you will greatly limit a variety of games you can make if you limit yourself from a top-down perspective. Also the otters do not look cute from above. So I must somehow find my way about this on my own. An example is the Baseball minigame that started it all, I managed to turn top-down into a front-view game by having the otters hitting the ball to the horizon. Which, Cats Carnival copied entirely without any new invention. More on each game's analysis later.King of Opera gave birth to a completely new problem of \"how could you make same-screen multiplayer game without resorting to top-down perspective?\" which I enjoyed solving very much for each game by various wacky designs. (Which often goes against real-world logic, but the theme is funny so it still works.)Title ScreenI have made some title animation on mine, but I lose on this one! They have a better personel on making arts and animations. And unfortunately it was hard to motivate my artist to work. Maybe it would be different if we were an actual company with fundings so I could give salary. (She made the character art, mode selection BG, and about 3 game's BG artwork.)I appreciated Cats Carnival's OP because they came up with their own solution. What's really nice is that the music goes exactly with the sequence, which Duel Otters is that way too. (No more in 2.0)My random \"Otters falling from heaven\" title screen which I don't know what my artist was thinking is cool too. However it was once asked to remove the halo from Apple Store team before a featured promotion, since it looks like they are dead and therefore is not suitable for kids.Also I got a separated mode selection screen, which the beach is also drawn by my artist when we were still a team. I liked this screen!Though this title is changing on 2.0, so that's why I want to write this article as a legacy to the old screen.Game selector screenProbably one thing I am really proud to be copied, because there are many inventions here that got transferred without them knowing.Well my game selector screen was... abstract. It's one thing I regretted designing it but it kinda sticked around for too long and I got no time to remake it (until now). I draw everything on the corners, which are mostly random (but the cats and candles are characters from one of the games.) About that BG, that's a very lazy \"no art\" BG because I couldn't get my own artist to work more. It's just some primitives spinning and bouncing around! Cats Carnival ones with real arts looked much better. Let's talk about innovation here.\"How to make it work for both sides?\"The game banner have to somehow looks OK from both sides.The game's nameIt's a polish, which you don't realize if you have already seen one. The prototype version of Duel Otters there is no game name displayed, but instead it is displayed in the next screen. Also I gave up how to make the text readable from both sides and simply display 2 texts for each. Cats Carnival copied the same solution.In BBS2, this is done very stylistically by displaying a series of catchphrases that describe the game.In game selection screen, there is a word that sounds quite puzzling but inviting at the same time on each game's banner.The pros of this is that you are left wondered what would"
