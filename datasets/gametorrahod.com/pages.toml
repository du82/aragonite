["https://gametorrahod.com/midi-controller-for-game-dev"]
title = "เลือกซื้อ Midi Controller มาแต่งเพลง ทำเสียงในเกม"
description = "จะลองทำเสียงหนึ่งในอุปกรณ์ที่แนะนำให้มีคือ keyboard midi controller ครับเพราะใช้เม้าส์สุดท้ายคลิกๆจนได้เท่ากันได้ก็จริง…"
full_description = "Art / Audio เลือกซื้อ Midi Controller มาแต่งเพลง ทำเสียงในเกม จะลองทำเสียงหนึ่งในอุปกรณ์ที่แนะนำให้มีคือ keyboard midi controller ครับเพราะใช้เม้าส์สุดท้ายคลิกๆจนได้เท่ากันได้ก็จริง… 5argon / Sirawat Pitaksarit Jan 18, 2018 • 1 min read 2 octaves — 25 keys4 octaves — 49 keysจะลองทำเสียงหนึ่งในอุปกรณ์ที่แนะนำให้มีคือ keyboard midi controller ครับเพราะใช้เม้าส์สุดท้ายคลิกๆจนได้เท่ากันได้ก็จริง แต่อาจจะไม่สามารถหาไอเดียได้ แล้วก็ช้ากว่าหลายเท่าซึ่งพอจะซื้อแล้วถามว่าเอาขนาดไหนดี ก็มีคำแนะนำมาในฐานะที่ใช้ขนาดเล็กๆ (nanoKEY 2) กับใหญ่ (Roland A-49) คู่กันมานานจนรู้จุดอ่อนต่างๆสำหรับคนจะซื้อคีย์บอร์ด 25 keys (2 octaves) หลายๆขนาดพกพาอาจจะเห็นจำนวนคีย์เท่านี้ ถึงจะกดปุ่มเปลี่ยน octave ได้ก็ตาม แต่ 25 keys มันกระทบตอนออกไอเดีย โดยเฉพาะคนที่ชอบทำเพลง melodicเวลาได้จับคีย์บอร์ด 4 octaves+ เพลงมันชอบมาจากการกดมือซ้ายขวาพร้อมกัน (เป็นการลองความเข้ากันของเมโลดี้กับคอร์ดไปพร้อมกัน) ถ้าใช้จำนวนคีย์ 25 ก็ค่อยๆทำทีละส่วนได้ แต่ก็ต่อเมื่อได้ไอเดียแล้วเท่านั้น ซึ่งอาจจะไม่มีไอเดียเลยตั้งแต่แรก แต่แนวเพลงที่ทำทีละส่วนแล้วค่อยๆได้ไอเดียไปเรื่อยๆก็มีเช่น EDM, Electro house อาจจะไม่ต้องพึ่งคีย์บอร์ดกว้างในการแต่งmidi controller หลายๆอันอาจจะใช้แทนกันได้เช่นเอาคีย์บอร์ดมาตีกลอง แต่มัน inspire ได้ต่างกันแล้วก็ที่เห็น 2 octaves อย่าลืมว่าถ้าไม่ใช่ Key C,D อะไรงี้ที่เริ่มตรงขอบ มันก็จะต้องเล่นกลางๆแล้วเหลือประมาณ 1 octave + chord inversion ได้นิดหน่อยแค่นั้นถ้าเพิ่มเป็น 3 octaves จะทำให้ไล่ต้นจนจบได้ทุก key ดังนั้นความสำคัญของจำนวน key บนคีย์บอร์ดมันมีความหมายมากกว่าความเยอะ2 octaves— น้อยสุดที่ไล่ครบรอบได้ทุก key ยกเว้น C (ถ้าไม่อยากใช้ transpose) บางที bass line กดทีละตัวก็จริงแต่ตอนควานหาไอเดียอาจจะจำเป็นต้องโดดสูงต่ำ ตอนใช้ 2 octave ชอบตันถ้าไม่ได้แต่งเพลงคีย์ C3 octaves — ไล่ครบ 2 รอบได้ทุก key เล่นสองมือหาไอเดียคอร์ดกับเมโลดี้ที่เข้ากันได้4 octaves — อันนี้เริ่มเหลือเฟือ ส่วนมากใช้ไม่หมดหรอกแต่จะสำคัญตอนพยายามหาว่า ใส่อะไรเพิ่มอีกดี แล้วค้นพบว่าเครื่องดนตรีเก่าที่ยังไม่ได้ใช้ในท่อนนี้พอกดนอก range เสียงที่ใช้ๆมาแล้วกลายเป็นเสียงใหม่ที่น่าสนใจ ฯลฯ เอาไว้ค้นพบไอเดียว่ามีอะไรซ่อนอยู่ในเครื่องดนตรีอีก (ส่วนมากจะ synth ที่สูงมากกับต่ำมากดูเป็นคนละอย่างกันแต่ใช้ได้ทั้งคู่)5 octaves — อันนี้พิเศษหน่อย virtual instrument หลายๆยี่ห้อ มันจะมีสิ่งที่เรียกว่า keyswitch ที่กดคีย์แถวๆ octave 0 แล้วมันจะเปลี่ยนเนื้อเสียงได้ ถ้าใช้ 4 octave จะทำให้ไม่สามารถเลือก keyswitch ระหว่างเล่นได้เพราะถ้าปรับให้เห็น octave 0 แล้วจะทำให้ไม่ถึงตรงที่เล่นได้ แต่ก็แก้ได้โดยการเปลี่ยนตำแหน่ง keyswitch เองตามเครื่องดนตรี (ที่มันไม่ได้เล่นแถวๆ octave 1–2) อย่างในภาพตรงสีน้ำเงินคือ keyswitch ส่วนสีส้มคือไม่มีเสียง เล่นไม่ได้ ดังนั้นถ้าทำให้เอื้อมถึง keyswitch จะทำให้กดตรงสีขาวได้ไม่กี่อัน"
