on Assets are licensed on a per computer basis may not be shared or used concurrently on different computers.ก็คือ ถ้าเป็น Editor Extension (ช่วยให้ Unity เก่งขึ้น) จำเป็นต้องซื้อเท่าจำนวนเครื่องแต่ถ้าไม่ใช่ ซื้อไปแล้วสามารถลงได้ไม่จำกัดเครื่อง ถ้าคอมพิวเตอร์อยู่ในสถานที่เดียวกัน ที่สถานที่นั้น เจ้าของคือคนซื้อ (ก็คือ ให้เจ้านายซื้ออะไรงี้ก็ใช้ในตึกได้ทุกคน)ถ้าเป็น laptop ไม่ต้องอยู่ในตึกเดียวกันก็ได้ แต่ laptop เหล่านั้น คนซื้อเป็นคนจัดหามาให้ (ก็คือประมาณว่า โน้ตบุคของบริษัทที่แจกให้ทีม)คิดต่อ ก็แปลว่าถ้าทีมใช้ laptop ของตัวเองกันหมดแล้วไม่ได้ทำงานในตึกเดียวกันด้วย ก็จำเป็นต้องซื้อแยก (legally) นะครับ แต่ถ้าของที่ผมขายผมก็ไม่ได้แคร์เท่าไหร่ แค่ทีมเดียวกันซื้อครั้งเดียวก็โอเคแล้วแถมให้ว่า Editor Extension ทั้งหมดมีอะไรบ้างส่วน Introloop นี้เป็น Scripting/Audio เพราะว่าเกมที่ build เสร็จแล้วก็ยังต้องใช้โค้ดนี้อยู่ถึงจะทำงานต่อได้ ไม่ใช่อำนวยความสะดวกใน editor อย่างเดียว'''
