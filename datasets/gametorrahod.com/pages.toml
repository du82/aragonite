description = "There will be an occasion where searching the net is costing you more time to find the exact SFX you have in your head than sculpting one by yourself. Especially abstract ones like magic, combo attacks, or UI sounds."
full_description = '''Art / Audio Tips on game sound effect processing There will be an occasion where searching the net is costing you more time to find the exact SFX you have in your head than sculpting one by yourself. Especially abstract ones like magic, combo attacks, or UI sounds. 5argon / Sirawat Pitaksarit May 21, 2019 • 10 min read There will be an occasion where searching the net is costing you more time to find the exact SFX you have in your head than sculpting one by yourself. Especially abstract ones like magic, combo attacks, or UI sounds.In this blog post I would like to share some useful routine I discovered so far.Finding ingredientsYou might be wondering how the sound appears in the first place if you had never made a SFX. Well, a "synthesizer" could make an audio from nothing but what's better for beginners are samples.And no, you will not be layering a lone gunshot sound and magic sound from 2 different free audio website, because that's rarely get you what you want in your head. It is not flexible enough that the sound is already "named".Starting with recordings instead of samplesInstead of samples, we will be using "recordings". Field recordings are long, unedited sound captured from real world. They are usually abstract enough for you to cut up and play with. Listen to them with a good headphone is already fun on its own!Well you could buy some recordings, but free ones like Game Audio GDC exists and likely be more than enough. It is celebration of GDC event every year, with a collective slice from paid products organized by https://sonniss.com.[FREE DOWNLOAD] – (30GB+) – The #GameAudioGDC Bundle – (Part 4) – 2018 <!--//--><![CDATA[//><!-- !function(a,b){"use strict";function c(){if(!e){e=!0;var a,c,d,f,g=-1!==navigator.appVersion.indexOf("MSIE 10"),h=!!navigator.userAgent.match(/Trident.*rv:11\./),i=b.querySelectorAll("iframe.wp-embedded-content");for(c=0;c<i.length;c++){if(d=i[c],!d.getAttribute("data-secret"))f=Math.random().toString(36).substr(2,10),d.src+="#?secret="+f,d.setAttribute("data-secret",f);if(g||h)a=d.cloneNode(!0),a.removeAttribute("security"),d.parentNode.replaceChild(a,d)}}}var d=!1,e=!1;if(b.querySelector)if(a.addEventListener)d=!0;if(a.wp=a.wp||{},!a.wp.receiveEmbedMessage)if(a.wp.receiveEmbedMessage=function(c){var d=c.data;if(d)if(d.secret||d.message||d.value)if(!/[^a-zA-Z0-9]/.test(d.secret)){var e,f,g,h,i,j=b.querySelectorAll('iframe[data-secret="'+d.secret+'"]'),k=b.querySelectorAll('blockquote[data-secret="'+d.secret+'"]');for(e=0;e<k.length;e++)k[e].style.display="none";for(e=0;e<j.length;e++)if(f=j[e],c.source===f.contentWindow){if(f.removeAttribute("style"),"height"===d.message){if(g=parseInt(d.value,10),g>1e3)g=1e3;else if(~~g<200)g=200;f.height=g}if("link"===d.message)if(h=b.createElement("a"),i=b.createElement("a"),h.href=f.getAttribute("src"),i.href=d.value,i.host===h.host)if(b.activeElement===f)a.top.location.href=d.value}else;}},d)a.addEventListener("message",a.wp.receiveEmbedMessage,!1),b.addEventListener("DOMContentLoaded",c,!1),a.addEventListener("load",c,!1)}(window,document); //--><!]]> [FREE DOWNLOAD] – (25GB+) – The GameAudioGDC Bundle – (Part 5) – 2019 <!--//--><![CDATA[//><!-- !function(a,b){"use strict";function c(){if(!e){e=!0;var a,c,d,f,g=-1!==navigator.appVersion.indexOf("MSIE 10"),h=!!navigator.userAgent.match(/Trident.*rv:11\./),i=b.querySelectorAll("iframe.wp-embedded-content");for(c=0;c<i.length;c++){if(d=i[c],!d.getAttribute("data-secret"))f=Math.random().toString(36).substr(2,10),d.src+="#?secret="+f,d.setAttribute("data-secret",f);if(g||h)a=d.cloneNode(!0),a.removeAttribute("security"),d.parentNode.replaceChild(a,d)}}}var d=!1,e=!1;if(b.querySelector)if(a.addEventListener)d=!0;if(a.wp=a.wp||{},!a.wp.receiveEmbedMessage)if(a.wp.receiveEmbedMessage=function(c){var d=c.data;if(d)if(d.secret||d.message||d.value)if(!/[^a-zA-Z0-9]/.test(d.secret)){var e,f,g,h,i,j=b.querySelectorAll('iframe[data-secret="'+d.secret+'"]'),k=b.querySelectorAll('blockquote[data-secret="'+d.secret+'"]');for(e=0;e<k.length;e++)k[e].style.display="none";for(e=0;e<j.length;e++)if(f=j[e],c.source===f.contentWindow){if(f.removeAttribute("style"),"height"===d.message){if(g=parseInt(d.value,10),g>1e3)g=1e3;else if(~~g<200)g=200;f.height=g}if("link"===d.message)if(h=b.createElement("a"),i=b.createElement("a"),h.href=f.getAttribute("src"),i.href=d.value,i.host===h.host)if(b.activeElement===f)a.top.location.href=d.value}else;}},d)a.addEventListener("message",a.wp.receiveEmbedMessage,!1),b.addEventListener("DOMContentLoaded",c,!1),a.addEventListener("load",c,!1)}(window,document); //--><!]]> This guy is also amazing : https://freetousesounds.com/. He travel the world and record sounds. You could get them all for free, but the complete bundle is extremely cheap for what you get and save you some time to collect them all since he offered a sync cloud. What I really like is that he did a blog post for each one with interesting story. Well, for example read how he got his cat meow sound from Thailand : https://freetousesounds.com/cat-meows-sound-effects-chiang-mai-thailand/Recordings are keyword namedWith thier abstract-ness, they are named as a collection of keywords instead. This is very useful as when you are in your DAW you could type out what you are thinking and instantly get the ingredients with that related sound. For example one time I want to make the stone bombing sound that one boss could use. I try typing "crack" and found some usable sound instantly.Record them yourselfIf you are going on a trip you may find interesting soundscape. It's fine to use your phone! Don't worry about "pro" audio since you could add effects later and make them abstract. This is not like you are recording a foley for a multi-million dollar movie where it require realism.Also even recording packs it may take too much time sculpting the sound out of them, when you realize the attack sound you want in your head could be just by tearing some papers available on the desk.Here are some tips I found :Be alert of your mic position, or which hole on the phone is the mic. It's no good when you get back from 800 km beach trip and discovered that all your recorded footsteps-on-sand sounds are off to the side and you realize you was not holding the phone on your crotch.Realize if you have a running nose, hold your breath while recording if possible. Or recognize any other your habits that make a sound such as clicking your tongue, etc. Sometimes I made strange sound without realizing since it became a habit. They will show up in the recording.Wind will kill your phone recording with nothing but exploding bass. You can put the phone in your shirt to prevent this if you don't have any other proper windshield like a sponge or a "dead cat". (feathery stuff that redirect winds)Try new mic positioning. When I record a walking sound of myself, I try putting the mic closer to the foot. My walking posture became funny but the recording came out great.You could left the phone alone for a while then pick it up later. It's better than holding the phone, get tired, and cause some unnatural sound when you move around.Pay attention to "far away" sound. When you are in the mountain for example and you want to record birds and leaves, you will start hearing something undesirable like construction sound echoed from very faraway town, or some motorcycle speeding from somewhere. Strangely you didn't notice these noises until you really want to record something.Name them immediately after the record. You will get lazy to re-listen to them what they are later and could mean a dead project.A new world of sounds is waiting for you if you make a contact microphone : https://www.instructables.com/id/Make-a-Contact-Microphone/ or upgrade to Hydrophone so you could dip it in water for that water magic attacks : https://flypaper.soundfly.com/produce/how-to-build-a-diy-hydrophone/Make somethingThis article is not for this, so go nuts with whatever DAW program you have! I have some tips though :Cutting and pasting interesting chunks on the timeline. Sometimes just spacing them out produce much more interesting sounds.Add EQ if something sounds unusable.Add some high boost to make things "exciting" for games.If you are about to ditch the sound because you think it wouldn't ever become what you want and it is better to search for a new one, try adding destructive effects like guitar effects, reverb/echo with insane parameter, flanger, bit crush, etc.If that is still not it, try reducing the volume and use it as "details" instead, then find a new "main" ones. You may end up with rich SFX. These details could be panned to extreme left and right to create interesting stereo accompanying main one on the center.It is useful to work together with a reference video from the game as you could know the sync and you could test if it really fits with the visual or not. Most DAW could play a synchonized video while scrubbing timeline. If your video looks buggy in the DAW, try following this article.Post processingFinally we have arrived at what I want to say from the beginning. For each sound effects I found this effect chain useful. This is Ableton Live, but they are available on every modern DAWs.When you are making 1 SFX, you may have to layer up multiple tracks that has audio clips that are positioned differently. So group them up by whatever group track feature your DAW could do, then prepare a final chain of effects on this grouped track.The game in this screenshot is Pandora Hunter, an online mobile turn-based boardgame-like game : https://www.facebook.com/PandoraHunterGame/EqualizerFirst put an EQ with 3 controls :First one is high pass (= low cut). You might like how "bassy" your SFX sounded, but imagine in the game that they will have to compete with BGM. I always put highpass filter because I don't want it to clash with BGM's kick drum. Only if you have a specific design then you can leave the bass in. (Like a chill game with mostly ambient soundtrack, then you could fill in the bass with SFX)The 2nd one is a dip node for surgical cut. This has a high Q value so it forms a specific valley instead of smooth slope. Use it to dip out "annoying" frequency. If you couldn't find the problem, just move it left and right until it sounds great lolThe 3rd one is a high shelve filter to boost brightness. (in audio "bright" refer to higher frequency). I found that most recordings are "dark" by default (especially if not synthesized but from real recordings) and usually doing this make things better 90% of the time. It also help the sound to "pierce the mix", ensuring it could be heard no matter how busy the scene may become. This is good for UI and notification sounds. The iconic "hit registered", "kill beep" and "headshot dink" from a game like Overwatch are mostly dry, high frequency content.Frequency CompressorThe second effect is a specific frequency compressor (called Multiband Dynamics in Ableton Live). This works like the 2nd node in the EQ to cut off annoying frequency, but this time do so only if they get excessive, so you don't lose that detail when they are not annoying (yet).The most common problem for this is some kind of combo attack SFX, because they contained many audio blended together it is getting difficult to tame individual sound. For example, I am making a magic sword SFX where it has electric sounds (rather bright) at the beginning and end with an even more bright slash. The slash is kind of hurting the ear because the attack is sharp at the same time as the frequency is high, but reducing high frequency with EQ would destroy the electric sound that is already fine. By using a frequency compressor, it will only activate when the sword sound came since it went over the threshold.Convolution ReverbAdding a thin reverb is for fixing that "hmm...". Usually if something sounds almost good, a reverb make it complete because it kinda blend things together like putting herbs at the end of cooking. But stay with low Dry/Wet ratio or you could lose your audio's character fast.A convolution reverb draws reverb character from the real world, you capture impulse response (IR) from some room by clapping hand once for example and use it with this effect. You could put regular reverb instead of convolution, but a convolution allows you to scroll through different impulse response until it sounds good. The "repeat something mindlessly until it clicks" workflow is always good for lazy person like me!Stereo ControlThere are 2 cases, the audio sounds too centered and boring then you could use the "imager" effect to widen it up, or something sounded too spread out that they are no good for mobile game when the player is not wearing the headphone, then you could narrow it down.Maximizer + LimiterAfter this, put a limiter which prevent your audio from going red and cracks. Before the limiter, pump up the volume so it is as loud as possible without losing character you want. (Or you want that "slammed" character you could push more)The reason for maximizing each effect despite what they are is because mostly in game engine you cannot increase volume, just decrease. It may sounds strange if your leaf sound that should be gentle souded obnoxious right now, because you will mix it to reasonable level in the game. Do not try to mix here.GateIf you made your sound "too epic", you may notice you now have problem where to cut off the audio to save out the file. Usually these reverb tail is too long and not going to be heard by the player anyways when together with BGM, so it is a good idea to cut off the tail earlier than they would have slowly fade out.Cutting them out sharply is possible and wouldn't be that noticable, but it's better if the whole process is automatic. A Gate is an effect that could detect if audio went under a threshold, it should be cut off. This cut could be smoothen with Release so it produce a gentle slope like the green arrow instead of sharp cut. The red arrow shows what it would looks like if I didn't add the gate. If you do this to all SFX, you will ended up saving a lot of game's space! It may sounds uglier right now but remember that players rarely will be hearing the effect in isolated environment like you do now.How to render out the audio effectivelyYou may design multiple SFXs in one project. Then, you notice you have to select each SFX region and render them, like this :But it is a hassle to do this on each SFX and have to be careful about that silence on both sides, especially at the beginning where it could add perceived latency on your audio.What's better is just design a SFX on each track as you like, render out all tracks separately so it produces a lot of wasted space at first. Here, I have a reference video running at top so they ended up waterfall-y. Each track will contain a bit of SFX audio somewhere on its long range.Then, use a batch tool to trim out silence from both end of each track. I think Audacity has a batch window and y'''
