["https://gametorrahod.com/timeline-marker-and-everything-leading-up-to-it"]
title = "Timeline marker and everything leading up to it"
description = "In this article we will learn everything bottom up, starting from the new backbone added to UnityEngine.Playables that enabled the marker implementation in UnityEngine.Timeline. Not just that, I will rewind back to the very root. What is a playable? Why is that a graph?"
full_description = '''Unity Timeline marker and everything leading up to it In this article we will learn everything bottom up, starting from the new backbone added to UnityEngine.Playables that enabled the marker implementation in UnityEngine.Timeline. Not just that, I will rewind back to the very root. What is a playable? Why is that a graph? 5argon / Sirawat Pitaksarit Apr 30, 2019 • 18 min read New in Unity 2019.1, you can now create a duration-less object on the timeline, the marker. Currently the official documentation is still not up, but this 2 forum posts could kickstart you what it is.https://forum.unity.com/threads/new-in-2019-1-timeline-signals.594142/https://forum.unity.com/threads/new-in-2019-1-marker-customization.594712/If you are confused by "marker" or "signal" feature (not the same thing), here's the technology stack involved from bottom to top :UnityEngine.Playables : playable graph, playable, playable asset, playable directorUnityEngine.Timeline : track, clips, timeline assetUnityEngine.Playables (new in 2019.1) : notification, notification receiversUnityEngine.Timeline (new in 2019.1) : markers, marker trackUnityEngine.Timeline (new in 2019.1) : signalsIn this article we will learn everything bottom up, starting from the new backbone added to UnityEngine.Playables that enabled the marker implementation in UnityEngine.Timeline. Not just that, I will rewind back to the very root. What is a playable? Why is that a graph?What is a "playable"This is one of the most difficult and beginner unfriendly API to learn in my opinion given how abstract it is. ("Timeline" is the beginner friendly abstraction over this, but it helps to understand playables.)Moreover a "graph" (PlayableGraph) seems not like a thing that could be played at all. (https://docs.unity3d.com/Manual/Playables-Graph.html)https://docs.unity3d.com/Manual/Playables.htmlThe characteristic of things that you could "play" :You can order it to play, stop, pause, resume. It is said to be in one of these states. (Resume is not a state however, used to enter play from pause)It has a built-in time.That time moves or not depending on its state.Based on this time it do something.Based on that do something, the output state is now at something.How a graph come into play in all this? Why we not just call em "a playable" but instead, "a playable graph"? Imagine a record player. This is definitely a playable thing (literally, and also correctly in Unity's term).Photo by Wei-Cheng Wu / UnsplashBut also, this thing is a graph (that could be played). Graph is made from interconnecting nodes, in this case, interconnecting Playable (that's the actual class name). Many things inside a record player (playables) do connect to make the whole thing (graph) work.PlayableGraphThere is no new to call, you instead do static call PlayableGraph.Create() and you will get one which you could .Play(). It does nothing however! Until you add some Playable to the graph. There is no .Add(playable) to call either, you will learn how in a bit.There are several mode of increasing its time it could use : https://docs.unity3d.com/ScriptReference/Playables.PlayableGraph.SetTimeUpdateMode.htmlImportantPlayableGraph is playable (adjective), but not a Playable (the class name). ...yeah it even has .Play() if that confuse you further, but Playable as in the class name, means things that are inside the graph that do things, and make output become something while the graph is playing/evaluating.ScriptPlayable : PlayableBut just Playable is boring, it couldn't do anything. Each playable node should has its own behaviour as the time goes on. To create a playable that behave we need a ScriptPlayable, defining how it behave.Creating this is easy, with static method ScriptPlayable<T>.Create(graphThatItShouldGoTo). (Unintuitively, you don't do something like : graph.Add(new ScriptPlayable<T>()))How to define the behaviour of the created playable? The secret is in that T generic, which is should be of type PlayableBehaviour. You could imagine it will be able to use your T to create "a piece of logic" embeded in your ScriptPlayable without you having to mess with any delegate to send a method in. Sure enough, PlayableBehaviour is an abstract class that ask you to provide the required logic.Back to the record player analogy, it must contain tons of ScriptPlayable :The first node is the disc providing you data.The needle node connects to the record, picking up vibration.Imagine graph's time (playable graph has a time) as the position of this needle.The vibration is sent through metal strip node.The metal strip is connected to amplifier node to change little vibrations to music.The amplifier is connected to the speaker.Maybe you could even think the speaker is also connected to "air" node, before connecting to your ear.Your ear is a playable output node.If you change the needle's position, you are going to receive a certain kind of output (music) if it is in a playing state. Playing is just a loop of change time -> evaluate. You could also just evaluate the graph while in stopped state. Your choice.Creating that record playerIn simplified steps : PlayableGraph.Create : You get a thing that could "play" (.Play()), but there is nothing in it yet. You get back a graph.???Playable*Output?*.Create(graph) : Use Create static method to put things in the graph. You do get back that playable, but that playable is already in a graph.Connect playables up while they are already inside the graph : the returned playable from Create would have something to do this. For example PlayableOutput gain these methods. The PlayableGraph itself contains something like Connect among other things.Graph could branch! From my description you may think things are just connected in a linear fashion. How about having multiple speakers using the same needle's vibration? This is why it's "playable graph" not "playable list".This is a quite nice recap once you know all the terms so far : https://docs.unity3d.com/ScriptReference/Playables.Playable.htmlLooking at Connect's API, you can see that it will get pretty difficult to "imagine" a graph from these "ports". You must ensure something is leading up to the output at least too. You want some sort of GUI to work with this. But before that, needed for the GUI is the ability to "save"...PlayableAssetYou might be thinking about storing some kind of "preset" and have that create a Playable for you. Storing things in Unity should be via a ScriptableObject.Luckily PlayableAsset is exactly what you want and it inherits from ScriptableObject too. Instead of static Create you would have to use when crafting out the playable manually from the playable class, now you can use instance method from this loaded asset : playableAsset.CreatePlayable(graph, gameObject) so that it use information serialized in the asset to create a part of graph. Note that inside the CreatePlayable method, you likely have to use Create static method anyways. But having settings saved is better than pure scripting.PlayableDirectorWith the PlayableAsset technology you could have an asset ready to become a graph at any time. In Unity when you have an asset it means you could drag and drop it. (And increasingly Unity is heading towards this "asset" workflow on many packages)Without PlayableDirector, these are total steps of making use of the PlayableAsset :Get the asset in the script. Maybe you use an exposed field because you know ScriptableObject do show up in editor, or you could use Resources.Load or Addressable Asset System.Create a playable graph for it : PlayableGraph.CreateCreate a playable from that asset and put it in the graph : asset.CreatePlayable(graph)Connect ports and outputs.There is already drag and drop in the 1st step, but it would be nice if you could drop the asset somewhere and that thing do all 4 steps for you. PlayableDirector is that.PlayableDirector is commonly thought as "the timeline player", but because you already learn things from bottom-up, we are not even arriving at the Timeline yet. Also notice the top field did not say anything related to "timeline" in general but just "Playable (asset)".What it want is any PlayableAsset. It creates an empty playable graph and put that playable resulting from the asset to the graph. It doesn't even hand you back the graph (though you could get it) but has its own Play(), Stop() and the like. (Which I guess will be forwarded to playable graph's own Play() anyways)It just happen that the most common kind of PlayableAsset you give the director is a serialized timeline asset called TimelineAsset (more on this in a moment), and its CreatePlayable returns you a big-ass stack of playable representing the whole timeline.BindingsThe 5th important step that a PlayableDirector could do : the bindings. The assets in Unity are stored in the asset folder. They have no knowledge of things in the scene! But this PlayableDirector is a MonoBehaviour, it could know something in the scene.Then we can finally bridge asset workflow with the scene workflow, how about we remember scene-things on the PlayableDirector along with where it should went to when the asset became a playable graph at runtime. When PlayableDirector made a graph, it could additionally "inject" some references from the scene along the way.By this, bindings are not possible to set in the Timeline GUI without PlayableDirector, as it is not really a timeline's feature. You can think the bindings you can set in the Timeline GUI tab doesn't really modify the timeline asset but modifying the PlayableDirector component's data. Here is an image showing PlayableDirector holding the bindings, not the TimelineAsset. (Which it is also holding, preparing to turn it into the real Playable to uh... play)TimelineWhat you really want to do is drag and drop things in GUI at design time, preview it along the way, save that thing in the project, then play it when you want, and have something in the scene changes according to that.Timeline feature is this. It consist of a dedicated Timeline tab and a new PlayableAsset called TimelineAsset which is used together with already explained PlayableDirector. (The director is actually not a part of timeline feature, but it has been popular for processing just the TimelineAsset because that's what Unity promotes.)It has a time, could be played, stopped, pause, resume, and also things in the scene will be at a certain state depending on timeline's evaluated value. Unity's Timeline (when running) is a playable graph. When not running, the whole thing could be saved in the project thanks to PlayableAsset. And a nice GUI could edit this asset while in it's non-graph state.Moreover you even could say what happen when by dragging and stretching those clips with begin and end point on the timeline. I know it may not sound impressive, but if you think about the playable API I explained earlier in record player analogy, where everything do things all the time based on current time, this is a really great feature to have. The "clip" just happen to have begin and end point, which it could "if" if it should do something or not. Or even blends with other clips when they overlaps.UnityEngine.Timeline's source is visible, unlike UnityEngine.Playables.Let's look at this feature with rose-colored glasses : https://unity3d.com/unity/features/editor/art-and-design/timelineNow what it actually is in terms of everything you learned so far :The timeline you see in the Timeline tab is showing data from your TimelineAsset serialized in the project, which is a PlayableAsset. You can now "design" this asset at edit time easily, so it could become sophisicated playable graph at runtime.All the clips in the timeline are also PlayableAsset. Luckily there is no class called ClipAsset this time. (But you could add ITimelineClipAsset to customize how it behave) And clips are not actually lying around in your project (that would be troublesome) but instead, they are in a track.Each track that house the clips are also PlayableAsset, of type TrackAsset. Clips will be somehow serialized together in this TrackAsset. You could use [TrackClipType] attribute to control what kind of clips could be on the track. A track could have an output if you want via [TrackBindingType] attribute, which works together with PlayableDirector's binding feature. Entering GameObject type for the binding is possible. Track asset are not in your project either, everything are packed nicely in 1 TimelineAsset. Now you see that single TimelineAsset encompassed everything.On edit time, hand the TimelineAsset to PlayableDirector, so it could manage the created graph and do bindings at run time. Also it could preview in edit time! I once thought the PlayableDirector must have a big brain but actually most of the brain are in TimelineAsset's CreatePlayable and the Playables API itself that plays the created graph.Track's "binding slot" is just an illusionFor example this Animation Track with Animator binding, you see a slot right there. But that slot is not something on the track but just the editor helping you out, so you don't have to go to the PlayableDirector to see which binding corresponds to this track.Remember again, PlayableDirector holds the power of bindings, not the track. Because PlayableDirector is on the scene, and it binds to things in that scene. Track asset is not on the scene, it is in your project folder.Dispel the illusion by instead of inspecting the PlayableDirector (in the scene) with the TimelineAsset, click on the TimelineAsset in your Project tab directly. The slot disappears! Thanks to bottom-up learning, you know this make perfect sense. And it now also make sense that you use the same TimelineAsset on 2 different PlayableDirector and it could results in a different bindings.*It is possible to ask PlayableDirector what the binding for a particular track is, because those "Bindings" list are like dictionary. The key is? You guessed it, TrackAsset object. With this pd.GetGenericBinding(myTrackAsset) you could get the correct binding.For example you are writing a custom inspector for a TrackAsset and want to draw something based on the bound object. You could get the currently inspected director with the helper static property TimelineEditor.inspectedDirector, then throw itself into GetGenericBinding(this) to get the bound object.What people want next : "event system"When time passed a certain point in the timeline, you want something to happen once.It might sounded stupid that the Timeline feature in Unity could not do this from the Timeline's release, until you understand how it was made (playables) then you realize "triggering" was not in the playable's concept until now.Playable just evaluate its current time and change the output accordingly. There is no concept of something that "passed" a certain point. There is just : "it is at this point, the output then should be like this" (evaluation).Something like this must be 1 level of abst'''
