title = "34-key Kalimba music theory analysis"
description = 'Seeds Kalimba "Pisces" is a pretty interesting 34-key Kalimba! I love when a brand try to pioneer something and there are not much information anywhere else, I wanted to be at the frontier and experiment.'
full_description = '''Art / Audio 34-key Kalimba music theory analysis Seeds Kalimba "Pisces" is a pretty interesting 34-key Kalimba! I love when a brand try to pioneer something and there are not much information anywhere else, I wanted to be at the frontier and experiment. 5argon / Sirawat Pitaksarit Sep 1, 2021 • 24 min read Seeds Instruments made a pretty interesting 34-key Kalimba called the Pisces!https://seedskalimbas.com/Seeds Kalimba | FacebookI wanted a Kalimba to add interesting calming arps when composing game music for long. As soon as I see this arrangement which is currently not many brands are doing, I felt adventurous and wanted to explore. I love when a brand try to pioneer something and there are not much information anywhere else, I wanted to be at the frontier and experiment. Just like how I was messing around with Unity DOTS.And so with magic of today's e-commerce, it finally appears before me. Let's get the research started.In this article, I analyze the implication of this 34-key layout what possibilities are opened up. This assumes we will not re-tune the Kalimba to fit the song we want to play. We want the added flexibility of more tines to counter that!If you wondered why this kind of article appears in a Unity game programming blog like this, I picked up some instruments in lockdown and the diagrams here were made with Unity..! And also just so you know the Kalimba sound is leaning nice into game soundtrack territory. This sonic character could be in calming village music or fantasy forest theme.This Unity project I quickly whipped up in about an hour can ask all the tines to number itself according to either major or minor scale interval starting from any note and hide unrelated ones, so we could reveal interesting properties visually.This article requires a bit of music theory knowledge. (How many notes are there and their distances, key, chords, interval, diatonic, chromatic.) This maybe the first article taking the 34-key Kalimba seriously on the net since I can't find anything elsewhere, the 17-key version is so popular it dominates the scene. Therefore, let's start at 17-key.Recap the 17-key version's arrangementThe popular 17-key version is diatonic centered around major scale. It is literally centered, the root note is on the center tine. So it means either you bring the tuning hammer with you all the time in order to play all songs or you transpose any other song to this key you choose. Note that the hammer can't fix everything since tine length gets more limited on the edge, not only we can't get higher, shorter tines has less decay time as well and require more force to compensate.It has alternating tines left and right to form a major scale starting from the center tine going left first. Numbers in the picture are note/key agnostic, it is the member of your major key.For example, in C key Kalimba 1 is C, 6 is A. In music theory, there is no "black" notes since actually we have 12 notes lined up linearly. These 7 notes C D E F G A B C we see as a result of C major scale here looks linear but they aren't, only because of English alphabet tricks your eye but each one is 2 semitones apart, except BC and EF. So 7 notes looping can't be equally spaced, we need 12 notes and 2 kinds of distance : 1 semi + 2 semi. This is maximal evenness. In parallel world, we might have A B C D E F G H I J K L as notes and there is no sharp or flats since those would give the nearby alphabet without exceptions, if the English guys discovered chromatic before diatonic or something.Easy tonic chords glissandoThe alternating tines are probably for ergonomics of distributing notes to both thumbs but that is not all, it allows single thumb 3 notes glissando to form tonic chords perfectly. Tonic chords means not just any chord but they could "work" together to create a song in a given key of music, creating tension and resolve back.The green arrows are tonic major chords and red arrows are tonic minor chords. You can easily get your : I, ii, iii, IV, V, vi, vii chord of the tuning of your Kalimba with a gentle slide starting from the number that you want and going outwards. It automatically skips notes of an interval too close to the previous one automatically, which that would sound dissonance. To play the popular chord progression I -> IV -> V -> I, just find any number printing on the tines literally saying 1, 4, 5, 1 then slide away.Piano players know keys close by could be used to form interesting uncommon chords to spice things up. Kalimba made the spice impossible when randomly brushing around. As a result if you left the Kalimba for other not knowing music to mess around, it would still sounds quite pleasant unlike if someone randomly press piano keys.Also if you want to play ii minor chord, you can do 2 4 6 on the left side, but it also is available on the right side higher up! Talking about extremely lucky coincidence that there are 7 notes so by alternating left and right we get both even and odd numbers in one side. The 17-key arrangement is a very good idea, no wonder why it is popular.I skipped 7 2 4, the diminished sounding chords, in the image to highlight all available major and minor chords. Of course you can play that for occasional spooky sound.4-Note ChordsWe are even luckier that brushing 4 consecutive tines automatically get us the bluesy sounding seventh chords like 1 3 5 7 one, or 2 4 6 1 one.Blue arrows are major seventh chords. Notice that we have 2 "1 3 5 7" position to play.Magenta arrows are minor seventh chords. Notice that we only have room to play the seventh version of vi chord, the 6 1 3 5, on the left side since the other one on the right starts late and the "seventh" component fell off the edge...We can play dominant seventh chord on the yellow arrow too, which would play G7 in this case.Of course you can continue to get the rich ninth chord sound, etc.RangeNotice that the 1 note spans about 2 octaves, then we get a little 2 and 3 over and thats it.If you play major key song in the same key as Kalimba, the "home" is probably 1 on the left side so you can go both up and down. Depending on song, if it gets emotional it maybe higher than then range that you need to move the "home" down to the center 1. (Which may gets too low to your liking, but thats "Kalimba arrangement" for you.)Another major scale choice (Mixolydian mode-like)We can somewhat play the major scale of 5th member of the Kalimba's key too! In the case of C Kalimba, then this is how G major scale would play out. (G is perfect fifth from C.)"Somewhat" means that one tine will be wrong if you really play Mixolydian of C scale compared to the real G major scale. So please play almost Mixolydian.That tine is the "7" note. This note is a component of quite important V chord (5 7 1) so keep that in mind, and also iii (5 3 7). The vii (7 2 4) is rarely used, luckily. This note 7 is also used in a melody to lead into 1 so this will impact some songs doing that.The wrong tine by the way, if you go ahead and play it in place of 7 in the context of G major scale then it is a sharpened 6 (or flattened 7) instead. You can use this fact to play new chords that has sharpened 6 as a component.Also the flattened 7 wrong note has a name, the subtonic. It also has many uses different from the correct one (leading-tone). I would not consider playing in this position that "wrong".Note that in harmonica, trying to play G major scale on C harmonica is called the 2nd position or the "cross harp". The blues player play in this position, the reason is because the "wrong" note happen to be exactly what blues want, it feels bluesy. So when playing G major blues song, harmonica finds a C major one and play in this position.Yet another major scale choice (Lydian mode-like)Closely related to the perfect fifth above root is the perfect fourth, or in other words going counter clockwise in the Circle of fifths instead. In C Kalimba, the 4th member is F. This is how it looks like if we make the 4 note instead our new home.If you really go ahead and play Lydian of C as a makeshift F major scale, you will also hit one wrong note in the same reason as the G major scale vs. C major scale but "to the other way". This time the missing note is the 4 note, which is a component of ii (2 4 6), IV (4 6 1), vii (7 2 4). The vii chord is rare so we are lucky, but missing ii or IV chord maybe problematic.Minor scale play (Aeolian mode)You can play the relative minor scale of your Kalimba's key for some emotional songs and get the same glissando chord benefit. The home moves to note 6 and if you choose the 6 on the left side as your home then you get a bit higher upper range than the major scale playing.Let's see if we look at the note 6 as a new 1 for our minor scale, what would it looks like. All tines are correct, naturally!By shifting the numbers, range are affected. For example there is only 1 instance of 2 4 6 glissando remaining now. Poor II chord! (The II chord switched from vii that was in major scale.)Playing in Dorian or Phrygian mode for more minor scale choicesSame reasoning as when we want to play 2 more major scales with 1 wrong tine, you can do the same starting from A minor scale we can naturally play and go clockwise and counter clockwise. Therefore it is D (note 2 of C) and E (note 3 of C) minor scale we could also somewhat play with 1 missing note.Here's how D minor scale on our C major Kalimba looks like. The missing note is 6. (It was 4 in major scale.)Some observations :We have 1 3 5 glissando available to play the home minor chord on both sides.We also have 5 7 2 for minor scale version of V chord.3 5 7 is also cool.7 2 4 on both sides are not so useful in most songs.Here's how E minor scale on our C major Kalimba looks like. The missing note is 2. (It was 7 in major scale.)Some observations :We have 1 3 5 glissando available to play the home minor chord on both sides still but the position moved a bit.5 7 2 no longer possible. (which is probably quite a big deal since it is a V chord)3 5 7 is still possible.Now we can do 4 6 1 and 6 1 3 on both sides too.Compared to major version, because the missing note is not 7, you don't get the leading-tone-to-subtonic benefit.Recap the 21-key version's arrangementThe extra 4 tines are added for extended bass sound.They are jammed right in the middle as low 7 5 4 6 tines, so the center is no longer your root note of your key. You can still perform glissando chord trick from new bass notes, for example from the new low 4 6 into the original 1, or the new low 5 7 then onto the original 2.These are also good idea since now you are able to lay down interesting interval under your melody as a representative of chords in the song.Here comes the 37-key arrangementThe idea is to make a 2-row Kalimba where the first row is exactly like 17-key version (alternating major scale), then move the 4 extra bass tines of the 21-key out of the way to 2nd layer, then fill the remaining upper tines with a sharpened note of the first layer. (one half step higher)This is a diagram from Seeds Kalimba Pisces :Accidentally chromaticMany call this "chromatic Kalimba" but notice that the upper tines aren't equivalent of black keys on the piano. They may ended up covering all notes chromatically "accidentally" but the upper tines do not care about that, they just want to sharpen the lower one.First, the upper row 7 5 4 6 are special, they are not sharpened tines but your extra bass notes in the major scale of lower row that are now made "optional", inspired by 21-key design. You reach up for them when needed instead of having them breaking the flow of beautiful alternating 17-keys. These rows aren't adding any chromatic quality from 17-key design that was diatonic.Now the sharpened tines are the real deal that adds chromaticity (that is a word?). Because playability is still centered around the lower row having major scale ready for you, using these upper tines for accidental notes that music composer added for spice maybe a good idea rather than trying to play in arbitrary keys.However remember that among 12 notes in one octave, BC and EF are only 1 half step apart unlike the other guys. Therefore the sharpened 7 is 1 and the sharpened 3 is 4 in all major scale. We can see that the upper tines therefore sometimes include duplicated sound of the lower one. The upper tines are really meant for sharpening, not for covering all notes.Make use of the duplicated sharpened notesHaving 2 more "1" note and "4" note available up there may comes in handy sometimes.You can perform exact pitch unison with 2 same notes to amplify it, or you can trill the note with both of your thumb for style like some other instruments!The 1 note is likely to sound good as an interval with the other tines in many situation since it is the root of the key that you are playing, assuming you are playing the same key as the Kalimba's key.Any interval pair in your key with 1 and 4 is going to give you some more choices. So look out for them.You can also perform this cool trick, vertical glissando. But you can only do it on 1 -> 7 and 4 -> 3. There are 4 positions you can do this. If you prepare your other thumb to add 6 and 2 respectively, it sounds quite like believable you just brushed with one thumb! Or you can drag diagonally and play other nearby interval as well. Might looks flashy in your Kalimba video..Bonus high-4 noteNote that the rightmost 4 is not exactly a duplicate since it is on doubly high octave. This give more variation for you to perform unison interval of various instances of 4.Perhaps more importantly, it extends your range by 1 note in the key of C as if there is one more tine to the right of the rightmost tine, you just move up instead. This is because 3->4 is one of two place where we only need 1 semitone up to get to the next scale tone, lucky!When playing on minor scale song and you start at 6 (to be your new 1), note 3 (the final lower tine) is the "5" of minor scale. 5th tone of any diatonic scale is the dominant, well documented as very important to the song. Therefore this bonus 4 will give you the "6" of minor scale, the submediant. So when you use the Pisces, you are able to play minor key songs that use this submediant-feel in the composition on high notes, provided that you transpose it to A minor first.Most Kalimba stops at high 3 (E6 note, if in C tuning). Be warned that this bonus 4 tine is very short and hard, most low quality Kalimba would not sound great but it works on the Pisces, perhaps thanks to unibody metal saddle design.Arps from bass tinesIt moves up the 4 bass tines from 21-key to above. If you want to arp from lower notes, then you cannot just brush your fingers. Instead to play the 4 available triad of your scale degree : 4 5 6 7 (4 6 1, 5 7 2, 6 1 4, 7 2 4) starting from the bass tines, and send off to the higher octave, you follow a pattern like this :Some observations :All chords are one handed from bass tines, but at t'''
