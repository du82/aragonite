title = "ไขความลับ ทฤษฎีหมูกรอบ"
description = "เรื่องก็คือตอนแรกแค่อยากทำหมูสามชั้นทอดสีน้ำตาลที่เคี้ยวแล้วไม่ต้องคายหนังกินกับข้าว ทอดกระเทียม ยังไม่ถึงขั้นหมูกรอบขาวเหลืองแบบที่ร้านที่ใส่กะเพราหรือเป็นข้าวหมูกรอบที่ราดน้ำแดงๆ"
full_description = '''ไขความลับ ทฤษฎีหมูกรอบ เรื่องก็คือตอนแรกแค่อยากทำหมูสามชั้นทอดสีน้ำตาลที่เคี้ยวแล้วไม่ต้องคายหนังกินกับข้าว ทอดกระเทียม ยังไม่ถึงขั้นหมูกรอบขาวเหลืองแบบที่ร้านที่ใส่กะเพราหรือเป็นข้าวหมูกรอบที่ราดน้ำแดงๆ 5argon / Sirawat Pitaksarit Jul 20, 2019 • 21 min read Update : ตอนนี้ย้าย blog อาหารไปอีกที่แล้ว จะได้ไม่ปนกับ blog โปรแกรมมิ่งครับ : https://jingjang-cooking.com/mu-krob-theory/เรื่องก็คือตอนแรกแค่อยากทำหมูสามชั้นทอดสีน้ำตาลที่เคี้ยวแล้วไม่ต้องคายหนังกินกับข้าว ทอดกระเทียม ยังไม่ถึงขั้นหมูกรอบขาวเหลืองแบบที่ร้านที่ใส่กะเพราหรือเป็นข้าวหมูกรอบที่ราดน้ำแดงๆคืออยากทำประมาณนี้ ร้านสารพัดหมูนี้ที่เมเจอร์รัชโยตรงโซนลานข้างนอก อร่อยมาก มี 4 สไตล์หมูให้เลือก น้ำจิ้มแจ่วเด็ดที่มีมะขามเปียก แล้วก็ผักต้มฟรี แค่ 40 บาท เพอร์เฟ็คสุดๆTake 1 : Naive approachเรื่องมันเริ่มมาจาก ตอนแรกว่าจะทดสอบอีกความเชื่อนึง ที่ว่าผสมๆไปเหอะ แป้งข้าวเจ้าข้าวโพด ก็เลยจะลองว่าอันผสมแป้งข้าวโพดกับไม่ผสม ต่างกันยังไง (เลือกแป้งข้าวเจ้าล็อคไว้ เพราะเป็นสิ่งที่มีในส่วนผสมของโกกิ) อันนี้ไม่ได้กะจะทำหมูกรอบ (ขาวเหลือง) แต่เอาแบบหมูสามชั้นทอดกรอบแค่นั้น (น้ำตาลๆ)ทอดออกมาดำก็เลยไม่รู้เรื่องว่าแป้งไหนดีกว่ากัน 555 แต่ที่สำคัญกว่า คือหนังมันต้องคาย หนังไม่กรอบ ถึงจะไม่ได้ทำหมูกรอบขาวเหลืองก็เหอะ แต่หมูสามชั้นผัดซอสแบบนี้ก็อยากได้แบบกินได้เพลินๆเลยตอนแรกคิดว่าต้องไฟไม่แรง จะได้ทอดจนกรอบได้ก่อนดำ แล้วเอาหนังลงทอด แล้วก็ห้ามหั่นด้วยเพราะไม่งั้นจะตั้งด้านหนังลงระหว่างทอดไม่ได้ แต่พอไปถามเพื่อนแม่ครัว เพื่อนบอกว่าวิธีที่ถูก ต้องต้มก่อนแล้วค่อยเอามาทอดฟังดูมีเหตุผล เหมือนตอนทำไข่พะโล้ เมื่อต้มจนคอลลาเจนในหนังกลายเป็นเจลาติน ทีนี้ก็จะเคี้ยวหนังเข้าได้https://www.exploratorium.edu/cooking/meat/INT-what-makes-juicy.htmlBonus takeก่อนไปต่อเอาที่เหลือมาอบแทน คิดว่าใช้เวลานานขึ้นได้แล้วจะรอด แต่สุดท้ายหนังก็ยังแข็งๆอยู่ดี (แต่รสโอเค ชอบน้ำเกลือข้างล่างที่ไหลออกมา กินเปล่าๆกับข้าวยังได้)Take 2 : ต้ม? ส้อมทิ่ม? แห้ง?จากการสอบถามเพื่อนเพิ่มเติม มีสิ่งต้องทำเพิ่มขึ้นอีกแห้ง : อันนี้เบสิคของอาหารชุบแป้งทอดเพราะถ้า soggy แล้วน้ำมันกับน้ำอยู่ด้วยกันมันจะระเบิดกันเองแล้วไม่ได้ทำให้หนังกรอบ พอเข้าใจได้ต้ม : อันนี้ที่ว่าให้หนังกินได้ส้อมทิ่ม : เหตุผลคือน้ำมันจะได้เข้าไประเบิดจากข้างในให้กรอบตอนนี้นี่เองที่เริ่มเปลี่ยนความสนใจ จากหมูสามชั้นผัดซอสที่กินได้ มาทำหมูกรอบขาวเหลืองดู คิดว่าถ้าทำอันนั้นได้น่าจะไขความลับแห่งหนังหมูไปประยุกต์ทำแบบไม่กรอบได้ไปเจอมาหลายเว็บบอกว่าตอนต้มสามารถ infuse ได้ คิดว่าไม่น่าจะถึงขั้นทำให้ผลการทดลองเพี้ยนจากกรอบเป็นไม่กรอบเพราะใส่เม็ดเก๋ากี้ลงไป นี่ก็เลย ต้มแบบต้มทำหมูพะโล้เลย ต้มจนเปื่อยแช่ผ่านไปสามคืน ออกมาจากตู้เย็น แห้งสุดๆ แล้วก็เอาลงไปทอดหลังจากชุบแป้ง ที่ผสมน้ำเย็นเจี๊ยบเพื่อชะลอปรากฏการณ์ glutenize ตามความรู้อาหารชุบแป้งที่ศึกษามา กรณีที่อยากให้เหนียวนุ่มแบบนั้น คือตอนทำขนมปัง แบบนั้นอยากให้ร้อนมากกว่าเย็น คนที่มีหัตถ์ตะวันจะได้เปรียบแบ่งการทดลองเป็น 4 ชุดคือ ทิ่ม ไม่ทิ่ม ทิ่มโกกิ ไม่ทิ่มโกกิ ผลออกมาปรากฏว่า เหมือนกัน!!อันนี้ทอดโดยใช้วิธีที่เจอมาจากเว็บนึง คือเขาว่าทำด้านเนื้อให้โอเคก่อน แล้วสุดท้ายค่อยเอาหนังลงจ่อน้ำมัน ต้องไม่ร้อนเว่อร์มากไม่งั้นดำก่อนกรอบ ดูภาพอาจจะเห็นฟองๆที่ดู promisingแต่ข้างในเป็นหมูพะโล้! คือมันเป็นหมูพะโล้ชุบแป้งทอดกรอบ ไม่ใช่หมูกรอบ และไม่ใช่หมูสามชั้นทอดด้วย... นุ่มจนขนาด ไม่สามารถใช้มีดผ่าแล้วคงรูปได้มันก็อร่อยนะแต่มันไม่ใช่หมูกรอบ เหมือนอารมณ์ขาหมูเยอรมันมากกว่า (ถ้ามีซอสเขียวนี่เข้ากันเลย...) ถ้านับเป็นหมูกรอบ หนังอันนี้เรียกกันตามเว็บฝรั่งว่า silky skin เป็นหนังกระจอก กรอบก็จริง แต่เป็นแผ่นบางๆ ไม่ระเบิด แล้วก็ที่สำคัญ ดูทุเรศWhyต้องต้มนานน้อยกว่านี้?ต้มน้ำตื้นๆให้สุกแค่หนัง เนื้อจะได้เหลือความเคี้ยวได้ จริงๆเนื้อไม่จำเป็นน่าจะต้องลดความคงทนมันเพราะส่วนนี้ติดมันในเนื้อน่าจะนุ่มพอดีอยู่แล้วต้องแห้งกว่านี้?ต้องอบ? ไม่ใช่ทอดเลย?แห้งแบบไหนคือแห้งจริง?สงสัยอีกอย่างคือ ภูมิปัญญาเว็บฝรั่งไม่ตรงกับคนไทย ที่เจอมาหลายเว็บมากที่บอกว่าแช่ตู้เย็นให้แห้งได้??อีกท่านึงที่ support ความแห้งคือ ให้ทาเกลือหนาๆ แล้วค่อยขูดเปลือกเกลือออกทีหลัง เหตุผลคือเกลือจะช่วยดูดความชื้นแต่เพื่อนไทยบอกว่าการแช่ตู้เย็นให้แห้งมันจะไปแห้งได้ไง ต้องตากแดดสิ เอ๊ะ อันนี้รู้สึกแปลกๆตรงที่ผักเวลาแช่นานๆยังแห้งจนกรอบได้แล้วทำไมเนื้อไม่เหมือนกัน?White vinegar??ไปกันใหญ่อีกครั้ง เมื่อเจอหลายๆเว็บบอกให้ทาน้ำสมสายชู "แล้วจะกรอบ" โดยที่ไม่มีคำอธิบายอื่นอีกเลย? ทำไม?Baking powder / baking sodaอันนี้พอฟังขึ้นอยู่ว่าถ้าทาผงฟู แล้วเอาไปอบ มันก็จะ ฟู 55555 จริงๆคือเป็นความฟองฟอดเวลามันโดนความร้อน ฟองที่ว่าคือ carbon dioxide (C + O O = CO2) แล้วฟองพวกนี้น่าจะเข้าไปในรูที่เสียบไว้แล้วระเบิดออกมา (น่าจะ) ศัพท์ทางเทคนิคคือ มันเป็น leavening agent อีกตัวที่น่าจะคุ้นกัน คือยีสต์ ที่พอใส่น้ำร้อนให้มันกลับมามีชีวิตแล้วมันจะกินน้ำตาลแล้วตดออกมาเป็น CO2 แต่ทำงานช้ากว่า ค่อยไปค่อยไปกว่า เหมาะกับขนมปังคนละชนิดกับแบบที่ใส่ BP/BSรวบรวมความรู้จากเน็ตเพื่อหา correlationในเมื่อแต่ละคนบอกไม่เหมือนกัน แต่ละเว็บก็บอกไม่เหมือนกัน แต่ที่สำคัญ ทุกเว็บได้หมูกรอบแต่เราไม่ได้หมูกรอบ 555ถ้าลัดไปทำตามสูตรเด๊ะๆเลยคิดว่าน่าจะออกมากรอบ แต่สูตรต่างๆที่หลับหูหลับตาบอกไม่เคยพูดถึง fail case มีแต่ถ้าเป๊ะได้ ไม่เป๊ะไม่รู้ไม่ชี้ ไหนๆก็ fail แล้ว เลยอยากจะใช้ approach เหมือนเขียนเปเปอร์คือต้อรู้ก่อนว่าแวดวงเราใครทำอะไรได้ผลยังไงบ้าง แล้วค่อยๆเอามา debug ของๆเรา ก่อนจะ derive สูตรของเรา ซึ่งถ้าไปตรงสูตรที่อ่านมาก็ไม่เป็นไรแล้วเพราะรู้ว่าทำไมต้องแต่ละขั้น ละแต่ละขั้นถ้าขาด จะได้หรือไม่ได้ ทดแทนด้วยอย่างอื่นได้ยังไงบ้าง (เช่นถ้ารู้เหตุผลว่าทำไมต้องทิ่ม แล้วไม่มีที่ทิ่ม กรีดเอาได้มั้ย หรือต้องเป็นรูทรงกลม อะไรงี้)บทความที่อธิบายเรื่องนี้ได้ดี : https://www.exploratorium.edu/cooking/icooks/7-02_article.htmlอ่านดูตรงที่บอกว่าถ้าคนของทำขนมปังแล้วจะเกิด gluten คือ ด้วยเหตุผลแค่นี้ ทำให้ทุกอย่างกระจ่างขึ้นมาเลย แล้วพลิกแพลงต่อได้ว่าเมนูไหนควรคนมากหรือคนน้อย แต่มันเป็นสิ่งที่สูตรไม่บอกนี่สิ เพราะสูตรบอกว่าแค่ "คนให้เข้ากัน"So cookbooks are wonderful, but there's much that recipes don't tell you about cooking. Understanding how ingredients interact and the logic behind techniques helps you cook successfully. Once you know what makes a recipe work, you can fill in the gaps yourself. If you are already accomplished in the kitchen, understanding the science behind cooking is the ideal foundation for making changes and creating new recipes. Become a better cook with science!ว่าจะให้นี่เป็น guide หมูกรอบแรกในประเทศไทยที่อธิบาย fail case ได้ ไม่ใช่แค่สูตร ต่อไปนี้จะสรุป point สำคัญจากแต่ละเว็บ และเขียนไว้ว่ามีเหตุผลมั้ยhttps://kirbiecravings.com/crispy-pork-belly/ทิ่ม ไม่มีเหตุผลทาเกลือ ไม่มีเหตุผล (อร่อย?)แช่ตู้เย็น เหตุผล to dry out the skinอบhttps://rasamalaysia.com/pork-belly-recipe-siu-yuk/สูตรป้าจาเร็ต ป้าบอก ป้าไม่อบ ป้าทอด เหตุผล อบใช้เวลานาน ทำให้เนื้อแห้ง ทอดดีกว่าล้างเนื้อด้วยน้ำเย็น ไม่มีเหตุผลต้ม 15 นาทีทิ่ม ไม่มีเหตุผลทาเครื่องปรุง ไม่ต้องทาด้านหนัง ไม่มีเหตุผลทอดด้านหนังลง 5 นาที(ต่อจากนี้เวลาไม่มีเหตุผล จะไม่พิมพ์ว่า "ไม่มีเหตุผล")https://rasamalaysia.com/chinese-roast-pork/เว็บเดียวกัน แต่ทีนี้เปิดมาอย่างองอาจ "There is no need to poke the pork skin, no vinegar, no pre-boiling the pork belly." ไม่ทิ่ม ไม่สายชู ไม่ต้มอบไอน้ำ ในเตาอบใส่จานน้ำ แล้วหมูลอยอยู่ข้างบนหลังอบเสร็จ เช็ดให้แห้งด้านหนังทาเกลือหนาๆเป็นแผ่น ด้านเนื้อทาเครื่องอบร้อนกลาง 1 ชม. ตำแหน่งเตาอบคือติดเพดานเอาแผ่นเกลือทิ้งอบร้อนสูงอีก 40 นาที ตำแหน่งติดเพดานเหมือนเดิม (ทำไมต้องแวะเอาเกลือทิ้งก่อน??)https://kirbiecravings.com/crispy-golden-pork-belly/เว็บเดียวกันกับอันแรกแต่ทีนี้ ไม่ต้องทิ่ม ก็คือทำตามเว็บที่แล้วเด๊ะ"You don’t need to dry the skin overnight, marinade the meat, score the skin, or puncture holes."ใช้เกลือหนาๆ เพื่อให้หนังกรอบ "What really intrigued me was that it uses a salt crust to crisp the skin." คือพอทำเสร็จแล้วให้ยกแผ่นเกลือนี้ทิ้ง หนังข้างในจะเหลืองทองไม่ดำแช่ตู้เย็น เหตุผล เพื่อให้แห้ง "I also wanted to make sure the skin was extra dry, so I went ahead and put it in the fridge for several hours to dry out and give time for the meat to marinate."ตอนทาน้ำหมัก ห้ามทาหนัง เหตุผล ต้องให้หนังแห้งไงล่ะท่าเดิมกับเว็บที่แล้วหมด อบไอน้ำ ถอดเปลือก อบต่อhttps://www.cleverliving.nz/recipe/perfect-pork-belly/เปิดมาด้วยสามเหตุผลTo achieve a crispy crackling, you need the pork skin to be very dry.Salt helps to draw moisture out of the porkand leaving overnight uncovered in the fridge helps to dry out the pork.but if you dont have time for this a hair dryer can work wonders. ใช้ไดรเป่าผมแทนได้เอาเกลือออกให้หมด หลังจากแช่ข้ามคืน อ้าว อันอื่นเขาเอาเกลือพอกกันเคลือบน้ำมันและน้ำส้มสายชู Covering with a mixture of hot oil and DYC white vinegar ไม่มีเหตุผล อันนี้มาแปลก มีน้ำมันhttps://www.chinasichuanfood.com/crispy-pork-belly-siu-yuk/ก่อนทิ่ม ต้ม แค่ 3 นาที (อีกเว็บที่ผ่านมา 15 นาที)ทิ่ม เว็บนี้มีเหตุผลที่ดี! "The fat oil produced in the roasting process need ways to come out. Why we need oil coming through the holes? Because hot oil brings hot temperature, which can keep the rind something like gently deep-fried for a quite long time." ถ้าอบต้องมีที่ให้ไขมันออกมา (แสดงว่าตรงข้ามกับเหตุผลที่ให้น้ำมันเข้าไประเบิดผ่านรู ของแบบทอด?) ทำไมต้องออกมา? ไม่งั้นมันจะทอดอยู่ข้างในระหว่างอบ ต้องให้มันออกมาทอดข้างนอก.. อืมมทาผงฟูกับน้ำส้มสายชู มีเหตุผล! "Applying baking soda or white vinegar can help to soften the skin and thus making the crispy pork belly even fluffy" ทำให้หนังนุ่ม พอหนังนุ่มแล้ว.. จะกรอบเบา เหมือจะตรงข้าม แต่คิดดูดีๆของที่นุ่มเวลาโดนความร้อนแล้วจะโปร่งและกลายเป็นกรอบแต่ว่าสามารถล้างทิ้งได้หลังจาก 30 นาที "But the remaining flavor of baking soda may bring some bitter taste to the skin. So the best solution is to set the pork for 30 minutes and then wash the skin before air-drying." โอเค แสดงว่าผงฟูกับน้ำส้มสายชู take effect ใน 30 นาทีเข้าไปในหนังเสร็จ จบเลย ไม่มีผลตอนทำอาหารจริงๆ? ไม่มีผลกับความร้อน?ทำเกลือ เหตุผล! ดูดความชื้น "The salt layer can help to absorb water and keep the skin dry. Cover a layer of sea salt on the surface can help to absorb the water released in the early of the roasting and keep the rind dry."let it dry in the fridge. อีกเหตุผลที่สนับสนุนการใช้ตู้เย็นทำให้แห้งใช้ท่า พอกเกลือกับน้ำส้มสายชู ไฟกลาง เอาเกลือออก ไฟแรง คล้ายกับที่ผ่านมาhttps://www.chowhound.com/post/crispy-pork-belly-role-vinegar-1063206อันนี้เอามาแถม ข้างในไม่มีอะไร แต่ตลกตรงที่ว่าสงสัยเหมือนเราว่าตกลงน้ำส้มสายชูนี่เป็นเวทย์มนต์หรือยังไง แต่ก็ไม่มีใครมาตอบ 555https://www.malaysianchinesekitchen.com/siew-yoke-roast-pork-belly/ทาน้ำส้มสายชูไปเถอะ ไม่มีเหตุผล "Apparently, rubbing some vinegar on the pork skin will do the trick."พรรคแช่ตู้เย็นให้แห้ง "I would leave the meat to dry out uncovered in the refrigerator overnight."ทิ่มโดยไม่มีเหตุผลที่เหลือคล้ายๆเดิมไม่มีอะไรใหม่ ท่าอบเบาไอน้ำ แล้วอบแรงจากด้านบน แต่อันนี้ไม่พอกเกลือ ไม่มีเอาเปลือกเกลือออกมี diff จากสูตรที่ผ่านๆมา! ดูดีๆสูตรพอกเกลือ จะอยู่ top rack ตั้งแต่ต้น เอาออกมาแกะเกลือ แล้วก็กลับเข้าไปใน top rack แต่สูตรนี้ที่เกลือกับน้ำส้มสายชูอยู่แบบนั้น แล้วก็เป็นแบบโรยไม่ใช่แบบพอก ไม่มีการเอาออก ตอนแรกอยู่ rack กลางก่อน แล้วค่อยเอาจริงที่ top rack สั้นๆให้ crackle ตีเป็นความรู้ได้ว่า พอไม่มีพอกเกลือเป็น buffer แล้ว เลยต้องออมมือตอนแรกด้วยdiff นี้เป็นอีกอย่างนอกจากเรื่อง fail case ที่สูตรมักจะไม่พูดถึง ว่าสูตรเราต่างกับสูตรอื่นตรงไหนบ้างและให้ผลต่างออกไปยังไง ดังนั้นเราจะมาสรุปด้วยตัวเองhttps://www.bonappetit.com/test-kitchen/how-to/article/crispy-pork-bellyทิ่ม อันนี้เหตุผลคือ "the first step is to create "one thousand holes" in the skin so that the fat will render." Render นี้ก็คือความหมายเดียวกับคนที่บอกว่าเพื่อให้น้ำมันไหลออกมา https://www.thespruceeats.com/what-does-render-mean-2313707ทำให้แห้ง โดยการใช้เกลือกับ baking soda (baking power (ผงฟู) ที่ผ่านมา ต่างกับ baking soda..) เหตุผลคือ ดูดความชื้น (ทั้งคู่? เบสก็ดูดความชื้น?) "Scotese's trick to crispy pork belly is to rub equal parts baking soda and salt into the skin—the combo of baking soda and salt will draw out moisture and set you up for success." อันนี้ตอนแรกคิดว่า baking soda/powder เป็นตัวทำให้กรอบอย่างเดียวซะอีกอันนี้ใช้พัดลมแทนตู้เย็น Let the pork belly strips "hang out overnight, uncovered, ideally in front of a fan," which will dry them out even more.เอาเกลือกับ baking soda ออกให้หมด อันนี้ support เหตุผลเดิมว่าเกลือกับ baking soda ทำให้หนังนุ่มไปแล้ว ไม่มีประโยชน์อีกต่อไป เออแล้วก็อันนี้ยังไม่ได้ต้ม แสดงว่าเป็นขั้นตอนที่แทนการต้มให้หนังนุ่มได้? (โดยการ "ต้มระหว่างทิ้งให้แห้ง" ทางเคมีแทน?)ใส่น้ำส้มสายชู แต่ทีนี้มีเหตุผล "Then, as a final step to ensure that the baking soda is neutralized, pour a tiny bit of vinegar over the skin (the less it foams, the better—if it is foaming a lot, rinse the strips again)." แค่เช็คว่า baking soda ล้างหมดยัง (tiny bit แปลว่า ไม่ได้ตั้งใจให้เกิดเอฟเฟคทีหลัง)https://miamivores.wordpress.com/2016/03/07/crispy-skin-pork-belly/จั่วหัวอย่างองอาจว่า (no skin poking, no vinegar) คือจะ imply ว่าการเสียบกับน้ำส้มสายชูมัน undesirable แต่ที่ผ่านไม่ทำไม่ได้ไม่งั้นไม่กรอบ?The most popular method is to poke and brush on the skin a mixture of vinegar + salt or baking soda. อันนี้พูดถึงความไม่มีเหตุผลที่ผ่านมา อย่างไม่มีเหตุผลอีกรอบHowever this method is quite time-consuming and you always have to worry about not poking the skin too deep, because if you do the fat will leak to the skin while roasting and stop it from popping and turning crispy. ?? เขาบอกว่าถ้าสูตรทิ่ม แล้วทิ่มลึกไป ไขมันจะซึมเข้าไปในหนัง แล้วทำให้ไม่กรอบ ????? อันนี้งงสองชั้น คือไขมันมันคือหนังอยู่แล้ว แล้วซึมเข้าไปในหนังอีกได้ไง แล้วก็ชั้นสอง การทิ่มน่าจะเป็นการทำให้ไขมันออกมา แล้วก็ชั้นสาม เกี่ยวอะไรกับ too deep ถ้าบอกว่า fat leak into the meat อันนี้เข้าใจได้ว่าทิ่มลึก ไขมันเลยซึมเข้าไปในเนื้อแทน แต่คำว่า stop it นี้ it คือหนังแน่นอนไม่ใช่เนื้อ เพราะเนื้อไม่ใช่สิ่งที่จะ turning crispy ได้.. งงแต่สุดท้ายอันนี้ลิ้งค์ไปหาสูตรพอกเกลือ อบ แล้วเอาออก อันที่ผ่านมาhttps://www.reddit.com/r/Cooking/comments/5fia86/how_do_you_do_your_pork_crackle_oil_vinegar/หลายคนบอกว่า oil ไม่ใช่สิ่งที่ทำให้เกิด crackleน้ำส้มสายชูกับเกลือ มีคนบอกว่าใช่ (คือมีน้ำส้มสายชูตอนอบจริงๆ ไม่ได้ล้างออก)คนบอก แห้งก็พอแล้วที่จริง น้ำมันเอามาทำไม"The fat bubbles up through the cuts and makes it crispy." ทฤษฎีที่ว่าไขมันจะขึ้นมาในรูหรือรอยตัด เพื่อให้กรอบhttps://www.recipetineats.com/chinese-crispy-pork-belly/Pricking lots of holes in the skin = puffy crackling with bubbles. This is what makes all the difference ไม่มีเหตุผล..Roast covered in rock salt = crispy crackling. Salt draws moisture to the surface, helping to guarantee you’ll get crispy crackling every single time. โอเคอันนี้ใช้ได้ เกลือหนาๆทำให้ดูดความชื้น ออแล้วก็ rock salt ทำให้ไม่ตกไปในรูที่ทิ่มไว้ เดี๋ยวเค็มไป เอาไว้ดูดความชื้นล้วนๆ (บ้านเรา ใช้ดอกเกลือแทนน่าจะได้)มีอธิบายเพิ่มเติมของท่าเอาเกลือออกแล้วอบต่อแรงๆ เพราะว่าการอบเบาที่ผ่านมา เกลือ take effect ดูดความชื้นไปในเตาอบแล้ว แต่ยังไม่ได้เอาจริง เมื่อความชื้นหมดในเตาอบ (ก็คือแช่เย็นมายังไม่พอ ให้เกลือมาช่วยต่อในเตาอบ) แล้วค่อยแกะเปลือกออกแล้วยิงแรงๆใส่จังหวะที่แห้งสนิทเพื่อให้กรอบเต็มที่ข้างล่างมีอีกอย่างบอกว่า ถ้าไม่ทิ่มก็ได้ แต่จะกรอบแบบไม่มีฟอง อันนี้เป็นเว็บแรกที่แยกความกรอบกับความฟองออกจากกัน แปลว่าการทิ่มเป็น modifier ให้กรอบแบบเป็นฟองอันนี้มีอธิบายกรณีทิ่มลึกไป pierce too far into the fat (or even worse, into the flesh), the juices will bubble up onto the skin, and the wetness as the skin is being grilled/broiled will cause little splotches where the skin is not super crispy. น้ำเนื้อจะออกมาทำให้หนังกลับเป็นไม่แห้ง อันนี้โอเคเลยhttps://www.mcivorfarmfoods.com.au/pork-crackling-tips-for-the-perfect-crunch/อันนี้มี hot take ที่ไม่เหมือนที่อื่น White Vinegar helps dry out the skin ปกติคนจะบอกว่าเกลือดูดความชื้น ทีนี้น้ำส้มสายชูก็ดูดด้วย? but it has a seconda'''
