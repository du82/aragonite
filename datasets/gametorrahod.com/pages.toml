["https://gametorrahod.com/objectively-comparing-unity-and-unreal-engine"]
title = "Objectively comparing Unity and Unreal Engine"
description = "I have read from Unity Blog long time ago that talks about project stripping, explaining reproduce steps, making it easier for the QA team to make it..."
full_description = '''Unity Objectively comparing Unity and Unreal Engine I have been wanting to be able to objectively compare feature parity between different engines for sometimes. Most devs I encountered are… 5argon / Sirawat Pitaksarit Jan 16, 2019 • 94 min read I have been wanting to be able to objectively compare feature parity between different engines for sometimes. Most devs I encountered are too “cultist”, worshipping only their own is not enough but must try to obliterate the other side.. or just simply throw this line “try it and you’ll know why it is better” rather than addressing a specific advantage.I have experience in Unity for 6–8 years, while Unreal Engine is just started around January 2019. It will come in handy when I see things in Unreal Engine that is sorely missing in Unity, or just recently added but in preview status, or in a development road, etc.This article is not for Unreal Engine user, because I did not spend time explaining Unity terms. Unity user will be able to follow because you are just as new to Unreal as me while knowing what’s available in Unity.This article is in-progress. Because I can’t know Unreal throughly to judge objectively overnight. It will probably takes years to complete and make a completely fair judgement.This article is biased towards bad stuff in Unity. Because I already know what’s not so good in Unity side but not so much on UE side. Also I notice something that generally UE user are very loyal to the engine and try to convert Unity users, while Unity users actively trash talking their own engine.. I think I am becoming one of them.How I get used to Unreal will be via smaller side projects.I will not provide verdict like who wins and scores on each aspect like those phone review websites either, I don’t want you to be “too long didn’t read” on stuff.Changelog28/08/2019 : Practicality of animation system22/10/2019 : Cons of Unity packages added. Unity ECS updated. A new section called "naysayer not welcome".23/10/2019 : Added Netcode section based on Unite Copenhagen talk. Better introduction to DOTS section. Added Visual Effects section.25/10/2019 : Packages section rewritten.27/10/2019 : Added UI design section.25/07/2020 : Add additional comments section at the end, add section about QA brickwall, update UE's more friendly revenue sharing model.Duplicates / outdatesI add things to different sections as I learn over the years and I may not realize I have already said it somewhere. When I have time to re-read I maybe able to remove duplicates, but if you found them please put up with that. Also something like "previously mentioned" may not exist anymore when I edit out something and forgot that the next topic has reference to it. (Null reference exception IRL)The same for outdated section but I usually say Unity version along with it, so if it is kinda old compared to the current date then maybe trust it less?"Objectively"It is to prevent ambiguous claim. If I say "Unreal is much more powerful in 3D rendering" (this is one of the most popular claim) I would have to say exactly what is it that make the difference, that make it more powerful. If it is "just" better but I am not able to know why, I will state that explicitly.Otherwise this article will become like fanboy VS articles out there. These are some of classic claims I keep seeing over and over, without reasons :Unity can't make beautiful game. The rendering is not powerful enough as Unreal. (What technology in the pipeline made that difference? Why is it higher or lower "grade"?)Unreal Engine is not suitable for small studio. Unity is better and friendlier for indies. (Why? What is that friendliness?)Fuck Epic (Why?)Unity-made game is not scalable. You simply can't make AAA games in Unity. (Why? Where's the blocker? It would be better if you says Unity terrain system is not good because xxx, and large scale games uses terrains a lot, therefore Unity is not for large scale games. That would be objective.)C++ performance is better than C#. Why? Aren't they just languages? All things became assemblies? Didn't UE also has garbage collector? Magic? Could you tell where is the actual cost of C#, how Unity use it inefficiently, instead of attacking the language?Unity is slow, Unreal is fast. Why? If you can point out that UE's blueprint generated code is fast because instantiation of each uses C++ object pool, you are an intelligent UE user. If you can point out that Unity is slow because IL2CPP surprises, you are an intelligent Unity critic. If not, you are not objective enough. We will avoid fanboying behaviour.A thing about naysayersI know some UE devs with this mindset. He didn't appreciate technology and just want to bite Unity at any given opportunity. (Actually the same for Unity devs that targets Epic's vast fortune and attacking the CEO for throwing money at everything.) This "faction/categorization" mindset seems to be innate in human. One use Apple and automatically hate Android. One is with this skin color and hate the other color. One hate a person from this country because someone else in the country/historically did something bad. If you are in group A then you fight with group B. esports is not sports. But isn't it funny that all the problem came from just that you are being named/categorized as something? Naming and words are human's creation and we artificially did this to ourselves. Why not move the category one step back to just "technology" instead of Unity and Unreal?When I was trying to present the new Data-oriented tech stack in Unity which is exciting, he came to say UE also has the kinda same thing (baseless claim) and is also performant (is true). I have to go all the way to Unreal C++ source code even if I am no Unreal developer to show him that it is not the case while explaining where UE performance actually came from (automatic object pooling, efficient Blueprint codegen, and so on). He then completely ignores his previous claim and turns "Oh really? WOW that's amazing! Then UE must be really good that without all the DOD crap it is still fast! See!" I have nothing more to say that the whole point of him is just claim that UE is superior "overall" no matter what, and no longer related to anything I presented. He can just say this without any context on his own timeline and it still make sense. It doesn't have to be a comment to my DOTS related post at all!I simply say that the new beta is available and you also have a chance to win a sweepstake on submitting new bugs. He came to say "oh, so Unity have to beg user to test for them now?" The "for them" is alluding to how superior UE devs took care of all possible bugs and each releases are 100% clean, only waiting for user to use it free of worries, where Unity put out broken product with zero test and let user do all the work.We know that's not how beta testing works, and public testing is always a good practice for any software development. It is more likely that he never taken part of modern software development and provides feedback (UE is even open sourced, which he often claims to be a superior thing to Unity since you can modify anything, but ignores the fact that it opens way to contribute back even more than Unity which likely he never did or interested in wasting time to it.)He even adds that "it is strange for a company having to bait the test with prize advertisement". Most normally minded dev (or even my mom who knows nothing about Unity) could just view it as a nice bonus. (There are only 5 chances of winning even! You cannot even reliably get it to call that an "incentive"!) You see this kind of fanboy can turn absolutely anything to negative side as he wish. Public beta testing became laziness and ignorance. Giveaways now a dirty bait. Humans, how?? (One saner UE dev came to help in the comment and says "I think you should report problems on what you use no matter the tool or company." which I appreciate and applauds. This is the UE dev I am looking for!)I simply says a Unity package X is now available in preview and is really interesting. I added the "in preview" fully expecting him to take the bait and he did, "An another broken piece of software half-ass shipped. When will Unity stop doing this and let user easily access their junks?" Since I am still interested in his further replies, I added that he was wrong on the "easily" part that you have to turn on the PREVIEW MODE, that is hidden in the little hard-to-click dropdown, to access it. I was too tired to fix his other part "broken" vocabulary to a proper meaning of "preview software" so I let that slide and make him feel like he won half of the argument. He replied to my "easily" comment as simply "oh, I see.", and this happened in the past where I say the same thing that preview mode had to be opened first and he says the same "oh, I see".By the way other softwares including UE has preview technologies. As in it could not have worked as expected and disappear at any moment, or if it goes well then it becomes a beta. Microsoft's Blazor was a preview and became beta on 2019 too, for example. He simply wants to excert supremacy when opportunity arises and that's not constructive. He could instead says UE has this equivalent thing, not as a package but built-in, and is far better because X and Y, in which case I would be very happy because I love tech and it is always nice to know what to use and what to improve.I was talking about Quick Search package, a "go to anything" type popup in IDE now in Unity. He still says "Oh SO you have to install packages to make Unity at least usable." (alluding that UE has it all "from the beginning" and require you to do nothing) This is completely off the point of packaged design. Look how even a somwhat innocent technology like packages could be villainized by this guy! Why don't you say this to Node.js and the NPM community too? Node.js can do nothing useful by itself and therefore sucks.Any acquisition by Unity that I present is replied as "Look how desperate they are trying to replace their own broken internals." instead of strengthen the team that it supposed to mean.Even a straight upgrade in Unity (that's really good, and I didn't say "preview") could still be replied as "Finally catching up huh, Unity." The answer is yes. But he just want to say that Unity was behind and is still behind, which is off-topic but benefitting his praise UE agenda.I recently said how the talks in Unite Copenhagen suddenly shows that everything Unity broke for the last few years finally bears fruit, suddenly multiple new techs became tangible. This is due to dependency problems and Unity had to bite the bullet, now things could be built over those properly. He still came to say "The problem is, we still have to put up with instabilities for the time being." Yes, that's what a beta software means... basically a tautology of what I just said in a way that makes Unity looks a little worse for making new things? "We have to see how stable they are." This applies to everything. "But personally I was confused by Unity's UI and already used to Unreal's cleanliness." It's great that you have already found a design language that sparks creativity for you. Also there are big design change in 2019.3, it's unfair if you are not evaluating this again and refer to old Unity. This needs more elaboration as it depends on personal preferences in a large part.There are good sides about him too. If I present something really good (the most recent was UI Builder for generating UIElements components and finally editor tools development is WYSIWYG) that there is no possible openings to say any bad things, he will still come to say he is happy that Unity is now getting smarter that the era he was using (around Unity 5). It still has a slight shade throwing in a "finally catching up, huh" way but everytime this happens I know this is a good direction for Unity.I am aware I am giving him these opportunities, it is just a little addicting and fun that he always come to bite my bait every time perfectly when I am expecting, that I still keep doing it to see what he will come up next... (I will continuously add to this list as I collect the replies) Anyways! Don't be like that here.Iteration flowRight off the bat, I will start with one thing super notorious in Unity, assembly/domain reload time. If anything is a reason to stay away from Unity, this is it.That is the time it takes to enter play mode. What domain? This is not a compile time that you see the spinner, but it is the time that C# reset its state which is the pause after that spinner. And it is the pause before entering, and also after recompiling script each time. No, asmdef will not help you, that only helps with the spinner and not the freeze afterwards.At first it is not much, but as you give in to Unity and grow your project.. years passed and now to enter play mode it takes 20 seconds!! And it even doesn't have to take that long, my stupid-looking game is already taking 11 seconds to enter play mode.It is a lot, it adds up the more you want to do iterative design and it throws you off the flow, most importantly.And what’s worse, it depends on the project not the scene. If I create an absolutely empty scene in a heavy project, to enter play mode on that scene would take as long as the other scene.Judging from this thread it seems UE can iterate pretty dang fast. It is one thing that make or break the engine choice to be honest. I can see myself choosing UE just because of this.https://forum.unity.com/threads/how-about-performance-by-default-for-editor.603997/#post-4039117The most painful however, it feels like you are “tricked” into Unity by its deceptively friendly entry, but revealed later that the performance degenerates as you goes on at the same time you think you cannot go back now that you got this far. And no one could tell you about this. It may increasingly be the case that everyone has his first project in Unity and learned the lesson, and now sticking with Unreal because there is no hidden problem waiting at the very end. (Is it true?)If you ask me if I can migrate project instantly without any time cost (but you cannot come back to Unity again ever) would I move this project to Unreal? No, I still value Unity's interface. For others, I can see that this is a sound option given how important it is to quickly iterate on the play mode.This is worse than bugs which are quite rampant in Unity. Bugs could be reported and fixed. This is by design and unfortunately not a good design.How to avoid entering play modeIt is ironic that I have to avoid entering play mode when I am using a game engine. This area makes Unity sounds like a still in-development engine rather than a complete one.What is the solution then? Make a new project, lol. It's not a joke however as recently with Unity Package Manager you could link packages from other places. If you make your game in pieces, and use a new project to edit those pieces,'''
