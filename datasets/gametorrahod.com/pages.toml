full_description = "Unity Publish Asset Store UPM package on which LTS version? As a package publisher, supporting lowest possible version is ideal for covering your user bases and therefore increase revenue. But in exchange, using version too low will results in many difficult problems. Nov 28, 2021 10 min read Unity UnityEvent Serialization Research I always forget what is the criteria so UnityEvent could target on the dropdown. By writing this article I could come back and read instead of trial-and-error! Oct 4, 2021 11 min read Unity EventSystem raycast debugging guide Using EventSystem along with GraphicRaycaster, PhysicsRaycaster, or Physics2DRaycaster, and something didn't hit the way you expect it to? Let's dive into the code to debug this. Jul 23, 2020 7 min read Unity Looking into Unity's async/await async already works in Unity without any kind of plugins or coroutine wrapping the Task and pseudo-async it by checking completion every frame. But it is kind of magical. Let's try to dig into it a bit more. Mar 3, 2020 8 min read Unity Visual Studio Code vs Rider for Unity Visual Studio Code is almost perfect, very very few annoyances. But in this competitive scene of text editor, it is tempting to pay just to eliminate those annoyances from the tool I touch every day. Dec 15, 2019 34 min read Unity How to remodel your project for asmdef and UPM In this article I will guide you to adopt asmdef and (internal) Unity Package Manager in your existing project. It will be harder than if you do it from the beginning, but that's why I have written this guide. Dec 13, 2019 18 min read Unity Unity Firebase SDK behaviour the docs didn't tell you For example there is persistence built in that let you preserve anonymous ID between app runs. Sep 15, 2019 5 min read Unity Unity & Android App Icon in 2019 I thought Android device fragmentation was bad. Now icon fragments too. Google introduced the first new standard in Android 7.1 as rounded icon. Then just one API level later, introduces adaptive icon. What do you want now? Aug 11, 2019 13 min read"
