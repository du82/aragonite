full_description = "Technology แนะนำโปรแกรม DaVinci Resolve แทน Premiere Pro ฟรีและดี ที่ดีที่สุด คลิปที่ผมเพิ่งลงไป จริงๆไม่ใช่แค่ทำเล่นๆแต่จะลองใช้โปรแกรมนี้ “DaVinci Resolve” ของ Blackmagic Design ที่สำคัญที่สุดเชื่อมั้ยว่า ฟรี!! 5argon / Sirawat Pitaksarit Mar 12, 2018 • 1 min read คลิปที่ผมเพิ่งลงไป จริงๆไม่ใช่แค่ทำเล่นๆแต่จะลองใช้โปรแกรมนี้ “DaVinci Resolve” ของ Blackmagic Design ที่สำคัญที่สุดเชื่อมั้ยว่า ฟรี!! แบบ no string attached! (ทำจน export แล้วยังไม่อยากเชื่อว่าโปรแกรมระดับ Premiere Pro นี้จะฟรีต้นจรดปลาย) ไม่ใช่โปรแกรมฟรีแบบโง่ๆด้วยลองใช้แล้วรู้สึกโปร กว่าโปรแกรมไม่ฟรีที่มี tier ถูก-แพง/trial-full บางตัวอีก เป็นไม่กี่เจ้าที่กล้าทำ free-paid ครับDaVinci Resolve | Blackmagic DesignRevolutionary new tools for editing, color correction and professional audio post production, all in a single…www.blackmagicdesign.com(Win/macOS/Linux)ช่วงนี้ผมกำลังถอดสัญญาทาสจาก Adobe อยู่เลยลองหลายๆอย่าง ชื่ออาจจะฟังดูแหม่งๆ แต่รู้มั้ยครับว่า Blackmagic Design นี่เป็นยี่ห้อกล้องวิดิโอระดับโปร ใช้ถ่ายหนังถ่ายสารคดี ฯลฯ ที่ดังยี่ห้อนึงเลย เขามีซอฟต์แวร์ด้วยแล้วนี่ก็เวอร์ชั่น 14 แล้วUI มีหลายจุดที่ผมชอบกว่า Premiere Pro ด้วยซ้ำครับ คีย์ลัดที่ยังหาไม่เจอก็แค่ slice + ripple delete (ตัดจุดปัจจุบัน ลบที่ผ่านมาจนชนจุดตัดที่ผ่านมา แล้วเลื่อนข้างหน้าทั้งหมดเข้าจนไม่มีช่องว่าง) ถ้าเจอก็ครบทุกอย่างที่เคยใช้ หน้า color grading ก็ดูดีมากๆครับ ผมว่าดีกว่า Lumetri ของ Premiere Pro อีก ใหญ่ๆ ดูง่ายๆ แต่ก่อนโปรแกรมนี้แพง แต่เพิ่งเปลี่ยนโครงสร้างราคาเป็นฟรี แล้วจ่ายเงินซื้อเวอร์ชั่นที่มีเอฟเฟคเยอะขึ้นได้ไม่นานนี้ มีฟรีแบบนี้ โหลดติดเครื่องไว้ทุกเครื่องไว้ก็ได้เลยภาพที่เห็นผมอยู่ในหน้า export ซึ่งแถบข้างล่างสุดใช้สลับหน้า มีหน้า project management, edit, color grading mix เสียง และหน้า export หน้า mix เสียงนี้ผมดูโปรกว่า Premiere Pro มากครับ ใกล้เคียง layout ของโปรแกรมแต่งเพลงใครที่ใช้ After Effects ด้วย บ. นี้ยังมีโปรแกรมอีกตัวชื่อ Fusion (https://www.blackmagicdesign.com/products/fusion)Fusion 9 | Blackmagic DesignFusion is the world's most advanced compositing software for visual effects artists, broadcast and motion graphic…www.blackmagicdesign.comแต่อันนี้มี methodology ต่างจาก AE พอควรครับ (node-based ไม่ใช่ layer based) ผมลองใช้แล้ว ยังคิดว่า AE เป็นโปรแกรมที่เหนือกว่าในทางของมันอยู่ไม่ใช่สลับแทนกันง่ายๆ ถ้าใช้ Fusion ต้องเรียนรู้ปรับสมองกันยกใหญ่เขาก็พยายามจูงใจนะ แต่จะมาสู้กับโลกแห่ง layer ที่ Adobe ปลุกปั้นมาคงเป็นเรื่องไม่ง่าย 555จากประสบการณ์หาของแทน Adobe ผมว่าเหลือ AE นี่แหละที่เป็นโปรแกรมที่ดีมากไร้คู่แข่งจริงๆของ Adobe ซึ่ง PS กับ AI ผมก็แทนด้วยของ Affinity ไปแล้ว (แต่ของแทน Photoshop มีบัคพอสมควร.. ด้านของแทน Illustrator ค่อนข้าง win) ส่วน Premiere ก็ใช้ DaVinci Resolve แทนได้แล้ว"
