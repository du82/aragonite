full_description = '''Unity Publish Asset Store UPM package on which LTS version? As a package publisher, supporting lowest possible version is ideal for covering your user bases and therefore increase revenue. But in exchange, using version too low will results in many difficult problems. Nov 28, 2021 10 min read Unity UnityEvent Serialization Research I always forget what is the criteria so UnityEvent could target on the dropdown. By writing this article I could come back and read instead of trial-and-error! Oct 4, 2021 11 min read Art / Audio 34-key Kalimba music theory analysis Seeds Kalimba "Pisces" is a pretty interesting 34-key Kalimba! I love when a brand try to pioneer something and there are not much information anywhere else, I wanted to be at the frontier and experiment. Sep 1, 2021 24 min read Technology "Tibetan Breaking" Specification Tibetan Breaking is a convention to encode line breaking opportunity inside the string data itself, using a Tibetan interpunct ⟨་⟩ character, called ཙེག་ (tsek). Feb 18, 2021 6 min read Technology Dumb i18n site I don't know how to call this sort of internationalization scheme on a website so I coined it for my own use. Explaining this gets repetitive so I made this article to link to every time I wanted to talk about it. Feb 17, 2021 6 min read Unity EventSystem raycast debugging guide Using EventSystem along with GraphicRaycaster, PhysicsRaycaster, or Physics2DRaycaster, and something didn't hit the way you expect it to? Let's dive into the code to debug this. Jul 23, 2020 7 min read Unity Looking into Unity's async/await async already works in Unity without any kind of plugins or coroutine wrapping the Task and pseudo-async it by checking completion every frame. But it is kind of magical. Let's try to dig into it a bit more. Mar 3, 2020 8 min read Unity Visual Studio Code vs Rider for Unity Visual Studio Code is almost perfect, very very few annoyances. But in this competitive scene of text editor, it is tempting to pay just to eliminate those annoyances from the tool I touch every day. Dec 15, 2019 34 min read'''
