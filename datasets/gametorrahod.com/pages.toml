["https://gametorrahod.com/how-to-asmdef-upm"]
title = "How to remodel your project for asmdef and UPM"
description = "In this article I will guide you to adopt asmdef and (internal) Unity Package Manager in your existing project. It will be harder than if you do it from the beginning, but that's why I have written this guide."
full_description = '''Unity How to remodel your project for asmdef and UPM In this article I will guide you to adopt asmdef and (internal) Unity Package Manager in your existing project. It will be harder than if you do it from the beginning, but that's why I have written this guide. 5argon / Sirawat Pitaksarit Dec 13, 2019 • 18 min read In this article I will guide you to adopt asmdef and (internal) Unity Package Manager in your existing project. It will be harder than if you do it from the beginning, but that's why I have written this guide. Also it is so that in the future, your new part of code could be in UPM properly for more orderly one-way reference.This article assume you know basic benefits of it and how it works with folder structure to group your scripts. This article will start by going over some benefits that may not be obvious to you, so that you are motivated to do it.BenefitsCompiles faster with the built-in incremental compiler. This is not even its full power, as I heard from the forum that Unity is prepping for no domain reload play mode enter and faster hot reload on script changes. That could be depending on how well you separate asmdef today. (A guess, but likely) Today, it do not affect enter play mode time unfortunately.Allows you to name your folder that previously must be named exactly Editor as anything else, with editor asmdef. (But you should name them Editor anyways..) To do this, make sure Any Platform is unchecked, then only Editor is checked for Include Platforms.Previously all your Editor folder scripts do not ended up in your game, now it is the same except that they could be separated by dll, decrease compilation speed for even editor code.Test assemblies. They have their unique problem. To make an edit mode test assembly, do the same as editor asmdef except check that Test Assemblies box. This is the same as putting tests in the Editor folder.However the real benefit is in making the play mode tests. Previously there is a problem that you want to test something in play mode the script must stay out of Editor folder, then they will be included in the game too if not removed manually.Now with that Test Assemblies check box plus non-editor setup, you get something usable in play mode and even in real device test but somehow not in the real game build! To get a special behaviour of allowing play mode test in the real build, press this button. Without asmdef this button is also usable but they will also be in your game for real.As a bonus you could rank your script's weight at glance in Library/ScriptAssemblies. I once caught an error here when one of my plugins included a huge baked constants that I should remove.Make you an organized, clean coder, since it will not allow you to make messy dependencies. In a way, this is a unit test for code organization.asmdef pave way to UPM, which could share code between your projects or even open sourced online. This is the ideal form of module based development, but for starters let's try to segment an already messy game into asmdef without UPM first.Will this make your game easier to hack when they could see all your dll separated up nicely? Maybe, but your single dll game is also hackable if the hacker wanted to see your symbols anyways.Earn additional income by prototyping a would-be/potential Asset Store items as a package with thier own asmdef in their own project. Field test them in all your real projects easily without copy, with UPM link and asmdef link.UPM warrants its own topic, which is not the same as asmdef but closely related.Unity Package Manager is going full asmdefFor those who didn't catch up yet, we used to read Unity version release change log. Now they do it NPM style, each internal team that work on a feature could push an update on their own, each with its own CHANGELOG.md. This is a great initiative! All these fun stuff available to play with. (And more bugs to report!!)UPM works with package.json at root of the package's folder much like NPM, but it is customary that you should do asmdef also. The official pattern looks like this :Company.PackageName : For the main partCompany.PackageName.Editor : For the editor only part (references the main part)Company.PackageName.Editor.Tests : For unit test / edit mode test (references the main part)Company.PackageName.Runtime.Tests : For integration test / play mode test (references the main part)For example, my plugin Introloop looks like this with an additional "Demo" assembly.Since my demo scenes has some debug scripts to show how things work. When my customer wants to use the plugin, if they adopted asmdef already, they could include only non-demo part to their game. (If they don't, all non-editor asmdef will be referenced like usual) Also it helps sanity check me that I don't use something in the demo from my main part.I will explain to UPM your own game along the remodeling section. But first let's see some obstacles that you must overcome.Asmdefs are infectiousYour game completely devoid of asmdef was perfectly fine. But your game with just one asmdef became quite troublesome. (Maybe you just want that test assembly, maybe you want to do it only a little at first)They are "infectious" (similar to things like async/await programming) that if you don't do it all, you can't do it at all. To see why :Overviews to keep in mindAnything in asmdef are now secluded from the world, where previously it knows everyone. You have to link up asmdef to get it to know each other.Anything in asmdef still know all precompiled .dll like before. For example if you have Firebase Unity SDK which consists of closed source code packed in .dll, all your asmdef has access to it. You don't have to link them up. Except one dll ...Everything not caught in asmdef will be in the catch-all Assembly-CSharp.dll. This .dll has one big problem : none of your asmdef implicitly know this dll, and cannot explicitly reference it. Not even with Override References. It must be the terminal node of the "reference graph".This includes if you decided to write a test in its test assembly while keeping everything else in the game as before (spilled out to catch-all dll) Now turns out the test cannot test anything, since the thing to test cannot be referenced to the test assembly. You face a dilemma because you don't want to ship test code either. Now you must asmdef an entire game, which brings to this article.If you check Override References it will remove the mentioned "know every .dll" ability and let you explicitly define each one. The box below will not appear if you didn't check it. "References" in this context meant .dll only, not asmdef.The link cannot form any circular dependency. This is the most common roadblock that make you give up on using asmdef and this article will advise how to avoid this.This is why UPM package could be 100% asmdef'd and should be, because by nature they are plugins and do not depend on something specific to your game. The reference direction is one way : your project use the package.Together, it cause trouble like these :Can't reference Assembly-CSharp.dll problemYou only want to pack up your play mode test code in an asmdef and not touch anything else in the project. But obviously your test code should at least check on something in your game, like if start at this scene and wait 10 seconds it should show this and that.Sure, you can start a scene with string, and wait, and then use magic method like GameObject.Find to try to blindly auditing the environment without actually what they are. But these tests are brittle and break when you change the scene's content.You want your test assembly to reference anything else but it is not possible to do it with Assembly-CSharp.dll. Check mate, you delete the asmdef and think this is a waste of time.The bridge problem you see some folder that looks self-contained and would be nice to place asmdef on. (For example "TitleScreen") By placing the asmdef on just this folder and let everything else go to Assembly-CSharp.dll, if any of the other scripts has a reference to things inside this TitleScreen folder, you are now out of luck unless you move it to the same asmdef.What could be these "bridge" things? The most common is something that interconnect scenes. You may have SceneTransitionManager for example, which is like a static hub that was designed that everyone could call and move to the other scene, along with passing some data to the destination scene + clean up. The everyone-could-call part is fine, but if you have something like TitleScreen.options.noIntro = true in your scene transition, you are now shooting yourself with circular dependency.Then you may think let's just move that into the TitleScreen's asmdef. Now the other screen's asmdef have to link to TitleScreen's asmdef for strange reason that they just want to access the utility. This is what I call "the bridge problem" since the bridge needs to know everyone, and everyone must call the bridge somehow, therefore the dependency is not one way and it prevents us from remodeling into asmdef.How to fix this problem comes later while we are remodeling together.The planThe most logical unit of asmdef for your game I think is scenes. (depends on game genre still) We will try divide the asmdef equal to your scenes/screens. Like title, mode select, game play, credits, shop, etc. The name will be Company.MyGame.SceneName.Plugins + your own multi-project common code should all be thrown away to UPM and 100% wrapped in asmdef. If it errors after you do this, the plugin is coupled to the game and you should not call it a "plugin".There is something called Company.MyGame.Core, which ALL scene asmdef could reference but not allowed to reference anyone else except plugins.There is something called Company.MyGame.Scripts that try to catch anything else not fallen into "Core" or any of the scenes. This is not allowed to reference any scene assembly, but can reference the "Core".When you achieve all these, you will not see Assembly-CSharp.dll. Indicating that Company.MyGame.Scripts had taken place, but this time it removes the "not able to reference Assembly-CSharp.dll problem!Example references : The arrow shows explicit reference that must be specified on asmdef. The .dll are implicitly known by everyone.Step 1 : UPM your Asset Store plugins / .unitypackage you boughtMost developers hadn't put either package.json or even asmdef yet. You could do this like so :Make a new Unity project called "My Asset Store Plugins" or something.Use Asset Store in the editor to download the plugins.Put asmdef in the plugin's folder accordingly.Put package.json. Copy the pattern from Unity's official package. The version must be semver compatible (x.y.z)Use Package Manager's + button to locate each local package.json as desired from your game project.This approach make it easy to update these plugins by coming to this "plugin galore" project and press update in Asset Store tab, so it overwrite files in their intended location, then the change will be reflected in ALL your games that use these UPM.You should not get any errors even if no other part of your game became asmdef yet, since all your things should be in Assembly-CSharp.dll, and this dll knows all asmdef (including one that came from UPM) and all other dlls. This is why this is a step 1. Go make sure your game compiles now.For .unitypackage, do the same thing except this time they didn't came from Asset Store, so you could put them wherever (even in a normal folder that is not Unity project! But you need a Unity project to unpack .unitypackage anyways). I put them together in the same "My Asset Store Plugins" project as my Asset Store items.For example, I was able to UPM the Spine .unitypackage by adding 2 asmdef and 1 package.json :{ "name": "com.esotericsoftware.spine", "displayName": "Spine", "version": "3.7.0", "unity": "2019.1", "description": "2D animation for games.", "keywords": [ "animation" ] } Then it will show up :Some plugin cannot be a package since : They try to do something related to their script position, or write something to its folder (bad practice!) in that case you will see some errors as you use them. This doesn't mean you can't put asmdef. For example, I found that I2 Localization as UPM package throws something about writing file to somewhere as I use them. (It compiles) But I am able to put just asmdef on and let it lives in the project. It is still better than nothing, just that if your another project want to use this you must copy, then update on each projects individually.One another instance is Google Play Game Services (GPGS), where I could put asmdef and let it be in my project. But once I tried to do UPM, it complained : Indicating that the plugin really wants that exactly named "GooglePlayGames" folder cluttered directly in yout Assets. Ugh..The plugin contains tons of dll, which are useless to asmdef in the first place. Some example of these are Firebase Unity and Odin Inspector. You must let them sit normally in the project. .dll plugins aren't bad, in fact you are putting asmdef so that they became little .dll. .dll plugins aren't recompiled together with your project, but more difficult to debug.They are arranged in strange folder combination. For example has multiple Editor folder sandwiched in multiple subfolder that you think it is a hassle to arrange them and have to do it again on the next update.They wants to be in a special folder like Plugins. In this case, since you could have only one Plugins folder in your project you cannot use UPM.You could try putting asmdef regardless inside the Plugins folder and if it works, it means it doesn't really need to be in Plugins folder! One example is Maintainer, which is an editor-only plugin. I could left that in Plugins folder in my "My Asset Store Plugins" project, then from my game link to package.json inside that Plugins folder. You should not pull it out of Plugins even if you know they work regardless, since it will be easier to update from Asset Store if you keep the same shape.Take .meta files with the package!!!The .meta file contains GUID which actually links things in the scene that use these scripts to the actual script. If some day I moved my Asset Store code somewhere without copying .meta file, I am breaking all my customer's existing projects.Think of it as the identity/lifeline of each of your file. You can rename the code's file name as long as you also rename the .meta file (this is automatic if done in Unity editor), or else it will destroy the .meta file and generate a new one. This is a serious problem.The only somewhat negligable case is .meta file of folders. But those are still serializable by something like UnityEngine.Object on your ScriptableObject. It could still disconnect! For example my in-development plugin contains a feature that remembers folder to scan its content. If this folder's .meta file changes it won't be able to locate the same folder since all i'''
