["https://gametorrahod.com/analyzing-burst-generated-assemblies"]
title = "Analyzing Burst generated assemblies"
description = """
In this article, I will challenge Unity's Burst compiler with various job code, and we will along the way learn about what's performant for the game.
Get ready for the great assembly adventure, Unity had never been so hardcore about stuff this low level!"""
full_description = '''Unity DOTS Analyzing Burst generated assemblies In this article, I will challenge Unity's Burst compiler with various job code, and we will along the way learn about what's performant for the game. Get ready for the great assembly adventure, Unity had never been so hardcore about stuff this low level! 5argon / Sirawat Pitaksarit Apr 1, 2019 • 53 min read In this article, I will challenge Unity's Burst compiler with various job code, and we will along the way learn about what's performant for the game.Get ready for the great assembly adventure, Unity had never been so hardcore about stuff this low level!*Everything here is compiled with Burst 1.0.0 preview 8, by the time you are reading this it could be much more intelligent.Preface : Where is the performance?In Unity DOTS, they promised performance from several sources.Keep the worker thread busy working while not driving you crazy while programming it, achieved with C# Jobs and further streamlined with JobComponentSystem where it connects to the ECS database directly. I am so glad we don't have to do mutex stuff in the game at all yet all the reads and writes are already avoiding/waiting each other beautifully!Exploit spatial and temporal locality of reference. When CPU have to get something from RAM to the cache, it should dragged in as much related stuff as possible, and not have to get them again as long as possible. Ensured with custom made tight ECS database. The C#'s default new on the class will destroy this at almost every . you use.The generated assembly is smart, use only the good stuff. Ensured with Burst + HPC# coding restriction that eliminates the case that could not be optimized. After that, we optimize what could be optimized. <- This article's concern. What are those?Programming games in traditional OOP destroys everything mentioned thanks to the evil reference type. That's why Unity is building a new foundation from the ground up that makes working with struct type bearable, automatic optimization possible, (and fun).Preface : In the end we all become one with the assemblyDid you have elitist programmers in your social network? They started programming in high school and now keep saying C++ is the best and today's programmers "have it easy" with C#, JS, etc. ? Kids nowadays have no knowledge of basics and goes straight to popular libraries / NPM ? These kind of guys sometimes are just not pleased that others don't have to go through SIGSEGV as they did.(I once met this kind of programmer at a job interview. Got tasked to do bubble sort by hand on the whiteboard, forgot the concept and doesn't allowed to use Google so I failed the interview lol)Turns out all that matters is the generated assembly instructions. With Burst we are trying to make the best assembly from C# while saving you from SIGSEGV. The generated code is like you are using pointer arithmetic, without actually using them. Before that, some terms.TerminologyWord size depends on architecture (32/64), but for some reason when you see "word" in assembly language that means 16 bits. So for some example : Byte integer = byte (8)Word integer = short (16)Double word integer = int (32)Quad word integer = long (64)For example the register xmm is of size 128 bit. You could say one xmm is able to hold 2 quad words, or 4 double words, or 4 int.Instruction set architecture, is.. assembly is not actually a language but a category for all of that kind of languages "for CPU". Those language basically just load, calculate, and store stuff. But we have been making wonderful creations from just that.Everything in this article is based on Unity's "auto" settings. This settings seems to select the most cutting edge of x86-based instruction developed by Intel.If you want to do it too, remember to turn off Safety Checks like in the picture.x86-style instruction do receive upgrades and new instructions to play with over time. For the evolution timeline, I will just borrow Wikipedia's bottom section here.And so with "auto" I think Unity is choosing AVX512. For example it comes with some great commands like "fused multiply and addition" at the same time. (Seen as vfmadd231ss in the image, which fmadd stands for that) If you select a lower patch in the drop down, you will see the debugger adjust accordingly with alternatives.With that out of the way, the source of all performance is choosing the good stuff. You can tell what is a good stuff by...Command that do work on a big registerWhen you see a register like xmm or ymm being used, you could guess it is doing a good chunk of work since the size of that register is 128 and 256 bit respectively. Many commands accept this big register. You could just search in Burst debugger and see if there are any xmm or ymm instead of knowing which command supports big register.However sometimes it do use xmm for a single value operation! So it is not 100% that it is doing a tons of work.Command's optionFor example, this command is a good one.vmovapsmov is just moving data from one register to an another. But look at the options!v = vector extension, specifying that it supports the VEX extension standard. (https://en.wikipedia.org/wiki/VEX_prefix) There is also an upgraded version called EVEX prefix and they also use v prefixed opcode.a = aligned : Usable when the data aligned with "word size" of the machine. (If u = unaligned) I guess when this is present it means the command is more efficient?p = packed : It uses packed arithmetic. I don't know about it much but it is something that could compute floating points in integers, increasing speed. (You could read more here) Sometimes when it is not packed you see s for scalar instead. In some place on the net I read, packed is called vector.s = single-precision : When you do something to float it is bound to be faster than double at assembly level. If you see ss somewhere it probably stands for scalar + single-precision.From these you could understand what is vadd and subps for example. If you are too lazy to remember, just look for the a or p because that's usually a good variant. (More examples)But imagine if you are roleplaying as a compiler that tries to compile C++ to assembly. You would have a very hard time finding place to use the p or a variant! Or thinking should we do it little by little or could we use ymm? Or the half sized xmm?Luckily we got High Performance C# subset and the no-mercy Unity code analyzer. It became easy for Burst to just add the good stuff everywhere without worry. (Worry = aliasing problem, reference fields, ...)For assembly reference you may have this handy while debugging your bursted code. Just make sure you are using "auto" or x86 based instructions.https://www.intel.com/content/dam/www/public/us/en/documents/manuals/64-ia-32-architectures-software-developer-instruction-set-reference-manual-325383.pdfLLVMThis is an excellent talk from Unite LA 2018 explaining why are we standing on top of existing LLVM :Before we witness the optimization it is helpful to know that Burst is using low level pieces from LLVM. And there are many optimizations available in there : https://llvm.org/docs/Vectorizers.html.However we have to still credit Burst and DOTS design that enables optimized use of LLVM in the first place, all in a nice C# environment.The big registers : xmm ymm optimizationFrom the official Burst documentionhttps://docs.unity3d.com/Packages/com.unity.burst@0.2/manual/index.html#supported-net-typesNote that for performance reasons, the 4 wide types (float4, int4...) should be preferredWe will see the assembly why that is the case. If you read the preface, could you guess what would make a difference in the final product? These 2 jobs just copy data. But one struct is float3 and one another is float4. Did your intuition say that more data must cost more performance?public struct S1 : IComponentData { public float3 xyz; } public struct S2 : IComponentData { public float4 xyzw; } [BurstCompile] public struct J1 : IJob { public NativeArray<S1> s1a; public NativeArray<S1> s1a2; public void Execute() { for(int i = 0; i < s1a.Length; i++) { s1a2[i] = s1a[i]; } } } [BurstCompile] public struct J2 : IJob { public NativeArray<S2> s2a; public NativeArray<S2> s2a2; public void Execute() { for (int i = 0; i < s2a.Length; i++) { s2a2[i] = s2a[i]; } } } Left is J1, right is J2. The mov, jle , and then later add is obviously the for loop's condition. In between must be what we are looking for.Left side, Intel's terminology says word is 16 bits regardless of architecture. So what it is doing is move quad word qword and double word dword to store in temp register rdi and ecx then move from that to the destination location. Quad and double happen to sums up to (16 * 4) + (16 * 2) = 32 + 32 + 32 and that's 3 float. You see Burst is trying to be smart about the first 2 float too.But the right side is vastly more efficient. You see vmovups and you recognize the xmm. That must be a good stuff. I don't know how to write a code so that it turns u (unaligned) into a (aligned), but maybe it is impossible to determine here if our NativeArray is aligned or not, so we get u.xmm is 128-bit register! (Maybe unavailable in some machine, but we should assumpe it is available) We could store a whopping 32 + 32 + 32 + 32 bits here and this is exactly what we are doing. Use xmm0 as a temporary storage for a bit, then copy in packed mode to the destination thanks to the packed command p.Though, on both side you may wonder why it copy to a temporary register before meticulously pouring that into the destination. Why not just do a direct memory copy? Actually assembly could not put memory operand on both sides. This packed copy is the fastest.Also don't forget the [ReadOnly] on the NativeArray that is not the write target. It won't help generate any better assembly but will help Unity complete as less job dependencies as possible, making ECS less defensive (and go offensive).Summary : Good assembly code used big registers for you, even though what you did in the code was far from it.Deliberate paddingThis time I use float3 on both, but one starts at offset 4! Pack on the StructLayout is not usable with Burst, we are making an empty hole manually instead with LayoutKind.Explicit.public struct Unpadded : IComponentData { public float3 x; } [StructLayout(LayoutKind.Explicit)] // <------ public struct Padded : IComponentData { [FieldOffset(4)] // <------ public float3 x; } [BurstCompile] public struct UnpaddedJob : IJob { [ReadOnly] public NativeArray<Unpadded> source; public NativeArray<Unpadded> dest; public void Execute() { for (int i = 0; i < source.Length; i++) { dest[i] = source[i]; } } } [BurstCompile] public struct PaddedJob : IJob { [ReadOnly] public NativeArray<Padded> source; public NativeArray<Padded> dest; public void Execute() { for (int i = 0; i < source.Length; i++) { dest[i] = source[i]; } } } Turns out this time we could also get vmovups upgrade even with float3 type! Burst seems to know that the struct is of size 4 bytes and able to be in ymm nicely, no matter we intentionally make a hole or not. Note that this optimization is possible because it is a copy job where we don't need each individual value.4x float vs float4From the deliberate padding test you see Burst knows how to merge variables. In the prior case, it knows that " [empty] + float3 ... ok, let's just use xmm0 and copy the beginning space (whatever it is, an undefined memory?) altogether!" We will challenge it with an another test. public struct S1 { public float x; public float y; public float z; public float w; } public struct S2 { public float4 xyzw; } [BurstCompile] public struct MergeThis : IJob { public NativeArray<S1> source; public NativeArray<S1> destination; public void Execute() { for (int i = 0; i < source.Length; i++) { destination[i] = source[i]; } } } [BurstCompile] public struct Normal : IJob { public NativeArray<S2> source; public NativeArray<S2> destination; public void Execute() { for(int i = 0 ; i < source.Length; i++) { destination[i] = source[i]; } } } You get exactly the same assembly! Because the job is a copy, it only cares if it could use the xmm or not. 4 float has the same size and assembly compatibility as one float4. Note that because the job is a simple copy that the comparison is easy. If we do calculate on each field it would get more complex. But in this section, we focus on what could trigger xmm and ymm usage. (More in the Mathematics section!)xmm ymm smartness testWe now know Unity could understand to merge individual fields to some extent (for copy). If your struct is instead this :public struct Arrangement { public float a; public float b; public float c; public float d; public float e; public float f; public float g; public float h; } Too lazy to paste assembly but basically you will get ymm instead of xmm. ( ymm is 256 bit = 8x float/int) You just doubled the work for the same performance! Nice!How about public struct Arrangement { public float a; public float b; public float c; public float d; public float e; public float f; // public float g; // public float h; } (Irrelevant section omitted)mov rdx, qword ptr [rdi] mov rsi, qword ptr [rdi + 56] vmovups xmm0, xmmword ptr [rdx + rcx - 20] # <--- 4 floats mov rdx, qword ptr [rdx + rcx - 4] # <--- 2 floats vmovups xmmword ptr [rsi + rcx - 20], xmm0 mov qword ptr [rsi + rcx - 4], rdx Still good! It uses xmm once for 128 bit (4 float) and then use normal mov for quad word, because my architecture is 64 bit, rdx is able to hold 2 float.If you uncomment public float g, it would do xmm + quad word + single float.And also because vmovups command does not compute anything, it doesn't care about the underlying data type. So even if your struct is like this :public struct Arrangement { public float a; public int w; public float b; public int x; public float c; public int y; public float d; public int z; } It still results in a single ymm movement. Turns out, int could be counted as "scalar" the same as float. (And so the suffix s is usable for both)Struct arrangement testIn this subsection we will try to bully Burst. Continued from the last section, how about this? double is 2 times the size of float, therefore I comment 2 float out and replace with that.public struct Arrangement { public float a; public int w; public float b; public int x; public double yeah; //public float c; public int y; //public float d; public int z; } mov rdx, qword ptr [rdi] mov rsi, qword ptr [rdi + 56] vmovups ymm0, ymmword ptr [rdx + rcx - 28] vmovups ymmword ptr [rsi + rcx - 28], ymm0 Still results in a single and neat ymm! Even if it is double, since we are not computing anything the s suffix of vmovups is still used to do all the work. Damn! Then,public struct Arrangement { public float a; public int w; public float b; public double takeThat; // <--- moved up public int x; //public float c; public int y; //public float d; public int z; } mov rdx, qword ptr [rdi] mov rsi, qword ptr [rdi + 56] '''
