title = "ใครเขาใช้แป้ง *** กัน"
description = 'ไปคุยกับแม่หรือเพื่อนมา เตรียมโง่ไว้แล้วแล้วก็โดนจริงๆ "ใครเขาใช้แป้ง X ทำ Y กัน" ถามต่อว่าทำไม ถ้าเปลี่ยนเป็นแป้ง Z แล้วจะเป็นยังไง ก็จะไม่ได้รับคำตอบแล้วจบแค่ที่ว่าเราทำผิด!'
full_description = 'ใครเขาใช้แป้ง *** กัน ไปคุยกับแม่หรือเพื่อนมา เตรียมโง่ไว้แล้วแล้วก็โดนจริงๆ "ใครเขาใช้แป้ง X ทำ Y กัน" ถามต่อว่าทำไม ถ้าเปลี่ยนเป็นแป้ง Z แล้วจะเป็นยังไง ก็จะไม่ได้รับคำตอบแล้วจบแค่ที่ว่าเราทำผิด! 5argon / Sirawat Pitaksarit Aug 8, 2019 • 2 min read Update : ตอนนี้ย้าย blog อาหารไปอีกที่แล้ว จะได้ไม่ปนกับ blog โปรแกรมมิ่งครับ : https://jingjang-cooking.com/flour-why/วันหนึ่งอยากทำอาหารกรอบๆบ้าง ก็เลยไปซื้อแป้งไว้ชุบทอด จริงๆตอนนั้นไม่เคยทำอาหารกรอบซักครั้งในชีวิตแต่เพราะชื่ออาหารคือชุบแป้งทอด ก็เลยเดาวิธีทำได้ว่าควรไปซื้อแป้งมา แล้วก็ชุบ แล้วก็ทอดไปถึงร้านเจอแป้งหลายแบบ ก็เคยได้ยินคำว่า "ชุบโกกิ" มาบ้างนั่นก็น่าจะเป็น safe choice แต่คิดว่าอยากลองแป้งแบบอื่นๆดูก็เลยซื้อแป้งมันสำปะหลังมาผลออกมาคือชุบแล้วเป็นเมือกๆ ไม่กรอบ 555 ผิวนอกเกรียมแต่ผิวในใสเป็นวุ้น! สุดท้ายหลุดออกหมดกลายเป็นของไม่ชุบแป้งทอด ก็เลยไปคุยกับแม่หรือเพื่อนหลายๆคนมาแน่นอนผมเตรียมใจโง่ไว้แล้ว แล้วก็โดนจริงๆ "ใครเขาใช้แป้ง X ทำ Y กัน" มันจะเจ็บตรง "ใคร" เพราะรู้สึกเหมือนเราไม่รู้อยู่คนเดียวเหมือนเดินทางอยู่แล้วไม่รู้ว่าต่อไปจังหวัดอะไรแล้วถามแม่เลยต้องยอมโดนด่าว่าเอาแต่เล่นเกมไม่สนใจประเทศชาติ แบบนี้โตไปใครจะอยากมาใช้ชีวิตอยู่ด้วย แล้วก็เชื่อมโยงยาว เอื้อ.. คือจะกูเกิลก็ได้แต่อยากพูดคุย แบบนี้แหละครับคนไทยถึงเก่งแต่ลอกที่ "เขา" ว่ามาอย่างเดียว ไม่กล้าถาม สงสัย หรือลองมั่วและค้นคว้าเองแล้วก็ถ้าถามต่อว่าทำไมถึงต้องเป็นแป้งนี้ ถ้าเปลี่ยนเป็นแป้ง Z แล้วจะเป็นยังไง ก็จะไม่ได้รับคำตอบแล้วจบแค่ที่ว่าเราทำผิด อันนี้เป็นลักษณะของการตามสูตรโดยที่ไม่รู้ failure caseเราขาดภาพ character ของแป้งในหัวหนำซ้ำพอได้คำตอบแล้วก็จำไม่ได้ เพราะจำเป็นนกแก้วนกขุนทอง คือยังไง?สมมติถ้าถามว่า ทำผัดผงกะหรี่ ก้อนสีเหลืองๆมาจากไหน แล้วได้คำตอบว่า volume นั้นไม่ใช่ผงกะหรี่แต่เป็นไข่ที่คลุกผงกะหรี่ เราก็จะนึกภาพตามได้ใช่มั้ยครับ ว่าไข่ดิบที่ตอกไปมันแข็งตัวแล้วค่อยๆเป็นสีเหลือง ขยุกขยุย แต่แป้งมันต่างกัน ถ้าคำตอบกลับมาว่า ทำ X ต้องใช้แป้งข้าวเจ้า / แป้งข้าวโพด / แป้งสาลี เราจะนึกถึงผงขาวๆ เหมือนๆกัน ไม่มี character ที่ลอยขึ้นมาในหัวเลย นี่ต่างหาก key ของปัญหานี้ที่ทำให้เราไม่สามารถ reasoning และพลิกแพลงได้เวลาต้องตัดสินใจว่าใช้แป้งอะไรดี แทนด้วยอะไรได้บ้าง ถ้ามัน A เกินไป จะแก้ได้ด้วยการผสมอะไรใส่เข้าไปถึงจะลด A ลงได้?แป้งและความรู้ปัจจุบันแป้งข้าวเจ้า : ??? เข้าใจว่าข้าวเจ้าคือข้าวที่เรากินกับข้าวแกงแป้งข้าวโพด : ??? ถ้าให้เดา มันคือคอนเน่? เพราะเป็นแป้ง กับข้าวโพด 555แป้งสาลี : ??? เอาจริงๆ ตอนแรกเกือบงงว่า สาลี คืออะไร 5555555พอคิดๆก่อน Google ว่าเคยได้ยินคำว่าข้าวสาลีมาก่อน เพราะงั้นมันคือพันธุ์ข้าว ถามว่าได้ยินมาจากไหน เพราะว่าทุ่งข้าวสาลี แล้วก็บรู้มเป็นโกโก้ครั้นช์ 5555555แล้วทำไมเราไม่เอามาหุงกิน ถ้าหุงจะเป็นไง? ดังนั้น น่าจะ characteristic ใกล้กับแป้งข้าวเจ้า และไกลออกจากข้าวโพด? จากการ Google ข้าวสาลีหุงพบว่ามันจะออกมาหนึบๆเหมือนข้าวญี่ปุ่น เมื่อมีความรู้นี้แล้วทำให้ image ของแป้งนี้ชัดขึ้นแป้งมันสำปะหลัง : ได้ยินบ่อยๆว่าไว้ทำของน้ำข้น อันนี้มี character ชัดมากตรงที่มันสามารถเป็นวุ้นใสได้เฉยเวลาเอาไปทอด (คือน่าจะผิด use เพราะแป้งนี้ดันใช้ต้ม) แต่ทำไมมันสำปะหลังถึง connect กับวุ้นได้?แป้งข้าวเหนียว : เวลาไปถามใครส่วนมากจะเป็นเสียงเดียวกันว่าใช้ทำของหวานไทย แต่ไก่ทอดที่ใส่แป้งข้าวเหนียวก็เหมือนจะเห็นในเน็ต เพื่ออะไร?แป้งเอนกประสงค์ : อันนี้ชื่อเทพพอๆกับโกกิเพราะดูจะทำได้ทุกอย่าง แต่พอพลิกดูเป็นแป้งสาลี 100% มันคือยังไงกันแน่?แป้งขนมถ้วยฟู : ???แป้งเค้ก : ???โกกิ master raceปัญหาสำคัญคือ ทำไมแป้งโกกิมันเป็นคำตอบของทุกอาหารทอดกรอบได้ ก็ไม่ใช่ไม่ดีนะมีแป้งวิเศษ แต่ทีนี้รู้สึกไม่อยากใช้อะไรอีกเลยนอกจากโกกิเพราะมันได้ชัวร์มาดูส่วนประกอบ พบว่าเป็นแป้งสาลีซะส่วนใหญ่แต่โปรตีนสูง บวกแป้งมัน (ที่เอามาทอดแล้วโดนด่าว่าใครเขาใช้แบบนี้กัน) แป้งดัดแปลง (???) สารทำให้ฟู ภาษาอังกฤษเขียนว่า baking powder แปลว่าเป็น baking soda (NaHCO3) + acid มาแล้ว เหลือแต่น้ำก็ปล่อย CO2 ออกมาได้ แล้วก็สุดท้าย MSG (ก็ว่าอยู่อร่อยจัง.. แต่อย่าลืมว่า MSG ล้วนๆก็ไม่เหมือนรสดีที่เป็น MSG ปรุง)โกกิสอนอะไรเรา มันสอนเราว่า ถ้าเราเข้าใจแป้งแล้วเราสามารถประดิษฐ์ magical experience ได้ ไม่เหมือนแป้งอะไรในโลกนี้! แต่ก็ไม่รู้ว่าแป้งดัดแปลงนี่มันมายังไงอีกอย่างที่เก็บไว้ลอง เราสามารถทำแป้งโกกิ จากแป้งอื่น + baking powder + MSG ได้มั้ย? ถ้าใช้ baking soda + กรดเช่นน้ำมะนาวหรือน้ำส้มสายชูล่ะ?อะไรคือแป้งดัดแปลงดีที่มีรหัส food additive E Number ที่ภาษาอังกฤษแปลว่าลอกได้ E1412 :https://en.wikipedia.org/wiki/Distarch_phosphatehttp://www.food-info.net/uk/e/e1412.htmDistarch Phosphate เหมือนจะเป็นแป้งที่เอาแบคทีเรียจากกระเพาะเรา มาใส่ให้มันกินไปซักพักก่อน.. น่าจะทำเองไม่ได้ 555หาความรู้เว็บไทยก่อนอันนี้น่าจะพอเพียง จาก Wongnaihttps://www.wongnai.com/food-tips/types-of-flourแต่ว่าขนมไทยเยอะไปหน่อย เลยมีภาพในหัวว่าหวานๆเหนียวๆ ใสๆ (ต่างที่คืนตัว ไม่คืนตัว?) ไปหมดเลย ไม่รู้เอามาใช้กับของคาวยังไงได้ปรากฏว่าราดหน้าเขาใช้แป้งข้าวโพดกันไม่ใช้แป้งมันเหมือนที่รู้ตอนแรก ทำไมถึงข้น? แป้งข้าวเจ้า แป้งสาลีข้นมั้ย? แล้วทำไมคอนเน่กรอบแต่ราดหน้าเหนียว??สำรวจขนมขบเคี้ยวต่างๆบทความ Wongnai อยู่ใน context ของอาหารที่ "เขา" ใช้แป้งพวกนี้กัน ทำให้เห็น image ได้พอสมควร แต่ขนมถุงต่างๆล่ะใช้แป้งอะไรบ้าง ทำไมขนมพวกนี้ใช้แป้งต่างกัน แต่ไม่เห็นจะตรงกับ character จากเว็บ Wongnai เลย (เช่นแป้งข้าวโพดว่ากันว่าใส่ราดหน้า แต่ทำไมเราไม่เห็นความเชื่อมโยงกับคอนเน่?)เพื่อเข้าใจ context การทอดและอบของแป้งต่างๆก็เลยจะไปเดินเซเว่นเพื่อดูว่าขนมต่างๆใช้แป้งอะไรทำมา แต่ยังไม่ได้ไปเดิน กลับมาแล้วจะมาเติมExperiment #1ครั้งนี้จะใช้ 3 แป้งล้วนๆคือ all-purpose (สาลี), ข้าวเจ้า, ข้าวโพด มาทำสิ่งเดียวกันคือชุบหมูยอทอด แล้วก็มี ground truth เป็นแป้งโกกิ master race เพราะทอดออกมาแล้ว ideal ที่สุด ...เทพคุมอุณหภูมิให้พอกันด้วยการใช้น้ำทำ slurry แป้งจากน้ำแข็งก้อน จะได้ไม่มีปัญหาการทดลองพลาดเพราะมีแป้งอุณหภูมิสูงจน glutenize ก่อน (เหมือนการนวดขนมปัง ที่ต้องใช้หัตถ์ตะวันให้ขึ้นฟู อันนี้เราอยากจะทำตรงข้ามกันคืออยากให้แข็งกรอบ)แป้งโกกิ (ground truth)เทพ! อยู่ๆก็มีความ airy โผล่มา คือแป้งจะลอยอยู่อย่างมหัศจรรย์ แต่ก็ไม่หลุดไปไหน ที่สำคัญรสไม่ neutral คือมันมีรสโกกิ.. รส MSG นั่นเอง แล้วก็มีเกลือด้วยนะแป้ง all-purpose (แป้งสาลี)อย่างแรกๆ แป้งนี้มีภาพลักษณ์ต่างจากอีกสองอันชัดเจนตอนเป็น slurry คือมันดู lumpy เป็นก้อนๆ ดูน่าจะชุบออกมาแล้วอร่อย แล้วก็ความ lumpy นี้เป็น texture คล้ายๆกับแป้งโกกิ สมแล้วที่แป้งโกกิทำจากแป้งสาลีซะส่วนใหญ่ (แสดงว่า lumpy ไม่ได้มาจากความ "โปรตีนสูง" ของแป้งโกกิ)แป้งข้าวเจ้า แป้งข้าวโพด มีแค่ 2 state คือ ตอนแรกเป็นผงๆเหนียวๆเหมือนน้ำน้อยไป แต่พอน้ำเยอะถึงจุดนึง มลายกลายเป็นน้ำขาวเหลวๆทันที ไม่มี state ตรงกลางที่ค่อยๆเหนียวแบบแป้งข้าวสาลี ตอนนี้เราได้รู้ character เฉพาะของข้าวสาลีแล้วอีกอย่างคือสี! แป้งนี้มีสีครีม สีเหมือนแป้งโกกิ นี่คงไม่รู้แน่ๆถ้ามันไม่อยู่ข้างน้ำ slurry ของแป้งข้าวโพดกับแป้งข้าวเจ้าทอดออกมาเห็นความหวังของฟองนิดหน่อย แต่สุดท้ายก็ไม่หนา อันนี้ในกระทะก็ไม่เหลือแป้งลอยอยู่นะ แล้วตอนชุบก็พยายามให้มันหนาๆติดมาที่สุดแล้ว แต่ออกมาไม่เหมือนโกกิ.. โกกิอาจจะมีสารอะไรที่ช่วยยึด?รสชาติล่ะ เหมือนโกกิจืด ที่ไม่ airy เท่าแป้งข้าวเจ้าอันนี้สภาพตอนน้ำไม่พอที่ว่า แต่ถ้าใส่น้ำอีกนิด จะกลายเป็นน้ำเหลวทันทีไม่มี lump เกิดขึ้นรสชาติอันนี้ค่อนข้างมี character แบบ burntๆ นึกถึงขนมกรอบ คุ้กกี้? เกือบๆเห็นความขนมผิง? รสนี้ส่วนตัวคิดว่าไม่เข้ากับหมูยอ แล้วก็เรื่องความแข็งนี่เด่นเลย ถ้าอะไรรู้สึกบางสุดยกให้โกกิ เพราะมันลอยอยู่ด้วย ต่อมาคือสาลีเพราะคล้ายๆโกกิแต่ไม่ลอย แล้วก็อันนี้รู้สึกแข็งติดกับผิวได้แป้งข้าวโพดน่ารัก... ทำออมาพบว่าเรียบ ดูเรียบร้อย รสชาติ รู้สึกว่า transparent มาก ไม่รู้สึกอะไรเป็นพิเศษเลย อันนี้นึกถึงผิวนอกของเต้าหู้ทอดของร้านลูกชิ้น เราไม่รู้สึกว่ามันมีตัวตน แต่ก็ดีกว่าเต้าหู้ทอดที่ไม่ได้ชุบแป้ง?ถ่ายรูปหมู่ก่อนจบการทดลองของแถม ลองทำมะเขือเทศชุบโกกิทอด อยากรู้ว่าของน้ำๆไปชุบแล้วจะเป็นไงก็อร่อยอยู่ มั้ง แต่ไม่รู้จะกินกับอะไร 555ผลการทดลองนี้คิดว่า แป้งสาลีสมควรเป็น base ของแป้งผสมที่กะจะชุบทอด ด้วย character สำคัญที่สามารถเกิด lump ได้ ตรงกับที่ว่าทำไมส่วนใหญ่ของโกกิคือแป้งสาลี แป้งสาลีมีแป้งมันมาแจมด้วย เดี๋ยวครั้งหน้าจะต้องลองทอดแป้งมันเฉยๆให้เห็นชัดๆว่าออกมาเป็นไง แล้วทำไมโกกิถึงเลือกเอาไปใช้EDIT : 30/08/2021มีผู้อ่านทักมาเลยนึกถึงบทความนี้ได้ 555 หลังจากตอนนั้นถึงตอนนี้ก็มีหนังสือ On Food And Cooking ของจริงศึกษาแล้ว ในหนังสือ เรื่อง "Frying Batter" เป็นแค่ส่วนเล็กๆในบท Cereal, Doughs, and Batters ที่เน้นพวกอบขนมจริงๆเลยมากกว่าแป้งชุบของคาว แต่ก็ยังมีความรู้พอสมควรครับแน่นอนว่าแป้งชุบที่ดีคือ กรอบนาน หลุดในปากไม่ใช่ในจาน และไม่อมน้ำมันแป้งชุบคือแป้งผสมของเหลว แต่ของเหลวไม่ใช่แค่น้ำ อาจจะเป็นนมหรือเบียร์ก็ยังได้ หรือจะใส่ผงฟูหรือ baking soda ช่วยเหมือนสูตรโกกิก็ได้ ไข่ก็มีสัดส่วนน้ำเยอะใช้แทนของเหลวได้ แถมยังได้โปรตีนมาช่วยแข็งตัวยึดจับได้ (อันนี้ประโยชน์เหมือนใส่ไข่ในขนมอบประเภท quick bread ที่ไม่มียีสต์แต่ใช้ chemical leavening แทน แล้วกลัวผงฟูดันไม่ขึ้น สามารถเพิ่มโครงสร้าง "เทียม" ที่เป็นไข่แข็งตัวมาช่วยพยูง)ถึงจะมีสารพัดของก็เหอะ พระเอกแน่นอนคือแป้ง ปริมาณแป้งก็ตามที่คิด เยอะไปก็จะกลายเป็นขนมปัง..​ บางไปก็เปราะแต่มีเรื่องปริมาณกลูเต็นด้วย อันนี้คนทำขนมปังสามารถใช้ความรู้เดิมได้เลย เพราะคงรู้ว่าอันไหนเยอะน้อย เช่น all purpose ตราว่าวสีฟ้า ก็จะกลูเต็นน้อยกว่า แป้งขนมปัง ตรา..​อะไรซักอย่างสีเขียวในโลกขนมปังหลายๆครั้งอาจจะต้องการกลูเต็น แต่ในโลกชุบแป้งทอดเราไม่อยากได้ structure เพราะมันจะพาอมน้ำมันแล้วทำให้เคี้ยวหนึบครับ เพราะงั้นกลูเต็นน้อยยิ่งดีกับการชุบแป้งทอด อันนี้ขอเสนอตาราง protein ในแป้งจากอีกหน้านึงซึ่งกลูเต็นนี้คือเกิดจากการที่เรานวดแล้วจัดเรียงโปรตีนที่ว่าให้ chain มันเรียงกัน (นึกภาพกองดินสอที่หัวท้ายมีแม่เหล็ก ถ้าเราพยายามกลิ้งๆมันมั่วๆซักพักจะเห็นดินสอหลายแท่งต่อกันเป็นแนวยาว ประมาณนั้นครับ) ดังนั้นเวลาจะชุบแป้งไม่ต้องไปคนมันมาก เดี๋ยวจะเกิดกลูเต็นเยอะไปหน่อยครับที่บทความมีตอบคำถามที่เราทดลองอีกสองอย่างแป้งจากข้าว ไม่ได้มีโปรตีนแบบเกิดกลูเต็นได้เลยเป็นเหตุผลให้มันกรอบ ไม่หนึบ แล้วยังดูดน้ำกับน้ำมันน้อยแป้งจากข้าวโพด มีสมบัติคล้ายกันแต่ที่ดูดน้ำน้อยเพราะโมเลกุลใหญ่ กับมีสมบัติ "dilute" โปรตีนของแป้งอื่นได้ อันนี้เหมือน หนังสือจะ suggest ว่าควรมี corn starch นี้เป็นส่วนผสมกับแป้งอื่นเป็นประจำจะดี (แทนที่จะอย่างเดียวเลย)แป้ง "root flour" (ก็คือ มันฝรั่ง มันสัมปะหลัง อะไรงี้มั้ง ทำมาจากของใต้ดิน) ไม่เหมาะสม เพราะมัน gelate (เป็นวุ้น) แถมหลุดสลายในอุณหภูมิต่ำ มีเทคนิคการ "pre dip" ให้ติดแน่นคือ ควรทำให้อาหารอะผิวเปียกก่อน แล้ว dip ใส่ในแป้งแห้งให้ขอบนอกกลายเป็นผง แล้วทีนี้ ถึงค่อย dip อีกทีของแท้ ใส่ใน slurry แป้งเปียกที่เราผสมไข่ ฯลฯ ไว้ เหมือนชั้น particle เม็ดแห้งตรงกลางมันจะเป็นกาวที่สมานทุกอย่างประมาณนั้นครับ แปลว่าเวลาจะชุบของทอดมีถ้วยเดียวไม่ได้ละ ต้องมีถ้วยผงแห้งคู่กับถ้วย slurryท้ายสุด มีเรื่องเวลา คือชุบแล้วต้องลงทอดเลย ไม่ใช่แค่นั้น แป้งที่เตรียมไว้ชุบก็ต้องผสมเดี๋ยวนั้นเลยด้วยไม่ใช้ผสมไว้นานแล้วก่อนมาชุบ อันนี้เหตุผลเพราะมี physical leavening เป็นฟองอากาศที่ทิ้งไว้จะหายไป แล้วโดยเฉพาะถ้าเป็นแป้งผสมผงฟู ผงฟูทำงานตั้งแต่โดนน้ำแล้ว ถ้าปล่อยไว้ก็เหมือนไม่ได้ใส่ผงฟู อากาศไปหมดละเรื่องคนน้อยๆเพื่อให้กลูเต็นไม่เกิดว่าไปแล้วแล้วควรเย็นๆด้วยอีก เพราะว่าแป้งจะดูดน้ำช้าลงในอุณหภูมิต่ำครับ ถ้าอยากเพอร์เฟ็คต้องงานไว แป้งเย็นๆแถม ในตารางโปรตีนที่ว่าจะเห็น Vital Wheat Gluten (นวดแป้งให้กลูเต็นมา ละล้างที่เหลือออกเอาแต่กลูเต็น แล้วทำกลับมาเป็นผง น่าจะประมาณนั้น) ที่อยู่ล่างสุดมีปริมาณโปรตีนสูงมาก ซึ่งจากที่เราเรียนมาคือไม่เหมาะจะชุบแป้งอย่างยิ่งเพราะมันคง soggy และอมน้ำมันแต่ Vital Wheat Gluten ถ้าไปเซิจในเน็ต จะเจอภาพคีโตชุบแป้งทอดที่ดูกรอบอย่างไม่น่าเชื่อมากมาย เช่น The Best Ever Vegan Fried Chicken - School Night Veganอันนี้ยังไม่ได้ลอง แต่ไปซื้อมาจาก Shopee แล้ว เดี๋ยวต้องลอง 555'
