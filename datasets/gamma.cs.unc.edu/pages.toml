["http://gamma.cs.unc.edu/STMG"]
title = ""
full_description = "Zherong Pan1, and Dinesh Manocha1 Department of Computer Science, University of North Carolina at Chapel Hill1 We present a novel algorithm to control the physically-based animation of smoke. Given a set of keyframe smoke shapes, we compute a dense sequence of control force fields that can drive the smoke shape to match several keyframes at certain time instances. Our approach formulates this control problem as a PDE constrained spacetime optimization and computes locally optimal control forces as the stationary point of the Karush-Kuhn-Tucker conditions. In order to reduce the high complexity of multiple passes of fluid resimulation, we utilize the coherence between consecutive fluid simulation passes and update our solution using a novel spacetime full approximation scheme (STFAS). We demonstrate the benefits of our approach by computing accurate solutions on 2D and 3D benchmarks. In practice, we observe more than an order of magnitude improvement over prior methods. Efficient Optimal Control of Smoke using Spacetime Multigrid Zherong Pan, and Dinesh Manocha ACM Transaction on Graphics (Presented at SIGGRAPH 2017), [PDF]"
year_published = 2025
