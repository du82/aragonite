on.Protect my mailboxesExtended validation, multi-domain SAN, wildcardCover your services using several domain names with SSL/TLS multi-domain and wildcard certificates, or protect your commercial transactions with a Business certificate.Manage my domain names and subdomainsSpike in traffic, pirating, technical outage, environmental incident...so many unexpected events for which we do everything possible to guarantee the service continuity of your projects.Key accounts: protect your online identity with a personalized serviceOur service dedicated to the protection of your trademarks online. 20-years of experience by experts who are dedicated and available every day.Protect and accompanyBenefit from the legal and technical expertise of your dedicated account agent.Monitor and defendAutomatically monitor your trademark on the internet and block fraudulent websites.SecureAccess your account, configure your domains, DNSSEC, profit from our security options at all levels.See our business servicesYour guarantees with GandiChoiceA catalog of over 800 available extensions, and a theme-based suggestion search engine to help guide you in finding the ideal domain name.Ease of useSecurely centralize domain names, hosting, CMS, and email. As a team, you can share roles and permissions with third parties.ConfidentialityYour website is hosted in France or in Luxembourg. The protection and respect of your privacy and that of your customers is at the heart of our projects.Need help? Here are all the ways that you can contact us.Explanations and step-by-step guides to all our products and servicesSee our documentationCustomer support assistance 24/7Open a support ticketChat directly with the support teamOpen a chat windowAn idea, suggestion, or remark? Write to us hereWe read all your mails, and will always reply.Expert support, in constant contact with the developersCustomer support is exclusively handled internally, by employees located on 3 continents at our regional offices. You get:Expert agents who know the products like the back of their handsAvailable 24/7 in English, Spanish, Chinese, French, and JapaneseTraceability. Our support replies, emails, and social media replies are signed by namePromises kept for over 20 yearsGandi manages over 2.5 million domain names, 780,000 email addresses, 55,000 SSL certificates, and hosts over 200,000 websites/applications. With more than 350,000 active users, 8,000 resellers, and 500 key clients, since December 2000, the web has been our passion, but just that: we go one step farther by keeping our promises to you.Transparency and IntegrityQuality service at the best price: our rates are calculated fairly and clearly, without any billing surprisesNothing hidden: technical incidents are communicated immediately. Responsibility is taken in the event of failures or bad choices.Respect of your privacy: secure internet presence for everyone and non-disclosure of personal data.Reciprocity: products and services that we would like to use ourselves, and that live up to your expectations.We defend a web that is open to everyoneWeb pioneers: Gandi was born out of the desire to oppose and stand up to the large monopolies, so that domain names, and later cloud hosting, would be accessible to as many as possible.For net neutrality: We believe that net neutrality is a founding principle, and because of this, we are against any idea of an Internet of several speeds.Open source: Gandi gives preference to open-source solutions that bring transparency and greater liberty to the entire web.Supported projects: Gandi has a mission of providing the necessary tools needed, and shining a spotlight on initiatives that share our values.Listen to you: From the community manager to the president, and all the product, legal, and of course the support teams, we have an open dialogue with you to build and improve our products.See our promisesFrequently Asked QuestionsHow do I purchase a domain name?When you start working on the creation of your website or online store, the first thing to do is to choose and register a domain name. You can't purchase a domain name per se. It consists of whichever string of text you choose for the name, plus a domain ending (.net, .fr, .org, etc.) that you register for a specific period of time between 1 and 9 years (and can be renewed indefinitely). You can check whether the domain name you want is available by doing a search with our search tool. You'll get an immediate confirmation as to the availability (or not) of the domain name you want. If it's available, you can then easily register it by adding it to your cart.Who does a domain name belong to?Here's how domain names work in general: registries manage particular domain endings (.net, .fr, .com, .org, etc.) and sell domain names with the domain endings they manage. Registrars like Gandi are accredited by each of these registries so that they can sell domain names to end-users (private individuals, small- and medium-sized businesses, large corporations, non-profits, etc.) with any of the available domain endings their customers may want. Once registered, a domain name is associated to an Owner contact, who becomes the "holder" of the domain name in question for a particular length of time. If a domain name shows as unavailable in the results of a search, that means someone else has already registered it. You can check who owns it using our whois service or you can search for alternatives using our suggestion tool.How do I recover or re-purchase a domain name?If you want to create a website, but the domain name you want is already taken and you don't want to "fall back" on another domain ending or a different domain name, you still have a few options, including finding the current owner using the Whois so that you can make an offer on the domain name. The Whois is the directory for all the technical and contact information regarding domain names. A domain's listing in the Whois is created at the moment a registrar, like Gandi, completes the registration of a domain name on behalf of their customer. The Whois contains information about the registrar, the registration date, the expiration date, and above all, the last updated date, corresponding to the last time the domain name's registration was modified. A good way to tell whether a domain name is active or dormant is to contact the owner of the domain name. However, the whois is not always ideal, since it's not always kept up to date (if a contact has changed jobs, for example) but also because GDPR (the European Union's General Data Protection Regulation) prevents registrars from publishing full contact information for private individuals without their consent. You can try your luck contacting the organization or company listed, but nothing is certain. As a last resort, you can also try to contact the owner using the contact page of the website associated with the domain name.What is a web host?A web host (or hosting provider) is a business/service provider that makes data storage and web servers available to website admins or owners. One of the pieces of data that's stored consists of the elements that will be made available on the web and viewed by internet users.The role of the web host is to install, secure, and keep web servers up to date, and also to develop the user interface and underlying technical infrastructure according to the needs of their users, following the release of new technologies, and in response to competitors.A web host isn't involved in the content stored on the servers or in the development of specific websites hosted on its servers.Which web host should I choose?To bring your website online, it needs to be stored on a web hosting server. That means choosing a web hosting provider and a hosting package that fits your needs is crucial! There are several different options on the market, at all different prices. Obviously, not all of them are the same, but in general, there are hosting platforms that are right-sized for the needs of personal websites, and not other kinds. The risk is you might choose a solution that's either not the right size (not powerful enough or too expensive) or not well adapted to your needs (e.g. requiring a high level of expertise), or worse — both!There are several types of web hosting solutions that each meet a different set of needs. Whether you're looking for a reasonably priced hosting solution for a blog, a complete hosting solution for your business activities, or hosting for developing a mobile app or an SaaS-type service, there's a web hosting solution for you at Gandi!Get help { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [ { "@type": "Question", "name": "How do I purchase a domain name?", "acceptedAnswer": { "@type": "Answer", "text": "<p data-block-key=\"hjtd7\">When you start working on the creation of your website or online store, the first thing to do is to choose and <a id=\"51\" linktype=\"page\">register a domain name</a>. You can&#x27;t purchase a domain name per se. It consists of whichever string of text you choose for the name, plus a domain ending (<a id=\"883\" linktype=\"page\">.net</a>, <a id=\"635\" linktype=\"page\">.fr</a>, <a id=\"914\" linktype=\"page\">.org</a>, etc.) that you register for a specific period of time between 1 and 9 years (and can be renewed indefinitely). You can check whether the domain name you want is available by doing a search with our <a href=\"https://shop.gandi.net/domain/suggest\">search tool</a>. You&#x27;ll get an immediate confirmation as to the availability (or not) of the domain name you want. If it&#x27;s available, you can then easily register it by adding it to your cart.</p>" } } , { "@type": "Question", "name": "Who does a domain name belong to?", "acceptedAnswer": { "@type": "Answer", "text": "<p data-block-key=\"hjtd7\">Here&#x27;s how domain names work in general: registries manage particular domain endings (<a id=\"883\" linktype=\"p