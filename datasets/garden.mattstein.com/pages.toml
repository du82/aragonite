["https://garden.mattstein.com/notes/me-vs-ai"]
title = "Me vs. AI – Matt’s Weird Little Garden"
full_description = "Notes Me vs. AI Dec 18, 2023 I won’t respond to most prompts in seconds, but hours, days, weeks, months, or years.Some of my best answers will take a lifetime.I don’t require bottles of water, but buckets and cisterns. Also food, sleep, therapy, and as many diversions as I can get. I need music and sunrises and other people.I don’t have vast stores of knowledge to access, but the things I can remember—with painstakingly-built systems just for helping me recall the important parts.I cannot flip between personas by being told how to act, but only imitate those I’ve seen and spoken with and tried to know.I cannot paint, draw, or photograph something for you without first spending hundreds of hours studying paintings, drawings, or photographs to form a basic understanding of the medium.I am not good at math.I know one language pretty well, and a few phrases in some others.I cannot expand infinitely and be released in new versions. I will die.I was told once by a friend that I’m “like an AI trying to understand human behavior.”I think he meant it as an insult but I take it as a compliment.I don’t pay nearly as much attention to norms as how people behave and what expectations they seem to have. I am always curious, always learning, always confused.I am inefficient and indecisive and small and imprecise and finite and flawed. I am neither proud nor ashamed of this.However temporary and imperfect it may be, I am alive and animated by a beating heart. Reply via Email ← Notes"
