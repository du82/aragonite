["https://garden.mattstein.com/notes/people-content-27-big-little-web"]
title = "People & Content #27: Big Little Web – Matt’s Weird Little Garden"
full_description = "Notes People & Content #27: Big Little Web Feb 27, 2024 Have you noticed how people live in different places?Of course you have, but I don’t only mean cities and towns and sleeping arrangements.Some people are most at home ... at home, and others in the office or local hangouts or on the road.Beyond physical places, some people live in big bold movements while others live in details and worlds of tiny things.Some live in the past, others in the present, and still others in a future they’re looking to inhabit.None of this is new, but the internet adds new dimensions.You can live in completely new places without ever leaving the place you were born.You can travel the world and come home every day to the same group of friends.You can live in the noise of giant platforms, or the coziness of small, private groups. In the immersive fantasy of videogames. Surely other places I’m not even thinking of.The limits of being a meatbag with a mailing address don’t apply to life on the internet. You can live in many places at once.Where do you live, and how did you get there? Where did you move from, and where do you think about moving to?Right now I live in a neat little city I still feel new to. Online, I live in smallish groups, for work and with friends, and with just enough Mastodon that I can’t quite keep up but feel connected to an interesting group of people. I disappear into games sometimes for a break, and I’m eager for spring when it’s easier to be outside walking around and doing yardwork. I live in my head and in all sorts of details, and perpetually need to be out more, and present.I like the vastness of the web, the bigness of a place with endless smaller groups always moving and changing.The overwhelming number of places remind me how limited my time and energy are.I don’t think it’s just introversion that has me avoiding the biggest-possible gathering places. Big platforms don’t seem to age gracefully, but expand into business machines that eventually replace their hearts with cash registers. And I’m never at home in a crowd anyway, but smaller groups of people I can at least attempt to know.I’ve walked in big cities and felt alone surrounded by people.I’ve met complete strangers because of links and likes and fragile little interactions that led to meaningful connection.This is all so weird.It’s the hugeness of the web that makes these precious small interactions possible.I’m not completely sure of where I want to live in any sense that I’ve described here, but I gravitate toward smaller places amidst the bigness of it all.Really living somewhere is an act of participation.I think my part is to be more open and share the joyful and honest things that mean something to me, even when—especially when—I’m cheerfully bad at them. I’d like to be a person on the internet more than a caricature of one.I’m fully ready to eject myself from the commercial internet and make my own soap, but it’s the happy, honest imperfection of people being people, and being kind, that’ll keep me here as long as I can be. Reply via Email ← Notes"
