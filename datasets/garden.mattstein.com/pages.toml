["https://garden.mattstein.com/notes/people-content-2-my-art-work"]
title = "People & Content #2: My Art Work – Matt’s Weird Little Garden"
full_description = "Notes People & Content #2: My Art Work Feb 2, 2024 Yesterday I wrote about the creative practice and play I started with as a kid.I’m hoping it invites you to remember whatever your play and art looked like, that there’s something warm and happy in there. Maybe those things have only grown since then. Maybe you’re like me and you need to figure out how to make more room for them.You were probably a cool kid, even with that one bad haircut.Mine was inspired by New Kids on the Block, and the genetic gift of a rat tail that grows and curls all by itself.As I got older and moved through school, my creative pursuits were still playful but they started looking like jobs.In high school I traded band for art classes, where bigger projects could feel like clocking in for a shift, doing some work, and returning the next day to do it again.I smacked into my very first wall of bad grades in honors English, where I suddenly had to work very hard because a series of incredible teachers insisted that my writing should have perspective and purpose and be measured against itself. A quest for grades tumbled into a quest to be proud of my writing.Journalism meant diligent note-taking and developing photos in a darkroom and page layouts on my first Apple computers, editing copy to squeeze writing into literal boxes.I was in a roaming band of nerds that would fix school computers and networking problems, lightly supervised by a lab teacher. (I took computers apart and mostly reassembled them still working!)Each of these things was a bit of a grind. Deeper work with more commitment and complexity.Writing wasn’t just following all the rules, but getting an energy from pushing against them. Thinking and changing perspective, particularly when I had to sharpen a persuasive argument.Drawing and painting and sculpture were the same! Explorative observation and framing. Lots of discussion about intent vs. execution and doing it again.Helping people troubleshoot computers and networks—not just students but teachers of varying ages—was instructive. I was an elite little tech bro with a badge that let me wander freely around the school. It required patience and empathy to help someone whose every instinct made “computer things” a challenge.I was co-editor of our yearbook, a challenge ripe with foreshadowing. It was writing and art on deadlines and with very specific constraints. It required managing a staff of high-schoolers.You imagine managing a staff of high schoolers for a moment. Now do it again, but you also are a high schooler.I was the same person leaning into mediocre guitar-playing and trying and look cool without revealing the effort involved. Another “awesome” haircut that immediately dates a photo.I had a smattering of seasonal jobs that included hand-lettering kitschy sayings on a few peoples’ kitchen soffits, and drawing baby accessory bag specs that would arrive from China as prototypes and sometimes be sold in stores.I did a few technical drawings for job site installations on a drafting table. Do people still draft things by hand unironically?I was painting and drawing, but was that art? It wasn’t always playful or fun, but I got paid for it. I liked getting paid to draw and paint.I helped with some school-related websites, and built my first client website in exchange for a handmade conga drum. (All these sites used tables and sliced GIF images. Be cool.)Explaining to each upset Lowe’s customer that no, we did not in fact carry the flex hose because that was Home Depot—that had less magic. If there was any art to that job, it was listening and trying to either help customers or make them laugh. Ideally both.I built lockers and loaded trucks and installed shelving and pallet rack in warehouses and factories. Physical labor that could be dull and demanding, but where my mind could wander and I could easily see the result of a day’s work.What was art anyway, and what was a job?College was an assumed next step, so from my circus of seasonal employment I had to plot a course to a full-time career.I drew a Venn diagram with two circles: “likes art classes” and “needs to eventually find a job.” I decided, with all my high school wisdom and life experience, that overlapping sliver in the middle was graphic design. Reply via Email ← Notes"
