["https://garden.mattstein.com/notes/people-content-20-dependencies"]
title = "People & Content #20: Dependencies – Matt’s Weird Little Garden"
full_description = "Notes People & Content #20: Dependencies Feb 20, 2024 I have made my own lip balm.Run and crimped my own ethernet cables.Pulled countless yard waste bins of weeds to avoid getting chemicals involved.Pressed ink to paper.Sewn my own questionable laptop sleeve.Got the Bentley repair manual for my car and read it like a novel.Clacked away on a typewriter I bought from a neighbor.Printed hundreds of custom clips and pegs and brackets just so they’d fit precise and deeply uninteresting purposes.I once ran my own email server. (Don’t.)Wrote my own tiny PHP framework. (Also don’t.)I’ve broken up concrete and rebar, hacked apart metal, painted walls, detailed cars, built fences and arbors, plumbed drains.I got to pull a concrete float once for a big pour, which gave the concrete contractors a good laugh before they fixed it.I am not afraid to do things the hard way, and I am also thrilled to entrust them to qualified people.My favorite house contractors were a few cities ago, an electrical guy and a plumbing guy that were similar: they charged a bit more than others, loved what they did, and were perpetually booked up.They made time for our modest projects because we’d try to do the best we could rather than the cheapest, and I’d work with them when I could help out and learn. Each might sometimes insist on handling something and charging for it, with a long deep breath and face that said “this will be expensive.” Other times he might refuse to do something because I could safely tackle it, learn something, and save money. Each worked like this as if there was no other way to go about it. But there are other ways, and it’s been hard finding people like this. (We introduced them to one another and that worked out well.)They were experts, and perked up at my curiosity and eagerness to offer unskilled labor. (Being a contractor of a different sort, my normal procedure is to be friendly, clear, available, and then get out of the way and pay quickly. My best clients taught me to be a good client.)I can’t do everything myself and expect quality without igniting or flooding the house.I also can’t comfortably rely on expert work without at least being curious about it, if not hands-on. I learn best by doing my own work and learning from mistakes.There was no timeline where I would’ve made an excellent surgeon.I’m always trying to find a point of balance between reinventing the wheel and getting run over by someone else’s and I’m honestly not great at it.But I know to be cautious, if not sparing.Every new smart device or elaborate system is guaranteed future suffering.Every new project dependency is something I need to be more wary of when it does something I couldn’t manage myself.Every additional service makes something easier, and grows a footprint that itself could be a liability.Every joyful abstraction is a potential step away from simplicity in a misguided attempt at elegance.There is no building a website without dependencies.I can take an axe outside, lop off a piece of tree, and make you a wobbly stool, a splintery walking stick, or possibly some other object with utility.I cannot make you a website without at least a computer, an internet connection, and a server I can get to. That’s right, careful readers: no CSS or JavaScript and we’ll be using an IP address; the site will be as painful as the hewn woodworking.I’m lucky to be able to use so many things that smart people have created and cared for. I can build something sturdy and useful more quickly because of these gifts.At the same time, dependency may be the root of suffering?One of the benefits of moving a lot, without infinite wealth, is that we’ve always had to decide what comes with us. If there’s no place for it in our hearts or a literal new dwelling, someone at a Goodwill can welcome it into theirs. We still have too much stuff and have now purchased the exact same trencher twice, but anything still with us is on purpose.A project overloaded with dependencies becomes cumbersome to maintain, and the situation for maintainers is a whole other thing I’m not qualified to poke at—but I think it’s safe to say it’s often fragile. And I’m not happy with my own contribution back to those projects yet.I happened to arrive at this topic during another fresh wave of fiery Tailwind takedowns and responses, which gave me an ending.Finding the balance between abstraction and simplicity has never been obvious, and it usually seems different depending on what I’m looking at and who I’m working with.It’s always worth scrutinizing what’s included and left out, guided by concern for whatever a project needs to accomplish.If you’re so opposed to a package, framework, or methodology that all you can do is rail against it and attempt to discredit people that use it, you might be missing an opportunity to be an expert that helps people. You might not be fostering the air of inclusion you espouse, or building bridges that others might use to find their own way forward.There are evils in this world, and Tailwind is not one of them. Even if it paves over something important, or steers people away from problems that were worth solving.But maybe finding the right balance has always been easier for you, and you’ve not wobbled back and forth on the way to whatever you’re happiest with. Maybe you’ve read the right articles and embraced the best practices and swerved to avoid mistakes instead of colliding with them.Not me!I don’t care whether I’m doing the plumbing or working with the plumber. I’ll try to stay in a sweet spot where we’re working and sharing together and always trying to leave things better than we found them. Reply via Email ← Notes"
