["https://garden.mattstein.com/notes/covid-and-me"]
title = "Covid and Me – Matt’s Weird Little Garden"
full_description = "Notes Covid and Me Aug 9, 2024 I proudly dodged Covid-19 since its public debut and the warning that we might have to lock down for “a few weeks.”I was ready, having worked from home and become a self-isolation expert long before it had any useful purpose.About a month ago, however, I came down with a cold that didn’t go away and eventually took myself to a doctor’s office to discover I finally managed to get Covid. A milder strain that I’d just have to ride out.And so, after years of avoidance and masks and improved hand-washing habits, we finally met.The violent, feverish start tapered after a week and a half into a mild misery: stuffed up head with a brain fog that left me feeling tired and more dull than usual. And the absolute worst symptom that stuck around longest: my sense of taste took a wacky turn.This helped me realize how much I take smell and taste for granted. Preparing and eating food became a joyless muddle and beige shakes became appealing again. But the worst part, the most devastating of all the Covid experience, was that coffee became repulsive.It’s not just the chemical addiction to caffeine, but the morning ritual of grinding and brewing and savoring that first cup. Instead, coffee vaguely smelled like dust, motor oil, and fertilizer. It was revolting to smell fresh beans, and unpleasant to drink. I abandoned the morning ritual for a long stretch and chewed my caffeine gum that expired a few years ago.I’m just now easing back into normal after about six weeks, with the last few being down to Sudafed and returning to a normal level of physical activity.I don’t know that any of this led to any radical insights, but I’m probably more sympathetic to anyone with Long Covid or a condition that sticks around for a long time and saps you of energy or a clear head. Reply via Email ← Notes"
