["https://garden.mattstein.com/notes/people-content-7-platforms"]
title = "People & Content #7: Platforms – Matt’s Weird Little Garden"
full_description = "Notes People & Content #7: Platforms Feb 7, 2024 I grew up in central Ohio, which had the distinction of harboring an exceedingly average populace.Auxiliary characters in books, movies, and TV shows are from Ohio so they won’t be too splashy.Large retailers would pilot stores and products there to sample average America.It’s how I got to have McDonald’s pizza as a kid.One of my high school jobs was at the trendy and oppressively-perfumed mall clothing store, Abercrombie & Fitch. Not as the shirtless entryway model or a cashier or anything useful, but one of thirty or so youths that worked overnight to fold, arrange, and photograph store displays.How could this take thirty people, you might wonder? It didn’t. Most of us sat around hoping to fold something, to do something. To feel something. There was a huge backup pool because this particular store was Very Important and photos of it would be used across the country to model how other stores should set up.A shopping mall sameness prevailed in my childhood suburban environment.I didn’t realize this until I lived in Seattle.There, you might wait in a concerningly-long line to get a sandwich and have nowhere to sit.Or visit a dive bar that was not pretending at anything, just a genuine dump and beloved neighborhood establishment.You might happen upon some tiny place where one guy was always working cheerfully by himself, and keep going back because the meatball sandwiches were divine.I was charmed by smallness and variety in densely-populated neighborhoods.Early on, I instinctively wondered why these places didn’t expand. Improve efficiency, add seating, expand to new locations.It didn’t take long to realize maybe growth wasn’t what they cared about. I was there because whatever they did or served was great! What if striving for whatever they did—not world domination—is what made them great?I know you see where I’m going, but I’ll say it anyway: it’s possible to run a business that is not Amazon, Apple, or Walmart. On purpose.I’m not waking up every morning, gazing at a button that says “deploy trillion-dollar company” and narrowly keeping my hand away from it. I realize starting and building one of these companies is an unfathomable effort and accomplishment.But I like small businesses and weird little neighborhoods. Actual character.You and I are living in the same reality, so you know internet platforms got huge.In the beginning, I loved it.When I first started driving, it was in the era where you’d print directions with MapQuest and take them along with you in the car. It felt futuristic and it was much quicker than unfolding a map, plotting a course, and jotting notes you hoped to decipher later.For a long time, internet messaging and social websites felt like that: they offered genuinely exciting connection and utility. I was a little wizard being able to chat with a bunch of friends at once or confidently navigate myself to some unknown place. The internet was there for me, and for all of us!It still seemed like that when Netflix started streaming movies instead of mailing discs.It seemed like that when Amazon Prime made all things available with a click and weirdly fast shipping.It seemed like that when Yelp brought internet comment sections to local establishments.It definitely felt powerful when Facebook made it easier to connect not only with classmates, but people I had drifted out of touch with.Google could find anything and gave away free email accounts with ample space.These were all useful things!LinkedIn was there.It would take years, at least for me, to realize that each of these offered more because they wanted more.They were destined to wander the earth as platforms, never knowing joy or contentment—only growth.We half believe in my house that my tombstone will read “he hated the mall.”The wonderful, weird internet neighborhood turned into a shopping mall while I was standing there. The little sandwich shop is a parking lot for a Cheesecake Factory, where the overnight Abercrombie youths are returning to their cars.Why did they have to do this, and how the hell did I not notice?I am not over it.I am steeped in it. Reply via Email ← Notes"
