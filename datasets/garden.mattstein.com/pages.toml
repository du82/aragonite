["https://garden.mattstein.com/notes/people-content-1-my-first-content"]
title = "People & Content #1: My First Content – Matt’s Weird Little Garden"
full_description = "Notes People & Content #1: My First Content Feb 1, 2024 I’ve never personally earned any royalties or ad revenue, and my only viral highlights were the flu and chickenpox.There is no argument to be made that, by modern standards, I am a content creator.I’ve found my way to content that needs to serve a purpose for other people, like documentation or marketing or communication. People pay money for content that’s created or presented for a strategic purpose.But the content that’s most precious to me doesn’t have to perform for others.And it’s not content, it’s art.It’s personal.You may bristle at the word “art” here but I bet you have yours. Do you remember when little baby you got into drawing or painting or singing or dancing? What was that like? How much of that is still with you now?My art started with drawing and wondering how things worked.I remember that I loved to go to the library and check out those “how to draw” books, which were step-by-step formulas for drawing specific things.I could take a pencil and a piece of paper, follow the instructions, and have an elephant! A hobo! Or whatever the book promised! I could draw!I remember eating kid lunch watching Sesame Street, and Bob Ross was on afterward and sometimes I would paint along with Bob Ross and produce work just like him. (It did not look like his.) “Happy little tree” was an act, not an outcome.I recreated comic book drawings—a lot of Darkwing Duck for some reason—and made up my own characters and invented Rube Goldberg machines. I drew many “inventions” and was sure at one point I would grow up to be an inventor.It was clear to all of us I would grow up to be weird.My parents got me a drafting table with a Pixar-style lamp. I could tilt that huge flat surface and swing giant rulers and T-squares around and draw whatever I could think of. It was my desk in my room, so I’d do my homework at it and read books and shareware catalogs at it and spill drinks over and over.Because remember, it tilted and I was a kid.I drew my own knockoff posters on giant paper and decorated my walls with them. Space Jam. “Soccer is life,” I think. Blatant copyright infringement.I also delighted in disassembling things like broken electronics and machines. I loved prying open a case to see what bits were inside, and making up some kind of story about how they worked. I might consult our encyclopedia set for clues because there was no googling. But similar to googling, my search for knowledge would leave me distracted by those multilayered human body diagrams printed on clear pages because they were just so damn cool. Total rabbit hole.I was not so good at getting things back together.I knew at one point, because I saw it on TV, that I needed a Ninja Turtles Technodrome toy. As it is with kid desires, it was the only thing I ever wanted and it would complete me. My mom knew I would just take it apart and not be able to figure out how to get it back together.A sneaky grandma eventually bought me a the Technodrome! I played with it like you’re supposed to, without any disassembly. “See?! I’m cool about this!” Then I took it apart and was unable to get it back together.I may have ruined other more expensive things that were not even broken before I got to them.I’m not sure that taking things apart constitutes artistic expression, but examining things and finding new ways to look at them is part of the picture.I built LEGO boats for crayfish to ride down a nearby creek because I thought it’d be fun for both of us. I didn’t have the phrase “WTF” at the time but surely that’s what the crayfish were thinking when they backwards-flitted away while I’d pick plastic pieces from the rocks. (My engineering prioritized jets and laser cannons more than structural integrity.)I had to take and keep taking piano lessons and participated in recitals. I don’t remember liking that.I eventually started drawing things in art classes that my parents would frame, which is how I knew I was a big deal.Middle school brought more varied and interesting art classes and I wound up playing the trombone in the school band. The trombone was another forced exercise like the piano, until I found myself making music—where technical ability and improvisation came together for something that was new and special.Following instructions and practicing motions started becoming something more for me, which I’ll get into tomorrow. Reply via Email ← Notes"
year_published = 2024
