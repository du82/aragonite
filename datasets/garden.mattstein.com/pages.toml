["https://garden.mattstein.com/notes/five-star-review-of-dogs"]
title = "A Five Star Review of Dogs – Matt’s Weird Little Garden"
full_description = "Notes A Five Star Review of Dogs Nov 7, 2024 It’s been said before and I’m saying it again: dogs are great.How bizarre that our monkey ancestors surely went through some weird, rough times to live with wild wolves and then fast forward and we’re collecting their poop in bags and buying things from Etsy with their names on them even though they can’t read.They force us to live with fur and dog smells and chewed things and barking at inappropriate times and vet bills and deep pain when they leave us.But on the other hand, they are love.They trust and lick and wag because we’re a little pack.We return home and they are so fucking excited to see us that all previous thoughts are interrupted for the joyful reunion.Some are so ready for a walk they’ll bring the leash.We worry about our bullshit but they just want to hang out or play or bask in the sun together.We drive to the park thinking about work or that car sound and they’ve got a head out the window soaking in life so hard they have to go to the other window where it’s more fresh.They’ve got much less time and they don’t have our fancy brains, but they know how to be.★★★★★ Reply via Email ← Notes"
