["https://garden.mattstein.com/notes/people-content-21-clean-content"]
title = "People & Content #21: Clean Content – Matt’s Weird Little Garden"
full_description = "Notes People & Content #21: Clean Content Feb 21, 2024 Consider the Akro-Mils 39120 plastic storage tote.This plastic storage tote is not merely a storage box with a lid, but a storage box with its own integrated, toothy-looking lid on hinges.Here’s where it gets wild though.They can be stacked. Like, really high.Filled and stacked into a wall of boxes, a cube of boxes, or stored empty in a tidy column.The 39120 storage tote is a rugged, industrial-grade box more commonly seen in a warehouse or shipping facility than in the home of a storage enthusiast.You can put anything in it.Piles of books, an open sack of ketchup, your most cherished framed photos. (Separate boxes!)We’ve used these many times moving house. They’ll fit in a modest trunk, a cargo van, and a shipping container.Boxes full of boxes. Efficient, durable, re-usable storage.Easily labeled and carried.Sturdy enough to be temporary furniture for the creatively desperate.One look at this box and you’ll think of something that doesn’t fit in it. That’s okay.More storage enthusiasm will be necessary, which is perfect because I’m just doing a metaphor again.A database with clean, atomic, well-formatted data is a delight.As each website tries to return to nature, neatly-structured data may be the most effective slowing agent.This is especially true storing content from people that don’t care about databases.Dumping user-supplied content into rich text fields that store HTML is the “we’ll fix it in post” of CMS builds. It relies on editor configuration and hope, then inevitable markup parsing and manipulation later.It’s cramming everything into the moving truck, slamming the door shut, and letting physics and insurance coverage take the wheel.And maybe that’s fine!But I like migrating and cleaning data, packing it into carefully-labeled places, and worrying about the front-end ergonomics that make it feel obvious to work with.Data modeling and validation need to work together, maybe with some filtering, and thoughtful UI. And that may only be possible after a huge migration effort with purpose-built tools just to untangle and rejuvenate and establish a basic level of hygiene.But once things are stored carefully they can last longer and start to move in interesting ways.Touring bands have their rolling black boxes. NASA has ingenious modules for getting stuff into space.You can query, sort, search with all kinds of precision, use relationships, and build more flexibly and creatively in the future.These glorious boxes aren’t what matter, of course, but the stuff that goes in them.I guess the surprise twist is that even though I keep coming back to how I like building things for people, there’s a part of me that just plain likes tidying things and either creating or finding the order in them.Toss me into a pile of documentation, or a Notion account, or a database, and I will scurry around for a long time cleaning and rearranging and asking a jillion little questions about how I found things.I’d lose steam more quickly if it didn’t end up helping people somehow, but I can get surprisingly far with an inexplicable glee for tidying up.Content is always the sacred part of whatever I’ve built, and treating it with care is something that benefits everyone involved.Here again I use the word “content” because I think we both know what that means, but it’s worth remembering that it’s the point.It’s descriptions and names and faces and categories and tags and links and stories and whitepapers and photographs and videos. It’s marketing copy more often than I’d like, but often it gets to be more than that.Sometimes, it even gets to stick around for a while. Reply via Email ← Notes"
