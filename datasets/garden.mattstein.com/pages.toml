["https://garden.mattstein.com/notes/it-s-the-thought-that-counts"]
title = "It’s the Thought That Counts – Matt’s Weird Little Garden"
full_description = "Notes It’s the Thought That Counts Jan 1, 2024 I’ve been trying a mood tracking iOS app for a few days after someone recommended it because it helped with their depression.I had been liking it!I allowed notifications so every day it could prompt me to quickly summarize my mood. It was useful to reflect, and I left brief notes more often than not.We started our new year with a medical emergency, and once I knew it’d be fine I proactively hopped into this app to tell it how I felt because it colored the entire day until that moment.A bit later I was reading a book when my watch buzzed. I forget the message, but it was from this app at an odd time and involved the phrase “sweet deal.” The app I entrusted with notifications was pushing me an upsell.I liked the app enough that I set aside the betrayal of attention and looked for a promotional setting I could disable—but there wasn’t one.I deleted it, parting with the actual value it had offered.I value my fragile and finite attention. I hope that if you and I have interacted, reader, I’ve been respectful of your attention too. I hope that if you’ve used something I’ve made or read something I’ve written, respect for your attention is evident there as well.Once again my thoughts to turn to AI and automation, which can be used for a thoughtful, intentional kind of good—but also empower a forceful, unintentional noise that’s already buzzing around us with bulk mail, junk email, unsolicited calls and texts. Massively-followed people deal with actual human beings that respond with organic provocation, rudeness, selfishness, thoughtlessness.Thoughtfulness is important, even when it’s wrong or imperfect. It truly is the thought that counts, because it separates mistake from negligence.I’m bothered by this not because I’m above it, but because I’m guilty of acting without enough forethought all the time and I want to be better than that.I have been rude. I have replied hastily. I have been silent when I could have been empathetic. I have taken a tone of familiarity with strangers. I have said things that could have been left unsaid. I have mismanaged attention that people have trusted me with. Not all the time, and I hope I’ve been thoughtful more than I haven’t. I hope the trend is toward more thoughtful, not less.It’s because I’m entirely capable of betraying someone’s attention that I feel like I have to be vigilant about it. I won’t waste time on an app that’s been designed to be careless with my attention, particularly when its function is to provide regular notifications that create a sensation on my body. But I’ll be gentle with people that communicate differently and try to clarify what my boundaries look like and remember that people have been patient when I’ve spewed nonsense.It’s the thought that counts, and thoughts come in different sizes.Some are made by lots of people. Designed, engineered, released, marketed.Some are written very carefully and strategically by one person, or shaped by a few.Some are spontaneous exclamations or comments from one person in a moment of happiness or furiousness or confusion, or at the end of a long and difficult day.There’s an intent in every case, a deliberate thought, and that matters.I will try to be thoughtful more than I’m not. And please tell me when I’m not, because I’d rather have your kindness than your niceness if I’m lucky enough to have either one.I want to know who you are and what stories you have and I’d like to help you with whatever things I might be good at that make your life better or easier or more clear. If I’m lucky, I’ll come up with something that’s so useful to you you’ll want to pay for it!If ever you let me into a place where I’m allowed to bother you and I use that as a marketing opportunity, that will be a moment I’ve mismanaged. I’m not sure if I’ll have that chance, but I’d rather not be there than arrive only to abuse it. Reply via Email ← Notes"
