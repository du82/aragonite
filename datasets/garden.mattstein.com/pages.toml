["https://garden.mattstein.com/notes/people-content-17-ephemerality"]
title = "People & Content #17: Ephemerality – Matt’s Weird Little Garden"
full_description = "Notes People & Content #17: Ephemerality Feb 17, 2024 Being an organism on this planet is a dance with impermanence.I don’t want to make you uncomfortable, but I think about death regularly because it’s useful for me to keep some sense of where I am and appreciate now. I don’t have any special fear or preoccupation with it.And yet, I’m almost magnetically attracted to things that seem to last. Words, music, film, physical objects that weren’t made to be thrown out. It’s amazing that we can create things that outlive us, especially when they have enduring purpose or meaning. They can remind us of real sounds, smells, and scenes that only really exist as they’re happening—which makes these artifacts special.Most websites I’ve built wouldn’t outlast a cheap toaster.It can be tough to spend so much energy on things briefly seen on glowing rectangles, only to change or disappear.At the same time, everything’s always changing in some way so maybe there’s something to appreciate about such ephemeral work.So even though I spend a lot of time drawing in sand, I guess I try to do a decent job of it and invite others to join me.In my work it means leaving notes and trying to find sturdy, careful arrangements for whatever I’m making. I admire designers and developers that work with an unrelenting commitment to craft—much more meticulous than mine—knowing that most will not appreciate the care that goes into their work.The closest I get to anything that might last is in modeling information. It could be with an app framework, a CMS, or even some documentation: finding a sensible arrangement right now that may be able to grow later.It’s gardening with templates, code, words, design patterns, and a balance of structure that’s not so heavy-handed it fights the way things need to grow. There may be some initial landscaping to pull off, but if it works well then it becomes a matter of pruning, watering, fighting bugs (!), and responding to whatever nature decides to do.My longest-running projects have been CMS builds that evolved to survive vast changes to teams and infrastructure, and that one app I mentioned earlier that’s still going even though we’re all hoping it finds a capable and modern successor.I like gardening as a metaphor because there’s an interplay between nature and human intervention. There’s nothing natural about glass cables snaking through the earth to flash signals that let us exchange messages and order dog food any more than it’s natural to rip out “weeds” and build greenhouses and care for fragile, carefully-cultivated feature plants.But there’s an art and beauty to the balance, and eventually with both gardening and development I started realizing it’s best to start with maintenance in mind. Reply via Email ← Notes"
