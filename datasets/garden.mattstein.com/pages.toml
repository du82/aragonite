["https://garden.mattstein.com/notes/people-content-4-slashes"]
title = "People & Content #4: Slashes – Matt’s Weird Little Garden"
full_description = "Notes People & Content #4: Slashes Feb 4, 2024 Thanks for reading again! I’m grateful to have you along.It’s becoming apparent that I’m telling you a really long story.It’s as much a surprise to me as it is to you, because while I know roughly what I’m getting at, I have no idea exactly how I’ll get there. Or even if I’ll make it. These posts are taking me a long time, and there will not be a break for twenty-five days.It seems worthwhile, though, partly because of the things I’m taking notes about and not getting to. Tracking down teachers and thanking them. Re-reading Frankenstein and digging book titles out of old course syllabi.I’ve realized my inner child inventor is the one having so much fun with the 3D printer.My full-time work life has spanned just shy of two decades. While I’ve learned and changed in that time, it’s my first work experience that, after years of school, finished off the foundation from which I’d build my career.My very first design job planted three seeds that are now weird forests as I write: Design was something I did with co-workers, for clients.People I never met became part of my daily experience through the internet.I became a designer pretending to be a developer. I had co-workers in jobs well before this, and practiced doing client work later in college, but it was new to be doing collaborative work that involved subjective style, balance, and taste as much as technical requirements, for clients who were always utterly unique.I’ll come back to the idea of internet strangers in my daily life, because that’s so much of where “content” comes from. (You saw that coming.)Becoming a hack is what allowed me to flourish professionally, and it’s also a condition from which I have yet to recover.After graduating I drove from one side of the country to the other, moved into my first apartment, and got a job with a small interactive agency where a contract and business card both agreed I was a designer.The diploma is a strong suggestion that’s certified by a paycheck.The agency was run by three designers well into their own careers, that decided to leave bigger companies and start their own studio.My education continued there, hearing them decide how to pitch and price projects, manage workload, and maintain a high level of quality while hitting deadlines and paying everyone. We worked on websites, interactive kiosks, and some print material.The clients were wonderfully varied: libraries, radio stations, software companies, coffee shops, museums, publications ... always new and interesting challenges, new organizations and audiences to consider.I helped build static HTML websites and contributed to design efforts. I handled an increasing amount of Flash work because I had already made some bad Flash sites in college, which is a prerequisite for building decent or even good ones.This led me to the book that singlehandedly altered the course of my career: Colin Moock’s Essential ActionScript 3.0.I thought I was going to learn how to do more advanced Flash work—and I did—but Colin tricked me into object-oriented programming.This was huge.Instead of cramming code into a timeline like a sleeping bag into a stuff sack, I was writing classes for the actors that would appear on the stage. There was room to stretch out, organize clearly, be expressive and specific. I became an architect and a conductor, and my projects gained depth and elegance. Not at first, of course, but the more I built the better I got at identifying and using patterns, relating things to one another, and intuiting how something should be organized.It was development led by design that was ... maybe art?Flash was fun and infuriating because every pixel had to be managed. It wasn’t like HTML where a browser would render elements and provide basic interaction—it was an empty canvas where absolutely everything had to be provided. If you wanted a link, you’d have to put it on the page and manage the cursor along with the concept of a “page” and whatever getting from one page to another looked like. If you wanted some form fields with validation, buckle up.But unlike HTML, everything was a ballet. Things could move in and out with coordination and flourish. This meant playing with motion and color and masking and sequencing and details that needed to work together, literally move together, for some coherent effect.My business card still said “designer,” but there I was very clearly doing development. When I would paw at code in TextMate instead of Flash, I would be living the very interesting lie that I was a developer. I liked it! (TextMate had a good icon.)The plot thickened when I took it upon myself to start integrating the static HTML sites we’d deliver with a system called ExpressionEngine. It was a content management system, a PHP app running on a web server, that could be customized in a reasonable amount of time to allow the client to manage their own content.Like my ActionScript development, there was an art to that too: arranging information in a way that might be intuitive to work with and encourage a body of content to grow neatly rather than tangle into a hairball.We had shipped static HTML and made updates for clients when they needed them, which was increasingly often. The studio wasn’t set up for long-term maintenance, so a CMS enabled self-serving that benefitted everyone. (It would take many years for me to realize that the CMS also needed long-term maintenance—and I get the sense a lot of us were figuring this out together at the same time.)CMS integration became the standard for how we delivered projects, which in turn became a selling point.ExpressionEngine required another flavor of development. Sometimes ExpressionEngine would sit behind a Flash site, so I was doing a lot of development that definitely was not design.I learned on the job, but I was not a trained developer. I didn’t go to school learning about software design patterns and architecture. That’s literally what my roommate was studying while I was painting circus figures.High on the realization that design principles applied to development, I further complicated my identity crisis by applying them to how we worked. More projects and employees meant new ways to be confused or out of sync, so I started updating a whiteboard with everything that was going on and checking in with people. I don’t remember if anyone had asked me to do this, but I remember they started looking at the board. Then we started regularly looking at it together.I would briefly pause being a sort-of developer to be a sort-of project manager.A designer slash developer slash project manager.Enjoying these slashes is what fueled my decision to chase more of them running my own little business. Slash owner. Slash bookkeeper. Slash writer. Slash teacher. Slash server administrator. (Or in the parlance of the time, WEBMASTER.)The problem with the slashes is that I felt like most of what I was doing was fake. I wasn’t a real developer, or a real project manager, or a real writer—but I’d worked with people that were. Never wanting to oversell or misrepresent myself, I tended to be quiet and not sure what sort of title I could fit under. The more I pretended at all these things, the more I started to wonder whether I could call myself a designer.I’d love to tell you how I worked it out, the internal self-doubt that comes with being a not-expert at many things, and the external challenge of framing and identifying ideal opportunities.But I haven’t.It’s a theme in a lot of my writing right now: shoveling through layers of complexity I’ve accumulated, looking for the playfulness and curiosity that connects my heart to what I do.Isn’t this each of us?You and I have titles to project, personas to create or shape, realities to curate.We are people, with our art—whether you’re comfortable with that term or not—and we have things we need to do while we’re here.What am I doing? What is my art? What is my job? What art is worthwhile even when it feels like a job? Am I packaging content for a machine, or finding ways to be curious, creative, and playful? How often am I fooling myself with answers, and what’s the cost of that ruse?Maybe this is just me. I hope you’ve got things more figured out, and I really hope you’re in touch with the sort of creative play that only needs to satisfy you.I’m publishing these long out-loud thoughts, which is both uncomfortable and motivating. I’m nervous about what you’ll think of them, and I get energy from it that I pour into trying to tell a story, hopefully finding the right words and scraping out the typos.This is my story, but by reading you’re part of the adventure. Whatever your internet life looks like, you are part of the story of people and content that’s bigger than either of us.The network effect has a weird power to shape things,for better or worse. Reply via Email ← Notes"
