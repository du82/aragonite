title = "People & Content #10: Blue Screen – Matt’s Weird Little Garden"
full_description = "Notes People & Content #10: Blue Screen Feb 10, 2024 It’s a lot.Publishing every day, but also the internet. Also publishing about my relationship with the internet.I’m aware that I’m a white cisgender male that’s not experienced the compounding effects of people and systems working against me. I hope that you and I are more alike than we’re not, and this is just my part of our story.I’m surrounded by people that seem to get energy from the constant change and stimulation, and I also know that burnout is common. Many have shared openly about it, and I understand why someone might choose not to.Burnout is too big to wander into here, but my personal adventure has led to a challenge I would bet we have in common: I’ve had to learn when to put it all down.I say this like I’ve got it figured out, and of course I haven’t.I’m done with immediate hype for new technology. I skeptically wonder what it will demand of my finite time, money, and attention. Will it leave me with more of those, or less? Will it give me more options in the future, or fewer of them?A new thing I’ve started considering, even though I’m late to the party, is what embracing a technology might mean for the people around me.It’s not just about new things though, but paying attention to where I’m at, what I’m giving attention to, and being vigilant about pruning and replacing whatever demands too much.I alternate between a $400 Apple Watch and a $15 Casio F91W. Both of them tell me the current time and date. One of them has a multi-year battery life and never, ever sends me notifications.I am touchy about notifications.My big life hack is going on morning walks. At least when it’s pleasant outside. (Yes, that’s only “fair weather” mental health but this is not a how-to article.)Journaling, playing with a little dog, and yard work are regular things that keep me from racing into projects and screen-based problem solving.Creating is solid ground, especially just dumb stuff for me: food, writing, music, strange 3D-printed objects, sketches, photos.Taking time to be still is essential.I can tell I’ve done a bad job when I attempt to read a book with wandering thoughts, and notice I’ve re-approached the same paragraph for the ninth time.But the ultimate test is nothing.Just sitting and breathing and thinking “hey, I’m breathing!”It’s amazing how many thoughts come screaming out and colliding with each other when I attempt to be still.I spend most of my waking hours ignoring this because I have problems to solve, so for ten minutes I’ll sit quietly with it.I’m working on recognizing when I’m overstimulated and scattered and urgently need to do nothing.In a similar way, I’m learning to appreciate the natural overwhelm that comes with algorithm-free choices.I am oversubscribed to email newsletters and RSS feeds right now, for example.I remind myself that I’m reading for enjoyment and not to make it a job. I’m grateful that there are so many people publishing notes, thoughts, videos, and interesting things. I stumbled onto their blogs and channels because of conversations, notes, links, and the web exactly as I want to experience it: organic, nutrient-rich, without too much venture capital high fructose corn syrup.There will always be more than I can read, see, or understand. People I would have loved but won’t ever meet. I will never get to all the things I would like to.Accepting that seems better than fighting it.I need to learn to curate and manage my own attention, because the future will have more products and artificial intelligence and platforms eager to do it for me.I’ve learned something casually outsourcing my attention:Absolutely fucking not. Reply via Email ← Notes"
