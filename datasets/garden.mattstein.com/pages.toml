["https://garden.mattstein.com/notes/people-content-9-content-creators"]
title = "People & Content #9: Content Creators – Matt’s Weird Little Garden"
full_description = "Notes People & Content #9: Content Creators Feb 9, 2024 I can’t figure out how to write this one.With each post so far, I’ve had a piece of this arc in mind and tried to find my stories for it.Even if it’s a tired old story, I reason, it earns its place here by being mine.I’m trying to find the play I started writing about, and whatever my art is for me and whatever content I want to share. I haven’t made it through this part, so I don’t know what stories ground it.I wrote a weird love letter to all of you about how glad I am that we’re here even with the mess of algorithms and thievery and hate. But that was less of a story and more of a sermon.I wrote about how much effort I put into Amazon and Yelp reviews for a few years before deleting each one. But that odd rebellion paints with a broad, cranky brush and misses what I love even from the content machine.I wrote about how annoyed I am at YouTube thumbnails and the Millennial pause and Google AMP pages, and anything that’s about paying homage to algorithms. But I just did an old-man-yells-at-cloud post and that really isn’t what I’m trying to do here.So I guess I’ll just say plainly that the internet seems like a mess, but people give me hope.The beauty of this whole magical, stupid thing is people connecting with one another and sharing what’s uniquely theirs.Earnestness, playfulness, dedication, imperfection.It bums me out that platforms are keenly aware of this and purposefully commodify our most basic impulses for profit, but not even that keeps it from being special.We have SEO nonsense and YouTube thumbnails and content farms and reminders that it’s a commercial landscape.But we also have blogs and forums and federation and freely-available information on an open internet.There’s no hard line between the nonsense and the beauty.I was moved by the artistry in a Yelp review of a vegan pizza place in Austin.I am annoyed with some independent writers on Substack continuing amazing work without even acknowledging the elephant in the room.I temper my Twitter fury remembering that people have strong convictions and special relationships there that they don’t want to lose.Someone has probably even experienced some form of wholesome, genuine human connection on LinkedIn.Being able to write like this and share with you, no matter who you are or when you’re here, is special. It gives me a way to directly participate in something I’d like from the world, where everyone has a place to tell the stories that are uniquely theirs.This was possible before the internet, with books and magazines and films and performances and stories told at dinner or around a campfire. But the internet brought interesting opportunities for richness and accessibility and reach.Platforms, as revolting as it is to admit, have been part of that.It is possible to have fun with friends at a shopping mall.I don’t know what my story is here, but thanks for reading on my little internet website. Reply via Email ← Notes"
