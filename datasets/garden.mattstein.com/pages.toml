["https://garden.mattstein.com/notes/moments"]
title = "Moments – Matt’s Weird Little Garden"
full_description = "Notes Moments May 2, 2024 I live with a low-level sorrow knowing it’s all slipping away.For me, for you, for everyone either of us knows.Life is a gift with an expiration date.This is buoyed by all these moments I get to live in.I can get preoccupied stringing moments together to get to some imagined place in the future, or avoid places I’ve been in the past, but I’m most alive when I’m giving full attention to the present. The clock continues to tick, but listening to each click gives me a sense that I’m slowing time and fully present.I don’t know how many moments I will get, and they’re not uniformly good or bad.I feel a pressure writing this knowing you may read it, and those moments you spend reading it are not ones where you’re kissing your child’s forehead or throwing a ball for your dog or whatever your happier moments look like.I forget where I first learned about overworked call center employees pausing just before or after the script, lingering in a moment for a desperately-needed break. I’ve heard it, and while I’m generally impatient I always wait quietly for them to start or disconnect. Even if I’m wrongly interpreting the situation, there’s a chance they need that moment more than me.I have the luxury of choosing many of the moments I live in, and I’m still not great at it.Notifications irritate me because they pierce and sometimes sever quieter moments. They can invite connection with a friend, create a moment of opportunity with a co-worker, or interrupt life for yet another marketing opportunity.I removed Slack, Discord, and Ivory from my phone and my life instantly got quieter. Online interactions happen at my desk or on a laptop. I started missing some electronic social moments and living in different physical ones.I haven’t been posting much, or doing a whole lot online outside of work, and instead I’ve spent more time around town, off in the woods, watching shows with my partner, and reaching out into the world more immediately around me. I’ve been more absent in some places and more present in others.There are a lot of moments where systemic neglect wins out over intention, and those are the ones I want less of.I made the comically dull mistake of ordering takeout from a restaurant I found on a website, only to arrive and discover the restaurant did not exist. Some websites helped me find the place and assured me it was open, took my order and payment, and my phone helped me find my way there. A person at a nearby business confirmed that no, the place I ordered from was no longer there. Another person on the phone apologized for the confusion and refunded the order and made sure the system no longer took orders.How valuable was that system? It created problems for me to navigate that would have been avoided if I wandered around and picked out a place existing in the same reality. I would have placed an order and waited and still probably spent less time than I did calling support and finding another place to get dinner. I’d prefer that moment of waiting and taking in a new place to making a support call and driving around because someone didn’t bother to update something.We live among systems. I’ve spent countless moments helping create them. These systems have the power to shape how we spend time. They have the power to return us to the sorts of moments we want, and the power to rip us out of them.The best ones amplify intention, and the worst ones obfuscate, synthesize, or defer it.I don’t want to avoid technology any more than I want to avoid air—but I want to be intentional about what I choose to live with.I want to live in moments of laughter, wit, exploration, contemplation, and enjoyment. A smirking argument with a friend, a dog stretching out with eyes closed to the sun, a drive or a hike out into the unknown, writing with coffee on a rainy day. I want more systems that help get me to those moments and fewer of the ones that limit them, which is tricky when a system can do both.When I think of a person, their defining attributes are usually from flickers of moments I remember with them. The way they pause before they answer an unexpected question, or react when someone spills a drink, or the way their laugh sounds when they’re tired.Maybe the moments we live in are the most important things we’ve each got.What sorts of moments do you long for and live with? Reply via Email ← Notes"
