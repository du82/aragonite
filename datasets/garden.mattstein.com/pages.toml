["https://garden.mattstein.com/notes/here-lies-civility"]
title = "Writing Month #2: Here Lies Civility – Matt’s Weird Little Garden"
full_description = "Notes Writing Month #2: Here Lies Civility Nov 8, 2024 We are gathered here to today to remember civility.And frankly who cares.It died clutching its heart at the growing roar of “fuck civility!”Good riddance to this scourge of weakness that kept people from splitting into clear sides and fighting.What did civility ever do for anyone?Civility wasted precious time and energy on hopeless tedium: asking questions, looking for common ground, bringing and appealing to one’s better nature.Civility made a whole thing out of sharing the same neighborhoods, schools, roads, libraries, town halls and bars when it’s more simple to draw lines and take swings at anyone crossing them.Civility was a facade, not a real and vital place to gather.Civility would hear nonsensical or misguided words from another and say “can you help me understand that?” instead of swift, humorless condemnation.Civility had it exactly backwards, always searching for commonality instead of attacking differences.Civility was often misguided humor trying to diffuse tension and avoid righteous violence.Civility’s friends were always ignorant about how the world works, and how people operate.Civility wasn’t even loyal! It would admonish its own friends for being hostile to a stranger that surely deserved it.Civility is no longer able to get in the way of a brighter future with a more clear concept of “them” that is certainly not “us.”Civility was a cowardly, short-sighted, privileged, delusional refuge for those duped into imagining peaceful coexistence despite very real differences, very grave stakes, and irreparable wrongs and harm.Civility can no longer have us waste time with kindness when we know someone has been wrong. It can no longer whisper to each of us that we too have been wrong, misguided, and harmful even when it was not our intent.Civility duped people into wondering what they might be wrong about instead of feeling the power and solidarity of forcefully extolling what they were right about.Civility didn’t understand that asking about an ugly thing was the same as embracing and condoning it.Civility droned on about unity, completely out of touch with how divided we’ve always been.Civility actually seriously thought it was more important to first see a person rather than their ideology.Civility knew there could be lasting division, disagreement, and hostility and wasted untold energy exploring other possibilities.Civility thought the hero and the villain could be the same character. Can you believe that?! It didn’t believe in heroes or villains, just noble, deplorable, and unremarkable acts strung over the span of a life.And now that civility is not around to hear us say it: what stunning ignorance!What an utter, self-deluded fool.People do intend harm!People do relish exerting power to get revenge and hold others down!People do use humor and nuance and questioning to deflect, obscure, and distract from more sinister aims.Finally civility is not here to insist that those people are fewer than we think—that most generally want to do good and mean well, that misunderstanding and miscommunication account for unfathomable amounts of conflict. That hurt people hurt people and wrong is not a permanent condition.When someone pledges allegiance to a bad idea, they are clearly and solidly and irredeemably the enemy and therefore deserve to be vanquished.Civility tried to keep us from the sneering judgment, division, hostility, and war that have always made us better.Let’s dump this casket of obsolete shit into the ground. Reply via Email ← Notes"
