["https://garden.mattstein.com/notes/people-content-5-networking"]
title = "People & Content #5: Networking – Matt’s Weird Little Garden"
full_description = "Notes People & Content #5: Networking Feb 5, 2024 This post is part of my ongoing blog challenge, and appears in this month’s IndieWeb Carnival hosted by Manu. Our family’s first computer arrived when I was in elementary school. Its throne was a desk in our den.A friend’s computer graced a folding table in his parents’ bedroom.It seemed like everyone was figuring out where to make room for computers—not as a metaphor, but spatial logistics and feng shui.I was allowed to order shareware from catalogs, and played game demos that came in the mail on floppy disks.The postal network.You may know already know this feeling, that the world changed in that first moment you heard a modem screech and howl its way onto the internet.Our single phone line brought web pages, multiplayer video games and mods that could add levels or change them, and the all-important AOL Instant Messenger.It instantly connected us, but everything wasn’t massively online all at once.My favorite of these networked-but-not-online spectacles were the LAN parties we’d have in high school.Friends would lug custom computers and monitors to someone’s house, take over a basement, and wire all of it together with switches and ethernet cables. We would spend days playing Counter-Strike, StarCraft, and ... I actually wish I could remember everything we played. It was a glorious pit of high school energy that smelled like Red Bull and pizza rolls.No latency or connection problem got in the way of all the yelling and trash talking, each person glued to his battle station. A faction might split off and start another game, with others following along to whatever would be the most fun. Someone might leave for a work shift or sport practice, returning a few hours later like it had been a trip to the bathroom.Friends and family with no interest in playing came to just to heckle and eat junk food and marvel at the extravaganza.AOL trial disks littered the mail, and in my social sphere AOL Instant Messenger was the first place to hang out online.It was always the kids from school, and you could only loiter and chat as long as it was cool to take over the phone line. This could be fragile: a tinny voice might crackle through the modem and demand to make a phone call.But oh, Instant Messenger! Sounds that are etched into my consciousness: the door opening and closing that signaled a contact coming online or leaving, the tumbling bleep of a new message that could be from anyone, including that one girl. (It was usually somebody else.)Netflix was a website where you could maintain a queue of DVDs, delivered in red and white slips in the mail. You’d watch one, mail it back, and a new one would arrive. That one movie you never watched would be an existential weight—it seemed like a good idea at the time, but you never wanted to watch it and so it sat and clogged the operation. Voracious content consumers could have five discs out at a time.Our high school’s ethernet network was like Instant Messenger and LAN parties: as soon as two computers were connected, two people were chatting. Files were being printed and saved in mysterious places.Lines of little lights pulsed with possibility.It’s easy to let the excitement of a new contraption overshadow what people do with it.It’s been the same with canals and trains and telegraphs and airplanes.We use elaborate systems to collapse whatever separates us and be closer to one another. That part is beautiful. Reply via Email ← Notes"
