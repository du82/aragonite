["https://garden.mattstein.com/notes/ai-is-a-mirror"]
title = "AI is a Mirror – Matt’s Weird Little Garden"
full_description = "Notes AI is a Mirror Dec 28, 2023 I disagree with the sentiment that AI will reflect our worst tendencies.Or rather, I agree but that’s only half of it.AI is automation technology.I’m not convinced any technology has been about advancing good or evil, but rearranging power dynamics.The one with access to a given technology, or ownership of it, gains power from it.AI will not reflect anything in a one-sided way, but amplify more of the same.The capitalist will use AI to capture market share and profit.The artist will use AI to explore ideas.The perpetually lazy will use AI to avoid thinking, organizing, or communicating.The student will use AI to learn or to cheat.The grifter will use AI to take credit for other peoples’ work.The conservationist will point at AI as a waste of resources in a world with finite resources.None of this is new.The marketing machine sells, and it’s selling AI as a new answer to old problems. That’s what the marketing machine does, and it works for the capitalist. That has a disproportionate effect on how we see AI, I think, and I have growing resentment for the capitalists, but that’s not all that AI is.It’s a new mirror that, like the old mirrors, reflects every highlight and shadow. Reply via Email ← Notes"
