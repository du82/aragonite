["https://garden.mattstein.com/notes/future-self-awaits"]
title = "Writing Month #4: Future Self Awaits – Matt’s Weird Little Garden"
full_description = "Notes Writing Month #4: Future Self Awaits Nov 22, 2024 A me in the future is waiting.It is the same entity that was me twenty years ago, and the same entity that is me today.But just like teenaged me is very different from today’s me, my future self has changed.Future self wears age well.Not just an exterior that looks more at home with smile lines and a measured gait, but a goofiness and creativity that are balanced against a long time watching, listening, making mistakes, and finding connections.Future self is able to be louder, and quieter, and have the presence to know which best suits the moment.Future self is more grateful for the time that’s left, yet more calm and less rushed than any previous selves. Future self is less worried about passing time, and more intent on finding meaningful ways to spend it.Future self is still afraid to do things, to look stupid, and to make mistakes. But he’s more likely to try something and not shy away from it. He’ll find a way to get at it sideways instead of turning around. If he decides against it, he continues to what’s next with less hesitation.Future self cares less what others might think, and finds more energy for those in front of him.Future self has a few good friends, and does a better job of nourishing those relationships.Future self uses a hard-won peace to find others looking for it and help them.Future self probably has a tattoo.Future self has found a way to live within his means, and a way to earn and think about money that doesn’t waste energy earning and thinking about money.Future self is the person I’ve been growing toward, wanting to know, and wanting to share with others. He is thoughtful, strange, kind, and makes you want to be not more like him, but more like you.Future self is good at listening to and telling stories.Future self stands up, looks up, and speaks up more with bravery and kindness.Future self is writing the most interesting part of my story. He is waiting for me to trust myself, take chances, and look away from fear toward joy.He is waiting for me to realize that my humor and my sensitivity and my curiosity are exactly the tools I need to overcome fear and self doubt.He is waiting for me to see that I already know what to do, and that I need only do more of it.Future self makes things out of clay, and shares them.Future self takes more photographs because finding images helps him see.Future self plays music. He practices so he can play well with other people.Future self values what he’s able to share.Future self makes mistakes, says things other people don’t like, and is misunderstood more. But future self does not stop being kind, or careful. Nothing keeps him from finding his people and seeing love blossom.Future self ends up dead. But before that, he is alive. Reply via Email ← Notes"
