["https://garden.mattstein.com/notes/people-content-3-design"]
title = "People & Content #3: Design – Matt’s Weird Little Garden"
full_description = "Notes People & Content #3: Design Feb 3, 2024 I lucked into a weird slice of time to study design.Graphic design was a calculated gamble, more likely than fine art to lead to a job after school.It was also less likely than architecture to cause physical harm. There are not a lot of load-bearing letterforms, and city inspectors don’t permit logos or kerning. (Couldn’t hurt, though.)It might involve the internet, depending on who you asked.Different college programs, and professors at the school I attended, were figuring out what to do with the world wide web.Publishing, advertising, and print media were all established design territory, but what was the internet?It wasn’t new, but it didn’t resemble whatever you would call today’s landscape.AOL Instant Messenger was still a big deal, TheFacebook was new and limited to school email addresses, Flash sites were vibrant and alive. Strong Bad was in its prime. It was a world viewed from desktop and laptop computers—the iPhone didn’t arrive until my second year.I had tenured professors that dismissed “web design” as nonsense, and thankfully younger punk rock professors that dove headfirst into the burgeoning medium with all its possibility. Contrasting reactions were another form of education. Squares We studied in a Bauhaus style, which means I began by spending hours upon hours with rulers, X-ACTO knives, and hand-painting perfect black squares. Cutting foam core and mat board with flawless precision. Or rather, until I achieved flawless precision. (The secret is to always use a fresh blade and don’t screw up.)Minimalism so brutal you might have laughed to walk by a class discussing a wall of slightly different squares, without humor or insanity. We so thoroughly exhausted shapes on grids that being allowed to use type felt like moving from formula to solid foods.One of my actual assignments was to cut out paper circus silhouettes and paint them around a color wheel. I was toiling at this in my dorm room when my roommate looked up from his engineering book with bald disgust: “are you fucking kidding me?”I was the absurd clown I was painting. Some moments were tough.But we did something in design classes, from the beginning with the squares, that made a lasting impression: we critiqued work.We would each pin up whatever we’d done and examine it together as a group. Each person would explain and then defend whatever choices they made. It was not show and tell, but the active process of critically evaluating what we’d made to improve both the work and our ability to talk about it.This was, and is, fascinating to me.Seemingly-strong work could wither under scrutiny, while mediocre work could look strong next to a thoughtful or persuasive student. It could get tense, particularly when someone phoned in an assignment and failed to bullshit their way through it.In those four years of critiquing work, we learned not to submarine each other because everybody gets a turn. More than that, I think we all eventually saw critiques for the gift that they were: the full attention of people studying the same thing and wanting to give and get feedback that would push the next project or iteration forward.It can be a lot to ask of someone to consider your work and offer constructive feedback, and it can make a massive difference for how things evolve.I’ve always wished there was more of this in my life after school: with code, with writing, with just about everything I’ve done professionally. Critique can seem harsh, but when it’s about the work it’s an act of kindness that doesn’t waste time being nice. Liberal Arts My relationship with music turned mostly into one of consumption, except for jamming in dorm rooms and a stage performance of my hit single about finding poop in a dorm shower stall. I also led religious worship, but please don’t hold it against me because that’s a whole arc that won’t be part of this blogging spree.Liberal arts classes brought all sorts of ideas rushing to the foreground, and I loved them.I did more reading and writing than at any other time in my life. Every new syllabus was packed with books I’d have to work at with my glacial reading pace, but they were always interesting. History, philosophy, psychology, politics, cultural anthropology.New little brain worlds expanding and bumping into each other, reinforced with notes and writing assignments.I created images with way more pixels in classes for motion graphics, film, and photography. The school was known for photography, and photo major friends could check out all sorts of equipment for me to play with. Entire rooms with lighting rigs!Printmaking taught me that sometimes just enough control is better than too much. That accidents and weird ideas can be what rescue an image that’s not working.Drawing classes pushed into new territory. Massive paper to work on, varied subjects and exercises, fancy lighting. Trips out to draw in the field. For the first time in my life, this included figure drawing. The expected awkwardness of drawing a naked person in a silent room wore off quickly, because it was fun and challenging to sketch people with their movement and expression and complexity in a focused classroom setting.Nobody expected the session where the model brought rope and fashioned himself into bondage scenes, but pencils scratched paper and those too were sketched. The weirdness that nearly broke me was the time a model put hand binoculars to his face and twisted his body to point them directly at me for a few minutes. The model was lit in the center of a dark room, surrounded by desks. All eyes in that circle were on me, waiting for me to crack, and I did not. That was among my greatest scholastic achievements. Can vs. Should Bill Klingensmith was one of the professors that leapt right into the internet, so naturally he taught a Flash course. I still vividly remember waiting in the computer lab on that first day.He walked in quietly, set his bag down, and did a cartwheel in the tight space between the projector screen and the first row of computers. It was not graceful. His keys jingled onto the linoleum. He held an awkward silence, intensified with scanning eye contact. Then he spoke.“Just because you can do something doesn’t mean you should.”That’s how he started a Flash class.It would be wrong to end on that note and leave you with the impression that he was discouraging experimentation and play—which was not the case. He insisted that what we were doing was still design, and that it should be done with the intention and sense of craft we were developing in our other work. Chip I’m writing all of this trying to get to Chip.It’s commonly held that the mark of an excellent teacher is one whose lessons stay with you as you continue through life.I’m grateful for so much of my college experience, but I’d be living in a less interesting world without Chip Sheffield’s art history classes.Chip was an unassuming, neatly dressed guy that carried a briefcase and could have blended into any office or accounting seminar.He spoke softly and plainly but shook every wobbly idea I ever had, using any kind of art from any period in time.His motto could have been “if this is comfortable and easy to look at, let’s find something else.” He would immediately pull stapled sheets of something-elses from his infinite briefcase and continue the discussion.Art was not a march of historic specimens, but a living, pulsing, unbroken discussion among people through time. Provocation, rebellion, beauty, solidarity, conflict; anything it meant to be human could be captured and examined with art.Chip did not swear often, but when he did that was art.His classes were all great. If he offered Ways to Load a Dishwasher or The Details of Tax Forms I would sign up with complete confidence that I’d be enthralled.The class I think about regularly a decade and a half later was called Art and the Machine.It focused on the art that responded to the rise of the industrial revolution, and continued to follow the interplay between art, technology, and industry. Charlie Chaplin. Mary Shelley. Andy Worhol. The camera obscura as a mental model and how people started thinking and talking about themselves with the advent of motion pictures and computers—and the trouble of modeling human thought after machines in general.A silent film that we watched in that class was one of the most chilling and beautiful things I’ve seen in my life, and I can’t even manage to find it again. It was grotesque and ingenious. The classmate next to me only looked up from crying to be upset that I could watch.Chip was not fucking around.Reading Blood in the Machine last year brought me back to this, striking at the same themes and focusing a spotlight on the human tragedy in the advancement of machines.The commodification of art is the industrialization of our time, where artists are reduced to creators feeding a machine that’s not concerned with their wellbeing.I’ve been writing about my relationship with art, design, and how more resources and complexity have enriched the experience—with a cost. I’m not a “content creator,” and I can’t call myself an artist, but I’m trying to find my balance of play, art, and work with the hum of this machine in the background.In college I studied, developed skills, and found interests and themes that resonated with me and still do.I started drifting away from playful art just for me, expanding my ideas about what art is and what it can do, and practicing visual problem-solving aimed at jobs and agency work.Even with the freedom of living away from home, it was a structured environment like all of my schooling.It was nothing like moving west and finding work. Reply via Email ← Notes"
