["https://garden.mattstein.com/notes/how-to-participate-in-internet-jokes"]
title = "How to Participate in Internet Jokes – Matt’s Weird Little Garden"
full_description = "Notes How to Participate in Internet Jokes Jan 8, 2024 Be weird.You can be normal, but you’ll have a harder time coming up with material.Be on alert.You need to spot opportunities and move quickly.Stay in ready position: firm stance, arms slack, prepared to move in any direction. If you’re deep into that New Yorker article, that’s going to affect your joke responsiveness.Identify opportunities.Find the line between unexpected twist and catastrophically off topic—it can sometimes be very thin. If the opportunity lands within topical boundaries, proceed to step 5.Quickly think of a joke.There’s no hard rule, but you’ve got at most sixty minutes before the window of good times closes, and your best joke will slide down the glass with that cartoonish sound. You know the one.Keep trying.A lot of your jokes will have the right timing and placement and seem good, but you’ll realize later actually they were bad. So just like basketball free throws and haircuts, you’ve got to keep at it and not let the mistakes slow you down. Reply via Email ← Notes"
