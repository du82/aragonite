["https://garden.mattstein.com/notes/people-content-11-dynamic-work"]
title = "People & Content #11: Dynamic Work – Matt’s Weird Little Garden"
full_description = "Notes People & Content #11: Dynamic Work Feb 11, 2024 Now that I’ve distanced myself from dehumanizing platforms and the business of content management, I’d like to tell you how I’ve been part of it.Earlier I shared that my first big splash was taking our studio’s static website deliveries and making them dynamic, which is an odd distinction.I started out building Flash sites, which from a visual perspective were some of the most dynamic things I’ve made on the internet. Lots of movement, sound, video, and variety. In those dark times, Flash was one of very few ways to use custom fonts in a browser. Unless, of course, your browser didn’t have the Flash plugin and you’d get a sad trombone.My first hand-built HTML sites were not responsive, and used tables and sliced images for layout. That’s pretty intensely rigid, and despite the rampant nostalgia in these posts I’m glad so much has changed for the better.It was fun taking hand-spun HTML and integrating it with a content management system.Not stripping down WordPress and tumbling through the loop, which never felt right because we weren’t building blogs, but a lesser-known system called ExpressionEngine. It didn’t have themes or opinions about the front end, or any canned idea of content hierarchy. It was a designer-friendly tool that made it fairly straightforward to create a site’s sections and pages, then add template tags to some plain old HTML to turn it into a living, efficient machine.An engine, if you will. For expression.This meant that clients could log into a web-based control panel that wasn’t littered with junk and manage their own content. Add articles, fix typos, create accounts for other people.Something started here that I’ve continued to love, which is helping people directly own and manage their internet presence. Being a helpful nerd that, if successful, becomes unnecessary.In 2024 this reads like an explanation of indoor plumbing, but at the time it was a bit of a discovery.There was also an art to it.That CMS needed to run somewhere and be maintained to keep working, which we didn’t think about enough at the time. (There are still agencies churning out complex web projects and leaving clients to figure out what to do with them!)More subtly than that, arranging the machine to last is a challenge unto itself.First of all, every website is dynamic in that it’s only kept alive by an electric labyrinth of cables, satellites, datacenters, and uncountable tiny blinking boxes.Nobody even knows what all the boxes do.It is unnatural for a website to be online, even though we think of that as its default state.So every website is trying to return to nature, which is to say not being a website at all.And that’s before you get to an organization responsible for the website, which is a group of people that have agreed to do something together.People, as I’ve been writing about, are much more complex and interesting than companies or websites.No two people are alike, so it’s an astounding miscalculation to assume that any two organizations comprised of people would ever be alike.The website needs to work for people, which means a CMS needs to do a lot of things carefully: It needs to be arranged so that finding the most commonly-touched content is obvious.It needs to use whatever field names, tips, and previews give the content author confidence that they’re publishing exactly what they intend to.I needs to limit peoples’ access to what they need, both as a protective measure and to reduce the amount of UI they need to wade through.It needs to be arranged so that the relationship between the front end and back end is not a great mystery.It needs to abstract away anything that’s not thinking about content. (Which means that design should be doing real work and not trying to burden editors with innumerable presentation and layout concerns.)It needs input fields to be specific enough to capture clean, discrete clumps of information without being cumbersome.It needs to be built for the objectives at hand and anticipate how the organization and site may grow together.It needs to explain itself under the hood for whoever may have to understand it in the future, in a way that ideally is a love letter rather than a middle finger to people who are not you. Every website is living on the verge of being tossed out and completely redesigned.This liberation of a redesign comes with a cost when there’s content to migrate. The cost is higher when many years of posts are crammed into WYSIWYG fields with one-off style changes and cruft pasted from Word documents.Inline styles are a visible reminder that the website yearns for the sea.If content authors can keep working confidently in the same place while the underlying architecture and front end change radically, that CMS is doing its job.More often it’s loaded with a sort of technical debt that’s easy to accumulate, so it seems best to burn it all to the ground and start again.The organization changes too.Teams are born, and grown, and split. Owners change. Internal design teams want more control. Marketers want to run experiments and add forty tracking scripts.Even projects built for a single person shift and change.This has been my favorite part the entire time! I love getting a backstage pass and seeing how different people and companies operate. Paying attention to goals, needs, politics, and everyday patterns is the only way to be sure that the machine I’m responsible for has any chance of working.It’s the content authors that have the most responsibility on the front lines and have to live with whatever decisions we make. Even though they’re rarely the ones signing the checks or calling the shots, I build projects for the content authors. Hopefully this is unsurprising given everything I’ve written on this spree.Project evolution has been the most fun with small businesses and startups.I might get involved as a designer-developer-devops person, then work with real designers or developers or devops people as an organization grows.Filling a role turns into helping other people, often more qualified specialists, take over that role and run with it. The CMS and I both start in a scrappy and manageable place, then grow and extend outward in a way that hopefully resembles grace and not chaos. A dorky metamorphosis.I still think of it as an artful machine, even if it’s just business.I’m rambling about this thinking of projects where most content amounted to articles and press releases and service pages, but it got even more interesting when the primary content was people. Reply via Email ← Notes"
