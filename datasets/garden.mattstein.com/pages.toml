["https://garden.mattstein.com/notes/people-content-8-pocket-algorithm"]
title = "People & Content #8: Pocket Algorithm – Matt’s Weird Little Garden"
full_description = "Notes People & Content #8: Pocket Algorithm Feb 8, 2024 I ended yesterday’s post hoodwinked by the rise of platforms.The good news is that I’m not going to spend the rest of the month raging about LinkedIn.The bad news is that my uncontrolled skid into the pit of e-despair wouldn’t be complete without mentioning my phone.I got my first cell phone much later than my peers.The Motorola flip phone came into my life in college, where an amused friend helped me understand that I did not, in fact, have to answer it immediately every time it rang.Text messages entered the chat too, and I was transfixed by the implications of this newfangled wonder. I was connected and available no matter where I went, and I gave an outsized amount of attention to this gadget.“YOU COULD CALL ME,” I might yell to a complete stranger, “EVEN IF I WALKED WAY OVER THERE, OR FLEW OVERSEAS!”I wouldn’t yell at a stranger or suggest that they call me, but there was barely a lid on my excitement.The phone didn’t have to buzz or ring for my attention to rest on it; it reserved a small part of my consciousness.Years later, my first iPhone amplified this phenomenon.It was a gorgeous object, a beauty even powered off.Powered on, it was all novelty and magic, as though my flip phone had visited the future and returned to give me a glimpse of what was coming.The iPhone and its web browser brought a literal, physical closeness to the internet that changed my relationship with it.Everything that had been confined to a laptop or desktop computer could join me wherever I went.Facebook friends, driving directions, even things I made for web browsers! (HTML sites, not the Flash ones.)Google was right there for fact-checking a bold, questionable assertion at lunch.Email could be read from a toilet.Video calls found clumsy new possibility over cell reception.And of course I loved it! I was mapping bike rides, posting tweets, text messaging with autocorrect interjections, and whatever else I did.It was there before I went to sleep, and before I woke up.It was there in waiting rooms, for lulled conversations, and in idle moments.I had a camera in my pocket everywhere I went. No need to lug one around just to see things.It even started getting my attention when it needed to.Am I describing the phone or the internet?That was its powerful trick.All the joy, connection, insecurity, and vastness of the internet occupied so much of my attention that it didn’t go away when the phone was off.The noise of the internet became the noise in my head.And shit did I just leave home without my phone?My brain was never ready for all of it. In the same way I had to learn that I was the boss of my first cell phone and didn’t have to answer every ring, I had to learn that I was the boss of my attention and I had to practice deleting apps, putting the phone down, and re-learning how to be still.“omg so he’s going to get a Light Phone and live in the woods, is that what he’s working up to?” you wonder.First, rude.Second: you get me and I appreciate it, but that’s not where I was going next.I have a bittersweet love for the complexity of all this, because there are no clear lines separating the parts I want from the parts I don’t.It’s a giant, swirling, undulating mass of people and content. Reply via Email ← Notes"
