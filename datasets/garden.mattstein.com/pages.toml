["https://garden.mattstein.com/notes/free-ideas"]
title = "Free Ideas – Matt’s Weird Little Garden"
full_description = "Notes Free Ideas Sep 27, 2024 I’m warming up to the idea that anything worth having is important to share.I have heaps of writing and half-finished projects that don’t go anywhere, and I’m making an effort to do a better job of sharing and publishing even if nobody cares.Here are some ideas I keep stewing on and haven’t yet realized. You’re invited to steal them. We all know building and caring for them is the hard part. Monocast – podcast platform for single episodes only; try ideas without the pressure of a seriesdomain graveyard – pay homage to that expiring domain name and what you had intended to do with itSoundboard – a weird forum where you can only post and respond to things with music you’ve made (no words)Little Web Jobs – a sort of LinkedIn for people that want to work on the little web and not hear from recruitersunnamed business ethics index – compilation of businesses that catalogs investment sources, political donations, employee treatment, union orientation, etc. (Feel out where you might want to work, or just which damn lip balm you want to buy.)social profile page – a standardized way for a person to declare what sort of expectations and preferences they have for online interaction (eagerness for jokes, stance on argument, welcome and unwelcome topics, etc.; sort of like Adam’s page but with more specific and probably research-based parameters anyone might use)MattGPT – familiar chatbot experience, but it’s just me slowly and stupidly responding with my limited intelligence (tricky because your name needs to rhyme with “chat”) If any of these already exist, please tell me! Update: Alexis kindly pointed out that a domain graveyard exists: goodbye.domains! Reply via Email ← Notes"
