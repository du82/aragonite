["https://garden.mattstein.com/notes/be-the-deer-you-want-to-see-in-the-world"]
title = "Be the Deer You Want to See in the World – Matt’s Weird Little Garden"
full_description = "Notes Be the Deer You Want to See in the World Nov 4, 2024 I’ve never lived around so many deer.Imagine a quiet, aging suburban neighborhood in a dry, dusty version of the Pacific Northwest United States. Modest, mismatched subdivisions built in the 80’s and late 90’s, massive conifers throughout. If you could fly and you took a modest leap into the air, you’d notice on a clear day that you’re surrounded by rounded earthen lumps (buttes) in every direction. Snow-capped mountains stand silently and gloriously in the distance.We’re not in Middle Earth; there’s a Safeway and auto body shops and mattress stores, too.Okay but come back down. Flying isn’t the point right now.It’s fall.Clear, cold air. Shocks of red and orange and yellow and brown still clinging to branches. That sweet smell of decaying leaves certifying to the nose that this is fall. Golden sun that can warm your face while your back is cold, like the steaming mug of cider you might hold with frigid fingers.We’re going to leave now, and it doesn’t matter how. We can go on foot or we can take a car—either way we’re going to see deer.It may be a gang of does and fawns silently munching in someone’s front lawn. One of the bigger ones will lift its head and enormous ears to watch while the others continue nibbling. A curious fawn may teeter on gangly legs to get a look at the strange hind-leg-walking monkey things, or the shiny wheeled fright machine we drive by in.Or we may see a buck, wandering alone with its gorgeous crown of antlers. They’re each preparing for “ruttin’” season, bulking up and getting ready for fighting and mating. I imagine every one to be like some sort of monkish frat boy, almost annoyingly male.It could be like the male that surprised me on a walk. He was standing in some bushes just off the sidewalk ahead, probably eating something but already staring at me by the time I noticed. A short, stocky one with a massive neck.“Are we cool?” I asked aloud, wondering how many people are regularly murdered by deer on suburban sidewalks because of poor communication.He stamped his feet, which to me said “why don’t you come closer and find out asshole.”So I turned and went the other way.On a different outing it’d be a different deer.I scan the sides of the road all the time when I’m driving, always just a bit nervous that a huge body on thin legs will leap suddenly across the pavement.One night, I stopped in my lane as a male with a strange gait crossed slowly in front of me.At first I was worried that he was injured, because he threw his front legs forward with abandon and made me think of John Cleese doing a silly walk. He did this while managing to cross so slowly I wanted to yell “oh my god hurry because this is dangerous and not every human driving a car is going to notice and stop for you!” He seemed to stare at me as he continued his exaggeratedly-slow saunter.This injured-looking male reached the far edge of the road, then trotted off not-weirdly. Like any other deer.Can deer be funny on purpose?Now I hope the answer is yes.We already know from munch marks and hoof prints and clusters of soft brown marbles that our front yard is regularly visited by deer passing through. Probably overnight because we’re usually home and have yet to see them. We’ve planted things they allegedly don’t like, and that has not stopped them from nibbling on them. Some antler-rubbing mangled a young tree that my wife later wrapped in aluminum foil, which looks deranged but seems to have saved the remaining branches.I will meet more deer after I write this and I wonder how they’ll surprise me.I know we’d both probably rather imagine flying, but what sort of deer would you be? Reply via Email ← Notes"
