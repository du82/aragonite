["https://garden.mattstein.com/@/page/gqGlY8hS6noGJfIu"]
title = "People & Content #12: Killer App – Matt’s Weird Little Garden"
full_description = "Notes People & Content #12: Killer App Feb 12, 2024 If you’ve been following along this whole time, thank you.You also may want to spit or throw a shoe when I tell you that one of my favorite projects was a web app that managed people and took their money.My killer app was an inversion of what that phrase usually conjures: a disruptive product that goes viral and rakes in cash.No, my app needed to solve some clear, straightforward problems for a limited, local audience. It would not disrupt anything, go viral, or pay for a yacht.I can’t even call it “my app” here without a disclaimer: I did a lot of work I was proud of, but only shaped it into something important because of regular involvement with the people using it.It was a PHP application, written on the CodeIgniter framework, that helped a workshop-based design school manage student and teacher accounts, courses, registrations, and website content.It started as a moonlighting gig with the blessing of my employer, and ended up being the project that let me step out into my solo work adventure.The school had previously relied on a system from a company that went under and instantly created a lot of urgent problems. I needed to get anything else in place quickly, then build on it.That’s what happened over the course of several years: we built out features the school could use, improved them, and pruned or changed anything that wasn’t useful.It was not brilliant work, but it was good work.The experience I got was instructive and diverse: data modeling, feature development, building a public site, a member area, and a separate admin panel; payment handling, optimization, performance and exception monitoring, support, project management, even hiring and working with contractors for some pieces.The school got something tailored for how it worked, and that even helped it operate efficiently.The most rewarding part was building for and with people I saw every day. Staff and students that actually used this thing and showed up to take classes about copywriting or letterpress printing or After Effects.I could listen for whatever might be painful about accounting, scheduling, or managing classes and sometimes suggest changes that’d make a lasting difference in everyone’s daily lives.Every now and then, somebody would have an idea prefaced with “this is probably hard, but...” and it would not be hard! One of my favorite things is to be nerd Oprah and yell “ACTUALLY YOU CAN HAVE THAT IN FIFTEEN MINUTES!”(And then we can talk about that other “simple” thing that needs a few weeks or months.)I got to wear some of my metaphorical hats to help people work and learn with a bit more enjoyment.That was a lot of fun, and satisfying work to do. I’d find similar dynamics with client work later, but I didn’t have many other opportunities where I got to be so fully responsible for an entire system and around every day with the people using it.My biggest takeaway from that isn’t technical, it’s personal: I’m way more satisfied with my work when I can personally know whoever it’s helping and understand what they need.Is that true for you too, or is that just a me thing?This would be one of several realizations I’d keep smacking into. Reply via Email ← Notes"
