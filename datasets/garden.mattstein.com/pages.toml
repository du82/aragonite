["https://garden.mattstein.com/notes/people-content-23-future-content"]
title = "People & Content #23: Future Content – Matt’s Weird Little Garden"
full_description = "Notes People & Content #23: Future Content Feb 23, 2024 I think differently about my personal sites when I imagine them outliving me.What would I build them with?What would I spend more time on?What would I spend less time on or stop doing?What would my same boring website feel like in 2084?Are these useful questions, or a distraction from what might be more important about now?I know I’d try and have my sites be more uniquely mine, whatever that means. Maybe more basic and sparing so words and images can do their work. Or maybe the total opposite: the most expressive and visually-rich incarnation of my personality I could create.I also know I’d focus more on things of lasting value. Messages with an urgency that wouldn’t diminish over time. A more thorough catalog of the things that are most important to me, and that best express what I’ve got from my existence.Or maybe just jokes?Judd Apatow described comedy as a gift. Even dumb jokes can probably make someone laugh, and it might only be for a moment. But that moment has a lightness, an easiness, that briefly offers relief from everything else—whoever you are or whatever you’ve got on your mind. Humor’s subjective, but laughs are universal gifts.I love that. So maybe I’d skip a lot of unremarkable insights countless other people have had and strive to say something funny. Old jokes still slap.When I think of sturdy old sources of information, I think of printed books and photos. I know that’s already an old-timey notion, but as I write there’s a 100% chance my oldest physical possession was around before any of your websites or mine.In my life, these books and photos have been objects with the ability to live in forgotten boxes for decades, or get passed down through generations. The words and images are still intact. Whoever wrote the captions was always a hero.I don’t think electronic devices or the internet are going anywhere, but a website’s domain registration and hosting don’t manage themselves.Are websites supposed to last?Will long-lived domain names be the mausoleums and ostentatious tombs of our electronic future? Family heirlooms bequeathed to favorite children?“Henry, this domain name belonged to your great great grandfather. He mostly used it for shitposting.”Maybe they should be for the living, or the web might get crowded and dull.Shouldn’t some future young Matt Stein be able to claim mattstein.com once this one’s done with it? Not as a legal or strategic situation, but out of principle?My mind goes straight to the finite resources in what otherwise seems like an infinitely-expansive landscape. Maybe domain names won’t even matter.How will websites work in the future?Do my words and images have better odds surviving on my own website, or on one of the giant platforms?“She was always a great artist, but her YouTube work didn’t start earning ad revenue until well after her death.”None of these questions is new, but the internet, personal websites, and the prevalence of personal content puts an interesting spin on them since it’s relatively new territory.I get the sense we’re all starting to think about these questions.I’ve seen personal sites generously maintained by friends after someone has died.Google has an Inactive Account Manager feature for automatically sending notifications and deleting your account if you stop accessing it. I know it’s not the only company with considerations like this.The Internet Archive has us pretty much covered, which is astonishing when you stop to think about it. Its work may be one of the more important efforts of our time, given that the internet is at the very least a busy and interesting phenomenon.I have more questions than answers, and if I wasn’t publishing every day this would have been a far more interesting article if I spent time researching it.I’ve been developing my own collection of content—journal entries, photos, writing, bookmarks, scanned documents—for years. I’m sure you’ve got similar digital piles of stuff, too.Like these web projects I’ve built, I can only assume that how we organize and curate that information will have a lot to do with its longevity. Reply via Email ← Notes"
