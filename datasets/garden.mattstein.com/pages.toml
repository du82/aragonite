["https://garden.mattstein.com/@/page/ySYF8NNOMEzR78KG"]
title = "Musical Mechanics – Matt’s Weird Little Garden"
full_description = "Notes Musical Mechanics Jan 16, 2024 I miss playing the trombone.I grew up taking piano lessons from Mrs. Manahan, a well-dressed and humorless older woman who came to our house, sat next to each of us kids for our lesson, and said things like “curl your fingers.”I hear her voice now if I sit at a keyboard.“Curl your fingers.”I built my very first paid website for a guy named Russ who hand-made conga drums in his suburban home, not far from where I lived. He paid me—you guessed it—with my own handmade conga drum. He taught me how to tune it, taught me how to play it, and invited me to join a three-person ensemble that played percussion for dance classes.In high school I got a guitar and learned to play just enough to convince girls that I was cool. I’m not sure it worked, but I had fun making up songs and jamming with other kids that played well. My technical skills were lacking, but I could hear music and play along to support in some moments and bring new ideas in others.I was never stunning with the piano, conga drum, or guitar.The trombone was different.I wanted to play something cool like the saxophone or the trumpet. I don’t remember making the choice to join the middle school band program, but I do remember the fitting that kicked things off. I tapped a beat poorly, played some reed instrument, then a trumpet—and I’m sure I was very serious about that trumpet so they’d know it was right for me—and then they took the trumpet mouthpiece away and gave me a bigger trombone mouthpiece to buzz into. The cold metal felt easier on the lips, not that it mattered since I was going to play the trumpet.We both know I wouldn’t get the trumpet.So there I was one day, lugging around the clunky case for the big dumb slide horn. Didn’t even have any buttons, unless you count the one for blowing out spit!I can still smell the brass and saliva and slide oil just after the metallic clacks that opened the case. I can feel the cold metal lifting the various tubes out of the velvety case and pressing them together into an instrument. Which immediately reminds me I should wipe the thing down to get that finale shot C3PO shine. I don’t even have it now, but the urge to polish off the fingerprints hasn’t faded.I practiced at home, walked around the back yard with it blaring in what I can only assume was a nightmare for neighbors. (Sorry!)A few years went by and I actually got good at it.I started to like how it was a fairly simple thing that could make very different sounds depending on what my lips, lungs, and arms did.As the buzzing and the blowing and the sliding and the spit-ejecting got more second nature, I started making music with it.This peaked with jazz band. Regular band was fine, but I came alive for jazz band. I relished the sizzle and swing and soft notes and deep blare.And of course those playful slides from one note to the next, which you can’t get from a trumpet.You watch anybody playing a trombone, or even better do it yourself, and notice the slide face. A person can’t skid cartoonishly between notes like Tom Cruise or Kramer without a visible smile, smirk, or twinkle.I improvised solos on stage and felt the electricity of making the conductor and fellow musicians and an audience all smile.I felt music. My mind and body and breath were sound.I miss that.High school band started feeling a bit too much of an identity rather than an activity, and I wandered away from it. Which is fine because I got into art and art classes and that was a whole other adventure.But I miss making music.That’s why I’m reaching for it again now, with rusty fingers and no great plan for practicing a trombone that won’t infuriate everyone around me.I know from past experience that it takes a lot of practice for my hands and my body to get out of the way of music.It takes a lot of work for a thought to become a sound.Before that can happen, my hands need to know where to go and what to do to get a particular vibration. That means knowing how the instrument works and practicing the motions until technicalities are reduced to fluid feeling. That’s when it all turns into some other kind of magic—only after rote repetition and bad experiments and persistence.Like all things to me right now, this is a metaphor.Am I practicing at the right things for my life to be music? Reply via Email ← Notes"
