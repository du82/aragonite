["https://garden.mattstein.com/notes/people-content-14-inheritance"]
title = "People & Content #14: Inheritance – Matt’s Weird Little Garden"
full_description = "Notes People & Content #14: Inheritance Feb 14, 2024 I’d often be the second outfit someone hired.A sexy, exciting, sales-y agency might sell and start billing for a grand vision it wouldn’t deliver. Or someone took on a project that dragged along quietly for a long time and it got weird.The weary client would then search for a decidedly un-sexy creature with a hype allergy and a pleasantly dull reliability. This person would need to gather the pieces and work with the remaining budget to assemble them into an actual delivery.Somehow we’d end up speaking, and they would know they were talking with such a person. I would hear clear goals and realistic expectations, so it might be a good fit.I’d inherit an unfinished project and (eventually) know to approach its artifacts with openness and protective eyewear.I don’t know what you do or if you’ve been in this situation, but you’ve felt how it can go. Imagine a time you’ve received a thoughtful, unexpected gift. Good? Now imagine when your move was the one that finally knocked over the teetering stack of Jenga blocks. It’s one of those.Some of you leave notes.Some of you arrange things in a way that demonstrates delight in details. You write code comments and documents that orient a newcomer with care, and that’s after you built and refined with that same attention to detail.I do not often inherit your work, but when I do it is a joy.It inevitably involves something I’ve not used, thought of, or heard of, and being able to examine the entire working contraption up close is instructive and fun.More often, I inherit a wet puzzle in a cloud of smoke.I understand how it happens: there are multiple projects and things to do, lots to think about. Getting something working and approved can be a massive undertaking by itself. The whole budget and timeline were never going to work. Polishing and refactoring and writing notes are nice things for people that have too much time on their hands. The smart ones will figure it out anyway.Maybe it’s unavoidable.I think you know your code isn’t just stuff that temporarily animates a machine so you can get paid. That it can be a love letter and an expression of how things aught to be. A kind of art.We both know that we need to eat, and that resource constraints beyond our control have the power to balance and support good work, or ensure it’ll never happen.I want more of that work with a genuine sense of craft, but the grind and churn of business without art makes me want to do something radically different with my time.And yet!Explaining your work is kind and considerate. Maybe even a feat of rebellion because it’s for other people more than a balance sheet.Help the more junior person understand what you did and help the more senior person understand what you intended so they can each get in there and do what they need to with confidence.Assume nobody knows what you were thinking and at least give them some hints.Maybe someday people will stumble on my work and fall to their knees at its beauty. People will become developers just by gazing upon it. The code will be all over the news because people young and old come to it from far-flung corners of the world to see it together and experience common understanding. Investors will rush to buy it. Media companies will compete for the story rights.Until that day comes, I’ll assume genius exists and it’s not me so I’ll explain my work for whoever gets to it next. Reply via Email ← Notes"
