title = "Getting a Word Count from Kirby Posts – Matt’s Weird Little Garden"
full_description = '''Notes Getting a Word Count from Kirby Posts Mar 2, 2024 Before I finished that February blogging spree, I decided I’d collect word counts for each of my Kirby posts.But how?A quick search led me to Web Page Word Counter, which I could have used on each post URL. That would have taken a while, so I decided to spend even more time figuring out how to write something custom I could re-use.I’m still new to Kirby so step one is often still feeling out a reasonable approach.I know that Kirby’s concept of models make it quick to tack custom methods onto a post type. PHP already has a str_word_count function, so all I had to do was add my own wordCount method to site/models/note.php: <?php class NotePage extends Kirby\Cms\Page { // ... public function wordCount(bool $pretty = false) { $postContent = $this->content()->text()->toBlocks(); $count = str_word_count($postContent); if ($pretty) { return number_format($count); } return $count; } } And voila! I edited site/blueprints/pages/notes.yml to use that as a column: wordCount: label: Word Count value: "{{ page.wordCount(true) }}" width: 1/6 Table listing in the Kirby panel with a “Word Count” column. I snuck this little comment into each page template to get the count there: <!-- {{ page.wordCount }} words --> (That format may be unexpected because I’m using the Twig plugin and writing most of my templates that way.)But why stop there when for some reason I want to print these counts in a console and output the total there?It turns out there’s a Kirby CLI, and I could run kirby make:command to scaffold a new command instantly.I used Composer to pull jc21/clitable into the project, and ended up with this CLI command that prints word counts in a nice table: <?php // site/commands/note-word-counts.php use jc21\CliTable; return [ 'description' => 'Display note word counts', 'args' => [ 'filter' => [ 'name' => 'Title filter', 'required' => false ] ], 'command' => static function($cli) { $totalWords = 0; $tableData = []; $table = new CliTable; $table->addField('Title', 'title'); $table->addField('Words', 'words'); $notes = collection('notes'); if ($cli->arg('filter')) { $notes = $notes->search( $cli->arg('filter'), 'title' ); } foreach ($notes as $note) { $count = $note->wordCount(); $tableData[] = [ 'title' => $note->title(), 'words' => number_format($count), ]; $totalWords += $count; } $table->injectData($tableData); $table->display(); $cli->br(); $cli->success( sprintf('Total words: %s', number_format($totalWords) ) ); } ]; By default, running kirby note-word-counts displays a table with all my posts. But the command takes an optional argument that searches post titles to narrow the result set: ❯ kirby note-word-counts "people & content" ╔═══════════════════════════════════════╤═══════╗ ║ Title │ Words ║ ╟───────────────────────────────────────┼───────╢ ║ People & Content │ 618 ║ ║ People & Content #1: My First Content │ 871 ║ ║ People & Content #21: Clean Content │ 703 ║ ║ People & Content #23: Future Content │ 792 ║ ║ People & Content #29: My Content │ 1,246 ║ ║ People & Content #9: Content Creators │ 589 ║ ║ People & Content #10: Blue Screen │ 780 ║ ║ People & Content #11: Dynamic Work │ 1,246 ║ ║ People & Content #12: Killer App │ 613 ║ ║ People & Content #13: Patterns │ 1,025 ║ ║ People & Content #14: Inheritance │ 687 ║ ║ People & Content #15: Artchitecture │ 1,674 ║ ║ People & Content #16: Neural Network │ 403 ║ ║ People & Content #17: Ephemerality │ 514 ║ ║ People & Content #18: Maintenance │ 748 ║ ║ People & Content #19: Ownership │ 788 ║ ║ People & Content #2: My Art Work │ 805 ║ ║ People & Content #20: Dependencies │ 1,128 ║ ║ People & Content #22: Cold Storage │ 892 ║ ║ People & Content #24: Junkyard Garden │ 1,255 ║ ║ People & Content #25: Attention │ 928 ║ ║ People & Content #26: Working on It │ 638 ║ ║ People & Content #27: Big Little Web │ 615 ║ ║ People & Content #28: The Machine │ 323 ║ ║ People & Content #3: Design │ 1,849 ║ ║ People & Content #4: Slashes │ 1,692 ║ ║ People & Content #5: Networking │ 687 ║ ║ People & Content #6: Social Websites │ 778 ║ ║ People & Content #7: Platforms │ 796 ║ ║ People & Content #8: Pocket Algorithm │ 689 ║ ╚═══════════════════════════════════════╧═══════╝ Total words: 26,372 Now I have a few ways to get at these word counts, which is mildly interesting and something I’d like to keep a better sense of the more I write. Reply via Email ← Notes'''
