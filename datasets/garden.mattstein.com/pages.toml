["https://garden.mattstein.com/notes/if-you-could-instantly-change-one-internal-pattern-thing-about-yourself-what-would-it-be"]
title = "WeblogPoMo AMA: If you could instantly change one internal pattern/thing about yourself, what would it be? – Matt’s Weird Little Garden"
full_description = "Notes WeblogPoMo AMA: If you could instantly change one internal pattern/thing about yourself, what would it be? Nov 2, 2024 First, I apologize for the visual assault of long titles on this site right now. I’m trying to focus more on the writing than endless tinkering, but it’s still lame. This AMA format has been fun to read and easier to respond to than posts I arrive at mysteriously, and I was reading Lou’s post when my answer burbled up. if you could instantly change one internal pattern/thing about yourself, what would it be? @annie@social.lol I would murder the critic.I spend a lot of energy not asking questions, not making jokes, not publishing things I write, not hitting return but deleting messages.“That’s a weird thing to ask,” it says. It doesn’t care that I’m fascinated and want to know someone or hear more.“That’s not as funny as you think,” it says. It reminds me that I’m a cis white male and that often there’s a gift in simply not sharing our thoughts.“Actually you should find work,” it says. It reminds me that wonder and play don’t pay for groceries.“That’s too much enthusiasm and you’re not trying hard enough to seem normal,” it says. It reminds me of the yikes reactions and doesn’t mention smiles and warmth and love.“You could look like an idiot, or worse reveal that you’re an idiot,” it warns. It doesn’t need to explain further because the weight of this often stops me from squirming.“Nobody wants to hear that,” it says. I can’t prove it wrong.“People have already said that better,” it says. I should find a way to link to it and not dump more mediocre thought pollution into the ether.“Your timing is off and the moment for that comment has passed,” it says. It doesn’t care what I would have said or who I wanted to connect with.“Your unaddressed bullshit really does have the capacity to be harmful,” it reminds me. This one cuts deep and I don’t have any response.Self-control is important, but at some point fearful self-censorship wrecks what would have been connection and art and play and ... life.Oh, to silence that voice!Drugs and alcohol do it, and make a lot of things seem easier, which is why I’ve started limiting drugs and alcohol because I’ve seen where that can go and I know that learning to live with the critic is hard.The real answer probably isn’t murdering the critic, but hugging it out. Thanking it for its useful cautioning and feedback, and continuing with matters of heart.So I suppose what I would change is how readily and unquestioningly I let the critic stop me. I’m just piling on after Annie offered the question and several others answered: KeenanEstebantxoKerri AnnLou Reply via Email ← Notes"
