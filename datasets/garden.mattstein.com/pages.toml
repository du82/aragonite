["https://garden.mattstein.com/notes/lessons-from-improv"]
title = "Lessons from Improv – Matt’s Weird Little Garden"
full_description = "Notes Lessons from Improv Sep 11, 2024 Each of the past four Tuesdays, I’ve had to plot a careful course through my day that doesn’t leave much room to think about the night’s improv class.The equal mixture of eagerness and dread is pointless to stew on, so it’s best to dive into work and emerge later to eat something and leave the house.I know it’ll be fun, that I’ll embarrass myself and make mistakes while people are right there watching me, and that I’ll spend the days after analyzing all the little choices I made or failed to commit to.I bring my creative and fearful selves, and they’ll do battle there just like they do for everyone else in the room.It’s not just a diversion, a chance to meet new people, or a creative exercise—it’s everything that matters crammed into two hours a week, in an otherwise unremarkable room with no windows.It turns out some rooms are more comfortable without windows.I’ve thought writing comedy might be satisfying since I’m an odd bird and a deep well of unrefined material. But seemingly every comic came through improv or standup, and the thought of performing either one scares the shit out of me.Sometimes the hardest-avoided idea seems like the right one, and the deeply uncomfortable prospect of showing up to do improv classes is one I avoided until I finally committed to a class.I was afraid of landing among hyper-extroverted almost-theater people that are all facade, being led by a goof to be goofy in contrived ways for a few hours.But no, I admire each person that shows up with me, courageously choosing to be generous, honest, and present. I’m grateful that we’re guided by someone obviously and infectiously caring that wants us all to grow as human beings. It’s “just an improv class,” while at the same time being much more.It’s a safe place to try things and make mistakes, and those are always the best places to be.A major, surprising plus is that it’s still not without cringe.Many of those exercises have been exactly the kind of stuff I’m afraid of. Not just looking silly in a moment, or making mistakes, but seeing deeply-rooted insecurities burble up and get in the way of making something work. Drawing attention to them even, in order to let awareness lead to improvement. The fight against a panicked, overprotective ego is intense and almost constant. It’s exactly this practice—not just thinking about it—that I need to bring balance to something that feels off.You might have gagged earlier when I said improv was “everything that matters,” but that wasn’t dramatic flair.We each show up, despite ourselves, to be present, collaborative, and let love and playfulness lead more than fear. The work is overcoming the very real and diverse forces that stand in the way.Practice with commitment, listening, and taking risks in a safe place is huge for me. But I’ve also learned some things that seem to be as useful for improv as they are anywhere else: Going for a quick laugh may actually get in the way of building a better scene with someone.Being decisive is not the same as being a jerk.Listening and feeling my way through an exercise is scarier than trying to stick to an idea, but the best stuff comes from a good flow of small decisions in a clear context.I do not inherently trust myself and the people around me, but I have to repeatedly choose to in order to be a good partner. I left after one class wishing I could practice at improv for so many hours I’d grind down self-doubt and only have energy for the best stuff. Or that I could do it drunk for the same reason. This was animal brain resisting the real work of finding a way through each success and failure, one at a time.For two hours a week I pry something open and play. Maybe with enough practice, I can be more open all the time. Reply via Email ← Notes"
