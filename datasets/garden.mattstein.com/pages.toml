["https://garden.mattstein.com/notes/linkedout"]
title = "LinkedOut – Matt’s Weird Little Garden"
full_description = "Notes LinkedOut Jan 9, 2024 My idea of LinkedIn is a place that embodies everything I don’t want the internet to be.Superficial connections that are meant to be seen.People presenting carefully-curated images of themselves meant to look good and sell.A walled garden software prison where you’re encouraged to stay and create unique content.A place for recruiters to run wild and shallow connections to flourish.A place where self-importance and “thought leadership” is more important than being fully human.I’ve been there and I left.Some people said nice things about me and I appreciated it.I was able to build a rolodex of people I’d worked with and maintain the ability to stay in touch—and I no longer have any equivalent.The only leads I got for work there were bad. Not a single project that worked out.I checked on my own perceived status and self-worth and tried to grow it, which was time wasted.I want the open internet to be more powerful than platforms like LinkedIn.I want humanity to be rich and nuanced and playful and more human than guarded business personas.I don’t want to separate my business self from my personal self and pretend those are different.The small web is friendly and supportive, and I worry that the big web is the one that pays a salary.Looking for work isn’t going particularly well, and I don’t want to resort to joining LinkedIn and settling for it as my model for how business relationships work.I’m happier out, but maybe I have to be in.Can there be a LinkedIn that starts with heart and connection and continues into working relationships? Can it start small and stay small and nurture small organizations and independent companies and creators?Maybe I could build that! But I’ll need some sort of sustaining income to focus on it and keep living in a house and eating—so maybe I have to join LinkedIn anyway?I don’t want to touch LinkedIn, is what I’m saying.Maybe it’s a daring feat not to.Maybe it’s a refusal to accept the world that is. Reply via Email ← Notes"
