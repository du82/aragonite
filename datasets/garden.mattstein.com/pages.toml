["https://garden.mattstein.com/notes/people-content-13-patterns"]
title = "People & Content #13: Patterns – Matt’s Weird Little Garden"
full_description = "Notes People & Content #13: Patterns Feb 13, 2024 I worked with someone ages ago whose hobby and side gig was photography.She didn’t refer to herself as a photographer, but “a designer with a camera.”The sly humor and honesty made me smile, but the phrase lodged itself in my memory because it captured the way she thought about making images. Her photography was design in a specific context.As far as I know, design is about relationships and rhythm.Graphic design’s vocabulary is visual: shape, color, contrast, and repetition. It has big loud notes and soft notes, long ones and short ones, chords and dissonance and essential emptiness between them. Or “negative space,” to use one of my favorite terms.The reason I love design is that it’s a lens for everything.People want to work with balance and joy, each in their own way.So building things with people, at least in any cheerful and productive capacity, has meant finding patterns everywhere. Encouraging and repeating the good ones, avoiding the bad ones.A designer finds and creates patterns with intention. They may use shapes or words or UI elements in ways that reinforce a broader system and feel intuitive.A developer uses and creates patterns to build intuitive systems, and their medium is software code.A project manager hopes the designer and developer track their work in some shared place, because the project manager needs to find and create patterns that help things flow smoothly among people with different concerns.A technical writer needs to find patterns that make explanation more clear, and use words and images that can foster understanding with precision. Careful writing can slice through time and complexity, and stand apart from the noise of the kitchen.A marketer needs to look outward, finding patterns of activity and need and creating patterns that draw interest, differentiate from competition, and reinforce a clear message.You get the idea.I’ve picked roles I think I know about, but there’s no end to the usefulness of patterns and seeking intentional harmony.We can all sense when our machinations aren’t working, even if we don’t know why.Nobody needs to explain that the orchestra is warming up; the goosebumps on your neck know when the concert starts.Overly-rigid control is ruinous on one end, with process that fails to support peoples’ unique styles and rhythms and improvisation. Self-important process or structure insists people conform to it, rather than molding itself for the people it’s meant to support.Chaos is on the other end, missing opportunities for people to collaborate and sharpen ideas and move in stride.“Okay but is he going on about corporate life or building websites?” you ask impatiently.That’s fair. I haven’t found any dry jokes, which is how we know I’ve drifted into the stratosphere.That’s also my point: the website is a contraption we build to help people do things with coordination and efficiency. So is an organization or a business. Neither one is a person, but if it’s doing its job well it’s supporting people because it was built with careful consideration for them.Miles Davis said it’s the note after the mistake that makes it good or bad.I’ve hit an eye-watering number of bad notes that have led me to everything I’m saying. They are not fancy or dignified, but I took notes and often learned from them.Building for money and the nerdy joy of machinery taught me that I have to always first build things for people or I’ll lose my way.The first client that got a website and never paid for it taught me the importance of deposits and contracts.The early non-technical entrepreneurs that wanted “basically Facebook for $5,000” taught me to hone analogies about cars and houses that sufficiently illuminated the absurdity of some aims.The client that went on Good Morning America without mentioning it taught me to discuss capacity at the outset of a project.Working with bigger teams taught me I will be overwhelmed with new faces and context, so I need to trust and radiate intent.Taking all sorts of not-ideal projects taught me to identify the ideal ones, and notice the early warning signs of a bad fit that could save weeks or years of churn.A client breakup phone call that ended up transforming the relationship taught me to always find an honest and civilized way of explaining why I want to end something. The risk of offense or stating the obvious is worth the potential of working through misunderstanding and strengthening a relationship.A few generous people shared advice like “learn to say no,” and “the kind of work you take will be the kind of work you keep getting.” I met each as though they said “a wild raccoon makes a great house pet,” and only realized after many years that they were right. (Not sure about raccoons, probably a bad pet and illustrative device.)This is where running a business, building websites, coordinating with people, writing documentation, and whatever else I’ve done start to feel like parts of the same thing. I have the most fun noticing patterns and trying to encourage harmony among the pieces, which ... is maybe all any of us are doing?This whole post may be painfully obvious, but at least I didn’t use the word “synergy.”A built project can be an expression of this care and coordination, or evidence of its absence.Inheriting a project is like opening a dusty old chest that may be filled with gems or fast food receipts. Reply via Email ← Notes"
