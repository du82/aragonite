["https://garden.mattstein.com/notes/car-detailing-life-hack"]
title = "Car Detailing Life Hack – Matt’s Weird Little Garden"
full_description = "Notes Car Detailing Life Hack Oct 31, 2024 I like driving and I like getting to know my car.I read manuals front to back, I find shop guides to see how you might take apart or replace bits and pieces, and I give myself modest projects that I can tackle without mortal risk. (I like my car, but we shouldn’t confuse me with a car guy.)I also like cleaning cars.I find it satisfying to keep it in good shape and keep it looking and smelling and feeling as pristine as I can. It’s my strange sort of contribution to the life of the thing after the astonishing design and engineering that brought it into existence. Also it’s fun and kind of relaxing.I haven’t met many people that share my joy of car cleaning, but seemingly everyone loves a clean car and a few have been thrilled to let me have a go at theirs.I’m not going to keep telling you about cleaning cars though, because I had an epiphany that’s useful even if you don’t have a car or the near-OCD that makes cleaning it fun!Here it is: You can use car detailing stuff on things that are not cars.Allow me to share my favorite examples.An interior should not be a greasy, shiny, Armor All mess. It should be clean to the touch, have an even luster, and a faint whiff of coating that protects it from drying out and bleaching in the sun. My favorite product for this, which I arrived at after much trial and error, is Griot’s Garage Interior Detailer.I’m not even linking to it because I’m not here to sell it to you, I’m here to tell you it works great on a mouse, or a keyboard, or a big Cordura mouse mat that’s otherwise tricky to clean. It’s made for tactile car interior surfaces, and electronic gadgets are made of a lot of the same materials.A cheap set of non-scratching brushes can be great for cleaning out crevices and impossible-to-reach places inside a car or its engine bay, so of course they work great between keyboard keys and mouse buttons and screen edges. (Pro tip: designate a filthy engine/exterior brush and don’t use it for anything else.)Lots of enthusiastic people on YouTube can show you how to use these things, if you want.My spouse, who gets me and is a good gift-giver, introduced me to Hyper Dressing. First of all it’s called Hyper Dressing, so it’s got that going for it. Second, you can buy Hyper Dressing concentrate in large quantities—and that’s important because if you like cleaning things and you live in a high-UV environment like Bend you’ll probably appreciate it.Hyper Dressing is oilier and shinier, so I don’t use it for any interior bits. It’s perfect, however, for plastics, exterior metal, and rubber trim. It can take dried-out, sun-beaten plastic and make it shine like new. It’ll not only make rubber seals look nice, they’ll stay supple and age better, and in some cases (like door jambs) seal more cleanly without being sticky.But I’m not here to sell you Hyper Dressing either, I’m here to tell you that you can use it on a vinyl window frame, or a metal light fixture, or a plastic deck box, or a powder-coated umbrella stand, or that thing on your porch that got wrecked by the sun and it’d look great if you could find the right thing to restore it. Hyper Dressing is that thing!I’m dabbling in ceramic coatings now so I’ll probably wind up with more ideas for my not-car toolbox.I hope this is useful for the one other person that’s excited to think about it. Also, hey you! 👋 Reply via Email ← Notes"
