title = "People & Content #15: Artchitecture – Matt’s Weird Little Garden"
full_description = "Notes People & Content #15: Artchitecture Feb 15, 2024 I’ve enjoyed genuine misadventure not just with code, but where it lives and what it runs on.I’ve learned using the timeless process of doing it wrong, which is a gift that comes naturally.In what I think was ninth grade, a deflated Mr. Birath explained after class that while my algebra proofs reached the right answers, the elaborate gymnastics to get to them was a bug and not a feature.I usually get there, even if I arrive late and upside down.My journey through architectural blunders has worked this way, and I only charge money for the things I think I’ve figured out so clients aren’t unwitting victims.We should start right now, with the fact that I’m writing on a monolithic Kirby site that uses un-bundled CSS. On purpose.I’m loving it.It lives on a tiny virtual server I provisioned with Ploi, which is one of my favorite ways to manage smallish projects.It’s inexpensive, everything lives in one place, it’s as fast as the machine specs allow, and deployments are nearly instantaneous with GitHub webhook and a shell script. I get a lovely place to write in my browser, you get a zippy little place to read (I hope), and it’s malleable enough that I can shape it for whatever modest changes I want to make.If I come up with some great idea that’s more intense, I can upgrade to a more powerful server. Cool.So is Kirby on a little server best for everything? Of course not.With a more complex smattering of content, a bunch of flat files might get limiting. I’d want a database, which is very good at storing and retrieving information quickly even as the pile grows. I’d want an app that uses a database because writing my own app is a different quest.If everything goes well and I have lots of great ideas and more people start getting involved, that one server will be sweating and straining and struggling. A bottleneck. So I’d split my application out into pieces that live on different servers, each doing their own thing and getting traffic from a load balancer. Sounds cool, works well after the minor mysteries are solved.It’s more expensive now, and AWS starts looking good. I can’t dive headfirst into that AWS control panel because there’s just too much, but it turns out they have a product for that problem I’m trying to solve as long as I move all my stuff over there, so I do. Cool. Turned out to be more expensive than I thought, but everybody uses it so that’s fine.Oh and then Kubernetes. Docker promises the joy of keeping all the app’s pieces in perfectly-stacking Tupperware that’s magically connected and infinitely expansive. You can carry some pieces in your grocery tote or fill a warehouse with them. Same cute whale. In exchange for your soul, Kubernetes will manage all the Tupperware for you and only bother you with problems that are way too complicated for a regular idiot to solve. I tried running Kubernetes on bare metal and it worked great until it didn’t and I had no idea what was going on and it was time to go outside.I bet you’re thinking Kubernetes is where this ends, but you’re wrong. It’s Jamstack.Jamstack was the solution we were all waiting for.Effortless scale and resilience, JavaScript without limits, and some great new words.Jamstack layered buzzwords horizontally, brought some mindblowing CDNs, and advocated for microservices. Why have a dumb old website running on one lame server, for example, when you could separate your front end and your back end and your store APIs and your image resizing?! Since servers are lame, use serverless functions (running on servers you’re allowed to not think about) that show up, do a thing, and vanish back into the ether.I don’t want to say I fell for Jamstack hype because I don’t think it was a trick.Building a static site and hosting it on a CDN is fantastic. There are many fun and humane ways to do that. It can also be inexpensive, or free. (This was a thing before Jamstack, but it got my full attention.)I really like isolating parts of an app and writing Lambda functions. Something’s fun and satisfying about “serverless” functions, and I’ve wound up using them in cases where they were way more convenient than keeping servers running for intermittent, easily-isolated tasks.Headless architecture was a challenge worth exploring. Not only because Gatsby fully woke me up to the joy of composable front-end UI components and Storybook, but because it got me thinking more openly about the role a CMS could have and how it might relate to a site’s front end and other pieces.Even exploring ways to offload image transforms turned out to be a fruitful adventure.BUT!This was no silver bullet.Jamstack did not eliminate complexities, it just rearranged and bedazzled them.That dumb old CMS can reflect changes made on a massive site very quickly. Good luck explaining that static build time to the client. (They don’t care, they want the typo fixed.)A monolith has all the pieces in one place, so you know where to find the pieces. Headless architecture and microservices stress test diagramming, documentation, and shared access.My problem with Jamstack isn’t Jamstack, it’s the hype for technology that can get in the way of careful decision-making and focusing on building things to help people. Plus giant platforms always want to eat the world, and we’ve established that’s not my favorite.You’re right, I was an art major and this is not my area of expertise so this could be a hot nothing of a rant.More engineering and more complexity and more funding can start to solve some of these problems ... is that good?I immediately flash back to the instructive, awkward cartwheel that kicked off my first college Flash class. These are things we can do, but should we?I know I’m not the only one that got lost in this.Someone else’s client ended up talking with me at one point looking to understand why their brand new website was so strange and confusing, and why Craft CMS was so bad. I’d been here a few times, not because Craft CMS was bad—I loved it and used it for a long time—but because it’s flexible enough that it can’t stop you from using it poorly.A brief look around made it clear that an agency either used this project to try their first headless CMS build or they hadn’t dialed in a winning formula. Either way, it was a poorly-performing mess that was more abandoned than finished. (But charged in full and left as though they’d totally crushed it.)I showed this confused client another Craft install, and they were shocked—even excited—about standard features that hadn’t been set up for them. About how it wasn’t slow, or a weird mess. This made me sad, and kind of furious.I explained what I thought I saw, heard the angst and “that makes sense now” on the other end, and didn’t hear anything after that.This bums me out.It’s not just that I’m upset hearing that somebody else ran wild with technology and forgot about people—I’ve done it too.Quests for perfect uptime and performance and using the hottest new whatever have gotten in the way of making things with and for people. I also am a person in that list.Building for people should be the point, not an afterthought. Playing at someone else’s (literal) expense, without them being in on it, is just a shitty and self-absorbed trick.You can do a lot and have fun with a project like Eleventy or Astro, unless you’re not a developer.But as soon as you need a friendlier interface for managing internet content, there’s a technical barrier for anyone wanting to own it.Small blogging platforms have a special place in my heart because they’re providing a service for people that’s not about massive scale or world domination.The need for a healthy balance grows along with the scope and scale of a thing, and I only say this as someone capable of handling modestly-sized things—but living in the same world with the same platforms and getting the sense that the same principles scale too.A prominent person wrote that love doesn’t scale. That’s why I’m wary of things “at scale.”Choosing between any of these technologies is not a simple and obvious thing that can always have the same answer.Rube Goldberg infrastructure and hype and overengineering and underthinking may all be wrong answers on the way to the right ones, but the technology itself is not the end.The best answer isn’t the technical marvel, it’s the one that’s best for the people it needs to help. Thank you to the anonymous hero that reviewed a draft of this post and offered feedback. Reply via Email ← Notes"
