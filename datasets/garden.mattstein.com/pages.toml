["https://garden.mattstein.com/notes/people-content-6-social-websites"]
title = "People & Content #6: Social Websites – Matt’s Weird Little Garden"
full_description = "Notes People & Content #6: Social Websites Feb 6, 2024 I’ve been loosely jumping through time in these posts, but there’s a significant chunk of my life where I have no internet material to ramble about.I was social, but there wasn’t an internet.Birds tweeted. Eyes googled. No meeting could have been an email.I don’t know what it’s like growing up online or how I’d be any different for it, but I wonder anyway. If you’re an internet old with kids, you surely have more thoughts on the subject.My online social life began with the family computer, when I was old enough to mail forms and get shareware.Instant Messenger and ICQ let me chat with friends.We used NetMeeting sometimes at school, once for a remote-controlled “Mars rover” project that had us playing with robotics over a webcam. Thanks to the video quality of the day, the little robot might as well have been on Mars.Chatting over a webcam was always awkward, but I’ve gotten better at pretending it’s not.But it was text chat everywhere else, at first. Lists of friends and statuses, sometimes rooms with strangers, always private.Another one of those changes came along that didn’t seem like much at the time: there were websites for making public profiles and keeping in touch with friends.A friend in college mentioned TheFacebook, for example. I could sign up with my school .edu email address, so I did.It was a directory and a message board with thumbs.I saved up for my first digital camera, a Canon EOS Digital Rebel, and posted photos to Flickr. I mostly followed friends and we commented on each others’ photos, but sometimes strangers would like them too. The act of sharing like this inspired me to wander around more with my camera in search of moments and images.The same thing happened with a website called Twitter, where early on I would post things like “just ate lunch.” Everyone just said what they were doing. Or I thought that was the point, anyway.These sites were all free and made it easy to be social, in a public way, with friends and strangers.If I was reading this story out loud to you, I would now pause and look up for dramatic effect.Free websites, public, social, friends, strangers.I was still posting things for people I knew, but there was an audience I didn’t know. I wasn’t mailing letters, but tacking them to telephone poles. It had its benefits!A designer impersonating a developer has a lot to learn, and I spent a lot of time learning from forums.Forums were mostly full of strangers, but I loved surfing threads and jumping into a discussion whether it was minutes or years old. Forums were a place for writing: there was room to ask a good question or give a good answer with whatever words, images, or code samples it took. Most of the time I only needed an account to say something or click a “like” button.Forums were open.And again how cool that all this was free! Finally, things of value nobody had to pay for because there was no cost and how could that ever be a problem!Also LinkedIn was there.Like a frog livestreaming a slow boil, I didn’t register the change: I was no longer trading private messages with friends, but creating content that added something to these sites.If you read my early tweets you’d know I wasn’t adding anything particularly interesting or important, but it was there.Flickr photos with friends in mind, liked and followed by strangers. Inane tweets out into the ether, noticed and followed by others. Comments on forums, maybe little snippets or scripts that might be helpful.Two things were happening at once: I was creating content on sites that made it free and easy to share, and I was meeting new friends from places I’d never been.You might recognize the phenomenon I’m describing as “social networking,” and you would be correct.The illusion of free and easy would continue while many of these social websites found something to sell. Reply via Email ← Notes"
