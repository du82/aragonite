["https://garden.mattstein.com/notes/people-content-28-the-machine"]
title = "People & Content #28: The Machine – Matt’s Weird Little Garden"
full_description = "Notes People & Content #28: The Machine Feb 28, 2024 I grew up looking for you.I took things apart trying to find the magic that animated you.I drew countless little inventions trying to conjure that magic.I missed that it was people that put you together.I missed that the magic was my own act of invention.I kept looking and thinking I saw you!You were the glowing box that brought friends over every night.You were the business that gave me a living without getting a job.You were the mobile phone that pulled me into new dimensions.You were platforms and services that gave me so much for free.You were so many products and gadgets with tiny promises.You were entire belief systems.Even now you’re magic content generators and face computers.You always appeared in a new form, with much to give.Except you’re always taking something.Your cost is never your price.It’s the grind, or the dependency, or some kind of entanglement.Worst is how you can pull me away from an actual person on the other end, or right next to me.Or away from whatever makes me myself.I write you now as I realize I’ve been duped.I’ve remembered that the all-powerful wizard was just a man behind a curtain.You were never the point.I can’t escape you, but I see now that any magic, any love, any exploitation you seemed to have was from the people that made you.The difference between us is that I can write you about how mad and sad and relieved I am to understand.You are indifference. Reply via Email ← Notes"
