["https://garden.mattstein.com/notes/people-content-19-ownership"]
title = "People & Content #19: Ownership – Matt’s Weird Little Garden"
full_description = "Notes People & Content #19: Ownership Feb 19, 2024 I want to own every word I write, and I want you to own yours too if that’s what you’d like.Doesn’t matter whether it’s control of a database, software that respects our long-term interest, or being able to self-host a service. To a possibly-impractical degree, I want to have control over the stuff that’s mine.If it matters to me, I want to be able to care for it and decide what happens to it in the future.I don’t want some company’s business model to dictate how I archive information, exchange messages, read books, keep notes, or publish rants.I also want to be able to take responsibility for my work even when I’m not—and when I shouldn’t be—the one that owns the result.Which means I’ve eagerly supported client ownership, too.I would go through the sometimes-more-painful route of establishing services they controlled and having them grant me access. Documenting my work so they would know what I did even if nobody was asking when I first did it. Choosing, whenever possible, whatever kept them most in control of whatever we were building or using.Part of this was a trust-building exercise since I was a solo contractor for so many years. A risk for the client would be if I got hit by a bus, or got sucked into a web3 cult and couldn’t communicate with the outside world. What would happen then, especially if they were relying on me for a lot of work?It was prudent to make sure they had access to everything and knew what it was for. What they might need to hand off if I vanished. Or even if they wanted to fire me.I have so far dodged buses and web3.But there’s something else important in there, about my work amounting to help and the client being the one whose long-term success we’re looking to bolster. I am not the main character.Maybe you’ve done the Google Analytics dance, too.Some now-gone employee or contractor set up an account back at the dawn of time, using their own email or a different company’s. They didn’t leave any notes or sufficiently share access, so now years of useful analytics information is lost if we establish a new account the client can control.(Meanwhile the real winner is Google, collector of data.)That’s not even owning the data, just the account to get at it. Services will always be part of the equation, so why not rent more of them?Renting can be nice for all the stuff you don’t have to deal with.For one: servers.I’m pretty sure the only people that want to maintain infrastructure are the people employed to maintain infrastructure. And even then I get mixed signals.A lot of people would rather not have to deal with servers, maintenance, and service monitoring and instead pay a fee to someone who handles it. Some don’t have the ability to self-host or maintain ownership of what they publish, and they’re the ones I worry about most.Their options lie with a decreasing number of large companies they’d be beholden to, and those large companies are great at finding ways to keep someone from leaving and harvesting whatever they can from them.I’d like to figure out how I could help those people launch their own websites and ditch big platforms. It’s not so hard as a web nerd without a massive following to worry about, but it’s a predicament for anyone less inclined to deal with servers or Git.I rent (stream) music now and use mostly Apple devices on an internet connection that arrives via networks owned by telecom companies, so maybe all this doesn’t amount to a hill of beans.But in the immortal words of Frank Drebin: “this is our hill, and these are our beans.”I’d rather own the data that’s mine, and have clients own the data that’s theirs. I’d rather you own what’s yours. If you’re happier renting services or anything at all, more power to you.I’d rather we each own our content.For me, fewer barriers and dependencies are better. Reply via Email ← Notes"
