["https://garden.mattstein.com/notes/people-content-26-working-on-it"]
title = "People & Content #26: Working on It – Matt’s Weird Little Garden"
full_description = "Notes People & Content #26: Working on It Feb 26, 2024 Plenty of motivational advice insists you keep pushing when most would stop.This could surely help toward a clear goal, or drive a bad job or abusive relationship or heart condition to ruin.A lot of advice is like this, where it’s useful as long as you view it from the right perspective. I prefer sturdier wisdom that accounts for absurdity.Jerry Seinfeld agreed that spending every waking moment looking for material is torturous, and that it’s about “finding the torture you’re comfortable with.”I like this because it’s personal, and frames the inevitable slog as something you can endure because you’re invested in it.A relentless drive toward success makes sense when you’ve got a goal and a path, but what if you don’t?What I’ve got right now is a sense of what I like and what I’m good at, and this idea of “active patience” that means trying and being open to things without worrying about where they’ll go.But I’m just using words that could’ve been a shrug emoji.Some of you have made huge career leaps into different fields.I’m here writing because that’s the thing I’m doing, but I want to know what your adventures have been like especially if they’ve been into or out of tech.How do you know when you need to double down because commitment is the only way to satisfaction? How do you know when it’s just not right and a grind gets in the way of trying something else?Sometimes I feel like I’m in the right place, helping with something in a way that I’m well suited for. Other times the next framework argument or business-before-people moment or ethical business scandal makes me want to take wobbly steps out of tech into ... anything else.No industry or profession is without strife, but tech exceptionalism makes for some maddening, dizzying bullshit.Part of me knows there’s good work to be done here, people to help, and opportunity to be grateful for and not squander. That working the machine could mean being closer to levers of change and being able to find ways to support the parts I love.Another part of me responds not with sadness but relief and even jealousy for some people that found their way out into things they’re happier with.I’m uncomfortable admitting this to you and I’m deeply uncomfortable saying it out loud a few steps from “hire me!”Another of my podcast ideas—I don’t know why I have them because I don’t really listen to podcasts but it might be baked into white male DNA—is to chat with guests and have only one rule: we never talk about what we do for work. It’s as telling as that other idea where I’d repeatedly ask people how they focus on anything.I chose to push into this whole theme because I really and truly don’t know what to do with it.Writing has introduced me to new people, reminded me of some I need to thank and get in touch with, and bolstered something that seems important. It has not brought me to a clear resolve.Maybe that’s okay, and maybe that’s the point: to keep going and being weird and be open to what happens.Sorry this is a weird one. It doesn’t have a story because I’m living it and working on it. Reply via Email ← Notes"
