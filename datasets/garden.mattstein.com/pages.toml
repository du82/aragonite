["https://garden.mattstein.com/notes/good-night-little-dog"]
title = "Good Night, Little Dog – Matt’s Weird Little Garden"
full_description = "Notes Good Night, Little Dog Aug 27, 2023 Every night, one of us says “let’s go to bed” and a small animal races up the stairs to our bedroom. He stretches from his spot on a lap or pillow, or emerges from a blanket where a casual onlooker never would have seen him. He abandons his anxious, watchful disposition and sprints up the stairs with eager little breaths like the bed may be a pile of meat and kibble. He’ll wait attentively by himself on the bed, so I feel bad taking long. I grab exactly two baby carrots from the fridge and lumber up the stairs behind him. The first one’s free: I hold out a carrot at the foot of the bed and he takes it gingerly and gets to work on it. The sound of him eating a carrot is one of my favorite things in this life. The snap of little teeth crunching a piece away, the almost cartoonish and breathy chewing, the shift in direction as he rolls his little head around so gravity can help reposition each slobbery orange chunk. I didn’t live with cats or dogs growing up, nor did I plan on inviting a dog to live with me. It crossed my imagination, but I never once thought I’d be going to bed each night with a chihuahua. Or that I’d quickly and unintentionally be one of those insufferable chihuahua people. We adopted him from a kind foster parent when he was a year and a half old. He’d already known two other homes before that, with an unsteady start to his little life. I remember exactly how his nails clicked on our hardwood floors when he first stepped into our home. A completely new and strange sound in a little house whose sounds I’d already gotten to know. He was a mess of concern when his foster parents left. We tried to shower him with attention and whatever reassurance we could, but he needed to frantically investigate every part of our little home looking for an escape or the people he’d gotten to know. He seemed eager to go on walks, and it saddened me later to realize his brisk pace was just another frantic and unsuccessful attempt to find “home” again. He was trapped, and I couldn’t explain. He came to bed with us though, curled up and slept on the mattress in a compact donut shape that a friend once compared to the Firefox logo. He was small enough that it didn’t much matter where he went, and he was large enough—a bigger kind of chihuahua—that he also wouldn’t get smushed by a rolling sleeper. He climbed on me one night and licked my face, which made me laugh. A tiny, almost cat-like tongue intent on sharing dog moisture with every part of my face. My wife warned me that if I let him, it would become a thing. The internet seemed to agree that it’s an odd and harmless thing. One night he insisted on sleeping by himself on a chair in the livingroom. It seemed so lonely and heartbreaking. I didn’t understand why and I couldn’t convince him to come back to bed, so I gently wrapped a blanket around him and found him in that same spot in the morning. Four years and two homes later, we’re pals and when he’s with us he’s home. He lets me hold him at the vet when things get scary and painful. He trusts me. He’s a little bit bigger, a lot more confident, he snores more, and he’s still mostly silent except for little play growls and pants, and the unhinged rage of specifically UPS and FedEx trucks daring to deliver packages where he can see them. Or chasing a squirrel with roaring bloodlust that every observer can immediately chuckle at—including every bemused squirrel that safely got away without a close call. There are pathetic whimpers when he urgently needs to go outside or have his breakfast or when he’d really like a piece of popcorn. There’s the rare, high-pitched whine that hits me with a rush of what I assume is special parental adrenaline because it means he’s in pain or extremely afraid and I want to protect him. Mostly silence. Big eyes and expressive ears, staring, with little nose sniffs like a rabbit. The ears are like sails that unfurl fully, each maybe two thirds the size of his head, when he’s alert and chipper. They relax into what I call “Dobby” ears when he’s kind of paying attention but lounging around. They stiffen sharply and get more directional as he scans for threats or gets curious about people or TV sounds. They press back and quiver a little bit, almost disappearing, when he’s really playful or licking your face or overstimulated and derpy or when he thinks he’s in trouble. Back in the present, after that first nightly carrot, he waits patiently and silently for act two. After I brush my teeth, I return to the bed and ask him if he wants to do puppy circus and hold out my palm. We use little high-fives as a “yes” button. (A no is just him looking at the palm and staring, or sometimes walking away. Maybe pressing his ears back and looking around like maybe I’d asked another dog that doesn’t exist in our home.) He always says yes, tapping his half-dollar sized paw on mine and following with a lick if he’s unusually excited. Then we do a rapid series of tricks. They might include any combination of high five, shake, jump, spin, down, crawl, kiss, stand, and my favorite: wait. Saying “wait” comes with a target, like the second carrot, and him freezing until I say “okay” and lavish him with praise when he triumphantly grabs the thing. I laugh and feel a little bad when a bloop of slobber drips out as he waits for a carrot parked in front of his nose. He’s not a slobbery guy, and he’s really good at waiting. When we’ve finished puppy circus, we conclude with act three. I don’t always want to finish there, but I rarely bail because I’m in deep and he loves it. My wife was right, though. I climb in bed and lay back, and he eagerly jumps on my chest and licks my face. I squirm a bit and have to press my mouth closed. He’s very thorough. Some moments he stands, little paws heavy with what we call “dog gravity,” that can make a small animal feel much bigger on your body after a short time. Some moments he curls his paws up and sits like a warm little throw pillow with a heartbeat, neck craning around. The entire time though, his ears are pressed back and I feel a wet flurry of licks accompanied by little breathy sounds. When he’s tired it may not go on for long, but often you could microwave popcorn and he’d still be at it. Once he’s done, he’ll eventually slip down under the covers and dig a dog hole. I think every dog does it: the spinning, scraping circle clearing a place to curl up even though there’s nothing in particular to clear. It’s one reason we’ll not bother with expensive sheets. He’ll dig a hole next to my legs, backing into whatever butt or knee nook he might be able to snuggle into. This always makes me smile, especially when he gently presses his paws against me. Or when he sometimes kicks, as though my presence is inconvenient for him or he’s running in a dream. And we sleep like that, a strange pair of mammals that are part of the same pack. I don’t know what goes on in his little head, what he has the capacity to think or feel. I hope that his best life is with us, and that he feels loved and stimulated and safe. I hope he knows how strange it is for me still to live with a little animal, and that I love him. We will each eventually be bones, then dust. Him probably long before me. He’ll never be able to tell me what it’s been like, if he’s full of thoughts or dull as a stone, if he misses or even remembers his parents or siblings or former people. This is all temporary. I don’t know how it’s been for him in this world, or if I’ll ever feel like I’ve found my place in it. But every night, we do our weird thing, we stare at each other, and we curl up together because we’re a little pack. Every night, just for a moment, that’s enough for me. Reply via Email ← Notes"
