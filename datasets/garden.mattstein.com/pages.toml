["https://garden.mattstein.com/notes/home-is-not-a-place"]
title = "Home is Not a Place – Matt’s Weird Little Garden"
full_description = "Notes Home is Not a Place Dec 4, 2024 Home is where you belong and where you can be entirely yourself.Your home can be small and cramped and quiet, or vast and lively.Your home changes constantly even though it’s where you start from and return to.Home is not a place. It’s the people with you.They may occupy the same dwelling, but it is not the dwelling that makes it home no matter how much care you’ve put into the furnishings and decor.It’s the people gathered together again, for whatever reason there is to gather, in a place that’s safe and good.It can be many people in different places, or a few people in that one place.But it’s the collected souls—not the joists or the beds or the mortgage—that make it home. Reply via Email ← Notes"
