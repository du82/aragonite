["https://garden.mattstein.com/notes/expand-or-die"]
title = "Expand or Die – Matt’s Weird Little Garden"
full_description = "Notes Expand or Die Sep 6, 2024 I often feel like I’m standing between starkly different perspectives trying to resolve the two.One example of this is with Tailwind, a polarizing technical abstraction that I’ve liked using and liked getting away from to appreciate CSS again. I occupy, or at least observe, circles that see it differently. Some adopted it happily long ago, as a part of building things on the internet. Others in different circles decry it as a harmful, needless paving-over of great technology. For whatever reason, the latter group is a bit more condescending about the Tailwind-friendly. The Tailwind-friendly seem not to realize that the CSS purists exist. I get the impression the dividing line is between building first for business, and building first with a love for the web and its grain.But very few seem ambivalent about Tailwind. The word itself is all you need to split a group of front-end developers.I see the abstraction and tooling and markup soup and portable conventions and perfect sanity of CSS on its own—more nuanced and capable than I’m even aware of. I’m not an expert in either realm, but I don’t think I’m failing to grasp any of it conceptually.Except how can Tailwind be air and poison?I recently read a long book about how polarized, tribal, warring identity politics have not been great.It resonated with me, a person often standing in the middle of things being confused. The only thing the fighting sides seem to agree on is that I am wrong. Elitist, racist, cowardly, maybe violent. The critical reaction I most enjoyed to this book was from someone that obviously read, obviously grasped, and very well summarized the book’s main drives—and called out what it failed to address pragmatically and emotionally, but also about reality. The thoughtfulness of that response makes me want to read that person’s work next. I’ll get to consider some very different viewpoints and see where I land.Because I don’t understand why we’d rather fight than listen and figure out what we have in common and work from there. The most meaningful bits come from holding different ideas simultaneously and trying to see how they might resolve.Yesterday, a platform I enjoy announced that it got a bunch of VC capital to grow.I watched a handful of people respond with varying degrees of enthusiasm, even though it fills me with dread. I probably should just be happy for the people that have worked hard and done a great job building and growing an entire ecosystem. I probably should be excited about it buoying a programming language whose future is uncertain.But I see another good thing that I can only assume will commit itself to grow endlessly until it eats the planet, at which point it will start on space missions so it can someday eat other planets. It cannot ever be good enough.It seems like most of the internet is like this. I just watched a video that summarized new technology and generative UI that can make it quick to build things. The biggest platforms are fighting to make this possible and be the ones that make it easiest for you (especially when you’re relying on their offerings). The biggest platforms have tons of VC investment.Nevermind the size of these platforms and the influence they have, and nevermind the question of whether we always need more, faster.A colleague mentioned something a business-minded friend had said: “if you’re not growing, you’re shrinking.”Is that how it works?Is equilibrium a fallacy?Is the concept of “good enough” the ultimate copout?Do you have to be consuming, expanding, enlargening, to not shrink back into a frail meaninglessness?Is constant expansion really the natural state of something healthy?I worry a lot about things I shouldn’t, but these wandery middle-places all resemble a pattern of thought I’m usually trying to circle and clarify.I know there’s value in refusing to accept that anything is ever neatly binary.I know I’m right to question what rampant commercialism has done to the web. I also know it’s also foolish to think the web should go back to simpler times. I have to admit that the internet’s explosion has benefitted us all in a lot of ways, even if I can’t see clearly enough to tell if the scale of good and bad is in balance.Maybe the reason it bothers me most is because “expand or die” leaves no room for the stillness and acceptance I struggle so hard to find in myself. To hold the past and imagined future while being fully present now, where I’m okay and things are good.If “good enough” is not a valid state of existence, how can I be?Time for me to go outside. Reply via Email ← Notes"
