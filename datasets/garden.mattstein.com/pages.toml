["https://garden.mattstein.com/notes/people-content-29-my-content"]
title = "People & Content #29: My Content – Matt’s Weird Little Garden"
full_description = "Notes People & Content #29: My Content Feb 29, 2024 IT IS THE END OF FEBRUARY AND I HAVE NEVER BEEN SO RELIEVED FOR A MONTH TO END!!!I’m sorry to yell and punctuate like that, but wow.Okay you have a title, write a post. Wait, you just rambled and you’re bored with it. YOU are bored with it. If you don’t care why should anyone else? [hours pass] Okay that sucks less, let’s wake up early and see if it can be edited into a coherent piece. [hours pass, bleary editing] Welp, [publish].Every. Day.Posting once a week previously sounded like a lot, and now it sounds like a great way to wind down and get some air. Read again. Who knows? Maybe indulge in some research or over-editing.I changed nothing about my writing process for this, except forcing myself to fling posts out that felt unfinished. I sort of liked yesterday’s, but it was weird enough that I had to set it down quietly and sprint away from it.I’m happy with some of what I wrote, and I was surprised at how deeply I settled into fondness and despair just trying to dig up serviceable words for short posts. Many evenings and early mornings were dark and full of feelings.I’m used to journaling my way through brain flurries and strong feelings, but not purposefully trying to push myself into reflection that follows a story line and then sharing it openly.Some days I felt guilty even drawing attention to my posts, because I wanted to find better stories for you or edit more or convince myself that whatever I published was worth your attention. I still feel guilty that sometimes maybe it wasn’t.I realized about a week ago that I was going to end up at this post with an awkward revelation: it’s the most aggressive I’ve ever been churning out content.What better way to end a winding ramble against “content” only to discover that it’s been a month of ... generating content. That sort of absurdity ties it all together.Every day I wrote not because I had something to say, but precisely because I had to say something.Regardless of whether it worked, it was a lot of words for me.This could’ve been a really long post or a tiny book, or whittled down into more focused pieces that don’t blow apart the listing on this otherwise thin pile of notes.I’m overwhelmed with how much there is to see and read, so I’m honored that you’d spend any of your attention here.Even if you’ve skimmed and grimaced and thrown things the whole time, even if you’re printing these out right now for a class on how not to blog—thanks for reading.It’s been just shy of 25,000 words.I don’t know that I’m any closer to knowing what my future with the internet looks like, but I’ve circled the subject as I see it and met some of you in the process and that’s all I can ask for.I’ve remembered how much I miss playful invention and how much some specific teachers shaped my existence. I got myself a pBone to relive some old dreams, and I’m gleefully bad at it. (I was hoping my body would remember exactly what to do, but no it does not.) I improved my Kirby setup here while I worked with it. I realized I had the most fun building small-time projects directly for people using them, even if that’s a bygone occupation that’s slipped away into SaaS products.So ultimately, useful insight and a shrug.I’ll have to keep writing.Thanks Joni, Sarah, Nick, and Jeff, and anyone following along. ⭐️ I like how Anne recapped NaBloPoMo posts, so here’s mine (without analytics because I don’t have any): My First Content (871 words) Little kid art and play. My Art Work (805 words) Older kid art that started to feel like work. Design (1,849 words) Graphic design school, art, and computers. Slashes (1,692 words) Entering the workforce as a generalist. Networking (687 words) Technology connecting people. Social Websites (778 words) Online spaces. Platforms (796 words) Being online with strangers. Pocket Algorithm (689 words) Always online. Content Creators (589 words) The hustle. Blue Screen (780 words) Attention overload. Dynamic Work (1,246 words) Building apps for a living. Killer App (613 words) My favorite work was for people. Patterns (1,025 words) Design in everything. Inheritance (687 words) Please leave notes, basically. Artchitecture (1,674 words) How to build anything with this one trick. Neural Network (403 words) People connecting. Ephemerality (514 words) Building in the sand. Maintenance (748 words) Thinking ahead. Ownership (788 words) Access and responsibility. Dependencies (1,128 words) The joy and sorrow of reliance. Clean Content (703 words) Plastic storage box metaphor. Cold Storage (892 words) Archiving old projects. Future Content (792 words) How long should a site last? Junkyard Garden (1,255 words) Personal content and digital brain. Attention (928 words) Where can I invest attention? Working on It (638 words) Can I keep working here? Big Little Web (615 words) A big network of small places. The Machine (323 words) A love letter to nothing. My Content (You are here.) There was also an intro, but technically that doesn’t count because it was a warmup before the starter’s pistol. Reply via Email ← Notes"
