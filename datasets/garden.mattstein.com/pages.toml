["https://garden.mattstein.com/notes/new-blurbs"]
title = "New Blurbs! – Matt’s Weird Little Garden"
full_description = "Notes New Blurbs! Jan 12, 2024 I’ve updated this tiny Kirby site with the ability to publish notes.Working with Kirby’s control panel is a treat, and being able to publish instantly without creating Markdown files or waiting on a build step is nice. Also unlike working with Markdown, images are a bit easier to manage and size—even though I’m not doing anything special with them just yet.The CMS itself is fast because it’s so much simpler than what I’m used to. I haven’t even bothered with caching yet and everything in the control panel and (admittedly simple) front end is nice and peppy anyway.I’ve set this up as a place to publicly publish a post every day in February for a challenge with my Wiggle Work pals. I’d like to keep the sudden influx away from my usual blog at mattstein.com, so I figure this is a nice way to do it. You can follow along with the RSS feed if that’s your thing. It’s a nice place to work! Reply via Email ← Notes"
