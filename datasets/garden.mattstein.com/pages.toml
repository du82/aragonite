["https://garden.mattstein.com/notes/brakes-are-important-too"]
title = "Brakes Are Important, Too – Matt’s Weird Little Garden"
full_description = "Notes Brakes Are Important, Too Jan 15, 2024 I tend to look at horsepower and how fast something can go from zero to sixty.What the clock speed is like, how many threads it has, how it benchmarks running compute tasks.What the maximum speed is on a given road.How quickly I can turn around a project.These things seem to be some sort of measure of raw power. Seen that way, they’re also power without balance.A vehicle’s breaks need to be powerful and appropriately sized in order to keep it from soaring off a cliff.Roads tend to be safer as speed limits are lowered. The chances of a fatal accident drops off sharply as vehicles traverse more slowly.A computer’s power, these days, is balanced by its electrical efficiency. A powerful laptop with a dead battery is less powerful.All good things are balanced things, and the mind is no exception.We tend to value sharp minds that are quick on their feet, and overlook one that can stop on a dime. That can come to rest. That can start fast and stop accurately. Pause.My mind moves fast. That’s not a brag, because it can be smart and fast or stupid and fast; the racing is the constant.Slowing down is always, always good. Slowing down can be the difference between smart and stupid.Reaching a full stop can be hard to an almost painful degree, but it’s worth the effort in order to start in a better direction. Reply via Email ← Notes"
