["https://garote.bdmonkeys.net/dreams/d980601.html"]
title = "Garote�s Dream Pile"
full_description = "I was one of the spacemen. I removed my helmet, and my partner removed his. I went rummaging around the back seats for some equipment while my partner navigated the van blindly through a cloud barrier. It was raining on Earth. We touched down in the driveway of my old house, facing the garage door, a gloomy grey wall shimmering beyond the water that ran down the windshield. We were talking about our personal beliefs, and realized that to maintain privacy this close to base we would have to disable our radio-vox systems. We each turned a glowing blue dial on our suits, and I searched the back seats again and found two more blue dials mounted on cylinders about the size of hockey pucks. I turned both dials until they stopped glowing, and we had privacy. Now all the things we said wouldn't be broadcast on the radio. In addition, we could no longer receive dialogue from the radio. We were isolated. To upload the information we'd gathered during our mission, my partner and I had to link up with a sattelite dish mounted on the roof of the garage. To do this I had to run a cable from the hood of the van to a socket in the garage door. My co-pilot and I made a bet that I could hook us up in record time. I got out of the driver's seat and connected the cable, getting pelted with the thick raindrops filtering through the oak tree above the driveway. When I got back in I inserted a tape into the stereo. This tape had a wire coming out of it, and was the device I used to listen to my walkman through the speakers in the van. I'm not sure what I hooked the cable into, but I didn't have my walkman. This setup was essential to communicating with the sattelite though. Indeed, I had hooked us up in record time. While my partner messed with some controls, I looked beyond him and out the passenger side window. The front door to my house opened for an instant, and I thought I saw a human shape in the doorway, but it was hard to tell in the rain. The door shut after an instant, as if whoever was inside had been startled by our presence."
year_published = 2025
