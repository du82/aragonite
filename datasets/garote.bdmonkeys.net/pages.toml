["https://garote.bdmonkeys.net/civilization_rant_3/index.html"]
title = "Civilization Rant 3 - 2011"
full_description = '''Much has been written about Civilization's addictive "just one more turn" design. The game is twenty years old and it still stands with Nethack and Oblivion as one of the most time-destructive single-player diversions I've tried. The last time I played Civilization was 13 years ago, at the beginning of summer vacation. It was meant to be a harmless afternoon's fun, easily set aside when dinner called. Instead, the game kidnapped me, and a week later I was dumped back into my living room, exhausted and sore, with my brain a smoldering ruin, and little cartoon militias and chariots dancing across the wreckage. I'm in my mid-30's now, and I should know better, but recently Civilization knocked on my door again, and somehow I forgot my lesson and let it inside. Whoosh; kidnapped. Exhausted and sore, again, with another week of my life taken from me. Swallowed up by an epic contest between me and six other backstabbing emperors. The emperors are great. They're unstable, temperamental, wheedling bastards, and they will kick you when you're down. According to the manual, each leader has a different personality, but when you're playing as an emperor, it doesn't matter. They all hate you. Crushing them is most satisfying. In my last great Civilization campaign I played as Emperor Cat Food, leading the civilization of the "40ft Fritos". This time I chose the venerable name of Neddy SeaGoon, and decided to lead the Civilization of the "Redshirts". Yes, when it comes to conquering the world, I'm all business, but when it comes to naming things, I'm a dork. My sense of humor formed in junior high and has been stuck there ever since. When I play Civilization, my cities have names like "Monkey Farts", "Rabbit Spew", and "Angsty Poems". I just enjoy the idea of two citizens in a tavern, having a dialogue like: You know, I think the game is actually supposed to say "may your reign be long and prosperous" ... but someone has hacked this copy. In fact, it was probably me, so long ago that I've forgotten I did it.'''
