["https://garote.bdmonkeys.net/dreams/d970422.html"]
title = "Garote�s Dream Pile"
full_description = '''While we were waiting for her ride to arrive and take her to work, Skot drove up in his Green Machine. Actually I never saw him in the car, which is just as well because he couldn't have fit in it anyway. It looked like two slabs of metal toast welded together and set on wheels. It was also smoking. While Skot looked on, the Green Machine bumped the back of another car in the driveway, but this was inevitable since it had such poor artaficial intelligence and couldn't park itself reliably. Skot hung around with my sister and I while we were waiting. There were large black beetles here and there on the asphalt, and in most serious concentration, Skot smashed each of these thoroughly with the butt of a golf club. It looked like a sand wedge. I was outside without my shoes on, and spent a lot of the time going "EeK!" and jumping away from the beetles and fungus Skot was disturbing with his antics. Eventually Lindsey got picked up and I went back inside for a map. I woke up, dressed, and had nothing else to do at home so I began driving along the freeway. I followed turns randomly and took the exit leading to my sister's work on a whim. I hadn't even decided I wanted to go there. I came off the freeway ramp as a person floating along the ground wearing a loose-fitting pinstripe jacket. The jacket blew off as I passed through an intersection and I chased it past a gas-station filled with young teenagers and into a fenced-in park consisting of a cascade of light brown dugout dirt in a series of steps. The foot of the steps met a line of open-air bathroom stalls (hey, you get used to it) along the fence. My jacket had blown down next to one of the toilets, and I walked down to get it. Just then one of the teenagers entered the stall looking for a baseball. He knew I was looking for the jacket and asked if I had seen the baseball. WHen I said no he said "too bad, we could have arranged a trade." I interpreted this as his plan to keep my jacket from me until I found his baseball, and as I claimed my jacket from next to the toilet I said "Oh yeah, well fuck you!" I immediately thought this was a harsh thing to say. As I was walking up the dirt steps I realized I had claimed the dusty rim of the toilet bowl instead, so I walked back and got my jacket, glad that the kid hadn't taken it out of spite.'''
