["https://garote.bdmonkeys.net/apshai/index.html"]
title = "One-Hour Hack - The Temple of Apshai"
full_description = "HISTORY LESSON: In these old games, strings are often embedded right in the code. The CPU encounters a call to a 'message printing' subroutine and pushes it's present location onto the stack, then the subroutine recovers that value and interprets the crap in memory beyond it as text, incrementing the value as it goes. When it's done it shoves the value back onto the stack and tells the CPU to 'return' to it, executing the code right past the message. Wasn't that fascinating?"
