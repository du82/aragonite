["https://garote.bdmonkeys.net/camping_trip/day_2.html"]
title = "Sierra City Vacation, Day 2"
full_description = "The cool night air and the river make my dreams pleasant and unconnected, until a scraping noise pulls me awake. It's still dark, but I quickly remember where I am, and in my wakeful state I recall a few noises I'd also heard in the minute before. Crunching noises, like the boot-heels of a very large man. I don't have time to mull over the interesting fact that I remember hearing something before I was awake to register it. I'm too busy scrabbling for the flashlight. When my hand closes around it, I lie still and think. Should I turn the flashlight on? That would draw attention to myself. Well, now, the crunching noises indicate a very large animal outside. But is that animal on two legs, or four? Which is worse, a bear, or a human? If it's a bear, it already knows I'm here by the smell, and the flashlight will help scare it away. If it's a man, better to just let him fumble around by himself -- if I'm going to get in a fight, I should at least try and put my pants on first. I decide to put my pants on, and then turn on the flashlight. The scraping noises continue, in the vicinity of the picnic table. I realize that it's the sound of an animal rummaging in my cooler. That quite surely indicates a bear. Well, I can't just let it destroy the campsite. I turn on the flashlight and unzip the tent, thrusting my feet into the hiking boots placed outside. I stand up and point the flashlight towards the picnic table just in time to see a medium-sized black bear drop to all fours and dash over to the road, heading for the woods on the other side. My flashlight beam illuminates its black furry head in a halo against each tree. As it passes within fifteen feet of me, I can feel the thud of its paws on the ground as a vibration in my shoes. That is one heavy animal. And it's moving faster than I can run. I stand around in a daze for a minute, and then walk over to the cooler, which is turned on its side. If it had been latched shut, the bear would have probably torn the lid off, but this cooler has no latch. Food is spread around it in a wide arc. I place the headlamp strap over my forehead and scrape the food back into the cooler. When it's back up on the picnic table, I stand and look around for a better place to store it. That's when I notice the food locker."
