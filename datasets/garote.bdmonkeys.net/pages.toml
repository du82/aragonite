["https://garote.bdmonkeys.net/dreams/d971118.html"]
title = "Garote�s Dream Pile"
full_description = '''Switch to a rendered scene, with adventurous, upbeat action music. Two characters from the SNES game Chronotrigger are ducked behind the windshield of a sleek speedboat, jetting across the ocean at breakneck speed, around rocks and other obstacles. Flashy sprays of water flare up, in rows of diagonal lines, looking vaguely detached from the surface. The rendering is not perfect. The two characters are the primitive woman and the princess. They are ducked down almost horizontal to keep behind the windshield, one over the other. There are footgrips and armgrips, which they hold onto. Each is wearing the traditional costume, the primitive with her tail, and the princess with her blue pajamas. One of the mnemonics that I used to remember this dream is "Butt", because that's what I named her when I played the game. I remember watching this action sequence in the third person and sliding my gaze over her body, enjoying its unblemished rendered perfection through the transparent pajamas. Clearly, they make these games for a male audience. The boat is no longer on the ocean, but speeding up Scotts Valley Drive, into the woods, towards Sawyer Circle and my old house. The view swings all around it, to showcase the quality rendering and add dynamism to the soundtrack. The boat flies along gravel and dirt, the way the road was before it was paved years ago. Just after the S-curve on the hill with my house, the road terminates at a wall of roots and rock. My companion and I leap daringly off the boat before it explodes and cling to the wall, and begin to climb. At the top of the wall some person hands me an object the size of a ball. My companion is gone. The object resembles an orange-red lemon, with deep creases in it. An outer layer falls away to reveal a softer inner core, loosely containing a thick liquid like fruit juice. This object is important in some way to my situation. The ball rolls down the hill a ways and I catch it, and see the juice barely leaking from the seams in the core.'''
