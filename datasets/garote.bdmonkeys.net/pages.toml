["https://garote.bdmonkeys.net/dreams/d990920.html"]
title = "Garote's Dream Pile"
full_description = "The beings had not expected to trigger a launch, and are unprepared for space travel. They can't go back and get their luggage now. The rocket blasts up through the blue atmosphere and into space. A whirl of pinpoint stars flows by the round cockpit portal. In a short amount of time they've traversed deep space, and head towards a gigantic blue sphere, a gaseous orb alive with neon flares and tailed comets arcing from it's surface. The senses crescendo with noise and compression. The blue expands to fill everything. An indeterminate amount of time fills a psychic break and the rocket blasts away from it's tangential course, burning smoothly away from the blue orb into a space that is billions of years younger, and more brilliant. The ship auto-pilots to a rock slowly twisting in blackness. An efficient touchdown on a platform. Gravity is towards the base of the rock, curving in to a point. This underside is sharp, glassy, and solid. A dark corrugated mass that resembles sculpted icing on a black dessert. On the polar opposite is the tallest spire of a four-sided castle, built of black brick, covering half the asteroid. Several landings and a parapet break up an otherwise sheer wall, encasing a tangle of bridges and smaller rooms. Our two heroes exit the rocket and walk a short path to the mouth of a cave set in the side of the rock. It is one of several openings, all of which lead to a huge central room that occupies the center of the asteroid. This room is a half-dome shape, with smooth walls. The floor is a circle of cracked pieces, resembling desert mud. From the ceiling to the floor stands a massive column, tapering down in a series of square ridges like a telescope to a connection in the middle of the floor. One of the beings is holding a sharp glass spike, resembling a crystal horn. It is an object of magical power. The being walks up the ceiling and down the pillar, scraping material from the surface as it goes. There is a layer of thick clay coating everything. Scraping the horn reveals intricate carvings on the center column, set into a golden metal. Runes of power, perhaps."
year_published = 2025
