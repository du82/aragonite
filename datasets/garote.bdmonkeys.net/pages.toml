["https://garote.bdmonkeys.net/dreams/d920417.html"]
title = "Garote�s Dream Pile"
full_description = '''The only picture I remember in it though is of a woman lying on a white bed in a sunny room, chest down, with the cleavage of two huge tits sticking out to the sides and front of her. The lady was looking up from the bed and forward. The nipples on her two breasts were erect and faced the same way her face did. A man kissed her lustily, and then moved down to suck one of the nipples, and the lady smiled. I finished the CD and noticed my sister standing next to me watching it too. I pulled out the CD and remarked to her about the tiny amount of space that was actually used on it, and how short the demo was. I put the CD back and we turned to go. She led me away from the terminal past some glass cases and turned to the left. I noticed against the wall may precious jewels and minerals, and one thing that caught my eye was a huge emerald about two and a half times the size of a football, on a black velvet in a glass dislay case. I watched it for awhile and noticed my sister was turning back around the way we came. At this point she turned into my Dad and we went around a corner to a rack of computer games. I saw they were all for game systems, not our computer. I wondered if he was getting a game system, but doubted it. I looked to the adjacent shelf and saw some games I liked. I felt like some kind of vindicator, a policeman, standing in that group assembled on our front porch. I beat a few people down into nothingness. I beat the short man with the blond crewcut over the head with the flat of a rectangular board. He tried to fight back, but I overpowered him. I was ranting about something important, and blazing mad. He turned into a pottery vase. I picked it up and looked into it and said "look into my SOUL!" I weilded a long, straight stick and smashed the vase by alternating mechanically between an over-the-head shot and a from-the-left shot. I concluded that the curly brown-haired girl he was with was safe from him now, and I went up to her. I put my hand gently on her head and turned it to face me. I thought "I suppose she expects me to try for a kiss in reward" but I knew I woudn't. Instead I looked deeply into her eyes. I strange calm feeling crept over me and my expression slowly turned into a smile. I knew that I had calmed her down, and made it clear to her that there was no debt to be paid, that getting rid of that guy was it's own reward, and that she was free to go her own way and just as human as before. It seemed that I knew she knew that.'''
