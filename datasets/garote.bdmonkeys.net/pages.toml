["https://garote.bdmonkeys.net/dreams/d971110.html"]
title = "Garote�s Dream Pile"
full_description = '''Then I was walking to parking lot with brent. He went up to Justin's dad, who was playing techno in a firebird. As Brent hopped into the car, I thought, oh, I hope he offers me a job at Logicon. Nope. He advises Brent and I to go find a place to rent before our money dwindles away. I tell him we're on top of it, and walk accross the parking lot to a garage. I get in the car that's in the garage, blare some of my own music, and drive off. Down the road, away from my sawyer circle house, around the curve a jungle-gym like structure of metal bars has divided the road into two narrow lanes. I am relieved that I don't get in a head-on collision, as the cars coming up are smart enough to drive on the left side of the bars. I end up at my sawyer circle house. I know I have a lot of homework to do and it frustrates me. I'm throwing a shopping cart around to spend the nervous energy. A car comes driving up. Oh great, I think, guests. I don't feel like acting all happy. I'll just keep tossing this cart around. The car stops near the driveway and backs up, stopping so the occupants can peer at me through some trees. I don't recognize either of them, but I suspect they're relatives, and I hate pretentious, nosy relatives. Still carrying the shopping cart, I walk up to the driveway. Many cars have parked here, and various relatives I don't recognize are helping each other unpack. I peer into the back of a wide, white-paneled van, and see the riding area of some teenage girl relative. People are rearranging the white bunk-bed, and the white travel-bags containing the few remaining pieces of candy she didn't devour on the way here. I look at my hands and discover big black grease stains. From tossing the shopping cart, I think. I see my Dad in the driveway and run up to him and jump into his arms. Just as everyone goes "awww", I wipe my hands off on the front of his shirt. His shirt was already very dirty from the things he'd been doing earlier, so I'd figured a little more dirt wouldn't hurt. He didn't mind.'''
