["https://garote.bdmonkeys.net/dreams/d930215.html"]
title = "Garote�s Dream Pile"
full_description = "Bleary pictures of grass, viewed through an old window. Shapes like graves sticking up out of the grass. The graves of little boys and girls, over 20 of them. I was in this old dark building, with two windows on opposite walls. These windows provided only minimal light, which illuminated several chairs and peices of furniture. I was angry, I began throwing the chairs at the windows and I managed to break them both. While I was doing it I saw an infant basking in the sun of one of the windows, and seemed to fear that he was going to take something from me. I leapt out of one of the windows and saw strange melted blobs all over the ground. The chairs I had thrown through the windows had been melted to the ground- big red and blue and gold plastic blobs covered the area. Some had been smeared over the ground. I picked one up but it wasn't warm. I saw a newer house in the distance, and thought it strange that it hadn't been trashed yet. I began running towards it, and then through it, as I chased someone I realized to be one of the occupants. We went through the house for awhile, and then in another room I saw the woman I was pursuing set a large clear box on the table. The clear box was filled with blank white puzzle peices. I rushed into the room and grabbed one of the things buried in the puzzle peices just as she opened the box. It looked like a long fingernail, with a slot in it. She and her husband screamed, and her husband began chasing me. We ran out of the house and through a grassy, swampy area. I somehow activated the finegrnail, and it seemed to be filled with some sort of drug. I lost the man pursuing me, and came upon part of a miniature city. If was a factory area, which I ws bored with. Had I been the appropriate size, I would have seen huge metal tanks rising into the air, massive configurations of grey pipework filling up a fifth of a cubic mile. Railings and highways crisscrossing in and out, the latter infested with busy cars of every type. But I was massive, and I simply stepped on all this. I found a great raised highway which was some sort of landmark, and began to run across it, smashing some thirty lanes of tiny cars. I didn't seem to be worried about killing anyone, I took a kind of pleasure in destroying. I was across the highway for awhile, and at one point it went out over a cliff, showing the miniature city miles below. I was frightened as I ran over that part."
