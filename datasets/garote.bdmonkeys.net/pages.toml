["https://garote.bdmonkeys.net/dreams/d20000313.html"]
title = "Garote's Dream Pile"
full_description = "To my left, up the hillside, I see the retaining wall of the freeway. We are driving alongside it, just as it enters Los Gatos. I know it's full of commuter traffic. I float up out of the car, white robe poofing out behind me like a windsock with a gold tassel. My long hair blows flat across my back as I accelarate, cruising over the fast lane. Do the cars see me? Look at how fast they drive. I hate them. I drift down low, in front of a new-fangled Volkswagen bug. The woman behind the crystalline windshield swerves a little, but not enough to ram into the school bus in the left lane. I weave back and forth in front of her, up and down, I fall back until my sandals are standing on the hood of her car. She doesn't react. She's good. Frustrated, I push off the hood and fly about 10 meters up and in front of her. From somewhere in my robe I produce a basketball and finger it menacingly. I spin around and hurl it at the Volkswagen. The windshield cracks and the woman loses control, slamming into the side of the school bus, which brakes and crumples. A gasoline tanker plows into it from behind, sealing both lanes, and various expensive commuter cars begin to compress into wreckage. I am satisfied. But only until I see the coal-driven commuter train sliding along on the nearby railroad tracks. It's not righteous anger - I'm not taking retribution for the evils of fossil fuels. I just feel like smashing things. I fly low along the track, shooting past telephone poles and under bridges. The tracks are an endless washboard beneath me. For some reason, I cannot catch up with the train - the classic wooden caboose stays annoyingly out of reach. The black iron anchoring wheel pokes up from the roof, taunting me, inviting me to grab hold of it and unhook the cars. The train passes into a tunnel and defies physics by rattling up a root-encrusted slope, turning vertical before streaming out through an open manhole. I follow the trail of tracks, exerting tremendous willpower to make my body drift carefully up the wall. By the time I get to the manhole it is closed, and the tunnel has constricted around me."
year_published = 2025
