["https://garote.bdmonkeys.net/ipod_experience/index.html"]
title = "A Windows iPod Experience"
full_description = "When I first got my 10 gigabyte iPod, I didn't own a Macintosh. I assumed that I could make it work on my PC, using just my wits and an internet connection. This was back in April of 2002, when there was no PC iPod, Xplay was in beta, and EphPod was in early development. How hard could it be? According to my online sources, I had all the required hardware. A PC running Windows 2000, a bunch of free hard-drive space, and a Firewire card. I needed software to get things going, and I have to admit up front that I wasn't above the practice of using WareZ versions of things to make a good setup before investing my money in the best solution. The internet is good for that sort of thing. In the end, the problem wasn't the software, but it took me a long time and a lot of anguish to figure that out. The only solid advice I can give to the general iPod using public on this matter is, CHOOSE YOUR FIREWIRE CARD VERY CAREFULLY. When I started out, the Firewire card I owned was a Actiontec PF400L. I had already used it dozens of times to store data on an external Firewire hard drive, and to control a mini-DV video camera while producing a student film. This Firewire card WORKS. Unless you plug an iPod into it. So. The iPod comes in the mail. I rip open the box, untie the cable, and install a beta version of Xplay. All ready to go. Plug in the Firewire cable, and ... BLUESCREEN. Okay, howbout I reboot and try it again. I pull out the cable. Cycle the power. Grind, grind, grind ... back to my desktop. Plug it in. BLUESCREEN, and this time also an extremely loud sustained beep noise coming from my computer's internal speaker. Very frightening. Power off. Reboot. Okay, the system came up fine. No permanent damage. What now? Maybe if I plug in the iPod before even turning on the computer... Let's try that. Arrrgh. Well, I've read online that problems usually come from using the wrong Firewire card. That's probably it. I'll get a card listed in the forums to be a known success. Something that uses that Western Digital chipset."
