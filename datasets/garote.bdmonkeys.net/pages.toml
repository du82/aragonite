["https://garote.bdmonkeys.net/dreams/d960416.html"]
title = "Garote�s Dream Pile"
full_description = "Several other trucks of different colors chased us all around the complex, we went through a series of jumps and did some impossible aeronautical maneuvers to avoid the pursuit, but they persisted and eventually we crashed into one of them. No one was hurt, but then a big brawl started between the occupants of the two trucks. Like most of my dreams where stuff like this happens, the fighting was violent in the extreme. People were impaling each other with metal struts, rubbing broken glass in people's faces, biting people's fingers and flesh off, getting intolerably bloody, slipping in the gore and whamming their heads on the metal sides of the trucks, losing eyes, yelling, shouting... Anyhow, that ended and after another segment I can't remember (involving Sarah (from the cafateria at Cabrillo) and the UCSC campus), I was watcing another 'movie'... Worf, from ST:TNG, was in a gigantic cylindrical chamber buried upright miles underground. It was pitch black inside, and he was holding a space-age lantern and walking out along a bridge composed of pulsing pink flesh. He approached the center of the cylinder and met the keeper of the place- a demon creature about his size, sitting on the misshapen head of the immense fleshy pile wharf was also standing on. The head resembled a cross between a maggot, a fly, and a sea otter. It had six or seven fly-like legs, about a thousand feet long, poking out near its head. Worf had been walking up it's forearm, which was attached to the wall near the door to the cylinder. The demon was linked to the mind of the fly creature, and was making it do a service for someone- duplicating, in it's fleshy labyrinth, a huge gemstone. However, Worf interrupted his concentration and he caused the creature to secrete the original stone out one of its legs, whereupon it fell into the blackness and started bouncing off odd organs and limbs, getting thoroughly lost in the innards of the creature. The demon was annoyed at Worf, and told him it was his duty, since he had shown up unannounced, to go find the original gemstone. The demon knew in his mind that Worf would probably die or go insane down there looking for it, but didn't much care because he was miffed in general at people who came asking him for favors. So Worf would die, and the person asking for a copy of the stone would get nothing, which was fine as far as he cared."
