["https://garote.bdmonkeys.net/dreams/d940415.html"]
title = "Garote�s Dream Pile"
full_description = '''At some points I was driving a car, in others I was walking. Eventually I came out upon a ledge and saw, below me, a hole in a cement lot. The hole was smaller than a manhole, exactly big enough to admit a person standing straight up. Over it was standing a person, whom I knew was not really a person but one of the alien force. As I watched, another person walked up to the alien, the alien stepped aside, and the person rapidly floated straight down the manhole and disappeared. This was how they were collecting their victims. At this point I screamed to the alien "Why? Where are you taking us?" The alien race, I felt I knew, was not from another planet, but from deep underground where we have never looked. I was about to enter their lair. I somehow found myself standing over the manhole, and I was sucked down into it. The circular walls shot up extremely rapidly, directly in front of my eyes. I knew if I moved my head even slightly to the side, I would get my ears or nose sheared off. After a feeling that many many hours had passed, I landed at the bottom of the "pit" and began crawling down a narrow tunnel. At this point I had a companion I cannot remember much about, and I knew that it was essential that I traverse this tunnel as quickly as possible if I wanted to remain alive. I told this to my companion, and we crawled together along the claustrophobic tunnel, I in the lead. We arrived in a room half filled with water, that was some sort of puzzle. Somehow I knew what I was supposed to do because "that was how they did it in the movie." The exit was a squat top-down sliding panel set into a wall that was about one and a half feet wide and seven inches tall. Obviously not big enough for me to fit through, but so what. I picked up a metal disc from one end of the room, tore a panel off a box in another, and walked to another corner, near the "exit." I pressed a code to get the exit panel to move open (I knew it wouldn't stay open long enough for me to pass through). When the panel opened all the way, I threw the metal disc across the room into the open box. It tangled in some wires and electricity writhed in arcs around it. This apparently jammed the mechanism which shut the door, and a good thing too, because the water had almost filled up the room.'''
