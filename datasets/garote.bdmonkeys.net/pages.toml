["https://garote.bdmonkeys.net/camping_trip/index.html"]
title = "Sierra City Vacation, Day 1"
full_description = '''All too often a vacation journal ends up as interesting as a laundry list. I made an honest effort to avoid this by jotting down the thoughts I had along the way, in a much abused PalmPilot. Hopefully these will add some character to the endless parade of photographs and statistics. More people would love camping if it wasn't for the dirt. You can boast all you like about "roughing it" in the woods, taming the wilderness with a blanket, a pocketknife, and a sack of granola, but I find that the true distinction of a camping trip is that people stop bathing. For this reason, I highly reccommend you camp way up in the mountains, where the thin dry air will hamper your sweat, and destroy your sense of smell. My family has gone camping to the same grounds for three generations now. We live in many places, the majority of us scattered up and down the west coast, but a few of us always find our way back to the old site in northern California. Wild Plum campground is 4000 feet up in the Sierras, near the aptly named Sierra City. Well, the 'Sierra' part is appropriate, anyway. With a population of 224, it hardly qualifies as a city. That number has not changed much over the years, either. Sierra City is mostly an outpost, with a few die-hard locals around to maintain the equipment that the tourists use. Snowmobiles, for example, are very popular in the winter months when the entire mountain range is frozen. Several private citizens and small shops will rent you a snowmobile, but these loud, powerful, treaded beasts are not cheap. In fact, going on a winter vacation there is tougher in every way. To reach Wild Plum campground in the winter you need a four-wheel-drive truck with chains on the tires. I have neither truck nor chains, but it's a lucky coincidence that I prefer camping in the late summer. Besides, I like to do my hiking without wearing skis, and you can't roast marshmallows over a propane stove. At least, not without making a complete mess of your stove. So I've been looking forward to this late August trip for most of the year. This Sunday, it's finally underway.'''
