["https://garote.bdmonkeys.net/alaska/van_design.html"]
title = "North to Alaska - Van Design"
full_description = '''I want to travel. Travel can mean different things, based on the level of comfort, and the level of "adventure", an individual prefers. But frugality and flexibility are interests of mine. Hauling an entire house around would solve a lot of problems, yes, but the core element of travel is being away from home. For example, If I bring my whole bedroom to a mountaintop in the Sierras, I bypass the novelty of sleeping under the stars. I'm going on a long trip through Alaska and Canada. The larger the vehicle I take, the fewer places I will be able to drive it. Some roads just won't accommodate a large vehicle. I'm also interested in having a vehicle that I can use for purposes other than long camping-style road trips. I'd like to employ my vehicle in trips to the store, or use it to haul furniture, for example. Trucks are nice, but I rarely need their level of power or flexibility. I do, however, like to haul groups of friends around, and have a private indoor working space wherever I go. A better choice for my purposes is a van. Vans apparently aren't popular because they're not "manly" enough. To be "manly", I'd require an SUV. I'd like to go off-topic and say a few choice words about that. An SUV is designed and marketed as a replacement for van and a truck, but in practice it conveys the real advantages of neither. In the extreme case, an SUV is essentially a truck that's only good for hauling groceries. Mud, paint, cinder blocks, and scrap metal do not mix with leather interiors, even synthetic leather interiors. Clever fold-away seats, and piles of split firewood jumbling around, do not play well together. I suppose the reality is, that's all people want - to be able to take a bunch of groceries up a four-wheel-drive-only road. So, my irritation must shift instead to all the twits on the road who are now capable of this, yet never do it. They said, "I want one car that will inadequately serve the purposes of three, so my options aren't limited." For those twits, I have these words: Did your dick actually get bigger, or are you still waiting?'''
year_published = 2025
clearnet = "https://garote.bdmonkeys.net/alaska/van_design.html"
