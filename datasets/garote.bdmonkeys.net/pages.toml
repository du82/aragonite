["https://garote.bdmonkeys.net/dreams/d990101.html"]
title = "Garote's Dream Pile"
full_description = '''As I watched a bird being carefully tethered inside a wooden carrier, I mused that I was "glad to be down here, than up there with the dumb people". I was referring to the people near the surface, who were not informed of the true nature of the weapons we assembled, or the conflict taking place. Instantly I was on the surface, standing shin-deep in the water of a creek. I was with a small team of three, holding the end of a long black rope. The rope went over the water to the second person, who was standing at the mouth of a short cave set into the shore of the river. The rope went into the cave, which sloped down sharply for a good 40 yards and then opened in a small room. A third person was there, tying the rope to one of a long line of harnessed bird-creature combinations, just coming off a conveyor belt. When the person tying the rope finished, they gave a signal, and the two of us in the water pulled fiercely. The rope stretched slightly, then retracted like a rubber band as we pulled, and the creature was drawn gently up the tunnel with gathering speed, and burst into the open air on a diagonal ascent. Immediately the bird's wings flapped, and it took off over the trees. We launched several other units this way. A small creature zipped out of the cave like a hummingbird and danced in the air before the two of us in the creek. Speaking in a querulous, wailing voice, it asked if we'd seen "the master". Neithr of us knew. The creature became more agitated, and darted off into the trees towards some buildings. We shrugged and continued our work. Then I was watching a movie in the downstairs living room of my old Scotts Valley house. It was showing on the old faded tv in the squat frame with the wooden shutters that slid closed. It was Dune, but it was the second half-- a part I'd never seen before, nor read about in the books. It was the part "where things got weird", I knew. I watched the TV and flowed into and out of the reality it depicted, as the details of the scene demanded. Skeletal creatures with large hind legs and thick, dragging tails were extricating themselves from the mire of a muddy black swamp. They moved clumsily, sluggishly, as if they were being awakened from a long sleep. Their bodies were alive, but through means I was unfamiliar with- they looked emaciated, half-dead, sometimes partially disemboweled- but fell into procession readily enough, in a slow line moving through jungle foliage, ending at- a couch!'''
year_published = 2025
clearnet = "https://garote.bdmonkeys.net/dreams/d990101.html"
