["https://garote.bdmonkeys.net/alt_atheism.htm"]
title = "A fracas in alt.Atheism"
full_description = '''I left the newsgroups and forgot about them for most of a decade. Then, out of curiosity, I came back in 2001 to see if alt.atheism had changed any. It had not. I added to the sound and fury for a while, posting the messages you see below, but soon gave up and left again. This sequence of postings is probably the last time I got really involved in an online debate about "God". In this period, I came to the realization that the sound and fury of alt.atheism was masturbatory in nature, as were most of the endlessly contentious topics it covered. People just argued them to feel good and waste time. I admit to being just as cocky as everyone else while I posted there, and that I had a religious bone to pick. I was annoyed by what I saw as Christianity's desire to manipulate, frighten, and control me. To put it bluntly, I don't give a crap about it any more. The ideological exploration I made is thorough enough, and in my personal life it has hardly been challenged - instead, the Christians I have met have politely kept their beliefs to themselves, and I have had no reason to defend myself as in the messages below. When the topic of "God" or a spirit world has come up, debate has been friendly and respectful. Perhaps if I got into more trouble -- moved to a chateau in Mississippi and started handing out manifestos for example -- these ideas would come in handy. But I have no desire to proselytize, beyond placing what I wrote online as a reference and a resource for others. You may find some of these dialogues interesting. Perhaps they cover ideas that you're surprised people are still arguing about. Feel free to cite them in your high-school essays. "Michael" <villagechief@optushome.com.au> wrote You know you can't prove the non-existance of God deductively, and inductively you can come up with as many "just-so" stories as you wish. You have a half arguement. One that is not provable - you cannot therefore be a positive athiest...this is wishful thinking (even if you are correct), it is merely hope that you are correct.'''
year_published = 2025
clearnet = "https://garote.bdmonkeys.net/alt_atheism.htm"
