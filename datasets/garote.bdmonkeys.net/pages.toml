["https://garote.bdmonkeys.net/cryebread.html"]
title = "Recipe: How to Make Rye Bread"
full_description = '''Now, when you come back the following day to your starter, you are going to begin to develop your rye sour. It is done in three stages, each one 4 to 8 hours long. I simply take the leftover sour from the previous week, add one tablespoon of crushed caraway seeds, and one tablespoon of minced onions. I then proceed directly with Stage One. If you forget to do this and then come back to the sour, only to find that the top is all discolored and it smells rancid, DON'T WORRY. Just skim the top off the rye sour -- this is the rancid part -- and mix in fresh water and flour. If you aren't planning to do any rye bread baking soon, you can freeze a cup of sour for up to two months. Mix in 3 cups of the white flour, the salt, and the caraway seeds. Then mix in another cup of the white flour with your hand. The dough should be coming away from the sides of the bowl by now. Turn the dough out onto a surface for kneading. The way I knead is to press the dough out with the palms of my hands until it has become large and flat, and then I fold it back up and press it again. You should knead for 10-15 minutes. You will know when the dough is ready and all "kneaded up" when it develops a springy, elastic consistency, and resists you slightly when you try to press it out. When you've finished kneading, let the dough sit and rest for 15 minutes or so: long enough to clean your bowls and wash your hands. Then, punch down the lump of dough and shape it into two medium sized loaves. Place your loaves on a baking sheet (you can coat your pan with oil to keep the loaves from sticking, but I prefer to cover the bottoms of my loaves with rye flour. This gives the bottoms a certain taste, and what's more, it keeps the loaves from sticking, if you do it thoroughly). Cover them with a towel and allow them to double in size. This might take 45 minutes to an hour. When they have doubled in size, slash the tops of the loaves with a sharp knife (about 1cm deep), sprinkle with rye flour and bake them at 375 degrees Fahrenheit for 35-45 mins.'''
