["https://garote.bdmonkeys.net/dreams/d951103.html"]
title = "Garote�s Dream Pile"
full_description = "I knew that I was somehow threatening to this big beast, but weak now- so I hid behind my wizard pal trying not to be found out. When we were done speaking with it, it teleported backinto the distance with another grinding shift and we left the building. My wizard friend asked me if I could kill it, if it got out of his control. I told him I needed a better shield, a weapon that would freeze it, and improved flight skills. He went to an open-air workshop in a little hamlet populated by dirty serf people, and gathered some tools. He asked me to fly over to a fountain and retrieve a lead statue from it, which I did. It was a dark lump shaped like a winged demon playing frisbee, with gems for eyes and a little lead base. I gave it to him and he melted it down and made a shield out of it, a pair of wings attatched to a band, and a flask of liquid he poured into a pen-like object. When I strapped on the fake wings they dissappeared and I could suddenly fly much better-accelarate faster, bank better, and inertia didn't bug me as much. The pen squirted a liquid that froze the hell out of anything it touched, with a crisp frying noise. We tried it on a peice of paper and it shattered into dust and blew away."
