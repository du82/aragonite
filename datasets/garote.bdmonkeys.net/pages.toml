["http://garote.bdmonkeys.net/rants/rcivilseq.html"]
title = "World Conquest via PC again!"
full_description = "I think it was the English and Germans I destroyed first... The English were wimps. I started up in the corner of this long turd-shaped penninsula, in my capital city of Scum Puddle. What better cradle from which to launch the legacy of the civilization known as the 40ft Fritos? Under the munificent leadership of chief Cat Food, my cities expanded at Ludicrous Speed over the first bowl shaped section of land, over a short mountain range, and out into a broad plain. A narrow land bridge led south, and I sent exploratory chariots down and ran immediately into the fucking English. We traded knowledge and signed a peace treaty. Couple turns later and they'd been ousted from their capital city. Cleaning up the remains was an ongoing process. At the same time demographics showed typical family size at 4.5 children. My happy little townsfolk were breeding like nobody's business. They probably couldn't read the instructions on the condoms or something, 'cause literacy rate was around %15. That's okay though, I breed 'em to build chariots, not do research! So I beat the English into a corner and ran into the Germans. Filthy little bastards led by this jerk traveling around in a covered wagon. Apparently their capital city had been destroyed, and their official leader along with it. Same deal, we traded knowledge, signed an agreement, and I spackled their city walls with the blood of the condemned. Pause here to build roads and infrastructure. Still breeding like nobody's business, except the Chinese decided to make it their business. Squinty-eyed maggot carrying a little red book around with him, flanked by his advisors dressed in ridiculous poofy Rennaisance outfits. Pretentious jerk. Threatened to smite me with his 'mighty armies' unless I revealed the secret of 'literacy'. Go learn to read your stupid book on your own, you bastard! I enjoyed capturing Peking. Odd though that I already had the Great Wall... It had been built by the English, in the city of Dover. About this time I found the last stronghold of the English. A coastal city named Cantebury, full of frolicking little people with funny accents. They had city walls, and by this time everyone had discovered gunpowder, so I decided to leave them be. Which was just as well because they kept doing research. I'd built the Great Library back in the city of Creme De Yow, and every technology that two civilizations developed, I inherited too. Best investment I ever made. Set my tax rate to 0% research, and after a couple false starts I had a democratic government. Not a chief anymore was I! President Cat Food at the helm!"
