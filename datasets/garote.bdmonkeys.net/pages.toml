["https://garote.bdmonkeys.net/dreams/d990915.html"]
title = "Garote's Dream Pile"
full_description = "Halfway to the exit ramp, I remembered that I could fly. It was one of my talents, something that the other superheroes didn't do. I thought about superpowers differently, and had figured out how to fly through simple experimentation. The others could learn how to do it if they trained, but they thought the ability was beyond them. I ran very fast, jumped, straightened my arms and legs into a torpedo shape, and arched my back. The trick was to arch the back. I felt a slight pulling sensation, and began to ascend. Beyond the exit ramp of the school was a dark green valley, a blanket of dense, textured plants that grew in a repeating pattern like the rubber insulation in a cheap music studio. The rest of my heroic friends took a path arcing down the hillside. My father was in the lead. His hero form was the Horned Reaper, a character in a dungeon game I played last night after work. He took great strides with his cloven feet, stomping the bouncy turf. I flew in a tight curve until I was facing my team, then went into a nose-dive. I was playing around. I ricocheted off the path just behind my Dad, then began to roll along with the group, making conversation. At the bottom of the path only myself and Carolyn's old Crown-Merrill apartment-mate Jon were left. I played a cruel joke on him, spraying him with water from my bottle, soaking his head. The path became a set of stairs, ending in a rectangular living room. A couch was against the wall, facing a television next to a sliding glass door. Two strangers were sitting on the green shag carpet, watching the TV. A couple of sleeping bags on pads were nearby. One was mine, the other Jon's. I fell down next to mine, laughing uncontrollably at Jon and my funny joke. Jon was confused, and kept walking. The creepy evil police officer got his hand cut off in a fight. He walked through my Middle School campus and found a snack shop - a small wooden building with a fold-up panel and countertop, over which combestibles were sold by the snack lady. He dove over the edge of the counter, into the shop."
year_published = 2025
