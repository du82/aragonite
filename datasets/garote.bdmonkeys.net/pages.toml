["https://garote.bdmonkeys.net/dreams/d971231.html"]
title = "Garote�s Dream Pile"
full_description = '''I wait around, tolerating the wizards, because I know that some other creature will crawl out of the corners of my room and kill them all off. This earns me many more points than if I had just killed the wizards myself. To keep amused, I use one wizard for target practice and fling an orange at it. My aim is terrible in this dream, and I always miss the wizard by a minimal space. The orange rolls all around the room after I throw it, and each time I retrieve it I observe that it is getting mushier and mushier beneath the peel. All at once, every wizard is dead. I stroll to the corner of the room where the maze merges in, and observe a tiny pile of posessions on each spot where a wizard died. From one pile I grab a small U-shaped chrome piece, sharpened at one end. I puncture the orange with it and put the hole to my mouth, sucking out a stream of fresh juice. My mother knocks on the door and informs me that the phone bill is due, so I'd better pay it. So here I am, driving on the freeway, in search of ... not the phone company, no! ... the Sentinel office, to subscribe to the paper for a year. Whatever. The freeway ends at an intersection and I ponder for a moment before turning right. The road peters out and I am outside, walking on a gravel path. I arrive at a storage shed and see a glossy paper fragment on the floor, just beyond the doorway. I pick it up. It's a logo for a surfing equipment company, with some evaluation notes dashed out on it in cursive. One fragment reads, "ha ha ha!" An old man approaches from behind me on the gravel path. I turn around and ask him where I can find the sentinel building. He offers to take me there. I follow him along another path through some underbrush. At first, we are both having a friendly chat, but as we continue along the path the conversation drops away and we trudge in silence. We jog lightly over the roofs of a row of tightly-parallel-parked cars. We walk up along a network of wooden bridges, constructed of many horizontal boards supporting two flat, straight boards, sort of like train tracks. There's a bridge over Fiddle Creek near Sierra City with boards laid in this same pattern.'''
