["http://garote.bdmonkeys.net/nethack/index.html"]
title = "My Nethack YAAP"
full_description = '''That sounds like a pretty outlandish title, huh ... but I mean what I say. By accident as much as design, Nethack has evolved as a game that is uniquely suited to exercise the imagination. It takes place in a complicated, colorful world, and it describes that world using a method that shows you exactly what's going on ... but which also demands - insists - that you use your creative skills to visualize, hear, and feel the environment. This unique game doesn't draw you into itself - it compels you to draw yourself into it. Because the game does not actively ply you with environmental cues, it appears to have a curious lack of substance. But it's not really substance that sets Nethack apart; it's the way the game leverages that lack of substance. The interface is bizarrely minimalist. Nethack has no movies, no sound, and no pictures. It's just colored text and symbols, and most of the time the symbols don't even resemble what they represent. To the newcomer, it's hard to even recognize as a game. It looks more like the guts of an old typewriter creeping around on the screen. You know those games where you sit around a candle-lit table with some books and some friends, and describe an adventure with pencil diagrams and evocative prose? Nethack lore is drawn from that tradition - the role-playing tradition - but in Nethack, you don't even get the prose. Sure, you get single-sentence notifications of what happens - ("KABOOM! You see a door explode.") - but the text is disconcertingly light on adjectives. And for this, Nethack stands in a bizarre place of its own in the cultural landscape, as a complete inverse of the computer games that now dominate the industry. It's not 3-D, it's not in real-time, and it's not networked. And yet, people still play it like crazy. How can it possibly be compelling? What could it possibly do to entertain, without graphics or sound or prose? Why would anyone today want to play it? The answer is simple: Nethack does what computers do best - what computers were invented for. It hands you a symbolic representation of something, and lets you interact with it. The symbols are utterly mundane ... but the interaction is extraordinarily complicated. Interacting with the game of Nethack can be glorious, frustrating, hilarious, and satisfying. Like any great game, it's even fun to watch and talk about when played by others. There are probably more web pages of people telling their Nethack war stories than there are pages discussing the game itself.'''
