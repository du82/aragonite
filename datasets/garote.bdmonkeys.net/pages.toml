["https://garote.bdmonkeys.net/dreams/d20000906.html"]
title = "Garote's Dream Pile"
full_description = "The camera pans up, bringing the torsos of the two men flush with the edge of the stone railing. In an instant, they become gargoyles, snarling at each other, frozen on the side of a grey wall. It is a labyrinth of stairs and arches, a mystical region of the castle gardens, enchanted to bend the perceptions. The camera swoops down the wall and into a disorienting tangle of walkways, lit by afternoon sun and torches. I am Winona Ryder. I am running through the maze because I am frustrated, and because I like the idea of being hard to find. Dracula is after me. The camera catches me at an angle, so I appear to be running along the wall, head down, carrying the front of my long white dress so I don't trip over it. Somewhere out in the world, a man is plotting to seduce me, a terrifying man, but familiar, and oddly compelling. I run through the maze and the camera follows me. I end up in a rectangular chamber filled with shallow stairways, criscrossing and intersecting each other like a crossword, all running upwards to one wall of the chamber. It is laid out like the second level of the old arcade game, Crystal Castles. Sometimes the chamber is illuminated through big bay windows on one side, sometimes by fiery torches ensconced on every wall, as if it were underground. I am not alone. A woman in red is standing on the steps nearby. She looks exactly like me - exactly like Winona Ryder - except for the red dress. She is an alternate incarnation of me, an anthropomorphic personification of my deepest insanity, and she craves to be with Dracula. She loves him as deeply as I hate him. She does not, however, bear me any ill will. Nor do I resent her. It would not make sense to, for we are both the same entity. Suddenly, Dracula has arrived, standing in the center of the chamber. His face is grey and indistinct, and he wears a black cape lined with red satin. Immediately the three of us begin to argue. We march up and down the stairs as we talk, weaving all around each other on the stairways. The woman in red is trying to convince Dracula to elope with her. Instead, Dracula wants to elope with me. I want nothing to do with him."
