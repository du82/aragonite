["https://garote.bdmonkeys.net/eric_the_unready/index.html"]
title = "Eric The Undready Walkthrough"
full_description = "This walkthrough provides a narrative description of the things you need to do in each section, then provides a sequential list of exact commands for completing that section. The idea is that the narrative tells you what to do, and if you still have trouble, the commands will tell you how to do it. The commands have been padded out in places to reveal particularly amusing jokes in the game. Note: In the game, items which are no longer useful are conveniently removed from your inventory after each section. You need the rope from the barn to descend into the pit. For a laugh, EAT SHIT. Also get everything from the medicine chest beforehand. You'll need to use one of these items on the pig. Wait until your squire gets you out of your armour. Attend the meeting at the Union Hall. Go to the armoury and answer the copy protection questions to get the cloak. Look in its pocket. Go back to your barracks and get the helmet. At the pond, fill the helmet with water. Go to the palace and talk to the guard. Get the kindling from the fireplace. Go outside and plant the bean in the garden. Water it. Climb the beanstalk. After the briefing by Bud the Wizard, take the magic coin and go to the torch vendor's. Then enter the ice cream parlour and talk to the boy. Make a fire, accept his earmuffs and wear them. Buy the float. Pay the bard to recite the epic and wait. Take him to the palace. Wait, then go upstairs and eavesdrop. Downstairs, wait until the fight breaks out. Outside, pull the banana from the stone. After another briefing from Bud (make a note of the five items of your quest, and WHERE you need to use them), go to the pond and follow his instructions regarding the banana. Check out the graveyard, then get past the tree to the west by giving it some refreshment. Move branches to reveal the trapdoor. Descend, open the mailbox (memories of Zork I!) and get the prize offer. Go to the rock shop and get your free gift. Use it to break into the house. Pull the rug and open the trap door. Get the beard from the trophy case. Go upstairs, and search the bones to get the ID. Go to the publishing house and give the prize offer to the dwarf. Go outside, wear the beard, kneel, and go in and try again."
year_published = 2025
