["https://garote.bdmonkeys.net/dreams/d971122.html"]
title = "Garote�s Dream Pile"
full_description = '''I am eating a Taqueria Vallarta vegetarian burrito. Occasionally I take a bite out of a head of iceberg lettuce. The lettuce is bland, so I baste it with some tahini sauce. My Dad, also at the dinner table, expresses mild surprise at my choice of toppings. My companion returns from the war. He is a young adult now, as am I. I am with the rest of the men in the snowy courtyard, line dancing with the women. I am tempted to dash up to the woman we were competing over, grab her, and dance her flambouyantly around the field, to make it really clear to him that, in his five-year absence, I had won over her heart. But I didn't because my good side won out over my mean side. Now my companion and I are young kids again, around thirteen or fourteen. It is night and we are outside a victorian house, on the front porch. We are talking through the window to a man who is sleepwalking. He is sitting in a chair in the front parlor, listening to our suggestions. We pass items to the man in the room, who follows our instructions in his dazed state. We tell him to put on some music, then we tell him to switch to the record player. "Here, play this record," I say. He comes up to the window. I move my hand out of his vision and pretend to pick up a record. I'm pretending to have a record so thoroughly that I can almost see it as I pass it through the window. The man is completely fooled. The record is the Beach Boys, and I instruct him to put it near track five, on Surfin' USA. We walk away for a bit, then come back. In the intervening time, the man has realized he is sleepwalking, gone to the bathroom, and gone upstairs to bed. Hiding in the dark corner of the porch, we observe the housewife receiving a letter through the front door. She opens it, reads it briefly, and then runs upstairs. We hear her shouting to everyone in the house, "Okay everyone; orders!" Then she describes directions and instructions from the official paper. It is daytime. My friend realizes that the war is on again. He leaps off the porch, onto the swampy, wet ground. On his hands and knees, he crawls along the side of the house. War noises fade in like a symbolic soundtrack. Big black bugs zoom straight at him, making plane noises. He ducks into dirt to avoid getting hit. Funny, I think, because that sort of war device (the bomber) isn't supposed to have been invented yet.'''
