["https://garote.bdmonkeys.net/art_of_magic/index.html"]
title = "Magic and Mayhem - Art of Magic - Thoughts"
full_description = '''If memory serves, that was about a year ago, with Ultima 9. In early 2001 I finally assembled the mega-computer that Ultima 9 demanded, an 800Mhz dual-CPU beast with 768 megs of RAM, a RAID array, and the latest 64-meg ATI graphics board. I loaded up on snack foods, dimmed the lights, locked the door, and nobody saw me for a week. When I emerged -- bedraggled, malnourished, sore, and mentally unbalanced -- I promised myself that I would keep away from RPGs. Well last weekend I was bored and wanted some escapism. And there it was, Pandora's Box. My CD binder. All these games I've never played; might as well pop one in ... Hah. Now it's 4:55am and 40 hours later, and I'm bedraggled, malnourished, sore, and waaayy mentally unbalanced. I should not have broken my own promise. The long immersion has warped my cognitive skills. The insides of my eyelids are papered with green health bars and oozing red lava. Why did I install this damn thing? Why did I click the icon? How could this have possibly been a good idea at the time? So what really hooked me was the music, and the menu displays. Ghoulish tiki masks, inside floating iron rings, pulsing and spinning. The music oozed right up my back and crimped my brain out of this world, and into the shadowy green RPG world of "Art of Magic". Very atmospheric and subtle; very effective. I was a goner. I've come out of this game with a hefty respect for the developers, whose gaming company dissolved out from under them while the final version was being produced, yet still found a way to finish and release the game. I've also made a couple of amusing observations about this game and 3D games in general, which I'd like to document here. Before I quit RPG games. Again. In a broad sense, this is one of those "explore - drama - fight - explore - drama - fight" games, which all us Final Fantasy and Dungeon Keeper players are familiar with. It's a pretty straight cross between those two, actually. The graphics and the sound have a cohesive, unified quality, and my screenshots and discussion here does not do any of it justice, but I'm not writing a review... I'd just like to make a few points.'''
