["https://garote.bdmonkeys.net/dreams/d990715.html"]
title = "Garote's Dream Pile"
full_description = "I knew that we were hiking through a landscape on a planet far from Earth. We were the only two people on the planet, in fact the only two people in the solar system. Billions of years separated us from the time that was ours. We had arrived here through a bizzare form of time and space travel. I had no idea how long we would be staying, or if we could return. We turned away from the windswept coast and began slogging into a swamp. The choppy ocean was at our backs, but soon the booming noise was drowned out by our progress through the muck. We were both wearing hip-waders, and had to take very large steps to avoid tripping on submerged objects. The water came up mid-thigh and was covered in green scum. The wind was dead. Overhead, the sky had become a pinkish blank. I could not tell how far away or close it was - we might have been inside a lit cave. As we moved, brushing waterlogged debris aside, I approached a dirt plateau, ringed with short browned grass. Smooth plastic bodies only retained tiny patches of the bright paint that had given them personality. Wind and weather had eroded their limbs into vague shapes. My companion and I stopped, and as I looked them over I remembered a scene from an old childrens' movie. Thousands of bears had danced in unison, singing a happy song as confetti swirled above. There had been balloons, and cheering people dressed in cartoonish period clothes, celebrating victory over a foul menace. Now the bears were useless. They had been stacked here for future projects, but whatever agency owned them was long gone. The most disturbing thing about their presence was that every one of them was stacked facing out, as though they were all searching the horizon for rescue. My partner and I continued slogging. Between myself and the shore of the bear island, a mound of decayng objects rose from the water. I approached the mound and saw that hundreds of nutcrackers had been discarded here, to rot in the swamp. Each one was a crafted wooden soldier, about a foot tall, with a golden sword and a high stovepipe hat. The ones above the waterline still retained their bright paint."
year_published = 2025
