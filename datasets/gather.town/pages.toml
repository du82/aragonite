title = "Pricing"
description = "Pick the best plan for you."
full_description = '''Virtual Office PricingCreate a space where your remote team can cowork, hold meetings, and create a shared culture.MonthlyAnnual-15%Free$0Limited to 10 usersGet StartedWork with a small teamUnlimited audio, video and chatCalendar integrationFull customizationPremium$5.95$7USD/user Start Free 30-Day TrialWork with your whole teamUnlimited audio, video and chatCalendar integrationFull customizationPriority supportDomain restricted accessMeeting recordingEnterpriseCustom billingContact UsFor large teamsOnboarding assistanceUnlimited audio, video & chatCalendar integrationMeeting recordingFull customizationPriority supportDomain restricted accessSSOHosting a one-time virtual conference?View conference pricingNot sure what to choose? Subscriptions$7 per user per monthNumber of Users-+Billing CycleMonthlyAnnuallyMonthly Bill$7Hosting a one-time event?View CalculatorPricing questions? Contact us Hosting a one-time virtual conference?View conference pricing @media only screen and (max-width: 767px) { .pricing-table_icon + .pricing-table_icon:before { content: ''; display: block; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 1px; height: 100%; background-color: white; } } Compare our plansFreePremiumEnterpriseBasicsFreePremiumEnterpriseUnlimited audio, video, and chatThere's no limit to meetings or messages in Gather. Talk as much as you need!Unlimited rooms & customizable mapsStart with a template or fully customize your office.Number of usersThe number of users that can be in your office at the same time.Up to 10Up to 500Up to 500FeaturesFreePremiumEnterprisePersonalize avatars and desksChange your appearance and customize your workspace desks.Sync with Google Calendar and OutlookEasily schedule meetings in Gather and view upcoming events.Schedule unlimited meetingsTalk to teammates whenever you need. No limits to meetings or messages.Embed interactive objectsAccess important links within your office.Built-in team building activitiesPlay a quick game together or talk around the virtual water cooler.Meeting RecordingRecord your meetings in Gather and save them locally.InsightsView high-level data about activity and engagement trends in your Gather office.Access & securityFreePremiumEnterpriseTemporary guest invitesShare access to your office for a limited time.Password-protected accessRestrict access to your office with a password.Block, ban, or kick usersAdmins can block, ban, or kick users from your office at any time.Domain-restricted accessLimit access into your office with an email address ending in "@exampledomain.com".Single Sign OnManage employee access at scale with secure single sign-on.SupportFreePremiumEnterpriseGather Help CenterFind answers to common questions quickly through our collection of articles.Priority customer supportNeed help? Your questions move to the top of our queue.Dedicated Customer Success ManagerPartner with us to execute a rollout, and receive ongoing guidance on utilizing Gather successfully.Min 75 UsersOffice design consultationSpeak with a Gather mapmaker for best practices on how to design your office layout.Min 75 UsersWhy remote teams love GatherMorgan SoleyDirector of Engineering at Beatport“Gather has done more for Beatport’s engineering operations, culture, and productivity than anything else in the last 5 years.”Jonas MorgnerChief of Staff at TradeLink"Gather has changed & enhanced the way that we break borders and empower an international company. We have felt the positive impact of Gather on the way we work from Day 1."Carolina KiaCEO at weme"When people think about weme now, they think about our remote office on Gather. It’s an important part of our company."Read all Customer StoriesGet two months rent-freeGather for StartupsWe know firsthand that running a startup and scaling a business is a lot of work. Whether you’ve just raised your seed round or landed Series B, we’d love to help your remote team.Apply for 2 months freeJoin the 1,000+ innovative teams using GatherFrequently asked questionsHow do I upgrade to a monthly subscription? You can upgrade and manage your subscription by going to your Space Dashboard. Go to the Reservations Tab and select the Monthly Plan. Once you set your Space Capacity and enter billing information, your subscription will begin! For more details, along with learning how to make changes to your subscription, follow along with this help doc.What is the difference between a free plan and monthly subscription? The free plan allows a maximum Space Capacity of up to 10 concurrent users. The monthly subscription allows you to set a maximum Space Capacity of up to 500 concurrent users, in addition to offering more features and priority support. The monthly subscription fee is based on the Space Capacity you set: the number of concurrent users you’re planning to have in your office at the same time. This Pricing Overview provides more details about how our pricing works. Does the monthly subscription include 10 free users? It does not. When you purchase a monthly subscription, you’ll get extra features like increased space capacity and premium support. Because of this, you’ll pay $7/user/month. For example, a monthly subscription that allows 11 people in your office at the same time would cost you $7 per person per month, so the total subscription cost would be $77/month. For questions about pricing or to discuss annual discounts, please contact sales. What if I have an office event coming up with more people than my normal capacity? You’ll either need to increase your subscription capacity or book a one-time event reservation. To do that, you can follow the instructions in this help doc. ‍Can I use Gather for more than 500 users? Gather offices are limited to a maximum of 500 concurrent users to ensure stability and enhance user experience. Offices with more than 500 users can still be built; they will just need to be split across multiple spaces with portals connecting them. Read more in our Connecting Spaces article.If you're interested in creating an office for more than 500 users, contact our sales team and we'd be happy to assist you! Do office guests count toward my capacity? Yes, all user roles count toward your Space Capacity. For example, if your Space Capacity is 40, you could have 30 Members and 10 Guests (or 30 Guests and 10 Members, or any other combination) in the space at the same time. If you anticipate having multiple guests simultaneously, you should consider increasing capacity.Try Gather freeGet StartedView pricing and plans'''
