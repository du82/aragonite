title = "Gatsby Privacy Policy | Gatsby"
description = "Gatsby is a React-based open source framework with performance, scalability and security built-in. Collaborate, build and deploy 1000x faster on Netlify."
full_description = "What Changed: We revised our Privacy Notice to make it clearer, to add more information regarding our use of cookies and to add a discussion of personal information of persons located in the European Economic Area (“EEA”). Gatsby, Inc. provides a cloud-based, software-as-a-service to help companies develop custom websites designed to allow for the easy addition of new capabilities and functions. In this Privacy Notice we refer to the Gatsby software-as-a-service and the suite of services provided through the software-as-a-service as the “Gatsby Cloud.” We maintain websites to market the Gatsby Cloud at www.gatsbyjs.com and other websites controlled by us (collectively, the “Website”). The Gatsby Cloud is a business to business solution offered primarily in the United States and the EEA. We license the Gatsby Cloud to business entities that design, develop and operate commercial websites (our “Clients”). Clients can access the Gatsby Cloud through our Website. https://www.gatsbyjs.com/dashboard/login. “Authorized Users” are persons who work for a Client and are authorized to access the Gatsby Cloud on behalf of the Client. In order to provide the Gatsby Cloud we collect PII from our Clients. We also collect PII from our Authorized Users. Gatsby knows you care about how your personal information is used and shared and we take your privacy seriously. We gather information about persons who interact with our Website and the Gatsby Cloud, people who attend our marketing events, and job candidates to enhance our business. Our Privacy Notice helps you understand what information we collect and receive and how we use it and the choices you have. This Privacy Notice does not cover the practices of companies we don’t own or control. In this Privacy Notice personally identifiable information or “PII” means information that identifies, relates to or describes a particular person and information that is capable of being associated with, or could reasonably be linked, directly or indirectly, with a particular person."
