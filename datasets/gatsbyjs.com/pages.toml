ple, to clone a new gatsby-starter-blog, execute:The first argument (e.g. my-new-blog) is the name of your site, and the second argument is the GitHub URL of the starter you want to clone.Note: The site name should only consist of letters and numbers. If you specify a ., ./ or a <space> in the name, gatsby new will throw an error.developCompiles and serves a development build of your site that reflects your source code changes in the browser in real time. Should be run from the root of your project.Options include:OptionDescription-H, --hostSet host. Defaults to localhost-p, --portSet port. Defaults to env.PORT or 8000-o, --openOpen the site in your (default) browser for you-S, --httpsUse HTTPS--inspectOpens a port for debugging--verboseTurn on verbose outputTo set up HTTPS, follow the Local HTTPS guide.To include a URL you can access from other devices on the same network, execute:You will see this output:You can use the “On Your Network” URL to access your site within your network.buildCompiles your site for production so it can be deployed. Should be run from the root of your project.Options include:OptionDescription--prefix-pathsBuild site with link paths prefixed (set pathPrefix in your config)--no-uglifyBuild site without uglifying JS bundles (for debugging)--profileBuild site with react profiling. See Profiling Site Performance with React Profiler--open-tracing-config-fileTracer configuration file (OpenTracing compatible). See Performance Tracing--graphql-tracingTrace (see above) every graphql resolver, may have performance implications.--no-color, --no-colorsDisables colored terminal output--verboseTurn on verbose outputIn addition to these build options, there are some optional build environment variables for more advanced configurations that can adjust how a build runs. For example, setting CI=true as an environment variable will tailor output for dumb terminals.serveServes the production build of your site for testing prior to deployment. Should be run from the root of your project.Options include:OptionDescription-H, --hostSet host. Defaults to localhost-p, --portSet port. Defaults to 9000-o, --openOpen the site in your default browser for you--prefix-pathsServe site with link paths prefixed (if built with pathPrefix in your gatsby-config file).infoShow helpful environment information which is required in bug reports. Should be run from the root of your project.Options include:OptionDescription-C, --clipboardCopy environment information to your clipboardcleanDelete the .cache and public directories. Should be run from the root of your project.This is useful as a last resort when your local project seems to have issues or content does not seem to be refreshing. Issues this may fix commonly include:Stale data, e.g. this file/resource/etc. isn’t appearingGraphQL error, e.g. this GraphQL resource should be present but is notDependency issues, e.g. invalid version, cryptic errors in console, etc.Plugin issues, e.g. developing a local plugin and changes don’t seem to be taking effectreplOpen a Node.js REPL (interactive shell) with context of your Gatsby environment. Should be run from the root of your project.Gatsby will prompt you to type in commands and explore. When it shows this: gatsby >, you can type in one of these commands to see their values in real time:babelrccomponentsdataPathsgetNodes()nodespagesschemasiteConfigstaticQueriesTo exit the REPL:Press Ctrl+C or Ctrl+D twice, orType .exit and press EnterWhen combined with the GraphQL explorer, these REPL commands could be very helpful for understanding your Gatsby site’s data.Disabling colored outputIn addition to the explicit --no-color option, the CLI respects the presence of the NO_COLOR environment variable (see no-color.org).How to change your default package manager for your next project?When you use gatsby new for the first time to create a new project, you are asked to choose your default package manager between yarn and npm.Once you’ve made your choice, the CLI won’t ask for your preference again for any subsequent project. If you want to change the preference, there are two ways to change the default package manager for your next project:Using options command from CLIEditing the config fileUsing options command from CLIYou can use the gatsby options command to change the default package manager.ArgumentDescriptionkeySet the package manager gatsby new is using. choices: pm, package-managervalueSet the package manager as npm or yarn.To set the default package manager as yarn you’d run:Editing the config fileYou can also manually change the default package manager by editing the config file created automatically by the CLI. This file is available on your system at: ~/.config/gatsby/config.jsonIn it you’re going to see something like this.Edit your packageManager value, save and you’re good to go for your next project using gatsby new..css-x4nqe{border:1px solid var(--theme-ui-colors-purple-20,#f1defa);border-radius:4px;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;font-size:1.125rem;font-weight:bold;padding:2rem 3rem;position:relative;margin:2.5rem 0;max-width:600px;}.css-x4nqe p{margin-bottom:0;}@media (min-width:1000px){.css-x4nqe{line-height:1.75;margin:2.5rem 0;padding:2.8rem 3.5rem;}}.css-1gybm2k{color:var(--theme-ui-colors-text-primary,#36313d);font-weight:normal;margin-bottom:0;}Start building today on Netlify!.css-1azamm{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;position:absolute;bottom:16px;right:0px;-webkit-transform:translateX(15px);-ms-transform:translateX(15px);transform:translateX(15px);color:var(--theme-ui-colors-purple-30,#d9bae8);}.css-km2xne{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;margin-top:3rem;}.css-1od26in{font-si