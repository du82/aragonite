ss-1kvbwpa{color:var(--theme-ui-colors-text-secondary,#78757a);border:0;border-bottom:none;-webkit-transition:all 100ms cubic-bezier(0.4,0,0.2,1);transition:all 100ms cubic-bezier(0.4,0,0.2,1);}.css-1kvbwpa.css-1kvbwpa:hover{color:var(--theme-ui-colors-link-color,#8a4baf);border-bottom:1px solid var(--theme-ui-colors-link-hoverBorder,#8a4baf);}Resources.css-1fspo41{color:var(--theme-ui-colors-text-secondary,#78757a);list-style:none;margin-left:1rem;}Code of conductGatsby newsGet supportEcosystemStyle guideHow to contributeHelp fellow usersContribute documentationContribute codeShare (and build) your experienceHelp triage issuesBenefits of contributing to Open Source.css-11kqk2a{padding-left:1.5rem;padding-right:1.5rem;}.css-11kqk2a a{word-break:break-word;}@media (min-width:1000px){.css-11kqk2a{padding-bottom:1rem;padding-left:2rem;padding-right:2rem;}}@media (min-width:1300px){.css-11kqk2a{max-width:52rem;min-width:0;}}Thanks for being interested in contributing to Gatsby. We’re glad you want to join this community! Open source doesn’t always have the best reputation for being friendly and welcoming, and that makes us sad. Everyone belongs in open source, and Gatsby is dedicated to making you feel welcome.All contributions are welcome, including issues, contributing code, new docs as well as updates and tweaks, blog posts, helping out people, and more. Continue reading to learn what the community can do for you and what you can do for the community. By contributing to open source projects you can connect with people, learn new skills, become a subject-matter expert, and apply all learnings to your own projects.ResourcesCode of conductIn the interest of fostering an open and welcoming environment, we as contributors and maintainers pledge to make participation in our project and our community a harassment-free experience for everyone, regardless of age, body size, disability, ethnicity, gender identity and expression, level of experience, nationality, personal appearance, race, religion, or sexual identity and orientation.Read the full code of conduct.Gatsby newsFollow Gatsby and Gatsby Changelog on TwitterRead and discuss about Request for Comment (RFC) proposalsWatch videos on Gatsby’s YouTube channel to see past GatsbyConf presentations and tutorial walkthroughsFollow the official blogGet supportDiscord Chat: Real time chat with community & team members. Let’s chat!GitHub Discussions: Best place to ask and discuss longer questions about Gatsby and its ecosystem.Feature Requests: Here’s also where you can post your feature requests.GitHub Issues: Have you found a bug or a problem in our documentation? Open an issue!Stack Overflow: Many members of the community use Stack Overflow to ask questions. Read through the existing questions tagged with gatsby or ask your own.EcosystemGatsby User Collective: The Gatsby User collective’s goal is to democratize the maintenance of community plugins to allow more folks to assist in their maintenance and to create higher quality plugins in the Gatsby ecosystem.Style guideRead the Gatsby Style Guide to learn more about contributing to our documentation. These detailed requirements will make it more likely your contribution is accepted with minimal changes.How to contributeWe want contributing to Gatsby to be fun, enjoyable, and educational for anyone and everyone. If you’re interested in participating in the Gatsby community, contributions go far beyond pull requests and commits. We are thrilled to receive a variety of other contributions and as our way of saying “thank you” to our contributors, all contributors are eligible for free Gatsby swag — whether you’re contributing code, docs, a talk, an article, or something else that helps the Gatsby community. Learn how to claim free swag for contributors.Help fellow usersAnswering questions for fellow Gatsby users on Discord or GitHub Discussions are valuable contributions. You can also help out users on issues and Pull Requests to contribute or fix their issues.Contribute documentationYou can help make the docs awesome. We strive to create inclusive, comprehensive, and enjoyable documentation for our users and everyone can help! Found a typo or an incorrect code example? Put up a PR! Found a better way to explain a concept? Put up a PR! Contributions to our documentation are valuable and greatly appreciated. Visit the Docs Contributions Overview to learn more about our style guide, the documentation structure, and how to write docs.Contribute codeContributing bug fixes or new features are the most direct form of contribution you can make. The Gatsby monorepo consists of many interconnected pieces and thus it can be difficult to get started. Read the code contributions guide to learn how to set up the repository locally, how to contribute to the ecosystem, and how to create a Pull Request. Please note that our governance model lays out in what areas of the codebase we accept contributions and which are mostly reserved to core team members.Share (and build) your experienceThere are a few other ways of contributing to the Gatsby ecosystem:Contribute to Gatsby’s blog. Want to write about Gatsby? Read the blog contributions doc to get your blog post onto gatsbyjs.com.Develop learning materials. Strengthen your expertise by writing a blog post, developing a workshop, creating video tutorials, or present your knowledge as a presentation on meetups and conferences.Create a plugin. Learn how to create a plugin and submit it to the Plugin Library.Contribute to the Gatsby User Collective. Interested in working on plugins that benefit the whole community? You can find them in the Gatsby User Collective repository.Create a Gatsby starter. Created a starter? Share it with the community and submit it to the Starter Library.Help triage issuesTriaging an issue means gathering missing information, running the given reproduction, verifying the issue’s validity, and investigating the root cause of the issue. You don’t have to triage an issue with the goal of fixing it (although it would certainly be much appreciated) but sharing the results of your investigation can already save us a ton of time.Benefits of contributing to Open SourceThere are many reasons to contribute to Gatsby and open source software in general. Here are some of the benefits of participating:Growing your community. Working with Gatsby in open source can connect you with people working on similar things. You can get help or give help, and you might even make an IRL acquaintance! It has happened.Improving your skills. When you work on a Gatsby issue or pull request, inevitably you’ll learn more about how something works in the project; either by asking questions and gathering info or by digging deeper into the code yourself. There’s a skill-building benefit to contributing to OSS!Getting free swag! By participating in the repo on GitHub, you can become eligible for free swag that the Gatsby team offers as a way to say thank you. With 5 contributions, you can advance to a second level with even more swag options! Learn more about this sweet swag deal.Becoming an expert. You might start off totally new to a project like Gatsby or React.js, and by building things and opening issues when you encounter a new challenge or a bug, you’ll learn a ton over time. Staying current with your favorite framework through its open source repo can also give you a leading edge on forthcoming changes. Eventually, you could find your knowledge of said project has grown so much that you’ve become an expert. Celebrate by updating your résumé!Speaking at conferences. With those skills you’ve earned yourself working in open source, why not share that knowledge with the world? Web platform conferences the world over are continually looking for speakers and fresh takes on popular topics. Did you build something with Gatsby that you’re excited about? The industry would love to hear from you!There are undoubtedly more benefits than those listed here. Has Gatsby and open source software made your life better somehow? We’d love to hear about it. Reach out to us on Twitter!.css-x4nqe{border:1px solid var(--theme-ui-colors-purple-20,#f1defa);border-radius:4px;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;font-size:1.125rem;font-weight:bold;padding:2rem 3rem;position:relative;margin:2.5rem 0;max-width:600px;}.css-x4nqe p{margin-bottom:0;}@media (min-width:1000px){.css-x4nqe{line-height:1.75;margin:2.5rem 0;padding:2.8rem 3.5rem;}}.css-1gybm2k{color:var(--theme-ui-colors-text-primary,#36313d);font-weight:normal;margin-bottom:0;}Start building today on Netlify!.css-1azamm{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;position:absolute;bottom:16px;right:0px;-webkit-transform:translateX(15px);-ms-transform:translateX(15px);transform:translateX(15px);color:var(--theme-ui-colors-purple-30,#d9bae8);}.css-km2xne{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;margin-top:3rem;}.css-1od26in{font-size:0.875rem;line-height:1;padding-top:0.75rem;padding-bottom:0.75rem;}.css-1od26in.css-1od26in{border:0;color:var(--theme-ui-colors-text-secondary,#78757a);display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;font-weight:400;}.css-1od26in.css-1od26in:hover{color:var(--theme-ui-colors-purple-60,#663399);}.css-9u48bm{margin-right:0.5rem;} Edit this page on GitHub.css-18lcbnd{margin-top:3rem;}.css-1oxhngs{margin-top:3rem;}@media (min-width:550px){.css-1oxhngs{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;-ms-flex-pack:justify;justify-content:space-between;width:100%;}}.css-1oxhngs a{-webkit-text-decoration:none;text-decoration:none;}@media (min-widt