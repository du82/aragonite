description = "Welcome! You don't have to be an expert in a topic to write about it -- this entire website is open source, so even if you make a mistake…"
full_description = '.css-w6bndu{padding-left:1.5rem;padding-right:1.5rem;padding-top:3rem;}.css-4zq9p7{color:var(--theme-ui-colors-text-secondary,#78757a);display:none;font-size:0.875rem;margin-bottom:1.5rem;}@media screen and (min-width:550px){.css-4zq9p7{display:inherit;margin-bottom:2.5rem;}}Home.css-1r9k75x{margin-top:0rem;margin-bottom:0rem;margin-left:0.25rem;margin-right:0.25rem;vertical-align:middle;color:var(--theme-ui-colors-grey-40,#b7b5bd);}ContributingDocs ContributionsGatsby Style Guide.css-1hd94xd{color:var(--theme-ui-colors-text-secondary,#78757a);display:inherit;font-size:0.875rem;margin-bottom:1.5rem;}@media screen and (min-width:550px){.css-1hd94xd{display:none;margin-bottom:2.5rem;}}Docs Contributions.css-8kn4zf{margin-top:0;}Gatsby Style Guide@media (min-width:1300px){.css-jm88mp{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-align-items:flex-start;-webkit-box-align:flex-start;-ms-flex-align:flex-start;align-items:flex-start;}}.css-1y0dukd{min-width:0;padding-left:1.5rem;padding-right:1.5rem;-webkit-order:2;-ms-flex-order:2;order:2;}@media (min-width:1000px){.css-1y0dukd{padding-left:2rem;padding-right:2rem;}}@media (min-width:1300px){.css-1y0dukd{width:18rem;position:-webkit-sticky;position:sticky;top:calc(7rem + 3rem);max-height:calc(100vh - 7rem - 3rem - 3rem);overflow:auto;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;}}.css-1h992as{margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid [object Object];}@media screen and (min-width:1300px){.css-1h992as{margin-bottom:0rem;padding-bottom:0rem;border-bottom:0;}}.css-nx7ts9{color:var(--theme-ui-colors-text-secondary,#78757a);font-size:0.875rem;-webkit-letter-spacing:0.075em;-moz-letter-spacing:0.075em;-ms-letter-spacing:0.075em;letter-spacing:0.075em;margin-top:0rem;text-transform:uppercase;}Table of Contents.css-1ig99e7{list-style:none;margin:0rem;}@media (min-width:1300px){.css-147dsqm{font-size:0.875rem;}}.css-1kvbwpa{-webkit-text-decoration:none;text-decoration:none;}.css-1kvbwpa.css-1kvbwpa{color:var(--theme-ui-colors-text-secondary,#78757a);border:0;border-bottom:none;-webkit-transition:all 100ms cubic-bezier(0.4,0,0.2,1);transition:all 100ms cubic-bezier(0.4,0,0.2,1);}.css-1kvbwpa.css-1kvbwpa:hover{color:var(--theme-ui-colors-link-color,#8a4baf);border-bottom:1px solid var(--theme-ui-colors-link-hoverBorder,#8a4baf);}Welcome!What kinds of docs can I write?Writing process.css-1fspo41{color:var(--theme-ui-colors-text-secondary,#78757a);list-style:none;margin-left:1rem;}Think of your audienceResearchWrite drafts and get feedbackWord choiceUse "you" as the pronounAvoid "easy" and "simple"Avoid emojis, slang, and metaphorsDefine jargonWriting styleWrite conciselyUse clear hyperlinksUse relative hyperlinks for local linksMark localhost URLs as code stringsIndicate when something is optionalAbbreviate termsUse SEO optimized titlesGrammar and formattingFormat titles and headersFormat code blocks, inline code, and imagesCode formatting: Inline codeCode formatting: Type tabCode formatting: TitlesCode formatting: Line highlightinghighlight-line: highlights the current linehighlight-next-line: highlights the next linehighlight-start & highlight-end: highlights a rangeCapitalize proper nounsUse active voiceMake lists clear with the Oxford CommaPrefer US EnglishUse apps that help you editBest practicesReferencing Gatsby CloudSupport software versionsShare best practices whenever possibleDocsDocs audienceDocs purposeDocs tone and styleUse personal "you"Give experts as much relevant info to get the task done as quickly as possibleWhy we chose GitHub for writing and maintaining docs.css-11kqk2a{padding-left:1.5rem;padding-right:1.5rem;}.css-11kqk2a a{word-break:break-word;}@media (min-width:1000px){.css-11kqk2a{padding-bottom:1rem;padding-left:2rem;padding-right:2rem;}}@media (min-width:1300px){.css-11kqk2a{max-width:52rem;min-width:0;}}Welcome!You don’t have to be an expert in a topic to write about it — this entire website is open source, so even if you make a mistake, another contributor will help you correct it before the PR gets merged.Before you begin writing, make sure to read the rest of this style guide.What kinds of docs can I write?Please see the Docs Structure for an overview of the different types of documents, as well as guidelines for how to format them.Writing processThink of your audienceBefore you begin writing, answer these questions. Sample answers have been included:Question: Who will read my writing? Answer: Developers with knowledge and experience coding in HTML, CSS, and JS but not necessarily React or GraphQL.Question: What do I hope my readers will know and/or be able to do after reading it? Answer (example): I hope my readers will be able to successfully add search to their Gatsby site.Once you answer those questions, create an outline of the topic and think about any coding examples you’ll use (if applicable). This helps to organize your thoughts and make the writing process easier.ResearchMany times, the information that needs to go in your document already exists somewhere.Avoid copying and pasting huge chunks of other people’s work. Instead, use their work to learn so you can write your own document. If you do quote someone’s work verbatim, reference where you got the information.If the content is already somewhere else on the site, feel free to copy and paste without quoting or referencing.Possible sources of great research materials:blogposts (on gatsbyjs.com and other sites)docs (on gatsbyjs.com and other sites)video tutorialsDiscord or Twitter conversationssearch engine resultspresentations you or others have giventextbooksdreamsanything else you can think ofWrite drafts and get feedbackTechnical writing, or the literature of science and technology, is difficult because it requires you to take a technical (usually abstract) topic and explain it in a clear, accurate, and objective manner. You’ll likely go through several rounds of proofreading and editing before you’re happy with your writing.Also, there’s a community of contributors to support you. Bounce ideas off of them and ask for input on your writing in the Gatsby Discord and in the GitHub repo.Word choiceUse “you” as the pronounIn English, your articles should use the second person (“you”) to provide a conversational tone. This way, the text and instructions seem to speak directly to the person reading it. Try to avoid using the first person (“I”, “we”, “let’s”, and “us”).For other languages, refer to each translation’s guidelines (if applicable) for consistent phrasing. When appropriate, we suggest starting with the informal “you” to keep a conversational tone.Using “you” in English is also more accurate than saying “we,” because typically only one person is reading the tutorial or guide at a time and the person who wrote the tutorial is not actually going through it with them, so “we” would be inaccurate. You might notice that some technical documentation uses third-person pronouns and nouns like “they” and “the user,” which add more distance and feel colder than the conversational and warm “you” and “your.”When updating a doc to adhere to this part of the Gatsby Style Guide, one exception in English is when “we” refers to Gatsby’s core processes. The subject is the code in this case, rather than a teacher/reader connotation, and should be rewritten or restructured to not confuse the reader about what they are responsible for doing when something is happening automatically behind the scenes.Avoid “easy” and “simple”Avoid using words like “easy”, “simple” and “basic” because if users have a hard time completing the task that is supposedly “easy,” they will question their abilities. Consider using more specific descriptors; for example, when you say the phrase “deployment is easy,” what do you really mean? Is it easy because it takes fewer steps than another option? If so, use the most specific descriptor possible, which in that case would be “this deployment method involves fewer steps than other options.”For even more inclusive docs, avoid phrases that assume a reader’s experience or skill level, like “just deploy it and you’re done” or “for a refresher (referring to a completely different doc that someone may not have read)“. Often, rephrasing results in stronger sentences that appeal to a wider range of contexts.Avoid emojis, slang, and metaphorsAvoid using emojis or emoticons in the Docs and idiomatic expressions / slang, or metaphors. Gatsby has a global community, and the cultural meaning of an emoji, emoticon, or slang may be different around the world. Use your best judgment! Also, emojis can render differently on different systems.Define jargonArticles should be written with short, clear sentences, and use as little jargon as necessary.Jargon: (n.) special words or expressions that are used by a particular profession or group and are difficult for others to understand: legal jargon.All jargon should be defined immediately in plain English. In other words, pretend like your readers have basic coding experience but not necessarily experience with PWAs and the JAMstack (see what happened there? I just used two jargon words that need to be defined); you need to define words that newcomers might have a hard time understanding.Writing styleWrite conciselyConcise writing communicates the bare minimum without redundancy. Strive to make your writing as short as possible; this practice will often lead to more accurate and specific writing.Use clear hyperlinksHyperlinks should contain the clearest words to indicate where the link will lead you. The use of the title attribute on hyperlinks should be avoided for accessibility reasons.In tutorials that are meant for beginners, use as few hyperlinks as possible to minimize distractions. In docs, it’s ok to include as many hyperlinks as necessary to provide relevant and interesting information and resources.Use relative hyperlinks for local linksWhen referencing another page within gatsbyjs.com hyperlinks should use relative paths (not include the full domain). This guarantees that all links function when running locally or in preview.Mark localhost URLs as code stringsUnless you’re running gatsby develop or gatsby build locally, localhost links will not work. Therefore it’s recommended to list these URL references as code blocks so there aren’t invalid links throughout the docs.Indicate when something is optionalWhen a paragraph or sentence offers an optional path, the beginning of the first sentence should indicate that it’s optional. For example, “if you’d like to learn more about xyz, see our reference guide” is clearer than “Go to the reference guide if you’d like to learn more about xyz.”This method allows people who would not like to learn more about xyz to stop reading the sentence as early as possible. This method also allows people who would like to learn more about xyz to recognize the opportunity to learn quicker instead of accidentally skipping over the paragraph.Abbreviate termsIf you want to abbreviate a term in your article, write it out fully first, then put the abbreviation in parentheses. After that, you may use the abbreviation going for the rest of the article. For example, “In computer science, an abstract syntax tree (AST) is …”Use SEO optimized titlesThis explains how to account for Search Engine Optimization (SEO) and create a doc that shows up in search engines like Google or Bing.When you create the new guide or tutorial under /docs/, you’ll either create a file or a folder if there will be images pulled into the doc.File: querying-data-with-graphql.mdorFolder: querying-data-with-graphql querying-data-with-graphql/index.md querying-data-with-graphql/graphql-image.pngThe .md title or the folder title gets turned into the URL route automatically.Article titles should be short and reflect the main theme of the article to help readers quickly find relevant info. Many people use a search engine to find topics like “gatsby GraphQL”, so the article title should ideally reflect common search terms.Here are some title examples:Creating & Modifying PagesAdding a 404 PageQuerying Data with GraphQLThe folder name is used in the URL, so only use dashes -, numbers 0-9, and lowercase letters a-z for it.Here are some folder name examples:creating-and-modifying-pagesadding-a-404-pagequerying-data-with-graphqlNote: Just to clarify, you can include special characters in the article title but not in the .md file name or folder name (e.g. title: What is GraphQL? and Folder Name: what-is-graphql).Grammar and formattingFormat titles and headersTitle case article titles (each major word is uppercase). Sentence case article headings (only the initial word is uppercase). Neither need punctuation at the end of the phrase unless a question mark is required. Article titles do not take the Oxford comma and use the ampersand in place of “and.” Article headings do take the Oxford comma and use the word “and.”Titles are automatically formatted as h1. Mark up article headings as h2 and subheads as h3 or h4 as needed. Most article headings are conceptually and rhetorically at the same level as each other; avoid unnecessary complexity and mark them up as h2 unless they’re true subheads.Article title or document title:Salty, Sweet & SpicyArticle header or subhead:Salty, sweet, and spicyTitles should aim to be brief while still conveying a comprehensive meaning of the article; headings have more leeway in terms of length. Because titles show up throughout the docs in navigation elements (like breadcrumbs, and sidebar navigation) there is a preference for shorter names to help mitigate visual clutter.Format code blocks, inline code, and imagesUse the following as reference when creating and editing docs:formatting inline code and code blocksadding images to articles. If the images aren’t already hosted somewhere else on the web, you’ll need to put them online yourself. A good way to do this is to commit them to a GitHub repository of your own, then push them to GitHub. Then you can right-click the image and copy its image source. And don’t forget image alt text for accessibility! For help with crafting efficient screen reader text, refer to the W3C’s alt decision tree.header formatting. Avoid using H1 header; that is reserved for the title of each document.Code formatting: Inline codeEnsure that variables, component names, function names, and packages that appear inline are escaped with backticks:Code formatting: Type tabEach code snippet will include a tab showing the language type the snippet contains. For example, the following YAML snippet will show a “YAML” tab……like so:Please use the following language keywords where appropriate:javascript or jsjsxgraphqlhtmlcssshellyamlmarkdowndiffflowIf a language keyword is omitted, the type will show as TEXT (as shown above).Code formatting: TitlesWhere appropriate, add code titles to your code blocks. Switching between multiple files in the course'
