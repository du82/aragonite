n:none;}.css-1kvbwpa.css-1kvbwpa{color:var(--theme-ui-colors-text-secondary,#78757a);border:0;border-bottom:none;-webkit-transition:all 100ms cubic-bezier(0.4,0,0.2,1);transition:all 100ms cubic-bezier(0.4,0,0.2,1);}.css-1kvbwpa.css-1kvbwpa:hover{color:var(--theme-ui-colors-link-color,#8a4baf);border-bottom:1px solid var(--theme-ui-colors-link-hoverBorder,#8a4baf);}Blog proposal submission processContent guidelines for submitting a blog post proposal.css-11kqk2a{padding-left:1.5rem;padding-right:1.5rem;}.css-11kqk2a a{word-break:break-word;}@media (min-width:1000px){.css-11kqk2a{padding-bottom:1rem;padding-left:2rem;padding-right:2rem;}}@media (min-width:1300px){.css-11kqk2a{max-width:52rem;min-width:0;}}Blog posts are a great way to share your own experiences working with Gatsby at work or on a personal project.If you’d like to contribute a post to the Gatsby blog, please review the process and guidelines outlined below and submit your post idea using the Gatsby blog proposal form.Blog proposal submission processComplete and submit the Gatsby blog proposal form.A Gatsby team member will review your proposal and let you know if the proposal has been accepted within the next week or so.If the post is accepted: A Gatsby team member will work with you on a timeline for submitting and reviewing a draft of your blog post and set a tentative publishing date.If the post is not accepted: We’ll let you know if there are any alternative offers we can make (e.g. offer to retweet if you publish the piece elsewhere, suggest submitting it as an addition to a Gatsby doc, etc.). We’ll also do our best to explain why your proposal was not accepted and encourage you to revise your proposal based on that feedback and resubmit. Please don’t be discouraged from submitting another post in the future!If you have any questions about the process or your submission, please email marketing@gatsbyjs.com.Content guidelines for submitting a blog post proposalAs a Gatsby community member, you have unique insight into the ins and outs of learning Gatsby, building with Gatsby, and contributing to Gatsby’s open source community. Contributing to the Gatsby blog is a great way to share your experiences and insights. Here are some guidelines for what kind of content is and isn’t a good fit for the Gatsby blog.Things we’re looking for in Gatsby blog content:Information to help others overcome challenges you’ve faced while working with GatsbyStories about how Gatsby helped you overcome different challenges on work and personal projectsShowcasing a tool, fix, or other content you or someone else have contributed to Gatsby’s open source communityShowcasing a tool, fix, or other content someone else has contributed to Gatsby’s open source communityClear and thoughtful explanations of technical details or complex concepts related to React, GraphQL, web and application development, open-source contribution, Gatsby core, and other Gatsby-adjacent subject matterGuidance and resources for learning React, GraphQL, HTML/CSS, web development, best practices, accessibility, SEO, Gatsby, different tool and CMS integrations, and other Gatsby-adjacent subject matter.Other topics that you think would be valuable to people learning about or working with GatsbyThings we’d like to avoid on the Gatsby blog:Docs content. Some content is better found in the Gatsby docs guides and tutorials, as it can be found in a section for related content and not buried under pages of other paginated blog posts.Promotional content. Please don’t submit content to the Gatsby blog solely for the purpose of promoting a product, yourself, or link-building.Here’s what you can do instead: If you have a product or project you want to share on the Gatsby blog, focus on practical information, and make sure there’s a clear relationship with Gatsby or Gatsby-adjacent topics. You could write a step-by-step guide to using your product with Gatsby. You could write a case study highlighting the direct impact Gatsby had on your awesome project and offer helpful tips for others to recreate your success.Content that doesn’t seem to have a clear benefit for Gatsby users and/or the Gatsby community. For example, if you’re writing about a use-case or integration that’s extremely niche or unique to specific conditions that are really uncommon outside of your organization, the Gatsby blog might not be the best place for your content. Likewise, if your blog post doesn’t seem to have any direct relationship with Gatsby (or an interesting indirect relationship with Gatsby), then it may be more appropriate for a personal blog or another community blog.Please note that these are guidelines, not rules. If you think your blog post belongs on the Gatsby blog, we absolutely encourage you to submit it. While we reserve the right to decide what is and isn’t appropriate for the Gatsby blog, we also value and encourage your creativity and your contributions..css-x4nqe{border:1px solid var(--theme-ui-colors-purple-20,#f1defa);border-radius:4px;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;font-size:1.125rem;font-weight:bold;padding:2rem 3rem;position:relative;margin:2.5rem 0;max-width:600px;}.css-x4nqe p{margin-bottom:0;}@media (min-width:1000px){.css-x4nqe{line-height:1.75;margin:2.5rem 0;padding:2.8rem 3.5rem;}}.css-1gybm2k{color:var(--theme-ui-colors-text-primary,#36313d);font-weight:normal;margin-bottom:0;}Start building today on Netlify!.css-1azamm{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;position:absolute;bottom:16px;right:0px;-webkit-transform:translateX(15px);-ms-transform:translateX(15px);transform:translateX(15px);color:var(--theme-ui-colors-purple-30,#d9bae8);}.css-km2xne{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items