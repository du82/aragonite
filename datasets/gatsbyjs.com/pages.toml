pg&amp;a=w%3D48%26h%3D48%26fm%3Djpg%26q%3D75&amp;cd=ddfe67a29cd1e9d5782a7d666e05695d 1x,/_gatsby/image/00a3b13a2b2381649cfc5e37ec463aa9/02214870a2ef35459e6e68ef6d8c8d93/me-in-wales-square-2200x2200-1.jpg?u=https%3A%2F%2Fgatsbycontent.wpengine.com%2Fwp-content%2Fuploads%2F2023%2F08%2Fme-in-wales-square-2200x2200-1.jpg&amp;a=w%3D96%26h%3D96%26fm%3Djpg%26q%3D75&amp;cd=ddfe67a29cd1e9d5782a7d666e05695d 2x" alt="Marc Littlemore"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}.css-11qjisw{-webkit-flex:1 1 auto;-ms-flex:1 1 auto;flex:1 1 auto;}.css-19brxl7{color:var(--theme-ui-colors-gatsby,#663399);display:inline-block;font-size:1rem;font-weight:700;line-height:1.25;-webkit-text-decoration:none;text-decoration:none;}@media (min-width:1000px){.css-19brxl7{margin-top:0.25rem;}}Marc Littlemore.css-tp9qd0{color:var(--theme-ui-colors-text-secondary,#78757a);line-height:1.25;margin-top:0.125rem;}August 24th, 2023.css-9vi1nb{position:relative;grid-column:1;min-width:0;padding-top:2rem;}.css-9vi1nb .gatsby-resp-iframe-wrapper{height:0;overflow:hidden;padding-bottom:56.25%;position:relative;width:100%;}.css-9vi1nb .gatsby-resp-iframe-wrapper iframe{height:100%;left:0;position:absolute;top:0;width:100%;}.css-9vi1nb .gatsby-embed-twitter{max-height:1000px;overflow-y:auto;}.css-ds482h{margin-bottom:1.25rem;padding-top:1.25rem;}In the beginning, Gatsby was just a Static Site Generation but now it’s a Reactive Site Generator that offers features like Deferred Static Generation, Server-Side Rendering, or serverless functions. These additional features require more glue code on deployment platforms and for self-hosting Gatsby. In the past, plugins had to work around missing features or reach into Gatsby’s internals. Luckily, these problems are now in the past as today we’re happy to introduce Gatsby Adapters! Adapters are responsible for taking the production output from Gatsby and turning it into something your deployment platform understands. We want to make it easier to deploy and host Gatsby on your preferred platform and Gatsby Adapters are a huge step towards that goal. But there’s still lots more to do. As Netlify’s Director of Engineering, Claire Knight, wrote in Taking Gatsby to New Heights: Embracing Adaptability and Openness we want to give you the power of Adapters, enabling seamless integrations between Gatsby and other platforms. Update gatsby to 5.12.0 (e.g. by running npm install gatsby@latest) and you can use and write Gatsby Adapters. Getting started By default, Gatsby will have a manifest of popular adapters it’ll reference during a build. This enables zero-configuration deployments on those deployment platforms. For these zero-configuration deployments, no manual user interaction is needed (e.g. no installation/usage of an “auto” package). For example, on Netlify gatsby will automatically install gatsby-adapter-netlify. You can manually install it inside your dependencies if you want to skip the auto-install on each build. The adapter will then set up everything needed to host Gatsby on Netlify. If you want to use an adapter that is not part of Gatsby’s manifest, you can install it into your dependencies and add it to your gatsby-config like so: .css-1vz4958{margin-bottom:-1.25rem;margin-top:-1.25rem;}As part of the work on Gatsby Adapters, you’re now also able to define custom HTTP headers inside gatsby-config: Gatsby passes all the required information during the build to Adapters to prepare these outputs for deployment on a specific platform. Here are some of the actions an Adapter automatically takes: Applies HTTP headers to assets Applies redirects and rewrites. The adapter can also create its own redirects or rewrites if necessary, for example, to map serverless functions to internal URLs. Wraps serverless functions coming from Gatsby with platform-specific code (if necessary). Gatsby will produce Express-like handlers. Apply trailing slash behavior and path prefix to URLs Possibly uploads assets to CDN Learn more Gatsby Adapters are a great addition to the framework and a powerful feature. We have prepared a couple of new documentation pages for you to explain Gatsby Adapters in-depth. Check out these resources: Adapters Overview: Learn how to find and use adapters. Zero-Configuration Deployments: List of supported deployment platforms and how you can configure their adapters. Creating an Adapter: You can build your own! Start to finish guide on how to create and publish an adapter. HTTP Headers: As part of the Gatsby Adapters work you can now also specify HTTP headers for a given path. Also, check out the source code for gatsby-adapter-netlify and the initial RFC to see what a fully-featured adapter can look like and how the feature came to be. What’s next for the Gatsby ecosystem? Gatsby Adapters are just part of our vision for the Gatsby framework to have a great future not just at Netlify, but also out in the wider world of web development. We have lots more that we’re eager to bring to life, some of which are designed to make not just Gatsby, but other frameworks more powerful and efficient on Netlify. As we balance our work across the Gatsby framework and other parts of its platform and ecosystem and reinforce its future, rest assured that as a vital tool for so many business and organisations, Gatsby’s health and prosperity is important to us, and we’re excited about it. .css-kv66jr{position:relative;padding-top:0;