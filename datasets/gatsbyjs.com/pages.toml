on:none;text-decoration:none;}.css-1kvbwpa.css-1kvbwpa{color:var(--theme-ui-colors-text-secondary,#78757a);border:0;border-bottom:none;-webkit-transition:all 100ms cubic-bezier(0.4,0,0.2,1);transition:all 100ms cubic-bezier(0.4,0,0.2,1);}.css-1kvbwpa.css-1kvbwpa:hover{color:var(--theme-ui-colors-link-color,#8a4baf);border-bottom:1px solid var(--theme-ui-colors-link-hoverBorder,#8a4baf);}Our PledgeOur StandardsOur ResponsibilitiesScopeEnforcementAttribution.css-11kqk2a{padding-left:1.5rem;padding-right:1.5rem;}.css-11kqk2a a{word-break:break-word;}@media (min-width:1000px){.css-11kqk2a{padding-bottom:1rem;padding-left:2rem;padding-right:2rem;}}@media (min-width:1300px){.css-11kqk2a{max-width:52rem;min-width:0;}}Our PledgeIn the interest of fostering an open and welcoming environment, we as contributors and maintainers pledge to making participation in our project and our community a harassment-free experience for everyone, regardless of age, body size, disability, ethnicity, gender identity and expression, level of experience, nationality, personal appearance, race, religion, or sexual identity and orientation.Our StandardsExamples of behavior that contributes to creating a positive environment include:Using welcoming and inclusive languageBeing respectful of differing viewpoints and experiencesGracefully accepting constructive criticismFocusing on what is best for the communityShowing empathy towards other community membersExamples of unacceptable behavior by participants include:The use of sexualized language or imagery and unwelcome sexual attention or advancesTrolling, insulting/derogatory comments, and personal or political attacksPublic or private harassmentPublishing others’ private information, such as a physical or electronic address, without explicit permissionOther conduct which could reasonably be considered inappropriate in a professional settingOur ResponsibilitiesProject maintainers are responsible for clarifying the standards of acceptable behavior and are expected to take appropriate and fair corrective action in response to any instances of unacceptable behavior.Project maintainers have the right and responsibility to remove, edit, or reject comments, commits, code, wiki edits, issues, and other contributions that are not aligned with this code of conduct, or to ban temporarily or permanently any contributor for other behaviors that they deem inappropriate, divisive, threatening, offensive, or harmful.ScopeThis Code of Conduct applies both within project spaces and in public spaces when an individual is representing the project or its community. Examples of representing a project or community include using an official project e-mail address, posting via an official social media account, or acting as an appointed representative at an online or offline event. Representation of a project may be further defined and clarified by project maintainers.EnforcementInstances of abusive, harassing, or otherwise unacceptable behavior may be reported by contacting the project team at conduct@gatsbyjs.com. All complaints will be reviewed and investigated and will result in a response that is deemed necessary and appropriate to the circumstances. The project team is obligated to maintain confidentiality with regard to the reporter of an incident. Further details of specific enforcement policies may be posted separately.Project maintainers who do not follow or enforce the Code of Conduct in good faith may face temporary or permanent repercussions as determined by other members of the project’s leadership.When faced with repeated bad faith comments or harassment after an earnest attempt to mediate an issue, the Gatsby team reserves the right to remove someone from the GitHub repository and/or block them on social media. This decision will always be made with consensus from more than one team member.AttributionThis Code of Conduct is adapted from the Contributor Covenant, version 1.4..css-x4nqe{border:1px solid var(--theme-ui-co