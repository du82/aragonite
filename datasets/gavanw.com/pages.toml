full_description = '''Procedural Voxel Landscape 1/3/2012 55 Comments So, I have decided to use polygons (!) but only to render the quasi-voxels - its just easier and faster than messing with ray-traced volumes. Also dumped QT -- too bloaty for my needs; just using barebones (cross-platform) libraries. Here is a shot of a landscape and another two shots with just lighting (click for enlarged version). This uses Simplex Noise, Voronoi Noise, and just Plain Old Noise (TM). Also features ambient occlusion and shadows, on a per-voxel-thing basis. Also loads a virtually infinite landscape over time. Last but not least, I just added in multithreading - it maxes out every core, and I must say performance just skyrocketed after that (partly due to the fact that processing chunks no longer blocks the main thread). I wrote it in a few days. Uh, yeah it looks like a crappy version of Minecraft, you want to fight about it? 55 Comments person 7/9/2013 01:20:17 am these pictures look cool. what do you mean by quasi-voxels though? Are you using both raycasting and ordinary polygon stuff? Reply Gavan Woolery link 7/9/2013 01:58:11 am By "quasi-voxels" I meant that the voxels here were leaning towards what some people call "boxels" -- textured boxes. If you look closely you can see that one unit/box/voxel contains several pixels. Normally a voxel would have a single color (like a pixel). Reply person 8/10/2013 11:10:58 pm alright! It looks very pretty. do you use some library for multithreading? Reply Gavan Woolery 8/10/2013 11:13:41 pm The old version (pictured here) used posix threads. The new version uses Poco's built-in threading (a cross-platform networking library). essay writing service link 11/24/2013 04:07:50 pm Some highly recommended blogs which have top quality features and setting are the most amazing place to posts educational comments and links. Thanks for reading and spending some time on that blogs. Reply essay writing online link 7/31/2014 06:36:34 pm Some blogs wh