title = "GUI, Optimizations, etc. - Gavan Woolery"
description = "Just a quick update...mostly have been busy with work but in the free hours I've managed to get a lot done, even though visually it may not seem like it. I rebuilt almost the entire engine.  It is..."
full_description = '''GUI, Optimizations, etc. 2/17/2012 2 Comments Just a quick update...mostly have been busy with work but in the free hours I've managed to get a lot done, even though visually it may not seem like it.I rebuilt almost the entire engine. It is much cleaner, less code, better organized. No copy-paste code. The same routine handles all chunk generation and scheduling. Multithreading works a lot better now - rather than redundantly processing chunk edges, it synchronizes the chunk processing. Noncoindentially, I seemed to have completely eliminated the crashes I encountered every so often. (Word to the wise: do not try and use C++ vectors inside a thread, even if each one is exclusive to its own thread.) I also implemented better mipmap generation and handling. Overall, rendering performance is up 2-10 times faster depending on settings, and chunk generation is (as promised!) over 100 times faster, although there is still much room for improvement (particularly in terms of choosing visible chunks to render). But for now, I am very happy with performance and probably won't optimize it much more for the time being.I wrote my own GUI and text-render from the ground up. It can render without shader state changes, meaning it can all be compiled into a single display list. It is generated almost entirely on the GPU (text is read from a bitmap though). It uses uniform spacing and character widths, intentionally (all part of the old-school look :D). Still in the early stages but here is a screen shot (characters have backgrounds just for the hell of it, but can easily be disabled).Overall, I am very happy with the progress made, the engine feels much cleaner, faster, and stable. 2 Comments cheap paper writing link 11/5/2013 10:15:16 pm Some major points will be discuss during the selection of right person for that huge work. Students wants perfect guess papers for their exams and for that purpose some talented people required to maintain the quality of product. Reply Affair Massachusetts link 11/28/2022 11:20:29 am Hi niice reading your post Reply Leave a Reply. Interesting Games, Sites, and ProjectsAtomontage0 fpsVoxatronKing Arthur's GoldMinecraftDwarf FortressBraidMysterious CastleThe Humble Indie Bundle(s)Project ZomboidRetro City RampageStar CommandProc WorldVolumes of FunBig Bad WoflTom DobrowolskiKen SilvermanInigo QuilezMoving BlocksCodeFlowMerlin3DSea of MemesTwenty SidedTwitter Me: @gavanwFacebook Me: gavanwInsult Me: (sorry, no link) RSS Feed var GoSquared = {}; GoSquared.acct = "GSN-810421-T"; (function(w){ function gs(){ w._gstc_lt = +new Date; var d = document, g = d.createElement("script"); g.type = "text/javascript"; g.src = "//d1l6p2sc9645hc.cloudfront.net/tracker.js"; var s = d.getElementsByTagName("script")[0]; s.parentNode.insertBefore(g, s); } w.addEventListener ? w.addEventListener("load", gs, false) : w.attachEvent("onload", gs); })(window);'''
