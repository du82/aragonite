full_description = '''Quick Update 2/16/2013 4 Comments I've updated my site a little bit with a screenshots and videos section, containing most of my (game-related) work over the past decade from various projects and clients. I've added some screenshots from my engine from a few months ago. I have added in isometric rendering and now all generation is done on the GPU, meaning it goes way faster (can generate billions of voxels in a few seconds) -- screenshot below. Also, I'm building up a site for my new game, appropriately called Voxel Quest. More details to come when I get a break from work! Not the "really cool" update I was hoping to provide (which is not really that cool, just some stuff I was hoping to get out for the new terrain engine). 4 Comments Big Bad Wofl link 2/21/2013 01:19:18 pm I've told you this before, but this looks amazing. Looking forward to your next post and I hope that your RL job calms down a bit so we can see updates more often ;) Reply online custom writing link 12/16/2014 05:38:12 pm Only top class and verified companies allows their all users to share comments and read all reviews. This is most easy but authentic way to check product quality and standard. First check essay sites review and then start working on that kind of stuff. Share this on social media and post unique comments about that. Reply Theresa C link 7/19/2021 11:02:09 am Appreciate your bloog post Reply online dissertation tutoring link 8/9/2022 11:41:33 pm you are updating your website I want to update my college study which is I contacting of online dissertation tutoring service I hope It is suitable for my work which I want to changes because I have such an old way. Reply Leave a Reply. Interesting Games, Sites, and ProjectsAtomontage0 fpsVoxatronKing Arthur's GoldMinecraftDwarf FortressBraidMysterious CastleThe Humble Indie Bundle(s)Project ZomboidRetro City RampageStar CommandProc WorldVolumes of FunBig Bad WoflTom DobrowolskiKen SilvermanInigo QuilezMoving BlocksCo