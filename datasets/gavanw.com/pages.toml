full_description = '''Voxel Quest (.com) Making Headway 3/5/2013 5 Comments The Voxel Quest website is slowly coming to life, give it a look. I have posted a fair amount of info about the game in the "about" section. I have also attached a screenshot of the current hex layout and perspective below: 5 Comments Big Bad Wofl link 3/4/2013 08:07:56 pm Am I missing something? I just see a photo and a short bit of text in the 'about' section. Reply Big Bad Wofl link 3/4/2013 08:08:38 pm You can just go ahead and ignore that. Silly me. Reply Gavan Woolery 3/4/2013 08:39:04 pm Hehe, yeah just updating the website right now -- in a few days I will have the new terrain generation stuff in probably, which is mostly related to hydraulic erosion (rivers), and the new hex-based terrain. Chris link 3/13/2013 10:36:55 pm So...why hexes? To me it just makes the maps look so unnatural. I mean wth you can't even go North or South?! :P But seriously, why hexes? Looking forward to seeing where you're headed with the VQ thing. Take care. Reply Gavan Woolery 3/14/2013 02:28:43 am Hi Chris, Hexes will be used to layout the overworld map, which mainly includes macroscopic features like average terrain height, placement of rivers, roads, towns, walls, etc. The reason for this is that it avoids the artifacts associated with a cartesian (up,down,left,right) layout. I am still debating several options, including adding an additional vertical division to the hexes so that walls and other structures can be placed in 8 directions, or potentially have every hex face divided which would be 12 directions. In addition, it is not strictly hexes, but subdivided hexes - meaning its really a set of triangles where each hex is 6 triangles. Despite whatever qualms I and others might have with hexes, I think that it won't make a huge difference in terms of the overall game (hopefully) whatever layout I use. I have attached a screenshot to this post of the hex layout as it currently is with bird's eye perspective. Reply Leave a Reply. Interesting Games, Sites, and ProjectsAtomontage0 fpsVoxatronKing Arthur's GoldMinecraftDwarf FortressBraidMysterious CastleThe Humble Indie Bundle(s)Project ZomboidRetro City RampageStar CommandProc WorldVolumes of FunBig Bad WoflTom DobrowolskiKen SilvermanInigo QuilezMoving BlocksCodeFlowMerlin3DSea of MemesTwenty SidedTwitter Me: @gavanwFacebook Me: gavanwInsult Me: (sorry, no link) RSS Feed var GoSquared = {}; GoSquared.acct = "GSN-810421-T"; (function(w){ function gs(){ w._gstc_lt = +new Date; var d = document, g = d.createElement("script"); g.type = "text/javascript"; g.src = "//d1l6p2sc9645hc.cloudfront.net/tracker.js"; var s = d.getElementsByTagName("script")[0]; s.parentNode.insertBefore(g, s); } w.addEventListener ? w.addEventListener("load", gs, false) : w.attachEvent("onload", gs); })(window);'''
