["https://gavinray97.github.io/blog/postgres-wire-protocol-jdk-21"]
title = "Building a PostgreSQL Wire Protocol Server using Vanilla, Modern Java 21"
description = "A dual-purpose tutorial to 1) Demonstrate how to implement the Simple Query Protocol, where Java is an implementation detail; 2) Show practical examples of most of the new features since JDK 17, including Records, Sealed Types, Pattern Matching for Switch, Virtual Threads, and Panama Foreign-Function & Memory API."
full_description = '''Published onMonday, January 16, 2023Building a PostgreSQL Wire Protocol Server using Vanilla, Modern Java 21AuthorsNameGavin RayTwitter@GavinRayDevTable of ContentsOutlineIntroduction to the PostgreSQL Wire ProtocolStep 1: Doing The Simplest Thing That Could Possibly Work (TM)Step 1.1 - Initial Server SkeletonConnecting to the Server with psqlStep 1.2 - Responding to the SSL Negotiation message and the Startup MessageStep 1.3 - Differentiating between the SSL/Authentication request, and Command messagesStep 1.4 - Handle a query and return data rowsStep 2: RefactoringRefactoring into Sealed Interfaces with Records and Message Decoders (Pt 1. Client Side)Refactoring into Sealed Interfaces with Records and Message Decoders (Pt 2. Server Side)This tutorial is meant to serve as a dual purpose guide:Demonstrate how to implement the Simple Query Protocol, where Java is an implementation detailShow practical examples of most of the new features since JDK 17, including:Records (JEP 395)Sealed Types (JEP 360/JEP 409)Pattern Matching for Switch (JEP 406)Virtual Threads aka Project Loom (JEP 425)Foreign-Function & Memory API (FMM) aka Project Panama (JEP 424)(Also give a practical example of java.nio's AsynchronousChannelGroup and AsynchronousServerSocketChannel, for which there are few examples online)OutlineThis tutorial will be broken up into a series of 2 parts:Because we are diligent coders who know to Do The Simplest Thing That Could Possibly Work™, our first step will be an horrifically ugly, but functional, implementation of the PostgreSQL wire protocol server.Then, we will refactor our code to be more readable and maintainable.Introduction to the PostgreSQL Wire ProtocolThe PostgreSQL wire protocol is a binary protocol that is used to communicate between a PostgreSQL client and server.The protocol is documented in the PostgreSQL Protocol Documentation.In my opinion, this documentation is not the most understandable. If you want to learn more about the protocol, I recommend the following presentation:https://beta.pgcon.org/2014/schedule/attachments/330_postgres-for-the-wire.pdfhttps://www.youtube.com/watch?v=qa22SouCr5EWhat we're concerned with today, is primarily the following pieces of information:Postgres clients send two types of message to the server: Startup Messages and CommandsOptionally, the Startup message can be preceded by an SSL Negotiation message, where the client asks the server if it supports SSLVisualized as a Mermaid diagram:There are many types of commands, but today we'll only be concerned with the Query command, which is used to execute a SQL query.Knowing this, we can now start implementing our server.Step 1: Doing The Simplest Thing That Could Possibly Work (TM)We'll begin by implementing a basic java.nio.channels.AsynchronousServerSocketChannel server, which will accept connections and print out the messages it receives:Step 1.1 - Initial Server SkeletonBelow is the initial skeleton of our server.We create a java.nio.channels.AsynchronousServerSocketChannel and bind it to localhost and the default Postgres port (5432).An ExecutorService is created, which will be used to create a java.nio.channels.AsynchronousChannelGroup for our server.We use the newVirtualThreadPerTaskExecutor method, which will create a new Loom Virtual Thread for the server thread pool.Then, we accept connections and print out the messages we receive.package postgres.wire.protocol; import java.net.InetSocketAddress; import java.nio.ByteBuffer; import java.nio.channels.AsynchronousChannelGroup; import java.nio.channels.AsynchronousServerSocketChannel; import java.nio.channels.AsynchronousSocketChannel; import java.nio.channels.CompletionHandler; import java.util.concurrent.ExecutorService; import java.util.concurrent.Executors; import java.util.concurrent.Future; class AsynchronousSocketServer { private static final String HOST = "localhost"; private static final int PORT = 5432; public static void main(String[] args) throws Exception { ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor(); AsynchronousChannelGroup group = AsynchronousChannelGroup.withThreadPool(executor); try (AsynchronousServerSocketChannel server = AsynchronousServerSocketChannel.open(group)) { server.bind(new InetSocketAddress(HOST, PORT)); System.out.println("[SERVER] Listening on " + HOST + ":" + PORT); for (;;) { Future<AsynchronousSocketChannel> future = server.accept(); AsynchronousSocketChannel client = future.get(); System.out.println("[SERVER] Accepted connection from " + client.getRemoteAddress()); ByteBuffer buffer = ByteBuffer.allocate(1024); client.read(buffer, buffer, new CompletionHandler<>() { @Override public void completed(Integer result, ByteBuffer attachment) { attachment.flip(); if (result != -1) { onMessageReceived(client, attachment); } attachment.clear(); client.read(attachment, attachment, this); } @Override public void failed(Throwable exc, ByteBuffer attachment) { System.err.println("[SERVER] Failed to read from client: " + exc); exc.printStackTrace(); } }); } } } private static void onMessageReceived(AsynchronousSocketChannel client, ByteBuffer buffer) { System.out.println("[SERVER] Received message from client: " + client); System.out.println("[SERVER] Buffer: " + buffer); } } class MainSimplest { public static void main(String[] args) throws Exception { AsynchronousSocketServer.main(args); } } If we start this up, we should see:Running Gradle on WSL... > Task :app:compileJava > Task :app:processResources NO-SOURCE Note: Some input files use preview features of Java SE 21. Note: Recompile with -Xlint:preview for details. > Task :app:classes > Task :app:MainSimplestWalkThrough.main() [SERVER] Listening on localhost:5432 Connecting to the Server with psqlNow, we can connect to our server using psql:$ psql -h localhost -p 5432 -U postgres We should see psql hang at the prompt, and the server should print out the following:[SERVER] Accepted connection from /127.0.0.1:41826 [SERVER] Received message from client: sun.nio.ch.UnixAsynchronousSocketChannelImpl[connected local=/127.0.0.1:5432 remote=/127.0.0.1:41826] [SERVER] Buffer: java.nio.HeapByteBuffer[pos=0 lim=8 cap=1024] Great! We're now able to receive messages from the client.Step 1.2 - Responding to the SSL Negotiation message and the Startup MessageWhat we want to do is just make sure that we're able to receive messages from the client, and respond to the:Initial SSL Negotiation message with a 'N' byte (for No)Startup Message with an AuthenticationOk messageFinally, we'll write a:BackendKeyData message, which is used to identify the connection to the clientReadyForQuery message, which indicates that the server is ready to accept commands.Below is the updated code: private static void onMessageReceived(AsynchronousSocketChannel client, ByteBuffer buffer) { System.out.println("[SERVER] Received message from client: " + client); System.out.println("[SERVER] Buffer: " + buffer); // First, write 'N' for SSL negotiation ByteBuffer response = ByteBuffer.allocate(1); response.put((byte) 'N'); response.flip(); Future<Integer> writeResult = client.write(response); // Then, write AuthenticationOk ByteBuffer authOk = ByteBuffer.allocate(9); authOk.put((byte) 'R'); // 'R' for AuthenticationOk authOk.putInt(8); // Length authOk.putInt(0); // AuthenticationOk authOk.flip(); writeResult = client.write(authOk); // Then, write BackendKeyData ByteBuffer backendKeyData = ByteBuffer.allocate(17); backendKeyData.put((byte) 'K'); // Message type backendKeyData.putInt(12); // Message length backendKeyData.putInt(1234); // Process ID backendKeyData.putInt(5678); // Secret key backendKeyData.flip(); writeResult = client.write(backendKeyData); // Then, write ReadyForQuery ByteBuffer readyForQuery = ByteBuffer.allocate(6); readyForQuery.put((byte) 'Z'); // 'Z' for ReadyForQuery readyForQuery.putInt(5); // Length readyForQuery.put((byte) 'I'); // Transaction status indicator, 'I' for idle readyForQuery.flip(); writeResult = client.write(readyForQuery); try { writeResult.get(); } catch (Exception e) { System.err.println("[SERVER] Failed to write to client: " + e); } } From this point on, it'll be useful to be able to visualize the messages that we're sending and receiving.There are a few tools that you can use to do this:Wireshark/tsharkhttps://zignar.net/2022/09/24/using-tshark-to-monitor-pg-traffic/pgs-debug (part of pgshark)https://github.com/dalibo/pgsharkpgmockproxyhttps://github.com/jackc/pgmock#pgmockproxyI recommend using Wireshark's GUI, it's the easiest to use. For this tutorial I'll be using pgs-debug, for two reasons:Wireshark doesn't work on WSLI want to be able to paste the ASCII output into the tutorialNOTE: If you want a video tutorial on how to capture Postgres traffic with Wireshark, I have a short demo on my pgprotokt repo here:https://github.com/GavinRay97/PgProtoKt#demo-video-with-psqlTo capture the output with pgs-debug, I'll be using the command:# Capture on loopback interface $ sudo pgs-debug --interface lo If we start up the server and connect with psql, we should see the following:psql client:[user@MSI ~]$ psql -h localhost -p 5432 -U postgres psql (15.0, server 0.0.0) WARNING: psql major version 15, server major version 0.0. Some psql features might not work. Type "help" for help. postgres=> pgs-debug output:[user@MSI ~]$ sudo pgs-debug --interface lo Packet: t=1673886702.924458, session=213070643347544 PGSQL: type=SSLRequest, F -> B SSL REQUEST Packet: t=1673886702.928187, session=213070643347544 PGSQL: type=SSLAnswer, B -> F SSL BACKEND ANSWER: N Packet: t=1673886702.928222, session=213070643347544 PGSQL: type=StartupMessage, F -> B STARTUP MESSAGE version: 3 application_name=psql database=postgres client_encoding=UTF8 user=postgres Packet: t=1673886702.928318, session=213070643347544 PGSQL: type=AuthenticationOk, B -> F AUTHENTIFICATION REQUEST code=0 (SUCCESS) Packet: t=1673886702.970239, session=213070643347544 PGSQL: type=BackendKeyData, B -> F BACKEND KEY DATA pid=1234, key=5678 Packet: t=1673886702.970239, session=213070643347544 PGSQL: type=ReadyForQuery, B -> F READY FOR QUERY type=<IDLE> Server output:[SERVER] Listening on localhost:5432 [SERVER] Accepted connection from /127.0.0.1:47544 [SERVER] Received message from client: sun.nio.ch.UnixAsynchronousSocketChannelImpl[connected local=/127.0.0.1:5432 remote=/127.0.0.1:47544] [SERVER] Buffer: java.nio.HeapByteBuffer[pos=0 lim=8 cap=1024] [SERVER] Received message from client: sun.nio.ch.UnixAsynchronousSocketChannelImpl[connected local=/127.0.0.1:5432 remote=/127.0.0.1:47544] [SERVER] Buffer: java.nio.HeapByteBuffer[pos=0 lim=84 cap=1024] Step 1.3 - Differentiating between the SSL/Authentication request, and Command messagesWe need to be able to differentiate between the SSL Negotiation message, the Authentication request, and the standard command messages.This is so that we can properly route the messages to the appropriate handlers. Otherwise we wouldn't be able to serve more than one client at a time.To do this, we can create some predicate helpers for testing the message type to determine whether it's the SSL Request or Startup Message. static Predicate<ByteBuffer> isSSLRequest = (ByteBuffer b) -> { return b.get(4) == 0x04 && b.get(5) == (byte) 0xd2 && b.get(6) == 0x16 && b.get(7) == 0x2f; }; static Predicate<ByteBuffer> isStartupMessage = (ByteBuffer b) -> { return b.remaining() > 8 && b.get(4) == 0x00 && b.get(5) == 0x03 // Protocol version 3 && b.get(6) == 0x00 && b.get(7) == 0x00; }; private static void onMessageReceived(AsynchronousSocketChannel client, ByteBuffer buffer) { System.out.println("[SERVER] Received message from client: " + client); System.out.println("[SERVER] Buffer: " + buffer); Future<Integer> writeResult = null; if (isSSLRequest.test(buffer)) { System.out.println("[SERVER] SSL Request"); ByteBuffer sslResponse = ByteBuffer.allocate(1); sslResponse.put((byte) 'N'); sslResponse.flip(); writeResult = client.write(sslResponse); } else if (isStartupMessage.test(buffer)) { System.out.println("[SERVER] Startup Message"); // Then, write AuthenticationOk ByteBuffer authOk = ByteBuffer.allocate(9); authOk.put((byte) 'R'); // 'R' for AuthenticationOk authOk.putInt(8); // Length authOk.putInt(0); // AuthenticationOk authOk.flip(); writeResult = client.write(authOk); // Then, write BackendKeyData ByteBuffer backendKeyData = ByteBuffer.allocate(17); backendKeyData.put((byte) 'K'); // Message type backendKeyData.putInt(12); // Message length backendKeyData.putInt(1234); // Process ID backendKeyData.putInt(5678); // Secret key backendKeyData.flip(); writeResult = client.write(backendKeyData); // Then, write ReadyForQuery ByteBuffer readyForQuery = ByteBuffer.allocate(6); readyForQuery.put((byte) 'Z'); // 'Z' for ReadyForQuery readyForQuery.putInt(5); // Length readyForQuery.put((byte) 'I'); // Transaction status indicator, 'I' for idle readyForQuery.flip(); writeResult = client.write(readyForQuery); } else { System.out.println("[SERVER] Unknown message"); } try { System.out.println("[SERVER] Write result: " + writeResult.get()); } catch (Exception e) { System.err.println("[SERVER] Failed to write to client: " + e); e.printStackTrace(); } } If we re-start and reconnect with psql, we should now see:[SERVER] Listening on localhost:5432 [SERVER] Accepted connection from /127.0.0.1:35090 [SERVER] Received message from client: sun.nio.ch.UnixAsynchronousSocketChannelImpl[connected local=/127.0.0.1:5432 remote=/127.0.0.1:35090] [SERVER] Buffer: java.nio.HeapByteBuffer[pos=0 lim=8 cap=1024] [SERVER] SSL Request [SERVER] Write result: 1 [SERVER] Received message from client: sun.nio.ch.UnixAsynchronousSocketChannelImpl[connected local=/127.0.0.1:5432 remote=/127.0.0.1:35090] [SERVER] Buffer: java.nio.HeapByteBuffer[pos=0 lim=84 cap=1024] [SERVER] Startup Message [SERVER] Write result: 6 Step 1.4 - Handle a query and return data rowsNow, the moment you've likely all been waiting for. Let's handle a query and return some data rows."Handle" in this case means that we'll just return a hard-coded set of rows, and not actually query a database (sorry to disappoint!). I did say "no libraries" =(To do this, we'll need to handle the Query message, and then send a RowDescription message, followed by a DataRow message for each row, and finally a CommandComplete message.For our RowDescription message, we'll send two columns, with names "id" and "name"For our DataRow message, we'll send two rows, with values (1, "one") and (2, "two")To complete the cycle, we lastly need to follow up with a ReadyForQuery message.This is the hairiest part of the protocol, so the annotated code below should hopefully help you understand what's going on:} else { System.out.println("[SERVER] Unknown message"); // Let's assume it's a query message, and just send a simple response // First we send a RowDescription. We'll send two columns, with names "id" and "name" ByteBuffer rowDescription = ByteBuffer.allocate(51); rowDescription.'''
