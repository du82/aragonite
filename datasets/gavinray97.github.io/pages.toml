full_description = "Published onFebruary 4, 2023What good are Record Patterns in Java? An example based on Spark's Catalyst Optimizer and it's Tree Rewriting RulesjavajdkjvmA tutorial on how to use Java's new Record Patterns feature to write powerful, concise pattern matching code for usecases like AST transformations and rewrite-rules in compiler passes. Published onJanuary 16, 2023Building a PostgreSQL Wire Protocol Server using Vanilla, Modern Java 21javajdkjvmpostgreswire-protocoldatabasesserverA dual-purpose tutorial to 1) Demonstrate how to implement the Simple Query Protocol, where Java is an implementation detail; 2) Show practical examples of most of the new features since JDK 17, including Records, Sealed Types, Pattern Matching for Switch, Virtual Threads, and Panama Foreign-Function & Memory API. Published onDecember 31, 2022Adding Design-by-Contract [[invariant]] conditions to C++, via a GCC plugincppgccdesign-by-contractDesign-by-Contract's invariant attribute allows you to enforce important properties of systems and data structures, making it an incredibly useful tool for developers. In this blog post, we'll be exploring the development of a GCC plugin that adds support for [[invariant]] conditions in C++ classes and structs. We'll also be looking at an example of how invariant can be used to improve the integrity of a Stack data structure. This is especially timely as GCC has recently added support for Contracts, allowing you to annotate functions with pre/post conditions. Don't miss out on learning how to use this powerful feature in your own projects! Published onDecember 5, 2022A Day Without a Copilot: Reflections on Copilot-Driven Developmentgithub-copilotmachine-learningnon-technicalA reflection on the impact of language models like Github Copilot on the experience on authoring software and the role of the developer Published onOctober 14, 2022Building a high-performance database buffer pool in Zig using io_uring's new fixed-buffer modedatabasezigio_uringperformancelinuxIn this post, we will explore how to build a high-performance database buffer pool in Zig using io_uring's new fixed-buffer mode."
