title = "GB64.COM - C64 Games, Database, Music, Emulation, Frontends, Reviews and Articles"
full_description = "VB6 Runtime Files 1007 KB These runtimes are needed to install and run the GameBase frontend, Quick64! and Bolyx. If you cannot get any of these programs to run, it's probably because you don't have these runtimes installed. Download Server Location gb64.com DE Download The GameBase Frontend 4822 KB This is the full setup for v1.3 of the GameBase frontend. Download this to run the GB64 Collection on your own machine. Download Server Location gb64.com DE Download GB64 v19 Database 7139 KB This is the 'offline' version of the GB64 collection database. It comes as a setup program that will configure the database and various C64 emulators for use with the GameBase frontend. Download Server Location gb64.com DE Download GB64 v15 Remove/Add Longplays 17 KB This is a script which automatically removes/adds all C64-Longplays from/to the GB64 v15 Database. Download Server Location gb64.com DE Download GB64 v19 Screenshots 97116 KB This is the full screenshot pack for GB64 v19. Contains over 52000 C64 screenshots! Download Server Location gb64.com DE Download GB64 Musician Photos 1219 KB This pack contains all the C64 musician photos for the GB64 Database. Once downloaded simply set your Musician Photo path in GameBase and they should appear when you browse through games and SIDs! These photos were kindly provided by the most excellent guys over at composers.c64.org. Download Server Location gb64.com DE Download GB64 Classic Game Sounds 44 KB Getting bored with the default classic game sound in GameBase? Download these and stick them in the /sounds folder inside your GB64 database folder, and you'll get some cool C64 sound effects for your classic games! Download Server Location gb64.com DE Download Quick64! 960 KB This is the full setup program for Quick64! (VB6 runtimes needed) Download Server Location gb64.com DE Download Bolyx 297 KB This is the full setup for Bolyx - a remake of the classic C64 game Zolyx (VB6 runtimes needed). Download Server Location gb64.com DE Download"
