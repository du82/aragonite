["https://gcc.gnu.org/about.html"]
title = """
GCC: About
- GNU Project"""
full_description = 'The web effort was originally led by Jeff Law. For the last two decades or so Gerald Pfeifer has been leading the effort, but there are many contributors . The web pages are under git control. The pages on gcc.gnu.org are updated directly after a change has been committed. www.gnu.org is updated once a day at 4:00 -0700 (PDT). Please send feedback, problem reports and patches to our mailing lists, ideally putting the string "[wwwdocs]" at the beginning of the mail subject. Want to contribute? Any help concerning the items below is welcome, as are suggestions. Suggestions accompanied by patches have a higher chance of being implemented soon. ;-) It should detect mirrors that have gone away, are persistently down, or very out of date (the last being easy to do for those carrying snapshots, harder for those with releases only). DJ Delorie <dj@redhat.com> has some scripts to do this already. To validate any changes, you can use the W3 Validator. Just use the "Validate by File Upload" functionality. We recommend you list files explicitly to avoid accidental checkins and prefer that each checkin be of a complete, single logical change. As changes are checked in, the respective pages are preprocessed via the script wwwdocs/bin/preprocess which in turn uses a tool called MetaHTML. Among others, this preprocessing adds CSS style sheets, XML and HTML headers, and our standard footer. The MetaHTML style sheet is in wwwdocs/htdocs/style.mhtml. Copyright (C) Free Software Foundation, Inc. Verbatim copying and distribution of this entire article is permitted in any medium, provided this notice is preserved.'
