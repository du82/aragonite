["https://gcc.gnu.org/news.html"]
title = """
GCC news and announcements
- GNU Project"""
full_description = "This is not yet the default mode, but we hope it will be the default in GCC 3.0. When it is used the compiler will be faster because it will not have to do lexical analysis twice, nor save the preprocessed output to a temporary file. In the future, this will permit better error messages, and more detailed debugging information particularly when complex macros are used. ISO C, C++, and Objective C use the new preprocessor. Traditional (K+R) C, Fortran, and Chill use an older implementation (taken from GCC 1) which obeys the rules for pre-standard C preprocessing. Either version may be used to preprocess assembly language. Stan Cox and Jason Eckhardt of Cygnus, a Red Hat company, have contributed a basic block reordering pass. The optimization can reposition basic blocks from across the entire function in an attempt to reduce branch penalties and enhance instruction cache efficiency. Our thanks go to Michael Hayes, Jan Hubicka, and Graham Stott who noticed or fixed defects or made other useful suggestions. Richard Earnshaw of ARM Ltd, and Nick Clifton of Cygnus, a Red Hat company, have contributed a new back end for the Arm and Thumb processors. The new back end combines code generation for the Arm, the Thumb and the StrongArm into one compiler, with the target processor and instruction sets being selectable via command-line switches. Michael Meissner and Richard Henderson of Cygnus, a Red Hat company, have contributed a new if-conversion pass. The code runs faster and identifies more optimization opportunities than the old code. In addition, it also has support for conditional (predicated) execution, such as is found in the Intel IA-64 architecture, the ARM processors, and numerous embedded LIW and DSP parts. The Steering Committee and the GCC community owe Jeff Law an immense debt for his work as release manager for the EGCS 1.0.x, 1.1.x, and GCC 2.95.x series of releases. He has done an outstanding job. Craig Burley, our lead Fortran developer and the original author of g77, announced that he will stop working on g77 beyond the 2.95 series. On behalf of the entire GCC team, the steering committee would like to thank Craig for his work."
