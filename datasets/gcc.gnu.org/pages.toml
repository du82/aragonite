["https://gcc.gnu.org/projects/cxx-status.html"]
title = """
C++ Standards Support in GCC
- GNU Project"""
full_description = '''For information about the status of the library implementation, please see the Implementation Status section of the Libstdc++ manual. GCC has experimental support for the next revision of the C++ standard, which is expected to be published in 2026. GCC has experimental support for the latest revision of the C++ standard, which was finalized in 2023 and published in 2024. C++23 features are available since GCC 11. To enable C++23 support, add the command-line parameter -std=c++2b to your g++ command line. Or, to enable GNU extensions in addition to C++23 features, add -std=gnu++2b. Important: Because the ISO C++23 standard is still evolving, GCC's support is experimental. No attempt will be made to maintain backward compatibility with implementations of C++23 features that do not reflect the final standard. GCC has experimental support for the previous revision of the C++ standard, which was published in 2020. The status of C++20 library features is described in the library documentation. C++20 features are available since GCC 8. To enable C++20 support, add the command-line parameter -std=c++20 (use -std=c++2a in GCC 9 and earlier) to your g++ command line. Or, to enable GNU extensions in addition to C++20 features, add -std=gnu++20. The following table lists new language features that have been accepted into the C++20 working draft. The "Proposal" column provides a link to the ISO C++ committee proposal that describes the feature, while the "Available in GCC?" column indicates the first version of GCC that contains an implementation of this feature (if it has been implemented). GCC has almost full support for the 2017 revision of the C++ standard. The status of C++17 library features is described in the library documentation. C++17 mode is the default since GCC 11; it can be explicitly selected with the -std=c++17 command-line flag, or -std=gnu++17 to enable GNU extensions as well. Some C++17 features are available since GCC 5, but support was experimental and the ABI of C++17 features was not stable until GCC 9.'''
