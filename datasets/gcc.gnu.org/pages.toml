["https://gcc.gnu.org/bugs"]
title = """
GCC Bugs
- GNU Project"""
full_description = "Before you report a bug, please check the list of well-known bugs and, if possible, try a current release or development snapshot. Before reporting that GCC compiles your code incorrectly, compile it with gcc -Wall -Wextra and see whether this shows anything wrong with your code. Similarly, if compiling with -fno-strict-aliasing -fwrapv -fno-aggressive-loop-optimizations makes a difference, or if compiling with -fsanitize=address,undefined produces any run-time errors, then your code is probably not correct. We also ask that for C++ code, users test their programs with -D_GLIBCXX_ASSERTIONS. If you're able to rebuild the entire program (including any libraries it uses, because it changes ABI), please do try libstdc++'s debug mode (-D_GLIBCXX_DEBUG) which enables more thorough checking in parts of the C++ standard library. If either of these fail, this is a strong indicator of an error in your code. After this summary, you'll find detailed instructions that explain how to obtain some of the information requested in this summary. Please include all of the following items, the first three of which can be obtained from the output of gcc -v: The GCC bug tracker requires you to create an account with a valid e-mail address. This is not merely to be annoying. It's because in the past spammers have filed fake bug reports, and fake attachments to real bug reports, to distribute malware and to add links to their spam web sites. Requiring a valid e-mail address is a partial deterrent to this. We apologize for the inconvenience. Please refer to the next section when reporting bugs in GNAT, the Ada compiler, or to the one after that when reporting bugs that appear when using a precompiled header. In general, all the information we need can be obtained by collecting the command line below, as well as its output and the preprocessed file it generates. The preprocessed source is the basic requirement to fix a bug. However, providing a minimal testcase increases the chances of getting your bug fixed. The only excuses to not send us the preprocessed sources are (i) if you've found a bug in the preprocessor, (ii) if you've reduced the testcase to a small file that doesn't include any other file or (iii) if the bug appears only when using precompiled headers. If you can't post the preprocessed sources because they're proprietary code, then try to create a small file that triggers the same problem."
