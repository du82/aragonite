["https://gcc.gnu.org/gcc-12/changes.html"]
title = """
GCC 12 Release Series — Changes, New Features, and Fixes
- GNU Project"""
full_description = '''This page is a "brief" summary of some of the huge number of improvements in GCC 12. You may also want to check out our Porting to GCC 12 page and the full GCC documentation. Such warnings are not disabled by the new -ftrivial-auto-var-init (see below), as the latter is considered a mitigation option. The existing -Wanalyzer-tainted-array-index has been reworded to talk about "attacker-controlled" rather than "tainted" values, for consistency with the new warnings. A new __attribute__ ((tainted_args)) has been added to the C and C++ front ends, usable on functions, and on function pointer callback fields in structs. The analyzer's taint mode will treat all parameters and buffers pointed to by parameters of such functions as being attacker-controlled, such as for annotating system calls in an operating system kernel as being an "attack surface". This is the list of problem reports (PRs) from GCC's bug tracking system that are known to be fixed in the 12.1 release. This list might not be complete (that is, it is possible that some PRs that have been fixed are not listed here). This is the list of problem reports (PRs) from GCC's bug tracking system that are known to be fixed in the 12.2 release. This list might not be complete (that is, it is possible that some PRs that have been fixed are not listed here). This is the list of problem reports (PRs) from GCC's bug tracking system that are known to be fixed in the 12.3 release. This list might not be complete (that is, it is possible that some PRs that have been fixed are not listed here). This is the list of problem reports (PRs) from GCC's bug tracking system that are known to be fixed in the 12.4 release. This list might not be complete (that is, it is possible that some PRs that have been fixed are not listed here). Copyright (C) Free Software Foundation, Inc. Verbatim copying and distribution of this entire article is permitted in any medium, provided this notice is preserved.'''
