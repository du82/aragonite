- GNU Project"""
full_description = "The steering committee was founded in 1998 with the intent of preventing any particular individual, group or organization from getting control over the project. Its primary purpose is to make major decisions in the best interests of the GCC project and to ensure that the project adheres to its fundamental principles found in the project's mission statement. [see the original announcement below]. In April 1999 the steering committee was appointed by the FSF as the official GNU maintainer for GCC and changed its name to GCC steering committee. The steering committee consists of the following members. The best place to reach them is the gcc mailing list. Membership in the steering committee is a personal membership. Affiliations are listed for identification purposes only; steering committee members do not represent their employers or academic institutions. Generally speaking, committee members were chosen to represent the interests of communities (e.g. Fortran users, embedded systems developers, kernel hackers), not companies. Copyright (C) Free Software Foundation, Inc. Verbatim copying and distribution of this entire article is permitted in any medium, provided this notice is preserved."
