["https://gcc.gnu.org/git.html"]
title = """
GCC: Anonymous read-only Git access
- GNU Project"""
description = "Anonymous read-only access to the GCC project Git source repository."
full_description = "Our Git source repository is available read-only to the public at large. That way you can pick up any version (including releases) of GCC that is in our repository. If you are behind a firewall that does not allow the git protocol through, you can replace git:// with https://. If there is another local repository accessible you can avoid re-downloading everything by using --reference, e.g. But if you own this other copy, you probably want to use separate worktrees instead of multiple clones. Our source tree contains a number of files that are generated from other source files by build tools such as Bison, Autoconf, and Gperf. Bison is now required when using Git to access our sources, but all other generated files are included in the source tree so that GCC can be built without these build tools. The Git checkout and update operations do not insure that the timestamps of generated files are later than those of the files they are generated from. The script contrib/gcc_update updates the timestamps for all these generated files. See the comments in that script for instructions on running it. GCC's build system (in particular Make) uses file timestamps to determine if a generated file needs to be updated by running a particular build tool. Because of this, GCC's build system may believe that a generated file needs regenerating even though its source has not changed, and require a particular build tool to rebuild that generated file. If the appropriate build tool is installed on your system, then this will not be a problem. If you do not intend to make changes to the source, you can avoid installing these build tools by running contrib/gcc_update. There has been some discussion of removing these generated files from GCC's Git source tree (there is no discussion of removing them from the released source tarballs). If that happens then building GCC from the Git source tree would require installing the above mentioned build tools. Installing these build tools is not particularly difficult, but can be time consuming especially if you only occasionally install GCC on a particular system."
year_published = 2025
