["https://gcc.gnu.org/onlinedocs/gcc/Compatibility.html"]
title = "Compatibility (Using the GNU Compiler Collection (GCC))"
description = "Compatibility (Using the GNU Compiler Collection (GCC))"
full_description = "Next: gcov—a Test Coverage Program, Previous: GNU Objective-C Features, Up: Introduction [Contents][Index] The set of runtime conventions followed by all of the tools that deal with binary representations of a program, including compilers, assemblers, linkers, and language runtime support. Some ABIs are formal with a written specification, possibly designed by multiple interested parties. Others are simply the way things are actually done by a particular set of tools. A compiler conforms to an ABI if it generates code that follows all of the specifications enumerated by that ABI. A library conforms to an ABI if it is implemented according to that ABI. An application conforms to an ABI if it is built using tools that conform to that ABI and does not contain source code that specifically changes behavior specified by the ABI. Calling conventions are a subset of an ABI that specify of how arguments are passed and function results are returned. Different sets of tools are interoperable if they generate files that can be used in the same program. The set of tools includes compilers, assemblers, linkers, libraries, header files, startup files, and debuggers. Binaries produced by different sets of tools are not interoperable unless they implement the same ABI. This applies to different versions of the same tools as well as tools from different vendors. Whether a function in a binary built by one set of tools can call a function in a binary built by a different set of tools is a subset of interoperability. Language standards include lists of implementation-defined features whose behavior can vary from one implementation to another. Some of these features are normally covered by a platform’s ABI and others are not. The features that are not covered by an ABI generally affect how a program behaves, but not intercallability. Conformance to the same ABI and the same behavior of implementation-defined features are both relevant for compatibility. The application binary interface implemented by a C or C++ compiler affects code generation and runtime support for:"
