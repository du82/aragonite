["https://gcc.gnu.org/lists.html"]
title = """
GCC mailing lists
- GNU Project"""
full_description = '''The GCC project has many mailing lists, which are archived on the web (and searchable). Please make yourself familiar with our policies before subscribing and posting to these lists. gcc is a high volume list for general development discussions about GCC. Anything relevant to the development or testing of GCC and not covered by other mailing lists is suitable for discussion here. Recruiting postings, including recruiting for GCC or other free software jobs, are not permitted on any of our mailing lists. If you are interested in hiring a GCC developer, please visit the FSF jobs page. All major decisions and changes, like abandoning ports or front ends, should be announced and discussed here. Ideally, this list should be sufficient to follow the major trends and important news in GCC's development process. Our lists have a maximum message size of 100kB, only the gcc-patches list allows for a larger maximum message size of 400kB. If your message exceeds this size, you should compress any attachments before sending it to the list. When posting messages, please select an appropriate list for the message and try to avoid cross posting to several lists. If somebody replies to your message, do not reply to that person only. Keep the conversation on the mailing list unless requested otherwise, e.g. by using "Reply All". The referring document contains privileged and confidential information. If you are not the intended recipient you must not disseminate, copy or take any action in reliance on it, and we request that you notify companyname immediately. Such disclaimers are inappropriate for mail sent to public lists. If your company automatically adds something like this to outgoing mail, and you can't convince them to stop, you might consider using a free web-based e-mail account. Any views expressed in this message are those of the individual sender, except where they are specifically stated to be the views of companyname. are acceptable, although they are redundant; unless explicitly stated, it's assumed that no-one on these lists means to speak for their company.'''
