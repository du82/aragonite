full_description = 'C99 is substantially completely supported as of GCC 4.5 (with -std=c99 -pedantic-errors used; -fextended-identifiers also needed to enable extended identifiers before GCC 5), modulo bugs and floating-point issues (mainly but not entirely relating to optional C99 features from Annexes F and G). The following table gives more details of the C99 support in different GCC versions. This table is based on the list in the foreword to N1256 (ISO/IEC 9899:1999 (E), consolidated with ISO/IEC 9899:1999/Cor.1:2001 (E), ISO/IEC 9899:1999/Cor.2:2004 (E) and ISO/IEC 9899:1999/Cor.3:2007 (E)). The "Version" column indicates the first GCC version in which support for the relevant feature was substantially present; some bugs or corner cases may have been fixed in later versions; this column is "N/A" if nothing is needed from the compiler for the feature to be substantially supported (for example, if the feature refers to addition of new library functions rather than language features), even if additional compiler features could be useful in conjunction with it. It is assumed that GCC is used with -std=c99 -pedantic-errors (for versions 3.0 and later), as well as -fextended-identifiers in the case of that feature before GCC 5. Where library cooperation is required, it is assumed that a recent version of the GNU C Library is in use, and support with other C libraries may be less good. Where the version listed is before GCC 3.0, it should not be assumed that all corner cases follow C99 before GCC 3.0, even if there is no specific note regarding corner cases. Copyright (C) Free Software Foundation, Inc. Verbatim copying and distribution of this entire article is permitted in any medium, provided this notice is preserved.'
