["https://gcc.gnu.org/develop.html"]
title = """
GCC Development Plan
- GNU Project"""
full_description = '(Suggestions for changes to this plan are discussed on the GCC mailing list and approved or rejected by the GCC Steering Committee.) Late in the GCC 2.x series and then GCC 3.x we struggled making consistent, high-quality releases for as wide a variety of targets as we would have liked. GCC 3.0 came late relative to original scheduling estimates and the time between the GCC 2.95 and GCC 3.0 releases was longer than everyone would have liked. We think that more frequent releases on a consistent schedule serve our user communities better. In addition, a consistent schedule makes it possible for Release Managers to better understand what they are signing up for. The development of major changes shall be done on a branch. (Under some circumstances, development may be done in a private development tree, but the Steering Committee strongly encourages the use of a branch in the publicly accessible GCC development tree.) There is no firm guideline for what constitutes a "major change" and what does not. If a developer is unsure, they should ask for guidance on the GCC mailing lists. In general, a change that has the potential to be extremely destabilizing should be done on a branch. Making major improvements to the compiler is good. However, such changes are inevitably somewhat destabilizing. By using a branch, it is possible for people to test and improve the code, but without impacting other developers. By testing major changes more thoroughly than ordinary changes, we will help reduce the impact on other developers. In addition, the presence of half-finished projects on the mainline presents a variety of problems when preparing for a release. If serious bugs remain, it may be impossible to do a release until the bugs are fixed, thereby impacting the release schedule. If functionality is present, but not robust (for example, command-line options that activate an optimization pass that does not work very well), then we can seriously confuse users. During this period, changes of any nature may be made to the compiler. In particular, major changes may be merged from branches. Stage 1 is feature driven and will last at least four months. In order to avoid chaos, the Release Managers will ask for a list of major projects proposed for the coming release cycle before the start of this stage. They will attempt to sequence the projects in such a way as to cause minimal disruption. The Release Managers will not reject projects that will be ready for inclusion before the end of Stage 1. Similarly, the Release Managers have no special power to accept a particular patch or branch beyond what their status as maintainers affords. The role of the Release Managers is merely to attempt to order the inclusion of major features in an organized manner.'
year_published = 2025
clearnet = "https://gcc.gnu.org/develop.html"
