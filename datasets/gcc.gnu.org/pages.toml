["https://gcc.gnu.org/gitwrite.html"]
title = """
Read-write Git access
- GNU Project"""
full_description = '''We have read/write access to the Git repository available for maintainers and significant developers. We provide authenticated access via the SSH protocol. This needs to be sponsored by an existing maintainer (someone with "write after approval" is not sufficient). If you already have an account on sourceware.org / gcc.gnu.org, ask admin-requests@sourceware.org to add access to the GCC repository. Include the name of your sponsor and CC: them. Otherwise use this form, again specifying your sponsor. We will then provision you and inform you by mail. At this point, check out a tree using the instructions below and add yourself to the MAINTAINERS file. Note: Your first and last names must be exactly the same between your account on gcc.gnu.org and the MAINTAINERS file. Place your name in the correct section following the conventions specified in the file (e.g. "Write After Approval" is "last name alphabetical order"). If you do not have an FSF copyright assignment on file, also add yourself to the DCO section in the file. Then produce a diff to that file and circulate it to the gcc-patches list, whilst also checking in your change to test write access (approval from the mailing list is not needed in this one case). For all other changes, please be sure to follow the write access policies below. To avoid the nuisance of having to supply your passphrase for each operation, you may want to use ssh-agent(1) and ssh-add(1). Git needs to know your name and email address. If you have not already configured those in $HOME/.gitconfig, do: If you wish to use a different name or email address for GCC commits from that in $HOME/.gitconfig, you can configure that in an individual Git tree using similar invocations without --global. The GCC project grants developers various levels of write access to and review authority over the GCC master sources. We have not put any technical enforcement in place, rather we rely on everyone to follow the appropriate policies. A limited number of developers have global review permission and can approve other people's changes to any part of the compiler.'''
year_published = 2025
