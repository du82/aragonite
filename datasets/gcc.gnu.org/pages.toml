["https://gcc.gnu.org/install/specific.html"]
title = """
Host/Target specific installation notes for GCC
- GNU Project"""
description = "Host/Target specific installation notes for GCC"
full_description = "Note that this list of install notes is not a list of supported hosts or targets. Not all supported hosts and targets are listed here, only the ones that require host-specific or target-specific information have to. To enable a workaround for the Cortex-A53 erratum number 835769 by default (for all CPUs regardless of -mcpu option given) at configure time use the --enable-fix-cortex-a53-835769 option. This will enable the fix by default and can be explicitly disabled during compilation by passing the -mno-fix-cortex-a53-835769 option. Conversely, --disable-fix-cortex-a53-835769 will disable the workaround by default. The workaround is disabled by default if neither of --enable-fix-cortex-a53-835769 or --disable-fix-cortex-a53-835769 is given at configure time. To enable a workaround for the Cortex-A53 erratum number 843419 by default (for all CPUs regardless of -mcpu option given) at configure time use the --enable-fix-cortex-a53-843419 option. This workaround is applied at link time. Enabling the workaround will cause GCC to pass the relevant option to the linker. It can be explicitly disabled during compilation by passing the -mno-fix-cortex-a53-843419 option. Conversely, --disable-fix-cortex-a53-843419 will disable the workaround by default. The workaround is disabled by default if neither of --enable-fix-cortex-a53-843419 or --disable-fix-cortex-a53-843419 is given at configure time. To enable Branch Target Identification Mechanism and Return Address Signing by default at configure time use the --enable-standard-branch-protection option. This is equivalent to having -mbranch-protection=standard during compilation. This can be explicitly disabled during compilation by passing the -mbranch-protection=none option which turns off all types of branch protections. Conversely, --disable-standard-branch-protection will disable both the protections by default. This mechanism is turned off by default if neither of the options are given at configure time. Instead of GNU Binutils, you need to install LLVM and copy bin/llvm-mc to amdgcn-amdhsa/bin/as, bin/lld to amdgcn-amdhsa/bin/ld, bin/llvm-nm to amdgcn-amdhsa/bin/nm, and bin/llvm-ar to both bin/amdgcn-amdhsa-ar and bin/amdgcn-amdhsa-ranlib."
