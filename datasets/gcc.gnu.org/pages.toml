["https://gcc.gnu.org/contributewhy.html"]
title = """
Extending and Contributing to GCC
- GNU Project"""
full_description = "If you are writing a major extension to GCC, such as a port to a new computer, a new language, or a major rewrite of some optimization passes, please keep in mind the importance of keeping other developers informed. Part of being a good cooperating member of the GCC development team is the responsibility to consider what the other developers need in order to work effectively. Nobody likes to do a lot of work and find it was duplicated effort. So when you work on a major new feature, you should tell gcc@gcc.gnu.org what you are working on, and give occasional reports of how far you have come and how confident you are that you will finish the job. This way, other developers (if they are paying attention) will be aware which projects would duplicate your effort, and can either join up with you, or at least avoid spending time on something that will be unnecessary because of your work. You should also monitor the gcc@gcc.gnu.org list to see if someone else mentions working on a similar project to yours. If that happens, speak up! If you are thinking of taking a contract to develop changes under a temporary delayed-release agreement, please negotiate the agreement so that you can give progress reports before the release date, even though you cannot release the code itself. Also please arrange so that, when the agreed-on date comes, you can release whatever part of the job you succeeded in doing, even if you have not succeeded in finishing it. Someone else may be able to finish the job. Many people have done GCC ports on their own, to a wide variety of processors, without much communication with the GCC development team. However, many of those ports have been lost over time, or have proven very hard to integrate. So, what we're asking is that, to the maximum extent possible, you communicate with us as early on and as much as possible. Here are some questions GCC porters may have with our answers to them. While the focus here is on new back ends, we believe that the issues are similar for new front ends (new languages), as well as for student efforts to implement new compiler optimizations."
year_published = 2025
