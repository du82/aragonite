["https://gcc.gnu.org/bugs/reghunt.html"]
title = """
How to Locate GCC Regressions
- GNU Project"""
full_description = "A regression is a bug that did not exist in a previous release. Problem reports for GCC regressions have a very high priority, and we make every effort to fix them before the next release. Knowing which change caused a regression is valuable information to the developer who is fixing the problem, even if that patch merely exposed an existing bug. People who are familiar with building GCC but who don't have the knowledge of GCC internals to fix bugs can help a lot by identifying patches that caused regressions to occur. The same techniques can be used to identify the patch that unknowingly fixed a particular bug on the mainline when that bug also exists as a regression on a release branch, allowing someone to port the fix to the branch. If you've got sufficient disk space available, keep old install tree around for use in finding small windows in which regressions occur. Some people who do this regularly add information to our bug tracker about particular problem reports for regressions. Before you start your search, verify that you can reproduce the problem with GCC built from the current sources. If not, the bug might have been fixed, or it might not be relevant for your platform, or the failure might only happen with particular options. Next, verify that you get the expected behavior for the start and end dates of the range. The basic search strategy is to iterate through the following steps while the range is too large to investigate by hand: The first three steps are described below. They can be automated, as can the framework for the binary search. The directory contrib/reghunt in the GCC repository includes scripts to do this work. Eventually you'll need to identify the patch and verify that it causes the behavior of the test to change. Check out a working copy using Git. Use a new working copy that is separate from what you use for development or other testing, since it is easy to end up with files in strange states. If no one has provided a range of dates for when a particular mainline regression appeared, you can narrow the search by knowing in which release it first appeared and then testing the mainline between the branchpoint for that release and the branchpoint for the previous release that does not have the bug. To find out the revision/date at which a branch or tag was created, use the command svn log --stop-on-copy."
year_published = 2025
clearnet = "https://gcc.gnu.org/bugs/reghunt.html"
tags = ["around", "branch", "build", "check", "copy", "cuts", "dates", "identify", "locate", "patch"]
