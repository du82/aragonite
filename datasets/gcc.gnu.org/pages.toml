["https://gcc.gnu.org/bugs/management.html"]
title = """
Managing Bugs (Bugzilla and the Testsuite)
- GNU Project"""
full_description = '''Bugzilla offers a number of different fields. From a maintainer's perspective, these are the relevant ones and what their values mean: The following two fields describe how serious a bug is from a user's perspective (Severity) and what Priority we assign to it in fixing it: As a general rule of thumb, within each priority level, bugs that result in incorrect code (keyword wrong-code) are considered equally as important to fix as those that lead to rejecting valid code (rejects-valid) and as those that cause an ICE for valid code (ice-on-valid-code). Lower in importance, however, are accepts-invalid and ice-on-invalid bugs, and less important still are missed-optimization opportunities. Regressions that only affect more recent releases are prioritized over those that also affect older releases. For example, prior to the release of GCC 7, a regression that was introduced in GCC 6 and that affects GCC 7 is considered more important to fix in GCC 7 than a regression that was introduced in GCC 5 (and is still present in GCC 6 and 7). This is the person in charge of resolving the bug. Every time this field changes, the status changes to NEW to make it easy to see which new bugs have appeared on a person's list. These are used to further classify the problem reports. Follow the link for a complete list of the keywords including descriptions. Putting reports in components "C", "C++", and "optimization" in state "NEW" requires that there is a reduced, small testcase. This makes sure that all NEW reports are really analyzed and are ready to be handed off to the people actually fixing bugs. where branches-to-fix is the list of maintained branches (separated by slashes) that need fixing. The target milestone should be set to the next release of the newest active release branch that needs fixing (the rationale is that a patch will have to go to the newest release branch before any other release branch). The priority of a regression should initially be set to P3. The milestone and the priority can be changed by the release manager and their delegates.'''
