["https://gcc.gnu.org/fortran"]
title = """
GNU Fortran
- GNU Project"""
full_description = "The purpose of the GNU Fortran (GFortran) project is to develop the Fortran compiler front end and run-time libraries for GCC, the GNU Compiler Collection. GFortran development is part of the GNU Project. We seek to bring free number crunching to a broad spectrum of platforms and users. In particular, the project wishes to reach users of the Fortran language, be it in the scientific community, education, or commercial environments. The GFortran compiler is fully compliant with the Fortran 95 Standard and includes legacy F77 support. In addition, a significant number of Fortran 2003 and Fortran 2008 features are implemented. Please give it a try. If you encounter problems, contact us at the mailing list or file a problem report. GFortran development follows the open development process. We do this to attract a diverse team of developers and to ensure that GFortran works on multiple architectures and diverse environments. We always need more help. If you are interested in participating, please contact us at fortran@gcc.gnu.org. (Also check out our mailing lists page.) For additional info on GFortran developments, you may find the GFortran wiki useful. Anyone may contribute information to the wiki. (Neither copyright paperwork nor a patch review process is required.) The GNU Project is about providing source code for its programs. For convenience, a number of people regularly build binaries for different platforms. Links to these can be found at the wiki. Most of the binary executables are the latest development snapshots of GFortran and are provided to encourage testing. We also want new users, from students to masters of the art of Fortran, to try GFortran. It really is a great compiler! We strive to provide a high quality Fortran compiler that works well on a variety of native targets. This means: The initial goal of the GNU Fortran Project was construction of a Fortran 95 compiler that complies with the ISO Fortran 95 Programming Language standard [ISO/IEC 1539-1:1997(E)]. We are now well into F2003 and F2008 features. The GFortran wiki and our bug tracker list features under development or yet to be implemented. Compiler capability is quite extensive and includes nearly all g77 features. We highly encourage users to move from g77, which is no longer maintained, and start taking advantage of GFortran's modern features. Legacy g77 code will compile fine in almost all cases."
year_published = 2025
