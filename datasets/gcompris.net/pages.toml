["https://gcompris.net/downloads-en.html"]
title = "Download - GCompris"
description = "educational software gcompris. Logiciel educatif gcompris"
full_description = '''Note: If your system doesn't have Direct3D 11 support or if it's not working properly, please use the entry GCompris (Safe Mode) in the start menu to launch GCompris with the software rendering mode. If you really need a version that runs on Windows XP, or if your system doesn't support the new version, you can use the last installer from the old GCompris 15.10. To enable all the activities in this old version, you can use the code 200202 in the entry box that contains the word CODE when you start the application. We support both android 32bit and 64bit from the Play Store. The appropriate version is downloaded automatically depending on your Android operating system. We also provide standalone packages for GNU/Linux. They should work on any recent distribution. System requirements: linux kernel 4.18, glibc 2.28. Then read the license or press q to skip it, answer yes to the questions, and the software will be installed in a new folder next to the installer. Note: If your system doesn't have OpenGL 2 support or if it's not working properly, please add the option "--software-renderer" at the end of the last line of the script gcompris-qt.sh. Another way is to edit the configuration file (in ~/.config/gcompris-qt/gcompris-qt.conf): find the line renderer=auto , replace auto with software and save the file. The last version available for 32bit Linux distributions can be downloaded from the following link. System requirements: linux kernel 3.10, glibc 2.17, pulseaudio, gstreamer 1.0. Then read the license or press q to skip it, answer yes to the questions, and the software will be installed in a new folder next to the installer. To check the integrity of your downloads, you can get the original SHA-256 hash of the files by adding ".sha256" at the end of their download url. The source tarball and the Linux installer are signed with the GPG key from Timothée Giet (public key: 0x63d7264c05687d7e.asc)'''
