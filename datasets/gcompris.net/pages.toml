["https://gcompris.net/faq-en.html"]
title = "FAQ - GCompris"
description = "educational software gcompris. Logiciel educatif gcompris"
full_description = '''Including the voices for all languages would make the installer way too heavy and most users are only interested in the voices for their language. Also the extra images and background music take relatively lot of space while not being required to use the software. So to minimize the base installer size we decided to not include those and let users download them from the software if they want to. If you don't want the software to download anything automatically, you can disable the option "Enable automatic downloads/updates of external assets" in the main configuration page. IMPORTANT: for GCompris versions older than 4.0, you need to replace "data3" with "data2" in all instructions below. IMPORTANT: from GCompris version 4.0, we added the date of the last update in the .rcc filenames. So you need to look in the "Contents" files what is the name of the latest one before downloading it. For example: backgroundMusic-ogg-2024-03-19-11-10-30.rcc . For older versions, the filenames don't contain the date. Example: backgroundMusic-ogg.rcc For the background music, you need to go in the folder named "backgroundMusic" and download those 2 files: It is both. From the beginning, GCompris has always been and still is a GNU package. Since 2014 it is maintained by the KDE community. The name GCompris sounds like "J'ai compris" in French, which means "I understand" in English. Also, the G stands for GNU. The requirements to build and publish software for iOS are not compatible with the GPLv3 and AGPLv3 licenses used by this software. For android we already publish on the Play store and F-Droid, publishing on all the stores would require too much work. If you are using a Fire tablet, you can directly install the latest apk from our website, and use a third party launcher to access the application from a child profile.'''
author = "Timothée Giet"
year_published = 2025
