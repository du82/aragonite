["https://gcompris.net/index-ml.html"]
title = "ജികോംപ്രി വിദ്യാഭ്യാസ സോഫ്റ്റ്‌വെയർ"
description = "ജികോംപ്രി വിദ്യാഭ്യാസ സോഫ്റ്റ്‌വെയർ"
full_description = "2 മുതൽ 10 വയസ്സു വരെയുള്ള കുട്ടികൾക്കു വേണ്ടിയുള്ള ധാരാളം പ്രവർത്തനങ്ങൾ അടങ്ങിയ, നല്ല നിലവാരമുള്ള വിദ്യാഭ്യാസ സോഫ്റ്റ്‌വെയർ ആണ് ജികോംപ്രി. ചില പ്രവർത്തനങ്ങൾ കളികളിലൂടെയാണ്, എന്നിരുന്നാലും വിദ്യാഭ്യാസപരമാണ്. പ്രവർത്തനങ്ങളെ തരംതിരിച്ച് ചില ഉദാഹരണങ്ങളോടു കൂടിയുള്ള പട്ടിക ഇവിടെ കൊടുത്തിരിക്കുന്നു: നിലവിൽ 100-ലധികം പ്രവർത്തനങ്ങൾ ജികോംപ്രിയിൽ ഉണ്ട്, മാത്രമല്ല കൂടുതൽ എണ്ണം ഡവലപ്പുചെയ്യുന്നുമുണ്ട്. ജികോംപ്രി ഒരു സ്വതന്ത്ര സോഫ്റ്റ്‌വെയർ ആണ്, അതായത് ഇതിനെ താങ്കളുടെ ആവശ്യാനുസരണം മാറ്റങ്ങൾ വരുത്താനും മെച്ചപ്പെടുത്താനും അതിലും പ്രധാനമായി ലോകത്തെവിടെയുമുള്ള കുട്ടികളുമായി പങ്കുവെക്കാനും കഴിയും. ജികോംപ്രി പ്രൊജക്ട് ഹോസ്റ്റു ചെയ്യുന്നതും ഡവലപ്പു ചെയ്യുന്നതും കെഡിഇ കമ്മ്യൂണിറ്റിയാണ്."
