title = "GDC Vault"
full_description = "This is operated by a business or businesses owned by Informa PLC and all copyright resides with them. Informa PLC's registered office is 5 Howick Place, London SW1P 1WG. Registered in England and Wales. Number 8860726. Game developers come together every year to share their voices, ideas, and perspectives on a variety of key industry topics—at the largest and longest-running professionals-only game industry event, the Game Developers Conference (GDC). GDC Vault, the official video platform of the Game Developers Conference, is a leading resource for developers within the game industry. Subscribers gain immediate access to thousands of recorded GDC sessions and events, growing their industry knowledge and expanding training within their teams. A wealth of game knowledge in one location, shared by the people who know the industry best. Take advantage of a powerful game dev training tool that spans over 20 years of the Game Developers Conference. Dive into a trove of videos and slides from key talks, events, and discussions; covering topics like Game Design, Programming, Visual Arts, Game Narrative, Business & Marketing, Education, Game Career Development, and more. Iconic sessions include Shinya Kumazaki and Tatsuya Kamiyama's breakdown of The Many Dimensions of Kirby, Ben Brode hilarious takes on the ins and outs of 'Designing MARVEL SNAP,' and a look at how Ukrainian developer Elena Lobova and her team Organized a Game Jam From Bomb Shelters. This is just the tip of the iceberg. Whether the game was a hit, a miss, or never got released, chances are someone has spoken about it at GDC. The GDC Vault catalog boasts countless hours of classic GDC content and continues to grow each year. Come join us at GDC San Francisco 2025 happening March 17-21, 2025. Sharpen your game developer knowledge and become an expert in your field by subscribing to GDC Vault today! Copyright © 2025. This website is owned and operated by Informa TechTarget, part of a global network that informs, influences and connects the world’s technology buyers and sellers. All copyright resides with them. Informa PLC's registered office is 5 Howick Place, London SW1P 1WG. Registered in England and Wales. TechTarget, Inc.’s registered office is 275 Grove St. Newton, MA 02466."
