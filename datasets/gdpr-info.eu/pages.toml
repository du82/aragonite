["http://gdpr-info.eu/art-11-gdpr"]
title = "Art. 11 GDPR – Processing which does not require identification - General Data Protection Regulation (GDPR)"
description = "If the purposes for which a controller processes personal data do not or do no longer require the identification of a data subject by the controller, the controller shall not be obliged to maintain, acquire or process additional information in order to identify the data subject for the sole purpose of complying with this Regulation. … Continue reading Art. 11 GDPR – Processing which does not require identification"
full_description = "Art. 11 GDPR Processing which does not require identification If the purposes for which a controller processes personal data do not or do no longer require the identification of a data subject by the controller, the controller shall not be obliged to maintain, acquire or process additional information in order to identify the data subject for the sole purpose of complying with this Regulation. 1Where, in cases referred to in paragraph 1 of this Article, the controller is able to demonstrate that it is not in a position to identify the data subject, the controller shall inform the data subject accordingly, if possible. 2In such cases, Articles 15 to 20 shall not apply except where the data subject, for the purpose of exercising his or her rights under those articles, provides additional information enabling his or her identification. Suitable Recitals (57) Additional Data for Identification Purposes ←Art. 10 GDPR Art. 12 GDPR→ GDPR Table of contents Report error"
