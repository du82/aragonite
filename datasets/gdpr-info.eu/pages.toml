description = "This Regulation lays down rules relating to the protection of natural persons with regard to the processing of personal data and rules relating to the free movement of personal data. This Regulation protects fundamental rights and freedoms of natural persons and in particular their right to the protection of personal data. The free movement of … Continue reading Art. 1 GDPR – Subject-matter and objectives"
full_description = "Art. 1 GDPR Subject-matter and objectives This Regulation lays down rules relating to the protection of natural persons with regard to the processing of personal data and rules relating to the free movement of personal data. This Regulation protects fundamental rights and freedoms of natural persons and in particular their right to the protection of personal data. The free movement of personal data within the Union shall be neither restricted nor prohibited for reasons connected with the protection of natural persons with regard to the processing of personal data. Suitable Recitals (1) Data Protection as a Fundamental Right (2) Respect of the Fundamental Rights and Freedoms (3) Directive 95/46/EC Harmonisation (4) Data Protection in Balance with Other Fundamental Rights (5) Cooperation Between Member States to Exchange Personal Data (6) Ensuring a High Level of Data Protection Despite the Increased Exchange of Data (7) The Framework is Based on Control and Certainty (8) Adoption into National Law (9) Different Standards of Protection by the Directive 95/46/EC (10) Harmonised Level of Data Protection Despite National Scope (11) Harmonisation of the Powers and Sanctions (12) Authorization of the European Parliament and the Council Art. 2 GDPR→ GDPR Table of contents Report error"
