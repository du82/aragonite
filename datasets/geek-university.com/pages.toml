["https://geek-university.com/linux-deutsch/dateisystemcheck-durchfuhren"]
title = "Dateisystemcheck durchführen | Linux Deutsch#"
description = "Dieser Artikel beschreibt wie man den fsck Befehl benutzen kann, um Dateisysteme in Linux auf Fehler zu überprüfen."
full_description = "Bugs, Stromausfälle und mechanische Probleme können die Datenstruktur eines Dateisystems beschädigen. Das kann zum Datenverlust führen. Um Dateisysteme auf Fehler zu überprüfen und aufgetretene Fehler zu reparieren, benutzt man den fsck Befehl. fsck kann Daten finden, die zu keinem Dateinamen mehr passen oder ein Inode, dem die Daten fehlen und die Reparatur durchführen. Beim Systemstart werden die Filesysteme gecheckt, die dafür in der /etc/fstab Datei markiert sind. Man kann auch den Befehl fsck manuell ausführen. Man soll den Name des Dateisystems spezifizieren: #icon4320{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon4320:hover{color:;background:;} Es wird nicht empfohlen, fsck auf eingebundene Partitionen anzuwenden, weil das zum Datenverlust führen kann. Hängen Sie das Dateisystem aus, bevor Sie diesen Befehl benutzen. Es gibt eine Menge von Optionen für fsck: -A Option – alle Dateisysteme überprüfen, die dafür in der /etc/fstab Datei markiert sind. Normalerweise in System-Startskripten verwendet. -t Option – normalerweise bestimmt fsck den Typ des Dateisystems selbstständig. Mit dieser Option kann man selber den Dateisystemtyp ausgeben. -N Option – diese Option zeigt an, was überprüft wird, aber ohne die eigentliche Überprüfung durchzuführen. -R Option – alle Dateisysteme außer dem Root-Dateisystem überprüfen. -V option – zeigt eine ausführliche Ausgabe. #icon2069{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon2069:hover{color:;background:;} fsck ist nur ein Frontend für weitere Check-Programme, die speziell für das jeweilige Dateisystem gemacht sind (wie z.B. e2fsck für ext2 Dateisysteme)."
