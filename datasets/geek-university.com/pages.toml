["https://geek-university.com/linux-deutsch/dateisystem-ext2"]
title = "Dateisystem ext2 | Linux Deutsch#"
description = "Dieser Artikel beschreibt das Dateisystem ext2 und seine Eigenschaften."
full_description = "Das Dateisystem ext2 (Second Extended File System) war in den 1990ern das Standarddateisystem des Linux-Betriebssystems. Es gilt als ein zuverlässiges Dateisystem, das aber nicht mehr weit verbreitet ist, weil ihm einige erweiterte Dateisystemfunktionen fehlen (z.B. das Journaling). Außerdem gibt es bei ext2 ein großes Manko: bei einem Systemabsturz des Linuxsystems muss das Dateisystem beim Neustart ausführlich und zeitintensiv geprüft werden. ext2 wird immer noch manchmal für kleine Partitionen verwendet wie z.B. für Boot-Partitionen. Auf kleinen Partitionen kann die Größe des Journals ein Problem sein, sodass ext2 eine logische Wahl ist. ext2 unterstützt eine maximale Dateigröße von 2 TB, eine maximale Dateisystemgröße von 16 TB und eine maximale Dateinamenlänge von 255 Bytes."
