["https://geek-university.com/linux-deutsch/apt-get-befehl"]
title = "apt-get Befehl | Linux Deutsch#"
description = "Dieser Artikel beschreibt wie man den apt-get Befehl benutzen kann, um Softwarepakete zu installieren, zu aktualisieren oder zu entfernen."
full_description = "apt-get ist die zeitgemäße Benutzerschnittstelle zur Verwaltung von Paketen in Debian und Debian-basierten Linux-Distributionen. Der apt-get Befehl wird verwendet, um Softwarepakete zu installieren, zu aktualisieren oder zu entfernen. apt-get ergreift Informationen zu den verfügbaren Paketen von den in /etc/apt/sources.list aufgeführten Quellen und verwendet dann diese Informationen, um die Pakete zu aktualisieren oder zu installieren. Hier eine sources.list Datei: Beachten Sie die Zeilen, die mit deb und deb-src beginnen. Dies sind die Quellen, aus denen Pakete ergriffen werden: deb steht dabei für Binärpakete, die man in der Regel installieren möchte. deb-src steht für den Quellcode der Pakete. Die Liste der verfügbaren Pakete aktualisieren Wir können den Befehl apt-get update benutzen, um alle in der /etc/apt/sources.list eingetragenen Paketquellen neu einzulesen: Installierte Pakete auf verbesserte Version aktualisieren Um alle auf dem System installierten Pakete auf die aktuelle Version zu bringen, können wir den Befehl apt-get upgrade benutzen. Wir können die -u Option verwenden, um die vollständige Liste der zu aktualisierenden Pakete zu sehen: #icon2947{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon2947:hover{color:;background:;} Es ist wichtig, immer apt-get update vor apt-get upgrade zu benutzen. Installierte Pakete auf verbesserte Version aktualisieren und intelligente Handhabung von Abhängigkeitsänderungen durchführen Wir können den Befehl apt-get dist-upgrade benutzen, um die installierten Pakete auf den neuesten in den Paketquellen verfügbaren Stand zu bringen und zusätzlich die intelligente Handhabung von Abhängigkeitsänderungen mit neuen Versionen von Paketen durchzuführen: Pakete installieren Um ein Paket nach seinem Namen zu installieren, können wir den Befehl apt-get install PAKETNAME benutzen: apt-get sucht die Datenbank für die aktuellste nmap Version und holt sie auf Basis der Informationen in /etc/apt/sources.list. Alle als Abhängigkeit benötigten Pakete werden auch installiert. Pakete deinstallieren Um ein Paket nach seinem Name zu deinstallerien, können wir den Befehl apt-get remove PAKETNAME benutzen: Die Liste der installierten Pakete auf Abhängigkeitsfehler überprüfen Wir können den Befehl apt-get check benutzen, um zu überprüfen, ob sich irgendwelche Unstimmigkeiten in den Paketen finden. Paket-Cache leeren Wir können den Befehl apt-get clean benutzen, um das lokale Verzeichnis, in dem sich die zu installierenden Pakete befinden, zu löschen. Alles außer der lock-Datei wird aus /var/cache/apt/archives/ und /var/cache/apt/archives/partial/ gelöscht. apt-get Aktionen (wie z.B. die Installierung und Deinstallierung von Paketen) sind in der /var/log/dpkg.log Datei eingeloggt:"
