full_description = "Das Dateisystem XFS (Extents File System) ist ein Journaling-Dateisystem, das von der Firma Silicon Graphics (SGI) für ihr IRIX-Betriebssystem entwickelt und später auf Linux portiert wurde. Es ist ein hochperformantes 64-Bit Journaling-Dateisystem, das für den Umgang mit großen Dateien geeignet ist und gute Leistungen auf High-End-Hardware zeigt. Hier sind die Eigenschaften von XFS: 64-Bit Dateisystem hohe Leistungsfähigkeit effiziente Festplattenspeicherverwaltung Unterstützung für Hierarchische Speichersysteme (HSM) Unterstützung für Volume Manager unterstützt Zugriffskontrolllisten unterstützt Disk Quotas unterstützt Blockgrößen von 512 Bytes bis 64 Kibibytes maximale Dateigröße 8 EB maximale Dateisystemgröße 16 EB maximale Dateinamenlänge 255 Bytes #icon8324{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon8324:hover{color:;background:;} Man kann ein XFS-Dateisystem nur vergrößern und nicht verkleinern."
