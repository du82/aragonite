["https://geek-university.com/ccna-security/hacking-methodology"]
title = "Hacking methodology | CCNA Security#"
description = "This article describes the steps of a typical hacking process."
full_description = "Although there is no specific step-by-step methodology used by all hackers, a typical hacking process comprises of the following steps: Footprinting – the process of using passive methods of gaining information about the target system prior to performing the attack. The interaction with the target system is kept at minimum in order to avoid detection and alert the target about the attack. The footprinting can reveal vulnerabilities of the target system and improve the ease with which they can be exploited. Various methods are employed for footprinting, for example whois queries, Google searches, job boards search, network enumeration, operating system identification, etc. Scanning – the process of taking information obtained from the footprinting phase in order to target the attack more precisely. Some of the metods used in this phase are port scans, ping sweeps, operating systems detection, observation of facilities used by the target, and so on. Enumeration – the process of extracting more detailed information about the information obtained during the scanning phase to determine its usefulness. Some of the methods used in this step are user accounts enumeration, SNMP enumeration, UNIX/Linux enumeration, LDAP enumeration, NTP enumeration, SMTP enumeration, DNS enumeration, etc. System hacking – the process of planning and executing the attack based on the information obtained in the previous phases. In this phase the attacker performs the actual hacking process using hacking tools. Escalation of privilege – the process of obtaining privileges that are granted to higher privileged accounts than the attacker broke into originally. The goal of this step is to move from a low-level account (such as a guest account) all the way up to administrator. Covering tracks – the process of removing any evidence of the attacker’s presence in a system. The attacker purges log files and removes other evidence needed for the owner of the system to determine that an attack occured. Planting backdoors – the process of securing unauthorized remote access to a computer, so the attacker can access the system later without being detected. Backdoors are usually computer programs that give an attacker the remote access to a targeted computer system."
author = "Geek University"
year_published = 2025
