["https://geek-university.com/linux-deutsch/arbeiten-mit-dateien"]
title = "Arbeiten mit Dateien | Linux Deutsch#"
description = "Dieser Artikel beschreibt die touch, rm und less Befehle."
full_description = "Linux-Shell bieten einfache, aber leistungsfähige Werkzeuge für die Manipulation von Dateien. Sie können genauso wie bei Verzeichnissen eine Datei verschieben, umbenennen oder löschen. Wenn eine Datei eine Textdatei ist, können Sie auch Werkzeuge verwenden, um sie zu bearbeiten. In diesem Artikel werden wir ein paar Befehle beschreiben, die Ihnen helfen, mit Dateien in einer Linux-Umgebung zu arbeiten. Erstellen von Dateien Es gibt mehrere Möglichkeiten, eine Datei in Linux zu erstellen. Der häufigste Weg, eine Datei in Linux zu erstellen, ist der touch Befehl . Obwohl der primäre Zweck dieses Befehls ist, den Zeitstempel einer Datei zu aktualisieren, wird er oft verwendet, um eine Datei zu erstellen. Die Syntax ist einfach: Sie geben einfach touch gefolgt vom Namen der Datei ein. Wenn die Datei nicht existiert, wird eine neue leere Datei erstellt. Ein Beispiel: Wie Sie im Bild oben sehen können, wird eine Datei namens new_file erstellt. Löschen von Dateien Um eine Datei zu löschen, verwendet man den rm Befehl . Die Syntax des Befehls ist: rm DATEINAME Hier ein Beispiel: Das obige Bild zeigt uns, dass eine Datei namens new_file gelöscht wurde. Anzeigen des Inhalts einer Datei Es gibt viele Werkzeuge in Linux, die das Anzeigen des Inhalts einer Datei ermöglichen. Eins der am häufigsten verwendeten ist das Programm less. Dieses Programm gibt Daten auf die Terminal-Größe zugeschnitten aus. Sie können die Datei mit den Pfeiltasten oder dem Mausrad navigieren. Die Nutzung ist einfach: geben Sie einfach den Befehl less ein, gefolgt mit dem Namen der Datei, die Sie anzeigen möchten: Im Bild oben ist der Inhalt der Datei mit dem Namen textfile.txt zu sehen."
