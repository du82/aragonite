description = "Dieser Text beschreibt, wie man Dateisysteme in Linux anpassen kann."
full_description = "Um die Dateisystemparameter eines ext2-, ext3- oder ext4-Dateisystems anzupassen, benutzt man den Befehl tune2fs. Die Syntax des Befehls ist einfach: Geben Sie tune2fs gefolgt von der Option und dem Namen des Dateisystems ein. Hier ist eine Liste von tune2fs Optionen: -c NUMMER – ein ext2-, ext3- oder ext4-Dateisystem muss nach einer gewissen Anzahl von Mountvorgängen überprüft werden. Die -c Option stellt die Anzahl der maximalen Mountvorgänge zwischen zwei Dateisystemchecks ein. -i INTERVALL [d|m|w] – stellt das maximale Intervall zwischen zwei Dateisystemchecks ein. -j – fügt dem Dateisystem ein Journal hinzu, was ein ext2-Dateisystem in ext3 konvertiert. -l – gibt den Inhalt des Superblocks aus, der die Eigenschaften des Dateisystems beschreibt. -f – mit dieser Option kann man Fehler, die beim Ausführen von tune2fs aufgetreten sind, ignorieren und tune2fs dennoch ausführen -m – stellt ein, wieviel Prozent des Dateisystems reserviert bleiben soll -L – stellt das Volume-Label des Dateisystems ein. Ein Beispiel. Um die Anzahl der maximalen Mountvorgänge zwischen zwei Dateisystemchecks auf die /dev/sdc1 Partition auf 30 zu verändern, benutzt man den folgenden Befehl: #icon1092{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon1092:hover{color:;background:;} Es wird nicht empfohlen, tune2fs auf eingebundene Partitionen anzuwenden. Um die Dateisystemparameter eines xfs-Dateisystems anzupassen, benutzt man den Befehl xfs_admin. Hier ist eine Liste von Optionen, die mit xfs_admin benutzt wird: -l – zeigt das aktuelle Label. -L – setzt das Label. -U – setzt den UUID. Um beispielsweise das aktuelle Label eines xfs-Dateisystems anzuzeigen und dann ein neues Label zu setzen, benutzt man den folgenden Befehl: #icon3036{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon3036:hover{color:;background:;} Ein Dateisystem muss man aushängen, bevor man xfs_admin benutzt."
