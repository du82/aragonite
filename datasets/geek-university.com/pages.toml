["https://geek-university.com/linux-deutsch/dateisystem-fat"]
title = "Dateisystem FAT | Linux Deutsch#"
description = "Dieser Artikel beschreibt das Dateisystem FAT und seine Eigenschaften."
full_description = "Das Dateisystem FAT (File Allocation Table) ist ein Dateisystem, das von Microsoft entwickelt wurde. Es wurde in MS-DOS und Windows 9x/ME benutzt. Unter Linux wird VFAT, eine Erweiterung des FAT-Formats, vollständig unterstützt. Es gibt drei Varianten, die sich vor allem hinsichtlich der unterstützten Datenträgergröße unterscheiden: FAT12, FAT16 und FAT32. Mit FAT12 sind 212 Cluster adressierbar, mit FAT16 216 und mit FAT32 228. Alle Varianten haben aber dasselbe Manko: Es gibt kein Berechtigungskonzept (wiz z.B. bei NTFS) und jeder hat Zugriff auf alle Dateien. Obwohl FAT nicht die gleiche Leistung wie einige modernen Dateisysteme bietet, hat es einen großen Vorteil: fast jedes Betriebssystem (Linux, Mac OS usw.) kann mit diesem Dateisystem umgehen. Deswegen kommt FAT heute vor allem noch bei externen Festplatten, USB-Sticks oder Digitalkameras zum Einsatz vor. Die meisten externen Festplatten und USB-Sticks werden FAT-formatiert ausgeliefert. FAT32 unterstützt eine maximale Dateigröße von 4 GB und eine maximale Dateisystemgröße von 8 TB. #icon6433{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon6433:hover{color:;background:;} Dateinamen in FAT können bis zu acht Zeichen lang sein, dann folgen ein Punkt als Trennzeichen und eine Dateinamenserweiterung von bis zu drei Zeichen Länge (z.B. textfile.txt)."
