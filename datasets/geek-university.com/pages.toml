["https://geek-university.com/linux-deutsch/arbeiten-mit-verzeichnissen"]
title = "Arbeiten mit Verzeichnissen | Linux Deutsch#"
description = "Dieser Artikel beschreibt die Befehle mkdir, mv, rmdir und rm."
full_description = "Ein Verzeichnis ist ein Ort zum Speichern von Dateien auf einem System. Um Ihre Linux-Distribution zu verwalten, müssen Sie mit Befehlen vertraut sein, die Ihnen das Erstellen, Löschen oder Verschieben von Verzeichnissen ermöglichen. In Linux gibt es ein Root-Verzeichnis (durch einen Schrägstrich vertreten, /), und alle Dateien und Unterverzeichnisse werden unter dem Root-Verzeichnis in einer baumartigen Struktur angeordnet: Um ein Verzeichnis zu erstellen, verwenden Sie den mkdir Befehl : Um ein Verzeichnis zu verschieben, benutzt man der Befehl mv mit zwei Parametern. Der erste Parameter ist das Verzeichnis, das Sie verschieben möchten und der zweite Parameter ist der Ort, an den Sie das Verzeichnis verschieben möchten. Wenn wir zum Beispiel das Verzeichnis mit dem Namen my_folder zum /home/bob/my_folder1 verschieben möchten, werden wir den folgenden Befehl eingeben: Um ein Verzeichnis zu löschen, verwendet man den rmdir Befehl . Es gibt aber ein Problem mit diesem Befehl. Wenn wir versuchen, ein nicht-leeres Verzeichnis zu löschen, bekommen wir eine Fehlermeldung: Um dies zu vermeiden, müssen wir entweder das Verzeichnis leeren oder wir benutzen den Befehl rm. Wenn wir den Befehl rm verwenden, müssen wir auch die -r Option eingeben. Mit dieser Option können wir das Verzeichnis und dessen Inhalt rekursiv entfernen."
