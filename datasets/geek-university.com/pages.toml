["https://geek-university.com/ccna/automatic-private-ip-addressing-apipa"]
title = "Automatic Private IP Addressing (APIPA) | CCNA#"
description = "This article explains APIPA, a feature in Windows operating systems that enables hosts to automatically self-configure an IP address if the DHCP server isn't available."
full_description = "Automatic Private IP Addressing (APIPA) is a feature in Windows operating systems that enables computers to automatically self-configure an IP address and subnet mask when their DHCP server isn’t reachable. The IP address range for APIPA is 169.254.0.1-169.254.255.254, and the subnet mask is 255.255.0.0. When a DHCP client boots up, it looks for a DHCP server in order to obtain network parameters. If the client can’t communicate with the DHCP server, it uses APIPA to configure itself with an IP address from the APIPA range. This way, the host will still be able to communicate with other hosts on the local network segment that are also configured for APIPA. #icon4062{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon4062:hover{color:;background:;} If your host is using an IP address from the APIPA range, there is usually a problem on the network. Check the network connectivity of your host and the status of the DHCP server. The APIPA service also checks regularly for the presence of a DHCP server (every three minutes). If it detects a DHCP server on the network, the DHCP server replaces the APIPA networking addresses with dynamically assigned addresses."
author = "Geek University"
year_published = 2025
