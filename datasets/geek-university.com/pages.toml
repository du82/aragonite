["https://geek-university.com/linux-deutsch/arten-von-zugriffsrechten"]
title = "Arten von Zugriffsrechten | Linux Deutsch#"
description = "Dieser Artikel beschreibt die Arten von Zugriffsrechten in Linux: Lesen, Schreiben und Ausführen."
full_description = "Zugriffsrechte in Linux werden entworfen, um Benutzern den Zugriff auf private Dateien der anderen User zu verbieten und wichtige Systemdateien zu schützen. Es gibt drei Arten von Zugriffsrechten: Lesen – der User kann die Datei lesen. Das Leserecht für ein Verzeichnis bedeutet, dass der Benutzer den Inhalt des Verzeichnisses auflisten kann. Schreiben – der User kann die Datei modifizieren. Das Schreibrecht für ein Verzeichnis bedeutet, dass der Benutzer die Dateien im Verzeichnis anlegen und löschen kann. Ausführen – der User kann die Datei ausführen. Das Ausführrecht für ein Verzeichnis bedeutet, dass der Benutzer den Inhalt einer Datei, deren Dateiname bekannt ist, anzeigen kann, doch den Inhalt des Verzeichnisses nicht auflisten kann. Es gibt drei Arten von Benutzern: Benutzer – bestimmt, was der Eigentümer der Datei mit der Datei tun kann Gruppe – bestimmt, was Mitglieder der Gruppe der Datei mit der Datei tun können andere Benutzer – bestimmt, was jeder andere auf dem Linux-System mit der Datei machen kann Sie setzen das Leserecht, Schreibrecht oder Ausführrecht für jede Art von Benutzern. Sie können beispielsweise dem Eigentümer der Datei alle Berechtigungen (lesen, schreiben und ausführen) für die Datei geben, der Gruppe nur das Leserecht und Schreibrecht und allen anderen jede Art von Zugriff verweigern."
