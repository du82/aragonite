title = "Dateisystem ReiserFS | Linux Deutsch#"
description = "Dieser Artikel beschreibt das Dateisystem ReiserFS und seine Eigenschaften."
full_description = "Das Dateisystem ReiserFS ist ein Journaling-Dateisystem, das von Hans Reiser und der Firma Namesys entwickelt wurde. Es unterliegt der General Public License (GPL). ReiserFS wird oftmals für Logical Volumes oder RAID-Systeme eingesetzt. Es ist besonders gut bei der Handhabung von vielen kleinen Dateien und bietet eine bessere Festplattenspeicherverwaltung. Es ist das Standarddateisystem für Elive, Xandros, Linspire und GoboLinux. ReiserFS unterstützt eine maximale Dateigröße von 8 TB, eine maximale Dateisystemgröße von 16 TB und eine maximale Dateinamenlänge von 4032 Bytes. #icon3683{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon3683:hover{color:;background:;} Die Weiterentwicklung des ReiserFS stagniert seit längerer Zeit, weil der Chefentwickler Hans Reiser inhaftiert ist."
