["https://geek-university.com/a-short-introduction-to-alarm-systems"]
title = "A short introduction to… Alarm systems | ASI#"
description = "This article describes a simple home alarm system."
full_description = "With the ever increasing number of burglaries and theft there is a growing need for anti-burglary alarm systems. These systems are designed to detect when something is amiss, deter and detect the threat, and alert the proper authorities so they can then respond quickly. Some of the benefits of using an alarm system in your home are: protection – an alarm system protects your property and those inside it from burglary, home intrusion, fire, and other environmental disasters. deterrent to burglars – visible signs of an alarm system, such as stickers, yard signs, and outdoor sirens have been proven to deter a burglar. peace of mind – with a home security system installed, you can achieve some peace of mind knowing that your home is protected whether you’re at work or sleeping soundly. With modern security systems connected to the internet, you can also check in on your system from anywhere in the world using mobile phone apps. lower homeowner’s and renter’s insurance – having a home security system means you are at a lower risk of having a theft or burglary. Insurance companies will often lower your homeowners insurance rates because of this decreased risk of incurring a loss. Alarm system components Alarm panel An alarm panel is the “brain” of the system. All the other parts of the alarm system are connected to it. It is used to power the installed components, process the data received from them, and forward the emergency call to the relevant agencies. An alarm panel is usually stationed in a hard-to-reach place (e.g. a cellar) to prevent the burglars from disabling it. Keypads The main interface between you (the end user) and your alarm system. They accept commands through the keys, and output information using a visual display and audible tones. Sensors Used to detect the burglary as early as possible. Wired or wireless IR detectors detect motion by measuring infrared (IR) light radiating from objects and are commonly used indoors. Magnetic contacts or window breakage detectors detect door or window breakage. You can also integrate some other types of detectors such as a fire detector or a smoke detector to alert the fire department immediately in the event of a fire. Communication devices Used to notify an end user when a burglary is detected. Broadly speaking, there are two types of notifications: personal notification – an end user will receive a notification when a burglary is detected. One example would be an SMS or a phone call sent to an end user’s mobile phone. alarm monitoring services – a relevant agency will receive the notification about burglary. Your alarm panel registers an emergency event and sends a signal to the central monitoring station, where the appropriate authorities are notified and sent to your home. #icon382{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon382:hover{color:;background:;} The communication between the alarm panel and the owner or a security service is usually achived using traditional telephone lines. Newer system also support alarming via GSM, GPRS, or IP network. Sirens Sirens can be audible or visual (a strobe light). Sirens work by generating a loud, piercing sound when they’re triggered by intruders in and around your home. How does an alarm system work? The following image explains a simple alarm system: As see from the image above, all alarm system components are connected to the alarm panel. The keypad is used to manage the system. PIR and magnetic contact detect the burglary in progress and notify the panel. The siren emits an alarm to alert people to an intrusion. The communication device sends the notification to the end user or the monitoring station #icon806{font-size:20px;background:;padding:0px;border-radius:0px;color:;} #icon806:hover{color:;background:;} Some alarm system support wireless communication between the panel and its components. They are commonly used at sites where the wiring is not available."
