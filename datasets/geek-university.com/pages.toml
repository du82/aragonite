["https://geek-university.com/linux-deutsch/dateisystem-ext3"]
title = "Dateisystem ext3 | Linux Deutsch#"
description = "Dieser Artikel beschreibt das Dateisystem ext3 und seine Eigenschaften."
full_description = "Das Dateisystem ext3 (Third Extended File System) ist ein Dateisystem für den Linux-Kernel. Dieses Dateisystem verknüpft die bekannten und stabilen Eigenschaften des ext2 mit einem Journal. Ein Journal ist eine Dateistruktur, in die Metadaten geschrieben werden, bevor sie auf das tatsächliche Dateisystem geschrieben werden. Ein Journal ermöglicht es, ein Dateisystem nach einem plötzlichen Systemabsturz in einem konsistenten Zustand zu erhalten. ext3 ist robust, schnell und für alle Einsatzbereiche geeignet. Es war jahrelang das Standard-Dateisystem für Linux, aber ext4 hat in den letzten Jahren seinen Platz übernommen. ext3 unterstützt eine maximale Dateigröße von 2 TB, eine maximale Dateisystemgröße von 16 TB und eine maximale Dateinamenlänge von 255 Bytes. ext3-Dateisysteme sind rückwärts kompatibel und können im ext2-Modus gemountet werden."
