title = "Define queue members in queues.conf | Asterisk#"
description = "This article explains how to define queue members in queues.conf in Asterisk."
full_description = "Another way to add members to a queue is by defining them in the queues.conf file. A member defined this way will always be logged into the queue, which is not really practical and is the reason why this method of adding queue members is not used very often. Members are defined within each queue definition. For example, to add a member to our queue marketing we’ve created earlier, we would use the following code: [marketing](queue_template) member => SIP/bob Reload the queues.conf file using the module reload app_queue.so command. We can use the Asterisk CLI command queue show marketing to verify that the member has indeed been added: geek-university*CLI> queue show marketing marketing has 0 calls (max unlimited) in 'rrmemory' strategy (0s holdtime, 0s talktime), W:0, C:0, A:0, SL:0.0% within 0s Members: SIP/bob (ringinuse disabled) (Not in use) has taken no calls yet No Callers"
