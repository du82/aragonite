full_description = "Das Advanced Packaging Tool (APT) ist ein Paketverwaltungssystem, ursprünglich entwickelt als ein Frontend für dpkg. APT erlaubt die in den Repositorys enthaltenen Softwarepakete zu verwalten, zu installieren und zu aktualisieren. APT besteht aus einer Programmbibliothek und mehreren diese Bibliothek nutzenden Kommandozeilen-Programmen. Zwei der am häufigsten verwendeten Programme sind: apt-cache – liefert Informationen über die Debian-Paketdatenbank. apt-get – verwendet für Installation, Aktualisierung oder Deinstallation von Softwarepaketen. Mehrere Frontends für APT existieren, die erweiterte Funktionenen und intuitive Schnittstellen bieten. Dazu gehören: Synaptic Package Manager – GTK + grafische Benutzerschnittstelle. Ubuntu Software-Center – eine vom Ubuntu-Projekt entwickelte GTK+ grafische Benutzerschnittstelle. aptitude – eine Konsole Client mit CLI. KPackage – Teil von KDE. Das Ubuntu Software-Center sieht so aus:"
