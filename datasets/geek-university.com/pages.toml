full_description = "Es gibt neun Berechtigungsbits, die steuern, wer den Dateiinhalt lesen, schreiben und ausführen darf. Die ersten drei Bits bestimmen die Berechtigungen für den Eigentümer der Datei. Die nächsten drei Bits bestimmen die Berechtigungen für die Mitglieder der Gruppe der Datei. Die letzten drei Bits bestimmen die Berechtigungen für andere Benutzer auf dem System: Um die Berechtigungsbits einer Datei anzuzeigen, können Sie den Befehl ls -l benutzen: Im obigen Beispiel können Sie sehen, dass die Berechtigungsbits für den Eigentümer auf “rw-“, auf “rw” für die Gruppe und auf “r” für alle anderen andere Benutzer gesetzt sind (ignorieren Sie den ersten Bindestrich (“–”) auf der linken Seite). Wie Sie wahrscheinlich erraten können, steht r für Read (lesen), w für Write (schreiben) und x für Execute (ausführen, oben nicht dargestellt). Wo Rechte nicht gesetzt sind, steht ein Bindestrich (“–”). Also im obigen Beispiel haben der Eigentümer (root) und die Gruppe bob das Leserecht und Schreibrecht und alle anderen haben nur das Leserecht. Das Ausführrecht hat niemand."
