title = "What is Pass-the-Hash Attacks and How to Stop Them"
description = "Pass-the-hash (PtH) attacks can be devastating for your security. Learn about PtH attacks and discover effective strategies to prevent them."
full_description = '''Security Advertiser disclosure We may earn a commission from partner links, which help us to research and write; this never affects our reviews and recommendations. Learn more. What is Pass-the-Hash Attacks and How to Stop Them Last updated: January 22, 2025 Share on: Twitter Facebook LinkedIn WhatsApp Geekflare articles are written by humans for humans. Tejal Sushir Tejal Sushir Contributor Tejal is an experienced B2B SaaS content writer for e-commerce and marketing, specializing in web hosting, AI and ML, cloud and cybersecurity, SEO and digital marketing. She holds a B.E. in electronics and telecommunications engineering and enjoys reading fiction novels, marketing and entrepreneurship newsletters, and Twitter feeds from credible SEO authors when she’s not writing. Contributor <img alt='Narendra Mohan Mittal' src='https://i.geekflare.com/cdn-cgi/image/width=80,height=80,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2023/06/Narendra-80x80.jpg' srcset='https://i.geekflare.com/cdn-cgi/image/width=160,height=160,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2023/06/Narendra-160x160.jpg 2x' class='avatar avatar-80 photo' height='80' width='80' decoding='async'/> Narendra Mohan Mittal <img alt='Narendra Mohan Mittal' src='https://i.geekflare.com/cdn-cgi/image/width=80,height=80,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2023/06/Narendra-80x80.jpg' srcset='https://i.geekflare.com/cdn-cgi/image/width=160,height=160,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2023/06/Narendra-160x160.jpg 2x' class='avatar avatar-80 photo' height='80' width='80' decoding='async'/> Narendra Mohan Mittal Editor Narendra Mohan Mittal is a senior editor at Geekflare. He is an experienced content manager with extensive experience in digital branding strategies. Editor Pass-the-hash attack is a type of cyberattack that has gained significant attention in lately digital environment. In a pass-the-hash (PtH) attack, hackers exploit hashed passwords or hashed user login credentials to gain unauthorized access to systems. PtH attacks have become a serious concern, as they allow cyber attackers to gain unauthorized access to systems and sensitive or confidential information. It is crucial to understand the mechanics of PtH attacks and take appropriate preventive measures to protect against them. For those unfamiliar with pass-the-hash attacks and hashed passwords, follow this guide to learn more about how pass-the-hash attacks work, including real-life examples and suggested measures to mitigate PhH attacks. Understanding Pass-the-Hash (PtH) Attacks A pass-the-hash (PtH) attack occurs when the cyber attacker steals the hashed user credential or password hash and uses it to deceive an authentication system into generating a new authenticated session on the same network. Once the cyber attacker gains access to the entire attack surface or systems, they can perform various malicious activities, compromise sensitive data, or even escalate their privileges within the system. <img decoding="async" width="900" height="600" src="https://geekflare.com/wp-content/uploads/2024/02/Understanding-Pass-the-Hash-Attacks.jpg" alt="Understanding-Pass-the-Hash-Attacks" class="wp-image-332860" srcset="https://i.geekflare.com/cdn-cgi/image/width=900,height=600,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Understanding-Pass-the-Hash-Attacks.jpg 900w, https://i.geekflare.com/cdn-cgi/image/width=435,height=290,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Understanding-Pass-the-Hash-Attacks-435x290.jpg 435w, https://i.geekflare.com/cdn-cgi/image/width=213,height=142,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Understanding-Pass-the-Hash-Attacks-213x142.jpg 213w, https://i.geekflare.com/cdn-cgi/image/width=338,height=225,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Understanding-Pass-the-Hash-Attacks-338x225.jpg 338w" sizes="(max-width: 900px) 100vw, 900px" /> But what does password hash mean exactly? A password hash is the encrypted version of your password. When you set a system password, the operating system calculates a hash for the password using a mathematical formula. Instead of storing the actual password, the system stores the password hash. Thus, in pass-the-hash, the cyber attacker doesn’t need to know the user’s actual password; instead, they just need the stored password hash to break through and gain unauthorized access to any user’s account. Hence, for a hacker, having access to a password hash is equivalent to having access to an actual user password. How Pass-the-Hash Attacks Work <img decoding="async" src="https://lh7-us.googleusercontent.com/pAbHCD1GhTUmLA0OrE6wwKwHvhUEbv-4KpFbfI_lnlBCdJY12U2jUfEaFOlVjMceyklktzWkni5oK4TRDk6Mg-PCpj6dEwZuUEBPp_gVIpIrpTIhTeKexP2Tw06uXiZQp5h2tMKsJqs10meYwf1M6sc" alt="How do Pass the Hash attacks work?" /> Pass-the-hash attacks exploit vulnerabilities in privileged accounts, enabling unauthorized access to critical systems and potentially compromising the entire network infrastructure. Here is the step-by-step process that cyber attackers follow to perform pass-the-hash attacks. Initially, the hacker uses malware or social engineering techniques, like phishing, to gain access to a user’s account or device. Once hackers access the account, they use various specialized tools and techniques to scrape the active memory that helps derive data that leads them to password hashes. Once they successfully find password hashes, hackers pass the hash from one login to another, exploiting the single-sign-on technology, creating authenticated sessions, impersonating legitimate users, and creating a lateral movement across the network. With this lateral movement, hackers continue stealing hashes throughout the network in the hope of finding and exploiting hashes of user accounts with more business privileges within the business network. Accessing the password hash of a privileged user account and administrative access provides hackers access to much more confidential information and files and greater access to the network and its data. Once hackers find the data they’re looking for, they carry out malicious cyberattacks, such as identity theft, ransomware, or other types of data breaches. <img decoding="async" width="894" height="505" src="https://geekflare.com/wp-content/uploads/2024/02/Key-Components-of-Pass-the-Hash-Attacks.jpg" alt="Key-Components-of-Pass-the-Hash-Attacks" class="wp-image-332864" srcset="https://i.geekflare.com/cdn-cgi/image/width=894,height=505,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Key-Components-of-Pass-the-Hash-Attacks.jpg 894w, https://i.geekflare.com/cdn-cgi/image/width=513,height=290,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Key-Components-of-Pass-the-Hash-Attacks-513x290.jpg 513w, https://i.geekflare.com/cdn-cgi/image/width=251,height=142,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Key-Components-of-Pass-the-Hash-Attacks-251x142.jpg 251w, https://i.geekflare.com/cdn-cgi/image/width=398,height=225,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Key-Components-of-Pass-the-Hash-Attacks-398x225.jpg 398w" sizes="(max-width: 894px) 100vw, 894px" /> Key Components of Pass-the-Hash Attacks Pass-the-hash attacks involve capturing hashed login credentials instead of stealing plaintext passwords. To understand how to defend against PtH attacks, it is important to be familiar with their key components and how they are exploited. Here are the key components of pass-the-hash attacks: Password hashes: Cyber attackers steal or capture hashed versions of passwords instead of stealing plaintext passwords to gain unauthorized access to networks or systems. These hashes are fixed-length strings of characters stored in the systems that are unique to the original password. Credential dumping tools: Attacks also use tools like Mimikatz and others that can extract password hashes or plaintext passwords from the LSASS (Local Security Authority Subsystem Service) process to dump these credentials from the compromised systems’ memory. NTLM or Kerberos: Pass-the-hash attacks are commonly associated with Windows environments, such as NT LAN Manager (NTLM) or Kerberos authentication protocols. These protocols store hashed password versions that cyber attackers exploit to access systems. Pass-the-Ticket (PtT) and Pass-the-Key (PtK): Similar to the PtH attacks, cyber attackers also use Pass-the-Key (PtK) or Pass-the-Ticket (PtT) to exploit Kerberos tickets or key material to gain unauthorized access instead of password hashes. Lateral movement: After extracting hashed credentials, cyber attackers use these credentials to move later within the network. This allows them to access different systems or escalate privileges to potentially gain access to more sensitive information. Defense evasion techniques: Cyber attackers use several techniques to evade detection, like detecting logs, disabling security tools, or using cautious methods to move laterally within the network. Overpass-the-hash: In some cases, cybercriminals manipulate or replace the original password hash with a new password hash using the overpass-the-hash technique—ultimately changing the password of the compromised account. Common Attack Vectors of Pass-the-Hash Attacks Privileged accounts, such as those with domain administrator or admin privileges, become prime targets for PtH attacks. Here are some of the common attack vectors cyber attackers use to gain unauthorized access to systems and perform pass-the-hash attacks: Weak authentication protocols Weak default authentication protocols or a lack of multi-factor authentication (MFA) are often susceptible to pass-the-hash attacks. Cyber attackers target these protocols’ vulnerabilities to extract and misuse password hashes and ultimately compromise the particular account. <img decoding="async" src="https://lh7-us.googleusercontent.com/Qf5REuGrN7z6fxVS4X51mTHLXnipQ62g2vdkKcsqpkzc5F9bHvRsWeMxZ9tey4K54NNLQ435biGHXezkBM4kqnaVU0NXrBGTFiAjMro4EfBIc305e_K87itvIpVUg9CuKxEcDtfJBD0J0avDWgrcpuw" alt="Pass the Hash attack vectors" /> Legacy authentication mechanisms Moreover, Cyber attackers also target legacy authentication mechanisms that lack robust authentication protocols. Since these protocols may not necessarily protect password hashes, it makes it much easier and more convenient for cyber attackers to extract them for unauthorized access. Windows operating systems Windows environments, especially the ones utilizing Active Directory, are vulnerable to pass-the-hash attacks. Because of the widespread adoption of Windows operating systems in enterprise environments and their weak authentication mechanisms, Windows OS is the common target vector of PtH attacks. Insider threats Malicious insiders with privileged access to networks and systems pose significant threats to businesses and act as common attack vectors for several cybersecurity attacks, including Pass-the-hash attacks. These insiders abuse their privileges to extract password hashes to either perform PtH attacks themselves or help other attacks to do so. Insecure network communications channels In cases when the network communication channel isn’t adequately protected or encrypted, it makes it easier for cyber attackers to eavesdrop on communications—identifying and extracting hashed passwords and performing PtH attacks. Real-World Examples of Pass-the-Hash Attacks Pass-the-hash attacks have severe impacts and consequences on businesses, from legal liabilities to compliance violations. Organizations can enhance their defense against attacks and protect sensitive information by understanding real-world examples and consequences. Here are some real-world examples of pass-the-hash attacks: #1. The Diaxin Team Attack: “The Patient Data Breach” The data extortion group known as The Diaxin Team stole more than 40 GB of data from Fitzgibbon Hospital in Marshall, MO, in 2022 using a pass-the-hash attack. The stolen data included patients sensitive patient information, such as names, social security numbers, dates of birth, and critical medical records. The hospital has confirmed that this attack impacted over 112,000 patients. <img decoding="async" width="824" height="630" src="https://geekflare.com/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks-824x630.jpg" alt="Real-World-Examples-of-Pass-the-Hash-Attacks" class="wp-image-332863" srcset="https://i.geekflare.com/cdn-cgi/image/width=824,height=630,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks-824x630.jpg 824w, https://i.geekflare.com/cdn-cgi/image/width=379,height=290,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks-379x290.jpg 379w, https://i.geekflare.com/cdn-cgi/image/width=186,height=142,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks-186x142.jpg 186w, https://i.geekflare.com/cdn-cgi/image/width=294,height=225,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks-294x225.jpg 294w, https://i.geekflare.com/cdn-cgi/image/width=990,height=757,fit=crop,quality=90,format=auto,onerror=redirect,metadata=none/wp-content/uploads/2024/02/Real-World-Examples-of-Pass-the-Hash-Attacks.jpg 990w" sizes="(max-width: 824px) 100vw, 824px" /> #2. Electrobas & Copel Attack: “The Utility Company Ransomware” In February 2021, Brazilian electric utilities companies Centrais Electricas Brasileiras (Electrobas) and Companhia Paranaense de Energia (Copel) reported being targeted by ransomware attacks facilitated by the pass-the-hash attack. Malicious actors compromised the Active Directory (AD), specifically the NTDS.dit file, extracting the password hashes. This allowed them to move laterally through the user’s permissions chain until they were able to extract hashes that had permissions enough to pull off ransomware attacks. #3. Windows Themes Attack: “The Malicious Windows Theme Pack” In September 2020, a security researcher uncovered that cybercriminals were distributing malicious Windows 10 theme packs that enable pass-the-hash attacks. These theme packs offer customization options for sounds, wallpapers, colors, and more. Whenever any user clicks on the Windows theme pack, they are directed to a page or resource that requires access to their password hashes, enabling hackers to inte'''
