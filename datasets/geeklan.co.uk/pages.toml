title = "AvailabilityMacros Release Note"
full_description = "The release note describes the C macros provided by the header /usr/include/AvailabilityMacros.h These macros allow you to specify the range of Mac OS X versions on which you expect your program to run. Based on the settings of these macros, the headers of various system frameworks implement constraints that may cause the following effects: *The first three effects require infrastructure provided by GCC 3, but not earlier versions of GCC. Weak symbols require the Mac OS X 10.2 dynamic linker; you cannot use a Mach-O containing weak symbols on a system version prior to Mac OS X 10.2. These macros help to ensure that you are using functions and data types that are optimal for the system versions you wish to support. The AVAILABLE_* macros are not necessary for Objective-C methods because they are dynamically bound. The AvailabilityMacros.h header is included by various framework headers. You can specify the range of system software versions you expect to support by setting the following macros to the predefined values specified below: For example, if you want your application to run on Mac OS X 10.1 or any later version, you could add the following to the C compiler command line:"
