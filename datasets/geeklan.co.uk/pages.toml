title = "GeekLAN – What do you want to crash today?"
description = "What do you want to crash today?"
full_description = "Posted on 03/11/202403/11/2024Western Digital SSDs and legacy Macs I entered the rabbit hole when I managed to get hold of a 20″ iMac G5 (iSight) a while back.This model had a very short life span at the time. Announced October 2005 and discontinued around February 2006 when successor Intel based models were announced. Supposedly these systems can actually support 4.5GB RAM by installing a 4 GB Samsung 2Rx4 PC2-6400U-666 dimm according to Everymac. My intention was to get an SSD installed in the machine and max out the RAM to 4.5GB in order to have a fast build system that wouldn’t weigh a tonne (PowerMac G5).Since the K2 SATA controller from the Serverworks chipset Apple used for these systems is SATA I, I thought I’d just get the largest capacity disk for the least amount of money rather than anything fast since the system couldn’t make use of it anyway.The 480GB WD Green (WDS480G3G0A) SSDs were really cheap so I went for one of those. Unlike the previous revisions of iMac G5 (original, Ambient Light Sensor), the iSight model is not easily user serviceable.It wasn’t too much of a headache to disassemble but getting it screwed back together again was quite fiddly due to screws being in very tight places After installing the drive, on first attempt, tried to boot the machine off an OS X 10.4.6 DVD and found no SSD was detected.To rule out a dead drive, I tested the WD Green drive in my ThinkPad X230 and the drive was fine. I took the Intel 545S SSD (SSDSC2KW512G8) installed in my ThinkPad and tried to see if the iMac could detect that, but again disk utility on the OS X install env showed no SSD drive on the SATA bus. Searching around, I read various reports about SSDs not working on G5 Macs, PowerMac owners reporting that connecting the drive to the secondary SATA port instead of the primary worked in some cases.Western Digital had previously released a firmware update which “Addresses an issue in which a drive may not be recognized by the computer”, the drive I had came with said firmware version.I also saw a similar report for a firmware update by Toshiba for their hard disk drives “Optimized the timing of SATA negotiation at power-on to allow some specific systems to recognize the HDD after resuming the system from sleep“. By luck booting an OS X 10.5.7 DVD randomly showed the drive as detected in disk utility and I could partition and format the drive just fine. After many reboots and playing in OpenFirmware, I got the best chance of getting the drive detected as booting 10.5.7 install DVD from cold boot, rebooting and there’s a chance the SSD would be in a state that it would be detected, allowing me to install OS X 10.4, 10.5 & eventually booting from the SSD. Totally random. 🙁 I also had an older WD Blue (WDS500G2B0A) drive and tested that, consistently, the iMac was able to detect it.I wondered if was a race issue, looking at the AppleK2SATA driver it does appear to reset the drive when the scan process detects a drive “soft reset the drive in case it hasn't been reset cleanly prior to OS startup“.I wrote an NVRAMRC script to call the system’s proble-all command several times early in boot hoping to trigger the drive to be detected, but instead I ended up with a system which didn’t init the display (I did add a call to install-console). This all happened over the span of a year. During that time, through the fiddling, I managed to blow the PSU, when the LCD panel, which is in a metal enclose, slipped from its resting place when the machine was on its back and landed on the PSU which is open backed, causing it to short out. I bought a new WD Blue (WDS500G3BOA) drive to see if that would work like the older model (WDS500G2BOA vs WDS500G3BOA) drive but again was not detected, so I installed the older drive I already had in the iMac and moved on to the next system. The WD Blue (WDS500G3BOA) drive also has a firmware update like the Green model to address detection issues which again, the new drive was running. The next system was a mid-2007 Intel Mac Mini which also has a SATA I controller as part of its Intel ICH7M chipset. I also installed a 480GB WD Green (WDS480G3G0A) drive there too and booted up its OS X 10.4.10 restore disk. SSD was detected on first try and installed without a hitch, on reboot however the system hung in UEFI at a grey screen. Turns out on the Intel Mac Mini the drive works consistently on power up (cold boot), but fails to boot when rebooted (warm boot). Both systems had no issue resuming from sleep once they’d booted into OS X. Since these were new drives and covered by warranty, I wondered what Western Digital support would say and whether I could raise awareness about another case where the drive was not detected, just out of curiousity.After filing a support request on their website, someone reached out the following day and we discussed the issue over the phone.They were very polite and helpful, as a first step asking whether the drive is detected by the BIOS, and the conversation went sidewards from there 😀 “No, there is no BIOS, it’s a PowerPC machine with OpenFirmware”.I genuinely wasn’t trying to troll them, and didn’t push at all. Really wanted to see if there was any way of discussing the firmware update they’d offered for these drives and following up about that.They offered to RMA a new drive, but that was the limit of what they could do. I was passed off with “we don’t even support systems running Windows 7 with these drives” (as in you have no chance with something from 2005) and that was that. I took the WD Green drive I had installed initially in the iMac G5 and installed it in a late-2009 MacBook to see if the system with an Nvidia MCP79 SATA II controller had the same issue as the Mac Mini and to my surprise after a long pause it actually booted up the Leopard install from the APM formatted drive and it has no issues on subsequent reboots. I always assumed the UEFI env expected GPT. Regarding upgrading the iMac to 4.5GB, though the system may support a 4GB dimm, it’s hard to actually find a compatible dimm. Found plenty of seller adding Samsung or Hyunix in their advert titles, or using photos of them but in the fine print stating that the dimms are generic and often “for AMD only”. I got a Snoamoo 4GB 4R*8 PC2-6400 dimm which definitely does not work. I was hoping to get a full screenshot of the MacBook running Leopard from the SSD but it seems that fullscreen screenshots don’t work and generate a scrambled mess, so here it is as a seed for the scrapers. 😉"
