title = "LD(1)"
full_description = "The ld command combines several Mach-O (Mach object) files into one by combining like sections in like segments from all the object files, resolving external references, and searching libraries. In the simplest case several object files are given, and ld combines them, producing an object file which can either be executed or become the input for a further ld run. (In the latter case, the -r option must be given to preserve the relocation information.) Unless an output file is specified, ld produces a file named a.out. This file is made executable only if no errors occurred during the link editing and there are no undefined symbols. The link editor accepts ``fat'' (multiple-architecture) input files, but always creates a ``thin'' (single-architecture), standard Mach-O output file. The architecture is specified using the -arch arch_type option. If this option is not used, ld(1) attempts to determine the output architecture by examining the first object file encountered on the command line. If it is a ``thin'' file, its architecture determines that of the output file. If the first input file is a ``fat'' file, the ``best'' architecture for the host is used. (See the explanation of the -arch option, below.) The compiler driver cc(1) handles creating fat executables by calling ld(1) multiple times and using lipo(1) to create a ``fat'' file from the results of the ld(1) executions. The object files are loaded in the order in which they are specified on the command line. The segments and the sections in those segments will appear in the output file in the order they are encountered in the object files being linked. All zero fill sections will appear after all non-zero fill sections in their segments. Sections created from files with the -sectcreate option will appear in the output file last. Section names for sections created from files are not allowed to overlap with a section name in the same segment as a section coming from an object file. Sections created from files may be in a segment which has sections from object files and if so will be loaded at the end of the non-zero fill sections for that segment."
