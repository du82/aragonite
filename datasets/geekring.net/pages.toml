["http://geekring.net/site/6/previous"]
title = "One Terabyte of Kilobyte Age | Digging through the Geocities Torrent"
full_description = "It’s February 27, 2025 IRL and January 1, 2009 in One Terabyte of Kilobyte Age timeline. The last year of GeoCities has started. The closure announcement will come on April 23, 2009. Those who follow the project know that we have 381 934 websites in the archive. To the moment we posted screenshots of 279 310 of them. 102 000 left. One can ask how it can be that more than a quarter of the archived pages was last updated in the last 10 months of the Geocities existence? I first found this oddity six years ago, while collecting materials for the post about the 10th anniversary of the closure announcement “Sorry to see you go”. My first thought was that the reason was that after the announcement many rushed to their pages to make the last changes or to leave a farewell note. It did happen, but not on such a scale. A closer examination showed that there are ~ 50 000 pages that were updated in 10 days (in between April 25 and May 5, 2009) and that in these cases “last updated” date was just wrong. the mistake happened while grabbing the files from the server in 2009. The websites are from all the possible years, according to their content and the style. So, if you were following our Tumblr for years and made the slow travel from 1995 to 2009, get ready for a new achronological adventure. But in the meantime: Happy New 2009 ! … continue reading → Those who don’t remember the web before platforms, tend to believe that for 10 years web users stared at their monitors in anticipation. Actually they were made to believe it. First by Web 2.0 proponents, and nowadays by aggressive Web3 campaigns that rewrite the history by stating that Web1 was a dull, passive, read only place. More examples of web3 propaganda: 1, 2, 3, 4. Though, the opposite was the truth, the web before platformization was the place where users owned, wrote and also read. In this post I collected a lot of screenshots that refute the picture or “read only” web before or outside of social networks and hosting services. The websites they represent were tagged by me during the last 13 years as “before_…”. For example “before_ wikipedia”, “before_ebay”, “before_airbnb”. Not all the tags are mentioned here. Also not all the files that we have for a particular tag are represented. I hope it gives an idea of web users being able to organize their own content and provide services to each other. Let’s start with before_instagram … continue reading →"
