["https://geekring.net/site/6/next"]
title = "Space Nerds In Space - A Multi-player Starship Bridge Simulator"
full_description = '''Please consider donating to support development of Space Nerds In Space. <a href="https://liberapay.com/StephenCameron/donate"><img alt="Donate using Liberapay" src="https://liberapay.com/assets/widgets/donate.svg"></a> Or consider contributing code, either to the core codebase, or mission scripts. cmd { font-family: courier } hili { color:#afafff; } This site is a member of the geekring! Check some other geeky websites here: Previous site -- Next site Space Nerds In Space is an open source (GPLv2) cooperative multiplayer starship simulator for linux (may also work on Mac). So go out and get together with a crew of your linux-nerd friends and their computers in a room with a projector or TV, and go forth and explore the galaxy. One computer runs the central server simulation of the game's universe. Each player's computer acts as a station on a simulated spaceship. There are stations for Navigation, Weapons, Engineering, Communications, Damage Control, and the "Main View", an out-the-window 3d rendering. Multiple starships each with their own team may connect to the server for bridge-vs-bridge combat, or for cooperative play. Additionally, a game master may inject and control various NPC ships into the game to entertain the players, and scenarios may be constructed with a Lua based scripting API. You might be reminded of Artemis Spaceship Bridge Simulator, and you would not be out of line, as this game was the inspiration for Space Nerds In Space. Within a month after mentioning Space Nerds In Space publicly, and before I'd gotten very far at all, but about the time I realized that what I was working on might be more than vapor, I wrote to Thom Roberts, expressing my desire to write a linux based spaceship bridge simulator with essentially the same raison d'etra as Artemis (though differing radically in the details), and he replied: Here is a short mini-documentary created at the premier hackerspace of Houston, TX, TX/RX Labs, camera work and editing by Jack Younger. This is from 2013, and the graphics and other aspects of the game are much better now, but this video will still give you a good idea of what the game is all about.'''
