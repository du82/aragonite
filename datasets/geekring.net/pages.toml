["https://geekring.net"]
title = "geekring.net :: Let's webring like it's 1993!"
description = "Ring of geeky websites! Party like it's 1993!"
full_description = "This is a webring for geeks of all sorts, except those who feel excluded by the use of the word geek. If you're a geek, this is for you. This is the old web, in 2024! For all those funny, quirky, interesting, personal, strange, offbeat websites that's not page 1 on the search engines. Everyone here gets a chance to have their site viewed, and everyone will find something they have not seen before! You're here because you're better at surfing the web than most people. If you have your own website, this page could interest you, read on! If you don't, stay awhile and lis... read about the geeky stuff here, or press RANDOM to visit one of the great geeky sites in this ring! Not all sites link back to the ring, so if you don't want to hunt for the banner, use The good old-fashioned frameset version or The new-fangled iframe version Everyone who has a website where making money is not the primary goal. In short, if the site is for selling a product, or otherwise does not contain anything of interest to anyone not looking to pay money for products and services, it won't get in the ring, or will get kicked out. This is the real, good old noncommercial Internet that we vaguely remember. Open source and free software projects are welcome too. You should promote this webring on your site somehow, maybe just link directly to it, or include one of our awesome widgets! Could be! I sometimes ask people with interesting sites to join, most of them don't and that's totally fine too, but yeah, it's been known to happen! Go to https://geekring.net/site/NUMBER/SECRET (replace NUMBER with your sites NUMBER and SECRET with the secret you got when requesting to join. I check up on the pending requests at a fixed interval: Whenever I feel like it. That means it could take anywhere from a day or two, to a few weeks, before I get to your request. When your request is examined, the criterion for whether your site is included are also fixed: Totally depends on my mood, and whether I like your site at that particular day, so don't feel bad if you're not included. About 90% of all applicants are currently accepted."
