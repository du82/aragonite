["https://geekstammtisch.de/13-gst026-rubyconf-2013"]
title = "GST026 - RubyConf 2013 - Geekstammtisch - Podcast"
description = """
Lucas und Dirk waren auf der RubyConf in Miami Beach. Wir
berichten von ihren Eindrücken und es gibt natürlich die ein oder andere
Empfehlung für einen Vortrag. Darüber hinaus diskutieren wir über die Inhalte einiger Talks.
Insgesamt ist die Folge leider ein bisschen durcheinander, trotzdem viel Spaß beim hören."""
full_description = '''GST026 - RubyConf 2013 <span>2013-11-25 10:19:48 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Intro (00:00:00) Wir trinken Mühlen Kölsch! http://www.muehlenkoelsch.de/ Der Lucas ist dabei! Und es ist das fünfte mal :) http://geekstammtisch.de/#GST006 http://geekstammtisch.de/#GST008 http://geekstammtisch.de/#GST013 http://geekstammtisch.de/#GST021 RubyConf 2013 Miami Beach: http://rubyconf.org/ Heutiger Titelsong: Miami Vice: http://en.wikipedia.org/wiki/Miami_Vice Exkurs: Letzter Geekstammtich über Lisp (00:02:35) Allgemein gutes Feedback und Lucas fand es auch gut JavaScript Lisp Implementationen (von @DerGuteMoritz): http://ceaude.twoticketsplease.de/js-lisps.html Hygienische Makros: http://en.wikipedia.org/wiki/Hygienic_macro RubyConf (00:04:15) Dirk und Lucas waren da! Comic-Con in San Diego: http://www.comic-con.org/ Die Location war ganz cool, WiFi leider nicht so RubyConf Schedule gibt es hier in einer Übersicht: http://rubyconf.org/schedule Allgemeines (00:07:00) Talks wurden gestreamt Videos gibt es gegen Ende November Dirk und Lucas müssen auch noch Talks schauen (3 Tracks ist halt zu viel) Anfangs gab es im Schedule keine Angabe der Speaker; wurde dann aber nachgetragen Talks, Talks, Talks (00:09:25) The Big Picture (Jim Weirich): http://rubyconf.org/program#jim-weirich Keynote Tag 1 von Matz über Phantasie Land, Außenwahrnehmung, Wahrnehmung, eher verwirrend... also, wie immer :) That's Not Very Ruby of You (Keynote Tag 3), Ernie Miller: http://rubyconf.org/program#ernie-miller My KidsRuby Journey (Keynote Tag 2), PJ & Katie Hagerty: http://rubyconf.org/program#pj-katie-hagerty Es gab viel zu Ruby 2.1 (kommt am 25.12.2013) Object management on Ruby 2.1, Koichi Sasada: http://rubyconf.org/program#koichi-sasada Neue C-API für Garbage Collection: Es wird diesmal weniger auf Kompatibilität geachtet und mehr auf Effizienz Allgemein ist es recht schwer Ruby radikal weiterzuentwickeln Kurz Thema bei der abschließenden Fragerunde mit Matz: Rubinius X und Ruby JRuby (00:34:29) Nächster Release wird definitiv JRuby 9000 heißen Vorstellung eines verbesserten Entwicklungsprozesses Talk von Tom Enebo und Charles Nutter: http://rubyconf.org/program#tomenebo-charles-nutter Überlegungen ob Java 6 Unterstützung mit dem nächsten Release entfernt wird, abhängig von Community-Feedback Sehr viel aufräumen innerhalb der Code-Basis, vor allem viel wird viel gelöscht ^^ Keine News zu FFI, aber da ist ja eh wieder alles in Ordnung: https://github.com/ffi/ffi/issues/288 In JRuby soll kein FFI verwendet, sondern die native Java-Bibliothek (wie etwa nokogiri) Release von JRuby 9000 im ersten Quartal 2014 Insgesamt hatte der Talk aber wenig neues gegenüber den bisherigen Talks diesen Jahres Viel interessanter zu JRuby war aber ein Gespräch mit einem der Sponsoren: Money Desktop, http://www.moneydesktop.com Mehrere hundert Server mit JRuby Extrem parallel Protocol Buffers (https://code.google.com/p/protobuf/) Serialisierungsformat PCI-compliant (http://en.wikipedia.org/wiki/PaymentCardIndustryDataSecurity_Standard) und trotzdem nahezu kontinuierliches Deployment (10-20/Tag) ArangoDB auf der RubyConf (00:47:55) Lucas hat einen Lightning Talk gehalten: Hamster und Graphen - https://speakerdeck.com/moonglum/graphs-plus-hamsters Es um das Graphenfeature von ArangoDB, erklärt am Beispiel von einem Hamster, der sein Futter in seinem Bau zählen muss Das Thema gab es kurz vorher auch auf der NoSQL Usergroup in Köln: http://www.nosql-cologne.org/2013/10/07/26th-meeting-november/ Graphtraversal API ist noch nicht in im Ruby-Treiber integriert Graphtraversal ist in ArangoDB in Javascript implementiert, daher kann man sie nicht einfach von mruby aus ansprechen Und noch mehr interessante Talks (00:53:40) Ruby-Core Dilemmas von Marc-André Lafortune: http://rubyconf.org/program#marcandré-lafortune Basti und Dirk kannten das Backport nicht: http://rubygems.org/gems/backports Entwicklung von Backport gegen RubySpec (http://rubyspec.org) "Es ist ein Bug oder Feature, wenn Matz sagt es ist ein Bug oder Feature" Im Grunde sollte er dafür auch Geld nehmen (für Pro-User) "The tricky truth about parallel execution and modern hardware": http://rubyconf.org/program#dirkjan-bussink Insgesamt zu kurze Pausen (10 min) zwischen den Talks Abendveranstaltung und RailsGirls (00:59:27) Keine offiziellen Abendveranstaltung Am Tag vor der RubyConf waren RailsGirls, die alle kostenlos zur Konferenz konnten Dadurch recht viele Frauen Guter Lightning Talk von einer Teilnehmerin adressiert an Mentoren Passend zu dem Thema von Floor Drees: http://floordrees.tumblr.com/post/58784746482/what-i-learned-learning-rails-becoming-a-better Am zweiten Abend haben Lucas und Dirk das Boardgame Meeting leider verpasst :-( Und noch mehr Talks (01:03:26) Der Talk von Jim Weirich zu UML: http://rubyconf.org/program#jim-weirich UML ist nicht immer schlecht, es gibt auch sinnvolle Anwednungsfälle ^^ Von Andrew Havens - Build your own Ruby-powered Arcade Machine! (http://rubyconf.org/program#andrew-havens) Erste Hälfte super, wie baut man sich sein eigenes Arcade Zweite Hälfte, völlig wirr und durcheinander Wir sprechen keine nicht-Empfehlungen aus Dirk fand den Talk von Stephen Henrie zum Thema Thrift und AMQP ganz gut: http://rubyconf.org/program#stephen-henrie Lucas war nicht begeistert Aber wir einigen uns drauf, dass er eine gute Diskussionsgrundlage ist ;-) Talk von Matt Aimonetti mit abschließendem Panel: http://rubyconf.org/program#matt-aimonetti-bryan-helmkamp-bryan-liles These: Es gibt keinen schlechten Code Wir sind uns einig, dass es auf jeden Fall schlechten Code gibt ;-) Nach Bryan Helmkamp (https://codeclimate.com) ist der beste Code nicht eine 4,0 sondern eine 3,2 Wir fragen uns, warum das bei Code Climate dann nicht so abgebildet wird Tipps zu Miami Beach (01:17:46) Panther Coffee: http://www.panthercoffee.com Vielen Dank an Bryce für die Empfehlung: https://twitter.com/BonzoESC Beer and Burger Joint: http://www.bnbjoint.com - Gutes Bier und gute Burger Ein Trip zum Kennedy Space Center lohnt sich auch: http://www.kennedyspacecenter.com Das Home Office Cologne sucht noch Nachmieter und verkauft immer noch Teile der Einrichtung Kommentare Neuer Kommentar Nickname Content Name oder Pseudonym Dein Name oder Pseudonym (wird öffentlich angezeigt) Kommentar Mindestens 10 Zeichen Durch das Abschicken des Formulars stimmst du zu, dass der Wert unter "Name oder Pseudonym" gespeichert wird und öffentlich angezeigt werden kann. Wir speichern keine IP-Adressen oder andere personenbezogene Daten. Die Nutzung deines echten Namens ist freiwillig. Abschicken'''
