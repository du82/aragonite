["https://geekstammtisch.de/7-gst032-nosql-matters-2014-cologne"]
title = "GST032 - NoSQL Matters 2014 Cologne - Geekstammtisch - Podcast"
description = "Auch dieses Jahr sind wir wieder auf der NoSQL Matters in Köln und haben wieder mit Speakern wie Besuchern gesprochen. Wir haben viele neue Menschen kennengelernt, aber auch die ein oder andere Fortsetzung vom letzten Mal ist dabei. Ein Hinweis noch, es sind überwiegend Gespräche in Englisch."
full_description = 'GST032 - NoSQL Matters 2014 Cologne <span>2014-05-15 06:44:23 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Gesprächspartner [EN] Ted Dunning (@ted_dunning) [EN] Ellen Friedman (@Ellen_Friedman) [EN] Johnny Miller (@cyanmiller) [DE] Michael Hunger (@mesirii) [EN] Akmal Chaudhr (@akmalchaudhri) [DE] Gereon Steffens (@gereons) [DE] Max Neunhöffer [EN] Mahesh Paolini-Subramanya (@dieswaytoofast) [EN] Boaz Leskes (@bleskes) [DE] Frank Celler (@fceller) und Stefan Edlich (@edlich) [EN] Russel Brown (@russelldb) [EN] Jennifer Rullmann (@jrullmann) Intro (00:00:00) Basti und Dirk sagen "Hallo" Ted Dunning, MapR (00:03:46) @ted_dunning War dieses Jahr Keynote Speaker Thema war "Remember the Future" Gist: Einige Dinge die heute modern erscheinen werden in Zukunft nicht mehr sein. Dinge von denen man dachte, sie spielen keine Relevanz mehr, werden in Zukunft modern sein. Was braucht NoSQL für die Zukunft? Welche Möglichkeiten werden uns Daten eröffnen? Was sind die kleinen Dinge, die in Zukunft große Relevanz haben werden? Ellen Friedman (00:18:23) @Ellen_Friedman Hat einen eher ungewöhnlichen Hintergrund: Sie ist Biologin mit Schwerpunkt auf Bio-Chemie und Genetik und hat in diesen Bereichen sowohl Forschung als auch Lehre betrieben Sie ist Autorin von zahlreichen Publikationen in diesem Bereich, aber auch Mitglied des Mahout-Projekts und schreibt aktuell viel über Machine-Learning Sie erklärt uns wie es zum Thema der Keynote "Remembering the future" kam Ellen glaubt wir werden genauer wenn es darum geht die Zukunft vorher zusagen Im Sinne von: Was für Probleme gelöst werden, weniger wie sie gelöst werden Die Lösung wird oft sehr überraschend sein Manchmal gab es die Lösung schon in der Vergangenheit und sie wird neu entdeckt "Die Geschichte wiederholt sich nicht" Wir sprechen über die Herausforderungen die auf unsere Gesellschaft zukommen mit der weiteren Erfassung großer Datenmengen Welche Verantwortung hat die Tech-Community in diesem Zusammenhang Abschließend geht es noch um die verständliche Vermittlung von komplexem Wissen Johnny Miller, DataStax (00:34:34) @cyanmiller Johnny ist Solution Architect bei DataStax, der größte Committer von Cassandra Neben einem Vortrag hat er auch einen sehr guten Einsteiger-Workshop gegeben Wir haben mit ihm über Ease-of-use gesprochen, und dass scheinbar viele NoSQL Systeme ihre Funktionalität langsam im Griff haben und sich nun auf die Benutzbarkeit konzentrieren können Sein Herzensthema ist Sicherheit in NoSQL Datenbanken, daher haben wir natürlich auch darüber gesprochen Michael Hunger, Neo Technologies (00:53:52) @mesirii Michael kommt von Neo Technologies, der Firma hinter Neo4j, einer Graphdatenbank Auch seinen Einsteiger-Workshop konnten wir besuchen Sein Talk war ebenfalls ein Einstieg, vor allem in die Welt der Graphen Wir sprachen mit ihm über "The right tool for the job" und welche Problemstellungen für Graphen geeignet sind Auch hier war Ease-of-use ein Thema Im Fall von Neo4j bezieht sich das sowohl auf die Anwendung als solche aber auch auf den Einstieg in die Welt der Graphen Off-the-Record: Leider erst nach Aufnahme haben wir uns noch verraten lassen, dass Neo4j seinen Namen aus dem Film der Matrix hat :-) Akmal Chaudhri, DataStax (01:12:24) @akmalchaudhri Akmal hat einen der wenigen nicht-technischen Talks gehalten Das Thema könnte dennoch nicht wichtiger sein: Skills Wie schafft man es als Unternehmen aber auch als Entwickler mit der rasanten technologischen Entwicklung mithalten zu können? Wir stellen fest, dass ein großer Vorteil ist, dass im Grunde alle großen NoSQL Datenbanken frei verfügbar sind und zu jeder zahlreiche und qualitativ hochwertige Lernressourcen kostenlos zur Verfügung stehen Gereon Steffens, Finanzen100 (01:29:17) @gereons Gereon ist Head of IT bei Finanzen100 in Köln Wir sprachen letztes Jahr mit ihm über die geplante Einführung von Redis Diese Einführung ist mehr als erfolgreich verlaufen Alle Anforderungen konnten erfüllt und neue Funktionalitäten für die Nutzer etabliert werden Wir sprachen auch darüber wie er diese neue Technologie im Team erfolgreich etablieren konnte Max Neunhöffer, triAGENS (01:45:09) Max kommt von der Open-Source Multi-Model Datenbank ArangoDB Wir reden mit ihm über das neueste Feature von ArangoDB: Sharding Vor allem geht es um die Herausforderungen ein solches Feature zu implementieren Der aktuelle Stand funktioniert zwar, aber es gibt noch viel zu tun Mahesh Paolini-Subramanya, Ubiquiti Networks (02:00:43) @dieswaytoofast Mit Mahesh wollten wir schon letztes Jahr sprechen, haben es aber nicht mehr geschafft. Nun hat es geklappt! Er arbeitet zur Zeit bei Ubiquiti Networks "The largest Network infrastructure company you may never heard of" Erste Frage die sich stellt: Was hat ein Hersteller von Netzwerkhardware mit NoSQL am Hut? Antwort: Unmengen von Daten! Uniquiti bietet eine Cloud-basierte Management Plattform für die Hardware an Jedes Gerät schickt alle 30 Sekunden Daten dorthin und kann von dort auch Konfiguration oder andere Informationen abrufen Sie setzen dazu so ziemlich jede NoSQL Datenbank ein die es gibt (außer MongoDB) Auch hier ist wieder "The right tool for the job" Thema Und natürlich sprechen wir über das große Thema Sicherheit Boaz Leskes, Elasticsearch (02:23:56) @bleskes Entwickler bei elasticsearch Er hat einen Talk zu den Aggregationsmöglichkeiten in elasticsearch gehalten Zusammengefasst: Mit Aggregationen, Facettensuche und den Analysefunktionen lassen sich sehr komplexe Systeme zur Analyse von beliebigen Daten erstellen elasticsearch ist noch viel weniger "nur" für Suchen geeignet, als noch vor einem Jahr Die Nutzer erkennen immer mehr, welche weiteren Möglichkeiten durch elasticsearch bekommen Boaz erklärt wie die Suchfunktionalitäten von elasticsearch bei der Analyse von arbiträren Daten helfen kann Es geht weiter mit einigen interessanten Einblicken in die Optimierung von Algorithmen Ease-of-use ist auch bei elasticsearch ein sehr wichtiges Thema, nicht nur bei der Nutzung aus Entwicklersicht, sondern auch aus Betriebssicht "Elasticsearch is a highly distributed system that really, really hard tries to hide it" Frank Celler und Dr. Stefan Edlich (02:39:35) @fceller (Dr. Celler Cologne Lectures) & @edlich Frank und Stefan sind beide Organisatoren der Konferenz und im Programmkommitee Wir sprechen über die Vorbereitungen der Konferenz und wie die bisherigen Eindrücke sind Wir erhalten ein paar Einblicke in die Schwierigkeiten bei der Zusammenstellung des Programms NoSQL Matters gibt es nicht nur in Köln, sondern auch in Dublin und Barcelona Russel Brown, Basho (02:53:18) @russelldb Russel ist kurzfristig für einen Talk eingesprungen, glücklicherweise zu dem Thema, dass er implementiert hat ;-) Mit Russel haben wir über CRDT in Riak gesprochen, dieses Theme hatten wir letztes Jahr auch schon mit Sean Cribbs Damals steckte es noch in den Kinderschuhen, heute ist es nutzbar in der neuesten Version von Riak CRDTs steht für "Conflict-Free Replicated Data-Typ" Wir reden über die Herausforderungen der Implementierung Und vor allem über die Herausforderungen beim Testing Obwohl das Feature implementiert ist, gibt es noch viele Dinge zu tun und zu optimieren Jennifer Rullmann, FoundationDB (03:11:26) @jrullmann Entwicklerin bei FoundationDB Hat vorher Webanwendungen Entwickelt nun arbeitet sie an FoundationDB FoundationDB: Distributed Key-Value DB mit der Möglichkeit andere Datenmodelle (Dokumente, Graphen, ...) in Form von Layern hinzufügen Ihr Talk war zu dem Thema "NoSQL and ACID" Ease of Use: FoundationDB legt viel Wert darauf einfach im Betrieb zu sein (wenig Konfiguration by default) Outro (03:28:52) Bast und Dirk sagen "Tschüss" persönliches Fazit: Wir hatten tolle drei Tage, haben viel gelernt und sehr spannende Gespräche geführt Fazit zur Konferenz: NoSQL wird erwachsen und wird uns bestimmt noch viele Jahre begleiten. In welcher Form? Das wird die Zukunft zeigen ;-) Kommentare Neuer Kommentar Nickna