full_description = "Heute ein Geekstammtisch Classic, mit ohne Gast. Wir reden über Regeln für gutes OO-Design, Code Metriken, schlechte Angewohnheiten von Entwicklern, Cool Stuff und etwas über git. Zu... Wir sprechen zur 10. Sendung mit Liane (@liane_thoennes) über das Leben und Arbeiten einer Designerin unter Entwicklern. Wir reden über Werkzeuge, Prozesse und das allgemeine Miteina... Zur 9ten Ausgabe hat sich der gute @bascht wieder zu uns auf das Sofa gesetzt. Wie sollte es anders sein, reden wir relativ viel über DevOps Themen. Neben Deploymentstrategien geht e... Heute ist der Lucas (@moonbeamlabs) mal wieder zu Besuch und wir haben über Serialisierung in Ruby, Thor und JRuby gesprochen. Es gibt auch mal wieder was aus der DevOps-Ecke, namentlich Vagrant... Heute zu Gast ist Klaus (@klaustopher) und wir reden viel über Ruby 2.0, die aktuellen Rails Release Candidates, Config-Formate und Threading in Ruby. Das ganze wird diesmal ab... Heute geht es um ArangoDB und wie man einen coolen low-level Client für eine Datenbank baut, Mutation Testing, Ruby/Rails Security und anderen geilen Scheiß. Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben"
