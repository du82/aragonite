["https://geekstammtisch.de/2-gst037-vom-hebdrehwahler-zu-voice-over-ip"]
title = "GST037 - Vom Hebdrehwähler zu Voice over IP - Geekstammtisch - Podcast"
description = "Mit Pablo Beyen (http://www.bevuta.com/de/) sprachen wir in aller Ausführlichkeit über Telefonie und dessen Anfängen bis hin zu Voice-over-IP. Pablo's Firma baut selber unter anderem Telefonanlagen und ist ein (kleiner) Telekommunikationsanbieter und weiht uns in technische und strukturelle Herausforderungen des Telefoniealltags ein."
full_description = '''GST037 - Vom Hebdrehwähler zu Voice over IP <span>2015-02-02 13:15:35 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Pablo Beyen (00:00:00) Pablo hat Bier mitgebracht: http://www.crewrepublic.de/crew-biere/roundhouse-kick.html erster Computer mit 7 Internet: seit 1995 eigene Firma (bevuta IT): seit 1999 Rails, lisp, Telefon :) Seit 2004 kam VoIP dazu "Apps" werden allerdings auch entwickelt jetzt 20 Mitarbeiter Pablo's erster Mitarbeiter war auch schon mal beim Geekstammtisch: GST025 - Vom Tellerwäscher zum Lisp-Entwickler http://geekstammtisch.de/#GST025 Pablo macht Tech-Sprechstunde im Startplatz: http://www.startplatz.de/sprechstunde/tech-sprechstunde-mit-technology-angel-pablo/ Geschichte des Telefons (00:10:57) 1837 - Samuel F. B. Morse - Morsetelegraphen - Digital 186x - Philipp Reis - "Telephon" in Anlehnung an "Telegraph" 187x - Alexander Graham Bell - Kommerzialisierung des Reis "Telefons" 1885 - Bell gründet American Telephone and Telegraph Company (AT&T) - kennt vielleicht der eine oder andere :) 188x - Ortsnetze und Fernverbindungen zwischen vielen deutschen Städten, Handvermittlung "Fräulein vom Amt" 1891, ab 1908 in Deutschland - erster Hebdrehwähler, Automatisierung: https://de.wikipedia.org/wiki/Hebdrehw%C3%A4hler 1966 - Letzte reguläre nationale Handvermittlung geschlossen 1969 - Entwicklung von Unix an den Bell Labs (AT&T); iOS, Android, … geht am Ende auf Bells Firma zurück 1969 - Beginn des ARPANET: https://en.wikipedia.org/wiki/ARPANET 1975 - Einführung von SS7/Digitale Vermittlung/Übertragung: https://en.wikipedia.org/wiki/SignallingSystemNo._7 198x - Modem-/Mailbox-Ära 1989 - Start von ISDN - Umstellung auf ISDN 199x - ISDN-Ära + allgemeine Internetverfügbarkeit Umstellung DSL und ISDN (00:33:20) 200x - DSL-Ära ISDN & Co Kram kann man sich gut auf den CCC Events beim POC (Phone Operation Center) anschauen 201x - Umstellung des Netzes auf VoIP Umstellung auf VoIP Mitte 2000er: Uni Stuttgart mit 10k Nebenstellen Status Telekom - Derzeit 3,5 Millionen VoIP-Kunden und 60.000 Umstellungen pro Monat, soll bis 2019 abgeschlossen sein Fax auf VoIP ist ein Problem Voice over IP (00:52:30) allgemeiner Begriff für die Echtzeitübertragung von Sprache über das Internet SIP: https://en.wikipedia.org/wiki/SessionInitiationProtocol Nur "Vermittlung", keine Sprachdaten SIP ist der absolute Standard und wird auch zwischen den Anbietern eingesetzt MGCP - vor allem für Kabelmodems: https://en.wikipedia.org/wiki/MediaGatewayControl_Protocol Pablo ruft den Basti an (oder andersrum) (00:58:40) Client starten und einloggen ("registrieren") Anbieter kennt dann die IP Client hat für eingehende Verbindungen ggf. was mit dem Netzwerk/der Firewall gemacht Pablo wählt Basti's Nummer Telekom, über "einen Partner" in Bevutas Rechenzentrum in Frankfurt über SIP wird signalisiert, wer angerufen werden soll und welche Codecs verwendet werden Audio wird über RTP transportiert SS7, E1, Zeitschlitze und so (01:03:00) Wir schweifen etwas ab… In Frankfurt hat Bevuta E1 Anschlüsse: https://en.wikipedia.org/wiki/E-carrier#E1framestructure 32 Zeitschlitze: 1x Synchronisation, 1x Signalisierung (S2m), 30 bzw. 31 Nutzkanäle E1 Verbindung durch Frankfurt: 400 EUR/Monat Zurück zum Telefonat (01:10:40) Pablo ruft Basti an T-Mobile -> Mobilfunknetz -> Telekom -> "Partner" -> Bevuta Bevuta bekommt via SS7 den Call an einen Linux-Server durchgestellt Server schaut nach, ob es zu der Nummer des Angerufenen einen Account gibt und ob dieser online ist Dann werden zwischen Bevuta-Server und Client z.B. Codecs ausgehandelt Es klingelt :) Audio wird in real-time zum Zielcodec umcodiert Sicherheit (01:17:00) In der Telko Welt ist alles recht isoliert keine Ende-zu-Ende Verbindungen, also wird recodiert, und recodiert... von Ende-zu-Ende Kryptographie ganz zu schweigen :-/ Mobilfunk ist verschlüsselt! Erm, nicht wirklich… VoIP und SIP und Firewalls (01:24:00) QoS und Router und Firewalls sind ein Problem für SIP The Miracleshaper: http://mshaper.florz.de/ Telefonie ist sehr Latenz- und Jitterempfindlich für Zuhause kann man ganz gut mit der FritzBox fahren VoIP Telefonanlagen (01:31:50) Asterisk: http://www.asterisk.org/ Back-to-Back User-Agent: https://en.wikipedia.org/wiki/Back-to-backuseragent FreeSWITCH: https://freeswitch.org/ SIP Proxy YXA: http://www.stacken.kth.se/project/yxa/ Telekommunikationsanbieter (01:36:35) Rufnummernzuteilung: nicht ganz einfach 5200 Ortsnetze in Deutschland Rufnummern kann man nur in 1000er Blöcke kaufen Lawful Intercept: Bei kleinen Anbietern muss das nicht voll automatisiert sein Bestandsdatenabfrage: "Welche Nummern hat der Dirk?" Ortsgrenzen entsprechen nicht den Ortsnetzen Vorwahl für VoIP: 032 - https://de.wikipedia.org/wiki/Vorwahl032(Deutschland) Flatrates sind so eine Sache: Unter Anbietern gibt es keine Flatrates! Accounting & Billing Es gibt viel spezialisierte Hardware auf 48V Basis, inkl. Server Bevuta's Telefonanlage (01:59:00) Bevuta baut Telefonanlagen, basierend auf Linux-Servern Auch mit eigener Hardware Basiert auf Asterisk eigener Call-Router, basiert auf Ruby die Anlage ist Scriptbare mit Scheme: https://en.wikipedia.org/wiki/Scheme(programminglanguage) Herausforderung: Maintenance der Anlagen Schlussworte (02:12:50) Kommentare Neuer Kommentar Nickname Content Name oder Pseudonym Dein Name oder Pseudonym (wird öffentlich angezeigt) Kommentar Mindestens 10 Zeichen Durch das Abschicken des Formulars stimmst du zu, dass der Wert unter "Name oder Pseudonym" gespeichert wird und öffentlich angezeigt werden kann. Wir speichern keine IP-Adressen oder andere personenbezogene Daten. Die Nutzung deines echten Namens ist freiwillig. Abschicken'''
