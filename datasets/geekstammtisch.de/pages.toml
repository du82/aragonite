full_description = '''Wir haben den Staub aus den Mikrofonen gepustet und mit Nadine und Michael aus dem Spielbrett aus Köln über das Thema "Brettspiele" gesprochen. Das Spielbrett ist ein Laden für Karten- und Brett... In dieser etwas längeren Stammtisch-Folge sprachen wir mit Pablo Beyen und Reinhard Remfort über E-Mobilität. Während wir mit Pablos Hilfe strukturiert die Geschichte der batterieelektrischen Mo... Mit Jan-Erik Rediger haben wir über Redis und Rust gesprochen. Redis und Rust sind Open Source Projekte an denen Jan-Erik schon länger aktiv beteiligt ist. Wir sprechen kurz über Redis und deutl... Mit Stefan Wintermeyer haben wir über Ruby on Rails, das Phoenix Framework und Webperformance gesprochen. Wir kommen von Rails über Phoenix und die Vorzüge der BEAM/Erlang VM zu Webperformance. ... Uwe Friedrichsen nimmt uns mit auf eine historische Rundreise der IT-Geschichte und schafft eine Grundlage, um aktuelle Problematiken der Unternehmenswelt zu verstehen. Durch die Veränderung der... Mit Pablo Beyen (http://www.bevuta.com/de/) sprachen wir in aller Ausführlichkeit über Telefonie und dessen Anfängen bis hin zu Voice-over-IP. Pablo's Fir... Alle Jahre wieder kommen Hacker, Künstler und Aktivisten aus Deutschland und aller Welt auf dem Congress™ zusammen. Die neuste Inkarnation trägt den Namen 'A new Dawn'. Wo im letzten Jahr Sprach... Wir sprachen mit Mario Heiderich (@0x6D6172696F) über (Web-)Security, Pentesting und wie sich in der letzten Zeit das Feld gewandelt hat. Immer mehr Logik passiert im Browser womit sich die Angr... Wir haben mit Christian Rohmann über die Einführung von IPv6 bei dem lokalen ISP NetCologne gesprochen. Angefangen bei technischen Grundlagen, wie das Internet überhaupt zum Kunden kommt über wa... In unserer ersten Remote-Ausgabe vom Geekstammtisch sprachen wir mit Florian Motlik, CTO von Codeship.io. In dem Gespräch haben wir im Grunde alle wesentlichen Aspekte einer Continuous Delivery ... Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben'''
