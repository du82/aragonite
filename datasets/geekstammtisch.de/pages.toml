full_description = "GST022 - Der Finder lügt! <span>2013-08-21 08:07:09 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Wir sprachen mit Manuel @StuFFmc Carrasco Molina über seine Zeit als Podcaster (http://pomcast.com), iOS und OS X Entwicklung. Da wir schon mal einen Apple Fanboy da hatten, haben wir die Gelegenheit genutzt um etwas in die Glaskugel zu schauen. GST021 - Nerdstammtisch (aka NK008) <span>2013-07-30 16:54:43 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Der Geekstammtisch und die Nerdkunde haben auf dem RailsCamp Germany 2013 zusammen ein paar Impressionen der Besucher gesammelt. Wir sprachen mit @skddc, @jkwebs, @argorak, @badboy_, @Uepsi, @slogmen und @Hagenburger. Bis zum nächsten Mal! GST020 - Wenn die Codebase groß genug ist... <span>2013-07-29 16:27:42 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Auf dem RailsCamp sprachen wir mit Christoph @TheDeadSerious Olszowka. Es ging um das Rails Ökosystem und um zwei etwas bekanntere Projekte von Christoph: The Ruby Toolbox und simplecov. GST019 - Weg von .NET & Windows <span>2013-07-27 14:29:29 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Wir hatten dieses Mal Stefan Schiffer (@scrat0105) zu Gast. Er berichtet von dem doch sehr radikalen Wandel seines Arbeitgebers: Von On-Premise zu SaaS und Cloud, von Wasserfall-Prozessen hin zu Agiler Softwareentwicklung und von .NET & Windows zu Ruby & Linux. Stefan erzählt, woher der Wandel kommt und wie er den Wandel von Anfang an miterlebt hat. GST018 - Runde Ecken <span>2013-06-28 16:09:55 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Der Geekstammtisch wird volljährig! Dieses mal sprachen wir mit Sebastian Kippe (@skddc) und sprechen über Hacking Trips, sein Startup 5Apps, das Arbeiten beim W3C, HTTP 2.0, IPv6, SSL, DevOps. Zum Abschluss noch ein ganz besonderes Thema: BitCoins und Namecoin. GST017 - developer-whisperer.DLL <span>2013-06-23 14:41:14 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Wir sprechen mit Oliver Thylmann über Köln als Gründerstadt, Gründungen im Allgemeinen, die Firma der Zukunft und und und. Dabei schweifen wir (also Oli) immer wieder mal ab, haben uns dann aber doch ganz gut im Zaum gehalten und ein gutes zeitiges Ende gefunden. Vielen Dank an @luebken für die Shownotes!"
