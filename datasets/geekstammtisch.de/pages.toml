title = "Geekstammtisch - Podcast"
description = """
Heute ein Geekstammtisch Classic, mit ohne Gast. Wir reden
über Regeln für gutes OO-Design, Code Metriken, schlechte Angewohnheiten
von Entwicklern, Cool Stuff und etwas über git. Zur Auflockerung
philosophieren wir gegen Ende noch etwas über den PC Markt."""
full_description = "GST011 - Unsatisfied Computers <span>2013-04-15 08:42:36 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Heute ein Geekstammtisch Classic, mit ohne Gast. Wir reden über Regeln für gutes OO-Design, Code Metriken, schlechte Angewohnheiten von Entwicklern, Cool Stuff und etwas über git. Zur Auflockerung philosophieren wir gegen Ende noch etwas über den PC Markt. GST010 - Dackelklub <span>2013-04-02 20:01:30 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Wir sprechen zur 10. Sendung mit Liane (@liane_thoennes) über das Leben und Arbeiten einer Designerin unter Entwicklern. Wir reden über Werkzeuge, Prozesse und das allgemeine Miteinander. CoolStuff™ darf natürlich auch nicht fehlen. GST009 - Zweites Rack rechts <span>2013-03-26 12:50:35 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Zur 9ten Ausgabe hat sich der gute @bascht wieder zu uns auf das Sofa gesetzt. Wie sollte es anders sein, reden wir relativ viel über DevOps Themen. Neben Deploymentstrategien geht es dabei um Best Practices mit Chef und VPNs. Zum Ende gibt es wieder neues aus der Rubrik Cool Stuff™. Auf Grund knapper Vorbereitung ist die Folge diesmal wieder etwas kürzer geraten. GST008 - Rake auf Drogen <span>2013-03-20 16:49:40 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Heute ist der Lucas (@moonbeamlabs) mal wieder zu Besuch und wir haben über Serialisierung in Ruby, Thor und JRuby gesprochen. Es gibt auch mal wieder was aus der DevOps-Ecke, namentlich Vagrant und VMware und Gem-Hosting. Natürlich haben wir uns auch nicht nehmen lassen, über das Ende von Google Reader zu philosophieren und den GitHub Enterprise Faux Pa zu erwähnen. Zum Ende erzählt Lucas noch etwas zu seinem Dotfiles Installationsskript. GST007 - Provisionieren mit Bash <span>2013-03-09 17:40:28 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Heute zu Gast ist Klaus (@klaustopher) und wir reden viel über Ruby 2.0, die aktuellen Rails Release Candidates, Config-Formate und Threading in Ruby. Das ganze wird diesmal abgerundet mit einem Ausflug in die Frontend-Welt und ein Besuch bei DevOps."
