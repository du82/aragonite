title = "Geekstammtisch - Podcast"
description = "Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben"
full_description = "Wir sprachen mit Manuel @StuFFmc Carrasco Molina über seine Zeit als Podcaster (http://pomcast.com), iOS und OS X Entwicklung. Da wir schon mal einen... Der Geekstammtisch und die Nerdkunde haben auf dem RailsCamp Germany 2013 zusammen ein paar Impressionen der Besucher gesammelt. Wir sprachen mit @skddc, @jkwebs, @argorak, @badboy_,... Auf dem RailsCamp sprachen wir mit Christoph @TheDeadSerious Olszowka. Es ging um das Rails Ökosystem und um zwei etwas bekanntere Projekte von Christoph: The Ruby Toolbox und ... Wir hatten dieses Mal Stefan Schiffer (@scrat0105) zu Gast. Er berichtet von dem doch sehr radikalen Wandel seines Arbeitgebers: Von On-Premise zu SaaS und Cloud, von Wasserfall-Prozessen hin zu... Der Geekstammtisch wird volljährig! Dieses mal sprachen wir mit Sebastian Kippe (@skddc) und sprechen über Hacking Trips, sein Startup 5Apps, das Arbeiten beim W3C, HTTP 2.0, IPv6, SSL, DevOps. ... Wir sprechen mit Oliver Thylmann über Köln als Gründerstadt, Gründungen im Allgemeinen, die Firma der Zukunft und und und. Dabei schweifen wir (also Oli) immer wieder mal ab, haben u... Anlässlich der diesjährigen Apple Entwickler Konferenz und der Tatsache, dass es endlich mal wieder einen Live-Stream gab, wollen wir uns einen Kommentar nicht nehmen lassen. Wir hal... Diesmal ist es wieder technischer, aber nicht weniger nerdig. Wir hatten @bumi von @railslove zu Gast. Mit ihm haben wir über gute Zusammenarbeit von Kunde und Auftraggeber gesprochen. Weiterhin... Wir haben uns mit Matthias @luebken hingesetzt und einen Geekstammtisch abgehalten. Gesprochen haben darüber, was einen guten, leidenschaftlichen Softwareentwickler ausmacht und waru... Wir waren auf der NoSQL Matters 2013 in Köln (@nosqlmatters). Das ist jedoch keine Retrospektive in unserem Studio, sondern wir haben unser Equipment in den Mediapark Köln getragen und mit Teiln... Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben"
