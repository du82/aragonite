["https://geekstammtisch.de/page/2"]
title = "Geekstammtisch - Podcast"
description = "Auch dieses Jahr sind wir wieder auf der NoSQL Matters in Köln und haben wieder mit Speakern wie Besuchern gesprochen. Wir haben viele neue Menschen kennengelernt, aber auch die ein oder andere Fortsetzung vom letzten Mal ist dabei. Ein Hinweis noch, es sind überwiegend Gespräche in Englisch."
full_description = '''GST032 - NoSQL Matters 2014 Cologne <span>2014-05-15 06:44:23 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Auch dieses Jahr sind wir wieder auf der NoSQL Matters in Köln und haben wieder mit Speakern wie Besuchern gesprochen. Wir haben viele neue Menschen kennengelernt, aber auch die ein oder andere Fortsetzung vom letzten Mal ist dabei. Ein Hinweis noch, es sind überwiegend Gespräche in Englisch. GST031 - CORBA in cool <span>2014-04-14 11:39:53 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Mit Stefan Tilkov (@stilkov) sprachen wir über Softwarearchitekturen, vor allem REST und Web Services. Wir haben keine 800 Personenjahre gebraucht, um festzustellen, dass Thrift CORBA in cool ist und die Idee "Rechte Maustaste, 'Generate and Deploy Web Service'" nicht wirklich funktioniert. Neben REST im Allgemeinen sprechen wir über Hypermedia und wie alles zusammengreifen kann. Stefan schlägt eine interessante Brücke von der Idee REST als Backend-Thema hin zu REST für das Web, wodurch wir zu ROCA, einem Architekturstil, kommen. GST030 - Turnschuhadministration <span>2014-03-24 14:02:41 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Mit Essy (@casheeew) sprachen wir ausführlich über das Leben und Arbeiten einer Administratorin innerhalb eines großen Rechenzentrums. Es geht um Prozesse, Betrieb, Deployment und Komplexität im Umfeld von großen Hostingumgebungen. Wir gehen auf diverse Aspekte etwas näher ein und erhalten einen recht vollständigen Einblick in ihren Arbeitsalltag. GST029 - Die JVM ist ein Erfolgsmodell <span>2014-01-28 12:19:21 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Matthias ist Softwareentwickler und erzählt uns wie er jahrelang Java im Telko-Sektor gemacht hat. Vor einem Jahr hat er dann die Branche und die auch die Größe des Unternehmens radikal geändert und macht nun Produktentwicklung in der Logistikbranche. Neben Java wird dort viel im Embedded-Bereich entwickelt und trotz eines kleinen Teams sind die Aufgaben sehr vielfältig. Seit neuestem wird Software nun auch mit JRuby und AngularJS umgesetzt. Wir erfahren über die damit verbundenen Herausforderungen und wie damit umgegangen wurde.'''
author = "Dirk Breuer, Sebastian Cohnen"
year_published = 2014
