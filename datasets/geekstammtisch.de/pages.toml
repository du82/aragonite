["http://geekstammtisch.de/archive/page/2"]
title = "Geekstammtisch - Podcast"
description = "Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben"
full_description = "Auch dieses Jahr sind wir wieder auf der NoSQL Matters in Köln und haben wieder mit Speakern wie Besuchern gesprochen. Wir haben viele neue Menschen kennengelernt, aber auch die ein oder andere ... Mit Stefan Tilkov (@stilkov) sprachen wir über Softwarearchitekturen, vor allem REST und Web Services. Wir haben keine 800 Personenjahre gebraucht, um festzustellen, dass Thrift CORB... Mit Essy (@casheeew) sprachen wir ausführlich über das Leben und Arbeiten einer Administratorin innerhalb eines großen Rechenzentrums. Es geht um Prozesse, Betrieb, Deployment und Ko... Matthias ist Softwareentwickler und erzählt uns wie er jahrelang Java im Telko-Sektor gemacht hat. Vor einem Jahr hat er dann die Branche und die auch die Größe des Unternehmens radi... Das zweite Joint Venture der @nerdkunde (ohne Klaus, mit Bodo) und des @geekstammtisch (mit allen) live und in Farbe vom 30. Chaos Communication Congress (30C3) aus dem @Sendezentrum... Vorsicht! Diese Folge ist sehr meta! Wir ziehen ein kleines Resümee des letzten Jahres Geekstammtisch und sagen an, dass wir auch nächstes Jahr weitermachen werden :) Lucas und Dirk waren auf der RubyConf in Miami Beach. Wir berichten von ihren Eindrücken und es gibt natürlich die ein oder andere Empfehlung für einen Vortrag. Darüber hinaus diskut... Wir hatten Moritz Heidkamp aus Köln auf unserer Couch zu Gast und sprachen mit ihm über Lisp. Wir haben dabei ganz vorne bei John McCarthy angefangen und uns dann bis in die Gegenwart zu Clojure... Wir haben uns mit unserem @HomeOfficeCGN Kollegen Björn hingesetzt und über Spieleentwicklung gesprochen. Konkret ging es um iOS Spiele und noch konkreter um die Entstehung von Super Spell... Dieses Mal war Mateus Armando zu Gast bei uns auf der Couch. Wir sprachen darüber wie neue Mobiltelefone in das Netz der Telekom eingegliedert werden und was bei GSM so schief laufen kann.... Mehr oder weniger regelmäßiger Stammtisch rund um Geektum, (Web)development und was immer unsere Gäste an interessanten Dingen zu erzählen haben"
