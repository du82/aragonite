["https://geekstammtisch.de/42-kiloweise-brettspiele"]
title = "GST042 - Kiloweise Brettspiele - Geekstammtisch - Podcast"
description = 'Wir haben den Staub aus den Mikrofonen gepustet und mit Nadine und Michael aus dem Spielbrett aus Köln über das Thema "Brettspiele" gesprochen. Das Spielbrett ist ein Laden für Karten- und Brettspiele (mit einer guten Auswahl an Rollenspielinhalten) in der Engelbertstraße in Köln. Wir reden mit beiden über die Tiefe und Vielfalt des Hobbys, welche Kategorien es gibt und über die Herausforderungen eine Auswahl in der schieren Masse der Angebote zu treffen.'
full_description = 'GST042 - Kiloweise Brettspiele <span>2020-03-05 10:22:37 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Seit gefühlt 100 Jahren podcastet der Geekstammtisch wieder. Auch dieses Mal haben sich @tisba und @code_later Gäste eingeladen, diesmal wird es wieder geekig und nerdy! Unsere Gäste Nadine: Gehört das Spielbrett in Köln Micha: Arbeitet im Spielbrett, rennt durch den Laden, verkauft Spiele, verpackt Spiele und spielt Spiele Das Spielbrett führt fast alle analogen Brettspiele, die klassisch auf dem deutschen Markt erscheinen Definition von Brettspiel "Alles, was Leute dazu bringt sich gemeinsam an einen Tisch zu setzen" Auch Kartenspiele gehören dazu Das Spektrum der Brettspiel vom einfachen kleinen Kartenspiel wie Skat über komplexe 8-stündige Strategiespiele wie Twilight Imperium ist alles vertreten Nadine und Micha haben heute Oriflamme gespielt kurzes Spiel, aber vielleicht nicht unbedingt ein Familienspiel Heutige Spiele zum (Wieder-)Einstieg, die einen Blick wert sind Im Brettspiel nennt man das die Kategorie "Geht-Immer"-Spiele Qwixx, eine intelligente Kniffelvariante 6 nimmt!, kleines Kartenspiel Biberbande CABO Die Spiele des Jahres Just one ist das Spiel des Jahres 2019 Das Spiel des Jahres wird jedes Jahr durch eine fachkundige Jury gewählt 1995 war Siedler von Catan Spiel des Jahres und danach gab es eine richtige Welle an Spielbrettmotivation Escape-Room-Spiele Exit - Das Spiel Das Brettspiel verkauft auch Second-Hand-Brettspiele Ähnlichkeiten zu anderen Hobbies Durchaus interessante Community und Menschen, vor allem im Fantasy- und Rollenspielbereich Brettspiele erfordern im Vergleich zu Videospielen eine sehr viel höhere Sozialkompetenz Brettspielgenres Genre: Legacyspiele: Kampagnenmodus, man spielt eine gewisse Reihenfolge von Szenarien ab anhand eines endlichen Handlungsstrangs Pandemic Legacy Staffel 1, coole Story. Hat bei Micha ca. 14 Spielabende gedauert um es durchzuspielen Genre: Worker Placement Spiele, alle haben den gleichen Ausgangspunkt und versuchen Dinge aufzubauen, am Ende wird verglichen, wer dies am tollsten gemacht hat Siedler von Catan als Klassiker Tiny towns, relativ niederschwellige Regelbasis, aber recht unterschiedliche Spielszenarien. Kleine Stadt, die zu Beginn brach ist, man muss Gebäude bauen und wer hinterher die tollste Stadt hat gewinnt das Spiel Fantasy Flight Games großer amerikanischer Hersteller, der viele Lizenzen kauft Star Wars Lizenz viele Miniaturenspiele mit Zukaufsoptionen Fokus auf "Vielspieler" führen Twilight Imperium Genre: Area Control/Area Influence Twilight Imperium ist eine Mischung aus Area Control und sozialer Interaktion Genre: Eurogaming, hier fordern die meisten Spiele keine hohe Interkation zwischen den Spielern Concordia ist für Micha DAS Eurogame Flügelschlag ist nicht so richtig ein Eurogame, eher ein Engine Builder Agricola Das Spielbrett bietet einen Teil ihrer Second-Hand-Spiele auf Boardgamegeek an nicht alle Spiele vor 1995 haben einen Barcode, was das Katalogisierung teilweise schwieriger macht Genre: Role and Write Genre: Draft and Write Genre: Deckbuilder Es ist schwierig ein Spiel fest in ein Genre einzuordnen Reavers of Midgard Carpe Diem,leichteres Spiel als Mischmasch aus Carcassonne und Plättchen legen Die Spiel, reine Brettspielmesse in Essen (mit kleinem Rollenspielanteil), bietet auch einen kleinen Brettspielflohmarkt, Hauptsächlich stellen dort die Verlage ihre Neuheiten vor, Publikumsmesse mit kleinem Fach-/Pressebereich. Spielwarenmesse Nürnberg / International Toy fair ist reine Fachmesse für Spielwaren, Brettspiele sind in zwei Hallen der Messe nur ein kleiner Teil der gesamten Messe Brettspieledatenbank Boardgamegeek BGG in der theoretisch jedes Spiel vorhanden ist, jedes Spiel hat einen Eintrag mit Communityranking, Angabe der Spieldauer, Spieleranzahl, Altersfreigaben, … Wie sollte man anfangen? Micha empfiehlt mit einem sehr einfachen Spiel zu starten, was in 2-3 Minuten erklärt ist bspw. mit dem Kartenspiel Exploding Kittens, ein Russisches Roulette mit explodierenden Katzen und Lasern und kurzer Spieldauer, was auch nach dem Konsum von ein paar Bier gut funktioniert. Gateway Game: Ein Spiel, mit dem man versucht Leute anzufixen Spieldauer: 30-45 Minuten, Komplexität: 2-2,5 (bei max 5), Spieler: 2-4, leicht strategisch, was Lust auf mehr macht Kooperative Spiele bspw. Pandemie Magic Maze, man spielt gegen die Zeit Escape-Room-Spiele Spiele mit Glücksfaktor Komplexe Strategiespiele verzichten vermehrt auf Glückselemente [StoneAge](https://www.hans-im-glueck.de/spiele/stone-age.html**, 2-4 Personen, ca. 1 Stunde Spielzeit Glückselemente durch Karten, Würfel Glück als Ausgleich; das Spiel interessant halten Vortrag von der Shux 2019 zu Siegpunkten Shut up & Sit Down Fazit: Für jeden Geschmack und jeden Geldbeutel was zu finden Spielerunden finden Spieletreffs Kneipen mit Spieleregalen Alibaba Spieleabend in Köln Brettspielcafes http://www.voyager-bonn.de/ https://wuerfelundzucker.de/ http://www.spielwiese-berlin.de/ Willkommenskultur nicht immer ganz so offen wie man sich das wünscht Nicht jedes Spiel ist für jede Gruppe sinnvoll oder geeignet Veranstaltungen Spiel in Essen seit 1983 Sehr internationale Veranstaltung Ratinger Spieletage SPIEL DOCH! in Duisburg Spielbox Mehr Menschen spielen und mehr unterschiedliche Menschen spielen Nische muss nicht immer klein sein :) Übersicht an Conventions auf BGG Der Markt Klassische Verlage Mit Redaktion Unterschiedliche Kategorien Kleinstverlage Einzelproduktionen SPIEL in Essen kann da eine gute Möglichkeit zu sein Spieledesign Hausregeln gibt es oft Ernsthaftes Spieledesign ist nicht so leicht Neuartiges ist in der aktuellen Situation nicht leicht Lieber die bestehenden Dinge aufspielen Es gibt genug sehr gute Spiele Testspiele für Prototypen Autorentreffs Wenn man seinen Prototypen mitbringt, dann mit offener Kritik rechnen Spieleautor ist ein regulärer Beruf Kickstarter (stellvertretend für Crowdfunding) Schlecht geeignet für den Einzelhandel, weil sehr kleine, spezielle Auflagen Kickstarter Spiele können ganz andere Dinge realisieren "Cthulhu: Death May Die" Monsterfigur Manche Spiele werden auch von Verlagen aufgegriffen. Beispiel Root Internationale Spiele Unterschiedliche Sprachen sind uU kostspielig Dauert oft sehr lange bis das Spiel dann tatsächlich kommt Beliebig viele Extras dazu kaufbar Versand kommt dann noch oben drauf Aber wenn man nicht zuschlägt, dann kann man ein tolles Spiel verpassen Blood Rage als Beispiel Sehr viele Brettspiele auf Crowdfunding-Plattformen verfügbar Schwer einzuschätzen, ob man es überhaupt spielen mag Exploding Kittens Wir spielen Exploding Kittens Ein kleines Kartenspiel Von The Oatmeal illustriert War ein sehr erfolgreiches Kickstarter Ein Spiel aus der Kategorie "Bier und Brezel" Nach längerem Spiel durchaus strategischen Tiefgang Ein Spiel bei dem sich immer noch untereinander reden lässt Wir haben es geschenkt bekommen <3 Verhandeln in Spielen Regelwerk ist wichtig Auslegung von Regeln kann es spannend für die Gruppe machen Junta Kommentare Neuer Kommentar Nickname Content Name oder Pseudonym Dein Name oder Pseudonym (wird öffentlich angezeigt) Kommentar Mindestens 10 Zeichen Durch das Abschicken des Formulars stimmst du zu, dass der Wert unter "Name oder Pseudonym" gespeichert wird und öffentlich angezeigt werden kann. Wir speichern keine IP-Adressen oder andere personenbezogene Daten. Die Nutzung deines echten Namens ist freiwillig. Abschicken'
