full_description = 'GST042 - Kiloweise Brettspiele <span>2020-03-05 10:22:37 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Wir haben den Staub aus den Mikrofonen gepustet und mit Nadine und Michael aus dem Spielbrett aus Köln über das Thema "Brettspiele" gesprochen. Das Spielbrett ist ein Laden für Karten- und Brettspiele (mit einer guten Auswahl an Rollenspielinhalten) in der Engelbertstraße in Köln. Wir reden mit beiden über die Tiefe und Vielfalt des Hobbys, welche Kategorien es gibt und über die Herausforderungen eine Auswahl in der schieren Masse der Angebote zu treffen. GST041 - Akkus auf Rädern <span>2017-10-03 13:05:14 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS In dieser etwas längeren Stammtisch-Folge sprachen wir mit Pablo Beyen und Reinhard Remfort über E-Mobilität. Während wir mit Pablos Hilfe strukturiert die Geschichte der batterieelektrischen Mobilität aufrollen, erklärt Reinhard wie Elektromotoren überhaupt funktionieren. Ein kleines Highlight ist die Fahrt in Pablos Tesla Model S. GST040 - Es gibt kein GOTO in Rust! <span>2017-09-08 12:37:02 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Mit Jan-Erik Rediger haben wir über Redis und Rust gesprochen. Redis und Rust sind Open Source Projekte an denen Jan-Erik schon länger aktiv beteiligt ist. Wir sprechen kurz über Redis und deutlich ausgiebiger über Rust. Dabei gehen wir – neben diversen Ausflügen und Deep Dives in Spracheigenschaften – vor allem immer wieder auf die Arbeit an Open Source Projekten selber ein. GST039 - Handgeklöppeltes HTML <span>2016-12-28 18:12:13 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Mit Stefan Wintermeyer haben wir über Ruby on Rails, das Phoenix Framework und Webperformance gesprochen. Wir kommen von Rails über Phoenix und die Vorzüge der BEAM/Erlang VM zu Webperformance. Insiderthemen wie TCP slow-start sind ebenso dabei wie einfach mal nur einmal jQuery ausliefern. Wir konnten Stefan sogar eine Reihe praktischer Tipps zu Optimierung von Performance entlocken. Abschließend widmen wir uns ausgiebig Vutuv, einem Open-Source Produkt von Stefan.'
