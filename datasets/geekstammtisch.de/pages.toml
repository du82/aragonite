["http://geekstammtisch.de/41-akkus-auf-raedern"]
title = "GST041 - Akkus auf Rädern - Geekstammtisch - Podcast"
description = "In dieser etwas längeren Stammtisch-Folge sprachen wir mit Pablo Beyen und Reinhard Remfort über E-Mobilität. Während wir mit Pablos Hilfe strukturiert die Geschichte der batterieelektrischen Mobilität aufrollen, erklärt Reinhard wie Elektromotoren überhaupt funktionieren. Ein kleines Highlight ist die Fahrt in Pablos Tesla Model S."
full_description = 'GST041 - Akkus auf Rädern <span>2017-10-03 13:05:14 UTC</span> Audio herunterladen: MP3 | AAC | OGG | OPUS Unsere Gäste (00:00:00) Pablo Beyen, bekannt aus GST037: Vom Hebdrehwähler zu Voice over IP: http://geekstammtisch.de/2-gst037-vom-hebdrehwahler-zu-voice-over-ip Reinhard Remfort, bekannt aus http://minkorrekt.de Reinhard ist eigentlich Physiker, arbeitet aber inzwischen für Pablo bei der bevuta Pablo hat wieder Bier mitgebracht (irgendwas lokales Belgisches: http://brasserie.grain-dorge.com/en/) Elektromobilität (00:04:45) http://trottielec.de/ https://de.brompton.com/Brompton-Electric Es gibt eine große Bandbreite an Anwendungen: elektrische Einräder, Roller, Falträder, … Wir versuchen uns auf batterieelektrische Antriebe zu konzentrieren Die Anfänge (00:12:20) Die Voltasche Säule: https://de.wikipedia.org/wiki/Voltasche_S%C3%A4ule 1837: Robert Davidson: https://en.wikipedia.org/wiki/Robert_Davidson_(inventor), batteriebetriebene Lock 1863: Hippomobile https://de.wikipedia.org/wiki/Hippomobile - erstes Verbrenner-Auto? 1881: Gustave Trouvé: Trouvé Tricycle gilt als erste E-Auto der Welt - https://de.wikipedia.org/wiki/Trouv%C3%A9_Tricycle 1885: Karl Benz: https://en.wikipedia.org/wiki/Karl_Benz *1883-1885: Batterieelekrische Straßenbahn 1886-1912: Die Große Zeit des Elektroautos - in New York waren 50% der Autos elektrisch! Wie funktioniert ein Elektromotor? (00:20:10) Verbrennermotor wird heiß: 80% der Energie ist Wärme Reinhard erklärt, wie Elektromotoren grundlegend funktionieren Elektromotor besteht aus Magneten und Metallschlaufen https://de.wikipedia.org/wiki/Elektromagnetische_Induktion https://de.wikipedia.org/wiki/Elektromotor Verluste beim Elektromotor sind durch den Elektrischer Widerstand (https://de.wikipedia.org/wiki/Elektrischer_Widerstand) Elektromobilität: The Early Days (00:30:30) Wir sind wieder in der Vergangenheit 1909: Wittfeld-Akkumulatortriebwagen: https://de.wikipedia.org/wiki/Wittfeld-Akkumulatortriebwagen Züge auf dem Netz der Bahn 70 km/h, 160km Reichweite, 300 kWh Batteriekapazität Rekuperationsfähig (Energierückgewinnung beim Bremsen) es wurden 200 Fahrzeuge gebaut Reinhard merkt an: Es gibt zwischen Elektromotor und Dynamo/Generator keinen Unterschied Der E-Mobil Winter (00:33:10) 1952: E-Lokk DB Class ETA150 https://en.wikipedia.org/wiki/DB_Class_ETA_150 1970-1981: MAN SL-E: Bus mit Batterie im Anhänger (https://de.wikipedia.org/wiki/MAN_SL_200#Elektrobus_SL-E) Der Elektromotor im Verbrennerauto (00:35:10) lange Herangehensweise der Automobilindustrie: Verbrennerauto nehmen, Elektromotor einbauen Nachteile: Gewicht, Schwerpunkt, Bauform, … Bei Tesla sind die Akkus im Boden Die E-Mobile Neuzeit (00:48:30) 1990-2002: General Motors EV1: https://en.wikipedia.org/wiki/General_Motors_EV1 Who Killed the Electric Car? http://www.whokilledtheelectriccar.com 2008-2012 Tesla Roadster: https://en.wikipedia.org/wiki/Tesla_Roadster Akkus (01:05:00) Runde Akkuzellen Typ 18650 das sind Zellen, keine Akkupacks (wie im Notebooks) Runde Akkus/Zellen lassen sich gut maschinell herstellen Tesla benutzt z.B. die Bauform, aber nicht die gleichen Akkus wie in Notebooks Tesla (01:08:20) Elon Musk war nicht von Anfang an bei Tesla Tesla Master Plan: https://www.tesla.com/blog/secret-tesla-motors-master-plan-just-between-you-and-me über 200.000 Model S wurden bereits gebaut Reichweite Tesla Model S (Variante 100D): 540km Im Abstand von 80km stehen in Deutschland Telsa Ladepunkte Von 0 bis voll laden dauert ungefähr eine Stunde Auto plant Ladestops automatisch am effizientesten ist der Tesla bei 130km/h Reichweiten-Angst existiert nur im Kopf Wir sind am Ende der Fahnenstange der Effektivität es Elektromotors Bei Akkus ist noch Luft nach oben. Die Frage ist nur wie? Stromerzeugung und Stomnetz (01:25:09) Stromerzeugung in der Stadt könnte mit Solarzellen gelöst werden der Tesla kann geladen werden, wann man will Tesla könnte geladen werden, wenn viel Strom zur Verfügung steht Elektromobilität braucht Änderungen in unserem Stromnetz Smart Grid: https://de.wikipedia.org/wiki/Intelligentes_Stromnetz Powerwall: https://de.wikipedia.org/wiki/Tesla_Powerwall Texas mit Solarpanels: https://www.mrctv.org/blog/elon-musks-solar-vision-explained Nachhaltigkeit (1:34:00) Urkilo aus Silizium: https://de.wikipedia.org/wiki/Kilogramm#Avogadroprojekt Nanotechnologie: https://de.wikipedia.org/wiki/Nanotechnologie Amortisation von Solaranlagen: https://www.solaranlagen-portal.com/solar/wirtschaftlichkeit/amortisation Brennstoffzellen (1:40:30) Brennstoffzelle: https://de.wikipedia.org/wiki/Brennstoffzelle Impulserhaltung: https://de.wikipedia.org/wiki/Impulserhaltungssatz Wasserstofftankstelle: https://de.wikipedia.org/wiki/Wasserstofftankstelle Toyota Mirai: https://www.toyota.de/automobile/der-toyota-mirai.json Hyundai ix35 Fuel Cell: http://www.hyundai.de/Modelle/ix35-Fuel-Cell.html Zukünftige Entwicklung (1:49:30) Tesla Semi: https://electrek.co/guides/tesla-semi Spielgeartikel zum Kartell: http://www.spiegel.de/spiegel/vw-audi-porsche-bmw-und-daimler-bildeten-ein-kartell-das-auto-syndikat-a-1159389.html Nissan Leaf: https://www.nissan.de/fahrzeuge/neuwagen/leaf.html Elektromobilität heute (1:59:00) Network Rail https://de.wikipedia.org/wiki/Network_Rail 2016: Batteriebusse, Linie 133 in Köln, von VDL, niederländisches Fabrikat http://www.kvb-koeln.de/german/aktuelles/e-bus/index.html E-Bus Berlin: http://www.mpm.tu-berlin.de/menue/forschung/projekte/e_bus_berlin/ Günstger Strom in Dubai: 3,5Cent http://www.wiwo.de/technologie/green/tech/preis-rekord-solarpark-bei-dubai-liefert-billigsten-strom-der-welt/14008810.html Prämie für E-Autos: Abgasskandal: https://de.wikipedia.org/wiki/Abgasskandal Anzahl der E-Autos in Deutschland: https://de.statista.com/statistik/daten/studie/265995/umfrage/anzahl-der-elektroautos-in-deutschland/ Streetscooter: https://de.wikipedia.org/wiki/Streetscooter Amazon Locker: http://www.tagesspiegel.de/wirtschaft/amazon-locker-amazon-will-hunderte-neue-abholstationen-installieren/20331538.html Keba: https://de.wikipedia.org/wiki/KEBA Keba UDP (pdf): https://www.keba.com/web/downloads/e-mobility/KeContact_P20_P30_UDP_ProgrGuide_en.pdf PHOENIX CONTACT Ladecontroller bzw. http://www.produktinfo.conrad.com/datenblaetter/550000-574999/554895-an-01-de-LADESTATION_EMOBILITY_EV_CHARGE.pdf - Wallbox: https://esl-shop.de/wallbox-ladestation-elektroauto-walli-light-pro-11kw-3-phasig.html Elektromobilität in der Zukunft (2:25:30) Well to Wheel https://www.ornl.gov/content/well-wheel-analysis-direct-and-indirect-use-natural-gas-passenger-vehicles Umweltbilanz des Akkus: Schwedische Studie die sagte, der Akku hat sich erst nach 7 Jahren amortisiert (kann man aber auch anders sehen) https://www.greentechmedia.com/articles/read/no-tesla-batteries-are-not-a-global-warming-disaster Elektromobil-Markt (2:27:24) Opel Ampera E: https://de.wikipedia.org/wiki/Chevrolet_Bolt Nissan Leaf 2: http://t3n.de/news/nissan-stellt-leaf-2-vor-neues-854460/ Fahrzyklus: https://de.wikipedia.org/wiki/Fahrzyklus Renault Twizy: https://de.wikipedia.org/wiki/Renault_Twizy BMW i3: https://de.wikipedia.org/wiki/BMW_i3 e-Golf: https://de.wikipedia.org/wiki/VW_Golf_VII#e-Golf e-up!: https://de.wikipedia.org/wiki/VW_up!#VW_e-up.21 B-Klasse Tesla: https://de.wikipedia.org/wiki/Tesla,_Inc. Tesla fahren entweder beim Händler, z.B. in Düsseldorf https://www.tesla.com/de_DE/findus/location/service/dusseldorf oder bei der bevuta IT (mail@bevuta.com) Kommentare by Dirk Breuer on <span>2017-10-05 06:08:57 UTC</span> Hi Manuel, erstmal vielen Dank für den Kommentar. Und inhaltlich auch sehr spannend. Und ich stimme dir zu, dass gerade der Hotzenblitz thematisch spannend gewesen wäre. Gerade weil er Anfang der Neunziger dediziert als Elektroauto entwicklet wurde. Und sogar in Serie. Ich denke das Twike ist zu wenig ein Auto als das es noch reingepasst hätte. Wir hatten ja explizit auch den ganzen Bereich Pedelecs ausgelassen. Wenn auch dieser Bereich natürlich für die Gesamtbetrachtung des Themas "E-Mobilität" sehr wichtig ist. Vielleicht lohnt es sich aber noch eine Folge zu dem Themenkomplex aufzunehmen, eben mit anderem Schwerpunkt. Danke dir auf jeden Fall für das wertvolle Feedback. Beste Grüße Dirk by Manuel on <span>2017-10-04 16:22:57 UTC</span> Hallo, Eigentlich eine gute Sendung, ich vermisse aber etwas diese ganzen Konzepte und teilweise auch in Kleinserien gebauten Fahrzeuge der gerade auch 80er und 90er Jahre. Das waren zwar eher Fahrzeuge von und für Ökofreaks, wie das (meines Wissens nach) immer noch produzierte Twike (ist sogar keine so kleine Serie) oder der eben als reines E-Auto entwickelte und für seine Zeit recht fortgeschrittene Hotzenblitz. Zugegeben waren das alles Kleinfahrzeuge und nichts für einen Massenmarkt aber ich finde schon das diese lustigen Kisten in einem Podcast zu E-Mobilität zumindest hätten erwähnt werden können, wenn ihr schon batterieelektrische Loks und Ähnliches erwähnt. Neuer Kommentar Nickname Content Name oder Pseudonym Dein Name oder Pseudonym (wird öffentlich angezeigt) Kommentar Mindestens 10 Zeichen Durch das Abschicken des Formulars stimmst du zu, dass der Wert unter "Name oder Pseudonym" gespeichert wird und öffentlich angezeigt werden kann. Wir speichern keine IP-Adressen oder andere personenbezogene Daten. Die Nutzung deines echten Namens ist freiwillig. Abschicken'
