["https://www.geepawhill.org/courses/leading-technical-change"]
title = "Leading Technical Change – GeePawHill.org"
full_description = "Leading Technical Change No upcoming LTC classes at this time. Be on the lookout for announcements of the next live cohort.Learn more about the course and download the outline below! 4 Days, 2 Hours/Day, 6 People. Scroll down for full course description. Monday, May 20 Tuesday, May 21 Wednesday, May 22 Thursday, May 23 Friday, May 24 1 - 3 PM Eastern (UTC-4) 1 - 3 PM Eastern (UTC-4) NO CLASS 1 - 3 PM Eastern (UTC-4) 1 - 3 PM Eastern (UTC-4) Get Your Seat The Teacher → The Theory → The Technique → The Practice → What is LTC? - “Better.” How can we help our software teams get stronger? Faster? Smarter? Happier? More positive and more productive?There are lots of ideas about what changes we might desire to make, ranging from process to policy to procedure to skillset. There’s no problem in finding proposed changes. No, the problem is in helping your team to actually make any given change.Leading Technical Change (LTC), is a course designed to focus on how to make change, not which change to make. Download the LTC Overview for your team lead or department head today! 👇 LTC Overview Document (PDF) The Course Leader My name is GeePaw Hill, and I have been helping software development teams to find the path to “better” for just over 25 years. I have worked with over a hundred different teams, in every flavor of software development.I have helped dozens of teams adopt – and adapt – new ideas to their particular custom circumstances. And there are always custom circumstances. Now, I am wanting to share what I have learned, in a short, intimate, live, remote course, called “Leading Technical Change” (LTC).LTC is composed of 4 2-hour sessions, distributed across a single week. Each offering of the course is limited to just 6 attendees.In those 8 hours, LTC develops the theory of change, then offers a variety of hardcore techniques, and finally, case-by-case analysis and advice about the real change-problems facing each attendee. Theory of Change Many people, conceiving of some change they want to make, focus all of their attention only on the “what” of that particular change. But successful change, *any* successful change, depends at least as much on the “how” as on the “what”.The theory of change we’ll be working with in the course is based around research on “cognitive frames”, the short-hand pre-assembled bits and pieces that actually underlie most day-to-day action. We can’t eliminate frames (and we wouldn’t want to), we can only change their shape.Doing that involves three abstract strategies:Take many more much smaller steps (MMMSS).Optimize for the humans (OFTH).Make Change Normal (MCN).From these three broad strategies, we can develop specific, powerful tactics to increase the likelihood that our changes will really work, and really stick. Technique of Change The course comes with what we call the Techniques Bundle. This is a collection of actual practical tips and tricks. Some of these will be familiar, some new, but all will make more sense when interpreted within the theory above. Each technique is a headline and a one-page description. Here are five of the headlines, chosen at random.Easiest Nearest Owwie First: There are small problems and there are big ones. Fix the small ones before you approach the big ones.Create Experiences, Not Arguments: Actual lived experience is the most powerful persuasive force there is.Use Locally Grounded Lightning Talks: Short high-speed talks, 15 minutes at a time, based in the real day-job situations, stir conversation, spread experience, and build both community & consensus.Dot Votes Are Data: You can gather and objectify real information for your team using even very simple and lightweight approaches. It’s cheaper, faster, and every bit as objective.Get A Heavyweight To Bless An Activity: Everyone in the c-suite knows what it is to “bless” an experiment, or a learning session. Ask them to spend 5 minutes telling the team they approve of yours.There are currently more than 30 techniques in the bundle, and we add new ones all the time, based partly on what comes from the final element of our structure, the advice. Practice of Change Just as all of us are simultaneously alike in some ways and different in others, so, too, with change problems: They’re all alike. And they’re all different.The course is restricted to just six attendees for each offering, and there’s a reason for that: it gives us the chance to work not just with theory or memorizing a catalog of practices, but with applying what we’ve learned to the actual change situations that are confronting us right now.Over the four days, each of the six attendees will lay out their change case for us. What they want, what they’ve tried, what they’re thinking of trying. We’ll pitch in, a team of seven, to help add to and elaborate on the next few steps towards that change.Many of the former students have said this was the most valuable part of the experience: actual interaction with others, to lend ideas, support, and energy to go back to work newly excited and invigorated. Join the Next LTC Cohort Get Your Seat Download the LTC Overview Download the PDF Download the LTC Overview: Download the PDF"
