["https://www.geepawhill.org/2022/10/28/can-we-be-honest"]
title = "Can We Be Honest? – GeePawHill.org"
full_description = "Home2022October28Can We Be Honest? Part 3 of 5 in the series Leading Technical Change Can we be honest? If we’re going to be successful change midwives, honesty is very important. In this technique card from Leading Technical Change, I talk about some of the ins & outs of this complicated topic. The first point is urgent: Being honest means believing everything you say, not saying everything you believe. Honesty is really important, but people quite often over-share in the name of pursuing honesty. Every healthy person, for instance, has moments of extreme negativity. Our honest reaction might basically amount to, “I hate you I hate you I hate you. Your mom is ugly and your dog is stupid.” Now, I might actually believe that, however momentarily, but even if I do, saying it isn’t “just being honest”, it’s a) saying something just because you believe it right now, and b) being pretty mean, and frankly, c) highly contraindicated. Another point, related to that first one: You can defer parts of what you believe, without being dishonest. You are allowed, even encouraged, to find the right place, time, and especially tone for it is you’re thinking. It is naive to think that everyone who turns to you with a question is actually asking the question as written. One person can ask you the same exact question at two different times, and still be asking you for two different things. Being honest successfully involves you grasping a very rich and messy context, including your mood, their mood, the phrasing of the question, the spirit of it, and so on. A third point: one place I do nearly always speak out: When leaders presume a level of trust from their underlings that I do not believe those underlings actually have, I nearly always speak to it. People dramatically underestimate how power-over influences trust-relationships and dialogue. There are many fine, even beloved, people in power-over settings, who do not understand that our lack of trust is not actually a reflection on them, but on their current role. As a coach, I am often uniquely placed to be able to help them understand this, in a way that their underlings have no route to. Next, what about confidences? As one’s influence in a team grows, people will very often reach out, in confidence, to tell you about something they see in the team, something they’re not happy with, something they think you haven’t noticed, something they don’t want to bring up. When that happens, be very careful. Regard it as a win. You’ve been given a very special gift, someone is offering you one of their secrets. Honesty be damned, do not betray secrets. Here’s what you can do, though. You can ask the confidence-giver if it’s okay if you speak to the issue, should you notice it, without mentioning who helped you notice it. The truth is, more often than not, the answer is that that’s fine. The truth is, they often brought the confidence to you for exactly that reason. It is the outcome they wanted all along. Finally, though, don’t be afraid to talk about reality. Coaches aren’t motivational posters, or corporate glad-handers. You don’t have to pretend that a problem is not a problem. On the contrary, looking at a problem and accepting, cheerfully, that it’s a problem, is one of the ways you can be greatest benefit to your teams. There’s always problems. If there weren’t any problems, we wouldn’t be looking to change things, now would we? Coaches should model, perhaps above all other things, the cheerful and open acceptance of reality, and be explicit in identifying issues, and proposing a way forward, even if that way forward is currently out of reach. One more pro-tip: higher-ups aren’t actually non-people, tho from that little ant-position down on the ground floor, they sometimes seem to be. They’re people, and they also know about trust, and value honesty. Try getting a c-suite person off by herself, and just talking and listening to her. She’ll actually respond to you as anyone else does. Hesitantly, at first, but over time, relaxing into the relationship. Over the years, I’ve been contacted back-channel by many a high-ranking person, to do what: to give me a confidence about something that’s going on that they want me to notice and poke at. 🙂 As a coach, my integrity is one of my most valuable assets, and I protect it very carefully, and think about it often. Honesty really is the best policy, but take your time, don’t be mean, and listen more than you talk, and you’ll do fine. Does the GeePaw Blogcast add value? If so, consider a monthly donation to help keep the content flowing. You can also subscribe for free to get weekly posts sent straight to your inbox. And to get more involved in the conversation, jump into the Camerata and start talking to other like-minded Change-Harvesters today. #mp_form_slide_in3 .mailpoet_form { } #mp_form_slide_in3 .mailpoet_paragraph { line-height: 20px; } #mp_form_slide_in3 .mailpoet_segment_label, #mp_form_slide_in3 .mailpoet_text_label, #mp_form_slide_in3 .mailpoet_textarea_label, #mp_form_slide_in3 .mailpoet_select_label, #mp_form_slide_in3 .mailpoet_radio_label, #mp_form_slide_in3 .mailpoet_checkbox_label, #mp_form_slide_in3 .mailpoet_list_label, #mp_form_slide_in3 .mailpoet_date_label { display: block; font-weight: bold; } #mp_form_slide_in3 .mailpoet_text, #mp_form_slide_in3 .mailpoet_textarea, #mp_form_slide_in3 .mailpoet_select, #mp_form_slide_in3 .mailpoet_date_month, #mp_form_slide_in3 .mailpoet_date_day, #mp_form_slide_in3 .mailpoet_date_year, #mp_form_slide_in3 .mailpoet_date { display: block; } #mp_form_slide_in3 .mailpoet_text, #mp_form_slide_in3 .mailpoet_textarea { width: 200px; } #mp_form_slide_in3 .mailpoet_checkbox { } #mp_form_slide_in3 .mailpoet_submit input { } #mp_form_slide_in3 .mailpoet_divider { } #mp_form_slide_in3 .mailpoet_message { } #mp_form_slide_in3 .mailpoet_validate_success { font-weight: 600; color: #468847; } #mp_form_slide_in3 .mailpoet_validate_error { color: #b94a48; } #mp_form_slide_in3 .mailpoet_form_loading { width: 30px; text-align: center; line-height: normal; } #mp_form_slide_in3 .mailpoet_form_loading > span { width: 10px; height: 10px; background-color: #5b5b5b; }#mp_form_slide_in3{border: 1px solid #bfcfdd;border-radius: 5px;text-align: left;}#mp_form_slide_in3{width: 320px;max-width: 100vw;}#mp_form_slide_in3 .mailpoet_message {margin: 0; padding: 0 20px;}#mp_form_slide_in3.mailpoet_form_slide_in { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }#mp_form_slide_in3.mailpoet_form_position_right { border-top-right-radius: 0; }#mp_form_slide_in3.mailpoet_form_position_left { border-top-left-radius: 0; }#mp_form_slide_in3 .mailpoet_paragraph.last {margin-bottom: 0} @media (max-width: 500px) {#mp_form_slide_in3 {background-image: none;animation: none;border: none;border-radius: 0;bottom: 0;left: 0;max-height: 40%;padding: 20px;right: 0;top: auto;transform: none;width: 100%;min-width: 100%;}} @media (min-width: 500px) {#mp_form_slide_in3 {padding: 20px;}} @media (min-width: 500px) {#mp_form_slide_in3 .last .mailpoet_paragraph:last-child {margin-bottom: 0}} @media (max-width: 500px) {#mp_form_slide_in3 .mailpoet_form_column:last-child .mailpoet_paragraph:last-child {margin-bottom: 0}} Please leave this field emptyWant new posts straight to your inbox once-a-week? One More Step! Check your email to confirm you really mean it. Thanks!"
