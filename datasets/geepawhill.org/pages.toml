title = "About – GeePawHill.org"
full_description = "Hi! I’m GeePaw1 Hill. I was lucky enough to become a professional computer programmer around the middle of 1980. I wrote in a language we hardly see anymore, called Forth. I wrote a word processor, a database system, a pen-plotter system, and a whole bunch of unique extensions to the Forth language. I have been an independent for most of my 40-year career. About 20 years ago, I became an avid early-adopter of a programming method called Extreme Programming (XP). I fell deeply under the influence of ne’er-do-wells like Kent Beck, Ron Jeffries, Bob Martin, and joined that early movement with great energy and fervor. I also became a software development coach. I work with software organizations all over the world, down on the floor and up in the penthouse, helping them find and implement solutions to the vexing difficulties of shipping software value for a living. I live in an aging hippie community in central Virginia, nestled up in the foothills of the gorgeous Blue Ridge mountains, half an hour’s drive from Charlottesville. I live with my glorious wife Virginia, two dogs called Molly and Wally, and various parts at various times of the rest of my awesome family. Your organization can work with GeePaw. Your conference or user’s group can meet GeePaw. 1Yes, it’s really GeePaw, which is short for ‘grandfather’. Through a series of miraculous events, I became a grandfather at a very young age, just 31. Family and friends thought it was funny, and started calling me GeePaw. The GeeKids in question all grew up calling me that. Now, 27 years on, folks mostly just call me GeePaw. If that makes you uncomfortable, my given name is Michael, and you’re welcome to use that, too."
