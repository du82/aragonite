full_description = "Slowing Decisions Down Leading Technical Change / November 11, 2022 This entry is part 5 of 5 in the series Leading Technical ChangeHere’s another technique card from my seminar, “Leading Technical Change”. We first get into midwifing change precisely because we want it to be smoother, easier, and faster. But sometimes, a coach needs not to rush a decision through, but to slow it down. It’s so exciting when our proposed change starts to catch fire, especially […] Slowing Decisions Down Read More » What About Failure? Leading Technical Change / November 9, 2022 This entry is part 4 of 5 in the series Leading Technical ChangeIf we’re going to enable and support change, we’re going to fail, more often than we succeed, and we want to bake that idea in, early on, lest we fail both more often, and potentially more disastrously. Here’s some thoughts around this NOT DEPRESSING topic. 🙂 The weirdest thing about all this: it’s actually rather What About Failure? Read More » Can We Be Honest? Leading Technical Change / October 28, 2022 This entry is part 3 of 5 in the series Leading Technical ChangeCan we be honest? If we’re going to be successful change midwives, honesty is very important. In this technique card from Leading Technical Change, I talk about some of the ins & outs of this complicated topic. The first point is urgent: Being honest means believing everything you say, not saying everything you believe. Honesty Can We Be Honest? Read More » Slash the Load Coaching, Change Harvesting, Leading Technical Change / October 25, 2022 This entry is part 2 of 5 in the series Leading Technical ChangeThe people who hire me ask me to help their teams make changes. Most of the time, my first step is to see how I can slash those teams’ load. Here’s a technique card from my seminar, “Leading Technical Change” Raw text of a technique card: Wait, what? First thing I do To me, this Slash the Load Read More » Detail: Series Intro TDD, Programming, How I Work, Coding, Detail / October 25, 2022 Detail: The thing that strikes me over and over again, in my own work style, in my Friday group’s analytics, in Ron’s long-running Kotlin and short-running Gilded Rose series, is how much attention high-skill geeks pay to some of the smallest details in the code. An example. I was doing Gilded Rose the other day, Detail: Series Intro Read More »"
