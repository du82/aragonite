full_description = 'Basic Concepts of the “Making App” Let’s talk about the basic concept of the "making app". I’ve written about this before, and demoed it in some of my public project walk-throughs, but there’s no single straightforward explanation out there, so let’s take a swing. What is a "making app", and why might one want to roll one for a project? In […]Read More October 1, 2024 Optimize for Our Humans Leading Technical Change is a small, live, remote seminar aimed squarely at a single topic: Real Change in the Real World. A new cohort is open now: March 11,12,14, & 15, 10am to noon Eastern (UTC-5). There are just six seats available, so we can drill down on the actual situations in which you’re seeking […]Read More February 23, 2024 Why Only Change Frames? Today I want to answer a question that, honestly, almost no one ever asks. Why are we changing frames, instead of getting rid of them altogether? Talking about change in the geek trades is a joy for me, but I’m even more interested in seeing change out in the world. Please think outside the monitor. […]Read More February 2, 2023 The Frame-Changing Triad We started with the concept of the mental frame, a comparatively rigid & invisible construct which structures and guides nearly all our behaviors. Today, let’s take up the triad of powerful forces that we can use to change frames: community, narrative, and experience. https://www.geepawhill.org/2023/01/20/changing-the-frame/ As ever with me, though considering change in the geek trades […]Read More January 26, 2023 Changing The Frame For nearly everyone who seeks to facilitate change, the first faltering step is usually in the crafting of a persuasive argument.Read More January 20, 2023 Slowing Decisions Down Here’s another technique card from my seminar, “Leading Technical Change”. We first get into midwifing change precisely because we want it to be smoother, easier, and faster. But sometimes, a coach needs not to rush a decision through, but to slow it down. It’s so exciting when our proposed change starts to catch fire, especially […]Read More November 11, 2022'
