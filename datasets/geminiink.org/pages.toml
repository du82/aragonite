["https://geminiink.org/teen-writing-circle"]
title = "Teen Writing Circle - Gemini Ink"
full_description = "I like how it introduced us to new poetry and types of poetry from day 1, really encouraging us to be creative. Creative voice is what makes us human and individuals. It's a representation of our autonomy. Everyone should be allowed to be autonomous. I feel like every writer has an implicit style. I wasn't forced to write or share anything so that made it easier to use my voice on my terms. Are you a teen who enjoys writing in their free time? Or are you someone who’s never had the chance to write on their own? If so, this Online Teen Writing Circle is for you! In this once-a-month writing circle, teens will enjoy writing in a judgment free zone. We’ll break the ice with one another and perform various writing exercises. You are encouraged to share your work with your peers and get constructive feedback, but it is not required. Our only goal is to keep you writing! Daniel Ramirez has been an educator for over 15 years. After studying History in grad school, he tromped around the outdoors doing conservation with teenagers. Spending time as a Montessori educator revealed the power of incorporating creativity with learning. Encouraging youth to tap into their creative abilities convinced him to discover his own. Since then, in addition to his original love of storytelling, he’s found a penchant for calligraphy, puppetry, poetry, and block printing. A San Antonio native, he explores the crystalline waters of Central Texas in his free time."
