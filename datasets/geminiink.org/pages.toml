title = "Events - Gemini Ink"
description = "These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction."
full_description = "6:30 pm - 8:30 pm Recurring Open Writer’s Labs January 27 @ 6:30 pm - 8:30 pm CST Recurring Open Writer’s Labs These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction. Free 2:00 pm - 4:00 pm Live Storytelling: Voices of San Anto Showcase February 1 @ 2:00 pm - 4:00 pm CST Live Storytelling: Voices of San Anto Showcase You're invited to a live storytelling show featuring students from our Voices of San Anto... Free 6:30 pm - 8:30 pm Uncovering the Whole Self: Create Poetic Self-Portraits with Ayokunle Falomo February 3 @ 6:30 pm - 8:30 pm CST Uncovering the Whole Self: Create Poetic Self-Portraits with Ayokunle Falomo In this two-session workshop, we will use works of art by revered artists like Frida Kahlo plus poems by Safia Elhillo, Chen Chen, Aimee Nezhukumatathil, and Tarfia Faizullah to generate new work through the lens of self-reflection. Participants will also use writing prompts to reflect deeply on who they are. What new truths will be discovered, or uncovered, about the self? How will you use these exercises to shape poems that are honest and vulnerable? $135 6:30 pm - 8:30 pm From Story to Song: Crafting Memorable Lyrics with Nathan Brown February 11 @ 6:30 pm - 8:30 pm CST From Story to Song: Crafting Memorable Lyrics with Nathan Brown In this two-day workshop, we’ll compare and contrast the worlds of story and songwriting, uncovering their similarities and differences while discussing what makes a song lyric unforgettable. Then, we’ll use real-world examples to highlight the rich narratives that live behind some well-known tunes that we love. $140 6:30 pm - 8:30 pm Story Core with Rubén Degollado February 18 @ 6:30 pm - 8:30 pm CST Story Core with Rubén Degollado In this six-session generative virtual workshop, participants will begin by exploring examples of the core elements of setting, plot, and characters working well together to create a cohesive storyline. We will do pre-writing exercises focused on drafting complicated characters who connect to the reader’s emotions and make them want to keep reading. Then we will move through a series of setting exercises that build the details of place and transport the reader there. This generative work will prime writers for creating memorable stories with believable characters navigating the worlds they inhabit. $155"
