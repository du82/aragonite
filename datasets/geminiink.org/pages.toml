["https://geminiink.org/events/lit-minds-book-club"]
title = "LitMinds Book Club - Gemini Ink"
description = """
Join us for the LitMinds Book Club at Gemini Ink. We’re reading  Ocean Vuong’s On Earth We’re Briefly Gorgeous.
Register
An instant New York Times Bestseller!
Longlisted for the 2019 National Book Award for Fiction, the Carnegie Medal in Fiction, the 2019 Aspen Words Literacy Prize, and the PEN/Hemingway Debut Novel Award
Shortlisted for the 2019 Center for Fiction First Novel Prize
“A lyrical work of self-discovery that’s shockingly intimate and insistently universal…Not so much briefly gorgeous as permanently stunning.” —Ron Charles, The Washington Post
Poet Ocean Vuong’s debut novel is a shattering portrait of a family, a first love, and the redemptive power of storytelling
On Earth We’re Briefly Gorgeous is a letter from a son to a mother who cannot read. Written when the speaker, Little Dog, is in his late twenties, the letter unearths a family’s history that began before he was born — a history whose epicenter is rooted in Vietnam — and serves as a doorway into parts of his life his mother has never known, all of it leading to an unforgettable revelation. At once a witness to the fraught yet undeniable love between a single mother and her son, it is also a brutally honest exploration of race, class, and masculinity. Asking questions central to our American moment, immersed as we are in addiction, violence, and trauma, but undergirded by compassion and tenderness, On Earth We’re Briefly Gorgeous is as much about the power of telling one’s own story as it is about the obliterating silence of not being heard.
With stunning urgency and grace, Ocean Vuong writes of people caught between disparate worlds, and asks how we heal and rescue one another without forsaking who we are. The question of how to survive, and how to make of it a kind of joy, powers the most important debut novel of many years.

Ocean Vuong is the author of the debut novel, On Earth We’re Briefly Gorgeous, out from Penguin Press (2019) and forthcoming in 12 other languages worldwide. He is also the author of the critically acclaimed poetry collection, Night Sky with Exit Wounds, a New York Times Top 10 Book of 2016, winner of the T.S. Eliot Prize, the Whiting Award, the Thom Gunn Award, and the Forward Prize for Best First Collection. A Ruth Lilly fellow from the Poetry Foundation, his honors include fellowships from the Lannan Foundation, the Civitella Ranieri Foundation, The Elizabeth George Foundation, The Academy of American Poets, and the Pushcart Prize."""
full_description = "Longlisted for the 2019 National Book Award for Fiction, the Carnegie Medal in Fiction, the 2019 Aspen Words Literacy Prize, and the PEN/Hemingway Debut Novel Award “A lyrical work of self-discovery that’s shockingly intimate and insistently universal…Not so much briefly gorgeous as permanently stunning.” —Ron Charles, The Washington Post Poet Ocean Vuong’s debut novel is a shattering portrait of a family, a first love, and the redemptive power of storytelling On Earth We’re Briefly Gorgeous is a letter from a son to a mother who cannot read. Written when the speaker, Little Dog, is in his late twenties, the letter unearths a family’s history that began before he was born — a history whose epicenter is rooted in Vietnam — and serves as a doorway into parts of his life his mother has never known, all of it leading to an unforgettable revelation. At once a witness to the fraught yet undeniable love between a single mother and her son, it is also a brutally honest exploration of race, class, and masculinity. Asking questions central to our American moment, immersed as we are in addiction, violence, and trauma, but undergirded by compassion and tenderness, On Earth We’re Briefly Gorgeous is as much about the power of telling one’s own story as it is about the obliterating silence of not being heard. With stunning urgency and grace, Ocean Vuong writes of people caught between disparate worlds, and asks how we heal and rescue one another without forsaking who we are. The question of how to survive, and how to make of it a kind of joy, powers the most important debut novel of many years. Ocean Vuong is the author of the debut novel, On Earth We’re Briefly Gorgeous, out from Penguin Press (2019) and forthcoming in 12 other languages worldwide. He is also the author of the critically acclaimed poetry collection, Night Sky with Exit Wounds, a New York Times Top 10 Book of 2016, winner of the T.S. Eliot Prize, the Whiting Award, the Thom Gunn Award, and the Forward Prize for Best First Collection. A Ruth Lilly fellow from the Poetry Foundation, his honors include fellowships from the Lannan Foundation, the Civitella Ranieri Foundation, The Elizabeth George Foundation, The Academy of American Poets, and the Pushcart Prize."
