title = "How Writers Can Support Wildfire Relief in Southern California - Gemini Ink"
description = "As writers gather in LA for #AWP25 (March 26-29, 2025), our community stands with those impacted by the devastating Southern California wildfires that have affected multiple counties and displaced thousands. In January 2025, Southern California experienced unprecedented wildfires that: Burned over 40,000 acres Destroyed more than 12,300 structures Prompted evacuation warnings for 200,000 residents Impacted"
full_description = "As writers gather in LA for #AWP25 (March 26-29, 2025), our community stands with those impacted by the devastating Southern California wildfires that have affected multiple counties and displaced thousands. In January 2025, Southern California experienced unprecedented wildfires that: Burned over 40,000 acres Destroyed more than 12,300 structures Prompted evacuation warnings for 200,000 residents Impacted regions from Pacific Palisades to Malibu, Castaic, and beyond The Palisades Fire burned nearly 24,000 acres, while the Eaton Fire consumed over 14,000 acres, devastating communities. Several fires remain active, including the Hughes Fire, at 14% containment. The writing community’s support is crucial as the region faces this crisis and begins recovery Organizations You Can Support California Wildfire Relief Fund Provides N95 masks, medical supplies, and emergency resources California Community Foundation Wildfire Recovery Fund Targets underserved communities Habitat for Humanity of Greater Los Angeles Helps families rebuild homes and relocate World Central Kitchen Provides meals across Southern California Supports communities with food and water Baby2Baby Disaster Relief and Emergency Response Program Providing critical items for children and families Los Angeles Regional Food Bank Distributes food and other essentials to Los Angeles individuals in need California Fire Foundation Supports firefighters, their families, and the communities they serve Greater Good Charities Delivers humanitarian aid for displaced families and pets Provides emergency medicine, food, and supplies for horses that fled the flames Assesses the fire’s impact on local wildlife Additional Support Options Apply for recovery assistance at DisasterAssistance.gov Contact 211 Los Angeles for comprehensive support services Check local YMCA locations for donation drop-off points Quick Donation Tips Verify organizations before donating Consider both immediate relief and long-term recovery funds Every contribution, big or small, makes a difference How Writers Can Help Beyond Donations 1. Fundraising Campaigns Organize writing workshops or events with proceeds going to relief efforts Create anthology or chapbook fundraisers 2. AWP25 Community Action Attend on-site fundraising events Participate in awareness initiatives Connect with local relief organizations Connect and Stay Informed Follow hashtags: #SoCalWildfireRelief #RebuildSoCal Share information with your writing networks #SupportLA #WildfireRelief #AWP25Community"
author = "Anisa Onofre"
year_published = 2025
year_updated = 2025
