full_description = "6:30 pm - 8:30 pm Recurring Open Writer’s Labs October 28, 2024 @ 6:30 pm - 8:30 pm CST Recurring Open Writer’s Labs These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction. Free 10:00 am - 2:30 pm The Mythology of Me: Applying Poetry and Narrative Therapy to Personal Stories with Aaron Deutsch and Dr. Heather Pitamber November 2, 2024 @ 10:00 am - 2:30 pm CST The Mythology of Me: Applying Poetry and Narrative Therapy to Personal Stories with Aaron Deutsch and Dr. Heather Pitamber In this 1-day generative workshop, co-led by poet Aaron Deutsch and Licensed Professional Counselor Heather Joy Pitamber, participants will explore the practice of Narrative Therapy, a counseling technique that empowers participants to “rewrite” their story for a future that reflects who they really are, what they are capable of, and what their purpose is. Then, we will practice applying this therapeutic tool to our own writing to generate compelling stories that carve out new possibilities. $145 6:30 pm - 9:30 pm Razzmatazz & All That Jazz: An Evening in Celebration of Andrea “Vocab” Sanderson November 8, 2024 @ 6:30 pm - 9:30 pm CST Razzmatazz & All That Jazz: An Evening in Celebration of Andrea “Vocab” Sanderson Join Gemini Ink, San Antonio’s Writing Arts Center, at the beautiful McNay Art Museum on Friday, November 8th, for an unforgettable, festive evening celebrating the extraordinary achievements of Andrea “Vocab” Sanderson, our 2024 Recipient of The Award for Literary Excellence. Enjoy our star-packed lineup (details coming soon!) and mingle with friends and fellow literary fans as we honor this brilliant poet, multifaceted artist, performer, and community leader who is at the heart of the writing arts in our city. 10:00 am - 1:00 pm To Praise the Ruined World with Sheila Black November 9, 2024 @ 10:00 am - 1:00 pm CST To Praise the Ruined World with Sheila Black In this one-day workshop, we will read poems by Naomi Shihab Nye, Adam Zagajewski, Frank O’Hara, Roger Reeves, January Gil O’Neil, and others that demonstrate how praise can be a tool for understanding and transcending even the hardest truths. We will explore how these poets craft praise songs that acknowledge life’s sorrows and losses. We will then write our poems of recovery and resilience. $140"
