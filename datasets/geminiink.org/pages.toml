["https://geminiink.org"]
title = "Gemini Ink - San Antonio’s Writing Arts Center"
full_description = "Gemini Ink always makes me feel so appreciated and valued and I could not thank y'all enough. Thank you for your constant encouragement. The staff is amazing and welcoming. I love working for Gemini Ink, the organization really takes care of it's Teaching Artists like familia and celebrates us. They provide support through trainings and literary resources. If school districts treated their Teachers how Gemini treats Teaching Artists, then we wouldn't leave. Loved reading at Gemini Ink! If you are a writer in the San Antonio area, get thee to their HQ on Navarro street! Writing is such a solitary activity that finding camaraderie makes a difference. Here's to writers in Texas who showed me that it's best created with warmth and generosity. They really welcome you in. I interned at Gemini Ink in college and was very fortunate to meet all its staff members who are some of the most intelligent, kind, and artistic people I have ever met. The classes are always filled with strong writers and poets. I was in a summer camp they put on in 2011 (when I was around 15) and it helped me find my path to becoming a poet. It's a wonderful literary arts organization that does a great job of helping people tell their own stories. A real treasure. If you like to write - prose, poetry, whatever - and want to find like-minded folks, this is the place. All skill levels are welcome and friendly advice is provided. Terrific speakers and seminars too. I can't say enough lovely things about Gemini Ink and their internships! They do amazing things in the SATX area. One of jewels of San Antonio. They do so many great things for the community, working with young people, incarcerated teens, veterans, and anyone interested in writing and literature. Great combo of visiting and local authors. Classes for all skill levels."
