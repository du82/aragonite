["https://geminiink.org/events/creative-resilience"]
title = "Cultivate Creative Resilience and Write Unforgettable Works with Jen Knox - Gemini Ink"
description = """
Tuesday(s), April 22 & 29, 2025 from 6:30-8:30pm, CST via Zoom.
Nonmember $145        Member  $125        Student $85
*EARN CPE’S
TWO SCHOLARSHIPS AVAILABLE

 

Creative resilience means facing setbacks and moving forward in your artistry anyway. It means harnessing the energy to create what you feel called to produce. It means owning your journey completely as you share your art. But how do you manage the ups and downs of the writing life, tell your truths without injuring yourself, and keep your creative engine burning through it all?
In this two-part workshop, we will explore the many versions of creative block, from writer’s block to rejection letters, from tough critiques to typos to self-doubt. We will then combine writing and resiliency techniques to support an enduring creative practice while generating bold new work that only you can write. 
This course is open to writers of all genres, backgrounds, and skill levels, 18+.
What you can expect in this workshop: 

A nurturing and fun space to explore your stories and poetry
Creative resilience techniques for writing through and about difficult times
Practice using these tools to generate authentic raw material
Feedback and an opportunity to share



Jen Knox was a high school dropout who found purpose in writing, leading her to earn a BA from Otterbein University and an MFA from Bennington College’s Writing Seminars. She taught writing for over a decade and led the Writers in Communities Program at Gemini Ink. Now an award-winning author and lecturer at Ohio State University, Jen’s fiction can be found in The Best Small Fictions, The Adirondack Review, Chicago Tribune, Istanbul Review, Literary Orphans, McSweeney’s Internet Tendency, Room Magazine, The Santa Fe Writers Project Quarterly, and The Saturday Evening Post, among over a hundred other publications. Jen’s books include We Arrive Uninvited (Steel Toe Books Award Winner in Prose) and The Glass City (Press Americana Prose Winner). She recently received grants from the Ohio Arts Council and the Greater Columbus Arts Council to work on a collection of essays about work, and her newest novel Chaos Magic, will be released by Kallisto Gaia Press in February 2025. www.jenknox.net
Social media links:
Instagram: https://www.instagram.com/_jenknox_/
Facebook: https://www.facebook.com/jen.knox2/"""
