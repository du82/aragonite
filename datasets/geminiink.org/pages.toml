title = "Everyday Stories of Consent at Empower House - Gemini Ink"
full_description = "Everyday Stories of Consent at Empower House Happy #pubdate to Empower House students who composed slogans in our workshop on Everyday Stories of Consent this summer, 2022. Teaching Artists Mandy Lynn Lara, Clint Taylor, and Project Artist Aminah Dece provided 16 instructional hours in creative writing to middle school students at the summer camp. They guided students through the study of basic playwriting conventions, an exploration of everyday moments of consent, and the process of writing short plays that explore this theme. Through the writing process, students created slogans about consent that were published as this collection of slogans on printed broadsides. Students will present their dramatic works as staged readings to close out the project. Thank you to Empower House for this collaboration, and thanks to supporters: Charity Ball Association, San Antonio Area Foundation, City of San Antonio Dept of Arts & Culture, Frost Bank, TCA, the Greehey Family Foundation, and Teaching Artists Mandy Lynn Lara, Clint Taylor, and Project Artist Aminah Dece! #empowerhouse #broadsides #publication #poets! View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger Here are photos of our Empower House teen writers performing their skits on setting boundaries and consent with their 1-800-CONSENT hotline and slogans and more!! Also pics of our Gemini Ink Partner Class teaching artists, Mandy Lynn Lara and Clint Taylor, and Partner Class team!"
