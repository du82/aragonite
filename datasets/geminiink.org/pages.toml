["https://geminiink.org/events/story-core-with-ruben-degollado"]
title = "Story Core with Rubén Degollado - Gemini Ink"
description = """
Tuesday(s), February 18, 25 & March 4, 11, 18, 25, 2025, 6:30-8:30pm CST, via Zoom
Nonmember $155       Member    $135                  Student $95
*EARN CPE’S

 

Get down to the core of a fantastic story! Understanding how setting, plot, and character are inextricably linked is vital to creating immersive narratives that keep the reader invested through to the last page. 
In this six-session generative virtual workshop, participants will begin by exploring examples of the core elements of setting, plot, and characters working well together to create a cohesive storyline. We will do pre-writing exercises focused on drafting complicated characters who connect to the reader’s emotions and make them want to keep reading.  Then we will move through a series of setting exercises that build the details of place and transport the reader there. This generative work will prime writers for creating memorable stories with believable characters navigating the worlds they inhabit.
This course is open to fiction writers of all backgrounds and skill levels, 18+.
Students will leave this workshop with: 

A character empathy map
A full character profile
A developed setting for their story

Join us for the Lit Minds Book Club on March 12! We’re reading The Family Izquierdo, by Rubén Degollado.
Read Rubén’s Writer’s Desk Q&A!

Rubén Degollado’s work has appeared or been featured in Texas Highways, Literary Hub, CRAFT, The Common, The Rumpus, Image Journal, and elsewhere. His first novel Throw won the Texas Institute of Letters Best Young Adult book for 2020. His debut literary novel The Family Izquierdo is a New York Times Book Review editor’s choice and a long list title for the PEN/Faulkner and Mark Twain American Voice in Literature awards. Rubén lives and writes along the southern border, in the Río Grande Valley of Texas."""
