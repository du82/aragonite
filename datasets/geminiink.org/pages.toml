["https://geminiink.org/events/teen-writing-circle-2025-02-22/2025-02-22"]
title = "Teen Writing Circle with Daniel Ramirez - Gemini Ink"
description = """
Register
Last Saturday of Every Month 11:30am-1pm cst via Zoom
For ages 13-19 years old
Are you a teen who enjoys writing in their free time? Or are you someone who’s never had the chance to write on their own? If so, this Online Teen Writing Circle is for you! 
In this once-a-month writing circle, teens will enjoy writing in a judgment free zone. We’ll break the ice with one another and perform various writing exercises. You are encouraged to share your work with your peers and get constructive feedback, but it is not required. Our only goal is to keep you writing!
This course is open to teen writers of any skill level.
Participants will leave the writing circle with: 

New, unique written work
Listening and sharing experience
Constructive feedback to help improve their writing

Want to learn more about our Teen Writing Circle? Check out our Frequently Asked Questions!


Daniel Ramirez has been an educator for over 15 years. After studying History in grad school, he tromped around the outdoors doing conservation with teenagers. Spending time as a Montessori educator revealed the power of incorporating creativity with learning. Encouraging youth to tap into their creative abilities convinced him to discover his own. Since then, in addition to his original love of storytelling, he’s found a penchant for calligraphy, puppetry, poetry, and block printing. A San Antonio native, he explores the crystalline waters of Central Texas in his free time."""
