["https://geminiink.org/work-with-us"]
title = "Work With Us - Gemini Ink"
full_description = "”Thank you Gemini Ink for being the BEST ORG with the BEST TEAM!! ?? I'm having a blast and don't want it to end this soon! Gemini Ink’s mission is to teach the craft of writing to people of all skill levels so they can bring their stories to life. Since 1993, Gemini Ink has functioned as San Antonio’s writing arts center, nurturing excellence in the craft of writing and promoting literary and reader engagement throughout the city. Our year-round programs nurture the creative voices of tomorrow, increase access to the literary arts, and celebrate the rich literary culture of our city and region. As a dynamic, small-to-midsize nonprofit dedicated to celebrating the writing arts, our passionate team works collaboratively to deliver impactful programming, nurture artistic expression, and engage our community. We are seeking a full-time Development Manager to join our hardworking team and add critical capacity to our development initiatives. Position Overview: The Development Manager will play a key role in supporting and expanding our development efforts, by focusing on grant management, providing key support for fundraising events, spearheading membership growth, and helping to oversee donor stewardship. This role will report to the Executive Director and work closely with other team members to achieve fundraising goals and build lasting relationships with donors, sponsors, members, and our vibrant literary community. To learn more and to apply: please visit Submittable at https://geminiink.submittable.com/submit/321280/job-opening-development-manager Opportunity for Professional Writers If you have experience teaching creative writing and want to help bring creative writing, reading, storytelling, and thinking to diverse communities as a teaching artist for our Partner Classes, we want to meet you. Bilingualism is a plus. Email your resume or CV and three pages of writing samples to fbrown@geminiink.org or apply at this link: https://bit.ly/TAs_apply Build your network and strengthen your skills by volunteering at San Antonio’s Writing Arts Center. Gemini Ink offers volunteer positions on an ongoing basis. We regularly need help with our Autograph Series, and Inkstravaganza Gala."
