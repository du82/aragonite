["https://geminiink.org/read-it-write-it-share-it-walzem-3rd-graders-publish-broadsides"]
title = "“Read It! Write It! Share It!”: Walzem 3rd Graders Publish Broadsides - Gemini Ink"
full_description = "Last spring, teaching artists Excy Guardado Bonilla and Kit Cura from Gemini Ink conjured up a world of wonder for 3rd graders through their workshop, “Read It! Write It! Share It!” Bonilla and Cura guided students through studying mentor texts with a focus on language and imaginative prompts. Bonilla and Cura integrated Walzem’s school theme of The Greatest Showman/the circus and encouraged students to write in the genres of flash fiction and poetry. Their workshop was held in the library, where the teaching artists had support from the librarians. During their workshop, they were visited by fiction writer Desiree Kennel, who assisted students with prompts and writing exercises. Their workshop culminated in broadsides and a reading with family, friends, and community. Thank you to our sponsors, Rackspace and Walzem Elementary School, and our teaching artists, Excy Guardado Bonilla and Kit Cura! View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger"
