["https://geminiink.org/the-big-texas-read"]
title = "The Big Texas Author Talk - Gemini Ink"
full_description = "Each month, we feature one Texas author in conversation with another. We offer a vast array of storytellers who represent the spirit of the Lone Star State and continue to keep us on the literary map. In the past, we’ve featured novelists such as Kathleen Kent, Marisol Cortez, Joe Lansdale, and Antonio Ruiz-Camacho and Texas poet laureates such as Carmen Tafolla, Laurie Ann Guerrero, Jenny Brown, and Emmy Pérez. “I buried // everything they told me to bury. Then, I dug it up again,” Melissa Studdard writes in Dear Selection Committee, an apt description of the work these poems do to unearth the incorrigible self and bury conventionality and its offspring, shame. The speaker revels in her largesse, claiming, in one poem’s title, she’s “Huge Like King Kong, Like Godzilla, Like Gulliver,” and that the “world is my diorama of a world,” and in another, that her honeymoon pictures are “the cover / of the 1855 edition of Leaves of Grass.” All of this immensity, this grand unburying, is squeezed into the prosaic corseting structure of a job application, intensifying the split between tame and wild. Even her own birth is enacted with kinetic magnificence: “I broke the kingdom inside her, broke the gala / of horses straining to get out. I broke the dancehall // mirrors and even the gilded faucet handles. / I was a river that strong. Made for flooding.” Indeed, these poems are so desirous and animated that they spilled over the edges of the page and into my thirsty soul. “-Diane Seuss “The poems in Dear Selection Committee say what I’ve always wanted to say in a job application (and what I’m thinking as I perform the role of Normal Job Person) but never had the guts. Melissa Studdard’s burn-it-down-radical honesty is elating af—exactly what I needed to read—but the poetic attentiveness, from the first page to the last, was the real thrill. At the heart of the cyclone, a dependable, deepening pulse of self preservation.” -Jennifer L. Knox"
year_published = 2020
year_updated = 2025
