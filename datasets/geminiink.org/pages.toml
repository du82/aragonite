title = "Razzmatazz & All That Jazz: An Evening in Celebration of Andrea “Vocab” Sanderson - Gemini Ink"
description = """
Purchase Tickets and Sponsor Levels



Celebrating Andrea “Vocab” Sanderson at the McNay Art Museum Moroccan Courtyard and Leeper Auditorium, Friday, November 8th, 6:30-9:30 pm




2024 Award for Literary Excellence
Andrea Vocab Sanderson
Honorary Co-Chair
Dr. Eric Castillo
Associate Vice Chancellor of Arts, Culture, and Community Impact for the Alamo Colleges District
Moderator
Glo Miles
Emcee
Molly Cox
2024 Inkstravaganza Committee
Cary Clack, Aminah Dece, Barbara Felix, Winifred Hodge, Zach Jewell, Andrea Lopez, Gloria Miles, Chibbi Orduña, Aaronetta Pierce, Gerard Robledo, Andrea Rodriguez, Zsaire Shaheid (Shai), Aissatou Sidime-Blanton, Kirsten Thompson, Maria Williams, Bria Woods, Alexandra van de Kamp









Join Gemini Ink, San Antonio’s Writing Arts Center, at the beautiful McNay Art Museum on Friday, November 8th, for an unforgettable, festive evening celebrating the extraordinary achievements of Andrea “Vocab” Sanderson, our 2024 Recipient of The Award for Literary Excellence. Enjoy our star-packed lineup (details coming soon!) and mingle with friends and fellow literary fans as we honor this brilliant poet, multifaceted artist, performer, and community leader who is at the heart of the writing arts in our city.
Andrea “Vocab” Sanderson is a multifaceted artist in the worlds of music, poetry, spoken word performance, and community artistic collaborations, and to say she is a powerhouse poet and creative performer only scratches the surface of her talent! We couldn’t be more honored to spotlight her as the featured writer of our annual gala in support of the power of the writing arts in our city. Vocab is San Antonio Poet Laureate Emeritus 2020-2023. She facilitates workshops throughout the U.S. and is the author of She Tastes Like Music (Flower Song Press, 2020). She is an Academy of American Poets Laureate Fellow and was voted Best Local Poet in 2023 and 2021 by The SA Current. Vocab has had the distinct honor of opening up for Dr. Cornell West, Phylicia Rashad, and Nikki Giovanni. Her albums and collaborative works can be streamed on all major music platforms. Learn more about her at her website andreavocabsanderson.com."""
