["https://geminiink.org/ekphrastic-poetry-contest-npmsa-25"]
title = "Ekphrastic Poetry Contest 2025 Sponsored by National Poetry Month San Antonio - Gemini Ink"
description = "Poetry Month is just around the corner! We partnered with local poets and other art institutions to invite you to draw inspiration from artworks. If you win, your poem will be shared in April to celebrate National Poetry Month. San Antonio and South Texas poets! You’re invited to submit poems inspired by artworks from five San Antonio"
full_description = "Poetry Month is just around the corner! We partnered with local poets and other art institutions to invite you to draw inspiration from artworks. If you win, your poem will be shared in April to celebrate National Poetry Month. San Antonio and South Texas poets! You’re invited to submit poems inspired by artworks from five San Antonio arts institutions. Three Categories: Adults; Youth, ages 13 – 17; Youth, age 12 and under. Contest Opens: February 5, 2025. Submission Deadline: March 7, 2025. There is no entry fee. 2025 Ekphrastic Poetry Contest Guidelines for Adults & Youth What Is an Ekphrastic Poem? An ekphrastic poem is one based on a piece of art. These poems take an existing piece of visual art and use written words to describe and expand on the theme of that work of art. Often these poems explore hidden meanings or an underlying story. What to Submit Up to two (2) poems that respond to the art (each a maximum of 15 lines plus title). Express how the art puzzles, moves, frightens, enlightens you, etc. Please do not put your name or identifying info on the poem. Do not include artwork image on poem or in email. 2025 Artworks The Briscoe Western Art Museum: Twilight Owl, Edwoud de Groot. Oil on canvas, 36 x 48 in., Loan courtesy of the Jack and Valerie Guenther Foundation https://briscoemuseum.org/poetry-contest/ McNay Art Museum: Hudson River Day Line, Joan Mitchell, 1955. Oil on canvas, 79 x 83 in., Museum purchase with funds from the Tobin Foundation https://www.mcnayart.org/event/2025-ekphrastic-poetry-contest/ Ruby City: Living through strange times, Wangechi Mutu, 2004. Linda Pace Foundation Collection, Ruby City, San Antonio, Texas https://rubycity.org/2025-national-poetry-month-ekphrastic-poetry-contest/ San Antonio Museum of Art: Man Playing Trumpet, Marcus Leslie Singleton, 2020. Oil on canvas, 48 x 36 in., San Antonio Museum of Art, gift of Lenora and Walter F. Brown https://www.samuseum.org/events/event/2025-national-poetry-month-ekphrastic-poetry-contest/?year=2025&month=2&day=5&hour=16&minute=0&second=0 The Witte Museum: Salesman’s Sample Horned Chair, Charles Puppe, Steerhorns with a Cowhide Upholstery Seat. Gift of Mrs. Harriette L. Tinkle. https://www.wittemuseum.org/ekphrastic2025/ How to Submit Attach one poem per email in a PDF or Microsoft Word doc or docx to EkphrasticPoetryContest1@gmail.com. Subject line should read: Ekphrastic Poetry Contest Submission (YOUTH or ADULT) – (Selected Artwork Title). Your email must include: Title of your poem Your name City & state Phone number Email address Youth entries must include age. Contest Deadline March 7, 2025. Only San Antonio & South Texas adult & youth poets are eligible. Categories: Adults; Youth, ages 13 – 17; Youth, age 12 and under. Judges Jim LaVilla Havelin, 2025 National Poetry Month coordinator, Eddie Vega, San Antonio Poet Laureate, and Linda Simone, poet & artist, will select up to three poems per artwork for each category. Winning Poems Winners will be notified via email by March 19. By March 21, Winners must attach their winning poem(s) as a PDF in an email to EkphrasticPoetryContest1@gmail.com. Email subject line must read: (ADULT or YOUTH) Winning Poem PDF – (Your Name). Winning poems will be posted on websites throughout April, National Poetry Month. Save the Date Ekphrastic Celebration Reading by winning poets at Ruby City on Saturday, April 5 at 10 a.m."
