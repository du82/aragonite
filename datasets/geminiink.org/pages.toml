full_description = "I LOVED it. I've taken so many classes through the years, and this is the best one! I feel so inspired. I didn't have to fight traffic or drive home late. The emails to log on were sent in a timely fashion. It is more comfortable to learn in my respective space. Thank you, Gemini Ink, for making it possible for me to work with such a fine poet and with other thoughtful writers! The teaching artist did a good job of creating a safe space where students felt comfortable discussing the topics of this course. We believe that creative writing can play a vital role in personal development. Our writing classes are open to everyone. We provide a warm, supportive writing community for writers of all levels. Gemini Ink offers excellent, fair-cost workshops by published writers year-round. Gemini Ink is an approved TEA provider for CPE (Continuing Professional Education). Educators seeking recertification can attend our classes and earn a certain number of credits for partaking in the workshop. Gemini Ink offers free parking along the back wall of our downtown offices. Please access this parking lot from Augusta St and first park in any of the 12 spots along the back wall. Only when these 12 spots are full, do we ask that you park elsewhere in our lot. We now rent our offices from UTSA and are collaborating with them to create a secure and accessible parking lot for our community of writers and readers. Wednesdays, March 5 & Apr 2, 2025, 6:30-8:30pm CST, via Zoom Story Idea for the Pitch of a Lifetime with Marilyn Atlas In this two-day workshop, talent/literary manager and producer Marilyn Atlas will teach you the tricks and tips it takes to make that professional pitch. Thursday, March 6, 6:30-8:30pm CST, Hybrid Floricantos y Tumbaos: A Panel on Latinx Music in Poetry Explore the fusion of Latinx music and poetry with Excy Guardado, Urayoán Noel, and Marco Cervantes at this Library of America event. They’ll discuss Latin American musical traditions’ influence on their work, moderated by Amalia Ortiz, and share intimate performances."
