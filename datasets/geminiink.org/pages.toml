["https://geminiink.org/krier-whistle-rattle-song"]
title = "Cyndi Taylor Krier’s Latest Teen Poetry Anthology: Whistle Rattle Song - Gemini Ink"
full_description = "Congratulations to our students at Krier Juvenile Correctional Treatment Center for their latest publication: Whistle Rattle Song! Throughout Fall 2021 and early winter of 2022, teaching artists Jim LaVilla-Havelin and Erica DeLaRosa engaged teens in poetry and creative non-fiction readings that worked as a catalyst toward creating and sharing their own work. The final product was this anthology of teen poetry. A private celebratory reading is scheduled for this month where students and their families will receive copies of the publication. In his intro, LaVilla-Havelin writes: In the strength of their voices and the power of their hopes, these students continue to inspire me. There is no shying away from the hard realities of their lives. Still, their writings are filled with a joyful tangling with language, meaning, and making selves! Erica and I celebrate them and are deeply grateful for the chance to share the journey with them. Download a copy of Whistle Rattle Song. Gratitude to the Bexar County Juvenile Probation Department, the City of San Antonio Department of Arts & Culture, HEB, and the Shield-Ayres Foundation. Thank you for your continued support! Learn more about our Partner Classes Program."
