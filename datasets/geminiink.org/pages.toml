full_description = "Browse our full listing of classes to register online with a credit card during the online registration period. To register by phone call Gemini Ink during our office hours (Mon-Fri, 9am-4pm) at 210.734.9673. Have your credit card ready. Drop by Gemini Ink during our regular office hours (Mon-Fri, 9am-4pm) to sign up for a class in person. Pay with credit card, debit card, personal check, or cash. If the class has not sold out, you may arrive 15 minutes prior to class start time on the day of class to register. A $10 fee will be added to your registration cost. Walk-up registration is subject to availability. Our classes, workshops, and conferences are open to the public, but members receive special discounts. Only registered students will be allowed in the class. No family members, friends, or pets may accompany unless cleared by both Gemini Ink staff and the instructor. Contact registrar Josh Cantú at 210-734-9673 or joshua@geminiink.org should you have any questions. Instructors have the right to maintain a class environment necessary for instruction, and registrants may be asked to leave if they continually disrupt the learning atmosphere. We ask that as soon as you know you need to cancel/reschedule, you contact us at 210-734-9673 or info@geminiink.org so that we may fill your slot. Classes are held at the Gemini Ink building at 1111 Navarro St, San Antonio, Texas 78205, unless otherwise indicated. Free parking is available directly behind our offices."
