["https://geminiink.org/events/be-the-writer-you-are"]
title = "Be the Writer You Are: Set Yourself Free with New Approaches to Creative Writing with C.L. “Rooster” Martinez - Gemini Ink"
description = """
Saturday, October 19, 2024, 10am-1pm CST, in-person at Gemini Ink
Instructor: C.L. “Rooster” Martinez
Nonmember: $135; Member: $115; Student/Educator/Military $75
*EARN CPE’S

 
Are you a writer who struggles to find joy in your current writing practice? Is self-doubt or lack of direction keeping you from being the powerful, truthful, creative writer you want to be? It’s time to set yourself free from the things that hold your writing practice back!
Be the Writer You Are is a one-day, four-hour generative workshop centered on throwing out everything we have learned about creative writing and, instead, tapping into our intrinsic desire to write and be heard. Students will explore the role of creative writing in society. We’ll question our personal influences and writing processes to define what motivates us, what inspires us, and what our writing goals are. Then, we will generate new work aimed at amplifying our unique perspectives and setting our voices free. 
This course is open to writers of all skill levels, 18+. While the workshop will be somewhat poetry-centric, it is for writers of various writing experiences and disciplines.
Students will leave this workshop with:

Drafts of new written work
Editing and feedback suggestions
Holistic approach to a creative lifestyle

C.L. “Rooster” Martinez is an educator and spoken word poet from San Antonio, Texas. He earned a MA/MFA in Creative Writing, Literature & Social Justice at Our Lady of the Lake University. He is the author of three poetry books: A Saint for Lost Things (Alabrava Press, 2020); As it is in Heaven (Kissing Dynamite Poetry Press, 2020); and Mexican Dinosaur (WAN, 2023). For twelve years, Rooster competed and won slams across the country and co-founded the literary nonprofit Write Art Out Inc. 

Parking at Gemini Ink
Gemini Ink offers free parking along the back wall of our downtown offices. Please access this parking lot from Augusta St and first park in any of the 12 spots along the back wall. Only when these 12 spots are full do we ask that you park elsewhere in our lot. We now rent our offices from UTSA and are collaborating with them to create a secure and accessible parking lot for our community of writers and readers."""
full_description = "Saturday, October 19, 2024, 10am-1pm CST, in-person at Gemini Ink Instructor: C.L. “Rooster” Martinez Nonmember: $135; Member: $115; Student/Educator/Military $75 Are you a writer who struggles to find joy in your current writing practice? Is self-doubt or lack of direction keeping you from being the powerful, truthful, creative writer you want to be? It’s time to set yourself free from the things that hold your writing practice back! Be the Writer You Are is a one-day, four-hour generative workshop centered on throwing out everything we have learned about creative writing and, instead, tapping into our intrinsic desire to write and be heard. Students will explore the role of creative writing in society. We’ll question our personal influences and writing processes to define what motivates us, what inspires us, and what our writing goals are. Then, we will generate new work aimed at amplifying our unique perspectives and setting our voices free. This course is open to writers of all skill levels, 18+. While the workshop will be somewhat poetry-centric, it is for writers of various writing experiences and disciplines. C.L. “Rooster” Martinez is an educator and spoken word poet from San Antonio, Texas. He earned a MA/MFA in Creative Writing, Literature & Social Justice at Our Lady of the Lake University. He is the author of three poetry books: A Saint for Lost Things (Alabrava Press, 2020); As it is in Heaven (Kissing Dynamite Poetry Press, 2020); and Mexican Dinosaur (WAN, 2023). For twelve years, Rooster competed and won slams across the country and co-founded the literary nonprofit Write Art Out Inc. Parking at Gemini Ink Gemini Ink offers free parking along the back wall of our downtown offices. Please access this parking lot from Augusta St and first park in any of the 12 spots along the back wall. Only when these 12 spots are full do we ask that you park elsewhere in our lot. We now rent our offices from UTSA and are collaborating with them to create a secure and accessible parking lot for our community of writers and readers."
