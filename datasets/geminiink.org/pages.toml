["https://geminiink.org/partner-classes"]
title = "Partner Classes - Gemini Ink"
full_description = "Partner Classes (formerly Writers in Communities) sends professional writers into diverse community settings to work alongside students of all ages, needs, interests and abilities for free. With an average ratio of 10 to 1, our writers-in-residence work closely with students to create dynamic writing projects that challenge, often reflecting their own lives, and build critical reading and writing skills in the process. WIC serves an estimated 1300 students each year with 75% of those being people of color. Our free writing workshops are offered at schools, senior centers, homeless shelters, and rehabilitation centers across the city, among other settings. 50% of sites are public schools. 50% of sites serve elementary school-aged children, 30% of sites serve teenagers, and 15% of sites serve adults. Partner Classes is set apart from similar arts programs thanks to the excellence of its faculty. All of our writers are accomplished creative professionals, many of whom have either a background or an interest in education and a passion for the written word. Partner Classes hosts writing workshops in various genres, including poetry, short fiction, personal narrative, and spoken word. Many of our workshops are also interdisciplinary, incorporating art forms such as photography, theater, and music. The length of a workshop depends on the partnering organization’s needs, but we recommend at least 10 or more instructional hours for students in K-12. The cost of a Partner Classes workshop depends on multiple factors such as the number of writer-instructors needed, the number of students, the number of instructional hours, and whether the workshop will culminate in a final product. A budget is available upon request. Partner Classes workshops are funded by fee-for-service and grants from public and private funders in the arts and humanities, which ensures that they remain free for participants. A short student film project as part of the SEE to ACT ‘Teach to Empower’ program, in collaboration with Justice Impacted Youth. Cinematography by Roy, V.F., Danny, Aiden and J.R. and produced by Vitruvius Creations. This poem was written by Fable as part of a Gemini Ink project at Krier. Brought to you by SEEtoACT.org"
