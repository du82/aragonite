["https://geminiink.org/read-social-justice-inspired-horror-story-broadsides-from-empower-house-students"]
title = "Read Social Justice Inspired Horror Story Broadsides from Empower House Students! - Gemini Ink"
full_description = "This past summer, a group of talented students shared their social justice influenced horror stories. Workshop leaders Jessica Betancourt and Daniel Ramirez shared short stories from David Bowles’s Border Lore Folktales and Legends of South Texas which inspired students to write their own horror short stories. Betancourt and Ramirez helped students refine their stories through writing about the senses. By the end of the workshop, Betancourt and Ramirez worked with students one-on-one to refine their social justice inspired horror stories. Students wrote stories about ghosts, house fires, aliens, new societies, and so much more! This workshop culminated in a final celebration on August 2nd at Empower House with a student puppet show, audio recordings of the students’ stories, and videos inspired by the students’ short stories. You can listen to their audio recordings here! Thank you to our funder, The Texas Commission on the Arts, for making this workshop possible. Read through some of their incredible broadsides below. Congratulations to this talented group of students. Keep on writing! View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger"
