title = "Veteran’s Writing Collective with Sarah Colby - Gemini Ink"
description = """
The Veteran’s Writing Collective (VWC) encourages the art of writing in a workshop environment where participants are offered honest, positive, and constructive peer-to-peer and mentor feedback. The workshop is open to all active-duty military, veterans, retirees, and their immediate family members. Writers of all levels working in all genres are welcome.
The VWC meets monthly online via Zoom.
If you would like an invitation to this class, send an email to veteranscollective@geminiink.org

Sarah Colby was born in northern New Mexico and raised in the Rocky Mountains. She is married to a retired Army Chaplain and is mother to a son in the Navy. Sarah has an MFA in Creative Writing from Sierra Nevada College and an exuberant interest in making the ordinary luminous. Her war-time experiences have motivated her to be a voice for the mostly untold stories of families and loved ones during these years of protracted conflict. She is currently working on a manuscript of poems about her experiences as a military family member."""
