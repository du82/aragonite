["https://geminiink.org/events/beyond-the-blank-page"]
title = "Beyond the Blank Page: Introduction to Creative Writing with Christen Barrón - Gemini Ink"
description = """
Mondays, February 24 & March 3, 10, 17, 24, 31, 2025 6:30-8:30pm CST, in-person at Gemini Ink (6-week workshop)
Nonmember $155        Member    $130                  Student $90
*EARN CPE’S
TWO SCHOLARSHIPS AVAILABLE

 

Do you want to try creative writing but you don’t know where to begin? Or are you unsure if you want to try poetry, fiction, or anything else? Have you felt too intimidated to sign up for a Gemini Ink workshop? Then, this workshop is for you! 
In this hands-on 6-week writing workshop,  participants will receive a gentle and fun introduction into creative writing and opportunities to dabble in poetry, fiction, and nonfiction to see which one resonates most. This course is perfect for beginners or anyone looking to rediscover their creativity. At each interactive session, participants will generate new writing and will be encouraged to share their work with others.
This course is open to writers of all backgrounds and skill levels, 18+.
Students will leave this workshop with: 

an understanding of the three main creative writing genres 
new writing in three genres (poetry, creative nonfiction, and fiction)
strategies and techniques for accessing creativity and overcoming writer’s block
resources for continuing a creative writing practice in the genre of choice

Learn more about Christen at her Writer’s Desk!

Christen Barrón is a creative nonfiction writer, editor, and writing instructor. Originally from Savannah, Georgia, Christen holds an M.F.A. in Writing and a B.F.A. in Dramatic Writing from Savannah College of Art and Design (SCAD). She currently teaches first-year writing and creative writing at Texas A&M-University San Antonio. For nearly a decade, Christen taught community creative writing classes for The Deep Center’s nationally-recognized Young Author Project and she has served as a Teaching Artist for Gemini Ink since 2017. Christen’s writing has appeared in YARN Literary Review, Black Fox Literary Magazine, Document, and The Journal of Writing Assessment. She is a faculty supervising editor for Mosaic, a student-led literary magazine at Texas A&M-University San Antonio."""
