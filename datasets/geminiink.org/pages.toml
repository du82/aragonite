full_description = "March 5 @ 6:30 pm - 8:30 pm CST Prepare Your Story Idea for the Pitch of a Lifetime with Marilyn Atlas Online via Zoom In this two-day workshop, talent/literary manager and producer Marilyn Atlas will teach you the tricks and tips it takes to make that professional pitch. She will cover how to distill the essence of your story into short, sharp, easily digestible bite-size parts that strike the right balance between brevity, colorful detail, and cliffhanging suspense. The class will also review common mistakes writers make when pitching, strategies for adapting your pitch to your target audience, and advice on how to use comparable titles of similar works to prove there is an audience for your work. $160 March 6 @ 6:30 pm - 8:30 pm CST Floricantos y Tumbaos: A Panel on Latinx Music in Poetry San Antonio Public Library 600 Soledad, San Antonio, Texas Join us as we explore the fusion of Latinx music and poetry at this Library... Free March 12 @ 6:30 pm - 8:00 pm CST LitMinds Book Club Gemini Ink 1111 Navarro St, San Antonio, TX, United States Join us for the LitMinds Book Club at Gemini Ink. We’re reading The Family Izquierdo,... March 19 @ 7:00 pm - 8:00 pm CST The Big Texas Author Talk featuring Melissa Studdard Online via Zoom Join us on Wednesday, March 19th, 2025 via Zoom for a conversation with Melissa Studdard,... March 29 @ 11:30 am - 1:00 pm CST Recurring Teen Writing Circle with Daniel Ramirez Online via Zoom Register Last Saturday of Every Month 11:30am-1pm cst via Zoom For ages 13-19 years old... Free March 31 @ 6:30 pm - 8:30 pm CST Recurring Open Writer’s Labs Online via Zoom These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction. Free April 1 @ 6:30 pm - 8:30 pm CST Everything but the Kitchen Sink: A Workshop on Writing Hybrid Essays with ire’ne lara silva Gemini Ink 1111 Navarro St, San Antonio, TX, United States In this three-week workshop, we will liberate our minds and recover from the trauma of the “school-essay” mentality by creating hybrid essays that engage the reader, reflect our realities, and push the limits of what an essay can be. Bring any projects or ideas you're working on--memoirs, family histories, love letters, journals, or thoughts you want to share about life, art, history, spirit, geography, the world!"
