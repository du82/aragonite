title = "Online via Zoom - Gemini Ink"
description = "In this two-day workshop, talent/literary manager and producer Marilyn Atlas will teach you the tricks and tips it takes to make that professional pitch. She will cover how to distill the essence of your story into short, sharp, easily digestible bite-size parts that strike the right balance between brevity, colorful detail, and cliffhanging suspense. The class will also review common mistakes writers make when pitching, strategies for adapting your pitch to your target audience, and advice on how to use comparable titles of similar works to prove there is an audience for your work."
full_description = "March 5 @ 6:30 pm - 8:30 pm CST Prepare Your Story Idea for the Pitch of a Lifetime with Marilyn Atlas Online via Zoom In this two-day workshop, talent/literary manager and producer Marilyn Atlas will teach you the tricks and tips it takes to make that professional pitch. She will cover how to distill the essence of your story into short, sharp, easily digestible bite-size parts that strike the right balance between brevity, colorful detail, and cliffhanging suspense. The class will also review common mistakes writers make when pitching, strategies for adapting your pitch to your target audience, and advice on how to use comparable titles of similar works to prove there is an audience for your work. $160 March 19 @ 6:30 pm - 8:30 pm CST Recurring Veteran’s Writing Collective with Sarah Colby Online via Zoom The Veteran’s Writing Collective encourages the art of writing in a workshop environment where participants are offered honest, positive, and constructive peer-to-peer and mentor feedback. The workshop is open to all active-duty military, veterans, retirees, and their immediate family members. Writers of all levels working in all genres are welcome. Free March 19 @ 7:00 pm - 8:00 pm CST The Big Texas Author Talk featuring Melissa Studdard Online via Zoom Join us on Wednesday, March 19th, 2025 via Zoom for a conversation with Melissa Studdard,... March 29 @ 11:30 am - 1:00 pm CST Recurring Teen Writing Circle with Daniel Ramirez Online via Zoom Register Last Saturday of Every Month 11:30am-1pm cst via Zoom For ages 13-19 years old... Free March 31 @ 6:30 pm - 8:30 pm CST Recurring Open Writer’s Labs Online via Zoom These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction. Free April 7 @ 6:30 pm - 8:30 pm CDT The Poetics of You: An Intro to Poetry Workshop with Melissa Studdard Online via Zoom In this four-session workshop, we’ll explore and review basic poetic concepts while working with prompts designed to unlock your own unique poetic gifts and subject matter. The Poetics of You will be a generative, supportive, and encouraging space in which to learn, experiment, and explore. In the weekly virtual meetings, we will study basic techniques, read sample poems, compose drafts, and share writings. $155"
