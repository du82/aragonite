["https://geminiink.org/montgomery-camelot-anthology-2022"]
title = "Montgomery & Camelot Elementary’s Latest Anthology: What Will Be - Gemini Ink"
full_description = "What Will Be Happy publication date to our Camelot & Montgomery Elementary students!! We are so excited and proud of our students at Camelot and Montgomery Elementary schools who were recently published in the anthology What Will Be. Read more about this project and download a copy of the book at https://geminiink.org/montgomery-camelot-anthology-2022. And many thanks to supporters! HEB, Shield-Ayres Foundation, Northeast ISD, City of San Antonio Dept of Arts & Culture, San Antonio Area Foundation, Rackspace Foundation, Kronkosky Charitable Foundation, The Greehey Charitable Foundation, Charity Ball Association, and Teaching Artists Erica Delarosa, Desiree Kannel, Sarah Colby, and Daniel Ramirez! Download a copy of What Will Be. For their workshop at Camelot, teaching artists Erica DeLaRosa and Desiree Kannel rooted their curriculum in wordplay and storytelling while integrating the theme of emergence through their writing prompts and guest artist’s visits. To build community and students’ ability to self-regulate, they incorporated team-building activities and mindfulness into their workshop routine while engaging their class with folktales, odes, and various story and poetry prompts. In addition, Erica and Desiree invited photographer, blogger, and teaching artist Vanessa Velázquez to lead a session on the connection between photography, storytelling, emergence, and self-expression. You can see the self-portraits and photos that came from Vanessa’s visit on the cover and in Camelot’s section of the book. At Montgomery, teaching artists Sarah Colby and Daniel Ramirez explored the theme of emergence through the lens of folktales and poetry. Over the course of 16 weeks, students generated poems about a wide range of topics–from food to winter to their wishes for the new year–dabbled in writing for puppetry, explored the use of voice through lessons in dialogue, and wrote their own folktales. The workshop ended with a bang when teaching artist Daniel Ramirez, a puppeteer, and writer, presented his shadow puppet play, Doña Nopelesa, for students and some Montgomery staff on the last class day. In her guest artist visit, teaching artist, poet, and visual artist Joyous Windrider Jimenez showed students how to make collages that explored themes in their writing; these are included in the Montgomery section of the anthology #neisd #publishing #poetry #publication #poets! ? View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger View Larger"
