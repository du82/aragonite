["https://geminiink.org/inkstravaganza-event"]
title = "Inkstravaganza 2024 - Gemini Ink"
full_description = "Honorary Co-Chairs Dr. Eric Castillo, Associate Vice Chancellor of Arts, Culture, and Community Impact for the Alamo Colleges District 2024 Inkstravaganza Committee Cary Clack, Aminah Decé, Barbara Felix, Winifred Hodge, Zach Jewell, Gloria Miles, Chibbi Orduña, Aaronetta Pierce, Gerard Robledo, Andi Rodriguez, Zsaire Shaheid (Shai), Aissatou Sidime-Blanton, Kirsten Thompson, Alexandra van de Kamp, Maria Williams, Bria Woods Join Gemini Ink, San Antonio’s Writing Arts Center, at the beautiful McNay Art Museum on Friday, November 8th, for an unforgettable, festive evening celebrating the extraordinary achievements of Andrea “Vocab” Sanderson, our 2024 Recipient of The Award for Literary Excellence. Enjoy our star-packed lineup (details coming soon!) and mingle with friends and fellow literary fans as we honor this brilliant poet, multifaceted artist, performer, and community leader who is at the heart of the writing arts in our city. Andrea “Vocab” Sanderson is a multifaceted artist in the worlds of music, poetry, spoken word performance, and community artistic collaborations, and to say she is a powerhouse poet and creative performer only scratches the surface of her talent! We couldn’t be more honored to spotlight her as the featured writer of our annual gala in support of the power of the writing arts in our city. Vocab is San Antonio Poet Laureate Emeritus 2020-2023. She facilitates workshops throughout the U.S. and is the author of She Tastes Like Music (Flower Song Press, 2020). She is an Academy of American Poets Laureate Fellow and was voted Best Local Poet in 2023 and 2021 by The SA Current. Vocab has had the distinct honor of opening up for Dr. Cornell West, Phylicia Rashad, and Nikki Giovanni. Her albums and collaborative works can be streamed on all major music platforms. Learn more about her at her website andreavocabsanderson.com. We’re thrilled to honor Christen Barrón with this award for her unwavering dedication and crucial role in making our Metro Health and Rise Inspire workshops a huge success, alongside fellow TA’s Joyous Windrider Jiménez and Aminah Decé. We’re also grateful for her incredible leadership as our interim Partner Classes coordinator this summer."
