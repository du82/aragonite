title = "Endowment Fund - Gemini Ink"
full_description = "The Nan Cuba Endowment Fund was created by the Board of Directors of Gemini Ink to generate income to support the literary arts programs of Gemini Ink. For the last 25 years, Gemini Ink has brought world-class literary arts programs to San Antonio’s diverse communities. Together, we have engaged thousands of readers and writers of all ages throughout Central Texas with literary and cultural activities. To safeguard the institution and ensure financial support for our programs, the Board of Directors has established the Nan Cuba Endowment Fund at Gemini Ink in honor of our founder, writer Nan Cuba. Eusebio Diaz Sally Cooper Nan Cuba Angelika Jansen Julie Koppenheffer Lynn Laursen Bonnie Lyons Charles Massiatte Bonnie Reed Jan Jarboe Russell Mo Saidi Nancy Shivers Assiatou Sidime-Blanton Marcia Goren Weser The Gemini Ink Board of Directors invite you to join us in supporting the Nan Cuba Endowment Fund at Gemini Ink. Your contribution provides a sustainable plan to continue sharing the joys of reading and writing in the city of San Antonio for years to come. Your donation is tax-deductible. For other ways to donate, or for information on event sponsorship, contact Alexandra van de Kamp at 210-734-9673 or email avandekamp@geminiink.org."
