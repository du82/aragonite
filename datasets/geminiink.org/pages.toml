["https://geminiink.org/celebrating-san-antonios-xicanx-month-a-spotlight-on-texas-chicanx-presses"]
title = "Celebrating San Antonio’s Xicanx Month: A Spotlight on Texas Chicanx Presses - Gemini Ink"
description = "As we continue to celebrate Xicanx Month, Gemini Ink is proud to highlight the diversity of Texan Xicanx presses. These publishers play a vital role in amplifying the voices of Chicanx writers. Check out some of these publishers and their books. Alabrava Press - Alabrava Press is a speciality press dedicated to publishing poetry chapbooks,"
full_description = "As we continue to celebrate Xicanx Month, Gemini Ink is proud to highlight the diversity of Texan Xicanx presses. These publishers play a vital role in amplifying the voices of Chicanx writers. Check out some of these publishers and their books. Alabrava Press – Alabrava Press is a speciality press dedicated to publishing poetry chapbooks, founded by Octavio Quintanilla in 2018. Alabrava’s publications include: Surrogate Eater by Jen Yáñiz-Alaniz, the eater of flowers by ire’ne lara silva, and Al Norte by Juan R. Palomo. Arte Público Press – Based in Houston, Arte Público Press is one of the oldest and most respected Latino publishing houses in the United States. Founded in 1979, it focuses on publishing works by Hispanic authors and promoting Hispanic arts and culture. The press publishes about 25 books annually. Their titles include Chants by Pat Mora, Zoot Suit and Other Plays by Luis Valdez, and The House on Mango Street by Sandra Cisneros. Aztlan Libre Press – Established in 2009 by Juan Tejeda and Anisa Onofre, Aztlan Libre Press is a small press based out of Yanawana/San Antonio, Texas dedicated to the publication, promotion and free expression of XicanX literature and art. Aztlan Libre Press has published books such as, The Cannibal Canción Cabaret & Other Songs by Amalia Ortiz, Las Nalgas de JLo by Bárbara Renaud González, Where The Reckless Ones Come To Die by Vincent Cooper, and A Crown for Gumecindo by Laurie Ann Guerrero. Conocimientos Press – Based in San Antonio and founded by Dr. Josie Méndez Negrete, Conocimientos Press publishes books that voice the heart of a people as they chronicle stories of struggle and resistance. Their aim is to be a bridge to currently unavailable scholarly ideas, publishing stories that contribute to the creation of knowledge. In addition to Dr. Josie Méndez Negrete, Viktoria Valenzuela is publisher at Conocimientos Press. Their titles include San José to Viet ’Nam and Back by Richard T. García, Street of Too Many Stories by Denise Chávez, and Rooted in Clay: Verónica Castillo Y Su Arte by Josie Méndez-Negrete. Del Alma Publications – Del Alma Publications is based in South Texas and was founded by Dr. María Alma González Pérez. This Latina-owned children’s book publisher encourages the bilingual, bi-literate child. Proudly producing educational materials and children’s literature in English and Spanish with a regional, cultural focus, these books are great for keeping kids thinking and learning at home. Their titles include Abuela’s Fideo by Gabriela Tijerina and ¡Todos a comer! A Mexican Food Alphabet Book by Dr. Alma González Pérez. Flowersong Press – Flowersong Press, based in McAllen, nurtures verse, fiction, and nonfiction from, about, & throughout the borderlands, amplifying the voices of those from the Americas and beyond. Founded by David Bowles in Donna, Texas in 2013, the press is now led by Edward Vidaurre. Just a few of their titles include Luz at Midnight by Marisol Cortez, Somos Nopales by SA Poet Laureate, Eddie Vega, and Piedra by Luis Alberto Urrea. Infrarrealista Review – Infrarrealista Review is a literary nonprofit that is dedicated to publishing Texan writers. Founded by Cloud D. Cardona and Juania Sueños in 2019, Infrarrealista Review’s imprint Plancha Press has published poetry books, chapbooks, and zines such as Amapolasong by Jacinto Jesús Cardona, To Be A Woman (and not a girl) by June Paddison, winner of the 2024 Hays Youth Poet Laureate Prize, Escritorio Purgatorio (A Día de los Muertos Zine), and El Chipster Zine (A Zine about Xicanx hipsters). La Voz de Esperanza – La Voz de Esperanza is a monthly publication of the Esperanza Peace & Justice Center in San Antonio. It features stories, news, poetry and artwork submitted by members of the community. La Voz is a resource for peace, justice, and human rights through written word. The journal provides a forum for criticism, information, education, humor and other creative works. Before La Voz issues are sent out, Buena Gente, Esperanza’s volunteer community, gathers at monthly mailouts to help fold the news journal. Mouthfeel Press – Mouthfeel Press was founded in El Paso, Texas in 2009 by Maria Maria Maloney. The press aims to foster readership by publishing high-quality books from new and established underrepresented writers from the United States and beyond. Their titles include Assimilated Natives by Gume Laurel III, Incantation: Love Poems for Battle Sites by Xochitl-Julisa Bermejo, and California Brown: Illuminations and Hollers by former U.S. Poet Laureate (2015), Juan Felipe Herrera. St. Sucia – St. Sucia is a zine exposing what it is to be mujer in contemporary society, and “shutting down slut-shaming y stereotypes.” Founded by Isabel Ann Castro and Natasha I Hernandez in San Antonio 2014. La Santa Sucia, “in her boozy omnipotence united Tash and Isa at a punk show. The zine was instantly in motion.” Their last issue was published in 2018 and featured artists and writers throughout Texas and beyond. For more information about Texan Xicanx presses, browse the Mapping Literary Tejas publishing page."
