["https://geminiink.org/the-writers-desk-with-christen-barron"]
title = "The Writer’s Desk with Christen Barrón - Gemini Ink"
full_description = "The Writer’s Desk features the desks and writing practices of Gemini Ink faculty, visiting authors, teaching artists, volunteers, students, interns, staff, partners and more. Receive new posts in your inbox by subscribing to our newsletter at bit.ly/geminiinknewsletter. Join Christen Barrón on Mondays, February 24 & March 3, 10, 17, 24, 31, 2025 6:30-8:30pm CST, in-person at Gemini Ink, for her workshop: Beyond the Blank Page: Introduction to Creative Writing. Mondays, February 24 & March 3, 10, 17, 24, 31, 2025 6:30-8:30pm CST, in-person at Gemini Ink Welcome, Christen! We’re so glad you’re here! We’re eager to learn more about your writing space and how it has evolved over time. Has your preferred place to write changed over the years? Some of my earliest memories of writing took place in my childhood bedroom, on my daybed. I used to write on black notebook paper with glitter Gelly Roll pens (it was the early 2000s). When I was about 13, I decided my handwriting was atrocious (it was and still is), and no publisher would take it seriously. So I transitioned my writing space into the sunroom where my parents had abandoned a retired family computer from the mid-90s. In college, I inherited a laptop from my grandfather. That laptop allowed me to take my writing to Panera Bread. Free wifi and free refills! A few years later, the iPhone happened. The Notes app changed my life. With this app, my writing space can be anywhere I want. As someone who can’t sit still and hates commitment, there’s something so freeing about jotting down something in the Notes app while taking a walk or running an errand. I’ve tricked myself into writing entire short stories on the app because it never feels as big of a commitment as sitting down at a big desk with a laptop and a hot beverage. If I’m going to work on a writing project for an extended amount of time, I like to work from my sofa. My living room has lovely natural light. It’s so energizing! Do you have any habits or routines that you follow before writing? I’m not highly routine-oriented when it comes to writing. However, I like preparing and laying out materials that I might find inspiring during my writing practice. For example, I keep decks of writing prompts and cut-up magazines within reach. Daily life can be draining, so I make accessing my creativity as easy as possible. What is your secret talent? Does it ever pop up in your writing? This is not a talent, but I’m easily distracted. That’s why I like writing creative nonfiction essays so much. When writing an essay, you can circle a theme. You don’t have to focus on specific linear events. You can bounce around, knock into adjacent topics, and then change direction. What’s a book or movie that you can watch over and over again and not get tired of? The Princess Diaries and Singin’ in the Rain are my comfort movies. Is there anything that you’ve been listening to lately—an interesting podcast, a song list, or album? I’ve been enjoying Semler’s music lately. They grew up as a pastor’s kid, and they write a lot about religious trauma. Their song “Jesus from Texas” is devastating. What are some misconceptions about being a writer that you can discredit? One common misconception about being a writer is that if you’re good, writing comes effortlessly. This couldn’t be further from the truth. Since college, I’ve worked on many writing projects that I’ve struggled through. I used to call my mom, tears streaming down my face: “I’m a terrible writer. Why did anyone think I could major in writing?” “I’m going to fail this assignment.” Even in my 30s, I still call her, convinced: “Mom, I’m going to get fired.” Once some time has passed, I’ll look at the piece of writing I was convinced was the worst thing I’d ever written. It’s almost always better than I remembered. Sometimes, writing is just hard. It doesn’t mean you’re bad at it. What is your next project? My next project is a particularly exciting one. I teach writing full-time at Texas A&M-San Antonio, and I’m helping my students edit a collection of poetry and stories for the second issue of Mosaic. This magazine, made for and by students, is a platform for local talent. I’m thrilled about the stories we’re getting to bring to life this spring! Christen Barrón is a creative nonfiction writer, editor, and writing instructor. Originally from Savannah, Georgia, Christen holds an M.F.A. in Writing and a B.F.A. in Dramatic Writing from Savannah College of Art and Design (SCAD). She currently teaches first-year writing and creative writing at Texas A&M-University San Antonio. For nearly a decade, Christen taught community creative writing classes for The Deep Center’s nationally-recognized Young Author Project and she has served as a Teaching Artist for Gemini Ink since 2017. Christen’s writing has appeared in YARN Literary Review, Black Fox Literary Magazine, Document, and The Journal of Writing Assessment. She is a faculty supervising editor for Mosaic, a student-led literary magazine at Texas A&M-University San Antonio."
