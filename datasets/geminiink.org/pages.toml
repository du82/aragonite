["https://geminiink.org/who-we-are"]
title = "Who We Are - Gemini Ink"
full_description = "Gemini Ink’s mission is to teach the craft of writing to people of all skill levels so they can bring their stories to life. We believe writing that story is powerful. When people learn the four pillars of writing, they learn the power of the craft of writing. When they learn the power of the craft of writing, they bring their stories to life. Our strategic vision is to teach 12,000 people how to bring their stories to life by 2025. Gemini Ink’s programs serve children, youth and adults across San Antonio. We serve an estimated 3500 participants annually: 83% take our programs free of charge, and 67% of those served are people of color. With 25% of households in the city under Federal poverty and a population 63% Latino and 8% African American, our outreach into all corners of the city is especially significant. Since 1992, we’ve increased access to the writing arts, grown literacy, and built joy in and engagement with reading and writing. Alexandra is the author of three full-length collections of poems: Kiss/Hierarchy (Rain Mountain Press, 2016) and The Park of Upside-Down Chairs (CW Books, 2010). Her recent collection, Ricochet Script, from Next Page Press was published in the spring of 2022. She has also published several chapbooks, including Dear Jean Seberg (2011), which won the 2010 Burnside Review Chapbook Contest. Her poems have been published in journals nationwide, such as The Cincinnati Review, Connecticut Review, 32Poems, Denver Quarterly, The Taos Journal of International Poetry & Art, and Washington Square. Her work has been nominated for five Pushcart Prizes and Best of the Net. Florinda Flores-Brown is a writer, educator, and nonprofit professional from Laredo, TX, now living in San Antonio. She has a Bachelor of Arts in Theatre and Dance from the University of Texas at Austin and a Master of Fine Arts in Creative Writing from Goddard College. She currently works as Gemini Ink’s Director of Programs, through which she oversees creative writing workshops that help diverse communities across San Antonio bring their stories to life. Florinda has performed live stories at TPR’s Worth Repeating, Listen To Your Mother, Jump-Start Performance Company, and other San Antonio shows and venues. She also writes short fiction and plays."
