["https://geminiink.org/lit-minds"]
title = "LitMinds Book Club - Gemini Ink"
full_description = "The 2nd Wednesday of every other month (bi-monthly) Wednesdays, Jan 8, Mar 12, May 14 6:30-8pm, in-person Gemini Ink, 1111 Navarro St, San Antonio, TX Free & Open to the Public The Lit Minds Book Club enriches the imagination and lives of book lovers by facilitating engaging conversations about diverse books in an inclusive, positive environment. Participants will dive deep into books from across geographical regions, times, and cultural groups at each meeting. Our diverse selection of fiction and nonfiction will be used to spark thoughtful, engaging conversations that nurture the love of books and broaden our understanding of what literature can be. Nathan Brown is a physical therapist and the Director of Clinical Education in the Physical Therapy Program at University of the Incarnate Word. He is from Laredo, Texas, and received his Doctor of Physical Therapy from Texas Woman’s University in 2010. Nathan is a book lover. He reads to gain the perspective of others, stay informed of historical and contemporary world events, and relieve stress. His involvement with Great Books Houston during his graduate studies inspired him to create the Lit Minds Book Club. He and his wife Florinda have two boys and have lived in San Antonio since 2010. Mona Bains is an educator and Associate Professor at the University of the Incarnate Word. She has a doctorate in neuropharmacology from UTHealth San Antonio. She has published in scientific and education journals. Outside of teaching all things neuroscience she enjoys reading with her girls, learning new card games like “Taco vs. Burrito,” and a good weekend brunch. When you purchase one of our upcoming LitMinds book club selections at The Twig, tell the cashier you are a LitMinds book club member for 15% off!"
