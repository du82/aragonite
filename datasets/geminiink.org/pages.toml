title = "LitMinds Book Club - Gemini Ink"
description = """
Join us for the Lit Minds Book Club at Gemini Ink. We’re reading Ray Bradbury’s Fahrenheit 451.
Register
Nearly seventy years after its original publication, Ray Bradbury’s internationally acclaimed novel Fahrenheit 451 stands as a classic of world literature set in a bleak, dystopian future. Today its message has grown more relevant than ever before.
Guy Montag is a fireman. His job is to destroy the most illegal of commodities, the printed book, along with the houses in which they are hidden. Montag never questions the destruction and ruin his actions produce, returning each day to his bland life and wife, Mildred, who spends all day with her television “family.” But when he meets an eccentric young neighbor, Clarisse, who introduces him to a past where people didn’t live in fear and to a present where one sees the world through the ideas in books instead of the mindless chatter of television, Montag begins to question everything he has ever known


Ray Bradbury was an American fantasy and horror author who rejected being categorized as a science fiction author, claiming that his work was based on the fantastical and unreal. His best known novel is Fahrenheit 451, a dystopian study of future American society in which critical thought is outlawed. He is also remembered for several other popular works, including The Martian Chronicles and Something Wicked This Way Comes. Bradbury won the Pulitzer in 2007, and is one of the most celebrated authors of the 21st century. — Biography.com"""
