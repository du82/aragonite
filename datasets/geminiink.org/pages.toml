["https://geminiink.org/celebrating-san-antonios-inaugural-xicanx-month"]
title = "Celebrating San Antonio’s Inaugural Xicanx Month - Gemini Ink"
description = 'Xicanx Month in San Antonio honors the Chicano Arts Movement and is a city-wide inaugural celebration of Mexican American culture and its contributions to the arts. The gender-inclusive term "Xicanx" includes Chicano, Chicana, and Chicanx individuals, recognizing their Indigenous roots. In celebration of Xicanx Month, we want to highlight Xicanx writers that will be part'
full_description = "Xicanx Month in San Antonio honors the Chicano Arts Movement and is a city-wide inaugural celebration of Mexican American culture and its contributions to the arts. The gender-inclusive term “Xicanx” includes Chicano, Chicana, and Chicanx individuals, recognizing their Indigenous roots. In celebration of Xicanx Month, we want to highlight Xicanx writers that will be part of our programming this fall. Check out these talented writers from San Antonio. Don’t miss the opportunity to learn from these inspiring authors. We hope to see you in one of their classes soon! Anthony Flores – Anthony “The Poet” Flores is a three-time San Antonio Grand Slam Poetry Champion who has represented San Antonio on six different occasions at the National Poetry Slam. He is the author of the poetry collection, CINCUENTA (CreateSpace Independent Publishing, 2019). Join Anthony on Oct 1 & 8, for “Funny Bones: Craft a Calavera Poem.” Anel I. Flores – Anel I. Flores is a lesbian, queer, woman story-maker. She is the author of Empanada: A Lesbiana Story en Probaditas (Korima Press, 2013). Anel will be the featured writer for The Big Texas Author Talk series on November 20th from 7-8:30 CST via Zoom. Amalia Ortiz – Amalia Ortiz is a Tejana actor, writer, and activist. She is the author of Rant.Chant.Chisme. (Wings Press, 2015) and The Canción Cannibal Cabaret & Other Songs (Aztlan Libre Press, 2019). Amalia is currently leading the workshop, “Raising The Stakes: Fictionalizing Your Stories for the Stage,” that will conclude in a dramatic reading of works-in-progress. Daniel Peña – Daniel Peña is a writer and associate professor at the University of North Texas. He is the author of Bang (Arte Publico Press, 2018). Join Daniel for his workshop, “Crash Course in Character Driven Writing that Blends Genres” on December 7th and 8th on Zoom. C.L. Rooster Martinez is a spoken word poet, professor, and podcaster. He is the author of three books: Mexican Dinosaur (WAN Publishing, 2023), A Saint for Lost Things (Alabrava Press, 2020), and As It Is in Heaven (Kissing Dynamite Poetry Press, 2020). Join Rooster for his workshop, “Be the Writer You Are: Alternative Approaches to Creative Writing” on Saturday, October 19th from 10am to 3:30pm CST at the Gemini Ink Office. Leticia Urieta – Leticia Urieta is a Tejana writer from Austin, TX. She is the author of Las Criaturas (FlowerSong Press, 2021) and the forthcoming dark fiction collection, The Remedy is the Disease (Undertaker Books, 2026). Join Leticia for her workshop, “What Happens Inside: A Body Horror Workshop” on Thursday November 14 and 21st from 6:30 to 8:30pm CST on Zoom. Eddie Vega – Currently serving as the 7th Poet Laureate of San Antonio, Eddie Vega is a poet, spoken word artist, storyteller, and educator. He is the author of Chicharra Chorus (FlowerSong Press, 2019) and Somos Nopales (FlowerSong Press 2024). Eddie will be featured at our reading on September 26th at Poetic Republic."
