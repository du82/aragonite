["https://geminiink.org/congratulations-to-the-young-writers-at-promesa-academy"]
title = "Congratulations to the young writers at Promesa Academy! - Gemini Ink"
full_description = "Last spring, our teaching artists, Joyous Windrider Jiménez and Excy Guardado, provided a creative workshop titled “Spark Poetry! Creative Writing Workshops” at Promesa Academy for K-5 students. Promesa Academy is a charter school with an approach rooted in equality, love, and innovation, serving predominantly economically disadvantaged students. Jiménez and Guardado shared rhyme exercises, mentor texts, writing and drawing exercises, and guided students through the study of figurative language through various imaginative writing prompts. Students were encouraged to explore wordplay through poetry and poetic devices. Promesa Academy instructor, Lace Garcia, created these lovely broadsides of the students’ work, and a final celebration was held on May 23rd. Be sure to scan the QR code on each poster to hear each writer read their work! Congratulations to our youth poets at Promesa Academy, we encourage you to keep on writing! View Larger View Larger View Larger View Larger View Larger View Larger Read all of Promesa Academy's Poetry Broadsides"
