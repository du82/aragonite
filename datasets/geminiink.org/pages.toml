full_description = "6:30 pm - 8:30 pm Recurring Open Writer’s Labs March 31 @ 6:30 pm - 8:30 pm CST Recurring Open Writer’s Labs These peer-driven workshops, held the last Monday of each month, are free and open to writers of all levels and focus on poetry, flash fiction, and short creative non-fiction. Free 6:30 pm - 8:30 pm Everything but the Kitchen Sink: A Workshop on Writing Hybrid Essays with ire’ne lara silva April 1 @ 6:30 pm - 8:30 pm CST Everything but the Kitchen Sink: A Workshop on Writing Hybrid Essays with ire’ne lara silva In this three-week workshop, we will liberate our minds and recover from the trauma of the “school-essay” mentality by creating hybrid essays that engage the reader, reflect our realities, and push the limits of what an essay can be. Bring any projects or ideas you're working on--memoirs, family histories, love letters, journals, or thoughts you want to share about life, art, history, spirit, geography, the world! 6:30 pm - 8:30 pm The Poetics of You: An Intro to Poetry Workshop with Melissa Studdard April 7 @ 6:30 pm - 8:30 pm CDT The Poetics of You: An Intro to Poetry Workshop with Melissa Studdard In this four-session workshop, we’ll explore and review basic poetic concepts while working with prompts designed to unlock your own unique poetic gifts and subject matter. The Poetics of You will be a generative, supportive, and encouraging space in which to learn, experiment, and explore. In the weekly virtual meetings, we will study basic techniques, read sample poems, compose drafts, and share writings. $155 6:30 pm - 8:30 pm Recurring Veteran’s Writing Collective with Sarah Colby April 16 @ 6:30 pm - 8:30 pm CDT Recurring Veteran’s Writing Collective with Sarah Colby The Veteran’s Writing Collective encourages the art of writing in a workshop environment where participants are offered honest, positive, and constructive peer-to-peer and mentor feedback. The workshop is open to all active-duty military, veterans, retirees, and their immediate family members. Writers of all levels working in all genres are welcome. Free"
