title = "Scholarships - Gemini Ink"
description = "Gemini Ink is committed to making the writing arts accessible to writers of all backgrounds and skill levels so they can bring their stories to life. Writers of all levels are welcome to apply. The goal of these scholarships is to support writers in their creative journey and are open to all writers working in any"
full_description = "Gemini Ink is committed to making the writing arts accessible to writers of all backgrounds and skill levels so they can bring their stories to life. Writers of all levels are welcome to apply. The goal of these scholarships is to support writers in their creative journey and are open to all writers working in any genre with an interest in a Gemini Ink workshop. Gemini Ink established the Cary Clack Scholarship Fund for emerging writers in honor of journalist Cary Clack’s groundbreaking literary contributions as the first African American to join the San Antonio Express-News Editorial Board. Who can apply? Anyone can apply. Available for Black, Indigenous and People of Color (BIPOC) writers to take Gemini Ink writing workshops. Who can apply? Available to all K-12 educators in Bexar County. Poets Against Walls Black Lives Matter Scholarship is a writing scholarship launched by Texas Poet Laureate 2020 Emmy Pérez and co-organized with Poets Against Walls. The poetry collective that aims to document and share communal stories from individual perspectives—through poetry, testimonio, and the spoken word—about life and social justice issues in the Texas borderlands and beyond. Who can apply? Any black writer can apply. Help us replenish the Poets Against Walls Black Lives Matter scholarship funds today. Your support will make a difference in empowering future writers."
