["https://gen-i.si/novice/znizujemo-ceno-elektricne-energije-za-gospodinjske-odjemalce"]
title = "Znižujemo ceno električne energije za gospodinjske odjemalce - GEN-I"
description = "S 1. marcem 2025 znižujemo redni cenik električne energije za gospodinjske odjemalce."
full_description = "Znižujemo ceno električne energije za gospodinjske odjemalce 22. 02. 2025 Skrb za odjemalce je ključno vodilo delovanja Skupine GEN-I na vseh segmentih oskrbe z energenti. Po znižanju cene za dobavo zemeljskega plina za gospodinjske in male poslovne odjemalce ter cene električne energije za male poslovne odjemalce decembra lani po izteku regulacije s 1. marcem 2025 znižujemo še redni cenik za gospodinjske odjemalce. Zaradi visoke rasti cen električne energije na mednarodnih energetskih trgih je Vlada Republike Slovenije z vmesnimi podaljšanji za obdobje od 1. septembra 2022 do 28. februarja 2025 omejila cene električne energije za gospodinjske odjemalce. S to uredbo so bili odjemalci zaščiteni pred vplivom visokih cen na njihove mesečne položnice. Ob tem, ko veleprodajne cene električne energije na mednarodnih energetskih trgih še vztrajajo na višjih cenovnih nivojih, kot smo bili vajeni pred energetsko krizo in uvedbo regulacije cen, nam skrb za odjemalce, podprta z aktivnim mednarodnim upravljanjem nabave energentov v okviru široko razvejane mednarodne prisotnosti na energetskih trgih, omogoča znižanje cen električne energije za gospodinjske odjemalce po izteku regulacije s 1. marcem 2025. Spremembe bodo prvič vidne na računih za mesec marec, izdanih v mesecu aprilu. Cena električne energije za gospodinjske odjemalce se bo v povprečju vseh treh tarif v primerjavi z dosedanjim rednim cenikom znižala za skoraj 30 %. S tem v družbi GEN-I tudi po odpravi cenovne regulacije sledimo svojemu poslanstvu zanesljivega in zaupanja vrednega dobavitelja, ter prvega v skrbi za svoje odjemalce. > Redni cenik električne energije za gospodinjske odjemalce Novice 28. 02. 2025 Pravno obvestilo z dne 28. 2. 2025 za odjemalce v samooskrbni skupnosti Sončna skupnost Ajdovščina Z dnem 1. 3. 2025 stopi v veljavo nov Cenik za samooskrbo Sončne skupnosti Ajdovščina. >Preberite več 27. 02. 2025 Najbolj zaupanja vreden dobavitelj električne energije za domove v Sloveniji Zaupanje gradimo z vedno ugodnimi cenami, prijazno in strokovno ekipo za podporo odjemalcem ter naprednimi digitalnimi rešitvami. >Preberite več 21. 02. 2025 Pravno obvestilo z dne 21. 2. 2025 za gospodinjske odjemalce Z dnem 21. 2. 2025 se spreminja ime rednega cenika zemeljskega plina za dobavo gospodinjskim odjemalcem. >Preberite več >Poglejte vse"
