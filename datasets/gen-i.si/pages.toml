["https://gen-i.si/o-gen-i/nasa-zgodba/15-let-pametne-energije"]
title = "15 let pametne energije - GEN-I"
full_description = "Od Poceni elektrike do vodilnega promotorja zelene preobrazbe V letu 2024 smo praznovali 15. obletnico uspešnega delovanja na področju dobave električne energije in oskrbe gospodinjskih ter malih poslovnih odjemalcev. V tem času skupaj z našimi odjemalci delimo pot in gradimo trajnostno prihodnost. Skupaj smo dosegli več ključnih mejnikov, ki so postavili trdne temelje za naše trenutno delovanje in prihodnost. Elektrika za vaše domove Naši začetki segajo v marec 2009, ko smo lansirali blagovno znamko Poceni elektrika, maja istega leta pa smo začeli dobavljati elektriko prvim odjemalcem. Iz manjšega trgovca z električno energijo smo v dveh desetletjih zrasli v mednarodno vpeto Skupino, ki danes z električno energijo oskrbuje že več kot 450.000 odjemalcev. Zanesljivo partnerstvo Naši glavni odgovornosti v odnosu do strank sta zagotavljanje energije po ugodnih cenah in ponudba okolju čim bolj prijaznih storitev. Osem zaporedno osvojenih nagrad Trusted brand za najbolj zaupanja vrednega dobavitelja električne energije v Sloveniji in trikratni naziv Odjemalcu prijazen dobavitelj potrjujejo, da smo zanesljiv in zaupanja vreden dobavitelj elektrike. Trajnostni razvoj V 2021 smo prvi v Sloveniji začeli z dobavo izključno brezogljične električne energije in odjemalcem omogočili možnost izbire vira energije, iz katerega dobavljamo elektriko. S soncem, vodo in jedrsko energijo Sloveniji zagotavljamo brezogljično prihodnost. Z vizijo usmerjenosti v digitalno odjemalcem nudimo številne okolju prijazne storitve v digitalni obliki. Pametne rešitve Leta 2016 smo ustanovili podjetje GEN-I Sonce in postavili prvo sončno elektrarno za samooskrbo. Danes je GEN-I Sonce vodilni ponudnik sončnih elektrarn v Sloveniji, ki nenehno razvija rešitve za širjenje rabe sončne energije. Letos smo postavili prvi primer lokalne sončne skupnosti v Sloveniji, s katero smo omogočili cenovno ugoden dostop do sončne energije tudi tistim, ki samooskrbe z energijo ne morejo urediti na lastni strehi."
