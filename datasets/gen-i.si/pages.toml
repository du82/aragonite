["https://gen-i.si/dom/trajnostne-resitve/soncne-elektrarne"]
title = "Sončne elektrarne - GEN-I"
full_description = "Proizvajajte in shranjujte svojo elektriko S postavitvijo sončne elektrarne lahko pozabite na naraščajoče cene električne. Dodatno pa lahko sončno elektrarno nadgradite z baterijskim hranilnikom in si tako zagotovite celovito samooskrbo. Baterijski hranilnik omogoča shranjevanje viškov proizvedene energije za uporabo v času, ko sonce ne sije. Ko je baterija polna, vaša sončna elektrarna pa še vedno proizvaja električno energijo, pa pride v ospredje edinstven model samooskrbe, ki presežno električno energijo od vas odkupi. Tako si boste zagotovili optimalno izrabo proizvedene energije in zmanjšali svoje stroške za elektriko. Zagotovite si energetsko neodvisnost Znižajte stroške dobave električne energije svojega doma z lastno sončno elektrarno za naslednjih 30 let. Oglejte si ponudbo GEN-I Sonce Najvišji prihranki s hranilniki energije Za najvišje prihranke, najbolj optimalen izkoristek elektrike in še večjo neodvisnost od omrežja priporočamo izgradnjo sončne elektrarne s hranilnikom energije. Ta neporabljene presežke energije shranjuje za kasnejšo uporabo. Ko vaša sončna elektrarna proizvaja elektriko, baterija pa je že polna, viške energije od vas odkupimo. Tako potrebujete manj elektrike iz omrežja v času, ko sonca ni, poleg tega pa za viške energije prejmete dobropis na mesečnem računu za elektriko. Celostna storitev Izgradnja sončne elektrarne GEN-I Sonce poteka po načelu »vse na ključ« in pomeni, da je v postopek in pogodbeno ceno vključeno vse, od začetnega svetovanja do končnega priklopa, vključno s pridobivanji soglasij in urejanjem dokumentacije. V sklopu storitve izgradnje sončne elektrarne na ključ poskrbimo tudi za pridobitev subvencij in aktivacijo pogodbe o samooskrbi, ki vam zagotavlja odkup viškov električne energije. Kratka vračilna doba investicije Vračilna doba investicije v samooskrbo ostaja še vedno zelo nizka in znaša v povprečju 8 let za sončno elektrarno ter 11 let za sončno elektrarno s hranilnikom energije. Pričakovana življenjska doba sončne elektrarne znaša 30 let, kar pomeni, da obdobje vračanja investicije predstavlja le delček njene celotne življenjske dobe. Dolgoročna podpora Vsaki sončni elektrarni zagotovimo sistem daljinskega spremljanja delovanja sončne elektrarne preko priročne mobilne aplikacije in jo na vašo željo recikliramo po izteku življenjske dobe. Ob doplačilu nudimo vzdrževanje, kjer preko visokotehnološkega centra 24/7 izvajamo kontrolo delovanja, zaznavo in odpravo napak, redne fizične preglede sončne elektrarne na dve leti ter čiščenje modulov."
