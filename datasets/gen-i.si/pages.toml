a postopka, povrnitev katerih lahko kupcu na predlog prodajalca v uradnem postopku naloži sodišče glede na pravila veljavne zakonodaje. SMS Z OCENO ZADOVOLJSTVA Po opravljenem klicu na brezplačno številko 080 15 58 klicatelj prejme brezplačno SMS sporočilo s pozivom za oceno zadovoljstva s storitvami GEN-I. Povratno poslano SMS sporočilo je plačljivo po veljavnem ceniku izbranega ponudnika mobilne telefonije. Informacije o dajatvah, določenih s strani države (tarifah) S klikom na posamezno dajatev boste usmerjeni na spletno stran, na kateri se nahaja akt, ki določa višino te dajatve. Omrežnina Prispevek za PEU (prispevek za energetsko učinkovitost po 317. členu EZ-1) Prispevek za SPTE in OVE (prispevek za zagotavljanje podpor proizvodnji električne energije v soproizvodnji z visokim izkoristkom in iz obnovljivih virov energije po 377. členu EZ-1) Prispevek za delovanje operaterja trga (po 98. členu EZ-1) Trošarina Ostale povezave in dokumenti >Tabela minimalnih standardov kakovosti >Razlaga računa >Arhiv Pogosta vprašanja Do kdaj velja vaš redni cenik? Redni cenik velja do preklica oziroma uvedbe novega rednega cenika. Kaj pomenijo oznake VT, MT in ET? VT predstavlja višjo tarifo, ki se pri dvotarifnem merjenju beleži vsak delavnik od 6. zjutraj do 22. ure zvečer, MT predstavlja manjšo tarifo, ki se beleži vsak delavnik med 22. uro zvečer in 6. uro zjutraj ter ob sobotah, nedeljah in praznikih 24 ur. ET pa predstavlja enotno tarifo, ki se pri enotarifnem merjenju beleži vsak dan 24 ur. Ali imam pogodbeno vezavo? Ne, pogodba za dobavo električne energije za gospodinjske odjemalce je brez vezave. Kaj je EKO popust? Če se za posamezno merilno mesto odločite za prejemanje računa v elektronski obliki, vam bomo vsak mesec priznali EKO popust v višini 1,00 EUR brez DDV (1,22 EUR z DDV) in vam tako za polovico znižali strošek mesečnega nadomestila. Kaj poravnam s plačilom postavke 100 % Sonce ali 100 % Voda? Tehnologije za pridobivanje in shranjevanje obnovljivih virov energije so še vedno dražje od tehnologij za pridelavo elektrike iz fosilnih goriv. Prav zato se pospešeno razvijajo nove tehnologije za pridobivanje električne energije iz obnovljivih virov, tudi z namenom, da se jo končnim odjemalcem omogoči po čim ugodnejši ceni. Vsak razvoj in proizvodnja sta povezana z določenimi stroški, ki pa so v primeru pridobivanja sončne ali vodne energije investicija v lepšo prihodnost. Z minimalnim doplačilom za energijo proizvedeno izključno iz sonca ali vode, boste pomembno prispevali k zeleni preobrazbi družbe."
