title = "Ceniki in akcije - GEN-I"
description = "Preverite aktualne cenike in akcije zemeljskega plina za gospodinjske odjemalce. Zamenjavo dobavitelja pri nas opravite hitro in enostavno."
full_description = "Vrsta cenika Redni cenik Akcija Dobava plina Redni cenik zemeljskega plina za dobavo gospodinjskim odjemalcem Ugodna cena zemeljskega plina Brez časovne vezave Enostavna zamenjava dobavitelja brez skritih stroškov Redni cenik Trenutno ni na voljo aktualnih cenikov ali akcij za vaš izbor. CENIK NADOMESTNE OSKRBE Velja od 28. 10. 2022 do spremembe Cena zemeljskega plina za dobavo zemeljskega plina gospodinjskim odjemalcem, malim poslovnim odjemalcem, skupnim gospodinjskim odjemalcem in zaščitenim odjemalcem iz 117. člena Zakona o oskrbi s plini (Ur. l. RS, št. 204/21 in nadaljnji; v nadaljevanju: ZOP), ki so priključeni na distribucijski sistem in za katere so izpolnjeni vsi pogoji za nadomestno oskrbo po 18.a členu ZOP, se izračuna za pretekli mesec na podlagi naslednjega izračuna. Cena zemeljskega plina za nadomestno oskrbo za posamezen obračunski mesec je izražena v €/kWh in se izračuna kot aritmetična sredina mejnih nakupnih cen zemeljskega plina vseh dni v tem mesecu, objavljenih na strani operaterja prenosnega sistema PLINOVODI, Družba za upravljanje s prenosnim sistemom, d.o.o. (https://www.plinovodi.si/sl/obratovanje/trg-z-zemeljskim-plinom/izravnalni-trg-zemeljskega-plina/), povečana za 25 %. Mesec Cena brez DDV v €/kWh Januar 2025 0,07139 December 2024 0,067354 November 2024 0,064085 Oktober 2024 0,055256 Prodajalec tako izračunano ceno zemeljskega plina v €/kWh za nadomestno oskrbo vsakokrat objavi na svoji spletni strani najkasneje v treh delovnih dneh tekočega meseca za dobave zemeljskega plina v preteklem mesecu. Cena zemeljskega plina za nadomestno oskrbo ne vključuje davka na dodano vrednost (DDV), trošarine na zemeljski plin, prispevka za energetsko učinkovitost, prispevka za zagotavljanje podpor proizvodnji električne energije v soproizvodnji z visokim izkoristkom in iz obnovljivih virov energije, stroškov za uporabo distribucijskega omrežja zemeljskega plina, dodatkov in prispevkov k uporabi distribucijskih omrežij in morebitnih drugih javnih dajatev, določenih s strani države, ki se obračunajo v skladu z vsakokrat veljavnimi predpisi. Stroški vseh teh postavk bremenijo odjemalca nadomestne oskrbe. Njihova sprememba ne pomeni spremembe cene zemeljskega plina za nadomestno oskrbo. Uredba o določitvi cen zemeljskega plina iz plinskega sistema (Uradni list RS, št. 98/22 in nadaljnji) in Uredba o določitvi cen zemeljskega plina iz plinskega sistema (Uradni list RS, št. 45/23) se za odjemalce nadomestne oskrbe, ki so do ukrepov po teh predpisih upravičeni, uporabljata neposredno. Pojasnilo - stroški opominjanja in izterjave GEN-I ne glede na določilo točke 3.7. Splošnih pogojev za dobavo zemeljskega plina odjemalcem, priključenim na distribucijsko omrežje zemeljskega plina, ki imajo odjemno mesto razvrščeno v odjemno skupino od vključno CDK1 do vključno CDK8, kupcem ne zaračunava stroškov opominjanja v primeru zamude pri plačilu računov za zemeljski plin, stroškov izterjave neporavnanih obveznosti oz. celotnega stroška teh storitev v primeru izvajanja le-teh s strani tretjih oseb (izvršitelji, odvetniki ipd.). Navedeno ne velja za stroške izvršilnega postopka, povrnitev katerih lahko kupcu na predlog prodajalca v uradnem postopku naloži sodišče glede na pravila veljavne zakonodaje. SMS z oceno zadovoljstva Po opravljenem klicu na brezplačno številko 080 15 58 klicatelj prejme brezplačno SMS sporočilo s pozivom za oceno zadovoljstva s storitvami GEN-I. Povratno poslano SMS sporočilo je plačljivo po veljavnem ceniku izbranega ponudnika mobilne telefonije. Informacije o dajatvah, določenih s strani države (tarifah) S klikom na posamezno dajatev boste usmerjeni na spletno stran, na kateri se nahaja akt, ki določa višino te dajatve. Znesek za distribucijo (pavšal, poraba) in meritve: višina omrežnine je določena z aktom geografsko pristojnega operaterja distribucijskega sistema. Akte najdete TUKAJ. Prispevek za PEU (prispevek za energetsko učinkovitost po 317. členu EZ-1) Prispevek za SPTE in OVE (prispevek za zagotavljanje podpor proizvodnji električne energije v soproizvodnji z visokim izkoristkom in iz obnovljivih virov energije po 377. členu EZ-1) Okoljska dajatev CO2 Trošarina Ostale povezave in dokumenti >Razlaga računa >Arhiv Pogosta vprašanja Do kdaj velja vaš redni cenik? Redni cenik velja do preklica oziroma uvedbe novega rednega cenika. Ali imam pogodbeno vezavo? Ne, pogodba za dobavo električne energije za gospodinjske odjemalce je brez vezave. Ali so z zamenjavo dobavitelja povezani kakšni stroški? Ne, zamenjava dobavitelja je brezplačna. Ali moram pred zamenjavo prekiniti pogodbo z dosedanjim dobaviteljem? Ne. Ko pošljete podpisano pogodbo nazaj na GEN-I, je za vas stvar opravljena. Za vse postopke, prekinitve dosedanjih pogodb v vašem imenu brezplačno poskrbimo mi. Kako poteka sklenitev pogodbe na daljavo? Pri GEN-I omogočamo sklenitev pogodbe na daljavo brez posebnih certifikatov, potrebujete le računalnik ali mobilni telefon, povezavo do interneta in elektronski naslov. Vso pogodbeno dokumentacijo vam pri sklenitvi pogodbe na daljavo pošljemo neposredno na vaš elektronski naslov, za podpis pa je potreben le klik na gumb v sporočilu. Po kliku vam na vaš elektronski naslov pošljemo izvod podpisane pogodbene dokumentacije, en izvod pa posredujemo operaterju distribucijskega sistema, ki skrbi za beleženje zamenjav in sprememb na merilnih mestih. Ko z njihove strani prejmemo odgovor, vas o tem obvestimo."
