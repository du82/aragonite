["https://gen-i.si/novice/pravno-obvestilo-z-dne-28-2-2025-za-odjemalce-v-samooskrbni-skupnosti-soncna-skupnost-ajdovscina"]
title = "Pravno obvestilo z dne 28. 2. 2025 za odjemalce v samooskrbni skupnosti Sončna skupnost Ajdovščina  - GEN-I"
description = "Z dnem 1. 3. 2025 stopi v veljavo nov Cenik za samooskrbo Sončne skupnosti Ajdovščina."
full_description = "Pravno obvestilo z dne 28. 2. 2025 za odjemalce v samooskrbni skupnosti Sončna skupnost Ajdovščina 28. 02. 2025 Z dnem 1. 3. 2025 stopi v veljavo nov Cenik za samooskrbo Sončne skupnosti Ajdovščina, ki bo v zvezi z dobavo električne energije odjemalcem, vključenim v samooskrbno skupnost Sončna skupnost Ajdovščina, ki imajo sklenjeno Pogodbo o dobavi električne energije in samooskrbi gospodinjskega odjemalca z električno energijo (v nadaljevanju: Pogodba) za merilna mesta oz. za merilne točke na merilnih mestih, ki so vključene v skupnostno samooskrbo, nadomestil prej veljavni Redni cenik električne energije za samooskrbo gospodinjskih odjemalcev (oz. vsakokratni veljavni cenik za samooskrbo z električno energijo, ki velja za individualno samooskrbo), ki se je uporabljal skupaj s Pogodbo. Redni cenik električne energije za samooskrbo gospodinjskih odjemalcev s 1. 3. 2025 za odjemalce, vključene v samooskrbno skupnost Sončna skupnost Ajdovščina, v zvezi z dobavo električne energije na merilnih mestih oz. na merilnih točkah na merilnih mestih, vključenih v skupnostno samooskrbo, preneha veljati in se uporabljati. Navedeno pomeni, da se bo odjemalcem v samooskrbni skupnosti Sončna skupnost Ajdovščina dobavljena električna energija od vključno dne 1. 3. 2025 dalje obračunala po Ceniku za samooskrbo Sončne skupnosti Ajdovščina, veljavnem od dne 1. 3. 2025 dalje do preklica/spremembe. Cena tarife bo znašala: ET: 0,10890 EUR/kWh (cena brez DDV) oz. 0,13286 EUR/kWh (cene z 22 % DDV). To obvestilo je zavezujoče in nadomešča dosedanjo uporabo Rednega cenika električne energije za samooskrbo gospodinjskih odjemalcev za namene obračuna dobavljene električne energije odjemalcem, vključenih v samooskrbno skupnost Sončna skupnost Ajdovščina, ter velja kot dodatek k Pogodbi. Ceni mesečnega nadomestila in znižanega mesečnega nadomestila ob koriščenju EKO popusta po Ceniku za samooskrbo Sončne skupnosti Ajdovščina ostajata nespremenjeni. Cenik za samooskrbo Sončne skupnosti Ajdovščina in ostale informacije so dostopne tukaj."
