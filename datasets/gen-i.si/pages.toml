title = "Tržna prisotnost - GEN-I"
full_description = "Vodilni dobavitelj, zanesljiv partner in prva izbira Smo ena najhitreje rastočih in najbolj inovativnih družb na evropskem energetskem trgu ter prvi slovenski dobavitelj izključno brezogljične elektrike. Vodilni dobavitelj v Sloveniji Leta 2005 smo začeli dobavljati elektriko prvim poslovnim, leta 2009 pa prvim gospodinjskim odjemalcem. Od takrat smo z osredotočenostjo na potrebe kupcev, razvojem inovativnih produktov, predvsem pa s transparentno in ugodno ponudbo za odjemalce zrasli v največjega dobavitelja električne energije v Sloveniji. Električno energijo dobavljamo vsem segmentom končnih kupcev – gospodinjstvom, malim poslovnim odjemalcem, industriji in javnim naročnikom. Vsa naša dobava je od leta 2021 izključno iz brezogljičnih virov. Vodilni trgovec v regiji Z različnimi vrstami energentov trgujemo na 22 evropskih trgih, od Francije na zahodu do Ukrajine in Turčije na vzhodu. Vzpostavljeno imamo razvejano mednarodno infrastrukturo, prek katere širimo svoje aktivnosti trgovanja na različna geografska tržišča. Prisotni smo na vseh pomembnih energetskih borzah v Evropi in zunaj nje, tako po trgovalnih količinah kot po zaupanju pa se uvrščamo v sam vrh trgovcev v regiji. Naše trgovalne količine dosegajo približno desetkratnik celotnega odjema električne energije v Sloveniji, na najvišja mesta po zaupanju in spoštovanju pa nas že več let uvršča največja mednarodna raziskava med trgovci z energenti Energy Risk Commodity Rankings. Vodilni promotor zelene preobrazbe Na energetskih trgih smo pred petnajstimi leti izzvali ustaljene norme in vzorce ter vnesli sveže pristope in spremembe s ciljem ustvarjanja koristi za stranke. Ob izzivih čim hitrejšega razogljičenja pa vlogo nosilca razvoja in inovativnih pristopov danes udejanjamo na področju zelene in digitalne preobrazbe celotnega energetskega sistema. Svoje delovanje smo prilagodili na način, da smo dvema osnovnima storitvama, trgovanju in dobavi energentov, dodali zelene energetske storitve, ki odjemalcem omogočajo nove možnosti za znižanje ogljičnega odtisa. Z dobavo brezogljične električne energije odjemalcem nudimo tudi izbiro vira, iz katerega je elektrika zanje pridobljena. S spodbujanjem sonca kot primarnega vira električne energije smo vodilni ponudnik samooskrbnih sončnih elektrarn pri nas, prisotnost na področju oskrbe s sončno energijo pa širimo tudi na nova tržna področja in izven meja."
