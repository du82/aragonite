["https://gen-i.si/dom/trajnostne-resitve/pametna-samooskrba"]
title = "Pametna samooskrba - GEN-I"
full_description = "Napredna samooskrba Paket Pametna samooskrba združuje naše najnaprednejše tehnološke rešitve, ki vam bodo ob izgradnji sončne elektrarne s hranilnikom energije znižale mesečni račun za elektriko do 60 %. Napredni paket samooskrbe sestavljajo: napredno upravljanje hranilnika energije, ki omogoča fiksni mesečni popust, odkup presežno proizvedene energije, dobava energije po ugodni fiksni ceni, visoko kakovostna sončna elektrarna in hranilnik energije z brezobrestnim odplačevanjem po vaši meri. S paketom do najvišjih prihrankov na vašem računu Uporabite napredni spletni kalkulator na strani GEN-i Sonce in se sami prepričajte, koliko lahko prihranite z izbiro paketa Pametna samooskrba. Izračunajte prihranek Maksimalen izkoristek hranilnika Zagotovljenmesečnipopust Večjaenergetska neodvisnost Inovativennačin odplačevanja Kako deluje paket? Sončna elektrarna s hranilnikom energije shranjuje presežke energije, ki jih ne porabite v vašem domu. Vašo baterijo upravljamo tako, da vam vsak mesec zagotovimo fiksni popust, s katerim si znižate mesečni račun za elektriko. Ko vaša sončna elektrarna proizvaja elektriko, baterija pa je že polna, hkrati od vas odkupimo tudi presežke proizvedene energije, ki gredo v omrežje. Ko je vrednost presežne energije višja od stroška prevzete energije iz omrežja, se v obliki dobropisa prenese v naslednje mesece. Tako si poleg osnovnega vira prihranka s proizvodnjo lastne energije iz sončne elektrarne na računu zagotovite še dva vira prihranka: enega za upravljanje vašega hranilnika in drugega za odkup preseženo proizvedene energije. In kar je še najboljše, vse to je samodejno združeno na eni položnici, kjer imate jasen pregled nad svojimi prihranki, ki jih za vas ustvarja vaša sončna elektrarna. Koliko lahko prihranim? Primer družine Novak Novakovi, ki se grejejo s toplotno črpalko, letno porabijo 12.000 kWh električne energije. Za oskrbo z elektriko so letno plačali 2.266 €, zato so se odločili za investicijo v paket Pametna samooskrba. Ta bo njihov letni strošek elektrike zmanjšala za kar 60 % in jim zagotovila 1.400 € letnih prihrankov. Računi družine Novak Brez paketa S paketom Povprečni mesečni strošek za oskrbo z elektriko z DDV* 189 € 76 € Letni strošek za oskrbo z elektriko z DDV* 2.266 € 887 € * Podatki so izračunani za tipsko stranko z letnim odjemom 12 MWh, ki ima toplotno črpalko in sončno elektrarno velikosti 12 kW z baterijskim hranilnikom 10 kWh. Upoštevani so trenutno veljavni ceniki za dobavo električne energije, regulacija cen in nov način obračunavanja omrežnine, pri upravljanju baterije pa v povprečju 1,1 polnjenja dnevno. Znižanje računov s paketom Pametna samooskrba Z zagotovljenim fiksnim mesečnim popustom so računi družine Novak nižji v vseh letnih časih. Odkup presežno proizvedene energije pa jim omogoča, da se v mesecih, ko je vrednost presežne energije višja od stroška prevzete energije iz omrežja, razlika v obliki dobropisa prenese v naslednje mesece."
