["https://gen-i.si/o-gen-i/nasa-zgodba/zanesljiv-partner"]
title = "Zanesljiv partner - GEN-I"
description = "Z zanesljivimi partnerstvi deležnikom omogočamo konkurenčne cene in napredne storitve, s katerimi želimo omogočiti prehod v brezogljično prihodnost."
full_description = "Razvili smo se v vodilno energetsko družbo v regiji V začetku tisočletja smo prepoznali priložnosti odpiranja energetskih trgov in iz manjšega trgovca z električno energijo v dveh desetletjih zrasli v mednarodno vpeto Skupino. Z zanesljivimi partnerstvi deležnikom omogočamo konkurenčne cene in napredne storitve, s katerimi želimo posameznike in družbo opolnomočiti za prehod v brezogljično prihodnost. Smo nosilec razvoja energetskega trga centralne in jugovzhodne Evrope, kjer ustvarimo večino naših prihodkov. Postati želimo vodilni ponudnik zelenih energetskih rešitev, pri čemer sledimo poslanstvu vzpostavljanja in ohranjanja zanesljivih partnerstev na dolgi rok. Vizija Vodilni ponudnik zelenih rešitev Naše usmeritve za prihodnost temeljijo na pametnih rešitvah, ki bodo družbi omogočile zeleno preobrazbo in vzpostavitev trajnostnih vezi z naravnim okoljem. Kot vodilni ponudnik inovativnih produktov in storitev na evropskem energetskem trgu bomo spodbujali zeleno energijo, trajnostni razvoj in digitalizacijo poslovanja. Naš cilj je biti najboljša izbira za vse segmente energetske verige – proizvajalce, posrednike pri trgovanju in porabnike energentov. Želimo biti tudi najboljši zgled zelene preobrazbe in dokazati, da je ob ohranjanju stabilne rasti poslovanja mogoče razogljičiti družbo. Poslanstvo Zanesljivo partnerstvo S profesionalnim in inovativnim pristopom učinkovito tržimo energente tako, da proizvodnim virom omogočamo konkurenčno odkupno ceno, končnim odjemalcem pa zagotavljamo kakovostne storitve, zanesljivo oskrbo in obvladovanje stroškov nakupa energije. Z zgledom in lastnimi zelenimi odločitvami jih hkrati vodimo po poti zelene preobrazbe. Vrednote Našo vizijo in poslanstvo podpirajo temeljne GEN-I vrednote: Načela Pri uresničevanju svojega poslanstva se držimo naslednjih načel: Razvijamo podjetniško kulturo, ki temelji na vrlinah in razvoju zaposlenih. Osredotočamo se na potrebe strank in možnosti, ki jih nudi energetski sistem. Naši poslovni modeli temeljijo na inovativnih pristopih. Odločitve preverjamo in sprejemamo na podlagi analiz in podatkov. Strateško se povezujemo in digitaliziramo svoje delovanje."
