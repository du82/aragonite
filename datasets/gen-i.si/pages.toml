["https://gen-i.si/dom/zamenjaj-dobavitelja-za-dom"]
title = "Zamenjajte dobavitelja za dom - GEN-I"
description = "Menjava dobavitelja električne energije in zemeljskega plina še nikoli ni bila tako enostavna. Vi izpolnite obrazec, mi pa poskrbimo za vse ostalo."
full_description = "DOM / ZAMENJAJTE DOBAVITELJA ZA DOM Zamenjajte dobavitelja za dom Menjava dobavitelja še nikoli ni bila tako enostavna. Vi izpolnite obrazec, mi pa poskrbimo za vse ostalo. DOM / ZAMENJAJTE DOBAVITELJA ZA DOM Zamenjajte dobavitelja za dom Menjava dobavitelja še nikoli ni bila tako enostavna. Vi izpolnite obrazec, mi pa poskrbimo za vse ostalo. Pogosta vprašanja Katere podatke potrebujem za zamenjavo dobavitelja? Podatki, ki jih potrebujete za zamenjavo dobavitelja, so naslednji: osebni podatki podpisnika pogodbe (ime, priimek, stalno prebivališče in davčna številka), kontaktni podatki podpisnika pogodbe – telefonska številka in/ali elektronski naslov, številka in naslov merilnega mesta, osebni podatki lastnika merilnega mesta, če lastnik in podpisnik pogodbe nista isti osebi, številka transakcijskega računa, če želite vzpostaviti plačevanje preko direktne obremenitve – trajnika. Podatke najdete tudi v Pogodbi o dostopu do distribucijskega omrežja. Pred izpolnjevanjem obrazca za zamenjavo dobavitelja pripravite enega od teh dokumentov. Pri izpolnjevanju obrazca vam lahko pomagajo tudi naši prijazni svetovalci na brezplačni telefonski številki 080 1558, in sicer od ponedeljka do sobote med 8. in 20. uro. Kako hitro bo zamenjava dobavitelja urejena? Zamenjava dobavitelja je običajno urejena v nekaj dneh, najkasneje pa v 21 dneh od poslane vloge vašemu distribucijskemu operaterju (tj. lokalni elektro). Ali moram najprej prekiniti pogodbo z dosedanjim dobaviteljem? Moram ob zamenjavi obvestiti elektro ali koga drugega? Ne. Ko pošljete podpisano pogodbo nazaj na GEN-I, ste storili vse potrebno. Za vse postopke prekinitve dosedanjih pogodb v vašem imenu brezplačno poskrbimo mi. Nisem imetnik soglasja za priključitev (lastnik merilnega mesta) in bi rad zamenjal dobavitelja. Ali lahko to uredim? Da, seveda. Za zamenjavo dobavitelja preprosto izpolnite naš spletni obrazec, lastnik merilnega mesta oziroma imetnik soglasja za priključitev pa mora podpisati soglasje imetnika soglasja za priključitev in s tem poda soglasje, da soglaša z vašo uporabo merilnega mesta. Ali sem s pogodbo časovno vezan? Ne, pogodba za dobavo električne energije za gospodinjske odjemalce je brez vezave. Ali so z zamenjavo dobavitelja povezani kakšni stroški? Ne, zamenjava dobavitelja je brezplačna."
