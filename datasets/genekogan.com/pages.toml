["http://genekogan.com/works/a-book-from-the-sky"]
title = "A Book from the Sky 天书"
description = "Exploring the Latent Space of Chinese Handwriting"
full_description = '''These images were created by a deep convolutional generative adversarial network (DCGAN) trained on a database of handwritten Chinese characters, made with code by Alec Radford based on the paper by Radford, Luke Metz, and Soumith Chintala in November 2015. 這些圖像是由於 deep convolutional generative adversarial network (DCGAN) 創造的，訓練在手寫漢字的語料庫上，使用Alec Radford製作的軟件，而基於Radford，Luke Metz和Soumith Chintala2015年十一月所出版的文章。 The title is a reference to the 1988 book by Xu Bing, who composed thousands of fictitious glyphs in the style of traditional Mandarin prints of the Song and Ming dynasties. 標題是引用徐冰1988出版的《天書》。在此本，藝術家刻製兩千餘模仿宋明朝的“偽漢字”。 A DCGAN is a type of convolutional neural network which is capable of learning an abstract representation of a collection of images. It achieves this via competition between a "generator" which fabricates fake images and a "discriminator" which tries to discern if the generator's images are authentic (more details). After training, the generator can be used to convincingly generate samples reminiscent of the originals. Below, a DCGAN is trained on a labeled subset of ~1M handwritten simplified Chinese characters, after which the generator is able to produce fake images of characters not found in the original dataset. DCGAN (捲積人工神經網絡) 是一種人工神經網絡。DCGAN能分析語料庫原文的真實漢字的圖像而能製造模仿偽漢字，如下。 The generator is parameterized by a vector within a high-dimensional latent space, allowing us to peer into its imagination. By traversing this space, we can explore the generator's perception of possible characters. Rather than simply exploring the neighborhood around individual characters, we can span the latent space between characters as well. By producing samples along a straight line from one character to the next, we get an impression of imaginary characters which are interpolated from in between real ones, perhaps corresponding to semantically intermediate concepts.'''
year_published = 2025
clearnet = "http://genekogan.com/works/a-book-from-the-sky"
