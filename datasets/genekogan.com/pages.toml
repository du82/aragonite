["https://genekogan.com/works/lost-in-translation"]
title = "Lost in translation"
description = "Language translation feedback loops and their artifacts"
full_description = "Experiments with language translation loops, using the Google Translate API. The first process copied the U.S. Bill of Rights, translated it into French, then the result into Chinese, then that into Spanish, then Afrikaans, Dutch, Czech, Arabic, Japanese, and then back into English, producing an increasingly distorted version of the original. A second experiment fed the above results back to the beginning, running the process many more times over again. Iterating the fourth amendment through this feedback loop 20 times, we watch it degenerate."
