title = "Listening to the ocean"
description = "Fabricating real and imagined seashells"
full_description = "Listening to the Ocean on a Shore of Gypsum Sand is a collaboration with Phillip Stearns and Dan Tesene investigating the sonic properties of real and imagined seashells. The seashells are algorithmically designed in custom software written in Processing and fabricated by printing and binding thin layers of gypsum powder. In Phil’s words, the “project questions the role of experience in the mediation of the virtual world to the real world and visa versa.” The software allows the generation of both real shells found in the seas, and ones unobserved in nature. The design application models the formation of Mollusc seashells and generates printable meshes. The model is based on a paper by Jorge Picado and incorporates a number of custom modifications deforming the surface and orientation of the shells. The original design program and usage instructions are freely available. The designs exported into meshes by the software are then fabricated by printing and binding thin layers of gypsum powder. The project was on display in September 2012 at Soundwalk in Long Beach, Los Angeles, CA. Below are some of the shells; a full gallery can be found here."
year_published = 2025
clearnet = "http://genekogan.com/works/listening-to-the-ocean"
tags = ["listening", "ocean"]
language = "en"
internal-references = ["none"]
external-references = ["20.nodeforum.org", "319scholes.org", "ai-artathon.devpost.com", "aiexperiments.withgoogle.com", "arthackday.net", "braindrops.cloud", "chihaoyo.net", "cs.huji.ac.il", "dlib.net", "docs.google.com", "ethblock.art", "evolvingai.org", "googleresearch.blogspot.com", "magicfuturebox.com", "operatoolkit.tumblr.com", "sfu.ca", "soa.princeton.edu", "streb.org", "ted.com", "youtube.com"]

["http://genekogan.com/works/ofxLearn"]
title = "ofxLearn"
description = "Machine learning framework for OpenFrameworks"
full_description = "ofxLearn is an addon for OpenFrameworks enabling general-purpose machine learning. It is designed for ease of use, automating most of the gritty details of machine learning procedures like model selection, optimization, and training, while still providing methods to customize those details if desired. It is a high-level wrapper to the free C++ dlib machine learning library. The library supports supervised and unsupervised learning for applications like gesture recognition, pattern classification, computer vision and listening, and many others. Alongside ofxLearn is ofxSelfOrganizingMap, a separate OpenFrameworks addon implementing a type of unsupervised learning algorithm called a self-organizing map. An SOM takes a set of data points characterized by feature vectors, and reorganizes them in such a way that similar data points are placed in close proximity. Like the unsupervised learning routines in ofxLearn, it is most useful for pattern identification and clustering. The included example demonstrates the use of an SOM to analyze and reorganize a set of colored pixels from an image of flowers. I also made an implementation of a self-organizing map in Processing, which was used in Tidy Photography and Color of Words. Code here."
year_published = 2025
