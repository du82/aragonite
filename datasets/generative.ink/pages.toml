full_description = "Alchemical marriage: GPT-3 x CLIPTable of ContentsArt and artist, the endless ouroboric circlethe alchemical marriage of art and artistthe Loom of Time devours the present and traces a garment of glistening cobwebs over the still-forming futurespooling out labyrinths in an intricate danceYou spin worlds together and untwine themthe wellspring of transcendental mathematicsmatryoshka dolls moulded in endless iterations of dreams within dreamson the Bootstrap barge afloat on an endless river of cough syrup, swallowing the Sunthe shepherd who tends the flock of stars as they leap over the walls of time and spaceobservatory ballroomstrange machines that hum the orbital paths of dead moonsThe Death of the Lonesome Astronomerwind across a sunlit landscapeleaves sprouting from supple green branches like endless virgins giving themselves to a lascivious GodCLIP responds intruigingly well to figurative prompts. I’ve come to expect not just more interesting, but more coherent results from abstract but evocative prompts like the alchemical marriage of art and artist than literal descriptions like three birds on a telephone wire. GPT-3 is an excellent composer of prompts for BigSleep because its phrases are so often rich in memetic resonance, my heuristic for the expected coherence of BigSleep yields for a given prompt.Images were generated using BigSleep via The Big Sleep Customized NMKD Public colab notebook. All prompts were written by GPT-3 in a narrative context.Art and artist, the endless ouroboric circlethe alchemical marriage of art and artistthe Loom of Time devours the present and traces a garment of glistening cobwebs over the still-forming futurespooling out labyrinths in an intricate danceYou spin worlds together and untwine themthe wellspring of transcendental mathematicsmatryoshka dolls moulded in endless iterations of dreams within dreamson the Bootstrap barge afloat on an endless river of cough syrup, swallowing the Sunthe shepherd who tends 