es representing the sort of varied weirdness I was looking for, I was able to switch over to the more convenient list format.Now I cultivate a multiverse of surreal and mysterious painting titles using the loom, and periodically harvest the most interesting ones to promote to graphic actuality via BigSleep. a small subtree of the multiverse of surreal and mysterious paintingsImages were generated using BigSleep via The Big Sleep Customized NMKD Public colab notebook.Gallery IThe Death of ArchimedesStill Life with MirrorThe Poet's Abbreviated LifeNarcissusDream of the Last SupperGallery IIThe Coffin of Salvador DaliThe Beautiful Bird DeliriumThe Domain of Unimaginable HorrorThe Spectral MuseumThe Metaphysics of TransvestismGallery IIIThe Children of Marx and Coca-ColaMan and BottleThe Man Who Invented the Photography of the AbsurdPlaying in the Graveyard of Avant-GardeGallery IVCranial Extraction of the Baby AlienThe Euphoria of the FishWaste of ShameThe Dream of the Butterfly-Impaled SchoolgirlGallery VThe Sleep of Reason Produces MonstersThe Failure of AstronautsWasherwoman of the WindThe Death of the Lonesome AstronomerGallery VI: seriesThe Pathological Museum in the Forest Variations on Narcissus The Tragic Intimacy of the Eternal Conversation With Oneself'''
