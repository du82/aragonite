title = "HPMOR 32.5 :: — Moire"
description = "HPMOR 32 (original text) The bright hustle and bustle of Diagon Alley had increased by a hundredfold and redoubled as Christmas approached, with all the shops enshrouded in brilliant sorceries that flashed and sparkled as though the season&rsquo;s spirit was about to blaze out of control and turn the whole area into a cheerful holiday crater. The streets were so crowded with witches and wizards in festive and loud clothing that your eyes were assaulted almost as severely as your ears; and it was clear, from the bewildering variety of the shoppers, that Diagon Alley was considered an international attraction."
full_description = "HPMOR 32.5HPMOR 32 (original text)The bright hustle and bustle of Diagon Alley had increased by a hundredfold and redoubled as Christmas approached, with all the shops enshrouded in brilliant sorceries that flashed and sparkled as though the season’s spirit was about to blaze out of control and turn the whole area into a cheerful holiday crater. The streets were so crowded with witches and wizards in festive and loud clothing that your eyes were assaulted almost as severely as your ears; and it was clear, from the bewildering variety of the shoppers, that Diagon Alley was considered an international attraction. There were witches wrapped in giant swathes of cloth like toweled mummies, and wizards in formal top hats and bath-robes, and young children barely past toddling age who were decorated with lights that blazed almost as bright as the shops themselves, as their parents took them hand in hand through that magic wonderland and let them shriek to their heart’s content. It was the season to be merry.And in the midst of all that light and cheer, a note of blackest night; a cold, dark atmosphere that cleared a few precious paces of distance even in the midst of all that crush.“No,” said Professor Quirrell, with a look of grim revulsion, like he’d just bitten into food that not only tasted horrible but was morally repugnant to boot. It was the sort of grim face an ordinary person might make after biting into a meat pie, and discovering that it was rotten and had been made from kittens.“Oh, come on,” Harry said. “You must have some ideas.”“Mr. Potter,” Professor Quirrell said, his lips set in a thin line, “I agreed to act as your adult guardian on this expedition. I did not agree to advise you on your choice of presents. I don’t do Christmas, Mr. Potter.”“How about Newtonmas?” Harry said brightly. “Isaac Newton actually was born on December 25th, unlike some other historical figures I could name.”This failed to impress Professor Quirrell.“Look,” said Harry, “I’m sorry, but I’ve got to do something special for Fred and George and I’ve got no idea of my options.”Professor Quirrell made a thoughtful humming sound. “You could ask which family members they most dislike, and then hire an assassin. I know someone from a certain government-in-exile who is quite competent, and he would give you a discount on multiple Weasleys.”“This Christmas,” Harry said, dropping his voice into a lower register, “give your friends the gift… of death.”That made Professor Quirrell smile. It went all the way to his eyes.“Well,” said Harry, “at least you didn’t suggest getting them a pet rat -” Harry’s mouth snapped shut, and he was regretting the words almost as soon as they were out of his mouth.“Pardon me?” said Professor Quirrell.“Nothing,” Harry said at once, “long dumb story.” And telling it seemed wrong somehow, maybe because Harry was afraid Professor Quirrell would have laughed even if Bill Weasley hadn’t been cured and everything put back to right…And where had Professor Quirrell been that he’d never heard the story? Harry had gotten the impression that everyone in magical Britain knew.“Look,” said Harry, “I’m trying to solidify their loyalty to me, you know? Make the Weasley twins my minions? Like the old saying goes: A friend isn’t someone you use once and then throw away, a friend is someone you use over and over again. Fred and George are two of the most useful friends I have in Hogwarts, Professor Quirrell, and I plan to use them over and over again. So if you’d help me be Slytherin here, and suggest something they might be very grateful for…” Harry’s voice trailed off invitingly.You just had to pitch these things the right way.They walked on for a good way before Professor Quirrell spoke again, his voice practically dripping with distaste. “The Weasley twins are using secondhand wands, Mr. Potter. They would be reminded of your generosity with every Charm they cast.”Harry clapped his hands together in involuntary excitement. Just put the money on account at Ollivander’s, and tell Mr. Ollivander to never refund it - no, better yet, to send it to Lucius Malfoy if the Weasley twins didn’t show up before the start of their next school year. “That’s brilliant, Professor!”Professor Quirrell did not look like he appreciated the compliment. “I suppose I can tolerate Christmas in that spirit, Mr. Potter, though only barely.” Then he smiled slightly. “Of course that will cost you fourteen Galleons, and you only have five.”“Five Galleons,” Harry said, with a sniff of outrage. “Just who does the Headmaster think he’s dealing with, anyway?”“I think,” said Professor Quirrell, “that it simply did not occur to him to fear the consequences if you turned your ingenuity to the task of obtaining funds. Though you were wise to lose, rather than making it an explicit threat. Out of curiosity, Mr. Potter, what would you have done if I hadn’t turned away in boredom while you, in a fit of childish pique, counted out five Galleons worth of Knuts?”“Well, the easiest way would’ve been to borrow money from Draco Malfoy,” said Harry.Professor Quirrell chuckled briefly. “Seriously, Mr. Potter.”Duly noted. “Probably I’d have done a few celebrity appearances. I wouldn’t resort to anything economically disruptive just for spending money.” Harry had checked, and he would be allowed to keep the Time-Turner while he went home for the holidays, so that his sleep cycle didn’t start to rotate. But then it was also possible that someone kept an eye out for magical day traders. The gold and silver trick would’ve taken work on the Muggle end, and seed funding, and the goblins might’ve gotten suspicious after the first cycle. And starting a real bank would be a lot of work… Harry hadn’t quite worked out any money-making methods that were fast and certain and safe, so he’d been very glad when Professor Quirrell had turned out to be so easily fooled.“I do hope those five Galleons will be enough to last, since you counted them so carefully,” said Professor Quirrell. “I doubt the Headmaster shall be so eager to entrust me with your vault key a second time, once he discovers I’ve been tricked.”“I’m sure you did your best,” Harry said with deep gratitude.“Do you need any assistance finding a safe place to store all those Knuts, Mr. Potter?”“Well, sort of,” said Harry. “Do you know of any good investment opportunities, Professor Quirrell?”And the two of them walked on, in their tiny sphere of silence and isolation, through the brilliant and bustling crowds; and if you looked carefully, you would see that where they went, leafy boughs faded, and flowers withered, and children’s toys that played cheerful bells changed to lower and more ominous notes.Harry did notice, but he didn’t say anything, just smiled a little to himself.Professor Quirrell didn’t seem to notice at all. He was telling Harry about the structure of Gringotts, and how interesting it was that such a thing should even be possible - “If you can believe it, Mr. Potter, there was once a time when it would have been called a form of the Dark Arts” - the security measures and the interlocks, the safeguards and counter-safeguards, the means by which the system resisted and extinguished attempts to subvert its intents…And Harry’s mind was flickering over the problem, idly, considering the formidable chains of protection, and the many ways in which you could untangle them, but none of those ways required investing money, or at least not money of your own…So Harry was thinking of other things entirely when Professor Quirrell said, in a very low voice, without moving his lips, “This is the place. Move absolutely nothing and say nothing. If questioned, do not deviate from the truth at all, but give the most minimal possible answers. If ordered to leave this place, leave this place. Is that perfectly clear?”“Yes, Professor,” Harry said, just as silently.“The display window is enchanted to make people walk past without seeing it,” said Professor Quirrell. “We shall go in together, and then I shall leave and rejoin you when you come out.”“Where am I supposed to go, Professor?”“To the back of the store, Mr. Potter, where you will do your best to seem to be paying the most studious attention to the Mirror of Erised.”“I’m not really sure what that is, Professor.”“You will know it when you see it. And you will see it whether or not you are looking for it. And do not, under any circumstances, touch the mirror.”“Why?”“Because it belongs to this proprietor,” said Professor Quirrell, “and she is far more dangerous than I.”And with that, Professor Quirrell opened the cracked door of the shrunken little shop, and led the way in.Harry followed duly behind, and saw, with a shiver of apprehension, that the display window which was apparently charmed so that people passed by thinking they saw nothing, was filled with silver rats, scampering upon thorny beds of rose petals, surrounded by piles of gleaming Knuts. The shop’s name, in crimson letters upon the door, was Marge’s Magnificent Magical Menageries.Harry could feel magic saturating this place, filling the very air and walls. The magic here, the feeling was like….The feeling was that the enchantments had been laid down over a much longer space of time than any wizard could remember, had gone winding their way through time and history, rather than just space. As if (it seemed suddenly to Harry) something had waited for centuries in a space smaller than the span from one heartbeat to the next, its age scarcely covering the time to think one thought….Unspoken thought vocalized, Professor Quirrell said, “You have an exceptional instinct for the meaning of magical places, Mr. Potter. Try not to show it in front of the proprietor.”Harry had been staring at the silver rats and thorny rosebushes within the display window. Now, at those words, he turned his head to look at Marge’s Magnificent Magical Menageries' brightly lit interior, and experienced a sudden dizzying feeling as if he were standing at the bottom of a deep funnel pointing up, some great shaft with no walls but only a towering interior space that had no direction or horizon, which led nowhere and everywhere, vanished before reaching a ceiling or a bottom: a floating place where every illusion"
