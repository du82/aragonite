title = "Language models are 0-shot interpreters :: — Moire"
description = """
! Correction: The logprobs returned by the OpenAI API use natural log, not base 10, so all occurences of decibels / dB in this post should actually say nats. I&rsquo;ll either make that substitution at some point or convert everything to actual decibels.
