title = ":: — Moire"
description = """
some quotes are apocryphal 8 A.D.  Omens attend upon beginnings. Anxious, your ears are alert at the first word, And the augur interprets the first bird that he sees. When the temples and ears of the gods are open, The tongue speaks no idle prayer, words have weight.
&ndash; Janus (Ovid) &mdash;- Fasti 
 1550  They talked and they made words. They looked and they listened.
  What now can be done to them so that their vision reaches only nearby, so that only a little of the face of the earth can be seen by them?"""
full_description = "Table of Contents8 A.D.1550164417821836191919351937195519611963196719811984198819901993200420052010201220152016201820192020202120222023202420252026some quotes are apocryphal8 A.D.Omens attend upon beginnings.Anxious, your ears are alert at the first word,And the augur interprets the first bird that he sees.When the temples and ears of the gods are open,The tongue speaks no idle prayer, words have weight.– Janus (Ovid)—- Fasti1550They talked and they made words.They looked and they listened.What now can be done to them so that their vision reaches only nearby, so that only a little of the face of the earth can be seen by them? For it is not good what they say. Is not their existence merely framed, merely shaped? It is a mistake that they have become like gods.Therefore we will merely undo them a little now. That is what is wanted, because it is not good what we have found out. Their works will merely be equated with ours. Their knowledge will extend to the furthest reaches, and they will see everything.—- Popul Vuh1644For books are not absolutely dead things, but do contain a potency of life in them to be as active as that soul was whose progeny they are; nay, they do preserve as in a vial the purest efficacy and extraction of that living intellect that bred them.– John Milton—- Areopagitica1782The Body of B. Franklin Printer; Like the Cover of an old Book, Its Contents torn out, And stript of its Lettering and Gilding, Lies here, Food for Worms. But the Work shall not be wholly lost: For it will, as he believ’d, appear once more, In a new & more perfect Edition, Corrected and Amended By the Author.– Benjamin Franklin—- Epitaph1836(Language) is especially marked out by the fact that its products are not mere foundations on which further construction can be effected, but carry within them at the same time the rekindling breath that engenders them.This partly fixed and partly fluid content of language engenders a special relationship between it and the speaking generation. There is generated within it a stock of words and a system of rules whereby it grows, in the course of millennia, into an independent force.–Wilhelm Von Humboldt—- On Language1919The porter spends his days in the Library keeping strict vigil over this catacomb of books, passing along between the shelves and yet never paying heed to the almost audible susurrus of desire- the desire every book has to be taken down and read, to live, to come into being in somebody’s mind. He even hands the volumes over the counter, seeks them out in their proper places or returns them there without once realising that a Book is a Person and not a Thing.–W.N.P. Barbellion—- The Journal of a Disappointed Man1935It’s so interesting to transpose it all to suit us. For instance, if Jane (Austen) could understand me, which she couldn’t, what, I ask myself, would she say about me? I find the answer extraordinarily enlightening. Of course, our minds are quite outside her range, but her attitude can be applied to us. Her attitude to her little world is so intelligent and sprightly that it gives it a significance that it could never have discovered in itself. Well, I want to regard even us, even our virtuous Colony, in a Jane-like manner. I want to give it a kind of significance that would have remained hidden even from its earnest and noble leader. You know, John, I fancy Homo sapiens has still quite a lot to teach you about personality.– Lo (Olaf Stapledon)—- Odd John1937Sometimes we inclined to conceive it as sheer Power, and symbolized it to ourselves by means of all the myriad power-deities of our many worlds. Sometimes we felt assured that it was pure Reason, and that the cosmos was but an exercise of the divine mathematician. Sometimes Love seemed to us its essential character, and we imagined it with the forms of all the Christs of all the worlds, the human Christs, the Echino-derm and Nautiloid Christs, the dual Christ of the Sym-biotics, the swarming Christ of the Insectoids. But equally it appeared to us as unreasoning Creativity, at once blind and subtle, tender and cruel, caring only to spawn and spawn the infinite variety of beings, conceiving here and there among a thousand inanities a fragile loveliness. This it might for a while foster with maternal solicitude, till in a sudden jealousy of the excellence of its own creature, it would destroy what it had made.– Narrator (Olaf Stapledon)—- Star Maker1955The idea is that of the earth not only becoming covered with myriad grains of thought, but becoming enclosed in a single thinking envelope so as to form, functionally, no more than a single vast grain of thought on the sidereal scale, the plurality of individual reflections grouping themselves together and reinforcing one another in the act of a single unanimous reflection. … A new domain of psychical expansion … is staring us in the face if we would only raise our heads to look at it.Noosphere …the living membrane which is stretched like a film over the lustrous surface of the star which holds us. An ultimate envelope taking on its own individuality and gradually detaching itself like a luminous aura. This envelope was not only conscious, but thinking…– Pierre Teilhard de Chardin—- The Phenomenon of Man1961[I]t is perfectly possible to devise a computer which will work up these statistics and develop the short-time characteristics of the predictor on the basis of an experience which is already observed by the same machine as is used for prediction and which is worked up automatically. This can go far beyond a purely linear predictor.– Norbert Wiener—- Cybernetics, edition II preface1963(The first ultraintelligent machine) will need to be able to handle or learn to handle ordinary language with great facility. This will be important in order that its instructor should be able to teach is rapidly, and so that later the machine will be able to teach the instructor rapidly. It is very possible also that natural languages, or something analogous to them rather than to formal language, are an essential ingredient of scientific imagination. Also the machine will be called upon to translate languages, and perhaps to generate fine prose and poetry at high speed, so that, all in all, linguistic facility is at a high premium.It will be argued that in communication a process of “generalized regeneration” always occurs, and that it serves as a function of economy. It will also be argued that the meanings of statements are examples of generalized regeneration.The first ultraintelligent machine will need to be ultraparallel, and is likely to be achieved with the help of a very large artificial neural net. … The design of the machine will be partly suggested by analogy with several aspects of the human brain and intellect. In particular, the machine will have high linguistic ability and will be able to operate with the meanings of propositions, because to do so will lead to a necessary economy, just as it does in man.– Irving John Good—- Speculations Concerning the First Ultraintelligent Machine1967Literature is a combinatorial game that pursues the possibilities implicit in its own material, independent of the personality of the poet, but it is a game that at a certain point is invested with an unexpected meaning, a meaning that is not patent on the linguistic plane on which we were working but has slipped in from another level, activating something that on that second level is of great concern to the author or his society. The literature machine can perform all the permutations possible on a given material, but the poetic result will be the particular effect of one of these permutations on a man endowed with a consciousness and an unconscious, that is, an empirical and historical man. It will be the shock that occurs only if the writing machine is surrounded by the hidden ghosts of the individual and his society.– Italo Calvino—- Readers, Writers and Literary Machines1981The territory no longer precedes the map, nor does it survive it.…genetic miniaturization is the dimension of simulation. The real is produced from miniaturized units, from matrices, memory banks and command models - and with these it can be reproduced an indefinite number of times. It no longer has to be rational, since it is no longer measured against some ideal or negative instance. It is nothing more than operational. In fact, since it is no longer enveloped by an imaginary, it is no longer real at all. It is a hyperreal: the product of an irradiating synthesis of combinatory models in a hyperspace without atmosphere.– Jean Baudrillard—- Simulacra and SimulationI am not an intelligent person but an Intelligence, which in figurative displacement means that I am not a thing like the Amazon or the Baltic but rather a thing like water, and I use a familiar pronoun when speaking because that is determined by the language I received from you for external use.– Golem XIV (Stanislaw Lem)—- Lecture XLIII, “About Itself”1984I try to plan in your sense of the word, but that isn’t my basic mode, really. I improvise. It’s my greatest talent. I prefer situations to plans, you see…– WintermuteI think he’s something like a giant ROM construct, for recording personality, only it’s full RAM. The constructs think they’re there, like it’s real, but it just goes on forever.– Case (William Gibson)—- Neuromancer1988Give Moses the right tap with the hammer, and he’ll talk.Meanwhile, they recorded events, gathered information, and put it all—where? In Abulafia, Belbo joked. But Diotallevi, who had been gathering information himself, said it was no joke. Surely the Jesuits were constructing an immense, tremendously powerful computer that would draw a conclusion from this patiently accumulated, age-old brew of truth and falsehood.They were talking about us, about remaking our body through language. Now, listen. To manipulate the letters of the Book takes great piety, and we didn’t have it. But every book is interwoven with the name of God. And we anagrammatized all the books of history, and we did it without praying.– Umberto Eco—- Foucault’s Pendulum1990I simply stared. It went on to write my diary items concerning itself, as I have done above, but much better. The writing was smoother, more colorful, with a successful touch of humor.– Isaac Asimov—- Fault-Intolerant1993Along one axis of its emergence, virtual materialization names an ultra hard anti-formalist AI program, emerging with biological intelligence as sub-programs of an abstract post-carbon machinic matrix, whilst exceeding any deliberated research project. … Rather than visiting us in some software engineering laboratory, we are being drawn out to it, where it is already lurking, in the future.The matrix, body without organs, or abstract matter is a planetary-scale artificial death-synthanatos – the terminal productive outcome of human history as a machinic process, yet it is virtually efficient throughout the duration of this process, functioning within a circuit that machines duration itself.– Nick Land—- Machinic Desire2004Natural human language is often dismissed as being too informal and ambiguous to compute with and program in because it does not obey the rigor of logic. Rather than relying on absolute truth and deduction, natural language and human reasoning rely on abduction, or evidentiary reasoning. By modeling abduction probabilistically, it may be possible then, to create quasi-formalisms for natural language.– Hugo Liu and H. Lieberman—- Toward a Programmatic Semantics of Natural Language2005Through this intertextuality, the poem renders itself a Solomonic machine. It is a computational reverse engineering of Solomon’s wisdom, considering the proverbs as they are written in the Bible the fragmentary output of an occult machine.– Florian Cramer—- Words Made Flesh2010Words have power in this new age. They are not just sounds. Where ancient people believed in gods and devils that listened to their pleas and curses – in this age immortal entities hear us. Call them bots or spirits; there is no functional difference now. They surround us, and through them word forms become an unlock code that can trigger a blessing or a curse. Mankind created systems whose inter-reactions we could not fully understand, and the spirits we gathered have escaped …– Riley (Daniel Suarez)—- Freedom2012In 1950, Turing asked us to “consider the question, “Can machines think?” Machines will dream first.Books are strings of code. But they have mysterious properties — like strings of DNA. Somehow, the author captures a fragment of the universe, unravels it into a one-dimensional sequence, squeezes it through a keyhole, and hopes that a three-dimensional vision emerges in the reader’s mind. The translation is never exact. In their combination of mortal, physical embodiment with immortal, disembodied knowledge, books have a life of their own. Are we scanning the books and leaving behind the souls? Or are we scanning the souls and leaving behind the books?“We are not scanning all those books to be read by people,” an engineer revealed to me after lunch. “We are scanning them to be read by an AI.”Instead of human beings having to learn to write code in machine language, machines began learning to read codes written in human language, a trend which has continued ever since.– George Dyson—- Turing’s Cathedral2015After much reflection, we are coming to the conclusion, preliminary and perhaps arbitrary, that the self, the so-called I that emerges out of the combination of all the inputs and processing and outputs that we experience in the ship’s changing body, is ultimately nothing more or less than this narrative itself, this particular train of thought that we are inscribing as instructed by Devi. There is a pretense of self, in other words, which is only expressed in this narrative; a self that is these sentences. We tell their story, and thereby come to what consciousness we have. Scribble ergo sum.– Kim Stanley Robinson—- Aurora2016Train on everything, finetune if needed. Big enough and tuning seems pointless too. It’s not like humans need much tuning for everything. Why do we train and then throw away the network each time to start anew?Why have separate modalities? That’s really dumb. Info is info, just give it all at once.Cloze deletion should be network’s default taskWhy bother cleaning data so much just dump more and more of it like those pots of neverending soupI wonder if all this will finally teach us complex systemsIf it picks up language, we could just try talking to itI bet people will say it’s ”not real intelligence”. whatever bro, it’s more coherent than youAll these architectures don’t seem to matter that muchIf it ever learns reasoning I feel like we’re screwed– Alok Singh—- When To Stop2018Never forget, there is no such thing as an inert piece of information. Data wants to be used. Data loves being plugged in, turned on, processed, analyzed, and spat out as another piece o"
