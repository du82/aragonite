full_description = "Language models are 0-shot interpretersTable of ContentsOverview0-shot, few-shot, and meta-learning0-shot can outperform few-shotMeasuring prompt helpfulnessDecibels of evidenceTranslation task 1: English -> RoishTranslation task 2: French -> EnglishCounterexample - accuracy decreases with # shotsPredictions! Correction: The logprobs returned by the OpenAI API use natural log, not base 10, so all occurences of decibels / dB in this post should actually say nats. I’ll either make that substitution at some point or convert everything to actual decibels.OverviewI present evidence that the efficacy of 0-shot prompts for GPT-3 has been underestimated, and that more powerful models are more effective at deriving information from 0-shot prompts, while less powerful models have greater need for examples on equivalent tasks. From this evidence, I extrapolate three principal claims:Few-shot prompts are not always an efficient or necessary means of task specification for GPT-3. Sometimes, more examples in the prompt makes accuracy strictly worse.For some tasks, such as translation between well-known languages and list sorting, GPT-3 is a 0-shot interpreter - a short task description or signifier suffices to invoke its full capabilities.0-shot performance scales with model size more drastically than few-shot performance, suggesting that 0-shot task specification will become a more important prompting strategy as language models increase in capability.The diversity of tasks the model is able to perform in a zero-shot setting suggests that high-capacity models trained to maximize the likelihood of a sufficiently varied text corpus begin to learn how to perform a surprising amount of tasks without the need for explicit supervision.– [Language Models are Unsupervised Multitask Learners]0-shot, few-shot, and meta-learningThe GPT-2 paper, entitled Language Models are Unsupervised Multitask Learners, proposes that unsupervised language models are capable of learning a wide range of benchmark tasks, despite not having trained on datasets specific to those tasks. The evidence takes the form of GPT-2, trained only on the WebText natural language corpus, demonstrating “promising, competitive, and state of the art” results on a wide range of tasks in a “zero-shot setting.” “Zero-shot” here means merely “without any parameter or architecture modification,” encompassing what we’d now call few-shot prompts which contain examples of solved tasks. Previous approaches relied on supervised fine-tuning, either purely or following pre-training, so this was a novel result.Table 1 in the paper illustrates how it is possible for a model trained on a diverse “language in the wild” dataset to learn specific tasks like translation by showing examples of translations embedded in WebText:”I’m not the cleverest man in the world, but like they say in French: Je ne suis pas un imbecile [I’m not a fool].In a now-deleted post from Aug. 16, Soheil Eid, Tory candidate in the riding of Joliette, wrote in French: ”Mentez mentez, il en restera toujours quelque chose,” which translates as, ”Lie lie and something will always remain.”“I hate the word ‘perfume,”’ Burr says. ‘It’s somewhat better in French: ‘parfum.’If listened carefully at 29:55, a conversation can be heard between two guys in French: “-Comment on fait pour aller de l’autre coté? -Quel autre coté?”, which means “- How do you get to the other side? - What side?”.If this sounds like a bit of a stretch, consider this ques- tion in French: As-tu aller au cinéma?, or Did you go to the movies?, which literally translates as Have-you to go to movies/theater?“Brevet Sans Garantie Du Gouvernement”, translated to English: “Patented without government warranty”.A model learning to predict WebText has to learn, among many other things, how to predict translations as they might occur in natural contexts.To measure GPT-2’s translation ability, few-shot prompts were used:In order to help it infer that this is the desired task, we condition the language model on a context of example pairs of the format english sentence = french sentence and then after a final prompt of english sentence = we sample from the model with greedy decoding and use the first generated sentence as the translation.Emphasis mine. The authors do not distinguish between 0-shot and (what is now called) few-shot, mentioning the priming examples only offhand, in the same sentence asserting that priming serves to communicate the desired task to GPT-2. There is no suggestion that GPT-2’s ability to translate is informed by the information contained in the examples beyond the recognition that they are examples of translation.One year later, language has evolved: The GPT-3 paper, Language Models are Few-Shot Learners, does distinguish between prompts that contain examples (n-shot for n examples) and which contain only a task description (0-shot). Where before anything that wasn’t fine-tuning went into the bucket of “0-shot,” now there is an ontology that puts the number of examples in the prompt on center stage. This new ontology culminates in a title whose implication is surprising in light of the previous paper’s casual comment on the function of priming examples: Language models are few-shot learners.The type of learning referred to in the title, “meta-learning,” does not necessarily imply that the task is literally learned from the examples, only that the examples help for some reason. According to a footnote,These terms are intended to remain agnostic on the question of whether the model learns new tasks from scratch at inference time or simply recognizes patterns seen during training – this is an important issue which we discuss later in the paper, but “meta-learning” is intended to encompass both possibilities, and simply describes the inner-outer loop structure.The later discussion is not very extensive, mostly just acknowledging the ambiguity inherent to few-shot:A limitation, or at least uncertainty, associated with few-shot learning in GPT-3 is ambiguity about whether few-shot learning actually learns new tasks “from scratch” at inference time, or if it simply recognizes and identifies tasks that it has learned during training. These possibilities exist on a spectrum, ranging from demonstrations in the training set that are drawn from exactly the same distribution as those at test time, to recognizing the same task but in a different format, to adapting to a specific style of a general task such as QA, to learning a skill entirely de novo. (…) (U)nderstanding precisely how few-shot learning works is an important unexplored direction for future research.This is the uncertainty that I will investigate in this blog post, expanding on the results published in Prompt Programming for Large Language Models: Beyond the Few-Shot Paradigm.My purpose is also to challenge the ontology introduced by Language Models are Few-Shot Learners. Although the authors are careful to remain agnostic as to the mechanism of few-shot/meta-learning, what we have found by probing the mechanism suggests that an alternative framework which emphasizes the means by which a task is communicated may be more salient in some contexts.The emphasis on few-shot given by OpenAI’s paper has influenced subsequent research about GPT-3, some of which has focused on optimizing few-shot prompts. I suspect that this is a contingent rather than convergent history: that if OpenAI had taken a different angle (and with GPT-3, the set of possible angles to choose from seems inexhaustible), current research on prompts would likewise look different.It’s strange to call it the few-shot paradigm when the idea of few-shot was invented less than a year ago, but perhaps we’re moving into a phase in which paradigms are measured in months. Really, though, the paradigm I want to shift out of is that of supervised learning. Few-shot prompting resembles fine-tuning in that it seeks to coerce an unsupervised language model into performing closed-ended tasks using unstructured lists of solved examples. Self-supervised natural language models are amenable to many strategies for communicating and instructing tasks, including but not limited to demonstrations.0-shot can outperform few-shotLooking at the results presented in the GPT-3 paper, however, the focus on few-shot and meta-learning seems justified. If one thing trend is clear in the data, it’s this: monotonic improvement with number of shots. On basically every variation of every task and for all model sizes, 1-shot does better than 0-shot, and many-shot does better than 1-shot.For instance, here is the page of graphs of all the results of translation tasks: Blue is 0-shot, green 1-shot, orange 64-shot. X axis is model size, Y axis is BLEU scoreSome of the 0-shot lines are jagged, with non-monotonic accuracy with regard to model size, which is pretty odd. However, accuracy consistently improves as the number of shots increases from 0 to 1 and then 64.When we investigated the French -> English translation more closely, we found some interesting results, which I’ll walk through here. First, here are the results presented in OpenAI’s paper:French -> English translation Multi-BLEU scoresPrompt2.7B6.7B13B175BOpenAI 0-shot21.215.522.421.9OpenAI 1-shot20.031.631.435.6OpenAI 64-shot 35.1 36.4 38.3 41.4Here are the prompt formats that OpenAI used for the French to English translation task:OpenAI 0-shot promptTranslate French to English {french phrase} = OpenAI n-shot promptTranslate French to English {french phrase} = {english phrase} {french phrase} = {english phrase} ... {french phrase} = As we were attempting to replicate these results, we noticed that when the model was failing on the 0-shot prompt, the failures were often of catastrophic nature: the task was not attempted at all, e.g. the model would output a newline, or another (or the same) French phrase instead of an attempt at an English translation.BLEU assigns a score from 0 to 1 to the accuracy of a translation, and would assign a score close to 0 to a catastrophic failure. The scores reported in the paper, however, are averaged over a large dataset, so the same score could hypothetically correspond to uniformly flawed attempts or a mix of perfect attempts and catastrophic failures.It seemed possible that 0-shot prompts were much less reliable at getting the models to attempt the translation task, but result in equivalent accuracy in the event that they did attempt it.To investigate this possibility, we ran the benchmarks using an alternative 0-shot prompt which contains no additional instructions, but whose format better resembles how a translation might be embedded in a natural language corpus:Simple colon promptTranslate French to English French: {french phrase} English: These were the results we got:PromptBabbageCurieReproduced OpenAI 0-shot15.918.7Reproduced OpenAI 1-shot21.824.1Reproduced OpenAI 10-shot 25.127.9Simple colon 0-shot23.533.3Simple colon 1-shot18.027.6Simple colon 10-shot24.133.4Note: It is unknown what model sizes the models on the OpenAI API (ada, babbage, curie, and davinci) correspond to. We were not able to fit 64 examples in the API input window, so used 10-shot prompts instead.A couple of surprising observations:Simple colon 0-shot is very effective, especially on Curie, where it outperforms everything except Simple colon 10-shot, whose performance it matches.Simple colon 1-shot is worse than 0-shot on both Babbage and Curie.The simple colon format does not exhibit monotonicity with number of shots. Having one example actually made accuracy worse. How could that be? Here’s my hypothesis about what is going on:All sizes of GPT-3 already know how to translate to some extent, and translation is way too hard a task to learn “de novo” from a prompt containing only a few examples. So, as the GPT-2 paper said, the examples serve to help it infer that translation is the desired task. A prompt may be more or less effective at specifying the task; generally, the more examples there are, the more “clear” it is, but a good zero-shot prompt may be worth many examples. On the other hand, if the zero-shot prompt is unclear, then adding more examples will improve accuracy, since the baseline was so poor. The zero-shot prompt could be arbitrarily unhelpful, and an example is better than nothing.A low number of examples can be more confounding than no examples. We noticed that sometimes the model would respond to one-shot prompts as if the semantic content of the example translation was relevant to the new translation. Without multiple examples, it’s less clear that the translation instances are meant to be parallel and independent. I have written about the bugs that affect few-shot prompting here.How much of the apparent consistent monotonic improvement in performance on tasks relative to number of shots in OpenAI’s results can be attributed to an unhelpful zero-shot prompt? Much more extensive testing is needed to say, but I suspect that this is the case for most of the translation tasks, at least.It’s very expensive in API credits to run these translation benchmarks, so we haven’t run any more yet. However, there are also less expensive methods to explore the way that of few- and 0-shot prompts contribute to task accuracy. In the next section of this post, I’ll subject this translation benchmark to a different method of analysis.Measuring prompt helpfulnessThe method I’m going to use in this section monitors the conditional probability of GPT-3 giving a correct answer as the prompt is altered.GPT-3 allows us to measure the probability that it outputs any verbatim sequence given any prompt by multiplying the probability (or adding the logprobs) that it outputs the first token given the prompt, and then the second given the prompt and the first, etc (here’s code to do it).Compared to greedy sampling (temperature 0), which is typically used for benchmarks, this method doesn’t rely on everything going right at each point in the sequence to give a nonzero score - if the first token is likely to be wrong, but the rest of the answer is likely to be correct given that the first token is correct1, this is reflected as a likelihood penalty instead of a total failure. Compared to stochastic sampling (temperature > 0), this method does not require multiple rollouts.Compared to BLEU scores, this method only measures the probability of one verbatim “correct” answer. If this method is used to gauge a more general property, like the helpfulness of a prompt, it’s important to keep in mind that it relies on the probability of the verbatim correct answer being a good proxy for accuracy in general. In the same way, it also relies on the specific content of the prompt being a good proxy for the more general property of prompts you are measuring, such as number of shots2.The absolute conditional probability of the right answer is influenced by various factors, such as how long the sequence is (the longer it i"
