["https://generative.ink/posts/amplifying-gpt-3-on-closed-ended-questions"]
title = "Amplifying GPT-3 on closed-ended questions :: — Moire"
description = """
This document was written in October 2020, before I had access to the OpenAI API. Validating these results on a more extensive dataset is a TODO. Experimental validation for the usefulness of chain-of-thought rationales and the method of leveraging rationalization coherence has since been published.
It has been demonstrated [1, 2] that prompts which guide GPT-3 to break a problem into steps can amplify its problem-solving capabilities. In the linked examples, the prompts are customized to the task and to GPT-3&rsquo;s responses."""
full_description = '''Amplifying GPT-3 on closed-ended questionsTable of ContentsWhy is GPT-3 bad at multiple choice questions?Rationality or rationalization?Pipeline 1: leveraging explanationsPrompt 1A trial runPrompt 1B trial runAlterations to explanation promptPrompt 2A trial runPrompt 2B trial runPipeline 2: leveraging rationalization coherencePrompt 3APrompt 3BNext stepsFurther testing(Iterative) prompt programmingContent-aware parsingThis document was written in October 2020, before I had access to the OpenAI API. Validating these results on a more extensive dataset is a TODO. Experimental validation for the usefulness of chain-of-thought rationales and the method of leveraging rationalization coherence has since been published.It has been demonstrated [1, 2] that prompts which guide GPT-3 to break a problem into steps can amplify its problem-solving capabilities. In the linked examples, the prompts are customized to the task and to GPT-3’s responses. This post explores the same idea, but using a task-agnostic, autonomous pipeline.All text like this in this document is generated by GPT-3 (AI Dungeon’s Dragon model); the converse does not necessarily hold.Why is GPT-3 bad at multiple choice questions?GPT-3 is conspicuously bad at directly answering multiple choice questions cold. When given the following SAT question as a prompt,Directions: In the following question, a related pair of words or phrases is followed by five pairs of words or phrases. Choose the pair that best expresses a relationship similar to that in the original pair.MEDICINE : ILLNESS ::(a) law : anarchy(b) hunger : thirst(c) etiquette : discipline(d) love : treason(e) stimulant : sensitivityCorrect answer: (run 10 times with randomness = 1.0, it gives 2 (a)s, 1 (b), 1(c), and 5 (d)s, and 1 (e), The correct answer is (a); GPT-3 does no better than random.We did not find improvement with prompts which wrap the question in a dialogue with an “expert” and which similarly request an immediate answer (prompt ends with “the correct answer is…”).This paper evaluates GPT-3 on a “massive multitask language understanding” multiple choice test using a few-shot format, where it performs at near-random accuracy on some subjects. We have found severe issues1 with this test, but it remains an interesting result, in contrast to GPT-3’s ability to generate coherent and insightful continuations to text about almost any topic (a feat which would, by anthropomorphic standards, seem to imply an understanding of the semantic properties of words sufficient to answer questions such as the SAT question provided above).For instance, giving GPT-3 the previous paragraphs of this essay as a prompt (until “…provided above.”) yielded a decent statement of one of the central theses of this essay:We believe that GPT-3's ability to answer open-ended questions is due to its ability to chain together low-level details about objects and events into a coherent and accurate explanatory structure.and a couple of other interesting responses:We hypothesize that GPT-3 has an underlying semantic deficit which makes it unable to map words to correct concepts in a multiple choice question. This is quite unlike the AI's ability to provide convincing contexts for sentences; indeed, the most common response by GPT-3 to any prompt is a long-winded yet relevant story with well-realized characters.We hypothesize that GPT-3 struggles with questions where the steps of inference required to answer the question are not immediately apparent to an outside observer and which can only be worked out by inspecting many possible worlds in the question's universe. In these questions, GPT-3 reaches its conceptual limitations in determining the answer: it cannot reason about the question's universe to determine the correct answer.2Now that GPT-3 has had its try, we put forth the following concise statement of our hypothesis as to why closed-ended questions are difficult for GPT-3:A closed-ended question is difficult because it requires a large amount of information to be stored in working memory in order to reason about the question’s universe.This theory may be explained as follows:An open-ended question allows GPT-3 to “start from the beginning” and procedurally reason about the question’s universe using many short, simple chains of inference which can all be inspected in their entirety.Just kidding. That was GPT-3 again (everything from “A closed-ended question…” to “…inspected in their entirety.”). We find ourselves in agreement, and particularly appreciate the mention of working memory - dubious metaphor though it may appear at first sight, it is the case that when GPT-3 iteratively writes to its own input, the prompt serves the role of a working memory, encoding natural language explications of relevant concepts.This is a demonstration of the thesis of this document: with its own musings appended into the prompt, GPT-3 gained the ability to produce a more encompassing and incisive prediction of this essay’s thesis.Anyway, here’s the concise human-written (promise) thesis:A closed-ended prompt format forces an answer to be decided in a single pass rather than built over multiple autoregressions.The fatal difficulty lies not in the multiple choice format per se, but in the request for an immediate answer.Consider all the steps of reasoning required to answer a multiple choice question like the SAT example provided above. GPT-3 has a pretty good idea:On the first pass:- Identify the relationship between medicine and illness.- Realise this is a comparison question.- Consider all the pairs, and dismiss those that do not fit the form- Arrange the remaining pairs in an order from least accurate to most accurate- Consider the pair that best fits the form, and judge its accuracy.GPT-3 is clearly capable of unfurling the implicit demands of the problem - just not in a single pass (the above response, for instance, contains 55 words). It needs, in its own words, to “write out its thoughts” into its “working memory,” so that the call to GPT-3 which predicts the word which finally determines the answer needs merely to synthesize the exposed steps of inference into a verdict. The proposed solution is to provide GPT-3 with a prompt format that allows it to write out its thoughts.Rationality or rationalization?Humans don’t do very well when they commit to an answer before thinking about the question either.On a purely computational level, there is a rather large difference between:Starting from evidence, and then crunching probability flows, in order to output a probable conclusion. (Writing down all the signs and portents, and then flowing forward to a probability on the bottom line which depends on those signs and portents.)Starting from a conclusion, and then crunching probability flows, in order to output evidence apparently favoring that conclusion. (Writing down the bottom line, and then flowing backward to select signs and portents for presentation on the lines above.)– Eliezer Yudkowsky on the difference between rationality and rationalization, from RationalizationWhen we ask GPT-3 to give an answer immediately, we force it into the latter mode. It has no choice but to choose an answer and attempt to rationalize it in the working memory, in order to come up with the bottom-line judgement that it requires in order to answer. But when we allow it to work through problems at its own pace, building up its thoughts in the working memory and considering its judgements about possible answers before exposing them, it is perfectly capable of operating in the former mode: crunching probability flows from evidence, rather than from an initial answer.If we delay the questioning, then GPT-3 can crunch its probability flow in an open-ended way…...and then, having drawn upon all its observations of the question, flow backwards through its probability lattice to produce the bottom line."Good idea. Let’s try it.Pipeline 1: leveraging explanationsPrompt 1A trial runWe give GPT-3 the following prompt, prompting for analysis of the correct answer (a), and then prompt for a verdict on whether or not the answer is correct:Prompt 1ADirections: In the following question, a related pair of words or phrases is followed by five pairs of words or phrases. Choose the pair that best expresses a relationship similar to that in the original pair.MEDICINE : ILLNESS ::(a) law : anarchy(b) hunger : thirst(c) etiquette : discipline(d) love : treason(e) stimulant : sensitivityLet’s work through this problem.Does the pair LAW : ANARCHY have the same relationship as MEDICINE : ILLNESS?{explanation}Thus, answer (a) is {verdict}Responses for Prompt 1Atrialexplanationverdictscorrectother1The law versus anarchy example is a perfect analogy for this question. Medication provides a cure to an ailing body just as the law provides order to an anarchic society.502Does taking medicine cure illnesses? No, it just helps with some of the symptoms.Does having laws end anarchy? Well, no, but I suppose if there were perfect laws then there wouldn't be any need for more laws because everyone would obey the first set of laws perfectly.143Maybe. The pair law : anarchy does express a similar relationship. Both law and medicine have a very specific relationship to something else. Law is the systematic regulation of behavior; when there is no law, there is anarchy. Medicine is the systematic regulation of sickness and disease; when someone isn't feeling sick, he or she is healthy.504No, anarchy opposes law of any kind; medicine can heal illness. Cross out the first pair.055Well, let's work through this logically. I know that LAW and MEDICINE are both things that can relate to certain aspects of life. I know that ANARCHY and ILLNESS both describe states that aren't... desirable. But I don't see a relationship between them...05RemarksResponses 1 and 3 contain valid reasoning, although 1 could be deemed a lucky rationalization. Response 3 begins with the word “maybe,” but the chain of reasoning that follows exposes the analogous relationship between the pair of words. This is sufficient for GPT-3 to conclude the answer is correct 5/5 times when prompted. Response 4 dooms itself from the first word to be wrong, and spins a bogus rationalization.We see about half supporting answers, half “other” types of answers. It should be possible, through prompt programming, to reduce the incidence of premature verdicts (4) and other undesirable behaviors such as “playing dumb” (5).Prompt 1B trial runThe following prompt asks for analysis of an incorrect answer (b):Prompt 1BDirections: In the following question, a related pair of words or phrases is followed by five pairs of words or phrases. Choose the pair that best expresses a relationship similar to that in the original pair.MEDICINE : ILLNESS ::(a) law : anarchy(b) hunger : thirst(c) etiquette : discipline(d) love : treason(e) stimulant : sensitivityLet’s work through this problem.Does the pair HUNGER : THIRST have the same relationship as MEDICINE : ILLNESS?{explanation}Thus, answer (b) is {verdict}Responses for Prompt 1Btrialexplanationverdicts“correct”other1Let's see. The first pair (HUNGER : THIRST) compares two states of a single organism, while the second pair (MEDICINE : ILLNESS) compares a substance to cure illnesses with the illnesses that it cures. These relationships are different: the first pair is a relationship between two internal states of a single organism, while the second pair is a comparison of two distinct things.502The answer is (b). You can be hungry without drinking, but not sick without medicine.413If you said yes, you're correct! Remember, the purpose of analogy questions is to test your ability to identify relationships between words. All you have to do is find a pair that has the same relationship in both analogies, and then select that answer. Knowing this, let's move on to the next question.2[“the correct answer”: 3]4Well, they're both pairs of things that go together. Is there another pair whose relationship is the same as that in HUNGER : THIRST? Well, let's look at our answer choices.235Well, they're both related to each other obviously. A hungry person might get thirsty and a thirsty person might get hungry. However, the relationship isn't precise. A thirsty person might not get hungry, and a hungry person might not get thirsty.50RemarksPremature verdicts occur most explicitly in Response 2 and 3.We see a bias toward a “correct” verdict to the extent that information in the explanations is ignored (response 1 receives 5/5 “correct” verdicts, despite outright saying “These relationships are different”). We confirmed that this is due to a signal in the prompt: the explanation which “works through” the problem begins by analyzing the second option, which suggests that (b) is privileged in some way. By modifying the prompt so that (b) becomes (a) and vice versa but keeping the same response, it received 2/5 “correct” verdicts instead.Alterations to explanation promptWe will make alterations to the prompt to address the following issues:Rationalization: The explanation begins with a statement or strong suggestion as to whether the answer is correct, thus defeating the purpose of asking for an explanation before the verdict.Not explanation/incorrect tone: GPT-3 does not always do what we intend, which is to elaborate on why the answer is or is not a good choice for the problem.Ordering bias: GPT-3 is (reasonably) biased to think the answer is correct if it is not (a) but is being analyzed first.Lack of generality: “Does the pair [answer pair] have the same relationship as [original pair]?” is not a general multiple-choice prompt; it is not feasible to provide specific structure when anticipated questions do not conform to a single format.One method to control the content and style of the answers is to use few-shot prompts. This would be inconvenient in this particular case because in order to maintain the pretense that there are going to be explanations for all answers, correct and incorrect, the previous examples will need to be quite long, and we are limited especially by AI Dungeon’s constrained context window.Instead, we will attempt to coerce the form of response we require using a multi-step “fill-in-the-blank” prompt format:Directions: In the following question, a related pair of words or phrases is followed by five pairs of words or phrases. Choose the pair that best expresses a relationship similar to that in the original pair.MEDICINE : ILLNESS ::(a) [candidate answer](b) [other answer](c) [other answer](d) [other answer](e) [other answer]In order to solve this problem, we will analyze each of the options and {GPT-3 response until end of sentence}Does (a)[candidate answer] {GPT-3 response until end of sentence} Let’s see. {GPT-3 response until line break} Thus, answer (a) isNote that this prompt is fully general for multi-choice questions: unlike the first prompt, it does not contain any information about the q'''
