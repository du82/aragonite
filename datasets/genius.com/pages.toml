title = "Halsey Delivers A Punky S&M Anthem With New Song “safeword” | Genius"
description = "It follows her 2024 album ‘The Great Impersonator.’"
full_description = "Last October, Halsey released the album The Great Impersonator, which was inspired by some of her favorite singers from over the decades, and today, she returns with the single “safeword,” a feisty slice of riot grrl punk with BDSM-inspired lyrics and an accompanying NSFW music video that ups the kink factor significantly. Produced by Halsey, Austin Corona, and Wyatt Bernard, all three of whom share writing credit, “safeword” finds Halsey flipping between dominant and submissive mode, though she mostly sticks with the former, making this a song about taking charge and feeling empowered. Here she is, paddle in hand, demanding your respect in the first verse. On the pre-chorus, Halsey refuses to feel ashamed of her assertiveness, whether it’s in the bedroom or elsewhere. If you can’t handle it, you can use a “safe word,” which, in the BDSM world, refers to a mutually agreed-upon word that halts whatever activity is taking place. Halsey takes complete control in the chorus. Divorced from the context of the song and its video, the lyrics might describe how the boundary-pushing artist has handled her entire career. In the second verse, Halsey’s use of the phrase “bad reputation” may hark back to a 1980 classic by rocker Joan Jett, who later produced “Rebel Girl” for the seminal riot grrl band Bikini Kill, an obvious influence on “safeword.” Directed by Lana Jay Lackey, the “safeword” music video features Halsey engaging in all sorts of S&M activities. Again, this is almost certainly not safe for your workplace."
