["https://genius.com/a/read-all-the-lyrics-to-bankss-new-album-off-with-her-head"]
title = "Read All The Lyrics To BANKS’s New Album ‘Off With Her Head’ | Genius"
description = "Guests include Doechii and Sampha."
full_description = "Alt-pop singer-songwriter BANKS returns today with Off With Her Head, her fifth studio album and first since 2022’s Serpentina. The 12-track collection includes the previously released singles “Best Friends,” “Love Is Unkind,” and “I Hate Your Ex-Girlfriend,” featuring Doechii. In a press release, BANKS calls Off With Her Head a “big sister” to her 2014 debut album, Goddess, since she’s pulled together many of the musicians and producers heard on that LP. But as she told Billboard, she’s hardly living in the past. “[The album is] about shedding past identities that no longer resonate,” BANKS said. “The title symbolizes the various ways we construct, perform, express, and sometimes hide our thoughts. There’s a tension between how we see ourselves and the roles that society imposes. Breaking free from that has been incredibly liberating, and this journey is captured throughout the album.”"
