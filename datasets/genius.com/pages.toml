 abracadabraAbracadabra, abracadabraFeel the beat under your feet, the floor's on fireAbracadabra, abracadabra[Bridge]Phantom of the dance floor, come to meSing for me a sinful melodyAh, ah, ahAh, ah, ah[Chorus]"Abracadabra, amor-oo-na-naAbracadabra, morta-oo-ga-gaAbracadabra, abra-oo-na-na"In her tongue she said, "Death or love tonight"20EmbedCancelHow to Format Lyrics:Type out all lyrics, even repeating song parts like the chorusLyrics should be broken down into individual linesUse section headers above different song parts like [Verse], [Chorus], etc.Use italics (<i>lyric</i>) and bold (<b>lyric</b>) to distinguish between different vocalists in the same song partIf you don’t understand a lyric, use [?]To learn more, check out our transcription guide or visit our transcribers forumAboutGenius Annotation7 contributors“Abracadabra” serves as the third single off of Lady Gaga’s MAYHEM (2025), following “Die With A Smile” and “Disease”, being first teased as such in the MAYHEM album trailer. Gaga played a short snippet of the track as she was leaving her hotel in Paris, after her performance at the opening ceremony for the 2024 Summer Olympics in Paris, France, with the track being the first of the two songs showcased. The media tabloid Variety first reported that Gaga will release the third single and accompanying music video from MAYHEM on February 2, stating that it will be aired during a commercial break at the 67th Annual GRAMMY Awards. In an interview with Elle Magazine, Gaga explained that the song is about “facing the challenge of life and the challenge of the night and finding the magic in it all.” Debuting at #8 on Spotify’s daily global chart, the dark pop banger skyrocketed to #3 on the U.S. iTunes chart, sharing the Top 10 with Gaga’s initial offering “Die With A Smile,” which thrives at #4. Additionally, it peaked at #6 on the Official UK Singles chart.Expand +69ShareQ&AFind answers to frequently asked questions about the song and explore its deeper meaningAsk a questionWhat did Lady Gaga say about "Abracadabra"?Genius Answer2 contributors Well, the song is about facing the challenge of life and the challenge of the night and finding the magic in it all. When you have to face the world, the people around you, your life, your unique circumstances, your unique fabric in the world. And when you feel challenged with really showing everybody who you are. The lady in red is all of you that puts you to the test. Your internal monologue. ‘Can you do it? Can you do it? Will you do it? Are you good enough? Can you handle it?’ In a lot of ways, the song is about dealing with that challenge to yourself and very often the world around us can reflect it back to us as well. I wanted to explore the question, ‘What does it feel like to thrive and not just be surviving all the time?’ To me, in this video, she initiates the challenge and this purer side of me that is peering up at all of the negative backtalk, all of the doubt, and facing all that side of me, she completely comes through. And she says, ‘I’m up for the challenge.’ And it’s interesting because we had all these different ways that we thought about the video ending and ultimately I wanted this song to be about resilience in a way the song “Disease” was not. That track was about inner torture and being trapped. And so with this song, I wanted to crack open what it means to persevere. And explore the metaphor of perseverance on the dance floor, because the dance floor is – for me, anyway – it has always been the place where I try to improve myself as a human being. How do I work harder? Have more passion? How do I give more of my authentic self? How do I earn my spot as a performer? — via Elle+8What is the meaning of "Abracadabra" by Lady Gaga?Genius Answer1 contributorThe meaning of “Abracadabra” by Lady Gaga is about how facing the world can be tough. When you try to show who you really are, it can feel like a test. The song is really about tackling those challenges and how the world can mirror those feelings back to us. Lady Gaga wanted to dig into what it means to truly thrive instead of just getting by every day.+9How did the song perform commercially?Genius Answer1 contributorDuring the tracking week ending February 15, 2025, the song debuted at #29 on the Hot 100 chart. The song marked her 39th appearance on the chart. The song also debuted at #1 on the Billboard Hot Dance/Pop Songs chart from a partial tracking week. During the tracking week ending February 22, 2025, the song reached a new peak of #13.+6Is there a Behind The Scenes Video for "Abracadabra"?Rehearsal VideoWho produced “Abracadabra” by Lady Gaga?When did Lady Gaga release “Abracadabra”?Who wrote “Abracadabra” by Lady Gaga?<img src="https://images.genius.com/3ebc068a989fe899041f5b980cbee198.820x820x1.png" class="SizedImage-sc-39a204ed-2 eXNwci"/>MAYHEM (Store Exclusive Version) (2025)Lady Gaga1. Disease2. Abracadabra3. Garden Of Eden (Unreleased)4. Perfect Celebrity5. Vanish Into You6. Killah7. Zombieboy8. LoveDrug9. How Bad Do U Want Me (Unreleased)10. Don’t Call Tonight (Unreleased)11. Shadow Of A Man12. The Beast13. Blade Of Grass (Unreleased)14. Can’t Stop The High (Unreleased)15. Die With A SmileExpand CreditsProducersLady Gaga, Cirkut & wattWritersLady Gaga, watt, Cirkut, Siouxsie, John McGeoch, Steven Severin & Budgie (Drummer)DrumswattBass ProgrammerCirkutBasswattDrum ProgrammerCirkutElectric GuitarwattKeyboardswatt, Lady Gaga & CirkutSynthesizerCirkutMixing EngineerȘerban GheneaMastering EngineerRandy MerrillAdditional EngineeringMarco Sonzini & Tyler HarrisEngineerPaul LaMalfaComposerLady Gaga, watt, Budgie (Drummer), Steven Severin, Siouxsie, John McGeoch & CirkutVideo DirectorLady Gaga, PARRI$ Goebel & Bethany VargasGuitarJohn McGeochPublisherAuthorScape, Virgin Music Group & Universal Music Publishing Group (GEMA)DistributorUniversal Music GroupLabelInterscope RecordsCopyright ©Interscope RecordsPhonographic Copyright ℗Interscope RecordsReleased onF