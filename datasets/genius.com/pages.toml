["https://genius.com/a/g-dragon-is-tired-of-the-games-on-new-song-drama"]
title = "G-DRAGON Is Tired Of The Games On New Song “DRAMA” | Genius"
description = "It comes off the K-pop star’s new album ‘Übermensch.’"
full_description = "South Korean singer, rapper, and songwriter G-DRAGON (지드래곤) returned yesterday with Übermensch, his first full-length album since 2013. Two of the project’s eight songs debuted inside the Top 10 of the Genius Top Songs chart, and one of them, the maudlin piano ballad “DRAMA,” cracked the Top 5. Produced by G-DRAGON, who wrote the song with Oscar winning queen of adult contemporary Diane Warren and Choice37, “DRAMA” centers on a romantic partner who’s all about playing games and starting trouble. Here’s G-DRAGON in the first verse, lamenting the situation with a slight robotic effect on his voice. On the chorus, G-DRAGON suggests his partner is exhibiting learned behavior. Either way, she’s headed for some cosmic justice. G-DRAGON likens this relationship to a performance in the second verse. He’s grown tired of the plot. On the bridge, G-DRAGON questions why he’s even in this situation. This person is clearly no good for him, and yet he’s drawn back for some reason. In the “DRAMA” music video, G-DRAGON appears as a wind-up toy and watches as a faceless ballerina dances around him."
