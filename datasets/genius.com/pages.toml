ne but almost entirely different lyrics. Commercially, “Lose Yourself” was hugely successful and reached #1 in 20 countries, including the US. It marked Eminem’s first US #1, and held the top position for 12 weeks, becoming the third-longest chart-topper from a movie soundtrack (behind “I Will Always Love You” and “End Of The Road”). As of 2022, it is 13x Multi-Platinum in the US. The song was lauded critically, too. It won two Grammys (Best Male Rap Solo Performance & Best Rap Song) and became the first rap song to win the Oscar for Best Original Song. Eminem didn’t attend the ceremony as he didn’t think he’d win, meaning he didn’t perform it, which is atypical for winners of the category. This was remedied when he performed the song at the 2020 Oscars. The song has also had a huge cultural impact. Apple used the song for two commercials in the mid-‘00s to promote iTunes and the iPod, with Eminem featuring in the latter video. Chrysler used the instrumental and Eminem for their 2011 “Born of Fire” Super Bowl commercial. In 2021, Eminem opened up a restaurant in Detroit called “Mom’s Spaghetti”, which is a lyric that’s been meme’d extensively (even being given its own fan-made song.)Expand +94837ShareQ&AFind answers to frequently asked questions about the song and explore its deeper meaningAsk a questionHas "Lose Yourself" reached any milestones?Genius Answer1 contributorAs of February 28, 2018, “Lose Yourself” has reached Diamond (10x Multi-Platinum) certification by the RIAA.+136Was the song ever performed by Eminem on the Oscars?Genius Answer1 contributorThough “Lose Yourself” was nominated and won for “Best Original Song” in 2002 at the Oscar’s, Eminem did not perform the song on stage that year. It wasn’t until 18 years later on February 9, 2020 where Eminem made a surprise appearance on the Oscar’s stage to perform the song there for the first time. +111What makes the song important?Genius Answer2 contributors“Lose Yourself” was the first ever hip hop track to win an Oscar for Best Original Song.+239Was the song ever performed on the Super Bowl halftime show?Is this song featured on a movie?Has the song ever been used for a US presidential campaign?What lists has the song appeared on?Official InstrumentalWho produced “Lose Yourself” by Eminem?When did Eminem release “Lose Yourself”?Who wrote “Lose Yourself” by Eminem?<img src="https://images.genius.com/0ff68f9b1e43a80aaeafc8e0f768d13d.1000x1000x1.jpg" class="SizedImage-sc-39a204ed-2 eXNwci"/>Curtain Call: The Hits (Deluxe Edition) (2005)Eminem1. Intro (Curtain Call)2. FACK3. The Way I Am4. My Name Is5. Stan6. Lose Yourself7. Shake That8. Sing for the Moment9. Without Me10. Like Toy Soldiers11. The Real Slim Shady12. Mockingbird13. Guilty Conscience14. Cleanin’ Out My Closet15. Just Lose It16. When I’m Gone17. Stan (Live At 43rd Grammy Awards)18. Dead Wrong19. Role Model20. Kill You21. Shit on You22. Criminal23. Renegade24. Just Don’t Give a FuckExpand CreditsProducersEminem & Jeff BassWritersEminem, Jeff Bass & Luis RestoPhonographic Copyright ℗This Compilation, Aftermath Entertainment, Interscope Records & Shady RecordsPublisherResto World Music, Eight Mile Style, Jaceff Music, Kobalt Music, Martin Affiliated & Nueve MusicCopyright ©Aftermath Entertainment, Interscope Records & Shady RecordsLabelAftermath Entertainment, Interscope Records & Shady RecordsRecording EngineerMike Strange & Steve KingProgrammerEminemMastering EngineerBrian GardnerMixing EngineerEminem & Steve KingKeyboardsEminemGuitarJeff BassCo-ProducerJeff BassBassJeff BassAdditional ProductionJeff BassReleased onOctober 28, 2002Lose Yourself SamplesLose Yourself (Instrumental) by EminemSongs That Sample Lose YourselfSodom und Gomorrha by Bushido, One Shot by A Boogie wit da Hoodie, Still Won't Listen by Finesse2Tymes & Fack Yourself / Lose Your Fat Bottomed Girls pt 1 / Lose Your Fat Bottomed Girls pt 2 feat merzbow (6​/​5​/​2022) by Lil ShitcoreLose Yourself InterpolationsLose Yourself (Original Demo Ver