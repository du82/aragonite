["https://genius.com/a/lizzo-stages-a-comeback-with-new-song-love-in-real-life"]
title = "Lizzo Stages A Comeback With New Song “Love In Real Life” | Genius"
description = "It’s her first new music since 2023."
full_description = "Lizzo sat out 2024 following some pretty serious allegations (sexual harassment, creating a hostile work environment, weight-shaming, bullying) from a group of former dancers in 2023. But now, the singer and rapper is back with a new single, “Love In Real Life,” another song of positivity and self-empowerment, this time with propulsive guitars that fall somewhere in between early-’00s Strokes and Prince circa “Let’s Go Crazy.” Produced by Blake Slatkin and Ricky Reed, both of whom share writing credit with Lizzo and Theron Thomas, “Love In Real Life” only alludes to drama in the singer’s personal life. The first verse finds Lizzo wanting to stay home and retreat from a world grown hostile. In the second verse, Lizzo is heartened by the fact that she’s not the only lost soul dancing in a dark room, seeking connection. In the “Love In Real Life” music video, a leather-clad Lizzo has a freaky experience in a club, then basically recreates “Thriller” on the streets outside."
