["https://genius.com/a/read-all-the-lyrics-to-lisas-new-album-alter-ego"]
title = "Read All The Lyrics To LISA’s New Album ‘Alter Ego’ | Genius"
description = "Guests include ROSALÍA, Tyla, and Megan Thee Stallion."
full_description = "LISA of BLACKPINK returns today with Alter Ego, her debut solo album. The LP includes the previously released singles “Rockstar” “New Woman” (ft. ROSALÍA), “Moonlit Floor (Kiss Me),” and “Born Again” (ft. Doja Cat and RAYE). Elsewhere on the 15-track collection, LISA welcomes guests Future, Megan Thee Stallion, and Tyla. Throughout the album, LISA embodies five different alter egos: Vixi, Roxi, Kiki, Sunni, and Speedi. There’s even a 56-page graphic novel to coincide with the release. In an interview with Capital FM, LISA spoke about how the concept came to be. “I was trying so many different kinds of music styles while I was recording,” she said. “I was like, ‘Oh, well I’ve never done this kind of stuff before, but it sounds great. Why not just kind of like put all the different styles into the album and call it Alter Ego?’”"
