title = "Bhad Bhabie Disses Alabama Barker On New Song “Ms. Whitman” | Genius"
description = "It’s pretty ugly."
full_description = "With the whole Drake-Kendrick situation seemingly in the rearview, America needs a new rap feud to distract from our real problems. Into the chat comes Bhad Bhabie, she of “cash me outside” fame, who’s embroiled in a gnarly beef with Alabama Barker, daughter of blink-182 drummer Travis Barker and stepdaughter of Kourtney Kardashian. According to TMZ—the go-to source for such things—the trouble started when Alabama allegedly had relations with Le Vaughn, the father of Bhad Bhabie’s child. Back in January, Bhabie dropped the Alabama diss track “Over Cooked,” which prompted the response “Cry Bhabie,” and today, BB is back with another one, “Ms. Whitman,” which debuted at No. 2 on the Genius Top Songs chart. This is truly a thing people care about, so let’s go in. The first thing to know about “Ms. Whitman”: It samples the beat from from Kanye West and Ty Dolla $ign’s “CARNIVAL.” The second thing to note: The title refers to the character of Alabama Whitman from the 1993 film True Romance. Whitman is a prostitute, and Alabama Barker was apparently named for her. Bhad Bhabie shows zero restraint on this song. In the opening lines, she goes at Alabama and her stepmom, who wasn’t the first Kardashian that Travis Barker had a relationship with. Later, Bhad Bhabie accuses Alabama of biting her rap style from Latto and using her body to obtain beats from ATL Jacob, co-producer of “Cry Bhabie.” Bhad Bhabie then alleges that Alabama got pregnant by rapper Tyga and had an abortion. (Tyga has denied this.) The song contains just one verse, and in the chorus, Bhad Bhabie name-checks Drake and his song “God’s Plan” while making reference to a Draco firearm. In the “Ms. Whitman” music video, Bhad Bhabie dances all up on a drummer meant to look like Travis Barker. This is probably going to get way uglier before we hear the end of it."
