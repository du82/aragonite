full_description = "Method Open access Published: 27 October 2010 Differential expression analysis for sequence count data Simon Anders1 & Wolfgang Huber1 Genome Biology volume 11, Article number: R106 (2010) Cite this article 424k Accesses 119 Altmetric Metrics details AbstractHigh-throughput sequencing assays such as RNA-Seq, ChIP-Seq or barcode counting provide quantitative readouts in the form of count data. To infer differential signal in such data correctly and with good statistical power, estimation of data variability throughout the dynamic range and a suitable error model are required. We propose a method based on the negative binomial distribution, with variance and mean linked by local regression and present an implementation, DESeq, as an R/Bioconductor package. BackgroundHigh-throughput sequencing of DNA fragments is used in a range of quantitative assays. A common feature between these assays is that they sequence large amounts of DNA fragments that reflect, for example, a biological system's repertoire of RNA molecules (RNA-Seq [1, 2]) or the DNA or RNA interaction regions of nucleotide binding molecules (ChIP-Seq [3], HITS-CLIP [4]). Typically, these reads are assigned to a class based on their mapping to a common region of the target genome, where each class represents a target transcript, in the case of RNA-Seq, or a binding region, in the case of ChIP-Seq. An important summary statistic is the number of reads in a class; for RNA-Seq, this read count has been found to be (to good approximation) linearly related to the abundance of the target transcript [2]. Interest lies in comparing read counts between different biological conditions. In the simplest case, the comparison is done separately, class by class. We will use the term gene synonymously to class, even though a class may also refer to, for example, a transcription factor binding site, or even a barcode [5].We would like to use statistical testing to decide whether, for a given gene, an observed difference in read counts is significant, that is, whether it is greater than what would be expected just due to natural random variation.If reads were independently sampled from a population with given, fixed fractions of genes, the read counts would follow a multinomial distribution, which can be approximated by the Poisson distribution.Consequently, the Poisson distribution has been used to test for differential expression [6, 7]. The Poisson distribution has a single parameter, which is uniquely determined by its mean; its variance and all other properties follow from it; in particular, the variance is equal to the mean. However, it has been noted [1, 8] that the assumption of Poisson distribution is too restrictive: it predicts smaller variations than what is seen in the data. Therefore, the resulting statistical test does not control type-I error (the probability of false discoveries) as advertised. We show instances for this later, in the Discussion.To address this so-called overdispersion problem, it has been proposed to model count data with negative binomial (NB) distributions [9], and this approach is used in the edgeR package for analysis of SAGE and RNA-Seq [8, 10]. The NB distribution has parameters, which are uniquely determined by mean μ and variance σ2. However, the number of replicates in data sets of interest is often too small to estimate both parameters, mean and variance, reliably for each gene. For edgeR, Robinson and Smyth assumed [11] that mean and variance are related by σ2 = μ + αμ2, with a single proportionality constant α that is the same throughout the experiment and that can be estimated from the data. Hence, only one parameter needs to be estimated for each gene, allowing application to experiments with small numbers of replicates.In this paper, we extend this model by allowing more general, data-driven relationships of variance and mean, provide an effective algorithm for fitting the model to data, and show that it provides better fits (Section Model). As a result, more balanced selection of differentially expressed genes throughout the dynamic range of the data can be obtained (Section Testing for differential expression). We demonstrate the method by applying it to four data sets (Section Applications) and discuss how it compares to alternative approaches (Section Conclusions).Results and DiscussionModelDescriptionWe assume that the number of reads in sample j that are assigned to gene i can be modeled by a negative binomial (NB) distribution, K i j ~ NB ( μ i j , σ i j 2 ) , (1) which has two parameters, the mean μij and the variance σ i j 2 . The read counts Kij are non-negative integers. The probabilities of the distribution are given in Supplementary Note A. (All Supplementary Notes are in Additional file 1.) The NB distribution is commonly used to model count data when overdispersion is present [12].In practice, we do not know the parameters μij and σ i j 2 , and we need to estimate them from the data. Typically, the number of replicates is small, and further modelling assumptions need to be made in order to obtain useful estimates. In this paper, we develop a method that is based on the following three assumptions.First, the mean parameter μij , that is, the expectation value of the observed counts for gene i in sample j, is the product of a condition-dependent per-gene value qi, ρ(j)(where ρ(j) is the experimental condition of sample j) and a size factor sj, μ i j = q i , ρ ( j ) S j . (2) qi,ρ(j)is proportional to the expectation value of the true (but unknown) concentration of fragments from gene i under condition ρ(j). The size factor sjrepresents the coverage, or sampling depth, of library j, and we will use the term common scale for quantities, such as qi, ρ(j), that are adjusted for coverage by dividing by sj.Second, the variance σ i j 2 is the sum of a shot noise term and a raw variance term, σ i j 2 = μ i j ⏟ shot noise + s j 2 v i , ρ ( j ) ⏟ raw variance . (3) Third, we assume that the per-gene raw variance parameter vi, ρis a smooth function of qi, ρ, v i , ρ ( j ) = v ρ ( q i , ρ ( j ) ) . (4) This assumption is needed because the number of replicates is typically too low to get a precise estimate of the variance for gene i from just the data available for this gene. This assumption allows us to pool the data from genes with similar expression strength for the purpose of variance estimation.The decomposition of the variance in Equation (3) is motivated by the following hierarchical model: We assume that the actual concentration of fragments from gene i in sample j is proportional to a random variable Rij , such that the rate that fragments from gene i are sequenced is sjrij . For each gene i and all samples j of condition ρ, the Rij are i.i.d. with mean qiρ and variance viρ . Thus, the count value Kij , conditioned on Rij = rij , is Poisson distributed with rate sjrij . The marginal distribution of Kij - when allowing for variation in Rij - has the mean μij and (according to the law of total variance) the variance given in Equation (3). Furthermore, if the higher moments of Rij are modeled according to a gamma distribution, the marginal distribution of Kij is NB (see, for example, [12], Section 4.2.2).FittingWe now describe how the model can be fitted to data. The data are an n × m table of counts, kij , where i = 1,..., n indexes the genes, and j = 1,..., m indexes the samples. The model has three sets of parameters:(i) m size factors sj ; the expectation values of all counts from sample j are proportional to sj .(ii) for each experimental condition ρ, n expression strength parameters qiρ ; they reflect the expected abundance of fragments from gene i under condition ρ, that is, expectation values of counts for gene i are proportional to qiρ .(iii) The smooth functions vρ : ℝ+ →ℝ+; for each condition ρ, vρ models the dependence of the raw variance viρ on the expected mean qiρ .The purpose of the size factors sj is to render counts from different samples, which may have been sequenced to different depths, comparable. Hence, the ratios (EKij )/(EKij' ) of expected counts for the same gene i in different samples j and j' should be equal to the size ratio sj /sj' if gene i is not differentially expressed or samples j and j' are replicates. The total number of reads, Σ i kij , may seem to be a good measure of sequencing depth and hence a reasonable choice for sj . Experience with real data, however, shows this not always to be the case, because a few highly and differentially expressed genes may have strong influence on the total read count, causing the ratio of total read counts not to be a good estimate for the ratio of expected counts.Hence, to estimate the size factors, we take the median of the ratios of observed counts. Generalizing the procedure just outlined to the case of more than two samples, we use: s ^ j = median i k i j ( ∏ v = 1 m k i v ) 1 / m . (5) The denominator of this expression can be interpreted as a pseudo-reference sample obtained by taking the geometric mean across samples. Thus, each size factor estimate s ^ j is computed as the median of the ratios of the j-th sample's counts to those of the pseudo-reference. (Note: While this manuscript was under review, Robinson and Oshlack [13] suggested a similar method.)To estimate qiρ , we use the average of the counts from the samples j corresponding to condition ρ, transformed to the common scale: q ^ i ρ = 1 m ρ ∑ j : ρ ( j ) = ρ k i j s ^ j , (6) where mρ is the number of replicates of condition ρ and the sum runs over these replicates. the functions vρ , we first calculate sample variances on the common scale w i ρ = 1 m ρ − 1 ∑ j : ρ ( j ) = ρ ( k i j s ^ j − q ^ i ρ ) 2 (7) and define z i ρ = q ^ i ρ m ρ ∑ j : ρ ( j ) = ρ 1 s ^ j . (8) In Supplementary Note B in Additional file 1 we show that wiρ - ziρ is an unbiased estimator for the raw variance parameter viρ of Equation (3).However, for small numbers of replicates, mρ , as is typically the case in applications, the values wiρ are highly variable, and wiρ - ziρ would not be a useful variance estimator for statistical inference. Instead, we use local regression [14] on the graph ( q ^ i ρ , w i ρ ) to obtain a smooth function wρ (q), with v ^ ρ ( q ^ i ρ ) = w ρ ( q ^ i ρ ) − z i ρ (9) as our estimate for the raw variance.Some attention is needed to avoid estimation biases in the local regression. wiρ is a sum of squared random variables, and the residuals w i ρ − w ( q ^ i ρ ) are skewed. Following References [15], Chapter 8 and [14], Section 9.1.2, we use a generalized linear model of the gamma family for the local regression, using the implementation in the locfit package [16].Testing for differential expressionSuppose that we have mA replicate samples for biological condition A and mB samples for condition B. For each gene i, we would like to weigh the evidence in the data for differential expression of that gene between the two conditions. In particular, we would like to test the null hypothesis qiA = qiB , where qiA is the expression strength parameter for the samples of condition A, and qiB for condition B. To this end, we define, as test statistic, the total counts in each condition, K i A = ∑ j : ρ ( j ) = A K i j , K i B = ∑ j : ρ ( j ) = B K i j , (10) and their overall sum KiS = KiA + KiB . From the error model described in the previous Section, we show below that - under the null hypothesis - we can compute the probabilities of the events KiA = a and KiB = b for any pair of numbers a and b. We denote this probability by p(a, b). The P value of a pair of observed count sums (kiA , kiB ) is then the sum of all probabilities less or equal to p(kiA , kiB ), given that the overall sum is kiS : p i = ∑ a + b = k i S p ( a , b ) ≤ p ( k i A k i B ) p ( a , b ) ∑ a + b = k i S p ( a , b ) . (11) The variables a and b in the above sums take the values 0,..., kiS. The approach presented so far follows that of Robinson and Smyth [11] and is analogous to that taken by other conditioned tests, such as Fisher's exact test. (See Reference [17], Chapter 3 for a discussion of the merits of conditioning in tests.)Computation of p(a, b). First, assume that, under the null hypothesis, counts from different samples are independent. Then, p(a, b) = Pr(KiA= a) Pr(KiB= b). The problem thus is computing the probability of the event KiA= a, and, analogously, of KiB= b. The random variable KiAis the sum of mANB-distributed random variables. We approximate its distribution by a NB distribution whose parameters we obtain from those of the Kij. To this end, we first compute the pooled mean estimate from the counts of both conditions, q ^ i 0 = ∑ j : ρ ( j ) ∈ { A , B } k i j / s j , (12) which accounts for the fact that the null hypothesis stipulates that qiA= qiB. The summed mean and variance for condition A are μ ^ i A = ∑ j ∈ A s j q ^ i 0 , (13) σ ^ i A 2 = ∑ j ∈ A s ^ j q ^ i 0 + s ^ j 2 v ^ A ( q ^ i 0 ) . (14) Supplementary Note C in Additional file 1 describes how the distribution parameters of the NB for KiAcan be determined from μ ^ i A and σ ^ i A 2 . (To avoid bias, we do not match the moments directly, but instead match a different pair of distribution statistics.) The parameters of KiBare obtained analogously.Supplementary Note D in Additional file 1 explains how we evaluate the sums in Equation (11).ApplicationsData setsWe present results based on the following data sets:RNA-Seq in fly embryosB. Wilczynski, Y.-H. Liu, N. Delhomme and E. Furlong have conducted RNA-Seq experiments in fly embryos and kindly shared part of their data with us ahead of publication. In each sample of this data set, a gene was engineered to be over-expressed, and we compare two biological replicates each of two such conditions, in the following denoted as 'A' and 'B'.Tag-Seq of neural stem cellsEngström et al. [18] performed Tag-Seq [19] for tissue cultures of neural cells, including four from glioblastoma-derived neural stem-cells ('GNS') and two from non-cancerous neural stem ('NS') cells. As each tissue culture was derived from a different subject and so has a different genotype, these data show high variability.RNA-Seq of yeastNagalakshmi et al. [1] performed RNA-Seq on replicates of Saccharomyces cerevisiae cultures. They tested two library preparation protocols, dT and RH, and obtained three sequencing runs for each protocol, such that for the first run of each protocol, they had one further technical replicate (same culture, replicated library preparation) and one further biological replicate (different culture).ChIP-Seq of HapMap samplesKasowski et al. [20] compared protein occupation of DNA regions between ten human individuals by ChIP-Seq. They compiled a list of regions for polymerase II and NF-κB, and counted, for each sample, the number of reads that mapped onto each region. The aim of the study was to investigate how much the regions' occupation differed between individuals.Variance estimationWe start by "
