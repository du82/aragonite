full_description = "Editorial Team Chief Editor: Veronique van den BergheVeronique received her PhD in Biomedical Sciences at KU Leuven in Belgium where she investigated the development and migration of cortical interneurons in the mouse embryo. She went on to do a postdoc at the Instituto de Neurociencias in Spain and at King’s College London looking at the integration of these neurons in the postnatal brain. She first joined Genome Biology as a locum editor in 2018. Since then, she has worked at Nature Biotechnology, Scientific Data, and Communications Biology, before returning to take up the Chief Editor role in 2022. She is based in the London office. Senior Editor: Andrew Cosgrove Andrew obtained his PhD from Dundee University, studying DNA replication and nuclear organization in budding yeast. He then did a postdoc on yeast meiosis in Sheffield, before joining Genome Biology in 2009. He is based in the London office. Senior Editor: Tim SandsTim joined Genome Biology in 2016 after several years working as the editor for several titles in the BMC series journals. He received his PhD in evolutionary biology from the University of Edinburgh, studying hybrid zones. Tim handles manuscripts on evolutionary genomics and systems biology. He is based in the London office. Senior Editor: Wenjing SheWenjing joined Genome Biology in 2020 as an Associate Editor. She completed her PhD at the Department of Plant and Microbial Biology at the University of Zurich, where she studied chromatin reprogramming during the reproductive cell fate transition in plants. She continued postdoctoral research in the fields of temperature sensing, apomixis and epigenetic regulation during sexual reproduction at the University of Cambridge, the University of Zurich, and the John Innes Centre. She is based in the Shanghai office. Associate Editor: Claudia FengClaudia received her PhD in biological sciences from the Wellcome Sanger Institute in Cambridge, UK, where she worked on the generation and analysis of large-scale CRISPR-based screens with single-cell transcriptional read-out. She joined Genome Biology in 2024 and is based in the New York office."
