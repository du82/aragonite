title = "Chapter 15 Ecology | Geocomputation with R"
description = "Prerequisites This chapter assumes you have a strong grasp of geographic data analysis and processing, covered in Chapters 2 to 5. The chapter makes use of bridges to GIS software, and spatial..."
full_description = '15 Ecology Prerequisites This chapter assumes you have a strong grasp of geographic data analysis and processing, covered in Chapters 2 to 5. The chapter makes use of bridges to GIS software, and spatial cross-validation, covered in Chapters 10 and 12, respectively. The chapter uses the following packages: library(sf) library(terra) library(dplyr) library(data.table) # fast data frame manipulation (used by mlr3) library(mlr3) # machine learning (see Chapter 12) library(mlr3spatiotempcv) # spatiotemporal resampling library(mlr3tuning) # hyperparameter tuning package library(mlr3learners) # interface to most important machine learning pkgs library(paradox) # defining hyperparameter spaces library(ranger) # random forest package library(qgisprocess) # bridge to QGIS (Chapter 10) library(tree) # decision tree package library(vegan) # community ecology package 15.1 Introduction This chapter models the floristic gradient of fog oases to reveal distinctive vegetation belts that are clearly controlled by water availability. The case study provides an opportunity to bring together and extend concepts presented in previous chapters to further enhance your skills at using R for geocomputation. Fog oases, locally called lomas, are vegetation formations found on mountains along the coastal deserts of Peru and Chile. Similar ecosystems can be found elsewhere, including in the deserts of Namibia and along the coasts of Yemen and Oman (Galletti, Turner, and Myint 2016). Despite the arid conditions and low levels of precipitation of around 30-50 mm per year on average, fog deposition increases the amount of water available to plants during austral winter, resulting in green southern-facing mountain slopes along the coastal strip of Peru. The fog, which develops below the temperature inversion caused by the cold Humboldt current in austral winter, provides the name for this habitat. Every few years, the El Niño phenomenon brings torrential rainfall to this sun-baked environment, providing tree seedlings a chance to develop roots long enough to survive the following arid conditions (Dillon, Nakazawa, and Leiva 2003). Unfortunately, fog oases are heavily endangered, primarily due to agriculture and anthropogenic climate change. Evidence on the composition and spatial distribution of the native flora can support efforts to protect remaining fragments of fog oases (Muenchow, Bräuning, et al. 2013; Muenchow, Hauenstein, et al. 2013). In this chapter you will analyze the composition and the spatial distribution of vascular plants (here referring mostly to flowering plants) on the southern slope of Mt. Mongón, a lomas mountain near Casma on the central northern coast of Peru (Figure 15.1). During a field study to Mt. Mongón, all vascular plants living in 100 randomly sampled 4 by 4 m2 plots in the austral winter of 2011 were recorded (Muenchow, Bräuning, et al. 2013). The sampling coincided with a strong La Niña event that year, as shown in data published by the National Oceanic and Atmospheric Administration (NOAA). This led to even higher levels of aridity than usual in the coastal desert and increased fog activity on the southern slopes of Peruvian lomas mountains. FIGURE 15.1: The Mt. Mongón study area. Figure taken from Muenchow, Schratz, and Brenning (2017). This chapter also demonstrates how to apply techniques covered in previous chapters to an important applied field: ecology. Specifically, we will: Load in needed data and compute environmental predictors (Section 15.2) Extract the main floristic gradient from our species composition matrix with the help of a dimension-reducing technique (ordinations; Section 15.3) Model the first ordination axis, i.e., the floristic gradient, as a function of environmental predictors such as altitude, slope, catchment area and NDVI (Section 15.4). For this, we will make use of a random forest model — a very popular machine learning algorithm (Breiman 2001). To guarantee an optimal prediction, it is advisable to tune beforehand the hyperparameters with the help of spatial cross-validation (see Section 12.5.2) Make a spatial distribution map of the floristic composition anywhere in the study area (Section 15.4.2) 15.2 Data and data preparation All the data needed for the subsequent analyses is available via the spDataLarge package. data("study_area", "random_points", "comm", package = "spDataLarge") dem = rast(system.file("raster/dem.tif", package = "spDataLarge")) ndvi = rast(system.file("raster/ndvi.tif", package = "spDataLarge")) study_area is a polygon representing the outline of the study area, and random_points is an sf object containing the 100 randomly chosen sites. comm is a community matrix of the wide data format (Wickham 2014) where the rows represent the visited sites in the field and the columns the observed species.101 # sites 35 to 40 and corresponding occurrences of the first five species in the # community matrix comm[35:40, 1:5] #> Alon_meri Alst_line Alte_hali Alte_porr Anth_eccr #> 35 0 0 0 0.0 1.000 #> 36 0 0 1 0.0 0.500 #> 37 0 0 0 0.0 0.125 #> 38 0 0 0 0.0 3.000 #> 39 0 0 0 0.0 2.000 #> 40 0 0 0 0.2 0.125 The values represent species cover per site, and were recorded as the area covered by a species in proportion to the site area (%; please note that one site can have >100% due to overlapping cover between individual plants). The rownames of comm correspond to the id column of random_points. dem is the digital elevation model (DEM) for the study area, and ndvi is the Normalized Difference Vegetation Index (NDVI) computed from the red and near-infrared channels of a Landsat scene (see Section 4.3.3 and ?spDataLarge::ndvi.tif). Visualizing the data helps to get more familiar with it, as shown in Figure 15.2 where the dem is overplotted by the random_points and the study_area. FIGURE 15.2: Study mask (polygon), location of the sampling sites (black points) and DEM in the background. The next step is to compute variables which are not only needed for the modeling and predictive mapping (see Section 15.4.2) but also for aligning the non-metric multidimensional scaling (NMDS) axes with the main gradient in the study area, altitude and humidity, respectively (see Section 15.3). Specifically, we compute catchment slope and catchment area from a digital elevation model using R-GIS bridges (see Chapter 10). Curvatures might also represent valuable predictors, and in the Exercise section you can find out how they would impact the modeling result. To compute catchment area and catchment slope, we can make use of the sagang:sagawetnessindex function.102 qgis_show_help() returns all function parameters and default values of a specific geoalgorithm. Here, we present only a selection of the complete output. # if not already done, enable the saga next generation plugin qgisprocess::qgis_enable_plugins("processing_saga_nextgen") # show help qgisprocess::qgis_show_help("sagang:sagawetnessindex") #> Saga wetness index (sagang:sagawetnessindex) #> ... #> ---------------- #> Arguments #> ---------------- #> #> DEM: Elevation #> Argument type: raster #> Acceptable values: #> - Path to a raster layer #> ... #> SLOPE_TYPE: Type of Slope #> Argument type: enum #> Available values: #> - 0: [0] local slope #> - 1: [1] catchment slope #> ... #> AREA: Catchment area #> Argument type: rasterDestination #> Acceptable values: #> - Path for new raster layer #>... #> ---------------- #> Outputs #> ---------------- #> #> AREA: <outputRaster> #> Catchment area #> SLOPE: <outputRaster> #> Catchment slope #> ... Subsequently, we can specify the needed parameters using R named arguments (see Section 10.2). Remember that we can use a path to a file on disk or a SpatRaster living in R’s global environment to specify the input raster DEM (see Section 10.2). Specifying 1 as the SLOPE_TYPE makes sure that the algorithm will return the catchment slope. The resulting rasters are saved to temporary files with an .sdat extension which is the native SAGA raster format. # environmental predictors: catchment slope and catchment area ep = qgisprocess::qgis_run_algorithm( alg = "sagang:sagawetnessindex", DEM = dem, SLOPE_TYPE = 1, SLOPE = tempfile(fileext = ".sdat"), AREA = tempfile(fileext = ".sdat"), .quiet = TRUE) This returns a list named ep containing the paths to the computed output rasters. Let’s read-in catchment area as well as catchment slope into a multi-layer SpatRaster object (see Section 2.3.4). Additionally, we will add two more raster objects to it, namely dem and ndvi. # read in catchment area and catchment slope ep = ep[c("AREA", "SLOPE")] |> unlist() |> rast() names(ep) = c("carea", "cslope") # assign better names origin(ep) = origin(dem) # make sure rasters have the same origin ep = c(dem, ndvi, ep) # add dem and ndvi to the multi-layer SpatRaster object Additionally, the catchment area values are highly skewed to the right (hist(ep$carea)). A log10-transformation makes the distribution more normal. ep$carea = log10(ep$carea) As a convenience to the reader, we have added ep to spDataLarge: ep = rast(system.file("raster/ep.tif", package = "spDataLarge")) Finally, we can extract the terrain attributes to our field observations (see also Section 6.3). ep_rp = terra::extract(ep, random_points, ID = FALSE) random_points = cbind(random_points, ep_rp) 15.3 Reducing dimensionality Ordinations are a popular tool in vegetation science to extract the main information, frequently corresponding to ecological gradients, from large species-plot matrices mostly filled with 0s. However, they are also used in remote sensing, the soil sciences, geomarketing and many other fields. If you are unfamiliar with ordination techniques or in need of a refresher, have a look at Michael W. Palmer’s webpage for a short introduction to popular ordination techniques in ecology and at Borcard, Gillet, and Legendre (2011) for a deeper look on how to apply these techniques in R. vegan’s package documentation is also a very helpful resource (vignette(package = "vegan")). Principal component analysis (PCA) is probably the most famous ordination technique. It is a great tool to reduce dimensionality if one can expect linear relationships between variables, and if the joint absence of a variable in two plots (observations) can be considered a similarity. This is barely the case with vegetation data. For one, the presence of a plant often follows a unimodal, i.e., a non-linear, relationship along a gradient (e.g., humidity, temperature or salinity) with a peak at the most favorable conditions and declining ends towards the unfavorable conditions. Secondly, the joint absence of a species in two plots is hardly an indication for similarity. Suppose a plant species is absent from the driest (e.g., an extreme desert) and the moistest locations (e.g., a tree savanna) of our sampling. Then we really should refrain from counting this as a similarity because it is very likely that the only thing these two completely different environmental settings have in common in terms of floristic composition is the shared absence of species (except for rare ubiquitous species). NMDS is one popular dimension-reducing technique used in ecology (von Wehrden et al. 2009). NMDS reduces the rank-based differences between distances between objects in the original matrix and distances between the ordinated objects. The difference is expressed as stress. The lower the stress value, the better the ordination, i.e., the low-dimensional representation of the original matrix. Stress values lower than 10 represent an excellent fit, stress values of around 15 are still good, and values greater than 20 represent a poor fit (McCune, Grace, and Urban 2002). In R, metaMDS() of the vegan package can execute a NMDS. As input, it expects a community matrix with the sites as rows and the species as columns. Often ordinations using presence-absence data yield better results (in terms of explained variance) though the prize is, of course, a less informative input matrix (see also Exercises). decostand() converts numerical observations into presences and absences with 1 indicating the occurrence of a species and 0 the absence of a species. Ordination techniques such as NMDS require at least one observation per site. Hence, we need to dismiss all sites in which no species were found. # presence-absence matrix pa = vegan::decostand(comm, "pa") # 100 rows (sites), 69 columns (species) # keep only sites in which at least one species was found pa = pa[rowSums(pa) != 0, ] # 84 rows, 69 columns The resulting matrix serves as input for the NMDS. k specifies the number of output axes, here, set to 4.103 NMDS is an iterative procedure trying to make the ordinated space more similar to the input matrix in each step. To make sure that the algorithm converges, we set the number of steps to 500 using the try parameter. set.seed(25072018) nmds = vegan::metaMDS(comm = pa, k = 4, try = 500) nmds$stress #> ... #> Run 498 stress 0.08834745 #> ... Procrustes: rmse 0.004100446 max resid 0.03041186 #> Run 499 stress 0.08874805 #> ... Procrustes: rmse 0.01822361 max resid 0.08054538 #> Run 500 stress 0.08863627 #> ... Procrustes: rmse 0.01421176 max resid 0.04985418 #> *** Solution reached #> 0.08831395 A stress value of 9 represents a very good result, which means that the reduced ordination space represents the large majority of the variance of the input matrix. Overall, NMDS puts objects that are more similar (in terms of species composition) closer together in ordination space. However, as opposed to most other ordination techniques, the axes are arbitrary and not necessarily ordered by importance (Borcard, Gillet, and Legendre 2011). However, we already know that humidity represents the main gradient in the study area (Muenchow, Bräuning, et al. 2013; Muenchow, Schratz, and Brenning 2017). Since humidity is highly correlated with elevation, we rotate the NMDS axes in accordance with elevation (see also ?MDSrotate for more details on rotating NMDS axes). Plotting the result reveals that the first axis is, as intended, clearly associated with altitude (Figure 15.3). elev = dplyr::filter(random_points, id %in% rownames(pa)) |> dplyr::pull(dem) # rotating NMDS in accordance with altitude (proxy for humidity) rotnmds = vegan::MDSrotate(nmds, elev) # extracting the first two axes sc = vegan::scores(rotnmds, choices = 1:2, display = "sites") # plotting the first axis against altitude plot(y = sc[, 1], x = elev, xlab = "elevation in m", ylab = "First NMDS axis", cex.lab = 0.8, cex.axis = 0.8) FIGURE 15.3: Plotting the first NMDS axis against altitude. The scores of the first NMDS axis represent the different vegetation formations, i.e., the floristic gradient, appearing along the slope of Mt. Mongón. To spatially visualize them, we can model the NMDS scores with the previously created predictors (Section 15.2), and use the resulting model for predictive mapping (see Section 15.4). 15.4 Modeling the floristic gradi'
