title = "Chapter 8 Geographic data I/O | Geocomputation with R"
description = "Prerequisites This chapter requires the following packages: library(sf) library(terra) library(dplyr) library(spData)  8.1 Introduction This chapter is about reading and writing geographic data...."
full_description = '''8 Geographic data I/O Prerequisites This chapter requires the following packages: library(sf) library(terra) library(dplyr) library(spData) 8.1 Introduction This chapter is about reading and writing geographic data. Geographic data input is essential for geocomputation: real-world applications are impossible without data. Data output is also vital, enabling others to use valuable new or improved datasets resulting from your work. Taken together, these processes of input/output can be referred to as data I/O. Geographic data I/O is often done in haste at the beginning and end of projects and otherwise ignored. However, data import and export are fundamental to the success or otherwise of projects: small I/O mistakes made at the beginning of projects (e.g., using an out-of-date dataset) can lead to large problems down the line. There are many geographic file formats, each with its own advantages and disadvantages, as described in Section 8.2. Reading and writing from and to these file formats is covered in Sections 8.3 and 8.4, respectively. In terms of where to find data, Section 8.5 describes geoportals and how to import data from them. Dedicated packages to ease geographic data import, from sources including OpenStreetMap, are described in Section 8.6. If you want to put your data ‘into production’ in web services (or if you want to be sure that your data adheres to established standards), geographic metadata is important, as described in Section 8.7. Another possibility to obtain spatial data is to use web services, outlined in Section 8.8. The final Section 8.9 demonstrates methods for saving visual outputs (maps), in preparation for Chapter 9 on visualization. 8.2 File formats Geographic datasets are usually stored as files or in spatial databases. File formats can either store vector or raster data, while spatial databases such as PostGIS can store both (see also Section 10.7). Today the variety of file formats may seem bewildering, but there has been much consolidation and standardization since the beginnings of GIS software in the 1960s when the first widely distributed program (SYMAP) for spatial analysis was created at Harvard University (Coppock and Rhind 1991). GDAL (which should be pronounced “goo-dal”, with the double “o” making a reference to object-orientation), Geospatial Data Abstraction Library, has resolved many issues associated with incompatibility between geographic file formats since its release in 2000. GDAL provides a unified and high-performance interface for reading and writing many raster and vector data formats.40 Many open and proprietary GIS programs, including GRASS GIS, ArcGIS and QGIS, use GDAL behind their GUIs for doing the legwork of ingesting and spitting out geographic data in appropriate formats. GDAL provides access to more than 200 vector and raster data formats. Table 8.1 presents some basic information about selected and often used spatial file formats. TABLE 8.1: TABLE 8.2: Selected spatial file formats. Name Extension Information Type Model ESRI Shapefile .shp (the main file) Popular format consisting of at least three files. No support for: files > 2 GB; mixed types; names > 10 chars; cols > 255. Vector Partially open GeoJSON .geojson Extends the JSON exchange format by including a subset of the simple feature representation; mostly used for storing coordinates in longitude and latitude; it is extended by the TopoJSON format. Vector Open KML .kml XML-based format for spatial visualization, developed for use with Google Earth. Zipped KML file forms the KMZ format. Vector Open GPX .gpx XML schema created for exchange of GPS data. Vector Open FlatGeobuf .fgb Single file format allowing for quick reading and writing of vector data. Has streaming capabilities. Vector Open GeoTIFF .tif/.tiff Popular raster format. A TIFF file containing additional spatial metadata. Raster Open Arc ASCII .asc Text format where the first six lines represent the raster header, followed by the raster cell values arranged in rows and columns. Raster Open SQLite/SpatiaLite .sqlite Standalone relational database, SpatiaLite is the spatial extension of SQLite. Vector and raster Open ESRI FileGDB .gdb Spatial and non-spatial objects created by ArcGIS. Allows multiple feature classes; topology. Limited support from GDAL. Vector and raster Proprietary GeoPackage .gpkg Lightweight database container based on SQLite allowing an easy and platform-independent exchange of geodata. Vector and (very limited) raster Open An important development ensuring the standardization and open-sourcing of file formats was the founding of the Open Geospatial Consortium (OGC) in 1994. Beyond defining the simple features data model (see Section 2.2.1), the OGC also coordinates the development of open standards, for example as used in file formats such as GML, KML and GeoPackage. Open file formats of the kind endorsed by the OGC have several advantages over proprietary formats: the standards are published, ensure transparency and open up the possibility for users to further develop and adjust the file formats to their specific needs. ESRI Shapefile is the most popular vector data exchange format; however, it is not an open format (though its specification is open). It was developed in the early 1990s and has a number of limitations. First of all, it is a multi-file format, which consists of at least three files. It only supports 255 columns, column names are restricted to ten characters and the file size limit is 2 GB. Furthermore, ESRI Shapefile does not support all possible geometry types, for example, it is unable to distinguish between a polygon and a multipolygon.41 Despite these limitations, a viable alternative had been missing for a long time. In recent years, GeoPackage emerged, and seems to be a more than suitable replacement candidate for ESRI Shapefile. Geopackage is a format for exchanging geospatial information and an OGC standard. The GeoPackage standard describes the rules on how to store geospatial information in a tiny SQLite container. Hence, GeoPackage is a lightweight spatial database container, which allows the storage of vector and raster data but also of non-spatial data and extensions. Aside from GeoPackage, there are other geospatial data exchange formats worth checking out (Table 8.1). The GeoTIFF format seems to be the most prominent raster data format. It allows spatial information, such as CRS, to be embedded within a TIFF file. Similar to ESRI Shapefile, this format was first developed in the 1990s, but as an open format. Additionally, GeoTIFF is still being expanded and improved. One of the most significant recent additions to the GeoTIFF format is its variant called COG (Cloud Optimized GeoTIFF). Raster objects saved as COGs can be hosted on HTTP servers, so other people can read only parts of the file without downloading the whole file (see Sections 8.3.2 and 8.4.2). There are many geographic file formats beyond those shown in Table 8.1 and new data formats capable of representing geographic are being developed. Recent examples are formats based on the GeoArrow and Zarr specifications. GDAL’s documentation provides a good resource for learning about other vector and raster drivers. Furthermore, some data formats can store other data models (types) beyond the vector and raster data models introduced in Section 2.2.1. It includes LAS and LAZ formats for storing lidar point clouds, and NetCDF and HDF for storing multidimensional arrays. Spatial data is also often stored using tabular (non-spatial) text formats, including CSV files or Excel spreadsheets. For example, this can be convenient to share spatial samples with people who do not use GIS tools or exchange data with other software that does not accept spatial data formats. However, this approach has downsides: it is challenging for storing geometries that are more complex than POINTs and omits important spatial metadata such as the CRS. 8.3 Data input (I) Executing commands such as sf::read_sf() (the main function we use for loading vector data) or terra::rast() (the main function used for loading raster data) silently sets off a chain of events that reads data from files. Many R packages provide example datasets (e.g., the dataset spData::world that we used in earlier chapters) and functions to get geographic datasets from a range of data sources. All of them load the data into R or, more precisely, assign objects to your workspace. This means that when objects are imported into R they are stored in RAM42, can be listed with ls() (and should be viewable in ‘Environment’ panels in your development environement) and can be accessed from the .GlobalEnv of the R session. 8.3.1 Vector data Spatial vector data comes in a wide variety of file formats. Most popular representations such as .geojson and .gpkg files can be imported directly into R with the sf function read_sf() (or the equivalent st_read()), which uses GDAL’s vector drivers behind the scenes. The st_drivers() function returns a data frame containing name and long_name in the first two columns, and features of each driver available to GDAL (and therefore sf), including ability to write data and store raster data in the subsequent columns, as illustrated for key file formats in Table 8.3. TABLE 8.3: TABLE 8.4: Popular drivers/formats for reading/writing vector data. name long_name write copy is_raster is_vector vsi ESRI Shapefile ESRI Shapefile TRUE FALSE FALSE TRUE TRUE GPX GPX TRUE FALSE FALSE TRUE TRUE KML Keyhole Markup Language (KML) TRUE FALSE FALSE TRUE TRUE GeoJSON GeoJSON TRUE FALSE FALSE TRUE TRUE GPKG GeoPackage TRUE TRUE TRUE TRUE TRUE FlatGeobuf FlatGeobuf TRUE FALSE FALSE TRUE TRUE The following commands show the first three drivers reported the computer’s GDAL installation (results can vary depending on the GDAL version installed) and a summary of their features. Note that the majority of drivers can write data, while only a dozen or so formats can efficiently represent raster data in addition to vector data (see ?st_drivers() for details): sf_drivers = st_drivers() head(sf_drivers, n = 3) summary(sf_drivers[-c(1:2)]) The first argument of read_sf() is dsn, which should be a text string or an object containing a single text string. The content of a text string could vary between different drivers. In most cases, as with the ESRI Shapefile (.shp) or the GeoPackage format (.gpkg), the dsn would be a file name. read_sf() guesses the driver based on the file extension, as illustrated for a .gpkg file below: f = system.file("shapes/world.gpkg", package = "spData") world = read_sf(f) For some drivers, dsn could be provided as a folder name, access credentials for a database, or a GeoJSON string representation (see the examples of the read_sf() help page for more details). Some vector driver formats can store multiple data layers. By default, read_sf() automatically reads the first layer of the file specified in dsn; however, using the layer argument you can specify any other layer. The read_sf() function also allows for reading just parts of the file into RAM with two possible mechanisms. The first one is related to the query argument, which allows specifying what part of the data to read with the OGR SQL query text. An example below extracts data for Tanzania only (Figure 8.1A). It is done by specifying that we want to get all columns (SELECT *) from the "world" layer for which the name_long is equal to "Tanzania": tanzania = read_sf(f, query = 'SELECT * FROM world WHERE name_long = "Tanzania"') If you do not know the names of the available columns, a good approach is to just read one row of the data with 'SELECT * FROM world WHERE FID = 1'. FID represents a feature ID – most often, it is a row number; however, its values depend on the used file format. For example, FID starts from 0 in ESRI Shapefile, from 1 in some other file formats, or can be even arbitrary. The second mechanism uses the wkt_filter argument. This argument expects a well-known text representing a study area for which we want to extract the data. Let’s try it using a small example – we want to read polygons from our file that intersect with the buffer of 50,000 meters of Tanzania’s borders. To do it, we need to prepare our “filter” by (a) creating the buffer (Section 5.2.3), (b) converting the sf buffer object into an sfc geometry object with st_geometry(), and (c) translating geometries into their well-known text representation with st_as_text(): tanzania_buf = st_buffer(tanzania, 50000) tanzania_buf_geom = st_geometry(tanzania_buf) tanzania_buf_wkt = st_as_text(tanzania_buf_geom) Now, we can apply this “filter” using the wkt_filter argument. tanzania_neigh = read_sf(f, wkt_filter = tanzania_buf_wkt) Our result, shown in Figure 8.1(B), contains Tanzania and every country within its 50-km buffer. FIGURE 8.1: Reading a subset of the vector data using (A) a query and (B) a wkt filter. Naturally, some options are specific to certain drivers.43 For example, think of coordinates stored in a spreadsheet format (.csv). To read-in such files as spatial objects, we naturally have to specify the names of the columns (X and Y in our example below) representing the coordinates. We can do this with the help of the options parameter. To find out about possible options, please refer to the ‘Open Options’ section of the corresponding GDAL driver description. For the comma-separated value (csv) format, visit https://gdal.org/drv_csv.html. cycle_hire_txt = system.file("misc/cycle_hire_xy.csv", package = "spData") cycle_hire_xy = read_sf(cycle_hire_txt, options = c("X_POSSIBLE_NAMES=X", "Y_POSSIBLE_NAMES=Y")) Instead of columns describing ‘XY’ coordinates, a single column can also contain the geometry information. Well-known text (WKT), well-known binary (WKB), and the GeoJSON formats are examples of this. For instance, the world_wkt.csv file has a column named WKT representing polygons of the world’s countries. We will again use the options parameter to indicate this. world_txt = system.file("misc/world_wkt.csv", package = "spData") world_wkt = read_sf(world_txt, options = "GEOM_POSSIBLE_NAMES=WKT") Not all of the supported vector file formats store information about their coordinate reference system. In these situations, it is possible to add the missing information using the st_set_crs() function. Please refer also to Section 7.3 for more information. As a final example, we will show how read_sf() also reads KML files. A KML file stores geographic information in XML format, which is a data format for the creation of web pages and the transfer of data in an application-independent way (Nolan and Lang 2014). Here, we access a KML file from the web. This file contains more than one layer. st_layers() lists all available layers. We choose the first layer Placemarks and say so with the help of the layer parameter in read_sf(). u = "https://developers.google.com/kml/documentation/KML_Samples.kml" download.file(u, "KML_Sampl'''
author = "Robin Lovelace, Jakub Nowosad, Jannes Muenchow"
