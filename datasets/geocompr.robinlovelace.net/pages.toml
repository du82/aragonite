full_description = '9 Making maps with R Prerequisites This chapter requires the following packages that we have already been using: library(sf) library(terra) library(dplyr) library(spData) library(spDataLarge) The main package used in this chapter is tmap. We recommend you to install its development version from the r-universe repository, which is updated more frequently than the CRAN version: install.packages("tmap", repos = c("https://r-tmap.r-universe.dev", "https://cloud.r-project.org")) It uses the following visualization packages (also install shiny if you want to develop interactive mapping applications): library(tmap) # for static and interactive maps library(leaflet) # for interactive maps library(ggplot2) # tidyverse data visualization package You also need to read-in a couple of datasets as follows for Section 4.3: nz_elev = rast(system.file("raster/nz_elev.tif", package = "spDataLarge")) 9.1 Introduction A satisfying and important aspect of geographic research is communicating the results. Map-making — the art of cartography — is an ancient skill involving communication, attention to detail, and an element of creativity. Static mapping in R is straightforward with the plot() function, as we saw in Section 2.2.3. It is possible to create advanced maps using base R methods (Murrell 2016). The focus of this chapter, however, is cartography with dedicated map-making packages. When learning a new skill, it makes sense to gain depth-of-knowledge in one area before branching out. Map-making is no exception, hence this chapter’s coverage of one package (tmap) in depth rather than many superficially. In addition to being fun and creative, cartography also has important practical applications. A carefully crafted map can be the best way of communicating the results of your work, but poorly designed maps can leave a bad impression. Common design issues include poor placement, size and readability of text and careless selection of colors, as outlined in the style guide of the Journal of Maps. Furthermore, poor map-making can hinder the communication of results (Brewer 2015): Amateur-looking maps can undermine your audience’s ability to understand important information and weaken the presentation of a professional data investigation. Maps have been used for several thousand years for a wide variety of purposes. Historic examples include maps of buildings and land ownership in the Old Babylonian dynasty more than 3000 years ago and Ptolemy’s world map in his masterpiece Geography nearly 2000 years ago (Talbert 2014). Map-making has historically been an activity undertaken only by, or on behalf of, the elite. This has changed with the emergence of open source mapping software such as the R package tmap and the ‘print layout’ in QGIS, which allow anyone to make high-quality maps, enabling ‘citizen science’. Maps are also often the best way to present the findings of geocomputational research in a way that is accessible. Map-making is therefore a critical part of geocomputation and its emphasis is not only on describing, but also changing the world. This chapter shows how to make a wide range of maps. The next section covers a range of static maps, including aesthetic considerations, facets and inset maps. Sections 9.3 to 9.5 cover animated and interactive maps (including web maps and mapping applications). Finally, Section 9.6 covers a range of alternative map-making packages including ggplot2 and cartogram. 9.2 Static maps Static maps are the most common type of visual output from geocomputation. They are usually stored in standard formats including .png and .pdf for graphical raster and vector outputs, respectively. Initially, static maps were the only type of maps that R could produce. Things have advanced with the release of sp (see Pebesma and Bivand 2005), and many map-making techniques, functions, and packages have been developed since then. However, despite the innovation of interactive mapping, static plotting was still the emphasis of geographic data visualization in R a decade later (Cheshire and Lovelace 2015). The generic plot() function is often the fastest way to create static maps from vector and raster spatial objects (see Sections 2.2.3 and 2.3.3). Sometimes, simplicity and speed are priorities, especially during the development phase of a project, and this is where plot() excels. The base R approach is also extensible, with plot() offering dozens of arguments. Another approach is the grid package which allows low-level control of static maps, as illustrated in chapter 14 of Murrell (2016). This part of the book focuses on tmap and emphasizes the essential aesthetic and layout options. tmap is a powerful and flexible map-making package with sensible defaults. It has a concise syntax that allows for the creation of attractive maps with minimal code which will be familiar to ggplot2 users. It also has the unique capability to generate static and interactive maps using the same code via tmap_mode(). Finally, it accepts a wider range of spatial classes (including sf and terra objects) than alternatives such as ggplot2. 9.2.1 tmap basics Like ggplot2, tmap is based on the idea of a ‘grammar of graphics’ (Wilkinson and Wills 2005). This involves a separation between the input data and the aesthetics (how data are visualized): each input dataset can be ‘mapped’ in a range of different ways including location on the map (defined by data’s geometry), color, and other visual variables. The basic building block is tm_shape() (which defines input data: a vector or raster object), followed by one or more layer elements such as tm_fill() and tm_dots(). This layering is demonstrated in the chunk below, which generates the maps presented in Figure 9.1: # Add fill layer to nz shape tm_shape(nz) + tm_fill() # Add border layer to nz shape tm_shape(nz) + tm_borders() # Add fill and border layers to nz shape tm_shape(nz) + tm_fill() + tm_borders() FIGURE 9.1: New Zealand’s shape plotted with fill (left), border (middle) and fill and border (right) layers added using tmap functions. The object passed to tm_shape() in this case is nz, an sf object representing the regions of New Zealand (see Section 2.2.1 for more on sf objects). Layers are added to represent nz visually, with tm_fill() and tm_borders() creating shaded areas (left panel) and border outlines (middle panel) in Figure 9.1, respectively. This is an intuitive approach to map-making: the common task of adding new layers is undertaken by the addition operator +, followed by tm_*(). The asterisk (*) refers to a wide range of layer types which have self-explanatory names including: tm_fill(): shaded areas for (multi)polygons tm_borders(): border outlines for (multi)polygons tm_polygons(): both, shaded areas and border outlines for (multi)polygons tm_lines(): lines for (multi)linestrings tm_symbols(): symbols for (multi)points, (multi)linestrings, and (multi)polygons tm_raster(): colored cells of raster data (there is also tm_rgb() for rasters with three layers) tm_text(): text information for (multi)points, (multi)linestrings, and (multi)polygons This layering is illustrated in the right panel of Figure 9.1, the result of adding a border on top of the fill layer. qtm() is a handy function to create quick thematic maps (hence the snappy name). It is concise and provides a good default visualization in many cases: qtm(nz), for example, is equivalent to tm_shape(nz) + tm_fill() + tm_borders(). Further, layers can be added concisely using multiple qtm() calls, such as qtm(nz) + qtm(nz_height). The disadvantage is that it makes aesthetics of individual layers harder to control, explaining why we avoid teaching it in this chapter. 9.2.2 Map objects A useful feature of tmap is its ability to store objects representing maps. The code chunk below demonstrates this by saving the last plot in Figure 9.1 as an object of class tmap (note the use of tm_polygons() which condenses tm_fill() + tm_borders() into a single function): map_nz = tm_shape(nz) + tm_polygons() class(map_nz) #> [1] "tmap" map_nz can be plotted later, for example by adding other layers (as shown below) or simply running map_nz in the console, which is equivalent to print(map_nz). New shapes can be added with + tm_shape(new_obj). In this case, new_obj represents a new spatial object to be plotted on top of preceding layers. When a new shape is added in this way, all subsequent aesthetic functions refer to it, until another new shape is added. This syntax allows the creation of maps with multiple shapes and layers, as illustrated in the next code chunk which uses the function tm_raster() to plot a raster layer (with col_alpha set to make the layer semi-transparent): map_nz1 = map_nz + tm_shape(nz_elev) + tm_raster(col_alpha = 0.7) Building on the previously created map_nz object, the preceding code creates a new map object map_nz1 that contains another shape (nz_elev) representing average elevation across New Zealand (see Figure 9.2, left). More shapes and layers can be added, as illustrated in the code chunk below which creates nz_water, representing New Zealand’s territorial waters, and adds the resulting lines to an existing map object. nz_water = st_union(nz) |> st_buffer(22200) |> st_cast(to = "LINESTRING") map_nz2 = map_nz1 + tm_shape(nz_water) + tm_lines() There is no limit to the number of layers or shapes that can be added to tmap objects, and the same shape can even be used multiple times. The final map illustrated in Figure 9.2 is created by adding a layer representing high points (stored in the object nz_height) onto the previously created map_nz2 object with tm_symbols() (see ?tm_symbols for details on tmap’s point plotting functions). The resulting map, which has four layers, is illustrated in the right-hand panel of Figure 9.2: map_nz3 = map_nz2 + tm_shape(nz_height) + tm_symbols() A useful and little known feature of tmap is that multiple map objects can be arranged in a single ‘metaplot’ with tmap_arrange(). This is demonstrated in the code chunk below which plots map_nz1 to map_nz3, resulting in Figure 9.2. tmap_arrange(map_nz1, map_nz2, map_nz3) FIGURE 9.2: Maps with added layers to the final map of Figure 9.1. More elements can also be added with the + operator. Aesthetic settings, however, are controlled by arguments to layer functions. 9.2.3 Visual variables The plots in the previous section demonstrate tmap’s default aesthetic settings. Gray shades are used for tm_fill() and tm_symbols() layers and a continuous black line is used to represent lines created with tm_lines(). Of course, these default values and other aesthetics can be overridden. The purpose of this section is to show how. There are two main types of map aesthetics: those that change with the data and those that are constant. Unlike ggplot2, which uses the helper function aes() to represent variable aesthetics, tmap accepts a few aesthetic arguments, depending on a selected layer type: fill: fill color of a polygon col: color of a polygon border, line, point, or raster lwd: line width lty: line type size: size of a symbol shape: shape of a symbol Additionally, we may customize the fill and border color transparency using fill_alpha and col_alpha. To map a variable to an aesthetic, pass its column name to the corresponding argument, and to set a fixed aesthetic, pass the desired value instead.49 The impact of setting these with fixed values is illustrated in Figure 9.3. ma1 = tm_shape(nz) + tm_polygons(fill = "red") ma2 = tm_shape(nz) + tm_polygons(fill = "red", fill_alpha = 0.3) ma3 = tm_shape(nz) + tm_polygons(col = "blue") ma4 = tm_shape(nz) + tm_polygons(lwd = 3) ma5 = tm_shape(nz) + tm_polygons(lty = 2) ma6 = tm_shape(nz) + tm_polygons(fill = "red", fill_alpha = 0.3, col = "blue", lwd = 3, lty = 2) tmap_arrange(ma1, ma2, ma3, ma4, ma5, ma6) FIGURE 9.3: Impact of changing commonly used fill and border aesthetics to fixed values. Like base R plots, arguments defining aesthetics can also receive values that vary. Unlike the base R code below (which generates the left panel in Figure 9.4), tmap aesthetic arguments will not accept a numeric vector: plot(st_geometry(nz), col = nz$Land_area) # works tm_shape(nz) + tm_fill(fill = nz$Land_area) # fails #> Error: palette should be a character value Instead fill (and other aesthetics that can vary such as lwd for line layers and size for point layers) requires a character string naming an attribute associated with the geometry to be plotted. Thus, one would achieve the desired result as follows (Figure 9.4, right panel): tm_shape(nz) + tm_fill(fill = "Land_area") FIGURE 9.4: Comparison of base (left) and tmap (right) handling of a numeric color field. Each visual variable has three related additional arguments, with suffixes of .scale, .legend, and .free. For example, the tm_fill() function has arguments such as fill, fill.scale, fill.legend, and fill.free. The .scale argument determines how the provided values are represented on the map and in the legend (Section 9.2.4), while the .legend argument is used to customize the legend settings, such as its title, orientation, or position (Section 9.2.5). The .free argument is relevant only for maps with many facets to determine if each facet has the same or different scale and legend. 9.2.4 Scales Scales control how the values are represented on the map and in the legend, and they largely depend on the selected visual variable. For example, when our visual variable is col, then col.scale controls how the colors of spatial objects are related to the provided values; and when our visual variable is size, then size.scale controls how the sizes represent the provided values. By default, the used scale is tm_scale(), which selects the visual settings automatically given by the input data type (factor, numeric, and integer). Let’s see how the scales work by customizing polygons’ fill colors. Color settings are an important part of map design – they can have a major impact on how spatial variability is portrayed as illustrated in Figure 9.5. This figure shows four ways of coloring regions in New Zealand depending on median income, from left to right (and demonstrated in the code chunk below): The default setting uses ‘pretty’ breaks, described in the next paragraph breaks allows you to manually set the breaks n sets the number of bins into which numeric variables are categorized values defines the color scheme, for example, BuGn tm_shape(nz) + tm_polygons(fill = "Median_income") tm_shape(nz) + tm_polygons(fill = "Median_income", fill.scale = tm_scale(breaks = c(0, 30000, 40000, 50000))) tm_shape(nz) + tm_polygons(fill = "Median_income", fill.scale = tm_scale(n = 10)) tm_shape(nz) + tm_polygons(fill = "Median_income", fill.scale = tm_scale(values = "BuGn")) FIGURE 9.5: Color settings. The results show (from left to right): default settings, manual breaks, n breaks, and the impact of changing the palette. All of the above arguments (breaks, n, and values) also'
