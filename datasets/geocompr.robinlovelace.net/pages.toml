title = "Chapter 5 Geometry operations | Geocomputation with R"
description = "Prerequisites This chapter uses the same packages as Chapter 4 but with the addition of spDataLarge, which was installed in Chapter 2: library(sf) library(terra) library(dplyr) library(spData)..."
full_description = '5 Geometry operations Prerequisites This chapter uses the same packages as Chapter 4 but with the addition of spDataLarge, which was installed in Chapter 2: library(sf) library(terra) library(dplyr) library(spData) library(spDataLarge) 5.1 Introduction So far the book has explained the structure of geographic datasets (Chapter 2), and how to manipulate them based on their non-geographic attributes (Chapter 3) and spatial relations (Chapter 4). This chapter focuses on manipulating the geographic elements of spatial objects, for example by creating buffers, simplifying and converting vector geometries, and aggregating and resampling raster data. After reading it — and attempting the Exercises at the end — you should understand and have control over the geometry column in sf objects and the extent and geographic location of pixels represented in rasters in relation to other geographic objects. Section 5.2 covers transforming vector geometries with ‘unary’ and ‘binary’ operations. Unary operations work on a single geometry in isolation, including simplification (of lines and polygons), the creation of buffers and centroids, and shifting/scaling/rotating single geometries using ‘affine transformations’ (Sections 5.2.1 to 5.2.4). Binary transformations modify one geometry based on the shape of another, including clipping and geometry unions, covered in Sections 5.2.5 to 5.2.7. Type transformations (from a polygon to a line, for example) are demonstrated in Section 5.2.8. Section 5.3 covers geometric transformations on raster objects. This involves changing the size and number of the underlying pixels, and assigning them new values. It teaches how to change the resolution (also called raster aggregation and disaggregation), the extent and the origin of a raster. These operations are especially useful if one would like to align raster datasets from diverse sources. Aligned raster objects share a one-to-one correspondence between pixels, allowing them to be processed using map algebra operations, described in Section 4.3.2. The interaction between raster and vector objects is covered in Chapter 6. It presents how raster values can be ‘masked’ and ‘extracted’ by vector geometries. Importantly it also shows how to ‘polygonize’ rasters and ‘rasterize’ vector datasets, making the two data models more interchangeable. 5.2 Geometric operations on vector data This section is about operations that in some way change the geometry of vector (sf) objects. It is more advanced than the spatial data operations presented in the previous chapter (Section 4.2), because here we drill down into the geometry: the functions discussed in this section work on objects of class sfc in addition to objects of class sf. 5.2.1 Simplification Simplification is a process for generalization of vector objects (lines and polygons) usually for use in smaller scale maps. Another reason for simplifying objects is to reduce the amount of memory, disk space and network bandwidth they consume: it may be wise to simplify complex geometries before publishing them as interactive maps. The sf package provides st_simplify(), which uses the Douglas-Peucker algorithm to reduce the vertex count. st_simplify() uses the dTolerance to control the level of generalization in map units (see Douglas and Peucker 1973 for details). Figure 5.1 illustrates simplification of a LINESTRING geometry representing the River Seine and tributaries. The simplified geometry was created by the following command: seine_simp = st_simplify(seine, dTolerance = 2000) # 2000 m FIGURE 5.1: Comparison of the original and simplified geometry of the seine object. The resulting seine_simp object is a copy of the original seine but with fewer vertices. This is apparent, with the result being visually simpler (Figure 5.1, right) and consuming less memory than the original object, as verified below: object.size(seine) #> 18096 bytes object.size(seine_simp) #> 9112 bytes Simplification is also applicable for polygons. This is illustrated using us_states, representing the contiguous United States. us_states_simp1 = st_simplify(us_states, dTolerance = 100000) # 100 km A limitation with st_simplify() is that it simplifies objects on a per-geometry basis. This means the ‘topology’ is lost, resulting in overlapping and ‘holey’ areal units illustrated in Figure 5.2 (right top panel). ms_simplify() from rmapshaper provides an alternative. By default it uses the Visvalingam algorithm, which overcomes some limitations of the Douglas-Peucker algorithm (Visvalingam and Whyatt 1993). The following code chunk uses this function to simplify us_states. The result has only 1% of the vertices of the input (set using the argument keep), but its number of objects remains intact because we set keep_shapes = TRUE:22 # proportion of points to retain (0-1; default 0.05) us_states_simp2 = rmapshaper::ms_simplify(us_states, keep = 0.01, keep_shapes = TRUE) An alternative process to simplification is smoothing the boundaries of polygon and linestring geometries, which is implemented in the smoothr package. Smoothing interpolates the edges of geometries and does not necessarily lead to fewer vertices, but can be especially useful when working with geometries that arise from spatially vectorizing a raster (a topic covered in Chapter 6). smoothr implements three techniques for smoothing: a Gaussian kernel regression, Chaikin’s corner cutting algorithm, and spline interpolation, which are all described in the package vignette and website. Note that similar to st_simplify(), the smoothing algorithms don’t preserve ‘topology’. The workhorse function of smoothr is smooth(), where the method argument specifies what smoothing technique to use. Below is an example of using Gaussian kernel regression to smooth the borders of US states by using method=ksmooth. The smoothness argument controls the bandwidth of the Gaussian that is used to smooth the geometry and has a default value of 1. us_states_simp3 = smoothr::smooth(us_states, method = "ksmooth", smoothness = 6) Finally, the visual comparison of the original dataset with the simplified and smoothed versions is shown in Figure 5.2. Differences can be observed between the outputs of the Douglas-Peucker (st_simplify), Visvalingam (ms_simplify), and Gaussian kernel regression (smooth(method=ksmooth) algorithms. FIGURE 5.2: Polygon simplification in action, comparing the original geometry of the contiguous United States with simplified versions, generated with functions from sf (top-right), rmapshaper (bottom-left), and smoothr (bottom-right) packages. 5.2.2 Centroids Centroid operations identify the center of geographic objects. Like statistical measures of central tendency (including mean and median definitions of ‘average’), there are many ways to define the geographic center of an object. All of them create single point representations of more complex vector objects. The most commonly used centroid operation is the geographic centroid. This type of centroid operation (often referred to as ‘the centroid’) represents the center of mass in a spatial object (think of balancing a plate on your finger). Geographic centroids have many uses, for example to create a simple point representation of complex geometries, or to estimate distances between polygons. They can be calculated with the sf function st_centroid() as demonstrated in the code below, which generates the geographic centroids of regions in New Zealand and tributaries to the River Seine, illustrated with black points in Figure 5.3. nz_centroid = st_centroid(nz) seine_centroid = st_centroid(seine) Sometimes the geographic centroid falls outside the boundaries of their parent objects (think of a doughnut). In such cases point on surface operations can be used to guarantee the point will be in the parent object (e.g., for labeling irregular multipolygon objects such as island states), as illustrated by the red points in Figure 5.3. Notice that these red points always lie on their parent objects. They were created with st_point_on_surface() as follows:23 nz_pos = st_point_on_surface(nz) seine_pos = st_point_on_surface(seine) FIGURE 5.3: Centroids (black points) and ‘points on surface’ (red points) of New Zealand’s regions (left) and the Seine (right) datasets. Other types of centroids exist, including the Chebyshev center and the visual center. We will not explore these here, but it is possible to calculate them using R, as we’ll see in Chapter 11. 5.2.3 Buffers Buffers are polygons representing the area within a given distance of a geometric feature: regardless of whether the input is a point, line or polygon, the output is a polygon. Unlike simplification (which is often used for visualization and reducing file size), buffering tends to be used for geographic data analysis. How many points are within a given distance of this line? Which demographic groups are within travel distance of this new shop? These kinds of questions can be answered and visualized by creating buffers around the geographic entities of interest. Figure 5.4 illustrates buffers of different sizes (5 and 50 km) surrounding the River Seine and tributaries. These buffers were created with commands below, which show that the command st_buffer() requires at least two arguments: an input geometry and a distance, provided in the units of the CRS (in this case meters). seine_buff_5km = st_buffer(seine, dist = 5000) seine_buff_50km = st_buffer(seine, dist = 50000) FIGURE 5.4: Buffers around the Seine dataset of 5 km (left) and 50 km (right). Note the colors, which reflect the fact that one buffer is created per geometry feature. The st_buffer() has a few additional arguments. The most important ones are: nQuadSegs (when the GEOS engine is used), which means ‘number of segments per quadrant’ and is set by default to 30 (meaning circles created by buffers are composed of \(4 \times 30 = 120\) lines). Unusual cases where it may be useful include when the memory consumed by the output of a buffer operation is a major concern (in which case it should be reduced) or when very high precision is needed (in which case it should be increased) max_cells (when the S2 engine is used), the larger the value, the more smooth the buffer will be, but the calculations will take longer endCapStyle and joinStyle (when the GEOS engine is used), which control the appearance of the buffer’s edges singleSide (when the GEOS engine is used), which controls whether the buffer is created on one or both sides of the input geometry 5.2.4 Affine transformations Affine transformation is any transformation that preserves lines and parallelism. However, angles or length are not necessarily preserved. Affine transformations include, among others, shifting (translation), scaling and rotation. Additionally, it is possible to use any combination of these. Affine transformations are an essential part of geocomputation. For example, shifting is needed for labels placement, scaling is used in non-contiguous area cartograms (see Section 9.6), and many affine transformations are applied when reprojecting or improving the geometry that was created based on a distorted or wrongly projected map. The sf package implements affine transformation for objects of classes sfg and sfc. nz_sfc = st_geometry(nz) Shifting moves every point by the same distance in map units. It could be done by adding a numerical vector to a vector object. For example, the code below shifts all y-coordinates by 100,000 meters to the north, but leaves the x-coordinates untouched (Figure 5.5, left panel). nz_shift = nz_sfc + c(0, 100000) Scaling enlarges or shrinks objects by a factor. It can be applied either globally or locally. Global scaling increases or decreases all coordinates values in relation to the origin coordinates, while keeping all geometries topological relations intact. It can be done by subtraction or multiplication of a sfg or sfc object. Local scaling treats geometries independently and requires points around which geometries are going to be scaled, e.g., centroids. In the example below, each geometry is shrunk by a factor of two around the centroids (Figure 5.5, middle panel). To achieve that, each object is firstly shifted in a way that its center has coordinates of 0, 0 ((nz_sfc - nz_centroid_sfc)). Next, the sizes of the geometries are reduced by half (* 0.5). Finally, each object’s centroid is moved back to the input data coordinates (+ nz_centroid_sfc). nz_centroid_sfc = st_centroid(nz_sfc) nz_scale = (nz_sfc - nz_centroid_sfc) * 0.5 + nz_centroid_sfc Rotation of two-dimensional coordinates requires a rotation matrix: \[ R = \begin{bmatrix} \cos \theta & -\sin \theta \\ \sin \theta & \cos \theta \\ \end{bmatrix} \] It rotates points in a clockwise direction. The rotation matrix can be implemented in R as: rotation = function(a){ r = a * pi / 180 #degrees to radians matrix(c(cos(r), sin(r), -sin(r), cos(r)), nrow = 2, ncol = 2) } The rotation function accepts one argument a — a rotation angle in degrees. Rotation could be done around selected points, such as centroids (Figure 5.5, right panel). See vignette("sf3") for more examples. nz_rotate = (nz_sfc - nz_centroid_sfc) * rotation(30) + nz_centroid_sfc FIGURE 5.5: Affine transformations: shift, scale and rotate. Finally, the newly created geometries can replace the old ones with the st_set_geometry() function: nz_scale_sf = st_set_geometry(nz, nz_scale) 5.2.5 Clipping Spatial clipping is a form of spatial subsetting that involves changes to the geometry columns of at least some of the affected features. Clipping can only apply to features more complex than points: lines, polygons and their ‘multi’ equivalents. To illustrate the concept, we will start with a simple example: two overlapping circles with a center point one unit away from each other and a radius of one (Figure 5.6). b = st_sfc(st_point(c(0, 1)), st_point(c(1, 1))) # create 2 points b = st_buffer(b, dist = 1) # convert points to circles plot(b, border = "gray") text(x = c(-0.5, 1.5), y = 1, labels = c("x", "y"), cex = 3) # add text FIGURE 5.6: Overlapping circles. Imagine you want to select not one circle or the other, but the space covered by both x and y. This can be done using the function st_intersection(), illustrated using objects named x and y which represent the left- and right-hand circles (Figure 5.7). x = b[1] y = b[2] x_and_y = st_intersection(x, y) plot(b, border = "gray") plot(x_and_y, col = "lightgray", border = "gray", add = TRUE) # intersecting area FIGURE 5.7: Overlapping circles with a gray color indicating intersection between them. The subsequent code chunk demonstrates how this works for all combinations of the ‘Venn’ diagram representing x and y, inspired by Figure 5.1 of the book R for Data Science (Grolemund and Wickham 2016). FIGURE 5.8: Spatial equivalents of logical operators. 5.2.6 Subsetting and clipping Clipping objects can change their geometry, but it can also subset objects, retur'
