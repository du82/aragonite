title = "Chapter 11 Scripts, algorithms and functions | Geocomputation with R"
description = "Prerequisites This chapter has minimal software prerequisites, as it primarily uses base R. Only, the sf package is used to check the results of an algorithm we will develop to calculate the area..."
full_description = '''11 Scripts, algorithms and functions Prerequisites This chapter has minimal software prerequisites, as it primarily uses base R. Only, the sf package is used to check the results of an algorithm we will develop to calculate the area of polygons. In terms of prior knowledge, this chapter assumes you have an understanding of the geographic classes introduced in Chapter 2 and how they can be used to represent a wide range of input file formats (see Chapter 8). 11.1 Introduction Chapter 1 established that geocomputation is not only about using existing tools, but developing new ones, “in the form of shareable R scripts and functions”. This chapter teaches these building blocks of reproducible code. It also introduces low-level geometric algorithms, of the type used in Chapter 10. Reading it should help you to understand how such algorithms work and to write code that can be used many times, by many people, on multiple datasets. The chapter cannot, by itself, make you a skilled programmer. Programming is hard and requires plenty of practice (Abelson, Sussman, and Sussman 1996): To appreciate programming as an intellectual activity in its own right you must turn to computer programming; you must read and write computer programs — many of them. There are strong reasons for learning to program. Although this chapter does not teach programming itself — see resources such as Wickham (2019), Gillespie and Lovelace (2016), and Xiao (2016) which teach programming in R and other languages — it does provide some starting points, focused on geometry data, that could form a good foundation for developing programming skills. The chapter also demonstrates and highlights the importance of reproducibility. The advantages of reproducibility go beyond allowing others to replicate your work: reproducible code is often better in every way than code written to be run only once, including in terms of computational efficiency, ‘scalability’ (the capability of code to run on large datasets) and ease of adapting and maintaining it. Scripts are the basis of reproducible R code, a topic covered in Section 11.2. Algorithms are recipes for modifying inputs using a series of steps, resulting in an output, as described in Section 11.3. To ease sharing and reproducibility, algorithms can be placed into functions. That is the topic of Section 11.4. The example of finding the centroid of a polygon will be used to tie these concepts together. Chapter 5 already introduced a centroid function st_centroid(), but this example highlights how seemingly simple operations are the result of comparatively complex code, affirming the following observation (Wise 2001): One of the most intriguing things about spatial data problems is that things which appear to be trivially easy to a human being can be surprisingly difficult on a computer. The example also reflects a secondary aim of the chapter which, following Xiao (2016), is “not to duplicate what is available out there, but to show how things out there work”. 11.2 Scripts If functions distributed in packages are the building blocks of R code, scripts are the glue that holds them together. Scripts should be stored and executed in a logical order to create reproducible workflows, manually or with workflow automation tools such as targets (Landau 2021). If you are new to programming, scripts may seem intimidating when you first encounter them, but they are simply plain text files. Scripts are usually saved as a file with an extension representing the language they contain, such as .py for scripts written in Python or .rs for scripts written in Rust. R scripts should be saved with a .R extension and named to reflect what they do. An example is 11-hello.R, a script file stored in the code folder of the book’s repository. 11-hello.R is a simple script containing only two lines of code, one of which is a comment: # Aim: provide a minimal R script print("Hello geocompr") The contents of this script are not particularly exciting, but they demonstrate the point: scripts do not need to be complicated. Saved scripts can be called and executed in their entirety from the R command line with the source() function, as demonstrated below. The output of this command shows that the comment is ignored but print() command is executed: source("code/11-hello.R") #> [1] "Hello geocompr" You can also call R scripts from system shells such as bash and PowerShell as follows: Rscript code/11-hello.R If your RScript executable is configured so it is available, the above command will print Hello geocompr in the system shell. There are no strict rules on what can and cannot go into script files and nothing to prevent you from saving broken, non-reproducible code, so testing is important. Lines of code that do not contain valid R should be commented out, by adding a # to the start of the line, to prevent errors, as shown in line 1 of the 11-hello.R script. It is worth following some basic rules: Write the script in order: just like the script of a film, scripts should have a clear order such as ‘setup’, ‘data processing’ and ‘save results’ (roughly equivalent to ‘beginning’, ‘middle’ and ‘end’ in a film). Add comments to the script so other people (and your future self) can understand it: at a minimum, a comment should state the purpose of the script (see Figure 11.1) and (for long scripts) divide it into sections. This can be done in RStudio, for example, with the shortcut Ctrl+Shift+R, which creates ‘foldable’ code section headings Above all, scripts should be reproducible: self-contained scripts that will work on any computer are more useful than scripts that only run on your computer, on a good day. This involves attaching required packages at the beginning, reading-in data from persistent sources (such as a reliable website) and ensuring that previous steps have been taken.79 Unless you organise your code into a package, it is hard to enforce reproducibility in R scripts, but there are tools that can help. By default, RStudio ‘code checks’ R scripts and underlines faulty code with a red wavy line, as shown in Figure 11.1. The repex package is another tool that can help with reproducibility. FIGURE 11.1: Code checking in RStudio. This example, from the script 11-centroid-alg.R, highlights an unclosed curly bracket on line 19. A useful tool for reproducibility is the reprex package. Its main function reprex() tests lines of R code to check if they are reproducible, and it generates markdown output to facilitate communication on sites such as GitHub. See the webpage reprex.tidyverse.org for details. The contents of this section apply to any type of R script. A particular consideration with scripts for geocomputation is that they tend to have external dependencies, such as the GDAL dependency needed for core R packages for working with geographic data, which we made heavy use of in Chapter 8 for data import and export. GIS software dependencies may be needed to run more specialist geoalgorithms, as outlined in Chapter 10. Scripts for working with geographic data also often require input datasets to be available in specific formats. Such dependencies should be mentioned as comments or suitable place in the project of which it is a part, or described as dependencies with tools such as the renv package or Docker. ‘Defensive’ programming techniques and good error messages can save time by checking for dependencies and communicating with users if certain requirements are not met. If statements, implemented with if () in R, can be used to send messages or run lines of code if, and only if, certain conditions are met. The following lines of code, for example, send a message to users if a certain file is missing: if (!file.exists("required_geo_data.gpkg")) { message("No file, required_geo_data.gpkg is missing!") } #> No file, required_geo_data.gpkg is missing! The work undertaken by the 11-centroid-alg.R script is demonstrated in the reproducible example below, which creates a prerequisite object named poly_mat, representing a square with sides 9 units in length. This example shows that source() works with URLs, assuming you have an internet connection. If you do not, the same script can be called with source("code/11-centroid-alg.R"), assuming that you have previously downloaded the github.com/geocompx/geocompr repository and that you are running R from the geocompr folder. poly_mat = cbind( x = c(0, 9, 9, 0, 0), y = c(0, 0, 9, 9, 0) ) # Short URL to code/11-centroid-alg.R in the geocompr repo source("https://t.ly/0nzj") #> [1] "The area is: 81" #> [1] "The coordinates of the centroid are: 4.5, 4.5" 11.3 Geometric algorithms Algorithms can be understood as the computing equivalent of a baking recipe. They are a complete set of instructions which, when undertaken on the inputs result in useful/tasty outcomes. Inputs are ingredients such as flour and sugar in the case of baking, data and input parameters in the case of algorithms. And while tasty cakes may result from a baking recipe, successful algorithms should have computational outcomes with environmental/social/other benefits. Before diving into a reproducible example, the brief history below shows how algorithms relate to scripts (covered in Section 11.2) and functions (which can be used to generalize algorithms and make them more portable and easy-to-use, as we’ll see in Section 11.4). The word “algorithm” originated with the publication of an early math textbook in Baghdad in the year 825. The book was translated into Latin and became so popular that the author’s last name, al-Khwārizmī, “was immortalized as a scientific term: Al-Khwarizmi became Alchoarismi, Algorismi and, eventually, algorithm” (Bellos 2011). In the computing age, algorithm refers to a series of steps that solves a problem, resulting in a predefined output. Inputs must be formally defined in a suitable data structure (Wise 2001). Algorithms often start as flow charts or pseudocode showing the aim of the process before being implemented in code. To ease usability, common algorithms are often packaged inside functions, which may hide some or all of the steps taken (unless you look at the function’s source code, see Section 11.4). Geoalgorithms, such as those we encountered in Chapter 10, are algorithms that take geographic data in and, generally, return geographic results (alternative terms for the same thing include GIS algorithms and geometric algorithms). That may sound simple, but it is a deep subject with an entire academic field, Computational Geometry, dedicated to their study (Berg et al. 2008) and numerous books on the subject. O’Rourke (1998), for example, introduces the subject with a range of progressively harder geometric algorithms using reproducible and freely available C code. An example of a geometric algorithm is one that finds the centroid of a polygon. There are many approaches to centroid calculation, some of which work only on specific types of spatial data. For the purposes of this section, we choose an approach that is easy to visualize: breaking the polygon into many triangles and finding the centroid of each of these, an approach discussed by Kaiser and Morin (1993) alongside other centroid algorithms (and mentioned briefly in O’Rourke 1998). It helps to further break down this approach into discrete tasks before writing any code (subsequently referred to as step 1 to step 4, these could also be presented as a schematic diagram or pseudocode): Divide the polygon into contiguous triangles Find the centroid of each triangle Find the area of each triangle Find the area-weighted mean of triangle centroids These steps may sound straightforward, but converting words into working code requires some work and plenty of trial-and-error, even when the inputs are constrained: The algorithm will only work for convex polygons, which contain no internal angles greater than 180°, no star shapes allowed (packages decido and sfdct can triangulate non-convex polygons using external libraries, as shown in the algorithm vignette hosted at geocompx.org). The simplest data structure representing a polygon is a matrix of x and y coordinates in which each row represents a vertex tracing the polygon’s border in order where the first and last rows are identical (Wise 2001). In this case, we will create a polygon with five vertices in base R, building on an example from GIS Algorithms (Xiao 2016 see github.com/gisalgs for Python code), as illustrated in Figure 11.2: # generate a simple matrix representation of a polygon: x_coords = c(10, 20, 12, 0, 0, 10) y_coords = c(0, 15, 20, 10, 0, 0) poly_mat = cbind(x_coords, y_coords) Now that we have an example dataset, we are ready to undertake step 1 outlined above. The code below shows how this can be done by creating a single triangle (T1), that demonstrates the method; it also demonstrates step 2 by calculating its centroid based on the formula \(1/3(a + b + c)\) where \(a\) to \(c\) are coordinates representing the triangle’s vertices: # create a point representing the origin: Origin = poly_mat[1, ] # create 'triangle matrix': T1 = rbind(Origin, poly_mat[2:3, ], Origin) C1 = (T1[1,] + T1[2,] + T1[3,]) / 3 FIGURE 11.2: Polygon centroid calculation problem. Step 3 is to find the area of each triangle, so a weighted mean accounting for the disproportionate impact of large triangles is accounted for. The formula to calculate the area of a triangle is as follows (Kaiser and Morin 1993): \[ \frac{A_x ( B_y − C_y ) + B_x ( C_y − A_y ) + C_x ( A_y − B_y )}{ 2 } \] Where \(A\) to \(C\) are the triangle’s three points and \(x\) and \(y\) refer to the x and y dimensions. A translation of this formula into R code that works with the data in the matrix representation of a triangle T1 is as follows (the function abs() ensures a positive result): # calculate the area of the triangle represented by matrix T1: abs(T1[1, 1] * (T1[2, 2] - T1[3, 2]) + T1[2, 1] * (T1[3, 2] - T1[1, 2]) + T1[3, 1] * (T1[1, 2] - T1[2, 2])) / 2 #> [1] 85 This code chunk outputs the correct result.80 The problem is that code is clunky and must by retyped if we want to run it on another triangle matrix. To make the code more generalizable, we will see how it can be converted into a function in Section 11.4. Step 4 requires steps 2 and 3 to be undertaken not just on one triangle (as demonstrated above) but on all triangles. This requires iteration to create all triangles representing the polygon, as illustrated in Figure 11.3. lapply() and vapply() are used to iterate over each triangle here because they provide a concise solution in base R:81 i = 2:(nrow(poly_mat) - 2) T_all = lapply(i, function(x) { rbind(Origin, poly_mat[x:(x + 1), ], Origin) }) C_list = lapply(T_all, function(x) (x[1, ] + x[2, ] + x[3, ]) / 3) C = do.call(rbind, C_list) A = vapply(T_all, function(x) { abs(x[1, 1] * (x[2, 2] - x[3, 2]) + x[2, 1] * (x[3, 2] - x[1, 2]) + x[3, 1] * (x[1, 2] - x[2, 2]) ) / 2 }, FUN.VALUE = double(1)) FIGURE 11.3: Iterative '''
author = "Robin Lovelace, Jakub Nowosad, Jannes Muenchow"
