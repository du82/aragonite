title = "Chapter 10 Bridges to GIS software | Geocomputation with R"
description = "Prerequisites This chapter requires QGIS, SAGA and GRASS GIS to be installed and the following packages to be attached: library(sf) library(terra) library(qgisprocess) library(Rsagacmd)..."
full_description = '''10 Bridges to GIS software Prerequisites This chapter requires QGIS, SAGA and GRASS GIS to be installed and the following packages to be attached: library(sf) library(terra) library(qgisprocess) library(Rsagacmd) library(rgrass) library(rstac) library(gdalcubes) 10.1 Introduction A defining feature of interpreted languages with an interactive console — technically a read-eval-print loop (REPL) — such as R is the way you interact with them: rather than relying on pointing and clicking on different parts of a screen, you type commands into the console and execute them with the Enter key. A common and effective workflow when using interactive development environments such as RStudio or VS Code is to type code into source files in a source editor and control interactive execution of the code with a shortcut such as Ctrl+Enter. Command line interfaces (CLIs) are not unique to R: most early computing environments relied on a command line ‘shell’ and it was only after the invention and widespread adoption of the computer mouse in the 1990s that graphical user interfaces (GUIs) became common. GRASS GIS, the longest-standing continuously developed open source GIS software, for example, relied on its CLI before it gained a GUI (Landa 2008). Most popular GIS software projects are GUI-driven. You can interact with QGIS, SAGA, GRASS GIS and gvSIG from system terminals and embedded CLIs, but their design encourages most people to interact with them by ‘pointing and clicking’. An unintended consequence of this is that most GIS users miss out on the advantages of CLI-driven and scriptable approaches. According to the creator of the popular QGIS software (Sherman 2008): With the advent of ‘modern’ GIS software, most people want to point and click their way through life. That’s good, but there is a tremendous amount of flexibility and power waiting for you with the command line. Many times you can do something on the command line in a fraction of the time you can do it with a GUI. The ‘CLI vs. GUI’ debate does not have to be adversarial: both ways of working have advantages, depending on a range of factors including the task (with drawing new features being well suited to GUIs), the level of reproducibility desired, and the user’s skillset. GRASS GIS is a good example of GIS software that is primarily based on a CLI but which also has a prominent GUI. Likewise, while R is focused on its CLI, IDEs such as RStudio provide a GUI for improving accessibility. Software cannot be neatly categorized into CLI or GUI-based. However, interactive command-line interfaces have several important advantages in terms of: Automating repetitive tasks Enabling transparency and reproducibility Encouraging software development by providing tools to modify existing functions and implement new ones Developing future-proof and efficient programming skills which are in high demand Improving touch typing, a key skill in the digital age On the other hand, good GUIs also have advantages, including: ‘Shallow’ learning curves meaning geographic data can be explored and visualized without hours of learning a new language Support for ‘digitizing’ (creating new vector datasets), including trace, snap and topological tools57 Enables georeferencing (matching raster images to existing maps) with ground control points and orthorectification Supports stereoscopic mapping (e.g., LiDAR and structure from motion) Another advantage of dedicated GIS software projects is that they provide access to hundreds of ‘geoalgorithms’ via ‘GIS bridges’ (Neteler and Mitasova 2008). Such bridges to these computational recipes for enhancing R’s capabilities for solving geographic data problems are the topic of this chapter. A command line interface is an environment for interacting with computer programs by typing and entering successive commands (command lines). bash in Linux and PowerShell in Windows are well-known examples that allow the user to control almost any part of their operating system. IDEs such as RStudio and VS Code provide code auto-completion and other features to improve the user experience when developing code. R is a natural choice for people wanting to build bridges between reproducible data analysis workflows and GIS because it originated as an interface language. A key feature of R (and its predecessor S) is that it provides access to statistical algorithms in other languages (particularly FORTRAN and C), but from a powerful high-level functional language with an intuitive REPL environment, which C and FORTRAN lacked (Chambers 2016). R continues this tradition with interfaces to numerous languages, notably C++. Although R was not designed as a command line GIS, its ability to interface with dedicated GISs gives it astonishing geospatial capabilities. With GIS bridges, R can replicate more diverse workflows, with the additional reproducibility, scalability and productivity benefits of controlling them from a programming environment and a consistent CLI. Furthermore, R outperforms GISs in some areas of geocomputation, including interactive/animated map-making (see Chapter 9) and spatial statistical modeling (see Chapter 12). This chapter focuses on ‘bridges’ to three mature open source GIS products, summarized in Table 10.1: QGIS, via the package qgisprocess [Dunnington et al. (2024); Section 10.2] SAGA, via Rsagacmd [Pawley (2023); Section 10.3] GRASS GIS, via rgrass [Bivand (2023); Section 10.4] There have also been major developments in enabling open source GIS software to write and execute R scripts inside QGIS (see docs.qgis.org) and GRASS GIS (see grasswiki.osgeo.org). TABLE 10.1: Comparison between three open-source GIS. Hybrid refers to the support of vector and raster operations. GIS First Release No. Functions Support QGIS 2002 >1000 hybrid SAGA 2004 >600 hybrid GRASS GIS 1982 >500 hybrid In addition to the three R-GIS bridges mentioned above, this chapter also provides a brief introduction to R interfaces to spatial libraries (Section 10.6), spatial databases (Section 10.7), and cloud-based processing of Earth observation data (Section 10.8). 10.2 qgisprocess: a bridge to QGIS and beyond QGIS is the most popular open-source GIS (Table 10.1; Graser and Olaya (2015)). QGIS provides a unified interface to QGIS’s native geoalgorithms, GDAL, and — when they are installed — from other providers such as GRASS GIS, and SAGA (Graser and Olaya 2015). Since version 3.14 (released in summer 2020), QGIS ships with the qgis_process command-line utility for accessing a bounty of functionality for geocomputation. qgis_process provides access to 300+ geoalgorithms in the standard QGIS installation and 1,000+ via plugins to external providers such as GRASS GIS and SAGA. The qgisprocess package provides access to qgis_process from R. The package requires QGIS — and any other relevant plugins such as GRASS GIS and SAGA, used in this chapter — to be installed and available to the system. For installation instructions, see qgisprocess’s documentation. A quick way to get up-and-running with qgisprocess if you have Docker installed is via the qgis image developed as part of this project. Assuming you have Docker installed and sufficient computational resources, you can run an R session with qgisprocess and relevant plugins with the following command (see the geocompx/docker repository for details): docker run -e DISABLE_AUTH=true -p 8786:8787 ghcr.io/geocompx/docker:qgis library(qgisprocess) #> Attempting to load the cache ... Success! #> QGIS version: 3.30.3-'s-Hertogenbosch #> ... This package automatically tries to detect a QGIS installation and complains if it cannot find it.58 There are a few possible solutions when the configuration fails: you can set options(qgisprocess.path = "path/to/your_qgis_process"), or set up the R_QGISPROCESS_PATH environment variable. The above approaches can also be used when you have more than one QGIS installation and want to decide which one to use. For more details, please refer to the qgisprocess ‘getting started’ vignette. Next, we can find which plugins (meaning different software) are available on our computer: qgis_plugins() #> # A tibble: 4 × 2 #> name enabled #> <chr> <lgl> #> 1 grassprovider FALSE #> 2 otbprovider FALSE #> 3 processing TRUE #> 4 processing_saga_nextgen FALSE This tells us that the GRASS GIS (grassprovider) and SAGA (processing_saga_nextgen) plugins are available on the system but are not yet enabled. Since we need both later on in the chapter, let’s enable them. qgis_enable_plugins(c("grassprovider", "processing_saga_nextgen"), quiet = TRUE) Please note that aside from installing SAGA on your system, you also need to install the QGIS Python plugin Processing Saga NextGen. You can do so from within QGIS with the Plugin Manager or programmatically with the help of the Python package qgis-plugin-manager (at least on Linux). qgis_providers() lists the name of the software and the corresponding count of available geoalgorithms. qgis_providers() #> # A tibble: 7 × 3 #> provider provider_title algorithm_count #> <chr> <chr> <int> #> 1 gdal GDAL 56 #> 2 grass GRASS 306 #> 3 qgis QGIS 50 #> 4 3d QGIS (3D) 1 #> 5 native QGIS (native c++) 243 #> 6 pdal QGIS (PDAL) 17 #> 7 sagang SAGA Next Gen 509 The output table affirms that we can use QGIS geoalgorithms (native, qgis, 3d, pdal) and external ones from the third-party providers GDAL, SAGA and GRASS GIS through the QGIS interface. Now, we are ready for some geocomputation with QGIS and friends, from within R! Let’s try two example case studies. The first one shows how to unite two polygonal datasets with different borders (Section 10.2.1). The second one focuses on deriving new information from a digital elevation model represented as a raster (Section 10.2.2). 10.2.1 Vector data Consider a situation when you have two polygon objects with different spatial units (e.g., regions, administrative units). Our goal is to merge these two objects into one, containing all of the boundary lines and related attributes. We use again the incongruent polygons we have already encountered in Section 4.2.8 (Figure 10.1). Both polygon datasets are available in the spData package, and for both we would like to use a geographic CRS (see also Chapter 7). data("incongruent", "aggregating_zones", package = "spData") incongr_wgs = st_transform(incongruent, "EPSG:4326") aggzone_wgs = st_transform(aggregating_zones, "EPSG:4326") FIGURE 10.1: Two areal units: incongruent (black lines) and aggregating zones (red borders). The first step is to find an algorithm that can merge two vector objects. To list all of the available algorithms, we can use the qgis_algorithms() function. This function returns a data frame containing all of the available providers and the algorithms they contain.59 # output not shown qgis_algorithms() To find an algorithm, we can use the qgis_search_algorithms() function. Assuming that the short description of the function contains the word “union”, we can run the following code to find the algorithm of interest: qgis_search_algorithms("union") #> # A tibble: 2 × 5 #> provider provider_title group algorithm algorithm_title #> <chr> <chr> <chr> <chr> <chr> #> 1 native QGIS (native c++) Vector overlay native:multiunion Union (multiple) #> 2 native QGIS (native c++) Vector overlay native:union Union One of the algorithms on the above list, "native:union", sounds promising. The next step is to find out what this algorithm does and how we can use it. This is the role of the qgis_show_help(), which returns a short summary of what the algorithm does, its arguments, and outputs.60 This makes its output rather long. The following command returns a data frame with each row representing an argument required by "native:union" and columns with the name, description, type, default value, available values, and acceptable values associated with each: alg = "native:union" union_arguments = qgis_get_argument_specs(alg) union_arguments #> # A tibble: 5 × 6 #> name description qgis_type default_value available_values acceptable_... #> <chr> <chr> <chr> <list> <list> <list> #> 1 INPUT Input layer source <NULL> <NULL> <chr [1]> #> 2 OVERLAY Overlay la… source <NULL> <NULL> <chr [1]> #> 3 OVERLA… Overlay fi… string <NULL> <NULL> <chr [3]> #> 4 OUTPUT Union sink <NULL> <NULL> <chr [1]> #> 5 GRID_S… Grid size number <NULL> <NULL> <chr [3]> #> [[1]] #> [1] "A numeric value" #> [2] "field:FIELD_NAME to use a data defined value taken from the FIELD_NAME #> field" #> [3] "expression:SOME EXPRESSION to use a data defined value calculated using #> a custom QGIS expression" The arguments, contained in union_arguments$name, are INPUT, OVERLAY, OVERLAY_FIELDS_PREFIX, and OUTPUT. union_arguments$acceptable_values contains a list with the possible input values for each argument. Many functions require inputs representing paths to a vector layer; qgisprocess functions accept sf objects for such arguments. Objects from the terra and stars package can be used when a “path to a raster layer” is expected. This can be very convenient, but we recommend providing the path to your spatial data on disk when you only read it in to submit it to a qgisprocess algorithm: the first thing qgisprocess does when executing a geoalgorithm is to export the spatial data living in your R session back to disk in a format known to QGIS such as .gpkg or .tif files. This can increase algorithm runtimes. The main function of qgisprocess is qgis_run_algorithm(), which sends inputs to QGIS and returns the outputs. It accepts the algorithm name and a set of named arguments shown in the help list, and it performs expected calculations. In our case, three arguments seem important: INPUT, OVERLAY, and OUTPUT. The first one, INPUT, is our main vector object incongr_wgs, while the second one, OVERLAY, is aggzone_wgs. The last argument, OUTPUT, is an output file name, which qgisprocess will automatically choose and create in tempdir() if none is provided. union = qgis_run_algorithm(alg, INPUT = incongr_wgs, OVERLAY = aggzone_wgs ) union #> $ OUTPUT: 'qgis_outputVector' chr "/tmp/...gpkg" Running the above line of code will save our two input objects into temporary .gpkg files, run the selected algorithm on them, and return a temporary .gpkg file as the output. The qgisprocess package stores the qgis_run_algorithm() result as a list containing, in this case, a path to the output file. We can either read this file back into R with read_sf() (e.g., union_sf = read_sf(union[[1]])) or directly with st_as_sf(): union_sf = st_as_sf(union) Note that the QGIS union operation merges the two input layers into one layer by using the intersection and the symmetrical difference of the two input layers (which, by the way, is also the default when doing a union operation in GRASS GIS and SAGA). This is not the same as st_union(incongr_wgs, aggzone_wgs) (see the Exercises)! The result, union_sf, is a multipolygon with a larger number of features than two input objects. N'''
