["https://geocompr.robinlovelace.net/attr"]
title = "Chapter 3 Attribute data operations | Geocomputation with R"
description = "Prerequisites This chapter requires the following packages to be installed and attached: library(sf)   # vector data package introduced in Chapter 2 library(terra)  # raster data package..."
full_description = '''3 Attribute data operations Prerequisites This chapter requires the following packages to be installed and attached: library(sf) # vector data package introduced in Chapter 2 library(terra) # raster data package introduced in Chapter 2 library(dplyr) # tidyverse package for data frame manipulation It relies on spData, which loads datasets used in the code examples of this chapter: library(spData) # spatial data package introduced in Chapter 2 Also ensure you have installed the tidyr package, or the tidyverse of which it is a part, if you want to run data ‘tidying’ operations in Section 3.2.5. 3.1 Introduction Attribute data is non-spatial information associated with geographic (geometry) data. A bus stop provides a simple example: its position would typically be represented by latitude and longitude coordinates (geometry data), in addition to its name. The Elephant & Castle / New Kent Road stop in London, for example has coordinates of \(-0.098\) degrees longitude and 51.495 degrees latitude which can be represented as POINT (-0.098 51.495) in the sfc representation described in Chapter 2. Attributes, such as name, of the POINT feature (to use simple features terminology) are the topic of this chapter. Another example is the elevation value (attribute) for a specific grid cell in raster data. Unlike the vector data model, the raster data model stores the coordinate of the grid cell indirectly, meaning the distinction between attribute and spatial information is less clear. To illustrate the point, think of a pixel in row 3 and column 4 of a raster matrix. Its spatial location is defined by its index in the matrix: move from the origin four cells in the x direction (typically east and right on maps) and three cells in the y direction (typically south and down). The raster’s resolution defines the distance for each x- and y-step which is specified in a header. The header is a vital component of raster datasets which specifies how pixels relate to spatial coordinates (see also Chapter 4). This chapter teaches how to manipulate geographic objects based on attributes such as the names of bus stops in a vector dataset and elevations of pixels in a raster dataset. For vector data, this means techniques such as subsetting and aggregation (see Sections 3.2.1 to 3.2.3). Sections 3.2.4 and 3.2.5 demonstrate how to join data onto simple feature objects using a shared ID and how to create new variables, respectively. Each of these operations has a spatial equivalent: the [ operator in base R, for example, works equally for subsetting objects based on their attribute and spatial objects; you can also join attributes in two geographic datasets using spatial joins. This is good news: skills developed in this chapter are cross-transferable. After a deep dive into various types of vector attribute operations in the next section, raster attribute data operations are covered. Creation of raster layers containing continuous and categorical attributes and extraction of cell values from one or more layer (raster subsetting) (Section 3.3.1) are demonstrated. Section 3.3.2 provides an overview of ‘global’ raster operations which can be used to summarize entire raster datasets. Chapter 4 extends the methods presented here to the spatial world. 3.2 Vector attribute manipulation Geographic vector datasets are well supported in R thanks to the sf class, which extends base R’s data.frame. Like data frames, sf objects have one column per attribute variable (such as ‘name’) and one row per observation or feature (e.g., per bus station). sf objects differ from basic data frames because they have a geometry column of class sfc which can contain a range of geographic entities (single and ‘multi’ point, line, and polygon features) per row. This was described in Chapter 2, which demonstrated how generic methods such as plot() and summary() work with sf objects. sf also provides generics that allow sf objects to behave like regular data frames, as shown by printing the class’s methods: methods(class = "sf") # methods for sf objects, first 12 shown #> [1] [ [[<- $<- aggregate #> [5] as.data.frame cbind coerce filter #> [9] identify initialize merge plot Many of these (aggregate(), cbind(), merge(), rbind() and [) are for manipulating data frames. rbind(), for example, binds rows of data frames together, one ‘on top’ of the other. $<- creates new columns. A key feature of sf objects is that they store spatial and non-spatial data in the same way, as columns in a data.frame. The geometry column of sf objects is typically called geometry or geom, but any name can be used. The following command, for example, creates a geometry column named g: st_sf(data.frame(n = world$name_long), g = world$geom) This enables geometries imported from spatial databases to have a variety of names such as wkb_geometry and the_geom. sf objects can also extend the tidyverse classes for data frames, tbl_df and tbl. Thus sf enables the full power of R’s data analysis capabilities to be unleashed on geographic data, whether you use base R or tidyverse functions for data analysis. sf objects can also be used with the high-performance data processing package data.table although, as documented in the issue Rdatatable/data.table#2273, is not fully compatible with sf objects. Before using these capabilities, it is worth recapping how to discover the basic properties of vector data objects. Let’s start by using base R functions to learn about the world dataset from the spData package: class(world) # it's an sf object and a (tidy) data frame #> [1] "sf" "tbl_df" "tbl" "data.frame" dim(world) # it is a two-dimensional object, with 177 rows and 11 columns #> [1] 177 11 world contains ten non-geographic columns (and one geometry list column) with almost 200 rows representing the world’s countries. The function st_drop_geometry() keeps only the attributes data of an sf object, in other words removing its geometry: world_df = st_drop_geometry(world) class(world_df) #> [1] "tbl_df" "tbl" "data.frame" ncol(world_df) #> [1] 10 Dropping the geometry column before working with attribute data can be useful; data manipulation processes can run faster when they work only on the attribute data and geometry columns are not always needed. For most cases, however, it makes sense to keep the geometry column, explaining why the column is ‘sticky’ (it remains after most attribute operations unless specifically dropped). Non-spatial data operations on sf objects only change an object’s geometry when appropriate (e.g., by dissolving borders between adjacent polygons following aggregation). Becoming skilled at geographic attribute data manipulation means becoming skilled at manipulating data frames. For many applications, the tidyverse package dplyr (Wickham et al. 2023) offers an effective approach for working with data frames. Tidyverse compatibility is an advantage of sf over its predecessor sp, but there are some pitfalls to avoid (see the supplementary tidyverse-pitfalls vignette at geocompx.org for details). 3.2.1 Vector attribute subsetting Base R subsetting methods include the operator [ and the function subset(). The key dplyr subsetting functions are filter() and slice() for subsetting rows, and select() for subsetting columns. Both approaches preserve the spatial components of attribute data in sf objects, while using the operator $ or the dplyr function pull() to return a single attribute column as a vector will lose the geometry data, as we will see. This section focuses on subsetting sf data frames; for further details on subsetting vectors and non-geographic data frames we recommend reading Section 2.7 of An Introduction to R (R Core Team 2021) and chapter 4 of Advanced R Programming (Wickham 2019), respectively. The [ operator can subset both rows and columns. Indices placed inside square brackets placed directly after a data frame object name specify the elements to keep. The command object[i, j] means ‘return the rows represented by i and the columns represented by j’, where i and j typically contain integers or TRUEs and FALSEs (indices can also be character strings, indicating row or column names). object[5, 1:3], for example, means ’return data containing the 5th row and columns 1 to 3: the result should be a data frame with only 1 row and 3 columns, and a fourth geometry column if it’s an sf object. Leaving i or j empty returns all rows or columns, so world[1:5, ] returns the first five rows and all 11 columns. The examples below demonstrate subsetting with base R. Guess the number of rows and columns in the sf data frames returned by each command and check the results on your own computer (see the end of the chapter for more exercises): world[1:6, ] # subset rows by position world[, 1:3] # subset columns by position world[1:6, 1:3] # subset rows and columns by position world[, c("name_long", "pop")] # columns by name world[, c(T, T, F, F, F, F, F, T, T, F, F)] # by logical indices world[, 888] # an index representing a non-existent column A demonstration of the utility of using logical vectors for subsetting is shown in the code chunk below. This creates a new object, small_countries, containing nations whose surface area is smaller than 10,000 km2. i_small = world$area_km2 < 10000 summary(i_small) # a logical vector #> Mode FALSE TRUE #> logical 170 7 small_countries = world[i_small, ] The intermediary i_small (short for index representing small countries) is a logical vector that can be used to subset the seven smallest countries in the world by surface area. A more concise command, which omits the intermediary object, generates the same result: small_countries = world[world$area_km2 < 10000, ] The base R function subset() provides another way to achieve the same result: small_countries = subset(world, area_km2 < 10000) Base R functions are mature, stable and widely used, making them a rock solid choice, especially in contexts where reproducibility and reliability are key. dplyr functions enable ‘tidy’ workflows which some people (the authors of this book included) find intuitive and productive for interactive data analysis, especially when combined with code editors such as RStudio that enable auto-completion of column names. Key functions for subsetting data frames (including sf data frames) with dplyr functions are demonstrated below. select() selects columns by name or position. For example, you could select only two columns, name_long and pop, with the following command: world1 = select(world, name_long, pop) names(world1) #> [1] "name_long" "pop" "geom" Note: as with the equivalent command in base R (world[, c("name_long", "pop")]), the sticky geom column remains. select() also allows selecting a range of columns with the help of the : operator: # all columns between name_long and pop (inclusive) world2 = select(world, name_long:pop) You can remove specific columns with the - operator: # all columns except subregion and area_km2 (inclusive) world3 = select(world, -subregion, -area_km2) Subset and rename columns at the same time with the new_name = old_name syntax: world4 = select(world, name_long, population = pop) It is worth noting that the command above is more concise than base R equivalent, which requires two lines of code: world5 = world[, c("name_long", "pop")] # subset columns by name names(world5)[names(world5) == "pop"] = "population" # rename column manually select() also works with ‘helper functions’ for more advanced subsetting operations, including contains(), starts_with() and num_range() (see the help page with ?select for details). Most dplyr verbs return a data frame, but you can extract a single column as a vector with pull(). You can get the same result in base R with the list subsetting operators $ and [[, the three following commands return the same numeric vector: pull(world, pop) world$pop world[["pop"]] slice() is the row-equivalent of select(). The following code chunk, for example, selects rows 1 to 6: slice(world, 1:6) filter() is dplyr’s equivalent of base R’s subset() function. It keeps only rows matching given criteria, e.g., only countries with an area below a certain threshold, or with a high average of life expectancy, as shown in the following examples: world7 = filter(world, area_km2 < 10000) # countries with a small area world7 = filter(world, lifeExp > 82) # with high life expectancy The standard set of comparison operators can be used in the filter() function, as illustrated in Table 3.1. TABLE 3.1: Comparison operators that return Boolean (true/false) values. Symbol Name == Equal to != Not equal to >, < Greater/Less than >=, <= Greater/Less than or equal &, |, ! Logical operators: And, Or, Not 3.2.2 Chaining commands with pipes Key to workflows using dplyr functions is the ‘pipe’ operator %>% (or since R 4.1.0 the native pipe |>), which takes its name from the Unix pipe | (Grolemund and Wickham 2016). Pipes enable expressive code: the output of a previous function becomes the first argument of the next function, enabling chaining. This is illustrated below, in which only countries from Asia are filtered from the world dataset, next the object is subset by columns (name_long and continent) and the first five rows (result not shown). world7 = world |> filter(continent == "Asia") |> select(name_long, continent) |> slice(1:5) The above chunk shows how the pipe operator allows commands to be written in a clear order: the above run from top to bottom (line-by-line) and left to right. An alternative to piped operations is nested function calls, which are harder to read: world8 = slice( select( filter(world, continent == "Asia"), name_long, continent), 1:5) Another alternative is to split the operations into multiple self-contained lines, which is recommended when developing new R packages, an approach which has the advantage of saving intermediate results with distinct names which can be later inspected for debugging purposes (an approach which has disadvantages of being verbose and cluttering the global environment when undertaking interactive analysis): world9_filtered = filter(world, continent == "Asia") world9_selected = select(world9_filtered, continent) world9 = slice(world9_selected, 1:5) Each approach has advantages and disadvantages, the importance of which depend on your programming style and applications. For interactive data analysis, the focus of this chapter, we find piped operations fast and intuitive, especially when combined with RStudio/VSCode shortcuts for creating pipes and auto-completing variable names. 3.2.3 Vector attribute aggregation Aggregation involves summarizing data with one or more ‘grouping variables’, typically from columns in the data frame to be aggregated (geographic aggregation is covered in the next chapter). An example of attribute aggregation is calculating the number of people per continent based on country-level data (one row per country). The world dataset contains the necessary ingredients: the colum'''
