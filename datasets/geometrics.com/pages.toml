["https://www.geometrics.com/product/atom-passive-seismic-system"]
title = "Atom-1C Seismograph - Geometrics : Geometrics"
description = "The Atom-1C is a one channel seismograph which is deployed in groups for passive seismic data acquisition. Simplify your field work with the Atom."
full_description = '''Atom-1C Seismograph Home › Atom-1C Seismograph Description The Atom-PS is a passive seismograph which can collect microtremor measurements for Vs determination to depths as great as ~1.5 km, no spread cables needed! The Atom-PS is composed of multiple, single-channel acquisition units and our SeisImager Surface Wave processing package. The Atom-PS is unique in that it does not rely on traditional and heavy spread cables. Users are no longer constrained by preset spacing/geometries or by site conditions such as high traffic areas, roads, and driveways. The Atom-PS is a complete solution, composed of individual acquisition units with 24-bit A/D conversion, GPS-controlled timing, 4 GB of internal data storage and an adjustable sample rate. Each acquisition unit weighs approximately 3.5 pounds and has a battery life of up to 70 hours between charges. The standard 4 GB memory can record for 560 hours. For extended recording, the internal memory is up-gradable to 32GB. Charge up to twelve acquisition units at once! Plan your MASW exactly as needed with the Atom-PS, no compromises needed. Features and benefits Internal Power: No big batteries to lug around! Low energy consumption paired with an internal battery provides up to 70 hrs of operation per charge. Data Acquisition is Simple: Turn on the Atom and GPS timestamped data starts to be collected in a couple minutes. No laptop required for data acquisition, just place the Atom and Geophone in position before moving to the next station. Wireless Platform Benefits: No cables need for accurate time stamped data, that’s taken care of through the internal GPS. After data collection, easily download the data with our wireless downloader and WiFi Access point. Unmatched Passive Data Acquisition: Set it and go! No hammers or weight drops required for data collection, passive data sets can be collected in as few as 10 minutes, or left overnight for massive data sets. Unmatched Specifications: 24 bit, ultra-high resolution 1.5 to 1,650 kHz bandwidth, low distortion (<0.001% at 25Hz, 2ms) Customer Testimonials “Many thanks to Geometrics for the ATOM’s. RDCL use them to efficiently acquire passive MAM data primarily in urban environments. They’re easy to use and have a robust design. I recommend them to anyone looking for this type of seismic system”. Oliver Gibson, Senior Geophysicist, RDCL, New Zealand "The Atom provides wireless data downloading and shutdown for all units, which is very convenient. The lower frequency range (0.2 Hz) provides deeper sounding. The data importing into SeisImager is streamlined and effortless. In addition, the technical support is always prompt and impeccable, which is very important for new users." John Liu, Ph.D., R.G. Principal Geophysicist Global Geophysics "The nodal and wireless abilities of Atom Seismographs allows for the user to adjust survey parameters in ways off-limits to spread cable seismographs. These attributes paired with a mathematical focus on survey geometry improves data quality considerably compared to traditional methods, with both improvements in data confidence and maximum depth of survey." Stefan Burns, Sr. Geophysicist, Napa Seismic Technical Details Atom 1-C Specification List ACQUISITION UNIT (AU) Each Atom AU is a self-contained, one channel data acquisition system that amplifies, digitizes and buffers the geophone output voltages. Channels: 1 channel per box. A/D Resolution: 32-bit (24-bit result). Dynamic Range: 128 dB measured at 2ms, 12 dB. Bandwidth: 0.2 - 1650 Hz. Distortion (THD): 0.001% at 2ms, 0.2 to 25 Hz. Common Mode Rejection: 114 dB at 60 Hz. Noise Floor:0.11 μV, RFI at 2 ms, 12 dB. Max Input Signal: 1.6 V, 12 dB; 100 mV, 36 dB. Input Impedance: 20 kOhm, 0.01 μf. Preamp Gain (PG): 0, 12, 24, or 36 dB. Sample Intervals: 0.25, 0.5, 1, 2, 4, and 10 ms. Data Transmission: Standard 802.11g WiFi. Each AU appears as a DHCP client. Data Format:Common Time Blocks (CTBs) saved in proprietary ATM format, ASCII, or SEG-2; miniSEED, SAC, and SAF coming soon. Data Storage: 4 Gb standard; expandable to 32 Gb. Geophone Test: Tap test with LED indicator Ports: One 2-pin LCK connector for geophone inut, one 10-pin connector for battery charger. Power: Internal 10Ah NiMH battery pack. Charger: Single cable for one AU or multi-port charger for 6 AUs; charging current of 1.5 Amps per AU, 9 hours for full charge. Environmental: Operates from -20°C to +55°C (-4°F to +131°F). Waterproof and Dustproof: Passes MIL810E/F vibration test and 14-point. Dimensions: L: 142 mm; W: 140 mm; H: 102 mm (5.6x5.5x4.0 in). Weight: 1.6 kg (3.5 lb). Application Software: SeisImager offloads data from AUs over WiFi and automatically creates phase velocity plots and coherence curves. Atom-1C Software Current Software (AU) Atom modules are compatible with Android, Windows PC, and iOS systems. If you use an Android or iOS interface, you may download the latest software at the Android or App store. For Windows devices, you may download the software using the software link at the bottom of this page. The latest Windows version Atom Downloader and Installer is 1.3.7360.23708 table {<br /> border-collapse: collapse;<br /> border-style: solid;<br /> border-width: medium;<br /> width: 100%;<br /> }</p> <p>th, td {<br /> text-align: left;<br /> padding: 8px;<br /> border-bottom: 1px solid #424241;<br /> }</p> <p>tr:nth-child(odd) {background-color: #e1ece6;}<br /> Atom 12-AU Shipping Weights & DIMS Shipping Weights & DIMS (12-AU system) Contents Dimensions (L x W x H) Weight Case 1 - 12 Atom 1-C AU's 20in x 18in x 14in 51cm x 46cm x 36cm 35lbs 16kg Case 2 - Geophones, Charger, Manual, WiFi Adaptor, Misc 20in x 18in x 14in 51cm x 46cm x 36cm 17lbs 7.7kg Downloads Specsheet Manual Firmware/Software TYPICAL USES UBC Vs30/ IBC Vs100 Site Classification Deep surveys of Geologic Structure Stratigraphic and Lithologic Studies Foundation Engineering Microzonation studies (H/V method) ACCESSORIES 12-ch Atom Standard Kit 12-ch Atom Standard Kit table { width: 100%; } tr:hover {background-color: #e1ece6;} td { vertical-align: middle; text-align: left; padding: 10px; border-bottom: 1px solid #424241; } 2 ct: Charging Station 1ct: Wireless Access Point 12 ct: 2 Hz Geophones Analysis Software SeisImager/SW Download Software Download Specsheet Resources Atom Seismograph (1C & 3C) Field Operations Training Video Atom Seismograph Visual Field Guide More Resources'''
