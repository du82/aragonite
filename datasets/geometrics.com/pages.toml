title = "MagArrow II UAV-Enabled Magnetometer - Geometrics : Geometrics"
description = "The MagArrow II is an all-in-one magnetometer designed to be used with unmanned aerial vehicles. Collect high resolution magnetic data up to 10m/s."
full_description = '''MagArrow II UAV-Enabled Magnetometer Home › MagArrow II UAV-Enabled Magnetometer Description The MagArrow II is the second generation of our best-selling UAS-enabled magnetometer and it’s setting a new standard for UAS magnetic surveys. The MagArrow is engineered to simplify surveys that are difficult due to the various limitations of pilot-on-board surveys and ground surveys. The MagArrow is a robust yet flexible system that can adapt to changing field conditions and new user workflows. The MagArrow consists of an aerodynamic, light-weight shell with internal electronics including the MFAM™ magnetic sensors, GPS, and IMU. The MFAM™, a two sensor module inside the MagArrow is our most groundbreaking magnetometer yet, capable of highly precise measurements in an extremely lightweight and tiny package. Operation in the field is simple. Survey details are programmed into the user’s UAS software of choice. The MagArrow is turned on, and once airborne, preprogrammed GPS waypoints carry the MagArrow in altitude stable survey lines. Once work is completed, data from the MagArrow can be wirelessly downloaded to a computer. The MagArrow can be attached easily to a wide variety of enterprise UAS’s, and the MagArrow’s 1000 Hz sample rate and synchronized on-board GPS allow it to function independently of the UAS and the UAS software. With such a fast sample rate, surveys can be completed at speeds up to 10 m/s with samples collected every 1 cm. Revolutionize your magnetic surveying capabilities with the Geometrics MagArrow! Helpful MagArrow Resources Bulletin - MagArrow Browser Interface MagArrow Compensation Flight Instructions MagArrow, MFAM, G-864 Survey Manager Walkthrough Features and benefits No Drop-outs!: Reliable high quality data no matter the sensor orientation. UAS Agnostic: Attachable to most enterprise UAVs Lightweight: Weighs only 1.2 kg for easy deployment. Self-Contained: GPS, storage, and WiFi on board. No data connections to UAV needed. Super-Fast Sampling Rate: Fly faster and filter out UAV motor noise. Long Battery Life: 2 hours of battery life will outlast multiple UAV flights. Hot swappable New! External Power Button: No need to open the compartment to reset or cycle power. Technical Details MagArrow Magnetometer Specification List Operating Principle: Laser pumped cesium vapor (Cs133 non-radioactive) total field scalar magnetometer. Operating Range: 20,000 to 100,000 nT. Gradient Tolerance: 10,000nT/m. Operating Zones: Operate anywhere in the world without dead zones. Dead Zone: None. Noise/Sensitivity: 0.005nT/ √Hzrms typical. Sample Rate: 1000 Hz. synchronized to GPS 1PPS. Bandwidth: 400Hz. Heading Error: ± 5 nT over entire 360° equatorial and polar spins typical. Output: WiFi data download over 2.4GHz WiFi access point. GPS: 1.5m 50% CEP ≤ 1.0m with SBAS USB Port: Port for USB flash drive. Used for field upgrades. Data Logger: Built in Data Logger. Data Storage: 32 Gbyte Micro SD card, U3 speed class. Not field-accessible. Contact sales for higher capacities. Logging Device: MagArrow is operated using AndroidTM tablets and phones and is not compatible with iOS devices. Data Download: Over WiFi 2.4GHz using user-supplied browser-capable device. 10 minutes of data collected requires 1 minute to download. IMU: Bosch BMI160 Accel/Gyro - 200 Hz sample rate. Insentek Compass - 100 Hz Sample rate. Total Weight: 1.2 kg without batteries. Length: 1 m. Battery Battery Connection: 2x XT60 connectors for 206 type batteries. Battery Recommendations: Non-magnetic 1800 mAh or 2200 mAh lithium polymer, 3cell, 11.1v. Hot swappable. Environmental Specifications Operating Temperature: -20°C to +40°C (-4°F to +104°F). Humidity: Non-condensing. Accessories Standard: Carrying case, AC power adapter and USB drive containing operation manual and software. Warranty: 1 year. Suspension System FAQ Since the MagArrow Magnetometer only weights 1.2 kg it will have little impact on your 3-5 kg payload drone flight time. Our MagArrow uses a MFAM Sensorto provide high quality magnetic data with noise/sensitivity range of only 5 nT. Most people have suspended the system with non-magnetic cables to remove the magnetometer from the magnetic influence of the drone itself. Some customers have decided to build a fixed frame to mount the system but generally it isn't large enough to remove the magnetometer from the drone's magnetic effects so there will need to be advanced filtering to compensate the magnetic field readings. Either option is acceptable. Current Software and Firmware The current version of Survey Manager is SurveyManagerInstaller-3.3.1411.0.exe released in January 2025. The current version of MagArrow Setup is MagArrowSetup-3.2.2261.exe released in January 2025. The current version of MagArrow Converter is MagArrowConverterInstaller-2.1.125.0.exe released in January 2025. To download these files, click here MagArrow Setup Files or click on the Firmware/Software button below. To update the firmware on your MagArrow, please follow the instructions below. These instructions are also povided in the update file. Unplug the USB from MagArrow Plug in the MagArrow USB drive into the computer Run the MagArrowSetup.exe Follow the instruction Password: MagArrow (or any password, has to be 8 characters, case sensitive) Channel: 4 Choose the root directory of the USB flash drive It will generate a btb.bin file, which will be used by MagArrow to update its firmware when powered on. Eject the USB before removing it from the computer Plug in the USB back into the MagArrow Power up and the firmware will be updated automatically SurveyManagerInstaller is for installing the Survey Manager on your PC. If customers want to use commands to convert MagArrow raw data to .csv file, please install the MagArrowConverterInstaller. Instructions for installing MagArrowConverterInstaller are shown Here. Export License FAQ The US Department of Commerce category for the cesium-vapor magnetometers is ECCN6A006. It is necessary to obtain a US export license before a magnetometer in this category can be shipping to most countries. If an export license is required, Geometrics Export Administrator will assist you in applying for this license. The export license process takes around 6 weeks, and we are not able to speed up that processes as it is the time the US Government takes to review the export license requests. A license is required for both renting and purchasing the MagArrow, so we are not able to send you the equipment for your use until we receive it. An Export License is NOT required for shipment of cesium-vapor magnetometers to the following countries: Argentina, Australia, Austria, Belgium, Bulgaria, Canada, Croatia, Czech Republic, Denmark, Estonia, Finland, France, Germany, Greece, Hungary, Iceland, India, Ireland, Italy, Japan, Latvia, Lithuania, Liechtenstein, Luxembourg, Mexico, Netherlands, New Zealand, Norway, Poland, Portugal, Romania, Slovenia, Slovakia, South Korea, South Africa, Spain, Sweden, Switzerland, Turkey, and the United Kingdom. (Updated April 2019) Export or re-export of the quoted items to Cuba, North Korea, Iran, Rwanda, Sudan, and Syria is prohibited by the US Dept. of Commerce as these are embargoed countries. Please contact us us for more information Heading Error Compensation Flight FAQ To perform a heading error compensation flight, fly the UAV with MagArrow attached up to 100-150 meters in a low gradient area. Hover the drone in a single spot and rotate it slowly through 360 degrees while logging magnetic data the with MagArrow. By keeping the drone location stationary the mag field will be also be constant. Thus we are only left with the sensor reading as a function of orientation. The MagArrow has two MFAM sensors, and the way they are arranged ensures that when one sensor is in its dead zone the other is at its optimum orientation, and vice versa. The readings from the two sensors are combined to produce one magnetometer reading only. The two sensor readings are weighted such that as one sensor approaches its dead zone it is weighted much less (down to zero in the dead zone) while the optimum oriented sensor is weighted more fully. Thus you get only one magnetometer reading with no dead zones whatsoever. In addition, the weighted averaging of the sensors still does partial heading error cancelling. Magnetic Compensation Magnetic contamination can be a problem, though rarely. Most often this is caused when a "permanent" magnetic component is accidentally attached to, or close to, one of the sensors. This can cause large, random shifts in the data from one or both sensors. Check by removing the sensor door and visually inspect the two MFAM sensors and their surrounding areas for anything unusual. If you have another magnetometer, like the G-864, you can also measure the magnetic signature of the sensor part of the MagArrow with the following instructions. Turn on the magnetometer Wave the sensor part of the MagArrow above the magnetometer (as close as possible but not touching) Wave in both west and east directions Check whether this is any magnetometer reading change when the MagArrow passes by If reading changes are observed, there must be some contamination. Altitude FAQ There are many things that don't work as well at high altitude. Many of these don't apply to the MagArrow such as LCDs, can type electrolytic capacitors, hard drives, sealed keyboards, and High Voltage flashover points.What could possibly be an issue are the LiPo batteries, thermal cooling reduction at lower pressures, and the sealed MagArrow case. MagArrow Case: While the body of the MagArrow is sealed tight, it is not sealed enough to puff out or get crushed with altitude changes. This hasn't been tested. LiPo Batteries: These are not altitude rated. The failure mode is shorted cells and fire. Thermal Cooling: This could be measured in a pressure chamber using the internal temperature monitor diodes. We would have to rent time in the chamber to do the measurement. We might also make a stab at calculating the temperature increase. 30,000 feet is about 3 PSIA compared to 14 PSIA at sea level. There is no altitude restriction on the MagArrow, but flying at high altitudes is taken at the users risk. table { border-collapse: collapse; border-style: solid; border-width: medium; width: 100%; } th, td { text-align: left; padding: 8px; border-bottom: 1px solid #424241; } tr:nth-child(odd) {background-color: #e1ece6;} MagArrow II Shipping Weights & DIMS Shipping Weights & DIMS Contents Dimensions (L x W x H) Weight Case 1 - Pelican Case, MagArrow, Tablet, Battery Electronics, Misc. Cables 48in x 18in x 8in122cm x 46cm x 20cm 25lbs11kg'''
