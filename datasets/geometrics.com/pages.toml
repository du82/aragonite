full_description = "Geoelectrical Instruments Geoelectric Solutions for your Biggest Questions Home › Geoelectrical Instruments Electromagnetic Stratagem EH-5 Our newest instrument for high-resolution electrical imaging. The Stratagem EH-5 is a unique magnetotelluric (MT) system used for measuring the electrical resistivity of the earth over depth ranges of a few meters to greater than one kilometer. This system uses naturally occurring electromagnetic signals to obtain a continuous electrical sounding of the earth beneath the measurement site. The natural signals are mostly the result of distant lightning activity in the atmosphere. Discover More Geode EM3D The Only EM Device Capable of High-Resolution Measurements at 1000+ Meters Discover More UXO Detection and Identification MetalMapper 2×2 Stop Digging Up Scrap and find the UXO You're Looking For. Discover More Direct your Questions or Inquiries here Contact Us Your Comprehensive Geophysical Database View Resources Submit an RMA, Read our FAQ, or Troubleshoot Check Support"
