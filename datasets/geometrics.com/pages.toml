full_description = '''window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = 'https://platform.twitter.com/widgets.js'; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, 'script', 'twitter-wjs')); Forums Members Recent Posts Login .wpf-item-element { display: inline; } Forums Seismograph ATOM Hardware Good Practice - Cha... Notifications Clear all Information Good Practice - Charging the Atom Hardware Last Post by Gretchen Schmauder 11 months ago 1 Posts 1 Users 0 Reactions 584 Views RSS Gretchen Schmauder (@gschmauder) Member Admin Joined: 6 years ago Posts: 119 Topic starter 04/04/2024 9:18 am Attachment : Bulletin_Good Practice-Charging the Atom.V1.pdf This bulletin is written to inform those customers who purchased the ATOM 1C and 3C seismographs (“Atoms”), to allow for out gassing and temperature cooling when charging the batteries. Background: Geometrics has noted that some users use fitted cases for their Atoms to allow for safe shipping and handling between deployments. If the Atoms are fitted with charging cables and are being charged while inside the fitted cases, under certain circumstances, the fitted cases may not allow for sufficient air circulation and could lead to excessive temperatures inside the Atom unit. These excessive temperatures can exceed the battery manufacturers suggested safe charging temperature, resulting in some instances in out-gassing of hydrogen during the charging process. Recommendation: Geometrics recommends that users remove their Atom unit(s) from any enclosed/insulated boxes (including fitted cases) prior to charging. Each Atom unit requires adequate surface to air access for heat dissipation. We also recommend that users do not leave the Atom unit on charge for long periods of time. Geometrics recommends that a typical maximum charge time should not exceed 12-15 hours. Precautionary Steps: In addition to using good practice charging as we have described in this Bulletin, Geometrics will provide users a procedure for installing a GORE® Protective Vent to allow for the release of pressure and gas from inside the fitted case housing should such pressure and gas accumulate. These vents can be installed at local service centers or at Geometrics factory. Please contact our Geometrics Support organization at https://www.geometrics.com/support/ for additional information. Quote Topic Tags batteries Charging Atom Please Login or Register to reply to this topic. Forum Jump: General Info — News & Events — Rental Equipment Magnetometer — General Magnetometer Info — G-822A — — Application — — Hardware — — Software — G-857 — — Application — — Hardware — — — Quick Download Process for the G-857 Magnetometer — — Software — G-858 — — Applications — — Hardware — — Software — G-862 — — Application — — Hardware — — Software — G-864 — — Application — — Hardware — — Software — G-882 — — Application — — Hardware — — Software — MagArrow — — Application — — Hardware — — Software — MagEX — — Application — — Hardware — — Software — MFAM — — Application — — Hardware — — Software Seismograph — SeisImager Software — General Seismograph Info — ATOM — — Application — — Hardware — — Software — Geode — — Application — — Hardware — — Software — GeoEel — — Application — — Hardware — — Software Electromagnetic — General Electromagnetic Info — EH-5 — — Application — — Hardware — — Software — Geode-EM — — Application — — Hardware — — Software — MetalMapper — — Application — — Hardware — — Software — OhmMapper — — Hardware — — Application var wpf_forum_json = '{"forum_1":"https:\/\/www.geometrics.com\/community\/general-info\/","forum_7":"https:\/\/www.geometrics.com\/community\/news\/","forum_67":"https:\/\/www.geometrics.com\/community\/rental-equipment\/","forum_4":"https:\/\/www.geometrics.com\/community\/magnetometer\/","forum_