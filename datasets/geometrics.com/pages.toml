title = "Careers - Geometrics : Geometrics"
description = "Careers Building Engineering and Geophysical Passion Projects Since 1968 Help Build the Future of Geophysics We are a diverse and dynamic group of scientists, engineers, geophysicists and technologists working to design real-life solutions to earth and subsurface physics problems. All of our departments, including engineering, sales, accounting, marketing, support, and manufacturing work as a team,... View Article"
full_description = '''Careers Building Engineering and Geophysical Passion Projects Since 1968 Help Build the Future of Geophysics We are a diverse and dynamic group of scientists, engineers, geophysicists and technologists working to design real-life solutions to earth and subsurface physics problems. All of our departments, including engineering, sales, accounting, marketing, support, and manufacturing work as a team, with an average employee tenure of 12 years. Geometrics is a great place to work and if what we do interests you, we would like to talk to you about joining our team. EEO Rights and Policies Geometrics is an Equal Opportunity Employer that is committed to inclusion and diversity. We also take affirmative action to offer employment opportunities to all applicants, including minorities, women, protected veterans, and individuals with disabilities. To read our company’s EEO/AA policy, please click here. For more information about your EEO rights as an applicant, please click here. And to read our Pay Transparency Statement, click here Accessibility Statement Geometrics is committed to working with qualified individuals with physical or mental disabilities. Applicants who would like to contact us regarding the accessibility of our website or who need special assistance or a reasonable accommodation for any part of the application or hiring process may contact us at: [email protected] or (408) 954-0522. This contact information is for accommodation requests only. Evaluation of requests for reasonable accommodations will be determined on a case-by-case basis. Job Listings Engineering PCB Design Engineer Close Details Description At Geometrics, we manufacture highly precise scientific instruments to measure properties of the Earth’s sub-surface. Our instruments are used outdoors in the harshest of conditions and provide quality data to our customers, enabling them to solve complex problems in environmental sciences, natural resource exploration and infrastructure development. Our R&D team is a diverse and dynamic group of scientists, engineers, geophysicists, and technologists working hard to design real-life solutions to earth and subsurface physics problems. We are seeking a skilled PCB Designer to join our dynamic engineering team. The ideal candidate will be responsible for designing and developing printed circuit board (PCB) layouts for various electronic devices. This role involves collaborating with cross-functional teams to ensure the successful implementation of PCB designs that meet performance, reliability, and manufacturability requirements. About You: An Engineer who embraces challenges Great at working within experienced cross-disciplinary teams Requirements Knowledge and Skill Requirements: 5+ years’ experience in PCB CAD design using Cadence Allegro with OrCAD. PCB CAD symbol creation and CAD symbol library management. Setting up design constraints using constraint manager, understanding of propagation delays on PCB, stack-up creation for high layer-count boards. Sensitive analog signal routing for power regulators, clocks, RF devices, and data acquisition components. Complex placement and routing, decoupling strategies, length compensation techniques such as serpentine on differential traces. Routing of high-density tight designs such as DDRx SDRAM interfaces Routing high-bit rate interfaces for interfaces such as Ethernet, USB SI rules for high-speed designs Familiar with incorporating mechanical design inputs into the CAD database Knowledge of factory manufacturing processes, PCB assembly process, solder-mask defined pads IPC standards and technologies as related to board design and soldering Manufacturing aspects such as DFM, DFT Bachelor’s or Master’s degree in Electrical Engineering, Electronics, or a related field. Preferred Qualifications: Experience with high-speed digital, RF, and power supply PCB designs. Familiarity with thermal management and reliability in extreme environments. Some experience with circuit design. Physical requirements include: Must have manual dexterity to operate computer keyboard, standard office equipment and Geometrics products. Eyesight that can work on multilayer PCB designs work quality to confirm processes and drawings have been updated correctly. Able to see and hear to participate in “in-person” and “virtual” meeting, with shared computer screens and other remote technology. Ability to work in excess of a 40-hour week, if necessary Able to work from Geometrics Corporate office in San Jose, CA, hybrid option available Qualifications Design and develop PCB layouts using Cadence Design (OrCAD and Allegro) software. Create and maintain schematic diagrams and bill of materials (BOM). Create component footprint and maintain CIS/CIP library. Collaborate with system engineers, packaging engineers, and signal integrity engineers to optimize board routing and ensure signal and power integrity. Develop prototypes for design verification and conduct design reviews. Prepare detailed fabrication and assembly drawings, including Gerber files, fab and assembly drawings, and pick and place documentation. Analyze and troubleshoot design and fabrication-related issues. Ensure compliance with industry standards (e.g., IPC, EMC) and environmental safety regulations. Maintain Cadence Allegro Design software and systems, including upgrades and installations. Document design processes and results effectively. Manage multiple projects simultaneously, adapting to changing priorities and constraints. We offer a dynamic, challenging environment and a comprehensive benefits package. Click here to download a copy of this job description. To apply, please send your resume and cover letter to: [email protected], include your name and PCB in the subject line. Currently, Geometrics is not able to sponsor applicants for work visas. This position requires access to export-controlled information and employment is contingent on following U.S. Government export regulations. Regular Full Time, salary range $7,085 to $10,420 per month Geometrics is an EEO/AA Employer. Veterans/Disabled and other protected categories are encouraged to apply. Apply Now Start Your Next Career Today Use the form below to send an application Notice: JavaScript is required for this content. /* FORM STYLES */ #nf-form-3-cont { background-color:#ffffff; display:block; } #nf-form-3-cont .nf-form-title h3 { background-color:#ffffff; } #nf-form-3-cont .nf-row { background-color:#ffffff; } var formDisplay=1;var nfForms=nfForms||[];var form=[];form.id='3';form.settings={"objectType":"Form Setting","editActive":true,"title":"Careers Form","created_at":"2016-08-24 16:39:20","form_title":"Contact Me","default_label_pos":"above","show_title":0,"clear_complete":"1","hide_complete":"1","logged_in":"0","key":"","conditions":[],"wrapper_class":"","element_class":"","add_submit":"1","not_logged_in_msg":"","sub_limit_number":"","sub_limit_msg":"","calculations":[],"formContentData":[{"order":1,"cells":[{"order":0,"fields":["name"],"width":"100"}]},{"order":2,"cells":[{"order":0,"fields":["email"],"width":"100"}]},{"order":3,"cells":[{"order":0,"fields":["position_1561070554285"],"width":"100"}]},{"order":4,"cells":[{"order":0,"fields":["file_upload_1562878314165"],"width":"100"}]},{"order":5,"cells":[{"order":0,"fields":["recaptcha_1654120294579"],"width":"100"}]},{"order":6,"cells":[{"order":0,"fields":["submit"],"width":"100"}]}],"container_styles_background-color":"#ffffff","container_styles_border":"","container_styles_border-style":"","container_styles_border-color":"","container_styles_color":"","container_styles_height":"","container_styles_width":"","container_styles_font-size":"","container_styles_margin":"","container_styles_padding":"","container_styles_display":"block","container_styles_float":"","container_styles_show_advanced_css":"0","container_styles_advanced":"","title_styles_background-color":"#ffffff","title_styles_border":"","title_styles_bor