["https://www.geometrics.com/solutions/uxo-detection"]
title = "UXO Detection - Geometrics : Geometrics"
description = "UXO Detection Home › Solutions › UXO Detection UXO Detection methods are based primarily upon the concepts of Magnetometery and Time-Domain EM (TDEM) Time-domain EM. TDEM is an active technique that induces small, transient eddy currents into the ground and then measures their rate of decay. TDEM is used for a variety of applications from... View Article"
full_description = "UXO Detection Home › Solutions › UXO Detection UXO Detection methods are based primarily upon the concepts of Magnetometery and Time-Domain EM (TDEM) Time-domain EM. TDEM is an active technique that induces small, transient eddy currents into the ground and then measures their rate of decay. TDEM is used for a variety of applications from mining to shallow metal detection. Likewise magnetometry can be used for shallow metal detection, typically at a faster rate but less selective when it comes to discriminating UXO from scrap. Using tools such as our MagArrow UAS-Enabled Magnetometer in conjunction with our MetalMapper 2x2 allows for UXO detections to be performed most efficient and accurately. Likewise, marine and lacustrine environments can be explored for UXO using our G-882 Marine Magnetometer. With a gradiometer setup available too, UXO can be detected accurately and over large areas. MetalMapper 2x2 Discover More G-882 Marine Magnetometer Discover More Land UXO Detection MetalMapper 2x2 Unexploded ordnance (UXO) is a major issue for governments and landowners around the world due to the safety issues associated with them and the high costs for remediation. The MetalMapper 2x2 is an advanced electromagnetic (EM) sensor which can detect UXO and classify buried metallic objects as either UXO or scrap metal. The innovative MetalMapper 2x2 has been developed by Geometrics in conjunction with government and other private organizations and could save billions of dollars in unexploded ordnance cleanup costs at former training ranges or battlefields. Before the use of these advanced EM techniques, a munitions site was mapped with a metal detector and all detected metallic objects were investigated by digging. Previous studies show that less 1% of these objects were UXO items of interest. The majority of what was dug is scrap metal, bits of shrapnel, or trash. The advanced EM technique used by the MetalMapper 2x2 allows geophysicists to identify UXO targets of interest among the scrap, significantly reducing the number of items which are investigated by digging. This reduction in digging translates to a much safer, more economical, and quicker UXO cleanup project. G-864 Magnetometer Cesium vapor magnetometers can resolve changes in the magnetic field as small as 0.004nT while sampling at high rates. The high resolution and fast sample rate are important for unexploded ordnance (UXO) detection where ferrous targets may be small and a rapid survey speed reduces survey costs. Traditional handheld analog magnetometer surveys for UXO used only audible beeps and required operators to manually flag suspected targets, which may fail to capture all magnetic targets at a site. With the G-864 Magnetometer, large areas can be rapidly surveyed. GPS-located magnetic data is stored for processing, ensuring that all targets in a given area can be located. The G-864 includes GPS navigation features which guide and ensure the operator gets full coverage of the survey area. High-quality magnetic data can be processed to detect all sizes of UXO, ranging in size from small arms rounds to large aerial bombs. The G-864 is the most advanced backpack magnetometer on the market for UXO surveys. MagArrow Magnetometer In most contexts, UXO are spread out over large areas, in no particular pattern, due to the original method of ordnance deployment. To most efficiently surveys these large regions of land which post a danger to people and property, the MagArrow UAS-Enabled Magnetometer is the tool of choice. With its fast mode of transportation and revolutionary MFAM Magnetomer internals, the MagArrow is the best way to start a UXO job. Simply turn the MagArrow on and GPS-located magnetic data automatically starts to be collected and stored for processing. Built-in redundancies ensure that data is saved even in adverse situations, and that all targets in a given area can be located. The above magnetic data was collected with the MagArrow. The MagArrow was flown over 4 UXO targets 5 meters above ground level. Strength of the anomalous magnetic field registered by the MagArrow depended on the orientation of the UXO relative to the MFAM sensor inside the MagArrow. Marine UXO Detection G-882 Magnetometer Unexploded Ordnance (UXO) present a serious danger to people and property. In previously war-torn areas of the world, the importance to locate and remove UXO is steadily in demand, for the safety of local and commercial interest. Government agencies, construction companies, and offshore wind farm developers are a few examples of groups that must locate and remove UXO before development can begin. UXO are commonly made from ferrous materials, making them a readily identifiable target for a magnetometer system. Due to its unmatched specifications and sensitivity, the G-882 Marine Magnetometer is the system of choice for UXO remediation in the North Sea in preparation for growing offshore wind farm development. A general understanding of typical size and shapes of the magnetic signature of your target is needed to prepare a magnetic survey. In general, a small target like a UXO, will require a line separation of 2-5 meters and a sensor height of 3-5 meters from the seafloor, depending on the smallest target of interest. Being highly customizable depending on the survey requirements, such as an available G-882TVG Transverse Gradiometer setup, the G-882 Marine Magnetometer is the first choice for underwater UXO detection."
