of classes (ignored if scheme is None) vminNone or float (default None)Minimum value of cmap. If None, the minimum data value in the column to be plotted is used. vmaxNone or float (default None)Maximum value of cmap. If None, the maximum data value in the column to be plotted is used. markersizestr or float or sequence (default None)Only applies to point geometries within a frame. If a str, will use the values in the column of the frame specified by markersize to set the size of markers. Otherwise can be a value to apply to all points, or a sequence of the same length as the number of points. figsizetuple of integers (default None)Size of the resulting matplotlib.figure.Figure. If the argument axes is given explicitly, figsize is ignored. legend_kwdsdict (default None)Keyword arguments to pass to matplotlib.pyplot.legend() or matplotlib.pyplot.colorbar(). Additional accepted keywords when scheme is specified: fmtstringA formatting specification for the bin edges of the classes in the legend. For example, to have no decimals: {"fmt": "{:.0f}"}. labelslist-likeA list of legend labels to override the auto-generated labels. Needs to have the same number of elements as the number of classes (k). intervalboolean (default False)An option to control brackets from mapclassify legend. If True, open/closed interval brackets are shown in the legend. categorieslist-likeOrdered list-like object of categories to be used for categorical plot. classification_kwdsdict (default None)Keyword arguments to pass to mapclassify missing_kwdsdict (default None)Keyword arguments specifying color options (as style_kwds) to be passed on to geometries with missing values in addition to or overwriting other style kwds. If None, geometries with missing values are not plotted. aspect‘auto’, ‘equal’, None or float (default ‘auto’)Set aspect of axis. If ‘auto’, the default aspect for map plots is ‘equal’; if however data are not projected (coordinates are long/lat), the aspect is by default set to 1/cos(df_y * pi/180) with df_y the y coordinate of the middle of the GeoDataFrame (the mean of the y range of bounding box) so that a long/lat square appears square in the middle of the plot. This implies an Equirectangular projection. If None, the aspect of ax won’t be changed. It can also be set manually (float) as the ratio of y-unit to x-unit. autolimbool (default True)Update axes data limits to contain the new geometries. **style_kwdsdictStyle options to be passed on to the actual plot function, such as edgecolor, facecolor, linewidth, markersize, alpha. Returns: axmatplotlib axes instance Examples >>> import geodatasets >>> df = geopandas.read_file(geodatasets.get_path("nybb")) >>> df.head() BoroCode ... geometry 0 5 ... MULTIPOLYGON (((970217.022 145643.332, 970227.... 1 4 ... MULTIPOLYGON (((1029606.077 156073.814, 102957... 2 3 ... MULTIPOLYGON (((1021176.479 151374.797, 102100... 3 1 ... MULTIPOLYGON (((981219.056 188655.316, 980940.... 4 2 ... MULTIPOLYGON (((1012821.806 229228.265, 101278... >>> df.plot("BoroName", cmap="Set1") See the User Guide page Mapping and plotting tools for details.'
