title = "geopandas.GeoDataFrame.to_postgis — GeoPandas 1.0.1+0.g747d66e.dirty documentation"
description = "GeoDataFrame."
full_description = '''geopandas.GeoDataFrame.to_postgis# GeoDataFrame.to_postgis(name, con, schema=None, if_exists='fail', index=False, index_label=None, chunksize=None, dtype=None)[source]# Upload GeoDataFrame into PostGIS database. This method requires SQLAlchemy and GeoAlchemy2, and a PostgreSQL Python driver (psycopg or psycopg2) to be installed. It is also possible to use to_file() to write to a database. Especially for file geodatabases like GeoPackage or SpatiaLite this can be easier. Parameters: namestrName of the target table. consqlalchemy.engine.Connection or sqlalchemy.engine.EngineActive connection to the PostGIS database. if_exists{‘fail’, ‘replace’, ‘append’}, default ‘fail’How to behave if the table already exists: fail: Raise a ValueError. replace: Drop the table before inserting new values. append: Insert new values to the existing table. schemastring, optionalSpecify the schema. If None, use default schema: ‘public’. indexbool, default FalseWrite DataFrame index as a column. Uses index_label as the column name in the table. index_labelstring or sequence, default NoneColumn label for index column(s). If None is given (default) and index is True, then the index names are used. chunksizeint, optionalRows will be written in batches of this size at a time. By default, all rows will be written at once. dtypedict of column name to SQL type, default NoneSpecifying the datatype for columns. The keys should be the column names and the values should be the SQLAlchemy types. See also GeoDataFrame.to_filewrite GeoDataFrame to file read_postgisread PostGIS database to GeoDataFrame Examples >>> from sqlalchemy import create_engine >>> engine = create_engine("postgresql://myusername:mypassword@myhost:5432/mydatabase") >>> gdf.to_postgis("my_table", engine)'''
year_published = 2025
