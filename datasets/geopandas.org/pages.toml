olumn level(s) removed. dropna(*[, axis, how, thresh, subset, ...]) Remove missing values. duplicated([subset, keep]) Return boolean Series denoting duplicate rows. dwithin(other, distance[, align]) Returns a Series of dtype('bool') with value True for each aligned geometry that is within a set distance from other. eq(other[, axis, level]) Get Equal to of dataframe and other, element-wise (binary operator eq). equals(other) Test whether two objects contain the same elements. estimate_utm_crs([datum_name]) Returns the estimated UTM CRS based on the bounds of the dataset. eval(expr, *[, inplace]) Evaluate a string describing operations on DataFrame columns. ewm([com, span, halflife, alpha, ...]) Provide exponentially weighted (EW) calculations. expanding([min_periods, axis, method]) Provide expanding window calculations. explode([column, ignore_index, index_parts]) Explode multi-part geometries into multiple single geometries. explore(*args, **kwargs) Interactive map based on GeoPandas and folium/leaflet.js extract_unique_points() Returns a GeoSeries of MultiPoints representing all distinct vertices of an input geometry. ffill(*[, axis, inplace, limit, limit_area, ...]) Fill NA/NaN values by propagating the last valid observation to next valid. fillna([value, method, axis, inplace, ...]) Fill NA/NaN values using the specified method. filter([items, like, regex, axis]) Subset the dataframe rows or columns according to the specified index labels. first(offset) Select initial periods of time series data based on a date offset. first_valid_index() Return index for first non-NA value or None, if no non-NA value is found. floordiv(other[, axis, level, fill_value]) Get Integer division of dataframe and other, element-wise (binary operator floordiv). force_2d() Forces the dimensionality of a geometry to 2D. force_3d([z]) Forces the dimensionality of a geometry to 3D. frechet_distance(other[, align, densify]) Returns a Series containing the Frechet distance to aligned other. from_arrow(table[, geometry]) Construct a GeoDataFrame from a Arrow table object based on GeoArrow extension types. from_dict(data[, geometry, crs]) Construct GeoDataFrame from dict of array-like or dicts by overriding DataFrame.from_dict method with geometry and crs from_features(features[, crs, columns]) Alternate constructor to create GeoDataFrame from an iterable of features or a feature collection. from_file(filename, **kwargs) Alternate constructor to create a GeoDataFrame from a file. from_postgis(sql, con[, geom_col, crs, ...]) Alternate constructor to create a GeoDataFrame from a sql query containing a geometry column in WKB representation. from_records(data[, index, exclude, ...]) Convert structured or record ndarray to DataFrame. ge(other[, axis, level]) Get Greater than or equal to of dataframe and other, element-wise (binary operator ge). geom_almost_equals(other[, decimal, align]) Returns a Series of dtype('bool') with value True if each aligned geometry is approximately equal to other. geom_equals(other[, align]) Returns a Series of dtype('bool') with value True for each aligned geometry equal to other. geom_equals_exact(other, tolerance[, align]) Return True for all geometries that equal aligned other to a given tolerance, else False. get(key[, default]) Get item from object for given key (ex: DataFrame column). get_coordinates([include_z, ignore_index, ...]) Gets coordinates from a GeoSeries as a DataFrame of floats. get_geometry(index) Returns the n-th geometry from a collection of geometries. get_precision() Returns a Series of the precision of each geometry. groupby([by, axis, level, as_index, sort, ...]) Group DataFrame using a mapper or by a Series of columns. gt(other[, axis, level]) Get Greater than of dataframe and other, element-wise (binary operator gt). hausdorff_distance(other[, align, densify]) Returns a Series containing the Hausdorff distance to aligned other. head([n]) Return the first n rows. hilbert_distance([total_bounds, level]) Calculate the distance along a Hilbert curve. hist([column, by, grid, xlabelsize, xrot, ...]) Make a histogram of the DataFrame's columns. idxmax([axis, skipna, numeric_only]) Return index of first occurrence of maximum over requested axis. idxmin([axis, skipna, numeric_only]) Return index of first occurrence of minimum over requested axis. infer_objects([copy]) Attempt to infer better dtypes for object columns. info([verbose, buf, max_cols, memory_usage, ...]) Print a concise summary of a DataFrame. insert(loc, column, value[, allow_duplicates]) Insert column into DataFrame at specified location. interpolate(distance[, normalized]) Return a point at the specified distance along each geometry intersection(other[, align]) Returns a GeoSeries of the intersection of points in each aligned geometry with other. intersection_all() Returns a geometry containing the intersection of all geometries in the GeoSeries. intersects(other[, align]) Returns a Series of dtype('bool') with value True for each aligned geometry that intersects other. is_valid_reason() Returns a Series of strings with the reason for invalidity of each geometry. isetitem(loc, value) Set the given value in the column with position loc. isin(values) Whether each element in the DataFrame is contained in values. isna() Detect missing values. isnull() DataFrame.isnull is an alias for DataFrame.isna. items() Iterate over (column name, Series) pairs. iterfeatures([na, show_bbox, drop_id]) Returns an iterator that yields feature dictionaries that comply with __geo_interface__ iterrows() Iterate over DataFrame rows as (index, Series) pairs. itertuples([index, name]) Iterate over DataFrame rows as namedtuples. join(other[, on, how, lsuffix, rsuffix, ...]) Join columns of another DataFrame. keys() Get the 'info axis' (see Indexing for more). kurt([axis, skipna, numeric_only]) Return unbiased kurtosis over requested axis. kurtosis([axis, skipna, numeric_only]) Return unbiased kurtosis over requested axis. last(offset)