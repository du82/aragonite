full_description = 'Experiential Learning Vol. 1: BEGINNING http://leanpub.com/Experiential Vol. 2: INVENTION http://leanpub.com/Inventing Vol. 3: SIMULATION http://leanpub.com/Simulation <img src="http://geraldmweinberg.com/Site/Experiential_Learning_files/bookpage1340310923.jpg" /> Dale Emery writes: Gerald Weinberg has launched a new book series called Experiential Learning.If you design or run experiential workshops, check it out. If you have never run an experiential workshop, but would like to, check it out. If you have no idea what experiential learning is, check it out. Over the past 23 years I’ve attended at least a dozen of Jerry’s workshops—maybe two dozen—on topics such as leadership, writing, and consulting. Jerry’s workshops have been enormously influential in my life, not only for what I learned about their content, but also for what I learned about how to create and run experiential workshops.'
