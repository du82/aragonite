full_description = '''Dani Weinberg Bios <img src="https://geraldmweinberg.com/wp-content/uploads/2019/12/Dani-Rug.jpeg" alt='Dani Weinberg' width='1080' height='675' /> Dani has been teaching people for over 30 years, and is co-designer of the Problem Solving Leadership Workshop. Her publications include several books and numerous articles based on her anthropological field research in Europe, computer applications in the social sciences, and studies of modern hi-tech organizations. She has co-authored a volume on general systems thinking, General Principles of Systems Design. Dani is an organizational consultant and Emeritus Professor of Anthropology, University of Nebraska. Among her other talents, she is an outstanding trainer of dogs, of therapy dogs, of dog trainers, and of trainers of dog trainers, as well as a consultant and writer on animal behavior-with her special love given to German Shepherd Dogs. She is a field trainer for Paws with a Cause, an organization that provides assistance dogs for deaf people, people in wheelchairs, and seizure patients. If you have any dog stories or dog training problems, she’d love to hear from you.'''
