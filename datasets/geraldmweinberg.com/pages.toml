full_description = '''<img src="http://geraldmweinberg.com/wp-content/uploads/2019/12/shapeimage_1.png" alt="" /> Welcome to the Gerald M. Weinberg Fan Site! Mr. Gerald M. Weinberg was an inspiration to me. I’ve read many of his books and loved the quotes he would use on his homepage. His thoughts and writings undoubtedly made my personal and professional life fuller, happier, and more productive. In honor of Jerry’s technical teachings and inspirational contributions to readers around the world, I am bringing back his website in hopes that others will discover this author and likewise be inspired by him as I have. – Nancy P. Dedicated to Helping Smart People Be Happy The Learning Laboratory Traversing this web site, you’ll find out more about the “learning laboratory” we’ve created. Pre-entry You may have discovered Weinberg & Weinberg through our books. Some find this website and join the SHAPE forum. Entry By participating in the Problem Solving Leadership Workshop, you fully enter the W&W Learning Laboratory. The Nucleus After PSL, the Congruent Leadership Change Shop takes you deeper into the laboratory experience. After the Change Shop, you become eligible for the Software Engineering Management Development Group. SEM is a year-long program that extends indefinitely, and branches out into other SEM-only activities, such as the SEM Writers Workshop and the SEM Camp. The Web PSL, Change Shop, and SEM form the nucleus of the learning laboratory, but the lab has many rooms, with many experimenters. Once you have entered, you can explore at your own pace, according to your own interests. You can be a SHAPE member, attend a workshop offered by PSL faculty or Change Shop faculty, read a book, visit your SEM group, or get help with experiments in your own organization. The laboratory continues to grow, and where it stops, nobody knows. Each person is important and can mean something for the world. You can do more than you think. Feel inspired by this. Buy Gerald's Boo