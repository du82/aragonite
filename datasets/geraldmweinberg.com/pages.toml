description = "<h1>Problem Solving Leadership Workshop (PSL)</h1>   PSL is the entry point to a collection of W & W  Seminars, your first step on a new life journey.  We believe in the uniqueness of learning styles, so we offer you a spectrum of ways to view PSL:"
full_description = "How Can I Get My Company/My Boss to Sponsor Me to PSL? by Jerry Fan | Problem Solving LeadershipI'm ready to go. How do I get my boss to support me? PSL is the Gateway by Jerry Fan | Congruent Leadership Change Shop, Problem Solving LeadershipOnce I complete PSL, what new doors are open to me? Who Comes to PSL? by Jerry Fan | Problem Solving LeadershipWho Comes to PSL? What Organizations? Who Teaches? The Logic of PSL by Jerry Fan | Problem Solving LeadershipHistory and Philosophy PSL was created in 1974 by Dani and Jerry Weinberg and Don Gause to develop leaders who can effectively manage change and practice innovation. As PSL has evolved, over 3,000 people from all over the globe have taken the workshop and have used... PSL Faculty Stories by Jerry Fan | Problem Solving LeadershipThe students aren't the only ones who learn in PSL. What do faculty say about their PSL experiences? PSL Stories by Jerry Fan | Problem Solving LeadershipWhat do graduates say about their PSL experiences and what happens afterwards? Comments by Jerry Fan | Problem Solving LeadershipComments What do graduates say about their PSL experiences and what happens afterwards?"
