full_description = '''Aremac Power: Inventions at Risk Novels <img src="https://geraldmweinberg.com/wp-content/uploads/2019/12/aremac-power.jpg" alt='Aremac Power: Inventions at Risk' width='1080' height='675' /> Marna has a PhD in theoretical physics. So does Tess. Marna is unhappy–nobody pays attention to her theory of quantum displacement. Tess is unhappy–everybody pays attention to Aremac, her reverse camera. Evil people will go to any length to steal their work, … … but first they will have to outwit Tess and Marna’s team of geniuses. Sample and/or Buy the ebook through: KINDLE Barnes & Noble Smashwords Buy at Amazon.com tags: science fiction, technothriller, invention, technology, genius, smart, coming of age, action, fantasy adventure, Navajo Rebecca Shelley (R.D. Henham) author of /The Red Dragon Codex) The science is so real I felt like I could go out tomorrow and buy an AREMAC-controlled wheelchair. Way cool. The characters were every bit as interesting as the science. Gerald gives an unbiased, inside look at a culture that many misunderstand and fear. This is a great book. Review by: Twisted Root Publishing Reading Gerald M. Weinberg’s Aremac Power: Inventions at Risk was like a return to the golden age of science fiction, when we all believed that science and scientists were good and, if we were just smart enough, technology could solve any human problem. Of course Weinberg has updated the themes to fit today’s world and its problems. The book provides a fast-paced follow-up to the previous book in the series, The Aremac Project, but you don’t need to have read book one to enjoy this one. Coupling Theoretical Physics, governments’ need to control technology to their advantage, the culture of Navaho reservations, and the ever-seething turmoil of West African states, Weinberg takes you on a rip-roaring ride across the world as the band of scientists responsible for the memory-reading Aremac struggle to maintain ethical control of `the monster’ technology they’ve constructed. Review by: Doomed Muse Press I really enjoyed this book. It’s a follow up to the book “The Aremac Project” but I read them out of order. The author does a good job of giving enough information on the events of the previous novel that I didn’t feel lost at all and was sucked in right away by the challenges the characters faced and the cool ideas surrounding the Aremac itself. Some of the science takes a little suspension of disbelief, but that’s true of a lot of science fiction. No one really understands yet how memories are exactly processed and stored, so there’s lots of theoretical lee-way and the tech used here explores one path. The relationships between the characters, as well as their relationships with technology and their cultures, are also well-developed. This was a very enjoyable read and the pacing was spot on.'''
