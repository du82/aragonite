["https://geraldmweinberg.com/Bio.Jean.html"]
title = "Jean McLendon | GeraldMWeinberg.com"
full_description = '''Jean McLendon Bios <img src="https://geraldmweinberg.com/wp-content/uploads/2019/12/Jean-Neal.jpeg" alt='Jean McLendon' width='1080' height='675' /> Jean’s career in human system change spans over 25 years and, for nearly that long, she enjoyed a student, friend, and collegial relationship with Virginia Satir. Jean has served on the faculties of the University of North Carolina, the National Institute of Mental Health Staff College, and Union Institute. Currently she is a faculty resource person for the Whole Systems Organizational Design graduate program at Antioch University in Seattle and a faculty member of the Avanta Network and the Satir Institute of the Southeast. She has managed four human services programs, been a founding partner in a consulting firm and is a practicing psychotherapist, clinical supervisor, and organizational consultant. Jean blends her psychotherapeutic, teaching, leadership and organizational development skills with family systems communication theories into an esteem-building, performance-based, approach to change which is outcome-guided and process-driven. Her work supports her belief that congruence, with its reflection of self- and system-esteem, is the single most powerful intervention strategy for changing one’s health, relationships, and performance – both in and out of organizations.'''
