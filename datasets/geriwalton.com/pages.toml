full_description = "Tattooing: A Fad of the Late Nineteenth Century By Geri Walton | November 29, 2021 | 0 There is evidence that some of the earliest practices of tattooing happened around 4,000BC. However, despite tattooing have had a long history, public awareness of it did not begin to spread until the 1870s. The reason for this had to do with a legal case that captivated Victorian England and was often known as the… Read More Death by Corset and Tight Lacings in the 1800s By Geri Walton | November 8, 2021 | 0 Before many death by corset stories surfaced, critics against these garments voiced their negative opinions of them. For instance, in 1844 the Dublin Weekly Herald stated: Read More Caps: Nightcaps, Monmouth Caps, Thinking Caps, Pudding Caps, and White Caps By Geri Walton | May 31, 2021 | 1 There are all sorts of caps from history. For instance, there was the mythical fairy or ghost in English folklore known as the bluecap and the redcap was a type of malevolent, murderous goblin found in Border folklore. A type of cap you wore on your head was the Liberty cap. It came to represent… Read More Dolly Varden Fashions: A Late Nineteenth-Century Fad By Geri Walton | March 1, 2021 | 2 The Dolly Varden fashions were a version of popular fashions worn originally in the 1770s and 1780s embraced by women such as Marie Antoinette, the Duchess Polignac, or the Princesse de Lamballe. Dolly Varden fashions later became popular in Great Britain and the United States between about 1869 and the 1880s with the fad peaking… Read More Decorative Hair Combs of the 19th Century By Geri Walton | January 4, 2021 | 0 Decorative hair combs date to the earliest of times and were created from all sorts of materials. For instance, ancient combs were made from wood, bones, ivory, feathers, and other natural type materials. Sometimes they were “studded” with gems or painted with designs. These early decorative hair combs were also often flat in construction but… Read More Wigs: Their Wearers and Eighteenth-Century Anecdotes By Geri Walton | August 3, 2020 | 0 In the eighteenth century, those who wore wigs almost always powdered them. By the 1780s, young men were moving away from wigs and were powdering their own natural hair and by the 1790s both wigs and hair powder were used primarily by older, more conservative men, such as Voltaire, whom Madame Tussaud made sure had… Read More"
