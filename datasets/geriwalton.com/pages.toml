description = "Ideas of female beuty in the 1700 and 1800s varied. There was the idea of classical beauty with Venus representing the ideal image and"
full_description = "Ideas of Female Beauty in the 1700 and 1800s By Geri Walton | August 25, 2014 | 3 Beauty was important to women, but, perhaps, it was even more important to men, because it was a man who noted in the late 1700s that a woman’s “first merit is that of beauty.”[1] People seemed to have particular ideas of what beauty entailed and wrote about it. André Félibien, a French chronicler of the arts and the official court historian to Louis XIV of France in the 1600s, provided the following classical description of beauty often using Venus as the ideal image: The Head should be well rounded; and look rather inclining to small than large. The Forehead white, smooth, and open (not with the Hair growing down too deep upon it;) neither flat nor prominent, but like the Head well rounded; and rather small in Proportion than large. The Hair either bright, black or brown; not thin, but full and waving, and if it falls in moderate Curls the better. The Eyes, black, chestnut, or blue; clear, bright, and lively, and rather large in Proportion than small. The Eyebrows, well divided, rather full than thin; semicircular, and broader in the Middle than at the Ends. The Cheeks should not be wide; should have a Degree of Plumpness, with the Red and White finely blended together; and should look firm and soft. The Ear should be rather small than large; well folded,…with an agreeable Tinge of Red. The Nose should be placed so as to divide the Face into two equal Parts; should be of a moderate Size, strait, and well-squared; though sometimes a little Rising in the Nose,…may give a very graceful look to it. The Mouth should be small; and the Lips not of equal Thickness: They should be well-turned, small rather than gross; soft, even to the Eye; and with a living Red in them. A truly pretty Mouth is like a Rose-bud that is beginning to blow. The Teeth should be middle-sized, white, well-ranged, and even. The Chin, of a moderate Size; white soft, and agreeably rounded. The Neck should be white, strait, and of a soft, easy, and flexible Make, rather long than short; less above, and encreasing [sic] gently toward the Shoulders: The Whiteness and Delicacy of its Skin should be continued, or rather go on improving, to the Bosom. The Skin in general should be white, properly tingled with Red; with an apparent Softness, and a Look of thriving Health in it. The Shoulders should be white, gently spread, and with a much softer Appearance of Strength, than in those of Men. The Arm should be white, round, firm, and soft; and more particularly so from the Elbow to the Hands. The Hand should unite insensibly with the Arm;…They should be long and delicate, and even the Joints and nervous Parts of them should be without either any hardness or dryness. The Fingers should be fine, long, round and soft; small, and lessening towards the Tips of them: And the Nails long, rounded at the Ends, and pellucid. The Bosom should be white and charming; and the Breasts equal in Roundness, Whiteness, and Firmness; neither too much elevated, nor too much depressed; rising gently, and very distinctly separated. The Sides should be long, and the Hips wider than the Shoulders…and go down rounding, and lessening gradually to the Knee. The Knee should be even, and well-rounded: the Legs strait, but varied by a proper Rounding of the more fleshy Part of them; and the Feet finely turned, white, and little.[2] Venus, the classical image of youthful female beauty. Courtesy of Wikipedia. A hundred years later in 1787, a Georgian gentleman detailed his idea of beauty. He noted that “every one will make what alteration his own taste may suggest,”[3] and provided a thirty point list: Youth. Stature, neither too high nor two low. Neither too fat nor too lean. The symmetry and proportion of all parts. Long hair, or prettily curled, fine and silky soft. The skin smooth, delicate, and of a fine grain. Lively white and red. A smooth high forehead. The temples not sunk in. The eye-brows in arcade, like two lines. The eyes blue, their orbits well-fashioned, and turned to sweetness. The nose rather long than short. The cheeks rounding away in softened profils [sic], and dimpled. An agreeable smile. Two lips, pouting, of the coral hue. A small mouth. Teeth, pearly white, even and well set. The chin rather round, plump, and ending with a dimple. The ears small, and close to the head. A neck of ivory. A breast of alabaster. Two balls of snow, firm, self-sustained, and deliciously distanced. A white hand, plump and long. Fingers tapering. Nails of mother-o’-pearl, and oval-formed. A sweet breath. An agreeable voice. A free unaffected air and carriage. The shape noble, easy, and disengaged. A modest gait and deportment. Queen Louise of Prussia admired as the most beautiful woman in Europe during the Georgian Era. Courtesy of Wikipedia. By the Victorian Era, the idea of beauty was changing, and there was a greater emphasis on internal beauty. One author noted that “many women who can lay no claims to a beautiful face have carried captive the hearts of plenty of men by the beauty of their form [and the temple of their soul].”[4] In fact, the soul was not to be neglected as “every woman owes it not only to herself, but to society, to be as beautiful and charming as she possibly can.”[5] Mid to late nineteenth century people also noted that beauty began in infancy, and, at least one author commented: “[N]othing should be done at that tender age to obstruct the natural swell and growth of all the parts … [a] girl should understand, as soon as she comes to the years of discretion, or as soon as she is old enough to realize the importance of beauty to a woman, that she has, to a certain extent, the management of her own form within her power.”[6] Portrait by Jacques-Louis David of Madame Récamier, who was a celebrated beauty of the Regency and Victorian Eras. Courtesy of Wikipedia Besides the idea that a woman had power over her form and that corsets and stays were perhaps injurious, there were other areas of beauty that needed to be considered in the nineteenth century. Exercise was one such area as it was noted that plenty of exercise, in the open air resulted in a handsome form and a handsome form was made much more so by a woman’s ability to be elastic, which resulted in a “flexible, wavy and undulating [form] as … graceful [as] … lilies of the field.”[7] A fine and well-trained voice was another element of beauty, but it was deportment in the late nineteenth century that was claimed to be the most essential element of beauty because according to one source: “[T]he most beautiful and well dressed woman will fail to be charming unless all her other attractions are set off with a graceful and fascinating deportment. A pretty face may be seen everywhere, beautiful and gorgeous dresses are common enough, but how seldom do we meet with a really beautiful and enchanting demeanor!”[8] References: [1] Bell, J., The Dictionary of Love, 1787, no page number. [2] Hay, William, Fugitive Pieces on Various Subjects, 1771, p. 16-18. [3] Bell, J., no page number. [4] Montez, Lola, The Arts of Beauty, Or, Secrets of a Lady’s Toilet, 1858, p. 24. [5] Ibid., p. 25. [6] Ibid., p. 26. [7] Ibid., p. 34. [8] Ibid., p. 70. #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mp_form_popup1 .mailpoet_segment_label, #mp_form_popup1 .mailpoet_text_label, #mp_form_popup1 .mailpoet_textarea_label, #mp_form_popup1 .mailpoet_select_label, #mp_form_popup1 .mailpoet_radio_label, #mp_form_popup1 .mailpoet_checkbox_label, #mp_form_popup1 .mailpoet_list_label, #mp_form_popup1 .mailpoet_date_label { display: block; font-weight: normal; } #mp_