title = "French Revolution Archives - geriwalton.com"
full_description = "Stories About the French Revolution by Those Who Lived It By Geri Walton | January 20, 2020 | 0 Stories about the French Revolution frequently begin with the fall of the Bastille because it was a pivotal moment that happened on 14 July 1789 when revolutionaries stormed the prison that had once been a fortress. For many of them, the Bastille was a symbol of Louis XVI’s tyranny and monarchical despotism and therefore important… Read More Pierre Charles L’Enfant Revolutionary Architect and Washington, D.C. Planner By Geri Walton | August 2, 2019 | 0 Pierre Charles L’Enfant was a military engineer born in Paris on 2 August 1754 to Pierre L’Enfant, a painter who served King Louis XV, and Marie L’Enfant, the daughter of a minor court official. After his older brother died at the age of six, L’Enfant was sent to study art at the Royal Academy in… Read More Severed Heads During the French Revolution By Geri Walton | July 9, 2018 | 2 Suppose you see a severed head dripping blood on a pike. What do you feel? Revulsion? Terror? Severed heads were often a common image associated with the French Revolution. Why were they so prevalent and how prevalent were they? Read More An Escape From the Guillotine During the French Revolution By Geri Walton | July 28, 2017 | 0 During the French Revolution, between 5 September 1793 and 28 July 1794 (a period known as The Terror), it has been estimated that at least 40,000 people were executed, including Maximilien Robespierre, a French lawyer and politician, and one of the best known and most influential figures associated with the French Revolution. Official records however… Read More Edmund Burke’s “Reflections on the Revolution in France” By Geri Walton | July 14, 2017 | 0 Edmund Burke wrote the pamphlet, Reflections on the Revolution in France, And on the Proceedings in Certain Societies in London Relative to that Event, In a Letter Intended to Have Been Sent to a Gentleman in Paris. He did so in 1790 and besides being remembered for his objections to the French Revolution he is… Read More"
