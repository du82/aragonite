full_description = "Napoleon Bonaparte’s Military Carriage: How it was Captured By Geri Walton | June 14, 2018 | 0 One prized possession of Napoleon Bonaparte’s was his military carriage (sometimes called his traveling carriage). He loved it so much that he used it on many of his military campaigns and while exiled on Elba. In fact, when he left Elba the one thing he ordered his troops to take was his military carriage, which… Read More Napoleon’s Military Carriage at Madame Tussaud’s By Geri Walton | February 12, 2018 | 0 Among the many relics at Madame Tussaud’s was Napoleon’s military carriage used by him on many of his campaigns and while he was exiled on Elba. The carriage had been captured at Genappe during the Waterloo campaign. The French overturned cannons and carriages and from behind these barricades, they fired muskets attempting to stop the… Read More Dominique Jean Larrey: Innovator of Battlefield Medicine By Geri Walton | July 7, 2017 | 0 Battlefield medicine and triage innovator Dominique Jean Larrey was at one time forgotten as much as Napoleon Bonaparte was immortalized. Yet, Larrey’s contributions to military medicine and his care and compassion towards wounded soldiers on both sides while he served in Napoleon’s Grande Armée, enabled hundreds of soldiers to survive. It also resulted in him… Read More Battlefield Communication Using Drums and Drumming By Geri Walton | March 27, 2017 | 0 Battlefield communication using drums and drumming was an important military aspect of war, and this type of communication lasted well into the nineteenth century. During this time, the drum most popular among drummers was the ordinary drum that consisted of a wooden or brass cylinder with a skin head at either end, and described in… Read More"
