full_description = "Copper King Mansion and William A. Clark By Geri Walton | June 13, 2022 | 0 William A. Clark built the 34-room Copper King Mansion in Butte, Montana between 1884 and 1889. It was situated in what was called Uptown and was reported to have nine fireplaces imported from France, ninety doors, and six-hundred and thirty-nine windowpanes. In addition, there was a grand staircase, known as the “Staircase of All Nations”… Read More Château de Rambouillet, the Estate, and its History By Geri Walton | October 5, 2020 | 0 The Château de Rambouillet also known in English as the Castle of Rambouillet, is a château in the town of Rambouillet in northern France about 31 miles southwest of Paris. It was originally a fortified manor that dates to 1368. King Francis I died there in 1547 and during the reign of Louis XVIII it… Read More Virginia City: An American Silver Mining Boomtown By Geri Walton | September 28, 2020 | 0 Virginia City developed as a boomtown after the January discovery in 1859 of the first major U.S. silver ore deposit known as the Comstock Lode.* Located in Storey County in the state of Nevada, the population reached around 25,000 in the mid-1870s and then declined after 1878. In addition, some people consider Virginia City to… Read More Hell on Wheels: Temporary Cities of the Transcontinental Railroad By Geri Walton | September 14, 2020 | 0 “Hell on Wheels” was an itinerant tent city that included a collection of gambling houses, dance halls, saloons, and brothels that moved from place to place in the 1860s as it followed the army of Union Pacific railroad workers who were constructing the First Transcontinental Railroad in North America. It also formed mushrooming municipalities and… Read More Fonthill Castle: Edwin Forrest’s Country Estate By Geri Walton | August 10, 2020 | 0 Fonthill Castle was built in 1852 in The Bronx borough of New York City by prominent American Shakespearean actor Edwin Forrest and his wife Catherine Norton Sinclair. According to American actor Lawrence Barrett, the architectural designs used to build Fonthill Castle came from the ideas generated by Sinclair and were then approved by Forrest. However,… Read More"
