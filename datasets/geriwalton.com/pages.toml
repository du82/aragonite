["https://www.geriwalton.com/21-nicknames-of-napoleon"]
title = "Nicknames of Napoleon: Twenty-one Names - geriwalton.com"
description = "Nicknames have always been popular. They serve as substitute for a person's proper name and nicknames of Napoleon Bonaparte, the famous French military and"
full_description = "Nicknames of Napoleon: Twenty-one Names By Geri Walton | March 23, 2016 | 0 Nicknames have always been popular. They serve as substitute for a person’s proper name and are sometimes used affectionately or at other times as a form of ridicule. Napoleon Bonaparte, the famous French military and political leader who rose to prominence during the French Revolution, was the recipient of both types of nicknames. One of the first nicknames he acquired was “Nabulio,” which mean little meddler. This affectionate nickname was given to him by his family and referred to the mischief he reputedly caused. Napoleon later received many other nicknames. Among the many nicknames that Napoleon acquired are twenty-one (list below), as well as a brief description of how he obtained each one. Napoleon Bonaparte. Author’s collection. Boney or Little Boney: The British began calling him this at the beginning of the nineteenth century and used even after the fall of the Empire. There are several explanations as to how Napoleon got this derisive nickname. One explanation is that “Boney” was a contraction of his surname Bonaparte and that Boneys, which was both a short name and displayed a certain lack of respect, was also used to refer to the French military under Napoleon. In addition, caricatures of John Bull were “fleshy, robust, and virile, a meat-eating man-at-arms ready to die for his … king. His French counterpart was lean, dry, and fey, a frog-eating fop.”[1] Thus, British caricaturists showed Napoleon as thin, which some say encouraged the “Boney” or “Little Boney” nickname. Caporal la Violette: Although there are many stories about Napoleon and violets, this nickname was supposedly given to Napoleon by his French friends while he was living in exile. It expressed their hope that he would return in springtime when the violets bloomed. Moreover, these same partisans were said to wear violets in the secret hope that he would return, and they used the term to to conceal discussions about him. The Day of Violets was said to have occurred on 1 March 1815 because after Napoleon’s escape from Elba, that was the day he landed at Golfe-Juan with 800 soldiers and marched towards Paris. Colossus of the Nineteenth Century: Napoleon got this nickname because of the colossal power that he was said to wield during the early part of the 19th century. Corsican Fiend: Because Napoleon was born in Corsica, there were many nicknames assigned to him with the word Corsican in it. For instance he was called Corsican Sesostris, Corsican General, and Corsican Ogre. However, the nickname “Corsican Fiend” was said to have been given him by Sir John Stoddart, a writer, lawyer, and editor of The Times. “Fleshy ci-devant Boney” (Napoleon in Exile on St Helena). Courtesy of Royal Collection Trust. Fleshy: Although Napoleon may have started out being called “Boney” by the end of his reign British caricaturists were often calling him “Fleshy” because he gotten so fat and put on so much weight. God Hanuman: Robert Southey called Napoleon this in a letter to William Taylor Norwich, stating: “For the last ten years the madness has been Bonaparte’s, but the atrocities have been those of the French. He was the God Hanuman — the monkeys, whom he commanded, did the mischief.”[2] God of Clay: The English poet and leading figure in the Romantic movement, Lord Bryon, developed an obsession for Napoleon. He wrote a number of works related to him, and this was the name he gave Napoleon in his poem Don Juan. Jean d’Épée: Napoleon got this name from French partisans, “who endeavored to re-establish him upon the throne after his banishment to Elba.”[3] Jupiter Scapin: The Abbé Dominique Dufour or de Fourt de Pradt who was a French clergyman, ambassador, and secretary to Napoleon, is credited with having given this nickname to him. It alluded to Napoleon’s cunning and his “greatness and littleness” of character. L’Autre: Meaning the “other one,” this nickname was used by Napoleon’s partisans during his time at Elba. Le Général Entrepreneur: This translates to “The Contractor General” and was acquired by Napoleon because he was well-known for undertaking numerous public works but not always completing them: For instance, the Fountain of the Elephant was one such uncompleted public works. Hence, the people of Paris gave him this nickname. Modern Sesostris: Lord Byron bestowed this name upon Napoleon in his poem, Age of Bronze. Nightmare of Europe: One of the nicknames of Napoleon was this with him supposedly having gotten it because European nations were terrified of his schemes for personal aggrandizement and his amazing military success. Redingote Grise: During Napoleon’s campaigns, the great General was easily identifiable because he always wore a grey greatcoat, which is how he got this nickname. The Armed Solider of Democracy: Napoleon was frequently called this by the Bourbons, but it was supposedly a name he gave himself and referred to the fact that he was invincible and had ravaged “Austria [covering] … her land with blood.”[4] A three-quarter-length depiction of Napoleon Bonaparte, with black tunic and leather gloves, holding a standard and sword, turning backwards to look at his troops. Titled “Bonaparte at the Pont d’Arcole,” by Baron Antoine-Jean Gros c. 1801. Courtesy of Wikipedia. The Devil’s Favourite: Between 1803 and 1805, during the time of the Boulogne Camp, the British were fearful that Napoleon would invade the British Isles and so propaganda painted Napoleon as a devil, thus it also resulted in the nickname “The Devil’s Favourite.” The Eagle: Another of the nicknames of Napoleon was this name bestowed by Lord Byron upon him in Byron’s narrative poem Childe Harold’s Pilgrimage. The Heir of the Republic: Napoleon acquired this nickname after having been First Consul and then making himself Emperor of France. The Little Corporal: This was an affectionate nickname supposedly given to Napoleon by some old grenadiers after the battle of Lodi in 1796. It was said the grenadiers were so pleased with his bravery, they elected him their corporal as a compliment. The nickname also supposedly referred to Napoleon’s short stature and great courage. The Man of Destiny: Napoleon got this nickname because he believed he was destined for greatness and that his actions involved the occult and supernatural. Tiddy-Doll: James Gillray was known to be one of the best caricatures of his day. He produced many cartoons of Napoleon. However, the one below was one of his most celebrated and best known cartoons. He referred to Napoleon as a Tiddy-Doll, a reference to Napoleon’s king-making proclivities. Tiddy-Doll the great French Gingerbread-Baker, drawing out a new Batch of Kings, by James Gillray, 1806. Courtesy of British Museum. References: [1] Youngquist, Paul, Monstrosities, 2003, p. 172. [2] Frey, Albert Romer, Sobriquets and Nicknames, 1887, p. 135. [3] Ibid., p. 168. [4] The American Whig Review, Volume 6, 1847, p. 314. #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mp_form_popup1 .mailpoet_segment_label, #mp_form_popup1 .mailpoet_text_label, #mp_form_popup1 .mailpoet_textarea_label, #mp_form_popup1 .mailpoet_select_label, #mp_form_popup1 .mailpoet_radio_label, #mp_form_popup1 .mailpoet_checkbox_label, #mp_form_popup1 .mailpoet_list_label, #mp_form_popup1 .mailpoet_date_label { display: block; font-weight: normal; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea, #mp_form_popup1 .mailpoet_select, #mp_form_popup1 .mailpoet_date_month, #mp_form_popup1 .mailpoet_date_day, #mp_form_popup1 .mailpoet_date_year, #mp_form_popup1 .mailpoet_date { display: bloc