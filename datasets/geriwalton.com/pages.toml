description = "Discover Fascinating Real Stories from History History is filled with surprising and intriguing stories that will amaze you. They are at times comical, tragic, inspiring, horrific, and mysterious. I love bringing these stories to you so that you can experience them for yourself. I hope you will enjoy my books! Teetering on the Edge Discover…"
full_description = "Discover Fascinating Real Stories from History History is filled with surprising and intriguing stories that will amaze you. They are at times comical, tragic, inspiring, horrific, and mysterious. I love bringing these stories to you so that you can experience them for yourself. I hope you will enjoy my books! Teetering on the Edge Discover the courage and loyalty of two friends who found themselves on the wrong side of history. What would you do if your way of life was becoming extinct? Marie Antoinette became Queen of France at a time when the centuries-old nobility system was on the brink of collapse. Along with her steadfast friend and confidante, the Princesse de Lamballe, at her side, she clung to her lifestyle against insurmountable odds. Read More Surviving the Horror How did a young wax modeling apprentice named Marie Grasholtz survive the horrors of the French Revolution to become one of the history's most famous and enduring business women? A woman in her 20s, Marie found herself confronted with shocking atrocities. She associated with many influential people of the French Revolution and frequently found herself the recipient of their guillotined heads. She emerged from those terrible times with troubles of her own, but was able turn her experiences into one of the most enduring and well known tourist attractions in history. Read More Clashing of Wills What if you were one of the most powerful men in the world and met a woman who could not be conquered? Such was Napoleon's dilemma in December 1797 when the renowned beauty and socialite Juliette Récamier entered his life. At the very moment that he stood on a stage dressed in his green battle uniform, being acclaimed by an adoring crowd as a heroic victor, attention turned from him and focused on the stunning beauty. Upstaged, Napoleon fumed. But such was the undeniable power of Juliette. Other incidents would pit the two against the other. He had political and military power. She had her own power, a power of charm, intelligence, and compassion. How would it end? Read More #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mp_form_popup1 .mailpoet_segment_label, #mp_form_popup1 .mailpoet_text_label, #mp_form_popup1 .mailpoet_textarea_label, #mp_form_popup1 .mailpoet_select_label, #mp_form_popup1 .mailpoet_radio_label, #mp_form_popup1 .mailpoet_checkbox_label, #mp_form_popup1 .mailpoet_list_label, #mp_form_popup1 .mailpoet_date_label { display: block; font-weight: normal; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea, #mp_form_popup1 .mailpoet_select, #mp_form_popup1 .mailpoet_date_month, #mp_form_popup1 .mailpoet_date_day, #mp_form_popup1 .mailpoet_date_year, #mp_form_popup1 .mailpoet_date { display: block; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea { width: 200px; } #mp_form_popup1 .mailpoet_checkbox { } #mp_form_popup1 .mailpoet_submit { } #mp_form_popup1 .mailpoet_divider { } #mp_form_popup1 .mailpoet_message { } #mp_form_popup1 .mailpoet_form_loading { width: 30px; text-align: center; line-height: normal; } #mp_form_popup1 .mailpoet_form_loading > span { width: 5px; height: 5px; background-color: #5b5b5b; } #mp_form_popup1 h2.mailpoet-heading { margin: 0 0 20px 0; } #mp_form_popup1 h1.mailpoet-heading { margin: 0 0 10px; }#mp_form_popup1{border: 2px solid #ffffff;border-radius: 25px;background: #f5f4d7;text-align: center;}#mp_form_popup1{width: 380px;max-width: 100vw;}#mp_form_popup1 .mailpoet_message {margin: 0; padding: 0 20px;} #mp_form_popup1 .mailpoet_validate_success {color: #00d084} #mp_form_popup1 input.parsley-success {color: #00d084} #mp_form_popup1 select.parsley-succ