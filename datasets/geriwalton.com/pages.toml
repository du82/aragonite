description = "April 2, 2018 Member of the Week for NFAA I was chosen as member of the week and interviewed by the Nonfiction Authors Association. You can read my interview by clicking here.   May 15, 2017 Lil’s Vintage World Let’s read about the Georgians is the name of this video and it’s a great review…"
full_description = '''April 2, 2018 Member of the Week for NFAA I was chosen as member of the week and interviewed by the Nonfiction Authors Association. You can read my interview by clicking here. May 15, 2017 Lil's Vintage World Let's read about the Georgians is the name of this video and it's a great review of what you can expect if you read my book. View Video May 1, 2017 Interviewed by Radio BBC Leicester One of my posts was about Mary Linwood, a Leicester native, and I was interviewed by Matt Smith as part of a story about local Leicester heroes. You can learn more about this interview by clicking the Play button on the audio player in the footer of any page. March 24, 2017 My book was released on Amazon in the U.S. After much waiting, my book released here in the U.S. December 2016 History of Royals Review My book was reviewed by the magazine "History of Royals" in December 2016, issue ten. Here are two excerpts from that review. "Walton ... has struck a winning balance between vivid storytelling and well-researched history. Non-fiction is usually at its best when the author's enthusiasm for their subject emerges clearly but yet remains tempered by scholarly study, and this is the case here." "This is history writing at its very best; vivid detail, characters colourfully brought to life and events clearly described. Anyone with an interest in French history, 18th-century Europe or the main players will find this book hugely appealing." October 18, 2016 My book was released in the U.K. It was a glorious day for the release of my first book and when I saw it had been released, I couldn't quit crying. #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20p