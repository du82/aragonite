full_description = "About Northern California Living Finding Princess de Lamballe’s former house in Passy, France The Kids About Geri Geri Walton has long been fascinated by history and the people who create it. As a child growing up in a large family in Utah, she loved to sit around in a big circle with family members, sharing stories. Her father’s many stories—from not only his childhood but the lives of their ancestors—particularly fascinated her. After a long career in technical writing and publishing in the computer industry, Geri returned to history as her first love. She worked on several different books, articles, and blog ideas before realizing her passion was around the history and people of the 1700s and 1800s. So, she started her current blog in 2013. Geri lives in Northern California with her husband and two Pomeranians. When she’s not writing, she enjoys reading, cooking, and jogging. She is also a bit of a health nut. Geri graduated summa cum laude with BA in History from San Jose State University. // <![CDATA[ $(document).ready(function(){ var mybodyid = $('body').attr('id'); var mynavid = '#nav' + mybodyid; $(mynavid).attr('class','active'); }); // ]]&gt; #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mp_form_popup1 .mailpoet_segment_label, #mp_form_popup1 .mailpoet_text_label, #mp_form_popup1 .mailpoet_textarea_label, #mp_form_popup1 .mailpoet_select_label, #mp_form_popup1 .mailpoet_radio_label, #mp_form_popup1 .mailpoet_checkbox_label, #mp_form_popup1 .mailpoet_list_label, #mp_form_popup1 .mailpoet_date_label { display: block; font-weight: normal; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea, #mp_form_po