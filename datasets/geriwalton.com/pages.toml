full_description = "Cooping: Forced Voting in the 19th Century By Geri Walton | October 2, 2023 | 0 Cooping involved politicians paying gangs to kidnap men and have them vote for a specific candidate. It was a common practice in the nineteenth century. To accomplish cooping victims were drugged or forced to drink alcohol and then disguised so that they could cast multiple votes for a specific candidate. In addition, many of the… Read More Harvard Professor Webster: His Execution for Murder By Geri Walton | September 4, 2023 | 0 The execution of Harvard Professor Webster happened in 1850 on 30 August. (It occurred the same year that the famous wax sculptor Madame Tussaud died.) John W. Webster was a professor of chemistry and geology at Harvard Medical College and found guilty of murdering Dr. George Parkman. To learn more about the case click here. Read More A Panorama on Slavery and Henry “Box” Brown By Geri Walton | August 7, 2023 | 2 Henry “Box” Brown was a Virginia slave who mailed himself to freedom in 1849. Afterwards he made a living lecturing on slavery. His tours occurred in America and later England using a moving panorama* on slavery. Read More Louisa Adams’ Party for Andrew Jackson By Geri Walton | July 3, 2023 | 0 Louisa Adams’ party for Andrew Jackson happened when her husband, John Quincy Adams, was thinking of running for President in the 1820s. Hoping to avoid having the more charismatic and dashing Andrew Jackson run against him, Louisa decided to eclipse Jackson and his backwoods country wife, Rachel Stockley Donelson, by throwing a party to ostensibly… Read More A Love Gone Sour: A Nineteenth Century Tale By Geri Walton | June 5, 2023 | 0 Love is a funny thing. It doesn’t always work out and in June of 1874 the Boston Globe reported on a missing bride and a love gone sour. According to the Globe: Read More Pomeranians and Their Popularity in the 19th Century By Geri Walton | May 1, 2023 | 0 Pomeranians became popular in the 19th century because of Queen Victoria but the dogs were originally introduced in England in the late 1700s by Queen Charlotte, Queen-consort to King George III. She had two with her when she arrived and the dogs, Phoebe and Mercury, were depicted in paintings by Sir Thomas Gainsborough.* However, it… Read More"
