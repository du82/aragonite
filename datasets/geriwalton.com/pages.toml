title = "Jane Austen's Cousin: The Outlandish Countess De Feuillide - geriwalton.com"
description = "In this Eliza de Feuillide book it shows how the countess seemed fascinating and outlandish to her Austen cousins in rural eighteen century England. When"
full_description = "Jane Austen's Cousin: The Outlandish Countess De Feuillide Eliza de Feuillide The Setting The Significance The Book Eliza de Feuillide In this Eliza de Feuillide book it shows how the countess seemed fascinating and outlandish to her Austen cousins in rural eighteen century England. When she visited their village, her appearance was electrifying. She was an attractive, accomplished French countess with a vivacious personality who regaled them with fascinating stories of life in London and Paris where she hobnobbed with nobility and wore the latest fashions. Yet, Eliza’s life was not as glamorous as her Austen cousins might have thought as she faced many tragedies in her life that wealth and social class could not protect her against. The Setting Eliza de Feuillide lived during one of the most exciting and interesting times in history. Her story begins in the mid-1700s during the phase when Britain was dominant in colonial India because of the expansion of the East India Company. By the late 1700s, she was living through the horror associated with the French Revolution and facing the fact that her husband had been guillotined on 22 February 1794 during the Reign of Terror. Her life also spans the period of the Napoleonic Wars when Napoleon Bonaparte reigned supreme as Emperor of France and fought against a fluctuating array of European coalitions. The Significance Life in the late 1700 and early 1800s was not easy for women. It was a man’s world. This Eliza de Feuillide book reveals such difficulties and challenges that aspiring socialites and women in general encountered during this period and demonstrates how and why women often married to achieve upward social mobility and financial security. The Book This Eliza de Feuillide book provides new insights into the vivacious countess and socialite who inspired several fictional characters in Jane Austen’s highly acclaimed books. It explores how Eliza de Feuillide was born into high society and how she was forced to change due to personal setbacks while also dealing with the eighteenth century challenges that women faced as they tried to improve their conditions. In addition, the lifestyle of Jane Austen’s extended family is explored, as well as the ongoing debates that surround her outlandish cousin, Eliza de Feuillide. Buy Now from Amazon US Buy Now from Amazon UK Buy Now from Pen & Sword #mp_form_popup1 .mailpoet_form { } #mp_form_popup1 form { margin-bottom: 0; } #mp_form_popup1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mp_form_popup1 .mailpoet_column_with_background { padding: 10px; } #mp_form_popup1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mp_form_popup1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mp_form_popup1 .mailpoet_segment_label, #mp_form_popup1 .mailpoet_text_label, #mp_form_popup1 .mailpoet_textarea_label, #mp_form_popup1 .mailpoet_select_label, #mp_form_popup1 .mailpoet_radio_label, #mp_form_popup1 .mailpoet_checkbox_label, #mp_form_popup1 .mailpoet_list_label, #mp_form_popup1 .mailpoet_date_label { display: block; font-weight: normal; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea, #mp_form_popup1 .mailpoet_select, #mp_form_popup1 .mailpoet_date_month, #mp_form_popup1 .mailpoet_date_day, #mp_form_popup1 .mailpoet_date_year, #mp_form_popup1 .mailpoet_date { display: block; } #mp_form_popup1 .mailpoet_text, #mp_form_popup1 .mailpoet_textarea { width: 200px; } #mp_form_popup1 .mailpoet_checkbox { } #mp_form_popup1 .mailpoet_submit { } #mp_form_popup1 .mailpoet_divider { } #mp_form_popup1 .mailpoet_message { } #mp_form_popup1 .mailpoet_form_loading { width: 30px; text-align: center; line-height: normal; } #mp_form_popup1 .mailpoet_form_loading > span { width: 5px; height: 5px; background-color: #5b5b5b; } #mp_form_popup1 h2.mailpoet-heading { margin: 0 0 20px 0; } #mp_form_popup1 h1.mailpoet-heading { margin: 0 0 10px; }#mp_form_popup1{border: 2px solid #ffffff;border-radiu