full_description = "Henry Brown: A Slave Who Mailed Himself to Freedom By Geri Walton | August 15, 2022 | 0 Henry Brown was a slave who at the age of 33 mailed himself to freedom. He placed himself in a baize-lined wooden crate that had been addressed to an abolitionist in Philadelphia, Pennsylvania. Because of his clever plan he acquired the nickname of “Box” at a Boston antislavery convention in May 1849 and thereafter called… Read More Goody Two Shoes: Its History in the 1700 and 1800s By Geri Walton | April 12, 2019 | 0 The History of Goody Two Shoes (with or without a hyphen) was a children’s story written anonymously in 1765, published by John Newbery, and a variation of the story of Cinderella. Goody Two Shoes was the nickname of a poor orphan named Margery Meanwell who goes through life with one shoe until a rich gentleman… Read More New Year’s Resolutions from Punch in 1889: Humorous and Cheeky By Geri Walton | January 1, 2019 | 0 The idea of New Year’s resolutions and resolving to do better began long ago but exactly when is unknown, although the suggestion has been that it began as far back as when man first became conscious. Everyone, such as the Princesse de Lamballe, Eliza de Feuillide, or Madame Tussaud likely made private New Year’s resolutions.… Read More George Cruikshank the Caricature Artist and Humorist By Geri Walton | September 24, 2018 | 0 George Cruikshank, the caricature artist and humorist, was born in London on a Thursday on 27 September. His mother was Mary Macnaughten and his father, Isaac Cruikshank, a leading caricaturist of the late 1790s. Mary and Isaac had five children: two died in infancy and then there was artist Isaac Robert born in 1789, George… Read More A Georgian Farting Club and Its Odoriferous Humor By Geri Walton | December 4, 2015 | 0 Georgians had numerous clubs that included the Jockey Club, the Kit-Cat or Kit-Kat Club, and the Sublime Society of Beef Steaks or the Beefsteak Club. However, one of the more ridiculous clubs was a club known as the “Farting Club.” One person said of it, “of all the fantastical Clubs that ever took Pains to… Read More"
