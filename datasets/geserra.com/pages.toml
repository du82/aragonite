["https://geserra.com/vr-mixer.html"]
title = "Gerard Serra - AI + Design | Product Designer + Creative Technologist"
description = """
Role of the user: users are placed inside an environment, but what they will do there?. Can user modify it or are simple spectators? How they do it?
\t\t\t\t\t\t\t\t\t\t\t\t\t Interactivity: how does users interact with the environment?  Minor interaction done with the head? Do they use their hands? Can they speak with the interface?
\t\t\t\t\t\t\t\t\t\t\t\t\t Collaborative: can multiple users interact with the same enviroment? How they perceive and interact with each other"""
full_description = 'This music creation tool allows the user to manipulate multiple pieces of sound from a "sound palette" that s/he has on the left hand. Each piece of sound is represented with a figure and has a different sound attached depending on its shape. Once created, user can place it to a VR sequencer to perform a music composition. Users can also edit the shape of the sound figure in order to alter pitch and volume of the embedded sound. This tool serves as a base to develop a VR platform for music creation. It was designed, developed and tested during Sonar Innovation Challenge in 4 days during Sónar+D Festival at Barcelona. As the space is limited, movement is also restricted, so we want to explore interactive applications that can be performed while we are on a seat with other people around us. Here is also interesting to think about how our experience can invite other users to participate remotely. Challenged by Inflight VR on the context of Sónar+D music and technology festival, we decided to create an immersive tool for music creators and compositors. We considered Sónar, the perfect scenario for our experience and to get our first insights on our creation. Our VR music sequencer allows users to direcly grab a piece of audio from a sound palette and placed it into a sequencer. Users can init a loop and listen their composition on the go using our interface. We also allow to edit sounds with our sound altar and placed later placed in the sequencer. VR Mixer was tested and presented at Sónar+D with great acceptance to both general public and compositors. First of all we brainstormed possible experiences VR experiences to be performed on a plane. Once done it we decided to classify them depending users level of interaction with the virtual space. In this phase, we analysed the benefits and constrains of each variable defined in order to estimate viability of each idea. We decided to create a multimodal experience where both audio and vision are combined. We also decided the inputs from the user: hands and head movements. We believed that if we ensure a correct placement of elements, users would had a controlled space to engage with our proposal . Moreover, we discarted voice interaction to avoid disturbing other people while we are inside the app. Finally we contemplated the possibility to allow collaboration with multiple users, placing them in the same environment. However as you will see this part is not integrated in the final solution.'
author = "Gerard Serra - Product Designer and Creative Technologist."
year_published = 2017
clearnet = "https://geserra.com/vr-mixer.html"
