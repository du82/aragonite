["https://geserra.com/life-spark.html"]
title = "Gerard Serra - AI + Design | Product Designer + Creative Technologist"
description = "I am Gerard Serra a Product Designer & Creative Technologist from Barcelona. Here you can find my portfolio with my research on Artificial Intelligence and Design. Also some freelance on HCI, IoT, VR and other design projects."
full_description = "This research focuses on developing and validating a new scenario of interaction of mixed reality in which an interactive life spark shows us how we can create a communication between reality and virtuality. This little spark (virtual), projected in our world, is affected by the surrounding environment, but also has the ability to influence and activate objects in the real world. An interaction language with physical objects is also defined allowing more complex interactions once combined together. This project has been submitten to be published. So many information is now closed for general public. The line between reality and virtuality is becoming narrower. Yet there are a multitude of options that exist to bring together the integration between software elements and the physical layers that contain them. In this context user interfaces play an important role, since they are the tool to communicate with these hybrid systems. How can we interact with both physical and digital elements using a single interface? Will this interface be perceived as a digital one or a physical one? I collaborated on this project to define the evaluation methods to validate and compare this interface with a traditional one. I also contributed in extracting results and also the writing of the research paper."
author = "Gerard Serra - Product Designer and Creative Technologist."
year_published = 2016
