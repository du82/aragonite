["https://geserra.com/digital-sense.html"]
title = "Gerard Serra - AI + Design | Product Designer + Creative Technologist"
description = "I am Gerard Serra a Product Designer & Creative Technologist from Barcelona. Here you can find my portfolio with my research on Artificial Intelligence and Design. Also some freelance on HCI, IoT, VR and other design projects."
full_description = '''It's based on exchanging digital information between people and objects to allow objects a better adaption to their environment and usage context. This approach allows to reduce mental fatigue by constant decision making and information overload. This project has been submitted to publish so some information is now closed for general public. Request more info We want to explore a simple way to control our growing ecosystem of connected objects, often plenty of functionalities placed on multiple menus and options. Moreover we want to avoid frustration for not getting an expected response while interacting. During everyday life, people interact with multiple tools, from basic objects such as an spoon to a more complex device such an Smart TV. In the following years there's a forecast of even more connected devices. Many of them have lots of functionalities in order to provide the user a higher number of options to fit their needs. While this increase of capabilities can be beneficial to create a more rich and personalized experience, the complexity of interfaces to control them has also been increased. This leads to a higher cognitive effort for the user due to information overload and decision making. " Objects can better adapt their responses to people if they can have memories of the shared experiences together. Similar to human relationships, on each interaction a learning can happen to shape future responses " Our research also focuses on the idea that despite the fact that objects tend to increase on features and capabilities we mainly use a reduced set of these. This reduction will be directly related to the concept presented before. As stated on research goals an exploration on how seamlessly interact with connected objects must be done. Since we expect our interface with everyday objects the best quote to explain our approach is the following: We refer to this quote in two aspects to reduce cognitive overload: choosing cost and task structure. Choosing cost is related to the inherent cost of choosing between a large number of options. Task structure refers to the number of steps required to complete a task and the possibilities available in each moment. Both concepts must be minimized in order to reduce user cognitive load.'''
author = "Gerard Serra - Product Designer and Creative Technologist."
year_published = 2015
clearnet = "https://geserra.com/digital-sense.html"
