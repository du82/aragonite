["https://geserra.com/triem.html"]
title = "Gerard Serra - AI + Design | Product Designer + Creative Technologist"
description = "I am Gerard Serra a Product Designer & Creative Technologist from Barcelona. Here you can find my portfolio with my research on Artificial Intelligence and Design. Also some freelance on HCI, IoT, VR and other design projects."
full_description = "Online interactive app to extract insights from communities regarding their data sharing thoughts and feelings. Data extracted will help create to data licenses that can benefit us all. You can find more information about the whole project on Salus.coop In our daily interaction with online products and services we generate lots of data containing personal information. Commonly we accept sharing without hesitating to share this data in exchange of using this online experiences but we usually don't really know the future usage of our data. This is starting to change. With new law legislation such as GDPR or controversial usage and leakages of data present on certain companies, data privacy and protection has become a public topic that has attracted interest specially in the last years. For that reason, a new way to help citizens to understand and control their data when shared with third parties must be defined. In this part of the project, we want to collect insights from people in order to understand which are the specific concerns when data sharing and how these concerns can be overcame. In order to collect data we decided to create an online questionnaire where multiple scenarios are shown to the user who has to decide to donate or not. Our main goals with our design are to simplify user experience to avoid users mental fatigue and to highlight the variables that compose an scenario to help users correctly understand each context of data sharing. Previous work on this project helped us to define a limited number of variables to define each scenario: These variables contain three possibilities each giving a total of 81 possible scenarios. For that reason, a critical mass of answers must be collected to ensure a correct extraction of insights. Each unique user will be given at least 10 random scenarios to evaluate. Later on, more scenarios can be evaluated when finished the test. Moreover, we also defined two more global variables, risks and incentives. to understand their possible influence on previous scenario decision."
author = "Gerard Serra - Product Designer and Creative Technologist."
year_published = 2018
