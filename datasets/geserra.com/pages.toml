["https://geserra.com/flexmile.html"]
title = "Gerard Serra - AI + Design | Product Designer + Creative Technologist"
description = "I am Gerard Serra a Product Designer & Creative Technologist from Barcelona. Here you can find my portfolio with my research on Artificial Intelligence and Design. Also some freelance on HCI, IoT, VR and other design projects."
full_description = "On-the-go electric scooter service placed on strategic spots that allow users to arrive to the exact location they need. Since it's an easy to take device, it's expected to be rented and returned at the end of the necessity. It's specially designed as a complement of other mobility services such as train, bus or metro. To define this service, we researched user needs and motivations on Barcelona area and analysed current mobility solutions in Barcelona area. Our conclusions, detected a gap consisting on a need to travel from the point that our last transport can leave us, to the exact location we want to go. When travelling it's a common situation to not find parking or that the public transport doesn't end in the door of our final destination Flexmile goal was created to solve this final frustrating step, ensuring an efficient door to door journey. I was part of a multidisciplinary team of three members of the challenge. We analysed current problems and generated ideas together on mobility solutions together with the team. I was responsible on defining the experience, conducting user and competition research and evaluating final proposal."
author = "Gerard Serra - Product Designer and Creative Technologist."
year_published = 2017
