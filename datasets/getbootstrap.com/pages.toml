title = "Bootstrap · The most popular HTML, CSS, and JS library in the world."
description = "Powerful, extensible, and feature-packed frontend toolkit. Build and customize with Sass, utilize prebuilt grid system and components, and bring projects to life with powerful JavaScript plugins."
full_description = '''Get Security Updates for Bootstrap 3 & 4 Build fast, responsive sites with Bootstrap Powerful, extensible, and feature-packed frontend toolkit. Build and customize with Sass, utilize prebuilt grid system and components, and bring projects to life with powerful JavaScript plugins. npm i bootstrap@5.3.3 Read the docs Currently v5.3.3 · Download · All releases Get started any way you want Jump right into building with Bootstrap—use the CDN, install it via package manager, or download the source code. Read installation docs Install via package manager Install Bootstrap’s source Sass and JavaScript files via npm, RubyGems, Composer, or Meteor. Package managed installs don’t include documentation or our full build scripts. You can also use any demo from our Examples repo to quickly jumpstart Bootstrap projects. npm install bootstrap@5.3.3 gem install bootstrap -v 5.3.3 Read our installation docs for more info and additional package managers. Include via CDN When you only need to include Bootstrap’s compiled CSS or JS, you can use jsDelivr. See it in action with our simple quick start, or browse the examples to jumpstart your next project. You can also choose to include Popper and our JS separately. <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> Read our getting started guides Get a jump on including Bootstrap's source files in a new project with our official guides. Webpack Parcel Vite Customize everything with Sass Bootstrap utilizes Sass for a modular and customizable architecture. Import only the components you need, enable global options like gradients and shadows, and write your own CSS with our variables, maps, functions, and mixins. Learn more about customizing Include all of Bootstrap’s Sass Import one stylesheet and you're off to the races with every feature of our CSS. // Variable overrides first $primary: #900; $enable-shadows: true; $prefix: "mo-"; // Then import Bootstrap @import "../node_modules/bootstrap/scss/bootstrap"; Learn more about our global Sass options. Include what you need The easiest way to customize Bootstrap—include only the CSS you need. // Functions first @import "../node_modules/bootstrap/scss/functions"; // Variable overrides second $primary: #900; $enable-shadows: true; $prefix: "mo-"; // Required Bootstrap imports @import "../node_modules/bootstrap/scss/variables"; @import "../node_modules/bootstrap/scss/variables-dark"; @import "../node_modules/bootstrap/scss/maps"; @import "../node_modules/bootstrap/scss/mixins"; @import "../node_modules/bootstrap/scss/root"; // Optional components @import "../node_modules/bootstrap/scss/utilities"; @import "../node_modules/bootstrap/scss/reboot"; @import "../node_modules/bootstrap/scss/containers"; @import "../node_modules/bootstrap/scss/grid"; @import "../node_modules/bootstrap/scss/helpers"; @import "../node_modules/bootstrap/scss/utilities/api"; Learn more about using Bootstrap with Sass. Build and extend in real-time with CSS variables Bootstrap 5 is evolving with each release to better utilize CSS variables for global theme styles, individual components, and even utilities. We provide dozens of variables for colors, font styles, and more at a :root level for use anywhere. On components and utilities, CSS variables are scoped to the relevant class and can easily be modified. Learn more about CSS variables Using CSS variables Use any of our global :root variables to write new styles. CSS variables use the var(--bs-variableName) syntax and can be inherited by children elements. .component { color: var(--bs-gray-800); background-color: var(--bs-gray-100); border: 1px solid var(--bs-gray-200); border-radius: .25rem; } .component-header { color: var(--bs-purple); } Customizing via CSS variables Override global, component, or utility class variables to customize Bootstrap just how you like. No need to redeclare each rule, just a new variable value. body { --bs-body-font-family: var(--bs-font-monospace); --bs-body-line-height: 1.4; --bs-body-bg: var(--bs-gray-100); } .table { --bs-table-color: var(--bs-gray-600); --bs-table-bg: var(--bs-gray-100); --bs-table-border-color: transparent; } Components, meet the Utility API New in Bootstrap 5, our utilities are now generated by our Utility API. We built it as a feature-packed Sass map that can be quickly and easily customized. It's never been easier to add, remove, or modify any utility classes. Make utilities responsive, add pseudo-class variants, and give them custom names. Quickly customize components Apply any of our included utility classes to our components to customize their appearance, like the navigation example below. There are hundreds of classes available—from positioning and sizing to colors and effects. Mix them with CSS variable overrides for even more control. Home Profile Contact Home Profile Contact <ul class="nav nav-pills nav-fill gap-2 p-1 small bg-primary rounded-5 shadow-sm" id="pillNav2" role="tablist" style="--bs-nav-link-color: var(--bs-white); --bs-nav-pills-link-active-color: var(--bs-primary); --bs-nav-pills-link-active-bg: var(--bs-white);"> <li class="nav-item" role="presentation"> <button class="nav-link active rounded-5" id="home-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="true">Home</button> </li> <li class="nav-item" role="presentation"> <button class="nav-link rounded-5" id="profile-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="false">Profile</button> </li> <li class="nav-item" role="presentation"> <button class="nav-link rounded-5" id="contact-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="false">Contact</button> </li> </ul> Explore customized components Create and extend utilities Use Bootstrap's utility API to modify any of our included utilities or create your own custom utilities for any project. Import Bootstrap first, then use Sass map functions to modify, add, or remove utilities. @import "bootstrap/scss/bootstrap"; $utilities: map-merge( $utilities, ( "cursor": ( property: cursor, class: cursor, responsive: true, values: auto pointer grab, ) ) ); Explore the utility API Powerful JavaScript plugins without jQuery Add toggleable hidden elements, modals and offcanvas menus, popovers and tooltips, and so much more—all without jQuery. Bootstrap's JavaScript is HTML-first, meaning most plugins are added with data attributes in your HTML. Need more control? Include individual plugins programmatically. Learn more about Bootstrap JavaScript Data attribute API Why write more JavaScript when you can write HTML? Nearly all of Bootstrap's JavaScript plugins feature a first-class data API, allowing you to use JavaScript just by adding data attributes. Dropdown Dropdown item Dropdown item Dropdown item <div class="dropdown"> <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"> Dropdown </button> <ul class="dropdown-menu"> <li><button class="dropdown-item" type="button">Dropdown item</button></li> <li><button class="dropdown-item" type="button">Dropdown item</button></li> <li><button class="dropdown-item" type="button">Dropdown item</button></li> </ul> </div> Learn more about our JavaScript as modules and using the programmatic API. Comprehensive set of plugins Bootstrap features a dozen plugins that you can drop into any project. Drop them in all at once, or choose just the ones you need. Alert Show and hide alert messages to your users. Button Programmatically control the active state for buttons. Carousel Add slideshows to any page, including support for crossfade. Collapse Expand and collapse areas of content, or create accordions. Dropdown Create menus of links, actions, forms, and more. Modal Add flexible and responsive dialogs to your project. Offcanvas Build and toggle hidden sidebars into any page. Popover Create custom overlays. Built on Popper. Scrollspy Automatically update active nav links based on page scroll. Tab Allow Bootstrap nav components to toggle contents. Toast Show and hide notifications to your visitors. Tooltip Replace browser tooltips with custom ones. Built on Popper. Personalize it with Bootstrap Icons Bootstrap Icons is an open source SVG icon library featuring over 1,800 glyphs, with more added every release. They're designed to work in any project, whether you use Bootstrap itself or not. Use them as SVGs or icon fonts—both options give you vector scaling and easy customization via CSS. Get Bootstrap Icons Make it yours with official Bootstrap Themes Take Bootstrap to the next level with premium themes from the official Bootstrap Themes marketplace. Themes are built on Bootstrap as their own extended frameworks, rich with new components and plugins, documentation, and powerful build tools. Browse Bootstrap Themes'''
