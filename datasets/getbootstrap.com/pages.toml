title = "Shadows · Bootstrap v5.3"
description = "Add or remove shadows to elements with box-shadow utilities."
full_description = 'View on GitHub Shadows Add or remove shadows to elements with box-shadow utilities. On this page On this page Examples CSS Sass variables Sass utilities API Examples While shadows on components are disabled by default in Bootstrap and can be enabled via $enable-shadows, you can also quickly add or remove a shadow with our box-shadow utility classes. Includes support for .shadow-none and three default sizes (which have associated variables to match). No shadow Small shadow Regular shadow Larger shadow html <div class="shadow-none p-3 mb-5 bg-body-tertiary rounded">No shadow</div> <div class="shadow-sm p-3 mb-5 bg-body-tertiary rounded">Small shadow</div> <div class="shadow p-3 mb-5 bg-body-tertiary rounded">Regular shadow</div> <div class="shadow-lg p-3 mb-5 bg-body-tertiary rounded">Larger shadow</div> CSS Sass variables scss/_variables.scss $box-shadow: 0 .5rem 1rem rgba($black, .15); $box-shadow-sm: 0 .125rem .25rem rgba($black, .075); $box-shadow-lg: 0 1rem 3rem rgba($black, .175); $box-shadow-inset: inset 0 1px 2px rgba($black, .075); Sass utilities API Shadow utilities are declared in our utilities API in scss/_utilities.scss. Learn how to use the utilities API. scss/_utilities.scss "shadow": ( property: box-shadow, class: shadow, values: ( null: var(--#{$prefix}box-shadow), sm: var(--#{$prefix}box-shadow-sm), lg: var(--#{$prefix}box-shadow-lg), none: none, ) ),'
