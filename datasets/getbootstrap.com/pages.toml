title = "Navs and tabs · Bootstrap v5.3"
description = "Documentation and examples for how to use Bootstrap’s included navigation components."
full_description = '''View on GitHub Navs and tabs Documentation and examples for how to use Bootstrap’s included navigation components. On this page On this page Base nav Available styles Horizontal alignment Vertical Tabs Pills Underline Fill and justify Working with flex utilities Regarding accessibility Using dropdowns Tabs with dropdowns Pills with dropdowns CSS Variables Sass variables JavaScript behavior Accessibility Using data attributes Via JavaScript Fade effect Methods Events Base nav Navigation available in Bootstrap share general markup and styles, from the base .nav class to the active and disabled states. Swap modifier classes to switch between each style. The base .nav component is built with flexbox and provide a strong foundation for building all types of navigation components. It includes some style overrides (for working with lists), some link padding for larger hit areas, and basic disabled styling. The base .nav component does not include any .active state. The following examples include the class, mainly to demonstrate that this particular class does not trigger any special styling. To convey the active state to assistive technologies, use the aria-current attribute — using the page value for current page, or true for the current item in a set. Active Link Link Disabled html <ul class="nav"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Classes are used throughout, so your markup can be super flexible. Use <ul>s like above, <ol> if the order of your items is important, or roll your own with a <nav> element. Because the .nav uses display: flex, the nav links behave the same as nav items would, but without the extra markup. Active Link Link Disabled html <nav class="nav"> <a class="nav-link active" aria-current="page" href="#">Active</a> <a class="nav-link" href="#">Link</a> <a class="nav-link" href="#">Link</a> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </nav> Available styles Change the style of .navs component with modifiers and utilities. Mix and match as needed, or build your own. Horizontal alignment Change the horizontal alignment of your nav with flexbox utilities. By default, navs are left-aligned, but you can easily change them to center or right-aligned. Centered with .justify-content-center: Active Link Link Disabled html <ul class="nav justify-content-center"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Right-aligned with .justify-content-end: Active Link Link Disabled html <ul class="nav justify-content-end"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Vertical Stack your navigation by changing the flex item direction with the .flex-column utility. Need to stack them on some viewports but not others? Use the responsive versions (e.g., .flex-sm-column). Active Link Link Disabled html <ul class="nav flex-column"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> As always, vertical navigation is possible without <ul>s, too. Active Link Link Disabled html <nav class="nav flex-column"> <a class="nav-link active" aria-current="page" href="#">Active</a> <a class="nav-link" href="#">Link</a> <a class="nav-link" href="#">Link</a> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </nav> Tabs Takes the basic nav from above and adds the .nav-tabs class to generate a tabbed interface. Use them to create tabbable regions with our tab JavaScript plugin. Active Link Link Disabled html <ul class="nav nav-tabs"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Pills Take that same HTML, but use .nav-pills instead: Active Link Link Disabled html <ul class="nav nav-pills"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Underline Take that same HTML, but use .nav-underline instead: Active Link Link Disabled html <ul class="nav nav-underline"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Fill and justify Force your .nav’s contents to extend the full available width with one of two modifier classes. To proportionately fill all available space with your .nav-items, use .nav-fill. Notice that all horizontal space is occupied, but not every nav item has the same width. Active Much longer nav link Link Disabled html <ul class="nav nav-pills nav-fill"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Much longer nav link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> When using a <nav>-based navigation, you can safely omit .nav-item as only .nav-link is required for styling <a> elements. Active Much longer nav link Link Disabled html <nav class="nav nav-pills nav-fill"> <a class="nav-link active" aria-current="page" href="#">Active</a> <a class="nav-link" href="#">Much longer nav link</a> <a class="nav-link" href="#">Link</a> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </nav> For equal-width elements, use .nav-justified. All horizontal space will be occupied by nav links, but unlike the .nav-fill above, every nav item will be the same width. Active Much longer nav link Link Disabled html <ul class="nav nav-pills nav-justified"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Much longer nav link</a> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Similar to the .nav-fill example using a <nav>-based navigation. Active Much longer nav link Link Disabled html <nav class="nav nav-pills nav-justified"> <a class="nav-link active" aria-current="page" href="#">Active</a> <a class="nav-link" href="#">Much longer nav link</a> <a class="nav-link" href="#">Link</a> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </nav> Working with flex utilities If you need responsive nav variations, consider using a series of flexbox utilities. While more verbose, these utilities offer greater customization across responsive breakpoints. In the example below, our nav will be stacked on the lowest breakpoint, then adapt to a horizontal layout that fills the available width starting from the small breakpoint. Active Longer nav link Link Disabled html <nav class="nav nav-pills flex-column flex-sm-row"> <a class="flex-sm-fill text-sm-center nav-link active" aria-current="page" href="#">Active</a> <a class="flex-sm-fill text-sm-center nav-link" href="#">Longer nav link</a> <a class="flex-sm-fill text-sm-center nav-link" href="#">Link</a> <a class="flex-sm-fill text-sm-center nav-link disabled" aria-disabled="true">Disabled</a> </nav> Regarding accessibility If you’re using navs to provide a navigation bar, be sure to add a role="navigation" to the most logical parent container of the <ul>, or wrap a <nav> element around the whole navigation. Do not add the role to the <ul> itself, as this would prevent it from being announced as an actual list by assistive technologies. Note that navigation bars, even if visually styled as tabs with the .nav-tabs class, should not be given role="tablist", role="tab" or role="tabpanel" attributes. These are only appropriate for dynamic tabbed interfaces, as described in the ARIA Authoring Practices Guide tabs pattern. See JavaScript behavior for dynamic tabbed interfaces in this section for an example. The aria-current attribute is not necessary on dynamic tabbed interfaces since our JavaScript handles the selected state by adding aria-selected="true" on the active tab. Using dropdowns Add dropdown menus with a little extra HTML and the dropdowns JavaScript plugin. Tabs with dropdowns Active Dropdown Action Another action Something else here Separated link Link Disabled html <ul class="nav nav-tabs"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item dropdown"> <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">Dropdown</a> <ul class="dropdown-menu"> <li><a class="dropdown-item" href="#">Action</a></li> <li><a class="dropdown-item" href="#">Another action</a></li> <li><a class="dropdown-item" href="#">Something else here</a></li> <li><hr class="dropdown-divider"></li> <li><a class="dropdown-item" href="#">Separated link</a></li> </ul> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> Pills with dropdowns Active Dropdown Action Another action Something else here Separated link Link Disabled html <ul class="nav nav-pills"> <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Active</a> </li> <li class="nav-item dropdown"> <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">Dropdown</a> <ul class="dropdown-menu"> <li><a class="dropdown-item" href="#">Action</a></li> <li><a class="dropdown-item" href="#">Another action</a></li> <li><a class="dropdown-item" href="#">Something else here</a></li> <li><hr class="dropdown-divider"></li> <li><a class="dropdown-item" href="#">Separated link</a></li> </ul> </li> <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li> <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li> </ul> CSS Variables Added in v5.2.0 As part of Bootstrap’s evolving CSS variables approach, navs now use local CSS variables on .nav, .nav-tabs, and .nav-pills for enhanced real-time customization. Values for the CSS variables are set via Sass, so Sass customization is still supported, too. On the .nav base class: scss/_nav.scss --#{$prefix}nav-link-padding-x: #{$nav-link-padding-x}; --#{$prefix}nav-link-padding-y: #{$nav-link-padding-y}; @include rfs($nav-link-font-size, --#{$prefix}nav-link-font-size); --#{$prefix}nav-link-font-weight: #{$nav-link-font-weight}; --#{$prefix}nav-link-color: #{$nav-link-color}; --#{$prefix}nav-link-hover-color: #{$nav-link-hover-color}; --#{$prefix}nav-link-disabled-color: #{$nav-link-disabled-color}; On the .nav-tabs modifier class: scss/_nav.scss --#{$prefix}nav-tabs-border-width: #{$nav-tabs-border-width}; --#{$prefix}nav-tabs-border-color: #{$nav-tabs-border-color}; --#{$prefix}nav-tabs-border-radius: #{$nav-tabs-border-radius}; --#{$prefix}nav-tabs-link-hover-border-color: #{$nav-tabs-link-hover-border-color}; --#{$prefix}nav-tabs-link-active-color: #{$nav-tabs-link-active-color}; --#{$prefix}nav-tabs-link-active-bg: #{$nav-tabs-link-active-bg}; --#{$prefix}nav-tabs-link-active-border-color: #{$nav-tabs-link-active-border-color}; On the .nav-pills modifier class: scss/_nav.scss --#{$prefix}nav-pills-border-radius: #{$nav-pills-border-radius}; --#{$prefix}nav-pills-link-active-color: #{$nav-pills-link-active-color}; --#{$prefix}nav-pills-link-active-bg: #{$nav-pills-link-active-bg}; Added in v5.3.0 On the .nav-underline modifier class: scss/_nav.scss --#{$prefix}nav-underline-gap: #{$nav-underline-gap}; --#{$prefix}nav-underline-border-width: #{$nav-underline-border-width}; --#{$prefix}nav-underline-link-active-color: #{$nav-underline-link-active-color}; Sass variables scss/_variables.scss $nav-link-padding-y: .5rem; $nav-link-padding-x: 1rem; $nav-link-font-size: null; $nav-link-font-weight: null; $nav-link-color: var(--#{$prefix}link-color); $nav-link-hover-color: var(--#{$prefix}link-hover-color); $nav-link-transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out; $nav-link-disabled-color: var(--#{$prefix}secondary-color); $nav-link-focus-box-shadow: $focus-ring-box-shadow; $nav-tabs-border-color: var(--#{$prefix}border-color); $nav-tabs-border-width: var(--#{$prefix}border-width); $nav-tabs-border-radius: var(--#{$prefix}border-radius); $nav-tabs-link-hover-border-color: var(--#{$prefix}secondary-bg) var(--#{$prefix}secondary-bg) $nav-tabs-border-color; $nav-tabs-link-active-color: var(--#{$prefix}emphasis-color); $nav-tabs-link-active-bg: var(--#{$prefix}body-bg); $nav-tabs-link-active-border-color: var(--#{$prefix}border-color) var(--#{$prefix}border-color) $nav-tabs-link-active-bg; $nav-pills-border-radius: var(--#{$prefix}border-radius); $nav-pills-link-active-color: $component-active-color; $nav-pills-link-active-bg: $component-active-bg; $nav-underline-gap: 1rem; $nav-underline-border-width: .125rem; $nav-underline-link-active-color: var(--#{$prefix}emphasis-color); JavaScript behavior Use the tab JavaScript plugin—include it individually or through the compiled bootstrap.js file—to extend our navigational tabs and pills to create tabbable panes of local content. Home Profile Contact Disabled This is some placeholder content the Home tab's associated content. Clicking another tab will toggle the visibility of this one for the next. The tab JavaScript swaps classes to control the content visibility and styling. You can use it with tabs, pills, and any other .nav-power'''
