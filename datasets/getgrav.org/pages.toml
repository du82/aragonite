["https://getgrav.org/blog/cms-critic-award-finalists-2018"]
title = "Vote for Grav in the 2018 CMS Critic People's Choice Awards | Grav CMS"
description = "Ryan Matthew Pierson posted on 10/09/2018 in journal + cms-critic + awards 2 mins Grav Receives 2017 CMS Critic Award for Best Flat File CMS! Grav has received…"
full_description = '''Vote for Grav in the 2018 CMS Critic People's Choice Awards Help Grav take home some silverware! Ryan Matthew Pierson posted on 10/09/2018 in journal + cms-critic + awards 2 mins It's that time of year again! The CMS Critic Awards are here and voting has started. For the third year in a row, Grav has been nominated and stands a good chance of seizing its third major win. We need your help to get across the finish line! Grav walked away with the 2016 People's Choice Award for Best Open Source CMS after being nominated in three categories, including: Best Blogging Software and Best CMS for Education. In 2017, Grav took home the award for Best Flat File CMS. This was an exceptional accomplishment given the incredible competition in what was the category's inaugural year. It's now 2018 and Grav is defending its place in the Best Flat File CMS category. It is joined in nominations by an incredible trio of flat file options including October CMS, Statamic, and Blundit. This nomination is a testament to the passion shared by our community, and shows that Grav is able to power a variety of types of sites. We are eternally grateful to have such an amazing community of developers, entrepreneurs, and enthusiasts contributing to the platform and helping it grow. To date, Grav has over 100 supporting themes and 268 plugins available for download, absolutely free. No fees, no limited trials, and no signups required. How can you help now? Now we've been successfully nominated, you can help ensure Grav wins by voting in the form: Vote For Grav! What does your vote mean to us? Like any new CMS, Grav depends greatly on its community to help spread the word about it, so more people can experience it and find out why Grav is a great choice for their next project. The CMS Critic Awards is an incredible opportunity for us to not only help spread the word, but to empower our growing user community to let its voice be heard. Simply put; it helps us introduce Grav to more people, including third-party plugin developers, theme designers, and other folks that can help bring more value to the platform and its users. Please take a moment to let your voice be heard by heading over to CMSCritic.com and voting. It only takes a few seconds to make a big difference. As always, thank you very much for being a part of the Grav community. var disqus_config = function () { this.page.url = 'https://getgrav.org/blog/cms-critic-award-finalists-2018'; this.page.identifier = 'e06ad31d542f59275fac920e9f013414'; }; (function() { var d = document, s = d.createElement('script'); s.src = '//getgrav.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
