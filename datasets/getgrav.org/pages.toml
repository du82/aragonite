full_description = "Stable Version 1.7.48 NEW! updated 4 months ago • Changelog Beta Version 1.8.0-beta.4 updated 1 month ago The Grav admin plugin provides a simple and intuitive interface to make configuration and content creation easy and enjoyable. Packed to the gills with amazing features and tools, coupled with heaps of detailed documentation, Grav will make you look like a hero developer! The built-in Package Manager lets you to find, install, and easily update extensions and themes for Grav The flat-file nature of Grav lets you define custom fields for any of your pages, including modular content Being file based means backing up and restoring your data is super easy, and changing hosts/servers is a breeze! Dynamic image manipulation to resize, crop, resample, and effects all with automatic caching of images No need to start from scratch, use Theme Inheritance and then modify the bits you need, allowing for easier update Trilby Media is a development company you can turn to for help with your Grav site. Trilby offers a variety of professional services and is run by the same team that built Grav in the first place! Grav is an open source project hosted on GitHub, originated by Trilby Media but made possible by an outstanding community of dedicated developers and users. The Grav community contributes and shares their knowledge and experiences on our GitHub repository, GetGrav Forums, and our Discord chat server. Grav is proudly part of the Open Collective family. You can now support the community and keep development going strong by becoming a backer or a sponsor. From simple to sophisticated, Grav has the flexibility to power all sorts of websites. Flexible content structure and powerful Twig templating allow easy realization of any design. Still need convincing? Check out what people are saying about Grav. If you have any thoughts or questions, please reach out and ask us."
