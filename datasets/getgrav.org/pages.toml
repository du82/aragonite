full_description = "Grav Skeletons 53 Themes 121 Plugins 425 Download Grav Grav Core is the base package with core functionality and a few essential starting pages, and Grav Core + Admin also includes the Administration Panel plugin. Both are easy to get started with, just check out our Basic Tutorial and Guide to the Administration Panel. Grav Core Grav Core + Admin plugin Current Version: 1.7.48 updated 4 months ago Demo GitHub Repo Changelog Download Grav Beta Version Want to see what's going to be stable soon? Check out the Beta Packages below: Grav Beta Core Grav Beta Core + Admin plugin Current Version: 1.8.0-beta.4 updated 1 month ago This Beta release is intended for testing and development. If you are developing a new Grav site, you probably want to start with this version as it will soon be stable... Quick installation Download either the Grav core or Grav core + Admin plugin installation package Extract the zip file into your webroot Point your browser at your local webserver: http://yoursite.com How to Install the Admin plugin If you have not already installed the admin plugin, you can do so easily with GPM: $ bin/gpm install admin This will automatically install the admin plugin plus its dependency plugins (login, email, form) After this simply point your browser to your Grav installation and you will be prompted to create a new admin user. How to Update Please update Grav first!, and then the other plugins... If you are using the admin plugin, you can simply Update Grav itself from the notice. You can click the Update button to update plugins and themes. If you don't see any updates, you can clear the GPM cache by click the Check for Updates button in the top-right. Updating is now a simple affair. Simply navigate to the root of the Grav install in your terminal and type: $ bin/gpm selfupgrade -f This will upgrade the Grav core to the latest version. Additionally, you should update all your plugins and themes to the latest version (including the admin plugin if you have that installed). You can do this using the command below: $ bin/gpm update -f Read the Documentation"
