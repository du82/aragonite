full_description = "2024 CMS Critic Award Nominations Help Nominate Grav for the 2024 CMS Critic Awards Andy Miller posted on 01/06/2025 in journal + cms-critic + awards 1 min The CMS Critic Awards Are Back — Time to Show Grav Some Love! Get ready to crank up the excitement because the CMS Critic Awards are here, and it's your chance to shine a spotlight on our favorite flat-file CMS: Grav! In the past, Grav has snagged awards for Best Flat File CMS and Best Open Source CMS, and even landed nominations for Best Blogging Software and Best CMS for Education. Now we’re aiming to keep that winning streak going in 2025 and beyond—but we can’t do it without you. Why Your Nomination Matters By nominating Grav, you’re helping us secure a spot on this year’s voting card. Every nomination boosts our visibility, draws in more users, and sparks the interest of developers, theme designers, and plugin creators who can help supercharge Grav for everyone. Simply put: more nominations mean more people learn about Grav, and that means we get to innovate even faster! How You Can Help Ready to lend a hand? It’s simple: Go to CMSCritic.com and nominate Grav CMS in any category you believe fits best. Some categories we’d love your support in include: Best Flat File CMS Best Open Source CMS Make sure to list the name as Grav CMS —exactly— and don’t forget you can submit multiple forms to nominate Grav in multiple categories. Quick & Easy The whole process takes just a minute, but your impact could last for years. More nominations → more eyes on Grav → even more awesome additions to our ecosystem. Thanks a million for being such an amazing part of the Grav community. Your passion and dedication inspire us every day. Together, we can keep pushing Grav to new heights—and shape the future of CMS in the process! Nominate Grav Today: CMSCritic.com"
