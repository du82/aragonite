title = "Instagram Feed Plugin is deprecated | Grav CMS"
description = "Today, the biggest update so far to the Git Sync Plugin has been released, and what a release it is! Two of the most requested features have been added - the ability to sync additional user folders and the ability to fine-tune the automatic synchronization of page changes - plus much more!"
full_description = '''Instagram Feed Plugin is deprecated Due to Meta deprecating Basic Display API for Instagram Andy Miller posted on 11/20/2024 in plugin 1 min The Premium plugin "Instagram Feed" is being deprecated due to Meta deprecating Basic Display API for Instagram. This was announced on September 4th, 2024, and takes effect December 4th, 2024. We have tried to find a solution that will allow the plugin to continue to function, but it seems the functionality available in the Basic Display API, is not available in the regular Instagram API. Even if it was, the regular API has further restrictions requiring a Business or Creator account in order to use it. It really seems like Meta is clamping down on external viewing of Instagram imagery, unless you use their very limited embed options. Because of this API deprecation, we have been forced to remove the Instagram API from our list of premium plugins. Users of Instagram Feed should disable this plugin before the December 4th, 2024 cutoff to ensure your site does not error out. If you have purchased the Instagram Feed plugin in the last 3 months and would like a refund, please contact us at premium@getgrav.org. var disqus_config = function () { this.page.url = 'https://getgrav.org/blog/instagram-feed-deprecated'; this.page.identifier = 'ae586b16cb64939a496983fa7024ddaa'; }; (function() { var d = document, s = d.createElement('script'); s.src = '//getgrav.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
