full_description = '''Grav Nominated for Three 2016 CMS Critic Awards! Help Grav take home some silverware! Andy Miller posted on 09/19/2016 in journal + cms-critic + awards 1 min Thanks to the hard work of the Grav community, Grav CMS has made the final cut for an amazing three CMS Awards in the following categories: Best Blogging Software Best Open Source CMS Best CMS for Education These nominations are a testament to the passion shared by our community, and shows that Grav is able to power a variety of types of sites. Last year, we made the finalists category for Best Free CMS, but were unable to come away with the win due the very still competition we faced in that category. How can you help now? Now we've been successfully nominated in these three prestigious categories, you can help ensure Grav wins in this categories by voting in the form below the list of finalists. Vote For Grav! var disqus_config = function () { this.page.url = 'https://getgrav.org/blog/cms-critic-award-finalists-2016'; this.page.identifier = 'bb47dfbf931fa7a5320a0d2b8ae8eac2'; }; (function() { var d = document, s = d.createElement('script'); s.src = '//getgrav.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
