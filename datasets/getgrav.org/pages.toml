nment In Part 1 of this 3-part series, we covered configuring Apache on macOS Big Sur 11.0 to work better with your local user account, as well as the installation process for installing multiple versions of PHP. In Part 2, we covered installing MySQL, Virtual Hosts, APC caching, YAML, and Xdebug. In this Part 3, we will cover getting your site setup with LetsEncrypt SSL support for this setup. Andy Miller 9 mins macos 18 Sep sequoia apache homebrew mysql macOS 15.0 Sequoia Apache Setup: MySQL, Xdebug & More... Part 2: macOS 15.0 Sequoia Web Development Environment In Part 1 of this 3-part series, we covered configuring Apache on macOS to work better with your local user account, as well as the installation process for installing multiple versions of PHP. In this Part 2, we will cover installing MySQL, Virtual Hosts, APC caching, YAML, and Xdebug. After finishing this tutorial, be sure to check out how to enable SSL in Part 3 of the series. Andy Miller 11 mins macos 18 Sep sequoia apache homebrew php macOS 15.0 Sequoia Apache Setup: Multiple PHP Versions Part 1: macOS 15.0 Sequoia Web Development Environment Developing web applications on macOS is a real joy. There are plenty of options for setting up your development environments, including the ever-popular MAMP Pro that provides a nice UI on top of Apache, PHP and MySQL. However, there are times when MAMP Pro has slow downs, or out of date versions, or is simply behaving badly due to its restrictive system of configuration templates and non-standard builds. Andy Miller 16 mins Load More...'''
