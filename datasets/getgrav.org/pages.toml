["https://getgrav.org/premium"]
title = "Grav Premium | Grav CMS"
description = "Support Grav and gain access to a growing selection of premium plugins, themes, and skeletons... Buy Premium, support Grav... Every sale of our Premium product…"
full_description = '''Support Grav and gain access to a growing selection of premium plugins, themes, and skeletons... Buy Premium, support Grav... Every sale of our Premium products ensures the Grav team can put more time into developing and supporting the open source Grav CMS. This in turn benefits everyone! Our Premium Products Grav Premium is an exclusive collection of plugins and themes the Grav team has built to enhance your site by providing additional functionality beyond the scope of Grav itself. Our products are covered by the Grav Premium License. New Image Optimize Simplify your workflow and skip manual image optimization for all your images in your Grav site. Image Optimize provides a simple interface to see the current size of all your images, and easily compress your images using a variety of Image Compression services. Compare the original to the compressed version, and even roll-back the compression if you are not pleased with the results. $50 Buy Now Typhoon Theme The most powerful theme ever built for Grav. Typhoon is built on top of the latest Tailwind 4 CSS framework, and provides a flexible navigation architecture that allows for both dropdown and side-menu setups. It has the ability to provide customizable Hero sections on any page, and lets you easily configure logo and colors directly from the admin options. $50 Buy Now Downloads Pro A powerful download manager directly integrated with your Grav site. Downloads Pro leverages Grav's built-in Pages functionality to power a sophisticated download system with great features such as obfuscated download URLs, nested levels, ACL restrictions of download page and specific download files, download count tracking, versions numbers, and much, much more! $50 Buy Now SEO Magic An essential tool for getting to grips with SEO on your site. Builds on top of Grav's features to automatically generate SEO-friendly OpenGraph tags for beautiful embedding. Fast site crawling and analysis of all pages with per-page customization of all elements, as well as SEO Report that can help you isolate problem-areas in your SEO strategy. $75 Buy Now Algolia Pro Algolia Pro takes searching your Grav site to the next level by seamlessly integrating your Grav content with the leading-edge AI-powered search engine service. Agolia is used by over 10,000 businesses to power their search and there's nothing that beats the flexibility and speed, all at a reasonable price. $100 Buy Now Cloudflare Manager Integrate Cloudflare into your Grav site and manage your domain name server from the comfort of the Admin Panel. With Cloudflare Manager not only you can configure DNS records, SSL, Firewall, Caching, Network and optimize for Speed and Scrape Shield, you will also have quick access to your domain's Analytics. $50 Buy Now Instagram Feed Securely integrate Instagram right into your site and display basic profile information, photos and videos. Thanks to the new and secure Instagram Basic Display API, your privacy will be safe. $25 Buy Now Lightbox Gallery A light and versatile Lightbox Gallery plugin built on top of the fantastic GLightbox Gallery. With support for shortcodes as well as Twig partials, it is extremely easy to add appealing zoomable images and galleries to your site. Tell a story with powerful HTML descriptions that can be added for each item individually. $25 Buy Now Site Toolbox The Grav Site Toolbox, is a bundle of useful plugins that help take your site to the next level. This currently contains SVG Icons, Warm Cache, and Zapier RSS plugins. We plan on dropping new plugins into the toolbox over the coming months. $20 Buy Now Frequently Asked Questions If you can't find the answer to your question here, feel free to contact us directly via [email protected] How do I install the license key? Gumroad is no longer able to auto-redirect to your personalized license page after purchasing a premium product. On the receipt/license page you see after purchasing, please click the IMPORTANT: button, to go to the license page. If you don't do this straight away, you can get back to it by clicking on the View Content button in the licence email, which takes you back to the confirmation page, and then you can click the IMPORTANT: button to get you to your licence information page from there. What License covers these Grav Premium Products? All our products are covered by the Grav Premium License unless otherwise noted. Can I use a premium product on as many sites as I want? No, per the Grav Premium License you are issued a license key for each product. That license key can be used on a single site only. If you want to use one of our premium products on another site, you need to purchase another license key. Can I use the same license key on my local machine or development server? Yes, development environments, and even staging servers can use the same license key as the final production site. Only the production site is counted as the single site for the license key. Some examples: If you have two subdomains and each points to an individual Grav instance, then that requires two licenses. If you have two subdomains that are configured to point to different parts of a single Grav instance, then only one license is needed. You have a single site (foo.com), but you also have a staging server copy of this site (staging.foo.com), and a localhost copy for development (foo.local). They all run the same site, just in various phases of development/workflow. Only one license is required for this setup. If you have a multi-site setup on a single Grav instance, where plugins are shared between subsites, that would only require one license. If you have a multi-site setup on a single Grav instance, where plugins are NOT shared between subsites, that would require multiple licenses per site. I've lost my license, can I recover it? Yes, please use our Recover License functionality by entering your email address. You should receive a copy of all the licenses associated with that email address. What is the refund policy for Grav Premium products? Grav Premium offers a 10-day refund policy for their products. If for any reason you are not satisfied with your purchase within the first 10 days after the purchase date, you may request a refund. Please note that refunds are only available for the first purchase of a product and do not apply to subsequent purchases or renewals. To request a refund, simply contact Grav Premium customer support and provide your purchase details (email / license key). We will process your refund within 5-7 business days of receiving your refund request. Should I receive a receipt email? Yes, you should receive an email with your receipt and license key within a few minutes from purchase and from Trilby Media LLC <noreply[at]customers.gumroad.com>. If you never received one, make sure you check the Spam folder or contact us. How can I generate an invoice and customize the identity? After the purchase you will receive an email as receipt that includes your license key. In the email, clicking on "Need an invoice for this? Generate", will take you to a webpage were you can customize the header of the invoice to your needs as well as to save as PDF Can I share a license key among developers? Yes, as developers are generally working on their own local development environments, or on a single development server, the use is not counted towards the single site. However, those developers cannot use the license key for their own personal sites or projects. Can I give a license as a gift or as a giveaway? Absolutely, when you go through the payment process you will notice a little gift icon () next to the email address. When you click on it, you will be able to pick a recipient and a message. This will also work great if you intend to purchase licences as part of a giveway or gift to a lucky friend. Can a license key contain multiple products? Most products have their own license key, it is possible that the purchase of a single product actually provides access to multiple products with that single license key. However, all the products included with that single license key are still bound by the same rules of a single product. In short, it means that these multiple products can still only be used for a single site. Is it possible to change the site for a license? Yes, as long as you remove the license and product from the previous site. We don't require you to register an association of your site to the license key, but we have automated tools that will flag any license that is used on different sites. We may contact you or even disable your license key, if it appears like the license key is being abused. Can I install premium products via the Grav Package Manager (GPM)? Yes, after you have added your license keys to your site via the license-manager plugin, you will be able to install the products via GPM like other plugins and themes. If you do not use the admin, you can manually install the license file the filesystem and CLI version of GPM will function in the same way as the admin version. The manual installation process is outlined in the License Information page that you can reach by clicking the button in your confirmation email. How do product updates work? With a valid license, updates work like any other plugin. You will be notified if a new version is available in the admin, and then you will simply click the update button to install the latest version. This is possible becuase your license is validated before any installation or update is downloaded. Do the license keys expire? Unless otherwise specified, the license keys are a one-time purchase, and will last indefinitely. This allows you to receive unlimited updates as they become available. How do I ask a question or report an issue with a Premium product? We have a setup a dedicated Premium Issue Tracker where you can ask questions. This tracker is intended for owners of licensed products only. For general questions or presale enquiries, please contact us directly. Are there educational discounts available? Unfortunately we don’t have any built-in mechanism to address institution purchases, however please contact us from your .edu email address or provide us with a scan of your educational ID card before purchasing, and we can provide you with a 15% off coupon. How is the sale of these premium products support Grav? All revenue generated will go to Trilby Media, LLC, the business that created and supports Grav CMS. We currently subsidize Grav development by doing custom development work and consulting for clients. However, as consulting of this kind is based on a per-hour model, it means every hour of paid development work, is one hour less to work on Grav development, attend to issues, provide support etc. As products are inherently resellable, and not based on a per-hour model, our hope is that the revenue generated from sales will allow us to put more time into Grav itself. In short, any product you purchase is going to make Grav CMS better!'''
year_published = 2025
clearnet = "https://getgrav.org/premium"
