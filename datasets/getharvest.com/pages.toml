full_description = "Simple & flexible pricing Get started on any plan with a free 30-day trial. No credit card required. Monthly Annual 20% off Free Built forindividual freelancers $0forever Get started Free includes: 1 seat 2 projects Time tracking Reporting basics Invoicing Pro Built for teams that need to track, analyze, and invoice their time $11per seat/month $13.75 per seat/month 30-day free trial Everything in Free, plus: Pro includes: Unlimited seats Unlimited projects Time tracking Team reportingTrack team capacity Invoicing Accounting and payment integrationsIntegrate with Quickbooks Online, Xero, and Deel Scheduled phone support Premium Built for teams with advanced reporting and administrative needs $14per seat/month $17.50per seat/month 30-day free trial Everything in Pro, plus: Profitability reportingTrack profitability for specific clients, projects, tasks, and teams Timesheet approvals Activity logReview all time entries and changes Custom reports and exports SAML-based SSO Custom onboarding support for 50+ seats All prices in USD Compare all features Pricing FAQs What happens at the end of my trial? You can upgrade to a paid plan any time during your 30-day trial period. If you haven’t upgraded at the end of 30 days, your trial account will be automatically deactivated. We don’t collect credit card info when you start a trial, so you don’t need to worry about being charged.Even though your trial account will be deactivated, we won’t delete your data. If you ever want to try Harvest again in the future, your data will be waiting for you.If you’re looking to switch to the free plan, you can do that any time during your trial as well. You’ll see that option during the upgrade process as long as your account meets the free plan’s requirements. Do you offer any discounts? When you pay for the year up front, you get a 20% discount that’s automatically applied to your account. We also offer discounts upon request to teams of 50+ people, nonprofits, schools and universities, educators using Harvest in a classroom setting, and students. Contact our support team for more information. How can I get a quote for my team? Use our handy pricing calculator to see how much your team would pay for Harvest and what discounts could apply. What are our payment options? You can pay for Harvest via credit card either monthly or yearly. If you pay for the year in advance, you’ll get a 20% discount on your bill! If you have 10 or more seats and pay for the year in advance, you can also request an invoice when you upgrade and pay for your subscription via ACH or bank transfer. What happens if my team size changes? You can add seats at any time and will be charged a prorated amount based on the number of days left in your billing cycle. While you can’t remove seats during your current billing cycle, you can indicate inside your account if you’d like your yearly or monthly plan to renew with fewer seats. Keep in mind that yearly accounts receive a 20% discount, so if your seat requirements don’t change from month to month, yearly is probably the best option for you. Will I have access to Premium features during my trial? Yes! The Harvest free trial allows you to try out many Premium features like profitability reporting and timesheet approvals. However, you will not be able to enable SAML-based single-sign-on during your trial. Can I change my plan after subscribing? Yes, you can change your plan at any time. To change your plan, your account admin will need to go to the settings page and, next to current plan, click change plan. From there, you can choose to either immediately upgrade to the premium plan, or schedule a downgrade to the pro plan. How do I sign up for the free plan? When your trial account meets the free plan’s requirements, you can sign up for the free version during the upgrade process. On the Upgrade Your Harvest Plan page, click the switch to the free version link below the plan options. Onboarding a large team? Let u