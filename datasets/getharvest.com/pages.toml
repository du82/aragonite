["https://getharvest.com/about"]
title = "About Us - Harvest Time Tracking & Timesheets"
description = "Harvest is a simple time tracking and fast invoicing solution built in 2006. Innovators in over 100 countries use Harvest everyday to work better."
full_description = "Everyone’s time is valuable. We help teams spend it wisely. Time — everyone has something to say about it, and yet it often goes unmentioned. We believe time should be treated with respect and used with intention. It’s precious, it’s personal, and it’s the shared resource that turns talent into impact. That’s why we make tools that help teams understand the value of their time and shape how they use it. Our story Keeping time and helping teams thrive since 2006 Harvest was created by two small business owners who were looking for a better way to manage and grow their web design agency in New York City. What started as a solution for their own company has since evolved into a business intelligence platform embraced by thousands of professional services firms across the world who share the same drive to grow thriving, sustainable businesses. 2006 Harvest is launched! One of the first mobile friendly ways to track time. Lightweight time tracking, from our team to yours. 2010 Harvest launches online payments integration, helping customers get paid even faster. 2015 An expanding set of integrations and native apps make Harvest available across devices and within the most popular collaboration tools. 2024 Over 2 billion hours tracked, and $63+ billion invoices sent and payments received through Harvest on behalf of customers. Our customers Trusted by early birds and night owls around the world Harvest is lightweight, nimble, and designed to power teams as diverse as what they make. From our origins in a design shop, we know that the ways teams spend their time are as different as the personalities on their team and the clients they serve. Today, Harvest serves the time tracking and billing needs of thousands of customers around the world, from freelancers to small businesses to departments within Fortune 500 companies. Meet our customers 70,000+ customers 1.9 billion hours tracked $63+ billion invoiced by customers Careers at Harvest Want to join us in our mission to help teams spend time wisely? Visit our Careers page Press & Partner kit Looking for the Harvest logo and screenshots of our product? Download press kit"
