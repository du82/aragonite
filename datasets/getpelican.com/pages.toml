full_description = "Pelican 4.10 released Mon 16 September 2024 By Pelican Contributors In news. Pelican 4.10 is now available. This new release includes the following enhancements, fixes, and tweaks: Add setting to specify summary via paragraph count Add new status to skip generation of a post Add setting to append ref parameter to links in feeds Configure logging handler via --log-handler CLI option Resolve intra-site links in summaries Warn when files are not processed due to disabled readers Add Medium post importer Improve GitHub Pages workflow Improve code test coverage Translate documentation into Simplified Chinese For more information, please refer to the release page or the Release History section of the documentation. For the full list of changes, see: https://github.com/getpelican/pelican/compare/4.9.1...4.10.0 Upgrading from previous releases Upgrading from Pelican 4.9.x should be smooth and require few (if any) changes to your environment. If upgrading from a previous release, review the other release announcements on this site to better understand what action might be necessary. As always, we do everything we can to maximize backwards compatibility and ensure smooth Pelican upgrades. If you run into problems, please see the How to Get Help section of the documentation, and we will update this post with any upgrade tips contributed by the Pelican community. Pelican 4.9 released Wed 15 November 2023 By Pelican Contributors In news. Pelican 4.9 is now available. This new release includes the following enhancements, fixes, and tweaks: Upgrade code to new minimum supported Python version: 3.8 Settings support for pathlib.Path (#2758) Various improvements to Simple theme (#2976 & #3234) Use Furo as Sphinx documentation theme (#3023) Default to 100 articles … read more New Pelican Site, Docs Theme, and Discussions Thu 15 September 2022 By Justin Mayer In news. ✨ New Pelican Web Site ✨ Pelican has a brand-new, custom-built web site! 🦄 The previous design served the Pelican community well for many years, but it was time for it to be replaced with a design that is more modern and responsive on mobile devices. Check it out on a phone and … read more"
