full_description = "Pelican 4.6 released Tue 23 March 2021 By Pelican Contributors In news. Pelican 4.6 is now available. Thanks to Tom Adler’s contribution, this release contains a new feature that allows for more SEO-friendly index pages, whereby /page-1/ contains the oldest articles, with newer articles placed on /page-2/, /page-3/, etc. That way, the names of the previous article index pages do … read more Migrating Plugins to New Organization Mon 15 February 2021 By Pelican Contributors In news. So you want to help migrate a plugin? Great! If the plugin you want to migrate is located in the legacy monolithic Pelican Plugins repository: Create an issue at the legacy monolithic Pelican Plugins repository and ask a maintainer to create a corresponding new repository under the new Pelican Plugins … read more Pelican 4.5 released Thu 20 August 2020 By Pelican Contributors In news. Pelican 4.5 is now available. Its marquee feature is support for “namespace” plugins, which means any plugin listed under the new Pelican Plugins organization can be installed via Pip, after which Pelican should automatically detect and enable the new plugin. This also means that Pelican projects can specify and … read more Pelican Sprint — Fall 2019 Fri 18 October 2019 By Pelican Contributors In news. In the spirit of Hacktoberfest, we will be conducting an informal sprint on Sunday, 20 October. One of the goals for this sprint is to migrate plugins from the current monolithic repository to individual, community-shared repositories. The following issues will provide some historical background for those who want to learn … read more Pelican 4.1 released Sun 14 July 2019 By Pelican Contributors In news. Pelican 4.1 has been released and includes the following enhancements, fixes, and tweaks: Live browser reload upon changed files (provided via Invoke task) Add pyproject.toml, managed by Poetry Support for invoking python -m pelican Add relative source path attribute to content Allow directories in EXTRA_PATH_METADATA Add all_articles variable … read more"
