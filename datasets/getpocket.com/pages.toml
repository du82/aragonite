title = "How to Protect Your Finances—and Sanity—From Scammers"
description = "Want to stay one step ahead of online scammers? It helps to think like one."
full_description = '‎What the Hack with Adam Levin [LISTEN]“With guests ranging from schoolteachers to award-winning journalists to former U.S. Senator Al Franken, What the Hack has created a safe zone to talk about online crime–what we like to call a “no shame zone.” Sometimes funny, sometimes tragic, but always a learning experience for us and our listeners alike, we think our weekly podcast is a must-listen (but of course we do).” - Adam LevinAdam LevinApple PodcastsSave Roy Wood, Jr. on the Ultimate Hack: Misinformation. [WATCH]AL: “Roy Wood, Jr. is one of the funniest people working in the entertainment industry today. We were lucky to have him on “What the Hack” and his comments about misinformation in the media were so astute that we made it into an animated short. You’ll never think about supermarket tabloids and the Loch Ness Monster the same way again.”Adam LevinYouTubeSave John DeMay Lost His Son to a Sextortion Scam [LISTEN]AL: “One evening, seventeen-year-old Jordan DeMay was coaxed by an online scammer into sending nude pictures of himself. Hours later, he took his own life. Now his father, John DeMay, works to raise awareness of the risks of sextortion and romance scams. This important episode focuses on the life-and-death consequences of today’s cyber crimescape.”Adam LevinApple PodcastsSave Have I Been Pwned: Check If Your Email Has Been Compromised in a Data BreachAL: “With the latest news on data breaches, leaks and compromises, haveibeenpwned.com is an indispensable tool in the war against cyber insecurity. Searchable by email address, phone number and password, HaveIBeenPwned is a quick way to determine how much of your information is in criminal hands, and what needs to change to make yourself more secure.”Have I Been Pwnedhaveibeenpwned.comSave The Brett Johnson Show [LISTEN]AL: "Want to avoid getting scammed? Who better to ask than a reformed scammer? Brett Johnson, who was once on the FBI’s Most Wanted list and now calls himself the first “Chief Criminal Officer” has a great podcast on scams and cybercrime of all kinds. He’s funny, engaging, and deeply knowledgeable about cybersecurity."Brett Johnsonthebrettjohnsonshow.comSave'
