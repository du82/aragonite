title = "Understanding the Electoral College"
description = "Everything you ever wanted to know about America’s byzantine system for selecting a president."
full_description = "The Road to the White House Is Through the Electoral College. How Does It Work?In the United States, a presidential candidate is elected not by winning a majority of the national popular vote but through a system called the Electoral College, which grants electoral votes to the 50 states and the District of Columbia based on their population.Maya Marchel HoffUSA TODAYSave The Race Is so Close. Here’s What Happens If There’s a 269-269 Electoral College TieIt’s very unlikely — but theoretically possible — that the presidential election ends with an Electoral College tie. If it did come to pass, here’s how the next president would be determined.Ashley LopezNPRSave Podcast: The Electoral CollegeWhat is it, why do we have it, and why hasn't it changed?ThroughlineNPRSave Why Was the Electoral College Created?The Founding Fathers had to compromise when it came to devising a system to elect the president.Dave RoosHistory.comSave No Country Still Uses an Electoral College − Except the USEvery other country that used an electoral college has been unsatisfied with the results and chosen another way to pick a leader.Joshua HolzerThe ConversationSave The Evolution of the Electoral CollegeToday’s process would be unrecognizable to the nation’s founders, who imagined it as an indirect and deliberative system with considerably narrower public participation.Jean TanisNew-York Historical SocietySave How Much Does Your Vote Weigh?The electoral college outcome doesn’t always reflect the popular vote, but that’s not the only factor that determines how influential your vote is.Jeff NilssonSaturday Evening PostSave Presidential Battleground States Change All the TimeIn politics, as in military conflict, there is a tendency among generals and journalists alike to fight the last war. But battlegrounds often change.Ed KilgoreNew York Save Why Electoral College Landslides Are Easier To Win Than Popular Vote OnesThe very nature of the way the U.S. picks its presidents tends to create a disconnect between the outcome in the Electoral College and the popular vote.Drew DeSilverPew Research CenterSave"
