full_description = "Meet The Feminist Trailblazer Behind 'Brown V. Board Of Education' You've Probably Never Heard OfDeborah Douglas: “Pauli Murray was a woman before her time, an Episcopal priest, attorney, and civil rights and women’s rights activist whose Howard University School of Law paper formed the foundation of the winning argument in 1954 Brown v. Board of Education.”Amen OyibokeBustleSave Overlooked No More: Georgia Gilmore, Who Fed and Funded the Montgomery Bus BoycottDD: “Georgia Gilmore was a Montgomery, Alabama, cook and midwife who organized a secret kitchen to feed and fund the 1955 Montgomery Bus Boycott, helping Black residents access alternative transportation than the city bus system.”Klancy MillerThe New York TimesSave Print of Three of the Memphis ThirteenDD: “Dwania Kyles was among 13 Black first-grade boys and girls who desegregated Memphis schools, and her journey was documented by photographer Ernest Withers, whose body of work is on display in the Withers Collection Museum & Gallery on Beale Street in Memphis.”Ernest WithersThe Withers Collection Museum & GallerySave Little Rock Central High School National Historic Site DD: “Integrating nine students into Little Rock Central High School resulted in high schools closing altogether the following year. In 1959, Sybil Jordan Hampton was a part of the second group to integrate the school—permanently—and was the youngest of the youthful integrationists.” United States Civil Rights TrailSave Fannie Lou Hamer’s Dauntless Fight for Black Americans’ Right to VoteDD: “Look forward to the October arrival of Prof. Keisha N. Blain’s Until I Am Free: Fannie Lou Hamer's Enduring Message to America that will delve into Hamer’s strategies and how they link to current issues, such as voter suppression, police violence, and economic inequality.”Keisha N. BlainSmithsonian MagazineSave A Homage To Legendary Human Rights Activist Ella BakerDD: “In 1960, Ella Baker was working with the Southern Christian Leadership Conference when she deftly empowered college students in figuring out how they wanted to lead: This resulted in the founding of the Student Nonviolent Coordinating Committee during a weekend retreat at Shaw University in Raleigh.”Because of Them We CanSave"
