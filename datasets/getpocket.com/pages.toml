title = "AI Will Change the World. But How Exactly?"
description = "AI promises huge impact across every industry, from healthcare to Hollywood. But what will its impact look like?"
full_description = "Reading Your Mind: The Future of Brain PrivacyAvi Asher-Schapiro: “At the Thomson Reuters Foundation’s Trust Conference, we premiered a documentary that looks at how AI has fueled massive innovation in the neurotechnology industry, making it easier for wearables like headbands and earbuds to actually read our thoughts. The implications for healthcare, consumer electronics, as well as privacy, are hard to overstate—and regulators are still grappling with how to develop guardrails.”Avi Asher-SchapiroContextSave Thirsty Data Centres Spring up in Water-Poor Mexican TownAA: “Our Mexico correspondent Diana Baptista has been reporting on the impact of the AI boom on the drought-wracked region of Mexico which has recently begun to host AI data centers from some of the biggest companies in the world: Microsoft, Google and Amazon. AI data centers are known to use a lot of water to cool their servers—and that could be a problem. None of the companies would tell her how much water the facilities would use, though Diana was able to get public records showing that Microsoft had obtained a concession to use about 25% of the total water in the city of Colón.”Diana BaptistaFintan McDonnellContextSave AI and the Law: Democratising Access or Perpetuating Divide | Trust Conference 2024 | Day TwoAA: “An estimated two-thirds of the world’s population has unmet justice needs. With Chat GPT-4 famously capable of passing the US bar exam, could AI be the future of closing the justice gap by maximizing lawyers’ time? In this conversation from the Trust Conference, experts discuss the opportunities to use AI in the courtroom, as well as how lawyers can address concerns about deepfakes, bias, and inequality.”Trust ConferenceYouTubeSave One Year of War in Gaza: Decoding the Role of Big TechAA: “Many are calling the war in Gaza the “First AI War,” with the Israeli military relying on advanced AI tools to identify and pick targets. This piece, which I reported with our colleague in Beirut, looks at some of the ethical implications of this trend—and spotlights some tech workers who are trying to stop their employers selling tech tools to power a war.”Avi Asher-SchapiroNazih OsseiranContextSave"
