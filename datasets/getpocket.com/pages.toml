full_description = "Rent-a-Stranger: This Japanese Man Makes a Living Showing up and Doing NothingShoji Morimoto doesn’t talk much but he will sit and listen and be there for events people fear to share with someone they know.Michelle Ye HeeThe Washington PostSave Meet the Falconer Who Earns $20,000 a MonthYou do what? A Long Island native traded book publishing for birds and never looked back.Arianne CohenBloombergSave A Day in the Life of a Flavour InventorWithout help, flavours don’t always work well or last long. So scientists enlist all manner of agents to impart certain tastes in processed food.Veronique GreenwoodBBCSave A Day in the Life of a Mountain-Bike Trail BuilderBuilding some of the country’s best trails isn’t just about crafting flowing ribbons of singletrack. It’s also about navigating miles of red tape.Nicholas HuntOutsideSave Secret Life of a MermaidTheir lavish costumes and group swims provide a community they could never find on land — so much so that they don’t identify as human.Maureen O’HaganNarrativelySave Here’s What It Takes to Be a Full-Time Disney PrincessKeeping the magic is sometimes all about having the right shade of lipstick.Virginia ChamleeBuzzFeedSave The Designer Putting the Extreme in Extreme Obstacle CoursesCoolest travel jobs: what it’s like to design extreme obstacle courses.Ashlea HalpernAFARSave The Iceberg Cowboys Who Wrangle the Purest Water on EarthMy journey to meet the people herding frozen leviathans on the maritime frontier.Matthew BirkholdNautilusSave What It’s Like to Be an Avalanche ForecasterIt involves skiing, helicopters, and dynamite (really).Ashlea HalpernAFARSave The Squelchy, Messy Art of Video Game Sound EffectsFoley artist Joanna Fang powers up video games with her eclectic arsenal of sound-simulating weapons.Will BedingfieldWIREDSave He’s Baseball’s Only Mud Supplier. It’s a Job He May Soon Lose.Jim Bintliff collects the Delaware River mud that is smeared on Major League baseballs to make them less slippery. But that tradition is in jeopardy.Dan BarryThe New York TimesSave"
