title = "How to Reframe the ‘Month of Love’"
description = "Fewer teddy bears and chocolate hearts, more showing up and doing the work, even when it’s uncomfortable."
full_description = "Unpartnered: Building A Full, Single Life [LISTEN]“Recording this episode helped me challenge a lot of my assumptions about people who choose singlehood! If you’ve inherited the narrative that being single is a ‘temporary stop’ on someone’s life journey, then this one will open up your mind and your heart!” -Anita RaoEmbodiedThe PodglomerateSave Auto-Mated: When a Bot Becomes Your Boo [LISTEN]“We heard a lot about AI in 2023. But (IMHO) we didn’t hear enough about the deep, emotional relationships people are already forming with certain forms of AI technology and what that means for our human connections. That’s the gap this episode (and the other two in this series) filled for me. They helped me understand how new technology can be a tool for bettering my relationships…if I recognize its limits and have a clear understanding of when we need to put the chatbots away.”EmbodiedThe PodglomerateSave ‎Free From Desire: Asexual in the City of Love [LISTEN]AR: “This is a podcast that reminds me why I love podcasts—the intimacy you can feel with someone you don’t know… is unmatched! In taking you into their own story of embracing asexuality, Alene will get you to question your definitions of sex, romance, and attraction.”Paradiso MediaSave How Do You Wish You’d Been Loved As a Kid? Asking Can Help You Heal Childhood Wounds.AR: “It took the end of an eight-year relationship for me to realize that before I started dating someone seriously again, I needed to figure out how I want to be loved. Note To Reader: Don’t wait eight years to figure this out! I love that this comic so quickly gets to the core of this big and profound question: How do you want to be loved?”Brittany Long OlsenThe Washington PostSave Can’t Help Falling in Love Ft Monica Martin (Elvis Presley Cover) [LISTEN]AR: “Loving yourself well is all about making space to feel your feelings. So this one falls in the category of: Just Trust Me! Press play. Close your eyes. And I promise that you’ll be feeling something when you come out the other side.”Lake Street DiveYouTubeSave"
