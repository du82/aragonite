full_description = "The Group Dynamics That Give Power to Bad BossesEmployees defer to domineering bosses even though they don't respect them—but we have some power to change this dynamic.Sara HarrisonGreater GoodSave The Biggest Source of Office Drama Has Returned With a VengeanceWorkplace kitchen wars are back!Alison GreenSlateSave Stop Slacking Me: How to Set Digital Boundaries for Chatty CoworkersThe line between socialization and work have blurred on digital platforms, which companies turned to during the pandemic. But new norms create new problems.Danielle AbrilThe Washington PostSave ‘I’m Tired of Dealing With Incompetent Co-workers’The reality is that we have to continuously communicate how we’d like to be treated in every relationship in our lives, and this includes the workplace.Kimberly BrownThe CutSave How to Ask for a Raise, Without Alienating Your Boss Along the WayTips from psychologists, managers and people who have successfully asked what can feel like a very difficult question.Paulette PerhachThe New York TimesSave Forgiving a Difficult Colleaguet’s one thing to extend forgiveness to someone who is genuinely remorseful and asks for it, but it’s quite another to impart it to someone who’s not sorry and is likely not going to change. And yet, that may be the most important time to forgive.Ron CarucciHarvard Business ReviewSave The Bias That Drives ‘Catty’ Workplace ConflictWhen women work for other women, clashes are notorious—even inevitable. But that narrative doesn’t tell the whole story.Josie CoxBBCSave How to Handle Office Gossip … When It’s About YouFirst, let the messenger of the gossip know you’ll be discussing it with the gossiping colleague. You may lose access to some information. But if your example positively influences others, you may gain a healthier workplace.Joseph GrennyHarvard Business ReviewSave BONUS READ: Is It Time to Quiet Quit Workplace Buzzwords?Whether you like to stay on top of office-themed jargon or enjoy poking fun at o