title = "What’s It Like to Live at the Edge of the World?"
description = "Dispatches from people living in and journeying to the ends of the Earth: befriending roombas at the South Pole, online shopping in remote islands, and spending 500 days alone in a cave."
full_description = "The Icy Village Where You Must Remove Your AppendixThere’s a settlement in Antarctica with a school, a post office and a huddle of homes. It’s like other sub-zero villages, except for one thing: families must have surgery to move in.Richard FisherBBCSave The Woman Who Spent Five Hundred Days in a CaveBeatriz Flamini liked to be alone so much that she decided to live underground—and pursue a world record. The experience was gruelling and surreal.D. T. MaxThe New YorkerSave In Remote Alaska, Meal Planning Is EverythingIn a town where most ingredients need to be grown or painstakingly shipped in via bush plane, everyone’s invested in eating well.Bree KesslerEaterSave A Journey to Earth’s Most Remote FlowerTagimoucia is so rare that it only grows on one of Fiji’s 330 islands, it’s found high atop a steep mountain ridge and it blooms for less than three months a year.Ben McKechnieBBC TravelSave The Internet’s Final Frontier: Remote Amazon TribesElon Musk’s Starlink has connected an isolated tribe to the outside world — and divided it from within.Jack NicasThe New York TimesSave ‘Remote’ Amazonian Tribes Have Been Using the Internet for a Long TimeThe Marubo people written about by The New York Times have been using the internet—and grappling with its implications—long before Starlink came to their village.Jason Koebler404 MediaSave Roombas at the End of the WorldRobotic romance, ransoms, and raccoon suits at the South Pole.Evan AckermanIEEESave My Journey to Scotland’s Most Remote PubFor decades, the Old Forge was the holy grail of the British outdoors community. The UK’s remotest pub, it could only be reached via boat or a three-day walk through one of Britain’s last true wildernesses, the Knoydart peninsula in Scotland. A dispute between some locals and a new owner threatened the legend—until they decided to open up a pub of their own.Oliver SmithOutsideSave ‘Coolest Job on Earth’: Antarctica Welcomes New PostmasterUK Antarctic Heritage Trust fills 