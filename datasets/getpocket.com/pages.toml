full_description = "Why the First Gay Olympics Was a Watershed Moment in Sports“The first Gay Games, and the fierce backlash from the Olympics, was a defining moment in building an international LGBTQ+ sports movement.” -Kenrick RossStephen WoodHistorySave Inside the Struggle to Stage the 2022 Gay GamesKR: “And while much has changed, some struggles continue. Though the crises surrounding this edition of the Gay Games are troubling, LGBTQ+ sports at the local level, in cities across the world, are thriving like never before.”Chad de GuzmanTimeSave Love, Death and Volleyball: The Four-Decade Run of a Trailblazing Gay Sports LeagueKR: “Many LGBTQ+ sports groups developed at the height of the AIDS epidemic, offering spaces of refuge and resistance. Tournaments often doubled as fundraisers for organizations serving people living with AIDS when resources for such work were scarce.”Dan StahlNarrativelySave ‘Everybody Is Welcome Here’KR: “While many politicians are telling trans people they don’t belong in sports, communities across the country are saying the opposite.”Kurt StreeterThe New York TimesSave In Thailand, Muslim Lesbians Tackle Stereotypes by Playing SoccerKR: “In bringing their whole selves to sports, many LGBTQ+ amateur athletes are challenging stereotypes well beyond sexual orientation.”Thomson Reuters FoundationSouth China Morning PostSave At World Cup, U.S. Team’s Pride Is Felt by Others, TooKR: “‘Out’ pro athletes still remain few and far between, but their presence in sports like soccer and tennis has had a huge impact on encouraging amateur athletes to take up more space.”Andrew KehThe New York TimesSave All-Trans Football Team Set to Make History on the Pitch: ‘You Can Create Your Own Spaces’KR: “Today, the issues are different from those confronted by LGBTQ+ athletes of previous generations, but the potential for sports to create community, and spaces of visibility, comfort, and resilience remains the same.”Maggie BaskaThe Pink NewsSave"
