full_description = "LATEST ADDITIONS: 4 Olympic Sports Are Ready to Break in at 2024 Paris GamesThere are some thrilling new sports at the 2024 Paris Olympics.Joseph AcostaSB NationSave EVERYONE’S WONDERING: Will the Seine Be Clean Enough to Swim in? Not Even the Experts KnowTriathlon and marathon swimming are to take place in the Seine, where it has been illegal to swim for more than a century. The water has tested unsafe in recent weeks, and cleaner on other days.The Associated PressNPRSave SWIMMING, SOCCER, AND SURVEILLANCE: Paris Preps for an AI-Monitored OlympicsThe technology ‘risks permanently transforming France.’Mack DeGeurinPopular ScienceSave MUST READ: For Kenya’s Women Runners, the Road to Greatness Can Be DeadlyThis summer, the world will watch East African women dominate track and field at the Paris Olympics. What you won’t see are all the dangerous roadblocks and many hurdles they navigate in order to chase their dreams.Gioia ShahElleSave THROW DOWN: Breaking, the New Olympic Sport for 2024, ExplainedHere’s everything you need to know about the newest sport at the Olympics, from the history of breakdancing to the format, and how it will work at the Paris Games.Jess AndersonBBCSave FROM LEBRON TO LEDECKY: 10 Biggest Athletes to Watch at Paris 2024 OlympicsFrom sporting legends to Gen Z prodigies, Al Jazeera picks out 10 ‘must watch’ athletes at the 2024 Olympics in Paris.StaffAl Jazeera EnglishSave HISTORY: Nine Things You Didn’t Know About the Ancient Olympic GamesWith an intensive athletes’ boot camp and the threat of execution for unwelcome spectators, the Greek sporting event was a serious affair.Sonja AndersonSmithsonian MagazineSave ICONIC: 10 Images of the Most Historic Moments at the Olympic GamesHere are stunning images from new book The Last Heroes that capture the most tense and historic Olympic moments. Deborah Nicholls-LeeBBCSave PLASTIC-BOTTLE SEATS AND WOODEN POOLS: Can Paris Deliver the Leanest, Greenest Olympics Yet?The Paris Olympics