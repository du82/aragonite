full_description = "The Decline of American Playtime—and How to Resurrect ItThe world can be terrifying. But we should still give kids the freedom to explore it.Anna NorthVoxSave Why You Should Stop Feeling Guilty About Your Kid’s Screen TimeGiving your kid time on screens might actually be good for your whole family.Laura Wheatman HillLifehackerSave Why I Retired From Packing LunchKids don’t need squash cut into star shapes in their $60 stainless steel (not dishwasher safe!) lunchbox to know they are loved. They can eat off cafeteria trays and still get into a good college, or at least not grow up to be serial killers. #TeamSchoolLunch forever.Virginia Sole-SmithBurnt ToastSave Let Kids Get Bored. It’s Good for Them.A reminder to parents soldiering through the summer: Boredom has its virtues.Catherine PearsonThe New York TimesSave You Are Not a Bad Family If Dinnertime Doesn’t Work for YouIn a way, meals are a terrible time to attempt to foster whole-family connection, and it isn’t as essential as the culture wants you to think it is.Sarah WheelerRomperSave The Gravitational Pull of Supervising Kids All the TimeWhen so many people think hovering is what good parents do, how do you stop?Stephanie H. MurrayThe AtlanticSave Kids Deserve to Take Up Space TooSomething seems to have shifted post-lockdown, and our appetite for empathy and grace in communal spaces has withered.Amil NiaziThe CutSave"
