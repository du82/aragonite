title = "How to Approach Vacation Planning for Maximum Enjoyment"
description = "It’s not so much where you go, as how you go."
full_description = "Why Travel Should Be Considered an Essential Human Activity“Start here. This is a great jumping off point for your travel journey—a piece that will stir up your enthusiasm and get you in the zone for travel planning and research. In the grind of our daily routines, it’s easy to get lost in the minutiae of responsibilities and forget that sometimes, the best thing we can possibly do is leave it all behind. This gave me some great perspective, not only on human history and psychology, but on a new way to look at travel—not as a given, but as a gift.” -Aaron MillarEric WeinerNational GeographicSave Land of Wonder: Four Weeks on Colombia's Magdalena River with Jordan Salama [LISTEN]AM: “Jordan Salama is a young travel writer who embodies the art of mindful and intentional travel. In this episode, which was a delight to record, he recounts his journey traveling the length of the Magdalena River in Colombia. For me, the highlights of his story were all the people he met along the way—from the biblioburro (the donkey bookseller) to the silversmiths and jewelry-makers living in a real-life Macondo.”Armchair ExplorerThe PodglomerateSave Walking with Nomads: 2,800-miles Across the Entire Length of Morocco with Explorer Alice Morrison [LISTEN]AM: “This is a perfect example of what mindful travel looks like to me. So much of the joy of Alice’s journey in Morocco came from gaining an intimate glimpse into the daily lives of locals. And her choice to travel on foot—rather than in a train or a car—helped her to soak up so much more than she would have otherwise.”Armchair ExplorerThe PodglomerateSave The Art of Being a FlâneurAM: “I interviewed legendary travel writer Rolf Potts for my podcast, and he told me that the best way to travel is ‘to dare to be lonely, lost, and bored.’ This NYT piece perfectly captures the value of this approach to travel— not going in with a rigid agenda, merely letting your interest and your surroundings be your guide. Hint: It makes for a much richer, deeper experience.”Stephanie RosenbloomThe New York TimesSave"
