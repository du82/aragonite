["https://getpocket.com/collections/an-ethics-professor-on-figuring-out-what-the-good-life-means-to-you"]
title = "An Ethics Professor on Figuring Out What the ‘Good Life’ Means to You"
description = "Our brains don’t always know what makes us happy. But there’s plenty of research to help point us in the right direction."
full_description = "Robert Waldinger and Marc Schulz: Lessons from the World’s Longest Study on Happiness [LISTEN]“Invest in relationships. When I sat down to interview two researchers working on the longest running study ever conducted on happiness, I was delighted to learn that their findings were both simple and actionable. The one thing that has the greatest impact on happiness across all socioeconomic barriers…having close relationships.” -Lee C. CampNo Small Endeavor with Lee C. CampSave Malcolm Gladwell: Becoming Malcolm [LISTEN]LCC: “Be curious, not judgmental. I got to spend a long weekend with Malcolm Gladwell and interview him twice in front of live audiences. I was interested in investigating the sources of why Malcolm is Malcolm. Our conversation, I think, is a great window into specifically what healthy curiosity looks like, and the sort of human flourishing curiosity might engender.”No Small Endeavor with Lee C. CampSave John Dear: How to Be Nonviolent [LISTEN]LCC: “Don’t seek comfort first. I traveled to California to conduct this interview in person with Catholic peace activist John Dear. John straightforwardly challenges the notion that the good life is a merely comfortable. He says: ‘A good life is not the easy life. It's not being comfortable, and therefore it's not about making money, or being successful… But how do you live a good life in a world of thirty wars, thirteen thousand nuclear weapons, four billion people in subhuman poverty, racism, gun violence, child hunger? One could go on and on—and then, catastrophic climate change...So for me, doing the good life is actively working to make the world better.’”No Small Endeavor with Lee C. CampSave Elise Hu: Obsessed With Beauty [LISTEN]LCC: “Pursue beauty. Numerous philosophers have maintained that truth, goodness, and beauty are central to a good life. But I was surprised at how Elise Hu’s deep dive into South Korean beauty culture illuminated what true beauty might actually be. What’s more, I think her vulnerability about her own relationship to beauty as a mother of a young daughter is both comforting and practical.”No Small Endeavor with Lee C. CampSave"
