full_description = "Here’s Cupid’s History, and Why He’s a Part of Valentine’s DayEvery year on Feb. 14, Valentine’s Day is marked by shades of pink, flowers, chocolates, romantic movies and wine — and images of a magical baby boy who flies around shooting arrows at people.Time5 minSave Living Against Time: Virginia Woolf on Reaping the “Moments of Being” That Make You Who You AreIn praise of “the power of taking hold of experience, of turning it round, slowly, in the light.”The Marginalian6 minSave How Elon Musk’s DOGE Took Over the Education Department, One Office at a TimePresident Donald Trump wants to dismantle the Department of Education. He can’t eliminate it without Congress, but Elon Musk’s DOGE can slowly starve it.CNBC3 minSave Beyond Causality in Order to Bridge the Yawning Gulf Between the Humanities and the Sciences We Must Turn to an Unexpected Field: Mathematics by Gordon Gillespie + BIOIn order to bridge the yawning gulf between the humanities and the sciences we must turn to an unexpected field: mathematicsAeon22 minSave The Madness of Robert F. Kennedy. Jr.The below article first appeared in David Corn’s newsletter, Our Land. The newsletter comes out twice a week (most of the time) and provides behind-the-scenes stories and articles about politics, media, and culture.Mother Jones7 minSave Defending Mr JefferiesAweek​ before Christmas in 2010, a young woman called Joanna Yeates disappeared from her home in Bristol. I remember first hearing about it on the car radio, my attention snagged, as it always is when Bristol is on the news, because that’s where I went to school.London Review of Books20 minSave Explore a Digitized Edition of the Voynich Manuscript, “the World’s Most Mysterious Book”A 600-year-old manuscript—written in a script no one has ever decod­ed, filled with cryp­tic illus­tra­tions, its ori­gins remain­ing to this day a mys­tery….Open Culture5 minSave No Tubman, No Rainbows: Defense Schools Prepared for Hegseth’s WifeHarriet Tubman po