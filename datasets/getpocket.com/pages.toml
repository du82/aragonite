full_description = "Hi, we’re Pocket.We’re powered by a community of interesting people with curious minds, and we empower people to keep their minds focused, stimulated, and nourished. Which makes us a refreshing change from other digital spaces.Build a home for everything that interests you with PocketUse Pocket to save anything that sparks your curiosity and enjoy it when you’re ready to focus. In no time your list will become a personal library filled with enticing content to inform, inspire, and fuel you.Save from anywhere on the webOnce you’ve signed up, add the button to your browser, install the app on your mobile device, and start discovering content you love. With the click of a button you can easily save articles, videos, and links to your personal library.Your private reading nookWhen you’re ready to dig into what you’ve saved, Pocket provides a quiet, calm space that’s perfect for reading. It strips away all the distractions of the internet — like flashing banners and pop-ups — so you can really focus.Special features for focused readingUse the Pocket app to listen to stories with our audio playback option. Customize how you see stories in Pocket with dark mode and font options. Keep track of your saves with tags, and preserve important passages with highlights. You can even read offline.Use Pocket your wayThere are lots of ways you can use Pocket. Some people use it to save stories throughout the day to read when they’re ready. Hunter-gatherer types use it to save all the things they want to read, watch, listen to, or buy. Others use Pocket to highlight key passages to help them grow, learn, and thrive.And some folks love exploring Pocket’s recommendations to find inspiration, challenge their views, and see the occasional cat (or dog) story.Welcome to the sunny side of the webStart using PocketContact us for press inquiries at press@getpocket.com.Download our images and press kit here."
