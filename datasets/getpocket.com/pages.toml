description = "From the Veep who wrote a #1 song to the one considered the most useless in history."
full_description = "How the Vice Presidency Went From an ‘Insignificant Office’ to a Political PowerhouseEarly U.S. vice presidents focused on their constitutional role as president of the Senate, but more modern officeholders have held more influence in the White House and beyond.Joe HernandezNPRSave Why Vice Presidential Picks Matter: Significant Moments in History and Transfers of PowerOf the 49 vice presidents in U.S. history, nine of them — or nearly 1 in 5 — have risen to the presidency due to death or resignation.Chris MegerianThe Associated PressSave Sex, Money, Social Media — How VP Contenders Are VettedSpare a thought for the contenders who undergo a process that one past participant likens to “a colonoscopy performed with a telescope”.Jude SheerinBBCSave Inside Number One Observatory CircleAlmost everyone knows the White House, but few people know that the vice president has an official residence of their own.Brennan WeissInsiderSave ‘His Accidency’: The First President to Die in Office and the Constitutional Confusion That FollowedWas John Tyler really president after pneumonia claimed the life of William Henry Harrison? In 1841, the country wasn’t sure.Ronald G. ShaferThe Washington PostSave The Most Useless Veep in U.S. HistoryA hoax about the president’s death led him to believe he was Commander-in-Chief—and it paralyzed him with fear.Gil TroyThe Daily BeastSave The Vice President Who Wrote a Hit SongTo date, Charles Dawes is the only Vice President to have a song chart at #1, though he missed the whole thing.Stacy ConradtMental FlossSave How F.D.R.’s Death Changed the Vice-PresidencyThe possibility of a sudden succession now plays a larger part in the selection of Vice-Presidents, but not always.Jeffrey FrankThe New YorkerSave The Vice Presidents That History ForgotThe U.S. vice presidency has been filled by a rogues gallery of mediocrities, criminals and even corpses.Tony HorwitzSmithsonian MagazineSave A Brief History of Vice Presidents Bemoaning the Vice PresidencyA compendium of all the nasty things said about the job.Jaime FullerThe Washington PostSave"
