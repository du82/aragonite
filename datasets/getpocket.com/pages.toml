full_description = "Daylight Saving Ends Sunday. Why That Extra Hour of Sleep Isn’t All It’s Cracked up to BeYes, that’s right, daylight saving is ending and darkness is coming.Clara HarterLos Angeles TimesSave Everyone Seems to Hate Daylight Saving Time. Do We Even Need It, and Why Is It So Hard to Get Rid Of?Shifting the clocks messes with people’s circadian rhythms — making everyone groggy, cranky and sometimes dangerously off their game.Dan VerganoMatthew ZeitlinMaggie SevernsMariana LabbateKay SteigerGridSave More Than 100 Years Later, the Madness of Daylight Saving Time EnduresDespite its name, daylight saving has never saved anyone anything. But it has proven to be a fantastically effective driver of retail spending.Michael DowningThe ConversationSave What Happened the Last Time the U.S. Tried to Make Daylight Saving Time Permanent?A 1974 switch to year-round DST proved unpopular, with Americans expressing “distaste” for the long, dark winter mornings.Meilan SollySmithsonian MagazineSave Why Daylight Saving Time Is Worse for Your Body Than Standard TimeAn animated story of what science says about changing our clocks in the fall and spring.Aaron SteckelbergLindsey BeverThe Washington PostSave Learning to Love Daylight Saving TimeSpringing forward and falling back is disruptive, and maybe even deadly, but our current system of time-keeping still can’t be beat.Binyamin AppelbaumThe New York TimesSave Why We Should Be Watching the Sun, Not the ClockBetween daylight saving and obligatory early starts, we live at the mercy of ‘official’ time – and many of us feel permanently out of sync.Linda GeddesThe GuardianSave Meet the People Who Live Outside of TimeAs much as we’d like to think of time as a constant to live our lives by, the way we record it is subjective.Natalie ZarrelliAtlas ObscuraSave The Family That Always Lives on Daylight Saving TimeA new bill proposes making daylight saving time permanent. But for one family, it already is.Olga KhazanThe AtlanticSave"
