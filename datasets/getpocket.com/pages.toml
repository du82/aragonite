["https://getpocket.com/collections/why-cant-we-give-up-the-notion-of-the-ideal-body"]
title = "Why Can’t We Give up the Notion of the Ideal Body?"
description = "Conversations on body image and beauty are more complex than ever. Why is it still so hard to talk about body inclusivity?"
full_description = "On Recognizing My Thin Privilege When I’ve Never Been Thin“In her column ‘Learning Curve,’ my colleague Nicola Dall’Asen breaks down the ‘complicated experience of accepting your own body in a world that doesn’t seem to want you to.’ In this edition, she explores a subject that’s under-discussed, even within body-positive and fat-acceptance circles, and asks midsize and small-fat readers (and everyone else) to consider the intricacies and exponential impact of anti-fat discrimination on larger-bodied folks.” - Sam EscobarNicola Dall'AsenAllureSave The Treatment of Hyperpigmentation Sure Feels a Lot Like FatphobiaSE: “Fatphobia and racism aren’t merely connected, they’re tightly intertwined. In a guest column for Allure, content creator and educator Gloria Lucas examines the underlying social constructs—purity culture, for instance—that so often have a deeply detrimental impact on larger-bodied Black people with hyperpigmentation, a very common skin condition that, as Lucas notes, ‘rarely indicates a health concern.’”Gloria LucasAllureSave Where Are All the Fat People In Beauty?SE: “A simple yet poignant question, and one that is rarely addressed. As writer Nicola Dall'Asen notes, ‘A person's size has never dictated whether or not they can wear an eye shadow, body lotion, or hair spray. Why aren’t ads more reflective of that?’”Nicola Dall'AsenAllureSave Ozempic Settles the Obesity Debate: It’s Biology Over WillpowerSE: “Treatments like Ozempic are complicated, but this piece from the Wall Street Journal broke its methodology down in a clear way while making a strong argument for what the advent of these drugs actually means for science, our health, and how we understand obesity and weight as a culture.”Betsy McKayThe Wall Street JournalSave “Eating Disorders Are for White Girls.”SE: “It was summer 2021 when I first read this piece by historian Angela Tate, originally published on journalist Anne Helen Petersen’s wonderful Culture Study newsletter. After a long, terribly sad winter, we poked our collective heads out only to see people’s body image and disordered eating habits were worse than ever. But for those who do not fit the stereotypical image of an eating-disorder patient—young, white, underweight—it can be even more difficult to find relief and seek treatment. (Can you think of any movie where a non-white character has an eating disorder?)”Anne Helen PetersenCulture StudySave"
