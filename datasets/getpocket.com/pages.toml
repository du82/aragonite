["https://getpocket.com/explore/item/kitchn-100-potatoes-recipes-23420738"]
title = "7 Irresistible Potato Recipes You Need to Try"
description = "Credit: Photo: Joe Lingeman; Food Styling: Cyd McDowell"
full_description = "* { box-sizing: border-box; } body {margin: 0;}*{box-sizing:border-box;}body{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;} Credit: Photo: Joe Lingeman; Food Styling: Cyd McDowellThe icon, the legend, the super spud. Why yes, we did give potatoes their own category as part of Kitchn 100, our collection of the hundred recipes you need right now. The decision was met with very little hesitation because, quite frankly, potatoes rock. Over the years, Kitchn has shared well over onethousand recipes that showcase virtually every which way potatoes can be stretched for ultimate deliciousness — smashed, mashed, fried, puffed, pancaked, and more. If you’re seeking new inspiration in the starch department, these are seven of the best potato recipes to get you on your way. Shilpa UskokovicThe Air Fryer Potatoes | Old Bay Air Fryer Potato WedgesThe air fryer gets thick-cut potato wedges evenly golden-brown and crispy on the outside (the oven could never!) and fluffy on the inside. Ketchup is totally acceptable, but might we suggest sour cream and chives or chipotle mayo instead? Ivy ManningThe Roasted Potatoes | Greek Lemon PotatoesSenior Contributing Food Editor Sheela Prakash has made these lemony, melt-in-your-mouth potatoes at least a dozen times. They're that good. If you don't have yellow mustard (the surprise ingredient), do as Sheela does and swap in Dijon. Photo: Joe Lingeman; Food Styling:Cyd McDowellThe Potato Salad | French-Inspired Potato SaladIn this salad Niçoise-inspired potato salad, we've replaced the mayo with two types of tangy mustard, a shocking amount of herbs, and just the right amount of ooh là là. Joe LingemanThe Sweet Potatoes | Butter-Roasted Sweet PotatoesThis technique for butter-roasted sweet potatoes (aka melting sweet potatoes) was popularized years ago by the blog Dessert for Two — and we're still obsessed. The butter caramelizes the exterior of the thick, sweet potato coins, while the insides remain ridiculously soft and buttery. Perry SantanachoteThe Potato Casserole | Grandma Grace's Cheesy PotatoesGrandma Grace’s cheesy potatoes is one of our most popular recipes from 2022 — further proof that grandmas really are the best cooks. Big chunks of potatoes are bathed in a rich cheese sauce, then baked with Ritz cracker crumbs on top. It's a crowd-pleaser and a must-make dish for any get-together. Photo: Chris Simpson; Food Styling: Pearl Jones; Prop Styling: Paige HicksThe Stovetop Potatoes | Shweta in the Kitchen's Batata BhajiThis is the flavorful comfort food Executive Editor, Adriana Velez's, Bombay-born husband grew up eating daily. Cubed potatoes are tossed into a pan of sizzling, popping mustard seeds with fresh garlic and ginger and spices. Serve alongside dal with chapati or paratha for the full carby experience. Photo: Joe Lingeman; Food Styling: Cyd McDowellThe Smashed Potatoes | Hot Honey Smashed PotatoesWe've yet to meet a smashed potato we didn't like, but this version is extra special. The squished spuds are topped with a combo of melted butter, honey, hot sauce, and red pepper flakes for a sweet, spicy, savory side that goes with just about everything."
