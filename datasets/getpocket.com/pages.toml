full_description = "Vegetation“I came to this story over Thanksgiving weekend and immediately was drawn in by the writing. It’s a gripping subject—what it’s like to have open heart surgery—but also the story is told in an incredibly gripping way. It’s not my usual fare, but it’s hands down the piece I’ve read this year that’s left me thinking, and feeling, most. It’s raw and personal with a lot of unexpected twists and turns, and really leaves so much space for meditation.” - Emily StewartEvan Grillondirt.fyiSave I Went on a Package Trip for Millennials Who Travel Alone. Help Me.Matt Reynolds: “This piece is sheer joy. Not just because Caity Weaver is so damn funny—we all know that already—but because it introduced me to something I find almost impossible to comprehend: People who approach friend-making with the kind of relentless zeal usually reserved for competitive sports. This is not my idea of a holiday, but I’m so glad Caity was there to show us how time-poor, ultra-high-achieving millennials like to spend their downtime.” Caity WeaverThe New York TimesSave The Case for MediocrityAngela Haupt: “I’ve returned to this piece again and again since my colleague Jamie Ducharme published it in September. As a recovering overachiever, it spoke to me in a very personal way. I’ve shared it with many friends in a similiar boat, and it’s helped us all remember what really matters. It’s a great perspective-shifter on how and why embracing mediocrity can make us happier and healthier.” Josie NortonTimeSave 21 Life-Changing Trips Everyone Should Experience at Least OnceAndrew Sofin: “In a year with so much troubling news, from wars to natural disasters, this article was an absolute breath of fresh air. You cannot help but smile and daydream about these trips. Share it with your friends and family and see what they pick as their top three. It really says a lot about who you are. If I win the lottery, I will take my family to all the places, starting with Greece!” Elizabeth RhodesTravel + LeisureSave"
