["https://getpocket.com/collections/the-great-ai-backlash-is-here"]
title = "The Great AI Backlash Is Here"
description = "As the generative AI boom continues, WIRED is tracking the fight to make sure humans aren’t left behind."
full_description = "Meet the Lawyer Leading the Human Resistance Against AI“I flew to San Francisco this fall to meet the man behind the first wave of class action lawsuits against generative AI companies on behalf of artists, writers, and programmers. Matthew Butterick is one of the leaders of this “human resistance,” and an important figure to know. (It’s completely unclear whether he’ll win his cases, of course!)” - Kate KnibbsKate KnibbsWIREDSave The Andy Warhol Copyright Case That Could Transform Generative AIKK: “Last spring, Madeleine Ashby wrote this terrific explainer for WIRED about how a Supreme Court case about Andy Warhol’s art—one which has nothing to do on the surface with artificial intelligence—might be crucial to future fights over AI and ownership.”Madeline AshbyWIREDSave Algorithms Can Now Mimic Any Artist. Some Artists Hate ItKK: “My colleague Will Knight has been covering AI for years, and this story from 2022 is one of the best early reports on the brewing backlash.”Will KnightWIREDSave Why the Great AI Backlash Came for a Tiny Startup You’ve Probably Never Heard OfKK: “I started reporting this story after I saw writers I admire complaining about a startup I’d never heard of stealing their work on social media. I ended up spending over a week interviewing people, including the owner of the controversial startup, and realizing that this was a minor conflict with major implications. It was the first time I really understood the battle lines being drawn.”Kate KnibbsWIREDSave Revealed: The Authors Whose Pirated Books Are Powering Generative AIKK: “This fantastic scoop by The Atlantic’s Alex Reisner revealed the contents of one of the most popular datasets used to train large language models, known as Books3. Tons of incredibly popular writers, like Stephen King and Margaret Atwood, are in the collection.”Alex ReisnerThe AtlanticSave The Battle Over Books3 Could Change AI ForeverKK: “ I dug into the creation of Books3, and the fight to stop AI companies from using its pilfered dataset. It was wild to see how far apart some of my sources were on the ethics of web scraping. Books3 creator Shawn Presser, who I interviewed at length, really believes he’s doing a service to the scientific community. His critics think he’s helping to kill writing as we know it.”Kate KnibbsWIREDSave"
