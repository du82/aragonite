["https://getpocket.com/collections/the-verdicts-inbut-what-happens-when-a-juror-changes-their-mind"]
title = "The Verdict’s in—but What Happens When a Juror Changes Their Mind?"
description = "Uncovering the stories of remorseful jurors—and what it takes for them to take action."
full_description = "The Juror Who Found Herself Guilty“This definitive telling of Ybarra and Jaile’s story by Texas Monthly writer Michael Hall maps both subjects’ lives before their paths crossed and the difficult decades that followed Jaile’s guilty verdict. Especially interesting, it also lays out who Ybarra called in 2017 when she resolved to do something about her 1990 decision, and which parties helped to make things right. It’s a long read, but it’s worth making it to the end for a poignant reunion between Ybarra and Jaile.” -Amanda O’DonnellMichael HallTexas MonthlySave The Story: the Juror Who Found Herself GuiltyAD: “This short 2008 entry from the American Psychological Association delves briefly into the topic of unfair convictions as the result of pressures placed on members of a jury, and is not without a fitting 12 Angry Men reference, saying, ‘in reality, individuals who are tired and under social and time pressures are much more likely to lose willpower and give in.’ This entry stresses the importance of studying the effect pressure has on verdicts and urges jurisdictions to consider the issue when enacting jury reforms.”Texas MonthlyYouTubeSave A Mind Is a Terrible Thing to ChangeAD: “This 2020 writeup for Plaintiff Magazine coaches lawyers on the importance of opening statements, claiming some 80 percent of jurors make up their minds after hearing a lawyer’s introductory statement. Something this article makes clear is how difficult it can be to sway a juror once a pivotal moment during a trial has led them to lean one way or another. Ybarra said that during deliberation, the pushier jurors repeatedly referenced a dramatic moment in Jaile’s trial when the victim took the stand and pointed to him in the courtroom, alleging he was her rapist—this was despite a lack of evidence that tied Jaile to the crime and three alibi witnesses saying he was elsewhere the day of the incident. Ybarra, who remained preoccupied with and unimpressed by the evidence against Jaile throughout his case, was facing a difficult time standing her ground during deliberations.”Plaintiff MagazineSave"
author = "Amanda O’Donnell"
