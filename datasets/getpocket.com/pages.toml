full_description = "From Yaps to Howls: What Your Dog’s Bark Means—and How to Get Them to Tone It DownWith the rise in dog ownership has come a rise in doggy noise. Could interpreting their growls and yelps make life more harmonious? And how do you stop them barking at delivery drivers?Jules HowardThe GuardianSave Why Do Dogs Tilt Their Head to the Side?The attentive and endearing doggy head tilt might indicate your pup is trying to process what you’re sayingStephanie PappasScientific AmericanSave Is Your Dog Lying to Other Dogs About Its Size?Study of urine markings suggests small dogs pretend to be bigger than they are.Elizabeth PrestonScienceSave Can Dogs Smell Time? Just Ask Donut the Dog.After decades of wondering, an NPR reporter finally figures out how her husband's family dog knew when the school bus would arrive every day. She did some digging — and now it all makes scents.Michaeleen DoucleffNPRSave What Makes Dogs So Special and Successful? Love.After searching for dogs' intelligence, a top canine scientist concluded that their true gift is affection.Karin BrulliardThe Washington PostSave What Do Dogs Know About Us?Man’s best friend is surprisingly skilled at getting inside your head.Alexandra HorowitzThe AtlanticSave Is That Dog Talking or Are We Fooling Ourselves?The internet is filled with footage of pets pressing buttons to ask for food and ponder the meaning of life, prompting serious scientific inquiry.Zoran BogdanovicVICESave Why Do Dogs Pant? 6 Common Reasons, According to Experts.Panting is a natural behavior, until it's not. So why do dogs pant? Experts share the common reasons and how to know when something is off.Lisa Marie ConklinReader's DigestSave Genetics Research Explains Why Dogs Are Very Good BoysDomesticated dogs and wolves have a genetic mutation that makes them friendly.Dan RobitzskiInverseSave What Does Your Dog Really Want?With MRI, scientists are beginning to answer that question in a much more sophisticated way.Gregory BernsScientific AmericanSave"
