["https://getpocket.com/collections/black-history-is-world-history"]
title = "Black History Is World History"
description = "Journey around the world and back in time as editor Aric Jenkins explores the sizable impact Black societies have made on ancient civilizations."
full_description = "In the Land of KushAric Jenkins: “Egypt is always held up as the quintessential African empire, but few are familiar with the region to the south of it. Nubia was home to the Kush Kingdom, which conquered Egypt in the eighth-century BC and gave rise to the Black Pharaohs that would rule for more than 100 years during the 25th dynasty of Egypt. This feature is a great deep dive into the cultural and architectural legacy of Nubian civilization.”Isma’il KushkushSmithsonian MagazineSave Malik Ambar: African King in the Heart of India [WATCH]AJ: “Did you know Black people have been living in India and Pakistan for well over a thousand years? The Siddis are a hugely overlooked demographic of the African diaspora, and this video from the always-excellent Kings and Generals explores one of the most legendary Siddis of all.”Kings and GeneralsYouTubeSave Taking a Magnifying Glass to the Brown Faces in Medieval ArtAJ: “I used to be a little surprised when seeing Black and brown people depicted in medieval art. But this enlightening 2013 conversation hosted by NPR’s Gene Demby helped change that perception. Together with Malisha Dewalt, founder of popular Tumblr blog “People of Color in European Art History,” and two art historians, the interview sheds light on why people of color’s placement in Middle Age art is less strange than you might’ve imagined.”Gene DembyNPRSave 4.01- Saint-Domingue [LISTEN]AJ: “Switching over to the other hemisphere of the globe, we can’t talk about Black history without acknowledging the achievements of Toussaint Louverture and the Haitian people. This is the only slave rebellion ever to successfully result in a new state ruled by former captives. History enthusiasts might know Mike Duncan from his comprehensive History of Rome podcast, but in his other series, Revolutions, he dedicates a whole season to breaking down the collapse of France’s Saint-Domingue colony. Here’s the first episode to start.”RevolutionsSpotifySave"
