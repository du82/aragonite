["https://getweflow.com/customer/zeotap-weflow-case"]
title = "Weflow | Zeotap Case Study"
full_description = "Zeotap is a customer data platform that helps brands improve commercial outcomes across marketing, sales, and customer services. Once Zeotap decided to try out Weflow, a group onboarding session was organized to help them get started. After learning how the tool works, the Zeotap team set up templates for different pipeline views to help with weekly sales meetings, pipeline inspections, and overall deal management. Using Salesforce as their CRM of choice, Zeotap’s sales team ran into a few challenges. Firstly, they realized that Salesforce wasn’t very flexible when it came to allowing sales managers to find the information they needed on specific deals and opportunities, which was making pipeline review very difficult. The sales leadership was also finding it hard to get account executives to update opportunities consistently. This is a common problem that not only Zeotap faces. According to Salesforce, 70% of data in your CRM goes bad every year. Pipeline and opportunity data quality was a key challenge. AEs would either update opportunities partially or would update some opportunities while ignoring others. Basic information on opportunities, such as next steps and close dates, wasn’t being updated. In addition to the next steps and the close date, Zeotap wanted AEs to populate an ICP scorecard to improve discovery and qualification. Doing opportunity and pipeline reviews was based on poor pipeline hygiene, and they were missing leading indicators like stage duration, last activity, and multi-threading to understand the health of the pipeline. Even though Zeotap runs a tight weekly, monthly, and quarterly cadence, poor CRM data quality and bad pipeline reviews meant their sales forecasts were never accurate. This problem was made worse by the increase in team size and the number of deals that needed to be tracked, as well as by people leaving the company occasionally and taking their knowledge of specific deals with them. Once Zeotap decided to try out Weflow, a group onboarding session was organized to help them get started."
