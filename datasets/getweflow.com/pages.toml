["https://www.getweflow.com/privacy-policy"]
title = "Privacy Policy"
full_description = "Privacy PolicyEffective Date: February 14, 2024We, Weflow GmbH, are aware of the importance to users of how personal data are handled, and we will observe all relevant legal requirements. We consider the protection of your privacy to be of paramount importance. For this reason, compliance with the legal requirements on data privacy is, for us, a matter of course.Contact‍Weflow GmbHOranienburger Str. 1 - 310178 BerlinGermanyEmail: privacy@getweflow.com‍‍‍1. ScopeWeflow GmbH (“Weflow,” “we,” “us,” or “our”) is committed to protecting your privacy. This Privacy Policy informs you how we collect, use, secure and share your personal information collected by us when you visit our websites (“Website”), when you visit our social media pages, when you visit our office, when you receive communication from us, when you register or attend our events or webinars, or when you ask questions about our products “Interactions”).Please note that our Websites may include links to other organizations’ websites whose privacy practices may differ from those of Weflow. If you submit information to those sites, your information is governed by their privacy policies. Carefully read the privacy policies of any website you visit.If you are a Weflow customer that uses the Weflow platform, please review our Platform Privacy Policy in addition to this Privacy Policy.‍2. Personal information we collect‍Except as described in this Privacy Policy, Weflow will not sell, give, rent, or loan to any third party any of the personal information you provide us. Personal information is generally any information that identifies you or makes you identifiable such as your name, IP address, or user preferences. We may collect, store, and use the following kinds of personal information from you in relation to the Websites and Interactions:‍a.) Information that you voluntarily provide‍We collect personal information when you voluntarily provide it to us (including to our service providers or other parties who collect it on our behalf). For example, we collect personal information when you request information about th Weflow services or products, submit a job application for employment, subscribe to our marketing communications, or register for a Weflow event (offline or online), or webinar.b.) Information about transactions with us‍We collect information about any transactions carried out between you and us on or in relation to this website, including information relating to any purchases you make of our services, including your first and last name, title, position, employer, employer address, VAT ID, and information to contact you.‍c.) Information from offline events‍We may also collect personal information from you offline, such as when you attend an event that we organize, or during a phone call with one of our representatives. The personal information we collect may include contact information (such as your name, address, telephone number or email address), professional information (such as your job title, department or job role), and your preferences for being contacted.d.) Information we collect automatically(1) Log Data‍When you use our Websites, we may automatically record information from your device, its software, and your activity using the Websites (“Log Data”). This may include such information as the device’s Internet Protocol (“IP”) address, browser type, the web page visited before you came to our website, information you search for on our website, length of visit and number of page views, locale preferences, identification numbers associated with your devices, your mobile carrier, date and time stamps associated with transactions, and system configuration information.(2) GeoLocation Data‍We may collect geolocation and proximity of your device if location services are enabled on your device (e.g., GPS on a mobile device used to access our website), and may use that information to customize the interactions with location-based information and features. If you access our website through a mobile device and you do not want your device to provide us with location-tracking information, you can disable the GPS and/or other location-tracking functions on your device, provided your device allows you to do this.(3) Cookies‍We use “cookies” to collect information and improve our interactions with you. A cookie is a small data file that is transferred to your device. We may use “persistent cookies” to save your registration ID and login password for future logins to our website, such as, to register for webinars. We may use “session ID cookies” to enable certain features of the Websites, to better understand how your interactions with us and to monitor aggregate usage and web traffic routing on our website. For more information on how we use Cookies and similar technologies, please see our Cookie Policy,(4) Third Party Data‍We may collect personal information from third party sources. You may choose to register events sponsored by our partners where we will share your information with our marketing partners. To engage in marketing activities, we may collect personal information disclosed by you on message boards, chat features, blogs and other services or platforms to which you are able to post information and materials (including third-party services and platforms). We process such information to better understand you, to maintain and improve the accuracy of the information we store about you, and to better promote or optimize our communications with you, including providing information about our services and products.If you choose to limit our collection or use of your personal information or choose not to provide certain personal information, some or all of our services, programs, or events may not be available to you, and we may not be able to respond to your requests.‍3. Why we collect personal information‍In general, we use personal information to create, develop, operate, deliver, and improve our Websites and be able to offer our services and products. We may use your personal information to:‍a.) Respond to Requests‍We may process your personal information when you contact us, such as with questions, concerns and feedback. We share this information with third parties upon your request, or with our service providers or partners to the extent necessary to provide you a response. [Performance of Contract, Legitimate Interest, Consent]‍b.) Facilitate and Evaluate Use of the Services‍We may use your personal information to provide you with the online services, to facilitate your use of the online services (such as facilitating navigation and the login process, preserving information between sessions and enhancing security), to improve quality, to evaluate page response rates and determine content. [Performance of Contract, Legitimate Interest]‍c.) Improve the Accuracy of our Records‍We may use the personal information we receive from you or third parties to better understand you and/or maintain and improve the accuracy of the records we hold about you. [Legitimate Interest, Consent]‍d.) Personalize your Experience‍We also may use cookies and similar tracking technology to personalize your experience – please see our Cookie Policy for more information. By personalizing our communications, we enable you to more easily use our website because we keep track of your preferences (e.g. your language selection, your time zone, etc.). [Performance of Contract, Legitimate Interest, Consent]‍e.) Ensure the Security of the Websites and Interactions‍We may process your personal information to help monitor, prevent and detect fraud, enhance security, and combat spam, malware, malicious activities or security risks; improve and enforce our security measures; and to monitor the security of our website [Performance of Contract, Legitimate Interest].f.) Marketing‍We may use information we obtain from you, your interactions with Weflow and our website, and from third party sources to provide you with marketing and promotional communications, to deliver targeted and relevant advertising and marketing to you, to determine the effectiveness of our marketing and promotional campaigns, to better understand you and your preferences, and to position and promote our services and products. Our marketing will be conducted in accordance with your advertising / marketing preferences and as permitted by applicable law. [Legitimate Interest, Consent]‍g.) Conferences and Events‍Weflow and our partners may use your personal information to communicate with you about our events or our partner events. After the event, Weflow may contact you about the event and related products and services and may share information about your attendance with our conference sponsors and partners, where legally permitted to do so. If a partner or conference sponsor directly requests your personal information at their conference booths or presentations, your personal information will be handled in accordance with their privacy practices. [Legitimate Interest, Consent]If you choose to limit our collection or use of your personal information, some or all of our services may not be available to you and we may not be able to respond to certain of your requests.If, in the future, we use your personal information in a way that is not described in this Privacy Policy, we will provide notice. Notice may be provided in accordance with Section 12 (Updates).‍4. Information we share‍We share your personal information only with third parties who have a legitimate purpose for accessing it. We will only share your information in the following circumstances:‍a.) Service Providers, Business Partners and Others‍We may share your personal information with third parties, such as vendors, consultants, agents and other service providers who work on our behalf. Examples include vendors and service providers who provide assistance with marketing, billing, processing credit card payments, data analysis and insight, technical support and customer service. We may also share your personal information with our event partners, including sponsors of events hosted or sponsored by us, provided that we will obtain your consent prior to such disclosure where required by law.b.) Compliance with Laws and Law Enforcement Requests; Protection of Our Rights‍We may disclose your personal information to third parties when we have a good faith belief that disclosure is reasonably necessary to: (i) comply with a law, regulation or legal requests including to meet national security or law enforcement requirements; (ii) protect the safety of any person from death or serious bodily injury; (iii) prevent fraud or abuse of Weflow or its user, or (iv) protect Weflow's property rights.‍c.) Business Transfers‍If we are involved in a merger, acquisition, or sale of all or a portion of our assets, your information may be transferred as part of that transaction, but we will notify you (for example, via email and/or a prominent notice on our website) of any change in control or use of your personal information, or if you become subject to a different Privacy Policy. We will also notify you of choices you may have regarding the information.d.) Affiliates‍We may share your personal information with our affiliates so that they can help provide or support our websites or services, service your account, or troubleshoot concerns or support other legitimate business operations.‍5. Security ‍We will take reasonable precautions to prevent the loss, misuse or alteration of your personal information. Data transmission over the Internet is inherently insecure and we cannot guarantee the security of data sent over the Internet.We will store all the personal information you provide on our secure servers. You are responsible for keeping your passwords confidential. We will not ask you for your passwords. We have procedures in place to ensure we can react to reasonably foreseeable issues. If you ever find a security issue, or simply have a security related concern, please reach out directly to us via email: privacy@getweflow.com.‍6. International transfers‍By submitting your personal information via this website or otherwise, your information will be transferred to us in the Germany. Germany may have data protection laws that are less protective than the laws of the jurisdiction in which you reside. If you do not want your personal information transferred to or processed or maintained in Germany, you should not use our Websites or should not engage in Interactions with us. If you are a citizen of or reside in the USA, the European Economic Area (“EEA”), the United Kingdom (“UK”), or Switzerland, we comply with applicable laws to provide an adequate level of data protection for the transfer of your personal information to third countries. For more information, see Section 11 (Special Policy for Individuals in the EEA, UK, and Switzerland).‍‍7. Retention‍We retain your personal information for as long as is necessary to fulfill the purposes for which it was collected, including for the purposes of satisfying any legal, regulatory, accounting, or reporting requirements, or to resolve disputes. Consistent with these requirements, we will look to delete your personal information within the time limits imposed by applicable law, if any, upon request.‍‍‍8. Accessing or updating personal information‍We depend on you to update and correct personal information to the extent necessary for the purposes for which the information was collected or subsequently authorized by you. You may contact Weflow as indicated below to request that we update or correct relevant personal information that is demonstrated to be inaccurate or incomplete, except where the burden or expense of providing access would be disproportionate to the risks to the privacy of the individual in the case in question or where the rights of persons other than the individual would be violated. We may seek to verify your identity when we receive your privacy rights request to ensure the security of your personal information.‍9. Children‍Our Websites and Interactions are not directed to people under the age 18, and we do not knowingly collect personal information from children under the age 18. If a parent or guardian becomes aware that their child has provided us with personal information without their consent, they should contact us at privacy@getweflow.com. If we become aware that a child under 18 has provided us with personal information, we will take steps to delete such information from our files.‍10. Special policy for individuals in certain states within the US‍This section supplements the other information included in this Policy and applies solely to individuals who reside in the United States and who qualify as a “consumer” as such term is defined by the state law applicable to such individual.‍California Residents (CCPA)‍This section applies only to California residents and the terms used have the same meaning as set"
