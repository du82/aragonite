["https://getweflow.com/customer/blockaid-weflow-case"]
title = "Weflow | Blockaid Case Study"
full_description = "Blockaid is a cybersecurity company that prevents malicious transactions, protecting Web3 users from scams, phishing, and hacks. Blockaid faced multiple challenges that severely impacted their Salesforce data hygiene and visibility into opportunities. Additionally, activities like emails and meetings were not permanently stored in Salesforce, leading to two fundamental problems: 2) Blockaid needs a complete and reliable storage of account, contact, and opportunity activity history to ensure any new joiners quickly understand the full context of an account. Alex Knechtl, Director of Revenue Operations at Blockaid, quickly faced EAC’s limits when he started looking for a solution that answers seemingly simple questions: Blockaid experienced severe ripple effects from the lack of reliable and reportable activity data, directly impacting team performance monitoring, pipeline hygiene, and visibility. The lack of activity data on the opportunity level implied that managers relied on 1-1s and hearsay instead of conducting data-driven deal inspections. Is the deal multithreaded?Is a next meeting scheduled?What is the deal velocity like?When was the last touchpoint?Which buyer & contact roles are involved?Do prospects reply promptly (or at all) to the reps’ emails? Consequently, assessing pipeline health in a data-driven way was nearly impossible for revenue operations. The VP of Sales and Founders lacked reliable data to understand how the team was performing in aggregate and relied on anecdotes and intuition, leading to misdirected attention. Even if they had the right data, Blockaid would not have the visibility into pipeline changes and at-risk opportunities: native Salesforce kanban boards and reports weren’t enough to surface critical signals, warnings, or insights about which deals were at risk and why. Additionally, the inability to configure warnings in Salesforce has made it harder to identify deals at risk. Moreover, the entire GTM team frequently requested RevOps’ support just to filter views or pull reports."
