["https://getweflow.com/customer/blacklane-weflow-case"]
title = "Weflow | Blacklane Case Study"
full_description = "Previously named the fastest-growing tech company in Germany, Blacklane connects people to local professional chauffeurs worldwide. At first, Blacklane’s sales team manually logged emails and meetings from Google Workspace, leaving around 20% of activities unrecorded. Blacklane decided to roll out Einstein Activity Capture but struggled with the data not being permanently stored, not reportable, and missing custom logging rules: It became clear that Blacklane needed a solution that reliably captures data and allows for Salesforce’s standard reporting. Without full visibility into activities, Blacklane couldn’t properly analyze sales efforts by account or rep. Reporting on sales efficiency, such as tracking the number of emails sent by each rep, was challenging. Making things worse, the further use of EAC would mean that more and more activity data won’t be permanently stored in their own CRM - virtually locking in Blacklane on EAC. Adding to the complexity, Blacklane stored both B2C and B2B contacts in Salesforce and needed to ensure that only B2B activities were logged. Different teams — such as sales and account management — had specific logging requirements, adding further requirements to the set-up that EAC didn’t provide. Prior to kicking things off, Weflow advised Blacklane to create a list of requirements. Together, the two companies devised a structured plan for solving Blacklane’s activity capture problems. With annual audits from Google and PwC, Weflow’s SOC 2 - Type II certification, and regular third-party pen tests in place, the legal process was ticked off quickly. Weflow Activity Capture is extremely easy to implement - and while we can claim a lot, we walked the talk. After a 30-minute session, Weflow’s easy, low-lift technical implementation was virtually done, and Blacklane’s team was on board. Given that Weflow has seen hundreds of activity capture set-ups, Blacklane used Weflow’s best practices to create a robust setup. Blacklane opted to automatically sync emails and meetings in the background. This way, Weflow auto-attributes activities to leads, contacts, opportunities, and accounts."
year_published = 2025
