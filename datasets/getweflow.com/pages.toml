unding Partner at Cherry VenturesSascha KonietzkeFounder at ContentfulAlex & EricFounder at SoundcloudAndreas BodczekCEO at IDNowRodrigo Martinez‍Partner at helloworld.vcPhilipp MoehringPartner at Tiny.VCJoin usWe're looking for passionate people who want to build a culture that lasts. We value flat hierarchies, cross-functional teams, clear communication, and full ownership and responsibility.Current open roles:"
