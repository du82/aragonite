["https://getweflow.com/blog/bottom-up-forecasting"]
title = "Bottom-up Forecasting in B2B Sales Companies: A Comprehensive Guide"
description = "Learn how to set up bottom-up forecasting in your revenue organization from scratch"
full_description = "Bottom-up forecasting is a forecasting method that starts from the individual contributor level (e.g. Account Executives, Sales Reps) and works its way up toward the top of the organization (CRO, CSO, CFO, CEO). With this approach, it’s critical to break the organization’s total sales goals into smaller individual target units and then to do a forecast for each of these units. These individual forecasts are then vetted and combined by the leadership team. In top-down forecasting, one looks at the broader market dynamics with an emphasis on the competitive landscape to forecast the market share and subsequently, the revenue a company can potentially achieve. In addition, the top-down approach is based on the sales capacity, meaning it looks at the total number of reps, their quota, and their quota attainment. Advanced organizations also include factors such as historical performance, marketing & sales budgets, and capacities in production and facilitation. The key difference between the two is that with bottoms-up forecasting, the individual sales reps get a voice in the forecasting process. More often than not, top-down forecasts are also heavily influenced by board meetings. This often leads to situations where the company’s leadership team presents a final number, but the board challenges them to go higher. Which in turn can lead to a less accurate forecast and a lose-lose situation for all. No. There is a time for top-down forecasting and there is a time for bottom-up forecasting. If a company is relatively young, possibly not fully at product-market fit or in a high growth stage, then doing bottom-up forecasting is sometimes just not possible or sensible. In these situations, making forecasts that follow a top-down approach is still better than doing no forecasting at all. It’s also true, that most modern sales organizations use hybrid models that factor in a multitude of variables to achieve the highest possible accuracy. However, if the company is somewhat mature, then a strict top-down approach is unlikely to achieve accurate results and may cause budget issues that will affect the entire company. The main reason why top-down forecasts are still applied is that a) there is a high urgency without time to implement a top-down approach, and b) the organization lacks the metrics and data to pursue a bottom-up approach."
author = "Philipp"
year_published = 2025
