["https://www.getzola.org/documentation/deployment/zeabur"]
title = "Zeabur | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = '''Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Zeabur In this tutorial, we'll guide you through the process of deploying your Zola site onto the Zeabur. Zeabur provides a seamless deployment experience, with automatic SSL certificates and global-edge network delivery. Let's get started! 🔗Prerequisites A Zola site project on your local machine. A GitHub account and your Zola site project repository hosted on GitHub. A Zeabur account. If you don't have one, sign up at here. 🔗Step 1: Create a Project on Zeabur Log in to your Zeabur account. Navigate to the dashboard and click on the Create Project button. Follow the on-screen instructions to set up a new project. 🔗Step 2: Push Your Zola Files to GitHub Initialize a Git repository in your Zola project folder if you haven't already: git init git add . git commit -m "Initial commit" Push your Zola project to GitHub: git remote add origin <your-github-repo-url> git branch -M main git push -u origin main Replace <your-github-repo-url> with the URL of your GitHub repository. 🔗Step 3: Create a Service on Zeabur Back in your Zeabur dashboard, click on Create Service. Choose the git option to connect your GitHub repository. 🔗Step 4: Select Your Zola Repository From the list of repositories, select the repository where your Zola project is located. 🔗Step 5: Automatic Deployment Zeabur will automatically detect that you're deploying a Zola project and will handle the deployment process for you without any additional configuration needed. To use a specific version of Zola, set ZOLA_VERSION environment variable in project settings to a valid release tag, for example 0.17.2. 🔗Step 6: Domain Binding Once the deployment is complete, bind a domain name to your service. You can choose to use a free .zeabur.app subdomain or bind your own custom domain. Zeabur will automatically provide a free SSL certificate for your domain, ensuring secure browsing for your visitors. 🔗Step 7: Your Site is Live! Congratulations! Your Zola site is now deployed and live, served through Zeabur's edge network. You can now visit your website at the domain you've set up.'''
