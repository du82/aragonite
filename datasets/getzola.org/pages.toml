["https://www.getzola.org/documentation/templates/sitemap"]
title = "Sitemap | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = "Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Sitemap Zola will look for a sitemap.xml file in the templates directory or use the built-in one. If your site has more than 30 000 pages, it will automatically split the links into multiple sitemaps, as recommended by Google: All formats limit a single sitemap to 50MB (uncompressed) and 50,000 URLs. If you have a larger file or more URLs, you will have to break your list into multiple sitemaps. You can optionally create a sitemap index file (a file that points to a list of sitemaps) and submit that single index file to Google. In such a case, Zola will use a template called split_sitemap_index.xml to render the index sitemap. The sitemap.xml template gets a single variable: entries: all pages of the site, as a list of SitemapEntry A SitemapEntry has the following fields: permalink: String; updated: String?; extra: Hashmap<String, Any>?; The split_sitemap_index.xml also gets a single variable: sitemaps: a list of permalinks to the sitemaps"
