["https://www.getzola.org/documentation/themes/overview"]
title = "Overview | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = "Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Overview Themes are collections of layouts and styles used to facilitate the creation and management of Zola projects. As such, themes are Zola projects which provide their own templates, content and even static assets. Zola has built-in support for themes which makes it easy to customise and update them. All themes can use the full power of Zola, from shortcodes to Sass compilation. A list of themes is available here."
author = "Vincent Prouillet"
