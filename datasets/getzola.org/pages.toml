full_description = '''Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Archive Zola doesn't have a built-in way to display an archive page (a page showing all post titles ordered by year). However, this can be accomplished directly in the templates: {% for year, posts in section.pages | group_by(attribute="year") %} <h2>{{ year }}</h2> <ul> {% for post in posts %} <li><a href="{{ post.permalink }}">{{ post.title }}</a></li> {% endfor %} </ul> {% endfor %} This snippet assumes that posts are sorted by date and that you want to display the archive in descending order. If you want to show articles in ascending order, you need to further process the list of pages: {% set posts_by_year = section.pages | group_by(attribute="year") %} {% set_global years = [] %} {% for year, ignored in posts_by_year %} {% set_global years = years | concat(with=year) %} {% endfor %} {% for year in years | reverse %} {% set posts = posts_by_year[year] %} {# (same as the previous snippet) #} {% endfor %}'''
