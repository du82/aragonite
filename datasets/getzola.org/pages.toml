full_description = '''Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Docker image If you have to distribute a Zola based web site through Docker, it's easy to do with a multi-stage build. Here is an example that builds the current folder, and put the result in a docker image that will be served by static-web-server, a minimalist web server written in rust. Of course, you may want to replace the second stage with another static web server like Nginx or Apache. FROM ghcr.io/getzola/zola:v0.17.1 as zola COPY . /project WORKDIR /project RUN ["zola", "build"] FROM ghcr.io/static-web-server/static-web-server:2 WORKDIR / COPY --from=zola /project/public /public To build your website as a docker image, you then run: docker build -t my_website:latest . To test your site, just run the docker image and browse http://localhost:8000 docker run --rm -p 8000:80 my_website:latest Note that, if you want to be able to use your docker image from multiple locations, you'll have to set base_url to /.'''
