["https://www.getzola.org/documentation/deployment/cloudflare-pages"]
title = "Cloudflare Pages | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = '''Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Cloudflare Pages Cloudflare is a cloud solutions provider with a huge proprietary content delivery network (CDN). Like Netlify or Vercel, Cloudflare Pages makes the deployment process flexible and easy. You can add a GitHub repo to the service and build & host Zola-based websites after each PR automatically. 🔗Step-by-step Sign in or create a new Cloudflare account and choose "Pages" on the right nav column Press the button "Create a project" Select the GitHub repo that contains your Zola website and connect it to Cloudflare Pages Click "Begin setup" Enter your project name. Keep in mind that if you would like to use the default Pages domain (pages.dev), this will be your website's future URL ("yourprojectname.pages.dev"). Additionally, select a production branch. In Build settings, select Zola as the Framework preset. Build command and Build output directory will be filled automatically. Toggle Environment variables below and add ZOLA_VERSION as a variable name. Use 0.17.2 or a different Zola version as the value. Finally, save and deploy. Your website is now built and deployed to Cloudflare's network! You can add a custom domain or modify settings in the Pages dashboard. You may find documentation and guides like Getting started with Cloudflare Pages and Deploying Zola with Cloudflare Pages in the Developers portal. 🔗Troubleshooting Some tips to help troubleshoot issues getting started with Cloudflare Pages. 🔗zola: not found If you see build output that resembles something like this: 23:03:54.609 > build 23:03:54.609 > zola build $BUILD_OPTS && npx tailwindcss -i ./public/input.css -o ./public/style.css -m 23:03:54.609 23:03:54.621 sh: 1: zola: not found 23:03:54.635 Failed: Error while executing user command. Exited with error code: 127 23:03:54.644 Failed: build command exited with code: 1 23:03:55.699 Failed: error occurred while running build command Then it might be due to an outstanding issue. There are currently two recommended workarounds: 🔗Change the build system version to v1 From within the workers & pages dash, go to the following: Settings > Builds & deployments > Build system version > Configure build system Then select v1 and save. 🔗Or use UNSTABLE_PRE_BUILD environment variable + asdf From within the workers & pages dash, do the following: Settings > Environment variables > Edit variables And add an environment variable UNSTABLE_PRE_BUILD, with the following value and save. asdf plugin add zola https://github.com/salasrod/asdf-zola && asdf install zola 0.18.0 && asdf global zola 0.18.0'''
author = "Vincent Prouillet"
year_published = 2025
clearnet = "https://www.getzola.org/documentation/deployment/cloudflare-pages"
