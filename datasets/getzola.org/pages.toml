full_description = 'Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Table of Contents Each page/section will automatically generate a table of contents for itself based on the headers generated with markdown. It is available in the template through the page.toc or section.toc variable. You can view the template variables documentation for information on its structure. Here is an example of using that field to render a two-level table of contents: {% if page.toc %} <ul> {% for h1 in page.toc %} <li> <a href="{{ h1.permalink | safe }}">{{ h1.title }}</a> {% if h1.children %} <ul> {% for h2 in h1.children %} <li> <a href="{{ h2.permalink | safe }}">{{ h2.title }}</a> </li> {% endfor %} </ul> {% endif %} </li> {% endfor %} </ul> {% endif %} While headers are neatly ordered in this example, it will work just as well with disjoint headers. Note that all existing HTML tags from the title will NOT be present in the table of contents to avoid various issues.'
author = "Vincent Prouillet"
