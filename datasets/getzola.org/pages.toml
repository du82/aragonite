["https://www.getzola.org/documentation/templates/robots"]
title = "Robots.txt | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = '''Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Robots.txt Zola will look for a robots.txt file in the templates directory or use the built-in one. Robots.txt is the simplest of all templates: it only gets config and the default is what most sites want: User-agent: * Disallow: Allow: / Sitemap: {{ get_url(path="sitemap.xml") }} The file can be extended & expanded like other templates using e.g. Tera's include tag: User-agent: * Disallow: Allow: / Sitemap: {{ get_url(path="sitemap.xml") }} {% include "path/to/other/robots.txt" %}'''
