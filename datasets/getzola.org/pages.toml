title = "Albatros | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = '''Albatros A feature rich theme originally made for Duniter website. Author: Hugo Trentesaux This theme requires Zola version 0.16.0 and above License: AGPL Homepage: https://git.42l.fr/HugoTrentesaux/Albatros Live Demo: https://albatros.coinduf.eu/ Last updated: 2024-06-19T13:57:05+02:00 Albatros theme for Zola This theme was made for Duniter website. It was then abstracted and turned into Albatros. Installation Add the theme as a git submodule: git submodule add --name albatros https://git.42l.fr/HugoTrentesaux/albatros.git themes/albatros and enable the theme in your config.toml theme = "albatros" Features It has a lot of feature that I could not find time to document yet. Most of the available customization is in theme.toml/extra section and sass/_albatros.sass file (e.g. for colors). See: https://duniter.fr/ https://duniter.org/ for reference. Landing pages You are encouraged to provide custom landing pages that you can write in template/custom. The theme will take care of the rest (pages organised as wiki with breadcrumb). Authors Each author must have a card in content/team folder. Support I'll provide support on demand on Zola forum by documenting the theme step by step.'''
