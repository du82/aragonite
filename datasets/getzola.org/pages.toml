["https://www.getzola.org/documentation/templates/taxonomies"]
title = "Taxonomies | Zola"
description = "Everything you need to make a static site engine in one binary."
full_description = "Getting Started Overview Installation CLI usage Directory structure Configuration Content Overview Section Page Shortcodes Internal links & deep linking Table of Contents Syntax Highlighting Taxonomies Search Sass Image processing Multilingual sites Templates Overview Sections and Pages Pagination Taxonomies Feeds Sitemap Robots.txt 404 error page Archive Themes Overview Installing & using themes Creating a theme Customizing a theme Deployment Overview Sourcehut Pages Netlify GitHub Pages GitLab Pages Codeberg Pages Edgio Vercel Zeabur Cloudflare Pages Fly.io AWS S3 Bucket Docker image Taxonomies Zola will look up the following, taxon-specific files in the templates directory: $TAXONOMY_NAME/single.html $TAXONOMY_NAME/list.html if they are not found, it will attempt to fall back on the following generic template files: taxonomy_single.html taxonomy_list.html The taxonomy templates are required only if at least one taxonomy exists with render set to true. First, TaxonomyTerm has the following fields: name: String; slug: String; path: String; permalink: String; pages: Array<Page>; page_count: Number; and TaxonomyConfig has the following fields: name: String, paginate_by: Number?; paginate_path: String?; feed: Bool; render: Bool; 🔗Taxonomy list (list.html) This template is never paginated and therefore gets the following variables in all cases. // The site config config: Config; // The data of the taxonomy, from the config taxonomy: TaxonomyConfig; // The current full permalink for that page current_url: String; // The current path for that page current_path: String; // All terms for that taxonomy terms: Array<TaxonomyTerm>; // The lang of the current page lang: String; 🔗Single term (single.html) // The site config config: Config; // The data of the taxonomy, from the config taxonomy: TaxonomyConfig; // The current full permalink for that page current_url: String; // The current path for that page current_path: String; // The current term being rendered term: TaxonomyTerm; // The lang of the current page lang: String; A paginated taxonomy term will also get a paginator variable; see the pagination page for more details."
