external-references = ["amazon.com", "clauswilke.com", "contributor-covenant.org", "dplyr.tidyverse.org", "forcats.tidyverse.org", "fred.stlouisfed.org", "ggplot2-book.org", "github.com", "groups.google.com", "karawoo.com", "learning.oreilly.com", "orcid.org", "r4ds.had.co.nz", "ragg.r-lib.org", "rdrr.io", "scales.r-lib.org", "tibble.tidyverse.org", "vctrs.r-lib.org", "wilkelab.org", "withr.r-lib.org"]

