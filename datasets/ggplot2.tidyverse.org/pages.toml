full_description = "Benchmark plot creation time. Broken down into construct, build, render and draw times. Source: R/bench.R benchplot.Rd Benchmark plot creation time. Broken down into construct, build, render and draw times. Usage benchplot(x) Arguments x code to create ggplot2 plot Examples benchplot(ggplot(mtcars, aes(mpg, wt)) + geom_point()) #> step user.self sys.self elapsed #> 1 construct 0.003 0 0.003 #> 2 build 0.022 0 0.022 #> 3 render 0.018 0 0.018 #> 4 draw 0.020 0 0.020 #> 5 TOTAL 0.063 0 0.063 benchplot(ggplot(mtcars, aes(mpg, wt)) + geom_point() + facet_grid(. ~ cyl)) #> step user.self sys.self elapsed #> 1 construct 0.003 0 0.003 #> 2 build 0.037 0 0.037 #> 3 render 0.042 0 0.042 #> 4 draw 0.034 0 0.034 #> 5 TOTAL 0.116 0 0.116 # With tidy eval: p <- expr(ggplot(mtcars, aes(mpg, wt)) + geom_point()) benchplot(!!p) #> step user.self sys.self elapsed #> 1 construct 0.002 0 0.003 #> 2 build 0.018 0 0.017 #> 3 render 0.018 0 0.018 #> 4 draw 0.020 0 0.020 #> 5 TOTAL 0.058 0 0.058"
