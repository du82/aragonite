full_description = '''Heatmap of 2d bin counts Source: R/geom-bin2d.R, R/stat-bin2d.R geom_bin_2d.Rd Divides the plane into rectangles, counts the number of cases in each rectangle, and then (by default) maps the number of cases to the rectangle's fill. This is a useful alternative to geom_point() in the presence of overplotting. Usage geom_bin_2d( mapping = NULL, data = NULL, stat = "bin2d", position = "identity", ..., na.rm = FALSE, show.legend = NA, inherit.aes = TRUE ) stat_bin_2d( mapping = NULL, data = NULL, geom = "tile", position = "identity", ..., bins = 30, binwidth = NULL, drop = TRUE, na.rm = FALSE, show.legend = NA, inherit.aes = TRUE ) Arguments mapping Set of aesthetic mappings created by aes(). If specified and inherit.aes = TRUE (the default), it is combined with the default mapping at the top level of the plot. You must supply mapping if there is no plot mapping. data The data to be displayed in this layer. There are three options: If NULL, the default, the data is inherited from the plot data as specified in the call to ggplot(). A data.frame, or other object, will override the plot data. All objects will be fortified to produce a data frame. See fortify() for which variables will be created. A function will be called with a single argument, the plot data. The return value must be a data.frame, and will be used as the layer data. A function can be created from a formula (e.g. ~ head(.x, 10)). position A position adjustment to use on the data for this layer. This can be used in various ways, including to prevent overplotting and improving the display. The position argument accepts the following:The result of calling a position function, such as position_jitter(). This method allows for passing extra arguments to the position. A string naming the position adjustment. To give the position as a string, strip the function name of the position_ prefix. For example, to use position_jitter(), give the position as "jitter". For more information and other ways to specify the position, see the layer position documentation. ... Other arguments passed on to layer()'s params argument. These arguments broadly fall into one of 4 categories below. Notably, further arguments to the position argument, or aesthetics that are required can not be passed through .... Unknown arguments that are not part of the 4 categories below are ignored.Static aesthetics that are not mapped to a scale, but are at a fixed value and apply to the layer as a whole. For example, colour = "red" or linewidth = 3. The geom's documentation has an Aesthetics section that lists the available options. The 'required' aesthetics cannot be passed on to the params. Please note that while passing unmapped aesthetics as vectors is technically possible, the order and required length is not guaranteed to be parallel to the input data. When constructing a layer using a stat_*() function, the ... argument can be used to pass on parameters to the geom part of the layer. An example of this is stat_density(geom = "area", outline.type = "both"). The geom's documentation lists which parameters it can accept. Inversely, when constructing a layer using a geom_*() function, the ... argument can be used to pass on parameters to the stat part of the layer. An example of this is geom_area(stat = "density", adjust = 0.5). The stat's documentation lists which parameters it can accept. The key_glyph argument of layer() may also be passed on through .... This can be one of the functions described as key glyphs, to change the display of the layer in the legend. na.rm If FALSE, the default, missing values are removed with a warning. If TRUE, missing values are silently removed. show.legend logical. Should this layer be included in the legends? NA, the default, includes if any aesthetics are mapped. FALSE never includes, and TRUE always includes. It can also be a named logical vector to finely select the aesthetics to display. inherit.aes If FALSE, overrides the default aesthetics, rather than combining with them. This is most useful for helper functions that define both data and aesthetics and shouldn't inherit behaviour from the default plot specification, e.g. borders(). geom, stat Use to override the default connection between geom_bin_2d() and stat_bin_2d(). For more information about overriding these connections, see how the stat and geom arguments work. bins numeric vector giving number of bins in both vertical and horizontal directions. Set to 30 by default. binwidth Numeric vector giving bin width in both vertical and horizontal directions. Overrides bins if both set. drop if TRUE removes all cells with 0 counts. Aesthetics stat_bin_2d() understands the following aesthetics (required aesthetics are in bold):x y fill group weight Learn more about setting these aesthetics in vignette("ggplot2-specs"). Computed variables These are calculated by the 'stat' part of layers and can be accessed with delayed evaluation.after_stat(count) number of points in bin. after_stat(density) density of points in bin, scaled to integrate to 1. after_stat(ncount) count, scaled to maximum of 1. after_stat(ndensity) density, scaled to a maximum of 1. See also stat_bin_hex() for hexagonal binning Examples d <- ggplot(diamonds, aes(x, y)) + xlim(4, 10) + ylim(4, 10) d + geom_bin_2d() #> Warning: Removed 478 rows containing non-finite outside the scale range #> (`stat_bin2d()`). #> Warning: Removed 5 rows containing missing values or values outside the scale #> range (`geom_tile()`). # You can control the size of the bins by specifying the number of # bins in each direction: d + geom_bin_2d(bins = 10) #> Warning: Removed 478 rows containing non-finite outside the scale range #> (`stat_bin2d()`). #> Warning: Removed 6 rows containing missing values or values outside the scale #> range (`geom_tile()`). d + geom_bin_2d(bins = 30) #> Warning: Removed 478 rows containing non-finite outside the scale range #> (`stat_bin2d()`). #> Warning: Removed 5 rows containing missing values or values outside the scale #> range (`geom_tile()`). # Or by specifying the width of the bins d + geom_bin_2d(binwidth = c(0.1, 0.1)) #> Warning: Removed 478 rows containing non-finite outside the scale range #> (`stat_bin2d()`). #> Warning: Removed 5 rows containing missing values or values outside the scale #> range (`geom_tile()`).'''
