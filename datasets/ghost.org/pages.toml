["https://ghost.org/vs/substack"]
title = "Ghost: The independent Substack alternative with 0% fees"
description = "Ghost is a powerful Substack alternative where you own your content and benefit from 0% transaction fees! Here's how Ghost vs Substack compare to one another."
full_description = '''Substack vs GhostGhost is a more powerful, independent alternative to Substack with zero transaction feesHey there! Thinking about moving over to Ghost? Or trying to decide which platform to use for the first time?If you’re wondering what the differences are between Ghost and Substack for creators and publishers running a premium newsletter, we put together this no-nonsense overview. Ghost svg.ghost-orb-logo { background-size: 100% 100%; background-repeat: no-repeat; background-image: url(/images/logos/logo-black-1.png); } SubstackPricing and transaction feesFrom $9/moGhost takes 0% feesYou keep all your revenue10% of your revenueFor every $50k revenueSubstack takes $5,000+ fees per yearEmail newsletters✅ Yes✅ YesCustom domain✅ Yes, included💸 Extra +$50 feeCustom email from-address✅ Yes, included❌ No, emails sent from name@substack.comShare your writing on Twitter✅ Yes❌ No, Substack links are penalised & hiddenCustom design✅ Yes, create your own brand❌ No, Substack-branded profileOffer multiple premium tiers✅ Yes, bronze / silver / gold / custom tiers with both monthly and yearly payment options❌ No, "free" or "paid" onlySupported currencies✅ 135 global currencies⚠️ 13 western currenciesInternational payment methods✅ Yes, all of them❌ No, only 4Rich writing experience✅ Yes, with dynamic cards❌ No, basic editor onlyApps & integrations✅ Yes, over 6,000 connected apps❌ No, cannot be extendedLaunch your own referral program✅ Yes, with addon❌ NoOwnership of your audience data✅ Yes, your subscriber list is yours❌ No, Substack promote other products and newsletters to your audienceOpen source✅ Yes, you own the technology❌ No, you are subject to the whims of SubstackDeveloper platform & API✅ Yes❌ No Open Subscription Platforms ✅ Yes✅ YesMigrating from Substack to Ghost is easyAll content, subscribers, subscriptions and payments can be seamlessly migrated from Substack to Ghost without any disruption to your customers.Learn more about the Concierge service.Keep all the revenue you make with GhostWhen you use Substack to power your newsletter, they take a 10% cut of your earnings, on top of industry standard processing fees.Using Ghost, the fee structure is simplified into a single monthly cost based on the scale of your publication and we don’t ever take a cut of your earnings. No matter how large your audience or how many features you use – all the revenue you make is yours to keep.Let’s put this into perspective: You have 1,000 paying subscribers at $5/month, generating $60,000 in annual recurring revenue. With Ghost, you pay $348 per year for hosting. Using Substack, you lose $6,000 per year.$8/ monthstandard shape-cube For people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentsSubscribe Now20% Annual Discount$59/ yearpremiumFor people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentscheck-circle-1Support indie publishingcheck-circle-1Advertising-free!Subscribe NowForecastHow much could you earn?Whether you prefer a large audience at a low price point or a small dedicated following at a premium fee, you control the economics.See how much you could earn with a subscription commerce publication: members Number of members$ / month Price per month$your annual recurring revenueHow does this work?Unlike other membership systems which typically take 10-30% of your revenue, Ghost takes no fee at all and instead connects directly to your own Stripe account, so you receive the money - not us. You own the software and you own the billing account, so there's no middleman between you and your customers. Stripe takes a ~2.9% processing fee, and all other revenue is yours to keep.Building a subscription business is challenging in lots of ways. Our focus is on making the billing side as easy as possible - so you can keep your focus on your customers.A more powerful publishing experienceIf you’re just getting started and you’re looking for a simple platform to start with, Substack is great! But if your plan is to build a serious subscription business with real revenue, Ghost is the more advanced option with better economics for publishers.Using Ghost, you’ll have access to a publishing experience that allows you to do more with your content. Enjoy powerful formatting tools and sensible content management, unlocking everything from adding images directly from Unsplash, to customising your emails by dynamically inserting subscriber names.Writing a newsletter issue in Ghost is familiar and clutter free, supporting beautiful image galleries, forms, videos, podcasts, bookmarks, Markdown and HTML.Publishers switch to Ghost because it provides a better writing experience, and they stick around because they gain ultimate control over their content and brand.The native members features within Ghost allow you to transform anonymous views into registered members, with both free and paid-only member tiers.Everything you need to get started is built-in: member management, native payments with recurring subscriptions and email newsletters. All without any additional fees!"Have been building paid membership newsletters with Ghost for two months now and ridiculously happy with the experience. It's the combination of amazing design with endless customisability if you want to have your own style. The writing interface is just SO nice — it feels like stepping inside a high-end minimalist house, you just want to live up to the beauty of it."Uri Bram, The BrowserSwitched from Substack to GhostBuild your brand + control your contentWhile Substack is a closed platform that you have little control over, Ghost is open source and extremely flexible. A Ghost publication can be completely customised to suit the needs of all kinds of publishers and authors.On Substack, you’re locked into a single design with some basic settings and no ability to create your own website or landing pages to promote your growing newsletter business.With Ghost you always own your content, subscriber lists and even the code because it’s completely open source. This means if Ghost the company disappears, you can continue to run your membership business in perpetuity.It’s possible to build a completely custom newsletter, like Publisher Weekly:Choose your domain, pick your own design and add your own branding. Each Ghost site is unique, and reflects the personality of its creator. Some examples:Growing an audienceThe most important aspect of any publication is understanding and growing a core readership base. Getting traffic to an independent website can be challenging, of course. But the rewards are that you physically own the content and you’re benefitting your own brand and business.Email newsletters are one of the most popular ways to build a trusted relationship with an audience. Ghost does everything you can do with Substack: Run a premium newsletter and send new posts directly to segments of your subscribers in a couple of clicks.Beyond this, Ghost does so much more to help you build a business. Everything you need to run a custom publication is baked in. SEO and social is taken care of with built-in XML sitemaps, Google AMP pages, canonical tags, optimised URLs, support for Twitter cards and clean semantic markup. All of this is done for you automatically – leaving you more time to focus on writing!"Three months in, I couldn’t be happier with my decision to switch from Substack. Ghost is a great tool for publishing newsletters, and the community of supportive fellow writers is invaluable!"David Bauer, Weekly FiletSwitched from Substack to GhostDoing more than the basicsAll new Ghost sites are installed with a beautiful default theme that you can get started with right away, but it’s worth having a look at the marketplace of free and premium themes, and our extensive directory of integrations. There’s so much that’s possible.If you’re already using Substack and thinking about switching to Ghost, check out how to get started with the Members features for subscription businesses. You can easily import an existing audience to Ghost from anywhere.One last thing you should knowGhost is an independent non-profit organisation. We build publishing tools for modern journalism & publishing because we believe freedom of speech is important. Our software is released under a free open source license, our business model is completely transparent, and our legal structure means that 100% of the money we make is reinvested into making Ghost better.We’re building a socially responsible, sustainable business which empowers people to share important stories and ideas. We’re in this for the long haul."For those of you on Substack: why not use Ghost instead? Is the payment you get from Substack greater than the freedom Ghost would provide?"Jack Dorsey, Founder of TwitterYou’re now armed with knowledge! Hopefully this guide was useful to give you a general overview of Substack compared to Ghost.We can help you migrate to Ghost from Substack, for free! Save time and let the Ghost team do all the work on your behalf; no coding, no configuration, no worries. This migration is included when you make an annual payment on the Ghost(Pro) Creator, Team, or Business plans. Learn more about the Concierge service.Still researching? Head back to the alternatives page.'''
