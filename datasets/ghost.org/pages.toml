["https://ghost.org/docs/contributing"]
title = "Contributing to Ghost - Submit your contribution to open source software"
description = "Ghost is completely open source built almost entirely by volunteer contributors. Find out how you can make a difference towards the future of modern publishing."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Contributing /Contributing to GhostGhost is completely open source software built almost entirely by volunteer contributors who use it every day.The best part about structuring a software project this way is that not only does everyone get to own the source code without restriction, but as people all over the world help to improve it: Everyone benefits.Core teamIn addition to full time product team working for Ghost Foundation, there are a number of community members who have contributed to the project for a lengthy period of time and are considered part of the core team. They are:Austin Burdine - Ghost-CLIFelix Rieseberg - Ghost DesktopVicky Chijwani - Ghost MobileDavid Balderston - CommunityHow core team members are addedPeople typically invited to join the Core Team officially after an extended period of successful contribution to Ghost and demonstrating good judgement. In particular, this means having humility, being open to feedback and changing their mind, knowing the limits of their abilities and being able to communicate all of these things such that it is noticed. Good judgement is what produces trust, not quality, quantity or pure technical skill.When we believe a core contributor would make a great ambassador for Ghost and feel able to trust them to make good decisions about its future - that’s generally when we’ll ask them to become a member of the formal Core Team.Core Team members are granted commit rights to Ghost projects, access to the Ghost Foundation private Slack, and occasionally join our international team retreats.Community guidelinesAll participation in the Ghost community is subject to our incredibly straightforward code of conduct and wider community guidelines.The vast majority of the Ghost community is incredible, and we work hard to make sure it stays that way. We always welcome people who are friendly and participate constructively, but we outright ban anyone who is behaving in a poisonous manner.Ghost TrademarkGhost is a registered trademark of Ghost Foundation Ltd. We’re happy to extend a flexible usage license of the Ghost trademark to community projects, companies and individuals, however it please read the Ghost trademark usage policy before using the Ghost name in your project.Development guideIf you’re a developer looking to help, but you’re not sure where to begin: Check out the good first issue label on GitHub, which contains small pieces of work that have been specifically flagged as being friendly to new contributors.Or, if you’re looking for something a little more challenging to sink your teeth into, there’s a broader help wanted label encompassing issues which need some love.When you’re ready, check out the full Ghost Contributing Guide for detailed instructions about how to hack on Ghost Core and send changes upstream.Ghost is currently hiring Product Engineers! Check out what it’s like to be part of the team and see our open roles at careers.ghost.orgOther ways to helpThe primary way to contribute to Ghost is by writing code, but if you’re not a developer there are still ways you can help. We always need help with:Helping our Ghost users on the forumCreating tutorials and guidesTesting and quality assuranceHosting local events or meetupsPromoting Ghost to othersThere are lots of ways to make discovering and using Ghost a better experience.DonationsAs a non-profit organisation we’re always grateful to receive any and all donations to help our work, and allow us to employ more people to work on Ghost directly.PartnershipsWe’re very happy to partner with startups and companies who are able to provide Ghost with credit, goods and services which help us build free, open software for everyone. Please reach out to us hello@ghost.org if you’re interested in partnering with us to help Ghost.Open Collective New: We have a number of ongoing donation and sponsorship opportunities for individuals or companies looking to make ongoing contributions to the open source software which they use on Open Collective.BitcoinFor those who prefer to make a one time donation, we’re very happy to accept BTC. Unless you explicitly want your donation to be anonymous, please send us a tweet or an email and let us know who you are! We’d love to say thank you.Ghost BTC Address:3CrQfpWaZPFfD4kAT7kh6avbW7bGBHiBq9On this page"
year_published = 2025
