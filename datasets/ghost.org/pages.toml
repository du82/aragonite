["https://ghost.org/docs/webhooks"]
title = "Ghost Webhooks"
description = "Trigger events when something happens in Ghost using webhooks configured through the Ghost Admin user interface. Find out more on Ghost Docs 👉"
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Webhooks /WebhooksWebhooks are specific events triggered when something happens in Ghost, like publishing a new post or receiving a new memberOverviewWebhooks allows Ghost to send POST requests to user-configured URLs in order to send them a notification about it. The request body is a JSON object containing data about the triggered event, and the end result could be something as simple as a Slack notification or as complex as a total redeployment of a site.Setting up a webhookConfiguring webhooks can be done through the Ghost Admin user interface under Settings > Advanced > Integrations > Add custom integration. The only required fields to setup a new webhook are a trigger event and target URL to notify. This target URL is your application URL, the endpoint where the POST request will be sent. Of course, this URL must be reachable from the Internet.If the server responds with 2xx HTTP response, the delivery is considered successful. Anything else is considered a failure of some kind, and anything returned in the body of the response will be discarded.Available eventsCurrently Ghost has support for below events on which webhook can be setup:EventDescriptionsite.changedTriggered whenever any content changes in your site data or settingspost.addedTriggered whenever a post is added to Ghostpost.deletedTriggered whenever a post is deleted from Ghostpost.editedTriggered whenever a post is edited in Ghostpost.publishedTriggered whenever a post is published to Ghostpost.published.editedTriggered whenever a published post is edited in Ghostpost.unpublishedTriggered whenever a post is unpublished from Ghostpost.scheduledTriggered whenever a post is scheduled to be published in Ghostpost.unscheduledTriggered whenever a post is unscheduled from publishing in Ghostpost.rescheduledTriggered whenever a post is rescheduled to publish in Ghostpage.addedTriggered whenever a page is added to Ghostpage.deletedTriggered whenever a page is deleted from Ghostpage.editedTriggered whenever a page is edited in Ghostpage.publishedTriggered whenever a page is published to Ghostpage.published.editedTriggered whenever a published page is edited in Ghostpage.unpublishedTriggered whenever a page is unpublished from Ghostpage.scheduledTriggered whenever a page is scheduled to be published in Ghostpage.unscheduledTriggered whenever a page is unscheduled from publishing in Ghostpage.rescheduledTriggered whenever a page is rescheduled to publish in Ghosttag.addedTriggered whenever a tag is added to Ghosttag.editedTriggered whenever a tag is edited in Ghosttag.deletedTriggered whenever a tag is deleted from Ghostpost.tag.attachedTriggered whenever a tag is attached to a post in Ghostpost.tag.detachedTriggered whenever a tag is detached from a post in Ghostpage.tag.attachedTriggered whenever a tag is attached to a page in Ghostpage.tag.detachedTriggered whenever a tag is detached from a page in Ghostmember.addedTriggered whenever a member is added to Ghostmember.editedTriggered whenever a member is edited in Ghostmember.deletedTriggered whenever a member is deleted from GhostStripe webhooksWebhooks allow Ghost to communicate with Stripe. In order to use Stripe with a local version of Ghost you’ll need to do some additional setup to allow webhook events happen between Stripe and Ghost.First, follow the instructions on how to install and log into the Stripe CLI tool in the Stripe documentation.Then, before starting a local instance of Ghost, run the following command in your CLI. Note that the localhost port number should match the one used in your local Ghost install:stripe listen --forward-to http://localhost:2368/members/webhooks/stripe/ After running this the CLI will return a secret prefixed with whsec_. This secret needs to be given to Ghost on start up. In a new CLI window run the following:WEBHOOK_SECRET=whsec_1234567890abcdefg ghost start After following these steps, Ghost will run locally with a webhook connection to your Stripe account. To test that it’s working, sign up for a paid membership on the local site.Now that the local install of Ghost is running and communicating with Stripe, you can develop and test themes for a custom membership experience, build signup and signin forms, or expose member data.On this page"
