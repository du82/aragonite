["https://ghost.org/trademark"]
title = "Ghost Trademark Usage Policy"
description = "Find out about how you can use the Ghost trademark with permission, and how to apply for permission to use it in special cases."
full_description = '''Trademark Usage PolicyThe word "Ghost" and the Ghost logo are trademarks owned by The Ghost Foundation. We would like to extend fair usage of our trademarks as widely as possible, so we have created the following guidelines to help people understand what is (and isn't) ok.Permission for UseWritten permission from The Ghost Foundation is required to use the Ghost name or logo as any part of your project or associated assets. Please contact us on info at ghost.org if you would like to enquire about permission for use.The purpose of a trademark is not to prevent anyone else in the world from using it, it is to prevent confusion amongst consumers as to which brand is the "official" one. Our primary criteria for the approval or denial of trademark usage requests is whether or not people might confuse it for an official Ghost Foundation project.Automatic ApprovalIn some special cases, we will grant automatic permission for a project to use the Ghost trademark. Explicit permission to use the trademark is not required when a project meets the following criteria:You exclusively use the Ghost trademark to either extend or improve the Ghost software, or to encourage the use of the Ghost software (in short — "foster the Ghost software" ).Ok: An open access, free monthly newsletter called "Ghost Weekly"Ok: A freely distributed Ghost theme called "Gold Plated Ghost"Not Ok: A Ghost fork called "A Non-Sucky Version of Ghost"Not Ok: Selling tshirts with the Ghost logo to raise money for another causeThe Ghost trademark is used in a domain name, title of website, seminar, software package, book, magazine or video that is exclusively intended to foster the Ghost software and does not suggest an "official link".Automatic Approval: A non-commercial website called howtoinstallghost.comAutomatic Approval: A keynote called Getting Started with GhostRequires Permission: A book titled The Official Ghost GuideRequires Permission: A commercial website called ghosthosting.comThe Ghost trademark is used for the title of a camp or meet-up, but not in combination with the words: conference, conf, convention or foundation.Ok: Ghost Annual Meetup 2013Not Ok: GhostConf LondonYou want to display the official Ghost logo (whether for commercial or non-commercial use) in a standalone and unaltered form.Ok: Putting the Ghost logo on your product packagingNot Ok: Changing the colours or shape of the Ghost logo for your purposesYou want to use the Ghost trademark to describe your product or services without implying any kind of official link to The Ghost Foundation or the Ghost open source project.Ok: referring to your services as specialising in Ghost developmentNot Ok: referring to yourself as The Ghost ConsultantAutomatic RestrictionIn some specific cases, you will always require explicit permission from The Ghost Foundation in order to use the Ghost trademark. Even if you meet the criteria for automatic approval, you must always seek permission for trademark use if your project meets any of the following criteria:The use of the Ghost trademark suggests an "official link" between your product or service and The Ghost Foundation. For example:A domain called officialghostfaq.orgA corporation named Ghost Development LtdA brand of Ghost Support AgencyThe Ghost trademark is used as part of a "ghost.tld" domain name. For example:Ghost.lyGhost.infoGhost.euThe Ghost trademark is used as part of a domain name that covers an entire category of products or services that are relevant to the Ghost community. For example:Ghost-Themes.comGhost-Plugins.orgGhost-Tshirts.usGhost-Mobile.co.ukGhost-Magazine.euGhost-Hosting.netThe Ghost trademark is used as part of the name of a company, organisation, trade name or association. For example:Ghost Users GermanyGhost IncGhost Bloggers AssociationYou would like to use the Ghost trademark as a part of an advertising campaign. For example:Google Adwords/AdsenseFacebook promoted postsA television advertisementIf you're not sure whether your use qualifies for automatic approval or not, please ask!Applying for PermissionIf you would like to apply for permission to use the Ghost trademark based on the guidelines above, please email us directly on info at ghost.org including your full details and the details of your requested use.Your application's approval will be considered based primarily on whether the product or service in question...suggest an offical link or could lead to confusion about being an official projectpromotes Ghost usage around the worldis released under an open source license compatible with Ghost's licenseis created by significant contributors to the Ghost open source projecthas a positive impact on the overall Ghost communityRules of UsageWith the exception of the "nominative fair use" of the Ghost trademark, your use of the trademark is subject to the following rules (irrespective of whether you received automatic or explicit permission for use):Any use of the Ghost trademark indicates acceptance of this policy.The Ghost trademark cannot be used for illegal, defamatory or humiliating purposes, or any other purpose that may negatively impact the Ghost software or The Ghost Foundation.Wherever possible, the Ghost trademark should be accompanied by the following text (or an appropriate translation): Ghost is a trademark of The Ghost Foundation.These trademark rules and guidelines are subject to change at any time. It is your responsibility to check this agreement periodically for changes.'''
