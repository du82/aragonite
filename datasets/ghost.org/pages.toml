["https://ghost.org/conduct"]
title = "Ghost.org Code of Conduct"
description = "Open source technology for fiercely independent publishers. Use Ghost to run a modern publication where you own the platform & control your content"
full_description = "Code of ConductNote: Our code of conduct applies to participation in Ghost communities and events which are created and managed by us. We do not control or manage what people choose to publish on their own websites.Our code of conduct is designed to protect the community which exists around the Ghost software including: our forum, public events and GitHub repositories. They are designed to make it clear that we believe in kindness, respect, inclusion and hard work. The Ghost community consists of an incredible group of people all over the world, and we want to continue to see it flourish.General ValuesBe inclusive: We are committed to being an open community that everyone feels good about joining. Although we may not be able to satisfy everyone, we will always work to treat everyone well.Be respectful: We expect all community members to be civil and respectful in their interactions. If you behave rudely, chances are nobody will want to help or talk to you.Be collaborative: Ghost isn't a giant corporation, it's a non-profit organisation and volunteer community. That means if you want something, it's up to you to get involved and make it happen. Don't show up with entitlement and demands. Do show up and ask how you can help.Don't be a DickYou shall be judged to have been a dick when a group of your peers have deemed that you were being a dick. If, after being warned, you continue to be a dick: you will be banned. There are no exceptions to this rule. Common examples of dickery include (but are not limited to):Don't be constantly rude, negative, divisive, combative or abrasive toward the Ghost team or any of its community members. Our community is not a punching bag for you to take your frustration out on.Sexist, heterosexist, racist, or otherwise hateful remarks. Which are not tolerated under any circumstances. Swearing is fine, but never when directed at people.Don't harass or bully other people. Do not attempt to communicate in any way with someone who has already asked you to stop.Don’t spam. Don’t make spammy posts, don’t post spammy replies, don’t send people spammy messages. Nobody likes spam. Nobody.Don't impersonate or do things that would cause confusion between you and a person or company.Don't do anything illegal. Don't screw with trademarks, copyrights, fraud or anything else that the police would not be happy to see you doing.Reporting ViolationsIf you feel that a member (or members) of the Ghost community is violating these guidelines in their interactions with people on our forum, Slack community, repositories or events, please report it toreport@ghost.orgIf you are concerned about something being posted using Ghost's software on an independent website, which does not fall under our community guidelines, please consult our abuse report policy."
