["https://ghost.org/docs/themes/helpers/get"]
title = "Ghost Handlebars Theme Helpers: get"
description = "Make custom queries to the Ghost API using the get helper and fetch publicly available data. Read more about Ghost themes! 👻"
full_description = '''Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Themes / Helpers / Get /getUsage: {{#get "posts"}}{{/get}}Description{{#get}} is a special block helper that makes a custom query to the Ghost API to fetch publicly available data. These requests are made server-side before your templates are rendered. This means you can fetch additional data, separate from what is provided by default in each context.In its most basic form, the {{#get}} helper performs a “browse” query that creates a block of data that represents a list of your posts, authors, tags, or tiers. Use the {{#foreach}} helper to iterate over this block of data.The {{#get}} helper can also be used to perform a “read” query that fetches one specific author, post, tag, or tier when the relevant resource field - e.g., id or slug – is provided as an attribute.Basic examplesGet the 15 newest posts from the API.{{#get "posts"}} {{#foreach posts}} {{title}} {{/foreach}} {{/get}} Get a single post with the id of 2, including its related tags and author data, using a block parameter. Learn more about block parameters below.{{#get "posts" id="2" include="tags,authors" as |post|}} {{#post}} {{title}} {{/post}} {{/get}} Fetch all tags and output them using the tags helper.{{#get "tags" limit="all"}}{{tags}}{{/get}} UsageThe {{#get}} helper has several more options that greatly extend its functionality. The following section walks through these options and how to use them.ResourcesThe first parameter passed in is the name of the resource you want to query. Available resources include: "posts", "tags", "authors", and "tiers".posts - any published posttags - any tag that has a post associated with itauthors - any author who has published a posttiers - any membership tiernewsletters - any newsletterExample:{{#get "authors"}} {{! Loop through authors }} {{#foreach authors}} {{name}} {{/foreach}} {{/get}} Block parametersAs with the {{#foreach}} helper, use block parameters to rename your returned data collection to make it easier to reference or more distinguishable.Block parameters are entered between pipe symbols (|)The {{#get}} helper supports two parameters. The first entry refers to your returned data collection. The second entry refers to your pagination object.Block parameters example:Get posts and rename the collection articles. The additional pagination object, pages, outputs the total number of posts in the collection.{{#get "posts" as |articles pages|}} {{! Loop through our articles collection }} {{#foreach articles}} {{title}} {{/foreach}} {{! Use the pages (pagination) object }} {{pages.total}} {{/get}} Using {{else}}All block helpers support the {{else}} helper, which outputs content when the first block doesn’t match. In the case of the {{get}} helper, this only happens if there’s an error and is mostly useful for debugging while developing.To output different content when there are no results returned from the {{#get}} request, use {{else}} with the {{#foreach}} helper.{{#get "posts" filter="featured:true"}} {{! Loop through our featured posts }} {{#foreach posts}} {{title}} {{else}} {{! If there are no featured posts}} <p>No posts!</p> {{/foreach}} {{else}} <p class="error">{{error}}</p> {{/get}} AttributesUse {{#get}} helper attributes to specify which data is returned. Available attributes are identical to those used with the Ghost Content API.“Browse” requests (fetching multiple items) accept any or all of these attributes. “Read” requests (fetching a single item by id or slug) only accept the include attribute.limitSpecify the size of your collectionAllowed values: positive integers and “all”Default value: 15It’s possible to use the global posts_per_page setting, which is 5 by default. Configure the setting in the active theme’s package.json file. This global value is available via the @config global as @config.posts_per_page.Examples:{{! Get the 20 most recently published posts }} {{#get "posts" limit="20"}}{{/get}} {{! Get all published posts }} {{#get "posts" limit="all"}}{{/get}} {{! Use the posts_per_page setting}} {{#get "posts" limit=@config.posts_per_page}}{{/get}} pagewhen the total number of posts exceeds the number of post initially requested, the resulting collection from the {{#get}} query will be paginated. Choose which page of that collection you want to get with the page attribute.Example:{{! Get the 4th page of results. In this case, where limit = 5, we are accessing posts 16 - 20}} {{#get "posts" limit="5" page="4"}}{{/get}} orderSpecify how your data is ordered before being returned. You can choose any valid resource field in ascending (asc) or descending (desc) order.Examples:{{! Get the 5 oldest posts }} {{#get "posts" limit="5" order="published_at asc"}}{{/get}} {{! Get posts in alphabetical order by title }} {{#get "posts" limit="5" order="title asc"}}{{/get}} includeBy default, the {{#get}} helper will only fetch the base data from a resource. Use include to expand the data that is returned. Separate multiple include values with a comma.Base resource data:poststagsauthorstiersInclude options for Post:“authors” – adds author data“tags – adds tag dataInclude option for Author and Tag“count.posts” – adds the post count for each resourceUse count.posts to order your collection.Include options for Tiers“monthly_price” - add monthly price data“yearly_price” – add yearly price data“benefits” – add benefits dataExamples:{{! Get posts with author }} {{#get "posts" limit="5" include="authors"}} {{#foreach posts}} <span>Written by: {{authors}}</span> {{/foreach}} {{/get}} {{! Get posts with author and tags }} {{#get "posts" limit="5" include="authors,tags"}} {{#foreach posts}} <p>Written by: {{authors separator=", "}}</p> <p>keywords: {{tags separator=", "}}</p> {{/foreach}} {{/get}} {{! Get all tags and order them by post count }} {{#get "tags" limit="all" include="count.posts" order="count.posts desc"}} {{#foreach tags}} <p>{{name}} ({{count.posts}})</p> {{/foreach}} {{/get}} {{! Get all tiers with monthly price, yearly price, and benefits data }} {{#get "tiers" include="monthly_price,yearly_price,benefits" limit="all" as |tiers|}} {{! Loop through our tiers collection }} {{#foreach tiers}} {{name}} {{#if monthly_price}} <div> <a href="javascript:" data-portal="signup/{{id}}/monthly">Monthly – {{price monthly_price currency=currency}}</a> </div> {{/if}} {{#if yearly_price}} <div> <a href="javascript:" data-portal="signup/{{id}}/yearly">Yearly – {{price yearly_price currency=currency}}</a> </div> {{/if}} {{#if benefits}} {{#foreach benefits as |benefit|}} {{benefit}} {{/foreach}} {{/if}} {{/foreach}} {{/get}} {{! Create a dynamic sign-up form that allows members to subscribe to specific newsletters}} <form data-members-form=> <input type="email" required data-members-email> {{#get "newsletters"}} {{#foreach newsletters}} <label> <input type="checkbox" value="{{name}}" data-members-newsletter /> {{name}} </label> {{else}} {{/get}} <button type="submit">Subscribe</button> </form> filterUse filter to make complex, logic-based queries on the data to fetch. In its most basic form, use filter to get posts that meet a simple boolean condition.{{! Only get posts that are featured }} {{#get "posts" limit="all" filter="featured:true"}} {{#foreach posts}} <a href="{{slug}}">{{title}}</a> {{/foreach}} {{/get}} Specify multiple rules for the filter attribute by using , for or, + for and, and - for negation. It’s possible to check for booleans, match against strings, look for items within a group, and much more. For a full breakdown of the filtering syntax and how to use it, please see the filter documentation in the API docs.Passing data to filterData already available within your theme template can be passed to the filter attribute.{{! Get three more posts by the author of the current post when in post.hbs }} {{#post}} <h3><a href="{{url}}">{{title}}</a></h3> <section class="author-meta"> <p>Post by: {{primary_author}}</p> </section> {{! Prevent the current post from being returned by filtering against its id }} {{#get "posts" filter="authors:{{primary_author.slug}}+id:-{{id}}" limit="3"}} <p>More posts by this author: <ol> {{#foreach posts}} <li><a href="{{url}}">{{title}}</a></li> {{/foreach}} </ol> </p> {{/get}} {{/post}} When passing title, dates, or other values with spaces to filter–wrap the data in single quotes.{{#post}} {{#get "posts" filter="published_at:<='{{published_at}}'+id:-{{id}}" limit="3"}} ... {{/get}} {{/post}} Tip: To filter based on dates, use the data attributes, e.g.{{published_at}}, not the {{date}} helper, as helper functions do not get called inside of a filter.Filtering by primary tagThe primary_tag represents the first tag on a post. See the available attributes.{{! Get three posts that have the same primary tag as the current post}} {{#post}} {{#get "posts" filter="primary_tag:{{primary_tag.slug}}" limit="3"}} {{#foreach posts}} <li><a href="{{url}}">{{title}}</a></li> {{/foreach}} {{/get}} {{/post}} Filtering by primary authorThe primary_author represents the first author listed on a post. See the available attributes.{{! Get three posts that have the same primary author as the current post}} {{#post}} {{#get "posts" filter="primary_author:{{primary_author.slug}}" limit="3"}} {{#foreach posts}} <li><a href="{{url}}">{{title}}</a></li> {{/foreach}} {{/get}} {{/post}} Filtering by membership typeTo restrict the type of tiers returned by the {{#get}} helper, filter the collection using the type attribute with either free or paid.{{! Only get tiers that are paid}} {{#get "tiers" filter="type:paid"}} {{#foreach tiers}} <p>{{name}}</p> {{/foreach}} {{/get}} Filtering by tier visibilityTo restrict the visibility of tiers returned by the {{#get}} helper, filter the collection using the visibility attribute with either public or none. Visibility here refers to whether the tier is selected or not in Portal settings.{{! Only get tiers that are public}} {{#get "tiers" filter="visibility:public"}} {{#foreach tiers}} <p>{{name}}</p> {{/foreach}} {{/get}} On this page'''
