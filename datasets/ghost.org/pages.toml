["https://ghost.org/docs/product"]
title = "Ghost product principles & roadmap"
description = "Ghost is developed by a small core team and a great deal of care is given to deciding what features get built. Find out more about our product principles."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Product /Product principles & roadmapDeveloping Ghost as a product is a complex process undertaken by a small number of people with a great deal of care.How we make product decisionsGhost is a small, bootstrapped non-profit organization with no external funding. We make revenue from our Ghost(Pro) platform, which sustains the company and funds a handful of developers who improve the software. Because we don’t have tens of millions of dollars in VC money or hundreds of developers, we have to carefully choose where to dedicate our limited team and resources. We can’t do everything.When deciding what to do next, we try to look at what would benefit most users, in most ways, most of the time. You can get a sense of those things over on our public changelog.Outside of the core team, Ghost is completely open source, so anyone in the world can contribute and help build a feature that they’d like to see in the software, even if the core team isn’t working on it.Feature requestsWe welcome feature requests from users over in the ideas category of the Ghost Forum. Here, people can request and suggest things which they’d like to see in Ghost, and others can add their votes.The ideas board is a great way for us to gauge user demand, but it’s not a democratic system. We don’t automatically build things just because they get a lot of votes, and not everything that gets requested makes it into core, but we do pay close attention to things with lots of demand.Why haven’t you built X yet? When will you?Based on how we make product decisions, and what feature requests we get (detailed above) — if neither the core team nor the wider community are building the thing you want, then it’s likely that there isn’t enough demand or interest to make it happen at the moment.But, the beauty of open source is that if enough people want something, they can easily get together on GitHub and make it happen themselves (or fund someone else to). There’s no need to wait on the core team to deliver it. If you really want or need a particular feature, it’s entirely possible to make that happen. You just need to get involved, either with time and development skills, or with money to fund someone with time and development skills.I’m very upset you aren’t doing what I want!For the most part, the Ghost community is kind, welcoming and very understanding about the complexities and constraints of building modern software. Every so often, though, we get a series of comments along the lines of:Ya so, wow, I can’t believe this is broken and nobody is doing anything. How have you messed up something so basic? Can the devs fix ASAP. Thanks.Being hostile and entitled in your interactions with our community doesn’t make anybody feel excited about helping you. Not the core team, and certainly not the wider group of volunteer contributors. Try being friendly to people, and they’ll typically be friendly in return. If you feel really passionate about something specific, you have 3 potential courses of action:Get involved on GitHub and contribute code to fix the issueHire a developer to get involved on GitHub and contribute code to fix the issueStart a feature request topic on the forum to demonstrate that lots of other users care about this too, and have voted on it, which is the most likely way the core team will prioritize it.Is there a public roadmap for what’s coming next?The Ghost core team maintains a broad 1-2 year product roadmap at any given time which defines the overall direction of the company and the software. While the exact roadmap isn’t shared publicly (we tried it and it turned out to be more distracting than helpful), the things being worked on are generally very visible on GitHub.On this page"
year_published = 2025
clearnet = "https://ghost.org/docs/product"
