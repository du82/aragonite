["https://ghost.org/help/how-do-i-reset-my-password"]
title = "How do I reset or change my password?"
description = "Passwords can be changed from within a staff user profile, or reset directly from the Ghost Admin login area."
full_description = "How do I reset or change my password? Staff user passwords can be changed from within a staff user profile, or reset directly from the Ghost Admin login area.Change your PasswordIf you know your current password, you can log in to Ghost Admin, and go directly to the Settings → General → Staff area, and select your staff user profile.To change your password, click Change password, then enter your old password, followed by entering your new password, and verifying.When finished, click Change password. Once updated, you will need to use the new password to log in to Ghost Admin going forward. Resetting your passwordIf you've forgotten your password, you can reset your password directly from the login area of Ghost Admin, e.g. by going to https://<subdomain>.ghost.io/ghost/ in your browser.To reset your password, enter your staff user email address and click Forgot?Clicking Forgot? will trigger a password reset email to your inbox, that contains a link that must be clicked in order to reset the password. Once reset, you can login to Ghost Admin with your email address and new password. Does Ghost automatically back up my data? Ghost(Pro) is a managed service so you don't need to worry about data backups — but you can export your data anytime!"
year_published = 2023
year_updated = 2024
clearnet = "https://ghost.org/help/how-do-i-reset-my-password"
