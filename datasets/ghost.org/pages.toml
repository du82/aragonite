["https://ghost.org/changelog/signup-spam-protection"]
title = "Signup spam protection"
description = """
Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to large numbers of fake member accounts being registered on their websites.

On Ghost(Pro) we proactively monitor and block spam signups like this automatically as a part of our managed"""
full_description = "← Changelog Feb 5, 2025 New Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to large numbers of fake member accounts being registered on their websites.On Ghost(Pro) we proactively monitor and block spam signups like this automatically as a part of our managed service whenever we spot patterns of abuse across our network. Now, we've also introduced a new spam filtering as a setting in Ghost – allowing publishers direct control to block signups at an individual site level. So, if you spot a bunch of bogus members appearing on your site, you can quickly halt them in their tracks.Some platforms deliberately allow fake signups through because they make growth charts go up and to the right 📈 but at Ghost, we believe in quality over quantity. Subscriber growth isn't worth much if the subscribers aren't real!Ghost(Pro) users can log in and start enjoying all of this right away! If you're a developer, self-hosting Ghost, you'll need to update to the latest version to get access to everything that's new. Get notified when we ship new features. Subscribe → Email sent Try again Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved Dec 17 Custom fonts Native support for custom typography with even more control over your brand. Dec 17, 2024 New"
