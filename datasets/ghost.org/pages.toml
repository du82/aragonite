["https://ghost.org/vs/revue"]
title = "Ghost: The reliable Revue alternative for modern email newsletters"
description = "Ghost is a powerful, open source Revue Alternative that allows you to run a free or premium email newsletter. Here's how Ghost vs Revue compare to each other."
full_description = '''Revue vs GhostGhost is a powerful, independent alternative to Revue where you control your content & your designHey there! Thinking about moving over to Ghost? Or trying to decide which platform to use for the first time?If you’re wondering what the differences are between Ghost and Revue for newsletter authors, we put together this no-nonsense overview. Ghost svg.ghost-orb-logo { background-size: 100% 100%; background-repeat: no-repeat; background-image: url(/images/logos/logo-black-1.png); } RevuePricing and transaction feesFrom $9/moGhost takes 0% feesUse your own payment gateway5% of your revenueFor every $50k revenueRevue takes $2,500 per yearEmail Newsletters✅ Yes✅ YesEasy integration with Twitter✅ Yes✅ YesOffer multiple premium tiers✅ Yes, bronze / silver / gold / custom tiers with both monthly and yearly payment options❌ No, "free" or "paid" onlyCustom design✅ Yes, launch your own brand❌ No, Revue-branded profileOpen source✅ Yes, you control the rules❌ No, Revue control everythingNative SEO✅ Yes❌ No Open Subscription Platforms ✅ Yes, you own your data❌ No, you're locked inMigrating from Revue to Ghost is easyAll subscribers, payments and newsletter issues can be seamlessly migrated from Revue to Ghost without any disruption to your readers.Learn more about the Concierge service.Building a membership business with GhostOn Revue, you’re running your email newsletter business on their platform, along with everyone else. You can’t control any of the experience or design, or use a custom website.If you’re just getting started with your newsletter, then Revue works perfectly fine. But if you’re building a serious membership business and want to establish a brand, then you’ll probably need more than Revue has to offer.So much is possible with Ghost — you can build a completely custom publication with public & member-only content, or run free, paid or curated newsletters. Best of all, there’s no extra downloads and we don’t take any transaction fees — so all of your revenue is entirely yours to keep.$8/ monthstandard shape-cube For people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentsSubscribe Now20% Annual Discount$59/ yearpremiumFor people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentscheck-circle-1Support indie publishingcheck-circle-1Advertising-free!Subscribe NowForecastHow much could you earn?Whether you prefer a large audience at a low price point or a small dedicated following at a premium fee, you control the economics.See how much you could earn with a subscription commerce publication: members Number of members$ / month Price per month$your annual recurring revenueHow does this work?Unlike other membership systems which typically take 10-30% of your revenue, Ghost takes no fee at all and instead connects directly to your own Stripe account, so you receive the money - not us. You own the software and you own the billing account, so there's no middleman between you and your customers. Stripe takes a ~2.9% processing fee, and all other revenue is yours to keep.Building a subscription business is challenging in lots of ways. Our focus is on making the billing side as easy as possible - so you can keep your focus on your customers.What else does Ghost do better?When it comes to the user experience, Ghost is a simple and beautiful platform for writers, like you. It’s explicitly focused on doing one thing really well: Publishing. This means you’ll be able to focus your time on the most important things, creating unique content and building a direct relationship with your audience to generate sustainable recurring revenue.Creating content in Ghost is familiar and clutter free, and it supports dynamic 'Cards' to allow you to drop in images, embeds (like video or audio), galleries, bookmark cards and more.Creators switch to Ghost because it provides a better writing experience, and stick around because they gain more control over their brand.The native members features within Ghost allow you to transform anonymous views into registered members, and it's possible to have both free and paid-only member tiers.Everything you need to get started is built-in: member management, native payments with recurring subscriptions and email newsletters. All without any additional fees!"Have been building paid membership newsletters with Ghost for two months now and ridiculously happy with the experience. It's the combination of amazing design with endless customisability if you want to have your own style. The writing interface is just SO nice — it feels like stepping inside a high-end minimalist house, you just want to live up to the beauty of it."Uri Bram, The BrowserSwitched from Substack to GhostFully customisableWhile Revue is a closed platform that you have little control over, Ghost is open source and extremely flexible.On Revue, you’re locked into a choice of two templates with some basic settings and no ability to create your own landing pages to promote your growing newsletter business. Your content looks the same as everyone else’s.With Ghost: you choose your domain, design, and add your own branding. Each Ghost site is unique, and reflects the personality of it’s creator. Some examples:Growing an audienceThe most important aspect of any publication is understanding and growing a core readership base. Getting traffic to an independent website can be challenging, of course. But the rewards are that you physically own the content and you’re benefitting your own brand and business.Email newsletters are one of the most popular ways to build a trusted relationship with an audience. Ghost does everything you can do with Revue, allowing you to run a premium newsletter and send new posts directly to segments of your subscribers in a couple of clicks.Ghost has SEO & social built-inWhat’s the point in publishing if nobody reads your content?Ghost has the best support for search engine optimisation and social sharing features of any blogging platform in the world. You don’t need any extra plugins or extensions, and you don’t need to write any extra code. It just works.There are built-in XML sitemaps, Google AMP pages, canonical tags, optimised URLs, microformats, Facebook Open Graph tags, support for Twitter cards and clean semantic markup. All of this is done for you automatically, with no plugins needed."I launched my membership site in under 3 hours without having to find a plugin or deal with a platform that would have been overkill for what I needed. I was amazed that within hours of launching the site I was already getting members signing up!"Alex Older, Shutter ClubDoing more than the basicsAll new Ghost sites are installed with a beautiful default theme that you can get started with right away, but it’s worth having a look at the marketplace of free and premium themes, and our extensive directory of integrations. There’s so much that’s possible.If you’re already using Revue and thinking about switching to Ghost, check out how you can migrate your existing audience and content.TL;DR: Cut to the chaseGhost is better for serious publishers and membership businesses who need a custom website. Revue is better for people who are just starting a simple newsletter.One last thing you should knowGhost is an independent non-profit organisation. We build publishing tools for modern journalism & publishing because we believe freedom of speech is important. Our software is released under a free open source license, our business model is completely transparent, and our legal structure means that 100% of the money we make is reinvested into making Ghost better.We’re building a socially responsible, sustainable business which empowers people to share important stories and ideas. We’re in this for the long haul."I've been a blog minimalist from the start, and finding a truly open source platform which reflects that minimalism and focus is incredibly refreshing."Jeff Atwood, Coding HorrorSwitched from TypePad to GhostYou’re now armed with knowledge! Hopefully this guide was useful to give you a general overview of Revue compared to Ghost.Migrate from Revue to Ghost, for free →Still researching? Head back to the alternatives page.'''
