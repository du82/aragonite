["https://ghost.org/changelog/sales-tax-on-autopilot-beta"]
title = "Sales tax on autopilot (beta)"
description = "Stripe Tax allows you to automatically calculate and collect tax when your subscribers checkout for paid membership."
full_description = "← Changelog Sep 17, 2024 Beta Sales tax on autopilot (beta) Calculate and collect tax for paid subscriptions, directly in Stripe Checkout With the new Stripe Tax integration (beta) in Ghost, you can now effortlessly handle sales tax, VAT, or GST directly at checkout for new paid subscriptions (or tips and donations!), based on what makes sense for your business.Stripe Tax is a paid add-on for Stripe that helps you monitor where you need to collect taxes, automatically calculates and collects the right amount for new customers, and provides you the reports needed to file returns.Once the integration is enabled, new paid members going through Stripe Checkout will see an additional field to enter their address. If they live in a location in which you’re registered to collect tax, it will be automatically calculated at the appropriate rate. Beta testingWe've been testing the new Stripe Tax integration in private with a small group of publishers across the United States, Canada and Europe for the past few months, and it's working great!Taxes have a long tail of different cases and nuances, though, so we're rolling this beta out manually and working with publishers directly to enable it on their sites.How to get accessPrior to turning on the integration in Ghost, you'll need to opt-in to the Stripe Tax add-on and configure it via your Stripe dashboard. The process involves several steps, so we've written up a helpful guide to walk you through the full setup:Stripe Tax Integration (Beta)Stripe Tax allows you to automatically calculate and collect tax when your subscribers checkout for paid membership.Ghost Help CenterGhostIf there are ways you think this feature could be more valuable based on the way you use Ghost, we’d like to hear it — feedback@ghost.org. Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New"
