full_description = "Content marketing for modern business.Ghost is a modern, open source publishing platform for companies who are serious about content marketing and brand journalism, with lead-gen tools and newsletters built in natively from the start.Get started now — free“I’m always blown away by how Ghost manages to be both so simple and so powerful at the same time.”— Hailley Griffis, BufferNo more investing & hoping for the best. Try a platform that actually gets results.“Why choose Ghost? Privacy, security & speed. With growing awareness of the importance of respecting user privacy while serving content on a fast, stable platform, Ghost has quickly built a reputation for checking all these boxes.”— Daniel Davis, DuckDuckGoPowerful SEO, made easy.Add custom meta data for search engines and structured data for social networks. Detailed XML sitemaps are built automatically. No plugins. No headaches.Real data. Real results.Finally your team can show direct ROI of content marketing, with lead generation and email newsletters built-in. Cross reference who reads your content against who signs up for your product.Go faster. 1900% faster.Ghost is built on a modern Node.js back end, giving you performance equivalent to a static site. Under load, Ghost will serve 19 requests in the time it takes WordPress to serve just 1. Hit the Reddit frontpage? No problem.Multiplayer enabled.Invite the whole team, so you can easily collaborate on content and design changes, as well as add bylines to all your posts.Made for cross-functional teams.Marketers get a smooth editor for easy publishing with powerful features. Developers get a modern open source platform with custom templates and a full JSON API.World-leading companies use Ghost to publish content & grow their audience.UnsplashStories from the largest source of freely usable images on the internet, with 2 million+ curated photos created by photographers all over the world.https://unsplash.com→DuckDuckGoThe team behind the privacy-driven internet search engine DuckDuckGo are publishing privacy tips and original research on the Spread Privacy blog.https://spreadprivacy.com→KickstarterThe latest news, stories and interviews from the Kickstarter community, the global crowdfunding platform that helps bring creative projects to life.https://kickstarter.com→MozillaThe non-profit foundation behind the popular open-source web browser, Firefox, use Ghost to power the Mozilla Mixed Reality blog.https://mozvr.com→freeCodeCampSearch more than 9,500+ tutorials from a community of millions of people around the world who are learning to code together.https://freecodecamp.org→CloudflareThe latest news and technologies behind operating one of the biggest networks on the internet, improving the security and performance of millions of websites.https://cloudflare.com→“Migrating over to Ghost was really easy, took us a weekend to get most of it up and running, and the tools they've built are really good out of the box 🔥”— Luke Chesser, UnsplashRevolutLeading FinTech company Revolut share finance education articles and updates about their personal and business banking products.https://revolut.com→ClubhouseThe social network for audio chat rooms, Clubhouse, write about platform updates and the latest news in the audio technology space.https://clubhouse.com→GustoThe Gusto team use Ghost to share inside insights about how they build modern payroll and human resource management software for businesses.https://gusto.com→AirtableA no-code solution to help teams collaborate with a hybrid spreadsheet-database app. Airtable publish product stories on the For The Record blog.https://airtable.com→DuolingoDuolingo has helped millions of people learn more than 30 spoken languages, with interactive AI-tailored lessons and challenges.https://duolingo.com→Hello PartnerRead about affiliate, performance and partner marketing, the creator economy and everything in-between, by the team at Hello Partner.https://hellopartner.com→