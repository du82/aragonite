["https://ghost.org/news"]
title = "Ghost: The local news platform"
description = "The refreshingly simple CMS for newsrooms who are tired of wading through bloated admin panels and clunky workflows."
full_description = "A fresh start for local news.Break free from legacy CMS products and clunky home-grown solutions, with an open platform designed for modern media.2024Ghost is an independent non-profit foundation building open source technology for modern newsrooms.We make a powerful platform for running a website, growing an audience, sending email newsletters, and collecting subscription revenue from members.In partnership with 300+ newsrooms40+ countries500k+ engaged readers$3M+ subscription revenue It's time to write a new(s) story.Amidst all the struggles of modern media and its place in an ever-changing society, we see opportunity.Advertising models may never return to their heyday, but reader-driven, subscription-funded models are re-aligning incentives and bringing communities back together.Quality, rather than quantity, is what works in 2024.How The Atlantic went from broke to profitable in 3 yearsWe believe there’s a huge untapped audience for the highest quality journalism that is still willing to pay for it.The Wall Street Journal →Lessons from a $4.5M ad-free news platform in HollandWe’ve grown to an online journalism platform with more than 60,000 paying members. Readers pay us, and we invest that money into journalism. That is our business model.De Correspondent →Why the future of media is subscription-basedIn the ever-evolving landscape of media, a seismic shift is underway, and subscription-based models are emerging as the linchpin of the industry's future.Forbes →We work with local news publishers and independent journalists all over the world to help them build a sustainable business to fund their reporting.The good news? It's working.Today, Ghost is is one of the most widely adopted platforms in the world for independent news. There are far more news sites running on Ghost than on Newspack, at a fraction of the cost.Chat with our team to learn more →Kyiv IndependentNews, analyses, investigations, opinions, podcasts and more. On-the-ground reporting from Ukrainehttps://kyivindependent.com→Hellgate NYCA subscriber-funded, worker-owned news outlet about New York City, named for the city's sturdiest (and handsomest) bridge over its most treacherous currents.https://hellgatenyc.com→Raincross GazetteLocal news and events for Riverside published by Riversiders.https://www.raincrossgazette.com→The MapleA reader-funded Canadian publication that puts the working class first. Fiercely critical and dedicated to investigating stories and exploring ideas no one else will.https://www.readthemaple.com→Winchester NewsA trusted and reliable source of local news in Winchester, Massachusetts. MA USAhttps://winchesternews.org→Napa Valley InsiderDiscover the best of Napa Valley. Get the latest updates on news, events, food &amp; wine, and more. Stay informed with the premier platform for local Napa journalism.https://www.napavalleyinsider.com→The Berkeley ScannerTimely, comprehensive crime and safety news to Berkeley, CA. Editor-in-chief: Award-winning veteran news reporter Emilie Raguso.https://www.berkeleyscanner.com→Roanoke RamblerA trusted and reliable source of local news in Winchester, Massachusetts. MA USAhttps://www.roanokerambler.com→Austin PoliticsPolitics & policy in America's fastest growing city.https://www.austinpolitics.net→Daily DetroitWhat to know and where to go in Metro Detroit on our daily podcast and newsletter.https://www.dailydetroit.com→Lookout PhoenixA nonprofit news site dedicated to covering Arizona's LGBTQ+ community.https://www.lookoutphx.org→The Ingleside LightAn independent news organization dedicated to delivering reliable and essential coverage of San Francisco's Ingleside neighborhood.https://www.inglesidelight.com→Great Central GazetteInvestigations, features, culture and events to keep you informed of what’s happening around Leicester. Owned by the community, for the community.https://www.greatcentralgazette.org→South Dakota News WatchAn independent, nonprofit organization reporting untold stories that help South Dakotans be informed and engaged citizens.https://www.sdnewswatch.org→The SavannahianThe only destination for completely independent journalism, arts, and culture in Savannah, GA.https://www.thesavannahian.com→BklynerBrooklyn’s largest local news site, covering the diversity of the Brooklyn neighborhoods since 2008, and the news, issues, events, and businesses that matter to their residents.https://bklyner.com→TangleAn independent, ad-free, non-partisan politics newsletter. Isaac Saul dives deep into the best arguments from across the political spectrum on the news of the day.https://readtangle.com→The LeverAward-winning journalist and Oscar-nominated writer David Sirota conducts investigative journalism about holding people and corporations manipulating the levers of power accountable.https://levernews.com→“Ghost is just implausibly good. It takes care of everything you need out the box - email sending, payments (via your own Stripe account, they take 0% fees), website. Everything.”— Uri Bram, The Browser"
