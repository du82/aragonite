["https://ghost.org/docs/install/linode"]
title = "How to install & setup Ghost on Linode"
description = "A full production install guide for how to install the Ghost professional publishing platform on a production server running Ubuntu 16.04, 18.04, 20.04 or 22.04."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Install / Linode /How to install Ghost on LinodeA full guide for installing, configuring and running Ghost on your Linode server, for use in production.OverviewThis the official guide for hosting Ghost on Linode. If you’re comfortable installing, maintaining and updating your own software, this is the place for you. By the end of this guide you’ll have a fully configured Ghost install running in production using MySQL.This install is not suitable for local use or contributing to core.PrerequisitesThe officially recommended production installation requires the following stack:A configured and secured Linode serverA server with at least 1GB memoryServer SetupThis part of the guide will ensure all prerequisites are met for installing the Ghost-CLI.Setup the serverFollow the official “Getting Started with Linode” guide to setup your server. You must choose the Ubuntu image when creating your server. As you’re creating a new server you should prefer Ubuntu version 22.04 LTS. However you can use Ubuntu 20.04, 18.04 or 16.04 if you want.Note: Using the user name ghost causes conflicts with the Ghost-CLI, so it’s important to use an alternative name.Secure your serverFollow the official “How to Secure Your Server” Linode guide to secure your server.Install Ghost on UbuntuNow that you have a secure server with Ubuntu, follow the Ubuntu instructions to install Ghost.On this page"
