title = "Upgraded comments"
description = "Threaded replies, sorting options, and improved moderation tools."
full_description = "← Changelog Dec 19, 2024 Improved Upgraded comments Threaded replies, sorting options, and improved moderation tools. Two years ago, we launched native Comments in Ghost. By creating a space specifically for registered members to engage with publishers and each other, we enabled community building in a way that wasn’t previously possible in Ghost.Fast forward to today, and we’ve seen the impact of these communities firsthand — from small, highly engaged groups to publications with tens of thousands comments. With that growth, and feedback from you and your readers in mind, it’s time for an upgrade.What’s new?Replies-to-replies → People can now reply directly to a reply (meta, we know), enabling clearer, deeper conversations and more engagement — all in a way that doesn’t result in your comments section zig-zagging down the page. 0:00 /0:11 1× Sorting → Many of you told us that the most vibrant comments and discussions should be the first thing people see. Now, there's an option to sort comments by best, newest, and oldest first — with best (measured by likes) as the default. 0:00 /0:10 1× Call to action at the top → An invitation to join the discussion now sits at the top of the comments section, helping to convert new readers into members, and free members into paying subscribers.Plus, hitting the ❤️ or Reply button now prompts readers to sign up or upgrade to leave a comment. 0:00 /0:08 1× Hidden and deleted comments → Comments without replies will now disappear entirely when hidden or deleted. No more annoying placeholders.If there are ways you think this feature could be more valuable based on the way you use Ghost, we’d like to hear it! — Reach out on feedback@ghost.org Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 17 Custom fonts Native support for custom typography with even more control over your brand. Dec 17, 2024 New"
