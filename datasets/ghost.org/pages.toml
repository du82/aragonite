["https://ghost.org/changelog/custom-fonts"]
title = "Custom fonts"
description = "Native support for custom typography with even more control over your brand."
full_description = "← Changelog Dec 17, 2024 New Custom fonts Native support for custom typography with even more control over your brand. Ghost offers hundreds of beautifully designed themes out of the box. Whether you've built a news website, company blog, creator library or weekly newsletter, there's something tailored to your personal needs. And now, with the addition of native support for custom fonts in Ghost, we're taking personalization one step further. We've carefully curated a diverse set of typefaces to choose from that work well across almost any theme, aiming for quality over quantity. 0:00 /0:15 1× How to customize fontsTo change your publication's fonts, open your Design settings. Under Brand, scroll down to Typography.This feature is supported by the latest versions of all official Ghost themes. Go to Settings → Theme → Change theme and reinstall your theme to update to the latest version. If you're using a custom theme, you can read the developer docs for custom fonts to learn how to add support for this feature, or reach out to your theme developer for an updated version.If you have feedback on this feature or requests for specific typefaces, feel free to let us know on feedback@ghost.org. Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved"
