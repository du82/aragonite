full_description = "News at the intersection of Silicon Valley and democracy. On Monday, Tuesday, and Thursday at 5PM Pacific. 404 Media is a journalist-founded publication focused on investigative reports about hacking, cybersecurity, AI, consumer rights, surveillance, privacy, and the democratization of the internet. Summarizing the best arguments from across the political spectrum. 100% independent, ad-free, and non-partisan. Award-winning journalist and Oscar-nominated writer David Sirota conducts investigative journalism about holding people and corporations manipulating the levers of power accountable. Become a smarter creator in 10 minutes per week. Join 55,000+ creators learning from firsthand experiments, expert interviews, and actionable advice every week. Every day we read hundreds of articles and recommend five outstanding stories for you to enjoy, so you'll always have interesting things to ponder and fascinating ideas to discuss at dinner “Luke O’Neil’s Welcome To Hell World is a vital and despairing collection of essays on modern American life.” -Longreads Canada's top independent news publication for reporting and perspectives you won't find in the corporate media. Online and print publication informing and inspiring the international sign painting community. Join our adventures in sign painting for free today. Buffer’s social media marketing blog covers the latest social media tools, analytics, and strategies for Twitter, Facebook, and more. Founded by award-winning designer Tobias Van Schneider in early 2016 to cover stories of design, psychology and productivity. One of the few design blogs that's actually written by designers. Kickstarter exists to help bring creative projects to life. A home for film, music, art, theater, games, comics, design, photography, and more. Product Marketing Alliance is a collective of passionate product marketing managers committed to driving demand, adoption and the overall success of their products. Gain a competitive edge with clear analysis and expert commentary on the economic indicators that drive the market. Posted by Dr Ed Yardeni and his research team."
