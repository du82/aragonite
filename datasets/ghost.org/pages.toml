["https://ghost.org/changelog/tips-donations"]
title = "Tips & donations"
description = "Give your audience a simple way to support your work with one-time payments, no membership required."
full_description = "← Changelog Sep 3, 2024 New Tips & donations Give your audience a simple way to support your work with one-time payments, no membership required. Subscriptions give your members a way to support your work with a consistent, recurring cadence — but what if someone wants to send you a one-off payment to support your work?While it’s always been possible to take one-time payments in Ghost, it hasn't been easy. In fact, from chatting with publishers, we discovered no fewer than nine (9!) different methods for doing so. So, we decided to add support for tips and donations natively in Ghost to make this a whole lot easier.Starting today, any Ghost publication with an active Stripe connection can have a dedicated payment link that allows your audience to send you a one-time payment. 0:00 /0:14 1× Find it under Settings → Growth → Tips & Donations. You’ll be able to set a suggested amount for people to tip, and use your payment link anywhere across your Ghost site; like in buttons, headers, email CTAs, or anywhere else that comes to mind.Tips & donations can be made by members and non-members alike, and any time someone makes a payment, you'll receive an email notification to let you know.Ghost(Pro) users can log in and start enjoying all of this right away! If you're a developer, self-hosting Ghost, you'll need to update to the latest version to get access to everything that's new.If there are ways you think this feature could be more valuable based on the way you use Ghost, we’d like to hear it — feedback@ghost.org. Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved"
