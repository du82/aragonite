full_description = "Integrations / ContentEmbed content from Imgur in Ghost to share the most awesome images on the internet with your readersImgur has one of the largest libraries of the internet’s most popular photos and gifs, and all of them can be freely embedded on any Ghost site. There are only a couple of steps to get Imgur photos working within your posts.To get started, head over to Imgur and find the photo you’d like to use.Select a photo and click embedOpen the share menu from the three dots and select Embed PostCopy the Imgur embed codeFrom within the embed window, click on the Copy button to copy the code.Within the Ghost editor, add a new HTML cardYou can paste the form code within an HTML card on any page to embed your formEnjoy your new Imgur integrationThat’s it — your embed will now appear within your post. To move the embed around your post, simply drag and drop the HTML card. When you hit publish, your embed will appear in your content. Have fun!"
