["https://ghost.org/sla"]
title = "Ghost(Pro) Cloud Service Level Agreement"
description = "Official details of the Ghost(Pro) Business and Ghost Enterprise Service Level Agreement (SLA) included with all Business and Enterprise hosting plans."
full_description = "Hosting Service Level AgreementThe following applies only to Ghost(Pro) Business and Ghost Enterprise hosting plans, and is not applicable to any other products or services offered by Ghost Foundation.(Updated: May 1st, 2019.) This SLA amends the Agreement between Ghost Foundation and Customer and addresses the uptime guarantees in relation to the Services we provide to you and your remedies for our failure to meet such guarantees. The remedies contained in this SLA are your sole and exclusive remedies for any issues addressed herein. We may update this SLA from time to time in our sole discretion; the current version may be found at https://ghost.org/sla/.1. Service AvailabilityGhost Foundation will make the Services available 99.9% of the time, excluding any Excused Downtime. In a given calendar month, we calculate “Service Availability” as total minutes services are available x 100, divided by: total minutes in the month (less excused downtime).2. Excused Downtime“Excused Downtime” means the length of time the Services are unavailable due to:Scheduled Maintenance;Emergency Maintenance;Beta Services;Force Majeure events; andthe actions or omissions of you, your Authorized Users, or any third-party acting on your behalf or at your direction, including any unauthorized use of the Services, breach of the Agreement or Acceptable Use Policy, or any use or configuration of the Services that exceeds Ghost Foundation’s recommendations or advertised limits.“Scheduled Maintenance” includes any maintenance performed during the following windows or for which we provide reasonable notice or coordination with you in advance of the maintenance.Data Center location:Maintenance window:Americas10pm - 4am Central TimeEurope4pm - 10pm Central TimeAsia-Pacific8am - 2pm Central Time“Emergency Maintenance” means any maintenance performed outside the Scheduled Maintenance windows without advance notice where such maintenance is reasonably and urgently required to protect the integrity, availability, or security of any online systems.3. SLA CreditsCompany’s failure to maintain the Performance Requirement will generate a credit of 5% of the applicable Monthly Service Fees for each full hour of downtime in excess of the Service Availability targets. (For example, you will receive a 5% credit for between 1 and 60 minutes of downtime in excess of the Service Availability targets, a 10% credit for between 61 and 120 minutes, etc.) In order to receive a credit, it must be requested in writing within 30 days of the event giving rise to the credit. Credits are based on our monitoring, shall not exceed 100% of the applicable monthly Fees, may not be carried over or aggregated, are forfeited at the expiration or termination of the Agreement, and will not be paid or provided as a refund."
