["https://ghost.org/integrations/lets-encrypt"]
title = "Official Ghost + Let's Encrypt Integration"
description = "Ensure your publication is secure with free SSL via a full integration with Let's Encrypt. Find out how to provision a new SSL certificate in Ghost!"
full_description = "Integrations / UtilityMaking the web more secure with free SSL certificates, Let’s Encrypt is a great way to make your Ghost site run on HTTPSWe strongly recommend that all sites use SSL, and plan to make it a mandatory configuration for Ghost in the near future.Ghost(Pro)All Ghost(Pro) sites come with automatic SSL enabled by default and require no setup of any kind, so if you use our hosted platform to run Ghost: Configure a custom domain for your sites and you’re all set!Self-HostingIf you’re self-hosting, though, Let’s Encrypt is fully integrated into our comprehensive Ghost-CLI tool so that you can provision a new SSL certificate in a couple of steps by running:ghost setup ssl This will prompt you for a couple of details, including your email address - which is required for Let’s Encrypt notifications about renewing your certificate. Your email address is not shared or used for any other purpose when entered here.This is a normal part of the larger ghost setup CLI command.Note: You can, of course, only setup SSL if you have a properly configured domain name. Let’s Encrypt will not be able to provision a certificate for any Ghost install which is running locally, or on an IP address.For more detailed, full install and setup guides for Ghost, make sure you check out the specific install documentation for your platform of choice."
