["https://ghost.org/abuse"]
title = "Report Abuse - Ghost.org"
description = "Open source technology for fiercely independent publishers. Use Ghost to run a modern publication where you own the platform & control your content"
full_description = "Report AbuseGhost is a freely-released open source publishing platform which anyone can download and use to share their opinions, ideas or viewpoints without intervention, on their own website. Our technology is decentralised, independent software which does not promote, expose or assist any particular content — nor do we have any control or ability to censor, or moderate what is published. The majority of Ghost websites in the world are not hosted by us.Unacceptable Use — Ghost(Pro)On our own hosting service - called Ghost(Pro) - we allow all types of content by default. Exceptions to this are listed below, and are explicitly forbidden from our services.Illegal content and conduct - Anything which breaks the law will be immediately suspended.Overburdening resources - Ghost(Pro) is a shared service. Usage (excluding natural traffic) that impacts our ability to provide a service to others isn't ok.Intellectual property infringement - Misuse of copyrighted or protected materials, unless referenced for fair use, will be immediately removed from our service.Gambling - Discussing gambling is fine. But operating a gambling service, promoting gambling products, or advertising gambling companies is not allowed on Ghost(Pro).Technologically harmful content - Users may not upload or link to malware, spyware, adware, or other malicious or destructive code on their Ghost websites.Impersonation - Seriously pretending to be someone else, without satire or parody.Calls to violence - Content which directly threatens, incites, or promotes violence, physical harm, or death. This includes threats targeting individuals or groups, as well as other indiscriminate acts of violence.Posting private information - Sharing someone’s personal information without their consent, including but not limited to home addresses, phone numbers, account passwords and credit card numbers.Hotlinking - Using a Ghost site to host files which are being linked to from an external domain.Spam content - Sites such as those primarily dedicated to drive traffic to third party sites, boost SEO, phish, spoof, or promote affiliate marketing are not permitted on Ghost(Pro).Machine-generated content - Ghost(Pro) is a community of human creators, we don't host sites for AIs or bots.Keep in mind that these are just guideline descriptions — and actual interpretations are solely up to us, on a case-by-case basis. These guidelines are not exhaustive and are subject to change.Making a ReportIf you believe a site hosted on Ghost(Pro) is violating these guidelines or our Terms of Service, please report it to report@ghost.org. We aim to promptly review and investigate all complaints that we receive, but if and how we respond will depend on a variety of factors, such as the information available to us and the type of violation. We may also contact the site owner to inform them of the complaint.If we receive a complaint and aren't in a position to make a determination (for example whether something is defamatory or not), we will defer to the judgment of a court. Please forward any legal process relating to a site hosted on Ghost(Pro) to report@ghost.org.We cannot act on complaints made about sites that are not hosted on Ghost(Pro).Complaint handlingWhen we receive a report about a Ghost(Pro) site, it is reviewed by several team members. If we find that the site is violating these guidelines or our Terms of Service, we will take further action. We will reach out via email to confirm the steps we are taking and why. We will use the Account Owner email address that has been provided to us for this purpose. Action taken can range from taking steps to bring the site in line with our policies to removing the site from Ghost(Pro). We do not provide refunds when services are suspended or cancelled due to violations of our policies.If we receive a complaint and aren't in a position to make a determination (for example whether something is defamatory or not), we will defer to the judgment of a court. Please forward any legal process relating to a site hosted on Ghost(Pro) to report@ghost.org."
