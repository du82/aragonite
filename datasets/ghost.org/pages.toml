full_description = '''← Changelog Jun 6, 2024 New Subtitles in newsletters Add a subtitle to highlight key points and engage your readers Source: Platformer.news Lots of Ghost themes use the excerpt field as a subtitle on posts, including our default Source theme. After listening to feedback from publishers, we’ve added an optional setting in the newsletter template to include the post excerpt. Now it's simple for your newsletter to match your site.Here's how to enable it:Navigate to Settings → Newsletters → Design and toggle on the "Post excerpt" field. 0:00 /0:07 1× P.S. – We’re experimenting with ways for you to customize the editor based on how you like to write — starting with adding the excerpt inline as a subtitle. To try it, navigate to Settings → Labs to toggle on the beta feature. Feedback on this? Are there other customizations that would make your writing experience better? Let us know at feedback@ghost.org.Ghost(Pro) users can log in and start enjoying all of this right away! If you're a developer, self-hosting Ghost, you'll need to update to the latest version to get access to everything that's new. Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved'''
