["https://ghost.org/docs/ghost-cli"]
title = "Ghost-CLI - A fully loaded tool for installation and configuration"
description = "The best way to install, manage, and update your site locally or when self-hosting Ghost. A full guide for our advanced CLI tool."
full_description = '''Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Ghost CLI /Ghost CLIA fully loaded tool to help you get Ghost installed and configured and to make it super easy to keep your Ghost install up to date.Ghost-CLI is to makes it possible to install or update Ghost with a single command. In addition, it performs useful operations to assist with maintaining your environment, such as:Checking for common environment problemsCreating a logical folder structureProviding for production or development installsAllowing for upgrades and rollbacksHandling user management and permissionsConfiguring GhostConfiguring NGINXSetting up MySQLConfiguring systemdAccessing Ghost log filesManaging existing Ghost installsInstall & updateGhost-CLI is an npm module that can be installed via either npm.# On a production server using a non-root user: sudo npm install -g ghost-cli@latest Locally, you likely don’t need sudo. Using @latest means this command with either install or update ghost-cli and you only have to remember the one command for both ✨Useful optionsThere are some global flags you may find useful when using ghost-cli:# Output usage information for Ghost-CLI ghost --help, ghost -h, ghost help, ghost [command] --help # Enables the verbose logging output for debugging ghost --verbose, ghost -V # Print your CLI version and Ghost version ghost --version, ghost -v, ghost version # Run the command in a different directory ghost --dir path/to/directory # Runs command without asking for any input ghost --no-prompt # Runs command without using colours ghost --no-color CommandsBelow are the available commands in Ghost-CLI. You can always run ghost --help or ghost [command] --help to get more detail, or inline help for available options.Ghost configghost config accepts two optional arguments: key and value. Here are the three different combinations and what happens on each of them:# Create a new config file for the particular env ghost config # Find and return the value in the config for the key passed ghost config [key] # Set a key and a value in the config file ghost config [key] [value] # Set the url for your site ghost config url https://mysite.com The ghost config command only affects the configuration files. In order for your new config to be used, run ghost restart.OptionsIf you’re using ghost config to generate a configuration file, you can supply multiple key-value pairs in the form of options to avoid being prompted for that value.All of these options can also be passed to ghost install and ghost setup , as these commands call ghost config.See the config guide or run ghost config --help for more detailed information.Application options# URL of the site including protocol --url https://mysite.com # Admin URL of the site --admin-url https://admin.mysite.com # Port that Ghost should listen on --port 2368 # IP to listen on --ip 127.0.0.1 # Transport to send log output to --log ["file","stdout"] Database options# Type of database to use (SQLite3 or MySQL) --db # For SQLite3 we just need a path to database file --dbpath content/data/ghost_dev.db # For MySQL we need full credentials: --dbhost localhost # Database user name --dbuser ghost # Database password --dbpass **** # Database name --dbname ghost_dev Mail options# Mail transport, E.g SMTP, Sendmail or Direct --mail SMTP # Mail service (used with SMTP transport), E.g. Mailgun, Sendgrid, Gmail, SES... --mailservice Mailgun # Mail auth user (used with SMTP transport) --mailuser postmaster@something.mailgun.org # Mail auth pass (used with SMTP transport) --mailpass **** # Mail host (used with SMTP transport) --mailhost smtp.eu.mailgun.org # Mail port (used with SMTP transport) --mailport 465 Service options# Process manager to run with (local, systemd) --process local DebuggingIn order for your new config to be used, run ghost restart.Ghost installThe ghost install command is your one-stop-shop to get a running production install of Ghost.This command includes the necessary mysql, nginx and systemd configuration to get your publication online, and provides a series of setup questions to configure your new publication. The end result is a fully installed and configured instance ✨Not ready for production yet? ghost install local installs ghost in development mode using sqlite3 and a local process manager. Read more about local installs.How it worksThe ghost install command runs a nested command structure, but you only ever have to enter a single command.First, it will run ghost doctor to check your environment is compatible. If checks pass, a local folder is setup, and Ghost is then downloaded from npm and installed.Next, ghost setup runs, which will provide prompts for you to configure your new publication via the ghost config command, including creating a MySQL user, initialising a database, configure nginx and sets up SSL.Finally, the CLI will prompt to see if you want to run Ghost and if you choose yes ghost start will run.Arguments# Install a specific version (1.0.0 or higher) ghost install [version] # Install version 2.15.0 ghost install 2.15.0 # Install locally for development ghost install local # Install version 2.15.0, locally for development ghost install 2.15.0 --local OptionsAs ghost install runs nested commands, it also accepts options for the ghost doctor, ghost config, ghost setup and ghost start commands.See the individual command docs, or run ghost install --help for more detailed information.# Get more information before running the command ghost install --help # Install in development mode for a staging env ghost install --development, ghost install -D # Select the directory to install Ghost in ghost install --dir path/to/dir # Install Ghost from a specific archive (useful for testing or custom builds) ghost install --archive path/to/file.tgz # Disable stack checks ghost install --no-stack # Install without running setup ghost install --no-setup # Install without starting Ghost ghost install --no-start # Tells the process manager not to restart Ghost on server reboot ghost setup --no-enable # Install without prompting (disable setup, or pass all required parameters as arguments) ghost install --no-prompt Directory structureWhen you install Ghost using Ghost-CLI, the local directory will be setup with a set of folders designed to keep the various parts of your install separate. After installing Ghost, you will have a folder structure like this which should not be changed:. ├── .config.[env].json # The config file for your Ghost instance ├── .ghost-cli # Utility system file for Ghost CLI, don't modify ├── /content # Themes/images/content, not changed during updates ├── /current # A symlink to the currently active version of Ghost ├── /system # NGINX/systemd/SSL files on production installs └── /versions # Installed versions of Ghost available roll forward/back to Ghost setupghost setup is the most useful feature of Ghost-CLI. In most cases you will never need to run it yourself, as it’s called automatically as a part of ghost install.How it worksSetup configures your server ready for running Ghost in production. It assumes the recommended stack and leaves your site in a production-ready state. Setup is broken down into stages:mysql - create a specific MySQL user that is used only for talking to Ghost’s database.nginx - creates an nginx configurationssl - setup SSL with letsencrypt, using acme.shmigrate - initialises the databaselinux-user - creates a special low-privilege ghost user for running GhostWhat if I want to do something else?The Ghost-CLI tool is designed to work with the recommended stack and is the only supported install method. However, since Ghost is a fully open-source project, and many users have different requirements, it is possible to setup and configure your site manually.The CLI tool is flexible and each stage can be run individually by running ghost setup <stage-name> or skipped by passing the --no-setup-<stage-name> flag.Arguments# Run ghost setup with specific stages ghost setup [stages...] # Creates a new mysql user with minimal privileges ghost setup mysql # Creates an nginx config file in `./system/files/` and adds a symlink to `/etc/nginx/sites-enabled/` ghost setup nginx # Creates an SSL service for Ghost ghost setup ssl # Create an nginx and ssl setup together ghost setup nginx ssl # Creates a low-privileged linux user called `ghost` ghost setup linux-user # Creates a systemd unit file for your site ghost setup systemd # Runs a database migration ghost setup migrate OptionsAs ghost setup runs nested commands, it also accepts options for the ghost config, ghost start and ghost doctor commands. Run ghost setup --help for more detailed information.# Skips a setup stage ghost setup --no-setup-mysql ghost setup --no-setup-nginx ghost setup --no-setup-ssl ghost setup --no-setup-systemd ghost setup --no-setup-linux-user ghost setup --no-setup-migrate # Configure a custom process name should be (default: ghost-local) ghost setup --pname my-process # Disable stack checks ghost setup --no-stack # Setup without starting Ghost ghost setup --no-start # Tells the process manager not to restart Ghost on server reboot ghost setup --no-enable # Install without prompting (must pass all required parameters as arguments) ghost setup --no-prompt Ghost startRunning ghost start will start your site in background using the configured process manager. The default process manager is systemd, or local for local installs.The command must be executed in the directory where the Ghost instance you are trying to start lives, or passed the correct directory using the --dir option.Options# Start running the Ghost instance in a specific directory ghost start --dir /path/to/site/ # Start ghost in development mode ghost start -D, ghost start --development # Tells the process manager to restart Ghost on server reboot ghost start --enable # Tells the process manager not to restart Ghost on server reboot ghost start --no-enable # Disable memory availability checks in ghost doctor ghost start --no-check-mem DebuggingIf running ghost start gives an error, try use ghost run to start Ghost without using the configured process manager. This runs Ghost directly, similar to node index.js. All the output from Ghost will be written directly to your terminal, showing up any uncaught errors or other output that might not appear in log files.Ghost stopRunning ghost stop stops the instance of Ghost running in the current directory. Alternatively it can be passed the name of a particular ghost instance or directory. You can always discover running Ghost instances using ghost ls.Arguments# Stop Ghost in the current folder ghost stop # Stop a specific Ghost instance (use ghost ls to find the name) ghost stop [name] # Stop the Ghost instance called ghost-local ghost stop ghost-local Options# Stop all running Ghost instances ghost stop --all # Stop running the Ghost instance in a specific directory ghost stop --dir /path/to/site/ # Tells the process manager that Ghost should not start on server reboot ghost stop --disable Ghost restartRunning ghost restart will stop and then start your site using the configured process manager. The default process manager is systemd, or local for local installs.The command must be executed in the directory where the Ghost instance you are trying to start lives, or passed the correct directory using the --dir option.Options# Start running the Ghost instance in a specific directory ghost restart --dir /path/to/site/ DebuggingIf running ghost restart gives an error, try using ghost run to debug the error.Ghost updateRun ghost update to upgraded to new versions of Ghost, which are typically released every 1-2 weeks.Arguments# Update to the latest version ghost update # Update to a specific version (1.0.0 or higher) ghost update [version] # Update to version 2.15.0 ghost update 2.15.0 Options# If an upgrade goes wrong, use the rollback flag ghost update --rollback # Install and re-download the latest version of Ghost ghost update --force # Force install a specific version of Ghost ghost update [version] --force # Updates to the latest within v1 ghost update --v1 # Don't restart after upgrading ghost update --no-restart # Disable the automatic rollback on failure ghost update --no-auto-rollback # Upgrade Ghost from a specific zip (useful for testing or custom builds) ghost update --zip path/to/file.zip # Disable memory availability checks in ghost doctor ghost update --no-check-mem Major updatesEvery 12-18 months we release a major version which breaks backwards compatibility and requires a more involved upgrade process, including backups and theme compatibility.Use the update documentation as a guide to the necessary steps for a smooth upgrade experience.DebuggingIf running ghost update gives an error, try using ghost run to debug the error.Ghost backupRun ghost backup to generate a zip file backup of your site data.How it worksWhen performing manual updates it’s recommended to make frequent backups, so if anything goes wrong, you’ll still have all your data. This is especially important when updating to the latest major version.This command creates a full backup of your site data, including:Your content in JSON formatA full member CSV exportAll themes that have been installed including your current active themeImages, files, and media (video and audio)A copy of routes.yaml and redirects.yaml or redirects.jsonRead more about how to manually download your site data.Ghost doctorRunning ghost doctor will check the system for potential hiccups when installing or updating Ghost.This command allows you to use ghost-cli as a diagnostic tool to find potential issues for your Ghost install, and provides information about what needs to be resolved if any issues arise.The CLI automatically runs this command when installing, updating, starting or setting up ghost - and you can use is manually with ghost doctor.Arguments# Check is the required config file exists and validates it's values ghost doctor startup # Check if the setup process was successful ghost doctor setup OptionsRun ghost doctor --help for more detailed information. # Disable the memory availability checks ghost doctor --no-check-mem Ghost lsThe ghost ls command lists all Ghost sites and their status from the ~/.ghost/config file. This is useful if you can’t remember where you installed a particular instance of Ghost, or are working with multiple instances (local, production, staging and so on).Output# Development > ghost ls ┌───────────'''
