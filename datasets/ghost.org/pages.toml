["https://ghost.org/integrations/ulysses"]
title = "Official Ghost + Ulysses Integration"
description = "Use Ulysses to write with focus on Mac, iPad and iPhone and export your content directly to your Ghost publication with a direct integration."
full_description = "Integrations / WritingCreate content with Ulysses and publish directly to your Ghost publication with a time-saving integrationUlysses is a focused writing app for Mac, iPad and iPhone, with document management, fast syncing and flexible exports. Ulysses has a direct integration with Ghost via our API, so it’s possible to connect your Ghost site and publish your writing to the world in minutes.Here’s how it works:Use the publishing export optionOnce you’ve created some content in Ulysses and you’re ready to port it over to Ghost, use the publishing export option from the top navigation menu, select Publishing:From the Publishing options, select Ghost:Connect your Ghost publicationIn order to send your writing to your Ghost site now and in the future, you’ll need to enter your Ghost site URL and your Staff Access Token (located within your Staff user profile, in Ghost Admin).✅ Remember to enter your domain as yoursite.ghost.io and not a custom domain.Select your publishing optionsNow when you hit the export button, you’ll see an option to export your to your Ghost publication.Click Publish and select your publishing options as you would normally in Ghost:If you’re using an iOS version of the Ulysses app, you can create the exact same workflow and send your content to Ghost from iPhone or iPad on the go.Publish your writing to GhostThat’s it! Once you’re happy, hit publish and your content will appear in Ghost Admin, or if you’ve chosen to publish it right away, it will be live on your site 🎉Your Ghost site is now connected to Ulysses, so next time you need to export your content to Ghost you can get the job done in just a few clicks."
