["https://ghost.org/docs/members"]
title = "Memberships – Ghost Developer Docs"
description = "The native Members feature in Ghost makes it possible to launch a membership business from any Ghost publication, with member signup and paid subscriptions built-in."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Members /MembershipsThe native Members feature in Ghost makes it possible to launch a membership business from any Ghost publication, with member signup, paid subscriptions and email newsletters built-in.OverviewAny publisher who wants to offer a way for their audience to support their work can use the Members feature to share content, build an audience, and generate an income from a membership business.The concepts and components that enable you to turn a Ghost site into a members publication are surprisingly simple and can be broken down into two concepts:1. MembershipsA member of a Ghost site is someone who has opted to subscribe, and confirmed their subscription by clicking the link sent to their inbox. Members are stored in Ghost, to make tracking, managing and supporting an audience a breeze.Secure authenticationGhost uses passwordless JWT email-link based logins for your members. It’s fast, reliable, and incredible for security. Secure email authentication is used for both member sign up and sign in.Access levelsOnce a visitor has entered their email address and confirmed membership, you can share protected content with them on your Ghost publication. Logged in members are able to access any content that matches their tier.The following access levels are available to select from the post settings in the editor:PublicMembers onlyPaid-members onlySpecific tier(s)Content is securely protected at server level and there is no way to circumvent gated content without being a logged-in member.Managing membersMembers are stored in Ghost with the following attributes:email (required)namenotesubscribed_to_emailsstripe_customer_idstatus (free/paid/complimentary)labelscreated_atImportsIt’s possible to import Members from any other platform. If you have a list of email addresses, this can be ported into Ghost via CSV, Zapier, or the API.2. SubscriptionsMembers in Ghost can be free members, or become paid members with a direct Stripe integration for fast, global payments.Connect to StripeWe’ve built a direct integration with Stripe which allows publishers to connect their Ghost site to their own billing account using Stripe Connect.Payments are handled by Stripe and billing information is stored securely inside your own Stripe account.Transaction feesGhost takes 0% of your revenue. Whatever you generate from a paid blog, newsletter or community is yours to keep. Standard Stripe processing fees still apply.PortabilityAll membership, customer and business data is controlled by you. Your members list can be exported any time and since subscriptions and billing takes place inside your own Stripe account, you retain full ownership of it.If you’re migrating an existing membership business from another platform, check our our migration docs.Alternative payment gatewaysTo begin with, Stripe is the only natively supported payment provider with Ghost. We’re aware that not everyone has access to Stripe, and we plan to add further payment providers in future.In the meantime, it is possible to create new members via an external provider, such as Patreon or PayPal. You can set up any third party payments system and create members in Ghost via API, or using automation tools like Zapier.I have ideas / suggestions / problems / feedbackGreat! We set up a dedicated forum category for feedback about the members feature, we appreciate your input!We’re continuously shipping improvements and new features at Ghost which you can follow over on GitHub, or on our Changelog.On this page"
year_published = 2025
