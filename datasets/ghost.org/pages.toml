["https://ghost.org/changelog/activitypub-alpha"]
title = "Joining the ActivityPub network"
description = "Ghost is federating over ActivityPub to become part of the world’s largest publishing network."
full_description = "← Changelog Apr 22, 2024 Alpha Joining the ActivityPub network Ghost is federating over ActivityPub to become part of the world’s largest publishing network. For the past few years, networked publishing has become an increasingly hot topic. Various platforms have allowed writers to follow, like and reply to posts from one another - making writing on the internet an altogether more social experience.The problem, though, has always been that those networks have been closed, proprietary, and limited in their utility and longevity. We've all seen what happens when networks either run out of money, or get commandeered by people with... too much money.At Ghost we've been interested in publishing networks for a long time, but as you have come to expect from us after over a decade of releasing open, decentralized technology that puts people first: We're doing things in our own way.Building ActivityPubGhost is federating over ActivityPub to become part of the world’s largest publishing network.Building ActivityPubWe're excited to share that we've started work on bringing ActivityPub support to Ghost, making it possible for all Ghost publishers to distribute their work across to the largest decentralized network in the world.It's going to take some time for us to ramp up our efforts here, but we're going to be sharing our build diary and all the details with you as we go.We've put together a full overview of what this means for you, and we're looking forward to hearing what you think! Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved"
