["https://ghost.org/docs/themes/contexts"]
title = "Context Overview: Ghost Themes - Documentation"
description = "Ghost themes use contexts to determine how to render pages on a publication. Learn more about contexts and building your own custom theme!"
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Themes / Contexts /ContextsEach page in a Ghost theme belongs to a context, which determines which template is used, what data will be available and what content is output by the {{body_class}} helper.A Ghost publication follows a structure that allows URLs or routes to be mapped to views which display specific data. This data could be a list of posts, a single post or an RSS feed. It is the route that determines what data is meant to be shown and what template is used to render it.Rather than providing access to all data in all contexts, Ghost optimises what data is fetched using contexts to ensure publications are super fast!Using contextsContexts play a big part in the building blocks of a Ghost theme. Besides determining what data is available and what template to render, contexts also interact with handlebars helpers, since the context also determines what dynamic data the helper outputs.For example, the {{meta_title}} helper outputs different things based on the current context. If the context is post then the helper knows it can use post.meta_title and in a tag context it uses tag.meta_title.To detect a context in your theme, use the {{#is}} helper. For example, in a partial template that is shared between many contexts, using {{#is}} passes it a context and only executes the contained block when it is in that context.List of contextsindexpagepostauthortagerrorOn this page"
year_published = 2025
