title = "Ghost for Creators: Turn your audience into a business"
description = "The all-in-one platform used by creators to run a website, collect signups, publish private content, collect payments, and send email newsletters."
full_description = "Be part of the creator economy.Ghost is an all-in-one platform for creators to run their own website, collect user signups, publish private content, collect payments, and send email newsletters.Get started now — free“You should be using Ghost because it’s absolutely amazing and I love it. It’s what I’ve been using for all my sites since 2016.”— Ali Abdaal Ali Abdaal 5M+ SubscribersDon’t let algorithms get in the way of who sees your work. Create your own platform.A powerful editing workflow.Whether you're sharing writing, photography, videos, podcasts, or something else - the Ghost editor makes it easy to compose and publish anything you like.Ready player two.Create separate staff accounts for the whole team, so you can collaborate and add bylines to all your posts.Your audience. Your data.Ghost is an independent platform where creators own all rights and access to 100% of their data. You control what happens.Premium tiers — 0% fees.Publish private content exclusively for paying members. Offer unique benefits so you can generate revenue to support your work. Everything you earn is yours to keep, Ghost doesn't take payment fees.Show off your own unique style.Choose from hundreds of free or premium themes for your own website, on your own domain name, with your own branding. Stand out from everyone else, so your audience remember you.“I switched to Ghost a year ago, and it’s just... such a joy to use. I love having the website, member platform, and email tool all in one place.”—Caro Griffin, Opsy WorkJoin thousands of creators using Ghost to share their work, and grow communities.Gone With The WynnsSail alongside a couple of explorers, modern-day documentarians, and cultivators of curiosity without getting wet.https://www.gonewiththewynns.com→HNGRYMatt Newberg examines a world where technology shapes the way we eat. Stay steps ahead of the food tech revolution with exclusive scoops, trend reports, videos, events, and more.https://hngry.tv→The WhippetRead intellectually engaging stuff in a newsletter of science, history, weirdness & 0% recent politics, by Australian based writer McKinley Valentine.https://thewhippet.org→Cartoon GravityJulian Simpson is a creator of audio, TV and film (Lovecraft Investigations, Who Is Aldrich Kemp? etc.) This is his brain on public display.https://www.cartoongravity.com→DESKFounded by award-winning designer Tobias Van Schneider in early 2016 to cover stories of design, psychology and productivity. A design blog that is actually written by designers. No bullshit.https://vanschneider.com→SnipetteAn exploration of curiosities in life with unique stories about science, technology, philosophy and more. Created by founding editors Manasa and Badri, along with 50+ contributing authors.https://www.snipettemag.com→“The smoother & simpler the writing experience is, the more motivated I feel to write. Ghost makes me want to draft my articles straight inside their app.”—Tobias Van Schneider, DESKShe's A BeastA lot of health content is focused on blowing smoke up your ass about jade eggs and vitamins and “toxin-dispersing cellulite-curing silver-thread leggings”; this is the opposite of that.https://www.shesabeast.co→Scope Of WorkFounded by Spencer Wright in 2013, Scope of Work focuses on people working on real problems in the physical world of engineering, manufacturing, and infrastructure.https://www.scopeofwork.net→3D SnippetsA vibrant community dedicated to 3D art, with tutorials, workshops, projects and guides creating a polished 3D project every month, by Pablo Munoz Gomez.https://3dsnippets.com→Better Letters MagazineAn online and print publication to inspire and inform the international sign painting community by celebrating exciting work and sharing knowledge and resources.https://bl.ag→Troy HuntFounder of Have I Been Pwnd, Troy Hunt publishes weekly updates surrounding the world of cyber security and an occasional sprinkle of home automation.https://troyhunt.com→Maker StationsAn online magazine and free weekly newsletter featuring high-quality, in-depth interviews with creators and makers about their workspaces.https://makerstations.io→$8/ monthstandard shape-cube For people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentsSubscribe Now20% Annual Discount$59/ yearpremiumFor people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentscheck-circle-1Support indie publishingcheck-circle-1Advertising-free!Subscribe NowForecastHow much could you earn?Whether you prefer a large audience at a low price point or a small dedicated following at a premium fee, you control the economics.See how much you could earn with a subscription commerce publication: members Number of members$ / month Price per month$your annual recurring revenueHow does this work?Unlike other membership systems which typically take 10-30% of your revenue, Ghost takes no fee at all and instead connects directly to your own Stripe account, so you receive the money - not us. You own the software and you own the billing account, so there's no middleman between you and your customers. Stripe takes a ~2.9% processing fee, and all other revenue is yours to keep.Building a subscription business is challenging in lots of ways. Our focus is on making the billing side as easy as possible - so you can keep your focus on your customers."
