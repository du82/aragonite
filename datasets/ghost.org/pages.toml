["https://ghost.org/docs/themes/search"]
title = "Ghost Theme Development: Adding search to a theme"
description = "Find out how to add search to a custom Ghost theme using data attributes 👉"
full_description = 'Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Themes / Search /SearchGhost has a native search feature that can be accessed via URL or implemented directly into themes using a single data attribute.The easiest way to get started with search is by adding a #/search URL to the navigation or anywhere on the site. Beyond that, it’s also possible to implement search directly into a theme using a data attribute.Implementing Search in themesThe quickest way is to use the {{search}} helper to output a button with a search icon. See the helper docs for more details.Alternatively, add the data-ghost-search data attribute to any element in the theme. Here’s an example from the default theme Casper:<button class="gh-search" data-ghost-search>{{> "icons/search"}}</button> Both methods allow visitors to search content by clicking on the element to open the search modal or by using the shortcut Cmd/Ctrl + K.Technical detailsTaxonomies for tags and authors must be present for search results to include tags and authorsThe post title and excerpt are used to search post content from the most recent 10,000 posts. (Excerpts are excluded for member-only posts)Create an advanced search index using AlgoliaIf you have a large site with more than 10,000 posts, a complex data structure, or require advanced search functionality, we recommend using Algolia.Ghost has open-source tools to pre-populate the Algolia search index and keep the index updated using webhooks and Netlify Functions.Populating the indexTo make full use of Algolia from the start, you can pre-populate the search index. Algolia Ghost CLI is a tool that creates fragments of content from your Ghost site and adds them to your Algolia search index.Follow the documentation for Algolia Ghost CLI to pre-populate your Algolia search index.Setting up Algolia NetlifyThe best way to keep your Algolia search index updated with new and edited content is to use Netlify Functions, which listen to and processes webhook events and instruct Algolia to index, reindex, or unindex a URL. Once set up, it will automatically keep the search index up to date.You can deploy and configure the Algolia Netlify package to Netlify in the browser.On this page'
year_published = 2025
clearnet = "https://ghost.org/docs/themes/search"
