["https://ghost.org/docs/security"]
title = "Ghost Security & Privacy"
description = "Ghost is committed to developing secure, reliable products utilising all modern security best practices. Find out more about Ghost security and privacy."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Security /Ghost SecurityGhost is committed to developing secure, reliable products utilising all modern security best practices and processes.The Ghost security team is made up of full time staff employed by the Ghost Foundation as well as volunteer open source contributors and security experts. We do both consultation and penetration testing of our software and infrastructure with external security researchers and agencies.We take security very seriously at Ghost and welcome any peer review of our completely open source codebase to help ensure that it remains completely secure.Security featuresAutomatic SSLGhost’s CLI tool attempts to automatically configure SSL certificates for all new Ghost installs with Let’s Encrypt by default. In 2019 we intend to make SSL mandatory for all new installs.Standardised permissionsGhost-CLI does not run as root and automatically configures all server directory permissions correctly according to OWASP Standards.Brute force protectionUser login attempts and password reset requests are all limited to 5 per hour per IP.Data validation and serialisationGhost performs strong serialisation and validation on all data that goes into the database, as well as automated symlink protection on all uploaded files.Encoded tokens everywhereAll user invitation and password reset tokens are base64 encoded with serverside secret. All tokens are always single use and always expire.Password hashingGhost follows OWASP authentication standards with all passwords hashed and salted properly using bcrypt to ensure password integrity.SQLi preventionGhost uses Bookshelf ORM + Knex query builder and does not generate any of its own raw SQL queries. Ghost has no interpolation of variables directly to SQL strings.XSS preventionGhost uses safe/escaped strings used everywhere, including and especially in all custom Handlebars helpers used in Ghost ThemesDependency managementAll Ghost dependencies are continually scanned using a combination of automated GitHub tooling and yarn audit to ensure their integrity.Reporting vulnerabilitiesPotential security vulnerabilities can be reported directly to us at security@ghost.org. The Ghost Security Team communicates privately and works in a secured, isolated repository for tracking, testing, and resolving security-related issues.Responsible disclosureThe Ghost Security team is committed to working with security researchers to verify, reproduce and respond to legitimate reported vulnerabilities.Provide details of the vulnerability, including information needed to reproduce and validate the vulnerability and a Proof of ConceptMake a good faith effort to avoid privacy violations, destruction and modification of data on live sitesGive reasonable time to correct the issue before making any information publicSecurity issues always take precedence over bug fixes and feature work. We can and do mark releases as “urgent” if they contain serious security fixes.We will publicly acknowledge any report that results in a security commit to https://github.com/TryGhost/GhostIssue triageWe’re always interested in hearing about any reproducible vulnerability that affects the security of Ghost users, including…Remote Code Execution (RCE)SQL Injection (SQLi)Server Side Request Forgery (SSRF)Cross Site Request Forgery (CSRF)Cross Site Scripting (XSS) but please read on before reporting XSS…However, we’re generally not interested in…Privilege escalation as result of trusted users publishing arbitrary JavaScript1HTTP sniffing or HTTP tampering exploitsOpen API endpoints serving public dataGhost version number disclosureBrute force, DoS, DDoS, phishing, text injection, or social engineering attacks.Output from automated scansClickjacking with minimal security implicationsMissing DMARC recordsPrivilege escalation attacksGhost is a content management system and all users are considered to be privileged/trusted. A user can only obtain an account and start creating content after they have been invited by the site owner or similar administrator-level user.A basic feature of Ghost as a CMS is to allow content creators to make use of scripts, SVGs, embedded content & other file uploads that are required for the content to display as intended. Because of this there will always be the possibility of “XSS” attacks, albeit only from users that have been trusted to build the site’s content.Ghost’s admin application does a lot to ensure that unknown scripts are not run within the the admin application itself, however that only protects one side of a Ghost site. If the front-end (the rendered site that anonymous visitors see) shares the same domain as the admin application then browsers do not offer sufficient protections to prevent successful XSS attacks by trusted users.If you are concerned that trusted users you invite to create your site will act maliciously the best advice is to split your front-end and admin area onto different domains (e.g. https://mysite.com and https://admin.mysite.com/ghost/). This way browsers offer greater built-in protection because credentials cannot be read across domains. Even in this case it should be understood that you are giving invited users completely free reign in content creation so absolute security guarantees do not exist.Anyone concerned about the security of their Ghost install should read our hardening guide.We take any attack vector where an untrusted user is able to inject malicious content very seriously and welcome any and all reports.How reports are handledIf you report a vulnerability to us through the security@ghost.org mailing list, we will:Acknowledge your email within a weekInvestigate and let you know our findings within two weeksEnsure any critical issues are resolved within a monthEnsure any low-priority issues are resolved within three monthsCredit any open source commits to youLet you know when we have released fixes for issues you reportPrivacyGhost as an organisation is self-funded, wholly independent, and only makes revenue directly from its customers. It has zero business interests of any kind predicated on selling private user data.In addition the Ghost software itself contains a plainly written summary of every privacy-affecting feature within Ghost, along with detailed configuration options allowing any and all of them to be disabled at will. We take user privacy seriously.On this page"
