full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Themes / Helpers /HelpersHelpers add additional functionally to Handlebars, the templating language Ghost themes use.Functional helpersFunctional helpers are used to work with data objects. Use this reference list to discover what each handlebars helper can do when building a custom Ghost theme.TagDescriptionforeachLoop helper designed for working with lists of postsgetSpecial block helper for custom querieshasLike {{#if}} but with the ability to do more than test a booleanifTest very simple conditionalsisCheck the context of the current routematchCompare two values for equalityunlessThe opposite of {{#if}}Data helpersData helpers are used to output data from your site. Use this reference list to discover what each handlebars helper can do when building a custom Ghost theme.TagDescription@configProvides access to global data properties@customProvides access to custom theme settings@pageProvides access to page settings@siteProvides access to global settings@memberProvides access to member dataauthorsOutputs the post author(s)commentsOutputs Ghost's member-based commenting systemcontentOutputs the full post content as HTMLdateOutputs the date in a format of your choosingexcerptOutputs the custom excerpt, or the post content with HTML strippedfacebookOutputs the full URL to the Facebook profile from Settingsimg_urlOutputs the correctly calculated URL for the provided image propertylinkCreates links with dynamic classesnavigationHelper which outputs formatted HTML for navigation linkspostMore object than helper – Contains all data for a specific postpriceOutputs a price with formatting optionsreadable_urlReturns a human-readable URLrecommendationsOutputs a list of recommended sitestagsOutputs the post tagstiersOutputs the post tier(s)titleThe post title, when inside the post scopetotal_membersOutputs the number of members, rounded and humanisedtotal_paid_membersOutputs the number of paying members, rounded and humanisedtwitterOutputs the full URL to the Twitter profile from SettingsurlThe post URL, when inside the post scopeUtility helpersUtility helpers are used to perform minor, optional tasks. Use this reference list to discover what each handlebars helper can do when building a custom Ghost theme.TagDescriptionassetOutputs cachable and cache-busting relative URLs to various asset typesblockUsed along with {{contentFor}} to pass data up and down the template hierarchybody_classOutputs dynamic CSS classes intended for the <body> tagconcatConcatenate and link multiple things togetherencodeEncode text to be safely used in a URLghost_head / ghost_footOutputs vital system information at the top and bottom of the documentlink_classAdd dynamic classes depending on the currently viewed pagelogIn development mode, output data in the consolepaginationHelper which outputs formatted HTML for pagination linkspartialsInclude chunks of reusable template codepluralOutput different text based on a given inputpost_classOutputs classes intended for your post containerprev_post / next_postWithin the post scope, returns the URL to the previous or next postreading_timeRenders the estimated reading time for a postsearchOutput a working, pre-styled search button & icontranslateOutput text in your site language (the backbone of i18n)On this page"
