["https://ghost.org/docs/config"]
title = "Configuration - Adapt your publication to suit your needs"
description = "Find out how to configure your Ghost publication or override Ghost's default behaviour with robust config options, including mail, storage, scheduling and more!"
full_description = '''Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Config /ConfigurationFor self-hosted Ghost users, a custom configuration file can be used to override Ghost’s default behaviour. This provides you with a range of options to configure your publication to suit your needs.OverviewWhen you install Ghost using the supported and recommended method using ghost-cli, a custom configuration file is created for you by default. There are some configuration options which are required by default, and many optional configurations.The three required options are url and database which are configured during setup, and mail which needs to be configured once you’ve installed Ghost.This article explains how to setup your mail config, as well as walk you through all of the available config options.Custom configuration filesThe configuration is managed by nconf. A custom configuration file must be a valid JSON file located in the root folder and changes to the file can be implemented using ghost restart.Since Node.js has the concept of environments built in, Ghost supports two environments: development and production. All public Ghost publications run in production mode, while development mode can be used to test or build on top of Ghost locally.Check out the official install guides for development and production.The configuration files reflect the environment you are using:config.development.jsonconfig.production.jsonGhost in developmentIf you would like to start Ghost in development, you don’t have to specify any environment, because development is default. To test Ghost in production, you can use:NODE_ENV=production node index.js If you want to make changes when developing and working on Ghost, you can create a special configuration file that will be ignored in git:config.local.jsonThis file is merged on top of config.development.json so you can use both at the same time.Debugging the configuration outputStart Ghost with:DEBUG=ghost:*,ghost-config node index.js Running Ghost with config env variablesStart Ghost using environment variables which match the name and case of each config option:url=http://ghost.local:2368 node index.js For nested config options, separate with two underscores:database__connection__host=mysql node index.js Configuration optionsThere are a number of configuration options which are explained in detail in this article. Below is an index of all configuration options:NameRequired?DescriptionurlIn productionSet the public URL for your blogdatabaseIn productionType of database used (default: MySQL)mailIn productionAdd a mail serviceadminOptionalSet the protocol and hostname for your admin panelserverOptionalHost and port for Ghost to listen onprivacyOptionalDisable features set in privacy.mdpathsOptionalCustomise internal pathsreferrerPolicyOptionalControl the content attribute of the meta referrer taguseMinFilesOptionalGenerate assets URL with .min notationstorageOptionalSet a custom storage adapterschedulingOptionalSet a custom scheduling adapterloggingOptionalConfigure logging for GhostspamOptionalConfigure spam settingscachingOptionalConfigure HTTP caching settingscompressOptionalDisable compression of server responsesimageOptimizationOptionalConfigure image manipulation and processingopenseaOptionalIncrease rate limit for fetching NFT embeds from OpenSea.iotenorOptionalEnable integration with Tenor.com for embedding GIFs directly from the editortwitterOptionalAdd support for rich Twitter embeds in newslettersportalOptionalRelocate or remove the scripts for PortalsodoSearchOptionalRelocate or remove the scripts for Sodo searchcommentsOptionalRelocate or remove the scripts for commentsURL(Required in production)Once a Ghost publication is installed, the first thing to do is set a URL. When installing using ghost-cli, the install process requests the URL during the setup process.Enter the URL that is used to access your publication. If using a subpath, enter the full path, https://example.com/blog/. If using SSL, always enter the URL with https://.SSLWe always recommend using SSL to run your Ghost publication in production. Ghost has a number of configuration options for working with SSL, and securing the URLs for the admin /ghost/ and the frontend of your publication. Without SSL your username and password are sent in plaintext.ghost-cli prompts to set up SSL during the installation process. After a successful SSL setup, you can find your SSL certificate in /etc/letsencrypt.If you see errors such as access denied from url, then the provided URL in your config file is incorrect and needs to be updated.Database(Required in production)Ghost is configured using MySQL by default:"database": { "client": "mysql", "connection": { "host": "127.0.0.1", "port": 3306, "user": "your_database_user", "password": "your_database_password", "database": "your_database_name" } } Alternatively, you can configure sqlite3:"database": { "client": "sqlite3", "connection": { "filename": "content/data/ghost-test.db" }, "useNullAsDefault": true, "debug": false } Number of connectionsIt’s possible to limit the number of simultaneous connections using the pool setting. The default values are a minimum of 2 and a maximum of 10, which means Ghost always maintains two active database connections. You can set the minimum to 0 to prevent this:"database": { "client": ..., "connection": { ... }, "pool": { "min": 2, "max": 20 } } SSLIn a typical Ghost installation, the MySQL database will be on the same server as Ghost itself. With cloud computing and database-as-a-service providers you might want to enable SSL connections to the database.For Amazon RDS you’ll need to configure the connection with "ssl": "Amazon RDS":"database": { "client": "mysql", "connection": { "host": "your_cloud_database", "port": 3306, "user": "your_database_user", "password": "your_database_password", "database": "your_database_name", "ssl": "Amazon RDS" } } For other hosts, you’ll need to output your CA certificate (not your CA private key) as a single line string including literal new line characters \n (you can get the single line string with awk '{printf "%s\\n", $0}' CustomRootCA.crt) and add it to the configuration:"database": { "client": "mysql", "connection": { "host": "your_cloud_database", "port": 3306, "user": "your_database_user", "password": "your_database_password", "database": "your_database_name", "ssl": { "ca": "-----BEGIN CERTIFICATE-----\nMIIFY... truncated ...pq8fa/a\n-----END CERTIFICATE-----\n" } } } For a certificate chain, include all CA certificates in the single line string:"database": { "client": "mysql", "connection": { "host": "your_cloud_database", "port": 3306, "user": "your_database_user", "password": "your_database_password", "database": "your_database_name", "ssl": { "ca": "-----BEGIN CERTIFICATE-----\nMIIFY... truncated ...pq8fa/a\n-----END CERTIFICATE-----\n-----BEGIN CERTIFICATE-----\nMIIFY... truncated ...wn8v90/a\n-----END CERTIFICATE-----\n" } } } Mail(Required in production)The most important piece of configuration once the installation is complete is to set up mail. Configuring mail allows Ghost to send transactional emails such as user invitations, password resets, member signups, and member login links. With the help of a bulk email service, you can also configure Ghost to send newsletters to members.Ghost uses Nodemailer under the hood, and tries to use the direct mail service if available.We recommend ensuring transactional emails are functional before moving on to bulk mail configuration.Configuring with MailgunMailgun is a service for sending emails and provides more than adequate resources to send bulk emails at a reasonable price. Find out more about using Mailgun with Ghost here.Mailgun allows you to use your own domain for sending transactional emails. Otherwise, you can use a subdomain that Mailgun provides you with (also known as the sandbox domain, limited to 300 emails per day). You can change this at any time.Mailgun is an optional service for sending transactional emails, but it is required for bulk mail — read more.Create a Mailgun accountOnce your site is fully set up create a Mailgun account. After your account is verified navigate to Domain settings under Sending in the Mailgun admin. There you’ll find your SMTP credentials.In addition to this information, you’ll need the password, which can be obtained by clicking the Reset Password button. Keep these details for future reference.Mailgun provides options for using their own subdomains for sending emails, as well as custom domains for a competitive price.Add credentials to config.production.jsonOpen your production config file in any code editor and add the following mail configuration, making sure to update the values to the same credentials shown in your own Mailgun SMTP settings:// config.production.json "mail": { "transport": "SMTP", "options": { "service": "Mailgun", "auth": { "user": "postmaster@example.mailgun.org", "pass": "1234567890" } } }, Once you are finished, hit save and then run ghost restart for your changes to take effect. These same credentials can be used for development environments, by adding them to the config.development.json file.Mailgun provides a sandbox mode, which restricts emails to authorized recipients. Once sandbox mode is enabled, add and verify the email addresses you want to send emails to prior to testing.Secure connectionDepending on your Mailgun settings you may want to force a secure SMTP connection. Update your config.production.json with the following for a secure connection:// config.production.json "mail": { "transport": "SMTP", "options": { "service": "Mailgun", "host": "smtp.mailgun.org", "port": 465, "secure": true, "auth": { "user": "postmaster@example.mailgun.org", "pass": "1234567890" } } }, As always, hit save and run ghost restart for your changes to take effect.Amazon SESIt’s also possible to use Amazon Simple Email Service. Use the SMTP username and password given when signing up and configure your config.[env].json file as follows:"mail": { "transport": "SMTP", "options": { "host": "YOUR-SES-SERVER-NAME", "port": 465, "service": "SES", "auth": { "user": "YOUR-SES-SMTP-ACCESS-KEY-ID", "pass": "YOUR-SES-SMTP-SECRET-ACCESS-KEY" } } } Email addressesDefault email addressGhost uses the value set in mail.from as the default email address:"mail": { "from": "support@example.com", } A custom name can also optionally be provided:"mail": { "from": "'Acme Support' <support@example.com>", } Try to use a real, working email address - as this greatly improves delivery rates for important emails sent by Ghost (Like password reset requests and user invitations). If you have a company support email address, this is a good place to use it.Support email addressWhen setting a custom support email address via Settings → Portal settings → Account page, you override the default email address for member communications like sign-in/sign-up emails and member notifications.Newsletter addressesIt’s also possible to set a separate sender and reply-to address per newsletter, which will be used instead of the default. Configure these addresses via Settings → Newsletters.The table below shows which email is used based on email type. In the table, if an address is not, it falls back to the next available address until reaching the default.Email typeAddress usedExamplesMember notificationsSupport, DefaultSignup/sign links, comment repliesNewslettersNewsletter, DefaultConfigurable per newsletterStaff notificationsDefaultRecommendations, signupsIrrespective of how you configure email addresses, maximize deliverability by ensuring DKIM, SPF, and DMARC records are configured for your sending domains.Admin URLAdmin can be used to specify a different protocol for your admin panel or a different hostname (domain name). It can’t affect the path at which the admin panel is served (this is always /ghost/)."admin": { "url": "http://example.com" } ServerThe server host and port are the IP address and port number that Ghost listens on for requests. By default, requests are routed from port 80 to Ghost by nginx (recommended), or Apache."server": { "host": "127.0.0.1", "port": 2368 } PrivacyAll features inside the privacy.md file are enabled by default. It is possible to turn these off in order to protect privacy:Update checkGravatarRPC pingStructured dataFor more information about the features, read the privacy.md page.To turn off all of the features, use:"privacy": { "useTinfoil": true } Alternatively, configure each feature individually:"privacy": { "useUpdateCheck": false, "useGravatar": false, "useRpcPing": false, "useStructuredData": false } PathsThe configuration of paths can be relative or absolute. To use a content directory that does not live inside the Ghost folder, specify a paths object with a new contentPath:"paths": { "contentPath": "content/" }, When using a custom content path, the content directory must exist and contain subdirectories for data, images, themes, logs, and adapters.If using a SQLite database, you’ll also need to update the path to your database to match the new location of the data folder.Referrer PolicySet the value of the content attribute of the meta referrer HTML tag by adding referrerPolicy to your config. origin-when-crossorigin is the default. Read through all possible options.AdaptersGhost allows for customizations at multiple layers through an adapter system. Customizable layers include: storage, caching, sso, and scheduling.Use the adapters configuration block with “storage”, “caching”, “sso,” or “scheduling” keys to initialize a custom adapter. For example, the following configuration uses storage-module-name to handle all storage capabilities in Ghost. Note that the active key indicates a default adapter used for all features if no other adapters are declared."adapters": { "storage": { "active": "storage-module-name", "storage-module-name": { "key": "value" } } } Customize parts of Ghost’s features by declaring adapters at the feature level. For example, to use a custom cache adapter only for the imageSizes feature, configure the cache adapter as follows:"adapters": { "cache": { "custom-redis-cache-adapter": { "host": "localhost", "port": 6379, "password": "secret_password" }, "imageSizes": { "adapter": "custom-redis-cache-adapter", "ttl": 3600 } } } The above declaration uses the custom-redis-cache-adapter only for the imageSizes cache feature with these values:{ "host": "localhost", "port": 6379, "password": "secret_password", "tt'''
