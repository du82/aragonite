n purchases are available on the Website (any such services, an "Upgrade"). By selecting an Upgrade you agree to pay Ghost Foundation the monthly or annual subscription fees indicated for that service. Payments will be charged on a pre-pay basis on the day you sign up for an Upgrade and will cover the use of that service for a monthly or annual subscription period as indicated. Upgrade fees are not refundable.3.2. Automatic RenewalUnless you notify Ghost Foundation before the end of the applicable subscription period that you want to cancel an Upgrade, your Upgrade subscription will automatically renew and you authorize us to collect the then-applicable annual or monthly subscription fee for such Upgrade (as well as any taxes) using any credit card or other payment mechanism we have on record for you. Upgrades can be cancelled at any time in the Upgrades section of your site's dashboard.3.3 Refund PolicyUnless indicated otherwise at the explicit discretion of Ghost Foundation, all sales are final and no refunds are provided for any products or services provided. Any sales made via the Ghost.org Marketplace are subject to the refund policy of their respective owners.4. Responsibility of Website VisitorsGhost Foundation has not reviewed, and cannot review, all of the Content, including computer software, made available through our Services, and cannot therefore be responsible for that Content. Ghost Foundation makes no representations, warranties or guarantees, whether express or implied, that Content is accurate, complete or up to date, that it endorses the material there posted, or that it believes such material to be accurate, useful or non-harmful. You are responsible for taking precautions as necessary to protect yourself and your computer systems from viruses, worms, Trojan horses, and other harmful or destructive content.The Website may contain Content that is offensive, indecent, or otherwise objectionable, as well as Content containing technical inaccuracies,