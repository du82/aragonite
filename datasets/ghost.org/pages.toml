["https://ghost.org/docs/hosting"]
title = "Hosting a Ghost publication - Fully-managed PaaS & self-hosted"
description = "The most efficient way to deploy an instance of Ghost is on our official fully-managed PaaS. Or you can self-host using our recommended stack!"
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Hosting /Hosting GhostA short guide to running Ghost in a production environment and setting up an independent publication to serve traffic at scale.Ghost is open source software, and can be installed and maintained relatively easily on just about any VPS hosting provider. Additionally, we run an official PaaS for Ghost called Ghost(Pro), where you can have a fully managed instance set up in a couple of clicks. All revenue from Ghost(Pro) goes toward funding the future development of Ghost itself, so by using our official hosting you’ll also be funding developers to continue to improve the core product for you.Ghost(Pro) vs Self-hostingA common question we get from developers is whether they should use our official platform, or host the codebase on their own server independently. Deciding which option is best for you comes with some nuance, so below is a breakdown of the differences to help you decide what will fit your needs best.Ghost(Pro)Self-Hosting🎛 Product featuresIdenticalIdentical⚙️ Base hosting costFrom $9/moFrom $10/mo🌍 Worldwide Fastly CDNIncludedFrom $50/mo💌 Email newsletter sendingIncludedFrom $35/mo📦 Full site backupsIncludedFrom $5/mo🖼️ Built-in image editorIncludedFrom $12/mo💵 Payment processing fees0%0%🖥 Install & setup✅Manual🔄 Weekly updates✅Manual🚧 Server maintenance & updates✅Manual🔒 SSL Certificate✅Manual⚠️ Threat & uptime management✅❌🥊 Enterprise-grade security✅❌🔀 Custom edge routing policies❌✅👩‍💻 Direct SSH & DB access❌✅🔨 Ability to modify core❌✅🚑 Ghost product supportEmailForum❤️ Where your money goesNew features in Ghost3rd party companiesWhich option is best for me?Self-hosting is the best choice for teams who are comfortable managing servers, databases and Node.js apps who want full control over their environment. There’s more complexity involved, and you have to signup-for and pay for your own Mailgun account (email delivery) and CDN service (performance and scale) — but ultimately more flexibility around exactly how the software runs. For people sending lots of email newsletters, self-hosting generally works out to be more expensive compared to Ghost(Pro), but for people who aren’t using email functionality, it can work out to roughly the same price.See self-hosting guides & instructions →Ghost(Pro) is the best choice for most people who are focused on using the Ghost software, and don’t want to spend time managing servers. Setting up a new Ghost site takes around 20 seconds, and after that all weekly updates, backups, security and performance are managed for you. If your site ever goes down, our team gets woken up while you sleep peacefully. In most cases Ghost(Pro) ends up being lower cost than self-hosting once you add up the cost of the different service providers.See Ghost(Pro) pricing & plans →TLDR: If you want the easiest, cheapest option: Ghost(Pro) is probably your best bet. If you have a technical team and you want maximum control and flexibility, you’ll get more out of self-hosting.Self-hosting details & configurationGhost has a small team, so we optimize the software for a single, narrow, well defined stack which is heavily tested. This is the same stack that we use on Ghost(Pro), so we can generally guarantee that it’s going to work well. Ghost can also run successfully with different operating systems, databases and web servers, but these are not officially supported or widely adopted, so your mileage may (will) vary.Our officially supported and recommended stack is as follows:Ubuntu 16.04, 18.04, 20.04 or 22.04MySQL 8.0NGINXSystemdRecommended Node version installed via NodeSourceA server with at least 1GB memoryA non-root user for running ghost commandsSee self-hosting guides & instructions →Server hardeningAfter setting up a fresh Ubuntu install in production, it’s worth considering the following steps to make your new environment extra secure and resilient:Use SSL - Ghost should be configured to run over HTTPS. Ghost admin must be run over HTTPS. You can choose to load admin on a separate domain for additional securitySecure MySQL - We strongly recommend running mysql_secure_installation after successful setup to significantly improve the security of your database.Set up a firewall - Ubuntu 18.04, 20.04 and 22.04 servers can use the UFW firewall to make sure only connections to certain services are allowed. We recommend setting up UFW rules for ssh, nginx, http, and https. If you do use UFW, make sure you don’t use any other firewalls.Disable SSH Root & password logins - It’s a very good idea to disable SSH password based login and only connect to your server via proper SSH keys. It’s also a good idea to disable the root user.Separate admin domain - Configuring a separate admin URL can help to guard against privilege escalation and reduces available attack vectors.Optimizing for scaleThe correct way to scale Ghost is by adding a CDN and/or caching layer in front of your Ghost instance. Clustering or sharding is not supported in any way. Every day 2-5 of the top stories on Hacker News are published with Ghost, and to the best of our knowledge no Ghost site has ever fallen over as a result of a traffic spike. Minimal, sensible caching is more than enough.Staying up to dateWhenever running a public-facing production web server it’s critically important to keep all software up to date. If you don’t keep everything up to date, you place your site and your server at risk of numerous potential exploits and hacks.If you can’t manage these things yourself, ensure that a systems administrator on your team is able to keep everything updated on your behalf.On this page"
