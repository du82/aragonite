["https://ghost.org/changelog/internationalization"]
title = "Internationalization 🌏"
description = "Automatic translations for Ghost portal, newsletters, search, and comments."
full_description = "← Changelog Nov 5, 2024 New Internationalization 🌏 Automatic translations for Ghost portal, newsletters, search, and comments. Ghost is used by people all over the world to publish their thoughts, stories and ideas on the internet in a large number of different languages. Until now, though, any text output by Ghost to generate user interfaces on websites has been limited to English. These include the signup/login portal, search, comments and a few pieces of text in newsletter templates (like the unsubscribe link).Last year we launched a beta program to ask people to help us translate these areas of Ghost into different languages and, after a huge number of contributions, we're now ready to launch this publicly for 60 different languages!Starting next week, all public-facing components generated by Ghost will be automatically translated into the language that you have configured in Ghost under Settings → Publication Language.https://www.monplateau.infohttps://eigoism.comhttps://nucleo.jor.br/especiais/If you want to turn it on right now, you can do that, too! Just enable the beta flag under Settings → Labs → Portal translation.Popular languages have been fully translated, but if you spot any English text still showing up on your site — the translations for the language you're using may not yet be complete. We're still actively looking for people to help translate any missing strings! Here's a guide for how to contribute translations. Read more and get community support on our forum.Special thanksTranslations in Ghost have been created 100% by the Ghost community. It's the largest piece of work we've ever released that the Ghost core team has not worked on! We owe a huge debt of gratitude to everyone who has graciously spent time helping to submit new translations to make this possible.There's one person in particular who deserves a special mention: Cathy Sarisky.Cathy — an independent Ghost developer who helps publishers with web design and development via her agency, Spectral Web Services — has been leading our translation efforts for the past few months. It's entirely thanks to her that this is finally coming out of beta!Thank you Cathy 🙏 Get notified when we ship new features. Subscribe → Email sent Try again"
