full_description = "Integrations / ContentEmbed content from Giphy in Ghost to share the most awesome images on the internet with your readersGiphy has one of the largest libraries of the internet’s most popular gifs, and all of them can be freely embedded on any Ghost site. There are only a couple of steps to get Giphy gifs working within your posts.To get started, head over to Giphy and find the photo you’d like to use.Select a gif and click embedOpen the share menu from the three dots and select Embed, then copy the code!Within the Ghost editor, add a new HTML cardYou can paste the form code within an HTML card on any page to embed your formEnjoy your new Giphy integrationHere’s an example of a real Giphy embed in action:Have fun!"
