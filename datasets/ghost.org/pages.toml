["https://ghost.org/docs/faq/api-versioning"]
title = "Ghost API Versioning"
description = "Information about the Ghost API versioning including a full list of statuses and suitability for production use. Read more in the Ghost documentation 👉"
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / FAQ / API versioning /API versioningGhost ships with a mature set of APIs. Each API endpoint has a status, which indicates suitability for production use. Read more about Ghost’s architecture.Stability IndexStable - forward compatible changes onlyExperimental - being actively worked on, may receive breaking changesDeprecated - scheduled for removalAccept-Version HeaderAccept-Version: v{major}.{minor}The ‘Accept-Version’ header allows clients to indicate the minimum version of Ghost they can operate with. It also allows Ghost to determine and communicate if any recent breaking changes are unsuitable for a given client.When the Accept-Version header is received, Ghost will respond with a Content-Version header indicating the version of the Ghost install that is responding.If the Accept-Version header is received and the request cannot be processed, Ghost sends an email to the site’s owner and administrators with the details of the problem, to make it easy to find and fix issues with outdated clients.Ghost major versions ship every 8-12 months, meaning code you write against our API today will be stable for a minimum of 2 years.On this page"
