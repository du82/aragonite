["https://ghost.org/vs/tumblr"]
title = "Ghost: The powerful alternative to Tumblr"
description = "Looking for the differences between Ghost and Tumblr? We've put together a full rundown of Ghost vs Tumblr and why you might want to make the switch."
full_description = '''Tumblr vs GhostGhost is a powerful, customisable alternative to Tumblr which puts you in chargeIn December 2018, Tumblr announced that they would be removing a huge amount of content from the platform following a dispute with the Apple App Store. Since then, we’ve had a lot of people visiting this page (understandably) looking for a Tumblr alternative!Normally this page is a bit of a sales pitch for our product, called Ghost, but since there are a lot of frustrated people looking for answers — we’ve adapted things here to try to help.If you’re looking for an equivalent social network where you can follow other users and both share and consume free content:Then your best bet is probably going to be Mastodon. It’s a completely decentralised social network which combines the best bits of Twitter and Tumblr, but the technology is structured in a way whereby it can never be shut down. It’s also completely ad-free, and doesn’t censor any content. You can join an existing Mastodon community or start a new one.If you run a publication with a large audience as a business and you want professional software hosted on your own domain:Well in that case, you might be more interested in what we do. Ghost is a completely independent platform which gives you control of the technology, the content and the audience — so nobody can shut you down. You can host the software yourself for free, or you can pay for our premium service where we take care of all the infrastructure/technical things for you.Ghost doesn’t have a network, so there isn’t the same sort of following mechanism built in. Sites built with Ghost are better suited to established publishers with a 1:many relationship to their audience, rather than the many:many relationship of a social network."I wrote my first post on Ghost this weekend and it was a real joy. I love the markdown editor, it is exactly what I need and perfect for how I write my posts. Excited about where this will lead, Ghost feels like a great platform."Joel Gascoigne, BufferSwitched from Tumblr to GhostGhost is a powerhouseIn terms of functionality, Ghost does significantly more than Tumblr — but it’s also quite a different format when it comes to creating content.While Tumblr gives you some basic editing functions and some Markdown support, Ghost has a full-blown rich editor which makes formatting posts a breeze.You'll find that you can accomplish a great deal more in terms of post layout and different types of content with responsive cards. Quickly insert images, embeds, Markdown or HTML.The native members features within Ghost allow you to transform anonymous views into registered members. Ghost has member management, native payments, subscriptions and email newsletters built-in.Everything you need to get started is ready to use, without any additional downloads or fees!Custom ThemesOne area where Ghost is similar to Tumblr is in themes, which are nearly the same. If you've ever built a Tumblr theme you'll find it very easy to do the same with Ghost.The main difference is that Ghost themes are more powerful and more customisable. You can do whatever you want without having tags/code stripped and removed.Have a browse of our range of pre-made themes over on the Ghost Marketplace to get a sense of what's possible.Zappos chose Ghost for their brand new brand publication.Ghost has SEO & social built-inGhost has the best support for search engine optimisation and social sharing features of any blogging platform in the world. You don’t need any extra plugins or extensions, and you don’t need to write any extra code. It just works.There are built-in XML sitemaps, Google AMP pages, canonical tags, optimised URLs, microformats, Facebook Open Graph tags, support for Twitter cards and clean semantic markup. All of this is done for you automatically, with no plugins needed.With Ghost, you own your contentWhen you blog on Tumblr, you give up the rights to your content. They have the right to suspend, remove or repurpose your content as they see fit. All of your writing is contributing to Tumblr network. While this gives you the benefit of a network effect, where more people are exposed to your work, it means that you ultimately have far less control.Ghost is completely open source software, which means that not only do you own your content outright — you also own the technology. So even if Ghost (the company) shuts down, you’re still able to keep using Ghost (the software) for as long as you like. If you take your publishing seriously, this is really important.Many people run their blogs as a business and depend on it for income, so they can’t just afford to have some executive decide to shut them down one day with barely any warning."We're using Ghost's Pro service to host the blog for us. Works really well. Great writing experience compared to WordPress. WordPress is an incredibly powerful framework but because it supports the needs of so many websites and demands, it has grown into a sizable and cluttered tool."Lee Munroe, MailgunSwitched from WordPress to GhostGhost is fasterCompared to other Tumblr alternatives out there, Ghost is the only platform built with a really modern technology stack. What does that mean for you? Speed. Lots, and lots of speed. Ghost sites load faster than just about anything else out there.On top of that, downtime is limited by each site being separate. If Tumblr goes down: All Tumblr blogs are down. If a Ghost site goes down, none of the others are affected. It’s far more stable and reliable to host your publication in a place where you know it’s safe from attacks.Thousands of publishers choose Ghost to run their blog:Build a business around your blogUsing Ghost allows you to build a real audience with memberships and subscriptions to generate predictable revenue from your work.It’s possible to create anything from a premium content archive, to a paid newsletter or podcast with full-featured subscription commerce. Best of all, there are 0% transaction fees, so any revenue you make is yours to keep.$8/ monthstandard shape-cube For people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentsSubscribe Now20% Annual Discount$59/ yearpremiumFor people who want the maximum availablecheck-circle-1Access all contentcheck-circle-1Weekly newslettercheck-circle-1Members-only commentscheck-circle-1Support indie publishingcheck-circle-1Advertising-free!Subscribe NowForecastHow much could you earn?Whether you prefer a large audience at a low price point or a small dedicated following at a premium fee, you control the economics.See how much you could earn with a subscription commerce publication: members Number of members$ / month Price per month$your annual recurring revenueHow does this work?Unlike other membership systems which typically take 10-30% of your revenue, Ghost takes no fee at all and instead connects directly to your own Stripe account, so you receive the money - not us. You own the software and you own the billing account, so there's no middleman between you and your customers. Stripe takes a ~2.9% processing fee, and all other revenue is yours to keep.Building a subscription business is challenging in lots of ways. Our focus is on making the billing side as easy as possible - so you can keep your focus on your customers.tl;dr: The lowdownThe short version? Ghost is best for serious publishing. If you’re still looking for an ad-free social account similar to Tumblr, then you might want to consider Mastodon.Ghost is best if…You care about full ownership and control over your contentCustomising and adapting the look and feel of your site is importantYou want the best tool to scale your blog up for a large audienceYou’re looking to turn your blog into a businessYou post more long-form contentMaybe consider Mastodon when…You don’t want to pay, you want it to be freeYou want social network features of being able to follow/like other usersExtra advanced functionality beyond basic publishing is not neededYou post more short-form contentOne last thing you should knowGhost is an independent non-profit organisation. We build publishing tools for modern journalism & publishing because we believe freedom of speech is important. Our software is released under a free open source license, our business model is completely transparent, and our legal structure means that 100% of the money we make is reinvested into making Ghost better.We’re building a socially responsible, sustainable business which empowers people to share important stories and ideas. We’re in this for the long haul."I've been a blog minimalist from the start, and finding a truly open source platform which reflects that minimalism and focus is incredibly refreshing."Jeff Atwood, Coding HorrorSwitched from TypePad to GhostYou’re now armed with knowledge! Hopefully this short guide was useful to give you a general overview of Tumblr compared to Ghost.Switching to Ghost gives you the flexibility of a fully customisable publication, and we have a support team on hand if you need help migrating your data.Hit the button below to give Ghost a try. It’s completely free and unlimited for 14 days, no obligation.Still researching? Head back to the alternatives page.'''
