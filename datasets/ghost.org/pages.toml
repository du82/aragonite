["https://ghost.org/help/using-custom-domains"]
title = "Adding a custom domain"
description = "Make your site memorable and easy to find with a branded custom domain."
full_description = "Adding a custom domain If you would like to make your site memorable and easy to find with a branded custom domain, then you can map any domain you own directly to your Ghost(Pro) publication. This is done by adding CNAME and A records within your domain's DNS settings.Regardless of how a user enters your publication's URL in their browser, they'll always be directed to the correct site. All Ghost(Pro) sites will automatically be provided with an SSL certificate by default, which simplifies the process and ensures you site is secure.Popular DNS providersUse the following guides if you are using any of these popular domain name providers:GoDaddyNamecheapGoogleHoverGandiSquarespaceAdvanced users may also wish to read more about domain setup via Cloudflare.Otherwise, follow the instructions below to setup a custom domain for your Ghost site.Before you beginBefore configuring a custom domain with your publication, decide whether you want to use a subdomain or root domain as the default URL for your site.What is a Subdomain?A subdomain is a subdivision of your domain name. For example, if you want to use Ghost(Pro) at blog.ghost.org, “blog,” would be a subdomain of ghost.org. The most common subdomain is “www” e.g. www.ghost.org.What is a Root Domain?A root domain, also known as a “naked domain,” is a domain without a subdomain in front, e.g. ghost.org is a root domain. Root domains are assigned in DNS records using the “@” symbol, and are considered non-standard setups on Ghost(Pro), as root level CNAME records are only supported by some DNS providers, and may interfere with email.If you'd prefer a root domain and are using a DNS provider that doesn't support this - we recommend routing your DNS through a service such as Cloudflare, which gives you more flexibility.💡Ghost(Pro) does not support .eth domains, or custom domains which utilize special characters.Step 1: Create a CNAME record Recommended DNS SetupFor a quick and easy setup, we recommend using a subdomain (e.g. www.domain.com) with Ghost(Pro). To achieve this setup, create the following DNS records with your domain provider: Subdomain DNS Configuration Record Type Host Value CNAME www [subdomain].ghost.io A @ 178.128.137.126 The CNAME is required. The A record is optional - it creates a redirect from your root domain, to the www subdomain.Root Domain SetupIf you'd prefer to use a root domain (e.g. domain.com), create the following DNS records with your domain provider. Root Domain DNS Configuration Record Type Host Value CNAME @ [subdomain].ghost.io A www 178.128.137.126 The CNAME is required. The A record is optional - it creates a redirect from your www subdomain to the root domain.Non-www Subdomain SetupIf you'd prefer to use an alternative subdomain (e.g. blog.domain.com), create the following CNAME record with your domain provider. Non-www Subdomain DNS Configuration Record Type Host Value CNAME blog [subdomain].ghost.io Step 2: Activate the Custom DomainLogin to your publication's Ghost Admin area, and go to the Ghost(Pro) > Domain settings.Click the “Setup” button, enter your custom domain into the custom domain field, and click activate, to activate your custom domain."
