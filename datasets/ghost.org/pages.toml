["https://ghost.org/docs/install/digitalocean"]
title = "How to install Ghost on Digital Ocean - Official guide"
description = "A full production install guide for how to install the Ghost professional publishing platform on a production server running Ubuntu 16.04, 18.04, 20.04 or 22.04."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Install / Digitalocean /How to install Ghost on Digital OceanA full guide for installing, configuring and running Ghost on a Digital Ocean Droplet VPS, for use in production environments.OverviewDigital Ocean the official hosting partner of the Ghost open source project, and our favourite provider! Our teams have worked together to make installing Ghost on Digital Ocean VPS droplets as easy as possible for developers, with officially supported 1-click marketplace apps.PrerequisitesFor this install there are three things which you need to have ready up-front:A DigitalOcean account (This signup link will give you $100 free credit)Your SSH key added to the account. Follow these instructionsA domain name to point at your new site (Mandatory for SSL configuration during install)Setting up the marketplace appHead over to the official Ghost app in the Digital Ocean marketplace, and click on the “Create Ghost Droplet” button.For most Ghost installs, the $5 base option is sufficient to run the app. If you’re running a high traffic site or one with lots of members, then you may want to choose an option with more resources.The rest of the options for the Droplet can be selected based on what you prefer. Make sure you only create one Droplet, Ghost runs on a single process and cannot be sharded across multiple machines.When you’re done, click the “Create Droplet” button at the bottom of the screen.Server SetupOnce the Droplet has been created you will have an IP address to log into. Open your terminal and login to your new server as the root user, with SSH:# Login via SSH ssh root@your_server_ip At the first login Ghost-CLI will automatically perform an update check for all available packages, and make sure that the environment is ready for use. When finished, you’ll see a prompt to let you know what’s next:Ghost will prompt you for two details: 1. Your domain - Add an A Record -> xxx.xxx.xxx.xxx & ensure the DNS has fully propagated - Or alternatively enter http://xxx.xxx.xxx.xxx 2. Your email address (only used for SSL) Press enter when you're ready to get started! Configuring your domainIt’s best to set up your domain and DNS at this point so that SSL certificates can be automatically provisioned during the install process. Create an A-Record from your domain, pointing at your server’s IP address, then press Enter in terminal when you’re ready.Setting up GhostGhost-CLI will now install and configure Ghost for you, and along the way it will prompt you with some questions about how you’d like things to be set up:Blog URLEnter the exact URL (the domain you pointed at your droplet’s IP address) that your publication will use, and include the protocol for HTTP or HTTPS. For example, https://example.com. If you use HTTPS, Ghost-CLI will offer to set up SSL for you.Your new siteOnce the install is finished you’ll be able to access your new site on https://yourdomain.com and https://yourdomain.com/ghost to access Ghost Admin ✨That’s it! You’re done.Future maintenanceOnce Ghost is properly set up it’s important to keep it properly maintained and up to date. Fortunately, this is relatively easy to do using Ghost-CLI. Run ghost help for a list of available commands, or explore the full Ghost-CLI documentation.What to do if the install failsIf an install goes horribly wrong, use ghost uninstall to remove it and try again. This is preferable to deleting the folder to ensure no artifacts are left behind.If an install is interrupted or the connection lost, use ghost setup to restart the configuration process. If the install succeeds, but starting Ghost fails, you can try starting ghost manually with ghost start.For troubleshooting and errors, use the site search and FAQ section to find information about common error messages.On this page"
