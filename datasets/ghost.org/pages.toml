["https://ghost.org/docs/update"]
title = "Ghost Docs"
description = "Everything you need to know about working with the Ghost professional publishing platform."
full_description = "Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Update /How to update GhostLearn how to update your self-hosted Ghost install to the latest versionOur team release updates to the open source software every week, and you can find out whether new updates are available any time by running ghost check-update.If you’re already running the latest major version (5.x) - update using Ghost CLI with two commands:Run ghost backup to generate a full backup of your site dataThen, run ghost update ✨Updating to the latest major versionIf you’re not yet on the latest major version, there are two recommended methods for updating your Ghost install, depending on what version you’re currently on, and what type of database you’re using in production. Below is a full breakdown of the the recommended update paths.Updates are recommended for sites that are:Running Ghost version 3.0.0 or higher and are using MySQL in productionDevelopment sites using any databaseA full reinstall of Ghost is recommended for sites that are:Running on a Ghost version less than 3.0.0Using SQLite3 in production on any Ghost versionGhost VersionDatabaseUpdate method0.xAnyReinstall1.xAnyReinstall2.xAnyReinstall3.xSQLiteReinstall3.xMySQLUpdate4.xSQLiteReinstall4.xMySQLUpdateIf you’re using MariaDB it is recommended to migrate to MySQL 8 - read more about supported databases.On this page"
