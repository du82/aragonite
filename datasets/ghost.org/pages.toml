["https://ghost.org/about"]
title = "About Ghost - The Open Source Publishing Platform"
description = "Find out more about the non-profit organisation behind Ghost – building open source technology for the future of journalism & publishing."
full_description = "We're a non-profit organisation building open source technology for modern publishing.Ghost was founded in April 2013, with a mission to create the best open source tools for independent journalists and writers across the world, and have a real impact on the future of online media.Today Ghost powers an incredible range of websites; from personal bloggers to large teams of writers and editors at some of the largest organisations in the world. We've built a sustainable business around a free core application, funded by a premium managed-service to run it on.100,000,000+Ghost installs to dateBehind the scenes, we're just a group of weird, fun-loving humans who enjoy experimenting with new technology. We believe in creating as much freedom in the world as we can, and everything we do is based on that core principle.We set Ghost up as non-profit foundation so that it would always be true to its users, rather than shareholders or investors. Our legal constitution ensures that the company can never be bought or sold, and one hundred percent of our revenue is reinvested into the product and the community.As a public organisation we also believe in being transparent and accountable for everything we do, so we publish our live financial data for all to see.All of our company metrics are public.Yes, this is a live feed of our real data. ARR$7,733,765Annual Run Rate$644,480Monthly Run Rate2.17%Net churn24,434Active customers6BRequests/month100M+Installs48,444GitHub starsWe use our revenue to hire amazing developers who build really great, open softwareGreat software attracts people who are excited about using it to publish onlinePeople who want the best experience pay for our premium Ghost(Pro) platformThe Ghost(Pro) platform generates revenue for thenon-profit foundationIt's a sustainable open source model.The more people use Ghost, the more demand there is for our paid service, the more revenue we make, the more great people we can hire to work on Ghost full-time, the better the software gets, the more people use Ghost… and so on. It's a virtuous cycle that allows us to produce open source software and release it for free.This sustainable funding model means that we don't rely on any external donations or grant funding. The Ghost Foundation is completely self-sufficient, and is able to employ a wonderful team.The Ghost Foundation teamWe've been a fully remote company since 2013, long before it was common. We've never had an office in the history of the business. These days we span 5 continents, 16 nationalities and 15 languages.🇮🇪John - Founder, CEO May, 2013🇬🇧Hannah - Founder, CTO July, 2013🇺🇸Sarah - Support May, 2014🇬🇧David - Infrastructure August, 2014🇬🇧Kevin - Developer August, 2015🇩🇪Aileen - Developer January, 2016🇭🇺Zimo - Designer January, 2018🇮🇪Fabien - Developer August, 2018🇬🇧Beccy - Operations August, 2019🇦🇺James - Infrastructure August, 2019🇬🇧Daniel - DevOps January, 2020🇬🇧Sam - DevOps August, 2020🇳🇱Sanne - Designer August, 2020🇲🇳Sodbileg - Designer August, 2020🇬🇧Paul - Developer September, 2020🇺🇸Peter - Product May, 2021🇬🇧Jon - Support October, 2021🇳🇱Bob - Support October, 2021🇺🇸Matthew - Support October, 2021🇬🇧Joe - Infrastructure November, 2021🇿🇦Ronald - Developer July, 2022🇵🇱Filip - Infrastructure August, 2022🇺🇸Chris - Developer January, 2023🇬🇧Nick - Product January, 2023🇺🇸Steve - Developer January, 2023🇬🇧Alex - Partnerships February, 2023🇨🇭Sag - Developer March, 2023🇬🇧Mike - Developer April, 2023🇮🇳Princi - Developer August, 2023🇳🇱Daniël - Designer November, 2023🇺🇸Erik - Engineering December, 2023🇵🇹Ricardo - Infrastructure April, 2024🇩🇪Leif - Engineering December, 2024🇳🇱Charlie - Brand January, 2025Sound like the sort of life you would enjoy?We're always looking for great people to join us, some benefits include...World class team & productWork with a group of incredible people who are unbelievably excited about the work they do and the technology they use.Explicit freedomChoose where you work and how you want to work. It's entirely up to you. We really just want you to be happy.Unlimited holidaysWe don't count how many hours you work each day. We do insist that you take at least 2 full weeks off per year, though.All costs coveredWe'll set you up with the latest Macbook Pro, a home-office stipend, and help cover a co-working space if you'd like one.Personal developmentWe'll coach you to help you grow your career and cover any costs for personal development, books or memberships.Team tripsEach year we fly everyone to the same location so we can spend a week working together and collaborating in person.Interested? See our open positions →The open source teamIn addition to the full-time team, Ghost is also made possible by a generous group of open source contributors from all over the world who graciously volunteer their time and their code to the project.🇺🇸Cathy - @cathysarisky Ghost Core 🇵🇱Naz - @naz Ghost Core 🇩🇪Kate - @kirrg001 Ghost Core 🇦🇹Sebastian - @sebgie Ghost Core 🇬🇧Dave - @daviddarnes Community 🇺🇸Austin - @acburdine Ghost-CLI 🇺🇸Vikas - @vikaspotluri123 Ghost Core 🇩🇪Felix - @felixrieseberg Ghost Desktop 🇮🇳Vicky - @vickychijwani Ghost Mobile 🇺🇸David - @dbalders Community 🇺🇸Jason - @jaswilli Ghost CoreFind out how you can get involved →"
