["https://ghost.org/docs/staff"]
title = "Users & Permissions – Manage your team"
description = "Ghost has built-in staff user permissions to allow teams to collaborate effectively. Learn all about user permissions in Ghost."
full_description = 'Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Staff /Staff usersStaff users within Ghost have access to the admin area with varying levels of permissions for what they can do.Roles & permissionsThere are five different staff user roles within GhostContributors: Can log in and write posts, but cannot publishAuthors: Can create and publish new posts and tagsEditors: Can invite, manage and edit authors and contributorsAdministrators: Have full permissions to edit all data and settingsOwner: An admin who cannot be deleted and has access to billing detailsAuthor archivesLike tags, staff users are another resource by which content can be organised and sorted. Multiple authors can be assigned to any given post to generate bylines. Equally, author archives can be generated on the front end based on which posts an author is assigned to.Also like tags, within Ghost Handlebars Themes author archives are automatically added to the Google XML Sitemap, and have their own pagination + RSS feeds.Here’s an example of an author archive in the default Ghost Theme:Public author archives are only generated for staff users who are assigned to published posts, any other staff users are not publicly visible.Security & trustIf running the front-end of your site and the Ghost admin client on the same domain, there are certain permissions escalation vectors which are unavoidable.Ghost considers staff users to be “trusted” by default - so if you’re running in an environment where users are untrusted, you should ensure that Ghost-Admin and your site’s front-end run on separate domains.Sample API dataHere’s a sample author object from the Ghost Content API{ "authors": [ { "slug": "cameron", "id": "5ddc9b9510d8970038255d02", "name": "Cameron Almeida", "profile_image": "https://docs.ghost.io/content/images/2019/03/1c2f492a-a5d0-4d2d-b350-cdcdebc7e413.jpg", "cover_image": null, "bio": "Editor at large.", "website": "https://example.com", "location": "Cape Town", "facebook": "example", "twitter": "@example", "meta_title": null, "meta_description": null, "url": "https://docs.ghost.io/author/cameron/" } ] } On this page'
year_published = 2025
