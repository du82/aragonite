["https://ghost.org/changelog/internal-linking"]
title = "Internal linking"
description = "Search and link to your own content directly inside the editor — so that your workflow is never interrupted."
full_description = "← Changelog Jun 25, 2024 New Internal linking Search and link to your own content directly inside the editor — so that your workflow is never interrupted. In the past, if you wanted to link to one of your old posts you’d need to open a new tab, visit your website, track down the post, copy the URL, and paste it back into the Ghost editor.You told us that was just too many steps, and too many tabs. (Agreed)Now when you create a link in Ghost, you can search old posts to link to right there in the editor. It works on pages, tags and authors, too.No more context switches to interrupt your writing flow.🪄To speed things up even more, just hit @ and start typing to quickly find and add a link to any of your work. 0:00 /0:30 1× The Ghost Editor is where you live everyday — so we’ve taken our time to get this feature right. First by testing with a small group (thank you all!), and later expanding to over 400 publishers kicking the tires during a beta period.So far, the feedback we’ve received has been overwhelmingly positive. Turns out writing is faster with less interruptions.That said, your workflow is exactly that, yours. So if there are ways you think this feature could be more valuable based on the way write in Ghost, we’d like to hear it — feedback@ghost.org.Ghost(Pro) users can log in and start enjoying all of this right away! If you're a developer, self-hosting Ghost, you'll need to update to the latest version to get access to everything that's new. Get notified when we ship new features. Subscribe → Email sent Try again Feb 05 Signup spam protection Recently, many publishers have noticed an increase in bulk signup-spam from SMS services such as txt.att.net – leading to Feb 5, 2025 New Dec 19 Upgraded comments Threaded replies, sorting options, and improved moderation tools. Dec 19, 2024 Improved"
