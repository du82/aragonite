["https://ghost.org/docs/themes/custom-settings"]
title = "How to use custom settings in Ghost themes - Developer docs"
description = "Find out how to empower users to modify their theme with custom settings that are built directly into your Ghost theme!"
full_description = 'Developer docs Quick-search for anything⌘F5.109.6Documentation Migration guides Tutorials Developer forumGetting StartedIntroduction Installation Hosting Guide Updates & VersionsCore ConceptsOverview Architecture Configuration Staff users Publishing MembershipsRecommendations Newsletters SecurityThemesOverview Structure Contexts Assets Helpers Content Search Members Routing Custom settings GScanAdvanced ToolsGhost CLI Content API Admin API JAMstack WebhooksResourcesFAQ Breaking changes Contributing License Logos Trademark useDocs / Themes / Custom settings /Custom settingsCustom theme settings are a powerful tool that allows theme developers to configure custom settings that appear in Ghost Admin — making it easy for site owners to make stylistic choices without needing to edit theme files.OverviewCustom theme settings are specified by the theme developer in the package.json file at the config.custom key, and there are five types of custom theme settings available:selectbooleancolorimagetext{ "config": { "custom": { "typography": { "type": "select", "options": ["Modern sans-serif", "Elegant serif"], "default": "Modern sans-serif" }, "cta_text": { "type": "text", "default": "Sign up for more like this", "group": "post" } } } } Once defined in the package.json file, custom settings can be accessed in Handlebars templates using the @custom object.<body class="{{body_class}} {{#match @custom.typography "Elegant serif"}}font-alt{{/match}}"> ... <section class="footer-cta"> {{#if @custom.cta_text}}<h2>{{@custom.cta_text}}</h2>{{/if}} <a href="#portal/signup">Sign up now</a> </section> </body> Themes are limited to a total of 20 custom settings. See the usage guidelines for details on the most effective ways to use custom settings.Setting keys/namesThe key given to each setting is used as the display name in Ghost Admin, and as the property name on the @custom object.{ "config": { "custom": { "cta_text": { "type": "text", "default": "Sign up for more like this", "group": "post", "description": "Used in a large CTA on the homepage and small one on the sidebar as well" } } } } In this example, the "cta_text" key is displayed to site owners as CTA Text and can be referenced in Handlebars templates using @custom.cta_text.Setting keys must be all lowercase with no special characters and in snake_case where each space is represented by an _.Changing a setting’s key when releasing a new theme version is a breaking change for site owners who upgrade from an older version. The setting with the old key is removed, losing any value entered by the site owner, and a new setting with the current key is created with its default value.Setting groupsTheme settings fall under the Theme tab in Design & branding, and are grouped into one of three categories:Site wideHomepagePostBy default, all custom settings appear in the Site wide category. Custom settings that are specific to the homepage or post display are defined with an optional "group" property with the value "homepage" or "post".{ "config": { "custom": { "typography": { "type": "select", "options": ["Modern sans-serif", "Elegant serif"], "default": "Modern sans-serif", "description": "Define the default font used for the publication" }, "feed_layout": { "type": "select", "options": ["Dynamic grid", "Simple grid", "List"], "default": "Dynamic grid", "group": "homepage", "description": "The layout of the post feed on the homepage, tag, and author pages" }, "cta_text": { "type": "text", "default": "Sign up for more like this", "group": "post", "description": "Used in a large CTA on the homepage and small one on the sidebar as well" } } } } Settings should be organized into groups that will make sense for site owners based on your usage of the setting in the theme.Setting a descriptionGive users more information about what a custom setting does by providing a short description. The description will appear along with the setting in Ghost admin. Description must be fewer than 100 characters.Setting typesEach of the five custom setting types has particular fields and requirements.All custom settings require a valid "type" — an unknown type causes a theme validation error.SelectPresents a select input with options defined by the theme developer.Select settings are used to offer site owners multiple predefined options in combination with the match helper:"feed_layout": { "type": "select", "options": ["Dynamic grid", "Simple grid", "List"], "default": "Dynamic grid" } {{#match @custom.feed_layout "Dynamic grid"}} // {{/match}} Validationoptions is required and must be an array of stringsdefault is required and must match one of the defined optionsBooleanPresents a checkbox toggle."recent_posts": { "type": "boolean", "default": true } Validationdefault is required and must be either true or falseBoolean settings can simply be used with the {{#if}} helper:{{#if @custom.recent_posts}} // {{/if}} ColorPresents a color picker."button_color": { "type": "color", "default": "#15171a" } Validationdefault is required and must be a valid hexadecimal stringUse the color setting value in the theme by accessing the custom setting directly.<style> :root { {{#if @custom.button_color}} --button-bg-color: {{@custom.button_color}}; {{/if}} } </style> ImagePresents an image uploader. When output in themes, the value will be blank or a URL."cta_background_image": { "type": "image" } Validationdefault is not allowedUse the image setting value in the theme by directly accessing the setting, or use with the {{img_url}} helper. You can pass in dynamic image sizes, if you would like to output the image in question at a resized resolution based on your theme config.<section class="footer-cta" {{#if @custom.cta_background_image}}style="background-image: url({{@custom.cta_background_image}});"{{/if}}> ... </section> // or <img src="{{img_url @custom.cta_background_image size="large"}}" /> TextPresents a text input. The value may be blank or free-form text."cta_text": { "type": "text", "default": "Sign up for more like this." } Validationdefault is optionalRemember to allow a use case with no text. For example, this link will only be displayed if text has been provided:{{#if @custom.cta_text}} <a href="#/portal/signup">{{@custom.cta_text}}</a> {{/if}} Fallback settingsRegardless of the Ghost version, themes providing custom settings shouldn’t look broken, and should provide a fallback when necessary.Creating fallbacks for text settingsThe default text for a text setting should be specified in package.json instead of adding it in the theme code as a fallback. This allows your theme to handle blank strings in the correct way:"cta_text": { "type": "text", "default": "Sign up now." } {{#if @custom.cta_text}} <h2>{{@custom.cta_text}}</h2> {{/if}} The only exception is when the theme must have text for a specific setting. In this situation, the default should be added in the theme as a fallback with an {{else}} statement:<h2> {{#if @custom.copyright_text_override}} {{@custom.copyright_text_override}} {{else}} {{@site.title}} © {{date format="YYYY"}} {{/if}} </h2> Setting visibilityConfigure setting dependencies to ensure that only relevant settings are displayed to the user in Ghost Admin. For example, a theme may offer several different header styles: Landing, Highlight, Magazine, Search, Off. If that value is Landing or Search, then an additional option becomes visible in Ghost Admin that allows the use of the publication’s cover image as the background. Otherwise, the option is hidden. By configuring setting dependencies, users get a better experience by only seeing settings that are relevant.To control when settings are visible, include the visibility key on the dependent setting. This key specifies the conditions that must be met for the setting to be displayed. Typically, you’ll specify the name of the parent setting and value it should have for the dependent setting to be visible. You can also use any NQL syntax for this — the same syntax used for filtering with the get helper.Example: Header style and background imageIn the following example, the use_publication_cover_as_background is only visible when header_style is Landing or Search. Note that when the visibility condition isn’t met, the dependent setting will render as null in the theme (i.e., @custom.use_publication_cover_as_background will be null).{ "header_style": { "type": "select", "options": [ "Landing", "Highlight", "Magazine", "Search", "Off" ], "default": "Landing", "group": "homepage" }, "use_publication_cover_as_background": { "type": "boolean", "default": false, "description": "Cover image will be used as a background when the header style is Landing or Search", "group": "homepage", "visibility": "header_style:[Landing, Search]" } } Example: Post feed style and thumbnailsIn this example, the show_images_in_feed setting is only visible when post_feed_style is set to List.{ "post_feed_style": { "type": "select", "options": [ "List", "Grid" ], "default": "List", "group": "homepage" }, "show_images_in_feed": { "type": "boolean", "default": true, "description": "Toggles thumbnails of the post cards when the post feed style is List", "group": "homepage", "visibility": "post_feed_style:List" } } Setting up support for custom fontsCustom fonts allow users to select heading and body fonts for their themes from a curated list. This provides the user with a broad range of font styles so your theme can appeal to a wider audience.If you’d like to give users the possibility to select custom fonts, you’ll need make sure your theme supports it.How custom fonts are loadedWhen a custom font is selected, Ghost loads the font files on the front-end via {{ghost_head}} and sets up two CSS variables that reference them:<link rel="preconnect" href="https://fonts.bunny.net"> <link rel="stylesheet" href="https://fonts.bunny.net/css?family=fira-mono:400,700|ibm-plex-serif:400,500,600"> <style> :root { --gh-font-heading: Fira Mono; --gh-font-body: IBM Plex Serif; } </style> Applying custom font variablesTo use custom fonts in your theme, apply the provided variables within your theme’s CSS file:<style> body { font-family: var(--gh-font-body); } h1, h2, h3, h4, h5, h6 { font-family: var(--gh-font-heading); } </style> Selected font names are also injected into {{body_class}}, allowing you to optionally fine-tune and make adjustments to any font:<style> body.gh-font-heading-ibm-plex-serif h1 { font-size: 12rem; line-height: 1.05em; } </style> <body class="gh-font-heading-fira-mono gh-font-body-ibm-plex-serif"> ... </body> Setting fallbacks to your theme’s own font(s)If custom fonts aren’t set, you can provide a fallback to your theme’s own font(s):<style> body { font-family: var(--gh-font-body, Helvetica); } h1, h2, h3, h4, h5, h6 { font-family: var(--gh-font-heading, var(--theme-font-heading)); } </style> Check out any of our official themes (e.g. Source) to see it in action.Guidelines for theme developersCustom settings should compliment the primary use case of the themeGhost Themes should always have a very clear use case and the implementation of custom settings should compliment that use case. For example, a theme that is designed for newsletters may have custom settings to make visual changes to button colors and typography, but shouldn’t include custom settings to turn the theme into a magazine layout.✅ Simple visual changes — give site owners the ability to create a great visual impact without altering the primary use-case of the theme. For example, changing colors, fonts and images.❌ Complex layout settings — using custom settings to alter the primary use case of the theme results in complicated code that is harder to manage in the future.Custom settings should have a very clear visual impactCustom settings are designed to allow site owners to make meaningful customizations to their theme, without needing to edit theme files or inject code.The total number of settings is limited to 20!Use your custom settings wisely to give publishers the tools they need to define the best visual fit for their brand.✅ Visual brand settings — use custom settings to make brand adjustments that have a visual impact, such as changing the color of all buttons, changing the default CTA text on the homepage, or offering a dark mode toggle.❌ Repeated settings — avoid using custom settings to make micro-adjustments to single elements of a theme, such as individual buttons.❌ Functional settings — avoid using custom settings to change the way a theme functions, such as changing the pagination style, or removing the primary tag from posts — these are functional settings that should be determined based on the primary use case of the theme.Using custom settings for external integrationsIt’s possible to use custom settings to enable third-party integrations within your theme, such as commenting systems or website analytics. To use custom settings for this purpose, site owners should be asked to enter a simple piece of information such as a tracking ID, rather than adding HTML code into a custom text setting.✅ Enter a Disqus shortname into a custom setting, and enabling the comment system only when the shortname is provided✅ Enter a tracking ID into a custom setting, and enabling Google Analytics only when the ID is provided❌ Ask users to add an embed code into custom settings to make an integration function.On this page'
