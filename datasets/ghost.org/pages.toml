full_description = '''Terms of ServiceThese are our terms of service. They're long and detailed, but they're here to protect both you and us - and make sure we have a long and happy relationship together. Please take a moment to review all of these terms so you know what you're agreeing to.If you find a Ghost.org account which you believe violates our terms of service, please contact us immediately and let us know.The following terms and conditions govern all use of the Ghost.org website (the “Website”) and all content, services and products available at or through the Website, including, but not limited to, the Ghost software ("Software") and the Ghost.org hosted service ("Hosted Service"), (collectively, the “Services”). The Services are owned and operated by the Ghost Foundation (“Ghost Foundation”, "we", "us" or "our"). The Services are offered subject to your acceptance without modification of all of the terms and conditions contained herein and all other operating rules, policies (including, without limitation, Ghost Foundation's privacy policy and Data Processing Agreement under the European General Data Protection Regulation) and procedures that may be published from time to time on the Website by Ghost Foundation and which are incorporated herein by reference (collectively, the "Agreement").Please read this Agreement carefully before accessing the Website or using the Services. By accessing the Website or using the Services or any part thereof, you agree to become bound by the terms and conditions of this Agreement. If you do not agree to all the terms and conditions of this Agreement, then you may not access the Website or use any Services. If these terms and conditions are considered an offer by Ghost Foundation, acceptance is expressly limited to these terms. The Website and Services are available only to individuals who are at least 13 years old.Violation of any of the terms below will result in the termination of your account. You agree to use the Website and Services at your own risk.1. Your Ghost.org AccountIf you create a user account to avail yourself of the Services, you are responsible for maintaining the security of your account, and you are fully responsible for all activities that occur under your account. If you create a site using our Services, you must not describe or assign keywords to your site in a misleading or unlawful manner, including in a manner intended to trade on the name or reputation of others, and Ghost Foundation may at its sole and unfettered discretion change or remove any description or keyword that it considers inappropriate or unlawful, or otherwise likely to cause Ghost Foundation liability. You must immediately notify Ghost Foundation of any unauthorized access to or activity on your account, your site, or any other breaches or suspected breaches of security. Ghost Foundation will not be liable for any acts or omissions by you or in connection with your site and your account, whether authorized or unauthorized, including any actions, proceedings, claims, damages, liabilities, charges, losses, or costs and expenses (including without limitation, legal costs and expenses and costs of other professionals and any penalties or other amounts levied).You must be a human. Accounts registered by "bots" or other automated methods are not permitted.You must provide your legal full name, a valid email address, and any other information requested in order to complete the signup process.Your login may only be used by one person - a single login shared by multiple people is not permitted.You are responsible for maintaining the security of your account and password. Ghost Foundation cannot and will not be liable for any loss or damage from your failure to comply with this security obligation.2. Responsibility of Users2.1 User-Generated ContentGhost Foundation allows users to publish Content using its Services. “Content” includes but is not limited to text, graphics, documents, photographs, images, music, audio files, video files, information, data records, computer software, and any other form of digital or electronic files or data.If you operate a site, comment on a site, post material to the Website, post links on the Website, or otherwise make (or allow any third party to make) material available by means of our Services, you are creating or making available Content (“Your Content”).Rights to Your Content: You represent and warrant that you own or otherwise have all the necessary rights to provide Your Content submitted to the Services, whether directly or indirectly, and represent and warrant that Your Content is accurate, non-confidential, and that it does not and will not infringe any intellectual property rights or personal data rights of any third party.Grant of license: By submitting Your Content to Ghost Foundation's Services, you grant Ghost Foundation a perpetual, irrevocable, world-wide, sublicensable, royalty-free, and non-exclusive license to reproduce, modify, adapt and publish Your Content solely for the purpose of displaying, distributing and promoting your site.Waiver of rights: You understand and agree to waive any rights you may have against Ghost Foundation, our assignees, sublicensees, and their assignees, in relation to the use of Your Content in connection with the provision of the Services.Deletion of Content: If you delete Your Content, Ghost Foundation will use reasonable efforts to remove it from your site, but you acknowledge that caching or references to Your Content may not be made immediately unavailable.Backups: You are solely responsible for securing and backing up Your Content.Exclusion of liability: You are entirely responsible for the content of, and any harm resulting from, Your Content. We take no responsibility and shall assume no liability for Your Content.2.2 ProhibitionsBy using any Service, you agree not to do, or permit others to do, any of the following:Through the Website, your site, or using our Services, tr