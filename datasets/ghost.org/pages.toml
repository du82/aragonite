full_description = "Integrations / SocialEmbed content from Instagram on your Ghost site using HTML cardsConnecting your social network presence to your publication is a great way to cross-pollinate your audiences. Here’s a quick guide for embedding public photos on Instagram directly into posts on your Ghost site.Copy the embed code on InstagramLocate the embed code for the image you’d like to embed by clicking the three dots in the top right corner ... and Embed:Then copy the code provided:Paste into an HTML cardHead back to your post in the Ghost editor and insert the embed code into a new HTML card:Publish your postThat’s all there is to it! Your new post will now include an embedded Instagram image. Here’s an example of the end result:View this post on InstagramBit of a change of pace from the chill Lofoten photos. In Vancouver now and it's spring and the weather is absolutely gorgeous. This is one of my favourite cities in the whole world! . . . . . #vancouverbc #vancouverphotographer #visualsofearth #ourlonelyplanet #thevisualscollective #lensbible #discoverglobe #folkmagazine #aov #eclectic_shotz #thisweekoninstagram @aroundtheworldpix @visualsofearth @earth @ourplanetdaily @discoverearthA post shared by John O'Nolan (@johnonolan) on May 30, 2018 at 1:44pm PDTDo more with ZapierAs always, you can power up your site even further using Zapier. If you’re already using Instagram for photos, then you might also like some of these complimentary automations:"
