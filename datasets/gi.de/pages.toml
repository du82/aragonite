full_description = "Software als Grundlage des Internets hat einen erheblichen Einfluss auf den Energieverbrauch, die Energieeffizienz und die Nutzungsdauer von Hardware und damit auf den Energie- und Ressourcenverbrauch des Internets. Trotz ihrer großen Bedeutung steckt eine allgemeine Regelung oder gar Empfehlung für nachhaltige Software noch in den Kinderschuhen. Im Projekt „Potentials of Green Coding“ erarbeiteten die Gesellschaft für Informatik e.V., die Hochschule für Technik und Wirtschaft (HTW) Berlin und der Umwelt-Campus Birkenfeld der Hochschule Trier Konzepte und Empfehlungen für eine Verankerung von Green Coding. Dieses Video bietet einen kleinen Einblick in den Workshop vom 07. März 2023, bei dem sich Vertreter*innen aus Forschung, Unternehmen und Zivilgesellschaft in Berlin trafen, um Herausforderungen und Gelingensbedingungen für die Umsetzung von Nachhaltigkeitszielen bei Software zu diskutieren. Die Vorträge in voller Länge gibt es auf: www.youtube.com/playlist Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
