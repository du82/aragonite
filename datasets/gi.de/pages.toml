["https://gi.de/themen/beitrag/alarmzeichen-deutschland-demnaechst-im-goldenen-microsoft-kaefig"]
title = "Alarmzeichen: Deutschland demnächst im goldenen Microsoft-Käfig? - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Auf dem Digital-Gipfel der Bundesregierung in Frankfurt wurde die Digitale Souveränität Deutschlands wieder einmal zur Chefsache erklärt. Doch insbesondere der Umgang mit Microsoft lässt daran zweifeln, wie ernst es der Bundesregierung und einigen Landesregierungen damit wirklich ist. Immer mehr deutsche Behörden wollen auf die Microsoft-Cloud zurückgreifen. Damit wandern auch zunehmend sensible Bürgerdaten in die Obhut des Tech-Konzerns. Die besorgniserregende Abhängigkeit von Microsoft wird nicht nur zementiert sondern weiter ausgebaut. Der Präsidiumsarbeitskreis „Digitale Souveränität“ und der Arbeitskreis „Datenschutz und IT-Sicherheit“ der Gesellschaft für Informatik (GI) e.V. sehen darin unvertretbare Risiken für die digitale Unabhängigkeit Deutschlands und den Schutz der Daten von Bürgerinnen und Bürgern sowie von Unternehmen. Und dafür gibt es gleich eine Reihe von Gründen. In einem Interview mit der BBC im Jahr 2021 beschreibt der britische Geheimdienstchef Sir Richard Moore, MI6, die Gefahren digitaler Abhängigkeiten. Der Auslandsgeheimdienstchef spricht dabei von einer „Datenfalle“: „Wenn Sie einem anderen Land erlauben, Zugang zu wirklich kritischen Daten über Ihre Gesellschaft zu erhalten, wird das mit der Zeit Ihre Souveränität aushöhlen, da Sie keine Kontrolle mehr über diese Daten haben.” Übertragen auf Deutschland schließt sich die Datenfalle, wenn die Planungen einiger Bundesländer zur Migration in die Microsoft Cloud verwirklicht werden. Durch diese Verlagerung öffentlicher Infrastrukturen und Daten in die Cloud eines US-Unternehmens unterliegen die Daten nicht nur den heimischen, sondern auch den Rechtsvorschriften der USA. Das liegt am US CLOUD Act. Er ermächtigt US-Behörden, ganz legitim auch auf Daten zuzugreifen, die in Rechenzentren von US-Dienstleistern außerhalb der USA gehalten werden. Dabei sind diese Dienstleister zum Stillschweigen über Zugriffe verpflichtet! Wer Daten in diesen ,Clouds’ speichert, verliert somit die Kontrolle über seine eigenen Daten. Er muss davon ausgehen, dass er damit ein hohes Risiko eingeht und unfähig wird, seine Zukunft selbständig gestalten zu können. Betriebsgeheimnisse und persönliche Daten könnten in falsche Hände geraten."
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
