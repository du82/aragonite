["https://gi.de/aktuelles/projekte/grand-challenges/internet-of-everything"]
title = "Internet of Everything - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Weiterentwicklung und die Zukunft des Internets hin zum Internet of Everything gehen einher mit neuen Anforderungen und großen Herausforderungen an Netze. Wie diesen gerecht zu werden ist, erörtert diese Grand Challenge. Das Internet ist längst Teil unseres alltäglichen Lebens und ermöglicht Innovationen in unterschiedlichsten Bereichen der Gesellschaft. Durch die Vernetzung von Menschen, Maschinen, Dingen, Daten, Prozessen und Diensten sowie die Verschmelzung der physischen und virtuellen Welten wird die Bedeutung des Internets in der Zukunft gesellschaftlich und wirtschaftlich weiter zunehmen. Die Grundlage dafür sind globale Kommunikationsnetze. Sie stellen zum einen Konnektivität zur Verfügung und übertragen die gigantischen Datenmengen schnell, nahezu in Echtzeit, sind aber dennoch effizient, zuverlässig und sicher. Dadurch sind die Anwendungen und Dienste in hoher Qualität nutzbar. Die Weiterentwicklung und die Zukunft des Internets hin zum Internet of Everything gehen einher mit neuartigen Anforderungen und großen Herausforderungen an die Netze. Denn das Internet of Everything umfasst die Idee, dass nicht nur physische Objekte (Internet of Things) und Menschen, sondern auch sensorische Erfahrungen (Internet of Senses), virtuelle Realitäten – und praktisch alles – verbunden und in ein größeres digitales Ökosystem integriert werden können. Menschen können sich physisch und virtuell als Avatare in erweiterten Realitätsumgebungen und in virtuellen Welten bewegen, kommunizieren und immersiv interagieren. Reale und virtuelle Welten verschmelzen, insbesondere durch digitale Zwillinge. Die Fusion von Kommunikations- und Compute-Infrastrukturen stellen herausfordernde Aufgaben für die Informatik dar: etwa zur nativen Integration von Künstlicher Intelligenz in die Netze oder auch der Integration von Technologien zur Erfassung von Sensordaten und Technologien in Kommunikationsnetze. Um Anwendungen in Bereichen wie Industrie 4.0, Smart Cities, Smart Grid, virtuelle Realitäten, vernetztes Fahren und Telemedizin erfolgreich umzusetzen sowie große Datenmengen effektiv zu erheben, zu übertragen und zu verarbeiten, ist eine leistungsfähige Kommunikationsinfrastruktur unerlässlich. Die Weiterentwicklung der Kommunikationsnetze und die Vernetzung der Welten sind ein Innovationsmotor für die Zukunft."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
