title = "GI und AlgorithmWatch veröffentlichen Policy Brief zu Data Trusts - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Im Rahmen des gemeinsam koordinierten Kompetenzzentrum Digital Autonomy Hub thematisieren die Gesellschaft für Informatik e.V. (GI) und AlgorithmWatch in ihrem Policy Brief das Konzept von Data Trusts zum selbstbestimmten Teilen von personenbezogenen Daten. Der von der GI und AlgorithmWatch veröffentlichte Policy Brief des Digital Autonomy Hubs geht der Frage nach, wie sich personenbezogene Daten für das Gemeinwohl nutzen lassen, ohne die individuelle Selbstbestimmung zu untergraben. Die oft diskutierte Idee der „Data Trusts“ könne eine Antwort auf diese Herausforderung sein, sofern die notwendigen (rechtlichen) Voraussetzungen geschaffen werden. Diese Publikation ist die erste Ausgabe von Policy Briefs des Digital Autonomy Hubs, welche zukünftig vierteljährlich erscheinen. Ziel der Policy Briefs ist es, Impulse und Denkanstöße an die (Fach-)Öffentlichkeit, politischen Entscheidungsträger*innen, Zivilgesellschaft und Wissenschaft zu geben. Außerdem werden Wissen und Erkenntnisse aus dem Netzwerk abgebildet und aktuelle Regulierungsansätze eingeordnet. Der Digital Autonomy Hub wird vom Bundesministerium für Bildung und Forschung im Rahmen des Forschungsprogramms „Technik zum Menschen bringen“ gefördert und von AlgorithmWatch und Gesellschaft für Informatik e.V. umgesetzt. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
