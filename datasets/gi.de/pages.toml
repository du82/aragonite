["https://gi.de/ueber-uns/leitung/geschaeftsfuehrung"]
title = "Geschäftsführung - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Die Geschäftsführung unterstützt Vorstand, Präsidium und Mitgliederversammlung in den die Gesellschaft betreffenden Angelegenheiten. Sie führt die Beschlüsse der anderen Organe der GI aus, verwaltet das Vermögen der GI im Auftrag des Vorstands und führt die Geschäfte des Vorstands in seinem Auftrag und nach seinen Entscheidungen. Beschlüsse des Vorstands über Angelegenheiten des Vermögens und des Haushalts der GI bedürfen der Zustimmung der Geschäftsführung. Cornelia Winter verantwortet das Vereinsmanagement und die Geschäftsstelle in Bonn. Sie pflegt die internen Netzwerke der größten Informatik-Fachgesellschaft im deutschsprachigen Raum, leitet die Geschäftsstelle in Bonn und ist seit dem Jahr 2000 bei der GI. Als Gesellschafterin vertritt sie die GI im Aufsichtsrat von Schloss Dagstuhl - Leibniz-Zentrum für Informatik. Davor arbeitete sie als Journalistin u.a. bei der japanischen Wirtschaftszeitung „Sankei Shinbun“ und der japanischen Nachrichtenagentur „Kyodo News“. Sie studierte Japanologie, Religionswissenschaft und Völkerkunde an den Universitäten Bonn, Köln und als Rotary-Stipendiatin an der kaiserlichen Universität in Nagoya/Japan. Daniel Krupka vertritt die Gesellschaft für Informatik als Geschäftsführer in Öffentlichkeit, Politik, Wirtschaft und Gesellschaft. Er pflegt die externen Netzwerke der größten Informatik-Fachgesellschaft im deutschsprachigen Raum und leitet die Geschäftsstelle in Berlin. Er ist verantwortlich für Projekte der GI u.a. zu künstlicher Intelligenz, Green Coding/ Digital Green Tech sowie zu digitaler Bildung und digitaler Souveränität, zu Data Literacy und Data Science. Er vertritt die Gesellschaft für Informatik u.a. im Beirat "Digitalstrategie Deutschland" des Bundesministeriums für Digitales und Verkehr, im Fachbeirat der Allianz für Cybersicherheit sowie in den Beiräten der Bundesweiten Informatikwettbewerbe, des KI-Campus, der Toolbox Datenkompetenz, des Council of European Professional Informatics Societies oder der International Federation for Information Processing und wirkt im Themennetzwerk Informations- und Kommunikationstechnologie der Akademie der Technikwissenschaften (acatech) mit. Daniel Krupka studierte Public Policy und Management an der Universität Konstanz, der Jiao Tong University in Shanghai (VR China) und der York University in Toronto (Kanada).'
