full_description = 'Obwohl die Informatik eine vergleichsweise junge Disziplin ist, liegen ihre Ursprünge teilweise weit zurück – mitunter tief im vorletzten Jahrhundert. Die Informatik wäre nichts ohne herausragende Persönlichkeiten, die das Fach geprägt und informatische Entwicklungen maßgeblich vorangetrieben haben. Der Arbeitskreis "Bild der Informatik" hat elf herausragende Informatikpersönlichkeiten identifiziert, die wir Ihnen hier vorstellen wollen. Dabei werden auch Seiten und Anekdoten der Informatik-Pioniere, visionären Unternehmer und einfallsreichen Erfinder vorgestellt, die möglicherweise überraschen. Eines wird schnell klar: Nicht alle Informatik-Meilensteine kommen aus dem Silicon Valley. Lassen Sie sich überraschen und lernen Sie die Pioniere der Informatik hier näher kennen. Printplakate (DinA 2, auf Din A 4 gefalzt) können Sie per E-Mail bestellen. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern.'
