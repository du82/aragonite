["https://gi.de/meldung/recap-fachgespraech-kuenstliche-intelligenz-des-gi-wirtschaftsbeirats"]
title = 'Recap: Fachgespräch "Künstliche Intelligenz" des GI-Wirtschaftsbeirats - Gesellschaft für Informatik e.V.'
description = 'Der GI-Wirtschaftsbeirat der Gesellschaft für Informatik diskutierte bei einem Fachgespräch zum Thema "Künstliche Intelligenz" im Fraunhofer Forum im Spreepalais Berlin u.a. mit Saskia Esken, MdB (SPD), Dr. Tina Klüwer (Geschäftsführerin Parlamind), Andreas Hartl (BMWi) und Prof. Ingo Timm (Sprecher GI-Fachbereich KI)  über die nationale KI-Strategie der Bundesregierung und den Vorschlag eines Daten-Für-Alle-Gesetzes.'
full_description = 'Der GI-Wirtschaftsbeirat der Gesellschaft für Informatik diskutierte bei einem Fachgespräch zum Thema "Künstliche Intelligenz" im Fraunhofer Forum im Spreepalais Berlin u.a. mit Saskia Esken, MdB (SPD), Dr. Tina Klüwer (Geschäftsführerin Parlamind), Andreas Hartl (BMWi) und Prof. Ingo Timm (Sprecher GI-Fachbereich KI) über die nationale KI-Strategie der Bundesregierung und den Vorschlag eines Daten-Für-Alle-Gesetzes. Gestern hat der GI-Wirtschaftsbeirat in Berlin ein Fachgespräch zum Thema "Künstliche Intelligenz" veranstaltet. Als Einstieg hat Andreas Hartl, Leiter des Referats „Künstliche Intelligenz / Datenökonomie“ im Bundesministerium für Wirtshchaft und Energie (BMWi) die im November 2018 von der Bundesregierung veröffentlichte nationale Strategie Künstliche Intelligenz vorgestellt. Die nationale Strategie Künstliche Intelligenz der Bundesregierung soll vor dem Hintergrund der dynamischen Entwicklungen der Technologie die wesentlichen Rahmenbedingungen vorgeben. Die KI-Strategie ist als lernende Strategie angelegt, die es kontinuierlich gemeinsam durch Politik, Wissenschaft, Wirtschaft und Zivilgesellschaft neu zu justieren gilt. Die Gesellschaft für Informatik hat unter Federführung des Fachbereichs "Künstliche Intelligenz" Stellung zu der KI-Strategie genommen. Prof. Dr. Ingo Timm, Sprecher des Fachbereichs Künstliche Intelligenz in der GI bewertete die Strategie: "Wir begrüßen das Vorhaben einer signifikanten Förderung von KI in Forschung, Lehre und praktischer Anwendung - msofern das so kommt wie geplant. Wir unterstützen, dass unter der Bezeichnung „Artificial Intelligence (AI) made in Germany“ - besser made in Europe - eine breite wissenschaftliche und technologische Basis unter Berücksichtigung bereits bestehender, exzellenter Kompetenzen in der KI als Ganzes erfolgen soll, die nicht nur auf das KI-Teilgebiet Maschinelles Lernen beschränkt ist. Das Forschungsgebiet KI umfasst neben dem Bereich des Maschinellen Lernens (ML) eine große Palette weiterer Forschungsgebiete, wie beispielsweise wissensbasierte Systeme und Deduktion, Robotik, intelligente Suche und Optimierung, automatische Planung und Konfiguration."'
author = "Gesellschaft für Informatik (GI)"
year_published = 2019
