description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "2020 dreht sich bei den DeveloperCamps der Gesellschaft für Informatik alles um das Thema „Future Computing“: Künstliche Intelligenz, Machine Learning und künstliche neuronale Netz, Data Analytics und Data Science, Quantencomputing und die Blockchain-Technologie sind nur einige Trends in der Informatik, die die Softwareentwicklung künftig prägen werden. Gemeinsam mit den Teilnehmern und Teilnehmerinnen der DeveloperCamps wollen wir tief in diese Technologien blicken, praktische Beispiele ihres Einsatzes kennenlernen und hinterfragen, welche Entwicklungen an welcher Stelle sinnvoll eingesetzt werden können. Die Informatikerinnen und Informatiker gestalten diese Entwicklungen. Mit dieser Veranstaltungsreihe soll konkretes Entwicklerwissen zur Gestaltung zukünftiger Arbeitswelten insbesondere mit Technolgien der sogenannetn Künstlichen Intelligenz (KI) mit einem besonderen Blick vermittelt werden. DevevoperCamp – der Informatiktag ist eine Kombination aus Konferenz und Barcamp. Am Vormittag finden Fachvorträge und Workshops namhafter Expertinnen und Experten statt – kuratiert von der Gesellschaft für Informatik (GI) e. V. Am Nachmittag werden die Teilnehmende aktiv ins Programm eingebunden: Es gibt nur Mitwirkende. Die Bar-Camp Sessions (je 45 Minuten) werden von den Teilnehmerinnen und Teilnehmern selbst gewählt und gehalten. Im Gegensatz zu einem BarCamp ist das DeveloperCamp eine intimere Veranstaltung – speziell für Entwicklerinnen und Entwickler. Statt offene Themen zu erlauben, beschränken wir diese auf alles, was direkt und indirekt mit KI, Mobile, Web- und Softwareentwicklung zu tun hat. Nach dem Veranstaltungsprogramm findet zudem ein Get-Together für alle Teilnehmenden und Speaker statt. 9:00 - 9:30 Uhr // Registrierung 9:30 - 10:00 Uhr // Begrüßung & Vorstellung Workshops 10:00 – 12:30 Uhr // Deep-Dive Workshops 12:30 - 13:00 Uhr // Sessionplanung 13:00 - 14:00 Uhr // Mittagspause & Job-Talk 14:00 - 17:00 Uhr // BarCamp 17:00 - 17:30 Uhr // Wrap-Up & Preisverleihung 17:30 - max. 19:00 Uhr // Get-Together & Job-Talk"
