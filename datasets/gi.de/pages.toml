full_description = 'Die GI-Mitgliedschaft kann jeweils zum 01.01., 01.04., 01.07. und 01.10. schriftlich beantragt werden. Das Antragsformular sowie Informationen zur GI-Mitgliedschaft finden Sie unter: https://gi.de/mitgliedschaft/ Detaillierte Informationen zu den einzelnen Mitgliedsbeiträgen und die ggf. erforderlichen Nachweise finden Sie unter https://gi.de/mitgliedschaft/beitragsinformationen/ oder können über mitgliederservice@gi.de / T: +49 (0) 228 302 -149 oder -151 erfragt werden. Ihr Beitrag wird innerhalb von vier Wochen ab Ausstellungsdatum der Beitragsmitteilung fällig. Die Beitragsmitteilung stellen wir standardmäßig als PDF-Datei im Mitgliederbereich "Meine GI" https://meine.gi.de/ zur Verfügung. Die Mitgliedsnummer finden Sie in der Aufnahmebestätigung, auf der Beitragsmitteilung oder Ihrem Mitgliedsausweis. Sie können diese auch telefonisch im Mitgliederservice unter: +49 228 302 -149 oder -151 erfragen. Die Mitgliedschaft gilt lt. Satzung (§ 3, Abs. 3.3) mindestens für das Jahr des Eintritts und das darauffolgende Kalenderjahr und verlängert sich bei Nichtkündigung um jeweils ein weiteres Kalenderjahr. Die Mitgliedschaft muss schriftlich gekündigt werden. Kündigungstermin ist der 30.11. zum 31.12. eines Jahres. Kontaktdaten: Gesellschaft für Informatik e. V. (GI), Ahrstr. 45, 53175 Bonn E-Mail: mitgliederservice@gi.de, Fax: +49(0)228 302 167 Austritte sind nur zum Ende eines Kalenderjahres zulässig. Es gilt der Kündigungstermin 30.11. zum 31.12. eines Jahres. Eine Mitgliedschaft gilt lt. Satzung (§ 3, Abs. 3.3.) mindestens für das Jahr des Eintritts und das darauffolgende Kalenderjahr. Kontaktdaten: Gesellschaft für Informatik e. V. (GI), Ahrstr. 45, 53175 Bonn E-Mail: mitgliederservice@gi.de, Fax: +49(0)228 302 167 Nein, ein Ruhen der Mitgliedschaft ist nicht möglich - die Mitgliedschaft muss gekündigt werden (Kündigungstermin 30.11. zum 31.12. eines Jahres) Kontaktdaten: Gesellschaft für Informatik e. V. (GI), Ahrstr. 45, 53175 Bonn E-Mail: mitg