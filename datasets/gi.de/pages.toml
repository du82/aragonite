["https://gi.de/meldung/internationaler-award-fuer-ehemaligen-gi-praesident-heinrich-mayr"]
title = "Internationaler Award für ehemaligen GI-Präsident Heinrich Mayr - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Der diesjährige Peter P. Chen Award für herausragende Beiträge im Bereich Conceptual Modeling ehrt den Forscher, Professor und ehemaligen GI-Präsidenten Heinrich Mayr. Peter P. Chen hat 1976 mit dem Entity-Relationship-Konzept (ER) wesentliche Grundlagen für das moderne Data- und Software-Engineering gelegt. Seit 2008 verleiht die internationale Informatik-Community, unterstützt vom Elsevier-Verlag, deshalb alljährlich den Peter P. Chen Award an eine Person, die in ihrer wissenschaftlichen Karriere herausragende Beiträge im Bereich Conceptual Modeling geleistet hat. In diesem Jahr geht der Preis an em. O.Univ-Prof. Dr. Dr.h.c. Heinrich C. Mayr, ehemaliger Präsident der GI. Heinrich Mayr ist der erste Preisträger, der in Österreich forscht und lehrt. Schwerpunkte seiner Arbeit sind Grundlagen der Modellierung und Modellierungsmethoden für die Erstellung benutzerzentrierter Systeme. Die Jury nennt in ihrer Begründung für die Verleihung mehr als 45-jährige Forschungsarbeit, seinen umfangreichen Beitrag zu Anwendungen, seinen internationalen Ruf sowie seinen „beispielhaften“ Einsatz für die konzeptionelle Modellierung. So war er auf höchster Ebene bei der ER-Konferenz aktiv, organisierte im Jahr 2005 eine ER-Konferenz in Klagenfurt und prägte zahlreiche Studierende, die heute etablierte und anerkannte Forscher sind. Neben der Wissenschaft engagierte und engagiert Heinrich Mayr sich auch ehrenamtlich in der GI. Im Jahr 1979 gründete er die Fachgruppe „Formale Modelle für Informationssysteme“ (heute EMISA), er war Sprecher des damaligen Fachbereichs „Softwaretechnik und Informationssysteme“ und von 1996 bis 1999 Finanzvizepräsident der GI. Im Jahr 2001 gründete er die Reihe „Lecture Notes in Informatik“ und wirkte als deren Hauptherausgeber bis ins Jahr 2021. Von 2000 bis 2004 vertrat er die Fachgesellschaft als Präsident. An der Universität Klagenfurt wirkte er unter anderem 10 Jahre als Dekan und sechs Jahre als Rektor, brachte sich als Hochschulrat der PH Kärnten in die Lehrer:innenbildung ein und unterstützte die Gründung eines IT-Studienganges an der Fachhochschule Kärnten, der er auch lange als Aufsichtsrat diente. Nebenbei engagierte er sich für den Aufbau einer IT-Szene und -Infrastruktur im Bundesland Kärnten. Außerdem ist Heinrich Mayr ist Fellow der Gesellschaft für Informatik, Ehrendoktor der TU Kharkiv, Honored Professor of Science der Kherson State University, Träger der Goldenen Medaille der Stadt Klagenfurt und der großen Ehrenmedaille der Wirtschaftskammer Kärnten."
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
