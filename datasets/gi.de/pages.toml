["https://gi.de/dissertationspreis"]
title = "Dissertationspreis - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Die Gesellschaft für Informatik e.V. (GI) vergibt gemeinsam mit der Oesterreichischen Computergesellschaft (OCG) und der Schweizer Informatik Gesellschaft (SI) (im Folgenden "beteiligte Gesellschaften" genannt) jährlich einen Preis für eine hervorragende Dissertation (GI-Dissertationspreis). Die Dissertation muss in der Informatik angesiedelt sein. Hierzu zählen nicht nur Arbeiten, die einen Fortschritt für die Informatik bedeuten, sondern auch Arbeiten aus den Anwendungen der Informatik in anderen Disziplinen und Arbeiten, die die Wechselwirkungen zwischen Informatik und Gesellschaft betreffen. Die beteiligten Gesellschaften möchten hervorragende Forschungsergebnisse junger Wissenschaft- lerinnen und Wissenschaftler auf dem Gebiet der Informatik einer breiten Öffentlichkeit vorstellen. Darüber hinaus soll der Wissenstransfer von der Forschung in die Technik, Wirtschaft und Gesellschaft gefördert werden. Der Dissertationspreis ist mit 5.000 Euro dotiert. Davon tragen OCG und SI je 1.000 Euro, die GI übernimmt 3.000 Euro. Vorschlagsberechtigt sind die wissenschaftlichen Hochschulen der Bundesrepublik Deutschland, Österreichs und der Schweiz, die das Promotionsrecht in den oben genannten Bereichen haben. Jede Hochschule darf maximal eine Dissertation für den Preis nominieren. Alle nominierten Dissertationen werden in einer 10-seitigen deutschsprachigen Kurzfassung in einem speziellen LNI-Format zusammen unter dem Titel "Ausgezeichnete Informatikdissertationen 2024“ von der GI publiziert. Die mit dem Preis ausgezeichnete Dissertation wird in der Einleitung dieses Bandes besonders gewürdigt. Die Preisverleihung erfolgt auf der Jahrestagung der Gesellschaft für Informatik e.V. (GI), der „INFORMATIK2024“, durch die Präsidentin. Die Entscheidung trifft ein Gremium, das sich aus von den beteiligten Gesellschaften ernannten Professorinnen und Professoren zusammensetzt. Die nominierten Wissenschaftlerinnen und Wissenschaftler sollen die Ergebnisse ihrer Dissertationen im Rahmen eines Kolloquiums (25. - 28. Mai 2025) im Leibniz-Zentrum für Informatik – Schloss Dagstuhl – vorstellen und mit dem Auswahlgremium und den anderen Nominierten diskutieren. Es wird erwartet, dass die Nominierten während des gesamten Kolloquiums anwesend sind. Die Aufenthaltkosten in Dagstuhl werden von der GI übernommen; die Kosten für die Anreise sind von den Nominierten oder ihrer Hochschule zu tragen.'
