["https://gi.de/meldung/neue-nis-2-version-gi-fordert-konsequenz-statt-ausnahmen"]
title = "Neue NIS-2-Version: GI fordert Konsequenz statt Ausnahmen - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Gesellschaft für Informatik (GI) hat die neue Formulierungshilfe zum NIS-2-Umsetzungs- und Cybersicherheitsstärkungsgesetz (NIS2UmsuCG) kritisch gelesen. Darin sieht sie im Vergleich zu vorherigen Versionen Verbesserungen. Ausnahmen und weiterhin unklare Begrifflichkeiten verringern jedoch ihre Wirksamkeit. Die GI fordert daher mehr Konsequenz. Berlin, 18. Dezember 2024 | Die GI veröffentlicht eine Stellungnahme zur neuen Formulierungshilfe des NIS-2-Umsetzungs- und Cybersicherheitsstärkungsgesetz. Der auf den 29. November datierte Entwurf soll die NIS-2-Richtlinie der Europäischen Union auf nationaler Ebene umsetzen, die AG KRITIS veröffentliche die Version. Die GI weist auf wichtige Aspekte hin, die das Parlament hoffentlich noch in dieser Wahlperiode stattfindenen Verabschiedung umsetzen sollte. Dr. Aleksandra Sowa, Fachexpertin der GI-Fachgruppe „Datenschutzfördernde Technik“ (PET): „Das NIS-2-Umsetzungsgesetz ist unnötig komplex. Ich sehe hier wie bei anderen IT-Sicherheitsgesetzen einen Trend zur 'Microlegislation', also immer detaillierteren gesetzlichen Regelungen mit vielen Ausnahmen und Verzweigungen. Komplexität ist aber der Feind von Sicherheit. Es braucht klare und einfache Regelungen, etwa das BSI als einzige zentrale Meldestelle oder eine unwidersprochene Pflicht zur Offenlegung von Schwachstellen.“ Linda Schwarz Senior Referentin Politik & Wissenschaft Geschäftsstelle Berlin im Spreepalais am Dom Anna-Louisa-Karsch-Str. 2, 10178 Berlin E-Mail: presse@gi.de Tel: +49 1590 648 79 87 Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert."
