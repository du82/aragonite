["https://gi.de/meldung/auszeichnung-mint-freundliche-schulen-und-digitale-schulen-in-rheinland-pfalz-2020"]
title = "Auszeichnung „MINT-freundliche Schulen“ und „Digitale Schulen“ in Rheinland-Pfalz 2020 - Gesellschaft für Informatik e.V."
description = "30 Schulen aus Rheinland-Pfalz wurden heute in einer Onlineveranstaltung von der rheinland-pfälzischen Bildungsministerin Dr. Stefanie Hubig als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten sechs Schulen das erste Mal die Auszeichnung und weitere 24 Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus wurden 18 Schulen, davon zehn erstmalig, als „Digitale Schule“ geehrt."
full_description = "30 Schulen aus Rheinland-Pfalz wurden heute in einer Onlineveranstaltung von der rheinland-pfälzischen Bildungsministerin Dr. Stefanie Hubig als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten sechs Schulen das erste Mal die Auszeichnung und weitere 24 Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus wurden 18 Schulen, davon zehn erstmalig, als „Digitale Schule“ geehrt. Die Ehrung der „MINT-freundlichen Schulen“ in Rheinland-Pfalz steht unter der Schirmherrschaft von Bildungsministerin Dr. Stefanie Hubig und der Kultusministerkonferenz (KMK), die Ehrung der „Digitalen Schulen“ steht unter der Schirmherrschaft der Beauftragten der Bundesregierung für Digitalisierung, Staatsministerin Dorothee Bär. Das Jahr 2020 hat uns allen nochmals verdeutlicht, was für eine wichtige Rolle Digitalität in unserem Bildungssystem spielt. In der Covid-19-Pandemie erleben wir, dass Schulen sich stärker für die Chancen der digitalen Bildung öffnen. Sie wollen sich entwickeln und die eigene digitale Transformation vorantreiben. Um Schulen zu motivieren, ihr digitales Profil weiter zu schärfen und informatische Inhalte verstärkt in den Unterricht zu bringen, hat die Initiative »MINT Zukunft schaffen« die Auszeichnung „Digitale Schule“ ins Leben gerufen. Mit dem Signet soll das Engagement der Schulleitungen und Lehrkräfte gewürdigt und bestärkt werden, die sich für eine zeitgemäße Bildung in der digitalen Welt stark machen. Das Zusammenspiel zwischen Digitalisierung und Mathematik, Informatik, Naturwissenschaften und Technik (MINT) hat sich ebenfalls als für die Schulentwicklung in der Covid-19-Krise als entscheidend herausgestellt. Die heute ausgezeichneten »MINT-freundlichen Schulen« zeigen, dass sie mit ihrem schulischen Konzept in der Lage sind, Ad-Hoc-Maßnahmen – z.B. zur Digitalisierung – didaktisch und pädagogisch durchdacht in den Schulalltag einzubinden. Die »MINT-freundlichen Schulen« werden für Schülerinnen und Schüler, Eltern, Unternehmen sowie die Öffentlichkeit durch die Ehrung sichtbar und von der Wirtschaft nicht nur anerkannt, sondern auch besonders unterstützt. Bundesweite Partner der Initiative »MINT Zukunft schaffen« zeichnen diejenigen Schulen aus, die bewusst MINT-Schwerpunkte setzen. Die Schulen werden auf Basis eines anspruchsvollen, standardisierten Kriterienkatalogs bewertet und durchlaufen einen bundesweit einheitlichen Bewerbungsprozess."
author = "Gesellschaft für Informatik (GI)"
