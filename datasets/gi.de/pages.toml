full_description = "Es braucht ein gemeinsames europäisches und sektorenübergreifendes Ausbildungs- und Zertifizierungssystem für die Kompetenzen des 21. Jahrhunderts. Diese Herausforderung soll das Forschungsprojekt ComeThinkAgain angehen, an dem auch die Gesellschaft für Informatik beteiligt ist. Das Projekt „COMputational and Entrepreneurial THINKing And Green Agenda INnovations” (ComeThinkAgain) ist ein europäisches Erasmus+ Bildungsprojekt. Dafür werden Zertifizierungs-Module entwickelt. Diese decken drei Kompetenzbereiche ab: Computational Thinking, Entrepreneurial Thinking und Soziale Verantwortung und Nachhaltigkeit. Sie werden im Train-the-Trainer-Ansatz mit Lehrkräften und Ausbilder*innen der beruflichen Bildung pilotiert. Die Inhalte sollen allen zertifizierten Personen als Open Educational Ressources zur Verfügung gestellt werden, damit sie im Klassenraum oder in Berufsschulen eingesetzt werden können. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
