["https://gi.de/service/infomaterial/schule"]
title = "Schule - Gesellschaft für Informatik e.V."
description = "Fit für's Studium - Informatik"
full_description = 'Die Schülerinnen und Schüler bekommen eine kostenlose Mitgliedschaft mit allen GI-Angeboten und Leistungen für ein Jahr. Die Schulen können bis zu fünf beitragsfreie Mitgliedschaften vergeben. Anders als in den Vorjahren können die Schulen nur ein Geschenkbuch vergeben, denn wir haben nur noch ein begrenztes Kontingent. Dafür haben die Fachlehrerinnen und Lehrer die Auswahl unter drei Büchern. Die Bestellung der Bücher bitte über das Formular unten auf dieser Seite vornehmen. Zur Überreichung der Auszeichnung können Sie hier eine Musterurkunde herunterladen und bearbeiten. Den oder die Aufnahmeanträge überreichen Sie ebenfalls Ihren Preisträgerinnen und Preisträgern: Dazu laden Sie bitte für die Preisträger das entsprechende Formular herunter, damit wir die Schülerinnen und Schüler korrekt aufnehmen können (Das Formular sollen die Preisträger bitte ausfüllen und zu uns schicken). Bitte auch das Feld "Die Mitgliedschaft wurde vergeben von" berücksichtigen. Das Formular kann von den Preisträger*innen -wie auch immer- übertragen werden. Als Scan-Dok. bitte direkt an den Mitgliederservice. Idealerweise übergeben die Lehrerinnen und Lehrer Buch, Urkunden und Anmeldung zur GI im Rahmen der Abschlussfeiern an die Preisträger*innen. Für Fotos von der Preisverleihung auf den Schulfeiern wären wir dankbar. Ihre Zustimmung vorausgesetzt, würden wir diese auf unserer Twitter-Seite veröffentlichen. Die Buchgeschenke 2025 stellt uns auch in diesem Jahr freundlicherweise der Rheinwerk Verlag zur Verfügung. Rheinwerk ist Deutschlands führender Fachverlag für digitale Themen und hat bereits zahlreiche Standardwerke der Informatik veröffentlicht, unter anderem das beliebte Handbuch »Java ist auch eine Insel«. Aktuell stehen drei Titel zur Auswahl: (das Buchcover ist auf Inhaltsangabe verlinkt): Lesen Sie hier, wie die Buchreihe »Fit fürs Studium« Schüler*innen, Abiturient*innen, Studierende und sogar Sie als Lehrkräfte weiterbringt: In den vergangenen Jahren haben wir in Zusammenarbeit mit unseren Hochschulgruppen und dem Vorstand der GI sehr erfolgreich eine Veranstaltung für die Schülerinnen und Schüler durchgeführt, die unser Angebot einer beitragsfreien Mitgliedschaft angenommen haben. Thema der (digitalen) Veranstaltung war „Die Aufnahme eines Informatik-Studiums“. Gerne würden wir diese Veranstaltung auch für weitere Schülerinnen und Schüler öffnen, die sich für eine Informatik-Studium interessieren. Wenn Sie Ihre Schülerinnen und Schüler zu unserer Veranstaltung einladen möchten, hinterlassen Sie uns hier bitte hier Ihre Kontaktdaten. Die Daten werden nur zu diesem Zweck verarbeitet. Wer sich bereits im letzten Jahr eingetragen hat, muss das nicht noch einmal tun.'
