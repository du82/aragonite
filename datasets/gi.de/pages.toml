["https://gi.de/en/aktuelles/meldungen/detail/muster-leitlinien-fuer-die-entwicklung-von-forschungssoftware-veroeffentlicht"]
title = "Muster-Leitlinien für die Entwicklung von Forschungssoftware veröffentlicht - Gesellschaft für Informatik e.V."
description = "Die Gesellschaft für Informatik e.V. (GI) und die Gesellschaft für Forschungssoftware – deRSE e.V. haben eine Handreichung für eigene Leitlinien an Universitäten, Hochschulen und Forschungseinrichtungen zur effizienten Softwareentwicklung in Forschungsprojekten entwickelt, die informatische, juristische und organisatorische Aspekte adressieren."
full_description = "Die Gesellschaft für Informatik e.V. (GI) und die Gesellschaft für Forschungssoftware – deRSE e.V. haben eine Handreichung für eigene Leitlinien an Universitäten, Hochschulen und Forschungseinrichtungen zur effizienten Softwareentwicklung in Forschungsprojekten entwickelt, die informatische, juristische und organisatorische Aspekte adressieren. Egal, ob in der Erforschung von Krankheiten und deren Behandlung, bei technologischen Innovationen oder in den Naturwissenschaften: Wissenschaftliche Erkenntnisse werden zunehmend durch softwaregestützte Forschung gewonnen. Die Software, die für wissenschaftliche Forschungsprojekte entwickelt und in diesen verwendet wird, ist schon heute ausschlaggebend für die Qualität der Forschung. Deshalb kommt der Entwicklung von Forschungssoftware eine immer größere Bedeutung zu. Allerdings sind genau diese Entwicklungsprozesse oft sehr ineffizient, wenig strukturiert, standardisiert und nachhaltig gestaltet. Prof. Dr. Bernhard Rumpe, GI-Fachgruppe RSE: „Mit der Verwendung von Software Engineering-Praktiken für die Entwicklung von Forschungssoftware, dem Research Software Engineering (RSE), können enorme Potenziale für eine hochwertigere, effizientere und nachhaltigere Forschung gehoben werden. Mit den „Muster-Leitlinien zur effizienten Softwareentwicklung in Forschungsprojekten“ wollen wir die in Jahrzehnten entwickelten und etablierten Praktiken des Software Engineering in den Forschungsinstitutionen effizient und agil anwenden, weil in vielen Bereichen immer komplexere Software entwickelt und weiterentwickelt wird.“ Dr. Jan Linxweiler, Co-Vorsitzender de-RSE: „Diese Muster-Leitlinien werden Universitäten, Hochschulen und Forschungseinrichtungen helfen, eigene disziplin- und fachspezifische Leitlinien für ihre Softwareprojekte zu entwickeln. Uns ist bewusst, dass wir keine allgemeingültige Leitlinie, die auf alle Forschungskontexte und Softwareformen anwendbar ist, herausgeben können. Deshalb stellen wir explizit Varianten und optionale Textbausteine zur Verfügung, die individuell kombiniert werden können. Denn bessere Software ermöglicht bessere Forschung.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
