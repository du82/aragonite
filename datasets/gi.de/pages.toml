["https://gi.de/meldung/datenkompetenz-data-literacy"]
title = "Datenkompetenz – Data Literacy - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Unsere moderne Welt produziert ein rasant steigendes Datenvolumen. Einem Bericht von IDC zufolge umfasst die Global Datasphere im Jahr 2019 bereits über 40 Zettabyte, das sind 40.000.000 Petabyte [1]. IDC versteht darunter die Daten, die weltweit neu erzeugt, verarbeitet und verteilt werden. Gleichzeitig wurden 2019 weltweit Speichermedien mit einer Gesamtkapazität von ca. 2 Zettabyte verkauft [1]. Das neue Jahrtausend wird zum Zeitalter der Daten. Fortschritte in der Halbleiter- und Vernetzungstechnik lieferten die Grundlage für ein exponentielles Wachstum an Leistung und Geschwindigkeit in allen IT-basierten Systemen. Man sieht das im privaten Bereich: Eine digitale Kamera Baujahr 1999 erstellte Bilder mit einer Auflösung von 640x480 Pixel, aktuell erfassen sie mehr als 20 Millionen Punkte pro Bild und im Laufe einer Urlaubsreise entstehen leicht 1.000 Bilder und mehr. Bilder aus z.B. medizinischen Geräten oder Satelliten haben über die Jahre vergleichbare Dimensionssteigerung erfahren. Darüber hinaus gibt es zunehmend mehr Datenproduzenten jeglicher Art und die Heterogenität der Daten steigt an. Auch wird erwartet, auf Daten von jedem Ort der Welt über einen garantierten langen Zeitraum zugreifen zu können. Um diese wachsende Datenflut in ihrer Komplexität beherrschen zu können, bedarf es einer umfassenden Datenkompetenz (neudeutsch: data literacy). Der Begriff der Datenkompetenz bzw. Data Literacy ist noch jüngeren Datums. Er umfasst die Fähigkeiten, Daten auf kritische Art und Weise zu sammeln, zu managen, zu bewerten und anzuwenden [2]. Datenkompetenz wird zu einer Schlüsselkompetenz für das 21. Jahrhundert, in dem Daten den Rohstoff zu Wissens- und Wertschöpfung in den unterschiedlichsten Zusammenhängen darstellen. Das Hochschulforum Digitalisierung beschreibt in seinem Bericht „Future Skills: Ansätze zur Vermittlung von Data Literacy in der Hochschulbildung“ [3,4,5] fünf Kompetenzbereiche. Sie orientieren sich am Lebenszyklus von Daten von der Erzeugung bis zur Nutzung. Zunächst soll in einem konzeptionellen Rahmen das Wissen über und das Verständnis für Daten aufgebaut werden, um deren Nutzung und Anwendung verstehen zu können. Der zweite Bereich umfasst die Datensammlung. Wir erfassen Daten aus den unterschiedlichsten Quellen, z.B. aus Messgeräten und Sensoren, in Form von Berechnungsergebnissen aus wissenschaftlich-technischen Simulationen aber auch z.B. aus Nachrichten in sozialen Medien. Diese Datenquellen müssen bezüglich ihrer Zuverlässigkeit und der Qualität der Daten kritisch bewertet werden. Im Kompetenzbereich Datenmanagement befasst man sich mit der Qualität der Daten. Daten werden kuratiert, d.h. Anomalien werden beseitigt, Ausreißer entfernt. Datenformate werden konsolidiert und dabei Daten gegebenenfalls konvertiert. Den Schwerpunkt stellt die Annotierung der Daten mit Metainformationen dar. Nur ausreichend annotierte Daten können zu einem späteren Zeitpunkt weiterverwertet werden. Das Datenmanagement befasst sich auch mit der Datenspeicherung und ggf. einer Langzeitarchivierung. Im Folgenden werden die Daten ausgewertet. Der Kompetenzbereich Datenevaluation erfasst die numerische und graphische Auswertung von Daten mittels geeigneter Methoden und Werkzeuge. Die Daten werden interpretiert und präsentiert und im Rahmen von Entscheidungsfindungsprozessen verwertet. Der Kompetenzbereich Datenanwendung schließlich befasst sich schwerpunktmäßig mit Fragen der Datenethik, der Datenzitierung, der Datenverteilung und der Evaluierung von datenbasierten Entscheidungen."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
