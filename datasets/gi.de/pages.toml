title = "Unterrichtspreis - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Die Gesellschaft für Informatik vergibt alle zwei Jahren einen Preis für bemerkenswerte Ideen zur Gestaltung von Informatikunterricht. Ausgezeichnet werden Lehrkräfte an allgemeinbildenden und beruflichen Schulen. Die Preisverleihung erfolgt auf der Fachtagung INFOS des Fachausschusses "Informatische Bildung in Schulen". Die Preisträger erhalten die Möglichkeit, ihre Ideen zum Informatikunterricht der interessierten Öffentlichkeit auf der jeweiligen GI-Fachtagung Informatik und Schule (INFOS) sowie in deren Tagungsband vorzustellen. Die Federführung für den Wettbewerb liegt beim Fachausschuss Informatische Bildung an Schulen. Dieser schreibt den Unterrichtspreis anlässlich der Fachtagung INFOS aus und setzt eine fachkundige Jury ein. Wenn Sie an einer deutschsprachigen allgemeinbildenden oder berufsbildenden Schule unterrichten, können Sie sich für den Unterrichtspreis der Gesellschaft für Informatik e. V. bewerben. Der Preis wird jeweils in den ungeraden Jahren ausgeschrieben und vergeben. Ihre Kurzbeschreibung des Projekts reichen Sie bitte online über https://gi.de/unterrichtspreis-anmeldung-2025 ein. Bewerbungen sind immer bis zum Anfang eines ungeraden Jahres möglich, in dem eine INFOS stattfindet. Die genauen Termine entnehmen Sie bitte der aktuellen Ausschreibung. Bei der Beurteilung achtet die Jury auf Originalität und Praktikabilität in Bezug auf einige der folgenden Fragestellungen. Der GI-Unterrichtspreis wird seit 2005 verliehen und hat in der Vergangenheit eine Vielzahl an innovativen Konzepten für einen ansprechenden Informatikunterricht ausgezeichnet. Hier finden Sie eine Übersicht der bisherigen Preisträger: Im Rahmen des GI-Unterrichtspreises 2023 wurde Christoph Gräßl vom Donau-Gymnasium Kelheim für sein herausragendes Unterrichtskonzept „Unravel – Bilderkennung mit neuronalen Netzen“ ausgezeichnet. Die Preisverleihung würdigt sein einzigartiges didaktisch-methodisches Vorgehen, mit dem er das Thema der künstlichen Intelligenz für den Informatikunterricht zugänglich macht.'
