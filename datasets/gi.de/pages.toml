full_description = "Um in einer zunehmend digital vernetzten Welt selbstbestimmt und mündig handeln und diese mitgestalten zu können, sind informatische Kompetenzen unerlässlich. Die Allianz für informatische Bildung setzt sich dafür ein, dass alle Schüler*innen in Deutschland ab Klassenstufe 5 Informatikunterricht erhalten – unabhängig von Wohnort, Alter, Geschlecht und Elternhaus. Datenkompetenzen sind der Schlüssel dazu, aktiv mit Daten zu arbeiten und sie für das Gemeinwohl einzusetzen. Um das auch Menschen aus der Zivilgesellschaft zu ermöglichen, hat sich nun ein Konsortium aus GI, CorrelAid und dem Deutschen Caritasverband unter der Förderung vom Bundesfamilienministerium (BMFSFJ) zusammengeschlossen. Das Civic Data Lab soll gerade Menschen, die sich gemeinnützig engagieren, dazu verhelfen, Daten für ihre Vorhaben einzusetzen. Interessierte können sich dabei nicht nur neue Kompetenzen aneignen, sondern auch Unterstützung bei gemeinwohlorientierten Datenprojekten erhalten und sich mit anderen Aktiven vernetzen. Alles zur „Datensprechstunde“, der neuen Community und ersten Lernmaterialien gibt es jetzt auf der Website. Mit dem Climate Data Entrepreneurial Club (CDEC) zielen die GI und ihre Projektpartner darauf ab, junge Menschen, insbesondere Mädchen, aktiv in die Entwicklung von Lösungen zur Bekämpfung des Klimawandels einzubeziehen, und sie zu ermutigen, gemeinnützige Initiativen zu gründen. Ermöglicht wird dies durch den Zugang zu Klimadaten aus europäischen und deutschen Satellitenmissionen mit Unterstützung von Expert*innen aus den Bereichen Informatik, Erdbeobachtung und Pädagogik. Auch in der Informatik-Forschung fallen viele Daten an, die für andere Wissenschaftler*innen hilfreich sein können – sofern sie gut zugänglich sind. Ziel des Projekts „National Research Data Infrastructure for and with Computer Science” (NFDIxCS) ist es, Dienste zur Speicherung komplexer domänenspezifischer Datenobjekte aus allen Teilgebieten der Informatik (Computer Science / CS) zu identifizieren, zu definieren und schließlich einzusetzen. Dabei sollen die FAIR-Prinzipien (Findable, Accessible, Interoperable & Re-usable) durchgängig berücksichtigt werden."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
