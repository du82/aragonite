full_description = "Das Präsidium beschließt Richtlinien für die GI-Arbeit sowie GI-Empfehlungen und andere Stellungnahmen, die die Informatik-Gemeinschaft in fachlicher, beruflicher und gesellschaftlicher Weise betreffen. Es entscheidet über die Ämter des Präsidenten bzw. der Präsidentin und der weiteren Vorstandsmitglieder sowie die Erstellung der Liste für die Präsidiumswahl. Das Präsidium bestätigt die Geschäftsordnungen des Vorstands, des erweiterten Vorstands, der Geschäftsführung und des Kuratoriums, es setzt die Mitgliedsbeiträge fest, beschließt den Haushaltsplan und entscheidet über die Verwendung von außerplanmäßigen, nicht zweckgebundenen Einnahmen. Darüber hinaus ernennt das Präsidium Ehrenmitglieder, beschließt über die Verleihung von Auszeichnungen und Preisen, bildet Fachgesellschaften, GI-Gliederungen und sonstigen unterstützenden Gremien und löst diese auf und berät den Vorstand. 1. Vorsitzende der Gesellschaft für Informatik in der Land-, Forst- und Ernährungswirtschaft (GIL) in der GI Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
