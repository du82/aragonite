["https://gi.de/meldung/modernisierung-des-computerstrafrechts-gi-fordert-dringende-umsetzung"]
title = "Modernisierung des Computerstrafrechts: GI fordert dringende Umsetzung - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Zahlreiche digitalpolitische Vorhaben sollen noch vor Ende der Legislaturperiode entschieden werden. Dabei darf die Modernisierung des Computerstrafrechts nicht fehlen, da sie essenziell für eine wirksame und zeitgemäße IT-Sicherheitsforschung in Deutschland ist. „Die Bundesregierung sollte die verbleibende Zeit nutzen, um Forschenden endlich Rechtssicherheit bei der Identifikation und Schließung von Sicherheitslücken zu geben“, erklärt Nikolas Becker, Leiter Politik & Wissenschaft bei der Gesellschaft für Informatik e.V. (GI). „Dabei wäre es wichtig, Vorbereitungshandlungen zur IT-Sicherheitsforschung klarer zu adressieren und den rechtssicheren Nachweis lauterer Absichten zu vereinfachen.” So geht der im November vom Bundesministerium der Justiz (BMJ) vorgelegte „Entwurf eines Gesetzes zur Änderung des Strafgesetzbuches – Modernisierung des Computerstrafrechts“ aus Sicht der GI eindeutig in die richtige Richtung. Die Einführung einer tatbestandsausschließenden Regelung, die es IT-Sicherheitsforschenden ermöglicht, Sicherheitslücken verantwortungsbewusst zu melden und zu schließen, ohne dabei rechtliche Konsequenzen befürchten zu müssen ist ein zentraler Baustein für die IT-Sicherheit und sollte daher unbedingt noch in dieser Legislaturperiode verabschiedet werden. Auch die Einführung eines höheren Strafrahmens (§ 202a Abs. 4 StGB-E) für schwere Cyberkriminalität wird von der GI befürwortet, da sie die zunehmende Bedrohung von Wirtschaft, Infrastruktur und zivilgesellschaftlichen Institutionen durch Cyberangriffe adressiert. Gleichzeitig sieht die GI Probleme bei der praktischen Anwendung der im Entwurf vorgeschlagenen Maßnahmen. Sie verlangen von Forschenden den Nachweis, dass ihr Handeln der Verbesserung der Cybersicherheit dient (§ 202a Abs. 3 StGB-E), ohne jedoch klarzustellen, wie dieser Nachweis zu erbringen ist. Schließlich sieht der Entwurf keine Anpassung des „Hackerparagraphen“ § 202c StGB vor, der aktuell nicht hinreichend auf Vorbereitungshandlungen zur IT-Sicherheitsforschung eingeht. Auch hier fehlt es an klaren Kriterien, um die „Befugtheit“ nachzuweisen. Forschende werden in der Praxis vor der Herausforderung stehen, ihre Absichten rechtssicher zu dokumentieren."
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
