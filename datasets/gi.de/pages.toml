["https://gi.de/meldung/cyberabwehr-in-deutschland"]
title = "Cyberabwehr in Deutschland - Gesellschaft für Informatik e.V."
description = "Die Stadt Bonn und Umgebung hat sich zum Zentrum der Cyberabwehr in Deutschland und auch inzwischen in Europa entwickelt. Eine Vielzahl von Unternehmen, Hochschulen und Forschungseinrichtungen arbeiten zusammen am Schutz privater und öffentlicher Netze sowie kritischer Infrastrukturen. Im Zentrum der öffentlichen Wahrnehmung steht dabei das BSI – Bundesamt für Sicherheit in der Informationstechnik als Bundesbehörde. Aber auch Bundeswehr und die Deutsche Telekom stehen im Fokus, weil ihre Netze ständig Angriffen ausgesetzt sind."
full_description = "Die Stadt Bonn und Umgebung hat sich zum Zentrum der Cyberabwehr in Deutschland und auch inzwischen in Europa entwickelt. Eine Vielzahl von Unternehmen, Hochschulen und Forschungseinrichtungen arbeiten zusammen am Schutz privater und öffentlicher Netze sowie kritischer Infrastrukturen. Im Zentrum der öffentlichen Wahrnehmung steht dabei das BSI – Bundesamt für Sicherheit in der Informationstechnik als Bundesbehörde. Aber auch Bundeswehr und die Deutsche Telekom stehen im Fokus, weil ihre Netze ständig Angriffen ausgesetzt sind. Inzwischen hängt auch eine 4-stellige Zahl von Arbeitsplätzen an der Cyberabwehr. Es war also an der Zeit, einen Themenabend der RG Köln/Bonn dazu anzubieten. Dazu rief die Regionalgruppe am 09.07.2019 in die Uni Bonn auf. Zu der Veranstaltung hatten sich innerhalb kürzester Zeit 100 Teilnehmerinnen und Teilnehmer angemeldet. Bei diesem Themenabend sollten die Teilnehmenden die Organisation der Cyberabwehr aus Sicht einzelner Player kennenlernen und erfahren, welche Bedrohungsszenarien es gibt, welche Maßnahmen angedacht sind, wie die Zusammenarbeit organisiert ist und welche Unterstützungen für Firmen und auch Privatpersonen durch das Cyberabwehr-Zentrum bestehen bzw. geplant sind. Dazu gab es drei Vorträge der o.g. Organisationen: Stefan Ritter übernahm die Aufgabe, die Struktur der Cyberabwehr in Deutschland zu skizzieren und das Zusammenspiel mit vielen anderen staatlichen und nichtstaatlichen Playern und Abwehrelementen darzulegen. Das BSI als die nationale Cyber-Sicherheitsbehörde gestaltet Informationssicherheit in der Digitalisierung durch Prävention, Detektion und Reaktion für Staat, Wirtschaft und Gesellschaft. Damit ist es die zentrale Stelle der Cyber-Abwehr in Deutschland. Dabei betont er insbesondere die Bedeutung der Kooperation der einzelnen Player. Das wichtigste Element der Zusammenarbeit, so Ritter, sei Liebe. Damit meinte er natürlich das Vertrauen, sich auf kurzen Dienstwegen über Sicherheitsvorfälle und deren Abwehr verständigen zu können. Dazu passt auch, dass sich die Referenten des Podiums bereits seit vielen Jahren persönlich kennen, ja sogar die Hörsaalbänke miteinander geteilt haben."
author = "Gesellschaft für Informatik (GI)"
year_published = 2019
clearnet = "https://gi.de/meldung/cyberabwehr-in-deutschland"
