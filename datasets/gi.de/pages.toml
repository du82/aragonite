full_description = "Die GI betreibt ihren Internetauftritt zur Unterstützung bei der Umsetzung ihrer gemeinnützigen Zwecke. Die Website dient dabei insbesondere zur Präsentation der Ziele, der Arbeit und der Aktivitäten der GI, aber auch der Kommunikation mit den Mitgliedern und Nichtmitgliedern aus dem Bereich der Informatik. Der Schutz Ihrer Privatsphäre ist für uns von höchster Bedeutung. Deshalb ist das Einhalten der gesetzlichen Bestimmungen zum Datenschutz für uns selbstverständlich. Ferner ist es uns wichtig, dass Sie jederzeit wissen, wann wir welche Daten speichern und wie wir sie verwenden. Ihr Besuch unserer Webseiten wird protokolliert. Erfasst werden im Wesentlichen die aktuell von Ihrem PC verwendete IP-Adresse, Datum und Uhrzeit, der Browsertyp und das Betriebssystem Ihres PC sowie die von Ihnen betrachteten Seiten. Ein Personenbezug ist uns im Regelfall nicht möglich und auch nicht beabsichtigt. Diese Daten werden nur für Zwecke der Datensicherheit und zur Optimierung unseres Webangebots erhoben. Eine sonstige Auswertung der Daten, außer für statistische Zwecke und dann grundsätzlich in anonymisierter Form, erfolgt nicht. Es werden auch keine personenbezogenen Surfprofile oder ähnliches erstellt oder verarbeitet. Cookies sind kleine Textdateien, die auf dem PC des Internet-Nutzers abgelegt werden. Die Website der GI verwendet Cookies zur Verwaltung der Anmeldung für den nur Mitgliedern zugänglichen Bereich. Diese werden nach dem Schließen des Browsers wieder gelöscht. Eine Auswertung findet nicht statt. Piwik verwendet “Cookies”, wie oben erläutert sind das Textdateien, die auf Ihrem Computer gespeichert werden und die uns eine Analyse Ihrer Benutzung der Website ermöglichen. Die durch den Cookie erzeugten Informationen über Ihre Benutzung dieser Website werden an unseren Server übertragen und dort zu Analysezwecken gespeichert. Die IP-Adresse wird sofort nach der Verarbeitung und vor deren Speicherung anonymisiert. Sie können die Verwendung der Cookies durch eine entsprechende Einstellung Ihrer Browser Software verhindern; wir weisen Sie jedoch darauf hin, dass Sie in diesem Fall gegebenenfalls nicht sämtliche Funktionen dieser Website voll umfänglich nutzen können.“"
