["https://gi.de/innovationspreis"]
title = "Innovationspreis - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Der Innovations- und Entrepreneurpreis der Gesellschaft für Informatik e.V. zeichnet informatikbezogene Erfindungen, Innovationen und einschlägige Unternehmensgründungen aus. Der Informatikbezug ist weit gefasstund bezieht Hardware, Software sowie Anwendungen und Plattformen gleichermaßen mit ein. Die Gesellschaft für Informatik e.V. verleiht den Innovations- und Entrepreneurpreis seit 2005. Hier finden Sie eine Übersicht aller bisherigen Preisträger: Vize-Präsident Andreas Oberweis hat in Chemnitz den Innovations- und Entrepreneurpreis der Gesellschaft für Informatik e.V. an das medizininformatische Projekt Nevita der Technischen Hochschule Brandenburg verliehen. Im Rahmen der INFORMATIK 2017 hat Prof. Dr. Andreas Oberweis, Vize-Präsident der Gesellschaft für Informatik e.V. (GI) gestern Abend im Rahmen eines feierlichen Empfangs das Projekt Nevita – ehemals mTriage+ – der Technischen Hochschule Brandenburg mit dem Innovations- und Entrepreneurpreis der GI ausgezeichnet. Das Projekt hat einen mobilen medizinischen Datenrekorder entwickelt, der die gesamte medizinische Versorgungskette abbildet und eine preiswerte Unterstützung bei der medizinischen Versorgung von Patienten bietet, vorrangig in Entwicklungs- und Schwellenländern. Andreas Oberweis: „Nevita steht für den innovativen Einsatz von Informatik in der medizinischen Versorgung. Marius Liefold, Alexander Pokraka, Dennis Wagner und Prof. Dr. Thomas Schrader haben einen mobilen Datenrekorder entwickelt, der auch als stationärer medizinischer Arbeitsplatz verwendet werden kann. Die Daten werden mittels eines selbstentwickelten Barcode-Systems durch einfach zu schulendes Personal – Krankenschwestern und so genannte „Medical Street Worker“ – intuitiv eingegeben. Die Jury hat insbesondere die Kombination vieler innovativer Komponenten bei Hard- und Software überzeugt, die optimal an den Nutzen angepasst sind. So wurden etwa bei der Hardware nur kostengünstige Module verbaut und die Datenverarbeitung verläuft standardisiert in der Cloud, sodass der Zugriff und die Analyse für interessierte medizinische Einrichtungen jederzeit leicht möglich sind. Der Einsatz des Systems wurde bereits erfolgreich erprobt.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
