["https://gi.de/meldung/forderungen-zur-bundestagswahl25"]
title = "To-do-Liste für die Digitalpoltik: GI-Forderungen zur Bundestagswahl - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "IT-Systeme sichern, Souveränität stärken und Verwaltung digitalisieren: Mit zehn zentralen Impulsen zeigt die Gesellschaft für Informatik e.V. Wege für eine gemeinwohlorientierte, sichere und nachhaltige Digitalpolitik auf. Berlin, 22. Januar 2025 – Am 23. Februar wählen die Bürger*innen Deutschlands den neuen Bundestag. Die zukünftige Regierung wird vor vielen großen Fragen stehen, auch in puncto Digitalpolitik. Es gilt, entscheidende Weichen für eine digitale Zukunft zu stellen, die auf Demokratie, Teilhabe und Nachhaltigkeit basiert. Mit zehn Positionen fordert die GI eine klare Ausrichtung der Digitalpolitik in der nächsten Legislaturperiode. Zu den zentralen Forderungen gehören: IT-Sicherheit: Schutz vor Cyberangriffen gewährleisten und das Recht auf starke Verschlüsselung verteidigen. Digitale Souveränität: Open Source fördern, Investitionen in Schlüsseltechnologien erhöhen und digitale Abhängigkeiten abbauen Bildung und Forschung: Informatik als Pflichtfach einführen, Forschungssoftware stärken und langfristige Innovationsfähigkeit sichern Faire KI und Nachhaltigkeit: Ethik im Umgang mit KI garantieren, Green Coding etablieren und ressourcenschonende Digitalisierung umsetzen Verwaltung: Digitale Zugänge für Bürger*innen ausbauen, Prozesse automatisieren und ein Digitalministerium schaffen Nikolas Becker, Leiter Poitik und Wissenschaft bei der GI: „Es ist Zeit, die digitale Zukunft Deutschlands endlich aktiv in die Hand zu nehmen: Nur mit klaren Prioritäten, Verantwortungsbewusstsein und Innovationskraft kann der digitale Wandel gelingen. Die Bundestagswahl 2025 muss den Startschuss für eine mutige und zukunftsgestaltende Digitalpolitik geben.“ Geschäftsstelle Berlin im Spreepalais am Dom Anna-Louisa-Karsch-Str.2 10178 Berlin Mail: presse@gi.de Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
