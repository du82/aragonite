description = "alphabetisch sortiert"
full_description = "Ein breites Portfolio. Derzeit gibt es in der GI 14 Fachbereiche mit rund 100 Fachgruppen. Den Fachgruppen können Sie im Mitgliederbereich beitreten. GMDS-AG/GI-AK Methoden und Werkzeuge für das Management von Krankenhausinformationssystemen (mwmKIS) (GMDS/GI-6) Erkennung und Beherrschung von Vorfällen der Informationssicherheit – Security Incident Detection and Reponse (SIDAR) Allgemeine Methodik und Unterstützung von Entwurfsprozessen für Schaltungen und Systeme (RSS-Method) Die Fachbereiche bündeln die inhaltliche Arbeit der Mitglieder der Gesellschaft für Informatik e.V. in Fachgruppen (FG), Arbeitskreisen (AK) und Fachausschüssen (FA). Fachgruppen bearbeiten sehr fokussiert spezielle Aspekte der Informatik. Sie dienen u.a. dem kontinuierlichen Austausch, der Diskussion, der Weiterentwicklung aktueller Fragestellungen und der Durchführung von Fachveranstaltungen. Fachausschüsse sind Unterorgane der einzelnen Fachbereiche. Sie bündeln die Interessen mehrerer Fachgruppen, strukturieren deren Inhalte, schaffen Synergien und setzen fachgruppenübergreifende Aktivitäten um. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
