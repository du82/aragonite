full_description = "Wer gestaltet die digitale Zukunft unseres Landes? Wer sind die Menschen in Deutschland, die mit ihren Innovationen und Leistungen die digitale Zukunft unseres Landes prägen werden? Wer sind die „digitalen Köpfe“ in Wirtschaft, Wissenschaft, Kultur und Gesellschaft? Im Rahmen des Wissenschaftsjahres 2014 hat die Gesellschaft für Informatik e. V. (GI) eine Jury eingeladen, Frauen und Männer auszuwählen, die für die neue Generation der digitalen Denker und Macher unseres Landes stehen. Die „digitalen Köpfe“ zeigen, wo die gegenwärtigen und zukünftigen Herausforderungen der digitalen Gesellschaft liegen – und dass digitale Exzellenz in Deutschland Zukunft hat. Die Jurymitglieder der Initiative sind in ihren Gebieten anerkannte Experten und Multiplikatoren. In ihrer Vielfalt sind sie repräsentativ für die zu kürenden Köpfe: Die Jury ehrt Frauen und Männer aus den verschiedensten gesellschaftlichen Bereichen. Die Expertenjury tagte am 21. Mai 2014 in Berlin. Dort traf sie eine Auswahl aus den Vorschlägen für die zu Nominierenden, welche die GI zuvor in den Verbänden und der Fachcommunity aus IT und Informatik gesammelt hatte. Im Herbst 2014 wurden „Deutschlands digitale Köpfe“ bekannt gegeben und ausgezeichnet. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
