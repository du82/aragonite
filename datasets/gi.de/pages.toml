["https://gi.de/themen/beitrag/digitale-gewalt-gegen-aktivistinnen"]
title = "Digitale Gewalt gegen Aktivist:innen: Bedrohungen, Schutzmaßnahmen und Handlungsempfehlungen - Gesellschaft für Informatik e.V."
description = "Von Ägypten bis Myanmar nutzen Aktivist:innen digitale Plattformen, um auf Missstände aufmerksam zu machen. Gleichzeitig nehmen Bedrohungen wie Hassrede, Überwachung und Zensur zu. Digitale Gewalt schränkt nicht nur die persönliche Sicherheit ein, sondern auch die gesellschaftliche Teilhabe. Schutzmaßnahmen, rechtliche Rahmenbedingungen und technische Lösungen sind entscheidend, um digitale Räume sicherer zu gestalten."
full_description = "Von Ägypten bis Myanmar nutzen Aktivist:innen digitale Plattformen, um auf Missstände aufmerksam zu machen. Gleichzeitig nehmen Bedrohungen wie Hassrede, Überwachung und Zensur zu. Digitale Gewalt schränkt nicht nur die persönliche Sicherheit ein, sondern auch die gesellschaftliche Teilhabe. Schutzmaßnahmen, rechtliche Rahmenbedingungen und technische Lösungen sind entscheidend, um digitale Räume sicherer zu gestalten. Digitale Gewalt gegen Aktivist:innen: Risiken und mögliche Handlungsmöglichkeiten. Seit den frühen 2010er Jahren, insbesondere während der Proteste in Ägypten und Tunesien, wurde die Rolle von Informations- und Kommunikationstechnologien (IKT) für aktivistische Tätigkeiten immer wichtiger. Dies zeigt sich beispielsweise an der Nutzung sozialer Medien durch Aktivist:innen in Myanmar, die nach dem Militärputsch 2021 internationale Aufmerksamkeit erlangen wollten. IKTs bieten zahlreiche Vorteile wie Kosteneinsparungen, Zugang zu alternativen Informationsquellen und die Demokratisierung politischer Beteiligung. Jedoch sind Aktivist:innen mit vielfältigen Herausforderungen und unterschiedlichen Formen von digitaler Gewalt konfrontiert, darunter Internetabschaltungen, Hassrede und Zensurmaßnahmen. Auch ist ein Anstieg digitaler Überwachung, Propaganda und der Manipulation von Informationen zu verzeichnen. Die zunehmende Verbreitung digitaler Gewalt stellt für Aktivist:innen und soziale Bewegungen ein signifikantes Problem dar, was dazu führt, dass sich immer mehr Aktivist:innen selbst zensieren und sich aus den Online-Räumen zurückziehen. Zunahme digitaler Gewalt gegen Aktivist:innen. Digitale Gewalt bezeichnet Handlungen, die im digitalen Raum stattfinden und durch Technik entweder unterstützt oder überhaupt erst ermöglicht werden. Als Beispiele für derartige Handlungen können Hassreden, die Verbreitung falscher Informationen, Zensur oder auch das Veröffentlichen privater Daten von Personen (Doxing) genannt werden. Auch relativ neue Phänomene wie Deepfakes, die durch KI ermöglicht werden, fallen in diese Kategorie. Es kristallisiert sich zunehmend heraus, dass die Grenzen zwischen digitaler Gewalt und physischer, direkter Gewalt zunehmend verschwimmen. Dies zeigt sich darin, dass digitale Gewalt häufig ein Vorläufer vor direkter, physischer Gewalt darstellt. Empirische Untersuchungen zeigen, dass solche Übergriffe nicht nur prominente Aktivist:innen betreffen, sondern auch Menschen, die vermeintlich „kontroverse“ Themen wie Umwelt- oder Frauenrechte ansprechen, insbesondere in Ländern, in denen solche Themen stark umstritten sind. Fallstudien aus Ländern wie Myanmar, Kamerun und Kolumbien zeigen, dass digitale Gewalt weit verbreitet ist und vor allem oft Indigene, schwarze und weibliche Aktivist:innen betrifft. Die Folgen digitaler Gewalt reichen von psychischen Belastungen bis hin zu einem Rückzug aus sozialen Netzwerken (chilling effect), was häufig das Ziel der Täter:innen ist. Ein weiterer Aspekt, der in diesem Zusammenhang zu berücksichtigen ist, ist die Tatsache, dass viele der betroffenen Aktivist:innen nicht über die Identität der Täter:innen informiert sind. Zudem fehlt es in vielen Ländern an einem rechtlichen Rahmen, der solche Taten verfolgt. Diese Entwicklungen verdeutlichen, dass digitale Gewalt nicht als ein isoliertes Phänomen betrachtet werden sollte, sondern als ein Teil eines größeren, komplexen Zusammenhangs."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
