full_description = 'Das Wachstum und die Diversifizierung der Internetnutzung auf der ganzen Welt verstärken auch die Diskussionen über ihre Governance in vielen Ländern, so auch in Brasilien und Deutschland. In beiden Ländern gibt es Rechtsnormen und verschiedene Vorschläge, um verschiedene Aspekte des Internets zu regulieren. Ein entscheidender Punkt der Diskussion ist der globale Charakter des Internets und wie es national oder regional, im Fall der Europäischen Union, reguliert werden kann. In diesem Szenario ist der grenzüberschreitende Datenfluss ein wichtiges Element, nicht nur für die Regierung des Internets, sondern auch für sein tatsächliche Funktionsweise. Die Hauptfragen dieser multidisziplinären Forschung drehen sich darum, wie Daten ins globale Netzwerk fließen, warum es wichtig ist, dieses architektonische und technische Design bei Regulierungsvorschlägen zu behalten, und welche Erfahrungen Brasilien, Deutschland und die Europäische Union mit dem grenzüberschreitendem Datenfluss haben. Zu den erwarteten Ergebnissen gehören informative Blogbeiträge, Interviews und Webtalks sowie die Veröffentlichung von Artikeln. Das Projekt "Follow the Flow: Impacts of Regulation for Cross-border Data in Brazil and Germany" ist Teil des „Bundeskanzler-Stipendium für Führungskräfte von morgen“ der Alexander von Humboldt-Stiftung und . Die Gesellschaft für Informatik e.V ist zwischen 2022 und 2023 als die Gastgeberpartnerin des Projekts. Das Programm zielt darauf ab, die Forschung zu fördern und die Möglichkeiten für zukünftige globale Führungskräfte in Schlüsselbereichen wie Politik, Wirtschaft, Medien, Verwaltung, Gesellschaft oder Kultur zu verbessern. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden.'
