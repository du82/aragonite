description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Gesellschaft für Informatik e.V. (GI) verpflichtet sich ihrem Satzungsziel, die faktische Gleichstellung von Frauen in der Fachgesellschaft und in der Informatik zu fördern und zu unterstützen. Der Anfang 2019 gegründete Vorstandsarbeitskreis „Chancen- & Geschlechtergerechtigkeit“ unter dem Vorsitz von Christine Regitz, ehemaliger Vize-Präsidentin der GI, wurde eingesetzt, um neue Gleichbehandlungsziele und -maßnahmen zu erarbeiten und bestehende zu evaluieren. Aus diesem Prozess gingen im ersten Halbjahr 2019 zwei Arbeitspapiere hervor – ein Positionspapier und eine Liste interner Leitlinien und Maßnahmen. Im Juni 2019 wurden die Erstversionen beider Texte dem Präsidium der GI vorgestellt. Daraufhin wurde beschlossen, dass allen Mitgliedern der GI die Möglichkeit gegeben wird, Rückmeldungen, Anregungen und Vorschläge dazu zu geben. Über einen offenen, transparenten Prozess wurde im Sommer 2019 ein vereinsweiter Feedbackprozess umgesetzt um die empfohlenen Maßnahmen zu überprüfen. Das Kommentieren war ausschließlich Mitgliedern der Gesellschaft für Informatik vorbehalten, da es sich um Papiere und Maßnahmen handelt, die direkt die Gesellschaft für Informatik, ihr Handeln nach innen und Auftreten nach außen betreffen. Der gesamte Feedbackprozess war öffentlich einsehbar. Nach einer intensiven Konsolidierungsphase wurde im Dezember 2019 dem Präsidium der Gesellschaft für Informatik eine weitere Möglichkeit zur Rückmeldung und Abwägung gegeben um gemeinsam eine finale Version der Papiere zu erarbeiten. Bis Ende des Jahres konnten Mitglieder des Präsidiums auf Confluence ihre Kommentare abgeben. Ende Januar 2020 wurden die Papiere in der ersten Präsidiumssitzung des Jahres einstimmig verabschiedet. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen