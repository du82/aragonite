["https://gi.de/meldung/hamburg-auszeichnung-mint-freundliche-schulen-und-digitale-schulen"]
title = "Hamburg: Auszeichnung „MINT-freundliche Schulen“ und „Digitale Schulen“ - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Sechs Schulen aus Hamburg wurden heute in einer Onlineveranstaltung von Abteilungsleiter Rainer Köger von der Bildunsgverwaltung und unserem Vorstandsmitglied Christian Fischer als „MINT-freundliche Schule“ ausgezeichnet. Darüber hinaus wurden vier Schulen, darunter der Campus29 Hamburg erstmalig, als „Digitale Schule“ geehrt. Die Ehrung der „MINT-freundlichen Schulen“ in Hamburg steht unter der Schirmherrschaft des Schulsenators Ties Rabe und der Kultusministerkonferenz (KMK), die Ehrung der „Digitalen Schulen“ steht unter der Schirmherrschaft der Beauftragten der Bundesregierung für Digitalisierung, Staatsministerin Dorothee Bär und wird von der Gesellschaft für Inforamtik unterstützt. Das Jahr 2020 hat uns allen nochmals verdeutlicht, was für eine wichtige Rolle Digitalität in unserem Bildungssystem spielt. In der Covid-19-Pandemie erleben wir, dass Schulen sich stärker für die Chancen der digitalen Bildung öffnen. Sie wollen sich entwickeln und die eigene digitale Transformation vorantreiben. Um Schulen zu motivieren, ihr digitales Profil weiter zu schärfen und informatische Inhalte verstärkt in den Unterricht zu bringen, hat die Initiative »MINT Zukunft schaffen« die Auszeichnung „Digitale Schule“ ins Leben gerufen. Mit dem Signet soll das Engagement der Schulleitungen und Lehrkräfte gewürdigt und bestärkt werden, die sich für eine zeitgemäße Bildung in der digitalen Welt stark machen. Weitere Inforamtionen unter https://mintzukunftschaffen.de/2020/09/30/hamburg-auszeichnung-mint-freundliche-schulen-und-digitale-schulen. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert."
