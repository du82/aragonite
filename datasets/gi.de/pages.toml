["https://gi.de/aktuelles/wettbewerbe/weitere-wettbewerbe"]
title = "Weitere Wettbewerbe - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Unsere GI-Gliederungen führen eigene Wettbewerbe durch. Hierbei werden in erster Linie Dissertationen und/oder Diplomarbeiten ausgezeichnet. Eigene Wettbewerbspreise verleihen z.B. die Regionalgruppen Berlin, Braunschweig, München und Saar-Pfalz. Aber auch Fachbereiche, Fachgruppen und Beiräte vergeben Preise. Die folgende Aufzählung der Wettbewerbe erhebt keinen Anspruch auf Vollständigkeit. Im Jahr 2022 wurde erstmalig ein von Helmut und Heide Balzert gestifteter Preis für einen herausragenden Beitrag zur Vermittlung von Inhalten der Informatik und zur Ausbildung/Didaktik der Informatik (IAD) vergeben. Die Einreichungsfrist ist jeweils der 31. Mai des laufenden Jahres. Ziel des von der Gesellschaft für Informatik e.V. (GI) in Kooperation mit der Österreichischen Computergesellschaft (OCG) und der Schweizer Informatik Gesellschaft (SI) verliehenen Preises ist es, die Aufmerksamkeit für die Bedeutung der „digitalen Didaktik“ bei der Vermittlung von komplexen Sachverhalten in der Informatik zu fördern und zu unterstützen. Insbesondere sollten dabei die heutigen und zukünftigen digitalen Möglichkeiten für die didaktische Vermittlung von Wissen, Fertigkeiten und Fähigkeiten bis hin zur umfassenden Handlungskompetenz genutzt werden. Der Preis soll die Entwicklung und Erprobung innovativer Konzepte für digitale Lehr- und Lernformen fördern. >> Zur Seite Helmut und Heide Balzert-Preis Der GI-Fachbereich DBIS vergibt seit 2001 im Rahmen der BTW-Konferenz ein bis zwei Dissertationspreise. Die preisgekrönten Arbeiten werden aus denjenigen Dissertationen zu Datenbanken und Infomationssystemen ausgewählt, für die die Promotionsprüfung in den beiden Vorjahren der Konferenz mit Auszeichnung absolviert wurde. Jährlich schreibt der Arbeitskreis Virtual und Augmented Reality-Learning (VR/AR) zusammen mit dem Stifterverband den AVRiL-Award für gelungene VR/AR-Lernszenarien aus. Der preis ist mit 1.000 EUR dotiert. Die Fachgruppe Visual Computing in Biologie und Medizin schreibt seit 2004 alle zwei Jahre einen Preiswettbewerb für Publikationen von Nachwuchswissenschaftler*innen aus. Die Auszeichnung ist nach dem Pionier der medizinischen Visualisierung Prof. em. Dr. Karl-Heinz Höhne benannt, der am Universitätsklinikum Hamburg-Eppendorf mit dem Voxel-Man-Projekt eine der ersten interaktiven Körpervisualisierungen entwickelte. Der Preis wird in Zusammenarbeit mit Brainlab AG, Gesellschaft für Informatik und der Deutschen Gesellschaft für Computer- und Roboterassistierte Chirurgie eV (CURAC) vergeben."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
