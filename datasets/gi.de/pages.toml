title = "Historie - Gesellschaft für Informatik e.V."
description = 'Der Sonderdruck "Geschichte der GI" wurde in sehr liebevoller Detailarbeit speziell für unsere Mitglieder entworfen.'
full_description = 'Seit 1969 vertritt die Gesellschaft für Informatik e. V. die Interessen der Informatik im deutschsprachigen Raum und darüber hinaus. Ob in der Bildung, der Wissenschaft oder der Wirtschaft setzt sich die GI für ein ausgewogenes, modernes und zeitgemäßes Bild der Informatik ein. Im Jahr 2019 feiert die GI ihr 50-jähriges Bestehen. Seit 1971 führt die GI mit der Jahrestagung die größte und wichtigste Informatikerveranstaltung im deutschsprachigen Raum durch, die mit der INFORMATIK 2020 in Karlsruhe ihren 50. Geburtstag feiert. (Beim Durchblättern der "alten" Programmhefte läßt sich die Dynamik der Entwicklung der Informatik in wunderbarer Weise nachvollziehen, denn die GI war mit ihren Jahrestagungen immer am Puls der Zeit. Gleichzeitig haben viele Themen von gestern auch noch heute ihre Aktualität. Wer hier also noch Lücken mit Programmheften schließen kann, ist herzlich dazu aufgerufen, uns die Dokumente zu senden. Wir würden sie dann digitalisieren. Kontakt per E-Mail.) Eine Liste aller Jahrestagungen seit Anbeginn, zum Großteil mit den Proceedings, finden Sie hier: dblp.uni-trier.de/db/conf/gi/. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern.'
author = "Gesellschaft für Informatik (GI)"
