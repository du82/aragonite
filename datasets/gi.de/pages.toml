["https://gi.de/meldung/drei-gi-arbeitskreise-ziehen-bilanz-zur-digitalpolitik-der-ampel"]
title = "Drei GI-Arbeitskreise ziehen Bilanz zur Digitalpolitik der Ampel - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Arbeitskreise „Digitale Souveränität”, „Open Source Software” und „IT-Sicherheit und Datenschutz” der Gesellschaft für Informatik e.V. haben eine Bilanz zur Digitalpolitik der scheidenden Bundesregierung gezogen. Ihr Fazit: Sie hat ihre selbst gesteckten Souveränitäts- und Open-Source-Ziele deutlich verfehlt. Im Koalitionsvertrag zwischen SPD, Bündnis 90/Die Grünen und FDP wurden sehr ambitionierte Ziele verkündet und dabei der Digitalen Souveränität und dem Einsatz von Open Source eine außerordentlich hohe Bedeutung beigemessen. In der Digitalstrategie 2022 der Bundesregierung wurde die „Stärkung der Digitalen Souveränität“ Deutschlands sogar zum Leitmotiv erhoben. Der Blick auf die Ergebnisse ist jedoch ernüchternd: So musste die Bundesregierung auf Nachfrage einräumen, dass der Open-Source-Anteil bei den Ausgaben des Bundes für Software-Entwicklung und Dienstleistungen seit Beginn der Legislaturperiode nur etwa 0,5 Prozent betragen hat. Prof. Dr. Harald Wehnes, Sprecher des GI-Präsidiumsarbeitskreises Digitale Souveränität: „Die Ampel-Koalition hat in unseren Augen ihre selbst gesteckten Souveränitäts- und Open Source-Ziele deutlich verfehlt. Statt Gegengewichte zu den bestehenden Abhängigkeiten zu schaffen, wurden Projekte initiiert, die die digitale Abhängigkeit verstärken und die Macht der Monopole zementieren. Auch das Potential für wirtschaftliche und geopolitische Erpressungen ist damit deutlich angestiegen.” In einem ausführlichen Papier haben die drei GI-Arbeitskreise „Digitale Souveränität”, „Open Source Software” und „IT- Sicherheit und Datenschutz” ihre Bilanz zusammengefasst: Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
