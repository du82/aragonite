full_description = "Green Coding birgt das Potenzial, die Umweltbelastung durch Software erheblich zu reduzieren und nachhaltige Praktiken in der Softwareentwicklung zu fördern. Effiziente Ansätze können den Energie- und Ressourcenverbrauch maßgeblich senken und so zu einem ökolokisch nachhaltigeren Internet beitragen. Wie das Vorgängerprojekt „Potential of Green Coding“ (2021–2023) gezeigt hat, bleibt Green Coding jedoch weitgehend ein Nischenthema. Trotz wachsender Sensibilität für Nachhaltigkeit fehlen weiterhin ausreichendes Wissen, etablierte Standards und klare Strategien, um Green Coding umfassend in der Praxis zu verankern. Das Projekt „Unlocking the Potential of Green Coding into Practice“ adressiert diese Herausforderungen in drei zentralen Schwerpunkten: Getragen wird das Projekt von der Gesellschaft für Informatik e.V. (GI) in Zusammenarbeit mit der Hochschule für Technik und Wirtschaft Berlin (HTW) und dem Umwelt-Campus Birkenfeld der Hochschule Trier. Es wird von der ISOC Foundation gefördert und läuft von Oktober 2024 bis September 2026. Dieses Video bietet einen kleinen Einblick in den Workshop vom 07. März 2023, bei dem sich Vertreter*innen aus Forschung, Unternehmen und Zivilgesellschaft in Berlin trafen, um Herausforderungen und Gelingensbedingungen für die Umsetzung von Nachhaltigkeitszielen bei Software zu diskutieren. Die Vorträge in voller Länge gibt es auf: www.youtube.com/playlist Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert."
