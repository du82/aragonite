["https://gi.de/mitgliedschaft/angebote/fachzeitschriften"]
title = "Fachzeitschriften - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Die GI stellt ihren Mitgliedern umfassende Fachinformationen bereit. Dazu bietet die GI ein breites Angebot von Fachzeitschriften renommierter Verlage, die die Informatik in ihrer Breite und Tiefe abdecken. Das weite Themenspektrum bietet für jedes Interessensgebiet die richtige Publikation – und das zu besonders günstigen Konditionen, die jedes Jahr mit den Verlagen neu ausgehandelt werden (für korporative Mitglieder gelten teilweise andere Konditionen, welche bei den einzelnen Fachzeitschriften gesondert aufgeführt sind). Mitgliedermagazin ".inf" (im Eigenverlag): Digital sowie als PDF hier, Printversion kann zum Preis von 20 EUR p.a. im Mitgliederbereich bestellt werden. Ab Januar 2023 wurde das Informatik Spektrum als Organ der GI abgelöst. Mitglieder erhalten in der digitalen Bibliothek weiterhin Zugriff auf die bisherigen digitalen Ausgaben des Informatik Spektrums (Volltexte verfügbar ab Jahrgang 1996). Die Zeitschrift wird vom Springer-Verlag weitergeführt und kann hier (unter weitere Zeitschriften) zu den günstigen Konditionen für Mitglieder bestellt werden. GI-Mitglieder können eine Vielzahl an Zeitschriften der Fachbereiche und Fachgruppen zum Vorzugspreis über die Geschäftsstelle der GI beziehen. Dies setzt die Mitgliedschaft in einer oder mehrerer Fachgruppen des jeweiligen Fachbereichs voraus. Die folgende Liste enthält die Preise für ein Jahresabonnement. Der Bezug erfolgt jeweils über die Fachgruppen-Mitgliedschaft. Die Abrechnung erfolgt über die GI. Einige der GI-Zeitschriften können auch ohne die gleichzeitige Mitgliedschaft in der jeweiligen Fachgruppe bezogen werden (siehe Fachgruppenantrag). Hier finden Sie eine Übersicht der Publikationen unserer Fachgruppen. Der Bezug setzt die Mitgliedschaft in der entsprechenden Fachgruppe voraus. Der Antrag auf Mitgliedschaft in den Fachgruppen und die jeweiligen Bezugsbedingungen der Zeitschriften stehen zum Download bereit. GITO Verlag für Industrielle Informationstechnik und Organisation mbH, Kaiserdamm 23, 14057 Berlinservice@gito-verlag.de'
