["https://gi.de/meldung/predictive-policing"]
title = "Predictive Policing - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Mit zunehmender Digitalisierung extendieren insbesondere die qualitativen und quantitativen Kriterien der polizeilichen Arbeit. Mathematische Algorithmen, wie Predictive Policing, halten immer mehr Einzug. Retrospektiv werden dabei eine effektivere und effizientere Ausdifferenzierung der Risikogebiete realisiert. Bei der prädiktiven Prognose werden mittels mathematischer Algorithmen Wahrscheinlichkeiten zur Ausweisung relevanter Risikogebiete bestimmt, die in Deutschland überwiegend raumbezogene, aber auch personenbezogene Verfahren implizieren. Im Rahmen einer Diskussion, z. T. am Beispiel des Phänomens Wohnungseinbruchdiebstähle, nähern wir uns inhaltlich dem Themenkomplex. Die Effizienz der fallspezifischen Datenanalyse implementiert die Registrierung immenser Datenmengen, die insbesondere durch die Qualität aber auch Quantität der relevanten Informationen eminent geprägt wird. Das digitale Zeitalter beeinflusst immer stärker auch den polizeilichen Arbeitsalltag. So tragen bereits heute, und zukünftig noch mehr, mathematisch gesteuerte Algorithmen zur Optimierung von Analyse- und Optionsprozessen im Einsatz- und Streifendienst, im kriminalistischen bzw. kriminaltechnischen Bereich bei. Insbesondere die Visualisierung von kartografisch in Form von zwei- und dreidimensionalen georeferenzierten Karten als auch von raumbezogenen Kausalitäten, die Realisierung von Analysen, die Optimierung von Einsatzplanungen sowie Präventivmaßnahmen und nicht zuletzt das statistische Berichtwesen sollten noch explorativer in den Fokus rücken und eine zentralere Rolle bei den Polizeien einnehmen. Die Verwendung von Prognosesystemen bei der Polizei weckt nicht zuletzt die Erwartungshaltung, durch intelligentere Verknüpfung und Nutzung von Daten, Informationen und Systemen effizienter agieren bzw. operieren zu können [1]. Predictive Policing bedeutet im wörtlichen Kontext übersetzt „vorausschauende Polizeiarbeit“ und wird im deutschsprachigen Raum eher mit „vorhersagebasierter Polizeiarbeit“ gebraucht [8]. Allgemein geht es um Algorithmen, die größere Dateninformationen bzw. -mengen polizeispezifisch strukturiert analysieren, um individuelle Erscheinungsformen von Kriminalität zu prognostizieren [12, S. 2] und auf der Basis diverser kriminologischer Theorien, z. B. Broken Windows, Routine Activity Approach, Rational Choice Theory, Near Repeat Victimisation, Kontinuitäten i. S. v. kontinuierlichen Mustern, auch Musteridentifikation genannt, lokalisieren zu können [17, S. 2]."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
clearnet = "https://gi.de/meldung/predictive-policing"
