description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Das wissenschaftliche Querschnittsprojekt Netzwerk Digital GreenTech (NetDGT) von Gesellschaft für Informatik e.V. und Öko-Institut begleitet seit Mai 2021 die FördermaßnahmeDigital GreenTech – Umwelttechnik trifft Digitalisierung im Rahmen des Aktionsplans Natürlich.Digital.Nachhaltig des Bundesministeriums für Bildung und Forschung (BMBF). NetDGT fördert die Vernetzung und den fachlichen Austausch zwischen den elf Forschungsvorhaben der Fördermaßnahme, macht ihre Arbeit durch Transferaktivitäten bekannt und unterstützt die Analyse und Synthese ihrer Ergebnisse. Innerhalb der vier inhaltlichen Schwerpunkte (1) Daten intelligent nutzen, (2) Systeme vernetzen, (3) autonome Systeme schaffen und (4) digitale Interaktionen sollen innovative Ansätze und Verfahren entwickelt werden, die zur Schonung der natürlichen Ressourcen oder zur Verringerung von Umweltbelastungen in Deutschland und weltweit beitragen. Damit sollen die Forschungsvorhaben das Erreichen der UN-Nachhaltigkeitsziele für sauberes Wasser und Sanitäreinrichtungen (SDG6), Menschenwürdige Arbeit und Wirtschaftswachstum (SDG8), Industrie, Innovation und Infrastruktur (SDG9), Nachhaltige Städte und Gemeinden (SDG11) sowie Nachhaltige/r Konsum und Produktion (SDG12) unterstützen. Informationen über die elf Projekte der Förderline Digital GreenTech und die umwelttechnischen Lösungen, an denen sie forschen, finden Sie auf digitalgreentech.de. Wenn Sie über Aktivitäten und Neuigkeiten des Netzwerks informiert werden möchten, melden Sie sich für unseren Newsletter an. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert."
