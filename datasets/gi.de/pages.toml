["https://gi.de/aktuelles/wettbewerbe/bwinf"]
title = "BWINF - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Bundesweite Informatikwettbewerbe sollen bei jungen Menschen das Interesse für Informatik wecken, Begabungen aufspüren und fördern. Sie richten sich an Kinder, Jugendliche und junge Erwachsene und bieten ihnen einen jeweils altersgerechten Einstieg in das Fach. Der Bundesweite Informatikwettbewerbe (BwInf) wurde 1980 von der Gesellschaft für Informatik e.V. ins Leben gerufen, damals noch mit von den Teilnehmern selbst gewählten Aufgaben. In seiner heutigen, leistungsorientierten Form mit festen Aufgaben des Aufgabenausschusses besteht der Bundesweite Informatikwettbewerbe seit dem 18. Juli 1983. Damit steht der BwInf in der ersten Reihe der modernen Informatik in Deutschland. So stand der BwInf auch in der ersten Reihe, als 1989 die erste Internationale Informatikolympiade stattfand und war eins von gerade mal 13 Ländern, das seit Tag 1 der IOI dabei war. Die Erfahrung half den Verantwortlichen des BwInf auch, das internationale Bebras-Projekt mit auf den Weg zu bringen, dessen deutscher Zweig der Informatik-Biber ist. Seit 2016 gibt es neben dem anspruchsvollen BwInf und dem Informatik-Biber für Einsteiger auch den Jugendwettbewerb Informatik (JwInf). Mittlerweile sind Programmierumgebungen wie Blockly (beim JwInf) und Apps für Android und iOS (beim Informatik-Biber) Teil des Instrumentariums der Bundesweiten Informatikwettbewerbe, doch der BwInf ist immer noch aktiv, und setzt jedes Jahr neue Akzente und Teilnehmerrekorde. Die Bundesweite Informatikwettbewerbe werden getragen von der Gesellschaft für Informatik e.V., der Fraunhofer-Gesellschaft und dem Max Planck-Institut Informatik und vom Bundesministerium für Bildung und Forschung (BMBF) gefördert. Der Informatik-Biber ist das Einstiegsformat der Bundesweiten Informatikwettbewerbe (BwInf). Mehr Kinder und Jugendliche denn je starteten beim jüngsten Informatik-Biber und stellten sich Aufgaben unterschiedlichen Schwierigkeitsgrades von Fragen rund um IP-Adressen bei einem Multiplayerspiel bis hin zu Aufgaben über die Eigenschaften von Bonbonnieren oder die Bedeutung von Flaggen am Strand."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
