["https://gi.de/meldung/green-coding-im-mittelpunkt-erfolgreicher-projektauftakt-auf-dem-informatik-festival-2024"]
title = "Green Coding im Mittelpunkt: Erfolgreicher Projektauftakt auf dem Informatik Festival 2024 - Gesellschaft für Informatik e.V."
description = "Im Rahmen der Jahrestagung der Gesellschaft für Informatik e.V. (GI) fand der Workshop „Umweltinformatik zwischen Nachhaltigkeit und Wandel“ bereits zum 12. Mal statt und widmete sich in diesem Jahr dem Special Issue „Green Coding“. Das frisch gestartete Forschungsprojekt „Unlocking the Potential of Green Coding into Practice“ war Mitveranstalter und brachte wertvolle Beiträge zu den Themen Green Coding-Methodiken, Plattformen und Werkzeuge ein."
full_description = "Im Rahmen der Jahrestagung der Gesellschaft für Informatik e.V. (GI) fand der Workshop „Umweltinformatik zwischen Nachhaltigkeit und Wandel“ bereits zum 12. Mal statt und widmete sich in diesem Jahr dem Special Issue „Green Coding“. Das frisch gestartete Forschungsprojekt „Unlocking the Potential of Green Coding into Practice“ war Mitveranstalter und brachte wertvolle Beiträge zu den Themen Green Coding-Methodiken, Plattformen und Werkzeuge ein. Den Auftakt bildete eine Keynote von Anna Zagorski vom Umweltbundesamt mit dem Titel „Nachhaltige Software – Die unumgängliche Revolution in der Softwarewelt für eine nachhaltige digitale Zukunft“. Ihr Vortrag inspirierte intensive Diskussionen, wobei die Teilnehmenden sich einig waren, dass insbesondere Kennzahlen und Vergleichswerte, Best Practices sowie Qualitätsbewertungen zentrale Forschungs- und Praxisfragen darstellen. Auch die Integration von Green Coding-Ansätzen in Industrie, Praxis und Hochschulen wurde als entscheidender Aspekt für die Zukunft nachhaltiger Softwareentwicklung hervorgehoben. Das Forschungsprojekt „Unlocking the Potential of Green Coding into Practice“ bedankt sich bei allen Mitwirkenden für den wichtigen Austausch. Die gewonnenen Impulse fließen direkt in die Arbeit des Projekts ein, um Green Coding in Forschung und Praxis weiter voranzubringen. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehö