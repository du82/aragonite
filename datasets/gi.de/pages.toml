["https://gi.de/meldung/devcamp-berlin-we-play-tech"]
title = "Devcamp Berlin: We play Tech! - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Unter der Beteiligung von mehr als 70 Studierenden fand am 28. September unser DevCamp im Smart Data Forum des Fraunhofer Heinrich Hertz Instituts in Berlin statt. Die Veranstaltung war Teil des Informatikfestivals im Rahmen der GI-Jahrestagung INFORMATIK 2018. Unter der Beteiligung von mehr als 70 Studierenden fand am 28. September unser DevCamp im Smart Data Forum des Fraunhofer Instituts in Berlin statt. Die Veranstaltung war Teil des Informatikfestivals im Rahmen der GI-Jahrestagung INFORMATIK 2018. Zunächst bot Antje Nestler vom Fraunhofer Heinrich Hertz Institut als Gastgeberin in einer Keynote einen umfassenden Einblick in die Arbeit des Smart Data Projektes des Bundesministeriums für Wirtschaft und Energie bei dem die GI auch Teil der Begleitforschung ist. Darauf wurden den Studierenden in vier parallelen Deep-Dive-Workshops Einblicke in aktuelle Forschungs- und Entwicklungsprojekte unterschiedlicher Unternehmen und Forschungseinrichtungen gegeben. Ludwig Sickert von IBM stellte den IBM Watson Assistant Service vor wärend Studierende der Hochschule für Wirtschaft und Recht Berlin (HWR) Einblicke in ein Projekt zur Virtualisierung der Softwareentwicklung gaben. Andreas Fießler und Christian Ludwig von genua erläuterten darüber hinaus neue Firewalltechnologien für Sicherheit und Performance und Antje Nestler vom Fraunhofer Heinrich Hertz Institut stellte bei einem Rundgang durch das Smart Data Forum zahlreiche Demonstratoren aus dem Smart Data Projekt vor. Am Nachmittag folgte dann das Barcamp mit insgesamt 11 Sessions zu unterschiedlichsten Themen, geleitet von den teilnehmenden Unternehmen und von den Studierenden selbst. Die Bandbreite der Themen reichte dabei von Bierbrauen mit IoT (adesso), Automotive Software Engeneering und Carhacking (IAV), sichere digitale Ausweisdokumente auf Smartphones (Bundesdruckerei), Stramingoptimierung im Kontext von Computerspielen (AVM) oder Computer Interaction und Monitoring in der Softwareentwicklung (deliotte). Darüber hinaus stellte ein Team von LIDL Digital aktuelle Projekte zur Weiterentwicklung des LIDL E-Commerce vor."
author = "Gesellschaft für Informatik (GI)"
