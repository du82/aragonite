full_description = "Informatikerinnen und Informatiker unterliegen nicht selten Haftungsrisiken, die man sich absichern sollte. Jedes Mitglied der GI, gleich ob hauptberuflich selbständig oder nebenberuflich tätig, kann von den besonderen Angeboten für eine Betriebs, Produkt- und Vermögensschadenhaftpflicht sowie dem Schutz vor Berufsunfähigkeit Gebrauch machen. Neu im Programm ist eine Versicherung gegen Cyberangriffe (z.B. Ransomware). Wir haben maßgeschneiderte Angebote für unsere Berufsgruppe. Die GI 24-Familie: Pro-IT Haftplicht, Pro-IT Cyber, Pro-IT D&O und Pro-IT BU. Direkt zu den Angeboten gelangen Sie hier: www.gi-24.de Die GI ist Akademischer Partner des Linux Professional Institute (LPI). Das LPI ist das weltweit größte Zertifizierungsprogramm im Bereich Linux und Open Source mit weltweit über 425.000 abgelegten Prüfungen. Im Rahmen des LPI Partnerprogramms kann die GI ihren Mitgliedern vergünstigte LPI Prüfungen anbieten. Bestellungen an marketing@gi.de GI-Mitglieder können die LPI Prüfungen LPI 101 und LPI 102 auch über die Testcenter von Pearson VUE zum Sonderpreis (20 Prozent Rabatt) ablegen. Mail an marketing@gi.de. F.A.Z. PRO Digitalwirtschaft vereint relevante Beiträge rund um Digitalisierung, digitale Ökonomie und Technologie in einem Informationsangebot. Immer auf dem neuesten Stand zu den aktuellen Entwicklungen in der digitalen Wirtschaft. 25 % Ermäßigung (Abzug vom Vollzahler-Beitrag – gilt nicht für bereits ermäßigte Mitgliedschaften) Eine aktuelle Liste der Gesellschaften, bei denen die GI die Mitgliedschaft ermäßigt, finden Sie hier zum Herunterladen (pdf). Mitglieder der GI erhalten regelmäßig Informationen über Tagungen der GI und anderer wissenschaftlicher Gesellschaften und können an diesen Veranstaltungen zu Vorzugsgebühren teilnehmen. Mitglieder erhalten Sonderkonditionen bei Zeitschriften und Publikationen der Fachbereiche und Fachgruppen sowie auch für die Reihe weiterer Zeitschriften. Die Details dazu finden Sie hier. Die GI in Ihrer Nähe. Jedes Mitglied kann in der Regel kostenlos an den Veranstaltungen der Regionalgruppen teilnehmen. Sie können sich beliebig vielen Regionalgruppen zuordnen, am Arbeitsplatz und am Wohnort. Die Übersicht finden Sie hier."
