title = "Beitragsinformationen - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Mitgliedschaft Die Mitgliedschaft in der Gesellschaft für Informatik e. V. (GI) https://gi.de/mitgliedschaft wird durch die Satzung geregelt, die Sie mit Ihrem Aufnahmeantrag anerkennen. Dauer der Mitgliedschaft Die Mitgliedschaft gilt mindestens für das Jahr des Eintritts und das darauffolgende Kalenderjahr und verlängert sich bei Nichtkündigung um jeweils ein weiteres Kalenderjahr. Mitgliedsbeitrag Die Höhe des Mitgliedsbeitrags richtet sich nach Art der Mitgliedschaft und Status des Mitglieds - er gilt jeweils für ein Kalenderjahr und wird im Beitrittsjahr ab Beginn des Beitrittsquartals berechnet. Ermäßigte / beitragsfreie Eingruppierung Eine ermäßigte / beitragsfreie Eingruppierung kann beantragt werden. Nähere Informationen finden Sie unten auf dieser Seite im grauen Kasten unter "Nachweise". VergünstigungenFachgruppenmitgliedschaften / Fachzeitschriften können zur Basis-Mitgliedschaft hinzugebucht werden. Weitere Vergünstigungen: https://gi.de/mitgliedschaft/angebote/verguenstigungen Onboarding für Neumitglieder Einmal im Quartal gibt es ein Zoom-Tutorial für Neumitglieder. Details dazu finden Sie im Mitgliederbereich "Meine GI" https://meine.gi.de/ Mitglieder werben Mitglieder Wer ein ordentliches zahlendes Mitglied wirbt, bekommt eine Gutschrift von 7,50 EUR auf das Beitragskonto (gilt max. bis zur Höhe des eigenen Mitgliedsbeitrags). Für die Werbung eines korporativen Mitglieds gibt es 10 % vom Mitgliedsbeitrag des geworbenen Mitglieds als Werbegutschrift. Beitragsmitteilung Beitragsmitteilungen stellen wir im PDF-Format im Mitgliederbereich "Meine GI" https://meine.gi.de/ zur Verfügung und werden per E-Mail angekündigt. Beitragszahlung Mitgliedsbeiträge sind innerhalb von vier Wochen ab Ausstellungsdatum der Beitragsmitteilung zur Zahlung fällig. Bei erteiltem SEPA-Lastschriftmandat buchen wir den Mitgliedsbeitrag ab. Den Abbuchungstermin teilen wir eine Woche vor dem Lastschrifteinzug per E-Mail mit. Spendenbescheinigung Persönliche / Korporative Mitglieder können eine Spendenbescheinigung in Höhe des gezahlten Basis-Mitgliedsbeitrags anfordern über https://meine.gi.de/ oder per E-Mail: mitgliederservice@gi.de'
