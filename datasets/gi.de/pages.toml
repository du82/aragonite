["https://gi.de/meldung/mit-der-gi-zum-ada-lovelace-festival-connecting-women-in-computing-technology"]
title = "Mit der GI zum Ada Lovelace-Festival: Connecting Women in Computing & Technology - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Am 19. und 20. Oktober findet in Berlin bereits zum dritten Mal das Ada-Lovelace-Festival statt. Das Festival schafft eine einzigartige Plattform für Professionals und Young Professionals aus der Informatik- und Technologiebranche und thematisiert insbesondere die neuesten Branchentrends, Forschungsergebnisse und Erfolgsgeschichten von Frauen in der IT. Frauen haben Computer von Anfang an auf ihrem digitalen Siegeszug begleitet – u.a. die Namenspatronin Ada Byron Countess of Lovelace (1815 – 1852), die auch von der GI als eine der zwölf bedeutendsten Informatikpersönlichkeit geehrt wurde. Ada war Mathematikerin und wird aus heutiger Sicht als Software-Pionierin angesehen. Sie entwickelte Mitte des 19. Jahrhunderts ein Programm für eine leider nie fertiggestellte „Analytical Engine“, eine Rechenmaschine von Charles Babbage, die als Vorläufer der modernen Computer gilt. Weitere Informationen finden Sie hier. Die Gesellschaft für Informatik unterstützt die Veranstaltung u.a. durch die Vizepräsidentin Christine Regitz, die im Advisory Board der Veranstaltung vertreten ist. GI-Mitglieder erhalten einen Rabatt von 20 Prozent auf den Ticketpreis. Interessierte können hier per Mail den Ticketcode anfordern. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
