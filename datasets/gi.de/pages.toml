full_description = "Im Rahmen des auf der Informatik 2017 stattfindenden Workshops „Der Arbeitsplatz der Zukunft“ hat die Fachgruppe einen gleichnamigen Wettbewerb ausgeschrieben, der mit 500€ dotiert ist. Die Arbeitsumgebung der Zukunft ist ein hochaktuelles Querschnittsthema verschiedener Fachdisziplinen, konkrete Ausprägungen von Arbeit sind rasanten Veränderungsprozessen unterworfen und mit ihnen auch die Tätigkeiten und Anforderungen moderner Arbeitskräfte. Doch wie sehen die resultierenden Arbeitsplätze aus? Neben einer Vielzahl unterschiedlicher Aspekte zum Arbeitsplatz der Zukunft sind sinnvolle Gesamtkonzepte derzeit Mangelware. Gesucht werden im Rahmen dieses Wettbewerbs daher konkrete Ideen für zukünftige Arbeitsplätze als sinnvolle Gesamtkonzepte. Der Wettbewerb richtet sich an Personen oder Gruppen aus universitärer und industrieller Forschung und Entwicklung die innovative und visionäre, zugleich aber in absehbarer Zeit realisierbare Ideen zum Arbeitsplatz der Zukunft haben und diese präsentieren und zur Diskussion stellen möchten. Die Einreichungen werden durch eine Fachjury bewertet und die Preisträger eingeladen, die Gewinnerkonzepte im Rahmen des Workshops auf der Informatik 2017 vorzustellen. Sowohl die Einreichungen zum Wettbewerb als auch zum Workshop selbst sind noch bis zum 14.05.2017 möglich. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es h