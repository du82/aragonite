full_description = "Der Beirat Junge Wissenschaft der Gesellschaft für Informatik (GI) e.V. hat in Zusammenarbeit mit dem GI-Vorstand ein umfangreiches Positionspapier veröffentlicht, das sich mit den Herausforderungen und Verbesserungspotenzialen für Nachwuchswissenschaftler*innen in der Informatik auseinandersetzt. Obwohl die Informatik im Vergleich zu anderen Disziplinen attraktive Karrieremöglichkeiten bietet, stehen viele junge Wissenschaftler*innen vor erheblichen Schwierigkeiten. Befristete Verträge, unsichere Karriereperspektiven und eine unzureichende Grundfinanzierung erschweren den Verbleib in der Wissenschaft und führen dazu, dass viele Talente frühzeitig in die Industrie oder ins Ausland abwandern. Auch die Vereinbarkeit von wissenschaftlicher Karriere und Privatleben stellt oft eine Herausforderung dar, da lange Arbeitszeiten und hohe Unsicherheiten eine verlässliche Lebensplanung erschweren. Um diesen Problemen zu begegnen, hat der Beirat Junge Wissenschaft der GI 15 zentrale Maßnahmen formuliert, die gezielt zur Verbesserung der Lage beitragen sollen. Dazu gehören die Schaffung von unbefristeten Stellen für Daueraufgaben, eine bessere Anerkennung und Bezahlung wissenschaftlicher Tätigkeiten, die Förderung transparenter Karrierewege sowie eine verbindliche Definition der Rolle von Promotionsbetreuenden. Ein weiterer wichtiger Punkt ist die notwendige Novellierung des Wissenschaftszeitvertragsgesetzes (WissZeitVG), um sachgrundlose Befristungen zu begrenzen und langfristige Perspektiven in der Wissenschaft zu ermöglichen. Das Positionspapier richtet sich an Entscheidungsträger*innen in Wissenschaft und Politik und soll Impulse für notwendige Reformen setzen. Die GI ruft dazu auf, die Arbeitsbedingungen für Nachwuchswissenschaftler*innen nachhaltig zu verbessern, um die Innovationskraft der deutschen Informatik zu stärken und langfristig wettbewerbsfähig zu bleiben. Das gesamte Positionspapier ist hier zum Download verfügbar: https://gi.de/service/publikationen/arbeits-und-positionspapiere"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
