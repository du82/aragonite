["https://gi.de/meldung/nationale-forschungsdateninfrastruktur-nfdi"]
title = "Nationale Forschungsdateninfrastruktur (NFDI) - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "In der Nationalen Forschungsdateninfrastruktur (NFDI) werden wertvolle Forschungsdaten für das gesamte deutsche Wissenschaftssystem systematisch erschlossen, vernetzt und nachhaltig nutzbar gemacht. Bislang sind diese meist dezentral, projektbezogen oder nur zeitlich begrenzt verfügbar. Mit der NFDI soll ein digitaler Wissensspeicher unter Berücksichtigung der FAIR-Prinzipien (Findable, Accessible, Interoperable, Reusable) geschaffen werden. Bereits vorhandene Daten können zur Bearbeitung weiterer Forschungsfragen genutzt werden und neue Erkenntnisse und Innovationen ermöglichen.Bis zu 30 NFDI-Konsortien, Zusammenschlüsse verschiedener Einrichtungen innerhalb eines Forschungsfeldes, arbeiten zusammen interdisziplinär an der Zielumsetzung. Um die Aktivitäten zum Aufbau einer Nationalen Forschungsdateninfrastruktur zu koordinieren, wurde der gemeinnützige Verein Nationale Forschungsdateninfrastruktur (NFDI) e.V. mit Sitz in Karlsruhe im Oktober 2020 gegründet. Gemeinsam gestalten Verein und NFDI-Konsortien die Zukunft des Forschungsdatenmanagements in Deutschland. Darüber hinaus soll NFDI auch am Aufbau internationaler Initiativen, beispielsweise der European Open Science Cloud (EOSC), mitwirken. Täglich wächst die Menge an wertvollen Forschungsdaten. Doch große Teile davon sind aktuell nur für eingeschränkte Personenkreise sowie zeitlich begrenzt verfügbar. Forschungsdaten werden häufig auf einzelnen Servern oder Rechnern in wenig standardisierten Formaten gespeichert. Eine sinnvolle Archivierung mit Möglichkeit zur Nachnutzung ist in die wenigsten Forschungsprozesse standardmäßig integriert, sodass Zugänge zu Wissen verlorengehen. Um dies zu ändern, ist die Nationale Forschungsdateninfrastruktur (NFDI) von Bund und Ländern ins Leben gerufen worden. Ziel von NFDI ist es, ein systematisches sowie nachhaltiges Forschungsdatenmanagement aufzubauen, zu koordinieren und dabei bereits bestehende Strukturen besser zu vernetzen. Relevante Daten sollen nicht länger ungenutzt auf den Servern einzelner Einrichtungen ohne zentralen Zugang schlummern, sondern nach den FAIR-Prinzipien [1] (Findable, Accessible, Interoperable und Reusable – also auffindbar, zugänglich, interoperabel und wiederverwendbar) zur Verfügung gestellt werden."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
