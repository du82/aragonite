["https://gi.de/meldung/gi-stellungnahme-zur-cloud-speicherung-von-gesundheitsdaten-basisschutz-darf-nur-ein-erster-schritt-zu-strengen-standards-sein"]
title = "GI-Stellungnahme zur Cloud-Speicherung von Gesundheitsdaten: Basisschutz darf nur ein erster Schritt zu strengen Standards sein - Gesellschaft für Informatik e.V."
description = "Die Gesellschaft für Informatik e.V. (GI) hat ihre Empfehlungen hinsichtlich der C5-Äquivalenzverordnung beim Bundesministerium für Gesundheit (BMG) eingereicht. Sie sollen dazu beitragen, den Schutz von Gesundheitsdaten in Cloudspeichern weiterhin hochzuhalten. Die GI verweist darauf, dass Gesundheits- und Sozialdaten besonders sensibel sind und Standards zum Schutz dieser Daten besonders hohen Anforderungen genügen müssen."
full_description = "Die Gesellschaft für Informatik e.V. (GI) hat ihre Empfehlungen hinsichtlich der C5-Äquivalenzverordnung beim Bundesministerium für Gesundheit (BMG) eingereicht. Sie sollen dazu beitragen, den Schutz von Gesundheitsdaten in Cloudspeichern weiterhin hochzuhalten. Die GI verweist darauf, dass Gesundheits- und Sozialdaten besonders sensibel sind und Standards zum Schutz dieser Daten besonders hohen Anforderungen genügen müssen. Bisher gilt für den Austausch von Gesundheits- und Sozialdaten der „Kriterienkatalog C5 (Cloud Computing Compliance Criteria Catalogue)“, welcher durch das Bundesamt für Sicherheit in der Informationstechnik (BSI) entwickelt wurde. Das BMG will mit seinem Entwurf klarstellen, „welche Standards in Kombination mit ergänzenden Maßnahmen die Einhaltung eines vergleichbaren Sicherheitsniveaus zum Kriterienkatalog C5 des BSI sicherstellen.“ Die GI unterstützt in ihrer Stellungnahme die Bemühungen, einheitliche Standards für das Teilen von Gesundheits- und Sozialdaten über cloudbasierte Informationssysteme aufzustellen. Sie verweist jedoch darauf, dass Gesundheits- und Sozialdaten besonders sensibel sind und Standards zum Schutz dieser Daten besonders hohen Anforderungen genügen müssen. Dazu Prof. Dr. Frank Pallas, Sprecher der Fachgruppe Datenschutzfördernde Technik (PET): „Mit der C5-Äquivalenzverordnung werden Standards wie die ISO 27001 als Sicherheitsnachweis akzeptiert. Diese Standards sind nicht für hoch sensible Gesundheits- und Sozialdaten ausgerichtet. Das Ziel muss bleiben, spezifische und strengere Standards zu etablieren.“ Dr. Aleksandra Sowa, ebenfalls Mitglied der Fachgruppe, ergänzt: „Der Weg, die ISO 27001 bzw. den IT-Grundschutz des BSI vorübergehend als Standard zu akzeptieren, wurde bereits erfolgreich im Finanzsektor beschritten. Es ist ein gangbarer Ansatz, der jedoch eine Übergangslösung bleiben muss. Daher braucht es klare Fristen.“ Mehr über die Bedeutung von Daten im Gesundheitswesen lesen Sie im Interview mit Digital-Health-Experte Hannes Schlieter und Oberärztin Jessica Barlinn."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
