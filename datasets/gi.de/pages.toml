["https://gi.de/netzwerk/partner/konrad-zuse-gesellschaft"]
title = "Konrad-Zuse-Gesellschaft - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'Die Konrad-Zuse-Gesellschaft pflegt das Andenken an Konrad Zuse, will jungen Menschen die Persönlichkeit Zuses nahe bringen und für einen Berufsweg in der Informatik gewinnen. Dazu stellt sie sich u.a. folgende Aufgaben: Um ihre Ziele erreichen und diese Aufgaben erfüllen zu können, sucht die Konrad-Zuse-Gesellschaft Mitglieder und Sponsoren. Juristische Personen, welche die Arbeit der Gesellschaft, insbesondere einzelne ihrer Projekte, finanziell unterstützen möchten, können dies von Fall zu Fall und ohne dauernde Verpflichtung als Sponsoren tun. Die Gesellschaft kann für eine solche Unterstützung auf Wunsch Spendenbescheinigungen zur Vorlage beim Finanzamt ausstellen. Die Gesellschaft wurde 1988 von Konrad Zuse, Eberhard Fennel, Hermann Fleßner, Kurt Pauli, der Gesellschaft für Informatik e.V. (GI), dem VDE, Technisch Wissenschaftlicher Verband der Elektrotechnik Elektronik Informationstechnik, dem Zentralverband des Deutschen Baugewerbes (ZDB), der Hünfelder Kultur- und Museumsgesellschaft, dem Kreisausschuss des Landkreises Fulda und dem Magistrat der Stadt Hünfeld gegründet. Die Gesellschaft ist gemeinnützig. Eine Möglichkeit, die Arbeit der Gesellschaft zu unterstützen, besteht in der Mitgliedschaft. Verbände, Körperschaften, Fachgesellschaften, Institute und Unternehmen können fördernde Mitglieder, natürliche Personen persönliche Mitglieder werden. Von persönlichen Mitgliedern wird ein Jahresbeitrag von mindestens 60 Euro, von fördernden Mitgliedern einer von mindestens 150 Euro erwartet. Über die Aufnahme entscheidet der Vorstand. Eine andere Möglichkeit besteht darin, zu spenden (Spenden-Konto siehe rechte Spalte unten) . Wir sind gemeinnützig und dürfen Ihnen Spendenquittungen ausstellen, die Sie steuerlich geltend machen können. Die Konrad-Zuse-Gesellschaft lobt seit 2014 einen Sonderpreis für eine originelle Arbeit auf dem Gebiet der Informatik beim Wettbewerb "Jugend forscht" aus. Die Konrad-­Zuse-­Gesellschafte. V. pflegt das Andenken an den Erfinder und Konstrukteur des ersten funktionstüchtigen Computers, Konrad Zuse. Sie will das wissenschaft­liche und künstlerische Werk einer breiten Öffentlichkeit zugänglich machen und ins besondere jungen Menschen die Persönlichkeit Zuses nahebringen und sie für einen Berufsweg in der Informatik gewinnen.'
