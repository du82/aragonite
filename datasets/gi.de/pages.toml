["https://gi.de/meldung/auszeichnung-mint-freundliche-schulen-und-digitale-schulen-in-niedersachsen"]
title = "Auszeichnung „MINT-freundliche Schulen“ und „Digitale Schulen“ in Niedersachsen - Gesellschaft für Informatik e.V."
description = "20 Schulen aus Niedersachsen wurden heute in einer Onlineveranstaltung von unserem MINT Vorständen Harald Fisch, Prof. Dr. Hannes Federrath und unseren Partnern als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten sieben Schulen das erste Mal die Auszeichnung und weitere zwölf Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus wurden zehn Schulen, davon sieben erstmalig, als „Digitale Schule“ ausgezeichnet."
full_description = "20 Schulen aus Niedersachsen wurden heute in einer Onlineveranstaltung von unserem MINT Vorständen Harald Fisch, Prof. Dr. Hannes Federrath und unseren Partnern als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten sieben Schulen das erste Mal die Auszeichnung und weitere zwölf Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus wurden zehn Schulen, davon sieben erstmalig, als „Digitale Schule“ ausgezeichnet. Die Ehrung der „MINT-freundlichen Schulen“ in Niedersachsen steht unter der Schirmherrschaft von Kultusminister Grant Hendrik Tonne und der Kultusministerkonferenz (KMK), die Ehrung der „Digitalen Schulen“ steht unter der Schirmherrschaft der Beauftragten der Bundesregierung für Digitalisierung, Staatsministerin Dorothee Bär. Thomas Sattelberger, Vorstandsvorsitzende der Initiative „MINT Zukunft schaffen!: „Die Corona-Krise hat im deutschen Bildungssystem für viel Sorge, aber auch für viel Bewegung gesorgt. Es gibt zahlreiche Lehrkräfte in Deutschland, die die Krise genutzt haben, um sich und die eigene Schule weiterzuentwickeln und zu digitalisieren. Nach dem Motto „Turning Desaster into Triumph“ haben die MINT-freundlichen Schulen ebenso wie die Digitalen Schulen – seit Jahren durch klare Arbeit vorbereitet – gezeigt, wie gute digitale Schule geht und wie wichtig das Zusammenspiel von MINT und Digitalisierung ist, um erfolgreich zu sein. Ich bin stolz, dass wir in Niedersachsen 19 Schulen als „MINT-freundliche Schule“ und zehn als „Digitale Schule“ ehren können. Herzlichen Glückwunsch!“ Prof. Dr. Hannes Federrath, Präsident der Gesellschaft für Informatik und Co-Vorsitzender von MINT Zukunft schaffen: „Eine von Automatisierung, Digitalisierung und Vernetzung geprägte Welt bedarf eines umfassenden Bildungsverständnisses, das technische, gesellschaftliche und anwendungsbezogene Perspektiven gleichermaßen miteinbezieht. Die Auszeichnung ‚Digitale Schule‘ reflektiert diesen Ansatz. Wir danken den vielen Bildungsexpertinnen und -experten für die Begutachtung der zahlreichen Bewerbungen. Es ist erfreulich zu sehen, wie viele Lehrkräfte und Schulleitungen mit ihrem Engagement dazu beitragen, das von uns ausgezeichnete Bildungsverständnis zu etablieren.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2020
