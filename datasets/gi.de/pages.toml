title = "Jobs - Gesellschaft für Informatik e.V."
description = "Die Gesellschaft für Informatik e.V. (GI) gestaltet den digitalen Wandel. Seit 1969 vertreten wir die Interessen der Informatikerinnen und Informatiker in Wissenschaft, Gesellschaft und Politik und setzen uns für eine gemeinwohlorientierte Digitalisierung ein. In den Teams unserer beiden Geschäftsstellen in Berlin und Bonn gibt es eine Reihe interessanter Aufgaben und spannender Jobs – vom Werkstudierenden bis zur Projektleitung."
full_description = "Die Gesellschaft für Informatik e.V. (GI) gestaltet den digitalen Wandel. Seit 1969 vertreten wir die Interessen der Informatikerinnen und Informatiker in Wissenschaft, Gesellschaft und Politik und setzen uns für eine gemeinwohlorientierte Digitalisierung ein. In den Teams unserer beiden Geschäftsstellen in Berlin und Bonn gibt es eine Reihe interessanter Aufgaben und spannender Jobs – vom Werkstudierenden bis zur Projektleitung. Unsere Mitarbeitenden stehen im Austausch mit Fachleuten aus Forschung, Politik und Wirtschaft, organisieren zahlreiche Veranstaltungen und erarbeiten in vielseitigen Projekten Lösungen für die Herausforderungen unserer Gesellschaft: ob ethische KI, energieeffiziente Software oder dringende Fragen des Datenschutzes. Wir glauben, dass eine erfüllende, fair bezahlte und zukunftsfähige Beschäftigung die Grundlage für unsere erfolgreiche Arbeit ist. Die grundlegenden Prinzipien sind in unserem Code of Conduct festgeschrieben. Darüber hinaus erhält jede*r festangestellte Mitarbeitende in unserem Team folgende Leistungen: Wir haben auch spannende Stellen für Studierende in bereits laufenden und neuen Projekten ausgeschrieben. Meldet euch bei Interesse gerne bei Frithjof Nagel Frithjof.Nagel@gi.de Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
