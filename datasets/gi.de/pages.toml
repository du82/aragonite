["https://gi.de/meldung/es-ist-vollbracht-erkenntnisse-aus-dem-potentials-of-green-coding-projekt"]
title = "Es ist vollbracht: Erkenntnisse aus dem 'Potentials of Green Coding'-Projekt - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = 'In den letzten 18 Monaten hat sich das Team des Projekts "Potentials of Green Coding" mit der Erforschung und Förderung umweltfreundlicher Softwareentwicklung beschäftigt. Der Abschluss der ersten Finanzierungsphase bietet Gelegenheit, die wichtigsten Erkenntnisse und Ergebnisse zu beleuchten. Die Forscher*innen am Umwelt-Campus Birkenfeld führten eine Literaturanalyse durch, um den aktuellen Stand von Green Coding und Green IT zu bewerten. Ihre Analyse ergab eine solide konzeptionelle Grundlage und laufende Forschung, mit verschiedenen Methoden zur Erfassung von Ressourcen- und Energieverbrauchsdaten. Es besteht jedoch ein Mangel an einheitlicher Terminologie – erkennbar in überlappenden Begriffen wie Green ICT, IT, Computing und Software Engineering – was Herausforderungen bei der Identifizierung relevanter Literatur und der Verbindung von Technologien mit Green Coding darstellt. Die Ergebnisse der Literaturanalyse wurden auf dem Workshop Umweltinformatik zwischen Nachhaltigkeit und Wandel während der INFORMATIK2023 präsentiert und sind in den Proceedings nachzulesen: https://dl.gi.de/search?query=Green%20Coding%20&scope=30690b3e-d866-4c83-8b80-3bfc9fa47f2c Das Projektteam der Gesellschaft für Informatik (GI) untersuchte die Integration umweltfreundlicher Software-Engineering-Praktiken in der Internetbranche anhand einer Online-Umfrage mit 90 Teilnehmenden aus zehn Ländern, hauptsächlich jedoch aus Deutschland (79 Prozent). Die Ergebnisse zeigten einen Konsens über das Potenzial zur Verbesserung der Nachhaltigkeit (75 Prozent), wobei die Hälfte der befragten Unternehmen Green Coding als strategisches Ziel betrachtet. Allerdings messen lediglich 18 Prozent den ökologischen Fußabdruck ihrer Software, und nur 16 Prozent nutzen Green Coding-Techniken zur Reduzierung des Energie- und Ressourcenverbrauchs. Identifizierte Hürden sind der Mangel an klaren Strategien (54 Prozent), an Fachwissen (46 Prozent) und an Ressourcen (36 Prozent). Der darauffolgende Industrieworkshop in Berlin, an dem bedeutende Unternehmen wie Google, adesso und DATEV teilnahmen, verdeutlichte, wie wichtig genaue Messungen und Daten in der umweltfreundlichen Softwareentwicklung sind. Die Notwendigkeit standardisierter Messgeräte wurde betont und Herausforderungen wie das Fehlen von regulatorischen Standards und unzureichendem politischen Engagement adressiert. Die Ergebnisse aus der Umfrage und dem Workshop sind in der Abschlusspublikation des Projekts nachzulesen: https://gi.de/fileadmin/user_upload/ISOC/2023-09-25_Green_Coding_final.pdf'
author = "Gesellschaft für Informatik (GI)"
