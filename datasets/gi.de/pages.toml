["https://gi.de/meldung/hybride-wissensarbeit"]
title = "Hybride Wissensarbeit - Gesellschaft für Informatik e.V."
description = "Aufgrund der Fortschritte im Bereich der künstlichen Intelligenz (KI) ergeben sich neue Gestaltungsmöglichkeiten zur Reorganisation von Wissensarbeit an der Schnittstelle von Menschen und Maschine. Durch die Verschmelzung von menschlicher und künstlicher Intelligenz können komplementäre Stärken zum Lösen von Arbeitsaufgaben gebündelt werden. Neuartige Wissensarbeitssysteme sind erforderlich, die Wissensarbeitende sowohl bei der Ausübung von Routineaufgaben als auch Nichtroutineaufgaben unterstützen."
full_description = "Aufgrund der Fortschritte im Bereich der künstlichen Intelligenz (KI) ergeben sich neue Gestaltungsmöglichkeiten zur Reorganisation von Wissensarbeit an der Schnittstelle von Menschen und Maschine. Durch die Verschmelzung von menschlicher und künstlicher Intelligenz können komplementäre Stärken zum Lösen von Arbeitsaufgaben gebündelt werden. Neuartige Wissensarbeitssysteme sind erforderlich, die Wissensarbeitende sowohl bei der Ausübung von Routineaufgaben als auch Nichtroutineaufgaben unterstützen. Der Schlagwortartikel umreißt die Grundlagen von Wissensarbeit und arbeitet die Charakteristika von Routineaufgaben und Nichtroutineaufgaben innerhalb von Arbeitsprozessen auf. Es werden Grenzen klassischer IT-gestützter Wissensarbeitssysteme als Werkzeuge umrissen, die Wissensarbeitende im Arbeitsprozess unterstützen. Aufbauend darauf diskutiert der Artikel, dass technologische Fortschritte eine arbeitsprozessintegrierte und personalisierte Unterstützung von Wissensarbeitenden erlauben. Dazu verweist der Artikel auf die Charakteristika von kollaborativ interaktiv lernenden Systemen. Darauf aufbauend werden Hybride Wissensarbeitssysteme vorgestellt, die sowohl das KI-unterstützte menschliche Lernen als auch das Mensch-unterstützte maschinelle Lernen unterstützen. In diesem Zusammenhang beschreibt der Artikel definitorische Grundlagen von menschlicher, künstlicher und hybrider Intelligenz, stellt drei Archetypen von Mensch-Maschine-Aufgaben innerhalb von hybriden Wissensarbeitssystemen vor und umreißt drei Gestaltungsdimensionen solcher Systeme. Mittels eines Praxisbeispiels zum kollaborativen Schreiben von Journalist*innen beschreibt der Artikel exemplarisch die hybride Wissensarbeit. Der Artikel schließt mit einem Ausblick auf zukünftige Forschungsbedarfe. Wissensarbeit bezieht sich auf den Wissensanteil einer Arbeitsaufgabe. Dies umfasst das benötigte Domänenwissen, den Arbeitsprozess und -aufgabe sowie die Aktivitäten zum Ausführen der Aufgabe [4]. Wissensarbeit ist besonders, da sie sowohl Routine- als auch Nichtroutineaufgaben umfasst [11]."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
