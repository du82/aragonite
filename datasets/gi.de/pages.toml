["https://gi.de/themen/beitrag/es-kann-sprechen"]
title = "Es kann sprechen! - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Nobelpreise für Physik und Chemie wurden dieses Jahr für Beiträge zur Künstlichen Intelligenz verliehen – doch zwei der Preisträger warnen selbst vor den Gefahren der Technologie. Warum könnte diese Auszeichnung ein Weckruf für uns alle sein? Die Nobelpreise für Physik und Chemie wurden in diesem Jahr für Verdienste im Zusammenhang mit Künstlicher Intelligenz (KI), einem Teilgebiet der Informatik, verliehen. Das allein ist schon bemerkenswert. Mindestens genauso bemerkenswert ist aber, dass zwei der Preisträger vor dem, für das sie die Grundlagen geschaffen haben, bereits seit Jahren warnen. Einer hat seine Warnung sogar anlässlich der Bekanntgabe der Preisverleihung spontan wiederholt: „In the same circumstances I would do the same again, but I am worried that the overall consequence of this might be systems more intelligent than us that eventually take control“, so Geoffrey Hinton [heute journal vom 8. Oktober 2024, 24:05]. Während wir uns also freuen dürfen, dass Leistungen der Informatik als nobelpreiswürdig anerkannt werden (Geoffrey Hinton hatte 2018 schon den Turing-Preis bekommen, aber wer nimmt davon Notiz?), kommen wir nicht umhin, zu bemerken, dass diese ungewöhnliche Entscheidung des Komitees eine starke politische Komponente hat: Sie klingt wie ein Weckruf an die Welt. Warum aber ein solcher Weckruf? Bis vor Kurzem war die Rollenverteilung zwischen Mensch und Computer klar: Menschen sind Generalisten, Computer sind Spezialisten. Menschen können sich in nahezu beliebigen Kontexten scheinbar spielerisch bewegen, Computer können in eng umrissenen Kontexten komplizierte Aufgaben, für die sie programmiert wurden, mit großer Geschwindigkeit und Genauigkeit lösen. Menschen besitzen Weltwissen, Computer besitzen Spezialwissen. Mit dem Aufkommen der sogenannten großen Sprachmodelle und ihrer Verwandten in anderen Gebieten wie der Bild- und Musikverarbeitung, die Inhalte generieren können anstatt sie nur zu klassifizieren (die sog. Generative KI), hat sich das schlagartig geändert. Da sie alles integriert haben, dessen ihre Hersteller habhaft werden konnten (faktisch: das „Weltwissen“, wie es durch das WWW verkörpert wird), können sie beliebige, ihnen vorgelegte Schnipsel, in Kontexte einbetten und darin vervollständigen. So entsteht aus einem Anfang einer Geschichte, einem sog. Prompt, eine vollständige Geschichte, die in den identifizierten Kontext passt und in diesem wohlbegründet scheint [State of GPT (youtube)]. Scheint, nicht ist, weil das Sprachmodell nicht begründet, also logisch stringent vorgeht, sondern einfach nur spricht (manche würden vielleicht sagen: plappert). Dass die damit erzielten Leistungen so beeindruckend sind, liegt schlicht daran, dass wir Menschen in den meisten Alltagssituation auch eher reflexhaft sprechen (plappern) und nicht begründen, denn dafür würden wir zu lange brauchen. Was unser „schnelles Denken“ [Schnelles Denken, langsames Denken – Wikipedia] angeht, haben wir unser Ebenbild geschaffen. Es kann auf einmal sprechen, das fasziniert und erschreckt uns zugleich."
author = "Gesellschaft für Informatik (GI)"
