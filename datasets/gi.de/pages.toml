["https://gi.de/themen/beitrag/byte-challenge-digitales-lernen"]
title = "BYTE Challenge – Digitales Lernen - Gesellschaft für Informatik e.V."
description = "Die BYTE Challenge wurde 2020 ins Leben gerufen, um Schulen bei der digitalen Bildung zu unterstützen und Schüler*innen spielerisch für Informatik zu begeistern. Was als Idee begann, hat sich zu einer Lernplattform mit Wettbewerbscharakter entwickelt, die bereits tausende Kinder erreicht. Doch wie entsteht ein solches Bildungsprojekt? Von der ersten Konzeption über Branding, Finanzierung und Datenschutz bis hin zur Entwicklung interaktiver Lerninhalte – dieser Beitrag gibt spannende Einblicke in den Aufbau und die Herausforderungen einer digitalen Bildungsinitiative."
full_description = "Die BYTE Challenge wurde 2020 ins Leben gerufen, um Schulen bei der digitalen Bildung zu unterstützen und Schüler*innen spielerisch für Informatik zu begeistern. Was als Idee begann, hat sich zu einer Lernplattform mit Wettbewerbscharakter entwickelt, die bereits tausende Kinder erreicht. Doch wie entsteht ein solches Bildungsprojekt? Von der ersten Konzeption über Branding, Finanzierung und Datenschutz bis hin zur Entwicklung interaktiver Lerninhalte – dieser Beitrag gibt spannende Einblicke in den Aufbau und die Herausforderungen einer digitalen Bildungsinitiative. Als 2020 inmitten der Pandemie offensichtlich wurde, wie groß der Bedarf an Digitalisierung, Informatik-Bildung und Unterstützung der Schulen in Deutschland ist, haben wir die BYTE Challenge gegründet, eine Lernplattform mit Wettbewerbscharakter rund um die Informatik, die inzwischen mehrere tausend Schulkinder an über 70 Schulen erreicht. Wir wollen dabei Berührungsängste nehmen und langfristig eine Begeisterung für digitale Technologien wecken. Besonders Schüler*innen, die oft wenig Selbstvertrauen in technische Fächer haben, erhalten hier die Möglichkeit, ihre Potenziale fernab von Geschlechterrollen und Vorurteilen zu entdecken. Die Vorbereitung für ein solches Projekt teilt sich in mehrere Bereiche auf. Im Vorfeld ist eine Recherche bestehender Angebote erforderlich und die Ausrichtung des eigenen Projektes an den bisher nicht abgedeckten Bedarf. Im Falle der BYTE Challenge gehörten dazu Gespräche mit der Geschäftsführung der GI sowie der Bundesweiten Informatikwettbewerbe und das Kontaktieren weiterer ehrenamtlicher und außerschulischer Initiativen und von (Informatik-)Lehrkräften. Dabei wurde schnell klar, dass die Heimat eines gemeinnützigen Informatik-Bildungsprojektes für die Breite in der GI sein würde. Dann folgt das Branding, mit der Suche eines Namens, der Gestaltung eines Logos sowie die Wahl eines Mottos. Etwas später wurde dann unser Maskottchen Bitsy „geboren“, das inzwischen schon ein Rundum-Update erfahren hat. Wichtig war schon dabei, dass keine Gender-Stereotype reproduziert werden, was sich bereits in der Wahl der Farbpalette niederschlägt."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
