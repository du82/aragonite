full_description = "Cyber-Angriffe auf Unternehmen und öffentliche Einrichtungen nehmen weltweit drastisch zu. Das von der Cyberagentur geförderte Projekt PROTECT entwickelt Lösungen, um IT-Systeme widerstandsfähiger gegen diese Bedrohungen zu machen. Koordiniert vom Deutschen Forschungszentrum für Künstliche Intelligenz (DFKI) und in Zusammenarbeit mit führenden Partnern aus Industrie und Forschung verfolgt das Projekt ein klares Ziel: Mit innovativen Methoden der formalen Verifikation soll die IT-Sicherheit auf ein neues Niveau gehoben und das Vertrauen in digitale Systeme nachhaltig gestärkt werden. Bottom-up statt top-down. Wir kombinieren die existierenden Ansätze der beteiligten Partner, und kombinieren damit existierende Stärken, anstatt Projektpartner in ein vorgegebenes Korsett existierender Methoden zu zwingen. Gleichzeitig erlaubt dieser Ansatz Anwendern, aus den so kombinierten Methoden die für den Anwendungsfall passenden auszuwählen. Open Source und Open Science. Unsere Arbeiten werden quelloffen oder als open access veröffentlicht, und sind damit möglichst breit verfügbar. Forschungsgetrieben. Alle wissenschaftlichen Partner sind auf ihrem jeweiligen Anwendungsgebiet exzellent etabliert, und bringen diese Forschungsstärke in das Projekt gewinnbringend ein. Technisch nutzen wir fortschrittliche Technologien und Sprachen: fortgeschrittene Verifikationstechniken, SAIL for ISA-Spezifikation, eine Reihe von Referenzsystemarchitekturen auf der Basis von RISC-V, und Rust als Implementationssprache. PROTECT ist Teil des Programms „Ökosystem vertrauenswürdige Infrastruktur“ (ÖvIT) und wird durch die Agentur für Innovation in der Cybersicherheit GmbH (Cyberagentur) finanziert. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
