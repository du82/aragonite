["https://gi.de/meldung/auszeichnung-mint-freundliche-schulen-in-sachsen-anhalt"]
title = "Auszeichnung „MINT-freundliche Schulen“ in Sachsen-Anhalt - Gesellschaft für Informatik e.V."
description = "Drei Schulen aus Sachsen-Anhalt wurden heute in einer Onlineveranstaltung von unserem stellvertretenden Vorsitzenden Prof. Dr. Hannes Federrath und Bildungsminister Marco Tullner, als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten alle drei Schulen nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit das Signet „MINT-freundliche Schule“. Darüber hinaus wurde die Saale Schule für (H)alle als „Digitale Schule“ geehrt."
full_description = "Drei Schulen aus Sachsen-Anhalt wurden heute in einer Onlineveranstaltung von unserem stellvertretenden Vorsitzenden Prof. Dr. Hannes Federrath und Bildungsminister Marco Tullner, als „MINT-freundliche Schule“ ausgezeichnet. Davon erhielten alle drei Schulen nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit das Signet „MINT-freundliche Schule“. Darüber hinaus wurde die Saale Schule für (H)alle als „Digitale Schule“ geehrt. Das Zusammenspiel zwischen Digitalisierung und Mathematik, Informatik, Naturwissenschaften und Technik (MINT) hat sich ebenfalls als für die Schulentwicklung in der Covid-19-Krise als entscheidend herausgestellt. Die heute ausgezeichneten »MINT-freundlichen Schulen« zeigen, dass sie mit ihrem schulischen Konzept in der Lage sind, Ad-Hoc-Maßnahmen – z. B. zur Digitalisierung – didaktisch und pädagogisch durchdacht in den Schulalltag einzubinden. Die »MINT-freundlichen Schulen« werden für Schülerinnen und Schüler, Eltern, Unternehmen sowie die Öffentlichkeit durch die Ehrung sichtbar und von der Wirtschaft nicht nur anerkannt, sondern auch besonders unterstützt. Bundesweite Partner der Initiative »MINT Zukunft schaffen« zeichnen diejenigen Schulen aus, die bewusst MINT-Schwerpunkte setzen. Die Schulen werden auf Basis eines anspruchsvollen, standardisierten Kriterienkatalogs bewertet und durchlaufen einen bundesweit einheitlichen Bewerbungsprozess. Die MINT-freundliche Schulen weisen nach, dass sie mindestens 10 von 14 Kriterien im MINT-Bereich erfüllen. Der digitalen Schule Saale Schule für (H)alle wurde es durch einen Kriterienkatalog ermöglicht, eine Standortbestimmung sowie eine Selbsteinschätzung zum Thema „Digitalisierung“ vorzunehmen und Anregungen umzusetzen. Bei Vorliegen einer entsprechenden Profilbildung kann von einer digitalen Schule gesprochen werden. Der Kriterienkatalog „Digitale Schule“ umfasst fünf Module: 1. Pädagogik & Lernkulturen 2. Qualifizierung der Lehrkräfte 3. regionale Vernetzung 4. Konzept und Verstetigung 5. Technik und Ausstattung."
author = "Gesellschaft für Informatik (GI)"
year_published = 2020
