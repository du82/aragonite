["https://gi.de/grand-challenges2014"]
title = "Grand Challenges 2014 - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Informatik ist heute präsenter denn je: Die Digitalisierung durchdringt alle Arbeits- und Lebensbereiche. Das bringt eine Reihe an neuen Herausforderungen auch für die verschiedenen Informatik-Disziplinen. Die „Grand Challenges“ sind fundamentale Herausforderungen in der Informatik, deren Lösung einen deutlich spürbaren Fortschritt in ökonomischer, sozialer oder gesellschaftlicher Hinsicht für unser aller Leben bedeutet. Die GI hat fünf Fragestellungen als große Herausforderungen der Informatik identifiziert, weil sie damit zum Ausdruck bringen möchte, dass die Informatik sich zuallererst um die von der Informatik selbst geschaffenen Probleme kümmern muss. Die Auswahl spiegelt sowohl die Kompetenz der Informatik zur Definition dieser Fragestellungen als auch ihre Verantwortung für die Gestaltung der Zukunft wider. Es werden Forschungs- und Entwicklungsthemen benannt, die in der Fortentwicklung der Informatik als Schlüsselfelder gelten und Potenziale für künftige Anwendungen, Dienste oder Produkte beinhalten. Die Grand Challenges-Initiative soll Aufmerksamkeit bei Fachleuten und Interessenten in Wissenschaft, Politik, Gesellschaft schaffen, Ressourcen zur Lösungsfindung bündeln sowie den Nachwuchs motivieren. So notwendig die Fokussierung ist, so sehr reduziert sie auch das Spektrum der interessanten Gebiete und lässt manchen wichtigen Aspekt ganz unbeachtet. Dies ist uns bewusst. Deshalb sehen wir die Initiative als fortlaufende Aktivität. Uns ist ebenfalls bewusst: Es existieren noch viele große Herausforderungen für die Informatik in allen Bereichen der Gesellschaft wie z.B. Energie, Umwelt, Medizin, Biologie, Transportwesen, um nur einige zu nennen. Wir stehen also nicht am Ende, sondern ganz am Anfang von Diskussion und Erforschung der Grand Challenges. Ein Präsidiumsarbeitskreis der Gesellschaft für Informatik hat sich unter Leitung der ehemaligen Vizepräsidentin Simone Rehm mit der Frage beschäftigt, welches die zentralen Herausforderungen der Informatik in der Zukunft sein werden. Schließlich wurden fünf Themen als die Grand Challenges der Informatik ausgewählt."
