full_description = "Mehr als 600.000 Kinder und Jugendliche nahmen 2024 an den Bundesweiten Informatikwettbewerben (BWINF) teil. Auch der Anteil an Mädchen und jungen Frauen ist dabei weiter angestiegen. Bonn, Januar 2025 | Die Zahlen sprechen für den Erfolg des BWINF-Konzeptes: Insgesamt mehr als 600.000 Teilnahmen konnten die Bundesweiten Informatikwettbewerbe im vergangenen Jahr verzeichnen. Neue Spitzenwerte erreichten Informatik-Biber und Jugendwettbewerb Informatik: Mehr als 60.000 Kinder und Jugendliche haben 2024 am Jugendwettbewerb teilgenommen, mehr als 540.000 beim Informatik-Biber. Beim Bundeswettbewerb Informatik waren mit 1.790 Teilnehmende so viele dabei wie seit mehr als 30 Jahren nicht. „Besonders erfreulich ist der zunehmende Anteil von Mädchen an den Wettbewerben“, betont BWINF-Geschäftsführer Dr. Wolfgang Pohl. „Fast die Hälfte der Teilnehmenden am Informatik-Biber sind weiblich – nämlich 46,2 Prozent. Beim Jugendwettbewerb Informatik liegt der Anteil bei rund 39,1 Prozent, und in der 1. Runde des Bundeswettbewerbs wurde mit 18 Prozent ein neuer Bestwert erreicht. Die hohen beziehungsweise immer weiter steigenden Mädchenanteile sind erste Auswirkungen der in 2020 gestarteten Initiative girls@BWINF. Ziel ist, wie Dr. Pohl erklärt, „die vielen talentierten Mädchen, die wir in unseren Wettbewerben kennenlernen, in ihrem Interesse an Informatik zu bestärken.“ Mit Erfolg: Seit Gründung von girls@BWINF im Jahr 2020 steigen die Mädchenanteile bei Jugend- und Bundeswettbewerb kontinuierlich. Beim aktuellen Bundeswettbewerb sind die Mädchen sogar überproportional erfolgreich: An den Teilnahmen sind sie mit 18 Prozent, an den erfolgreichen Teilnahmen mit Qualifikation für die 2. Runde aber mit rund 20 Prozent beteiligt. Auch dies ist ein Bestwert und zeigt die Wirksamkeit der BWINF-Mädchenförderung. Noch vor fünf Jahren lagen Teilnahme- und Erfolgsquote je bei nur rund 13 Prozent. Einen wichtigen Bestandteil der Mädchenförderung bilden die girls@BWINF-Camps. Diese bieten ein breites Spektrum: vom Python-Crashkurs bis hin zu anspruchsvollen Informatik-Projekten. Die Teilnehmerinnen können dabei nicht nur ihre Kenntnisse vertiefen, sondern sich auch vernetzen und untereinander austauschen. Wie groß der Bedarf an einem solchen Angebot ist, zeigt die Resonanz: Die Camps, die 2024 in Kooperation mit Partnern wie #SheTransformsIT, dem Ada-Lovelace-Projekt oder Unternehmen wie Deloitte, SAP und Porsche angeboten wurden, waren mit 250 Bewerbungen für 170 Plätze stark überbucht."
