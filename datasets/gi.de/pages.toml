["https://gi.de/aktuelles/projekte/grand-challenges/vollautomatisierte-software-entwicklung"]
title = "Vollautomatisierte Software-Entwicklung - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Software vollautomatisch entwickeln – diese Vision scheint mit den kürzlichen Fortschritten bei Large Language Models nicht mehr unmöglich. Die tatsächliche Umsetzung könnte allerdings nicht nur wünschenswerte Konsequenzen für die Gesellschaft haben. Diese Grand Challenge nimmt mögliche Hürden und Potentiale unter die Lupe. Software Engineering (SE) befasst sich mit der Transformation von implizitem und explizitem Wissen von Sachverhalten und Anforderungen in immaterielle Artefakte. Die produzierten Artefakte sind dabei hoch formalisiert: Insbesondere Programme sind formale Beschreibungen dessen, was Computer tun sollen. Aufgrund der hohen Formalisierung bei gleichzeitiger Zugänglichkeit der Artefakte für die eigenen Methoden ist das Software Engineering seit jeher der Gegenstand von Automatisierung: Eine Vielzahl von Werkzeugen hilft beim Anforderungsmanagement, beim Entwurf der Software, bei der Erstellung des Endprodukts in komplexen Build-Pipelines sowie bei der Testerzeugung und -ausführung. Mit der generativen KI hat nun ein neuer Player die Bühne des Software Engineering betreten: Insbesondere große Sprachmodelle (Large Language Models, LLMs) enthalten einen Teil unseres Allgemeinwissens und können nun ebenfalls auf Basis informell beschriebener Eingaben formalisierte Ausgaben wie Programmcode erzeugen. Gerade die Tatsache, dass es sich bei der Softwareentwicklung im Wesentlichen um einen sprachbasierten Transformationsprozess handelt, macht sie zu einem idealen Anwendungsfall für sprachbasierte generative Transformer. Vor diesem Hintergrund scheint die Vision, Software vollautomatisch zu entwickeln, nicht mehr unmöglich. Ein vollautomatisches Software Engineering hätte erhebliche gesellschaftliche Auswirkungen: Zum einen kann es dem bestehenden Fachkräftemangel entgegenwirken und zu einer höheren Wertschöpfung führen. Zum anderen kann es zur Folge haben, dass jeder Mensch für seinen Anwendungsfall Software erzeugen kann, wodurch die digitale Teilhabe drastisch erhöht würde. Neben diesen wünschenswerten Auswirkungen sind allerdings auch dystopische vorstellbar: Automatisch erzeugte Software kann zu Kontrollverlusten führen, die in ihrem Schaden den von heute bekannten Softwareausfällen bei weitem übertreffen. Ein Teil der Herausforderung ist deshalb, zu klären und zu reflektieren, wie weit die Automatisierung der Software-Entwicklung gehen kann und soll. Die Grand Challenge insgesamt ist, die technische Entwicklung so zu kanalisieren, dass die Gesellschaft nur die gewünschten Auswirkungen erfährt."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
