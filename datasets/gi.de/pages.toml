["https://gi.de/meldung/deutscher-mobilitaetspreis-2023-innovative-loesungen-fuer-die-mobilitaet-der-zukunft-gesucht"]
title = "Deutscher Mobilitätspreis 2023: Innovative Lösungen für die Mobilität der Zukunft gesucht. - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "– Bis zum 30. September können Projekte, Produkte und Anwendungen in vier Kategorien eingereicht werden Berlin, 04. Juli 2023 – Der Deutsche Mobilitätspreis (DMP) zählt zu den wichtigsten Auszeichnungen im Bereich Digitales und Mobilität in Deutschland. Das Bundesministerium für Digitales und Verkehr (BMDV) prämiert seit 2016 jährlich Projekte, die die Potenziale der Digitalisierung für eine zukunftsfähige Mobilität nutzen. Bis zum 30. September 2023 werden für insgesamt vier Kategorien innovative Projekte, Produkte und Anwendungen im Bereich Digitales und Mobilität gesucht. Für Bundesminister Volker Wissing ist der Deutsche Mobilitätspreis eine Möglichkeit, Innovationspotenziale mit Vorbildcharakter hervorzuheben: „Wir wollen die Herausforderungen einer nachhaltigen Mobilität nicht in die Zukunft verschieben, sondern bereits heute gezielt nach Lösungen für die Mobilitätsbedürfnisse von morgen suchen. Dabei sollten wir die Chancen der Digitalisierung und innovativer Technologien optimal nutzen, um klimaneutrale Mobilität voranzubringen und den Wirtschaftsstandort Deutschland zu stärken. Deshalb suchen wir für den Deutschen Mobilitätspreis Projekte, Produkte und Anwendungen, die besonders effiziente und vielversprechende Lösungen bieten.“ In den vier Kategorien „Digital Transformation & Data-Driven Mobility“, „New Mobility“, „Good Practice“ und „Design“ sucht das BMDV nach Innovationen für eine zukunftsfähige Mobilität. Hierbei richtet sich der Blick insbesondere an Unternehmen, Start-ups, Netzwerke, Initiativen aus der Mobilitäts- und Digitalbranche sowie Kommunen und Verwaltungen. Der Preis rückt Entwicklungen im Bereich intelligenter Mobilität (Smart Mobility) und innovative Ansätze, die Vernetzung, Digitalisierung und künstliche Intelligenz miteinander verbinden, in den Fokus. In einem mehrstufigen Auswahlverfahren ermittelt eine Expertenjury die Preisträgerinnen und Preisträger, die im Rahmen einer festlichen Preisverleihung mit dem Deutschen Mobilitätspreis 2023 geehrt werden."
author = "Gesellschaft für Informatik (GI)"
