["https://gi.de/meldung/digital-gipfel-junge-generation-stellt-forderungen-an-die-politik"]
title = "Digital-Gipfel: Junge Generation stellt Forderungen an die Politik - Gesellschaft für Informatik e.V."
description = "Auf dem Digital-Gipfel der Bundesregierung in Frankfurt haben junge Teilnehmende des Projekts Common Grounds Forum in den vergangenen zwei Tagen ihre Forderungen an die Politik vorgestellt. Dabei ging es um die Frage, welche Kompetenzen in Zukunft wichtig sind, um die Gesellschaft aktiv mitzugestalten. Die Teilnehmenden im Alter zwischen 16 und 30 Jahre diskutierten auf dem Digital-Gipfel mit Bundesministerin Bettina Stark-Watzinger über ihre Positionen– und haben den Altersdurchschnitt der Veranstaltung um einiges gesenkt."
full_description = "Auf dem Digital-Gipfel der Bundesregierung in Frankfurt haben junge Teilnehmende des Projekts Common Grounds Forum in den vergangenen zwei Tagen ihre Forderungen an die Politik vorgestellt. Dabei ging es um die Frage, welche Kompetenzen in Zukunft wichtig sind, um die Gesellschaft aktiv mitzugestalten. Die Teilnehmenden im Alter zwischen 16 und 30 Jahre diskutierten auf dem Digital-Gipfel mit Bundesministerin Bettina Stark-Watzinger über ihre Positionen– und haben den Altersdurchschnitt der Veranstaltung um einiges gesenkt. Berlin, 23.10.2024 – „In der Schule lernen wir, Erörterungen zu schreiben, als würden wir noch regelmäßig Briefe an gedruckte Tageszeitungen versenden. Tatsächlich führen wir unsere Debatten meist ganz woanders: in Foren, Kommentarspalten oder Posts in sozialen Netzwerken.“ So brachte Felix Preu, Student an der Universität Heidelberg, auf den Punkt, warum die Teilnehmenden des Common Grounds Forum (CGF) fordern, dass bereits in der Schule Debattenkompetenzen trainiert werden. Dies ist nur eine von insgesamt 17 Positionen, die die jungen Menschen in den vergangenen Wochen entwickelt haben. Sie alle drehen sich um das Thema „Future Skills for Active Citizens“, also um Kompetenzen, die aus Sicht der Teilnehmenden wichtig für eine aktive Teilhabe an der Gesellschaft sind. Das Projekt wird vom Bundesministerium für Bildung und Forschung gefördert und von der Gesellschaft für Informatik e.V. in strategischer Partnerschaft mit dem Forum Bildung Digitalisierung, der Vodafone-Stiftung sowie der Stiftung Mercator umgesetzt. Auf der Bühne des Digital-Gipfels der Bundesregierung stellten die Vertreter*innen des CGF aber nicht nur ihre Forderungen vor, sondern diskutierten darüber auch direkt mit Bettina Stark-Watzinger, Bundesministerin für Bildung und Forschung. Frithjof Nagel, Projektleiter des Common Grounds Forum bei der Gesellschaft für Informatik: „Uns war es wichtig, junge Menschen auf Augenhöhe mit der Politik ins Gespräch zu bringen. Es wird Zeit, dass wir sie auf Formaten wie dem Digital-Gipfel nicht als Besucher*innen ansehen – sondern als Menschen, die sehr viel Expertise mitbringen und wertvolle Perspektiven mit einbringen.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
clearnet = "https://gi.de/meldung/digital-gipfel-junge-generation-stellt-forderungen-an-die-politik"
