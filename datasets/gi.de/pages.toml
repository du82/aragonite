["https://gi.de/aktuelles/projekte/grand-challenges/selbstbestimmung-in-der-digitalen-gesellschaft"]
title = "Selbstbestimmung in der digitalen Gesellschaft - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "In einem Zeitalter, in dem überall Daten gesammelt und verarbeitet werden, scheint digitale Selbstbestimmung oft ein leeres Versprechen zu sein. Was es braucht, damit es doch gehalten wird, zeigt diese Grand Challenge auf. Digitale Technologien durchdringen immer stärker alle Bereiche der Gesellschaft und führen zu einer zunehmenden Vielzahl an Daten. Diese Flut an Daten und deren systematische Verwertung bringen viele Vorteile und Potenziale mit sich. Sie sind die Basis für die Individualisierung unterschiedlicher digitaler Prozesse in der Aus- und Weiterbildung, der Unterhaltung oder dienen als Basis für moderne KI-basierte Assistenzsysteme wie ChatGPT, die Menschen auf vielseitige Weise unterstützen können. Diese Vorteile und Potenziale kommen jedoch nicht ohne eine Vielzahl möglicher Risiken, die die Selbstbestimmung und Selbstentfaltung der Nutzenden in der digitalen Gesellschaft gefährden. Beispielsweise sind viele der gesammelten Daten personenbezogen und können dazu führen, dass die betroffenen Nutzenden gläsern, kategorisierbar und diskriminierbar werden. Die Verwendung der aus den Daten gewonnenen Erkenntnisse führt oft dazu, dass Nutzende mit Empfehlungen und Nudges konfrontiert werden, die versuchen, ihr Verhalten zu beeinflussen. Zum Teil werden so sogar Handlungsoptionen eingeschränkt, indem Nutzende nur noch die Inhalte zu sehen bekommen, die mit hoher Wahrscheinlichkeit auf Interesse stoßen. Daher ist es eine zentrale Herausforderung, die Selbstbestimmung der Nutzenden in der digitalen Gesellschaft zu bewahren, ihre kritische Kompetenz zu stärken und gleichzeitig datengetriebene digitale Technologien stetig weiterzuentwickeln. Um diese Grand Challenge zu meistern, bedarf es eines interdisziplinären, soziotechnischen Ansatzes zur Gestaltung dieser Technologien. Dieser muss auf eine gesellschaftlich wünschenswerte Ausgestaltung abzielen und damit nicht nur partikulare, sondern alle Facetten individueller und gesellschaftlicher Interessen berücksichtigen. Diesen Ansatz sehen wir als erstrebenswerten europäischen Weg zwischen Datenkapitalismus und staatlicher Überwachung an, um die Selbstbestimmung der Nutzenden in der digitalen Gesellschaft zu erhalten und zu stärken."
author = "Gesellschaft für Informatik (GI)"
