["https://gi.de/netzwerk/partner/assoziierte-gesellschaften"]
title = "Assoziierte Gesellschaften - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Informatik ist so stark wie ihre Fachorganisationen selbst. Je mehr Mitglieder mit einer Stimme sprechen, desto mehr können wir in Politik, Wirtschaft und Gesellschaft erreichen. Da wo Synergien möglich sind, arbeiten wir mit befreundeten Geselllschaft zusammen und nehmen sie als assoziierte Gesellschaften auf. Ihre Mitglieder haben bei der GI den Status eines assoziierten Mitglieds. Das German Chapter of the ACM (Association for Computing Machinery) wurde 1968 gegründet. Es hat sich zur Aufgabe gestellt, den Kontakt zwischen Wissenschaft und Industrie in Deutschland zu intensivieren und die internationalen Verbindungen für die Mitglieder nutzbar zu machen. Fachleute aus Forschung und Lehre einerseits und Anwender und Hersteller von Software und Hardware andererseits treffen sich in regelmäßigen Fachtagungen und regionalen Veranstaltungen, um den professionellen Dialog zu pflegen - um Erfahrungen auszutauschen und neue wissenschaftliche Entwicklungen zu diskutieren. Durch die Fachtagungen und Workshops des German Chapter erhalten praxisnah arbeitende Wissenschaftler und die Praktiker aus den Entwicklungsabteilungen bei Anwendern und Herstellern Orientierungshilfen für ihre Arbeit. Das German Chapter scheut sich auch nicht, neue Problemfelder aufzudecken und zur Diskussion zu stellen. Hauptaufgabe des German Chapter ist der Betrieb der Regionalgruppen, zusammen mit der GI, die in allen größeren Städten Deutschlands attraktive Veranstaltungen anbieten und die Vernetzung der Fachleute auf regionaler Ebene fördern. Die GIL ist eine wissenschaftliche Gesellschaft zur Förderung der Agrarinformatik. Sie fördert die Schaffung, Evaluierung und Verbreitung von Theorien, Modellen, Methoden, Werkzeugen und Lösungen für die Analyse, Gestaltung, Nutzung und den Betrieb von Informationssystemen für die Land-, Forst- und Ernährungswirtschaft sowie für die agrar- und ernährungswissenschaftliche Forschung. Die GIL sieht ihre Aufgabe in der Förderung der Anwendung wissenschaftlicher Methoden und des interdisziplinären Informationsaustausches bei Analyse und Abbildung von Wissens-, Entscheidungs- und Prozessstrukturen sowie bei der Neu- und Fortentwicklung von Informationssystemen."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
