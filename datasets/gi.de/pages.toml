full_description = 'Die GI hat mit der „GI-Edition: Lecture Notes in Informatics" (LNI) eine eigene Publikationsreihe, die in der Digitalen Bibliothek der GI veröffentlicht wird. Alle in den LNI herausgegebenen Bände werden von GI-Gliederungen unterstützt und verantwortet. Grundsätzlich werden nur Proceedings von solchen Veranstaltungen in den LNI veröffentlicht, an denen eine GI-Gliederung beteiligt ist. Diese Veranstaltungen müssen der GI-Geschäftsstelle vorab zur Kenntnis gegeben werden. Artikel, die in den LNI veröffentlicht worden sind, dürfen von den Beitragenden zweitverwertet und anderweitig publiziert werden. Hierfür kann auch die final publizierte Version genutzt werden. Dabei ist die Quelle des Beitrags kenntlich zu machen, und es ist eine Verlinkung - soweit vorhanden zum DOI des Artikels, ansonsten zum Artikel selbst - in der Digitalen Bibliothek der GI erforderlich. Grundsätzlich stehen seit 2017 in den LNI veröffentlichten Beiträge unter der Lizenz Creative Commons BY-SA 4.0 und können unter den Bedingungen dieser Lizenz genutzt und weiterverbreitet werden. Die einheitliche Gestaltung der in der LNI-Reihe veröffentlichten Bände muss von den Bandverantwortlichen gewährleistet werden. Hinweis an die Bandverantwortlichen: Beitragende sollten auf eine Vorlage verpflichtet werden. Beim Mischen von LaTeX- und Word-Dokumenten ergibt sich ein uneinheitliches Bild. Zu Ihrer Unterstützung finden Sie deshalb auf dieser Seite Autorenrichtlinien sowie Gestaltungsrichtlinien für die Strukturierung des Inhalts und für die Coverseiten der Bände. Die Richtlinien sind verbindlich, damit die „Corporate Identity" der Gesellschaft für Informatik deutlich sichtbar bleibt. Für diejenigen, die Word nutzen: Neue Vorlage (Stand Februar 2024) bitte hier herunterladen. Die neue Vorlage enthält keine Kopfzeilen und keine Paginierung. Die werden vom Bandverantwortlichen generiert. Bitte stellen Sie sicher, dass die verwendeten Schriftarten in Ihren Dokumenten eingebettet sind: Word > Datei > Optionen > Speichern > Schriften einbetten aktivieren'
