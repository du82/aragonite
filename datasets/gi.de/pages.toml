["https://gi.de/meldung/neue-gesichter-im-praesidium-der-gi"]
title = "Neue Gesichter im Präsidium der GI - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die diesjährige Wahl zum Präsidium der Gesellschaft für Informatik endete am 6. Dezember 2024. Mit dem Beginn des neuen Jahres werden drei neue Mitglieder das Präsidium verstärken und gemeinsam mit ihren Kolleg*innen die Weichen für die Zukunft der GI stellen. Sie lösen drei bisherige Mitglieder ab, deren Amtszeit endet. Die Wahl brachte herausragende Kandidat*innen hervor, die mit ihren Zielen die Mitglieder der GI überzeugt haben: Claire Zschiesche engagiert sich in der Fachgruppe Frauen und Informatik und vertritt die GI im Deutschen Frauenrat. Ihr Ziel ist es, mehr Frauen für die IT zu begeistern und sicherzustellen, dass sie in der Branche bleiben. Sie möchte Konzepte entwickeln, die an Hochschulen, Universitäten und in Unternehmen implementiert werden können, um Frauen langfristig in der IT zu unterstützen. Stefan Hildebrand, Sprecher der Junior-Fellows und Initiator der Byte-Challenge, setzt sich dafür ein, die GI modern zu halten und somit den Mehrwert für ihre Mitglieder zu maximieren. Besonders wichtig sind ihm Maßnahmen, um neue Mitglieder zu gewinnen und die Bindung bestehender Mitglieder zu stärken. Ina Schieferdecker ist in den Fachgruppen Kommunikation und Verteilte Systeme (KUVS) sowie Test, Analyse und Verifikation von Software (TAV) aktiv und engagiert sich zudem im Beirat der Universitätsprofessorinnen und -professoren der GI. Sie möchte die Gesellschaft für Informatik jünger und diverser machen. 2.609 Mitglieder der GI haben ihre Stimme abgegeben, was einer Wahlbeteiligung von 17,02 % entspricht. Erstmals hatten die Mitglieder die Möglichkeit, ihre Stimme nachträglich zu verifizieren: Mithilfe einer anonymisierten Wahl-ID, die im Wahlbrief enthalten war, konnte sichergestellt werden, dass die abgegebene Stimme korrekt erfasst wurde. Dieses neue Verfahren soll die Transparenz und das Vertrauen in den Wahlprozess weiter stärken. Vielen Dank an den Projektleiter Rüdiger Grimm und die Forschungsgruppe, die dies möglich gemacht haben! Alle weiteren Infos gibts unter: https://gi.de/wahlen"
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
clearnet = "https://gi.de/meldung/neue-gesichter-im-praesidium-der-gi"
