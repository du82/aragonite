title = "Data Literacy - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Data Literacy ist die Fähigkeit des planvollen Umgangs mit Daten. In Ergänzung zu spezialisierten Fachkräften – den Data Scientists – liegt der Fokus auf der bedarfsgerechten, Disziplinen übergreifenden Vermittlung von Wissen, um datengestützt arbeiten und entscheiden können. Data Literacy wird als eine zentrale Kompetenz für Digitalisierung und globale Wissensgesellschaft gesehen. Eine Herausforderung liegt darin, dass Kompetenzen aus verschiedenen Disziplinen integriert und ein an die Bedürfnisse des Anwendungsfelds angepasstes Angebot kreiert werden muss. Die Fähigkeit, planvoll mit Daten umzugehen und sie im jeweiligen Kontext bewusst einsetzen und hinterfragen zu können wird über alle Studienrichtungen hinweg immer wichtiger. Eine Studie der Dalhousie University in Kanada (Ridsdale et al.: 2015) fassen diese Fähigkeit unter dem Begriff „Data Literacy“ zusammen. Dies beinhaltet die Kompetenzen, Daten zu erfassen, erkunden, managen, kuratieren, analysieren, visualisieren, interpretieren, kontextualisieren, beurteilen und anwenden zu können. In der Lesart der kanadischen Forscher ist Data Literacy eine zentrale Kompetenz für die Digitalisierung und die globale Wissensgesellschaft in allen Sektoren und Disziplinen. Angesichts der zunehmenden Menge und der Verfügbarkeit von Daten stellt sich die Herausforderung, mit den Daten Wissen zu generieren und fundiert Entscheidungen treffen zu können. Aus Sicht des Hochschulforums Digitalisierung (https://hochschulforumdigitalisierung.de), einer Plattform zur Diskussion über die Digitalisierung von Hochschulen und Hochschullehre, getragen von CHE, HRK und Stifterverband, braucht es hierfür „auf der einen Seite spezialisierte Fachkräfte – Data Scientists – und auf der anderen Seite in allen Sektoren und Fächern datengewandte Expertinnen und Experten sowie Führungskräfte, die in ihren jeweiligen Gebieten Fragen zu den Daten formulieren und Datenanalysen fachlich interpretieren können, insgesamt also datengestützt arbeiten und entscheiden können.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
