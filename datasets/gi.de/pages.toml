["https://gi.de/meldung/social-machines"]
title = "Social Machines - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Social Machines sind ein Paradigma für die Gestaltung soziotechnischer Systeme, die unter Verwendung von Web- und Plattformlösungen das Potenzial digitaler Technologien mit der Eigenlogik sozialer Interaktion, Organisation und Strukturbildung auf neue Weise zusammenführen. Im Folgenden diskutieren wir das Paradigma der Social Machine aus den Perspektiven der Informatik, der Wirtschaftsinformatik, der Soziologie und des Rechts, um Orientierungspunkte für seine Gestaltung zu identifizieren. Der Begriff ist in der Literatur jedoch bisher nicht abschließend definiert sondern nur durch Beispiele illustriert. In diesem Artikel stellen wir zunächst die folgende Definition zur Diskussion: Social Machines sind soziotechnische Systeme, in denen die Prozesse sozialer Interaktion hybrid zwischen menschlichen und maschinellen Akteuren ablaufen und teilweise algorithmisiert sind. Im Anschluss beleuchten wir drei aktuelle, sich gegenseitig bedingende Entwicklungen von Social Machines: die immer stärkere Verschmelzung von Sozialität und Maschine, die Vermessung von Nutzeraktivitäten als Grundstoff gesellschaftlichen Zusammenhalts und die zunehmende Algorithmisierung gesellschaftlicher Prozesse. Abschließend diskutieren wir, dass eine teilhabeorientierte, demokratischen Werten folgende Gestaltung von Social Machines die Perspektiven der Nutzungsakzeptanz, der gesellschaftlichen Akzeptabilität und der nachhaltigen Wirtschaftlichkeit adressieren und umsetzen muss. Unter Social Machines werden heute soziotechnische Systeme verstanden, die unter Verwendung von Web- und Plattformlösungen das Potenzial digitaler Technologien mit der Eigenlogik sozialer Interaktion, Organisation und Strukturbildung auf neue Weise zusammenführen. Entsprechende Experimente reichen von der globalen Volksenzyklopädie Wikipedia über neue Tools der politischen Willensbildung wie Liquid Democracy bis zu Crowdfunding-Plattformen. Es handelt sich um ein Paradigma gegenwärtiger soziotechnischer Gestaltung, das sich in einer Reihe von IT-Projekten niederschlägt. Geprägt wurde der Begriff von Tim Berners-Lee, dem Erfinder des World Wide Web: „Real life is and must be full of all kinds of social constraint – the very processes from which ‚society‘ arises. Computers can help if we use them to create abstract social machines on the Web: processes in which the people do the creative work and the machine does the administration“ [2, S. 172]. Allerdings zeigt die Praxis, dass sich Kreativität und Administration nicht so einfach auf Mensch und Maschine aufteilen lassen. Auch in aktuellen Projekten (etwa [14] und SOCIAMFootnote 1 [36]) kommt das Paradigmatische dieser Form digitaler Gesellschaftsgestaltung nicht klar zum Ausdruck; die Autoren verwenden stattdessen eine (nichtabschließende) Liste von Beispielen zur Begriffsabgrenzung."
author = "Gesellschaft für Informatik (GI)"
year_published = 2022
