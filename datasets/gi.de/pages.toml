["https://gi.de/meldung/auszeichnung-mint-freundliche-schulen-und-digitale-schulen-in-sachsen"]
title = "Auszeichnung „MINT-freundliche Schulen“ und „Digitale Schulen“ in Sachsen - Gesellschaft für Informatik e.V."
description = "Fünf Schulen aus Sachsen wurden heute in einer Onlineveranstaltung von unserem MINT-Vorstandsmitglied Prof. Dr. Hannes Federrath als „MINT-freundliche Schule“ ausgezeichnet. Davon wurde die Helmholtzschule-Oberschule der Stadt Leipzig das erste Mal und weitere vier Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus erhielt die Max-Klinger-Schule Leipzig erneut die Ehrung als „Digitale Schule“."
full_description = "Fünf Schulen aus Sachsen wurden heute in einer Onlineveranstaltung von unserem MINT-Vorstandsmitglied Prof. Dr. Hannes Federrath als „MINT-freundliche Schule“ ausgezeichnet. Davon wurde die Helmholtzschule-Oberschule der Stadt Leipzig das erste Mal und weitere vier Schulen wurden nach dreijähriger erfolgreicher MINT-Profilbildung erneut mit dem Signet „MINT-freundliche Schule“ geehrt. Darüber hinaus erhielt die Max-Klinger-Schule Leipzig erneut die Ehrung als „Digitale Schule“. Die Ehrung der „MINT-freundlichen Schulen“ in Sachsen steht unter der Schirmherrschaft des Kultusministeriums und der Kultusministerkonferenz (KMK), die Ehrung der „Digitalen Schulen“ steht unter der Schirmherrschaft der Beauftragten der Bundesregierung für Digitalisierung, Staatsministerin Dorothee Bär. Als “Digitale Schule” wurde es der Max-Klinger-Schule Leipzig durch einen Kriterienkatalog ermöglicht, eine Standortbestimmung sowie eine Selbsteinschätzung zum Thema „Digitalisierung“ vorzunehmen und Anregungen umzusetzen. Bei Vorliegen einer entsprechenden Profilbildung kann von einer digitalen Schule gesprochen werden. Der Kriterienkatalog „Digitale Schule“ umfasst fünf Module: 1. Pädagogik & Lernkulturen 2. Qualifizierung der Lehrkräfte 3. Regionale Vernetzung 4. Konzept und Verstetigung 5. Technik und Ausstattung. Die Module sind orientiert an der KMK-Strategie „Bildung in der digitalen Welt“ und wurden von Fachexpertinnen und Fachexperten sowie Wissenschaftlerinnen und Wissenschaftlern der o.g. Verbände entworfen. Die Ehrung „Digitale Schule“ ist wissenschaftlich basiert, verbandsneutral sowie unabhängig. Christian Piwarz, Kultusminister des Freistaats Sachsen: “Die Schülerinnen und Schüler von heute werden morgen auf eine ganz neue Arbeitswelt treffen. Künstliche Intelligenz, der Einsatz von mobilen Robotern, 3D-Werkzeugen oder Objekte virtueller Realität werden künftig noch viel stärker Einzug in berufliche Tätigkeitsfelder halten. Genau darauf bereiten die ausgezeichneten Schulen ihre Schüler vor.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2020
