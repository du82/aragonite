["https://gi.de/aktuelles/projekte/grand-challenges/world-wide-metaverse"]
title = "World Wide Metaverse - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Die Vision des Metaversums verspricht eine neue Stufe der digitalen Gesellschaft. Damit diese nicht nur ein kleiner Teil der Bevölkerung erreicht, müssen einige Herausforderungen bewältigt und eine ganze Menge an Anforderungen erfüllt werden. Zu Beginn noch belächelt, hat sich das Internet seit seiner Entstehung zu einem integralen Bestandteil unseres Lebens entwickelt. Während das Internet heute zwar allgegenwärtig ist und wir es über verschiedene Endgeräte nutzen können, geht das Metaverse deutlich darüber hinaus. Es ist nicht weniger als das Versprechen, dass der virtuelle Raum mit der physischen Realität verschmilzt. Unter Nutzung von Technologien wie Virtual Reality und Augmented Reality werden multimodale digitale Inhalte nahtlos in unser Leben integriert. Die Vision des Metaverse bietet das Potenzial, unser Leben fundamental zum Positiven hin zu verändern: klimafreundliche Team-, Mobile-, und Heimarbeit, bewussterer Konsum, und neue Freizeitaktivitäten sind nur einige der Vorteile. Um diese einer breiten Bevölkerungsschicht zur Verfügung zu stellen, sind jedoch drei zentrale Herausforderungen zu bewältigen: Erstens muss das Metaverse, ähnlich wie das Internet, interoperabel und skalierbar sein und eine Konsistenz wie auch die Persistenz der Inhalte ermöglichen. Hierfür ist es essenziell, offene Schnittstellen, Protokolle und Standards zu etablieren. Zweitens muss der Zugang multimodal, multisensorisch und barrierearm möglich sein. Eine einfache Übertragung bisheriger 2D-Inhalte in immersive Umgebungen ist unzureichend. Es erfordert neuartige Benutzungsschnittstellen, die nicht nur alle Sinne ansprechen, sondern mindestens so einfach nutzbar sind wie heutige Techniken im Internet. Drittens muss Informationssicherheit von Anfang an integriert sein. Die Architektur des Metaverse sollte daher bereits von Grund auf so konzipiert sein, dass sowohl Sicherheit als auch Privatsphäre integrale Bestandteile sind. Die Informatik als verantwortlich gestaltende Forschungs- und Anwendungsdisziplin kann und muss sich an der Bewältigung aller drei Herausforderungen aktiv beteiligen, um die Potenziale des Metaverse für unsere Gesellschaft nutzbar zu machen und damit die nächste Stufe unserer digitalen Gesellschaft einzuleiten."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
