title = "Über uns - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Als Netzwerk von Informatiker*innen setzen wir uns für eine Digitalisierung ein, die für alle funktioniert. Dabei arbeiten wir wissenschaftlich fundiert, suchen nach verbindenden Lösungen und bleiben immer offen für Neues. Gemeinsam treiben unsere Mitglieder aus Wissenschaft, Wirtschaft, Verwaltung und Zivilgesellschaft die Disziplin voran, stellen entscheidende Fragen und setzen immer wieder neue Impulse. Für eine gemeinwohlorientierte, inklusive und zukunftsweisende Informatik. Die Gesellschaft für Informatik e.V. (GI) ist mit mehr als 17.000 persönlichen und 250 korporativen Mitgliedern die größte Fachgesellschaft für Informatik im deutschsprachigen Raum und vertritt seit 1969 die Interessen der Informatiker*innen. Mit 14 Fachbereichen, über 30 aktiven Regionalgruppen und unzähligen Fachgruppen ist die GI Plattform und Sprachrohr für alle Disziplinen in der Informatik. Ob Studierende, Young Professional oder erfahrener Wissenschaftler – die Mitglieder der GI entwickeln ihre Disziplin gemeinsam mit anderen weiter. Sie eint das Ziel, die Interessen der Informatik und ihrer vielfältigen Disziplinen in Wissenschaft, Wirtschaft, Verwaltung, Zivilgesellschaft und Politik zu vertreten und einen interdisziplinären Austausch herzustellen. Sie treten für Freiheit, Toleranz, Wahrhaftigkeit und Würde in der Informatik ein und sind sich bewusst, dass die in der Informatik Tätigen wegen ihrer besonderen fachlichen Kompetenz für die Gestaltung des menschlichen Lebens sowie der natürlichen Umwelt in hohem Maße verantwortlich sind. So vielfältig unsere Mitglieder sind, so unterschiedlich sind die Gründe für eine Mitgliedschaft in der GI: Die Mitglieder der GI eint die Sicht auf Informatik als eine dynamische und zukunftsweisende Disziplin, die wir inhaltlich mitgestalten und weiterentwickeln. Lust, Teil dieses Netzwerks zu werden? Stellen Sie einen Antrag auf Mitgliedschaft. Wir freuen uns auf Sie! Auf unserer Webseite werden Cookies verwendet. Einige davon we