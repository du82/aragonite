["https://gi.de/meldung/multimedia-streaming-die-kunst-der-balance-zwischen-hoher-qualitaet-niedriger-latenz-und-grosser-teilnehmerzahl"]
title = "Multimedia-Streaming – Die Kunst der Balance zwischen hoher Qualität, niedriger Latenz und großer Teilnehmerzahl - Gesellschaft für Informatik e.V."
description = "Zusammenfassung: Das Ziel beim Multimedia-Streaming ist es, mitunter umfangreiche Datenmengen an möglichst viele Teilnehmer in beinahe Echtzeit zu übertragen. Als größte Hürde stellt sich dabei die Latenz heraus. Je niedriger sie ist, desto angenehmer fällt für die Zuschauer das Erlebnis aus. Sie summiert sich aber sehr schnell aufgrund vieler kleinerer Verzögerungen. Deshalb gilt es, zwischen Qualität, Teilnehmerzahl und Latenz die richtige Balance zu finden."
full_description = "Zusammenfassung: Das Ziel beim Multimedia-Streaming ist es, mitunter umfangreiche Datenmengen an möglichst viele Teilnehmer in beinahe Echtzeit zu übertragen. Als größte Hürde stellt sich dabei die Latenz heraus. Je niedriger sie ist, desto angenehmer fällt für die Zuschauer das Erlebnis aus. Sie summiert sich aber sehr schnell aufgrund vieler kleinerer Verzögerungen. Deshalb gilt es, zwischen Qualität, Teilnehmerzahl und Latenz die richtige Balance zu finden. Seit vielen Jahren verbinden sich Computerspieler über das Internet, um gemeinsam ihrer Spieleleidenschaft nachzugehen. Dabei nehmen sie gemeinsam an Massively Multiplayer Online Games teil, unterhalten sich in Echtzeit über Discord [1] und senden in einigen Fällen ihre Spielsitzungen in hoher Videoqualität (Auflösung 1080p/Full-HD, 60 Frames-Per-Second/FPS) an tausende von fremden Zuschauern als Twitch Streams [2] oder YouTube Live Events [3]. Aber wieso findet dabei die Kommunikation mit den Zuschauern immer nur verzögert mit Chat-Nachrichten statt? Seit der Pandemie machen wir auf der anderen Seite exzessiv Gebrauch von Zoom Meetings [4], Microsoft Teams Meetings [5] und ähnlichen Onlinekonferenzlösungen. Angenehm sind diese Besprechungen dann, wenn die Verzögerung (Latenz) gering ausfällt, also meist unter einer Sekunde bei der sprachlichen Interaktion bleibt. Man kann sich fast ins Wort fallen. Auch die Bildqualität soll möglichst gut sein. Die beste 4K-Webcam nützt jedoch überhaupt nichts, wenn das eigene Bild bei mehr als 2 Teilnehmern in einer Onlinekonferenz von den Lösungen nur in niedriger Auflösung von 480p übertragen wird. Gibt man dagegen statt der Webcam seinen Bildschirm frei, erzielt man durchaus höhere Auflösungen von mindestens 1080p. Die Bildrate des Videos sinkt dann aber wiederum auf abschreckende 5–10 Bilder pro Sekunde. Erhöht sich in Onlinekonferenzen dann noch die Teilnehmerzahl auf über 6–10 Personen, werden die Videos nur noch teilweise dargestellt. Mehr als 10 Personen dürfen ohnehin bei fast keiner Lösung aktiv präsentieren, sondern nur konsumieren. Und selbst 250–500 lediglich konsumierende Teilnehmer gelten weitläufig als Obergrenze."
