["https://gi.de/meldung/enter-scan-anzeige-ki-ueberwacht-private-kommunikation"]
title = "Im Fokus: Enter, Scan, Anzeige – KI überwacht private Kommunikation - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "2007 und 2008 gingen tausende Menschen gegen die in der EU geplante und zeitweilig in Deutschland verabschiedete Vorratsdatenspeicherung auf die Straße. Ein Merkmal und häufiger Kritikpunkt gegen die Vorratsdatenspeicherung ist die verdachtsunabhängige Überwachung: Überwacht wird nicht nur, wer Anlass zum Verdacht einer Rechtsverletzung gegeben hat, sondern zunächst einmal alle. Nun könnte nun das nächste Gesetz der EU bevorstehen, das alle Bürgerinnen und Bürger unter Generalverdacht stellen soll (heise). Im Juli dieses Jahres verabschiedete das EU-Parlament einen Gesetzesentwurf, der es Internetanbietern künftig erlaubt, verdachtsunabhängig und flächendeckend Nachrichten auf Anzeichen von Grooming (Wikipedia) und Kinderpornographie zu scannen. Hierzu werden unter anderem auch Algorithmen des maschinellen Lernens (KIs) verwendet, um Bilder, Videos oder Textnachrichten auf entsprechende bedenkliche Inhalte zu untersuchen. Sollte sich hieraus ein Verdacht ergeben, werden automatisiert relevante Informationen an die zuständigen Behörden weitergeleitet. Die Betroffenen werden hierüber jedoch nicht informiert. Derzeit wird an einem Folgegesetz gearbeitet, welches alle Dienstleister zu einer solchen Überwachung verpflichten soll. Zurzeit ist die Überwachung von Messenger-Diensten wie WhatsApp oder Signal technisch nicht möglich, da diese Ende-zu-Ende verschlüsselt werden. Eine diesbezügliche Überwachungspflicht könnte auch hier für Umstellungen sorgen. Entsprechend lohnt sich ein Blick in die aktuelle Rechtslage zur Überwachung von Messenger-Diensten. Die 2002 verabschiedete ePrivacy-Richtlinie (eigentlich Datenschutzrichtlinie für elektronische Kommunikation, europa.eu) regelt in Artikel 5 die Vertraulichkeit der Kommunikation von elektronischen Kommunikationskanälen. Hierbei wird zum Beispiel das Mithören, Abhören und Speichern von Nachrichten anderer Personen als der Nutzerinnen und Nutzer untersagt. Seit Dezember 2020 fallen laut heise-online auch „nummernunabhängige interpersonelle Kommunikationsdienste“ in den Bereich der ePrivacy-Richtlinie (heise). Ausnahmen, in denen Nachrichten dennoch abgefangen und überwacht werden dürfen, regelt der Artikel 15 Absatz 1 der ePrivacy-Richtlinie. So kann zum Beispiel für die Verfolgung von Straftaten hiervon eine Ausnahme gemacht werden, wenn dies in einer „demokratischen Gesellschaft notwendig, angemessen und verhältnismäßig” ist. Außerdem muss hierfür zunächst eine entsprechende Rechtsvorschrift verabschiedet werden. Genau hierum handelt es sich bei dem im Juli verabschiedeten Gesetzesentwurf. Das Gesetz (europa.eu) ist hierbei eine Zwischenlösung, deren alleiniger Zweck es ist, eine befristete und streng begrenzte Ausnahme von der Anwendbarkeit von Artikel 5 Absatz 1 und Artikel 6 der ePrivacy-Richtlinie zu schaffen. Der Vorschlag ermöglicht es Anbietern wie Facebook oder Microsoft, bis zur Annahme der angekündigten langfristigen Rechtsvorschriften weiter bestimmte Technik einzusetzen und ihre derzeitigen Tätigkeiten in dem Umfang fortzusetzen, der erforderlich ist, um sexuellen Missbrauch von Kindern im Internet aufzudecken und zu melden, sowie Material über sexuellen Kindesmissbrauch aus ihren Diensten zu entfernen. Außerdem läuft im EU-Parlament derzeit der Gesetzgebungsprozess für die sogenannte ePrivacy-Verordnung weiter, mit deren Wirkung die ePrivacy-Richtlinie aus 2002 aufgehoben und mit strengeren Regelungen erneuert werden soll."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
