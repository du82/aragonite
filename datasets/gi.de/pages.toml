full_description = "Die Agentur für Transfer und Innovation (DATI) hat das Potential, Förderlücken zu schließen. Die Informatik könnte dabei eine Schlüsselrolle spielen. DATI ist ein vieldiskutiertes innovationspolitisches Projekt der Bundesregierung. In seinem letzten Entwurf skizziert das Bundesministerium für Bildung und Forschung (BMBF) DATI als eine Agentur, die vor allem die Hochschulen für Angewandte Wissenschaften (HAW) in den Blick nimmt. Um die HAW sollen regionale Ökosysteme entstehen – ein Netzwerk aus verschiedenen Akteuren, das bestehende Innovationen weiterentwickelt und vorantreibt. Um DATI gab und gibt es viele Diskussionen. Kritisiert wird unter anderem, dass Ziele und Strukturen zu eng seien und das Konzept weiterer Ausarbeitung bedürfe. Aufgrund dessen wurden die geplanten Mittel für den Aufbau der Agentur zunächst gesperrt. Der GI Policy Brief Nr. 2, 2022/07 unterbreitet konkrete Vorschläge, wie die Idee der DATI im Sinne einer innovativen Forschungspolitik weiterentwickelt werden kann und diskutiert Möglichkeiten und Chancen, welche die Informatik einer solchen Agentur bietet. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
