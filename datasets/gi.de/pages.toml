["https://gi.de/netzwerk/hochschulen/botschafterinnen"]
title = "Botschafterinnen und Botschafter - Gesellschaft für Informatik e.V."
description = "Langfassung"
full_description = "GI-Botschafterinnen und Botschafter (vormals Vertrauensdozentinnen und Dozenten) repräsentieren die GI an ihrer jeweiligen Hochschule. Ihre Tätigkeit dient dazu, den Bekannheitsgrad der GI in ihrem Wirkungsbereich zu erhöhen und die betreffenden Fakultäten/Fachbereiche in GI-Belangen zu unterstützen. Ihre Tätigkeit dient dem Ziel, einerseits die Bindung der Mitglieder in der Hochschule zu erhöhen, andererseits neue Mitglieder unter den Studierenden und dem Lehrpersonal zu gewinnen. Nunmehr wird die GI an mehr als 150 Hochschulen in dieser Form vertreten. Außer einer Vielzahl von Informationen haben GI-Botschafterinnen und Botschafter die Gelegenheit, Ihre Studierenden an vielen interessante Veranstaltungen, wie z.B. am informatiCup oder den DevCamps, zu beteiligen. Nicht zuletzt gehören sie damit zu einem Netzwerk von Hochschullehrerinnen und -lehrern bundesweit aus den verschiedensten Hochschultypen. Die GI-Hochschullehrerinnen und -lehrer vertreten bildungspolitische Zielsetzungen der GI in ihren Hochschulgremien und arbeiten mit entsprechenden GI-Gliederungen zusammen. Insbesondere mit den Beiräten für Hochschulleherinnen und Lehrer, den Beirat für die wissenschaftlichen Mitarbeiterinnen und Mitarbeiter sowie den Beirat für Studierende und Auzubildende. Auch eine Zusammenarbeit mit den Regionalgruppen am Hochschulstandort ist wünschenswert. An einigen Hochschulen werden die GI-Botschafterinnen und Botschafter von GI-Hochschulgruppen unterstützt, die ebenfalls als Ansprechpartner in den Hochschulen fungieren. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert."
