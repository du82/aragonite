["https://gi.de/ueber-uns/freiwilligendienst"]
title = "Freiwilligendienst - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Du interessierst dich für einen Freiwilligendienst bei der GI? Hier werden alle deine Fragen beantwortet! „Die GI ist eine gemeinnützige Fachgesellschaft, die sich zum Ziel gesetzt hat, die Informatik in Deutschland zu fördern.“ Was heißt das jetzt für dich? Die Geschäftsstelle in Berlin beschäftigt sich vor allem mit verschiedenen Projekten mit Informatik-Bezug. Mit dabei: Die HackTheSummer-Academy, FAQ Informatik, NetDGT, Werde Informatiklehrer*in und viele mehr. Diese Projekte sollen über informatische Themen aufklären, Informatiker*innen in Deutschland und ihre Interessen vertreten oder auch mehr Menschen für die Informatik begeistern. Die Geschäftsstelle in Berlin führt verschiedene Projekte durch, die von Stiftungen und Ministerien gefördert werden. Schwerpunkte sind die Themenfelder Künstliche Intelligenz, Digitalisierung und Nachhaltigkeit, digitale Bildung und Datenkompetenz. Mit dabei: Die Allianz für informatische Bildung, das Civic Data Lab, NetDGT, CDEC. In diesen Projekten werden zum Beispiel Hackathons oder Workshops organisiert, kurze FIlme gedreht oder auch mal große Konferenzen veranstaltet. Deine Arbeitszeiten sind relativ flexibel; die Kernarbeitszeit liegt zwischen 10 und 17 Uhr. Du kannst dich meistens frei entscheiden, ob du im Home Office oder vor Ort im Büro in Berlin Mitte arbeiten möchtest – denn für die meisten Tätigkeiten, die dir im Alltag deines Freiwilligendienstes begegnen, brauchst du nur deinen Laptop. Zu deinen vielseitigen Aufgaben gehören beispielsweise das Schreiben von Meldungen, das Erstellen von Social Media Posts und die Bearbeitung von Webseiten. Oder auch mal das Basteln einer Geburtstagskarte für eine Kollegin. Außerdem bist du oft als Unterstützung bei Events der GI dabei, um in der Planung mitzuwirken oder später vor Ort einen glatten Ablauf zu gewährleisten. Zu den spannenden Veranstaltungen, an denen Freiwillige der GI mitgearbeitet haben, gehören zum Beispiel der Tech Crush 2024 der HackTheSummer-Academy oder die Jahrestagung der Fachgesellschaft."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
