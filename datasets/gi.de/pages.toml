["https://gi.de/themen/beitrag/interview-aurelia-kusumastuti"]
title = "„Wir brauchen Diskussionen auf Augenhöhe” - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Aurelia Kusumastuti ist Studentin der Informatik und hat 2023 am Common Grounds Forum teilgenommen, das die GI veranstaltet hat. Im Interview spricht sie über die Forderungen der jungen Generation an die etablierte Digitalpolitik und wie junge Menschen dort mehr gehört werden. Ich stehe am Ende meines Masterstudiums in Informatik, aber man braucht keinen Hochschulabschluss in Informatik, um einzusehen, dass die Digitalpolitik in Deutschland verbesserungswürdig ist. Wir sehen, wie in sozialen Medien Desinformation für bare Münze genommen werden. Vor allem in Zeiten der generativen KI ist es zu einfach geworden, glaubwürdige gefälschte Inhalte zu produzieren. Außerdem sehen wir, wie es am Fach Informatik in Schulen mangelt, was dazu führt, dass Digitalkompetenz vom Elternhaus abhängt und von Chancengleichheit nicht mehr die Rede sein kann. Ich wollte mich beim CGF mit anderen jungen Menschen in die Digitalpolitik in Deutschland einmischen und von der Politik und der Industrie nachhaltige Digitalisierung fordern. Du warst beim Thementrack ökologische Nachhaltigkeit und Digitalisierung mit dabei. Welche der dort entwickelten Forderungen liegt dir besonders am Herzen? Mir liegt die Kreislaufwirtschaft am Herzen, sowohl von Software als auch von Hardware. Oft werden zum Beispiel Handys und Tablets unbenutzbar, obwohl die Hardware an sich noch in Ordnung ist. Der Grund: Softwarebetreiber*innen liefern keine (Sicherheits-)Updates mehr für ‚alte Geräte‘. Oder Haushaltgeräte, die seit Jahrzenten ganz normal laufen, können plötzlich beim neuen Modell erst dann laufen, wenn man spezialisierte Software darauf lädt. Und an ihrem Lebensende werden diese Geräte teilweise als Elektroschrott einfach woandershin verschifft. Das Ganze ist offensichtlich ein Problem. Darum fordern wir unter anderem, dass Softwarebetreiber*innen Sicherheitsupdates zehn Jahre und funktionale Updates sieben Jahre zur Verfügung stellen. Zudem sollen Hersteller*innen von Haushaltsgeräten garantieren, dass ihre Geräte ohne spezialisierte Software genutzt werden können. Letztlich sollen Firmen sich bis 2030 verpflichten, 100 Prozent der entsorgten Geräte zu recyceln."
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
