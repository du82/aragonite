["https://gi.de/datascience"]
title = 'AK "Data Science/Data Literacy" - Gesellschaft für Informatik e.V.'
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Der Begriff Data Science stammt aus den Anfängen der Datenhaltung und -analyse, die bis in die 1960er Jahre zurückgehen. Mit der zunehmenden Bedeutung von „Big Data“ rückte die Wissenschaft der Daten weiter in den Fokus. Der Schwerpunkt der Data Science liegt dabei nicht bei den Daten selbst, sondern bei der Art und Weise wie die Daten verarbeitet, aufbereitet und analysiert werden. Data Science beschäftigt sich mit einer zweckorientierten Datenanalyse und die systematische Generierung von Entscheidungshilfen und -grundlagen, um Wettbewerbsvorteile erzielen zu können. Data Literacy ist die Fähigkeit des planvollen Umgangs mit Daten. In Ergänzung zu spezialisierten Fachkräften – den Data Scientists – liegt der Fokus auf der bedarfsgerechten, Disziplinen übergreifendem Know-how, um datengestützt arbeiten und entscheiden können. Im Unternehmensumfeld ist das Thema häufig im Bereich Business Intelligence angesiedelt. IT-Unternehmen, Banken und Beratungsfirmen suchen die auf große Datenmengen spezialisierten Analysten genauso wie Autohersteller, Versicherungen und Verwaltungsbehörden. Die Unternehmensberatung McKinsey geht für 2017 von 150 000 offenen Stellen allein in den Vereinigten Staaten aus. Auch in Deutschland ist der Bedarf groß. Ein Geschäftsüberblick der Universität Harvard kürte den „Data Scientist“ sogar zum „attraktivsten Beruf des 21. Jahrhunderts“. In der Wissenschaft beschäftigt sich Data Science mit unterschiedlichen Wissenschaftsbereichen und können daher verschiedene akademische Hintergründe haben: Informatik, Physik, Statistik, Mathematik oder Wirtschaftswissenschaften, einschließlich des maschinellen Lernens, des statistischen Lernens, der Programmierung, der Datentechnik, der Mustererkennung, der Prognostik, der Modellierung von Unsicherheiten und der Datenlagerung. Mittlerweile existieren eine Reihe von Data-Science-Bachelor- oder -Master-Studiengänge. Die interdisziplinäre Task Force „Data Science“ unter der Leitung des ehemaligen Präsidenten Prof. Dr.-Ing Peter Liggesmeyer will der Frage nachgehen, was einen Data Scientist ausmacht und was ein Datenwissenschaftler / eine Datenwissenschaftlerin können muss? Was steckt hinter diesem Berufsbild und mit welcher Ausbildung wird man zum Datenwissenschaftler? Welche Kompetenzen benötigt ein Data Scientist und welche Anforderungen muss dieser erfüllen? Wie definieren Universitäten und Hochschulen das Profil eines Data Scientist und wie setzen diese es um? Welche Anforderungen gibt es seitens der Wirtschaft an die Datenwissenschaftler des 21. Jahrhunderts?"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
