title = "Edge AI - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "KI‐Technologien in der Nähe von Datenquellen einzusetzen, kann Unternehmen und Personen Kontrolle über ihre Daten zurückgeben, erfordert aber den Aufbau komplexer Systeme. Diese Grand Challenge zeigt den – nicht unbedingt leichten – Weg zur individuellen Edge AI. Künstliche Intelligenz (KI) bestimmt zunehmend unseren beruflichen und privaten Alltag. Dennoch sind KI und ihre bekannteste technische Umsetzung, das maschinelle Lernen (ML), stetiger Kritik ausgesetzt. Insbesondere wird kritisiert, dass das Training von ML‐Modellen häufig auf zentralisierten Datenbeständen in der Cloud stattfindet. Dies impliziert, dass Nutzer*innen ihre Daten zunächst in die Cloud senden müssen und damit die Kontrolle über die eigenen Daten abgeben. Sowohl Unternehmen als auch Privatpersonen sind jedoch aus guten Gründen häufig nicht bereit, dies zu tun. Da das Trainieren von ML‐Modellen in vielen Fällen große Datenmengen benötigt, kann der notwendige Datentransfer zu weiteren Problemen führen. Dies ist insbesondere dann der Fall, wenn Ergebnisse in Echtzeit benötigt werden oder ein Unternehmen beziehungsweise eine Privatperson zwar Daten zur Verfügung stellen möchte, jedoch nicht über eine entsprechende Internetanbindung verfügt. Aus diesen Gründen hat das Konzept der Edge‐KI, also der Anwendung von KI‐Technologien und insbesondere ML am Rande des Netzes, in letzter Zeit viel Aufmerksamkeit erlangt. Edge‐KI basiert auf der Idee, dass neuartige KI‐Technologien mittels Edge‐Computing auf geeigneten lokalen Geräten in der Nähe von Datenquellen eingesetzt werden können, sodass Trainingsdaten nicht zentral, zum Beispiel in der Cloud, gesammelt werden müssen. Dies führt zu einem dezentraleren Ansatz bei der Anwendung von KI. Grundlegende Konzepte der Edge‐KI werden heute bereits eingesetzt. Dennoch müssen zunächst noch eine Vielzahl von Forschungsfragestellungen beantwortet werden, bevor die Technologie breite Anwendung finden kann. Diese reichen von speziell angepassten ML‐Algorithmen für leichtgewichtige IT‐Umgebungen über nachvollziehbare KI bis hin zur Benutzerfreundlichkeit."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
