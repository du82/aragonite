full_description = 'Die Gesellschaft für Informatik e.V. (GI) ist die größte Fachgesellschaft für Informatik im deutschsprachigen Raum. Sie vertritt die Interessen der Informatikerinnen und Informatiker in Wissenschaft, Wirtschaft, öffentlicher Verwaltung, Gesellschaft und Politik. Werden Sie Teil dieses lebendigen Netzwerks! Breites Angebot von Fachzeitschriften renommierter Verlage, die die Informatik in ihrer Breite und Tiefe abdecken. Viele Fachgruppen bieten zusätzliche Leistungen, die sich zur Basismitgliedschaft addieren. Beitritt in weitere Fachgruppen ist auch im Mitgliederbereich "Meine GI" möglich. Hinweis: Um den jeweiligen Antrag am Bildschirm ausfüllen zu können, speichern Sie diesen bitte zunächst lokal auf Ihrem Rechner und öffnen Sie ihn dann mit dem Adobe Reader. Assoziierte Mitglieder können ohne persönliche GI-Mitgliedschaft (nur) einer Fachgruppe beitreten und haben hier aktives Wahlrecht. Die Jahresbeiträge sind höher als die Beiträge für persönliche Mitglieder. Hinweis: Um den Antrag am Bildschirm ausfüllen zu können, speichern Sie diesen bitte zunächst lokal auf Ihrem Rechner und öffnen Sie ihn dann mit dem Adobe Reader. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern.'
