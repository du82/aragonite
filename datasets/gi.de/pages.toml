["https://gi.de/en/aktuelles/meldungen/detail/digitale-gewalt-gi-bezieht-stellung-zu-gesetzesentwurf"]
title = "Digitale Gewalt: GI bezieht Stellung zu Gesetzesentwurf - Gesellschaft für Informatik e.V."
description = "Gerade Frauen und marginalisierte Gruppen sind vermehrt von Mobbing, Cyberstalking oder Hasskommentaren betroffen. Mit einem neuen Gesetzesentwurf will das Bundesjustizministerium Betroffenen von digitaler Gewalt mehr unterstützen. Die Gesellschaft für Informatik begrüßt die Bemühungen, sieht aber Nachbesserungsbedarf."
full_description = "Gerade Frauen und marginalisierte Gruppen sind vermehrt von Mobbing, Cyberstalking oder Hasskommentaren betroffen. Mit einem neuen Gesetzesentwurf will das Bundesjustizministerium Betroffene von digitaler Gewalt mehr unterstützen. Die Gesellschaft für Informatik begrüßt die Bemühungen, sieht aber Nachbesserungsbedarf. Mit der wachsenden Digitalisierung und einer steigenden Nutzung sozialer Medien steigt auch digitale Gewalt immer weiter an. Besonders Frauen erleben häufiger digitale Gewalt. Betroffene schränken oft ihr digitales Verhalten ein, oder engagieren sich weniger politisch. Ein Gesetzesentwurf des Bundesministeriums für Justiz soll es Betroffenen nun erleichtern, ihre Rechte bei Erfahrungen von digitaler Gewalt gerichtlich durchzusetzen. Dazu sollen Auskunftsrechte von Betroffenen verstärkt werden und durch schnelle Speicherung einschlägiger Inhalte soll ein Datenverlust verhindert werden. Ebenso sieht der Entwurf Account-Sperren vor, um zukünftige Rechtsverletzungen zu verhindern. Die GI begrüßt die Initiative des Entwurfs, die Rechte Betroffener durch den Gesetzesentwurf zu stärken, weist aber darauf hin, dass der Regelungsinhalt sich weniger mit der Bekämpfung digitaler Gewalt befasst als vielmehr mit einer Verbesserung zivilrechtlicher Auskunftsverfahren und Klageerleichterungen. Selcan Ipek-Ugay, Mitglied der Fachgruppe „Frauen in der Informatik“: „Digitale Gewalt findet im virtuellen Raum statt, hat aber reale Konsequenzen. Ein wirksames Gesetz muss diesen Dualismus erkennen und Antworten bieten, die sowohl die technischen Möglichkeiten ausschöpfen, als auch die gesellschaftlichen Folgen adressieren.“ Die GI unterstützt die Definition „relevanter Dienstanbieter“, die der Entwurf vorsieht, verweist gleichzeitig aber auf das sich schnell wandelnde Angebot an technischen Plattformen. Die Definitionsmerkmale müssen daher regelmäßig überprüft und bei Bedarf überarbeitet werden. Gleichermaßen stellt sich die Frage, ob die angestrebten Maßnahmen wie Accountsperren, beispielsweise in Stalkingfällen, ausreichend sind, und ob es genügend Fachstellen mit geschultem Personal gibt, die Fälle erfassen und bearbeiten können."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
clearnet = "https://gi.de/en/aktuelles/meldungen/detail/digitale-gewalt-gi-bezieht-stellung-zu-gesetzesentwurf"
