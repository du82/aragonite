full_description = 'Die Teilnahmedaten am Informatik-Biber 2011 sind nun offiziell: 155.419 Schülerinnen und Schüler aus 977 deutschen Schulen beteiligten sich an diesem größten Informatik-Wettbewerb, der in zahlreichen Ländern Europas stattfindet. Das sind über 30% mehr als im Vorjahr und damit ein erneuter Teilnahme-Rekord. Die meisten Teilnehmenden stellte das Leibniz-Gymnasium aus Östringen bei Heidelberg: Innerhalb der Biber-Woche (7.-11. November) bearbeiteten dort 1158 Mädchen und Jungen die Biber-Aufgaben im Online-System des Wettbewerbs. Insgesamt gelang es an über 100 Schulen den verantwortlichen Lehrkräften, mindestens 400 Jugendliche zur Teilnahme zu motivieren und Teilnahmemöglichkeit an den Schulcomputern zu organisieren. Als Breitenwettbewerb verlangt der Informatik-Biber keine Vorkenntnisse und stellt grundlegende Informatik-Kompetenzen wie logisches und strukturelles Denken in den Vordergrund. Hier sind auch Mädchen mit Begeisterung dabei: Insgesamt waren 43% der Beteiligten weiblich; bei den Jüngeren (Klassenstufen 5 bis 8) liegt der Mädchenanteil nur knapp unter 50%. Die Teilnehmerinnen und Teilnehmer am Informatik-Biber kommen aus allen Bundesländern und aus deutschen Schulen in Polen, Italien und Japan. Mit 43.136 Teilnahmen ist Bayern absolut am stärksten vertreten; relativ zur Gesamtschülerzahl wurde in Mecklenburg-Vorpommern am meisten gebibert, knapp dahinter liegt Sachsen. Dies sind auch die drei Bundesländer, in denen das Fach Informatik mit einem Pflichtanteil unterrichtet wird. Der Informatik-Biber wird von der Initiative BWINF ("Bundesweit Informatiknachwuchs fördern") veranstaltet. Er ist die deutsche Beteiligung am internationalen "Bebras International Contest on Informatics and Computer Fluency", der 2004 in Litauen gestartet wurde. In diesem Jahr waren weit über 300.000 Kinder und Jugendliche weltweit an Bebras-Wettbewerben in rund 20 Ländern beteiligt. Träger von BWINF und damit auch des Informatik-Biber sind die Gesellschaft für Informatik e.V. (GI), der Fraunhofer-Verbund IuK-Technologie und das Max-Planck-Institut für Informatik. Wie alle zentralen BWINF-Aktivitäten wird der Informatik-Biber vom Bundesministerium für Bildung und Forschung gefördert. Weitere BWINF-Projekte sind der Bundeswettbewerb Informatik, das Auswahlverfahren für das deutsche Team bei der Internationalen Informatik-Olympiade (IOI) und das Jugendportal einstieg-informatik.de.'
author = "Gesellschaft für Informatik (GI)"
year_published = 2011
