["https://gi.de/meldung/grand-challenges-2025"]
title = "Grand Challenges 2025: Vor diesen Herausforderungen steht die Informatik - Gesellschaft für Informatik e.V."
description = "Eine Initiative der Gesellschaft für Informatik e.V. wagt den Blick in die Zukunft: Was sind die großen Herausforderungen, vor denen die Disziplin in kommenden Jahren stehen wird? Unter zahlreichen Einreichungen hat die Jury fünf ausgewählt. Von Edge AI bis Metaverse machen sie deutlich, wie weitreichend die Konsequenzen dieser Herausforderungen sein können – und wie wichtig es ist, entsprechende Lösungen zu entwickeln."
full_description = "Eine Initiative der Gesellschaft für Informatik e.V. wagt den Blick in die Zukunft: Was sind die großen Herausforderungen, vor denen die Disziplin in kommenden Jahren stehen wird? Unter zahlreichen Einreichungen hat die Jury fünf ausgewählt. Von Edge AI bis Metaverse machen sie deutlich, wie weitreichend die Konsequenzen dieser Herausforderungen sein können – und wie wichtig es ist, entsprechende Lösungen zu entwickeln. Berlin, 5. Februar 2025 | Die Informatik muss sich zuallererst um die von der Informatik selbst geschaffenen Probleme kümmern. Mit diesem Grundgedanken hat die GI bereits im Jahr 2014 fünf große Herausforderungen der Informatik identifiziert, die es in Zukunft zu bewältigen gibt. Nun ist die zweite Runde der Initiative abgeschlossen: In einem strukturierten Verfahren konnten Mitglieder sowie Gliederungen der Gesellschaft für Informatik (GI) einreichen, welche Herausforderungen sie für die wichtigsten halten, und sich für deren Aufnahme in die „Grand Challenges der Informatik 2025“ einsetzen. Fünf hat die Jury ausgewählt: Sie drehen sich um Edge AI, Selbstbestimmung in der digitalen Gesellschaft, das Internet of Everything, vollautomatisiertes Software-Engineering sowie das World Wide Metaverse. Prof. Dr. Lars Grunske, Sprecher der Jury: „Kaum eine Disziplin entwickelt sich so rasant wie die Informatik. Umso wichtiger ist es, weiter vorauszuschauen als nur bis zur nächsten Quartalsabrechnung. Auch wenn einige der Inhalte aktuell noch wie Science-Fiction klingen, könnten sie bereits in wenigen Jahren Teil unserer Realität sein. Die Grand Challenges sollen helfen, diesen Weitblick zu behalten – und schon jetzt Lösungen anzustoßen, die uns die Chance bieten, mit dem Tempo dieser Entwicklungen mitzuhalten.“ Die Zukunft ist vernetzt: Doch erfordert es noch viele Anstrengungen, Anwendungen aus Industrie 4.0, virtuellen Realitäten, vernetztem Fahren oder Telemedizin erfolgreich umzusetzen sowie große Datenmengen effizient und resilient zu erheben, zu übertragen und zu verarbeiten."
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
clearnet = "https://gi.de/meldung/grand-challenges-2025"
