["https://gi.de/meldung/software-engineering"]
title = "Software Engineering - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Der Software-Engineering-Preis wird seit 1992 vergeben, bis 2018 von der Ernst-Denert-Stiftung für Software-Engineering, neuerdings vom GI-Fachbereich Softwaretechnik, finanziert von der Gerlind & Ernst-Denert-Stiftung. Dieser Text ist das Geleitwort für den Band „Ernst Denert Award for Software Engineering 2019“, in dem die Preiskandidaten ihre Arbeiten vorstellen. „What we need, is software engineering“, sagte F.L. Bauer 1968 und organisierte die Konferenz in Garmisch, die unser Fach begründete. Nachzulesen in seinem Bericht über diese Konferenz im Informatik-Spektrum 25 Jahre danach: Verärgert darüber, daß am Ende nicht mehr als ein weiteres rein wissenschaftliches Projekt herauskommen könnte, bemerkte ich eines Tages: „The whole trouble comes from the fact that there is so much tinkering with software. It is not made in a clean fabrication process, which it should be.“ Als ich feststellte, daß dies einige meiner Kollegen schockierte, setzte ich mit dem Ausspruch nach: „What we need, is software engineering.“ Das schlug ein. (Zitiert nach [1]) The phrase “software engineering” was deliberately chosen as being provocative, in implying the need for software manufacture to be based on the types of theoretical foundations and practical disciplines, that are traditional in the established branches of engineering. Softwareentwicklung sollte also eine Ingenieursdisziplin werden mit systematischer Arbeitsweise, etwa dem Schema folgend Wie es einen Bauplan für ein Haus und eine Konstruktionszeichnung für eine Maschine braucht, bedarf ein Softwaresystem einer Architektur. Softwarearchitektur ist die Königsdisziplin des Software Engineering. Sie befasst sich mit der Gestaltung von Softwaresystemen im Ganzen, mit ihrer fachlichen Funktionalität und den Schnittstellen zur Außenwelt sowie der inneren Struktur im Großen wie im Kleinen. Bei der Gestaltung im Großen geht es um den Aufbau eines Systems aus Modulen, deren Interaktion in ausführbaren Prozessen und um die Verteilung des Systems auf Hardwarekomponenten. Im Kleinen geht es um die Gestaltung einzelner Module: um ihre Außensicht einerseits, d. h. um ihre Schnittstelle zu anderen Modulen, und um ihre innere Struktur andererseits, also darum, mit welchen Funktionen sie auf welchen Daten operieren."
author = "Gesellschaft für Informatik (GI)"
