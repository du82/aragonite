full_description = "Deutschland steht vor der Gefahr, zur „Digitalen Kolonie” zu werden. Die zunehmende Abhängigkeit von großen Technologieanbietern bedroht unsere digitale Souveränität sowie wirtschaftliche und gesellschaftliche Stabilität. Auch die GI-Jahrestagung 2024 wird sich mit dieser zentralen Herausforderung auseinandersetzen. Digitale Kolonie. Ja, sehr geehrte Leserinnen und Leser, Sie haben richtig gelesen: „DIGITALE KOLONIE“, ein Begriff, der wie ein großer, unsichtbarer Elefant im Raum steht. Fast alle wissen, dass er da ist, viele versuchen, ihn zu ignorieren. Inzwischen warnt sogar Bitkom-Präsident Ralf Wintergerst: „Wir dürfen keine digitale Kolonie werden“ (rnd.de). Das Präsidium der Gesellschaft für Informatik e.V. hat im Juni beschlossen, einen Präsidiums-Arbeitskreis „Digitale Souveränität“ einzurichten, der sich mit diesem Thema beschäftigt. Die GI Jahrestagung 2024, Motto „Lock-in or log out? Wie Digitale Souveränität gelingt”, wird sich ebenfalls mit dieser gesellschaftlichen Herausforderung befassen (gi.de). Ohne Digitale Souveränität keine Zukunft für unsere Gesellschaft! Im Folgenden werden einige Fakten vorgestellt, die die besorgniserregende Entwicklung verdeutlichen, und Lösungsansätze zur Diskussion gestellt. Kommt die zunehmende Digitalisierung in erster Linie den digitalen Monopolen zugute und führt sie zu einer Verstärkung unserer digitalen Abhängigkeit? Um keine Missverständnisse aufkommen zu lassen: Ich bin ein überzeugter Befürworter der Digitalisierung zum Nutzen von Wirtschaft und Gesellschaft und versuche sie seit Jahrzehnten mit großem persönlichen Engagement voranzutreiben. Wir müssen aber aufpassen, dass wir uns nicht selbst den Ast absägen, auf dem wir sitzen, indem wir die Trends und Gefahren nicht ausreichend berücksichtigen. Die Digitalisierung ist kein Selbstzweck. Sie muss der Gesellschaft dienen und darf weder unsere Rechte auf Informationsfreiheit einschränken noch uns in Abhängigkeiten führen, die erst unsere digitale Bewegungsfreiheit, dann die Wertschöpfung unserer Wirtschaft und schließlich unsere gesellschaftlichen Werte bedeutungslos werden lässt."
author = "Gesellschaft für Informatik (GI)"
year_published = 2024
