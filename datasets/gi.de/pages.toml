["https://gi.de/meldung/informatik-2018-retrospektiv-ki-ein-bestimmendes-thema"]
title = "INFORMATIK 2018 Retrospektiv: KI ein bestimmendes Thema - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Welche Auswirkungen die Künstliche Intelligenz in Zukunft auf unsere Lebens- und Arbeitswelt haben wird, war eine der zentralen Fragen auf der INFORMATIK 2018, der Jahrestagung der GI. Prof. Dr. Hannes Federrath, Präsident der Gesellschaft für Informatik sagt dazu im Deutschlandfunk: „Wir glauben, dass die Informatik inzwischen in so viele Lebensbereiche hinein reicht, dass wir eigentlich nicht nur als Fachleute über das Thema sprechen können, sondern wir müssen eben auch in angrenzende Bereiche gehen. Und dann spielen eben Fragen von Industrialisierung, Robotern, die eben uns die Arbeit wegnehmen könnten, aber auch die Chancen auf der anderen Seite eine große Rolle. Und wenn ich sehe, dass etwa ethische Aspekte auch in anderen Bereichen mehr und mehr eine Rolle spielen, dann haben wir das natürlich auch in unserem Programm.“ Weitere Stimmen von Experten zu diesem Thema, die im Rahmen der INFORMATIK 2018 in Berlin gesammelt wurden, sind nun online nachsehbar. Anlässlich des Wissenschaftsjahres 2019 „Künstliche Intelligenz“ des Bundesministeriums für Bildung und Forschung (BMBF) haben drei Expertinnen sich aktuellen Fragen gestellt: Alle weiteren Expertenfragen und Aufzeichnungen der Vorträge und Diskussionen sind auf dem YouTube-Kanal „Wir sind Informatik“ der GI und auf der Seite der Jahrestagung https://informatik2018.gi.de/ zu finden. Die nächste GI-Jahrestagung findet vom 23. – 26. September 2019 an der Universität Kassel statt und feiert das 50-jährige Bestehen der Gesellschaft für Informatik. Das Leitthema der Tagung ist „50 Jahre Gesellschaft für Informatik – Informatik für Gesellschaft“. Weitere Informationen unter https://informatik2019.de. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
author = "Gesellschaft für Informatik (GI)"
year_published = 2019
