["https://gi.de/grand-challenges"]
title = "Grand-Challenges 2025 - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Kaum eine Disziplin entwickelt sich so rasant wie die Informatik. Die Initiative Grand Challenges wagt trotzdem den Blick in die Zukunft: Was sind die großen Herausforderungen, deren Lösung einen deutlich spürbaren Fortschritt in ökonomischer, sozialer oder gesellschaftlicher Hinsicht für unser aller Leben bedeutet? Die Zukunft ist vernetzt: Durch die Vernetzung so ziemlich aller Elemente unseres Alltags sowie der Verschmelzung physischer und virtueller Welten nimmt die Bedeutung des Internets in Zukunft weiter zu. Es wird aber konzertierte Anstrengungen erfordern, Anwendungen aus Industrie 4.0, Smart Cities, Smart Grid, virtuellen Realitäten, vernetztem Fahren oder Telemedizin erfolgreich umzusetzen sowie große Datenmengen effizient und resilient zu erheben, zu übertragen und zu verarbeiten. Das Training von KI-Modellen ist extrem ressourcenaufwendig und setzt in vielen Fällen sehr große Datenmengen voraus. Dies fördert die Entstehung natürlicher Monopole, da große Unternehmen mit großen Datenbeständen und eigenen Rechenzentren im Vorteil sind. Edge AI ermöglicht es, KI-Modelle am Rand des Netzes und damit direkt da wo die Daten anfallen verteilt zu trainieren und auszuführen. Dies führt jedoch zu neuen Forschungsfragen, um die Komplexität von Edge AI-Systemen handhabbar zu machen und sichere Edge AI-Systeme zu entwickeln. Die zunehmende Flut an Daten und deren systematische Verwertung kann Menschen in vielen Bereichen unterstützen, aber auch ihre Selbstbestimmung gefährden. Daher reicht es nicht mehr, auf die qualitativ neuen Herausforderungen durch KI und ihre Folgen für Mensch und Gesellschaft nur zu reagieren. Um die Selbstbestimmung der Nutzenden zu bewahren, ihre kritische Kompetenz zu stärken und gleichzeitig datengetriebene Technologien weiterzuentwickeln, brauchen wir eine sozialnützliche Technikgestaltung. Software Engineering ist ein ideales Anwendungsgebiet für die KI-basierte Automatisierung. Wie aber können wir die technische Entwicklung so kanalisieren, dass die Gesellschaft nur die gewünschten Auswirkungen erfährt? Dazu gehört es, große, komplexe Software verlässlich mit vorhersagbaren Qualitätseigenschaften zu erzeugen – aber auch ethisch zu reflektieren, was nicht automatisiert werden darf."
