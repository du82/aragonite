["https://gi.de/meldung/informatik-2021-informatik-und-nachhaltigkeit"]
title = "INFORMATIK 2021 - Informatik und Nachhaltigkeit   - Gesellschaft für Informatik e.V."
description = "Der Vorstand der Gesellschaft für Informatik (GI) will Nachhaltigkeitsfragen noch stärker in den Fokus der Arbeit der gesamten Fachgesellschaft rücken und hat deshalb beschlossen, als Auftakt zu einem umfassenderen Prozess die nächste Jahrestagung, die „INFORMATIK 2021“ in Berlin, unter das Leitthema „Informatik und Nachhaltigkeit“ zu stellen. Ein Beitrag von Ulrike Lucke, Vize-Präsidentin GI."
full_description = "Der Vorstand der Gesellschaft für Informatik (GI) will Nachhaltigkeitsfragen noch stärker in den Fokus der Arbeit der gesamten Fachgesellschaft rücken und hat deshalb beschlossen, als Auftakt zu einem umfassenderen Prozess die nächste Jahrestagung, die „INFORMATIK 2021“ in Berlin, unter das Leitthema „Informatik und Nachhaltigkeit“ zu stellen. Ein Beitrag von Ulrike Lucke, Vize-Präsidentin GI. Fridays for Future hat den Klimawandel verstärkt in das Blickfeld der Öffentlichkeit gerückt. Doch Fragen der Nachhaltigkeit stehen schon lange im Fokus der Wissenschaft. Auch Politik und Wirtschaft haben den bestehen-den Handlungsdruck erkannt. Dabei bedarf die Nachhaltigkeitsbetrachtung eines viel breiteren Betrachtungswinkels als der Klimaschutz. Dies zeigen etwa die 17 Nachhaltigkeitsziele der Vereinten Nationen, insbesondere im Kontext der Digitalisierung. Die Digitalisierung – und damit ihre Bezugswissenschaft: die Informatik – ist ein wichtiger Baustein der Lösung auf dem Weg zur Erreichung der Nachhaltigkeits- und Klimaziele. Ohne intelligente Lösungen, ohne die Informatik und ihre Konzepte, werden die Nachhaltigkeitsziele nicht zu erreichen sein. Gleichzeitig ist die Digitalisierung auch Teil des Problems, weil durch die zunehmende digitale Vernetzung enorme Ressourcen benötigt werden. Das umfasst sowohl Energie (zum Beispiel für den Betrieb von Infrastrukturen) als auch Rohstoffe (zur Herstellung der Hardware-Komponenten). In der Gesellschaft für Informatik e.V. (GI) spielen Nachhaltigkeitsbetrachtungen schon sehr lange eine wichtige Rolle. Schon 1986 formierte sich eine Gruppe motivierter Wissenschaftlerinnen und Wissenschaftler, die Interesse am Umweltschutz hatten und digitale Technologien zur Gewinnung und zum Austausch von Umweltinformationen nutzten. Nach einem ersten Symposium in Karlsruhe hat sich in der GI 1987 eine Pioniergruppe gegründet: Die Fachgruppe „Informatik für den Umweltschutz“. Kurze Zeit später bildeten sich weitere Arbeitskreise u. a. zu Umweltdatenbanken, zu Umweltverträglichkeitsprüfungen und zur Visualisierung von Umweltinformationen. Heute beschäftigt sich der Fachausschuss „Umweltinformatik“ mit allen aktuellen Fachfragen des Informatik-einsatzes in den Bereichen Informationsaufbereitung für Umweltschutz, Umweltplanung, Umweltsanierung und Umweltforschung und mit dem Einsatz modernster Kommunikationsmethoden."
author = "Gesellschaft für Informatik (GI)"
year_published = 2021
