full_description = "Die Mitgliedschaft in der GI wird durch die Satzung geregelt. Zusätzlich gelten unsere Beitragsinformationen Mit Beginn Ihrer regulären Mitgliedschaft haben Sie im Mitgliederbereich die Möglichkeit, Fachgruppen beizutreten. Eine Liste aller verfügbaren Fachgruppen finden Sie auf unserer Fachbereichseite. Bitte beachten Sie, dass manche Fachgruppen zusätzliche Leistungen anbieten und damit auch eigene Beiträge erheben. Sie können sich direkt einer oder mehreren Regionalgruppen zuordnen. Es können beliebig viele Regionalgruppen ausgewählt werden (Mehrfachauswahl durch Halten der Strg-Taste). Wir verwenden Ihre E-Mailadresse ausschließlich für Vereinskommunikation, die zur Erfüllung des Vertrages erforderlich ist. Sie können nachfolgende Zusendungen jederzeit widerrufen bzw. im Mitgliederbereich oder in entsprechenden E-Mails über einen Link abbestellen. Unsere DatenschutzhinweiseAllgemeine Informationen zur MitgliedschaftSatzung der Gesellschaft für Informatik e.V. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
