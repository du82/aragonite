["https://gi.de/meldung/kontakt-tracing-apps"]
title = "Kontakt-Tracing-Apps - Gesellschaft für Informatik e.V."
description = "Zur Bekämpfung der Coronapandemie wurden erstmals mobile Applikationen zur Kontakterfassung und -nachverfolgung, also dem systematischen Erfassen aller Personen mit zeitlicher und räumlicher Nähe zu einer infizierten Person, eingesetzt. In Deutschland haben hierzu vor allem die Corona-Warn-App und die Luca-App Verbreitung gefunden. Dieser Artikel diskutiert die beiden Apps vor allem im Hinblick auf Datenschutz, Sicherheit sowie deren Effektivität zur Bekämpfung der Pandemie. Im Gegensatz zu der Vielzahl an populärwissenschaftlichen Artikeln liegt der Fokus in diesem Artikel auf den technischen Aspekten der Kontakt-Tracing-Apps."
full_description = "Zur Bekämpfung der Coronapandemie wurden erstmals mobile Applikationen zur Kontakterfassung und -nachverfolgung, also dem systematischen Erfassen aller Personen mit zeitlicher und räumlicher Nähe zu einer infizierten Person, eingesetzt. In Deutschland haben hierzu vor allem die Corona-Warn-App und die Luca-App Verbreitung gefunden. Dieser Artikel diskutiert die beiden Apps vor allem im Hinblick auf Datenschutz, Sicherheit sowie deren Effektivität zur Bekämpfung der Pandemie. Im Gegensatz zu der Vielzahl an populärwissenschaftlichen Artikeln liegt der Fokus in diesem Artikel auf den technischen Aspekten der Kontakt-Tracing-Apps. Die Corona-Warn-App (CWA [1]) wurde von den Unternehmen SAP und Deutsche Telekom AG entwickelt und wird vom Robert Koch-Institut betrieben. Bei der Entwicklung der Corona-Warn-App wurde ein Privacy-first-Ansatz verfolgt, um einen höchstmöglichen Schutz der Nutzerdaten zu erreichen. Alle Daten werden hier zunächst dezentral auf den Smartphones der Nutzer gespeichert und verarbeitet. Personenbezogene Daten wie Name und Telefonnummer werden nicht erhoben und sind für den Betrieb auch nicht notwendig. Die grundsätzliche Funktionsweise des dezentralen Kontakt-Tracings ist in Abb. 1 schematisch dargestellt. Um in eine Location einzuchecken, ist lediglich eine Interaktion mit dem entsprechenden QR-Code notwendig. Alle mit dem Check-in verbundenen Daten verbleiben auf dem Smartphone. Eine regelmäßige Kommunikation mit dem Backend dient lediglich dem Abruf gemeldeter Infektionen, um das eigene Risiko zu berechnen und den Nutzer gegebenenfalls warnen zu können. Eine Profilbildung nicht am Coronavirus infizierter Nutzer durch den Betreiber des Backends oder einen Angreifer ist daher unmöglich. Ebenso erfolgt die Erstellung von Events und Locations clientseitig über die CWA oder ein Webfrontend. Eine zentrale Speicherung von angelegten Veranstaltungen erfolgt nicht. Um die Warnung naher Kontakte zu ermöglichen, ist es jedoch notwendig die Check-in-Daten infizierter Nutzer in das Backend zu übertragen und dort zugänglich zu machen. Bewegungsprofile von infizierten Personen wären also durchaus denkbar. Um die Datensätze auszuwerten und ein Profil zu erstellen, müssten jedoch die IDs und entsprechenden Metadaten der Locations zur Verfügung stehen, welche, wie oben genannt, nicht zentral gespeichert werden. Letztlich müsste eine Sammlung aller QR-Codes erstellt werden, etwa durch manuelles Abfotografieren. Die Erstellung einer solchen Sammlung von QR-Codes ist zwar nicht unmöglich, wäre jedoch mit einem unverhältnismäßig hohen personellen Aufwand verbunden. Um die Profilbildung weiter zu erschweren, werden außerdem vom CWA-Backendsystem falsche Datensätze eingestreut."
