full_description = "Zugang zu den Menschen, die die digitale Zukunft gestalten: Die Gesellschaft für Informatik e.V. (GI) ist mit rund 20.000 persönlichen Mitgliedern die größte deutschsprachige Fachcommunity für alle Belange der Informatik. Die Mitglieder der GI gestalten die Zukunft der Digitalisierung entscheidend mit. 230 korporative Mitglieder haben das bereits erkannt und nutzen so zum Beispiel die Möglichkeit, sich mit den High Potentials von morgen zu vernetzen. Wer schon dabei ist, finden Sie hier. Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden. Essentielle Cookies werden für grundlegende Funktionen der Webseite wie z.B. für die Anmeldung im Mitgliederbereich benötigt. Dadurch ist gewährleistet, dass die Webseite einwandfrei funktioniert. Diese Gruppe beinhaltet alle Skripte für analytisches Tracking und zugehörige Cookies. Es hilft uns die Nutzererfahrung der Website zu verbessern."
