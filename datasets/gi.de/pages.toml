["https://gi.de/meldung/isobus-neues-buzzword"]
title = "ISOBUS - neues Buzzword - Gesellschaft für Informatik e.V."
description = "Farmers will often have a single tractor which they use for many different types of farmwork. A tractor alone does not do any work, it is essentially always paired with, powering, and/or moving something else, an implement mounted on its front or rear. It is particularly common in Europe, where there are many small regional manufacturers, that a farm contains tractors and implements from many different companies. The basic purpose of ISOBUS is to enable electronic communication between the tractor and the implement(s) attached to it. The two main aspects are that it must be possible to connect devices from different manufacturers, and that it must be a plug-and-play system that works without requiring any configuration by the end user (the farmer)."
full_description = "Farmers will often have a single tractor which they use for many different types of farmwork. A tractor alone does not do any work, it is essentially always paired with, powering, and/or moving something else, an implement mounted on its front or rear. It is particularly common in Europe, where there are many small regional manufacturers, that a farm contains tractors and implements from many different companies. The basic purpose of ISOBUS is to enable electronic communication between the tractor and the implement(s) attached to it. The two main aspects are that it must be possible to connect devices from different manufacturers, and that it must be a plug-and-play system that works without requiring any configuration by the end user (the farmer). Farmers will often have a single tractor which they use for many different types of farm work. A tractor alone does not do any work, it is essentially always paired with, powering, and/or moving something else, from a simple trailer that holds produce for transport, to sophisticated, hi-tech machines with advanced features such as artificial intelligence (AI)-based automatic spraying technology. These machines are mounted on the front or rear of the tractor and are known as implements. It is possible and even probable that the tractor and the implement are produced by different manufacturers. It is particularly common in Europe, where there are many small regional manufacturers, that a farm contains tractors and implements from many different companies. ISOBUS is the industry-given name for devices that have been certified by the Agricultural Industry Electronics Foundation (AEF) as compliant with the ISO 11783 standard series which defines a bus system built on top of 250 Kbit/s CAN 2.0B. The ISO 11783 foundations were laid in 1987 when the development of its predecessor standard, DIN 9684:2–5, was started. Even if the original ideas are from 1987, the official launch of ISOBUS technology for public use was not until November 2001. The basic purpose of ISOBUS is to enable electronic communication between the tractor and the implement(s) attached to it. The two main aspects are that it must be possible to connect devices from different manufacturers, and that it must be a plug-and-play system that works without requiring any configuration by the end user (the farmer). As technology has advanced, ISOBUS has needed to keep up; in modern farming there is a need for automation control systems, big-data, detailed analysis by agronomists, and more [1]."
author = "Gesellschaft für Informatik (GI)"
year_published = 2023
