["https://gi.de/meldung/beirat-zur-digitalstrategie-legt-abschlussbericht-vor"]
title = "Beirat zur Digitalstrategie legt Abschlussbericht vor - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Zwei Jahre hat der Beirat zur Digitalstrategie unter Mitwirkung der Gesellschaft für Informatik e.V. die Leuchtturmprojekte der Bundesregierung begleitet. In seinem Abschlussbericht veröffentlicht er nun Empfehlungen für eine künftige Digitalpolitik. Aufgabe des Beirats war das qualitative Monitoring der Digitalstrategie, insbesondere der Leuchtturmprojekte der Bundesregierung und hat sich zuletzt zudem projektübergreifenden Fragen gewidmet. Das Gremium war vor zwei Jahren von Bundesminister für Digitales und Verkehr (BMDV) Dr. Volker Wissing initiiert worden und direkt bei ihm angesiedelt. Daniel Krupka, Geschäftsführer der Gesellschaft für Informatik e.V. und Mitglied im Beirat Digitalstrategie: „Das waren zwei intensive Jahre, in denen wir viele spannende Projekte, sehr verheißungsvolle Ansätze und sehr engagierte Fachleute in den Ministerien begleiten dürfen. Allerdings zeigt sich auch hier, dass viele gute Puzleteile noch kein kohärentes Bild ergeben. Damit die Digitalisierung in Deutschland in ihrer Gänze voran kommt, braucht es in der Digitalpolitik ein klares Zielbild, das als Orientierungspunkt für die Projektziele und mögliche Finanzierungsoptionen dient. Zudem braucht es eine zentrale steuernde Instanz mit eigenem Budget für zentrale Digitalisierungsvorhaben.“ Gemeinsam mit dem Digitalservice der Bundesregierung wurden zudem Empfehlungen für die Umsetzung von Digitalisierungsprojekten der Bundesregierung entwickelt, die die Bereiche (1) Wirkungsorientierung, (2) Umsetzungsformen und Verstetigung zeitlich befristeter Projekte. (3) Nutzerzentrierung digitaler Angebote & Services, (4) Ebenen- und ressortübergreifende Zusam- menarbeit und (5) Projekte mit Datenfokus adressiert haben. Zum Abschlussbericht: Forderungen und Impulse für eine digitale Zukunft. Erkenntnisse und Empfehlungen zur Umsetzung der Digitalstrategie Deutschland Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere 