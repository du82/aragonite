["https://gi.de/meldung/informatik-wird-pflichtfach-rheinland-pfalz-holt-auf"]
title = "Informatik wird Pflichtfach: Rheinland-Pfalz holt auf - Gesellschaft für Informatik e.V."
description = "Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
full_description = "Ab dem Schuljahr 2028/29 wird Informatik zum Pflichtfach an allen allgemeinbildenden Schulen in Rheinland-Pfalz. Die Gesellschaft für Informatik e.V. und der Stifterverband begrüßen diese Initiative der Landesregierung – und betonen, dass das Fach langfristig auf sechs Wochenstunden in der Sekundarstufe I ausgebaut werden sollte. Berlin, 28. Januar 2025 – Als eines von sieben Bundesländern ohne Pflichtfach Informatik zieht Rheinland-Pfalz jetzt nach. Dies hat das Pädagogische Landesinstitut Rheinland-Pfalz verkündet.1 Bereits zum Schuljahr 2025/26 sollen ausgewählten Schulen vorzeitig mit dem Pflichtfach im Umfang von insgesamt vier Wochenstunden in den Jahrgangsstufen 7 bis 10 starten können. Zum Schuljahr 2028/29 werden alle weiterführenden Schulen folgen. Damit macht das Bundesland einen entscheidenden Schritt nach vorn. Denn bisher wird in Rheinland-Pfalz Informatik in der Breite lediglich im Wahlpflichtbereich angeboten und erreicht damit nur einen Bruchteil aller Schülerinnen und Schüler, wie im Informatik-Monitor – einem Gemeinschaftsprojekt vom Stifterverband, der GI und der Heinz-Nixdorf-Stiftung – nachzulesen ist. Anna Sarah Lieckfeld, Teamleiterin für die Themen Bildung und Gesellschaft bei der GI, sieht dies als wegweisende Entwicklung: „Rheinland-Pfalz legt mit der Einführung eines Pflichtfachs Informatik den Grundstein für eine Zukunft, in der informatische Kompetenzen in der Breite der Gesellschaft ankommen. Das neue Fach stellt sicher, dass alle Schülerinnen und Schüler erreicht werden – nicht nur diejenigen, die sich freiwillig für Wahlpflichtkurse entscheiden. Auf dem Weg zu einer digitalen mündigen Gesamtgesellschaft ist es wieder einen ordentlichen Schritt nach vorne gegangen. Wir freuen uns!“ Mathias Winde vom Stifterverband betont: „In wenigen Jahren wird Künstliche Intelligenz unser digitales Leben weitreichend beeinflussen. Im Fach Informatik lernen die Schülerinnen und Schüler, die technischen Grundlagen UND die gesellschaftlichen Auswirkungen zu verstehen und einzuschätzen. Der Schritt von Rheinland-Pfalz ist ein wichtiger Schritt nach vorne. In vielen Ländern Europas wird die nächste Generation bereits seit Jahren mit einem Pflichtfach Informatik auf das Leben in einer digitalen Welt vorbereitet – nicht selten von der Grundschule bis zum Abitur.“"
author = "Gesellschaft für Informatik (GI)"
year_published = 2025
