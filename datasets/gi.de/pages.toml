["https://gi.de/service/infomaterial"]
title = "Infomaterial - Gesellschaft für Informatik e.V."
description = "zur Ankündigung von Veranstaltungen"
full_description = 'Hier stellen wir öffentliches Informationsmaterial der GI für Sie bereit. Weitere Materialien finden Sie im Mitgliederbereich. Jahresberichte der GI dokumentieren die Aktivitäten der fachlichen Gliederungen und Leitungsgremien, des Vorstandes und der Geschäftsführung. Hier finden Sie die Jahresberichte zum Herunterladen, die gedruckte Version bestellen Sie bitte per E-Mail. Im Rahmen einer interaktiven Festschrift anlässlich des 50-jährigen Bestehens der Gesellschaft für Informatik kommen namhafte Mitglieder zu Wort, die die Entwicklung der GI entscheidend mitgeprägt haben. Ein Rückblick auf 50 Jahrestagungen der GI zwischen 1971 in München bis 2020 in Karlsruhe. Zeitzeugen und Tagungsleiterinnen und Tagungsleiter beschreiben ihre Jahrestagungen. Die Printversion kann per Online-Formular bestellt werden. Hier finden Sie die Lang- und Kurzfassung unserer Broschüre "Was ist Informatik". Sie ist insbesondere geeignet für Schülerinnen und Schüler, die sich im Unterricht mit Informatik befassen oder auch planen, ein Studium der Informatik aufzunehmen. Mit diesen Leitlinien soll die Verwendung der DFG-Programmpauschale, die durch die Gesellschaft für Informatik e.V. in DFG-Projektförderungen eingeworben wurde, zur Entlastung der aus dem GI-Haushalt finanzierten, indirekten Projektausgaben geregelt werden. Für die Öffentlichkeitsarbeit der GI adressieren wir ganz unterschiedliche Zielgruppen, für die auch unterschiedliche Flyer hergestellt wurden. Diese Flyer finden Sie hier zum Herunterladen. Durch Weiterleitung an interessierte Personen können Sie unsere Mitgliederwerbung unterstützen. Die Flyer können aber auch in größerer Stückzahl in der Geschäftsstelle bestellt werden. Bestellungen hier per E-Mail. Die Informatik wäre nichts ohne herausragende Persönlichkeiten, die das Fach geprägt und informatische Entwicklungen maßgeblich vorangetrieben haben. Der Arbeitskreis "Bild der Informatik" hat elf herausragende Informatikpersönlichkeiten identifiziert. Als Beispiel dient hier das Plakat von Alan Turing. Zehn weitere finden Sie hier.'
