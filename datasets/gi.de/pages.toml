["https://gi.de/meldung/rueckblick-auf-die-elsi-webtalks-fehlinformationen-strategien-und-geopolitik-im-cyberraum"]
title = "Rückblick auf die ELSI-WebTalks: Fehlinformationen, Strategien und Geopolitik im Cyberraum - Gesellschaft für Informatik e.V."
description = "Wie können wir im digitalen Raum Wahrheit von Täuschung unterscheiden? Welche Rolle spielt die Attribution von Cyberangriffen – und warum ist sie so schwierig? Welche Strategien helfen uns dabei, uns sicher in einem global vernetzten Cyberraum zu bewegen? Diesen und weiteren Fragen der Cybersicherheit gingen die ELSI-WebTalks (Ethics, Legal and Social Implications) der Gesellschaft für Informatik e.V. (GI) auf den Grund."
full_description = "Wie können wir im digitalen Raum Wahrheit von Täuschung unterscheiden? Welche Rolle spielt die Attribution von Cyberangriffen – und warum ist sie so schwierig? Welche Strategien helfen uns dabei, uns sicher in einem global vernetzten Cyberraum zu bewegen? Diesen und weiteren Fragen der Cybersicherheit gingen die ELSI-WebTalks (Ethics, Legal and Social Implications) der Gesellschaft für Informatik e.V. (GI) auf den Grund. Im ersten Talk setzten sich die Expert*innen mit der Dual-Use-Problematik der Cybersicherheitsforschung auseinander: Wie können Forschungsergebnisse, die sowohl zivil als auch militärisch nutzbar sind, verantwortungsvoll eingesetzt werden? Weiterhin wurde diskutiert, wie Fehlinformationen im Netz die Attribution von Cyberangriffen erschweren und wie KI und Open-Source-Technologien für kriminelle oder terroristische Zwecke missbraucht werden können. Der zweite WebTalk beleuchtete Strategien für Unternehmen und Institutionen, wirksam mit der zunehmenden Bedrohung durch Cyberangriffe umzugehen. Hierfür wurde zunächst ein Überblick über die aktuelle Bedrohungslage und den Stand der Technik zur Detektion und Abwehr von Cyberangriffen gegeben. Im Fokus der Diskussion stand hierbei die Frage, wie technische Lösungen und sicherheitspolitische Faktoren zusammenwirken können, um Angriffe präziser zu analysieren und geeignete Gegenmaßnahmen zu entwickeln. Dabei wurde auch die Rolle der technologischen Souveränität hervorgehoben. Im dritten WebTalk diskutierten unsere Expert*innen völkerrechtliche Ansätze zur Sicherung staatlicher Handlungsfähigkeit im Cyberraum, welche essentiell für den Schutz kritischer Infrastrukturen ist. Zudem wurden Strategien für die Attribution geheimer Nachrichten vorgestellt und erläutert, welche Herausforderungen die Identifikation von Verantwortlichen im Cyberraum erschweren. Wenn Sie Interesse an einer Fortführung der ELSI-WebTalks haben, wenden Sie sich gerne an Linda Schwarz (linda.schwarz@gi.de)! Auf unserer Webseite werden Cookies verwendet. Einige davon werden zwingend benötigt, während es uns andere ermöglichen, Ihre Nutzererfahrung auf unserer Webseite zu verbessern. Wir bitten hiermit um Erlaubnis, die folgenden Cookies verwenden zu dürfen. Diese Einwilligung ist freiwillig, nicht für die Nutzung der Website erforderlich und kann jederzeit widerrufen werden."
