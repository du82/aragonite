["https://gi.de/en/aktuelles/projekte/en-green-coding"]
title = "Green Coding - Gesellschaft für Informatik e.V."
description = "We use cookies mainly for anonymous statistical purposes. We use a tool called matomo for this and here only a small part of your IP is saved, nothing more. The Tool is hosted by ourself so no data is transferred to third parties."
full_description = 'Green Coding holds significant potential to reduce the environmental impact of software and promote sustainable practices in software development. By adopting efficient approaches, energy consumption and resource demands can be substantially lowered, contributing to a greener internet. However, as demonstrated by the preceding project "Potential of Green Coding" (2021–2023), Green Coding remains largely niche. Despite growing awareness of sustainability, there is still a lack of sufficient knowledge, established standards, and clear strategies to embed Green Coding in practice. The project “Unlocking the Potential of Green Coding into Practice” addresses these challenges through three key areas: The project is led by the German Informatics Society (GI) in collaboration with the Berlin University of Applied Sciences (HTW) and the Environmental Campus Birkenfeld at Trier University of Applied Sciences. It is funded by the ISOC Foundation and runs from October 2024 to September 2026. This video recaps the software industry workshop held on March 7th, 2023. During the workshop different stakeholders from academia, companies and civil society organisations met in Berlin to discuss challenges and conditions for the implementation of sustainability goals in software. The presentations in full length can be found here: https://www.youtube.com/playlist?list=PLYcO8AUs4DaFuwtrviynAmqQfkSdXQn9A We use cookies mainly for anonymous statistical purposes. We use a tool called matomo for this and here only a small part of your IP is saved, nothing more. The Tool is hosted by ourself so no data is transferred to third parties.'
author = "Gesellschaft für Informatik (GI)"
