["https://giac.org/renewal"]
title = "Renewing Your GIAC Certification | GIAC Certifications"
description = "Keep your hard-earned GIAC certification active to stay current and competitive in the cybersecurity workforce. Explore different options for renewal and resources that will help you maintain your certification."
full_description = "Why Renew? Learn about the benefits of certification renewal. Learn More How to Renew Explore step-by-step renewal resources. Learn More CPE Information Learn about collecting CPEs for your renewal. Learn More Stay Relevant with Renewal To remain current and competitive in the cybersecurity workforce, we recommend renewing via the CPE option: collect 36 credits over four years to keep your certification active. Here you’ll find the many ways to earn CPEs by simply staying active in the industry. Learn more about CPEs Earn CPEs at an Upcoming Affiliated Partner Event Explore Events Find More Renewal Info in Your GIAC Dashboard Access your GIAC dashboard to find more detailed information about renewal, CPE earning opportunities, and how to assign and justify CPEs. Log in now Where can I access my renewal courseware? All Renewal courseware (digital books, audio files, lab files) can be accessed by selecting the ‘Course Material Downloads’ link under the My Online Training heading on your Account Dashboard. For questions on renewal courseware & file access, contact info@giac.org. What courseware is included when I renew my GIAC Certification? Your certification renewal includes an updated set of course books, audio files, and any relevant lab files When choosing to ‘Renew with CPEs’ you will receive digital course books delivered to your online account. By selecting the box for 'Shipping' on your registration, a shipping and handling fee will apply to receive hardcopy course books in addition to your digital access. When choosing the ‘Take Exam Again’ method, hardcopy course books are automatically included along with an associated shipping fee. You will also receive digital course books delivered to your online account. The following is applicable to either scenario: Any additional hardware, such as F-Response and the Windows License, is not included. All Renewal courseware (digital books, audio files, lab files) can be accessed by selecting the ‘Course Material Downloads’ link under the My Online Training heading on your Account Dashboard. Customs duties or import fees may apply to delivery of hardcopy course books. Such fees vary by country and are not included on SANS or GIAC invoices. For questions on renewal courseware & file access, contact info@giac.org. Can I receive hardcopy courseware when renewing by CPE? Yes, by selecting the box for 'Shipping' on your renewal registration, a shipping and handling fee will apply to receive hardcopy course books in addition to your digital access.Customs duties or import fees may apply to delivery of hardcopy course books. Such fees vary by country and are not included on SANS or GIAC invoices. I cannot locate a GIAC Certification I earned in my GIAC Portal account, what do I do? Please write in to info@giac.org for assistance. I changed my name, how do I update the GIAC Certified Professionals Database? Please write in to info@giac.org for assistance with updating your name in our system. My GIAC Certification has expired, can I still renew it? Please write in to cert-renewal@giac.org. Do you accept vouchers/tokens as payment for the renewal maintenance fee? If you need assistance processing your payment, please reach out to info@giac.org. How do I create a renewal invoice so that my employer can remit payment for the renewal maintenance fee? To generate an unpaid invoice to provide for approval by your employer, please begin your renewal registration by following these steps from within your online account: Click ‘Certification History’ Select the ‘Purchase Renewal’ button Choose your renewal method: Click the ‘Renew with CPEs’ option to complete your renewal using your assigned CPEs. Click the ‘Take Exam Again’ option to renew by taking the current exam for your certification. Complete the registration form, ensuring all data is correct, and choose ‘Check’ as your form of payment. Once the registration is completed in full, an invoice will generate in an UNPAID status to provide for approval. This invoice can be accessed at a later date by accessing the ‘My Orders’ section of your account. The form of payment for the invoice can be changed when you/your employer is ready to remit the fee. If you need assistance processing your payment, please reach out to info@giac.org. When can I begin the renewal process? Your ability to complete renewal registration starts at the 2-year mark prior to your certification expiration date but you may start accumulating and tracking your CPE credits as soon as your GIAC certification is earned. When can I create my renewal registration? Your ability to complete registration starts at the 2-year mark prior to your certification expiration date. How many years does renewal add to my Certification expiration? Renewing your certification adds 4 years to your current expiration date. How do I renew my GIAC Certification by CPE? Log in to your online account and navigate to your Account Dashboard: Click ‘Certification History’ Select the ‘Purchase Renewal’ buttonClick the 'Renew with CPEs' option to complete your renewal using your assigned CPEs. Complete the registration form, ensuring all data is correct, and enter your payment information. Once CPE requirements are fulfilled and renewal fee paid in full, your GIAC certification will extend 4 years from its current expiration date, not from the date of renewal. How do I renew my GIAC Certification by Exam? Log in to your online account and navigate to your Account Dashboard: Click ‘Certification History’ Select the ‘Purchase Renewal’ buttonClick the 'Take Exam Again' option to renew by taking the current exam for your certification. Complete the registration form, ensuring all data is correct, and enter your payment information. You will have 4 months from the date your renewal payment is received to prepare and complete your proctored renewal exam. Do I get CTF lab materials with my renewal courseware when I renew my GCFA or GNFA? No, access to the CTF lab materials on USB B and C is limited to new FOR508 and FOR572 registrations only and is not included with GCFA and GNFA renewal courseware. All information not required for non-CTF labs and VMs is included in the USB A iso file in your account. Do I qualify for the Multiple Certification Renewal Discount? If you register for more than one GIAC certification renewal in a two-year period, you will receive a discount. After the first $499 certification renewal and payment, all additional certification renewal registrations received during the following two-year period will cost $249 each. This process will repeat after the two year period is up. How often do I need to renew my certification? GIAC certifications require renewal every four years. Registration is enabled at the 2-year mark prior to your certification expiration date. How many years is my certification active for? Four Years. How much is the certification renewal maintenance fee? The certification maintenance fee is a non-refundable $499 payment, due once every four years at the time of registration. How much is the multiple certification renewal discount? You will receive $249 off if you qualify for the multiple certification renewal discount. Why can't I assign my approved CPEs towards my GIAC Certification? The CPEs may have been earned outside of your 4-year certification cycle OR you have already submitted the maximum allowable CPEs for that category toward the certification you are attempting to renew. How do I assign and justify CPEs to my GIAC Certification? Once logged in to your account, click 'Certification History.' Click 'Manage All Renewal CPEs'. Click on the individual link(s) that say 'Assign' Select which certification you would like to assign CPEs to Complete the CPE Justification by clicking the 'Justify' link Answer the two multiple-choice questions. Click 'Justify Assignment to Certification'. Does the renewal of my certification count for CPE credit? No, CPEs are awarded for new ISO-17024 certifications only. The renewal of an existing certification is not eligible for CPEs. Can I earn CPE credit for a non-ISO-17024-Accredited Certification? Yes, as long as you completed the certification's associated training course. GIAC is unable to award CPEs for Certifications earned without the completion of an associated training course. Please submit a copy of your certification and proof of completed associated training course in the Other InfoSec Related Training category for review. I earned an ISO-17024-accredited certification (CISSP, CCNP, CEH, Security+), can I earn CPE credit for this? Yes, earning an InfoSec-related ISO-17024 accredited certification or completing training related to an accredited certification can be submitted for up to 36 CPEs in the ISO-17024-Accredited InfoSec Related Certifications and Affiliated Training category. To determine if your certification (or related training) is ISO-17024 accredited, please consult the ANAB Accreditation list here. Something I wrote was published, can I earn CPE credit for this? A published paper or book on a relevant information assurance topic can be used to demonstrate ongoing competency in the Information Security field related to the certification(s) being renewed. The published work must be completed within the four-year period in which your certification is currently valid. What activities qualify for CPE credit in the Graduate Courses category? Relevant graduate-level (Master's or Doctorate/PhD-level) courses completed within the four-year period in which your certification is currently valid from an accredited institution can be used to demonstrate ongoing competency in the Information Security field related to the certification(s) being renewed. Additionally, teaching a graduate-level course at an accredited institution qualifies for CPEs within this category. How many CPEs can I earn toward my GIAC Certification renewal in the Graduate Courses CPE category? You may earn up to 36 CPEs toward renewal in this category with each 3-5 credit hour course earning 12 CPEs. How many CPEs can I earn for my GIAC Certification renewal in the Other InfoSec Related Training CPE category? You can earn up to 18 CPEs per renewal in the Other InfoSec Related Training category. What activities qualify for CPE credit in the Other InfoSec Related Training CPE category? DOD or Military Training Skill-based Training Courses Vendor Training All-day or Multi-day Conferences & Summits (in-person or virtual) How many CPEs can I earn for my GIAC Certification renewal in the Community Participation CPE category? You can earn up to 12 CPEs per renewal in the Community Participation category. What activities qualify for CPE credit in the Community Participation CPE category? SANS WebcastsGIAC Exam Development ParticipationInfoSec Community Chapter MeetingsBrief Webinars Industry Webcasts or PodcastsPresenting / Guest SpeakingAuthoring an article for an industry related publication or websiteSME Participation How do I submit my resume in the Field Work Experience CPE category? Accurately enter your information in the fields on the CPE submission form and attach your resume that lists any recent work experience completed during the 4 years your Certification has been active relevant to your certification. How many CPEs can I earn for my GIAC Certification renewal in the Field Work Experience CPE category? You can earn up to 12 CPEs per renewal in the Field Work Experience category. I didn't finish the course, but I passed the certification exam. Do I still earn CPE's for the certification? GIAC awards 36 CPEs for earning a NEW GIAC Certification. Please contact cert-renewal@giac.org if your CPEs do not automatically file. The renewal of an existing certification is not eligible for CPEs. Why does GIAC have CPE category maximums? GIAC accepts a wide variety of professional activities to earn CPEs. We have multiple CPE categories to expand the flexibility in maintaining your certification(s). The categories are weighted with consideration of the activities they are comprised of. How do I know if the certification (other than GIAC) I earned can be submitted in the ISO-17024-Accredited InfoSec Related Certifications and Affiliated Training category for CPE credit? To determine if your certification (or related training) is ISO-17024 accredited, please consult the ANAB Accreditation list here. Why haven’t my OnDemand SANS course CPEs been filed to my account? To obtain a Certificate of Completion for an OnDemand course (and be awarded CPEs) you must: View 80% of the slides OR Pass 80% of the quizzes with a score of 80% or better. Why do I get the message “The dates or categories cannot be applied to any of your renewals” while attempting to submit CPEs? GIAC requires that all CPE submissions must be acquired within the 4-year period in which your GIAC certification is active, activities completed outside of the 4 years do not qualify. Several CPE categories have maximum CPEs you can earn per renewal, this message may mean you are over the category maximum allowed. Can I earn CPEs by taking a SANS course? Completion of any SANS course will award CPEs that are eligible for use toward your certification renewal. The majority of SANS courses award the full 36 CPEs needed for renewal. However, there are some courses that award less. The CPE value is indicated on the course description page. How do I submit CPEs? From your Account Dashboard, click 'Certification History.' Click 'Manage All Renewal CPEs' Click 'Submit New CPEs' Select the applicable CPE Category and Subcategory. Enter your information in the fields on the submission form. Click 'Submit Request' for CPE Credit. Attach your required supporting documentation. Add any additional supporting documentation if needed. Click 'Submit Request' for CPE credit. Why haven’t my SANS Event/Course CPEs been added to my account? SANS/GIAC CPEs will be automatically added to your portal account within 7-10 business days from the end of an event/course. If your course does not automatically add your earned CPEs, please contact cert-renewal@giac.org. How do I submit a SANS webcast for CPE credit? Upon completing a SANS webcast a certificate of completion is added to your online account. To locate this certificate: Select the ‘My Webcasts’ link from your account dashboard Locate the list of completed webcasts on the bottom of the pageSelect the ‘Click For CEU Certificate’ link under the webcast date Download the certificate to use as supporting documentation Requests for SANS webcasts CPEs can be submitted under the ‘Community Participation’ category by following these instructions: Submitting CPEs. Can I earn Community Participation CPEs for completing GIAC Exam Development activities? No, you do not earn Community Participation CPEs for completing a GIAC Beta Exam. Please see the Subject Matter Expert FAQ page. Can I earn Community Participation CPEs for completing GIAC Exam Development activi"
