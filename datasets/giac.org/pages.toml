["https://giac.org/about/community"]
title = "Community Resources | GIAC Certifications"
description = "GIAC has partnered with digital badging provider Credly to provide certification holders with digital badges representing their GIAC certifications."
full_description = "GIAC Digital Badges GIAC has partnered with digital badging provider Credly to provide certification holders with digital badges representing their GIAC certifications. What is a digital badge? Digital badges are a verified, online representation of your certification achievement. Digital badges are interactive: when someone (like a manager or HR employee) clicks on your badge, they will be directed to an overview page providing personalized information on your qualifications and specialized skills. Why are digital badges important? GIAC's digital badges add value for our certification holders by providing a quick and efficient way for prospective employers to understand and verify your credentials. Digital badges assist with explaining your capabilities and high-level achievements. Digital badges can be used in email signatures, personal websites, on LinkedIn, Twitter, as well as on electronic copies of resumes. Digital badges help GIAC certification holders prove to employers that they have the skills required to earn and maintain a specialized GIAC certification, and to get the job done at any organization. How do I get a digital badge? After you have earned your GIAC certification, you will be contacted via email with instructions on claiming your digital badge. For more information, visit our FAQ page. View Digital Badge FAQs GIAC Advisory Board The GIAC Advisory Board is made up of GIAC certified professionals who want to take a more active role in the GIAC community. The Advisory Board provides a forum where information security professionals can exchange ideas and advice, and discuss issues directly related to GIAC and SANS business, such as training and certification. Occasionally, the Advisory Board also features opportunities for paid work, such as SANS courseware development or GIAC exam question development. Participation is by invitation only. View Advisory Board FAQs"
year_published = 2025
