y Essentials (GCLD), is no exception.2021-02-16 - GIAC Announces New Cloud Penetration Testing CertificationGIAC Certifications, known for providing the highest standard in cybersecurity certifications, has launched a new certification: GIAC Cloud Penetration Tester (GCPN).2020-08-04 - GIAC Continues to Launch New Certifications for Cybersecurity Skill NeedsDespite the economic, social, and political changes that have taken place across the globe due to Covid-19, the importance of information security hasn't changed.2020-04-27 - GIAC Certifications Launches Remote ProctoringGIAC Certifications, known for providing the highest standard in cyber security certifications, recognizes the significant role that technology is playing in all our lives at this unique point in time. The COVID-19 pandemic has caused disruptions around the world, including the mandatory closure of testing centers.2020-04-22 - GIAC Launches New Cyber Security Certification for GIAC Cloud Security AutomationGIAC Certifications, known for providing the highest standard in cyber security certifications, has launched a new certification: GIAC Cloud Security Automation.2020-03-20 - MEDIA ALERT: GIAC Launches 'Trust Me, I'm Certified' Podcast SeriesGIAC Certifications, a certification body and an affiliate of the SANS Institute, today announced the Trust Me, I'm Certified podcast series.2020-01-06 - GIAC Launches New Cyber Security Certification for GIAC Enterprise Vulnerability AssessorGIAC Certifications, known for providing the highest standard in cyber security certifications, has launched a new certification: GIAC Enterprise Vulnerability Assessor.2019-08-05 - GIAC Launches New Cyber Security Certification for GIAC Defensible Security ArchitectureGIAC Certifications, known for providing the highest standard in cyber security certifications, has launched a new certification: GIAC Defensible Security Architecture (GDSA).2018-10-09 - GIAC Launches New Certification for GIAC Defending Advanced Threats, GDATGIAC Certifications, known for providing the highest standard in cyber security certifications, has launched a new certification: GIAC Defending Advanced Threats (GDAT).2016-09-27 - GIAC Launches New Certification for Advanced Smartphone Forensics, GASFThe new GIAC Advanced Smartphone Forensics is for professionals who want to demonstrate that they are qualified to perform forensic examinations on devices such as mobile phones and tablets.2016-05-09 - GIAC Launches New Certification for Python Coders, GPYCGlobal Information Assurance Certification (GIAC), the leading provider and developer of Cyber Security Certifications, has launched a new certification for Python Code (GPYC).2016-04-08 - Altep Team Members Achieve Prestigious CertificationsGIAC Awards Titles to Duncan del Toro and Daniel Lam2014-12-23 - Key industries train to thwart cyber attacksWhile the nation has focused on the dramatic cyber attack against Sony Pictures and the recent hacking of Target and Home Depot, cybersecurity experts say the greater danger is that terrorists will go after the nation's critical infrastructure -- its airports, water treatment plants, power companies, oil refineries and chemical plants.2014-12-17 - Look How Cute this Military Cyber Warfare Training Ground IsCyberCity, as it's called, serves as a training ground for a new class of specialized "cyber warriors," capable of defending against cyber attack. Every day, soldiers plot to take over the town, by hacking into its schools, its water systems, its power grid, and its Internet, as colleagues and instructors watch on screens in the other room.2014-11-11 - America's Critical Infrastructure Is Vulnerable To Cyber AttacksAmerica's critical infrastructure- the utilities, refineries, military defense systems, water treatment plants and other facilities on which we depend every day- has become its soft underbelly, the place where we are now most vulnerable to attack.2014-08-12 - Ernie Hayden breaks downs the GICSP CertificationA new SANS Institute certification, GICSP, could prove useful to industrial control system (ICS) security professionals. Expert Ernie Hayden explains the certification and how to prepare for the exam.2014-08-12 - Bridging the IT security skills gapWhile poaching security talent may plug short-term gaps, outreach and education will solve the long-term shortfall in IT security professionals.2014-07-17 - How Russians Stole the NASDAQIn October 2010, a Federal Bureau of Investigation system monitoring U.S. Internet traffic picked up an alert. The signal was coming from Nasdaq. It looked like malware had snuck into the company's central servers. There were indications that the intruder was not a kid somewhere, but the intelligence agency of another country.2014-04-22 - Verizon Breach Report: Attackers Take Only Seconds To Capitalize On A Basic Security MistakeWeak and stolen passwords, poorly configured systems and error-riddled applications are at the core of nearly every data breach and security incident, according to the 2014 Verizon Data Breach Investigations Report, the security industry's annual analysis of data breaches, released Tuesday.2014-02-25 - 20 Technology Certifications that are Paying OffCertifications ranging from software lifecycle management to cloud and database architecture to project management are hot skill areas for the year ahead.'''
