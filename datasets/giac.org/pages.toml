["https://giac.org/focus-areas/industrial-control-systems"]
title = "Industrial Control Systems (ICS) Certifications  | GIAC"
description = "Attacks on industrial control infrastructure are occurring with increasing frequency and strength. Control systems across the globe need strong infosec teams to ensure these threats do not succeed. GIAC's industrial control system certifications validate the skills ICS professionals need to protect and defend critical industrial systems and respond to inevitable incidents. Earning an ICS certification confirms your ability to safeguard essential infrastructure and demonstrates your value in the workplace."
full_description = '''Industrial Control Systems Certifications CyberLive Global Industrial Cyber Security Professional Certification (GICSP) GIAC Response and Industrial Defense (GRID) GIAC Critical Infrastructure Protection Certification (GCIP) "I work in industrial control systems (ICS) as a systems integrator. While I'm not yet certified, the GCIP is on my short list of extremely relevant certs for the future of our industry. Looking forward to holding that piece of paper one day soon!" - Jeremy Schlosser I've already registered for SANS training, how do I add the GIAC exam? Students can add a GIAC Certification exam attempt to their SANS course purchase either during the registration process, or through their SANS Account dashboard up until thirty days after the completion of their in-person, Simulcast, or Live Online course. For OnDemand orders, students have until ninety days after the registration date to add the GIAC Certification exam attempt bundle.The deadline to complete the GIAC Certification exam attempt is four months from the completion of the in-person, Simulcast, or Live Online course. For OnDemand orders, the deadline to complete the GIAC Certification exam attempt is the same as the online training deadline.To add a GIAC Certification exam attempt bundle after registering:Log in to your SANS Account and click the "My Orders" link in your dashboardSelect "Add Available Bundled Items to Your Order" and submit your payment information to complete your purchase I also signed up for SANS training - when will I receive access to my GIAC exam? For OnDemand orders, you will receive access to the training and exam when you manually start the course from your account, or automatically within 14 days of payment. For in-person or LiveOnline training, you will receive access to the exam 7-10 days after the conclusion of your training event. How do I register for a GIAC exam with SANS training? The option to add the GIAC exam is available when you register for the associated SANS training course. Check out the list of SANS courses to get started. More FAQ's'''
