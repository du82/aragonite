ays after the registration date to add the GIAC Certification exam attempt bundle.The deadline to complete the GIAC Certification exam attempt is four months from the completion of the in-person, Simulcast, or Live Online course. For OnDemand orders, the deadline to complete the GIAC Certification exam attempt is the same as the online training deadline.To add a GIAC Certification exam attempt bundle after registering:Log in to your SANS Account and click the "My Orders" link in your dashboardSelect "Add Available Bundled Items to Your Order" and submit your payment information to complete your purchase I also signed up for SANS training - when will I receive access to my GIAC exam? For OnDemand orders, you will receive access to the training and exam when you manually start the course from your account, or automatically within 14 days of payment. For in-person or LiveOnline training, you will receive access to the exam 7-10 days after the conclusion of your training event. How do I register for a GIAC exam with SANS training? The option to add the GIAC exam is available when you register for the associated SANS training course. Check out the list of SANS courses to get started. More FAQ's'''
