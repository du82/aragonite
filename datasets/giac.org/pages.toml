["https://giac.org/legal/privacy"]
title = "Privacy Policy | GIAC"
description = "GIAC Privacy Policy last updated September 1 2021"
full_description = '''GIAC, LLC PRIVACY POLICYGIAC, LLC is a subsidiary of The Escal Institute of Advanced Technologies, Inc. d/b/a the SANS Institute (GIAC, LLC and the SANS Institute are collectively referred throughout as "GIAC"). GIAC is a U.S. based company that provides cyber security certifications through its Global Information Assurance Certification programs. SANS Institute also operates its academic programs offered through the SANS Technology Institute ("STI").This Policy addresses how GIAC, as a data controller, collects, uses, and otherwise processes personal information relating to individuals who participate in the programs offered through GIAC and who visit the GIAC websites that link to this Policy (collectively, the "Websites"). When we refer to "Websites" we mean www.giac.org/legal/privacy as well as other websites that link to this Policy. "Personal information" is information that relates to an identified of identifiable living individual.Note that the SANS Institute has its own privacy policy at www.sans.org/privacy and SANS Institute has its own privacy policy at www.sans.edu/privacy. This Policy does not apply to personal information that is addressed by those privacy policies.We need to process personal information to provide services to you. Sometimes, we provide your personal information to third parties, including GIAC affiliate organizations such as SANS and STI, to help us provide our services. If you are not willing to provide your personal information and have it disclosed to third parties in accordance with this Policy, you may not be able to use our services.Specific Information about Our Privacy PolicyOur Policy is described here in a concise, transparent, intelligible, and easily accessible form. It is set forth in a series of specific components describing how our Policy operates and how it meets certain privacy rights.Identity of the Data ControllerGIAC is the data controller - the entity that collects and processes personal information or arranges for such actions taken on its behalf by its agents. As such, we are responsible for deciding the purposes for which personal information is used and processed, and how such processing is done. Thus, it is GIAC's responsibility to inform you in advance concerning the processing of your personal information. You may contact GIAC concerning your rights under this Policy by writing to: policy@giac.org or privacy@sans.org.Legitimate Bases for Collecting/Using Your Personal InformationThe principal basis on which we collect and use your information is when you give us your affirmative consent. However, when you register for the GIAC program, or make a purchase of testing and/or related services from us, GIAC has a legitimate basis beyond consent to collect your personal information in order to provide you with the goods or services that you expect us to deliver, which depends upon us having and using your personal information. In the process of registering for testing services, you will be asked to sign a Candidate Agreement, from which a legitimate basis is created for us to collect and use your personal information. Once you have a formal relationship with us, GIAC also has a legitimate interest in providing you with timely information about upcoming events and/or products in which you may have an interest; so, to better serve you, we will market or promote those events/products to you. Thus, depending on the precise situation, GIAC may rely on one of these legitimate bases in collecting your personal information.How We Collect and Use Personal InformationTo save you time and make our web services easy to use, you may create a dashboard account using your personal information. You may do this by visiting https://www.sans.org/account/. The account dashboard system saves your information and references it to your email address and password. The next time you visit the GIAC website, you can simply enter your email address and password. If you purchase a certification or service from us, we request certain personally identifiable information from you on our order form. You must provide contact information (such as name, email, and shipping address) and financial information (such as credit card number, expiration date). We use this information for billing purposes and to fill your orders. If we have trouble processing an order, we will use this information to contact you. We also use the mailing address to send you GIAC brochures and other items of interest.When you register online for a certification, we collect the information you provide us, including your name, contact information, affiliation, and the name of the certification. We use this information to ensure you are properly registered for the certification you have selected, and to notify you about other certifications that may be of interest to you. We also use this information while fulfilling our obligations to provide the certification to you, including providing you materials, if opted for a certification renewal, and contacting you with respect to the certification itself.Many employers have purchasing arrangements with GIAC, or GIAC's parent company, the SANS Institute, that may be used by their employees to pay for GIAC products. GIAC candidate data, including contact information and exam-related data may be shared with the purchasing organization's designated contact. In addition, such GIAC candidate data may also be shared with its affiliated entities under the SANS Institute as necessary for customer service purposes. As such, GIAC may share your certification status, and/or the results of GIAC certification attempts, with the entity that GIAC determines, using commercially reasonable practices, directly or ultimately paid for your certification exam or other related GIAC products or service, as well as SANS Institute affiliated entities. GIAC may release to such organizations only appropriately limited information, including your progress, exam appointment date, exam deadline, the results of the test, and any sanctions decisions, subject to the commitment by that entity to keep GIAC data confidential and not to further disclose it to any third party without your express written consent. GIAC may use outside vendors or third parties to proctor or administer exams we provide or for other certification, accreditation, or licensing. The authentication and validation process may include requiring persons to provide identification (or photographing participants). Copies of such authentication information, as well as the identity of those taking the exams, may be collected and stored by GIAC, but this information will be used by GIAC in accordance with this Policy to prevent fraud and to ensure the identity of those taking the examination.GIAC may occasionally provide you the opportunity to participate in contests or surveys on our site. If you participate, we may request certain personally identifiable information from you. Participation in these surveys or contests is completely voluntary and you therefore have a choice whether to disclose this information. The requested information typically includes contact and demographic information such as name and address. We may share aggregated demographic information about our user base with our partners and advertisers. When this information is shared, it is anonymous (i.e., does not identify individual users).When you contact GIAC, we may keep a record of your communication to help resolve any issues you might be facing. We may use your email address to inform you about our services, such as letting you know about upcoming changes or improvements.GIAC may use X (formerly Twitter), Facebook or other social media outlets to market and promote its offerings and services. Any communications you make with GIAC using these media may be used by GIAC in accordance with this Policy.Access to Your Personal InformationYou always have access to the information we have about you. To review and update your personal contact information, simply click https://www.sans.org/account/login and log in with your email address and password, then click Update Your Account. We encourage you to review your preferences regularly to keep the information current. You may also write policy@giac.org to have the information changed or removed, or to withdraw your consent. How Long We Retain Your Personal InformationWe will retain your personal information for as long as is needed to offer you services or comply with our legal obligations. For personal information that we process on behalf of a business partner or your employer, we will retain such personal information in accordance with the terms of our agreement with them.Disclosure of Your InformationIn general, we will only share or disclose your information with those individuals and/or entities whom you authorize or designate, for example, with your existing or prospective employer, with a governmental body that has authority to issue a credential or other certification, or with another certifying body. We may share personal information with companies, organizations, or individuals outside of GIAC if we have a good-faith belief that access, use, preservation or disclosure of the information is reasonably necessary to:Data Sharing with Affiliates. GIAC may share certain data with its affiliates, The Escal Institute of Advanced Technologies and SANS Technology Institute. Such data shared will include accommodation data associated with the Americans with Disabilities Act (ADA) which will only be shared if it is strictly necessary to fulfill legal or service obligations. GIAC and its affiliates are committed to handling all shared sensitive data in compliance with applicable laws, including but not limited to the ADA, GDPR, and other relevant privacy regulations. Measures are in place to ensure the protection, confidentiality, and security of such data.meet any applicable law, regulation, legal process, or enforceable governmental request.enforce applicable Candidate Agreement Terms of Service, Terms of Use, or other potential violation of GIAC contracts or rules, including investigation of potential violations.detect, prevent, investigate, or otherwise address fraud, security or technical issues.protect against harm to the rights, property, or safety of GIAC, our users, or the public as required or permitted by law.When the certification body is required by law to release confidential information, the person concerned shall, unless prohibited by law, be notified as to what information will be provided.We may provide access to your personal information to our affiliates or other trusted businesses or persons to process it for us, based on our instructions and in compliance with our Policy and any other appropriate confidentiality and security measures.We may share aggregated and non-personal information we collect under any of the circumstances set forth in this Policy. When we de-identify personal information, we have implemented reasonable measures as required by law to ensure that the de-identified data cannot be associated with any individual or customer. We will only maintain and use such data in a de-identified manner and do not attempt to re-identify the data, except as permitted by law.In general, we may disclose the following categories of personal information in support of our business purposes identified above:Name, contact information, and other identifiersCustomer recordsProtected classificationsCommercial Information Usage dataAudio, video, and other electronic data Education informationProfiles and inferencesWe have disclosed the categories of personal information listed above to the following categories of third parties in the preceding twelve months: data analytics providers, service providers, and sponsors of SANS Institute events, programs, and papers. Categories of Personal Information Sold or Shared The California Consumer Privacy Act ("CCPA") defines a "sale" as disclosing or making available to a third party personal information in exchange for monetary or other valuable consideration, and it defines "share" in pertinent part as disclosing personal information to a third party for cross-context behavioral advertising. As defined by the CCPA, the categories of personal information that we may "sell" include:Name, contact information, and other identifiersAs defined by the CCPA, the categories of personal information that we may "share" include:Name, contact information, and other identifiersThe categories of third parties to whom we sell or share the data, as defined by the CCPA, may include: Data analytics providersService providers who are assisting us in fulfilling our contracts and carrying out our businessSponsors of SANS Institute events, programs and papersThe business purpose for which we sell or share the data, as defined by the CCPA, may include: Lead generation, business prospecting, and similar activitiesTo gain insights into online activities through analyticsTo provide leads to sponsors of SANS Institute events, programs and papers We have "sold" and "shared" the categories of personal information listed above to data analytics providers in the preceding twelve months.Merger, Acquisition, Sale or Forced SaleIf GIAC is involved in a merger, acquisition, or asset sale, including a forced sale of assets, we will, to the extent permitted by law, continue to ensure the confidentiality of any personal information and give affected users notice before personal information is transferred or becomes subject to a different privacy policy.GIAC Certified Professional InformationGIAC Certified Professionals are listed on the GIAC website, which is public information. Published data includes Analyst Number, Certificate Holder's Name, Gold Paper Title (if applicable), and Certification Expiration Date. No personal contact information is published.Log FilesAs is true of most web sites, we gather certain information automatically and store it in log files. This information may include IP addresses, browser type, referring/exit pages, operating system, date/time stamp, and clickstream data. We use this information to analyze trends, to administer the site, and to track how visitors interact with the site.CookiesWhen you visit the GIAC Website, we may assign your computer or device one or more cookies to facilitate access to our site and to personalize your online experience. Some of these cookies are necessary for the Website to function, and others provide enhanced functionality and personalization. Other cookies help us measure and improve the performance of our Websites, and some of the cookies are used to build a profile of your interests and show you relevant content and advertisements on other websites. Through the use of a cookie, we also may automatically collect information about your online activity on our site, such as the web pages you visit, the links you click, and the searches you conduct on our s'''
year_published = 2025
