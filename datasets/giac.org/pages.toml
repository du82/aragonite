["https://giac.org/get-certified/giac-portfolio-certifications"]
title = "GIAC Portfolio Certifications | GIAC Certifications"
description = "Portfolio Certifications are built on the foundation of stackable certifications. Among other benefits, skill stacking can increase your value as an employee, make work more rewarding, and improve your ability to learn and adapt.GIAC offers two categories of stackable certifications to meet the needs of different professionals: Practitioner certifications and Applied Knowledge certifications. Candidates can choose from a wide range of certifications to create a unique portfolio of credentials that demonstrate their expertise in a specific field or across multiple focus areas. Those who build portfolios to become GIAC Security Professionals (GSPs) may choose to advance to the highest level of GIAC certification, the GIAC Security Expert (GSE)."
full_description = "NEW! GIAC Portfolio Certifications Portfolio Certifications are built on the foundation of stackable certifications. Among other benefits, skill stacking can increase your value as an employee, make work more rewarding, and improve your ability to learn and adapt.GIAC offers two categories of stackable certifications to meet the needs of different professionals: Practitioner certifications and Applied Knowledge certifications. Candidates can choose from a wide range of certifications to create a unique portfolio of credentials that demonstrate their expertise in a specific field or across multiple focus areas. Those who build portfolios to become GIAC Security Professionals (GSPs) may choose to advance to the highest level of GIAC certification, the GIAC Security Expert (GSE). How to Earn a Portfolio Certification Create a unique portfolio of credentials by focusing where you want.Choose any of GIAC’s 40+ Practitioner Certifications like GSEC, GCIH, GCFA and GPEN.Choose any of GIAC’s Applied Knowledge Certifications like GX-CS, GX-IA, and GX-IH. Get Started GIAC Security Professional (GSP) GIAC’s NEW Security Professional (GSP) illustrates your depth and breadth of knowledge. The GSP is a new milestone on your journey to becoming a GSE that proves mastery of multiple areas in the cybersecurity industry with hands on problem solving. Those holding the GSP have demonstrated they are some of the most experienced and capable practitioners in the field.Prestige. Separate yourself from the vast majority of cybersecurity professionals. Flexibility. Everyone’s path is different. Customize your journey to prove your expertise in the area that fits your career. Timing. Take as long as you need to collect the pieces, just keep your certifications active.Convenience. Co-termination of all other GIAC certifications to the expiration of your GSP. Requirements. Complete any three Practitioner certifications and any two Applied Knowledge certifications. Watch GSP Intro Video GIAC Security Expert (GSE) GIAC’s Security Expert (GSE) Portfolio Certification is the most prestigious credential in the IT security industry. Those who achieve the GSE certification have proven their elite status as top information security practitioners in the field.Prestige. Prove your elite status at the top with the most prestigious industry credential. Flexibility. Everyone’s path is different. Customize your journey to prove your expertise in the area that fits your career. Timing. Take as long as you need to collect the pieces, just keep your certifications active.Convenience. Co-termination of all other GIAC certifications to the expiration of your GSE. Requirements. Complete any six Practitioner certifications and any four Applied Knowledge certifications. Watch GSE Intro Video Take Control of Your Certification Journey with GIAC's New Dashboard! The new and improved GIAC dashboard is designed to simplify and supercharge your certification journey. With a consolidated view of active certifications and provides a clear roadmap for achieving a GIAC Security Professional (GSP) or GIAC Security expert (GSE). Whether you're tracking your progress or planning your next certification step, this intuitive tool has everything you need, all in one place. GSE Testimonials Here is what cybersecurity experts have to say about the GSE. Previous Next The GSE certification offered a specific challenge, a goalpost to intentionally pursue. It motivated me to learn skills outside my comfort areas & offered a framework within which I could grow as a security professional. Lenny Zeltser GSE #2, SANS Institute Fellow Instructor Preparing for and taking the GSE exams was the most thrilling journey I have ever experienced, and the one that fills me with the most pride. Shane Hoenke GSE #337 Being able to demonstrate through a skill-based assessment the broad base of knowledge was important personally and professionally. Timothy Brush GSE #191 The GSE is a great way to challenge yourself, and from a certain perspective can help you overcome imposter syndrome. Agostino Panico GSE #304 Undoubtedly the most challenging & difficult exam series I have taken, but worth the effort earning the GIAC Security Expert! It's prepared me to be a technical leader within my organization & lead them into the future! Matthew O'Rouke GSE #319, Weapons & Tactics Director with U.S. Army Cyber Command future How do I earn the GIAC Security Expert Certification (GSE)? The GSE is awarded upon earning any 6 GIAC Practitioner Certifications and any 4 GIAC Applied Knowledge Certifications.You will be contacted by email when you have earned the GSE Certification. How do I earn the GIAC Security Professional Certification (GSP)? The GSP is awarded upon earning any 3 GIAC Practitioner Certifications and any 2 GIAC Applied Knowledge Certifications.You will be contacted by email when you have earned the GSP Certification. How do I maintain my GSP or GSE? To maintain GSP or GSE status, you'll need to maintain the minimum number of certifications for your certification portfolio -- GSP: 3 GIAC Practitioner Certifications and 2 GIAC Applied Knowledge Certifications.GSE: 6 GIAC Practitioner Certifications and any 4 GIAC Applied Knowledge Certifications.More details are available here. What are the prerequisites to become a GIAC Security Professional (GSP) or a GIAC Security Expert (GSE)? The GSP is awarded upon earning any 3 GIAC Practitioner Certifications and any 2 GIAC Applied Knowledge Certifications.The GSE is awarded upon earning any 6 GIAC Practitioner Certifications and any 4 GIAC Applied Knowledge Certifications.There are no prerequisites to attempt any GIAC exams. Do I need to register for the GIAC Security Professional Certification (GSP) or the GIAC Security Expert Certification (GSE)? Is there a cost? No. The GSP is awarded upon earning any 3 GIAC Practitioner Certifications and any 2 GIAC Applied Knowledge Certifications. The GSE is awarded upon earning any 6 GIAC Practitioner Certifications and any 4 GIAC Applied Knowledge Certifications.There is no separate registration or fee required. You will be contacted by email when you have earned the GSP or the GSE Certification. How do I get my GSE or GSP coin? The new GSE and GSP coins will be made available to all GSE and GSP holders later this year. Portfolio Certification holders will be notified via email to claim their coin. More FAQs"
year_published = 2025
