["https://giac.org/workforce-development/dodd-8140"]
title = "DoDD 8140 | SANS Institute"
description = "The updated DoD 8140 Qualification Program, implemented February 2023, provides a comprehensive approach to managing cyber workforce talent. It establishes baseline standards for qualifications that directly support operational needs and workforce readiness. With the expansion of the DoD 8140 Cyber Workforce Qualification Program, around 225,000 military, civilian, and contractor positions will have foundational and residential qualification criteria for each DoD Cyber Workforce Framework role. These roles align with our GIAC cybersecurity focus areas, including Cyber Defense, Forensics, Management, Cloud, and Offensive Operations, offering options that equip individuals with real-world skills and testing. This strategy and program aim to enable the DoD to develop and deploy an agile, capable, and ready cyber workforce."
full_description = '''What is DoDD 8140? The updated DoD 8140 Qualification Program, implemented February 2023, provides a comprehensive approach to managing cyber workforce talent. It establishes baseline standards for qualifications that directly support operational needs and workforce readiness. With the expansion of the DoD 8140 Cyber Workforce Qualification Program, around 225,000 military, civilian, and contractor positions will have foundational and residential qualification criteria for each DoD Cyber Workforce Framework role. These roles align with our GIAC cybersecurity focus areas, including Cyber Defense, Forensics, Management, Cloud, and Offensive Operations, offering options that equip individuals with real-world skills and testing. This strategy and program aim to enable the DoD to develop and deploy an agile, capable, and ready cyber workforce. View 8140 Brochure Who is Affected by DoDD 8140 All DoD personnel assigned to positions requiring the performance of cyberspace work, in accordance with the DoD Cyberspace Workforce Framework (DCWF). This includes Service members, DoD civilian employees (including non-appropriated fund employees), personnel who provide contracted services (referred to in this issuance as "contractors"), and foreign nationals. Office of the Secretary of DefenseMilitary DepartmentsChairman of the Joint Chiefs of StaffCombatant CommandsOffice of the Inspector General of the DoDUS Coast GuardDefense AgenciesDoD Field ActivitiesAll other organizational entities in the DoD DoDD 8140 Requires: Foundational QualificationProficiency Levels - Basic, Intermediate and AdvancedOptions - Certification (GIAC), Training (SANS) and Education (SANS EDU)Residential QualificationOn the Job Qualification - Always RequiredEnvironment-Specific Requirements - Component DiscretionAnnual MaintenanceCertification CPE's (Keep Current) or 20 Hours AnnuallyCompliance Timeline:DoD Cybersecurity WorkforceFoundational - 15 February 2025Residential - 15 February 2026DoD Cyberspace IT, Cyberspace Effects, Intelligence (Cyberspace), and Cyberspace Enabler Workforce ElementsFoundational - 15 February 2026Residential - 15 February 2027 Approved GIAC Certifications and Corresponding Affiliate Training* *Additional certification options are continuously being added to the DoD8140 Directive. Cyber Defense GIAC Defensible Security Architect Certification (GDSA) | SEC530: Defensible Security Architecture and Engineering Zero TrustGIAC Security Essentials Certification (GSEC) | SEC401: SANS Security Essentials Network, Endpoint & CloudGIAC Information Security Fundamentals (GISF) | SEC301: Intro to Cyber SecurityGIAC Foundational Cybersecurity Technologies (GFACT) | SEC275: Foundations, Computers, Technology and SecurityGIAC Certified Intrusion Analyst (GCIA) | SEC503: Network Monitoring and Threat Detection In-DepthGIAC Continuous Monitoring Certification (GMON) | SEC511: Continuous Monitoring & Security Operations Digital Forensics & Incident Response GIAC Certified Forensics Analyst (GCFA) | FOR508: Advanced Incident Response, Threat Hunting & Digital ForensicsGIAC Cyber Threat Intelligence (GCTI) | FOR578 Cyber Threat IntelligenceGIAC Certified Forensic Examiner (GCFE) | FOR500: Windows Forensic AnalysisGIAC Reverse Engineering Malware Certification (GREM) | FOR610: Reverse-Engineering Malware Offensive Operations GIAC Incident Handling Certification (GCIH) | SEC504: Hacker Tools, Techniques, and Incident HandlingGIAC Penetration Tester Certification (GPEN) | SEC560 Enterprise Pen Testing Cloud Security GIAC Cloud Security Essentials Certification (GCLD) | SEC488: Cloud Security EssentialsGIAC Cloud Security Automation (GCSA) | SEC540: Cloud Security & DevSecOps Automation Leadership GIAC Security Leadership (GSLC) | LDR512: Security Leadership Essentials for ManagersGIAC Strategic Planning, Policy, and Leadership (GSTRT) | LDR514: Security Strategic Planning, Policy, and Leadership Industrial Control Systems Global Industrial Cyber Security Professional Certification (GICSP) | ICS410: ICS/SCADA Security EssentialsGIAC Response and Industrial Defense (GRID) | ICS515: ICS Visibility, Detection, & Response SANS EDU Degree and Certificate Programs 8140 Framework Categories The 8140 Framework Categories are a high-level grouping of common cybersecurity functions. Select a category below to help you identify the right certifications and affiliate training for your current or desired cybersecurity role. Cyber IT Personnel who design, build, configure, operate, and maintain IT, networks, and capabilities. This includes actions to prioritize implement, evaluate, and dispose of IT as well as information resource management; and the management, storage, transmission, and display of data and information. Learn More Cybersecurity Personnel who secure, defend, and preserve data, networks, net-centric capabilities, and other designated systems by ensuring appropriate security controls and measures are in place, and taking internal defense actions. This includes access to system controls, monitoring, administration, and integration of cybersecurity into all aspects of engineering and acquisition of cyberspace capabilities. Learn More Cyber Enablers Personnel who perform work roles to support or facilitate the functions of cyber IT, cybersecurity, cyberspace effects, or intelligence workforce (cyberspace) work roles. This includes actions to support acquisition, training and leadership activities. Learn More Cyber Effects Personnel who plan, support, and execute cyberspace capabilities where the primary purpose is to externally defend or conduct force projection in or through cyberspace. Learn More Intelligence (Cyberspace) Personnel who collect, process, analyze, and disseminate information from all sources of intelligence on foreign actors' cyberspace programs, intentions, capabilities, research and development, and operational activities. Learn More Software Engineering Learn More Data/AI Coming Soon! Additional Information DoD CIO Workforce Innovation DirectorateDoD Cyber Workforce FrameworkDoD8140 Frequently Asked QuestionsDoD8140 PresentationDoD8140.3 ManualContact DoD DoD 8140 Cyber Workforce Qualification Provider Marketplace DoD CIO Cyber Workforce Recording Reviews Read what others have to say about SANS Training. Previous Next As our C4 systems become netcentric and more linked with our weapons systems, it is essential that our IA workforce be up to the task of securing our networks. I am proud to be on the cyber defense line with such a competent industry partner that understands the needs of the defense department and is willing to work with us to help accomplish this difficult task. Mike Knight - Naval NetWar Command Training offered by SANS pertains to best practices so rubber hits the road. Michael Emmons - USMC As part of the Raytheon IIS Information Security Engineering group, we send nearly all of our new hires through the SANS Security Essentials Bootcamp training classes to ensure they have the fundamental skills necessary to work in our environment. We view GIAC certifications as an essential part of this process. GIAC Certification helps ensure both our management and our customers that our employees understand how to build secure systems. Monty McDougal - Raytheon'''
year_published = 2025
