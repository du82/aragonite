full_description = "Policy Candidate Agreement Information about each candidate’s responsibility to abide by GIAC’s rules and policies for registration, test administration, and all other aspects of the program related to their certification attempt. Read More Policy Certification Attempt Delivery Policy Information on GIAC’s Certification Attempt Delivery Policy Read More Policy Code of Ethics Information on GIAC’s Code of Ethics and how to report an ethics violation. Read More Policy EEOC Policy GIAC is committed to promoting and ensuring equal employment and certification opportunity for all persons regardless of national origin, race, color, sex, religion, disability, age, or sexual orientation. Read More Policy Exam Integrity Policy Information on GIAC’s Exam Integrity Policy Read More Policy Extension Process Details about purchasing an extension to your certification attempt deadline. Read More Policy Feedback Procedure How and where to communicate feedback about your GIAC experience. Read More Policy Formal Appeal Procedure If applicable, how and where to submit a formal appeal. Read More Policy Formal Complaint Procedure If applicable, how and where to submit a formal complaint. Read More Policy GIAC Disability Accommodation Policy GIAC is committed to assisting customers with disabilities. Read more to learn about our accommodation policy. Read More Policy Minor Agreement Policy Information on GIAC’s Minor Agreement. Read More Policy Open Book Testing Guidelines Information on the materials you are allowed to bring into the testing environment. Read More Policy Privacy Policy Information on GIAC’s privacy policy. Read More Policy Proctor Program Overview Information on GIAC’s exam proctoring requirements. Read More Policy Refund Policy Information on GIAC’s refund policy. Read More Policy Retake Process Details about purchasing a retake after a failed certification attempt. Read More"
