s Agreement shall not constitute a waiver of such right or provision.Entire AgreementThis Agreement constitutes the entire understanding and agreement between the parties concerning the use of a SANS website, or SANS-provided training, products or services. If any provision of this Agreement is deemed invalid by a court of competent jurisdiction, the invalidity of such provision shall not affect the validity of the remaining provisions of this Agreement, which shall remain in full force and effect. This Agreement may not be amended except by a written amendment signed by both parties."
