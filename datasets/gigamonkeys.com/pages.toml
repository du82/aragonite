["https://gigamonkeys.com/feedback"]
title = "Feedback"
full_description = "I have been at Twitter for almost two years and now, in the midst of my third full bi-annual “feedback” cycle—the process by which Twitter employees write self-evaluations, peer-evaluations, and manager evaluations, and ultimately get some feedback delivered by their manager that tries to distill it all—it strikes me that if you could chart my probability of leaving Twitter over time, it would probably spike every six months sometime during feedback. Now, I may be a particularly grumpy fellow but, based on people’s Tweets and conversations around the office during feedback, I’m pretty sure I’m not the only person who finds feedback at best a meaningless chore and at worst a toxic, off-putting experience. And I don’t think this is unique to Twitter—most companies beyond a certain size have some similar kind of regularly scheduled process and I’ve never heard anyone say they really love the one at their company. As with any analysis of a process, the first step to analyzing these proceses is to understand what they are for. This can be tricky because most such processes are trying to do two things. On the one hand, they are the formal way we give each employee information on how they’re doing so they can do their job better and improve their professional skills. On the other hand, they are also often used to inform decisions around who gets promotions. These are actually, I’d argue, two quite different purposes. To tease them apart and see why it’s hard to achieve both at the same time, let’s look at how the process might look if it was purely about one or the other. A feedback process 100% aimed at professional growth would, I suspect, be totally divorced from promotions and compensation bumps. Not because those things should be unrelated to professional growth but because truly reflecting on how you can do better and being open to feedback from your peers and managers is already tremendously difficult; when you are also worrying about whether or not you’re going to get that promotion or raise you were hoping for, it’s probably impossible."
year_published = 2015
