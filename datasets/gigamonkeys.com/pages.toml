["https://gigamonkeys.com/push-hands"]
title = "Push Hands"
full_description = "It has been a few years since I trained, but Tai Chi—especially the partner practice of push hands—remains one of my favorite metaphors for human interactions. By way of a disclaimer I should say: I studied Tai Chi for a number of years at the excellent White Magnolia Tai Chi School under Miriam Marsolais and was, for some of those years, an instructor there. I also had the privilege of practicing push hands with Yadollah Moghaddam, one of Miram’s teachers and one of the great push hands players in Doc Fai Wong’s Plum Blossom Federation. However, my understanding of Tai Chi is my own and is almost certainly imperfect. My teachers should not be blamed for any confusion or misunderstandings I harbor. Leaving aside some of the more mystical aspects which I’m not qualified to say much about, the purpose of Tai Chi training is to teach your body to stay in balance and to move as a single flowing whole. Tai Chi’s most obvious characteristic, the almost slow motion pace at which it is normally practiced, is designed to accentuate any moments of imbalance and to allow you the time to feel whether or not your motions are fully involving your whole body. Indeed, you can start learning the lessons of Tai Chi by simply walking slowly and deliberately across the room. Try it and you will notice that in order to take a step with one foot, you have to adjust the rest of your body to maintain your balance while the lifted foot is in the air. If you pay attention you can learn to make the adjustments that allow you to maintain your balance with very little effort. Tai Chi forms—the stylized routines you may have seen people doing in parks—are just more difficult versions of these first slow steps. By the time you can perform the full 108-move classic long form of Tai Chi as a single flowing motion you will have developed a well-refined sense of how to move your body as a connected whole and keep it always in effortless balance. In other words, you will have learned to move through the world gracefully and without throwing yourself off balance. This—in Tai Chi as in the rest of life—is a real achievement and can be the work of a lifetime."
