["https://gigamonkeys.com/taste"]
title = "Taste"
full_description = "In programming, as in probably all creative fields, we speak of certain practitioners having good taste while others—sadly—lack it. Obviously, having good taste is generally better than the alternative, but opinions vary on how important it is. On the one hand, given that code—unlike say a painting or a piece of fiction—has a functional purpose, some folks take the point of view that the only thing that really matters is that a program works as desired; matters of taste may be fun to argue about at lunch but, back at our desks, they don’t really matter. On the other hand, anyone who’s maintained code knows that certain matters of taste are at least correlated with the code being correct. So we should care about taste because it is a leading indicator of quality—programmers with good taste are more likely to write correct code because they are obviously paying more attention to all the details of their code. But taste, in this view, is still not important for its own sake—it’s just a proxy for quality. It may not even matter exactly what they consider good taste; as long as they care enough to have opinions, that may be good enough. Indeed, the Latin epigram quoted above, loosely translated as, “In matters of taste, there can be no disputes”, is usually taken to mean there’s no point in arguing about taste because it is arbitrary. And we have plenty of English phrases that capture this sentiment: “just a matter of taste” or “there’s no accounting for taste”. Yet we also talk about “good taste”. Is there such a thing? As it turns out, the literal translation of the Latin phrase is, “About tastes, it must not to be discussed.” Which is, as my friend Oscar would say, some bullshit. Not only must we discuss taste but developing good taste is the primary task of all programmers. Yes, you have to learn your programming language and your frameworks and pick up some domain knowledge and learn to put it all together into something that works, but that’s not enough. If that’s all you’ve learned, you’re still a crappy programmer. Which is not to say you aren’t an employable programmer. But you won’t be a good programmer until you’ve also developed good taste. And worse than that, if you haven’t developed good taste, your code will blight the lives of your co-workers, destroy good human feelings, and make the world a worse place."
year_published = 2015
clearnet = "https://gigamonkeys.com/taste"
