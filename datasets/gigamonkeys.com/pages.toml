["https://gigamonkeys.com/turing"]
title = "Turing Test, Etc."
full_description = "Can machines think? If you believe what Madison Avenue tells you, you might think so—these days you can buy a “smart” dishwasher, or a car that “knows” when its lights are on or when the door is ajar and can tell you so in a soothing baritone. Hollywood, of course, loves the idea of thinking machines—from the menacing HAL from 2001: A Space Odyssey, to the lovable R2-D2 and C3P0 from the Star Wars series. The personification of machines probably began when people ascribed to their new, and sometimes balky automobile the personality of the old, and sometimes balky horse it replaced. But a more recent development is that our machinery’s personae have taken on a human character. In the middle of this century, the first electronic digital computers were built and suddenly the question, “can machines think?” was a going concern. In the October, 1950 issue of Mind: A Quarterly Review of Psychology and Philosophy, a British mathematician, Alan Turing, posed the question as a serious inquiry. His answer in the affirmative and his proposal of a simple but powerful test that would answer the question of whether a particular machine is thinking gave birth to Artificial Intelligence (AI)—a brand new field of intellectual inquiry and a whole new way of looking at one of the oldest unanswered questions of the human experience: what is a mind? I stopped by the Boston Computer Museum a few weeks ago to pick up a stack of computer printouts. I met a museum employee on the fifth floor, to whom I gave $24.00 for the 169 pages of printout in a manila envelope. The employee joked that it felt like some sort of secret deal. I said in my best espionage agent accent, “You gif me ze secret computer information, and I vill gif you ze money.” The envelope had the words “Turing test transcripts” penciled on the front and inside were the results of the first ever public trial of the test Turing proposed forty years ago—the transcripts from eighty conversations between ten human judges, six computers, and two human confederates. I wasn’t particularly optimistic about the chances of any of the computers giving any evidence of thinking but I did let myself dare to hope that there would be some slight glimmer of intelligence displayed in the transcripts."
year_published = 2025
