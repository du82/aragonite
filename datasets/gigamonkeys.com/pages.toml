["http://www.gigamonkeys.com/code-quarterly/2011/hal-abelson"]
title = "Code Quarterly"
full_description = "I’ve pulled the plug on Code Quarterly. To read about why, please see this blog post. Thanks for your interest. —Peter Seibel Hal Abelson is perhaps best known to programmers as the co-author, along with Gerald Sussman, of the classic book Structure and Interpretation of Computer Programs. He and Sussman also created the MIT course of the same name, the legendary 6.001, which between 1980 and 2007 was one of four required courses taken by all MIT Department of Electrical Engineering and Computer Science students, teaching them how to think about programming and, incidentally, introducing them to the Scheme programming language. Abelson is currently Class of 1922 Professor of Electrical Engineering and Computer Science at MIT and has been recognized within and outside of MIT for his contributions to computer science education. He was one of MIT’s six inaugural MacVicar Faculty Fellows, won MIT’s School of Engineering teaching award, the Bose Award, in 1992, and was awarded Taylor L. Booth Education Award by the IEEE Computer Society in 1995. In 2007, Abelson helped create MIT’s new core curriculum for EECS students, in which 6.001 was replaced with a new course, 6.01. Among other changes, the new course switched languages from Scheme to Python, a change that drew much commentary from outside observers. In this interview Abelson discusses the motivations behind the curriculum changes and why the switch from Scheme to Python is one of the least significant changes. Abelson has also long been involved in using computers for teaching non-programmers, having worked with Seymour Papert on the children’s programming language Logo and co-authoring the book Turtle Geometry. When I spoke with him, he was finishing a year-long sabbatical at Google, where he led the App Inventor project, building a development environment that allows non-programmers to develop apps for Android phones. Finally, Abelson is an advocate for open culture and intellectual commons. He is a founding director of the Free Software Foundation, Creative Commons, and Public Knowledge and teaches MIT’s 6.805 “Ethics and Law on the Electronic Frontier” and co-authored the book Blown to Bits, an introduction to many of the topics covered in that course aimed at a more general audience."
