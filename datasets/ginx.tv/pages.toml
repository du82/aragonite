description = "Get ready for the Teenage Mutant Ninja Turtles event in Call of Duty: Black Ops 6 and Warzone, with details on the release date and rewards below."
full_description = '''GINX TV > Guides & Tutorial > Call of Duty: Black Ops 6 Call of Duty: Black Ops 6 - Teenage Mutant Ninja Turtles Event Countdown and Rewards Get ready for the Teenage Mutant Ninja Turtles event in Call of Duty: Black Ops 6 and Warzone, with details on the release date and rewards below. By Shane Moosa | First Published February 26, 2025, 13:23 Activision With the midseason update, Reloaded, for Call of Duty: Black Ops 6 Season 2, a wave of exciting new content is on the way - and the Teenage Mutant Ninja Turtles collaboration is easily one of the biggest highlights. Everyone’s favorite heroes in a half-shell will be available as playable Operators, along with a wide array of rewards to unlock as you play. Let’s dive into the details, including when the TMNT event kicks off in Black Ops 6 Season 2 Reloaded, and share all the rewards up for grabs.COD Teenage Mutant Ninja Turtles Event Release Date and CountdownThe Teenage Mutant Ninja Turtles collaboration event will begin in Black Ops 6 and Warzone on February 27, 2025, at 10 AM PT/6 PM 6 UTC, and last for over two weeks, ending on March 13, 2025. The countdown timer below shows how much time is left until then. COD Teenage Mutant Ninja Turtles Event Countdown 1 days, 04:31:45 COD Teenage Mutant Ninja Turtles Event Content and RewardsThe event will feature a total of 20 rewards up for grabs. Ten of these will be available through a free tier, meaning you only need to play to earn them, with the final reward on this tier being the D13 Sector Weapon. The other ten rewards will be available through a $10 paid track, which unlocks as you progress after purchase. The final reward on this track is the Splinter Operator. The TMNT event will offer 20 unique rewards to claim - 10 available for free and 10 on a premium track. (Picture: Activision) Here’s a breakdown of the rewards available during the TMNT collaboration event in Black Ops 6 and Warzone: Rewards (Free Tier) Rewards (Premium Track) "Foot Clan" Operator Skin "Sensei's Support" Finishing Move "Clan Ties" Spray "Splinter's Cane" Melee Blueprint "Ninja Clan" Emblem "Infestation" Weapon Blueprint "Skateboard" New Melee Weapon "Sewer Surfer" Melee Blueprint "Pepperoni Power" Sticker "Family" Calling Card "Together" Loading Screen "The Master" Emblem "Belt Fed Magazine" Attachment "Robotic Ninja" Weapon Blueprint "Undead Foot Clan" Operator "Sliced" Weapon Blueprint "Thinker" Weapon Charm "Brainiac" Gun Screen "D13 Sector" New Weapon "Splinter" New Operator While the list of rewards is comprehensive, we still don’t know the exact XP requirements for each reward and tier. These details will likely be revealed at launch. Thankfully, there isn’t much time left until the event kicks off, and now you know exactly when to jump in and all the rewards you’ll be fighting for during the Black Ops 6 and Warzone TMNT collaboration event.'''
