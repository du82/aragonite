["https://ginx.tv/en/call-of-duty-black-ops-6/jumpscare-easter-egg-the-tomb"]
title = "How to Get the Jumpscare Easter Egg in Call of Duty: Black Ops 6 Zombies - The Tomb - GINX TV"
description = "Scare your friends (or yourself) with our guide on how to complete the Jumpscare Easter Egg in Call of Duty: Black Ops 6 Zombies – The Tomb."
full_description = "GINX TV > Guides & Tutorial > Call of Duty: Black Ops 6 How to Get the Jumpscare Easter Egg in Call of Duty: Black Ops 6 Zombies - The Tomb Scare your friends (or yourself) with our guide on how to complete the Jumpscare Easter Egg in Call of Duty: Black Ops 6 Zombies – The Tomb. By Shane Moosa | First Published February 5, 2025, 15:57 Activision The Tomb map in Call of Duty: Black Ops 6 Zombies brings a ton of new content and intense zombie-slaying action, but it’s also filled with hidden Easter eggs waiting to be discovered. One of these is the classic jumpscare Easter egg, which might catch you off guard - but the scare is well worth it, as it can be used to scare your friends or simply have some extra fun as you're playing through rounds.How to Get The Jumpscare Easter Egg in The TombThe Jumpscare Easter Egg in the Tomb map can be found in three different locations, and activating it is quite simple. All you need to do is locate one of the statues in the distance around the map that is facing away from you. When you spot a statue and interact with it through your scope, the Jumpscare Easter Egg will trigger once you pick up an item afterward. (Picture: YouTube / TheGamingRevolution) By aiming down your sights and staring at the statue, it will suddenly turn around, its eyes will glow red, and you’ll hear eerie whispers. Once this happens, if you or a teammate picks up a nearby item, the jumpscare will trigger - catching you off guard, especially if you aren’t expecting it.There are three statues scattered throughout the map that can activate this Jumpscare Easter Egg. Here’s where to find them in the game: There are three statue locations, and after interacting with one to trigger the jumpscare, you can repeat the process as the statues move and reappear across these spots. (Picture: YouTube / TheGamingRevolution) Statue 1: Located in the Neolithic Catacombs. Look through the hole in the wall to the right of the Deadshot Daiquiri Perk Machine. You’ll see a statue on a cliff beyond the wall. Statue 2: Also in the Neolithic Catacombs. Look to the left of the Mystery Box and through the hole in the wall to spot this statue. Statue 3: Found in Deep Excavation, at the east end of the map. Check the top of the rock structure above the Quick Revive Perk Machine. And there you have it - a quick guide on how to activate the Jumpscare Easter Egg in Call of Duty: Black Ops 6 Zombies – The Tomb map. Be sure to try it out next time you’re playing with friends or even solo for a fun surprise. Good luck out there, zombie slayers!"
