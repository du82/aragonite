full_description = '''GINX TV > Esports > News > Counter-Strike 2 The Mongolz Earns PGL Cluj-Napoca Playoffs Spot After Insane Match Against paiN Take a look at some of the highlights showcasing how The MongolZ overcame paiN Gaming to secure a spot at the PGL Cluj-Napoca 2025 playoffs. By Wessel Minnie | First Published February 17, 2025, 09:52 PGL The Group Stage of PGL Cluj-Napoca 2025 has delivered some utterly exciting Counter-Strike 2 (CS2) esports action, but none of the matches, for me, comes close to the paiN Gaming vs. The MongolZ slugfest.Yes, The MongolZ has secured a spot in the playoffs after defeating the Brazillian side paiN Gaming in an incredible best-of-three match that definitely went the distance.Read More: Vitality Sweeps Spirit in IEM Katowice 2025 Grand FinaleOn The MongolZ's map pick of Inferno, it was too close to call in regulation, with overtime required to separate the sides. The MongolZ ended up winning 16-13, but that was only half the story.paiN Gaming's Lucas "nqz" Soares scored a 4K in the first round of overtime during a 2v4 situation to put The MongolZ on the backfoot. let url6656 = "https://clips.twitch.tv/embed?clip=PleasantBraveWombatBatChest-yNtF3tPYdmFRrFT1&parent=" + window.location.hostname; document.getElementById("67b2e3996505d").src = url6656; However, to set up The MongolZ for map point, Azbayar "Senzu" Munkhbold showed immense skill to pull off a 2v1 clutch. let url9607 = "https://clips.twitch.tv/embed?clip=MoralGorgeousCheddarAliens-fqQlWX5nAPCBK7oz&parent=" + window.location.hostname; document.getElementById("67b2e3d1ce801").src = url9607; That didn't even compare to what transpired on paiN Gaming's map pick of Dust2. Again, overtime was required to separate the sides, and paiN Gaming came out on top with a 16-14 win.paiN Gaming's Rodrigo "biguzera" Bittencourt managed something truly incredible, with back-to-back 4Ks to put his team in the driving seat in overtime. Check out both plays below. let url8200 = "https://clips.twitch.tv/embed?clip=CreativeTentativeTapirCharlieBitMe-bZeMQ01REEGvbeg2&parent=" + window.location.hostname; document.getElementById("67b2e49671ee1").src = url8200; let url7595 = "https://clips.twitch.tv/embed?clip=CuteAcceptableLocustDeIlluminati-TFgY1U-g-iE6wVta&parent=" + window.location.hostname; document.getElementById("67b2e49f391e1").src = url7595; Now, for the last one, and it was an absolute banger! On the third and deciding map, Mirage, paiN Gaming took a solid 8-4 lead in the first half. Then, The MongolZ pulled off a 9-0 comeback on the CT side to win the match and secure a spot in the PGL Cluj-Napoca 2025 playoffs.To rub salt into the wounds, it was The MongolZ's rifler Azbayar "Senzu" Munkhbold who secured victory with a 4K. Check out the final highlight of the thrilling match below. let url7761 = "https://clips.twitch.tv/embed?clip=DepressedTenuousMilkSeemsGood-qxLeMzjzIQSCIb4j&parent=" + window.location.hostname; document.getElementById("67b2e54885728").src = url7761; Stay tuned to our esports section for all the latest news, updates, esports coverage, interviews, and more.'''
