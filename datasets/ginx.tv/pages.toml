full_description = '''GINX TV > Game Updates > Counter-Strike 2 Latest Counter-Strike 2 Update Patch Notes: All Fixes & Changes Find the latest Counter-Strike 2 (CS2) update patch notes featuring all the bug fixes, changes, and more that Valve is implementing. By Wessel Minnie | First Published February 25, 2025, 07:09 Valve Want to find out precisely what bug fixes and changes Valve has made in the latest Counter-Strike 2 (CS2) update via official patch notes? Then we've got you covered.This consistently updated article will always provide you with the latest, new Counter-Strike 2 update patch notes, diving into everything the developers are working on, from bug fixes to changes, optimizations, and much more. Update on 25 February 2025: We checked for any new Counter-Strike 2 updates and found some new patch notes to share! New Counter-Strike 2 (CS2) Update Patch Notes Follow the soundwaves to the latest CS2 update patch notes! (Picture: Valve) We are just going to get straight to it. Below, you can find the latest Counter-Strike 2 updates, and you can see via the CS2 patch notes that Valve is fixing a tonne of issues and bugs and making several additions/optimizations.Click on the dates to expand with the new CS2 patch notes. We will endeavor to have the three latest Counter-Strike 2 update details available in this section. 14 February 2025: Workshop map size [ UI ] Fixed sizing and scaling of UI elements shared between buy menu and in-game HUD. Fixed a bug with armor display for CSTV spectators. Updated alternate AK-47 inspect animation. [ WORKSHOP ] Increased supported upload size for Counter-Strike 2 Steam Workshop Maps to 3 GB. 7 February 2025: Premier adjustments [ PREMIER ] Adjusted the logic that determines when players are too far apart in CS Rating to participate in matchmaking together as a party. In most cases, players who used to play together as a party in Premier Season One will be able to party together in Premier Season Two. [ UI ] Added "Get Service Medal" UI element directly to the main menu profile card. Fixed a case where main menu profiles were missing display medals. Updated Dust II radar image to be more accurate. [ MISC ] Fixed a case where inspect or reload button presses could cause prediction errors. 4 February 2025: Several fixes Fixed AUG scope stencil filter bug near water surfaces. Fixed Premier progress bar not displaying properly in low resolutions. Fixed certain UI panels not rendering transparently when using CMAA2 and HDR performance settings simultaneously. Improved dynamic radar scale to snap size when a newly discovered enemy/C4 enters radar view, but still shrink gradually when enemy/C4 disappears and enough time passes. Fixed radar scale settings UI to support full range of radar scale from 0.25 to 1.0 values. Fixed sounds from Train inspect scenery not getting cleared when going back to the main menu. Fixed misprediction error smoothing near walls to avoid clipping through walls. Fixed cloth simulation bug on loopback=1 local servers. 30 January 2025: Small update [ MAPS ] Basalt - updated to the latest version from the Community Workshop (Update Notes). [ MISC ] Activated Premier Season Two progress indicator in the play menu. Fixed regressions with AUG/SG scope graphics. 29 January 2025: Season 2! [ PREMIER ] Premier Season Two is here, and Premier matchmaking has resumed Every player who earned a CS Rating during Season One will receive a commemorative Premier Season One Medal which includes detailed Season Statistics Every player will have their CS Rating recalibrated based on their Season One performance, and will need to re-establish their CS Rating by winning 10 matches Train has been added to the Active Duty map pool Vertigo has been removed from the Active Duty map pool [ GAMEPLAY ] M4A4 price reduced to $2,900 FAMAS accuracy improved and price reduced to $1,950 Reduced crouching accuracy for the MP9, MP5-SD, and MP7 Adjusted scope dot on AUG/SG to be more useable at range [ UI ] Added a new radar dynamic zoom option that will grow or shrink the radar to include your team mates, bomb and other detected elements Adjusted grenade order in spectator UI to match weapon selection order Increased brightness of carried C4 in UI [ MAPS ]Train Removed a boost angle from Long Dog to Bombsite A Fixed lighting artifacts on double-sided materials [ MISC ] Added fallback logic to allow playing incomplete demo files, either copied from an ongoing live match or recovered after a game server crash Fixed an exploit where users could use secondary fire on R8 Revolver and then sell it back Counter-strafe summaries are now available in game server log data distributed via log address in addition to console logs 22 January 2025: Misc fixes [ MISC ] Minor performance optimization for some CPU-bound cases. Follow recoil setting during spectating will now obey spectator target's crosshair setting if target's crosshair is shown. Added support for updating existing map annotations on Steam Workshop. For example use "workshop_annotation_submit 123456" to update your submission ID=123456 found in the workshop URL. Passing an ID that does not belong to you will create a brand new submission. After the first update the ID will get embedded in the annotation file and you can submit more changes without having to provide the ID again. 17 January 2025: Misc fixes Updating Steam libraries for Linux game servers to the latest version of Steam Client Beta Improved Linux game servers ability to reconnect to Steam after a disconnection Stability improvements 15 January 2025: Shanghai Major stickers go on sale [ SHANGHAI MAJOR ] Shanghai 2024 Major sticker capsules are now on sale for 75% off [ ARMORY ] Desert Eagle | Heat Treated is no longer available to claim from The Armory [ MISC ] Fixed finger placement during Huntsman knife in-game inspect animation Fixed a bug where grenade icons weren't disappearing on the spectator map Fixed a case when spectator icon could show up at the wrong time on the radar Fixed a bug related to changing inspect scenery while inspecting knives 10 January 2025: Train changes and bug fixes Counter-Strike 2 Update [ MAPS ] Train Fixed various minor visual bugs and gaps in world Added dirt and wetness onto crates and tarps where appropriate Widened opening on A site between Hell and Tunnels Opened container door on back of the train near Ivy/Tunnels Added dumpster by Ivy Added barrels in A site cubby Pushed back T spawns a little [ MISC ] Fixed a case where ragdolls could get created with extreme initial velocities Added markup for individual matches in Steam Game Recording timeline Fixed a regression where deploying weapons weren't allowing immediate inspecting Fixed fingers crossing into butterfly knife geometry during inspect animation Fixed weekly care package preview of weapon cases not having a close button When moving away from annotation nodes, required grenade is no longer removed 8 January 2025: More CS2 Fixes [ MAPS ] Inferno Adjusted clipping on stairs under balcony [ MISC ] Fixed offset discrepancy in legacy SSG08 model. Fixed stickers mask on legacy Dual Elites magazine model. Fixed Dual Elite pistol holster floating off the local firstperson leg model. Fixed a regression in grenade interactions with ragdolls. Fixed a bug where +attack2 and +lookatweapon composite binding could get silenced weapon into an inconsistent silencer state. 20 December 2024: Minor fixes [ MAPS ] Inferno Adjusted clipping on scaffolding on B site [ MISC ] Fixed a problem on team select screen for servers with no auto-select time limit. Fixed a regression with annotation_load command. Fixed a crash for give item_assaultsuit command. Adjusted the rarity of the rare AK-47 inspect animation. Fixed a regression with the rare Desert Eagle inspect animation. 19 December 2024: CS2 gameplay adjustments & map fixes/changes Counter-Strike 2 Update [ SHANGHAI MAJOR ] Shanghai 2024 Major Champions Capsule is now available for purchase. The capsule features autographs for each member of the winning team in paper, glitter, holo, and gold. 50% of the proceeds go to the players and organizations. [ GAMEPLAY ] Adjusted the threshold at which death notice displays attacker as "flashed". Explosions will now more reliably throw weapons around even if multiple weapons are dropped on top of each other. During warmup, weapons will no longer drop on the ground when changing teams. During warmup, changing teams now has a two second cooldown. Added server settings controlling which items drop on the ground during warmup period: mp_warmup_items_drop_policy, mp_warmup_items_nocost, mp_warmup_items_nocount_policy. Community servers that run with free non-droppable weapons during warmup can set these settings as follows: mp_warmup_items_drop_policy 0, mp_warmup_items_nocost 1, mp_warmup_items_nocount_policy 251. Give command will now always drop the held weapon if the given weapon needs an empty primary/secondary weapon slot to be used. For legacy behaviour, which would drop the new weapon on the ground, developers can use "-keep_gear" flag, e.g. give weapon_awp -keep_gear [ MAPS ] Train Improved collision fidelity on various props Updated and fixed surface types on several props Adjusted wetness levels on some surfaces Fixed various gaps in map [ MAP GUIDES ] Map Guides are now supported in the Steam Workshop for submission and subscription. Added a selector to pick which map guide gets loaded in practice mode. Annotations nodes are now visible in the radar. Added a tool (via console command "workshop_annotation_submit") to submit a map guide to the Steam Workshop. [ MISC ] Added a setting for CPU Cores Usage Preference to control how high performance and power efficiency cores are used by the game on CPUs with variable cores. Fixed a case where graphics driver could render a corrupt graphics image for weapons in inventory item tiles. Improvements to weapon inspect animations. Improvements to display of extra-long custom weapon names in UI. Stability improvements. Added all-new 2025 Service Medal which will be available starting January 1st GMT Workshop Tools - Fixed bug on shadows for low sunlight angles 4 December 2024: Shanghai Major update and fixes [ SHANGHAI MAJOR ] Updated MIBR player sticker items autographed by Lucaozy with the autographs of brnz4n. Fixed a UI bug that allowed dropping Pick'Em team logos outside of Major Pick'Em hub using both mouse buttons. Pick'Em challenge picks can now be placed for the upcoming Elimination Stage of Shanghai Major. [ DAMAGE PREDICTION ] Predicted ragdolls without a confirmation or correction from the server within a short time window will now revert. [ MAPS ] Train Increased collision fidelity of several models Overpass Replaced railing inside Heaven with a wallAdditional visibility improvements in Heaven Edin Updated to the latest version from the Community Workshop (Update Notes) Palais Updated to the latest version from the Community Workshop (Update Notes) [ MISC ] Fixed 'boost player contrast' visibility rendering option sometimes revealing parts of players or weapons through thin surfaces. Added r_allow_low_gpu_memory_mode setting to allow running CS2 Workshop Tools in low memory GPU conditions. Fixed various bugs in Hammer. 28 November 2024: Shanghai Major 2024 Stickers and Viewer Pass released! [ SHANGHAI 2024 MAJOR ] The Shanghai Major Hub is now available. Visit the hub to purchase tournament items, play the Pick'Em Challenge and more. Purchase a Shanghai 2024 Viewer Pass to receive an upgradable Shanghai 2024 Coin. With an active pass, you can upgrade your coin and earn extra souvenir packages by playing the Pick'Em Challenge. Additionally, you will show up on the Active Pass Leaderboard where you can compare your Pick'Em Challenge performance to your friends. All players with Prime status can place Pick'Em picks for free! However, to complete challenges and earn rewards from an event stage, you will have to activate a Viewer Pass before that stage begins. [ MUSIC KITS ] A new music kit “Ay Hey” by Perfect World is now available for purchase in-game in standard and StatTrak versions. [ GAMEPLAY ] Added "sv_quantize_movement_input" setting, enabled by default, to keep players from using analog binds to move at fractional speeds that the game is not designed to handle. In cases when servers toggle some game rules from competitive to deathmatch and back to competitive mid-match, the weapons will no longer disappear when dropped on the ground, but toggling game rules settings without reloading the map is not a generally supported workflow for community servers. [ ANNOTATIONS ] Added support for turning off text background Added support for grenade types other than Smoke Increased node limit from 100 to 300 Fixed annotation_delete_previous_node not cleaning up particle effects [ MISC ] Added ability to rent weapons from all previous CS:GO weapon cases. Added policy settings to enforce client delta ticks order, namely sv_deltaticks_enforce and sv_deltaticks_log, which should help diagnosing configurations causing delta ticks out of order disconnects. Fixed a case where an unlocalized #SLOT prefix could appear in chat. Added a reference Counter-Strike Broadcast Playcast Webserver implementation: https://developer.valvesoftware.com/wiki/Counter-Strike:_Global_Offensive_Broadcast#Reference_Playcast_Webserver_Implementation [ MAPS ]Basalt Updated to latest version from Community Workshop (Update Notes) Train Fixed various gaps in map Collision fidelity upgrades Blockers added for train in B to avoid unfair angles Various visual fixes 20 November 2024: Map fixes and changes [ GAMEPLAY ] Fixed a case where a disconnected player could cause a poltergeist CT model to appear in the middle of the map Player model of a disconnecting player should now immediately suicide when disconnect is detected instead of lingering for 10 additional seconds under certain conditions Fixed a case where damage prediction was incorrect due to view angle changes mid-spray Lag compensation now runs when shooting at teammates and mp_teammates_are_enemies is enabled even when mp_friendlyfire is disabled [ UI ] Fixed layout inconsistencies for ranks display and player profiles [ MAPS ]Train Updated sounds on main menu background Improved movement around ladders Fixed various gaps in map Fixed z-fighting in various spots Inferno Fixed various holes Adjusted clipping in multiple spots Fixed various texture bugs Nuke Fixed a spot that players could get stuck on Office Fixed a case where a T would spawn in the air Arguably, one of the biggest gameplay changes between CS:GO and Counter-Strike 2 is, of course, the responsive smokes, alongside the sub-tick rate servers and map adjustments/changes. Check out details on the former via an official video from Valve below. So there you have it, the latest Counter-Strike 2 (CS2) patch notes for the latest updates Valve has released, focusing on bug fixes, additions, content, '''
