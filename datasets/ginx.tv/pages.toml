["https://ginx.tv/en/call-of-duty-black-ops-6/zombies-mansion-map-leaks-details"]
title = "Call of Duty: Black Ops 6 Zombies - Mansion Map Leaks and Details - GINX TV"
description = "Leaks suggest that The Mansion could be the next Call of Duty: Black Ops 6 Zombies map, bringing players back to Liberty Falls. Here’s everything we know so far."
full_description = "GINX TV > Game Updates > Call of Duty: Black Ops 6 Call of Duty: Black Ops 6 Zombies - Mansion Map Leaks and Details Leaks suggest that The Mansion could be the next Call of Duty: Black Ops 6 Zombies map, bringing players back to Liberty Falls. Here’s everything we know so far. By Shane Moosa | First Published February 11, 2025, 17:37 Activision With the Tomb map in Call of Duty: Black Ops 6 Zombies now fully explored, players have uncovered most - if not all - of its secrets. Naturally, attention is shifting to the next map in the lineup. While there’s no official confirmation yet, recent leaks suggest that the next setting could be the Mansion map. Below, we’ll summarize all the details revealed so far and what to expect next for Black Ops 6 Zombies.Black Ops 6 Zombies: The Mansion Could Be the Next MapAs of now, the next Zombies map for Black Ops 6 hasn't been officially confirmed. However, based on the ending of The Tomb's final cutscene and main quest, players will seemingly return to Liberty Falls Mansion for an unknown reason. While there's no confirmed release date, leaks suggest The Mansion map could arrive in Season 3, either at launch or as a mid-season update. I don't think so honestly lol I think it'll be S4. S3 you'd think with Verdansk but given Mansion is a small map I think it comes S3. — Hope (@TheGhostOfHope) February 6, 2025 This information comes from leaker @TheGhostOfHope, who speculates that all remaining seasons - except one - will introduce a new Zombies map. Given the expected size of The Mansion, which is rumored to be relatively small, it could be released sooner rather than later.What We Know About the Mansion Zombies MapPost-Easter Egg cutscenes from Terminus and Citadelle Des Morts heavily hint that the next battlefield will be inside Liberty Falls’ Mansion. This location is significant, as it houses S.A.M. (Synaptic Algorithm Module), an AI-based on Samantha Maxis. It was also Edward Richtofen’s residence before his mysterious disappearance. Based on the Easter Egg cutscenes from Terminus and Citadelle Des Morts, it's clear that we'll be returning to Liberty Falls in the near future. (Picture: YouTube / TheGamingRevolution) Leaks suggest that the mansion will be a smaller map, which has already disappointed some players who found The Tomb too compact. However, in-game cinematics reveal an elevator leading to a hidden basement where The Forsaken is contained, suggesting the map may offer more depth than it initially appears.Additionally, fans speculate that the Wunderwaffe DG-2 will make a return, as Richtofen has been seen wielding it. Originally introduced in Shi No Numa, this classic Wonder Weapon could play a key role in the mansion’s storyline, further connecting the map to the former Requiem Director. If we return to The Mansion, it's likely we'll also see the return of the Wunderwaffe Wonder Weapon, along with plenty of exciting new features. (Picture: YouTube / TheGamingRevolution) For now, that's everything we know about the rumored Mansion map in Call of Duty: Black Ops 6 Zombies. We’ll be keeping an eye out for official details, and as soon as more information emerges, we’ll update this article to keep you covered."
