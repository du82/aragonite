full_description = "APCA MYNDEX RESEARCH APCA ⇦ HOME ⇧ UP ONE APCA — LICENSE and RESTRICTIONS Patent(s) pending. Copyright Code and documentation in THIS repository is copyright © 2019-2022 by Andrew Somers and/or Myndex™. All Rights Reserved. Permitted Use For THIS repo only: Registered Beta Testers OR Personal use only is permitted unless authorized in writing, and subject to the limitations described herein. But ask We’re easy. We mainly want to ensure the code is maintained up to day and correctly implemented. The Short Summary: The files currently in this repository are presently considered pre-release, and as such do not have a permanent license attached. In this repository, all files present are under a time-barred beta license, and intended for use with web-based content only, and not for any other use without written permission. See also: Minimum compliance to use “APCA” and related trademarks. All Files Copyright (c) 2019-2022 by Myndex Research and Andrew Somers. All Rights Reserved. W3 LICENSED FILES MOVED TO W3 REPO All files that are part of the W3 license agreement are now in a separate repo: https://github.com/Myndex/apca-w3/ https://www.npmjs.com/package/apca-w3 ______ NON COMMERCIAL VERSION DISCLAIMER AND RESTRICTIONS DISCLAIMER AND LIMITATIONS OF USE: SAPC and the APCA is an embodiment of certain supra-threshold contrast prediction technologies and it is licensed on a limited basis for web content only. APCA may be used in non-commercial software for predicting contrast for web content, and used for that specific purpose without royalty. Said license excludes other use cases not related to web content. Prohibited uses include medical, clinical evaluation, human safety related, aerospace, transportation, military applications, and uses which are not specific to web-based content presented on self-illuminated displays or devices. RIGHT TO AUDIT CODE Any integration of APCA, SAPC, or SACAM which is in a commercial app or behind a paywall, free access must be provided to Myndex Research, or their assigns, on request, for the purpose of evaluating and verifying correct operations and implementation of the APCA/SAPC/SACAM functions. NO ALTERATION; KEEP CURRENT Any SAPC/APCA files in this repository may be used or incorporated only in tools for web-based content or web related content in support of the WCAG accessibility guidelines, and such use must be without modification to the essential elements of the code or specific approved constants, except as required to port to a given language. Developers incorporating this code into their applications, widgets, or other tools, have a duty to ensure that the most recent version of this code is used in their current or any future release. Breaking change exception: developers do not need to incorporate a future version of APCA that has breaking changes if their release is only a minor or patch version per semantic versioning. developers with minor or patch revisions are still obligated to use the latest non-breaking branch of APCA. developers with a major revision per semantic versioning are obligated to use the most recent stable APCA. USE OF THE APCA LOGO AND TRADEMARK Use of the APCA or “Powered by APCA” logos or trademarks are prohibited without written consent from Myndex™ Technologies, Myndex™ Research, Andrew Somers, and/or the authorized agents or assigns. Developers wishing to use the APCA or “Powered by APCA” logos or trademarks must submit their application or tools for qualification to be granted a limited license to use the APCA or “Powered by APCA” logos or trademarks. Formal details on the APCA and “Powered by APCA” qualification process are pending. In the interim, make a qualification request in the discussion tab of this repo. GENERAL DISCLAIMER THE SOFTWARE IS PROVIDED “AS IS”, WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVE