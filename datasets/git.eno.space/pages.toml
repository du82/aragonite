iteral.Number.Integer */ .highlight .mo { color: #00D; font-weight: bold } /* Literal.Number.Oct */ .highlight .sa { color: #D20; background-color: #FFF0F0 } /* Literal.String.Affix */ .highlight .sb { color: #D20; background-color: #FFF0F0 } /* Literal.String.Backtick */ .highlight .sc { color: #D20; background-color: #FFF0F0 } /* Literal.String.Char */ .highlight .dl { color: #D20; background-color: #FFF0F0 } /* Literal.String.Delimiter */ .highlight .sd { color: #D20; background-color: #FFF0F0 } /* Literal.String.Doc */ .highlight .s2 { color: #D20; background-color: #FFF0F0 } /* Literal.String.Double */ .highlight .se { color: #04D; background-color: #FFF0F0 } /* Literal.String.Escape */ .highlight .sh { color: #D20; background-color: #FFF0F0 } /* Literal.String.Heredoc */ .highlight .si { color: #33B; background-color: #FFF0F0 } /* Literal.String.Interpol */ .highlight .sx { color: #2B2; background-color: #F0FFF0 } /* Literal.String.Other */ .highlight .sr { color: #080; background-color: #FFF0FF } /* Literal.String.Regex */ .highlight .s1 { color: #D20; background-color: #FFF0F0 } /* Literal.String.Single */ .highlight .ss { color: #A60; background-color: #FFF0F0 } /* Literal.String.Symbol */ .highlight .bp { color: #038 } /* Name.Builtin.Pseudo */ .highlight .fm { color: #06B; font-weight: bold } /* Name.Function.Magic */ .highlight .vc { color: #369 } /* Name.Variable.Class */ .highlight .vg { color: #D70 } /* Name.Variable.Global */ .highlight .vi { color: #33B } /* Name.Variable.Instance */ .highlight .vm { color: #369 } /* Name.Variable.Magic */ .highlight .il { color: #00D; font-weight: bold } /* Literal.Number.Integer.Long */#!/bin/sh /etc/rc.common EXTRA_COMMANDS="apply_reboot prepare_reload apply_reload commit" START=99 _unregister_script() { /etc/init.d/config_generation disable rm /etc/init.d/config_generation } _rollback() { rm -rf /overlay/upper.dead mv /overlay/upper /overlay/upper.dead # this should never fail, unless something *else* is also mucking # with overlayfs state. if mv -T /overlay/upper.prev /overlay/upper; then rm -rf /overlay/upper.dead else echo "rollback failed, manual recovery needed. check /overlay/upper.dead!" >&2 exit 1 fi } _prepare_apply() { CYAN='\e[36m' RED='\e[31m' NORMAL='\e[0m' log() { printf "$CYAN>> %s$NORMAL\n" "$*" } log_err() { printf "$RED>> %s$NORMAL\n" "$*" } if [ -e /overlay/upper.dead ]; then log_err "previous failed deployment still needs recovery" exit 1 fi if ! rm -rf /overlay/upper.prev/ \ || ! cp -al /overlay/upper/ /overlay/upper.prev/ \ || ! rm -rf /overlay/upper.prev/etc/ \ || ! cp -a /overlay/upper/etc/ /overlay/upper.prev/ then log_err "failed to snapshot old config" rm -rf /overlay/upper.prev exit 1 fi if ! /etc/init.d/config_generation enable then log_err "failed to schedule rollback" rm -rf /overlay/upper.prev exit 1 fi } _run_steps() { ( set -e @deploy_steps@ ) } apply_reboot() { _prepare_apply # everything after this point may fail. if it does we'll simply roll back # immediately and reboot. trap 'reboot &' EXIT if ! _run_steps; then log_err 'deployment failed, rolling back and rebooting ...' _rollback exit 1 fi log 'rebooting device ...' } prepare_reload() { mkdir /overlay/upper.prev /etc/init.d/config_generation enable } apply_reload() { _prepare_apply # everything after this point may fail. if it does we'll simply roll back # immediately and reboot. trap 'reboot &' EXIT if _run_steps; then trap '' EXIT log 'reloading config ...' reload_config # give service restarts a chance log 'waiting @reload_service_wait@s for services ...' sleep @reload_service_wait@ exit 0 else log_err 'deployment failed, rolling back and rebooting ...' _rollback exit 1 fi } commit() { if ! [ -e /overlay/upper.prev ]; then exit 1 fi touch /tmp/.abort-rollback } start() { [ -d /overlay/upper.prev ] || { _unregister_script exit 0 } local needs_rollback=true local timeout=@rollback_timeout@ while [ $timeout -gt 0 ]; do timeout=$(( timeout - 1 )) [ -e /tmp/.abort-rollback ] && { needs_rollback=false rm /tmp/.abort-rollback break } sleep 1 done if $needs_rollback; then _rollback _unregister_script reboot else rm -rf /overlay/upper.prev _unregister_script fi }'''
