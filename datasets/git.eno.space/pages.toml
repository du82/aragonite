full_description = "Commit message (Expand)AuthorAgeFilesLines * update for depsHEADmainpennae2024-08-177-478/+639 * fix for nixos postgres ensure* changespennae2024-04-022-6/+4 * update dependencies ∴ version 0.1.1pennae2023-10-153-258/+281 * update for lots of cratespennae2023-07-273-627/+646 * update for remove_dir_all advisorypennae2023-03-071-159/+168 * update dependenciespennae2023-02-043-772/+687 * update, checkInputs -> nativeCheckInputspennae2023-02-042-15/+15 * switch to hyper backend for web-pushpennae2023-02-042-2/+9 * convert module to md docspennae2023-01-161-7/+10 * update dependenciespennae2022-08-101-142/+209 * don't allow users to edit devices of other userspennae2022-08-104-0/+77 * properly ignore fenix webchannel errors & add notepennae2022-08-081-1/+7 * fenix login is actually a lot simplerpennae2022-08-073-94/+21 * add some extra warning to readmepennae2022-07-261-5/+13 * improve the readme slightly, add licensepennae2022-07-252-2/+38 * add support for smtp authenticationpennae2022-07-253-11/+38 * add cargo-audit to the flakepennae2022-07-251-0/+1 * remove dependency on chronopennae2022-07-2511-62/+46 * make the main settings ui a bit nicerpennae2022-07-232-15/+45 * auto-focus input fieldspennae2022-07-231-0/+21 * rewrite the ui using web componentspennae2022-07-232-680/+782 * don't use lettre connection poolspennae2022-07-191-1/+5 * add mail_starttls parameter, default offpennae2022-07-193-1/+15 * add modulepennae2022-07-192-1/+151 * speed up test suitepennae2022-07-1811-1110/+1140 * cancel periodic task runners on shutdownpennae2022-07-181-19/+40 * make the Clone bytes types Copy as wellpennae2022-07-178-28/+18 * remove Seal from cryptopennae2022-07-171-10/+1 * remove SecretBytespennae2022-07-174-85/+30 * use SecretKey for key material in cryptopennae2022-07-174-53/+58 * use HawkKey everywhere hawk keys are handledpennae2022-07-176-85/+44 * add dedicated types for all the tokenspennae2022-07-176-84/+175 * make crypto fields private if they're not used outside cryptopennae2022-07-171-7/+7 * don't use SecretBytes in HawkKey/SecretKeypennae2022-07-175-33/+37 * remove zeroize dependencypennae2022-07-173-10/+1 * remove remnants of trying to quickcheck thingspennae2022-07-171-4/+0 * apply rustfmtpennae2022-07-174-4/+8 * fix clippy warningspennae2022-07-174-4/+6 * add test vector for password changes and account resetpennae2022-07-161-1/+48 * allow integration tests to run in parallelpennae2022-07-148-56/+77 * simplify spawn_loggedpennae2022-07-141-23/+7 * xfail a test the last commit brokepennae2022-07-141-0/+1 * keep oauth tokens around a bit after expirypennae2022-07-134-16/+27 * add downgrade migration for first schema versionpennae2022-07-131-1/+44 * fix avatar change showing an error and not reloading the pagepennae2022-07-131-0/+1 * initial importpennae2022-07-1362-0/+16966"
