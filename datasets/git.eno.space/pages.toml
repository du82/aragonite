color: #00D; font-weight: bold } /* Literal.Number.Oct */ .highlight .sa { color: #D20; background-color: #FFF0F0 } /* Literal.String.Affix */ .highlight .sb { color: #D20; background-color: #FFF0F0 } /* Literal.String.Backtick */ .highlight .sc { color: #D20; background-color: #FFF0F0 } /* Literal.String.Char */ .highlight .dl { color: #D20; background-color: #FFF0F0 } /* Literal.String.Delimiter */ .highlight .sd { color: #D20; background-color: #FFF0F0 } /* Literal.String.Doc */ .highlight .s2 { color: #D20; background-color: #FFF0F0 } /* Literal.String.Double */ .highlight .se { color: #04D; background-color: #FFF0F0 } /* Literal.String.Escape */ .highlight .sh { color: #D20; background-color: #FFF0F0 } /* Literal.String.Heredoc */ .highlight .si { color: #33B; background-color: #FFF0F0 } /* Literal.String.Interpol */ .highlight .sx { color: #2B2; background-color: #F0FFF0 } /* Literal.String.Other */ .highlight .sr { color: #080; background-color: #FFF0FF } /* Literal.String.Regex */ .highlight .s1 { color: #D20; background-color: #FFF0F0 } /* Literal.String.Single */ .highlight .ss { color: #A60; background-color: #FFF0F0 } /* Literal.String.Symbol */ .highlight .bp { color: #038 } /* Name.Builtin.Pseudo */ .highlight .fm { color: #06B; font-weight: bold } /* Name.Function.Magic */ .highlight .vc { color: #369 } /* Name.Variable.Class */ .highlight .vg { color: #D70 } /* Name.Variable.Global */ .highlight .vi { color: #33B } /* Name.Variable.Instance */ .highlight .vm { color: #369 } /* Name.Variable.Magic */ .highlight .il { color: #00D; font-weight: bold } /* Literal.Number.Integer.Long */[default] # identifier used in http response headers ident = "minor skulk" # limit to request parameter size. must be at least 32KiB. limits.string = "32 KiB" # limit to binary data size. avatars are sent as binary data, # so this setting also limits the maximum permissible avatar # size. limits.bytes = "128 KiB" # connection string for the database (mandatory) # # current only postgresql is supported, with libpq connection strings. # #database_url = "postgresql:///minorskulk" # base location of the server (mandatory) # # this is the base url of the server, e.g. `https://my.domain` if you are running # at the root of a domain or `https://my.domain/minorskulk` if you are running # behind a reverse proxy that changes the root path. # NOTE: if this is set incorrectly, *nothing will work*. the url is used as part # of a request signing scheme, so setting this incorrectly will break all requests # that use this signing scheme (which includes the login process). # #location = "https://my.domain" # base location of the synstorage token server (mandatory) # # this is the base url of your syncstorage token server, i.e. a syncstorage-rs # instance. the token server must also be configured to use this instance to # verify client tokens by setting `tokenserver.fxa_email_domain` to some local # value and `tokenserver.fxa_oauth_server_url` to `<location>/oauth/v1`. # # this url will only be rendered into the client autoconfig descriptor. setting # an incorrect url here will not impact the function of minor skulk, but it will # require setting not just the account server url in firefox but the token server # url as well. # #token_server_location = "https://synstorage.my.domain" # vapid key for push notifications (mandatory) # # this must be set to the path to a valid EC key, generated for example with # # openssl ecparam -genkey -name prime256v1 -out private_key.pem # # not setting this key will cause all push notifications to fail, including tab # sending between devices on one account. # #vapid_key = "/etc/secrets/minor-skulk-push-key.pem" # vapid subject identifier (mandatory) # # must be set to a mailto: address or a web url. mozilla ostensibly uses this # information to contact you if weird things happen, and will reject pushes # from server that do not provide this datum. #vapid_subject = "mailto:minorskulk@my.domain" # default push notification TTL (optional) # # default lifetime of push notifications sent through the mozilla webpush service. # notifications that cannot be delivered within this time frame will be dropped. # #default_push_ttl = "2 days" # expired token prune interval (optional) # # pruning interval for: # - expired key fetch token # - expired oauth tokens # - expired oauth authorization code # - expired device commands # - expired invite codes # #prune_expired_interval = "5 minutes" # mail-from address (mandatory) # # all emails sent by minor skulk will be sent from this address. # #mail_from = "minor skulk <noreply@my.domain>" # mail host (optional) # # mail host to use when sending emails. # #mail_host = "localhost" # mail port (optional) # # port to use when connecting to `mail_host`. # #mail_port = 25 # mail user (optional) # # user name to use in smtp auth with `mail_host`. no authentication # will be attempted if unset. # #mail_user = user # mail password (optional) # # password to use in smtp auth with `mail_host`. no authentication # will be attempted if unset. # #mail_password = verysecretpassword # mail starttls support (optional) # # whether or not to use starttls for mail connections. # #mail_starttls = false # invite only mode (optional) # # if set this instance will run in invite-only mode, disabling public # registrations and requiring a single-use invite link to create a new # account instead. invite links can be generated by the invite admin # using the special (hidden) `#/generate-invite` fragment identifier # on their account settings page. # #invite_only = false # invite admin (optional) # # email address of the user capable of creating invite links. if no user # is registered with the configured email address during startup a new # invite code will be generated (valid for one hour) and written to the # log. this check is done on every startup, so not setting this value will # produce a new invite code every time minor skulk starts. # #invite_admin_address = "admin@my.domain"'
