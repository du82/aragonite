 of the message that is being replied to, or zero if none (uint32) // 8-9: The message type (uint16) // 10-13: The payload length, in bytes (uint32) // 14-?: The payload // // The message type is a value of the ProtoMessageType enum. // The payload will be a protobuf message corresponding to the type's enum name. // For example, for the type PROTO_ERROR, the payload will be of type ProtoMessageError. // // Message layout shall not change between versions. // // # Version Negotiation // The protocol negotiation stage must occur immediately after a connection is opened. // Steps are as follows: // 1. Client sends PROTO_VERSION with its protocol version. // 2. Server replies with either PROTO_VERSION_ACCEPTED or PROTO_VERSION_REJECTED // a. If PROTO_VERSION_REJECTED, the server's protocol version, a reason enum value and optionally a message will be provided. // b. If PROTO_VERSION_ACCEPTED, the server's protocol version will be provided. // c. If the server received any message type other than PROTO_VERSION, it will reply with PROTO_ERROR of type PROTO_ERROR_UNEXPECTED_REPLY. // // Any errors in the negotiation stage, including incorrect version, will result in the termination of the connection. // If the negotiation is not finished in a timeout defined by the server, the connection will be terminated without a reason. // The server will try to send any error or rejection messages before closing the connection, but the connection will be terminated regardless if a // message send timeout is reached. // If the client refuses to close its connection cleanly, the server will forcibly terminate the connection. // // If the client received PROTO_VERSION_ACCEPTED, the version is now negotiation and the authentication handshake stage may begin. // Once the version is accepted, the client may safely assume that the server supports its protocol version. // Even if the server reports that its version is different from the clients, the client may safely assume that all messages it receives will // be compatible with its version, and that the server will understand all messages it receives from the client. // // Note that the client will not receive any PROTO_PING messages during version negotiation, and it should also not send any itself. // // The protocol version negotiation process shall not change between versions. // // # Handshake and Authentication // The handshake stage must occur immediately after the protocol version is negotiated. // Steps are as follows: // 1. Client sends PROTO_AUTHENTICATE with an authentication token. // 2. Server replies with either PROTO_AUTH_ACCEPTED or PROTO_AUTH_REJECTED // a. If PROTO_AUTH_REJECTED, a reason enum value and optionally a message will be provided. // b. If PROTO_AUTH_ACCEPTED, information about the authenticated user will be provided. // c. If the server received any message type other than PROTO_AUTHENTICATE, it will reply with PROTO_ERROR of type PROTO_ERROR_UNEXPECTED_REPLY. // // Any errors in the handshake process, including invalid credentials, will result in the termination of the connection. // If the handshake is not finished in a timeout defined by the server, the connection will be terminated without a reason. // The server will try to send any error or rejection messages before closing the connection, but the connection will be terminated regardless if a // message send timeout is reached. // If the client refuses to close its connection cleanly, the server will forcibly terminate the connection. // // If the client received PROTO_AUTH_ACCEPTED, the connection is now authenticated and a session has been established. // Note that the client will not receive any PROTO_PING messages during the handshake, and it should also not send any itself. // // # Ping // Both the client and server are expected to reply to PROTO_PING messages with PROTO_PONG. // The server at its discretion may reply to PROTO_PING with an error of type PROTO_ERROR_RATE_LIMITED, which shall not be reason for the client // to terminate the connection. The client, however, must not reply to PROTO_PING with any error. // Besides the exception mentioned above, if either party replies to PROTO_PING with anything other than PROTO_PONG, the connection must be // terminated. This also applies if a reply timeout is reached. // // A client's PROTO_PING messages shall not be rate limited if sent at a rate of 1 per second or lower. // Clients are not required to send PROTO_PING messages, but may do so for their own purposes. // Regardless of which party is sending the ping, the timestamp sent along with it must be an accurate UNIX epoch millisecond for when the message was sent. // // # Versioning // The protocol uses semantic versioning (MAJOR.MINOR.PATCH). // The patch version may introduce new features that are fully backwards compatible with the previous version. // Changes introduced in patch versions must not be required for clients to continue to work normally. // The minor version may introduce new features and small backwards incompatible changes. // The minor version may not change the handshake process. // The major version may change anything with no regard to backwards compatibility, except for version negotiation. // // Examples: // v1.0.0-v1.0.1: // - Introduces a new status indicator, but clients do not need it to work normally // v1.0.1-v1.1.0: // - Introduces a new chat message type which clients on earlier versions do not understand // - Removes the ability to fetch forum threads // v1.1.0-v2.0.0: // - Reworks the handshake process // - Changes the chat message format // - Removes unpaginated group fetching // // ## Compatibility Expectations // If the server accepts a client's version, it can be safely assumed that the client's version is fully supported. // If the client's version differs from the server's but the server accepts it, the client must be prepared to ignore unrecognized messages and fields. // If the client's version matches the server's, unrecognized messages and fields should be treated as erroneous behavior on the part of the server. // In the case that the client's version is greater than the server's, the client must be prepared to handle cases where messages are unrecognized by the server. // // # Group Member List Pagination // Group member lists are paginated differently from other resources like messages which are ordered by creation date. // Group members are ordered by the following criteria, in order of precedence: is owner, is online, is offline. // Within each criteria, members are sorted alphabetically by username, ascending. // // Pagination tokens are used to request the next or previous page of members. // Users are returned using the same ordering scheme regardless of whether the next (after) or previous (before) page is requested. // Since the position of members in the list may change between requests, the client must be able to generate pagination tokens locally and not rely on the server to send them. // // The client is expected to update its user list accordingly when user status or group membership/ownership changes occur. // The client must not expect to receive any updates for any of the above changes in groups it is not observing, // so observing a previously unobserved group should be followed a request for its member list. syntax = "proto3"; package multiman; // A string whose value may not be present (therefore null). // This exists to provide a differentiation between parameter existence and nullability. message NullableString { optional string value = 1; } // An int64 whose value may not be present (therefore null). // This exists to provide a differentiation between parameter existence and nullability. message NullableInt64 { optional int64 value = 1; } // Types of protocol messages enum ProtoMessageType { // [BOTH] A ping message. // May be sent by either the client or server, but the other must respond with PROTO_PONG. // Must be responded to with PROTO_PONG, or the connection will be terminated. // Either side may have its own arbitrary timeout which may cause disconnection if not met. PROTO_PING = 0; // [BOTH] Response to PROTO_PING PROTO_PONG = 1; // [SERVER] Acknowledgement of success PROTO_ACKNOWLEDGED = 2; // [BOTH] An error message, usually sent by the server PROTO_ERROR = 3; // [CLIENT] Initial client version negotiation PROTO_VERSION = 4; // [SERVER] Indicates that the server accepted the client's protocol version PROTO_VERSION_ACCEPTED = 5; // [SERVER] Indicates that the server rejected the client's protocol version PROTO_VERSION_REJECTED = 6; // [CLIENT] Initial client authentication with the server PROTO_AUTHENTICATE = 7; // [SERVER] Indicates that client authentication was accepted PROTO_AUTH_ACCEPTED = 8; // [SERVER] Indicates that client authentication was denied PROTO_AUTH_REJECTED = 9; // [SERVER] group has been updated, and provides the group's new info PROTO_GROUP_UPDATE = 10; // [SERVER] Indicates that a group's ID has changed PROTO_GROUP_ID_CHANGED = 11; // [SERVER] Indicates that a group's owner has changed PROTO_GROUP_OWNER_CHANGED = 12; // [SERVER] Indicates that a group has been deleted PROTO_GROUP_DELETED = 13; // [SERVER] Indicates that the current user has been added to a group PROTO_SELF_GROUP_ADDED = 14; // [SERVER] Indicates that the current user has been removed from a group PROTO_SELF_GROUP_REMOVED = 15; // [SERVER] Indicates that a message has been marked as saved or unsaved PROTO_MESSAGE_SAVE_STATUS_CHANGED = 16; // [SERVER] A chat message that was sent PROTO_CHAT_MESSAGE = 17; // [SERVER] Request that the client delete all of a user's messages in a group. // The messages will already have been deleted from the server by the time a client receives this message. PROTO_DELETE_USER_GROUP_MESSAGES = 18; // [SERVER] Indicates that a user has joined a group PROTO_USER_JOINED_GROUP = 19; // [SERVER] Indicates that a user has left a group PROTO_USER_LEFT_GROUP = 20; // [SERVER] Indicates that a user's status has changed PROTO_USER_STATUS_CHANGED = 21; // [SERVER] Indicates that a notification has been received PROTO_NOTIFICATION = 22; // [SERVER] Sent by the server to request that a client reload its connection and version PROTO_RELOAD_REQUEST = 23; // [SERVER] Indicates that a user's info has changed PROTO_USER_INFO_CHANGED = 24; // [SERVER] A network-wide announcement PROTO_ANNOUNCEMENT = 25; // [SERVER] Indicates that the current user has been banned PROTO_BANNED = 26; // [CLIENT] Sends chat a message PROTO_SEND_CHAT_MESSAGE = 27; // [CLIENT] Sends a request for the current user's groups PROTO_GET_SELF_GROUPS = 28; // [SERVER] Reply to PROTO_GET_SELF_GROUPS with the user's groups and membership info PROTO_SELF_GROUPS = 29; // [CLIENT] Sends a request for info about one or more users PROTO_GET_USER_INFOS = 30; // [SERVER] Reply to PROTO_GET_USER_INFOS with the users' info PROTO_USER_INFOS = 31; // [CLIENT] Sends a request for info about one or more groups PROTO_GET_GROUP_INFOS = 32; // [SERVER] Reply to PROTO_GET_GROUP_INFOS with the groups' info PROTO_GROUP_INFOS = 33; // [CLIENT] Sends a request for a group's members PROTO_GET_GROUP_MEMBERS = 34; // [SERVER] Reply to PROTO_GET_GROUP_MEMBERS with the group's members PROTO_GROUP_MEMBERS = 35; // [CLIENT] Sends a request for a group's message history PROTO_GET_GROUP_HISTORY = 36; // [SERVER] Reply to PROTO_GET_GROUP_HISTORY with the group's message history PROTO_GROUP_HISTORY = 37; // [CLIENT] Sends a request to observe a specific group, or stop observing any groups PROTO_OBSERVE_GROUP = 38; // [CLIENT] Sends a request to create a new group PROTO_CREATE_GROUP = 39; // [SERVER] Reply to PROTO_CREATE_GROUP with the newly created group's info PROTO_GROUP_CREATED = 40; // [CLIENT] Sends a request to join a group PROTO_JOIN_GROUP = 41; // [CLIENT] Sends a request to leave a group PROTO_LEAVE_GROUP = 42; // [CLIENT] Sends a request to delete a group PROTO_DELETE_GROUP = 43; // [CLIENT] Sends a request to add a new member to a group PROTO_ADD_MEMBER = 44; // [CLIENT] Sends a request to kick a member from a group PROTO_KICK_MEMBER = 45; // [CLIENT] Sends a request to edit a group's info PROTO_EDIT_GROUP = 46; // [CLIENT] Sends a request to change a group's owner PROTO_CHANGE_GROUP_OWNER = 47; // [CLIENT] Sends a request to change a message's saved/unsaved status PROTO_CHANGE_MESSAGE_SAVE_STATUS = 48; // [CLIENT] Sends a request for forum threads PROTO_GET_FORUM_THREADS = 49; // [SERVER] Reply to PROTO_GET_FORUM_THREADS with the threads PROTO_FORUM_THREADS = 50; // [CLIENT] Sends a request to get a list of groups the user and another user are mutually members of PROTO_GET_USER_MUTUAL_GROUPS = 51; // [SERVER] Reply to PROTO_GET_USER_MUTUAL_GROUPS with the groups PROTO_USER_MUTUAL_GROUPS = 52; // [CLIENT] Sends a request to search a group's members PROTO_SEARCH_GROUP_MEMBERS = 53; // [SERVER] Reply to PROTO_SEARCH_GROUP_MEMBERS with the results PROTO_GROUP_MEMBER_SEARCH_RESULTS = 54; // [CLIENT] Sends a request to get all official'''
