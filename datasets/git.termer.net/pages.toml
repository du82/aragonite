: ", i loopNTimes(times) See the tests directory for more examples. What's missing? Dynamic objects (basically tables with normal field access syntax) Support for putting procs inside DynVal This would require using a macro to generate typeguards, and then exposing a dot call operator with a signature like proc (args: varargs[auto]), and then doing magic on that for runtime type checking.'''
