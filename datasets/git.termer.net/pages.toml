'primary', isSSH); sshBtn.classList.toggle('basic', !isSSH); } const btn = isSSH ? sshBtn : httpsBtn; if (!btn) return; function toOriginUrl(urlStr) { try { if (urlStr.startsWith('http://') || urlStr.startsWith('https://') || urlStr.startsWith('/')) { const {origin, protocol, hostname, port} = window.location; const url = new URL(urlStr, origin); url.protocol = protocol; url.hostname = hostname; url.port = port || (protocol === 'https:' ? '443' : '80'); return url.toString(); } } catch {} return urlStr; } const link = toOriginUrl(btn.getAttribute('data-link')); for (const el of document.getElementsByClassName('js-clone-url')) { el[el.nodeName === 'INPUT' ? 'value' : 'textContent'] = link; } for (const el of document.getElementsByClassName('js-clone-url-editor')) { el.href = el.getAttribute('data-href-template').replace('{url}', encodeURIComponent(link)); } })(); Cite this repository BibTeX Cancel Exact Exact Union RegExp termer d50856663e initial commit 2023-07-10 03:48:33 -04:00 BUILD_CONFIG initial commit 2023-07-10 03:48:33 -04:00 install.sh initial commit 2023-07-10 03:48:33 -04:00 LICENSE Initial commit 2023-07-10 07:33:40 +00:00 main.rtfl initial commit 2023-07-10 03:48:33 -04:00 project.json initial commit 2023-07-10 03:48:33 -04:00 README.md initial commit 2023-07-10 03:48:33 -04:00 README.md rtflshell Simple REPL for Rtfl Usage Run the script and execute Rtfl code from your terminal. For multi-line entries, end each line with a backslash to allow for another line to be specified without executing. To enable or disable printing values returned by entries, call the echo function with a boolean argument specifying whether to enable echoing. You can call the function with no arguments to see whether echoing is currently enabled. To see a generic help message, run help(). Limitations Local variables are inaccessible to code outside of multi-line entries. You must use the return statement to have RtflShell print a value. Installing The script is stored all in one