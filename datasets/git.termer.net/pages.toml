ver import std/[options, asynchttpserver, asyncdispatch, json, tables, sequtils] import "./utils.nim" import "./rhythmdb.nim" # === Utils === proc genHeaders(): HttpHeaders = return newHttpHeaders({ "Content-Type": "application/json;charset=utf-8" }) proc sendSuccess(req: Request, data: Option[JsonNode] = none[JsonNode]()) {.async.} = var res = %*{ "success": true } if data.isSome: res["data"] = data.get else: res["data"] = newJNull() await req.respond(Http200, $res, genHeaders()) proc sendError(req: Request, name: string, message: string, status: HttpCode = Http500) {.async.} = await req.respond(status, $(%*{ "success": false, "name": name, "message": message }), genHeaders()) # === Handlers === proc getSongs(req: Request, query: ref Table[string, string], db: RhythmDb) {.async.} = let id = query.getOrDefault("id").toIntOrNone() let offset = query.getOrDefault("offset").toIntOrNone() let limit = query.getOrDefault("limit", "100").toIntOrNone() let beforeId = query.getOrDefault("beforeId").toIntOrNone() let afterId = query.getOrDefault("afterId").toIntOrNone() let queryStr = query.getOrDefault("query").orNone() let playlistId = query.getOrDefault("playlistId").toIntOrNone() let orderDesc = query.getOrDefault("orderDesc", "false") == "true" await req.sendSuccess(some(%*{ "songs": db.fetchSongs(id, offset, limit, beforeId, afterId, queryStr, playlistId, orderDesc) })) proc getSong(req: Request, query: ref Table[string, string], db: RhythmDb) {.async.} = let id = query.getOrDefault("id").toIntOrNone() let offset = query.getOrDefault("offset").toIntOrNone() let beforeId = query.getOrDefault("beforeId").toIntOrNone() let afterId = query.getOrDefault("afterId").toIntOrNone() let queryStr = query.getOrDefault("query").orNone() let playlistId = query.getOrDefault("playlistId").toIntOrNone() let orderDesc = query.getOrDefault("orderDesc", "false") == "true" await req.sendSuccess(some(%*{ "song": db.fetchSong(id, offset, beforeId, afterId, queryStr, playlistId, orderDesc) }))