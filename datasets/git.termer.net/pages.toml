tElementById('diff-file-tree').classList.remove('tw-hidden'); 3 README.md Normal file Unescape Escape View file @ -0,0 +1,3 @@ # MULTIMAN Protocol Documentation Documentation and definitions for 3DT's MULTIMAN chat system. 971 protocol.proto Normal file Unescape Escape View file @ -0,0 +1,971 @@ syntax = "proto3"; package multiman; import "google/protobuf/wrappers.proto"; // Protocol messages are encoded with the following layout: // 0-3: The message ID, which is never zero (uint32) // 4-7: The ID of the message that is being replied to, or zero if none (uint32) // 8-9: The message type (uint16) // 10-13: The payload length, in bytes (uint32) // 14-?: The payload // // The message type is a value of the ProtoMessageType enum. // The payload will be a protobuf message corresponding to the type's enum name. // For example, for the type PROTO_ERROR, the payload will be of type ProtoMessageError. // Types of protocol messages enum ProtoMessageType { // [SERVER] Acknowledgement of success PROTO_ACKNOWLEDGED = 0; // [BOTH] An error message, usually sent by the server PROTO_ERROR = 1; // [CLIENT] Initial client authentication with the server PROTO_AUTHENTICATE = 2; // [SERVER] Indicates that client authentication was accepted PROTO_AUTH_ACCEPTED = 3; // [SERVER] Indicates that client authentication was denied PROTO_AUTH_REJECTED = 4; // [SERVER] group has been updated, and provides the group's new info PROTO_GROUP_UPDATE = 5; // [SERVER] Indicates that a group's ID has changed PROTO_GROUP_ID_CHANGED = 6; // [SERVER] Indicates that a group's owner has changed PROTO_GROUP_OWNER_CHANGED = 7; // [SERVER] Indicates that a group has been deleted PROTO_GROUP_DELETED = 8; // [SERVER] Indicates that the current user has been added to a group PROTO_SELF_GROUP_ADDED = 9; // [SERVER] Indicates that the current user has been removed from a group PROTO_SELF_GROUP_REMOVED = 10; // [SERVER] Indicates that a message has been marked as saved or unsaved PROTO_MESSAGE_SAVE_STATUS_CHANGED = 11