) let beforeId = query.getOrDefault("beforeId").toIntOrNone() let afterId = query.getOrDefault("afterId").toIntOrNone() let queryStr = query.getOrDefault("query").orNone() let songId = query.getOrDefault("songId").toIntOrNone() let orderDesc = query.getOrDefault("orderDesc", "false") == "true" await req.sendSuccess(some(%*{ "count": db.fetchPlaylistsCount(id, beforeId, afterId, queryStr, songId, orderDesc) })) # === Main === proc startHttp*(host: string, port: int, db: RhythmDb) {.async.} = ## Starts the HTTP server var server = newAsyncHttpServer() proc handler(req: Request) {.async.} = try: # Parse query let query = req.url.query.parseQuery() var matched = false let path = req.url.path if req.reqMethod == HttpGet: if path == "/api/songs": await req.getSongs(query, db) matched = true elif path == "/api/song": await req.getSong(query, db) matched = true elif path == "/api/songs/count": await req.getSongsCount(query, db) matched = true elif path == "/api/playlists": await req.getPlaylists(query, db) matched = true elif path == "/api/playlist": await req.getPlaylist(query, db) matched = true elif path == "/api/playlists/count": await req.getPlaylistsCount(query, db) matched = true # Send 404 if no route was matched if not matched: await req.sendError("not_found", "No handler was found for this route", Http404) except: stderr.writeLine(getCurrentExceptionMsg()) await req.sendError("internal_error", "An internal error occurred", Http500) server.listen(Port(port), host) echo "Listening on "&host&':'&($port) while true: if server.shouldAcceptRequest(): await server.acceptRequest(handler) else: await sleepAsync(500) 10 src/rhythmdb.nim Unescape Escape View file @ -1,6 +1,6 @@ ## RhythmDB-related utils import std/[options, times, os, db_sqlite, parsexml, streams, strutils, tables] import std/[options, times, os, db_sqlite, parsexml, streams, strutils, tables, json] import "./utils.nim" type RhythmDb* = object @ -563,8 +563,6 @@ proc fetchSong*( proc fetchSongsCount*( rhythm