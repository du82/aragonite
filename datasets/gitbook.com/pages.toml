["https://gitbook.com/customers/trunk"]
title = "Trunk"
description = "GitBook is a technical documentation platform for engineering teams. It simplifies knowledge sharing, with docs-as-code support and AI-powered search & insights. Sign up for free!"
full_description = "Trunk is a dev tools company that builds engineering velocity software. And with such a strong focus on developers, they understand their audience well enough to know that what they really care about is the details. “Our marketing site is for product-focused people,” explains Eli. “But most engineers will look right past all that and head to the docs for the nuts and bolts. So we invest heavily into making sure our docs are detailed, inviting and modern.” For Trunk, that of course meant packing the documentation with useful information — but the team also wanted to give readers a great experience. They needed powerful customization options, as well great version control and a safety net when they need to make bigger changes across all their pages. “We were using ReadMe for all of our documentation,” says Eli. “The design left a lot to be desired — I think visually it feels quite stale.” Beyond the visual design, the team also found that they couldn’t do basic things that they expected, like adding tabs to explain different processes and workflows. But the Trunk team also struggled when it came to keeping track of changes. “ReadMe has a custom versioning concept that made it really hard for the team to update documentation,” Eli tells us. “People would be in the wrong version, or people would create a new version with new edits, but they wouldn't back-fill into an old version. We were constantly like, ‘where are we at?!’.” To overcome these challenges, Eli and the team moved their documentation over to GitBook. Not only did our recent customization improvements help them create beautiful, branded docs — our two-way Git Sync also helped them work on bigger changes right from their repo. “I love the ability to go in and edit locally through the WYSIWYG editor,” says Eli. “But then when there are large changes, I can go in and bulk edit with my IDE, and do a global search and replace.” Of course, with Git Sync, those changes automatically appear in the team’s GitBook docs, too, so everything stays up-to-date. “That's super powerful,” asserts Eli."
