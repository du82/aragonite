full_description = "Add a core plan to collaborate using change requests, set advanced permissions and unlock more editing features Use our calculator to budget for everything your team needs.Want custom pricing, or need help selecting the right plan? Contact our sales team. Any user that needs to log into the GitBook app to view, comment on, or contribute content will need a paid seat — unless you’re on a custom Enterprise plan. If you wish to share your content with an audience without paying for each reader, you can share your content via publishing. You do not pay for people who view published content. Learn more about our publishing options in our documentation. Any user that needs to log into the GitBook app to view, comment on, or contribute content will need a paid seat — unless you’re on a custom Enterprise plan. If you wish to share your content with an audience without paying for each reader, you can share your content via publishing. You do not pay for people who view published content. Learn more about our publishing options in our documentation. Add a core plan to collaborate using change requests, set advanced permissions and unlock more editing features Use our calculator to budget for everything your team needs.Want custom pricing, or need help selecting the right plan? Contact our sales team. Any user that needs to log into the GitBook app to view, comment on, or contribute content will need a paid seat — unless you’re on a custom Enterprise plan. If you wish to share your content with an audience without paying for each reader, you can share your content via publishing. You do not pay for people who view published content. Learn more about our publishing options in our documentation."
