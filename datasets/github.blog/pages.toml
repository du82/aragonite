["https://github.blog/changelog/label/copilot-chat"]
title = "copilot-chat - GitHub Changelog"
full_description = "OpenAI GPT-4.5 in GitHub Copilot now available in public preview February 27, 2025 copilotcopilot-chat OpenAI’s latest model, GPT-4.5, is now available in GitHub Copilot Chat to Copilot Enterprise users. GPT-4.5 is a large language model designed with advanced capabilities in intuition, writing style, and broad knowledge. It performs effectively with creative prompts and provides reliable responses to obscure knowledge queries. GPT-4.5 will launch in Visual Studio Code and on github.com for Copilot Enterprise users with a limit of 10 requests every 12 hours per user. In the coming weeks, we’ll be scaling rate limits and extending support to Visual Studio and JetBrains.As model releases have continued to accelerate, we’ve been thinking about how we can sustainably offer advanced AI models like GPT-4.5 to more GitHub users. This includes individual developers who want the most advanced capabilities from day one. Stay tuned for updates.Enabling accessCopilot Enterprise administrators will need to enable access to GPT-4.5 via a new policy in Copilot settings. As an administrator, you can confirm availability by checking your individual Copilot settings and confirming the policy for GPT-4.5 is set to “enabled”. Once enabled, users will see GPT-4.5 in the Copilot Chat model selector in VS Code and on github.com. See more See more Refining messages and reloading responses in Copilot Chat is now in public preview February 25, 2025 copilotcopilot-chat The immersive mode of Copilot chat on GitHub now provides you with increased control and flexibility at every step.What’s new: ✏️ Edit your previously sent messages: Refine your messages whenever you need 🔄 Reload responses: Get different variations instantly 📝 Keep track of all iterations in one place: Easily view the history of your message edits and responses 🔍 Compare different message and response pairs seamlessly: Switch between versions to see which one works best Pro tips: 🛠️ Fix typos or add context without starting over 🧪 Experiment with different phrasings to get the best responses 🔀 Toggle between versions to compare outcomes These new refining capabilities make it easier to iterate with Copilot. Make adjustments and improvements while maintaining the full context of your conversations, helping you to stay focused when chatting with Copilot chat.We hope these changes help keep you in the flow state when chatting with Copilot on GitHub.com 💫.💬 Let us know what you think using the in-product feedback option or pop it into the GitHub Community at any time. See more See more"
