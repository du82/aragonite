title = "Announcing the General Availability of GitHub Copilot Extensions - GitHub Changelog"
description = "Announcing the General Availability of GitHub Copilot Extensions"
full_description = "New GPT-4o Copilot code completion model now available for Copilot in JetBrains IDEs February 19, 2025 codecopilot The new code completion model announced yesterday is available today to all JetBrains users of GitHub Copilot.To get started, ensure that you are on the latest stable release of the extension (v1.5.35 or above). Click the Copilot icon in the JetBrains IDE of your choice and select Edit model for Completion. This will open the GitHub Copilot settings, where you can switch between models. See more See more Repositories – Enterprise rules and custom properties updates February 18, 2025 policiespublic-previewrepositoriesrules Enterprise rules and custom properties are getting updates as part of the current public preview, as well introducing a new search and filter experience for custom properties.Custom propertiesThere are new search and filtering options for custom properties now generally available to ensure you can easily find the right property. Managed by allows you to limit your result by the organization or enterprise who manages the property. Property type allows you to limit your result by the available type of properties. Text allows you to limit your result by the context of the property name or values. Enterprise custom propertiesEnterprise custom properties as part of the current preview can now be promoted from an organization to an enterprise property. This ensures properties configured in one organization are available across all organizations in an enterprise.Enterprise code rulesetsRequired workflows are now available as a new rule in the enterprise code rules preview. This will allow you to target workflows across specific organizations and repositories with a single workflow file managed at the enterprise.Note: GitHub Enterprise Cloud with data residency support for the enterprise workflow rule will be coming soon.Join the discussion within GitHub Community. See more See more"
