title = "GitHub Changelog"
full_description = "Copilot Workspace: Showing quota limits, issues in dashboard, and UX improvements February 28, 2025 copilot This week, we’ve added an indicator for your daily/hourly quotas, allocated a section of the dashboard to issues assigned to you, and introduced several UX improvements and bug fixes to ensure a smooth development process with Copilot Workspace.Let’s get started!Showing approaching quota limitsAs you’re nearing your quota limit, Copilot Workspace will now display a counter so you can keep track of how many tokens you have left, and prioritize your usage accordingly.Issues listed in homepage dashboardYour recently assigned issues are now listed in the homepage dashboard, providing another jumping point to start developing from!UX improvements and bug fixes The session list has been refactored to link directly to pull requests created from a session. The sessions index page now maintains scroll position when navigating across sessions. https://github.blog/wp-content/uploads/2025/02/417156731-3fe1d8ba-1988-4ff4-b15c-f1c90c979636.mp4#t=0.001 When viewing a new file’s diff, the diff is now highlighted in green. We’ve added an arrow to the current branch name, indicating that it is clickable. You can now select file names in the Plan stage, allowing you to copy them as needed. We fixed the “live preview” button on the run command. We fixed the overlay of the file tree view on small viewports. Light/dark mode is now fixed to match your settings theme. Terminal commands are now correctly disposed of when exiting the command dialogue without saving. There’s improved file name generation to remove excess backtick characters. We fixed a bug where the plan was not being shown in mobile view. The “Revise” button on file headers is now represented by a sparkling pencil icon instead of crosshairs. There’s a new square circle button for stop buttons. Providing feedbackPlease give your feedback in our GitHub Discussion. We’d love to hear your thoughts! See more See more"
