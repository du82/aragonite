["https://github.blog/changelog/2025-02-12-github-copilot-chat-and-github-copilot-extension-now-available-for-free-on-github-mobile-and-github-cli"]
title = "GitHub Copilot now available for free in mobile and the CLI - GitHub Changelog"
description = "GitHub Copilot Chat and GitHub Copilot Extension now available for free on GitHub Mobile and GitHub CLI"
full_description = "Copilot Language Server SDK is now available February 10, 2025 copilot We are excited to announce that the Copilot Language Server SDK is now publicly available. This enables any editor or IDE to integrate with GitHub Copilot via the language server protocol standard. Today, Copilot is available in popular editors such as VS Code, Visual Studio, JetBrains IDEs, Vim/Neovim, and most recently Xcode. A key ingredient of bringing Copilot to new editors has been the Copilot Language Server, which is used by all of those editors. At GitHub, we value developer choice and aim to empower developers to use Copilot with their favorite editor.The Copilot Language Server SDK is available now: @github/copilot-language-server This SDK can be used to integrate GitHub Copilot into any editor or IDE. See the documentation on the package to get started. See more See more OpenAI o3-mini is now available in GitHub Copilot Free February 6, 2025 copilotcopilot-chat OpenAI’s latest model, o3-mini, is now available in GitHub Copilot Free.OpenAI’s latest model, o3-mini, is the most cost-efficient model in their reasoning series. o3-mini outperforms o1 on coding benchmarks with response times that are comparable to o1-mini, meaning you’ll get improved quality at nearly the same latency. The model is configured to use OpenAI’s medium reasoning effort and can be accessed in VS Code and Github.com Copilot chat today, with support to follow soon in Visual Studio and JetBrains.Access to o3-mini is currently in preview and is subject to the 50 free chats per month limit when using Copilot Free.Get started with Copilot Free on GitHub and in VSCode today or learn more in our documentation. See more See more"
