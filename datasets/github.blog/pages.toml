["https://github.blog/changelog/label/copilot"]
title = "copilot - GitHub Changelog"
full_description = "Copilot Workspace: Showing quota limits, issues in dashboard, and UX improvements February 28, 2025 copilot This week, we’ve added an indicator for your daily or hourly quotas, allocated a section of the dashboard to issues assigned to you, and introduced several UX improvements and bug fixes to ensure a smooth development process with Copilot Workspace.Showing approaching quota limitsAs you’re nearing your quota limit, Copilot Workspace will now display a counter so you can keep track of how many tokens you have left, and prioritize your usage accordingly.Issues listed in homepage dashboardYour recently assigned issues are now listed in the homepage dashboard, providing another jumping point to start developing from!UX improvements and bug fixes The session list has been refactored to link directly to pull requests created from a session. The sessions index page now maintains scroll position when navigating across sessions. When viewing a new file’s diff, the diff is now highlighted in green. We’ve added an arrow to the current branch name, indicating that it is clickable. You can now select file names in the Plan stage, allowing you to copy them as needed. We fixed the “live preview” button on the run command. We fixed the overlay of the file tree view on small viewports. Light/dark mode is now fixed to match your settings theme. Terminal commands are now correctly disposed of when exiting the command dialogue without saving. There’s improved file name generation to remove excess backtick characters. We fixed a bug where the plan was not being shown in mobile view. The “Revise” button on file headers is now represented by a sparkling pencil icon instead of crosshairs. There’s a new square circle button for stop buttons. Providing feedbackPlease give your feedback in our GitHub Discussion. We’d love to hear your thoughts! See more See more OpenAI GPT-4.5 in GitHub Copilot now available in public preview February 27, 2025 copilotcopilot-chat OpenAI’s latest model, GPT-4.5, is now available in GitHub Copilot Chat to Copilot Enterprise users. GPT-4.5 is a large language model designed with advanced capabilities in intuition, writing style, and broad knowledge. It performs effectively with creative prompts and provides reliable responses to obscure knowledge queries. GPT-4.5 will launch in Visual Studio Code and on github.com for Copilot Enterprise users with a limit of 10 requests every 12 hours per user. In the coming weeks, we’ll be scaling rate limits and extending support to Visual Studio and JetBrains.As model releases have continued to accelerate, we’ve been thinking about how we can sustainably offer advanced AI models like GPT-4.5 to more GitHub users. This includes individual developers who want the most advanced capabilities from day one. Stay tuned for updates.Enabling accessCopilot Enterprise administrators will need to enable access to GPT-4.5 via a new policy in Copilot settings. As an administrator, you can confirm availability by checking your individual Copilot settings and confirming the policy for GPT-4.5 is set to “enabled”. Once enabled, users will see GPT-4.5 in the Copilot Chat model selector in VS Code and on github.com. See more See more"
