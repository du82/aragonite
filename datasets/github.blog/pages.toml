title = "The latest on supply chain security - The GitHub Blog"
description = "In today’s interconnected development environment, a single vulnerability in any component of the supply chain poses a threat. Find out how GitHub’s security alerts, code scanning, secret scanning, and dependency management features can help you avoid supply chain security issues. You can also check out our documentation to learn more about supply chain security on GitHub."
full_description = "The second half of software supply chain security on GitHub Learn about a community-developed framework for how to think about this problem holistically and how to use GitHub, particularly, to improve the security in the second half of your software supply chain. Zachary Steindler · October 8, 2024 Configure GitHub Artifact Attestations for secure cloud-native delivery Introducing the generally available capability of GitHub Artifact Attestations to secure your cloud-native supply chain packages and images. April Yoho · July 30, 2024 Securing the open source supply chain: The essential role of CVEs Vulnerability data has grown in volume and complexity over the past decade, but open source and programs like the Github Security Lab have helped supply chain security keep pace. Madison Oliver · October 21, 2024 Where does your software (really) come from? GitHub is working with the OSS community to bring new supply chain security capabilities to the platform. Trevor Rosen · April 30, 2024 Securing millions of developers through 2FA We’ve dramatically increased 2FA adoption on GitHub as part of our responsibility to make the software ecosystem more secure. Read on to learn how we secured millions of developers and why we’re urging more organizations to join us in these efforts. Mike Hanley · April 24, 2024 How to stay safe from repo-jacking Repo-jacking is a specific type of supply chain attack. This blog post explains what it is, what the risk is, and what you can do to stay safe. Kevin Backhouse · February 21, 2024 Do you know if all your repositories have up-to-date dependencies? Consider deploying the GitHub Action: Evergreen so that you know each of your repositories are leveraging active dependency management with Dependabot. Zack Koppert · January 25, 2024 3 strategies to expand your threat model and secure your supply chain How to get the security basics right at your organization. Mike Hanley · October 3, 2023 Four tips to keep your GitHub Actions workflows secure Researchers from Purdue and NCSU have found a large number of command injection vulnerabilities in the workflows of projects on GitHub. Follow these four tips to keep your GitHub Actions workflows secure. Jaroslav Lobacevski & Kevin Backhouse · August 9, 2023"
