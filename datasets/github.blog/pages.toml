["https://github.blog/changelog/2024-12-17-find-and-fix-actions-workflows-vulnerabilities-with-codeql-public-preview"]
title = "Find and fix Actions workflows vulnerabilities with CodeQL (Public Preview) - GitHub Changelog"
description = "Find and fix Actions workflows vulnerabilities with CodeQL (Public Preview)"
full_description = "Copilot Autofix can now be generated with the REST API (Public Preview) December 17, 2024 advanced-securityapicode-scanningcodeqlcopilotsecurity-and-compliance New REST API endpoints for code scanning allow you to request the generation of Copilot Autofix for code scanning alerts. These endpoints also provide the Autofix generation status, along with metadata and AI-generated descriptions for the fixes, and enable you to apply Autofix to a branch. This functionality can be particularly useful for addressing security vulnerabilities programmatically and for tracking the status of alerts with Copilot Autofixes in your system.To generate Copilot Autofix, call the POST /repos/{owner}/{repo}/code-scanning/alerts/{number}/autofix endpoint. Additionally, you can retrieve the Autofix and commit it by using the GET /repos/{owner}/{repo}/code-scanning/alerts/{number}/autofix endpoint followed by POST /repos/{owner}/{repo}/code-scanning/alerts/{number}/autofix/commits.For more information, see: About Copilot Autofix for CodeQL code scanning. If you have feedback for Copilot Autofix for code scanning, please join the discussion here. See more See more Replacement of announcement banner GraphQL fields December 13, 2024 apighecorganizations Announcement banner fields in GraphQL for enterprises and organizations are being replaced with a new announcementBanner object to simplify their access and better follow our standard styles. The new fields are available today, and the old fields will be removed on April 1, 2025.The following fields are being removed from the enterprise and organization GraphQL objects: announcement announcementCreatedAt announcementExpiresAt announcementUserDismissible The new GraphQL structure for these fields is:announcementBanner { message createdAt expiresAt isUserDismissible } Learn more about announcement banners for organizations on GitHub Enterprise Cloud. See more See more"
