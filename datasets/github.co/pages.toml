["https://github.co/readme"]
title = "The ReadME Project · Meet the people behind the projects you love · GitHub"
description = "The ReadME Project amplifies the voices of the open source community: the maintainers, developers, and teams whose contributions move the world forward every day."
full_description = "The ReadME Project Featured stories Featured Article Coding accessibility: Software by the blind, for the blind The NVDA screen reader has helped empower a new generation of blind and low-vision developers Featured Article Coding accessibility: Disability as catalyst for creativity Faced with accessibility barriers, developer Paul Chiou turns obstacles into innovative solutions. Annalu Waller Champion accessibility to unleash untapped potential Dr. Annalu Waller on the intricate, interdependent network of support that shapes our lives. Featured Article Coding accessibility: How Della found her voice with open source AAC When proprietary apps failed, Della’s brother built an app that incorporated her needs and feedback into the design. Featured Article Coding accessibility: Building autonomy with AI After bringing Braille to the digital world and creating the first screen reader for the web, Dr. Asakawa is now working on an AI-enabled suitcase to help blind people navigate the world independently. The ReadME Project Browse by story type Featured Articles Developer Stories Guides The ReadMe Podcast Explore Topics See all topics AI Application Security Career Development DevOps & Automation Maintainer Programming Nominate a developer// Support the community Stories by topic The ReadME Project amplifies the voices of the developer community by telling stories about: AI , Application Security , Career Development , DevOps & Automation , and more topics. Community stories Maintainer THE README PODCAST // EPISODE 31 Bridging code and community Navigating open source in a regulated environment, the crucial role of non-code contributions to open source success, and lessons from scaling projects like Kubernetes. AI THE README PODCAST // EPISODE 33 Powering public goods Exploring developer happiness through the vibrant Laravel community and the impact of digital public goods on open source, AI models, Wikipedia, and more. Anton Mirhorodchenko Harness the power of generative AI for software development Tools like GitHub Copilot and ChatGPT can change the way you build software. Aaron Francis // PlanetScale Finish your projects Don’t let fear, or that last 10%, hold you back. Cassidy Williams // Contenda Get your first software developer job Tips, tricks, and general advice for how to get in the door in tech. We all have the potential to become who we're meant to be, even when societal and socioeconomic challenges get in our way. Accessibility Champion accessibility to unleash untapped potential Annalu Waller The ReadMe Podcast See all The ReadMe Podcast stories from The ReadMe Podcast THE README PODCAST // EPISODE 32 (De)coding conventions The evolution of TypeScript and the future of coding conventions, AI’s role in improving accessibility, and practical advice on encouraging non-code contributions. THE README PODCAST // EPISODE 30 Kelsey Hightower—Present Kelsey shares his origin story, insights on the future of Kubernetes, and advice on making complicated technology easier to understand. Featured Articles See all Featured Articles stories from Featured Articles Programming Is Laravel the happiest developer community on the planet? How the PHP framework maintains a perpetual honeymoon period. Developer Stories See all Developer Stories stories from Developer Stories Anton Mirhorodchenko Realizing potential with AI Anton uses AI to write code and tackle more projects. Kyler Middleton From fixing computers on farms to democratizing DevOps Kyler discusses her path from rural tech repair jobs to revolutionizing tech education. Aaron Gustafson Advancing inclusion with progressive enhancement Aaron’s journey towards progressive enhancement and inclusive design. Ruth Ikegah Putting the African open source community on the map Ruth’s dream is to show people that Africans aren’t just consumers of open source: They’re creators as well. Guides See all Guides stories from Guides Application Security Denys Lashchevskyi // Betsson A beginner’s guide to running and managing custom CodeQL queries Transform your code into a structured database that you can use to surface security vulnerabilities and discover new insights. Career Development Nick Penston // Fidelity Investments Scaling standards and community in your organization Learn how to implement open source community ideas to spread best practices. Niek Palm // Philips Provisioning self-hosted GitHub Actions runners on demand How Philips optimized their CI/CD process using GitHub Actions and self-hosted runners. Open Source Mike Gifford // CivicActions Treat accessibility issues as bugs, not feature requests Follow Drupal’s lead: Prioritize and systematically squash accessibility bugs. About The ReadME Project Coding is usually seen as a solitary activity, but it’s actually the world’s largest community effort led by open source maintainers, contributors, and teams. These unsung heroes put in long hours to build software, fix issues, field questions, and manage communities. The ReadME Project is part of GitHub’s ongoing effort to amplify the voices of the developer community. It’s an evolving space to engage with the community and explore the stories, challenges, technology, and culture that surround the world of open source. Follow us: Nominate a developer Nominate inspiring developers and projects you think we should feature in The ReadME Project. Support the community Recognize developers working behind the scenes and help open source projects get the resources they need. Sign Up For Newsletter Every month we’ll share new articles from The ReadME Project, episodes of The ReadME Podcast, and other great developer content from around the community. Email Address * Subscribe Thank you! for subscribing"
