["https://githubengineering.com/page/5"]
title = "Page 5 of 13 for GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "Soft U2F mastahyeti July 20, 2017 In an effort to increase the adoption of FIDO U2F second factor authentication, we’re releasing Soft U2F: a software-based U2F authenticator for macOS. MySQL infrastructure testing automation at GitHub tomkrouper shlomi-noach July 06, 2017 Our MySQL infrastructure is a critical component to GitHub. MySQL serves GitHub.com, GitHub’s API, authentication and more. Every git request touches MySQL in some way. We are tasked with keeping the data available, and maintaining its integrity. Even while our MySQL clusters serve traffic, we need to be able to perform tasks such as heavy duty cleanups, ad-hoc updates, online schema migrations, cluster topology refactoring, pooling and load balancing and more. We have the infrastructure to automate away such operations; in this post we share a few examples of how we build trust in our infrastructure through continuous testing. It is essentially how we sleep well at night. DNS Infrastructure at GitHub joewilliams May 31, 2017 At GitHub we recently revamped how we do DNS from the ground up. This included both how we interact with external DNS providers and how we serve records internally to our hosts. To do this, we had to design and build a new DNS infrastructure that could scale with GitHub’s growth and across many data centers. Integrating Git in Atom kuychaco BinaryMuse smashwilson May 16, 2017 The Atom team has been working to bring the power of Git and GitHub as close to your cursor as possible. With today’s release of the GitHub package for Atom, you can now perform common Git operations without leaving the editor: stage changes, make commits, create and switch branches, resolve merge conflicts, and more. How Four Native Developers Wrote An Electron App iamwillshepherd joshaber niik shiftkey May 16, 2017 Today we released the new GitHub Desktop Beta, rewritten on Electron."
author = "GitHub Engineering"
year_published = 2020
clearnet = "https://githubengineering.com/page/5"
tags = ["atom", "automation", "developers", "electron", "engineering", "four", "github", "infrastructure", "integrating", "mysql"]
language = "en"
internal-references = ["none"]
external-references = ["blog.atom.io", "desktop.github.com", "elastic.co", "electron.atom.io", "en.wikipedia.org", "github.blog", "github.com", "help.github.com", "hubot.github.com", "twitter.com"]

["https://githubengineering.com/page/4"]
title = "Page 4 of 13 for GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "GitHub Debug nautalice September 19, 2017 GitHub is proud to handle thousands of requests per second from our millions of users. The Internet, however, can be a fickle beast of cables and sparks, and sometimes those requests don’t happen very fast (or at all). While we’re happy to help you troubleshoot connection issues to us, we also know our users like swift answers and a hands-on approach. Weak cryptographic standards deprecation update ptoomey3 September 18, 2017 Earlier this year, we announced the deprecation of several weak cryptographic standards. As noted during our initial announcement, the vast majority of HTTPS clients connect to GitHub using TLSv1.2 and won’t be affected by our disabling of TLSv1/TLSv1.1. Since the announcement, we have been focusing on the impact of disabling the diffie-hellman-group1-sha1 and diffie-hellman-group14-sha1 key exchanges for SSH. As of last week, we have enabled diffie-hellman-group-exchange-sha256. This key exchange method is widely supported and will allow most legacy clients to seamlessly transition away from diffie-hellman-group1-sha1 and diffie-hellman-group14-sha1. Keeping an eye on our network ross September 05, 2017 Visibility is essential to effectively operating complex systems. As our network has grown, we’ve had to improve the the way we collect data about it to keep up. Key to these improvements has been the ability to tag metrics. Tagging has allowed us to build dashboards that start at a high level and facilitate drilling down into interesting or problematic areas by filtering and aggregating on multiple dimensions. A simple example below shows data flowing across a set of our spine switches during a rolling update: Kubernetes at GitHub jnewland August 16, 2017 Over the last year, GitHub has gradually evolved the infrastructure that runs the Ruby on Rails application responsible for github.com and api.github.com. We reached a big milestone recently: all web and API requests are served by containers running in Kubernetes clusters deployed on our metal cloud. Moving a critical application to Kubernetes was a fun challenge, and we’re excited to share some of what we’ve learned with you today."
author = "GitHub Engineering"
year_published = 2017
