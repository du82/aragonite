["https://githubengineering.com/page/12"]
title = "Page 12 of 13 for GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "Cross-platform UI in GitHub Desktop robrix August 19, 2015 The comparison graph is the centerpiece of GitHub Desktop. It both drives the interaction with your branch and shows you the effects of your changes relative to a base branch. Benchmarking GitHub Enterprise dbussink July 22, 2015 The release of GitHub Enterprise 2.0 brought more than just new features and support for deployment on Amazon Web Services. It also included a rework of our virtual machine architecture to improve performance and reliability. In making these changes, we used straightforward benchmarking each step of the way. With this data and our trusty set of Unix tools, we were able to discover, debug, and eventually solve several interesting performance issues for our Enterprise customers. Scripts to Rule Them All maddox June 30, 2015 At GitHub we have a lot of software running our product and company. We also have a lot of potential contributing members. Being able to get from git clone to an up-and-running project in a development environment is imperative for fast, reliable contributions. A consistent bootstrapping experience across all our projects reduces friction and encourages contribution. Exception Monitoring and Response caged June 16, 2015 Like most software applications, GitHub can generate a few exceptions. Incoming exceptions range from system-level issues including Git timeouts and missing references, to application-level issues including simple code mistakes and JavaScript errors. Brubeck, a statsd-compatible metrics aggregator vmg June 15, 2015 One of the key points of GitHub’s engineering culture —and I believe, of any good engineering culture— is our obsession with aggressively measuring everything."
