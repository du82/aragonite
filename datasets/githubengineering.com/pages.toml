["https://githubengineering.com/page/8"]
title = "Page 8 of 13 for GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "How we made diff pages three times faster brianmario tma mclark arthurschreiber December 06, 2016 We serve a lot of diffs here at GitHub. Because it is computationally expensive to generate and display a diff, we’ve traditionally had to apply some very conservative limits on what gets loaded. We knew we could do better, and we set out to do so. GLB part 2: HAProxy zero-downtime, zero-delay reloads with multibinder joewilliams theojulienne December 01, 2016 Recently we introduced GLB, the GitHub Load Balancer that powers GitHub.com. The GLB proxy tier, which handles TCP connection and TLS termination is powered by HAProxy, a reliable and high performance TCP and HTTP proxy daemon. As part of the design of GLB, we set out to solve a few of the common issues found when using HAProxy at scale. octocatalog-diff: GitHub's Puppet development and testing tool kpaulisse October 20, 2016 Today we are announcing the open source release of octocatalog-diff: GitHub’s Puppet development and testing tool. Introducing the GitHub Load Balancer joewilliams theojulienne September 22, 2016 At GitHub we serve billions of HTTP, Git and SSH connections each day. To get the best performance we run on bare metal hardware. Historically one of the more complex components has been our load balancing tier. Traditionally we scaled this vertically, running a small set of very large machines running haproxy, and using a very specific hardware configuration allowing dedicated 10G link failover. Eventually we needed a solution that was scalable and we set out to create a load balancer solution that would run on commodity hardware in our typical data center configuration. The GitHub GraphQL API gjtorikian brblck bswinnerton haileys davidcelis kdaigle September 14, 2016 GitHub announced a public API one month after the site launched. We’ve evolved this platform through three versions, adhering to RFC standards and embracing new design patterns to provide a clear and consistent interface. We’ve often heard that our REST API was an inspiration for other companies; countless tutorials refer to our endpoints. Today, we’re excited to announce our biggest change to the API since we snubbed XML in favor of JSON: we’re making the GitHub API available through GraphQL."
