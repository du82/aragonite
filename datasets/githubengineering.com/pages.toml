["https://githubengineering.com"]
title = "GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "Vulcanizer: a library for operating Elasticsearch nickcanz jessbreckenridge March 05, 2019 At GitHub, we use Elasticsearch as the main technology backing our search services. In order to administer our clusters, we use ChatOps via Hubot. As of 2017, those commands were a collection of Bash and Ruby-based scripts. An open source parser for GitHub Actions piki February 07, 2019 Since the beta release of GitHub Actions last October, thousands of users have added workflow files to their repositories. But until now, those files only work with the tools GitHub provided: the Actions editor, the Actions execution platform, and the syntax highlighting built into pull requests. To expand that universe, we need to release the parser and the specification for the Actions workflow language as open source. Today, we’re doing that. Upgrading GitHub from Rails 3.2 to 5.2 eileencodes September 28, 2018 On August 15th GitHub celebrated a major milestone: our main application is now running on the latest version of Rails: 5.2.1! Removing jQuery from GitHub.com frontend mislav koddsson muan keithamus September 06, 2018 We have recently completed a milestone where we were able to drop jQuery as a dependency of the frontend code for GitHub.com. This marks the end of a gradual, years-long transition of increasingly decoupling from jQuery until we were able to completely remove the library. In this post, we will explain a bit of history of how we started depending on jQuery in the first place, how we realized when it was no longer needed, and point out that—instead of replacing it with another library or framework—we were able to achieve everything that we needed using standard browser APIs."
