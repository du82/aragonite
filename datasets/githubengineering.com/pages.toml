["https://githubengineering.com/page/10"]
title = "Page 10 of 13 for GitHub Engineering | The Blog of the GitHub Engineering Team"
description = "The Blog of the GitHub Engineering Team"
full_description = "Revamping GitHub's Subversion Bridge spraints jonmagic March 08, 2016 One of GitHub’s niche features is the ability to access a Git repository on GitHub using Subversion clients. Last year we re-architected a large portion of the Subversion bridge to work with our changing infrastructure. Scientist: Measure Twice, Cut Over Once jesseplusplus February 03, 2016 Today we’re releasing Scientist 1.0 to help you rewrite critical code with confidence. Move Fast and Fix Things vmg December 15, 2015 Anyone who has worked on a large enough codebase knows that technical debt is an inescapable reality: The more rapidly an application grows in size and complexity, the more technical debt is accrued. With GitHub’s growth over the last 7 years, we have found plenty of nooks and crannies in our codebase that are inevitably below our very best engineering standards. But we’ve also found effective and efficient ways of paying down that technical debt, even in the most active parts of our systems. GitHub's Metal Cloud leehuffman December 01, 2015 At GitHub we place an emphasis on stability, availability, and performance. A large component of ensuring we excel in these areas is deploying services on bare-metal hardware. This allows us to tailor hardware configurations to our specific needs, guarantee a certain performance profile, and own the availability of our systems from end to end."
