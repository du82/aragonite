["https://gitlab.manjaro.org/help/user/profile/account/two_factor_authentication.md"]
title = "Two factor authentication · Account · Profile · User · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = "Two-factor authentication DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed Two-factor authentication (2FA) provides an additional level of security to your GitLab account. For others to access your account, they would need your username and password and access to your second factor of authentication. GitLab supports as a second factor of authentication: Time-based one-time passwords (TOTP). When enabled, GitLab prompts you for a code when you sign in. Codes are generated by your one-time password authenticator (for example, a password manager on one of your devices). WebAuthn devices. You're prompted to activate your WebAuthn device (usually by pressing a button on it) when you supply your username and password to sign in. This performs secure authentication on your behalf. If you set up a device, also set up a TOTP so you can still access your account if you lose the device. Use personal access tokens with two-factor authentication When 2FA is enabled, you can't use your password to authenticate with Git over HTTPS or the GitLab API. You can use a personal access token instead. OAuth credential helpers The following Git credential helpers authenticate to GitLab using OAuth. This is compatible with two-factor authentication. The first time you authenticate, the helper opens the web browser and GitLab asks you to authorize the app. Subsequent authentication requires no interaction. Git Credential Manager Git Credential Manager (GCM) authenticates by default using OAuth. GCM supports GitLab.com without any manual configuration. To use GCM with self-managed GitLab, see GitLab support. So you do not need to re-authenticate on every push, GCM supports caching as well as a variety of platform-specific credential stores that persist between sessions. This feature is useful whether you use personal access tokens or OAuth. Git for Windows includes Git Credential Manager. Git Credential Manager is developed primarily by GitHub, Inc. It is an open-source project and is supported by the community. git-credential-oauth git-credential-oauth supports GitLab.com and several popular public hosts without any manual configuration needed. To use with self-managed GitLab, see the git-credential-oauth custom hosts documentation. Many Linux distributions include git-credential-oauth as a package. git-credential-oauth is an open-source project supported by the community. Enable two-factor authentication Account email confirmation requirement introduced in GitLab 14.3. Deployed behind the ensure_verified_primary_email_for_2fa flag, enabled by default. Account email confirmation requirement generally available and feature flag ensure_verified_primary_email_for_2fa removed in GitLab 14.4. You can enable 2FA using a: One-time password authenticator. After you enable 2FA, back up your recovery codes. WebAuthn device. In GitLab 14.3 and later, your account email must be confirmed to enable 2FA. Enable one-time password To enable 2FA with a one-time password: In GitLab: Access your User settings. Select Account. Select Enable Two-factor Authentication. On your device (usually your phone): Install a compatible application. For example: Cloud-based (recommended because you can restore access if you lose the hardware device): Authy. Cisco Duo. Other (proprietary): Google Authenticator. Microsoft Authenticator. Other (Free Software) Aegis Authenticator. FreeOTP. In the application, add a new entry in one of two ways: Scan the code displayed by GitLab with your device's camera to add the entry automatically. Enter the details provided to add the entry manually. In GitLab: Enter the six-digit pin number from the entry on your device into Pin code. Enter your current password. Select Submit. If you entered the correct pin, GitLab displays a list of recovery codes. Download them and keep them in a safe place. Enable one-time password using FortiAuthenticator Introduced in GitLab 13.5 with a flag named forti_authenticator. Disabled by default. FLAG: On self-managed GitLab, by default this feature is not available. To make it available per user, an administrator can enable the feature flag named forti_authenticator. On GitLab.com and GitLab Dedicated, this feature is not available. You can use FortiAuthenticator as a one-time password (OTP) provider in GitLab. Users must: Exist in both FortiAuthenticator and GitLab with the same username. Have FortiToken configured in FortiAuthenticator. You need a username and access token for FortiAuthenticator. The access_token shown below is the FortAuthenticator access key. To get the token, see the REST API Solution Guide at Fortinet Document Library. GitLab 13.5 has been tested with FortAuthenticator version 6.2.0. Configure FortiAuthenticator in GitLab. On your GitLab server: Open the configuration file. For Linux package installations: sudo editor /etc/gitlab/gitlab.rb For self-compiled installations: cd /home/git/gitlab sudo -u git -H editor config/gitlab.yml Add the provider configuration. For Linux package installations: gitlab_rails['forti_authenticator_enabled'] = true gitlab_rails['forti_authenticator_host'] = 'forti_authenticator.example.com' gitlab_rails['forti_authenticator_port'] = 443 gitlab_rails['forti_authenticator_username'] = '<some_username>' gitlab_rails['forti_authenticator_access_token'] = 's3cr3t' For self-compiled installations: forti_authenticator: enabled: true host: forti_authenticator.example.com port: 443 username: <some_username> access_token: s3cr3t Save the configuration file. Reconfigure (Linux package installations) or restart (self-compiled installations). Enable one-time password using Cisco Duo Introduced in GitLab 15.10. FLAG: On self-managed GitLab, by default this feature is available. On GitLab.com this feature is not available. You can use Cisco Duo as an OTP provider in GitLab. DUO® is a registered trademark of Cisco Systems, Inc., and/or its affiliates in the United States and certain other countries. Prerequisites To use Cisco Duo as an OTP provider: Your account must exist in both Cisco Duo and GitLab, with the same username in both applications. You must have configured Cisco Duo and have an integration key, secret key, and API hostname. For more information, see the Cisco Duo API documentation. GitLab 15.10 has been tested with Cisco Duo version D261.14 Configure Cisco Duo in GitLab On your GitLab server: Open the configuration file. For Linux package installations: sudo editor /etc/gitlab/gitlab.rb For self-compiled installations: cd /home/git/gitlab sudo -u git -H editor config/gitlab.yml Add the provider configuration. For Linux package installations: gitlab_rails['duo_auth_enabled'] = false gitlab_rails['duo_auth_integration_key'] = '<duo_integration_key_value>' gitlab_rails['duo_auth_secret_key'] = '<duo_secret_key_value>' gitlab_rails['duo_auth_hostname'] = '<duo_api_hostname>' For self-compiled installations: duo_auth: enabled: true hostname: <duo_api_hostname> integration_key: <duo_integration_key_value> secret_key: <duo_secret_key_value> Save the configuration file. For Linux package installations, reconfigure GitLab. For self-compiled installations, restart GitLab. Enable one-time password using FortiToken Cloud DETAILS: Offering: Self-managed Introduced in GitLab 13.7 with a flag named forti_token_cloud. Disabled by default. FLAG: On self-managed GitLab, by default this feature is not available. To make it available per user, an administrator can enable the feature flag named forti_token_cloud. On GitLab.com and GitLab Dedicated, this feature is not available. This feature is not ready for production use. You can use FortiToken Cloud as a one-time password (OTP) provider in GitLab. Users must: Exist in both FortiToken Cloud and GitLab with the same username. Have FortiToken configured in FortiToken Cloud. You need a client_id and client_secret to configure FortiToken Cloud. To get these, see the REST API Guide at Fortinet Document Library. Configure FortiToken Cloud in GitLab. On your GitLab server: Open the configuration file. For Linux package installations: sudo editor /etc/gitlab/gitlab.rb For self-compiled installations: cd /home/git/gitlab sudo -u git -H editor config/gitlab.yml Add the provider configuration. For Linux package installations: gitlab_rails['forti_token_cloud_enabled'] = true gitlab_rails['forti_token_cloud_client_id'] = '<your_fortinet_cloud_client_id>' gitlab_rails['forti_token_cloud_client_secret'] = '<your_fortinet_cloud_client_secret>' For self-compiled installations: forti_token_cloud: enabled: true client_id: YOUR_FORTI_TOKEN_CLOUD_CLIENT_ID client_secret: YOUR_FORTI_TOKEN_CLOUD_CLIENT_SECRET Save the configuration file. Reconfigure (Linux package installations) or restart (self-compiled installations). Set up a WebAuthn device WebAuthn devices introduced in GitLab 13.4 with a flag named webauthn. Disabled by default. WebAuthn devices enabled on GitLab.com and self-managed in GitLab 14.6. Optional one-time password authentication for WebAuthn devices introduced in GitLab 15.10 with a flag named webauthn_without_topt. Enabled on GitLab.com and self-managed by default. FLAG: On self-managed GitLab, by default, WebAuthn devices are available. To disable the feature, an administrator can disable the feature flag named webauthn. If you disable the WebAuthn feature flag after WebAuthn devices have been registered, these devices are not usable until you re-enable this feature. On GitLab.com, WebAuthn devices are available. FLAG: On self-managed GitLab, by default, optional one-time password authentication for WebAuthn devices is not available. To enable the feature, an administrator can enable the feature flag named webauthn_without_totp. On GitLab.com, this feature is available. On GitLab Dedicated, this feature is not available. WebAuthn is supported by the following: Desktop browsers: Chrome Edge Firefox Opera Safari Mobile browsers: Chrome for Android Firefox for Android iOS Safari (since iOS 13.3) To set up 2FA with a WebAuthn-compatible device: Optional. Set up a one-time password. Access your User settings. Select Account. Select Enable Two-Factor Authentication. Plug in your WebAuthn device. Enter a device name and in GitLab 15.10 and later, your GitLab account password. You might not need to enter this password if you have signed in through your identity provider. Select Set up New WebAuthn Device. Depending on your device, you might have to press a button or touch a sensor. You should receive a message indicating that you successfully set up your device. When you set up 2FA with a WebAuthn-compatible device, that device is linked to a specific browser on a specific computer. Depending on the browser and WebAuthn device, you might be able to configure settings to use the WebAuthn device on a different browser or computer. If this is the first time you have set up 2FA, you must download recovery codes so you can recover access to your account if you lose access. WARNING: You can lose access to your account if you clear your browser data. Recovery codes Introduced in GitLab 13.7, Copy codes and Print codes buttons. Immediately after successfully enabling 2FA with a one-time password, you're prompted to download a set of generated recovery codes. If you ever lose access to your one-time password authenticator, you can use one of these recovery codes to sign in to your account. WARNING: Each code can be used only once to sign in to your account. You should copy and print the codes, or use Download codes to download them for storage in a safe place. If you choose to download them, the file is called gitlab-recovery-codes.txt. NOTE: Recovery codes are not generated for WebAuthn devices. If you lose the recovery codes, or want to generate new ones, you can use either: The 2FA account settings page. SSH. Regenerate two-factor authentication recovery codes To regenerate 2FA recovery codes, you need access to a desktop browser: Access your User settings. Select Account > Two-Factor Authentication (2FA). If you've already configured 2FA, select Manage two-factor authentication. In the Register Two-Factor Authenticator pane, enter your current password and select Regenerate recovery codes. NOTE: If you regenerate 2FA recovery codes, save them. You can't use any previously created 2FA codes. Sign in with two-factor authentication enabled Signing in with 2FA enabled is only slightly different than the typical sign-in process. Enter your username and password and you're presented with a second prompt, depending on which type of 2FA you've enabled. Sign in using a one-time password When asked, enter the pin from your one-time password authenticator's application or a recovery code to sign in. Sign in using a WebAuthn device In supported browsers, you should be automatically prompted to activate your WebAuthn device (for example, by touching or pressing its button) after entering your credentials. A message displays indicating that your device responded to the authentication request and you're automatically signed in. Disable two-factor authentication To disable 2FA: Access your User settings. Select Account. Select Manage two-factor authentication. Under Register Two-Factor Authenticator, enter your current password and select Disable two-factor authentication. This clears all your 2FA registrations, including mobile applications and WebAuthn devices. Recovery options If you don't have access to your code generation device, you can recover access to your account: Use a saved recovery code, if you saved them when you enabled two-factor authentication. Generate new recovery codes using SSH, if you didn't save your original recovery codes but have an SSH key. Have 2FA disabled on your account, if you don't have your recovery codes or an SSH key. Use a saved recovery code To use a recovery code: Enter your username or email, and password, on the GitLab sign-in page. When prompted for a two-factor code, enter the recovery code. After you use a recovery code, you cannot re-use it. You can still use the other recovery codes you saved. Generate new recovery codes using SSH If you forget to save your recovery codes when enabling 2FA, and you added an SSH key to your GitLab account, you can generate a new set of recovery codes with SSH: In a terminal, run: ssh git@gitlab.com 2fa_recovery_codes On self-managed instances, replace gitlab.com in the command above with the GitLab server hostname (gitlab.example.com). You are prompted to confirm that you want to generate new codes. This process invalidates previously-saved codes. For example: Are you sure you want to generate new two-factor recovery codes? Any existing recovery codes you saved will be invalidated. (yes/no) yes Your two-factor authentication recovery codes are: 119135e5a3ebce8e 11f6v2a498810dcd 3924c7ab2089c902 e79a3398bfe4f224 34bd7b74adbc8861 f061691d5107df1a 169bf32a18e63e7f b510e7422e81c947 20dbed24c5e74663 df9d3b9403b9c9f0 During sign in, use one of the codes "
