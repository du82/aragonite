["https://gitlab.manjaro.org/help/user/permissions.md"]
title = "Permissions · User · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = "Permissions and roles DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed, GitLab Dedicated When you add a user to a project or group, you assign them a role. The role determines which actions they can take in GitLab. If you add a user to both a project's group and the project itself, the higher role is used. GitLab administrators have all permissions. Roles You can assign users a default role or a custom role. The available default roles are: Guest (This role applies to private and internal projects only.) Reporter Developer Maintainer Owner Minimal Access (available for the top-level group only) A user assigned the Guest role has the least permissions, and the Owner has the most. By default, all users can create top-level groups and change their usernames. A GitLab administrator can change this behavior for the GitLab instance. Project members permissions Introduced in GitLab 14.8, personal namespace owners appear with Owner role in new projects in their namespace. Introduced with a flag named personal_project_owner_with_owner_access. Disabled by default. Generally available in GitLab 14.9. Feature flag personal_project_owner_with_owner_access removed. A user's role determines what permissions they have on a project. The Owner role provides all permissions but is available only: For group and project Owners. In GitLab 14.8 and earlier, the role is inherited for a group's projects. For Administrators. Personal namespace owners: Are displayed as having the Maintainer role on projects in the namespace, but have the same permissions as a user with the Owner role. In GitLab 14.9 and later, for new projects in the namespace, are displayed as having the Owner role. For more information about how to manage project members, see members of a project. The following table lists project permissions available for each role: Action Guest Reporter Developer Maintainer Owner Notes Analytics:View issue analytics ✓ ✓ ✓ ✓ ✓ Analytics:View value stream analytics ✓ ✓ ✓ ✓ ✓ Analytics:View DORA metrics ✓ ✓ ✓ ✓ Analytics:View CI/CD analytics ✓ ✓ ✓ ✓ Analytics:View code review analytics ✓ ✓ ✓ ✓ Analytics:View merge request analytics ✓ ✓ ✓ ✓ Analytics:View repository analytics ✓ ✓ ✓ ✓ Application security:View licenses in dependency list ✓ ✓ ✓ Application security:Create and run on-demand DAST scans ✓ ✓ ✓ Application security:View dependency list ✓ ✓ ✓ Application security:Create a CVE ID Request ✓ ✓ Application security:Create or assign security policy project ✓ Application security:Create, edit, delete individual security policies ✓ ✓ ✓ Container Registry:Create, edit, delete cleanup policies ✓ ✓ Container registry:Push an image to the container registry ✓ ✓ ✓ Container registry:Pull an image from the container registry ✓ ✓ ✓ ✓ ✓ The ability to view the container registry and pull images is controlled by the container registry's visibility permissions. Container registry:Remove a container registry image ✓ ✓ ✓ GitLab agent for Kubernetes:View agents ✓ ✓ ✓ GitLab agent for Kubernetes:Manage agents ✓ ✓ GitLab Pages:View Pages protected by access control ✓ ✓ ✓ ✓ ✓ GitLab Pages:Manage ✓ ✓ GitLab Pages:Manage GitLab Pages domains and certificates ✓ ✓ GitLab Pages:Remove GitLab Pages ✓ ✓ Incident Management:Assign an alert ✓ ✓ ✓ ✓ ✓ Incident Management:Participate in on-call rotation ✓ ✓ ✓ ✓ ✓ Incident Management:View incident ✓ ✓ ✓ ✓ ✓ Incident Management:Change alert status ✓ ✓ ✓ ✓ Incident Management:Change incident severity ✓ ✓ ✓ ✓ Incident Management:Create incident ✓ ✓ ✓ ✓ Incident Management:View alerts ✓ ✓ ✓ ✓ Incident Management:View escalation policies ✓ ✓ ✓ ✓ Incident Management:View on-call schedules ✓ ✓ ✓ ✓ Incident Management:Change incident escalation status ✓ ✓ ✓ Incident Management:Change incident escalation policy ✓ ✓ ✓ Incident Management:Manage on-call schedules ✓ ✓ Incident Management:Manage escalation policies ✓ ✓ Issue boards:Create or delete lists ✓ ✓ ✓ ✓ Issue boards:Move issues between lists ✓ ✓ ✓ ✓ Issues:Add Labels ✓ ✓ ✓ ✓ ✓ Guest users can only set metadata (for example, labels, assignees, or milestones) when creating an issue. They cannot change the metadata on existing issues. Issues:Add to epic ✓ ✓ ✓ ✓ You must have permission to view the epic. Issues:Assign ✓ ✓ ✓ ✓ ✓ Guest users can only set metadata (for example, labels, assignees, or milestones) when creating an issue. They cannot change the metadata on existing issues. Issues:Create ✓ ✓ ✓ ✓ ✓ Authors and assignees can modify the title and description even if they don't have the Reporter role. Issues:Create confidential issues ✓ ✓ ✓ ✓ ✓ Issues:View Design Management pages ✓ ✓ ✓ ✓ ✓ Issues:View related issues ✓ ✓ ✓ ✓ ✓ Issues:Set weight ✓ ✓ ✓ ✓ Issues:Set metadata such as labels, milestones, or assignees when creating an issue ✓ ✓ ✓ ✓ ✓ Guest users can only set metadata (for example, labels, assignees, or milestones) when creating an issue. They cannot change the metadata on existing issues. Issues:Edit metadata such labels, milestones, or assignees for an existing issue ✓ ✓ ✓ ✓ Guest users can only set metadata (for example, labels, assignees, or milestones) when creating an issue. They cannot change the metadata on existing issues. Issues:Set parent epic ✓ ✓ ✓ ✓ Issues:View confidential issues ✓ ✓ ✓ ✓ Guest users can only view the confidential issues they created themselves or are assigned to. Issues:Close / reopen ✓ ✓ ✓ ✓ Authors and assignees can close and reopen issues even if they don't have the Reporter role. Issues:Lock threads ✓ ✓ ✓ ✓ Issues:Manage related issues ✓ ✓ ✓ ✓ Issues:Manage tracker ✓ ✓ ✓ ✓ Issues:Move issues ✓ ✓ ✓ ✓ Attached design files are moved together with the issue. Issues:Set issue time tracking estimate and time spent ✓ ✓ ✓ ✓ Issues:Archive Design Management files ✓ ✓ ✓ ✓ Issues:Upload Design Management files ✓ ✓ ✓ ✓ Issues:Delete ✓ License Scanning:View allowed and denied licenses ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. License Scanning:View License Compliance reports ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. License Scanning:View License list ✓ ✓ ✓ ✓ License approval policies:Manage license policy ✓ ✓ Merge requests:View a merge request ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. Merge requests:Assign reviewer ✓ ✓ ✓ Merge requests:View list ✓ ✓ ✓ ✓ Members with the Guest role can view the list of MRs in public projects. Private projects restrict Guests from viewing MR lists. Merge requests:Apply code change suggestions ✓ ✓ ✓ Merge requests:Approve ✓ ✓ ✓ For information on eligible approvers for merge requests, see Eligible approvers. Merge requests:Assign ✓ ✓ ✓ Merge requests:Create ✓ ✓ ✓ In projects that accept contributions from external members, users can create, edit, and close their own merge requests. Merge requests:Add labels ✓ ✓ ✓ Merge requests:Lock threads ✓ ✓ ✓ Merge requests:Manage or accept ✓ ✓ ✓ Merge requests:Resolve a thread ✓ ✓ ✓ Merge requests:Manage merge approval rules (project settings) ✓ ✓ Merge requests:Delete ✓ Objectives and key results:Add a child OKR ✓ ✓ ✓ ✓ ✓ Objectives and key results:Add a linked item ✓ ✓ ✓ ✓ ✓ Objectives and key results:Create ✓ ✓ ✓ ✓ ✓ Objectives and key results:View ✓ ✓ ✓ ✓ ✓ Objectives and key results:Change confidentiality ✓ ✓ ✓ ✓ Objectives and key results:Edit ✓ ✓ ✓ ✓ Package registry:Pull a package ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. Package registry:Publish a package ✓ ✓ ✓ Package registry:Delete a package ✓ ✓ Package registry:Delete a file associated with a package ✓ ✓ Project operations:View Error Tracking list ✓ ✓ ✓ ✓ Project operations:Manage Feature flags ✓ ✓ ✓ Project operations:Manage Error Tracking ✓ ✓ Projects:Download project ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. Projects:Leave comments ✓ ✓ ✓ ✓ ✓ Projects:Reposition comments on images (posted by any user) ✓ ✓ ✓ ✓ ✓ Applies only to comments on Design Management designs. Projects:View Insights ✓ ✓ ✓ ✓ ✓ Projects:View releases ✓ ✓ ✓ ✓ ✓ Guest users can access GitLab Releases for downloading assets but are not allowed to download the source code nor see repository information like commits and release evidence. Projects:View Requirements ✓ ✓ ✓ ✓ ✓ Projects:View time tracking reports ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. Projects:View wiki pages ✓ ✓ ✓ ✓ ✓ Projects:Create snippets ✓ ✓ ✓ ✓ Projects:Manage labels ✓ ✓ ✓ ✓ Projects:View project traffic statistics ✓ ✓ ✓ ✓ Projects:Create, edit, delete milestones. ✓ ✓ ✓ ✓ Projects:Create, edit, delete releases ✓ ✓ ✓ If the tag is protected, this depends on the access given to Developers and Maintainers. Projects:Create, edit wiki pages ✓ ✓ ✓ Projects:Enable Review Apps ✓ ✓ ✓ Projects:View project Audit Events ✓ ✓ ✓ Users can only view events based on their individual actions. Projects:Add deploy keys ✓ ✓ Projects:Add new team members ✓ ✓ Projects:Manage team members ✓ ✓ Maintainers cannot create, demote, or remove Owners, and they cannot promote users to the Owner role. They also cannot approve Owner role access requests. Projects:Change project features visibility level ✓ ✓ A Maintainer or Owner can't change project features visibility level if project visibility is set to private. Projects:Configure webhooks ✓ ✓ Projects:Delete wiki pages ✓ ✓ ✓ Projects:Edit comments (posted by any user) ✓ ✓ Projects:Edit project badges ✓ ✓ Projects:Edit project settings ✓ ✓ Projects:Export project ✓ ✓ Projects:Manage project access tokens ✓ ✓ For self-managed GitLab, project access tokens are available in all tiers. For GitLab.com, project access tokens are supported in the Premium and Ultimate tier (excluding trial licenses). Projects:Manage Project Operations ✓ ✓ Projects:Rename project ✓ ✓ Projects:Share (invite) projects with groups ✓ ✓ When Share Group Lock is enabled the project can't be shared with other groups. It does not affect group with group sharing. Projects:View 2FA status of members ✓ ✓ Projects:Assign project to a compliance framework ✓ Projects:Archive project ✓ Projects:Change project visibility level ✓ Projects:Delete project ✓ Projects:Disable notification emails ✓ Projects:Transfer project to another namespace ✓ Projects: View Usage Quotas page ✓ ✓ Repository:Pull project code ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. Repository:View project code ✓ ✓ ✓ ✓ ✓ On self-managed GitLab instances, users with the Guest role are able to perform this action only on public and internal projects (not on private projects). External users must be given explicit access (at least the Reporter role) even if the project is internal. Users with the Guest role on GitLab.com are only able to perform this action on public projects because internal visibility is not available. In GitLab 15.9 and later, users with the Guest role and an Ultimate license can view private repository content if an administrator (on self-managed or GitLab Dedicated) or group owner (on GitLab.com) gives those users permission. The administrator or group owner can create a custom role through the API or UI and assign that role to the users. Repository:View a commit status ✓ ✓ ✓ ✓ Repository:Add tags ✓ ✓ ✓ Repository:Create new branches ✓ ✓ ✓ Repository:Create or update commit status ✓ ✓ ✓ If the branch is protected, this depends on the access given to Developers and Maintainers. Repository:Force push to non-protected branches ✓ ✓ ✓ Repository:Push to non-protected branches ✓ ✓ ✓ Repository:Remove non-protected branches ✓ ✓ ✓ Repository:Rewrite or remove Git tags ✓ ✓ ✓ Repository:Enable or disable branch protection ✓ ✓ Repository:Enable or disable tag protection ✓ ✓ Repository:Manage push rules ✓ ✓ Repository:Push to protected branches ✓ ✓ If the branch is protected, this depends on the access given to Developers and Maintainers. Repository:Turn on or off protected branch push for developers ✓ ✓ Repository:Remove fork relationship ✓ Repository:Force push to protected branches Not allowed for Guest, Reporter, Developer, Maintainer, or Owner. See protected branches. Repository:Remove protected branches by using the UI or API ✓ ✓ Requirements Management:Archive / reopen ✓ ✓ ✓ ✓ Authors and assignees can archive and re-open even if they don’t have the Reporter role. Requirements Management:Create / edit ✓ ✓ ✓ ✓ Authors and assignees can modify the title and description even if they don’t have the Reporter role. Requirements Management:Import / export ✓ ✓ ✓ ✓ Security dashboard:Create issue from vulnerability finding ✓ ✓ ✓ Se"
