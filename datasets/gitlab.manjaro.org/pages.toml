["https://gitlab.manjaro.org/help/administration/reference_architectures/index.md"]
title = "Index · Reference architectures · Administration · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''Reference architectures DETAILS: Tier: Free, Premium, Ultimate Offering: Self-managed The GitLab Reference Architectures have been designed and tested by the GitLab Test Platform and Support teams to provide scalable recommended deployments for target loads. Available reference architectures The following Reference Architectures are available as recommended starting points for your environment. The architectures are named in terms of peak load, based on user count or Requests per Second (RPS). Where the latter has been calculated based on average real data of the former with headroom added. NOTE: Each architecture has been designed to be scalable and can be adjusted accordingly if required by your specific workload. This may be likely in known heavy scenarios such as using large monorepos or notable additional workloads. For details about what each Reference Architecture has been tested against, see the "Testing Methodology" section of each page. GitLab package (Omnibus) Below is the list of Linux package based reference architectures: Up to 20 RPS or 1,000 users _API: 20 RPS, Web: 2 RPS, Git (Pull): 2 RPS, Git (Push): 1 RPS_ Up to 40 RPS or 2,000 users _API: 40 RPS, Web: 4 RPS, Git (Pull): 4 RPS, Git (Push): 1 RPS_ Up to 60 RPS or 3,000 users _API: 60 RPS, Web: 6 RPS, Git (Pull): 6 RPS, Git (Push): 1 RPS_ Up to 100 RPS or 5,000 users _API: 100 RPS, Web: 10 RPS, Git (Pull): 10 RPS, Git (Push): 2 RPS_ Up to 200 RPS or 10,000 users _API: 200 RPS, Web: 20 RPS, Git (Pull): 20 RPS, Git (Push): 4 RPS_ Up to 500 RPS or 25,000 users _API: 500 RPS, Web: 50 RPS, Git (Pull): 50 RPS, Git (Push): 10 RPS_ Up to 1000 RPS or 50,000 users _API: 1000 RPS, Web: 100 RPS, Git (Pull): 100 RPS, Git (Push): 20 RPS_ Cloud native hybrid Below is a list of Cloud Native Hybrid reference architectures, where select recommended components can be run in Kubernetes: 40 RPS or Up to 2,000 users _API: 40 RPS, Web: 4 RPS, Git (Pull): 4 RPS, Git (Push): 1 RPS_ 60 RPS or Up to 3,000 users _API: 60 RPS, Web: 6 RPS, Git (Pull): 6 RPS, Git (Push): 1 RPS_ 100 RPS or Up to 5,000 users _API: 100 RPS, Web: 10 RPS, Git (Pull): 10 RPS, Git (Push): 2 RPS_ 200 RPS or Up to 10,000 users _API: 200 RPS, Web: 20 RPS, Git (Pull): 20 RPS, Git (Push): 4 RPS_ 500 RPS or Up to 25,000 users _API: 500 RPS, Web: 50 RPS, Git (Pull): 50 RPS, Git (Push): 10 RPS_ 1000 RPS or Up to 50,000 users _API: 1000 RPS, Web: 100 RPS, Git (Pull): 100 RPS, Git (Push): 20 RPS_ Before you start The first choice to consider is whether a Self Managed approach is correct for you and your requirements. Running any application in production is complex, and the same applies for GitLab. While we aim to make this as smooth as possible, there are still the general complexities. This depends on the design chosen, but typically you'll need to manage all aspects such as hardware, operating systems, networking, storage, security, GitLab itself, and more. This includes both the initial setup of the environment and the longer term maintenance. As such, it's recommended that you have a working knowledge of running and maintaining applications in production when deciding on going down this route. If you aren't in this position, our Professional Services team offers implementation services, but for those who want a more managed solution long term, it's recommended to instead explore our other offerings such as GitLab SaaS or GitLab Dedicated. If Self Managed is the approach you're considering, it's strongly encouraged to read through this page in full, in particular the Deciding which architecture to use, Large monorepos and Additional workloads sections. Deciding which architecture to use The Reference Architectures are designed to strike a balance between two important factors--performance and resilience. While they are designed to make it easier to set up GitLab at scale, it can still be a challenge to know which one meets your requirements. As a general guide, the more performant and/or resilient you want your environment to be, the more complex it is. This section explains the designs you can choose from. It begins with the least complexity, goes to the most, and ends with a decision tree. Expected Load (RPS or user count) The first thing to check is what the expected peak load is your environment would be expected to serve. Each architecture is described in terms of peak Requests per Second (RPS) or user count load. As detailed under the "Testing Methodology" section on each page, each architecture is tested against its listed RPS for each endpoint type (API, Web, Git), which is the typical peak load of the given user count, both manual and automated, with headroom. It's strongly recommended finding out what peak RPS your environment will be expected to handle across endpoint types, through existing metrics (such as Prometheus) or estimates, and to select the corresponding architecture as this is the most objective. If it's not possible for you to find out the expected peak RPS then it's recommended to select based on user count to start and then monitor the environment closely to confirm the RPS, whether the architecture is performing and adjust accordingly is necessary. Standalone (non-HA) For environments serving 2,000 or fewer users, we generally recommend a standalone approach by deploying a non-highly available single or multi-node environment. With this approach, you can employ strategies such as automated backups for recovery to provide a good level of RPO / RTO while avoiding the complexities that come with HA. *[RTO]: Recovery time objective *[RPO]: Recovery point objective With standalone setups, especially single node environments, there are various options available for installation and management including the ability to deploy directly via select cloud provider marketplaces that reduce the complexity a little further. High Availability (HA) High Availability ensures every component in the GitLab setup can handle failures through various mechanisms. However, to achieve this is complex, and the environments required can be sizable. For environments serving 3,000 or more users we generally recommend that a HA strategy is used as at this level outages have a bigger impact against more users. All the architectures in this range have HA built in by design for this reason. Do you need High Availability (HA)? As mentioned above, achieving HA does come at a cost. The environment requirements are sizable as each component needs to be multiplied, which comes with additional actual and maintenance costs. For a lot of our customers with fewer than 3,000 users, we've found a backup strategy is sufficient and even preferable. While this does have a slower recovery time, it also means you have a much smaller architecture and less maintenance costs as a result. In general then, we'd only recommend you employ HA in the following scenarios: When you have 3,000 or more users. When GitLab being down would critically impact your workflow. Scaled-down High Availability (HA) approaches If you still need to have HA for a lower number of users, this can be achieved with an adjusted 3K architecture. Zero Downtime Upgrades Zero Downtime Upgrades are available for standard Reference Architecture environments with HA (Cloud Native Hybrid is not supported). This allows for an environment to stay up during an upgrade, but the process is more complex as a result and has some limitations as detailed in the documentation. When going through this process it's worth noting that there may still be brief moments of downtime when the HA mechanisms take effect. In most cases the downtime required for doing an upgrade shouldn't be substantial, so this is only recommended if it's a key requirement for you. Cloud Native Hybrid (Kubernetes HA) As an additional layer of HA resilience you can deploy select components in Kubernetes, known as a Cloud Native Hybrid Reference Architecture. For stability reasons, stateful components such as Gitaly cannot be deployed in Kubernetes. This is an alternative and more advanced setup compared to a standard Reference Architecture. Running services in Kubernetes is well known to be complex. This setup is only recommended if you have strong working knowledge and experience in Kubernetes. GitLab Geo (Cross Regional Distribution / Disaster Recovery) With GitLab Geo, you can achieve distributed environments in different regions with a full Disaster Recovery (DR) setup in place. GitLab Geo requires at least two separate environments: One primary site. One or more secondary sites that serve as replicas. If the primary site becomes unavailable, you can fail over to one of the secondary sites. This advanced and complex setup should only be undertaken if DR is a key requirement for your environment. You must also make additional decisions on how each site is configured, such as if each secondary site would be the same architecture as the primary, or if each site is configured for HA. Large monorepos / Additional workloads If you have any large monorepos or significant additional workloads, these can affect the performance of the environment notably and adjustments may be required depending on the context. If either applies to you, it's encouraged for you to reach out to your Customer Success Manager or our Support team for further guidance. Cloud provider services For all the previously described strategies, you can run select GitLab components on equivalent cloud provider services such as the PostgreSQL database or Redis. For more information, see the recommended cloud providers and services. Decision Tree Below you can find the above guidance in the form of a decision tree. It's recommended you read through the above guidance in full first before though. %%{init: { 'theme': 'base' } }%% graph TD L0A(<b>What Reference Architecture should I use?</b>) L1A(<b>What is your <a href=#expected-load-rps>expected load</a>?</b>) L2A("Equivalent to <a href=3k_users.md#testing-methodology>3,000 users</a> or more?") L2B("Equivalent to <a href=2k_users.md#testing-methodology>2,000 users</a> or less?") L3A("<a href=#do-you-need-high-availability-ha>Do you need HA?</a><br>(or Zero-Downtime Upgrades)") L3B[Do you have experience with<br/>and want additional resilience<br/>with select components in Kubernetes?] L4A><b>Recommendation</b><br><br>60 RPS / 3K users architecture with HA<br>and supported reductions] L4B><b>Recommendation</b><br><br>Architecture closest to user<br>count with HA] L4C><b>Recommendation</b><br><br>Cloud Native Hybrid architecture<br>closest to user count] L4D>"<b>Recommendation</b><br><br>Standalone 20 RPS / 1K users or 40 RPS / 2K users<br/>architecture with Backups"] L0A --> L1A L1A --> L2A L1A --> L2B L2A -->|Yes| L3B L3B -->|Yes| L4C L3B -->|No| L4B L2B --> L3A L3A -->|Yes| L4A L3A -->|No| L4D L5A("<a href=#gitlab-geo-cross-regional-distribution-disaster--recovery>Do you need cross regional distribution</br> or disaster recovery?"</a>) --> |Yes| L6A><b>Additional Recommendation</b><br><br> GitLab Geo] L4A ~~~ L5A L4B ~~~ L5A L4C ~~~ L5A L4D ~~~ L5A L5B("Do you have <a href=#large-monorepos>Large Monorepos</a> or expect</br> to have substantial <a href=#additional-workloads>additional workloads</a>?") --> |Yes| L6B><b>Additional Recommendation</b><br><br> Contact Customer Success Manager or Support] L4A ~~~ L5B L4B ~~~ L5B L4C ~~~ L5B L4D ~~~ L5B classDef default fill:#FCA326 linkStyle default fill:none,stroke:#7759C2 Requirements Before implementing a reference architecture, refer to the following requirements and guidance. Supported CPUs These reference architectures were built and tested on Google Cloud Platform (GCP) using the Intel Xeon E5 v3 (Haswell) CPU platform as the lowest common denominator baseline (Sysbench benchmark). Newer, similarly-sized CPUs are supported and may have improved performance as a result. ARM CPUs are supported for Linux package environments as well as for any Cloud Provider services where applicable. NOTE: Any "burstable" instance types are not recommended due to inconsistent performance. Supported disk types As a general guidance, most standard disk types are expected to work for GitLab, but be aware of the following specific call-outs: Gitaly requires at least 8,000 input/output operations per second (IOPS) for read operations, and 2,000 IOPS for write operations. We don't recommend the use of any disk types that are "burstable" due to inconsistent performance. Outside the above standard, disk types are expected to work for GitLab and the choice of each depends on your specific requirements around areas, such as durability or costs. Supported infrastructure As a general guidance, GitLab should run on most infrastructure such as reputable Cloud Providers (AWS, GCP, Azure) and their services, or self-managed (ESXi) that meet both: The specifications detailed in each reference architecture. Any requirements in this section. However, this does not constitute a guarantee for every potential permutation. See Recommended cloud providers and services for more information. Large Monorepos The reference architectures were tested with repositories of varying sizes that follow best practices. However, large monorepos (several gigabytes or more) can significantly impact the performance of Git and in turn the environment itself. Their presence, as well as how they are used, can put a significant strain on the entire system from Gitaly through to the underlying infrastructure. WARNING: If this applies to you, we strongly recommended referring to the linked documentation as well as reaching out to your Customer Success Manager or our Support team for further guidance. As such, large monorepos come with notable cost. If you have such a repository we strongly recommend the following guidance is followed to ensure the best chance of good performance and to keep costs in check: Optimize the large monorepo. Using features such as LFS to not store binaries, and other approaches for reducing repository size, can dramatically improve performance and reduce costs. Depending on the monorepo, increased environment specifications may be required to compensate. Gitaly in particular will likely require additional resources along with Praefect, GitLab Rails, and Load Balancers. This depends notably on the monorepo itself and the usage against it. When the monorepo is significantly large (20 gigabytes or more) further additional strategies maybe required such as even further increased specifications or in some cases a separate Gitaly backend for the monorepo alone. Network and disk bandwidth is another potential consideration with large monorepos. In very heavy cases, it's possible to see bandwidth saturation if there's a high amount of concurrent clones (such as with CI). It's strongly recommended reducing full clones wherever possible in this scenario. Otherwise, additional environment specifications may be required to increase bandwidth, but this differs between cloud providers. Additiona'''
