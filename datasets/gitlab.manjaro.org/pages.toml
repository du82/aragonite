["https://gitlab.manjaro.org/applications/application-utility/-/commits/master"]
title = "Commits · master · Applications / application-utility · GitLab"
description = "Commented out code related to the appstream info bar, including setup logic, handlers, and detailed box functionalities, as it is no longer in use. This cleanup reduces clutter and improves code readability without affecting existing functionality."
full_description = '''application-utility Jan 27, 2025 Remove unused appstream info bar setup and related methods · 70d880a4 Frede H authored Jan 27, 2025 Commented out code related to the appstream info bar, including setup logic, handlers, and detailed box functionalities, as it is no longer in use. This cleanup reduces clutter and improves code readability without affecting existing functionality. 70d880a4 Jan 24, 2025 Merge branch 'issue44-update-application-list' into 'master' · cd2df7e3 Frede H authored Jan 24, 2025 Refactor app descriptions and update application list. See merge request !14 1.4.1 cd2df7e3 Refactor logging levels and update dependencies · 6f2d03bb Frede H authored Jan 24, 2025 Adjusted logging levels from info/warning to debug/error for better clarity and error tracking. Added new dependencies and updated existing ones in requirements.txt. Included "phoepsilonix" as an author and reorganized imports for consistent structure. 6f2d03bb Refactor config handling and improve logging. · 78341102 Frede H authored Jan 24, 2025 Updated configuration structure for consistency across modules by replacing legacy variable names with more descriptive ones (e.g., `_MERGE_FILE` to `APPS_MERGE_FILE`). Enhanced logging for debugging and adjusted dynamic paths in dev-mode and runtime scenarios to ensure better maintainability and flexibility. Added the `pillow` package to requirements and fixed minor code style issues. 78341102 Restore default preferences.json file · 1b54aaf7 Frede H authored Jan 24, 2025 Restoring preferences.json file with default configurations, including data-set, user-path, and URL for the application utility. This lays the groundwork for improved configurability and better defaults handling. 1b54aaf7 Merge branch 'master' into prepare-resource-consolidation · d13062bc Frede H authored Jan 24, 2025 d13062bc Bump version to 1.4.0 · 81998963 Frede H authored Jan 24, 2025 Upgrade version from 1.3.3 to 1.4.0 to reflect new changes or updates in the application_utility module. Ensures versioning remains consistent with the module's evolution. 81998963 Refactor file structure and update configuration paths · 2692fbae Frede H authored Jan 24, 2025 Renamed and relocated various files for better organization, moving outdated JSON configs to a "trash-pending" directory. Updated `_PREF_FILE` path in `base_config.py` and adjusted `setup.py` to reflect new directory structure and data file placements. 2692fbae Remove unused get_desktop_tests method from base_config.py · 512c7e90 Frede H authored Jan 24, 2025 The get_desktop_tests method was removed as it was unused and marked with a TODO to remove or move to tests. Its removal helps clean up the codebase and eliminates unnecessary clutter. 512c7e90 Merge branch 'patch' into 'master' · bc86a8a6 Frede H authored Jan 24, 2025 Refactor and improve app appending logic in Data class See merge request !12 bc86a8a6 Refactor and improve app appending logic in Data class · 9f3fb23e phoepsilonix authored Jan 24, 2025 and Frede H committed Jan 24, 2025 9f3fb23e Jan 19, 2025 wip · 38b6f180 Frede H authored Jan 19, 2025 38b6f180 Jan 02, 2025 Remove unused preferences.json file · ef8a79c0 Frede H authored Jan 02, 2025 The preferences.json file was deleted as it is no longer needed in the project. This reduces unnecessary files and improves codebase maintainability. ef8a79c0 Remove obsolete advanced.json configuration files · dc31a159 Frede H authored Jan 02, 2025 Deleted redundant advanced.json files from application-utility and data directories. These files were no longer in use and their removal simplifies project maintenance. dc31a159 Dec 31, 2024 Refactor app descriptions and update application list. · 35a8c6d6 Frede H authored Dec 31, 2024 Improved app descriptions for clarity and consistency. Removed outdated or redundant applications and added new, popular software options. Adjusted desktop environment filters. 35a8c6d6 Dec 30, 2024 Replace fcitx with fcitx5 · 22d777ae Mark Wagie authored Dec 30, 2024 - manjaro-asian-input-support-fcitx > manjaro-asian-input-support-fcitx5 - closes #11 22d777ae Merge branch 'chrysostomus' into 'master' · 0685f2a4 Mark Wagie authored Dec 30, 2024 merge Chrysostomus' fork See merge request !10 0685f2a4 merge Chrysostomus' fork · 49275bf6 Mark Wagie authored Dec 30, 2024 49275bf6 Aug 27, 2023 fix gettext · 699087a6 Philip Müller authored Aug 27, 2023 699087a6 remove enable_appstream · 6d567a07 Philip Müller authored Aug 27, 2023 6d567a07 remove enable_appstream · 8f1365d5 Philip Müller authored Aug 27, 2023 8f1365d5 Jun 11, 2021 [API] bump to 11 · 97cc8878 Philip Müller authored Jun 11, 2021 97cc8878 Jan 21, 2021 Update default.json · 5d1993b2 Matti Hyttinen authored Jan 21, 2021 5d1993b2 Update default.json · d73f0170 Matti Hyttinen authored Jan 21, 2021 d73f0170 Dec 19, 2020 [API] bump to 10.0 · d85c7bd5 Philip Müller authored Dec 19, 2020 - this is just a bump, please check if some had changed - see also: pamac#922 d85c7bd5 Dec 09, 2020 manually merged merge_requests/8 · b14cd9bc Frede Hundewadt authored Dec 09, 2020 b14cd9bc Dec 02, 2020 update default json · 5b38681f Frede Hundewadt authored Dec 02, 2020 5b38681f Nov 19, 2020 Fixes · 4fa4a800 Matti Hyttinen authored Nov 20, 2020 4fa4a800 Still more tweaks · 5e0d63b3 Matti Hyttinen authored Nov 20, 2020 5e0d63b3 Delete gnome.json · 0ed7d7e0 Matti Hyttinen authored Nov 19, 2020 0ed7d7e0 Tweak packages · 91ed8d4c Matti Hyttinen authored Nov 19, 2020 91ed8d4c Fix typos · 72dccdb4 Matti Hyttinen authored Nov 19, 2020 72dccdb4 For gnome · 5d95a6c3 Matti Hyttinen authored Nov 19, 2020 5d95a6c3 Adjust package selection for gnome · 677d21df Matti Hyttinen authored Nov 19, 2020 677d21df Show group names properly, with the help of @papajoker · 06482e4e Matti Hyttinen authored Nov 19, 2020 06482e4e Nov 18, 2020 Merge branch 'master' into 'master' · 5923f952 Frede H authored Nov 18, 2020 Use less columns See merge request linux-aarhus/application-utility!7 5923f952 Nov 17, 2020 Use less columns · 2a83c5fc Matti Hyttinen authored Nov 18, 2020 2a83c5fc Jun 29, 2020 rename ms-office-online · a118d6c7 Bernhard Landauer authored Jun 29, 2020 a118d6c7 Apr 06, 2020 font-icon · 7b38e193 Frede H authored Apr 06, 2020 7b38e193 version bump · 9391cd02 Frede H authored Apr 06, 2020 9391cd02'''
