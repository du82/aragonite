["https://gitlab.manjaro.org/help/ci/runners/configure_runners.md"]
title = "Configure runners · Runners · Ci · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''Configuring runners DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed, GitLab Dedicated If you have installed your own runners, you can configure and secure them in GitLab. If you need to configure runners on the machine where you installed GitLab Runner, see the GitLab Runner documentation. Set the maximum job timeout You can specify a maximum job timeout for each runner to prevent projects with longer job timeouts from using the runner. The maximum job timeout is used if it is shorter than the job timeout defined in the project. For an instance runner Prerequisites: You must be an administrator. On GitLab.com, you cannot override the job timeout for instance runners and must use the project defined timeout instead. To set the maximum job timeout: On the left sidebar, at the bottom, select Admin Area. Select CI/CD > Runners. To the right of the runner, you want to edit, select Edit ({pencil}). In the Maximum job timeout field, enter a value in seconds. The minimum amount is 600 seconds (10 minutes). Select Save changes. For a group runner Prerequisites: You must have the Owner role for the group. To set the maximum job timeout: On the left sidebar, select Search or go to and find your group. Select Build > Runners. To the right of the runner you want to edit, select Edit ({pencil}). In the Maximum job timeout field, enter a value in seconds. The minimum amount is 600 seconds (10 minutes). Select Save changes. For a project runner Prerequisites: You must have the Owner role for the project. To set the maximum job timeout: On the left sidebar, select Search or go to and find your project. Select Settings > CI/CD. Expand Runners. To the right of the runner you want to edit, select Edit ({pencil}). In the Maximum job timeout field, enter a value in seconds. The minimum amount is 600 seconds (10 minutes). If not defined, the job timeout for the project is used instead. Select Save changes. How maximum job timeout works Example 1 - Runner timeout bigger than project timeout You set the maximum job timeout for a runner to 24 hours. You set the CI/CD Timeout for a project to 2 hours. You start a job. The job, if running longer, times out after 2 hours. Example 2 - Runner timeout not configured You remove the maximum job timeout configuration from a runner. You set the CI/CD Timeout for a project to 2 hours. You start a job. The job, if running longer, times out after 2 hours. Example 3 - Runner timeout smaller than project timeout You set the maximum job timeout for a runner to 30 minutes. You set the CI/CD Timeout for a project to 2 hours. You start a job. The job, if running longer, times out after 30 minutes. Set script and after_script timeouts Introduced in GitLab Runner 16.4. To control the amount of time script and after_script runs before it terminates, you can set specify a timeout. For example, you can specify a timeout to terminate a long-running script early, so that artifacts and caches can still be uploaded before the job timeout is exceeded. To set a timeout for script, use the job variable RUNNER_SCRIPT_TIMEOUT. To set a timeout for after_script, and override the default of 5 minutes, use the job variable RUNNER_AFTER_SCRIPT_TIMEOUT. Both of these variables accept Go's duration format (for example, 40s, 1h20m, 2h 4h30m30s). For example: job-with-script-timeouts: variables: RUNNER_SCRIPT_TIMEOUT: 15m RUNNER_AFTER_SCRIPT_TIMEOUT: 10m script: - "I am allowed to run for min(15m, remaining job timeout)." after_script: - "I am allowed to run for min(10m, remaining job timeout)." job-artifact-upload-on-timeout: timeout: 1h # set job timeout to 1 hour variables: RUNNER_SCRIPT_TIMEOUT: 50m # only allow script to run for 50 minutes script: - long-running-process > output.txt # will be terminated after 50m artifacts: # artifacts will have roughly ~10m to upload paths: - output.txt when: on_failure # on_failure because script termination after a timeout is treated as a failure Protecting sensitive information To avoid exposing sensitive information, you can restrict the usage of instance runners on large GitLab instances. This ensures that you control access to your GitLab instances and secure runner executors. If certain executors run a job, the file system, the code the runner executes, and the runner authentication token may be exposed. This means that anyone who runs jobs on an instance runner can access another user's code that runs on the runner. Users with access to the runner authentication token can use it to create a clone of a runner and submit false jobs in a vector attack. For more information, see Security Considerations. Configuring long polling To reduce job queueing times and load on your GitLab server, configure long polling. Using instance runners in forked projects When a project is forked, the job settings related to jobs are copied. If you have instance runners configured for a project and a user forks that project, the instance runners serve jobs of this project. Due to a known issue, if the runner settings of the forked project does not match the new project namespace, the following message displays: An error occurred while forking the project. Please try again.. To work around this issue, ensure that the instance runner settings are consistent in the forked project and the new namespace. If instance runners are enabled on the forked project, then this should also be enabled on the new namespace. If instance runners are disabled on the forked project, then this should also be disabled on the new namespace. Reset the runner registration token for a project (deprecated) WARNING: The ability to pass a runner registration token, and support for certain configuration arguments was deprecated in GitLab 15.6 and will be removed in GitLab 18.0. Authentication tokens should be used instead. For more information, see Migrating to the new runner registration workflow. If you think that a registration token for a project was revealed, you should reset it. A registration token can be used to register another runner for the project. That new runner may then be used to obtain the values of secret variables or to clone project code. To reset the registration token: On the left sidebar, select Search or go to and find your project. Select Settings > CI/CD. Expand Runners. To the right of New project runner, select the vertical ellipsis ({ellipsis_v}). Select Reset registration token. Select Reset token. After you reset the registration token, it is no longer valid and does not register any new runners to the project. You should also update the registration token in tools you use to provision and register new values. Authentication token security Introduced in GitLab 15.3 with a flag named enforce_runner_token_expires_at. Disabled by default. Generally available in GitLab 15.5. Feature flag enforce_runner_token_expires_at removed. Each runner has an runner authentication token to connect with the GitLab instance. To help prevent the token from being compromised, you can have the token rotate automatically at specified intervals. When the tokens are rotated, they are updated for each runner, regardless of the runner's status (online or offline). No manual intervention should be required, and no running jobs should be affected. If you need to manually update the runner authentication token, you can run a command to reset the token. Reset the runner authentication token If a runner authentication token is revealed, an attacker could use the token to clone a runner. To reset the runner authentication token: Delete the runner: Delete an instance runner. Delete a group runner. Delete a project runner. Create a new runner so that it is assigned a new runner authentication token: Create an instance runner. Create a group runner. Create a project runner. Optional. To verify that the previous runner authentication token has been revoked, use the Runners API. Automatically rotate runner authentication tokens You can specify an interval for runner authentication tokens to rotate. This rotation helps ensure the security of the tokens assigned to your runners. Prerequisites: Runners must use GitLab Runner 15.3 or later. You must be an administrator. To automatically rotate runner authentication tokens: On the left sidebar, at the bottom, select Admin Area. Select Settings > CI/CD. Expand Continuous Integration and Deployment. Set a Runners expiration time for runners, leave empty for no expiration. Select Save changes. Before the interval expires, runners automatically request a new runner authentication token. Prevent runners from revealing sensitive information To ensure runners don't reveal sensitive information, you can configure them to only run jobs on protected branches, or jobs that have protected tags. Runners configured to run jobs on protected branches cannot run jobs in merge request pipelines. For an instance runner Prerequisites: You must be an administrator. On the left sidebar, at the bottom, select Admin Area. Select CI/CD > Runners. To the right of the runner you want to protect, select Edit ({pencil}). Select the Protected checkbox. Select Save changes. For a group runner Prerequisites: You must have the Owner role for the group. On the left sidebar, select Search or go to and find your group. Select Build > Runners. To the right of the runner you want to protect, select Edit ({pencil}). Select the Protected checkbox. Select Save changes. For a project runner Prerequisites: You must have the Owner role for the project. On the left sidebar, select Search or go to and find your project. Select Settings > CI/CD. Expand Runners. To the right of the runner you want to protect, select Edit ({pencil}). Select the Protected checkbox. Select Save changes. Control jobs that a runner can run You can use tags to control the jobs a runner can run. For example, you can specify the rails tag for runners that have the dependencies to run Rails test suites. GitLab CI/CD tags are different to Git tags. GitLab CI/CD tags are associated with runners. Git tags are associated with commits. For an instance runner Prerequisites: You must be an administrator. To set the maximum job timeout: On the left sidebar, at the bottom, select Admin Area. Select CI/CD > Runners. To the right of the runner you want to edit, select Edit ({pencil}). Set the runner to run tagged or untagged jobs: To run tagged jobs, in the Tags field, enter the job tags separated with a comma. For example, macos, rails. To run untagged jobs, select the Run untagged jobs checkbox. Select Save changes. For a group runner Prerequisites: You must have the Owner role for the group. To set the maximum job timeout: On the left sidebar, select Search or go to and find your group. Select Build > Runners. To the right of the runner you want to edit, select Edit ({pencil}). Set the runner to run tagged or untagged jobs: To run tagged jobs, in the Tags field, enter the job tags separated with a comma. For example, macos, ruby. To run untagged jobs, select the Run untagged jobs checkbox. Select Save changes. For a project runner Prerequisites: You must have the Owner role for the project. To set a runner to run tagged jobs: On the left sidebar, select Search or go to and find your project. Select Settings > CI/CD. Expand Runners. To the right of the runner you want to edit, select Edit ({pencil}). Set the runner to run tagged or untagged jobs: To run tagged jobs, in the Tags field, enter the job tags separated with a comma. For example, macos, ruby. To run untagged jobs, select the Run untagged jobs checkbox. Select Save changes. How the runner uses tags Runner runs only tagged jobs The following examples illustrate the potential impact of the runner being set to run only tagged jobs. Example 1: The runner is configured to run only tagged jobs and has the docker tag. A job that has a hello tag is executed and stuck. Example 2: The runner is configured to run only tagged jobs and has the docker tag. A job that has a docker tag is executed and run. Example 3: The runner is configured to run only tagged jobs and has the docker tag. A job that has no tags defined is executed and stuck. Runner is allowed to run untagged jobs The following examples illustrate the potential impact of the runner being set to run tagged and untagged jobs. Example 1: The runner is configured to run untagged jobs and has the docker tag. A job that has no tags defined is executed and run. A second job that has a docker tag defined is executed and run. Example 2: The runner is configured to run untagged jobs and has no tags defined. A job that has no tags defined is executed and run. A second job that has a docker tag defined is stuck. A runner and a job have multiple tags The selection logic that matches the job and runner is based on the list of tags defined in the job. The following examples illustrate the impact of a runner and a job having multiple tags. For a runner to be selected to run a job, it must have all of the tags defined in the job script block. Example 1: The runner is configured with the tags [docker, shell, gpu]. The job has the tags [docker, shell, gpu] and is executed and run. Example 2: The runner is configured with the tags [docker, shell, gpu]. The job has the tags [docker, shell,] and is executed and run. Example 3: The runner is configured with the tags [docker, shell]. The job has the tags [docker, shell, gpu] and is not executed. Use tags to run jobs on different platforms You can use tags to run different jobs on different platforms. For example, if you have an OS X runner with tag osx and a Windows runner with tag windows, you can run a job on each platform. Update the tags field in the .gitlab-ci.yml: windows job: stage: build tags: - windows script: - echo Hello, %USERNAME%! osx job: stage: build tags: - osx script: - echo "Hello, $USER!" Use CI/CD variables in tags Introduced in GitLab 14.1. In the .gitlab-ci.yml file, use CI/CD variables with tags for dynamic runner selection: variables: KUBERNETES_RUNNER: kubernetes job: tags: - docker - $KUBERNETES_RUNNER script: - echo "Hello runner selector feature" Configure runner behavior with variables You can use CI/CD variables to configure runner Git behavior globally or for individual jobs: GIT_STRATEGY GIT_SUBMODULE_STRATEGY GIT_CHECKOUT GIT_CLEAN_FLAGS GIT_FETCH_EXTRA_FLAGS GIT_SUBMODULE_UPDATE_FLAGS GIT_SUBMODULE_FORCE_HTTPS GIT_DEPTH (shallow cloning) GIT_SUBMODULE_DEPTH GIT_CLONE_PATH (custom build directories) TRANSFER_METER_FREQUENCY (artifact/cache meter update frequency) ARTIFACT_COMPRESSION_LEVEL (artifact archiver compression level) CACHE_COMPRESSION_LEVEL (cache archiver compression level) CACHE_REQUEST_TIMEOUT (cache request timeout) You can also use variables to configure how many times a runner attempts certain stages of job execution. When using the Kubernetes executor, you can use variables to override Kubernetes CPU and memory allocations for requests and limits. Git strategy You c'''
