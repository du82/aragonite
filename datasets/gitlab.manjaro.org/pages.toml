["https://gitlab.manjaro.org/help/ci/environments/index.md"]
title = "Index · Environments · Ci · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''Environments and deployments DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed, GitLab Dedicated Environments describe where code is deployed. Each time GitLab CI/CD deploys a version of code to an environment, a deployment is created. GitLab: Provides a full history of deployments to each environment. Tracks your deployments, so you always know what is deployed on your servers. If you have a deployment service like Kubernetes associated with your project, you can use it to assist with your deployments. View environments and deployments Prerequisites: In a private project, you must have at least the Reporter role. See Environment permissions. There are a few ways to view a list of environments for a given project: On the project's overview page, if at least one environment is available (that is, not stopped). On the left sidebar, select Operate > Environments. The environments are displayed. To view a list of deployments for an environment, select the environment name, for example, staging. Deployments show up in this list only after a deployment job has created them. Search environments Introduced in GitLab 15.5. Searching environments within a folder was introduced in GitLab 15.7 with Feature flag enable_environments_search_within_folder. Enabled by default. To search environments by name: On the left sidebar, select Search or go to and find your project. Select Operate > Environments. In the search bar, enter your search term. The length of your search term should be 3 or more characters. Matching applies from the beginning of the environment name. For example, devel matches the environment name development, but elop does not. For environments with a folder name format, matching applies after the base folder name. For example when the name is review/test-app, search term test matches review/test-app. Also searching with the folder name prefixed like review/test matches review/test-app. CI/CD variables To customize your environments and deployments, you can use any of the predefined CI/CD variables, and define custom CI/CD variables. Environment states An environment state indicates whether an environment's stop job has run. There are three states: available: The environment exists. There might be a deployment. stopping: The on stop job has started. This state does not apply when there is no on stop job defined. stopped: Either the on stop job has run, or a user manually stopped the job. Types of environments An environment is either static or dynamic: Static environment Usually reused by successive deployments. Has a static name - for example, staging or production. Created manually or as part of a CI/CD pipeline. Dynamic environment Usually created in a CI/CD pipeline and used by only a single deployment, then either stopped or deleted. Has a dynamic name, usually based on the value of a CI/CD variable. A feature of review apps. Create a static environment You can create a static environment in the UI or in your .gitlab-ci.yml file. In the UI Prerequisites: You must have at least the Developer role. To create a static environment in the UI: On the left sidebar, select Search or go to and find your project. Select Operate > Environments. Select Create an environment. Complete the fields. Select Save. In your .gitlab-ci.yml file Prerequisites: You must have at least the Developer role. To create a static environment, in your .gitlab-ci.yml file: Define a job in the deploy stage. In the job, define the environment name and url. If an environment of that name doesn't exist when the pipeline runs, it is created. NOTE: Some characters cannot be used in environment names. For more information about the environment keywords, see the .gitlab-ci.yml keyword reference. For example, to create an environment named staging, with URL https://staging.example.com: deploy_staging: stage: deploy script: - echo "Deploy to staging server" environment: name: staging url: https://staging.example.com Create a dynamic environment To create a dynamic environment, you use CI/CD variables that are unique to each pipeline. Prerequisites: You must have at least the Developer role. To create a dynamic environment, in your .gitlab-ci.yml file: Define a job in the deploy stage. In the job, define the following environment attributes: name: Use a related CI/CD variable like $CI_COMMIT_REF_SLUG. Optionally, add a static prefix to the environment's name, which groups in the UI all environments with the same prefix. url: Optional. Prefix the hostname with a related CI/CD variable like $CI_ENVIRONMENT_SLUG. NOTE: Some characters cannot be used in environment names. For more information about the environment keywords, see the .gitlab-ci.yml keyword reference. In the following example, every time the deploy_review_app job runs the environment's name and URL are defined using unique values. deploy_review_app: stage: deploy script: make deploy environment: name: review/$CI_COMMIT_REF_SLUG url: https://$CI_ENVIRONMENT_SLUG.example.com rules: - if: $CI_COMMIT_BRANCH == "main" when: never - if: $CI_COMMIT_BRANCH Set a dynamic environment URL Some external hosting platforms generate a random URL for each deployment, for example: https://94dd65b.amazonaws.com/qa-lambda-1234567. That makes it difficult to reference the URL in the .gitlab-ci.yml file. To address this problem, you can configure a deployment job to report back a set of variables. These variables include the URL that was dynamically generated by the external service. GitLab supports the dotenv (.env) file format, and expands the environment:url value with variables defined in the .env file. To use this feature, specify the artifacts:reports:dotenv keyword in .gitlab-ci.yml. You can also specify a static part of the URL at environment:url, such as https://$DYNAMIC_ENVIRONMENT_URL. If the value of DYNAMIC_ENVIRONMENT_URL is example.com, the final result is https://example.com. The assigned URL for the review/your-branch-name environment is visible in the UI. For an overview, see Set dynamic URLs after a job finished. In the following example a review app creates a new environment for each merge request: The review job is triggered by every push, and creates or updates an environment named review/your-branch-name. The environment URL is set to $DYNAMIC_ENVIRONMENT_URL. When the review job finishes, GitLab updates the review/your-branch-name environment's URL. It parses the deploy.env report artifact, registers a list of variables as runtime-created, expands the environment:url: $DYNAMIC_ENVIRONMENT_URL and sets it to the environment URL. review: script: - DYNAMIC_ENVIRONMENT_URL=$(deploy-script) # In script, get the environment URL. - echo "DYNAMIC_ENVIRONMENT_URL=$DYNAMIC_ENVIRONMENT_URL" >> deploy.env # Add the value to a dotenv file. artifacts: reports: dotenv: deploy.env # Report back dotenv file to rails. environment: name: review/$CI_COMMIT_REF_SLUG url: $DYNAMIC_ENVIRONMENT_URL # and set the variable produced in script to `environment:url` on_stop: stop_review stop_review: script: - ./teardown-environment when: manual environment: name: review/$CI_COMMIT_REF_SLUG action: stop Note the following: stop_review doesn't generate a dotenv report artifact, so it doesn't recognize the DYNAMIC_ENVIRONMENT_URL environment variable. Therefore you shouldn't set environment:url in the stop_review job. If the environment URL isn't valid (for example, the URL is malformed), the system doesn't update the environment URL. If the script that runs in stop_review exists only in your repository and therefore can't use GIT_STRATEGY: none, configure merge request pipelines for these jobs. This ensures that runners can fetch the repository even after a feature branch is deleted. For more information, see Ref Specs for Runners. NOTE: For Windows runners, you should use the PowerShell Add-Content command to write to .env files. Add-Content -Path deploy.env -Value "DYNAMIC_ENVIRONMENT_URL=$DYNAMIC_ENVIRONMENT_URL" Rename an environment Renaming an environment by using the UI was removed in GitLab 14.3. Renaming an environment by using the API was deprecated in GitLab 15.9. Renaming an environment with the API removed in GitLab 16.0. You cannot rename an environment. To achieve the same result as renaming an environment: Stop the existing environment. Delete the existing environment. Create a new environment with the desired name. Deployment tier of environments Introduced in GitLab 13.10. Sometimes, instead of using an industry standard environment name, like production, you might want to use a code name, like customer-portal. While there is no technical reason not to use a name like customer-portal, the name no longer indicates that the environment is used for production. To indicate that a specific environment is for a specific use, you can use tiers: Environment tier Environment name examples production Production, Live staging Staging, Model, Demo testing Test, QC development Dev, Review apps, Trunk other By default, GitLab assumes a tier based on the environment name. Instead, you can use the deployment_tier keyword to specify a tier. Configure manual deployments You can create a job that requires someone to manually start the deployment. For example: deploy_prod: stage: deploy script: - echo "Deploy to production server" environment: name: production url: https://example.com rules: - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH when: manual The when: manual action: Exposes a play button for the job in the GitLab UI, with the text Can be manually deployed to <environment>. Means the deploy_prod job is only triggered when the play button is selected. You can find the play button in the pipelines, environments, deployments, and jobs views. Track newly included merge requests per deployment Feature flag link_fast_forward_merge_requests_to_deployment introduced in GitLab 16.10. Disabled by default. GitLab can track newly included merge requests per deployment. When a deployment succeeds, the system calculates commit-diffs between the latest deployment and the previous deployment. You can fetch tracking information with the Deployment API or view it at a post-merge pipeline in merge request pages. To enable tracking: Set your project's merge method. The merge method: Must not be Fast-forward merge. Can be Fast-forward merge if the link_fast_forward_merge_requests_to_deployment feature flag is enabled. Configure your environment so either: The environment name doesn't use folders with / (long-lived or top-level environments). The environment tier is either production or staging. Here are some example configurations using the environment keyword in .gitlab-ci.yml: # Trackable environment: production environment: production/aws environment: development # Non Trackable environment: review/$CI_COMMIT_REF_SLUG environment: testing/aws Configuration changes apply only to new deployments. Existing deployment records do not have merge requests linked or unlinked from them. Working with environments Once environments are configured, GitLab provides many features for working with them, as documented below. Environment rollback When you roll back a deployment on a specific commit, a new deployment is created. This deployment has its own unique job ID. It points to the commit you're rolling back to. For the rollback to succeed, the deployment process must be defined in the job's script. Only the deployment jobs are run. In cases where a previous job generates artifacts that must be regenerated on deploy, you must manually run the necessary jobs from the pipelines page. For example, if you use Terraform and your plan and apply commands are separated into multiple jobs, you must manually run the jobs to deploy or roll back. Retry or roll back a deployment If there is a problem with a deployment, you can retry it or roll it back. To retry or roll back a deployment: On the left sidebar, select Search or go to and find your project. Select Operate > Environments. Select the environment. To the right of the deployment name: To retry a deployment, select Re-deploy to environment. To roll back to a deployment, next to a previously successful deployment, select Rollback environment. NOTE: If you have prevented outdated deployment jobs in your project, the rollback buttons might be hidden or disabled. In this case, see job retries for rollback deployments. Environment URL Changed to persist arbitrary URLs in GitLab 15.2 with a flag named soft_validation_on_external_url. Disabled by default. Generally available in GitLab 15.3. Feature flag soft_validation_on_external_url removed. The environment URL is displayed in a few places in GitLab: In a merge request as a link: In the Environments view as a button: In the Deployments view as a button: You can see this information in a merge request if: The merge request is eventually merged to the default branch (usually main). That branch also deploys to an environment (for example, staging or production). For example: Go from source files to public pages With GitLab Route Maps, you can go directly from source files to public pages in the environment set for Review Apps. Stopping an environment Stopping an environment means its deployments are not accessible on the target server. You must stop an environment before it can be deleted. Stop an environment when a branch is deleted You can configure environments to stop when a branch is deleted. In the following example, a deploy_review job calls a stop_review job to clean up and stop the environment. Both jobs must have the same rules or only/except configuration. Otherwise, the stop_review job might not be included in all pipelines that include the deploy_review job, and you cannot trigger action: stop to stop the environment automatically. The job with action: stop might not run if it's in a later stage than the job that started the environment. If you can't use merge request pipelines, set the GIT_STRATEGY to none in the stop_review job. Then the runner doesn't try to check out the code after the branch is deleted. deploy_review: stage: deploy script: - echo "Deploy a review app" environment: name: review/$CI_COMMIT_REF_SLUG url: https://$CI_ENVIRONMENT_SLUG.example.com on_stop: stop_review stop_review: stage: deploy script: - echo "Remove review app" environment: name: review/$CI_COMMIT_REF_SLUG action: stop when: manual Stop an environment when a merge request is merged or closed When you use the merge request pipelines configuration, the stop trigger is automatically enabled. In the following example, the deploy_review job calls a stop_review job to clean up and stop the environment. deploy_review: stage: deploy script: - echo "Deploy a review app" environment: name: review/$CI_COMMIT_REF_SLUG on_stop: stop_review rules: - if: $CI_MERGE_REQUEST_ID stop_review: stage: deploy script: - echo "Remove review app" environment: name: review/$CI_COMMIT_REF_SLUG action: stop rules: - if: $CI_MERGE_REQUEST_ID when: manual Run a pi'''
