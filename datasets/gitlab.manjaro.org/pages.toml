["https://gitlab.manjaro.org/help/api/rest/index.md"]
title = "Index · Rest · Api · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''REST API DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed, GitLab Dedicated The REST APIs have been around for a longer time compared to GraphQL APIs, which may make them more familiar to some developers. It is often a good choice for developers who are more comfortable with traditional API architecture. Compatibility guidelines The HTTP API is versioned with a single number, which is 4. This number symbolizes the major version number, as described by SemVer. Because of this, backward-incompatible changes require this version number to change. The minor version isn't explicit, which allows for a stable API endpoint. New features can be added to the API in the same version number. New features and bug fixes are released in tandem with GitLab. Apart from incidental patch and security releases, new minor versions of GitLab are released every month. Major API version changes, and removal of entire API versions, are done in tandem with major GitLab releases. All deprecations and changes between versions are in the documentation. Current status Only API version v4 is available. How to use the API API requests must include both api and the API version. The API version is defined in lib/api.rb. For example, the root of the v4 API is at /api/v4. Valid API request The following is a basic example of a request to the fictional gitlab.example.com endpoint: curl "https://gitlab.example.com/api/v4/projects" The API uses JSON to serialize data. You don't need to specify .json at the end of the API URL. NOTE: In the example above, replace gitlab.example.com with gitlab.com to query GitLab.com (GitLab SaaS). Access can be denied due to authentication. For more information, see Authentication. API request to expose HTTP response headers If you want to expose HTTP response headers, use the --include option: curl --include "https://gitlab.example.com/api/v4/projects" HTTP/2 200 ... This request can help you investigate an unexpected response. API request that includes the exit code If you want to expose the HTTP exit code, include the --fail option: curl --fail "https://gitlab.example.com/api/v4/does-not-exist" curl: (22) The requested URL returned error: 404 The HTTP exit code can help you diagnose the success or failure of your REST request. Authentication Most API requests require authentication, or only return public data when authentication isn't provided. When authentication is not required, the documentation for each endpoint specifies this. For example, the /projects/:id endpoint does not require authentication. You can authenticate with the GitLab API in several ways: OAuth 2.0 tokens Personal access tokens Project access tokens Group access tokens Session cookie GitLab CI/CD job token (Specific endpoints only) Project access tokens are supported by: Self-managed GitLab: Free, Premium, and Ultimate. GitLab SaaS: Premium and Ultimate. If you are an administrator, you or your application can authenticate as a specific user. To do so, use: Impersonation tokens Sudo If authentication information is not valid or is missing, GitLab returns an error message with a status code of 401: { "message": "401 Unauthorized" } NOTE: Deploy tokens can't be used with the GitLab public API. For details, see Deploy Tokens. OAuth 2.0 tokens You can use an OAuth 2.0 token to authenticate with the API by passing it in either the access_token parameter or the Authorization header. Example of using the OAuth 2.0 token in a parameter: curl "https://gitlab.example.com/api/v4/projects?access_token=OAUTH-TOKEN" Example of using the OAuth 2.0 token in a header: curl --header "Authorization: Bearer OAUTH-TOKEN" "https://gitlab.example.com/api/v4/projects" Read more about GitLab as an OAuth 2.0 provider. NOTE: All OAuth access tokens are valid for two hours after they are created. You can use the refresh_token parameter to refresh tokens. See OAuth 2.0 token documentation for how to request a new access token using a refresh token. Personal/project/group access tokens You can use access tokens to authenticate with the API by passing it in either the private_token parameter or the PRIVATE-TOKEN header. Example of using the personal, project, or group access token in a parameter: curl "https://gitlab.example.com/api/v4/projects?private_token=<your_access_token>" Example of using the personal, project, or group access token in a header: curl --header "PRIVATE-TOKEN: <your_access_token>" "https://gitlab.example.com/api/v4/projects" You can also use personal, project, or group access tokens with OAuth-compliant headers: curl --header "Authorization: Bearer <your_access_token>" "https://gitlab.example.com/api/v4/projects" Job tokens You can use job tokens to authenticate with specific API endpoints by passing the token in the job_token parameter or the JOB-TOKEN header. To pass the token in GitLab CI/CD jobs, use the CI_JOB_TOKEN variable. Example of using the job token in a parameter: curl --location --output artifacts.zip "https://gitlab.example.com/api/v4/projects/1/jobs/42/artifacts?job_token=$CI_JOB_TOKEN" Example of using the job token in a header: curl --header "JOB-TOKEN:$CI_JOB_TOKEN" "https://gitlab.example.com/api/v4/projects/1/releases" Session cookie Signing in to the main GitLab application sets a _gitlab_session cookie. The API uses this cookie for authentication if it's present. Using the API to generate a new session cookie isn't supported. The primary user of this authentication method is the web frontend of GitLab itself. The web frontend can use the API as the authenticated user to get a list of projects without explicitly passing an access token. Impersonation tokens Impersonation tokens are a type of personal access token. They can be created only by an administrator, and are used to authenticate with the API as a specific user. Use impersonation tokens as an alternative to: The user's password or one of their personal access tokens. The Sudo feature. The user's or administrator's password or token may not be known, or may change over time. For more information, see the users API documentation. Impersonation tokens are used exactly like regular personal access tokens, and can be passed in either the private_token parameter or the PRIVATE-TOKEN header. Disable impersonation By default, impersonation is enabled. To disable impersonation: ::Tabs :::TabTitle Linux package (Omnibus) Edit the /etc/gitlab/gitlab.rb file: gitlab_rails['impersonation_enabled'] = false Save the file, and then reconfigure GitLab for the changes to take effect. :::TabTitle Self-compiled (source) Edit the config/gitlab.yml file: gitlab: impersonation_enabled: false Save the file, and then restart GitLab for the changes to take effect. ::EndTabs To re-enable impersonation, remove this configuration and reconfigure GitLab (Linux package installations) or restart GitLab (self-compiled installations). Sudo All API requests support performing an API request as if you were another user, provided you're authenticated as an administrator with an OAuth or personal access token that has the sudo scope. The API requests are executed with the permissions of the impersonated user. As an administrator, pass the sudo parameter either by using query string or a header with an ID or username (case insensitive) of the user you want to perform the operation as. If passed as a header, the header name must be Sudo. If a non administrative access token is provided, GitLab returns an error message with a status code of 403: { "message": "403 Forbidden - Must be admin to use sudo" } If an access token without the sudo scope is provided, an error message is returned with a status code of 403: { "error": "insufficient_scope", "error_description": "The request requires higher privileges than provided by the access token.", "scope": "sudo" } If the sudo user ID or username cannot be found, an error message is returned with a status code of 404: { "message": "404 User with ID or username '123' Not Found" } Example of a valid API request and a request using cURL with sudo request, providing a username: GET /projects?private_token=<your_access_token>&sudo=username curl --header "PRIVATE-TOKEN: <your_access_token>" --header "Sudo: username" "https://gitlab.example.com/api/v4/projects" Example of a valid API request and a request using cURL with sudo request, providing an ID: GET /projects?private_token=<your_access_token>&sudo=23 curl --header "PRIVATE-TOKEN: <your_access_token>" --header "Sudo: 23" "https://gitlab.example.com/api/v4/projects" Status codes The API is designed to return different status codes according to context and action. This way, if a request results in an error, you can get insight into what went wrong. The following table gives an overview of how the API functions generally behave. Request type Description GET Access one or more resources and return the result as JSON. POST Return 201 Created if the resource is successfully created and return the newly created resource as JSON. GET / PUT Return 200 OK if the resource is accessed or modified successfully. The (modified) result is returned as JSON. DELETE Returns 204 No Content if the resource was deleted successfully or 202 Accepted if the resource is scheduled to be deleted. The following table shows the possible return codes for API requests. Return values Description 200 OK The GET, PUT or DELETE request was successful, and the resource itself is returned as JSON. 201 Created The POST request was successful, and the resource is returned as JSON. 202 Accepted The GET, PUT or DELETE request was successful, and the resource is scheduled for processing. 204 No Content The server has successfully fulfilled the request, and there is no additional content to send in the response payload body. 301 Moved Permanently The resource has been definitively moved to the URL given by the Location headers. 304 Not Modified The resource hasn't been modified since the last request. 400 Bad Request A required attribute of the API request is missing. For example, the title of an issue is not given. 401 Unauthorized The user isn't authenticated. A valid user token is necessary. 403 Forbidden The request isn't allowed. For example, the user isn't allowed to delete a project. 404 Not Found A resource couldn't be accessed. For example, an ID for a resource couldn't be found, or the user isn't authorized to access the resource. 405 Method Not Allowed The request isn't supported. 409 Conflict A conflicting resource already exists. For example, creating a project with a name that already exists. 412 Precondition Failed The request was denied. This can happen if the If-Unmodified-Since header is provided when trying to delete a resource, which was modified in between. 422 Unprocessable The entity couldn't be processed. 429 Too Many Requests The user exceeded the application rate limits. 500 Server Error While handling the request, something went wrong on the server. 503 Service Unavailable The server cannot handle the request because the server is temporarily overloaded. Redirects Introduced in GitLab 16.4 with a flag named api_redirect_moved_projects. Disabled by default. Generally available in GitLab 16.7. Feature flag api_redirect_moved_projects removed. After path changes the REST API can respond with a redirect and users should be able to handle such responses. The users should follow the redirect and repeat the request to the URI specified in the Location header. Example of a project moved to a different path: curl --verbose "https://gitlab.example.com/api/v4/projects/gitlab-org%2Fold-path-project" The response is: ... < Location: http://gitlab.example.com/api/v4/projects/81 ... This resource has been moved permanently to https://gitlab.example.com/api/v4/projects/81 Pagination GitLab supports the following pagination methods: Offset-based pagination. The default method and available on all endpoints except, in GitLab 16.5 and later, the users endpoint. Keyset-based pagination. Added to selected endpoints but being progressively rolled out. For large collections, you should use keyset pagination (when available) instead of offset pagination, for performance reasons. Offset-based pagination The users endpoint was deprecated for offset-based pagination in GitLab 16.5 and is planned for removal in 17.0. This change is a breaking change. Use keyset-based pagination for this endpoint instead. Sometimes, the returned result spans many pages. When listing resources, you can pass the following parameters: Parameter Description page Page number (default: 1). per_page Number of items to list per page (default: 20, max: 100). In the following example, we list 50 namespaces per page: curl --request GET --header "PRIVATE-TOKEN: <your_access_token>" "https://gitlab.example.com/api/v4/namespaces?per_page=50" NOTE: There is a max offset allowed limit for offset pagination. You can change the limit in self-managed instances. Pagination Link header Link headers are returned with each response. They have rel set to prev, next, first, or last and contain the relevant URL. Be sure to use these links instead of generating your own URLs. For GitLab.com users, some pagination headers may not be returned. In the following cURL example, we limit the output to three items per page (per_page=3) and we request the second page (page=2) of comments of the issue with ID 8 which belongs to the project with ID 9: curl --head --header "PRIVATE-TOKEN: <your_access_token>" "https://gitlab.example.com/api/v4/projects/9/issues/8/notes?per_page=3&page=2" The response is: HTTP/2 200 OK cache-control: no-cache content-length: 1103 content-type: application/json date: Mon, 18 Jan 2016 09:43:18 GMT link: <https://gitlab.example.com/api/v4/projects/8/issues/8/notes?page=1&per_page=3>; rel="prev", <https://gitlab.example.com/api/v4/projects/8/issues/8/notes?page=3&per_page=3>; rel="next", <https://gitlab.example.com/api/v4/projects/8/issues/8/notes?page=1&per_page=3>; rel="first", <https://gitlab.example.com/api/v4/projects/8/issues/8/notes?page=3&per_page=3>; rel="last" status: 200 OK vary: Origin x-next-page: 3 x-page: 2 x-per-page: 3 x-prev-page: 1 x-request-id: 732ad4ee-9870-4866-a199-a9db0cde3c86 x-runtime: 0.108688 x-total: 8 x-total-pages: 3 Other pagination headers GitLab also returns the following additional pagination headers: Header Description x-next-page The index of the next page. x-page The index of the current page (starting at 1). x-per-page The number of items per page. x-prev-page The index of the previous page. x-total The total number of items. x-total-pages The total number of pages. For GitLab.com users, some pagination headers may not be returned. Keyset-based pagination Keyset-pagination allows for more efficient retrieval of pages and - in contrast to offset-based pagination - runtime is independent of the size of the collection. This method is controlled by the following parameters. order_by and sort are both mandatory. Parameter Required Des'''
