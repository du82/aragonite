title = "Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = "GitLab Enterprise Edition GitLab is open source software to collaborate on code. Manage git repositories with fine-grained access controls that keep your code secure. Perform code reviews and enhance collaboration with merge requests. Each project can also have an issue tracker and a wiki. Used by more than 100,000 organizations, GitLab is the most popular solution to manage git repositories on-premises. Read more about GitLab at about.gitlab.com. Check the current instance configuration Visit docs.gitlab.com for the latest version of this help information with enhanced navigation, formatting, and search. GitLab Docs Explore the different areas of the documentation: Use GitLabGet started with GitLab features and functionality. Administer GitLabAdminister a self-managed GitLab instance. New to Git and GitLab?Start learning about Git and GitLab. Contribute to GitLab developmentCreate new GitLab functionality and documentation. Coming to GitLab from another platform?Learn how to move to GitLab. Build an integration with GitLabIntegrate with Jira and other common applications. Choose a subscriptionDetermine which subscription tier makes sense for you. Install GitLabInstall GitLab on different platforms. Reference architecturesView recommended deployments at scale. Upgrade GitLabUpgrade your GitLab self-managed instance to the latest version. Popular topics View some of the most popular topics: Popular topic Description CI/CD YAML syntax reference Available configuration options for .gitlab-ci.yml files. REST API Use the REST API to extend GitLab. Environments and deployments Deploy your application to different environments. Configuring runners Get started using runners. Two-factor authentication Improve the security of your GitLab account. Back up and restore GitLab Back up and restore a GitLab self-managed instance. GitLab release and maintenance policy Determine how and when to upgrade. SSH keys Use SSH keys to communicate with GitLab. User accounts Learn about GitLab account management: Topic Description User account Manage your account. Authentication Account security with two-factor authentication, set up your SSH keys, and deploy keys for secure access to your projects. User settings Manage your user settings, two factor authentication, and more. User permissions Learn what each role in a project can do. Coming to GitLab from another platform If you are coming to GitLab from another platform: Topic Description Import to GitLab Import your projects from GitHub, Bitbucket, GitLab.com, FogBugz, and SVN into GitLab. Migrate from SVN Convert a SVN repository to Git and GitLab. Build an integration with GitLab To build integrations with GitLab: Topic Description GitLab REST API Integrate with GitLab using our REST API. GitLab GraphQL API Integrate with GitLab using our GraphQL API. Integrations Integrations with third-party products. Contribute to GitLab To contribute to GitLab: Topic Description Contribute to GitLab development. Contribute to GitLab development. Contribute to the documentation Contribute to GitLab documentation. Quick help See our website for help Use the search bar on the top of this page Use shortcuts Get a support subscription Compare GitLab editions"
