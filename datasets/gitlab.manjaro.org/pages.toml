["https://gitlab.manjaro.org/help/update/index.md"]
title = "Index · Update · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''Upgrade GitLab DETAILS: Tier: Free, Premium, Ultimate Offering: Self-managed Upgrading GitLab is a relatively straightforward process, but the complexity can increase based on the installation method you have used, how old your GitLab version is, if you're upgrading to a major version, and so on. Make sure to read the whole page as it contains information related to every upgrade method. The maintenance policy documentation has additional information about upgrading, including: How to interpret GitLab product versioning. Recommendations on what release to run. How we use patch and security patch releases. When we backport code changes. Upgrade based on installation method Depending on the installation method and your GitLab version, there are multiple official ways to upgrade GitLab: ::Tabs :::TabTitle Linux packages (Omnibus) The package upgrade guide contains the steps needed to upgrade a package installed by official GitLab repositories. There are also instructions when you want to upgrade to a specific version. :::TabTitle Helm chart (Kubernetes) GitLab can be deployed into a Kubernetes cluster using Helm. For production deployments, the setup follows the Cloud Native Hybrid guidance where stateless components of cloud-native GitLab run in Kubernetes with the GitLab Helm chart, and stateful components are deployed in compute VMs with the Linux package. Use the version mapping from the chart version to GitLab version to determine the upgrade path. Follow Multi-node upgrades with downtime to perform the upgrade in a Cloud Native Hybrid setup. A full cloud-native deployment is not supported for production. However, instructions on how to upgrade such an environment are in a separate document. :::TabTitle Docker GitLab provides official Docker images for both Community and Enterprise editions, and they are based on the Omnibus package. See how to install GitLab using Docker. :::TabTitle Self-compiled (source) Upgrading Community Edition and Enterprise Edition from source - The guidelines for upgrading Community Edition and Enterprise Edition from source. Patch versions guide includes the steps needed for a patch version, such as 15.2.0 to 15.2.1, and apply to both Community and Enterprise Editions. In the past we used separate documents for the upgrading instructions, but we have switched to using a single document. The old upgrading guidelines can still be found in the Git repository: Old upgrading guidelines for Community Edition Old upgrading guidelines for Enterprise Edition ::EndTabs Plan your upgrade See the guide to plan your GitLab upgrade. Check for background migrations before upgrading Certain releases may require different migrations to be finished before you upgrade to the newer version. For more information, see background migrations. Dealing with running CI/CD pipelines and jobs If you upgrade your GitLab instance while the GitLab Runner is processing jobs, the trace updates fail. When GitLab is back online, the trace updates should self-heal. However, depending on the error, the GitLab Runner either retries, or eventually terminates, job handling. As for the artifacts, the GitLab Runner attempts to upload them three times, after which the job eventually fails. To address the above two scenarios, it is advised to do the following prior to upgrading: Plan your maintenance. Pause your runners, or block new jobs from starting by adding the following to your /etc/gitlab/gitlab.rb: nginx['custom_gitlab_server_config'] = "location ^~ /api/v4/jobs/request {\n deny all;\n return 503;\n}\n" And reconfigure GitLab with: sudo gitlab-ctl reconfigure Wait until all jobs are finished. Upgrade GitLab. Upgrade GitLab Runner to the same version as your GitLab version. Both versions should be the same. Unpause your runners and unblock new jobs from starting by reverting the previous /etc/gitlab/gitlab.rb change. Checking for pending advanced search migrations DETAILS: Tier: Premium, Ultimate Offering: Self-managed This section is only applicable if you have enabled the Elasticsearch integration. Major releases require all advanced search migrations to be finished from the most recent minor release in your current version before the major version upgrade. You can find pending migrations by running the following command. ::Tabs :::TabTitle Linux package (Omnibus) sudo gitlab-rake gitlab:elastic:list_pending_migrations :::TabTitle Self-compiled (source) cd /home/git/gitlab sudo -u git -H bundle exec rake gitlab:elastic:list_pending_migrations ::EndTabs What do you do if your advanced search migrations are stuck? In GitLab 15.0, an advanced search migration named DeleteOrphanedCommit can be permanently stuck in a pending state across upgrades. This issue is corrected in GitLab 15.1. If you are a self-managed customer who uses GitLab 15.0 with advanced search, you will experience performance degradation. To clean up the migration, upgrade to 15.1 or later. For other advanced search migrations stuck in pending, see how to retry a halted migration. If you upgrade GitLab before all pending advanced search migrations are completed, any pending migrations that have been removed in the new version cannot be executed or retried. In this case, you must re-create your index from scratch. What do you do for the error Elasticsearch version not compatible Confirm that your version of Elasticsearch or OpenSearch is compatible with your version of GitLab. Upgrading without downtime Read how to upgrade without downtime. Upgrading to a new major version Upgrading the major version requires more attention. Backward-incompatible changes are reserved for major versions. Follow the directions carefully as we cannot guarantee that upgrading between major versions is seamless. A major upgrade requires the following steps: Identify a supported upgrade path. The last minor release of the previous major version is always a required stop due to the background migrations being introduced in the last minor version. Ensure that any background migrations have been fully completed before upgrading to a new major version. If you have enabled the Elasticsearch integration, then before proceeding with the major version upgrade, ensure that all advanced search migrations are completed. If your GitLab instance has any runners associated with it, it is very important to upgrade them to match the current GitLab version. This ensures compatibility with GitLab versions. Upgrade paths Upgrading across multiple GitLab versions in one go is only possible by accepting downtime. If you don't want any downtime, read how to upgrade with zero downtime. For a dynamic view of examples of supported upgrade paths, try the Upgrade Path tool maintained by the GitLab Support team. To share feedback and help improve the tool, create an issue or MR in the upgrade-path project. When upgrading: Find where your version sits in the upgrade path: GitLab 14: 14.0.12 > 14.3.6 > 14.9.5 > 14.10.5. GitLab 15: 15.0.5 > 15.1.6 (for GitLab instances with multiple web nodes) > 15.4.6 > 15.11.13. GitLab 16: 16.0.8 (only instances with lots of users or large pipeline variables history) > 16.1.6 (instances with NPM packages in their package registry) > 16.2.9 (only instances with large pipeline variables history) > 16.3.7 > 16.7.z latest 16.Y.Z. Check for required upgrade stops. Consult the version-specific upgrade instructions. Upgrade GitLab accordingly. NOTE: When not explicitly specified, upgrade GitLab to the latest available patch release of the major.minor release rather than the first patch release, for example 13.8.8 instead of 13.8.0. This includes major.minor versions you must stop at on the upgrade path as there may be fixes for issues relating to the upgrade process. Specifically around a major version, crucial database schema and migration patches may be included in the latest patch releases. Required upgrade stops Required upgrade stops are versions of GitLab that you must upgrade to before upgrading to later versions. Required upgrade stops allow required background migrations to finish. During GitLab 16.x, we are scheduling required upgrade stops beforehand so you can better plan out appropriate upgrade stops and downtime when necessary. When planning upgrades, take this into account. Earlier GitLab versions For information on upgrading to earlier GitLab versions, see the documentation archives. The versions of the documentation in the archives contain version-specific information for even earlier versions of GitLab. For example, the documentation for GitLab 15.11 contains information on versions back to GitLab 12. Upgrading between editions GitLab comes in two flavors: Community Edition which is MIT licensed, and Enterprise Edition which builds on top of the Community Edition and includes extra features mainly aimed at organizations with more than 100 users. Below you can find some guides to help you change GitLab editions. Community to Enterprise Edition NOTE: The following guides are for subscribers of the Enterprise Edition only. If you wish to upgrade your GitLab installation from Community to Enterprise Edition, follow the guides below based on the installation method: Source CE to EE upgrade guides - The steps are very similar to a version upgrade: stop the server, get the code, update configuration files for the new functionality, install libraries and do migrations, update the init script, start the application and check its status. Omnibus CE to EE - Follow this guide to upgrade your Omnibus GitLab Community Edition to the Enterprise Edition. Docker CE to EE - Follow this guide to upgrade your GitLab Community Edition container to an Enterprise Edition container. Helm chart (Kubernetes) CE to EE - Follow this guide to upgrade your GitLab Community Edition Helm deployment to Enterprise Edition. Enterprise to Community Edition To downgrade your Enterprise Edition installation back to Community Edition, you can follow this guide to make the process as smooth as possible. Version-specific upgrading instructions Each month, major or minor as well as possibly patch releases of GitLab are published along with a release post. You should read the release posts for all versions you're passing over. At the end of major and minor release posts, there are three sections to look for specifically: Deprecations Removals Important notes on upgrading These include: Steps you must perform as part of an upgrade. For example 8.12 required the Elasticsearch index to be recreated. Any older version of GitLab upgrading to 8.12 or later would require this. Changes to the versions of software we support such as ceasing support for IE11 in GitLab 13. Apart from the instructions in this section, you should also check the installation-specific upgrade instructions, based on how you installed GitLab: Linux packages (Omnibus GitLab) Helm charts NOTE: Specific information that follow related to Ruby and Git versions do not apply to Omnibus installations and Helm Chart deployments. They come with appropriate Ruby and Git versions and are not using system binaries for Ruby and Git. There is no need to install Ruby or Git when utilizing these two approaches. GitLab 17 Before upgrading to GitLab 17, see GitLab 17 changes. GitLab 16 Before upgrading to GitLab 16, see GitLab 16 changes. GitLab 15 Before upgrading to GitLab 15, see GitLab 15 changes. GitLab 14 Before upgrading to GitLab 14, see GitLab 14 changes. Miscellaneous Managing PostgreSQL extensions'''
year_published = 2025
clearnet = "https://gitlab.manjaro.org/help/update/index.md"
