["https://gitlab.manjaro.org/help/ci/yaml/index.md"]
title = "Index · Yaml · Ci · Help · GitLab"
description = "Manjaro Linux GitLab"
full_description = '''CI/CD YAML syntax reference DETAILS: Tier: Free, Premium, Ultimate Offering: GitLab.com, Self-managed, GitLab Dedicated This document lists the configuration options for the GitLab .gitlab-ci.yml file. This file is where you define the CI/CD jobs that make up your pipeline. If you are already familiar with basic CI/CD concepts, try creating your own .gitlab-ci.yml file by following a tutorial that demonstrates a simple or complex pipeline. For a collection of examples, see GitLab CI/CD examples. To view a large .gitlab-ci.yml file used in an enterprise, see the .gitlab-ci.yml file for gitlab. When you are editing your .gitlab-ci.yml file, you can validate it with the CI Lint tool. If you are editing content on this page, follow the instructions for documenting keywords. Keywords A GitLab CI/CD pipeline configuration includes: Global keywords that configure pipeline behavior: Keyword Description default Custom default values for job keywords. include Import configuration from other YAML files. stages The names and order of the pipeline stages. variables Define CI/CD variables for all job in the pipeline. workflow Control what types of pipeline run. Header keywords Keyword Description spec Define specifications for external configuration files. Jobs configured with job keywords: Keyword Description after_script Override a set of commands that are executed after job. allow_failure Allow job to fail. A failed job does not cause the pipeline to fail. artifacts List of files and directories to attach to a job on success. before_script Override a set of commands that are executed before job. cache List of files that should be cached between subsequent runs. coverage Code coverage settings for a given job. dast_configuration Use configuration from DAST profiles on a job level. dependencies Restrict which artifacts are passed to a specific job by providing a list of jobs to fetch artifacts from. environment Name of an environment to which the job deploys. extends Configuration entries that this job inherits from. identity Authenticate with third party services using identity federation. image Use Docker images. inherit Select which global defaults all jobs inherit. interruptible Defines if a job can be canceled when made redundant by a newer run. needs Execute jobs earlier than the stage ordering. pages Upload the result of a job to use with GitLab Pages. parallel How many instances of a job should be run in parallel. release Instructs the runner to generate a release object. resource_group Limit job concurrency. retry When and how many times a job can be auto-retried in case of a failure. rules List of conditions to evaluate and determine selected attributes of a job, and whether or not it's created. script Shell script that is executed by a runner. secrets The CI/CD secrets the job needs. services Use Docker services images. stage Defines a job stage. tags List of tags that are used to select a runner. timeout Define a custom job-level timeout that takes precedence over the project-wide setting. trigger Defines a downstream pipeline trigger. variables Define job variables on a job level. when When to run job. Global keywords Some keywords are not defined in a job. These keywords control pipeline behavior or import additional pipeline configuration. default Support for id_tokens introduced in GitLab 16.4. You can set global defaults for some keywords. Each default keyword is copied to every job that doesn't already have it defined. If the job already has a keyword defined, that default is not used. Keyword type: Global keyword. Possible inputs: These keywords can have custom defaults: after_script artifacts before_script cache hooks id_tokens image interruptible retry services tags timeout, though due to issue 213634 this keyword has no effect. Example of default: default: image: ruby:3.0 retry: 2 rspec: script: bundle exec rspec rspec 2.7: image: ruby:2.7 script: bundle exec rspec In this example: image: ruby:3.0 and retry: 2 are the default keywords for all jobs in the pipeline. The rspec job does not have image or retry defined, so it uses the defaults of image: ruby:3.0 and retry: 2. The rspec 2.7 job does not have retry defined, but it does have image explicitly defined. It uses the default retry: 2, but ignores the default image and uses the image: ruby:2.7 defined in the job. Additional details: Control inheritance of default keywords in jobs with inherit:default. include Moved to GitLab Free in 11.4. Use include to include external YAML files in your CI/CD configuration. You can split one long .gitlab-ci.yml file into multiple files to increase readability, or reduce duplication of the same configuration in multiple places. You can also store template files in a central repository and include them in projects. The include files are: Merged with those in the .gitlab-ci.yml file. Always evaluated first and then merged with the content of the .gitlab-ci.yml file, regardless of the position of the include keyword. The time limit to resolve all files is 30 seconds. Keyword type: Global keyword. Possible inputs: The include subkeys: include:component include:local include:project include:remote include:template And optionally: include:inputs include:rules Additional details: Only certain CI/CD variables can be used with include keywords. Use merging to customize and override included CI/CD configurations with local You can override included configuration by having the same job name or global keyword in the .gitlab-ci.yml file. The two configurations are merged together, and the configuration in the .gitlab-ci.yml file takes precedence over the included configuration. If you rerun a: Job, the include files are not fetched again. All jobs in a pipeline use the configuration fetched when the pipeline was created. Any changes to the source include files do not affect job reruns. Pipeline, the include files are fetched again. If they changed after the last pipeline run, the new pipeline uses the changed configuration. You can have up to 150 includes per pipeline by default, including nested. Additionally: In GitLab 16.0 and later self-managed users can change the maximum includes value. In GitLab 15.10 and later you can have up to 150 includes. In nested includes, the same file can be included multiple times, but duplicated includes count towards the limit. From GitLab 14.9 to GitLab 15.9, you can have up to 100 includes. The same file can be included multiple times in nested includes, but duplicates are ignored. Related topics: Use variables with include. Use rules with include. include:component Use include:component to add a CI/CD component to the pipeline configuration. Keyword type: Global keyword. Possible inputs: The full address of the CI/CD component, formatted as <fully-qualified-domain-name>/<project-path>/<component-name>@<specific-version>. Example of include:component: include: - component: gitlab.example.com/my-org/security-components/secret-detection@1.0 Related topics: Use a CI/CD component. include:local Use include:local to include a file that is in the same repository and branch as the configuration file containing the include keyword. Use include:local instead of symbolic links. Keyword type: Global keyword. Possible inputs: A full path relative to the root directory (/): The YAML file must have the extension .yml or .yaml. You can use * and ** wildcards in the file path. You can use certain CI/CD variables. Example of include:local: include: - local: '/templates/.gitlab-ci-template.yml' You can also use shorter syntax to define the path: include: '.gitlab-ci-production.yml' Additional details: The .gitlab-ci.yml file and the local file must be on the same branch. You can't include local files through Git submodules paths. All nested includes are executed in the scope of the project containing the configuration file with the include keyword, not the project running the pipeline. You can use local, project, remote, or template includes. include:project To include files from another private project on the same GitLab instance, use include:project and include:file. Keyword type: Global keyword. Possible inputs: include:project: The full GitLab project path. include:file A full file path, or array of file paths, relative to the root directory (/). The YAML files must have the .yml or .yaml extension. include:ref: Optional. The ref to retrieve the file from. Defaults to the HEAD of the project when not specified. You can use certain CI/CD variables. Example of include:project: include: - project: 'my-group/my-project' file: '/templates/.gitlab-ci-template.yml' - project: 'my-group/my-subgroup/my-project-2' file: - '/templates/.builds.yml' - '/templates/.tests.yml' You can also specify a ref: include: - project: 'my-group/my-project' ref: main # Git branch file: '/templates/.gitlab-ci-template.yml' - project: 'my-group/my-project' ref: v1.0.0 # Git Tag file: '/templates/.gitlab-ci-template.yml' - project: 'my-group/my-project' ref: 787123b47f14b552955ca2786bc9542ae66fee5b # Git SHA file: '/templates/.gitlab-ci-template.yml' Additional details: All nested includes are executed in the scope of the project containing the configuration file with the nested include keyword. You can use local (relative to the project containing the configuration file with the include keyword), project, remote, or template includes. When the pipeline starts, the .gitlab-ci.yml file configuration included by all methods is evaluated. The configuration is a snapshot in time and persists in the database. GitLab does not reflect any changes to the referenced .gitlab-ci.yml file configuration until the next pipeline starts. When you include a YAML file from another private project, the user running the pipeline must be a member of both projects and have the appropriate permissions to run pipelines. A not found or access denied error may be displayed if the user does not have access to any of the included files. Be careful when including another project's CI/CD configuration file. No pipelines or notifications trigger when CI/CD configuration files change. From a security perspective, this is similar to pulling a third-party dependency. For the ref, consider: Using a specific SHA hash, which should be the most stable option. Use the full 40-character SHA hash to ensure the desired commit is referenced, because using a short SHA hash for the ref might be ambiguous. Applying both protected branch and protected tag rules to the ref in the other project. Protected tags and branches are more likely to pass through change management before changing. include:remote Use include:remote with a full URL to include a file from a different location. Keyword type: Global keyword. Possible inputs: A public URL accessible by an HTTP/HTTPS GET request: Authentication with the remote URL is not supported. The YAML file must have the extension .yml or .yaml. You can use certain CI/CD variables. Example of include:remote: include: - remote: 'https://gitlab.com/example-project/-/raw/main/.gitlab-ci.yml' Additional details: All nested includes are executed without context as a public user, so you can only include public projects or templates. No variables are available in the include section of nested includes. Be careful when including another project's CI/CD configuration file. No pipelines or notifications trigger when the other project's files change. From a security perspective, this is similar to pulling a third-party dependency. If you link to another GitLab project you own, consider the use of both protected branches and protected tags to enforce change management rules. include:template Use include:template to include .gitlab-ci.yml templates. Keyword type: Global keyword. Possible inputs: A CI/CD template: All templates can be viewed in lib/gitlab/ci/templates. Not all templates are designed to be used with include:template, so check template comments before using one. You can use certain CI/CD variables. Example of include:template: # File sourced from the GitLab template collection include: - template: Auto-DevOps.gitlab-ci.yml Multiple include:template files: include: - template: Android-Fastlane.gitlab-ci.yml - template: Auto-DevOps.gitlab-ci.yml Additional details: All nested includes are executed without context as a public user, so you can only include public projects or templates. No variables are available in the include section of nested includes. include:inputs Introduced in GitLab 15.11 as a Beta feature. Use include:inputs to set the values for input parameters when the included configuration uses spec:inputs and is added to the pipeline. Keyword type: Global keyword. Possible inputs: A string, numeric value, or boolean. Example of include:inputs: include: - local: 'custom_configuration.yml' inputs: website: "My website" In this example: The configuration contained in custom_configuration.yml is added to the pipeline, with a website input set to a value of My website for the included configuration. Additional details: If the included configuration file uses spec:inputs:type, the input value must match the defined type. If the included configuration file uses spec:inputs:options, the input value must match one of the listed options. Related topics: Set input values when using include. stages Support for nested array of strings introduced in GitLab 16.9. Use stages to define stages that contain groups of jobs. Use stage in a job to configure the job to run in a specific stage. If stages is not defined in the .gitlab-ci.yml file, the default pipeline stages are: .pre build test deploy .post The order of the items in stages defines the execution order for jobs: Jobs in the same stage run in parallel. Jobs in the next stage run after the jobs from the previous stage complete successfully. If a pipeline contains only jobs in the .pre or .post stages, it does not run. There must be at least one other job in a different stage. .pre and .post stages can be used in required pipeline configuration to define compliance jobs that must run before or after project pipeline jobs. Keyword type: Global keyword. Example of stages: stages: - build - test - deploy In this example: All jobs in build execute in parallel. If all jobs in build succeed, the test jobs execute in parallel. If all jobs in test succeed, the deploy jobs execute in parallel. If all jobs in deploy succeed, the pipeline is marked as passed. If any job fails, the pipeline is marked as failed and jobs in later stages do not start. Jobs in the current stage are not stopped and continue to run. Additional details: If a job does not specify a stage, the job is assigned the test stage. If a stage is defined but no jobs use it, the stage is not visible in the pipeline, which can help compliance pipeline configurations: Stages can be defined in the compliance configuration but remain hidden if not used. The defined stages become visible when developers use them in job definitions. Related topi'''
