["http://gitstats.sourceforge.net"]
title = "GitStats - git history statistics generator"
full_description = "GitStats is a statistics generator for git (a distributed revision control system) repositories. It examines the repository and produces some interesting statistics from the history of it. Currently HTML is the only output format. But note that the version in Debian is most likely much older than the latest version available in git."
