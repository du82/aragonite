description = "~*LET'S DRAW*~. Available for Windows, macOS"
full_description = '''A little late, but I doubt you’ll get a Steam key as the product itself has been delisted from the Steam store. I like to analyze games from a casual POV to give indie game devs advice on what worked and how to further improve their games. You can find the rating video at the link below. I found the game interesting! I played it without knowing what it's about, and after playing it, I am still confused, but I think I had some fun! Drawing based on the prompts was fun! I didn't expect streaming this to get deep but dang. O_O Thanks for a fun game that reminded me of the joy of drawing! This is a fantastically peculiar game that makes little sense to people outside of the art scene, like myself. I enjoy the heck out of the game, but I do wish the controls and camera were better. If the game ever gets revisited/remastered, I'd focus on smoothing out those aspects while keeping everything else... nonsensical. so when are we getting the full fledged "literally just kid pix" spiritual successor to this because whilst its obvious theres some very good and true statements going on in this game, part of me cant help but notice that its also screaming out to be a kid pix style tool, This game is so cute! i love the colors and the vibes. I also love the prompts, it makes it fun to draw. One thing though is when i try to see my portfolio, around half of them are blank, i dont know why. It makes me sad that i lost so much of the drawings i did, if there's a way to fix this i'd love to know. Otherwise, this game is so fun and i look forward to playing it everyday. I only got it a few days ago and i already have 8 hours on it! I know this is an old comment, but I thought I'd respond anyway. When I opened my portfolio towards the start of the game, there were eight total pictures and only three of them were not blank. The funny thing is, at that point I had only drawn three pictures! However multiple times (five, if i had to guess) I fell into the void or accidentally entered a door with nothing drawn, which prompted Professor Qwertz to say it wasn't finished and to come back when I was done. My theory is that the game catalogues the unfinished drawings as well as the finished. I would recommend going back through your portfolio if you still have it and checking to see if there are the 50 total finished drawings.'''
