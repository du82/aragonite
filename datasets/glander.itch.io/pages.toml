title = "Lovely Weather We're Having by Glanderco"
description = '''
Note: This game doesn't work with every operating system any more! LWWH was made in 2015. As time goes on, it becomes really hard to update a game for every new OS that comes out. So, the game is now FREE, but download at ur own risk no guarantees :)
An atmospheric 3D explorer thingy about going outside with a dog.
SOME FEATURES: 
Responds to local weather data, simulates actually being outside. Pleasant sounds, colors, and visuals that I hope you like. Designed with introverts in mind. 12 NPCs whose moods and conversation topics change with the weather and time of day.Open gameplay, forever, until you die in real life.Designed to be played in 10-20 minute bursts.Cute dog A top-secret **cheat code**. Rocks you can kick.
"The vibrantly colored world of Lovely Weather We're Having doesn't take you back to a specific time necessarily, but to a mind set, when the world seemed bigger and brighter and more mystifying."-Jess Joho, Kill Screen "Lovely Weather is a clever little mood stimulator on the contemplative end of the scale, a kind of dynamic Zen box. You open it and poke around a little and maybe close it, thinking "Is that all?" And then you come back, and the weather's different, and the time of day's just so, and it takes your breath away." -Matt Peckham, WIRED "Watched the trailer and I have no idea what the game is about."-Someone on reddit
Thanks! See you outside!'''
