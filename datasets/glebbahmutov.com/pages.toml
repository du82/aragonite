["https://glebbahmutov.com"]
title = "Dr. Gleb Bahmutov, PhD"
full_description = 'about me resume email blog github cypress.tips bahmutov.bsky.social slides videos My Youtube channel Cypress Tips & Tricks newsletter Cypress Tips Discord climate emergency I am a software engineer interested in front and back end development, especially in using JavaScript (and its flavors) across the entire stack. I work at Mercari US, making the world a better place. I try to blog on topics related to software craft (more than 500 blog posts!). I have circled the globe sharing my experience with other developers, see slides from the past presentations. I am Algolia Ambassador, used to be Microsoft MVP. You can consider me a Cypress "SuperAmbassador" :) I have created and keep expanding multiple online courses teaching web testing. Find them at cypress.tips/courses In my spare time I built some cool stuff; see the links below. I try to keep modules small because I agree with Sindre Sorhus. Spent 3 years at Cypress.io as its hands-on VP of Engineering. Made Cypress work on Windows, came up with component testing, created CircleCI Orb, wrote GitHub Action, and worked on lots of other Cypress features. I worked at uTest for half a year, mostly bringing together and updating various front end technology stacks. Earlier I spent four years as a researcher at EveryScape, writing panorama stitching and 3D modeling software. Before that I worked calibrating 3D laser scanners and developing white light scanners. Even before that I wrote distributed database access software that worked across Objective-C, C and Java systems. I am a member of multiple meetups in the Boston area and spoke about grunt, code coverage and testing, technical debt visualization, best practices for handling dependencies, agile software quality, angular performance, Chrome code snippets and many other topics. I also spoke at conferences around the world about AngularJS, NodeJS, how to teach JavaScript, testing code and modular development. You can find most of my slide decks at slides.com/bahmutov. Doctorate from Purdue University (West Lafayette, Indiana) working with Dr. Voice Popescu (adviser) and Dr. Mihai Mudure (fellow candidate), developing a novel scanning sensor. We were building 3D models of rooms in real time using a video camera and a bunch of lasers. If you were afraid of lasers, you could be anywhere else in the world, observing the results over the internet, as our system was smart enough to incrementally update the 3D model and send the results in real time.'
