["https://globalinitiative.net/analysis/future-ukraine-russia-conflict-europe-illicit-arms-market"]
title = "Tomorrow’s fire: What does the future of the Ukraine conflict mean for Europe’s illicit arms market? | Global Initiative"
description = "The most plausible scenarios are a prolonged stalemate, a negotiated settlement or a decisive victory by one side or the other. Each of these outcomes would have very different consequences for Ukraine’s sovereignty and the future of European security. And each would raise the challenge of how to manage the aftermath of the conflict. One of the most pressing concerns will be the risk of firearms being trafficked to the surrounding regions of the conflict zone. The main outcomes of a recent simulation of the possible endgames to the conflict are presented here."
