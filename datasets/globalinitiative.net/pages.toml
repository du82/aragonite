["https://globalinitiative.net/analysis/human-smuggling-and-trafficking-in-the-sahel-2024"]
title = "Human smuggling and trafficking in North Africa and the Sahel - 2024 | Global Initiative"
description = "The 2024 series covers country reports on Libya, Tunisia, Morocco, Mali, Niger, Chad and Sudan.They chart the broader shifts currently underway in human smuggling through the two regions, which have seen hybrid smuggling surge in Libya, embarkations by foreign migrants rise in Tunisia, and Sudanese refugees increasing movement throughout North Africa and the Sahel. They also detail key political and security dynamics, including the worsening wars in Sudan and Mali, the unstable status quo in Libya, and the growth of political volatility across a number of countries in both regions."
