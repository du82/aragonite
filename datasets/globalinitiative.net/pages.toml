["https://globalinitiative.net/initiatives/strategy"]
title = "Global Strategy | Global Initiative"
description = "Organized crime is a growing threat to security, development, governance and the environment. Despite the global nature of this threat, there is no strategy to prevent and address it. This not only hampers the ability of states to deal with this serious problem, but it also impairs noble objectives such as achieving sustainable development goals, slowing climate change, as well as resolving conflicts and building peace. Therefore, GI-TOC is leading a process to formulate the building blocks of a global strategy against organized crime."
