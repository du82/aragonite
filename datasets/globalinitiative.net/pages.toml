["https://globalinitiative.net/analysis/negative-side-effects-how-fentanyl-has-poisoned-relations-between-the-us-and-canada"]
title = "Negative side effects: How fentanyl has poisoned relations between the US and Canada | Global Initiative"
description = "Canada is not a ‘big player’ in the fentanyl trade: well under 1% of the fentanyl entering the US comes from Canada. In fact, fentanyl from Canada is not even mentioned as a drug trafficking threat to the US in the most recent assessment by the US Drug Enforcement Administration. While illicit fentanyl production does occur in Canada, most of the product is consumed domestically, with surplus amounts smuggled to overseas markets, such as Australia. In the US, 97% of fentanyl seized is sourced from the southern border with Mexico, with China being the primary source of the precursor chemicals used in the production of the drug."
