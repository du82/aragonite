["https://globalinitiative.net/analysis/alfa-pvp-drug-trafficking-ukraine-russia-conflict"]
title = "The devil’s not-so-new psychoactive substance | Global Initiative"
description = "Alpha-PVP, a highly addictive synthetic drug, is experiencing growing demand in Ukraine. Alpha-PVP – full name alpha-pyrrolidinovalerophenone  –  a designer drug, first emerged in the US two decades ago. For users, it generates an intense feeling of euphoria followed by an equally powerful comedown, with symptoms consisting of fatigue, depression, paranoia, hallucination and suicidal instincts."
full_description = '''22 May 2023 “Death Can Wait”: Drugs on the Frontline in Ukraine Throughout history soldiers have used drugs, sometimes to fight better or to stay alert, or perhaps to help cope with the extreme psychological situation and trauma they are faced with. The current conflict in Ukraine is no different. Concerns around this led to the Ukrainian parliament passing a new law that authorizes random drug and alcohol tests on soldiers. Organized crime is nothing if not adaptable, even in this most extreme environment. The soldiers fighting to protect their homeland represent a new and relatively wealthy market, ripe for criminal networks to exploit. And they are doing just that. So who is behind this market? This is a story about war, drugs, the darknet and corruption.Speaker(s):TedSashaAdditional Reading:(GI Paper) New front lines: Organized criminal economies in Ukraine in 2022Business Insider - Russian lawmakers baselessly claim their army is up against biologically modified Ukrainian super soldiersLiveScience - Nazis Dosed Soldiers with Performance-Boosting 'Superdrug'History - G.I.s’ Drug Use in Vietnam Soared—With Their Commanders’ HelpThe Atlantic - The Drugs That Built a Super SoldierJourneyman Pictures - Sierra Leone's Cocaine-Drugged Child SoldiersGlobal Initiative Against Transnational Organized Crime - Lebanon’s role in Syria’s Captagon tradeWashington Post - Zelensky takes on Ukraine’s top internal enemyLegatum Institute - Looting Ukraine: The East, the West and the Corruption of a Country (Full Version)Transparency International - Corruption Perceptions IndexUS DoJ Press release - Justice Department Investigation Leads to Shutdown of Largest Online Darknet MarketplaceChainalysis - OFAC Sanctions Hydra Following Law Enforcement Shutdown of the Darknet Market, As Well As Russian Exchange GarantexNational Institute on Drug Abuse - Synthetic Cathinones ("Bath Salts") DrugFactsUNIAN.info - SBU busts major drug lab in Kyiv region in raid against local branch of int'l drug cartelKyiv Post - Authorities bust cocaine hidden in banana freight container in Odesa portThe Institute of Psychiatry, Forensic Psychiatric Examination and Drug Monitoring of the Ministry of Health of Ukraine - Report on drug situation in Ukraine 2020Kyiv Post - NABU to serve notice of suspicion on SBU Deputy Chief DemchynaSlate - Ransomware Goes to Business School - Good customer service has become a key part of a lucrative scamUS DoJ Press Release - Colorado Man Sentenced to 11 Years in Prison for Moderating Disputes on Darknet Marketplace AlphaBayNews.pn - Chopped fingers, millions of dollars and gold bars »: SBU told details about the largest drug cartelСлужба безпеки України (SBU) - CБУ блокувала діяльність «підрозділу» міжнародного наркосиндикату «Хімпром» (SBU blocked the activities of the "unit" of the international drug syndicate "Khimprom")Forbes - The U.S. And Allies Go After Crypto Exchange And Russian Money LaunderingOrganized Crime and Corruption Reporting Project (OCCRP) - Dubai Uncovered: Data Leak Exposes How Criminals, Officials, and Sanctioned Politicians Poured Money Into Dubai Real EstateSBU - ДБР жорстко протидіє спробам розповсюдження наркотиків в прифронтових районахArtwork by Paulina Rosol-Barrass Read moreRead less Share this'''
