["https://globalinitiative.net/crime_type/violence-fragility"]
title = "Violence and fragility | Global Initiative"
description = "Organized crime can undermine the rule of law by corrupting government officials and institutions, making it difficult to hold criminals accountable and maintain public safety. This can further fuel violence and instability in weak states, making it harder for them to achieve stability and security, and to develop economically and socially. The illegal activities of organized crime also have a negative impact on the local population and communities, causing poverty and social disruption."
