["https://globalinitiative.net/analysis/deep-dive-podcast"]
title = "Deep dive: The podcast | Global InitiativeA Network to Counter Networks"
description = "The Deep Dive podcast takes an in depth look at transnational organized crime investigations from the Global Initiative, drawing on the range of expertise from the GI Network of over 500 experts."
full_description = '''14 Jan 2025 Drugs, Dead Drops and the Battle Over Russian Darknet Markets If you were to walk around a Russian city, you might not realise it but hundreds of small packages of drugs, could be just below the surface, buried in the ground, or maybe attached to the back of a nearby drainpipe with magnets, or hidden inside a hole in a wall. These little "treasures" have been ordered online from a vendor operating on a darknet platform and then hidden by couriers known as 'Kladmen' all over the place waiting to be collected - this is the "dead drop" method.The darknet markets servicing Russia have revolutionized the illicit drug markets in the country, which has seen an explosion in the consumption of synthetic drugs like methadone, mephedrone or Alpha-PVP. The vendors run a network of chemists, wholesalers, and Kladmen. Sportsman, hired thugs, roam around looking for Seagulls (people who steal dead drops) and punishing Kladmen on behalf of vendors, before uploading the punishments to social media as a warning to others.For many years, Hydra, the largest DNM the world has ever known, defeated all competition and reigned supreme, handling over $5 billion dollars of cryptocurrency during its lifespan. But in 2022, it was taken down and like the mythical beast it was named after, new heads sprouted in its place - OMG!OMG!, Mega, Kraken, Blacksprut - all vying for position, competing for market share and creating the most audacious public marketing stunts and highly produced online videos. The DNMs, with connections to the precursor markets of China and India, operate on TOR, have pushed synthetic drugs into all corners of Russia, democratizing the production process, with how-to guides and readily available lab equipment, and even created an apprenticeship scheme for prospective Kladmen, with a guaranteed job at the end. The whole process is highly anonymised from production to transportation, and from purchase to delivery through the dead drop method. We have seen darknet markets affecting the drug appetites of an entire nation and beyond. Speaker(s):Max Daly, Journalist who specialises in drugs and organized crime. He is an Orwell Prize winner, co-authored of the book Narcomania and the co-author of the GITOC paper 'Breaking Klad: Russia’s Dead Drop Drug Revolution'.Patrick Shortis, Senior Blockchain Intelligence Analyst working on the illicit drugs program at TRM Labs and co-author of the GI’s paper ‘Breaking Klad: Russia’s Dead Drop Drug Revolution’.Links:Breaking Klad: Russia’s Dead Drop Drug RevolutionGlobal Initiative against Transnational Organized Crime(Podcast) “Death Can Wait”: Drugs on the Frontline in Ukraine Additional Links:https://home.treasury.gov/news/press-releases/jy0701https://meph.lenta.ru/articles/1-popularityhttps://lenta.ru/news/2024/11/27/borby-s-rasprostraneniem-narkotikov/https://lenta.ru/news/2024/11/27/milonov-predlozhil-proverit-vseh-rossiyan-na-narkotiki/https://lenta.ru/news/2024/11/28/v-gosdume-vyskazalis-ob-epidemii-mefedrona-v-rossii/https://argumenti.ru/society/2023/06/838979https://www.tiktok.com/@brem100/video/7242272283954253058?lang=enhttps://www.youtube.com/watch?v=sWTmaRvpViwhttps://www.tiktok.com/@moriarti.dark/video/7271777133335153926https://sevastopol.su/news/v-krymu-proshel-sud-nad-blogershey-yuley-finesshttps://meduza.io/en/feature/2024/02/07/when-a-college-student-challenged-russia-s-top-censorship-activist-at-her-q-a-event-she-responded-by-threatening-him-with-prosecutionhttps://novayagazeta.eu/articles/2023/12/20/mother-russia-enhttps://www.google.com/maps/place/Obukhovets,+Leningrad+Oblast,+Russia,+187047/@59.4806054,31.2688815,13z/data=!4m6!3m5!1s0x46bdb94966834f73:0xbfe5e983110f840f!8m2!3d59.4952008!4d31.2902649!16s%2Fg%2F1pzpdbhfc?entry=ttu&g_ep=EgoyMDI0MTIxMS4wIKXMDSoASAFQAw%3D%3Dhttps://www.kommersant.ru/doc/5899910https://pubchem.ncbi.nlm.nih.gov/compound/Brilliant_greenhttps://www.amazon.co.uk/The-Vory-Russias-Super-Mafia/dp/B07CS7BZ89/ref=sr_1_1?nsdOptO