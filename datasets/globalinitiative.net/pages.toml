title = "European Drug Trends Monitor #1 | Global Initiative"
description = "European drug markets are undergoing considerable changes, triggered by the confluence of several major trends in supply and demand. These include an oversupply of cocaine, a growing crack epidemic, significant shifts in the production of heroin in Afghanistan, the gradual emergence of synthetic opioids, the partial legalization of cannabis in some countries and the rise in synthetic stimulants such as synthetic cathinones, especially against the backdrop of Russia’s war against Ukraine."
