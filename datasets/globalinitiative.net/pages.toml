["https://globalinitiative.net/analysis/kush-in-sierra-leone"]
title = "Kush in Sierra Leone | Global Initiative"
description = "Since 2022, a synthetic drug known as ‘kush’, has killed likely thousands of people in West Africa. Kush emerged in Sierra Leone, but quickly spread across countries in the subregion, including Liberia, Guinea, the Gambia, Guinea-Bissau and Senegal, with devastating effects. By April 2024, the health impacts of kush, a synthetic drug containing nitazenes, opioids as – or more – powerful than fentanyl, as well as synthetic cannabinoids, were so acute that the presidents of Sierra Leone and Liberia had declared national emergencies over drug use - an unprecedented step."
