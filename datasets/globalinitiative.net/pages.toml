["https://globalinitiative.net/analysis/steal-corrupt-kill-the-evolving-face-of-transnational-organized-crime"]
title = "Steal, corrupt, kill: The evolving face of Transnational Organized Crime | Global Initiative"
description = "In a geopolitically volatile world, organized criminals are colluding with states to carry out anything from cyberattacks, sabotage and contract killings to sanctions evasion, trading in critical minerals and sourcing semiconductors. Crime levels are rising and threatening global security, yet organized crime continues to be treated narrowly as a law enforcement issue. As a result, approaches to disrupting organized crime remain fragmented, reactive and under-resourced."
