title = "Zenlayer and Global Switch Partner to Deliver Advanced AI Infrastructure in Asia-Pacific"
description = "Singapore, December 4, 2024 - Zenlayer, the world’s first hyperconnected cloud, and Global Switch, a leading carrier-neutral data centre operator, today announced a strategic partnership to deliver hyperconnected AI infrastructure and robust connectivity in Asia-Pacific. This partnership enables AI companies to build and operate high-performance AI clusters while leveraging enhanced interconnectivity across Global Switch’s data centres in Hong Kong and Singapore."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Zenlayer and Global Switch Partner to Deliver Advanced AI Infrastructure in Asia-Pacific Startpagina Over Ons Nieuws Zenlayer and Global Switch Partner to Deliver Advanced AI Infrastructure in Asia-Pacific Zenlayer and Global Switch Partner to Deliver Advanced AI Infrastructure in Asia-Pacific Release date: 04.12.2024 Singapore, December 4, 2024 - Zenlayer, the world’s first hyperconnected cloud, and Global Switch, a leading carrier-neutral data centre operator, today announced a strategic partnership to deliver hyperconnected AI infrastructure and robust connectivity in Asia-Pacific. This partnership enables AI companies to build and operate high-performance AI clusters while leveraging enhanced interconnectivity across Global Switch’s data centres in Hong Kong and Singapore. The joint solution combines both companies’ cutting-edge technologies designed for AI and connectivity. Global Switch’s Hong Kong data centre features the most advanced direct-to-chip liquid cooling systems, tailored for high-density compute installations. Zenlayer’s high-bandwidth, ultra-low-latency software-defined network (SDN) fabric provides seamless interconnectivity between Global Switch’s data centres, including key international routes such as Hong Kong to Singapore, as well as local interconnections between Hong Kong, Tai Seng, and Woodland data centres. This ensures fast and reliable data transfers for AI training and inferencing across the region. “We’ve seen a significant increase in the demand for high-density racks in the past two years in Asia, and Hong Kong is a natural choice for us to showcase the latest in liquid cooling technology” said Ashley Muldoon, the Chief Executive Officer of Global Switch. “We are happy to join hands with Zenlayer to provide a turnkey infrastructure solution to power AI growth in the region”. “We are glad to partner with Global Switch to deliver cutting-edge AI infrastructure solutions to the market” said Joe Zhu, the Chief Executive Officer of Zenlayer. “By combining our purpose-built fabric for AI with Global Switch’s advanced data centre technologies, we are offering a comprehensive solution that simplifies AI deployment, allowing AI companies to focus on what matters most: groundbreaking innovations”. Beyond its network capabilities, Zenlayer also provides managed AI data centre services and GPU Cloud, on-demand compute resources to accelerate AI workloads. With infrastructure optimised for AI interference workloads, Global Switch facilitates fast, seamless processing and real-time decision-making for AI applications throughout Asia-Pacific. Contact the Zenlayer and Global Switch teams to learn more about the joint offerings. Notes to editors: About Zenlayer Zenlayer is a leading global network and cloud services provider that enables businesses to connect, scale, and innovate worldwide. With a global network spanning over 200 cities in 60+ countries, Zenlayer offers a comprehensive suite of network and cloud services, including dedicated servers, colocation, cloud networking, and SD-WAN. For more information, please visit www.zenlayer.com About Global Switch Established in 1998, Global Switch has built a reputation for creating data centres that set new standards in scale, resilience and connectivity. Global Switch’s portfolio comprises eleven data centres owned by consolidated entities centrally located in Tier 1 cities across Europe and Asia-Pacific, offering a total of 388,000 sq.m of world-class technical space with further developments underway. Our network is home to some of the most forward-thinking public and private organizations of all sizes, who rely on us to house their mission-critical IT infrastructure and connect them seamlessly to a diverse choice of telecoms, internet, and cloud providers. For more information about Global Switch, visit the website at www.globalswitch.com Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel