title = "Bruce Claassen"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Bruce Claassen Startpagina Over Ons Het Managementteam Bruce Claassen Bruce Claassen Group Director, Finance Bruce kwam in 2023 bij Global Switch als Group Director, Finance met meer dan 20 jaar ervaring in meerdere sectoren gericht op het leiden en realiseren van verandering en transformatie voor internationale bedrijven en door private equity gesteunde bedrijven, gebouwd op een diepe FP&A achtergrond. Carrière Oorspronkelijk gekwalificeerd als architect in Zuid-Afrika, kwalificeerde Bruce zich als registeraccountant bij het Institute of Chartered Accountants in Engeland en Wales via BDO en legde vervolgens de basis voor zijn financiële carrière door leiding te geven aan FP&A-, Central Finance en Investor Relations teams voor een aantal internationale bedrijven met hoofdkantoor in het VK. Gebruikmakend van zijn opgebouwde ervaring, verlegde hij de focus naar het werken met bedrijven die ingrijpende veranderingen doormaakten, met name door private equity gesteunde bedrijven. Hij leidde de Group FP&A functie van Worldpay terwijl hij werkte aan de financiële kant van de verkoop voorafgaand aan de succesvolle IPO van Worldpay. Vervolgens trad hij in dienst bij Towergate Insurance als onderdeel van een turnaround team dat tot taak had het bedrijf te stabiliseren en de financiën te herstructureren, waardoor een succesvolle gedeeltelijke verkoop aan een grotere aandeelhouder groep mogelijk werd gemaakt. Bruce leidde de financiële integratie van Reckitt plc's overname van Mead Johnson ter waarde van $ 17 miljard en leidde vervolgens het herontwerp van de wereldwijde rapportage structuur en winstgevendheid maatregelen van de Group. Voordat hij bij Global Switch kwam, was hij verantwoordelijk voor alle Group Finance functies bij het RAC en hielp hij bij het realiseren van een consistente dubbelcijferige groei in een vlakke markt die leidde tot de succesvolle gedeeltelijke verkoop aan een grotere aandeelhouder groep. Verantwoordelijkheden bij Global Switch Bruce is lid van het Senior Management team en is verantwoordelijk voor het leiden van de centrale FP&A, Group Financial Control en Systems teams van de Group, evenals alle regionale financiële teams in Europa en Azië-Pacific. Samen zijn deze teams verantwoordelijk voor alle interne management rapportage, externe statutaire rapportage, aandeelhouder ondersteuning, prestatie analyse die een diepgaande analyse biedt van strategische meerjarige opties, robuuste financiële controles en zakelijke samenwerking met onze Operations, Commercial en Delivery collega's. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
