full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Matthew Hewitt Startpagina Over Ons Het Managementteam Matthew Hewitt Matthew Hewitt Group Director, Tax and Treasury Matthew trad in 2019 in dienst bij Global Switch als Group Director, Tax and Treasury, met meer dan 20 jaar ervaring in wereldwijde belastingen en treasury voor multinationale ondernemingen. Carrière Matthew was Vice President, Tax and Treasury bij Colt Technology Services, waar hij leiding gaf aan een belangrijke herstructurering van de groep, waaronder juridische, werknemers en belasting kwesties. Hij implementeerde ook een doorlopende krediet faciliteit en verplaatste het bedrijf naar één nieuwe bank aanbieder in 18 gebieden, evenals alle verzekering regelingen van de groep. Matthew, die directeur was van de meerderheid van de holding maatschappijen en werk maatschappijen van de groep in het Verenigd Koninkrijk en daarbuiten, was ook verantwoordelijk voor de fiscale structurering en hedging regeling voor een grote overname in Azië. Buiten de technologie/telecommunicatiesector heeft hij de belastingzaken van tal van multinationale groepen beheerd en heeft hij het eerste deel van zijn carrière bij EY besteed aan het adviseren van bedrijven over belasting, voornamelijk in Londen en ook een tijdlang in New York. Verantwoordelijkheden bij Global Switch Bij Global Switch is Matthew verantwoordelijk voor alle aspecten van de belasting, treasury en verzekering zaken van Global Switch. Dit omvat het beheren van bank relaties, cash en liquiditeit, het zorgen voor een passende belasting strategie en het bijhouden van de dossiers. Matthew is ook verantwoordelijk voor de relaties met de rating bureaus en obligatiehouders. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onz