full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Ashley Hinge Startpagina Over Ons Het Managementteam Ashley Hinge Ashley Hinge Group Director, Customer Services Ashley, een ervaren customer services professional, trad in 2021 in dienst bij Global Switch als Group Director, Customer Services. Carrière Voordat hij bij Global Switch kwam, was Ashley Director Customer Success EMEA bij DocuSign, waar hij de customer experience maximaliseerde door de integratie van gestructureerde processen en de groei van nieuwe en bestaande accounts leidde door strategieën voor klantrelaties te ontwikkelen en te implementeren. Daarvoor was Ashley Director Customer Care bij IHS Markit, een wereldwijde leverancier van bedrijfskritieke gegevens en analyses, waar hij de klantervaring maximaliseerde en met succes een portal voor klant productgebruiker ondersteuning implementeerde. Aanvankelijk bekleedde hij de rol van Regional Sales Education Specialist (EMEA) voor het bedrijf en verbeterde hij de channel verkoop prestaties door het leiden van het wereldwijde opleiding initiatief voor channel partners. Verantwoordelijkheden bij Global Switch Een groot deel van Ashley's eerdere carrière was in Training en Ontwikkeling, waar hij ontbrekende vaardigheden identificeerde en zich concentreerde op het ontwikkelen en implementeren van programma's om de productiviteit van het personeel te verhogen. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee S