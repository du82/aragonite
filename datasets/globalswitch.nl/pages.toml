["https://globalswitch.nl/about-us/senior-management/adam-eaton"]
title = "Adam Eaton | Senior Management | Global Switch"
description = "Adam joined Global Switch as Managing Director, London in 2022 with around 20 years of experience across the data centre sectors, technology and cloud sector."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Adam Eaton Startpagina Over Ons Het Managementteam Adam Eaton Adam Eaton Executive Group Director, Europe Adam trad in 2022 in dienst bij Global Switch als Managing Director in Londen en werd kort daarna gepromoveerd tot zijn huidige functie van Executive Group Director (Londen). Adam heeft ongeveer 20 jaar ervaring binnen de data center sectoren, technologie en cloud sector. Carrière Adam begon zijn carrière als consultant voor een wereldwijd ERP-bedrijf, wat hem de kans gaf om in 2000 naar Australië te verhuizen. Terwijl hij in Australië was, trad hij in dienst bij IBM Australia als Business Development Executive, voordat hij in 2009 terugkeerde naar het VK, waar hij bijna zes jaar doorbracht in verkoop en verkoop management bij een toonaangevende wereldwijde data center provider in het VK. Adam verliet deze functie om zich bij Pulsant, een van de toonaangevende cloud service providers in het VK, aan te sluiten als Sales Director. Na Pulsant verwierf en leidde Adam zijn eigen cloud- en IT-services bedrijf, Nimoveri, totdat hij het in 2020 aan IDE Group verkocht. Bij IDE Group hield Adam toezicht op de turnaround van hun Network, Colocation and Managed Services divisie, waardoor het kon worden verkocht aan CloudCoCo Ltd. aan het einde van 2021. In de loop van zijn carrière heeft Adam zijn uitgebreide verkoop-, ondernemers- en leiderschapsvaardigheden gebruikt om significante resultaten en organisatorische verbeteringen te leveren in organisaties van verschillende omvang. Adam heeft een MBA van de Australian Graduate School of Management en een BSc Honours graad in Operations Engineering van de Exeter University in het VK. Verantwoordelijkheden bij Global Switch Als Executive Group Director (London) van Global Switch London is Adam verantwoordelijk voor het handhaven van een best-in-class operationele omgeving voor de London Campus, terwijl hij de bedrijfsontwikkeling, nieuwe initiatieven en nieuwe ontwikkelingen blijft stimuleren, waaronder de herontwikkeling en stroom upgrade van London North en East en de geplande ontwikkeling van de campus met London South, die nog eens 25.000 m² bruto ruimte en 40 MVA aan stroomvoorziening capaciteit zal bieden. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'
