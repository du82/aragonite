full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Terence Teo Startpagina Over Ons Het Managementteam Terence Teo Terence Teo Managing Director, Singapore Terence trad in 2023 in dienst bij Global Switch als Managing Director, Singapore. Hij heeft ongeveer 20 jaar zakelijke en algemene managementervaring, met name op het gebied van cloud, beveiliging en netwerken. Carrière Voordat hij bij Global Switch kwam, was Terence Managing Director Azië-Pacific bij Zenlayer Inc. (een leverancier van edge computing en softwaregedefinieerde netwerken), waar hij leiding gaf aan de teams Sales, Engineering en Operations. Daarvoor bekleedde Terence verschillende leidinggevende functies tijdens zijn 16 jaar bij Tata Communications, waar hij groei realiseerde van hun datacenters, ondernemingen, serviceproviders, hyperscalers en media-entertainmentactiviteiten in de APAC-regio. Terence heeft een master in communicatiesoftware en netwerken van de Technologische Universiteit van Nanyang. Hij heeft ook een bachelordiploma in informatiesystemen en computerwetenschappen van de Nationale Universiteit van Singapore. In 2023 voltooide Terence ook het GCP - Global CEO Program, een diploma dat gezamenlijk wordt uitgereikt door The Wharton School en IESE Business School. Verantwoordelijkheden bij Global Switch Terence is verantwoordelijk voor het management van beide datacentra van Global Switch in Singapore. Global Switch Tai Seng is een van de best -verbonden gebouwen in de regio Azië-Pacific en het enige datacentrum in de regio met directe toegang tot meerdere internationale onderzeese kabelsystemen. Het tweede datacentrum van Global Switch, Singapore Woodlands, bevindt zich ten noorden van het eiland. Het 25.000 m2 grote datacentrum levert connectiviteitsoplossingen aan het dichtbebouwde ecosysteem van Tai Seng, is LEED Gold-gecertificeerd en heeft een onafhankelijk geverifieerde PUE van 1,34. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 202