["https://globalswitch.nl/about-us/senior-management/eric-liu"]
title = "Eric Liu | Het managementteam | Global Switch"
description = "Eric has over 20 years of experience in the telecommunications and data centre sectors, driving sales, managing large teams, growing business in a cross-cultural environment, building strategic partnerships and cultivating leads with regional and vertical channel partners."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Eric Liu Startpagina Over Ons Het Managementteam Eric Liu Eric Liu Managing Director, Hong Kong Eric werkt al meer dan 20 jaar in de telecommunicatie- en datacenterindustrie, en heeft ervaring in het stimuleren van verkoop, het managen van grote teams, het laten groeien van business in een multiculturele omgeving, het opbouwen van strategische samenwerkingsverbanden en het ontwikkelen van leads met regionale partners en partners in het verticale verkoopkanaal. Carrière Voordat hij bij Global Switch kwam was Eric, toen werkzaam in Hongkong, Executive Vice President van Pacific Light Data Communication. Daarvoor was hij Senior Vice President, Wholesale Business bij China Unicom Global, waar hij leiding gaf aan een team van meer dan 90 medewerkers en in twee jaar tijd zorgde voor een omzetgroei in meer dan 20 landen. Hij was ook General Manager voor ChinaCache Hong Kong, waar hij verantwoordelijk was voor de operationele activiteiten en bedrijfsontwikkeling in de regio Asia-Pacific. Hij begon zijn loopbaan in Beijing, waar hij de China Business Development Director was voor een toonaangevende internationale datacenter provider. Hij was de eerste businessmedewerker van het team in China en was verantwoordelijk voor het promoten van het merk, het identificeren van nieuwe zakelijke kansen en mogelijke samenwerkingen met onder andere de grootste cloud- en telecommunicatiebedrijven in China, en het ontwikkelen van relaties met overheden en bedrijven. Hij werkte ook voor Pacnet, dat later werd overgenomen door Telstra en China Netcom, dat later fuseerde met China Unicom. Eric behaalde zijn MBA aan de Universiteit van Tsinghua en had daarvoor al een BA in International Studies behaald aan de Chinese Universiteit voor Buitenlandse Zaken. Hij spreekt vloeiend Mandarijn, Kantonees en Engels. Verantwoordelijkheden bij Global Switch In zijn rol als Managing Director Hong Kong is Eric verantwoordelijk voor het managen van Global Switch Hong Kong, inclusief het handhaven van een ‘best in class’ operationele omgeving, het overzien van business development en het stimuleren van nieuwe initiatieven. Global Switch Hong Kong is het grootste datacenter in de portefeuille van Global Switch wat betreft bruto vloeroppervlak (70.228 m2) en stroomcapaciteit (100 MVA), en is tevens het grootste netwerk- en cloudneutrale datacenter in Hongkong met een onafhankelijk berekende PUE van 1,3 op jaarbasis. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'
