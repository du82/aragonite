description = "Ashley trad in 2020 toe als Chief Operating Officer bij Global Switch. Hij heeft meer dan 27 jaar ervaring met de oplevering vanexcellente en hoogwaardige bouwprojecten."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Ashley Muldoon Startpagina Over Ons Het Managementteam Ashley Muldoon Ashley Muldoon Chief Executive Officer Ashley trad in 2020 in dienst bij Global Switch als Chief Operating Officer en werd in 2024 benoemd tot Chief Executive Officer. Hij heeft meer dan 30 jaar ervaring in datacenters en vastgoed, waaronder het managen van internationale bedrijven. Carrière Voordat hij bij Global Switch in dienst kwam, was Ashley 12 jaar lang CEO van Multiplex, een wereldwijd opererende bouwonderneming waar hij in totaal 22 jaar heeft gewerkt. Als CEO was hij verantwoordelijk voor het toezicht op de portefeuilles van Multiplex in het Verenigd Koninkrijk, het Midden-Oosten en Canada. Ashley trad in 2020 in dienst bij Global Switch als Chief Operating Officer en focuste zich op het aansturen van de operationele activiteiten van onze datacentra en de vlotte oplevering van onze ontwikkelings- en stroomverdichtingsprojecten. Hij hield ook toezicht op alle nieuwe ontwikkelingsmogelijkheden en gaf leiding aan de IT-strategie van Global Switch in alle geledingen van het bedrijf. Verantwoordelijkheden bij Global Switch Als Chief Executive Officer bepaalt Ash de korte- en langetermijndoelen van Global Switch en werkt hij samen met de Board of Directors aan de strategie van het bedrijf. Hij leidt het managementteam en overziet de implementatie van de bedrijfsplannen van de onderneming, en werkt nauw samen met het hogere management om ervoor te zorgen dat deze plannen elk jaar worden verwezenlijkt. Ash is verantwoordelijk voor de communicatie met de aandeelhouders en werknemers van Global Switch en voor de ontwikkeling van relaties met belangrijke stakeholders. Hij is bovendien verantwoordelijk voor het bevorderen van de bedrijfscultuur en voor het onderhouden en verder ontwikkelen van het merk en de reputatie van Global Switch. Ash zorgt ervoor dat de directeuren altijd op de hoogte zijn van de interne en externe concurrentieomgeving, uitbreidingsmogelijkheden, klantrelaties, markten, nieuwe ontwikkelingen in de werkomgeving van datacenters en veranderingen in wetgeving. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'
