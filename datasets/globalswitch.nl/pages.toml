full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Cookiebeleid Cookiebeleid 1. Ons Gebruik Van Cookies 1.1 Welkom bij Global Switch. Onze websites maken gebruik van cookies om u van andere gebruikers te onderscheiden. We kunnen u zo een goede ervaring bieden wanneer u onze website bezoekt en zo onze websites verder verbeteren. 1.2 In dit beleid vindt u informatie over welke cookies kunnen worden opgeslagen wanneer u een van onze websites bezoekt en voor welke doeleinden wij deze cookies gebruiken. Dit beleid is van toepassing op al onze websites waarop dit beleid is gepubliceerd, inclusief www.globalswitch.com, www.globalswitch.cn, www.globalswitch.de, www.globalswitch.es, www.globalswitch.fr, www.globalswitch.hk, en www.globalswitch.nl (hierna een “website” en gezamenlijk de “websites”). 1.3 Elke website wordt beheerd door Global Switch Limited (aangeduid als “wij”, “ons” of “onze”). Voor meer gedetailleerde informatie klikt u op de relevante link om onze Gebruiksvoorwaarden en ons Privacybeleid te lezen. 2. Toestemming Voor Het Opslaan Van Cookies 2.1 Bepaalde cookies die we gebruiken zijn strikt noodzakelijk voor de werking van onze websites. Wanneer u bijvoorbeeld een van onze websites voor het eerst bezoekt, tonen wij een pop-upbericht met informatie over ons gebruik van cookies. We gebruiken cookies om te onthouden dat we dit bericht aan u hebben laten zien (u kunt de gegevens van deze cookie bekijken onder ‘Cookiebanner’ in de onderstaande tabel). 2.2 Wat alle andere soorten cookies betreft die wij gebruiken, gaat u, door op de betreffende knop op de Cookiebanner te klikken, akkoord met het gebruik van die cookies op de manier zoals in dit beleid is beschreven. 2.3 Zie ook paragraaf 4 hieronder over de manieren waarop u de door ons gebruikte cookies kunt beheren of verwijderen. 3. Wat Zijn Cookies? 3.1 Een cookie is een klein gegevensbestand dat in uw browser of op uw computer of ander apparaat wordt geplaatst om een website in staat te stellen u als gebruiker te herkennen als u de website een volgende keer bezoekt, hetzij voor de duur van uw bezoek (met behulp van een ‘sessiecookie’), hetzij voor herhaalde bezoeken (een ‘permanente cookie’). Andere soortgelijke bestanden werken op dezelfde manier en we gebruiken het woord ‘cookie’ in dit beleid om te verwijzen naar alle bestanden die op deze manier informatie verzamelen. 3.2 Cookies zijn een veelgebruikte technologie om bepaalde informatie over bezoekers van een website te verzamelen. De meeste websites maken gebruik van cookies, en ze worden ingezet voor een breed scala van taken. 3.3 Cookies kunnen afkomstig zijn van ons (“eigen cookies”) of van derden wiens diensten wij gebruiken of met wie wij samenwerken (“cookies van derden”) en die wij toestemming geven om hun cookies in te stellen door onze websites daarvoor te configureren. In sommige gevallen krijgen wij de informatie die met behulp van een cookie van een derde is verzameld; in andere gevallen levert de derde een dienst aan ons zonder deze informatie te delen in de vorm waarin deze is verzameld. 4. Cookies Beheren En Verwijderen 4.1 Als u de cookies die door onze websites zijn ingesteld wilt beperken of ze helemaal wilt blokkeren, kunt u dit doen via de instellingen van uw browser. De ‘Help’-functie in uw browser legt u uit hoe u dit kunt doen. U kunt ook kiezen welke cookies u accepteert door deze te selecteren via de Cookiebanner die verschijnt wanneer u onze websites bezoekt. Als u zich vooral zorgen maakt over cookies van derden die door adverteerders worden gegenereerd, kunt u deze uitschakelen door naar de website Your Online Choices te gaan: http://www.youronlinechoices.com/uk/your-ad-choices. 4.2 Op https://www.aboutcookies.org vindt u uitgebreide informatie over hoe dit in de verschillende browsers werkt. U vindt er ook informatie over het verwijderen van cookies van uw computer, evenals meer algemene informatie over cookies. Wij zijn niet verantwoordelijk voor de inhoud van deze websites, aangezien ze niet ons eigendom zijn en/of niet door ons worden beheerd. 4.3 Houd er rekening mee dat het beperken van cookies kan betekenen dat u niet optimaal kunt profiteren van alle functies of diensten op onze websites. 5. Cookies Die Op Onze Website Worden Gebruikt 5.1 Een lijst van eigen cookies die op onze website worden gebruikt, met gegevens over het doel van de cookies, vindt u hieronder onder Cookiegegevens. We gebruiken alleen eigen cookies die strikt noodzakelijk zijn. Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Dit zijn bijvoorbeeld cookies die u in staat stellen om in te loggen op beveiligde delen van onze websites. 6. Cookies Van Derden 6.1 We gebruiken en werken ook samen met externe leveranciers en partners die cookies op onze websites plaatsen of lezen. Hoewel we in de onderstaande tabel een overzicht geven van de cookies van derden die worden gebruikt, dient u ook het privacybeleid van de betreffende derde te controleren met behulp van de links in die tabel voor meer informatie over hoe deze cookies worden gebruikt. 6.2 De cookies van derden die voor onze websites worden gebruikt, zijn onder andere: 6.2.1 Strikt noodzakelijke cookies: Dit zijn cookies die nodig zijn voor een goede werking van onze websites. 6.2.2 Analytische cookies: We gebruiken cookies om ons te helpen informatie te verzamelen om het webverkeer naar onze websites te analyseren. De anonieme informatie die via de cookies wordt verzameld, wordt naar een extern analysebedrijf gestuurd dat wij gebruiken om de verzamelde informatie te laten analyseren en zo de prestaties van onze websites te verbeteren. 6.2.3 Commerciële cookies: We gebruiken en werken ook samen met een aantal externe leveranciers en partners die cookies op onze websites plaatsen om u gerichte reclame te laten zien. Een overzicht van de gebruikte commerciële cookies van derden vindt u in de onderstaande tabel. Als u meer informatie wilt over de cookies die door deze organisaties worden gebruikt of als u toegang wilt krijgen tot een tool waarmee u ze kunt uitschakelen, ga dan naar de site Your Online Choices op http://www.youronlinechoices.com/uk/your-ad-choices of klik op het AdChoices-logo dat u ziet in de hoek van advertenties die gedragsgerichte cookies bevatten. 6.3 Een lijst van de cookies van derden die voor onze websites worden gebruikt, vindt u hieronder onder Cookiegegevens. 7. E-Mailtracker 7.1 Sommige van de e-mails die we u sturen, kunnen een ‘web beacon pixel’ (doorzichtige GIF’s) of trackinglinks bevatten waarmee we kunnen zien wanneer u de e-mail hebt geopend en op welke links in de e-mail u hebt geklikt. We gebruiken deze informatie om te bepalen welke delen van onze e-mails voor u het meest interessant zijn. 7.2 U kunt de pixel verwijderen door de e-mail te verwijderen. Als u de pixel niet naar uw computer of ander apparaat wilt downloaden, kunt u uw instellingen wijzigen zodat u e-mails van ons in platte tekst opent in plaats van HTML. 7.3 U kunt zich ook afmelden van onze mailinglijst door te klikken op de afmeldknop aan het einde van de e-mail of door contact met ons op te nemen via DPM@globalswitch.com. 8. Wijzigingen 8.1 Dit beleid is voor het laatst bijgewerkt op 27 augustus 2020. We kunnen dit beleid op enig moment wijzigen door een exemplaar van het aangepaste beleid op onze websites te publiceren of, als we een overzicht van uw gegevens hebben, u een e-mail daarover te sturen. Eventuele wijzigingen in de beleid worden van kracht zeven dagen na de datum van onze e-mail of de datum waarop we het aangepaste beleid op de website hebben gepubliceerd, afhankelijk van welke datum eerder valt. Wij raden u aan om regelmatig te kijken of er wijzigingen of updates van dit beleid zijn. 9. Contact 9.1 Hebt u vragen over cookies of uw privacy bij het gebruik van onze websites, neem dan contact op met onze Data Protection Manager: 9.1.1 Correspondentie kunt u richten aan Global Switch, 2nd Floor, Nova North, 11 Bressenden Place, London SW1E 5BY, UNITED KINGDOM 9.1.2 Ons e-mailadres voor vragen over gegevensbescherming is: DPM@globalswitch.com. Cookiegegevens Eigen Cookies 