description = "Ons datacenter in Silicon Alley Madrid is een van de belangrijkste poorten naar Noord- en Zuid-Amerika en andere Europese markten"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Madrid Startpagina Locaties Madrid Datacentercampus in Madrid Global Switch Madrid Campus ligt dicht bij het financiële district en het stadscentrum. Belangrijk is dat het te vinden is in 'Silicon Alley Madrid', een gebied dat bekend staat om zijn hoge concentratie van internet- en technologiebedrijven en dat de hoogste connectiviteit per hoofd van de bevolking in Spanje heeft, met een groot aantal beschikbare glasvezelnetwerken. 00/ 00/ Vlak bij het centrale zakendistrict, met een ruime keuze aan carrier- en cloudproviders Een remote access point tot DE-CIX en een aanbieders-rijk ecosysteem dat zorgt voor connectiviteit met lage latentie De grote oppervlakte van 21.922 m2 met hoogwaardige infrastructuur biedt een zeer bedrijfszekere omgeving met vooraanstaande wereldwijde en nationale merken Flexibele en schaalbare oplossingen, aangepast aan de wensen van de individuele klant Connectiviteit Nu alles tegenwoordig digitaal gaat en mensen altijd met elkaar in contact willen staan, heeft het datacenter dankzij zijn grootte en locatie weten uit te groeien tot een van de belangrijkste poorten naar Noord- en Zuid-Amerika en naar andere betrouwbare Europese markten. Het heeft de aandacht van vele klanten en partners getrokken, waaronder grote cloudproviders die in dit rijke, hyperconnected hub hun bedrijf verder willen ontwikkelen. Als DE-CIX Enabled Site biedt ons datacenter in Madrid directe toegang tot het grootste onafhankelijke interconnectie-ecosysteem ter wereld. Onze klanten profiteren van het volledige scala aan interconnectiediensten - van traditionele peeringdiensten tot interconnectiediensten op bedrijfsniveau, bijvoorbeeld DirectCLOUD met meer dan 50 clouds die rechtstreeks zijn verbonden. Infrastructuur De belangrijkste ISO-certificeringen vormen het bewijs dat wij altijd optimaal willen presteren en ons steeds verder willen verbeteren om risico's te beperken, zuinig om te gaan met energie en een duurzame bedrijfsvoering te garanderen. Het datacenter is voorzien van meerdere redundantielagen en wordt ondersteund door het uitgebreide Critical Environments Programme [programma voor kritieke omgevingen] van Global Switch. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Madrid Calle Yécora, 4, 28022 Madrid, SpainTelefoon: +34 91 312 06 00salesmadrid@globalswitch.com Downloads Technische Specificatie Madrid Technische Specificatie Madrid Technische Specificatie Madrid Locatie Het datacenter bevindt zich op 12 km afstand van het financiële district en het stadscentrum Dicht bij de belangrijkste vervoersnetwerken De internationale luchthaven Barajas is 10 minuten rijden met de auto Overzicht Gebouw Global Switch bezit de volledige eigendomsrechten Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III overtreffen 21.922 m² brutoruimte 3 datavloeren Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Gewapend-betonstructuur met betonvloeren, metalen gevelbeplating en beglazing Vloer-tot-plafondhoogte van 3,7 meter Verhoogde vloerhoogte van 800 mm Minimaal vanaf verhoogde vloer: vrije hoogte van typisch 3 meter tot onderzijde van laagste balk Met een vloerbelasting van 9 kN/m2voor technische ruimtes. 1 goederenlift (2 ton), 1 personenlift Stroom 15 kV stroomvoorziening met N+N redundantie Capaciteit netvoeding van 2 x 18 MVA (spanning) Technische (IT) stroom via statische UPS op locatie met 2N Mechanische systemen met een back-up van een stand-by generatorsysteem met N+1 redundantie Volledig gescheiden stroomverdeling naar technische ruimtes Brandstofopslag op locatie voor 24 uur werking op vollast met 24x7x365 brandstoflevering Standaard wordt 1.000 W/m² aangeboden, volledige ondersteuning voor hogere stroomdensiteit Koeling 24 MW geïnstalleerde koelvoorziening Minimaal N+1 bedrijfszekerheid op alle systemen CRAC-units beheren de temperatuur en luchtvochtigheid in technische ruimtes volgens het aanbevolen bereik van ASHRAE TC9.9-norm Overal gescheiden leidingen Koelinfrastructuur door middel van condensorwater 3 watertanks; totaal 600 m³ Beveiliging Operationeel centrum 24x7x365 bemand 24x7x365 bewaking door professionele beveiligers Terrein onder constante CCTV-bewaking, zowel binnen als buiten CCTV-records worden 31 dagen bewaard Uitgebreide inbraakdetectie met alarm naar alle ruimtes Strikte toegangscontrole volgens ISO 27001 Certificering van het National Security Scheme; Voldoet aan ENS High level Toegangscontrole met keycards Biometrische beveiliging en andere op aanvraag Fysieke toegang via mantrapdeur 24x7x365 beveiligde los- en laadruimte Connectiviteit Carrier en cloud neutraal Uitgebreid netwerk met toegang tot meerdere wereldwijde en regionale carriers en internetserviceproviders met darkfiber, wavelength, ethernet, MPLS, VPLS, IP-transit, peering, CDN, opslag, virtuele diensten (SDN), spraak- en mobiele diensten Toegang tot diverse clouddiensten via vooraanstaande aanbieders van openbare, privé en hybride clouddiensten 2 meet-me-rooms 2 gescheiden ingangspunten van gebouw Gescheiden kabelrouteringen en leidingschachten Dakruimte beschikbaar voor satelliet- en antenneapparatuur DE-CIX aanwezig Branddetectie en -Bestrijding Analoog adresseerbaar branddetectiesysteem in alle ruimtes Snel rookdetectiesysteem met aanzuiging (24x7x365 bewaakt) Droge-pijp pre-action sprinkler, gas- of nevelwatersysteem in technische ruimtes CO₂ bij transformator en elektrische ruimtes Beheer van Kritieke Omgevingen Ervaren team biedt 24x7x365 facilitair management Bewaking van omgeving (thermische condities) 24x7x365 Alle gebouwbeheersystemen (GBS) worden 24x7x365 bewaakt Omvangrijk energiemeetsysteem Internationaal erkend programma voor kritieke omgevingen Aanvullende Diensten Klantenportaal Cross-connect Klantrapportages Leveringen en opslag Ontwerp- en bouwdiensten Fitout Voorzieningen op de locatie Hand- en spandiensten op afstand Technische schoonmaak Afval verwijdering Certificeringen ISO 9001, 14001, 27001, 45001, 50001 Conform PCI DSS ENS (National Security Framework) High level compliant Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
