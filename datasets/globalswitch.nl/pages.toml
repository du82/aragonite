title = "Derek Allen | Het managementteam | Global Switch"
description = "Derek kwam in 2012 als Group Director, Operations bij Global Switch met ruim dertig jaar ervaring in de sector, waarvan de laatste 24 jaar in de datacenterbranche."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Derek Allen Startpagina Over Ons Het Managementteam Derek Allen Derek Allen Operational Engineering en Technical Services Director Derek, met meer dan 30 jaar ervaring op het gebied van datacenters, kwam in 2012 bij Global Switch als Group Director, Operations. In 2022 groeide hij door naar zijn huidige positie van Operational Engineering en Technical Services Director. Carrière Derek beschikt over uitgebreide kennis van de operatie van grootschalige datacenters. Hij introduceerde en standaardiseerde best practice operationele procedures en was verantwoordelijk voor een aantal belangrijke bouwprojecten van datacenters. Voor zijn komst naar Global Switch werkte Derek voor Cable and Wireless Worldwide als hoofd Data Centre Developement en bij UBS als Director of Data Centre Strategy. De eerste 22 jaar van zijn carrière werkte Derek bij BT waar hij ruime ervaring heeft opgedaan op het gebied van engineering en facility management. Verantwoordelijkheden bij Global Switch Bij Global Switch richt Derek zich met name op de performance en betrouwbaarheid van de installaties. Hij werkt nauw samen met de Design- en Deliveryteams bij het bepalen van de gewenste redundantie in ontwerpen van bestaande en nieuwe datacenters. Daaronder valt ook de risicobeperking voor installaties met als doel een optimale betrouwbare werking van de apparatuur gedurende de levenscyclus. Derek vertegenwoordigt Global Switch in de Data Centre Council van TechUK, dat de strategische richting bepaalt voor alle activiteiten rond datacenters in het Verenigd Koninkrijk. Ook heeft hij zitting in het beleidscomité van de European Data Centre Association, die de belangen van de Europese commerciële datacenterexploitanten vertegenwoordigt. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke