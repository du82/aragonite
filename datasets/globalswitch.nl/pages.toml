["https://globalswitch.nl/about-us/senior-management/frederick-coeuille"]
title = "Frédérick Coeuille, Het managementteam | Global Switch"
description = "Frédérick begon als Managing Director Parijs in 2021 en neemt 25 jaar ervaring in de IT, telecom en datacenter sectoren met zich mee."
