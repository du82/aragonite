full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Parijs Startpagina Locaties Parijs Datacentercampus Parijs Onze campus in Parijs bestaat uit de datacenters Oost Parijs en West Parijs en is gevestigd in Clichy, een A-locatie tussen het financiële district van de stad en een van de belangrijkste Europese zakenwijken, Paris La Défense. 00/ 00/ Met ruim 50.000 m2 een van de grootste vloeroppervlakken en hoogste energiedichtheid van Frankrijk Gevarieerd en netwerkdicht telecom-ecosysteem, ondersteund door geografisch gescheiden ingangspunten voor het gebouw Geplaatst voor connectiviteit met lage latency in de nabijheid van eindgebruikers Flexibele oplossingen, van een enkel rack tot op maat gemaakte systemen van meerdere megawatts Connectiviteit Dankzij de grote vezelcapaciteit van internationale Tier 1- en Tier 2-carriers heeft de campus van Global Switch in Parijs een gevarieerd, netwerkdicht ecosysteem van vooraanstaande internationale en Franse CAC 40-merken aan zich weten te binden. Met vijf geografisch gescheiden ingangspunten voor de gebouwen maakt het SIS (Structured Interconnect System) van het datacenter goedkope verbindingen op beide vestigingen mogelijk. Infrastructuur De campus van Global Switch in Parijs werkt volgens de standaard Tier III+ en is met de belangrijkste ISO-certificeringen voorzien van een programma van voortdurende verbetering, dat wordt ondersteund door het wereldwijd bekende Critical Environments Programme [programma voor kritieke omgevingen]. Dankzij herconfigureerbare energie- en koeltechnologie en andere energiezuinige voorzieningen kan de campus zijn klanten voordelige oplossingen bieden. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Oost Parijs / West Parijs 7-9 rue Petit, 92582 Clichy Cedex, FranceTelefoon: +33 1 55 90 04 60salesparis@globalswitch.com Downloads Technische Specificatie Oost Parijs Technische Specificatie West Parijs Technische Specificatie Oost Parijs Technische SpecificatieWest Parijs Tech