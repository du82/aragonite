["https://globalswitch.nl/about-us/board-members/ashley-muldoon"]
title = "Ashley Muldoon"
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Ashley Muldoon Startpagina Over Ons Bestuursleden Ashley Muldoon Ashley Muldoon Chief Executive Officer Ashley trad in 2020 bij Global Switch in dienst als Chief Operating Officer. Hij werd in januari 2024 aangesteld als Chief Executive Officer en trad toe tot de Raad van Bestuur. In zijn tijd als Chief Operating Officer bij Global Switch was hij verantwoordelijk voor het aansturen van de operationele prestaties van de datacentra en voor productontwikkeling. Hij gaf leiding aan de oplevering van nieuwe ontwikkelingsinitatieven en diverse energieverdichtingsprojecten binnen de bestaande portefeuille, terwijl hij ook belangrijke groeigebieden voor toekomstige uitbreiding in kaart bracht. Daarnaast hield hij toezicht op alle nieuwe investeringsmogelijkheden en marktonderzoek. Hij gaf ook leiding aan de digitale transformatiestrategie van Global Switch in alle afdelingen van het bedrijf. Ashley heeft meer dan 30 jaar ervaring in de wereld van datacentra en vastgoed, en ook internationaal leidinggegeven aan organisaties. Voordat hij bij Global Switch kwam werken, was Ashley 12 jaar CEO van een wereldwijd opererend bouwbedrijf, waar hij uiteindelijk 22 jaar werkte. Als CEO was hij daar verantwoordelijk voor het toezicht op de activiteiten in het Verenigd Koninkrijk, het Midden-Oosten en Canada. Ashley begon zijn loopbaan in Australië voordat hij in 2003 naar Londen verhuisde. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u h