["https://globalswitch.nl/locations/hong-kong-data-centre"]
title = "Datacenter Hong Kong | Global Switch"
description = "Ons datacenter in Hong Kong is voorzien van een aantal van de nieuwste voorzieningen die de branche kent en kan zodoende de best mogelijke technische oplossingen voor bedrijfszekerheid bieden"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Hong Kong Startpagina Locaties Hong Kong Datacenter Hong Kong Het datacenter van Hongkong bevindt zich op het Tseung Kwan O Industrial Estate. Het wordt ontwikkeld door Hong Kong Science & Technology Parks om Hongkong te helpen een van de belangrijkste economische centra van de wereld te blijven. 00/ 00/ Met een vloeroppervlak van 70.545 m2 aan infrastructuurdiensten van wereldklasse is dit het grootste carrier- en cloudneutrale datacenter van Hongkong Aangrenzend aan het kabellandingstation Tseung Kwan O en dicht bij de twee andere grootste landingstations van onderzeekabels en de hostinglocatie van de Hong Kong Stock Exchange Volledig assortiment colocatie-, cloud- en managed services Een schoolvoorbeeld van een ecologisch duurzaam datacenter met innovatieve ontwerpinitiatieven, dat zich richt op energiezuinigheid op de lange termijn Fase 1 is onderscheiden met de certificering LEED (Leadership in Energy and Environmental Design) Platinum. Het datacenter wil ook voldoen aan de certificering Gold volgens BEAM Plus New Build van de Hong Kong Green Building Council Een onafhankelijk geverifieerd ontwerp op jaarbasis Power Usage Effectiveness (PUE) van minder dan 1,3 over de hele faciliteit Open Compute Project Foundation gecertificeerd OCP Ready Connectiviteit Global Switch Hongkong plukt de vruchten van de uitstekende connectiviteit in de regio en biedt toegang tot diverse internationale en plaatselijke Tier 1- en Tier 2-carriers. Het datacenter biedt drie verschillende toegangspunten en twee speciale Meet Me Rooms. Maak verbinding met Azië-Pacific en de rest van de wereld via de uitgebreide ‘submarine cable networks’ die in Hong Kong landen. Infrastructuur Het datacenter is voorzien van een aantal van de nieuwste voorzieningen die de branche kent en zal zodoende de best mogelijke technische oplossingen voor bedrijfszekerheid kunnen bieden. Global Switch Hongkong biedt een stroomvoorziening van 100 MVA met volledig redundante en gescheiden verdeling naar de technische ruimtes. Bovendien biedt het datacenter dankzij een uniek verhoogd vloersysteem een uitzonderlijk hoge energiedichtheid. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Hong Kong 18 Chun Yat Street, Tseung Kwan O Industrial Estate, New Territories, Hong KongTelefoon: +852 3955 1000saleshongkong@globalswitch.com Downloads Technische Specificatie Hong Kong Brochure Hong Kong Technische Specificatie Hong Kong Technische Specificatie Hong Kong Overzicht: Locatie Het datacenter bevindt zich bij de hostinglocatie van de Hong Kong Stock Exchange en het centrale zakelijke district van Hong Kong Het plaatselijke treinstation (MTR, Mass Transit Railway) Lohas Park ligt op korte loopafstand, ook bereikbaar met taxi en bus De internationale luchthaven Chek Lap Kok is 50 minuten rijden met de auto Overzicht Gebouw Global Switch heeft een erfpachtovereenkomst met recht van verlenging Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III overtreffen 70.545 m² brutoruimte 5 gebouwen Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Betonnen structuur met metalen gevel en ramen Vloer-tot-plafondhoogte van 6 meter Verhoogde vloerhoogte van 900 mm Minimum vanaf verhoogde vloer: 3,4 m vrije hoogte tot verlaagd plafond Betonplaatbelasting van 15 kN/m² met verhoogde vloersysteembelasting van 12 kN/m² 2 goederenliften (5 ton), 8 personenliften (3 voor B12, 2 voor B3 en 3 voor B45) Datacenter Services: Stroom 132 kV stroomvoorziening met N+1 redundantie Stroomvoorziening van 100 MVA (huidige) Technische (IT) en mechanische stroom geleverd door roterende UPS-systemen met dieselgeneratoren op locatie met N+2 redundantie voor gebouwen 1-3, en door statische UPS op locatie met N+1 redundantie voor gebouwen 4-5 Technische (IT) stroomvoorziening en mechanische systemen ondersteund door een stand-by generatorsysteem met N+1 redundantie voor gebouwen 4-5 Volledig gescheiden stroomverdeling naar technische ruimtes Brandstofopslag op locatie voor 24 uur werking op vollast met 24x7x365 brandstoflevering Standaard wordt 2.000 W/m² aangeboden, volledige ondersteuning voor hogere stroomdensiteit Koeling 82 MW geïnstalleerde en geplande koelvoorziening Minimaal N+1 bedrijfszekerheid op alle systemen CRAH-units beheren de temperatuur en luchtvochtigheid in technische ruimtes binnen de aanbevolen normen van ASHRAE TC9.9 Overal gescheiden leidingen Koelinfrastructuur door middel van gekoeld water Beveiliging Operationeel centrum 24x7x365 bemand 24x7x365 bewaking door professionele beveiligers Terrein onder constante CCTV-bewaking, zowel binnen als buiten CCTV-records worden 31 dagen bewaard Uitgebreide inbraakdetectie met alarm naar alle ruimtes Inbraakdetectiesysteem terrein (PID's) Strikte toegangscontrole volgens ISO 27001 Toegangscontrole met keycards en biometrische systemen Fysieke toegang via mantrapdeur 24x7x365 beveiligde los- en laadruimte Connectiviteit Carrier en cloud neutraal Uitgebreid netwerk met toegang tot meerdere wereldwijde en regionale carriers en internetserviceproviders met darkfiber, wavelength, ethernet, MPLS, VPLS, IP-transit, peering, CDN, opslag, virtuele diensten (SDN), spraak- en mobiele diensten Toegang tot diverse clouddiensten via vooraanstaande aanbieders van openbare, privé en hybride clouddiensten 2 eigen Meet Me Rooms 3 gescheiden ingangspunten van gebouw Gescheiden kabelrouteringen en leidingschachten Dakruimte beschikbaar voor satelliet- en antenneapparatuur Branddetectie en -Bestrijding Digitaal adresseerbaar branddetectiesysteem in alle ruimtes Snel rookdetectiesysteem met aanzuiging (24x7x365 bewaakt) Gasblussysteem met inergen in technische ruimtes met droog sprinklersysteem voor extra bedrijfszekerheid Beheer van Kritieke Omgevingen Ervaren team biedt 24x7x365 facilitair management Bewaking van omgeving (thermische condities) 24x7x365 Alle gebouwbeheersystemen (GBS) worden 24x7x365 bewaakt Omvangrijke energiemeetsystemen Internationaal erkend programma voor kritieke omgevingen Aanvullende Diensten Cloud-diensten Colocatie Cross-connect Klantrapportages Gegevensopslag Leveringen en opslag Ontwerp- en bouwdiensten Distributed Denial of Service-aanval (DDoS) Service Fitout Beheerde connectiviteit Netwerkbeveiliging Hand- en spandiensten op afstand Technische schoonmaak Afval verwijdering Certificeringen ISO 9001, 14001, 27001, 45001, 50001 Conform PCI DSS Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
