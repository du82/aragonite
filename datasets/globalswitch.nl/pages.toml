["https://globalswitch.nl/about-us/senior-management/matthew-dent"]
title = "Matthew Dent | Het managementteam | Global Switch"
description = "Matthew kwam in 2018 als Chief Commercial Officer bij Global Switch. Hij bracht ruim vijftien jaar aan ervaring in het hogere management in de datacenterbrance mee."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Matthew Dent Startpagina Over Ons Het Managementteam Matthew Dent Matthew Dent Chief Commercial Officer Matthew kwam in 2018 als Chief Commercial Officer bij Global Switch. Hij bracht ruim vijftien jaar aan ervaring in het hogere management in de datacenterbrance mee. Carrière De afgelopen 12 jaar was Matthew werkzaam als Managing Director van Glebe, een vastgoedfonds en vermogensbeheerder in het Verenigd Koninkrijk. Ook was hij CEO van een datacenter voor de retailbranche in het centrum van Londen, dat hij als onderdeel van de investeringsportefeuille van Glebe oprichtte en ontwikkelde. Matthew werkte ook van 2001 tot 2006 al voor Global Switch. Matthew is lid van het Royal Institution of Chartered Surveyors. Hij behaalde een BSc (Hons) in Urban Estate Management (stedelijk onroerendgoedbeheer) aan de Universiteit van Westminster en een MSc in Property Investment (vastgoedbelegging) aan de City University Business School. Verantwoordelijkheden bij Global Switch In zijn rol van Chief Commercial Officer richt Matthew zich met name op het verhogen van de omzet in Europa en Azië-Pacific, het vergroten van het rendement op investeringen en het ontwikkelen van strategieën voor het leveren van een vooraanstaand merk en commerciële prestaties. Zijn belangrijkste verantwoordelijkheidsgebieden zijn de Commercial, Marketing & Communications en Strategic Accounts & Networks teams. Met zijn brede kennis op het gebied van strategisch investeringsbeheer, waardering, ontwikkeling van vastgoed en datacenters, marketing en financiën is hij in staat bedrijfsplannen op een lijn te brengen en ons marktaandeel te verhogen. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische co