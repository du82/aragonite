title = "Martin Miklosko"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Martin Miklosko Startpagina Over Ons Het Managementteam Martin Miklosko Martin Miklosko Group Director, Commercial Martin trad in 2020 in dienst bij Global Switch als Commercial Director, Europe met meer dan 15 jaar ervaring in vastgoed waardering en investering, en werd in 2021 gepromoveerd tot Group Director, Commercial. Carrière Martin heeft uitgebreide ervaring in vastgoed waardering en advies en is een erkend expert op het gebied van de waardering van datacenters als vastgoed belegging categorie. Voordat hij bij Global Switch kwam, heeft hij CBRE's specialistische datacenter waardering team opgericht en met succes uitgebouwd, het eerste in zijn soort in de branche, en leidde hij vervolgens ook JLL's EMEA datacenter waardering functie. Tijdens zijn tijd als datacenter taxateur adviseerde hij diverse operators (waaronder Global Switch), investeerders en financiers over zaken als acquisities, financiële rapportage, financiering en investeringen, evenals beursnotering en desinvesteringen. Tijdens Martins carrière gaf hij ook leiding aan het taxatieteam van City Office bij CBRE en het grensoverschrijdende taxatieteam bij Colliers. Martin heeft een BA (Hons) in Geografie van de Universiteit van Durham en is lid van de Royal Institution of Chartered Surveyors. Verantwoordelijkheden bij Global Switch Martin leidt het commerciële team dat verantwoordelijk is voor de analyse en acceptatie die alle inkomsten genererende activiteiten ondersteunt, samen met het verwerken van bijbehorende goedkeuringen. Dit omvat klant gerelateerde activiteiten zoals nieuwe contracten, verlengingen en contract herstructureringen; en strategische kapitaal projecten zoals site acquisities, nieuwe ontwikkelingen en de herontwikkeling van bestaande datacenters. Zijn andere verantwoordelijkheden omvatten het verzamelen en analyseren van de prestatie gegevens van Global Switch met betrekking tot verkoop en inkomsten, de productie van periodieke KPI's en het beantwoorden van vragen met betrekking tot commerciële prestaties van een breed scala aan belanghebbenden. Hij is ook verantwoordelijk voor het beheer en de uitvoering van de waardering van vastgoed beleggingen van de Group. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
