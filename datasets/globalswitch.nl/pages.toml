title = "Eoghainn Calder | Het managementteam | Global Switch"
description = "Eoghainn trad in 2020 aan bij Global Switch als Chief Legal Officer en heeft meer dan 25 jaar ervaring in de juridische sector."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Eoghainn Calder Startpagina Over Ons Het Managementteam Eoghainn Calder Eoghainn Calder Chief Legal Officer Eoghainn trad in 2020 aan bij Global Switch als Chief Legal Officer en heeft meer dan 25 jaar ervaring in de juridische sector. Carrière Voordat hij bij Global Switch aantrad, werkte Eoghainn als Managing Director op de juridische afdeling van Goldman Sachs in Londen, waar hij verantwoordelijk was voor de divisie EMEA Investment Banking. Eoghainn heeft veel ervaring in juridisch risicotoezicht en beheer; de uitvoering van aandelen- en schuldkapitaalmarkttransacties, waaronder beursintroducties, herplaatsingen, claimemissies, geaccumuleerde pensioenrechten en bloktransacties, onderhandse plaatsingen voor beursintroducties, obligaties en grensoverschrijdende fusies en overnames. Eerder liep hij stage en werkte hij bij Linklaters, een wereldwijd opererend advocatenkantoor, op de kantoren in Londen, New York en Sao Paulo. Eoghainn heeft een Master in Spaans van Edinburgh University en behaalde zijn rechtenbul aan het Lancaster Gate College of Law. Verantwoordelijkheden bij Global Switch In zijn rol als Chief Legal Officer speelt Eoghainn een belangrijke rol in taken die verband houden met de groei en uitbreiding van het bedrijf. Hij adviseert de Raad van Bestuur en het senior management over belangrijke juridische en regelgevingskwesties in Europa en Azië-Pacific en vervult de taken van de bedrijfssecretaris, waarbij hij zorgdraagt voor een efficiënte zakelijke administratie, in het bijzonder met betrekking tot compliance en governance. Eoghainn is ook lid van het Executive Committee. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cooki