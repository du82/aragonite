["https://globalswitch.nl/data-centres/resilient-infrastructure"]
title = "Infrastructuur van datacenters | Global Switch"
description = "Onze gehele kritieke infrastructuur wordt beheerd en gecontroleerd met behulp van zeer verfijnde gebouwenbeheersystemen. Zo bieden we u 24x7x365 zekerheid"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Redundante Infrastructuur Startpagina Datacentres Redundante Infrastructuur Infrastructuur van Datacenters Alles wat wij bij Global Switch doen, is gebaseerd op de meest geavanceerde, robuuste infrastructuur die onze branche kent. Onze datacenters werken volgens de standaard Tier III+ en we investeren voortdurend in oplossingen die nog meer redundantie bieden en nog energiezuiniger zijn. Onze gehele kritieke infrastructuur wordt beheerd en gecontroleerd met behulp van zeer verfijnde gebouwenbeheersystemen waardoor ons facilitair managementteam ter plekke alle belangrijke componenten nauwkeurig kan bekijken - van stroom en koeling tot beveiliging en toegang. Deze systemen worden ondersteund door 24x7x365 beveiliging op locatie en door onze mechanische en elektrische ondersteuningsteams. 00/ 00/ Stroom Wij kopen stroom op het hoogst mogelijke voltage in bij het plaatselijke energiebedrijf. De locatie is bovendien uitgerust met noodstroomvoorzieningen. Onze systemen zijn ontworpen om robuuste bedrijfszekerheid te waarborgen met 'constante' IT-stroom en zijn voorzien van apparatuur die wordt beveiligd met UPS-systemen ('Uninterruptible Power Supply') (zowel statisch als op diesel). Wij investeren continu in onze stroominfrastructuur, en onze nieuwe ontwikkelingen zijn over het algemeen voorzien van twee eenheden die werken op basis van redundantie. De elektriciteitskosten worden doorberekend op basis van verbruik. Koeling Onze vooraanstaande koelsystemen zijn gebouwd met een grote redundantie en energiezuinigheid, waarbij in principe wordt uitgegaan van N+2 redundantie. Waar mogelijk hebben we de aanbevelingen van ASHRAE met betrekking tot het verhogen van de temperatuur in de suites en het toestaan van grotere temperatuurbereiken gevolgd. Zo kunnen onze klanten veel energie besparen en dus lagere PUE’s realiseren. In al onze nieuwe ontwikkelingen wordt overal waar het klimaat dit toelaat vrije luchtkoeling geleverd, zodat het systeem zo efficiënt mogelijk kan werken. Op alle locaties werken we samen met u aan een optimale indeling van uw apparatuur, uitgebalanceerde luchtstromen en een constante temperatuur en luchtvochtigheid. Beveiliging Beveiliging heeft bij Global Switch in elke productfase de allerhoogste prioriteit, vanaf de start van een nieuwe ontwikkeling tot de voortdurende verbetering van onze bestaande datacenters, technologische ontwikkelingen en bedrijfsmatige verbeteringen. Wij willen onze klanten een ultraveilige omgeving bieden. Onze benadering is gebaseerd op de richtlijn voor de beveiliging van datacenters van het Britse Centre for the Protection of National Infrastructure (CPNI). Alarmen op de omheining, geavanceerde toegangssystemen, cameratoezicht en video-intercoms, goed opgeleid beveiligingspersoneel – wij doen alles wat we kunnen om op al onze locaties een sterke, volledige beveiligingsoplossing te garanderen. Al onze datacenters zijn 24x7x365 bemand door beveiligingspersoneel, en onze processen en procedures maken een belangrijk onderdeel uit van onze ISO 27001:2013-certificering. Bekijk beleidsverklaringen Connectiviteit Onze datacenters bieden strikt gescheiden ingangspunten voor het gebouw (maximaal acht), waarbij meerdere kokers zijn aangesloten op de externe infrastructuur van de carrier. Deze kunnen een groot aantal inkomende optische vezelkabels ondersteunen en zijn dus voorbereid op groei, nu én in de toekomst. De verschillende MMR's bieden ondersteuning voor inkomende kabels van carriers, onderzeekabel-exchanges, demarcatiepunten voor gestructureerde bekabeling en gebieden voor mobiele telefoonapparatuur. Gescheiden kabelinfrastructuur vanuit de MMRs naar alle gangen, communicatie-risers en klantsuites, met ondersteuning voor gestructureerde bekabeling en individuele vereisten van klanten. Bedrijfszekere verbindingssystemen en interconnects op elk van onze datacenters zijn essentieel voor de bedrijfscontinuïteit van klanten. Daarom zorgen wij ervoor dat alle kabelinstallaties met de best mogelijke zorg en expertise worden beheerd. Meer lezen over onze cross-connects en andere diensten waarmee we toegevoegde waarde bieden. Meer te weten komen Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
