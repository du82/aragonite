full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Privacybeleid Privacybeleid Inleiding Bij Global Switch vinden we uw privacy belangrijk en doen we ons uiterste best om uw privacy te allen tijde te beschermen. In dit beleid wordt uitgelegd wanneer en waarom we persoonlijke gegevens over personen verzamelen, hoe deze informatie wordt gebruikt, met wie we die informatie delen en welke rechten betrokkenen hebben. Dit beleid kan op enig moment worden gewijzigd, dus kijk af en toe op deze pagina om er zeker van te zijn dat u eventuele wijzigingen accepteert. Zie ook de Beleidswijzigingen hieronder. Als u ons informatie verstrekt met betrekking tot een functie of sollicitatie, onder meer via careers@globalswitch.com, is ons afzonderlijke Privacybeleid Sollicitanten van toepassing op de verwerking van uw persoonsgegevens. Wie We Zijn In het kader van de wet inzake gegevensbescherming is GlobaL SwItch Limited (aangeduid als “wij”, “onze” of “ons”) de “verwerkingsverantwoordelijke” met betrekking tot de hieronder beschreven verwerkingsactiviteiten. Een verwerkingsverantwoordelijke is een organisatie die beslist waarom en hoe uw persoonsgegevens worden verwerkt. Zie de paragraaf aan het einde van dit beleid voor onze contactgegevens en juridische informatie. Hoe Wij Uw Persoonsgegevens Verzamelen We verzamelen persoonsgegevens op de volgende manieren: Persoonsgegevens die u aan ons doorgeeft: Dit zijn gegevens over u die u aan ons doorgeeft als u: informatie verstuurt via onze websites (inclusief onze klanten- en obligatiehoudersportalen) op www.globalswitch.com, www.globalswitch.cn, www.globalswitch.de, www.globalswitch.es, www.globalswitch.fr, www.globalswitch.hk, www.globalswitch.nl, globalswitch.service-now.com/gs_portal en alle andere websites waarop dit beleid, of een link naar dit beleid, is gepubliceerd (onze “websites”); ons volgt en berichten plaatst op onze social media-pagina’s, inclusief LinkedIn en Twitter; en met ons correspondeert per telefoon, e-mail of op een andere manier via de contactgegevens die wij online publiceren. Deze gegevens worden door u geheel vrijwillig verstrekt en kunnen persoonlijke informatie bevatten. We kunnen u ook om gegevens vragen wanneer u een probleem met onze websites meldt. De informatie die u ons geeft, kan uw naam, adres, e-mailadres en telefoonnummer, de gegevens van uw vraag en andere bedrijfs- en contactgegevens bevatten, en kan ook gegevens over correspondentie en reacties op eventuele vragenlijsten bevatten. Als wij deze informatie niet ontvangen, kan het zijn dat u bepaalde delen van onze websites niet kunt gebruiken of niet effectief met ons kunt communiceren. Persoonsgegevens die we verzamelen: We kunnen automatisch de volgende gegevens verzamelen tijdens uw bezoeken aan onze websites of social media: verkeersgegevens, locatiegegevens, apparaatgegevens, weblogs en andere communicatiegegevens, en details van de bronnen die u bezoekt. We verzamelen ook automatisch technische gegevens, zoals anonieme gegevens die voor statistische doeleinden door de hostingserver worden verzameld, het internetprotocol (IP)-adres dat uw computer of apparaat gebruikt om verbinding te maken met internet, het type en de versie van de browser, de tijdzone, de typen en versies van de browserplug-ins, het besturingssysteem en het platform. Zie ons Cookiebeleid voor de website en ons Cookiebeleid voor het Klantenportaal voor meer informatie. We kunnen ook alle persoonsgegevens verzamelen die u plaatst of laat delen op sociale media van derden, inclusief tekst, afbeeldingen, video’s en links. Persoonsgegevens die we uit andere bronnen kunnen ontvangen: Wij ontvangen ook bepaalde persoonsgegevens over u uit andere bronnen (ook van buiten onze organisatie), waaronder andere bedrijven binnen onze groep, onze leveranciers, commerciële partners, onze klanten en social media. Categorieën Persoonsgegevens Die We Verwerken Wij verwerken verschillende soorten persoonsgegevens over u. Om u meer inzicht te geven in welke gegevens we over u gebruiken, hebben wij deze gegevens in de onderstaande tabel gecategoriseerd en een korte uitleg gegeven over het soort gegevens in elke categorie. Categorieën persoonsgegevens Beschrijving Gedragsgericht Uw activiteiten, acties en gedrag. Contact Informatie die kan worden gebruikt om een bericht aan u te adresseren, te verzenden of anderszins te communiceren. Correspondentie Informatie in onze correspondentie of andere communicatie met u of uw collega’s op het werk. Identiteit Informatie in een formeel identificatiedocument of een ander uniek referentienummer dat naar u verwijst, met inbegrip van de identificatiecookies. Juridisch Informatie met betrekking tot juridische rechtsvorderingen of claims door of tegen u of de organisatie waarvoor u werkt. Marketingvoorkeuren Uw voorkeuren met betrekking tot eventuele marketingcommunicatie die wij op enig moment versturen met betrekking tot producten of diensten waarvan wij denken dat ze voor u van belang kunnen zijn. Controle Informatie met betrekking tot het toezicht op of de controle van uw activiteiten. Hoe Wij Uw Persoonsgegevens Gebruiken De wet inzake gegevensbescherming vereist dat wij een geldige reden hebben om uw persoonsgegevens te verwerken voor elk van de verschillende doeleinden waarvoor wij die gegevens gebruiken. De wet verwijst naar elke reden als een ‘wettelijke grondslag’. De doeleinden waarvoor wij uw persoonsgegevens gebruiken en de wettelijke grondslag krachtens de wet inzake gegevensbescherming waarop wij ons baseren, worden hieronder toegelicht. Wanneer u toestemming hebt gegeven Wij kunnen uw persoonsgegevens gebruiken en verwerken als u daarvoor toestemming hebt gegeven. Als u werkt voor een bedrijf zonder rechtspersoonlijkheid (bijv. een eenmanszaak of een partnerschap zonder rechtspersoonlijkheid), nemen wij via e-mail contact met u op om marketinginformatie te delen over onze producten en diensten als u zich inschrijft voor het ontvangen van onze marketingmails door het betreffende vakje aan te vinken of als u uw marketingvoorkeuren ververst wanneer u reageert op een verzoek van ons om dit te doen en aangeeft dat u marketingmails van ons wilt blijven ontvangen. Als u akkoord gaat met ons gebruik van niet-essentiële cookies, zullen we de cookies zoals beschreven in ons Cookiebeleid gebruiken om gedrags- en identiteitsgegevens van u te verzamelen. U kunt uw toestemming voor het gebruik van uw gegevens op een van deze manieren te allen tijde intrekken. Zie Uw toestemming intrekken voor meer informatie. Wanneer verwerking noodzakelijk is voor onze legitieme belangen Wij kunnen uw persoonsgegevens gebruiken en verwerken wanneer het voor ons noodzakelijk is om onze legitieme belangen als bedrijf te behartigen, en wel voor de volgende doeleinden: Verwerking die nodig is voor de promotie van ons bedrijf en onze producten en diensten Om een profiel van u te creëren en te analyseren om inzicht te krijgen in trends in de markt of de branche, in het gedrag van klanten waar we onze marketingstrategie op baseren en om uw ervaring als bezoeker te verbeteren en te personaliseren (evenals de marketinginformatie die we u toesturen op de manieren die in de onderstaande paragraaf worden beschreven); Als u voor een bedrijf werkt, om contact met u op te nemen via e-mail, post of telefoon met marketinginformatie over onze producten en diensten. Wij kunnen uw persoonsgegevens gebruiken om de marketingcommunicatie die u ontvangt te personaliseren, zodat deze relevant is voor u of voor de organisatie waarvoor u werkt; Als u voor een bedrijf zonder rechtspersoonlijkheid werkt, om contact met u op te nemen per post of per telefoon met marketinginformatie over onze producten en diensten. Wij kunnen uw persoonsgegevens gebruiken om de marketingcommunicatie die u ontvangt te personaliseren, zodat deze relevant is voor u of voor de organisatie waarvoor u werkt; Verwerking die nodig is om bestaande en toekomstige klanten te ondersteunen bij sales-gerelateerde en andere vragen Om met u te corresponderen en te communiceren over onze producten of diensten of om uw vragen over deze producten of diensten te beantwoorden; Verwerking die nodig is om in te spelen op de veranderende marktomstandigheden en de behoeften van onze klanten Voor marktonderzoek om de producten en diensten die wij en andere bedrijven van onze groep leveren te verbeteren; Om u te informeren over veranderingen binnen ons bedrijf en onze producten en diensten Verwerking die nodig is om de administratieve en technische aspecten van ons bedrijf efficiënt en effectief te laten functioneren Voor het beheer van onze websites en onze social media en voor onze interne activiteiten, inclusief probleemoplossing, testen en statistische rapportage; Voor het opsporen en voorkomen van fraude en andere criminele activiteiten; Om de juistheid van de informatie die we over u hebben te verifiëren en meer inzicht te krijgen in u als bezoeker van onze websites; Om uw identiteit te verifiëren en u toegang te geven tot de beveiligde delen van onze websites; Voor netwerk- en informatiebeveiligingsdoeleinden, zodat wij stappen kunnen nemen om uw en onze informatie en eigendommen te beschermen tegen verlies of schade, diefstal of ongeoorloofde toegang. Om te voldoen aan een verzoek van uw kant om uw rechten te kunnen uitoefenen (bijvoorbeeld als u wilt dat we geen contact meer met u op te nemen voor marketingdoeleinden, zullen wij dit op onze suppressielijsten bijhouden om aan uw verzoek te kunnen voldoen); Met het oog op een herstructurering of reorganisatie van ons bedrijf of de verkoop van onze activiteiten of activa; Om onze databases en systemen efficiënter en nauwkeuriger te laten werken of verbeteren, bijvoorbeeld door het combineren van systemen of het consolideren van gegevens die wij of andere bedrijven in onze groep over u hebben; Om cookies te plaatsen en te lezen die essentieel zijn voor een goede werking van onze websites, zoals beschreven in ons Cookiebeleid; Om onze contractuele of andere wettelijke rechten af te dwingen of te beschermen of om rechtsvorderingen in te stellen of verweer te voeren; Voor algemene administratieve doeleinden, inclusief financiële planning, controle en rapportage en het beheer van uw vragen, klachten of claims, om serviceberichten te versturen en om u te voorzien van belangrijke informatie over onze organisatie. Wanneer noodzakelijk om te voldoen aan onze wettelijke verplichtingen We gebruiken uw persoonsgegevens om te voldoen aan onze wettelijke verplichtingen: Om overheidsinstanties of bij te staan of strafrechtelijk onderzoek mogelijk te maken wanneer wij daartoe wettelijk verplicht zijn; Om u te identificeren als u contact met ons opneemt; Om de juistheid van de gegevens die we over u hebben te verifiëren; en Om te reageren op uw klachten over onze diensten en deze op te lossen. Anderen Die Uw Persoonsgegevens Kunnen Ontvangen Of Er Toegang Toe Hebben Andere bedrijven binnen onze groep Wij kunnen uw persoonsgegevens delen met andere bedrijven binnen onze groep. Zij kunnen uw persoonsgegevens gebruiken op de manieren die zijn uiteengezet in Hoe wij uw persoonsgegevens gebruiken, in verband met de diensten die zij leveren, inclusief waar deze een aanvulling vormen op ons eigen aanbod van diensten. Zie artikel 10.2 van onze Gebruiksvoorwaarden voor de gegevens van onze groepsmaatschappijen waarmee wij uw persoonsgegevens kunnen delen, inclusief hun locaties. Onze leveranciers, dienstverleners en andere ontvangers Wij kunnen uw gegevens delen met onze externe dienstverleners, agenten, onderaannemers en andere organisaties (zoals hieronder vermeld) die diensten aan ons leveren of namens ons rechtstreeks aan u leveren. Ontvanger/relatie tot ons Sector and (sub-sector) Reclame- en pr-bureaus Media (reclame) Aanbieders van opslagen in de cloud IT (clouddiensten) Aanbieders van verzekeringen Verzekeringen (makelaars/verzekeraars/experts) Juridische adviseurs Professionele diensten (juridische diensten) Marktonderzoek en aanbieders van analytische diensten Media (research en analyse) Online e-mailmarketing, campagnebeheer en platformdiensten voor klantenrelatiebeheer IT (clouddiensten) Wanneer we gebruikmaken van externe dienstverleners, delen we alleen die persoonsgegevens die nodig zijn voor het leveren van hun dienst en hebben we een contract dat hen verplicht om uw gegevens veilig te bewaren en niet te gebruiken anders dan in overeenstemming met onze specifieke instructies. Wanneer wij uw persoonsgegevens aan derden verstrekken die verwerkingsverantwoordelijke zijn van die gegevens, kunnen zij deze delen met of doorgeven aan andere organisaties in overeenstemming met hun beleid inzake gegevensbescherming. Dit heeft geen invloed op de rechten van u als betrokkene, zoals hieronder uiteengezet. In het bijzonder wanneer u ons vraagt om uw persoonsgegevens te corrigeren, te verwijderen of de verwerking ervan te beperken, nemen we maatregelen om ervoor te zorgen dat dit verzoek aan derden wordt doorgegeven aan wie wij uw persoonsgegevens hebben verstrekt. Andere manieren waarop we uw persoonsgegevens kunnen delen Wij kunnen uw persoonsg'
