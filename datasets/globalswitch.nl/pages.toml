["https://globalswitch.nl/data-centres/sustainability"]
title = "Energiezuinige datacenters | Global Switch"
description = "Dankzij het formaat van onze vestigingen kunnen we profiteren van schaalvoordeel en de bijbehorende energiebesparingen en lagere totale huisvestingskosten"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Duurzaamheid Startpagina Datacentres Duurzaamheid Energie Efficiente Datacenters Bij Global Switch beoordelen we de impact die onze ontwikkelingen zullen hebben op het milieu vanaf het begin en in samenwerking met onze internationale consultant teams zorgen we ervoor dat duurzaamheid een belangrijk onderdeel van het ontwerp is. Fundamenteel voor onze strategie is het exploiteren van onze datacenters om ervoor te zorgen dat we onze carbon footprint in onze wereldwijde portfolio blijven verkleinen. Alle datacenters zijn ISO 14001 (Environmental Management) en ISO 50001 (Energy Management) gecertificeerd Om onze inzet op het gebied van duurzaamheid te benadrukken, hebben alle nieuwe Europese projecten een ‘Very Good’ BREEAM classificatie als doel. Voor alle Azië-Pacific projecten is dat een minimum LEED ‘Gold’ classificatie, alsook andere ‘groene’ certificeringen Voortdurend investeren in infrastructuur om de energie efficiëntie nog meer te verbeteren Global Switch heeft zich gecommitteerd om CO₂-neutraal opereren te bereiken binnen haar portfolio middels aankoop van 100% hernieuwbare energie tegen 2030 Global Switch Hong Kong fase 1: LEED Platinum Lees persbericht Singapore Woodlands:PUE Validatie Certificering Lees persbericht Door enkele van 's werelds grootste carrier- en cloud neutrale datacenters te exploiteren profiteren we van schaalvoordelen door het implementeren van gecentraliseerde, en waar mogelijk geschaalde, systemen, wat resulteert in: Substantieel lager energie efficientie door al onze De laagste Power Usage Effectiveness (PUE) op onze locaties Onafhankelijke validatie van onze PUE Lagere totale bezettingskosten voor onze klanten Zie voor meer informatie over onze duurzaamheidsdoelstellingen: Environment, Social and Governance Report 2023 TCFD Report 2023 Als onderdeel van onze voortdurende inzet voor duurzaamheid, hebben we in september 2020 onze eerste Green Bond uitgegeven. De opbrengst van de ‘Green Bond’ van €700 miljoen van Global Switch, die vervalt op 7 oktober 2030, helpt bij de financiering van projecten van in aanmerking komende groene projecten om de energie-efficiëntie van onze datacenters te maximaliseren en onze carbon footprint te verkleinen, in lijn met onze bedrijfsdoelstellingen en duurzaamheidsdoelen. Meer informatie over onze uitgifte van groene obligaties Green Bond Framework De mening van een onafhankelijke partij Toewijzingsrapport Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
