Group Director, Information Dave kwam in 2021 bij Global Switch als Group Director, Information, met meer dan 20 jaar ervaring in de sector en een bewezen staat van dienst in het uitvoeren van transformatie programma's op onderneming niveau en het managen van wereldwijde operaties. Carrière Dave zijn meest recente functie voordat hij bij Global Switch kwam, was Chief Information Officer voor EMEA bij VMware, een groot Amerikaans cloud computing en virtualisatie technologie bedrijf, waar hij verantwoordelijk was voor de IT-levering in meer dan 40 landen. Daarvoor was Dave CIO voor Corporate Functions, Research and Development voor het VK en Iereland bij Unilever, waar hij de algehele verantwoordelijkheid had voor de levering van IT. Hij bekleedde ook andere functies bij het bedrijf, waaronder Global Digital Services Director, waar hij de Unilever digitale portfolio transformeerde, evenals Global Head of IT Audit en Program Director, waar hij de Britse en Ierse bedrijven samen bracht en de verhuizing leidde naar één nieuw Hoofd Kantoor. Verantwoordelijkheden bij Global Switch Dave is verantwoordelijk voor de levering van alle wereldwijde informatie en technologie activiteiten bij Global Switch en voor onze digitale strategie. Hij werkt nauw samen met verschillende belanghebbenden in het hele bedrijf om de bedrijfsbrede geïntegreerde informatie beheersystemen te onderhouden en continu te verbeteren om de bedrijfsnormen, processen, procedures en certificeringen te ondersteunen. De kern hiervan is het aansturen van onze krachtige business intelligence agenda om de strategie te ondersteunen en kansen te ontdekken in de hele Group. Hij houdt ook toezicht op de informatie- en cyberbeveiliging van Global Switch en zorgt ervoor dat de beveiliging van onze systemen en gegevens voorop blijft staan. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en