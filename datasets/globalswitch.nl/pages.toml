full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Jon Arnold Startpagina Over Ons Het Managementteam Jon Arnold Jon Arnold Executive Group Director, Sales and Strategic Accounts Jon trad in 2022 in dienst bij Global Switch als Group Director, Strategic Accounts and Networks met meer dan 25 jaar ervaring in het leiden van multinationale teams om de verkoop en inkomsten in de datacenter en managed services industrie te stimuleren. Carrière Voordat hij bij Global Switch kwam, was Jon Managing Director van een datacenter in Londen, waar hij het merk oprichtte, het bedrijf liet groeien en de verkoop aan een private equity-fonds in 2022 met succes afrondde. Daarvoor was hij Enterprise Sales Director voor Daisy Group, het Britse grootste onafhankelijke telecom- en cloudbedrijf, en daarvoor was hij Sales Director National Accounts voor Azzurri (nu onderdeel van Maintel), een ander onafhankelijk telecombedrijf in het VK, dat unified communications voor zijn klanten levert, waar hij consequent verbeterde groei en klant tevredenheid leverde. Jon heeft een BEng (Hons) Engineering met Business Studies van Sheffield Hallam University. Verantwoordelijkheden bij Global Switch Jon is verantwoordelijk voor het team Strategic Accounts and Networks. Zijn belangrijkste focus is het vergroten van de omzet van belangrijke klanten door ervoor te zorgen dat ze op de hoogte zijn van al onze locaties (zowel bestaande als geplande), onze producten en diensten, evenals het positioneren van ons aanbod om aan hun specifieke behoeften te voldoen. Hij is ook verantwoordelijk voor de netwerk en connectiviteit strategie van Global Switch, inclusief zowel de fysieke infrastructuur als de commerciële aanpak op groepsniveau. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werk