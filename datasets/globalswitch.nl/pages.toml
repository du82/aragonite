title = "Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel | Global Switch"
description = "Verklaring aangaande de voorkoming van slavernij en mensenhandel"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Global Switch – Verklaring aangaande de voorkoming van slavernij en mensenhandel Global Switch is een toonaangevende eigenaar, exploitant en ontwikkelaar van grote, carrier- en cloudneutrale, multi-tenant datacenters in Europa en Azië‐Pacific. Waar we voor Staan Wij van Global Switch willen er zeker van zijn dat de in de Modern Slavery Act, de Britse wet die moderne slavernij moet tegengaan (verder aangeduid als 'de Wet'), uiteengezette normen in onze Group en de gehele toeleveringsketen worden nageleefd en dat slavernij, onderwerping, dwangarbeid en mensenhandel in welke vorm dan ook worden voorkomen. Deze verklaring bevat een overzicht van onze aanpak en de maatregelen die we in het boekjaar 2018 hebben genomen om naleving van de Wet te verzekeren. Wie we Zijn en Wat we Doen Global Switch biedt vanuit grote faciliteiten in wereldwijde financiële centra haar klanten technische ruimte met 24x7x365 bedrijfszekere stroom en koeling, beveiliging en bewaking van de infrastructuur en de omgeving om hun servers, netwerkapparatuur en overige IT-infrastructuur te huisvesten. Het overgrote merendeel van onze medewerkers houdt zich bezig met het beheer van onze datacenters, het ondersteunen van onze klanten en het exploiteren van onze technische faciliteiten. Wij hebben zelf geen productiefaciliteiten of bouwbedrijven in eigendom. Ons Werk Binnen ons werk hanteren we een strak beleid ten aanzien van het voorkomen van moderne slavernij en mensenhandel in welke vorm dan ook. Om ervoor te zorgen dat dit beleid door alle medewerkers van Global Switch wordt nageleefd, zetten we ons interne beleid in en hanteren we in alle onderdelen van onze onderneming een wervingsbeleid dat wordt bewaakt door onze centrale afdeling Human Resources. Deze afdeling zorgt ervoor dat we in onze werving de Wet naleven en legt hierover verantwoording af bij het Bestuur van de Group. Via interne trainingen zorgen we ervoor dat onze mensen hun verplichtingen in het kader van de Wet kennen en naleven. Onze Toeleveringsketen Onze toeleveringsketen bestaat primair uit leveranciers in binnen- en buitenland in branches als de productie van apparatuur en bouwtechniek, zowel voor onze bestaande datacenters als nieuwe ontwikkelingen. Ook werken we met aanbieders van consultancydiensten ter ondersteuning van de dagelijkse werkzaamheden op het gebied van facilitair management, IT, bedrijfsvoering, verkoop, marketing en juridische, financiële en personeelszaken. Wij beschouwen het risico op problemen in het kader van de Wet binnen onze toeleveringsketen als klein. Onze apparatuurfabrikanten maken gespecialiseerde en technisch complexe producten waarvoor gekwalificeerde arbeidskrachten nodig zijn, die over het algemeen minder vatbaar zijn voor uitbuiting. Bovendien vinden onze bouwwerkzaamheden plaats in landen waar goede bescherming bestaat tegen slavernij, mensenhandel en de algehele uitbuiting van mensen. Toch hebben we in ons aankooptraject uitgebreide due diligence-processen en -procedures ingebouwd om er zeker van te zijn dat we de in de Wet uiteengezette normen altijd naleven. Daarom staan er in onze standaardovereenkomsten voor de diverse goederen en diensten die wij inkopen contractvoorwaarden die onze leveranciers verplichten zich te houden aan de vereisten van de Wet en ons beleid ten aanzien van het voorkomen van slavernij en mensenhandel. In de loop van 2018 zijn we begonnen met een nieuwe beoordeling van onze toeleveringsketen om te zien of deze misschien elementen bevat die risicovoller zijn dan we eerder hadden bepaald en of een fysieke controle hierop wellicht nodig is. Deze beoordeling loopt nog en wordt in 2019 afgerond. Op alle gebieden waar onze risicobeoordeling aangeeft dat een fysieke inspectie aan te bevelen is, zullen we deze daadwerkelijk uitvoeren. Global Switch onderschrijft en ondersteunt de doelstelling van het elimineren van alle vormen van moderne slavernij en mensenhandel, en zal teneinde deze doelstelling te behalen haar toeleveringsketen blijven bewaken en voortdurend blijven proberen de processen en werkzaamheden ervan verder te verbeteren. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
