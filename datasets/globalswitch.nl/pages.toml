full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Maurice Thijssen Startpagina Over Ons Het Managementteam Maurice Thijssen Maurice Thijssen Group Director, Sales Maurice trad in 2005 in dienst bij Global Switch als accountmanager, en begon in 2024 in zijn huidige functie van Group Director, Sales. Carrière Nadat Maurice in 2005 bij Global Switch Amsterdam kwam werken, werd hij in 2010 bevorderd tot salesmanager Amsterdam en in 2014 tot regionaal salesdirecteur Europa. Tijdens zijn tijd bij Global Switch heeft Maurice altijd een integrale rol gespeeld bij de groei van de Europese datacenterportefeuille en heeft hij zich ontwikkeld tot deskundige op het gebied van de datacentermarkt met veel kennis van de veranderende behoeften van klanten. Hij heeft namens Global Switch talloze multi-megawatt-deals gesloten voor hyperscalers en mondiale ondernemingen in Europa. Voordat hij bij Global Switch kwam werken, bekleedde Maurice diverse salesfuncties bij Stork Technical Services, een kennisgebaseerd bedrijf dat diensten levert op het gebied van integriteitsbeheer aan bedrijven in de chemische, olie- en gas-, energie- en andere grote industrieën. Verantwoordelijkheden bij Global Switch De belangrijkste focus van Maurice ligt op het coördineren van en leiding geven aan een zeer ervaren en technisch deskundig salesteam dat zich richt op de verkoop van capaciteit voor grootschalige implementaties in de huidige en toekomstige datacenterportefeuille van Global Switch, om de onderneming verder te laten groeien. Het team houdt zich voornamelijk bezig met AI en High Performance Compute implementaties, en heeft ook oog voor de groeibehoeften van hyperscale, grote ondernemingen, providers van cloud- en managed services die hun bedrijfskritische infrastructuur willen onderbrengen in datacentra van Global Switch vanwege hun centrale ligging en hoge vermogensdichtheid met optionele vloeistofkoeling en flexibele ontwerpbenaderingen, waar zij kunnen profiteren van een zeer robuuste gecentraliseerde infrastructuur en een uitstekende connectiviteit. Maurice is ook verantwoordelijk voor het beheer van de relaties van Global Switch met internationale instanties en zorgt ervoor dat er passende referentie overeenkomsten worden gesloten. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'
