title = "CBRE | Romonet presents industry’s first design Power Usage Effectivess validation certification To Global Switch data centre"
description = "CBRE | Romonet, the leading life-cycle analytics platform for data centres, has presented the industry’s first design Power Usage Effectiveness validation certification to Global Switch, a leading owner, operator and developer of large-scale, carrier and cloud neutral data centres in Europe and Asia-Pacific.The process independently validates that the facility design PUE of Global Switch’s Singapore Woodlands data centre is in accordance with ISO/IEC 30134-2 across all load and climate points."
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten CBRE | Romonet presents industry’s first design Power Usage Effectiveness validation certification To Global Switch data centre Startpagina Over Ons Nieuws CBRE | Romonet presents industry’s first design Power Usage Effectiveness validation certification To Global Switch data centre CBRE | Romonet presents industry’s first design Power Usage Effectiveness validation certification To Global Switch data centre Release date: 18.09.2019 Singapore, 18 September 2019 – CBRE | Romonet, the leading life-cycle analytics platform for data centres, has presented the industry’s first design Power Usage Effectiveness (PUE) validation certification to Global Switch, a leading owner, operator and developer of large-scale, carrier and cloud neutral data centres in Europe and Asia-Pacific.The process independently validates that the facility design PUE of Global Switch’s Singapore Woodlands data centre is in accordance with ISO/IEC 30134-2 across all load and climate points. Global Switch Singapore Woodlands, a new world class 25,000 sq m data centre which launched earlier in 2019, was designed to achieve an annualised PUE of no more than 1.34 @ 100% IT load, the lowest multi-tenant data centre available in this country, making it the most power efficient data centre available to customers in Singapore. This PUE compares extremely favourably to the target average PUE of 1.78 set by the National Environment Agency of Singapore. The data centre which incorporates some of the latest energy efficient technologies is targeting a Leadership in Energy and Environmental Design (LEED) Gold Rating and a Platinum BCA Green Mark. “On behalf of CBRE | Romonet and CBRE Data Centre Solutions, I’m honoured to present this achievement to one of the leading data centre owners and developers in the world,” said Zahl Limbuwala, CBRE | Romonet Executive Director. “Our team looks forward to further supporting Global Switch’s energy and sustainability priorities and helping other organisations do the same.” "We are very pleased to receive the validation results and certification for Singapore Woodlands," said Damon Reid, Group Director, Asia-Pacific at Global Switch. "We are committed to providing our customers with the most energy efficient and reliable environments and this certification proves that sustainability is a critical part of our strategy.” Matthew Winter, Group Director, Projects at Global Switch, said “using CBRE | Romonet, Global Switch can demonstrate the commitment to energy efficient data centres, and Global Switch’s customers can be confident that the declared PUE values are both accurate and validated by an independent party.” CBRE | Romonet offers the industry’s first independent validation process to measure the energy efficiency of a data centre throughout its lifetime. The program, called Validated by CBRE | Romonet, has three separate stages during the data centre lifecycle—Design, Performance Validation (IST) and Operational. In addition to the customised validation plaque, Global Switch received a detailed site performance report that was prepared by CBRE | Romonet’s team of data scientists and engineers utilizing CBRE | Romonet’s patented predictive modeling software.. CBRE | Romonet’s award-winning proprietary technology and intelligence holds four patents and has been used to model over 600 data centres within the past 10 years. In February 2019, Romonet was acquired by CBRE and integrated into the company’s global Data Centre Solutions (DCS) business line. DCS currently manages more than 800 data centres on behalf of enterprise, colocation and hyperscale clients around the world. General enquiries: For press enquiries please emailpress@globalswitch.com Notes to editors: About CBRE Group, Inc. CBRE Group, Inc. (NYSE:CBRE), a Fortune 500 and S&P 500 company headquartered in Los Angeles, is the world’s largest commercial real estate services and investment firm (based on 2018 revenue). The company has more than 90,000 employees (excluding affiliates) and serves real estate investors and occupiers through approximately 480 offices (excluding affiliates) worldwide. CBRE offers a broad range of integrated services, including facilities, transaction and project management; property management; investment management; appraisal and valuation; property leasing; strategic consulting; property sales; mortgage services and development services. Please visit our website at www.cbre.com. About Global Switch Global Switch is a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific. Founded in 1998, Global Switch has a proven business model, demonstrable track record and is the highest credit rated data centre company in the world with investment grade credit ratings from Fitch, Moody’s and Standard & Poor’s. Global Switch is a vital and strategic partner for customers that require secure and resilient data centre services with scalable capacity and a high-level customer service. The Company's focus is on highly resilient, central, low latency, network dense locations in prime city centre locations and internet hubs close to its customers on the edge of financial and business districts. Global Switch’s data centres operate exclusively in the Tier I markets of Europe and Asia-Pacific to Tier III or higher and currently total around 365,000 sq m (4,000,000 sq ft) of floor space and are occupied by a broad range of customers, global and national, large and small including government organisations, financial institutions, enterprises, global systems integrators, telecommunication carriers, cloud and managed service providers and other hosting businesses. As a business, Global Switch is committed to reducing its carbon emissions and impact on the environment and has invested heavily to champion the latest green thinking. For more information please visit www.globalswitch.com. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklari