ney Operationeel directeur (COO) Peter trad in 2024 in dienst bij Global Switch als operationeel directeur en bracht meer dan 30 jaar ervaring met zich mee in het managen van wereldwijde engineering- en technologieorganisaties, het opschalen van bedrijven, het transformeren van activiteiten en het bouwen van high-performance teams. Carrière Voordat Peter bij Global Switch kwam, werkte hij bij het opkomende technologiebedrijf Tevva Hydrogen Electric Trucks. Aanvankelijk trad Peter aan als COO, maar nadat hij een organisatorisch herontwerp had doorgevoerd, het bedrijfsmodel opnieuw vorm had gegeven en kracht had opgebouwd in functionele teams, werd hij gepromoveerd tot CEO. Daarvoor werkte Peter in verschillende leidinggevende functies binnen Ford en Jaguar Land Rover en recentelijk als Global Powertrain Operations Director van Jaguar Land Rover. Zijn verantwoordelijkheden strekten zich uit van de aandrijflijn van verbrandingsmotoren en elektrische voortstuwingssystemen, waaronder strategie, bedrijfsactiviteiten, productietechniek en levering in het Verenigd Koninkrijk, China en India. Peter heeft een BEng (Hons) in gecombineerde technologieën en micro-elektronica, en een MBA in management van de Henley Business School. Verantwoordelijkheden bij Global Switch Als operationeel directeur voor Global Switch ligt zijn focus op het aansturen van operationele prestaties en uitmuntendheid van de datacenters van Global Switch, evenals op de effectieve oplevering van de ontwikkelingen en verschillende energieverdichtingsprojecten. Peter houdt ook toezicht op alle nieuwe ontwikkelingsmogelijkheden en geeft leiding aan de IT-strategie in alle geledingen van het bedrijf. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronde