on Group Director, HR Kate kwam in 2022 bij Global Switch als Group Director, HR, met meer dan 20 jaar ervaring in meerdere sectoren. Carrière Voordat ze bij Global Switch kwam, bekleedde Kate verschillende functies binnen de sectoren detailhandel, farmaceutica, financiële dienstverlening en personeel diensten, waarbij ze op alle niveaus opereerde om belangrijke verandering programma's te stimuleren, waaronder fusies en overnames, bedrijf transformaties en turnarounds, snelle groei en reorganisaties. Kate begon haar carrière in HR bij ASDA Walmart, gevolgd door verschillende HR rollen binnen de mode industrie voor Principles, Warehouse, Oasis en Gap. Kate stapte vervolgens over naar Direct Line Insurance Group in de tijd dat ze zich los maakten van de Royal Bank of Scotland, en leidde een grootschalige organisatorische herstructurering en advies wijziging voor ongeveer 3.000 medewerkers. Hierna trad Kate toe tot Omega Pharma om de HR strategie uit te bouwen en ondersteunde ze de groei die vervolgens de acquisitie mogelijk maakte door Perrigo PLC, waar Kate de commerciële lead voor HR was en tevens de organisatorische ontwikkeling strategie leidde voor meer dan 1.000 Britse werknemers. Vervolgens stapte Kate over naar Staffing 360 Solutions, waar ze als Senior Vice President van HR de interne programma's en ontwikkeling strategie leidde en de rol van International Equity and Inclusion Officer bekleedde. Kate heeft een aantal HR en psychometrische kwalificaties behaald en is een gekwalificeerd Executive Coach. Verantwoordelijkheden bij Global Switch Bij Global Switch is Kate verantwoordelijk voor het aansturen en mogelijk maken van een progressieve employee strategie voor alle Global Switch-locaties. Ze werkt nauw samen met het Executive Committee, het senior leiderschap team en de locatie Managing Directors. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorko