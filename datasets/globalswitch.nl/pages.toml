tor Wei Guo is in juni 2020 toegetreden tot de Raad van Bestuur van Global Switch als Non-Executive Director. Dhr. Wei begon zijn carrière in 1988 bij Jiangsu Shagang Group Co., Ltd. (een Fortune 500-bedrijf en het grootste particuliere staalbedrijf in China) en gaf achtereenvolgens leiding aan de financiële afdeling van de groep, de import- en exportafdeling, de afdeling Investeringen en de afdeling Financiën, waarbij hij aanzienlijke ervaring opdeed op het gebied van frontline management. Dhr. Wei was betrokken bij alle stadia van de snelle ontwikkeling van de Shagang Group. Hij is een expert op het gebied van internationale bedrijfsvoering en leidde de commerciële contractonderhandelingen en internationale transacties ten aanzien van apparatuur die door de Shagang Group wordt geïmporteerd. Wat investeringen betreft, was hij betrokken bij alle binnenlandse en buitenlandse fusie- en overnameactiviteiten van de groep. In 2016 werd dhr. Wei benoemd tot Chief Financial Officer van Jiangsu Shagang Group Co., Ltd., waar hij verantwoordelijk was voor de boekhouding, het financieel beheer, de fiscale planning, enz. van de groep. Hij studeerde aan het Instituut voor Metallurgie Oost-China (Instituut voor Economie) en de Universiteit van Nantong (Internationale Handel) en heeft graden in de Economie en Internationaal Financieel Management. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek