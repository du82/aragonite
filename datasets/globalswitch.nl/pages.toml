title = "Markel Gruber | Het managementteam | Global Switch"
description = "Markel kwam in 2005 bij Global Switch als Managing Director voor Madrid."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Markel Gruber Startpagina Over Ons Het Managementteam Markel Gruber Markel Gruber Managing Director, Madrid Markel kwam in 2005 bij Global Switch als Managing Director voor Madrid. Carrière In de loop van zijn carrière heeft Markel bij diverse wereldwijde bedrijven veel kennis opgedaan over supercomputers in bedrijfskritieke omgevingen en kunstmatige intelligentie. Voordat hij bij Global Switch kwam, werkte Markel bij grote IT-producenten als EMC, SUN Microsystems, NCR-Teradate, UNISYS en Burroughs. Hij voltooide projecten gebaseerd op supercomputertechnologieën in bedrijfskritieke omgevingen zoals vliegtuigmaatschappijen en openbare voorzieningen en ontwikkelde grote accounts in Europa, Azië, Afrika en Zuid-Amerika. Markel heeft een bachelor in IT en een MBA van ESEM. Verantwoordelijkheden bij Global Switch Sinds zijn komst bij Global Switch Madrid heeft Markel het datacenter ontwikkeld tot een van de belangrijkste poorten naar Noord- en Zuid-Amerika en andere grote Europese markten. Het heeft de aandacht van vele klanten en partners getrokken, waaronder grote cloudproviders die in dit hyperconnected hub hun bedrijf verder willen ontwikkelen. Markel is verantwoordelijk voor de operationele omgeving en zet zich in voor voortdurende verbetering. Hij stond aan het hoofd van het team dat alle belangrijke ISO-certificeringen en ISO 50001 wist te behalen. Markel is President van ASLAN, een vereniging van aanbieders van netwerkinfrastructuren en datacenter-, internet- en telecommunicatieproviders, en geassocieerd lid van meerdere IT-raden en de Kamer van Koophandel ter bevordering van bedrijfsontwikkeling op de Spaanse markt. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websit