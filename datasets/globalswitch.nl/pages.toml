er Ciolfi Groepsdirecteur, Beveiliging Jennifer trad in september 2024 in dienst bij Global Switch en brengt meer dan 25 jaar wereldwijde beveiligingservaring mee naar haar rol als Groepsdirecteur. Carrière Gedurende haar carrière heeft Jennifer gewerkt voor enkele van de grootste technologie- en dataorganisaties ter wereld. Ze leidde teams over de hele wereld, beheerde internationale projecten en deed expertise op in alle aspecten van fysieke beveiliging. Jennifer heeft vele jaren ervaring in beveiliging en heeft bij uiteenlopende organisaties in zowel de publieke als de private sector gewerkt. Het ontwikkelen van diepgaande expertise op het gebied van de bescherming van kritieke infrastructuur en wereldwijde beveiligingsoperaties. Verantwoordelijkheden bij Global Switch De benoeming van Jenn in ons Operations-team is van cruciaal belang voor de voortdurende operationele verbetering van Global Switch. Als onze Groepsdirecteur Beveiliging werkt Jennifer nauw samen met de beveiligingsteams op locatie. Zij bepaalt de wereldwijde strategie voor fysieke beveiliging en werkt samen met teams om optimale beveiliging te leveren. Jennifer zal leiding geven aan de gezamenlijke inspanning om ervoor te zorgen dat we wereldwijd ongeëvenaarde beveiliging leveren aan onze klanten. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die 