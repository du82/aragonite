["https://globalswitch.nl/about-us/senior-management/david-doyle"]
title = "David Doyle | Het managementteam | Global Switch"
description = "David kwam in 2014 als Chief Financial Officer bij Global Switch. Hij had toen al zo'n dertig jaar aan financiële ervaring opgedaan bij diverse financiële en vastgoedbedrijven. Hij heeft een sterke staat van dienst in het leiden van strategische en operationele veranderingen binnen ondernemingen, en een ruime ervaring op kapitaalmarkten in eigen en vreemd vermogen."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten David Doyle Startpagina Over Ons Het Managementteam David Doyle David Doyle Chief Financial Officer David kwam in 2014 als Chief Financial Officer bij Global Switch. Hij had toen al zo’n dertig jaar aan financiële ervaring opgedaan bij diverse financiële en vastgoedbedrijven. Hij kreeg in 2016 zitting in het bestuur. Hij heeft een sterke staat van dienst in het leiden van strategische en operationele veranderingen binnen ondernemingen, en een ruime ervaring op kapitaalmarkten in eigen en vreemd vermogen. Carrière Voordat hij bij Global Switch kwam, was David CFO van Atrium European Real Estate. Hij was daar verantwoordelijk voor alle financiële zaken, waaronder het leiden van activiteiten op kapitaalmarkten in eigen en vreemd vermogen. David begon zijn carrière bij Arthur Andersen en nadat hij in 1990 zijn opleiding tot registeraccountant had voltooid, werd hij senior manager in het Londense team voor de financiële markten. Hij kwam in 1996 bij Prudential plc en werd vervolgens benoemd tot hoofd Corporate Finance. Naast andere projecten voerde hij daar met succes onderhandelingen over transacties van ongeveer 1 miljard pond. Nadat hij in 2003 bij Prudential was vertrokken, bekleedde David de functie van CFO in verschillende organisaties. Bij Egg plc was hij verantwoordelijk voor alle financiële, juridische en secretariële zaken binnen het bedrijf, bij Colliers CRE hield hij als voorzitter van de raad van bestuur toezicht op het overnameprogramma van de Groep en werkte hij de strategische, risico- en operationele managementprocessen bij, en bij Prologis stond hij aan het hoofd van de Europese financiële teams in tien landen, inclusief corporate accounting, planning en analyse, financiën, belastingen, vastgoed en development accounting. Verantwoordelijkheden bij Global Switch David is lid van de Executive Committee en is verantwoordelijk voor alle financiële en HR-aspecten van de onderneming, waaronder de presentatie en rapportage van financiële informatie, kapitaalmarkt transacties, overnames, het onderhouden van een efficiënte en degelijke financiële controle en het leiden van zowel de lokale financiële teams als die van de Groep, het aannemen van hoger leidinggevend personeel, werknemersbeloningen en alle aspecten van HR beleid en procedures. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'
