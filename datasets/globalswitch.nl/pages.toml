title = "Change to Board of Directors"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Change to Board of Directors Startpagina Over Ons Nieuws Change to Board of Directors Change to Board of Directors Release date: 13.02.2025 London, 13 February 2025 – Global Switch Holdings Limited ("Global Switch" or "the Company"), a leading owner, operator and developer of large-scale, carrier and cloud neutral multi-customer data centres in Europe and Asia-Pacific, today announces the following changes to its Board of Directors: Jia Yan, who joined the Board on 15 September 2023, is stepping down from her role as Non-Executive Director. Shen Bin (“Bill Shen”) has been appointed as Non-Executive Director of the Board with immediate effect. Shen Bin Shen Bin, born in September 1979, holds a master's degree and is certified as an economist. He began his career in 2001 and currently serves as Chairman of Jiangsu Shagang Group Co., Ltd. (a Fortune Global 500 company and China’s largest private steel enterprise). Mr. Shen started his professional journey in the financial sector. In 2001, he worked as a trader at Xinhua Securities’ Shanghai Branch. From 2004 to 2006, he gained extensive experience in finance and international trade while serving as an accountant at Jiangsu Guotai Group International Trade Co., Ltd. and the Orient Overseas Container Line (OOCL) Limited (Hong Kong). In 2007, he successively held key positions such as Assistant General Manager and Vice Chairman of Shagang International Trade Co., Ltd., while concurrently managing Shagang South Asia Trade Company. Between 2009 and 2011, he served as Assistant to the President of Shagang Group’s Board of Directors. Recognised for his outstanding performance and leadership, he was promoted in 2012 to Executive Director, Executive Vice President, and Chief Accountant of the Group. During this period, he also held positions as Chairman of Shagang Financial Co., Ltd. and Vice Chairman of Shagang International Trade Co., Ltd.. Shen Bin is the controller of Jiangsu Shagang Group Co., Ltd., and is therefore regarded as the Company’s ultimate controlling party. The Board and Executive Management team would like to express their sincere gratitude to Jia Yan for her valuable contribution to the Company and look forward to her continued involvement in Global Switch given her senior role at Shagang, and warmly welcome Bill Shen. We look forward to his participation and contribution as the Company continues to evolve and expand. Contact details: Media contact:David WebsterNepean+44 7739 486 590globalswitch@nepean.co.uk Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
