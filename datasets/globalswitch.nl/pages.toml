witch Amsterdam is gevestigd in de wijk Slotervaart/Overtoomseveld, direct naast de belangrijkste kabelinfrastructuur van Nederland. Deze hoogwaardige datacenter campus bevindt zich op slechts 2 km afstand van het financiële district en het stadscentrum. Computergegenereerde image Computergegenereerde image 00/ 00/ Global Switch Amsterdam is het enige echte schaalbare datacenter campus in Nederland en biedt oplossingen aan op basis van maatwerk, variërend van een enkel rack tot op maat gemaakte oplossingen voor meerdere megawatts Door de toevoeging van de 32.000 m2 van Amsterdam East wordt de totale campus 73.000 m2 Fase 1 van Amsterdam East is op dit moment in aanbouw Een uitzonderlijk netwerkdicht ecosysteem met lage latency en toegang tot diverse internationale en regionale carriers en prominente cloudproviders Toegang tot peering-platformen AMS-IX en NL-ix voor rechtstreekse toegang tot het wereldwijde IP-netwerk Connectiviteit Dankzij onze carrier- en cloudneutrale status hebben we een netwerkdichte omgeving kunnen opbouwen met ongeveer 100 carriers, cloud- en andere netwerkserviceproviders. Ons groeiende ecosysteem, de nabijheid van het centrale zakendistrict en de belangrijkste Nederlandse kabelinfrastructuur, maar ook de aanwezigheid van AMS-IX en NL-ix, maken de faciliteit een logische keuze voor elke onderneming of organisatie die op zoek is naar betrouwbare, snelle verbindingen binnen Nederland en over de hele wereld. Infrastructuur Dit datacenter is rechtstreeks aangesloten op het landelijke stroomnetwerk en biedt gemiddeld een standaard dichtheid van 2000 W/m2 met volledige ondersteuning voor hogere dichtheden. Daarnaast zijn we de enige provider in de stad met een eigen stroomvoorziening van 72MVA (huidig en in aanbouw) bij 50 kV. Met de uitbreiding op onze bestaande campus zijn we goed op weg om een nog duurzamer datacenter te worden. De doelstelling is een PUE van minder dan 1,2 en een BREEAM-beoordeling 'Very Good', met gebruik van 100% groene energie en de nieuwste technologieën, zoals vrije luchtkoeling en gescheiden koude en warme straten. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Amsterdam West / Amsterdam Oost Johan Huizingalaan 759, 1066 VH Amsterdam, NetherlandsTelefoon: +31 20 6666 300salesamsterdam@globalswitch.com Downloads Technische Specificatie Amsterdam West Technische Specificatie Amsterdam Oost Technische Specificatie Amsterdam West BrochureAmsterdam Oost Technische Specificatie Amsterdam Oost Technische Specificatie Amsterdam West Locatie Het datacenter bevindt zich op 2 km afstand van het financiële district en het stadscentrum Direct buiten de hoofdingang bevindt zich een metrostation De internationale luchthaven Schiphol is 10 minuten rijden met de auto Overzicht Gebouw Global Switch heeft een langdurige erfpachtovereenkomst met een automatisch recht van verlenging Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III overtreffen 41.061 m² brutoruimte 1 datavloer Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Gewapend-betonstructuur met betonvloeren, metalen gevelbeplating en beglazing Vloer-tot-plafondhoogte van 3,75 meter Verhoogde vloerhoogte van 750 mm Minimaal vanaf verhoogde vloer: Verhoogde vloerhoogte van 3,0 meter tot onderzijde van laagste balk Met een vloerbelasting van 10 kN/m² voor technische ruimtes 1 goederenlift (5 ton) Stroom 50 kV stroomvoorziening Capaciteit stroomvoorziening van 32 MVA (huidige) Technische (IT) stroom in hal 1 via roterende UPS-systemen met dieselgeneratoren op locatie met N+1 redundantie en in de hallen 2, 3 en 4 via statische UPS in 2N- configuratie Mechanische systemen met een back-up van een stand-by generatorsysteem voor de hallen 2, 3 en 4 met N+1 redundantie Volledig gescheiden stroomverdeling naar techn