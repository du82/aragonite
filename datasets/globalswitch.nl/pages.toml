title = "René Olde Olthof"
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten René Olde Olthof Startpagina Over Ons Het Managementteam René Olde Olthof René Olde Olthof Managing Director, Amsterdam René kwam in 2023 bij Global Switch als Managing Director, Amsterdam met ruim 22 jaar ervaring op het gebied van IT en datacenters. Carrière Voor zijn indiensttreding bij Global Switch was René Managing Director bij een Europese carrier-neutrale datacenter provider, onderdeel van de Ocom Group. Hij was onder andere verantwoordelijk voor het vinden en verwerven van grond, het onderhandelen met verschillende overheidsinstanties, het ontwerpen en ontwikkelen van datacenters en de bijbehorende installaties en het vinden en contracteren van nieuwe leveranciers. Eerder was hij werkzaam als Chief Operations Officer voor Leaseweb, een toonaangevend IaaS- en cloudprovider. René heeft veel operationele ervaring op het gebied van management en leiderschap en is goed bekend met datacentermanagement, datacenterontwerp, server en netwerk infrastructuur en projectmanagement. René heeft de Nederlandse nationaliteit en is afgestudeerd in Bedrijfskunde aan de Universiteit van Groningen. Hij spreek drie talen: Nederlands, Engels en Duits. Verantwoordelijkheden bij Global Switch René is verantwoordelijk voor zowel het commerciële als het operationele management van Global Switch Amsterdam. Daarnaast is hij verantwoordelijk voor de ontwikkeling van het veertiende datacenter van Global Switch, Amsterdam Oost, dat nog eens 32.000 m² toevoegt aan de bestaande datacentercampus. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijke