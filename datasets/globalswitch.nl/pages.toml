title = "David Doyle, Chief Financial Officer | Global Switch"
description = "David Doyle kwam in 2014 als Chief Financial Officer bij Global Switch en is sinds december 2016 lid van de Raad van Bestuur."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten David Doyle Startpagina Over Ons Bestuursleden David Doyle David Doyle Chief Financial Officer David Doyle kwam in 2014 als Chief Financial Officer bij Global Switch en is sinds december 2016 lid van de Raad van Bestuur. Voordat hij bij Global Switch kwam, was David CFO van Atrium European Real Estate Ltd. Hij gaf daar leiding aan inspanningen om een voor investeringen aantrekkelijke kredietwaardigheidscore te verkrijgen en aan de eerste uitgifte van Eurobonds door het bedrijf. David begon zijn carrière bij Arthur Andersen en nadat hij in 1990 zijn opleiding tot registeraccountant had voltooid, werd hij senior manager in het Londense team voor de financiële markten. Hij kwam in 1996 bij Prudential plc en werd vervolgens benoemd tot hoofd Corporate Finance. Naast andere projecten voerde hij daar met succes onderhandelingen over transacties van ongeveer 1 miljard pond. Nadat hij in 2003 bij Prudential was vertrokken, bekleedde David de functie van CFO bij een aantal beursgenoteerde bedrijven waaronder Prologis, waar hij aan het hoofd stond van de Europese financiële teams. David is een Fellow van Chartered Accountants in Australië en Nieuw Zeeland. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.p