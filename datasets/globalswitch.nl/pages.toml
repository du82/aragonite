description = "In onze woordenlijst vindt u de definities van diverse technische termen, afkortingen en acroniemen met betrekking tot datacenters"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Woordenlijst Startpagina Hulpbronnen Woordenlijst A-B C-D E-H I-L M-O P-R S T-Z 2N Tweemaal de capaciteit van apparatuur of systemen om de kritieke belasting te ondersteunen. 24x7x365 Werkzaamheden die 24 uur per dag, 7 dagen per week en 365 dagen per jaar worden uitgevoerd. A & B elektrische voeding Elektriciteit die vanuit verschillende bronnen en via twee afzonderlijke kabels wordt geleverd. Abnormaal Incident Hieronder worden de volgende gebeurtenissen verstaan: Een gebeurtenis die direct en onmiddellijk invloed heeft op de werking van het datacenter. Een gebeurtenis die de veiligheid in gevaar brengt van een persoon die zich op of in de omgeving van het datacenter bevindt. Een storing van een apparaat of dienst die de normale werking van het datacenter in gevaar brengt. AC-stroom Wisselstroom. AESWD 'Aspirated Early Warning Smoke Detection'; snel rookdetectiesysteem met aanzuiging. Wordt ook wel 'VESDA' genoemd, naar het handelsmerk. Amp (A) Eenheid van elektrische stroom. ANSI/TIA 942 Een Amerikaanse nationale norm die de minimumvereisten aangeeft voor de telecommunicatie-infrastructuur op datacenters en in computerruimtes, waaronder single-tenant datacenters voor bedrijven en multi-tenant datacenters met internethosting. Meer informatie vindt u op www.tiaonline.org. Anti Pass-Back Door / mantrap Een geavanceerd toegangssysteem dat voorkomt dat onbevoegden meelopen naar binnen. Argonite Een gas dat wordt gebruikt om vuur te onderdrukken en dat veilig kan worden gebruikt in gebieden waarin zich mensen bevinden. Het werkt met name door de oxidatie van brandbare materialen tegen te gaan door fysiek de hitte uit het vuur te verwijderen. As-built Een tekening van de infrastructuur van het datacenter zoals het eruitzag ten tijde van de bouw en latere aanpassingen. ASHRAE 'American Society of Heating, Refrigerating and Air Conditioning Engineers'; een internationale technische organisatie. Meer informatie vindt u op www.ashrae.org. Activacategorieën Definitieve lijst van types activa van Global Switch. ASTS 'Automatic Static Transfer Switch', automatische statische omvormer (solid state-apparaat). ATS 'Automatic Transfer Switch', automatische omvormer. Badge voor toegang onder begeleiding (SAC) Een toegang badge van Global Switch die is toegewezen aan een bezoeker die geen site inductie heeft voltooid en daarom te allen tijde moet worden begeleid door een PAC- of VAC-houder. De badge moet worden ingeleverd bij de beveiliging van Global Switch voordat de bezoeker het datacenter aan het eind van de dag verlaat. Badgelezersysteem Een computergestuurd systeem voor toegangscontrole waarbij sloten elektronisch worden bediend en pas worden geopend wanneer een geautoriseerde toegangsbadge voor een lezer is gehouden. Balometer Een luchthoeveelheidsmeter die met name wordt gebruikt om het luchtvolume in de buurt van luchtverspreiders en -roosters efficiënt rechtstreeks te meten. BCP Het bedrijfscontinuïteitsplan van Global Switch (zie ook hierna onder Bedrijfscontinuïteitsbeheer). Bedrijfscontinuïteitsbeheer (BCM: Business Continuity Management) Een alomvattend beheerproces dat potentiële schade voor een organisatie bijtijds opmerkt. Een en ander vormt een raamwerk voor een stabiele bedrijfsruimte en maakt een effectieve respons mogelijk ter bescherming van de belangen van de voornaamste investeerders, van de reputatie en merknaam van het bedrijf, en van alle activiteiten die voor het bedrijf belangrijk zijn (bron: The Business Continuity Institute). Bedrijfskritiek De operationele en/of bedrijfsondersteunende activiteiten (intern of op basis van outsourcing) die essentieel zijn voor het correct functioneren van de organisatie. Bedrijfskritieke apparatuur Alle elektrische apparatuur tussen de aankomst op de locatie en de individuele verdeelborden en stroomcircuits in de technische ruimtes van klanten, inclusief generatoren, accusysteem en UPS-systemen. Alle mechanische apparatuur die koeling biedt voor essentiële en niet-essentiële warmtebelasting binnen het datacenter, inclusief luchtbehandelingseenheden, warmtewisselaars, pompen en leidingwerk. Beschermende apparatuur, zoals brand- en rookdetectie- en blussystemen, lekdetectie, beveiligingssystemen en apparatuur voor bewaking op afstand. Besturingsapparatuur, waaronder stroombewakingssystemen, gebouwbeheersystemen en andere systemen die op welke manier dan ook zijn aangesloten op de bedrijfskritieke apparatuur voor beheers- en/of bewakingsdoeleinden. Beheerder van de Customer Portal Een vertegenwoordiger van de klant die namens zijn/haar bedrijf beheerdersrechten heeft met betrekking tot de Customer Portal. Medewerkers met dit type gebruikersaccount kunnen alle klantaanvragen indienen en andere beheerders voor het bedrijf toevoegen in de Customer Portal. Biometrische toegang Een techniek voor authenticatie van mensen op basis van fysieke kenmerken, zoals gezichtsherkenning, scannen van vingerafdrukken, retina of iris en handgeometrie. Black Building Test (BBT) Een geplande oefening waarbij de stroomvoorziening van een gebouw wordt uitgeschakeld om te controleren of de noodsystemen naar behoren werken en de kritieke belasting beschermen. Blindpaneel Een paneel dat in ongebruikte U-ruimtes in een kast (rack) wordt geplaatst. Hiermee wordt voorkomen dat frisse lucht rechtstreeks door de kast stroomt zonder de elektronica te koelen. BREEAM 'Building Research Establishment Environmental Assessment Method'; een milieunorm aan de hand waarvan de duurzaamheid van gebouwen wordt beoordeeld. Meer informatie vindt u op www.breeam.org. Carrierneutraal Een carrierneutraal datacenter is niet afhankelijk van de telecommunicatieleveranciers op de faciliteit en maakt onderlinge verbinding tussen verschillende telecommunicatiebedrijven en/of colocatie-aanbieders mogelijk. CEN Europees Comité voor Normalisatie die verantwoordelijk zijn voor de Europese Normen (EN). Het biedt een platform voor de ontwikkeling van Europese normen en andere technische documenten met betrekking tot verschillende soorten producten, materialen, diensten en processen. Meer informatie is te vinden op encenelec.eu/about-cen. CENELEC 'Comité Européen de Normalisation Electrotechnique', het Europese standaardiseringcomité voor elektrotechnische standaarden. Meer informatie vindt u op www.cenelec.eu. CFD 'Computational Fluid Dynamics' ofwel numerieke stromingsleer, een numerieke analysetechniek die veel wordt gebruikt voor het analyseren van luchtstroom op datacenters. Change Control Process (CCP) Een procedure van Global Switch voor het beperken en/of beheersen van de gevolgen van menselijke fouten tijdens onderhoud, reparatie en/of installatie van systemen en/of apparatuur in het datacenter. CHW 'Chilled Water', gekoeld water. Close Control Units (CCUs) Apparatuur voor de koeling van de technische ruimten in het gebouw. CMMS 'Computerised Maintenance Management System'. Hiermee kan Global Switch het onderhoud van haar activa binnen het datacenter beheren. Colocatie (co-lo) Plaatsing van ICT-apparatuur in een gemeenschappelijke ruimte, met een minimum van één rack. Computer Room Air Conditioner (CRAC) De randkoelapparatuur die in elke data suite is geïnstalleerd. Connectiviteit De levering van faciliteiten als kabels, apparaten en bandbreedte om spraak- en dataverbindingen te ondersteunen. Corporate Governance Het door de directie en het bestuur van een organisatie nakomen van hun juridische en procedurele verplichtingen en verantwoordelijkheden en het systeem/proces dat dit mogelijk maakt. Corrigerend onderhoud Ook wel bekend als reactief onderhoud, dit omvat: Onderhoudsdiensten die voortkomen uit een ongeplande storing of gebeurtenis met betrekking tot de activa van Global Switch. Reparaties, kleine werkzaamheden en soortgelijke niet-specialistische klusjes aan het gebouw. Dergelijk werk wordt uitgevoerd door Global Switch ter aanvulling op het geplande preventieve onderhoud. COSHH 'Control of Substances Hazardous to Health'; een wet die binnen het Verenigd Koninkrijk geldt, waaronder werknemers verantwoordelijk zijn voor het onder controle houden van stoffen die een gevaar voor de gezondheid vormen. Meer informatie vindt u op www.hse.gov.uk/coshh. Cross Connects Cross Connects zijn onderlinge verbindingen tussen gedefinieerde A en B punten van een suite of rack die directe toegang bieden tot onze uitgebreide community van carriers en cloud service providers. Customer Incident Report (CIR) Een rapport van Global Switch voor klanten die betrokken zijn bij een incident. Customer Portal Een online systeem van Global Switch waarmee klanten producten en diensten van Global Switch kunnen bestellen en hun bestellingen kunnen beheren. Daisy Chain Het aan elkaar koppelen van contactdozen van de ene elektrische aansluiting naar de andere. Dit is niet toegestaan. Datacenter Een faciliteit van Global Switch. DC-stroom Gelijkstroom DG Dieselgenerator. Disaster Recovery-locatie Een externe locatie die door een organisatie wordt opgezet om in het geval van calamiteiten de operationele bedrijfsvoering te herstellen en de activiteiten voort te zetten. Down Flow Unit (DFU) Airconditioningeenheid voor computerruimtes waarmee behandelde lucht in de tussenruimte onder de vloer wordt verspreid. Wordt ook CRAH genoemd. Driefasige voiding Een wisselstroomcircuit (AC) met drie draden. Normaal gesproken zijn er drie fasedraden (L1, L2, L3) (op een hoek van 120 graden ten opzichte van elkaar) en een nuldraad. DRUPS 'Diesel Rotary Uninterruptible Power Supply'; dynamische UPS (niet-onderbreekbare voeding) met geïntegreerde dieselmotor. Eenfasige voiding Een wisselstroomcircuit (AC) met twee draden. Normaal gesproken is er een fasedraad en een nuldraad. In de meeste landen is de standaard fasespanning 230 V. De fasedraad voert samen met de nuldraad de elektrische stroom van en naar de aangesloten apparatuur. Naast deze twee draden is er meestal ook een aarddraad, die elektrische beveiliging biedt. EMI Elektromagnetische interferentie EMS 'Energy Management System'; systeem voor energiebeheer. EOP 'Emergency Operating Procedure'; een procesdocument van Global Switch dat deel uitmaakt van het 'Programma voor kritieke omgevingen' en waarin de procedures staan beschreven die in noodgevallen of testsitutaties moeten worden gevolgd. EPO 'Emergency Power Off'; nooduitschakeling die per apparaat of per locatie wordt toegepast om de voeding naar de apparatuur onmiddellijk uit te schakelen. Dit kan door het handmatig indrukken van een EPO-knop of via een automatische systeemhandeling. Ethernet Een netwerktechnologie op pakketbasis, waarin data wordt opgedeeld in segmenten en in sets van frames wordt getransporteerd. Snelheden van 10 megabit tot 100 gigabit per seconde zijn mogelijk, en verdere ontwikkelingen liggen in de lijn der verwachting. Europese Gedragscode inzake Energie efficiëntie in Datacenters De Europese gedragscode voor datacenters is in 2008 gelanceerd om de energie efficiëntie in datacenters te verbeteren. Zie deze link voor meer informatie: https://joint-research-centre.ec.europa.eu/energy-efficiency/energy-efficiency-products/code-conduct-ict/code-conduct-energy-efficiency-data-centres_nl Evacuatie- en verzamelpunt Een verzamelpunt buiten een datacenter dat wordt gebruikt in geval van een evacuatie van een Global Switch datacenter. FM Facilitair Management en de levering van diensten van het Facilitair Management. FM200 Een gas dat wordt gebruikt om vuur te onderdrukken. Het werkt met name door de oxidatie van brandbare materialen tegen te gaan door fysiek de hitte uit het vuur te verwijderen. Front desk (ook Receptie genoemd) De 24x7x365 bemande hoofdingang van een Global Switch datacenter. Gangpad De open ruimte tussen rijen kasten. Geautoriseerd personeel Klantpersoneel dat bevoegd is om bepaalde activiteiten op het gebied van datacentermanagement aan te vragen en via de Customer Portal diensten te bestellen in datacenters van Global Switch. Gebieden met beperkte toegang Een of meerdere ruimtes binnen het datacenter waar gevoelig werk wordt uitgevoerd en waar de toegang streng beveiligd is. Gebouwenbeheersysteem (BMS: Building Management System) Een geïntegreerd computersysteem voor de bewaking en het beheer van de essentiële technische systemen en kritieke services van een gebouw. Gebruiker met aanvraagrechten Een groep gebruikers van de Customer Portal van Global Switch die van een klant van Global Switch toestemming heeft gekregen om via de Customer Portal aanvragen voor producten en diensten in te dienen. Geldige foto-identificatie Geldige vormen van identificatie bij Global Switch datacenters, zoals een paspoort of nationale identiteitskaart, rijbewijs (met foto), door de overheid uitgegeven identiteitsbewijs met foto of door de onderneming uitgegeven identiteitsbewijs met foto in combinatie met een bankpas. Gemeten vermogen Een manier om het energieverbruik te meten, om ervoor te zorgen dat de klant alleen betaalt voor de gedurende een bepaalde periode verbruikte energie. Gemeten vermogenGepland Preventief Onderhoud (GPO) Geplande onderhoudswerkzaamheden die op '''
