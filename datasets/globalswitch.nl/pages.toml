["https://globalswitch.nl/about-us/news/15-11-24-global-switch-supports-dana-storm-victims-with-charitable-donations"]
title = "Global Switch Supports Dana Storm Victims with Charitable Donations"
description = "In response to the recent Dana Storm, which devastated large areas of Spain and disrupted countless lives, Global Switch has made a significant financial contribution to assist affected communities and their recovery efforts. We are pleased to announce that these donations have been directed to two highly regarded Spanish charities, Fundación Altius and Fundación CEOE."
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Global Switch Supports Dana Storm Victims with Charitable Donations Startpagina Over Ons Nieuws Global Switch Supports Dana Storm Victims with Charitable Donations Global Switch Supports Dana Storm Victims with Charitable Donations Release date: 15.11.2024 In response to the recent Dana Storm, which devastated large areas of Spain and disrupted countless lives, Global Switch has made a significant financial contribution to assist affected communities and their recovery efforts. We are pleased to announce that these donations have been directed to two highly regarded Spanish charities, Fundación Altius and Fundación CEOE. Both organisations are known for their efficiency, reach and expertise in humanitarian assistance and economic support, making them ideal partners in aiding the Dana Storm victims. Fundación Altius has established a strong reputation, particularly in distributing emergency aid to underserved populations and providing essential resources such as food, shelter and medical supplies. Meanwhile, Fundación CEOE, alongside the Data Center Association and linked to the Spanish Confederation of Business Organisations, or Confederación Española de Organizaciones Empresariales (CEOE), is integral to a vast network of Spanish enterprises. Fundación CEOE’s extensive partnerships allow it to coordinate aid effectively, ensuring that assistance reaches those in need quickly whilst fostering local economic resilience. The choice to work with Fundación Altius and Fundación CEOE underscores our conviction that strategic philanthropy, when combined with organisational expertise, can deliver significant impact. Each organisation was selected for its established networks and proven ability to deploy resources efficiently. Moreover, this collaboration aligns with Global Switch's mission to support initiatives that strengthen the communities we serve and our commitment to social responsibility. The Dana Storm is a reminder of the unpredictable challenges that we, the global community, can face and the need for resilient networks capable of mobilising quickly in times of crisis. By working with Fundación Altius and Fundación CEOE, we are proud to contribute not only to immediate relief but also to the foundations of long-term recovery. We thank Fundación Altius and Fundación CEOE for their partnership and commend them for their unwavering dedication to humanitarian aid. Notes to editors: About Global Switch Global Switch is a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific. Founded in 1998, Global Switch has a proven business model, demonstrable track record and is one of the highest credit rated data centre companies in the world, with investment grade credit ratings from Fitch Ratings, Moody’s and S&P Global Ratings. Global Switch is a vital strategic partner for customers that require secure and resilient data centre services with scalable capacity and a high-level of customer service. The Company's focus is on providing high power density suitable for HPC and AI deployments with both air and liquid cooled optionality, as well as highly resilient, central, low latency, network dense locations in prime city centre locations and internet hubs close to its customers on the edge of financial and business districts. Global Switch’s data centres operate exclusively in the Tier I markets of Europe and Asia-Pacific to Tier III or higher and currently total around 428,000 sq m (4,600,000 sq ft) of floor space and are occupied by a broad range of customers, global and national, large and small, including government organisations, financial institutions, enterprises, global systems integrators, telecommunication carriers, cloud and managed service providers and other hosting businesses. For more information visit: globalswitch.com. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site 