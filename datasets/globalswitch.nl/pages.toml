full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Londen Startpagina Locaties Londen Datacentercampus Londen De campus van Global Switch in Londen bestaat uit twee datacenters, London East en London North. Deze is gevestigd op nog geen kilometer van het financiële district en in de buurt van het stadscentrum. London North heeft, als onderdeel van een doorlopend ontwikkelingsprogramma, al aanzienlijke nieuwe, zeer energiezuinige capaciteit met een laag energieverbruik (PUE) opgeleverd. Na goedkeuring van de planning wordt een derde datacenter op de campus, London South, ontwikkeld. Het nieuwe datacenter zal tot 27.000 vierkante meter beslaan met een capaciteit van 40 MVA aan nutsvoorzieningen. Ontworpen om een hoge vermogensdichtheid te bieden, geschikt voor HPC en AI- implementaties met zowel lucht- als vloeistofgekoelde optionele oplossingen en kan worden aangepast aan de behoeften van individuele klanten. Het krijgt onmiddellijke directe toegang tot de meeste van 's werelds toonaangevende netwerken en cloud on-ramps die beschikbaar zijn vanuit zowel London East als London North, evenals in de directe omgeving. 00/ 00/ Een van Europa's grootste speciaal gebouwde datacenter campussen, met 115.000 vierkante meter aan ruimte zodra alle stadia van London South voltooid zijn. Een geavanceerde datacenter-omgeving in het hart van de verbindingsrijke Docklands, met toegang tot een keur aan carriers en cloudproviders Flexibele oplossingen beschikbaar met de mogelijkheid om op maat gemaakte stroom inzet te bieden van meer dan 3.000 W/m² De campus beschikt over 100% hernieuwbare energie en minimaal water verbruik. Connectiviteit Met de grootste internetcapaciteit van Europa en op dit moment een zeer populaire locatie voor hosting- en cloudserviceproviders, financiële kantoren, digitale ondernemers en technologische innovatoren, is de Londense wijk Docklands een van de meest netwerkdichte locaties ter wereld. Diverse netwerkproviders zijn op de voordelen van de carrier- en cloudneutrale status en lage latency van Global Switch afgekomen, zodat organisaties toegang hebben gekregen tot een ruime keuze aan partners en services op het gebied van connectiviteit. Infrastructuur Onze klanten in Londen profiteren van schaalvoordelen en superieure niveaus van veerkracht, evenals een directe verbinding met de Local Distribution Network Operator (DNO) UK Power Networks (UKPN). De campus beschikt over meerdere redundantielagen, state-of-the-art koelsystemen en 24x7x365 beveiliging. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Oost Londen Global Switch House, 3 Nutmeg Lane, London, E14 2AX, Verenigd KoninkrijkTelefoon: +44 20 7473 9000saleslondon@globalswitch.com Noord Londen East India Dock House, 240 East India Dock Road, London, E14 9YY, Verenigd KoninkrijkTelefoon: +44 20 7473 9000saleslondon@globalswitch.com Zuid Londen Nutmeg Lane, London E14 2AX, United KingdomTelefoon: +44 20 7473 9000saleslondon@globalswitch.com Downloads Technische Specificatie Oost Londen Technische Specificatie Noord Londen Technische Specificatie Zuid Londen Technische Specificatie Oost Londen Brochure Noord Londen Technische Specificatie Noord Londen Technische SpecificatieZuid Londen Technische Specificatie Oost Londen Locatie Het datacenter bevindt zich op 1 km afstand van het financiële district en op 6 km van het stadscentrum Een lokaal metrostation (DLR) ligt op 5 minuten lopen London City Airport ligt op 5,6 km afstand en Heathrow, Gatwick en Stansted liggen op rijafstand Overzicht Gebouw Global Switch bezit de volledige eigendomsrechten Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III overtreffen 65.542 m² brutoruimte 11 datavloeren Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Stalen frame met betonnen vloeren, metalen gevelbeplating en beglazing Vloer-tot-plafondhoogte van 5 meter Verhoogde vloerhoogte van 600 mm Minimaal vanaf verhoogde 