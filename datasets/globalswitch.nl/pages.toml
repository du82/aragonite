full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Elliot Dittes Startpagina Over Ons Het Managementteam Elliot Dittes Elliot Dittes Group Director, Delivery Elliot trad in 2022 in dienst bij Global Switch als Group Director, Delivery, met een indrukwekkend trackrecord van 17 jaar als leider van de levering van grootschalige, iconische bouwprojecten. Carrière Voordat hij bij Global Switch kwam, was Elliot Project Director voor Multiplex Construction, gericht op een groot regeneratie project in Chelsea Barracks, een historisch militair terrein van 12,8 hectare in Londen, waar hij verantwoordelijk was voor alle aspecten van de project oplevering, inclusief project teambeheer, ontwerpbeheer en P&L . Hij leidde ook het team van Multiplex om het historische, speciaal gebouwde Europese hoofdkantoor voor Goldman Sachs in Londen te voltooien. Daarvoor was hij Senior Project Engineer bij Lendlease Developments, een Australisch multinationaal bouw-, vastgoed-, investerings- en infrastructuurbedrijf waar hij werkte aan een breed scala aan commerciële projecten in Azië-Pacific. Elliot heeft een Bachelor in Werktuigbouwkunde van de Universiteit van Sydney en heeft ook een Master in Vastgoedontwikkeling van de Technische Universiteit van Sydney. Verantwoordelijkheden bij Global Switch Elliot leidt een wereldwijd team van gespecialiseerde professionals dat verantwoordelijk is voor alle aspecten van project oplevering, inclusief preconstructie analyse, ontwerpbeheer, inkoop, supply chain management, projectbeheer, kostenbeheer, kwaliteitsborging en project overdracht. Hij heeft een passie voor het optimaliseren van de efficiëntie en performance van de infrastructuur en systemen en stimuleert actief nauwe samenwerking tussen teams om ervoor te zorgen dat het geleverde product van de hoogste kwaliteit is voor onze klanten. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren behe