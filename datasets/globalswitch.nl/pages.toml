even merken van andere bedrijven en organisaties zijn handelsmerken van deze bedrijven en organisaties. BT en het merk 'connected world' zijn geregistreerde handelsmerken van British Telecommunications plc. 3.5 U bevestigt dat materialen of informatie (anders dan persoonlijke gegevens) die u via onze websites bij ons indient, niet vertrouwelijk zijn en dat er geen auteursrechten op rusten, en dat we dit materiaal of deze informatie naar eigen goeddunken mogen gebruiken. Toegang tot Beveiligde Informatie voor Obligatiehouders van Global Switch 4.1 Bestaande obligatiehouders en geïnteresseerde partijen krijgen via een wachtwoord toegang tot een beveiligd gedeelte van onze websites (de 'pagina voor obligatiehouders') met actuele rapporten, accounts, actuele informatie van kredietbeoordelaars en andere relevante informatie voor obligatiehouders. 4.2 Om toegang tot dit gedeelte te verkrijgen, dient u eerst via onze websites uw gegevens bij ons te registreren. Als wij u erkennen als vertegenwoordiger van een bestaande of potentiële obligatiehouder, geven we u een persoonlijk wachtwoord waarmee u kunt inloggen op de pagina voor obligatiehouders. 4.3 Door een geregistreerde gebruiker van de pagina voor obligatiehouders te worden, verklaart u dat u:(a) niemand anders uw account laat gebruiken;(b) uw inloggegevens, met name uw wachtwoord, vertrouwelijk zult behandelen en niet aan derden bekend zult maken; en(c) ons op de hoogte zult stellen als u ongeautoriseerd gebruik van uw account waarneemt of vermoedt. 4.4 We kunnen uw account opschorten of beëindigen als we reden hebben om aan te nemen dat u een of meerdere van deze regels overtreedt. Ook zullen we u de toegang tot de pagina voor obligatiehouders ontzeggen zodra u geen vertegenwoordiger van een obligatiehouder meer bent. Links naar Websites van Derden 5.1 Wij controleren de inhoud van websites van derden niet. Links op onze websites zijn er alleen voor uw gemak en te uwer informatie. We geven geen verklaring of garanties met betrekking tot de inhoud van dergelijke websites van derden en we raden u aan de voorwaarden van deze websites voor gebruik door te lezen. We sluiten aansprakelijkheid uit voor materiaal van derden dat beschikbaar wordt gesteld op onze websites of onderdeel uitmaakt van een site van een derde waarnaar wordt gelinkt. 5.2 Links naar onze websites zijn niet toegestaan zonder onze uitdrukkelijke, schriftelijke toestemming. Wij hebben niet noodzakelijkerwijs enige relatie, samenhang of partnerschap met derden die links naar een of meer van onze websites aanbieden. Een dergelijke relatie bestaat alleen als deze door ons wordt bevestigd. Disclaimer 6.1 Wij sluiten tot de maximale omvang die wettelijk is toegestaan alle verklaringen of garanties uit betreffende de accuraatheid, betrouwbaarheid, volledigheid, kwaliteit, tijdigheid, beschikbaarheid, vrijheid van virussen en andere schadelijke code, het onderhoud of de geschiktheid voor het doel van onze websites of enige inhoud. 6.2 De inhoud van onze websites is alleen bedoeld ter algemene informatie, niet als enige vorm van advies dat u dient op te volgen. Voordat u op basis van de inhoud van onze websites enige actie onderneemt of afziet van enige actie, dient u zelf professioneel of gespecialiseerd advies in te winnen. Beperking van Aansprakelijkheid 7.1 Tot de maximale omvang toegestaan door toepasselijke wetgeving, zijn wij niet aansprakelijk voor enige directe, indirecte, gevolg- of andere verliezen (waaronder winstderving, verlies van zakelijke kansen of goodwill of bedrijfsonderbrekingen) resulterend uit de toegang tot of het gebruik van onze websites, het vertrouwen van inhoud of het tijdelijk of permanent niet beschikbaar zijn van onze websites, veranderingen aan onze websites of datacorruptie of -verlies opgelopen tijdens het gebruik van onze websites. 7.2 Niets in deze voorwaarden zal onze aansprakelijkheid in geval van overlijden of persoonlijk letsel als gevolg van onachtzaamheid aan onze kant of in geval