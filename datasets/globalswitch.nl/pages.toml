["https://globalswitch.nl/about-us/news/25-10-18-global-switch-s-latest-data-centre-in-hong-kong-achieves-the-prestigious-leed-platinum-certification"]
title = "Global Switch’s latest data centre in Hong Kong achieves the prestigious LEED Platinum Certification"
description = "Global Switch, a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific, has announced that the first stage of its Hong Kong data centre has received a Leadership in Energy and Environmental Design (LEED) Platinum certification. This status is rarely awarded to such facilities and Global Switch Hong Kong is one of only three carrier and cloud neutral data centres in the region to obtain the accreditation."
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Global Switch’s latest data centre in Hong Kong achieves the prestigious LEED Platinum Certification Startpagina Over Ons Nieuws Global Switch’s latest data centre in Hong Kong achieves the prestigious LEED Platinum Certification Global Switch’s latest data centre in Hong Kong achieves the prestigious LEED Platinum Certification Release date: 25.10.2018 Hong Kong, 25 October 2018 – Global Switch, a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific, has announced that the first stage of its Hong Kong data centre has received a Leadership in Energy and Environmental Design (LEED) Platinum certification. This status is rarely awarded to such facilities and Global Switch Hong Kong is one of only three carrier and cloud neutral data centres in the region to obtain the accreditation. The Platinum certification indicates the achievement of the highest levels of environmental responsibility in construction. Global Switch was delighted to receive the Award which was presented by US Green Building Council’s (USGBC) Mahesh Ramnanujam, President and CEO and Andy To, North Asia Managing Director at the 2018 Green Build International Conference in Shanghai. LEED is an internationally recognised green building rating system developed by the USGBC to help building owners and operators be environmentally responsible and use resources efficiently. LEED includes a set of rating systems for the design, construction, operations and maintenance of buildings and covers aspects such as energy savings, water use, the selection of green materials and choice of resources as well as the quality levels of indoor environments. The first stage of Global Switch Hong Kong, which launched in December 2017, obtained 100% scores in Innovation in Design and Regional Priority as well as exceptionally high scores in the important Sustainable Sites and Energy and Atmosphere areas demonstrating best in class design of the new data centre which is strategically located, close to key submarine cable systems, in this important business and financial hub. This certification was achieved by incorporating some of the latest environmental design features and methods including: Incorporating advanced cooling systems including variable speed fans, free cooling systems, and low energy CRAH units. Installation of sophisticated measurement and monitoring systems to optimise energy performance and energy consumption. Using diesel rotary uninterrupted power supplies (DRUPS) which have reduced emissions, noise pollution and fuel consumption compared to other solutions. The power system uses an IP Bus solution which shares the load across the DRUPS units to maximise efficiency, whilst avoiding single points of failure. Utilising, where possible, recycled or sustainable materials or components that assisted with achieving maximum building efficiency. Diverting more than 82% of construction and demolition waste from going to landfill. The data centre is targeting a market leading PUE of less than 1.5. The first stage has managed to achieve energy savings of around 16,000 tonnes per year in CO2 emissions which is equivalent to the greenhouse gas emissions from around 40 million miles driven by an average car vehicle. The LEED Platinum certification is further evidence of Global Switch's ongoing commitment to reducing its impact on the environment through energy efficiency, reduction in carbon emissions and the provision of green energy solutions to customers. Andy To, North Asia, USGBC said “Congratulations to Global Switch for successfully obtaining LEED Platinum certification for their Hong Kong data centre. While being a cornerstone of today's global economic development, data centres consume 100 times more energy than complex commercial office buildings. LEED certification is a strong commitment to greener and more efficient data centres. We feel very honoured to have industry pioneers like Global Switch.” Chris Cheng, Global Switch's Managing Director in Hong Kong said "Achieving this key certification for the first stage of Global Switch Hong Kong is testament to the high quality environmental design we have applied to all aspects of the data centre from initial concept through to build and its ongoing operation. Sustainability and energy efficiency are vital components for today’s data centre offering and I am delighted that we have delivered one of the most energy efficient data centres in Hong Kong.” Due to customer demand, the second and final stage of Global Switch Hong Kong is under construction and is due to launch at the end of 2019. In order to maximise efficiencies, the same leading environmental design concepts and construction standards that were applied to the first stage are being utilised for the remaining stages. Global Switch is also targeting a Hong Kong Green Building Council’s BEAM Plus gold rating and is well advanced towards achieving certification to ISO 14001 Environmental Management System. --- Ends --- Contact details: Chris ChengManaging Director, Hong KongGlobal Switch+852 3705 5818ccheng@globalswitch.com Ali BallantineGroup Director, Marketing & CommunicationsGlobal Switch+44 20 8054 9053aballantine@globalswitch.com General enquiries: For press enquiries please emailpress@globalswitch.com Notes to editors: About Global SwitchGlobal Switch is a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific. Founded in 1998, Global Switch has a proven business model, demonstrable track record and is the highest credit rated data centre company in the world with investment grade credit ratings from Fitch, Moody’s and Standard & Poor’s. Global Switch is a vital and strategic partner for customers that require secure and resilient data centre services with scalable capacity and a high level customer service. The Company's focus is on highly resilient, central, low latency, network dense locations in prime city centre locations and internet hubs close to its customers on the edge of financial and business districts. Global Switch’s data centres operate exclusively in the Tier I markets of Europe and Asia-Pacific to Tier III or higher and currently total around 340,000 sq m (3,650,000 sq ft) of floor space and are occupied by a broad range of customers, global and national, large and small including government organisations, financial institutions, enterprises, global systems integrators, telecommunication carriers, cloud and managed service providers and other hosting businesses. For more information visit: www.globalswitch.com Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js"; s.parentNode.insertBefore(b, s); })(); <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=2105322&fmt=gif" />'''
