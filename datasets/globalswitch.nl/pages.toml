title = "He Chunsheng, Chairman | Global Switch"
description = "He Chunsheng trad in augustus 2019 toe tot de raad van bestuur van Global Switch als Non-Executive Director en is in September 2019 aangesteld als President Directeur."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten He Chunsheng Startpagina Over Ons Bestuursleden He Chunsheng He Chunsheng Chairman He Chunsheng trad in augustus 2019 toe tot de raad van bestuur van Global Switch als Non-Executive Director en is in September 2019 aangesteld als President Directeur. De heer He kwam in 2001 bij Jiangsu Shagang Group Co., Ltd (een bedrijf uit de Fortune 500 en het grootste particuliere staalbedrijf in China) en was Executive Director, Vice President en hoofdeconoom van de raad van bestuur van de groep sinds januari 2007. Van 2009 tot 2013 was hij ook Executive Deputy General Manager en General Manager van Jiangsu Shagang Group Co., Ltd. Hij was tegelijkertijd voorzitter van Jiangsu Shagang Co., Ltd., (genoteerd aan de beurs van Shenzen met de aandelencode 002075), een dochteronderneming van Shagang Group sinds 2014. Voordat hij bij Shagang Group Co., Ltd. kwam, had He Chunsheng een aantal belangrijke functies bij onder meer Jinfeng Zhahua Stripping Factory, Jinhua Group. He Chunsheng haalde in 1989 aan het Instituut voor Technologie Suzhou Silk (nu de universiteit van Soochow) een Bachelor of Engineering. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.g