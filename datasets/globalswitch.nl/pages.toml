witch Frankfurt, welke uit twee datacenters bestaat, Noord Frankfurt en Zuiden Frankfurt, bevindt zich in de buurt van het financiële district en het stadscentrum, en de internationale luchthaven van Frankfurt ligt op slechts een kwartiertje rijden. 00/ 00/ Uitstekende operationele staat van dienst met vooraanstaande bedrijfsprocedures In de nabijheid van de belangrijkste kabelinfrastructuur van Frankfurt en Duitsland, dus rechtstreeks toegang tot de datasnelweg Flexibele oplossingen, van een enkel rack tot op maat gemaakte systemen van meerdere megawatts Met de ruimte van 17.686 m² van Frankfurt Zuid voegt het nieuwe datacenter van Frankfurt Noord nog eens 11.862 m² toe aan de bestaande campus. Frankfurt Noord behaalde de BREEAM beoordeling ‘Very Good’ van Building Research Establishment Environmental Assessment Method (BREEAM) met een prestatie gevalideerde PUE van 1.1 bij volledige belasting. Connectiviteit De campus is een belangrijke connectiviteits- en cloudhub, die een aantal van 's werelds grootste merken toegang biedt tot DE-CIX, een keur aan internationale en regionale carriers, ISP's en vooraanstaande cloudproviders. Dit netwerkdichte ecosysteem, en de nabijheid van het centrale zakendistrict, maakt supersnelle verbindingen mogelijk. Dit trekt financiële instellingen uit Duitsland, Europa en de hele wereld, maar ook diverse andere vooraanstaande internationale merken aan. Als DE-CIX Enabled Site biedt onze campus in Frankfurt directe toegang tot het grootste onafhankelijke interconnectie-ecosysteem ter wereld. Onze klanten kunnen profiteren van een volledig aanbod van DE-CIX diensten - van traditionele peering-diensten tot Enterprise-grade interconnectiediensten, zoals DirectCLOUD waar meer dan 50 cloud providers direct op zijn aangesloten. Infrastructuur Deze speciaal gebouwde datacentercampus werkt volgens de standaard Tier III+ met redundante systemen voor optimale betrouwbaarheid en de best mogelijke service aan de klant. De datacenters zijn uitgerust met optimale koeling en geavanceerde beveiligings- en bewakingssystemen. Onze door de jaren heen opgebouwde klantenkring kan vertrouwen op de expertise van ons interne team, dat het als zijn missie ziet u een op maat gemaakte oplossing te bieden en u ook op de lange termijn technische ondersteuning te verlenen. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Frankfurt Noord / Frankfurt Zuid Eschborner Landstraße 110, 60489 Frankfurt am Main, GermanyTelefoon: +49 69 74 22 70salesfrankfurt@globalswitch.com Downloads Technische Specificatie Frankfurt Noord Technische Specificatie Frankfurt Zuid Brochure Frankfurt Noord Technische Specificatie Frankfurt Noord Technische Specificatie Frankfurt Zuid Technische Specificatie Frankfurt Noord Locatie Het datacenter bevindt zich op 5,5 km afstand van het financiële district en het stadscentrum Het dichtstbijzijnde S-Bahn-station bevindt zich op loopafstand (15 minuten) De internationale luchthaven van Frankfurt is 15 minuten rijden met de auto Overzicht Gebouw Global Switch bezit de volledige eigendomsrechten Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III zullen overtreffen 11.862 m² brutoruimte 3 datavloeren Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Beton omlijst met metalen gevelbekleding Vloer-tot-plafondhoogte van 5,5 meter Verhoogde vloerhoogte van 1.000 mm Minimaal vanaf verhoogde vloer: vrije hoogte van 3,88 meter tot onderzijde van laagste balk Vloerbelasting van 15 kN/m² 1 goederenlift (4 ton), 1 personenlift Stroom 10kV stroomvoorziening met N+N redundantie Capaciteit stroomvoorziening van 14 MVA (huidige) Technische (IT) stroom geleverd door statische UPS met N+1 redundantie op locatie Mechanische systemen met back-up door stand-by generatorsysteem met N+1 redundant