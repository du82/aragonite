g Independent Non-Executive Director Liew Fui Kiand trad in November 2020 toe tot de Raad van Bestuur van Global Switch als Independent Non-Executive Director. Dhr. Liew werkt op dit moment als Independent Non-Executive Director voor Shandong Gold Mining Company Limited (1787.HK en 600547.SH), China Apex Group Limited (2011.HK), Zhengye International Holdings Limited (3363.HK), Zhaoke Ophthalmology Limited (6622.HK) en Zhongchang International Holdings Group Limited (0895.HK). In het verleden was hij in de rol van non-executive director verbonden aan Baoshan Iron & Steel Company Limited (600019.SH), een Fortune Global 500 organisatie. Hij was de Chairman en een Executive Director bij PacRay International Holdings Limited (1010.HK). Dhr. Liew is tevens een ‘fellow’ bij ‘The Hong Kong Institute of Directors’. Hij is toegelaten als advocaat in Engeland en Wales en in Hong Kong. Hij heeft een Bachelor in de Rechten van de universiteit van Leeds (Verenigd Koninkrijk), als een ‘Tetley & Lupton Scholar’, en tevens een Master in Business Administration van Hull University Business School (Verenigd Koninkrijk). Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; wi