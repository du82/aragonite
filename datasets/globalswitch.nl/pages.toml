title = "Gavin Greer"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Gavin Greer Startpagina Over Ons Het Managementteam Gavin Greer Gavin Greer Group Director, Procurement Gavin werkt sinds 2015 bij Global Switch, toen hij toetrad als Group Procurement Manager en in 2018 overstapte naar zijn huidige rol van Group Director, Procurement. Carrière Gavin heeft een brede expertise opgebouwd op het gebied van aanbestedingen, inkoop, contract onderhandelingen en supply chain management en heeft gewerkt aan projecten in het Verenigd Koninkrijk, Parijs en Dubai. Voordat hij bij Global Switch kwam, was Gavin Procurement en Supply Chain Management specialist voor BP Exploration, waar hij als lid van de Global Subsea Group verantwoordelijk was voor de inkoop van onderzeese productiesystemen en aftermarket ondersteuning diensten. Daarvoor was Gavin gevestigd in het Midden Oosten als Senior Contracts Specialist voor Petro China, waar hij contract processen en procedures voor projecten standaardiseerde om deze af te stemmen op de beste internationale praktijken. Gavin begon zijn carrière bij Kellogg Brown and Root (nu KBR), een Amerikaans bedrijf en een van 's werelds meest vooraanstaande bedrijven op het gebied van engineering, inkoop, constructie en dienstverlening. Gavin studeerde af aan de Universiteit van Glasgow met een graad in Electronic and Electrical Engineering en heeft zowel de Britse als de Franse nationaliteit. Verantwoordelijkheden bij Global Switch Gavin is verantwoordelijk voor de inkoop doelstellingen en activiteiten in alle datacenters van Global Switch in Europa en Azië-Pacific, inclusief standaard contract onderhandelingen met strategische partners, directe inkoop van belangrijke apparatuur voor nieuwe projecten, service contracten voor onderhoud activiteiten op locatie, levenscyclusv ervanging en ontwikkelen van processen en procedures. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehoude