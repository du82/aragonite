Frédérick Coeuille Managing Director, Parijs Frédérick begon als Managing Director Parijs in 2021 en neemt 25 jaar ervaring in de IT, telecom en datacenter sectoren met zich mee. Carrière Voor Frédérick bij Global Switch aantrad was hij European Colocation Director bij Zayo, een communications infrastructure services provider uit de Verenigde Staten. Daarvoor was hij Operations Director en Managing Director bij dezelfde organisatie. Als de Director die leiding gaf aan de datacenteractiviteiten in Frankrijk, heeft hij een aanzienlijke hoeveelheid ervaring op het gebied van projectmanagement, verkoop, levering en operationele zaken en heeft hij een bewezen staat van dienst in het genereren van New Business en het onderhouden en uitbouwen van relaties met belangrijke partijen en mensen in de markt. Daarvoor bekleedde Frédérick verschillende functies, waaronder Operation Director bij Aciernet, een hardware-reseller, CEO bij Internet FR, een webhostingbedrijf en Pre-Sales Engineer bij een datacenterprovider, Ook was hij verantwoordelijk voor netwerkimplementaties bij Orange en Alcatel. Verantwoordelijkheden bij Global Switch Frédérick overziet alle aspecten van de datacentercampus in Parijs, van klantrelaties tot het soepel draaien van beide bedrijfskritieke datacenters. Global Switch Paris heeft een groeiend ecosysteem en de campus is een vooraanstaand multi-tenant datacenter geworden voor internationale bedrijven waaronder cloudproviders. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en