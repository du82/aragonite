tt Group Security Advisor Paul is een beveiliging specialist met uitgebreide ervaring op senior niveau. Hij trad in 2022 in dienst bij Global Switch als Senior Security Advisor en brengt meer dan 30 jaar ervaring op het gebied van onderzoek en bedrijf beveiliging met zich mee. Carrière Voordat hij bij Global Switch kwam, was Paul BP's Global Head of Digital Security Operations Centres, verantwoordelijk voor de continue cybe rmonitoring en verdediging van de wereldwijde informatie- en datasystemen van het bedrijf. Paul bekleedde ook senior beveiliging functies in het bedrijf voor fysieke beveiliging, het ontwerpen en implementeren van op maat gemaakte oplossingen voor beveiliging uitdagingen, waaronder het ontwikkelen van beveiliging standaarden voor hun datacenters, server ruimten en ICS controle kamers. Daarvoor was Paul hoofd van het National Counter Terrorism Coordination Centre voor het VK, waar hij leiding en richting gaf aan het ontwerp, de bouw en de ontwikkeling van een nationale eenheid met meerdere instanties, in samenwerking met politie, IT, overheid en militaire specialisten. Paul heeft een MA (Merit) in Intelligence and Security Studies van de Brunel University en is een Chartered Fellow van het Chartered Managers' Institute. Verantwoordelijkheden bij Global Switch Paul is verantwoordelijk voor het geven van advies en begeleiding, en het geven van ondersteuning bij en leiding aan het interne adviesproces bij de algehele controle van de beveiligingsvoorziening, beveiligingsbeleid en -praktijken binnen Global Switch. Zijn rol omvat alle aspecten van continue verbetering op het gebied van beveiliging, inclusief fysiek, technisch, personeel, data en cyber, en hij leidt ook op het gebied van beveiliging cultuur en onderwijs. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global S