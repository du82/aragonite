["https://globalswitch.nl/about-us/senior-management/yu-jie"]
title = "Yu Jie | Het managementteam | Global Switch"
description = "Yu Jie trad in 2019 aan bij Global Switch en heeft bijna 10 jaar ervaring op financieel gebied."
full_description = '<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Yu Jie Startpagina Over Ons Het Managementteam Yu Jie Yu Jie Group Director, Internal Audit Yu Jie trad in 2019 aan bij Global Switch als Group Director, verantwoordelijk voor de financiële planning en analyse, en had toen al bijna 10 jaar ervaring op financieel gebied. In 2023 begon hij in zijn huidige functie. Carrière Voordat hij bij Global Switch kwam, was Yu Jie Vice General Manager van Shagang Commerce Co., Ltd, (een dochteronderneming van Jiangsu Shagang Group Co., Ltd, een van de grootste particuliere staalbedrijven in China en vermeld in de Fortune 500-lijst) waar hij leiding gaf aan de afdelingen Financiën, Risicomanagement en Audits, Administratie en Human Resources. Daarvoor was Yu Jie Deputy General Manager en Senior Business Manager bij Shagang International (Singapore) PTE LTD. Trad in 2019 aan bij Global Switch als Group Director, verantwoordelijk voor de financiële planning, prognoseprocessen, rapportage en analyse voor de hele groep. Yu Jie behaalde een FMBA aan het Shanghai Advanced Institute of Finance, een Master aan de Shanghai Jiao Tong University, en is daarnaast ook financieel analist (CFA), financieel registeraccountant (ACCA) en financieel risicomanager (FRM). Verantwoordelijkheden bij Global Switch Yu Jie is verantwoordelijk voor de uitvoering van interne audits binnen de hele groep. Hij beheert het interne auditprocess om te sturen op efficiëntie- en effectiviteitsverbeteringen. Daarnaast houdt Yu Jie toezicht op de prestaties van het bedrijf, zowel intern als extern, om benchmarks te stellen en zo vooruitgang te boeken op het vlak van ESG-initiatieven op basis van de gedane toezeggingen. Door HR-processen te verbeteren wordt ons fundament verder versterkt. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit