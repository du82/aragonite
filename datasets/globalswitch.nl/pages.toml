tpagina Over Ons Nieuws Global Switch Madrid Empowers the Next Generation of Tech Professionals Global Switch Madrid Empowers the Next Generation of Tech Professionals Release date: 28.01.2025 We are delighted to share an initiative that reflects our commitment to education and the future of the technology sector. Global Switch Madrid recently organised an open house for IT and Engineering students from IES Valle Inclán de Torrejón de Ardoz - allowing them to experience firsthand the infrastructure that powers the digital economy. Strategically located in the heart of Madrid's Silicon Alley, adjacent to the A-2 highway, our data centre represents the backbone of the region's digital transformation. During the visit, students were able to explore state-of-the-art infrastructure supporting cloud services, advanced liquid cooling systems, enterprise-level security protocols, and high-power density solutions for HPC and AI projects. Global Switch Madrid has been leading the sector for 25 years, and this educational outreach program demonstrates our dedication to sharing knowledge, developing local talent and fostering the next generation of digital infrastructure professionals. At a time when the demand for specialised data centre professionals is soaring, we consider it essential to build bridges between education and industry. Furthermore, we are proud to reaffirm our commitment to innovation and sustainable growth in the region as we announce the development of our new campus. Notes to editors: About Global Switch Global Switch is a leading owner, operator and developer of large-scale, carrier and cloud neutral, multi-customer data centres in Europe and Asia-Pacific. Founded in 1998, Global Switch has a proven business model, demonstrable track record and is one of the highest credit rated data centre companies in the world with investment grade credit ratings from Fitch, Moody’s and S&P Global Ratings. Global Switch is a vital strategic partner for customers that require secure and resilient data centre services with scalable capacity and a high-level customer service. The Company's focus is on providing high power density suitable for HPC and AI deployments with both air and liquid cooled optionality, as well as highly resilient, central, low latency, network dense locations in prime city centre locations and internet hubs close to its customers on the edge of financial and business districts. Global Switch’s data centres operate exclusively in the Tier I markets of Europe and Asia-Pacific to Tier III or higher and currently total around 428,000 sq m (4,600,000 sq ft) of floor space and are occupied by a broad range of customers, global and national, large and small including government organisations, financial institutions, enterprises, global systems integrators, telecommunication carriers, cloud and managed service providers and other hosting businesses. For more information visit: www.globalswitch.com. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("