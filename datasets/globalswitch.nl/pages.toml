title = "Jens Leuchters | Senior Management | Global Switch"
description = "Jens joined Global Switch as Managing Director, Frankfurt in 2023 with around 30 years’ experience across the ICT and data centre sectors."
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Jens Leuchters Startpagina Over Ons Het Managementteam Jens Leuchters Jens Leuchters Managing Director, Frankfurt Jens trad in 2023 in dienst bij Global Switch als Managing Director, Frankfurt, met ongeveer 30 jaar ervaring in de ICT- en datacentersectoren. Carrière Voordat hij bij Global Switch kwam, was Jens Managing Director voor een Duitse carrier-neutrale aanbieder van oplossingen, waar zijn belangrijkste verantwoordelijkheden lagen op het gebied van het verbeteren van de financiële prestaties, bedrijfsontwikkeling, bedrijfsactiviteiten, colocatie en uitbreiding van edge-datacenters, evenals organisatorische transformatie en herstructurering. Hiervoor was hij SVP Network Services Europe bij NTT, waar hij verantwoordelijk was voor de volledige IT-stack, inclusief netwerk-, datacenter- en clouddiensten. Gedurende zijn tijd bij NTT was hij ook Regional General Manager voor Centraal- en Oost-Europa en was hij verantwoordelijk voor verkoop en marketing, evenals voor netwerk- en datacenterdiensten. Jens heeft tevens diverse functies bekleed bij Interoute Duitsland, Completel, Manpower en RSLCOM Deutschland GmbH. Jens heeft de Duitse nationaliteit en heeft een BSc-diploma in Engineering van de Warner-Von-Siemens-Schule in Frankfurt. Hij vertegenwoordigt Global Switch bij de German Datacenter Association (GDA) en ECO, de grootste vereniging voor de internetindustrie in Europa. Verantwoordelijkheden bij Global Switch In zijn rol als Managing Director, Frankfurt, is Jens verantwoordelijk voor het beheer van onze Frankfurt Campus, het toezicht op de ontwikkeling van de bedrijfsactiviteiten en het onderhouden van een best-in-class operationele omgeving. De Frankfurt Campus, met een vloeroppervlak van ongeveer 29.000 m² ruimte met 28 MVA aan toevoercapaciteit, is een belangrijke connectiviteits- en cloud-hub die enkele van 's werelds toonaangevende merken toegang biedt tot DE-CIX, een breed scala van internationale en regionale carriers, ISP’s en toonaangevende cloudproviders. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relation