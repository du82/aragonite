["https://globalswitch.nl/data-centres/certifications-detail"]
title = "Informatie over Certificeringen | Global Switch"
description = "Belangrijkste ISO-normen en certificeringen voor de datacenters van Global Switch, waaronder ISO 9001, ISO 14001, OHSAS 18001 en ISO 27001."
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Informatie over Certificeringen Startpagina Datacentres Informatie over Certificeringen Informatie over Certificeringen Belangrijkste ISO normen en certificeringen voor datacenters van Global Switch Als belangrijk onderdeel van ons Critical Environments Programme (programma voor kritieke omgevingen) willen we onze processen en praktijken onafhankelijk laten beoordelen en certificeringen op basis van internationaal erkende standaarden behalen. Global Switch is gecertificeerd volgens ISO 9001, ISO14001, ISO 27001, ISO45001 en IS050001 voor alle waardoor we onze klanten ook kunnen helpen hun eigen certificeringen te behalen. 'Best practice' is in al onze datacenters het sleutelbegrip Kwaliteitsmanagement ISO 9001 Global Switch stelt zich ten doel hoogstaande diensten aan haar klanten te leveren, die voldoen aan hun verwachtingen en deze overtreffen. Dit doen we aan de hand van gespecialiseerde, krachtige processen voor kritische omgevingen en procedures ten behoeve van minimale risico's en maximale uptime. Global Switch is gecertificeerd volgens ISO 9001 na een succesvolle bepaling en implementatie van de kwaliteitsmanagementsystemen van Global Switch, waarin de invoering en naleving van best practice-methoden is opgenomen. Milieumanagement ISO 14001 Global Switch zet zich in voor het verkleinen van de impact van al haar datacenters op het milieu aan de hand van energie-efficiëntieprogramma's, die zich richten op het verlagen van de koolstofemissies en het leveren van groene energieoplossingen aan onze klanten. Global Switch is gecertificeerd volgens ISO 14001, wat aantoont dat we onze milieuverantwoordelijkheid effectief beheren. Informatiebeveiliging ISO 27001 Global Switch wil haar klanten een zeer veilige omgeving bieden en haar eigendommen, mensen, processen en IT-systemen beveiligen en beschermen. Global Switch is gecertificeerd volgens ISO 27001, waarmee een systematische aanpak van informatiebeveiliging op al onze locaties mogelijk wordt gemaakt. Arbo management ISO 45001 Global Switch heeft ISO 45001 certificering behaald voor alle onderdelen binnen haar Health en Safety Management System. De prestaties worden nu en in de toekomst tegen de gedefinieerde doelstellingen beoordeeld. Energiemanagement ISO 50001 Global Switch heeft ISO 50001 certificering behaald voor al zijn data centers. Met haar certificering volgens ISO 50001 heeft Global Switch een set best practice systemen en processen neergezet voor de continue verbetering van de efficiëntie en de prestaties op het gebied van energieverbruik. Het ISO 50001 raamwerk bestaat uit de ontwikkeling van een energie efficiëntiebeleid, het meten van energie efficiëntiesystemen en het plannen van strategieën voor energiemanagement. Bestaande locaties van Global Switch beschikken bovendien over de volgende certificeringen, onderscheidingen en lidmaatschappen (of zijn bezig deze te verwerven) Partner van AMS-IX [SDP] AMS-IX, het grootste internetknooppunt ter wereld, bevindt zich bij Global Switch Amsterdam. Onze klanten kunnen gebruikmaken van hoogstaande peering- en connectiviteitsdiensten met een enorme redundantie. Partner van AWS Direct Connect De samenwerking van Global Switch met AWS Direct Connect biedt extra mogelijkheden voor klanten die cloudoplossingen willen implementeren. Van een grote onderneming tot snel groeiende starter, iedereen kan voordeel halen uit de mogelijkheden van AWS Direct Connect. Building Research Establishment’s Environmental Assessment Method (BREEAM) De eerste fase van de geplande uitbreiding van het datacenter van Global Switch in Amsterdam is door BREEAM-NL beoordeeld als 'zeer goed'. BREEAM is 's werelds belangrijkste methode voor milieubeoordeling en classificatiesysteem voor gebouwen, waarmee de standaard wordt gezet voor best-practices in het duurzaam ontwerpen, bouwen en exploiteren van gebouwen. Het systeem is inmiddels een van de meest veelomvattende en breedst erkende maatstaven voor de milieuprestaties van gebouwen. Partner van DE-CIX DE-CIX is de grootste internet exchange ter wereld, waar wereldwijd meer dan 1.800 netwerken bij zijn aangesloten. De campussen van Global Switch in Frankfurt en Madrid zijn DE-CIX enabled, met toegang tot een groot aantal peering-partners die klantspecifieke diensten en oplossingen op maat leveren. ENS Compliance Global Switch Amsterdam is ENS (Nationaal Veiligheidskader) High Level (Nationale Veiligheidsschema op hoog niveau) compliant, een eis voor klanten die IT-opslag of -verwerking uitvoeren vanuit de overheidsadministratie. Internationale Standaard Inzake Controleopdrachten (ISAE: International Standards for Assurance Engagements) 3402 Global Switch Amsterdam is gecertificeerd volgens ISAE 3402, een internationale standaard waarbij diepgaande audits worden uitgevoerd op de controledoelstellingen en -activiteiten van serviceorganisaties. Dergelijke controleactiviteiten bestaan vaak uit controles van informatiebeveiliging en hieraan verwante processen. In dit kader krijgen de klanten van Global Switch en hun accountants inzage in een volledig verslag van een onafhankelijke accountant, waarin onze interne controlesystemen met betrekking tot accommodatiediensten voor de ICT-infrastructuren van klanten zijn opgenomen. Leadership in Energy and Environmental Design (LEED) De eerste fase van Global Switch Hong Kong is onderscheiden met de certificering LEED Platinum (Leadership in Energy and Environmental Design), het hoogste niveau van milieuverantwoordelijkheid in de bouw. Global Switch Singapore Woodlands behaalde een LEED Gold certificering. LEED is een certificering voor duurzaam bouwen, die wereldwijd wordt erkend als het belangrijkste kwaliteitskeurmerk op dit gebied. LEED staat voor een erkenning van de beste bouw strategieën en toepassingen. Lidmaatschap van het programma Climate Change Agreement (CCA) in het Verenigd Koninkrijk Global Switch Londen is de eerste grote, carrierneutrale, multi‐tenant datacenterprovider in Londen die deelneemt aan de Climate Change Agreement (CCA), waardoor haar klanten geen CRC (Carbon Reduction)-betalingen hoeven af te dragen. Dit programma is gericht op een verstandig gebruik van energie en op gerichte jaarlijkse verbeteringen. OCP-lid (Community) Global Switch is lid van de Open Compute Project (OCP) community. Global Switch Hong Kong en Amsterdam-Oost richten zich op erkenning van de organisatie als ‘OCP Ready’ zodat klanten nog sneller kunnen opschalen. Naleving van PCI-DSS voor Serviceproviders (fysieke beveiliging) Global Switch Amsterdam, Global Switch Londen, Global Switch Madrid, Global Switch Parijs en Global Switch Hong Kong voldoen aan PCI-DSS (Payment Card Industry Data Security Standard), een vereiste voor klanten die kaarthoudergegevens opslaan, verwerken of verzenden en kaartbetalingen verwerken. Om er zeker van te zijn dat Global Switch aan de normen blijft voldoen, wordt elk kwartaal een kwetsbaarheidstest gehouden door een erkende auditor. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een goede werking van onze websites. Analytische cookies Deze cookies stellen ons in staat om het aantal bezoekers te herkennen en te tellen en wat de bezoekers op onze websites bekijken. Ja Nee Commerciële cookies Deze cookies registreren uw bezoek aan onze websites, de pagina’s die u hebt bezocht en de links die u hebt gevolgd. Ja Nee Sluit Bewaar cookie voorkeuren _linkedin_partner_id = "2105322"; window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []; window._linkedin_data_partner_ids.push(_linkedin_partner_id); (function () { var s = document.getElementsByTagName("script")[0]; var b = document.createElement("script"); b.type = "text/javascript"; b.async = true; b.src = "https://snap.licdn.com