full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Ross Henderson Startpagina Over Ons Het Managementteam Ross Henderson Ross Henderson Directeur Groepsactiviteiten, Operations Ross is in september 2024 bij Global Switch in dienst getreden als Group Operations Director. Hij brengt meer dan twintig jaar ervaring op het gebied van kritieke infrastructuur met zich mee. Carrière Voordat Ross bij Global Switch in dienst trad, was hij Senior Director of Global Operations Engineering bij Equinix, 's werelds grootste aanbieder van co-locatie- en interconnectiediensten. Gedurende zijn carrière van ruim 25 jaar heeft hij diverse leidinggevende functies bekleed bij internationale datacenterorganisaties, waardoor hij een schat aan ervaring heeft opgedaan op het gebied van kritieke infrastructuur. Maar zijn kennis houdt daar niet op. Ross heeft ook expertise in organisatorisch leiderschap, operationele excellentie en personeelsontwikkeling. Als belangrijk lid van het Global Engineering-leiderschapsteam was Ross verantwoordelijk voor de strategische richting van meer dan 200 datacenters wereldwijd. Hij was verantwoordelijk voor de migratie van meer dan 500 MW datacentercapaciteit van de bouwfase naar de operationele fase. Verantwoordelijkheden bij Global Switch De benoeming van Ross tot het Global Switch-team is essentieel voor onze voortdurende groeistrategie. Zijn uitgebreide ervaring en sterke technische vaardigheden zijn van cruciaal belang bij het dichten van de kloof tussen onze strategische visie en operationeel succes, terwijl hij leiding geeft aan onze collega's van Global Operations (Kritieke omgevingen, Inkoop en Fysieke beveiliging en veiligheid) om de uitmuntendheid van het bedrijf te bevorderen. Locaties Oplossingen Ecosysteem Datacentres Over Ons Bondholder Relations Hulpbronnen Contact Juridisch Privacybeleid Cookiebeleid Verklaring Aangaande de Voorkoming van Slavernij en Mensenhandel Site Map Cookievoorkeuren © 2025 Global Switch. Alle Rechten Voorbehouden. Cookievoorkeuren beheren Selecteer hieronder uw voorkeuren: Strikt noodzakelijke cookies Dit zijn cookies die nodig zijn voor een g