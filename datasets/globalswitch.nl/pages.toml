title = "Datacenter Singapore | Global Switch"
description = "Ons datacenter in Singapore is als een van de belangrijkste communicatiehubs van de regio Azië-Pacific uitgerust met een levendig ecosysteem van telecommunicatie en internet"
full_description = '''<img src="https://secure.leadforensics.com/56168.png" style="display:none;" /> Global Switch maakt gebruik van cookies om de functionaliteit van onze websites te optimaliseren en ons in staat te stellen u te onderscheiden van andere gebruikers van onze websites, zodat we u een betere gebruikerservaring kunnen bieden. Zie ons Cookiebeleid voor meer informatie. Klik op Akkoord om alle cookies te accepteren of klik op Cookievoorkeuren om uw instellingen te wijzigen. Akkoord Cookievoorkeuren Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Contact Contact Verkoop Informatieaanvraag Customer Services Engels Duits Frans Mandarijn Nederlands Spaans Traditioneel Chinees Klantenportal Locaties Overzicht Amsterdam Frankfurt Londen Madrid Parijs Hong Kong Singapore Oplossingen Overzicht van Oplossingen Ruimte en Energie Ontwerpen en Bouwen Customerservices Ecosysteem Overzicht Connectiviteit Service Providers Clouddiensten Datacentres Redundante Infrastructuur Datacenteromgeving Certificeringen Informatie over Certificeringen Duurzaamheid Over Ons Overzicht Waarom Global Switch? Bestuursleden Het Managementteam Nieuws Bij ons Werken Bondholder Relations Login Profile Reports Green Bonds News Contacts Hulpbronnen Brochures ESG Woordenlijst Beleidsverklaringen Technische Specificatie Obligatiehouderdocumenten Singapore Startpagina Locaties Singapore Datacenters Singapore Het datacenter van Global Switch in Singapore Tai Seng bevindt zich in de buurt van het financiële district en het stadscentrum, en biedt toegang tot alle onderzeese kabelsystemen die uitkomen in Singapore. Singapore bevindt zich in de ideale positie om de snel groeiende markten in de regio Azië-Pacific te bedienen. Het is uitgegroeid tot een strategische link en een belangrijke toegangspoort voor wereldwijde investeerders. Het tweede datacenter van Global Switch in Singapore is gevestigd in Woodlands, aan de noordzijde van het eiland. Dit datacenter bevindt zich op korte afstand van de twee belangrijkste bestaande datacentergebieden in het oosten en het westen. Singapore Tai Seng Global Switch Tai Seng staat bekend als de belangrijkste wereldwijde connectiviteitshub in de regio Een hoge concentratie grote ondernemingen en aanbieders van connectiviteit Regelmatige controles op naleving van veiligheidsnormen door financiële toezichthouders, internationale banken en grote internationale bedrijven Ongeëvenaarde staat van dienst op het gebied van constante stroomvoorziening en koeling Global Switch Tai Seng heeft een vloeroppervlak van 26.743 m2 Lees meer over Singapore Tai Seng Connectiviteit Het datacenter van Global Switch in Tai Seng is uitgerust met een levendig, continu groeiend ecosysteem van telecommunicatie, internet en netwerk-PoP's voor alle Tier 1-telco's. Bovendien heeft dit datacenter het unieke voordeel dat hier meerdere onderzeese kabelsystemen rechtstreeks op de vestiging uitkomen. De belangrijkste internet- en cloudserviceproviders zijn hier aanwezig, waaronder ISP's, de grootste eigenaren en distributeurs van content, webportals en sociale media. In combinatie met de aanwezigheid van de Singapore Internet Exchange (SGIX) veranderen deze organisaties het datacenter in een complete connectiviteitshub van waaruit de hele wereld bereikt kan worden. Infrastructuur Ter ondersteuning van haar strategische belang is Global Switch Tai Seng uitgerust met meerdere redundantielagen en wordt een speciaal Critical Environments Programme [programma voor kritieke omgevingen] nageleefd om een ongeëvenaarde operationele staat van dienst met een gestandaardiseerde klanteninterface te garanderen. Singapore Woodlands Meerdere aansluitopties tussen Woodlands en de Global Switch Tai Seng hub Ultramodern ontwerp voor meer flexibiliteit en schaalbaarheid LEED Gold- en BCA Greenmark Platinum-gecertificeerd met een onafhankelijk geverifieerde ontwerp PUE van 1,34 bij volledige belasting Ontwikkeld om aan de beveiligingsvereisten van plaatselijke en internationale toezichthouders te voldoen Global Switch Woodlands heeft een vloeroppervlak van 25.157 m2 Lees meer over Singapore Woodlands Connectiviteit Het datacenter biedt meerdere mogelijkheden om verbinding te maken met het al actieve ecosysteem dat opereert vanuit het Tai Seng-datacenter van Global Switch, deze staat al bekend als een van de belangrijkste communicatie knooppunten van de regio Azië-Stille Oceaan. Het datacenter biedt vier verschillende toegangspunten en twee speciale Meet Me Rooms om een ongeëvenaarde diversiteit aan connectiviteit te bieden. Infrastructuur Als het nieuwste datacenter in Singapore en haar State of the art ontwerp biedt het meerdere lagen van redundantie en flexibele, schaalbare oplossingen waarmee klanten hun vloeroppervlak heel eenvoudig kunnen laten meegroeien met hun bedrijf. Het datacenter heeft een energiezuinig ontwerp met lage exploitatiekosten en is een ecologisch groen en duurzaam datacenter. Net als bij alle andere datacenters van Global Switch worden operationele topprestaties gehandhaafd middels voortdurende verbeteringen aan de hand van het speciale Critical Environments programma. Meer Informatie Of u nu op zoek bent naar een enkele rack of een op maat gemaakte multi-megawatt datahal, ons ervaren team staat voor u klaar om advies te geven en de mogelijkheden met u te bespreken. Singapore Tai Seng 2 Tai Seng AvenueSingapore 534408Telefoon: +65 6958 1800salessingapore@globalswitch.com Singapore Woodlands 7 Woodlands HeightSingapore 737858Telefoon: +65 6958 1800salessingapore@globalswitch.com Downloads Technische Specificatie Singapore Tai Seng Technische Specificatie Singapore Woodlands Technische Specificatie Singapore Tai Seng Brochure Singapore Woodlands Technische Specificatie Singapore Woodlands Technische Specificatie Singapore Tai Seng Locatie Het datacenter bevindt zich op 9 km afstand van het financiële district en het stadscentrum Het plaatselijke metrostation is 10 minuten lopen en er rijdt een bus Changi Airport ligt op 15 km afstand Overzicht Gebouw Global Switch heeft een erfpachtovereenkomst met recht van verlenging op een extra 30 jaar Gebouwd om als datacenter te kunnen fungeren Operationele prestaties die Tier III overtreffen 26.743 m² brutoruimte 7 datavloeren Flexibele IT-ruimte met mogelijkheid voor op maat gemaakte ruimten Belangrijkste Kenmerken van de Structuur Stalen frame met vloeren van gewapend beton, metalen gevelbeplating en beglazing Vloer-tot-plafondhoogte van 4,1 meter Verhoogde vloerhoogte van 600 mm Minimaal vanaf verhoogde vloer: vrije hoogte van typisch 3 meter tot onderzijde van laagste balk Vloerbelasting van 5 kN/m² en 7,5 kN/m² 2 goederenliften (3,5 ton), 2 personenliften Stroom 22 kV stroomvoorziening met N+N redundantie Capaciteit stroomvoorziening van 30 MVA (huidig en gepland) Technische (IT) stroom geleverd door on-site 2N statische UPS in hoofdgebouw en door Diesel Rotary UPS met N+1 gedistribueerde redundantie in de uitbreidingsvleugel Mechanische systemen met een back-up van een dieselgeneratorsysteem voor het hoofdgebouw met N+1 redundantie Volledig gescheiden stroomverdeling naar technische ruimtes Brandstofopslag op locatie voor 24 uur werking op vollast met 24x7x365 brandstoflevering Standaard wordt 1.000 W/m² aangeboden, volledige ondersteuning voor hogere stroomdensiteit Koeling 30 MW geïnstalleerde koelvoorziening Minimaal N+1 bedrijfszekerheid op alle systemen 