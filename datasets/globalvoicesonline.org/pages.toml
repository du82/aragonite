title = "Republishing Guidelines · Global Voices"
description = "Unless otherwise stated, all content created by Global Voices is published under a Creative Commons Attribution-Only license. This means that anyone, anywhere has the right to: Share — copy and redistribute..."
full_description = "Stay up to date about Global Voices and our mission. See our Privacy Policy for details. Newsletter powered by Mailchimp (Privacy Policy and Terms). See all those languages up there? We translate Global Voices stories to make the world's citizen media available to everyone. Unless otherwise stated, all content created by Global Voices is published under a Creative Commons Attribution-Only license. This radically “open” license encourages redistribution of Global Voices content as widely as possible, as a public good. When you share, republish or translate our stories, you must include a link to the original Global Voices story and the name of the author at the top of the republished post. IMPORTANT: Photos, video, audio sourced from other creators may not always be available on the same terms. You must seek permission directly from creators to republish their work. Please let us know when you republish our stories by either commenting on the original with a link, or sending a note to the Managing Editor using our Contact form. It makes us happy! We have numerous reciprocal republication partnerships with websites in different languages. If you would like to republish our stories regularly or under special terms, please contact us. Contributors to our sites should understand that all content published on Global Voices bears the Creative Commons Attribution license described above. This means Global Voices stories and other content may appear in other places on the web as others take advantage of the openness of our license. Both authors and Global Voices have permanent and irrevocable permission to republish the content as long as the original is attributed as described above, to meet the conditions of our CC-BY license. If a contributor ever wishes to remove their public byline from a story, for security or other reasons, they should contact the managing editor and provide a link to the article(s) in question and an explanation of why this is necessary. Posts will not be deleted, however, as Global Voices retains the right to publish them through the Creative Commons license. We also do not have the ability to alter or remove public bylines and stories that have been republished on other sites, under the terms of our CC license."
year_published = 2024
year_updated = 2024
