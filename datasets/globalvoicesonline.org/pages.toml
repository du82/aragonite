title = "What Is Global Voices? · Global Voices"
description = "Global Voices is an international, multilingual community of writers, translators, and human rights activists founded in 2004. Together, we leverage the power of the internet to tell stories that build..."
full_description = "Stay up to date about Global Voices and our mission. See our Privacy Policy for details. Newsletter powered by Mailchimp (Privacy Policy and Terms). See all those languages up there? We translate Global Voices stories to make the world's citizen media available to everyone. Global Voices is an international, multilingual community of writers, translators, and human rights activists founded in 2004. Together, we leverage the power of the internet to tell stories that build understanding across borders. How do we do this? Except in the case of specially commissioned projects, Global Voices does not compensate writers or translators financially. Global Voices typically runs one or two active special projects at a time. Active projects include our Civic Media Observatory and our ongoing Translation Services project, which offers translation work to like-minded organizations for a fee. In addition to writing and translating stories, our community of volunteer contributors provides a breadth of local knowledge and connects Global Voices with like-minded initiatives around the world. Meet our contributors. Media and NGO partnerships are also a key component of Global Voices’ work as a community, a media organization, and a network of free expression advocates. Learn about our partnerships. Global Voices is led by a diverse, gender-balanced management, editorial and administrative team whose members come from many different countries and speak dozens of languages. Meet our leadership team. Global Voices is governed by a board of directors which include our founders, community representatives, and some of the most influential innovators in global online media. Board members serve without remuneration. Meet the board. Learn more about our work and team in our Roles and Responsibilities page of the Global Voices Community Guide. Global Voices is incorporated in the Netherlands as Stichting Global Voices, a nonprofit foundation. We rely on independent grants, editorial commissions, and corporate and individual donations. Read more about our work and financial structure in our annual reports."
