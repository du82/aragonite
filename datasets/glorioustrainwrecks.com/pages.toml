["https://glorioustrainwrecks.com/node/165"]
title = "Tools | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hey, let's have a thread listing all of the rapid game development tools we know about! I'll keep the list updated. Klik N' Play (free, terribly buggy, doesn't work on 64-bit, beloved by all) Twine (free / open-source, creates web-based text games with a nice no-programming GUI interface) Scratch (free, multiplatform, designed as an educational tool) Construct Classic (free, open-source, Windows, not really updated) Stencyl (free lite version, multiplatform, produces Flash games) Game Maker (free lite version, Windows) Ren'Py (free / open-source, crossplatform everything, great for visual novels, questionable for anything else) Inform 7 (free, creates multiplatform interactive fiction) Knytt Stories (free, Windows, flexible platforming level editor) Adventure Game Studio (free, games vaguely crossplatform, editor Windows-only) Multimedia Fusion / The Games Factory Construct (HTML5 output, free lite version) Processing (free, multiplatform, simple Java-ish programming environment) Unity (free, multiplatform, 3D, requires programming) ---- TOOLS BEYOND THIS POINT ARE WEIRD ---- BYOND (free, networked) VERGE (free, RPG-oriented, crossplatform) MegaZeux (free, textish, platforms?) ZZT (DOS, even more textish) Scrolling Game Development Kit (free, Windows) Scrolling Game Development Kit 2 (free, Windows) Ray Game Designer 2 (free, 3D) ZGameEditor (free, 3D, crossplatform, procedural) Novashell (free, crossplatform) DS Game Maker (Nintendo DS) AMOS / STOS (Amiga / Atari ST) Garry Kitchen's GameMaker (C64) Anything else worth looking at?rest in peace, klik leechin' ›"
