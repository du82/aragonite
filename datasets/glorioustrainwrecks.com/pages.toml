["https://glorioustrainwrecks.com/node/11056"]
title = "TRAIN WRECK | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Linux): train wreck linux.zipGame File (Mac): train wreck osx64.zipGame File: TRAIN WRECK.zipGame link: http://www.wendywildshape.com/projects/train/Enjoy a thrilling trot in the shoes of a strange creature along the tops of the freight train to Altoona. Many say that the creature that rides the rails will surely lead to ruin. Perhaps, but it knows no other way to exist. Try not to trip and crash into any of the horrifying tears in reality as your all-important score scrolls higher and higher.Author: Wendy WildshapeEvent Created For: Planning the Glorious Trainwrecks @ BBCastles InstillationMade For: An event The visual-corruptions mix with the audio-corruptions well. I kept trying to figure out if the audio-corruptions were somehow directly affected by whether or not I was in the air, or which train-car I touched. I never managed to figure out if it was just recorded that way or if it was dynamic; I prefer not being able to tell. nice job. this was fun to play. the glitch visual aesthetics worked really nicely. and play was fast/responsive. music works well tooo yowza, quite a psychedelic trainride, i absotely looove the gameover screen1! idk the way the score floats and everything is so cool lol"
