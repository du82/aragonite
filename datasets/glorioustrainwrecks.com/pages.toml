["https://glorioustrainwrecks.com/node/10472"]
title = "~ Event ideas plonking thread ~ | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Plonk your event ideas here so you don't forget them, and we can talk about them!‹ Deleted account and user ban Independent Magazine Ad for Glorious Trainwrecks › I was just thinking about doing a pets event. I didn't find time to make anything for FLATGAME, but I was going to make something about getting my cat, and living with her for her/our first year. Animals are my favourite, and I would love to play more games about animal-x-people relationships :) There's still a couple of weeks to make a flatgame! I'm still hoping to make one. I mentioned these in the Discord channel, but some time (maybe this year) I'd like to make events devoted to creating a bunch of custom VVVVVV levels, putting out a flickgame mixtape (flickstape??), and doing another big collaborative Knytt Stories level. I thought it was due on the 7th instead of the 27th! Well! (Yeah, I kinda made this thread because people were talking 'bout event ideas in the Discord) I took it to mean I we could chill out on it and just add some more art-assets for a couple of weeks. I'm thinking about games that offer a series of binary choices: you can choose one or the other, and there's no going back. I imagine a series of possibilities, the lot of which resembles a "tree" that spreads as the number of different alternatives emerges. The player's path resembles a "vine" along this tree, where they can only go forward, not double-backing on their path to see an alternative to a previously-determined choice. The complexity is obscured from the player until the very end, when they see just how drastically different their "end state" is when the game is complete. Not sure if I'm articulating this very well. My apologies. Some sort of goal would need to be established, or else it would only be a puzzle or a toy instead of a game.'''
