full_description = "Sekret Santa 2024.3 weeks 4 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: mr babbo.zipCAN YOU UNLOCK THE MYSTERIES OF MR BABBO??????? Click the link above for everything you need to know about Mr Babbo, or download and play immediately and don't pay attention to words on your screen. Actually how about I give you more details about what went into this: This is easily my largest game yet, and one of the biggest projects I've finished. I've learned a lot on the way, and had much fun! I hope you all enjoy!! Or at least some of you. A lot of time, effort, and tears (maybe) has gone into it, and I think everything I've made for it reflects a lot of myself. Think of that what you will. And before you ask: the gif above, sadly, does not reflect the actual game strongly. I just put that together for fun. If you are interested in working with the source and/or peeking at the secrets like the bad player you are, keep in mind that this was edited for release in The Games Factory 1, which isn't as easy to get as Klik'N'Play. I have no idea how backwards compatible this version would be in KNP, and I do know a couple changes I've made would mess it up in KNP a little. As such I've uploaded the slightly older KNP files, which you can nab here. One of the frames in this version crashes sometimes and I have not been able to fix this within KNP, sorry about that.Event Created For: The box of Ice 2 J**Y K 2015Made For: An event With some tweaks. The looping sound was lagging the game so much I had to take out any looping sounds because they were making things so slow that 20 burglars or 20 skaters were showing up on screen at once... Things were slow but everyone was still spawning. I don't know what to think of this game cept that the visuals are great.. The levels are pretty long so I'm not sure if a wav file is the approach I'd go unless you're using soundfonts to endow the music file. I love the animations and they make me happy viewing them.. and level 3 is just wow.. I don't know the requirements to get to the frames I haven't seen, it looks tuff to come by, but it makes me drink joy in a can.. cans need joy, and this game delivers it straight to the can. Thank you for sharing -bc_ ehiao apaoe h"
