["https://glorioustrainwrecks.com/node/12075"]
title = "Worryspider in Picnic Panic | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Worryspider in Picnic Panic.zipA simple little high score game. Try to collect as many apples as you can for your picnic date with your friend. c: It's inspired by and a fangame of "Worryspider in: The Garden" by &t / bpseudopod. Please go play it, it's wonderful! https://www.glorioustrainwrecks.com/node/11987 The character was created by and belongs to them. I love this anxious little spiderling so much. It's probably a bit too hard, and the controls take some time getting used to. I recommend looking at the 'how to play' screen. ~ controls ~ arrow keys - move left and right X - shoot a spiderweb in a straight line C - shoot a spiderweb in a diagonal line hold X or C and use the arrow keys to swing from the web release X or C to let go of the web Go get those apples~ Can you beat my own high score of 12?Made For: An event A difficult game where you collect as many apples as you can? This is certainly a worryspider game! I love games with pendulum physics, and controlling worryspider is a lot of fun. This game feels like it has a lot of love in it, from the evocative backgrounds to the kind messages at the score screen. This is great! Spider like game feel! I like the action arcade progression. I love this web mechanic, would be fun to see used in other ways too.'''
