["https://glorioustrainwrecks.com/node/12041"]
title = "Independent Magazine Ad for Glorious Trainwrecks | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Greetings humans, I posted this in the altgamez Discord as well, but I've heard not everyone on here is in that server, so I'm forwarding it onto here. I've purchased a half-page ad in this new kickstarted indie TTRPG magazine called Project NERVES (https://www.kickstarter.com/projects/nerves/nerves) and I'd like to dedicate it to the Glorious Trainwrecks website. I volunteer my time to create it myself. My idea is to create a collage of screenshots from various games on the site and put some text over it directing people to the site. I'd try and match the general vibes/aesthetic of the site as best I can and I could share progress on the ad as I make it for feedback. Otherwise, if anyone closer tied to the site would like to make the ad, let me know. It's 104x90mm (WxH). I'd like to do the site as much justice as possible. I don't wish to misrepresent, so feedback will be important. If people feel like the garnered attention from it wouldn't fit the small site, I'd totally understand. Seeking input and a dialogue with the community. I won't go forward with it unless people here give me the OK.‹ ~ Event ideas plonking thread ~ Server Move › I'm OK with this. Assuming you go with this approach, I look forward to seeing what kind of games you pick, and what text you come up with! Personally, I think this is a generous gift to GT. Thank you very much! Please post your drafts here if you'd like folks to provide you with some feedback and critique before submitting it to the magazine."
