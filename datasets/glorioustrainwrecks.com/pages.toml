["https://glorioustrainwrecks.com/node/9571"]
title = "Lovely Warriors of Friendship | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more http://biancagames.com/LWF.htm Lovely Warriors of Friendship is a platformer type game featuring characters from Pre ty Cure, My Little Pony, Mega Man, Pokemon, and many more (and soon Castlevania 10!!!). There are something like 70 characters in total. I noticed it when it was on Steam Greenlight, but I tihnk since then it's been (unsurprisingly) taken down :( Gooberlord Jim Sterling did a mean video about it. I nominate Lovely Warriors of Friendship for glorious trainwreck status.‹ The 3DO Is The Official Console of Glorious Trainwrecks FRED'S EXCITING ADVENTURE [Halloween Prank/Artgame] › I'm kind of into this! Actually playing it is a bit of a slog though, I got up to the second stage of Discord's Fortress with Vanellope before tiring. But I've never been that into Mega Man style games, regardless of quality. The roster is amazing. It even has Pea-Guy (formerly Pac-Guy)! I'd virtually forgotten those games existed myself, so I'm really floored by this inclusion. What does your mention of Castlevania 10 mean? Did you reach out to them, or vice versa? Could I work out a similar licensing contract if I wanted? For people considering trying it, Umbra is probably the most technically impressive stage, but also one of the hardest. http://curelovelywarrior.deviantart.com/art/Andate-Lovely-Warrior-of-Friendship-558236832 http://curelovelywarrior.deviantart.com/art/Andate-Lovely-Warrior-of-Friendship-558237264 So... it's been done. Hello... creator of the game here. I've been looking around at this website, it seems to share similar views to me about making games for fun and stuff and about not caring too much about Marketing or being a quality nazi and stuff. I admit, submitting to Steam was probably a mistake, but... my intent was just to reach more people with the game to make them happy. I had no intent to make money, nor did I forsee that such a train would blow up the way it did. @sergiocornaga Yes, Rylie did reach out to me. If you want a character of your choice added to the game, no "licensing contract" or anything is neccessary. Just make a request to me. As long as I don't start getting overwhelmed, I will try to fulfill the requests that are made to me (only had 3 so far). Only rule I have is that the game itself, Lovely Warriors of Friendship, must remain family/kid friendly and not contain any objectionable content like gore, swearing, or sexuality. There is no limit however to what series the characters can come from. So if there is a character you'd like to see added to the game, please just let me know, and I will see what I can do. Hope you have a lovely day. ♥ P.S. nice to meet a fellow Pea-Guy fan/player. AttachmentSize Lovely39.png246.43 KB Lovely38.png345.99 KB'''
