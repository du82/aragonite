["https://glorioustrainwrecks.com/node/10943"]
title = "Collab Jam | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Fri, Jan 19 2018 12:00 AM Start: 01/19/2018 - 00:00 End: 02/18/2018 - 23:59 Timezone: Etc/GMT-7 Collab Jam 2018 Collab Jam is a chance to work together with another randomly assigned member from GT! You may work together in any way you can agree on. How To Join: 1. Leave a comment below to be added to the list of collaborators. 2. Once the Jam starts, you will receive a PM with your collaborators name. 3. Communicate with them here or through the unofficial Discord, or however you both prefer! 4. Work together to produce 1 final game. Suggestions: In your sign up comment, leave a few general things you're interested. Probably keep entire game ideas for discussion later. But listing themes, inspirations, etc could help your collaborator to understand your mindset. [Specific Person] and I would like to work together Great! To make sure you don't accidentally get assigned with somebody else, please don't leave a comment below. That won't disqualify you from posting your collab games to this event! [Specific Person] and you can work together to produce 1 final game and then submit it here by the deadline. I can't / don't want to code No problem! I'm assuming we won't end up with more than 50% of the collaborators like this, so it won't be an issue. But if you can't or don't want to code during this jam, make sure to say so in your comment. Games made for Collab Jam 3 games made! View a random selection RSS Feed NameCreatedByScreenshotComments Ludus Antioch03/16/2018 - 04:01Trouv6 Li went to flounda's house and this is what he told me (with quasiotter)02/20/2018 - 09:29penguin9 Matthew's Dungeons of the Unforgotten02/05/2018 - 03:48sergiocornaga5"
