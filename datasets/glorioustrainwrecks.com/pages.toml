["https://glorioustrainwrecks.com/node/11128"]
title = "Mr. Petes is the glue that holds this building together. | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Linux): MrPetesistheglue_lin_2018-4-29.zipGame File (Mac): Mrpetes is the glue_mac_2018-4-29.zipGame File: MrPetes is the glue_win_2018-4-29.zipMr. Petes is the glue that holds this building together. -a museum game where you can walk through the process of making an artgame few have played. Use wasd and mouse to move and look around. The game can be exited by jumping off the world or by pressing alt+f4 The original game, "Mr Petes is lost! (for hugs)" can be downloaded for play on Glorious Trainwrecks. https://www.glorioustrainwrecks.com/node/10957 I decided to use this as my Introduce Yourself game because the other one I started needs a lot more love first and this felt pretty relevant to me being here on this site specifically. I'll probably upload the other game too when I finish it.Author: clydeEvent Created For: Introduce Yourself: All Aboard The GameMakingMade For: An event Very cool companion piece to the original game, I really enjoyed discovering the underlying thought process and inspirations in such detail. lol, this was so good! i love knowing the process behind things. everytime i watch a movie, i go on wikipedia and then imdb. every commercial game i play i also do wikipedia, read old reviews and such, and watch a speedrun if it isn't too long. i usually do this after i experience it, though. but it's funny that i don't really do much research when it comes to indie/trashgames? lol. i have a reallllllllly short attention span and i want to play as many games as possible. tiny games accelerate that even further. so i end up missing a bunch of stuff. this past week, since my game roundup took 5 hours to do write up and get screenshots and make a cover image, i realized i ought to play less games but just more carefully. and actually, keeping track of games is a good way to remember to revisit some of them. it's kinda hard finding a balance between really getting into a game and playing as many as possible before i perish. v ybirq frrvat gur jubyr tvey sebz gur zbivr gurnger yby (rot13.com)'''
