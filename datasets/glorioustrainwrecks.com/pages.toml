["https://glorioustrainwrecks.com/event/2018/01/29/day/all/all"]
title = "Events | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more August 27th was Knytt Stories' 10th birthday! To celebrate, let's make a collaborative level for this "epic" level competition hosted by Fubaka, which has a final due date of February 28th 2018. The main requirement for this competition is that levels have at least 300 unique screens, which we've already exceeded. Huzzah! We'll be using The Cursed Gallery as a framing device. Basically, Juni encounters a gallery filled with paintings of different participants' sections, and can travel inside them. Each section can be self-contained in terms of powers, but it will be cool to link all the different sections more directly once the level starts coming together! Vegetal Gibber has already designed a beautiful main hub area that's just waiting to be populated with portals! The level will require Knytt Stories +, so participants should feel free to go wild with KS+ stuff if they want. In particular, we are hiding KS+ artifact collectibles in hard-to-reach areas for a currently undetermined purpose. You can keep track of that using this handy spreadsheet (and leave little notes to other participants if you want)! Some discussion is going down in the #hot-jamz channel of the altgamez Discord server, so drop by there if you want to stay totally in the loop! I get the impression the most pertinent stuff has appeared in the comments of this very page, but perhaps that could change. So, comment or "sign up" if you're interested in participating, or even just make something, upload it, and hope for the best! Feel free to ask questions (but given the loose, last-minute nature of this event you could also feel free to provide your own answers).'''
