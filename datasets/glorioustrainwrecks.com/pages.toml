["https://glorioustrainwrecks.com/node/11133"]
title = "IQ: Intelligent Qhess | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Intelligent Qhess.zipGame link: https://skirtdingo.itch.io/intelligent-qhessIntroduction Chess was occasionally criticized in the 19th century as a waste of time. Intelligent Qhess encourages this notion. Intelligent Qhess is here to elevate the meaning of Chess. It is a new beginning in the world of intellectual thought. In Intelligent Qhess, you will have to reconsider all of your preconceived notions about Chess, Imagination, and Life. Getting Started To begin playing, download, unzip, and run Intelligent Qhess.exe. The menu and gameplay of IQ are controlled completely by the mouse. On the main menu, you will have two sets of options: player modes, and gameplay settings. Choose a suitable player mode: IQ can be played by 1, 2, or 0 people! If you are playing by yourself, I recommend having a match against CPU L2 to start with. But nothing will ever be more strategic then the wit of another human opponent... When you are ready, click on the "BEGIN MATCH" button! The game will begin immediately. On your turn, simply click on a piece to select it. Then click anywhere on the board to attempt a move. Further, more detailed instructions may be found in the README. Linux Compatibility You can play this game on Linux using WINE! If you are using 64-bit Linux, and the game starts without any sound, you might be missing 32-bit libraries for your default sound device. As a common example, if your setup is PulseAudio on 64-bit Debian/Ubuntu, you can install 32-bit libraries using the apt-get utility: apt-get install libpulse0:i386 Credits Game design, music by Nikki Bee Announcement voiceover is by Decky Coss Graphics and sound effects by Clickteam Title art ripped and edited from I.Q.: Intelligent Qube Made in Clickteam Fusion 2.5 More detailed credits are available in the README.Event Created For: Introduce Yourself: All Aboard The GameMakingMade For: An event'''
