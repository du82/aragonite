["https://glorioustrainwrecks.com/node/12337"]
title = "Oops, I managed to break outgoing email and not notice for six months again | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more I swear this happens every couple of years. Sorry! An OS upgrade carried out around January 22nd caused an issue that silently prevented outgoing emails from being delivered. I have fixed the issue and Glorious Trainwrecks should once again be able to email you. If you sent a PM through the site to someone between January and now, and never got a response, it's probably because they never got the email. IDK if people even use that feature anymore though. Gory details: NixOS 22.05 deprecated support for ssmtp, so I switched to msmtp. I tested msmtp directly when this upgrade happened and it worked! However, it turned out that my configuration accidentally depended on cat being available in the running program's PATH, which, it turns out, was true when I ran it from my local login shell, but was _not_ true when PHP was running it. YEARGH.WAV.‹ Discord Server File hosting changes ›"
