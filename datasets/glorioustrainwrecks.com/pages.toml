["https://glorioustrainwrecks.com/node/12457/revisions/view/20130/20131"]
title = "Diff for coast (for astralCastoff) | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Linux): coast_source.zipGame File: coast_release.zipummm here is my "video game" secret info: f4 to fullscreen, game autosaves, delete the ini file it creates to restart your progress requirements: A combination/clash of two themes/aesthetics that aren't typically seen together A gimmick or mechanic that leaves no corner of the game unscathed ("really? did it really have to also affect this?") Homemade ambient track A parable that teaches the player a lesson quite different from any parable they have heard before A fun or interesting character controller, or one with two different modes wasn't able to hit the second and fourth marks BUT i have achieved combining the aesthetics of 'pixel art' and 'vector flash gradients' as well as 'cute character' in 'uncute environment.' made a couple homemade ambient flavored tracks and movement is platformer but can also propel yourself by shooting credits: sound effects were made with jsfxr i did not make the song that plays in the bonus level the world 2 song uses a sample that's just a clip of another song, and it is not a song that i made. i don't know what song it is i found it in a silly video and i wasn't able to successfully find the source of the audio but i do know that i did not make itEvent Created For: Sekret Santa 2024.Made For: An event'''
