["https://glorioustrainwrecks.com/node/12187"]
title = 'Looking for the long-lost "Anti-Pokemon Trainer" games by Amazer | Glorious Trainwrecks'
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more I am trying to find a couple of Klik 'n' Play games I downloaded as a kid circa 2002/2003. They were called "Anti-Pokemon Trainer" / "Anti-Pokemon Trainer 2" and were created by a German guy called "Amazer" who was part of a greater (and edgy) "anti-Pokemon" community on the internet back in those days. Here is an archived version of Amazer's site where the games were hosted at one time. Here is an archived version of another site which also seemed to have hosted them for a time. Much of the gameplay consisted of shooting Pokemon characters as they bounced around the screen. Some other stages I can remember included an Old West shootout with Misty (from the Pokemon anime) which was actually decently challenging, and a space stage with a scrolling asteroid field that was pretty impressive for the KnP engine. There was an overarching plot with Jesus (from South Park) assigning you missions, silly little cutscenes between the stages, and a soundtrack of 1990s/2000s butt metal in MIDI form. I've been asking around various communities for many years to no avail, but hadn't thought to ask here before.‹ Business is a Living Organism by Peter Byers The story of the two pots and the water carrier ›'''
