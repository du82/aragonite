["https://glorioustrainwrecks.com/node/8253"]
title = "We need a new front page manifesto | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Inspired by this and also by a recent Twitter discussion. I think this place has evolved quite a bit since the early days. We used to be more specifically about throwing games together in Klik & Play, but now it's kinda grown into this inclusive place where folks can share their games and not worry about being put down for it unlike the toxic communities elsewhere. At the very least we should remove the parts about gusto and games having to be finished, but ideally it should be rewritten. It should still be evocative of the hobbyist, personal game making of the 90's, I think, but with a renewed focus on being inclusive. What do you folks think?‹ The Good Gam Jam Facebook. › I agree completely. It's been really eye-opening to listen to you guys talk about your initial perceptions of the community, especially lately now that I've been less active. I'm really happy to see the community find its own voice. If you folks write a new manifesto that better reflects our shared values and goals, I'm happy to replace the old one. (I don't know that I should be the one to write it.)"
