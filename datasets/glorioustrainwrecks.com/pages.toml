title = "Micesweeper | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Micesweeper v1.zipHelp the tiny little mouse collect all the cheese by sweeping a safe path for them, avoiding all the traps in the way! The game currently doesn't have a tutorial, sorry about that, so I highly recommend reading the included "how to play.txt". It contains all the controls and instructions on how to play. A tutorial might be added in a future version! But here are the basic controls: arrow keys - move the mouse, sweep, place flags X or shift - toggle between placing flags or sweeping escape - start a new level Thank you for playing!Made For: An event this is a blast! the graphics and sound effects are so cute, and the theme works really well for the puzzle constraints! and it helps a lot to know that there always _is_ a solution, even if it might require guessing: I've been having a lot of fun figuring out deduction rules for trap locations based on that fact. thanks for making such a delightful little game! - nikki I think I prefer this version of minesweeper. The picross-like hints really helped me in those all-too-common cases where you're walled off in a corner and the only way to progress is not by deduction but by taking a shot in the dark. AttachmentSize Screenshot_20210706_152450.png36.02 KB Thank you!! <3 Thanks for giving it a try. Honestly? I've always sucked at minesweeper. So it's kinda funny I ended up making a minesweeper clone. Love the little twist son the Minesweeper model. Having to move the mouse avatar instead of a mouse cursor is a neat change of pace, and I love the nonogram-style hints (even though I didn't notice them till after my first game D: ) Thank you so much!! Glad you enjoyed it. And oh gosh, it must have been really hard without those numbers/hints!'''
