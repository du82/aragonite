["https://glorioustrainwrecks.com/node/11122"]
title = "Love is like Pinball | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: PINBALL LOVE.htmlLOVE IS LIKE PINBALL a short experiment in a narrative(ish) pling game. hit the light blue X to go to the next stage I figured this would be a nice, easy way to introduce myself. HI EVERYONE! i made this in the middle of classes instead of paying attention. it wasn't worth it. let me know if you liked it, my body craves positive reinforcement, and I am excited to be a part of this *ahem* glorious website. edit: I UPLOADED THE WRONG VERSION THIS IS THE RIGHT ONE IM SORRY I PROMISE I WONT DO IT AGAINEvent Created For: Introduce Yourself: All Aboard The GameMakingMade For: An event On the one hand, I'm sad to hear you weren't paying attention in school. On the other, I topped out my high score at 165,000. Here's a screenshot of the game in progress... WELCOME TO GLORIOUSTRAINWRECKS DOT COM AttachmentSize pbl.png25.39 KB i never pay attention in school. at least with this i am being (semi) productive. also it feels amazing to be recognized by all these glorious trainwreck stars/geniuses/gods OH MY GOD I UPLOADED THE WRONG VERSION JESUS CHRIST THERE ARE SUPPOSED TO BE 6 LEVELS PLEASE PLAY IT AGAIN IM SO SORRY AHHH That was so reasonably optimistic and beautiful. I like the idea of themeing the challenge of a simulated traditional dexterity challenge (pinball) with something as archetypal as "love".'''
