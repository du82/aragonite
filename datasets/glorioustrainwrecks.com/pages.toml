title = "NEW SERVER | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more If you are reading this, Glorious Trainwrecks is up and running on a shiny new completely rootkit-free server that hopefully won't randomly lose internet access or freeze up! I'm currently running a script to update all passwords to be encrypted with bcrypt, which is an excellent password hashing system that makes brute-force password guessing computationally unfeasible. So if we're hacked again, no one can figure out your password! Hooray for modern security practices! If there's anyone out there running Drupal 5 that wants to use actual password hashing instead of just md5 with no salt, GET IN TOUCH, I HAVE A PATCH FOR YOU. THERE ARE LIKELY TO BE PROBLEMS. I am a fallible human and I forget things. Please post here about them! If you can't login to post about them for some reason, send me an email: eval(unescape('%64%6f%63%75%6d%65%6e%74%2e%77%72%69%74%65%28%27%3c%61%20%68%72%65%66%3d%22%6d%61%69%6c%74%6f%3a%6a%65%72%65%6d%79%40%73%70%6f%72%6b%74%61%6e%69%61%2e%63%6f%6d%22%3e%6a%65%72%65%6d%79%40%73%70%6f%72%6b%74%61%6e%69%61%2e%63%6f%6d%3c%2f%61%3e%27%29%3b')). That's it! AttachmentSize chickenAnimated.gif11.61 KB ‹ Facebook. Possible site breach › CURRENTLY BROKEN THINGS: - Nothing as far as I know! NOW FIXED THINGS: - outgoing email - password reset / new user registration - https I wanted to offer thanks or congratulations but that dancing chicken says things better than I ever could. Ah yes, new server, things fixed, yet we're still attacked by