full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game link: http://love-game.net/JIGGLYZONEWindows version:love-game.net/JIGGLYZONE.zip Welcome to the JIGGLY ZONE. Become JIGGLER and find the Medallions scattered Throughout the land. Experience a World of Treasures Like you have never Seen.... Joint work with Hubol. (twitter.com/hubol) Download the Official Sound Track here: hubol.bandcamp.com/album/jiggly-zone-ost Gallery/Babycastles Version: love-game.net/JIGGLYZONE_BABY.zip (last updated March 22, 2018, 5:53 PM EST) This version contains some small changes to make things work more smoothly in a gallery-type setting. If needed, additional changes can be made upon request (message @sylviefluff on Twitter or just post here). The game defaults to fullscreen. On the title screen, "New Game" is selected by default instead of "Load Game" (but players can continue where the previous person left off if they want!) The options menu is opened by holding Ctrl+O for three seconds rather than just pressing O, so that players are less likely to find it and mess around with it. Author: sylvie & hubolEvent Created For: Planning the Glorious Trainwrecks @ BBCastles InstillationMade For: An event BECAME THE ULTIMATE JIGGLER with just one item missing, right above the slot where the diamond goes. :/ Great game Thanks! If you want to see what that item is, if I'm not mistaken it's actually obtainable very early on without any powerups (it's in Emerald Forest ~ Eastern Grove). If you leave the trial room after collecting the sword, but before collecting the medallion fragment, the game bugs out and makes the fragment chest already opened, preventing you from collecting the fragment and by extension from completing the game. Having said what I came here for, the game is excellent, even though it sorely lacks a map of some sorts.'''
