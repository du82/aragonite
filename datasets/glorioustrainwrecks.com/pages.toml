["https://glorioustrainwrecks.com/node/1"]
title = "Home | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Glorious Trainwrecks is about bringing back the spirit of postcardware, circa 1993. It's about throwing a bunch of random crap into your game and keeping whatever sticks. About bringing back a time when you didn't care so much about "production values", as much as ripping sound samples from your favourite television shows to use in your game, or animating pictures of yourself making goofy faces on your webcam. Where every ridiculous idea you had, you would just sit down and code. When you would make up a "company name" to legitimize dorking around on the computer with your friends. It is not about unfinished, unplayable games. If any part of a glorious trainwreck is terrible, it is terrible in a way that is AWESOME. Together, you and I will bring the true spirit of indie gaming back. Yes, you! For this site is about nothing, if it is not about getting off your ass and creating. Wikipedia claims that they used to stage trainwrecks (with empty trains, of course) for the amusement of the general population. Would the world not be a better place if we brought this tradition back? It doesn't matter if you've got talent, so long as you've got gusto. Your game does not have to be coherent -- but it does have to be finished. IT IS TIME TO TAKE THE PLUNGE INTO GLORY. If you're interested in checking out the past of this noble genre, check out our Trainwreck Gallery, and post on our Trainspotting forum. If you want to follow the work of people creating trainwrecks today, check out the Development Diaries and the Locomotive Engineers forum. If you've taken up the fight and written a glorious trainwreck of your own, post it to the Hosted Trainwrecks page! If you want to keep up with what's happening on the site, visit the Recent Changes page, or subscribe to the feed in your favourite RSS reader.'''
