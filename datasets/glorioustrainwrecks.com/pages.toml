["https://glorioustrainwrecks.com/node/7143"]
title = "Facebook. | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hey. I've started using Facebook this year, and it's mostly replaced my calendar. It would be good if GT events were on there. Is it okay if I start and maintain a Glorious Traiwnrecks page on there? A page is better than a group, right; in regards to having attached events? Events should probably also be in the Twitter feed, I reckon. Or we could just take over https://www.facebook.com/GloriousTreats‹ We need a new front page manifesto NEW SERVER › On Twitter: I think this makes sense, since a lot of game jams get announced on Twitter anyway, and it would be easier to spread the word via retweet. One problem with this might be that a list of auto-tweeted events might fall into the background unless each new event has its own content for the tweet? Like at least a summarization of the event description?"
