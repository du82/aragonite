title = "alphabet prototype | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 8 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: alphabet prototype.zipalphabet prototype by nikki whom bee ATTENTION: the audio in this prototype can be loud, so I recommend turning your volume down before playing, to avoid being startled. also, the graphics may be hard on your eyes, so please quit if it's causing you any irritation. this was an experimental prototype I made 3 years ago meant to try a few different things at once. possibly the most interesting to me, and unfortunately the biggest issue, was using a generative sound extension, by Looki, that I found on a Clickteam forum somewhere. it works great and can make some really wild audio pieces with little effort. unfortunately, it seems to *only* work in Clickteam's editor itself. the game crashes if I try to build it as an exe. so, this version of the game has pre-compiled sound effects that I think are good. if you are interested in seeing what the generated audio can be like, and own a copy of Clickteam Fusion 2.5, check out the "dev version" folder included here! INSTRUCTIONS: - launch "_.exe" - you don't have to do anything at the intro, but you could try - once the prototype has begun, move with the arrow keys or wasd - you can resize the window by the maximize button or dragging an edge - finish the prototype by demonstrating mastery of language - upon reaching a finished state, the prototype will close automatically - you can also press Escape to quit early CREDITS: Code: me Graphics: Clickteam Extensions Used: Named Variable Object by z33z Sound Generator by Looki Sound Player by Looki SFX: made from Sound Generator, edited in Audacity Music: a midi I processed in OpenMPT, I don't remember what it was thoughEvent Created For: GT 15th Anniversary Klik JamMade For: An event'''
