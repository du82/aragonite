["https://glorioustrainwrecks.com/node/12385"]
title = "Chips and Chats (for Nighten) | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Chips & Chats.7zIt's Christmas (not at the time of release sry) and you've been making your friend a present. A big present. A present you've been gathering and reading up on for a year. Your making Gigi a computer! If the regular file doesn't work, try the dx12 version.Event Created For: Sekret Santa 2023Made For: An event Aaah I'm so excited to play it! But sadly the program seems to crash on startup; a blank window opens and closes after 2 seconds. I tried running it as admin, or even on the command line, but I didn't get any more clues. I'm on a standard Windows 10, maybe there is some dll I'm missing? Oh no! Have you got Microsoft C/C++ Runtime Redistributables installed? (https://learn.microsoft.com/en-US/cpp/windows/latest-supported-vc-redist?view=msvc-170#visual-studio-2015-2017-2019-and-2022) Cause bevy (the game engine I'm using) needs that to work properly. Ah okay I didn't had that! Now it's doing the same thing but I have some music playing before it closes, I'm not sure if that was the case before or if I was muted; but at least for sure the engine is starting, it just has an issue when initializing the game. Maybe something to do with the rendering? I've checked and I have DX12 installed, I'll see if I can find anything more on my side :) Edit: I have a Intel HD graphic chip, and it seems to have caused issue with Bevy in the past https://github.com/bevyengine/bevy/issues/509 I had a look at the link and the person fixed their issue by installing vulkan drivers. While you do that I'll try to compile an opengl or dx12 version Hey I know it's been a while but, poetically, I got a new computer and I was finally able to try again to see if the game was now working; and it did!! I'm really so happy about this; the concept is really creative and so well executed, this was adorable! You definitely hit the mark with the good vibe, thank you so much for making it. I'm sorry I was a bit shy and didn't want to bother you with remote debugging, especially since I couldn't provide much infos to help. But now it's all fine! Thank you once again for working on this gift, it truly warms my heart"
