["https://glorioustrainwrecks.com/node/11049"]
title = "YOU CAN ONLY DIE 80 TIMES | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Mac): youcanonlydie80times FOR MAC.zipGame File: youcanonlydie80times.zipGame link: http://www.wendywildshape.com/projects/80/Dear You, You have incurred my fearsome wrath! Love, Nummer, supreme wizard Cursed by the fearsome wrath of the supreme wizard Nummer to become immortal, you try to defy this annoyance by making yourself only able to die 80 more times. But the kicker is, you brought this on yourself, first by ruining her spaghetti dinner one time, and later mis-casting your spell to break out of her curse, reducing your immortality to being able to die only 80 times. To top it all off, you are on the way home and stuck in the Field Corridor, a dangerous zone. Your only help now is the fact that you can safely die 80 times, but keep in mind that it is only 80 times that you can die! If that wasn't bad enough, every time you do die, up to the limit of 80, your grasp of reality will be shaken dramatically by the withering curse of supreme wizard Nummer! WANT TO KNOW MORE? CLICK HERE FOR THE REAL STORY...Author: Wendy Wildshape & Nikki Bee & Decky CossEvent Created For: Planning the Glorious Trainwrecks @ BBCastles InstillationMade For: An event I am dodging a bus...! WHERE AM I? WHAT IS HAPPENING?!?!?! (PS: this game is fantastic. It will take you places. Wow!!!!) Whoa, this has way more levels than I remember! I think the vocal jumping sound effects are my favourite phenomenon. i think there was a shorter edition that was out for a while, this is the definitive edition the jumping sound effects are all nikki, they really are an amazing addition :) for fairness, I took all the jumping sfx from Quake 3 haha ps. there definitely was a short version for a while, and I was blown AWAY by this expanded version when I came back to the game a year later"
