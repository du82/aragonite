["https://glorioustrainwrecks.com/node/12169"]
title = "Melonman gets 25 stars | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Melonman.zipGame link: https://mutantleg.itch.io/melonmanI got this nasty habit of making games only I'm interested about (see Tank Squabble) anyway I remembered that back then there was this short flash game called cat gets 100 stars or something so i was wondering how something like that would work in 3D? also as usual i got lazy and there are only 25 stars enjoy!Made For: An event I really like the level design on display here--it feels like a Super Mario 64 level, or maybe even a Quake level, where it strikes a nice balance between representing a plausible space (some sort of castle, with a cute little courtyard) and being built to be traversed. I also like Melonman. he's a funny little guy I think I asked about this before, but what game engine are you using? Is it some sort of Quake-like, or is it an engine that you wrote yourself? its something i wrote myself (c++, opengl for 3D, openal for sound and various other libs: stb_image, stb_vorbis, dr_wav, miniz.h, pugixml ) yaaay i got all the stars. fun little game and i like how generous the respawn is. now i kinda wanna play super mario sunshine... mmmm...​ delightful... short... nice weighty controls.... this is what I like out of a platformer. panicked sometimes as some stars looked hard to get, but then turned out to be pretty easy. Technical credit: really smooth input. I've played a lot of games that feel like they have laggy (buffered), smoothed (delayed) or otherwise nasty input. Camera control felt beautifully precise. Mouse acceleration did feel a bit off, but I suspect you're adding that in yourself, given that you're getting "raw" mouse input? I'm running this under Wine so perhaps you're still getting pre-accelerated data, dunno. Physics was smooth, notably the camera avoided sudden jumps when "rising onto" platform edges from below. Thankyou for not jerking the camera around constantly. Once I discovered double jump I realised this map was easier than I thought :D Speedran it, lots of skips. Thankyou for sharing. Also thanks for telling me that I was entertaining :)'''
