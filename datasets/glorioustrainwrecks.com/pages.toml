["https://glorioustrainwrecks.com/node/11733"]
title = "Community-Driven Moderation | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hey everybody! This is a thread where I'm hoping to nail down and make explicit my perspective on how Glorious Trainwrecks functions as a community, my role in that as the founder and absentee landlord of the site, and how the community can hopefully be empowered to protect itself if necessary. Over the past... lots of years, it's become clear that I'm no longer very involved in the community; I don't regularly read the posts, I don't play the games, I don't post games here. As such, I don't quite think of Glorious Trainwrecks as "my" site anymore - it's your site! I just keep the lights on, and as always I promise to do so for as long as I am capable of it. So every so often, when a problem comes up, I have made noise to the effect that I think the community needs to have the tools to moderate itself. However, it's also becoming clear to me that people really like the way that I have run this place -- that my early work shaping the community continues to shape it, and that the community, over the past 13 years, has built up a lot of trust in me to do right by them. I don't want to betray that trust and I want the community to feel confident that no one else will betray that trust either. As such it seems that my role is probably always going to be a little bit bigger than just the janitor who keeps the lights on. So here is what I am thinking: If anyone sees something on Glorious Trainwrecks that is not okay, and they would like me to take action, I will continue to be responsive to PMs, as I have always been. (I'm also reachable quickly on Discord - SpindleyQ#2039.) I will continue to intervene, when necessary. I will continue to publicly reaffirm my vision of GT as a place where people are kind to each other, and where bigotry of all sorts is not tolerated. There are a few community members who have moderator-level abilities, currently they are sergiocornaga and Danni. They are longstanding members of the community who have consistently shown good judgement; I trust them to take the well-being of the members of Glorious Trainwrecks seriously, and to ask for help when they need it. Moderation is to be used as a response to harm. I will continue to post detailed justification about significant acts of moderation that I do; it is always important to make it clear and obvious to all that harm will be taken seriously, and that our response will be appropriate. And if our response was not appropriate, it is important to have a clear place for that conversation to happen, and to learn from mistakes. Moderation guidelines: If in doubt, talk to the larger community, other moderators, and/or me. Prefer reversible actions (unpublishing pages, blocking users) to non-reversible actions (deleting, editing). Take the necessary action to reduce harm to the greater community quickly, but _always_ follow up with the appropriate level of transparency. If the offending user is active, they should always be informed of what action was taken and why; they are going to notice, and it is important that they know what happened, even if they have been acting in bad faith. (This doesn't necessarily mean you are starting a dialogue, or that the moderation action is up for debate.) If serious deletion-level moderation was required, a community post should also be made with similar information; again, this makes it very clear to everyone what we stand for and what we will and will not tolerate. Do not feel like you must take any action alone. We are all here to help. Does this sound good to everybody? Is anything missing?‹ This is the place where you complain about the site. Discord Server ›'''
