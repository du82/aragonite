title = "Best GTs of 2018-2019? | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Please forgive me, mods, if this isn't the right place. Several boards seemed applicable -- this one the most. Hey guys! Idk if you remember me (Marek and Sergio might), but I showed up a few years ago to play a bunch of your games for a Youtube video or two, which turned out fairly well despite my inexperience. I've been out of action for a while now thanks to life, but recently I started seeing some traction (I'm not too far off hitting my first 10k video) so I can't see any reason to stall any further aha This place always struck me as THE place for experimental/weird/art games. Sure, I could crawl through Gamejolt and Itchio, and I probably will, but one of my favourite videos is the Glorious Trainwrecks-focused one, so I'd love to do a follow up. I was wondering what you would consider your favourite games posted here in the past year or two? I'm going to check out a few at random myself, but it ruins the surprise if I play too much (and screenshots aren't always the best thing to judge by). I'm looking for the particularly atmospheric, deranged and/or bite-sized but effective. Naturally you can expect positive criticism and an open mind. I prefer to showcase weird games to raise awareness of creativity rather than to mock. Might have a giggle at some glitches, tho.‹ I deleted an account today. t is an activity that a student has..... › I made it, but I'd be interested to see a Let's Play of Sprite Walls. https://www.glorioustrainwrecks.com/node/