["https://glorioustrainwrecks.com/node/12451"]
title = "Sekret Santa 2024. | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Sun, Dec 15 2024 05:56 PM Start: 12/15/2024 - 17:56 End: 01/30/2025 - 17:56 Timezone: Etc/GMT-7 "It's that time of year again!!!" "Ho! Ho! Ho!" "Don't Eat Too Many Mince Pies!!!" "Bring Us More Figgy Pudding" "Christmas" that's right it's christmas and it can only mean one thing secret santa. Last year's theme was "You're forgiven of your debt". This year's theme is your debt's back. sorry!! Post your "list" of things you want in your game below. on the 13th december, all the lists will be sorted randomly and you'll get invited to a 🤫secret discord🤫 if you want to share your WIPs with other people. you all know how it works by now!!!!! Let's have some fun!!!! soft deadline for submitting your game is "sometime in january" List Rules: - please keep it fair and try not overburden your santa with too many items - don't be too hyper-specific, and avoid specifying a genre. you're not commissioning a game, you're getting a mystery game!! ok go: Games made for Sekret Santa 2024. 7 games made! View a random selection RSS Feed NameCreatedByScreenshotComments Bug Mystery? The Explosion Speaks! (for bpseudopod)02/16/2025 - 16:14Alchiggins0 Lonely Space (for Alchiggins)02/05/2025 - 07:06akair4 Escape from Penguin Prison (for pikachu)01/30/2025 - 13:41kodiakwhale4 coast (for astralCastoff)01/24/2025 - 13:37pikachu3 Stardust the Super Wizard's Arcade Adventure (for HANSOV)01/09/2025 - 15:34Godahl2 THIF (for Godahl)12/28/2024 - 08:58mutantleg6 Ice Puzzle Peril (for akair)12/26/2024 - 23:55Hansov2 Hello! I had a lot of fun with this last year, so I figured I'd give it another shot. I'd like to see... - A very gimmicky gimmick - Some stuff from old public domain animation/comics/cartoons (bonus points for Stardust the Super Wizard, though it's not a requirement) - Something to do with pinball in some fashion Looking forward to doing this!'''
