full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game link: https://protohmgames.itch.io/harold-gets-orange-juiceSEIZURE WARNING, THIS GAME CONTAINS A LOT OF FLASHING AND MAY DO SOME SERIOUS DAMAGE, PLEASE BE CAREFUL Welcome to Harold's life, AKA getting some got-dang orange juice. There's only one glass left in a prison out in Arkansas or something. Harold will get this glass if it's the last thing he does. Better details on the actual game page, so feel free to check that description out. ANOTHER GAME FOR KOTM #104.Event Created For: TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104Made For: An event The best sound effect from that game. Besides "AAHH MY FINGER" and the really strange mouth sounds that happen all of the time. I am glad that nonviolence is an entirely viable approach. Exploiting the strangely sticky properties of either Harold or the trash bins (if not both?) was interesting. wow, that was really satisfying, even though i don't like the idea of breaking furniture, or causing any sort of negative impact on something... but actually, fuck the US prison system. john oliver had a good episode on them, which is saying something because i have a hard time with politics outside of minority issues. really dig the visual style most of all. can't comment on any of the references since i don't know them, but i'm sure they're funny.'''
