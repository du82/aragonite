full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more I have no idea if anyone will see this. I keep on forgetting about the forums. Anyways, I do a monthly gallery walking sim thing, and this month's show is about horses! It's an open invitation, and the goal is to be done by 1 August 2017 (lol). If you're interested, here's what you can do! ♥ images to be looked at in a gallery space (whether it's a purely digital work or a photo of a physical piece) ♥ images as texures ♥ gifs or tiny short videos can be used ♥ 3d models (.blend preferred, but I hear .fbx works well, too) ♥ haikus that I will make into 3D text ♥ other suggestions I'm using Unity for this, but I also would like to include files that exist outside of that, too—so everything will be in a .zip file. Here are examples: ♥ Text file (short story, ASCII drawings, etc.) ♥ webpages (.html files) ♥ Other games!! (bitsy, twine, etc.) ♥ Pages or templates for people to print and use (i.e., horse activity pages, cardboard horse templates) ♥ Whatever else You can PM me here and I'll give you my e-mail address! Past examples are here: http://woofwoof.life‹ dungeonscript gallery: need tiny pixel or voxel art! Free Sounds & Reference Tables › Is it fair to assume that you will accept stacks of horses? AttachmentSize StickItSticker_1499543654736.png548.64 KB omggggg i wish i ran dogblog but no :( that screenshot was one of my artist statements when i was in grad school lol yah basically if you want to put something in hourse show then you can post here or email me oliverblueberry at gmail.COMMERCE -MERCE so far clyde and my friend alex have put stuff in and i'm gonna make a drawing of hourse on skateboard tonight or tomorrow also this reminds me i need to play games here more lol"
