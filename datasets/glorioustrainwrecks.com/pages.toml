["https://glorioustrainwrecks.com/node/12460"]
title = "Bug Mystery? The Explosion Speaks! (for bpseudopod) | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: Bug Mystery.zipMaggie and Peter are bounty hunters - at least they were, until Maggie's ex-girlfriend Eleanor hires them to solve a mystery. Her rare insect collection was stolen, and she would like it back. Also, Peter is a sentient explosion, and I personally think that is really cool! Will Maggie and Peter find the missing bugs? Will Maggie win Eleanor back or will she finally listen to Peter and move on? Does a game count as a visual novel if you control a moving character? --------------------------------------------- Made for bpseudopod for the 2024 Glorious Trainwrecks Sekret Santa Jam, who requested a game with: -cool or nice bugs -a mystery -a betrayal -a talking explosion who is your pal This was a very fun prompt to work with! I hope ya like it! --------------------------------------------- Controls: arrow keys/WASD : move e/space/enter : progress dialogue esc : quit --------------------------------------------- Created using Game Maker Studio, GIMP, BFXR, and Lovely Composer! Thanks for playing! --------------------------------------------- More games here: alexandrah.neocities.orgEvent Created For: Sekret Santa 2024.Made For: An event"
