["https://glorioustrainwrecks.com/taxonomy/term/596"]
title = "adventure | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Maggie and Peter are bounty hunters - at least they were, until Maggie's ex-girlfriend Eleanor hires them to solve a mystery. Her rare insect collection was stolen, and she would like it back. Also, Peter is a sentient explosion, and I personally think that is really cool! Will Maggie and Peter find the missing bugs? Will Maggie win Eleanor back or will she finally listen to Peter and move on? Does a game count as a visual novel if you control a moving character? --------------------------------------------- Made for bpseudopod for the 2024 Glorious Trainwrecks Sekret Santa Jam, who requested a game with: -cool or nice bugs -a mystery -a betrayal -a talking explosion who is your pal This was a very fun prompt to work with! I hope ya like it! --------------------------------------------- Controls: arrow keys/WASD : move e/space/enter : progress dialogue esc : quit --------------------------------------------- Created using Game Maker Studio, GIMP, BFXR, and Lovely Composer! Thanks for playing! --------------------------------------------- More games here: alexandrah.neocities.orgEvent Created For: Sekret Santa 2024.Made For: An event FINALLY, we found you! Someone who is willing to work honestly and dig into the old mine. But wait, this is a special mine: instead of precious metal, you are excavating computer chips The game was made following noser's prompts for Sekret Santa 2023: - big pixels - limited palette - maze - momentum - archeology/digging - high-stakes climax You tell me if I delivered on that last item. The game is about 10-15 minutes long I think! THERE IS NO SOUND YET, I'm too tired for that so that's gonna go in a future release; it's a bring your own music and imagination kinda deal Edit: To move, hover the arrow button and press space. No need to click on them! Have fun, I'm happy that I can finally play other entries :)Event Created For: Sekret Santa 2023Made For: An event"
