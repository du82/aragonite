["https://glorioustrainwrecks.com/node/10935"]
title = "Wizard Shoes for Speedos | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 6 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game link: https://concerigames.itch.io/wizard-shoesFor speedos. Merry Klikmas!! ---- THIS HAS BEEN RESUBMITTED TO BABY CASTLES AS WELL.Event Created For: Planning the Glorious Trainwrecks @ BBCastles InstillationMade For: An event i give this the speedos stamp of absolute excellence!! just finished the game for the first time and now im playing again. i can see theres some good secrets hidden all around, i wonder...! thank you for the game and i hope you had fun makin it! :-) also this is some excellent music, it gets me all hyped up for spinning the wizard! just found a great secret! is there more? how many? :-) also i can see what you did with the legs- "sidekick"! haha, lovely! edit: whoops, i totally forgot that i actually did ask for legs, very nicely implemented! Unfortunately, I was cutting it quite close! There really aren't any more secrets unfortunately, mostly just coin spots. I don't have a game pad but I had my flight sim rudder pedals plugged in when i launched the game. So I played this game with the toe brake axis on my left foot. It was a good experience. I really like this game. The art music and sounds are great. The use of screen space texture shader is awesome. And the wizard just looks really cool. I'm impressed with how fleshed out this game is! I guess if you don't have shoes, you can't walk around outside. I love everything about this. Don't know what else to say. "Smash that like button for me and my homies." I have to say usually I avoid platformers as much as possible but this one was super fun! I really liked the rolling mechanic, it really made the whole thing feel new and it was interesting to try (and fail) to control. I especially enjoyed watching the stars on my outfit move with me. That was such a nice touch. I think this is the only platformer I have ever reached the end of in my life!'''
