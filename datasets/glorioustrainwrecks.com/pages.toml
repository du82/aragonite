["https://glorioustrainwrecks.com/node/10661"]
title = "POKOMON HELL | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: POKOMON HELL.zipAlright jim here's the final mission using that gun you picked up, kill all the remaining pokomon and master THEM ONCE AND FOR ALL!Event Created For: TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104Made For: An event I find it interesting how so many games begin with the character emerging from some kind of cave. When you take control of a character you have to square your own continuous life experience with this new, limited one. Because you're embodying this character and living in that character's universe there are metaphysical questions that arise: what is, and why is it here? what happened before our presence, and what will happen afterwards? what happens to our character after we stop playing? And of course these are mapped onto question of life after death in our own lives, etc etc. So, I find it really interesting that this game explores that a bit. That you get to spend time in this ambivalent but somewhat paradisaical mario paint pre/afterlife, punctuated by a brutish, hyperspeed, pokomon killing DooM life. Delivers the same kind of feeling I have when playing we all celebrate the birth of jesus christ: https://www.glorioustrainwrecks.com/node/10457 The background music choices you made were also fitting and catchy. Nice work! So which of your poko games came first? This one, or Invasion of the Pokomon? Invasion of the Pokomon was first! Unfortunately this one was really rushed so the only aspect I'm happy with are the music choices. There's an ending song too but even after changing the difficulty I don't think anyone will see it. i love stuff like 'we all get together to celebrate the birth of jesus christ', thanks for showing me!"
