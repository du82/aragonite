title = "visual novel | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Maggie and Peter are bounty hunters - at least they were, until Maggie's ex-girlfriend Eleanor hires them to solve a mystery. Her rare insect collection was stolen, and she would like it back. Also, Peter is a sentient explosion, and I personally think that is really cool! Will Maggie and Peter find the missing bugs? Will Maggie win Eleanor back or will she finally listen to Peter and move on? Does a game count as a visual novel if you control a moving character? --------------------------------------------- Made for bpseudopod for the 2024 Glorious Trainwrecks Sekret Santa Jam, who requested a game with: -cool or nice bugs -a mystery -a betrayal -a talking explosion who is your pal This was a very fun prompt to work with! I hope ya like it! --------------------------------------------- Controls: arrow keys/WASD : move e/space/enter : progress dialogue esc : quit --------------------------------------------- Created using Game Maker Studio, GIMP, BFXR, and Lovely Composer! Thanks for playing! --------------------------------------------- More games here: alexandrah.neocities.orgEvent Created For: Sekret Santa 2024.Made For: An event Game link: https://gisbrecht.itch.io/trans-mousegirl-adventureThis game is dedicated to all the trans friends I have <3 content warnings for: pee joke, non-explicit bad endings. Choose your own adventure: You are a little trans mousegirl who needs to get some food and medicine, but watch out, for a catgirl stalks to the house! Made in Candle's Tape Window Engine. Music Used: "Away" and "New House" Laika & the Tape Loops! https://lattl.bandcamp.com/album/sophisms SFX used: "Chuột Cống 3" by SieuAmThanh https://freesound.org/people/SieuAmThanh/sounds/546299/ "cat meowing" by nekoninja https://freesound.org/people/nekoninja/sounds/414042/ [Download Instructions: Unzip folder and launch index.html , no localhost needed]Author: Mariken S.Made For: An event'''
