["https://glorioustrainwrecks.com/node/10113"]
title = "Finals Fantasy: Game Design Ideas | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hey homewreckers, Finals Fantasy was released recently, online at http://finalsfantasy.com It's a collection of SPECULATIVE PROJECTS FOR GAME ART STUDENTS. My favorite section is by Jake Elliott of Cardboard Computer who asks that you make 1,000 games or else you will fail. An excerpt: Assignment: Sit in a public place for 1 hour. As you sit, work on a hypertext game about whatever is -- or could be -- happening nearby. Speculate. Do this once a day for 30 days. Assignment: Write 150 short instruction set games. Print and bind them in a book. Name the book after a citrus fruit. Here is an example, from "Grapefruit" by Yoko Ono. Assignment: Write a Lisp program that generates HTML games. Generate 28 games. QUESTION: Why Lisp? What are other ways to write a program that would generate games?‹ make a short song for me and i will make a game out of it Game Critique Club (Round2) slots available. › I really loved Paul Slocum's "Make a game that has a clearly defined central goal that is impossible to complete for some reason. The game shall not be emo, twee, funny, spiritual, or political". But I think I figured out a valid solution for it that feels kind of cheap, and now I'm not sure how to approach it.'''
