["https://glorioustrainwrecks.com/event/2023/11/24/table/all/all"]
title = "Events | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more inspired by lost histories jam*, this is an alphabetical list of games where experiences of a game are more important than the game itself. click this link to view/edit https://docs.google.com/presentation/d/1sV1LM_lsAbNmOCBikjAOw3q5EHxtbFWkIvSXYywjUrQ/edit?usp=sharing to contribute: ♥ add a page ♥ format it however you want ♥ include proper credits guidelines ♥ choose a game because of how important it is to you, not to culture at large ♥ don't edit/delete anyone else's work without their permission ♥ pics must be safe for work but writing doesn't have to be; please provide content warning if so * https://itch.io/jam/lost-histories-jam gifs will be added later lol For this 5-year lifespan, an new console was made for use. But it didn't have any games. So you will decided to make some games for the fictional console. Screens for this console can handle 3. Normal, XL and XXL. Normal = 500x400px XL = 1000x600px XXL = 1600x880px It only handles 8-bit music and sound. It can be used for Windows, Mac OS and Linux And that is it for that little fictional console. Knytt Stories is a game where you play as the character Juni. Run, jump, and climb through endless levels created by people just like you. Your only limit is the human imagination. Get started at KnyttStories.com and earn a free Detector today with this exlusive offer. Q How do I get started with the Knytt Stories SDK? A The Knytt Stories Message Board has a manual to help get started with making the best Knytt Stories levels for free. Q What kind of game is Knytt Stories? A Knytt Stories is a platforming game where you run and jump over enemies and through various different worlds. You have to avoid the hazards, but some levels may have more hazards or less hazards than other levels. Along the way you will encounter many stories and plots. Q Why is Knytt Stories the best game for me? A Knytt Stories is the best game for you because it stimulates creativity in the brain, and lets you explore unlimited worlds, so there's always something new to find. Additionally, it meets all of the standards of a platformer like gravity, speed, collectibles and good controls. Get started at KnyttStories.com and earn a free Detector today with this exlusive offer."
