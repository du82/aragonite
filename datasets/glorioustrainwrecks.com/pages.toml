["https://glorioustrainwrecks.com/node/10911"]
title = "I deleted a game yesterday. | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more A community member posted a game here yesterday that had a casually racist "joke" as its title. I deleted it. (If it would help you to know specifics, the game was called "Nenkey Dogro", and you controlled a Black person riding a donkey. The user who created it is Sejez.) I want to be explicit now, because I have not been explicit in the past: racism isn't funny, and it doesn't have a home here. The same goes for misogyny, sexism, Islamophobia, anti-Semitism, transphobia, homophobia, and biphobia. I have always strived to make Glorious Trainwrecks an inclusive place, where people can feel comfortable sharing their creative work. That can't happen in a place where people are free to make jokes at the expense of your humanity. I have not chosen to delete things very often. I doubt quite strongly that this particular game is the most egregious thing on the site. In the past I have let things slide that should not have, in the mistaken and, frankly, cowardly hope that they would quietly go unnoticed. I am no longer going to do this. The user that posted this has had an account here for five years, and has posted numerous games. I have, for the moment, locked their account, and reached out to them via email. I'm not sure if I will feel comfortable unlocking their account in the future; I think that will depend on how they respond, and how the community responds here. I feel it is important to make my stance very clear, and provide a place for the community to talk about it. It's a conversation I've avoided for too long. My PMs are open, as always. If you see gross shit, please say something. If we think the community needs more moderators than just me, I'm open to that as well.‹ Can we get support for uploading .wav, .ogg, .xm, etc. files to the File attachments section? GLORIOUS TRAINWRECKS IS TEN YEARS OLD TODAY ›'''
