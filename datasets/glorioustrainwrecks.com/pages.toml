["https://glorioustrainwrecks.com/event/2024/12/15/day/all/all"]
title = "Events | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more inspired by lost histories jam*, this is an alphabetical list of games where experiences of a game are more important than the game itself. click this link to view/edit https://docs.google.com/presentation/d/1sV1LM_lsAbNmOCBikjAOw3q5EHxtbFWkIvSXYywjUrQ/edit?usp=sharing to contribute: ♥ add a page ♥ format it however you want ♥ include proper credits guidelines ♥ choose a game because of how important it is to you, not to culture at large ♥ don't edit/delete anyone else's work without their permission ♥ pics must be safe for work but writing doesn't have to be; please provide content warning if so * https://itch.io/jam/lost-histories-jam gifs will be added later lol For this 5-year lifespan, an new console was made for use. But it didn't have any games. So you will decided to make some games for the fictional console. Screens for this console can handle 3. Normal, XL and XXL. Normal = 500x400px XL = 1000x600px XXL = 1600x880px It only handles 8-bit music and sound. It can be used for Windows, Mac OS and Linux And that is it for that little fictional console. "It's that time of year again!!!" "Ho! Ho! Ho!" "Don't Eat Too Many Mince Pies!!!" "Bring Us More Figgy Pudding" "Christmas" that's right it's christmas and it can only mean one thing secret santa. Last year's theme was "You're forgiven of your debt". This year's theme is your debt's back. sorry!! Post your "list" of things you want in your game below. on the 13th december, all the lists will be sorted randomly and you'll get invited to a 🤫secret discord🤫 if you want to share your WIPs with other people. you all know how it works by now!!!!! Let's have some fun!!!! soft deadline for submitting your game is "sometime in january" List Rules: - please keep it fair and try not overburden your santa with too many items - don't be too hyper-specific, and avoid specifying a genre. you're not commissioning a game, you're getting a mystery game!! ok go:'''
