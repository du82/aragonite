["https://glorioustrainwrecks.com/blog/23979"]
title = "nuuup's blog | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more hi! if anyone happens to read this, just know that i'm active on a new account, bruneiros! i plan on keeping this account i'm currently using because all of my old games are here, but i also want to move on from it. check Civilization Flight Simulator out right now, it's a fun lil experiment made with Unity :) this year, I finished a short film for college. it's called Catábase (Katabasis), is almost 10 minutes long and in a way does feel like some of the stuff I was making back in the day. here it is: https://www.youtube.com/watch?v=iMXmihtIDNU (english subtitles are available) this project has meant a lot to me, as it was a very fruitful and loose creative experience, and i just let out everything i wanted to let out for this film. it was the kind of thing that i needed to make as a reminder that i can just do whatever i want and that's really all that matters. after this one, i plan on working on another short film in my own free time and on other projects as well. i'm not really active on social media outside of instagram (https://www.instagram.com/10000ratazana/?hl=en) and discord (also 10000ratazana). idk where y'all glorious trainwrecks people are nowadays, and i'm interested in going back to talk with the people i spoke with back in the day lmk your thoughts on catábase if you've seen it, and please share it with people if you liked it! it's been out for a couple of weeks now, but I only remembered to post about it here today. my bad! =========================== edit made shortly after posting !!! one of my key influences in certain parts of catábase is something called "gamecore", which i heard for the first time when harmony korine started promoting his latest film, 'aggro dr1ft'. since i'm not in a city that holds film festivals --especially the ones that would show something like that film-- i didn't watch that, but i let my imagination go wild. many of the scenes from the 3 minute mark onward are my own spin on "gamecore". i kinda want to make this a thing in my following film projects. it's a fascinating concept to work around with, and one that i think marries perfectly with other ideas i had floating in my mind (i want to incorporate more and more "slow cinema" influences in my films, too, and i think a "gamecore" and "slow cinema" combo could be interesting)'''
