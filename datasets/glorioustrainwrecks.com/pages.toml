["https://glorioustrainwrecks.com/node/12214"]
title = "Property Damage | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game link: https://www.puzzlescript.net/play.html?p=837495cfc666cb958e19f50f25081f44in this game, your objective is to cover all the targets, and then move onto the "goal" square. simple!Author: bert of wibi; fiend of wibi as honorary adding-himself-to-the-GT-credits-right-now executive advisorEvent Created For: Open World JamMade For: An event This is cool but...I can't figure out why sometimes I stop being able to crack open any new blocks (only bring them down to a damaged state)...hmmm....am I missing something? unsure how far you are in the game so here are 3 hints ordered by least to most progress made (rot13): 1. gel jnyxvat vagb n jnyy 2. vs lbh pna'g oernx jnyyf/pengrf nalzber, cerff fcnpr, k, be ragre 3. lbh znl unir whfg zvffrq n fperra. unccrarq gb zr bapr. znxr nofbyhgryl fher lbh unir nyy gur gnetrgf svyyrq ba gur hccre unys bs gur znc orsber ergheavat gb gur ybjre unys, naq vs gur tbny gvyr fgvyy qbrfa'g qb nalguvat, znxr fher lbh unir nyy gur gnetrgf svyyrq va gur ybjre unys bs gur znc I picked up on the general mechanics, but I didn't figure out there were zhygvcyr fperraf, orpnhfr lbh unir gb cerff ntnvafg gur rqtrf bs gur fperra fb znal gvzrf. interesting idea, i don't like the design decision not to allow restart but it is one big level so i guess it makes sense. besides that, there's nothing visually indicating to the player that there is anything beyond the initial screen, so it may have made more sense to make flickscreen bigger? or for audio feedback when you can't break a block, because currently there's none. the inventory thing is a good idea but without looking at the source, it's not clear how the blocks are being produced.'''
