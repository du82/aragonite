["https://glorioustrainwrecks.com/node/11339"]
title = "I found an old harddrive with the entire series of DJ Nastyman games | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Anyone remember a guy named NASTYMAN from the Klik community? He made a bunch of Klik and Play/TGF games about some really weird stuff. For example, the first game is about him being thrown into a mental hospital because people didn't like his music. Then he made a "trip" version about it where everything looks like its on drugs and instead of a mental hospital, he gets thrown into a chicken farm for being a "boobie." Then there's Nastyman 2 which is about him being very much in love with a sea anemone, and includes some scenes like a guy running around with a skull screaming the word for testicles in Hebrew. Then it just gets more bizarre from there. He even has a game that is simply labelled "belly botton adventure" in the title window. I was really young at the time so I almost thought it was some sort of weird fever dream rather than something that I actually played. Only it turns out I had these game stored on an old, dying hard drive all along. I don't know what to do with them. I remember these games being talked about a lot back on old klik sites that no longer exist anymore. I don't even know if people remember these games outside of that small, now dead community. I stumbled upon this site and figured maybe you would be interested in these. I want to preserve them somehow because they are just so bizarre and I might just be the only one who has a copy of any of them. AttachmentSize Nastyman.zip35.35 MB ‹ What Happens when you Hire Professional Packers and Movers Precure RPG ›'''
