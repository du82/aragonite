["https://glorioustrainwrecks.com/node/11090"]
title = "Preserving Ikiki's games | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Ikiki was a super talented and absurdly prolific Japanese indie developer from the mid-2000s -> early 2010s. They made games like Ninjikun and Hakaiman (the later of which was a huge influence on Hotline Miami). All of their games are pretty fantastic. I was just made aware that their website has gone down and their games are becoming hard to find. I have a bunch of their games on my hard drive so I figured I'd upload them here. Edit: Someone on Twitter uploaded a better-organized archive with more games, so I've replaced my original upload with theirs! Note: I downloaded this compilation ~2012, so they probably have newer games which are not included. This YouTube account also has a bunch of game play videos, which is cool. It's definitely worth making sure these games don't disappear! And if you haven't played any of their games please download the archive, it's worth checking them out. AttachmentSize IKKI_HIMOJI_Gamepack_2012_www.g4g.it.zip30.2 MB Ikikis Games Compilation 2012.zip37.93 MB ‹ Purse Dr What Happens when you Hire Professional Packers and Movers › Ikiki's still around and making games! Their latest site is: http://ikiki.html.xdomain.jp/himoji/game.htm http://ikiki.la.coocan.jp/himoji/game.htm They even have a Tumblr with fanart and WIP GIFs: http://onikudon.tumblr.com/ I read online about how influential these games were towards Hotline Miami and while there are so many articles about the games themselves they get harder and harder to find so thank you for putting them up here!"
