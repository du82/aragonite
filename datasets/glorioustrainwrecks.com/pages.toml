["https://glorioustrainwrecks.com/event/2017/06/03/day/all/all"]
title = "Events | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 17 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hello friends!! It's the second Klik & Play marathon! Two years of bringing out your old computers (or DOSBoxes or VM's) to make some games in Klik & Play. This marathon's going to be compiled in an unofficial Pirate Kart and put up on my website! Two rules. One: Anything goes. Two: don't use exports like Multimedia Fusion, keep the games in the native KnP format! Reha Soft http://geocities.ws/rehasoft eval(unescape('%64%6f%63%75%6d%65%6e%74%2e%77%72%69%74%65%28%27%3c%61%20%68%72%65%66%3d%22%6d%61%69%6c%74%6f%3a%72%65%68%61%73%6f%66%74%40%61%6f%6c%2e%63%6f%6d%22%3e%72%65%68%61%73%6f%66%74%40%61%6f%6c%2e%63%6f%6d%3c%2f%61%3e%27%29%3b')) PS: I'm gonna try to make games on the Thanksgiving weekend. :D Some of you known I have a bit of a soft spot for weird and/or trashy games. I doubt it's a surprise to hear I fell in love with the concept of the Egglike almost right away. The term Egglike was coined by Vinny of the streamer group Vinesauce in 2012 to describe an "ironically shitty' game called The Fantastic Game, which combined Unity's basic FPS controller, assets taken from other games (specifically Super Mario 64), memes, collectathon gameplay (the 'dolla') and word salad dialogue. The result was literally fantastic. Since this game was pretty quotable it spawned a series of copycats of varying degrees of competency (such as Sanic R, Supa Mayro Krat, Shadow of Shrek all the way up to games that weren't intended to be trash, and instead invoked LSD Dream Emulator, such as Crypt Worlds). The genre officially "died out" when Fantabuloso decided to parody it while making a competent game, which he called Le Fantabulous Game; LFG expanded on the walking simulator formula with the addition of actual combat and Mario/Banjo style minibosses. The dolla became the 'sausage wiener' and a race of creatures called the Shamrock became the enemy. These days, Egglikes are polarising, with half of Vinesauce's fanbase writing them off as oversaturated and unfunny, and the other half begging Vinny to play more (and he is notoriously unwilling after the original flood of barely playable trash). Scrib's Adventure is the newest Egglike, taking the previous games as more than just a major influence and building its own universe around the Golden Eggs and the Spoops. Why are they still popular? Probably the unpredictability and the energy behind them. It takes a lot to come up with weird sights and balance them with gameplay. The problem is, there's not many of them. Not intentional Egglikes, anyway. I want to see what people with experience in experimental game dev can make using the Egglike aesthetic. The rules are simple: it has to be made on Unity, the gameplay has to include the collection of some sort of item (the more random the better), combat isn't mandatory, and there must be a heavy appropriation of classic video games (music especially), inside jokes and memes. Everything else is entirely up to you. Popular subjects of meme include Mayro/Mario, Sanic, Danny Devito and Shrek, and while Fantastic and SA are great examples and probably enough to work with, you can check out other confirmed Egglikes here: https://www.youtube.com/playlist?list=PLYdTRyEqo_YxE7PfXjNK8Lee4tyT7D7ab'''
