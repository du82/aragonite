title = "Trip Down the Chip Mine [for noser] | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 4 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Mac): TripDownTheChipMine-0.9b-mac.zipGame File: TripDownTheChipMine-0.9b-pc.zipFINALLY, we found you! Someone who is willing to work honestly and dig into the old mine. But wait, this is a special mine: instead of precious metal, you are excavating computer chips The game was made following noser's prompts for Sekret Santa 2023: - big pixels - limited palette - maze - momentum - archeology/digging - high-stakes climax You tell me if I delivered on that last item. The game is about 10-15 minutes long I think! THERE IS NO SOUND YET, I'm too tired for that so that's gonna go in a future release; it's a bring your own music and imagination kinda deal Edit: To move, hover the arrow button and press space. No need to click on them! Have fun, I'm happy that I can finally play other entries :)Event Created For: Sekret Santa 2023Made For: An event Enjoying it so far! I really like how well the room transition animations work. At what I'm assuming is almost the end, after it shifts into climax mode, I get a crash with this exception: I'm sorry, but an uncaught exception occurred. While running game code: File "game/script.rpy", line 480, in script show screen boss(idle=True) with dissolve File "renpy/common/000statements.rpy", line 649, in execute_show_screen renpy.with_statement(eval(transition_expr)) File "game/boss.rpy", line 142, in execute screen boss(idle=False): File "game/boss.rpy", line 142, in execute screen boss(idle=False): File "game/boss.rpy", line 146, in execute fixed: File "game/boss.rpy", line 148, in execute if boss_phase == 1: File "game/boss.rpy", line 151, in execute use boss_phase2(destination, idle) File "game/boss.rpy", line 219, in execute screen boss_phase2(pDestination, idle): File "game/boss.rpy", line 219, in execute screen boss_phase2(pDestination, idle): File "game/boss.rpy", line 244, in execute add "boss/phase2_"+getBossPhase2Side()+"_[boss_sprite].png": Exception: DynamicImage 'boss/phase2_front_[boss_sprite].png': could not find image. ('boss/phase2_front_attack.png') and looking at the assets, it does look like phase2_front_attack is absent (there's a phase2_front_punch)'''
