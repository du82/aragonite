full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more http://afroboss.com/misc/romeo.html (by Chris Nimmo, author of the most excellent A Mini Falafel Adventure)‹ Jamagic Looking for a job online › you are flattering me like an ironed crepe during an anvil storm at a meteor strike. Also the crepe is made of a single layer of graphite. Your bitter graphite crepes are like ashes in my mouth!!! Are you happy now??? ok maybe im not that bad but i dont know teh controls and all he does is jump the height of a brick. Left and right is all you need! By the way, here's the music for anyone who wants it. Virt strikes again! i won! my failure was in assuming there was gameplay. it's cute but i hoped to discover who this pie devil is, what he wants with the princess and how pies can destroy a grown man with crumple zones built into his clothing. This is an area I'm not super knowledgable about, but if more Romeo is what you seek I believe this is a tribute to an example game that came with some versions of Klik & Play. Hopefully Romeo is playable here but I'm unable to verify that right now. There's also a fan-sequel by Mr. Podunkian which I saw as gently poking fun at VVVVVV's $15 price tag, but I heard Terry Cavanagh was actually pretty upset by it. Since the link is dead now, here's an executable version of this gem thanks to the author! AttachmentSize Romeo vs. The Pie Devil The Rhythm Game.zip6.05 MB"
