["https://glorioustrainwrecks.com/node/407"]
title = "FRED'S EXCITING ADVENTURE [Halloween Prank/Artgame] | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 5 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more ------------------------------------------------------------ THE FOLLOWING POST IS A WORK OF FICTION INTENDED TO CREATE ATMOSPHERE AND BACKSTORY FOR A HALLOWEEN GAME ------------------------------------------------------------ Figured I'd make a new thread for a new month. A quick note before this week's find: Prior to the Geocities rescue mission (great job all involved!) I had made a list of the places I had been downloading these freehosting picks from. Now that list isn't anywhere to be found. I know I had been writing it on my other laptop, but I can't find it anywhere on the drive. I still worry that the list might have contained links to some Geocities pages that we didn't get to mirror. What I did find on the laptop however was "Fred's Exciting Adventure"! It's a cute little platformer starring what looks like a cross between Cool Spot and Sonic the Hedgehog. The levels make heavy use of KnP clipart, but there's an interesting visual conflict between the home-made and stock art. A little green guy runs back and forth on the hill, and knocks you into the air if you touch him. He's a little difficult to jump over, but it seems to work if you just hold the right arrow and jump key down. The next screen introduces spikes and moving platforms, which make the green guy more dangerous (notice the blood on the spikes if you fall on them!). He even has the nerve to stop at the edge some times, making it impossible to jump him until he starts moving again! I haven't had time to finish the game yet (so busy that my Monday updates are on Thursday!) but a glance at the levels in KnP seem to indicate that the game isn't very long (maybe even unfinished?). Something about the game feels really familiar to me, and I don't know why that makes me uneasy. Maybe it's just that I don't know if this game was from one of the Geocities sites we could have lost, which adds an air of mystery to it for me. Until I track down that text file again, or find the site I got it from, this game is an orphan. AttachmentSize FRED.zip1.54 MB fred1.png29.71 KB fred2.png30 KB fred3.png35.22 KB ‹ Lovely Warriors of Friendship neat puzzlescript game that yall should check out (Rose) ›'''
