["https://glorioustrainwrecks.com/node/11971"]
title = "5 years later, I made my video! | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more About five years ago, I showered you all with questions on DOSBox, recording KnP games and more. You helped me hugely and I managed to get playthrough footage of all the games my mate Dan made with my assistance back in the 90s. As a fun gift to Dan, I used clips of all those games to mock up an industry promo video for a dev studio name that we made one GF game under then gave up on. And finally, 5 years later, he decided to post it online. So here it is, as my small thanks for all your help! Cheers! https://www.youtube.com/watch?v=lhHGcy-fh-c‹ Game Making Tools Wiki More MIDIs than you will ever realistically need in your life › Incredible! Thanks for sharing here. The future is Wildebeast, indeed! Or should that be Wildebeest? I suspect there may have been confusion even at the time. I thoroughly enjoy seeing these kinds of tributes and shared memories. I actually watched this shortly after you posted news of it here, but for some reason I hadn't commented. There's a lot of love that goes into making games - particularly so, it seems, when it comes to GameMaker or KNP or Fusion or Scratch. Your highlight reel here is pretty great, and shows a lot of that love... Maybe we'll see a reinvention of Wildebeest/Wildebeast before the year is out...? ;)"
