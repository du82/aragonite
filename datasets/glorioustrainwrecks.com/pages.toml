["https://glorioustrainwrecks.com/node/9477"]
title = "The Good Gam Jam | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Anyone up for another community event/jam soon? MMF3 is coming and it's an exciting time for Clickteam. However, I just heard that Francois is no longer part of the team. Apparently this happened a while ago but it hasn't been made big news on their site, somewhat understandably. Still, I feel there's something missing if we don't do something as a community to say thanks for all the years of AMOS, Klik & Play, The Games Factory and so on. Francois basically came up with the idea for the event editor and continued working on it with Yves until they had a product that would give us creative kids something to live out our dreams of being game creators. I spent hours in Klik & Play and it's hard to imagine what I would've done with the time I spent with CT's products had they never existed. Could we organise an event here with this in mind? Summer is coming up so I've been thinking of kicking something off then. Edit: It's on! Ends July 31st. http://www.glorioustrainwrecks.com/node/9478‹ Knytt of The Month #9? We need a new front page manifesto › It's already summer here. When is it summer for you. I also like the idea of people here making "good games". Making good games does sound interesting. Perhaps the closest we've got to that here can be seen in some of the entries for the demoscene events. I was really interpreting "Good Gam" as in "GG", like people say at the end of an online game. TGF's filename extension was .gam. But really "Good Gam" is just a name, this is just an excuse to make anything you want, as usual.'''
