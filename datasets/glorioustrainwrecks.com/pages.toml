["https://glorioustrainwrecks.com/blog/1"]
title = "SpindleyQ's blog | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Stumbled across this old forum post from 2011 where someone named "ValleyBell" posted a tool called "ClickTeam Extractor" for extracting resources from ClickTeam games that seems much more advanced than my KNPUtils. Includes source code and file format documentation! Given that it's hosted as a MediaFire link from 2011 it's a miracle that it's still online, so I'm mirroring it here. In May of 2009, over 11 years ago, I laid out a vision for a collaborative game-making tool that I wanted to make. I had fond memories of being a kid and sitting in front of a computer with my friends, throwing ideas around and banging out goofy QBasic games, and I was frustrated that there didn't seem to be anything out there that would let have that kind of experience over the internet. The only improvisational game development tools I could get my hands on were decidedly single-user; every attempt I made to collaborate on a single project failed badly. The closest thing I could get was the Pirate Kart experience - everyone doing their own thing and sharing it with everyone else as they finished, and bundling all the results in a single package. MarMOTS was my answer: a collaborative game creation tool built out of nostalgic textmode graphics, inspired by ZZT but usable by multiple people at once, where every change was live the instant you made it. I wanted to be able to change games while other people were playing them. I wanted making and playing games with it to be a party. I worked on it fairly steadily for two years, putting it live as soon as there was something interesting, adding features, fixing bugs, responding to the GT community that was using it. In time it became a capable ANSI art and animation creation tool. Goofy collaborations happened. Folks made some incredible art with it, which was amazing and gratifying and kept me motivated to improve it. Then I burned out on it, life happened, and nine years went by. In the back of my head, in those nine years, MarMOTS was always there. It was a great idea that I'd gotten _so close_ to making happen. I'd get back to it someday. In 2009 I laid out a vision, a TODO list, each item flowing naturally from the last, each step being useful on its own, to prevent me from working and working and working and getting stuck, getting lost in my own head and ambitions, and giving up without having anything to show for it. Hard as I tried, I could never push past vision #4; vision #5 turned out to not be necessary or even a particularly good idea, and vision #6... In 2009, I wrote of vision #6: "This is the biggest leap." I got close, implementing a scripting language complete with structured editor, so that the program was always in a runnable state; but the editor never quite became usable, and I never quite worked out how I would connect that piece with the stuff I'd already built. Today I put live a version of MarMOTS that pretty much does everything I set out to do with vision #6. I pulled back the scope of what I'd tried to do in 2011 from "a full general purpose programming language" to "maybe a minimal Bitsy-like." You can now take an ANSI drawing and add interactive elements to it (in MarMOTS these are called "bots", inspired by MegaZeux's "robots"); as soon as you do, it becomes a game that other people can play. Virtually every change propagates in real-time; if you change a drawing or a script or add a new bot in the editor, all the players will see it. I tried to make the interface as self-explanatory and discoverable as I could - the editor tells you what your options are at every stage, and it's impossible to create a syntax error. If you decide to mess around with it and have questions or suggestions for cool things to add please let me know! I'll probably keep adding stuff and fixing bugs as the days go on. You can use MarMOTS from your browser with your Glorious Trainwrecks account credentials!'''
