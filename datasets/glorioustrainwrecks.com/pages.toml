full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more While we have Knytt of the Month Klub #10 doubling as KotM #99 for now, I imagine this isn't set in stone, so I'd like to find out if anyone has their own ideas for the event. Mine are: A 'training' event (maybe on October 17th) targeted at supporting first-time game developers that might like to participate in KotM #100. A spooky event along the lines of ones we've had around Halloween in the past. I'd hate to force these on others if they're not really wanted, so I'm keen to hear what other trainwreckers might have in mind. Keeping things as they are is obviously an option! We do have a lot of events planned for the month already.‹ multiple avatar/user icons/what have you Knytt of The Month #9? › I'm going to go ahead and guess that it is Battle Cheese which was (I'm going to guess) a parodious spin-off of Battle Chess. lol Both. I mainly want to do a Halloween thing cuz I liked last years Halloween thing. I want it to be different but still Halloween. lol Maybe like a "Halloween Trick-Or-Treat Bag". I intend for this to be the year that I make a spooky game rather than a creepy one! I've had a year to think about the difference. Let's see what I've learned. The last Halloween event wasn't a Klik of the Month and it lasted 13 days and it was awesome. http://www.glorioustrainwrecks.com/node/8487 Or we could just glue all these different themes/directions together until the jam is an undiscernible pile of gibberish'''
