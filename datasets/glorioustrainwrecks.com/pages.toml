["https://glorioustrainwrecks.com/taxonomy/term/769"]
title = "cute | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more ummm here is my "video game" secret info: f4 to fullscreen, game autosaves, delete the ini file it creates to restart your progress requirements: A combination/clash of two themes/aesthetics that aren't typically seen together A gimmick or mechanic that leaves no corner of the game unscathed ("really? did it really have to also affect this?") Homemade ambient track A parable that teaches the player a lesson quite different from any parable they have heard before A fun or interesting character controller, or one with two different modes wasn't able to hit the second and fourth marks BUT i have achieved combining the aesthetics of 'pixel art' and 'vector flash gradients' as well as 'cute character' in 'uncute environment.' made a couple homemade ambient flavored tracks and movement is platformer but can also propel yourself by shooting credits: sound effects were made with jsfxr i did not make the song that plays in the bonus level the world 2 song uses a sample that's just a clip of another song, and it is not a song that i made. i don't know what song it is i found it in a silly video and i wasn't able to successfully find the source of the audio but i do know that i did not make itEvent Created For: Sekret Santa 2024.Made For: An event highly accurate simulation of what its like to be a frog music by me https://soundcloud.com/naemgurl https://notnow000.bandcamp.com/ <3 (linux version might not work, pls let me know) (mac ver coming eventually) also i guess my game crashed the site(?)Made For: An event A blocky creature hops around on screen, and you use the mouse to measure its various body parts (in pixels). Sometimes it's facing you, other times it's facing away, and other times it's looking to the left or right. You'll have to be patient if you want to document all of the dimensions... of the Boxy Hop-Dog. Inspired by that classic question "The Pokédex lists the height of each Pokémon. How do they measure the Pokémon?" The dimensions are randomized each time you play. There are a few quirks (listed in the readme) but overall I'm very pleased with how this turned out. I was originally going to make 'better' looking art but I got so used to my placeholder art that I just ran with it. I did tweak the colors a bit to make each body part easier to tell apart for colorblind people and I hope I was successful in doing so. There is togglable text-to-speech just in case the X and Y values are too hard to read - I tried to make the color of the text easy to read against the background/Boxy Hop-Dog. Made in Multimedia Fusion 2 with music made in Bosca Ceoil. A cool 6 second .gif of the game is provided below NOTE NOVEMBER 3RD 2021: I've added in a way to make the game mostly playable with just the mouse, as long as yours has a scroll wheel - you can use either the left or right mouse button to measure, clicking the middle button will bring up the entry screen and you can use the mouse wheel to scroll up or down to add/subtract values to the currently selected entry field. The latter method takes a little while longer than using the number keys but it's definitely doable.Made For: An event'''
