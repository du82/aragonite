["https://glorioustrainwrecks.com/node/227"]
title = "Introduce Yourself: The Threadening | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 22 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more So, hey guys! Here is a thread which is probably overdue. I'm SpindleyQ, also known (on other forums and often on IRC) as ApM, also known as Jeremy, and I started this here site. By day I write code for an eccentric billionaire who invented the WYSIWYG word processor and recently went into space. By night, I mostly hang out with my lovely wife (who once participated a Klik of the Month) and our 11-month-old son Eric (without whom the Fatherhood Series would not exist). I am currently secretly learning Smalltalk in the hopes of resurrecting an old Secret Project using Croquet and even more secretly considering taking up crochet. So tell us about yourself! How did you find the site?I need to have my game removed › I'm kirkjerk, the guy who's all angsty about doing most of his trainwrecks in Java processing (a few things in the more traditional Klik N Play.) Anyway I'm a programmer in Boston, currently working for Nokia. I put something on website everyday is kind of a humanist spiritual practice. I joined the site for the infamous EMERGENCY 100-IN-1 KLIK AND PLAY PIRATE KART MELTDOWN, probably after it was plugged on The Gamers Quarters forums. Bonjour. I'm captaincabinets, or Raphael, or Raphael-you-know-like-the-ninja-turtle if I'm at a party with loud music and confused looks. By day I work on my tan by basking in my apparently bright future as something or other, and some nights I pay the bills and save up for Tim Tams by taking yoghurt out of cardboard boxes and putting them on a shelf. I harbour secret ambitions to do pretty much everything in the world, but have such a bad short term memory that I forget about my ideas ten minutes after they come to me. Like kirkjerk, I came to this site with the Meltdown. I probably would have never joined in, but fate and my wonderful uncle had already gifted me Klik & Play when I was nine or ten, and I couldn't resist dusting it off. It turns out it's like event-editing a bicycle, and waaay more fun when you know what the hell is going on and you're not perpetually trying to make a sprawling, multi-genre Goldeneye videogame (unlicensed). Also, as a serial starter and serial incompletist of, well, everything, the concept of a two hour limit really appealed to me. Now? I'm still here (or back), hooked on thinking up awful puns and looking at other people's brilliant imaginations. I liken Klik and Play to being the finest bucket my brain can vomit into."
