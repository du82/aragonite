["https://glorioustrainwrecks.com/node/12279"]
title = "GILGAMESH II | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: GilgameshII.zipTHE LONG-AWAITED SEQUEL TO THE ORIGINAL CLASSIC As the Babylonians, looking towards the already ancient poetic world of Gilgamesh- I hope to renew gaming's ancient and poetic world: that world of "Bump Combat". The fragments are evident in many places: as the Babylonians took multiple works of poetry, and founded a single narrative by conjoining them, I hope to redeem this underappreciated form by taking elements from its most derided entries and building them into a single work- which by its virtues I hope will shine a new light on history. AT THE END OF THE WORLD, USHERING IN A NEW ERA... GILGAMESH II Promising hours of broken crafting systems and unfinished, empty dungeon floors, GILGAMESH II is the right product for you this Holiday Season. It is a continuous work- a historical work, which will never be finished. It needs a manual, but does not have one. EXPERIENCE THE WORLD OF... GILGAMESH II --- TITLE SCREEN BY SPINNYLIGHTSEvent Created For: Open World JamMade For: An event AttachmentSize BabylonianWorldMap2.jpg93.29 KB The longest awaited sequel in media history . . . ! Unofficial guide here: https://milky.flowers/misc/gilgamesh_ii_zoes_unofficial_guide.txt'''
