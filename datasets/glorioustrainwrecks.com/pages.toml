["https://glorioustrainwrecks.com/blog/19155"]
title = "everythingstaken's blog | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more This is a version of my project Smush Bois. I mostly have it here for people to download and playtest. I may add more, I may not? I'll update it if I do! Right now there is a more updated version of Smush Bois at Wonderville in Brooklyn, if you want to check that out. It's up for another month (until May 31st). Please give feedback below! Don't be afraid to critique it! I went to art school, I am tough! :-) It's a 2-4 player game I made for Play-NYC as a commission for "Graffiti Games". It's like no-wave smash bros? (tell me if that's corny) Josie made the music, it's really great. Download The Game Please (this is really just for a couple people to play if interested, it's kinda prototype-y) ____________________________________________ Goal: Smush the other players and don't get smushed. ____________________________________________ Controls: Player 1: A (right) S (left) W (shoot) D (smush) Player 2: right (right) left (left) up (shoot) down (smush) Player 3: H (right) F (left) T (shoot) G (smush) Player 4: L (right) J (left) I (shoot) K (smush) ____________________________________________ Move: (left and right) Smush: (down) *when on top of someone, this is how you kill them Stun Blast: (up) does not kill players, just stuns them ____________________________________________ Thank you for reading. So, I've been working on this sorta action adventure arcade game for a while. There are 5 sort of games inside of it as it is and I want to playtest them before I continue making it. If you have joy to key and a guitar hero/rock band controller, you can use that to make left and right the strum bar and A-G the color buttons to play this. Please tell me what you think! Please tell me what you think! Please tell me what you think! Please tell me what you think! Please tell me what you think! Please tell me what you think! Don't be afraid to be critical.'''
