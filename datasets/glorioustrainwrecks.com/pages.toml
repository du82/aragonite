title = "Introduce Yourself: All Aboard The GameMaking | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Thu, Mar 29 2018 06:39 AM Start: 03/29/2018 - 06:39 End: 05/01/2018 - 06:39 Timezone: Etc/GMT-7 There is a hope amongst the Glorious Trainwrecks community that the BabyCastles event may introduce some of us and our games to new folks. This event is an opportunity for new folks to introduce yourselves to us! We'd like to get to know you. Make a game or sing a song so that we have some effort to know you by. Even if it is awkward, it's likely to impress. Those of us who have been here for a bit should feel free to craft a little somethin to welcome the new folks. Or if anyone is inspired by something they saw at the Babycastles event or even if they are inspired by something they didn't see at the Babycastles event, they are probably still inspired and can paint that over a gameObject and post it here. AttachmentSize greetPuppet.gif109.49 KB collageGreetings.jpg73.01 KB greetingSupPup.gif1.36 MB greetdanceicebreaker.gif1.06 MB greetingIceBreaker.gif1.21 MB throwPainty.JPG125.45 KB Games made for Introduce Yourself: All Aboard The GameMaking 9 games made! View a random selection RSS Feed NameCreatedByScreenshotComments Binky Eats Cake07/13/2020 - 13:43everythingstaken4 Daretown NJ08/30/2018 - 17:10everythingstaken1 Daretown NJ08/29/2018 - 23:20everythingstaken1 Does That Answer Your Question?06/09/2018 - 15:44decky1 IQ: Intelligent Qhess05/02/2018 - 21:11spiral17 my name's flan05/01/2018 - 14:49flan11 Mr. Petes is the glue that holds this building together.04/29/2018 - 14:58clyde13 wHERE'StIGA04/26/2018 - 16:13slmjkdbtl11 Love is like Pinball04/26/2018 -