title = "You are a Blob! (a SoftSoft Twine game) | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: blob.htmlThis year I decided to enter Ectocomp, a yearly Halloween competition hosted by someone in the IF community (yes, I know this overlaps with the IF Comp, I dunno either). You can read more about it here. I downloaded Twine and everything just for it too. You are a Blob actually wasn't my first game idea (a choice-based adaption of "Jacked Up Jack-o-Lantern" from the Regular Show Trilogy of Terror 3), but an eight-year-old was getting cold feet about entering, so I vowed to make a game so crappy it would make everyone else's game shine like gold! Which turned out to be no small feat, because everyone and their mother entered a game (or two) this year, for a grand total of 24 entries. But I think I gave it a good run. If you like this game, please consider downloading (and judging!) the whole set. You can play most of these games through an interpreter like Gargoyle.Event Created For: Klik of the Month Klub #76Made For: An event Yeah, there was a moment during the planning stages of this thing where I realized, "Huh, I guess this is pretty much the same premise as the Gostak."'''
