["https://glorioustrainwrecks.com/node/12438"]
title = "The Last King of Hyrule | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: The Last King of Hyrule.zipThe Last King of Hyrule is a Zelda fangame made in the Super Mario Bros. X engine, an engine that was originally designed for making Mario fangames. It combines Zelda 2 style sword combat and graphics, with Mario 3 style physics and game progression, creating a faster-paced side-scrolling Zelda game where enemies mostly die in one hit and power-ups are mostly temporary. The game has a semi-nonlinear overworld reminiscent of Super Mario World, and seven temples, each themed around its own unique special item and filled with exploration-based puzzles that need to be solved with that item. Music is mostly 8-bit remixes of songs from later Zelda games, which were stolen from Youtube. The game is about 10 hour slong. This game was made by a group of 14 developers who each submitted the initial draft of at least one stage, as part of a collaboration event on the now-defunct rpgmaker.net, despite being neither an RPG nor made in RPG Maker. The event was initially run by Kentona, and the project was then finished by accidental lead developers LockeZ and Halibabica, after Kentona dissolved into a fine mist a few weeks in. The game was finished in August 2015, after about a year of development, and was the featured game of the month on rpgmaker.net during April 2016.Made For: An event"
