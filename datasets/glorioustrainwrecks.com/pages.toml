title = "Recommendations for Babycaszine! | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hi Wreckers! For the zine that Blueberry Soft is organizing, I'm organizing a feature with recommendations! I'm thinking just five per person. This doesn't have to be a best or favorites kinda list, so take that as you will! It can be whatever five (other people's) games on this here trainwreckin' site you'd like people who pick up the zine to go and seek out. I'm collecting the lists here! Post them in the comments! I'll post my own shortly. We probably can't do more than eight or twelve lists, so this'll be first come-first serve (if everyone wants in, we might have to rethink that!). Post your list of games AND the EXACT NAME you want to be credited with.‹ hypertext pixel art game Babycaszine Organisation Thread !! › If you have any questions or comments about this feature, post them in response to this! (I'm putting this here to keep any lists posted from getting lost in the other reponses). Wonderful idea! Five is a good number. It might be good if lists generally avoided overlap, so I think I'll wait until there have been more submissions to put together some "deep cuts". Virtual Stepfather, by Tyler Lolong and David Schultz i will never forget you because you have made me the happiest dog on earth, by jacqueline Cactus Block, by sylvie Absolute Chaos Dog, by yuliy You're a Cool Dinosaur!, by Danni Dondgynns Auv Ye Wyrdd by mkapolk Car Park Dream by Blueberry Soft Mashkin Sees It Through by thecatamites The Illogical Journey of the Zambonis by Noyb Klik and Stacker by tininsteelian'''
