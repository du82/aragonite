["https://glorioustrainwrecks.com/node/10669"]
title = "Matterhorn | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: matterhorn.zipA short game, two or three minutes long, about mountains and idealisations. Mostly mountains. The Matterhorn model is by jawensi, and Licensed under CC Attribution-NonCommercialEvent Created For: TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104Made For: An event This is a cool thing; I thought the dialogue was interesting and evocative. I also like that the texture work and space around the mountain decontextualizes it in an interesting way that simultaneously makes it feel more accessible and more austere. I would have commented earlier, but I forgot where I had downloaded this from and there was no way to identify who made it from the files themselves. I thought this was an interesting form. One thing that struck me was how in the end I felt like I was climbing a small-scale model of the mountain, one of those absurdly large, small-scale models. When small-scale models are the size of a parking-lot, they become something inherently different than large models or small models. This large, small-scale model quality matched the perspective of the narrator really well. I enjoy the subject matter of the simultaneous importance of partial or unrealistic knowledges and the awareness that they are subjective. It's a subject I rarely see addressed in games. The idea of a thing is different than the thing itself and when we make that distinction and appreciate the idea as an idea I find it paradoxically more reality-based."
