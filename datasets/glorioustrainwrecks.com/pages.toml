["https://glorioustrainwrecks.com/node/12377"]
title = "December Drive (Sekret Santa 2023 for Blueberry Soft) | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: December Drive.zipA game featuring a car, Godzilla lurking in the background, upbeat Christmas music, and the color "slightly-orange yellow" loosely inspired by some footage of Route-16 Turbo. Press SHIFT to honk your horn! NOTE: Drive SLOWLY to grab stuff in Normal Mode, you may need to drive over pickups multiple times.Author: HansovEvent Created For: Sekret Santa 2023Made For: An event Whoa. Soon as I saw that morph on the title screen I knew I was in for a real Christmas treat. Love the Wendy Carlosesque Christmas music on stage one. Can't play past stage two 'cause I should sleep, but looking forward to playing the rest tomorrow. Very glad I can honk my horn. Nothing sadder than a car game where you can't honk the horn. Okay I lied, I played it more instead of going to bed. Played level two on both difficulties and tried both endings :) Meant to ask: What did you use to make this? Like it very much seems RPG Maker 2k/3, but then there's mouse input ........ I made this using BingShan1024's Maniacs Patch for RPG Maker 2003, it adds a whole bunch of new capabilities including mouse input and time/date processing. Also if you're curious there's technically four endings, since the results change if you picked the first option before. I'm happy you had fun with it!'''
