["https://glorioustrainwrecks.com/node/11041"]
title = "The Citadel | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: The Citadel.zipWelcome to The Citadel. We have many enjoyable recreational activities for you here. Please enjoy your stay. Controls: Some Arrow Keys to move about. A Mouse Button Oriented To The Left for the purpose of clicking some buttons. This is a collaboration between me (Avery) and a good friend of mine (Wildcard). I introduced them to the wonders of KnP earlier last year and every single thing that came out from them experimenting was so amazing that I saw it urgent that we collaborated on creating a game together. A few months later and a bit of procrastinating later, and the result is this. This is easily the best thing I've ever helped create and it was a ton of fun doing it. I hope you love it just as much as I do.Author: wildcard and averyEvent Created For: Planning the Glorious Trainwrecks @ BBCastles InstillationMade For: An event This is impressive! I'm actually shocked I reached the [spectacular] end on my first playthrough, but I'll definitely be playing this again to see what I missed and try to perfect my quiz responses. The title screen on my computer differs slightly from your screenshot, possibly because I'm missing a font? Anyway, it says "pressé" for me. Cool! oh, the font thing is fine. its actually showing incorrectly for me and in the screenshot - side effect of installing the japanese locale pack for video games. i should note; there aren't multiple endings, am afraid. i kinda wish we could do that but the entire quiz is very much bodged together because neither of us knew how to do it any other way haha. thank you for the kind words! Played through it a second time, it was worth it just for the few points at which the plot can diverge (which was all I was really expecting). Looking forward to more of your elaborate klik games (collaborations or otherwise) hopefully being posted in the future!'''
