["https://glorioustrainwrecks.com/node/11024"]
title = "Planning the Glorious Trainwrecks @ BBCastles Instillation | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Thu, Mar 01 2018 08:00 PM Start: 03/01/2018 - 20:00 End: 03/29/2018 - 20:00 Timezone: Etc/GMT-7 LAST UPDATED 3 MARCH 2018 @3:26 PM EST Ok, so it got approved! Yay! It opens on the 29th of March and will stay up for 3-4 weeks. It's at: Babycastles 145 W 14th St. New York, NY 10011 Let us figure everything out! DESCRIPTION As a refresher, this what we agreed on before, but we can change little bits of this: "Glorious Trainwrecks"(name tentative) is a salon style group show curated by and featuring many members from the Glorious Trainwrecks community. The games will consist of games made for a specific Glorious Trainwrecks Babycastles game Jam and older games that have been submitted to the site over the years. Based on the amount of submissions, games will be shown on as many computers as possible. Based on submissions and computers available, some computers will have multiple games on them which will change by a timer. The amount of games shown will reflect the diversity of members on the website. There will be a computer/group of computers where people can make plingpling games that can also be shown in the gallery. The show will coincide with the release of a Glorious Trainwrecks CD/Zine that will be available. WHAT WON'T BE ON THE FORM MEETINGS!!!!!!! WHEN ARE WE MEETING NEXT? Thank you to those who made it to the last meeting on short notice. It was also a great time finally seeing what a lot of you mystery icons look like in real life! :-) We are meeting March 10 at 7PM EST! hop in the discord to coordinate Also, here's the link to our Discord that we've been talking in. :-) Here are the notes from the last meeting and for previous meetings. ROLES We will need plenty of help with this in NY and outside of NY. If someone wants to make posters and such, those responsibilities will be listed here. Riley - Zine JP - Launcher Software Everyone - Make a poster please and post it here* Everyone - to make games Yuxin, Flan, Josie, Blake, and Dennis - Instillation Crew *see more in promotion section about making a poster SUBMISSIONS All submissions are due by March 14th @ 12:00 AM EST. Please restate what you want to submit in the comments below if you want to submit something from a past event. This should either be a game you have already made for Glorious Trainwrecks, or a new game for this event. Also, if you can, please submit executable files (.exe) for ease of making things work on the computers that we have. If you have something other than that, please send me a direct message. I will provide a list and links to each game here soon. Submit as many games as you'd like, but if something happens in regards to the launcher that we are going to make, we may need to have one game per person. ADVER-GAME JAM The game jam will be an Adver-Game jam where we post ads for the show inside of games that we spam to itch.io, game jolt, and new grounds. A link to this jam should be available soon. INSTILLATION I'll make a quick sketch of how things may be laid out soon. PHYSICAL GAMES To give people a real reason to come out, we thought of some physical versions of games on this site. Here is a short list of ones we talked about re-creating: Scramble The Eggnog Destroy Your Home Flickgame "What does glorious trainwrecks mean to you" Yellow Jogger Cosplay, YOU GET IN FOR FREE You Have to Put the Ball in the Cup You have to put the metroid in the samus a lot of these are documented in the google docs meeting notes SUPPLIES This will be a checklist for all the things we need for the event. Computers - 8/100 Keyboards - a couple/? Trackballs - a couple/? Posters Printed - 0/? amount of zines - 0/? Cardboard for brick boxes - 0/? Paint for cardboard - ✓ Egg nog/egg cartons/eggs - 0/? egg timer - 0/1 QWOP Bear for kissing - ✓ ball for cup - ✓ cup for ball - ✓ projectors - ✓ screens - ✓ makeup - ✓ EVENTS If we have any more events or specific things like that, we should all have ideas for things like this. If any of you play music or anything like that and will be in the New York area when that is happening, please let us know! Just throw out really crazy ideas for events too, like literally anything, brainstorm. :-) 1. a klik of the month klub this will be a very inclusive, open to the public event game engines like pling pling, flick game, klik n play, and more will be available on computers in the space it should happen on a saturday and be 2 hours long it should be fun and wacky, casual people should post their games to glorious trainwrecks by the end of it pirate kart 2. an opening event ihavefivehat and I were talking about a comedy x music thing that could be in theme with the vibe of glorious trainwrecks we were thinking of something kind of in the style of blue jam where the music selection is experiment is interspersed with comedy that is more in conversation with performance art to the extent where the comedy and music start and end right up next to one another very abruptly. There would be several short acts, 3-4, about 10-20 minutes each, over the course of the opening event, which would be from 8pm to 11pm and live streamed over the internet. These will be spaced out so to not distract from the instillation/games. these are some possible people we were thinking of reaching out to soon Lillyan Harry Lary Owens dreamcrusher this video isn't of his solo electric thing, but this is ihavefivehat's brother's band that he fronts ??? we would like to have 3-4 comedians and 3-4 music acts and are looking for more suggestions 3. a closing event : talk/interviews This is the least fleshed out as of right now, but I would like to reach out to Glorious Trainwrecks people to be interviewed at the closing. these are all people we should try to reach out to to be interviewed or to interview interviewees Jeremy Penner interviewers Naomi Clark Frank Lantz Tim Rogers Mattie Brice again, all of these people haven't been asked yet, just spitballin', please provide suggestions in the comments or on the discord! PROMOTION How will we promote these things? Everyone can make a poster and submit it here, Information that needs to be on the posters will be posted soon, hopefully tomorrow. 8-) The adver-game jam will also be used as a promotional tactic. 8-) NAME Do we want to just do Glorious Trainwrecks X Babycastles? I like that it could be pronounced "glorious trainwrecks cross babycastles" like "street fighter cross tekken" Here are names we came up with so far: Glorious Trainwrecks, Glorious Trainwrecks x Babycastles, Wizardcastle, Glorihorse Yellowcastle, yellow jogging babycastles, Glorious wizardcastle, "bureau of corrections, guatemala", Glorious Trainwrecks @ Baby Castles, GT: BC, BC: GT, At Babycastles, babywrecks, traincastles, glorious baby: castlewreck, traincastle babywreck, babytrain glorycastle Please comment about all of these things below. Thank you for your enthusiasm and participation! AttachmentSize map.png27.21 KB party.jpg82.46 KB tenor.gif44.46 KB babycastles_floor_plan.png1.47 MB Games made for Planning the Glorious Trainwrecks @ BBCastles Instillation 19 games made! View a random selection RSS Feed NameCreatedByScreenshotComments The Intracycle11/07/2018 - 09:55Trouv2 Numerous Wizards04/09/2018 - 06:30SpindleyQ5 peace or violence03/20/2018 - 23:13TheCakeFlavor0 don't give up03/17/2018 - 03:42hugs2 Wossisname in: Wossisname Makes a Choice (a flickgame)03/16/2018 - 04:23Healy0 Pastoral: A Flickgame03/16/2018 - 03:53Healy0 DRACULOID03/16/2018 - 02:29TheCakeFlavor4 JIGGLY ZONE03/15/2018 - 22:38sylvie11 Hostile Interview03/15/2018 - 21:22thatgu