["https://glorioustrainwrecks.com/node/164"]
title = "This is the place where you complain about the site. | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 11 hours ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more So, hey, after the Klik of the Month Klub #9 event page got sidetracked with "hey the site is broken" postings, I figured it might be a good idea to have a place where you can talk about the site itself. This is that place! If you look at the forum description, it also mentions things like suggesting community projects and starting up collaborations. You can do those things here, too! The Steel-Drivin' forum is all about figuring out how to make our little nook of the internet a more rhinoceros place to be.Community-Driven Moderation › I seem to be having trouble logging in. Logging in the usual way doesn't bring up a wrong password error, and I'm added to the 'who's online' list, but I'm not actually logged in. I've tried logging in multiple times so now there's a whole bunch of me in the 'logged in' list. The only was I was able to log in was by changing my password, which logs me in as part of the process. Edit: All the duplicate me's have vanished. Edit 2: Crap, the thread title had me thinking I was supposed to post about problems in this thread, not in this subforum. If only there was an option to delete posts... I just encountered this same problem! What appeared to be happening in my case was that I had cookies for both glorioustrainwrecks.com and new.glorioustrainwrecks.com, and PHP was grabbing the one for glorioustrainwrecks.com, which was expired or something. This may or may not have been your problem, but it's definitely worth checking for those of you having trouble logging in!'''
