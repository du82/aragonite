["https://glorioustrainwrecks.com/node/10280"]
title = "Game Making Tools Wiki | Glorious Trainwrecks"
full_description = "Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hey!!! I've been slowly adding things to this little wiki project of mine, and it'd be great if anyone here wanted to add a little something to it. Even just dump some helpful tutorial links, or write a little about a program you know, or correct my bad writing :) I hope it'll be a really good resource for people who want to start making games, and people who, like me, just forget how to do everything every time they load Unity or Construct or whatever D: https://www.gamemaking.tools/wiki/‹ rest in peace, klik leechin' 5 years later, I made my video! › I should mention that it has some more stuff available if you chop the 'wiki/' off the URL, too: https://www.gamemaking.tools/ Currently an events calendar and a little archive of resources I want to make sure don't disappear! (I really like making/working with wikis. Mediawiki is such a mess though) (If I can afford another domain I'd like to give it its own one ASAP. '.tools' is very expensive, so I won't bother with that one :( ) edit: oh whoops, I did. Turns out it wasn't expensive. I really like this idea, it totally makes sense. I looked around the regular site (no wiki) but the wiki one just gives me a ton of symbols. Am I doing something wrong? I got an email about this yesterday too, but for me it seems to be fine. Is it still messed up for other people? I made edits on the 5th of May, which is in between those times so.... strange! Turns out it's related to Chromium-based browsers, but I've updated and tested it and it renders fine now. Hope it works for everyone else :0"
