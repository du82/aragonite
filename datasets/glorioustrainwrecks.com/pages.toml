["https://glorioustrainwrecks.com/node/197"]
title = "rest in peace, klik leechin' | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more The "official" download link for Klik & Play is here. For convenience, I'll also list a few mirrors here: MediaFire Vetusware (via the Knp Korner -- thanks!) If all else fails, it's also locally mirrored here: glorioustrainwrecks.com/files/KPSchool.zip Happy klikkin'.‹ Tools Game Making Tools Wiki › One thing I never liked about the School edition of KnP was the fact that it had only a third of the klip-art that the kommercial version did. Since Clickteam has finally given up on even the School edition, I'm posting here the American Edition's full klipart library. I'm tired of seeing the same small subset of KnP sprites in every trainwreck, so here's some new fodder for your imagination, straight from my dusty old CD copy. Just put the contents in your Libs directory, and overwrite everything. Some of the libraries were cut down for the School edition, instead of just being left out. If people want me to, I'll post up the sound effects library and the midi library as well. AttachmentSize libs.zip3.27 MB Those KnP and library links totally need to be linked permanently on prominent areas of the site for the benefit of anyone who stumbles upon us. I just hope Clickteam doesn't discover us and get cease-and-desisty... should we act on this? I need to update the n00b fact (probably no one uses the n00b fact as much as I do, every month I forget what the irc host is...) For those who need them, knps.dll and knpg.dll are available here, or locally mirrored at glorioustrainwrecks.com/files/knpsknpg.zip'''
