["https://glorioustrainwrecks.com/node/10977"]
title = "Actual, Real-Live Glorious Trainwrecks @Babycastles proposal | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Mon, Jan 29 2018 02:34 PM Start: 01/29/2018 - 14:34 End: 02/04/2018 - 20:00 Timezone: Etc/GMT-7 UPDATE: It's been submitted, but we can still make changes if the proposal is picked up. Thanks everyone for your feedback and involvement! I've been involved with Babycastles for a little while now and THIS popped up. My first idea was that a group Glorious Trainwrecks show would be pretty sick. I gauged some interest in the Discord, and it seems as though people were pretty enthusiastic about it, so I thought I would post on here! So, I need your help! I figure, this should be a collaborative effort from the community to come up with what this show is. . . . UPDATED PROPOSAL 4 FEBRUARY 2018 WHAT WILL BE ON THE FORM Glorious Trainwrecks Goes to NYC is a salon style group show curated by and featuring many members from the Glorious Trainwrecks community. The games will consist of games made for a specific Glorious Trainwrecks Babycastles game Jam and older games that have been submitted to the site over the years. Based on the amount of submissions, games will be shown on as many computers as possible. Based on submissions and computers available, some computers will have multiple games on them which will change by a timer. The amount of games shown will reflect the diversity of members on the website. There will be a computer/group of computers where people can make flickgames and plingpling games that can also be shown in the gallery. The show will coincide with the release of a Glorious Trainwrecks CD/Zine that will be available. WHAT WON'T BE ON THE FORM Depending on how many computers there are, we will decide how many games we take per person. There will be a submission cut-off date. Submissions can be from the Babycastles Jam that will happen if the proposal is picked up, or they can be games you've already made. Games submitted/made should be things that they think would show well in a gallery/arcade/physical setting. When people submit games, they're required to have some metadata saying what input the game needs, whether sound (headphones?) is necessary, whether the game only runs on >Win32, etc. The Klik n Play making setup could look something like this. (maybe like this rubbing table) Events would take the form of performances, talks, and possibly tournaments by Glorious Trainwrecks adjacent people. Feel free to say if you are into any of these things or not, feedback is necessary! BUT Before any of this happens, we have to submit this by February the 5th! That's in about a week! So, we need to nail down some specifics for the form... A Description: I want to make sure everyone is happy with the description that is submitted. What games might the exhibition show? If you want to submit a previously made game, or if you know you want to make a game for the jam, please comment below so I know who exactly is interested in this. Events? Does anyone have any ideas for events that may happen during the exhibition? I thought an in person Klik of the Month could be cool. What would an opening and closing event be like? Also, how long maybe would this be open? I was thinking maybe about a month? When/Who can help? If anyone can help organize things, when would you be able to help? Also, if you are in New York or the New York area, would you be able to help set up things in the gallery? And together we can make the world a better place! :-) Also, if you have any question, feel free and I will try to answer them to the best of my ability. AttachmentSize Old_computers_with_a_Xerox_Star.jpg1.06 MB babycastles3.jpg63.17 KB babycastles3.jpg60.25 KB babycastles.jpg60.25 KB clock-300x282.jpg19.83 KB logo.png35.39 KB back-to-school-friends-clipart-9.jpg208.23 KB Rubbing-Table-participant-2-1024x767.jpg152.5 KB Screen Shot 2018-02-05 at 4.34.19 PM.png221.5 KB Games made for Actual, Real-Live Glorious Trainwrecks @Babycastles proposal 3 games made! View a random selection RSS Feed NameCreatedByScreenshotComments ⇆02/01/2018 - 23:10quasiotter9 Mr. Gun01/31/2018 - 10:48ihavefivehat4 9 Boring Levels01/30/2018 - 15:17wibi4"
