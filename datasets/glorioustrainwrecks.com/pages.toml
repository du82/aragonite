["https://glorioustrainwrecks.com/node/10674"]
title = "Soccer Judge III: Redemption | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: SoccerJudge3.zipThis next thrilling instalment in the Soccer Judge franchise sees the action move off the soccer court and into a court... of law. Made by Liam and Sergio, with vital unspecified creative contributions by Lucy! Source available here.Event Created For: TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104Made For: An event This is a pretty brave direction for the series to take, and I appreciate the exploration of the Soccer Judge lore. I also liked defending the burglar, who gets a short shift in most of the games he's in for some reason. Also, my headcanon is that this is a prequel. It just feels like one for some reason! Given that the first Soccer Judge game was inexplicably subtitled 'The Revenge', interpreting the series as being out of chronological order seems wise! My own headcanon of the second game is that it's a dream sequence (nightmare?) experienced by the judge at some point. But that doesn't really fit with the subtitle 'The Inciting Incident'… unless the judge's prejudices all stem from some random dream he had? OK, that's my headcanon now. I'm not sure I want to make more Soccer Judge games, but there are clearly parts of this story left to tell. Because it is bold and it is beautiful. Some phenomenal writing. I don't know that this will be my game of the year 2017, but this one moment could well be my screenshot of the year: [SPOILERS, obvs]. Great soundtrack, too. I agree with atuun, this seems like this could be a prequel, which would leave future entries in the franchise all kinds of new directions to explore. With so much new Soccer Judge content in such quick succession after the original seven years ago, this is kinda feeling like Glorious Trainwrecks's own Twin Peaks moment."
