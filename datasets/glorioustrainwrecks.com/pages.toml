["https://glorioustrainwrecks.com/node/12330"]
title = "hi | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more figured i should give everyone who cares an update since i'm Still Alive most of my focus has been toward animation and comics these days, but i still want to make another game someday (which is something i constantly tell myself for a few years now). i have a couple ideas floating around, just need to open RPG Maker up and start throwing them together. i also feel the need to contextualize some stuff, as a lot of the stuff i made and said over here were when i was still a middle schooler (i'm 20 right now, btw) and uhh yeah looking back at those things i can't help but feel a bit embarrassed lol. i'll try not to be super harsh on myself about this stuff but yeah Lol i apologize for any dumbassery of my part from back then, and my most sincere Thank You to all who have supported my vidya making endeavors. the games i made back then were pretty defining for the overall direction i wanted to take my art in, and joining this community definitely helped as well :) thanks for reading, and please let me know if you're interested in checking out some of my New Stuff in comics + animation !! (btw i don't plan on keeping the nuuup username bc it honestly doesn't represent me anymore, but i'll probably keep it for the time being) Wow hi nuuup (edit: uh, a bunch of my comment went missing) Good to hear from you. Definitely interested to see what you're making now. Hi nuuup! I meant to comment on this right after you posted, but I'm afraid I'm only getting around to it now. I have a strong suspicion that just from the time you were active here, you are probably one of the people who has made the most games in the world, and I think that's something to be extremely proud of, honestly. It's really good to read from you again, and I'd definitely be interested in seeing what you're up to now."
