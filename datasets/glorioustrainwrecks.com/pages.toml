["https://glorioustrainwrecks.com/node/12357"]
title = "Sekret Santa 2023 | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Fri, Nov 24 2023 06:33 PM Start: 11/24/2023 - 18:33 End: 01/05/2024 - 18:33 Timezone: Etc/GMT-7 we didn't do sekret santa last year cause "we forgot" and this year it falls unto me. Welcome back to "THE RETURN OF" Glorious Trainwrecks Sekret Satan 2023! This year I'd like to start by addressing a query people have asked about the Sekret Santa event, because it seems a lot of you had this concern: Q. I haven't finished a previous year's Sekret Santa, is it still okay for me to enter again this year? A. It IS okay! please do not feel bad about entering Sekret Santa even if you couldn't finish a previous one. We're all doing this for free, and it seems unreasonable to force someone to finish an overdue assignment without pay. this is meant to be fun, not a job. if you didn't finish an old santa, then that is what happened and we must simply move on and accept it. "ALL DEBTS ARE FORGIVEN" All previously unfinished santas have been forgiven. You are now free of your debt. I used to have a recurring nightmare where my teachers tracked me down and forced me to do all the homework I never completed. Let's not make that nightmare a reality. Onward! The Instructions: Step 1: Post your list in the comments below. A short list of what you want your game to include. There are a few additional constraints to this this year, (see below) Step 2: On 8 December, You will be told your recipient, and you will be tasked with making a game for them. You will also be invited to one of two discord servers where you can talk about developing your project without your recipient knowing! unless I forget this part! it's my first year running this Step 3: Then you will submit your games before the soft deadline of 5th january OR ANY TIME AFTER!! I'm not the boss of you! Additional Constraints on lists: I noticed in recent years lists were frequently becoming longer, more complicated, and highly specific. people were treating the list like they were commissioning a specific dream game, which is not how we want this to work, or fun for the list's recipient to make something that might be out of their abilities to actually make. Instead of enforcing rules on how much you're allowed to request, I instead wanted to just make people aware of this and determine the fairness and length of their list using their own intuition. (recommended about 4, 5, or 6 bullet points) try and avoid requesting a specific genre, and remember to allow your recipient to play fast and loose with what you put on your list. it's their game, and you may be surprised by the end result not resembling what you had in mind! that's part of the fun! Good luck!!! Games made for Sekret Santa 2023 8 games made! View a random selection RSS Feed NameCreatedByScreenshotComments monkey trouble (for luok)05/23/2024 - 12:58eels0 march 31 2024 (6 rectangular segments of sky)03/31/2024 - 21:48gurnburial1 Spiders and Guns Funpak (For mutantleg)01/20/2024 - 16:14gisbrecht5 Chips and Chats (for Nighten)01/05/2024 - 21:47planetmoss7 Trip Down the Chip Mine [for noser]01/04/2024 - 10:53NIGHTEN5 A Rainy Day (for planetmoss)12/26/2023 - 03:59mutantleg6 December Drive (Sekret Santa 2023 for Blueberry Soft)12/24/2023 - 15:35Hansov3 Colonel Bleep in the Snowball Zone [Santa 2023 for Hansov]12/22/2023 - 06:23Noser1'''
