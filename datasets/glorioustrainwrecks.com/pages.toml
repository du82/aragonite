title = "Flyin Wif Fweinds | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File (Mac): FlyingWifFreinds.zipGame File: FlyingWifFreindsWin.zipFly with your friends around a neon colored island in the middle of some kind of void. The other planes try to follow you and maybe if you slow up they'll catch up. This is the first game I've released in some months. CONTROLS!!!! IMPORTANT!!!! W - add thrust S - Remove Thrust Mouse Up/down - Pitch up/down Mouse left/right - Roll left/right now with a windows buildEvent Created For: TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104Made For: An event This is awesome! I love the colors and the sounds and your flying friends. I wish the world was a little bigger though, I had to turn around every 2 seconds to avoid flying off into the void. I was at a bookstore today and I passed over a book on making little papercraft dolls. I was looking for books that would be good for game dev and the designs were neat, but I was skeptical that they would translate into videogame super well, but the planes you have here are amazing. I played with a friend and we spent a lot of time frantically searching for that tiny island, with only a vague sense of whether our plane was upside-down or not. I eventually came to regard "the world" as just a take-off / landing strip, with "the void" as the main space for gameplay, with fweinds' planes flying around to keep things interesting. This is curiously pleasurable. Here are my synergy equation component observations: - The colors are warm and unreal. - The plane model quickly impresses a particular meaning of “play.” - The exact number of fellow planes is friendly, anti-lonely; their clumsy unsynchronized struggles at flight are nonthreatening, charming. - Water is relaxing. - Flying is fun. In sum: endorphins so hard the head slightly rattles?'''
