["https://glorioustrainwrecks.com/node/10883"]
title = "Sekret Santa 2017 | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Wed, Nov 22 2017 03:00 AM Start: 11/22/2017 - 03:00 End: 01/07/2018 - 03:00 Timezone: Etc/GMT-7 UPDATE: The deadline may have passed, but the KLIKMAS/CHISTMAS SPIRIT lives on! Enjoy playing the games made for this edition of the Sekret Santa Klub. And if you're one of those folks still working on your gift for someone else, please stick with it and be sure to post it here once you're done. /// HO HO HO all you GT'ers out there! It's time once again for us to celebrate making games with gusto. It's the SEKRET SANTA 2017! Here's how it works. There are 3 steps to follow. STEP 1 (CLOSED): Post your wish list in the comments below. Let us know what kind of game you want FOR CHISTMAS. Due 3rd December. It can be anything you want. When I was a kid I would have an itemized list set up for my parents after I browsed through the entire JCPenney Christmas catalogue. You can do the same thing, but for stuff you want to see in your very own game. STEP 2 (CLOSED): On December 3rd, you receive your assigned game recipient. Have a look at their list and be inspired to make a game for them. STEP 3 (ACTIVE): Submit your game for this event, and post notice of it to the recipient! Games are due (kind of) by 7th January, 2018. NOW. On to the Santa gifs: Previous Sekret Santa events... HUGE THANKS to Danni for starting this train rolling. :) 2016: https://www.glorioustrainwrecks.com/node/10400 2015: https://www.glorioustrainwrecks.com/node/9921 2014: https://www.glorioustrainwrecks.com/node/8883 2013: https://www.glorioustrainwrecks.com/node/6560 2012: https://www.glorioustrainwrecks.com/node/4574 Maybe the genesis...? https://www.glorioustrainwrecks.com/node/2065 Games made for Sekret Santa 2017 15 games made! View a random selection RSS Feed NameCreatedByScreenshotComments The List (for hellojed)04/26/2019 - 09:54spiral13 noontooth - les dents du midi FOR QUASIOTTER01/13/2018 - 15:57TheCakeFlavor7 Merry Cake-flavoured Chisrmas01/11/2018 - 06:45Blueberry Soft13 Mr.Petes is lost! (for hugs)01/10/2018 - 15:11clyde10 Spheniscidaeaphobia - Blood on the Snow01/10/2018 - 08:25akair5 Donkey Kong's Revenge for danyburton Klikmas game01/08/2018 - 06:14Capt_hastings-C...11 Rental Monoceres Heavy Industries Tree Ornament Applicator - For Blueberry Soft01/07/2018 - 02:10hellojed7 Monster Truck Power Fantasy (for Stranger)01/07/2018 - 02:09Alchiggins10 Germology for akair01/07/2018 - 00:37danyburton9 hot shark for our friend drambique very nice01/05/2018 - 11:44quasiotter5 I.D.A. Share - for Son of a dolphin01/04/2018 - 17:32Stranger6 Dongers MINI- Harmonium- for mkapolk!01/04/2018 - 16:04Anonymous7 The Squite - Merry Klikmas Mr ._a!!!!12/30/2017 - 11:16mkapolk6 Dingos and Dungeons Game Night - for mno!12/24/2017 - 12:20atuun5 MERRY CHRISTMAS, MR. SPACEDOG12/24/2017 - 09:40fortunepalace6"
