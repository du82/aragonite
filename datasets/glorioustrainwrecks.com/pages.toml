["https://glorioustrainwrecks.com/node/11706"]
title = 'This critique of "The White Doe of Rylstone" | Glorious Trainwrecks'
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more The Sun : "But we wish to observe, that one of the chief errors of this School is, in aiming at nature and simplicity, to employ low, ambiguous, and vulgar language, which is more apt to debase the sentiment than to be exalted by the sentiment.... Our objections are equally strong to the jargon about 'presences,' 'influences,' 'mortal,' and other words of the same class, which are so largely employed without definite meaning, and seem rather the type of some mystical confusion in the mind of the writer, than the sign of any rational and embodied idea. Yet with all these defects, there is a charm in this species of poetry, as we think our extracts will prove, which leads us to admire while we lament, and to love while we reprove. We wish sincerely there were more of the genuine gold, and less of the dross; more of true feeling, and less waste of morbid affections; and that we might prolong these remarks by further specimens of the beauties of the White Doe, even though we seem rather to have transgressed our limits" (16 August 1815).‹ looking for scott cawthon's old games Purse Dr › I looked-up the poem after reading your excerpt of its reviews. Here's a link, for those interested: http://spenserians.cath.vt.edu/TextRecord.php?textsid=35968 I'm only very recently attempting deliberate reading (and sometimes, writing) of poetry. I'm a novice, but I enjoy reflecting on previous works, and I think there's value to the practice. To see poetry critique from the time of its writing is interesting. It reminds me of the media reviewers of today, whether in magazines or online, and considering that maybe these will be the only way the world at large will ever know of their thoughts or efforts in making stuff: critiquing the works of others. So Clyde: do you think (or is it known for certain) that the reviewers weren't fond of historical allegory? Weren't fond of Wordsworth? Weren't fond of "the state of poetry writers today," perhaps hinted in their "wish" detailed in the latter part? Also Clyde: do you mean to apply this kind of assessment to the media (and maybe in specific, video games) of today? What are your thoughts?'''
