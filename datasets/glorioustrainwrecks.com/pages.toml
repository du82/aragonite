["https://glorioustrainwrecks.com/blog/1080"]
title = "Healy's blog | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more I've updated my game Bedtime Adventure! Changes include: -Four more things to do before going to bed! -Expanded alpaca content! -A new title screen, drawn by me, that doesn't have the title cut off by the menu! (Because I forgot to draw it, whoops.) -A couple more things in the room, mostly to help with blocking -Advertised 5-10 minute playtime now more accurate than generous -Changed a bit of Larry's speech to more accurately reflect the true meaning of art -And other miscellaneous tweaks. Please let me know if there are any issues, or you just hate the new changes, or whatever. Happy Soos's birthday, everybody! To celebrate, have this, an unfinished Gravity Falls twine game I started for Yuletide one year. It's about Stan and Mabel and Dipper and their crummy made-up holiday. It's an unfinished piece of junk, but I decided to upload it anyway because, well, because... Emily Short hosted a game jam recently called Bring Out Your Dead, where you uploaded long-dead WIPs and experiments in the hopes that someone else could learn from them. The concept really interested me, and since this was the most well-formed WIP I had that I'd likely never finish, I figured it wouldn't hurt to try something out with it. I took the old, unfinished game and added some commentary to it, usually to point out its flaws, but sometimes to discuss Gravity Falls for a bit (or point out a line I liked). It's a very short game, and probably would have been even if it were completed; I only completed one ending, and the other two branches cut off suddenly. Still, I hope you get something out of it, even if it's just "Don't do what I did here, kids." (Sergio, my man: I have gotten your message, and while I haven't worked on my Knytt Swap lately, I'll probably block out some time for it next weekend. For reasons.)'''
