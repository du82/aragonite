title = "TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104 | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Sat, Jun 03 2017 04:00 PM Start: 06/03/2017 - 16:00 End: 06/03/2017 - 18:00 Timezone: US/Pacific Can you believe Klik of the Month Klub has been around for TEN YEARS!? It's true! June 3rd marks the 10th birthday of this fantastic event, and even though it's been a while since the last one, I thought a traditional 2-hour game making event would be the best way to celebrate. The official time of this event is set for June 3rd, 4pm Pacific Time. But, if you want to make something outside of the allocated time and submit it to this event, go ahead! Klik & Play is free to download and super easy to learn. Unfortunately, it doesn't run on most modern computers, nor will it produce games that do. If that's a problem for you for some reason, then The Games Factory might be the next best thing! Alternatively, there are plenty of other tools and level editors around you could use to make something, such as: Bitsy, kooltool, flatpack, 0m3ga Visual Novel Engine, 3D RAD, VVVVVV: Make and Play Edition, flickuboy, ThingLink, Boppin' Editor, Tabletop Simulator, Castles of Adventure, Sword of Moonlight, The Almighty Paintbrush, Silent Walk: RENAISSANCE, Bangai-O Spirits and Yellow Jogger Laser Platform Madness. Want to talk to other game makers instead of working in total isolation? The traditional method is IRC, which you can connect to right here on the site or using the settings server irc.freenode.net, channel #glorioustrainwrecks. This time around, I'd also like to try out using the altgamez Discord channel where a bunch of us hang out anyway! When you've made your game, submit it here! You can also use the "Sign up" option below if you'd like an ominous email reminder about the event. SEE YOU THERE! Games made for TEN GLORIOUS YEARS OF GAMES: Klik of the Month Klub #104 30 games made! View a random selection RSS Feed NameCreatedByScreenshotComments World Of Explore PRO Edition (ordered by Sergio Cornaga)08/20/2017 - 19:19spiral4 Harold Wants Orange Juice06/29/2017 - 00:12Protohm Johnny5 MEATBALL EYES (A Tribute to Nuuup)06/21/2017 - 16:31Protohm Johnny3 I Jab at Thee06/09/2017 - 10:31decky4 Battle Cheese In Spookyland PLUS06/05/2017 - 11:32FirecatFG3 Soccer Judge III: Redemption06/05/2017 - 03:27sergiocornaga9 City Life 2: Speed City Nights (And Days!!!!!!!!!)06/04/2017 - 16:13ihavefivehat5 The Quest for the Platinum Fart06/04/2017 - 11:28SpindleyQ3 KNP Tetris: The Grandmaster 4: Laughing Instinct06/04/2017 - 10:14Danni9 Matterhorn06/04/2017 - 08:32Tophwells3 Ungrateful Birds06/04/2017 - 02:51thesycophant2 Cute Space06/03/2017 - 19:41atuun3 roll the dice ant dirt grass rock stick sky06/03/2017 - 19:28everythingstaken0 slowdance-2h06/03/2017 - 19:12mr._a5 Soccer Judge 2: The Inciting Incident06/03/2017 - 19:09sergiocornaga11 KNP THE BOARD GAME06/03/2017 - 18:33gisbrecht1 The Word06/03/2017 - 18:31increpare2 POKOMON HELL06/03/2017 - 18:28illteteka5 Jewels vs. Train Cars: The Ultimate Battle06/03/2017 - 18:26tininsteelian2 The last days of the man who looked at a duck06/03/2017 - 18:22fizzhog5 Flyin Wif Fweinds06/03/2017 - 17:47hellojed5 that one screensaver06/03/2017 - 17:41mkapolk4 SWEET FIRE SRIRACHA COTTON CANDY06/03/2017 - 17:33XenosNS1 Super Make A Baby06/03/2017 - 17:32Strong3 I never liked this game06/03/2017 - 17:15mkapolk5 12next ›last »'''
