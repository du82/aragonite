["https://glorioustrainwrecks.com/node/12211"]
title = "Open World Jam | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.3 weeks 5 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 16 weeks ago sharecart jam '22-'231 year 18 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Start time in your timezone: Fri, Mar 11 2022 11:53 PM Start: 03/11/2022 - 23:53 End: 10/31/2023 - 23:53 Timezone: Etc/GMT-7 the legend of zelda: breath of the wild (2017) "Open World" games are the current "hot" thing in video games right now. these games are vast, have massive budgets and take years to make. but I believe that they can be made within weeks, on a budget of $0. far cry the goal of the open-world jam is to make one of these games. what defines an open-world game? well it's very loosely defined. but here's some things - large map with lots of points of interest - back of the game box would describe it as "vast" or "a massive game world" or such - a continuous space with no load times (YOU DON'T HAVE TO DO THIS PART IF YOU DON'T WANT) - lots of "collectables" and "items" see how much of the player's time you can fill with as little effort as possible. maybe some procedurally generated content? maybe some large, sparse expanses? FAQ: Q: is yume nikki an "open world game"? A: yes Q: what if I can't make a world that big? A: you can make it very small, it's allowed Q: is [game] an open world game? A: let's just say yes Q: may I submit an unfinished game? A: all open world games are unfinished in some way, so yes feel free to play fast and loose with the concept. now go! out! into the world! Games made for Open World Jam 9 games made! View a random selection RSS Feed NameCreatedByScreenshotComments Vacantown08/26/2024 - 10:59Godahl0 Friendship World11/21/2023 - 03:22Cube_Well0 Contamninated Skies10/30/2023 - 16:14Knowitall662 GILGAMESH II11/13/2022 - 14:24town-map1 ZOZ1