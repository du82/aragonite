["https://glorioustrainwrecks.com/node/11239"]
title = "I deleted an account today. | Glorious Trainwrecks"
full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more I have banned Selfish Dream and deleted their games. I'll give you all the same reasons I gave them: - A harassment campaign was started against one of our members which resulted in death threats being sent for days after negative comments Selfish Dream made about their apparent belief that racism & sexism is bad. - It came to my attention that Selfish Dream posted a game that appears to be about being a violent rapist, with explicitly graphic, threatening language in the description. Games about sexual violence that are at best indifferent about who they might hurt do not have a place on Glorious Trainwrecks. Their response made it clear to me that they do not have any desire to engage with criticism of their work, and they don't appear to believe they have a responsibility to ensure people in this community are not hurt by their words or their work. Quite frankly, they didn't appear concerned that anyone here was hurt at all, just that they were not seen as responsible. For this reason I do not feel comfortable hosting their work. Everything I said the last time I deleted a game remains true. I would like to address one particular thing Selfish Dream brought up in their response to me: "I thought Glorious Trainwrecks supported freedom of speech and artistic expression." Glorious Trainwrecks has always been about being a comfortable place where people are kind to each other. I've been part of many toxic forums & communities on the internet in the past, and since I started the site 11 years ago, it has always been my primary goal to ensure that Glorious Trainwrecks does not become one. Quite frankly, it has been the only constant goal - people coming here with the goal of contributing positively to this community should feel welcomed. I want to be clear: it is OK to make games about difficult subjects, and it's OK to fuck up! But if someone tells you that your game is irresponsible, that your words are hurtful, that you inadvertently caused them harm, it is not OK to brush off their criticism. Glorious Trainwrecks works only if we are able to trust each other, if we listen to, respect, and support each other. Good-faith communication is harder than "free speech", but that is what is expected here. One more thing: I definitely think it is not tenable for me to be the only moderator on this site. I used to read every post and play every game; I haven't had that level of involvement for years. I only see this stuff because people flag it to me. I would rather the community to have the tools to be empowered to handle situations like this on their own. What exactly this looks like, I'm not certain. But please comment or PM me with ideas, people you would trust to be moderators, or to volunteer.‹ Server Move Best GTs of 2018-2019? ›'''
