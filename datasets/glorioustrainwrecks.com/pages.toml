["https://glorioustrainwrecks.com/taxonomy/term/3111"]
title = "8-bit | Glorious Trainwrecks"
full_description = "Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Maggie and Peter are bounty hunters - at least they were, until Maggie's ex-girlfriend Eleanor hires them to solve a mystery. Her rare insect collection was stolen, and she would like it back. Also, Peter is a sentient explosion, and I personally think that is really cool! Will Maggie and Peter find the missing bugs? Will Maggie win Eleanor back or will she finally listen to Peter and move on? Does a game count as a visual novel if you control a moving character? --------------------------------------------- Made for bpseudopod for the 2024 Glorious Trainwrecks Sekret Santa Jam, who requested a game with: -cool or nice bugs -a mystery -a betrayal -a talking explosion who is your pal This was a very fun prompt to work with! I hope ya like it! --------------------------------------------- Controls: arrow keys/WASD : move e/space/enter : progress dialogue esc : quit --------------------------------------------- Created using Game Maker Studio, GIMP, BFXR, and Lovely Composer! Thanks for playing! --------------------------------------------- More games here: alexandrah.neocities.orgEvent Created For: Sekret Santa 2024.Made For: An event Game link: https://fernandoairescastello.itch.io/magic-dungeonMAGIC DUNGEON is a mini-roguelike, turn-based dungeon-crawler videogame product. Descend and explore the increasingly perilous 50 floors of the magically (procedurally) generated dungeon, collect all the treasures and escape alive! I made this game in 7 days for the 7DRL Challenge 2023 :)Author: Fernando Aires CastelloMade For: An event *** EXPLORER PHANTASY *** (The videogame that never was. Or rather maybe someday it will become true) STRAIGHT FROM THE MANUAL: A vast phantasy world to explore!!! Travel across expansive lush green open fields!!! Make your way through scorching deserts!!! Withstand the freezing gusts and snowstorms in icy landscapes!!! Swim and sail in lakes, rivers and endless blue oceans!!! Reach far away forsaken islands!!! Dive deep in treacherous waters!!! Encounter beautiful valleys and waterfalls!!! Climb atop the highest mountains!!! Delve into dark caverns!!! Descend under the depths of trap-ridden dungeons!!! Find your way in and out of twisted labyrinths!!! Discover hidden and valuable treasures inside ancient ruined temples!!! Explore the rooms and corridors of castles, palaces and abandoned forts!!! Enjoy the magnificent views from atop skyscraping towers!!! Unearth magic artifacts of lore!!! Encounter fabled mythical creatures!!! Perhaps even soar high into the sky among the clouds!!! And ultimately conquer the stars and outer space!!! All while engaging in epic battles with fierce monsters!!! And avoiding tons of ingenious traps scattered all over the world devised by the long-forgotten ancient civilizations!!! DO YOU DARE STEP INTO THE MAGICAL REALMS OF PHANTASY??? ARE YOU READY TO TAKE ON THIS EXCITING ADVENTURE??? WILL YOU ACCEPT THE ULTIMATE CHALLENGE OF EXPLORATION??? IF SO, THEN YOU MAY ENTER THIS PHANTASY DOMAIN!!! *** ENJOY THE EXPLORER PHANTASY!!! *** CREDITS: The overworld map image was created using TileGameMaker - https://youtu.be/GLIpU6aADKw - https://github.com/FernandoAiresCastello/TileGameMaker All images and text are copyleft 2020 by facastelloEvent Created For: Fictional GamesMade For: An event"
