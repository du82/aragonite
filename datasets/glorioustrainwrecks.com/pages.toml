full_description = '''Development Diaries Forums Trainspotting Locomotive Engineers The Dining Car Steel-Drivin' Post Recent changes RSS Feed Recent posts Sekret Santa 2024.3 weeks 6 days ago Event What Exists To Submit Knytt Stories Levels To1 year 4 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Hello Glorious Trainwrecks community, You may have noticed a lot of posts from RustyMoon/Uuuuuuuuuuuu in the past day. This user was privately asked twice to remove misogynist slurs from their game description; their response to this was ultimately to replace the titles of their games and descriptions with asterisks, complain about progressives ruining Glorious Trainwrecks, and make events called "Poo Jam" and "Pee Jam" before being blocked. This user has asked that their account be deleted, and I have done so. Unfortunately this means many users' comments on pages RustyMoon created have been lost. Also yesterday, the user danyburton made a long post titled "Why I Hate Alt-Games" which was a fairly direct attack on the work of a substantial portion of our community. He also participated in the aggressive posting this morning, much of which is now deleted as it was in response to content that RustyMoon created. The post has been deleted and danyburton's account has been blocked. My comments from the last time I deleted an account stand. If you are here only to satisfy yourself and don't care who is hurt by your work or your actions, then this is not the community for you. Many thanks to the Glorious Trainwrecks moderation team for taking the lead on dealing with this situation.‹ Hotels in Little Rock AR ~ Event ideas plonking thread ~ ›'''
