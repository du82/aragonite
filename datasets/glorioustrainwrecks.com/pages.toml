["https://glorioustrainwrecks.com/taxonomy/term/345"]
title = "platform | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more ummm here is my "video game" secret info: f4 to fullscreen, game autosaves, delete the ini file it creates to restart your progress requirements: A combination/clash of two themes/aesthetics that aren't typically seen together A gimmick or mechanic that leaves no corner of the game unscathed ("really? did it really have to also affect this?") Homemade ambient track A parable that teaches the player a lesson quite different from any parable they have heard before A fun or interesting character controller, or one with two different modes wasn't able to hit the second and fourth marks BUT i have achieved combining the aesthetics of 'pixel art' and 'vector flash gradients' as well as 'cute character' in 'uncute environment.' made a couple homemade ambient flavored tracks and movement is platformer but can also propel yourself by shooting credits: sound effects were made with jsfxr i did not make the song that plays in the bonus level the world 2 song uses a sample that's just a clip of another song, and it is not a song that i made. i don't know what song it is i found it in a silly video and i wasn't able to successfully find the source of the audio but i do know that i did not make itEvent Created For: Sekret Santa 2024.Made For: An event A "local multiplayer mouse-based tug of war platform fighter." I've typed this phrase approximately 3000 times. I've typed the explanation for what that means 3000 more. This is my fault for making such a high concept video game. You and your opponent stand or sit across from one another. The mouse is in between you. You each place a hand on your side of the mouse. When the game begins, the goomba-like monster is mouse controlled. Try to move it towards your lumberjack to get them to jump on it. If they do, THEY become mouse controlled and you now must move your lumberjack towards your opponent's lumberjack to bounce off of them and reduce their lives to zero. It's also possible to win by reducing your opponent's OUCH meter to zero. Do this by getting them to land in the same place the just-jumped-on monster sits dazed. Thirdly, the monster will "explode" when the timer runs out in a timed match. Anybody standing nearby will immediately have their lives reduced to zero (even if their life bar is set to infinite! Yow!). By "anybody" I mean "anybody who exists inside of the game." You, the player, should be safe. I made the game customizable so you could theoretically do a "ouch drain only" match or a "countdown to destruction" match where you try to get the opponent exploded when the timer hits zero. Not everybody is able or willing to use the mouse so you can also use the keyboard keys or the left thumbstick on an Xbox controller. I think this is a pretty fun little bite-sized party game (ANOTHER genre???) and I hope you have fun with it too! Attached is a .gif to give a better idea of how the game plays.Made For: An event'''
