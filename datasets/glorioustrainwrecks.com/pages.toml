["https://glorioustrainwrecks.com/event/2022/04/22/table/all/all"]
title = "Events | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more inspired by lost histories jam*, this is an alphabetical list of games where experiences of a game are more important than the game itself. click this link to view/edit https://docs.google.com/presentation/d/1sV1LM_lsAbNmOCBikjAOw3q5EHxtbFWkIvSXYywjUrQ/edit?usp=sharing to contribute: ♥ add a page ♥ format it however you want ♥ include proper credits guidelines ♥ choose a game because of how important it is to you, not to culture at large ♥ don't edit/delete anyone else's work without their permission ♥ pics must be safe for work but writing doesn't have to be; please provide content warning if so * https://itch.io/jam/lost-histories-jam gifs will be added later lol the legend of zelda: breath of the wild (2017) "Open World" games are the current "hot" thing in video games right now. these games are vast, have massive budgets and take years to make. but I believe that they can be made within weeks, on a budget of $0. far cry the goal of the open-world jam is to make one of these games. what defines an open-world game? well it's very loosely defined. but here's some things - large map with lots of points of interest - back of the game box would describe it as "vast" or "a massive game world" or such - a continuous space with no load times (YOU DON'T HAVE TO DO THIS PART IF YOU DON'T WANT) - lots of "collectables" and "items" see how much of the player's time you can fill with as little effort as possible. maybe some procedurally generated content? maybe some large, sparse expanses? FAQ: Q: is yume nikki an "open world game"? A: yes Q: what if I can't make a world that big? A: you can make it very small, it's allowed Q: is [game] an open world game? A: let's just say yes Q: may I submit an unfinished game? A: all open world games are unfinished in some way, so yes feel free to play fast and loose with the concept. now go! out! into the world!'''
