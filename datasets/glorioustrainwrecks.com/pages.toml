["https://glorioustrainwrecks.com/node/12407"]
title = "Freeway 2 | Glorious Trainwrecks"
full_description = '''Sekret Santa 2024.4 weeks 1 day ago Event What Exists To Submit Knytt Stories Levels To1 year 5 weeks ago Sekret Santa 20231 year 7 weeks ago Open World Jam1 year 17 weeks ago sharecart jam '22-'231 year 19 weeks ago Bug Mystery? The Explosion Speaks! (for bpseudopod) Lonely Space (for Alchiggins) Escape from Penguin Prison (for pikachu) coast (for astralCastoff) more Game File: freeway2.zipFreeway 2's Chicken wants to know how you're doing, she says "cluck", which means "hey" in chicken! ﻿ But what is Freeway 2? Freeway 2 is the greatest Corel Click & Create game yet! It's a parody of Activision's Freeway in Real 3D! But how is this possible? Isn't Click & Create 2D only? That's what I used to think too, until I found Syntesis Entertainment's Klik OpenGL X extension, adding real 3D to Click & Create! Now, for the star of the show: Freeway 2! Freeway 2 is a simple game, you play as a little chicken and you cross the road multiple times to stack up points! Each time you touch the sidewalk, you score a point, but don't you let one of those cars touch you, as that would tragically end multiple lives in an explosion! Simple in concept, endless replay value! and if you don't want the gameplay being brought to a halt whenever you die, while in game, go to the menu bar and select Options, then click on Mode 2. Does crossing a Freeway sound like fun to you? Does being a chicken sound like fun to you? How about this, does DYING IN AN EXPLOSION SOUND LIKE FUN TO YOU? If any of the first two questions sound like fun to you, download Freeway 2 right now! If the last question sounds like fun to you, seek help now!Made For: An event AttachmentSize hey.png259.87 KB Screenshot5.png152.65 KB klik.png217.16 KB Screenshot3.png159.31 KB at first i thought this game is super hard. i couldnt figure out how to move camera and im not sure if its intended to have no camera control. but then i realised there are savespots between cars. got mindblowing 2 score and then died right before getting 3rd score point. fixed camera adds up to the experience as when you need to go back you barely see anything. finding proper time to go forward is easy but challenge is to not overshoot and stay in the next savespot which turns it into some weird rhythm game. also im obsessed with this type of 3d graphics AttachmentSize Untitled.png68.79 KB'''
