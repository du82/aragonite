["https://gmplib.org/gmpbench"]
title = "GMPbench results"
full_description = "GMPbench results. We have run the benchmark on the highest-frequency CPU of each type to which we have convenient access. Scaling to lower or higher frequencies should work well, since GMP mainly works off the caches. The GMPbench suite is available for download. To run the benchmarks, you also need to compile gexpr.c and put it somewhere in your path. GMP exercises a particular set of processor capabilities, widening integer multiplication being the most important one. Processors with poor integer multiply support get worse scores on GMPbench than on other benchmarks. GMPbench measures multiplication of same size and different size operands, squaring, division, gcd, and extended gcd, and then RSA encryption and π computation. That's it. GMP typically performs a whole lot more operations which are not measured at all. Let us make it absolutely clear that GMP exercises just integer instructions, and that GMPbench thus is an integer benchmark. We often see claims to the contrary, i.e. that it is a floating-point benchmark. GMPbench is a single-threaded benchmark. Most CPUs below can execute multiple threads in parallel using some separate and some shared hardware resources. Most operations in GMP up to quite large operand sizes would scale very well over multi-core systems, but poorly with SMT. A hypothetical multi-threaded GMPbench would therefore give about 8 times the current Ryzen 2700X score but only about 4 times the current Xeon E3-1270v5 score. The results below have been measured with software workarounds for the various hardware bugs (Meltdown, Spectre, L1TF, MDS, etc) at various stages of completeness. BIOS were at the newest available version, but the latest vendor provided microcode was not provided unless provided by the BIOS. We don't have an estimate of the slowdown GMP will suffer when workarounds are final. Preliminary measurements for Intel Skylake (and thus Kaby Lake, Coffee Lake, Whiskey Lake, Amber Lake, Fool Ake, etc which are all just Sky Lake reiterations) indicate significant slowdown. We see no slowdown for AMD CPUs. There might be newer Intel CPUs which have been bug fixed, but last time we checked (in mid 2020) the bugs were discovered faster than they were fixed. Performance results which are inflated by corners being cut resulting in a security disaster are not of great interest. We have therefore crossed over Intel results."
