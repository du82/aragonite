["https://gmplib.org/pi-with-gmp"]
title = "GMP Pi computation"
full_description = '''While GMP is a general-purpose library for arithmetic on large numbers, it also works very well for such special tasks as computing a silly number of digits of π. This program, written by Hanhong Xue, is all that's needed. How do these numbers compare to other π computing programs out there? Many π programs proclaim themselves as "the fastest", but then they are actually several times slower than gmp-chudnovsky.c with the current GMP release. Compare the numbers! Using GMP, a fast 64-bit computer, and sufficient memory, it should be possible to compute up to 41 billion digits. Unfortunately, the memory requirements are about 8n bytes for computing n digits, which will make most desktop computers unfit for 41 billion digit computations. Memory locality in GMP's FFT multiply code is not good enough for efficient computation with operands on disk. Attempting computations of more than 41 billion digits will cause overflow in the mpz type. A planned future version of GMP will allow the patient and wealthy to compute up to at least 1 quadrillion (1015) digits, and unlike current GMP, this future GMP will operate fine with operands on disk. One needs around 250 top-capacity rust swap disks in order to compute 1 quadrillion digits, but hopefully that will qualify for a discount ("buy 250, pay for 249"). Note: All Intel processors below are affected by the security bugs Meltdown, Spectre, Foreshadow, and MDS. Skylake is further affected by the security bug Jcc. With proper workarounds, the performance of the Intel processors would be considerably lower!'''
year_published = 2025
clearnet = "https://gmplib.org/pi-with-gmp"
