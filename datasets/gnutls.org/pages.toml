["https://gnutls.org/manual/html_node/Simple-client-example-with-anonymous-authentication.html"]
title = "GnuTLS 3.6.2: Simple client example with anonymous authentication"
description = "GnuTLS 3.6.2: Simple client example with anonymous authentication"
full_description = "Next: Simple Datagram TLS client example, Previous: Simple client example with SSH-style certificate verification, Up: Client examples [Contents][Index] The simplest client using TLS is the one that doesn’t do any authentication. This means no external certificates or passwords are needed to set up the connection. As could be expected, the connection is vulnerable to man-in-the-middle (active or redirection) attacks. However, the data are integrity protected and encrypted from passive eavesdroppers. Next: Simple Datagram TLS client example, Previous: Simple client example with SSH-style certificate verification, Up: Client examples [Contents][Index]"
