["https://gnutls.org/manual/html_node/Channel-Bindings.html"]
title = "Channel Bindings (GnuTLS 3.8.4)"
description = "Channel Bindings (GnuTLS 3.8.4)"
full_description = "Next: Interoperability, Previous: Deriving keys for other applications/protocols, Up: Advanced topics [Contents][Index] In user authentication protocols (e.g., EAP or SASL mechanisms) it is useful to have a unique string that identifies the secure channel that is used, to bind together the user authentication with the secure channel. This can protect against man-in-the-middle attacks in some situations. That unique string is called a “channel binding”. For background and discussion see [RFC5056]. In GnuTLS you can extract a channel binding using the gnutls_session_channel_binding function. Currently only the following types are supported: The following example describes how to print the channel binding data. Note that it must be run after a successful TLS handshake."
