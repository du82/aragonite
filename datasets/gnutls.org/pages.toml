["https://gnutls.org/manual/html_node/Datagram-TLS-API.html"]
title = "Datagram TLS API (GnuTLS 3.8.4)"
description = "Datagram TLS API (GnuTLS 3.8.4)"
full_description = "This function can be used to prevent denial of service attacks to a DTLS server by requiring the client to reply using a cookie sent by this function. That way it can be ensured that a client we allocated resources for (i.e. gnutls_session_t ) is the one that the original incoming packet was originated from. This function must be called at the first incoming packet, prior to allocating any resources and must be succeeded by gnutls_dtls_cookie_verify() . This function will verify the received message for a valid cookie. If a valid cookie is returned then it should be associated with the session using gnutls_dtls_prestate_set() ; This function will return the actual maximum transfer unit for application data. I.e. DTLS headers are subtracted from the actual MTU which is set using gnutls_dtls_set_mtu() . This function will return the MTU size as set with gnutls_dtls_set_mtu() . This is not the actual MTU of data you can transmit. Use gnutls_dtls_get_data_mtu() for that reason. This function will return the milliseconds remaining for a retransmission of the previously sent handshake message. This function is useful when DTLS is used in non-blocking mode, to estimate when to call gnutls_handshake() if no packets have been received. This function will associate the prestate acquired by the cookie authentication with the client, with the newly established session. This functions must be called after a successful gnutls_dtls_cookie_verify() and should be succeeded by the actual DTLS handshake using gnutls_handshake() . This function will set the maximum size of the *unencrypted* records which will be sent over a DTLS session. It is equivalent to calculating the DTLS packet overhead with the current encryption parameters, and calling gnutls_dtls_set_mtu() with that value. In particular, this means that you may need to call this function again after any negotiation or renegotiation, in order to ensure that the MTU is still sufficient to account for the new protocol overhead. In most cases you only need to call gnutls_dtls_set_mtu() with the maximum MTU of your transport layer."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/Datagram-TLS-API.html"
