["https://www.gnutls.org/manual/html_node/Core-TLS-API.html"]
title = "Core TLS API (GnuTLS 3.8.4)"
description = "Core TLS API (GnuTLS 3.8.4)"
full_description = "This function will return the last alert number received. This function should be called when GNUTLS_E_WARNING_ALERT_RECEIVED or GNUTLS_E_FATAL_ALERT_RECEIVED errors are returned by a gnutls function. The peer may send alerts if he encounters an error. If no alert has been received the returned value is undefined. This function will return a string that describes the given alert number, or NULL . See gnutls_alert_get() . This function will send an alert to the peer in order to inform him of something important (eg. his Certificate could not be verified). If the alert level is Fatal then the peer is expected to close the connection, otherwise he may ignore the alert and continue. The error code of the underlying record send function will be returned, so you may also receive GNUTLS_E_INTERRUPTED or GNUTLS_E_AGAIN as well. Sends an alert to the peer depending on the error code returned by a gnutls function. This function will call gnutls_error_to_alert() to determine the appropriate alert to send. This function historically was always sending an alert to the peer, even if err was inappropriate to respond with an alert (e.g., GNUTLS_E_SUCCESS ). Since 3.6.6 this function returns success without transmitting any data on error codes that should not result to an alert. This function allows you to get the negotiated protocol name. The returned protocol should be treated as opaque, constant value and only valid during the session life. This function is to be used by both clients and servers, to declare the supported ALPN protocols, which are used during negotiation with peer. This function will set a callback in order for the server to get the Diffie-Hellman or RSA parameters for anonymous authentication. The callback should return GNUTLS_E_SUCCESS (0) on success. Deprecated: This function is unnecessary and discouraged on GnuTLS 3.6.0 or later. Since 3.6.0, DH parameters are negotiated following RFC7919. This function will set the Diffie-Hellman parameters for an anonymous server to use. These parameters will be used in Anonymous Diffie-Hellman cipher suites."
