["https://gnutls.org/support.html"]
title = "GnuTLS"
full_description = "Reporting bugs To report a bug: Use our issue tracker. For non-public issues use the issue tracker and mark the bug as private or send an email to bug report mail address. Provide the version of the library the bug is present on (the oldest supported release is 3.3.x), and try to detect the version the bug was introduced, e.g., using git-bisect. Provide a way to consistently reproduce the issue; e.g., a small program. Check the problem is not addressed by our answers to frequently asked questions. That would help us to address your issue. If you wish to contribute a fix, see our our development pages. Help / Mailing lists List Description Archives gnutls-help@lists.gnutls.org General mailing list to discuss and ask questions related to GnuTLS. Official archives gnutls-devel@lists.gnutls.org Read-only Mailing list which receives the traffic from gitlab.com/gnutls. Official archives Marc info archive (searchable) Help / Realtime There is also a matrix.org channel called #gnutls:matrix.org. You can access it via your web browser or other Matrix client. Please note that the people who can help you may be busy, and may be in a different time zone to you, and often indeed in a different time zone from one day to the next. If nobody is answering you immediately, please be patient — state your problem or question concisely and completely, and remain on the channel. You may well find that by the time you look back again, even if it's the next day, you have an answer or a fix has been made."
year_published = 2025
clearnet = "https://gnutls.org/support.html"
