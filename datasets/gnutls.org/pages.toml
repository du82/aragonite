["https://www.gnutls.org/manual/html_node/PKCS-12-API.html"]
title = "PKCS 12 API (GnuTLS 3.8.4)"
description = "PKCS 12 API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for PKCS 12 handling. Their prototypes lie in gnutls/pkcs12.h. This function will provide information on the encryption algorithms used in an encrypted bag. If the structure algorithms are unknown the code GNUTLS_E_UNKNOWN_CIPHER_TYPE will be returned, and only oid , will be set. That is, oid will be set on encrypted bags whether supported or not. It must be deinitialized using gnutls_free() . The other variables are only set on supported structures. Returns: GNUTLS_E_INVALID_REQUEST if the provided bag isn’t encrypted, GNUTLS_E_UNKNOWN_CIPHER_TYPE if the structure’s encryption isn’t supported, or another negative error code in case of a failure. Zero on success. This function will return the bag’s data. The data is a constant that is stored into the bag. Should not be accessed after the bag is deleted. This function will return the friendly name, of the specified bag element. The key ID is usually used to distinguish the local private key and the certificate pair. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. or a negative error code on error. This function will return the key ID, of the specified bag element. The key ID is usually used to distinguish the local private key and the certificate pair. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. or a negative error code on error. This function will initialize a PKCS12 bag structure. PKCS12 Bags usually contain private keys, lists of X.509 Certificates and X.509 Certificate revocation lists. This function will insert the given CRL into the bag. This is just a wrapper over gnutls_pkcs12_bag_set_data() . This function will insert the given certificate into the bag. This is just a wrapper over gnutls_pkcs12_bag_set_data() . This function will add the given key friendly name, to the specified, by the index, bag element. The name will be encoded as a ’Friendly name’ bag attribute, which is usually used to set a user name to the local private key and the certificate pair."
