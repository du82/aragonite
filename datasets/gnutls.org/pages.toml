["https://www.gnutls.org/manual/html_node/PKCS-7-API.html"]
title = "PKCS 7 API (GnuTLS 3.8.4)"
description = "PKCS 7 API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for PKCS 7 structures handling. Their prototypes lie in gnutls/pkcs7.h. This function will set a PKCS 7 attribute in the provided list. If this function fails, the previous list would be deallocated. Note that any attributes set with this function must either be DER or BER encoded, unless a special flag is present. This function will delete a crl from a PKCS7 or RFC2630 crl set. Index starts from 0. Returns 0 on success. This function will delete a certificate from a PKCS7 or RFC2630 certificate set. Index starts from 0. Returns 0 on success. output_data_size: holds the size of output_data (and will be replaced by the actual size of parameters) If the buffer provided is not long enough to hold the output, then * output_data_size is updated and GNUTLS_E_SHORT_MEMORY_BUFFER will be returned. This function will get a PKCS 7 attribute from the provided list. The OID is a constant string, but data will be allocated and must be deinitialized by the caller. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. GNUTLS_E_REQUESTED_DATA_NOT_AVAILABLE is returned if there are no data in the current index. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. If the provided buffer is not long enough, then crl_size is updated and GNUTLS_E_SHORT_MEMORY_BUFFER is returned. After the last crl has been read GNUTLS_E_REQUESTED_DATA_NOT_AVAILABLE will be returned. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. After the last crl has been read GNUTLS_E_REQUESTED_DATA_NOT_AVAILABLE will be returned. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. If the provided buffer is not long enough, then certificate_size is updated and GNUTLS_E_SHORT_MEMORY_BUFFER is returned. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error value. If the provided buffer is not long enough, then certificate_size is updated and GNUTLS_E_SHORT_MEMORY_BUFFER is returned."
