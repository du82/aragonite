full_description = "Next: Overriding algorithms, Previous: Hash and MAC functions, Up: Using GnuTLS as a cryptographic library [Contents][Index] Access to the random number generator is provided using the gnutls_rnd function. It allows obtaining random data of various levels. Non-predictable random number. Fatal in parts of session if broken, i.e., vulnerable to statistical analysis. This function will generate random data and store it to output buffer. The value of level should be one of GNUTLS_RND_NONCE , GNUTLS_RND_RANDOM and GNUTLS_RND_KEY . See the manual and gnutls_rnd_level_t for detailed information. See Random Number Generators-internals for more information on the random number generator operation."
