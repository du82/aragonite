title = "X.509 certificate names (GnuTLS 3.8.4)"
description = "X.509 certificate names (GnuTLS 3.8.4)"
full_description = "Next: X.509 distinguished names, Previous: Importing an X.509 certificate, Up: X.509 certificates [Contents][Index] X.509 certificates allow for multiple names and types of names to be specified. CA certificates often rely on X.509 distinguished names (see X.509 distinguished names) for unique identification, while end-user and server certificates rely on the ’subject alternative names’. The subject alternative names provide a typed name, e.g., a DNS name, or an email address, which identifies the owner of the certificate. The following functions provide access to that names. Note however, that server certificates often used the Common Name (CN), part of the certificate DistinguishedName to place a single DNS address. That practice is discouraged (see [RFC6125]), because only a single address can be specified, and the CN field is free-form making matching ambiguous."
