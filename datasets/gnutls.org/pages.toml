["https://gnutls.org/manual/html_node/Advanced-certificate-verification.html"]
title = "Advanced certificate verification (GnuTLS 3.8.4)"
description = "Advanced certificate verification (GnuTLS 3.8.4)"
full_description = "Next: Digital signatures, Previous: Raw public-keys, Up: Certificate authentication [Contents][Index] The verification of X.509 certificates in the HTTPS and other Internet protocols is typically done by loading a trusted list of commercial Certificate Authorities (see gnutls_certificate_set_x509_system_trust), and using them as trusted anchors. However, there are several examples (eg. the Diginotar incident) where one of these authorities was compromised. This risk can be mitigated by using in addition to CA certificate verification, other verification methods. In this section we list the available in GnuTLS methods."
