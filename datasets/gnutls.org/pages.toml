["https://gnutls.org/manual/html_node/OCSP-API.html"]
title = "OCSP API (GnuTLS 3.8.4)"
description = "OCSP API (GnuTLS 3.8.4)"
full_description = "The following functions are for OCSP certificate status checking. Their prototypes lie in gnutls/ocsp.h. This function will add another request to the OCSP request for a particular certificate. The issuer name hash, issuer key hash, and serial number fields is populated as follows. The issuer name and the serial number is taken from cert . The issuer key is taken from issuer . The hashed values will be hashed using the digest algorithm, normally GNUTLS_DIG_SHA1 . This function will add another request to the OCSP request for a particular certificate having the issuer name hash of issuer_name_hash and issuer key hash of issuer_key_hash (both hashed using digest ) and serial number serial_number . <informalexample><programlisting> CertID ::= SEQUENCE { hashAlgorithm AlgorithmIdentifier, issuerNameHash OCTET STRING, – Hash of Issuer’s DN issuerKeyHash OCTET STRING, – Hash of Issuers public key serialNumber CertificateSerialNumber } </programlisting></informalexample> This function will return the certificate information of the indx ’ed request in the OCSP request. The information returned corresponds to the CertID structure: <informalexample><programlisting> CertID ::= SEQUENCE { hashAlgorithm AlgorithmIdentifier, issuerNameHash OCTET STRING, – Hash of Issuer’s DN issuerKeyHash OCTET STRING, – Hash of Issuers public key serialNumber CertificateSerialNumber } </programlisting></informalexample> Each of the pointers to output variables may be NULL to indicate that the caller is not interested in that value. Returns: On success, GNUTLS_E_SUCCESS (0) is returned, otherwise a negative error code is returned. If you have reached the last CertID available GNUTLS_E_REQUESTED_DATA_NOT_AVAILABLE will be returned. This function will return all information about the requested extension in the OCSP request. The information returned is the OID, the critical flag, and the data itself. The extension OID will be stored as a string. Any of oid , critical , and data may be NULL which means that the caller is not interested in getting that information back."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/OCSP-API.html"
tags = ["ocsp", "returns:", "since:"]
