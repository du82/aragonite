["https://www.gnutls.org/manual/html_node/OCSP-status-request.html"]
title = "OCSP status request (GnuTLS 3.8.4)"
description = "OCSP status request (GnuTLS 3.8.4)"
full_description = "The Online Certificate Status Protocol (OCSP) is a protocol that allows the client to verify the server certificate for revocation without messing with certificate revocation lists. Its drawback is that it requires the client to connect to the server’s CA OCSP server and request the status of the certificate. This extension however, enables a TLS server to include its CA OCSP server response in the handshake. That is an HTTPS server may periodically run ocsptool (see ocsptool Invocation) to obtain its certificate revocation status and serve it to the clients. That way a client avoids an additional connection to the OCSP server."
