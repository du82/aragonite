["https://www.gnutls.org/manual/html_node/Virtual-hosts-and-credentials.html"]
title = "Virtual hosts and credentials (GnuTLS 3.8.4)"
description = "Virtual hosts and credentials (GnuTLS 3.8.4)"
full_description = "Often when operating with virtual hosts, one may not want to associate a particular certificate set to the credentials function early, before the virtual host is known. That can be achieved by calling gnutls_credentials_set within a handshake pre-hook for client hello. That message contains the peer’s intended hostname, and if read, and the appropriate credentials are set, gnutls will be able to continue in the handshake process. A brief usage example is shown below. This function will set a callback to be called after or before the specified handshake message has been received or generated. This is a generalization of gnutls_handshake_set_post_client_hello_function() . To call the hook function prior to the message being generated or processed use GNUTLS_HOOK_PRE as when parameter, GNUTLS_HOOK_POST to call after, and GNUTLS_HOOK_BOTH for both cases. Warning: You should not use this function to terminate the handshake based on client input unless you know what you are doing. Before the handshake is finished there is no way to know if there is a man-in-the-middle attack being performed."
year_published = 2025
