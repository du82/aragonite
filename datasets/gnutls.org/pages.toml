title = "danetool Invocation (GnuTLS 3.8.4)"
description = "danetool Invocation (GnuTLS 3.8.4)"
full_description = "The text printed is the same whether selected with the help option (--help) or the more-help option (--more-help). more-help will print the usage text by passing it through a pager program. more-help is disabled on platforms without a working fork(2) function. The PAGER environment variable is used to select the program, defaulting to more. Both will exit with a status code of 0. This is the “enable debugging” option. This option takes a ArgumentType.NUMBER argument. Specifies the debug level. This is the “loads a public key file” option. This option takes a ArgumentType.STRING argument. This can be either a file or a PKCS #11 URL This is the “loads a certificate file” option. This option takes a ArgumentType.STRING argument. This can be either a file or a PKCS #11 URL This is the “sets a dlv file” option. This option takes a ArgumentType.STRING argument. This sets a DLV file to be used for DNSSEC verification. This is the “hash algorithm to use for signing” option. This option takes a ArgumentType.STRING argument. Available hash functions are SHA1, RMD160, SHA256, SHA384, SHA512. This is the “check a host’s dane tlsa entry” option. This option takes a ArgumentType.STRING argument. Obtains the DANE TLSA entry from the given hostname and prints information. Note that the actual certificate of the host can be provided using –load-certificate, otherwise danetool will connect to the server to obtain it. The exit code on verification success will be zero. This is the “check only the end-entity’s certificate” option. Checks the end-entity’s certificate only. Trust anchors or CAs are not considered. This is the “check only the ca’s certificate” option. Checks the trust anchor’s and CA’s certificate only. End-entities are not considered. This is the “specify the hostname to be used in the dane rr” option. This option takes a ArgumentType.STRING argument Hostname. This command sets the hostname for the DANE RR. This is the “the protocol set for dane data (tcp, udp etc.)” option. This option takes a ArgumentType.STRING argument Protocol. This command specifies the protocol for the service set in the DANE data."
