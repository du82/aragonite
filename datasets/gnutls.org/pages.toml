["https://www.gnutls.org/manual/html_node/The-TLS-record-protocol.html"]
title = "The TLS record protocol (GnuTLS 3.8.4)"
description = "The TLS record protocol (GnuTLS 3.8.4)"
full_description = "Next: The TLS Alert Protocol, Previous: The transport layer, Up: Introduction to TLS [Contents][Index] The record protocol is the secure communications provider. Its purpose is to encrypt, and authenticate packets. The record layer functions can be called at any time after the handshake process is finished, when there is need to receive or send data. In DTLS however, due to re-transmission timers used in the handshake out-of-order handshake data might be received for some time (maximum 60 seconds) after the handshake process is finished. The functions to access the record protocol are limited to send and receive functions, which might, given the importance of this protocol in TLS, seem awkward. This is because the record protocol’s parameters are all set by the handshake protocol. The record protocol initially starts with NULL parameters, which means no encryption, and no MAC is used. Encryption and authentication begin just after the handshake protocol has finished."
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/The-TLS-record-protocol.html"
