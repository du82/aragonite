["https://gnutls.org/reference/gnutls-crypto.html"]
title = "crypto: GnuTLS API Reference Manual"
full_description = "This function will initialize the handle context to be usable for encryption/decryption of data. This will effectively use the current crypto backend in use by gnutls or the cryptographic accelerator in use. Note that in AEAD ciphers, this will not check the tag. You will need to compare the tag sent with the value returned from gnutls_cipher_tag(). This function will decrypt the given data using the algorithm specified by the context. For block ciphers the ctext_len must be a multiple of the block size. For the supported ciphers the plaintext data length will equal the ciphertext size. Note that in AEAD ciphers, this will not check the tag. You will need to compare the tag sent with the value returned from gnutls_cipher_tag(). This function will encrypt the given data using the algorithm specified by the context. For block ciphers the ptext_len must be a multiple of the block size. For the supported ciphers the encrypted data length will equal the plaintext size. This function will encrypt the given data using the algorithm specified by the context. For block ciphers, ptext_len is typically a multiple of the block size. If not, the caller can instruct the function to pad the last block according to flags . Currently, the only available padding scheme is GNUTLS_CIPHER_PADDING_PKCS7. If ctext is not NULL, it must hold enough space to store resulting cipher text. To check the required size, this function can be called with ctext set to NULL. Then ctext_len will be updated without performing actual encryption. This function will decrypt the given data using the algorithm specified by the context. If flags is specified, padding for the decrypted data will be removed accordingly and ptext_len will be updated. This function operates on authenticated encryption with associated data (AEAD) ciphers and will return the output tag. This function operates on authenticated encryption with associated data (AEAD) ciphers and authenticate the input data. This function can only be called once and before any encryption operations."
