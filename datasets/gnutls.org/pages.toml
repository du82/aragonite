title = "Abstract key API (GnuTLS 3.8.4)"
description = "Abstract key API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for abstract key handling. Their prototypes lie in gnutls/abstract.h. This function sets a public/private key pair in the gnutls_certificate_credentials_t type. The given public key may be encapsulated in a certificate or can be given as a raw key. This function may be called more than once, in case multiple key pairs exist for the server. For clients that want to send more than their own end- entity certificate (e.g., also an intermediate CA cert), the full certificate chain must be provided in pcert_list . Note that the key will become part of the credentials structure and must not be deallocated. It will be automatically deallocated when the res structure is deinitialized. If this function fails, the res structure is at an undefined state and it must not be reused to load other keys or certificates. Note that, this function by default returns zero on success and a negative value on error. Since 3.5.6, when the flag GNUTLS_CERTIFICATE_API_V2 is set using gnutls_certificate_set_flags() it returns an index (greater or equal to zero). That index can be used for other functions to refer to the added key-pair. Returns: On success this functions returns zero, and otherwise a negative value on error (see above for modifying that behavior). This function sets a callback to be called in order to retrieve the certificate to be used in the handshake. The callback will take control only if a certificate is requested by the peer. The callback’s function prototype is: int (*callback)(gnutls_session_t, const gnutls_datum_t* req_ca_dn, int nreqs, const gnutls_pk_algorithm_t* pk_algos, int pk_algos_length, gnutls_pcert_st** pcert, unsigned int *pcert_length, gnutls_privkey_t * pkey); req_ca_dn is only used in X.509 certificates. Contains a list with the CA names that the server considers trusted. This is a hint and typically the client should send a certificate that is signed by one of these CAs. These names, when available, are DER encoded. To get a more meaningful value use the function gnutls_x509_rdn_get() ."
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Abstract-key-API.html"
