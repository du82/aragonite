["https://www.gnutls.org/manual/html_node/Introduction-to-TLS.html"]
title = "Introduction to TLS (GnuTLS 3.8.4)"
description = "Introduction to TLS (GnuTLS 3.8.4)"
full_description = "TLS stands for “Transport Layer Security” and is the successor of SSL, the Secure Sockets Layer protocol [SSL3] designed by Netscape. TLS is an Internet protocol, defined by IETF3, described in [RFC5246]. The protocol provides confidentiality, and authentication layers over any reliable transport layer. The description, above, refers to TLS 1.0 but applies to all other TLS versions as the differences between the protocols are not major. The DTLS protocol, or “Datagram TLS” [RFC4347] is a protocol with identical goals as TLS, but can operate under unreliable transport layers such as UDP. The discussions below apply to this protocol as well, except when noted otherwise. IETF, or Internet Engineering Task Force, is a large open international community of network designers, operators, vendors, and researchers concerned with the evolution of the Internet architecture and the smooth operation of the Internet. It is open to any interested individual."
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Introduction-to-TLS.html"
