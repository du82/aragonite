["https://gnutls.org/manual/html_node/X509-certificate-API.html"]
title = "X509 certificate API (GnuTLS 3.8.4)"
description = "X509 certificate API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for X.509 certificate handling. Their prototypes lie in gnutls/x509.h. Obtains the list of trusted certificates stored in res and writes a pointer to it to the location tlist . The pointer will point to memory internal to res , and must not be deinitialized. It will be automatically deallocated when the res structure is deinitialized. Note that the tlist will become part of the credentials structure and must not be deallocated. It will be automatically deallocated when the res structure is deinitialized. Convert a string to a gnutls_certificate_verification_profiles_t value. The names are compared in a case insensitive way. Returns: a gnutls_certificate_verification_profiles_t id of the specified profile, or GNUTLS_PROFILE_UNKNOWN on failure. This function will provide information on the algorithms used in a particular PKCS 8 structure. If the structure algorithms are unknown the code GNUTLS_E_UNKNOWN_CIPHER_TYPE will be returned, and only oid , will be set. That is, oid will be set on encrypted PKCS 8 structures whether supported or not. It must be deinitialized using gnutls_free() . The other variables are only set on supported structures. Returns: GNUTLS_E_INVALID_REQUEST if the provided structure isn’t an encrypted key, GNUTLS_E_UNKNOWN_CIPHER_TYPE if the structure’s encryption isn’t supported, or another negative error code in case of a failure. Zero on success. This function sets a callback to be called when the peer’s certificate chain has to be verified and full path to the trusted root has to be printed. The callback’s function prototype is defined in ‘x509.h’: int (*callback)( gnutls_x509_crt_t cert, gnutls_x509_crt_t issuer, gnutls_x509_crl_t crl, unsigned int verification_output); If the callback function is provided then gnutls will call it, in the certificate verification procedure. To verify the certificate chain and print its path uptp the trusted root, functions such as gnutls_certificate_verify_peers() , gnutls_x509_trust_list_verify_crt() , and gnutls_x509_trust_list_verify_crt2() can be used. The callback is set in _gnutls_verify_crt_status() and _gnutls_pkcs11_verify_crt_status() ."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/X509-certificate-API.html"
