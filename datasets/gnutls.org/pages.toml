["https://gnutls.org/manual/html_node/Reading-objects.html"]
title = "Reading objects (GnuTLS 3.8.4)"
description = "Reading objects (GnuTLS 3.8.4)"
full_description = "Next: Writing objects, Previous: Accessing objects that require a PIN, Up: Smart cards and HSMs [Contents][Index] All PKCS #11 objects are referenced by GnuTLS functions by URLs as described in [PKCS11URI]. This allows for a consistent naming of objects across systems and applications in the same system. For example a public key on a smart card may be referenced as: Objects stored in a PKCS #11 token can typically be extracted if they are not marked as sensitive. Usually only private keys are marked as sensitive and cannot be extracted, while certificates and other data can be retrieved. The functions that can be used to enumerate and access objects are shown below. output_size: contains the maximum size of the output buffer and will be overwritten with the actual size. This function will return information about the PKCS11 certificate such as the label, id as well as token information where the key is stored. When output is text, a null terminated string is written to output and its string length is written to output_size (without null terminator). If the buffer is too small, output_size will contain the expected buffer size (with null terminator for text) and return GNUTLS_E_SHORT_MEMORY_BUFFER . In versions previously to 3.6.0 this function included the null terminator to output_size . After 3.6.0 the output size doesn’t include the terminator character. Properties of the physical token can also be accessed and altered with GnuTLS. For example data in a token can be erased (initialized), PIN can be altered, etc. The following examples demonstrate the usage of the API. The first example will list all available PKCS #11 tokens in a system and the latter will list all certificates in a token that have a corresponding private key. Next: Writing objects, Previous: Accessing objects that require a PIN, Up: Smart cards and HSMs [Contents][Index]"
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/Reading-objects.html"
