e 3.6.x branch. This backports the fixes for CVE-2021-20305 on the bundled Nettle code and GnuTLS-SA-2021-03-10. 2021-03-10 Released GnuTLS 3.7.1 a bug-fix and security release on the 3.7.x branch. Added the GnuTLS-SA-2021-03-10 security advisory. See also the the live NEWS file or the live git shortlog.'
