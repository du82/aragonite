["https://gnutls.org/manual/html_node/OpenPGP-certificates.html"]
title = "OpenPGP certificates (GnuTLS 3.8.4)"
description = "OpenPGP certificates (GnuTLS 3.8.4)"
full_description = "Next: Raw public-keys, Previous: X.509 certificates, Up: Certificate authentication [Contents][Index] Previous versions of GnuTLS supported limited OpenPGP key authentication. That functionality has been deprecated and is no longer made available. The reason is that, supporting alternative authentication methods, when X.509 and PKIX were new on the Internet and not well established, seemed like a good idea, in today’s Internet X.509 is unquestionably the main container for certificates. As such supporting more options with no clear use-cases, is a distraction that consumes considerable resources for improving and testing the library. For that we have decided to drop this functionality completely in 3.6.0."
