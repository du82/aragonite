["https://gnutls.org/manual/html_node/X_002e509-extensions.html"]
title = "X.509 extensions (GnuTLS 3.8.4)"
description = "X.509 extensions (GnuTLS 3.8.4)"
full_description = "Next: X.509 public and private keys, Previous: X.509 distinguished names, Up: X.509 certificates [Contents][Index] X.509 version 3 certificates include a list of extensions that can be used to obtain additional information on the subject or the issuer of the certificate. Those may be e-mail addresses, flags that indicate whether the belongs to a CA etc. All the supported X.509 version 3 extensions are shown in Table 4.3. The certificate extensions access is split into two parts. The first requires to retrieve the extension, and the second is the parsing part. To enumerate and retrieve the DER-encoded extension data available in a certificate the following two functions are available. After a supported DER-encoded extension is retrieved it can be parsed using the APIs in x509-ext.h. Complex extensions may require initializing an intermediate structure that holds the parsed extension data. Examples of simple parsing functions are shown below. More complex extensions, such as Name Constraints, require an intermediate structure, in that case gnutls_x509_name_constraints_t to be initialized in order to store the parsed extension data. After the name constraints are extracted in the structure, the following functions can be used to access them. Note, that there are also direct APIs to access extensions that may be simpler to use for non-complex extensions. They are available in x509.h and some examples are listed below. Next: X.509 public and private keys, Previous: X.509 distinguished names, Up: X.509 certificates [Contents][Index]"
