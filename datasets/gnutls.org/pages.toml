["https://gnutls.org/manual/html_node/PKCS11-Low-Level-Access.html"]
title = "PKCS11 Low Level Access (GnuTLS 3.8.4)"
description = "PKCS11 Low Level Access (GnuTLS 3.8.4)"
full_description = "Next: Using a PKCS11 token with TLS, Previous: Writing objects, Up: Smart cards and HSMs [Contents][Index] When it is needed to use PKCS#11 functionality which is not wrapped by GnuTLS, it is possible to extract the PKCS#11 session, object or token pointers. That allows an application to still access the low-level functionality, while at the same time take advantage of the URI addressing scheme supported by GnuTLS. This function will return the function pointer of the specified token by the URL. The returned pointers are valid until gnutls is deinitialized, c.f. _global_deinit() . Obtains the PKCS11 session handles of an object. session and ohandle must be deinitialized by the caller. The returned pointers are independent of the obj lifetime. Next: Using a PKCS11 token with TLS, Previous: Writing objects, Up: Smart cards and HSMs [Contents][Index]"
