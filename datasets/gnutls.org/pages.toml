["https://gnutls.org/manual/html_node/SRP-credentials.html"]
title = "SRP credentials (GnuTLS 3.8.4)"
description = "SRP credentials (GnuTLS 3.8.4)"
full_description = "Next: PSK credentials, Previous: Raw public-key credentials, Up: Associating the credentials [Contents][Index] The initialization functions in SRP credentials differ between client and server. Clients supporting SRP should set the username and password prior to connection, to the credentials structure. Alternatively gnutls_srp_set_client_credentials_function may be used instead, to specify a callback function that should return the SRP username and password. The callback is called once during the TLS handshake. This function can be used to set a callback to retrieve the username and password for client SRP authentication. The callback’s function form is: The username should be an ASCII string or UTF-8 string. In case of a UTF-8 string it is recommended to be following the PRECIS framework for usernames (rfc8265). The password can be in ASCII format, or normalized using gnutls_utf8_password_normalize() . The callback should not return a negative error code the second time called, since the handshake procedure will be aborted. In server side the default behavior of GnuTLS is to read the usernames and SRP verifiers from password files. These password file format is compatible the with the Stanford srp libraries format. If a different password file format is to be used, then gnutls_srp_set_server_credentials_function should be called, to set an appropriate callback. This function sets the password files, in a gnutls_srp_server_credentials_t type. Those password files hold usernames and verifiers and will be used for SRP authentication. This function can be used to set a callback to retrieve the user’s SRP credentials. The callback’s function form is: int (*callback)(gnutls_session_t, const char* username, gnutls_datum_t *salt, gnutls_datum_t *verifier, gnutls_datum_t *generator, gnutls_datum_t *prime); username contains the actual username. The salt , verifier , generator and prime must be filled in using the gnutls_malloc() . For convenience prime and generator may also be one of the static parameters defined in gnutls.h."
