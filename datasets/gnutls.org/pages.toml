["https://gnutls.org/manual/html_node/Disabling-algorithms-and-protocols.html"]
title = "Disabling algorithms and protocols (GnuTLS 3.8.4)"
description = "Disabling algorithms and protocols (GnuTLS 3.8.4)"
full_description = "Next: Querying for disabled algorithms and protocols, Previous: Application-specific priority strings, Up: System-wide configuration of the library [Contents][Index] The approach above works well to create consistent system-wide settings for cooperative GnuTLS applications. When an application however does not use the gnutls_set_default_priority or gnutls_set_default_priority_append functions, the method is not sufficient to prevent applications from using protocols or algorithms forbidden by a local policy. The override method described below enables the deprecation of algorithms and protocols system-wide for all applications. Each of the options can be repeated multiple times when multiple values need to be disabled or enabled. The valid values for the options above can be found in the ’Protocols’, ’Digests’ ’PK-signatures’, ’Protocols’, ’Ciphers’, and ’MACs’ fields of the output of gnutls-cli --list. Sometimes the system administrator wants to enable only specific algorithms, despite the library defaults. GnuTLS provides an alternative mode of overriding: allowlisting. As shown below in the examples, it is hard to use this mode correctly, as it requires understanding of how algorithms are used underneath by the protocols. Allowlisting configuration mode is intended to be used by the operating system vendors that prefer laying out the library defaults exhaustively from scratch instead on depending on gnutls presets, such as NORMAL. Applications are then expected to optionally disable or enable only a subset algorithms on top of the vendor-provided configuration. In the allowlisting mode, all the algorithms are initially marked as insecure or disabled, and shall be explicitly turned on by the options listed below in the [overrides] section. As the allowlisting mode is mutually exclusive to the blocklisting mode, the options listed above for the blocklisting mode are forbidden in the allowlisting mode, and vice versa. When the allowlisting mode is in effect, a @SYSTEM priority string is automatically constructed from the options in the [overrides] section. For this reason, the above functions should be called before the @SYSTEM priority is used."
