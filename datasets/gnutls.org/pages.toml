["https://www.gnutls.org/manual/html_node/Thread-safety.html"]
title = "Thread safety (GnuTLS 3.8.4)"
description = "Thread safety (GnuTLS 3.8.4)"
full_description = "Next: Running in a sandbox, Previous: Debugging and auditing, Up: Introduction to the library [Contents][Index] The GnuTLS library is thread safe by design, meaning that objects of the library such as TLS sessions, can be safely divided across threads as long as a single thread accesses a single object. This is sufficient to support a server which handles several sessions per thread. Read-only access to objects, for example the credentials holding structures, is also thread-safe. A gnutls_session_t object could also be shared by two threads, one sending, the other receiving. However, care must be taken on the following use cases: For several aspects of the library (e.g., the random generator, PKCS#11 operations), the library may utilize mutex locks (e.g., pthreads on GNU/Linux and CriticalSection on Windows) which are transparently setup on library initialization. Prior to version 3.3.0 these were setup by explicitly calling gnutls_global_init.17 Note that, on Glibc systems, unless the application is explicitly linked with the libpthread library, no mutex locks are used and setup by GnuTLS. It will use the Glibc mutex stubs. On special systems you could manually specify the locking system using the function gnutls_global_set_mutex before calling any other GnuTLS function. Setting mutexes manually is not recommended. Next: Running in a sandbox, Previous: Debugging and auditing, Up: Introduction to the library [Contents][Index]"
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Thread-safety.html"
