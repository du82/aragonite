["https://gnutls.org/manual/html_node/Encryption-algorithms-used-in-the-record-layer.html"]
title = "Encryption algorithms used in the record layer (GnuTLS 3.8.4)"
description = "Encryption algorithms used in the record layer (GnuTLS 3.8.4)"
full_description = "Confidentiality in the record layer is achieved by using symmetric ciphers like AES or CHACHA20. Ciphers are encryption algorithms that use a single, secret, key to encrypt and decrypt data. Early versions of TLS separated between block and stream ciphers and had message authentication plugged in to them by the protocol, though later versions switched to using authenticated-encryption (AEAD) ciphers. The AEAD ciphers are defined to combine encryption and authentication, and as such they are not only more efficient, as the primitives used are designed to interoperate nicely, but they are also known to interoperate in a secure way."
