title = "Sessions and fork (GnuTLS 3.8.4)"
description = "Sessions and fork (GnuTLS 3.8.4)"
full_description = "Next: Callback functions, Previous: Running in a sandbox, Up: Introduction to the library [Contents][Index] A gnutls_session_t object can be shared by two processes after a fork, one sending, the other receiving. In that case rehandshakes, cannot and must not be performed. As with threads, the termination of a session should be handled by the sender process using gnutls_bye with GNUTLS_SHUT_WR and the receiving process waiting for a return value of zero."
