["https://gnutls.org/manual/html_node/TLS-Cipher-Suites.html"]
title = "TLS Cipher Suites (GnuTLS 3.8.4)"
description = "TLS Cipher Suites (GnuTLS 3.8.4)"
full_description = "The TLS cipher suites have slightly different meaning under different protocols. Under TLS 1.3, a cipher suite indicates the symmetric encryption algorithm in use, as well as the pseudo-random function (PRF) used in the TLS session. Under TLS 1.2 or early the handshake protocol negotiates cipher suites of a special form illustrated by the TLS_DHE_RSA_WITH_3DES_CBC_SHA cipher suite name. A typical cipher suite contains these parameters: The cipher suite negotiated in the handshake protocol will affect the record protocol, by enabling encryption and data authentication. Note that you should not over rely on TLS to negotiate the strongest available cipher suite. Do not enable ciphers and algorithms that you consider weak. MAC stands for Message Authentication Code. It can be described as a keyed hash algorithm. See RFC2104."
