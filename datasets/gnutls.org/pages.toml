["https://www.gnutls.org/manual/html_node/Random-Number-Generators_002dinternals.html"]
title = "Random Number Generators-internals (GnuTLS 3.8.4)"
description = "Random Number Generators-internals (GnuTLS 3.8.4)"
full_description = "Next: FIPS140-2 mode, Previous: Cryptographic Backend, Up: Internal architecture of GnuTLS [Contents][Index] GnuTLS provides two random generators. The default, and the AES-DRBG random generator which is only used when the library is compiled with support for FIPS140-2 and the system is in FIPS140-2 mode. The random number generator levels in gnutls_rnd_level_t map to two CHACHA-based random generators which are initially seeded using the OS random device, e.g., /dev/urandom or getrandom(). These random generators are unique per thread, and are automatically re-seeded when a fork is detected. The reason the CHACHA cipher was selected for the GnuTLS’ PRNG is the fact that CHACHA is considered a secure and fast stream cipher, and is already defined for use in TLS protocol. As such, the utilization of it would not stress the CPU caches, and would allow for better performance on busy servers, irrespective of their architecture (e.g., even if AES is not available with an optimized instruction set). The generators are unique per thread to allow lock-free operation. That induces a cost of around 140-bytes for the state of the generators per thread, on threads that would utilize gnutls_rnd. At the same time it allows fast and lock-free access to the generators. The lock-free access benefits servers which utilize more than 4 threads, while imposes no cost on single threaded processes. On the first call to gnutls_rnd the generators are seeded with two independent keys obtained from the OS random device. Their seed is used to output a fixed amount of bytes before re-seeding; the number of bytes output varies per generator. One generator is dedicated for the GNUTLS_RND_NONCE level, and the second is shared for the GNUTLS_RND_KEY and GNUTLS_RND_RANDOM levels. For the rest of this section we refer to the first as the nonce generator and the second as the key generator. The nonce generator will reseed after outputting a fixed amount of bytes (typically few megabytes), or after few hours of operation without reaching the limit has passed. It is being re-seed using the key generator to obtain a new key for the CHACHA cipher, which is mixed with its old one."
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Random-Number-Generators_002dinternals.html"
