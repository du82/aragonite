title = "TPM API (GnuTLS 3.8.4)"
description = "TPM API (GnuTLS 3.8.4)"
full_description = "This function will return for each given index a URL of the corresponding key. If the provided index is out of bounds then GNUTLS_E_REQUESTED_DATA_NOT_AVAILABLE is returned. This function will generate a private key in the TPM chip. The private key will be generated within the chip and will be exported in a wrapped with TPM’s master key form. Furthermore the wrapped key can be protected with the provided password . Note that bits in TPM is quantized value. If the input value is not one of the allowed values, then it will be quantized to one of 512, 1024, 2048, 4096, 8192 and 16384."
