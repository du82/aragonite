["https://gnutls.org/manual/html_node/tpmtool-Invocation.html"]
title = "tpmtool Invocation (GnuTLS 3.8.4)"
description = "tpmtool Invocation (GnuTLS 3.8.4)"
full_description = "The text printed is the same whether selected with the help option (--help) or the more-help option (--more-help). more-help will print the usage text by passing it through a pager program. more-help is disabled on platforms without a working fork(2) function. The PAGER environment variable is used to select the program, defaulting to more. Both will exit with a status code of 0. This is the “enable debugging” option. This option takes a ArgumentType.NUMBER argument. Specifies the debug level. This is the “generate an rsa private-public key pair” option. Generates an RSA private-public key pair in the TPM chip. The key may be stored in file system and protected by a PIN, or stored (registered) in the TPM chip flash. This is the “tests the signature operation of the provided object” option. This option takes a ArgumentType.STRING argument url. It can be used to test the correct operation of the signature operation. This operation will sign and verify the signed data. This is the “specify the security level [low, legacy, medium, high, ultra]” option. This option takes a ArgumentType.STRING argument Security parameter. This is alternative to the bits option. Note however that the values allowed by the TPM chip are quantized and given values may be rounded up. This is the “use the der format for keys” option. The input files will be assumed to be in the portable DER format of TPM. The default format is a custom format used by various TPM tools This is the “use der format for output keys” option. The output will be in the TPM portable DER format. This is the “output version information and exit” option. This option takes a ArgumentType.KEYWORD argument. Output version of program and exit. The default mode is ‘v’, a simple version. The ‘c’ mode will print copyright information and ‘n’ will print the full copyright notice. This is the “display extended usage information and exit” option. Display usage information and exit. This is the “extended usage information passed thru pager” option. Pass the extended usage information through a pager."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/tpmtool-Invocation.html"
tags = []
