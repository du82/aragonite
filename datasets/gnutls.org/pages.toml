["https://www.gnutls.org/manual/html_node/Anti_002dreplay-protection.html"]
title = "Anti-replay protection (GnuTLS 3.8.4)"
description = "Anti-replay protection (GnuTLS 3.8.4)"
full_description = "Next: DTLS sessions, Previous: Zero-roundtrip mode, Up: Setting up the transport layer [Contents][Index] When 0-RTT mode is used, the server must protect itself from replay attacks, where adversary client reuses duplicate session ticket to send early data, before the server authenticates the client. GnuTLS provides a simple mechanism against replay attacks, following the method called ClientHello recording. When a session ticket is accepted, the server checks if the ClientHello message has been already seen. If there is a duplicate, the server rejects early data. The problem of this approach is that the number of recorded messages grows indefinitely. To prevent that, the server can limit the recording to a certain time window, which can be configured with gnutls_anti_replay_set_window. The anti-replay mechanism shall be globally initialized with gnutls_anti_replay_init, and then attached to a session using gnutls_anti_replay_enable. It can be deinitialized with gnutls_anti_replay_deinit. The server must also set up a database back-end to store ClientHello messages. That can be achieved using gnutls_anti_replay_set_add_function and gnutls_anti_replay_set_ptr. Note that, if the back-end stores arbitrary number of ClientHello, it needs to periodically clean up the stored entries based on the time window set with gnutls_anti_replay_set_window. The cleanup can be implemented by iterating through the database entries and calling gnutls_db_check_entry_expire_time. This is similar to session database cleanup used by TLS1.2 sessions. Next: DTLS sessions, Previous: Zero-roundtrip mode, Up: Setting up the transport layer [Contents][Index]"
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Anti_002dreplay-protection.html"
