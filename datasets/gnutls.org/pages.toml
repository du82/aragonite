["https://www.gnutls.org/manual/html_node/Setting-up-the-transport-layer.html"]
title = "Setting up the transport layer (GnuTLS 3.8.4)"
description = "Setting up the transport layer (GnuTLS 3.8.4)"
full_description = "Next: TLS handshake, Previous: Associating the credentials, Up: How to use GnuTLS in applications [Contents][Index] The next step is to setup the underlying transport layer details. The Berkeley sockets are implicitly used by GnuTLS, thus a call to gnutls_transport_set_int would be sufficient to specify the socket descriptor. If however another transport layer than TCP is selected, then a pointer should be used instead to express the parameter to be passed to custom functions. In that case the following functions should be used instead. This is the function where you set a push function for gnutls to use in order to send data. If you are going to use berkeley style sockets, you do not need to use this function since the default send(2) will probably be ok. Otherwise you should specify this function for gnutls to be able to send data. The callback should return a positive number indicating the bytes sent, and -1 on error. Using this function you can override the default writev(2) function for gnutls to send data. Setting this callback instead of gnutls_transport_set_push_function() is recommended since it introduces less overhead in the TLS handshake process. vec_func is of the form, ssize_t (*gnutls_vec_push_func) (gnutls_transport_ptr_t, const giovec_t * iov, int iovcnt); This is the function where you set a function for gnutls to receive data. Normally, if you use berkeley style sockets, do not need to use this function since the default recv(2) will probably be ok. The callback should return 0 on connection termination, a positive number indicating the number of bytes received, and -1 on error. This is the function where you set a function for gnutls to know whether data are ready to be received. It should wait for data a given time frame in milliseconds. The callback should return 0 on timeout, a positive number if data can be received, and -1 on error. You’ll need to override this function if select() is not suitable for the provided transport calls. As with select() , if the timeout value is zero the callback should return zero if no data are immediately available. The special value GNUTLS_INDEFINITE_TIMEOUT indicates that the callback should wait indefinitely for data."
year_published = 2025
