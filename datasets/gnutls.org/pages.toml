["https://gnutls.org/manual/html_node/Cryptographic-Message-Syntax-_002f-PKCS7.html"]
title = "Cryptographic Message Syntax / PKCS7 (GnuTLS 3.8.4)"
description = "Cryptographic Message Syntax / PKCS7 (GnuTLS 3.8.4)"
full_description = "Next: Hash and MAC functions, Previous: Public key algorithms, Up: Using GnuTLS as a cryptographic library [Contents][Index] The CMS or PKCS #7 format is a commonly used format for digital signatures. PKCS #7 is the name of the original standard when published by RSA, though today the standard is adopted by IETF under the name CMS. The standards include multiple ways of signing a digital document, e.g., by embedding the data into the signature, or creating detached signatures of the data, including a timestamp, additional certificates etc. In certain cases the same format is also used to transport lists of certificates and CRLs. It is a relatively popular standard to sign structures, and is being used to sign in PDF files, as well as for signing kernel modules and other structures. In GnuTLS, the basic functions to initialize, deinitialize, import, export or print information about a PKCS #7 structure are listed below. The following functions allow the verification of a structure using either a trust list, or individual certificates. The gnutls_pkcs7_sign function is the data signing function. This function will add a signature in the provided PKCS 7 structure for the provided data. Multiple signatures can be made with different signers. The available flags are: GNUTLS_PKCS7_EMBED_DATA , GNUTLS_PKCS7_INCLUDE_TIME , GNUTLS_PKCS7_INCLUDE_CERT , and GNUTLS_PKCS7_WRITE_SPKI . They are explained in the gnutls_pkcs7_sign_flags definition. Other helper functions which allow to access the signatures, or certificates attached in the structure are listed below. Next: Hash and MAC functions, Previous: Public key algorithms, Up: Using GnuTLS as a cryptographic library [Contents][Index]"
