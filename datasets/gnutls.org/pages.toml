title = "psktool Invocation (GnuTLS 3.8.4)"
description = "psktool Invocation (GnuTLS 3.8.4)"
full_description = "Program that generates random keys for use with TLS-PSK. The keys are stored in hexadecimal format in a key file. The text printed is the same whether selected with the help option (--help) or the more-help option (--more-help). more-help will print the usage text by passing it through a pager program. more-help is disabled on platforms without a working fork(2) function. The PAGER environment variable is used to select the program, defaulting to more. Both will exit with a status code of 0. This is the “enable debugging” option. This option takes a ArgumentType.NUMBER argument. Specifies the debug level. This is the “specify a pre-shared key file” option. This option takes a ArgumentType.STRING argument. This option will specify the pre-shared key file to store the generated keys. This is the “output version information and exit” option. This option takes a ArgumentType.KEYWORD argument. Output version of program and exit. The default mode is ‘v’, a simple version. The ‘c’ mode will print copyright information and ‘n’ will print the full copyright notice. This is the “display extended usage information and exit” option. Display usage information and exit. This is the “extended usage information passed thru pager” option. Pass the extended usage information through a pager."
