["https://gnutls.org/manual/html_node/Accessing-objects-that-require-a-PIN.html"]
title = "Accessing objects that require a PIN (GnuTLS 3.8.4)"
description = "Accessing objects that require a PIN (GnuTLS 3.8.4)"
full_description = "Next: Reading objects, Previous: PKCS11 Manual Initialization, Up: Smart cards and HSMs [Contents][Index] Objects stored in token such as a private keys are typically protected from access by a PIN or password. This PIN may be required to either read the object (if allowed) or to perform operations with it. To allow obtaining the PIN when accessing a protected object, as well as probe the user to insert the token the following functions allow to set a callback. The callback is of type gnutls_pin_callback_t and will have as input the provided userdata, the PIN attempt number, a URL describing the token, a label describing the object and flags. The PIN must be at most of pin_max size and must be copied to pin variable. The function must return 0 on success or a negative error code otherwise. Note that due to limitations of PKCS #11 there are issues when multiple libraries are sharing a module. To avoid this problem GnuTLS uses p11-kit that provides a middleware to control access to resources over the multiple users. To avoid conflicts with multiple registered callbacks for PIN functions, gnutls_pkcs11_get_pin_function may be used to check for any previously set functions. In addition context specific PIN functions are allowed, e.g., by using functions below. Next: Reading objects, Previous: PKCS11 Manual Initialization, Up: Smart cards and HSMs [Contents][Index]"
