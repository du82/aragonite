["https://gnutls.org/manual/html_node/DANE-API.html"]
title = "DANE API (GnuTLS 3.8.4)"
description = "DANE API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for DANE certificate verification. Their prototypes lie in gnutls/dane.h. Note that you need to link with the libgnutls-dane library to use them. This function will return the status of the query response. See dane_query_status_t for the possible types. dane_data: Pointer to contain an array of DNS rdata items, terminated with a NULL pointer; caller must guarantee that the referenced data remains valid until dane_query_deinit() is called. secure: Pointer set true if the result is validated securely, false if validation failed or the domain queried has no security info The pointers dane_data and dane_data_len are allocated with gnutls_malloc() to contain the data from the query result structure (individual dane_data items simply point to the original data and are not allocated separately). The returned dane_data are only valid during the lifetime of q . dane_data: array of DNS rdata items, terminated with a NULL pointer; caller must guarantee that the referenced data remains valid until dane_query_deinit() is called. secure: true if the result is validated securely, false if validation failed or the domain queried has no security info bogus: if the result was not secure (secure = 0) due to a security failure, and the result is due to a security failure, bogus is true. This function will fill in the TLSA (DANE) structure from the given raw DNS record data. The dane_data must be valid during the lifetime of the query. This function will initialize the backend resolver. It is intended to be used in scenarios where multiple resolvings occur, to optimize against multiple re-initializations. This function is similar to strerror. The difference is that it accepts an error number returned by a gnutls function; In case of an unknown error a descriptive string is sent instead of NULL . This function will pretty print the status of a verification process – eg. the one obtained by dane_verify_crt() . This function will verify the given certificate chain against the CA constrains and/or the certificate available via DANE. If no information via DANE can be obtained the flag DANE_VERIFY_NO_DANE_INFO is set. If a DNSSEC signature is not available for the DANE record then the verify flag DANE_VERIFY_NO_DNSSEC_DATA is set."
