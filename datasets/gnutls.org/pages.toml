["https://gnutls.org/manual/html_node/X_002e509-distinguished-names.html"]
title = "X.509 distinguished names (GnuTLS 3.8.4)"
description = "X.509 distinguished names (GnuTLS 3.8.4)"
full_description = 'The “subject” of an X.509 certificate is not described by a single name, but rather with a distinguished name. This in X.509 terminology is a list of strings each associated an object identifier. To make things simple GnuTLS provides gnutls_x509_crt_get_dn2 which follows the rules in [RFC4514] and returns a single string. Access to each string by individual object identifiers can be accessed using gnutls_x509_crt_get_dn_by_oid. This function will allocate buffer and copy the name of the Certificate. The name will be in the form "C=xxxx,O=yyyy,CN=zzzz" as described in RFC4514. The output string will be ASCII or UTF-8 encoded, depending on the certificate data. This function does not output a fully RFC4514 compliant string, if that is required see gnutls_x509_crt_get_dn3() . The more powerful gnutls_x509_crt_get_subject and gnutls_x509_dn_get_rdn_ava provide efficient but low-level access to the contents of the distinguished name structure. The X.509 distinguished name is a sequence of sequences of strings and this is what the irdn and iava indexes model. Note that ava will contain pointers into the dn structure which in turns points to the original certificate. Thus you should not modify any data or deallocate any of those. This is a low-level function that requires the caller to do the value conversions when necessary (e.g. from UCS-2).'
year_published = 2025
