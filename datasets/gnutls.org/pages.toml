["https://gnutls.org/manual/html_node/Cryptographic-API.html"]
title = "Cryptographic API (GnuTLS 3.8.4)"
description = "Cryptographic API (GnuTLS 3.8.4)"
full_description = "The following functions are to be used for low-level cryptographic operations. Their prototypes lie in gnutls/crypto.h. Note that due to historic reasons several functions, (e.g. gnutls_mac_list, gnutls_mac_get_name) of this API are part of the Core TLS API. This function will decrypt the given data using the algorithm specified by the context. This function must be provided the complete data to be decrypted, including the authentication tag. On several AEAD ciphers, the authentication tag is appended to the ciphertext, though this is not a general rule. This function will fail if the tag verification fails. This is similar to gnutls_aead_cipher_decrypt() , but it performs in-place encryption on the provided data buffers. This function will deinitialize all resources occupied by the given authenticated-encryption context. ctext_len: the length of encrypted data (initially must hold the maximum available size, including space for tag) This function will encrypt the given data using the algorithm specified by the context. The output data will contain the authentication tag. ctext_len: the length of encrypted data (initially must hold the maximum available size, including space for tag) This function will encrypt the provided data buffers using the algorithm specified by the context. The output data will contain the authentication tag. This is similar to gnutls_aead_cipher_encrypt() , but it performs in-place encryption on the provided data buffers. This function will initialize an context that can be used for encryption/decryption of data. This will effectively use the current crypto backend in use by gnutls or the cryptographic accelerator in use. This function operates on authenticated encryption with associated data (AEAD) ciphers and authenticate the input data. This function can only be called once and before any encryption operations. Note that in AEAD ciphers, this will not check the tag. You will need to compare the tag sent with the value returned from gnutls_cipher_tag() ."
