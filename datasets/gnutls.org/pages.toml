["https://gnutls.org/manual/html_node/ocsptool-Invocation.html"]
title = "ocsptool Invocation (GnuTLS 3.8.4)"
description = "ocsptool Invocation (GnuTLS 3.8.4)"
full_description = "Next: danetool Invocation, Previous: certtool Invocation, Up: More on certificate authentication [Contents][Index] Responses are typically signed/issued by designated certificates or certificate authorities and thus this tool requires on verification the certificate of the issuer or the full certificate chain in order to determine the appropriate signing authority. The specified certificate of the issuer is assumed trusted. The text printed is the same whether selected with the help option (--help) or the more-help option (--more-help). more-help will print the usage text by passing it through a pager program. more-help is disabled on platforms without a working fork(2) function. The PAGER environment variable is used to select the program, defaulting to more. Both will exit with a status code of 0. This is the “enable debugging” option. This option takes a ArgumentType.NUMBER argument. Specifies the debug level. This is the “ask an ocsp/http server on a certificate validity” option. This option takes a ArgumentType.STRING argument server name|url. Connects to the specified HTTP OCSP server and queries on the validity of the loaded certificate. Its argument can be a URL or a plain server name. It can be combined with –load-chain, where it checks all certificates in the provided chain, or with –load-cert and –load-issuer options. The latter checks the provided certificate against its specified issuer certificate. This is the “verify response” option. Verifies the provided OCSP response against the system trust anchors (unless –load-trust is provided). It requires the –load-signer or –load-chain options to obtain the signer of the OCSP response. This is the “print information on a ocsp request” option. Display detailed information on the provided OCSP request. This is the “print information on a ocsp response” option. Display detailed information on the provided OCSP response. This is the “read ocsp trust anchors from file” option. This option takes a ArgumentType.FILE argument."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/ocsptool-Invocation.html"
