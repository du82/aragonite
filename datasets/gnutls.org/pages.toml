["https://www.gnutls.org/manual/html_node/Anonymous-authentication.html"]
title = "Anonymous authentication (GnuTLS 3.8.4)"
description = "Anonymous authentication (GnuTLS 3.8.4)"
full_description = "The anonymous key exchange offers encryption without any indication of the peer’s identity. This kind of authentication is vulnerable to a man in the middle attack, but can be used even if there is no prior communication or shared trusted parties with the peer. It is useful to establish a session over which certificate authentication will occur in order to hide the identities of the participants from passive eavesdroppers. It is only available under TLS 1.2 or earlier versions. Unless in the above case, it is not recommended to use anonymous authentication. In the cases where there is no prior communication with the peers, an alternative with better properties, such as key continuity, is trust on first use (see Verifying a certificate using trust on first use authentication). The available key exchange algorithms for anonymous authentication are shown below, but note that few public servers support them, and they have to be explicitly enabled. These ciphersuites are negotiated only under TLS 1.2. This algorithm exchanges elliptic curve Diffie-Hellman parameters. It is more efficient than ANON_DH on equivalent security levels."
year_published = 2025
clearnet = "https://www.gnutls.org/manual/html_node/Anonymous-authentication.html"
