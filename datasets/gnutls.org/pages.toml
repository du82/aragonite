["https://gnutls.org/manual/html_node/gnutls_002dcli-Invocation.html"]
title = "gnutls-cli Invocation (GnuTLS 3.8.4)"
description = "gnutls-cli Invocation (GnuTLS 3.8.4)"
full_description = "Simple client program to set up a TLS connection to some other computer. It sets up a TLS connection and forwards data from the standard input to the secured socket and vice versa. The text printed is the same whether selected with the help option (--help) or the more-help option (--more-help). more-help will print the usage text by passing it through a pager program. more-help is disabled on platforms without a working fork(2) function. The PAGER environment variable is used to select the program, defaulting to more. Both will exit with a status code of 0. This is the “enable debugging” option. This option takes a ArgumentType.NUMBER argument. Specifies the debug level. This is the “enable trust on first use authentication” option. This option will, in addition to certificate authentication, perform authentication based on previously seen public keys, a model similar to SSH authentication. Note that when tofu is specified (PKI) and DANE authentication will become advisory to assist the public key acceptance process. This is the “fail to connect if a certificate is unknown or a known certificate has changed” option. This option will perform authentication as with option –tofu; however, no questions shall be asked whatsoever, neither to accept an unknown certificate nor a changed one. This is the “enable dane certificate verification (dnssec)” option. This option will, in addition to certificate authentication using the trusted CAs, verify the server certificates using on the DANE information available via DNSSEC. This is the “use the local dns server for dnssec resolving” option. This option will use the local DNS server for DNSSEC. This is disabled by default due to many servers not allowing DNSSEC. This option can be used to enable or disable CA certificate verification. It is to be used with the –dane or –tofu options. This is the “enable ocsp certificate verification” option. This option will enable verification of the peer’s certificate using ocsp"
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/gnutls_002dcli-Invocation.html"
