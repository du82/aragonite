["https://gnutls.org/manual/html_node/Deriving-keys-for-other-applications_002fprotocols.html"]
title = "Deriving keys for other applications/protocols (GnuTLS 3.8.4)"
description = "Deriving keys for other applications/protocols (GnuTLS 3.8.4)"
full_description = "In several cases, after a TLS connection is established, it is desirable to derive keys to be used in another application or protocol (e.g., in an other TLS session using pre-shared keys). The following describe GnuTLS’ implementation of RFC5705 to extract keys based on a session’s master secret. The API to use is gnutls_prf_rfc5705. The function needs to be provided with a label, and additional context data to mix in the context parameter. In the TLS versions prior to 1.3, it applies the TLS Pseudo-Random-Function (PRF) on the master secret and the provided data, seeded with the client and server random fields. The context variable can be used to add more data to the seed, after the random variables. It can be used to make sure the generated output is strongly connected to some additional data (e.g., a string used in user authentication). For example, after establishing a TLS session using gnutls_handshake, you can obtain 32-bytes to be used as key, using this call: For legacy applications which need to use a more flexible API, there is gnutls_prf, which in addition, allows to switch the mix of the client and server random nonces, using the server_random_first parameter. For additional flexibility and low-level access to the TLS1.2 PRF, there is a low-level TLS PRF interface called gnutls_prf_raw. That however is not functional under newer protocol versions."
