title = "Compatibility API (GnuTLS 3.8.4)"
description = "Compatibility API (GnuTLS 3.8.4)"
full_description = "The following functions are carried over from old GnuTLS released. They might be removed at a later version. Their prototypes lie in gnutls/compat.h. Returns: a pointer to a string that contains the name of the specified compression algorithm, or NULL . Returns: a zero-terminated list of gnutls_compression_method_t integers indicating the available compression methods. Deprecated: since 3.3.0 it is no longer possible to replace the internally used memory allocation functions This is the function where you set the memory allocation functions gnutls is going to use. By default the libc’s allocation functions (malloc() , free() ), are used by gnutls, to allocate both sensitive and not sensitive data. This function is provided to set the memory allocation functions to something other than the defaults This function must be called before gnutls_global_init() is called. This function is not thread safe. This function will read the certificate and return the appropriate digest algorithm to use for signing with this certificate. Some certificates (i.e. DSA might not be able to sign without the preferred algorithm). This function will sign the given hash using the private key. Do not use this function directly unless you know what it is. Typical signing requires the data to be hashed and stored in special formats (e.g. BER Digest-Info for RSA). This API is provided only for backwards compatibility, and thus restricted to RSA, DSA and ECDSA key types. For other key types please use gnutls_privkey_sign_hash() and gnutls_privkey_sign_data() ."
