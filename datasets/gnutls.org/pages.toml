["https://gnutls.org/manual/html_node/Session-resumption.html"]
title = "Session resumption (GnuTLS 3.8.4)"
description = "Session resumption (GnuTLS 3.8.4)"
full_description = "Next: Certificate verification, Previous: Virtual hosts and credentials, Up: Advanced topics [Contents][Index] To reduce time and network traffic spent in a handshake the client can request session resumption from a server that previously shared a session with the client. Under TLS 1.2, in order to support resumption a server can either store the session security parameters in a local database or use session tickets (see Session tickets) to delegate storage to the client. Under TLS 1.3, session resumption is only available through session tickets, and multiple tickets could be sent from server to client. That provides the following advantages: The client has to retrieve and store the session parameters. Before establishing a new session to the same server the parameters must be re-associated with the GnuTLS session using gnutls_session_set_data. Keep in mind that sessions will be expired after some time, depending on the server, and a server may choose not to resume a session even when requested to. The expiration is to prevent temporal session keys from becoming long-term keys. Also note that as a client you must enable, using the priority functions, at least the algorithms used in the last session. Returns the TLS session identifier. The session ID is selected by the server, and in older versions of TLS was a unique identifier shared between client and server which was persistent across resumption. In the latest version of TLS (1.3) or TLS 1.2 with session tickets, the notion of session identifiers is undefined and cannot be relied for uniquely identifying sessions across client and server. In client side this function returns the identifier returned by the server, and cannot be assumed to have any relation to session resumption. In server side this function is guaranteed to return a persistent identifier of the session since GnuTLS 3.6.4, which may not necessarily map into the TLS session ID value. Prior to that version the value could only be considered a persistent identifier, under TLS1.2 or earlier and when no session tickets were in use."
year_published = 2025
clearnet = "https://gnutls.org/manual/html_node/Session-resumption.html"
tags = ["returns:", "since:"]
