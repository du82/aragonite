["https://gnutls.org/manual/html_node/Authentication-using-PSK.html"]
title = "Authentication using PSK (GnuTLS 3.8.4)"
description = "Authentication using PSK (GnuTLS 3.8.4)"
full_description = "Authentication using Pre-shared keys is a method to authenticate using usernames and binary keys. This protocol avoids making use of public key infrastructure and expensive calculations, thus it is suitable for constraint clients. It is available under all TLS protocol versions. Authentication using the PSK protocol and Diffie-Hellman key exchange. This method offers perfect forward secrecy. Authentication using the PSK protocol and Elliptic curve Diffie-Hellman key exchange. This method offers perfect forward secrecy. Authentication using the PSK protocol for the client and an RSA certificate for the server. This is not available under TLS 1.3."
