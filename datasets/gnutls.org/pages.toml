["https://www.gnutls.org/manual/html_node/Verification-using-PKCS11.html"]
title = "Verification using PKCS11 (GnuTLS 3.8.4)"
description = "Verification using PKCS11 (GnuTLS 3.8.4)"
full_description = "Previous: Verifying a certificate in the context of TLS session, Up: X.509 certificates [Contents][Index] Some systems provide a system wide trusted certificate storage accessible using the PKCS #11 API. That is, the trusted certificates are queried and accessed using the PKCS #11 API, and trusted certificate properties, such as purpose, are marked using attached extensions. One example is the p11-kit trust module8. These special PKCS #11 modules can be used for GnuTLS certificate verification if marked as trust policy modules, i.e., with trust-policy: yes in the p11-kit module file. The way to use them is by specifying to the file verification function (e.g., gnutls_certificate_set_x509_trust_file), a pkcs11 URL, or simply pkcs11: to use all the marked with trust policy modules. The trust modules of p11-kit assign a purpose to trusted authorities using the extended key usage object identifiers. The common purposes are shown in Table 4.4. Note that typically according to [RFC5280] the extended key usage object identifiers apply to end certificates. Their application to CA certificates is an extension used by the trust modules. With such modules, it is recommended to use the verification functions gnutls_x509_trust_list_verify_crt2, or gnutls_certificate_verify_peers, which allow to explicitly specify the key purpose. The other verification functions which do not allow setting a purpose, would operate as if GNUTLS_KP_TLS_WWW_SERVER was requested from the trusted authorities. Previous: Verifying a certificate in the context of TLS session, Up: X.509 certificates [Contents][Index]"
