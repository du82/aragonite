["https://go-colly.org/docs/examples/openedx_courses"]
title = "openedx courses | Colly"
description = "Scraping framework for extracting the data you need from websites, used for a wide range of applications, like data mining, data processing or archiving"
full_description = 'Introduction How to install Getting started Configuration Best Practices Debugging Distributed scraping Storage backend Using multiple collectors Crawler configuration Extensions Examples Basic Error handling Login Max depth Multipart Parallel Proxy switcher Queue Random delay Rate limit Redis backend Request context Scraper server Url filter Real life examples Cryptocoins market capacity Coursera courses Factbase Google groups Hackernews comments Instagram images Openedx courses Reddit Shopify sitemap Xkcd store items Openedx courses package main import ( "encoding/json" "fmt" "strings" "time" "github.com/gocolly/colly" ) // DATE_FORMAT default format date used in openedx const DATE_FORMAT = "Jan 02, 2006" // Course store openedx course data type Course struct { CourseID string Run string Name string Number string StartDate *time.Time EndDate *time.Time URL string } func main() { // Instantiate default collector c := colly.NewCollector( // Using IndonesiaX as sample colly.AllowedDomains("indonesiax.co.id", "www.indonesiax.co.id"), // Cache responses to prevent multiple download of pages // even if the collector is restarted colly.CacheDir("./cache"), ) courses := make([]Course, 0, 200) // On every a element which has href attribute call callback c.OnHTML("a[href]", func(e *colly.HTMLElement) { link := e.Attr("href") if !strings.HasPrefix(link, "/courses/") { return } // start scaping the page under the link found e.Request.Visit(link) }) c.OnHTML("div[class=content-wrapper]", func(e *colly.HTMLElement) { if e.DOM.Find("section.course-info").Length() == 0 { return } title := strings.Split(e.ChildText(".course-title"), "\n")[0] course_id := e.ChildAttr("input[name=course_id]", "value") start_date, _ := time.Parse(DATE_FORMAT, e.ChildText("span.start-date")) end_date, _ := time.Parse(DATE_FORMAT, e.ChildText("span.final-date")) var run string if len(strings.Split(course_id, "_")) > 1 { run = strings.Split(course_id, "_")[1] } course := Course{ CourseID: course_id, Run: run, Name: title, Number: e.ChildText("span.course-number"), StartDate: &start_date, EndDate: &end_date, URL: fmt.Sprintf("/courses/%s/about", course_id), } courses = append(courses, course) }) // Start scraping on https://openedxdomain/courses c.Visit("https://www.indonesiax.co.id/courses") // Convert results to JSON data if the scraping job has finished jsonData, err := json.MarshalIndent(courses, "", " ") if err != nil { panic(err) } // Dump json to the standard output (can be redirected to a file) fmt.Println(string(jsonData)) }'
