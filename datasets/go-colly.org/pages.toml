full_description = 'Introduction How to install Getting started Configuration Best Practices Debugging Distributed scraping Storage backend Using multiple collectors Crawler configuration Extensions Examples Basic Error handling Login Max depth Multipart Parallel Proxy switcher Queue Random delay Rate limit Redis backend Request context Scraper server Url filter Real life examples Cryptocoins market capacity Coursera courses Factbase Google groups Hackernews comments Instagram images Openedx courses Reddit Shopify sitemap Xkcd store items Cryptocoins market capacity package main import ( "encoding/csv" "log" "os" "github.com/gocolly/colly" ) func main() { fName := "cryptocoinmarketcap.csv" file, err := os.Create(fName) if err != nil { log.Fatalf("Cannot create file %q: %s\n", fName, err) return } defer file.Close() writer := csv.NewWriter(file) defer writer.Flush() // Write CSV header writer.Write([]string{"Name", "Symbol", "Price (USD)", "Volume (USD)", "Market capacity (USD)", "Change (1h)", "Change (24h)", "Change (7d)"}) // Instantiate default collector c := colly.NewCollector() c.OnHTML("#currencies-all tbody tr", func(e *colly.HTMLElement) { writer.Write([]string{ e.ChildText(".currency-name-container"), e.ChildText(".col-symbol"), e.ChildAttr("a.price", "data-usd"), e.ChildAttr("a.volume", "data-usd"), e.ChildAttr(".market-cap", "data-usd"), e.ChildText(".percent-1h"), e.ChildText(".percent-24h"), e.ChildText(".percent-7d"), }) }) c.Visit("https://coinmarketcap.com/all/views/all/") log.Printf("Scraping finished, check file %q for results\n", fName) }'
