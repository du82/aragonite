description = "Scraping framework for extracting the data you need from websites, used for a wide range of applications, like data mining, data processing or archiving"
full_description = 'Introduction How to install Getting started Configuration Best Practices Debugging Distributed scraping Storage backend Using multiple collectors Crawler configuration Extensions Examples Basic Error handling Login Max depth Multipart Parallel Proxy switcher Queue Random delay Rate limit Redis backend Request context Scraper server Url filter Real life examples Cryptocoins market capacity Coursera courses Factbase Google groups Hackernews comments Instagram images Openedx courses Reddit Shopify sitemap Xkcd store items Extensions Extensions are small helper utilities shipped with Colly. List of plugins is available here. Usage The following example enables the random User-Agent switcher and the Referrer setter extension and visits httpbin.org twice. import ( "log" "github.com/gocolly/colly" "github.com/gocolly/colly/extensions" ) func main() { c := colly.NewCollector() visited := false extensions.RandomUserAgent(c) extensions.Referrer(c) c.OnResponse(func(r *colly.Response) { log.Println(string(r.Body)) if !visited { visited = true r.Request.Visit("/get?q=2") } }) c.Visit("http://httpbin.org/get") }'
