title = "In-Cabin Sensing AI - Affectiva : Affectiva"
description = "At Affectiva, we pioneered the first automotive applications of Emotion AI. Using in-cabin cameras our AI can detect the state, emotions, and reactions of drivers and other occupants in the context of a vehicle environment, as well as their activities and the objects they use. Are they distracted, tired, happy, or angry? How are... View Article"
full_description = 'Combining driver monitoring and cabin monitoring for a complete, human-centric view of what’s happening inside any vehicle <img fetchpriority="high" decoding="async" class="wp-image-6279 alignright" src="https://www.affectiva.com/wp-content/uploads/2024/01/auto6.png" alt="" width="452" height="471" srcset="https://www.affectiva.com/wp-content/uploads/2024/01/auto6.png 2072w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-768x801.png 768w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-1473x1536.png 1473w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-1965x2048.png 1965w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-671x700.png 671w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-511x533.png 511w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-767x800.png 767w, https://www.affectiva.com/wp-content/uploads/2024/01/auto6-480x500.png 480w" sizes="(max-width: 452px) 100vw, 452px" /> Using in-cabin cameras our AI can detect the state, emotions, and reactions of drivers and other occupants in the context of a vehicle environment, as well as their activities and the objects they use. Are they distracted, tired, happy, or angry? How are they reacting to the driving experience, the interfaces in the vehicle, other people in the car, and the content that is being served? By getting a deeper understanding of what’s happening with people in a vehicle, OEMs and Tier 1s can create better mobility experiences that not only enhance safety but also comfort, wellness, and entertainment. When Affectiva was acquired by Smart Eye, we merged our two companies, and Affectiva’s Emotion AI is now integrated into Smart Eye’s Automotive Interior Sensing solution. Affectiva’s deep expertise in machine learning, data acquisition, and annotation now enables Smart Eye to deliver Human Insight AI that understands, supports, and predicts human behavior in complex environments.'
