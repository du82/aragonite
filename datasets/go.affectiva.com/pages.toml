title = "Affectiva Events: Trends Analysis Webinar"
description = """
Over the last decade, advertisers have increasingly focused on creating emotionally resonant ad content, with the knowledge that emotions are a key predictor of sales and brand loyalty. 
For the past 8 years, Affectiva has applied its Emotion AI to measure ad effectiveness by analyzing consumer emotional responses to video advertising.  

Through its work with 70% of the world’s largest advertisers and 28% of the Fortune Global 500, Affectiva has amassed a massive database of 10 million consumer responses to more than 53,000 ads in 90 countries. This first-of-its kind emotion database provides unparalleled insights into the impact of emotions in advertising.
 
Affectiva has recently conducted a large-scale analysis of its data and, in this virtual event, will give you insight into its key findings on trends in advertising."""
