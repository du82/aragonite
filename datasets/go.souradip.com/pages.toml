full_description = "Hi there, I'm Souradip 👋 I'm a British Physician-Scientist in-training. 🩺🧪 I've been writing code since 2006. 💻 Especially interested in applying deep learning to medicine and I've contributed to tensorflow. 🧠 I was Co-President of St Catharine's College MCR (the society for graduate students) and I published parts of our online infrastructure including... 🎓 The formal hall booking system Projects to improve transparency for social good, e.g. the accommodation database to easily compare college rents with the private market, and used to negotiate rent arrangements on behalf of all of the graduate students. Extensive experience in building tech for social activism, and I build the tech stack of a widening access to medicine charity. 🗣 I also post fun projects, e.g. 🎉 a message board people can text at parties a spatial video chat system to host more natural parties during a global pandemic some of my work in Android reverse-engineering web apps (e.g. a comments plugin for static websites) home automation ✉ Reach out by email/twitter if you want to chat 😊"
