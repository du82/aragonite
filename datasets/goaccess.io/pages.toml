["https://goaccess.io/man"]
title = "GoAccess - Manual Page"
full_description = '''Manual Page NAME SYNOPSIS DESCRIPTION STORAGE CONFIGURATION OPTIONS CUSTOM LOG/DATE FORMAT INTERACTIVE KEYS EXAMPLES NOTES BUGS AUTHOR Manual Page NAME goaccess - Fast web log analyzer and interactive viewer. SYNOPSIS goaccess [filename] [ options ... ] [-c][-M][-H][-q][-d][...] DESCRIPTION goaccess is a free (MIT Licensed) and open source real-time web log analyzer and interactive viewer that runs in a terminal in *nix systems or through your browser. It provides fast and valuable HTTP statistics for system administrators that require a visual server report on the fly. GoAccess parses the specified web log file and outputs the data to the X terminal. Features include: General Statistics: This panel gives a summary of several metrics, some of them are: number of valid and invalid requests, time taken to analyze the data set, unique visitors, requested files, static files (CSS, ICO, JPG, etc) HTTP referrers, 404s, size of the parsed log file and bandwidth con‐ sumption. Unique visitors: This panel shows metrics such as hits, unique visitors and cumulative bandwidth per date. HTTP requests containing the same IP, the same date, and the same user agent are considered a unique visitor. By default, it includes web crawlers/spiders. Optionally, date specificity can be set to the hour level using --date-spec=hr which will display dates such as 05/Jun/2016:16, or to the minute level producing 05/Jun/2016:16:59. This is great if you want to track your daily traffic at the hour or minute level. Requested files: This panel displays the most highly requested (non-static) files on your web server. It shows hits, unique visitors, and percentage, along with the cumulative bandwidth, protocol, and the request method used. Requested static files: Lists the most frequently static files such as: JPG, CSS, SWF, JS, GIF, and PNG file types, along with the same metrics as the last panel. Additional static files can be added to the configuration file. 404 or Not Found: Displays the same metrics as the previous request panels, however, its data contains all pages that were not found on the server, or commonly known as 404 status code. Hosts: This panel has detailed information on the hosts themselves. This is great for spotting aggressive crawlers and identifying who's eating your bandwidth. Expanding the panel can display more information such as host's reverse DNS lookup result, country of origin and city. If the -a argument is enabled, a list of user agents can be displayed by selecting the desired IP address, and then pressing ENTER. Operating Systems: This panel will report which operating system the host used when it hit the server. It attempts to provide the most specific version of each operating system. Browsers: This panel will report which browser the host used when it hit the server. It attempts to provide the most specific version of each browser. Visit Times: This panel will display an hourly report. This option displays 24 data points, one for each hour of the day. Optionally, hour specificity can be set to the tenth of a minute level using --hour-spec=min which will display hours as 16:4 This is great if you want to spot peaks of traffic on your server. Virtual Hosts: This panel will display all the different virtual hosts parsed from the access log. This panel is displayed if %v is used within the log-format string. Referrers URLs: If the host in question accessed the site via another resource, or was linked/diverted to you from another host, the URL they were referred from will be provided in this panel. See `--ignore-panel` in your configuration file to enable it. (disabled by default) Referring Sites: This panel will display only the host part but not the whole URL. The URL where the request came from. Keyphrases: It reports keyphrases used on Google search, Google cache, and Google translate that have led to your web server. At present, it only supports Google search queries via HTTP. See `--ignore-panel` in your configuration file to enable it. (disabled by default) Geo Location: Determines where an IP address is geographically located. Statistics are broken down by continent and country. It needs to be compiled with GeoLocation support. HTTP Status Codes: The values of the numeric status code to HTTP requests. ASN: This panel displays ASN (Autonomous System Numbers) data for GeoIP2 and legacy databases. Great for detecting malicious traffic and blocking accordingly. Remote User (HTTP authentication) This is the userid of the person requesting the document as determined by HTTP authentication. If the document is not password protected, this part will be "-" just like the previous one. This panel is not enabled unless %e is given within the log-format variable. Cache Status If you are using caching on your server, you may be at the point where you want to know if your request is being cached and served from the cache. This panel shows the cache status of the object the server served. This panel is not enabled unless %C is given within the log-format variable. The status can be either MISS, BYPASS, EXPIRED, STALE, UPDATING, REVALIDATED or HIT MIME Types This panel specifies Media Types (formerly known as MIME types) and Media Subtypes which will be assigned and listed underneath. This panel is not enabled unless %M is given within the log-format variable. See MIME types for more details. Encryption Settings This panel shows the SSL/TLS protocol used along the Cipher Suites. This panel is not enabled unless %K is given within the log-format variable. NOTE: Optionally and if configured, all panels can display the average time taken to serve the request. STORAGE In-memory storage provides better performance at the cost of limiting the dataset size to the amount of available physical memory. GoAccess uses in-memory hash tables. It has very good memory usage and pretty good performance. This storage has support for on-disk persistence. Default Hash Tables In-memory storage provides better performance at the cost of limiting the dataset size to the amount of available physical memory. GoAccess uses in-memory hash tables. It has very good memory usage and pretty good performance. This storage has support for on-disk persistence. CONFIGURATION Multiple options can be used to configure GoAccess. For a complete up-to-date list of configure options, run ./configure --help --enable-debug Compile with debugging symbols and turn off compiler optimizations. --enable-utf8 Compile with wide character support. Ncursesw is required. --enable-geoip=<legacy|mmdb> Compile with GeoLocation support. MaxMind's GeoIP is required. legacy will utilize the original GeoIP databases. mmdb will utilize the enhanced GeoIP2 databases. --with-getline Dynamically expands line buffer in order to parse full line requests instead of using a fixed size buffer of 4096. --with-openssl Compile GoAccess with OpenSSL support for its WebSocket server. OPTIONS The following options can be supplied via the command line or long options through the configuration file. LOG/DATE/TIME FORMAT --time-format <timeformat> The time-format variable followed by a space, specifies the log format time containing any combination of regular characters and special format specifiers. They all begin with a percentage (%) sign. See `man strftime`. %T or %H:%M:%S. Note: If a timestamp is given in microseconds, %f must be used as time-format. If the timestamp is given in milliseconds %* must be used as time-format. --date-format <dateformat> The date-format variable followed by a space, specifies the log format date containing any combination of regular characters and special format specifiers.They all begin with a percentage (%) sign. See `man strftime`. Note: If your access log contains English dates/months such as 12/Jan/2021 but your machine locale is not set to English, then you will need to set your LC_TIME, e.g., LC_TIME="en_US.UTF-8" bash -c 'goaccess access.log --log-format=COMBINED' Also, if a timestamp is given in microseconds, %f must be used as date-format. If the timestamp is given in milliseconds %* must be used as date-format. --datetime-format <date_timeformat> The date and time format combines the two variables into a single option. This gives the ability to get the timezone from a request and convert it to another timezone for output. See --tz=<timezone> They all begin with a percentage (%) sign. See `man strftime`. e.g., %d/%b/%Y:%H:%M:%S %z. Note: if --datetime-format is used, %x must be passed in the log-format variable to represent the date and time field. Important: if --datetime-format is used, ensure --date-format and --time-format are not used. --log-format <logformat> The log-format variable followed by a space or \t for tab-delimited, specifies the log format string. In addition to specifying the raw log/date/time formats, for simplicity, any of the following predefined log format names can be supplied to the log/date/time-format variables. GoAccess can also handle one predefined name in one variable and another predefined name in another variable. COMBINED | Combined Log Format VCOMBINED | Combined Log Format with Virtual Host COMMON | Common Log Format VCOMMON | Common Log Format with Virtual Host W3C | W3C Extended Log File Format SQUID | Native Squid Log Format CLOUDFRONT | Amazon CloudFront Web Distribution CLOUDSTORAGE | Google Cloud Storage AWSELB | Amazon Elastic Load Balancing AWSS3 | Amazon Simple Storage Service (S3) AWSALB | Amazon Application Load Balancer CADDY | Caddy's JSON Structured format (local/info format) TRAEFIKCLF | Traefik's CLF flavor Note: Generally, you need quotes around values that include white spaces, commas, pipes, quotes, and/or brackets. Inner quotes must be escaped. Note: Piping data into GoAccess won't prompt a log/date/time configuration dialog, you will need to previously define it in your configuration file or in the command line. Note: The default GoAccess format for CADDY is the 'local/info' format. Nevertheless, if needed, you have the option to utilize a custom GoAccess log format to match your particular configuration. For additional details, refer to this post. USER INTERFACE OPTIONS -c --config-dialog Prompt log/date configuration window on program start. -i --hl-header Color highlight active panel. -m --with-mouse Enable mouse support on main dashboard. --color=<fg:bg[attrs, PANEL> Specify custom colors for the terminal output. Color Syntax: DEFINITION space/tab colorFG#:colorBG# [attributes,PANEL] FG# = foreground color [-1...255] (-1 = default term color) BG# = background color [-1...255] (-1 = default term color) Optionally, it is possible to apply color attributes (multiple attributes are comma separated), such as: bold,underline,normal,reverse,blink If desired, it is possible to apply custom colors per panel, that is, a metric in the REQUESTS panel can be of color A, while the same metric in the BROWSERS panel can be of color B. COLOR_MTRC_HITS COLOR_MTRC_VISITORS COLOR_MTRC_DATA COLOR_MTRC_BW COLOR_MTRC_AVGTS COLOR_MTRC_CUMTS COLOR_MTRC_MAXTS COLOR_MTRC_PROT COLOR_MTRC_MTHD COLOR_MTRC_HITS_PERC COLOR_MTRC_HITS_PERC_MAX COLOR_MTRC_VISITORS_PERC COLOR_MTRC_VISITORS_PERC_MAX COLOR_PANEL_COLS COLOR_BARS COLOR_ERROR COLOR_SELECTED COLOR_PANEL_ACTIVE COLOR_PANEL_HEADER COLOR_PANEL_DESC COLOR_OVERALL_LBLS COLOR_OVERALL_VALS COLOR_OVERALL_PATH COLOR_ACTIVE_LABEL COLOR_BG COLOR_DEFAULT COLOR_PROGRESS See configuration file for a sample color scheme. --color-scheme <1|2|3> Choose among terminal color schemes. 1 for the monochrome scheme. 2 for the green scheme and 3 for the Monokai scheme (shown only if terminal supports 256 colors). --crawlers-only Parse and display only crawlers (bots). --html-custom-css=<path.css> Specifies a custom CSS file path to load in the HTML report. --html-custom-js=<path.js> Specifies a custom JS file path to load in the HTML report. --html-report-title=<title> Set HTML report page title and header. --html-refresh=<seconds> Refresh the HTML report every X seconds. The value has to be between 1 and 60 seconds. The default is set to refresh the HTML report every 1 second. --html-prefs=<JSON> Set HTML report default preferences. Supply a valid JSON object containing the HTML preferences. It allows the ability to customize each panel plot. See example below. --html-prefs='{"theme":"bright","perPage":5,"layout":"horizontal","showTables":true,"visitors":{"plot":{"chartType":"bar"}}}' Note: Note: The JSON object passed needs to be a one line JSON string. For instance, --json-pretty-print Format JSON output using tabs and newlines. --max-items=<num> The maximum number of items to display per panel. The maximum can be a number between 1 and n. Note: Only a static HTML, CSV and JSON output allow a maximum number greater than the default value of 366 (or 50 in the real-time HTML output) items per panel. --no-color Turn off colored output. This is the default output on terminals that do not support colors. --no-column-names Don't write column names in the terminal output. By default, it displays column names for each available metric in every panel. --no-csv-summary Disable summary metrics on the CSV output. --no-progress Disable progress metrics [total requests/requests per second] when parsing a log. --no-tab-scroll Disable scrolling through panels when TAB is pressed or when a panel is selected using a numeric key. --no-html-last-updated Do not show the last updated field displayed in the HTML generated report. --no-parsing-spinner Do now show the progress metrics and parsing spinner. --tz=<timezone> Ouputs the report date/time data in the given timezone. Note that it uses the canonical timezone name. e.g., Europe/Berlin or America/Chicago or Africa/Cairo. If an invalid timezone name is given, the ouput will be in GMT. See --datetime-format in order to properly specify a timezone in the date/time format. SERVER OPTIONS --addr=<address> Specify IP address to bind the server to. Otherwise it binds to 0.0.0.0. Usually there is no need to specify the address, unless you intentionally would like to bind the server to a different address within your server. --daemonize Run GoAccess as daemon (only if --real-time-html enabled). --user-name=<username> Run GoAccess as the specified user. Note: Note: It's important to ensure the user or the users' group can access the input and output files as well as any other files needed. Other groups the user belongs to will be ignored. As such it's advised to run GoAccess behind a SSL proxy as it's unlikely this user can access the SSL certificates. --origin=<url> Ensure clients send the specified origin header upon the WebSocket handshake. The specified origin should look exactly to the origin header field sent by the browser. e.g., --origin=http://goaccess.io --pid-file=<path/goaccess.pid> Write the daemon PID to a file when used along the --daemonize option. --port=<port> Specify the port to use. By default GoAccess listens on port 7890 for the WebSocket server'''
year_published = 2025
clearnet = "https://goaccess.io/man"
