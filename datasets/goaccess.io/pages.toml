["https://goaccess.io/release-notes"]
title = "GoAccess - Release Notes"
full_description = '''Release 1.9.3 Friday, May 31, 2024 Added Added additional common bots to the list. Added Added Address Sanitizer via '--enable-asan' to the configure options for debugging purposes. Fixed Fixed inability to parse JSON keys containing dots. Fixed Fixed out-of-bounds access for invalid HTTP status codes. Fixed Fixed out-of-bounds access when parsing a log in serial processing mode. Fixed Fixed regression introduced in 8f570c, which caused duplicate counts upon restoring from disk via '--restore'. Release 1.9.2 Friday, April 12, 2024 Added Added World Map to the Geo Location panel on the HTML report. Added Added additional non-official/standard HTTP status codes such as Caddy's 0 HTTP status among others. Added Added support for '%z' on strptime for non-glibc systems, such as musl libc in Alpine Linux (Docker container), enabling the use of '--tz' Changed Changed the '--hide/ignore-referrer' options to filter by hostname directly without the use of wildcards, e.g., '--ignore-referrer=wiki.google.com'. Fixed Fixed inability to parse duplicate specifiers during log format parsing. Fixed Fixed regression which previously hindered the ability to modify log, date, and time formats within the TUI dialog. i.e., '# goaccess access.log -c'. Replaced Replaced 'remote_ip' with 'client_ip' for Caddy's JSON format, allowing the use of trusted proxies. Updated Updated Caddy JSON example log format to handle headers correctly. Updated Updated Swedish i18n. Release 1.9.1 Tuesday, February 05, 2024 Added Added support for macOS to the OS detection. Fixed Fixed C99 mode issue with initial declarations [CentOS7]. Fixed Fixed minor typographical, orthographic, and grammatical errors in the German translation. Fixed Fixed a regression issue wherein parsing would halt at the first empty log file. Release 1.9 Tuesday, January 30, 2024 Added Added multi-threaded log processing with '--jobs=<num>' for a boost in parsing speed, achieving an improvement ranging from 1.26 to 3.65x faster. Added Added the 'SEARCH' method to the list of HTTP request methods. Added Added compatibility to include the Traefik log format. Added Added the ability to gracefully handle SIGQUIT as a signal for shutdown. Altered Altered WebSocket server initialization, ensuring it takes place after log-format checks. Deprecated Deprecated '--output-format'; now, only the '--output' option is permissible. Implemented Implemented mutex locking to prevent a TZ environment race condition. Fixed Fixed a potential heap overflow when checking a request for bots. Fixed Fixed sorting of child items on HTML panels when sorting a column via the UI. Fixed Fixed an issue where, in some cases, the referer host wouldn't be extracted properly Fixed Fixed the miscategorization of Android 12.1 under operating systems. Fixed Fixed TUI and temporarily ignored SIGINT during subdialog execution via Ctrl+C. Updated Updated the list of browsers/bots. Release 1.8.1 Tuesday, October 31, 2023 Added Added latest Android and macOS versions to the list of OSs. Fixed Fixed issue when trying to apply a regex on an invalid value (HTML report). Fixed Fixed issue with D3.js xScale.domain() going out of boundaries in certain cases. Prevent Prevent setting default static files when no static-file options are defined in config file. Release 1.8 Saturday, September 30, 2023 Added Added dual-stack support to the WebSocket server. Added Added Debian Bookworm to the official deb repo. Added Added Ubuntu Lunar to the official deb repo. Fixed Fixed compiler error on macOS 10.12. Updated Updated bootstrap to v3.4. Updated Updated FontAwesome with additional icons for upcoming major release. Updated Updated Japanese translation. Updated Updated OS display from Macintosh to macOS. Updated Updated to D3.js v7 (latest) including charts.js code. Release 1.7.2 Friday, March 31, 2023 Added Added a color-coding scheme to HTTP status codes. Added Added '--external-assets' command line option to output external JS+CSS files. Great when used with Content Security Policy (CSP). Ensure Ensure there's a fallback for 'Windows' if it appears on the user-agent. Ensure Ensure we construct the WebSocket URL in a way that supports multiple use cases when used along '--ws-url' and '--port'. Fixed Fixed a segfault due to a null pointer exception on FreeBSD. Fixed Fixed build with '--disable-nls'. Fixed Fixed invalid read (heap-buffer-overflow) when parsing an XFF spec via JSON. Fixed Fixed segfault when parsing a specific XFF specifier. Release 1.7.1 Tuesday, February 28, 2023 Added Added 'inlang' for easy localization (i18n) updates. https://inlang.com/editor/github.com/allinurl/goaccess Added Added nanosecond parsing option via the '%n' specifier. Great for parsing 'Traefik' JSON logs duration field. Changed Changed Docker workflow to build a docker image on different architectures {'arm64' & 'amd64'}. Fixed Fixed issue with '--unknowns-as-crawlers' where it did not process them as such. Release 1.7 Saturday, December 31, 2022 Added Added an option to classify unknown OS and browsers as crawlers using `--unknowns-as-crawlers`. Added Added highlighting to certain metrics on the HTML report for readability. Added Added a new panel that displays ASN data for GeoIP2 and legacy databases. Great for detecting malicious traffic and blocking accordingly. Added Added an ASN metric per IP/host. Changed Changed and prioritize user's browsers list over heuristics. Ensure Ensure `--geoip-database=<path>` can be used multiple times to support different databases. Fixed Fixed invalid read when loading the list of agents for an IP. Fixed Fixed issue where a file containing a NUL `\0` character would crash the program. Updated Updated Swedish i18n. Release 1.6.5 Monday, October 31, 2022 Updated Updated Dockerfile build stage to use alpine:3. Updated Updated deb build to use the right libncursesw6 dependency. Release 1.6.4 Friday, September 30, 2022 Added Added Korean translation (i18n). Added Added the ability to use filenames as virtualhosts using '--fname-as-vhost=<regex>'. Enabled Enabled crawlers/bots under the OSs panel instead of being shown as 'Unknown'. Updated Updated the format on the command-line help output. Release 1.6.3 Thursday, August 31, 2022 Enabled Enabled DNS thread when resolving a host and outputting real-time HTML. This helps avoid stalling the WS server on busy connections. Fixed Fixed issue where it would not properly parse an XFF if the '%h' specifier was already set. Fixed Fixed possible XSS issues when using '--html-custom-css' and '--html-custom-js' by allowing valid filenames. Release 1.6.2 Thursday, July 14, 2022 Added Added `Android 12` to the list of OSs. Added Added `macOS 12 Ventura` to the list of OSs. Fixed Fixed implicit declaration build issue due to `timegm(3)` on `BSDs` and `macOS`. Fixed Fixed issue where timezone conversion would be performed twice on a given date. Release 1.6.1 Thursday, June 30, 2022 Added Added a `--ping-interval=<secs>` in an attempt to keep the WebSocket connection opened. Added Added support for timezone conversion via `--datetime-format=<format>` and `--tz=<timezone>`. Added Added the ability to reconnect to the WebSocket server after 1 sec with exponential backoff (x20). Fixed Fixed issue where an invalid client connection would stall data out to clients via the WebSocket server. Fixed Fixed an issue where real-time data would be parsed multiple times under `Cygwin`. Release 1.6 Tuesday, May 31, 2022 Changed Changed slightly how the XFF field is specified. See man page for details. Ensure Ensure city is displayed with the DBIP City Lite database. Ensure Ensure no 'cleaning up resources' message is displayed if `--no-progress` is passed. Ensure Ensure the maximum number of items per panel defaults to 1440 (24hrs) when passing `--date-spec=min`. Fixed Fixed issue when parsing a delimited XFF field followed by a host IP. Fixed Fixed issue where some data was buffered on the WebSocket server before it was sent to each client. Fixed Fixed issue where the WebSocket server would fail with POLLNVAL consuming 100% CPU. Fixed Fixed segfault when attempting to open an unresolved IP on mac/BSDs. Release 1.5.7 Thursday, April 28, 2022 Updated Updated Caddy's JSON format. This should address CADDY's v2.5.0 change. Updated Updated Chinese translation (i18n). Updated Updated GeoIP module so it defaults to native language name (i18n) or fall-back to English. Updated Updated Russian translation (i18n). Updated Updated Ukrainian translation (i18n). Release 1.5.6 Wednesday, March 30, 2022 Added Added `--anonymize-level=<1|2|3>` option to specify IP anonymization level. Added Added minute specificity to the Visitors panel via `--date-spec=min`. Added Added the ability to toggle on/off panels on the HTML report. Changed Changed stderr to stdout on non-error output when exiting goaccess. Release 1.5.5 Monday, January 31, 2022 Added Added mechanism to automatically parse additional bots. Changed Changed area chart interpolation to 'monotone'. This should avoid the issue where the interpolated curve has a bend into the negative space. Changed Changed build to use debugging symbols even for release builds. Changed Changed order on which we verify bots to be the first thing we check. This adds a slight improvement on parsing time. Ensure Ensure we initialize DNS resolver conditions and mutexes before they're used. Fixed Fixed possible buffer over-read for cases where a '\0' could be reached early when parsing a log line. Fixed Fixed possible data race on UI spinner thread. Fixed Fixed regression where a lot of robots were not detected by GoAccess. Release 1.5.4 Saturday, December 25, 2021 Added Added AWS ALB to the predefined logs format list --log-format=AWSALB. Ensure Ensure we lock our pipe/websocket writer before broadcasting message. Ensure Ensure we require a valid host token even when we're not validating the IP. Ensure Ensure we simply update the TUI once after tailing multiple files. Ensure Ensure we simply update the UI once after tailing multiple files. Fixed Fixed buffer overflow when checking if an HTTP code was a 404 on an empty status code. Optimized Optimized terminal and HTML UI output when tailing multiple files. Updated Updated DB PATH error message to be more descriptive. Release 1.5.3 Thursday, November 25, 2021 Added Added additional crawlers to the default list. Added Added Italian translation (i18n). Added Added 'macOS 12' to the list of OS. Fixed Fixed buffer overflow caused by an excessive number of invalid requests with multiple logs. Fixed Fixed visualization issue on the HTML report for panels with disabled chart. Release 1.5.2 Tuesday, September 28, 2021 Added Added .avi to the list of static requests/extensions. Changed Changed label from 'Init. Proc. Time' to 'Log Parsing Time'. Fixed Fixed issue where lengthy static-file extension wouldn't account certain valid requests. Fixed Fixed possible buffer underflow when checking static-file extension. Fixed Fixed segfault when attempting to parse an invalid JSON log while using a JSON log format. Fixed Fixed segfault when ignoring a status code and processing a line > '4096' chars. Release 1.5.1 Wednesday, June 30, 2021 Changed Changed official deb repo so it now builds '--with-getline' in order to support request lines longer than 4096. Ensure Ensure there's no tail delay if the log file hasn't changed. Fixed Fixed data race when writing to a self-pipe and attempting to stop the WS server. Fixed Fixed inability to close expanded panel when pressing 'q' on TUI. Fixed Fixed possible data race during parsing spinner label assignment. Increased Increased the maximum number of files to monitor from '512' to '3072'. Release 1.5 Wednesday, May 26, 2021 Added Added a Docker container based isolated build environment (Debian). Added Added Dark Mode detection to the HTML report. Added Added the ability for the WebSocket server to bind to a Unix-domain socket. Added Added the ability to parse IPs enclosed within brackets (e.g., IPv6). Changed Changed categorization of requests containing 'CFNetwork' to 'iOS' when applicable. Changed Changed command line option from '--hide-referer' to '--hide-referrer'. Changed Changed command line option from '--ignore-referer' to '--ignore-referrer'. Fixed Fixed a potential division by zero. Fixed Fixed inability to parse IPv6 when using a 'CADDY' log format. Fixed Fixed issue where a 'BSD' OS could be displayed as Linux with certain user-agents. Fixed Fixed memory leak when a JSON value contained an empty string (e.g., JSON/CADDY format). Fixed Fixed possible buffer overflow on a WS packet coming from the browser. Refactored Refactored a substantial part of the storage codebase for upcoming filtering/search capabilities (issue #117). Refactored Refactored DB storage to minimize memory consumption up to '35%'. Updated Updated default 'AWS Elastic Load Balancing' log format. Updated Updated German translation. Updated Updated page size to 24 on the HTML report. Updated Updated UNIX OS categories. Release 1.4.6 Sunday, February 28, 2021 Added Added additional feed reader clients. Added Added additional browsers and bots to the main list. Added Added command line option '--unknowns-log' to log unknown browsers and OSs. Added Added 'Referer' to the pre-defined 'Caddy JSON' log format. Added Added support for real-time piping as non-root user. Added Added the ability to Handle case when IPv4 is encoded as IPv6 in GeoIP1/legacy. Ensure Ensure we capture linux (lowercase) when extracting an OS. Fixed Fixed a regression in parsing Google Cloud Storage or possibly other non-JSON formats. Fixed Fixed inability to parse escaped formats. Fixed Fixed issue when using '%s' with 'strptime(3)' under musl libc. This addresses mostly the Docker image. Fixed Fixed possible buffer over-read for certain log-format patterns. Fixed Fixed segfault when attempting to process a malformed JSON string. Fixed Fixed segfault when setting an empty log-format from the TUI dialog. Fixed Fixed sorting on hits and visitors when larger than INT_MAX. Updated Updated CloudFront pre-defined log-format to reflect the latest fields. Updated Updated 'Dockerfile' image to use 'alpine:3.13' instead of edge due to compatibility issue with the GNU coreutils. Release 1.4.5 Tuesday, January 26, 2021 Fixed Fixed build issue due to initial declarations only allowed in C99 mode (e.g., CentOS7). Release 1.4.4 Monday, January 25, 2021 Added Added 'Caddy' to the list of pre-defined log formats. Added Added command line option '--no-strict-status' to disable status validation. Added Added native support to parse JSON logs. Added Added the ability to process timestamps in milliseconds using '%*'. Ensure Ensure TUI/CSV/HTML reports are able to output 'uint64_t' data. Ensure Ensure we allow UI render if the rate at which data is being read is greater than '8192' req/s. Ensure Ensure we don't re-render Term/HTML output if no data was read/piped. Fixed Fixed build co'''
