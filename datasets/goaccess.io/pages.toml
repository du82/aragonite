["https://goaccess.io/features"]
title = "GoAccess - Features"
description = "GoAccess is an open source real-time web log analyzer and interactive viewer that runs in a terminal in *nix systems or through your browser."
full_description = "Functionality at a Glance... Completely Real Time All panels and metrics are timed to be updated every 200 ms on the terminal output and every second on the HTML output. Nearly All Web Log Formats GoAccess allows any custom log format string. Predefined options include, Apache, Nginx, Amazon S3, Elastic Load Balancing, CloudFront, etc Track Application Response Time Track the time taken to serve the request. Extremely useful if you want to track pages that are slowing down your site. Incremental Log Processing Need data persistence? GoAccess has the ability to process logs incrementally through the on-disk B+Tree database. Only one dependency GoAccess is written in C. To run it, you only need ncurses as a dependency. That's it. It even features its own RFC6455 compliant Web Socket server. Minimal configuration needed You can just run it against your access log file, pick the log format and let GoAccess parse the access log and show you the stats. Visitors Determine the amount of hits, visitors, bandwidth, and metrics for slowest running requests by the hour, or date. Metrics per Virtual Host Have multiple Virtual Hosts (Server Blocks)? A panel that displays which virtual host is consuming most of the web server resources. Color Scheme Customizable Tailor GoAccess to suit your own color taste/schemes. Either through the terminal, or by simply updating the stylesheet on the HTML output. Real-time log analysis through a Dashboard in multiple output formats A beautiful terminal dashboard By default, GoAccess outputs to a terminal in real time. GoAccess' dashboard gives you an overview of server metrics by displaying summaries of different reports as panels on a single scrollable view. Prefer a real-time HTML report than the terminal? Apart from the terminal output, GoAccess allows you to generate HTML, JSON, or CSV reports. You can even email the HTML file since it is composed of a single file with no external file dependencies, how neat is that! Check out the Live Demo. Spot aggressive hosts/bots Spotting aggressive crawlers/bots and identifying who's eating your bandwidth is easy with the host panel. It also features the ability to display a list of user agents per each host. Easy to navigate panels The dashboard is composed of different reports — report panels can be expanded for more information so you can quickly check the correlations between different reports."
