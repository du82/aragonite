["https://gobyexample.com/json"]
title = "Go by Example: JSON"
full_description = "Go offers built-in support for JSON encoding and decoding, including to and from built-in and custom data types. Only exported fields will be encoded/decoded in JSON. Fields must start with capital letters to be exported. First we’ll look at encoding basic data types to JSON strings. Here are some examples for atomic values. The JSON package can automatically encode your custom data types. It will only include exported fields in the encoded output and will by default use those names as the JSON keys. You can use tags on struct field declarations to customize the encoded JSON key names. Check the definition of response2 above to see an example of such tags. Now let’s look at decoding JSON data into Go values. Here’s an example for a generic data structure. We need to provide a variable where the JSON package can put the decoded data. This map[string]interface{} will hold a map of strings to arbitrary data types. In order to use the values in the decoded map, we’ll need to convert them to their appropriate type. For example here we convert the value in num to the expected float64 type. We can also decode JSON into custom data types. This has the advantages of adding additional type-safety to our programs and eliminating the need for type assertions when accessing the decoded data. In the examples above we always used bytes and strings as intermediates between the data and JSON representation on standard out. We can also stream JSON encodings directly to os.Writers like os.Stdout or even HTTP response bodies. We’ve covered the basic of JSON in Go here, but check out the JSON and Go blog post and JSON package docs for more."
