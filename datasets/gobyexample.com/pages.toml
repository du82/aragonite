["https://gobyexample.com/string-formatting"]
title = "Go by Example: String Formatting"
full_description = "Go offers excellent support for string formatting in the printf tradition. Here are some examples of common string formatting tasks. Go offers several printing “verbs” designed to format general Go values. For example, this prints an instance of our point struct. The %#v variant prints a Go syntax representation of the value, i.e. the source code snippet that would produce that value. As with integers seen earlier, %x renders the string in base-16, with two output characters per byte of input. When formatting numbers you will often want to control the width and precision of the resulting figure. To specify the width of an integer, use a number after the % in the verb. By default the result will be right-justified and padded with spaces. You can also specify the width of printed floats, though usually you’ll also want to restrict the decimal precision at the same time with the width.precision syntax. You may also want to control width when formatting strings, especially to ensure that they align in table-like output. For basic right-justified width. So far we’ve seen Printf, which prints the formatted string to os.Stdout. Sprintf formats and returns a string without printing it anywhere."
