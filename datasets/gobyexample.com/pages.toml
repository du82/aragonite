["https://gobyexample.com/stateful-goroutines"]
title = "Go by Example: Stateful Goroutines"
full_description = "In the previous example we used explicit locking with mutexes to synchronize access to shared state across multiple goroutines. Another option is to use the built-in synchronization features of goroutines and channels to achieve the same result. This channel-based approach aligns with Go’s ideas of sharing memory by communicating and having each piece of data owned by exactly 1 goroutine. In this example our state will be owned by a single goroutine. This will guarantee that the data is never corrupted with concurrent access. In order to read or write that state, other goroutines will send messages to the owning goroutine and receive corresponding replies. These readOp and writeOp structs encapsulate those requests and a way for the owning goroutine to respond. The reads and writes channels will be used by other goroutines to issue read and write requests, respectively. Here is the goroutine that owns the state, which is a map as in the previous example but now private to the stateful goroutine. This goroutine repeatedly selects on the reads and writes channels, responding to requests as they arrive. A response is executed by first performing the requested operation and then sending a value on the response channel resp to indicate success (and the desired value in the case of reads). This starts 100 goroutines to issue reads to the state-owning goroutine via the reads channel. Each read requires constructing a readOp, sending it over the reads channel, and then receiving the result over the provided resp channel. Running our program shows that the goroutine-based state management example completes about 80,000 total operations. For this particular case the goroutine-based approach was a bit more involved than the mutex-based one. It might be useful in certain cases though, for example where you have other channels involved or when managing multiple such mutexes would be error-prone. You should use whichever approach feels most natural, especially with respect to understanding the correctness of your program."
year_published = 2025
clearnet = "https://gobyexample.com/stateful-goroutines"
tags = ["example:", "goroutines", "stateful"]
language = "en"
internal-references = ["none"]
external-references = ["12factor.net", "eli.thegreenplace.net", "en.wikipedia.org", "github.com", "go.dev", "markmcgranaghan.com", "pkg.go.dev", "research.swtch.com"]

