["https://gobyexample.com/regular-expressions"]
title = "Go by Example: Regular Expressions"
full_description = "Go offers built-in support for regular expressions. Here are some examples of common regexp-related tasks in Go. Above we used a string pattern directly, but for other regexp tasks you’ll need to Compile an optimized Regexp struct. This also finds the first match but returns the start and end indexes for the match instead of the matching text. The Submatch variants include information about both the whole-pattern matches and the submatches within those matches. For example this will return information for both p([a-z]+)ch and ([a-z]+). The All variants of these functions apply to all matches in the input, not just the first. For example to find all matches for a regexp. Providing a non-negative integer as the second argument to these functions will limit the number of matches. Our examples above had string arguments and used names like MatchString. We can also provide []byte arguments and drop String from the function name. When creating global variables with regular expressions you can use the MustCompile variation of Compile. MustCompile panics instead of returning an error, which makes it safer to use for global variables."
