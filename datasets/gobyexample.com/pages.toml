["https://gobyexample.com/strings-and-runes"]
title = "Go by Example: Strings and Runes"
full_description = "A Go string is a read-only slice of bytes. The language and the standard library treat strings specially - as containers of text encoded in UTF-8. In other languages, strings are made of “characters”. In Go, the concept of a character is called a rune - it’s an integer that represents a Unicode code point. This Go blog post is a good introduction to the topic. s is a string assigned a literal value representing the word “hello” in the Thai language. Go string literals are UTF-8 encoded text. Indexing into a string produces the raw byte values at each index. This loop generates the hex values of all the bytes that constitute the code points in s. To count how many runes are in a string, we can use the utf8 package. Note that the run-time of RuneCountInString depends on the size of the string, because it has to decode each UTF-8 rune sequentially. Some Thai characters are represented by UTF-8 code points that can span multiple bytes, so the result of this count may be surprising. Values enclosed in single quotes are rune literals. We can compare a rune value to a rune literal directly."
year_published = 2025
clearnet = "https://gobyexample.com/strings-and-runes"
tags = ["example:", "runes", "strings"]
