["https://gobyexample.com/signals"]
title = "Go by Example: Signals"
full_description = "Sometimes we’d like our Go programs to intelligently handle Unix signals. For example, we might want a server to gracefully shutdown when it receives a SIGTERM, or a command-line tool to stop processing input if it receives a SIGINT. Here’s how to handle signals in Go with channels. Go signal notification works by sending os.Signal values on a channel. We’ll create a channel to receive these notifications. Note that this channel should be buffered. We could receive from sigs here in the main function, but let’s see how this could also be done in a separate goroutine, to demonstrate a more realistic scenario of graceful shutdown. This goroutine executes a blocking receive for signals. When it gets one it’ll print it out and then notify the program that it can finish. The program will wait here until it gets the expected signal (as indicated by the goroutine above sending a value on done) and then exit. When we run this program it will block waiting for a signal. By typing ctrl-C (which the terminal shows as ^C) we can send a SIGINT signal, causing the program to print interrupt and then exit."
