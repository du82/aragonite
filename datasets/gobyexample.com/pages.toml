["https://gobyexample.com/command-line-flags"]
title = "Go by Example: Command-Line Flags"
full_description = 'Command-line flags are a common way to specify options for command-line programs. For example, in wc -l the -l is a command-line flag. Go provides a flag package supporting basic command-line flag parsing. We’ll use this package to implement our example command-line program. Basic flag declarations are available for string, integer, and boolean options. Here we declare a string flag word with a default value "foo" and a short description. This flag.String function returns a string pointer (not a string value); we’ll see how to use this pointer below. It’s also possible to declare an option that uses an existing var declared elsewhere in the program. Note that we need to pass in a pointer to the flag declaration function. Here we’ll just dump out the parsed options and any trailing positional arguments. Note that we need to dereference the pointers with e.g. *wordPtr to get the actual option values. To experiment with the command-line flags program it’s best to first compile it and then run the resulting binary directly. Note that the flag package requires all flags to appear before positional arguments (otherwise the flags will be interpreted as positional arguments). If you provide a flag that wasn’t specified to the flag package, the program will print an error message and show the help text again.'
year_published = 2025
