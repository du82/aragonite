["https://gobyexample.com/rate-limiting"]
title = "Go by Example: Rate Limiting"
full_description = "Rate limiting is an important mechanism for controlling resource utilization and maintaining quality of service. Go elegantly supports rate limiting with goroutines, channels, and tickers. First we’ll look at basic rate limiting. Suppose we want to limit our handling of incoming requests. We’ll serve these requests off a channel of the same name. This limiter channel will receive a value every 200 milliseconds. This is the regulator in our rate limiting scheme. By blocking on a receive from the limiter channel before serving each request, we limit ourselves to 1 request every 200 milliseconds. We may want to allow short bursts of requests in our rate limiting scheme while preserving the overall rate limit. We can accomplish this by buffering our limiter channel. This burstyLimiter channel will allow bursts of up to 3 events. Now simulate 5 more incoming requests. The first 3 of these will benefit from the burst capability of burstyLimiter. Running our program we see the first batch of requests handled once every ~200 milliseconds as desired. For the second batch of requests we serve the first 3 immediately because of the burstable rate limiting, then serve the remaining 2 with ~200ms delays each."
year_published = 2025
clearnet = "https://gobyexample.com/rate-limiting"
tags = ["example:", "limiting", "rate"]
language = "en"
