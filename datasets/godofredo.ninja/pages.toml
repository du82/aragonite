["https://godofredo.ninja/en-el-2020-aprende-a-cuidarte-y-amarte-a-ti-mismo"]
title = "En el 2020, aprende a cuidarte y amarte a ti mismo"
description = "Todavía me estoy recuperando de lo que me hiciste. Pero todavía estoy aliviandocada momento de nuestra vida juntos en mis sueños. Todavía te veo por la noche.Tan vivamente como mis ojos pueden ver. Todavía siento un dolor enorme en mipecho. Todavía siento tu presencia como si estuvieras a mi lado…"
full_description = "Estilo de Vida En el 2020, aprende a cuidarte y amarte a ti mismo GodoFredo 21 dic. 2019 · 3 min de lectura (adsbygoogle = window.adsbygoogle || []).push({}); En el 2020, elimina la negatividad de tu vida ― No dejes que las personas toxicas agoten tu energía y te quiten la felicidad. No dejes que las personas egoístas y manipuladoras se aprovechen de tu amabilidad. No dejes que las personas que ni siquiera merecen un segundo de tu atención jueguen con tus sentimientos. No toleres la inmadurez y la negatividad de nadie.En el 2020, deja de lado cualquier relación falsa ― No te engañes pensando que dejar ir a alguien que te ha hecho daño es un signo de debilidad. Porque no lo es. De hecho, es una señal de fuerza, madurez y autoestima. Entonces, en el 2020, no pierdas tu tiempo tratando de arreglar relaciones que no se pueden arreglar. No te aferres a personas a las que no les podrías importar. Personas que podrían romper tu corazón en un abrir y cerrar de ojos. En vez de eso, aléjate de ellos. Déjalos ir para siempre.En el 2020, preste atención a las relaciones que brindan una sensación de satisfacción, paz y felicidad en tu vida ― Concéntrate en las cosas que llenan tu corazón de alegría y emoción. Presta atención a las pasiones que te hacen sentir vivo. No te preocupes por los problemas y las cosas que no te conciernen. No pierdas tu tiempo en cosas sin importancia. En vez de eso, úsalo sabiamente.Photo by Anneliese Phillips / UnsplashEn el 2020, Cuida tu Salud. Deja los malos hábitos ― Consume más alimentos saludables. Has ejercicio o sal a caminar todo los días por el parque de tu vecindario o el busque, respira aire fresco de la naturaleza. Cuando estés pasando por momentos difíciles, no te deprimas. No te guardes tus problemas. En cambio, compartalos con alguien a quien aprecias mucho. Busca el consejo de tus seres queridos, Deja que los que mas quieres alivien tus preocupaciones y te ayuden a resolver tus problemas y a seguir adelante con tu vida.Photo by dylan nolte / UnsplashEn el 2020, aprenda a practicar el autocuidado y el amor propio ― Aprende a tratarte con amabilidad, paciencia y compasión. Aprende a tratarte con respeto y dignidad. Aprende a aceptarte y amarte a ti mismo por lo que eres. Aprende a aceptar tus hábitos, caprichos, inseguridades y miedos. Siempre recuerda que tus debilidades e imperfecciones no definen quieres eres.Un día mi corazón te olvidará y encontraré lo que merezcoTodavía me estoy recuperando de lo que me hiciste. Pero todavía estoy aliviandocada momento de nuestra vida juntos en mis sueños. Todavía te veo por la noche.Tan vivamente como mis ojos pueden ver. Todavía siento un dolor enorme en mipecho. Todavía siento tu presencia como si estuvieras a mi lado…GodoFredoGodoFredoEn el 2020, sal de tu zona de confort. Encuentra el coraje para aventurarte en lo desconocido ― Haz cosas que nunca has hecho. Visita lugares donde nunca has estado. Amplía tus experiencias. Haz recuerdos inolvidables.Photo by Rana Sawalha / UnsplashEn el 2020, aprecie más a las personas que realmente se preocupan por ti y te aman ― Las personas que siempre están ahí para ti. Las personas que te han atrapado en las buenas y en las malas. Las personas que creen en ti incluso cuando tu no lo haces. Las personas que son cociente de tu valor. Las personas que hacen tu vida mas feliz, mas fácil y mas satisfactoria. La persona que nunca te haría daño y te rompería el corazón. Estilo de Vida Amor & Relación Viaje Fotografía Compartir: Artículo anterior Baby Yoda se transforma en ‘Joker’ de Joaquin Phoenix en una nueva obra de Arte Baby Yoda está vestido como el Joker de Joaquin Phoenix en nuevas ilustraciones para fanáticos de The Mandalorian. The Mandalorian — fue uno de los espectáculos Artículo siguiente El Remake de Resident Evil 3 esta mas orientado a la acción. El desarrollo esta casi terminado En una nueva entrevista publicada en Famitsu. Los productores Masao Kawada y Peter J.Fabiano, confirmó que el nuevo diseño de Jill Valentine ha sido"
