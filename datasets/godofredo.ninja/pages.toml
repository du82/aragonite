["https://godofredo.ninja/dejalo-ir-y-sigue-adelante-no-puedes-hacer-que-te-ame-al-amarlo-con-mas-fuerza"]
title = "Déjalo ir y sigue adelante:  No puedes hacer que te ame al amarlo más"
description = "― No puedo seguir haciendo esto. ― No puedo mentirme a mí mismo. Perdona si hago de cuenta que no te he perdido, me duele aceptar que ya no estéscon migo y no puedo dejar de pensar solo en ti, no se si algún día sabrás que tellevo con migo, la vida no tiene razón ni sentido y me puedo morir si n…"
full_description = "Amor & Relación Déjalo ir y sigue adelante: No puedes hacer que te ame al amarlo con más fuerza GodoFredo 4 mar. 2020 · 3 min de lectura (adsbygoogle = window.adsbygoogle || []).push({}); Cuando lo ves ?, lo único que te viene a la ? mente es el amor.— Amor puro, verdadero y eterno que todo lo consume.Porque así es como te sientes cuando estás cerca de él (ella). Libre y vulnerable.Pero la realidad es diferente. Y tú lo sabes. En el fondo eres consciente de esto. En el fondo sabes que tú eres el que más ama. Eres una persona que haría cualquier cosa para que esta relación funcione. Eres esa persona que ? lucha por esta relación.Y me hace pensar ? Realmente me desconcierta que te conformes con algo así. Un amor unidireccional. No me sorprende que aceptes menos de lo que te mereces.Pero lo haces de todos modos — porque crees que él (ella) puede cambiar. Crees que en el fondo, él (ella) siente algo por ti. Y que con el tiempo, estos sentimientos se desarrollarán y eventualmente te devolverá el amor que tan desesperadamente deseas. Y entonces, esperas. Eres paciente porque crees que él (ella) lo tiene en su interior. Que sólo necesita tiempo para llegar allí. Que aún no está listo para abrirse. Que probablemente ya está haciendo todo lo posible para mostrarte cómo se siente.Pero — ¿Alguna vez ha pensado en la posibilidad de que no sea la persona que usted cree que es? — ¿Alguna vez has pensado, aunque sea por un segundo, que tal vez nunca te ame?Sólo piénsalo ?. Conocemos a alguien, vemos algo en él (ella), nos enamoramos ? y de repente no hay nada más perfecto para nosotros que ellos. Estamos rodeados de arco iris, unicornios rosas, flores y abejas. Los fuegos artificiales explotan en el cielo y creemos que si amamos a alguien, deberían amarnos con la misma intensidad.— Bueno, aquí está la verdadNo todos los que conozcas podrán darte el amor que te mereces. Y por mucho que esto suene deprimente, por mucho que hiera tus sentimientos, es la verdad. Pero también es parte de la vida. Y lo único que puedes hacer al respecto es simplemente aceptarlo.Todavía pienso en ti a pesar que me prometí que no lo haría― No puedo seguir haciendo esto. ― No puedo mentirme a mí mismo. Perdona si hago de cuenta que no te he perdido, me duele aceptar que ya no estéscon migo y no puedo dejar de pensar solo en ti, no se si algún día sabrás que tellevo con migo, la vida no tiene razón ni sentido y me puedo morir si n…GodoFredoGodoFredoQuieres creer que este no es el caso contigo tampoco con él (ella) y crees que puede darte exactamente lo que necesitas, pero la verdad es más que obvia. Él (Ella) no es capaz de amarte. Y no puedes hacer nada para cambiar. No puedes obligarlo a enamorarse de ti amándolo más. No puedes hacer que te vea diferente dándole tu corazón ❤️ en una bandeja. Sé que es difícil aceptar esto y sé que es más fácil culparse a sí mismo en su lugar. Debes convencerte a ti mismo de que no eres suficiente para él (ella) o que no puedes darle lo que necesita. Pero eso no está cerca de la verdad y lo sabes.Eres más que suficiente. Él (Ella) simplemente no es el indicado(a) para ti.— Entonces, déjalo ir...Sí, justo así — Deja la idea de que tu amor puede cambiar a esta persona y sigue adelante. No eres tú. Nunca has sido tú. Es él (ella). Él (Ella) no puede ser lo que tú necesitas que sea, y está bien. No debería. No estaba destinado a estar juntos. No importa cuánto trataste de hacer que funcionara e ir en contra del destino, al final, la verdad siempre sale a la luz.— Entonces, déjalo ir...En lugar de intentar cambiarlo y hacer que te ame, concéntrate en tu bienestar y enamorate de ti mismo. Toma todo el amor que le diste con tanto amor y derramalo en ti. Alimenta tu corazón, alimenta tu alma. Recuerda lo que te hace sentir vivo.Lo que está destinado a ti llegará a tu vida. Amor & Relación Estilo de Vida LOVE Viaje Compartir: Artículo anterior Cómo configurar redes en KDE Plasma La configuración de una dirección IP estática con el Administrador de redes de KDE Plasma es bastante sencillo. Esto es una buena forma de obtener Artículo siguiente Por qué Dios te permite enamorarte de una persona y luego se lo lleva La gente a menudo me dice cuando amas a alguien no puedes explicar por qué lo amas. Es un sentimiento que va más allá de"
