["https://godofredo.ninja/cuando-dos-personas-se-aman-pero-no-pueden-estar-juntas"]
title = "Cuando dos personas se aman, pero no pueden estar juntas"
description = "Nos amamos, pero no podemos estar juntos. Puedes amar a alguien desde el fondo de tu corazón y aun así no tener la oportunidad de estar juntas."
full_description = 'Amor & Relación Cuando dos personas se aman, pero no pueden estar juntas GodoFredo 10 may. 2022 · 5 min de lectura Compartir: (adsbygoogle = window.adsbygoogle || []).push({}); Nos amamos, pero no podemos estar juntos.El amor es la fuerza más vigorosa del universo. Es un proceso mágico de transformar una piedra en oro. Es el sentimiento más sublime, pero tiene el poder de destruirnos en cualquier momento.Es aterrador como algo tan cercano a la perfección, como un sentimiento tan puro y magnifico, puede convertirnos en la persona más feliz de la Tierra o en la persona más miserable del universo.Naturalmente, cuando pienso por primera vez en el amor, todo lo que me viene a la mente es un cuento de hadas sobre dos personas destinadas a encontrarse en la vida. Visualizo un breve segundo cuando sus almas se conectan.Visualizo el comienzo de algo increíblemente profundo. Una conexión pura y única.Sin embargo, el amor no siempre es un cuento de hadas. No es que no exista, es solo que no todos tenemos la bendición de experimentarlo.Y así es exactamente como algunas personas descubren el lado feo y oscuro del amor.El dolor de amar tan intensamente, pero no poder disfrutar de ese amor con la otra persona. La insoportable sensación de amar a alguien con quien nunca podrás estar.— Sé que no podemos estar juntos, pero te amo.El tipo de amor que no se manifiesta como un hermoso y nuevo comienzo. Pero, en cambio, un tipo de amor que probablemente terminará mucho antes de empezar, o en algunos casos un amor que nunca podrá ser correspondido.Puedes amar a alguien desde el fondo de tu corazón y aun así no tener la oportunidad de estar juntas. Puedes entregar tu alma y darle una parte de ti mismo, y no tener la oportunidad de estar con esa persona.— Porque la triste verdad es que, a veces, el amor no es suficiente.A pesar de toda su pureza, a pesar de todas las promesas, no podemos estar juntosLlega un momento en el que te das cuenta de que todos los cuentos de hadas, todas las historias o películas románticas que has escuchado o visto, son inventadas. Esa magia que muestran no nos ocurre en un abrir y cerrar de ojos.Tenemos que trabajar para lograrlo. Y a veces tenemos que trabajar duro para conseguirlo.Todos somos seres únicos con diferentes rasgos y creencias. El enamoramiento al principio puede hacer que nos enamoremos de los defectos y peculiaridades de una persona, o hacernos pensar que la amamos, cuando en realidad sólo hemos llegado a aceptarlo.Desafortunadamente, vivimos en un mundo basado en la racionalidad y la lógica pura. Y, el amor como lo conocemos, es un sentimiento irracional.Por lo tanto, es solo cuestión de tiempo hasta que la sensación irracional se desvanezca y la realidad golpee.Cuando la realidad nos golpea, empezamos a ver cómo es realmente. Nos damos cuenta de que los defectos que creíamos que nos gustaban, son en realidad cosas que nos molestan.La cuestión es que nunca vas a encontrar a alguien que sea 100% compatible contigo. Y el amor no siempre será una venda rápido para las cosas que no funcionan. Lo único que podrás hacer es comprometerte.Y, comprometerse siempre es una elección. O bien aceptas el compromiso para que funcione, o bien rompes el compromiso.Lo intentas, y lo intentas, y lo intentas, pero cuando algo no te conviene, los compromisos se vuelven inútiles.Hay muchas razones por la que las personas que se aman no pueden estar juntas. Depende de nosotros que seamos lo suficientemente valientes y decididos para aceptar el inquietante pasado y los errores que cometieron nuestras parejas.Cada vez con más frecuencia, las parejas mantienen relaciones a distancia que empiezan siendo intensas y se desvanecen poco a poco a medida que la realidad de la distancia se va imponiendo.Este tipo de relación es especialmente común con las mejores aplicaciones de citas que se centran en las relaciones reales. Ayudan a muchos solteros solitarios a encontrar a su pareja, pero rara vez tienen en cuenta lo difícil que puede resultar estar separados con el paso del tiempo.Lo que una vez fue un viaje divertido y emocionante para conocer a tu pareja se convierte en una tarea en la que pasas horas en un automóvil o avión. Hay muchas cosas que facilitan el estar en una relación sólo por el hecho de vivir cerca.Amar a alguien, pero no poder estar junto a esa persona puede romperte el corazón. Porque quizás tenías sueños y planes con esa persona para casarte y formar una familia. Tener ese hogar plácido lleno de amor, comprensión y respeto el uno con el otro. Ser los mejores amigos y novios.He estado en situaciones como esa, situaciones en las que parecía imposible que nuestra relación funcionara, pero sé que no estábamos haciendo todo lo posible para que funcionara. Y decidimos tomar caminos separados porque no estábamos dispuestos a comprometernos.Una relación puede ser exitosa solo si ambos ponen de su parte. De lo contrario, es mejor alejarse y encontrar a alguien que esté a tu lado en las buenas y en las malas. Alguien que te aprecie, te respete y te ame con el cariño que te mereces.Nos amamos, pero no podemos estar juntos...Cuando se aman, pero no pueden estar juntos, puede doler como el infierno. Te hará cuestionar todo. Incluso puedes comenzar a obsesionarte y abrumar tu mente con preguntas como: "¿Por qué no podemos estar juntos?" "¿Qué estoy haciendo mal?" "¿Por qué el amor que nos tenemos no es suficiente?" y así sucesivamente.Me he dado cuenta, cuando entro en ese estado de una montaña rusa emocional, me ayudo a mí mismo dejando salir mis emociones y luego controlarlos. Porque cuando estoy en un estado de enfado y tristeza, no puedo pensar racionalmente. Así que, primero, debo dejar salir todas esas emociones para poder ver las cosas con más claridad.Cuando todas mis emociones están al descubierto, cuando me tomé el tiempo que necesitaba para sanar, entonces miro la situación como lo que es. Porque la cuestión es que no me lo creo. No creo cuando alguien dice "Nos amamos, pero no podemos estar juntos".Por supuesto, podría haber numerosos obstáculos en el camino, como que una persona o ambas estén casadas, o que la relación sea a larga distancia. No estoy hablando de esas situaciones. Estoy hablando de cuando dos personas se aman, pero no pueden estar juntas a pesar de que los "obstáculos" que tienen son menores y pueden superar fácilmente. Eso no es amor en mi opinión.Las relaciones a distancia son difíciles. Sin embargo, no son imposibles. Puedes hacer que funcionen. Si se aman, la idea de no estar juntos será difícil y harán todo lo posible para que funcione, incluso a distancia.Además, en esta época de teléfonos móviles, Internet y todo tipo de aplicaciones para estar en contacto, puedes hacer que funcione fácilmente. Pueden comunicarse a diario, realizar videollamadas y hacer que la distancia entre ustedes sea menos perturbadora.📷 por Ayram Perez Amor & Relación LOVE Estilo de Vida Compartir: Artículo anterior Como obtener al padre de un elemento con vanilla JS Hoy vamos a ver dos formas para obtener al padre de un elemento con vanilla JavaScript. La propiedad parentNode Cada elemento del DOM tiene una Artículo siguiente Como crear una foto de perfil muy artístico y caricatura con New Profile Pic Las redes sociales se han inundado recientemente de fotos creadas con la aplicación New Profile Pic. Pero, ¿qué es la app y cómo se utiliza?'
