["https://godofredo.ninja/cuando-tu-pareja-desaparece-de-tu-vida-sin-darte-una-explicacion"]
title = "Cuando tu pareja desaparece de tu vida sin darte una explicación"
description = "Un millón de posibles razones están pasando por tu mente mientras tratas de explicarte porque tu pareja desaprecio de tu vida sin darte una explicación"
full_description = '''Amor & Relación Cuando tu pareja desaparece de tu vida sin darte una explicación GodoFredo 14 may. 2019 · 2 min de lectura (adsbygoogle = window.adsbygoogle || []).push({}); Cuando te enfrentas al final de una relación o incluso a una "situación" que tuviste con tu pareja cuando se veían regularmente pero sin el compromiso, te quedas preguntándote por qué. ¿Quieres saber por qué rompieron?. ¿Por qué de repente 'desapareció' de tu vida?.Un millón de posibles razones están pasando por tu mente mientras tratas de averiguar las razones por las que alguien haría algo así. Estás tentado a preguntarles acerca de sus sentimientos, intenciones, todo lo que querías preguntarles pero no tuviste la oportunidad de hacerlo... Sin embargo, después de algún tiempo, todo se reduce a una pregunta esencial — ¿Qué demonios ha pasado?A menudo, ya sabes la respuesta. Viste una foto de ellos con otra persona y tu descubriste que están en una relación. Aunque este conocimiento puede herirte profundamente, será suficiente para que encuentres la explicación que necesitas y sigas adelante con tu vida porque te darás cuenta de que tú también mereces encontrar tu felicidad.¿Pero qué pasa cuando no consigues esas cosas? ¿Qué pasa cuando te bloquean de todas partes y desaparecen de tu vida de la nada sin ninguna explicación?Cuando alguien te excluye completamente de su vida, se lleva todas las respuestas y te quedas sin nada. Le quitan toda la verdad no hablada sin darle la oportunidad de explicarle o contarle su parte de la historia. Y eso no es justo.Cuando tu pareja te bloquea y no te da una explicación, es una respuesta natural estar enojado con ellos. Tienes todo el derecho a estar enojado con ellos porque en lugar de tener una conversación honesta contigo, que es lo más maduro que se puede hacer, te han fantaseado.Sé cómo te sientes. Yo he estado allí. No hay nada más doloroso y devastador que tener a alguien que amas y de repente `desaparece' de tu vida. El dolor es real y deja cicatrices.Pero quiero recordarte lo que vales. Ningún 'fantasma' merece tus lágrimas. Deja de preguntarte si volverán. No son dignos de estar en tu vida. Punto final.Mereces estar con alguien que sea digno de confianza y honesta. Alguien que sea transparente contigo desde el primer día. Tu no eres un juguete que alguien puede abandonar cuando termina de jugar.Que este sea tu final. Y sigue adelante con tu vida. Amor & Relación Compartir: Artículo anterior "Game of Thrones" 8x05: 7 momentos impactantes de 'Las Campanas' El episodio cinco de la última temporada del "Juego de Tronos" fue una carnicería de principio a fin. Después del episodio de la semana pasada, Artículo siguiente Te extraño y no puedo olvidarte, pero entiendo por qué ya no estamos juntos Sera un sueño, que te perdí, que de verdad ya no te tengo. Cuanto quisiera cerrar mis ojos y empezar de nuevo, podre olvidar aquel'''
