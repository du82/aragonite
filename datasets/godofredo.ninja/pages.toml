title = "Por qué Dios te permite enamorarte de una persona y luego se lo lleva"
description = "Cuando la gente se aleja de ti, déjalos ir. Tu destino nunca está atado a nadie. Cada persona que ha entrado en mi vida ha venido por una razón"
full_description = 'Amor & Relación Por qué Dios te permite enamorarte de una persona y luego se lo lleva GodoFredo 11 mar. 2020 · 2 min de lectura (adsbygoogle = window.adsbygoogle || []).push({}); La gente a menudo me dice cuando amas a alguien no puedes explicar por qué lo amas. Es un sentimiento que va más allá de todo razonamiento y planificación. Rara vez planeamos enamorarnos. Simplemente lo hacemos, cuando conocemos a alguien especial con el que hacemos "click", ocurre una conexión y un vínculo instantáneo que se produce entre nuestras almas.A veces siento que Dios nos da estas conexiones del alma y nos hace conocer a ciertas personas las cuales se convertirse en una parte vital de nuestras vidas. Estas personas están destinadas a enseñarnos las lecciones mas valiosas sobre nosotros mismos y del mundo.Cuando miro atrás, cada persona que ha entrado en mi vida ha venido por una razón — para enseñarme algo y convertirme en la persona que soy hoy. La parte mas interesante es que estas personas no estaban destinadas a quedarse, solo estaban allí para cumplir su misión y luego irse.La mayoría de las veces, es la etapa de nuestra vida en la que determina el tipo de personas que se conectara con nosotros. Porque Dios siempre envía a las personas adecuadas en el momento oportuno. Quiere que crezcamos y seamos las mejores versiones de nosotros mismos — por eso aveces trae a personas desafiantes que tienen la intención de sacudirnos hasta el fondo y motivarnos a cambiar.Cuando la gente se aleja de ti, déjalos ir. Tu destino nunca está atado a nadie, Eso no significa que sean malas personas. Sólo significa que el camino de ellos ha terminado en tu historia.El problema es, cuando nos enamoramos de estas personas, olvidamos que solo son temporales y no queremos dejarlo ir. Entonces, tratamos desesperadamente de hacerlo parte de nuestra familia, a pesar de que han cumplido su misión y necesitan dejarnos. Simplemente no podemos entender por que Dios traería a alguien tan increíble a nuestras vidas y luego se llevaría a esa persona.Tal vez ese sea el punto. Quizás Dios nos está enseñando cómo dejarlo ir. Porque después de todo nada es eterno. Para que podamos aprender a desprendernos y aceptar que cierta historia ha terminado, tenemos que practicar el arte de dejar ir con gracia.Pero lo más importante es que Dios nos está enseñando a tener fe en que algún día conoceremos a alguien que será para siempre nuestra alma gemela.? Photo by Freestocks? Photo by Joseph Chan / Unsplash Amor & Relación Estilo de Vida Viaje Compartir: Artículo anterior Déjalo ir y sigue adelante: No puedes hacer que te ame al amarlo con más fuerza Cuando lo ves ?, lo único que te viene a la ? mente es el amor. — Amor puro, verdadero y eterno que todo lo consume. Porque así Artículo siguiente Por qué el miedo a COVID-19 resulta ser más mortal que el propio virus El Coronavirus ha cerrado el mundo. Mientras todos estamos escuchando las aterradoras noticias de muertes y nuevos casos en todo el mundo, es necesario seguir'
