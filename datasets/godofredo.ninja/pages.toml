Que salga este aviso no es lo que mas ilusión me hace. De hecho, no favorece
mucho la usabilidad que digamos... ¡Pero es que nos obligan! A"""
full_description = "Política de privacidad Lo siento. Mi página también es una de las millones de webs que utilizan cookies para analizar la navegación que haces como usuario.Que salga este aviso no es lo que mas ilusión me hace. De hecho, no favorece mucho la usabilidad que digamos... ¡Pero es que nos obligan! A nosotros y a casi todos.¿Qué son las cookies?Una Cookie es un archivo que se descarga en tu equipo (ordenador o dispositivo móvil) con el fin de almacenar datos que podrán ser actualizados y recuperados.La información recabada a través de las Cookies puede incluir la fecha y hora de visitas al Sitio Web, las páginas visitadas, el tiempo que has estado en nuestro Sitio Web y las acciones realizadas, así como los sitios visitados justo antes y después de la visita. Para conocer más información sobre las cookies, le invito a acceder al siguiente enlace.¿Para qué sirven las cookies?La utilización de las cookies tiene como finalidad exclusiva recordar las preferencias del usuario (idioma, país, inicio de sesión, características de su navegador, información de uso de nuestra Web, etc.)Recordando sus preferencias sabremos las características del ordenador que está usando y así podremos ofrecerle una mejor experiencia de navegación. Las cookies pueden ayudar a nuestro sitio Web a distinguir el navegador del usuario como visitante anterior y así guardar y recordar las preferencias que puedan haberse establecido mientras el usuario estaba navegando por el sitio, personalizar las páginas de inicio, identificar qué sectores de un sitio han sido visitados.Asimismo pueden ser utilizadas para obtener información acerca del tráfico dentro del propio sitio web y estimar el número de visitas realizadas.Normalmente los sitios Web utilizan las cookies para obtener información estadística sobre sus páginas Web. Tenga en cuenta que recogemos datos sobre sus movimientos y uso de nuestra Web como datos estadísticos, no personales.Tipos y finalidades de las cookiesA continuación se presenta una lista de las cookies que puede encontrar en nuestro sitio Web y una breve descripción de su finalidad. Le aseguramos que ninguna de ellas conserva información de identificación personal sobre usted. Algunas cookies personalizan su visita, otras recuerdan sus preferencias, mientras que otras solo nos proveen estadísticas de los visitantes.Cookies propias del sitioSon estrictamente necesarias, sirven para controlar tu sesión de usuario, preferencias y demás detalles del funcionamiento de la web. El sitio web no funcionará correctamente o no tendrás acceso al mismo si no permites al menos estas cookies.Cookies analíticasUtilizamos Google Analytics para conocer ciertos aspectos relacionados con las visitas a nuestra web, como origen, búsquedas, tiempo que permanecen en el sitio, páginas más visitadas, etc. No se incluye información personal, simplemente datos estadísticos de uso del sitio que nos permiten mejorarlo.Cookies de publicidadUtilizamos varias cookies para gestionar nuestra publicidad, esto nos ayuda a captar nuevos clientes, seguir creciendo y ofrecer un servicio de calidad y una cuenta gratuita. Las cookies que utilizamos son:– Doubleclick (Google, Inc.). Que nos ofrece información sobre los anuncios que han sido mostrados a un usuario, cuales han sido más efectivos y si ha llegado a nuestra web a través de ellos.Control de su información personalCuando el Usuario accede a nuestro Sitio Web y antes de comenzar la navegación, es advertido sobre el uso de Cookies de manera que puede prestar su consentimiento con relación a nuestra Política de privacidad en la ventana informativa. Durante el uso de nuestra página web aceptas y autorizas expresamente el uso de cookies, de acuerdo con nuestra política de privacidad.Sin embargo, ten en cuenta que, en la mayoría de los casos, eliminar o deshabilitar las Cookies podría afectar la funcionalidad de nuestro Sitio Web y limitarte el acceso a ciertas áreas o servicios ofrecidos a través del mismo.En cualquier momento usted puede restringir la recopilación o el uso de la información personal que es proporcionada a nuestro sitio web. Cada vez que se le solicite rellenar un formulario, como el de alta de usuario, puede marcar o desmarcar la opción de recibir información por correo electrónico. En caso de que haya marcado la opción de recibir nuestro boletín o publicidad usted puede cancelarla en cualquier momento.¿Cómo puedo deshabilitar y bloquear las Cookies?Podrás en cualquier momento deshabilitar las Cookies y continuar tu navegación. Podrás bloquearlas o deshabilitarlas activando la configuración de tu navegador, que te permite rechazar la instalación de todas las Cookies o de algunas de ellas. Algunos de los navegadores permiten advertir de la presencia de Cookies o rechazarlas automáticamente. Si las rechazas podrá seguir usando nuestro Sitio Web, aunque el uso de algunos de sus servicios podrá ser limitado y por tanto tu experiencia en nuestro Sitio Web menos satisfactoria.Para optar por no ser rastreados por Google Analytics en todas las páginas web, visita el siguiente enlace: https://tools.google.com/dlpage/gaoptout?hl=es.Para obtener más información sobre la forma de ajustar la configuración de las Cookies, según el navegador que utilices habitualmente, te recomendamos que visites los siguientes enlaces:Firefox: http://support.mozilla.org/es/kb/habilitar-y-deshabilitar-Cookies-que-los-sitios-weSafari: http://support.apple.com/kb/HT1677?viewlocale=es_ES/Google Chrome: https://support.google.com/chrome/answer/95647?hl=esMicrosoft Internet Explorer o Microsoft Edge: http://windows.microsoft.com/es-es/windows-vista/Block-or-allow-cookiesOtros navegadores Consulte la documentación del navegador que tenga instalado."
