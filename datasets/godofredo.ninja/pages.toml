["https://godofredo.ninja/querida-ex-gracias-por-romperme-el-corazon-y-recordarme-que-merezco-algo-mucho-mejor"]
title = "Querida Ex, gracias por romperme el corazón y recordarme que merezco algo mucho mejor"
description = """
Querida ex novia, compañera.
Lloré mucho tiempo después de que te fuiste. Tu partida me ayudó a ver las cosas con claridad por primera vez en mi vida"""
full_description = 'Amor & Relación Querida Ex, gracias por romperme el corazón y recordarme que merezco algo mucho mejor GodoFredo 19 ago. 2020 · 2 min de lectura Compartir: (adsbygoogle = window.adsbygoogle || []).push({}); Querida ex novia, compañera, amante…Lloré mucho tiempo después de que te fuiste. Sufrí y luché por arreglarlo todo. Cuando más necesitaba tu apoyo me sentí perdido, confundido y abandonado . Me sentí débil. Me sentí destrozado y vacío. Como si todo mi mundo fuera destruido. No tienes ni idea de cuánto me has herido. Usaste mi vulnerabilidad y mi amor para conseguir lo que querías y cuando te aburriste, me abandonaste. Te deshiciste de mí en un abrir y cerrar de ojos y destruiste todo lo bueno que compartimos como si no significaran nada para ti.En retrospectiva, tal vez fui yo quien vivió la ilusión de que teníamos algo por lo que valía la pena salvar y luchar. Quizás yo era el tonto que se enamoró y me arriesgué con mis sentimientos hacia ti. Tal vez yo era el tonto que se enamoro y tú solo estabas aprovechándome de mí.Me tratas mal...¿Pero sabes qué? Ha pasado mucho tiempo y ya no soy la misma persona que era entonces. Ya no soy ese niño ingenuo y herido con lágrimas en los ojos. He crecido y me doy cuenta de que el hecho de que me hicieras daño y me abandonaras sólo me hizo más fuerte. Esa angustia en ese momento, esa decepción, ese dolor que sentí fue en realidad lo mejor que me ha pasado.Sé que suena loco, pero gracias.Gracias. Gracias. Gracias. Un millón de veces más.Gracias desde el fondo de mi corazón.Gracias por lastimarme y tratarme mal. Gracias por dejarme como lo hiciste. Gracias por ser la razón detrás de mis lágrimas. Gracias por cada pequeña cosa que hiciste para quebrantarme.Realmente lo hiciste. Pero eso solo me ayudó a convertirme en la persona que soy hoy.Sin esa experiencia traumática y desgarradora, no me hubiera convertido en lo que soy ahora. Solo Dios sabe adonde me habría llevado mi camino si hubiera decidido quedarme a tu lado. Probablemente estaría ahí contigo fingiendo que nos amamos.Tu abandono me hizo entrar en razón.Y estoy verdaderamente agradecido por eso.Tu partida me ayudó a ver las cosas con claridad por primera vez en mi vida, me diste las respuestas que había pasado toda mi vida buscándolas.El amor existe. Pero siempre comienza con nosotros mismos.Entonces gracias por abrirme los ojos. Gracias por ayudarme a entender la naturaleza de algunas personas. Gracias por enseñarme las lecciones más importantes de la vida. Pero sobre todo, gracias por recordarme que merezco mucho más. Amor & Relación Compartir: Artículo anterior Un día tu amor reparará el corazón roto de alguien Puede que ahora mismo te sientas desesperado, pero esta bien. Quizás todo parezca blanco y negro, aburrido. pero está bien... Es sólo otro ciclo. Todo Artículo siguiente Aquí esta el trailer épico de "La Liga de la Justicia de Zack Snyder" Tuvimos que esperar años de angustia y rumores, para que se haga realidad. Ahora, podemos verlo en acción: porque finalmente, nuestra primera mirada adecuada a'
