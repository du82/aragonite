full_description = 'Pelicula Tráiler de "Army of the Dead" revela los zombis inteligentes y rápidos de Zack Snyder GodoFredo 13 abr. 2021 · 1 min de lectura Compartir: (adsbygoogle = window.adsbygoogle || []).push({}); Un nuevo tráiler de "Army of the Dead" de Zack Snyder muestra zombis evolucionados a los que se enfrenta una banda de mercenarios y ladrones. La película de Netflix será el primer proyecto de Snyder. El primer tráiler de Army of the Dead nos permitió echar un vistazo al mundo de Las Vegas postapocalíptico y una banda de mercenarios.Snyder ya dejó su huella en el género zombi con su debut como director del remake de Dawn of the Dead. Army of the Dead actuará como un sucesor espiritual de Dawn of the Dead más que como una secuela directa, está claro que los zombis de Snyder han evolucionado.Hiroyuki se muestra reclutando a Scott Ward (Dave Bautista) para una peligrosa misión en el desierto de Nevada. Muy pronto, la banda de mercenarios y ladrones se juntan y estarán listos para un gigantesco robo en una ciudad de Las Vegas infestada por zombies.Naturalmente, las cosas no van según lo planeado y en un giro da la sorpresa y se revela que los zombis que viven dentro de Las Vegas son altamente inteligentes y organizados. Son más peligrosos cuando se ponen contra los mercenarios y hará que sea aún más difícil para el grupo salir vivo de Las Vegas. Echa un vistazo al tráiler completo de Army of the Dead a continuación:la gran novedad del tráiler de Army of the Dead lo elevará sin duda por encima de la típica serie de zombis. Aunque los zombis evolucionados no son innovadores, se alejan de los zombis que Snyder representó en Dawn of the Dead y es una forma fácil de subir la apuesta sin cambiar demasiado. Queda por ver cómo se enfrentará el grupo de mercenarios a los zombis evolucionados, pero es casi seguro que no todos saldrán con vida. Pelicula Trailer Entretenimiento Actualidad Compartir: Artículo anterior ¿Cómo mejorar el romance en una relación? En una relación romántica debe existir la presencia del amor y el compañerismo. No hay romance si se aman pero no tienen la intención de Artículo siguiente Cómo abrir una imagen WebP en Photoshop WebP es un nuevo formato de archivo de imagen desarrollado por Google. La principal característica de este formato es que ofrece un tamaño de archivo'
