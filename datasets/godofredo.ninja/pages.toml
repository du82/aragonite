["https://godofredo.ninja/como-esta-cambiando-nuestra-forma-de-comunicarnos"]
title = "Cómo está cambiando nuestra forma de comunicarnos"
description = "Nuestra manera de interactuar está cambiando de manera sorprendente en los últimos años. Gran parte de la culpa la tienen internet y el mundo digital"
full_description = "Actualidad Cómo está cambiando nuestra forma de comunicarnos GodoFredo 23 mar. 2022 · 2 min de lectura Compartir: Nuestra manera de interactuar unos con otros está cambiando de manera sorprendente en los últimos años. Gran parte de la culpa la tienen internet y el mundo digital. Son muchos los que hoy prefieren conocer gente a través de chats online o Apps destinadas al mismo objetivo. Aunque parezca mentira, cantidad de nuevas amistades se crean cada día en el mundo online a través de juegos en línea como las tragamonedas online en Betsson. Pero dicha forma de comunicarnos presenta sus luces y sombras, como casi todo en la vida. En este artículo te contamos cuáles son las ventajas y desventajas de la comunicación online.VentajasAplicaciones como WhatsApp, Telegram o Facebook Messenger nos permiten poder comunicarnos con otros a través de una red interminable de mensajes. Dichas Apps no tienen costo alguno más allá de la cuota mensual de internet que tengas contratada. Esto es una gran ventaja, ya que los SMS costaban una cierta cantidad de dinero y no podías pasarte de un determinado número de caracteres.Otra de las grandes ventajas es que internet ha barrido por completo el concepto de presencialidad en la comunicación. Si quieres hablar con algún amigo o familiar, basta con sacar tu smartphone del bolsillo y escribir un mensaje de WhatsApp. Muchas personas atienden antes estos canales de comunicación que las llamadas telefónicas tradicionales.Además, la llegada de las tan famosas redes sociales nos ha permitido compartir ideas, fotos, vídeos y mucho más sin tener que salir de nuestra propia casa. También nos dan la oportunidad de conocer nuevas amistades o mantener las viejas. Por no hablar de la inmensidad de nuevos puestos de trabajo que han surgido a partir de ellas. Si mañana desapareciesen de nuestro mundo, sería muy difícil volver a retomar las comunicaciones como lo hacíamos hace un par de décadas.DesventajasInternet puede ser un arma de doble filo en muchas ocasiones. Y es que, estar expuestos a tanta cantidad de información, hace que seamos más vulnerables a las llamadas fake news. Tenemos que tener en cuenta que en la vida hay gente con malas intenciones cuya función es desorientarnos y llevarnos a su terreno, y en mundo onlinemás.Otra desventaja clara es no poder ver quién se esconde detrás de cada perfil en las redes sociales, ya que las imágenes y fotos de perfil pueden ser manipuladas con bastante facilidad. Hay que tener mucho cuidado con quien agregamos como contacto.Por último, internet puede favorecer al sedentarismo. Por eso es importante compatibilizar nuestro ocio y comunicación onlinecon las actividades físicas. En contra de lo que muchos piensan, ambos mundos pueden ser perfectamente compatibles. Todo está en dar un buen equilibrio a nuestra vida y trabajo.La forma en que nos comunicábamos hace un par de décadas ha cambiado de manera radical. Internet y las redes sociales han llegado para quedarse. Hoy podemos escribir infinidad de mensajes instantáneos a amigos y familiares sin necesidad de salir de casa. Esto tiene sus ventajas, pero también es bueno conocer las desventajas y saber evitarlas de la mejor manera. Actualidad Compartir: Artículo anterior Las 5 mejores consolas retro que siguen siendo relevantes hoy en día La gente suele creer que los videojuegos son un medio que siempre está avanzando. Se trata de la próxima gran cosa, la próxima generación de Artículo siguiente Popular Gaming Apps and Companies for Android Currently, mobile games are part of a weird culture. Most people refer to them as mobile games, while some call them games. There are even"
