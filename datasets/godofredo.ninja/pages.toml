["https://godofredo.ninja/te-extrano-y-no-puedo-olvidarte-pero-entiendo-por-que-ya-no-estamos-juntos"]
title = "Te extraño y no puedo olvidarte, pero entiendo por qué ya no estamos juntos"
description = "Como olvidar tu sonrisa, tus miradas, tus locuras, tus bonitos ojos y tu hermoso labio, como olvidar cuando bailabas para mi al escuchar tu música favorita."
full_description = 'Amor & Relación Te extraño y no puedo olvidarte, pero entiendo por qué ya no estamos juntos GodoFredo 17 may. 2019 · 3 min de lectura Compartir: (adsbygoogle = window.adsbygoogle || []).push({}); Sera un sueño, que te perdí, que de verdad ya no te tengo. Cuanto quisiera cerrar mis ojos y empezar de nuevo, podre olvidar aquel romance apasionado que tuvimos, sera posible decirte un día que por fin ya no te amo. Lo dudo mucho mi amor, si te digo que ya no te amo es como ver ha un puerquito poder volar.Pueden pasar 5 mil años, puedes besar otros labios, puedo morirme mañana, puede secarse mi alma, pueden borrar mi memoria, pueden robarme tu historia, pero nunca te olvidare.Como olvidar tu sonrisa, tus miradas, tus locuras, tus bonitos ojos y tu hermoso labio, como olvidar cuando bailabas para mi al escuchar tu música favorita, como olvidar verte cuando tu veías tus novelas y tus series favoritas, como olvidar cuando rezabas y pedías que nunca nos separemos. Puedes echarme de tu vida y negar que me querías, y aunque yo te deje de amar es imposible que te pueda olvidar.Si me enseñaste a amar, también enseñame a olvidar este amor que siento por ti, porque eres tu la mujer a quien yo amo y a quien quiero. Quien sanara este dolor que me dejaste en mi interior cuando te fuiste.Quien invento el amor debió dar instrucciones para evitar el sufrimiento.Hoy por ti yo ando sufriendo, aprendí a amar estando a tu lado, me enseñaste a querer, fuiste mi profesora en el amor y en tus clases de amor, no me enseñaste sobre lo doloroso que es perder.Cuando veo tu labio y las cosas que me regalaste y cuando estoy solo me hace recordarte. Sabes mi única meta fue viajar para estar a tu lado, pero hoy perdí la ilusión la esperanza de que vuelvas a mi.Quiero que sepas que nunca dejé de extrañarte. Nunca dejé de pensar en el tiempo que pasamos juntos.Eres alguien muy importante para mí. Alguien que me mostró cómo era la verdadera felicidad. Alguien que me mostró lo que significa el amor puro, profundo e incondicional. Alguien que cambió mi perspectiva de la vida. Y alguien que me ha convertido en la persona que soy hoy.— Sí, significas mucho para mí.Tuvimos una profunda conexión. Nos amábamos tan intenso y apasionadamente que me mentiría a mí mismo si dijera que no extraño lo que tuvimos.Sin embargo, sé que hay razones por las que ya no estamos juntos. Entiendo por qué ya no somos parte de nuestras vidas.Sé que teníamos un gran potencial para convertir nuestra relación en algo asombroso y duradero, pero no lo hicimos. En cambio, permitimos que otras cosas se interpusieran en nuestro camino. Permitimos que un mundo de excusas, promesas y dudas vacías se metieran en nuestra relación y nos separaran. Permitimos que otros sueños, otras prioridades y otras personas se interpusieran entre nosotros mientras estábamos parados tranquilamente allí, viendo nuestra relación morir lentamente y no haciendo nada para salvarlo.— No logramos proteger lo que teníamos.Porque en un momento, creí que iba a estar contigo para siempre. La que logró tocar mi alma de una manera que nadie más lo ha hecho. contigo tuve las conversaciones más inteligentes, emocionantes e inspiradoras. Con quien podía hablar de mis inseguridades y temores hasta altas horas de la noche. La que conocía todos mis secretos. La que me hizo sentir comprendido y apreciado.— Y al día siguiente, nos convertimos en extraños.Nuestra ruptura dejó un vacío en mí. Un vacío que todavía puedo sentir. Un vacío que todavía duele.Pero la vida continúa . Ambos seguimos adelante con nuestras vidas. La vida continúa incluso cuando sientes que todo tu mundo se ha derrumbado a tu alrededor.Ahora estoy en un camino diferente en mi vida, y para ser honesto, soy feliz. Las cosas me van bien y realmente creo que he encontrado la dirección correcta en mi vida.Sin embargo, todavía te extraño, Es curioso cuando me despierto todavía reviso mi Smartphone pensando que me enviaste un mensaje de texto, y cuando pasa algo bueno, quiero llamarte y contártelo. A veces siento que eres la única persona que puede entenderme y se necesita mucho valor para no mandarte un mensaje de texto o llamarte.Todavía me pregunto cómo estás y qué estás haciendo en la vida. Aunque me cuesta admitirlo, pero a menudo deseo que intentes comunicarte conmigo.No podemos cambiar lo que pasó, no luchamos para proteger lo que teníamos. No luchamos para salvar nuestra relación. Tal vez no dolería más si estuviéramos juntos.— Tal vez nunca estuvimos hechos para estar juntos.— Tal vez nunca estuvimos destinados a estar juntos como almas gemelas. Y lo que importa, al final, es que quiero lo mejor para ti: Que tengas una carrera exitosa, que seas feliz. Y realmente creo que quieres lo mismo para mí. Amor & Relación LOVE Estilo de Vida Compartir: Artículo anterior Cuando tu pareja desaparece de tu vida sin darte una explicación Cuando te enfrentas al final de una relación o incluso a una "situación" que tuviste con tu pareja cuando se veían regularmente pero sin el Artículo siguiente ¿Odias el nuevo diseño de Twitter? Con este truco puedes regresar a la version antigua Twitter ha rediseñado su sitio web para hacerlo más claro e introducir más temas de color. Sin embargo, para aquellos que prefieren el viejo aspecto'
