["https://godofredo.ninja/4-razones-por-las-que-los-padres-marcianos-son-superiores"]
title = "4 razones por las que los padres marcianos son superiores"
description = "Dos niños pequeños de color verde se persiguen en el suelo rojo y polvoriento de marte. Con sus antenas brillando, corren se caen y se vuelven a levantar."
full_description = "Estilo de Vida 4 razones por las que los padres marcianos son superiores GodoFredo 15 abr. 2021 · 2 min de lectura Compartir: (adsbygoogle = window.adsbygoogle || []).push({}); Dos niños pequeños de color verde se persiguen en el suelo rojo y polvoriento. Con sus antenas y sus cuernos brillando, corren, se caen y se vuelven a levantar. A sus padres no se logra ver por ningún lado. Los pequeños han sido independientes desde que salieron de sus huevos. Se necesita toda mi energía para no hacer bulla y no caerme en ese cráter gigante que está cerca de mi. Un visitante despistado podría considerar muy peligroso y arriesgado, para los que tienen tiempo viviendo en el planeta rojo saben que no debemos preocuparnos. Es solo un día normal en la vida de dos pequeños niños marcianos.En el año 2080, cuando los humanos agotaron todos los recursos naturales, se trasladaron a otros planetas del Sistema Solar, últimamente a Marte. Una vez allí, inmediatamente comenzaron una civilización, a pesar de las duras circunstancias, volvieron a ser prósperos. Cuando dejaron de preocuparse por la supervivencia dejó de ser un problema, buscamos otras culturas de las que apropiarnos. Así es como nos enamoramos de la paternidad alienígena. Resulta que los marcianos lo hacen mejor que tú en todos los sentidos, y esta es la razón.Equilibrio entre el trabajo y la vida personalUn día en Marte dura 24 horas y 40 minutos. Eso deja un extra de 40 minutos cada día para establecer vínculos familiares. A diferencia de muchos padres terrestres, que siempre están ocupados trabajando, los marcianos tienen tiempo para actividades recreativas como cavar, rodar desde los numerosos cráteres del planeta y cubrirse de baba.ResistenciaOlvídate de dejar que tus bebés duerman al aire libre o ponerlos trajes de nieve para que puedan jugar. Intenta hacerlo a 60 grados bajo cero, que es la temperatura media en Marte. Y no olvides las tormentas de polvo, que son de las más feroces de todo el sistema solar. Como dice un proverbio marciano, no hay mal tiempo, sólo exoesqueletos defectuosos.PacienciaComo un año en Marte dura aproximadamente el doble que en la Tierra, los niños marcianos tienen que ser muy pacientes cuando esperan su próximo cumpleaños. Además, también viven en el segundo planeta más pequeño del Sistema Solar, razón por la cual han aprendido a ser felices con menos. Una cría marciana jugará con cualquier cosa que encuentre: arena roja, placas de hielo o rocas.La comida no es para tirarlaAl salir del cascarón, las crías marcianas empiezan a buscar deliciosas bacterias escondidas en los numerosos cráteres del planeta. El hielo fresco y frío también es delicioso y muchos niños verdes y viscosos disfrutan lamiéndose. Como Marte no es rico en nutrientes, sus habitantes tienen que comer lo que se les pone delante o morir de hambre. Por ello, no son obesos.Si aún no eres padre como un marciano, entonces siento pena por ti y tus hijos. Yo mismo seguiré estos consejos hasta aburrirme y dirigir mis ojos hacia otras especies alienígenas para que me enseñen a criar mejor a mis hijos. Estilo de Vida Baby Yoda NASA Compartir: Artículo anterior Cómo abrir una imagen WebP en Photoshop WebP es un nuevo formato de archivo de imagen desarrollado por Google. La principal característica de este formato es que ofrece un tamaño de archivo Artículo siguiente Ya se conoce la fecha de lanzamiento de Rainbow six extraction Rainbow six extraction es el nuevo lanzamiento de Ubisoft. El 20 de enero del 2022 llegará el esperado videojuego al mercado. ¿Quieres saber más?"
