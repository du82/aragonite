["https://godofredo.ninja/cuando-las-personas-me-preguntan-porque-estoy-soltero-yo-les-respondo-soy-soltero-codiciado"]
title = 'Cuando me preguntan ¿Porque estoy soltero?  Respondo "Soy soltero codiciado"'
description = "― No puedo seguir haciendo esto. ― No puedo mentirme a mí mismo. Perdona si hago de cuenta que no te he perdido, me duele aceptar que ya no estéscon migo y no puedo dejar de pensar solo en ti, no se si algún día sabrás que tellevo con migo, la vida no tiene razón ni sentido y me puedo morir si n…"
full_description = 'Estilo de Vida Cuando las personas me preguntan ¿Porque estoy soltero? Yo les respondo "Soy soltero codiciado" GodoFredo 11 ene. 2020 · 3 min de lectura (adsbygoogle = window.adsbygoogle || []).push({}); "¿Por qué estás soltero?" "¿Cómo puede alguien tan inteligente y tan guapo seguir siendo soltero?" ?Estoy seguro que todos y cada uno de los hombres han escuchado estas preguntas. A menudo provienen de personas que ni siquiera nos conocen pero que se han dado el derecho de invadir nuestra privacidad. Estoy cansado de escuchar estas preguntas. Son estúpidos, inapropiados y de alguna manera crueles.Por eso, cada vez que alguien se atreve a preguntarme por qué estoy soltero, sonrío y simplemente respondo “Soy soltero codiciado”, “Me gusta la vida de soltero: no tengo que dar explicaciones a nadie y puedo salir cuando quiero”. Esto cierra sus bocas ?En realidad, estoy soltero porque ahora estoy trabajando en mis proyectos y en mí mismo. Me estoy enfocando en mi futuro y una relación es lo último que se me ocurre en este momento.Todavía pienso en ti a pesar que me prometí que no lo haría― No puedo seguir haciendo esto. ― No puedo mentirme a mí mismo. Perdona si hago de cuenta que no te he perdido, me duele aceptar que ya no estéscon migo y no puedo dejar de pensar solo en ti, no se si algún día sabrás que tellevo con migo, la vida no tiene razón ni sentido y me puedo morir si n…GodoFredoGodoFredoSoy feliz con mi vida de soltero — Me niego a ser presionado por la sociedad o por personas que piensan que sólo estando en una relación pueden ser verdaderamente felices. Eso es una tontería total.La verdadera felicidad viene del interior de uno mismo — Si no eres feliz contigo mismo, no creo que otra persona pueda entrar en tu vida y hacerte feliz. Pueden hacerlo por un corto período de tiempo, pero si no puedes encontrar la felicidad por ti mismo, siempre terminarás decepcionado y triste ?.Además, he estado en relaciones que me han agotado, que me han quitado la confianza y autoestima. Relaciones que me hicieron sentir como si no fuera nada. Que me destruyeron y me rompieron el corazón ?. Sí mi elección es otra relación tóxica o permanecer soltero, ¡me quedaré soltero para siempre!Es mejor permanecer soltero que conformarse con alguien que no te conviene sólo porque quieres tener una relación.— Las personas que sienten que les falta algo y no tienen a nadie en su vida son personas que no están completas. Estas personas deben aprender primero a amarse a sí mismos y a disfrutar de su propia compañía antes de decidirse a compartir su vida con otra persona.La alegría de la música de los videojuegosVuelvo una y otra vez a la música de los videojuegos cuando no se que escucharen un día cualquiera. La música es mi alma, y es raro para mi tener un momento sin ella. Cuando estoysolo, con mis amigos, limpiando mi cuarto, caminando, o haciendo cualquier cosa,pongo música — Escucho mucha música t…GodoFredoGodoFredoEste es mi punto de vista sobre las relaciones. Es por eso que disfruto de mi vida de soltero y lo aprovecho al máximo. Y si la persona adecuada entra en mi vida, entonces será maravilloso. Si no, mi vida no dejará de ser asombroso.Así que, soldado caído, gente de la FriendZone ?, No dejes caer tu autoestima tan bajo para entrar en una relación. Céntrate en ti mismo. Aprende a amarte a ti mismo y a tener confianza en ti mismo, para que seas un ? “Soltero Codiciado”— Confía en mí, la persona adecuada coincidirá con tu forma de pensar y tus gustos. Sera una persona completa como tú. Y ustedes dos tendrán una relación verdadera, amorosa y saludable. Algo que es raro hoy en día.? Buena Suerte — Estilo de Vida Amor & Relación Compartir: Artículo anterior La gente en Tailandia están utilizando toda su creatividad para realizar sus compras después de una nueva ley que prohíbe el uso de bolsas de plástico Tailandia prohibido el uso de plástico. Esta ley entro en vigencia el 1 de enero. Los compradores creativos trajeron carretillas, maletas, canastas, camisetas, redes de Artículo siguiente Cómo configurar redes en KDE Plasma La configuración de una dirección IP estática con el Administrador de redes de KDE Plasma es bastante sencillo. Esto es una buena forma de obtener'
