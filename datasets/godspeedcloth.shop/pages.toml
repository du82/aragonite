["https://godspeedcloth.shop/faqs"]
title = "FAQ’s - God Speed Clothing"
full_description = "How to place an order?Select the desired product and ADD TO CART. You can continue shopping or EDIT BAG and then Proceed to Checkout. At checkout, you can either log into your account, create an account or checkout as a guest. How fast will my order be processed – for domestic orders?We process all orders within 1-3 business days after the order is placed and as soon as your payment is verified. Business days are Mondays through Fridays, excluding holidays. Please note that we do not process, ship orders on Saturdays and Sundays or on US Federal Holidays. Orders placed on these days will be processed the following business day. Delivery is dependent on our carriers (USPS and DHL) and can be subject to weather delays. Orders may take longer than usual during sale seasons such as Black Friday, Cyber Monday, and others. How fast will my order be processed – for international orders?Orders placed on weekdays will be processed within 1-3 business days after the order is placed. Please note that we do not process, ship orders on Saturdays and Sundays or on Holidays. Business days are Mondays through Fridays, excluding holidays. International orders are subject to customs clearance, which may cause delays beyond provided delivery estimates. International orders are categorized as placed outside the US. All applicable custom fees, taxes and duties are the sole responsibility of the customer. Customs authorities require that we state the value of the order directly on your package. It is at the sole discretion of customs agents to release your package. If your order takes longer, please email us at support@godspeedcloth.shop. Can I cancel or change my order?We process and complete orders as quickly as possible. If you have any modification requests or need to cancel, please contact immediately after placing your order at support@godspeedcloth.shop. We cannot guarantee that we will be able to cancel or modify, but we will try our best to accommodate all requests. What to do if a product is sold out?For products that are sold out, please find the ‘notify me when available’ button on the product pages and add your e-mail address to the Waitlist. Once the product is back in stock, you will be notified via e-mail. What should I do if I entered an incorrect shipping address?Orders are processed as quickly as possible and for this reason we cannot guarantee any changes to your order once it has been submitted. If you accidentally entered an incorrect shipping address or the address is not in English characters, please contact us letting us know you need to update your address. Please include your full name, order number, and the correct shipping address. We will do our best to change the shipping address before it ships. If it does ship before we are able to fix the issue, please reply to our message when the tracking information states that it is being returned to the sender. As soon as we receive it, we will ship you out a new package for orders. Shipping fees will need to be paid again. I received my order and an item was damaged.If the product received is damaged, we can help. Please e-mail photos of the damaged products, a brief description of the damage, the order number to support@godspeedcloth.shop. We will follow-up with next steps as soon as possible. The items from my package are missing. What should I do?First, please check the package carefully. In most cases, the items might still be in the box. Before you get worried that some items are missing from your parcel, make sure you have thoroughly checked the packing materials. In some cases, some items are shipped separately and you would receive different tracking numbers if it is the case. Second, contact us If a product is missing, we can help. Please e-mail photos of the shipping label and the box with the items received, a brief description of the situation, the order number to support@godspeedcloth.shop. We will follow-up with next steps as soon as possible. You can tell us about your missing item within 14 days. If 14 days have gone by since you have received your purchase, unfortunately we can’t offer you a refund or reship. How is my credit card information saved?We do not store any of your credit card information on our website. We use Flutterwave Payments, a reputable and secure payment processor available, for processing all of our online transactions."
