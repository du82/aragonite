["https://gofundme.com/c/start/education-fundraising"]
title = "Start An Education Fundraiser - Online Education Fundraising"
description = "Start an education fundraiser for classroom supplies, tuition, field trips, and other education-related expenses with GoFundMe."
full_description = "Back to school season is here Start an Education Fundraiser on GoFundMe Teachers, students, parents, clubs, and more use GoFundMe as a trusted and easy way to raise money for education needs. Education fundraising is available for your classroom, tuition assistance, after school program, or school supplies. Start a GoFundMe Start a GoFundMe Everything you need to help your fundraiser succeed is here. Start fundraising on GoFundMe today How to start Tips Examples Resources Questions Why GoFundMe Start fundraising on GoFundMe Step 1 Our tools help create your fundraiser Click the ‘Start a GoFundMe’ button and answer a few questions to get started. You’ll add your fundraiser details and set your goal, but can always adjust these anytime. Step 2 Share your fundraiser link to reach donors Once live, share your fundraiser link with friends and family to start gaining momentum. You’ll also find helpful resources for running your fundraiser in your GoFundMe dashboard. Step 3 Securely receive the funds you raise Add your bank information to securely start receiving funds or invite your intended recipient to add theirs. You don’t need to reach your fundraising goal to receive your money. Start a GoFundMe Tips for your education fundraiser on GoFundMe More Tips Share your “why” Share your educational aspirations, the challenges you’re facing, and how the funds will help you achieve your goals. Be transparent and specific, when possible, about why you’re raising funds. Personal, relatable stories about what the funds you raise means to you will inspire people to contribute. Set a clear financial goal In your description, break down the costs, even estimates, you’re looking for help with. This could include tuition fees, school supplies, travel expenses for study abroad, or classroom resources. For example, your classroom supplies may be $300 and tuition $10,000. Share regularly Before sharing your fundraiser broadly, try asking three of your closest friends or family members to consider donating. This can help your fundraiser build momentum when you share with your larger community. Examples of education fundraisers on GoFundMe Help with tuition Classroom supplies Teacher power Help with tuition Luna is a grad student who accepted an offer from UC Berkeley to pursue a Ph.D. in Medical Anthropology. Being accepted into this program meant Luna had to relocate to California. Luna started a GoFundMe and turned to their community and chosen family for support. The GoFundMe surpassed its fundraising goal,… Read more $0 raised of $0 goal Classroom supplies Maria is a second-grade teacher at a small school in Texas. Entering her fifth year of teaching, Maria was assigned to a classroom that did not have a whiteboard in it for her to teach from. Her GoFundMe exceeded its fundraising goal, raising over $600 to not only help her buy a… Read more $0 raised of $0 goal Teacher power Three teachers at CES came together to raise money for their fourth-grade classrooms so that every student has the supplies they need for success. The supplies needed range from composition notebooks and 3-ring binders to pencil pouches/boxes and art supplies. Their GoFundMe has raised over $2,600 to help cover the cost of… Read more $0 raised of $0 goal Resources for education fundraising More Ideas Fundraising ideas for schools Fundraising for students Fundraising ideas for college Questions about education fundraising on GoFundMe More FAQs Can I start a GoFundMe for help with tuition? Yes, GoFundMe has been used by many students to help them in their education journey. We recommend listing how the funds you raise will be used to help potential donors understand how they are helping. I’m a teacher. Can I start a GoFundMe for my classroom expenses? Yes, you can fundraise for your classroom needs on GoFundMe. You can also nominate your fundraiser to receive a grant from GoFundMe.org’s Learning and Education fund here. How do I set up a fundraiser so that someone else receives the money? We recommend you first ask if the person you are fundraising for is comfortable with you starting the fundraiser. Once you set up the fundraiser, you can invite them to set up bank transfers so they will receive the money directly. Learn more about inviting the person you are fundraising for to receive funds. How long will it take to receive the money? The process of setting up and verifying transfers can take 3-7 business days or longer to complete. Then, once your first transfer is sent, it will take on average 2-5 business days for the funds to safely be deposited into the bank account on file. Can I upload videos to my fundraiser? Yes, one way you can consider using photos or videos is by adding one to a fundraiser update to easily thank everyone or engage with a progress update. Try these tips for using video in your fundraiser. How much of the money will I keep? One small transaction fee (2.9% + $0.30) is automatically deducted per donation—that’s it. Everything else goes directly to your cause. For more information and to estimate what you will receive, check out the GoFundMe pricing calculator. What details should I include in an education fundraiser? In your fundraiser, we recommend including as many details as you can about what you are fundraising for and how much you need to raise. For example, if you need help covering the cost of your textbooks, you can add up the average or projected costs of your books and include that in your fundraiser description. How do I invite team members to help me? If you are fundraising as part of a club or organization, adding team members can be a great way to help reach your goal. You can add team members to help you run the fundraiser after the fundraiser is set up. Visit this tips article for advice on using team members help your GoFundMe reach its goal. Why start an education fundraiser on GoFundMe? When people come together on GoFundMe to fund the potential of education, they are serving as a powerful ally for students, teachers, and communities in pursuit of academic goals and improvements. Whether you’re a student looking for help covering educational expenses, a teacher enriching your classroom with resources and development opportunities, or enabling communities to fund scholarships and school projects, GoFundMe harnesses the collective power of its community and technology. People care deeply about education, let them show how much they care by starting a fundraiser and providing a way for them to help you. Start a GoFundMe"
