full_description = "GoFundMe Cookie Policy .block_6bbaafd8fbd94ffc3dc96ebfe457acba { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_6bbaafd8fbd94ffc3dc96ebfe457acba { margin: 0px 0 50px 0 !important; } } Effective Date: September 1, 2024 This Cookie Policy (“Cookie Policy”) describes how GoFundMe Group Inc. and its affiliates and subsidiaries, including Classy, Inc., GoFundMe, Inc. and GoFundMe Ireland Ltd (collectively “GoFundMe,” “we,” “us,” or “our”) uses cookies and similar technologies when you interact with our websites, websites hosted by us on behalf of our non-profit clients and mobile apps (collectively, the “Sites”), and your choices regarding our use of cookies. We will refer to the cookies and other technologies identified here collectively as “Cookies” for purposes of this Cookie Policy. About Cookies A cookie is a small text file of letters and numbers stored on your browser or device. When you interact with the Sites, we try to make that experience simple and meaningful. Our Sites use Cookies to distinguish you from other visitors to our Sites. This helps us to provide you with website functionality, understand our visitors, and improve our Sites. When you visit our Sites, both first-party and third-party Cookies may be placed on your browser or device. First-party Cookies are those placed directly by us or from our website domain. Third-party Cookies are those placed by our vendors or partners, which may include social networking services. Both types of Cookies allow us or our vendors or partners to access information about your device and visit. We use both persistent Cookies and session Cookies. Persistent Cookies stay on your browser until they are deleted or expire. Session Cookies last until you close our Sites or browser. We use Cookies for the following purposes: Strictly Necessary or Essential Cookies. These are essential Cookies that are enabled by default because they are necessary to operate our Sites. They include, for example, Cookies that enable you to log in, complete forms, display our content, and make donations. They also enable us to identify and prevent security risks and comply with our legal obligations. Functional Cookies. These Cookies allow us to enable additional functionality (e.g., third-party video or audio), remember your settings and preferences (e.g., language or region), and customize or personalize your experience (e.g., greeting you or recommending content based on prior visits). Analytics Cookies. These Cookies allow us to recognize and count visitors and understand how you interact with our Sites. They help us to know how visitors reach our Sites, analyze usage patterns, and improve our Sites (e.g., by ensuring that users find what they are looking for). These Cookies may also be used to limit the number of times you see our online advertisements and to measure the effectiveness of our advertising campaigns. Advertising Cookies. These Cookies use information about your activity on our Sites (e.g., pages you view and links you click) to deliver advertisements that are relevant to your interests and optimize our ad campaigns on third-party websites and apps. This includes our ads on social media platforms. These Cookies may also share information through social media “share” or other similar features on our Sites, or when you engage with our content on or through a social media platform such as LinkedIn, Facebook, and X/Twitter. If you disable these Cookies, you may still see our ads on third-party websites or apps, but they will be less relevant to you. We also use pixels, JavaScript tags, and similar tracking technologies on our Sites. Pixels (also known as clear GIFs) are tiny images embedded in a webpage and can be used to place cookies on a browser or device. JavaScript tags are snippets of code that are embedded in a webpage. Both pixels and JavaScript tags require calling a server (a computer that delivers web pages), which provides us or our vendor or partner with information about your device and visit. Similarly, our website and email campaigns use tracking URLs (also known as tracking links), which are used to track the performance of marketing and advertising campaigns across websites and engagement channels. If you use our mobile app, we may also use mobile device identifiers consisting of numbers and letters to recognize your device. Why We Use Cookies We use Cookies to collect information about your access to and use of the Sites, including to: (1) allow you to navigate and use all the features provided by our Sites; (2) customize elements of the layout and/or content within the Sites and remember that you have visited us before; (3) identify the number of unique visitors we receive; (4) improve the Sites and learn which functions of the Sites are most popular with users; (5) understand how you use the Sites (e.g., by learning how long you spend on the Sites and where you have come to the Sites from) and (6) marketing our Sites and other services to you. We use web analytics vendors on our Sites, such as those of Google Analytics, to help us analyze how users use the Sites, including by noting the website from which you arrive, and providing certain features to you including Google Signal features such as user ID tracking, dynamic remarketing, interest-based advertising, audience targeting, behavioral reporting, demographics and interests reporting, user segment analysis, device reporting, display advertising, and video ads reporting. The information collected by the technology will be disclosed to or collected directly by these vendors, who use the information to evaluate your use of the Sites. This may result in you seeing advertisements for our Sites when you visit other websites. To limit Google Analytics from using your information for analytics, you can install the Google Analytics Opt-out Browser Add-on by clicking here. You can also adjust your advertising settings by clicking here. We use vendors to help us understand and analyze how visitors use our services, and to improve the Sites. They may collect the following types of information from users of our Sites: device IP Address, device screen size, device type (unique device identifiers), browser information, geographic location, preferred language used to display the Sites, and details about your use of the Sites. As we adopt additional technologies, we may gather additional information through other methods. We will notify you of such changes with updates to this Cookie Policy. Your Cookie Preferences You may choose to disable Cookies we use that are not essential. If you disable or opt out of our use of Cookies, some or all of our Sites may not work as intended. Some web and mobile device browsers automatically accept Cookies but, if you prefer, you can change your browser to prevent that or to notify you each time a cookie is set. Depending on your location, you may receive a cookie notification when you first visit our Sites. By clicking “Accept” or “Okay” in that notification, you consent to the use of all cookies described there. Where applicable, you may also choose to “Reject” cookies, which will disable all non-necessary cookies. You can change these choices at any time using our cookie preferences tool. If you do not see a notification, you consent to the use of cookies and similar technologies for the purposes described in this Cookie Policy by continuing to visit or use our Sites. You can also consult the “Help” section of your browser for more information (e.g., Internet Explorer, Google Chrome, Mozilla Firefox, or Apple Safari). The Digital Advertising Alliance (“DAA”) and Network Advertising Initiative (“NAI”) offer tools for you to choose whether participating third parties may use your information for targeted advertising. To opt out of such use by such third parties, visit the DAA AdChoices Tool at youradchoices.com/control and the NAI Consumer Opt-Out Tool at optout.networkadvertising.org. For European Economic Area (EEA) and United Kingdom users, visit youronlinechoices.eu. For Canadian users, visit youradchoices.ca/en/tools. In connection with Cookies operated by social networking services, you can visit your settings with each of the social networking services to exercise your choice about those technologies. We do not control any of the above third-party mechanisms or opt-out links and are not responsible for any choices you make using these mechanisms or the continued availability or accuracy of these mechanisms. If your browsers are configured to reject Cookies when you visit these opt-out pages, or you subsequently erase your Cookies, use a different computer, or change web browsers, your opt-out may no longer be effective. Some mobile operating systems (e.g., Android and iOS) allow you to delete or opt out of using your mobile advertising identifier for certain advertising activities or related purposes. You can generally find information on device identifier choices in your mobile operating system menu under “Settings” > “Privacy” or a similar option on your mobile device. If you are accessing our services through a mobile device, you can also update your privacy settings on your device by setting the “Limit Ad Tracking” and Diagnostics and Usage setting property located in the settings screen of your Apple iPhone or iPad, or by resetting your Android ID through apps that are available in the Play Store. You can also limit information collection by uninstalling the App on your device and you can use the standard uninstall process available as part of your device for this purpose. Please note that because these opt-out mechanisms are specific to the device or browser on which they are exercised, you will need to opt out on every browser and device that you use. Cookie Preferences Depending on applicable law, you may be able to disable cookies for functionality, analytics, and/or advertising in your cookie preferences here."
