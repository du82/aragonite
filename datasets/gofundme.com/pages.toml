full_description = "Why GoFundMe GoFundMe is a trusted leader in online fundraising. We are committed to serving and supporting our community every step of the fundraising journey. .block_552e12de4cb0f6af90a1a8600c01cd7c { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_552e12de4cb0f6af90a1a8600c01cd7c { margin: 0px 0 50px 0 !important; } } Trust Our Trust & Safety team works around the clock to ensure your safety and protect against fraud. We also provide the first and only donor protection guarantee: the GoFundMe Giving Guarantee. With eight years of experience and the most money raised, GoFundMe has earned the trust of respected institutions and government officials around the world. Speed We’ve helped families and communities get back on their feet quickly. In just the first 30 days following Hurricane Harvey, GoFundMe delivered over $27 million directly to people affected by the storm. Tools GoFundMe’s fundraising tools make it easy for you to create, share, and raise money for your fundraiser. From our mobile app to beneficiary management to team fundraising, we are constantly working on ways to improve our organizer and donor experiences—and change the way the world gives. Reach GoFundMe helps you easily share your story far and wide over email, text, and social media to rally support for your cause. In addition, we have a dedicated team looking for great stories to amplify and share with the media and our community. Service Need customer service? GoFundMe is ready to help. Our help center team is here to answer your questions, offer expert advice, and support you every step of the way. We care about your questions, which is why we’re committed to providing a rapid and friendly response. .block_78706bb810d87fdbc3c21253a3685458 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_78706bb810d87fdbc3c21253a3685458 { margin: 0px 0 50px 0 !important; } } Get started fundraising today. Start a GoFundMe .block_561d471bf68729400f7b8072a8d6f3c6 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_561d471bf68729400f7b8072a8d6f3c6 { margin: 0px 0 50px 0 !important; } } GoFundMe: Powered by donors™ Millions of people turn to GoFundMe in times of need to support themselves, friends, and strangers. In addition to their donation, donors may choose to leave us a voluntary tip. We use these tips to help us operate the company and provide an effective, safe and secure experience for all our users around the world. To learn more about our pricing, visit the GoFundMe pricing page."
