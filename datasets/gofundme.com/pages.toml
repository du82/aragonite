["https://gofundme.com/start/funeral-fundraising"]
title = "Start a Funeral Fundraiser - GoFundMe"
description = "Start a funeral fundraiser with GoFundMe in minutes to help pay for a funeral, end-of-life expenses, celebrations of life, and other costs."
full_description = "Start a Funeral Fundraiser on GoFundMe Raise money to help cover the cost of funeral expenses, to support family members, or to honor someone’s memory on the world’s most chosen crowdfunding platform. Start a GoFundMe Start a GoFundMe Everything you need to help your fundraiser succeed is here. Start fundraising on GoFundMe today How to start Tips Examples Resources Questions Why GoFundMe How to start a GoFundMe Step 1 Our tools help create your fundraiser Click the ‘Start a GoFundMe’ button to get started. You’ll be guided by prompts to add fundraiser details and set your goal, which can be changed anytime. Step 2 Share your fundraiser link to reach donors Once live, share your fundraiser link with friends and family to start gaining momentum. You’ll also find helpful resources for running your fundraiser in your GoFundMe dashboard. Step 3 Securely receive the funds you raise Add your bank information to securely start receiving funds or invite your intended recipient to add theirs. You don’t need to reach your fundraising goal to receive your money. Start a GoFundMe Tips for your funeral fundraiser on GoFundMe More Fundraising Tips Use the person’s name Make it easier for donors to find your fundraiser by including the name of the person you are honoring in the title and description. This not only helps in search results but also immediately informs potential donors about whom the fundraiser is about. For example your title might be, “Honoring Jane Doe’s Life and Legacy.” Highlight uplifting images and memories Choose a photo that reflects the person’s spirit and life as your featured image. Seeing your loved one doing something they loved like fishing, smiling outside will help potential donors see who the fundraiser is for. You can also add additional pictures from meaningful moments with family to the description. Ask family or friends first Reach out to friends, family, and community groups who knew the person well. Ask them to consider making a donation to start off the fundraiser and include a comment of words of encouragement or a fond memory. Examples of funeral fundraisers on GoFundMe Bringing Jorge home Support for the family Help amidst grief Bringing Jorge home After his dear friend passed away, Gereen set up a GoFundMe to help the family in their time of grief. The money raised by friends and community helped pay the bills for the funeral home and end-of-life costs. The remaining donations were given to his family to assist them with the… Read more $0 raised of $0 goal Support for the family After the loss of their father, friends of the Brown family set up a GoFundMe for the community and friends to donate and help relieve some of the financial hardships the family faced. Thanks to the generous support, more than $60,000 was raised for the family. $0 raised of $0 goal Help amidst grief A GoFundMe started to honor their dear friend Lily to help with Celebration of Life expenses and to establish an Athletic scholarship program in her name. Lily’s memory and legacy is remembered with every donation and word of support. $0 raised of $0 goal Resources for funeral fundraising View more GoFundMe's top fundraising tips How to start a memorial fund to honor a loved one 20 Fundraiser Sharing Tips to Increase Donations Questions about funeral crowdfunding on GoFundMe More FAQs Can I start a fundraiser to support the family? Yes, if you know a friend or loved one who needs help covering medical bills, starting a GoFundMe is a great way to help. We recommend you first ask if the person you are fundraising for is comfortable with you starting the fundraiser. Once you set up the fundraiser, you can invite them to set up bank transfers so they will receive the money directly. Learn more about inviting the person you are fundraising for to receive funds. What details should I include in my funeral fundraiser? The fundraiser description is a great place to honor the memory of the deceased. You can add memories, photos, and brief overview of their life. We recommend including details at the beginning of your fundraiser description that shares what the funds will be used for. This will help potential donors understand what they are donating for. If there is a date by which you are hoping to collect funds, it is also recommended that you include this information. For example, if you are looking for help covering the costs of the funeral before they are due, include the date and roughly the expected costs. Can I raise my goal if I the financial needs increase? Yes, you can raise (or lower) your fundraising goal at any time. How long will it take to receive the money raised? The process of setting up and verifying transfers can take 3-7 business days or longer to complete. Then, once your first transfer is sent, it will take on average 2-5 business days for the funds to safely be deposited into the bank account on file. How much of the money will I keep? One small transaction fee (2.9% + $0.30) is automatically deducted per donation—that’s it. Everything else goes directly to your cause. For more information and to estimate what you will receive, check out the GoFundMe pricing calculator. Can I raise money on GoFundMe for a charity in memory of my loved one? Yes, you can fundraise for a charity or nonprofit you care about by selecting “Charity” when prompted to select who you are fundraising for in your GoFundMe setup. You can also include a QR code in the funeral program to ask people to make a donation instead of flowers to the deceased favorite charity. How much does the average funeral or memorial cost? The average funeral or memorial service in the United States costs $8,300, according to The National Funeral Directors Association. Other costs may include cemetery fees (e.g., plot cost, monument, or grave marker) or items such as an obituary, flowers, fees for the priest or minister, etc. What should I title my funeral fundraiser? We recommend using the full name of the person’s memory in which you are fundraising for so that donors can easily search for your fundraiser. For example, “In loving memory of Jane Doe.” Can I invite friends or family to help me run the fundraiser? Yes, you can add team members to help you run the fundraiser after the fundraiser is set up. Visit this help center article for a step-by-step guide to adding team members to your GoFundMe. Why set up a funeral fundraiser on GoFundMe? Starting a funeral fundraiser on GoFundMe is a meaningful way to honor the memory of a loved one, while also providing practical support for their family members. It also gives those who care a chance to come together to support, by donating to a fundraiser for funeral expenses or for a nonprofit the deceased loved. Donors can also leave a message or tribute with their donation, making it even more special. Start a GoFundMe"
