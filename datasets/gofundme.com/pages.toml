["https://gofundme.com/c/how-it-works"]
title = "How GoFundMe Works"
description = "Learn how to create your fundraiser, share with family and friends, and set up bank transfers on GoFundMe."
full_description = "How Fundraising on GoFundMe Works GoFundMe is the trusted place to fundraise for what you care about. With no pressure to hit your fundraising goal, but helpful tools to help you reach it, you can confidently start fundraising. Learn step-by-step what to expect—from writing your story and sharing your fundraiser to receiving the money raised. Start a GoFundMe .block_cc4d6244d37bd5a8c15ec4d9eece8e65 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_cc4d6244d37bd5a8c15ec4d9eece8e65 { margin: 0px 0 50px 0 !important; } } Here’s what to expect when fundraising on GoFundMe: 1. Follow the prompts to set up your fundraiser Click the ‘Start a GoFundMe’ button and answer a few questions to get started Add a photo or video for your fundraiser (You can always change this later) In your fundraiser description, share the reason you are fundraising in 1-3 paragraphs Add details such as: Who or what you’re fundraising for How funds will be used Finally, we will suggest a goal amount for your fundraiser based on fundraisers with similar locations, categories, etc. that found success on GoFundMe in the last year. You can always choose a goal amount different from our suggestion, and edit your goal at any time. 2. Share your fundraiser Share your fundraiser link with your closest friends and family through text messages and emails to start gaining momentum Post your fundraiser more broadly by using social media, sharing in-person with a printable poster, or writing a letter to people you know Continue to share your fundraiser each day to help reach your goals Add team members you know and trust to your fundraiser to help spread the word Want more tips on how to get greater support for your fundraiser? Check out our fundraiser awareness video. 3. Post updates and thank donors Throughout your fundraising journey, you can post fundraiser updates to help increase donations and keep donors informed Easily thank donors within your fundraising dashboard Find more tips on our blog about how to ask for donations and how to write a donation thank-you letter. 4. Set up bank transfers Add bank information to start receiving funds (you don’t need to hit your fundraising goal to receive your money) Add a beneficiary if you’re raising donations for someone else *One small transaction fee is automatically deducted per donation. For more help with GoFundMe and information about GoFundMe fees, visit our Pricing page. .block_117223bcdc9d254f3b42f181b7f59341 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_117223bcdc9d254f3b42f181b7f59341 { margin: 0px 0 50px 0 !important; } } Start a GoFundMe .block_a51759435218bda6ccd627a6a0cf11e4 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_a51759435218bda6ccd627a6a0cf11e4 { margin: 0px 0 50px 0 !important; } } Here’s what people are saying about GoFundMe “This was my first time creating a GoFundMe for a dear friend of mine who has a recurrence of cancer and her family is in financial straits. We were amazed at how easy it was to set up the GoFundMe and manage it. My friend and her family were SO appreciative.” “GoFundMe helped me and my mother when she most needed. It gave confidence to [people] wanting to donate.” “I’ve used GoFundMe for various fundraising campaigns over the years for nonprofit work to memorials to breast cancer support. It is such a simple way to get and garner support for a broad range of projects.” .block_71eeb0e5f6c5731ed5ac195abafe88d1 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_71eeb0e5f6c5731ed5ac195abafe88d1 { margin: 0px 0 50px 0 !important; } } Fast and safe fundraising on GoFundMe GoFundMe has become a trusted leader in online fundraising since 2010. That’s why GoFundMe is the top platform of choice to start a fundraiser than any other fundraising site. Our Trust & Safety team is dedicated to protecting organizers and donors so you can safely start a fundraiser or donate to a cause you care about. Learn more about our GoFundMe Giving Guarantee and find answers to common fundraising questions."
