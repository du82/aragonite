full_description = "GoFundMe for Nonprofits Nonprofits are using GoFundMe to reach more donors and empower supporter-led fundraising. Claim your free Nonprofit Page to get started. Claim my Nonprofit Page .block_c250c2695df6ef412f2647a29f679f3e { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_c250c2695df6ef412f2647a29f679f3e { margin: 0px 0 50px 0 !important; } } .block_03b93cbc1029fdbedb74d369d886eec2 { margin: 0px 0 100px 0 !important; } @media(max-width: 767px) { .block_03b93cbc1029fdbedb74d369d886eec2 { margin: 0px 0 100px 0 !important; } } Yes, GoFundMe is also for nonprofits Get discovered by potential donors who care about your cause Empower supporters to champion your cause on the #1 fundraising platform Access supporter details and donation insights to shape your engagement strategies .block_a86d281cef3229890c71f9c6d82e7f46 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_a86d281cef3229890c71f9c6d82e7f46 { margin: 0px 0 50px 0 !important; } } Claim my Nonprofit Page FAQs How do I claim my Nonprofit Page on GoFundMe? Visit GoFundMe Charity Sign-Up Create an account and select your nonprofit. Check your email for a confirmation request. Submit the requested documentation, and our team will review within 1-2 business days. Admins may also find this article helpful for confirming their nonprofit connection. Is a Nonprofit Page free? Creating and managing a Nonprofit Page on GoFundMe is free. Transaction fees apply only when donations are received and vary by country. Donors are also invited to leave a voluntary tip, which helps support GoFundMe’s trust and safety efforts. See GoFundMe’s pricing page for details. Where can I access all data and activity related to my nonprofit on GoFundMe? After claiming and verifying your nonprofit, you’ll get admin access to view activity in your GoFundMe nonprofit dashboard. As a nonprofit admin, can I edit my Page? Yes, after claiming and verifying your nonprofit, you’ll be able to edit various elements of your Page. I’m interested in a more robust digital fundraising and events solution. What do you recommend? Explore Classy from GoFundMe’s flexible fundraising platform and tailored pricing plans, including Essentials—our $0 subscription offering. .block_a86d281cef3229890c71f9c6d82e7f46 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_a86d281cef3229890c71f9c6d82e7f46 { margin: 0px 0 50px 0 !important; } } Claim my Nonprofit Page"
