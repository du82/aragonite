full_description = ".block_cf9aafdbf8fbe5b56f09c88fe46a6074 { margin: px 0 px 0 !important; } @media(max-width: 767px) { .block_cf9aafdbf8fbe5b56f09c88fe46a6074 { margin: px 0 px 0 !important; } } Legal Contact Info Contact information for law enforcement, legal counsel, compliance and regulatory bodies. .block_850fe3daea64f80d46fa35e8761c1eb2 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_850fe3daea64f80d46fa35e8761c1eb2 { margin: 0px 0 50px 0 !important; } } LEGAL CONTACT DIRECTORY We take your legal questions and concerns very seriously at GoFundMe. For a directory of who to contact for your specific inquiry, please review the sections below. SITE ISSUES If you have a problem concerning an account, how GoFundMe works or any other general issue, please visit our Help Center. If you are looking to get a campaign removed for fraudulent or untrustworthy behavior, report the campaign here. LEGAL ISSUES Please see the Law Enforcement and Government Demands Notice here. Quick summaries are provided below. Request for Records – United States If you have a valid U.S. civil or criminal request for records (such as a subpoena or court order) for GoFundMe to review, please submit it via: Civil – Request for Records Form Criminal – Request for Records Form Alternatively, records requests may be served on GoFundMe’s registered agent: Corporation Service Company which will do business in California as CSC-Lawyers Incorporating Service 2710 Gateway Oaks Drive, Suite 150N Sacramento, CA 95833 Request for Records – International All international requests must be delivered pursuant to the Notice. Digital Services Act (DSA) In accordance with Article 24 (2) and Recital 77 of the Digital Services Act, the average number of monthly active recipients of our marketplace service in the European Union over the last six months is approximately between 17.2 million and 20 million. We will continue to publish updated information regarding the average number of monthly active recipients in accordance with Article 24 (2). Last updated on 31 January 2025. Other Law-Related Questions If you have other law-related questions, please send an email to legal@gofundme.com."
