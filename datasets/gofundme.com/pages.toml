title = "Start a Fundraiser on GoFundMe - Create a Crowdfunding Campaign"
description = "Start a fundraiser for what you're passionate about. With over $30 billion raised, GoFundMe is the most trusted online fundraising platform for crowdfunding."
full_description = "Start Fundraising on GoFundMe Everything you need to help your fundraiser succeed is here. Start fundraising on the #1 crowdfunding platform today Start a GoFundMe Start a GoFundMe No fee to start your fundraiser Reach your goals with help from our smart tools Secure payment methods to receive your money More than $50M is raised a week on GoFundMe to support people like you How to start Examples of fundraisers Resources FAQs Fundraiser categories How to start a GoFundMe Step 1 Our tools help create your fundraiser Click the ‘Start a GoFundMe’ button to get started. You’ll be guided by prompts to add fundraiser details and set your goal, which can be changed anytime. Step 2 Share your fundraiser link to reach donors Once live, share your fundraiser link with friends and family to start gaining momentum. You’ll also find helpful resources for running your fundraiser in your GoFundMe dashboard. Step 3 Securely receive the funds you raise Add your bank information, or invite your intended recipient to add theirs, to securely start receiving funds. You don’t need to reach your fundraising goal to start receiving funds. Start a GoFundMe Examples of fundraisers happening on GoFundMe Memorial Charity Medical Sports Education Help amidst grief A GoFundMe started to honor their dear friend Lily to help with Celebration of Life expenses and to establish an Athletic scholarship program in her name. Lily’s memory and legacy is remembered with every donation and word of support. $0 raised of $0 goal Biking for Red Cross Sharon participated in RAGBRAI, an annual cycling event across the state of Iowa. She decided to use her experience to help support a cause she cares about- the American Red Cross! By starting a fundraiser, she raised more than $1,300 to accompany her great accomplishment of riding $0 raised of $0 goal Support for healing When Victor received a diagnosis for ALS, his community wanted to show support. His partner started a GoFundMe to help cover for transportation to treatment, monthly supplements, weekly PT, and much more. $0 raised of $0 goal Little League Dreams The El Segundo Little League team parents started a GoFundMe to help cover the travel, tournament, and family support for their 2023 World Series Tournament. Their community rallied to support the team and their families as they followed the journey to their championship! $0 raised of $0 goal Teacher who cares Mr. Allen is raising money for his students to take hands-on learning trips that can’t be replicated in the classroom. This will allow for many of his students to connect to a learning style they don’t have access to every day. His community is rallying to support the endeavor. $0 raised of $0 goal Resources for fundraising on GoFundMe From setting up your fundraising to tips for reaching your goal—we’re here to help. View all Top tips for your GoFundMe fundraiser Tips for telling a great fundraiser story Tips for sharing your fundraiser Questions about fundraising on GoFundMe View all Is it okay to raise money for myself? Yes, millions of people have started a fundraiser on GoFundMe for themself or their family amidst a financial crisis. Rebuilding and recovering after a natural disaster, unexpected bills, and many more emergency use cases find support though crowdfunding. Can I create a GoFundMe for someone else and have the funds go directly to them? Yes, you can create a GoFundMe for someone else and help ensure funds go to them directly and securely. To learn more, visit this help center article. Can I create a GoFundMe for a charity or nonprofit? Yes. Starting a fundraiser for a charity or nonprofit on GoFundMe is an easy, powerful, and trusted way to directly support. All you have to do is start. Are there any time limits or deadlines for fundraising on GoFundMe? There is no deadline or time limit for your fundraiser on GoFundMe. You can share and re-share your fundraiser link with your community at any time. Are there any fees to fundraise? There is no fee to start fundraising on GoFundMe. One standard transaction fee (2.9% + $0.30) is automatically deducted per donation—that’s it. Everything else goes directly to your cause. For more information and to estimate what you will receive, check out the GoFundMe pricing calculator. How long will it take to receive the money from my GoFundMe? The process of setting up and verifying transfers can take 3-7 business days or longer to complete. Then, once your first transfer is sent, it will take on average 2-5 business days for the funds to safely be deposited into the bank account on file. How can I share and promote my GoFundMe? You can share your fundraiser with any of our easy ‘share’ buttons in your fundraiser dashboard. Check out our top tips for sharing your fundraiser. How do I add team members to my GoFundMe fundraiser? Once you’ve set up and published your fundraiser, you’ll see an option to add team members in your fundraiser dashboard. For a detailed guide on adding team members, view our Help Center article. Who can fundraise on GoFundMe? What can I fundraise for? GoFundMe is the global leader in fundraising, and almost anything you need can be fundraised for on GoFundMe. For more information on who can fundraise and what can be fundraised for on GoFundMe, read our terms of service. In what countries can I start a GoFundMe? There are currently 20 countries where our payment processors can send funds. Review our list of supported countries and currencies to help ensure that your country is supported. Are there tips for helping my fundraiser succeed? Yes- we are here to help by providing resources along your fundraising journey. Check out our collection of GoFundMe tips to find even more resources. Join the millions of people fundraising for a cause they care about on GoFundMe Start a GoFundMe What do people fundraise for on GoFundMe? GoFundMe is the trusted place to fundraise for what you care about. There is no pressure to reach your fundraising goal and we have created tools to make it easy for donors to contribute to your fundraiser. Internal GoFundMe data shows fundraisers raised an average of 12.5% more year on year in 2024, thanks to our product team’s hard work. For more inspiration and help fundraising, explore the categories below. Medical Memorial Charity Emergency Business Education Sports Animals Wedding Faith Environment Funerals Cancer treatment IVF Show more Asking for help feels big. Let’s start small. Start a GoFundMe Still need help? We’re here for you. Visit Help Center"
