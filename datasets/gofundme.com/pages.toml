["https://gofundme.com/c/questions"]
title = "Common Fundraising Questions"
description = "Find answers to common fundraising questions. Learn more about fundraising, donating, or receiving donations."
full_description = "Questions about GoFundMe Learn more about fundraising, donating, or sharing on GoFundMe. Start a GoFundMe Questions about fundraising How do I start a GoFundMe? View our full guide on how to start a GoFundMe for inspiration, examples, tips, and more. How does GoFundMe work? Here’s how fundraising on GoFundMe works: To get started, just tap the green ‘Start a GoFundMe’ button. After a few questions to help set up your fundraiser, you’ll then write your fundraising story or, if you’re on the app, you can record a video. Next, you’ll customize your fundraiser, adding details to let potential donors understand your cause. Once your fundraiser is live, you can always add additional photos and videos or lower or raise your goal anytime. The best way to raise funds is by sharing your fundraiser. Call family, text friends, message coworkers, or post your fundraiser link on social media to help you reach your fundraising goal. Even if you haven’t met your fundraising goal, you can set up daily transfers to your bank account to receive money. If you need us, we’ll be there every step of the way with fundraising tips and support. Ready to get started? Start a GoFundMe What can I raise money for? We see people use GoFundMe to raise money for themselves, friends and family, or even complete strangers in random acts of kindness. People raise money for just about everything, including medical expenses, education costs, volunteer programs, youth sports, funerals & memorials, and even animals & pets. We’re always amazed at the ways people use GoFundMe to raise money. Check out some recent success stories, or see how GoFundMe works. How does GoFundMe keep fundraisers safe? GoFundMe features the very best in secure payment encryption technology. Your donors’ online payments are safe, and your money is stored securely until you’re ready to request a withdrawal via electronic bank transfer. How do I withdraw funds from my fundraiser? Once your GoFundMe starts receiving online donations, you can easily request a withdrawal at any time. Withdrawing money does not affect the progress meter displayed on your fundraiser. Simply click ‘Withdraw’ while logged into your account and follow the instructions. You can withdraw your balance directly to your bank account. Bank transfers take 2-5 business days to arrive. Learn how to start withdraws Can a friend withdraw the money I raise for them? Yes. GoFundMe makes it easy for another friend or family member to securely access the funds you have raised. Through GoFundMe, they will receive direct access to the money you have raised. Please note: You will not be able to enter their bank information during the withdrawal process; they will need to do this themselves. Learn how to invite a beneficiary Are there any deadlines or time limits? While there are important withdrawals deadlines you’ll need to observe to avoid donations being refunded to donors, your fundraiser will remain live until you choose to turn off donations or remove the fundraiser altogether. Most organizers leave their fundraisers active indefinitely to refer back to the kind comments and support they received. Learn more What if I don’t reach my goal? No problem. Reaching your goal is not required. With GoFundMe, you keep each and every donation you receive. Your fundraiser will be able to accept donations even after your goal is reached. Once the goal is reached, the progress meter on your fundraiser will show that you have received more than your goal amount. If you’d like to continue raising money, you can keep your fundraiser running for as long as you’d like. Learn more about goals How do I get donations? GoFundMe provides an easy way to raise money from your friends, family, and online community. Our platform makes it simple to share your fundraiser in a variety of ways to bring in donations, track your progress, and post updates to engage your community. Check out our fundraising tips and fundraising ideas for advice on how to raise more donations. Is my country supported? Review our list of supported countries and currencies to ensure that your country is supported. Questions about donations What is the GoFundMe Giving Guarantee? We are proud to offer the first and only donor protection guarantee: the GoFundMe Giving Guarantee. Every day, thousands of people get the help they need from generous donors. Our team of Trust & Safety specialists work night and day to make sure that funds get to the intended recipient, every time. We guarantee you a full refund in the rare case something isn’t right. Whether you donate to a fundraiser for a person or a nonprofit, you’re protected. How is my donation protected? The GoFundMe Giving Guarantee protects your donation. Donations of any amount are covered for one full year after you donate. Your donation is protected, wherever you donate from. You are making the world a better place for someone every time you give. We believe it’s our responsibility to protect your kindness—by protecting your donation. Donate with peace of mind. Only on GoFundMe. .block_c780a934506529b05ed3806b14088997 { margin: px 0 px 0 !important; } @media(max-width: 767px) { .block_c780a934506529b05ed3806b14088997 { margin: px 0 px 0 !important; } } Still need help? We’re here to support. Our Customer Care team is here to answer any questions every step of the way. Contact us"
