["https://gofundme.com/c/careers"]
title = "Careers"
description = "We love it here Our people consistently vote GoFundMe a Great Place to Work®."
full_description = ".block_e94a07fa3eab45c05e82abd5bc5a7218 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_e94a07fa3eab45c05e82abd5bc5a7218 { margin: 0px 0 50px 0 !important; } } GoFundMe Careers Helping people help each other GoFundMe is a global community of over 100 million people with the common purpose of helping one another. Our mission is to help people help each other by making it safe and easy for people to ask for help and support causes—for themselves, each other, and their communities. In 2022, GoFundMe joined together with Classy, a leading nonprofit fundraising software company that enables nonprofits to connect supporters with the causes they care about. Together, GoFundMe and Classy have empowered people and organizations to raise more than $30 billion. Our vision is to become the most helpful place in the world. .block_1b678b376b97501eaa1d4a7ffc3b52ba { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_1b678b376b97501eaa1d4a7ffc3b52ba { margin: 0px 0 50px 0 !important; } } .block_93859fafb14b6e50b3c2790e9c36e95b { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_93859fafb14b6e50b3c2790e9c36e95b { margin: 0px 0 50px 0 !important; } } You belong here GoFundMe is a platform that exists to serve people from all backgrounds and experiences. We believe that our teams should uphold all unique voices and ethnicities in a way that represents the diversity of our world. We are strongest when everyone feels empowered to bring their whole self to work knowing that they will be included and treated equally. As we continue to change the way the world gives, we are committed to celebrating and uplifting the broad spectrum of human experiences within our company. .block_99e33143ed6958289bdb88bf9f11e099 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_99e33143ed6958289bdb88bf9f11e099 { margin: 0px 0 50px 0 !important; } } Core values Impatient to be great Find a way Earn trust every day Fueled by purpose Help people do the best work of their lives Help people do the best work of their lives Rich healthcare benefits including employer paid premiums for medical/dental/vision (100% for employee only plans and 85% for employee + dependent plans) and employer HSA contributions. Work & Life Balance Hybrid workplace with fully remote flexibility for many roles Monetary support for new hire setup, hybrid work & wellbeing, family planning, and commuting expenses A variety of mental and wellness programs to support employees along with Employee Resource Groups Time off and leave Supportive time off policies including vacation, sick/mental health days, volunteer days, company holidays, and a floating holiday. Generous paid parental leave and family planning stipend. Giving back Gives Back Program where employees can nominate a fundraiser every week for a donation from the company. Investing in you 401(k) retirement plan with company matching along with learning & development and recognition programs. Learning and development Grow your career and feed your curiosity with access to learning tools and resources, including an online training portal, guest speakers, and internal brown bag sessions. .block_5d74c2ec37885bfaf574960c04cf897a { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_5d74c2ec37885bfaf574960c04cf897a { margin: 0px 0 50px 0 !important; } } GoFundMe careers: Current job openings Personnel Privacy Notice for Classy and GoFundMe .block_8b7dbf3107372a60b25408576c36ee1a { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_8b7dbf3107372a60b25408576c36ee1a { margin: 0px 0 50px 0 !important; } } Business Operations Comm & PR Data Engineering - Classy Engineering - GoFundMe Finance Human Resources Marketing Product Management RCPI Business Operations Manager, Analytics - San Francisco, CA Comm & PR Product Communications Director - Remote Data Senior Data Engineer - Buenos Aires, Argentina Senior Data Scientist 