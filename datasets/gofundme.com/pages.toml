full_description = "Your Privacy Choices .block_c803c4743219d10a0280e1acf67f3cc0 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_c803c4743219d10a0280e1acf67f3cc0 { margin: 0px 0 50px 0 !important; } } At GoFundMe and Classy, we care about your privacy and want to offer you the choice to manage and take control of your “personal data” or “personal information” (as such terms are defined under applicable laws). If you live outside of the U.S., please visit our Individual Rights Portal here to learn how to exercise your privacy rights. If you live in the U.S., you may have privacy rights under state laws, such as the consumer privacy laws in California, Colorado, Connecticut, Virginia, Utah, Oregon, Texas, Montana, Delaware, Iowa, Nebraska, New Hampshire, and New Jersey. See below for more information and instructions on exercising your privacy choices in relation to these rights. California – Do Not Sell/Share: To exercise your Do Not Sell or Do Not Share rights under the California Consumer Privacy Act (CCPA), as amended by the California Privacy Rights Act (CPRA), please complete the following steps: You can opt out of GoFundMe’s “sale” or “sharing” of your personal information through cookies by visiting cookie settings. You can also opt out of GoFundMe’s “sale” or “sharing” of your personal information associated with your email only by filling out the “Opt Out Request” option on this form or emailing privacy-requests@gofundme.com. Colorado, Connecticut, Oregon, Texas, Montana, Utah, Virginia, Delaware, Iowa, Nebraska, New Hampshire, and New Jersey – Opt out of sales and targeted advertising: Residents of certain states including the ones listed above: You may have the legal right to opt out of GoFundMe’s “sale” of your personal data or use of your personal data for targeted advertising by visiting cookie settings. You may also have the legal right to opt out of GoFundMe’s “sale” of your personal data or use of your personal data for targeted advertising associated with your email only by filling out the “Opt Out Request” option on this form or emailing privacy-requests@gofundme.com. Right to Opt-Out of Automated Decision Making Technologies: To exercise an opt out of your data being used in automated decision making technologies (ADMT), please fill out this form. All Other Rights: To submit a Data Subject Request for access, deletion, correction, or other similar rights, please fill out this form or email privacy-requests@gofundme.com."
