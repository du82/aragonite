full_description = "Direct support for urgent needs Social Impact Funds Powered by GoFundMe.org GoFundMe is committed to caring for the needs we see on our platform every day: education equality, weather resilience, and access to life’s essentials. We are proud to support these funds — and hope you will consider doing so, too. Donations to these social impact funds go directly to grants to individuals in need, and in some cases, organizations working to provide aid or promote critical social change. Grants are distributed by our strategic nonprofit partner, GoFundMe.org. GoFundMe.org is an independent and publicly-supported 501(c)(3) nonprofit organization that leverages our technology, services, and other resources at no charge to carry out its charitable purpose. .block_42d7049f71aa23485c4b205945244349 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_42d7049f71aa23485c4b205945244349 { margin: 0px 0 50px 0 !important; } } The Essentials Fund Every day, hundreds of Americans start fundraisers for basic necessities like food, housing, and utilities. The Essentials Fund distributes cash grants to help individuals make ends meet and find paths to stability. Donate .block_ab4247deddaa4906b457ac02e378b499 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_ab4247deddaa4906b457ac02e378b499 { margin: 0px 0 50px 0 !important; } } The Weather Resilience Fund The Weather Resilience Fund will support local resilience efforts, ensuring that vulnerable communities are better prepared for, and can adapt to, increasingly intense weather conditions and weather-fueled natural disasters. Donate Learn more .block_8847ba85ed81934bb23eafc7db67d188 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_8847ba85ed81934bb23eafc7db67d188 { margin: 0px 0 50px 0 !important; } } The Education and Opportunity Fund Teachers often spend their own money to give their students the best learning experience possible. The Education Opportunity Fund supports educators and organizations dedicated to helping students grow—from supplying pens and books to providing snacks so students can stay engaged throughout the day. Donate Natural disaster relief funds Donations to these funds are distributed directly to verified people and families affected by natural disasters in the US. The Wildfire Relief Fund This fund was created to provide direct relief to people in need after a wildfire. Your donation will ensure this fund can support as many people as possible as soon as a disaster strikes. Donate The Hurricane Relief Fund This fund was created to provide direct relief to people in need after a hurricane. Your donation will ensure this fund can support as many people as possible as soon as a disaster strikes. Donate"
