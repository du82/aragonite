full_description = "About Us Helping people help each other .block_faab2000de27958da6c18f084d70c280 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_faab2000de27958da6c18f084d70c280 { margin: 0px 0 50px 0 !important; } } Start a GoFundMe .block_b80a0ca236d29e0cd8b5d39f91264b83 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_b80a0ca236d29e0cd8b5d39f91264b83 { margin: 0px 0 50px 0 !important; } } .block_1e40f1dd1de7de192f1ae9ac22a05296 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_1e40f1dd1de7de192f1ae9ac22a05296 { margin: 0px 0 50px 0 !important; } } GoFundMe launched in 2010 as a fundraising platform dedicated to helping people help each other. In 2022, GoFundMe acquired Classy, which enables nonprofit organizations to maximize their impact through a suite of online fundraising tools. Together, GoFundMe and Classy are building a future where everyone has the ability to make a meaningful difference for the people, causes, and communities they care about most. Through our GoFundMe platform and Classy software business, we offer innovative products and services that leverage insights and analytics of our combined company. Learn about our commitment to your data privacy. .block_b5aa408792923f6829f39966930df1cf { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_b5aa408792923f6829f39966930df1cf { margin: 0px 0 50px 0 !important; } } Help adds up $30 Billion raised by GoFundMe and Classy since 2010 150 Million+ global community helping one another 1/sec someone makes a donation every second .block_c1518fa49cea45e6245e3053c88ff5f0 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_c1518fa49cea45e6245e3053c88ff5f0 { margin: 0px 0 50px 0 !important; } } Want to know more? Learn more about the process of starting a GoFundMe, tips and tricks, and see examples of fundraisers. Learn more Your easy, powerful, and trusted home for help. Easy Start fundraising in just a few steps. Powerful Connect with your community and amplify your cause. Trusted Chosen by over 100 million donors worldwide. .block_faab2000de27958da6c18f084d70c280 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_faab2000de27958da6c18f084d70c280 { margin: 0px 0 50px 0 !important; } } Start a GoFundMe .block_7afcad5203dd3b32b8f5f859a31a5d14 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_7afcad5203dd3b32b8f5f859a31a5d14 { margin: 0px 0 50px 0 !important; } } Learn more about GoFundMe Our Giving Guarantee GoFundMe pricing Where we work GoFundMe press .block_452d994b4721976453022ee23ae84772 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_452d994b4721976453022ee23ae84772 { margin: 0px 0 50px 0 !important; } } Want to join us? We are a growing global team of 400 working to build the most helpful place in the world. Click here to visit our careers page and learn how you can help us help others."
