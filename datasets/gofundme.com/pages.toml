title = "Start A Medical Fundraiser - Medical Fundraising for Bills & Treatment"
description = "Start a fundraiser to cover medical bills, treatment costs, lost income, and other healthcare expenses for yourself, a family member, or a friend with GoFundMe."
full_description = "Start a Medical Fundraiser on GoFundMe Raise money to help cover the cost of medical bills, treatment, or care. GoFundMe is the trusted place to fundraise for medical cost assistance. Start a GoFundMe Start a GoFundMe Everything you need to help your fundraiser succeed is here. Start fundraising on GoFundMe today How to start Tips Examples Resources Questions Why GoFundMe How to start a GoFundMe Step 1 Our tools help create your fundraiser Click the ‘Start a GoFundMe’ button to get started. You’ll be guided by prompts to add fundraiser details and set your goal, which can be changed anytime. Step 2 Share your fundraiser link to reach donors Once live, share your fundraiser link with friends and family to start gaining momentum. You’ll also find helpful resources for running your fundraiser in your GoFundMe dashboard. Step 3 Securely receive the funds you raise Add your bank information to securely start receiving funds or invite your intended recipient to add theirs. You don’t need to reach your fundraising goal to receive your money. Start a GoFundMe Tips for your medical fundraiser on GoFundMe More Fundraising Tips Add details to build trust Your fundraiser story connects you with potential donors. Provide the details about the medical challenge (where comfortable) and what you or your loved one need. Detailing your need resonates more with donors, and we recommend you include estimated costs or details of what you’re raising money for. IE to help cover a medical bill for a surgery that costs $5,000. Lean on friends and family first Before you share your fundraiser broadly with your social media networks, consider first asking a few of your closest friends or family members to help you get started by making a donation and adding words of encouragement. You can even add them as a team member to help you manage the fundraiser. Consistency is key Most people don’t reach their fundraising goal with just one social media post, so don’t get discouraged. Make time throughout the week to post on a different social network, send an email, write a letter, or ask a friend or family member in person to support by donating to or sharing your fundraiser. Examples of medical fundraisers on GoFundMe Treatment support Medical bills Her brave fight Support for healing When Victor received a diagnosis for ALS, his community wanted to show support. His partner started a GoFundMe to help cover for transportation to treatment, monthly supplements, weekly PT, and much more. $0 raised of $0 goal Medical bills Joe Haycock was hit by a car while riding his bike to work, and the driver fled the scene. Currently in the ICU, Joe faces a long road to recovery, missing his favorite time of year, Mardi Gras. Having worked in the local pet care community for 12 years, Joe is now… Read more $0 raised of $0 goal Her brave fight When Andrea received a cancer diagnosis, her family started a GoFundMe to help her focus on her recovery and not stress about finances. Her community showed up and help raise over $10,000. $0 raised of $0 goal Resources for medical fundraising View more GoFundMe's top fundraising tips Top fundraising ideas for cancer care 20 Fundraiser Sharing Tips to Increase Donations Questions about medical fundraising on GoFundMe More FAQs Can I start a GoFundMe for myself? Yes, starting a GoFundMe to help cover the cost of your medical bills is a trust way to get help. Including details in your GoFundMe’s description about what you are fundraising for will help donors understand what you need. Can I start a fundraiser for my friend or loved one? Yes, if you know a friend or loved one who needs help covering medical bills, starting a GoFundMe is a great way to help. We recommend you first ask if the person you are fundraising for is comfortable with you starting the fundraiser. Once you set up the fundraiser, you can invite them to set up bank transfers so they will receive the money directly. Learn more about inviting the person you are fundraising for to receive funds. What details should I include in my medical fundraiser? Including the details, even estimates, of what you are fundraising for and the average costs, can help potential donors understand your need. For example, if you are raising money to help cover the cost of an unexpected medical bill and in-person care, you might share how much you anticipate each of those costs to be. For more inspiration, read this article for help writing your fundraiser description. Can I raise my goal if I my needs increase? Yes, you can raise (or lower) your fundraising goal at any time. How long will it take to receive the money raised? The process of setting up and verifying transfers can take 3-7 business days or longer to complete. Then, once your first transfer is sent, it will take on average 2-5 business days for the funds to safely be deposited into the bank account on file. How much of the money will I keep? One small transaction fee (2.9% + $0.30) is automatically deducted per donation—that’s it. Everything else goes directly to your cause. For more information and to estimate what you will receive, check out the GoFundMe pricing calculator. Can I raise money for a medical charity on GoFundMe? Yes, you can fundraise for a charity or nonprofit you care about by selecting “Charity” when prompted to select who you are fundraising for in your GoFundMe setup. Why set up a medical fundraiser on GoFundMe? Starting a medical fundraiser on GoFundMe can be a lifeline for those facing the overwhelming challenge of medical expenses. Whether it’s for surgeries, treatments for chronic conditions, medications, rehabilitation, or supporting families during times of medical crisis, GoFundMe provides a compassionate platform to share your story and gather financial support. By creating a medical fundraiser, you’re inviting a community who wants to help you to join your journey. GoFundMe’s tools make it simple to reach out to friends, family, and even strangers who want to support when people need it most. Start a GoFundMe Find more support from communities fundraising for specific medical needs Cancer fundraising Breast cancer fundraising IVF Fundraising"
