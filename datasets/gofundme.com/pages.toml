full_description = "Privacy Notice .block_e2741d8a71a5170116c591da6a30d98a { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_e2741d8a71a5170116c591da6a30d98a { margin: 0px 0 50px 0 !important; } } Our Privacy Notice Last Updated: December 2, 2024 GoFundMe Group Inc. and its affiliates and subsidiaries, including Classy, Inc. (“Classy”), GoFundMe Inc., GoFundMe Australia Pty Ltd., and GoFundMe Ireland, Limited (collectively, “GoFundMe” “we,” “our,” and “us”) provide this Privacy Notice (“Notice”) to explain how we collect, use, and disclose information about you. This Notice applies to data collected by us offline and for all our products or services on which we make this Notice available – for example, when you use GoFundMe or the Classy Platform or our mobile applications or when you raise funds on GoFundMe for your campaigns or donate to one of our non-profit partners through websites powered by Classy (collectively, the “Services”). Before you access, use, or submit any information through or in connection with the Services, please carefully review this Notice. By using any part of the Services, you acknowledge that you have read and understood that we may collect, use, and disclose information about you as outlined in this Notice. To the extent allowed by law, the English version of this Notice is binding, and its translations in other languages are for convenience only; in case of discrepancies between the English version of this Notice and its translations, the English version shall prevail. This Notice does not cover the privacy practices of either (i) organizers of GoFundMe fundraisers (collectively, “Organizers”), (ii) beneficiaries of fundraisers (collectively, “Beneficiaries”), or (iii) nonprofit organizations that use the Classy platform (collectively, “Classy Clients”). We are not responsible for the privacy practices of Organizers, Beneficiaries, or Classy Clients, and their handling of your information may be subject to their own privacy statements. This Notice also does not cover our data practices when we act as a “processor” or “service provider” on behalf of Classy Clients. In those circumstances, we process information about you on behalf of the Classy Client, and you should consult the privacy statement of the Classy Client for information on how they process information about you. If you are a resident of California, the California Consumer Privacy Act of 2018 provides you with additional rights. Please view our “California Privacy Notice” to learn more. For any other specific US state privacy law-related matters, please refer to the section below titled “Regional Privacy Disclosures” and “Your Choices”. INFORMATION WE COLLECT As further described below, we collect information in multiple ways, including when you provide information directly to us, when we collect information about you from other parties, and when we automatically collect information from your browser or device (e.g., by logging how you interact with our Services). A. Information That You Provide Directly to Us: We and our vendors may collect information from you directly in various ways, such as when you: Open an account or otherwise register for the Services; Create a fundraiser on the Services; Create a peer-to-peer, crowdfunding, or team page; Create, register for, or purchase tickets to nonprofit events, merchandise, and/or other activities; Set up withdrawals or transfers; Donate to a fundraiser, organization, or cause; Post comments, leave feedback, send thank-you notes, or otherwise communicate with other users through our Services; Fill out a survey or questionnaire or provide us with feedback regarding the Services; Request certain features (e.g., newsletters, updates, and other products); Sign up for contests, awards and events hosted by us; or Communicate with us, such as for reporting a fundraiser, troubleshooting or support services. The information you provide us directly may relate to you or others and may include, without limitation: Account Registration Information: such as your name, email address and login details, your zip code, your country, your phone number, and certain other information, including any information you choose to provide us (such as a profile picture). If you use the Services as an organization (e.g., a Classy Client or any other registered non-profit), you may also provide us with your organization’s name, your role/title with the organization, tax identification number, 501(c)3 or tax-exempt status, and other information about your organization. Fundraiser Information: such as a fundraiser title, a fundraiser category, images, videos, description and fundraiser goal(s). Financial Information: such as payment account details for withdrawals and payment information for donations, and billing information. We use third-party payment processors to process financial information. For example, we use Stripe, Adyen and Paypal for payments, analytics, and other business services. These payment processors may collect personal data, including via cookies and similar technologies. The personal data they collect include transactional data and identifying information about devices that connect to its services. They use this information to operate and improve the services provided to us, including fraud detection, loss prevention, authentication, and analytics related to the performance of services. They operate both as processors for us and independent controllers for the information they collect directly from our users. You can learn more about Stripe and read its privacy policy at https://stripe.com/privacy. You can learn more about Adyen and read its privacy policy at https://www.adyen.com/policies-and-disclaimer/privacy-policy. You can learn more about Paypal and read its privacy policy at https://www.paypal.com/us/legalhub/privacy-full. Publicly Available and Non-Publicly Available Communications and Content: such as comments, feedback, thank-you notes or other communications with other users through our Services. Any content, including such comments, feedback, and notes that you choose to post on publicly available campaign pages through our Services, are available to the public by default. Please remember that any information that is disclosed in these areas becomes public information for both us and other users to use and share. Take care not to disclose information about you unless you intend for that data to become public. Please also be considerate and respectful of others while using the community to publish your opinions. We reserve the right but do not have the obligation, to review and monitor publicly-available content, non-publicly available communications between users, and any other content made on or through our Services, and to remove postings or content that may be viewed as inappropriate or offensive to others. Information about Yourself and Others, Including Sensitive Information: such as information about a fundraiser, including the beneficiary of a fundraiser, fundraiser goals, and other information you choose to provide, which may include information about situations or other circumstances that motivate a fundraising request. If you provide us with information about others, you acknowledge and agree that you have the authority and consent of the relevant other parties for us to access, disclose, and use the relevant data, and that you have notified the other parties and informed them of how their information is collected and used by GoFundMe to provide the Services. We reserve the right to identify you as the person who has made the referral in any messages that are sent to them. You can also provide us with information about yourself or other parties that are considered sensitive, such as political opinions, race, ethnicity, health information, or religious beliefs. If you post this information in a fundraiser, you choose to provide such information to be published publicly in relation to your fundraiser, donation, or otherwise. Subject to applicable law, GoFundMe may process any information that has manifestly been made public, including by processing information about you that reveals sensitive information. Chats and Other Communications with Us: such as for troubleshooting or support services. We may engage vendors to provide certain interactive features on our Services. Your use of these interactive features is voluntary, and we may retain the information that you submit through these features. For example, we may offer an interactive chat feature on the Services for customer service purposes. When you participate in the interactive chat, the contents of the chat may be captured and kept as a transcript. By using these features, you understand that we and our vendors on our behalf may, on a real-time basis, collect and process the information obtained through the feature. We would ask that you take care not to send financial or health information or other sensitive personal data to us through our chat services or other means unless we ask you specifically for that data as part of providing the Services to you. When you provide such information to us directly, you consent to the processing of this data by GoFundMe and/or our vendors. We collect the information listed in this section for the purposes described below in the sections “Our Use of Information Collected” and “Our Disclosure of Information Collected About You.” Biometric Information: We sometimes engage vendors to collect biometric information for identity verification, regulatory compliance, and fraud prevention purposes. We or the vendors we engage may collect a copy of your government-issued ID (i.e., your driver’s license, state ID card, or passport) and a scan of the picture on your government-issued ID for identification purposes. Our vendors may, with your consent, employ facial recognition technology to verify your identity and share the results of their analysis with us, if needed. GoFundMe does not have access to or otherwise collect or maintain any biometric information. Your biometric information will be retained by our vendors, and subject to their retention policies and privacy policies. B. Information We Collect from Other Parties: GoFundMe may use vendors to improve the quality of our own user database so that we might improve our Services to you, for verification and fraud prevention purposes, and as otherwise described in this Notice. In addition, GoFundMe obtains contact details and other personal information regarding media contacts and influencers from various groups such as Cision and MuckRack. See the Cision privacy policy and the Muck Rack privacy policy for further information. One of the special features of the Services is that they allow you to enable or log into the Services via various applications/services, including social media applications/services, like Facebook, X, Google or Apple, or to upload videos using YouTube APIs (each and collectively, the “Third-Party Service(s)”). By directly integrating these Third-Party Services, we aim to make your online experiences richer and more personalized. To take advantage of these features, we will ask you to provide your credentials for the applicable Third-Party Services in order to log in to our Services. When you add a Third-Party Services account to the Services or log into the Services using your Third-Party Services account, we will collect the relevant information necessary to enable the Services to access that Third-Party Service. As part of such integration, the Third-Party Service will provide us with access to certain information that you have provided to the Social Networking Service and made available to us based on your privacy settings with the Third-Party Service (for example, your name and photograph, as well as other information that you permit the Third-Party Service to share with us). We will use, store, and disclose such information in accordance with this Notice. However, please remember that the manner in which Third-Party Services use, store, and disclose your information is governed by the policies of such third parties, and GoFundMe shall have no liability or responsibility for the privacy practices or other actions of any Third-Party Services that may be enabled within the Services. For example, if you upload a video onto your fundraiser using the mobile application for the Services, your video will be uploaded using YouTube and subject to Google’s Privacy Policy and Google’s Terms of Service. You further acknowledge that if you choose to use this feature, your friends, followers, and subscribers on any Third-Party Services you have enabled may be able to view such activity. For example, if you sign on using Meta, Meta’s Privacy Policy and Terms of Service would apply to the data Meta might obtain from your activities on GoFundMe. Similarly, if you sign on using Google, Google’s Privacy Policy and Google’s Terms of Service would apply to the data Google might obtain from your activities on GoFundMe. Please visit the terms of use and privacy policy of the relevant Third Party Service to learn more about your rights and choices, and to exercise your choices about those technologies. C. Information That is Passively or Automatically Collected: I. Device & Usage Information: When you interact with GoFundMe through the Services, we automatically receive and store certain information from devices that you use to access the Services such as your IP address. This information is collected passively by using various technologies and includes the type of Internet browser or mobile device you use, any website from which you have come to the Services, your operating system, and inferred location data through an IP address that identifies the city and state where you logged into the Services. GoFundMe either stores such information itself or such information is included in databases owned and maintained by GoFundMe, and/or its agents or vendors. II. Location Information: When you use the Services to organize a fundraiser, the Services may require that you provide your postcode/zip code, city or town, and state or province of residence. Please keep in mind that other users of the Services can view your postcode/zip code, city or town, and state or province of residence in connection with the fundraiser. If you install our mobile application, we may ask you to grant us access to your mobile device’s precise geolocation data. If you grant such permission, we may collect information about your precise geolocation, and we may use that information to improve the Services, such as providing you with location-based features (e.g. to prepopulate your post code/zip code or to identify fundraisers near you). We also use your location information as described in this Notice, such as described above under “Device & Usage Information”, and in an aggregate way, as described below in the “Aggregated Data” section. You may opt out of pr"
