["https://gofundme.com/c/fundraising-tips"]
title = "Start Here: The Top 9 Fundraising Tips"
description = "What does it take to have a successful fundraiser? No matter what cause you're raising money for, here are 8 fundraising tips to set you up for success."
full_description = "We appreciate your feedback. For more ways to set your fundraiser up for success, here are our top fundraising tips. Fundraising Tips 9 Fundraising Tips For a Successful Fundraiser Are you looking to raise money for an important cause? You can reach your fundraising goals with these top fundraising tips and make your GoFundMe fundraiser successful. Start a GoFundMe .block_bc0c5fd6111dc7997fd7aa2fbb5acc8d { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_bc0c5fd6111dc7997fd7aa2fbb5acc8d { margin: 0px 0 50px 0 !important; } } 1. Write a descriptive fundraiser title Your fundraiser title is an important aspect of your fundraiser—that’s why we made tools to help you create one. Using your fundraiser story, we will automatically suggest a few fundraiser titles designed to inspire supporters. Select whichever suggested title you like best, or try writing your own: The title of your fundraiser should make clear what you are fundraising for, including names when applicable. Try starting your fundraiser title with an action word such as ‘help,’ ’support,’ or ‘donate.’ Example: “Help John Doe get a new wheelchair” 2. Be as detailed as possible in your fundraiser story When writing your fundraiser story, be specific about what you are fundraising for whenever possible, and tell a compelling story in honest and heartfelt words you’d use to explain your cause to a friend. Aim for a fundraiser story that highlights details potential donors would need to understand why you are fundraising, we have seen that at least 550 characters is a good length. Answer basic questions, such as: Who is the fundraiser for? Why is this fundraiser important to you? How do you know the person you are raising money for (if it is not yourself)? Break down the costs that make up your fundraising goal. For example, “How the funds raised will be used: $1,000 will be used for medical transportation and $9,000 will cover Jennifer’s unpaid leave from work to care for her children.” 3. Choose high-quality photos for your fundraiser One of the best fundraising tips is adding high-quality, personal photos to your fundraising page to help potential donors connect with your story. Choose a clear, high-resolution feature photo for your fundraiser image. Avoid using stock imagery if possible. If you have more images or a YouTube video that will help tell your fundraiser story and show donors what you are fundraising for, you can add them in the fundraiser description or a fundraiser update. 4. Use suggested goals Setting a fundraiser goal can feel tricky, but we’re here to help. We suggest a goal amount based on fundraisers with similar locations, categories, etc. that found success on GoFundMe in the last year. Using our suggested goal is a great way to put your fundraiser on par with other causes on our platform. You can always choose a goal amount different from our suggestion, and edit your goal at any time. 5. Try GoFundMe’s smart social media tools Creating a fundraiser is the start of the journey. Sharing is just as important, and you shouldn’t need to be a social media expert to spread the word. Our smart social media tools make sharing your fundraiser easier and better than ever. When you click ‘share’, we’ll use your fundraiser to automatically generate a custom social media caption, images, and videos that are ready to post across Facebook, Instagram, TikTok, X, and more. These are optional, but can help you easily share quality content on social media. You can also edit any text suggestions. 6. Spread the news about your fundraiser in different ways Sharing your fundraiser in many different ways helps increase its visibility. You can use the social media ‘share’ buttons on your GoFundMe to share your fundraiser link on Facebook, Instagram, TikTok, WhatsApp, Nextdoor, and by email. We’ve seen that each time someone shares their fundraiser in a new way, it can lead to a 2.5x increase in the fundraiser’s visibility. Share your fundraiser ‘offline’ as well by telling people in-person or posting flyers. 7. Be specific when sharing your fundraiser Avoid simply sharing the fundraiser link. Include a sentence or two about why you are fundraising to help donors understand your goals. Example: “I am raising money to help my uncle, John Doe, get a new wheelchair. His old wheelchair is broken and he cannot get around without one. Please consider donating $10 to help me get him a new wheelchair.” Consider asking people to donate specific amounts. Whether it’s $5, $25, or $50, we have seen that a suggested donation can help donors decide. For example: “Will you consider donating $20 to my fundraiser to help rebuild our family’s kitchen after the recent storms affected our home?” 8. Post regular updates to your fundraiser One of the top fundraising tips is to post an update to your fundraiser within seven days of starting it. Then continue doing so every week or at major milestones to keep donors engaged and encourage them to keep sharing. Post updates when you’re halfway to your goal and when you’re one week away from needing the money. Our data shows that frequent text, photo, and video updates can help you raise 3x more. Share your updates on the social media platform(s) you use, such as Facebook, Instagram, TikTok, WhatsApp, etc. To learn how to add an update to your fundraiser, check out this help center article. 9. Thank your donors Thanking your donors for their support is an important way to show your gratitude and also to enlist further help. Here are a few ways you can show your appreciation: Use the ‘thank your donors’ feature on your fundraiser dashboard to individually thank donors for their support. Some people like being thanked publicly, and your thank you message might inspire others to give too. You can thank your donors via social media as a way to publicly show thanks. Write a thoughtful letter or email. To learn how to thank donors using your fundraiser dashboard, check out this help center article. Explore the online fundraising tips on this page: Start a GoFundMe .block_87b90e920c832ecb9632bc4bdcc1bb60 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_87b90e920c832ecb9632bc4bdcc1bb60 { margin: 0px 0 50px 0 !important; } } Looking for more tips on fundraising? Start here Tips for sharing your GoFundMe fundraiser Tips for using video in your GoFundMe fundraiser Tips for telling a great fundraiser story .block_ebfe95f3be6584e7066f5a14fd7c7095 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_ebfe95f3be6584e7066f5a14fd7c7095 { margin: 0px 0 50px 0 !important; } } Start a GoFundMe .block_4559a9d57877d0debe66466701f4f048 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_4559a9d57877d0debe66466701f4f048 { margin: 0px 0 50px 0 !important; } } Browse all of our top fundraising tips Sharing your fundraiser Writing a campaign title Writing a funding proposal Promoting your fundraiser online Choosing the right images Adding video to your fundraiser Using social media to share your fundraiser Posting fundraiser updates Sharing your fundraiser with local media Using the GoFundMe ‘team’ feature to help your fundraiser"
