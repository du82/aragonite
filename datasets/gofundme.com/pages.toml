full_description = "Accessibility Statement .block_61b91bac6441c { margin: px 0 px 0 !important; } @media(max-width: 767px) { .block_61b91bac6441c { margin: px 0 px 0 !important; } } Our Commitment to Accessibility GoFundMe is committed to making our website’s content accessible and user friendly to everyone. If you are having difficulty viewing or navigating the content on this website, or notice any content, feature, or functionality that you believe is not fully accessible to people with disabilities, please email us at adacompliance@gofundme.com with “Disabled Access” in the subject line and provide a description of the specific feature you feel is not fully accessible or a suggestion for improvement. We take your feedback seriously and will consider it as we evaluate ways to accommodate all of our customers and our overall accessibility policies. Additionally, while we do not control such vendors, we strongly encourage vendors of third-party digital content to provide content that is accessible and user friendly."
