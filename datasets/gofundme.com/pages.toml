full_description = "GoFundMe Terms of Service Questions about our terms? Contact Us .block_f8215fa6a595345e8819305fc17adf85 { margin: 0px 0 50px 0 !important; } @media(max-width: 767px) { .block_f8215fa6a595345e8819305fc17adf85 { margin: 0px 0 50px 0 !important; } } Effective Date: September 1, 2024 1. Introduction 1.1. Purpose of the Terms: Welcome to GoFundMe! These Terms of Service, which we may update from time to time, apply to the GoFundMe Platform, including our website at www.gofundme.com, mobile apps, and any new features we might add. These Terms of Service are important because they help define our relationship with you as you use the Platform. “GoFundMe,” “we,” “us,” “our,” and other similar terms, shall refer to the party you are contracting with. 1.2. Acceptance of Terms: By using any of the Services or the Platform, you’re agreeing to these Terms of Service. This means you understand and accept all the rules about using our Services. Whether you are contributing to a Fundraiser as a Donor, starting a Fundraiser, withdrawing funds as an Organizer, Beneficiary, or NPO, or otherwise interacting with the Services, these terms apply to you. Depending on where you live, you might be entering into this agreement with different GoFundMe entities. If you are located in the United States, you are contracting with GoFundMe, Inc. If you are located in Australia, you are contracting with GoFundMe Australia PTY Ltd. in Australia. If you are located anywhere else in the world, you are contracting with GoFundMe Ireland Limited. However, GoFundMe, Inc. may apply, and exercise our rights under, these Terms of Service on behalf of the party that you are contracting with. Please see the bottom of these Terms of Service for the addresses and contact information for each of these GoFundMe entities. 1.3. Quick Note on Arbitration: If you’re using GoFundMe in the United States, Australia or Canada, you need to know about our arbitration agreement. By using our Services, you are agreeing that if there’s a disagreement or legal issue between you and GoFundMe, it will be resolved through binding arbitration, not in court. You also waive your right to be part of a class action lawsuit or to have a jury trial. Please make sure to read the “Dispute Resolution & Arbitration” section of these Terms of Service for more details. 2. Definitions These are the key terms that you need to know that will be referenced throughout these Terms of Service: 2.1. Account: A unique account created by a user to access and utilize GoFundMe’s Services, which includes personal information, credentials, and activity logs. 2.2. Affiliates: Any entity that directly or indirectly controls, is controlled by, or is under common control with GoFundMe. This includes subsidiaries, parent companies, and any other related entities. 2.3. Beneficiary: The individual, group or entity for whose benefit the corresponding Fundraiser is conducted and who is the intended recipient of the funds raised. 2.4. Certified NPO: Any 501(c)(3) non-profit organization that has successfully enrolled with the PayPal Giving Fund to receive donations. 2.5. Donor: Any individual or entity that contributes funds to a Fundraiser on or through the Services. 2.6. Fundraiser: A campaign initiated on the Services with the goal of raising funds for a specific purpose for a Beneficiary. 2.7. NPO: A non-profit organization (including churches, universities or other educational institutions) that is established for charitable purposes under applicable laws and is eligible to receive donations through the Platform. 2.8. Organizer: An individual or entity (including a non-profit organization) who initiates and manages a fundraiser on the Platform. 2.9. Platform: The entire suite of online Services provided by GoFundMe and its Affiliates, including our website, mobile applications, and any related services or technologies. 2.10. Recurring Fee: A recurring fixed fee that we may charge when donors set up a recurring donation to a Fundraiser. To learn more about the Platform and the applicable Recurring Fee, visit GoFundMe Pricing. 2.11. Services: The various features, functionalities, and tools provided by GoFundMe and its Affiliates through its Platform, enabling Users to create and manage Fundraisers, donate and interact with each other. 2.12. Services Content: All content and materials provided by GoFundMe on the Services, including text, graphics, logos, images, and software, excluding User Content. 2.13. Software: The proprietary software and applications provided and owned by GoFundMe that enable users to access and use the Services. 2.14. Third Party Resources: Any websites, Services, content, or resources provided by entities other than GoFundMe or its Affiliates, which may be accessible through the Services. 2.15. Transaction Fee: A fee charged by GoFundMe or its payment processors for processing donations. To learn more about the Platform and the applicable Transaction Fee, visit GoFundMe Pricing. 2.16. Transfers: The process of moving funds raised through the Services to the Beneficiary’s bank account or other designated account. 2.17. User: Any individual or entity that accesses, registers for, or uses the Platform, including Organizers, Donors, and Beneficiaries. 2.18. User Content: Any content, including text, images, videos, and other materials, that a User posts, uploads, submits, or otherwise makes available or shares with other Users on or through the Services. 2.19. User Conduct: The behaviors and actions of Users while using or otherwise accessing the Services. 3. The Services We Provide 3.1. Description of the Services provided: We offer a Platform for individuals, entities, or nonprofits to create Fundraisers to collect monetary donations from Donors for themselves or a third party who will benefit from the funds. We also operate Classy.org via our affiliate, Classy, Inc., providing specialized services to nonprofit and other organizations mainly in the US. 3.2. Our Role and Limitations: Our Services are a tool for running Fundraisers and for helping Organizers connect with Donors; we are not a bank, payment processor, broker, charity, or financial advisor. We do not solicit donations, the existence of the Services is not a solicitation of donations, and we do not engage in solicitation activities for ourselves or others on our Platform. All information provided through our Services is for your general knowledge and isn’t meant to be professional advice. If you need specific advice, especially regarding financial, legal, or tax issues, you should consult with a professional. We do not control or endorse any User, Fundraiser, or cause, and we can’t guarantee the success of a Fundraiser. As a Donor, it’s up to you to decide if a cause is worth contributing to. 3.3. Modification, Suspension, or Termination of the Services: We can change, pause, or stop all or some of the Services at any time and for any reason. We will try to avoid any problems this might cause you or others, but sometimes we might not be able to give you advance notice, especially if it’s an emergency or required by law. We are not responsible for any issues that these changes might cause. 4. Account Creation and Eligibility Requirements 4.1. What You Need for Registration: When you sign up to use certain Services, you must provide information that is correct and complete about yourself, your organization, or your NPO. This includes your real name, address, phone number and any photos or videos that you may provide, if you’re organizing the Fundraiser. It’s important to always keep this information up to date to ensure everything runs smoothly. Our Privacy Notice and these Terms of Service govern the registration data and any other information you provide. 4.2. Compliance with Third-Party Services: You might also need to register with third-party payment processors we work with, which may involve agreeing to their terms (provided under the Payment Processor section below). If, at any point, we or our payment processors discover that the information you provided to us is inaccurate, violates our Terms of Service or terms of service of our payment processors, or if you misuse the funds, we may immediately suspend or terminate your access to all or some of our Services. You could also face criminal charges by relevant governmental authorities. 4.3. Age Restrictions: If you are under 13 years old (or under 16 in the European Economic Area, the United Kingdom, or Switzerland), you cannot use the Platform or Services, even with registration. If you’re not yet an adult in your area, which usually means being under 18 or 19 depending on the law where you live, you can only use our Platform or Services with your parent’s or guardian’s permission. 4.4. Keeping Your Account Safe: You are responsible for keeping your password and account information confidential. Do not share your password with anyone. If you think someone else has used your Account without your permission, you should tell us right away. Also, always remember to log out of your Account when you’re done using it, especially if you’re on a computer that others can use too. If you don’t keep your Account safe and comply with these Terms of Service, GoFundMe won’t be responsible for any losses that you may incur. For more information on how to keep your account safe, visit our Account security page. 4.5. Mobile Services and Text Messages: The Services include certain features that may be made available via a mobile device, including the ability to: (i) upload User Content to the Platform; (ii) browse the Platform; and (iii) access certain items through an application downloaded and installed on a mobile device (collectively, the “Mobile Services”). To the extent you access Mobile Services, your wireless service carrier’s standard charges, data rates and other fees may apply. In addition, downloading, installing, or using certain Mobile Services may be prohibited or restricted by your carrier, and not all Mobile Services may work with all carriers or devices. By using the Mobile Services, you agree that we may communicate with you about matters related to your Account or security by SMS, MMS, text message or other electronic means to your mobile device and that certain information about your usage of the Mobile Services may be communicated to us. Further, when setting up your GoFundMe Account, if you click “Send code” by “Text Message,” you agree to receive automated and non automated text messages related to your Account from or on behalf of GoFundMe at the phone number provided. You can reply STOP to such text messages to cancel, except for automated text messages related to the security of your Account. Message frequency will vary. Message and normal data rates may apply. We will comply with any additional requirements that may apply under local laws and regulations before communicating with you in this manner. In the event that you change or deactivate your mobile telephone number, you agree to promptly update your GoFundMe Account information to ensure that your messages are not sent to the person that acquires your old number. 5. Payment Processors GoFundMe itself does not hold any funds raised on our Platform, nor does it handle the actual processing of payments. Instead, we use third-party payment processors to manage and process all donations for Fundraisers. To Transfer funds from a Fundraiser, you must provide your bank account details to our payment processor partners. By making a Donation, setting up a Fundraiser or accepting the role of Beneficiary to a Fundraiser, you agree to the processing, use, Transfer or disclosure of data by the Payment Processors pursuant to these Terms of Service as well as any and all applicable terms set forth by the applicable Payment Processors. Our current Payment Processors include: Adyen LLC (Adyen’s terms and conditions), Stripe, Inc. (Stripe’s terms of service), and PayPal, Inc. (PayPal’s terms of service), and PayPal Giving Fund terms. Our current payment processor for Organizers and Beneficiaries located in the EEA, Switzerland and the UK is Adyen N.V. which contracts with GoFundMe Ireland, Ltd. Please see Adyen N.V.’s terms and conditions here. GoFundMe’s payment partner in Australia is Adyen Australia. Adyen Australia contracts with GoFundMe’s Australian entity, GoFundMe Australia Pty Ltd (ACN 627 702 630), is the contracting party responsible for transactions benefitting the Australian User. For more information, please see Combined Financial Services Guide and Product Disclosure Statement. For more details, including how we handle data with these third party payment processors, please refer to our Privacy Notice, Adyen LLC (Adyen’s terms and conditions), Stripe, Inc. (Stripe’s terms of service), and PayPal, Inc. (PayPal’s terms of service). 6. User Responsibilities and Obligations 6.1. Organizers: As an Organizer, you represent and warrant that all the information you provide (whether directly, or through an agent or by using artificial intelligence) about your Fundraiser is accurate, complete, and clear. You are responsible for describing on your Fundraiser how funds will be used, and ensuring the funds raised are only used for that specific purpose. You may post updates to your Fundraiser so Donors know how their money is being used, and any other relevant information. If you are raising funds on behalf of someone else, you must ensure that all funds raised are given to or spent on behalf of that Beneficiary. By adding a Beneficiary, you relinquish control of the donations for your Fundraiser to the Beneficiary. When you organize a Fundraiser, you agree to follow all laws and regulations related to your Fundraiser, including but not limited to those about taxes and donations. If you are using personal data from anyone, including but not limited to their name, image or likeness, you must have their valid legal permission to share it with us and post it on the Services. You also agree not to provide or offer to provide goods or services in exchange for donations. We may share information about your Fundraiser with Donors, the Beneficiary, legal authorities, and as otherwise described in our Privacy Notice. (a) Maintaining Accurate Information: Keeping your registration details accurate and current is essential. This includes updating your name, address, and any images or videos you use to represent yourself, your organization, or your NPO. This helps maintain transparency and trust with Donors and ensures compliance with these Terms of Service and applicable legal requirements. (b) You Agree to Cooperate: When you organize a Fundraiser on GoFundMe, you agree to fully cooperate with any request for evidence that we deem necessary to verify your compliance with these Terms of Service. Our requests may include, but are not limited to, asking that you: (a) explain how funds were or will be handled; (b) supply documentary eviden"
