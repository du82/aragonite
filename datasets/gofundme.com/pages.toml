title = "How to Get Emergency Rent Assistance"
description = "Need emergency rent assistance? Explore valuable resources and tips to secure your housing."
full_description = "Home GoFundMe Blog How to Get Emergency ... How to Get Emergency Rent Assistance December 6, 2024 | 9 min read Financial Assistance Mandy and her partner had just found their footing after moving across the country. Then an unexpected expense took a huge bite out of their budget and left them in need of an emergency rental assistance program. “My car failed inspection, and to pass I needed a $1,000 repair,” Mandy recalls. “I had 10 days to get it fixed and our rent was due next week.” Mandy and her partner were already barely getting by. They both had low-paying jobs. Mandy’s paycheck was dependent on how many shifts she could pick up at the grocery store where she worked. It was either pay their $850 rent, or fix her car. Reluctantly, Mandy reached out to her mother for help in search of rent assistance. “We didn’t know what else to do,” Mandy says. “If I couldn’t drive my car, I couldn’t get to work.” Mandy’s struggle is not unique. Many people are only one emergency expense away from not being able to cover their basic bills. In fact, a recent study by the United Way Alice Project found that a whopping 43% of US households can’t pay their monthly expenses (including housing, food, transportation, child care, health care, and a monthly smartphone bill). The largest of these expenses is usually rent. Start your fundraiser Why people need help with rent According to Hud User, renters that put more than 30% of their income toward rent are “cost-burdened.” This means they may have trouble affording other necessities and will likely need help with rent. “That’s hard in a lot of rental markets for people,” says Laura Scherler, senior director of economic mobility and corporate solutions at United Way. She added that there are people who spend upwards of 40 or 50% of their income on rent. “It leaves them vulnerable if their car breaks down, or their kids get sick. Anything unexpected will throw them off. It doesn’t give them any wiggle room to manage those crises.” That was the case for Mandy. She and her partner had already exhausted their savings for their move when they had to get her car fixed. Mandy estimates that they were paying close to 50% of their shared income toward rent. “We didn’t have any savings to fall back on,” Mandy says, adding that saving even $20 per paycheck (as Scherler recommends) was incredibly difficult for the couple at the time. Financial challenges are widespread According to a recent survey from Bankrate only about 48% of U.S. adults say they have enough savings to cover expenses for three months. The same Bankrate survey also found that only about 22% have no emergency savings at all. There are many reasons that someone could be in need of short-term help and would want to know how to get help with rent. Volunteers of America (VOA) is a national nonprofit organization that helps people find affordable housing, particularly veterans, senior citizens, families, and people with disabilities. VOA has identified these reasons for the increase in need for their services: Wages are not increasing at a proportional rate to the consistently increasing property values and low vacancy rates. Property values and rent continue to increase at a rate that tenants can’t keep up with, leading to struggles with paying rent. Increasingly long waiting lists for subsidized housing. Waitlists of 2-3 years for low-income families and singles make paying rent in higher rental units more difficult. While the problem may be on the rise, there are ways to raise money for rent. How to get help paying rent If you’re having trouble paying your rent, here is a list of a few different ways to get rent assistance. 1. Read your lease Find out your rights as a tenant. Look to see what happens if your payment is late or if you miss a month, and when eviction proceedings would begin. Usually, it takes 90 days after you receive the notice for the eviction proceedings to start, Scherler says, so there is some time to work with. “If you miss one rent payment, but make your following month’s payment, you may not be evicted,” Scherler says. 2. Talk to your landlord Landlords can sometimes be forgiving if you fall on temporary hard times. If you are a good tenant and have a good relationship with your landlord, they may be willing to work with you. Ask if they will accept a late payment or if you can pay your rent in installments. 3. Reach out to nonprofits Fortunately, there are a few programs that have the mission of helping with rent assistance. Nonprofit organizations can fill the need for help when the government cannot. Both Catholic Charities and The Salvation Army may be able to provide emergency help with rent and utility bills. Contact your local Salvation Army center or Catholic Charities and ask for an application to find out if you’re eligible for housing assistance. With The Salvation Army, applicants meet with a caseworker as part of the eligibility process. There are other organizations that help with rent. One option is calling 2-1-1, a 24-hour helpline administered by United Way that connects people in need of assistance to resources in their communities. Of the 15 million calls and emails asking 2-1-1 for help in 2017, 4.4 million were for housing and utility help. That call volume was the highest percentage of any category, Scherler says. “I think, unfortunately, housing is a tough one,” Scherler says. “That is a big challenge in a lot of communities.” Another national nonprofit organization that provides assistance is Modest Needs, which provides grants for a one-time emergency expense. People have to apply for a grant through Modest Needs. If approved, the nonprofit posts the grant request on its public website and allows donors to review and support the grant requests that matter most to them. When the organization funds a grant request, they remit payment directly to the vendor shown in the applicant’s documentation. Most requests get met within two weeks, Taylor says, and many of the grant applications have to do with covering living expenses that applicants can’t afford due to a short-term financial emergency. 4. Look into other ways to boost your household income Ask your friends and family members for a loan, a business opportunity, or see if you can get a payroll advance from your employer. Some companies may also have a financial hardship fund to provide emergency rent help for employees. 5. Consider crowdfunding Crowdfunding is a great solution. A good way to alert friends and family to your situation is by starting an online fundraiser on GoFundMe. They provide fundraising so you get to keep more of the funds you raise for assistance with rent. You might be surprised how supportive your friends and family are in helping you get back on your feet. 6. Rental help for veterans If you’re a veteran, the U.S. Department of Veterans Affairs provides help for homeless veterans. Nonprofit organizations like Veterans Inc. may also be able to help those who need help with rent through its housing program. If you’re disabled, the federal government has an assistance program to provide funding to develop and subsidize low income rental housing for adults with disabilities. 7. Government aid Unfortunately, the federal government provides only limited help to pay emergency rent costs. The federal department of Housing and Urban Development (HUD) provides help through its housing choice voucher program, but there are often long waitlists, Scherler says. The government does provide some emergency funding. It’s generally administered through the state agencies, but unless you’re facing eviction, the help is hard to get. “You almost have to get to the point of crisis before you’re able to get assistance,” Scherler says. A rent crisis can signal a deeper need By taking a look at the big picture when faced with a one-time, emergency expense, people can avoid years of financial struggle or even homelessness. For Mandy, her rent struggle was a sign that she and her partner needed more help to get by than they wanted to admit. They had been considering applying for Supplemental Nutrition Assistance Program (commonly referred to as SNAP), but their financial crisis caused them to seek help right away. “We felt terrible,” Mandy says. “We wanted so badly to be self-sufficient, but we just couldn’t make it work.” There are a number of resources available if you are in a situation like Mandy’s, and many continue to provide help after the crisis has passed. Volunteers of America has the following advice if you need help paying rent: Take an active role in formulating an action plan to end your crisis situation with short-term and long-term solutions. Avoid ignoring the problem until the last minute. Don’t panic or make rash decisions, as there are community resources and supports in place to get you through this situation. Consider taking budgeting classes to determine how to pay your rent in your city, or if you need to find a cheaper place to live. “If you have this sneaking suspicion that next month you might not make the rent, you need to start looking right now,” Taylor says. “It’s important to be proactive and really get out there.” There’s no shame in asking for help Regardless if you’re asking for help through a nonprofit organization, a government agency, friends or family, or crowdfunding, don’t feel embarrassed. “Everyone falls on tough times,” Mandy says. “It happens to more of us than people realize.” So if you’re struggling and need to raise money for rent, take a deep breath. Contact your landlord, a nonprofit organization, send an email to your friends and family, or start a crowdfunding fundraiser. Most importantly, remember that you are not alone. Sometimes we all need a little help. For additional information, please read our posts Get Immediate Help During a Personal Financial Crisis, Fundraising for Coronavirus Relief: How You Can Help the Fight, and Need Emergency Financial Assistance? These Resources Can Help. Start a fundraiser Share article Written by GoFundMe Start a fundraiser Fundraising resources Fundraising ideas Fundraising tips Latest posts How to Choose the Best Crowdfunding Website for Your Next Fundraiser 10 min read How to Get Help For Paying Unplanned Bills: What You Need to Know 10 min read Ultimate Guide to Finding Help with Moving Costs 7 min read Start a fundraiser"
