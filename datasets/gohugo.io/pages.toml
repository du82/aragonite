["https://gohugo.io/getting-started/configuration-build"]
title = "Configure build"
description = "Configure global build options."
full_description = '''DocsGetting startedConfigure buildConfigure buildConfigure global build options.Getting Started FundamentalsThe build configuration section contains global build-related configuration options.hugo. yaml toml jsonbuild: buildStats: disableClasses: false disableIDs: false disableTags: false enable: false cacheBusters: - source: (postcss|tailwind)\.config\.js target: (css|styles|scss|sass) noJSConfigInAssets: false useResourceCacheWhen: fallback [build] noJSConfigInAssets = false useResourceCacheWhen = 'fallback' [build.buildStats] disableClasses = false disableIDs = false disableTags = false enable = false [[build.cacheBusters]] source = '(postcss|tailwind)\.config\.js' target = '(css|styles|scss|sass)' { "build": { "buildStats": { "disableClasses": false, "disableIDs": false, "disableTags": false, "enable": false }, "cacheBusters": [ { "source": "(postcss|tailwind)\\.config\\.js", "target": "(css|styles|scss|sass)" } ], "noJSConfigInAssets": false, "useResourceCacheWhen": "fallback" } } buildStatsSee Configure buildStats.cachebustersSee Configure Cache Busters.noJSConfigInAssets(bool) If true, turns off writing a jsconfig.json into your assets directory with mapping of imports from running js.Build. This file is intended to help with intellisense/navigation inside code editors such as VS Code. Note that if you do not use js.Build, no file will be written.useResourceCacheWhen(string) When to use the resource file cache, one of never, fallback, or always. Applicable when transpiling Sass to CSS. Default is fallback.Configure cache bustersThe build.cachebusters configuration option was added to support development using Tailwind 3.x’s JIT compiler where a build configuration may look like this:hugo. yaml toml jsonbuild: buildStats: enable: true cachebusters: - source: assets/watching/hugo_stats\.json target: styles\.css - source: (postcss|tailwind)\.config\.js target: css - source: assets/.*\.(js|ts|jsx|tsx) target: js - source: assets/.*\.(.*)$ target: $1 [build] [build.buildStats] enable = true [[build.cachebusters]] source = 'assets/watching/hugo_stats\.json' target = 'styles\.css' [[build.cachebusters]] source = '(postcss|tailwind)\.config\.js' target = 'css' [[build.cachebusters]] source = 'assets/.*\.(js|ts|jsx|tsx)' target = 'js' [[build.cachebusters]] source = 'assets/.*\.(.*)$' target = '$1' { "build": { "buildStats": { "enable": true }, "cachebusters": [ { "source": "assets/watching/hugo_stats\\.json", "target": "styles\\.css" }, { "source": "(postcss|tailwind)\\.config\\.js", "target": "css" }, { "source": "assets/.*\\.(js|ts|jsx|tsx)", "target": "js" }, { "source": "assets/.*\\.(.*)$", "target": "$1" } ] } } When buildStats is enabled, Hugo writes a hugo_stats.json file on each build with HTML classes etc. that’s used in the rendered output. Changes to this file will trigger a rebuild of the styles.css file. You also need to add hugo_stats.json to Hugo’s server watcher. See Hugo Starter Tailwind Basic for a running example.sourceA regexp matching file(s) relative to one of the virtual component directories in Hugo, typically assets/....targetA regexp matching the keys in the resource cache that should be expired when source changes. You can use the matching regexp groups from source in the expression, e.g. $1.Configure build statshugo. yaml toml jsonbuild: buildStats: disableClasses: false disableIDs: false disableTags: false enable: false [build] [build.buildStats] disableClasses = false disableIDs = false disableTags = false enable = false { "build": { "buildStats": { "disableClasses": false, "disableIDs": false, "disableTags": false, "enable": false } } } If enable is set to true, creates a hugo_stats.json file in the root of your project. This file contains arrays of the class attributes, id attributes, and tags of every HTML element within your published site. Use this file as data source when removing unused CSS from your site. This process is also known as pruning, purging, or tree shaking.Exclude class attributes, id attributes, or tags from hugo_stats.json with the disableClasses, disableIDs, and disableTags keys.Given that CSS purging is typically limited to production builds, place the buildStats object below config/production.Built for speed, there may be “false positive” detections (e.g., HTML elements that are not HTML elements) while parsing the published site. These “false positives” are infrequent and inconsequential.Due to the nature of partial server builds, new HTML entities are added while the server is running, but old values will not be removed until you restart the server or run a regular hugo build.Last updated: February 27, 2025 : Remove some old new-in (03938c600)Improve this page'''
year_published = 2025
year_updated = 2025
clearnet = "https://gohugo.io/getting-started/configuration-build"
