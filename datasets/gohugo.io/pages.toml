["https://gohugo.io/about/security"]
title = "Security model"
description = "A summary of Hugo's security model."
full_description = '''DocsAboutSecuritySecurity modelA summary of Hugo’s security model.AboutRuntime securityHugo produces static output, so once built, the runtime is the browser (assuming the output is HTML) and any server (API) that you integrate with.But when developing and building your site, the runtime is the hugo executable. Securing a runtime can be a real challenge.Hugo’s main approach is that of sandboxing and a security policy with strict defaults:Hugo has a virtual file system and only the main project (not third-party components) is allowed to mount directories or files outside the project root.User-defined components have read-only access to the filesystem.We shell out to some external binaries to support Asciidoctor and similar, but those binaries and their flags are predefined and disabled by default (see Security Policy). General functions to run arbitrary external OS commands have been discussed, but not implemented because of security concerns.Security policyHugo has a built-in security policy that restricts access to os/exec, remote communication and similar.The default configuration is listed below. Any build using features not in the allow list of the security policy will fail with a detailed message about what needs to be done. Most of these settings are allow lists (string or slice, Regular Expressions or none which matches nothing).hugo. yaml toml jsonsecurity: enableInlineShortcodes: false exec: allow: - ^(dart-)?sass(-embedded)?$ - ^go$ - ^git$ - ^npx$ - ^postcss$ - ^tailwindcss$ osEnv: - (?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE)$ funcs: getenv: - ^HUGO_ - ^CI$ http: mediaTypes: null methods: - (?i)GET|POST urls: - .* [security] enableInlineShortcodes = false [security.exec] allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^tailwindcss$'] osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE)$'] [security.funcs] getenv = ['^HUGO_', '^CI$'] [security.http] methods = ['(?i)GET|POST'] urls = ['.*'] { "security": { "enableInlineShortcodes": false, "exec": { "allow": [ "^(dart-)?sass(-embedded)?$", "^go$", "^git$", "^npx$", "^postcss$", "^tailwindcss$" ], "osEnv": [ "(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE)$" ] }, "funcs": { "getenv": [ "^HUGO_", "^CI$" ] }, "http": { "mediaTypes": null, "methods": [ "(?i)GET|POST" ], "urls": [ ".*" ] } } } By default, Hugo permits the resources.GetRemote function to download files with media types corresponding to an internal allow list. To add media types to the allow list:hugo. yaml toml jsonsecurity: http: mediaTypes: - ^image/avif$ [security] [security.http] mediaTypes = ['^image/avif$'] { "security": { "http": { "mediaTypes": [ "^image/avif$" ] } } } Note that these and other configuration settings in Hugo can be overridden by the OS environment. For example, if you want to block all remote HTTP fetching of data:HUGO_SECURITY_HTTP_URLS=none hugo Dependency securityHugo is built as a static binary using Go Modules to manage its dependencies. Go Modules have several safeguards, one of them being the go.sum file. This is a database of the expected cryptographic checksums of all of your dependencies, including transitive dependencies.Hugo Modules is a feature built on top of the functionality of Go Modules. Like Go Modules, a Hugo project using Hugo Modules will have a go.sum file. We recommend that you commit this file to your version control system. The Hugo build will fail if there is a checksum mismatch, which would be an indication of dependency tampering.Web application securityThese are the security threats as defined by OWASP.For HTML output, this is the core security model:https://pkg.go.dev/html/template#hdr-Security_ModelIn short:Template and configuration authors (you) are trusted, but the data you send in is not. This is why you sometimes need to use the safe functions, such as safeHTML, to avoid escaping of data you know is safe. There is one exception to the above, as noted in the documentation: If you enable inline shortcodes, you also say that the shortcodes and data handling in content files are trusted, as those macros are treated as pure text. It may be worth adding that Hugo is a static site generator with no concept of dynamic user input.For content, the default Markdown renderer is configured to remove or escape potentially unsafe content. This behavior can be reconfigured if you trust your content.Last updated: May 20, 2024 : Add security.http.mediaTypes to security page (2f5d1712b)Improve this page'''
year_published = 2024
