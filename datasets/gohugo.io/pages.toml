title = "Templates"
description = "Create templates to render your content, resources, and data."
full_description = "DocsTemplatesIntroductionCreate templates to render your content, resources, and data.Template typesCreate templates of different types to render your content, resources, and data.Lookup orderHugo uses the rules below to select a template for a given page, starting from the most specific.Base templatesThe base and block construct allows you to define the outer shell of your master templates (i.e., the chrome of the page).Home page templatesThe home page of a website is often formatted differently than the other pages. For this reason, Hugo makes it easy for you to define your new site's home page as a unique template.Single templatesCreate a single template to render a single page.Section templatesCreate a section template to list its members.Taxonomy templatesCreate a taxonomy template to render a list of terms.Term templatesCreate a term template to render a list of pages associated with the current term.Partial templatesPartials are smaller, context-aware components in your list and page templates that can be used economically to keep your templating DRY.Content view templatesHugo can render alternative views of your content, useful in list and summary views.Shortcode templatesCreate custom shortcodes to simplify and standardize content creation.Sitemap templatesHugo provides built-in sitemap templates.RSS templatesUse the embedded RSS template, or create your own.404 templatesCreate a template to render a 404 error page.robots.txt templatesHugo can generate a customized robots.txt in the same way as any other template.MenusCreate templates to render one or more menus.PaginationSplit a list page into two or more subsets.Embedded templatesHugo provides embedded templates for common use cases.Custom output formatsHugo can output content in multiple formats, including calendar events, e-book formats, Google AMP, and JSON search indexes, or any custom text format."
