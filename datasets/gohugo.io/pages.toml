["https://gohugo.io/content-management"]
title = "Content management"
description = "Hugo makes managing large static sites easy with support for archetypes, content types, menus, cross references, summaries, and more."
full_description = '''DocsContent managementOrganizationHugo assumes that the same structure that works to organize your source content is used to organize the rendered site.Page bundlesUse page bundles to logically associate one or more resources with content.Content formatsCreate your content using Markdown, HTML, Emacs Org Mode, AsciiDoc, Pandoc, or reStructuredText.Front matterUse front matter to add metadata to your content.Build optionsBuild options help define how Hugo must treat a given page when building the site.Page resourcesUse page resources to logically associate assets with a page.Image processingResize, crop, rotate, filter, and convert images.ShortcodesUse embedded, custom, or inline shortcodes to insert elements such as videos, images, and social media embeds into your content.Related contentList related content in "See Also" sections.SectionsOrganize content into sections.Content typesHugo is built around content organized in sections.ArchetypesAn archetype is a template for new content.TaxonomiesHugo includes support for user-defined taxonomies.SummariesCreate and render content summaries.Links and cross referencesShortcodes for creating links to documents.URL managementControl the structure and appearance of URLs through front matter entries and settings in your site configuration.MenusCreate menus by defining entries, localizing each entry, and rendering the resulting data structure.CommentsHugo ships with an internal Disqus template, but this isn't the only commenting system that will work with your new Hugo website.MultilingualLocalize your project for each language and region, including translations, images, dates, currencies, numbers, percentages, and collation sequence. Hugo's multilingual framework supports single-host and multihost configurations.Markdown attributesUse Markdown attributes to add HTML attributes when rendering Markdown to HTML.Syntax highlightingHugo comes with really fast syntax highlighting from Chroma.DiagramsUse fenced code blocks and Markdown render hooks to include diagrams in your content.MathematicsInclude mathematical equations and expressions in Markdown using LaTeX markup.Data sourcesUse local and remote data sources to augment or create content.Content adaptersCreate content adapters to dynamically add content when building your site.'''
