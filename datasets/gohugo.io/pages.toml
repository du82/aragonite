full_description = 'DocsGetting startedExternal resourcesExternal learning resourcesUse these third-party resources to learn Hugo.Getting StartedBooksHugo In ActionHugo in Action is a step-by-step guide to using Hugo to create static websites. Working with a complete example website and source code samples, you’ll learn how to build and host a low-maintenance, high-performance site that will wow your users and stay stable without relying on a third-party server." href="https://www.manning.com/books/hugo-in-action/" rel="external"> Author: Atishay JainPublisher: Manning PublicationsPublication date: March 2022Length: 488 pagesISBN: 9781617297007Build Websites with HugoIn this book, you’ll use Hugo to build a personal portfolio site that you can use to showcase your skills and thoughts to the world. You’ll build the basic skeleton, develop a custom theme, and use content templates to generate new pages quickly. You’ll use internal and external data sources to embed content into your site, and render some of your content in JSON and RSS. You’ll add a blog section with posts and integrate Disqus with your site, and then make your site searchable." href="https://pragprog.com/titles/bhhugo/build-websites-with-hugo/" rel="external"> Author: Brian P. HoganPublisher: Pragmatic BookshelfPublication date: May 2020Length: 154 pagesISBN: 9781680507263VideosHugo Beginner Tutorial SeriesWelcome to this introduction to Hugo tutorial. The goal of this series is to take you from a lion cub with basic web design knowledge to creating your first Hugo website. In this series you’ll learn how to set up a Hugo site, the basics of usingHugo layouts, partials, and templating, set up a blog, and finally use data files. By the end of this series you’ll have the foundational knowledge to build your own Hugo sites.Getting set up in HugoLayouts in HugoHugo PartialsHugo templating basicsBlogging in HugoUsing Data in HugoCreator: Mike NeumegenAffiliation: CloudCannonCreation date: April 2022Hugo Static Site GeneratorThis course covers the basics of using the Hugo static site generator. Work your way through the articles and we’ll teach you everything you need to know to create a professional and scalable website or blog!IntroductionWindows InstallationMac InstallationCreating A New SiteInstalling & Using ThemesContent OrganizationFront MatterArchetypesShortcodesTaxonomiesTemplate BasicsList Page TemplatesSingle Page TemplatesHome Page TemplatesSection TemplatesBlock TemplatesVariablesFunctionsConditionalsData TemplatesPartial TemplatesShortcode TemplatesBuilding & HostingCreator: Mike DaneAffiliation: Giraffe AcademyCreation date: September 2017Last updated: February 8, 2025 : Misc adjustments (5accec5f1)Improve this page'
