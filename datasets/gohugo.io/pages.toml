["https://gohugo.io/commands/hugo_mod"]
title = "hugo mod"
description = """
hugo mod Manage modules
Synopsis Various helpers to help manage the modules in your project’s dependency graph. Most operations here requires a Go version installed on your system (>= Go 1.12) and the relevant VCS client (typically Git). This is not needed if you only operate on modules inside /themes or if you have vendored them via “hugo mod vendor”.
Note that Hugo will always start out by resolving the components defined in the site configuration, provided by a _vendor directory (if no –ignoreVendorPaths flag provided), Go Modules, or a folder inside the themes directory, in that order."""
