["https://gohugo.io/getting-started/configuration"]
title = "Configure Hugo"
description = "How to configure your Hugo site."
full_description = '''DocsGetting startedConfigurationConfigure HugoHow to configure your Hugo site.Getting Started FundamentalsConfiguration fileCreate a site configuration file in the root of your project directory, naming it hugo.toml, hugo.yaml, or hugo.json, with that order of precedence.my-project/ └── hugo.toml With v0.109.0 and earlier the basename of the site configuration file was config instead of hugo. You can use either, but should transition to the new naming convention when practical.A simple example:hugo. yaml toml jsonbaseURL: https://example.org/ languageCode: en-us params: contact: email: info@example.org phone: +1 202-555-1212 subtitle: The Best Widgets on Earth title: ABC Widgets, Inc. baseURL = 'https://example.org/' languageCode = 'en-us' title = 'ABC Widgets, Inc.' [params] subtitle = 'The Best Widgets on Earth' [params.contact] email = 'info@example.org' phone = '+1 202-555-1212' { "baseURL": "https://example.org/", "languageCode": "en-us", "params": { "contact": { "email": "info@example.org", "phone": "+1 202-555-1212" }, "subtitle": "The Best Widgets on Earth" }, "title": "ABC Widgets, Inc." } To use a different configuration file when building your site, use the --config flag:hugo --config other.toml Combine two or more configuration files, with left-to-right precedence:hugo --config a.toml,b.yaml,c.json See the specifications for each file format: TOML, YAML, and JSON.Configuration directoryInstead of a single site configuration file, split your configuration by environment, root configuration key, and language. For example:my-project/ └── config/ ├── _default/ │ ├── hugo.toml │ ├── menus.en.toml │ ├── menus.de.toml │ └── params.toml └── production/ └── params.toml The root configuration keys are build, caches, cascade, deployment, frontmatter, imaging, languages, markup, mediatypes, menus, minify, module, outputformats, outputs, params, permalinks, privacy, related, security, segments, server, services, sitemap, and taxonomies.Omit the root keyWhen splitting the configuration by root key, omit the root key in the given file. For example, these are equivalent:hugo. yaml toml jsonparams: foo: bar [params] foo = 'bar' { "params": { "foo": "bar" } } params. yaml toml jsonfoo: bar foo = 'bar' { "foo": "bar" } Recursive parsingHugo parses the config directory recursively, allowing you to organize the files into subdirectories. For example:my-project/ └── config/ └── _default/ ├── navigation/ │ ├── menus.de.toml │ └── menus.en.toml └── hugo.toml Examplemy-project/ └── config/ ├── _default/ │ ├── hugo.toml │ ├── menus.en.toml │ ├── menus.de.toml │ └── params.toml ├── production/ │ ├── hugo.toml │ └── params.toml └── staging/ ├── hugo.toml └── params.toml Considering the structure above, when running hugo --environment staging, Hugo will use every setting from config/_default and merge staging’s on top of those.Let’s take an example to understand this better. Let’s say you are using Google Analytics for your website. This requires you to specify a Google tag ID in your site configuration:hugo. yaml toml jsonservices: googleAnalytics: ID: G-XXXXXXXXX [services] [services.googleAnalytics] ID = 'G-XXXXXXXXX' { "services": { "googleAnalytics": { "ID": "G-XXXXXXXXX" } } } Now consider the following scenario:You don’t want to load the analytics code when running hugo server.You want to use different Google tag IDs for your production and staging environments. For example:G-PPPPPPPPP for productionG-SSSSSSSSS for stagingTo satisfy these requirements, configure your site as follows:config/_default/hugo.tomlExclude the services.googleAnalytics section. This will prevent loading of the analytics code when you run hugo server.By default, Hugo sets its environment to development when running hugo server. In the absence of a config/development directory, Hugo uses the config/_default directory.config/production/hugo.tomlInclude this section only:hugo. yaml toml jsonservices: googleAnalytics: ID: G-PPPPPPPPP [services] [services.googleAnalytics] ID = 'G-PPPPPPPPP' { "services": { "googleAnalytics": { "ID": "G-PPPPPPPPP" } } } You do not need to include other parameters in this file. Include only those parameters that are specific to your production environment. Hugo will merge these parameters with the default configuration.By default, Hugo sets its environment to production when running hugo. The analytics code will use the G-PPPPPPPPP tag ID.config/staging/hugo.tomlInclude this section only:hugo. yaml toml jsonservices: googleAnalytics: ID: G-SSSSSSSSS [services] [services.googleAnalytics] ID = 'G-SSSSSSSSS' { "services": { "googleAnalytics": { "ID": "G-SSSSSSSSS" } } } You do not need to include other parameters in this file. Include only those parameters that are specific to your staging environment. Hugo will merge these parameters with the default configuration.To build your staging site, run hugo --environment staging. The analytics code will use the G-SSSSSSSSS tag ID.Merge configuration from themesThe configuration value for _merge can be one of:noneNo merge.shallowOnly add values for new keys.deepAdd values for new keys, merge existing.Note that you don’t need to be so verbose as in the default setup below; a _merge value higher up will be inherited if not set.hugo. yaml toml jsonbuild: _merge: none caches: _merge: none cascade: _merge: none contenttypes: _merge: none deployment: _merge: none frontmatter: _merge: none httpcache: _merge: none imaging: _merge: none languages: _merge: none en: _merge: none menus: _merge: shallow params: _merge: deep markup: _merge: none mediatypes: _merge: shallow menus: _merge: shallow minify: _merge: none module: _merge: none outputformats: _merge: shallow outputs: _merge: none page: _merge: none pagination: _merge: none params: _merge: deep permalinks: _merge: none privacy: _merge: none related: _merge: none security: _merge: none segments: _merge: none server: _merge: none services: _merge: none sitemap: _merge: none taxonomies: _merge: none [build] _merge = 'none' [caches] _merge = 'none' [cascade] _merge = 'none' [contenttypes] _merge = 'none' [deployment] _merge = 'none' [frontmatter] _merge = 'none' [httpcache] _merge = 'none' [imaging] _merge = 'none' [languages] _merge = 'none' [languages.en] _merge = 'none' [languages.en.menus] _merge = 'shallow' [languages.en.params] _merge = 'deep' [markup] _merge = 'none' [mediatypes] _merge = 'shallow' [menus] _merge = 'shallow' [minify] _merge = 'none' [module] _merge = 'none' [outputformats] _merge = 'shallow' [outputs] _merge = 'none' [page] _merge = 'none' [pagination] _merge = 'none' [params] _merge = 'deep' [permalinks] _merge = 'none' [privacy] _merge = 'none' [related] _merge = 'none' [security] _merge = 'none' [segments] _merge = 'none' [server] _merge = 'none' [services] _merge = 'none' [sitemap] _merge = 'none' [taxonomies] _merge = 'none' { "build": { "_merge": "none" }, "caches": { "_merge": "none" }, "cascade": { "_merge": "none" }, "contenttypes": { "_merge": "none" }, "deployment": { "_merge": "none" }, "frontmatter": { "_merge": "none" }, "httpcache": { "_merge": "none" }, "imaging": { "_merge": "none" }, "languages": { "_merge": "none", "en": { "_merge": "none", "menus": { "_merge": "shallow" }, "params": { "_merge": "deep" } } }, "markup": { "_merge": "none" }, "mediatypes": { "_merge": "shallow" }, "menus": { "_merge": "shallow" }, "minify": { "_merge": "none" }, "module": { "_merge": "none" }, "outputformats": { "_merge": "shallow" }, "outputs": { "_merge": "none" }, "page": { "_merge": "none" }, "pagination": { "_merge": "none" }, "params": { "_merge": "deep" }, "permalinks": { "_merge": "none" }, "privacy": { "_merge": "none" }, "related": { "_merge": "none" }, "security": { "_merge": "none" }, "segments": { "_merge": "none" }, "server": { "_merge": "none" }, "services": { "_merge": "none" }, "sitemap": { "_merge": "none" }, "taxonomies": { "_merge": "none" } } All configuration settingsarchetypeDir(string) The directory where Hugo finds archetype files (content templates). Default is archetypes. Also see Module Mounts Config for an alternative way to configure this directory.assetDir(string) The directory where Hugo finds asset files used in Hugo Pipes. Default is assets. Also see Module Mounts Config for an alternative way to configure this directory.baseURL(string) The absolute URL (protocol, host, path, and trailing slash) of your published site (e.g., https://www.example.org/docs/).buildSee Configure Build.buildDrafts(bool) Include drafts when building. Default is false.buildExpired(bool) Include content already expired. Default is false.buildFuture(bool) Include content with a future publication date. Default is false.cachesSee Configure File Caches.canonifyURLs(bool) See details before enabling this feature. Default is false.capitalizeListTitles New in v0.123.3(bool) Whether to capitalize automatic list titles. Applicable to section, taxonomy, and term pages. Default is true. You can change the capitalization style in your site configuration to one of ap, chicago, go, firstupper, or none. See details.cascadePass down default configuration values (front matter) to pages in the content tree. The options in site config is the same as in page front matter, see Front Matter Cascade.For a website in a single language, define the [[cascade]] in Front Matter. For a multilingual website, define the [[cascade]] in Site Config.To remain consistent and prevent unexpected behavior, do not mix these strategies.cleanDestinationDir(bool) When building, removes files from destination not found in static directories. Default is false.contentDir(string) The directory from where Hugo reads content files. Default is content. Also see Module Mounts Config for an alternative way to configure this directory.copyright(string) Copyright notice for your site, typically displayed in the footer.dataDir(string) The directory from where Hugo reads data files. Default is data. Also see Module Mounts Config for an alternative way to configure this directory.defaultOutputFormat(string) The default output format for the site. If unspecified, the first available format in the defined order (by weight, then alphabetically) will be used.defaultContentLanguage(string) Content without language indicator will default to this language. Default is en.defaultContentLanguageInSubdir(bool) Render the default content language in subdir, e.g. content/en/. The site root / will then redirect to /en/. Default is false.disableAliases(bool) Will disable generation of alias redirects. Note that even if disableAliases is set, the aliases themselves are preserved on the page. The motivation with this is to be able to generate 301 redirects in an .htaccess, a Netlify _redirects file or similar using a custom output format. Default is false.disableDefaultLanguageRedirect New in v0.140.0(bool) Disables generation of redirect to the default language when DefaultContentLanguageInSubdir is true. Default is false.disableHugoGeneratorInject(bool) Hugo will, by default, inject a generator meta tag in the HTML head on the home page only. You can turn it off, but we would really appreciate if you don’t, as this is a good way to watch Hugo’s popularity on the rise. Default is false.disableKinds([]string) Disable rendering of the specified page kinds, any of 404, home, page, robotstxt, rss, section, sitemap, taxonomy, or term.disableLanguagesSee disable a language.disableLiveReload(bool) Disable automatic live reloading of browser window. Default is false.disablePathToLower(bool) Do not convert the url/path to lowercase. Default is false.enableEmoji(bool) Enable Emoji emoticons support for page content; see the emoji shortcode quick reference guide. Default is false.enableGitInfo(bool) Enable .GitInfo object for each page (if the Hugo site is versioned by Git). This will then update the Lastmod parameter for each page using the last git commit date for that content file. Default is false.enableMissingTranslationPlaceholders(bool) Show a placeholder instead of the default value or an empty string if a translation is missing. Default is false.enableRobotsTXT(bool) Enable generation of robots.txt file. Default is false.environment(string) Build environment. Default is production when running hugo and development when running hugo server. See Configuration directory.frontmatterSee Front matter Configuration.hasCJKLanguage(bool) If true, auto-detect Chinese/Japanese/Korean Languages in the content. This will make .Summary and .WordCount behave correctly for CJK languages. Default is false.ignoreCache(bool) Ignore the cache directory. Default is false.ignoreLogs([]string) A slice of message identifiers corresponding to warnings and errors you wish to suppress. See erroridf and warnidf.ignoreVendorPaths(string) Ignore vendored modules that match the given Glob pattern within the _vendor directory.imagingSee image processing configuration.languageCode(string) A language tag as defined by RFC 5646. This value is used to populate:The <language> element in the embedded RSS templateThe lang attribute of the <html> element in the embedded alias templateThe og:locale meta element in the embedded Open Graph templateWhen present in the root of the configuration, this value is ignored if one or more language keys exists. Please specify this value independently for each language key.languagesSee Configure Languages.layoutDir(string) The directory that contains templates. Default is layouts.markupSee Configure Markup.mediaTypesSee Configure Media Types.menusSee Menus.minifySee Configure Minify.moduleModule configuration see module configuration.newContentEditor(string) The editor to use when creating new content.noBuildLock(bool) Don’t create .hugo_build.lock file. Default is false.noChmod(bool) Don’t sync permission mode of files. Default is false.noTimes(bool) Don’t sync modification time of files. Default is false.outputFormatsSee custom output formats.pageSee configure page.paginationSee configure pagination.panicOnWarning(bool) Whether to panic on first WARNING. Default is false.permalinksSee Content Management.pluralizeListTitles(bool) Whether to pluralize automatic list titles. Applicable to section pages. Default is true.printI18nWarnings(bool) Whether to log WARNINGs for each missing translation. Default is false.printPathWarnings(bool) Whether to log WARNINGs when Hugo publishes two or more files to the same path. Default is false.printUnusedTemplates(bool) Whether to log WARNINGs for each unused template. Default is false.publishDir(string) The directory where Hugo will write the final static site (the HTML files etc.). Default is public.refLinksErrorLevel(string) When using ref or relref to resolve page links and a link cannot be resolved, it will be logged with this log level. Valid values are ERROR (default) or WARNING. Any ERROR will fail the build (exit -1). Default is ERROR.refLinksNotFoundURL(string) URL to be used as a placeholder when a page reference cannot be found in ref '''
