["https://gohugo.io/hosting-and-deployment"]
title = "Hosting and deployment"
description = "Services and tools to host and deploy your site."
full_description = "DocsHosting and deploymentHugo DeployDeploy your site directly to a Google Cloud Storage bucket, an AWS S3 bucket, or an Azure Storage container.Deploy with RcloneIf you have access to your web host with SFTP/FTP/SSH/HTTP(DAV), you can use rclone to incrementally deploy your entire Hugo website.Deploy with RsyncIf you have access to your web host with SSH, you can use a simple rsync one-liner to incrementally deploy your entire Hugo website.Host on 21YunBoxHost your Hugo site with 21YunBox's blazing fast Chinese CDN, fully-managed SSL and auto deploys from Gitee.Host on AWS AmplifyHost your site on AWS Amplify with continuous deployment.Host on Azure Static Web AppsPublish a Hugo site to Azure Static Web Apps.Host on Cloudflare PagesCloudflare Pages can host your Hugo site with CDN, continuous deployment, 1-click HTTPS, an admin GUI, and its own environment variables.Host on Codeberg PagesCodeberg Pages is a hosting service available to Codeberg users which allows you to publish your Hugo website, as well as websites managed by other static site generators.Host on FirebaseYou can use Firebase's free tier to host your static website; this also gives you access to Firebase's NoSQL API.Host on GitHub PagesHost your site on GitHub Pages with continuous deployment using project, user, or organization pages.Host on GitLab PagesGitLab makes it easy to build, deploy, and host your Hugo website via their free GitLab Pages service, which provides native support for Hugo.Host on KeyCDNAccelerate your Hugo site globally with a KeyCDN integration. This tutorial shows you how to set up your static site as a GitLab page behind a KeyCDN pull zone.Host on NetlifyHost your site on Netlify with continuous deployment.Host on RenderHost your Hugo site for free with Render's global CDN, fully-managed SSL and auto deploys from GitHub.Host on SourceHut PagesSourceHut Pages is a tool which allows you to publish static websites and provides support for a plethora of static site generators, including Hugo."
