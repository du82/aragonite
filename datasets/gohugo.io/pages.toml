["https://gohugo.io/about/features"]
title = "Features"
description = "Hugo's rich and powerful feature set provides the framework and tools to create static sites that build in seconds, often less."
full_description = "DocsAboutFeaturesFeaturesHugo’s rich and powerful feature set provides the framework and tools to create static sites that build in seconds, often less.AboutFrameworkMultiplatformInstall Hugo’s single executable on Linux, macOS, Windows, and more.MultilingualLocalize your project for each language and region, including translations, images, dates, currencies, numbers, percentages, and collation sequence. Hugo’s multilingual framework supports single-host and multihost configurations.Output formatsRender each page of your site to one or more output formats, with granular control by page kind, section, and path. While HTML is the default output format, you can add JSON, RSS, CSV, and more. For example, create a REST API to access content.TemplatesCreate templates using variables, functions, and methods to transform your content, resources, and data into a published page. While HTML templates are the most common, you can create templates for any output format.ThemesReduce development time and cost by using one of the hundreds of themes contributed by the Hugo community. Themes are available for corporate sites, documentation projects, image portfolios, landing pages, personal and professional blogs, resumes, CVs, and more.ModulesReduce development time and cost by creating or importing packaged combinations of archetypes, assets, content, data, templates, translation tables, static files, or configuration settings. A module may serve as the basis for a new site, or to augment an existing site.PrivacyConfigure your site to help comply with regional privacy regulations.SecurityHugo’s security model is based on the premise that template and configuration authors are trusted, but content authors are not. This model enables generation of HTML output safe against code injection. Other protections prevent “shelling out” to arbitrary applications, limit access to specific environment variables, prevent connections to arbitrary remote data sources, and more.Content authoringContent formatsCreate your content using Markdown, HTML, AsciiDoc, Emacs Org Mode, Pandoc, or reStructuredText. Markdown is the default content format, conforming to the CommonMark and GitHub Flavored Markdown specifications.Markdown attributesApply HTML attributes such as class and id to Markdown images and block elements including blockquotes, fenced code blocks, headings, horizontal rules, lists, paragraphs, and tables.Markdown extensionsLeverage the embedded Markdown extensions to create tables, definition lists, footnotes, task lists, inserted text, mark text, subscripts, superscripts, and more.Markdown render hooksOverride the conversion of Markdown to HTML when rendering blockquotes, fenced code blocks, headings, images, links, and tables. For example, render every standalone image as an HTML figure element.DiagramsUse fenced code blocks and Markdown render hooks to include diagrams in your content.MathematicsInclude mathematical equations and expressions in Markdown using LaTeX markup.Syntax highlightingSyntactically highlight code examples using Hugo’s embedded syntax highlighter, enabled by default for fenced code blocks in Markdown. The syntax highlighter supports hundreds of code languages and dozens of styles.ShortcodesUse Hugo’s embedded shortcodes, or create your own, to insert complex content. For example, use shortcodes to include audio and video elements, render tables from local or remote data sources, insert snippets from other pages, and more.Content managementContent adaptersCreate content adapters to dynamically add content when building your site. For example, use a content adapter to create pages from a remote data source such as JSON, TOML, YAML, or XML.TaxonomiesClassify content to establish simple or complex logical relationships between pages. For example, create an authors taxonomy, and assign one or more authors to each page. Among other uses, the taxonomy system provides an inverted, weighted index to render a list of related pages, ordered by relevance.DataAugment your content using local or remote data sources including CSV, JSON, TOML, YAML, and XML. For example, create a shortcode to render an HTML table from a remote CSV file.MenusProvide rapid access to content via Hugo’s menu system, configured automatically, globally, or on a page-by-page basis. The menu system is a key component of Hugo’s multilingual architecture.URL managementServe any page from any path via global configuration or on a page-by-page basis.Asset pipelinesImage processingConvert, resize, crop, rotate, adjust colors, apply filters, overlay text and images, and extract EXIF data.JavaScript bundlingTranspile TypeScript and JSX to JavaScript, bundle, tree shake, minify, create source maps, and perform SRI hashing.Sass processingTranspile Sass to CSS, bundle, tree shake, minify, create source maps, perform SRI hashing, and integrate with PostCSS.Tailwind CSS processingCompile Tailwind CSS utility classes into standard CSS, bundle, tree shake, optimize, minify, perform SRI hashing, and integrate with PostCSS.PerformanceCachingReduce build time and cost by rendering a partial template once then cache the result, either globally or within a given context. For example, cache the result of an asset pipeline to prevent reprocessing on every rendered page.SegmentationReduce build time and cost by partitioning your sites into segments. For example, render the home page and the “news section” every hour, and render the entire site once a week.MinificationMinify HTML, CSS, and JavaScript to reduce file size, bandwidth consumption, and loading times.Last updated: January 25, 2025 : Revise description of privacy settings (92f03a350)Improve this page"
year_published = 2025
year_updated = 2025
