["https://gohugo.io/about/introduction"]
title = "Introduction"
description = "Hugo is a static site generator written in Go, optimized for speed and designed for flexibility."
full_description = "DocsAboutIntroductionIntroductionHugo is a static site generator written in Go, optimized for speed and designed for flexibility.AboutHugo is a static site generator written in Go, optimized for speed and designed for flexibility. With its advanced templating system and fast asset pipelines, Hugo renders a complete site in seconds, often less.Due to its flexible framework, multilingual support, and powerful taxonomy system, Hugo is widely used to create:Corporate, government, nonprofit, education, news, event, and project sitesDocumentation sitesImage portfoliosLanding pagesBusiness, professional, and personal blogsResumes and CVsUse Hugo’s embedded web server during development to instantly see changes to content, structure, behavior, and presentation. Then deploy the site to your host, or push changes to your Git provider for automated builds and deployment.And with Hugo Modules, you can share content, assets, data, translations, themes, templates, and configuration with other projects via public or private Git repositories.Learn more about Hugo’s features, privacy protections, and security model.Last updated: April 3, 2024 : Add introduction video (16102faa8)Improve this page"
year_published = 2024
year_updated = 2024
