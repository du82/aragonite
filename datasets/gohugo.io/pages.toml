title = "Configure markup"
description = "Configure rendering of markup to HTML."
full_description = '''DocsGetting startedConfigure markupConfigure markupConfigure rendering of markup to HTML.Getting Started FundamentalsDefault handlerHugo uses Goldmark to render Markdown to HTML.hugo. yaml toml jsonmarkup: defaultMarkdownHandler: goldmark [markup] defaultMarkdownHandler = 'goldmark' { "markup": { "defaultMarkdownHandler": "goldmark" } } Files with a .md, .mdown, or .markdown extension are processed as Markdown, provided that you have not specified a different content format using the markup field in front matter.To use a different renderer for Markdown files, specify one of asciidocext, org, pandoc, or rst in your site configuration.defaultMarkdownHandlerDescriptionasciidocextAsciiDocgoldmarkGoldmarkorgEmacs Org ModepandocPandocrstreStructuredTextTo use AsciiDoc, Pandoc, or reStructuredText you must install the relevant renderer and update your security policy.Unless you need a unique capability provided by one of the alternative Markdown handlers, we strongly recommend that you use the default setting. Goldmark is fast, well maintained, conforms to the CommonMark specification, and is compatible with GitHub Flavored Markdown (GFM).GoldmarkThis is the default configuration for the Goldmark Markdown renderer:hugo. yaml toml jsonmarkup: goldmark: duplicateResourceFiles: false extensions: cjk: eastAsianLineBreaks: false eastAsianLineBreaksStyle: simple enable: false escapedSpace: false definitionList: true extras: delete: enable: false insert: enable: false mark: enable: false subscript: enable: false superscript: enable: false footnote: true linkify: true linkifyProtocol: https passthrough: delimiters: block: [] inline: [] enable: false strikethrough: true table: true taskList: true typographer: apostrophe: '&rsquo;' disable: false ellipsis: '&hellip;' emDash: '&mdash;' enDash: '&ndash;' leftAngleQuote: '&laquo;' leftDoubleQuote: '&ldquo;' leftSingleQuote: '&lsquo;' rightAngleQuote: '&raquo;' rightDoubleQuote: '&rdquo;' rightSingleQuote: '&rsquo;' parser: attribute: block: false title: true autoDefinitionTermID: false autoHeadingID: true autoIDType: github wrapStandAloneImageWithinParagraph: true renderHooks: image: enableDefault: false link: enableDefault: false renderer: hardWraps: false unsafe: false xhtml: false [markup] [markup.goldmark] duplicateResourceFiles = false [markup.goldmark.extensions] definitionList = true footnote = true linkify = true linkifyProtocol = 'https' strikethrough = true table = true taskList = true [markup.goldmark.extensions.cjk] eastAsianLineBreaks = false eastAsianLineBreaksStyle = 'simple' enable = false escapedSpace = false [markup.goldmark.extensions.extras] [markup.goldmark.extensions.extras.delete] enable = false [markup.goldmark.extensions.extras.insert] enable = false [markup.goldmark.extensions.extras.mark] enable = false [markup.goldmark.extensions.extras.subscript] enable = false [markup.goldmark.extensions.extras.superscript] enable = false [markup.goldmark.extensions.passthrough] enable = false [markup.goldmark.extensions.passthrough.delimiters] block = [] inline = [] [markup.goldmark.extensions.typographer] apostrophe = '&rsquo;' disable = false ellipsis = '&hellip;' emDash = '&mdash;' enDash = '&ndash;' leftAngleQuote = '&laquo;' leftDoubleQuote = '&ldquo;' leftSingleQuote = '&lsquo;' rightAngleQuote = '&raquo;' rightDoubleQuote = '&rdquo;' rightSingleQuote = '&rsquo;' [markup.goldmark.parser] autoDefinitionTermID = false autoHeadingID = true autoIDType = 'github' wrapStandAloneImageWithinParagraph = true [markup.goldmark.parser.attribute] block = false title = true [markup.goldmark.renderHooks] [markup.goldmark.renderHooks.image] enableDefault = false [markup.goldmark.renderHooks.link] enableDefault = false [markup.goldmark.renderer] hardWraps = false unsafe = false xhtml = false { "markup": { "goldmark": { "duplicateResourceFiles": false, "extensions": { "cjk": { "eastAsianLineBreaks": false, "eastAsianLineBreaksStyle": "simple", "enable": false, "escapedSpace": false }, "definitionList": true, "extras": { "delete": { "enable": false }, "insert": { "enable": false }, "mark": { "enable": false }, "subscript": { "enable": false }, "superscript": { "enable": false } }, "footnote": true, "linkify": true, "linkifyProtocol": "https", "passthrough": { "delimiters": { "block": [], "inline": [] }, "enable": false }, "strikethrough": true, "table": true, "taskList": true, "typographer": { "apostrophe": "\u0026rsquo;", "disable": false, "ellipsis": "\u0026hellip;", "emDash": "\u0026mdash;", "enDash": "\u0026ndash;", "leftAngleQuote": "\u0026laquo;", "leftDoubleQuote": "\u0026ldquo;", "leftSingleQuote": "\u0026lsquo;", "rightAngleQuote": "\u0026raquo;", "rightDoubleQuote": "\u0026rdquo;", "rightSingleQuote": "\u0026rsquo;" } }, "parser": { "attribute": { "block": false, "title": true }, "autoDefinitionTermID": false, "autoHeadingID": true, "autoIDType": "github", "wrapStandAloneImageWithinParagraph": true }, "renderHooks": { "image": { "enableDefault": false }, "link": { "enableDefault": false } }, "renderer": { "hardWraps": false, "unsafe": false, "xhtml": false } } } } Goldmark extensionsThe extensions below, excluding Extras and Passthrough, are enabled by default.ExtensionDocumentationEnabledcjkGoldmark Extensions: CJK✔️definitionListPHP Markdown Extra: Definition lists✔️extrasHugo Goldmark Extensions: ExtrasfootnotePHP Markdown Extra: Footnotes✔️linkifyGitHub Flavored Markdown: Autolinks✔️passthroughHugo Goldmark Extensions: PassthroughstrikethroughGitHub Flavored Markdown: Strikethrough✔️tableGitHub Flavored Markdown: Tables✔️taskListGitHub Flavored Markdown: Task list items✔️typographerGoldmark Extensions: Typographer✔️Extras New in v0.126.0Enable deleted text, inserted text, mark text, subscript, and superscript elements in Markdown.ElementMarkdownRenderedDeleted text~~foo~~<del>foo</del>Inserted text++bar++<ins>bar</ins>Mark text==baz==<mark>baz</mark>SubscriptH~2~OH<sub>2</sub>OSuperscript1^st^1<sup>st</sup>To avoid a conflict when enabling the Hugo Goldmark Extras subscript extension, if you want to render subscript and strikethrough text concurrently you must:Disable the Goldmark strikethrough extensionEnable the Hugo Goldmark Extras delete extensionFor example:hugo. yaml toml jsonmarkup: goldmark: extensions: extras: delete: enable: true subscript: enable: true strikethrough: false [markup] [markup.goldmark] [markup.goldmark.extensions] strikethrough = false [markup.goldmark.extensions.extras] [markup.goldmark.extensions.extras.delete] enable = true [markup.goldmark.extensions.extras.subscript] enable = true { "markup": { "goldmark": { "extensions": { "extras": { "delete": { "enable": true }, "subscript": { "enable": true } }, "strikethrough": false } } } } Passthrough New in v0.122.0Enable the passthrough extension to include mathematical equations and expressions in Markdown using LaTeX markup. See mathematics in Markdown for details.TypographerThe Typographer extension replaces certain character combinations with HTML entities as specified below:MarkdownReplaced byDescription...&hellip;horizontal ellipsis'&rsquo;apostrophe--&ndash;en dash---&mdash;em dash«&laquo;left angle quote“&ldquo;left double quote‘&lsquo;left single quote»&raquo;right angle quote”&rdquo;right double quote’&rsquo;right single quoteGoldmark settings explainedMost of the Goldmark settings above are self-explanatory, but some require explanation.duplicateResourceFiles New in v0.123.0(bool) If true, shared page resources on multilingual single-host sites will be duplicated for each language. See multilingual page resources for details. Default is false.With multilingual single-host sites, setting this parameter to false will enable Hugo’s embedded link render hook and embedded image render hook. This is the default configuration for multilingual single-host sites.parser.wrapStandAloneImageWithinParagraph(bool) If true, image elements without adjacent content will be wrapped within a p element when rendered. This is the default Markdown behavior. Set to false when using an image render hook to render standalone images as figure elements. Default is true.parser.autoDefinitionTermID(bool) Whether to automatically add id attributes to description list terms (i.e., dt elements).parser.autoHeadingID(bool) Whether to automatically add id attributes to headings (i.e., h1, h2, h3, h4, h5, and h6 elements).parser.autoIDType(string) The strategy used to automatically generate id attributes, one of github, github-ascii or blackfriday.github produces GitHub-compatible id attributesgithub-ascii drops any non-ASCII characters after accent normalizationblackfriday produces id attributes compatible with the Blackfriday Markdown rendererThis is also the strategy used by the anchorize template function. Default is github.parser.attribute.block(bool) If true, enables Markdown attributes for block elements. Default is false.parser.attribute.title(bool) If true, enables Markdown attributes for headings. Default is true.renderHooks.image.enableDefault New in v0.123.0(bool) If true, enables Hugo’s embedded image render hook. Default is false.The embedded image render hook is automatically enabled for multilingual single-host sites if duplication of shared page resources is disabled. This is the default configuration for multilingual single-host sites.renderHooks.link.enableDefault New in v0.123.0(bool) If true, enables Hugo’s embedded link render hook. Default is false.The embedded link render hook is automatically enabled for multilingual single-host sites if duplication of shared page resources is disabled. This is the default configuration for multilingual single-host sites.renderer.hardWraps(bool) If true, Goldmark replaces newline characters within a paragraph with br elements. Default is false.renderer.unsafe(bool) If true, Goldmark renders raw HTML mixed within the Markdown. This is unsafe unless the content is under your control. Default is false.AsciiDocThis is the default configuration for the AsciiDoc renderer:hugo. yaml toml jsonmarkup: asciidocExt: attributes: {} backend: html5 extensions: [] failureLevel: fatal noHeaderOrFooter: true preserveTOC: false safeMode: unsafe sectionNumbers: false trace: false verbose: false workingFolderCurrent: false [markup] [markup.asciidocExt] backend = 'html5' extensions = [] failureLevel = 'fatal' noHeaderOrFooter = true preserveTOC = false safeMode = 'unsafe' sectionNumbers = false trace = false verbose = false workingFolderCurrent = false [markup.asciidocExt.attributes] { "markup": { "asciidocExt": { "attributes": {}, "backend": "html5", "extensions": [], "failureLevel": "fatal", "noHeaderOrFooter": true, "preserveTOC": false, "safeMode": "unsafe", "sectionNumbers": false, "trace": false, "verbose": false, "workingFolderCurrent": false } } } AsciiDoc settings explainedattributes(map) A map of key-value pairs, each a document attribute. See Asciidoctor’s attributes.backend(string) The backend output file format. Default is html5.extensions(string array) An array of enabled extensions, one or more of asciidoctor-html5s, asciidoctor-bibtex, asciidoctor-diagram, asciidoctor-interdoc-reftext, asciidoctor-katex, asciidoctor-latex, asciidoctor-mathematical, or asciidoctor-question.To mitigate security risks, entries in the extension array may not contain forward slashes (/), backslashes (\), or periods. Due to this restriction, extensions must be in Ruby’s $LOAD_PATH.failureLevel(string) The minimum logging level that triggers a non-zero exit code (failure). Default is fatal.noHeaderOrFooter(bool) If true, outputs an embeddable document, which excludes the header, the footer, and everything outside the body of the document. Default is true.preserveTOC(bool) If true, preserves the table of contents (TOC) rendered by Asciidoctor. By default, to make the TOC compatible with existing themes, Hugo removes the TOC rendered by Asciidoctor. To render the TOC, use the TableOfContents method on a Page object in your templates. Default is false.safeMode(string) The safe mode level, one of unsafe, safe, server, or secure. Default is unsafe.sectionNumbers(bool) If true, numbers each section title. Default is false.trace(bool) If true, include backtrace information on errors. Default is false.verbose(bool)If true, verbosely prints processing information and configuration file checks to stderr. Default is false.workingFolderCurrent(bool) If true, sets the working directory to be the same as that of the AsciiDoc file being processed, allowing includes to work with relative paths. Set to true to render diagrams with the asciidoctor-diagram extension. Default is false.AsciiDoc configuration examplehugo. yaml toml jsonmarkup: asciidocExt: attributes: my-attribute-name: my value my-base-url: https://example.com/ extensions: - asciidoctor-html5s - asciidoctor-diagram workingFolderCurrent: true [markup] [markup.asciidocExt] extensions = ['asciidoctor-html5s', 'asciidoctor-diagram'] workingFolderCurrent = true [markup.asciidocExt.attributes] my-attribute-name = 'my value' my-base-url = 'https://example.com/' { "markup": { "asciidocExt": { "attributes": { "my-attribute-name": "my value", "my-base-url": "https://example.com/" }, "extensions": [ "asciidoctor-html5s", "asciidoctor-diagram" ], "workingFolderCurrent": true } } } AsciiDoc syntax highlightingFollow the steps below to enable syntax highlighting.Step 1Set the source-highlighter attribute in your site configuration. For example:hugo. yaml toml jsonmarkup: asciidocExt: attributes: source-highlighter: rouge [markup] [markup.asciidocExt] [markup.asciidocExt.attributes] source-highlighter = 'rouge' { "markup": { "asciidocExt": { "attributes": { "source-highlighter": "rouge" } } } } Step 2Generate the highlighter CSS. For example:rougify style monokai.sublime > assets/css/syntax.css Step 3In your base template add a link to the CSS file:layouts/_default/baseof.html<head> ... {{ with resources.Get "css/syntax.css" }} <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"> {{ end }} ... </head>Then add the code to be highlighted to your markup:[#hello,ruby] ---- require 'sinatra' get '/hi' do "Hello World!" end ---- AsciiDoc troubleshootingRun hugo --logLevel debug to examine Hugo’s call to the Asciidoctor executable:INFO 2019/12/22 09:08:48 Rendering book-as-pdf.adoc with C:\Ruby26-x64\bin\asciidoctor.bat using asciidoc args [--no-header-footer -r asciidoctor-html5s -b html5s -r asciidoctor-diagram --base-dir D:\prototypes\hugo_asciidoc_ddd\docs -a outdir=D:\prototypes\hugo_asciidoc_ddd\build -] ... HighlightThis is the default highlight configuration. Note that some of these settings can be set per code block, see Syntax Highlighting.hugo. yaml toml jsonmarkup: highlight: anchorLineNos: false codeFences: true guessSyntax: false hl_Lines: "" hl_inline: false lineAnchors: "" lineNoStart: 1 lineNos: false lineNumbersInTable: true noClasses: true style: monokai tabWidth: 4 wrapperClass: highlight ['''
year_published = 2025
year_updated = 2025
