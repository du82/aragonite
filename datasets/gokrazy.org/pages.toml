full_description = "scan2drive is an appliance (with a web interface) that scans paper documents 📄 from a scanner 🖨️ as PDFs to Google Drive for full-text search. hmgo is a minimal HomeMatic house automation central control unit replacement (specific to stapelberg’s home network). beatbox is a Raspberry Pi 3-based toy that combines a Mir:ror and NFC figurines for playing music stored on the device or directly from Spotify. consrv is a Raspberry Pi 4-based appliance that provides a basic SSH to serial console bridge for accessing remote devices. krazyotelcol is an appliance running the OpenTelemetry Collector, a vendor-agnostic implementation on how to receive, process and export telemetry data. Rest Server is a high performance HTTP server that implements restic’s REST backend API. Running it requires some setup and other configurations which are available in this blog post. waiw is a Go webserver to store movies/series/animes ratings and comments. Running it requires some setup but the README describes every step to make it work. The following third-party programs have been successfully used with gokrazy but might require additional setup: The Prometheus node exporter exposes various metrics of the system on which it is running for use with the prometheus monitoring and alerting system. The Prometheus blackbox exporter allows blackbox probing of endpoints over HTTP, HTTPS, DNS, TCP and ICMP for use with the prometheus monitoring and alerting system. You can prototype your idea by temporarily using existing software to close the gap. See Prototyping."
