title = "Controlling a GPIO input/output pin :: gokrazy"
full_description = "In this guide, we are using periph.io, a library for peripheral I/O in Go, to set one of the Raspberry Pi’s General Purpose I/O (GPIO) pins to a logical high (3.3V) or low (0V) signal. periph.io supports the Raspberry Pi 3, Raspberry Pi Zero 2W and Raspberry Pi 4, starting with version v3.6.4. To verify the code is doing what we expect, let’s connect a multimeter as per pinout.xyz’s pinout: To set the pin high and low, alternatingly, with a 5 second frequency, we will be using the hello-gpio program, which is a slightly modified version of the example at periph.io/device/led: At this point, we should be able to see the high/low signal on the multimeter, alternating between 3.3V (high) and 0V (low) every 5 seconds: To setup a Pin as an input and to act on change to High level, such as a button, we must poll the Pin periodically because periph.io’s edge detection, which examples like the periph.io/device/button example rely on, is not available on gokrazy. The below example configures a single Pin for Input and uses Go channels to signal level changes that can be acted on. Keep in mind that shortening the polling interval will increase CPU usage."
