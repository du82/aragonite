["https://gokrazy.org/userguide/tls-for-untrusted-networks"]
title = "Using TLS in untrusted networks :: gokrazy"
full_description = 'Let’s assume that you have installed gokrazy on a Raspberry Pi and are currently successfully updating it over the network like so: In the config.json, in the Update field, add a "UseTLS": "self-signed" line (don’t forget adding a comma to the previous line): The gokrazy installation will start listening on TCP port 443 for HTTPS connections and redirect any HTTP traffic to HTTPS. When opening the gokrazy web interface in your browser, you will need to explicitly permit communication due to the self-signed certificate. You can now safely update your gokrazy installation over untrusted networks, such as unencrypted WiFi networks. Run gok update --insecure, and afterwards gokrazy will no longer contain the certificates and will serve unencrypted HTTP again.'
