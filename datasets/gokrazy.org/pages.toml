["https://gokrazy.org/development/modules"]
title = "Working with Go modules :: gokrazy"
full_description = "If you are not yet familiar with Go modules in general (outside of gokrazy), please read the Go wiki page on Modules first. Since September 2022, the gokrazy packer builds each package in its own build directory, with its own go.mod and go.sum files. This is done for isolation: if you update one program, that will not have any effect on the other programs you include in your gokrazy instance. Throughout this page, let’s assume your gokrazy instance is named scanner, and will hence store its files in ~/gokrazy/scanner. A single additional program, scan2drive, is included: When building this instance (using gok overwrite initially, or gok update afterwards), the gok CLI will create the following build directory structure: You can see that there is one subdirectory for each package listed in the Packages field of your instance’s config.json (see gok edit), which includes the explicitly added scan2drive, plus a couple extra ones that gokrazy always installs, e.g. github.com/gokrazy/gokrazy/cmd/dhcp. If you want to influence the content of any newly created go.mod (no effect on existing go.mod files), you can create a go.mod template in your instance directory: ~/gokrazy/scanner/go.mod. If you want to make the gokrazy packer pick up a local working copy with not-yet-published code, or a working copy with local changes to existing code, use gok add with a directory name: Often, one Go package will be the only package you use from a certain Go module. But this isn’t always the case: for example, the system packages github.com/gokrazy/gokrazy/cmd/dhcp and github.com/gokrazy/gokrazy/cmd/ntp both come from the github.com/gokrazy/gokrazy module. The packer will by default create a separate builddir, including a separate go.mod and go.sum, for each package, even when they come from the same module. If you want to add module-wide replace directives to your go.mod file, you can influence the granularity at which gokr-packer works as follows. Move the go.mod/go.sum files to the directory level within the builddir/ hierarchy at which you would like to work. gokr-packer will look for go.mod/go.sum files at the package level, going one level up until it finds the files."
