title = "Prometheus :: gokrazy"
full_description = "Note: In the following we will assume that your instance is called hello (default) as well as that the hostname is hello as well. We need a valid prometheus config for prometheus to start successfully. Start with the default prometheus.yml from the prometheus repository. Save it to your gokrazy instance directory, e.g. ~/gokrazy/hello/prometheus.yml. In theory, this is enough to deploy prometheus, but unfortunately we are missing the web assets for the web UI which are not included in our build of prometheus. You can use prometheus as is, if you never want to go to the web UI on hello:9090. If you visit the web UI anyway, you will get this (or a similar) error: The web assets are released with every prometheus release and you need to update them by hand with every new version."
