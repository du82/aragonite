full_description = "Dual Design: Maintaining Consistent Flash and Html Pages Ken Goldberg and Guy Boo UC Berkeley, September 2005, Released Summer 2006 Dual Design is open-source: you can download everything you need to build your own dual design page with your own colors and links. For browsers that support Flash, the flash version of the site downloads, parses, and plays the content.xml file on the fly when it is downloaded. We use Flash's native XML class to download and parse the source file, MovieClip class to load any needed images and manage and animate elements onscreen, and TextField class to display and animate text and display small snippets of HTML."
