title = "LS160E"
full_description = '''New Course Website with Updated Syllabus (Click and see left column for updates on Course Notes, Section Blogs) 20th Century ("modern") technologies such as the assembly line and the highway system emphasize efficiency, control, and optimization. In contrast, "post-modern" technologies such as the internet, Google, smartphones, and Facebook are characterized by flexibility and their ability to be reconfigured, as exemplified by genomics, stem cells, robotics, and nanotechnology. We can view post-modern technologies as "new media" in the sense that they are available for a variety of uses: they are "transformable" and promise to be "transformational". Building on Heidegger's 1954 essay, "The Question Concerning Technology" and related essays, our inquiry will include perspectives from Michel Foucault, Gilles Deleuze, Roland Barthes, and Brian Arthur. We will establish a theoretical basis for thinking about technology and new media and apply it to a selection of technologies that shape our contemporary experience. This course has no prerequisites but is geared toward ambitious and mature juniors and seniors who are willing to read carefully, engage in discussions, and think deeply about technology and western values. This course can be used to fulfill the Breadth requirement in Philosophy and Values.'''
