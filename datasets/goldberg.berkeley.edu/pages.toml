["http://goldberg.berkeley.edu/courses/F13/24"]
title = "IEOR 24: Freshman Seminar: Intro to IEOR"
full_description = "Professor Ken Goldberg (Professor of IEOR and EECS and iSchool) 425 Sutardja Dai Hall goldberg [AT] berkeley [DOT] edu Office Hours: See Prof. Goldberg's website: http://goldberg.berkeley.edu/ Course Objectives: This course provides an introduction to the field of Industrial Engineering and Operations Research through a series of lectures by IEOR faculty. I respect and will accommodate religious beliefs, disabilities, and other special circumstances. Please contact me in person with advance notice so that we can plan accordingly. I welcome constructive criticism. Please email me with feedback on the course, teaching and format at any time during the term. A few words about your 3-Page (single or double-spaced) Independent Project Reports. These should descripe your investigation into any topic of your choosing related to the class and lectures, for example, you could do a report on how you would enhance the RideMax program for Disneyland or on how one might apply Dynamic Programming to Speech Recognition. You are not required to give technical details (but these are welcome), but to show that you understand the topic and how it can be applied. Your report should include a summary of the topic, background literature (with at least 3 references), a description, how it relates to IEOR and the course, and brief discussion of the method and application. See schedule above, you must turn in a hardcopy by the due date, not by email. This is an example where college is different than high school. You have freedom to choose what you want to cover and how you want to cover it. For an example, think of a wikipedia article, with an explanation at the top and some examples and references (but don't just copy a wikipedia article!). I'm not expecting you to come up with something new or do any mathematical analysis. There's no unique right answer. IEOR 24 is a pass/no-pass class so the key is to make a good effort and put in 3-4 hours on this report. This is a way to encourage you to explore a topic on your own. Have Fun!"
year_published = 2025
