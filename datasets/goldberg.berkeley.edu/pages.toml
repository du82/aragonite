["https://goldberg.berkeley.edu/courses/S00/140"]
title = "IEOR 140 home page"
full_description = 'Spring 2000 Professor: Ken Goldberg Teaching Assistant: Pulak Patel Industrial Engineering and Operations Research (IEOR) Dept University of California at Berkeley Lectures: MW 11-12, 3113 Etcheverry. Lab: F 2-4, 1174 Etcheverry. Web page: www.ieor.berkeley.edu/~goldberg IEOR 140 is designed to give upper-division IEOR students an introduction to modern manufacturing and assembly systems. The course focuses on the technologies and practices used in the industrial production of products. Lectures introduce the basics of modern manufacturing: materials, machine tools, automation, and contemporary processes such as Electron Beam Machining and Stereolithography. We emphasize methods for automated production, including an introduction to Computer Aided Design (CAD) systems and java programming. Example problems are drawn from robotics, specifically kinematics, path planning, and design of workcells for industrial assembly, including methods for fixturing, feeding, sorting, and assembling parts. Homeworks and labs involve the PC Lab and the WWW. A central focus of the course is the Consulting Project, where teams of 3-4 students work together through the semester as "consultants" for a local production facility. Each team will develop a report on their client, summarizing the product, materials, and current production methods. Teams will then identify and quantify a specific problem related to quality or throughput, measure and analyze relevant data, research alternative production methods involving automation, and propose solutions with cost analysis. Details and Examples are given below.'
