["https://goldberg.berkeley.edu/art/teen-age"]
title = "Teen Age Art Exhibition"
description = "Art Exhibition about Teen Age Experience."
full_description = '''"High school's full of phonies; all you do is study so that you can learn enough to be smart enough to be able to buy a goddam Cadillac some day, and you have to keep making believe you give a damn if the football team loses...." - J. D. Salinger, The Catcher in the Rye. In every era, teenagers push the boundaries of accepted behavior. They thrive despite raging hormones, clueless parents, ridiculous authority figures, and the dawning recognition that the entire status quo is absurd. They will define the future of new media. Curated from 60 international submissions, this group show coincides with ZER01's 01SJ Biennial, Build Your Own World, highlighting art at the intersection of technology and culture. Teen Age: You Just Don't Understand considers the role of new media in newly emerging worldviews. Each project is a collaboration involving at least one teen and one so-called adult.'''
