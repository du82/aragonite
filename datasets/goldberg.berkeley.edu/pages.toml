full_description = "This USD $5000 MMG Fellowship in memory of Dr. Melvin Morris Goldberg (BSE UPenn 1961 / Ohio State PhD 1963) provides summer travel support to an ambitious undergraduate student from any U.S. University to perform supervised technical research at one of Israel's universities or research centers (eg, Bar-Ilan, Ben-Gurion, Haifa U., Hebrew U., Technion, Tel-Aviv U., the Weizmann Institute). Research can be on any STEM topic. To apply, candidates work with an advisor at their home university to identify and confirm a willing supervisor in Israel. The Goldberg Fellowship is awarded to a U.S. junior or senior who demonstrates the initiative, enthusiasm, and aptitude to make such arrangements. The Fellowship supports travel and living costs. Funding is provided by the Goldberg Family through the Jewish Federation of the Lehigh Valley in Pennsylvania. Research can be on any STEM topic. To apply, candidates work with an advisor at their home university to identify and confirm a willing supervisor in Israel. The Fellowship is awarded annually to a U.S. junior or senior who demonstrates the initiative, enthusiasm, and aptitude to make such arrangements. Please Email your Resume/CV with GPA as an attachment and in the body of the email include the following information in plain text (not as an attachment): 1. Your full contact information 2. University, Major, and Expected Graduation Date 3. Summary of proposed plan of study (500 words or less) 4. Name and contact information of your advisor in the US. 5. Name and contact information of your confirmed supervisor in Israel After applying, please check back if you do not receive a confirmation. The Goldberg Fellow will be announced in early April of each year. For questions please contact: Professor Ken Goldberg: goldberg@berkeley.edu with subject line: * Re: Melvin M. Goldberg (MMG) Fellowship for Research in Israel"
year_published = 2025
