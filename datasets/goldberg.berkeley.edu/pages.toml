title = "Tele-Actor"
full_description = "The Tele-Actor is a skilled human equipped with a wireless camera who moves through and interacts with a live remote environment. Camera images are broadcast over the Internet to online participants, who interact by voting with a new interface. The Tele-Actor system combines two ideas: (1) a human Tele-Actor who is more agile than a robot, and (2) collaborative control, which allows many people to simultaneous participate over the Internet."
