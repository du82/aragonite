["https://goldberg.berkeley.edu/golem"]
title = "Adam, Golem, Robot - a Dialogue"
description = """
A dialogue on 
Adam, Golem, and Robot mythologies."""
full_description = '''Based on a talk presented by Ken Goldberg in 1993 at a Hillel Faculty lunch at the University of Southern California organized by Susan Laemmle and with Tamara Eskenazi, Professor of Biblical Studies, Hebrew Union College, and a follow-up conversation between Ken Goldberg and Ovid Jacob in San Francisco in 1995. Ken: Let's reconsider the archetype of The Creature in Western literature by examining the potential linkage between Adam, Golem and Robot. The well-known story of Adam and Eve is told in chapter 2 and 3 of Genesis. Initially Adam and Eve live in a state of innocent bliss in the Garden. God tells them that they can eat from any tree with the pointed exception of the Tree of Knowledge of Good and Evil. The serpent suggests to Eve that eating from this Tree will open her eyes and make her wise. After she and Adam cast aside caution and eat, God appears and they hide. He asks why are they wearing fig leaves and Eve confesses, blaming the serpent. Then Adam confesses, blaming Eve, "the woman You gave me": in effect blaming God. God responds with a threefold punishment: women will experience pain during childbirth, men and women will no longer be pampered but must work, and they become mortal. Ovid: Joseph Campbell points out that before the Biblical myth of creation, there were other competing myths in that region, with different interpretations of the Garden, the Tree and the Serpent. His Occidental Mythologies has some of this. Check out also some of my thoughts The Tree, The Ladder, The Chariot and the Self. One interesting thing I want to mention is that though we "lost" the Tree of Life and the Tree of Knowledge after we were expelled from the Garden, subsequently Kabbalists figured out a way to "get back in"! Thus, Moses Cordovero, in his Garden of Pomegranates (Pardes Rimonim) in the 1500's explores this - see Scholem's Kabbalah for more details. Ken: When we consider these conditions, Pain, Work and the recognition of Mortality, we realize that they define the condition of being an adult. In effect, the consequences of their act of disobedience (rebellion) facilitates their maturing into full human beings. Their expression of free will transforms them from passive innocence to responsible leaders. What about God's reaction? Was God so angry? Or was God secretly pleased by the inevitable consequence of his creations? (I've been told about an essay on this but can't find it: "Did They Fall or Were They Pushed?" ): I propose the following thesis:'''
year_published = 2025
clearnet = "https://goldberg.berkeley.edu/golem"
