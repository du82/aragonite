["https://goldberg.berkeley.edu/courses/S06/IEOR-QE-S06"]
title = "Questioning Efficiency: Human Factors and Existential Phenomenology | UC Berkeley Fall 2006"
full_description = '''Questioning Efficiency: Human Factors and Existential Phenomenology Prof. Hubert Dreyfus (Philosophy)- office hours Wed 4-6 303 Moses Hall Prof. Ken Goldberg (IEOR and EECS) - office hours Mon & Wed 4:15-5, 4189 Etcheverry Hall TA. Forrest Hartman - office hours tbd (email=dionysos at berkeley) TA. Dilan Mahendran (email=dilan at berkeley) - office hours Wed 3:00-4:00 room 6 South Hall Spring 2006, MW 1:10-3:00, 290 Hearst Registration limited to 60 upper div undergrads. Register under either: IEOR 190G (3 units) or L&S 160A (3 units) (This course fulfills the Breadth Category: Philosophy and Values) Required Texts Martin Heidegger - The Question Concerning Technology and Other Essays Fredrick W. Taylor - The Principles of Scientific Management Course Reader (located at Copy Central on Bancroft Way $16.36) This is the first time this course is being taught. It will have 2 course numbers depending on which unit students register through. Both courses will share the same name and room number. Summary: Efficiency in human behavior is a goal that is rarely questioned in contemporary culture. This course will study and draw connections between disparate fields to trace the development and influence of this view. The course, drawing a mix of humanities and engineering students, will include readings and lectures on 19th and 20th century philosophers with discussions of new technology and team experimental projects. Frederick Taylor, the father of industrial engineering, analyzed human motion to optimize industrial productivity, which had great influence on Henry Ford, military logistics, and Stalin. Michel Foucault traced the history of the minute analysis of human motion from Napoleon's methods for transforming peasants into soldiers to modern methods for reforming prisoners. Martin Heidegger claimed that "efficient ordering" was the defining characteristic of modern culture. Through the course, students will learn to recognize how this obsession with efficiency for its own sake relates to technology and to their daily lives.'''
year_published = 2025
