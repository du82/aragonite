["https://goldberg.berkeley.edu/garden/Ars"]
title = "The Telegarden Website"
description = "Website for the art installation that allowedanyone on the internet to view and interact with a remote garden filled with living plants"
full_description = "Co-directors: Ken Goldberg and Joseph Santarromana Project Team: George Bekey, Steven Gentner, Rosemary Morris Carl Sutter, Jeff Wiegley Ars Electronica team: Erich Berger, Gerold Hofstadler, Thomas Steindl, Gerfried Stocker Archivist: Hannes Mayer The Telegarden was an art installation that allowed web users to view and interact with a remote garden filled with living plants. Anyone online could plant, water, and monitor the progress of seedlings via the tender movements of an industrial robot arm. The Robot in the Garden: Telerobotics and Telepistemology in the Age of the Internet, Edited by Ken Goldberg (MIT Press, 2000) ``In linking their garden to the World Wide Web and creating an intuitive interface for the control of the arm and camera, the artists transformed what most would consider a fit of over-engineering into a subtle rumination on the nature of the Commons.'' -- Peter Lunenfeld, Flash Art , XXIX, 187, March 1996. ``The Telegarden creates a physical garden as an environment to stage social interaction and community in virtual space. The Telegarden is a metaphor for the care and feeding of the delicate social ecology of the net.'' -- Randall Packer, San Jose Museum of Art, April 1998. The Telegarden went online in June of 1995 and has been online continuously for seven years. It currently is located in the Ars Electonica Museum in Austria. Anyone can view the garden as a guest; the rights to plant and water are granted to those who agree to share their email addresses with other members of the cooperative. Activity is recorded in logs so that the cooperative can be self-governing. ``...For the experienced gardener, the TeleGarden offers a search for the sould of gardening. Sowing a single, unseen and untouched seed thousands of miles away might seem mechanical, but it engenders a Zen-like appreciation for the fundamental act of growing. Though drained of sensory cues, planting that distant seed still stirs anticipation, protectiveness, and nurturing. The unmistakable vibration of the garden pulses and pulls, even through a modem.'' -- Warren Schultz, Garden Design, Dec/January 1996."
year_published = 2025
