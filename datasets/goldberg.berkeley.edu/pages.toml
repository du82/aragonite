["https://goldberg.berkeley.edu/courses/aci"]
title = "Advanced Product Design"
full_description = '''Steve Montgomery, Product Design, Art Center. Brian Boyl, Interface Design, Art Center. Brenda Laurel, Digital Media, Art Center. Ken Goldberg, IEOR and EECS Depts, UC Berkeley. Tues,Thursdays: 9am-4pm, (12 units) Summer 2002 Brief Description: A collaborative, transdisciplinary studio class undertaking a single comprehensive design project from conception through presentation. Developed by Goldberg and colleagues, The Tele-Actor is a new approach to group participation where a skilled human, equipped with a wireless audiovisual system, enables an Internet-based audience to collectively interact with a live remote environment. Extended Summary: Students are introduced to a phased approach of product design: exploration, ideation, refinement, documentation, execution, presentation. Students will work in teams to learn and apply research methods to assess the product's existing and potential market, apply design research within the product development process, establish design criteria and scenario, develop and communicate ideation in two and three dimensions, examine new applications for current or emerging technology with regard to manufacturing techniques and feasibility, create a comprehensive digital presentation to broaden and utilize communication skills. Skills/Experience Required: Product Design 1, 2, 3 , rapid visualization, model solid- construction, sketch modeling. Computer experience with graphics rendering and modeling applications. Benefits: Applying collaborative design process from research to production. Development of visual and verbal communication skills. Applications of aquired skills to a real-world project. Exposure to emerging business and industry trends. Global implication and technological impact of design. Ancillary studies: Cultural and historical aspects specific to the design, feasibility study, business model, business plan development, related technology, IP considerations, presentation skills (storyboarding, copywriting, computer skills, human factors study). Equipment or Supplies: Computer or computer access to rendering and presentation applications, internet access. Course Structure: The team project is divided into five sequential phases, each assigned specific objectives, time frame and requirements. Milestones include a kickoff presentation, a midterm presentation, and the final presentation held on Thursday of the 13th week (Super Thursday), 8 August 2002. Grading: The design concept is one third and its execution one third. The remaining third is made up of presentations, research & analysis, attendance, class participation and attitude. Reviews will be held at midterm, with projected grade, and "post-mortem" review held Tuesday, August 13th. The Tele-Actor Collective Telerobotics Project Design Images and team powerpoint presentations More Team Presentations (powerpoint) Echo Product Design Echo Interface Design Special Thanks to Peter Lunenfeld, Ron Jones, Mark Breitenberg, John Canny, Michael Grey, and the students from ArtCenter and UC Berkeley who participated.'''
