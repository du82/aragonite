title = "IEOR 290K home page"
full_description = "Study of geometric algorithms that facilitate rapid design and evaluation of automated assembly lines. These algorithms accept as input a CAD model of the product and return as output a robot motion plan or an arrangement of modular elements for automated feeding, sorting, fixturing, or assembly of the parts. Through reading and discussion of research papers, students will be exposed to the state of current research. Each student will explore one topic in depth leading to a project writeup and presentation. This course will be given again in Fall 1998 (I hope!) Please contact goldberg@ieor.berkeley.edu for more info."
