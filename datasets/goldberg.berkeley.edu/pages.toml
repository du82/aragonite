["https://goldberg.berkeley.edu/mfg-memo"]
title = '"Made in the USA" Can Make a Comeback'
description = "memo on developing a rational science for manufacturing"
full_description = '''It's no accident that Apple's iPhone and Boeing's 787 are receiving global applause. Both are highly engineered products manufactured by experts who use advanced technologies and high-volume, cost-effective production methods. This is the kind of know-how that once established "Made in the USA" as the global standard to beat. The iPhone, however, is manufactured in Taiwan. The Boeing 787 is assembled in Japan. America, birthplace of the modern assembly line, is losing ground when it comes to putting things together. Driven by short-term savings and ignoring the close relationship between innovation and manufacturing, America has relinquished this responsibility to ambitious foreign competition, who are investing in fundamental research that improves manufacturing processes and luring our finest researchers overseas. America produces roughly 75,000 engineers per year. China graduates ten times that number. India produces close to a million. But quality control weaknesses in overseas manufacturing of toys, tires, and toothpaste have resulted in huge losses in reputation and value, environmental repercussions, and employee layoffs. Our overseas competitors are learning from these lessons and developing advanced automation to ensure consistent product quality. The next wave of high-value products will require assembly at the micro and nano scales, where manual labor is no longer an option. These trends suggest enormous opportunities. US manufacturing is not a lost cause: the production of goods from consumer electronics to industrial equipment accounts for 14 percent of the U.S. GDP and 11 percent of U.S. employment. But U.S. manufacturing today is where database technology was in the early 1960's, a patchwork of ad hoc solutions that lacked the rigorous methodology that leads to scientific innovation. That all changed in 1970 when Ted Codd, an IBM mathematician, invented relational algebra, an elegant mathematical database model that galvanized federally funded research leading to today's $14 billion database industry.'''
year_published = 2025
clearnet = "https://goldberg.berkeley.edu/mfg-memo"
tags = ['"made', "innovation", "manufacturing", "policy", "revitalized", 'usa"']
