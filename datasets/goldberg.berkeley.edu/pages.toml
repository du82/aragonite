["http://goldberg.berkeley.edu/NSF-Multilateral-Manipulation-Project"]
title = "Multilateral Manipulation by Human-Robot Collaborative Systems"
description = "Multilateral Manipulation Project Overview (Oct 2012)."
full_description = "Allison Okamura, Stanford University Pieter Abbeel, University of California - Berkeley Ken Goldberg, University of California - Berkeley Greg Hager, Johns Hopkins University Blake Hannaford, University of Washington Jacob Rosen, University of California - Santa Cruz Summary: This 4-year multi-campus research project seeks to emulate the expert-apprentice relationship using human beings and robots. It focuses on developing ways in which robots can learn from human activity in order to help humans by providing extra hands, eyes and brain power as necessary, enabling multilateral manipulation from multiple vantage points. The range of applications includes manufacturing and surgery. Overview: This project addresses a large space of manipulation problems that are repetitive, injury-causing, or dangerous for humans to perform, yet are currently impossible to reliably achieve with purely autonomous robots. These problems generally require dexterity, complex perception, and complex physical interaction. We conjecture that many such problems can be reliably addressed with human-robot collaborative (HRC) systems, where one or more humans provide needed perception and adaptability, working with one or more r obot systems that provide speed, precision, accuracy, and dexterity at an appropriate scale, within a generalizable system framework that synergistically combines these complementary capabilities. The project focuses on multilateral manipulation, which arises when a human controls one or more robot manipulators in partnership with one or more additional controllers (humans or autonomous agents). Complex operations in surgery and manufacturing can benefit from the extra degrees of freedom provided by more than two hands, and training often depends on hands- on interaction between expert and apprentice. Example applications include surgical operations, which typically involve several physicians and assistants, and other medical tasks such as turning a patient in bed and wrapping a cast to constrain a hand. Mult ilateral manipulation also applies in manufacturing, for example for threading wires or cables, aligning gaskets to obtain a tight seal, and in many household situations, such as folding tablecloths, wrapping packages, and zipping overfilled suitcases."
year_published = 2025
clearnet = "http://goldberg.berkeley.edu/NSF-Multilateral-Manipulation-Project"
