["http://goldberg.berkeley.edu/algorithmic-automation"]
title = "Algorithmic Automation"
full_description = '''A Blade Primitive for Feeding 3D Parts on Vibratory Tracks �Onno C. Goemans and A. Frank van der Stappen Utrecht University, Marshall Anderson and Ken Goldberg, UC Berkeley A V-trap for Feeding 3D Parts on a Vibratory Track� Onno C. Goemans and A. Frank van der Stappen Utrecht University The Stable Poses of Objects Supported by Multiple Contact� Elon Rimon, Technion, Israel Institute of Technology To benefit the quality and productivity of manufacturing worldwide, our goal is to bring together researchers and students to develop "algorithmic" approaches to automation and manufacturing. Automation for manufacturing today is where computer technology was in the early 1960's, a patchwork of ad-hoc solutions lacking a rigorous scientific methodology. CAD provides detailed models of part geometry. What's missing is formal models of part behavior, frameworks for the systematic design of automated systems that handle (e.g. assemble, inspect, sort, feed) parts, and tools for rigorous specification, analysis, and synthesis. The "Turing Machine" introduced an elegant model of computing with precise vocabulary and operations that formalized concepts of Equivalence, Correctness, Completeness, and Complexity. Can we apply Turing to ManufacTuring?. Algorithmic Automation abstractions can allow the functionality of automation to be designed independent of the underlying implementation and can provide the foundation for formal specification and analysis, algorithmic design, consistency checking and optimization. Algorithmic Automation thus facilitates integrity, reliability, interoperability, and maintainability and upgrading of automation.'''
year_published = 2025
