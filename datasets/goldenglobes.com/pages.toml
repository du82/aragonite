full_description = "Golden Globes and Bvlgari Shine at Berlin Film Festival The Golden Globes hosted a gathering at the China Club during the 75th Berlin International Film Festival (Berlinale), along with Bvulgari, with the evening highlighting the importance of major festivals in shaping international cinema and fostering cultural exchange. Berlinale continues to discover groundbreaking films and talents as well as showcasing works from established artists. The […] Read More Scandinavian Talent in Spotlight at the European Shooting Stars in Berlin Every year, the Berlin Film Festival hosts 10 young European actors selected for the Shooting Stars program run by European Film Promotion. This year, three Scandinavian actors were celebrated as the up-and-coming European acting talent to keep an eye on: Danish Besir Zeciri, Icelandic Elín Hall and Swedish Frida Gustavsson. Past Shooting Stars include Alicia […] Read More Swiss Lionel Baier: ‘We Do Not Realize How Lucky We Are to Be Free in This City’ For his latest film, Swiss writer-director Lionel Baier adapted the novel “La Cache” (The Safe House) by Christophe Boltanski, an autobiographical comedy-drama about the author’s family when he was a child during the civil unrest in Paris in 1968 . The film played in competition at the Berlin Film Festival where we spoke with Baier […] Read More Latinoamerica tiene fuerte presencia en la Berlinale En este sitio web también aparece una versión idioma en Inglés de la historia. Cada año, la Berlinale se convierte en una plataforma vital para mostrar lo mejor del cine latinoamericano. El año pasado, La cocina, el más reciente largometraje del director mexicano Alfonso Ruizpalacios, protagonizado por Raúl Briones y Rooney Mara, comenzó una gira […] Read More Latin America Has Strong Showing at Berlin Film Festival Each year, the Berlinale becomes a vital platform for showcasing the finest filmmaking from all over the world, including Latin America. Last year, La Cocina, from Mexican director Alfonso Ruizpalacios and starring Raúl Briones and Rooney Mara, embarked on an international tour after debuting there, winning awards at festivals such as Deauville, Havana and Philadelphia, […] Read More"
