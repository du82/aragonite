description = "Elisabeth Sereda is an accomplished print, radio and TV journalist in news and entertainment with an emphasis in music and film. A Golden Globes member since 1994, her reporting has appeared in German Cosmopolitan, ORF, and in Austrian radio and national public service broadcaster Ö3. Currently, Sereda writes for the Austrian daily Kurier, the magazine […]"
full_description = "Elisabeth Sereda Elisabeth Sereda is an accomplished print, radio and TV journalist in news and entertainment with an emphasis in music and film. A Golden Globes member since 1994, her reporting has appeared in German Cosmopolitan, ORF, and in Austrian radio and national public service broadcaster Ö3. Currently, Sereda writes for the Austrian daily Kurier, the magazine OOOM, and reports for various Austrian TV broadcasters. She is the author of two non-fiction books “Starporträt” and “Hollywood Backstage,” and has been nominated for the International Media Award by the Publicists Guild numerous times. Her first English-language novel “Casket Girls” is slated to be released at the end of 2023. Prev Next All Board of Directors"
