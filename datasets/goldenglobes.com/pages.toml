["https://goldenglobes.com/photo-gallery/venice-2024-red-carpet-trends-angelina-jolie-cate-blanchett-jenna-ortega-zhang-ziyi"]
title = "Venice 2024 Red Carpet Trends: Angelina Jolie, Cate Blanchett, Jenna Ortega, Zhang Ziyi - Golden Globes"
full_description = '''Venice 2024 Red Carpet Trends: Angelina Jolie, Cate Blanchett, Jenna Ortega, Zhang Ziyi 1 of 16 A blonde Angelina Jolie sported faux fur. Cate Blanchett repurposed pearls and diamonds. Emerging icons of fashion Jena Ortega and Taylor Russell brought fun to fashion at the Venice Film Festivals. Looking for trends? 2004 celebrates the trend started at the Golden Globes in January, notably that individual elan entrances. Champagne, brights and neck features are joint individual trends. Photo by Earl Gibson III 2 of 16 Angelina Jolie, in Venice with Pablo Larrain's film "Maria" Photo by Earl Gibson III 3 of 16 Bold colors & Neck Features: Jury president Isabelle Huppert sporting a high-collared Papal red robe by Balenciaga. The gown had hidden pockets and a high free-standing collar that drew the eye to her famous visage. White gloves which trended at Cannes two years ago, finished her covered look, made more dramatic with statement jeweled cuffs and a massive diamond ring. Photo by Earl Gibson III 4 of 16 Monica Bellucci also used the gown as a frame that drew attention to a focal point - a plunging décolletage. A statement neck piece in contrasting black white palettes with margarita colored gems drew the eye down with a purple teardrop. The beauty sported ‘movie star’ shades. Photo by Earl Gibson III 5 of 16 Padded shoulders: Her BeetlejuiceBeetlejuice co-star, Winona Ryder, wore classic Chanel. The jacket padded at the shoulder over a waistcoat that nipped the waist and matched the double buttons slanted for silhouette emphasize. The homage to the suit finished with a soft ribbon tie. Photo by Earl Gibson III 6 of 16 The Bodice: For drama, Jenna Ortega stalked into the spotlight in a sheer crimson skirt which she flounced to reveal full bloomers anchoring the layers of fine fabric. The bodice, a homage to the original "Beetlejuice," was fashioned into a fanciful heart and fastened to a sheer fitted base to give the illusion of exposure. The back - bare - but for strips of flesh colored sheers for support. Dior. Photo by Earl Gibson III 7 of 16 Jenna Ortega, Photo by Earl Gibson III 8 of 16 Taylor Russell also played with tromp l’oeil with a sequin-embroidered plastic corseted dress, the crinoline overskirt and white mermaid silk chiffon underskirt a replica of look 76 from the Chanel Haute Couture Spring-Summer 1993. The gown involved 900 hours of meticulous work and 70 000 elements of embroideries! Photo by Earl Gibson III 9 of 16 Nicole Kidman combined three trends: Champagne, the bodice and the neck feature in a Schiaparelli Haute Couture at the "Babygirl" world premiere. Photo by Earl Gibson III 10 of 16 Nicole Kidman. Photo by Earl Gibson III 11 of 16 Much attention was paid to Cate Blanchett for doing something every woman does daily: She reused a statement piece of jewelry while wearing a metallic champagne column confection courtesy of Armani Privé that was embellished with micro pearls. The "Disclaimer" star mirrored the horizontal pearls on the fitted sheath with a Louis Vuitton necklace worn horizontally across the shoulders that she first showcased at the Cannes Film Festival. The next day at the premiere of Alfonso Cuarón’s "Disclaimer" series she chose a shoulder padded plunging catsuit, the bare back layered with rows of pearls. Photo by Earl Gibson III 12 of 16 GIP_4567 As Venice fast becomes "The Cate Blanchett Show," she again caught the spotlight in a demure white Louis Vuitton dress with a lace drape across the bodice. Photo by Earl Gibson III 13 of 16 Cate Blanchett. Photo by Earl Gibson III 14 of 16 If a color is popping this year it’s champagne. Nicole Kidman chose Schiaparelli Haute Couture at the “Babygirl” premiere ... Photo by Earl Gibson III 15 of 16 ... as did director-actress Angelina Jolie, who wore Tamara Ralph, a fitted column draped with chiffon and topped with a fake fur stole, anchored with a broach completing the '50s Glam Hollywood tribute. , as did a blonde Angelina Jolie. Photo by Earl Gibson III 16 of 16 Champagne was also chosen by Zhang Ziyi - Chanel - and Ella Purnell - Armani Privé at the "Babygirl" premiere. Photo by Earl Gibson III September 2, 2024'''
