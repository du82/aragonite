["https://goldenglobes.com/articles/the-82nd-annual-golden-globes-ratings-surpass-10-million"]
title = "The 82nd ANNUAL GOLDEN GLOBES® RATINGS SURPASS 10 MILLION - Golden Globes"
description = "THE  82nd ANNUAL GOLDEN GLOBES® LIVE STREAMING AUDIENCE WAS UP 9% OVER THE 2024 BROADCAST       GOLDEN GLOBES ® DOMINATED ON SOCIAL MEDIA UP OVER 124% YOY       THE 82nd ANNUAL GOLDEN GLOBES® averaged 10.1 million viewers, a notable feat while up against Sunday Night’s NFL game between the Minnesota Vikings and the Detroit Lions on NBC.    THE  82nd ANNUAL GOLDEN GLOBES® live-streaming audience was up 9% from […]"
full_description = "Nikki Glaser during the 82nd Annual Golden Globes held at The Beverly Hilton on January 05, 2025 in Beverly Hills, California. The 82nd ANNUAL GOLDEN GLOBES® RATINGS SURPASS 10 MILLION January 6, 2025 — THE 82nd ANNUAL GOLDEN GLOBES® LIVE STREAMING AUDIENCE WAS UP 9% OVER THE 2024 BROADCAST GOLDEN GLOBES ® DOMINATED ON SOCIAL MEDIA UP OVER 124% YOY THE 82nd ANNUAL GOLDEN GLOBES® averaged 10.1 million viewers, a notable feat while up against Sunday Night’s NFL game between the Minnesota Vikings and the Detroit Lions on NBC. THE 82nd ANNUAL GOLDEN GLOBES® live-streaming audience was up 9% from last year on Paramount+ and the CBS App. This year’s Golden Globes was the #1 broadcast special across all of TV in the last 12 months, driving 40 million social interactions on show night. The 2025 Golden Globes was also The Most Social Golden Globes show ever, up +124% YOY outperforming the 2024 social media numbers for both the Oscars and Grammys. Overwhelming social media, the 82nd ANNUAL GOLDEN GLOBES surpassed 45.1 billion potential impressions, up 52% from last year. *Ratings Source VideoAmp Overnight Data *Streaming Source CBS *Social Media Source Social Content Ratings and Quid Monitor About Golden Globes® As a premier entertainment awards show since 1944, the annual Golden Globes has honored achievements in both television and film. Over the last three decades, the Golden Globes has enabled donations of more than $55 million to entertainment-related charities including scholarship programs, film restoration projects and humanitarian efforts. This funding has also supported diverse programs in partnership with advocacy groups aimed at promoting greater access in Hollywood for underserved communities. Dick Clark Productions is the owner and producer of the Golden Globes. For more information on the Golden Globe Awards, please visit www.GoldenGlobes.com and follow us on X, Instagram,Facebook, and in Spanish on X, and Facebook. About Dick Clark Productions Dick Clark Productions (DCP) is the world’s largest producer and proprietor of televised live event entertainment programming including the “Academy of Country Music Awards,” “American Music Awards,” “Billboard Music Awards,” “Dick Clark’s New Year’s Rockin’ Eve with Ryan Seacrest,” “Golden Globes,” “So You Think You Can Dance,” from 19 Entertainment and DCP, and “Streamy Awards.” Dick Clark Productions owns one of the world’s most extensive and unique entertainment archive libraries with more than 60 years of award-winning shows, historic specials, performances, and legendary programming. Dick Clark Productions is owned by Penske Media Corporation, in a subsidiary joint venture between Penske Media and Eldridge. Dick Clark Productions is a Penske Media company. For more information, please visit www.DickClark.com. About CBS CBS, a subsidiary of Paramount Global, creates and distributes industry-leading content across a variety of platforms to audiences around the world. The Company has businesses with origins that date back to the dawn of the broadcasting age as well as new ventures that operate on the leading edge of media. It includes some of the industry’s most successful and popular brands and businesses: CBS Television Network, CBS News and Stations, CBS Sports, CBS Studios, CBS Media Ventures and CBS digital properties. Share this Prev Next"
