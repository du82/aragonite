full_description = "Media Info MEDIA APPLICATIONS FOR THE 82nd ANNUAL GOLDEN GLOBES® ARE CLOSED Applications to cover the January 5, 2025, red carpet and ceremony have now been closed, as of December 11, 2024. No new applications will be accepted. See you next year! MORE: The Golden Globes, often referred to as “Hollywood’s Party of the Year®,” is the largest awards show in the world to celebrate the best of both film and television. Emmy®-nominated comedian and actress Nikki Glaser will host this year’s show, and multi-Emmy Award®-winning producing duo Glenn Weiss and Ricky Kirshner of White Cherry Entertainment (WCE) will return as executive producing showrunners for the 82nd Golden Globes. Dick Clark Productions will plan, host and produce the annual Golden Globes, which has been viewed in more than 185 countries and territories worldwide. Nominations were announced December 9, 2024. The awards timetable, rules and categories can be found HERE. Logos & Trophy Images for 82nd Annual Golden Globes® 2025 Branding Guidlines DOWNLOAD HERE Logomarks: Both horizontal and vertical logomarks. DOWNLOAD HERE Trophy Mark: The trophy mark exists in two variations, one each for a black and white background. DOWNLOAD HERE"
