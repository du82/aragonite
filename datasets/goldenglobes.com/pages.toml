["https://goldenglobes.com/articles/golden-globes-the-most-memorable-moments"]
title = "Golden Globes: The Most Memorable Moments - Golden Globes"
description = "Reasonable minds will differ as to the most memorable moments from the 82nd annual Golden Globes, but here are some of the highlights that stood out from the night and are likely to be played and replayed in the days ahead. And if your favorite moment isn’t cited here, figure it was the last one […]"
full_description = "Karla Sofía Gascón wins Best Motion Picture – Musical or Comedy for “Emilia Pérez” during the 82nd Annual Golden Globes held at The Beverly Hilton on January 05, 2025 in Beverly Hills, California. Golden Globes: The Most Memorable Moments January 5, 2025 — Brian Lowry Reasonable minds will differ as to the most memorable moments from the 82nd annual Golden Globes, but here are some of the highlights that stood out from the night and are likely to be played and replayed in the days ahead. And if your favorite moment isn’t cited here, figure it was the last one left on the cutting-room floor. A plea for trans rights. The night’s final moment might have saved the best for last in terms of impact and resonance, as Karla Sofìa Gascón, the trans star of “Emilia Perez,” voiced a plea of acceptance and expressed her hope and belief that light would overcome darkness. Zoe Saldana and Demi Moore get choked up. The first award of the night produced one of the most emotional responses, a sentiment matched later in the evening by Demi Moore, who referred to being dismissed as “a popcorn actress” earlier in her career after claiming her first Globe for “The Substance.” “This is the first time I’ve ever won anything,” Moore said. All in the Family. Fernanda Torres, an upset winner for the Brazilian film “I’m Not Here,” dedicated the win to her mother, Fernanda Montenegro, who was the first (and only) Brazilian actress previously nominated for Golden Globe, in 1998, for the movie “Central Station.” Brady Corbet’s daughter shares in her dad’s win. The director of “The Brutalist” gave a shout out to his young daughter, who cried listening to his speech, before also acknowledging the recent death of filmmaker Jeff Baena, the husband of Aubrey Plaza. Adam Sandler joins in the Chalamet-mania. During her monologue host Nikki Glaser enlisted Adam Sandler to take a whack at saying Timothée Chalamet’s voice in his inimitable style, and he dutifully obliged with a “Chal-a-maaaaaay!” Seth Rogen and Catherine O’Hara get silly about Canada. The presenter pair engaged in a fairly wild riff about their work in Canada that hadn’t extended beyond its borders, joking about the “Golden Antlers” they had respectively won for a series of increasingly zany roles. (The exchange prompted a lengthy bleep of Rogen.) Pope-ular? Maybe not so much. In a cheeky nod to “Wicked,” Nikki Glaser briefly appeared in a papal hat to sing her big number from “Conclave,” before receiving a call that prompted her to think better of the whole idea. Share this Prev Next"
author = "Gabrielle Boehme"
