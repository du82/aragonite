title = "Sebastian Stan - Golden Globes"
description = "Sebastian Stan (born in Constanța, Romania, August 13, 1982) acted on television in the miniseries Political Animals (2012) created by Greg Berlanti; played the Mad Hatter in Once Upon a Time (2012); and Tommy Lee in Pam & Tommy (2022) with Lily James as Pamela Anderson. He acted in movies like Ricki and the Flash […]"
full_description = "Awards Database 3 Nominations 1 Win Sebastian Stan Sebastian Stan (born in Constanța, Romania, August 13, 1982) acted on television in the miniseries Political Animals (2012) created by Greg Berlanti; played the Mad Hatter in Once Upon a Time (2012); and Tommy Lee in Pam & Tommy (2022) with Lily James as Pamela Anderson. He acted in movies like Ricki and the Flash (2015) by Jonathan Demme with Meryl Streep, The Martian (2015) by Ridley Scott with Matt Damon, I, Tonya (2017) with Margot Robbie, The 355 (2022) with Jessica Chastain. He played Winter Soldier in Marvel’s Captain America: The First Avenger (2011), Captain America: The Winter Soldier (2014), Captain America: Civil War (2016) with Chris Evans, Avengers: Infinity War (2018), and in the TV series The Falcon and the Winter Soldier (2021) with Anthony Mackie. Stan acted in Dumb Money (2023), and played Donald Trump in The Apprentice (2024) and an actor who undergoes facial surgery in A Different Man (2024). He was Golden Globes-nominated for the last two. Golden Globe Awards 2025 Nominee Best Performance by a Male Actor in a Motion Picture – Drama The Apprentice Sebastian Stan 2025 Winner Best Performance by a Male Actor in a Motion Picture – Musical or Comedy A Different Man Sebastian Stan 2023 Nominee Best Performance by an Actor in a Limited Series, Anthology Series, or a Motion Picture Made for Television Pam & Tommy Sebastian Stan"
