["https://goldenglobes.com/articles/shogun-and-baby-reindeer-highlight-the-growing-power-of-international-television"]
title = "‘Shogun’ and ‘Baby Reindeer’ highlight the growing power of international television - Golden Globes"
description = "The Golden Globes have long possessed an international flavor in their film awards, but the advent of streaming, and breakthrough success of programs such as Squid Game, Baby Reindeer and Shogun, has yielded a similar dynamic in the television categories. The growing power of TV featuring international talent could be seen as FX/Hulu’s Shogun — […]"
full_description = "Anna Sawai, Tadanobu Asano, Cosmo Jarvis, Edward McDowell, Michaela Clavell, Justin Marks, Rachel Kondo, Hiroyuki Sanada wins Best Television Series – Drama for Shogun during the 82nd Annual Golden Globes held at The Beverly Hilton on January 05, 2025 in Beverly Hills, California. ‘Shogun’ and ‘Baby Reindeer’ highlight the growing power of international television January 5, 2025 — Brian Lowry The Golden Globes have long possessed an international flavor in their film awards, but the advent of streaming, and breakthrough success of programs such as Squid Game, Baby Reindeer and Shogun, has yielded a similar dynamic in the television categories. The growing power of TV featuring international talent could be seen as FX/Hulu’s Shogun — after similar domination at the Emmys — laid siege to the Globes’ drama category, as the adaptation of James Clavell’s novel about feudal Japan was named best drama in addition to slicing off wins for stars Hiroyuki Sanada, Anna Sawai and Tadanobu Asano. The British limited series Baby Reindeer also made its presence felt, with wins in that category as well as for Jessica Gunning as the eccentric female stalker. Because television tended to consist more of home-grown productions, its focus has historically been narrower than the movies. American audiences in particularly grew up with the medium in the wake of World War II, as much of the world was dealing with its aftermath, providing entertainment that traveled more easily around the globe. In the intervening years, Americans would be treated to classy British dramas on public television or the occasional outlier like Doctor Who, but projects that originated overseas — especially those that required subtitles for an English-speaking audience — were few and relatively far between. As the Hollywood Reporter noted, when the International Emmys were introduced in 1973, “The interest in, and market for, non-U.S. television was close to zero. This was the pre-cable, three-network world, and foreign programming, or diversity of any sort, was hard to find on the primetime schedules.” Streaming services, with their boundless appetite for content, have helped change that, eroding resistance to watching subtitled programming in the U.S., and producing some memorable breakthroughs, as underscored by this year’s roster of Golden Globe nominees and winners. According to a 2022 study by Whip Media, viewing of non-U.S. titles in America doubled from 2018 — the year before several new studio- and tech-backed streaming services, like Disney+ and Apple TV+, launched — and 2021. That trend has only continued in the subsequent years, which has been evident both from the increase in the availability of such fare and across the TV awards circuit. Notably, Shogun does have some history in the U.S., with the original adaptation of James Clavell’s novel, also made a mark at the 1981 Golden Globes, winning as best TV drama as well as for stars Richard Chamberlain and Yoko Shimada. While that version was a massive ratings hit in the U.S. — helping earn Chamberlain, who also starred in The Thorn Birds, the nickname “King of the miniseries” — it was actually edited down and released theatrically in Japan. Share this Prev Next"
author = "Gabrielle Boehme"
year_published = 2025
year_updated = 2025
