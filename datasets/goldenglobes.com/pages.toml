title = "Carol Burnett Award - Golden Globes"
description = "The Carol Burnett Award was presented for the first time at the 76th Golden Globe Awards, on January 6, 2019. As the television landscape continues to evolve with more thought-provoking programming, diverse roles and best in class content, the HFPA established the Carol Burnett Award to celebrate the medium’s new Golden Age. Equivalent to its […]"
