description = "Barbaros Tapan has been a member of the Golden Globes since 2016 and is the founder and president of the Hollywood Turkish Film and Drama Days. Tapan’s sports and entertainment reporting has appeared in a variety of media outlets from the Turkish daily sports news publication Fanatik, CNNTurk, to Turkish TV network TRT and Kanal […]"
full_description = "Barbaros Tapan Barbaros Tapan has been a member of the Golden Globes since 2016 and is the founder and president of the Hollywood Turkish Film and Drama Days. Tapan’s sports and entertainment reporting has appeared in a variety of media outlets from the Turkish daily sports news publication Fanatik, CNNTurk, to Turkish TV network TRT and Kanal D. Tapan became the U.S. representative of Turkey’s biggest media company, the Demiroren Media Group in 2000. He currently writes for Demiroren Media’s daily newspaper Hurriyet, produces TV shows for BeIN Media-Turkey, and currently serves as the U.S. editor of the Turkish Airlines magazine Skylife. Frequently recognized for his outstanding coverage in film, Tapan was honored every year from 2018-2020 by the Entertainment Journalists Association of Turkey. Prev Next All Board of Directors"
