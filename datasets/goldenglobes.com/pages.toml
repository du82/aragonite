title = "Latinoamerica tiene fuerte presencia en la Berlinale - Golden Globes"
description = "En este sitio web también aparece una versión idioma en Inglés de la historia. Cada año, la Berlinale se convierte en una plataforma vital para mostrar lo mejor del cine latinoamericano. El año pasado, La cocina, el más reciente largometraje del director mexicano Alfonso Ruizpalacios, protagonizado por Raúl Briones y Rooney Mara, comenzó una gira […]"
full_description = "“El mensaje” or “The Message” from Argentina launches at Berlinale 75. Latinoamerica tiene fuerte presencia en la Berlinale February 17, 2025 — By Gabriel Lerman En este sitio web también aparece una versión idioma en Inglés de la historia. Cada año, la Berlinale se convierte en una plataforma vital para mostrar lo mejor del cine latinoamericano. El año pasado, La cocina, el más reciente largometraje del director mexicano Alfonso Ruizpalacios, protagonizado por Raúl Briones y Rooney Mara, comenzó una gira internacional después de su estreno allí, obreniendo premios en festivales como Deauville, La Habana, Filadelfia, Estocolmo y Mallorca, además de un estreno en los cines de todo el mundo, incluyendo Estados Unidos. Este año, mientras la Berlinale celebra su 75º aniversario, la apuesta es aún más alta, con 17 películas latinoamericanas (sin contar los cortometrajes) que llegan a Berlín, de las cuales tres participan en la selección oficial. Brasil lidera la delegación con 7 películas, incluyendo una en competencia: The Blue Trail (O último azul) de Gabriel Mascaro, su regreso a la dirección después de la aclamada Divine Love, que se estrenó en Sundance en 2019 y luego participó en Berlín. Su nuevo proyecto, que combina ciencia ficción con temas sociales, cuenta la historia de Teresa (Denise Weinberg), una mujer de 77 años que ha pasado su vida en un pequeño pueblo industrializado en la Amazonía. Cuando se ve obligada a mudarse a una colonia de viviendas para ancianos como parte de una iniciativa gubernamental para reubicar a los mayores en favor de las generaciones jóvenes, Teresa decide huir. La coproducción con México, Chile y los Países Bajos también cuenta con la participación del actor brasileño de renombre internacional Rodrigo Santoro. México tiene la segunda mayor presencia en el festival con 4 películas, una de las cuales también compite: Dreams, del renombrado cineasta Michel Franco. Al igual que en algunas de sus obras anteriores, gran parte de Dreams está hablada en inglés. En la película, Franco colabora nuevamente con Jessica Chastain para contar la historia de un bailarín mexicano (interpretado por la estrella del ballet Isaac Hernández), quien cruza la frontera para continuar una relación con una mujer adinerada (Chastain), creyendo que ella lo ayudará a perseguir sus sueños. Sin embargo, su llegada interrumpe su vida aparentemente perfecta. Además de Dreams, Franco es productor de Olmo, una coproducción entre México y EE.UU. dirigida por el veterano Fernando Eimbcke, recordado por Duck Season (2005), que ganó 11 premios Ariel, incluyendo a la Mejor Película. Ambientada en Nuevo México, Olmo (que se presenta en la sección Panorama) sigue a un niño de 14 años cuya vida monótona se ve alterada cuando es invitado a una fiesta por su hermosa vecina. Argentina sigue de cerca con 4 películas, aunque muchas de ellas son coproducciones. La única película de ese orígen en competencia es El mensaje, una coproducción con España y Uruguay, dirigida por Iván Fund, quien previamente presentó Los labios (2010) en Cannes y Piedra noche (2021) en Venecia. Esta es su primera participación en Berlín. Protagonizada por el ascendente actor Marcelo Subiotto (conocido por Puan y la venidera El eternauta), El mensaje gira en torno a una niña con la capacidad de comunicarse con mascotas fallecidas y las personas que se benefician de su supuesto talento. Completan la delegación latinoamericana dos películas de la República Dominicana, dos de Perú, y un documental de Paraguay, un país donde la realización cinematográfica es a menudo un reto debido a los recursos limitados. After This Death, presentada en la Gala Especial de la Berlinale dirigida por Lucio Castro, nacido en Buenos Aires, y protagonizada por la actriz argentina radicada en EE.UU. Mia Maestro, es otra entrada destacada. Aunque es una producción estadounidense, puede considerarse parte de la presencia latina en el festival. Share this Prev Next"
