["https://goldenglobes.com/topic/mlk-day"]
title = "MLK Day Archives - Golden Globes"
full_description = '''MLK Day Golden Globes Reflect Changes for Blacks in the Film Industry In honor of Black History Month Martin Luther King Jr. ’s dream of equality and representation resonates with the strides Black Hollywood has made in recent decades. Golden Globe Awards MLK Day 2018: Oprah Winfrey Makes History at the 75th Golden Globes For over 30 years, Oprah Winfrey, “the queen of all media,” set the tone for cultural conversations in America, and Winfrey’s acceptance speech for her Cecil B. DeMille Award in 2018 was no exception. Golden Globe Awards MLK Day 1982: Sidney Poitier – Elegance and Grace A trailblazer for civil rights. A man of great dignity. Film MLK Day ‘One Potato, Two Potato’ (1964): Larry Peerce’s Seminal Indie Drama of Interracial Marriage Larry Peerce directed One Potato, Two Potato (1964), a pioneering indie drama about interracial marriage and its devastating effects on all concerned, especially the young white daughter caught up in a messy situation. The film preceded by three years the more famous Guess Who's Coming to Dinner Stanley Kramer’s Golden Globe nominee (and Oscar winner) starred Katharine Hepburn, Spencer Tracy, Sidney Poitier and Katharine Houghton. Film MLK Day ‘Hallelujah’ (1929): Hollywood’s First All-Black Musical Hallelujah, a pre-Code feature, is considered to be the first all-Black musical. Remarkably, the innovative director King Vidor was able to make a rather "personal" project within the studio system, despite initially strong discouragement of MGM’s conservative heads. Film MLK Day Streaming Black History As the Black Lives Matter movement is gaining more ground in the wake of countless police killings, the number of (mostly white) people interested in getting an education in Black history is growing. The streamers have responded and added many films and documentaries to their library.'''
