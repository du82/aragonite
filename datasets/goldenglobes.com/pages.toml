["https://goldenglobes.com/articles/the-penguins-colin-farrell-shows-batman-villains-can-also-conquer-golden-globes-tv-categories"]
title = "The Penguin's Colin Farrell shows Batman villains can also conquer Golden Globes TV categories - Golden Globes"
description = "Colin Farrell received the 2025 Golden Globe for Best Performance by an Actor in a Limited Series, Anthology Series of Motion Picture Made for Television for his work as the (misunderstood?) titular villain in Max’s The Penguin.   But this is not the first villain from the Batman universe to be recognized with a Golden […]"
full_description = "Colin Farrell during the 82nd Annual Golden Globes held at The Beverly Hilton on January 05, 2025 in Beverly Hills, California. The Penguin’s Colin Farrell shows Batman villains can also conquer Golden Globes TV categories January 7, 2025 — Whitney Friedlander Colin Farrell received the 2025 Golden Globe for Best Performance by an Actor in a Limited Series, Anthology Series of Motion Picture Made for Television for his work as the (misunderstood?) titular villain in Max’s The Penguin. But this is not the first villain from the Batman universe to be recognized with a Golden Globe. Heath Ledger received the posthumous honor of Best Supporting Actor – Motion Picture for his work in Christopher Nolan’s The Dark Knight and Joaquin Phoenix received the Best Actor in a Motion Picture – Drama for his work in Todd Phillips’ Joker. “[Those] actors are, I think, for my money, the most extraordinarily talented and gifted and just brilliant artists in film that I’ve ever had the fortune to observe and be affected by,” Farrell said. “What Heath did in Chris Nolan’s Dark Knight was extraordinary, and will live on for future generations. And what Joaquin did with the Joker was exemplified by all the awards that he won. It was extraordinary. It was so special, both of them.” Share this Prev Next"
