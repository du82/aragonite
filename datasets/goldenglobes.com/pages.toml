["https://goldenglobes.com/articles/the-brutalist-and-emilia-perez-emerge-with-top-golden-globes-prizes"]
title = "‘The Brutalist’ and ‘Emilia Perez’ emerge with top Golden Globes prizes - Golden Globes"
description = "“The Brutalist” and “Emilia Perez” took the top movie prizes at the 82nd annual Golden Globe Awards, emerging as the only two films to garner multiple wins on a night that saw a mix of newcomers and familiar faces walk away with hardware at the venerable ceremony. “Shogun,” meanwhile, hacked off a third of the […]"
full_description = "Nick Gordon, Trevor Matthews, Brian Young, Adrien Brody, Brady Corbet, Felicity Jones, Daniel Blumberg win Best Motion Picture – Drama for “The Brutalist” during the 82nd Annual Golden Globes held at The Beverly Hilton on January 05, 2025 in Beverly Hills, California. ‘The Brutalist’ and ‘Emilia Perez’ emerge with top Golden Globes prizes January 5, 2025 — Brian Lowry “The Brutalist” and “Emilia Perez” took the top movie prizes at the 82nd annual Golden Globe Awards, emerging as the only two films to garner multiple wins on a night that saw a mix of newcomers and familiar faces walk away with hardware at the venerable ceremony. “Shogun,” meanwhile, hacked off a third of the dozen TV awards, as the epic drama set in feudal Japan repeated its dominance at the Emmys. An epic film tracing the history of the 20th century, “The Brutalist” took awards for star Adrien Brody and director Brady Corbet in addition to its win the drama balloting. “Nobody was asking for a 3 1/2-hour film about a midcentury designer,” Corbet said in his second acceptance speech, making a plea to allow directors the latitude to make movies that will challenge audiences. A Netflix production, the buoyant musical “Emilia Perez” amassed four awards, matching “Shogun” among all productions, including non-English-language film (representing France, although the movie is mostly in Spanish), supporting actress Zoe Saldana and best song, “El Mal.” Saldana, who opened the show with a tearful acceptance, was one of many first-time winners represented during the ceremony, which spread the wealth by distributing the remaining film categories among eight different movies. Marking the start of the awards season, the Globes as usual exhibited a strong international flavor, a quality augmented by the multiple wins notched by the historical epic drama series “Shogun,” the limited series “Baby Reindeer” and“Emilia Perez.” The awards also featured a number of first-time winners, including a few breakthroughs for veteran performers. Demi Moore, for example, was recognized for her lead role in “The Substance,” prompting her to choke up during an emotional acceptance speech in which she noted, “This is the first time I’ve ever won anything,” adding that someone had dismissed her as “a popcorn actress” earlier in her career. She had been nominated twice previously, the first coming for “Ghost” in 1991. The other top musical/comedy acting honor went to Sebastian Stan — a two-time nominee this year — for “A Different Man.” Stan expressed his pride at both of his nominated roles, the other coming for his portrayal of a young Donald Trump in “The Apprentice.” “We can’t be afraid and look away,” Stan said. The final top acting category went to Fernanda Torres for the Brazilian film “ I’m still here,” dedicating the win to her mother, Fernanda Montenegro, who was the first until this year only Brazilian actress to be nominated for a Golden Globe in 1998. Universal’s “Wicked” flew away with the award in the relatively new category of cinematic and box-office achievement, recognizing a movie that performed well theatrically for its commercial success as well as its artistry. Thus far, the movie has grossed more than $680 million worldwide, a record haul for a musical. “We can still make art that is a radical act of optimism,” the film’s director, John M. Chu, said, despite what he called a climate of pessimism and cynicism in the world. Among repeat winners, Kieran Culkin was recognized for the movie “A Real Pain,” after five previous nominations and a win for “Succession.” “Conclave” was honored for best screenplay, for writer Peter Straughan, and Trent Reznor and Atticus Ross were winners for their score for sexy tennis romantic triangle “Challengers.” In animation, the Latvian film “Flow,” built around a wordless cat, overcame Disney’s theatrical blockbuster sequels “Inside Out 2” and “Moana 2,” among others, to take the top prize. In television, as at the Emmys “Hacks” edged out previous winner “The Bear,” adding another honor for Jean Smart, who claimed her second Globe for the Max comedy series. Jeremy Allen White did cook up his third consecutive win for “The Bear.” “Shogun’s” victory included wins for stars Hiroyuki Sanada, Anna Sawai and Tadanobu Asano, all first-time nominees, as was Jessica Gunning, another Globe recipient as “Baby Reindeer’s” eccentric stalker. Padding his Globes total, Colin Farrell waddled off with his third win for “The Penguin,” a dark series about the Batman villain. “I guess it’s prosthetics from here on out,” Farrell quipped about his heavy makeup for the role. Jodie Foster also won her fourth Golden Globe — the first having come 36 years ago for “The Accused” — out of 11 nominations in her career, for the HBO limited series “True Detective: Night Country.” By TV service, FX/Hulu amassed five awards overall thanks to “Shogun” (the other going to “The Bear”), one more than HBO/Max, with Netflix’s TV fare receiving three trophies. Hosted by Nikki Glaser, the show was televised by CBS. An earlier event honored Viola Davis with the Cecil B. DeMille Award and Ted Danson with the Carol Burnett Award, the latter created in 2019, presented in recognition of their careers in entertainment and television, respectively. Share this Prev Next"
