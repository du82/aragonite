["https://www.goldenglobes.com/privacy-policy"]
title = "Privacy Policy - Golden Globes"
description = "PRIVACY POLICY Effective November 9, 2023 TABLE OF CONTENTS Introduction The Information We Collect How We Use the Information We Collect How We Share the Information Collected Legal Grounds for Using (Processing) Your Information Online Analytics Your Rights & Your Choices Retention of Your Information Cookies and Other Tracking Technologies Links to Third Party Sites […]"
full_description = "Privacy Policy PRIVACY POLICY Effective November 9, 2023 TABLE OF CONTENTS Introduction The Information We Collect How We Use the Information We Collect How We Share the Information Collected Legal Grounds for Using (Processing) Your Information Online Analytics Your Rights & Your Choices Retention of Your Information Cookies and Other Tracking Technologies Links to Third Party Sites Security Special Note For Parents Transfer Information to the United States Changes to This Privacy Policy Disputes; No Rights of Third Parties Contact Us: Data Privacy Officer Appendix A: Cookie Notice Introduction This privacy policy (“Privacy Policy” or “Policy”) explains how Golden Globes, LLC d/b/a GOLDEN GLOBES (including its parent company) (collectively, “GOLDEN GLOBES”, “we” and “us”) process information on our websites and our digital applications and via offline forms that are linked to or contain the URL for this Privacy Policy (all of the foregoing, collectively, “Services”). This Privacy Policy is incorporated into and subject to the Services’ Terms of Use. If you do not agree to the Terms of Use and this Privacy Policy, you must discontinue using the Services and all components and features therein. By using the Services, you acknowledge you have read and understand this Privacy Policy. For the purposes of data protection laws, GOLDEN GLOBES is the data controller, 11355 West Olympic Boulevard Los Angeles, CA 90064. The Information We Collect We obtain information from or about you when you use our Services. We may collect the following information about you or your use of the Services: Information You Provide to Us: Registration, or Contact Information such as e-mail address, name, phone number and address Information you submit such as submissions, questions and other messages you address to us directly through the Service’s website, online forms, by email, over the phone, or by post, including when you subscribe to our newsletter, register for an account, submit an award nomination through Yangaroo Demographic, statistical and interest information such as your age, date of birth, gender, interests, and lifestyle information. Other information You Choose to Provide directly to GOLDEN GLOBES in connection with your use of the Services Information We Collect Automatically: Device information and identifiers such as IP address; time zones, browser type and language; operating system; platform type; device type; software and hardware attributes; and unique device, advertising, and app identifiers. Internet network and device activity data such as information about files you download, domain names, landing pages, browsing activity, content or ads viewed and clicked, dates and times of access, pages viewed, products, goods or services viewed, forms you complete or partially complete, search terms, uploads or downloads, the URL that referred you to our Services, the web sites you visit after this web site; if you share our content to social media platforms; and other web usage activity and data logged by our web servers, whether you open an email and your interaction with email content, access times, error logs, and other similar information. See “Cookies and Other Tracking Technologies” below for more information about how we collect and use this information. Geolocation information such as city, state and ZIP code associated with your IP address or derived through Wi-Fi triangulation; time zones; and precise geolocation information from GPS-based functionality on your mobile devices, with your permission in accordance with your mobile device settings. Information from Third Parties: We may also collect the information outlined above (except “Other Information You Choose to Provide”), such as contact information, demographic and social media information, from other sources such as public and commercial data sources, affiliates, marketers, social media networks, and third party advertising partners in accordance with your privacy preferences on such services. For example, when you “like” or “follow” us on Facebook, Instagram, Twitter, or other social media sites, we may collect some information from you including your name, e-mail address, and any comments or content you post relevant to us depending on your settings. We also collect your information if you submit information to us through social media sites. We use this information to update, validate or supplement the information that you provide or we collected automatically, to target our communications so that we can inform you of products, services and offers that may be of interest, and for internal research, analytics and improvement of our Services. How We Use the Information We Collect Depending on the Services you use and how you use them, we, or our service providers, may use your information to: Provide, manage, and improve the Services; Administer your account, including to process your submissions and verify your information; Provide you with updates and information that you requested; To process your newsletter subscription, grant application or award nomination entry. Conduct internal business operations in support of our Services, such as auditing, security, resolving crashes, preventing fraud, invoicing and accounting, sales and marketing, analytics, and research and development; Contact you regarding our offerings, services, surveys, promotions, special events, and other subjects that we think may be of interest to you, including promotions, events and publications from our affiliates and their sponsors; Customize content and preferences for the Services; Comply with laws, regulations, and other legal process and procedures; Establish, exercise, or defend our legal rights; and Take steps that we reasonably believe to be necessary to protect the safety, security, and rights of GOLDEN GLOBES, its employees, service providers, and others. How We Share the Information Collected GOLDEN GLOBES may share or disclose information collected from and about you on the Services to other companies or individuals as set forth below. Service Providers. We may provide access to information to vendors that perform services on our behalf, including application processing, managing our email lists and sending email messages on our behalf, providing customer support, website maintenance, analytics providers, and performing other administrative services, in order to carry out such services. For example, we will share your grant application with our consultant, who evaluates applications and makes recommendations to our Trustees, board of directors and members. Our Affiliates. We may share information we collect within the extended GOLDEN GLOBES affiliates, including, for example, to deliver products and services to you, ensure a consistent level of service across our Services, internal management and administrative purposes on our behalf and enhance our products, services, and your customer experience. For Marketing Purposes. We may share your information with partners whose offerings may interest you such as other marketers, retailers, participatory databases and non-profit organizations. This includes licensing information about your interests and activities, and marketing segments created with such data, which we may share with third parties for their marketing purposes. For Legal Purposes. By using the Services, you acknowledge and agree that we may access, retain, and disclose the information we collect and maintain about you if required to do so by law or in a good faith belief that such access, retention or disclosure is reasonably necessary to: (a) comply with legal process or a regulatory investigation (e.g. a subpoena or court order); (b) enforce our Terms of Service, this Privacy Policy, or other contracts with you, including investigation of potential violations thereof; (c) respond to claims that any content violates the rights of third parties; and/or (d) protect the rights, property or personal safety of GOLDEN GLOBES, its agents and affiliates, its users and/or the public. This includes exchanging information with other companies and organizations for fraud protection, and spam/malware prevention, and similar purposes. Sales or Transfer of Business or Assets. In connection with a sale, merger, transfer, exchange, or other disposition (whether of assets, stock, or otherwise, including via bankruptcy) of all or a portion of the business conducted by the Website to which this policy applies, in which case the company will possess the information collected by us and will assume the rights and obligations regarding your information as described in this Privacy Policy (the “Acquisition Use”). Your Consent: If you have consented to our sharing of your information, we will also share your information consistent with your consent. Legal Grounds for Using (Processing) Your Information If you are a visitor from the European Economic Area, our legal basis for collecting and using the information described above will depend on the information concerned and the context in which we collect it. We collect information from you: Where we need it to perform our contract with you (i.e. our Terms of Service) in order to provide the Services you request; Where the processing is in our legitimate interests (provided that these aren’t overridden by your interests or rights) to secure our Services, prevent misuse, prevent fraud, and resolve technical issues; respond to your requests for information and provide you with more effective and efficient customer service; contact you regarding the Services, as well as surveys, promotions, special events, and other subjects that we think may be of interest to you (in accordance with applicable legal requirements); better understand your interests and improve our Services; personalize the Services; conduct internal business operations in support of our Services, such as auditing, sales and marketing, analytics, and research and development; and establish, exercise, or defend our legal rights. Where we have obtained your consent to send you marketing and other commercial communications and use non-strictly necessary cookies where local law requires such consent for such marketing and cookies (please note these requirements vary by jurisdiction and not all jurisdictions require consent for such uses) or use your information as set forth in a release or in connection with a consent; or Comply with our legal obligations. We may also collect and use personal information in connection with your consent in other circumstances, which will be presented to you at the time of collection. You can revoke your consent at any time, though you might not be able to use a service or feature that requires collection or use of that personal information. Your Rights & Your Choices Marketing Emails. If you want to stop receiving promotional e-mails from us (which we send pursuant to applicable law), click on the “unsubscribe” link in any promotional email from us. Please note that once we receive your request, it may take an additional period of time for your opt-out to become effective. We may still send you transactional communications such as receipts or updates to this Privacy Policy or our Terms of Service. SMS Text Communications. You may opt-out of SMS messages from us (which we send pursuant to applicable law) by following the instructions provided in the message or by texting back STOP to the number we send the text from for that particular SMS message. When we receive an opt-out message from you for SMS messages, we may send a message confirming our receipt of your opt-out. Analytics. You may have the ability to accept or decline certain cookies for analytics on our Services depending on your jurisdiction. Some analytics providers we partner with may provide specific opt-out mechanisms. For example, to prevent Google Analytics from using your information for analytics via the Google Analytics Opt-out Browser Add-on. Do Not Track. GOLDEN GLOBES does not act on “do not track” requests from your browser because, this way, we are able to personalize your experiences on our Services. Privacy Information for European Union, United Kingdom, Switzerland and other International Residents. Residents of the European Union, United Kingdom, Switzerland have the right to request the following, and some residents of other countries outside the United States may also have such rights. The laws of the EU, UK, Switzerland permit you to request and other local laws may permit you to request that we: Provide access to and/or a copy of certain information we have about you; Prevent the processing of your information for direct-marketing purposes; Update information which is out of date or incorrect; Delete certain information which we have about you; Restrict the way that we process and disclose certain of your information; Transfer your information to a third-party provider of services; and Revoke your consent for the processing of your information. We will consider all requests and provide our response within the time period stated by applicable law. Certain information may be exempt from such requests in some circumstances, which may include if we need to keep processing your information for our legitimate interests or to comply with a legal obligation. We may request you provide us with information necessary to confirm your identity before responding to your request. If you would like like to request the above, please contact us using the information in the “Contact Us” section below at any time. Retention of Your Information We keep your information for no longer than necessary for the purposes for which it is processed. The length of time for which we retain information depends on the purposes for which we collected and use it and/or as required to comply with applicable laws. Cookies and Other Tracking Technologies We use and allow certain other companies to use certain tracking technologies, including cookies, web beacons, and other similar technologies (collectively, “Cookies”) on the Services. To see an explanation what these technologies are and why we use them, as well as your rights to control our use of them please see our cookie notice below (“Cookie Notice”). We endeavor to adhere to the Digital Advertising Alliance’s (DAA) self-regulatory principles governing interest-based advertising. Links to Third Party Sites When you are on the Services, you may be directed to other websites that are operated and controlled by third parties that we do not control. We are not responsible for the privacy practices employed by any of these third parties. If you access a third-party website from the Services, you do so at your own risk, and you understand that this Privacy Policy does not apply to your use of such websites. Security We implement appropriate administrative, technical and security safeguards to help prevent unauthorized access, use, or disclosure of the info"
