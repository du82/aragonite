["https://goldmedalflour.com/recipes/self-rising-biscuits/ba2ce0e9-f27d-496c-8371-b091a1162509"]
title = "Self-Rising Biscuits | Gold Medal Flour US"
description = "Three ingredients and 30 minutes are all you need to have piping hot homemade biscuits."
full_description = "Self-Rising Biscuits 15 Minutes Prep 30 Minutes Total 14 Servings100 Calories per ServingThree ingredients and 30 minutes are all you need to have piping hot homemade biscuits.Ingredient List2 cups Gold Medal™ self-rising flour1/4 cup shortening3/4 cup milkPreparationHeat oven to 450°F. Lightly grease cookie sheet with shortening or cooking spray. Place flour in large bowl. Cut in shortening, using pastry blender (or pulling 2 table knives through ingredients in opposite directions), until mixture resembles coarse crumbs. Add milk; stir with fork until soft dough forms and mixture begins to pull away from sides of bowl.On lightly floured surface, knead dough just until smooth. Roll out dough to 1/2-inch thickness. Cut with floured 2-inch round cutter. Place biscuits with sides touching on cookie sheet.Bake 10 to 12 minutes or until golden brown. Immediately remove from cookie sheet. Serve warm.TipsFor Buttermilk Biscuits, use 3/4 cup plus 2 tablespoons buttermilk for the milk and add 1/4 teaspoon baking soda. Buttermilk biscuits have a slightly softer texture and a tangier flavor then regular biscuits made with milk.Nutrition InformationServings: 14Serving size: 1 BiscuitAmount per servingCalories100Amount per serving (Calories ): 100Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat4g6%Saturated Fat1g6%Trans Fat½g—% Value not availableCholesterol0mg0%Sodium230mg10%Total Carbohydrate14g5%Dietary Fiber0g0%Soluble Fiber0g—% Value not availableSugars0g—% Value not availableProtein2g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available0%Calcium—Value not available10%Iron—Value not available6%Potassium40mg1%Thiamin—Value not available10%Riboflavin—Value not available6%Niacin—Value not available6%Vitamin B6—Value not available0%Vitamin B12—Value not available0%Pantothenic Acid—Value not available0%Phosphorus—Value not available6%Magnesium—Value not available0%Zinc—Value not available0%Manganese—Value not available6%Selenium—Value not available8%Copper—Value not available0%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1, Fruit 0, Other Carbohydrate 0, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat ½, Fruits 0c, Vegetables 0c, Grains 1oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 1tspCarbohydrate ChoiceChoices per serving: 1Perfect for this RecipeGold Medal™ Self-Rising Flour"
