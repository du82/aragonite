["https://goldmedalflour.com/recipes/asiago-bread/a2b9e3e2-abe0-4fea-991e-3aa991588796"]
title = "Asiago Bread | Gold Medal Flour US"
description = "Fragrant herbs and Asiago cheese flavor this wonderful bread that can be  baked at home."
full_description = "Asiago Bread 25 Minutes Prep4 Hours 20 Minutes Total 24 Servings110 Calories per ServingFragrant herbs and Asiago cheese flavor this wonderful bread that can be baked at home.Ingredient List3 1/2 to 3 3/4 cups Gold Medal™ Better for Bread™ bread flour or Gold Medal™ all-purpose flour1 teaspoon granulated sugar1 package regular or fast-acting dry yeast (2 1/4 teaspoons)1 1/4 cups water2 tablespoons olive or vegetable oil2 teaspoons dried rosemary or thyme leaves, if desired1 teaspoon salt1 1/4 cups diced Asiago, Swiss or other firm cheeseCooking spray for greasing bowl and cookie sheetPreparationIn a large bowl, stir 1 1/2 cups of the flour, the sugar and yeast until well mixed. In a 1 1/2-quart saucepan, heat the water over medium heat until very warm and an instant-read thermometer reads 120°F to 130°F. Add the warm water to the flour mixture. Beat with a wire whisk or an electric mixer on low speed 1 minute, stopping frequently to scrape batter from side and bottom of bowl with a rubber spatula. Cover bowl tightly with plastic wrap; let stand about 1 hour or until bubbly.Stir in the oil, rosemary and salt with a wooden spoon. Stir in enough of the remaining flour, 1/2 cup at a time, until dough is soft, leaves side of bowl and is easy to handle. Cover with plastic wrap; let stand 15 minutes.Sprinkle flour lightly on a countertop or large cutting board. Place dough on floured surface. Knead by folding dough toward you, then with the heels of your hands, pushing dough away from you with a short rocking motion. Move dough a quarter turn and repeat. Continue kneading 5 to 10 minutes, sprinkling surface with more flour if dough starts to stick, until dough is smooth and springy. Knead in 1 cup of the cheese. Spray a large bowl with the cooking spray. Place dough in bowl, turning dough to grease all sides. Cover bowl tightly with plastic wrap; let rise in a warm place 45 to 60 minutes or until dough has doubled in size. Dough is ready if an indentation remains when you press your fingertips about 1/2 inch into the dough.Lightly spray a cookie sheet with the cooking spray. Sprinkle flour lightly on a countertop or large cutting board. Gently push your fist into the dough to deflate it. Place dough on floured surface. Gently shape into football-shaped loaf, about 12 inches long, by stretching sides of dough downward to make a smooth top. Place loaf with smooth side up on the cookie sheet. Coat loaf generously with flour. Cover loosely with plastic wrap; let rise in a warm place 45 to 60 minutes or until dough has almost doubled in size.Move oven racks to lowest and middle positions. Place an 8-inch or 9-inch square pan on the bottom oven rack; add hot water to the pan until about 1/2 inch from the top. Heat the oven to 450°F.Pour a small amount of cool water into a clean spray bottle. Spray the loaf lightly with water; sprinkle with a small amount of flour. With a sharp serrated knife, carefully cut a 1/2-inch-deep slash lengthwise down the center of the loaf. Sprinkle the remaining 1/4 cup cheese into the slash.Bake 10 minutes. Reduce the oven temperature to 400°F. Bake 20 to 25 minutes longer or until loaf is deep golden and sounds hollow when tapped. Remove from cookie sheet to a cooling rack. Cool 30 minutes before slicing; cut with a serrated knife.TipsClean spray bottleNutrition InformationServings: 24Serving size: 1 SliceAmount per servingCalories110Amount per serving (Calories ): 110Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat3&½g5%Saturated Fat1&½g7%Trans Fat0g—% Value not availableCholesterol10mg3%Sodium160mg7%Total Carbohydrate15g5%Dietary Fiber0g0%Soluble Fiber0g—% Value not availableSugars0g—% Value not availableProtein4g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available0%Calcium—Value not available6%Iron—Value not available6%Potassium25mg1%Thiamin—Value not available10%Riboflavin—Value not available8%Niacin—Value not available8%Vitamin B6—Value not available0%Vitamin B12—Value not available0%Pantothenic Acid—Value not available0%Phosphorus—Value not available2%Magnesium—Value not available0%Zinc—Value not available0%Manganese—Value not available8%Selenium—Value not available10%Copper—Value not available2%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1, Fruit 0, Other Carbohydrate 0, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat ½, Fruits 0c, Vegetables 0c, Grains 1oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 0tspCarbohydrate ChoiceChoices per serving: 1Perfect for this RecipeGold Medal™ All Purpose Flour"
