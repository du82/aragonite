title = "Bread Flour - All Purpose Flour - Gold Medal Flour"
description = "Gold Medal Flour Bread Flour is high in protein with more gluten making the dough more elastic, perfect for baking bread. Visit the site to learn more."
full_description = "Gold Medal™ Bread FlourMake chewy pizza crusts, lofty loaves and more with Gold Medal Bread Flour. What makes it different from all-purpose flour? This unbleached bread flour is higher in protein, which makes dough more elastic. Think pizza makers spinning and tossing dough to get that perfect round shape. A more elastic dough also helps give breads and crusts great lift and texture, earning a baker like you more compliments. Use it to make baguettes and other yeast breads such as rolls, buns, pizza crusts and hearth breads. For chewier results, you can even substitute Gold Medal Bread Flour cup for cup when a cookie or bread recipe calls for all-purpose or whole wheat flour. With your imagination and your own special touch, there are no limits to what you can do with this remarkable flour. Gold Medal has 135 years of baking success. We mill the flour that people rely on to make everything from family favorites to new and inspired creations. We put our best into everything we do — so you can too.CONTAINS WHEATBREAD FLOUR: This flour is specifically created for making the perfect bread doughBAKING INGREDIENTS: Great bread flour for all of your creationsPIZZA DOUGH: Show off your baking abilities with perfect bread loaves and pizza crustPANTRY STAPLE: Stock your pantry with Gold Medal Bread Flour for all your last-minute baking flour needsVERSATILE: Create bread, bread rolls, buns and other yeast breads with this versatile bread flourBOX TOPS FOR EDUCATION PARTICIPATING PRODUCT: Give back to schools with Gold Medal; Download the Box Tops App to learn more & start earning cash for your school or a school in needIngredientsWheat Flour, Niacin (a B vitamin), Iron, Thiamin Mononitrate (vitamin B1), Riboflavin (vitamin B2), Enzymes, Folic Acid (a B vitamin).CONTAINS WHEATPreparationStore itThousands of years ago, flour was stored in cool, dry caves, but any airtight container or tightly-sealable freezer bag in your kitchen (or fridge or freezer for long-term storage) will do just fine. Just bring to room temperature before using.Measure itSpoon flour into a dry measuring cup and level off with a knife. No sifting necessary.Substitute itWhen recipes call for all-purpose or whole wheat flour, you can substitute cup for cup with bread flour for chewier results. It works well for quick breads and cookies. For cakes and pastries it doesn’t work well.Cups Per PoundThere are 3 1/3 cups of flour per pound and about 33 1/3 cups per 10 pound bag.Nutrition FactsServing size: 1/4 cup (30g)Amount per servingCalories110As PackagedAmount per serving (Calories As Packaged): 110Nutrition FactsFood component / NutrientAmount, As Packaged% DVDaily Value*, As PackagedTotal Fat0g0%Saturated Fat0g0%Trans Fat0g—% Value not availableCholesterol0mg0%Sodium0mg0%Total Carbohydrate22g8%Dietary Fiber<1g3%Total Sugars0g—% Value not availableIncl. Added Sugars0g0%Protein3g—% Value not availableVitamin D0mcg0%Calcium0mg0%Iron1.5mg8%Potassium0mg0%Thiamin0.2mg15%Riboflavin0.1mg10%Niacin1.8mg10%Folate—Value not available20%Folic Acid45mcg—% Value not available*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.Ingredients, nutrition facts, and allergen statements can change. Always refer to the actual package for the most complete and accurate information."
