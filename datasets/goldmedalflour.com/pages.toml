["https://goldmedalflour.com/recipes/dark-chocolate-cupcakes/f5b33778-fc33-4f9e-9798-e596a456c66a"]
title = "Dark Chocolate Cupcakes | Gold Medal Flour US"
description = "Treat the chocolate lovers of your family with this delicious cupcake - a perfect baked dessert."
full_description = "Dark Chocolate Cupcakes 45 Minutes Prep2 Hours Total 12 Servings380 Calories per ServingTreat the chocolate lovers of your family with this delicious cupcake - a perfect baked dessert.Ingredient ListFoil baking cupsChocolate Shards2 tablespoons dark chocolate chips (1 oz)Frosting1 1/3 cups dark chocolate chips1/4 cup butter, cut into small pieces1 cup whipping creamCupcakes1 cup Gold Medal™ all-purpose flour3/4 teaspoon baking soda1/2 teaspoon salt1/4 teaspoon baking powder1/2 cup boiling water1/3 cup unsweetened baking cocoa1/2 cup butter or margarine3/4 cup sugar1/2 teaspoon vanilla1 eggPreparationIn small microwavable bowl, microwave 2 tablespoons chocolate chips uncovered on High 1 minute, until melted, stirring once halfway through heating. Pour chocolate onto 12 x10-inch sheet of waxed paper; spread in thin layer, forming 3 x3-inch square. Place second 12 x10-inch sheet of waxed paper over chocolate square; press to release air bubbles. Roll waxed paper tightly into a cylinder. Regenerate until set.In medium heat- place 1 1/3 cups chocolate chips and 1/4 cup butter. In small microwavable bowl, microwave whipping cream on High about 1 minute or until cream just begins to simmer. Pour cream over chips and butter; beat with whisk until chocolate is melted and mixture is smooth and shiny. Refrigerate 30 to 45 minutes until completely cooled, stirring occasionally.Heat oven to 350°F (325°F for dark or nonstick pans). Place foil baking cups in each of 12 regular-size muffin cups. In medium bowl, mix flour, baking soda, salt and baking powder; set aside. In small bowl, mix boiling water and cocoa until dissolved.In large bowl, beat 1/2 cup butter with electric mixer on medium speed 30 seconds. Gradually add sugar, beating well. Beat 2 more minutes. Beat in vanilla and egg until blended. On low, alternatively add flour mixture and cocoa mixture, beating just until blended. Divide batter among muffin cups. Bake 20 to 25 minutes or until toothpick comes out clean. Cool 5 minutes. Remove from pan to cooling racks. Cool completely.Beat frosting with electric mixture on medium speed until light and fluffy, about 30 seconds (Do not overheat.) Fit decorating bag with large star tip. Fill bag with frosting. Pipe frosting in circular top of each cupcake and mounding frosting slightly in center.Unroll waxed paper cylinder, causing chocolate to crack creating shards. Garnish each cupcake with chocolate shards. Store in refrigerator.TipsThe cupcakes should be stored in the refrigerator. To serve, allow cupcakes to stand at room temperature for about 15 minutes before serving.Don’t worry if at first it seems like the chocolate and whipping cream will never mix. Just keep beating with whisk, and soon you’ll see the mixture darkening and before you know it, the mixture will be a shiny and smooth chocolate mixture.Nutrition InformationServings: 12Serving size: 1 CupcakeAmount per servingCalories380Amount per serving (Calories ): 380Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat25g39%Saturated Fat16g78%Trans Fat½g—% Value not availableCholesterol70mg24%Sodium290mg12%Total Carbohydrate35g12%Dietary Fiber2g11%Soluble Fiber0g—% Value not availableSugars23g—% Value not availableProtein3g—% Value not availableVitamin D—Value not available6%Vitamin E—Value not available4%Calcium—Value not available4%Iron—Value not available15%Potassium200mg6%Thiamin—Value not available6%Riboflavin—Value not available8%Niacin—Value not available4%Vitamin B6—Value not available0%Vitamin B12—Value not available2%Pantothenic Acid—Value not available2%Phosphorus—Value not available10%Magnesium—Value not available10%Zinc—Value not available6%Manganese—Value not available25%Selenium—Value not available8%Copper—Value not available15%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 0, Fruit 0, Other Carbohydrate 2&½, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 5, Fruits 0c, Vegetables 0c, Grains 1oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 3tspCarbohydrate ChoiceChoices per serving: 2Perfect for this RecipeGold Medal™ All Purpose Flour"
