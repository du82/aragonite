["https://goldmedalflour.com/recipes/gingerbread-cookies-with-royal-icing/ec593971-1d2a-431a-9bdf-e1bcb0c65daf"]
title = "Gingerbread Cookies with Royal Icing | Gold Medal Flour US"
description = "Molasses, ginger, allspice, cinnamon and cloves bring robust flavor to a classic holiday cookie."
full_description = "Gingerbread Cookies with Royal Icing1 Hour 40 Minutes Prep3 Hours 40 Minutes Total 60 Servings60 Calories per ServingMolasses, ginger, allspice, cinnamon and cloves bring robust flavor to a classic holiday cookie.Ingredient ListCookies1/2 cup butter or margarine, softened1/2 cup packed brown sugar1/2 cup mild-flavor or full-flavor molasses1/3 cup cold water3 1/2 cups Gold Medal™ all-purpose flour2 teaspoons baking soda2 teaspoons ground ginger1/2 teaspoon ground allspice1/2 teaspoon ground cinnamon1/4 teaspoon salt1/4 teaspoon ground clovesRoyal Icing1 tablespoon meringue powder2 tablespoons cold water1 cup powdered sugarGranulated sugar, if desiredPreparationIn large bowl, beat butter, brown sugar, molasses and cold water with electric mixer on medium speed (or with wooden spoon) until well mixed. Mixture may look curdled. With wooden spoon, stir in remaining cookie ingredients until soft dough forms. Wrap with plastic wrap; refrigerate until firm, at least 2 hours.Heat oven to 350°F. Lightly spray cookie sheets with cooking spray. On floured surface, roll dough 1/8 inch thick.Cut dough with floured 3 1/2- by 2 1/2-inch gingerbread boy or girl cookie cutter or other cookie cutter. Place on cookie sheets 2 inches apart. Reroll dough, and cut additional cookies.Bake 10 to 12 minutes or until no indentation remains when touched. Immediately remove from cookie sheets to cooling rack. Cool cookie sheets 10 minutes between batches. Cool cookies completely, about 30 minutes.In medium bowl, beat meringue powder and cold water with electric mixer on medium speed until peaks form. Gradually beat in powdered sugar until soft peaks form, about 1 minute. Spoon icing into decorating bag fitted with medium round tip, and pipe over cookies. Sprinkle with sugar. Let stand about 5 minutes or until icing is set.TipsLook for meringue powder in the baking aisle of the grocery store.Nutrition InformationServings: 60Serving size: 1 CookieAmount per servingCalories60Amount per serving (Calories ): 60Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat1&½g2%Saturated Fat1g5%Trans Fat0g—% Value not availableCholesterol0mg0%Sodium65mg3%Total Carbohydrate12g4%Dietary Fiber0g0%Soluble Fiber0g—% Value not availableSugars5g—% Value not availableProtein0g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available0%Calcium—Value not available0%Iron—Value not available2%Potassium55mg2%Thiamin—Value not available4%Riboflavin—Value not available2%Niacin—Value not available2%Vitamin B6—Value not available0%Vitamin B12—Value not available0%Pantothenic Acid—Value not available0%Phosphorus—Value not available0%Magnesium—Value not available2%Zinc—Value not available0%Manganese—Value not available6%Selenium—Value not available4%Copper—Value not available0%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 0, Fruit 0, Other Carbohydrate 1, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 0, Fruits 0c, Vegetables 0c, Grains 0oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 0tspCarbohydrate ChoiceChoices per serving: 1Perfect for this RecipeGold Medal™ All Purpose Flour"
