["https://goldmedalflour.com/recipes/banana-blueberry-bread/c756df64-1806-449d-90ca-27767ce39217"]
title = "Banana Blueberry Bread | Gold Medal Flour US"
description = "Go bananas for quickbread with blueberries."
full_description = "Banana Blueberry Bread 15 Minutes Prep2 Hours 25 Minutes Total 48 Servings125 Calories per ServingGo bananas for quickbread with blueberries. Ingredient List1 cup butter or margarine, softened1 2/3 cups sugar4 eggs5 medium ripe bananas, mashed1 cup reduced-fat sour cream2 teaspoons vanilla3 cups Gold Medal™ all-purpose flour2 teaspoons baking soda1 teaspoon salt1 cup dried blueberriesPreparationMove oven rack to low position so that tops of pans will be in center of oven. Heat oven to 350°F. Grease bottoms only of 2 loaf pans, 8 1/2x4 1/2x2 1/2 or 9x5x3 inches.In large bowl, beat butter and sugar with electric mixer on medium speed until blended. Stir in eggs until well blended. Add bananas, sour cream and vanilla. Beat until smooth. Stir in flour, baking soda and salt just until moistened. Stir in blueberries. Pour into pans.Bake 1 hour to 1 hour 10 minutes or until toothpick inserted in center comes out clean. Cool 10 minutes. Loosen sides of loaves from pans; remove from pans. Cool completely on wire rack before slicing. Wrap tightly and store in refrigerator up to 1 week.TipsGrease only the bottoms of loaf pans for nut breads. Ungreased sides allow the batter to cling while rising during baking, which helps form a gently rounded top. If sides are greased, the edges of the loaf may have ridges.Nutrition InformationServings: 48Serving size: 1 SliceAmount per servingCalories125Amount per serving (Calories ): 125Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat5g0%Saturated Fat3g0%Trans Fat—Value not available—% Value not availableCholesterol30mg0%Sodium140mg0%Total Carbohydrate19g0%Dietary Fiber1g0%Soluble Fiber—Value not available—% Value not availableSugars—Value not available—% Value not availableProtein2g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available0%Calcium—Value not available0%Iron—Value not available2%Potassium—Value not available0%Thiamin—Value not available0%Riboflavin—Value not