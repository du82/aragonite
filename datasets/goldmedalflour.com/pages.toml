title = "Chocolate-Banana Snack Cake | Gold Medal Flour US"
description = "Munch on a snack cake that needs no frosting!  Chocolate chips bake on top of a moist chocolate-banana cake."
full_description = "Chocolate-Banana Snack Cake 15 Minutes Prep1 Hour 40 Minutes Total 9 Servings270 Calories per ServingMunch on a snack cake that needs no frosting! Chocolate chips bake on top of a moist chocolate-banana cake.Ingredient List2 very ripe medium bananas1 1/4 cups Gold Medal™ all-purpose flour3/4 cup sugar1/4 cup unsweetened baking cocoa1/3 cup vegetable oil1/3 cup water1 teaspoon baking soda1 teaspoon white vinegar1/4 teaspoon salt1/3 cup semisweet chocolate chipsPreparationHeat oven to 350°F. Place bananas in ungreased 8-inch square pan; mash with fork. Stir in remaining ingredients except chocolate chips. Sprinkle chocolate chips over batter.Bake 35 to 37 minutes or until toothpick inserted in the center comes out clean. Cool completely, about 45 minutes.TipsFreeze ripe bananas in their peels when they can't be used right away. Thaw each banana 30 to 60 seconds in microwave before using in recipes.Nutrition InformationServings: 9Serving size: 1 ServingAmount per servingCalories270Amount per serving (Calories ): 270Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat11g16%Saturated Fat2&½g13%Trans Fat0g—% Value not availableCholesterol0mg0%Sodium210mg9%Total Carbohydrate41g14%Dietary Fiber2g9%Soluble Fiber0g—% Value not availableSugars23g—% Value not availableProtein3g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available6%Calcium—Value not available0%Iron—Value not available8%Potassium180mg5%Thiamin—Value not available10%Riboflavin—Value not available8%Niacin—Value not available6%Vitamin B6—Value not available8%Vitamin B12—Value not available0%Pantothenic Acid—Value not available0%Phosphorus—Value not available4%Magnesium—Value not available8%Zinc—Value not available2%Manganese—Value not available15%Selenium—Value not available10%Copper—Value not available10%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general n