full_description = "Bread Machine Multigrain Loaf 10 Minutes Prep3 Hours 40 Minutes Total 12 Servings170 Calories per ServingPlug in your bread machine. Here's a delicious way to enjoy grains.Ingredient List1 1/2-Pound (12 Slices)1 1/4 cups water2 tablespoons butter or margarine, softened1 1/3 cups Gold Medal™ Better for Bread™ flour1 1/3 cups Gold Medal™ whole wheat flour1 cup 7-grain or multigrain hot cereal (uncooked)3 tablespoons packed brown sugar1 1/4 teaspoons salt2 1/2 teaspoons bread machine yeast2-Pound (16 Slices)1 1/2 cups water2 tablespoons butter or margarine, softened1 1/2 cups Gold Medal™ Better for Bread™ flour1 1/2 cups Gold Medal™ whole wheat flour1 1/4 cups 7-grain or multigrain hot cereal (uncooked)1/4 cup packed brown sugar1 1/2 teaspoons salt2 1/2 teaspoons bread machine yeast*PreparationMake 1 1/2-pound recipe with bread machines that use 3 cups flour, or make 2-pound recipe with bread machines that use 4 cups flour. Measure carefully, placing all ingredients in bread machine pan in the order recommended by the manufacturer.Select Basic/White cycle. Use Medium or Light crust color. Remove baked bread from pan; cool on cooling rack.TipsYou'll find 7-grain cereal in the hot cereal section of your supermarket or at a natural-foods or co-op store.Nutrition InformationServings: 12Serving size: 1 SliceAmount per servingCalories170Amount per serving (Calories ): 170Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat2&½g4%Saturated Fat1&½g7%Trans Fat0g—% Value not availableCholesterol5mg2%Sodium260mg11%Total Carbohydrate31g10%Dietary Fiber4g15%Soluble Fiber0g—% Value not availableSugars4g—% Value not availableProtein5g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available0%Calcium—Value not available0%Iron—Value not available10%Potassium170mg5%Thiamin—Value not available15%Riboflavin—Value not available10%Niacin—Value not available10%Vitamin B6—Value not available6%Vitamin B12—Value not available0%Panto