["https://goldmedalflour.com/recipes/banana-bread/61f72fc8-5fea-4605-ad31-6ab2242470c6"]
title = "Banana Bread | Gold Medal Flour US"
description = "Rich buttermilk, crunchy nuts and flavorful, ripe bananas make this banana bread tops."
full_description = "Banana Bread 15 Minutes Prep2 Hours 30 Minutes Total 24 Servings70 Calories per ServingRich buttermilk, crunchy nuts and flavorful, ripe bananas make this banana bread tops.Ingredient List1 1/4 cups sugar1/2 cup butter or margarine, softened2 eggs1 1/2 cups mashed very ripe bananas (3 to 4 medium)1/2 cup buttermilk1 teaspoon vanilla2 1/2 cups Gold Medal™ all-purpose flour1 teaspoon baking soda1 teaspoon salt1 cup chopped nuts, if desiredPreparationMove oven rack to low position so that tops of pans will be in center of oven. Heat oven to 350°F. Grease bottoms only of 2 loaf pans, 8 1/2x4 1/2x2 1/2 inches, or 1 loaf pan, 9x5x3 inches. Mix sugar and butter in large bowl. Stir in eggs until well blended. Add bananas, buttermilk and vanilla. Beat until smooth. Stir in flour, baking soda and salt just until moistened. Stir in nuts. Pour into pans. Bake 8-inch loaves about 1 hour, 9-inch loaf about 1 1/4 hours, or until toothpick inserted in center comes out clean. Cool 10 minutes. Loosen sides of loaves from pans; remove from pans and place top side up on wire rack. Cool completely, about 2 hours, before slicing. Wrap tightly and store at room temperature up to 4 days, or refrigerate up to 10 days. TipsMini Banana Breads make great gifts! To make, grease bottoms only of 10 miniature loaf pans, 4 1/2x2 3/4x1 1/4 inches. Divide batter among pans (about 1/2 cup each). Bake 30 to 35 minutes.Stir 1/2 cup chocolate, peanut butter or butterscotch chips into the batter for mouthwatering flavor combinations.Rise to the occasion! If using self-rising flour, there is no need to add baking soda and salt.No buttermilk on hand? In an emergency, you can mix 1 1/2 teaspoons lemon juice or white vinegar and enough milk to make 1/2 cup. Or substitute 1/2 cup plain yogurt.Nutrition InformationServings: 24Serving size: 1 SliceAmount per servingCalories70 Amount per serving (Calories ): 70 Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat2 g—% Value not availableSaturated Fat1 g—% Value not availableCholesterol15 mg—% Value not availableSodium95 mg—% Value not availableTotal Carbohydrate12 g—% Value not availableDietary Fiber0g—% Value not availableProtein1 g—% Value not availableVitamin D—Value not available0%Calcium—Value not available0%Iron—Value not available2%Potassium40 mg—% Value not available*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1 Perfect for this RecipeGold Medal™ All Purpose Flour"
