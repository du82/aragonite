["https://goldmedalflour.com/recipes/soft-pita-breads/e68a728b-07c7-406d-a995-5258b749dca9"]
title = "Soft Pita Breads | Gold Medal Flour US"
description = "These pita bread pockets are soft, chewy and very easy to bake!"
full_description = "Soft Pita Breads 30 Minutes Prep2 Hours 30 Minutes Total 8 Servings220 Calories per ServingThese pita bread pockets are soft, chewy and very easy to bake!Ingredient List3 to 4 cups Gold Medal™ all-purpose flour1 tablespoon sugar1 package (2 1/4 teaspoons) fast-acting dry yeast1 1/2 teaspoons salt1 1/4 cups warm water (105°F to 115°F)2 tablespoons olive oil, plus more for bowlPreparationIn large bowl, mix 3 cups of the flour, the sugar, yeast and salt with whisk. Using wooden spoon, stir in warm water and 2 tablespoons olive oil just until soft dough forms. Transfer dough to floured surface. Knead by hand 10 minutes, adding just enough remaining flour as needed until dough is smooth, soft and elastic.Drizzle large clean bowl lightly with olive oil. Shape dough into ball, and place in oiled bowl. Cover tightly with plastic wrap, and let rise at room temperature 1 to 1 1/2 hours or until doubled.Punch down dough; divide into 8 equal pieces. Shape each piece into ball. Cover with damp kitchen towel; let rest 20 minutes.Meanwhile, place baking stone or upside-down baking sheet in center of oven; heat to 400°F. Roll out each dough ball to 1/4-inch thick round. Transfer to baking stone, 3 to 4 at a time, and bake 4 to 5 minutes or until puffy and baked through (do not turn).TipsSwap all-purpose flour for Gold Medal™ bread flour, if desired.Stuff pita bread with your favorite sandwich fillings, or cut into wedges to dip into hummus.Nutrition InformationServings: 8Serving size: 1 PitaAmount per servingCalories220Amount per serving (Calories ): 220Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat5g7%Saturated Fat½g3%Trans Fat0g—% Value not availableCholesterol0mg0%Sodium450mg19%Total Carbohydrate38g13%Dietary Fiber1g7%Soluble Fiber1g—% Value not availableSugars2g—% Value not availableProtein5g—% Value not availableVitamin D—Value not available0%Vitamin E—Value not available4%Calcium—Value not available0%Iron—Value not available10%Potassium60mg2%Thiamin—Value not available35%Riboflavin—Value not available15%Niacin—Value not available15%Vitamin B6—Value not available0%Vitamin B12—Value not available0%Pantothenic Acid—Value not available4%Phosphorus—Value not available6%Magnesium—Value not available2%Zinc—Value not available2%Manganese—Value not available15%Selenium—Value not available25%Copper—Value not available4%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1&½, Fruit 0, Other Carbohydrate 1, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 1, Fruits 0c, Vegetables 0c, Grains 3oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 1tspCarbohydrate ChoiceChoices per serving: 2&½Perfect for this RecipeGold Medal™ All Purpose Flour"
