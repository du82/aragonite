["https://goldmedalflour.com/recipes/cake-doughnuts/37251abd-3b9b-4262-8bd7-6e905916ae55"]
title = "Cake Doughnuts | Gold Medal Flour US"
description = "This homemade cake doughnut recipe is the only one you'll ever need!"
full_description = "Cake Doughnuts 15 Minutes Prep 45 Minutes Total 24 ServingsThis homemade cake doughnut recipe is the only one you'll ever need!Ingredient ListVegetable oil3 1/3 cups Gold Medal™ all-purpose flour1 cup granulated sugar3/4 cup milk3 teaspoons baking powder1/2 teaspoon salt1/2 teaspoon ground cinnamon1/4 teaspoon ground nutmeg2 tablespoons shortening2 eggsRainbow Doughnut IcingPreparationIn deep fryer or 3-quart saucepan, heat 3 to 4 inches oil to 375°F.In large bowl, beat 1 1/2 cups of the flour and the remaining ingredients except Rainbow Doughnut Icing with electric mixer on low speed 30 seconds, scraping bowl constantly. Beat on medium speed 2 minutes, scraping bowl occasionally. Stir in remaining flour.On generously floured surface, roll dough lightly to coat. Gently roll to 3/8-inch thickness. Cut dough with floured 2 1/2-inch doughnut cutter.Fry doughnuts in oil, 2 to 3 at a time, turning as they rise to the surface. Fry 2 to 3 minutes or until golden brown on both sides. Remove from oil with slotted spoon; drain on paper towels. Cool slightly and frost with doughnut icing.TipsThese old-fashioned doughnuts are perfect for dipping into your favorite hot beverage. If you’d like to make buttermilk doughnuts, you can substitute buttermilk for the milk, decrease the baking powder to 2 teaspoons and add 1 teaspoon baking soda.The doughnuts are also great plain or just sprinkled with granulated or powdered sugar instead of the icing.Nutrition InformationServings: 24Serving size: 1 DoughnutAmount per servingCaloriesAmount per serving (Calories ): Nutrition FactsFood component / NutrientAmount% DVDaily Value*Trans Fat0g—% Value not availableSoluble Fiber0g—% Value not availableVitamin E—Value not available0%Pantothenic Acid—Value not available0%Manganese—Value not available8%Selenium—Value not available10%Copper—Value not available2%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1, Fruit 0, Other Carbohydrate 1, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 1Carbohydrate ChoiceChoices per serving: 2Perfect for this RecipeGold Medal™ All Purpose Flour"
