["https://goldmedalflour.com/recipes/rosettes/bbf4852e-53fb-4531-8d25-68291ee68788"]
title = "Rosettes | Gold Medal Flour US"
description = "Deep-fried cookies?  These light, crispy cookies are fried to golden perfection using a special rosette iron."
full_description = "Rosettes 45 Minutes Prep 45 Minutes Total 36 Servings45 Calories per ServingDeep-fried cookies? These light, crispy cookies are fried to golden perfection using a special rosette iron.Ingredient ListRosettes2 tablespoons granulated sugar1 teaspoon salt2 eggs2 tablespoons vegetable oil1 cup water or milk1 cup Gold Medal™ all-purpose flourVegetable oilPowdered sugar, if desiredEasy Chocolate Glaze, if desired1/2 cup semisweet chocolate chips2 tablespoons butter or margarine2 tablespoons corn syrupPreparationIn deep medium bowl, beat granulated sugar, the salt and eggs with electric mixer on medium speed. Beat in 2 tablespoons oil, the water and flour until smooth. In 3-quart saucepan, heat oil (2 to 3 inches) to 400°F. Heat rosette iron by placing in hot oil 1 minute. Tap excess oil from iron on paper towels. Dip hot iron into batter just to top edge (don't go over top). Fry about 30 seconds or until golden brown. Immediately remove rosette; invert onto paper towels to cool. (If rosette is not crisp, batter is too thick; stir in a small amount of water or milk.) Heat iron in hot oil and tap on paper towels before making each rosette. (If iron is not hot enough, batter will not stick.) Sprinkle with powdered sugar just before serving or drizzle with chocolate glaze.To make chocolate glaze, in 2-cup microwavable measuring cup, place chocolate chips, butter and corn syrup. Microwave uncovered on Medium 1 to 2 minutes or until chocolate can be stirred smooth. Drizzle glaze over rosettes. TipsMaking rosettes is a Christmas tradition for many, and one you may want to start in your own home!Add the glaze or powdered sugar to half of your rosettes, and leave the rest plain to use as an interesting base for savory foods such as chili or creamy main dishes such as beef stroganoff or chicken à la king.Sprinkle cinnamon-sugar over hot rosettes instead of adding the powdered sugar or glaze.The bottom of the rosette can be dipped about 1/4 inch into the glaze if desired. Draw the cookies across the edge of the bowl of glaze to remove the excess, then turn upside down until the glaze sets. If using a vanilla glaze, you can tint it with food color.These delicate, lacy cookies are easily broken, so store them carefully in a loosely covered, flat container.A table fork works well for removing fried rosettes from the iron.Serve as a cookie or as a base for sundaes topped with ice cream and chocolate or fruit sauces.Nutrition InformationServings: 36Serving size: 1 RosetteAmount per servingCalories45 Amount per serving (Calories ): 45 Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat2 g—% Value not availableSaturated Fat0g—% Value not availableCholesterol10 mg—% Value not availableSodium70 mg—% Value not availableTotal Carbohydrate6 g—% Value not availableDietary Fiber0g—% Value not availableProtein1 g—% Value not availableVitamin D—Value not available0%Calcium—Value not available0%Iron—Value not available0%Potassium0mg—% Value not available*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch ½Perfect for this RecipeGold Medal™ All Purpose Flour"
