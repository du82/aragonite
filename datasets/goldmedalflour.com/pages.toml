title = "Irish Soda Bread | Gold Medal Flour US"
description = "Whether or not you're Irish, this classic quick bread recipe brings great taste into your kitchen."
full_description = '''Irish Soda Bread 10 Minutes Prep 55 Minutes Total 1 Serving110 Calories per ServingWhether or not you're Irish, this classic quick bread recipe brings great taste into your kitchen.Ingredient List3 tablespoons butter or margarine, softened2 1/2 cups Gold Medal™ all-purpose flour2 tablespoons sugar1 teaspoon baking soda1 teaspoon baking powder1/2 teaspoon salt1/3 cup raisins, if desired3/4 cup buttermilkPreparationHeat oven to 375°F. Grease cookie sheet. Cut butter into flour, sugar, baking soda, baking powder and salt in large bowl, using pastry blender or crisscrossing 2 knives, until mixture resembles fine crumbs. Stir in raisins and just enough buttermilk so dough leaves side of bowl. Turn dough onto lightly floured surface. Knead 1 to 2 minutes or until smooth. Shape into round loaf, about 6 1/2 inches in diameter. Place on cookie sheet. Cut an X shape about 1/2 inch deep through loaf with floured knife.Bake 35 to 45 minutes or until golden brown. Brush with butter or margarine, softened, if desired. TipsWhy the "X" on top of Irish soda bread? Legend tells us that this cross is meant to scare away evil spirits. Spooky!Use the "whack" method to soften butter and margarine: Give each side of the chilled stick a good "whack" with a rolling pin.Nutrition InformationServings: 1Serving size: 1 SliceAmount per servingCalories110 Amount per serving (Calories ): 110 Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat3 g—% Value not availableSaturated Fat2 g—% Value not availableCholesterol10 mg—% Value not availableSodium240 mg—% Value not availableTotal Carbohydrate19 g—% Value not availableDietary Fiber1 g—% Value not availableProtein3 g—% Value not availableVitamin D—Value not available0%Calcium—Value not available4%Iron—Value not available6%Potassium50 mg—% Value not available*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1 , Fat ½Perfect for this RecipeGold Medal™ All Purpose Flour'''
