full_description = "Strawberries and Cream Yogurt Cake 15 Minutes Prep1 Hour 25 Minutes Total 12 Servings360 Calories per ServingThis one-bowl yogurt cake is big on visual appeal but low on fuss. It has a delicious berry flavor, thanks to fresh strawberries and strawberry jam, and is super-moist, thanks to the yogurt stirred into the batter.Ingredient List2 containers (6 oz each) Yoplait® Original strawberry yogurt1 1/2 cups plus 2 teaspoons granulated sugar1/2 cup butter, melted2 teaspoons vanilla3 eggs2 1/4 cups Gold Medal™ all-purpose flour 2 teaspoons baking powder1/2 teaspoon salt1/2 cup strawberry jam1 1/4 cups quartered fresh strawberriesPowdered sugar, if desiredPreparationHeat oven to 350°F. Spray 13x9-inch pan with cooking spray.In large bowl, stir together yogurt, 1 1/2 cups of the granulated sugar, the melted butter and vanilla until well combined. Mix in eggs, 1 at a time, until well blended. Add flour, baking powder and salt; beat with rubber spatula or wooden spoon until smooth.Pour batter into pan, spreading evenly. Stir strawberry jam until smooth. Drop by teaspoonfuls on top of batter. Sprinkle with strawberries and remaining 2 teaspoons granulated sugar.Bake 40 to 50 minutes or until toothpick inserted in center comes out clean. Cool 20 minutes. Sprinkle with powdered sugar.TipsRefrigerate this cake during humid weather or in humid climates. If stored at room temperature, this very moist cake may form mold.Nutrition InformationServings: 12Serving size: 1 ServingAmount per servingCalories360Amount per serving (Calories ): 360Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat11g17%Saturated Fat2g10%Trans Fat0g—% Value not availableCholesterol50mg16%Sodium220mg9%Total Carbohydrate59g20%Dietary Fiber1g5%Soluble Fiber0g—% Value not availableSugars36g—% Value not availableProtein5g—% Value not availableVitamin D—Value not available6%Vitamin E—Value not available4%Calcium—Value not available10%Iron—Value not available8%Potassium75mg2%Thiamin—Value not available15%Riboflavin—Value not available10%Niacin—Value not available8%Vitamin B6—Value not available0%Vitamin B12—Value not available2%Pantothenic Acid—Value not available4%Phosphorus—Value not available10%Magnesium—Value not available2%Zinc—Value not available2%Manganese—Value not available10%Selenium—Value not available25%Copper—Value not available2%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1&½, Fruit 0, Other Carbohydrate 2&½, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 2, Fruits 0c, Vegetables 0c, Grains 1oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 2tspCarbohydrate ChoiceChoices per serving: 4Perfect for this RecipeGold Medal™ All Purpose Flour"
