["https://goldmedalflour.com/recipes/classic-sour-cream-coffee-cake/94f310ec-cd8a-44f3-89ea-6012d3cc8051"]
title = "Classic Sour Cream Coffee Cake | Gold Medal Flour US"
description = "Savor a classic!  A brown sugar, nut and spice filling is layered and baked in a rich sour cream coffee cake."
full_description = "Classic Sour Cream Coffee Cake 20 Minutes Prep1 Hour 40 Minutes Total 16 Servings430 Calories per ServingSavor a classic! A brown sugar, nut and spice filling is layered and baked in a rich sour cream coffee cake.Ingredient ListFilling1/2 cup packed brown sugar 1/2 cup chopped pecans1 1/2 teaspoons ground cinnamonCoffee Cake3 cups Gold Medal™ all-purpose or whole wheat flour1 1/2 teaspoons baking powder1 1/2 teaspoons baking soda3/4 teaspoon salt1 1/2 cups granulated sugar3/4 cup butter or margarine, softened1 1/2 teaspoons vanilla3 eggs1 1/2 cups sour creamLight Brown Glaze1/4 cup butter2 cups powdered sugar1 teaspoon vanilla1 to 2 tablespoons milkPreparationHeat oven to 350°F. Grease 12-cup fluted tube cake pan or 10-inch angel food (tube) cake pan.In small bowl, mix all Filling ingredients; set aside.In medium bowl, mix flour, baking powder, baking soda and salt; set aside. In large bowl, beat granulated sugar, 3/4 cup butter, 1 1/2 teaspoons vanilla and the eggs with electric mixer on medium speed 2 minutes, scraping bowl occasionally. Beat in flour mixture alternately with sour cream on low speed.Spread 1/3 of the batter (about 2 cups) in pan; sprinkle with 1/3 of the Filling (about 6 tablespoons). Repeat twice.Bake about 1 hour or until toothpick inserted near center comes out clean. Cool 10 minutes; remove from pan to wire rack. Cool 10 minutes.Meanwhile, in 1 1/2-quart saucepan, heat 1/4 cup butter over medium heat until very light brown; remove from heat. Stir in powdered sugar and 1 teaspoon vanilla. Stir in milk, 1 tablespoon at a time, until glaze is smooth and thin enough to drizzle. Drizzle cake with glaze.TipsSkip the glaze and just sprinkle the coffee cake with powdered sugar or a mixture of powdered sugar and cinnamon.Nutrition InformationServings: 16Serving size: 1 ServingAmount per servingCalories430Amount per serving (Calories ): 430Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat19g30%Saturated Fat9g45%