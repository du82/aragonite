["https://goldmedalflour.com/recipes/chocolate-chip-banana-muffins-white-whole-wheat-flour/a6d476f6-a796-479c-a524-3e8fe0fe079f"]
title = "Chocolate Chip Banana Muffins (White Whole Wheat Flour) | Gold Medal Flour US"
description = "Don't throw away those bananas that are turning brown and soft. They're perfect for making these muffins moist with lots of banana flavor."
full_description = "Chocolate Chip Banana Muffins (White Whole Wheat Flour) 10 Minutes Prep 30 Minutes Total 12 ServingsDon't throw away those bananas that are turning brown and soft. They're perfect for making these muffins moist with lots of banana flavor.Ingredient List1 cup mashed very ripe bananas (2 medium)1/2 cup packed brown sugar1/3 cup milk1/4 cup vegetable oil1 egg1 1/2 cups Gold Medal™ white whole wheat flour2 1/2 teaspoons baking powder1/2 teaspoon salt1/2 cup miniature semisweet chocolate chips2 tablespoons granulated sugarPreparationHeat oven to 400°F. Grease bottoms only of 12 regular-size muffin cups with shortening or cooking spray, or place paper baking cup in each muffin cup.In large bowl, beat bananas, brown sugar, milk, oil and egg with electric mixer on medium speed, or mix with spoon. Stir in flour, baking powder and salt just until flour is moistened. Fold miniature chocolate chips into batter.Divide batter evenly among muffin cups; sprinkle each with 1/2 teaspoon sugar. Bake 13 to 18 minutes or until toothpick inserted in center comes out clean. Immediately remove from pan.TipsGold Medal® White Whole Wheat flour can be used in any recipe. It’s the best of both worlds—100% whole grain but with a lighter taste and color. Start substituting 25% or 50% of the all-purpose flour with Gold Medal® White Whole Wheat flour, gradually increasing proportion as desired.Nutrition InformationNutrition facts are not available for this recipePerfect for this RecipeGold Medal™ Organic All Purpose Flour"
