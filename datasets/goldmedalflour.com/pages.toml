full_description = '''Gold Medal™ All Purpose FlourGold Medal All Purpose Flour is our most versatile flour. Use it for any recipe that simply calls for "flour." It's strong enough to take high-rising yeast breads to new heights and mellow enough to add the perfect texture to a batch of cookies. Gold Medal All Purpose Flour is made of the stuff you can trust — a blend of hard and soft wheat so every bite looks and tastes its absolute best. Gold Medal has 135 years of baking success. We mill the flour that people rely on to make everything from family favorites to new and inspired creations. We put our best into everything we do — so you can too.CONTAINS WHEAT INGREDIENTS.ALL-PURPOSE FLOUR: Our most versatile flour for any recipe that simply calls for "flour"BAKING INGREDIENT: Especially ideal for baking cookies and cakesMULTI-USE: Strong enough to take high-rising yeast breads to new heights and mellow enough for a fluffy, delicious cakeFOR YOUR PANTRY: Stock your pantry with Gold Medal Flour for all your last-minute baking needsPREMIUM QUALITY: Over 135 years of baking successIngredientsBleached Wheat Flour, Niacin (a B vitamin), Iron, Thiamin Mononitrate (vitamin B1), Riboflavin (vitamin B2), Enzymes, Folic Acid (a B vitamin).CONTAINS WHEAT INGREDIENTS.PreparationStore itThousands of years ago, flour was stored in cool, dry caves, but any airtight container or tightly-sealable freezer bag in your kitchen (or fridge or freezer for long-term storage) will do just fine. Just bring to room temperature before using.Measure itSpoon flour into a dry measuring cup and level off with a knife. No sifting necessary.Substitute itAll-purpose flour can be used in recipes calling for self-rising flour. For each cup of flour in the recipe, add 1 1/2 teaspoons baking powder and 1/2 teaspoon salt. Cups Per PoundThere are 3 1/3 cups of flour per pound and about 16 2/3 cups per 5 pound bag.Nutrition FactsServing size: 1/4 cup (30g)Amount per servingCalories110As PackagedAmount per serving (Calories As Packaged): 110Nutrition FactsFood component / NutrientAmount, As Packaged% DVDaily Value*, As PackagedTotal Fat0g0%Saturated Fat0g0%Trans Fat0g—% Value not availableCholesterol0mg0%Sodium0mg0%Total Carbohydrate23g8%Dietary Fiber<1g3%Total Sugars0g—% Value not availableIncl. Added Sugars0g0%Protein3g—% Value not availableVitamin D0mcg0%Calcium0mg0%Iron1.5mg8%Potassium0mg0%Thiamin0.2mg15%Riboflavin0.1mg10%Niacin1.8mg10%Folate—Value not available20%Folic Acid45mcg—% Value not available*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.Ingredients, nutrition facts, and allergen statements can change. Always refer to the actual package for the most complete and accurate information.'''
