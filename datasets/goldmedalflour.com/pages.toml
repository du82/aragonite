["https://goldmedalflour.com/recipes/caramel-snickerdoodle-cake/846d915e-6965-4539-aae5-f00494cc5225"]
title = "Caramel Snickerdoodle Cake | Gold Medal Flour US"
description = "Gold Medal® Flour Recipe Contest 2010!"
full_description = "Caramel Snickerdoodle Cake 20 Minutes Prep2 Hours 40 Minutes Total 16 Servings340 Calories per ServingGold Medal® Flour Recipe Contest 2010!Ingredient List1 3/4 cups plus 2 tablespoons sugar2 teaspoons ground cinnamon2 1/2 cups Gold Medal™ all-purpose flour2 teaspoons baking soda1 teaspoon salt1 can (5 oz) evaporated milk1 cup sour cream1/2 cup butter or margarine, melted1 teaspoon vanilla2 eggs, beaten10 caramels, unwrappedPreparationHeat oven to 350°F. Grease 12-cup fluted tube cake pan with shortening. In small bowl, mix 2 tablespoons of the sugar and 1 teaspoon of the cinnamon. Sprinkle mixture over inside of pan, turning to evenly coat. Shake out any excess.In large bowl, mix remaining 1 3/4 cups sugar, remaining 1 teaspoon cinnamon, the flour, baking soda and salt. Reserve 1 tablespoon of the evaporated milk for the topping. Stir remaining evaporated milk, sour cream, melted butter, vanilla and eggs into dry ingredients until well blended. Pour batter in pan.Bake 40 to 50 minutes or until toothpick inserted in center comes out clean. Let stand 30 minutes; remove from pan. Cool completely, about 1 hour.In small microwavable bowl, melt caramels with reserved evaporated milk uncovered on High 1 to 2 minutes, stirring every 30 seconds, until caramels are melted and mixture is smooth. Drizzle over cooled cake.Nutrition InformationServings: 16Serving size: 1 ServingAmount per servingCalories340Amount per serving (Calories ): 340Nutrition FactsFood component / NutrientAmount% DVDaily Value*Total Fat11g17%Saturated Fat6g31%Trans Fat0g—% Value not availableCholesterol50mg17%Sodium420mg17%Total Carbohydrate54g18%Dietary Fiber0g0%Soluble Fiber0g—% Value not availableSugars33g—% Value not availableProtein4g—% Value not availableVitamin D—Value not available4%Vitamin E—Value not available0%Calcium—Value not available8%Iron—Value not available6%Potassium120mg3%Thiamin—Value not available10%Riboflavin—Value not available15%Niacin—Value not available6%Vitamin B6—Value not available2%Vitamin B12—Value not available4%Pantothenic Acid—Value not available4%Phosphorus—Value not available8%Magnesium—Value not available4%Zinc—Value not available2%Manganese—Value not available10%Selenium—Value not available15%Copper—Value not available0%*The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.ExchangesStarch 1&½, Fruit 0, Other Carbohydrate 2, Skim Milk 0, Low-Fat Milk 0, Milk 0, Vegetable 0, Very Lean Meat 0, Lean Meat 0, Medium-Fat Meat 0, High-Fat Meat 0, Fat 2, Fruits 0c, Vegetables 0c, Grains 1oz-eq, Meat & Beans 0oz-eq, Dairy 0c, Fats & Oils 2tspCarbohydrate ChoiceChoices per serving: 3&½Perfect for this RecipeGold Medal™ All Purpose Flour"
