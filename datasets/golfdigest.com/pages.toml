full_description = '''Golf Digest Logo Course Reviews The best courses you can play in Florida By Stephen Hennessey February 26, 2025 Save for later Florida golf gets a bad rap—it’s predominantly flat and uninteresting. Across 1,450-plus courses (including nine-holers), there are definitely some tired if not monotonous layouts. The courses on this list, though, belong in a separate category. We used the most recent evaluations from our current America’s 100 Greatest and Best in State rankings to determine the best courses you can play in Florida. We stopped this list at 30 courses but could’ve easily went to 50. There’s a reason Florida is the most popular destination for golfers residing in northern states—and not just because it has the most golf out of any state. There’s some damn good golf—you just have to know where to look. Scroll on for the complete list of the best courses you can play in Scottsdale. Be sure to click through to each individual course page for bonus photography and reviews from our course panelists. We also encourage you to leave your own ratings on the courses you’ve played … so you can make your case for why a course is worth playing or not. Dom Furore / Golf Digest false Public TPC Sawgrass: Stadium Ponte Vedra Beach, FL 4.6 23 Panelists 100 Greatest 100 Greatest Public Best In State TPC’s stadium concept was the idea of then-PGA Tour commissioner Deane Beman. The 1980 design was pure Pete Dye, who set out to test the world’s best golfers by mixing demands of distance with target golf. Most greens are ringed by random lumps, bumps and hollows, what Dye calls his "grenade attack architecture." His ultimate target hole is the heart-pounding sink-or-swim island green 17th, which offers no bailout, perhaps unfairly in windy Atlantic coast conditions. The 17th has spawned over a hundred imitation island greens in the past 40 years. To make the layout even more exciting during tournament play, Steve Wenzloff of PGA Tour Design Services recently remodeled several holes, most significantly the 12th, which is now a drivable par 4. View Course LC Lambrecht false Public Streamsong Resort: Red Bowling Green, FL 4.5 43 Panelists Second 100 Greatest 100 Greatest Public Best In State Coore and Crenshaw’s Red Course is part of a resort triple-header that gives golfers a rare opportunity to compare and contrast the differences in styles and philosophies of arguably the three of top design firms in America, including Streamsong Blue, a Tom Doak design, and Streamsong Black, from Gil Hanse and Jim Wagner. The Red, like the Blue, was built from sand spoils created by a massive phosphate strip mine, with some piles forming dunes reaching 75 feet into the air. But there was only room for 31 holes, so Coore and Crenshaw had to take a section of less desirable, stripped-down land and create five holes that looked like the rest of the site, Red's holes one through five. The course has a wonderful mix of bump-and-run links holes and target-like water holes. Some greens are perched like those at Pinehurst, others are massive with multi-levels like those at St. Andrews. The turf is firm and bouncy, and while the routing is sprawling, it’s easily walkable. The Red has consistently comes out on top in this survey, but the Blue and Black are within just about a point. View Course Laurence Lambrecht false Public Streamsong Resort: Blue Bowling Green, FL 4.5 48 Panelists Second 100 Greatest 100 Greatest Public Best In State Although congenial rivals, Tom Doak and Bill Coore actually collaborated on Streamsong’s original 36-hole routing, walking the site and mentally weaving holes around stunning mounds, lagoons, sand spits, savannahs and swamp, all elements left after a strip-mining operation. Coore then gave Doak first choice on which 18 he wanted to build, so Doak’s Blue Course includes a few holes routed by Coore. (Coore and Crenshaw’s Red, ranked No. 127, contains some holes originally envisioned by Doak.) The Blue starts a bit more dramatically, with the back tee on hole one atop a 75-foot sand dune. It has more water carries off the tee, and it’s also a bit more compact, since it sits in the center with the Red Course looping around its outside edges. The Blue definitely has the bolder set of greens, some with massive shelves and dips. The new addition of No. 178 Streamsong (Black) by Gil Hanse only adds to the spirited competition among designers. The theme song at Streamsong seems to be: “Anything You Can Do, I Can Do Better.” View Course LC Lambrecht false Public Streamsong Resort: Black Bowling Green, FL 4.5 28 Panelists Second 100 Greatest 100 Greatest Public Best In State Gil Hanse’s Black Course at Streamsong, Golf Digest’s Best New Public Course of 2018, sits a mile south of the resort’s Red and Blue Courses, with its own clubhouse and its own personality. Reshaped from a decades-old phosphate strip mine that lacking tall spoil mounds, Hanse provided strategic character by building a hidden punchbowl green at nine, dual putting surfaces at 13, incorporating a meandering creek on the par-5 fourth and a lagoon cove to guard the 18th green. Both the putting surfaces and the chipping areas surrounding them were grassed in MiniVerde, and today both are mowed at a single height, resulting in the biggest, most complex greens found on our national ranking. One Streamsong insider calls the Black greens “polarizing;” we call them tremendous fun. View Course Stephen Szurlej false Public Trump National Doral: Blue Monster Miami, FL 4.1 15 Panelists 100 Greatest Public Best In State The linchpin of the famous four-course complex previously known as Doral Golf Resort, the Blue Monster had hosted a PGA Tour event annually from 1962 to 2016. The fearsome layout was designed by Dick Wilson in 1962 and set the template for the modern south Florida course with lakes galore, deep bunkers and greenpads elevated above the fairways for drainage and aerial target golf. Several questionable renovations in the 1990s and early 2000s moved it away from the original Wilson look, and the design was lost for a period of time. Always intended to be a course presenting shot-making demands for good players, the Blue Monster was given added bite by Gil Hanse and Jim Wagner through the creation of new slopes and ridges on several holes and the excavation of new lakes on the par-3 15 and drivable par-4 16 to add more excitement to the finish. But they wisely left the legendary 18th nearly untouched. Why mess with history? The changes were completed shortly before the PGA Tour took the course out of its annual location. View Course false Private Arnold Palmer's Bay Hill Club & Lodge: Challenger/Champion Orlando, FL 4 22 Panelists Best In State From Golf Digest Architecture Editor emeritus Ron Whitten: I've always been fascinated by the design of Bay Hill, Arnold Palmer's home course for over 45 years (although Tiger Woods owns it, competitively-speaking, as he's won there eight times.) For one thing, it's rather hilly, a rarity in Florida (although not in the Orlando market) and dotted with sinkhole ponds incorporated in the design in dramatic ways. I always thought the wrap-around-a-lake par-5 sixth was Dick Wilson's version of Robert Trent Jones's decade-older 13th at The Dunes Club at Myrtle Beach. Each of the two rivals had claimed the other was always stealing his ideas. But the hole I like best at Bay Hill is the par-4 eighth, a lovely dogleg-right with a diagonal green perched above a small circular pond. Okay, I admit that it reminds me of the sixth at Hazeltine National, another Trent Jones product, but I don't think Wilson picked Trent's pocket on this one, as both courses were built about the same time, in the early 1960s. For our complete review, visit Bay Hill's Places to Play page here. View Course Trey Wren false Public The Park West Palm West Palm Beach, FL 4.4 29 Panelists In the current age of new elite private clubs and faraway destination resorts, the opening of a public municipal-affiliated golf course in an urban area is major news—especially when Tiger Woods shows up for the grand opening, like he did in March 2023. The Park is the latest in a growing trend of public/private partnerships that have fueled the redevelopment of numerous municipal courses around the country. The new course is set on the site of the former Dick Wilson-designed West Palm Beach Golf Course, one of the first notable designs of the post-World War II years when it opened in 1947 and long considered among the top municipal courses in the country. That course closed in 2018 due to deteriorating playability and diminished interest and sat fallow for several years. Several plans for different uses of the land were proposed before a group of local citizens, led in part by Seth Waugh, CEO of the PGA of America, raised $56 million in individual donations to re-imagine the property as a community gathering space with a number of amenities. Read Derek Duncan's full piece here. View Course More From Golf Digest Golf Digest Logo 10 hidden gems near bucket-list golf courses Jeff Marsh false Public Cabot Citrus Farms: Karoo Brooksville, FL 4.2 19 Panelists When arriving at Cabot Citrus Farms you’ll understand why Ben Cowan-Dewar sought this property for decades. A prehistoric ridge in Brookville, Fla., created rolling topography on sandy soil—a golf developer’s dream. In the early 1990s, World Woods opened with two acclaimed public courses and what was once the world’s largest driving range that hosted Tiger Woods commercial shoots. But playing conditions had deteriorated at World Woods. Its Pine Barrens course, once the 75th-best course in Golf Digest's ranking of America’s 100 Greatest Courses, quickly fell off that list in 2013. Cowan-Dewar inquired about the property with the previous owner, Japanese businessman Yukihisa Inoue, in 2014 and 2016, to no avail. Others also tried to buy it. Finally, as COVID-19 restricted travel, Cowan-Dewar chatted with Inoue through translators over Zoom and negotiated to purchase the property in 2021—giving his burgeoning Cabot resort and real estate empire its first U.S. offering. That decades-long courtship has now paid off with Cabot Citrus Farms’ Karoo course. Kyle Franz—known for his meticulous remodeling of North Carolina Sandhills courses such as Mid Pines, Pine Needles and Southern Pines—transformed the existing Pine Barrens course with Karoo, the first course to open. He reversed playing corridors in some cases, completely changing what was in the ground in many cases. View Course Courtesy of the resort false Private Innisbrook Resort: Copperhead Palm Harbor, FL 4.2 10 Panelists Best In State The Copperhead course is most famous for hosting the PGA Tour's Valspar Championship every April, but Innisbrook is home to three more championship courses—Island, North and South—with views more like the sand hills of the Carolinas than you might expect in Florida. The Copperhead course is a tough ball-striking challenge with tight, tree-lined fairways and a demanding three-hole finish—known as the Snake Pit—that often makes for dramatic finishes to the annual PGA Tour stop. View Course false Private PGA National Resort: Champion Palm Beach Gardens, FL 4 18 Panelists Best In State One of five courses at PGA National, the Champion Course hosts the Honda Classic every year. Originally designed by Tom and George Fazio for tournament play, Jack Nicklaus redesigned the course in 2014, creating the infamous three-hole stretch aptly named "The Bear Trap." Routinely one of the toughest courses on Tour, The Champion is a true ball-striking test. View Course false Private Hammock Beach Golf Resort & Spa: Ocean Course Palm Coast, FL 4.1 10 Panelists Best In State This scenic Jack Nicklaus-designed South Florida track has six holes that play along the Atlantic Ocean, with a challenging four-hole finishing stretch nicknamed “The Bear Claw.” The course, which hosted the 2003 U.S. Women's Amateur Public Links, is one of two at the resort and features a classic Nicklaus design: generous fairways and well-protected greens. View Course false Private The Gasparilla Inn & Club Boca Grande, FL 4.3 6 Panelists Best In State Open to members and guests of the resort, Gasparilla Golf Club rests on the picturesque coast of Charlotte Harbor. Though it perhaps lacks the overall ambiance and archtiecture, the proximity of the design to the water (five holes run directly along the harbor shore) and the exposure to the gusty winds puts Gasparilla in the same category of other Pete Dye seaside courses like Teeth of the Dog and The Ocean Course at Kiawah Island. Tripp Davis is currently renovating the course, hoping to imbue it with more vintage Dye-like features that have been worn away. View Course false Public Old Corkscrew Golf Club Estero, FL 3.9 13 Panelists Best In State Old Corkscrew, designed by Jack Nicklaus, is routed through the natural landscape of Southwest Florida (no homes!), serving as a habitat for dozens of exotic animals. The challenging layout plays among cypress trees, tall pines and wetlands, demanding accuracy over distance throughout. Though it's 30 minutes northeast of Naples, Old Corkscrew's absence of homes and tranquil setting make it unique in Southwest Florida—and well worth the drive. View Course More From Golf Digest Golf Digest Logo 5 sneaky-good buddies trip destinations, according to one longtime traveler Courtesy of the club false Private Hammock Beach Golf Resort & Spa: Conservatory Course Palm Coast, FL 3.9 12 Panelists Best In State Hammock Beach is a Golf Digest Editors' Choice award-winning resort in Florida and has two of the best public courses in Florida: The first being the Tom Watson-designed Conservatory course, which is more inland than the Jack Nicklaus-designed Ocean course. The Conservatory course is not your typical Florida resort course—its roccco architecture is infused with British links-style features including steep mounding throughout and boasts elaborate stone work, waterfalls, streams, marshes, deep pot bunkers, waste areas and wave-like greens. View Course Dave Sansom false Public Tiburon Golf Club: Gold Naples, FL 4.3 4 Panelists Best In State Of the public options sprinkled across Naples, Greg Norman's Tiburón courses at the Ritz-Carlton provide the best balance of quality golf and convenience, situated in the heart of North Naples. That ideal combination comes at a cost, though, as green fees can be upwards of $300. The Gold course—ranked on our Best Courses You Can Play in Florida list—features stacked sod wall bunkers and no conventional rough and is home to the LPGA’s CME Group Tour Championship and the PGA Tour’s QBE Shootout. View Course false Public The Ritz-Carlton Golf Club at Grande Lakes Orlando Orlando, FL 3.9 3 Panelists The Ritz-Carlton Carlton Golf Club at Grande Lakes is the annual host of the PNC Championship, where major champions team up with their sons and daughters in a relaxed end-of-the-year'''
