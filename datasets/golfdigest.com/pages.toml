["https://www.golfdigest.com/courses/guides/best-public-courses-california"]
title = "The best courses you can play in California | Golf Courses | Golf Digest"
description = "Our guide to the best golf courses you can play in California might prove the Golden State is the best state for golf"
full_description = '''Golf Digest Logo Public golf The best courses you can play in California By Drew Powell and Stephen Hennessey January 31, 2025 Save for later When looking at the best courses you can play in California, the top course—Pebble Beach—will hardly surprise, but with such a golf-rich state, all 35 courses in this guide are worth getting out to. The depth of great golf, both private and public, makes California one of the best golf states in the country. When figuring out which courses you should play on your next trip to California, location is an obvious limiting factor, considering the size of The Golden State. Not to worry, though, as there are great options on this list spread across the state. Be sure to use our map feature in this guide to find the best courses near wherever you are headed. Scroll on for the complete ranking of the best courses you can play in California, and be sure to click through to each individual course page for bonus photography and reviews from our course panelists. We also encourage you to leave your own ratings on the courses you’ve played … so you can make your case for why a course should be higher or lower on our rankings. More From Golf Digest Golf Digest Logo Our definitive ranking of the best states for public golf The best courses you can play in California Sherman Chu false Public Pebble Beach Golf Links Pebble Beach 4.7 43 Panelists 100 Greatest 100 Greatest Public Best In State Not just the greatest meeting of land and sea in American golf, but the most extensive one, too, with nine holes perched immediately above the crashing Pacific surf—the fourth through 10th plus the 17th and 18th. Pebble’s sixth through eighth are golf’s real Amen Corner, with a few Hail Marys thrown in over an ocean cove on the eighth from atop a 75-foot-high bluff. Pebble hosted a successful U.S. Amateur in 2018 and a sixth U.S. Open in 2019. Recent improvements include the redesign of the once-treacherous 14th green, and reshaping of the par-3 17th green, both planned by Arnold Palmer’s Design Company a few years back—and the current changes to the iconic eighth hole. Pebble Beach hosted the Women's U.S. Open for the first time in 2023. View Course Evan Schiller false Public Spyglass Hill Golf Course Pebble Beach 4.4 38 Panelists 100 Greatest 100 Greatest Public Best In State Given the task of designing a course just up the 17 Mile Drive from Pebble Beach and Cypress Point, Robert Trent Jones responded with a combination of Pine Valley and Augusta National. The five opening holes, in Pine Valley-like sand dunes, are an all-too-brief encounter with the Pacific seacoast. The remaining holes are a stern hike through hills covered with majestic Monterey pines (which, sad to say, may someday disappear to pitch canker, but are being replaced in some areas with cypress trees). Add several water hazards that hearken back to the 16th at Augusta (a hole which Trent Jones designed, by the way) and you have what some panelists consider to be Trent’s finest work. Others say it’s the best course never to have hosted a major event. After all, even Pine Valley and Cypress Point have hosted Walker Cups. View Course Evan Schiller false Public Pasatiempo Golf Club Santa Cruz 4.5 22 Panelists 100 Greatest 100 Greatest Public Best In State Pasatiempo is arguably Alister Mackenzie's favorite design. He lived along its sixth fairway during his last years. With its elaborate greens and spectacular bunkering fully restored by Tom Doak and now by Jim Urbina, it’s a prime example of Mackenzie's art. The five par 3s are daunting yet delightful, culminating with the 181-yard over-a-canyon 18th. The back nine is chock full of other great holes: 10, 11, 12 and 16 all play over barrancas. The storied course has hosted two USGA championships: the 1986 U.S. Women's Amateur and the 2004 U.S. Senior Women's Amateur. In 2014, Pasatiempo received a Golf Digest Green Star environmental award for its measures in dealing with drought. Today, water worries are in the past, in part because of a new storage tank that allows the club to capture and store recycled water. View Course false Public Torrey Pines Golf Course: South La Jolla 3.9 23 Panelists 100 Greatest Public Best In State Torrey Pines sits on one of the prettiest golf course sites in America, atop coastal bluffs north of San Diego with eye-dazzling views of the Pacific. Rees Jones’ remodeling of the South Course in the early 2000s not only made the course competitive for the 2008 U.S. Open (won by Tiger Woods in a playoff over Rocco Mediate), it also brought several coastal canyons into play for everyday play, especially on the par-3 third and par-4 14th. An annual PGA Tour stop, Torrey Pines received another boost by Jones prior to hosting its second U.S. Open in 2021, this one won by Jon Rahm. View Course Joey Terrill false Private CordeValle Golf Club San Martin 4.2 17 Panelists 100 Greatest Public Best In State Located in the little known but abundant golfing area south of San Jose, the gorgeous CordeValle was a private club when it first opened, but is a high-end resort destination these days, with climbing and descending soft hills dotted by gnarled oaks. It hosted both the U.S. Senior Women's Amateur and PGA Tour's Frys.com Open in 2013 and the U.S. Women's Open in 2016, won by Brittany Lang in a playoff against Anna Nordqvist. View Course More From Golf Digest Best in State The best golf courses in California Sherman Chu false Public The Links At Spanish Bay Pebble Beach 3.9 23 Panelists 100 Greatest Public Best In State The Links at Spanish Bay was the first true links course built in America in many decades, but it took years for conveyor belts to deposit sand atop exposed bed rock to return this mined-out sand quarry back to a linkland site. The trio of designers, playfully dubbed "The Holy Trinity," thoughtfully shaped an 18 that looks natural, plays strategically and is sensitive to the coastal wetland environment. View Course JFHenebry/Courtesy of the club false Public PGA West: Stadium Course La Quinta 4 28 Panelists 100 Greatest Public Best In State Originally private, the Stadium Course (the original 18 at PGA West) was among the rota of courses for the old Bob Hope Desert Classic until some pros, objecting to its difficulty, petitioned to remove it. (It’s now back.) It's Pete Dye at his rambunctious best, with a finish mimicking his later design at TPC Sawgrass: a gambling par-5 16th (called San Andreas Fault), a short par-3 17th to an island green and an intimidating par-4 18th with water all the way to the green. Though hideous in its difficulty and aesthetics by 1980s standards (it was can't miss television when it hosted the 1987 Skins Game), it's matured into a noble piece of architecture that represents the tail end of Dye's extreme middle phase. In 2024, Tim Liddy, a protégé of Dye, returned to PGA West to perform a restoration to return putting surfaces and bunker complexes to their original dimensions. View Course Joann Dost false Public Poppy Hills Golf Course Pebble Beach 3.9 19 Panelists 100 Greatest Public Best In State When originally built, Poppy Hills had unpopular perched greens framed by massive containment mounds. Following a 2013 remodeling by original designer Robert Trent Jones II and partner Bruce Charlton, it's now a graceful, low-profile layout. "We popped the hills at Poppy Hills," says Trent Jr. A new feature are sandy naturalized areas and pine straw off the fairways instead of manicured rough, part of a concerted effort to significantly reduce water consumption. The renovated course was on display at the 2018 U.S. Girls' Junior, won by current LPGA player Yealimi Noh. View Course Brian Oar/Courtesy of the club false Public Rams Hill Golf Club Borrego Springs 4.4 17 Panelists 100 Greatest Public Best In State Local residents revived this golf development within Anza Borrego Desert State Park, on the western edge of the Sonoran Desert about an hour from La Quinta, Calif., in the mid 2000s with an entirely new course built by Tom Fazio. Some of Fazio’s spacious holes are molded into the desert earth and others ride the up and down rocky elevations, leading to a finish that includes the short par-4 17th and gambler’s par-5 18th that streaks downhill around a water feature. View Course JD Cuban false Public Trump National Golf Club Los Angeles Rancho Palos Verdes 3.9 4 Panelists Best In State Just 30 minutes south of LAX, the Pete Dye design features Pacific Ocean views on every single hole. Built among the jagged cliffs of Palos Verdes Peninsula, Trump National Los Angeles is reportedly one of the most expensive courses constructed in the United States, as the Trump Golf folks claim it took $250 million to develop this scenic public golf experience. View Course false Public Pelican Hill Golf Club: Ocean North Newport Coast 4.1 18 Panelists Best In State This Tom Fazio-designed oceanside course provides stunning views of Catalina Island and Newport Beach. Set on slightly higher ground than its sister course (Ocean South), the North Course at Pelican Hill features sloping greens and several carries over canyons off the tee. View Course Mark Degnan false Public Torrey Pines Golf Course: North La Jolla 3.5 20 Panelists Best In State Redesigned by Tom Weiskopf in 2018, Torrey Pines' North course became friendlier for the average golfer. The number of bunkers were reduced from 60 to 42 and made easier to play out of. And the average green size was increased from 4,500 square feet to 6,000. Lastly, Weiskopf added one of his signatures: a short, drivable par 4 (the seventh)—making the companion course to the championship South course a little more fun. This may sound like a dumbing down of the architecture but it isn't. Within the simplification is a wide variety of green configurations and contours, with slopes rising and falling, some set high and others low, and many with more internal contour than is found on most greens on the South course, including the surfaces of the cross-ravine par-3 12th and par-3 15th. The North course also boasts ocean and canyon views on par with the South, particularly the par-4 16th rising along the Pacific Ocean cliffs and brining the player in the most direct contact with the stunning panorama. Perhaps because we feel there's a better couse hidden somewhere beneath the current South course, playing the North doesn't feel like a step down, just a step across to the other side of one the best public golf sites in the U.S. View Course false Public Rustic Canyon Golf Course Moorpark 4 21 Panelists Best In State Rustic Canyon earned the honor of Golf Digest's Most Affordable Public Course in 2002, and it has continued to generate attention as one of Southern California's best public options since. With wide, generous fairways routed through a seasonal stream bed in the foothills north of Los Angeles, this Gil Hanse, Jim Wagner and Geoff Shackelford design is a natural, minimalistic and strategic gem that should be on any list of the best in California. View Course Courtesy of the club false Private Stanford Golf Course Stanford 4.2 6 Panelists Best In State Home to the top-ranked Cardinal men’s and women’s golf teams, the Stanford Course is a par-70 George C. Thomas and Billy Bell Jr. design that dates to the early 1930s. Tiger Woods, Tom Watson, Michelle Wie, and many more famed Stanford alums developed their games at this sprawling layout that was ranked on our America's 100 Greatest list in the 1970s. Grand oak trees line the fairways and elevated tee boxes provide beautiful views of the surrounding mountain scenery, especially on the 18th tee, where you can see San Francisco in the distance. There is strong layout variety at Stanford, with holes moving in each direction and a mix of wide-open tee shots and others that are quite narrow. Though it's a pleasant walk with few houses on the course, it can be strenous given the elevation changes and distance between some holes. View Course More From Golf Digest Golf Digest Logo 10 hidden gems near bucket-list golf courses false Public Grizzly Ranch Golf Club Portola 4 13 Panelists Best In State Located in the Sierra Nevada foothills 50 miles northwest of Reno, Grizzly Ranch is getaway, escapist golf and a refreshing trek through nature. When given such serenity and untouched natural beauty, it’s important not to overcook the design. The late architect Bob Cupp didn’t. He layered the holes onto a basin of forest floor with minimal buildup, directing them easily up and down the tilted property and positioning the greensites in ways that mingle thoughtfully with creeks and dry washes. View Course false Public Maderas Golf Club Poway 3.9 18 Panelists Best In State Just minutes from downtown San Diego, this Johnny Miller and Robert Muir Graves design snakes through rolling foothills with an abundance of elevation changes. Maderas not only features a challenging, target-oriented layout, but it also stars over forty acres of native wildflowers. View Course false Public Pelican Hill Golf Club: Ocean South Newport Coast 4.3 15 Panelists Best In State The first of the two Tom Fazio designs at Pelican Hill, The Ocean South course opened in 1991 and boasts striking Pacific Ocean vistas. Wide fairways, large undulating greens and fantastic conditions make for an enjoyable round on this coastal track. View Course false Public The Course At Wente Vineyards Livermore 3.9 5 Panelists Best In State Tucked away in the native woodlands of Livermore Valley just 50 minutes east of San Francisco lies this beautiful Greg Norman design. Providing several striking panoramas of active vineyards, the Course at Wente Vineyards hosted the then-Nationwide Tour’s Livermore Valley Wine Country Championship from 2006 to 2008. View Course Dom Furore false Public TPC Harding Park San Francisco 3.9 14 Panelists Across the street from the Olympic Club is San Francisco's most famous muny, designed by the same architect, Willie Watson. Framed by eucalyptus, cypress and monterey pines, TPC Harding Park hosted a PGA Tour event in the 1950s and 1960s. And it hosted the 2020 PGA Championship, won by Collin Morikawa, after a significant renovation a couple years prior. The course also hosted the 2009 Presidents Cup, as well as the 1937 and 1956 U.S. Amateur Public Links. View Course Courtesy of the club false Public Tahoe Mountain Club: Old Greenwood Truckee 4 5 Panelists Old Greenwood is one of two 18-hole courses at Tahoe Mountain Club, and since 2020 the Jack Nicklaus signature design has hosted the PGA Tour’s modified stableford event, the Barracuda Championship. Winding through pine forests, meadows, and hilly terrain, Old Greenwood is both a challenging and aesthetically pleasing course. View Course false Public Aviara Golf Club Carlsbad 4 31 Panelists Aviara, part of an upscale Hyatt resort, has held the LPGA's JTBC Classic (formerly the Kia Classic) for the past nine years. The only Arnold Palmer design i'''
