gned to provide maximum forgiveness to inconsistent players with average to above-average swing speeds. New shape is sleeker than last year’s TSR2. Improved stability on off-center hits (an increase of 10 percent compared to the TSR2) provides meaningful distance gains. BUY NOW DETAILS 9 / 17 Titleist GT3 $330 | Golf Galaxy 5.0 GD SCORE GD HOT LIST SCORE Hot List Gold $330 More compact than the GT2 and last year's TSR3, the GT3 offers iron-like control for players looking for more ball speed than their lower-lofted irons. Because of a wider face, this year’s model boasts a 15 percent improvement in stability on off-center hits for more consistent carry yardages. Adjustable heel and toe weights in the sole control draw or fade trajectories and dial in the best energy transfer for where players tend to contact the face. BUY NOW DETAILS 10 / 17 Cleveland Halo XL $200 | Golf Galaxy 4.0 GD SCORE GD HOT LIST SCORE Hot List Silver $200 Built with long-distance problem-solving in mind, these oversized designs aim to help average golfers launch long shots higher from a variety of lies. Distance gets a boost from a thinner step design in the front part of the crown that gives, which enlarges the area of the face that flexes the most at impact. Three sole rails taper front to back to minimize the negative effects of steep swings and chunked shots and ease the way the head’s trailing edge moves through the turf. BUY NOW DETAILS 11 / 17 Cobra DS-Adapt $300 | Golf Galaxy 4.5 GD SCORE GD HOT LIST SCORE Hot List Gold $300 With a focus on forgiveness, this model is the highest launching of Cobra’s hybrids and features a larger head size than the King Tec. A bridge-like structure inside the front of the head attaches to internal heel and toe weight pads to push the center of gravity low and forward for better energy transfer. That structure also yields extra stability on off-center hits. BUY NOW DETAILS 12 / 17 Cobra King Tec $320 | Golf Galaxy 4.5 GD SCORE GD HOT LIST SCORE Hot List Gold $320 Cobra’s most advanced hybrid uses multiple materials and adjustability to optimize distance and trajectory. The L-shaped face insert wraps around the leading edge and into the sole to maximize rebound, particularly on lower-face impacts. The face is also designed with variable thicknesses across 15 distinct regions for more consistent speed across the face. BUY NOW DETAILS 13 / 17 Mizuno ST-Max 230 $160 | Golf Galaxy 4.0 GD SCORE GD HOT LIST SCORE Hot List Silver $160 The oversized profile makes for Mizuno’s most forgiving and highest-launching hybrid. A wide channel stretches nearly the width of the sole to give at impact and create additional face flex on off-center hits. A polymer filling in the cut-through channel in the sole encases a steel bar to lower the center of gravity for reduced spin and a higher flight. BUY NOW DETAILS 14 / 17 Mizuno ST-Z 230 $160 | Golf Galaxy 4.0 GD SCORE GD HOT LIST SCORE Hot List Silver $160 Although larger and more playable than last year’s CLK, the conventional ST-Z provides a flatter, lower-launching trajectory compared to the ST-Max. This more traditionally sized hybrid (the 2-hybrid volume is 121 cubic centimeters) decreases in size as the loft increases (the 5-hybrid is just 103cc). The adjustable hosel provides lofts from 14 to 27 degrees. BUY NOW DETAILS 15 / 17 Ping G440 $325 | Golf Galaxy 5.0 GD SCORE GD HOT LIST SCORE Hot List Gold $325 A faster face and a range of adjustable lofts make these hybrids among the most versatile in the game. Ping lowered the face height by 8 percent and made it thinner. This encourages center-face contact for a higher launch and more ball speed. A redesigned interior section of the hosel removes mass that helps to lower the center of gravity by 12 percent for higher launch and less spin. BUY NOW DETAILS 16 / 17 PXG 0311 Black Ops $300 | Golf Galaxy 4.0 GD SCORE GD HOT LIST SCORE Hot List Silver $300 With three movable sole weights, an eight-way adjustable hosel and six lofts that 