["http://golly.sourceforge.net/Help/Algorithms/Larger_than_Life.html"]
title = "Golly Help: Larger than Life"
full_description = "Larger than Life (LtL) is a family of cellular automata rules that generalize John Conway's Game of Life to large neighborhoods and general birth and survival thresholds. Rr - specifies the neighborhood range (r is from 1 to 500, except for Triangular where r is from 1 to 250 and Gaussian where r is from 1 to 50). Cc - specifies the number of states (c is from 0 to 256). Mm - specifies if the middle cell is included in the neighborhood count (m is 0 or 1). Ssmin..smax - specifies the count limits for a state 1 cell to survive. Bbmin..bmax - specifies the count limits for a dead cell to become a birth. Nn - specifies the extended neighborhood type. Square grid: TypeDiagramTypeDiagramTypeDiagram Moore(NM) von Neumann (NN) Circular (NC) L2/Euclidean(N2) Checkerboard (NB) Aligned Checkerboard (ND) Cross(N+) Saltire (NX) Star (N*) Hash(N#) Use hexgrid.lua or showinviewer.lua to view Hexagonal, Asterisk or Tripod neighborhoods on a hexagonal grid. Weighted allows you to specify a weight for each cell in the neighborhood. The neighbor count will be the sum of each alive cell's neighborhood position weight. Weights from -127 to 127 are supported. Following the neighborhood weights you can optionally specify state weights. In this case the neighbor count will be the sum of each live cell's neighborhood position weight multiplied by its state weight. To specify state weights, add a comma after the NW neighborhood specification and then one hex digit per state. You must specify the same number of state weights as states in the pattern defined by the Cc parameter. Finally, if you want a non-square grid you can add a suffix to the rule string of H for hexagonal grid or L for triangular grid. Triangular grid will cause weightings to be treated as a triangular neighborhood and flip vertically on alternating cells. You can specify a custom neighborhood using N@ and then hexadecimal digits. There are two ways to create the hexadecimal digits: The easiest is to draw the custom neighborhood in Golly as a set of live cells. Surround the cells in a square selection and then run create-custom-ltl.lua to automatically create the rule string."
year_published = 2025
clearnet = "http://golly.sourceforge.net/Help/Algorithms/Larger_than_Life.html"
