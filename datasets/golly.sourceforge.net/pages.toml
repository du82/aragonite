title = "Golly Help: Hints and Tips"
full_description = "Golly Golly.exe (Golly.app on Mac, golly on Linux) Help Patterns Rules Scripts My-downloads (contains all your downloaded files; set in Preferences > File) My-patterns (contains all your pattern files) My-rules (contains all your .rule files; set in Preferences > Control) My-scripts (contains all your .lua/.py files) If necessary, use File > Set File Folder and select the Golly folder. Now all your folders (and the supplied folders) are visible in the file panel, so with just a few clicks you can load any pattern, run any script, or switch to any .rule file. You can also right-click (or control-click) on any of those files to open them in your preferred text editor. When upgrading to a new version of Golly, Mac users can simply drag all the distributed files and folders into their Golly folder and the old versions will be replaced. On Windows and Linux you'll need to delete the old Help, Patterns, Rules and Scripts folders before dragging in the new folders to avoid ending up with merged versions."
