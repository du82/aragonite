title = "Golly Help: Credits"
full_description = "First and foremost, a big thanks to John Conway for creating the Game of Life, and to Martin Gardner for popularizing the topic in his Scientific American column. Tom Rokicki wrote most of the complicated stuff. Golly is essentially the merging of two of Tom's programs (hlife and qlife). The HashLife algorithm is based on an idea by Bill Gosper. The QuickLife algorithm uses some ideas from Alan Hensel. David Eppstein provided the idea on how to emulate B0 rules. The speed of the Larger than Life algorithm is mainly due to some clever ideas from Adam P. Goucher and Dean Hickerson. Andrew Trevorrow wrote the cross-platform GUI code using wxWidgets. Much thanks to Julian Smart, Vadim Zeitlin, Stefan Csomor and all the other wxWidgets developers. Golly's scripting capabilities are thanks to the generosity and efforts of Eugene Langvagen (author of PLife), Guido van Rossum (creator of Python), and Roberto Ierusalimschy and all the other Lua developers. Golly uses the cute_sound library from the cute_headers project to play sounds, so much thanks to Randy Gaul. Tim Hutton wrote the RuleTable algorithm (now merged into the RuleLoader algorithm) and created the excellent Rule Table Repository. Chris Rowett wrote the Super algorithm and added support for many new rule types in the other algorithms. Chris has also made significant contributions to the overlay and the rendering code. Various code and documentation improvements have been contributed by Dave Greene, Jason Summers, Maks Verver, Robert Munafo and Brenton Bostick. Thanks to all the bug hunters for their reports and suggestions, especially Dave Greene, Gabriel Nivasch, Dean Hickerson, Brice Due, David Eppstein, Tony Smith, Alan Hensel, Dennis Langdeau, Bill Gosper, Mark Jeronimus, Eric Goldstein and Arie Paap. Dave Greene and Alan Hensel helped put together the pattern collection. Thanks to everybody who allowed us to distribute their fantastic patterns, especially Nick Gotts, Gabriel Nivasch, David Eppstein, Jason Summers, Stephen Morley, Dean Hickerson, Brice Due, William R. Buckley, David Moore, Mark Owen, Tim Hutton, Renato Nobili, Adam P. Goucher, David Bell and Kenichi Morita."
