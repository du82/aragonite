["https://golly.sourceforge.net/Help/overlay.html"]
title = "Golly Help: Overlay"
full_description = '''The overlay is a rectangular region of pixels that can be displayed above the current layer. Lua scripts have total control of what the overlay looks like and how the user interacts with it. The Scripts/Lua folder supplied with Golly has a number of scripts that illustrate how the overlay can be used: To study how these scripts work, control-click or right-click on one of the above links to open the script in your preferred text editor, then run the script by clicking on the same link. The first, overlay, takes a single string parameter that contains an overlay command followed by zero or more arguments separated by spaces. Some overlay commands can also return a single string as their result. The second, ovtable, takes a single table parameter rather than a string and only supports a subset of the overlay commands. It is typically faster to use ovtable than overlay. The supported ovtable commands that return a result are get, which returns individual values, and rgba, which returns a table. In all other ways ovtable is identical to the overlay command. All of the drawing commands use the current render target. This is initially the overlay but can be changed to a clip with the target command. Alpha blending is a way of drawing translucent pixels on top of existing pixels to get nicer looking results. When an overlay is created, alpha blending is initially turned off. To turn it on a script needs to call "blend 1", for blending with any target, or "blend 2", for faster blending when you know the target pixels are opaque. Consider this simple script which draws a translucent blue square on top of a translucent red square (both on top of an opaque white background): The left image shows the resulting overlay. The right image shows the overlay produced by the same script but with the "blend 1" line removed (the grid lines are from the layer underneath the overlay). Note that drawing with alpha blending on is significantly slower than drawing with it off, so it's a good idea to only turn it on when necessary. The overlay commands that can do alpha blending are: ellipse, fill, flood, line, lines, load, paste, scale, set.'''
