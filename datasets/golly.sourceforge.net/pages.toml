["http://golly.sourceforge.net/Help/Algorithms/HashLife.html"]
title = "Golly Help: HashLife"
full_description = "HashLife uses Bill Gosper's hashlife algorithm to achieve remarkable speeds when generating patterns that have a lot of regularity in time and/or space. HashLife supports the same set of rules as QuickLife, but with one exception: if a rule contains B0 it must also contain S8 (or S6 if the rule ends with H, or S4 if it ends with V). Note that HashLife performs very poorly on highly chaotic patterns, so in those cases you are better off switching to QuickLife."
