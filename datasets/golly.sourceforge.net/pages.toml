["http://golly.sourceforge.net/Help/python.html"]
title = "Golly Help: Python Scripting"
full_description = "NOTE: From this version, Golly will require a Python 3.x (64-bit) installation. Mac users should note that Apple have said they will not be including any version of Python in future releases of the Mac OS, so you will also need to download a Python 3.x installer from this release. Before you can run a .py script, Python 3.3+ needs to be installed on your system. Users can download a recent Python 3 installer from www.python.org/download. WARNING: Golly requires a 64-bit Python. From version 4.0, on all platforms, the Python library is loaded at runtime (the first time you try to run a script). Golly initially attempts to load a particular version of the Python library: python39.dll on Windows or libpython39.so on Linux. The numbers correspond to Python version 3.9. If that library can't be found then you'll be prompted to enter a different library name matching the version of Python 3.x installed on your system. A successfully loaded library is remembered (in your GollyPrefs file) so you won't get the prompt again unless you remove Python or install a new version. If Python isn't installed then you'll have to hit Cancel and you won't be able to run any .py scripts. To run one of these scripts, tick the Show Files item in the File menu, open the Scripts/Python folder and then simply click on the script's name. You can also select one of the Run items in the File menu. For a frequently used script you might like to assign a keyboard shortcut to run it (see Preferences > Keyboard). When Golly starts up it looks for a script called golly-start.py in the same directory as the Golly application and then in a user-specific data directory (see the getdir command for the likely path on your system). If the script is found then it is automatically executed. There are a number of ways to abort a running script. Hit the escape key, or click on the stop button in the tool bar, or select the Stop item in the Control menu. This section describes all the commands that can be used in a script after importing the golly module. The examples below assume you've done the import by including this line:"
