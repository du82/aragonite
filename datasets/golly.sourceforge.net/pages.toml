["https://golly.sourceforge.net/Help/edit.html"]
title = "Golly Help: Edit Menu"
full_description = "Lets you undo one or more recent changes, including all editing changes and generating changes, as well as changes to the selection, rule, hashing state and layer name. The number of changes you can undo is limited only by available memory and disk space. Multiple changes made by a script are treated like a single change and will be undone all at once. Each layer maintains its own undo/redo history (but cloned layers share the same undo/redo history). The current layer's undo/redo history is automatically cleared after creating a new pattern or opening a pattern file. Lets you redo one or more recently undone changes. Note that the redo history is automatically cleared after you make a new change; i.e., if you do something like rotate the current selection, undo the rotation, then edit some cells or change the selection, you can no longer redo the rotation. If ticked then the Undo and Redo items are disabled, and any existing undo/redo history for the current layer is cleared. When editing or generating a very large pattern you may want to temporarily disable undo/redo to speed up some operations. But be careful using this feature — if you switch to another layer when this item is ticked then that layer's undo/redo history is also cleared. Copies the pattern in the current selection to the clipboard (in RLE format) and then kills all cells in the selection. Kills all cells outside the current selection. This is often the quickest way to delete escaping gliders. Pastes a pattern stored in the clipboard into the existing pattern. After selecting this item you'll be asked to click where you want the paste to occur. Before clicking you can use keyboard shortcuts to scroll, change scale, etc. The keyboard shortcuts normally used to flip/rotate the selection will instead modify the paste pattern. You can also type shift-M to change the paste mode or shift-L to change the paste location (see below). To cancel the paste, just click anywhere outside the view area or hit the escape key."
year_published = 2025
clearnet = "https://golly.sourceforge.net/Help/edit.html"
