["https://golly.sourceforge.net"]
title = "Golly Game of Life Home Page"
full_description = "In memory of John Horton Conway, 1937-2020. Golly is an open source, cross-platform application for exploring Conway's Game of Life and many other types of cellular automata. The primary authors are Andrew Trevorrow and Tom Rokicki, with code contributions by Chris Rowett, Tim Hutton, Dave Greene, Jason Summers, Maks Verver, Robert Munafo, Brenton Bostick and Dongook Lee. NEWS: January 2025: Golly 1.5 for Android is available from the Google Play Store. September 2024: Golly 1.5 for the iPad is available from the App Store. July 2024: Golly 1.4 for Android is available from the Google Play Store. May 2024: Golly 4.3 for Windows/Mac/Linux has been released (see the changes). May 2024: Uploaded the web version of Golly 4.3. Golly's key features: Supports bounded and unbounded universes, with cells of up to 256 states. Supports multiple algorithms, including Bill Gosper's super fast hashlife algorithm. Many different types of CA are included: John von Neumann's 29-state CA, Wolfram's 1D rules, WireWorld, Generations, Paterson's Worms, Larger than Life, etc. Supports Busy Boxes and other 3D CA rules. The RuleLoader algorithm lets you plug in new rules. Responsive even while generating or garbage collecting. Reads RLE, macrocell, Life 1.05/1.06, dblife, and MCell files. Can also read common graphic formats: BMP, PNG, GIF, TIFF. Can extract patterns, rules and scripts from zip files. Can download patterns, rules and scripts from online archives. Includes a state-of-the-art pattern collection. Can paste in patterns from the clipboard. Unlimited undo/redo. Configurable keyboard shortcuts. Auto fit option keeps patterns sized to the window. Full screen option (no menu/status/tool/scroll bars). Supports multiple layers, including cloned layers. HTML-based help with an integrated Life Lexicon. Can play sounds (wav/ogg files). Scriptable via Lua (statically embedded 5.4.4) or Python (3.3+). Runs on Windows (7+), macOS (10.11+) and Linux (with GTK+ 2.x). Download a source or binary distribution. Monitor our progress at SourceForge. View the online help. Click to enlarge these screen shots: overlay-demo.lua [Windows] 3D.lua [Mac] hexgrid.lua [Linux] Langton's Loops [Windows] Larger than Life [Mac] Prime calculator [Linux] Cloned layers [Windows] Stacked layers [Mac] Meta galaxy [Linux] Prefs dialog [Windows] Prefs dialog [Mac] Prefs dialog [Linux]"
