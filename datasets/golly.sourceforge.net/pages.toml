["http://golly.sourceforge.net/Help/Algorithms/Super.html"]
title = "Golly Help: Super"
full_description = '''Super supports the same set of rules as QuickLife (excluding Wolfram) and adds history and label states. The Super algorithm currently supports three rulename suffixes, History, Super and Investigator. A rule specific to Conway's Life, "LifeHistory", was added along with Golly 2.0, as soon as multistate rules were supported. It largely duplicated the functionality of a "HistoricalLife" rule included in a previous CA editor, MCell 4.20. A key idea also borrowed from MCell is that odd-numbered states are ON states and even-numbered states are OFF states. Any odd-numbered state in the vicinity of a cell counts as a neighbor, but any even-numbered state is just considered to be background. The Super algo extends the behavior of the seven LifeHistory states to any non-Wolfram rule supported by QuickLife. To enable it, add the suffix "History" to the standard rule string. The primary idea was to make the evolutionary history of a pattern visible by including additional OFF states to the rule. A state-0 cell would change to state 1 as usual when it had three neighbors, but when a state-1 cell died, it would change to a blue state-2 cell. The blue region is commonly known as the "history" or the "reaction envelope" of a pattern. It can be very useful for editing purposes. For example, in LifeHistory, one phase of an oscillator can be pasted directly on top of another phase, and cells all that should be OFF in the new phase are all turned off (replaced by blue state-2 cells). A similar phase change in a two-state rule would generally require blanking out the oscillator's rotor cells before pasting; otherwise ON cells from both phases would remain ON, usually breaking the oscillator. Another use of blue state-2 cells is to mark the edge of the "safe region" for oscillators, Herschel circuitry, etc., making it much easier to adjust subpatterns so that they are as close as possible to each other without conflicting. In logic circuitry, input and output glider or spaceship lanes can be easily seen and aligned between components.'''
year_published = 2025
clearnet = "http://golly.sourceforge.net/Help/Algorithms/Super.html"
