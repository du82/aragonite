["http://golly.sourceforge.net/Help/Algorithms/RuleLoader.html"]
title = "Golly Help: RuleLoader"
full_description = '''The RuleLoader algorithm allows rules to be specified in external files. Given the rule string "Foo", RuleLoader will search for a file called Foo.rule. It looks for the file in your rules folder first, then in the supplied Rules folder. The format of a .rule file is described here. A number of examples can be found in the Rules folder: B3/S23 Conway's Life. This is the default rule for the RuleLoader algorithm and is built in (there is no corresponding .rule file). You can also specify Life (Life.rule is in the Rules folder). Banks-I, Banks-II, Banks-III, Banks-IV In 1971, Edwin Roger Banks (a student of Ed Fredkin) made simpler versions of Codd's 1968 CA, using only two states in some cases. These four rules are found in his PhD thesis. To see the rules in action, open Banks-I-demo.rle and the other examples in Patterns/Self-Rep/Banks/. BBM-Margolus-emulated Ed Fredkin's Billiard Ball Model, using the Margolus neighborhood to implement a simple reversible physics of bouncing balls. In this implementation we are emulating the system using a Moore-neighborhood CA with extra states. Open BBM.rle to see the rule in action. Byl-Loop A six state 5-neighborhood CA that supports small self-replicating loops. To see the rule in action, open Byl-Loop.rle. Chou-Reggia-1 and Chou-Reggia-2 Two 5-neighborhood CA that supports tiny self-replicating loops. To see the rules in action, open Chou-Reggia-Loop-1.rle and Chou-Reggia-Loop-2.rle. Codd In 1968, Edgar F. Codd (who would later invent the relational database) made a simpler version of von Neumann's 29-state CA, using just 8 states. To see the rule in action, open repeater-emitter-demo.rle and the other examples in Patterns/Self-Rep/Codd/. Codd2 A very minor extension of Codd's transition table, to allow for some sheathing cases that were found with large patterns. See sheathing-problems.rle for a demonstration of the problem cases. CrittersMargolus_emulated The Critters rule is reversible and has Life-like gliders. See CrittersCircle.rle.'''
